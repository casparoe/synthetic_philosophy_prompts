prompt: |-
  I work in compliance for a mid-sized company — I read contracts and internal policies for a living, so I spend alot of my day arguing about what sentences mean — and there's a pattern I've never had a word for. I've asked two lawyers about it and they both said some version of that's just interpretation, which I definately don't think is the whole story.

  It goes like this. A rule, read strictly, produces a result nobody could have wanted. Our building rules say no vehicles on the boardwalk, bicycles excepted. Taken literally, a bike is fine and the maintenance cart and the ambulance are not. So somebody sensible says, obviously they didn't mean that, they meant no motor vehicles, and from then on we all apply no motor vehicles. That's the first move. The second move is the one I actually care about. Five years later, no motor vehicles isn't a correction anymore, it's the rule. New hires are trained on it. Someone who points at the actual sheet gets told that's obviously what it means and it's always been that way. And the old words are still sitting there on the sheet, so when we finally do want to change the rule we have to amend a sentence that nobody is really applying, and we end up writing the correction into the text, which makes the text longer and less like what anyone meant.

  Same thing with our expense policy. Receipts required over $25 — except that in practice airfare always needed one at any amount. By the time I got here that exception was just what the policy said, and when it was rewritten last year the exception went in as though it had always been there.

  So two questions, and I'd rather have the carving than the label. First: is there a name for the first move — reading a text as saying something it doesn't quite say, because the literal reading is intolerable? I assume there's a family of ideas around that, so tell me which ones and which fits. Second: is there a name for the second move, where the repair stops looking like a repair, gets quoted as the text, and then becomes the baseline that the next repair has to work around? Is that just what precedent is for, or is it a different thing? Is it related to whatever it is when a contract gets corrected to match what the parties actually agreed — which I gather is treated as seperate from interpreting it? Or does the second move have no name at all, in which case give it one, and tell me where its edges are.

  Concretely, I want to know: at what point does a hardened repair stop being a repair and become the real meaning, if ever? What separates a correction that has earned its place from one that's just been repeated for long enough that nobody remembers making it? And does this change the argument between my colleagues who say you go by the words and the ones who say you go by what the thing was for — because if the words have been quietly absorbing purposes for a century, I'm not sure the two camps are even pointing at different objects.
reasoning: |-
  Okay, this user works in compliance and deals with interpreting contracts and policies daily. They've noticed a pattern where a strict interpretation leads to an absurd result, so people adjust it sensibly. Over time, that adjustment becomes the new norm, even though the original text remains unchanged. They want to know if there's a name for these two moves and how the transition from correction to established rule works.

  First, I need to identify the first move: interpreting a rule against its literal wording because the literal reading is unworkable. That sounds like the doctrine of absurdity in legal interpretation. It's a common principle where courts avoid interpretations that lead to irrational outcomes. I should also mention purposivism here, as it focuses on the intent behind the rule rather than the strict wording. Equitable interpretation might be relevant too, especially if fairness is a factor. The user mentioned examples like the bicycle exception and ambulances, which clearly show absurdity avoidance. 

  Next, the second move is where the corrected interpretation becomes entrenched over time. The user describes new hires being trained on this corrected version, and the original text becomes almost irrelevant. This seems like a blend of customary interpretation and institutional practice. Customary interpretation refers to how a rule is consistently applied in practice, which then gains authority. Institutional practice involves the organization's operational norms becoming the de facto rule. Desuetude is another angle—where disuse of the original text makes the practice the new standard. The hardening process is key here; the correction solidifies through repetition and becomes the baseline for future amendments. 

  The user's deeper questions are about when a correction becomes the real meaning and how this affects the debate between textualism and purposivism. They’re hinting that the original text might be irrelevant once practice takes over. The tipping points include duration of consistent application, reliance by stakeholders, integration into training, and irrelevance of the original text. In legal terms, this could relate to waiver or estoppel if parties act contrary to the written terms. But in policy contexts, it's more about organizational behavior than legal doctrine. 

  The user’s colleagues are split between following the words versus the purpose. But if the words have been functionally amended by practice, then textualists might be adhering to a version that no longer exists in practice. This challenges the dichotomy because the "text" isn't static—it evolves through application. The user might need frameworks to argue that the practice has modified the rule, making the original text obsolete. They're looking for leverage in compliance discussions, so terms like "desuetude" or "customary interpretation" could empower their arguments. 

  I should also consider if there’s a specific term for the transition from correction to rule. "Normative sedimentation" isn't standard, but it captures the layers building up over time. The edges of this concept involve whether the practice is documented, challenged, or if the original text is still invoked. The key is recognizing when practice has supplanted the text, which depends on institutional acceptance and functional replacement. 

  In conclusion, the first move is well-documented in legal theory (absurdity doctrine), while the second is a sociological process within organizations. The user’s insight reveals how texts become living documents shaped by use, which complicates strict textualism. Providing these terms and frameworks should help them articulate these patterns and navigate internal debates more effectively.
answer: |-
  Here's a carving of the phenomenon you're observing, focusing on the mechanisms and boundaries rather than just labels:

  **First Move: Corrective Interpretation (The Initial Repair)**
  *   **What it is:** Interpreting a text contrary to its literal meaning to avoid an outcome universally recognized as absurd, unreasonable, or contrary to the rule's fundamental purpose.
  *   **The Family of Ideas & Best Fit:**
      *   **Doctrine of Absurdity:** The core legal principle. Courts explicitly reject literal interpretations leading to "absurd," "unreasonable," or "unworkable" results inconsistent with the overall purpose. *This is the most precise fit.*
      *   **Purposivism:** Interpreting based on the rule's underlying purpose or intent, even if it requires departing from the plain meaning. The absurd outcome reveals a flaw in a purely literal reading.
      *   **Equitable Interpretation:** Interpreting to achieve a fair and just result, particularly where literal application would be harsh or inequitable.
      *   **Contextual Interpretation:** Reading the words in light of their broader context (purpose, other rules, practical realities). The absurdity highlights a contextual mismatch.
  *   **Why "Interpretation" isn't sufficient:** While technically interpretation, this move involves an *acknowledged departure* from the literal text driven by an *objective standard* (intolerable absurdity/practical unworkability), not just subjective preference. It's a *corrective* act to salvage the rule's intended function.

  **Second Move: Normative Sedimentation / Customary Interpretation (The Hardening Repair)**
  *   **What it is:** The process where the initial corrective interpretation, through consistent application, organizational practice, training, and repetition, loses its character as a "repair" and becomes the *de facto* rule itself. The original text becomes functionally obsolete or misleading, even if physically present.
  *   **Is it Precedent?** It's *analogous* but distinct.
      *   **Legal Precedent (Stare Decisis):** Binds future decisions based on past judicial rulings. Formal and hierarchical.
      *   **Organizational Precedent/Practice:** Relies on consistent internal application and institutional memory, creating *expectations* and *operational norms*. Less formal, more sociological. It's "precedent" in the sense of *established practice*, not necessarily binding legal doctrine.
  *   **Is it Correction to Match Agreement (Reformation)?** No. Reformation (in contract law) is a formal equitable remedy to *rewrite* the contract if it fails to reflect the parties' *actual, provable agreement* due to mutual mistake or fraud. Your phenomenon is about *interpreting and applying* an existing text in a way that diverges from its words *over time through practice*, not proving an initial mistake requiring judicial correction.
  *   **Key Concepts & Mechanisms of Sedimentation:**
      *   **Customary Interpretation:** The consistent way the rule *is actually applied and understood* within the organization becomes its effective meaning, regardless of the text. This custom gains normative force.
      *   **Institutional Practice/Operational Norm:** The "way we do things" solidifies into the expected standard. New hires learn the *practice*, not the text.
      *   **Reliance & Expectations:** Stakeholders (employees, departments) rely on and expect the consistent application of the *practice*. Changing back to the literal text would disrupt settled expectations.
      *   **Desuetude (Partial):** While full desuetude means a law falls into disuse and is unenforceable, here the *original literal meaning* falls into disuse. The *rule* (in its corrected form) remains very much in use.
      *   **Hysteresis:** The phenomenon where the state of a system depends on its history. The current "meaning" depends on the path taken (the initial correction and its reinforcement).
  *   **The "Hardening" Process:** The correction transitions from "what we *must* do to avoid absurdity" to "what the rule *is* and *always has meant*" through:
      *   **Duration & Consistency:** Long-standing, unwavering application.
      *   **Institutionalization:** Inclusion in training manuals, FAQs, internal memos, software logic.
      *   **Loss of Origin Story:** The reason for the initial correction (the absurdity) is forgotten; only the current practice remains.
      *   **Functional Replacement:** The practice solves the problem the rule was meant to address, making the literal text irrelevant to daily operations.

  **Answering Your Concrete Questions:**

  1.  **When does a hardened repair become the "real meaning"?** It becomes the *real meaning within the organizational context* when the *customary interpretation/practice* meets these criteria:
      *   **Long-Standing & Consistent:** Applied uniformly over a significant period.
      *   **Institutional Recognition:** Formally or informally taught, documented in internal guidance (even if not the "official" text), relied upon in audits or decision-making.
      *   **Reliance:** Parties materially rely on the practice (e.g., submitting expenses without receipts under $25 *except* airfare).
      *   **Original Text Dysfunction:** The literal text is functionally irrelevant to operations; referencing it causes confusion or is seen as pedantic or "not how we do things."
      *   **Lack of Challenge:** No successful internal or external challenge enforcing the literal text against the practice.
      *   **It may NEVER become the "legal" meaning** if challenged in court based *solely* on the written text, absent doctrines like waiver, estoppel, or specific evidence of mutual understanding. But *within the organization*, it *is* the operational reality and the baseline for future amendments.

  2.  **What separates an earned correction from mere repetition?** The key factors are **Reliance, Institutionalization, and Functional Supersession**.
      *   **Mere Repetition:** A pattern of ignoring the rule without a coherent, consistently applied alternative interpretation becoming embedded in training and expectations. It's just non-compliance.
      *   **Earned Correction (Sedimentation):** The *corrective interpretation itself* has become the *consistent, relied-upon, institutionalized standard*. The repetition isn't of the *violation*, but of the *newly established norm*. The original text is effectively superseded in practice by a coherent alternative.

  3.  **How does this change the textualist vs. purposivist argument?** It **fundamentally undermines the textualist position in an organizational context** and reveals a false dichotomy:
      *   **The Text Isn't Static:** The "words" the textualist points to are frozen in time, but their *functional meaning within the living organization* has evolved through practice (sedimentation). The text the textualist venerates is often already a dead letter.
      *   **Purpose is Embedded in Practice:** The "purpose" the purposivist seeks isn't just an abstract original intent; it's concretely manifested and *refined* in the settled practice that has developed to avoid absurdity and make the rule work. The hardened repair *is* the organization's practical understanding of the purpose.
      *   **The Real Object is the Operational Norm:** Both camps are often arguing about a phantom. The textualist argues for words that no longer control behavior. The purposivist argues for an intent that has been shaped by decades of operational reality. The *real* rule governing conduct is the *sedimented practice*. The debate needs to shift to whether the *current practice* is legitimate, effective, and should be codified, or if a return to the literal text (or a new rule) is warranted. The historical text becomes merely evidence, not the sole authority.

  **In essence:** You've identified the lifecycle of organizational rules. They start as text. Literal absurdities trigger **Corrective Interpretation (Doctrine of Absurdity)**. Through **Normative Sedimentation (Customary Interpretation/Institutional Practice)**, the correction hardens into the *de facto* rule, making the original text functionally obsolete. This process exposes that the true "rule" within an organization is often the settled practice, rendering strict textualism vs. purposivism debates about the original document somewhat academic in the face of operational reality. The challenge becomes managing that sedimentation process explicitly.
