  Key points from their request: they want defeaters sorted by decisiveness, particularly value cases where metaphysics affects practical outcomes, or exposures of deflationist self-undermining. They're wary of the view becoming unfalsifiable through case-by-case exemptions. This is a meta-philosophical probe with high stakes.

  The user's phrasing reveals they're likely an academic or advanced student - note terms like "non-ontic picture" and "gerrymandered paraphrase." Their frustration with "stock objections" signals they've engaged existing literature. The personal persuasion clues ("I'd find most persuasive...") are golden for tailoring response.

  I need to structure this as requested: bottom-line first, then reasoning. The defeaters should range from potentially fatal to awkward, with explicit notes on what deflationists would concede. The unfalsifiability challenge must be addressed honestly - that's clearly their touchstone concern.

  For high-impact arguments: the moral/legal cases are strongest because they show ontology isn't just words when it alters victimhood or liability. The self-undermining point about deflationism smuggling in ontology is also powerful. Methodological indispensability arguments from science carry weight too.

  Moderate objections include the intuition of genuine discovery in physics (like gravitational waves) and the deflationist's burden-shifting on equivalence relations. Awkward points involve persistent expert disagreement - though deflationists can explain this away as institutional incentives.

  On unfalsifiability: I'll concede it's a risk but argue the burden is symmetrical. The key is whether deflationists have principled (not ad hoc) criteria for "merely verbal" labeling. Their view isn't unique here - scientific realists face similar demarcation challenges.

