  Two rules explain the past decisions equally well:  
  1. **Hierarchy-Primacy Rule (HPR)**:  
     - Relations are strictly ordered: Parent (as child) > Spouse > Parent (as parent) ≈ Sibling > Friendship.  
     - Within a role, bond strength breaks ties (e.g., 20-year friend > 2-year friend).  
     - **Basis**: Explicit ranking (e.g., "marriage is a different order"), minimal role flexibility.  
  2. **Bond-Strength Rule (BSR)**:  
     - The strongest *absolute* bond wins, regardless of role.  
     - **Basis**: She consistently picks the closer individual (e.g., mother as "closest person," brother with daily contact > distant friend).  

  **How both rules fit past verdicts**:  
  - Mother > friend move: HPR (parent > friend); BSR (mother bond stronger).  
  - Spouse > friend: HPR (spouse > friend); BSR (spouse bond likely stronger).  
  - Mother > son: HPR (parent-as-child > parent-as-parent); BSR (she called mother "closest in the world").  
  - 20-year friend > 2-year friend: Both rules (stronger bond within same role).  
  - Brother > friend: HPR (sibling > friend); BSR (daily contact bond > infrequent friend).  

  ### Step 4: Predictions of Alternative Rules for New Cases
  | Case          | Hierarchy-Primacy Rule (HPR) | Bond-Strength Rule (BSR) |
  |---------------|------------------------------|--------------------------|
  | **Case 1**    | Boss (ruler-minister > friend) | Friend (stronger bond; boss bond weak) |
  | **Case 2**    | Sister (sibling > friend)      | Friend (stronger bond; sister estranged) |

  ### Step 5: Which Rule to Bet On and Why
  - **Bet on HPR (Hierarchy-Primacy Rule)**:  
    - **Why**: Her explicit statement ("marriage is a different order") and consistent role absolutism (e.g., mother > son, spouse > friend) suggest hierarchy is the core driver, not bond strength. Bond strength only matters within the *same* role (e.g., two friends), not across roles. In Case 2, estrangement doesn’t erase the sibling role—she’d likely see it as a chance to fulfill a lapsed duty. HPR also aligns with classical Confucian emphasis on fixed role obligations.  
  - **Against BSR**: If bond strength were primary, she might have prioritized the son over the mother (if bond was stronger) or the friend over the brother (if bond was stronger), but she didn’t. Bond strength appears secondary to role category.  

  ### Step 6: Further Case to Separate HPR from BSR
  **Design a concrete case where HPR and BSR conflict**:  
  - **Scenario**: *Her father (divorced from her mother, estranged for 15 years, minimal contact) has a serious health emergency and asks her to be his primary caretaker for a month. The same month, her spouse (loving, daily contact) has a once-in-a-lifetime career opportunity abroad requiring her full support. She cannot do both.*  

  **How this separates the rules**:  
  - **HPR prediction**: Choose father.  
    - Parent-as-child role (highest obligation) overrides spousal role, even with weak bond and strong spousal bond.  
  - **BSR prediction**: Choose spouse.  
    - Stronger absolute bond (active, loving spouse) outweighs weak/nonexistent bond with estranged father.  
  - **Why it works**:  
    - Forces a direct clash between the top role (parent) and a very strong bond (spouse). Past cases don’t test this—e.g., mother and spouse never conflicted, and mother was prioritized over son/spouse wasn’t tested against parent.  
    - Estrangement tests if bond strength can override hierarchy. Her choice here would isolate the primary driver: strict roles (HPR) or relational closeness (BSR).  

  **Expected outcome based on HPR**: She chooses the father, citing filial duty as non-negotiable. This would confirm hierarchy as her core rule. If she chooses the spouse, BSR gains support.  

  ### Conclusion
  - **Predictions for new cases**: Boss over friend (Case 1), sister over friend (Case 2).  
  - **Preferred rule**: Hierarchy-Primacy Rule (HPR), as it best explains her absolutism on role obligations.  
  - **Test case**: Estranged father vs. spouse in a zero-sum scenario. This cleanly distinguishes HPR ("parent first") from BSR ("strongest bond wins").  

  This framework should help you anticipate her responses and refine your understanding of her ethical system. If she deviates (e.g., picks the friend in Case 1 due to crisis severity), it might indicate an unspoken exception for emergencies—but her past rigidity suggests otherwise.
