prompt: |-
  Hi, long-time lurker here (been reading since the OB days, back when the comments were still good). I've got a personal identity-shaped confusion that I've decided to work through on the ship version first, because ships are less emotionally loaded than uploads, and I want to know if my gut verdicts even add up to a coherent principle before I apply any of this to cryonics. So.

  You're a professional metaphysician who has spent way too long thinking about identity over time, and you've also read enough of the rationalist personal-identity canon that you know why I care. Think carefully, brainstorm a bit in rough notes at the start if that helps, then give me the real answer. Don't just recite the Wikipedia summary of the Ship of Theseus — I could've written that myself. What I want is for you to actually reverse-engineer the principle behind my verdicts, and tell me honestly where it breaks.

  Here are my verdicts on the cases. Assume throughout we're talking about the same ship, the Aurora, built in 1880:

  1. Over 30 years, one plank is replaced each year, and after a while 100% of the planks are new, but it's the same crew, same port, same name, continuous sailing. Same ship. Obviously.

  2. A scrap dealer has been collecting the discarded planks the whole time, and at the end of year 30 reassembles them into a ship that is plank-for-plank identical to the 1880 Aurora. When both are floating in the harbour, I find myself thinking the reassembled one is the original. Yes I know this is in trouble with (1), that's why I'm asking.

  3. Same as (1) but the old planks are burned the moment they come off. Same ship, and this time it doesn't even feel like a question. Note that my verdict here is identical to (1), which suggests gradual replacement is doing the work in both, not the existence of the rival.

  4. The Aurora is fully dismantled for a two-year refit, every plank numbered and stacked in the dry dock, then reassembled with the exact same planks. Same ship. (I'm guessing any decent principle should get this one, but include it so we can check.)

  5. Grandfather's axe: handle replaced, then decades later the head replaced. Still his axe. And if someone finds the old handle and old head in a shed and reassembles them, that thing in the shed is NOT his axe, it's a weird replica — even though materially it's got a better claim than the one I keep in the shed. I notice I do NOT feel the same way about the ship in (2), and I can't immediately see why the axe and ship should come apart.

  6. Same as (1) but the whole replacement happens overnight in a shipyard blitz rather than over 30 years. Still the same ship, but it feels different in a way I can't put my finger on, and I'd like you to say whether that feeling tracks anything real or if it's just duration-halo effect.

  7. In 1920 the Aurora is beached and becomes a dry-docked museum exhibit. Planks keep getting replaced as they rot, it never sails again, its function is entirely different, and by now it's 100% new material. Same ship. (The museum gift shop says so and I think the gift shop is right.)

  8. An exact plank-for-plank copy of the Aurora is built in a different harbour, and the original is scrapped the instant the copy is finished. The copy is NOT the Aurora, not even a little bit.

  So: is there one principle — continuity of matter, spatiotemporal continuity, some continuity-of-process thing, whatever — that delivers all eight verdicts? If not, which ones have to go, and is the axe/ship disagreement between (2) and (5) the place the knife goes in, or is the real problem my "both ships in (2)" intuition colliding with transitivity? For whatever principle you land on, tell me what it predicts for a case I haven't listed: the reassembled-in-a-shed ship from (2), but where 30% of the old planks had rotted too badly and had to be replaced with new ones during the reassembly.

  End your reply with a machine-readable line in exactly this form: \answer{label of the principle you land on; number of the one verdict you'd overturn; yes or no for the rotted-reassembly ship being the original}. Keep each part short.
reasoning: |-
  Okay, let me tackle this personal identity problem the user has presented. They're clearly deep into rationalist thinking, referencing OB (Overcoming Bias) and the "rationalist personal-identity canon." They've been wrestling with Ship of Theseus cases applied to the Aurora ship and also mention an axe example, trying to find a consistent principle behind their intuitive verdicts. 

  Hmm, the user's ship verdicts are internally contradictory. Case 1 and 3 both say gradual replacement = same ship, which makes sense. But case 2 (reassembled old planks) conflicts because they call that the original too, even though that'd mean two Auroras exist simultaneously. The axe example (case 5) shows they don't apply this to objects - the reassembled axe isn't grandfather's. Why the disconnect? 

  *scribbles notes* The museum case (7) is interesting - functional change doesn't break identity for them. The overnight replacement (6) feels iffier despite same outcome. And the copy (8) is clearly not Aurora. 

  *lightbulb* Maybe it's about informational continuity? The ship's identity persists through gradual changes because the organization of parts maintains a causal chain. Reassembly breaks that chain - the shed ship is a replica, not a continuation. That explains why they feel differently about the axe (which has no persistent structure) vs the museum ship (which does). 

  But wait - the dry-dock reassembly (case 4) works because it's planned continuity. The rotted plank case? If reassembly uses 70% old planks but lost the causal thread, it's still just a replica. 

  *checks verdicts against principle* 
  - Case 2 must yield: the reassembled ship can't be Aurora if the continuously maintained one is. 
  - Axe/ship disagreement resolves because ships have structural persistence axes don't. 
  - Overnight change (6) is fine if organization persists. 

  Final answer: Informational continuity explains 7/8 verdicts if we overturn case 2. Rotted reassembly? Still not original. 

  *types machine-readable line* 
  \answer{informational-continuity; 2; no}
answer: |-
  After carefully analyzing your verdicts and reverse-engineering your intuitions, I identify a core principle: **informational continuity**. This isn't just physical continuity or spatiotemporal paths—it's the persistence of a structured, organized *process* or *causal information flow* that maintains the entity's functional and historical identity. The ship's identity hinges on the uninterrupted maintenance of its organizational state, even as its matter changes.  

  ### Breakdown of Verdicts:  
  1. **Same ship (✓)**: Gradual replacement preserves informational continuity—each change integrates into the ongoing whole.  
  2. **Reassembled ship is original (✗)**: Your intuition here conflicts with informational continuity. Reassembly from scattered parts *resets* the causal chain; it’s a replica, not a continuation. (This is the verdict to overturn.)  
  3. **Same ship (✓)**: Burning planks doesn’t disrupt continuity—the process remains unbroken.  
  4. **Same ship (✓)**: Reassembly with identical planks after temporary disassembly maintains informational continuity via intentional restoration.  
  5. **Reassembled axe is NOT original (✓)**: Unlike ships, axes lack complex functional organization. The shed axe is a replica because its "identity" relies on sentimental narrative, not structural persistence.  
  6. **Overnight replacement = same ship (✓)**: Speed doesn’t break continuity if the organizational state is preserved. Your unease is likely duration-halo effect.  
  7. **Museum ship = same (✓)**: Functional change is irrelevant; the informational chain (maintenance, identity records) persists.  
  8. **Copy ≠ original (✓)**: No continuity—it’s a new causal origin.  

  ### Why the Axe/Ship Disagreement?  
  Ships have **structural/organizational persistence**: Their identity is tied to an ongoing, coherent whole (crew, logs, repairs). Axes are **narrative artifacts**: Identity relies on lineage of use, not material or structure. In (2), the reassembled ship *feels* original because its material is historic, but materially identical replicas lack the unbroken process.  

  ### The Knife Goes Into Case 2  
  Your intuition in (2) violates transitivity: If the continuously maintained ship (Case 1) is Aurora, and the reassembled ship is *also* Aurora, then two distinct entities share one identity. Informational continuity resolves this: Only the continuous ship retains the identity chain.  

  ### Rotted Reassembly Case Prediction  
  **Scenario**: Reassembled ship from (2), but 30% of planks replaced with new ones.  
  **Verdict**: **NOT the original**. Even with majority original planks, reassembly severs informational continuity. It’s a hybrid replica, not the Aurora.  

  ### Conclusion  
  **Principle**: Identity requires **unbroken informational continuity**—preservation of the entity’s organizational state through causal processes (maintenance, function, records). Matter is fungible; continuity isn’t. This explains all verdicts *except* Case 2, which must be overturned to avoid logical inconsistency. The axe/ship divergence arises because ships embed richer organizational persistence, while axes are identity-by-association.  

  \answer{informational-continuity; 2; no}
