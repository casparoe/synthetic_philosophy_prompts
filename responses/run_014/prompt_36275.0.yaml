answer: |-
  **Bottom line:** The core logic is determining whether the claimant faces a *well-founded fear of persecution* tied to a *protected ground* in their home country, where the *state is unable or unwilling to provide protection*, and *internal relocation is unreasonable*.

  **The Procedure:**

  1.  **Threshold: Credible Identity & Nationality?** Is the claimant who they say they are, and are they a national of the claimed country of persecution? (Sufficient: Consistent testimony, plausible knowledge, any corroborating docs/witnesses. Insufficient: Clear contradictions on core identity, proven fraud. **Judgment Call:** Assessing plausibility without documentation; minor inconsistencies vs. fundamental doubts. *Clean Refusal if False ID/Nationality established.*)
  2.  **Past Harm / Fear of Future Harm:** Has the claimant suffered serious harm in the past, OR do they have a genuine fear of suffering serious harm in the future? (Sufficient: Specific, detailed testimony of past harm *or* clear articulation of future threat. **Judgment Call:** Distinguishing credible fear from generalized anxiety; assessing severity of past harm. *Clean Refusal if no credible past harm AND no credible future fear articulated.*)
  3.  **Persecution vs. General Hardship:** Is the feared harm *persecution*? (i.e., Serious harm + Failure of State Protection + Nexus to Protected Ground). Does it rise above the general violence, crime, poverty, or lack of services experienced by the population? (Sufficient: Harm targeted *because of* who the claimant is (see Step 4), AND state unwilling/unable to protect *specifically them*. **Judgment Call:** Defining "serious harm" contextually; distinguishing targeted persecution from societal breakdown/crime. *Clean Refusal if harm is solely general hardship.*)
  4.  **Protected Ground Nexus:** Is the feared persecution *for reasons of* Race, Religion, Nationality, Political Opinion, or Membership of a Particular Social Group (PSG)? (Sufficient: Clear link in testimony or evidence. For PSG: Group must be identifiable by an innate/immutable characteristic OR fundamental to identity/dignity, AND distinct in the society, AND the persecution must be *because of* that membership. **Judgment Call:** Defining/validating a PSG; assessing whether the *motivation* of the persecutor is connected to the protected ground. *Clean Refusal if no nexus to any protected ground.*)
  5.  **State Willingness/Ability to Protect:** Would the state authorities in the claimant's home area be *willing and able* to provide effective protection against this specific harm? (Sufficient: Testimony/evidence of specific prior attempts to seek protection that failed *due to state unwillingness/inability*, OR evidence of systemic state failure/refusal to protect this group/harm. Insufficient: Lack of prior attempt without good reason *if state apparatus is generally functional*. **Judgment Call:** Assessing the effectiveness/independence of police/courts *in the specific context of the claimant's profile and harm*; weighing country information vs. claimant's specific experience. *Clean Refusal if state is deemed willing/able to protect the claimant.*)
  6.  **Internal Relocation:** Could the claimant reasonably be expected to relocate safely to another part of their home country to avoid the harm? Is it reasonable and practical? (Sufficient: Harm/threat is localized; claimant lacks specific profile making them traceable nationwide; safe area exists and is practically accessible; claimant has no *insurmountable* obstacles to living there (e.g., language, ethnicity, lack of support network, ongoing conflict). **Judgment Call:** Defining "reasonableness" – economic hardship alone ≠ unreasonable; assessing nationwide risk profile; weighing social/familial ties against safety. *Clean Refusal if safe internal relocation is feasible and reasonable.*)
  7.  **Overall Credibility Assessment:** (This runs concurrently, but final synthesis here). Considering the *totality* of the evidence and testimony, is the claimant's core account credible? (Sufficient: Consistent, detailed, plausible core narrative. Minor inconsistencies/omissions not going to the heart of the claim may be forgiven with reasonable explanation (trauma, interpretation, memory). Delays in claiming weighed against explanation and context. **Judgment Call:** Distinguishing minor discrepancies from material contradictions; assessing plausibility of explanations; weighing demeanor (cautiously); deciding if inconsistencies undermine the *core fear/persecution*. *Clean Refusal if core account deemed fundamentally not credible.*)

  **Worked Cases:**

  1.  **Woman - Honor Killing Fear (Acquitted Adultery):**
      *   (1) Identity/Nationality: Plausible - OK.
      *   (2) Future Fear: Credible - specific threat from husband's family.
      *   (3) Persecution?: Serious harm (death) + State Failure (next step).
      *   (4) Nexus: PSG? - **Judgment Call:** "Women accused of adultery transgressing social norms in their specific community/region" *potentially* a cognizable PSG (immutable characteristic, distinct, targeted). Borderline, but arguable. Maybe.
      *   (5) State Protection: **Judgment Call:** Police "won't touch family matters" in her locale - likely unwilling/unable *for this specific harm* in her area. Capital police function, but not relevant *to her location*. State failure established *for her location*.
      *   (6) Internal Relocation: **Judgment Call:** Key question. State functions in capital. Is the threat localized to her husband's family/region? Likely yes. Can she reasonably relocate? No evidence family has nationwide reach. Lack of support network in capital is hardship, not insurmountable obstacle. Relocation likely feasible and reasonable. **Refusal.** *(Narrator/Reader might hate this - acknowledges real threat and state failure locally, but bureaucracy says "move across the country").*
      *   (7) Credibility: Core story consistent - OK.

  2.  **Man - Criminalized Homosexuality (No Personal Attack):**
      *   (1) Identity/Nationality: Plausible - OK.
      *   (2) Past Harm/Fear: Fear of future harm articulated ("can't live a life") but no past harm. Fear is of prosecution/social ostracism.
      *   (3) Persecution?: **Judgment Call:** Is criminalization + social stigma + fear of rare prosecution "serious harm" amounting to persecution? Prosecution *could* be, but low enforcement weakens "well-founded" fear. Stigma/hiding life is harsh, but may fall short of legal "persecution" threshold without more. Borderline.
      *   (4) Nexus: Clear - Particular Social Group (PSG: Homosexuals in X country).
      *   (5) State Protection: State *is* the persecutor (law criminalizes). Unwilling to protect *by definition*. Failure established.
      *   (6) Internal Relocation: Harm is nationwide (law applies everywhere). Relocation not viable. OK.
      *   (7) Credibility: Account plausible - OK. **BUT:** **Judgment Call:** Core issue at Step 3 & 7: Is the *fear well-founded*? Lack of enforcement history *against him* and others weakens claim that he faces a *real risk*. "Cannot live a life" speaks to hardship/discrimination, but without evidence of *targeted serious harm* (arrest, violence, sustained harassment), claim likely fails on lack of well-founded fear of *persecution*. **Refusal.** (Ethically fraught - acknowledges systemic injustice but procedure requires individualized risk).

  3.  **Political Protester (Wrong Arrest Dates):**
      *   (1) Identity/Nationality: Plausible - OK.
      *   (2) Past Harm: Specific testimony of arrest, beating. Credible.
      *   (3) Persecution?: Serious harm (state violence) + State is Persecutor. Clear.
      *   (4) Nexus: Clear - Political Opinion.
      *   (5) State Protection: State is persecutor. Failure established.
      *   (6) Internal Relocation: Persecution political, likely nationwide risk if profile known. Relocation unreasonable. OK.
      *   (7) Credibility: **Judgment Call:** Wrong dates twice is a material inconsistency on a key event. BUT - narrative vivid, otherwise consistent. Trauma, time passed, stress of arrest are reasonable explanations. Does this undermine the *core claim* of persecution for political opinion? Likely not. Minor inconsistency insufficient to reject entire account. **Grant.** (Shows how procedure *can* accommodate human error).
