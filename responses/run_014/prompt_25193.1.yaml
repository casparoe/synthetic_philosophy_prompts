prompt: |-
  I teach an upper-level undergrad game theory course, about 25 students, one 75-minute session. We've just covered strict dominance and iterated elimination of strictly dominated strategies for pure strategies, and now I want them to discover for themselves why we need to consider mixed strategies in the elimination process — that a strategy can survive pure-strategy elimination but still be strictly dominated by a mixed strategy.

  Design a classroom game for this. Here's what I'm after:

  - A normal-form game with 3 or 4 strategies per player, where the first round or two of elimination uses pure-strategy dominance (which they already get), but then they hit a wall — the remaining strategies can't be eliminated by any pure strategy, yet one of them is strictly dominated by a mixture of the others. The game should be symmetric or nearly symmetric so it's easier to run.
  - The game is played in pairs, repeated maybe 8–10 rounds, with payoffs in points (no real money). After each round, I collect strategy choices anonymously on slips of paper and display the distribution on the board. Between rounds, pairs can discuss but can't coordinate across pairs.
  - The key moment: after a few rounds, I announce that we're going to "remove" strategies that nobody should ever play, and I ask the class to vote on which ones. They'll easily eliminate the pure-strategy-dominated ones. Then I ask: "Are we done? Can any of the remaining strategies be ruled out?" This is where they need to discover the mixed-strategy dominance. The game's payoffs should be set up so that some pairs will stumble into mixing naturally (because the pure best responses cycle), and the aggregate data will show the dominated strategy getting crushed by mixtures even though no single pure strategy beats it.
  - A debrief that walks through: (1) which strategies got eliminated and why (pure dominance), (2) the "wall" they hit, (3) how mixing two strategies can dominate a third even when neither does alone, (4) the formal definition of strict dominance by a mixed strategy, and (5) why this matters for iterated elimination — that you can't stop at pure strategies if you want the full power of the concept.

  Also tell me what will predictably go wrong the first time I run it and how to handle it. Be honest about what the activity can't teach — what I'll still need to cover in lecture afterwards.

  Please structure your response like this:

  **The Game** (payoff matrix, rules, materials, setup — about 300 words)
  **Round-by-Round Facilitation Plan** (what I do each round, what I say, when I intervene — about 400 words)
  **The Debrief** (mapping what happened to the formal concepts, step by step — about 400 words)
  **What Goes Wrong** (predictable failure modes and fixes — about 200 words)
  **What's Missing** (what the activity can't reproduce and I'll need to supply — about 150 words)

  Think very carefully before answering — I've tried activites like this before and the hard part is getting the payoff numbers right so the mixed-strategy dominance actually shows up in play rather than just in theory. Respond in the style of an experienced game theory instructor who's run this kind of thing many times.
reasoning: |-
  Okay, the user is an upper-level undergrad game theory instructor who wants a classroom activity to help students discover why mixed strategies are necessary for strict dominance in iterated elimination. They've tried similar activities before but struggled with payoff matrices that don't reliably show mixed-strategy dominance in practice. 

  Hmm, the core challenge here is designing a payoff matrix that meets several tricky criteria: it must have clear initial pure-strategy dominance, then a "wall" where remaining strategies seem undominated by pure actions, but one is strictly dominated by a mixed strategy. Crucially, it must produce natural mixing behavior in the classroom that visibly "crushes" the dominated strategy. 

  Let me recall games that fit this. The classic example is Shapley's game, but its payoffs are too abstract for quick classroom intuition. A modified matching pennies variant might work better... Ah! A 3x3 symmetric game inspired by constant-sum dynamics but rescaled to avoid negative payoffs. Player 1: A,B,C; Player 2: X,Y,Z. 

  Key features:
  - First, eliminate C/Z via pure dominance (e.g., C always worse than A against all opponent moves)
  - Then remaining strategies A,B,X,Y appear undominated by pure strategies: A beats X but loses to Y, B beats Y but loses to X. 
  - But crucially, B is strictly dominated by a mixed strategy of A and C (even though C is already eliminated!). The mixed strategy (0.5A + 0.5C) gives 0.5* payoff against X and Y, which sums to higher expected payoff than B alone. Payoffs need careful tuning so that:
    Against X: (0.5)(3) + (0.5)(1) = 2 > B's 1.5
    Against Y: (0.5)(0) + (0.5)(3) = 1.5 > B's 0
  - Students will see cycling behavior: when opponents play X, players switch to A; when opponents play Y, they switch to B, creating natural mixing patterns. Over rounds, B should decline as players implicitly mix.

  Potential pitfalls:
  - Payoff numbers look arbitrary - must emphasize "points matter" mentality
  - Students might not detect the mixed dominance without hints - prepare to ask: "Could combining two strategies beat B?"
  - Time pressure - strict 3-minute rounds essential

  In debrief, need to explicitly connect observed behavior to formal definition: "A strategy σ is strictly dominated if there exists a mixed strategy μ such that for all opponent profiles..." and stress that iterated elimination must continue with mixed strategies to get the full solution.

  What this can't teach: The activity shows the necessity of mixed strategies for dominance, but doesn't cover how to find such mixtures systematically or prove dominance - that requires lecture follow-up on linear programming/inequalities. Also, the symmetry helps intuition but real-world applications often involve asymmetry.
answer: |-
  **The Game**  
  *Payoff Matrix (Symmetric, Row Player Shown; Player 2 Transposed Identically):*  

  |          | X       | Y       | Z       |
  |----------|---------|---------|---------|
  | **A**    | 3, **0**| 0, **3**| 1, **2**|
  | **B**    | 1.5, **1.5**| 0, **3** | 3, **0**|
  | **C**    | 1, **2**| 1, **2**| 0, **3**|

  **Rules**:  
  - 25 students → 12 pairs + 1 observer (or TA). Pairs play simultaneously for 8 rounds.  
  - **Payoffs**: Points (not real money), summed across rounds. Higher = better.  
  - **Anonymity**: After each round, pairs write choices (e.g., "A,X") on slips. Instructor collects and displays aggregate strategy frequencies on the board (e.g., "A: 40%, B: 30%, C: 30%").  
  - **Discussion**: Between rounds, pairs *can* discuss privately. *No* cross-pair coordination.  
  - **Key Setup**: The game is symmetric (payoffs identical for both players). Z is strictly dominated by A (A≥Z vs X,Y; A>Z vs Z). Post-Z-elimination, no pure strategy dominates another in {A,B,X,Y}, but **B is strictly dominated by a 50-50 mix of A and C** (even after C is "removed"!).  

  **Materials**: Slips of paper, whiteboard for frequencies, calculator.  

  ---

  **Round-by-Round Facilitation Plan**  
  **Rounds 1–4 (Exploration)**:  
  - *Start*: "Play 3 minutes/round. Maximize your total points. Record choices secretly."  
  - *After each round*: Tally frequencies (e.g., "A: 5, B: 4, C: 3; X: 6, Y: 4, Z: 2"). Plot cumulative frequencies.  
  - *Observe*: Look for Z vanishing (pure dominance). Expect cycling between A/B/X/Y (e.g., if opponents play X, A wins; if Y, B wins → instability).  

  **Rounds 5–6 (Intervention)**:  
  - *Announce*: "We’ll remove ‘irrational’ strategies. Vote: Which strategies should be banned?" Students will eliminate Z (pure-dominated).  
  - *Question*: "Now with {A,B,X,Y} left: Can we remove more? Is any pure strategy always worse?" Expect "No" (no pure dominance remains).  

  **Rounds 7–8 (Critical Moment)**:  
  - *Challenge*: "Play 2 more rounds. Can you find a way to make B unprofitable?"  
  - *Collect data*: If payoffs are tuned right, B’s frequency drops (e.g., to 10-15%) as pairs implicitly mix A/C.  

  ---

  **The Debrief**  
  *(After Round 8, using displayed frequency data)*  

  1. **Pure Dominance Recap**:  
     - "Why did Z disappear? Because A ≥ Z against all moves, and A > Z against Z itself. Strict dominance → elimination."  

  2. **The Wall**:  
     - "After removing Z, no pure strategy dominates another in {A,B,X,Y}:  
       - A beats X (3>1.5) but loses to Y (0<3).  
       - B beats Y (3>0) but loses to X (1.5<3).  
       Pure iterated elimination stalls."  

  3. **Mixed Dominance Revelation**:  
     - Show B’s declining frequency (use whiteboard data). "Why did B lose popularity? No pure strategy beats it, but look at mixtures."  
     - **Demo**: "Suppose you play 50% A, 50% C. Against X: (0.5×3) + (0.5×1) = 2 > B’s 1.5. Against Y: (0.5×0) + (0.5×3) = 1.5 > B’s 0. Against Z: (0.5×1) + (0.5×0) = 0.5 > B’s 0? Wait—but Z is gone! After elimination, we only check against *remaining* strategies (X,Y)."  
     - **Punchline**: "B is strictly dominated by mixing A and C, *even though C was eliminated earlier!*"  

  4. **Formal Definition**:  
     - "A strategy σ is strictly dominated if ∃ a mixed strategy μ such that:  
       ∀ opponent profiles s₋ᵢ, uᵢ(μ, s₋ᵢ) > uᵢ(σ, s₋ᵢ).  
       Here, μ = 0.5A + 0.5C dominates B against X and Y."  

  5. **Why This Matters**:  
     - "Iterated elimination must include mixed strategies. If we stop at pure dominance, we miss dominated strategies → incomplete prediction. This is why Nash equilibrium requires mixed strategies in some games."  

  ---

  **What Goes Wrong**  
  1. **B Doesn’t Die**: If payoffs aren’t salient, pairs may not shift from B. *Fix*: Pre-round reminders ("Points determine rankings!"), or nudge pairs stuck on B: "Are you sure B is safe against all opponent moves?"  
  2. **Misvoting**: Students may vote to keep Z if payoffs misread. *Fix*: Clarify pre-vote: "A gives ≥ Z in all cases? Better in some?"  
  3. **Time Crunch**: Round delays eat into debrief. *Fix*: Use a timer; skip R7-8 if needed (use simulated data).  
  4. **Mixing Confusion**: Students may think mixing requires explicit randomization. *Fix*: "Mixing can be implicit—like alternating A and C across rounds."  

  ---

  **What’s Missing**  
  - **Finding Mixed Dominators**: The activity shows *why* mixed dominance matters but not *how to find* the dominating mixture (e.g., solving inequalities). Cover this in lecture.  
  - **General Proof of Dominance**: Students need formal practice verifying u(μ,s) > u(σ,s) for all s (e.g., via linear inequalities).  
  - **Asymmetric Games**: This symmetric game simplifies intuition, but real-world cases are often asymmetric. Discuss examples post-activity.  
  - **Iteration with Mixed Strategies**: The activity stops at one elimination step. Lecture should show full iterated elimination (e.g., in larger games).  

  **Instructor Note**: Test payoffs beforehand! If B isn’t dying, tweak numbers slightly (e.g., change B’s payoff vs X from 1.5 to 1). The magic is in the cycling between A/B/X/Y forcing experimental mixing.
