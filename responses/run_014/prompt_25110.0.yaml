  Okay, the user is a TA preparing for a political philosophy discussion section on valid consent. They need a structured 50-minute plan that builds understanding incrementally, using a single adaptable scenario to explore deception, coercion, and incompetence as interconnected threats rather than isolated checklist items. 

  Hmm, their underlying anxiety is palpable—they're wrestling with how to make abstract philosophy tangible while avoiding common student misconceptions. The real challenge isn't content delivery but designing cognitive scaffolding. I notice they've pinpointed three predictable stumbling blocks: (a) overgeneralizing deception, (b) conflating coercion with ordinary pressure, (c) treating competence as binary. These need targeted preemption within the flow.

  *Scratching head* The key insight from Hurd—consent as normative transformation—must anchor everything. But introducing it raw would lose students. Needs a concrete hook. A medical scenario? Surgery works: high stakes, clear boundaries, easy to modify elements. Let's prototype: "Patient agrees to surgery after signing forms, but..."—yes, manipulable for all three threats. 

  Ah! The mental state vs. communication distinction must come early, but how without abstraction? Simple: bake it into the first deception variation. "If she secretly wants the surgery but lies about understanding risks—is that valid?" Boom. Shows consent isn't just internal. Then layer normative transformation: "Why does her private willingness still make the cut unethical?" 

  *Pacing* Must sequence misconceptions deliberately. After establishing deception subtypes, immediately contrast fraud in factum vs. inducement with parallel surgical examples—maybe wrong organ vs. fake qualifications. Coercion next? Better follow with incompetence to avoid threat/offer confusion. Save coercion for last since it requires distinguishing threats from hard choices. 

  *Eyes narrowing* The competence trap—students will fixate on diagnosis. Counter by tweaking the surgery case: competent patient under duress vs. dementia patient fluctuating capacity. Ask: "Is the threshold moral or medical?" That exposes the continuum. 

  Final check: The "one question" test. Not "list three conditions" but something structural: "If coercion exploits circumstances while deception corrupts understanding, how is incompetence different from either?" Forces synthesis. 

  *Nodding* And boundaries matter. Flag that ontology debates are grad-school material. Say explicitly: "Today's goal isn't to define consent's essence but see how its function breaks." Prevents frustration. 

  ...Time to map this to minutes.
answer: |-
  Here’s a structured 50-minute discussion plan centered on a **single running example** (a medical procedure) designed to build conceptual layers, preempt misconceptions, and reveal connections between deception, coercion, and incompetence. The goal is to move students from Hurd’s "normative transformation" idea to recognizing how each threat disrupts consent in distinct ways.

  ---

  ### **Core Running Example: "Knee Surgery"**
  - **Baseline scenario**: *Alex consents to elective knee surgery after discussing risks/benefits with Dr. Lee. Surgery proceeds normally.*  
  - **Why it works**:  
    - Familiar context (medical consent mirrors their readings).  
    - Easily modifiable for deception (misrepresented facts), coercion (threats/offers), incompetence (capacity shifts).  
    - High stakes make normative stakes visceral.  

  ---

  ### **Sequenced Plan (50 mins)**  
  **Total Time** | **Phase** | **Key Questions/Activities** | **Pedagogical Goals**  
  ---|---|---|---  
  **0–10 mins** | **Anchor: Normative Transformation** | Start with baseline: *"Why did Alex’s consent make the surgery permissible?"*<br>- Guide students to articulate Hurd’s idea: Consent transforms a battery into a justified act by conveying *authorization*.<br>- **Critical pivot**: *"What exactly is Alex giving the doctor permission to do?"* → Reveals consent is **specific to an act/context**. | Establishes consent as *relational* and *transactional*—not just a mental state. Preempts "hypothetical consent" tangents by focusing on actual authorization.  
  **10–20 mins** | **Deception: Two Types, One Threat** | **Variant 1 (Fraud in Factum)**: *Dr. Lee performs heart surgery instead, but Alex signed a "knee surgery" form.*<br>- Q: *"Did Alex consent to this? Why not?"* → Highlights consent requires accurate understanding of **the act itself**.<br>**Variant 2 (Fraud in Inducement)**: *Dr. Lee lies: "This surgery will let you run marathons!" (It won’t). Alex consents.*<br>- Q: *"Is this consent invalid? If so, is it for the same reason as Variant 1?"*<br>- **Preempt Misconception (a)**: Contrast why #1 voids consent (wrong act) vs. #2 *may* void it (flawed reasons). Emphasize: Consent isn’t invalidated by *any* lie—only those that distort the **nature of the act or its essential terms**. | Distinguishes **what** is consented to (factum) from **why** consent is given (inducement). Shows deception invalidates consent by corrupting the agent’s understanding of the transaction.  
  **20–35 mins** | **Incompetence: Thresholds, Not Binaries** | **Variant 3**: *Alex has early dementia. Some days lucid, some confused. On a lucid day, they consent to surgery.*<br>- Q: *"Is this valid? What if symptoms worsen mid-discussion?"*<br>- Push students to identify **capacity requirements**: Understanding consequences, reasoning coherently.<br>- **Preempt Misconception (c)**: *"Is competence a yes/no switch? If not, how do we set thresholds?"* → Argue competence is **context-dependent** (higher stakes → higher threshold). Contrast with deception: *Incompetence doesn’t distort information; it undermines processing.* | Challenges "bright line" thinking. Focuses on **rational agency** (can they grasp the normative transformation they’re enacting?).  
  **35–45 mins** | **Coercion: Threats vs. Hard Choices** | **Variant 4**: *Dr. Lee threatens: "Consent or I’ll fire your son (a hospital intern)." Alex consents.*<br>- Q: *"Is this voluntary? What if Dr. Lee says: ‘Surgery is free if you enroll in my risky drug trial’?"*<br>- **Preempt Misconception (b)**: Distinguish:<br>— **Threat** (worsening options: "Do X or I’ll harm you") → invalidates consent.<br>— **Offer** (improving options: "Do X for a benefit") → usually valid.<br>- Stress: Coercion voids consent by **corrupting voluntariness**, not understanding (deception) or capacity (incompetence). | Highlights coercion as **external constraints overriding agency**. Contrasts with deception (internal distortion) and incompetence (internal incapacity).  
  **45–50 mins** | **Synthesis & Assessment** | **Closing Question**: *"Deception, incompetence, and coercion all invalidate consent—but do they do the* same *kind of damage to Alex’s authorization? Or does each attack a different ‘part’ of consent?"*<br>- Listen for: Deception → **understanding**, Coercion → **voluntariness**, Incompetence → **capacity**.<br>- **Why this works**: Tests grasp of the *structure* (3 distinct failure modes) vs. memorized list. | Reveals whether students see consent as a multi-conditional normative act.  

  ---

  ### **How to Preempt Misconceptions**  
  - **(a) "All deception invalidates consent"**:  
    - **When**: During deception variants (10–20 mins).  
    - **How**: Force contrast between *fraud in factum* (consented to wrong act → no authorization) and *fraud in inducement* (consented to right act, but for misrepresented reasons → authorization exists but may be voidable). Ask: *"If Alex *would* have consented without the lie, does that matter?"* (Hint: It shouldn’t for factum, might for inducement).  

  - **(b) "Coercion = feeling pressured"**:  
    - **When**: During coercion segment (35–45 mins).  
    - **How**: Contrast "hard choices" (e.g., "Consent or pay $50k") vs. threats ("Consent or I’ll break your kneecaps"). Ask: *"Does the *source* of the pressure matter? What if the ‘threat’ is just stating a fact (e.g., ‘Without surgery, you’ll never walk again’)?"*  

  - **(c) "Competence is a bright line"**:  
    - **When**: Incompetence discussion (20–35 mins).  
    - **How**: Use dementia example to show fluctuating capacity. Ask: *"If Alex can understand the surgery but not alternative treatments, is that enough? Who decides?"*  

  ---

  ### **What to Explicitly Set Aside**  
  - **Flag early (min 5)**: *"Today, we’re treating consent as a communicative act that changes what’s permitted. We won’t resolve whether it’s fundamentally mental, verbal, or relational—that’s grad-level metaphysics!"*  
  - **When hypothetical consent comes up**: *"Hypothetical consent (e.g., ‘They’d agree if rational’) doesn’t enact normative transformation—actual consent does. Save that debate for next week!"*  

  ---

  ### **Why This Flow Works**  
  1. **Builds from core insight** (normative transformation) → **applies to cases** → **compares threats**.  
  2. **Single example** reduces cognitive load; variations spotlight differences.  
  3. **Misconceptions preempted contextually** as they naturally arise.  
  4. **Synthesis question** tests structural understanding: If students see that each threat attacks a *different condition for valid authorization* (understanding/voluntariness/capacity), they’ve moved beyond checklist thinking.  

  **Bonus Tip**: Draw a triangle on the board: *Understanding* (Deception) | *Voluntariness* (Coercion) | *Capacity* (Incompetence). Add variants as you go, asking which vertex each threatens.
