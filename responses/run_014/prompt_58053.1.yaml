prompt: |-
  so i just started an internship in a neuromorphic lab and this whole brain is a computer thing suddenly matters for what im actually building, like what we tape out next month kinda matters.

  my supervisor leans on it really hard — basically that von Neumann thought brains and digital computers are the same kind of thing with different speed vs accuracy tradeoffs, neurons are just noisy transistors, synapses are memory cells, spikes are bits, and so we should keep memory and processing seperate on our chip and just add error correction to clean up the noise. his takeaway is we dont need a radically different architecure, just a von Neumann-style chip tuned for neural nets, and scaling that up gets us to brain-like cognition.

  i have a feeling even von Neumann himself thought the analogy breaks in important places? from what ive picked up he was struck by how slow and sloppy neurons are, how the brain seems to mix memory and computation together instead of splitting them, how it does something more statistical than exact arithmetic, no central clock, that kind of stuff.

  can you audit the analogy for me? lay out a mapping table of what is supposed to correspond to what — processor, memory, bus, program, bit, clock, error and error-correction, etc — then where the mapping actually breaks, and especially what computer-features the analogy quietly smuggles in that brains might just not have. and then tell me if my supervisors conclusion survives — does the brain-is-a-computer idea really license keeping memory separate and just scaling up, or was the analogy doing all the work? if theres a better analogy for what a brain is doing, say what it is.

  and since im gonna have to argue about this, be upfront about where your reasoning is most likely to fail and what evidence or argument would change your mind or flip your verdict.
