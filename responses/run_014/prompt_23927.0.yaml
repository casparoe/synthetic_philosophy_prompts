prompt: |-
  I keep hitting this at work: a spec is compatable with a bunch of different implementations, so there's no fact of the matter about which one it 'really' picks out until you add more constraints. That's basically the Kripkenstein rule-following problem (the quus thing — your entire past track record of adding numbers is also consistent with some other function that only diverges on inputs you never actually hit), and I want to write a blog post connecting the two. Could you build me a decision tree / taxonomy that sorts the philosophical positions on this argument? I want it built from the logical space rather than a list of names: start with the questions that actually split the views and the answer combos they allow, then drop the real positions into the cells, and call out any combo nobody occupies and why (incoherent, unattractive, or just unexplored). I need these to show up as leaves or branch points: the skeptical solution (give the skeptic what they want, drop meaning facts, keep the practice going), the straight responses that insist there ARE meaning facts (dispositional, causal-historical, and the 'just irreducible, no further analysis' kind), plus the move of rejecting Kripke's reading of Wittgenstein outright. Use concrete cases as the branch questions — like the over-determination point (finite record, infinitely many rules), the misbehavior problem (my disposition to answer 125 is undercut by the fact that I sometimes slip), and the community-consensus case (does everyone else answering 125 settle it, or is that just the same problem one level up?) — phrased so someone can answer them without already knowing which position they lead to. Name each leaf with the standard label if there is one, otherwise just describe it. Aim it at a technical-audience blog, roughly five to seven branch questions, and flag any pair of leaves your tree can't really seperate. No citations or reading list, just the tree.
