  (2) So that sentence is false, not meaningless.
  (3) Now "the present King of France is not bald" comes out, on the same theory, as "there's exactly one present King of France and he's not bald."
  (4) No King of France, so that's false too.
  (5) So both "the King of France is bald" and "the King of France is not bald" are false.
  (6) But those two are contradictories, and contradictories can't both be false.
  (7) So Russell's theory is wrong.

