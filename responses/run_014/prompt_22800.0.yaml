prompt: |-
  I've been following a reading group on moral uncertainty, and two members got into a long, good-faith argument about whether you can actually run expected-value calculations over competing moral theories. I sat on the fence, so I'd like you to referee.

  M started from the view that moral uncertainty is handled the same way as ordinary uncertainty: assign each candidate theory a credence and pick the action that maximizes expected value across the theories you might be right about — expected utility applied one level up, from uncertainty about outcomes to uncertainty about the right value function.

  R objected that this only works when the theories are commensurable. On most routine actions they agree, so no problem. But on the cases where they diverge, a rights-based theory may hold that an action is simply forbidden, attaching no numerical value to it, while a utilitarian assigns a number. You can't take a probability-weighted average of a number and a bare prohibition, so the expected value isn't hard to compute there — it's undefined.

  M answered that the incommensurability is a defect in the theories, not in the meta-level procedure. At the meta-level, he said, you're not averaging the theories' values; you're comparing your own credence-weighted options, and that comparison is always well-defined.

  R pushed back on the definition itself: the expected value of an action is a sum of value times probability over outcomes, and value has to live on a single numerical scale. If one of the theories in your probability distribution doesn't supply numbers, the sum doesn't exist. So the calculation is undefined in exactly the cases where you'd need it.

  M then conceded the edge cases are hard, but argued that's a reason to apply the method carefully, not to abandon it: on the large majority of decisions the theories agree, the expected-value calculation works cleanly, and that's where most of your actual choices fall.

  R closed by saying that conceding the hard cases doesn't rescue the method, because the entire point of the exercise is to guide you on the hard cases, and a tool that is undefined precisely where it's needed is, for its intended purpose, broken.

  Can you go through their exchange and say who's right at each step — not just who wins overall? And tell me what, if anything, both of them are missing.
reasoning: |-
  Okay, the user is part of a reading group on moral uncertainty and witnessed a debate between M and R about whether expected-value calculations can be applied across competing moral theories. They want me to referee the exchange step by step, identifying who was right at each stage and what both participants might be missing.

  First, let me parse the core disagreement: M advocates for treating moral uncertainty like empirical uncertainty—assign credences to theories and maximize expected value. R argues this fails when theories are incommensurable (e.g., numerical utilitarianism vs. categorical deontology). The sticking point is whether "undefined" cases sink the entire approach.

  Breaking down their exchange chronologically:  
  - M's opening move seems technically correct but naive about value structures.  
  - R's first objection hits a real weakness—incommensurability isn't just theoretical; it breaks calculations.  
  - M's "defect in theories" reply feels like moving goalposts; if theories don't supply numbers, forcing numbers is meta-ethical violence.  
  - R's definitional pushback is airtight mathematically: if one term in Σ(p·v) is undefined, the sum crashes.  
  - M's fallback to "works in easy cases" is pragmatic but concedes R's point about the tool's failure in hard cases.  
  - R's closing argument is devastating: if the method fails when theories disagree, it's useless for its primary purpose.  

  What both miss:  
  - M underestimates how often deep moral conflicts arise (triage, thresholds, etc.).  
  - R doesn't acknowledge workarounds like range voting or lexical priority that salvage some comparability.  
  - Neither addresses hybrid approaches (e.g., "my favorite theory" with credence thresholds) or structural solutions like variance-adjusted choice.  

  User's unspoken needs: They want clarity on whether moral uncertainty frameworks are fundamentally flawed or salvageable—and practical guidance for their group. The real request might be: "How do we make decisions when ethics breaks the math?"
answer: |-
  Let's break down M and R's exchange step-by-step, evaluating the logical soundness of each argument while highlighting what both may be overlooking. This isn't purely binary—both raise valid points at different stages—but we can identify where each has the stronger position.

  ### **Step 1: M's Initial Proposal**  
  *M's Claim*: Handle moral uncertainty like empirical uncertainty by assigning credences to theories and maximizing expected value (EV) across them.  
  **Who's right? M, but incompletely**.  
  - **Strength**: M correctly identifies that *if* all moral theories output cardinal values (real numbers) on a shared scale, EV calculations are coherent and rational (per standard decision theory).  
  - **Weakness**: M assumes moral theories *can* be treated as random variables in an EV equation without addressing value-structure incompatibilities.  

  ### **Step 2: R's First Objection**  
  *R's Claim*: EV calculations fail when theories are incommensurable (e.g., utilitarianism assigns numbers, deontology issues categorical prohibitions). You can't average a number and a "forbidden."  
  **Who's right? R**.  
  - R exposes a fatal flaw in naïve EV application: **deontic constraints (e.g., "never torture") lack cardinal values**, making weighted averages undefined. If Theory A says "action X has utility 10" (50% credence) and Theory B says "X is impermissible" (50% credence), there's no meta-value for "impermissible" to plug into Σ(prob × value).  
  - **What M misses**: Moral theories aren't just "disagreeing calculators"—they define value *ontologically differently*. Forcing deontology into utilitarianism's structure distorts its core claims.  

  ### **Step 3: M's Response**  
  *M's Claim*: Incommensurability is a theory-level defect, not a meta-procedure flaw. At the meta-level, we compare credence-weighted options directly.  
  **Who's right? M is partially misleading**.  
  - **Weakness**: M conflates two distinct projects:  
    - (a) *Descriptive*: What do theories say?  
    - (b) *Meta-prescriptive*: How to act under uncertainty?  
    If theories *actually* output incommensurable verdicts (e.g., "required" vs. "forbidden"), M hasn't explained how to "directly compare" them. Asserting that meta-comparisons are "always well-defined" ignores R's challenge.  
  - **What R misses**: Some meta-frameworks (e.g., **My Favorite Theory**) avoid averaging by simply following the highest-credence theory—but this isn't EV maximization.  

  ### **Step 4: R's Pushback**  
  *R's Claim*: EV requires a single numerical scale. If one theory lacks numbers, Σ(prob × value) is undefined—especially in hard cases where guidance is needed.  
  **Who's right? R, decisively**.  
  - R correctly notes that **EV is mathematically undefined** with non-cardinal inputs. "Forbidden" isn't a number—it's a structural refusal to quantify.  
  - **Key insight**: EV calculations *presuppose* commensurability. If theories disagree on value *structure*, not just magnitude, the procedure collapses.  

  ### **Step 5: M's Concession**  
  *M's Claim*: Edge cases are hard, but EV works for most decisions where theories agree.  
  **Who's right? M pragmatically, but R strategically**.  
  - **M's strength**: For routine choices (e.g., "don't steal"), theories often *converge* on verdicts, making EV tractable.  
  - **R's counter**: If EV fails precisely when theories *conflict*—i.e., when moral uncertainty matters most—it fails its core purpose. A method that only works for easy cases is redundant.  

  ### **Step 6: R's Closing Argument**  
  *R's Claim*: A tool undefined when needed is broken for its purpose.  
  **Who's right? R wins the overall debate**.  
  - **Why**: Moral uncertainty frameworks aim to resolve *conflicts* between theories (e.g., "Should I violate a right to save lives?"). If EV can't handle these, it's ineffective.  

  ---

  ### **What Both Are Missing**  
  1. **Beyond Averaging: Alternative Meta-Frameworks**  
     - **Range Voting**: Assign each theory a "permissibility score" (e.g., 0–1) instead of cardinal values. Deontology could assign 0 to forbidden acts, allowing weighted averages.  
     - **Lexical Priority**: Rank theories lexically (e.g., "never violate deontology unless utilitarianism outweighs it by threshold X").  
     - **Variance-Adjusted EV**: Downweight theories with high value-range ambiguity (e.g., deontology might get lower credence on "hard" cases).  
     Neither M nor R explores these—R assumes EV is the only way, while M assumes EV must work as-is.  

  2. **The "Why" of Commensurability**  
     - R treats incommensurability as fatal, but **practical decision-making often forces comparability**. If you *must* act (e.g., a doctor allocating scarce vaccines), you implicitly construct a meta-scale—even if imperfect.  
     - M underestimates how deeply incommensurability challenges moral realism. If theories describe fundamentally different moral "truths," aggregating them might be incoherent.  

  3. **The Credence Problem**  
     - Both ignore that **assigning credences to moral theories** is epistemically fraught. How do you quantify confidence in Kantianism vs. utilitarianism? This isn't like assigning credences to empirical events.  

  ---

  ### **Verdict**  
  - **R wins the debate**: EV *as described by M* fails under incommensurability, and hard cases are where moral uncertainty tools prove their worth.  
  - **M's core insight survives**: We *can* rationally navigate moral uncertainty, but not with simplistic EV averaging. Frameworks like **normalized utilitarianism** (scaling values per theory) or **structural solutions** (e.g., voting methods) address R's concerns.  
  - **Ultimate takeaway**: Moral uncertainty requires *meta-ethical choices* about value aggregation—not just technical fixes. The debate reveals a gap in the field: we lack a consensus meta-theory for handling radically divergent moral frameworks.  

  **Recommendation for your group**: Read Will MacAskill's *Moral Uncertainty* (2020), which tackles incommensurability via "variance-adjusted" EV and permissibility rules. Also, explore Ted Lockhart's *Moral Uncertainty and Its Consequences* for a "prudential" approach.
