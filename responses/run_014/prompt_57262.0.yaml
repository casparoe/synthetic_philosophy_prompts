  First, I need to recall related concepts. Dirty hands is about the leader's moral conflict, not the public's reaction. Agent-regret focuses on the individual's remorse, but here the public suppresses that. Moral residue is the lingering guilt, but the community is dissipating it. The user mentions this isn't whitewashing because the wrongness is acknowledged, not denied. Scapegoating shifts blame elsewhere, but here blame is turned into credit for the actor.

  So, the core elements are: public acknowledgment of the wrong, transformation of the act into valorization, collective absorption of the moral residue, and social pressure against continued remorse. The user needs a term that captures this conversion process. 

  I remember terms like "moral alchemy" or "valorization," but those might not be precise. How about "moral laundering"? It echoes money laundering, where illicit funds are made clean. Here, moral taint is cleansed through social rituals. But is that too vague? "Redemptive valorization" emphasizes the transformation to something positive. The user wants a term that's distinct and not overlapping with existing concepts.

  Boundary cases matter. If victims are compensated, does the phenomenon still occur? Probably, as compensation doesn't negate the valorization. If the leader refuses honors, that might be a different scenario, termed "recalcitrant residue" or something. The audience could be supporters or the whole polity; both might exhibit the phenomenon but with different scales. When does it become propaganda? Maybe when the narrative is state-controlled versus organic public response.

  I think "redemptive valorization" fits. It captures the public's role in redeeming the act through admiration. The definition would specify the conversion of moral taint into social credit via communal narrative. The boundaries include the insistence on the wrong's necessity, transformation rituals, and suppression of lingering guilt. This term doesn't duplicate existing concepts and addresses the user's need for a specific mechanism distinct from individual-focused theories.
answer: |-
  This phenomenon **does not have an established name** in the core literature on political ethics, dirty hands, or moral residue. Your description is precise and novel in its focus on the *social machinery of conversion*. Existing concepts capture adjacent elements but not the core mechanism you identify: **the systematic public transmutation of acknowledged moral taint into social credit for the agent, thereby dissolving the residue and rendering continued agent-regret socially unacceptable.**

  The fitting term is **Redemptive Valorization**.

  Here's the breakdown, arguing for its boundaries and distinctness:

  ### Definition of Redemptive Valorization
  *Redemptive Valorization* occurs when a political community:
  1.  **Explicitly acknowledges** that a leader committed a grave moral wrong (violating a deep normative principle).
  2.  **Simultaneously affirms** that the act was necessary under the circumstances (invoking consequentialist or supreme emergency reasoning).
  3.  **Actively transforms** the markers of the agent's moral burden (anguish, acknowledgment of wrongness, willingness to bear cost) **into public symbols of admirable leadership qualities** (courage, resolve, sacrificial burden-bearing, tragic wisdom).
  4.  **Collectively absorbs and discharges** the moral residue *not* through compensation to the wronged or punishment of the agent, but **by converting it into social esteem and credit bestowed upon the agent.**
  5.  **Enforces a social expectation** that the agent *accept* this valorization and move on; persistent agent-regret or demands for accountability are framed as self-indulgent, obstructive, or disloyal.

  ### Why "Redemptive Valorization" Fits
  *   **Redemptive:** It implies a transformation from a state of moral debt/stain (taint) to a state of restored or enhanced standing. The community "redeems" the act and the actor by re-narrating the burden.
  *   **Valorization:** This directly captures the conversion of negative moral weight into positive social capital (esteem, admiration, credit). It emphasizes the *value-adding* process performed by the audience.
  *   **Distinct from Existing Concepts:**
      *   **Dirty Hands:** Focuses on the *agent's* existential/moral conflict *during* decision-making. Redemptive Valorization is the *public's solution* to the *aftermath* of dirty hands.
      *   **Agent-Regret (Williams):** Describes the *appropriate* first-personal attitude of the agent *towards their own act*. RV is the *social process that renders agent-regret socially inappropriate or superfluous*.
      *   **Moral Residue:** Names the "debt" or "stain" that *should* persist. RV names the mechanism for *socially dissolving* that residue without paying the debt to the creditors (the wronged).
      *   **Moral Licensing (Psych):** Explains how prior good acts *license* subsequent bad acts *for the actor*. RV explains how a *community* uses the *acknowledged bad act itself* to *license bestowing credit* on the actor.
      *   **Whitewashing/Revisionism:** Denies or minimizes the *wrongness* of the act. RV *requires* the acknowledgment of wrongness as the *raw material* for the valorization.
      *   **Scapegoating:** Transfers blame *away* from the responsible agent *onto another*. RV keeps the focus *on* the responsible agent but *transmutes* the blame into credit.
      *   **Cult of Personality/Propaganda:** Often involves denying failures or fabricating virtues. RV is more sophisticated: it uses the *real, acknowledged cost/morality* as the foundation for building esteem. It leverages truth for transformation.

  ### Drawing the Boundaries - Addressing Your Cases
  1.  **Paired with Genuine Compensation?** **Yes, RV can still occur.** Compensation addresses the *victims'* claims. RV addresses the *agent's* moral residue *and* the *community's* need to reconcile with the act/leader. Compensation might even *facilitate* RV by assuaging community guilt, making valorization easier ("We compensated them, now we honor the leader who made the hard choice"). The core mechanism (transmuting taint into credit) remains distinct.
  2.  **Agent Refuses Honors/Demands Blame?** This **disrupts RV and constitutes a distinct phenomenon:** **Rejected Redemption** or **Insistent Residue.** Here, the agent *resists* the social machinery, forcing a confrontation with the un-discharged residue. This highlights RV by contrast – RV requires *complicity* or at least *acquiescence* from the agent. The refusal is a refusal to participate in the valorization ritual.
  3.  **Admiring Audience: Whole Polity vs. Faction?** **RV can operate at both levels, with different implications.** When the *whole polity* engages in RV, it's a powerful legitimizing force, often institutionalized (state ceremonies, official histories). When only a *faction* (e.g., the leader's base) engages in it, it functions more as **Partisan Absolution**, reinforcing in-group loyalty and portraying external criticism as naive or hostile. The core mechanism (transmutation within the admiring group) is the same, but the scope changes its political function.
  4.  **Collapse into Propaganda?** The boundary is **fragile but significant.** RV becomes **mere propaganda** when the acknowledgment of wrongness is *insincere, performative, or minimized* solely to enable the valorization, losing its genuine moral weight. RV *earns its keep* precisely when the wrongness is *authentically acknowledged and felt* by the community *as* wrong, yet the transformation occurs anyway. The "capitalization on the wrongness" requires the wrongness to be *real* within the communal narrative. Propaganda often seeks to erase or distort; RV exploits the acknowledged truth for a transformative purpose.

  ### Conclusion: One Phenomenon, Defined
  Redemptive Valorization is a **single, distinct phenomenon** – the *social alchemy* that converts acknowledged political-moral taint into social credit. It solves the community's problem of reconciling necessary wrongs with ongoing leadership legitimacy by dissolving the problematic residue through esteem. Its core features are the **insistence on the wrongness**, the **transformation of burden into virtue**, the **communal absorption/discharge via credit**, and the **social enforcement against lingering regret.** It stands apart from concepts focusing on the agent's inner state (dirty hands, agent-regret) or mechanisms that deny blame (whitewashing, scapegoating). Its power lies precisely in leveraging the uncomfortable *truth* of the wrongdoing to fuel the redemptive narrative. You've identified a crucial mechanism of political moral psychology that deserves this specific name.
