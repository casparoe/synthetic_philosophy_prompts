    - **How it works**: Eliminate the firm with the fewest first-place votes and redistribute votes until one firm has a majority. In the four-firm case, Dovetail is eliminated first (2 first-place votes), then Cascade (4 first-place votes), then Alder wins 8–7 over Brightwater in the final round.
