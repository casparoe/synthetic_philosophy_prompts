  - **Condorcet Method**:
    - **How it works**: A Condorcet winner (a firm that beats all others head-to-head) is selected if one exists. With no Condorcet winner (as in both the three-firm and four-firm scenarios), a Condorcet-completion method (e.g., Copeland, Schulze) is used to break the cycle.
