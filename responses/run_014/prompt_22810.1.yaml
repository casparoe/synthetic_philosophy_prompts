     Total orders = 100 (small) + 900 (large) = 1000
     Total errors = 2 + 72 = 74
     Overall error rate = 74 / 1000 = 0.074 = 7.4%

   Old Procedure:
     Total orders = 900 (small) + 100 (large) = 1000
     Total errors = 36 + 10 = 46
     Overall error rate = 46 / 1000 = 0.046 = 4.6%

