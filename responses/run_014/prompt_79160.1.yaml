prompt: |-
  For the past term my reading group has been split on the Sleeping Beauty problem, and the two sides have stopped engaging with each other's arguments. One side holds that there is a determinate fact about what the agent's credence in heads should be, fixed by a general principle for updating on self-locating evidence, with the betting and planning arguments merely downstream of that credence. The other side holds that the credence question is unsettled until we say what credences are for — that the betting arguments do not test a prior credence but constitute it, so "what should she believe?" is answerable only relative to a decision problem, if at all. I have been asked to draft the joint statement both sides could sign.

  Produce it as follows. First, a numbered list of agreed claims: about the protocol and what the agent knows at each awakening; about which probability claims are well-defined here; and about what each of the standard arguments (indifference over awakenings, no-new-information, conditionalization on centered evidence, the betting and Dutch-book considerations) does and does not establish. Second, a table of the residual disagreements, each stated in wording the camp that holds it would accept, with the crux for each. Third, for each crux, a case or argument both camps agree bears on it, with each camp's prediction written down in advance.

  Both camps have also agreed to be tested on a variant we devised, for which neither has a stock answer: she is told the whole protocol in advance; a fair coin is tossed; on heads she is woken once; on tails she is woken once, and then a second fair coin is tossed, and she is woken a second time only if that coin lands heads; there is amnesia between awakenings, and no clocks or other cues. Each camp should state its principle as a general rule that delivers an answer for this variant, rather than as an intuition about it, and should say what it would take for that principle to be refuted. Say finally which parts of the dispute, if any, are merely verbal, and what evidence or argument both camps would agree should move the debate. Keep the document free of citations; the group knows the literature.
reasoning: |-
  Hmm, the user describes a deep split in their reading group about the Sleeping Beauty problem. One side thinks credence is fixed by self-locating evidence principles, while the other sees credence as decision-dependent. They want me to draft a joint statement both sides could sign.

  I need to structure this carefully. First, a numbered list of agreed claims: about the protocol, what's well-defined, and what each argument establishes. Both sides agree on the setup: coin flip, awakenings with amnesia, etc. They also agree that "probability of heads" needs careful definition since awakenings aren't independent events. The indifference argument is controversial, no-new-information is disputed but its meaning is agreed, and betting arguments are seen as pragmatic by one side and constitutive by the other.

  For the residual disagreements, I'll make a table with three key divides: (1) whether self-locating evidence fixes credence independently of decisions, (2) whether betting reveals or constitutes credence, and (3) whether "should believe" requires specifying a decision context. The cruxes involve whether Beauty gains new centered evidence upon awakening.

  For the test variant, both sides must apply their general principles. The "fixed credence" camp will use proportional centered evidence to get 1/3 probability of heads (since 2/3 of awakenings follow tails). The "decision-relative" camp will say it depends - e.g., in a bet paid per awakening they'd say credence is 1/3, but in a bet paid once per experiment they'd say 1/2.

  Finally, I'll note the verbal dispute: "credence" means different things to each camp. Both would agree that seeing how their principles handle novel variants like the coin-dependent awakenings should move the debate. The key is to present this neutrally so both sides can endorse it.
answer: |-
  ### Joint Statement on the Sleeping Beauty Problem  

  #### 1. Agreed Claims  
  1.1 **Protocol & Knowledge**:  
     - A fair coin is tossed Sunday night.  
     - *Heads*: Sleeping Beauty (SB) is awakened once on Monday only.  
     - *Tails*: SB is awakened on Monday and Tuesday.  
     - After each awakening, SB is given amnesia-inducing drugs, erasing memory of prior awakenings.  
     - No external cues (e.g., clocks, distinct rooms) distinguish awakenings.  
     - SB knows the entire protocol in advance.  

  1.2 **Well-Defined Probability Claims**:  
     - The *unconditional* probability of heads, *prior to Sunday* (P(Heads) = 1/2), is well-defined.  
     - The probability *from the experimenter’s perspective* (e.g., P(Heads) = 1/2) is well-defined.  
     - The *fraction of experiments resulting in heads* is well-defined (1/2).  
     - **Not well-defined without further stipulation**: The probability "upon an awakening" that the coin is heads. This requires clarification of the *reference class* (e.g., awakenings vs. coin tosses) or the *decision context*.  

  1.3 **Standard Arguments: What They Do and Do Not Establish**:  
     - **Indifference over awakenings**: Suggests that awakenings are equally likely, leading to P(Heads) = 1/3. *Does not establish* that this follows from universally agreed principles; it assumes equiprobability of centered possibilities.  
     - **No-new-information**: Upon awakening, SB gains no new *uncentered* information (coin outcome is unchanged). *Does not establish* that centered evidence (e.g., "this awakening is occurring") is irrelevant or that credence must remain 1/2.  
     - **Conditionalization on centered evidence**: Applies Bayesian updating to self-locating beliefs (e.g., using the "halfer" or "thirder" rule for dividing credence). *Does not establish* which updating rule is correct without prior agreement on the framework.  
     - **Betting/Dutch-book arguments**: Show that betting behavior consistent with P(Heads) = 1/3 avoids sure losses in wagers paid *per awakening*, while P(Heads) = 1/2 avoids sure losses in wagers paid *per coin toss*. *Do not establish* which strategy is "correct"; they demonstrate pragmatic implications of each credence.  

  ---

  #### 2. Residual Disagreements  
  | Disagreement | Camp A ("Fixed Credence") | Camp B ("Decision-Relative Credence") | Crux |  
  |--------------|----------------------------|----------------------------------------|------|  
  | **Nature of credence** | Credence in heads upon awakening is fixed by principles for updating on self-locating evidence, independent of decision problems. | Credence is undefined absent a decision problem; "belief" is constituted by its role in guiding action (e.g., betting). | **Does centered evidence upon awakening determine a unique *epistemic* credence?** |  
  | **Role of betting arguments** | Betting tests pre-existing credences; they reveal but do not define belief. | Betting (and planning) contexts *constitute* what credence means; no "belief" exists independently. | **Do betting scenarios *measure* or *define* rational credence?** |  
  | **Scope of "should believe"** | "What should SB believe?" has a determinate answer (1/2 or 1/3) given the evidence and updating rules. | "What should SB believe?" is ill-posed until a decision problem (e.g., bet type) is specified. | **Is "rational credence" separable from practical reasoning?** |  

  ---

  #### 3. Cruxes and Test Predictions  
  For each crux, both camps agree on the relevance of the following case/argument and commit to their predictions:  

  - **Crux 1: Does centered evidence determine unique epistemic credence?**  
    - **Test**: SB awakens and learns *this is the only awakening in the experiment*. Both camps agree this *should* shift her credence in heads to 1.  
      - *Camp A prediction*: This confirms that centered evidence alone fixes credence (e.g., via conditionalization).  
      - *Camp B prediction*: This shows credence responds to evidence, but only within a decision-relevant framework.  

  - **Crux 2: Do betting scenarios measure or define credence?**  
    - **Test**: In the classic problem, SB is offered a bet on heads that pays $30 if correct and costs $15 if wrong, *settled once per experiment*.  
      - *Camp A prediction*: SB should accept the bet iff her epistemic credence in heads > 1/3, regardless of payment structure.  
      - *Camp B prediction*: SB should accept iff she calculates positive expected utility *for this specific bet* (e.g., P(Heads) = 1/2 supports accepting).  

  ---

  #### 4. Test Variant: Coin-Dependent Awakenings  
  **Protocol**:  
  - Fair coin C1 tossed Sunday.  
  - *Heads (H1)*: SB awakened once (Monday).  
  - *Tails (T1)*: SB awakened once (Monday), then a second fair coin (C2) is tossed:  
    - *Heads (H2)*: SB awakened again (Tuesday).  
    - *Tails (T2)*: No second awakening.  
  - Amnesia between awakenings; no cues. SB knows protocol in advance.  

  **Camp A Principle**:  
  - *General rule*: Credence in H1 upon awakening equals the proportion of *centered worlds* where H1 is true.  
    - Calculation: 3 possible centered awakenings (H1-mon, T1-mon, [T1+H2]-tue). H1 true in 1/3. ∴ **P(H1) = 1/3**.  
  - *Refutation condition*: If a scenario arises where this rule yields counterintuitive action (e.g., rejecting a +EV bet).  

  **Camp B Principle**:  
  - *General rule*: Credence depends on the decision problem.  
    - *Bet per awakening*: P(H1) = 1/3 (since 2/3 of awakenings follow T1).  
    - *Bet per coin toss*: P(H1) = 1/2 (since C1 is fair).  
  - *Refutation condition*: If a single decision problem forces inconsistent choices under their framework.  

  ---

  #### 5. Verbal Disagreements and Path Forward  
  - **Merely verbal**: Dispute over the meaning of "credence." Camp A uses it for *epistemic attitude*; Camp B for *decision-guiding weight*.  
  - **Evidence to move the debate**: Both camps agree that analyzing **novel variants** (e.g., the coin-dependent case) where principles yield divergent, testable predictions for *the same decision* (e.g., a bet with ambiguous payment structure) could resolve the disagreement. Specifically, a scenario where:  
    - Camp A’s credence + EU maximization contradicts Camp B’s context-specific credence.  
    - Example: A bet offered *during an awakening* that is settled *per experiment* but paid *only if SB accepts in all awakenings*.  

  ---  
  *Both parties endorse this statement as a foundation for renewed dialogue.*
