  I just got done having a long argument with a friend about whether Jain anekāntavāda is a genuine theory of truth or just a rhetorical stance for tolerating disagreement. I have a working knowledge of the doctrine — the many-sidedness of things, the habit of prefixing every judgment with syād, roughly "in some respect," and the seven-fold formula (saptabhaṅgī) that runs a predicate through affirmation, denial, both, and the unsayable. Could you restate the main analytic theories of truth — correspondence, coherentism, and deflationism — in that Jain vocabulary, one by one? For each, tell me what translates cleanly, what has to be distorted to fit the syādvāda frame, and what has no expression at all. Then give me the residue report: does whatever doesn't carry over point to something the analytic debate is missing, or to something the Jain framework cannot say? I want to know whether my friend is right that anekāntavāda is a stance on disagreement rather than a claim about what makes a statement true.
