answer: |-
  Your observation cuts to the heart of a sophisticated debate in philosophy of mind, aesthetics, and cognitive science. You've precisely identified a *mechanism* underlying the paradox of fiction, rather than merely restating the paradox itself. The established term for this specific configuration is **cognitive impenetrability of emotion**, often discussed within frameworks like **modularity of mind** or the theory of **alief**.

  Let's dissect this concept, its boundaries, and its relationship to the paradox:

  1.  **The Core Concept: Cognitive Impenetrability**
      *   **Definition:** A cognitive state (like an emotion or perceptual process) is "impenetrable" when it is not directly influenced or modified by higher-level cognitive states (like explicit beliefs, knowledge, or judgments), even when those beliefs logically contradict the emotion's content.
      *   **Applied to Fiction:** Your explicit belief ("This character is not real; his choices have no consequences") is *cognitively penetrable* – you can access and reason with it. However, your emotional response (frustration *at him*) is generated by a system that is relatively *impenetrable* to that specific belief. The emotional module operates using its own inputs (perceptions of the narrative situation, character traits, goals, potential threats/rewards) and outputs the appropriate feeling *without consulting* the belief system that knows it's all fictional.
      *   **Carving Nature at its Joints:** This concept carves reality at the level of cognitive architecture. It posits that the mind is not a single, unified reasoning engine, but rather composed of semi-independent subsystems ("modules") specialized for different tasks (perception, emotion, belief formation, motor control). These modules can operate simultaneously and even produce conflicting outputs (belief vs. emotion) because they don't always share all relevant information or have veto power over each other.

  2.  **Key Boundaries of the Concept:**
      *   **Not Suspension of Disbelief (SoD):** You're correct. SoD is typically understood as a *volitional* or *implicit agreement* to *temporarily ignore* or *bracket* the knowledge of fictionality to enhance immersion. Your case involves *no suspension* – the belief remained fully active and accessible. Impenetrability explains how the emotion fires *despite* the active belief, not because the belief is temporarily deactivated.
      *   **Not Simple Irrationality:** This isn't just being "illogical." It's a feature of the system's design. The emotional system evolved to react quickly to perceived threats/opportunities (like seeing a tribe member make a bad alliance), prioritizing speed over exhaustive reality-checking. Fiction exploits this efficient, but sometimes context-blind, mechanism.
      *   **Not Universal:** Impenetrability isn't absolute. *Some* emotions *can* be modulated by belief (e.g., knowing a monster isn't real *can* reduce terror, though not always eliminate the jump-scare reflex). The degree of impenetrability varies by emotion type, intensity, context, and individual. Frustration or fear triggered by immediate, vivid depictions might be highly impenetrable; complex moral outrage or intellectual satisfaction might be more belief-sensitive.
      *   **Not Necessarily "Alief" (But Related):** Tamar Szabó Gendler's concept of **alief** is highly relevant. An alief is an automatic, associative, gut-level state combining affective, behavioral, and cognitive elements (e.g., feeling fear *as if* the monster is real, even while believing it isn't). Aliefs often operate alongside beliefs and can drive impenetrable emotional responses. Impenetrability describes the *functional separation* allowing alief and belief to coexist; alief describes the *content* of the automatic state. They are complementary concepts addressing different aspects of the same phenomenon.

  3.  **Relation to the Paradox of Fiction:**
      *   **The Paradox (Standard Formulation):** How can we feel genuine emotions (e.g., fear, sadness) towards characters/events we know to be fictional? This seems irrational because emotions typically require belief in the existence/truth of their objects.
      *   **How Impenetrability Addresses/Reframes It:**
          *   **Dissolves the "Requires Belief" Assumption:** Impenetrability challenges the premise that emotions *necessarily* require corresponding existential beliefs. It shows that emotional systems often operate on perceptual and imaginative inputs *directly*, bypassing the belief system's assessment of reality. Your frustration requires only the *perception* (via the narrative) of a bad decision by a valued agent, not the *belief* that the agent exists.
          *   **Explains the Mechanism:** It doesn't *solve* the paradox in the sense of proving emotional responses to fiction are "rational" in a strict logical sense. Instead, it provides a *causal explanation* for *why* the paradox arises: because the emotional system is architecturally isolated enough that it *can* be triggered by imaginary scenarios without needing approval from the belief system that knows they are imaginary. It shifts the question from "How is this possible logically?" to "How is this implemented cognitively?"
          *   **Reframes the Puzzle:** The enduring puzzle becomes less about reconciling emotion and belief *logically* at a single moment (which impenetrability shows isn't demanded by the system's design), and more about understanding the *evolutionary and functional reasons* for having emotional systems that are relatively impenetrable, and how artistic practices exploit this architecture. It also raises questions about the *degree* and *limits* of impenetrability.

  4.  **Does it Solve or Just Redescribe?**
      *   **Redescription?** To some extent, yes. It provides a *model* ("parallel tracks," "modules") for *how* the conflicting states can coexist. It replaces the opaque term "paradox" with a mechanistic description.
      *   **Solves?** It *resolves* the apparent contradiction by showing that the conflict isn't a logical flaw in the subject's reasoning at that moment, but an inherent feature of the underlying cognitive machinery. It explains *why* suspension of disbelief isn't necessary for the emotional response. In this sense, it dissolves the *sting* of the paradox by revealing its roots in functional architecture, not logical error. However, it doesn't eliminate the fundamental *mystery* of subjective experience – why do these neural/functional states *feel* like genuine fear or frustration? That's the harder problem of consciousness.

  **In Conclusion:**

  Your experience is a textbook example of the **cognitive impenetrability of (certain) emotional responses**. This concept, grounded in theories of **mental modularity** and often discussed alongside **alief**, explains how evolutionarily ancient, fast-processing emotional systems can be triggered by simulated inputs (fiction) while higher-level, slower belief systems maintain full awareness of the simulation. It doesn't negate the broader paradox of fiction but provides its crucial *mechanistic underpinning*, moving the discussion from "How can this be rational?" to "How is this system built and why does it work this way?" It successfully carves out a specific cognitive architectural feature as the key driver of the phenomenon you describe, distinguishing it clearly from suspension of disbelief and highlighting the non-unitary nature of the mind. Thinkers like Jerry Fodor (modularity), Tamar Szabó Gendler (alief), and cognitive scientists studying emotion (e.g., Joseph LeDoux's work on fear pathways) provide the foundations for this understanding.
