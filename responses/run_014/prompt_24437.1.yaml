prompt: |-
  i'm putting together a seminar on the Hart-Devlin exchange and i keep seeing people just restate the harm principle vs. legal moralism without noticing that Devlin's own argument is weirder than the label suggests. before i commite to reading anything further i want the spec: what does a theory of the proper scope of the criminal law with respect to private morality have to deliver to count as adequate -- good enough to tell a legislator which of the cases the Wolfenden report actually had to decide (consual homosexuality between adults in private, prostitution, drug use for pleasure, obscenity) it should keep, decriminalise, or leave alone? write out the desiderata: the cases it has to get right, the distinctions it can't seperate (harm to others vs. offense vs. mere disapproval; persuading vs. coercing; a moral view being true vs. being widely and intensely held; the public/private boundary itself), and the arguments it has to answer, including Devlin's claim that a society needs a shared body of moral beliefs held with enough intensity or it will fall apart, and his own concession that the law can't enforce every norm the majority dislikes. give the consideration behind each desideratum, and mark which are non-negotiable and which are just prejudices of one camp. then flag any pair you suspect can't be jointly satisfied -- i'm particularly curious whether the requirement that the state justify its moral legislation to the coerced person on grounds that person can in principle recognise and the requirement that the majority's moral convictions count as a legitimate ground for enforcement even when the minority thinks they're wrong can live together. and then, briefly, how the harm principle and Devlin's intensity limit do against the list, but keep the weight on the criteria. finally, say how confident you are in the list overall and single out the one point you're least sure of -- like whether Devlin's case is really a consequentialist one about the social fabric or a deontological one about the law having to express moral truth.
reasoning: |-
  Okay, the user is putting together a seminar on the Hart-Devlin debate and is frustrated that people oversimplify it as just "harm principle vs. legal moralism." They want a detailed specification of what a theory about criminal law and private morality needs to deliver to be adequate. 

  First, I need to unpack their core request. They want desiderata for evaluating such theories, specifically focused on the Wolfenden report cases (homosexuality, prostitution, drugs, obscenity). The criteria must cover necessary distinctions, arguments to address (especially Devlin's social cohesion point), and potential incompatibilities between principles. 

  Hmm, the user is clearly academically sophisticated—they're aware of nuances like Devlin's "intensity" threshold and the tension between majority enforcement and justification to the coerced. Their frustration suggests they've seen shallow treatments of the debate. I should avoid restating basics and dive straight into granular criteria. 

  Key angles to cover:
  - **Case coverage**: Must handle all Wolfenden scenarios distinctly, not just homosexuality. That's non-negotiable since they explicitly listed them. 
  - **Conceptual distinctions**: Harm vs. offense vs. mere disgust, persuasion vs. coercion, etc.—these are the knives any theory must wield cleanly. 
  - **Devlin's weirdness**: His "society will disintegrate without shared morals" claim isn't standard moralism; it's quasi-sociological. But is it consequentialist or deontological? I'm least sure here (noted later). 
  - **The big tension**: Can a theory both respect majority moral convictions *and* demand justifications acceptable to the coerced minority? Feels like the crux. 

  For structure: I'll draft desiderata in priority order, mark non-negotiables (e.g., handling all Wolfenden cases), and flag conflicts. Then pit Hart and Devlin against them briefly. 

  User's subtext: They suspect Devlin is misrepresented. I agree—his "intensity" limit *does* weirdly constrain majority rule. I'll highlight that. 

  Confidence check: The list feels solid except Devlin's foundation. Is social cohesion empirical (study it!) or axiomatic (just believe it)? I'll note uncertainty. 

  Final touch: Keep Wolfenden cases as the concrete yardstick. Theories must *apply*, not just philosophize.
answer: |-
  Here's a specification for a theory of criminal law and private morality, designed to rigorously assess frameworks like Hart's Harm Principle or Devlin's Legal Moralism against the Wolfenden Report's concrete cases, while capturing Devlin's nuances:

  **Core Desiderata for an Adequate Theory:**

  1.  **Case Resolution (Non-Negotiable):** The theory *must* deliver specific, defensible prescriptions for the Wolfenden core cases:
      *   Consensual adult homosexuality in private
      *   Prostitution (solicitation, brothel-keeping, acts)
      *   Recreational drug use by adults
      *   Possession/distribution of obscene material by/among adults in private
      *   *Consideration:* A theory is useless to a legislator if it cannot generate clear answers for the paradigmatic hard cases it was designed to address. Vagueness here is a fatal flaw.

  2.  **Conceptual Distinctions (Non-Negotiable):** The theory *must* provide principled, operational ways to distinguish:
      *   **Harm to Others (Physical/Psychological/Significant Setback to Interests):** vs. **Profound Offense (e.g., witnessing deeply abhorrent acts):** vs. **Mere Moral Disapproval/Disgust.**
          *   *Consideration:* Legitimacy hinges on why coercion is used. Preventing harm is widely accepted; enforcing disgust is highly suspect. Offense is contested territory.
      *   **Coercion (Law):** vs. **Persuasion (Education, Argument, Social Pressure).**
          *   *Consideration:* The unique power and violence inherent in law demands justification beyond mere disagreement.
      *   **Truth/Correctness of a Moral View:** vs. **Its Factual Widespread Acceptance and Intensity of Feeling** within the society.
          *   *Consideration:* Devlin explicitly bases enforcement on the latter ("intense feeling," "right-minded man"), rejecting the former as unknowable by law. A theory must clarify its grounding.
      *   **Public Sphere:** vs. **Private Sphere.**
          *   *Consideration:* The location and visibility of conduct matter intuitively and legally (e.g., nuisance vs. private act). A theory must define this boundary and justify its relevance.

  3.  **Argument Engagement (Non-Negotiable):** The theory *must* explicitly address:
      *   **Devlin's Social Cohesion Thesis:** The claim that a society requires a shared, intensely held "public morality" as its fundamental, invisible binding force, and that its disintegration leads to societal collapse.
          *   *Consideration:* This is Devlin's unique core argument, distinct from simple majoritarian moralism. Ignoring it misrepresents the debate.
      *   **Devlin's "Intensity Limit":** His concession that *not* every disliked practice can/should be criminalized, only those evoking "intolerance, indignation, and disgust" akin to feelings about treason.
          *   *Consideration:* This is Devlin's *own* limiting principle, making his view more nuanced than crude legal moralism. A theory must explain why *this* limit (or a different/better one) is used.
      *   **The Liberal Challenge:** The requirement that state coercion, especially over private conduct, requires justification *to the coerced* on grounds they could, *in principle* (even if they disagree), recognize as reasonable/legitimate.
          *   *Consideration:* Fundamental to liberal legitimacy and avoiding pure tyranny of the majority. Rooted in ideas of reciprocity and respect for persons.

  4.  **Majority Conviction vs. Minority Justification (Crucial Tension):** The theory *must* grapple with the potential conflict between:
      *   Allowing the deeply held moral convictions of the majority to justify criminalization (especially if tied to social cohesion).
      *   Requiring justification to the coerced minority on grounds *they* could recognize as legitimate (beyond "because we find it disgusting and we're the majority").
      *   *Consideration:* This is the **core tension** you identified. Can "The majority sincerely believes this is essential glue holding us together" count as a reason the minority could *in principle* recognize as legitimate, even if they reject the moral view itself? Or is this inherently oppressive? A theory *must* take a stance here.

  **Potential Incompatibilities (Flagged):**

  *   **The Core Tension (#4):** Satisfying both "Majority Conviction as Ground" and "Justification Recognizable to Coerced Minority" seems deeply problematic. Can a reason rooted purely in the majority's intense feeling (or perceived societal need) *ever* be a reason the minority (who reject both the feeling and the need) could recognize as legitimate justification for *coercing them*? This may require:
      *   Denying one requirement (e.g., Devlin downplays the need for minority recognition; strict Harm Principle denies majority feeling alone as sufficient ground).
      *   Finding common ground *beyond* the specific moral belief (e.g., "We all have a fundamental interest in social stability, evidence shows banning X is crucial for that" – but evidence is Devlin's weak point).
      *   Re-framing legitimacy procedurally rather than substantively for the minority ("Your views were heard in the democratic process").

  **Assessment Against the Desiderata (Brief):**

  *   **Harm Principle (Mill/Hart):**
      *   *Strengths:* Clear on distinctions #2 (focuses squarely on harm to others), strongly satisfies Liberal Challenge (#3), provides clear (if contested) answers to Wolfenden cases (#1 - generally decriminalize all listed private acts).
      *   *Weaknesses:* Struggles profoundly with Devlin's Social Cohesion Thesis (#3) – often dismisses it as empirically unfounded/speculative or morally irrelevant. Explicitly *rejects* Majority Conviction (#4) as sufficient ground. May struggle with defining "harm" clearly (e.g., indirect harms, harm to self, profound offense).

  *   **Devlin's Legal Moralism (with Intensity Limit):**
      *   *Strengths:* Directly addresses Social Cohesion Thesis (#3), incorporates Intensity Limit (#3) as a constraint, potentially satisfies Majority Conviction (#4) as a legitimate ground (if social cohesion is accepted).
      *   *Weaknesses:* Fails the Liberal Challenge (#3) spectacularly – justification to coerced is "society needs this, and we intensely feel it's immoral". Provides contested answers to Wolfenden cases (#1 - potentially criminalize all, depending on intensity). Blurs distinctions #2 (especially harm vs. disgust, truth vs. intensity). Relies on empirically dubious claims about societal disintegration.

  **Confidence & Uncertainty:**

  *   **Overall Confidence in List: High (8/10).** The desiderata directly stem from the Hart-Devlin debate's core claims, the Wolfenden Report's practical focus, and fundamental questions of political legitimacy. They force engagement beyond slogans.
  *   **Point of Least Certainty: Devlin's Foundational Claim.** Is Devlin's argument fundamentally:
      *   **Consequentialist:** Society *will empirically disintegrate* without shared, intensely held public morality enforced by law. (This is how Hart attacks it, demanding evidence).
      *   **Deontological/Conceptual:** A society just *is* (by definition) a community of ideas bound by shared fundamental morality; allowing attacks on that morality *is* allowing attacks on society itself, regardless of empirical consequences. Law *must* defend this constitutive element.
      *   Or a **hybrid?** He often uses consequentialist language ("disintegration"), but his definition of society and the "right-minded man" standard lean conceptual. **This ambiguity is crucial.** If purely consequentialist, it's vulnerable to empirical refutation. If conceptual/deontological, it's a much deeper challenge to liberalism based on a different view of what society *is*. I lean towards it being primarily a **quasi-sociological, weakly consequentialist claim** that Hart effectively critiqued on evidentiary grounds, but the conceptual/deontological undertones give it lingering force for those who share his communitarian premises.

  **Conclusion:** This spec forces theories to move beyond labels. A truly adequate theory must resolve the concrete cases, make crucial distinctions, engage Devlin's unique social cohesion/intensity argument head-on, confront the core tension between majority feeling and minority justification, *and* clarify the basis of Devlin's central claim. Neither Hart nor Devlin fully satisfies the list, highlighting the enduring difficulty of the problem. Your seminar will be much stronger for focusing on these specifics.
