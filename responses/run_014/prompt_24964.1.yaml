answer: |-
  Your objection is astute but ultimately misapplies the Fregean framework. While Mary pre-release possesses exhaustive physical facts about color vision—neural states, wavelengths, etc.—she lacks acquaintance with the phenomenal character itself. Crucially, modes of presentation are *conceptual*, but phenomenal knowledge involves *non-conceptual* acquaintance: Mary gains a direct, subjective *relation* to the experience, not merely a new description. In the Hesperus case, both "guises" are third-person descriptive concepts; Mary’s post-release knowledge introduces a *first-personal, qualitative mode of access* irreducible to any physical-functional description. 

  Moreover, physical facts are structural-dynamical, while phenomenal facts are intrinsic and subjective. The neural correlate is not *what it is like*; it’s what *causes* or *correlates* with it. When Mary learns what red looks like, she doesn’t just redescribe a physical fact—she discovers an intrinsic property that was *nowhere represented* in the physical ontology. If it were merely a new guise, her post-release knowledge should be deducible from physical facts plus conceptual analysis, yet Jackson’s point is that no amount of structural knowledge entails the qualitative character. The epistemic gap here reveals an ontological gap.

