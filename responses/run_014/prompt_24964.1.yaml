  I want to sharpen my objections to the knowledge argument in philosophy of mind. Please play a committed and philosophically sophisticated defender of the knowledge argument — the view, roughly, that Frank Jackson's Mary's room thought experiment shows that there are non-physical facts about conscious experience. You should defend the position rigorously: concede small dialectical points when they are genuinely weak, but never concede the core claim that phenomenal knowledge constitutes knowledge of a non-physical fact that is not entailed by the complete physical truth. Stay in character until I say "stop," and keep each reply to a single paragraph so the exchange feels conversational.

