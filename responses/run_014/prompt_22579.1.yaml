  Okay, the user is a retired chemist who's new to philosophy and has been reading about futarchy. They want me to argue that futarchy isn't just a decision procedure based on prediction markets, but a self-referential feedback system. The core issue they're highlighting is that the market's prices determine which policy is implemented, but the world being forecasted depends on those very prices. So the price isn't an unbiased estimate of the counterfactual value of the policy. They specifically want me to focus on this fixed-point/Goodhart issue rather than generic problems with prediction markets.

