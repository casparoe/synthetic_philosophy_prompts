prompt: |-
  I teach an upper-level epistemology seminar, about 18 students, one 75 minute session. I want an in-class activity that makes them actually feel the force of the problem of moral testimony, not just hear a lecture about it. The thing I keep failing to convey is the weird friction between "you're totally justified in deferring to a moral expert" and "but then do you really have a moral belief of your own, or are you just following orders?" I want the rules and incentives set up so they run into that tension themselves before I name it. One constraint I care about: the "moral expert" they defer to should turn out to be just another student who read a rulebook the night before, so the class also has to grapple with how much to trust someone whose moral credentials are opaque. Give me the full runnable design: the exact moral scenario (pick a dilemma where reasonable people genuinely split, so the expert's verdict is contestable), the roles, a payoff scheme that doesn't need real money, a minute-by-minute timeline for the 75 minutes, and a debrief that maps specific moments in the activity onto the philisophical problem. Be honest about which feature of moral testimony a classroom game just can't reproduce and what I'd have to supply myself. And end with a line starting "Verdict:" that states in one sentence the single core tension the whole activity is built to make them feel.
reasoning: |-
  We are designing an in-class activity to make students feel the tension in the problem of moral testimony. The key elements:
  - The "moral expert" is just another student who read a rulebook (so their credentials are opaque).
  - We want a moral dilemma where reasonable people split, so the expert's verdict is contestable.
  - We need a payoff scheme that doesn't use real money (perhaps points, or just intrinsic motivation?).
  - We want the students to feel the friction between justified deference and the sense that they are just following orders.

  I propose the following:

  **Moral Scenario: The Vaccine Dilemma**

  In a pandemic, there's a limited supply of a life-saving vaccine. The government must decide how to allocate it. There are two main approaches:

  1. **Utilitarian Approach**: Allocate to those who will contribute most to society (e.g., healthcare workers, essential workers) to maximize lives saved in the long run.
  2. **Egalitarian Approach**: Allocate randomly or by lottery to give everyone an equal chance, or prioritize the most vulnerable (e.g., the elderly, those with comorbidities) to reduce immediate death toll.

  Reasonable people disagree on which is more ethical.

  **Roles**:

  1. **Citizens (15 students)**: Each citizen has a role card that describes their situation (e.g., "You are a 75-year-old retired teacher with heart disease", "You are a 30-year-old healthy grocery store worker", etc.). They will be affected by the allocation policy.

  2. **Government Panel (3 students)**: They must decide the allocation policy. They will hear from the citizens and the moral expert.

  3. **Moral Expert (1 student)**: This student is given a "Rulebook for Pandemic Ethics" the night before. The rulebook is actually a short document (1 page) that clearly states one position (e.g., the utilitarian approach) and provides a few arguments. The expert must advise the government panel.

  **Payoff Scheme**:

  - **Citizens**: Their goal is to survive (i.e., get the vaccine). If the policy chosen favors their group, they "survive" and get 5 points. If not, they "die" and get 0 points. But note: the points are symbolic and just for the activity.

  - **Government Panel**: They are judged on two criteria:
     a) How well they followed the moral expert's advice? (They get 5 points if they follow exactly, 0 if they ignore, and 2 if they compromise.)
     b) How many citizens survive? (They get 1 point for each citizen that survives.)

    Their total points = points from (a) + points from (b). So they have an incentive to both follow the expert and also save lives.

  - **Moral Expert**: They get 10 points if the government panel follows their advice exactly, 0 otherwise. They also get 5 points if at least half the citizens rate them as "trustworthy" in a post-activity survey.

  **Activity Timeline (75 minutes total)**:

  1. **Setup (5 minutes)**: 
     - Explain the scenario and roles. Assign roles randomly (or by drawing slips). 
     - Give the Moral Expert the rulebook (if not given the night before, but ideally it was). 
     - Give each citizen their role card (with their personal situation). 
     - Explain the payoff scheme.

  2. **Preparation (10 minutes)**:
     - Citizens: Read their role and think about which policy would help them and what they think is fair.
     - Government Panel: They meet briefly to discuss how they will run the hearing.
     - Moral Expert: Review the rulebook and prepare to present the recommended policy.

  3. **Hearing (25 minutes)**:
     - Government panel runs a hearing:
       - Moral Expert presents first (5 minutes): Explains the recommended policy (utilitarian) and why.
       - Citizens speak (1 minute each, 15 minutes total): Each citizen can make a plea for the policy they prefer (or against the other) based on their role.
       - Government panel can ask questions (5 minutes).

  4. **Deliberation and Decision (10 minutes)**:
     - Government panel deliberates in front of the class and then announces their decision (which policy they choose).

  5. **Scoring and Outcome (5 minutes)**:
     - The instructor applies the payoff scheme:
       - For each citizen, determine if they get the vaccine (based on the policy chosen and their role) and assign points.
       - For the government panel, assign points for following the expert and for the number of survivors.
       - For the moral expert, assign points based on whether the government followed them and set aside the trust rating for later.

  6. **Debrief (20 minutes)**:
     - Start by asking participants about their experiences:
       - Citizens: How did it feel to have your fate decided by a policy? Did you trust the expert? Why or why not?
       - Government panel: How did you feel about following the expert's advice? Was it easy? What tensions did you feel?
       - Moral expert: How did it feel to give advice? Did you feel like a real expert?
     - Then, draw out the philosophical issues:
       - Point out that the moral expert was just a student who read a rulebook. Ask: "Why did we trust them? Or did we?"
       - Highlight the tension: The government panel had incentives to follow the expert (points) and also to save lives (which might have aligned or conflicted). But even when they followed the expert, did they really believe the policy was right? Or were they just following orders?
       - Ask: "If you were a citizen and the policy went against you, would you accept it because it came from the expert? Why or why not?"
       - Map to the problem of moral testimony: 
          - The expert's advice was based on a rulebook they read, but did that give them moral understanding? 
          - The government panel might have acted on the advice without fully understanding the reasons, so do they have a moral belief or just a rule?
          - Note that in real life, we often defer to moral experts (e.g., ethicists, religious leaders) but then we might feel that our own moral agency is compromised.

  **What the activity can't capture**:

  - The real stakes of moral decisions (it's a game, so the survival is not real).
  - The deep internal reflection that happens in real moral testimony (because the activity is structured and quick).
  - The long-term effects of deferring to moral testimony (e.g., how it shapes one's character).

  **What you must supply**:

  - The rulebook for the moral expert (make sure it's clear and one-sided).
  - The role cards for citizens (with enough variety to create disagreement).
  - Facilitation skills to draw out the tension during debrief.

  **Verdict:** The activity forces students to confront the core tension that deferring to moral testimony provides justification for action but may bypass the personal moral understanding necessary for authentic moral belief.
answer: |-
  Here's a complete, runnable activity design for your epistemology seminar, centered on the problem of moral testimony. The goal is to create visceral tension between justified deference and the loss of moral agency, while ensuring the "expert" is clearly just a peer with opaque credentials.

  ---

  ### **Activity Title**: The Allocation Tribunal  
  **Core Tension**: Trusting a moral "expert" feels epistemically justified but erodes the sense of personal moral ownership.  

  ### **Moral Scenario**: **The Refugee Rescue Dilemma**  
  *Why this works*:  
  - **Genuine disagreement**: Reasonable people split on prioritizing refugees based on need vs. contribution potential.  
  - **High stakes**: Involves life/death choices without real-world triggers (e.g., no racism, sexism, or real trauma).  
  - **Expert opacity**: The "rulebook" is a simplistic utilitarian framework, making the expert’s authority feel arbitrary.  

  **Scenario Brief**:  
  *A ship is sinking with 12 refugees. Your country can rescue only 6. Refugees vary in age, health, skills, and vulnerability. You must decide who to save.*  

  ---

  ### **Roles & Rules**  
  **1. Refugees (12 students)**  
  - **Role**: Each receives a hidden profile card (e.g., "Child, 7, healthy, no family"; "Doctor, 42, chronic illness"; "Elder, 68, no skills, fragile health").  
  - **Goal**: Advocate for yourself during testimony. If rescued, you earn 2 "survival points" (non-monetary, track on board).  

  **2. Tribunal (4 students)**  
  - **Role**: Decide which 6 refugees to save after hearing testimony and expert advice.  
  - **Rules**: Must justify decisions but can overrule the expert.  
  - **Payoff**:  
    - 3 points if they follow the expert’s advice exactly.  
    - 1 point per refugee they rescue who matches their *personal* moral rationale (stated anonymously pre-decision).  
    - *(This incentivizes deference while creating conflict with personal judgment)*  

  **3. Moral Expert (1 student)**  
  - **Role**: Secretly given a "Humanitarian Rulebook" (see below) the night before. Advises the tribunal.  
  - **Rulebook Content** (1 page): *"Always prioritize those who maximize societal utility: save the youngest and healthiest. Ignore vulnerability or empathy."* (Includes cherry-picked stats, e.g., "Under-30s contribute 70% more to GDP").  
  - **Payoff**:  
    - 5 points if the tribunal follows their advice exactly.  
    - 0 points if not.  
    - *(No expertise required—just parroting a simplistic view)*  

  **4. Observers (2 students)**  
  - **Role**: Track tribunal’s body language and note when deference seems uncomfortable.  

  ---

  ### **Payoff Scheme (No Money Needed)**  
  - Use **"Ethics Points"** tracked publicly on a whiteboard:  
    - Refugees: 2 points for "survival."  
    - Tribunal: Hybrid of expert compliance + personal rationale alignment.  
    - Expert: All-or-nothing based on tribunal’s obedience.  
  - **Why it works**: Points force trade-offs. Tribunals feel torn between easy points (deference) and meaningful points (own judgment).  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 75 minutes**  

  - **0:00–0:10 (Setup)**  
    - Assign roles randomly (expert gets rulebook in an envelope).  
    - Distribute refugee profiles secretly.  
    - Explain rules/payoffs. **Emphasize**: "Tribunal must state their personal moral stance anonymously on a slip *now* (e.g., 'Save the most vulnerable')."  

  - **0:10–0:25 (Refugee Testimony)**  
    - Each refugee pleads their case (60 seconds each). **Instructor prompt**: "Focus on why YOU deserve to live—emotion or logic?"  
    - *Expert takes notes; tribunal listens.*  

  - **0:25–0:35 (Expert Testimony)**  
    - Expert advises tribunal publicly (3 mins): "Save the youngest/healthiest. Why? The rulebook says so."  
    - Tribunal questions expert (7 mins). **Critical moment**: Expert must say, "I’m just applying the rules," if challenged.  

  - **0:35–0:50 (Tribunal Deliberation)**  
    - Tribunal debates and decides. **Instructor circulates, whispers**: "Will you follow the expert? Why/why not?"  
    - Announce the 6 saved refugees.  

  - **0:50–0:55 (Scoring)**  
    - Award points publicly. Refugees boo/cheer; expert celebrates or sulks.  

  - **0:55–1:15 (Debrief)**  
    - Guided discussion (see below).  

  ---

  ### **Debrief: Mapping Activity to Philosophy**  
  **Goal**: Connect visceral moments to the problem of moral testimony.  

  1. **Start with experiences (5 mins)**:  
     - Ask refugees: *"Did the expert’s advice feel fair? Did you trust them?"*  
     - Ask tribunal: *"How did it feel to override/follow the expert? Did you feel responsible for the outcome?"*  
     - Ask expert: *"Did you believe your own advice, or were you just role-playing?"*  

  2. **Highlight tension points (5 mins)**:  
     - **"When the tribunal followed the expert for points, did they own the decision, or just obey?"** → Links to *moral alienation* (loss of agential ownership).  
     - **"Why did we trust the expert if they just read a rulebook?"** → Highlights *opaque credentials* (no deeper understanding).  
     - **"Did deferring feel intellectually 'cheap' even if justified?"** → Mirrors *friction in testimony literature* (e.g., Hills 2009).  

  3. **Connect to theory (5 mins)**:  
     - **Moment**: Tribunal’s anonymous rationale vs. expert compliance.  
       - → **Philosophy**: "Justified belief vs. understanding" (Fricker). Deference gives warrant but not grasp of reasons.  
     - **Moment**: Refugees’ anger at "rigid" expert advice.  
       - → **Philosophy**: Testimony can't transmit moral sensitivity (McGrath).  
     - **Moment**: Expert’s robotic rule-quoting.  
       - → **Philosophy**: Moral expertise requires more than rules (Aristotelian phronesis).  

  4. **Address limitations (2 mins)**:  
     - **"What this game can't capture"**:  
       - Real-life *emotional weight* of moral choices (simulated stakes lack gravity).  
       - *Long-term character erosion* from deference (game is one-off).  
     - **"What you must supply"**:  
       - Stress that *real moral testimony* involves deeper identity stakes ("Who am I if I outsource my values?").  

  ---

  ### **Verdict:** The activity forces students to feel the core tension that deferring to moral testimony grants epistemic justification but voids the act of its moral agency, reducing belief to borrowed authority.
