answer: |-
  Here's a comprehensive, reusable procedure for your peer mediation board, grounded in the guilt/shame distinction, along with applications to your cases and an answer to the policy question.

  **Peer Mediation Procedure: Fostering Guilt, Mitigating Shame**

  **Core Principle:** Aim for **guilt** (I did something bad) over **shame** (I *am* bad). Guilt motivates repair; shame triggers defensiveness or withdrawal.

  **I. Pre-Session Preparation (30 mins - Team)**

  1.  **Gather Facts (Objectively):**
      *   Collect statements (written preferred), evidence (screenshots, witness accounts), context.
      *   Identify specific *actions* ("sent a screenshot," "lied about test answers," "forced to wear X") and the *impact* ("caused embarrassment," "undermined trust," "created fear").
      *   **Avoid:** Character judgments ("bully," "cheater," "liar").

  2.  **Define the Harm:** Clearly articulate:
      *   **What rule/agreement was broken?** (Academic honesty policy, team code of conduct, respectful communication agreement).
      *   **Who was harmed?** (Specific individuals, the class/team, trust in the system).
      *   **What was the concrete negative impact?** (Emotional distress, unfair advantage, damaged reputation, safety concern).

  3.  **Identify Desired Repair:** What would "making it right" look like *practically*? (e.g., Retaking test under supervision, private apology to harmed person, public apology to team, educational presentation on hazing, community service for the team). *Focus on actions.*

  4.  **Plan Key Questions:** Draft questions focused on **actions and impact**:
      *   "What happened from your perspective?" (Get their story).
      *   "What specific actions did you take?" (Pinpoint behavior).
      *   "What did you think would happen when you did X?" (Explore intent/knowledge).
      *   "What impact do you think your actions had on [Person/Group]?" (Connect action to harm).
      *   "What impact did it have on the class/team/trust?" (Broaden perspective).
      *   "What do you think needs to happen to make things as right as possible?" (Solicit repair ideas).
      *   **Avoid:** "Why *are* you like that?" "What's *wrong* with you?" "Don't you feel terrible?" (Shame-inducing).

  5.  **Assign Roles:**
      *   **Lead Facilitator:** Guides the conversation, asks key questions.
      *   **Impact Focuser:** Ensures the harm to the victim/community is clearly articulated and stays central.
      *   **Repair Catalyst:** Helps brainstorm and frame concrete repair steps.
      *   **Process Observer:** Watches for emotional cues (guilt/shame signals - see below), time, and dynamics. Signals if escalation needed.
      *   **Note Taker:** Records agreements, key points, especially repair commitments.

  **II. During the Session (40 mins - Facilitated)**

  1.  **Set the Frame (Lead Facilitator):**
      *   "Thank you all for coming. Our goal today isn't to punish, but to understand what happened, who was hurt, and figure out how to make it as right as possible. We're focusing on *what happened* and *how to repair it*."
      *   "We expect everyone to speak respectfully and listen to each other."

  2.  **Hear Perspectives (Sequentially):**
      *   Victim(s) first (if present/willing): "What happened from your view? How did it affect you?"
      *   Then the person(s) whose actions caused harm: "What happened from your perspective? What were your actions? What did you think would happen?" (Use pre-planned action/impact questions).
      *   **Facilitator Job:** Paraphrase, clarify actions & impact. "So, when you [specific action], it made [Person] feel [specific impact]?" **Interrupt character attacks.** "Let's focus on the specific event, not labels."

  3.  **Focus on Impact (Impact Focuser):**
      *   Explicitly state the harm identified in prep: "Based on what we've heard and the information we have, the actions of [Name(s)] resulted in [Specific Harm 1, Harm 2] for [Person/Group] and damaged [Specific Value/Rule, e.g., team trust, academic honesty]."
      *   Ask the person(s) responsible: "Do you understand how your actions caused this harm? Can you see the impact on [Person/Group/Community]?"

  4.  **Brainstorm Repair (Repair Catalyst):**
      *   "Given this harm, what steps can be taken to make things as right as possible?"
      *   Solicit ideas from ALL parties first. If stuck, offer the pre-identified repair options *as possibilities*, not demands. "Sometimes repairs include things like [Example 1], [Example 2]. What do you think might fit here?"
      *   **Focus on Concrete Actions:** "What will you *do*?" not "How will you *feel*?"

  5.  **Seek Apology & Commitment (Only IF genuine understanding & guilt seem present):**
      *   "Based on understanding the harm, is there something you'd like to say to [Person/Group] about your actions and their impact?"
      *   **Crucial:** Frame it as about *their actions and the harm*, NOT their inherent character. A good apology: "I am sorry *for [specific action]*. I understand it caused you [specific harm]. It was wrong *because [reason - e.g., it was dishonest/cruel/against rules]*. I will [specific repair step]." **Avoid forced "I'm a bad person" statements.**

  **III. Reading Reactions: Guilt vs. Shame (Process Observer & All)**

  *   **Signals of GUILT (Aim for this):**
      *   Focused on the *specific action* and its *consequences*.
      *   Expressing remorse for the *harm caused* ("I feel bad *that I hurt them*").
      *   Willingness to discuss details of the event.
      *   Openness to suggestions for repair ("What can I do?").
      *   Body language: Eye contact (may be difficult but attempts), engaged posture, listening.
  *   **Signals of SHAME (Problematic - needs redirecting or escalation):**
      *   Global self-condemnation ("I'm stupid," "I'm a terrible person," "I always mess up").
      *   Defensiveness, blaming others, minimizing harm ("It wasn't that bad," "Everyone does it," "They deserved it").
      *   Withdrawal: Looking down, slumped posture, monosyllabic answers, shutting down.
      *   Lashing out: Anger, sarcasm, attacking the victim or process.
      *   Inability to discuss the *specifics* of the action.
      *   Focus on *being caught* or *punishment*, not the harm caused.

  **IV. When to STOP & Escalate (Process Observer Flags, Lead Facilitator Executes)**

  *   **Immediate Escalation (Safety):** Threats of violence, self-harm, disclosure of illegal activity (e.g., serious assault, drugs, weapons).
  *   **Escalation Due to Emotion/Process:**
      *   Persistent, unmanaged shame reactions (withdrawal, lashing out) preventing any productive discussion after attempts to refocus on actions/impact.
      *   Complete denial of factual evidence ("That screenshot is fake," "I wasn't even there").
      *   Minimization of serious harm ("It was just a joke," "They liked it really") that is clearly untrue.
      *   Victim intimidation or re-traumatization occurring in the session.
      *   Inability to reach *any* agreement on basic facts or the existence of harm after 20-25 minutes.
      *   **Trigger Phrase:** "We're not making progress on understanding the actions and the harm. We need to pause and refer this to [Teacher Advisor/Dean] for next steps."

  **V. Post-Session (Team & Teacher)**

  1.  **Debrief (Team):** What worked? What didn't? Where did guilt/shame show up? How did we handle it? What could we improve?
  2.  **Document Agreement:** Clear statement of the harm acknowledged, specific repair actions agreed upon, timeline, and signatures.
  3.  **Teacher Sign-off:** Advisor reviews agreement for feasibility and school policy alignment.
  4.  **Follow-up (Teacher/Designated Adult):** Monitor completion of repair actions. Check-in with victim(s) on well-being.

  **Key Judgment-As-Checklist Steps (Handle with Care & Team Discussion):**

  1.  **Defining the Harm (Pre-2):** Interpreting impact from statements/evidence.
  2.  **Identifying Desired Repair (Pre-3):** What's realistic & meaningful?
  3.  **Reading Reactions for Guilt/Shame (III):** Interpreting emotional cues.
  4.  **Assessing "Genuine Understanding" before seeking apology (II.5):** Is it guilt or just compliance?
  5.  **Deciding to Escalate (IV):** Is this shame we can't manage? Is harm minimized? Is progress impossible?
  6.  **Crafting the Apology Frame (II.5):** Steering it towards actions/harm, away from character.

  ---

  **Case Application 1: The Cheating Incident**

  *   **Facts:** Alex copied from Sam during a major test. Sam initially lied to the teacher when asked, admitting only under pressure.
  *   **Harm:** Undermined academic integrity, unfair advantage for Alex, placed Sam in a position of dishonesty, damaged trust in the classroom.
  *   **Desired Repair:** Alex retakes test (different version, supervised), Alex & Sam write reflection on pressure/dishonesty impact, apology to teacher/class about integrity breach.
  *   **Session:**
      *   Sam shares: Felt pressured by Alex, knew it was wrong, scared of being blamed too. (Guilt: Focus on action/consequences).
      *   Alex: "Sam offered! It wasn't a big deal, everyone glances!" (Shame Signals: Minimizing harm, blame-shifting).
      *   **Impact Focuser:** "Alex, regardless of who offered, *you chose to copy answers*. This gave you an unfair grade advantage, forced Sam to lie, and broke the class rule that we earn our own grades. That undermines trust for everyone."
      *   Alex: "Okay, maybe. But Sam caved easy." (Shame: Still minimizing/blaming).
      *   **Lead Facilitator:** "We need to focus on *your choice* to copy. Do you understand how that choice, by itself, caused harm?" (Refocus on *action*).
      *   Alex (Sullen): "I guess it was cheating. But I just panicked." (Slight shift towards action?).
      *   **Repair Catalyst:** "Given that harm, what steps could help? Retaking the test? Writing about how cheating impacts trust? Apologizing for the specific act of copying?"
      *   Alex: "Fine, I'll retake it." (Compliance, not genuine repair focus - potential ongoing shame).
      *   **Process Observer:** (Notes minimal genuine guilt, focus on punishment/compliance. Risk of shame-driven resentment).
      *   **Agreement:** Alex retakes test. Both Alex & Sam write 1 page on how dishonesty harms trust. *No genuine apology achieved, only compliance.*
      *   **Judgment Call:** Escalation *not* triggered yet, but outcome is suboptimal (compliance, not guilt-driven repair). Advisor should monitor Alex's attitude and completion.

  **Case Application 2: The Team Hazing Incident**

  *   **Facts:** Senior soccer players (Chris, Taylor, Jordan) forced new freshmen (incl. Pat) to wear embarrassing costumes and perform silly chants in the cafeteria at lunch.
  *   **Harm:** Public humiliation for Pat/freshmen, fear/intimidation, violated team/school culture of respect, potential safety concern (emotional harm).
  *   **Desired Repair:** Direct apology to freshmen, educational session for team on hazing, community service project by seniors fostering positive team bonding.
  *   **Session:**
      *   Pat (Quietly): "Felt scared, humiliated, like I didn't belong. Everyone laughed." (Clear harm).
      *   Chris: "It was just tradition! Lighten up! We all went through it." (Shame Signals: Minimizing harm, blaming victim).
      *   Taylor: "Yeah, it's team bonding. They need to toughen up." (Shame Signals: Minimizing, blaming).
      *   Jordan: (Looks down, silent). (Shame Signal: Withdrawal).
      *   **Impact Focuser:** "Calling it 'tradition' or 'bonding' doesn't change the facts: *You chose* to make Pat and others wear costumes and perform publicly against their will. This caused Pat public humiliation and fear. It wasn't bonding for *them*. It violated the school's rule against harassment and the team's stated value of respect."
      *   Chris: "They're too sensitive! It wasn't harassment!" (Shame: Lashing out, denial).
      *   **Lead Facilitator:** "We have multiple accounts confirming the event and Pat's distress. We need to focus on *your actions* and their *impact*, not whether Pat 'should' feel a certain way."
      *   Taylor: "Whatever. What do you want us to do?" (Defensive compliance - shame).
      *   **Repair Catalyst:** "Given the harm – humiliation, fear, broken trust – what could repair look like? A sincere apology acknowledging the harm? Learning about why hazing is harmful? Doing something positive to rebuild team spirit?"
      *   Chris: "Fine, I'll say sorry if it gets this over with." (Insincere, shame-driven compliance).
      *   Jordan: (Mumbles) "Yeah, sorry." (Withdrawn, shame).
      *   **Process Observer:** (Flags: Consistent minimization, victim-blaming, insincere/compliant apologies, withdrawal. Genuine guilt absent. Harm not acknowledged).
      *   **Lead Facilitator:** "We're seeing that the harm caused isn't being genuinely acknowledged, and apologies seem focused on ending the meeting, not repairing. We need to pause and refer this to [Teacher Advisor/Dean]." **(ESCALATION TRIGGERED)**
      *   **Outcome:** Meeting stopped. Advisor/Dean takes over. Likely formal consequences + mandated education. Peer process failed due to entrenched shame/defensiveness.

  ---

  **Can a School Choose Guilt over Shame as Policy?**

  **Yes, absolutely, and it should.** While philosophers debate the nature of shame, the *practical consequences* in a school setting are clear:

  1.  **Actionable Focus:** Guilt targets specific, changeable behaviors. Shame attacks the core self, making change feel impossible.
  2.  **Motivation:** Guilt motivates restitution and improved future behavior. Shame motivates hiding, lying, aggression, or withdrawal.
  3.  **Restorative Justice Alignment:** Guilt is central to RJ – understanding harm and repairing it. Shame undermines the process.
  4.  **Psychological Safety:** A guilt-focused culture ("Mistakes happen, let's fix them") is safer than a shame-focused culture ("Mistakes mean you're flawed").

  **How a School Cultivates a Guilt-Based Culture (Policy in Action):**

  *   **Language:** Policies/rules/conversations focus on *behaviors* and *harms*, not labels. "That action was dishonest/hurtful" vs. "You are a liar/bully."
  *   **Discipline Procedures:** Emphasize understanding impact and repair (restorative practices) alongside necessary consequences. Avoid purely punitive shaming (public humiliation, excessive punishments disconnected from the harm).
  *   **Modeling:** Adults (teachers, admin, coaches) admit mistakes, focus on the action's impact ("I'm sorry I raised my voice, that was unprofessional and must have been unsettling"), and demonstrate repair.
  *   **Training:** Staff *and* student leaders (like you!) trained on the guilt/shame distinction and how to foster guilt in interventions.
  *   **Feedback:** Constructive criticism focuses on specific actions and improvement, not character.
  *   **Celebrating Repair:** Acknowledge efforts to make amends and learn from mistakes.

  **It's a Choice, But Hard:** Culture is deep-seated. Choosing guilt requires constant, conscious effort at all levels to overcome natural tendencies towards blame and shame, especially in high-stakes situations. Your peer mediation board, by using this procedure, is actively helping the school make that choice operational. The outcome won't always be perfect (as the cases show), but striving for guilt over shame is a profoundly positive policy goal.
