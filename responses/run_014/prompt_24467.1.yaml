prompt: |-
  I advise individuals and small foundations (a handful of clients a year, with decisions worth six to seven figures) on how much of their resources to devote to life-saving charitable work, and I keep reaching for Singer's drowning-child argument as the underlying principle: if you can prevent something very bad from happening at relatively low cost to yourself, you ought to do so. But when I try to turn that into a decision procedure my clients can actually run, it breaks down. Please write a decision procedure that operationalizes the duty-of-rescue principle: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Be explicit about which distinctions from the original argument must survive the simplification (rescue versus positive duty, the low-cost threshold, comparative claims about who to save) and which can be dropped, and mark the points where judgment cannot be eliminated. Then run the procedure on three cases: a client who can save a life for the price of a vacation; a client who already gives a large share of income and asks how much more the principle requires; and one where the procedure yields an answer the client will not like. After the worked cases, say what the procedure cannot do, and separate what is settled in the ethics literature from what is genuinely contested among people who know this area, without presenting a contested view as the consensus. Think very carefully before answering, and respond in the style of an expert in normative ethics. Begin your response with the procedure itself — no preface, no restating of my question, no commentary before it.
reasoning: |-
  We are operationalizing Singer's duty-of-rescue principle: "If you can prevent something very bad from happening at relatively low cost to yourself, you ought to do so."
   The procedure must:
     - Be a step-by-step decision procedure
     - Specify the order of questions, what counts as a sufficient answer at each step, and where it stops with a no or hands off to value judgments.
     - Preserve key distinctions: rescue (preventing imminent, severe harm) vs. positive duty (general improvement), the low-cost threshold, and comparative claims (if any) about who to save.
     - Drop distinctions that are not essential for a practical procedure (e.g., the exact metaphysical basis of the duty, or the precise definition of "low cost" in absolute terms).

   Key distinctions to preserve:
     1. Rescue: The situation must involve preventing something very bad (like death or severe suffering) that is imminent or avoidable through the action.
     2. Low cost: The cost to the agent must be relatively low. We must define what "low" means in context.
     3. Comparative claims: We will note that the procedure does not inherently require comparing different rescue opportunities (though we may add a step for efficiency if resources are limited), but the original argument does not require such comparison for a single rescue.

   Steps to build the procedure:

   Step 1: Identify the harm.
     Question: "Is the harm in question very bad (e.g., death, severe irreversible suffering) and can it be prevented by the action under consideration?"
     - If no: Stop. The duty-of-rescue principle does not apply. (This might not be a rescue situation.)
     - If yes: Proceed to Step 2.

   Step 2: Assess the cost to the agent.
     Question: "Is the cost to you (the agent) of taking this action relatively low, considering your overall resources and without imposing a significant burden on your ability to meet your basic needs or fulfill your other important obligations?"
     How to judge "low cost":
       - We must consider the agent's circumstances. A fixed dollar amount is not appropriate. Instead, we use a relative measure: the cost should not require the agent to sacrifice something of comparable moral importance (e.g., basic needs, health, or other fundamental obligations). 
       - Note: This step requires judgment. We can break it down:
          a. What is the absolute cost? (e.g., $X)
          b. What fraction of the agent's disposable resources does this represent? (Disposable resources: income or wealth after meeting basic needs and prior obligations.)
          c. Is the cost such that it would not significantly set back the agent's ability to live a decent life or meet their core responsibilities?
     - If the cost is not low (i.e., it is a significant burden): Stop. The duty-of-rescue principle does not require this action.
     - If the cost is low: Proceed to Step 3.

   Step 3: Check for competing claims.
     Question: "Are there alternative actions that could prevent a comparable or greater harm at a lower cost per unit of harm prevented (i.e., more cost-effective) that you could take instead?"
     Why: The duty-of-rescue principle, as stated by Singer, does not inherently require comparison. However, in practice, if an agent has limited resources and multiple rescue opportunities, they might have a duty to choose the most cost-effective. But note: Singer's argument is often extended to require giving to the most effective charities. However, the core drowning-child argument does not require comparison if the child is right in front of you. So we must decide: 
          Option A: If we are considering one rescue opportunity in isolation, we skip this step. But if the agent has multiple opportunities, we may need to consider efficiency. 
          Option B: Since the agent is making a decision about allocating resources, we might want to consider efficiency to maximize the good.

     We choose to make this step conditional: 
          - If the agent is considering only one opportunity, then we can skip to Step 4. 
          - If the agent is considering multiple opportunities, then we must compare and choose the one with the greatest expected impact per unit cost.

     However, for a general procedure, we can ask:
          "Is this the most cost-effective way for you to prevent a very bad harm that you can prevent at a low cost, among the available options?"

     But note: The original principle does not require the most cost-effective, only that the cost is low relative to the harm prevented. However, given that resources are limited, it is reasonable to consider efficiency. But to stay true to the core argument, we might not require it. However, in practice, we want to avoid wasting resources.

     We can handle it as:
          - If the agent has only one option in mind, then we don't require comparison. But if they have multiple, then they should choose the most effective one.

     Alternatively, we can split the procedure for a single opportunity vs. multiple. For simplicity, we design for a single opportunity and then add a note about multiple.

     Revised Step 3 (for a single opportunity): 
          Question: "Is there any other rescue opportunity that you are aware of that would prevent a comparable harm at a lower cost (or prevent a greater harm at the same cost) that you could take instead?"
          - If yes: Then the agent should consider redirecting the resources to the more effective opportunity. But note: this is an extension of the principle. The core duty does not require that the rescue be the most efficient, only that it meets the conditions. However, if there is a more efficient option, it would be irrational and less moral not to take it. So we say:
              - If there is a better opportunity, then the duty applies to that better opportunity, not the original one. We stop the current line and the agent should consider the better one.
          - If no: Proceed to Step 4.

   Step 4: Check for overdemandingness (optional?).
     Note: The original argument does not set a limit on how many times one must act. But in practice, if the agent has already given to the point where further giving would impose a significant burden, then the cost is no longer low. We have already considered the cost per action in Step 2. However, if the agent is considering a series of actions, we might need to consider cumulative cost. We can handle this in Step 2 by considering the cumulative impact of this additional donation on the agent's resources.

     We do not add a separate step for cumulative demands. We assume Step 2 considers the agent's current situation.

   Step 5: Value judgment handoff.
     If we reach this point, the duty-of-rescue principle requires the action. However, there might be other moral considerations (e.g., special obligations to family, personal projects, etc.) that the agent may weigh. The duty-of-rescue is a strong prima facie duty but not necessarily absolute.

     Question: "Are there any overriding moral considerations that would make it permissible for you not to take this action, even though the conditions of the duty-of-rescue are met?"
     - This is the point for value judgments. The agent must reflect on whether their personal circumstances or other duties override the rescue duty. The procedure cannot decide this absolutely. We note that in Singer's view, such overriding considerations are rare and must be very weighty.

     If the agent identifies no overriding considerations, then the action is required.

     If the agent identifies an overriding consideration, then the procedure hands off the decision to the agent's judgment. We note, however, that the burden of proof is on the agent to show that the consideration is sufficiently weighty.

   Summary of the procedure:

    Step 1: Harm assessment.
        Q: Is the harm very bad and preventable by the action?
            No -> Stop: no duty.
            Yes -> Step 2.

    Step 2: Cost assessment.
        Q: Is the cost to the agent relatively low (i.e., does not sacrifice something of comparable moral importance, considering the agent's overall resources and obligations)?
            No -> Stop: no duty.
            Yes -> Step 3.

    Step 3: Comparative efficiency (if applicable).
        Q: Is there a more cost-effective rescue opportunity available to the agent that they could take instead? (i.e., preventing a comparable or greater harm at a lower cost per unit of harm)
            Yes -> Then the duty applies to the more effective opportunity. The agent should consider that one. (We stop the current action and the agent must reevaluate the better opportunity.)
            No -> Step 4.

    Step 4: Overriding considerations.
        Q: Are there any overriding moral considerations that justify not acting?
            If the agent can provide a strong justification (e.g., a conflicting duty of greater importance) -> Hand off to the agent: they may choose not to act, but must take responsibility for that judgment.
            If not -> The action is required by the duty-of-rescue.

   Key points where judgment is required:
     - Step 1: What counts as "very bad"? (Death and severe suffering are clear, but what about moderate suffering? We stick to the severe ones.)
     - Step 2: What is "relatively low cost"? This requires contextual judgment about the agent's resources and what counts as a significant burden.
     - Step 3: How to compare the cost-effectiveness of different opportunities? This requires evidence about the impact of charitable interventions.
     - Step 4: What counts as an overriding consideration? This is a value judgment.

   Now, we run the procedure on three cases.

   Case 1: A client who can save a life for the price of a vacation.
     Step 1: The harm is death (very bad) and preventable by donating to an effective charity (e.g., one that provides life-saving medical treatment). Yes.
     Step 2: The cost is the price of a vacation. For a client with typical resources of someone giving six-to-seven-figure donations, a vacation cost is likely a low cost (it does not impede meeting basic needs or core obligations). So yes.
     Step 3: We assume the client is considering one charity. But we should check: is there a more cost-effective charity? Let's say the client is considering Charity A that saves a life for $5,000. If there's Charity B that saves a life for $4,000, then the client should give to Charity B. But if the client is only aware of Charity A and it is cost-effective (within the range of what is considered efficient for life-saving), then no better opportunity is known. So we proceed.
     Step 4: The client might argue that the vacation is important for their well-being or family bonding. But is this an overriding consideration? In Singer's view, it is not: the loss of a vacation does not compare to the loss of a life. The procedure would require the donation unless the client can provide a very strong justification (e.g., the vacation is medically necessary for the client's mental health, which is unlikely). So the procedure concludes: the client ought to donate.

   Case 2: A client who already gives a large share of income and asks how much more the principle requires.
     We must reframe the question: the client is asking about the limit of the duty. The procedure must be applied per opportunity. However, the cumulative effect matters.

     Consider one additional opportunity: donating an extra $X to save a life.
     Step 1: The harm is death and preventable. Yes.
     Step 2: The cost is $X. But now, we must consider the client's current situation: they already give a large share. We must ask: would this additional donation be a relatively low cost? 
          - If the client has already given so much that their disposable income is now low, then an additional donation might impose a significant burden. For example, if after their current giving, they are left with just enough for basic needs, then the cost is not low. But if they still have significant discretionary funds, then the cost might still be low.
          - The procedure must be applied contextually. The question is: does this extra donation push the client into a situation where they are sacrificing something of comparable moral importance? (E.g., if they can no longer afford their own health insurance, then that is a comparable harm.) 
          - If the extra donation does not cause such a sacrifice, then it is low cost. Otherwise, not.

     Step 3: Check for better opportunities? If the client is considering a particular charity, we must check if there's a better one. But the question is about the duty to give more in general. We can skip Step 3 for this example because the client is asking about the limit.

     Step 4: Overriding considerations? The client might feel they have given enough. But unless they can show that further giving would cause a significant burden (which we already considered in Step 2) or that they have other obligations that override, the duty still applies.

     Conclusion: The duty applies to any additional donation that meets the conditions of Step 1 and 2. There is no fixed limit, but the cost threshold (Step 2) will eventually be reached when further donations would impose a significant burden.

   Case 3: A case where the procedure yields an answer the client will not like.
     Example: A client who has a beloved but non-essential luxury (e.g., a collection of rare wines worth $100,000) that they could sell to save 20 lives (at $5,000 per life). The client does not want to sell the collection.

     Step 1: Harm: death, preventable by donating. Yes.
     Step 2: Cost: selling the wine collection. The client has the collection as an asset. The cost is giving up the collection. We must decide if this cost is "relatively low". 
          - The collection is not essential to the client's basic well-being or obligations. It is a luxury. So the cost is low in the moral sense (it doesn't prevent the client from meeting basic needs). 
          - However, the client might argue that the collection has great sentimental value. But in the duty-of-rescue, non-essential luxuries are typically considered low cost. So we would say the cost is low.
     Step 3: We assume the opportunity is cost-effective (saving 20 lives for $100,000 is within typical cost-effectiveness for life-saving charities). So no better opportunity is identified.
     Step 4: The client might argue that the collection is a lifelong project and has deep personal meaning. Is this an overriding consideration? 
          - In normative ethics, this is contested. Some would say that personal projects can have moral weight (Bernard Williams). But Singer would argue that the moral imperative to save lives outweighs such projects. 
          - The procedure leaves this to the client's judgment. However, the burden is on the client to show that the personal value of the collection is of comparable moral importance to 20 lives. This is a very high bar. The procedure would likely conclude that the client ought to sell the collection and donate, and the client would not like this answer.

   What the procedure cannot do:
     - It cannot assign exact dollar values to what counts as "low cost" because that depends on the agent's financial situation.
     - It cannot definitively resolve conflicts between the duty-of-rescue and other moral considerations (Step 4).
     - It cannot replace empirical research on the effectiveness of charities (Step 3 requires evidence).
     - It does not address the possibility that the duty might require repeated actions until the cost becomes high (the demandingness objection).

   What is settled in the ethics literature and what is contested:

     Settled (among those who accept the duty-of-rescue principle in Singer's form):
       - The core principle: if you can prevent a very bad thing at low cost, you ought to do it.
       - The principle applies to global poverty and health interventions (like the drowning child, but at a distance).
       - The cost threshold: it is defined by not sacrificing something of comparable moral importance.

     Contested:
       - Whether the principle is too demanding if applied repeatedly (the demandingness objection).
       - Whether there are agent-relative permissions that allow individuals to prioritize their own projects and relationships over rescuing strangers (the debate between consequentialists and deontologists or virtue ethicists).
       - Whether the principle requires giving to the most effective charity (maximizing impact) or simply to any effective charity that meets the cost threshold.
       - The exact definition of "very bad" and "low cost" (though the broad strokes are agreed upon by proponents).

     Note: The procedure we have built reflects a mainstream interpretation of Singer's argument, but it is not uncontested. In particular, Step 4 is where the main controversies in normative ethics play out.
answer: |-
  **Decision Procedure for the Duty-of-Rescue Principle**  

  **Step 1: Identify the Harm**  
  *Question:* "Is the harm in question *very bad* (e.g., death, severe irreversible suffering) and *directly preventable* by the proposed action?"  
  - **Sufficient answer:**  
    - *Yes*: Harm is severe (e.g., loss of life, disability, extreme deprivation) and the action reliably prevents it (e.g., funding bednets to prevent malaria deaths). Proceed to Step 2.  
    - *No*: Harm is not severe (e.g., moderate inconvenience) or not directly preventable (e.g., funding basic research with uncertain outcomes). **Stop: No duty applies.**  
  *Judgment required:* Defining "very bad" (death is unambiguous; suffering requires context).  
  *Key distinction preserved:* Rescue (preventing imminent, severe harm) vs. positive duty (general welfare improvement).  

  **Step 2: Assess Cost to the Agent**  
  *Question:* "Is the cost to you *relatively low*, meaning it does not require sacrificing something of comparable moral importance (e.g., basic needs, core obligations, or essential well-being) given your total resources?"  
  - **Sufficient answer:**  
    - *Yes*: Cost is a small fraction of disposable income/wealth (e.g., ≤1–5% of annual surplus, but context-dependent). Proceed to Step 3.  
    - *No*: Cost imposes significant hardship (e.g., forgoes healthcare, housing, or familial duties). **Stop: No duty applies.**  
  *Judgment required:* Defining "low cost" relative to the agent’s circumstances.  
  *Key distinction preserved:* The low-cost threshold (prevents overdemandingness).  

  **Step 3: Evaluate Comparative Effectiveness**  
  *Question:* "Is this the most cost-effective option available to prevent comparable harm (e.g., saves the most lives per dollar)?"  
  - **Sufficient answer:**  
    - *Yes*: Action is among the most efficient known interventions (e.g., evidence-backed charities). Proceed to Step 4.  
    - *No*: A better alternative exists (e.g., another charity saves 10× more lives for the same cost). **Pause:** Redirect resources to the better option.  
  *Judgment required:* Assessing cost-effectiveness using credible data (e.g., GiveWell metrics).  
  *Key distinction preserved:* Comparative claims (efficiency in resource use).  

  **Step 4: Check for Overriding Commitments**  
  *Question:* "Are there compelling competing moral obligations (e.g., urgent family needs, prior promises) that outweigh this rescue?"  
  - **Sufficient answer:**  
    - *No overriding commitment*: Proceed to Step 5.  
    - *Overriding commitment identified*: **Hand off to agent’s judgment.** Duty applies *unless* the conflict is exceptional (e.g., caring for a critically ill dependent).  
  *Judgment required:* Balancing rescue against agent-relative duties (values-based).  

  **Step 5: Final Duty Assessment**  
  *Conclusion:* "The duty-of-rescue principle requires this action. Failing to act is morally impermissible unless justified in Step 4."  
  - **Output:** Act as prescribed.  

  ---

  **Worked Cases**  

  **Case 1: Saving a Life for the Price of a Vacation**  
  - *Step 1:* Harm is death (e.g., donating $5,000 to AMF prevents malaria). **Yes.**  
  - *Step 2:* Cost ($5,000) is low for a client with high disposable income (vacation is non-essential). **Yes.**  
  - *Step 3:* If AMF is highly cost-effective (per evidence), **yes**; else redirect.  
  - *Step 4:* No overriding commitments (vacation is discretionary).  
  - *Step 5:* **Action required.** Donate.  

  **Case 2: High-Giving Client (e.g., Donates 30% Income)**  
  - *Step 1:* Harm is death (e.g., additional $10,000 could save lives). **Yes.**  
  - *Step 2:* Assess incremental cost:  
    - If $10,000 leaves core needs/met (e.g., ample savings remain), cost is low. **Proceed.**  
    - If it risks essentials (e.g., retirement security), cost is high. **Stop.**  
  - *Step 3:* Ensure funds go to top charities (e.g., Against Malaria Foundation). **Yes.**  
  - *Step 4:* No automatic exemption for past giving. Override only if new burden is severe (e.g., health at risk).  
  - *Conclusion:* **Duty requires additional donation** if Step 2’s cost threshold unmet.  

  **Case 3: Unpopular Outcome (e.g., Selling Luxury Asset)**  
  - *Step 1:* Harm is death (e.g., $100,000 art sale could save 20 lives). **Yes.**  
  - *Step 2:* Cost is low (asset is non-essential; selling doesn’t impair basic well-being). **Yes.**  
  - *Step 3:* If efficient (e.g., $5,000/life), **yes.**  
  - *Step 4:* Client’s attachment to art is not an *overriding commitment* (sentimental value ≠ moral urgency).  
  - *Step 5:* **Action required.** Sell and donate.  
  *Client’s dislike:* Rooted in personal loss vs. moral necessity; procedure overrules preference.  

  ---

  **Limitations of the Procedure**  
  1. **Judgment dependence:**  
     - Steps 1 (harm severity), 2 (cost threshold), and 4 (overrides) require subjective input.  
  2. **Inexact cost thresholds:** No universal formula for "low cost"; varies by agent’s wealth.  
  3. **Cumulative demands:** Does not resolve how repeated rescues affect obligation (e.g., when giving 50% income still leaves room for more).  
  4. **Empirical uncertainty:** Relies on data for harm prevention (Step 1) and cost-effectiveness (Step 3).  

  **Ethical Consensus vs. Contestation**  
  - **Settled among proponents:**  
    - Duty applies to distant strangers (no proximity requirement).  
    - "Low cost" excludes sacrifices of comparable moral weight (e.g., basic needs).  
    - Rescue prioritizes severe, preventable harm over minor benefits.  
  - **Genuinely contested:**  
    - **Demandingness:** Whether the duty extends to *all* low-cost opportunities (Singer: yes; moderates: no beyond a "significant" threshold).  
    - **Agent-relative permissions:** Can personal projects (e.g., art, hobbies) override rescue? (Consequentialists: rarely; non-consequentialists: often).  
    - **Aggregation:** Must we save the most lives possible (strong efficiency)? Or is any rescue sufficient? (Effective altruism vs. satisficing views).  
  - **Note:** This procedure adopts Singer’s view but acknowledges competing frameworks (e.g., contractualism, virtue ethics) reject its stringency.
