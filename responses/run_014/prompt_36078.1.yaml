answer: |-
  ### Decision Tree: The Nature of Qualia  
  Start with the claim: **"I'm having a reddish experience of this apple right now."**  

  #### (1) Inverted Spectrum:  
  *Is it genuinely possible that two individuals are functionally identical (same behavior, neural processing, etc.) but have inverted color experiences (e.g., tomatoes look to you the way grass looks to me)?*  
  - **Yes** → Go to (2)  
  - **No** → Go to (3)  

  #### (2) Acquired-Taste Introspection:  
  *When your taste for coffee changes (loved it at 25, dislike it at 45), can introspection distinguish "the taste-experience itself changed" from "the experience is identical but my attitude/judgment changed"?*  
  - **Yes** → Go to (4)  
  - **No** → Go to (4)  

  #### (3) After "No" to Inverted Spectrum:  
  *Are experiences defined by their representational content (what they "say" about the world)?*  
  - **Yes** → Leaf: **REPRESENTATIONALISM/INTENTIONALISM**  
    *(Experiences are identical to their representational content; no further "qualia" needed.)*  
  - **No** → *Are experiences essentially relations to external objects/properties?*  
    - **Yes** → Leaf: **NAIVE/RELATIONAL REALISM**  
      *(Experiences are direct relations to mind-independent properties; no intrinsic "qualia.")*  
    - **No** → Leaf: **FUNCTIONALISM**  
      *(Qualia just are functional roles; identical roles → identical experiences.)*  

  #### (4) Intrinsic Properties:  
  *Do experiences have intrinsic properties (non-representational, non-functional, "raw feels") over and above what they represent and their causal role?*  
  - **Yes** → Leaf: **QUALIA REALISM**  
    *(Qualia are intrinsic, private properties; e.g., "reddishness" is fundamental.)*  
  - **No** → Go to (5)  

  #### (5) Coherence of Qualia:  
  *Is the concept of qualia (as phenomenal properties) coherent?*  
  - **Yes** → Leaf: **UNNAMED**  
    *(Why? Requires non-intrinsic, non-functional, non-relational properties that are introspectively inaccessible—likely incoherent or unexplored.)*  
  - **No** → Go to (6)  

  #### (6) Status of Seemings:  
  *If qualia don’t exist, are "seemings" of qualia (e.g., "it feels like I see red") real functional states?*  
  - **Yes** → Leaf: **ILLUSIONISM**  
    *(Phenomenal properties are illusory, but the seemings are real and functionally analyzable.)*  
  - **No** → Leaf: **DISSOLUTIONISM**  
    *(The introspective question is confused; "qualia" is incoherent from the start.)*  

  ---

  ### Critical Notes for the Handout  
  1. **Acquired-Taste Implications**:  
     - Answering **"No" at (2)** challenges direct introspective warrant for qualia.  
     - Surviving leaves: **Qualia Realism**, **Unnamed**, **Illusionism**, **Dissolutionism**.  
     - Eliminated: **Representationalism**, **Naive Realism**, **Functionalism** (these require *no* inversion possibility).  

  2. **Indistinguishable Leaves** (the tree *cannot* separate these given the questions):  
     - **Illusionism** and **Dissolutionism** both require "No" at (1), (4), and (5). They diverge only at (6) (functional seemings vs. total incoherence).  
     - **Qualia Realism** covers both those who answer "Yes" or "No" at (2)—introspective reliability isn’t further probed.  

  3. **Unusual Paths**:  
     - **"No" at (1) but "Yes" at (4)**: Blocked—denying inversion implies rejection of intrinsic properties.  
     - **"Yes" at (1) but "No" at (4) and "Yes" at (5)**: Leads to **Unnamed** (rare/unstable).  

  4. **Key Takeaway**:  
     The tree forces confrontation with *cases*, not labels. Where you land depends on commitments about inversion, introspection, and intrinsicality—not definitions.  

