  By move 5, they're talking past each other. Nora demands ontic grounding; Sam rejects that need. His final "begging the question" charge is fair—Nora's "something must decide" assumes determinism. But both miss nuances: Nora ignores semantic externalism; Sam downplays how truthmaker theory constrains logic. 

