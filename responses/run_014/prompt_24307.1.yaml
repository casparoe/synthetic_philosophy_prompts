  The user prefers to keep (1), meaning they want to salvage pragmatic encroachment by restricting it to non-incorrigible beliefs. That could work, but it narrows the theory. They might worry this weakens encroachment's scope. However, many proponents already accept such restrictions. The cost is that encroachment no longer claims universality, but that’s a common compromise. 

