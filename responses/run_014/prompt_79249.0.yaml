answer: |-
  Here's a complete, battle-tested design for your Simpson's Paradox activity. I've refined your core mechanic to maximize tension, debate, and causal reasoning while addressing your concerns about predictability and limitations.

  ---

  ### **Core Mechanics & Rules**  
  **Objective:** Gladiators maximize points by choosing opponents (Novice/Champion). Strong gladiators *should* hunt Champions; weak ones *should* farm Novices. The paradox emerges when weak gladiators post higher *pooled win rates* despite being inferior in every matchup.  

  **Gladiator Types (9 strong, 9 weak):**  
  - **Strong:**  
    - Novices: 8 wins / 10 fights → 80% win rate  
    - Champions: 4 wins / 10 fights → 40% win rate  
    - *Rational Strategy:* Fight Champions (0.4 × 3 pts = 1.2 expected pts) > Novices (0.8 × 1 pt = 0.8 pts)  
  - **Weak:**  
    - Novices: 5 wins / 10 fights → 50% win rate  
    - Champions: 1 win / 10 fights → 10% win rate  
    - *Rational Strategy:* Fight Novices (0.5 × 1 pt = 0.5 pts) > Champions (0.1 × 3 pts = 0.3 pts)  

  **Scoring:**  
  - Win vs. Novice: **1 point**  
  - Win vs. Champion: **3 points**  
  - Loss: **0 points**  

  **Materials (for 18 students):**  
  - **18 Form Cards** (laminated/index cards):  
    - 9 × Strong: "Against Novices: 8W/2L | Against Champions: 4W/6L"  
    - 9 × Weak: "Against Novices: 5W/5L | Against Champions: 1W/9L"  
  - **36 Custom Decks** (10 cards/deck, shuffle before each fight):  
    - Strong/Novice: 8✅, 2❌  
    - Strong/Champion: 4✅, 6❌  
    - Weak/Novice: 5✅, 5❌  
    - Weak/Champion: 1✅, 9❌  
  - **Scoreboard Poster** (3 sections):  
    - **Live Tally:** Gladiator ID | Wins | Losses | Points  
    - **Pooled Table:** Tier | Total Fights | Total Wins | Win Rate (hidden until mid-game)  
    - **Disaggregated Table:** Gladiator Type × Tier | Fights | Wins | Win Rate (hidden until reversal)  
  - **Role Badges:** Commissioner (1), Scouts (2), Gladiators (15).  

  ---

  ### **Timeline (75 Minutes)**  
  **Phase 1: The Arena (0–35 min)**  
  - **0–5 min:** **Hook**  
    - *Facilitator:* "You’re gladiators in a two-tier league. Each round, choose to fight a Novice (1 pt per win) or a Champion (3 pts). Goal: Maximize points. Your hidden form card tells your odds. Scouts and a Commissioner will analyze your performance."  
    - Assign roles randomly: 1 Commissioner, 2 Scouts, 15 Gladiators. Hand out form cards/decks.  
  - **5–10 min:** **Strategy Time**  
    - *Facilitator:* "Calculate your expected points per fight. Will you farm Novices or hunt Champions? Write your Round 1 choice."  
    - *Key:* Strong gladiators see Champions are optimal; weak see Novices are better.  
  - **10–30 min:** **5 Rounds of Combat**  
    - Each round:  
      1. Gladiators write "N" or "C" on index cards.  
      2. They draw from their tier-specific deck (reshuffle each fight).  
      3. Report outcomes (✅/❌) to you. Update the **Live Tally** publicly.  
    - *Critical:* Only record wins/losses/points—**not tiers yet**. Scouts/Commissioner see only the pooled tally.  
  - **30–35 min:** **Crown a Champion**  
    - *Facilitator:* "Commissioner: Declare the league champion based on the highest win rate! Scouts: Advise using the Pooled Table."  
    - Pooled Table (example):  
      | Gladiator Type | Fights | Wins | Win Rate |  
      |----------------|--------|------|----------|  
      | Strong         | 45     | 18   | 40%      |  
      | Weak           | 45     | 23   | 51%      |  
    - Scouts/Commissioner declare **weak gladiators** the winners (51% > 40%).  

  **Phase 2: The Reversal (35–50 min)**  
  - **35–40 min:** **Rebellion**  
    - *Facilitator:* "Strong gladiators: You have more points but lower win rates. Do you accept this champion? Why?"  
    - Spark debate: "Is win rate the right metric? What does 'better' mean?"  
  - **40–45 min:** **Reveal the Disaggregated Table**  
    - Show the **Disaggregated Table** (from your records):  
      | Type/Tier    | Fights | Wins | Win Rate |  
      |--------------|--------|------|----------|  
      | Strong (Nov) | 0      | 0    | —        |  
      | Strong (Ch)  | 45     | 18   | 40%      |  
      | Weak (Nov)   | 45     | 23   | 51%      |  
      | Weak (Ch)    | 0      | 0    | —        |  
    - *Facilitator:* "Something’s missing. Why can’t we compare Strong vs. Weak in the *same* tier?"  
  - **45–50 min:** **Reveal Form Cards**  
    - Gladiators share form cards. Build the **True Win Rate Table**:  
      | Type/Tier    | True Win Rate |  
      |--------------|---------------|  
      | Strong (Nov) | 80%           |  
      | Strong (Ch)  | 40%           |  
      | Weak (Nov)   | 50%           |  
      | Weak (Ch)    | 10%           |  
    - *Facilitator:* "Strong gladiators dominate both tiers... but weak gladiators won the crown. How?"  

  **Phase 3: The Causality Switch (50–65 min)**  
  - **50–55 min:** **Three Stories, Same Data**  
    Reuse the **Pooled** and **Disaggregated Tables** under new stories:  
    1. **Choice:** "Tier picked by gladiator" (original game).  
    2. **Assignment:** "Tier assigned by matchmaker post-fitness test (no gladiator influence)."  
    3. **Consequence:** "Tier depends on prior wins (e.g., 2 wins → promoted to Champion)."  
  - **55–65 min:** **Debate & Vote**  
    - *Facilitator:* "Which story justifies aggregating? Which demands disaggregation? Vote for each."  
    - *Key Insight:*  
      - **Choice/Assignment:** Confounding (type → tier choice). **Disaggregate.**  
      - **Consequence:** Tier is a mediator (performance → tier). **Aggregate cautiously** (tier isn’t exogenous).  

  **Debrief (65–75 min)**  
  - **Name the Paradox (65 min):** "You experienced **Simpson’s Paradox**: Aggregating data reverses a trend visible in subgroups. Today, weak gladiators *appeared* better due to **composition bias**—they fought easier opponents."  
  - **Map Game to Concepts:**  
    - **Composition:** Weak gladiators fought 100% Novices → inflated win rate.  
    - **Confounding:** Gladiator type influenced both tier choice *and* win rate.  
    - **Causal Question:** "Should we aggregate?" depends on *why* tiers differ (e.g., choice vs. consequence).  
  - **Real-World Analogy:** "Like UC Berkeley’s gender bias illusion: Women applied to harder departments, *causing* lower aggregate admission rates."  
  - **Caveat (Non-Collapsibility):**  
    - *Facilitator:* "Sometimes reversals happen without confounding (e.g., odds ratios in logistic regression). This is **non-collapsibility**—a statistical artifact, not causal. We simulated a *causal* paradox today; non-collapsibility requires modeling. See [Hernán & Robins, 2020] for details."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Strong gladiators’ choice is too obvious!"**  
     - **Fix:** Pre-game, ask *all* gladiators: "Would you fight a Champion for 3 pts if you win 40% of the time?" Many weak ones will say yes (overconfidence). This creates initial diversity in choices, making the strong gladiators’ rationale feel earned.  

  2. **"The decks are rigged!"**  
     - **Fix:** Pre-empt: "Decks reflect *your* form card odds—like loaded dice. Real athletes have stable strengths." Let Scouts verify decks mid-game to build trust.  

  3. **"Points > Win Rate!" Stubbornness**  
     - **Fix:** Contrast metrics early: "Is a gladiator with 10 wins/20 fights (50%) ‘better’ than one with 8 wins/16 fights (50%) if the latter earned more points?" Force the Commissioner to justify prioritizing win rate.  

  4. **Lopsided Results (e.g., weak gladiators get unlucky)**  
     - **Fix:** Use the **True Win Rate Table** for the reversal. Say: "In a larger league, weak gladiators *would* have a 50% win rate—today’s noise doesn’t change the paradox."  

  ---

  ### **What This Activity Can’t Do**  
  - **Non-Collapsibility Demo:**  
    As your epidemiologist friend noted, odds ratios can reverse without confounding due to non-collapsibility (a mathematical quirk of non-linear models). This activity simulates **confounding-driven reversal** only.  
    - **Workaround:** In debrief, clarify: "Today’s paradox vanished when we disaggregated. Non-collapsibility *persists* even then—it’s a different phenomenon. Read [Westreich et al., 2015] for examples."  

  - **Hidden Design Hand:**  
    Sharp students will notice you engineered the reversal.  
    - **Lean In:** "Yes, I set win rates to *create* composition bias. In real life, you won’t see the ‘form cards’—you must interrogate how the groups differ."  

  - **Dynamic Effects:**  
    The "consequence" story (tier depends on past wins) is oversimplified.  
    - **Patch:** During Phase 3, ask: "If tiers change based on performance, how might that break our causal assumptions?"  

  ---

  ### **Why This Works**  
  - **Tension Arc:** Gladiators invest in maximizing points → Scouts/Commissioner crown "inferior" winners → Disaggregation forces cognitive dissonance → Causal stories expose ambiguity.  
  - **Low Tech, High Engagement:** Physical decks make probabilities visceral; roles (Scouts/Commissioner) create narrative stakes.  
  - **Causal Pedagogy:** The "three stories" phase explicitly ties statistics to causality.  

  **Final Prep Tip:** Dry-run with TAs to balance deck-shuffling speed. Print backup tables in case real-world data deviates.
