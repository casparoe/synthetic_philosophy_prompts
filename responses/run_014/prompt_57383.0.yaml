answer: |-
  Here’s a systematic breakdown of desiderata for substantive accounts of idealized deliberation, structured to resolve your metaethical stalemate. The goal is a **procedural specification adequate for metaethical justification** (settling disputes about normative authority) *and* operationalization (e.g., AI alignment targets), with distinctions noted.

  ---

  ### **Core Desiderata**  
  1. **Non-Arbitrary Starting Materials**  
     - *Why*: Avoids "garbage in, garbage out" (e.g., idealizing a Nazi’s desires might yield abhorrent norms).  
     - *Requirement*: Justify initial inputs (beliefs/desires) without presupposing normativity. *Non-negotiable*.  
     - *Challenge*: Raw desires? Current beliefs? Neutralized ("laundered") states?  

  2. **Closed & Complete Idealizing Parameters**  
     - *Why*: An open-ended list (e.g., "any improvement") is vacuously procedural.  
     - *Requirement*: Fixed criteria (e.g., "full relevant information + cognitive coherence"). *Non-negotiable for substantive accounts*.  

  3. **Non-Question-Begging Conditions**  
     - *Why*: If idealization parameters covertly encode moral facts (e.g., "reasoning impartially" *means* reasoning morally), the account is circular.  
     - *Requirement*: Conditions defined descriptively (e.g., "logical consistency," "causal knowledge"). *Non-negotiable*.  

  4. **Recognizability**  
     - *Why*: Outputs must be *attributable* to the agent to avoid alienation (e.g., Williams’ "integrity" objection).  
     - *Requirement*: Agent must see the result as an extension of their agency. *Negotiable: reflects internalist/constructivist commitments*. Externalists reject this.  

  5. **Psychological Realism**  
     - *Why*: Reflection sometimes degrades judgment (e.g., overthinking biases). Idealization must not assume infallible rationality.  
     - *Requirement*: Compatible with empirical psychology. *Non-negotiable* (avoids false idealizations).  

  ---

  ### **Your Suspected Load-Bearing Requirements**  
  6. **Idempotence**  
     - *Why*: Outputs should be stable. If re-idealization shifts the result, the procedure lacks authority.  
     - *Verdict*: **Non-negotiable** for convergence. Unstable outputs invite regress.  

  7. **Monotonicity of Partial Idealization**  
     - *Why*: Does "more information → better approximation" hold? Psychological evidence suggests not (e.g., information overload).  
     - *Verdict*: **False prejudice**. *Reject* monotonicity; bounded idealization may distort (e.g., incoherent fragments). Non-monotonic procedures are viable if stable at limits.  

  8. **Unbounded-Parameter Problem**  
     - *Why*: "Full information" or "perfect coherence" may have no maximum or plateau.  
     - *Requirement*: Define convergence conditions (e.g., stability under limiting sequences, fixed points). *Non-negotiable*—without this, the output is undefined.  

  ---

  ### **Additional Critical Requirements**  
  9. **Convergence/Stability**  
     - *Why*: Idealization must reach a *unique or stable endpoint* (e.g., a fixed point under reflection).  
     - *Verdict*: **Non-negotiable** for avoiding arbitrariness. *But* "unique convergence" is a **realist prejudice**; constructivists may accept multiple coherent equilibria.  

  10. **Tractability (for Operationalization)**  
      - *Why*: For AI alignment, the procedure must be computable (e.g., "coherent extrapolated volition" requires finite steps).  
      - *Metaethics vs. AI*: Vital for AI; optional for metaethics (where idealized limits suffice).  

  11. **Non-Ideal Authority**  
      - *Why*: Why should actual agents care about the output? Must justify normative force without realism.  
      - *Requirement*: Link to agency (e.g., "this is what you’d commit to"). *Negotiable*: Internalists demand it; externalists ground force elsewhere.  

  ---

  ### **Tensions & Eliminators**  
  - **Joint Unsatisfiability**: **Recognizability vs. Convergence/Stability**.  
    - *Conflict*: Deep idealization (needed for stability) often alienates agents (e.g., utilitarians idealizing to total impartiality). Recognizable outputs may be unstable.  
    - *Result*: **Your friend wins on structural grounds**—no account satisfies both without smuggling in norms.  

  - **Most Eliminative Requirement**: **Convergence/Stability**.  
    - Kills: Open-ended procedures (e.g., "endless reflection"), non-idempotent accounts, and undefined limits (e.g., naïve "full information" without convergence metrics).  

  ---

  ### **Scoring Leading Contenders**  
  - **Brandt’s Cognitive Psychotherapy**:  
    Fails **convergence** (no stability guarantee), **monotonicity** (more facts may worsen coherence), and **non-arbitrary inputs** (relies on "aversion therapy" as normatively loaded).  

  - **Railton’s Full-Information Welfare**:  
    Fails **unbounded parameters** ("full information" undefined), **recognizability** (alienated ideal self), and **non-question-beggingness** (selects "relevant" information via welfare).  

  - **Ideal Observer Theory**:  
    Fails **non-quey-stion-beggingness** (e.g., "impartiality" encodes morality) and **psychological realism** (demands infallibility).  

  - **Coherent Extrapolated Volition (CEV)**:  
    Fails **tractability** (no convergence algorithm) and **closed parameters** (vague "coherence" + "extrapolation").  

  ---

  ### **Verdict**  
  **For metaethics**: All contenders fail at least one non-negotiable desideratum (usually **convergence** or **non-question-beggingness**). The **recognizability/stability conflict** is fatal—proceduralism either alienates or lacks authority.  
  **For AI alignment**: Focus on **tractable approximations with stability metrics** (e.g., fixed-point algorithms). Sacrifice recognizability; embrace external justification (e.g., "this prevents extinction").  

  This suggests your friend’s challenge stands: spelling out idealization *without* smuggling in norms remains elusive. The tension between recognizability and convergence may be insoluble within pure proceduralism.
