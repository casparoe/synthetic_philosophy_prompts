  We are given a request from a distributed systems expert to map certain philosophical concepts (KK principle, luminosity, Williamson's anti-luminosity argument) into the vocabulary of distributed systems. The requester has a strong background in distributed systems (consensus, failure detectors, etc.) but little in philosophy. The goal is to test candidate mappings and report on the residue (what doesn't map) and why.

  The requester's vocabulary includes:
  - Processes, local state, global state
  - Consensus protocols, failure detectors
  - Consistent global snapshots, quorum systems
  - Linearizability, safety and liveness
  - Impossibility results (e.g., FLP, two generals)
