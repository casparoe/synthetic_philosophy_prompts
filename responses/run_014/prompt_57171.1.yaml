  ### **5. Safety Premise**  
  **Claim**: If one knows C holds at step i, then C must hold at step i+1 (adjacent in the series).  

  **Restatement in Your Terms**:  
  - This is **explicitly about resolution**:  
    - Knowledge requires a "margin of safety" (cf. Williamson). If a sensor’s granularity is coarser than the step size between i and i+1, it cannot reliably certify C at i without C holding at i+1.  
  - Example: A process can’t "know" it holds a lease if the lease expiry time is closer than clock granularity.  

  **Translation Label**: **Clean**  
  - **Residue**: None. Aligns with your concept of sensor/clock resolution limits.  
  - **Fault Diagnosis**:  
    - Philosophers’ claims are determinate and map perfectly.  

