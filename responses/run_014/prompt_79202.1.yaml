prompt: |-
  I'm a freelance journalist — AI mostly, with detours into math and crypto — and I've somehow made the shortlist for a six-month mid-career fellowship where they expect you to come out with a piece of writing *and* something that could pass for research. I want to spend it on the debate idea in AI safety: two models argue opposite sides of a question, a human (or a weaker model) judges, and the hope is that the honest side wins even when the judge can't solve the problem, because the judge only has to check the steps. The pitch, as I understand it, is that this gets you way past what a judge could ever verify alone — PSPACE instead of NP, or something like that. I've definately got the shape of the setup. What I need is a proposal I can actually hand in.

  Here's my half-formed angle, and I'd like the whole thing built around it. Everyone treats the killer objection as the obfuscated-arguments problem: the liar buries the false step inside an argument so long and tangled that the honest side can't dig it out in the time available, even though the honest side is right. I think "long" is a red herring. The real question is whether a bad argument always has a flaw that can be localized to a short sub-claim the judge could check on its own. If every flaw is localizable, obfuscation can't win — the honest debater just points at the short bad step. If some flaws are irreducibly global, so that they only show up when you hold fifty steps together at once, then debate has a hole that no amount of extra judge competence plugs. And even in the good case theres a second question hanging off it: finding the localization is itself a search problem, and nothing in the setup says the honest side can do that search cheaply, or that the judge will recognize a correct localization when it's handed one. So: (a) is every flaw localizable, and (b) if so, can the honest debater find the localization inside the judge's attention budget — and is that budget the binding constraint, rather than argument length?

  Write me the two-page proposal. I need the question stated so that it has a determinate answer; why the obvious replies don't settle it (get a better judge, give the honest side more time, let both sides use the same tricks, just cap the length); what I'd actually do month by month — I'm a reporter, not a mathematician, so be honest about what I can pull off, including the interviewing and reporting side, not just the armchair side; what a real result looks like as opposed to a nice essay; and what would count as the project failing. Use two or three concrete test cases to make it bite — a proof with a gap spread across the definitions, a bug that only appears when two modules interact, a claim that misleads only through selective citation, that kind of thing. Don't give me a reading list or citations, I'll chase those down myself, and don't lean on specific papers I probably haven't read.

  At the end, tell me how confident you actually are in the central bet — that the length framing is the wrong one — and single out the part of this you're least sure about.
reasoning: |-
  We are writing a two-page research proposal for a fellowship. The central question is about AI debate and whether flaws in arguments can be localized to short sub-claims that a judge can verify, and whether the honest debater can find such a localization within the judge's attention budget.

  Structure of the proposal:

  1. **Title and Abstract**: A concise summary of the project.

  2. **Introduction and Research Question**: 
     - Context: AI safety via debate, where two models argue and a human (or weak AI) judges.
     - The promise: The judge can verify steps even when they cannot solve the whole problem, potentially reaching PSPACE instead of NP.
     - The problem: Obfuscated arguments might hide flaws in long, complex arguments.
     - Our angle: We challenge the focus on length and propose that the key is whether every flaw is localizable to a short, checkable sub-claim. Then, we must consider if the honest debater can find and present that localization within the judge's attention budget.

     The research question: 
     - (a) Are all flaws in arguments localizable to a short sub-claim that a judge can verify independently? 
     - (b) If so, can the honest debater efficiently find and present such a localization within the constraints of the judge's attention, and is the attention budget the binding constraint (rather than the total argument length)?

  3. **Why the Obvious Replies Don't Settle It**:
     - "Get a better judge": We assume the judge is bounded (human or weak AI). Making the judge stronger might defeat the purpose (if we wanted a superhuman judge, we wouldn't need debate). The question is about what can be verified with a bounded judge.
     - "Give the honest side more time": The debate protocol typically limits time. Also, the honest side might not know the flaw in advance and must search for it during the debate.
     - "Let both sides use the same tricks": We are considering a setting where both sides can present long arguments, but we are asking whether the honest side can always point to a localized flaw regardless.
     - "Just cap the length": Even with a length cap, the flaw might be spread across the entire argument and not be localizable to a short segment. Also, capping length might prevent the honest side from making their full case.

  4. **Methodology and Plan**:
     - We are a journalist, so we will combine conceptual analysis, expert interviews, and concrete case studies.
     - Month-by-month plan (6 months):
       - Month 1: Literature review and framing the question precisely. Interview key researchers in AI safety and computational complexity (e.g., from OpenAI, FHI, academic institutions).
       - Month 2: Develop 3-5 concrete test cases (examples) that represent different types of flaws. Examples:
          1. A mathematical proof with a gap that is spread across multiple definitions and steps (e.g., a flawed proof of the Four Color Theorem where the flaw is in the combinatorial choices that interact globally).
          2. A software bug that only appears when two modules interact (e.g., a concurrency issue in distributed systems).
          3. A misleading claim in a policy debate due to selective citation of studies (the flaw is not in any single citation but in the pattern of omission and emphasis).
       - Month 3: Analyze each test case for localizability. For each, ask: 
           - Is there a short sub-claim that, if verified, would reveal the flaw? 
           - How hard is it for the honest debater to find that sub-claim?
           - How would a judge verify that sub-claim?
       - Month 4: Conduct thought experiments and simulations (if feasible with simple models) or collect expert opinions on the test cases. Interview experts in debate protocols, logic, and verification.
       - Month 5: Synthesize findings and consider implications for the debate protocol. What does this say about the attention budget vs. length constraints?
       - Month 6: Write up the results as a research report and a journalistic piece.

  5. **Expected Outcomes**:
     - A real result would be a clear classification of the test cases: which flaws are localizable and which are not, and under what conditions. Also, we might identify the computational nature of the search for the localization (e.g., is it NP-hard?).
     - We might produce a theorem-like statement for a simplified model (if we collaborate with a mathematician) or at least a rigorous conceptual framework.
     - Alternatively, we might conclude that the question is more nuanced and that the attention budget is often the key constraint, leading to recommendations for debate design.

  6. **What Failure Looks Like**:
     - The test cases might be too diverse to draw general conclusions.
     - We might find that the localizability question is too abstract and not amenable to our approach.
     - The project might reveal that the length constraint is actually the dominant factor in practice, undermining our central bet.

  7. **Confidence in the Central Bet**:
     - We are fairly confident that the length framing is a red herring and that the key is localizability and the attention budget. However, we are least sure about part (b): whether the honest debater can efficiently find the localization. This search might be computationally hard, or it might require domain-specific insights that the honest debater doesn't have.

  Let's write the proposal accordingly.
answer: |-
  ### Proposal: Localizing Flaws in AI Debate—Beyond the Obfuscation Red Herring  

  **Abstract**  
  Current AI debate protocols aim to amplify a weak judge’s capabilities by having two models argue opposing claims, with the assumption that the honest side can isolate flaws in the opponent’s argument into short, verifiable sub-claims. This proposal challenges the field’s focus on *argument length* as the primary vulnerability (e.g., “obfuscated lies”). Instead, I argue the core questions are: (a) whether *all* flaws can be localized to a concise sub-claim checkable by the judge, and (b) if localization is possible, whether the honest debater can *efficiently find and present it* within the judge’s attention budget. I will investigate via concrete test cases, expert interviews, and computational analysis, producing both a research report and a journalistic narrative. Success would reveal whether debate’s promise—exponentially scaling the judge’s reach—rests on fragile assumptions.  

  ### 1. Introduction and Research Question  
  **Context**: AI debate (e.g., Irving et al.’s work) is touted as a safety mechanism: two models argue, a human judge evaluates, and the system’s goal is for the honest side to win even when the judge cannot independently solve the problem. The theoretical appeal is that verification of steps might access complexity classes like PSPACE, surpassing the judge’s native capabilities (e.g., NP). Yet a persistent objection is “obfuscated arguments”—a dishonest model buries a flaw in a long, complex case, overwhelming the honest rebuttal.  

  **The Gap**: This objection fixates on *length* as the attack vector. I contend this misses the point. The decisive issue is **localizability**:  
  - **Question (a)**: Is every flaw in an argument reducible to a *short*, independently verifiable sub-claim (e.g., a single false statement or inconsistent premise) that the judge can validate without understanding the entire argument?  
  - **Question (b)**: If so, can the honest debater *find* this localization under debate constraints (time, interaction rules), and is the judge’s *attention*—not computational resources—the binding limit?  

  If flaws are non-localizable (e.g., requiring simultaneous validation of 50 steps), debate fails. Even if localizable, if finding the flaw is intractable for the honest side, or the judge cannot recognize a valid localization, the protocol is brittle.  

  **Core Hypothesis**: Length is secondary; localizability and attention-constrained search define debate’s viability.  

  ### 2. Why Obvious Solutions Fail  
  - **“Use a stronger judge”**: Defeats the purpose. Debate aims to leverage weak judges (e.g., humans). A superhuman judge doesn’t need debate.  
  - **“Give the honest side more time”**: Debate protocols are time-bound. The honest model must search for flaws *during* the exchange, not in unbounded isolation.  
  - **“Cap argument length”**: Artificially shortening arguments might prevent honest models from constructing their case, while non-localizable flaws could persist in truncated forms.  
  - **“Allow both sides equal tricks”**: Even if both models use obfuscation, the honest side’s *inability to localize* a flaw (due to global dependencies) could still hand victory to lies.  

  These miss the crux: localization is a property of the *flaw*, not just the argument.  

  ### 3. Methodology: A Reporter’s Approach  
  I am a journalist, not a formal researcher. My strength is synthesizing expert insights, not proving theorems. Thus, I will:  
  - **Ground in test cases**: Concrete examples to make abstract questions tangible:  
    1. **Mathematical Gap**: A flawed proof of “P = NP” where the error emerges only when comparing definitions across 20 steps (e.g., a hidden circularity in reduction steps). *Test for (a)*: Can the flaw be pinned to one line? *Test for (b)*: How hard is it to isolate this line mid-debate?  
    2. **Software Bug**: A distributed system error that crashes only when Module A (memory allocation) interacts with Module B (network calls). *Test for (a)*: Can the flaw be localized to a single interaction (e.g., “Call X in A violates B’s API”)? *Test for (b)*: Is finding this interaction feasible if the dishonest side floods the debate with irrelevant logs?  
    3. **Misleading Citation**: A climate policy claim using 10 studies that are individually sound but collectively misrepresent consensus (e.g., omitting key counter-evidence). *Test for (a)*: Can the flaw be reduced to “Study X was misused” or is the deception holistic? *Test for (b)*: Can the honest side identify the critical omission under time pressure?  
  - **Interviews**: 15–20 experts across AI safety (e.g., Geoffrey Irving, Paul Christiano), complexity theory, and logic (e.g., Scott Aaronson), probing:  
    - “Is there a flaw type that *cannot* be localized?”  
    - “In practice, is localization harder than generating arguments?”  
  - **Computational Experiments**: Partner with a theorist (e.g., via Berkeley’s CHAI) to simulate simple debate games. Example: Can an “honest” agent find a localizable flaw in a graph problem where the liar’s error is a global property (e.g., a Hamiltonian cycle)?  

  **6-Month Plan**:  
  - **Months 1–2**: Deep dive into debate literature; identify test cases; interview 5–8 AI safety researchers.  
  - **Months 3–4**: Analyze test cases; interview complexity theorists and logicians; draft preliminary findings.  
  - **Months 5–6**: Run lightweight simulations (e.g., with a GPT-3.5 judge); synthesize into a research report (answering (a)/(b)) and a journalistic piece (narrating the stakes).  

  **Deliverables**:  
  - A **research report** with:  
    - A taxonomy of flaws by localizability (e.g., “localizable,” “global,” “attention-bound”).  
    - Conditions under which honest debaters fail to localize (e.g., when search is NP-hard).  
  - A **journalistic article** for outlets like *Wired* or *The Atlantic*, humanizing the tension between theory and practice.  

  ### 4. What Success and Failure Look Like  
  - **Success**: A determinate answer for my test cases. Example result: *“Global flaws exist in math (case 1) but not software (case 2); however, localization search often exceeds debate time limits, making attention the bottleneck.”* This could reframe debate research toward search efficiency.  
  - **Failure**: The test cases resist generalization (e.g., all flaws are localizable in theory but never in practice), or the question proves too abstract for empirical traction. If no clear pattern emerges, I will document why—e.g., “Localization depends entirely on domain-specific ontology.”  

  ### 5. Confidence and Uncertainty  
  - **Central Bet (90% confidence)**: The length framing *is* a red herring. Obfuscation matters only if localization fails; attention bottlenecks are more fundamental.  
  - **Least Certain (Key Risk)**: **Part (b) (search efficiency)**. I suspect the honest side might not find localizations fast enough (e.g., if the search space scales with argument length), but I lack proof. Experts disagree on whether debate incentivizes efficient search. This could unravel the protocol.  

  ---  
  **Final Pitch**: This project merges journalism and research to scrutinize AI debate’s foundations. By replacing vague fears of “long arguments” with testable claims about localization and attention, I will deliver actionable insights—or expose a critical weakness—for one of AI safety’s most promising ideas.
