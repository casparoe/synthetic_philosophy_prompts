  The cruxes need to be identified. The user thought about convergence across methods and the "joints" metaphor. That makes sense. I should explore whether convergence indicates discovery or convention, and if the metaphor implies pre-existing structure. Another crux could be if stable categories require human-independent factors or just consistent utility.

