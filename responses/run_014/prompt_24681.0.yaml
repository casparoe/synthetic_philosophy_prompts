prompt: |-
  I'm in a philosophy of physics seminar this semester and we spent like a whole week on the hole argument and the substantivalism vs relationism debate, and I'm still a bit lost. A classmate of mine basically shut down the discussion by going "general covariance is just coordinate freedom, it's a feature of the description not the world" and then waved the whole hole argument away as some kind of linguistic artifact. I can't tell if hes right and I can't even articulate what would be wrong with that, partly because I keep hearing other people say the hole argument only works if you treat covariance as a real gauge redundancy and not just a coordinate choice, which sounds like the opposite of what he was claiming. Can you lay out the different precise claims that slogan could actually be making — what kind of coordinate freedom, at what level (the formulation, the theory, the physical states), and whether it's a trivial fact about notation or a substantive claim about the ontology of GR — and for each say whether it's defensible and whether it actually supports dismissing the hole argument? I want it as a numbered list of exactly five items, each a sentence or two, no intro or conclusion, so I can bring it back to the seminar on Thursday.
