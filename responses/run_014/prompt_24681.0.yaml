  First, I recall the hole argument involves Einstein's general relativity and whether spacetime points have independent existence. The classmate's dismissal hinges on interpreting general covariance as merely about coordinates, not physical reality. But others argue the hole argument only matters if covariance is a gauge symmetry, indicating redundancy in physical states.

