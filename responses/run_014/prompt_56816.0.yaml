prompt: |-
  So I sit on my professional association's classification committee — the body that decides what goes into our diagnostic manual and what comes out — and I'm trying to write up my own thinking before next month's meeting, because I can already tell we're going to argue in circles. What I want from you is a precedent-consistent recommendation, not a general essay about diagnosis. Please write in American English, and don't bother with references or a reading list; I just want the reasoning.

  Our record over the last decade, roughly as it appears in the minutes:

  1. Nine years ago we approved a brand-new category for a dissociative presentation that clinicians had already been coding under a catch-all residual code for about ten years. The stated rationale: the thing was already being recognized in practice, and giving it a name meant people could get treatment covered and stopped being told it was all in their heads.
  2. At that same meeting we rejected a proposed "mild" subtype of an existing mood category. Rationale: we couldn't draw the threshold tightly enough, and we expected a mild subtype to swallow the parent category.
  3. Six years ago we approved a purely nominal change — swapping a term that had curdled into an insult for a descriptive one — with zero change to the criteria. Nobody argued.
  4. Also six years ago we declined to give its own category to a distress syndrome reported mainly in one region, but we did add a paragraph about it to the cultural-considerations section. Rationale, more or less: the people who brought it to us wanted recognition, not a new box.
  5. Three years ago we rejected a proposal to create a category for a behavior pattern that had spread extremely fast through short-video platforms, even though we had a large petition from people saying the label had changed their lives and got them help. Rationale: we asked how many of these cases would have shown up absent the online spread, nobody could answer, and we didn't want to ratify a prevalence figure we couldn't interpret.
  6. Same year we *approved* a category for a presentation seen almost entirely in people who can't report on their own experience at all — late-stage dementia. There was an objection that the classified would have no voice in it. Rationale: no name meant no care pathway, and there was no plausible mechanism by which being classified would change what it's like to be that patient.
  7. Somewhere in there we attached a cautionary note to an established category, flagging that reported rates had climbed steeply and that clinicians should consider whether they were capturing normal variation. People inside the association credit that note with flattening the curve. Worth knowing: a naming intervention of ours has demonstrably bent a prevalence trend before.

  Now the live proposal, which is the one I actually need help with. It concerns an existing category we created about twenty-five years ago for what was then thought to be an uncommon post-traumatic presentation. Current state of play: prevalence in the clinics that report to us is something like thirty times what it was at introduction; the criteria have been broadened twice, each time partly in response to organized advocacy; most new cases now arrive having already self-identified through online communities before they ever see a clinician; a substantial minority of the clinicians who write to us say a lot of present-day cases wouldn't have met the original criteria; two well-organized groups run by people carrying the diagnosis have filed statements saying that narrowing or removing it would be catastrophic, would strip them of school and workplace accommodations, and would be experienced as the association telling them they were never really ill; and we have no data whatsoever on how many of today's cases would have presented at all if the label had never existed. The options on the table are: leave it alone, narrow the criteria, attach a cautionary note like in item 7, demote it to a research appendix for conditions needing further study, remove it, or rename it.

  Here's what I want:

  - Tell me what we should decide if we want to be consistent with our own record, and make the case for it against at least two of the other options rather than against a strawman.
  - Name the closest analog in the list above, and — this is the part I care about most — name the precedent that *looks* like the closest analog and would actually mislead us if we leaned on it. Say why the resemblance is superficial.
  - Reconstruct the implicit rule or rules we've been running. I suspect more than one fits everything we've done, and I suspect at least one of them says voice and self-organization matter while another says they don't, because items 5 and 6 point in opposite directions on that. Lay out the candidate rules, mark which ones our record genuinely can't distinguish, and propose one concrete hypothetical future proposal that would tell them apart — a case where the rules give different answers.
  - State flatly the principle we'd be adopting by whichever option you pick, especially as it concerns the two advocacy groups. If we narrow the criteria over their explicit objection, on the grounds that the category may have helped produce the very experiences they're reporting, what are we thereby committed to about the evidential weight of the classified people's own testimony? And is there a version of that commitment we could live with, or is it fatal to the whole enterprise?
  - Flag anywhere in the seven items above where we were inconsistent and didn't notice, or where the rationale we wrote down is doing work that a different rationale would do better.
  - Finally, tell me which part of the upcoming fight you think is about words rather than substance. My hunch is that "narrow the criteria," "demote to a research appendix," and "remove" get treated by both camps as three different acts when from the point of view of the person holding the diagnosis they might be one act, but I could be wrong and I want the wrongness checked.

  Please use headers and a short table comparing your recommended option against the main alternatives under each candidate rule you identify. Don't pad it out, and if you think the honest answer is that our precedents genuinely underdetermine this and we're just choosing, say that plainly instead of dressing up a coin flip as a derivation.
reasoning: |-
  Hmm, this is a complex request from a professional association committee member. They're dealing with a thorny diagnostic classification issue and want precedent-based reasoning without fluff. 

  Looking at their seven historical decisions, I notice patterns around pragmatism, unintended consequences, and social factors. The current dilemma involves a controversial category that's exploded in prevalence with heavy online influence and strong patient advocacy. 

  Key tensions I need to address:
  - Patient voice mattered in case 1 (dissociative disorder) but not in case 5 (viral behavior pattern) or 6 (dementia)
  - Prevalence concerns drove decisions in 2 (mild subtype rejection) and 5 (viral behavior rejection)
  - Terminology changes were non-controversial (case 3) while structural changes provoked debate

  For the current proposal about the overused trauma category, I'm considering the cautionary note option (item 7) as most consistent. It directly addresses prevalence concerns without revoking diagnoses. The dementia case (6) looks superficially similar due to non-verbal patients but differs crucially because that was about care access rather than overdiagnosis.

  Three implicit rules emerge from their history:
  1) Intervention Principle: Only classify when it improves outcomes without harm
  2) Diagnostic Integrity: Reject categories that might pathologize normal states
  3) Pragmatic Recognition: Honor clinical reality when naming aids treatment

  The advocacy group dilemma is tricky. If they narrow criteria against objections, they're essentially saying patient testimony can be epistemically limited when shaped by diagnostic labels. That's uncomfortable but not fatal if handled transparently.

  For the upcoming fight, the "demote to research appendix" vs "narrow criteria" debate is largely semantic - both reduce the diagnosis's clinical standing. The real substance is whether to maintain the category at all.

  I'll structure this with clear headers and a comparison table showing how options stack up against their historical principles. The cautionary note balances all concerns best while maintaining consistency.
answer: |-
  ## Recommendation & Precedential Analysis for Classification Committee

  **Recommended Action: Attach a cautionary note (Option 3).**

  **Closest Analog: Item 7 (Cautionary note on established category with steeply climbing rates).**
  *   **Why it fits:** Both involve an established category experiencing significant, potentially problematic prevalence increases. The intervention (a cautionary note) is directly analogous, proven effective in flattening a prevalence curve before, and addresses clinical awareness without altering diagnostic access or invalidating existing diagnoses. It targets the core concern (potential over-application/capture of normal variation) without the nuclear options.

  **Superficially Similar but Misleading Analog: Item 5 (Rejected viral behavior pattern).**
  *   **Why it's superficial:** Both involve online spread and uncertainty about label-driven presentation.  
  *   **Why it misleads:** Item 5 was a *proposal for a brand-new category* where causation (label creating the phenomenon) was the *primary concern* and there was no established clinical history *before* the online spread. Here, the category *predates* the online explosion by ~15 years, has an established clinical history (even if evolving), and recognized treatment pathways. Applying the "new label = potential artifact" rationale from Item 5 to an *old* label experiencing a surge ignores the category's established clinical validity and risks harming individuals reliant on it. The core problem here is potential *over-application/drift* of an existing valid construct, not necessarily the *creation* of an invalid one.

  **Implicit Rules & Analysis:**
  Our record suggests multiple, sometimes competing, principles:

  1.  **Rule A (Intervention Principle):** Classify when it demonstrably improves patient outcomes (access to care, validation, targeted treatment) without significant harm or pathologizing normal experience (Items 1, 6).
  2.  **Rule B (Diagnostic Integrity Principle):** Avoid classification when thresholds are indistinct, risk pathologizing normal variation, or risk the label itself driving/spawning the phenomenon (Items 2, 5).
  3.  **Rule C (Pragmatic Recognition Principle):** Acknowledge realities of clinical practice and patient experience, even if a full category isn't warranted (Items 3 [terminology], 4 [cultural note]).
  4.  **Rule D (Harm Mitigation Principle):** Prioritize actions that avoid tangible harm to vulnerable populations, especially regarding care access or validation, even if other principles might suggest removal (Items 1, 6, implicit in rejecting removal/demotion here due to groups' statements).
  5.  **Rule E (Epistemic Caution Principle):** Be wary when self-identification via specific communities/labels precedes clinical presentation, and data cannot disentangle the label's role in symptom formation/presentation (Items 5, 7).

  **Distinguishing Rules & Future Test Case:**
  *   **Indistinguishable on Voice:** Rules A & D both value patient voice/outcomes (supporting keeping/recognizing). Rule B & E prioritize diagnostic integrity/caution (potentially supporting removal/narrowing). Item 1 (Approved Dissociative) and Item 6 (Approved Dementia) used A/D. Item 5 (Rejected Viral) used B/E. **They conflict on the weight of patient voice vs. diagnostic caution when label-driven spread is suspected.**
  *   **Future Test Case to Distinguish A/D vs. B/E:** A proposal for a new category based *entirely* on self-identified experiences proliferating online, with no pre-internet clinical reports, strong advocacy, but no clear biological marker or functional impairment distinct from normal distress amplified by online communities. Rule A/D might lean towards recognition for validation/care. Rule B/E would strongly reject due to indistinct threshold and label-driven nature. This forces a choice between patient-led validation and diagnostic caution against potential artifact.

  **Principle Adopted & Evidential Weight:**
  By choosing the **Cautionary Note**, we adopt: **"When an established diagnostic category experiences rapid, potentially problematic prevalence growth potentially influenced by social factors and self-identification, the primary intervention should be heightened clinical awareness and scrutiny regarding appropriate application, preserving access while mitigating over-diagnosis."**

  *   **Regarding Advocacy Groups & Testimony:** This action *acknowledges* their experience and need for validation/access (Rule D) but does *not* fully endorse the current boundaries of the category or the inevitability of their self-identification as reflecting the *original* pathology. We are committed to the view that:
      *   Patient testimony about distress, identity, and need for support is **valid and crucial**.
      *   However, patient testimony about *the specific nature of the underlying pathology* or *the absolute necessity of the current diagnostic boundaries* **may be epistemically limited** if the diagnostic label itself significantly shaped their experience and understanding of their distress. The label *may* have helped construct the very phenomenology they report.
  *   **Is it livable?** Yes. We can live with this by:
      1.  Separating the **validity of the distress/need** from the **specificity/accuracy of the current diagnostic construct**.
      2.  Emphasizing that the cautionary note targets *clinical application*, not patient experience. It asks clinicians: "Is *this specific presentation* best explained by the original traumatic pathology, or could other factors (including social identification) be contributing?" It does *not* tell patients "You were never really ill."

  **Inconsistencies & Rationale Gaps:**
  1.  **Item 2 (Mild Mood Subtype) vs. Item 1 (New Dissociative Category):** The "swallowing the parent category" rationale in 2 feels weak compared to 1. Why was indistinct threshold fatal for the mood subtype but not for the dissociative presentation (which presumably also had fuzzy boundaries initially)? The *unstated* difference might be the perceived harm of *not* classifying (Item 1: "stripped of care, told it's in their head") vs. the perceived harm *of* classifying (Item 2: over-medicalization). The harm arguments were asymmetric but not explicitly contrasted.
  2.  **Item 5 (Rejected Viral) vs. Item 6 (Approved Dementia):** The rationale for approving dementia ("no plausible mechanism by which being classified would change what it's like") is logically sound *for that context* but glosses over a deeper tension. Item 5 was rejected partly *because* classification *might* change prevalence (by validating/spreading). We implicitly valued *not* influencing prevalence for Item 5 but prioritized care access over *any* potential influence (positive or negative) on the patient's *internal* state for Item 6. The unstated factor is likely the **population's vulnerability and inability to advocate for themselves** in Item 6, triggering Rule D more strongly than in Item 5.

  **The Semantic Fight:**
  Your hunch is **correct**. The substantive divide is **"Maintain Clinical Standing"** (Leave Alone, Rename, Cautionary Note) vs. **"Reduce Clinical Standing"** (Narrow Criteria, Demote to Appendix, Remove). 

  *   **"Narrow Criteria," "Demote to Appendix," and "Remove"** are functionally equivalent **from the perspective of patients currently diagnosed under the broader criteria who might lose the diagnosis.** All three actions would likely result in them losing their diagnosis, accommodations, and sense of validation. The nuances (research status vs. gone entirely) are largely academic *to them*. The fight between proponents of these three is likely about *how much* to signal uncertainty (Demote) vs. decisiveness (Remove/Narrow) and preserving research access (Demote), **not** about the core impact on affected individuals.

  **Option Comparison Under Candidate Rules:**

  | Option             | Rule A (Intervention/Outcomes) | Rule B (Diagnostic Integrity) | Rule D (Harm Mitigation) | Rule E (Epistemic Caution) |
  | :----------------- | :------------------------------ | :----------------------------- | :------------------------ | :------------------------- |
  | **Cautionary Note (Rec)** | **✓ Preserves care access/validation. Promotes accurate application.** | **✓ Directly addresses over-application/drift risk. Raises clinical awareness.** | **✓ Avoids stripping accommodations/validation from current holders.** | **✓ Explicitly flags prevalence surge & role of self-ID/online spread. Promotes critical evaluation.** |
  | **Leave Alone**      | ✓ Preserves access/validation         | ✗ Ignores integrity concerns & potential over-diagnosis | ✓ Avoids immediate harm             | ✗ Does nothing to address epistemic concerns |
  | **Narrow Criteria**  | ✘ Cuts access for some, distress     | ✓ Tightens boundaries, improves specificity        | ✘ Actively harms those losing Dx    | ✓ Reduces future cases potentially driven by label |
  | **Demote Appendix**  | ✘ Severely limits access/utilization | ✓ Signals uncertainty, reduces clinical use       | ✘ Harm similar to Narrow/Remove     | ✓ Strong signal of uncertainty, halts clinical use |
  | **Remove**           | ✘ Eliminates access pathway          | ✓ Eliminates problematic category entirely        | ✘ Causes maximum harm/loss          | ✓ Eliminates the label's influence        |
  | **Rename**           | ~ Neutral (unless name is barrier)   | ~ Superficial, doesn't address core drift issue  | ✓ Avoids harm if name is pejorative | ✗ Does nothing to address core concerns |
