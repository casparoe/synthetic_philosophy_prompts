prompt: |-
  Thirty-four years doing scattering experiments at a synchrotron, the last five of them chairing the commitee that hands out beam time, and now I'm two years retired and reading political philosophy at the kitchen table with a coffee and a pencil. Sen's question about equality of what has got under my skin, mostly because I spent a decade answering a version of it in practice without realising I was doing philosophy. I've also been through Dworkin on resources and I honestly can't tell whether the thing we were distributing was a resource or a capability or neither.

  So here is what I actually did, case by case, and how it looks to me now.

  Two proposals, same science, same score from the reviewers. One from a flagship lab with a sample robot, a staff scientist and a travel budget; one from a state college where the PI drives five hours each way and mounts her own samples by hand. I gave the second one more shifts. Still think that was right.

  A proposal with badly designed controls that was going to waste the shift no matter how much time we gave it. I cut it. Cutting it made that group worse off and widened exactly the gap I'd just tried to narrow in the previous case, and I'd do it again tomorrow.

  A famous group that had burned 60 shifts over three years asked for 20 more. The science was excellent and would certainly have produced papers. I ranked it below a decent but unspectacular first-time user.

  A user who couldn't work the overnight shifts alone at the end station — she's a wheelchair user — so we put her in the day blocks and paid for an assistant. She cost the facility more beam time than anybody else that cycle. Obviously correct, no hesitation then or now.

  A group got 16 shifts, their postdoc quit in month two, they used 4. I docked them the following year. Notice that this is punishing people for bad luck, and bad luck is precisely what I compensated in the state college case.

  A year when the machine underperformed and all we could offer everybody was half of what they'd asked for. Perfectly equal, everyone equally badly served. That year was not better than the year before it, and I don't think the extra equality made it better in any way at all.

  Industrial users could buy shifts outright and the money went back into the academic pool. I voted for that every single time, which means I was happy to let money buy more of the thing I'd just spent six cases insisting shouldn't go to whoever could pay for it.

  My own attempt at a principle is this: equalise effective access, not equal hours — give people whatever it takes to convert a shift into science, with a floor below which nobody falls and a cap on how much one group can hold at once. It handles the wheelchair case, the state college, and the 60-shift group nicely. Its seems to blow up on the wasted shifts and the bad controls, because on a conversion story the right response to someone who can't convert is to help them convert, not to cut them off, and I definitely didn't want to fund their training out of my beam time.

  What I want from you: the principle, or the small set of competing ones, that actually delivers these verdicts. State it precisely, clause by clause, and for each clause tell me which case above it's there to handle and what it costs you elsewhere. Where yours and my effective-access version come apart, say so plainly rather than reconciling them politely. Then run it on two situations I never had to decide. First, a proposal for a fully autonomous experiment that drives itself and needs no human on site at all — the per-person metric seems to lose its grip there and I want to know what happens to the cap and the floor. Second, a proposal from a grad student whose PI died halfway through, to finish work that only the dead PI really understood. And be straight with me about which of my verdicts can't survive: I'd rather lose one cleanly than keep all seven with a fudge factor bolted on the side. No reading list, please — I've got one book and a library card that lapsed.
reasoning: |-
  Hmm, this user is a retired scientist with deep experience in resource allocation at a synchrotron facility, now pondering philosophical questions about equality. They've presented seven concrete cases from their committee work and want a principle that coherently explains all their decisions. 

  First, let's unpack what makes this query special. This isn't theoretical - it's lived ethics. The user clearly values intellectual honesty over politeness ("say so plainly rather than reconciling politely"). Their frustration with academic philosophy shines through - they want operational clarity, not citations. Notice how they reject hypotheticals by providing real cases, and dismiss reading lists despite clearly being well-read.

  The core tension in their cases is between three competing values: scientific merit, distributive fairness, and resource efficiency. Their "effective access" principle almost works but fails on the bad controls case. That's the key unlock - any principle must accommodate their seemingly contradictory action of both compensating for disadvantages (state college) and refusing to compensate for incompetence (bad controls). 

  For the wheelchair case, the solution was obvious because the barrier was purely physical. But for the PI death case I'm considering, it's about epistemic access - can the grad student even utilize the beam time without the PI's knowledge? That's where capability theory might help, but I must avoid jargon. 

  Industrial users paying for access seems contradictory until you see it as system-level optimization - the money improves access for others. The user's instinct to cap individual holdings (60-shift group) while maintaining a floor is smart, but needs to explicitly exclude non-converters. 

  Ah! The breakthrough is realizing that "effective access" requires two filters: first, minimum competence to utilize resources (screening out bad controls), then equitable distribution among qualified users. That resolves the apparent punishment of bad luck in the postdoc case - quitting didn't make them incompetent, just unlucky. 

  For the autonomous experiment, the "per-person" metric indeed fails. But the cap should apply to institutional holdings regardless of human involvement. The floor becomes trickier - maybe minimum allocation per research question rather than per researcher?

  The grad student case is heartbreaking. My principle would require assessing whether they can actually execute the work. If not, it's cruel to give them shifts they can't use - better to reallocate and support them elsewhere. The user might hate this answer, but they did say "be straight."

  Finally, which of their verdicts must go? The "perfectly equal" bad year case. Under this principle, equal misery isn't valuable - we'd prioritize users who could still produce science with reduced time. That's the cost of insisting on effective conversion.
answer: |-
  Your cases are a masterclass in practical distributive justice – here's a principle built from your verdicts, clause-by-clause, with no fudging and clear costs:

  ### The Operational Principle of Merit-Sensitive Equitable Conversion
  **Core:** Distribute beam time to maximize scientifically valuable output *subject to* ensuring equitable opportunity for competent researchers to convert allocated time into knowledge.

  **Clauses & Their Anchoring Cases:**

  1.  **Competence Threshold:** "Proposals must demonstrate technical feasibility and methodological soundness sufficient to produce reliable scientific data."
      *   **Handles:** Bad Controls Case (Cutting wasteful proposals).
      *   **Cost:** Creates a hard exclusion. Groups below this threshold get nothing, regardless of disadvantage or need ("widened the gap"). You prioritized resource efficacy over mitigating that specific inequality. This clause *breaks* your "effective access" principle for non-converters.

  2.  **Conversion Support:** "Provide necessary ancillary resources (personnel assistance, scheduling accommodations, basic equipment access) to overcome *external* barriers preventing a researcher *above the competence threshold* from converting allocated beam time into science."
      *   **Handles:** Wheelchair User Case (Paid assistant/day blocks).
      *   **Cost:** Reduces total beam time available for others. Implicitly prioritizes supporting individuals facing specific physical/access barriers over other potential uses. Differs from "effective access" by limiting support to *overcoming external barriers* for *competent* users, not general training.

  3.  **Disadvantage Compensation:** "Within the pool of proposals above the competence threshold, allocate proportionally more time to researchers or groups facing significant *systemic* resource disadvantages that demonstrably impede their *efficiency* in utilizing beam time, provided the scientific merit is comparable."
      *   **Handles:** State College vs. Flagship Lab Case (More shifts to manual-mounting PI).
      *   **Cost:** Reduces time available for well-resourced groups with equally meritorious science. Accepts lower overall facility throughput efficiency to promote diversity of participation and opportunity. This *is* "equalize effective access" for competent researchers.

  4.  **Anti-Hoarding Cap:** "Impose strict limits on the total beam time any single research group can hold consecutively or within a defined period, regardless of proposal merit or past success."
      *   **Handles:** 60-Shift Group Case (Ranked below first-time user).
      *   **Cost:** Risks losing high-impact science from proven groups. Prioritizes broad access and opportunity for new/less established groups over maximizing potential peak output. Directly implements a cap on holdings.

  5.  **Accountability for Utilization:** "Reduce future allocations for groups that significantly underutilize awarded beam time due to *avoidable* internal failures (poor planning, personnel management), but not solely due to unforeseeable bad luck."
      *   **Handles:** Postdoc Quit Case (Docked following year).
      *   **Cost:** Punishes groups for managerial failures, potentially exacerbating temporary setbacks. Distinguishes this from "bad luck compensation" (Clause 3) by focusing on responsibility. Your verdict *did* punish avoidable failure (not replacing the postdoc promptly?), even if triggered by bad luck (the quit). The principle makes the responsibility distinction explicit.

  6.  **Efficiency & Sustainability:** "Permit market mechanisms (e.g., industrial purchase) where they demonstrably increase the total quantity or quality of beam time available for the core academic mission without violating other clauses."
      *   **Handles:** Industrial Users Case (Voted for industrial money feeding academic pool).
      *   **Cost:** Creates a limited "money buys access" channel, contradicting a pure resource/capability egalitarianism *for that specific segment*. Justified systemically by increasing the pool for Clause 3 & 4. Differs from "effective access" by accepting this instrumental use of market logic.

  7.  **No Intrinsic Value to Equality:** "Distribute unavoidable shortages in a manner consistent with other clauses, recognizing that equal misery has no inherent moral or practical superiority."
      *   **Handles:** Machine Underperformance Year (Equal cuts, no perceived improvement).
      *   **Cost:** Explicitly rejects "equality of outcome" as a terminal value. The bad year wasn't "better" because cuts were equal. The principle cares about *opportunity* and *conversion*, not equal slices of a shrunken pie.

  ### Where This Diverges From Your Effective Access Principle
  *   **Clause 1 (Competence Threshold) is the Big Break:** Your principle says "give people whatever it takes to convert a shift into science." This principle says "Only give shifts to those who can *already* convert them *with* support for external barriers, and cut off those who can't/won't meet basic competence." You prioritized preventing waste over trying to train non-converters on the beam line. The principle hard-codes that.
  *   **Clause 5 (Accountability) Focuses on Responsibility:** Your principle might suggest endless support. This says support has limits when underutilization stems from avoidable failures.
  *   **Clause 6 (Efficiency) Embraces Instrumental Markets:** Your principle likely rejects money buying access. This accepts it *only* as a tool to grow the academic pool governed by Clauses 1-5.
  *   **Clause 7 (No Intrinsic Equality) Rejects Equal Misery:** Your principle might strive for equal effective access even in shortage. This doesn't.

  ### Verdicts That Can't Survive (Cleanly Lost)
  *   **The "Perfectly Equal" Bad Year (Clause 7):** Under this principle, distributing the shortage "perfectly equally" isn't required or valuable. You *could* still do it (it doesn't violate other clauses directly), but the principle offers no reason to prefer it over, say, protecting first-time users (Clause 4) or disadvantaged groups (Clause 3) from the *full* cut. Your intuition that the equality didn't help is validated; the principle doesn't mandate it.
  *   **Implicit Acceptance of "Bad Luck" in Postdoc Case (Refined by Clause 5):** Your initial description framed docking them as "punishing bad luck." Clause 5 refines this: it *does* punish (via reduced future allocation) the *failure to manage* the consequences of bad luck (not replacing the postdoc), not the bad luck itself. If the group could demonstrate the underutilization was *solely* due to unforeseeable bad luck *and* they managed it as well as possible, docking might not apply. Your action assumed their management failure.

  ### Applying to New Situations

  1.  **Fully Autonomous Experiment:**
      *   **Competence Threshold (Clause 1):** Does the proposal demonstrate the autonomous system is technically feasible and sound? If yes, it passes.
      *   **Conversion Support (Clause 2):** N/A. No human needs support to convert time. The resource *is* the machine time itself.
      *   **Disadvantage Compensation (Clause 3):** If the proposing group is systemically disadvantaged (e.g., a small university), they *could* receive proportionally more time *if* their science is comparable to others above threshold. The "per-person" metric vanishes, but the *group's* relative disadvantage in *securing resources* for *scientific output* remains relevant.
      *   **Anti-Hoarding Cap (Clause 4):** **CRITICAL HERE.** The cap applies to *group holdings*, not human utilization. A single group running endless autonomous experiments would hit the cap just like the 60-shift group. Prevents one group dominating the beam line.
      *   **Accountability (Clause 5):** Applies if they fail to deploy the autonomous system effectively (e.g., software bugs causing underutilization).
      *   **Floor:** The "floor" shifts. It's not about supporting individual access needs. The floor is implicitly maintained by the Competence Threshold (any competent group can apply) + Disadvantage Compensation (helps level the playing field for qualified but disadvantaged groups) + Anti-Hoarding Cap (prevents domination). A tiny group with a brilliant autonomous proposal should get time, potentially aided by Clause 3 if disadvantaged.

  2.  **Grad Student, Dead PI:**
      *   **Competence Threshold (Clause 1):** **This is the hurdle.** Can the grad student *demonstrate* they have (or can acquire with standard support, *not* extensive unique training) the technical understanding and skills to complete the work and convert beam time into valid science *without the PI*? This is about *their* competence *now* for *this specific experiment*. If the knowledge died with the PI and the student lacks it and cannot reasonably acquire it in time, the proposal fails Clause 1 – it's not technically feasible *by this proposer*. It would be cut like the bad controls, regardless of the student's disadvantage or the work's potential merit *if the PI lived*.
      *   **If They Pass Threshold:** Then other clauses apply:
          *   **Disadvantage Compensation (Clause 3):** They are likely highly disadvantaged (lost leader, emotional toll, potentially disrupted resources). If their proposal is scientifically sound (passes Clause 1) and comparable to others, they likely get favorable allocation.
          *   **Conversion Support (Clause 2):** Might include mentorship from another faculty member funded by the facility, if needed to bridge gaps *external* to the core experimental competence they demonstrated in the proposal.
      *   **The Hard Truth:** If the student genuinely cannot meet the Competence Threshold for this specific work without the PI, giving them beam time is wasteful (like the bad controls). The principle forces this difficult cut, prioritizing the effective use of a scarce resource over compassion in this specific allocation. Support should be offered elsewhere (finding a new project, mentorship).

  This principle delivers your verdicts by ruthlessly prioritizing *competent conversion of time into science* as the gatekeeper, then layering on equity measures (support for barriers, compensation for disadvantage, anti-hoarding) for those who pass, while using markets instrumentally to feed the system. It sacrifices pure compassion for non-converters (dead PI case) and rejects equal distribution as an end in itself, mirroring your hardest choices.
