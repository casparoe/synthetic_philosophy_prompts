prompt: |-
  I'm a clinical ethics consultant, and a case that keeps coming to me is a patient facing one of the big, irreversible decisions in their life — whether to have a first child, whether to have a major operation, whether to take a treatment that will change how they feel about themselves — where the usual advice of "imagine how you'll feel afterward and weigh it" breaks down, because they can't honestly picture an experience they've never had. I've been turning this over on my own, and I'd like a decision procedure I can actually run in a one-hour consultation: the questions to ask, in order, what counts as a good enough answer to each, how the procedure handles the fact that the patient can't attach a reliable value to the outcome in advance, where it stops, and where it has to hand the decision back to the patient as a matter of their own values rather than something I can settle for them. Please ground it in whatever the philosophy of decision-making actually says about experiences that can only be known from the inside, but write it so someone without that background can follow it, and be honest about which steps are just judgment dressed up as procedure. Then run it on two cases: a woman in her thirties deciding whether to have her first child, and a patient deciding whether to have an operation that will end years of chronic pain but leave them in a wheelchair.
reasoning: |-
  Okay, the user is a clinical ethics consultant dealing with patients facing irreversible life decisions. They need a structured, one-hour consultation method. Let me start by understanding the core problem: patients can't predict future feelings about experiences they've never had. The usual advice of imagining outcomes fails here.

  First, I need to ground this in decision-making philosophy. Literature on transformative experiences by L.A. Paul comes to mind. She argues that some decisions require experiences that change you fundamentally, making pre-experience predictions unreliable. That's exactly what the user is facing. Also, procedural rationality from decision theory: focus on the process, not the outcome, since the outcome's value is unknown.

  The user wants a step-by-step procedure for a one-hour session. It must be practical, with clear questions, criteria for answers, and acknowledgment of where judgment comes in. The procedure should handle the epistemic gap—how to decide without knowing the outcome's value. And it should end by returning the decision to the patient's values.

  Breaking down the steps:
  1. **Framing the Decision**: Acknowledge the uniqueness and irreversibility. This sets realistic expectations. Patients need to understand that the procedure won't give a definitive answer but will clarify their stance.
  2. **Mapping the Knowns**: Identify facts vs. values. Facts are medical info, values are personal. Separating these helps patients see what's objective and what's subjective.
  3. **Epistemic Honesty**: Admit the impossibility of knowing the future self. This reduces pressure to predict and shifts focus to current values.
  4. **Values Archaeology**: Explore core values through past decisions. This uses their history as a proxy for future preferences. The "why ladder" technique digs into underlying motivations.
  5. **Fear vs. Value Conflict**: Differentiate fears (fear of regret) from genuine conflicts in values (e.g., autonomy vs. family). This helps address emotional barriers.
  6. **Proxy Reasoning**: Use similar experiences as proxies. For childbirth, talking to parents; for surgery, connecting with others who had it. Reliable proxies are crucial here.
  7. **Decision Architecture**: Remove external pressures to isolate the patient's true motives. This step uncovers if they're deciding based on others' expectations.
  8. **Scenario Testing**: Present hypotheticals to provoke emotional responses. This reveals gut feelings when rational analysis falls short.
  9. **Agency and Regret Framing**: Reframe regret as a choice. Emphasizing ownership of the decision reduces future regret, regardless of outcome.
  10. **Handing Back the Decision**: Explicitly return the decision to the patient, affirming their autonomy. This maintains ethical boundaries.

  Now, applying this to the two cases. For the childbirth decision, the patient is stuck between identity and fear of regret. The procedure helps her see that her core value is growth through challenge, and her fear is manageable. For the chronic pain surgery, the conflict is between pain relief and mobility. The values archaeology reveals he values engagement over independence, shifting his perspective.

  I should highlight where judgment is involved: assessing the quality of proxies, interpreting emotional responses in scenario testing, and distinguishing fear from values. These steps aren't purely procedural but rely on the consultant's expertise.

  The user might also have deeper needs: wanting to reduce their own uncertainty as consultants, ensuring they don't overstep, and providing tangible tools for patients. The procedure addresses these by creating a structured yet flexible framework, acknowledging limitations, and empowering patients.
answer: |-
  Below is a practical, philosophically grounded decision procedure designed for irreversible "transformative choice" scenarios (drawing primarily on L.A. Paul's work on *transformative experience* and procedural rationality in decision theory). It fits within a 60-minute consultation and explicitly addresses the **epistemic gap** (the inability to know an experience before having it). The procedure has 10 steps, with time allocations, key questions, assessment criteria, and clear stopping points where judgment/values take over.

  ---

  ### **The DECIDE Framework: For Transformative Choices**  
  *(60-Minute Structure)*  

  #### **Core Philosophy**  
  1. **Transformative Experiences**: Some choices (like parenthood or radical disability) change your core preferences, identity, or phenomenology ("what it feels like"). You can’t rationally weigh outcomes because you don’t know your *future self*.  
  2. **Procedural Rationality**: We focus on *how* you decide—not predicting an outcome. Good decisions emerge from a defensible *process*.  
  3. **Values Archaeology**: We excavate your *current* values, not future ones.  
  4. **Epistemic Humility**: We acknowledge where reasoning stops and "leaps" begin.  

  ---

  ### **The Procedure**  
  **Step 1: Frame the Decision** (5 mins)  
  - **Goal**: Establish the decision’s nature and limits.  
  - **Question**: *"This decision is irreversible and will change parts of your identity or lived experience in ways neither of us can fully grasp now. My role isn’t to tell you what to do, but to help you clarify your thinking. Does that align with what you need today?"*  
  - **Good Enough**: Patient nods or verbally agrees. Proceed only if they understand this isn’t about "solving" the dilemma.  
  - **Handoff Point**: If they seek a definitive answer, clarify your role again or pause.  

  **Step 2: Map the Knowns** (7 mins)  
  - **Goal**: Separate *facts* from *values*.  
  - **Questions**:  
    - *"What are the concrete, objective facts (e.g., medical prognosis, recovery time, financial costs)?"*  
    - *"What are the uncertainties that scare you most?"*  
  - **Good Enough**: A concise list (e.g., "Surgery has 80% success rate but 100% chance of paralysis"; "Parenthood costs $20k/year and will change my freedom").  
  - **Judgment Alert**: Consultant must discern if facts are accurate (e.g., correct medical stats).  

  **Step 3: Epistemic Honesty** (5 mins)  
  - **Goal**: Name the unknowability.  
  - **Question**: *"What parts of the outcome feel impossible to imagine? Let’s list them explicitly."*  
  - **Good Enough**: Patient identifies >1 "unknowable" (e.g., *"How will I feel about being a parent?"* or *"Will pain relief compensate for losing my legs?"*).  
  - **Key Insight**: This step *legitimizes* their paralysis. Write these down visibly.  

  **Step 4: Values Archaeology** (15 mins)  
  - **Goal**: Uncover **current** values through past decisions.  
  - **Questions**:  
    - *"Describe 2–3 major decisions you’ve made. What values guided you?"* (e.g., career moves, relationships).  
    - *"Which values feel non-negotiable now? Autonomy? Connection? Purpose?"*  
    - *"Does this transformative choice align with or violate those values?"*  
  - **Good Enough**: 3–5 core values identified (e.g., "Independence," "Curiosity," "Loyalty").  
  - **Handoff Point**: Values are owned by the patient—consultant only reflects, *never* judges.  
  - **Judgment Alert**: Consultant probes for consistency (e.g., *"You value stability but are considering high-risk surgery—help me understand"*).  

  **Step 5: Fear vs. Value Conflict** (8 mins)  
  - **Goal**: Distinguish *fear of the unknown* from *genuine value clashes*.  
  - **Questions**:  
    - *"Is your hesitation about true value conflicts (e.g., ‘I value mobility AND pain relief, but can’t have both’), or fear of regretting the unknown?"*  
    - *"If you could magically know the outcome, would the decision be obvious?"*  
  - **Good Enough**: Patient distinguishes fear ("I’m scared I’ll hate parenthood") vs. conflict ("Motherhood clashes with my need for solitude").  
  - **Key Insight**: Fear is navigable; value conflicts require trade-offs.  

  **Step 6: Proxy Reasoning** (10 mins)  
  - **Goal**: Use "experiential proxies" to bridge the epistemic gap.  
  - **Questions**:  
    - *"Whose experience feels relatable? What did they underestimate/overestimate?"*  
    - *"If you imagine your wisest future self looking back, what might they emphasize?"*  
  - **Good Enough**: Patient identifies 1–2 reliable proxies (e.g., a friend with similar values who had the surgery).  
  - **Judgment Alert**: Consultant assesses proxy quality (e.g., *"Is their life context comparable?"*).  

  **Step 7: Decision Architecture** (5 mins)  
  - **Goal**: Remove external pressures.  
  - **Question**: *"If no one would judge you—partner, family, society—what would you choose?"*  
  - **Good Enough**: Patient differentiates internal vs. external motivations (e.g., *"I want a child, but I’m afraid of my mother’s criticism"*).  

  **Step 8: Scenario Testing** (3 mins)  
  - **Goal**: Trigger embodied intuition.  
  - **Question**: *"Picture committing to *Option A*. Notice your body’s reaction—relief, dread, numbness?"*  
  - **Good Enough**: Patient reports a physical/emotional response (e.g., "Tight chest at ‘no kids’").  
  - **Judgment Alert**: Consultant notes incongruence (e.g., "You say you want surgery but your voice shakes").  

  **Step 9: Agency & Regret Framing** (2 mins)  
  - **Goal**: Reframe regret as a function of agency.  
  - **Statement**: *"Regret often stems from feeling we decided passively. Whatever you choose, own it as *your* values-based leap."*  

  **Step 10: Hand Back the Decision** (0 mins)  
  - **Final Script**: *"We’ve clarified your values, named fears, and honored the unknowns. The decision is yours because only you can weigh what matters. Does anything feel clearer?"*  
  - **Ethical Handoff**: Patient explicitly accepts responsibility. Document their values/fears.  

  ---

  ### **Case Applications**  
  **Case 1: Woman (30s) Deciding on Parenthood**  
  - **Step 2 (Knowns)**: Fertility window, partner readiness, financial strain.  
  - **Step 3 (Unknowables)**: *"Will I love being a mother? Will I resent losing freedom?"*  
  - **Step 4 (Values)**: Autonomy, intellectual growth, family loyalty.  
  - **Step 5 (Fear vs. Conflict)**: *"Fear I’ll regret not having kids vs. conflict between autonomy and family."*  
  - **Step 6 (Proxies)**: Sister (similar values) who says *"I underestimated the joy of small moments."*  
  - **Step 8 (Scenario)**: Panic at "childfree life," calm at "motherhood" → signals latent preference.  
  - **Handoff**: *"Your values point toward embracing challenges for growth. It’s a leap—but yours to take."*  

  **Case 2: Chronic Pain Patient Considering Paralysis-Inducing Surgery**  
  - **Step 2 (Knowns)**: 90% pain reduction, permanent wheelchair use, 6-month rehab.  
  - **Step 3 (Unknowables)**: *"Will pain relief compensate for losing my legs? Will I still feel like ‘me’?"*  
  - **Step 4 (Values)**: Physical independence, creativity (painting), family presence.  
  - **Step 5 (Fear vs. Conflict)**: *"Conflict: Independence vs. being pain-free. Fear: That I’ll hate the wheelchair."*  
  - **Step 6 (Proxies)**: Online support group member: *"I miss hiking, but reading to my kids pain-free is worth it."*  
  - **Step 7 (Architecture)**: *"Without guilt toward my family, I’d do the surgery."*  
  - **Handoff**: *"You’re trading mobility for engagement. That aligns with valuing presence over performance. Own that choice."*  

  ---

  ### **Where Philosophy Meets Practice**  
  - **Judgment Dressed as Procedure**: Proxy assessment (Step 6), interpreting bodily reactions (Step 8), and values conflict analysis (Step 5) rely on consultant intuition.  
  - **The Leap**: Philosophy confirms some decisions *can’t* be made rationally—they require "transformative leaps" based on current values. Your role is to make the leap *deliberate*, not certain.  
  - **Ethical Anchors**: Patient autonomy (they own the values), beneficence (reducing decisional paralysis), and honesty about uncertainty.  

  This procedure doesn’t eliminate the agony of choice—but it crystallizes *why* it’s agonizing and grounds the next step in the patient’s lived values. As Paul argues: *Sometimes we choose who to become, not what we get.*
