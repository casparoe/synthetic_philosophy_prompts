answer: |-
  ### Comparison of Supererogation and Suberogation  
  **Structural Symmetry: Coherence of the "Normative Deficit"**  
  The proposed mirror-image structure appears coherent but faces significant tension:  
  - **Supererogation** ("normative surplus"): Clear coherence. Acts *exceeding* duty (e.g., heroic rescue) are praiseworthy but not required, preserving a gap between obligation and ideal.  
  - **Suberogation** ("normative deficit"): Problematic coherence. Acts *below an ideal but above duty* (e.g., not holding a door) introduce a "blame-adjacent" category that risks collapsing the distinction between *blameworthy wrongs* and *non-ideal but permissible* acts. Julia Driver argues this gap exists (e.g., minor rudeness isn’t immoral but merits disapproval), yet critics like David Heyd contend it erodes moral boundaries: if an act isn’t wrong, how can it warrant *any* blame? This challenges the stability of suberogation as a distinct category.  

  **Asymmetries in Defensibility: Can We Accept One but Reject the Other?**  
  Asymmetric acceptance (endorsing supererogation but rejecting suberogation) is defensible but unstable:  
  - **Cost as an asymmetric excuse**:  
    - In **supererogation**, high cost *excuses non-performance* of good acts (e.g., skipping a heroic rescue due to risk). No blame attaches.  
    - In **suberogation**, low cost *intensifies criticism* of sub-ideal acts (e.g., not holding a door). Here, cost isn’t an excuse but a reason for disapproval.  
  - **Asymmetry critique**: If we ground supererogation in cost-based excuses (per Heyd), consistency demands that *negligible-cost omissions* (e.g., suberogatory acts) warrant mild blame. Rejecting this invites arbitrariness: why does cost excuse in one direction but not justify criticism in the other? Still, asymmetric positions (e.g., Mellema’s) hold that morality permits "merely acceptable" acts without appraisal, resisting suberogation’s blame-adjacency.  

  **Theoretical Uptake Across Moral Frameworks**  
  | **Framework**       | **Supererogation**                          | **Suberogation**                              | **Compatibility** |  
  |---------------------|--------------------------------------------|----------------------------------------------|-------------------|  
  | **Maximizing Consequentialism** | Rejected (all suboptimal acts wrong)        | Rejected (same reason)                        | ❌ Neither fits |  
  | **Moderate Consequentialism**  | Possible (if duties set below maximum)      | Likely (permissible suboptimal acts = suberogatory) | ✅ Both fit |  
  | **Satisficing Consequentialism** | Possible (if "good enough" ≠ ideal)         | Unlikely (duty = satisficing threshold; below = wrong) | ⚠️ Only supererogation |  
  | **Deontology**      | Fits (duties ≠ ideals; e.g., Kant’s imperfect duties) | Controversial (no duty breach = no blame)     | ⚠️ Only supererogation stable |  
  | **Virtue Ethics**   | Fits (e.g., heroic acts exceed virtue’s demands) | Fits (minor callousness falls short of virtue) | ✅ Both fit |  

  ### Conclusion: Does Suberogation Deserve Equal Standing?  
  **Yes, but with qualifications**. Suberogation is **not a gerrymandered category** but a philosophically useful tool capturing three nuances:  
  1. **Moral residue**: Acts like minor rudeness generate "pro tanto" disvalue without full wrongness.  
  2. **Scalar morality**: It acknowledges that "permissible" isn’t binary—some acts inhabit a "permissible but criticizable" zone.  
  3. **Mirror completeness**: If supererogation exists, suberogation logically completes the moral landscape (duty < suberogatory < neutral < supererogatory < ideal).  

  **Key asymmetry**: Supererogation’s praise is less contested than suberogation’s blame. Yet dismissing suberogation reduces ethics to duty/virtue binaries, flattening everyday moral experiences (e.g., "not wrong, but you could’ve been kinder"). It deserves standing as a *descriptive* category for acts warranting disapproval without blame, enriching ethical theory beyond rudeness-talk. However, its instability in deontology and satisficing frameworks suggests it lacks supererogation’s broad applicability.  

  **Verdict**: Suberogation merits recognition, but its "mirror image" status is imperfect due to asymmetries in blame justifications and theoretical uptake. It is best positioned as a *complement* (not a twin) to supererogation.
