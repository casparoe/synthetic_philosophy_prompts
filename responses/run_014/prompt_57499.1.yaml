prompt: |-
  I'm on a dissertation committee and I've been asked to draft the standard we'll apply to the student's central claim: that the human chin is an adaptation. Her chapter offers four things — (1) no other primate, and no other hominin, has a projecting bony chin; (2) a finite element model in which chin shape lowers strain during chewing; (3) a cross-cultural rating study where more prominent chins scored higher on attractiveness; (4) the observation that the chin only shows up once the face and the tooth rows start shrinking. Two members say none of that can ever count, because a one-off trait with no living homolog doesn't permit the comparitive or experimental work an adaptation claim requires; a third says she's supplied exactly the selection analysis that morphology papers usually dodge.

  Before we argue about her, write the spec: what a demonstration that a unique, deep-time morphological feature is an adaptation actually has to deliver, with the case or consideration motivating each requirement, and with each marked as non-negotiable or as the preference of a particular camp. Most of all: is any subset of these requirements jointly unsatisfiable for a trait like this one, and if so which one has to go and what do you lose by dropping it? Then tell me which single requirement disposes of the most of her four items, and what the byproduct alternative owes us — an outright refutation, or just less plausibility than her story. Skip the overall verdict on the chapter.
reasoning: |-
  Okay, I need to help draft a standard for evaluating a dissertation claim that the human chin is an adaptation. The student presents four pieces of evidence: (1) uniqueness in primates and hominins, (2) a model showing reduced strain during chewing, (3) attractiveness ratings in a cross-cultural study, and (4) the chin's appearance during facial shrinkage. Committee members disagree: some say unique traits can't be studied as adaptations without homologs, while one thinks she's done a proper selection analysis. 

  First, I should outline what's required to prove adaptation for a unique, deep-time trait. I'll define adaptation as a trait shaped by natural selection for a specific function. The challenge here is the lack of comparative data due to uniqueness. So, I need to list requirements that cover evolutionary biology standards, marking each as non-negotiable or preferred by certain camps.

  Key requirements come to mind:
  - Functional necessity: Show the trait performs a function better than alternatives. This is core to adaptationism and probably non-negotiable.
  - Selective advantage: Demonstrate fitness benefits in relevant environments. Also essential.
  - Phylogenetic context: Address when and why the trait emerged. Important but tricky without homologs—maybe this is where camps clash.
  - Exclusion of alternatives: Rule out non-adaptive explanations like drift or constraint. Non-negotiable for rigor.
  - Mechanistic plausibility: Provide a feasible pathway for selection. This might be preferred by some but not all.

  For each, I'll add a case or consideration. For example, the chin's uniqueness means we can't use comparative methods, so we must rely more on engineering models or experimental proxies. That highlights the tension: some requirements might be jointly unsatisfiable. Specifically, comparative evidence and experimental validation could be impossible for a one-off trait, so we'd have to relax comparative standards and accept indirect evidence, losing strong phylogenetic support.

  Now, which single requirement disposes of most of the student's evidence? Likely the selective advantage part—it demands direct fitness evidence, which her items don't fully provide. Her model (2) and attractiveness study (3) hint at benefits but don't show actual survival/reproduction boosts. Without that, the case weakens, and alternatives like sexual selection or drift gain plausibility, even if not refuted.

  I'll structure the response clearly: start with the spec table, then discuss unsatisfiable requirements, and end with the key dispositive requirement. Keep it neutral and focused on standards, not judging her work yet. This should help the committee frame their debate.
answer: |-
  Here’s a draft specification for evaluating adaptation claims for unique, deep-time morphological traits, framed for your committee’s debate. Requirements are categorized, motivated, and assessed for feasibility in the chin case.

  ### **Standard for Demonstrating Adaptation of a Unique Trait**  
  *(Non-negotiable = Core evolutionary logic; Preference = Camp-specific emphasis)*  

  | Requirement                          | Case/Consideration                                                                 | Status               | Camp Alignment             |  
  |--------------------------------------|------------------------------------------------------------------------------------|----------------------|----------------------------|  
  | **1. Functional Utility**           | Must show the trait *could* enhance fitness via a plausible biological mechanism (e.g., biomechanical efficiency, signaling). Motivation: Adaptation requires a functional rationale; absence voids the claim. | Non-negotiable      | Universal                  |  
  | **2. Selective Advantage**          | Must demonstrate the trait *would have conferred* a net fitness benefit in the relevant ancestral environment. Motivation: Selection acts on fitness differences; mere function ≠ adaptation. | Non-negotiable      | Camp 3 ("selection analysis") |  
  | **3. Exclusion of Non-Adaptive Hypotheses** | Must rule out alternatives (e.g., genetic drift, pleiotropy, allometry, spandrel). Motivation: Parsimony demands rejecting null hypotheses of non-adaptation. | Non-negotiable      | Universal                  |  
  | **4. Phylogenetic/Historical Concordance** | Trait emergence should align temporally/causally with selective pressures (e.g., diet shift, social change). Motivation: Adaptation requires selective context at origin. | Non-negotiable      | Universal                  |  
  | **5. Comparative Evidence**         | Preferred: Homology/analogy tests across taxa to isolate function. Motivation: Controls for confounding factors; strengthens inference. | Preference          | Camps 1 & 2 (skeptics)     |  
  | **6. Experimental/Direct Fitness Evidence** | Preferred: Measures of survival/reproduction linked to trait variation. Motivation: Gold standard for selection. | Preference          | Camps 1 & 2 (skeptics)     |  

  ---

  ### **Joint Unsatisfiability & Trade-offs**  
  For **unique traits (no homologs)**, **Requirements 5 (Comparative Evidence) and 6 (Experimental Evidence) are jointly unsatisfiable** with standard methods.  
  - **Which must go?** Requirement 5 (comparative evidence) must be relaxed. It is methodologically impossible for a true autapomorphy.  
  - **What is lost?**  
    - Loss of **phylogenetic control**: Inability to distinguish adaptation from lineage-specific contingency.  
    - Loss of **causal isolation**: Harder to exclude drift/constraint without sister taxa variation.  
  - **Compensation required:** Strengthened emphasis on Requirements 1–4 via:  
    - Engineering/paleoenvironmental models (for function/historical context)  
    - Population genetics simulations (to test drift vs. selection)  
    - Indirect proxies of fitness (e.g., attractiveness studies as *potential* selective agents)  

  ---

  ### **Requirement Disposing of Most Evidence**  
  **Requirement 2 (Selective Advantage)** disposes of **3 of the 4 items** (1, 2, and 4) as insufficient alone:  
  - **Item 1 (Uniqueness):** Does not address fitness; only establishes novelty (compatible with drift).  
  - **Item 2 (Biomechanical Model):** Shows function *potential*, not actual fitness benefit (e.g., did reduced strain increase survival/reproduction?).  
  - **Item 4 (Developmental Timing):** Suggests historical contingency but not selection (e.g., chin could be a spandrel of tooth reduction).  
  - **Survives Scrutiny?** Item 3 (Attractiveness) *directly* addresses sexual selection (a fitness proxy) but is incomplete without:  
    - Link to reproductive success in ancestral contexts.  
    - Exclusion of non-adaptive mate choice (e.g., sensory bias).  

  ### **Consequence of Failing Requirement 2**  
  - **Byproduct alternatives gain plausibility** but are **not outright refuted**.  
  - **What the alternative owes:** A *mechanistically coherent null hypothesis* (e.g., chin as a biomechanical byproduct of facial retraction). It need not refute adaptation—it merely must be *equally or more parsimonious* without direct fitness evidence.  
  - **Cost to adaptation claim:** Without Requirement 2, the argument reduces to "functional plausibility + historical coincidence," which is vulnerable to spandrel/constraint explanations. Sexual selection (Item 3) becomes the strongest path but requires contextual reinforcement (e.g., fossil evidence of sexual dimorphism, universality beyond ratings).  

  ---

  This spec forces clarity: **Comparative methods (Requirement 5) are impossible for unique traits**, so the debate must focus on whether **fitness evidence (Requirement 2)** is robustly addressed *despite* this limitation. The student’s work hinges on whether Item 3 + modeling (Item 2) + timing (Item 4) collectively meet Requirement 2 *without* homologs. Camp 3 sees this as sufficient; Camps 1–2 demand impossible evidence unless standards adapt.
