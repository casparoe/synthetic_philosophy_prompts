          *   **Player:** One decision-maker facing two possible states/scenarios (X and Y), each occurring with some probability (but dominance must hold for each state separately!).
          *   **Strategies:** A, B, C, D
          *   **Payoffs:**
              ```
                     | X    Y
              -------|---------
              A      | 10    0
              B      | 0    10
              C      | 4     4
              D      | 3     3
              ```
          *   **Iterated Elimination:**
              1.  **Round 1 (Mixed):** The mixed strategy ** (0.5 A, 0.5 B)** yields (5, 5). This strictly dominates **D** (3, 3) since 5 > 3 in X *and* 5 > 3 in Y. Eliminate D.
              2.  **New Set:** {A, B, C}
              3.  **Round 2 (Mixed):** The same mixed strategy **(0.5 A, 0.5 B)** yields (5, 5). This strictly dominates **C** (4, 4) since 5 > 4 in X *and* 5 > 4 in Y. Eliminate C.
              4.  **Survives:** {A, B} (Neither dominates the other purely).

  4.  **Addressing Misconceptions (Embedded in Example & Directly Stated):**
      *   **"The dominating mix is the equilibrium mix."**
          *   **When:** When first defining mixed strategy dominance.
          *   **How:** Explicitly state: "This mix is **not** telling us what the player *will* do in equilibrium. It's **only** a certificate proving that the pure strategy (C or D) is strictly worse than this particular way of randomizing. Equilibrium is a separate concept we'll revisit later."
      *   **"You can eliminate in any order (like pure IESDS)."**
          *   **When:** After completing the iteration in the example.
          *   **How:** State clearly: "**For strict dominance (whether by pure or mixed strategies), the order of elimination does not matter.** What survives only depends on the dominance relations, not the order you remove things. (We are only doing strict dominance today! Things get trickier with weak dominance, but that's for later)."
      *   **"Whatever survives is played in Nash Equilibrium / is a Nash strategy."**
          *   **When:** When stating what survives IESDS at the end.
          *   **How:** State: "IESDS removes strategies that are **never** best responses *to any belief* about opponents (because they are strictly dominated). Therefore, any strategy played in *any* Nash Equilibrium (NE) must survive IESDS. **BUT:** Surviving IESDS does *not* guarantee a strategy is played in *some* NE. There might be no NE, or the NE might only use a subset of the surviving strategies. Surviving means it *could* be rational to play it under *some* belief about opponents."

  5.  **Order-Independence (Handling Carefully):**
      *   **How:** After finishing elimination in your example, state clearly: "A crucial point: **For strict dominance only, whether by pure or mixed strategies, the set of strategies that survive iterated elimination does not depend on the order in which you eliminate dominated strategies.** If a strategy is strictly dominated, it will be eliminated at some point no matter what order you use, and strategies that aren't dominated won't be eliminated. (Important Caveat: This guarantee *breaks down* if we allow *weak* dominance. But we are focusing *only* on strict dominance today. Weak dominance is more complex and order-dependent.)"

  6.  **The "Average" Fact:**
      *   **Verdict:** **Skip it.** It's fascinating, but illustrating it well requires another example/calculation. In 50 minutes, with the core concept and iterations being challenging enough, it's a distraction. File it away for office hours or a follow-up.

  7.  **The Closing Question & Refusal:**
      *   **Question:** "Look back at strategy C before it was eliminated. Why couldn't any *single* pure strategy (A or B or D) dominate it purely? Why did it take a *mix* of A and B to dominate it?" **(Forces them to articulate the core insight: Pure strategies excel in one state but suck in another; mixing hedges bets.)**
      *   **Flat Refusal:** "We are strictly focused on *strict* dominance today. We are **not** going to discuss weak dominance, correlated strategies, or why order-independence fails for weak dominance. Save those excellent questions for later lectures or office hours!"

  **Key Conspicuous Absence in Example:** No pure strategy Nash Equilibrium (since it's a one-player game vs. nature, NE isn't defined anyway). This helps avoid conflating dominance with equilibrium.

  **Why This Plan Works:**
  1.  **Builds Incrementally:** Starts from known (pure dominance), highlights its failure, introduces the new concept simply.
  2.  **One Anchoring Example:** Carries the entire conceptual load: demonstrates mixed dominance, its necessity, iterative elimination, and surviving set. Students see it unfold.
  3.  **Proactive Misconception Busting:** Addresses the big 3 head-on at the moment they are most likely to arise.
  4.  **Manages Complexity:** Handles order-independence honestly but minimally, avoids the weak dominance rabbit hole and the "average" fact.
  5.  **Clear Boundaries:** Starts and ends with sharp focus, reinforced by the closing Q&A.
  6.  **Time Realistic:** 5+10+20+5+5+5 = 50 minutes. Be disciplined with example setup and calculations! Practice the payoff checks beforehand.
