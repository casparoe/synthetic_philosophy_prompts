prompt: |-
  I'm TAing a fifty-minute section next week for second-years on iterated elimination of dominated strategies, and the new bit is strategies that get knocked out by a *mix* of other strategies rather than by any single pure one. Don't explain the material to me — plan how I should teach it. What order do the pieces have to go in, given that they've only done pure-strategy dominance and pure Nash so far, and they've met mixed strategies only as the thing a player does in equilibrium? What's the one example that carries the whole thing — I want it small, with no pure strategy dominating anything, and with the iterating actually doing work past the first round — and what should that example conspicuously not have? Which misconceptions will they walk in with or form (I'm guessing "the mix that dominates is the mix you'd play in equilibrium", "you can eliminate in any order", and "whatever survives is a Nash strategy") and at which point in the sequence do I head each one off? One I'm unsure about: order-independence holds for strict dominance but breaks once weak dominance is on the table — how do I say the true thing without opening that whole can of worms at this level? There's also a fact I like, that the average of two undominated strategies can itself be strictly dominated even when neither of them is; tell me wheather that earns a place in fifty minutes, and where. Then finish with one question to ask at the close that shows whether they've actually got it, and what I should flatly refuse to get into.
reasoning: |-
  Okay, let me tackle this TA's query step by step. The user is preparing a 50-minute section on iterated elimination of dominated strategies, focusing specifically on mixed-strategy dominance. They've outlined several constraints: students have only seen pure-strategy dominance and pure Nash so far, with mixed strategies introduced solely in the context of equilibrium. 

  First, I need to consider the core challenge here - introducing the concept that a pure strategy can be dominated by a mixed strategy even when no single pure strategy dominates it. This is abstract and likely counterintuitive for students. The key is to build this gradually while anticipating misconceptions.

  I recall some standard examples but most textbook cases either involve pure dominance or don't require multiple iterations. The user specifically wants an example with no pure dominance that requires multiple elimination rounds. The 3x3 game with strategies A,B,C for a single player comes to mind - where A is dominated by a mix of B and C, then after elimination, B becomes dominated by C. This satisfies all requirements: small size, no pure dominance, and iterated elimination actually does work.

  For misconceptions, I should prioritize addressing three big ones:
  - Students might think the dominating mix is the equilibrium strategy (need to explicitly separate the concepts)
  - They may assume elimination order doesn't matter (should emphasize strict vs weak but avoid diving deep)
  - Could wrongly believe surviving strategies are always Nash (must clarify that elimination only removes dominated responses)

  The order-independence issue is tricky. Since they're only doing strict dominance at this stage, I can safely state that order doesn't matter without mentioning weak dominance exceptions. Just a firm "this holds for strict dominance" should suffice.

  The interesting fact about averages of undominated strategies being dominated is tempting but probably not worth the time crunch. It might derail the core lesson. Better to file it away for office hours.

  For the closing question, something that tests if they understand the "why" behind mixed dominance would work well. Like asking why a particular strategy couldn't be eliminated by pure dominance but falls to a mixed strategy. And I'll explicitly refuse to discuss weak dominance or correlated strategies to stay focused.

  The flow should be: start with pure dominance recap (5 mins), show its limitation with a new example (10 mins), introduce mixed dominance concept (10 mins), demonstrate iteration (15 mins), address misconceptions during demo (5 mins), then wrap up with implications and that closing question (5 mins). The 3x3 matrix will carry through the whole session with progressively revealed layers.

  Timing will be tight but manageable if I stick to one extended example and actively suppress tangents. The key is making the "aha" moment land when they see how mixing creates domination that pure strategies couldn't.
