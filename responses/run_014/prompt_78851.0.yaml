  2.  **Introducing Mixed Strategy Dominance (10 min):**
      *   **Definition:** "A pure strategy S is **strictly dominated by a mixed strategy** if there exists a probability distribution (mix) over *other* pure strategies such that, no matter what opponents do, the *expected payoff* from playing the mix is strictly higher than playing S."
      *   **Key Visualization:** Draw a simple payoff matrix (start building your core example). Pick a row/column. Show numerically that *every* pure alternative loses to *some* opponent moves. Then, show a specific mix (e.g., 50/50) and calculate expected payoff vs. S for *each* opponent column. Emphasize "strictly greater for EVERY opponent profile."
      *   **Crucial Distinction:** "The mix doing the dominating is NOT necessarily anyone's equilibrium play! It's just a *mathematical tool* to prove S is a bad choice."
