  ### (2) Articulating the Rule(s) Explaining Her Track Record
  Maya's judgments are best explained by a **single, unified rule** that covers all cases—**the Norm Violation Rule**—with one key refinement. Below, I'll state the rule, contrast it with your hypotheses, and explain why it fits best.  

  - **The Norm Violation Rule:**  
    *"The side effect is intentional if the agent's action violated an applicable norm (workplace or societal) while bringing about the main goal. Norms are ‘applicable’ if they are treated as binding in the context (e.g., rules people follow, or societal expectations like not harming others). Intentionality depends ONLY on whether a norm was violated, not on blame, justifications, or whether the side effect was welcome."*  
    - **Why it fits:**  
      - Card 1 (CTO emissions): Violates a *societal norm* (don't harm environment) → Intentional harm.  
      - Card 1 mirrored (emissions decrease): No societal norm *requiring* environmental help → Not intentional.  
      - Card 2 (breaking old scripts): No norm violation—action was peer-reviewed and standard → Not intentional.  
      - Card 3 (junior breaking pipeline): Violates a *workplace norm* (binding deployment rule) → Intentional harm (even with lead's instructions).  
      - Card 4 (speeding up tests): No norm violated (even if engineer resents it) → Not intentional.  
      - Card 5 (emergency skip): Violates a *workplace norm* (binding two-person approval) → Intentional harm (matches her verdict).  
      - Card 6 (battery degradation): Likely violates a *societal norm* (don't harm users' devices) → Intentional harm (predicted).  

  - **Why Your Hypotheses Don't Fully Fit:**  
    - Your **Blame Rule** ("intentional if Maya would blame the agent") *almost* works but fails on **Card 5**. In Card 5, Maya likely wouldn't blame the engineer (since everyone agreed it was right), yet she calls the harm intentional. Blame might correlate with norm violation, but it's not the direct driver—violation comes first.  
    - Your **Rulebook Rule** ("intentional if the agent stepped outside workplace rules") fails on **Card 1**. The CTO didn't break workplace rules (he was authorized to approve the expansion), but Maya still called the harm intentional because of a *societal* norm violation. A pure "workplace-only" rule can't explain this.  

  - **Competing Rule (if we force it):**  
    If we insist on an alternative, a **Hybrid Blame Rule** could be proposed: *"Intentional if (a) the side effect is harmful AND (b) Maya would blame the agent for it."*  
    - **Fits:** Cards 1 (harm + blame → intentional), Card 1 mirrored (help → no blame → not intentional), Card 2 (harm but no blame → not intentional), Card 3 (harm + blame → intentional), Card 4 (help → no blame → not intentional).  
    - **Fails Card 5:** If Maya wouldn't blame the engineer (due to the emergency justification), this rule predicts "not intentional," but she says "intentional." It also struggles with Card 6—Maya thinks it's "slimy" (implying blame) but might hesitate if she accepts the policy.  
    The **Norm Violation Rule** is cleaner and fits all cases without exceptions.  

  ### (3) New Card to Cleanly Tell the Rules Apart
