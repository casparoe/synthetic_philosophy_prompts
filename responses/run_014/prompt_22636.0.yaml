  First, I need to ensure each required topic is covered. The user mentioned recombination, counterparts without identity, counterpart relation determiners, and universal property instantiation. So I'll dedicate one question to each. Since they want six to eight questions total, I'll add a few more on less discussed but crucial aspects like transworld identity, haecceitism, and the principle of recombination itself. 

  For recombination, the core puzzle is how rearranging concrete parts generates contingencies like "Obama might not have been president." The follow-up should press how recombination explains non-actual possibilities without invoking abstract entities. The guest will likely emphasize spatiotemporal rearrangement, so the follow-up can challenge whether this covers all modal claims.

  On counterparts without identity, students often struggle with how similarity replaces identity. The question needs to highlight the tension: if I'm not identical to my counterpart, why does their property (e.g., being a chef) matter for my possibility? The follow-up should question if this reduces to epistemic access issues—how we know about counterparts—which Lewis explicitly rejects.

  For counterpart relation determiners, the messy reality is that similarity, essence, and linguistic practice conflict. The question must force the guest to pick a priority. Lewis leans toward context-dependent similarity, so the follow-up can present a case where all three pull apart (e.g., a morally corrupt twin) and ask which counterpart "really" matters.

  On universal instantiation, Lewis's combinatorial plenitude suggests every property must be instantiated somewhere. But is that necessary? The follow-up can ask if a world with only homogeneous matter violates modal realism—probing whether the principle is ad hoc.

  I'll add questions on: 
