  Hmm... they're clearly frustrated by the cascading impact on inventory, maintenance, FDA reporting and billing. That "fifteen minutes per case" constraint tells me they need something brutally pragmatic, not academic navel-gazing. Interesting that they specifically name-checked the special composition question - someone on their team did their homework.

  Let me unpack their implied needs: First, they need consistency across thousands of devices. Second, the solution must handle four key edge cases: gradual part replacement (Ship of Theseus problems), temporary attachments (like a monitor clipped onto a bed), functional integration versus mere physical contact, and reporting requirements that vary by context. Third, they need audit trails where human judgment is unavoidable. 

  The philosophical literature actually maps well here. Van Inwagen's functional unity principle could handle the IV stand example - those pumps are useless without the stand. But Mereological Essentialism would cause nightmares for maintenance tracking. Need to avoid that. The four-dimensionalism approach from perdurantism might help with temporary assemblies... 

  Right, practical solution time. A tiered decision tree would work: Start with hard constraints (FDA definitions), then functional unity, then operational persistence. Must include escape hatches for when rules conflict. And those workflow examples they requested - better make them hospital-specific. The billing code example is crucial because it shows how context changes the "whole". 

  Biggest risk is overcomplicating it. Hence the 4-step procedure with strict time boxing. Should emphasize that some cases (like gradually replaced components) will always need manual flags. The shared calibration exercises will be make-or-break - ontology is team sport. 

  ...Wait, did I just turn Peter van Inwagen into an Excel flowchart? Philosophers might weep, but that IV stand isn't going to classify itself.
answer: |-
  Here's a practical, philosophy-inspired decision framework tailored for medical devices, designed for **15-minute assessments** with clear edge-case handling. It distills key concepts from mereology (the study of parts/wholes) into actionable steps:

  ---

  ### **The Medical Device Composition Decision Tree**
  *(Apply sequentially; stop when criteria are met)*

  1. **Regulatory/FDA Definition Check**  
     ⚠️ *"Does any regulatory body define this as a single unit for safety/reporting?"*  
     - **Yes** → Treat as one device (e.g., surgical robot arms if FDA-cleared as a system).  
     - **No** → Proceed to Step 2.  
     *Example: An MRI machine’s detachable coils are part of the whole per FDA 510(k) clearance.*

  2. **Functional Unity Test**  
     ⚙️ *"Do the components fail core functions if separated?"*  
     - **Yes** → Likely one device (e.g., dialysis machine + filter cartridge during treatment).  
     - **No** → Proceed to Step 3.  
     *Edge Case: An IV pole holds pumps, but pumps function standalone → Multiple devices.*

  3. **Operational Persistence**  
     ⏳ *"Are components typically attached/detached *during use* (vs. setup/maintenance)?"*  
     - **Yes** → Multiple devices (e.g., monitors clipped to a hospital bed during transport).  
     - **No** → Proceed to Step 4.  
     *Example: A ventilator’s humidifier is only changed between patients → Part of the whole.*

  4. **Billing/Lifecycle Binding**  
     💰 *"Are components ordered, maintained, or billed together >90% of the time?"*  
     - **Yes** → Treat as one device (e.g., endoscope + light cable in procurement logs).  
     - **No** → Default to multiple devices.  

  ---

  ### **Edge Case Protocols**
  | Scenario                   | Action                                                                 | Flag for Review? |
  |----------------------------|------------------------------------------------------------------------|------------------|
  | **Gradual part replacement** (e.g., surgical robot arms) | Track core serialized unit + replaceable parts separately. After >50% parts replaced in 2 years, reclassify if function shifts. | ✅ |
  | **Temporary attachment** (e.g., ultrasound on wheels) | Classify as separate but link via "operational parent" field in DB. | ⚠️ (If attachment duration >72h) |
  | **Functional vs. Physical** (e.g., EKG leads on monitor) | Functional dependency > physical contact: leads are accessory, monitor is device. | ❌ |

  ---

  ### **Worked Examples**
  1. **IV Pole with Pumps & Monitors**  
     - Step 1: No FDA single-unit rule → Proceed.  
     - Step 2: Pumps function without pole → Fail unity test.  
     - Step 3: Monitors detached during use → Multiple devices.  
     **Verdict:** 3 devices (pole, pump, monitor). *Inventory counts separate; maintenance per component.*

  2. **Da Vinci Surgical Robot**  
     - Step 1: FDA-cleared as integrated system → **One device**.  
     *Maintenance schedules tied to whole system; arms not inventoried separately.*

  3. **Patient Monitor with Detachable Modules**  
     - Step 1: No FDA mandate → Proceed.  
     - Step 2: ECG module useless without base → Passes unity.  
     **Verdict:** One device. *Billing as single unit; module swaps logged as parts.*

  ---

  ### **When Judgment Can’t Be Eliminated**
  Flag cases where:  
  - **Conflicting tests** (e.g., Step 2 passes but Step 3 fails).  
  - **Evolutionary devices** (gradual AI upgrades altering function).  
  - **Shared components** (one sensor feeding multiple systems).  

  **Process:** Log flagged cases in "Ontology Tribunal" queue (monthly review by cross-functional team: clinical engineering, IT, compliance). Precedent decisions become new rules.

  ---

  ### **Implementation Kit**
  1. **Quick Reference Guide:** Flowchart poster for team desks.  
  2. **Database Fields:**  
     - `is_composite_unit (Y/N)`  
     - `core_device_serial` (for attachables)  
     - `requires_parent_device_ID` (for dependencies)  
  3. **Audit Trail:** "Composition rationale" text field in asset DB.

  This turns van Inwagen’s "when do parts compose a whole?" into a compliance-friendly checklist. Philosophy distilled: **Functional unity + operational persistence + regulatory reality.** Test-run on 10 legacy devices—adjust thresholds (e.g., 90% in Step 4) based on your pain points.
