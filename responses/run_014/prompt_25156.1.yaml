answer: |-
  Here's a thought experiment grounded in ordinary life, followed by analysis:

  **Scenario:**  
  Ana is a single mother working as a janitor at a large tech company. Her son requires a life-saving medication costing $1,000/month, which isn’t covered by her insurance. Her boss offers her a dangerous, high-paying overtime shift cleaning hazardous chemical storage areas—a task usually assigned to specialized, better-protected teams. The boss discloses all risks transparently (chemical exposure could cause long-term illness), offers no threats or incentives beyond the $1,000 bonus, and confirms Ana is sober, educated on the risks, and mentally competent. Ana agrees, knowing this is her only way to afford the medication this month. Intuitively, her consent feels invalid—it’s deeply exploitative—yet she wasn’t deceived, coerced, or impaired.

  **Why the Triad Doesn’t Apply:**  
  1. **Deception Absent:** The boss fully disclosed the hazards. Ana understood the factual risks (exposure likelihood, health consequences) and the terms (payment, task details). No lies or material omissions occurred.  
  2. **Coercion Absent:** No one threatened Ana (e.g., "Do this or you’re fired"). Her boss didn’t *create* the desperation; he merely offered an option. Coercion requires an *agent* imposing a penalty to force compliance, but here the pressure comes from structural conditions (poverty, healthcare costs) without an identifiable coercer.  
  3. **Incompetence Absent:** Ana is a capable adult. She grasps the decision’s gravity, risks, and alternatives (e.g., loan options she exhausted). No intoxication, disability, or developmental limitation impairs her judgment.  

  **The Fourth Factor: Exploitation of Structural Vulnerability**  
  This factor arises when consent occurs against a backdrop of *systemic injustice* that creates crushing circumstantial pressure, allowing one party to extract harmful or disproportionate agreement from another’s desperation. Here, Ana’s vulnerability stems from unjust systems (unaffordable healthcare, low wages) her boss didn’t cause but *knowingly leverages* for gain. The wrongness lies in the **substantive unfairness**: the exchange is inherently degrading (health for survival) due to her lack of *acceptable alternatives*. This is distinct from coercion (no active threat), deception (no misinformation), or incompetence (full understanding). It targets how *background power imbalances* invalidate consent even without direct wrongdoing.

  **Devil’s Advocate: The Triad Defender’s Response**  
  A committed defender would likely **stretch "coercion"** to include *circumstantial pressure*. They’d argue: "Ana *is* coerced—not by the boss, but by her circumstances. Coercion needn’t involve a villain; it’s present if ‘voluntariness’ is undermined by unbearable pressure to avoid catastrophic harm. Her choice isn’t free; it’s compelled by necessity, fitting coercion’s core definition: lack of reasonable alternative."  

  **Rebuttal & Assessment**  
  This argument has force but ultimately fails. True coercion requires an *agent* who *intentionally forces* consent via a threat ("Your situation or I make it worse"). Here, the boss didn’t worsen Ana’s plight—he exploited pre-existing injustice without active intimidation. Conflating systemic vulnerability with coercion dilutes the term beyond usefulness: if *all* choices under inequality are "coerced," the concept loses its distinction from ordinary hardship. We must differentiate between **agency-mediated coercion** (a mugger’s "your money or your life") and **structural precarity** (Ana’s "this job or your child’s life"). The latter demands a separate ethical category—like exploitation—to capture how consent can be *procedurally valid* (no deception/coercion/incompetence) yet *substantively illegitimate*.  

  **Conclusion**: The triad defender’s stretch is unconvincing because it ignores the *source* of pressure. Coercion is actor-driven; structural vulnerability is context-driven. Biting the bullet ("Ana’s consent is valid") feels morally grotesque, confirming the need for a fourth condition. Exploitation of vulnerability isn’t "coercion in disguise"—it’s a distinct failure of consent when society, not an individual, deprives someone of meaningful choice. Your intuition is likely correct: the triad is necessary but not sufficient for ethical consent.
