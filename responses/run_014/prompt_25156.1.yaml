  Scenario idea: Ana, a single mom with medical debt, takes dangerous overtime at a warehouse. No lies, no direct threats, she's fully competent. But it feels exploitative. 

  Now, why doesn't this fit the triad? 
  - Deception: Boss is transparent about risks. 
  - Coercion: No active threats - just pre-existing vulnerability. 
  - Incompetence: She's clear-headed, understands the choice. 

  The fourth factor: Exploitation of Precarity. It's structural - her poverty isn't created by the employer, but they benefit from it. 

  Devil's advocate time: A triad defender might argue this is still coercion (background coercion). But is it? Coercion usually requires an active agent applying pressure. Here it's systemic. 

  Strongest counter: "All choices have context. Calling this invalid consent undermines agency." But that feels cold when someone's choosing between health and feeding their kid. 

  Final check: Does this scenario truly avoid the triad? Yes. Is the fourth factor distinct? Yes - it's about unjust circumstances, not someone's wrongdoing. 

