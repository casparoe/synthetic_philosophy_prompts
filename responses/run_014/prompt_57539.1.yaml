prompt: |-
  I am preparing a submission in response to a consultation on whether commercial surrogacy should remain a criminal offence in my jurisdiction, and I would like help auditing an analogy that is doing a great deal of work in the debate here. I think it is a descendant of Devlin's side of the Hart–Devlin exchange, though it has been recast in structural-mechanical terms that Devlin himself never used.

  The setting, briefly: the proposal has the same shape as the mid-century British debate that followed the Wolfenden Report of 1957. The conduct is adult and consensual, the immediate participants report no injury, and the case for prohibition rests largely on the claim that the practice expresses and entrenchs an attitude — toward children, gestation, and money — that the community has reason not to endorse, whatever the balance of harms in any individual transaction.

  The analogy. A colleague on the other side of the consultation (a practising barrister, not an academic) puts it roughly like this, and I have made it more explicit and more mechanical than he did:

  > A society's shared morality is not the bricks of the building but the mortar between them. Bricks can be replaced one at a time — practices change, individual prohibitions are repealed — and the structure stands. The mortar is a single continuous substance: you cannot replace it while the wall is up, and the builder who rakes out a course to discover whether it was doing any work learns the answer only once the wall has already moved. There is no control building next door, no way to run the experiment safely, and a wall that has come down cannot be rebuilt to the same specification. So however archaic a surviving prohibition looks, the presumption lies with leaving it in place.

  He also gestures at the thought, familiar from Devlin, that the person who flouts the sexual morality of the community is a subversive rather than a mere sinner; and I have been answering him with what I take to be Hart's standard line — that Devlin runs together the existence of a society with its identity, since a society can change its constitutive morality and still be the society it was.

  What I want from you:

  1. **The correspondences.** For the mortar image, say what in the target plays each role: mortar, bricks, the building, the builder, the load-bearing question, the absent control building, the impossibility of rebuilding to the same specification. Where the image has no honest candidate in the target, say so rather than supplying a strained one — a table is fine.

  2. **Disanalogies that matter versus disanalogies that are merely untidy.** A disanalogy counts for my purposes only if it bears on the inference from the comparison to the conclusion, which is a presumption in favour of retention. I expect some failures to be decorative (mortar is homogeneous and continuous, a moral code is neither, so what?) and others to do real damage. Please sort them.

  3. **What the source quietly imports.** In particular: the unity of the moral code — one continuous substance rather than many independent joints with redundant load paths and known substitutes; the globality and suddenness of failure, as against change that is local, gradual and reversible; the impossibility of repair, when societies demonstrably do rebuild altered norms; and the total ignorance of the builder, when in fact a good deal about how norms respond to decriminalization is learnable in advance from other jurisdictions. Are these imported by the analogy, or argued for independently of it?

  4. **Whether the conclusion survives.** Once the disanalogies are on the table, does anything remain that supports a presumption for retention — or only something weaker, such as a requirement of gradualism, of pilot jurisdictions, of monitoring with reversal mechanisms, or of compensating institutions? State what the analogy can bear at its maximum and what it cannot, and mark which of your claims depend on contested empirical matters about how norms actually change rather than on the logic of the comparison.

  5. **The Hart point.** Does the existence-versus-identity objection actually land on the mortar version, or is the mortar image built precisely to evade it — the claim being not that society would cease to exist but that it would cease to be the society whose stability the law was protecting? If it evades the objection, identify the further premise the evasion requires and say whether that premise is defensible.

  6. **The treason comparison.** Is the subversive-or-sinner thought doing the same work as the mortar image or a different one? My sense is that one concerns the agent's standing in relation to the community and the other the fragility of a structure, and that the two get run together illegitimately — the structural claim supplying the urgency that the standing claim cannot. Test that hunch rather than accepting it.

  7. **A better analogy.** If either side can be given a comparison that carries its intended weight with less smuggling, offer it, say what it licenses, and say where it too gives out. If you think no analogy in this neighbourhood can do the work, say so and explain what kind of argument would have to replace it.

  8. **My own image, audited on the same terms.** I have been countering that a morals law of this kind is like a splint left on a bone that has already healed: it did real work once, and left in place it stiffens the limb and wastes the muscle. I suspect this imports a determinate endpoint of healing that moral change does not have, and that it flatters the reformer by casting him as the physician. Give it a short paragraph of the same treatment.

  On register: I want a committed assessment, not a survey. Where you think the analogy fails, say it fails, and say how confident you are and what the confidence rests on; where you think my colleague has a point that survives the audit, say that too and mark it clearly as surviving. Distinguish what you regard as settled from what is genuinely arguable, and flag any place where you suspect you are working from a popular simplification of Devlin or Hart rather than from their actual positions — I would rather be told that than have the simplification silently load the analysis. No references or reading list, please; I want the reasoning.

  Finally, if you think the request itself is misconceived, say so at the top instead of complying politely. Three specific worries I have about it: I have reconstructed a loose remark into an explicit mechanical argument my colleague never made, and the reconstruction may be a strawman; the analogy may be doing no inferential work at all in his case, so that auditing it as an argument is a category mistake — he may simply be expressing a disposition, and the image is decoration; and the Hart–Devlin frame may be the wrong lens for commercial surrogacy, which is at least as much about the commodification of women's reproductive labour and the position of the child as about a shared morality whose loss would be structural. If any of these is right, say which, say why, and tell me what I ought to be asking instead.
reasoning: |-
  Okay, this is a deeply sophisticated request about legal philosophy and analogical reasoning. The user is clearly an expert preparing a high-stakes consultation response on commercial surrogacy law, and they've identified a structural analogy used by opponents that needs rigorous auditing. 

  First, I need to acknowledge their three meta-concerns upfront. The strawman risk is real - their barrister colleague likely used the mortar metaphor rhetorically rather than as a strict argument. But since the user explicitly wants to test its logical structure, we'll proceed while flagging this. The commodification point is crucial too - this isn't just about social cohesion but concrete power dynamics. The analogy audit remains useful though, as the structural integrity claim is doing heavy lifting in the opposition's case.

  Breaking down the mortar analogy:
  - The mortar = shared morality's binding function
  - Bricks = individual laws/practices
  - Builder = legislator/society
  - Key disanalogies: Moral codes aren't monolithic (multiple reinforcing norms), failure isn't binary (norms decay gradually), and we actually have comparators (other jurisdictions)
  - The analogy smuggles in premises about sudden collapse that don't hold

  On the Hart-Devlin point: The mortar image does evade Hart's existence/identity distinction by shifting to structural integrity. But this requires the dubious premise that a society's stability depends on preserving exact moral specifications. Historical counterexamples abound - think of how Western societies absorbed no-fault divorce without collapse.

  The treason comparison troubles me. Conflating moral dissent with structural sabotage is dangerous. One questions norms from within the community; the other attacks its foundations. The mortar image gives this false equivalence a pseudoscientific veneer.

  For their splint analogy: It's rhetorically effective but overmedicalizes. Moral change isn't a biological healing process with clear endpoints. Still, it usefully counters stagnation arguments by highlighting institutional atrophy.

  Ultimately, the strongest path forward is to: 
  1) Grant that norm transitions need managed carefully 
  2) Demand evidence for claimed collapse risks 
  3) Redirect to surrogacy's concrete impacts

  The barrister's core valid point is about precaution - but this justifies monitoring mechanisms, not paralysis. Their analogy can't support a retention presumption, only a call for transition planning.
answer: |-
  Here is a committed audit of the analogies, addressing your concerns directly:

  ### Your Meta-Concerns
  1.  **Strawman Risk:** Your reconstruction is fair. While your colleague used the mortar image loosely, you've exposed its implicit mechanical logic. Auditing this *as an argument* is valid because it reveals the unstated premises underpinning the "presumption for retention" stance. If it collapses, the stance loses intellectual scaffolding.
  2.  **Category Mistake?** The analogy *is* doing inferential work. It transforms an intuition (fear of societal collapse) into a seemingly objective, structural necessity. It argues *why* caution is structurally mandated, not just expressing caution. Auditing it is crucial.
  3.  **Wrong Lens?** Partly valid. Hart-Devlin *is* relevant to the "attitude entrenchment" argument cited. However, you're right that commodification and child welfare are distinct and critical objections. **Focus shift needed:** Audit the analogy *as used* (for the shared morality claim), but emphasize in your submission that this structural argument distracts from the core ethical issues of exploitation and child commodification. The analogy audit weakens *one pillar* of the opposition; you must still address the others directly.

  ### The Mortar Analogy Audit

  1.  **Correspondences:**
      *   **Mortar:** The binding force of shared morality/social cohesion.
      *   **Bricks:** Individual laws, social practices, institutions.
      *   **Building:** The stable, functional society/structure of law and order.
      *   **Builder:** The legislator/society contemplating reform.
      *   **Raking out a course / Load-bearing question:** Repealing a specific law (like the surrogacy prohibition) to see if the shared morality it reflects is essential to social stability.
      *   **Wall moving/collapse:** Social instability, fragmentation, or collapse.
      *   **Absent control building:** No identical society exists to run a controlled experiment of repeal without risk.
      *   **Impossibility of rebuilding:** The claim that once social cohesion is lost (shared morality eroded), it cannot be restored to its original, stable state.
      *   **Honest Gaps:** The analogy lacks equivalents for: *multiple* sources of cohesion (not one "mortar"), mechanisms for *gradual* norm change, the existence of *partial comparators* (other jurisdictions), and the role of *deliberative democracy* in rebuilding norms.

  2.  **Disanalogies that Matter vs. Untidy:**
      *   **Matter Critically:**
          *   **Homogeneity/Unity:** Mortar is one substance; a society's "shared morality" is a complex, often contradictory web of norms, values, and traditions with *redundancy* and *multiple reinforcing mechanisms* (family, religion, education, law, culture). Removing *one* prohibition (one "course of mortar") is highly unlikely to collapse the whole structure if other supports exist. This directly undermines the inference that repealing *this specific law* risks catastrophic failure. (High Confidence: Sociological consensus on moral pluralism).
          *   **Failure Mode:** Mortar failure is often sudden and catastrophic. Social/moral change is typically *gradual*, *piecemeal*, and *reversible* through democratic processes or new legislation. Norms erode or evolve long before laws change. This negates the "wall moves/collapses instantly" fear underpinning the presumption for retention. (High Confidence: Historical examples - e.g., changing norms on divorce, homosexuality, gender roles).
          *   **Ignorance & Experimentation:** The builder is *not* totally ignorant. We *have* "control buildings" – other jurisdictions where similar prohibitions have been repealed (e.g., some US states, Ukraine, Georgia re surrogacy). We can study the effects (does society collapse? does exploitation increase?). This directly counters the "no safe experiment" claim. (Medium Confidence: Data exists but requires careful interpretation contextually).
      *   **Merely Untidy:**
          *   Mortar is continuous; moral norms are discrete. Mortar is inert; norms are dynamic. These are descriptive flaws but don't inherently break the core structural caution argument; they just make it a less precise model.

  3.  **What the Analogy Smuggles In:**
      The analogy *imports* and *relies upon*:
      *   **Monolithic Unity:** The idea of morality as one, seamless, indispensable binding agent.
      *   **Catastrophic Fragility:** The idea that removal of *any* part leads to sudden, irreversible collapse.
      *   **Total Ignorance:** The impossibility of prediction or learning from elsewhere.
      *   **Irreparability:** The impossibility of rebuilding social cohesion differently.
      These are *not* argued for independently; they are *embedded in the structure of the analogy itself*. The analogy presents them as inherent features of "social structure" like a wall, bypassing the need to justify these highly contestable empirical claims about how societies actually function and change.

  4.  **What Conclusion Survives?**
      **The core presumption for retention collapses.** The analogy cannot bear the weight of justifying a general presumption against reforming "archaic" prohibitions based on structural risk. What *might* survive, weakly:
      *   **A Caution Against Radical, Unplanned Abolition:** The analogy *vaguely* gestures towards the idea that social cohesion matters and changes can have unintended consequences. However, it fails to prove *this specific change* is uniquely dangerous.
      *   **Maximum Surviving Inference:** A *weak* argument for **monitoring with reversal mechanisms** and **compensating institutions** when reforming laws deeply tied to fundamental social norms, *if* credible evidence suggests unique risk. **Not a presumption for retention.** This depends entirely on contested empirical claims (e.g., *does* repealing *this specific surrogacy ban* demonstrably erode essential social glue protecting children/families in ways other reforms haven't?).

  5.  **The Hart Point vs. Mortar Image:**
      The mortar image **successfully evades Hart's existence/identity objection.** It shifts the focus from "society ceases to exist" to "society loses its specific *structural integrity/stability*." The claim becomes: Repeal might destabilize the structure, making it vulnerable or transforming it into something less stable/desirable, even if it remains "a society." **Evasion Premise Required:** That the *current specific configuration* of norms (including this prohibition) is essential for the *current level* of stability and desirability. **Is this defensible?** Rarely. It requires proving: (A) This specific norm is a critical load-bearing element for stability (highly unlikely for one archaic law amidst pluralistic norms). (B) The resulting new stability (post-repeal) would be *inferior*. This is a value judgment masquerading as structural necessity. The burden of proof lies heavily on the retentionist.

  6.  **The Treason Comparison:**
      This does **different work** but is **illegitimately fused** with the mortar image.
      *   **Subversive/Sinner:** Concerns *intent* and *standing*. The subversive *intends* to undermine the community's foundations; the sinner merely violates a rule. This justifies *harsher treatment* (criminalization vs. perhaps only social sanction).
      *   **Mortar Image:** Concerns *consequence* and *structural fragility*. It claims the *act itself*, regardless of intent, risks collapse.
      **Your Hunch is Correct:** The structural claim (mortar) supplies the *urgency and severity* ("collapse is nigh!") that the standing claim (subversive) cannot justify on its own. Without the mortar image, calling a surrogate mother/intended parent a "subversive" for flouting this specific norm seems hysterical. The fusion is manipulative: it takes the emotional weight of "treason" and grafts it onto a highly speculative structural claim.

  7.  **A Better Analogy?**
      **No single analogy in this neighbourhood does the work cleanly.** The complexity of social cohesion and norm change resists simple mechanical metaphors. However, for the **cautionary perspective**:
      *   **Analogy:** Reforming a deep-seated norm is like **altering a complex ecosystem.** Removing one species (a law/prohibition) *might* have unforeseen cascading effects because of interdependencies. Stability isn't guaranteed to collapse, but the system is complex and outcomes are hard to predict perfectly.
      *   **Licenses:** Justifies **caution, study, monitoring, phased implementation, and remediation plans** – **not** a presumption against *any* change. Emphasizes complexity and potential for unintended consequences without assuming inevitable catastrophe.
      *   **Gives Out:** Ecosystems can be resilient; humans are reflexive and can consciously adapt rules; "stability" isn't the only value (justice matters); we *can* learn from other "ecosystems" (jurisdictions). Still implies a "natural" state.

      **The Needed Argument:** Ditch analogy. Argue empirically: 1. Identify the *specific* shared attitude the law protects (e.g., "children should never be commercially procured"). 2. Argue *why* this attitude is *essential* (not just traditional) for social stability/welfare *now*. 3. Show credible evidence that decriminalization *will* erode this attitude *more* than other forces (capitalism, individualism) already are. 4. Weigh this against the harms of criminalization and the values of autonomy/access. This is hard, which is why opponents retreat to mortar metaphors.

  8.  **Your Splint Analogy Audited:**
      *   **Correspondences:** Splint = Outdated morals law; Bone = The social condition/normative framework it was meant to support; Healing = The natural evolution/social resolution of the underlying issue; Stiffens/Wastes Muscle = The law now causes harm (inflexibility, resource misallocation, prevents beneficial activity).
      *   **Strengths:** Effectively counters stagnation, highlights active harm of keeping obsolete laws, justifies removal for positive function.
      *   **Key Weaknesses (as suspected):**
          *   **Determinate Endpoint:** Assumes "healing" (a resolved social problem/secure norm) is complete and objectively identifiable. Moral/social issues rarely have such clear endpoints; debates evolve. Who is the physician? The reformer? This imports technocratic authority.
          *   **Passive Healing:** Portrays the norm evolving "naturally," downplaying the role of *contestation* (like this reform effort) in driving change. The law isn't just passively outlived; it's actively challenged.
          *   **Smuggling:** Imports the premise that the law *is* obsolete and harmful now, which is precisely what's contested. It assumes the conclusion ("healed") that needs arguing.
      *   **Survives As:** A strong *rhetorical* counter to fear-mongering about change, emphasizing the *costs of inaction* and legal obsolescence. Best used *after* establishing evidence that the underlying social need for the prohibition has diminished. Weak as a *standalone* justification for repeal against the structural concern.

  ### Final Assessment
  *   **The Mortar Analogy Fails** as a justification for a presumption to retain archaic prohibitions. It smuggles in false premises about monolithic morality, catastrophic fragility, total ignorance, and irreparability. (High Confidence based on logic and historical/sociological evidence).
  *   **A Valid Core Point (Surviving Weakly):** Societies *are* complex systems. Changing deep-seated norms *can* have unforeseen consequences. This justifies **prudent reform** - not paralysis, but careful design, monitoring, and adaptation. (Moderate Confidence).
  *   **The Treason Comparison is Inflammatory and Illegitimately Bolstered** by the mortar image. Reject the fusion.
  *   **Your Splint Analogy is Useful Rhetoric** but not a standalone argument; pair it with evidence of obsolescence/harm.
  *   **Focus Your Submission:** Devote less energy to demolishing this analogy than to: 1. Directly addressing commodification/child welfare arguments against surrogacy *itself*. 2. Highlighting the concrete harms *of criminalization* (driving practice underground, lack of protection, denying access). 3. Proposing a *positive regulatory framework* for surrogacy that addresses ethical concerns better than a ban. The mortar analogy is a smokescreen; move the debate to the substance. Use the analogy audit briefly to dismiss the "society will collapse" hyperbole and refocus.
