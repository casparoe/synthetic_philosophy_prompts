  The modern examples break the traditional frame because they involve non-human entities (AI) or known reconstructions. This suggests that belief in reality isn't necessary; it's about the relationship formed. Attachment to an AI character, even with full knowledge of its artificiality, can still trigger grief because the emotional bond was real. The narrative or interaction creates a subjective reality that emotions latch onto. 

  So progress would involve shifting focus from belief to mechanisms like narrative immersion, mirror neurons, or predictive processing. Also, studying cases like AI grief provides real-world data that challenges old assumptions. The user needs a new framework where emotions are seen as responses to perceived significance, not factual truth. 

