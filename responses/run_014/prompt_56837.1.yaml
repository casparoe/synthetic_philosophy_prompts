answer: |-
  Here is an analysis of the 1277 Condemnations through the lens of omnipotence paradox resolutions, structured around your queries:

  ### I. Mapping Condemned Articles to Omnipotence Resolutions
  1.  **Contradiction-Limit View (Omnipotence = doing the logically possible):**
      *   **Implication for Articles:** Both condemned propositions ("God cannot move heavens rectilinearly," "God cannot make multiple worlds") are straightforwardly *false*.
      *   **Reason & Relevance:** The falsity stems *solely* from physics/natural philosophy (e.g., assumptions about vacuums or cosmic structure being necessary). Omnipotence itself is only relevant in establishing that *if* these actions are logically possible (which Aristotelian physics denied), then God *can* do them. The resolution doesn't *prove* the actions are possible; it just says God can do them if they are. Tempier condemns them because they *falsely* claim a physical impossibility (which they mistake for a logical one) limits God. He was right to condemn them *if* his goal was to defend God's power over *all* non-contradictory possibilities, including those violating Aristotelian physics.

  2.  **Incoherent-Task View ("Stone" is meaningless):**
      *   **Implication for Articles:** This view is largely *silent* on the Tempier articles. The condemned propositions describe seemingly coherent tasks (moving a sphere straight, creating another cosmos). They are meaningful claims about physics/metaphysics, not self-referential paradoxes. The "stone" paradox dissolves because it describes nonsense; the Tempier articles were condemned for making false claims about the world's structure and God's relation to it. The deflation doesn't apply here.

  3.  **Maximal Power / Indexed Across Worlds:**
      *   **Implication for Articles:** This view strongly *supports* Tempier's condemnation. If God is maximally powerful, then in *some* possible world, He actualizes rectilinear motion or multiple worlds (provided these are coherent states). The condemned propositions falsely deny God has this maximal power by claiming He *cannot* actualize these specific possible states. Tempier rightly condemns them for limiting God's maximal power to actualize alternative possibilities.

  4.  **Voluntarism (God Authors Truths/Necessity):**
      *   **Implication for Articles:** Voluntarism renders the condemned propositions not just false, but *blasphemous*. They falsely assert necessary limits (based on physics/logic) *on* God. For the voluntarist, God could have made rectilinear motion the natural state *or* made vacuum harmless *or* made multiple worlds the norm – the Aristotelian "impossibilities" reflect only God's *chosen* order, not inherent necessity. Tempier's condemnation aligns perfectly with this spirit: God's power is not constrained by *any* created order or necessity. Condemning the articles was essential.

  ### II. Structural Mismatch & Its Implications
  *   **The Fact:** The 219 articles concern modal claims about physics/metaphysics (possible worlds, motions, voids), not self-referential logical puzzles.
  *   **Implication for Paradox Literature:**
      *   **Supports Deflation? (No):** The mismatch *undermines* a purely deflationary view. It shows the "stone" paradox *is* largely a semantic artifact, but resolving it doesn't touch the *real* theological work concerning divine omnipotence. That work *is* precisely about "which metaphysical and physical possibilities are ruled out and on whose authority," which the paradox literature *does* largely ignore.
      *   **Suggests the Opposite? (Yes):** This episode demonstrates that the core historical and theological debate about omnipotence revolves around God's relationship to *contingent* necessities – the laws of nature, cosmic structures, causal chains – not just logical absolutes. The key question is: Do these contingent structures reflect inherent, unchangeable necessities (limiting God) or merely God's ordained will (leaving His absolute power free)? Tempier, by condemning claims that God *cannot* violate Aristotelian physics, is asserting that God's power transcends *all* created necessities. The paradox literature, by focusing narrowly on logical contradiction, often misses this vast domain of contingency over which divine power is most potently (and controversially) asserted.

  ### III. Absolute vs. Ordained Power (*Potentia Absoluta* vs. *Potentia Ordinata*)
  *   **Role Here:** This distinction is central to understanding 1277, *not* primarily as a resolution to the stone paradox, but as the framework within which Tempier operates.
      *   **Resolves/Relocates Paradox?** It doesn't resolve the logical paradox. It *relocates* the practical debate about divine power away from abstract logic and into the realm of creation and revelation. It addresses the *structural mismatch* directly.
      *   **Function:** It distinguishes what God *could* do (*potentia absoluta* - anything non-contradictory) from what God *has* chosen to do and sustains according to His ordained will and covenants (*potentia ordinata*).
  *   **Tempier's Use:** Tempier invokes *potentia absoluta* explicitly. He condemns the articles because they deny God's *absolute* power to do things like create multiple worlds or move the heavens rectilinearly. They falsely elevate the *current ordained order* (Aristotelian physics) to the status of absolute necessity, binding even God. Tempier argues: "Even if He never *will* do these things (ordained power), He absolutely *could* have done them and *could* do them now."
  *   **Category:** It's not just "respectable vocabulary" for the paradox; it's the essential conceptual tool for asserting God's freedom *over creation* against necessitarian philosophies. It directly addresses the "structural mismatch."

  ### IV. Descartes vs. 1277
  *   **Descartes's Voluntarism:** Extends the *logic* of 1277's assertion of *potentia absoluta* to its ultimate conclusion. If God's absolute power is truly free from *all* constraint, then even the truths of logic and mathematics are contingent upon His will. He *could* have made contradictions true.
  *   **Consistent Extension or Violation?** It is the **consistent extension** of the *logic* driving Tempier's condemnation. Tempier broke the shackles of Aristotelian *physical* necessity on God's power. Descartes breaks the shackles of *logical* necessity. Both assert God's absolute sovereignty over all that is.
  *   **Violation in Spirit?** However, it *is* a violation of the *context* and *purpose* of 1277. Tempier condemned those who used philosophy (Aristotle) to limit God *against* revelation. He assumed Aristotelian logic/physics described genuine *possibilities* that God *could* override. Descartes makes God the author of the *very framework* of possibility/reality. Tempier fought for God's freedom *within* a broadly accepted (though divinely transcendable) realm of logic and creation; Descartes makes that realm itself subject to divine caprice. The *job of "omnipotence"* shifts: in 1277, it's primarily about power over *creation*; in Descartes, it encompasses power over *meaning and truth itself*.

  ### V. Where Theory is Silent & Verdict
  *   **Category Mistake?** Treating the *decree itself* (a disciplinary, political, theological act of censorship) purely as a "test case for the logic of 'can'" risks a category mistake. The decree's purpose wasn't to solve a logical puzzle but to assert doctrinal authority, combat perceived heresy (especially necessitarianism), and defend a specific conception of divine freedom against Aristotelian encroachment. The *propositions condemned*, however, *are* legitimate grist for the analytical mill concerning divine power and possibility.
  *   **Theory's Silence:** Analytic resolutions are largely silent on the *motivations* behind the condemnation (political, institutional, anti-Aristotelian), the *process* (commission, papal mandate), and the *specific historical targets* (beyond the propositions themselves). They don't adjudicate whether condemnation was the *right* pastoral or disciplinary move – only whether the *propositions* were false based on specific conceptions of omnipotence.
  *   **Verdict on the Episode:** 1277 is primarily a **confirmation of the Maximal Power / Contingent Necessity view** and a **foundation for Voluntarism**. It powerfully demonstrates that the core theological concern with omnipotence historically was *not* the stone paradox, but God's relationship to contingent orders of nature and logic. It shows the *inadequacy* of only focusing on logical contradiction. It is an **anomaly for the Incoherent-Task view** because the condemned propositions *are* coherent tasks under different physical assumptions. It's a **case anticipated by the Absolute/Ordained distinction**, which provides the essential framework.

  ### VI. The Sharpest Question for Your Students
  **"If a condemned proposition like 'God cannot move the heavens in a straight line' is deemed non-contradictory (hence logically possible) by modern physics, but was declared false under the contradiction-limit view *only* because Tempier's opponents mistakenly thought it *was* physically (and thus logically) impossible, what does this reveal about whether debates over divine omnipotence are fundamentally about:  
  (a) The *extent* of God's power?  
  (b) The *nature* and *source* of necessity and possibility?  
  (c) Or simply the *grammar* of praising divine supremacy ('God can do anything' as a pious formula, not a metaphysical claim)?"**

  **Answer:** It reveals that (b) is paramount. The debate hinges on *what constitutes genuine possibility or necessity*. Is necessity inherent in the structure of reality (Aristotle), making God subject to it? Or does it stem solely from God's will (Tempier/Voluntarists), making reality fundamentally contingent? The "cannot" in the condemned articles wasn't primarily about a *lack* of power in God, but about a *misattribution* of absolute necessity to the created order. Omnipotence debates are thus fundamentally contests over the metaphysics of modality – what *must* be, what *can* be, and who (or what) gets to decide. The grammar of praise reflects this deeper metaphysical commitment.
