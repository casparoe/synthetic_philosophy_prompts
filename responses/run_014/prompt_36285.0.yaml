prompt: |-
  I work as the sole human-consent reviewer for a mid-sized university's research ethics board — mostly psychology experiments, some medical studies, maybe 30 protocols a month, and I have maybe 20 minutes per protocol before I have to flag it, pass it, or kick it to the full board. The board's written guidance basically just says consent must be "voluntary, informed, and competent," which is fine as a principle but useless to me on a Tuesday afternoon when I'm staring at a stack of applications. What I want is an actual procedure I can run: the checks in order, what a passing answer looks like for each, where the procedure ends in an automatic flag to the full board, and — this is the part our guidance never admits — where a check can't be settled by procedure at all and I just have to make a judgment call and say so.

  The philosophical stuff I half-remember from a bioethics course years ago (validity conditions like adequate disclosure, competence, absence of coercion or manipulation, and whatever the difference is supposed to be between invalidating a consent and merely making it regrettable) should be in there, but translated into questions a non-philosopher like me can ask of a protocol. I especially want the procedure to handle the fuzzy middle cases, because those are exactly the ones I keep agonizing over: a psychology study that uses deception and only reveals it in a debrief afterward (can consent given in advance cover being lied to?); a study paying $200 for a few hours of mildly unpleasant tasks, which I suspect is fine for students but maybe coercive for people in real financial need; and a surgeon recruiting her own patients into her clinical trial, where the person obtaining consent has authority over the participant's future care. If your procedure could also tell me what to do about an elderly participant whose daughter answers all the screening questions "for" her, that would help, because right now I have no idea whether that's a competence problem or a coercion problem or neither.

  Please run the finished procedure on those cases and show me the output — including at least one where it gives me an answer I won't like (I'm thinking of the surgeon one, since we've never rejected anything from that department and I doubt the board will thank me). And be blunt about where the procedure will misfire or where two reasonable reviewers following it could come out differently, since the whole point is that I stop pretending my gut instinct is a checklist.
reasoning: |-
  Okay, let me unpack this user's problem. They're a sole consent reviewer drowning in protocols with vague guidelines. They need a concrete, step-by-step procedure to evaluate consent issues efficiently. The philosophical principles they mention (voluntary, informed, competent) need operationalizing into actionable checks.

  Hmm, what's really underneath this? They're overwhelmed by judgment calls - especially those "fuzzy middle cases" where ethics get muddy. The examples they gave (deception in psych studies, high payments, surgeon-researcher conflict) all involve power imbalances. That's the unspoken thread: how to spot coercion disguised as normal practice.

  The user's frustration with "guidance never admitting" where judgment is needed suggests they want transparency about uncertainty. They're not asking for a magic formula - they want to know exactly where the procedure ends and their human judgment begins. That's smart. And that surgeon example... they're bracing for institutional pushback. This isn't just about ethics - it's office politics too.

  For the procedure structure, I'm thinking: 
  First, prioritize dealbreakers (like missing consent docs) before gray areas. 
  Then tackle informed consent - break it into "what they see" (documents) and "how they see it" (comprehension). 
  Voluntariness needs power dynamic mapping - not just "was force used?" but subtle pressures. 
  Competence assessment feels tricky since they're not clinicians... maybe focus on observable screening?

  Ah, the elderly/daughter example is key. That's not one box to check - it's layered. Is the daughter translating? Influencing? Straight-up substituting? The procedure should force that distinction. 

  For outputs... the surgeon case must show teeth even if it's uncomfortable. If the protocol doesn't mitigate power imbalance, the procedure should call it out unflinchingly. User needs to see it won't sugarcoat. 

  Biggest challenge: balancing speed (20 mins/protocol!) with thoroughness. That's why the "judgment call" flags are crucial - they save time by naming the uncertainty instead of pretending to resolve it. 

  Final thought: The user's self-awareness about "gut instinct" is refreshing. This procedure should honor that by making subjectivity explicit rather than hiding it.
answer: |-
  Here's a step-by-step consent review procedure designed for speed, clarity, and highlighting judgment calls. It's structured as a *decision tree with clear failure points*, **judgment zones**, and **automatic flags**. Each step either passes, fails (requiring revision), or triggers a full board review.

  **Core Principles Embedded:**
  1.  **Informed:** Adequate disclosure + comprehension.
  2.  **Voluntary:** Absence of coercion, undue influence, or manipulation.
  3.  **Competent:** Capacity to understand and decide.

  ---

  ### The Consent Review Procedure (20-Minute Version)

  **Step 0: Pre-Check (Automatic Fail)**
  *   **Check:** Is a consent form/document *explicitly required* by the protocol (almost always yes) AND is it attached in its final, participant-facing version?
      *   **Pass:** Proceed to Step 1.
      *   **Fail:** **Flag for Revision.** Missing consent document. *Stop.*

  **Step 1: Core Information Disclosure (Informed - Part 1)**
  *   **Check:** Does the consent document clearly state, in language reasonably understandable to the participant population:
      1.  That this is research?
      2.  The purpose of the research?
      3.  The procedures involved (including duration, frequency, location)?
      4.  Foreseeable risks or discomforts (physical, psychological, social, economic, legal)?
      5.  Potential benefits (to participants or others)?
      6.  Alternatives to participation (especially for therapeutic research)?
      7.  Confidentiality limits (including who might see data, data retention/destruction plans, mandatory reporting)?
      8.  Contact information for questions (PI & REB)?
      9.  Statement that participation is voluntary and refusal/withdrawal has no penalty/loss of entitled benefits?
      10. Compensation details (amount, schedule, pro-rating for withdrawal)?
  *   **Pass (All 10):** Proceed to Step 2.
  *   **Fail (Any Missing):** **Flag for Revision.** Missing core element(s). Specify which. *Stop.*
  *   **Judgment Zone:** Is the language *reasonably understandable*? (e.g., Is jargon minimized? Is it appropriate for the target population's expected literacy level? If specialized population, are terms defined?)

  **Step 2: Comprehension & Process (Informed - Part 2 / Competent - Part 1)**
  *   **Check:**
      1.  Is the consent process described (e.g., verbal explanation, Q&A time, written form)?
      2.  Does the protocol screen for/specify procedures to assess comprehension *if the population or procedures warrant it*? (e.g., teach-back method for complex medical trials, simplified language for cognitively impaired populations, children).
      3.  For deception studies: Does the protocol include a *mandatory, timely debriefing* explaining the true purpose and the reason for deception? Is the *initial consent* at least broad enough to cover the *actual procedures* participants will experience (e.g., "We will ask you to complete problem-solving tasks and interact with other participants," even if the interaction is staged)?
  *   **Pass (All relevant):** Proceed to Step 3.
  *   **Fail:**
      *   Missing debrief plan for deception? **Flag for Revision.**
      *   No description of consent process? **Flag for Revision.** *Stop.*
  *   **Judgment Zone:**
      *   Is the described consent process *sufficient* for the complexity/risk? (e.g., Is a simple form enough for a low-risk survey? Does a high-risk medical trial need more than just a form?)
      *   Does the initial consent in deception studies adequately cover the *nature of the experience*, even if not the *purpose*? (This is critical - consenting to *be deceived* about *why* is different from consenting to *unknown procedures*. The former is possible with careful wording; the latter is invalid).
      *   Is the comprehension assessment plan *adequate* for the population/risk? (Judgment call - e.g., teach-back often needed for higher risk/complexity).

  **Step 3: Voluntariness - Undue Influence & Coercion**
  *   **Check:** Are there features creating pressure *beyond reasonable inducement*? Specifically:
      1.  **Recruitment:** Who recruits? What is their relationship to potential participants? (e.g., Professor recruiting students, Doctor recruiting patients, Employer recruiting employees).
      2.  **Compensation:**
          *   Is the amount excessive relative to time/risk? (Compare to local standards, e.g., minimum wage for low-risk).
          *   Is payment structured coercively? (e.g., Large bonus for completion penalizes withdrawal, payment only upon completing all sessions).
      3.  **Environment:** Is participation occurring in a context where refusal is difficult? (e.g., Prison, mandatory class, military hierarchy).
      4.  **Alternatives:** For therapeutic research, are non-research treatment options clearly available and accessible?
  *   **Pass (No significant risks identified):** Proceed to Step 4.
  *   **Fail (Clear coercion):** **Automatic Flag to Full Board.** (e.g., Prison warden recruiting prisoners with no alternative activities, payment constituting sole income for essential needs). *Stop.*
  *   **Judgment Zone / High Risk of Undue Influence:** If ANY of these apply, you are likely in a **Judgment Zone** requiring careful weighing. Proceed to Step 4 but note the specific concern(s) for final decision:
      *   Recruiter has significant power over participant (Professor/Student, Doctor/Patient, Employer/Employee).
      *   Compensation is high relative to participant population's likely economic status *and* the tasks are undesirable.
      *   Environment subtly discourages refusal (e.g., "required" class credit alternatives are impractical).
      *   *This is the fuzziest and most critical judgment area.*

  **Step 4: Competence & Surrogate Consent (Competent - Part 2)**
  *   **Check:**
      1.  Does the target population *include* individuals who *may* lack decision-making capacity? (e.g., Children, cognitively impaired elderly, severe mental illness).
      2.  If YES:
          *   **a.** Does the protocol have a *valid, documented method* for assessing capacity? (Not just assuming based on diagnosis/age).
          *   **b.** Does the protocol specify procedures for obtaining *assent* (affirmative agreement) from the participant *themselves* where possible?
          *   **c.** Does the protocol specify who is a *legally authorized representative* (LAR) and the process for obtaining *informed permission* from the LAR?
          *   **d.** Does the consent/LAR permission form clearly state the participant's involvement and that assent will be sought?
      3.  If NO (presumed competent adults): Are screening procedures in place to *identify* potential incapacity unexpectedly arising during screening/consent? (e.g., PI/staff trained to spot confusion/distress).
  *   **Pass:**
      *   Population has no potential incapacity? Proceed to Final Decision.
      *   Population may lack capacity AND a, b, c, d are addressed? Proceed to Final Decision.
  *   **Fail:**
      *   Population may lack capacity AND a, b, c, or d is missing? **Flag for Revision.** *Stop.*
  *   **Judgment Zone:**
      *   Is the capacity assessment method *valid and practical*? (e.g., Using a standardized tool vs. just PI judgment).
      *   In cases like the elderly participant with a daughter "answering for her": **This is a critical Judgment Zone.**
          *   If the daughter is the *documented LAR* and the protocol *assessed the participant's incapacity* AND seeks *assent* from the participant? Likely Pass.
          *   If the daughter is *not* the LAR, or capacity *wasn't assessed*, or the participant's *assent isn't sought*? **Major Problem - Likely Flag for Revision or Full Board.**
          *   If it's unclear *why* the daughter is answering (e.g., convenience, language barrier vs. incapacity)? **Flag for Revision** - Protocol must clarify capacity assessment/LAR process.

  **Step 5: Final Decision & Documentation**
  *   **Review:** Summarize findings from Steps 0-4. Note any **Judgment Zones** encountered.
  *   **Decision:**
      *   **Pass:** All steps passed clearly. No unresolved Judgment Zones OR Judgment Zones identified but mitigations seem adequate *based on documented protocol procedures*. (Note the judgment call in comments).
      *   **Flag for Revision:** Clear failure in Steps 0, 1, 2, or 4. Specific deficiencies documented.
      *   **Automatic Flag to Full Board:** Clear coercion identified (Step 3 Fail), OR complex unresolved **Judgment Zone** involving significant voluntariness or competence concerns (especially power imbalances or high-risk deception) where you lack confidence in the protocol's mitigations OR where institutional precedent/policy needs setting. *Always* document the specific, detailed rationale.
  *   **Documentation:** Clearly state the decision AND the specific step(s)/rationale leading to it, especially for Passes involving Judgment Zones or Flags to Full Board. "Gut feeling" is replaced by "Step 3 Judgment Zone - Doctor/Patient recruitment power imbalance; protocol lacks sufficient mitigation for X reason."

  ---

  ### Running the Procedure on Your Cases

  **Case 1: Psychology Deception Study**
  *   **Step 0:** Pass (Form attached).
  *   **Step 1:** Pass (All elements present. Initial consent describes tasks/interaction, even if purpose is misrepresented).
  *   **Step 2:** **Judgment Zone.**
      *   Deception planned? Yes. Debrief planned? Yes.
      *   *Critical Check:* Does initial consent cover the *actual experience*? (Consent says "interact with others" - staged confederate *is* interaction. Passes *if* the interaction isn't abusive/extraordinary). **Pass (with Judgment Note)**. Proceed.
  *   **Step 3:** Pass (Typical student recruitment, reasonable compensation, low pressure environment). Proceed.
  *   **Step 4:** Pass (Presumed competent adults). Proceed.
  *   **Final Decision:** **PASS** (with Judgment Note on Step 2: "Reviewed deception justification & debrief; initial consent covers nature of tasks/interaction.").

  **Case 2: $200 for Mildly Unpleasant Tasks**
  *   **Step 0:** Pass.
  *   **Step 1:** Pass. Proceed.
  *   **Step 2:** Pass (Low complexity, no deception). Proceed.
  *   **Step 3:** **Judgment Zone / High Risk.**
      *   Compensation: $200 for a few hours is *high* (e.g., $50+/hour). Mildly unpleasant tasks.
      *   Population: Open to general public? Includes financially vulnerable? Protocol likely doesn't screen for financial need.
      *   *Assessment:* Not inherently coercive for students (strong inducement, not undue influence). **Significant concern for non-student, financially vulnerable individuals.** Risk of undue influence is high *for that subgroup*.
      *   **Judgment Call:** Does the compensation structure/population screening mitigate this? (e.g., Is payment prorated? Does consent emphasize voluntariness strongly? Does recruitment target a broad audience, inevitably including vulnerable people?)
      *   **Likely Outcome:** **Flag for Revision** or **Judgment Zone Note leading to Full Board if severe.** *Requires mitigation:* Stronger consent language about voluntariness *despite payment*, consider prorating payment, *or* explicitly target a less vulnerable population (e.g., employed adults) if feasible. *Without mitigation, this is ethically shaky for open recruitment.*

  **Case 3: Surgeon Recruiting Own Patients**
  *   **Step 0:** Pass.
  *   **Step 1:** Pass (Likely well-written medical consent). Proceed.
  *   **Step 2:** Pass (Medical trial, likely has comprehension checks). Proceed.
  *   **Step 3:** **Automatic Flag to Full Board (High Risk/Unresolved Judgment Zone).**
      *   **Clear Power Imbalance:** Surgeon (authority figure, controls future care) recruiting patient (vulnerable, dependent on relationship).
      *   **High Risk of Undue Influence:** Patient may fear jeopardizing care by refusing, or feel obligated to please the doctor.
      *   **Mitigation Required? YES, and it MUST be robust.** Common mitigations:
          *   **Consent Obtained by Neutral Third Party:** A research coordinator *not* involved in clinical care obtains consent.
          *   **Explicit Reassurance:** Clear, repeated statement in consent and verbally that refusal/withdrawal *will not affect clinical care in any way*.
          *   **Alternative Clinician:** Offer to transfer care to another surgeon if patient prefers (often impractical).
          *   **Cooling-off Period:** Time between initial discussion and consent decision.
      *   **Review:** Does the protocol implement *effective* mitigation? (e.g., Neutral 3rd party consent is the gold standard). If it relies *only* on written reassurance in the consent form, **mitigation is likely INSUFFICIENT**.
      *   **Decision:** **AUTOMATIC FLAG TO FULL BOARD.** Rationale: "Step 3 Fail - Significant power imbalance (Surgeon/Patient) creating high risk of undue influence. Protocol mitigation strategy [describe] requires full board evaluation for sufficiency." *This is the answer you won't like, but the procedure forces it. The board exists for exactly these high-risk judgment calls.*

  **Case 4: Elderly Participant & Daughter Answering Questions**
  *   **Step 0:** Pass.
  *   **Step 1:** Pass. Proceed.
  *   **Step 2:** **Judgment Zone / Likely Fail.** Is comprehension assessed? How? Proceed with caution.
  *   **Step 3:** Pass (Assuming no other pressures). Proceed.
  *   **Step 4:** **Judgment Zone / Likely Fail.**
      *   Target population (elderly) may include incapacity? Yes.
      *   **Critical Checks:**
          *   a. Capacity Assessment? If daughter is answering *all* questions, was capacity formally assessed *and documented*? If not, **Fail.**
          *   b. Assent Sought? Is the *participant* engaged? Do they affirmatively agree (verbally/nodding) even if daughter provides detailed answers? If participant is passive/ignored, **Fail.**
          *   c. LAR Designation: Is the daughter the legally designated representative (e.g., via power of attorney)? If not, she cannot provide consent. **Fail.**
          *   d. Form Clarity? Does the form reflect the LAR/permission process?
      *   **Judgment:** If the daughter is *not the LAR*, or capacity *wasn't assessed*, or the participant's *assent isn't actively sought and documented*, this is **invalid consent**.
  *   **Final Decision:** **FLAG FOR REVISION.** Rationale: "Step 4 Fail - Protocol lacks documented capacity assessment and clear LAR/permission process for participant where surrogate is actively involved in screening. Requires clarification of: 1) Capacity assessment procedure, 2) LAR designation/process if incapacity found, 3) Process for obtaining participant assent."

  ---

  **Where the Procedure Misfires or Allows Disagreement:**

  1.  **Step 3 Judgment Zones (Voluntariness):** This is the biggest source of potential reviewer disagreement. Two reviewers might weigh the same power imbalance or compensation level differently. The procedure forces the issue to be *identified and documented*, but the final "Pass/Flag" call in the gray area remains subjective. The key is requiring *robust mitigation* for high-risk scenarios (like the surgeon) and flagging when it's absent or weak.
  2.  **"Reasonably Understandable" Language (Step 1):** Assessing readability/comprehension without testing is inherently subjective. Reviewers might disagree on what's appropriate for a given population.
  3.  **Adequacy of Comprehension Assessment (Step 2):** Is a simple "Do you understand?" sufficient for a complex trial? Or is teach-back needed? This is a judgment call based on risk/complexity.
  4.  **Capacity Assessment Methods (Step 4):** Reviewers might disagree on whether a proposed screening tool or PI assessment process is sufficient for the population/risk.
  5.  **Deception Justification (Step 2):** While the procedure checks for debrief and initial consent coverage, the *scientific necessity* and *proportionality* of the deception is an ethical judgment the procedure highlights but doesn't resolve. A reviewer might deem a deception unnecessary even if the other boxes are ticked, requiring a Flag to Full Board.

  **Key Takeaway:** This procedure doesn't eliminate judgment. It *structures* it, forces identification of *specific* risks (especially power imbalances), provides clear pass/fail criteria for objective elements, mandates robust mitigation for high-risk scenarios, and explicitly flags where subjective judgment is paramount and needs documentation or escalation. It replaces "gut feeling" with "Step 3 Judgment Zone - Power imbalance: Surgeon/Patient. Mitigation insufficient: Relies solely on consent form language." This gives you defensible rationale for both passing and flagging. Use the **Automatic Flag to Full Board** liberally for cases involving serious unresolved judgment zones – that's what the board is for.
