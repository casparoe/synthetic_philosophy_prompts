prompt: |-
  I am reading for an MA in archaeology, and the module I am on this term is a seminar devoted entirely to societal collapse. Our tutor is a historian of the medieval Mediterranean who is famously terse and who makes us argue each case from the archaeological and textual evidence rather than from a Diamond-style narrative; she has now handed down verdicts on six cases over six weeks, and next week the seminar is being run as a prediction game, in which each of us must commit in writing to what her verdict on a seventh case will be before she gives it. I would like to do this properly rather than guess, so I want to work out which rule she is actually applying.

  Her verdicts so far, together with the little she has said by way of reasoning, are as follows. The eastern Mediterranean around 1200 BCE — the Mycenaean palatial centres and the Hittite empire — is a collapse, without qualification. The western Roman empire in the fifth century is not a collapse; she objects to the word there on the grounds that what ended was a political arrangement, while most of what made that society recognisable (landholding, the episcopate, Latin writing, the fiscal habits of local elites) carried straight over into the successor kingdoms. Roman Britain after about 400 is a collapse, and she treats it as the clearest case in the west, because towns, villas, coinage and literate administration do not persist in transformed form but simply stop. The southern Maya lowlands in the ninth century are a collapse; she is unmoved by the objection that Maya people, Maya languages and the northern cities all continued, and her remark was that what collapsed was not the Maya. Rapa Nui is emphatically not a collapse — she rejects the ecocide reading and describes a population that went on farming a difficult island while changing its political and religious forms. The Indus cities from about 1900 BCE are not a collapse either; she calls that episode deurbanisation and reorganisation, with settlement shifting eastwards rather than disappearing.

  The seventh case, which she has stipulated in the seminar pack precisely so that we cannot be tripped up by our own ignorance of it, is Cahokia and the central Mississippi valley. I will take the pack's description as given: a large mound-building centre at its height around 1100 CE with a substantial farming population around it; by the mid-fourteenth century the American Bottom and a broad stretch of the surrounding valley are abandoned and stay thinly settled for centuries; there is no destruction layer suggesting conquest; sites in neighbouring regions — the Central Illinois valley, parts of the Ohio and Tennessee valleys, the Caddoan area to the south-west — show continuity or growth over the same period and after; the descendants of these populations are among the historically documented peoples of the region; and the causes the pack canvasses are climatic cooling and hydrological instability, together with a political and religious turning-away from the chiefly order, with epidemic disease mentioned only as speculative.

  What I want from you is the following. First, the candidate rules she could be running: as many as genuinely fit all six verdicts, not merely the most obvious one, and including at least one on which the tempo and geography of an ending does the decisive work, and at least one on which the unit that collapses is a political or institutional order rather than a population. Second, for each rule, what it predicts for Cahokia, since my own suspicion is that they will not agree. Third, your best guess at her verdict, with the reasons for preferring one rule over the others; I would particularly like to know how much weight you place on her remark about the Maya, which seems to me the single most informative thing she has said, and whether the Indus verdict pulls the other way with equal force. Fourth, the one further real case that would best separate the two leading rules, and which way it would come out under each. Fifth, if the six verdicts genuinely underdetermine the seventh, an account of what she would be committing herself to by ruling either way — I do not think that it all depends on what one means by collapse is an acceptable answer here, though I do want to know whether you think the concept is doing anything more than registering which cases a speaker finds dramatic.

  Please keep the whole thing under 900 words, and open with your predicted verdict in two sentences or fewer before any of the analysis. Finally, separate explicitly what is settled from what is genuinely contested among people who work on these questions. I am aware that the scale of depopulation in the southern Maya lowlands is argued about, that the picture of an emptied Mississippi valley — the so-called vacant quarter — has been questioned, and that some archaeologists think the word should be retired altogether; I do not want a contested reading handed to me as though it were the consensus, and where your own preference is doing the work I would rather you said so.
reasoning: |-
  Okay, let's tackle this step by step. The user is an MA archaeology student preparing for a prediction game about societal collapse verdicts. Their tutor has clear patterns in six case judgments, and they need to extrapolate to Cahokia. 

  First, I need to extract the tutor's implicit rules from the six cases. The key distinctions seem to be between political/institutional collapse versus demographic/cultural continuity. Cases like Mycenaean/Hittite (full collapse) and Roman Britain (abrupt end of urban traits) contrast with Western Rome (continuity of institutions) and Rapa Nui/Indus (transformations without societal failure). The Maya verdict is pivotal: she separates "the Maya" from a specific sociopolitical order.

  Three candidate rules emerge:
  1. **Political-Institutional Collapse**: Focuses on abrupt, non-adaptive end of governing structures without functional successors.
  2. **Demographic/Cultural Continuity Rule**: Rejects "collapse" if core population/culture persists, even with radical changes.
  3. **Tempo-Geography Rule**: Requires rapid, geographically concentrated failure with no nearby continuity.

  All rules fit the six cases but diverge at Cahokia. The pack describes abandonment of the American Bottom but continuity in adjacent regions with descendant populations. This resembles Indus (deurbanization + shift) and opposes Roman Britain (wholesale disappearance). 

  The Maya remark ("what collapsed was not the Maya") suggests Rule 2 is primary: continuity of people/culture negates collapse. Indus reinforces this by emphasizing reorganization over disappearance. For Cahokia, descendant populations in neighboring areas would align with "not collapse" under Rule 2. 

  The contested issue is depopulation scale. If the "vacant quarter" is overstated (some scholars argue partial persistence), Rule 1 might apply. But the pack states "abandoned... thinly settled," so Rule 2 likely prevails. 

  Best separating case: Tiwanaku vs. Wari. Tiwanaku (rapid urban collapse but cultural continuity) would be "collapse" under Rule 1 but not Rule 2; Wari (regional fragmentation with cultural persistence) would test the same tension.

  Prediction: **Not a collapse**. Political-religious order ended, but descendant populations thrived nearby, mirroring Indus and contrasting Roman Britain. The Maya/Indus logic outweighs tempo-geography concerns.
answer: |-
  **Predicted Verdict for Cahokia:** *Not a collapse.* The abandonment of the American Bottom represents a significant political and religious transformation, but descendant populations persisted in adjacent regions with cultural continuity, aligning with deurbanization/reorganization cases like the Indus rather than terminal societal failure.

  **Candidate Rules & Their Cahokia Predictions:**
  1.  **Political/Institutional Collapse Rule:** Collapse occurs only if the core political institutions and elite structures cease functioning *without being directly replaced by successor entities maintaining core administrative/social functions*. Cahokia Prediction: *Collapse* (Mound-building chiefly order ended, no direct successor in the region).
  2.  **Demographic/Cultural Continuity Rule:** Collapse *does not* occur if the core population persists with cultural continuity (language, key practices, identity), even if political forms change radically or urban traits vanish regionally. Cahokia Prediction: *Not a Collapse* (Descendant populations confirmed in adjacent regions).
  3.  **Tempo-Geography Rule:** Collapse requires a rapid, geographically concentrated ending of complex societal traits (urbanism, administration, monumental building) *without* contemporary growth/continuity in immediately neighbouring, culturally related areas. Cahokia Prediction: *Collapse* (Abandonment of core area is concentrated and rapid, neighbouring areas show continuity/growth but are distinct polities/regions).

  **Best Guess & Reasoning:**
  Your tutor strongly prioritizes **Rule 2 (Demographic/Cultural Continuity)**. Her Maya verdict ("what collapsed was not the Maya") is pivotal, explicitly separating the fate of a people/culture from their specific political order. The Indus verdict ("deurbanisation and reorganisation, settlement shifting") reinforces this, demonstrating continuity of population and adaptation despite urban decline. Rapa Nui (population persisted, changed forms) and W. Rome (key societal elements continued) further fit Rule 2. Rule 1 fits Mycenaean/Hittite (elite structures destroyed, no clear successors) and Roman Britain (population decline/dislocation, societal traits vanish). Rule 3 fits Mycenaean/Hittite and Roman Britain (core regions emptied, traits ended) but struggles with the Indus (shift, not disappearance). For Cahokia, confirmed descendant populations in neighbouring regions exhibiting continuity/growth (pack description) aligns perfectly with Rule 2 and the Indus/Maya logic, outweighing the regional abandonment (Rule 3) or end of the chiefly order (Rule 1). The Indus verdict pulls *with* the Maya logic, not against it – both emphasize persistence.

  **Separating Case: Tiwanaku (Andean highlands, ~1000-1100 CE)**
  *   **Description:** Major urban centre and state collapses; dramatic depopulation of core heartland; complex irrigation/terracing abandoned; no clear successor state *in the core*; Tiwanaku-derived populations and cultural elements persist in surrounding valleys and lower elevations, forming smaller polities (e.g., Pacajes, Lupaqa). Cause debated (drought, internal conflict).
  *   **Under Rule 2 (Continuity):** *Not a Collapse* (Core population persists culturally/regionally, political fragmentation).
  *   **Under Rule 1 (Institutional Failure) or Rule 3 (Tempo-Geography):** *Collapse* (Sudden end of state/urban core in heartland without direct successor there).
  *   *(My preference leans Rule 2, viewing Tiwanaku as transformation/fragmentation, but Rule 1/3 interpretations are common and contested).*

  **Underdetermination & Commitments:**
  The six verdicts *do not* definitively preclude Rule 1 or 3 for Cahokia. Ruling "Collapse" would commit her to:
  1.  The end of Cahokia's political/religious order was fundamentally *discontinuous* and non-adaptive.
  2.  The abandonment of the American Bottom represents a societal *failure* exceeding mere reorganization.
  3.  The persistence in neighbouring regions is insufficient compensation for the core loss (geography/tempo matters more).
  Ruling "Not Collapse" commits her to:
  1.  The confirmed presence of descendant populations elsewhere signifies successful societal *adaptation*.
  2.  The abandonment is best understood as *strategic relocation/reorganization* (like Indus), not collapse.
  3.  The unit of analysis is primarily the *people/culture*, not the specific political formation or core location.

  **Settled vs. Contested:**
  *   **Settled:** There is no single, universally accepted definition of "societal collapse" in archaeology. Cases involve complex interplay of political, demographic, economic, and environmental factors. Terms like "transformation," "resilience," "reorganization," and "fragmentation" are often preferred over "collapse" by many scholars. The scale of Cahokia's regional abandonment and the persistence/identity of neighbouring groups are evidence-based conclusions (per your pack).
  *   **Contested:** The *scale* of depopulation in the Maya lowlands (how drastic, how rapid) and the Mississippian "Vacant Quarter" (how absolute, duration) are debated. The *primacy* of different factors (environment, conflict, ideology) in each case is contested. Whether "collapse" is a useful analytical term or merely a dramatic narrative device is fundamentally contested; many scholars (myself included) find it often obscures more than it explains, favouring process-oriented frameworks. Your tutor's specific criteria (Rule 2) represent a strong, coherent, but *contested* position emphasizing demographic/cultural continuity over political/institutional failure.
