prompt: |-
  I've been going back and forth with a friend over Humeanism vs. anti-Humeanism about laws of nature, and the part I keep getting stuck on is where probabilistic laws are supposed to put pressure on the Armstrong-style universal theory. Everyone in the discussion just waves at quantum mechanics and I want something cleaner and more controlled, so can you build me a thought experiment to spec? The setup should be a classical, non-quantum physical system -- no radioactive decay, no QM at all, pick something mundane like a material, a chemical reaction, or a biological process -- where a very strong statistical regularity holds: in about 99% of cases of some event A, a follow-up event B happens within a short window, and the ~1% of failures are genuinely random, uncorrelated with any observable property (size, composition, heating rate, location, time, whatever) and unpredictable in the individual case, though the 99% rate stays stable across batches and repeated trials. Stipulate the base facts fully so there's no hidden variable and no further regularity hiding in the 1%.

  Here's what the case has to do. First, the Lewisian best-system account should pick out a genuine probabilistic law, something like P(B|A) = 0.99, as the law of the system, and I want you to show the simplicity/strength balance concretely -- why this compact probabilistic statement wins the best-system tradeoff against any exceptionless universal, and note that the universal "all A's are B" is just not in the running because laws are true. Second, the Armstrongian universal theory should come out badly: either it has to say there's no law at all here, just a brute contingent regularity, or it can at best offer a ceteris paribus universal, and I want you to show exactly where the "true, non-accidental, exceptionless universal" requirement breaks given the random failures. Third, the case should show the disagreement is substantive and not just verbal: the Lewisian probabilistic law should license probability estimates for compound or sequential situations (like the probability that ten independent A-events yield exactly nine B's) in a way the Armstrongian's "no law" or "ceteris paribus" answer can't match, since for the Armstrongian those compound rates are just brute frequencies with no law behind them. The verdicts have to actually follow from applying each theory to the base facts, not be stipulated into the scenario.

  Constraints: keep the scenario itself to a couple of paragraphs, no quantum mechanics, and hold fixed the practical success of a scientist who just uses the 99% rule for predictions -- I want to keep the metaphysical disagreement seperate from any practical stakes, so the scientist's track record shouldn't be what tips either theory. After the scenario, walk through each theory's verdict and why, then give me the honest notes: wich single feature of the case is doing the work and why, what happens to the gap if that feature is removed (e.g. if the 1% failures were actually governed by some further condition), and how a defender of the theory that comes out badly would attack the case -- what's their best objection, and does it survive?
reasoning: |-
  We are going to design a classical, non-quantum scenario that meets the specifications.

  Scenario: The Brittle Crystal

  Imagine a naturally occurring mineral, "fragilite", which forms in geodes in a particular kind of rock. When a fragilite crystal of sufficient size (at least 1 cm in diameter) is heated above 50°C, it undergoes a transformation: it either shatters into a fine powder (event B) or it doesn't. We observe that in about 99% of such heating events (event A: heating a >=1cm fragilite crystal above 50°C), the crystal shatters (B occurs). The remaining 1% of cases, the crystal remains intact (B does not occur) and appears to become more stable (it can then be heated to much higher temperatures without shattering). 

  Crucially, we have examined the crystals with every available non-destructive test (X-ray diffraction, spectroscopy, electron microscopy, etc.) and found no hidden property that distinguishes those that shatter from those that don't. The failure to shatter is uncorrelated with any observable feature: size (as long as it's at least 1cm), shape, minor impurities, heating rate (as long as it's above 50°C), location in the geode, time of year collected, etc. Moreover, the 99% rate is stable: in every large batch of crystals (say, 1000 or more) from any geode, the shattering rate is consistently 99%. 

  Additionally, we have tried to find a pattern in the 1% of non-shattering events: we have taken a non-shattered crystal and then heated other crystals from the same geode, or even crushed a non-shattered crystal and used it as a seed for growing new crystals, and then heated those. The non-shattering property does not seem to be transmitted or reproducible. The non-shattering events are random and unpredictable in individual cases.

  Base facts:
  - Event A: heating a fragilite crystal (>=1 cm) above 50°C.
  - In 99% of A events, B (shattering) occurs within 1 minute of reaching 50°C.
  - The 1% of cases where B does not occur are genuinely random and uncorrelated with any observable property or condition we can measure or control.
  - There is no hidden variable: we've exhausted all possible measurements and found no underlying property that determines the outcome. The failures are truly indeterministic at the level of our best classical understanding.
  - The 99% rate is stable across all batches and repeated trials.

  Now, we want to see how the two theories of laws of nature (Humean best-system and Armstrong's universals) handle this.

  1. Lewisian (Humean) Best-System Account:

  The best-system account says that laws are the axioms of the system that best balances simplicity and strength. The system must be true (so it must fit the actual mosaic of events).

  In this case, we have a massive regularity: 99% of A's are followed by B. Any attempt to state an exceptionless universal law (like "All heated fragilite crystals shatter") would be false because of the 1% exceptions. So we cannot have that as a law.

  What are the alternatives? We could have a system that lists every particular event (every crystal heating and its outcome). But that would be incredibly complex and not simple at all.

  Alternatively, we can have a probabilistic law: "When a fragilite crystal (>=1 cm) is heated above 50°C, the probability of shattering (B) is 0.99." This law is very simple and very strong. It captures almost all of the regularity with a very short statement. 

  We might also consider a system that tries to account for the 1% by adding a ceteris paribus clause or by listing conditions under which the exception occurs. But by stipulation, there are no such conditions. So any attempt to write an exceptionless universal would require adding an enormous amount of complexity to list every exception individually (which would be extremely complex and not simple) or to include a false ceteris paribus condition (which would make the system false). 

  Therefore, the best system will include the probabilistic law because it is simple, informative (it tells us what to expect in 99% of cases), and true (it doesn't claim anything false). It wins the simplicity-strength trade-off.

  Moreover, this probabilistic law licenses predictions for compound events. For example, the probability that in 10 independent A-events we get exactly 9 B's is given by the binomial distribution: C(10,9) * (0.99)^9 * (0.01)^1 ≈ 0.091. This is a law-governed probability. Without the probabilistic law, we would have no such license.

  2. Armstrong's Universals Theory:

  Armstrong holds that laws are relations of nomic necessity between universals. A law must be a true, exceptionless universal generalization. In this case, we cannot have the universal "All A's are B" because it is false (there are exceptions). 

  Could we have a universal that includes a ceteris paribus clause? Armstrong's theory typically does not allow for ceteris paribus laws because the relation of nomic necessity is supposed to be strict. Moreover, if we try to formulate a universal that includes a condition C (say, "All A's that are C are B"), then we must be able to specify what C is. But by stipulation, there is no such condition C that we can find. The 1% failures are random and not correlated with any property. So we cannot state an exceptionless universal without either:

  (a) Falsity: if we say "All A's are B", it's false.
  (b) Incompleteness: if we say "All A's are B, except in these specific instances" (listing the exceptions), then we have an extremely complex and disjunctive universal, which is not a genuine relation between universals but an ad hoc list.

  Therefore, the Armstrongian must say that there is no law here. There is only a brute contingent regularity: it just happens that 99% of the time, A is followed by B, but there is no law governing it. The regularity is accidental.

  This leads to a problem: the regularity is stable and holds across batches and time. And it is not just a local accident because it holds in different geodes and at different times. But without a law, the Armstrongian cannot explain why the regularity holds. Moreover, the Armstrongian cannot use the regularity to support counterfactuals or predictions about unobserved cases in the way that a law would. For example, if we ask what would happen if we heated a crystal that we haven't heated yet, the Armstrongian has no law to say that it has a 99% chance of shattering. They can only say that in the past, 99% of such events led to shattering, but that's just a historical fact.

  Additionally, the Armstrongian cannot account for the probabilistic predictions for compound events. For the Armstrongian, the fact that in a sequence of 10 A-events we get exactly 9 B's is just a brute fact about that sequence. There is no law that says such sequences should occur with a certain probability. The pattern in the entire mosaic of events is just a giant coincidence.

  3. Substantive Disagreement:

  The substantive disagreement is that the Lewisian has a law (the probabilistic one) that licenses predictions and counterfactuals about individual cases and sequences. The Armstrongian, lacking a law, must treat the entire regularity as a giant accident. This affects how we reason about unobserved cases and compound events.

  Honest Notes:

  The key feature doing the work is the genuine randomness and lack of hidden variables in the 1% failures. This ensures that no exceptionless universal can be formulated without sacrificing simplicity or truth. Without this feature, if the 1% failures were actually governed by some hidden condition (say, a microscopic structural property we haven't measured), then the Armstrongian could hold out hope for an exceptionless universal that includes that condition. The Lewisian best-system might then also include that condition if it were simple enough, but if the condition is complex, the probabilistic law might still win. But in our scenario, we've stipulated that there is no such condition.

  How an Armstrongian might attack:

  The best objection from an Armstrongian would be to challenge the stipulation of randomness and no hidden variables. They might argue that we haven't looked hard enough or that there must be some hidden property that determines the outcome. They might say that the randomness is only epistemic and that in reality, there is a deterministic property we haven't discovered. But note that we have stipulated that there is no hidden variable and that the failures are genuinely random. This is a metaphysical scenario, so we are allowed to stipulate the base facts.

  However, in the real world, an Armstrongian might argue that quantum mechanics (which we've excluded) is the only source of genuine randomness and that in a classical scenario, determinism must hold. But we have built a classical scenario with genuine randomness by fiat. So the Armstrongian might reject the possibility of such a scenario. But the point of the thought experiment is to test the theories in a case where the base facts are as described. If the Armstrongian theory cannot accommodate such a scenario (which is coherent and not ruled out by logic), then that is a problem for the theory.

  Alternatively, an Armstrongian might bite the bullet and say that there are no laws in such a scenario, only a very stable accident. But then they must explain why this accident is so stable and why it supports counterfactual reasoning as well as it does. The Lewisian has an explanation: it's a law.

  Conclusion:

  The Brittle Crystal scenario provides a clean example of a classical system with a probabilistic regularity that resists reduction to an exceptionless universal. The Lewisian best-system account delivers a probabilistic law that is simple, informative, and true. The Armstrongian account, requiring exceptionless universals, fails to find a law and must treat the regularity as accidental. The gap is most evident in the treatment of compound probabilities and counterfactuals.
