  ### Thought Experiment: The Fragile Polymer  
  **Scenario:**  
  Consider a synthetic polymer, *fragilite*, used in manufacturing. When a fragilite sample is cooled below 10°C (event **A**), it becomes brittle. If then struck with a 1-newton impact (a standard test), it fractures (event **B**) in 99% of cases. The 1% failure rate—where it *doesn’t* fracture—is genuinely random. No detectable property predicts failures: not sample mass, molecular weight (within tolerance), cooling rate, impact angle, humidity, or spatial position. Repetitions with the *same* sample (if undamaged) show no memory: a previously unfractured sample has the same 99% chance of fracturing on retesting. The 99% success rate holds across all batches produced identically, and no "hidden variable" exists—failures are irreducible to any underlying pattern. Scientists reliably use "P(B|A) = 0.99" for quality control, but this practical success is *not* part of the metaphysical evidence.  

  ---

  ### Analysis of Theories  
  #### **1. Lewisian (Humean) Best-System Account**  
  - **Verdict:** The law is a probabilistic one: **P(B|A) = 0.99**.  
  - **Why:**  
    - **Truth:** Any exceptionless universal (e.g., "All A-events lead to B") is false—the 1% failures falsify it.  
    - **Simplicity:** The probabilistic law is maximally compact—a single equation capturing the entire regularity.  
    - **Strength:** It describes 99% of cases accurately and predicts aggregate behavior (e.g., "In 100 trials, expect ~99 fractures").  
    - **Best-System Tradeoff:**  
      - An exceptionless universal fails because it’s untrue.  
      - A system listing all individual outcomes is maximally complex (trillions of instances) and weak (no generalization).  
      - A ceteris paribus law (e.g., "All A-events cause B, unless...") requires specifying the 1% exceptions. But since failures are random and uncorrelated, this would demand an infinitely long disjunction (e.g., "...unless sample S1 at time T1, or S2 at T2, or..."), destroying simplicity.  
    - **Licensing Compound Predictions:** The law calculates probabilities for sequences (e.g., "P(exactly 9 fractures in 10 trials) = C(10,9) × (0.99)⁹ × (0.01)¹ ≈ 0.091"). This isn’t just descriptive—it reflects a *nomic probability* governing each trial.  

  #### **2. Armstrongian Universal Theory**  
  - **Verdict:** There is **no law**, only a brute contingent regularity.  
  - **Why:**  
    - Armstrong requires laws to be *exceptionless universals* expressing nomic necessity between properties (e.g., "A-ness necessitates B-ness").  
    - The universal "All A-events cause B" is false—contradicted by the 1% failures.  
    - A ceteris paribus law (e.g., "All A-events cause B, ceteris paribus") fails because:  
      - **No Salvageable Universals:** The "ceteris paribus" clause implies unspecified conditions *C* that explain exceptions. But no such *C* exists—failures are random and uncorrelated. Any attempt to define *C* (e.g., "when no quantum fluctuations occur") is ad hoc, false (no QM in the scenario), or circular ("when the law holds").  
      - **No Nomic Necessity:** Armstrong’s universals must be *necessarily* true if they are laws. Random exceptions undermine necessity—there’s no property whose presence *guarantees* B.  
    - **Result:** The regularity is metaphysically accidental. Stability across batches is a cosmic coincidence with no governing law.  
  - **Problem for Compound Predictions:**  
    - The Armstrongian cannot explain *why* sequences (e.g., 9 fractures in 10 trials) occur at ~9.1% frequency. For them, this is a *brute fact* about those specific trials, not a consequence of a law. Without probabilistic laws, they lack resources to derive sequence probabilities from single-case tendencies.  

  #### **Substantive Disagreement**  
  - **Lewisian Advantage:** The probabilistic law supports *counterfactuals* and *predictions* for *individual cases* (e.g., "This specific sample has a 99% chance of fracturing") and *sequences* (e.g., "P(≥98 fractures in 100 trials) ≈ 0.92").  
  - **Armstrongian Limitation:** Without a law, all predictions are extrapolations from past frequencies. For a *new* batch, the scientist can say, "Past batches showed 99% fractures," but cannot say *this batch* has a 99% tendency per trial. Sequences are unpredictable beyond observed frequencies—e.g., the 9-in-10 rate is a lucky pattern, not nomic.  

  ---

  ### Honest Notes  
  **Key Feature Doing the Work:**  
  The **irreducible randomness in failures** (no hidden variables, no patterns in the 1%) forces Armstrong’s hand. His theory requires exceptionless universals, but randomness makes exceptions unavoidable and unexplainable. For Lewis, randomness is *compatible* with laws—it’s precisely what probabilistic laws describe.  

  **If This Feature Is Removed:**  
  Suppose the 1% failures *were* governed by a hidden variable (e.g., "fracture fails iff impurity X > 5ppm"). Then:  
  - Armstrong could posit a universal: "All A-events *with X ≤ 5ppm* cause B."  
  - Lewis might still prefer a probabilistic law (if the hidden variable is undetectable and complex), but Armstrong’s account now has a path to a universal law.  
  The gap collapses because randomness is what makes universals impossible.  

  **Best Objection from an Armstrongian:**  
  - **Attack:** "Randomness is incompatible with classical physics! In a *true* classical world, determinism holds, so failures must have a hidden cause. Your scenario is impossible."  
  - **Rebuttal:**  
    - The thought experiment *stipulates* classical randomness as a base fact (e.g., as emergent chaos or pseudo-randomness). Metaphysical theories must handle coherent possibilities, not just actual physics.  
    - If Armstrongians insist classical physics *must* be deterministic, they conflate metaphysics with contingent science. The scenario tests their theory’s *scope*—if it can’t handle clear cases of randomness, it’s inadequate for science (e.g., thermodynamics or evolutionary biology, where randomness is modeled classically).  
  - **Does It Survive?** No. The objection refuses to engage the thought experiment on its own terms. The randomness is stipulated, so Armstrong’s theory must still explain why the regularity isn’t a law—and it fails.  

  **Conclusion:**  
  The case isolates how irreducible randomness exposes a rift: Lewisians get a simple, predictive law; Armstrongians get accidental regularities. The polymer’s fragility isn’t governed by necessity—and that’s why Humeanism handles it best.
