  Debriefing:

  After the game, we collect the data: for each team, what p they chose, and what payoff they got.

  Then we compute the expected payoff for a team that chose p: 
  Expected payoff = P(first driver exits)*1 + P(first driver continues and second exits)*4 + P(both continue)*0
  = (1-p)*1 + (p * (1-p)) *4 + (p*p)*0
  = 1 - p + 4p(1-p) = 1 - p + 4p - 4p^2 = 1 + 3p - 4p^2.

  We then show that this is maximized at p=3/8, and the maximum value is 1 + 3*(3/8) - 4*(9/64) = 1 + 9/8 - 36/64 = 1 + 9/8 - 9/16 = (16/16 + 18/16 - 9/16) = 25/16 = 1.5625.

