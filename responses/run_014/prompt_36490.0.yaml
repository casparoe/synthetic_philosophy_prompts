  Then we present the ex-post argument:

  Suppose you are at an intersection. Let q be your belief that you are at the first intersection. Then the expected payoff of exiting is 1 (because if you exit, you get 1 regardless of where you are).

  The expected payoff of continuing: 
  - If you are at the first (prob q), then you will go to the second and then you will use the policy p (so you get 4 with prob 1-p and 0 with prob p).
