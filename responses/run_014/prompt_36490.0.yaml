  - If you are at the second (prob 1-q), then continuing gives 0.

  So overall, expected payoff of continuing: q * 4(1-p) + (1-q)*0 = 4q(1-p)

  So you prefer to continue if 4q(1-p) > 1, and exit otherwise.

  But note: the policy p that was set ex-ante must be optimal given q. Also, in equilibrium, your belief q should be consistent with the policy.

  How to form q? If the policy is p, then the probability that you are at the first intersection given that you are at an intersection is:

  P(at first | at an intersection) = P(at first) / [P(at first) + P(at second)]

  But P(at first) = 1 (because every trip has a first intersection) and P(at second) = P(first driver continues) = p.

  So q = P(at first | at intersection) = 1 / (1+p)

  Then, the condition for continuing to be optimal is:
  4 * [1/(1+p)] * (1-p) > 1
  => 4(1-p) / (1+p) > 1
  => 4-4p > 1+p
  => 4-1 > 4p+p
  => 3 > 5p
  => p < 3/5

