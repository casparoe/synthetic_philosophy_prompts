  ### In-Class Game: The Absent-Minded Driver Relay  
  **Objective:** Make students *experience* the paradox—the clash between the optimal pre-commitment strategy and the intuitive action at an intersection—without getting lost in algebra. Emphasize physical absent-mindedness, policy commitment, and the "whatever I do now, I did then" reasoning.  

  ---

  ### **Game Setup**  
  **Players & Roles:**  
  - **14 students** split into **7 teams of 2**.  
  - Each team is one "driver" (a single agent with shared memory).  
  - **Instructor** is the "Game Master" (GM).  

  **Why teams?**  
  - Simulates a *single* absent-minded agent: Teams must agree on a policy pre-commitment, and no communication is allowed during the game.  
  - Avoids multi-agent bargaining: Emphasize that teams are "one mind" with identical actions at both intersections.  

  **Materials:**  
  - **Two identical "intersection stations"**: Set up at opposite ends of the room (e.g., two desks with identical props: a red button for "exit", a blue button for "continue"). Use partitions/screens so stations aren’t visible to each other.  
  - **Memory wipe tool**: A **distraction task** (e.g., a 30-second puzzle: "Solve 5 + 3 × 2") to clear working memory between intersections.  
  - **Randomizing device per team**: A custom spinner (or die/dice) for mixed strategies. Label spinners with "exit" (1–5) and "continue" (6–8) to default to p = 3/8 if teams choose it.  
  - **Payoffs**: Use **candy** (e.g., 1 candy = payoff 1, 4 candies = payoff 4, 0 candies = payoff 0). Small stakes keep it light but real.  
  - **Blindfolds** (optional): For drivers moving between stations to prevent counting steps.  

  **Timeline (90 minutes total):**  
  1. **Intro & Rules (10 min)**  
  2. **Policy Planning (10 min)**  
  3. **Game Execution (30 min)**  
  4. **Data Collection (5 min)**  
  5. **Debrief (35 min)**  

  ---

  ### **Rules of the Game**  
  **1. Policy Commitment (Pre-Game):**  
  - Teams meet to choose a **fixed policy probability `p`** (0 ≤ p ≤ 1) for continuing at *any* intersection.  
    - *Example:* If p = 0.5, they continue 50% of the time.  
  - Teams record `p` and receive a spinner/die matching their `p`.  

  **2. Absent-Minded Relay (Per Trip):**  
  - **Each "trip"** simulates the drive:  
    - **Step 1:** Team selects **one driver** (Student A) to start at Station 1.  
    - **Step 2:** Student A uses the spinner at Station 1.  
      - If **exit**: Trip ends. Payoff = **1 candy**.  
      - If **continue**: Student A completes a **distraction task** (puzzle), then moves to Station 2 *blindfolded* (to prevent location cues).  
    - **Step 3:** **At Station 2**, Student A repeats:  
      - Uses spinner again (same policy `p`).  
      - If **exit**: Payoff = **4 candies**.  
      - If **continue**: Payoff = **0 candies**.  
  - **Memory wipe**: The distraction task and blindfolded movement erase situational memory. Teams cannot discuss during the trip.  
  - **Cheat prevention**: GM monitors stations. If a driver peeks/communicates, payoff = 0 for that trip.  

  **3. Multi-Trip Structure:**  
  - Each team runs **3 trips** (rotating drivers within teams).  
  - Teams keep cumulative candy payoffs.  

  **Payoff Summary:**  
  - Exit at Station 1: **1 candy**.  
  - Continue at Station 1 + Exit at Station 2: **4 candies**.  
  - Continue at both: **0 candies**.  

  ---

  ### **Why This Works**  
  - **Absent-mindedness physicalized**: Distraction tasks + blindfolds prevent memory of location. Identical stations enforce indistinguishability.  
  - **One-agent illusion**: Teams enforce shared policy, avoiding multi-agent perceptions.  
  - **Stakes**: Candy makes payoffs tangible but low-stakes.  
  - **Randomization**: Spinners enable mixed strategies.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem: Students cheat by counting steps or peeking.**  
     - **Fix:** Strict GM monitoring. Immediate payoff = 0 for violations. Use blindfolds and screens between stations.  

  2. **Problem: Distraction task fails to wipe memory.**  
     - **Fix:** Use a chaotic task (e.g., "Memorize 7 random words and recall them backwards"). Debrief to confirm no memory: "Did you know your location?"  

  3. **Problem: Teams ignore mixed strategies (e.g., always p=1 or p=0).**  
     - **Fix:** Encourage randomization by providing spinners. If teams choose extremes, their low payoffs (e.g., 0 for p=1) will highlight the paradox in debrief.  

  4. **Problem: Time overrun.**  
     - **Fix:** Limit trips to 3 per team. Use a timer for distraction tasks (30 sec max).  

  5. **Problem: Students don’t internalize the "one agent" framing.**  
     - **Fix:** Start with a clear analogy: "Your team is one driver with amnesia between intersections."  

  ---

  ### **Debrief (35 min)**  
  **Goal:** Connect the game to the paradox, contrasting planning vs. action perspectives.  

  **Step 1: Share Results (5 min)**  
  - Collect team data on policies (`p`) and average payoffs.  
  - *Example table:*  
    | Team | Policy (p) | Avg. Payoff |  
    |------|------------|-------------|  
    | 1    | 3/8        | 1.6         |  
    | 2    | 0.5        | 1.5         |  
    | ...  | ...        | ...         |  

  **Step 2: Planning Perspective (Optimal Pre-Commitment) (10 min)**  
  - Show the math:  
    - Expected payoff = \(1 \times (1 - p) + 4 \times p(1 - p) + 0 \times p^2 = 1 + 3p - 4p^2\).  
    - Maximize at \(p = 3/8\), payoff = \(25/16 = 1.5625\).  
  - Highlight: Teams near p=3/8 likely got higher payoffs. This is rational *before* the trip.  

  **Step 3: Action Perspective (At an Intersection) (15 min)**  
  - Ask drivers:  
    - "When you were at a station, did you know if it was first or second?" (Emphasize: they shouldn’t).  
    - "What did you *want* to do in the moment? Exit or continue?"  
  - **Reveal the paradox:**  
    - "Suppose you’re at an intersection. If you exit, you get 1. If you continue, what happens?"  
    - **Reasoning trap**: "Whatever I do now, I must have done at the first intersection too. If I’m the type to continue, I *already* continued at Station 1, so continuing now might lead to 0!"  
    - Result: Many will say, "I wanted to exit to guarantee 1."  
  - **Contrast with planning**:  
    - Pre-commitment says "continue with p=3/8" is best.  
    - At the intersection, exiting feels safer.  

  **Step 4: The Belief Challenge (5 min)**  
  - Pose: "Should you form a belief about your location? E.g., 'I’m probably at the first intersection because not all trips reach Station 2.'"  
    - Calculate belief (q = probability at Station 1):  
      - \(q = \frac{1}{1+p}\) (since Station 1 always happens; Station 2 only if continued at Station 1).  
    - At p=3/8, q=8/11 ≈ 73%.  
    - Then, continuing gives: \(q \times 4(1-p) + (1-q) \times 0 = 4 \times \frac{8}{11} \times \frac{5}{8} = \frac{20}{11} \approx 1.82 > 1\).  
    - So continuing *should* seem better! But in the game, it *feels* worse. Why?  

  **Step 5: The Core Paradox (5 min)**  
  - **Clash summarized**:  
    - Planning: p=3/8 is optimal.  
    - Execution: "If I continue, I’m the type who continued before, so I might get 0!" → Exiting feels rational.  
  - **What the game can’t replicate**: The game enforces pre-commitment (no deviation), but real life tempts you to abandon the plan. The paradox is that the optimal plan feels wrong in the moment.  
  - **Bridge to papers**: Explain that follow-up papers (e.g., Aumann, et al.) resolve this by redefining rationality for imperfect recall.  

  ---

  ### **Why This Fits**  
  - **Experiential**: Students *live* the conflict—policy vs. action—through physical absent-mindedness.  
  - **No algebra overload**: Math appears only in debrief to explain observed results.  
  - **Time-efficient**: 30-min game keeps energy high; debrief unpacks depth.  
  - **Paradox preserved**: The "whatever I do now, I did then" reasoning emerges naturally from the relay.  

  Run this, and your students will feel the paradox in their bones—before you hand them the papers. 🚗💨
