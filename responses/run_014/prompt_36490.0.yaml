  4 * [1/(1+3/8)] * (1-3/8) = 4 * [1/(11/8)] * (5/8) = 4 * (8/11) * (5/8) = 4 * 5/11 = 20/11 ≈ 1.818 > 1.

  So at the ex-ante optimal p, when you are at an intersection, continuing gives about 1.818 which is greater than 1, so you would want to continue. So where is the paradox?

  The paradox in the original Piccione-Rubinstein is that they argue that the driver, upon being at an intersection, should realize that whatever action they take, the other intersection (if it exists) will have the same action. So if they are the kind of driver who continues, then if they are at the first intersection, they will continue, and then at the second they will also continue (since they use the same strategy) and get 0. So by continuing, they get 0. If they exit, they get 1. So they should exit.

  This is the "temporal inconsistency" in reasoning.

  In our game, we can ask the drivers: "Did you think that whatever you do, the other driver would do the same? Because they are following the same policy." 

  If the driver is at the first intersection, and they continue, then the second driver will use the same p, so with probability p the second driver will continue and you get 0, and with probability 1-p they exit and you get 4. That's the 4(1-p) we had.

  But if the driver is at the second intersection, and they continue, they get 0. And they know that the first driver must have continued (otherwise they wouldn't be there) and also continued (because the first driver used the same p and by assumption they are a "continuer" type). So if they are at the second intersection, then the first driver continued, and if they continue now, they get 0. If they exit, they get 4. So at the second intersection, they would definitely want to exit, not continue. But the policy forces them to continue with probability p.

  This is the crux: the policy is set in advance, but at the second intersection, the driver would prefer to deviate and exit. But in our game, the drivers are committed to the policy. So we don't see the deviation.

  To make them feel the paradox, after a few runs, we can ask the drivers: "If you could change your mind at the intersection, would you? What would you do?"

  And then we can have a round where the drivers are allowed to deviate from the policy. But then the team's policy is not followed. This might break the game.

