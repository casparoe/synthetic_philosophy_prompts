  Plan for the class:

  Time: 90 minutes.

  1. Introduction (10 minutes): Explain the absent-minded driver scenario. Draw the decision tree. Emphasize that the driver cannot distinguish the two intersections and must use the same mixed strategy at both.

  2. Game setup (10 minutes): Divide the class into teams of 3. Each team chooses a policy p (a number between 0 and 1). We provide a randomizing device: for example, a spinner that they can set to have a segment of size p for "continue" and 1-p for "exit". Or we can use a die: if they choose p = k/6, then roll a die and continue if the die is <=k.

  3. Game execution (30 minutes): Each team will play 5 trips. For each trip:

     a. The team randomly selects two drivers (by drawing lots). The two drivers are separated (e.g., one to the left of the room, one to the right, facing away).

     b. The instructor (game master) flips a coin to decide which driver is first and which is second.

     c. The first driver is brought to the front and makes a decision using the team's spinner/die. The instructor records the decision.

     d. If the decision is exit, the trip ends with payoff 1. The second driver is not used.

     e. If continue, then the second driver is brought to the front (the first driver sits down) and makes a decision. If exit, payoff=4; if continue, 0.

     f. Record the payoff for that trip.

  4. After 5 trips, the team calculates their average payoff.

  5. Data collection (5 minutes): The instructor collects from each team: their p, and their average payoff.

  6. Debrief (35 minutes):

     a. Show the expected payoff function: f(p)=1+3p-4p^2. Plot it or calculate for p=0,0.25,0.5,0.75,1.

     b. Show that the maximum is at p=3/8=0.375, f=25/16=1.5625.

     c. Compare with the teams' results. Which team got the highest average?

     d. Then, introduce the ex-post perspective. Ask the students who acted as drivers: "When you were at the intersection, did you know if you were first or second? Did you have a belief? What did you think would happen if you continued?"

     e. Present the belief-based calculation: q = 1/(1+p). Then the value of continuing is 4q(1-p). At p=3/8, q=1/(1+3/8)=8/11, and 4*(8/11)*(5/8)=20/11>1, so continuing is better.

     f. Then present the other perspective: "But notice: if you are at the second intersection, then the first driver must have continued. And if you are at the second intersection and you continue, you get 0, but if you exit, you get 4. So you would rather exit. Why didn't you exit for sure at the second intersection?"

     g. Discuss the tension: the policy is set ex-ante and is optimal, but at the second intersection, the driver would want to deviate. However, if they deviate (by exiting for sure at the second), then what should they do at the first? If at the first they exit, they get 1, but if they continue, then they would exit at the second and get 4, so they would want to continue at the first. But then they are using a different strategy at the two intersections, which is not allowed because they can't tell them apart.

     h. Conclude with the paradox: the optimal plan is not sequentially rational at the second intersection. The literature (Aumann, et al.) resolves this by redefining the solution concept (like using a modified notion of Nash equilibrium for games with imperfect recall).

  What might go wrong:

  - Students might not understand the randomizing device. Solution: have a few spinners prepared or use dice with clear instructions.

  - The second driver might feel left out or might guess they are second. Solution: explain that the setup requires that sometimes the second driver is not needed, and that they are not to infer from being called or not.

  - Time might be tight. We can reduce the number of trips per team or have fewer teams.

  - The calculation of expected payoff might be too mathematical for some students. Have a handout with the formula and a graph.

  - Some teams might choose p=0 or p=1 and get low payoffs, which is fine for illustration.

  - The belief formation (q=1/(1+p)) might be hard. We can derive it slowly.

  This should make them feel the paradox.
