prompt: |-
  I'm a PhD student TAing a philosophy of cognitive science course, and next week I have to teach the frame problem to a mixed class of philosophy and computer science undergraduates in one eighty-minute section. Most of them have read Dennett's paper on the frame problem, but they haven't seen the original McCarthy and Hayes formulation, and I can tell from their forum posts that several of them think the frame problem is just about "how to give a robot enough common sense" or "the problem of listing all the facts a system needs to know." A couple of the CS students suspect it was solved by modern machine learning. I don't need you to explain the frame problem to me — I know the material. What I need is a teaching plan: the order in which the pieces have to be introduced, the one example that should carry the whole thing, the misconceptions that will predictably form and exactly where in the sequence I should head each one off, and how I'll know at the end whether they've actually understood the problem rather than just memorized a story about robots.

  Please structure your response in the following sections, with the rough lengths indicated:

  **Dependency structure** (about 250 words): What has to come first, second, and third in the explanation, and what depends on what. I'm especially interested in whether the McCarthy-and-Hayes technical formulation should come before or after the Dennett-style philosophical framing, and why. Tell me which idea, if not fully in place, makes everything that follows collapse.

  **The carrying example** (about 200 words): The one example or scenario that should run through the whole session. Tell me what it must have and what it must lack, and why Dennett's robot story is or isn't the right choice. If you think something else works better, describe it and justify the switch.

  **Misconception map** (about 300 words): The three or four most predictable misconceptions the students will bring or form, the point in the sequence where each one is likely to surface, and exactly how I should handle it at that moment — whether by letting it play out and then undercutting it, by heading it off before it crystallizes, or by using it as a bridge to the next piece. Address at minimum the "it's just the common-sense knowledge problem" conflation, the "machine learning solves this" line from the CS students, and whatever you think the third and fourth biggest traps are.

  **Check for understanding** (about 150 words): One question or task I can give in the last ten minutes that would tell me whether they've grasped the frame problem as distinct from the general problem of programming intelligence. It shouldn't be something they can answer just by summarizing Dennett. Tell me what a correct answer looks like and what a near-miss answer looks like — the one that sounds right but reveals they still don't have it.

  **What to leave out** (about 100 words): What I should openly refuse to cover at this level, and how to say so without making it sound like I'm dodging the hard part.
reasoning: |-
  Okay, the user is a PhD student TA teaching a philosophy of cognitive science course. They need to explain the frame problem to undergrads from both philosophy and CS backgrounds. The students have read Dennett but are conflating the frame problem with common-sense knowledge or thinking ML solves it. I need to create a structured teaching plan.

  The key challenges are:
  - Students think frame problem = listing facts or common-sense knowledge
  - CS students believe ML has solved it
  - Need to clarify McCarthy & Hayes' original formulation vs Dennett's interpretation
  - Must distinguish frame problem from general AI difficulties

  For dependency structure, the technical foundation must come first. Starting with McCarthy & Hayes avoids Dennett's broader interpretations muddying the waters. The core sequence should be: 
  1. Classical planning assumptions (actions change few things) 
  2. Non-effects problem (tracking what doesn't change) 
  3. Frame problem as representational explosion 
  4. Then introduce Dennett's implications

  The carrying example is ideal because:
  - Simple action with obvious non-effects
  - Easily shows exponential growth of frame axioms
  - More relatable than Dennett's bomb-defusing robot
  - Avoids distraction of "common sense" interpretations

  Top misconceptions to address:
  1. "It's just about common-sense knowledge" - correct when introducing Dennett by contrasting with technical definition
  2. "ML solves this" - address when discussing computational complexity by showing ML doesn't bypass the representational issue
  3. "It's about incomplete knowledge" - preempt by emphasizing the problem persists even with complete knowledge
  4. "It's only for physical actions" - later expand to cognitive implications

  For understanding check, ask how they'd modify a planning system to add a new action. Correct answers focus on cascading frame axioms across all existing actions. Near-miss answers talk about adding more facts or training data.

  Need to explicitly exclude:
  - Proposed solutions (situation calculus variants etc.)
  - Direct debate about cognitive relevance
  - Comparison to other problems like symbol grounding

  This keeps focus on core conceptual understanding. The approach balances technical precision with philosophical implications while actively dismantling predictable misconceptions at strategic points.
answer: |-
  **Dependency Structure** (250 words)  
  The sequence must build from technical foundations to philosophical implications, as misconceptions arise when the problem’s formal core is skipped. Begin with **McCarthy and Hayes (1969)** to define the frame problem as *a computational challenge in classical AI planning*:  
  1. **Actions’ local effects**: Use an example (e.g., moving a block) to show actions change few world properties.  
  2. **Non-effects (Frame Axioms)**: Highlight the need to explicitly state what *doesn’t* change (e.g., "moving block A doesn’t change block B’s color").  
  3. **Combinatorial explosion**: Demonstrate how frame axioms multiply uncontrollably with more actions/properties.  

  *Then* introduce **Dennett’s framing** (1984) as the *epistemological consequence*: why this explosion reveals a deeper issue about "relevance" in reasoning. If McCarthy/Hayes isn’t cemented first, students default to misreading Dennett as describing a "common-sense knowledge deficit." The hinge idea is **non-effects**: if students don’t grasp why *representing stability* (not change) causes explosion, the philosophical leap collapses into vagueness.  

  ---

  **The Carrying Example** (200 words)  
  Use **carrying a coffee cup across a room**. It must:  
  - Involve few intuitive non-effects (e.g., cup color unchanged, walls unmoved, gravity constant).  
  - Lack emotional/pragmatic distractions (unlike Dennett’s bomb-defusing robot, which invites "common-sense" red herrings).  
  - Scale clearly: Adding one property (e.g., cup temperature) forces new frame axioms for all actions (walking, waving, etc.).  

  Justification: Dennett’s robot story conflates the frame problem with pragmatic reasoning (e.g., "should the robot care about a bomb?"). The coffee cup is neutral, focusing purely on *inferential necessity*: even with complete knowledge, tracking stability bloats representation.  

  ---

  **Misconception Map** (300 words)  
  1. **"It’s just listing common-sense facts"**  
     *When:* During Dennett discussion.  
     *Handling:* Preempt by contrasting after McCarthy/Hayes: "The problem isn’t *what* facts to list (knowledge engineering), but how *non-change* forces exponential axioms even if we *have* all facts."  

  2. **"Machine learning solves this"**  
     *When:* After introducing combinatorial explosion.  
     *Handling:* Use as bridge: "ML (e.g., neural nets) *avoids explicit representation*—but does it solve or sidestep? Highlight: ML systems still struggle with systematic reasoning about non-effects (e.g., a robot failing to infer a cup’s contents won’t change while moving). The frame problem targets *symbolic* systems; ML transforms it into a data/robustness issue."  

  3. **"It’s only about incomplete knowledge"**  
     *When:* When discussing relevance.  
     *Handling:* Undercut via example: "Even with perfect knowledge, adding ‘cup temperature’ requires updating frame axioms for *all* actions—this is computational, not epistemological."  

  4. **"It’s irrelevant to modern AI"**  
     *When:* Post-ML discussion.  
     *Handling:* Bridge to cognition: "While workarounds exist (e.g., probabilistic models), the *why* persists: How do *humans* infer stability so efficiently? This links to philosophy of mind."  

  ---

  **Check for Understanding** (150 words)  
  **Task:** *"You’re coding a robot that moves cups. It now tracks cup temperature. How does this affect the system’s rules for actions like ‘rotate’ or ‘step forward’? What’s the formal term for this issue?"*  

  - **Correct:** Identifies adding frame axioms for *every existing action* to preserve temperature stability, naming "frame axiom explosion." Distinguishes from adding effect rules.  
  - **Near-miss:** Focuses only on new *effects* (e.g., "rotate might heat the cup") or general "more data needed." Reveals conflation with knowledge engineering.  

  ---

  **What to Leave Out** (100 words)  
  Openly exclude:  
  - **Technical solutions** (e.g., successor state axioms): "We’re focusing on *why* it’s a problem, not fixes—that’s for advanced AI courses."  
  - **Cognitive science debates** (e.g., Fodor’s modularity): "Today’s goal is diagnosing the problem, not its implications for human cognition—though that’s a great essay topic!"  
  - **Links to other problems** (e.g., symbol grounding): "While related, lumping them together obscures the frame problem’s unique structure."  
  *Phrase positively:* "We’re laser-focusing on the core mechanism so you can spot it anywhere—like identifying a engine flaw before discussing car models."
