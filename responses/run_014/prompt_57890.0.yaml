  Hmm, the core tension here is that expected monetary value fails spectacularly for St. Petersburg by suggesting infinite entry prices, while reality forces finite decisions. The user's variants are clever: (1) switches to healthy life years where utility might not be logarithmic (can't "spend" negative time!), and (2) introduces resale markets which could fundamentally change incentives. 

  I should acknowledge that prospect theory's probability weighting is the odd one out - it's descriptive rather than normative, but deserves inclusion since they mentioned it. The lifetime many-gambles context is crucial though; rules that work for single plays (like capping max loss) may fail when repeated. 

