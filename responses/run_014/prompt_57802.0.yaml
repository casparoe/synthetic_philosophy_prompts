prompt: |-
  So I'm a second-year PhD in computer science doing mostly multi-agent learning stuff, and I've been roped into TAing a philosophy of AI workshop for undergrads next month wich I'm acutally kind of excited about. We just covered the one-shot prisoner's dilemma in class, like 3 candies each if both cooperate, 1 each if both defect, and 5 for the defector and 0 for the sucker if they split, so defecting is dominant if you choose blind, and I tried to explain the program equilibrium idea to a couple friends over dinner, you know the trick where instead of choosing actions directly you each submit a program and the programs get to read each other's source code before deciding, so something like cooperate if and only if the other code does the same thing can become stable and you get mutual cooperation without any repeated play or enforcement. They kind of got it intellectually but it still felt like a math trick to them, not something that changes how you'd actually reason.

  I get an 80-minute slot with about 22 undergrads with no coding background, just a room with whiteboards and index cards and I can bring candy for points, and I want them to live through that shift from defect-defect to cooperate-cooperate because of transparency rather than me just telling them. Could you put together a complete hands-on session plan where they first play a blind version for candy points and then a second version where they have to write down super simple conditional rules on cards and exchange and commit to following them, so the cooperation emerges from what they do before I ever say the fancy name? I need the minute-by-minute flow, exactly how to score it without money, how to run the debrief so each weird moment maps onto the underlying logic of reading code and best-responding to programs instead of actions, plus your best guess at what will get messy on the first run with this crowd and how to rescue it, and a candid bit at the end about what this low-tech card version has to fake about real program equilibrium that I'll need to just explain outright.
reasoning: |-
  We are designing a workshop session for undergraduate students with no coding background, using index cards and candy as incentives. The goal is to have them experience the shift from mutual defection in a one-shot Prisoner's Dilemma (PD) to mutual cooperation via a mechanism that mimics program equilibrium.

  ## Key Concepts to Convey:
  1. **Prisoner's Dilemma (PD)**: The standard payoff matrix and why defection is dominant in a one-shot game without additional mechanisms.
  2. **Program Equilibrium**: The idea that players submit programs (which can read each other's source code) and then the programs choose actions. This allows for strategies that condition behavior on the opponent's strategy, enabling cooperation.

  ## Workshop Structure:
  - **Total Time**: 80 minutes
  - **Participants**: 22 undergraduates (we'll split into pairs for the game)
  - **Materials**: 
    - Index cards (at least 2 per student, more for drafts)
    - Pens/pencils
    - Whiteboard for recording scores and explaining rules
    - Candy for payoffs (e.g., small candies like M&Ms or Skittles)

  ## Session Plan:

  ### Part 1: Introduction and Blind PD (20 minutes)
  1. **Introduction (5 min)**:
     - Welcome and set the stage: "Today we're going to play a simple game that models some real-world situations where cooperation is hard. We'll play two rounds and then discuss."
     - Explain the Prisoner's Dilemma without jargon: "You are paired with another player. Each of you has two choices: Cooperate (C) or Defect (D). The outcomes are:
          - If both Cooperate, both get 3 candies.
          - If both Defect, both get 1 candy.
          - If one Cooperates and the other Defects, the Defector gets 5 candies and the Cooperator gets 0."
     - Draw the payoff matrix on the board.

  2. **Blind PD Game (10 min)**:
     - Pair up the students (11 pairs). 
     - Explain: "You will now play this game once. Without communicating, each of you writes 'C' or 'D' on a blank index card. Then I will collect and reveal the choices and distribute candies accordingly."
     - Hand out one blank index card per student. Give them 1 minute to decide and write down their choice (fold the card so others can't see). Collect, then reveal each pair's choices and hand out candies.

  3. **Debrief Part 1 (5 min)**:
     - Ask: "How many pairs ended up with mutual cooperation? Mutual defection? Mixed?"
     - Discuss why defection is dominant: "If you think the other might cooperate, defecting gets you 5 instead of 3. If you think the other will defect, defecting gets you 1 instead of 0. So regardless, defecting is better for you individually. But collectively, mutual cooperation is better (3 each) than mutual defection (1 each)."

  ### Part 2: Conditional Rules PD (40 minutes)
  1. **Introduce the Conditional Rules (10 min)**:
     - Explain: "Now we are going to change the rules. Instead of choosing an action directly, you are going to write a rule that says what action to take based on what rule the other player writes. You will write your rule on an index card, then exchange cards with your partner. After reading each other's rule, you must follow your own rule to choose an action (C or D). Then we score."
     - Emphasize: "Your rule must be a conditional statement that depends on the other player's rule. For example: 'I will cooperate if the other rule says it will cooperate, otherwise I defect.' But you can write any rule you want, as long as it uses the other rule to decide."
     - Clarify: "When you receive the other player's card, you read it and then use your own rule to decide your action. You must follow your own rule. Write your rule clearly so that the other player can understand it."
     - Give examples on the board:
          - "Rule 1: Cooperate no matter what."
          - "Rule 2: Defect no matter what."
          - "Rule 3: Do whatever the other rule says it will do." (But note: this might lead to a contradiction if both do this? Avoid for now, but if a student writes it, we'll see.)
          - "Rule 4: Cooperate only if the other rule says it will cooperate when I cooperate. Otherwise, defect." (This is like a tit-for-tat in one-shot? But we want to nudge toward the program equilibrium idea.)

     - Important: Encourage simplicity. They can write in plain English.

  2. **Rule Writing and Exchange (10 min)**:
     - Hand out index cards and pens. Give students 5 minutes to write a rule. They can think and draft if needed (provide extra cards for drafts). 
     - Then, within each pair, they exchange cards. Give them 2 minutes to read the other's rule.

  3. **Action Selection and Scoring (10 min)**:
     - After reading the other's rule, each student must use their own rule to determine their action. They write down their action (C or D) on a new card (or on the same card but clearly separated) without showing the other player.
     - Collect the action cards and the rule cards (so we can match rules to actions).
     - Reveal the actions and distribute candies.

  4. **Debrief Part 2 (10 min)**:
     - Ask for results: How many mutual cooperation? Mutual defection? Mixed?
     - Then, focus on how the rules led to the actions. Pick a pair that achieved mutual cooperation and ask to see their rules. 
     - Highlight a rule that says something like: "I will cooperate if the other rule says it will cooperate when I cooperate." (This is the key idea of the program equilibrium: conditional cooperation on the condition that the other is doing the same.)
     - Discuss: "Why did this work? Because by writing such a rule, you are committing to cooperate only if the other does the same. And when both do this, they both cooperate. And if one didn't write such a rule, then the other would defect. So it's stable."

  ### Part 3: Connecting to Program Equilibrium and Wrap-up (20 minutes)
  1. **Explain the Analogy (10 min)**:
     - "What we just did is similar to the idea of program equilibrium. In computer science, we can think of the rules as programs. These programs can read each other's source code (like you read each other's rule) and then output an action. The program that says 'cooperate if the other program is the same as me' (or more generally, if the other program is cooperative in the same way) can lead to mutual cooperation in a one-shot game."
     - Draw the parallel: 
          - The index card rule = program.
          - Exchanging and reading = programs reading each other's source code.
          - Then outputting an action = running the program.
     - Contrast with the blind game: "In the blind game, you couldn't condition on the other's strategy because you didn't know it. Now, by writing rules that see each other, you can condition and achieve cooperation."

  2. **What the Card Version Fakes (5 min)**:
     - In the real program equilibrium, the programs are written in a formal language and can be arbitrarily complex. Our rules were in English and simple.
     - We assumed that the rules are truthfully exchanged and that players follow them. In reality, the program must be faithfully executed by a machine. Here, we relied on the students to follow their own rules (and they might not, but we hope they do for the exercise).
     - In real program equilibrium, we can have programs that are not just conditionals but can have loops, recursion, etc. (But we avoided that for simplicity.)
     - The key point: the card version captures the essence of pre-commitment and mutual inspection, which enables cooperation.

  3. **Q&A and Final Thoughts (5 min)**:
     - Open for questions.
     - Conclude: "In AI, when multiple agents are designed to interact, if they can inspect each other's code (or have access to each other's decision procedures), they can achieve cooperative outcomes even in one-shot interactions. This is a powerful idea that goes beyond repeated games."

  ## Anticipated Issues and Rescues:
  1. **Problem**: Students might not understand how to write a conditional rule.
     - **Rescue**: Provide more examples. Walk around during rule writing and help. Suggest: "Think about what you want to do based on what the other rule says. For example, 'I will cooperate if the other rule says it will cooperate when I cooperate. Otherwise, I defect.'"

  2. **Problem**: A pair might have rules that are ambiguous or contradictory, leading to confusion in action selection.
     - **Rescue**: Before they write the action, have them show you the rules and clarify. If a rule is impossible to follow (e.g., circular dependency), ask the student to rewrite (but in the interest of time, maybe just help interpret). In the debrief, use it as a learning moment: "In real programs, we must avoid infinite loops and contradictions."

  3. **Problem**: Some students might not follow their own rule when choosing an action (cheat).
     - **Rescue**: Emphasize the importance of honesty for the exercise. If you catch it, you can gently remind. In scoring, if you notice an action that doesn't match the rule, you can point it out and ask them to redo (but don't make it a big issue). The point is the idea, not strict enforcement.

  4. **Problem**: The conditional rules might lead to a lot of mutual defection if students write uncooperative rules.
     - **Rescue**: That's okay! In the debrief, you can discuss why they wrote such rules and then show an example of a cooperative rule that would have worked. Also, note that in the program equilibrium, the cooperative strategy is only stable if both do it. If one writes a defective rule, then the other conditional cooperator will defect, so it's still a best response.

  5. **Problem**: Time management.
     - **Rescue**: Keep strict time limits. Have a timer. If rule writing is taking too long, push them to write something simple. For the debrief, focus on a few illustrative examples.

  ## Materials Checklist:
  - Index cards: at least 44 (22 for blind PD, 22 for rules, plus extras for actions and drafts)
  - Pens: 22+
  - Whiteboard markers
  - Candy: enough for 22 students to get at least 1 candy (for mutual defection) and up to 5 per game per student. So about 5-10 candies per student? (Two rounds: blind and conditional, so max 5+5=10 per student.) Bring plenty.

  This plan should give the students an experiential understanding of how transparency and conditional rules can shift the equilibrium in a one-shot PD.
answer: |-
  Below is a complete 80-minute session plan designed to make the program equilibrium concept visceral for undergrads without coding. It uses index cards, candy incentives, and structured debriefs to mirror the "source code inspection" dynamic. The goal is to have students *discover* cooperation through the card exchange—**before** naming program equilibrium.

  ---

  ### **Session Overview**
  - **Key Insight:** Shift from "What should *I* do?" to "What will my *rule* do when it sees theirs?"
  - **Mechanics:**  
    - **Round 1:** Blind one-shot PD (defect/defect expected).  
    - **Round 2:** Rule-based PD (students write conditional rules on cards, exchange, then choose actions).  
  - **Payoffs:** Candy (bring ~200 small candies, e.g., M&Ms):  
    |               | **They Cooperate** | **They Defect** |  
    |---------------|-------------------|----------------|  
    | **You Cooperate** | 3 candies each    | You: 0, They: 5 |  
    | **You Defect**    | You: 5, They: 0   | 1 candy each   |  

  ---

  ### **Minute-by-Minute Flow**  
  **Total: 80 minutes**  

  #### **Part 1: Blind PD & Defection Trap (20 min)**  
  1. **Intro & Rules (5 min):**  
     - Explain PD using candy payoffs on the board.  
     - Emphasize: *"You play ONCE. No talking. Write ‘C’ or ‘D’ secretly."*  
     - Pair students (11 pairs). Hand out index cards.  

  2. **Play & Score (5 min):**  
     - Students write C/D, fold cards, and hand to you.  
     - Reveal pairs publicly. Distribute candy. *Expect mostly mutual defection (1 candy each).*  

  3. **Debrief (10 min):**  
     - Ask: *"Why did most defect? What would you do differently?"*  
     - Highlight:  
       - Dominant strategy: Defect → better outcome *regardless* of what others do.  
       - Dilemma: Mutual cooperation (3) > mutual defection (1), but no way to trust.  

  #### **Part 2: Rule-Based PD & Emergent Cooperation (45 min)**  
  1. **Introduce Rule Writing (10 min):**  
     - *Frame:* *"Now you’ll write RULES instead of actions. Your rule must decide C/D after seeing their rule."*  
     - Give simple examples on the board:  
       - *"Always C"*  
       - *"Do the opposite of what they do"*  
       - *"C if their rule says ‘always C’; else D"*  
     - **Critical constraint:** *"Your rule CANNOT say ‘I do X if they do Y’—it must commit to action based ONLY on their WRITTEN RULE, not their future action."*  
     - Hand out new index cards and pens.  

  2. **Write & Exchange Rules (10 min):**  
     - Students draft rules (3 min). Walk around troubleshooting.  
     - **Pair swap:** Partners exchange rule cards and read them. *No talking allowed.*  
     - Students write their action (C/D) *based on their OWN rule* after reading the opponent’s rule.  

  3. **Reveal & Score (5 min):**  
     - Collect actions. Announce results publicly.  
     - *Expect ~50–80% mutual cooperation.* Distribute candy.  

  4. **Deep Debrief (20 min):**  
     - **Step 1: Surface Observations**  
       - Ask: *"How many cooperated this time? Why?"*  
     - **Step 2: Dissect Rules** (Use whiteboard)  
       - Pick 2–3 pairs with mutual cooperation. Have them read rules aloud.  
       - Ask: *"Why did your rule work? What if you’d faced a different rule?"*  
       - **Key Q:** *"Could you defect and get 5 candies? Why didn’t you?"* → *"My rule forced me to C once I saw theirs."*  
     - **Step 3: Map to Program Logic**  
       - Draw parallels:  
         | **Card Activity**       | **Program Equilibrium**          |  
         |--------------------------|----------------------------------|  
         | Writing a rule           | Submitting source code           |  
         | Exchanging cards         | Programs reading each other      |  
         | Committing to follow rule| Code execution                   |  
       - Emphasize: *"You locked in your logic BEFORE seeing their action—just like code. Your rule ‘best-responded’ to their *program*, not their *move*."*  

  #### **Part 3: Takeaways & Caveats (15 min)**  
  1. **Name the Concept (5 min):**  
     - *"What you did is called PROGRAM EQUILIBRIUM. By inspecting each other’s ‘source code’ (rules), you made mutual cooperation stable—even when defecting seems dominant!"*  
     - Contrast with Round 1: *"Blind play → defect. Rule transparency → cooperate."*  

  2. **What We Faked (5 min):**  
     - **No real code execution:** Students *chose* to follow rules; programs *must* execute.  
     - **No complexity:** Real programs can simulate opponents (e.g., *"C if their code is identical to mine"*), but cards can’t handle recursion/infinite loops.  
     - **No deception:** Rules were honest; real programs could lie (but we ignore this for simplicity).  

  3. **Final Discussion (5 min):**  
     - *"When might this apply? AI systems that inspect each other’s code, trade agreements with verified enforcement, etc."*  
     - Hand out extra candy for participation!  

  ---

  ### **Anticipated Messiness & Rescues**  
  1. **Problem:** Students write vague/unenforceable rules (e.g., *"C if they’re nice"*).  
     - **Rescue:** Pre-empt it. Give clear examples. During drafting, reject ambiguous rules: *"Must be a yes/no condition based ONLY on their written text."*  

  2. **Problem:** Cheating (ignoring their own rule to defect).  
     - **Rescue:**  
       - Pre-game: *"If you violate your rule, you get 0 candy AND I’ll shame you (gently)."*  
       - If caught: *"In real program equilibrium, code can’t cheat—this is why we need enforcement!"* → Turn it into a lesson.  

  3. **Problem:** Analysis paralysis during rule-writing.  
     - **Rescue:** Set a strict 3-minute timer. Offer starter templates:  
       - *"C if their rule contains ‘C’."*  
       - *"D unless their rule says ‘always C’."*  

  4. **Problem:** Confusion in debrief about "best-responding to code."  
     - **Rescue:** Use a concrete example:  
       - *"Imagine two rules: ‘C if they write this same sentence.’ When they see each other, both conditions are true → mutual C. If one changes their rule, both D. No incentive to change!"*  

  ---

  ### **Why This Works**  
  - **Experiential learning:** Students *feel* the shift from mutual defection to cooperation via transparency.  
  - **Low-tech abstraction:** Cards force pre-commitment and "source code inspection" without code.  
  - **Debrief scaffolding:** Each step connects gameplay to theory (rules → programs, card exchange → code reading).  

  This mirrors the core of program equilibrium: **Transforming the game from choosing actions to designing mutually observable strategies.** By the time you name it, they’ll have already lived it.
