prompt: |-
  I've been digging into the color phi literature and the Orwellian vs. Stalinesque distinction for how experience gets revised after the fact, and I keep hitting a wall on which open questions in the timing-of-experience debate actually matter. If you were trying to figure out where the real work is, which unresolved questions would you say are the crux -- like, is there even a determinate "time of consciousness" to be revised, or does the whole Orwellian/Stalinesque framing smuggle in a theater that the multiple-drafts side is trying to dissolve? And do the Libet-style results and the cutaneous rabbit actually constrain the debate, or are they too methodologically muddled to bear weight? I'm not after a survey of the positions, I want you to pick the two or three questions that most of the rest hangs on and defend the ordering -- why one is upstream of the others, which are tractable with current methods versus which just need a conceptual move, and what result in the next few years would flip the ranking.
