prompt: |-
  Me and my flatmate Dan got into it last night about laws of nature and it ran until about 2am, and now I honestly can't tell whether I lost the argument or he just outlasted me. He's a Humean: laws are just the axioms of the best systematization of the whole mosaic of facts — the shortest and strongest true description of everything there is — no governing, no necessary connections between distinct existences, laws are contingent, and the whole question is just which regularities earn their keep in the system. I'm the other guy. I want laws to be what makes things happen, what the regularities hold *in virtue of*. Two things he said are still rattling round my head. One, every time I pressed him he'd say "thats a demand on a theory, not a fact about the world," and I'm now worried he's right that I've been smuggling my conclusions into my own criteria. Two, he asked me to name one thing a law does that a regularity doesn't, I said it supports counterfactuals, and he said fine — so why? Either laws support counterfactuals because of something over and above the regularity, in which case what, or else it's brute, in which case I've got magic. I don't have an answer to that.

  So before I read one more thing on this, I want the spec written out. Give me the desiderata for a theory of lawhood: what does any adequate account have to deliver, with the case behind each requirement. I want the actual cases in there — the second law, statistical, violated all the time, still called a law; the Pauli exclusion principle, which feels like a constraint on what's possible rather than a force shoving anything; the ideal gas law, false of every gas that has ever existed and true only ceteris paribus; Hardy-Weinberg equilibrium, a null model where nothing's happening so nothing changes, and I genuinely can't tell whether that's a law or a bit of maths wearing a lab coat; the "all gold spheres are less than a mile across" sort of thing and why it feels different from a real law even if it's true and even if it would be an axiom of some tidy system; conservation laws, which seem to fall out of symmetries rather than being laid down separately; Newton's laws, which were laws, and then our best theory changed, and now they're... what exactly, when they're true of nothing? — plus the counterfactual-support requirement and the nagging intuition that laws govern.

  Then the part I actually care about: say which of these are genuine requirements and which are just Humean or anti-Humean prejudice in disguise, and — this is the bit I'm really after — tell me which subset of them can't all be had at once. My suspicion is that "laws are contingent," "laws govern," "laws explain their instances," and "no necessary connections" is an over-subscribed menu, and if so I'd rather know now than after another two years of reading. Also Dan floated something I didn't follow: that the gold-spheres thing isn't a law because the generalization only looks good in a gerrymandered vocabulary, and that lawhood is really about robustness across ways of describing the world. Is that a real criterion or is he making it up on the spot? A quick line on how Humeanism and the anti-Humean options (dispositional essences, primitivism about laws, whatever else) fare against the list would be nice, but keep the weight on the criteria — I'll do the scoring myself.
reasoning: |-
  Okay, the user is deep into a philosophical debate with their flatmate Dan about the nature of laws. They had a long argument where Dan is a Humean, believing laws are just the best summaries of regularities, while the user thinks laws are what make things happen. The user is now questioning if they lost the argument and wants a clear set of criteria to evaluate any theory of laws. They provided several examples and specific concerns, like counterfactuals, governing intuition, and whether some criteria are just biases.

  First, I need to list all the desiderata they mentioned. The examples given are key: the second law of thermodynamics (violated but still a law), Pauli exclusion principle (constraint rather than force), ideal gas law (ceteris paribus), Hardy-Weinberg (null model), gold spheres (accidental vs. lawful), conservation laws (from symmetries), and Newton's laws (once considered laws but now outdated). Also, counterfactual support and the governing intuition.

  The user wants to know which of these are genuine requirements versus biases. They suspect that "laws are contingent," "govern," "explain instances," and "no necessary connections" can't all coexist. Dan's point about vocabulary gerrymandering for the gold spheres example needs addressing—is robustness across descriptions a real criterion?

  Breaking down each desideratum: necessity vs. contingency, governing role vs. being governed, explanatory priority, counterfactual support, contingency of laws, no necessary connections, and the examples. Then assess which are must-haves and which might be optional. For instance, explanatory priority might be essential, while governing could be an illusion. The tension between governing, necessary connections, and contingency is real—can't have all three without contradiction.

  Humeanism handles contingency and no necessary connections but struggles with counterfactuals and governing. Anti-Humean views like dispositional essentialism or primitivism get governing and explanation but face issues with necessity and contingency. The user's deeper need is clarity on valid criteria to avoid biased arguments and identify where compromises are necessary. They might also want to resolve their intuition about laws making things happen versus Dan's regularity view without falling into magical thinking.
answer: |-
  Here's the spec you requested: a breakdown of the core desiderata for any theory of lawhood, grounded in your cases, followed by an analysis of genuine requirements, potential biases, tensions, and a quick glance at how the main camps fare.

  **Desiderata for a Theory of Lawhood (With Case-Based Justification):**

  1.  **Necessity (or At Least Non-Accidentality):** Laws should not be mere cosmic coincidences; they should hold *necessarily* (in some sense) or at least with a robustness that distinguishes them from accidental regularities.
      *   *Case Justification:* **Gold Spheres:** The generalization "All gold spheres are less than a mile across" (assuming it's true) *feels* accidental. It could have been otherwise without changing the fundamental nature of gold or space. Contrast this with **Pauli Exclusion Principle (PEP)**. PEP doesn't just happen to be true; it seems *impossible* for two fermions to occupy the same quantum state. It constrains what *can* happen.

  2.  **Counterfactual Support:** Laws should support true counterfactual claims about what *would* happen under non-actual circumstances.
      *   *Case Justification:* This is central to scientific practice. "If I *were* to drop this fragile glass *right now*, it *would* shatter" relies on the law of gravity and material properties. Humean challenge: *Why* do they support them? Is it brute? Dan's question hits here.

  3.  **Explanatory Priority:** Laws should *explain* the regularities and particular events, not merely describe or summarize them. They are what the regularities hold *in virtue of*.
      *   *Case Justification:* **Second Law of Thermodynamics:** Why does entropy tend to increase? We explain specific instances of mixing or heat flow *because* they are manifestations of the Second Law. We don't explain the Second Law *by* citing all the instances of entropy increase. **Newton's Laws:** When they were accepted, planetary motion was explained *by* Newton's Laws + initial conditions, not vice-versa.

  4.  **Contingency:** Laws could have been otherwise. The fundamental structure of the universe isn't logically or metaphysically necessary.
      *   *Case Justification:* **Newton's Laws -> Relativity/QM:** The historical shift shows our best candidates for laws changed dramatically. This suggests the actual laws are contingent features of *this* universe. Most physicists/philosophers accept that different fundamental laws could govern other possible universes.

  5.  **Governance / Modal Oomph / "Makes Things Happen":** Laws actively constrain, produce, or guide the behavior of things in the world. They aren't passive patterns.
      *   *Case Justification:* This is your core intuition. **PEP:** It actively *prevents* electrons from crowding into the same state, shaping atomic structure. **Conservation Laws:** They seem to *dictate* that certain quantities *must* remain constant, acting as constraints on interactions. **Second Law:** It feels like a fundamental directive about the direction of processes.

  6.  **Systematicity / Integration:** Laws form a coherent, interconnected system, often derivable from more fundamental principles or symmetries.
      *   *Case Justification:* **Conservation Laws (Energy, Momentum):** These fall directly out of fundamental symmetries of spacetime (via Noether's theorem). They aren't brute, independent facts but are deeply integrated into the fundamental theoretical structure. A good systematization should reflect this interconnectedness.

  7.  **Ceteris Paribus Character / Resilience:** Laws often hold only "all else being equal" and can be masked or violated locally, but retain their status as fundamental constraints.
      *   *Case Justification:* **Ideal Gas Law (PV=nRT):** No real gas perfectly obeys it (intermolecular forces, quantum effects). Yet, it's a *law* because it describes the fundamental *tendency* arising from kinetic theory, holding perfectly under idealized conditions and approximately otherwise. **Second Law:** Statistical fluctuations lead to local, temporary decreases in entropy (violations), but the law remains fundamental.

  8.  **Distinguishing Laws from Mere Mathematical Truths / Null Models:** Laws should be substantive claims about the physical world, not just logical or mathematical tautologies.
      *   *Case Justification:* **Hardy-Weinberg Equilibrium:** This describes genotype frequencies *if* no evolutionary forces (mutation, selection, drift, migration) act. It's a mathematical consequence of Mendelian inheritance under stasis. Is it a *law of nature* or a *mathematical baseline* against which real evolutionary change is measured? It feels like the latter. A theory needs to capture why PEP is more than just maths.

  9.  **No Brute Necessary Connections (Humean Intuition):** There are no metaphysically necessary connections between distinct existences. Things just happen to be regular, and that's the end of it.
      *   *Case Justification:* **Hume's Challenge:** Why *must* cause A be followed by effect B? We observe constant conjunction, but positing a necessary "glue" linking distinct events seems ungrounded in pure observation and potentially mysterious. Dan's whole framework rests here.

  10. **Robustness Across Descriptions (Dan's Point):** Lawhood shouldn't depend on an arbitrary or gerrymandered way of describing the world. Genuine laws should manifest in regularities that hold across different conceptual frameworks or vocabularies.
      *   *Case Justification:* **Gold Spheres:** The regularity "all gold spheres are <1 mile" might be an axiom in a system *specifically designed* using the predicates "gold," "sphere," and "diameter <1 mile." But change the predicates (e.g., describe things in terms of quark configurations and spatial configurations) and this regularity might vanish or become incredibly complex. In contrast, **F=ma** or **PEP** seem to emerge as robust regularities across vastly different ways of describing physical systems. This *is* a real criterion linked to systematicity and non-accidentality. It prevents "gruesome" predicates from defining laws.

  **Analysis: Genuine Requirements vs. Prejudice & Tensions**

  *   **Genuine Requirements (Minimal Core):** Any adequate theory *must* account for:
      *   **Counterfactual Support** (Essential for science and explanation).
      *   **Explanatory Priority** (Core to the scientific role of laws).
      *   **Systematicity / Integration** (Reflects the interconnected nature of scientific theories).
      *   **Ceteris Paribus Character / Resilience** (Captures how laws function despite local failures).
      *   **Distinguishing Laws from Maths / Null Models** (Laws must be *about* the physical world).
      *   **Robustness Across Descriptions** (Prevents trivialization and captures objectivity).

  *   **Contested Ground (Where Intuitions/Prejudices Clash):** These are central to the Humean/Anti-Humean divide:
      *   **Necessity/Non-Accidentality:** The Humean *denies* metaphysical necessity but offers systematicity/robustness as a substitute for non-accidentality. The Anti-Humean insists on a stronger modal force. *Genuine Requirement?* A theory *must* explain the *difference* between lawlike and accidental regularities (Gold Spheres vs. PEP). *How* it does this (modal force vs. best system) is the core battleground.
      *   **Governance / Modal Oomph:** This is the quintessential Anti-Humean intuition. The Humean argues this is an anthropomorphic projection or a disguised demand for explanation/necessity already handled (in their view) by systematicity/counterfactuals. *Genuine Requirement?* Arguably *not* a primitive requirement, but a theory *must* explain *why* the *intuition* of governance arises (e.g., from explanatory priority + necessity, or from the role in the best system).
      *   **Contingency:** Both sides generally agree laws are contingent (non-logically-necessary). The deep disagreement is over whether they are *brute* contingent regularities (Humean) or contingent *but necessary* *if* the fundamental entities/properties exist (some Anti-Humean views like Dispositional Essentialism).
      *   **No Brute Necessary Connections:** The bedrock Humean principle. Anti-Humeans explicitly reject it, positing necessary connections (powers, governing relations). *Genuine Requirement?* This is fundamentally a metaphysical commitment, not a neutral demand on a theory *of laws*. It's a presupposition about the *whole* metaphysical landscape.

  *   **The Inescapable Tension (You Suspected Correctly):** The subset **"Laws Govern"**, **"Laws Explain Their Instances"**, **"Laws are Contingent"**, and **"No Necessary Connections between Distinct Existences"** **is logically inconsistent**. Here's why:
      1.  **Governance** implies laws actively *do* something to particulars (distinct existences).
      2.  **Explaining Instances** via governance implies the law is *why* the particular behaves as it does – there's a connection.
      3.  If this connection is **necessary** (the law *must* govern this particular in this way), it violates **No Necessary Connections**.
      4.  If the connection is **contingent**, then *why* does *this* law govern *this* particular? What grounds *this* contingent connection? Appealing to another law leads to regress. Making it brute seems like admitting a necessary connection *anyway* or positing unexplained "magic" (Dan's charge). **Contingency** of the laws themselves doesn't resolve the tension between governance and the ban on necessary connections *between distinct existences* (the law and the particular).

  *   **Dan's Robustness Criterion:** This is **absolutely a real and important criterion**, not an ad-hoc invention. It's closely tied to systematicity and non-accidentality. A law should be identifiable through its regularities regardless of how we *choose* to carve up the world (within reason). Gruesome predicates generating "spurious laws" are a well-known problem for simple regularity views; robustness is a key Humean tool (via the "best system" aiming for simplicity and strength in a natural vocabulary) to avoid it.

  **Quick Glance at Theories vs. Desiderata:**

  *   **Humeanism (Best System Account):**
      *   *Aces:* Contingency, No Necessary Connections, Systematicity/Integration, Robustness (by design), Ceteris Paribus (can be handled via probabilistic laws/system strength).
      *   *Struggles With:* Governance/Modal Oomph (explicitly denies it), Necessity/Non-Accidentality (replaces with systematicity), Explanatory Priority (laws summarize, don't ground), Counterfactuals (often seen as a major challenge - why *should* the best system support them?).
      *   *Gold Spheres:* Handles via vocabulary naturalness/robustness – a gruesome predicate won't yield a simple/strong axiom.

  *   **Primitivism (Laws as Fundamental Governing Relations):**
      *   *Aces:* Governance/Modal Oomph, Explanatory Priority, Counterfactual Support (grounded in governance), Necessity/Non-Accidentality.
      *   *Struggles With:* No Necessary Connections (explicitly violates it), Contingency (laws are brute governing relations - why *these*?), Systematicity (laws might be brute pluralities), Ceteris Paribus (how do fundamental governing relations get masked?).
      *   *Gold Spheres:* Easily rules it non-law – no governing relation corresponds to it.

  *   **Dispositional Essentialism (Laws supervene on/discovered from powers of fundamental entities):**
      *   *Aces:* Explanatory Priority (behavior stems from essences), Counterfactual Support (grounded in essences), Necessity/Non-Accidentality (powers are essential), Governance (powers are active), Ceteris Paribus (masking/interference of powers).
      *   *Struggles With:* No Necessary Connections (arguably violates – powers involve necessary connections), Contingency (fundamental properties/powers might be contingent brutes), Systematicity/Conservation Laws (can powers explain deep symmetries?).
      *   *Gold Spheres:* Easily rules it non-law – no essential power of gold necessitates small spheres.

  **Conclusion:**

  Your core suspicion is correct: The quartet of Governance, Explanatory Priority, Contingency, and No Necessary Connections is over-subscribed. Reconciling Governance/Explanatory Priority with Contingency *requires* some form of necessary connection between laws/grounds and the behavior of particulars, violating the strict Humean principle. Dan's Robustness criterion is legitimate. The genuine, minimally contested requirements are Counterfactual Support, Explanatory Priority, Systematicity, Ceteris Paribus Resilience, distinguishing Laws from Maths, and Robustness. The battle is fought over how Necessity/Non-Accidentality is secured and whether Governance is real or illusory, ultimately resting on the acceptance or rejection of necessary connections. Your next reading should focus squarely on the arguments *for* and *against* necessary connections and the various strategies for grounding counterfactuals. Good luck against Dan!
