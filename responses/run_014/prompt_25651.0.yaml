answer: |-
  ### Philosophy of Mind Decision Tree: The Extended Mind Debate

  This decision tree starts with the famous Otto and Inga case by Clark & Chalmers. Answer intuitively—no jargon needed! Follow your answers to discover your position in the extended mind debate. Positions marked ★ are actively defended; others are unoccupied (with explanations).

  ---

  #### **Q1: Otto has Alzheimer's and uses a notebook to store information. Inga has normal biological memory. When they both "remember" that MoMA is on 53rd St., is Otto's notebook-consulting the *same kind of cognitive process* as Inga's brain-recall?**  
  - **Yes** → Go to Q2  
  - **No** → Go to Q3  

  ---

  #### **Q2: Suppose Otto’s notebook is *sometimes locked in a drawer* for hours. When he consults it while it’s accessible, is it still the same kind of cognitive process as Inga’s recall?**  
  *(For "Yes" to Q1)*  
  - **Yes** → **Leaf 1: Radical Extended Cognition**  
    - *Unoccupied*: Logically possible but requires cognition to extend *without* constant access. Defenders like Clark & Chalmers argue constant availability is essential for functional equivalence to biological memory.  
  - **No** → Go to Q4  

  ---

  #### **Q4: When someone uses a *calculator* (always available, trusted, automatic) for math, is the calculator part of their cognitive process?**  
  *(Follows "No" to Q2)*  
  - **Yes** → **Leaf 2: Liberal Extended Cognition**  
    - *Unoccupied*: Logically possible but unpopular. Clark & Chalmers focus on *information storage* (like memory), not computation. No major theorists defend extending cognition to tools like calculators.  
  - **No** → **★ Leaf 3: Extended Mind (Clark & Chalmers)**  
    - Cognition extends to external resources *only* when they function like biological processes (constant, automatic, trusted). Otto’s notebook counts; calculators don’t.  

  ---

  #### **Q3: When a *skilled dancer* improvises, is the control of her limbs/body part of her cognitive process (beyond just brain activity)?**  
  *(For "No" to Q1)*  
  - **No** → **Leaf 4: Brain-Bound Internalism**  
    - *Unoccupied*: Logically possible but rare. Most theorists accept the body as part of cognition (e.g., motor control). Defended only in fringe positions.  
  - **Yes** → Go to Q5  

  ---

  #### **Q5: When a person uses a *whiteboard* to solve a math problem (sketching, erasing, revising), is the whiteboard part of their cognitive process?**  
  *(Follows "Yes" to Q3)*  
  - **Yes** → **★ Leaf 5: Enactive/Sensorimotor View**  
    - Cognition emerges from dynamic sensorimotor engagement with the environment (e.g., O’Regan, Noë). The whiteboard isn’t just a tool—it’s co-constitutive of the thinking process.  
  - **No** → Go to Q6  

  ---

  #### **Q6: Even if the whiteboard isn’t part of cognition, is it *crucial* for enabling/shaping the problem-solving?**  
  *(Follows "No" to Q5)*  
  - **Yes** → **★ Leaf 6: Embedded Cognition (Rupert)**  
    - Cognitive processes depend deeply on environmental scaffolds, but cognition itself remains "in the head." The whiteboard is a tool, not part of the mind.  
  - **No** → **★ Leaf 7: Organism-Centered Internalism (Adams & Aizawa)**  
    - Cognition is strictly confined to the organism (brain + body) due to unique properties like "intrinsic content." External tools are causal supports, not cognitive.  

  ---

  ### Summary of Positions
  | Leaf | Position | Key Defenders | Status |
  |------|----------|---------------|--------|
  | 1 | Radical Extended Cognition | *None* | Unoccupied (incoherent: requires extension without constant access) |
  | 2 | Liberal Extended Cognition | *None* | Unoccupied (unpopular: overextends to tools like calculators) |
  | 3 | **Extended Mind** | Clark & Chalmers | ★ Defended |
  | 4 | Brain-Bound Internalism | *None* | Unoccupied (rare: body-involvement is widely accepted) |
  | 5 | **Enactive/Sensorimotor** | Noë, O’Regan | ★ Defended |
  | 6 | **Embedded Cognition** | Rupert | ★ Defended |
  | 7 | **Organism-Centered Internalism** | Adams & Aizawa | ★ Defended |

  ---

  ### Key Notes
  - **Distinction Limitations**:  
    - The tree *cannot perfectly separate* **Embedded Cognition (Leaf 6)** from **Organism-Centered Internalism (Leaf 7)**. Both reject extended cognition but emphasize environment-dependence differently. Case-based questions struggle to capture Rupert’s focus on "cognitive practices" vs. Adams & Aizawa’s "mark of the cognitive."  
    - **Enactive (Leaf 5)** and **Extended Mind (Leaf 3)** may overlap in practice. Enactive theorists stress *dynamic interaction*, while Extended Mind focuses on *functional equivalence*.  

  - **Unoccupied Positions**:  
    - **Radical Extended Cognition (Leaf 1)**: Incoherent to defenders—violates functional parity with biology.  
    - **Liberal Extended Cognition (Leaf 2)**: Unpopular; collapses cognition into mere tool use.  
    - **Brain-Bound Internalism (Leaf 4)**: Rare; ignores embodied cognition (e.g., gestures, muscle memory).  

  Use this tree to spark debate! Positions are more nuanced in the literature—this is a starting point.
