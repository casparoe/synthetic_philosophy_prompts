prompt: |-
  I sit on the animal welfare committee at a mid-sized public aquarium-and-science-center. Besides signing off on husbandry standards we maintain the collection's classification list, which sorts every holding into one of three statuses: **subject** (gets an individual plan — keepers offer choices, refusals get logged as information, and nothing gets split, transferred, or culled without coming back to us), **colony subject** (no per-animal plans, but the group as a whole is one subject, so dividing or transferring it still needs our sign-off), or **husbandry only** (standard protocols, staff handle and propagate freely). The list is supposed to track whether there's actually a somebody in there whose preferences the keepers have to consult, or whether the thing is fully handled by water chemistry, physiology, and species-typical behavior. We've never written that criterion down properly, which is now my problem.

  Our precedents, with the reasons recorded in the minutes (paraphrasing, roughly):

  1. **Common octopus** — subject. Keepers' predictions of what it would do next only started working once they wrote their notes in terms of what it seemed to want and what it seemed to think was inside each jar; the old protocol built on species-typical foraging had failed.
  2. **Cuttlefish** — subject. Switched hunting approach mid-session after a failed attempt; staff couldn't get that out of any repertoire sheet.
  3. **Ochre sea star** — husbandry only. The aquarist predicts it perfectly well as "moves up the odor gradient toward the mussel bed," and nothing more was needed.
  4. **Reef-building coral colony** — husbandry only. Everything the colony does tracks the water-chemistry log; the spreadsheet was judged sufficient.
  5. **Venus flytrap** — husbandry only. Education was told the signage may not say the plant "decides" when to close; approved wording referred to trigger hairs and pressure changes in the cells — even after one member pointed out that a trap only fires if a hair is touched twice in quick succession, which arguably is the plant keeping a short record of what's happened to it.
  6. **Honeybee hive, pollinator house** — colony subject. No individual bee gets a plan, because there's nothing a keeper could offer that one bee would take or refuse; but the hive is one subject, so requeening, splitting, or transferring comes to us. The minutes accepted the beekeeper's phrase "it doesn't want to swarm this year" as tracking something real.
  7. **The reptile house climate controller** ("the HVAC brain") — instrument, husbandry only; we classified it on the same list for consistency. The minutes explicitly note that the technicians cannot troubleshoot it without saying "it thinks the room is too damp," and that the committee did not treat that as decisive.

  New case, and it's on next Tuesday's agenda with two requests that collide. The invertebrate house keeps a *Physarum polycephalum* culture, the yellow slime mold, roughly dinner-plate sized, growing on oat flakes. (a) Education wants to cut it into about forty fragments for school outreach kits — each fragment grows into a full plasmodium within days — and to put it on a display panel billed as an organism that "decides where to go" and "remembers where it's been." (b) A keeper has filed an objection asking that the culture be classified as a subject with its own plan. Her reasons: the exhibit runs a weekly twelve-hour chill cycle, and on the two occasions we skipped the chill the plasmodium still slowed and bunched up around the time the chill would have hit; it routes around a patch of agar where it previously met a bitter repellent even when nothing is there now; and when she offers two food sources at different distances it trades quality off against distance in a way she says she can only predict by writing "it expects the far one to be the better one." The curator's counter: it's a single giant cell with no nervous system, the whole show is oscillating tubules and cytoplasmic streaming, there's a mechanistic model of the chill response she's confident in, the anticipation fades after a few cycles without reinforcement which is exactly what entrainment looks like, and if a keeper can make forty new individuals with a scalpel there is no single somebody left to consult.

  Whatever we rule also governs the *Caulerpa* tank — also one enormous cell, also propagated by cutting — and it sets the pattern for the planarian regeneration touch-tank going in this spring. Half the committee wants "husbandry only, and strike 'decides' from the signage"; the other half says the hive precedent commits us to at least colony-subject status for anything we've accepted intentional-sounding descriptions of.

  So: what should we decide if we want to be consistent with ourselves? Which of the seven is the closest analog — I keep flip-flopping between the hive and the flytrap, and my colleague insists it's the sea star. If our track record genuinely underdetermines this, say what principle we'd be adopting with each of the available choices, including the middle statuses. And name the next holding we should decide — something realistic for a place like ours — that would actually separate the rules that all fit these seven precedents.

  Give me your reasoning in prose first (whatever length it needs), then a JSON object exactly like this:

  ```json
  {
    "verdict": "subject | colony_subject | husbandry_only | split_status",
    "verdict_reason": "max two sentences; if split_status, say what gets which status",
    "signage_ruling": "what the display panel may and may not say",
    "fragmentation_ruling": "what happens to the forty outreach kits",
    "candidate_rules": [
      {
        "name": "short label",
        "rule": "one sentence, stated so it could be applied to a new holding",
        "predicts_for_slime_mold": "subject | colony_subject | husbandry_only",
        "precedents_it_fits": "numbers 1-7",
        "precedent_it_strains": "number plus one clause on why",
        "principle_we_would_adopt": "what committing to this rule says about what our list is really tracking"
      }
    ],
    "closest_analog": {
      "precedent": "number and holding",
      "why_closest": "one or two sentences",
      "biggest_disanalogy": "one sentence"
    },
    "underdetermination": "does the track record settle it; if not, which specific disputed fact about the culture would settle it and how we could check it",
    "tiebreaker_case": {
      "description": "the next holding to bring to committee",
      "rules_it_separates": "by name",
      "predicted_verdicts": "what each candidate rule would say about it"
    }
  }
  ```

  At least four entries in candidate_rules, and at least one of them has to come out in favor of subject status — otherwise you haven't found the rules that actually fit our minutes.
reasoning: |-
  We are given several precedents and a new case involving the slime mold. The precedents are:

  1. Common octopus: subject because keepers had to think in terms of the octopus's wants and beliefs.
  2. Cuttlefish: subject because it changed hunting tactics in a way not predicted by species-typical behavior.
  3. Ochre sea star: husbandry only because its behavior is fully predictable by environmental gradients.
  4. Reef-building coral: husbandry only because its behavior is fully explained by water chemistry.
  5. Venus flytrap: husbandry only despite a simple memory mechanism (two touches required); education was told not to say it "decides".
  6. Honeybee hive: colony subject because the hive as a whole can be described intentionally (e.g., "it doesn't want to swarm"), but individual bees are not subjects.
  7. Reptile house HVAC: husbandry only (instrument) because even though technicians use intentional language ("it thinks"), that was not considered decisive.

  The new case: *Physarum polycephalum* (slime mold). It's a single giant cell without a nervous system. It exhibits behaviors that some interpret as anticipation (slowing down at the time of the usual chill cycle even when skipped) and memory (avoiding a place where it previously encountered a repellent). The keeper argues that to predict its choices (e.g., between food sources at different distances), she must use intentional language ("it expects"). The curator argues that the behavior is mechanistic and can be explained by entrainment and that it can be fragmented without harm (each fragment regenerates).

  The committee is split: one half wants husbandry only and to remove "decides" from signage; the other half argues that the bee precedent (colony subject) applies because intentional descriptions are used.

  We need to decide consistently.

  ## Analysis

  ### Key Factors from Precedents
  - The committee seems to be looking for evidence of **intentionality** or the need to use **intentional language** (beliefs, desires) to predict and explain behavior. This was critical for the octopus and cuttlefish (subject status) and the hive (colony subject).
  - However, the HVAC case shows that intentional language alone is not sufficient (it was classified as husbandry only). The committee must look beyond mere language to the underlying reality.
  - The sea star, coral, and flytrap were classified as husbandry only because their behavior was fully explainable by simple environmental responses (gradients, chemistry, mechanical triggers) without needing to attribute internal states.
  - The flytrap had a simple memory (two touches required) but that was not enough to warrant subject status. The committee focused on the mechanistic explanation.

  For the slime mold:
  - It exhibits what appears to be anticipation (entrained to the chill cycle) and memory (avoiding a previous repellent site). However, the curator argues that these are mechanistic and can be explained by entrainment (which fades without reinforcement) and chemical traces.
  - The keeper says she must use intentional language ("expects") to predict its choices. This parallels the octopus and cuttlefish cases where intentional language was necessary for prediction.
  - But the slime mold is a single cell without a nervous system. This is a point against subject status because it lacks the complexity of an octopus or even a bee hive (which has many individuals with a collective intelligence).
  - Fragmentation: The slime mold can be cut into pieces, each of which regenerates. This is similar to the coral and the flytrap (which can be propagated by cutting). The curator argues that if you can make 40 new individuals by cutting, there is no single subject. This is analogous to the coral (husbandry only) and contrasts with the hive (colony subject) where splitting the hive is a major event that requires committee approval.

  ### Comparison to Precedents
  - **Honeybee hive (6)**: The hive is a colony subject because the collective exhibits intentional behavior ("doesn't want to swarm") and splitting the hive requires approval. However, the slime mold is a single cell, not a colony of many individuals. The hive is a superorganism with division of labor; the slime mold is a single organism that can be fragmented. This disanalogy might push against colony subject status.
  - **Venus flytrap (5)**: The flytrap has a simple memory mechanism but was still husbandry only. The slime mold's memory (avoiding a repellent site) is similar. However, the flytrap's behavior is entirely mechanical (trigger hairs and cell pressure), while the slime mold's behavior is more complex (e.g., trading off quality and distance of food). The keeper's claim that she must use intentional language might make it more like the octopus.
  - **Ochre sea star (3)**: The sea star is predictable by simple environmental gradients. The slime mold's behavior might be more complex, but the curator says there is a mechanistic model. If the slime mold's behavior can be fully explained without intentional language, then it might be like the sea star.
  - **Reef-building coral (4)**: The coral's behavior is explained by water chemistry. The slime mold might have more complex behavior, but the fragmentation argument is similar (coral can be fragmented, and each piece grows independently).
  - **Octopus (1) and Cuttlefish (2)**: These are clearly subjects because they require intentional language for prediction. The slime mold keeper also claims she must use intentional language. But is the slime mold's behavior as complex? The curator says no.

  ### Proposed Verdict
  The slime mold should be classified as **husbandry only**. Reasons:
  - It is a single-celled organism without a nervous system. The precedents for subject status (octopus, cuttlefish) involve complex animals with brains.
  - The behaviors described (entrainment to a chill cycle, avoidance of a previously repellent site) can be explained mechanistically (as the curator argues). The entrainment fading without reinforcement is typical of non-cognitive processes.
  - The fragmentation argument: if the organism can be cut into many pieces and each regenerates, then there is no single individual that is being consulted. This is similar to the coral and the flytrap.
  - The keeper's use of intentional language might be a convenience, but the HVAC case shows that intentional language alone is not sufficient. The committee must look at the underlying mechanisms.
  - The bee hive is a disanalogy because it is a society of many individuals with emergent properties. The slime mold is one cell that can be fragmented.

  However, the committee might be split. Another option is **colony subject** because of the intentional descriptions and the fact that the whole culture is being considered. But the fragmentation issue is strong: if you can cut it into 40 and each grows, then the whole is not an indivisible subject. In the bee hive, splitting is a major event that changes the colony, but for the slime mold, splitting is natural and each fragment becomes independent.

  Therefore, husbandry only.

  ### Signage Ruling
  The display panel should not say the slime mold "decides where to go" or "remembers where it's been." Approved wording might describe the behaviors mechanistically: e.g., "responds to chemical gradients," "exhibits entrainment to environmental cycles," "avoids areas previously associated with repellents due to residual chemicals or internal physiological states." This is consistent with the flytrap ruling.

  ### Fragmentation Ruling
  The education department can proceed with cutting the slime mold into fragments for outreach kits. No committee approval is needed because it is husbandry only.

  ### Candidate Rules
  We need at least four candidate rules, and at least one must favor subject status.

  1. **Intentional Language Requirement Rule**: If the keepers must use intentional language (e.g., beliefs, desires, expectations) to accurately predict and manage the holding, then it is a subject (or colony subject for groups). This fits precedents 1, 2, and 6. It strains 7 because the HVAC required intentional language but was not given subject status. For the slime mold, the keeper uses intentional language, so it would be subject. Principle: We are tracking when the holding's behavior requires mental state attribution.

  2. **Mechanistic Explanation Rule**: If the holding's behavior is fully explainable by known mechanistic models (e.g., chemistry, physics, species-typical reflexes) without needing intentional states, then it is husbandry only. This fits precedents 3, 4, 5, and 7. For the slime mold, the curator claims a mechanistic model, so husbandry only. Principle: We are tracking whether the holding is more like a machine than an agent.

  3. **Fragmentation Test Rule**: If the holding can be split into multiple independent, viable individuals without any change in the nature of the entity (e.g., each fragment grows into a full organism), then it cannot be a subject (must be husbandry only or colony subject only if the group as a whole has emergent properties). This fits precedents 4 (coral) and 5 (flytrap, which can be propagated by division). It strains 6 because a bee hive can be split, but that requires approval (colony subject). For the slime mold, fragmentation is possible so not subject. Principle: We are tracking the integrity of the individual subject; if it can be split, there is no single subject.

  4. **Nervous System Rule**: If the holding has a nervous system (or in the case of colonies, if the individuals have nervous systems and the colony exhibits emergent cognition), then it may be subject or colony subject. Otherwise, husbandry only. This fits precedents 1, 2, 3 (sea star has no brain, so husbandry only), 6 (bees have nervous systems). It strains 5 (flytrap has no nervous system, but we already ruled husbandry only) and 4 (coral, same). For the slime mold, no nervous system, so husbandry only. Principle: We are tracking the presence of a biological substrate for cognition.

  5. **Emergent Group Behavior Rule**: If the holding is a group of individuals that together exhibit emergent behavior that requires intentional description at the group level, then it is a colony subject. This fits precedent 6. It does not apply to the slime mold because it is a single cell, not a group. For the slime mold, this rule would say husbandry only. Principle: We are tracking group-level agency.

  At least one rule (the Intentional Language Requirement) would make the slime mold a subject.

  ### Closest Analog
  - Precedent: 5. Venus flytrap
  - Why closest: Both are non-neural organisms that exhibit simple forms of memory and decision-like behavior, but the committee ruled the flytrap husbandry only because the behavior is mechanistic.
  - Biggest disanalogy: The flytrap's behavior is more rigid (trigger hairs and cell pressure), while the slime mold shows more complex behaviors such as trading off food quality and distance, which might require more predictive models.

  ### Underdetermination
  The track record does not fully settle it. The key disputed fact is whether the slime mold's behavior (e.g., the trade-off between food quality and distance) can be predicted without intentional language. If we can show that a mechanistic model (e.g., an algorithm based on nutrient gradients and internal state) can predict the behavior as well as the keeper's intentional descriptions, then it would align with husbandry only. If not, and intentional language is necessary, then it might lean toward subject status. We could test this by having the keeper and the curator each predict the slime mold's choices in a series of controlled trials without using intentional language.

  ### Tiebreaker Case
  - Description: A planarian (flatworm) regeneration touch-tank. Planarians are known for regeneration (if cut, each piece grows into a new individual) and have a simple brain. They exhibit learning and memory (e.g., conditioned responses).
  - Rules it separates:
    - Intentional Language Rule: Might require subject status if keepers use intentional language to predict behavior.
    - Mechanistic Explanation Rule: If learning can be explained mechanistically (e.g., habituation), husbandry only.
    - Fragmentation Test: Since they can be fragmented, husbandry only? But they have a brain.
    - Nervous System Rule: They have a nervous system, so subject.
  - Predicted verdicts:
    - Intentional Language Rule: If keepers must use intentional language, subject.
    - Mechanistic Rule: If behavior is mechanistic, husbandry only.
    - Fragmentation Test: Since fragmentation is possible, husbandry only? But that conflicts with nervous system.
    - Nervous System Rule: Subject.

  This case would force a decision between the Fragmentation Test and the Nervous System Rule.

