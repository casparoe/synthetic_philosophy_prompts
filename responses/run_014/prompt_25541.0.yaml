  The problem here is functional shift. That means a mechanism might have been selected for one function initially, but later evolution repurposed it for another. Like maybe the frog's ancestors used that visual system for detecting something else, say mosquitoes, and now it's for flies. Or maybe it was for flies but now it's also used for avoiding predators. So which function is the "proper" one that determines content?

