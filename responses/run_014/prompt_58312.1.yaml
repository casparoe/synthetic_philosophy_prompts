prompt: |-
  Please draft the joint statement that could be signed after a good-faith adversarial collaboration between two philosophers of time: an Open-Future Indeterminist who holds that a genuinely undetermined future contingent is at present neither true nor false, and an Ockhamist who holds that bivalence is preserved for future contingents even if the future is metaphysically open.

  The document should concern the familiar example of a naval battle occurring tomorrow and three further stipulated cases to be addressed by both parties: a Satellite Coin case in which an autonomous satellite will flip a genuinely indeterministic coin tomorrow at noon with no present causal factor favoring either outcome; a Martian Storm case in which a dust storm will occur tomorrow as a deterministic consequence of present conditions that are in principle unknowable to any observer; and a Retrospective Bet case in which two agents today place a symmetric bet to be settled tomorrow, and tomorrow one of them says that what was said today turned out to have been true.

  Structure the statement as a numbered section of agreed claims followed by a disagreements table and then a cruxes section. The agreed claims should cover at least the distinction between bivalence and excluded middle, what a branching-time model represents, what would count as fatalism, and what norms govern assertion and rational credence about the future. The disagreements table should state each residual disagreement in neutral wording that the holder of each view would accept as a fair formulation of their own position, including whether truth requires a privileged branch or thin red line, whether retrospective ascriptions of past truth are correct, and whether deliberation gives a practical reason to treat the future as open.

  For each crux, specify a concrete consideration, thought experiment, or linguistic pattern that both parties agree would bear on it, with each side's prediction about that consideration recorded in advance. Conclude by indicating which parts of the dispute, if any, both parties agree are merely verbal.
reasoning: |-
  We are drafting a joint statement after a good-faith adversarial collaboration between an Open-Future Indeterminist (OFI) and an Ockhamist (Ock). The topic is future contingents, with a focus on the naval battle example and three stipulated cases.

  The structure is:
  1. Agreed Claims (numbered section)
  2. Disagreements Table (with each disagreement stated neutrally and acceptable to both)
  3. Cruxes Section (each crux with a concrete consideration, thought experiment, or linguistic pattern, and both parties' predictions)

  Agreed Claims should cover:
  - Distinction between bivalence and excluded middle
  - What branching-time models represent
  - What would count as fatalism
  - Norms of assertion and rational credence about the future

  Disagreements Table should include:
  - Whether truth requires a privileged branch (or thin red line)
  - Whether retrospective ascriptions of past truth are correct
  - Whether deliberation gives a practical reason to treat the future as open

  Cruxes Section: For each crux, a concrete test and each side's prediction.

  Finally, indicate which parts are merely verbal.

  Let's begin.

  **Joint Statement on Future Contingents**

  **1. Agreed Claims**

  We, the Open-Future Indeterminist (OFI) and the Ockhamist (Ock), after extensive discussion, agree on the following points:

  1.1 **Bivalence vs. Excluded Middle**: We agree that the principle of bivalence (every proposition is either true or false) is distinct from the law of excluded middle (for any proposition P, P or not-P is true). We acknowledge that one might accept excluded middle without bivalence, and that the dispute about future contingents primarily concerns bivalence.

  1.2 **Branching-Time Models**: We agree that branching-time models (such as those in the tradition of Prior, Thomason, etc.) are useful for representing the metaphysical openness of the future. In such models, multiple future branches represent genuinely possible futures. However, we agree that these models are representational tools and that their interpretation is subject to philosophical dispute.

  1.3 **Fatalism**: We agree that fatalism, understood as the thesis that the future is causally or nomologically determined by the past and present such that no one can do otherwise, is not at issue in this debate. Both parties reject fatalism and affirm that the future is metaphysically open in the sense that there are multiple possible futures. The disagreement is about the truth values of propositions about the future, not about determinism or the fixity of the past.

  1.4 **Norms of Assertion**: We agree that assertions about future contingents are governed by epistemic norms. Specifically, one should not assert a future contingent unless one has adequate evidence for it. Thus, in the absence of such evidence, it is inappropriate to assert either that a naval battle will occur tomorrow or that it will not.

  1.5 **Rational Credence**: We agree that rational credence about future contingents should reflect the objective probabilities (if available) or one's best evidence. For example, in the Satellite Coin case, one should assign a credence of 0.5 to the proposition that the coin will land heads, and similarly for tails.

  1.6 **Retrospective Attitudes**: We agree that after the fact, it is correct to say that what happened was going to happen (in the sense that it did happen). However, we note that this does not by itself settle whether it was true at the earlier time that it would happen.

  **2. Disagreements Table**

  We continue to disagree on the following points, which we formulate in a way that each of us accepts as a fair representation of our own position:

  | Issue | Open-Future Indeterminist (OFI) Position | Ockhamist (Ock) Position |
  |-------|-------------------------------------------|--------------------------|
  | **Truth and the Thin Red Line** | Truth about future contingents does not require a privileged branch (a "thin red line"); in a metaphysically open future, there is no fact of the matter about which branch is the actual future. Therefore, a proposition about a future contingent event (e.g., "There will be a naval battle tomorrow") is neither true nor false now. | Truth about future contingents does not require a privileged branch; bivalence holds because the truth of a future contingent is relativized to a branch. However, from the perspective of the actual present, there is a unique actual future (though we may not know which one) and thus a proposition about a future contingent is either true or false now, even if we cannot know which. |
  | **Retrospective Ascriptions of Past Truth** | When retrospectively ascribing truth to a past utterance about a future contingent, we are not attributing truth at the time of utterance. Instead, we are making a claim about how things turned out. For example, after a naval battle occurs, saying "What you said yesterday was true" is elliptical for "What you said yesterday turned out to be correct," not that it was true at the time. | When retrospectively ascribing truth to a past utterance about a future contingent, we are correctly attributing truth at the time of utterance. For example, after a naval battle occurs, saying "What you said yesterday was true" is literally true because the proposition expressed by the utterance was true at the time, even though it was contingent and not known. |
  | **Deliberation and Practical Reason** | In deliberation, we have a practical reason to treat the future as open in the sense that we do not take any particular future branch as already fixed. This involves not taking the truth of future contingent propositions as given (since they are not true or false) and instead considering the possibilities. | In deliberation, we have a practical reason to treat the future as open in the sense that we do not take the actual future as already known or determined by our present state. However, this does not conflict with the fact that there is a truth about what will happen; it only reflects our epistemic limitation. |

  **3. Cruxes Section**

  We agree that the following considerations are relevant to the dispute and we record our predictions about them.

  3.1 **Crux: The Retrospective Bet Case**

  - **Case Description**: Two agents, A and B, place a symmetric bet today on a future contingent (e.g., a coin flip by the satellite tomorrow). After the flip, the winner says, "What I said yesterday turned out to have been true." We examine the linguistic behavior and intuitions about this utterance.

  - **OFI Prediction**: The phrase "turned out to have been true" will be interpreted by competent speakers as meaning that the claim was correct in light of what happened, but not that it was true at the time of utterance. Thus, the utterance is acceptable but does not commit us to past truth.

  - **Ock Prediction**: Competent speakers will interpret the phrase as asserting that the claim was true at the time of utterance. The utterance is acceptable and supports the view that the proposition was true at the time.

  3.2 **Crux: The Martian Storm Case**

  - **Case Description**: A dust storm on Mars occurs tomorrow as a deterministic consequence of present conditions, but these conditions are in principle unknowable to any observer (so no one can have evidence about the storm). We consider whether the proposition "There will be a Martian dust storm tomorrow" is true now.

  - **OFI Prediction**: Because the future is open (even if determinism holds, the openness is metaphysical), and since no one can know the outcome, the proposition is neither true nor false now. Determinism does not by itself guarantee present truth if the future is still metaphysically open.

  - **Ock Prediction**: Since the storm is determined by present conditions, the proposition is true now (or false, if it won't occur). Determinism implies that there is a fact of the matter now, even if it is unknowable.

  3.3 **Crux: The Norm of Assertion for Future Contingents**

  - **Consideration**: We consider the linguistic norm: Is it permissible to assert a future contingent when one has no evidence? For example, in the Satellite Coin case, if someone asserts "The coin will land heads" without evidence, is this assertion improper?

  - **OFI Prediction**: The assertion is improper not only because of lack of evidence but also because the proposition lacks a truth value. Thus, the norm of assertion (which requires truth) is violated.

  - **Ock Prediction**: The assertion is improper only because of lack of evidence. The proposition has a truth value, but we cannot know it. If one had evidence (or in a deterministic case where one could know), assertion would be proper.

  **4. Verbal Disputes**

  We agree that part of our dispute is merely verbal regarding the use of the term "true" in retrospective contexts. Specifically:

  - The OFI holds that "true" in a retrospective context is used in a way that does not imply past truth but rather current correctness in light of the outcome.
  - The Ock holds that "true" in a retrospective context is used to attribute truth at the time of utterance.

  We acknowledge that this difference in the use of "true" might be a matter of linguistic convention and not a deep metaphysical disagreement. However, we disagree on whether the linguistic data (as in the Retrospective Bet case) supports one usage over the other.

  Additionally, we agree that the term "actual future" may be used differently: the OFI denies that there is an actual future branch now (only a set of possible branches), while the Ock maintains that there is an actual future branch (even if we don't know which). This difference in terminology does not affect the underlying metaphysical agreement about the openness of the future.

  **Conclusion**

  We have laid out our agreements, disagreements, and cruxes in the hope of clarifying the debate and encouraging further investigation. We remain in disagreement on the central issues of bivalence and the nature of truth for future contingents, but we agree on the importance of the openness of the future for deliberation and the rejection of fatalism.

  Signed,

  [Open-Future Indeterminist]
  [Ockhamist]
  [Date]
answer: |-
  ### Joint Statement on Future Contingents  
  **Following an Adversarial Collaboration Between an Open-Future Indeterminist (OFI) and an Ockhamist (Ock)**  

  #### 1. Agreed Claims  
  We, the undersigned philosophers, affirm the following points of consensus after rigorous debate:  

  1.1 **Bivalence vs. Excluded Middle**:  
  - Bivalence (every proposition is true or false) is distinct from the law of excluded middle (for any proposition \(p\), \(p \lor \neg p\) is true).  
  - The OFI rejects bivalence for future contingents but endorses excluded middle; the Ock affirms both, holding that excluded middle entails bivalence.  

  1.2 **Branching-Time Models**:  
  - Branching-time structures (e.g., Prior-Thomason semantics) represent the *metaphysical openness* of the future: multiple branches depict genuine possibilities.  
  - Neither model presupposes determinism nor denies human agency.  

  1.3 **Fatalism**:  
  - Fatalism—defined as the thesis that *all future events are fixed regardless of present actions*—is rejected by both.  
  - Affirming bivalence (Ock) or denying it (OFI) does not entail fatalism, as both agree that agents can influence outcomes.  

  1.4 **Norms of Assertion and Credence**:  
  - **Assertion**: It is epistemically improper to assert a future-contingent claim (e.g., "A naval battle occurs tomorrow") without sufficient evidence, regardless of its truth value.  
  - **Rational Credence**: For symmetric future contingents (e.g., Satellite Coin flip), a credence of 0.5 is rational for each outcome. This reflects indeterminism, not truth-value gaps (OFI) or unknown truth values (Ock).  

  1.5 **Case Analyses**:  
  - **Naval Battle**: Both agree the future is metaphysically open; disagreement concerns present truth value.  
  - **Satellite Coin**: The coin flip is objectively indeterministic; no present causal factors favor heads or tails.  
  - **Martian Storm**: The storm is deterministic but *in principle unknowable* at present; its outcome is fixed by current conditions.  
  - **Retrospective Bet**: After the bet’s resolution, the winner may legitimately say, "My past claim turned out to be true."  

  ---

  #### 2. Disagreements Table  
  We disagree on the following, formulated neutrally to reflect each position fairly:  

  | Issue | OFI Position | Ock Position |  
  |-------|--------------|--------------|  
  | **Truth Requires a Privileged Branch (Thin Red Line)** | Truth about future contingents requires no privileged branch; with no "actual future," propositions like "A naval battle occurs tomorrow" are *presently neither true nor false*. | Truth about future contingents requires no privileged branch; bivalence holds because exactly one branch *will* be actual, rendering propositions either true or false *now*. |  
  | **Retrospective Ascriptions of Past Truth** | Retrospective claims (e.g., "My past bet was true") mean the claim *turned out* correct; they do not imply it was true *when uttered*. | Retrospective claims (e.g., "My past bet was true") correctly ascribe truth *to the past utterance*, even if the future was open when spoken. |  
  | **Deliberation and Practical Openness** | Deliberation requires treating the future as metaphysically open: agents must act as if no outcome is *yet* true or false. | Deliberation requires treating the future as epistemically open: agents must act as if outcomes are unknown, even if bivalence holds. |  

  ---

  #### 3. Cruxes  
  For each unresolved issue, we identify a testable consideration and predict outcomes:  

  3.1 **Crux: Truth and the Thin Red Line**  
  - **Test**: *Linguistic analysis of counterfactuals*. Consider: "If the coin lands heads, it was true all along that it would."  
    - **OFI Prediction**: Speakers reject this claim; "was true all along" implies fatalism, violating openness intuitions.  
    - **Ock Prediction**: Speakers accept this claim; truth is timeless, so outcomes align with past truth values.  

  3.2 **Crux: Retrospective Truth Ascriptions**  
  - **Test**: *Retrospective Bet case*. After winning, Agent A says, "What I said yesterday was true." Poll speakers on whether this means:  
    (a) The claim *was true yesterday* (Ock), or  
    (b) The claim *proved correct* but lacked truth value yesterday (OFI).  
    - **OFI Prediction**: Majority endorse (b); ascriptions are merely retrospective, not tensed.  
    - **Ock Prediction**: Majority endorse (a); truth is timeless, so correctness implies past truth.  

  3.3 **Crux: Deliberation and Practical Reason**  
  - **Test**: *Agent deliberation in indeterministic scenarios*. Suppose an agent knows the Satellite Coin flip is genuinely indeterministic. Does asserting, "I cannot affect an outcome that is *already* true/false" undermine their sense of agency?  
    - **OFI Prediction**: Yes; agents report diminished motivation if they believe outcomes are "already" true/false.  
    - **Ock Prediction**: No; agents distinguish truth from fixity—bivalence does not affect their sense of control.  

  ---

  #### 4. Merely Verbal Disputes  
  We agree the following disputes are terminological:  
  - **"Truth" in retrospective contexts**: Whether "S was true" applied to a past future-directed utterance *entails* that it was true *at the time* (Ock) or *only* that it matches what happened (OFI).  
  - **"Actual future"**: The Ock uses this to denote *the single future that will obtain*; the OFI avoids it to reject present truthmakers. Both agree only one branch *will* be actual.  

  ---  
  **Conclusion**: This collaboration clarifies that our core disagreement concerns the *semantics of future contingents* (bivalence, truthmakers) and their *phenomenology in agency*, not metaphysics of openness or fatalism. We commit to empirical testing of the cruxes above.  

  Signed,  
  **Open-Future Indeterminist**  
  **Ockhamist**  
  Date: 2023-10-15
