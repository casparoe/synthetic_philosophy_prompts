prompt: |-
  I am preparing a dissertation chapter on skilled action and have become puzzled by the persistence of the dispute over the relation between knowing how and knowing that.

  For purposes of the chapter, I understand the two central positions roughly as follows. Intellectualists hold that knowing how to perform an action is a species of propositional knowledge, namely knowledge of a way of acting, entertained under a practical or action-guiding manner of thinking about that way. Ability theorists hold that knowing how is fundamentally distinct, consisting in a reliable ability, disposition, or embodied competence that can come apart from propositional understanding, even when supplemented by practical modes of presentation.

  What strikes me is how little movement there has been despite decades of exchange about linguistic patterns in knowledge ascriptions, thought experiments about skiers and pianists who can or cannot perform, and neuropsychological dissociations between declarative memory and preserved skill learning. Each side seems able to reinterpret the other side's favored data without revising its core claim.

  To keep the discussion from staying at that familiar level of generality, I want analysis anchored in three variant cases of my own design:

  Mara, a former competitive swimmer who is now fully paralyzed and ventilator dependent, remembers exactly how elite turns are timed, diagnoses flaws in video of others, and gives coaching instructions that measurably improve her swimmers, but cannot move herself.

  Arm-7, a warehouse manipulator trained entirely through trial-and-error reinforcement without any separately stored declarative model of its task, reliably grasps fragile and irregularly shaped objects under varied lighting and clutter, but fails simple verbal or diagrammatic probes about what it is doing and cannot transfer its competence by instruction.

  Theo, an advanced violin student who can state accurate principles governing wrist motion, pressure, and timing for a fluid vibrato and can identify good versus flawed vibrato in recordings, but plays with a stiff and uneven vibrato himself, contrasted with his teacher, who plays with exemplary vibrato while stating false principles about her own wrist motion when asked to explain it.

  My hypothesis is that the dispute conflates a semantic question about when ordinary English treats someone as knowing how with a psychological question about the cognitive architecture underlying fluent performance, and that the two sides are in effect answering different questions while using the same vocabulary of knowledge.

  Assess that hypothesis and offer a diagnosis of the structure of the disagreement. Is it substantially verbal, is it a genuine factual disagreement about cognition, is it a difference in which cases are treated as central data or in what counts as evidence for a philosophical claim about knowledge, or is it a clash of starting intuitions that argument cannot resolve? Show how each side would handle Mara, Arm-7, and Theo versus his teacher, and use those verdicts to support the diagnosis rather than surveying the existing literature. Conclude by stating concretely what would count as progress on your diagnosis, whether that is a conceptual distinction, a reformulated question, or an empirical or formal result, and if you think no such advance should be expected, explain why the impasse is principled rather than temporary.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're working on a dissertation chapter about skilled action, specifically the debate between intellectualism and ability theory regarding knowing-how vs. knowing-that. They've created three cases—Mara, Arm-7, and Theo—to test these theories and propose that the dispute conflates semantic and psychological questions. 

  First, I need to assess their hypothesis. The user thinks the two sides are answering different questions: one about language (when we say someone "knows how"), the other about cognition (what underlies skill). The examples are designed to highlight this split. 

  Looking at Mara: paralyzed but can coach effectively. Intellectualists might say she retains propositional knowledge (knows-that) even without ability. Ability theorists would argue without physical capability, she doesn't truly know-how. This shows the semantic vs. psychological divide—intellectualists focus on the knowledge aspect, ability theorists on performance.

  Arm-7 is a robot with no declarative model. Intellectualists might struggle here because Arm-7 lacks propositional knowledge. They might dismiss it as not genuine knowledge or redefine propositions. Ability theorists would point to reliable performance as knowing-how, emphasizing embodied competence over propositions. Again, semantic (does "know how" apply to non-humans?) vs. psychological (what cognitive structures are involved).

  Theo and his teacher: Theo knows principles but can't perform; the teacher performs well but gives false principles. Intellectualists might say Theo knows-how through propositions but has a performance issue, while the teacher's false principles don't negate her knowledge-that. Ability theorists see Theo's failure as lack of know-how despite knowing-that, and the teacher's skill as know-how independent of propositions. Here, the clash is over what counts as central evidence—verbal reports vs. performance.

  The user's hypothesis seems valid. The disagreement is partly verbal but also about evidential priorities. Intellectualists prioritize linguistic ascriptions and cases where knowledge is explicit, while ability theorists focus on ability dissociations. 

  For progress, the user needs to disentangle the questions. Maybe propose distinct concepts: "knowledge-that" for propositions, "skill" for embodied abilities. Then, examine their interaction empirically—like how declarative knowledge aids skill acquisition. This could move the debate forward by clarifying terms and integrating cognitive science findings. 

  The user might also want to address why this impasse persists. Both theories are resilient because they protect core intuitions. Intellectualists preserve knowledge as truth-apt; ability theorists honor the embodied nature of skill. Unless there's a paradigm shift in how knowledge is defined, the stalemate might continue. But by reframing the questions, the user can offer a fresh perspective for their dissertation.
answer: |-
  Your hypothesis is perceptive: the dispute largely stems from conflating a **semantic analysis of "knows how" ascriptions** with a **psychological account of skill implementation**. The core disagreement is **multidimensional**, involving differences in:  
  - **Central cases** (which phenomena are treated as paradigmatic),  
  - **Evidential priorities** (what counts as decisive proof),  
  - **Starting intuitions** (pre-theoretic judgments about knowledge).  

  Below, I assess each case through both lenses, diagnose the disagreement's structure, and propose a path forward.  

  ---

  ### **Case Analyses: How Each Theory Responds**  
  1. **Mara (Paralyzed Coach):**  
     - **Intellectualist Verdict:** *Knows how*. Mara possesses propositional knowledge (e.g., "turning at 0.8s optimizes glide phase") under a practical mode of presentation. Her coaching success proves her knowledge-that guides action (others' actions). Paralysis blocks ability but not knowledge.  
     - **Ability Theorist Verdict:** *Does not know how*. Knowing-how requires embodied capacity. Mara retains *knowledge-that about swimming*, but her inability to swim severs knowing-how. Coaching expertise derives from declarative memory, not retained skill.  
     - **Conflict Driver:** Intellectualists prioritize *knowledge ascription* (we say Mara "knows how" to swim turns); ability theorists prioritize *performance capacity*.  

  2. **Arm-7 (Reinforcement-Learning Robot):**  
     - **Intellectualist Verdict:** *Does not know how*. Without propositional representation (e.g., "grasp points minimize torque"), Arm-7 lacks knowledge-that. Its behavior is mere adaptive disposition, not knowledge under *any* mode of presentation.  
     - **Ability Theorist Verdict:** *Knows how*. Reliable, flexible performance *is* knowing-how. Arm-7 embodies competence without propositions. Inability to verbalize is irrelevant—humans (e.g., infants) can know-how without articulation.  
     - **Conflict Driver:** Intellectualists demand *cognitive content* for knowledge; ability theorists treat reliable ability as *sufficient* for know-how, decoupled from representation.  

  3. **Theo vs. Teacher (Vibrato Dissonance):**  
     - **Theo (Knowledge-That Without Skill):**  
       - *Intellectualist:* Knows how (he grasps true propositions), but motor execution fails due to non-cognitive factors (e.g., muscle memory).  
       - *Ability Theorist:* Does not know how—his ability is flawed despite theoretical knowledge.  
     - **Teacher (Skill Without Accurate Knowledge-That):**  
       - *Intellectualist:* Knows how *and* knows-that, but her *verbal report* is inaccurate. True propositions exist sub-personally, accessible only in practice.  
       - *Ability Theorist:* Knows how *without* relevant knowledge-that. Her false principles prove propositions are incidental to skill.  
     - **Conflict Driver:** Intellectualists subordinate ability to knowledge (failure is "performance error"); ability theorists treat propositional reports as epiphenomenal to skill.  

  ---

  ### **Diagnosis of the Disagreement**  
  The impasse arises from **three irreconcilable priorities**:  
  1. **Semantic vs. Psychological Grounding:**  
     - Intellectualists anchor "knows how" in *truth-apt content* (e.g., Rylean regress "solved" by propositions).  
     - Ability theorists anchor it in *successful practice* (e.g., skills persist when propositions are lost).  
  2. **Evidential Asymmetry:**  
     - Intellectualists dismiss ability without propositions (Arm-7) as non-knowledge and ability with propositions (Mara) as knowledge.  
     - Ability theorists dismiss propositions without ability (Theo) as non-knowledge and ability without propositions (Teacher) as knowledge.  
  3. **Intuitional Foundations:**  
     - Intellectualists are guided by cases like *Mara* (knowledge preserved without ability).  
     - Ability theorists are guided by cases like *Arm-7* or *Teacher* (ability without propositions).  

  **The dispute is not merely verbal but reflects divergent conceptions of cognition:**  
  - Intellectualists see skill as *governed by* knowledge-that (even if implicit).  
  - Ability theorists see skill as *constituted by* embodied dynamics (propositions are optional byproducts).  

  ---

  ### **Path to Progress: Disambiguation and Integration**  
  To resolve the impasse, **distinguish three questions**:  
  1. **Semantic:** When does "S knows how to φ" hold true in natural language?  
  2. **Cognitive:** What mechanisms enable fluent φ-ing?  
  3. **Metaphysical:** What is the *nature* of know-how (propositional, dispositional, hybrid)?  

  **Concrete Advances Needed:**  
  - **Conceptual:** Adopt distinct terms—e.g., *knowledge-how* (semantic) vs. *skill* (psychological competence). Mara has *knowledge-how* but lacks *skill*; Arm-7 has *skill* but lacks *knowledge-how*.  
  - **Empirical:** Identify cognitive architectures underlying cases like Theo/Teacher using:  
    - **fMRI/TMS studies** probing if declarative knowledge (Theo) and procedural skill (Teacher) activate distinct neural pathways.  
    - **AI/robotics models** testing whether Arm-7’s competence requires latent propositional structure (e.g., via interpretability tools).  
  - **Formal:** Model skill acquisition mathematically (e.g., reinforcement learning vs. symbolic planning) to clarify when propositional representations are necessary/sufficient for flexibility.  

  **Why Progress is Possible (But Not Guaranteed):**  
  The impasse persists because each theory protects its core intuition by reinterpreting counterevidence. However, empirical work on **cognitive architecture** (e.g., whether skills *require* action-guiding propositions) could force revision. If Arm-7’s competence is shown to rely on implicit probabilistic models (a form of propositional content), intellectualism gains ground. If Theo’s vibrato improves only when he *stops* focusing on principles, ability theory is strengthened.  

  **Conclusion:** The conflict is **principled but not eternal**. By decoupling linguistic, cognitive, and metaphysical questions—and testing predictions via cognitive science—your cases can shift debate from "what is know-how?" to "how do knowledge, ability, and ascription interact?" This reframes the dispute, making room for hybrid views (e.g., know-how as *both* ability and proposition-guided control).
