  For knowledgeable readers, the structural work is in the plot mechanics. The client’s disposition switches exactly when the mechanism to detect it is applied, mimicking a fink (if the Discernment destroys itself upon use) or a mask (if it’s blocked by the test). The assayer’s realization that his Discernment is the target mirrors the regress problem: if the detector needs detecting, where does it end?

