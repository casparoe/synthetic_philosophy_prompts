prompt: |-
  I'm a senior analyst at a national body that decides which health services get publicly funded. We have informally adopted a policy of giving priority to the worse off — benefits to more disadvantaged patients count for more than equal benefits to better-off ones — but we have no worked-out method, and committee members keep disputing particular cases on instinct. Please write a decision procedure my team can actually run on a funding proposal.

  Context: we make roughly ten of these decisions a year, each involving thousands of patients and significant budgets. An analyst has about two weeks per case, with QALY-style effectiveness estimates and subgroup data, but no way of making fine-grained interpersonal utility comparisons. Final sign-off is by a mixed committee of clinicians, economists, and lay members, so every step must be explainable to a non-theorist in a paragraph.

  The procedure should cover, in order: how to characterize the relevant sense of "worse off," including when current condition, lifetime health prospects, and socioeconomic position point in different directions and which controls; how to set the priority weights, and how to report the recommendations that flip as the weights vary; an explicit leveling-down test — what the procedure should say about a policy that benefits no one but narrows the gap between groups, and whether prioritarianism has any principled basis for rejecting it; and the points at which the questions stop being technical and must go to the committee as questions of values.

  Then run the procedure on three cases: (1) a drug extending life by a few months for patients with a severe progressive condition, competing against a mental-health program with a larger total benefit spread across many mildly affected people; (2) a case where following the procedure's own weights yields a recommendation I will dislike — a small benefit to the very worst off purchased at a very large cost in aggregate health — and the procedure must show how it handles that rather than hiding it; and (3) a rationing rule that withholds a service from the better-off group without extending it to anyone, which is pure leveling-down.

  You are a professional philosopher specializing in distributive justice, with experience translating theory for health priority-setting bodies. Before writing anything, brainstorm which distinctions from the prioritarianism literature must survive the simplification — e.g., prioritarianism's reason for rejecting leveling-down versus the objection's usual use against egalitarianism — and which can safely be dropped. Mark honestly wherever the procedure cannot settle the matter. Answer in American English.
reasoning: |-
  Okay, the user is a senior analyst at a national health funding body. They need a practical decision procedure for prioritizing services when considering the worse off. Let me unpack their request. 

  First, the core challenge: they've informally prioritized the disadvantaged but need a structured method. The procedure must handle real-world constraints—limited data, committee approval, and explainability to non-theorists. Key elements include defining "worse off," setting weights, handling leveling-down, and flagging value judgments for the committee. 

  Hmm, the philosophical groundwork is crucial. Prioritarianism focuses on absolute benefit weighting, not equality—that's why it rejects leveling-down. Must emphasize this distinction clearly. The user mentioned three test cases: a trade-off between terminal illness and mental health, a small benefit to the worst-off at high cost, and pure leveling-down. These will stress-test the procedure's logic. 

  For the "worse off" definition, lifetime health prospects seem most defensible. But socioeconomic factors? Tricky. The procedure should allow their inclusion but force the committee to explicitly decide—this avoids technocratic overreach. Weight-setting needs to be semi-structured too; suggesting ranges (1.0-3.0) with sensitivity analysis keeps it practical. 

  Ah, the leveling-down test is non-negotiable. The procedure must automatically reject such policies per prioritarianism. Case 3 will demonstrate this—it's pure wasted resources without benefit. 

  The three cases reveal where philosophy meets politics: Case 1's terminal vs. mental health trade-off exposes weighting dilemmas. Case 2 (small benefit, high cost) will make committees uncomfortable—good. The procedure should spotlight this tension via sensitivity analysis rather than bury it. 

  Noticing the user's unspoken need: legitimacy. The committee's mixed composition means every step must feel transparent and values-driven, not black-boxed. Hence the heavy emphasis on flagging "committee judgment points" and plain-language reporting. 

  Finally, the time constraint (2 weeks per case) means simplicity is survival. Hence dropping fancy utility calibrations—QALY subgroups and weight ranges are pragmatic. The test cases prove it's workable. 

  ...Time to structure this as a step-by-step flow with philosophical guardrails.
answer: |-
  Here’s a practical decision procedure for priority setting, grounded in prioritarianism, designed for your operational constraints. Key philosophical distinctions preserved:  
  **(1)** *Prioritarianism weights absolute benefits*, not relative gaps (rejects leveling-down).  
  **(2)** "Worse off" = *lifetime health prospects* (not momentary suffering or SES alone).  
  **(3)** Weights reflect *degree of disadvantage*, not just group membership.  

  ---

  ### **Decision Procedure: Priority Weighted QALY Assessment**  
  **Inputs per proposal:** Subgroup-level QALY gains, costs, and disadvantage indicators (see Step 1).  
  **Output:** Priority Weighted Cost-Effectiveness Ratio (PWCER) with sensitivity testing.  

  #### **Step 1: Characterize "Worse Off" (Analyst Phase)**  
  - **Primary metric:** *Expected lifetime QALYs remaining without intervention* (using epidemiological data/registries).  
  - **Secondary considerations (if data exists):**  
    - *Current disease severity* (e.g., pain/function scores).  
    - *Non-health disadvantage* (e.g., income quintile, education)—**but flag for committee review** (see Step 5).  
  - **Handling conflicts:**  
    - Lifetime QALYs dominate *unless* current severity drastically alters wellbeing (e.g., unbearable pain).  
    - **Control:** Standardize to national average lifetime QALYs (≈80 QALYs at birth). Example:  
      - Patient A: 5 QALYs left → "very worse off"  
      - Patient B: 30 QALYs left → "moderately worse off"  

  #### **Step 2: Set Priority Weights**  
  - **Formula:** Weight = 1 + (K × Disadvantage Factor)  
    - **Disadvantage Factor (DF):** *DF = (Reference QALY - Subgroup’s Lifetime QALY) / Reference QALY*  
      (e.g., Reference = 80 QALYs; Subgroup = 10 QALYs → DF = (80-10)/80 = 0.875)  
    - **K-value:** *Committee-defined scalar* (suggested range: 1.0–3.0). Start with K=1.5 if no precedent.  
  - **Weight interpretation:**  
    - K=1.0 → No priority weighting (standard QALY maximization).  
    - K=2.0 → A QALY to someone with 10 QALYs left counts as 1 + (2 × 0.875) = 2.75 QALYs.  
  - **Analyst action:** Calculate PWCER = Total Cost / ∑(QALY gain per subgroup × Weight).  

  #### **Step 3: Address Leveling-Down**  
  - **Automatic rejection rule:** *If a policy provides zero QALY gain to all subgroups, recommend against funding—even if it reduces gaps.*  
  - **Reason:** Prioritarianism values *improving lives*, not equality. Narrowing gaps without benefit wastes resources that could help someone.  

  #### **Step 4: Report with Sensitivity & "Flip Points"**  
  - **Core report:** PWCER at K=1.0, K=1.5, K=2.0.  
  - **Critical outputs:**  
    - "Flip Point": The K-value where recommendation changes (e.g., from "fund" to "reject").  
    - "Disadvantage Impact": % change in cost-effectiveness due to weighting.  
  - **Example statement:**  
    > "At K=1.5, Program X’s cost-effectiveness improves 40% due to priority weighting. It flips to ‘recommend’ at K>1.2. Without weighting (K=1.0), it is not cost-effective."  

  #### **Step 5: Flag Committee Judgment Points**  
  Technical steps end here. Committee must decide:  
  1. **K-value:** "How much extra weight should the worse off receive?" (Set K).  
  2. **Non-health factors:** "Should low SES independently increase weights? If so, by how much?"  
  3. **Conflict overrides:** "When lifetime QALYs and current severity conflict, which prevails?"  

  ---

  ### **Test Cases**  
  **Case 1: Terminal Cancer Drug vs. Mild Depression Program**  
  - *Cancer drug:* 0.2 QALY gain for 1,000 patients (lifetime QALYs left: 2 → DF=0.975).  
  - *Mental health program:* 0.1 QALY gain for 10,000 patients (lifetime QALYs left: 50 → DF=0.375).  
  - **Analysis:**  
    - Unweighted: Mental health wins (1,000 QALYs vs. 200 QALYs).  
    - Weighted (K=1.5):  
      - Cancer: 0.2 × [1 + (1.5 × 0.975)] = 0.4925 weighted QALYs/patient → **492.5 total**  
      - Mental health: 0.1 × [1 + (1.5 × 0.375)] = 0.15625 → **1,562.5 total**  
    - **Result:** Mental health still wins, but gap narrows (flip point at K>4.0, implausibly high).  
    **Committee question:** "Is K=1.5 sufficient? Or should terminal illness get extra weight beyond the formula?"  

  **Case 2: Small Benefit to Worst-Off at High Cost**  
  - *Rare disease treatment:* 0.05 QALY gain for 100 patients (lifetime QALYs left: 1 → DF=0.987). Cost: $50M.  
  - *Alternative:* Hip replacements giving 1 QALY to 5,000 patients (lifetime QALYs left: 20 → DF=0.75). Cost: $50M.  
  - **Analysis (K=1.5):**  
    - Rare disease: 0.05 × [1 + (1.5 × 0.987)] = 0.124 QALYs/patient → **12.4 total weighted QALYs**  
    - Hips: 1 × [1 + (1.5 × 0.75)] = 2.125 → **10,625 total weighted QALYs**  
  - **Result:** Procedure recommends hips despite small per-person gain. *But transparency:*  
    > "Prioritizing rare disease would require K>50, violating ‘concavity’ (weighting sanity check). This suggests the trade-off is ethically implausible."  

  **Case 3: Pure Leveling-Down (Withhold Service)**  
  - *Proposal:* Deny a non-critical treatment (e.g., IVF) to high-SES patients, saving $10M but providing *zero QALY gain to any group*.  
  - **Analysis:**  
    - No QALY gain → automatic rejection per Step 3.  
  - **Report language:**  
    > "This policy narrows access gaps but helps no one. Prioritarianism requires benefiting actual people, not just reducing inequality. Reject."  

  ---

  ### **Where Philosophy Meets Practice**  
  - **Kept:** Prioritarianism’s core (weight absolute gains by baseline welfare), rejection of leveling-down, concavity (diminishing returns).  
  - **Dropped:** Interpersonal utility comparisons (uses QALYs), exact weighting functions (uses linear DF).  
  - **Honest Gaps:**  
    - **Non-health disadvantage:** No formulaic solution—committee must debate.  
    - **K-value:** Technically arbitrary; requires democratic input.  
    - **Severity vs. prognosis:** When they conflict (e.g., chronic pain in young patients), committee judgment prevails.  

  This procedure systematizes intuitions, forces transparency on trade-offs, and embeds prioritarianism’s non-negotiable rejection of wasted resources—while leaving value conflicts where they belong: with the committee.  

  *Final note: Run a "disadvantage audit" for every proposal—list which groups lose if rejected and their DF. This makes the moral math visible.*
