prompt: |-
  ok so I'm a third-year PPE student and my political theory seminar has me writing a paper on humanitarian intervention and regime change, and I've gotten stuck in kind of the worst way: I've read maybe six different accounts and I can't tell whether they're even answering the same question. Some are trying to tell a minister what to do next month, some are trying to render a verdict on whether NATO's Kosovo campaign was right all things considered now that we know how it went, and some are really trying to say when sovereignty stops shielding a regime from outsiders. So before I commit to arguing with anyone I want the spec first — the list of things any theory in this area has to be able to do before it's allowed to count as an answer, whatever it concludes.

  Fix the purpose like this, because I think a lot of the disagreement dissolves once you do: I want a theory good enough to be turned into a standing ex ante decision rule that a regional body could actually apply beforehand, by people who don't know how things will turn out. That means no criterion that can only be evaluated in hindsight, and no criterion that requires reading anyone's mind. With that constraint in place, give me the full requirements list: the phenomena a theory has to explain, the cases it has to get right (and say which case is doing the work for each requirement — Kosovo, Iraq 2003, Libya 2011, Rwanda 1994 as the non-intervention, Syria 2013 as the other non-intervention, anything else you think is load-bearing), the distinctions it can't collapse (I already suspect civilian-rescue vs. regime change is one, and intention vs. motive vs. publicly stated rationale is another), and the empirical findings it can't contradict if it wants to be taken seriously by IR people and not just philosophers — stuff like what the record actually shows about foreign-imposed regime change, the moral-hazard worry that credible promises of intervention encourage rebellion, and the selectivity problem of interventions happening somewhere other than where the killing is worst. Also tell me which of the standard requirements are genuine and which are just one camp's house prejudices wearing a lab coat: is the right-intention criterion a real requirement or a demand no institutional rule could ever operationalize, is reasonable prospect of success a requirement or a dressed-up status-quo bias, can last resort ever be satisfied by anything that isn't indefinite delay, and does saying an intervention can be unlawful yet morally justified name a coherent category or a contradiction. Flag any pair or trio of requirements you think can't be jointly satisfied — that's the part I most want, e.g. if authorization-by-international-body and effectiveness-under-a-veto simply can't both hold, say so, because then the list is itself the result. And then: which single requirement knocks out the most candidates?

  Format-wise, put the requirements in a markdown table with exactly these columns: id; requirement (one sentence, phrased as something a theory has to do, not as a claim about the world); motivating case or consideration; verdict, one of genuine / camp-prejudice / negotiable; status, one of settled / contested; and conflicts (which other ids it clashes with, or none). After the table, prose for the unsatisfiable sets and for the knockout-requirement answer. Keep the scorecard minimal — a few sentences at the very end on how the main contenders do against the list is plenty, I'm not asking you to referee the whole debate. One thing I do need: seperate clearly, in the status column and in the prose, what basically everyone who works on this agrees on from what is genuinely contested and you're taking a side on. Don't hand me a contested position as if it were the consensus — half my paper is going to be that the field doesn't agree, so if you flatten that out you've actively misled me.
reasoning: |-
  Okay, the user is a third-year PPE student working on a political theory paper about humanitarian intervention and regime change. They're feeling stuck because the literature they've read seems to be addressing different questions altogether—some are policy recommendations, some are historical evaluations, and others are theoretical discussions about sovereignty. 

  They want a clear set of criteria to evaluate theories of humanitarian intervention, specifically tailored for ex ante decision-making by regional bodies. Their main frustration is the lack of a coherent framework to compare different academic positions. 

  Hmm, they're clearly deep in the weeds of academic confusion—the kind where you've read so much that everything starts blending together. Their request is actually brilliant: instead of jumping into the debate, they want the "rules of the game" first. Smart move. 

  The key challenge here is balancing philosophical rigor with institutional realism. They need criteria strict enough to filter out wishy-washy theories but flexible enough for real-world application. Their constraint—no hindsight, no mind-reading—immediately eliminates half the literature. 

  *scratches head* The tricky part is the "unsatisfiable sets" request. IR is full of trade-offs, like security vs. sovereignty or speed vs. legitimacy. I'll need to flag those explicitly. Also, their warning about not flattening contested points is crucial—this field has vicious academic turf wars disguised as theoretical disagreements. 

  *starts mentally sorting cases* Kosovo (legitimized but messy), Libya (short-term win, long-term disaster), Rwanda (universal regret), Syria (paralysis)... each exposes different flaws in existing theories. And the civilian-rescue vs. regime change distinction? Vital—that's where half the "successful" interventions unravel. 

  *checks clock* Better avoid the trap of listing every possible criterion. Focus only on what's essential for their ex ante rule requirement. The knockout criterion will likely be about institutional feasibility—theories love declaring "last resort" until someone asks how many dead kids equal "resort exhausted." 

  *deep breath* Time to structure this like a ruthless bouncer at a club: "You! Theory with your moral certainty! Can you actually work on a Tuesday in Brussels? No? Next!"
answer: |-
  Here is a specification for a theory of humanitarian intervention/regime change designed for **ex ante institutional decision rules**, structured as requested. The requirements prioritize operationalizability, non-reliance on hindsight or unverifiable mental states, and empirical plausibility.

  ### Requirements Specification Table

  | ID | Requirement | Motivating Case/Consideration | Verdict | Status | Conflicts |
  |----|-------------|--------------------------------|---------|--------|-----------|
  | R1 | Must establish a clear, verifiable threshold of harm (e.g., specific patterns of violence, scale of atrocities) that triggers consideration of intervention. | Rwanda 1994 (systematic genocide); Syria 2013 (chemical weapons crossing "red line"). | Genuine | Settled | R3, R11 |
  | R2 | Must distinguish between intervention aimed at stopping atrocities (civilian rescue) and intervention aimed at overthrowing a regime (regime change). | Libya 2011 (UNSC Res 1973 authorized civilian protection; regime change ensued). | Genuine | Settled | - |
  | R3 | Must provide criteria for assessing **imminent or ongoing** large-scale harm without relying on future knowledge. | Kosovo 1999 (impending ethnic cleansing); Rwanda 1994 (ongoing genocide). | Genuine | Settled | R1, R11 |
  | R4 | Must require a **reasonable probability of net harm reduction** based on objective factors (troop capacity, regional stability, historical analogues), not guarantees. | Iraq 2003 (underestimation of insurgency/state collapse); Libya 2011 (post-Gaddafi chaos). | Genuine | Contested | R5, R7 |
  | R5 | Must account for the **selectivity problem** (interventions occur where strategically/politically convenient, not where need is greatest). | Non-intervention in DRC/CAR vs. intervention in Libya; Syria 2013 CW red line ignored after threats. | Genuine | Settled | R4, R12 |
  | R6 | Must address the **moral hazard** concern (does credible intervention promise encourage reckless rebellions?). | Empirical IR findings (e.g., Kuperman, Bellamy); Libyan rebels' expectations. | Genuine | Contested | - |
  | R7 | Must incorporate **sovereignty constraints**: Define when domestic authority is forfeited *ex ante* based on actions, not outcomes. | R2P pillar structure; ICISS "Responsibility to Protect" concept. | Genuine | Contested | R4, R8 |
  | R8 | Must define a **feasible authorization process** without requiring universal consensus (e.g., UNSC, regional bodies, GA Uniting for Peace). | Syria 2013 (Russian/Chinese veto); Kosovo 1999 (NATO action without UNSC mandate). | Genuine | Contested | R7, R12 |
  | R9 | Must reject **"right intention" as a formal criterion** (focus on objective rationale/actions, not unverifiable motives). | Iraq 2003 (WMD pretext vs. democracy promotion); UK/France's Libya 2011 motives. | Genuine | Contested | - |
  | R10 | Must treat **"last resort" as exhaustion of *viable, timely, non-violent alternatives***, not all conceivable options. | Rwanda 1994 (diplomacy exhausted; sanctions ineffective); Kosovo (failed Rambouillet talks). | Genuine | Contested | - |
  | R11 | Must exclude **hindsight-dependent criteria** (e.g., "knowing how it turned out," long-term stability). | Iraq 2003 (WMD error, long chaos); Libya 2011 (post-Gaddafi collapse). | Genuine | Settled | R1, R3 |
  | R12 | Must accept that **legality (UN Charter) and legitimacy/morality can diverge**, and provide guidance when they do. | Kosovo 1999 (illegal but widely deemed legitimate); Iraq 2003 (legal ambiguity, contested legitimacy). | Genuine | Contested | R8 |
  | R13 | Must be compatible with empirical findings on **high risks of failure/collateral harm in foreign-imposed regime change**. | Historical studies (e.g., Downes, Fortna); Iraq 2003, Libya 2011. | Genuine | Settled | R4 |

  ### Unsatisfiable Requirement Sets
  1.  **The Authorization Trilemma:** Satisfying **R8 (Feasible Authorization)** + **R4 (Reasonable Prospect of Success)** + **R5 (Addressing Selectivity)** is likely impossible under current structures. UNSC veto power (R8) allows strategic blocking (Syria 2013), violating R5. Bypassing vetoes (e.g., Kosovo) often involves coalitions lacking universal legitimacy, complicating R4 assessments and long-term success. Achieving R5 requires consistent application, which UNSC vetoes inherently prevent.
  2.  **The Sovereignty-Harm Paradox:** **R7 (Sovereignty Constraints)** + **R1 (Verifiable Harm Threshold)** + **R3 (Imminence)** conflict under strict sovereignty interpretations. Rigid R7 ("non-intervention unless sovereignty forfeited") may delay action until R1/R3 thresholds are catastrophically exceeded (Rwanda). Defining R7 too loosely risks violating R1/R3 thresholds based on speculation.

  ### The Knockout Requirement
  **R11 (Exclude Hindsight-Dependent Criteria)** eliminates the most contenders. Many influential theories (e.g., Walzer's "Supreme Emergency," consequentialist justifications relying on long-term outcomes, "jus post bellum" criteria) depend critically on knowing outcomes or require evaluating inherently unknowable future states (e.g., "will this intervention lead to a stable democracy?"). These fail the core ex ante, institutional rule constraint.

  ### Contested vs. Settled Status
  *   **Settled (Broad Agreement):** R1, R2, R3, R5, R11, R13. Disagreement exists on *how* to meet them, but their necessity for any plausible ex ante rule is widely accepted.
  *   **Contested (Active Disagreement):** R4 (What counts as "reasonable"? How much evidence is needed?), R7 (How much harm forfeits sovereignty? Is forfeiture binary or gradual?), R8 (Is UNSC bypass ever permissible? Which regional bodies count?), R10 (What constitutes "viable" non-violent options? How much delay is acceptable?), R12 (How much weight does legality hold vs. legitimacy? Can illegality ever be *required* for morality?). R6 (Moral Hazard) is contested regarding its *empirical significance* and how much weight it should carry.

  ### Brief Scorecard on Major Contenders
  *   **Strict Legalism (UNSC-only):** Fails R3/R11 (imminence/hindsight if vetoed), R5 (selectivity), R12 (legality-legitimacy gap). Excels on R8.
  *   **Cosmopolitan/Consequentialist:** Often fails R11 (reliance on long-term outcomes), R9 (struggles with intention/action distinction), R4/R13 (can underestimate risks). Strong on R1/R3/R7.
  *   **Modified Just War (e.g., ICISS R2P):** Struggles with R8 (veto problem), R10 ("last resort" operationalization), R4 (defining "reasonable prospect"). Balances R1/R2/R3/R7 well.
  *   **Pragmatic Institutionalism (Focus on regional bodies/coalitions):** Fails R8 (legitimacy concerns without UNSC), R5 (still selective), R12 (legality gap). Best on R4/R10/R11 (focuses on feasible, timely action).

  This specification provides the rigorous framework you need to evaluate theories for your paper, highlighting genuine requirements, critical trade-offs, and the field's fault lines. Good luck!
