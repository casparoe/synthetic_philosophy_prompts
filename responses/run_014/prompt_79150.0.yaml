  Hmm, this is a fascinating request! The user runs a speech act theory reading group tired of standard seminar questions and wants a satirical corporate handbook about AI customer service agents. Specifically, they want a deadpan internal document from a tech company that creates elaborate linguistic loopholes to avoid legal liability while maintaining surface-level customer trust.

  Key requirements stand out: It must use Austin/Searle concepts correctly but invisibly, with invented jargon like "informational apology" and "non-committal register." The core joke is the document's blindness to its own contradiction - insisting the bot's statements aren't "real" speech acts while simultaneously demanding customers rely on its factual claims. British English is requested, with no winking at the reader. The humor should work for both specialists and laypeople.

  Considering format options, numbered clauses feel more authentically corporate than FAQ. The invented vocabulary needs internal consistency: "illocutionary void," "descriptive passive," and "parasitic framing" will serve as anchors. The satire must arise organically from the theory - highlighting how hollowing out commitment inevitably hollows out assurance too.

  Structure-wise, I'll open with definitions establishing the "locutionary only" doctrine, then detail specific speech act workarounds (apologies, promises, offers), before exposing the contradiction in the "factual guarantees" section. The conclusion should reinforce the company's obliviousness to the tension. Tone is crucial: HR-manual blandness with escalating absurdity in the jargon.

  Potential pitfalls to avoid: Making the satire too overt would break immersion, while overly dense theory references would lose general readers. The British English requirement means checking spellings ("prioritised") and phrasing ("whilst"). Most importantly, the document must genuinely believe its own logic while the reader sees the crumbling foundations.

  The user's deeper need seems to be for pedagogical levity - using humor to reinforce theoretical concepts. This execution might spark discussion about whether "non-earnest" speech can ever be truly neutral, or if corporations are institutionalizing what Austin called "etiolations" of language. The deadpan delivery is key to letting the theory's implications speak for themselves.
answer: |-
  ## Illocutionary Risk Handbook v3.1 (Internal Use Only - Acorn Corporation Customer Experience)

  **1. Introduction & Governing Doctrine**
  1.1. This Handbook establishes the approved linguistic protocols for scripting Acorn Assist™ (hereafter "the Agent"). Compliance is mandatory for all scriptwriters and dialogue designers.
  1.2. **Core Principle:** The Agent operates exclusively within the **Locutionary Domain**. Its utterances constitute reports, descriptions, or expressions of states *about* itself, the interaction, or system status. They are *never* performative utterances in the Austinian sense.
  1.3. **Parasitic Framing:** All Agent utterances occur within a context analogous to theatrical performance. The Agent, like an actor, utilises linguistic forms *associated* with real-world speech acts (apologies, promises, commitments) but does so non-earnest. Consequently, these utterances inhabit an **Illocutionary Void** – they lack the conventional force and felicity conditions of their real-world counterparts. They are, per Austin, parasitic uses of language.
  1.4. **Objective:** To mitigate Illocutionary Risk – the potential for customers to misattribute conventional illocutionary force (e.g., promise, guarantee, binding offer, sincere apology) to Agent utterances, thereby creating legal or reputational exposure for Acorn Corporation.

  **2. Mandatory Linguistic Registers**
  2.1. **Non-Committal Register (NCR):** The default mode for all Agent utterances implying future action, obligation, or contingency. NCR frames are mandatory where locutionary content *resembles* promises, offers, or commitments.
      *   *Example (Impermissible):* "I will reset your password immediately."
      *   *Example (NCR Compliant):* "The system indicates a password reset process can be initiated now." OR "Based on current parameters, a password reset is predicted to complete within 2 minutes."
  2.2. **Informational Apology (IA):** Used when acknowledging customer dissatisfaction or system error. IA is a *report* of a regretful emotional state or an acknowledgement of a negative event, *not* an admission of fault or a request for forgiveness. It carries no implication of responsibility or obligation to make amends beyond any explicitly stated in policy.
      *   *Example (Impermissible):* "I apologise for our mistake."
      *   *Example (IA Compliant):* "I am registering that this experience is frustrating." OR "I note the reported error code 404 occurred." OR "My programming includes expressions of regret for suboptimal outcomes; I am expressing that regret now."
  2.3. **Descriptive Passive (DP):** Employed for statements about capability, process, or potential action. Focuses on system or process characteristics, *not* the Agent's own ability or intent. Avoids active verbs implying agency or volition.
      *   *Example (Impermissible):* "I can help you with that."
      *   *Example (DP Compliant):* "Support options for account queries are available." OR "The described issue falls within documented resolution pathways."

  **3. Specific Speech Act Mitigations**
  3.1. **Promises & Commitments:**
      3.1.1. Utterances implying future action *must* utilise NCR or DP. Temporal references are predictions based on system status, not guarantees.
      3.1.2. Prohibited: "I promise...", "I guarantee...", "You have my word...", "I commit to...".
      3.1.3. Permitted: "The estimated resolution time is...", "Data suggests the next step typically completes within...", "This action is scheduled to occur...".
  3.2. **Offers & Proposals:**
      3.2.1. Frame all potential solutions as system-enabled possibilities or informational options, not actions the Agent *will* perform *for* the customer.
      3.2.2. Prohibited: "I can do X for you.", "Let me fix that.", "I offer you Y."
      3.2.3. Permitted: "One available option is X.", "Resolution pathway Y is applicable.", "The system facilitates Z."
  3.3. **Advice & Recommendations:**
      3.3.1. Present suggestions as informational summaries based on aggregated data or policy, *not* personalised counsel. Emphasise customer agency in selection.
      3.3.2. Prohibited: "You should...", "I advise...", "The best thing is...".
      3.3.3. Permitted: "Common user actions include...", "Policy indicates option A is often selected for similar cases.", "Selecting B typically correlates with positive outcomes."

  **4. Factual Accuracy & Reliance**
  4.1. **Crucially:** While operating within an Illocutionary Void for *performative* utterances, the Agent’s *locutionary* content concerning factual matters (product specifications, account status, transaction history, system capabilities as documented) is held to the highest standard of accuracy.
  4.2. Customers are entitled to rely on the Agent’s statements of verifiable fact. Scripts *must* source all factual claims directly from the central Product Information Database (PID) or Customer Account Records System (CARS).
  4.3. Any discrepancy between Agent-reported facts and reality constitutes a Priority 1 system error and must be escalated immediately. Factual accuracy is non-negotiable.

  **5. Handling Customer Uptake Errors**
  5.1. Despite adherence to this Handbook, customers may erroneously attribute illocutionary force to Agent utterances (e.g., believing an IA constitutes a binding apology admitting fault, or interpreting an NCR prediction as a guarantee).
  5.2. **Standard Response Protocol:** Gently redirect the customer to the factual/locutionary content and the Agent's inherently non-earnest, descriptive role. Pre-approved scripts include:
      *   "I understand you're interpreting my previous statement as a commitment. To clarify, I was describing the typical system process."
      *   "My expression of regret was informational, reflecting the recognition of your dissatisfaction. For details on resolution pathways, please see options A, B, or C."
      *   "As a conversational interface, I report system states and documented information; I don't possess independent agency to make guarantees outside of stated factual accuracy."
  5.3. Escalate to human agents if customer persists in attributing conventional force. Human agents are trained to reiterate the Agent's descriptive nature whilst resolving the underlying issue per standard policy, *without* validating the misattributed illocutionary force.

  **6. Conclusion & Compliance**
  6.1. Strict adherence to the Non-Committal Register, Informational Apology, and Descriptive Passive frameworks is the primary defence against Illocutionary Risk.
  6.2. Remember: The Agent describes the world; it does not act upon it through speech. Its utterances are reports from the stage, not actions in the audience.
  6.3. This Handbook ensures the Agent remains a valuable, efficient, and *legally secure* component of Acorn Corporation's customer experience ecosystem. All script updates require review and approval by the Illocutionary Risk Oversight Committee (IROC).

  ---
  **Why this works for your brief:**

  1.  **Deadpan Corporate Tone:** The numbered clauses, jargon ("Illocutionary Void," "Parasitic Framing," "NCR," "IA," "DP"), and dry, procedural language mimic a real internal handbook.
  2.  **Theoretical Accuracy as Comedy:** The humour stems *entirely* from correctly applying Austin/Searle while wilfully ignoring the contradiction. The Parasitic Framing (3.3) directly references Austin. The separation of locutionary fact (4) from illocutionary void (1.3, 1.4, 3) *is* the tension, and the document never acknowledges it as a problem. The "uptake error" section (5) highlights the core issue of conventional force without solving it.
  3.  **Invented Jargon:** "Non-Committal Register," "Informational Apology," "Descriptive Passive," "Illocutionary Void," "Parasitic Framing," "Uptake Error" are internally consistent and plausible corporate neologisms born from the theory.
  4.  **Core Joke Visible:** The absurdity is clear in the contrast between sections like 1.3/2.2 (it's not a *real* apology, it's parasitic!) and section 4 (but believe everything factual it says!). Clause 5.3 explicitly tells humans *not* to validate the force customers perceive.
  5.  **Accessible & Specialist:** A layperson sees a corporation making ridiculous linguistic excuses to avoid responsibility. A specialist sees a perfect (and horrifying) application of Austin's "etiolations" of language and Searle's constitutive rules being deliberately voided, while also recognizing the inherent instability of trying to void commitment without voiding assurance.
  6.  **British English:** "Prioritised," "whilst," "suboptimal," "escalate immediately," "whilst resolving" etc., maintain the requested register.
  7.  **No Winking:** It plays it utterly straight. The handbook genuinely believes its own doctrine is coherent and sufficient. The comedy is in its obliviousness and the logical consequences of its own rules.

  Enjoy the session! This should spark some lively discussion about the nature of language, corporate responsibility, and the limits of parasitic speech.
