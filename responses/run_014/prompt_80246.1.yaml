prompt: |-
  here's my position on natural kinds, written down for a discussion group — can you audit whether it actually hangs together?
  (a) I'm a realist about natural kinds: the sciences discover real joints in nature, not just convenient groupings.
  (b) Biological species are natural kinds, but not the way 'water' is: they're historical entities, defined by the evolutionary processes that produced and maintain them, not by a shared bundle of properties.
  (c) 'Water' is a natural kind in the classic sense: reference is fixed by the stuff in the cups, and what makes it the same kind is its microstructure — so property-sharing does the work there.
  (d) 'Human' is not a natural kind, even though we're a species: the concept is tied up with our self understanding and moral status, so it's a kind we project rather than one the world has.
  (e) Moral kinds like 'person' aren't natural kinds, and that's fine — moral concepts don't need to pick out natural kinds in order to be correct.
  I dont think there's a problem here, but I've been told to expect one. Go through the pairs and tell me which tensions are real and which only look like they are, in order of severity, with what has to yield in each. Don't lecture me on the literature, just audit the package. Answer in British English, and end with a final line of the form 'Verdict: drop (x)' where (x) is the letter of the single commitment you'd sacrifice if I had to give one up.
