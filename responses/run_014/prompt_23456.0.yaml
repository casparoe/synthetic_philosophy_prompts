prompt: |-
  I'm on the board of my neighborhood food co-op (five elected directors, about 300 members) and we're close to voting on whether to take out a $60k loan to buy a used delivery truck. One of the directors read about the Condorcet jury theorem and keeps pushing to expand the board to fifteen before the vote, on the theory that the bigger the group that's voting, the more likly the majority gets it right, and he points out that our last two big votes passed 5-0, which to him means we're just right and need more of us. I've been chewing on this on my own and I can't figure out if he's actually right, but I don't want to just throw a textbook at him. Can you draft a short memo I can circulate to the other directors before next Tuesday's meeting? It should recommend a concrete course of action, with a timeline we can actually follow, and it should engage his argument honestly, including the strongest version of it. A few facts that might matter: most of our members live within a couple of blocks of the store and shop the same hours, the loan only pays off if delivery demand keeps growing, which we can't really see in advance, and we haven't done any actual surveying of delivery demand, we've just been guessing.
reasoning: |-
  Okay, the user is on the board of a neighborhood food co-op with five directors. They're about to vote on a $60k loan for a delivery truck. One director wants to expand the board to fifteen members, citing the Condorcet jury theorem. This theorem says that with more independent voters, each with better than 50% accuracy, majority decisions are more likely to be correct. The director points out that their last two big votes were unanimous 5-0 decisions, which he sees as evidence they're "just right" and need more members to improve decision-making.

  The user needs a memo to circulate before next Tuesday. It should recommend a concrete action with a timeline, honestly address the director's argument, and consider the specific context. Key facts: co-op members live nearby and shop locally, the loan's payoff depends on uncertain delivery demand growth, and there's been no actual survey of demand—just guesses.

  First, I need to unpack the Condorcet jury theorem. It assumes voters are independent and each has a probability greater than 50% of being correct. If those hold, then increasing the group size does improve decision accuracy. But in this situation, there are issues. The directors might not be independent since they're part of a small, tight-knit community. They likely share similar information and biases, especially given their location and shopping habits. Unanimous votes (5-0) could mean they're always correct, but it might also indicate groupthink, where dissenting opinions aren't voiced. So the independence assumption is questionable.

  The accuracy of each voter is another concern. The director assumes that since past votes were unanimous, each member is more than 50% accurate. But without knowing the actual correctness of those decisions, it's a weak basis. The current decision involves predicting future delivery demand, which is uncertain. Without data, their individual accuracy might not be better than random (50%), which would make the theorem inapplicable.

  The user mentioned no survey on delivery demand. That's a critical point. If the directors are guessing, their accuracy could be low. Expanding the board without addressing this won't help. Instead, gathering data should be the priority.

  The memo needs to propose a concrete plan. Expanding the board to fifteen is impractical before the loan vote. It would require an election, which takes time. Even if done, new members might lack context, leading to poor decisions. Also, fifteen directors might be too big for efficient governance long-term.

  Alternative solutions: Focus on improving decision quality with the current board. Recommend a quick survey to assess delivery demand among members. This provides data to inform the vote. Also, invite external experts or use structured deliberation methods to reduce groupthink.

  The timeline should be feasible before the vote. Surveying 300 members quickly via email or in-store could work. Analyzing results in a week is possible. Then, the board can vote with better information.

  Addressing the director's argument honestly: Acknowledge the theoretical strength of the Condorcet theorem but explain why its assumptions don't hold here. Highlight the lack of independence and uncertain accuracy. Emphasize that past unanimity might not indicate correctness but could mask underlying issues.

  Recommendation: Postpone the vote, conduct a demand survey, then decide with the current board. If expansion is considered, do it separately after the loan decision, as a governance review.

  Ensure the memo is respectful, collaborative, and focuses on practical steps. The goal is better decisions through data, not just more voters.
answer: |-
  ## MEMO: Recommendation on Delivery Truck Loan Vote & Board Expansion Proposal

  **To:** Board of Directors  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Proposed Course of Action: Data Before Expansion for Truck Loan Vote  

  **Background:** We are preparing to vote on a $60k loan for a used delivery truck. Director [Name] has proposed expanding our board from 5 to 15 members before this vote, citing the Condorcet jury theorem. This theorem suggests that if each voter has a better-than-50% chance of being *correct*, a larger group is more likely to reach the *correct* decision via majority vote. He notes our past 5-0 votes as evidence we are "just right" and need more voices. While this argument is thoughtful and grounded in theory, practical concerns and the specifics of *this decision* lead me to recommend a different path.  

  ### Engaging the Condorcet Argument Honestly (Its Strengths & Limits)
  1.  **Strength of the Theory:** Director [Name] is correct *in principle*. If voters are **independent** and each has a **probability >50% of judging the *correct* outcome**, then yes, a larger group (like 15) *can* make a more accurate majority decision than a smaller group (like 5) or even a single expert. Our past unanimous votes *could* support the idea that individual directors are competent.
  2.  **Critical Assumptions & Our Reality:**
      *   **Independence:** Our board (and members) live nearby and shop similar hours. We likely share information sources, social circles, and biases ("groupthink" risk). Past unanimity (5-0) might reflect shared perspective, not necessarily independent validation of correctness. Expanding to 15 won't guarantee independence if new directors come from the same pool with similar perspectives.
      *   **Voter Competence (>50% Chance of Being Correct):** This is the crux for *this specific vote*. **The "correct" decision hinges entirely on predicting *future delivery demand growth* – something we lack data for and admit we are "just guessing."** 
          *   *Past Unanimity ≠ Future Competence:* Our past unanimous votes were on different issues with known factors (e.g., store operations, established budgets). Predicting uncertain future demand is fundamentally different and inherently harder. Success here relies on forecasting, not judgment of current facts.
          *   *Competence Threshold:* If our individual guesses about future demand are no better than a coin flip (50/50) due to lack of data, the theorem *does not apply* – a larger group is no more likely to be correct. If our guesses are *worse* than 50/50 (a real risk with no data), a larger group is *more likely* to be wrong. **The theorem amplifies existing competence; it cannot create it.** Our lack of demand data severely challenges the assumption of individual competence >50% for *this decision*.

  ### The Core Problem: Lack of Demand Data
  Expanding the board addresses the *number* of guessers, not the *quality* of the guess. The fundamental risk in this $60k decision isn't the size of our board; it's our reliance on speculation about member demand.  

  ### Recommended Concrete Course of Action & Timeline
  We should focus our limited time before the vote on **gathering critical data** to improve *every* director's competence (and any future board's competence) rather than expanding the board under time pressure.  

  1.  **Immediately Launch a Demand Survey (Start: Tomorrow, 1-2 Days Execution):**
      *   **Method:** Email/SMS survey to all ~300 members + short paper forms at checkout. Keep it simple: "How likely are you to use a delivery service 1x/month or more if offered? (Very Likely, Somewhat Likely, Unlikely, Never)". Add optional comment field.
      *   **Goal:** Get a statistically significant sample (aim for 100+ responses) to estimate actual potential demand *before* the vote.
      *   **Responsibility:** Assign 1-2 directors/staff to draft, distribute, and collate results ASAP.

  2.  **Review Survey Results & Re-Open Deliberation (Next Meeting - Tuesday?):**
      *   **Present Findings:** Share the survey data clearly at the start of the meeting.
      *   **Structured Discussion:** Use the data to ground our discussion. Does the demand justify the loan risk? Are there alternative solutions (e.g., phased rollout, partnerships)? Does the data change our initial guesses?

  3.  **Vote on the Truck Loan with the Current Board (Next Meeting - Tuesday):**
      *   **Why Current Board?** We have the context, understand the financials, and will now have *better data* to inform our individual competence. Expanding the board *now* would inject 10 new directors with no context, no time to deeply understand the financials or survey data, and no established governance rhythm. This risks a *less* informed vote, not a more competent one.
      *   **Mitigating Groupthink:** To address the valid concern about small-group dynamics:
          *   Designate a "devil's advocate" for this vote.
          *   Have directors privately write down initial positions before discussion.
          *   Actively solicit dissenting views during discussion.

  4.  **Separately Discuss Long-Term Board Governance (After Loan Vote):**
      *   **Commit:** Schedule a dedicated governance meeting within 1 month.
      *   **Evaluate:** Discuss board size, composition, term limits, and training *holistically*. Review the Condorcet argument and other governance models (e.g., policy governance). Consider if expansion truly enhances independence and competence for *future* decisions, or if other reforms (rotating committees, better training) are more effective. Seek member input on desired representation.
      *   **Decide:** If expansion is pursued, follow proper bylaws for elections, allowing adequate time for recruitment and onboarding.

  ### Timeline Summary
  *   **ASAP (1-2 Days):** Launch member demand survey.
  *   **Before Next Meeting:** Collate survey results.
  *   **Next Board Meeting (Tuesday):**
      1.  Present survey findings.
      2.  Hold data-informed deliberation (using techniques to reduce groupthink).
      3.  Vote on the $60k truck loan with the current 5-member board.
  *   **Within 1 Month:** Hold dedicated meeting on long-term board governance, including potential expansion.

  ### Conclusion
  Director [Name]'s proposal highlights a valuable theoretical point about collective decision-making. However, for *this specific, high-stakes, data-poor decision*, expanding the board immediately is unlikely to achieve the intended benefit and introduces significant practical risks. The most effective way to improve the accuracy of our vote – whether with 5 or 15 directors – is to replace speculation with data. Let's act decisively to gather that data now and vote as an informed board. We can then thoughtfully consider board structure for the long term.  

  **Recommendation:** **Postpone the board expansion vote.** **Approve launching the demand survey immediately.** **Vote on the truck loan next Tuesday using the current board, informed by survey data and structured discussion.**
