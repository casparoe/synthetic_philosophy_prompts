  Alternatively, downgrading (2)’s universality: maybe rational irrationality is less prevalent in small-scale, high-stakes environments like Athens. But Caplan’s theory hinges on vote insignificance, which applies in any large electorate. Athens had a smaller assembly, so individual votes mattered more, potentially reducing rational irrationality. The user could explore this distinction but needs evidence.

