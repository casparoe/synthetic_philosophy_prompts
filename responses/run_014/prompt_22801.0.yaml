  The user's skepticism centers on whether these assumptions hold in their three cases. For Newcomb-style problems, information about one's own action might change the world state, violating the assumption that states are independent. In strategic games (like the kidnapper's dilemma), revealing that you have information affects opponents' actions, so the "ignore" option isn't neutral. For causal vs. evidential reasoning, if the agent uses evidential decision theory, learning information might correlate with undesirable states without causation, making the "ignore" strategy impossible to evaluate consistently. 

