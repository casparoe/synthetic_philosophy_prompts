answer: |-
  ### Which View of Moral Luck Do You Actually Hold?  
  *Answer based on concrete cases, not labels. There are no right or wrong answers—only what aligns with your judgments.*  

  #### **Questions**  
  1. **The Two Drivers (with a twist)**:  
     Alex and Bailey drive equally carelessly through a neighborhood. Alex hits and kills a child who darts into the road; Bailey faces no such child and arrives home safely. Years later, Bailey insists his spotless driving record proves he is "the better person" compared to Alex. Do you agree?  
     - **A. Yes**: Bailey’s record reflects superior moral character.  
     - **B. No**: The outcome was luck; both were equally careless and morally equivalent.  

  2. **The Relocated Bigot (Circumstantial Luck)**:  
     In 1929, two people—Karl and Leo—have identical selfish, racist dispositions. Karl remains in Germany and becomes a high-ranking Nazi, committing atrocities. Leo is relocated to Canada against his will, living an ordinary life. Is Karl more blameworthy for his actions than Leo would have been if he stayed?  
     - **A. Yes**: Karl’s actions were horrific; Leo’s identical disposition never manifested similarly.  
     - **B. No**: Both had the same character; only circumstances differed due to luck.  

  3. **The CEO’s Temper (Constitutive Luck)**:  
     Emma and Finn are CEOs. Emma has a calm, fair temperament; Finn is impulsive and cruel. These traits trace to genes/upbringing (e.g., Finn endured childhood abuse). When provoked, Finn fires an employee unjustly, while Emma would never do so. If Emma *had* acted identically, would Finn be more blameworthy?  
     - **A. Yes**: Finn’s action reflects his flawed character, which he embodies.  
     - **B. No**: Finn’s temperament stems from unlucky factors; he isn’t more responsible.  

  4. **Attempted Murder (Resultant Luck & Law/Blame)**:  
     Taylor and Sam each shoot at a rival with intent to kill. Taylor’s bullet kills; Sam’s misses.  
     (a) Should criminal law punish Taylor more harshly than Sam?  
     - **A. No**: Both intended murder; the outcome was luck.  
     - **B. Yes**: Causing death warrants greater punishment.  
     (b) Setting aside law, is Taylor more blameworthy?  
     - **A. Yes**: Taylor’s actions killed someone.  
     - **B. No**: Both had identical intentions and actions; luck decided the outcome.  

  5. **The Near-Miss Driver (Asymmetry of Relief)**:  
     Jamie and Kai drive identically negligently (e.g., texting). Jamie causes a fatal accident; Kai, in the same scenario, has no car nearby and causes no harm. Kai later says: *"I feel lucky but not guilty—no harm means nothing to regret."* Is this appropriate?  
     - **A. Yes**: Guilt requires harm; relief suffices without it.  
     - **B. No**: Kai should feel guilt for the reckless act, regardless of outcome.  

  6. **Decades-Delayed Harm (Temporal Distance)**:  
     In 1990, River negligently dumps toxic waste, knowing it risks future harm. In 2020, it leaks and kills people. By 2020, River has lived 30 blameless, philanthropic years. Does this intervening life change what River deserves?  
     - **A. Yes**: The later harm is detached from River’s "current self"; less blame/punishment is due.  
     - **B. No**: Blameworthiness was fixed in 1990; the harm still flows from the original act.  

  7. **The Determined Thief (Causal Luck)**:  
     Morgan and Nile face a chance to steal $1 million undetected. Morgan, raised with empathy, doesn’t consider stealing. Nile, raised in a crime-riddled environment, steals. Is Nile more blameworthy?  
     - **A. Yes**: Nile chose to steal; upbringing doesn’t excuse.  
     - **B. No**: Their environments determined their actions; Nile isn’t responsible for his luck.  

  8. **The Uncaught Liar (Blame vs. Guilt)**:  
     Avery and Blair both lie under oath. Avery is caught and punished; Blair’s lie succeeds, aiding their career. Setting aside punishment, which is true?  
     - **A. They are equally blameworthy, but Blair should feel *more* guilt for profiting.**  
     - **B. They are equally blameworthy and should feel equal guilt—the act was identical.**  
     - **C. Blair is *less* blameworthy since they faced no consequences.**  

  ---

  ### **Scoring Key**  
  *Based on your answers, your view aligns with one or more "leaves" (positions) in the logical space of moral luck. These are defined by:*  
  - **Kind of Luck**: Resultant (outcomes), Circumstantial (context), Constitutive (character), Causal (determinism).  
  - **Object of Assessment**: Wrongness (act), Blameworthiness (agent), Guilt (affective), Punishment (sanctions).  

  *Your answers may span multiple leaves. Match patterns below:*  

  #### **Leaves**  
  1. **Strict Control Principle (Rejects All Moral Luck)**:  
     - **Answers**: 1B, 2B, 3B, 4(a)A, 4(b)B, 5B, 6B, 7A, 8B.  
     - **View**: Luck affects *nothing*. Moral assessments depend *only* on factors within an agent’s control.  

  2. **Common Intermediate (Accepts Circumstantial/Constitutive; Denies Resultant/Causal)**:  
     - **Answers**: 1B, 2A, 3A, 4(a)A, 4(b)B, 5B, 6B, 7B, 8B.  
     - **View**: Luck in *circumstances* (e.g., Karl in Germany) and *character* (e.g., Finn’s temper) affects blameworthiness. But *outcomes* (e.g., Alex killing a child) and *causal history* (e.g., Nile’s upbringing) should not.  

  3. **Mirror Image (Accepts Resultant; Denies Circumstantial/Constitutive)**:  
     - **Answers**: 1A, 2B, 3B, 4(a)B, 4(b)A, 5A, 6A, 7A, 8C.  
     - **View**: Luck in *outcomes* (e.g., Taylor killing) affects punishment and blameworthiness, but *character* (e.g., Finn’s temper) and *circumstances* (e.g., Karl in Germany) should not. Causal luck (e.g., Nile’s upbringing) is denied.  

  4. **Full-Blooded Acceptance (Accepts All Moral Luck)**:  
     - **Answers**: 1A, 2A, 3A, 4(a)B, 4(b)A, 5A, 6A, 7B, 8C.  
     - **View**: All luck types affect all objects. Outcomes, circumstances, character, and causal history change wrongness, blame, guilt, and punishment.  

  5. **Two-Level Views (Mixed Objects)**:  
     - *Examples (no fixed pattern)*:  
       - **Blameworthiness ≠ Guilt**: E.g., 4(b)B (equal blame for murder attempt), but 8A (more guilt for Blair).  
       - **Wrongness ≠ Punishment**: E.g., 4(a)B (harsher punishment for Taylor), but 4(b)B (equal blame).  
     - **View**: Luck affects *some objects* but not others (e.g., changes punishment but not wrongness).  

  6. **Revisionist/Deflationary (Incoherence Diagnosis)**:  
     - **Answers**: *Inconsistent* (e.g., 1B, 2A, 3B, 4(a)A, 4(b)A) OR *systematically minimizing* (e.g., 3B, 7B, 8C).  
     - **View**: Moral luck reveals *incoherence* in blame practices. We should *curtail* judgments (e.g., reject blame for constitutive/causal luck).  

  ---

  ### **Notes**  
  1. **Indistinguishable Pair**: The quiz **cannot separate** two views:  
     - **Hard-Line Control**: Character is *not a matter of luck* because it is "who you are," not something that happens to you.  
     - **Prior-Choice View**: Character *was* self-chosen at an earlier stage (e.g., "Paul chose the gang as a teen").  
     - **Why?** Both yield 3A and 9A. Adding a case with *no prior choice* (e.g., innate temperament) would be needed.  

  2. **Unoccupied Cells**: Some combinations lack representation:  
     - **Resultant luck affects *wrongness* but not *blameworthiness***: Incoherent—if an act isn’t wrong, how can one be blameworthy?  
     - **Causal luck affects *guilt* but not *blameworthiness***: Unattractive—guilt should track blame, not externalize it.  
     - **Constitutive luck affects *punishment* but not *wrongness***: Unexplored—possible but rarely argued.  

  This diagnostic isolates *your* judgments from labels. Use mismatches to challenge intuitions!
