  We are constructing a diagnostic quiz to determine which view of moral luck a student holds, without using labels in the questions. The logical space is defined by two dimensions:

  Dimension 1: Kind of luck
     A. Resultant luck (luck in the outcome of one's actions)
     B. Circumstantial luck (luck in the circumstances one faces)
     C. Constitutive luck (luck in one's character, temperament, or dispositions)
     D. Causal/determinism luck (luck in the causal chain or the fact that one's actions are determined by prior causes)

  Dimension 2: Object of moral assessment
     1. Whether the act was wrong (deontic status)
     2. How blameworthy the agent is (degree of blame)
     3. What it is appropriate for the agent to feel guilty about (affective response)
     4. What sanctions or punishment would be proportionate (practical consequences)

  Positions are regions in this 4x4 grid (but note that causal/determinism luck may have a different footprint). The quiz will have 8-10 questions, each a concrete case with 2-3 answer options. The set must include:

  1. The two drivers case (resultant luck) with a twist: ask about the surviving driver's claim that his spotless record shows he is the better man.
  2. A circumstantial luck case (like Nagel's: two people with the same vicious disposition, one in 1929 Germany, one moved abroad).
  3. A constitutive luck case (temperament from genes and upbringing).
  4. A question about attempted murder vs. completed murder, comparing law and blameworthiness.
  5. A near-miss asymmetry case (driver whose negligence came to nothing: does he have more reason to feel lucky than relieved of guilt?).
  6. A temporal distance case (same negligent act, harm decades later: does the intervening life change what is deserved?).

  We also need at least two additional cases of our own invention (we will use the near-miss and temporal distance as two, so we are covered).

  Scoring key will map to leaves:

  - Strict control principle: rejects moral luck in all kinds and for all objects.
  - Common intermediate: accepts circumstantial and constitutive luck, denies resultant luck (and perhaps causal luck).
  - Mirror image: accepts resultant luck but denies circumstantial and constitutive (and perhaps causal) luck.
  - Full-blooded acceptance: accepts moral luck in all kinds and for all objects.
  - Two-level views: accepts luck for some objects but not others (e.g., affects blameworthiness but not wrongness).
  - Revisionist/deflationary: the phenomenon shows incoherence, so we should curtail blame practices.

  Flag a pair that the quiz cannot separate and either add a question or note they are indistinguishable.

  Finally, note unoccupied cells and why.

  Now, let's design the questions.

  Question 1: Resultant luck (with twist) [Drivers]
     Case: Two drivers, Alex and Bailey, are equally careless driving through a residential area. Alex hits and kills a child who darted into the street. Bailey, in the same situation, has no child dart out and arrives home safely. Years later, Bailey boasts: "My spotless driving record shows I'm a better person than Alex." Do you agree with Bailey?
     Options:
       A. Yes, Bailey is right: the fact that no one was hurt shows Bailey is a better person.
       B. No, Bailey is wrong: the outcome was a matter of luck, and they were equally careless. The record doesn't reflect a moral difference.

  Question 2: Circumstantial luck [Nagel-inspired]
     Case: In 1929, two young men, Carl and David, have the same cruel and selfish dispositions. Carl remains in Germany, where he becomes a high-ranking Nazi and commits atrocities. David is relocated to Canada by his family and lives an ordinary, unremarkable life. Is Carl more blameworthy for his actions than David would have been if he had stayed in Germany?
     Options:
       A. Yes, because Carl actually did terrible things, while David did not.
       B. No, because they had the same dispositions and the only difference was their circumstances.

  Question 3: Constitutive luck
     Case: Emma and Fiona are both CEOs. Emma is known for her calm and generous temperament, while Fiona is known for her quick temper and vindictiveness. These temperaments are largely the result of their genes and upbringing. When faced with a similar provocation, Fiona lashes out and fires an employee unfairly, while Emma handles the situation fairly. Is Fiona more blameworthy for her unfair action than Emma would be if she had acted the same way?
     Options:
       A. Yes, because Fiona's action reflects her bad character, which is fixed and she is responsible for it.
       B. No, because her character was formed by factors beyond her control (genes and upbringing), so she is not more blameworthy.

  Question 4: Attempted vs. completed murder (resultant luck and object: law and blame)
     Case: Two people, Greg and Henry, each attempt to murder their enemy by shooting at them from a distance. Greg's shot kills the victim. Henry's shot misses, and the victim runs away. Assuming the same intention and care in planning, should the criminal law punish Greg and Henry equally?
     Options:
       A. Yes, the law should punish them equally because they both attempted murder and the outcome was a matter of luck.
       B. No, the law should punish Greg more severely because he actually killed someone.

