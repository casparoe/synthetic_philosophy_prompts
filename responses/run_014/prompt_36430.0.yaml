     Case: Two drivers, Ivy and Jack, are equally negligent in checking their blind spots while changing lanes. Ivy causes a multi-car pileup, injuring several people. Jack, in the same situation, has no car in his blind spot and causes no harm. Later, Jack says: "I feel incredibly lucky that no one was hurt, but I don't feel guilty because no harm was done." Is this an appropriate response?
     Options:
       A. Yes, because without harm there is nothing to feel guilty about, but he should feel lucky.
       B. No, he should feel guilty for the negligent act regardless of the outcome.

  Question 6: Temporal distance
     Case: In 1990, Kelly negligently disposes of toxic waste in a way that is very likely to cause harm. The harm doesn't occur until 2020, when the waste leaks and poisons the water supply, killing several people. In the intervening 30 years, Kelly has lived a blameless life and become a respected community member. Should the fact that the harm occurred so much later and after a good life change what punishment or blame Kelly deserves?
     Options:
       A. Yes, because the person who committed the act in 1990 is not the same person now, so less punishment is deserved.
       B. No, the harm was caused by the act in 1990, and the blameworthiness is fixed at that time.

  Question 7: Causal/determinism luck
     Case: Two individuals, Leo and Mia, each face a situation where they could easily steal a valuable item without being caught. Leo was raised in a loving environment that taught him respect for others' property, so he doesn't even consider stealing. Mia was raised in a neglectful environment where she had to steal to survive, and she steals the item. Is Mia more blameworthy than Leo for the act of stealing?
