prompt: |-
  So I've been thinking about resentment lately — like, when it feels justified to resent someone and when it doesn't. Not in a abstract philosophical way (I'm not a philosopher, I just fell down a rabbit hole after a bad falling-out with a friend). I started keeping track of my gut reactions to different situations, real and imagined, and now I'm trying to figure out if there's a coherent principle behind them or if I'm just inconsistent. Here's what I've got:

  - A colleague takes credit for my work in a meeting. I resent them. Seems clear.
  - A friend forgets we had plans because their parent had a medical emergency. I don't resent them at all.
  - A friend forgets we had plans because they were binge-watching a show and lost track of time. I resent them, though less than the colleague case.
  - Someone with severe schizophrenia says something cruel to me during an episode. I don't resent them — I just feel sad and want them to get help.
  - A person diagnosed with antisocial personality disorder lies to me and manipulates me for their own gain. I resent them, strongly, even though I believe their condition means they literally cannot empathize or grasp why what they did was wrong.
  - A coworker with OCD interrupts meetings constantly with compulsive rituals. I don't resent them; I see it as something to be accommodated.
  - Someone who grew up in an extremely abusive household and never had a chance to learn emotional regulation screams at me during an argument. I'm genuinely torn — part of me resents them, part of me thinks they never had a fair shot at turning out differently.
  - A stranger cuts me off in traffic because they're texting. I resent them.
  - A stranger cuts me off in traffic because they're rushing someone to the hospital. I don't resent them.

  The ones that bug me are the sociopath case and the abusive-upbringing case sitting next to the schizophrenia and OCD cases. In all four, there's a sense in which the person "can't help" being the way they are — but I'm pulling in totally different directions. With the schizophrenic person and the OCD coworker, I drop resentment entirely. With the sociopath, I don't. With the abuse survivor, I'm stuck in the middle.

  Is there a principle that makes sense of all these verdicts? And if not, which ones should I reconsider? Also, what would your principle say about a case I keep going back and forth on: someone commits a serious crime while in the grip of a severe addiction — not a one-time lapse, but a years-long substance use disorder that has demonstrably rewired their decision-making. Should I resent them, or not?

  Please keep your answer to under 400 words — I want the principle stated clearly and then applied, not a essay.
reasoning: |-
  Okay, the user is grappling with resentment across various scenarios, trying to find a unifying principle. Let me start by listing their examples: colleague stealing credit (resent), friend forgetting due to medical emergency (no resent), friend forgetting due to binge-watching (resent), schizophrenia cruelty (no resent), antisocial PD manipulation (resent), OCD interruptions (no resent), abuse survivor screaming (torn), texting driver (resent), hospital rush driver (no resent). The key conflict is between cases where someone "can't help" it but resentment varies—especially sociopath vs. schizophrenia/OCD, and the abuse survivor case.

  First, I need to identify common threads. Notice that in no-resent cases (medical emergency, schizophrenia, OCD, hospital driver), the harmful action is either involuntary or stems from external necessity. The person isn't choosing to cause harm; it's a byproduct of circumstances beyond their control. In contrast, resent cases (colleague, binge-watching, texting driver) involve voluntary negligence or malice—like choosing to take credit or ignore plans for a show.

  The tricky ones are ASPD and abuse survivor. ASPD involves intentional harm, even if they can't empathize. The choice to act maliciously is present, hence resentment. For the abuse survivor, their emotional dysregulation isn't chosen, but their outburst is a voluntary expression. The user feels torn because the person's background reduces culpability, but the action itself is still a choice in the moment. 

  The addiction example: if the crime is directly driven by the addiction (e.g., stealing to buy drugs), it's less voluntary; if it's premeditated harm unrelated to substance need, more voluntary. 

  So the core principle is control and intentionality. Can the person control the action? Did they intend harm or choose negligence? 

  Now, applying this: the sociopath intentionally manipulates, so resentment holds. The abuse survivor's scream, while influenced by past trauma, is still a controllable reaction in the moment, so some resentment is valid but perhaps tempered by compassion. The addict committing a crime to feed addiction has reduced control, so resentment might be mitigated, but not if the crime was unrelated and fully chosen.
answer: |-
  Here's a concise principle derived from your examples, followed by application:

  **Principle:** Resentment arises when you perceive **harm caused by a *chosen* action (or inaction) that disregarded your legitimate needs or boundaries**, where the person had **sufficient agency and awareness** to act differently.

  ### Applying the Principle
  1.  **Colleague takes credit (Resent):** Deliberate, chosen deception for gain.
  2.  **Friend forgets (Medical Emergency - No Resent):** Harm unintended; action *necessitated* by crisis, not choice.
  3.  **Friend forgets (Binge-Watching - Resent):** Chosen prioritization of leisure over commitment.
  4.  **Schizophrenia Episode (No Resent):** Harm not chosen; actions stem from uncontrollable symptoms.
  5.  **Antisocial PD Manipulates (Resent):** *Intentional* harmful actions chosen to achieve their goal, despite lack of empathy. Agency exists in *how* they act.
  6.  **OCD Rituals (No Resent):** Harm unintended; action is an uncontrollable compulsion, not a chosen disregard.
  7.  **Abuse Survivor Screams (Torn - Valid):** Harm results from *chosen* (though dysregulated) expression of anger, not uncontrollable symptoms. Their history reduces blameworthiness but doesn't eliminate the element of choice *in that moment*.
  8.  **Texting Driver (Resent):** Chosen, negligent disregard for safety.
  9.  **Hospital Rush Driver (No Resent):** Harm unintended; action *necessitated* by emergency.

  ### Addressing Your Conflicts
  *   **Sociopath (ASPD) vs. Schizophrenia/OCD:** ASPD involves *chosen harmful actions* (manipulation, lying). Schizophrenia/OCD involve *uncontrollable symptoms*. The principle hinges on **control over the specific harmful behavior**, not just the condition.
  *   **Abuse Survivor:** The scream is a *chosen expression* (even if dysregulated), not an uncontrollable compulsion/hallucination. Resentment is coherent under the principle, though compassion is warranted.

  ### The Addiction Case
  Applying the principle: If the crime was a **direct, foreseeable consequence of the addiction's compulsion** (e.g., theft solely to obtain drugs during withdrawal), resentment is significantly reduced – the *choice* is severely impaired. If the crime involved **conscious planning or unrelated malice** exploiting addiction as an excuse, resentment is more justified. The principle focuses on the **degree of volition/control over the *specific harmful act*** in the moment.
