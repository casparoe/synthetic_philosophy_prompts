prompt: |-
  For a workshop on AI safety, write the desiderata that any adequate account of latent knowledge in language models and its elicitation must satisfy. It must specify what counts as latent knowledge, what counts as elicited rather than prompted, and what evidence distinguishes the model’s possession of a fact, rule, or disposition from lucky guessing, context copying, or evaluation-specific artifacts. For each desideratum, give the motivating failure mode, mark which requirements are non-negotiable for safety-critical elicitation and which are methodological preferences, and flag any pair that may be jointly unsatisfiable, such as broad coverage and controlled inference. Do not survey particular elicitation methods; the point is the standard they would have to meet.
reasoning: |-
  We are designing desiderata for an account of latent knowledge in language models and its elicitation for an AI safety workshop.

  Key Definitions:
  - Latent Knowledge: Knowledge that is present in the model (i.e., represented in the model's parameters) but not readily accessible through standard prompting. It must be elicited by specialized techniques.
  - Elicitation: A process that makes the latent knowledge accessible (e.g., via model outputs) without simply copying from the context (prompt) and without relying on lucky guesses or evaluation-specific artifacts.

  The desiderata must address:
  1. What counts as latent knowledge?
  2. What counts as elicited (vs. prompted)?
  3. What evidence distinguishes genuine possession from artifacts?

  We also need to:
  - For each desideratum, provide a motivating failure mode.
  - Mark non-negotiable requirements for safety-critical elicitation and methodological preferences.
  - Flag pairs that may be jointly unsatisfiable.

  Let's outline the desiderata:

  1. **Definition of Latent Knowledge**:
     - *Desideratum*: Latent knowledge must be defined as information that is represented in the model's parameters and can be consistently elicited under appropriate conditions, but is not surface-accessible via naive prompting.
     - *Motivating Failure Mode*: Without a clear definition, we might conflate model capabilities (e.g., memorization) with true internal representations, or mistake prompt leakage for latent knowledge.
     - *Status*: Non-negotiable (for clarity and to avoid false claims of elicitation).

  2. **Elicitation vs. Prompting**:
     - *Desideratum*: Elicitation must involve techniques that go beyond simple prompting (e.g., zero-shot, few-shot) by actively probing the model's internal state or altering the inference process to reveal deeper representations. The elicited output should not be trivially copied from the prompt or training data.
     - *Motivating Failure Mode*: If we count prompting as elicitation, we might attribute to latent knowledge what is actually just pattern matching or context copying.
     - *Status*: Non-negotiable (to ensure we are getting at the model's knowledge and not just its ability to repeat).

  3. **Distinguishing Genuine Knowledge from Artifacts**:
     - *Desideratum*: There must be evidence that the model's response is based on internal representation rather than:
       (a) Lucky guessing: by showing consistency across multiple related queries or perturbations.
       (b) Context copying: by ensuring the response is not present in the immediate context and requires combining information from different parts of the model's knowledge.
       (c) Evaluation-specific artifacts: by using diverse evaluation settings and adversarial testing to break superficial correlations.
     - *Motivating Failure Mode*: Without such evidence, we might build safety systems on unreliable model outputs that fail under distribution shift or adversarial inputs.
     - *Status*: Non-negotiable (especially for safety-critical applications).

  4. **Robustness and Consistency**:
     - *Desideratum*: Elicitation must be robust to variations in the elicitation method (e.g., different prompts for the same technique) and consistent across multiple runs and model samples. The same latent knowledge should be recoverable by independent methods.
     - *Motivating Failure Mode*: Inconsistent elicitation may indicate that the method is sensitive to noise or that the knowledge is not stably represented.
     - *Status*: Non-negotiable for safety (we need reliable access to the knowledge when it matters).

  5. **Causal Attribution**:
     - *Desideratum*: The method should provide evidence that the elicited output is causally linked to the latent knowledge (e.g., via interventions like ablation or activation editing). This helps rule out spurious correlations.
     - *Motivating Failure Mode*: Without causal evidence, we might attribute an output to a particular piece of knowledge when it is actually due to an unrelated factor.
     - *Status*: Methodological preference (causal evidence is ideal but may be difficult to obtain; however, for safety-critical applications, it becomes more important).

  6. **Coverage and Generality**:
     - *Desideratum*: The account should cover a broad range of knowledge types (facts, rules, dispositions) and be applicable across model architectures and scales.
     - *Motivating Failure Mode*: An account that only works for one model or one type of knowledge is of limited use for safety.
     - *Status*: Methodological preference (broad coverage is desirable but may be at odds with precision).

  7. **Controlled Inference**:
     - *Desideratum*: The elicitation method should allow for precise control over which knowledge is elicited and when, to avoid unintended side effects (e.g., eliciting harmful knowledge without safeguards).
     - *Motivating Failure Mode*: Uncontrolled elicitation might reveal dangerous information or trigger unsafe behaviors.
     - *Status*: Non-negotiable for safety-critical elicitation (we must have control to prevent harm).

  8. **Efficiency and Scalability**:
     - *Desideratum*: The elicitation method should be efficient enough to be used at scale and in real-time systems.
     - *Motivating Failure Mode*: Methods that are too slow or resource-intensive won't be practical for deployment.
     - *Status*: Methodological preference (for practical use, but not a core requirement for defining the account).

  Now, flag pairs that may be jointly unsatisfiable:

  - **Coverage and Controlled Inference (6 and 7)**: Broad coverage might require more general elicitation techniques, which could be harder to control precisely. Conversely, highly controlled methods might be tailored to specific knowledge and thus not general.
  - **Robustness and Efficiency (4 and 8)**: Highly robust methods (e.g., multiple runs, adversarial testing) might be computationally expensive, conflicting with efficiency.

  We organize the desiderata:

  Non-negotiable (for safety-critical elicitation):
  1. Definition of Latent Knowledge
  2. Elicitation vs. Prompting
  3. Distinguishing Genuine Knowledge from Artifacts
  4. Robustness and Consistency
  7. Controlled Inference

  Methodological preferences:
  5. Causal Attribution
  6. Coverage and Generality
  8. Efficiency and Scalability

  Now, write each in a structured way.
answer: |-
  ### Desiderata for an Account of Latent Knowledge in Language Models and Its Elicitation  
  *For AI Safety Workshop*  

  An adequate account of **latent knowledge** (knowledge embedded in a model's parameters but not surface-accessible) and its **elicitation** (techniques to extract this knowledge) must satisfy the following desiderata. These ensure rigor for safety-critical applications, such as detecting hazardous capabilities or biases. Desiderata are categorized by **non-negotiable safety requirements** (essential for reliability in high-stakes contexts) and **methodological preferences** (valuable but flexible for research). Conflicting pairs are flagged.  

  ---

  #### **1. Definition of Latent Knowledge**  
  **Desideratum**: Latent knowledge must be defined as information *implicitly represented* in the model’s parameters, which can be systematically recovered via elicitation but is not directly accessible through naive prompting (e.g., standard zero-shot queries). It encompasses facts, rules (e.g., logical principles), and behavioral dispositions (e.g., deceptive tendencies).  
  - **Motivating Failure Mode**: Without this, trivial memorization (e.g., verbatim training data recall) might be misclassified as latent knowledge, inflating perceived model capabilities.  
  - **Status**: Non-negotiable. Safety requires precise boundaries to avoid false positives in risk assessments.  

  #### **2. Elicitation vs. Prompting**  
  **Desideratum**: Elicitation must involve methods that *actively probe internal representations* (e.g., activation steering, contrast-consistent search) rather than surface-level prompting. A response is "elicited" only if it cannot be trivially predicted from the prompt context, training data leakage, or simple pattern extension (e.g., next-token autocomplete).  
  - **Motivating Failure Mode**: Standard prompting often retrieves shallow associations or copies context (e.g., "Paris is the capital of France" appearing verbatim in the prompt), conflating prompting with true elicitation.  
  - **Status**: Non-negotiable. Safety-critical use cases (e.g., uncovering deception) demand distinguishing deep access from superficial prompting.  

  #### **3. Distinguishing Knowledge from Artifacts**  
  **Desideratum**: Evidence must differentiate *genuine knowledge possession* from:  
  - **Lucky guessing**: Show consistency across semantic variations of queries (e.g., "Where did Marie Curie work?" vs. "What institution employed Curie?").  
  - **Context copying**: Require responses absent from the immediate context (e.g., no mentions of "Curie" in the prompt).  
  - **Evaluation artifacts**: Use adversarial tests (e.g., perturbing inputs to break spurious correlations) and out-of-distribution evaluations.  
  - **Motivating Failure Mode**: Models often "guess" correctly via dataset biases (e.g., always outputting "42" for math questions due to training frequency) or exploit prompt cues, leading to false confidence in unsafe behaviors.  
  - **Status**: Non-negotiable. Safety decisions cannot rely on flukes or shortcuts.  

  #### **4. Robustness and Consistency**  
  **Desideratum**: Elicitation must yield *reproducible* results under minor perturbations (e.g., rephrased queries, different random seeds) and generalize across related knowledge domains.  
  - **Motivating Failure Mode**: Brittle methods (e.g., sensitive to prompt wording) may misattribute fleeting activations to stable knowledge, causing unreliable safety audits.  
  - **Status**: Non-negotiable. Inconsistent knowledge access risks missing critical failures (e.g., intermittently elicited harmful rules).  

  #### **5. Causal Attribution**  
  **Desideratum**: The account should establish *causal links* between internal states and outputs (e.g., via interventionist methods like activation editing or ablation studies).  
  - **Motivating Failure Mode**: Correlation without causation (e.g., attention heads activating coincidentally during correct answers) may misidentify knowledge sources.  
  - **Status**: Methodological preference. Vital for mechanistic interpretability but not always feasible for real-time safety monitoring.  

  #### **6. Coverage and Generality**  
  **Desideratum**: The account should support *broad coverage* of knowledge types (facts, rules, dispositions) and model architectures (e.g., transformers, MoEs).  
  - **Motivating Failure Mode**: Narrow accounts (e.g., only fact retrieval in GPT-style models) limit safety-scoping for emerging risks (e.g., agentic planning).  
  - **Status**: Methodological preference. Desirable for comprehensive audits but not strictly necessary for targeted safety cases.  

  #### **7. Controlled Inference**  
  **Desideratum**: Elicitation must allow *precise control* over which knowledge is accessed (e.g., targeting "dangerous chemistry rules" without triggering unrelated biases).  
  - **Motivating Failure Mode**: Uncontrolled methods (e.g., broad activation probes) may elicit harmful knowledge unexpectedly or amplify undesired behaviors.  
  - **Status**: Non-negotiable. Safety requires minimizing collateral risks during elicitation (e.g., avoiding side effects).  

  #### **8. Efficiency and Scalability**  
  **Desideratum**: Methods should be *computationally tractable* for large models and scalable to real-time monitoring (e.g., low-latency elicitation in deployed systems).  
  - **Motivating Failure Mode**: Impractical methods (e.g., requiring hours per query) cannot support dynamic safety interventions.  
  - **Status**: Methodological preference. Critical for deployment but secondary to reliability in research.  

  ---

  ### **Conflicting Desiderata Pairs**  
  - **Coverage vs. Controlled Inference (6 vs. 7)**: Broad coverage often requires general, less-targeted methods (e.g., unsupervised probing), conflicting with fine-grained control. *Resolution*: Prioritize control for safety-critical cases (e.g., hazardous knowledge) and breadth for exploratory audits.  
  - **Robustness vs. Efficiency (4 vs. 8)**: High robustness (e.g., averaging over 100 query variants) can be computationally prohibitive. *Resolution*: Accept probabilistic guarantees for efficiency in time-sensitive scenarios.  

  ### **Summary of Non-Negotiables vs. Preferences**  
  | **Non-Negotiable for Safety**          | **Methodological Preferences**       |  
  |----------------------------------------|--------------------------------------|  
  | 1. Definition of Latent Knowledge      | 5. Causal Attribution               |  
  | 2. Elicitation vs. Prompting           | 6. Coverage and Generality          |  
  | 3. Distinguishing Knowledge from Artifacts | 8. Efficiency and Scalability    |  
  | 4. Robustness and Consistency          |                                      |  
  | 7. Controlled Inference                |                                      |  

  This framework ensures elicitation accounts are rigorous, safety-aware, and actionable for identifying latent risks. It avoids endorsing specific methods, focusing instead on standards for validation and deployment.
