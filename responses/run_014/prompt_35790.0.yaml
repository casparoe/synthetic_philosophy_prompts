prompt: |-
  So I'm teaching intro philosophy and putting together a discussion unit on Kavka's toxin puzzle. The original has a billionaire with a brain scanner, and my students immediately file it under sci-fi and stop caring. Build me a realistic version: a scenario where someone gets a genuine, non-trivial benefit now for forming an intention that will be pointless by the time they'd have to act on it — but no mind-reading machines and no perfect lie detecters; the thing that verifies the intention has to be an ordinary human's fallible read of you (a handshake, a solemn promise in front of witnesses, whatever). One paragraph, and it can't secretly be a normal promise case — ordinary promise-keeping has a point at execution time (reputation, the promisee relying on you), and that crutch is exactly what dissolves the puzzle, so design around it instead of stipulating it away with something cheap like "and then everyone forgets". After the scenario, show it's genuinely a toxin case: say which structural feature is doing the work (the reward tracks the intention, not the act), then walk through the two standard diagnoses — the "you can't just decide to intend" response, and the Bratman-style line that rationality applies to intention-action clusters rather than to slices — and say whether your case survives each one. Finish by telling me honestly where the case is weakest and how a skeptic would attack it.
reasoning: |-
  Okay, the user is teaching intro philosophy and wants a realistic version of Kavka's toxin puzzle without sci-fi elements. The original puzzle involves a billionaire with a brain scanner, but students dismiss it as unrealistic. The challenge is to create a scenario where someone gets a benefit for forming an intention to perform a future action that becomes pointless when the time comes, using only human fallible verification like a handshake or promise in front of witnesses. Crucially, it can't rely on reputation or reliance like normal promises, since that undermines the puzzle.

  First, I need to identify the core elements of the toxin puzzle: the reward is tied to the formation of the intention, not the action itself. The action becomes costly or pointless later. The verification must be through observable commitment, but without perfect lie detection. The challenge is to make the reward non-reputational and non-reliance-based. 

  Brainstorming scenarios: Maybe a political endorsement? Say, a candidate offers a job now if you publicly endorse them during the primaries, but by the general election, the endorsement is irrelevant. But reputation might still play a role. Another idea: a company merger. If you commit to supporting a merger now, you get a bonus. But later, the merger might be off, and voting for it could harm your career. The bonus is immediate and contractual, so no reliance later. The action (voting) happens later when circumstances changed, making it costly. Verification is through a public statement or signed pledge.

  Refining the merger scenario: Executive gets a bonus now for signing a pledge to vote for a merger at the next board meeting. Later, the merger becomes unfavorable due to market changes. Voting yes would hurt the company and the executive's standing, but the bonus is already paid. The pledge is witnessed, so intention is verified. Reputation isn't at stake because the pledge isn't public to outsiders, only internal witnesses. The bonus is contractual and non-recoverable. 

  Structural features: Reward (bonus) tracks the commitment (pledge signing), not the vote. The vote is later costly when pointless. The verification is fallible (signing could be insincere, but witnesses assess sincerity). 

  Now, the two standard responses. First, can one decide to intend? In this case, signing the pledge might be seen as forming the intention. Skeptics might say you can't truly intend if you know you'll back out. But the executive might sign sincerely at the time, planning to vote yes, but later circumstances change. The Bratman-style response: intentions are part of plans. Forming the intention now (signing) is rational because it gets the bonus, and later reassessing based on new info is also rational. So the case survives Bratman's view because the initial intention was rational in context, and abandoning it later is rational too. 

  Weaknesses: A skeptic might argue that the witnesses' verification isn't perfect. The executive could be faking the intention. But the scenario requires genuine intention formation, so if the executive is insincere, it might not count. However, the puzzle assumes sincere intention. Also, if the bonus is paid immediately, why would the company not claw it back? Need to ensure the bonus is non-recoverable. Another weakness: the later action (voting) could still have reputational consequences internally, but if the pledge is private and only the vote is public, maybe not. But if the board knows about the pledge, voting against it might harm trust. So perhaps stipulate that the pledge is confidential, only HR knows, and the vote is secret ballot. That minimizes reputational effects. 

  Also, the user mentioned avoiding stipulations like "everyone forgets," so confidentiality handles that. The case's vulnerability is the fallibility of intention verification. A skeptic might say that without a perfect lie detector, one can fake intention without truly forming it. But in philosophy, we often assume sincere intention formation for the puzzle. The key is that the benefit is for forming the intention, not for the action. The executive must genuinely intend at the time to get the reward, even if they change their mind later. The witnesses are there to pressure sincerity, but it's not foolproof. That's the realistic element. 

  Summarizing: The merger scenario with immediate bonus for signing a pledge, later costly action when circumstances change. Structural feature: reward for intention formation, not action. Survives Bratman because intention is part of a plan that includes reassessment. Weakness: fallible verification and potential residual reputational concerns.
answer: |-
  Here’s a realistic toxin-style scenario designed for classroom use, avoiding sci-fi and preserving the core puzzle:

  **Scenario:** A small-town mayor faces a contentious vote to demolish a historic bridge for a new development. A wealthy developer, needing public momentum, offers the mayor an *immediate* personal donation to her re-election campaign if she *genuinely commits now* to publicly endorse demolition at next month’s town hall. The developer verifies this by having the mayor sign a dated, notarized "Declaration of Intent" witnessed by his lawyer and the mayor’s trusted aide (creating social pressure for sincerity). Crucially, the donation is paid *instantly* via wire transfer. By the town hall, an engineering report reveals the bridge is structurally unique, making demolition politically toxic—voting "yes" would doom the mayor’s re-election. The developer no longer cares about the vote (his project shifted sites), so the *only* cost of following through is self-sabotage. The mayor genuinely intended demolition initially, but now acting on it is pure loss.

  **Structural Feature:** The benefit (campaign funds) is irrevocably secured by the *formation and verification of the intention itself*, not the act. The act (endorsement) is decoupled from consequences—it gains nothing and costs everything when the time comes.

  **Diagnosis 1: "You Can’t Just Decide to Intend"**  
  *Response:* Critics argue you can’t bootstrap intention by will alone. Here, the mayor *can* form a sincere intention at T1 (she believes demolition is best *then*). The puzzle arises *after* new information makes the intention irrational. The case survives because the challenge isn’t about *forming* the intention—it’s about whether rationality *binds* her to an obsolete intention.

  **Diagnosis 2: Bratman’s Planning Rationality**  
  *Response:* Bratman argues intentions are planning tools; abandoning them without new data is irrational. Here, *new data exists* (the report). Acting on the intention now *undermines* the plan’s goal (re-election). The case survives because Bratman allows ditching intentions when circumstances radically shift—which they do. The toxin isn’t in keeping the intention; it’s in the temporal gap between benefit and pointless cost.

  **Weakness & Skeptic Attack:**  
  The vulnerability is **residual reputation effects**. A skeptic might argue: *"Even if the developer forgets, the aide and lawyer remember. Backing out makes the mayor look indecisive, harming her reputation. Thus, acting *has* post-hoc utility—upholding ‘promise-keeping’ credibility."*  
  *Counter:* We can mitigate this by specifying the declaration is confidential (known only to parties who’ll never interact again) and the mayor’s reversal is framed as responding to new evidence (plausible deniability). But if students argue real-world observers *always* infer unreliability from reversed intentions, the "toxin" gets diluted by hidden reputational stakes. This forces a deeper debate about whether *any* social intention can be fully consequence-free—sharpening the puzzle’s challenge.

  **Why it Works:** It replaces sci-fi with mundane verification (notarized document + witnesses), eliminates execution-phase rewards (developer indifferent, action politically suicidal), and uses a relatable context (political horse-trading). The mayor’s dilemma feels visceral: take money now for a sincere plan, then face a pointless self-destructive act later.
