prompt: |-
  I've been reading about updateless decision theory, mostly blog posts about Newborn's problem, and I keep getting stuck on the name. If the agent is supposed to be "updateless," how does it ever use evidence at all? Like, I come home and the lights are on and the car's in the driveway, and that's clearly evidence that someone's home, and I'd change my beliefs about that under any decision theory I've heard of. If UDT says to be updateless, does it mean I should just ignore what I see and act like I know nothing? That seems absurd. So what does "updateless" actually mean here? What's the real idea behind it?
reasoning: |-
  Okay, the user is confused about the term "updateless" in Updateless Decision Theory (UDT). They're reading blog posts about Newcomb's problem and can't reconcile how an "updateless" agent can still use evidence. They give a relatable example: coming home, seeing lights on and a car in the driveway as evidence someone's home. They're worried UDT requires ignoring sensory input, which seems absurd. 

  Hmm, I need to unpack this carefully. The user's core confusion is semantic—they're taking "updateless" too literally. Their example shows they understand Bayesian updating perfectly well, so the issue is explaining why UDT uses this counterintuitive term. 

  First, I should validate their intuition: yes, UDT agents absolutely use evidence! The "update" in question isn't about perceptual evidence but about *self-locating beliefs* in decision problems. Their home example isn't even a decision theory puzzle—it's pure belief updating. The key is that UDT concerns problems where the agent's own decision algorithm might correlate with reality (like Omega's predictions in Newcomb's). 

  The user might be conflating two things: (1) updating on external evidence (which UDT does) vs (2) updating on the fact that "I chose X" as evidence (which it avoids). I should emphasize how in Newcomb's problem, being "updateless" means not letting your choice (one-boxing/two-boxing) affect your belief about Omega's prediction retroactively. 

  Also, they're likely reading LessWrong-style explanations. Those often assume familiarity with technical philosophy terms like "indexical beliefs." I should bridge that gap by linking it to their concrete example: "If you saw your spouse's car, you'd act—but if you were a character in a prediction simulation, UDT says 'act as if the simulation knew your code'." 

  The deeper need here? They want to grasp why UDT claims to "solve" Newcomb's paradox where others fail. So beyond clarifying terminology, I should contrast it with evidential decision theory's mistake: EDT would treat "I chose one-box" as evidence Omega predicted correctly, but UDT pre-commits to ignoring that.
answer: |-
  That's an excellent question! The term "updateless" in Updateless Decision Theory (UDT) is notoriously confusing and often counter-intuitive at first glance. **You're absolutely right that it doesn't mean ignoring sensory evidence like lights being on or a car in the driveway.** That *would* be absurd. UDT agents absolutely use evidence to form beliefs about the world. The "updateless" part refers to a very specific and subtle concept related to how the agent reasons about *its own decision-making process* in problems involving correlation, prediction, or logical counterfactuals.

  Here's a breakdown of what "updateless" actually means in UDT:

  1.  **The Core Idea: Deciding Before Seeing the "Meat" of the Problem:**
      *   Imagine you are designing a general "decision algorithm" *before* you know the specific situation you'll be in. You want this algorithm to output good actions in *any* possible world it might find itself in.
      *   UDT says: **Choose the *entire policy* (the mapping from all possible observations/inputs to actions) that leads to the best *expected* outcomes, *given your current state of knowledge* (which *includes* all the evidence you've gathered up to the point of designing the policy).**
      *   Crucially, this policy choice is made *once*, considering all possible ways the world could be structured and all possible observations you *might* receive in the future, weighted by your current probability estimates.

  2.  **The "Update" It Avoids: Self-Locating Beliefs about Your Own Choice:**
      *   The "update" UDT avoids is the one that happens in standard Evidential Decision Theory (EDT) and even to some extent in Causal Decision Theory (CDT) *when the agent observes which action it ends up taking*.
      *   **Problem:** In dilemmas like Newcomb's Problem, the predictor's accuracy creates a correlation between your *decision algorithm* (your "type") and the state of the world (what's in the boxes). EDT reasons: "If I choose to one-box, that is *evidence* that Omega predicted I would one-box, so the opaque box probably contains $1M. Therefore, I *should* one-box." While this gets the "right" answer in Newcomb's, it leads to absurdities in other problems (e.g., Smoking Lesion, Parfit's Hitchhiker).
      *   **Why EDT's Update is Problematic:** EDT treats the *act of choosing an action* as *evidence* about the world state (e.g., the prediction), even though the choice itself doesn't *cause* the past prediction or lesion. It confuses correlation with causation *specifically regarding the agent's own decision process*.
      *   **UDT's Solution: Be "Updateless" about Your Choice:** UDT says: **"Don't condition your beliefs about the world state on the specific action you are *about to output*. Instead, condition on your entire decision *algorithm* and the evidence you have when you *designed* that algorithm."** You commit to a policy *before* you know which branch of that policy you'll actually execute. You don't let the specific action you're contemplating ("Should I one-box *now*?") become evidence that updates your beliefs about the prediction or other correlated factors.

  3.  **How It Uses Evidence (Crucially!):**
      *   UDT agents **absolutely use evidence** to update their beliefs about the world! When you see the lights on and the car in the driveway, you update your probability that someone is home dramatically. This is fundamental.
      *   **The key difference is *when* and *how* this evidence is incorporated:**
          *   **Before Choosing the Policy:** All evidence you have *at the time you design/select your decision algorithm/policy* is used to form your best estimate of the world's structure and probabilities. This includes general knowledge, physics, psychology, past experiences, *and* specific evidence like seeing the lights on.
          *   **During Policy Execution:** When the policy runs and receives a specific input (e.g., "It's Tuesday, I'm facing Omega, I see two boxes"), it simply *looks up* the action dictated by the pre-committed policy *for that specific input*. It does **not** re-run a full Bayesian update *conditioned on the action it's about to take* ("If I one-box, that means Omega probably predicted I would, so the $1M is there...").

  4.  **Newcomb's Problem Illustrated:**
      *   **Your Knowledge (Pre-Policy):** You know Omega is an incredibly accurate predictor. You know the rules of the game. You know you are *about to face* Omega. You *might* even have evidence about how Omega makes predictions (e.g., simulating your decision algorithm).
      *   **UDT Reasoning:** "Given my current knowledge (including Omega's accuracy), which *policy* should I adopt? Should my policy be 'Always one-box' or 'Always two-box'?"
      *   **Calculation:** The expected utility of the "Always one-box" policy is very high (almost always $1M or $1M + $1K). The expected utility of the "Always two-box" policy is low (almost always $0 or $1K). Therefore, UDT selects the "Always one-box" *policy*.
      *   **At the Moment of Choice:** You stand in front of the boxes. Your policy says "one-box". So you one-box. Crucially, you do **not** stop and think: "By choosing to one-box *now*, am I getting evidence that Omega predicted this? Therefore, is the money there?" You already factored in the correlation between your *policy* and Omega's prediction when you chose the policy. You are just executing the output of your pre-committed algorithm.

  5.  **The Analogy to Your Home Example (Why It's Not Absurd):**
      *   Imagine you are designing a home-entrance policy *before* you leave in the morning: "If lights are on AND car is in driveway -> Enter cautiously (belief: someone home). If lights off AND no car -> Enter normally (belief: no one home). If lights on AND no car -> Check for burglary (belief: possible intruder)."
      *   You designed this policy using your knowledge of your family's habits, crime stats, etc. (evidence!).
      *   When you come home and see lights on and car present, you *don't* update your belief about whether someone is home *based on the action you're about to take* ("If I enter cautiously, that must mean someone is home!"). You simply execute the pre-defined action for that input ("Enter cautiously"), based on the belief ("someone is home") that was *already justified by the evidence* when you designed the policy.
      *   UDT applies this same "design the whole mapping once" logic to complex decision theories where the agent's type/policy correlates with the world state.

  **In Summary:**

  *   **"Updateless" does NOT mean:** Ignoring sensory evidence, being oblivious to the environment, or refusing to learn.
  *   **"Updateless" DOES mean:** Choosing your *entire decision policy* (the rule that tells you what to do in every possible situation) **once**, based on your **current total evidence and understanding of how the world works**.
  *   You **avoid updating** your beliefs about the world state **specifically on the counterfactual premise of "what action I am about to output right now"** when that action is correlated with the world state through prediction or logical dependence. Instead, you condition on your entire decision algorithm.
  *   UDT agents **vigorously use evidence** to form their initial beliefs and to select the best overall policy. The evidence tells them *which* policy will have the best expected results.

  The term "updateless" is really shorthand for "not updating on the fact of your own imminent choice as if it were evidence about correlated past events." It's a profound idea aimed at resolving paradoxes where an agent's decision algorithm itself is part of the causal or logical structure of the problem it's trying to solve. It's counter-intuitive because we naturally think in a step-by-step, "what should I do *now*?" way, but UDT argues that the optimal approach is to think about the entire strategy from a timeless perspective.
