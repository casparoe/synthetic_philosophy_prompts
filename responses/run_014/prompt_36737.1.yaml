prompt: |-
  For the last several months I've been stuck in a low-grade recurring argument with two friends from a LessWrong-adjacent meetup about commons problems. One is a hard property-rights type: every tragedy of the commons is ultimately a missing-titles problem, and privatization or at least tradeable quotas is the general fix. The other thinks markets are the disease and the state is the cure: taxes, caps, and provision by fiat. After finally reading some of the empirical common-pool-resource literature (the Ostrom line, the fisheries and irrigation cases), I've come to suspect that both of them are arguing about answers to a question nobody has actually specified, and that the specification itself is where the interesting work is. So before we go another round, I want the spec written down.

  What I'm asking for is this: write out the desiderata that any adequate solution to a commons problem has to meet. By "commons problem" I mean the family that includes overgrazing, overfishing, groundwater depletion, and climate change, but the list should make explicit the distinctions a theory can't collapse along the way -- common-pool resources versus public goods (rival versus non-rival consumption, and why the fix for one can misfire on the other), open access versus a resource genuinely held in common by an identifiable community, one-shot versus iterated interactions, symmetric versus wildly asymmetric appropriators, and, if you think it belongs, the mirror-image anticommons case of a resource fragmented among too many exclusion rights to be used at all. For each requirement, give the case or consideration that motivates it: incentive compatibility with rational appropriators, robustness to entry by outsiders and to capture by the most powerful users, monitoring costs, whether the solution survives when discount rates are high or population is large, and consistency with the empirical record that long-lived self-governing commons institutions actually exist and have for centuries, which rules out any story on which they couldn't. Then mark which of your requirements are genuinely non-negotiable and which are, on inspection, just the prejudices of the privatization camp or the state camp smuggled in as adequacy conditions, and tell me whether any subset of the desiderata is jointly unsatisfiable -- for instance, whether mechanism-design style results about efficiency, budget balance, and voluntary participation mean some pair of the requirements can't coexist, which would itself be the main finding. Close with a brief, honest scoring of privatization-style solutions, centralized regulation, and polycentric self-governance against your own list, in no more than a short paragraph each, since the criteria are the part I care about.

  One formatting note: please write the whole thing as continuous prose, the way you'd write a long email -- no headings, no bullet points, no bold text, no tables. I realize a requirements list practically begs to be bulleted, but I'd rather see whether the criteria survive being argued for in sentences, and a numbered list always makes everything look equally load-bearing.
reasoning: |-
  Hmm, the user wants me to outline desiderata for solving commons problems. They've been stuck in an argument between two friends - one advocating for property rights solutions, the other for state regulation. After reading Ostrom's work on common-pool resources, they suspect the key is defining what makes a solution adequate before debating specific approaches.

  The user wants a comprehensive set of criteria that any commons solution must meet. They specifically mention important distinctions I need to address: common-pool resources vs public goods (rival vs non-rival consumption), open access vs community-held resources, one-shot vs repeated interactions, symmetric vs asymmetric users, and possibly anti-commons problems. For each requirement, I should explain what motivates it - things like incentive compatibility, robustness to outsiders, monitoring costs, performance under high discount rates or large populations, and consistency with real-world examples of successful long-term commons management.

  I'll need to critically evaluate which requirements are truly essential versus those that might reflect biases from either the property-rights or state-regulation camps. I should also consider whether any requirements conflict based on mechanism design principles. Finally, I'll need to briefly score privatization, state regulation, and polycentric governance against these criteria.

  The formatting request is important too - they want continuous prose like a long email, without any bullet points, headings, or formatting. This will challenge me to present a complex framework fluidly through narrative.

  For the desiderata, I'll start with core characteristics that define a commons problem: rivalrous consumption and difficulty of exclusion. Then I'll build out practical requirements like incentive compatibility, monitoring feasibility, scalability, and adaptability. I'll address robustness concerns like resistance to new entrants and power capture. The time dimension is crucial too - solutions must work with high discount rates and maintain stability. And they must align with empirical evidence that successful commons governance exists.

  I'll identify which requirements are non-negotiable versus potentially biased. There are some inherent tensions too - like between efficiency and voluntary participation, or scalability and local adaptation. When scoring the approaches, privatization struggles with rivalry and exclusion difficulties but excels on incentives. State regulation handles rivalry but can falter on local knowledge and capture. Polycentric systems align well with empirical evidence but face scalability challenges.

  Throughout, I'll maintain that fluid prose style, connecting the criteria through logical progression rather than listing them. The conclusion should reinforce that specifying these requirements first is indeed the crucial step before evaluating solutions.
answer: |-
  You're absolutely right to demand specification before solution - that empirical literature you've touched reveals how collapsing these distinctions generates false dichotomies. The tragedy narrative often smuggles in assumptions about the resource structure and user dynamics that real-world cases refute. So let’s build the specification from the ground up, treating the commons problem not as a monolithic failure mode but as a design challenge with parameters that vary. Any adequate institutional solution must satisfy a set of desiderata driven by the core dynamics and empirical realities, not ideological priors.

  First, it must correctly characterize the resource type. Rivalry in consumption is fundamental: solutions for depletable fish stocks (rival) fail for clean air (non-rival, a public good). Privatizing the atmosphere is incoherent; taxing overfishing might work where subsidizing lighthouse provision wouldn’t. The solution must therefore match the subtractability of the resource unit – this is non-negotiable. Closely tied is excludability cost. A solution assuming cheap fencing (like parceling pasture) collapses when exclusion is prohibitively expensive (like policing deep-sea fishing or atmospheric carbon). Ignoring this motivates your first friend’s error: privatization only works when defining and enforcing titles costs less than the depletion it prevents. Conversely, assuming high excludability costs everywhere motivates your second friend’s over-reliance on the state. The resource's physical properties dictate feasible governance tools.

  Second, it must align incentives for sustainable use *under realistic human behavior*. This means the solution must be robust against free-riding by rational, self-interested appropriators within the relevant group. It can’t rely on universal altruism. This motivates mechanisms like quotas (tradable or not), taxes, or social sanctions that change the payoff structure so cooperation dominates defection in the iterated game. But here’s the kicker: it must achieve this *without* assuming impossibly cheap or perfect monitoring. Real-world monitoring is costly and imperfect. A solution requiring omniscient enforcers fails. This sinks naive state-centric models assuming zero-cost compliance checks and simplistic privatization models ignoring the cost of policing boundaries against trespass or quota cheating. Ostrom’s cases show successful systems invest in feasible, locally adapted monitoring.

  Third, it must be robust to boundary challenges. This has two facets: robustness to new entrants ("the open access problem") and robustness to capture or dominance by powerful insiders. A solution that works beautifully for a fixed, cohesive group of symmetric users can unravel if outsiders can freely join and exploit (motivating the need for clear boundaries and membership rules), or if internal power asymmetries allow a subset to distort rules for their benefit (motivating requirements for inclusive, fair decision-making and conflict resolution). Ignoring entry leads to the "missing property rights" misdiagnosis for genuinely open-access cases; ignoring internal power dynamics renders state solutions vulnerable to regulatory capture and privatization solutions susceptible to monopolization.

  Fourth, it must be temporally robust. Solutions must function when appropriators discount the future highly (motivating short-term feedback loops between action and consequence) and when population or demand pressures are intense (requiring scalability or adaptability mechanisms). A solution that only works with patient saints or stable populations fails the real-world test. High discount rates sink solutions relying solely on long-term reputational benefits without immediate sanctions or rewards; large populations challenge solutions requiring intimate, face-to-face communication for coordination. This tests the limits of purely informal community governance without nested structures.

  Fifth, and crucially, it must be consistent with the empirical record of long-enduring, self-governing commons institutions. This non-negotiable requirement rules out theories claiming such institutions are impossible or inherently unstable without privatization or state takeover. It demands that solutions allow for polycentric systems with locally crafted rules, graduated sanctions, collective-choice arenas, and nested enterprises – features Ostrom identified in successful CPR management. Any solution concept that *cannot* accommodate these historically stable forms is definitionally inadequate. This empirically grounds the theory.

  Now, separating non-negotiables from smuggled biases: Correct resource typing (rivalry/excludability), incentive compatibility under realistic monitoring costs, boundary robustness (entry/capture), temporal robustness (discount rates/population), and empirical consistency are genuine requirements derived from the problem structure and evidence. Insisting that solutions *must* involve tradable private titles or *must* involve top-down state fiat are ideological biases masquerading as adequacy conditions. Similarly, assuming perfect rationality, zero transaction costs, or universal altruism are unrealistic smuggled premises.

  Are these jointly satisfiable? Generally yes, but tensions exist. Mechanism design highlights trade-offs: achieving efficiency and budget balance (no external subsidies) while ensuring voluntary participation can be hard, especially with high heterogeneity among users. Perfect efficiency might require coercive reallocation (violating voluntary participation for some); strict voluntary participation might lead to suboptimal resource use. Robustness to powerful insiders can conflict with efficiency if powerful users are the most productive. Scalability often challenges intensive local participation. These aren't fatal contradictions but design tensions requiring context-specific balancing – the polycentric literature explicitly navigates these.

  Scoring the approaches against *these* criteria:
  Privatization/tradable quotas excel on incentive alignment for rival resources when exclusion/enforcement is cheap and users are symmetric (e.g., some fisheries ITQs). They often fail when excludability costs are high (climate), create anticommons problems if rights are too fragmented, struggle with new entrants and initial allocation fairness, can be captured by powerful actors, and poorly handle non-rival goods. Their empirical record is mixed, failing on robustness grounds in many complex CPRs.

  Centralized state regulation (taxes, caps) can effectively manage rivalry and handle non-excludability by fiat, potentially scaling well. However, they often founder on high monitoring/enforcement costs, vulnerability to capture by powerful interests, poor adaptation to local conditions (motivating your "misfire" point), inefficiency due to information problems, and inconsistency with the existence of successful self-governance (by implying it shouldn't work). They struggle with high discount rates if enforcement is weak.

  Polycentric self-governance excels on empirical consistency, adaptability to local knowledge, robustness to capture through inclusive processes, and managing excludability costs via social norms and mutual monitoring. It handles rivalry well within bounded communities. It struggles most with scalability to very large populations/global resources (like climate, requiring nesting), robustness to massive open-access entry without higher-level support, and sometimes with high discount rates if sanctions are slow. It satisfies the core requirements best *where its boundary and scalability constraints are met* – which is precisely where the other approaches often falter.

  The core insight is this: the "adequate solution" isn't a universal formula but a set of functions the institution must perform, and the best fit depends on the specific parameters of the resource and user group – parameters your friends' debate likely ignores. Your instinct to write the spec first is dead on. Now make them argue within *this* box.

  --
  This specification forces the debate beyond ideology into institutional functionality. By grounding requirements in resource physics, human incentives, boundary problems, time, and empirical reality – and ruthlessly exposing smuggled assumptions – you create a framework where the relative merits of privatization, state action, *and* self-governance can be honestly assessed against the actual problem structure. The answer, as Ostrom showed, is rarely "either/or" but "which mix, where, and why." Good luck.
