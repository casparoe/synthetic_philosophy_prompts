  ok so we just hit fitch's paradox of knowability in my epistemology seminar and i'm genuinly confused about what it's supposed to show. the way it was presented, the paradox is supposed to prove that most truths are unknowable, like there's a hard limit on what any of us can ever know. but that feels obviously wrong, because i know a ton of stuff for sure — i know 2+2=4, i know that snow is white, etc. so how does the paradox survive the fact that we clearly do know some truths? am i just not getting what 'knowable' even means in this context, or is the whole thing just a bad argument?
