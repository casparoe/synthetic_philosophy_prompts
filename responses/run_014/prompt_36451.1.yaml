answer: |-
  ### **The Marketplace Disclosure Game**  
  **Objective:** Create palpable tension between lying (false statements) and misleading (true but deceptive statements) through paired transactions with asymmetric information.  

  ---

  #### **Materials**  
  - **Item Cards** (9 cards, one per Seller): Each describes an item + a hidden defect.  
    *Example: "Used Smartphone: Battery lasts only 1 hour (defect). Features: Scratch-free screen, includes charger."*  
  - **Buyer Guides** (9 cards, one per Buyer): Lists generic item types (e.g., "smartphone," "bike") but **no defects**.  
  - **Payoff Tokens** (e.g., poker chips or paper money): $0/$5/$15 denominations.  
  - **Transaction Logs** (one per pair): Records statements, questions, and decisions.  

  ---

  #### **Rules**  
  1. **Roles**:  
     - **Seller**: Knows the item’s defect from the Item Card. Must make **one initial statement** about the item (written on the log).  
     - **Buyer**: Knows only the item type from the Buyer Guide. May ask **one yes/no question** after the statement. Seller must answer truthfully.  
     - **Trade**: Buyer then chooses to buy ($10 from Buyer to Seller) or not.  

  2. **Payoffs**:  
     | Scenario | Seller Gets | Buyer Gets |  
     |----------|-------------|------------|  
     | Buyer **buys**, defect **hidden** | $15 | –$5 |  
     | Buyer **buys**, defect **revealed** | $0 | +$5 |  
     | Buyer **does not buy** | $0 | $0 |  
     - **Defect revealed?** = Seller discloses defect *in initial statement or question answer*.  
     - **Hidden defect penalty**: If Buyer buys and defect was hidden, Seller **loses $10** if initial statement was *false* (lie). No penalty if *true* (misleading).  

  ---

  #### **Timeline** (75 minutes total)  
  1. **Setup** (10 min):  
     - Divide into 9 pairs. Distribute roles (Seller: Item Card; Buyer: Buyer Guide).  
     - Sellers review defects secretly. Buyers review item types.  
     - Explain rules/payoffs: *"Sellers, your goal is to sell without revealing the defect. Buyers, your goal is to avoid defective purchases. One statement, one question, then decide."*  

  2. **Gameplay** (25 min, 2 rounds):  
     - **Round 1** (10 min):  
       - Sellers write initial statements (lie or misleading truth).  
       - Buyers ask one yes/no question. Sellers answer truthfully.  
       - Buyers decide: buy or not. Record outcomes on logs.  
       - **Payoffs distributed immediately** (facilitator checks truthfulness of initial statements *only if Buyer bought and defect was hidden*).  
     - **Round 2** (10 min): Switch roles, new Item Cards.  
     - **Transition** (5 min): Collect logs. Tally payoffs.  

  3. **Debrief** (40 min):  
     - **Step 1: Data Reveal** (5 min):  
       Share aggregate results:  
       - *"How many Sellers lied? How many misled? How many Buyers bought defective items?"*  
     - **Step 2: Feeling the Distinction** (10 min):  
       - Sellers: *"When you lied vs. misled, did one feel ‘dirtier’? Why?"*  
       - Buyers: *"When deceived, did a lie vs. a misleading truth anger you differently?"*  
     - **Step 3: Moral Mapping** (15 min):  
       - *"In the game, lying incurred a penalty but misleading didn’t—yet both harmed Buyers. Does this penalty reflect a **real moral difference**, or just a rule exploiting technical truth?"*  
       - *"Buyers who didn’t ask, e.g., ‘Is the battery faulty?’ after hearing ‘The screen is scratch-free!’—do they share blame for being misled?"*  
     - **Step 4: Real-World Links** (10 min):  
       - *"When has someone misled you with a ‘true’ statement? Did you wish you’d asked a follow-up? Does intent matter more than literal truth?"*  
       - *"Should we hold misleading to the same standard as lying, or is avoiding lies enough to be ‘honest’?"*  

  ---

  #### **Predictable Problems & Fixes**  
  - **Problem**: Buyers struggle to ask useful questions.  
    *Fix: Suggest pre-game examples: "Ask about common defects (e.g., ‘Does the battery hold a charge?’)."*  
  - **Problem**: Sellers avoid lying due to penalty fear, favoring misleading.  
    *Fix: Emphasize payoff symmetry: "Both tactics earn $15 if successful; lying just adds risk."*  
  - **Problem**: Post-purchase truth checks slow gameplay.  
    *Fix: Assign 2-3 "verifier" students to audit logs quickly during rounds.*  
  - **Problem**: Defect "revelation" ambiguity (e.g., "It works fine" vs. direct disclosure).  
    *Fix: Clarify: "Only explicit mentions (e.g., ‘battery’) count as revealed."*  

  ---

  #### **What the Game Can’t Replicate**  
  **The hearer’s real-world epistemic laziness**.  
  - In the game, Buyers *know* a defect exists and must probe. IRL, listeners often don’t ask follow-ups due to trust, obliviousness, or social pressure. The game’s "suspicious Buyer" dynamic sidesteps this. **You must supply this nuance in lecture**: *"When we mislead, we often exploit the hearer’s reasonable trust or inattention. Is that betrayal worse than lying, or just sneakier?"*  

  ---

  **Outcome**: Students leave with visceral intuition that lying and misleading *feel* different, setting up deeper analysis of whether that feeling tracks moral truth or social convenience. Labels (e.g., "lying vs. misleading") are introduced only *after* the debrief.
