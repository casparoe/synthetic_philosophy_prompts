prompt: |-
  Write a short internal FAQ — the kind of procedural document a company circulates to new employees, in numbered question-and-answer form, deadpan throughout, roughly 700 words — for an organization that has replaced all of its ordinary decision-making with majority votes, on the authority of the Condorcet jury theorem. The comedy has to come from the theorem's actual conditions rather than from generic jokes about committees: the piece should be funny to someone who teaches the result and still legible to someone who has never heard of it, and it must never announce, summarize, or wink at the objections it is enacting. Let the organization keep the theorem's assumptions in the letter of its policies and betray them in their spirit — an onboarding process that guarantees every voter receives the same information and attends the same briefing; a competence requirement satisfied by an examination the organization writes and grades itself; a standing commitment to keep hiring voters, since more voters means more certainty; a ban on discussing a question before voting, justified by the need for independence; a practice of putting every question to the whole staff, including questions on which the staff is no better informed than a coin. At least once the arithmetic should be allowed to show: the FAQ should state, in the flat voice of policy, what becomes of a majority's accuracy when the voters are worse than chance and the body grows. The organization should also have run into the fact that its majorities can cycle — it prefers the first option to the second, the second to the third, and the third to the first — and should treat the resulting dependence on which questions are put in what order as a matter for the office that sets the agenda, without ever remarking that this is where the power now sits. A short, quoted dissenting memo from an in-house statistician may be included, provided it stays inside the corporate register. End on a line that a reader could take as either reassuring or appalling, and do not explain which.
reasoning: |-
  Okay, the user wants me to create a satirical internal FAQ for a company that uses the Condorcet jury theorem for all decisions. This theorem says that if voters are independent and each has better than 50% chance of being correct, majority decisions become more accurate as the group grows larger. The humor needs to come from how the company strictly follows the letter of the theorem while completely violating its spirit in practice.

  I need to consider the key elements the user specified. The organization will have policies that technically satisfy the theorem's conditions but are absurd in implementation. For example: identical briefings for all voters (ensuring no independence), a self-graded competence test (meaningless), continuous hiring (because more voters = more certainty), a ban on discussion (to "preserve independence"), and putting every possible question to vote regardless of relevance. The comedy should emerge from this contrast between theoretical rigor and practical absurdity.

  For the voting paradox issue, I'll have the organization acknowledge that preferences can cycle but treat it as a mundane procedural matter handled by the agenda-setting office. The FAQ should never explicitly point out that this gives agenda-setters all the power. There should be a moment where the arithmetic shows - stating plainly that if voters are worse than random, larger groups make worse decisions. A quoted memo from a statistician will object internally but stay in corporate jargon.

  The tone must remain deadpan throughout - no winking at the audience or explaining the jokes. The ending should be ambivalent, leaving the reader unsure whether it's reassuring or horrifying. I'll structure this with numbered Q&As covering onboarding, voting procedures, competence verification, paradox handling, and growth policies. The statistician's memo will appear as a dissent buried in the FAQ. Word count around 700.

  I'll make sure the humor works for both theorem experts and newcomers. Experts will recognize the violated assumptions, while others will see the absurd bureaucracy. The final line about "mathematically guaranteed" correctness will serve as the ambiguous closer - technically true only if conditions are met, which they're not.
answer: |-
  **INTERNAL FAQ: DECISION PROTOCOL 7.3 (CONDORCET COMPLIANCE)**  
  **VERSION 4.2 // EFFECTIVE IMMEDIATELY**

  **1. What is the basis for Protocol 7.3?**  
  All organizational decisions are determined by simple majority vote. This protocol is derived from the Condorcet Jury Theorem, which mathematically guarantees that collective accuracy increases with voter count when specific conditions are met. Compliance ensures optimal outcomes.

  **2. Who votes?**  
  All employees holding "Competent Voter" certification (see Section 5) participate in every vote. This includes decisions ranging from strategic direction ("Should we acquire Company X?") to operational minutiae ("Which brand of decaffeinated coffee should the third-floor kitchen stock? Brand A or Brand B?"). Participation is mandatory.

  **3. How is voter independence maintained?**  
  Pre-vote discussion on the question at hand is strictly prohibited (Policy 7.3.12a). To ensure voters share identical informational inputs, all receive the *Standardized Decision Briefing Packet* (SDBP) exactly 24 hours before the vote opens. The SDBP contains all permissible information relevant to the decision. Accessing supplementary data sources violates protocol and voids your certification.

  **4. How do I become a Competent Voter?**  
  New hires must pass the Condorcet Voter Competency Assessment (CVCA) within their first week. The CVCA is a 25-question multiple-choice test assessing baseline logical reasoning and information synthesis, calibrated to confirm individual competence probability (p) exceeds 0.5. The Organizational Synergy Department (OSD) develops, administers, and scores the CVCA. Passing requires a score of 13/25 or higher. Recertification occurs annually.

  **5. Why does the company keep hiring?**  
  The theorem demonstrates that larger electorates yield higher decision accuracy asymptotically approaching certainty. Therefore, continuous growth of the voter base is a strategic imperative codified in Policy 7.3.1 ("Perpetual Voter Expansion"). Hiring targets are calculated quarterly by OSD to maintain projected accuracy gains.

  **6. What happens if the average voter competence is low?**  
  The Condorcet Jury Theorem clearly models the relationship between individual competence (p), group size (n), and majority accuracy (P_n). Specifically, if p < 0.5, P_n *decreases* as n increases, converging to 0. OSD monitors aggregate CVCA performance quarterly to ensure p remains > 0.5. Should p fall below 0.5, corrective training mandates are issued per Policy 7.3.15 ("Competence Recalibration"). Continued failure triggers reassessment.

  **7. How are complex choices handled?**  
  Questions presenting more than two options are decomposed into pairwise votes ("Should Option A be preferred to Option B?", "Should Option A be preferred to Option C?", etc.). The option winning the most pairwise contests is selected.

  **8. What if no option wins all pairwise contests?**  
  Occasionally, cyclical majorities may occur (e.g., A > B, B > C, C > A). This is an inherent feature of aggregating independent preferences. Resolution follows Agenda Setting Procedure 7.3.8: The Office of Agenda Integrity (OAI) sequences the pairwise votes according to predefined, randomized priority matrices. The outcome is determined by the sequence approved by OAI. Appeals are not permitted.

  **9. Isn't the Agenda Setting Office very powerful?**  
  OAI performs a neutral, procedural function mandated by Policy 7.3.8. Its role is strictly to resolve potential cycles via predefined sequencing rules, ensuring a determinate outcome. OAI staff do not vote on the substance of questions. Their workflow is audited monthly by Internal Compliance.

  **10. Why vote on things we know nothing about?**  
  All decisions require voter input. The SDBP provides sufficient context for any binary or pairwise choice. The Condorcet framework relies on the aggregation of independent judgments, not specialized expertise. Examples include: "Should the Helsinki office relocate to Building Gamma (estimated cost: €5M)?" (presented identically to staff in Lima and Sydney); "Is Supplier Y's proposed alloy (Technical Spec: Appendix F) superior to Supplier Z's alloy (Technical Spec: Appendix G)?" for non-engineers. The theorem assumes p > 0.5; the CVCA confirms this holds regardless of domain knowledge.

  **11. Has anyone raised concerns about this system?**  
  All feedback is welcome through official channels. A previous internal memo suggested potential limitations (see Appendix A: Archived Dissent). Its statistical arguments were reviewed by OSD and deemed non-operative under current protocols where p > 0.5, n is sufficiently large, and independence is enforced via Policy 7.3.12a. The system functions as mathematically prescribed.

  **APPENDIX A: ARCHIVED DISSENT (EXCERPT)**  
  *Internal Memo: OSD-REF-4421*  
  *Sender: Dr. A. Bayes, Stat. Modeling Dept.*  
  *Subject: Operational Assumptions in Protocol 7.3*  
  "...while the Condorcet result is elegant *in theory*, our practical implementation exhibits significant friction. The assumption of voter independence is critically undermined by the *homogeneous* SDBP – it doesn't induce independence, it induces *identical bias*. Further, the CVCA measures test-taking competence under lab conditions, not decision-making competence (p) on diverse, real-world questions under SDBP constraints. Crucially, if *actual* p is below 0.5 for a given question – which is probable for non-core competencies – Theorem dynamics invert: larger votes yield *worse* outcomes with increasing certainty. Aggregating uninformed judgments doesn't produce wisdom; it amplifies systemic error. The cycling issue and OAI's *de facto* determinative role further illustrate..."  
  *(Memo status: Reviewed. Conclusions deemed inapplicable. Protocol 7.3 remains unchanged.)*

  **12. Final Note:**  
  Remember: Every vote you cast contributes to the mathematical machinery driving us toward certainty. As our ranks swell, so too does our collective infallibility.
