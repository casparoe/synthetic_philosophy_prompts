  First, I need to recall the core elements of both systems. Nagarjuna's tetralemma presents four alternatives for any ontological claim: existence, non-existence, both, neither. He uses this to argue for emptiness (śūnyatā) and the lack of intrinsic nature (svabhāva). Belnap's logic has four truth-values: true (T), false (F), both (B), neither (N), structured in a bilattice with logical and information orders.

  The user is a CS professional familiar with databases and Kleene logic, so they'll understand lattice diagrams and truth-values. They want a clear, technical comparison without academic waffling. The residue report needs three buckets: clean translations, distortions, and inexpressible parts. Then, a firm stance on the tetralemma's interpretation.

  Starting with clean translations: The four values map superficially—existence to T, non-existence to F, both to B, neither to N. The exhaustive structure of the catuṣkoṭi aligns with Belnap's value set. Negation in both systems behaves similarly, flipping T/F and leaving B/N unchanged. The reductio method in Nagarjuna mirrors how Belnap handles contradictions, though Nagarjuna uses it more destructively.

  Now distortions: The key difference is ontological vs. semantic. Nagarjuna is questioning reality itself, while Belnap handles incomplete/contradictory information. Nagarjuna's tetralemma is a dialectical tool to deconstruct all options, whereas Belnap's values are epistemic states. The fourth option (neither) is a target of reductio in Madhyamaka but a valid state in Belnap. The bilattice's two orders (truth and information) don't play a role in Nagarjuna's arguments.

  Inexpressible elements: Emptiness (śūnyatā) as the collapse of all four options has no counterpart. The soteriological goal—liberation from reification—is absent in Belnap. The tetralemma's role as a therapeutic tool to cure ontological clinging isn't captured by truth-values.

  For the committed stance: I'll argue that the tetralemma isn't a logic but a dialectical tool (option c). Nagarjuna uses all four corners to show their incoherence, leading to emptiness. This means Belnap's B and N values are provisional targets, not endorsed states. Emptiness dissolves the question of truth-values entirely, unlike glut/gap theories.

  This stance affects the translation: Belnap's values map to the tetralemma's structure but are ultimately deconstructed. The residue highlights that Madhyamaka's goal isn't modeling truth but ending conceptual proliferation.
answer: |-
  Here's a precise mapping of Nagarjuna's Tetralemma onto Belnap-Dunn (B4) logic, followed by a residue report and a committed interpretation of the Tetralemma's purpose and its relationship to B4.

  **Core Concepts Mapped:**

  1.  **The Four Values:**
      *   **Belnap-Dunn (B4):** `T` (True only), `F` (False only), `B` (Both True and False), `N` (Neither True nor False).
      *   **Tetralemma (Catuṣkoṭi):** `A` (Exists/Is), `¬A` (Does Not Exist/Is Not), `A ∧ ¬A` (Both Exists and Does Not Exist), `¬(A ∨ ¬A)` (Neither Exists Nor Does Not Exist).
      *   **Mapping:** `A` ⟷ `T`, `¬A` ⟷ `F`, `A ∧ ¬A` ⟷ `B`, `¬(A ∨ ¬A)` ⟷ `N`. The *structure* of four exhaustive possibilities maps cleanly.

  2.  **Exhaustiveness:**
      *   **B4:** The four values are mutually exclusive and jointly exhaustive for any proposition within the system.
      *   **Tetralemma:** Nagarjuna presents the four corners (`koṭis`) as the logically exhaustive possibilities for characterizing the ontological status (`svabhāva`) of any phenomenon (`dharma`).
      *   **Mapping:** The claim of logical exhaustiveness translates cleanly. For any phenomenon `X` and property `P`, `X has svabhava P` must fall into one of these four categories.

  3.  **Negation:**
      *   **B4:** Negation (`~`) is defined: `~T = F`, `~F = T`, `~B = B`, `~N = N`. It flips `T`/`F`, leaves `B`/`N` unchanged.
      *   **Tetralemma:** Nagarjuna employs classical-like negation within each `koṭi` argument. Crucially, he argues *against* each `koṭi` using negation. The behavior within reductios aligns with `~T = F` and `~F = T`. When he rejects `B` and `N`, it mirrors `~B = B` and `~N = N` only in the sense that negating them doesn't automatically yield a simple `T` or `F`.
      *   **Mapping:** The *operation* of negation within the dialectic (used to refute each corner) has a counterpart in B4's negation table. The *effect* of negating `B` and `N` (they remain complex) also maps.

  4.  **The Bilattice Structure (Logical Order ≤ₗ and Information Order ≤ᵢ):**
      *   **B4:** The values form a bilattice. `≤ₗ` (Truth Order): `F ≤ₗ N ≤ₗ T`, `F ≤ₗ B ≤ₗ T` (approximating classical truth). `≤ᵢ` (Information Order): `N ≤ᵢ F ≤ᵢ B`, `N ≤ᵢ T ≤ᵢ B` (measuring "definedness" or "information content").
      *   **Tetralemma:** Nagarjuna's argumentation primarily engages the *exhaustiveness* and *mutual exclusivity* implied by the four corners. He doesn't explicitly develop concepts analogous to `≤ₗ` or `≤ᵢ`. His focus is the *rejection* of all four values for ontological claims, not ordering them based on truth or information.
      *   **Mapping (Limited):** The bilattice *exists* as a structure for the four values, but Nagarjuna doesn't utilize this structure *within his arguments*. The values are treated as distinct, exhaustive options to be refuted, not points on ordered scales.

  5.  **Entailment:**
      *   **B4:** Entailment (`⊨`) is defined based on preserving `T` or `B` (depending on the chosen consequence relation, often `x ⊨ y` iff `x ≤ₗ y`). Allows for paraconsistent (`B` doesn't entail everything) and paracomplete (`N` entails nothing) reasoning.
      *   **Tetralemma:** Nagarjuna uses classical reductio ad absurdum *within* his arguments against each `koṭi`. He assumes a `koṭi`, derives a contradiction (`A` implies `¬A` and/or `¬A` implies `A`), and concludes the assumption is false. However, the *overall* goal is rejecting *all* `koṭis`, implying no stable entailment relation for ontological claims survives.
      *   **Mapping (Distorted):** The *local* use of reductio within each refutation uses classical entailment. However, the *global* conclusion – the rejection of all four values – is incompatible with any standard B4 entailment relation, as B4 accepts that propositions *can* have one of these values. Nagarjuna's result is that ontological claims *cannot* consistently have *any* of these values.

  6.  **Emptiness (Śūnyatā) & Rejection of Svabhāva:**
      *   **Tetralame Core:** Nagarjuna's ultimate conclusion. Any phenomenon (`dharma`) lacks intrinsic, independent, self-established existence or nature (`svabhāva`). The tetralemma is the tool proving this: *because* all four ontological possibilities (`is`, `is not`, `both`, `neither`) lead to absurdity when applied to any phenomenon, that phenomenon must be "empty" (`śūnya`) of inherent existence. Emptiness itself is also empty.
      *   **B4 Counterpart:** None. B4 offers values propositions can *have*. Emptiness is the radical claim that for fundamental ontological statements, *none* of the values apply stably or ultimately. It's the *collapse* or *dissolution* of the very framework.

  **Residue Report:**

  1.  **Translates Cleanly:**
      *   The exhaustive, four-fold logical structure itself (`A`, `¬A`, `A ∧ ¬A`, `¬(A ∨ ¬A)` ⟷ `T`, `F`, `B`, `N`).
      *   The mutual exclusivity (within the dialectical setup).
      *   The behavior of negation *within the reductio arguments* against the first two corners (`A` and `¬A`).
      *   The formal possibility of `B` and `N` as defined alternatives.

  2.  **Translates with Distortion:**
      *   **Ontological vs. Semantic:** The Tetralemma is fundamentally about the *nature of reality* (does `X` intrinsically exist?), while B4 is about *epistemic states* or *information sources* regarding truth values. Mapping `svabhāva` to a truth-value distorts the ontological weight.
      *   **Purpose of `B` and `N`:** In B4, `B` and `N` are *accepted* semantic values representing contradiction and lack of information. For Nagarjuna, they are *targets* for reductio (`A ∧ ¬A` implies inherent contradiction; `¬(A ∨ ¬A)` implies non-existence beyond simple negation). They are refuted, not affirmed.
      *   **Entailment:** Nagarjuna's *local* reductio uses classical entailment, but his *global* conclusion (no `koṭi` holds) negates the possibility of any stable entailment for ontological claims within this four-fold scheme. B4 defines consistent entailment relations *over* its four values.
      *   **The Bilattice Orders (`≤ₗ`, `≤ᵢ`):** These structures are absent and irrelevant to Nagarjuna's argument. His logic is dialectical refutation, not ordering truth values or measuring information content.

  3.  **No Expression in B4/Bilattice Vocabulary:**
      *   **Emptiness (Śūnyatā):** The core conclusion that all phenomena lack intrinsic existence and that *no* ontological `koṭi` ultimately applies. B4 has no value or concept representing "this entire truth-value framework is inapplicable at the ultimate level."
      *   **The Reductio Against All Four Corners:** The *process* of systematically rejecting `A`, then `¬A`, then `A ∧ ¬A`, then `¬(A ∨ ¬A)` *as exhaustive options for ontology* leads to a conclusion *outside* the four values. B4 operates *within* its four values.
      *   **The Soteriological Goal:** The tetralemma isn't just logic; it's a tool to dismantle reification (`prapañca`), leading to liberation from suffering. B4 is a formal semantic system.
      *   **The Conventional/Ultimate Distinction:** The tetralemma deconstructs ultimate existence (`svabhāva`), but allows for conventional truth (`saṃvṛtisatya`) where language and logic function pragmatically. B4 doesn't model this duality.
      *   **Self-Emptiness of Emptiness:** The non-reification of the conclusion itself.

  **Committed Interpretation & Translation Impact:**

  **I argue that (c) is the most coherent reading: The Tetralemma is a purely dialectical tool, not a logic describing how the world "runs" or endorsing a four-valued ontology. It's an exhaustive proof that all ontological categorizations (including `B` and `N`) collapse, revealing emptiness (śūnyatā).**

  **Defense:**

  1.  **Nagarjuna's Method:** The *Mūlamadhyamakakārikā* relentlessly applies the tetralemma as a *reductio ad absurdum* against *every* proposed inherent nature. He doesn't build a system where `B` or `N` are valid ontological states; he demonstrates their incoherence *when applied to svabhāva*. The fourth corner (`neither`) is explicitly refuted just like the others (e.g., MMK 22:11 refutes the `neither` view of Tathāgata after death).
  2.  **The Goal is Collapse:** The point isn't to assign a fourth value but to show that *all* possible assignments fail. The conclusion isn't "the world has truth-value `N`" or even `B`; it's that the *question of intrinsic existence* is fundamentally ill-posed because phenomena lack `svabhāva`. Emptiness is the exhaustion of all four possibilities.
  3.  **Emptiness as Dissolution, not Glut/Gap:** Emptiness isn't the "neither" value (`N`) – Nagarjuna refutes that too. Nor is it a glut (`B`). It's the realization that the very framework of asserting/disputing intrinsic existence is based on a false premise (inherent existence). It dissolves the question. Glut/Gap theories (like B4) *operate within* a truth-functional framework; Madhyamaka points to the emptiness *of* that framework for ultimate ontology. Conventionally, ordinary logic suffices.
  4.  **Svabhāva as the Target:** The tetralemma's power is specifically against claims about *inherent, independent existence*. It doesn't necessarily apply to all propositions (e.g., "there is suffering" functions conventionally). B4 aims to be a general semantic framework. Nagarjuna's tool is targeted at de-reification.

  **Impact on the Translation:**

  1.  **`B` and `N` Get Eaten:** Belnap's `B` and `N` map perfectly to the *structure* of the third and fourth `koṭis` *as targets*. However, Nagarjuna's dialectic *consumes* them. They are not legitimate, stable ontological states or truth-values `svabhāva` can possess; they are logical possibilities proven incoherent when applied to reality. They "survive" only as conventional concepts or as the specific forms of absurdity derived in the reductios.
  2.  **Emptiness is Dissolution:** Madhyamaka emptiness is fundamentally a move that *dissolves* the question of intrinsic truth-value (for ontology). It's not that statements *have* a special truth-value (`neither` or a fifth value); it's that the concept of "intrinsic truth-value" for ontological claims is empty. B4's `N` is *a* truth-value within a system; emptiness denies the applicability of the system's core question (`svabhāva?`) at the ultimate level.
  3.  **The Bilattice is Irrelevant:** Since the tetralemma is a tool for deconstruction leading to a conclusion *outside* the four values, and since Nagarjuna doesn't utilize ordering relations, the specific structure of the bilattice (while mathematically interesting for the value set) adds no insight into Madhyamaka. The dialectical *exhaustion* and *rejection* are the key features, not lattice orders.
  4.  **Residue Dominates:** The clean mappings (the 4 values, exhaustiveness) are merely the *starting point* Nagarjuna uses. The crucial residue – emptiness, the reductio against all four, the dissolution of the question – is where his unique philosophical contribution lies, and this has no counterpart in B4. B4 provides a vocabulary for the *shape* of the trap; Nagarjuna shows how to spring it and escape.

  **In essence:** The Tetralemma uses the *form* of a four-fold exhaustive categorization (which Belnap formalizes) as the structure for a devastating dialectical critique. It demonstrates the incoherence of *all* ontological positions (`T`, `F`, `B`, `N` as applied to `svabhāva`), leading to the realization of emptiness. While B4 gives us the box, Nagarjuna proves the box is empty and we never needed to be inside it in the first place. The translation captures the scaffolding but not the demolition or the open space that remains.
