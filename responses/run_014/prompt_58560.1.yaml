  #### **Position Descriptions**  
  - **Unitary (✓)**: Intelligence is a general capacity; strengths/weaknesses across domains should correlate.  
  - **Pluralist (✓)**: Multiple independent capacities exist; no single "intelligence" score.  
  - **Adaptive (✓)**: Intelligence = achieving context-specific goals.  
  - **Embodied & Embedded (✓)**: Intelligence requires a body and environment; not just a brain/program.  
  - **Deflationary (✓)**: "Intelligence" is a folk term for socially valued traits, not a natural kind.  

  #### **Key Notes**  
  1. **Uncovered Combination** (e.g., **1C, 2B, 3B, 4A, 5B, 6B, 7B, 8A, 9C**):  
     - High Unitary (items 2B, 3B, 4A, 5B, 6B, 8A) + Deflationary (items 1C, 4A, 7B, 9C).  
     - **Status**: *Incoherent*—Unitary assumes a universal capacity, while Deflationary denies it.  

  2. **Unreliably Separated Positions**:  
     - **Adaptive vs. Embodied & Embedded**: Overlap on group intelligence (items 3A, 6A) and context-dependence (9B). Adaptive emphasizes goal-achievement; Embodied emphasizes physical/situational necessity.  
     - **Unitary vs. Embodied & Embedded**: Overlap on integration failures (items 2B, 5B, 7B). Unitary stresses domain integration; Embodied stresses body/environment integration.  

  3. **Ambiguous Responses**:  
     - Hybrid views may emerge (e.g., high Pluralist + Adaptive). Use the highest tally, then review overlapping items.  

  ---

  ### **Rationale**  
  - **Vignettes**: Cover required cases (octopus, AI, ants, memorizer, robot) + two probing consciousness/understanding/goals (AI Poet, Crow) + one group/individual (Human Team).  
  - **Response Design**: Avoids theory labels; focuses on judgments about cases (e.g., "solved a novel problem" vs. "instinct").  
  - **Scoring**: Based on logical alignment between answers and positions. Positions are defined functionally (e.g., Adaptive = goal-success in context).  
  - **Transparency**: Flags overlaps (Adaptive/Embodied, Unitary/Embodied) and an incoherent combination.  

  This quiz encourages reflection on intuitions about intelligence while minimizing theoretical bias. Use the scoring key as a starting point for seminar discussions.
