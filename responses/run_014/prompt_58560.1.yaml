  Below is a diagnostic sorting quiz designed to sort students into five theoretical positions on intelligence through concrete vignettes. Each item presents a scenario followed by 2-3 substantive, non-technical response options. The scoring key maps answer patterns to the positions, identifies gaps, and flags overlaps.

  ---

  ### **Diagnostic Quiz: The Nature of Intelligence**  
  *For each scenario, select the statement you agree with most.*

  1. **Octopus Puzzle**  
     An octopus in a lab encounters a sealed jar containing food. Without prior experience, it twists the lid off to eat. It shows no language-like communication.  
     - **A)** This shows intelligence: it solved a novel problem using its body.  
     - **B)** This shows cleverness only in physical tasks, not "true" intelligence.  
     - **C)** This is instinct, not intelligence.  

  2. **Language Model**  
     An AI produces expert-level legal analysis but, when given a robotic arm, fails to stack blocks without knocking them over.  
     - **A)** It is intelligent in language but not physical tasks.  
     - **B)** It lacks real intelligence because it can’t integrate language with physical action.  
     - **C)** It is intelligent—it excels at its designed task (law).  

  3. **Ant Colony**  
     After flooding, an ant colony relocates via decentralized interactions (no central controller). It finds a new nest efficiently.  
     - **A)** The **colony as a whole** displays intelligence.  
     - **B)** Only **individual ants** display intelligence.  
     - **C)** This is instinct, not intelligence.  

  4. **Rote Memorizer**  
     A person memorizes entire phone books but struggles to plan meals, generalize ideas, or explain proverbs.  
     - **A)** They lack general intelligence—reasoning matters more than memory.  
     - **B)** They have one intellectual strength (memory) but weakness elsewhere.  
     - **C)** They are intelligent—they excel at a valued skill.  

  5. **Delivery Robot**  
     A robot navigates unfamiliar buildings flawlessly but causes chaos when yielding to humans requires unwritten social norms.  
     - **A)** It is intelligent in navigation but not social tasks.  
     - **B)** Its social failure shows it lacks real intelligence.  
     - **C)** It is intelligent—it succeeds at its core task (navigation).  

  6. **Human Team**  
     Engineers design a complex machine. No one understands the whole system, but the team succeeds through collaboration.  
     - **A)** The **team as a whole** displays intelligence.  
     - **B)** Only **individual engineers** display intelligence.  
     - **C)** Team success stems from process, not intelligence.  

  7. **AI Poet**  
     An AI writes prize-winning poetry that moves readers but reports no subjective experiences or feelings.  
     - **A)** It is intelligent in creative writing.  
     - **B)** It lacks real intelligence—no consciousness or understanding.  
     - **C)** It is intelligent—it achieves its goal (emotional impact).  

  8. **Crow Tool Use**  
     A crow shortens a stick to extract insects from a deep hole, adapting on the spot.  
     - **A)** This shows intelligence—flexible problem-solving.  
     - **B)** This shows a specialized skill, not general intelligence.  
     - **C)** This is learned behavior, not intelligence.  

  9. **Cross-Cultural Experts**  
     In a remote tribe, star navigators are seen as highly intelligent. In a city, they might be deemed uneducated.  
     - **A)** Intelligence is universal—the experts are intelligent anywhere.  
     - **B)** Intelligence depends on context—they thrive in their environment.  
     - **C)** "Intelligence" reflects what a culture values—no universal standard.  

