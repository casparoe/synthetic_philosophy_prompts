prompt: |-
  ok so im trying to lead a discussion next week for a bunch of non-philosophy friends about what counts as dead and I am so sick of the standard ventilator case where the brain is gone but the heart is still beating. can you cook up a brand new hospital case for me that goes the other way around, where the brain-based view says the person is still alive but the circulation-based view says they are dead?

  heres the catch - it has to feel like something that could actually happen in an ER or ICU right now, no head transplants or sci-fi freezer stuff or demons pulling levers, and keep the actual story to like one short paragraph. please make the whole trick turn on what irreversible is supposed to mean, like a DNR or a decision not to resuscitate, not on some crazy new machine. and to keep us on track, assume for the thought experiment that brain death means irreversable loss of all brain function and circulatory death means irreversable loss of heartbeat and breathing.

  then after you give the story, break it down for me in plain language: why does each view give the verdict it does, which one little detail is doing all the work here and what happens to the verdicts if you remove that detail, and how would a fan of the circulatory view try to fight back and save their view? its for getting normal people to see why the wording matters, so a case that just stipulates who is dead without showing how you get there from the definitions would be cheating.
