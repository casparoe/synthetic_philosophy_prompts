prompt: |-
  I teach a philosophy of language course, and one of the things that reliably puzzles my students is the relationship between what a sentence means and what a speaker means by uttering it — the Gricean distinction, roughly, between sentence meaning and speaker meaning. I want to bring this to life by examining a concrete legal practice, and I'd like you to help me think through what that practice presupposes.

  Here is the practice. In American perjury law, there is a well-known doctrine — call it the literal-truth defense — according to which a witness cannot be convicted of perjury if the statement they made under oath was literally true, even if they intended to mislead the questioner and succeeded in doing so. A witness who is asked "Did you ever meet with Mr. X?" and answers "I have never been in the same room as Mr. X," when in fact they met Mr. X outdoors in a park, has not committed perjury: the statement, taken literally, is true. The witness's communicative intention — to convey that no meeting occurred — is irrelevant to criminal liability, so long as the words themselves, read in their most narrow and uncharitable sense, correspond to the facts.

  Now compare this with how the same legal system handles fraud, contract interpretation, and defamation. In fraud cases, a literally true statement can still be actionable if it was crafted to create a false impression in the mind of a reasonable hearer. In contract law, courts routinely interpret terms by asking what a reasonable person in the position of the parties would have understood them to mean, not by parsing the text as though it were a logical formula. In defamation, the "substantial truth" doctrine protects a defendant whose statement was true in gist even if literally inaccurate in some detail — the mirror image of perjury's rule.

  So we have an asymmetry: in perjury, the law treats sentence meaning (narrowly construed) as the thing that matters for criminal liability; in fraud, contract, and defamation, the law treats speaker meaning, or at least the meaning a reasonable hearer would recover, as what matters. The same words, spoken with the same communicative intention, can be legally innocuous in one context and legally culpable in another, depending entirely on which doctrine applies.

  What I want you to do is reconstruct the implicit theory of linguistic communication — and the implicit theory of what makes a statement an assertion, a representation, or a communicative act — that this asymmetry presupposes. Specifically:

  1. What view of the relationship between sentence meaning and speaker meaning does the perjury rule presuppose, and what view do the fraud and contract rules presuppose? Are these views consistent with each other, or does the legal system tacitly endorse incompatible theories of meaning depending on the context?

  2. Is there a principled way to reconcile the asymmetry? For instance, one might argue that perjury is about the oath — a promise to tell the truth, where "the truth" is understood as sentence-truth — while fraud is about the relationship between two parties, where what matters is the reasonable expectations each creates in the other. Does that distinction hold up under scrutiny, or does it merely redescribe the asymmetry without justifying it?

  3. What would have to change in perjury law if we adopted a thoroughly Gricean view, on which what a speaker means is primary and sentence meaning is merely a piece of evidence the hearer uses to recover it? And conversely, what would have to change in fraud law if we adopted the perjury rule's apparent commitment to sentence meaning as the sole locus of truth and falsity?

  4. Finally, is there a coherent philosophical position according to which the asymmetry is exactly right — that is, a position that gives sentence meaning a privileged role in one kind of legal context and speaker meaning a privileged role in another, without contradiction? If so, what is it, and what broader view of language and responsibility does it commit one to?
reasoning: |-
  Okay, the user teaches philosophy of language and wants to explore the Gricean distinction between sentence meaning and speaker meaning through legal examples. They've noticed an asymmetry in how different areas of law handle this distinction: perjury focuses on literal truth, while fraud, contracts, and defamation consider speaker intention or reasonable interpretation. 

  Hmm, this is a sophisticated query that blends legal doctrine with linguistic philosophy. The user clearly understands both domains well but wants help articulating the underlying theoretical tensions. Their questions suggest they're preparing a lesson plan to make abstract concepts concrete for students. 

  First, I need to map the legal asymmetry to philosophical frameworks. The perjury rule seems aligned with formal semantics - treating language as a logical system where truth conditions are fixed by syntax and lexicon. Fraud/contract rules, meanwhile, embrace pragmatic theories where context and intention shape meaning. These aren't necessarily contradictory; they reflect different institutional purposes. 

  For the oath-based justification (question 2): There might be something to this. When witnesses swear to tell "the truth," the ceremonial context frames language formally, almost like signing a document where every word matters. But in fraud, we're evaluating social interactions where reasonable reliance matters more than semantic precision. Still, this feels descriptive rather than philosophically deep. 

  The Gricean perjury hypothetical (question 3) is fascinating. If courts considered speaker meaning, defendants could still avoid liability by showing their intended deception didn't actually mislead - but that would defeat perjury's deterrence purpose. Conversely, literalist fraud law would incentivize weasel-wording, undermining commercial trust. 

  The reconciliation (question 4) might lie in speech act theory. Perjury treats testimony as a ritual utterance where locutionary force dominates; fraud addresses perlocutionary effects in ordinary communication. This positions the asymmetry as functionally coherent rather than theoretically inconsistent. 

  User's probably looking for ways to help students see that meaning isn't monolithic - legal contexts activate different dimensions of language. Should emphasize how institutional goals shape interpretive methods. Might also note that even in perjury, "literal meaning" isn't truly context-free (e.g., how courts define "same room" in the park example). 

  ...Wait, did I address their concern about contradictory theories? Need to clarify that while the approaches differ, they're compartmentalized tools rather than global claims about language. The law's "inconsistent" theories are actually just context-specific applications.
answer: |-
  This legal asymmetry reveals a fascinating tension in how institutions operationalize theories of meaning. Let's reconstruct the implicit theories and their potential reconciliation:

  ### 1. **Presupposed Views of Meaning**  
     - **Perjury Rule (Literal Truth Defense):**  
       Presupposes a **formalist-semantic view**: Sentence meaning is objective, context-independent, and determined by conventional definitions and syntax. Speaker intention is irrelevant to truth evaluation. This aligns with truth-conditional semantics (e.g., Davidson) or logical positivism.  
       *Philosophical commitment:* Language is a code with fixed rules; truth is a correspondence between words and world.  

     - **Fraud/Contract/Defamation Rules:**  
       Presupposes a **pragmatic-intentional view**: Meaning arises from context, speaker goals, and reasonable interpretation. This echoes Grice (speaker meaning), Austin (speech acts), and relevance theory (Sperber & Wilson).  
       *Philosophical commitment:* Language is a tool for social action; meaning is co-created in communication.  

     - **Consistency?**  
       These views are *theoretically incompatible* at the level of linguistic philosophy. The law’s asymmetry suggests a **pragmatic institutional compromise** rather than a coherent theory of meaning. Context determines which theory applies.

  ---

  ### 2. **Principled Reconciliation? The "Oath vs. Relationship" Distinction**  
     The distinction holds *functionally* but requires deeper justification:  
     - **Perjury as Ritualized Locution:**  
       The oath transforms testimony into a **decontextualized speech act**. By swearing an oath, the speaker enters a formal pact where language is stripped of pragmatics. The law treats testimony like a signed affidavit – only the text matters.  
       *Justification:* Deterrence of deceit under oath requires bright-line rules. Subjective intent is too volatile for criminal liability.  

     - **Fraud/Contracts as Relational Illocutions:**  
       These domains govern **social coordination**. Liability hinges on whether speakers induced reasonable reliance (fraud), mutual understanding (contracts), or reputational harm (defamation).  
       *Justification:* Protecting trust in everyday transactions demands attention to communicative effects.  

     **Scrutiny:** This distinction *redescribes* the asymmetry but doesn’t fully justify why perjury ignores speaker intent. A deeper principle:  
     - **Epistemic Access:** Courts can objectively verify *what was said* (perjury) but struggle to verify *what was meant* (hence fraud’s "reasonable hearer" standard).  
     - **Moral Gravity:** Perjury’s criminal severity warrants stricter textualism; civil wrongs balance fairness with interpretive flexibility.  

  ---

  ### 3. **Counterfactuals: Gricean Perjury vs. Literalist Fraud**  
     - **Gricean Perjury Law:**  
       - Witnesses could argue: “My words were literally true, but I *intended* to deceive.”  
       - Prosecutors would need to prove deceptive intent *and* successful misleading.  
       - Result: Fewer convictions, incentivizing "clever" literal truths. The oath’s constraining function weakens.  

     - **Literalist Fraud/Contract Law:**  
       - A real estate agent saying “This house has southern exposure” (true for the garage) would face no liability for misleading buyers.  
       - Contracts could be voided over minor literal inaccuracies (e.g., “100-acre farm” vs. 99.5 acres).  
       - Result: Erosion of commercial trust; rewards semantic trickery.  

  ---

  ### 4. **A Coherent Philosophical Position: Institutional Pragmatism**  
     The asymmetry is defensible via a **functional dualism** rooted in institutional purposes:  
     - **Sentence Meaning for Oath-Bound Assertions:**  
       In contexts of formal truth-telling (oaths, affidavits), language is **reified**. The speaker cedes interpretive authority to the system. This protects against self-serving reinterpretations.  
       *Commitment:* Institutions can create "meaning-fixing" contexts where language is artificial.  

     - **Speaker/Hearer Meaning for Relational Norms:**  
       In cooperative activities (transactions, reputation), meaning is **dialogic**. Liability attaches to failures of communicative responsibility.  
       *Commitment:* Ordinary language is inherently pragmatic; speakers owe duties of clarity.  

     **Broader View:**  
     - **Language as a Multi-Tool:** Meaning is neither purely semantic nor purely pragmatic; its nature shifts with social context.  
     - **Responsibility as Role-Dependent:** In oath-taking roles, you’re responsible for your *words*. In relational roles, you’re responsible for your *impact*.  
     - **Legal Metalinguistics:** The law doesn’t adopt a theory of meaning; it *assigns* theories to serve policy goals (e.g., perjury’s deterrence vs. contract’s fairness).  

  ---

  ### Pedagogical Implications  
  This asymmetry powerfully illustrates that **meaning is not monolithic**. The law treats language as:  
  - A *calculus* in perjury (rigid, verifiable),  
  - A *social practice* in fraud/contracts (fluid, expectation-based).  

  This mirrors how students shift between literal and pragmatic interpretations in daily life. Highlighting the law’s contextual choices can bridge abstract theory and real-world stakes – showing that philosophical debates about meaning have tangible consequences for justice.
