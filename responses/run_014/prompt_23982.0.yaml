  ### Decision Procedure for Non-Ordinary Goods Transactions  
  **Purpose**: To evaluate proposals involving non-ordinary goods (e.g., organs, emergency supplies, voting) systematically, separating factual analysis from value judgments. Outputs: **ALLOW** (proceed as-is), **BAN** (reject), **REGULATE** (allow with specific safeguards), or **HAND-OFF** (refer to ethics committee for value-based trade-offs).  
  **Time Limit**: 30 minutes per proposal. Document answers at each step. Stop early if a step mandates BAN or HAND-OFF.  

  ---

  #### Step 1: **Is the transaction clearly illegal?**  
  - **Plain-Language Test**: "Is this against current laws or regulations we know about? (E.g., federal, state, or industry-specific rules.)"  
  - **Sufficient Answer**:  
    - YES → **BAN** (Stop here).  
    - NO or UNSURE → Proceed to Step 2.  
  - **Why?** Legal compliance is non-negotiable; no further analysis needed if illegal.  

  #### Step 2: **Can the good be ethically transferred at all? (Alienability)**  
  - **Plain-Language Test**: "Is this something that can be given away or sold without violating core human rights or dignity? (E.g., a vote or a body part might be too personal to transfer, even if not illegal.)"  
  - **Sufficient Answer**:  
    - NO (e.g., voting rights, certain body parts) → **BAN** (Stop here).  
    - YES (e.g., ordinary goods, money) → Proceed to Step 3.  
  - **Why?** Addresses whether the good is inherently "not for sale," regardless of price.  

  #### Step 3: **Would pricing commodify the good in a damaging way?**  
  - **Plain-Language Test**: "If we turn this into a paid transaction, would it change the meaning of the good or harm important relationships? (E.g., paying for votes might undermine democracy; paying for kidneys might reduce altruism.)"  
  - **Sufficient Answer**:  
    - YES, and damage CANNOT be fixed → **BAN** (Stop here).  
    - YES, but damage CAN be reduced → Note "REGULATE: Mitigate commodification" and proceed.  
    - NO → Proceed to Step 4.  
  - **Why?** Separates "pricing" from "commodification" (reshaping the good for market).  

  #### Step 4: **Is the transaction exploitative?**  
  - **Plain-Language Test**: "Is one party forced into this deal due to desperation or lack of options? (E.g., someone selling a kidney to pay rent is vulnerable; a hospital paying high prices for ventilators isn’t.)"  
  - **Sufficient Answer**:  
    - YES, and vulnerability CANNOT be fixed → **BAN** (Stop here).  
    - YES, but vulnerability CAN be reduced → Note "REGULATE: Prevent exploitation" and proceed.  
    - NO → Proceed to Step 5.  
  - **Why?** Focuses on power imbalances (unfairness ≠ exploitation).  

  #### Step 5: **Is the transaction grossly unfair?**  
  - **Plain-Language Test**: "Are the terms so one-sided that they feel deeply wrong, even if both parties agree? (E.g., paying $1 for a lifesaving drug; charging 300% for masks.)"  
  - **Sufficient Answer**:  
    - YES → Note "REGULATE: Ensure fairness" and proceed.  
    - NO → Proceed to Step 6.  
  - **Why?** Addresses unfair terms without assuming vulnerability.  

  #### Step 6: **Would banning harm vulnerable people?**  
  - **Plain-Language Test**: "If we ban this, would it likely continue illegally and make things worse for those involved? (E.g., banning kidney sales might push donors into riskier black markets.)"  
  - **Sufficient Answer**:  
    - YES, and harm outweighs the risks of allowing → **REGULATE** (Stop here; design safeguards).  
    - NO or UNSURE → Proceed to Step 7.  
  - **Why?** Considers unintended consequences of prohibition.  

  #### Step 7: **Final Decision**  
  - **Assessment**:  
    - If any step flagged **REGULATE** → **REGULATE** (compile conditions from Steps 3–6).  
    - If no flags and no major concerns → **ALLOW**.  
    - If unresolved value conflicts (e.g., trade-offs between patient access and long-term harm) → **HAND-OFF** to ethics committee.  
  - **Conditions for REGULATE**: Must specify concrete safeguards (e.g., price caps, consent protocols, oversight).  

  ---

  ### Run the Procedure on Sample Proposals  
  **Key**:  
  - ✅ = Passed step  
  - ❌ = Failed step (triggers output)  
  - ⚠️ = Triggers regulation note  

  #### (1) Pilot: Pay living kidney donors $20K for directed donation  
  - **Step 1**: Clearly illegal under U.S. National Organ Transplant Act (prohibits valuable consideration for organs). ❌ → **BAN**.  
  - **Procedure Output**: **BAN** (Stops at Step 1).  

  #### (2) Policy: Pay 300% for ventilators/respirators during emergencies  
  - **Step 1**: Not clearly illegal (emergency price surges may be legal under disaster exemptions). ✅  
  - **Step 2**: Ventilators are ordinary goods; alienable. ✅  
  - **Step 3**: No commodification damage (medical supplies are already market goods). ✅  
  - **Step 4**: Not exploitative (hospital isn’t vulnerable; suppliers aren’t forced). ✅  
  - **Step 5**: MAYBE unfair (300% markup shocks conscience), but context-dependent → ⚠️ REGULATE: Add "fairness" conditions.  
  - **Step 6**: Banning could worsen shortages and harm patients → ⚠️ REGULATE: Add "consequence mitigation" conditions.  
  - **Step 7**: Combines REGULATE flags → **REGULATE** with conditions:  
    - Cap markup at 200% (unless extreme scarcity).  
    - Require multi-vendor bidding when possible.  
    - Document all purchases for audit.  

  #### (3) Program: $100 gift cards for voting in health bond election  
  - **Step 1**: Clearly illegal (vote-buying violates federal/state election laws). ❌ → **BAN**.  
  - **Procedure Output**: **BAN** (Stops at Step 1).  

  ---

  ### Verdict  
  **Verdict: BAN, REGULATE, BAN**  

  - **Kidney Donation**: Banned (illegal).  
  - **Emergency Supplies**: Regulate (add price caps and oversight).  
  - **Voting Gift Cards**: Banned (illegal and non-alienable).  

  **Note on Disagreements**:  
  - Your prior for the kidney proposal aligns with the procedure (BAN).  
  - The ventilator proposal’s **REGULATE** output reflects your "torn" stance: it avoids a ban but imposes strict conditions to address fairness and scarcity risks.  
  - The gift-card proposal’s BAN aligns with your suspicion but prioritizes legality over perceived community benefit.
