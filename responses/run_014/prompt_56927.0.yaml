answer: |-
  Here’s your prep sheet, calibrated for a room of Kratzerians, epistemologists, and a psycholinguist. Prioritizing high-likelihood/high-damage objections first.  

  ---

  ### **Top 8 Objections & Replies**  
  *(Ordered by threat level)*  

  1. **Objection (Compositionality - Mid-talk):**  
     *"If mood isn’t part of ‘if’ but switches the information state, where is this operator syntactically? What’s its semantic type? How does it compose with tense and attitude verbs (e.g., ‘John believes that if it rained, the match was cancelled’)?"*  
     - **Reply:** "Mood is a sentential operator (type ⟨s,t⟩ → ⟨s,t⟩) scoping above TP. For attitude verbs, it shifts the evaluation to the *subject’s* frozen or live information state. In ‘John believed that if it had rained…’, the subjunctive forces evaluation relative to John’s *past* evidence state, not his current one."  
     - **Soft spot:** Interaction with nested modals. **Concede:** "I’m still working on embedded mood in quantified environments." **Hold firm:** "The operator must be higher than TP to bind the conditional’s domain."  

  2. **Objection (Adams Pairs & Truth Conditions - Opening):**  
     *"Your view collapses truth conditions into assertability. But in the Oswald case, the indicative is *true* (given evidence JFK was shot), while the subjunctive is *false* (counterfactually, no one else tried). Isn’t this a truth-conditional difference?"*  
     - **Reply:** "No—both conditionals express the same relation: *B* is necessary given *A* in an information state. The indicative runs on *actual* evidence (where Oswald’s guilt is fixed); the subjunctive runs on *counterfactual* evidence (where it’s not). Truth *is* relative to the information state."  
     - **Soft spot:** Feels like truth-conditional variance. **Hold firm:** "This *is* a truth-conditional difference—but it’s driven by the shifted parameter, not ‘if’."  

  3. **Objection (Triviality/Propositions - Pile-up):**  
     *"If conditionals are evaluated relative to information states, how do we avoid Lewis/Edgington triviality? Do you lose propositional content entirely?"*  
     - **Reply:** "Conditionals express *inquisitive* or *dynamic* propositions (e.g., CCPs). Their ‘propositional’ content is a set of updates. Triviality arises only if we force them into a static, non-relational mold—which I reject."  
     - **Soft spot:** Epistemologists want truth-apt beliefs. **Concede:** "For belief reports, we use the subject’s information state." **Hold firm:** "Static propositions aren’t the right tool for conditionals."  

  4. **Objection (Negation & Compounds - Mid-talk):**  
     *"How do you negate ‘If A, B’? If I say ‘It’s not true that if A, B’, am I denying the relation holds in my current state, or in some other state?"*  
     - **Reply:** "Negation scopes over the mood operator. ‘Not [indicative(if A, B)]’ denies that *B* follows from *A* in *current* evidence. ‘Not [subjunctive(if A, B)]’ denies it in the *frozen* state."  
     - **Soft spot:** Ambiguity in natural language negation. **Concede:** "We need context to disambiguate scope."  

  5. **Objection (Psycholinguistics - Mid-talk):**  
     *"My experiments show people process indicatives as suppositional updates and subjunctives as ‘minimal change’ simulations. Doesn’t this require distinct mental representations?"*  
     - **Reply:** "Not at all! The *inputs* differ: indicatives use a live state (forcing minimal supposition), subjunctives use a frozen state (enabling dramatic revision). Same core operation, different data."  
     - **Soft spot:** Processing asymmetry. **Concede:** "The cognitive *effort* differs." **Hold firm:** "The *logical operation* (strict conditional over a state) is identical."  

  6. **Objection ("Just Repackaging" - Opening):**  
     *"Isn’t this a notational variant of Kaufmann/Kratzer? You replace ‘ordering source shift’ with ‘information state shift’, but it’s the same machinery."*  
     - **Reply:** "No: ordering sources *modulate similarity*. I replace similarity with *epistemic permissibility*. Crucially, mood *constrains which state you can use* (e.g., indicatives require *live* states). This explains why you can’t freely mix them without contradiction."  
     - **Soft spot:** Structural parallels. **Hold firm:** "Similarity-based accounts can’t explain the contradiction in Adams pairs."  

  7. **Objection (Temporal Anchoring - Pile-up):**  
     *"How do you determine *when* the ‘frozen’ state for a subjunctive is fixed? If I say ‘If WWII hadn’t happened…’, is the state frozen in 1939 or 1945?"*  
     - **Reply:** "Context resolves this. Usually, it’s the latest time where the antecedent was still possible. Default: antecedent’s reference time."  
     - **Soft spot:** Vagueness. **Concede:** "Context-dependence is unavoidable."  

  8. **Objection (Embedding under Modals - Pile-up):**  
     *"What if I say ‘It might be that if A, B’? Does the modal scope over the mood shift or vice versa?"*  
     - **Reply:** "Epistemic modals quantify over the information state *selected by mood*. ‘Might[indicative(if A, B)]’ means: in some live state-extension, *B* follows from *A*."  
     - **Soft spot:** Complex embeddings. **Concede:** "This needs formalization in a dynamic system."  

  ---

  ### **The Nuclear Option (Hope Nobody Asks)**  
  **Objection:** *"Your ‘frozen state’ is a get-out-of-jail-free card. If I show a subjunctive that behaves unexpectedly, you’ll just say the context picked a different state. How is this falsifiable?"*  
  - **Reply:** "It *is* falsifiable. Here’s a checkable prediction: **Subjunctives cannot be ‘backward-shifted’.** Example: After learning Oswald acted alone, you *can’t* say, ‘If he hadn’t shot Kennedy (subjunctive), someone else would have—but I now know that’s false.’ My theory forbids this because subjunctives lock *past* evidence. Two-lexical-entry views allow it."  
  - **Why it hurts:** If someone finds a backward-shifting subjunctive, you’re dead.  

  ---

  ### **Phrases to Avoid**  
  1. *"Truth is relative"* → Sounds like postmodern hand-waving. Say *"Truth is state-relative"*.  
  2. *"It’s just pragmatics"* → Semanticists will dismiss you. Say *"The lexical entry is uniform; mood modulates the parameter"*.  
  3. *"My view is simpler"* → They’ll ask for the complexity metric. Say *"My view explains constraints they can’t"*.  

  ### **Key Defense Strategy**  
  - **When attacked:** Redirect to the *contradiction in Adams pairs*. That’s your superpower.  
  - **Sacrifice:** Embedding complexities.  
  - **Never surrender:** One if, mood as state-switcher.  

  You’ve got this. Wear a bulletproof vest.  

  ---  
  *Final note: If the psycholinguist looks restless, throw them a bone: "I’d love to design an experiment with you testing backward-blocking in subjunctives."*
