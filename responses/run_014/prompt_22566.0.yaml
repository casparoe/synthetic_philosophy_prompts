  First, I need to recall Moore's key principles from Principia Ethica. His concept of "organic unities" is crucial here - the idea that complex wholes have value beyond their parts. Moore prized conscious states involving appreciation of beauty or human connection, especially when directed toward intrinsically valuable objects. 

