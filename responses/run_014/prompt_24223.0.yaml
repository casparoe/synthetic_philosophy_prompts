  ### Game Design: "The Information Dilemma"

  **Objective:** Illustrate Good's theorem through experiential learning—showing that more information is never worse in expectation, and its value is zero when it can't change the optimal decision.

  **Core Mechanics:**
  - **States:** Two possible states (A or B), determined by a coin flip.
  - **Actions:** Participants choose action X or Y.
  - **Payoffs:** Depend on the state and action (see tables below).
  - **Signal:** A hint about the state (80% accurate). Participants can choose to "peek" at the signal (free or at a cost).
  - **Groups:** Split participants into Group 1 and Group 2. Groups alternate roles each round.

  **Materials:**
  - Coin (for state flip).
  - Two bags: 
    - **Bag A:** 8 "A" tokens, 2 "B" tokens.
    - **Bag B:** 8 "B" tokens, 2 "A" tokens.
  - Payoff tables (displayed on screen or board).
  - Paper/tablets for choices.

  ---

  ### **Round 1: Valuable Information (Free)**
  **Goal:** Show information improves expected payoff.  
  **Payoffs:**  
  | State | Action X | Action Y |
  |-------|----------|----------|
  | A     | 100      | 0        |
  | B     | 0        | 100      |

  **Rules:**
  1. **State:** Flip coin (Heads = A, Tails = B).  
  2. **Groups:**  
     - **Group 1 (No Signal):** Choose X or Y blindly.  
     - **Group 2 (Signal):** Draw a token from the bag matching the state (e.g., Bag A if state is A).  
       - If token is "A", choose X.  
       - If token is "B", choose Y.  
  3. **Reveal state and payoffs.**  
  4. **Record averages:** Group 1 vs. Group 2.

  **Expected Outcome:**  
  - Group 1 averages ~50 (since ~50% guess right).  
  - Group 2 averages ~80 (80% get the right hint).  
  *Key Insight:* Information boosts average payoff despite some "bad" signals (20% get 0).

  ---

  ### **Round 2: Worthless Information (Free)**
  **Goal:** Show information has zero value when it can't change the decision.  
  **Payoffs:**  
  | State | Action X | Action Y |
  |-------|----------|----------|
  | A     | 10       | 10       |
  | B     | 10       | 10       |

  **Rules:**  
  1. **State:** Flip coin (irrelevant).  
  2. **Groups:**  
     - **Group 1 (Signal):** Draw a token and choose X or Y arbitrarily (payoff is always 10).  
     - **Group 2 (No Signal):** Choose X or Y arbitrarily (payoff is always 10).  
  3. **Reveal state and payoffs.**  

  **Expected Outcome:**  
  - Both groups average 10.  
  *Key Insight:* Information is worthless—it doesn’t change actions or payoffs.

  ---

  ### **Round 3: Costly Information (Valuable but Overpriced)**
  **Goal:** Show information isn’t worth it if its cost exceeds its value.  
  **Payoffs:** Same as Round 1.  
  **Signal Cost:** 40 points.  

  **Rules:**  
  1. **State:** Flip coin.  
  2. **Groups:**  
     - **Group 1 (No Signal):** Choose X or Y blindly.  
     - **Group 2 (Signal):** Pay 40 points to draw a token and choose based on it.  
  3. **Reveal state and payoffs (Group 2 deducts 40).**  
  4. **Record averages.**  

  **Expected Outcome:**  
  - Group 1 averages ~50.  
  - Group 2 averages ~40 (80 - 40).  
  *Key Insight:* Information has value (30 points), but a 40-point cost makes it a net loss.  

  ---

  ### **Timeline (75 Minutes)**  
  1. **Intro (5 min):** Explain states, actions, payoffs, and signals. Split into Group 1/2.  
  2. **Round 1 (20 min):**  
     - Setup (3 min).  
     - State flip, choices, payoff calculation (12 min).  
     - Record results (5 min).  
  3. **Round 2 (15 min):**  
     - Swap group roles (Group 1 now gets signal).  
     - Choices and payoff calculation (10 min).  
     - Record results (5 min).  
  4. **Round 3 (20 min):**  
     - Revert to Round 1 groups.  
     - Choices and payoff calculation (15 min).  
     - Record results (5 min).  
  5. **Debrief (15 min):** Map outcomes to Good’s theorem (see below).  

  ---

  ### **Debrief: Connecting to Good’s Theorem**  
  1. **Round 1 Recap:**  
     - *What happened?* Group 2 (signal) beat Group 1 by ~30 points on average.  
     - *Theorem Connection:* Information improved the **expected outcome** (80 vs. 50).  
     - *Critical Point:* Some in Group 2 got 0 due to bad signals—but this is offset by the average gain. **The theorem is about expectation, not single outcomes.**  

  2. **Round 2 Recap:**  
     - *What happened?* Both groups scored 10.  
     - *Theorem Connection:* Information had **zero value**—it couldn’t change the optimal decision (both actions were equally good).  

  3. **Round 3 Recap:**  
     - *What happened?* Group 2 (signal) lost to Group 1 by ~10 points.  
     - *Theorem Connection:* Information still had positive value (30 points), but **costs matter**. If cost > value, it’s a net loss.  

  4. **Core Lessons:**  
     - Information never hurts **in expectation** when free (Rounds 1–2).  
     - Its value is **exactly zero** when it can’t change your decision (Round 2).  
     - Costs turn information into a tradeoff—value must exceed cost (Round 3).  

  ---

  ### **Predictable Challenges & Limitations**  
  **What Could Go Wrong:**  
  - **Sampling Bias:** Small groups may not hit expected averages (e.g., Round 1 Group 2 averages 60 instead of 80 due to bad token draws).  
    - *Mitigation:* Calculate expected values publicly to show the gap between theory and single trials.  
  - **Misunderstanding Signals:** Participants might ignore signals or use them suboptimally.  
    - *Mitigation:* Clearly enforce signal-based decisions in Group 2.  
  - **Cost Confusion:** In Round 3, some may think information itself is harmful.  
    - *Mitigation:* Emphasize that the *cost* caused the loss, not the information.  

  **Limitations of the Activity:**  
  - **Single Trials:** The game can’t *empirically* prove expectation (since we can’t run infinite rounds). Use math to bridge the gap.  
  - **Rationality Assumption:** The theorem assumes participants act optimally on information. If they don’t, information may *seem* useless.  
  - **Complexity Cap:** Good’s theorem holds for continuous decisions and partial information—this game simplifies to binary cases. Mention this scope limit.  

  ---

  **Final Note:** Participants will "feel" the theorem through regret (e.g., Round 1 Group 2 members who got 0) and hindsight (e.g., Round 3 Group 2 realizing the cost was too high). Use these moments to underscore that information is a long-term asset, not a guaranteed win.
