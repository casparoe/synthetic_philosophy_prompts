  **DEPARTMENT OF PROPER FUNCTION (DPF)**  
  OFFICE OF REPRESENTATIONAL ASSIGNMENT & BELIEF REGISTRY  
  123 Phylogeny Drive, Darwin Precinct  
  Teleosemantica, CA 95610  

  **CERTIFIED MAIL**  
  **REFERENCE:** DPF-RA-78-4321-9B  
  **DATE:** 2023-10-27  

  Mr. Arthur Clemens  
  456 Conscience Lane  
  Moralton, CA 95611  

  **SUBJECT: NOTICE OF DENIAL - APPLICATION FOR REPRESENTATIONAL CONTENT ASSIGNMENT (RCA) - MORAL INTUITION: "TORTURING INNOCENT PEOPLE IS WRONG"**

  Dear Mr. Clemens:

  This letter constitutes formal notification regarding your Application for Representational Content Assignment (RCA), received by this office on 2023-09-15, concerning the mental state designated as "Moral Intuition: Torturing Innocent People is Wrong" (hereafter referred to as "the Intuition"). After thorough review by the Department of Proper Function (DPF) Bureau of Evolutionary Etiology, in accordance with **DPF Regulation Code § 4.01: Standards for Determining Proper Function**, we regret to inform you that your application has been **DENIED**.

  **REASON FOR DENIAL:** The Intuition has been classified as a *Spandrel* under **DPF Regulation Code § 4.07: Spandrel Exception**, and therefore fails to satisfy the **Proper Function Requirement (§ 4.01(a))** necessary for Representational Content Assignment.

  **SUMMARY OF DETERMINATION:**

  1.  **Proper Function Requirement (§ 4.01(a)):** Per established DPF policy, a trait (including mental states) can only be assigned representational content if it possesses a *Proper Function*. A Proper Function is defined solely as the effect for which the trait was *selected* by natural selection, and which explains its current presence in the population. Representational content is assigned *only* if the selected effect *was representation itself* (§ 4.01(a)(iii)).
  2.  **Original Instruction Doctrine (§ 4.01(b)):** The function of a trait is fixed irrevocably by its *original selection history*. Subsequent utility, reliability, or causal efficacy (§ 4.01(b) Note 2: "Current Reliability Irrelevant") cannot alter the trait's Proper Function or qualify it for Representational Content Assignment.
  3.  **Spandrel Exception (§ 4.07):** A trait is classified as a Spandrel if it is a necessary byproduct or architectural consequence of other traits that *were* directly selected, but was not itself a target of selection. Spandrels, by definition, lack a Proper Function (§ 4.07(a)). Consequently, Spandrels are incapable of possessing genuine representational content (§ 4.07(c)).
  4.  **Bureau Findings:** The Bureau of Evolutionary Etiology conducted a comprehensive phylogenetic analysis of the Intuition. The determination is that the Intuition is a cognitive Spandrel. It arises as a necessary byproduct of the selected-for trait **"Reciprocal Altruism Enforcement Module" (RAEM)** and associated **"Empathic Response Circuits" (ERC)**. While RAEM and ERC were selected for promoting cooperative group dynamics and kin/in-group protection, enhancing inclusive fitness, the abstract, universalizing prohibition against torturing *any* innocent person (regardless of kinship or reciprocal potential) exhibits no distinct selection pressure signature. The Intuition is a non-adaptive consequence (§ 4.07 Definition 2) of these underlying selected mechanisms. It is an "evolutionary exhaust fume," not an adaptive signal. Therefore, the Intuition lacks a Proper Function defined by selection (§ 4.01(a) unsatisfied). Application of the Spandrel Exception (§ 4.07(c)) mandates denial of RCA status.
  5.  **Current Reliability Irrelevant:** The Bureau acknowledges your application's Annex C documentation regarding the Intuition's perceived reliability and consistency across diverse human populations. However, § 4.01(b) explicitly states that current reliability or widespread occurrence cannot establish a Proper Function absent evidence of original selection *for that specific representational role*. Your Intuition may be a highly reliable cognitive output, but it remains a Spandrel.

  **YOUR RIGHT TO APPEAL:** You have the right to appeal this determination within sixty (60) calendar days from the date of this notice. Appeals must be submitted in writing to the DPF Appellate Division, using Form DPF-AD-01 ("Appeal of Representational Content Determination"). Appeals may be based *only* on the following grounds, supported by relevant evidence:

  *   **Ground A (§ 4.09(a)(i)): Error in Spandrel Classification:** Demonstrate that the Bureau erred in classifying the Intuition as a Spandrel. Provide specific, peer-reviewed phylogenetic, paleoanthropological, or comparative psychological evidence proving the Intuition is *not* a necessary byproduct of RAEM/ERC or other selected traits, but possesses its own distinct selection history. Mere functional utility arguments are inadmissible per § 4.01(b).
  *   **Ground B (§ 4.09(a)(ii)): Evidence of Direct Selection for Representing:** Provide specific, peer-reviewed evidence demonstrating that the Intuition *was* directly selected by natural selection *for the specific purpose of representing the abstract moral truth "torturing innocent people is wrong"*. Evidence must show this specific representational function conferred a fitness advantage distinct from the advantages conferred by RAEM/ERC. Appeals based solely on the intuition's phenomenological force or societal value will be dismissed per § 4.01(b) Note 2 and § 4.07(c).

  Failure to submit a timely appeal utilizing Form DPF-AD-01, or failure to base the appeal strictly on Ground A or Ground B with the required evidentiary support, will result in the automatic affirmation of this denial. The determination of the Appellate Division is final.

  **EFFECT OF DENIAL:** Without an assigned Representational Content Assignment (RCA), the mental state designated as "Moral Intuition: Torturing Innocent People is Wrong" retains its phenomenological character and may continue to influence your behavior. However, it possesses **no official representational status** recognized by the DPF. It does not bear content; it is classified as a non-representational cognitive state (Spandrel Output, Classification S7). It cannot be cited as a justificatory belief state in formal reasoning processes requiring veridical content (§ 5.22: Use of Non-Representational States in Deliberation).

  We understand this determination may be disappointing. The DPF operates strictly within the regulatory framework established to ensure accurate and evolutionarily warranted assignment of representational content, maintaining ontological hygiene within the cognitive ecosystem. For information on the appeals process or to obtain Form DPF-AD-01, visit www.dpf.gov/represent/appeals or contact the Appellate Division Clerk at (800) DPF-APPEAL.

  Sincerely,

  **Beatrice Thorne**  
  Beatrice Thorne, Deputy Director  
  Bureau of Evolutionary Etiology  
  Department of Proper Function  

  **cc:** DPF Central Registry (Non-Representational States Log)
