answer: |-
  ## The Plainest Poison

  Novara wasn’t Eden, but it tried. Nestled within a vast hydroponic cavern beneath a scorched Earth, its society prided itself on harmony, efficiency, and precision. Language, the Novarans believed, was the bedrock of that precision. Ambiguity was pruned like an errant vine. The Lexicon, a constantly updated digital dictionary, was their secular bible. Elara Thorne, newly arrived from the chaotic surface with her linguist mother, embraced this clarity. Words meant what the Lexicon said they meant. Simple.

  Her fascination was the bioluminescent lichen clinging to the cavern walls – *Luminara fracta*. Its light pulsed gently, a soft, rhythmic heartbeat against the sterile glow of the grow-lamps. Elara spent hours documenting its patterns, noting how the light intensity varied, sometimes subtly, sometimes more noticeably. She called it "flickering" in her notes, a perfectly accurate descriptor according to the Lexicon: *Flicker (v): To shine unsteadily; to vary rapidly in intensity.*

  She first used it aloud in the Commons, leaning over Councilor Bren’s shoulder as he monitored nutrient flow. "Remarkable how the western *fracta* patch *flickers* more intensely during the artificial dusk cycle," she observed, pointing at her datapad display. "See the variance?"

  Bren stiffened. The ambient chatter around them dipped. A woman nearby dropped her utensil with a clatter. Bren’s voice was tight. "An interesting observation, Novice Thorne. Perhaps ‘varies’ or ‘fluctuates’ would be… more precise."

  Elara blinked. "But ‘flickers’ *is* precise. Lexicon Definition 4A."

  Bren’s smile was brittle. "Context, Novice. Always context. Carry on." He turned sharply back to his console, effectively dismissing her. Elara felt a prickle of confusion, then irritation. Were Novarans allergic to perfectly good words?

  She discovered the weight of the word not from the Lexicon, but from Silas, a taciturn hydroponics engineer whose hands moved with practiced grace among the nutrient lines. He found her sketching the lichen later that day.

  "Careful with that word, surface-girl," he muttered, not unkindly, checking a valve. "*Flicker*."

  "Why?" Elara demanded, frustration bubbling. "It describes the phenomenon perfectly!"

  Silas sighed, wiping grease onto his coveralls. "You know the Sundering, yeah? Fifty cycles back?"

  Elara nodded. A schism, barely mentioned in official histories. A group advocating for… something different. Emotional expression? Less rigid schedules? The details were vague.

  "They called themselves the ‘Fluctuants’," Silas said, his voice low. "Believed strict adherence was stifling, that life needed… well, variation. Unpredictability. Like the old surface stories of firelight." He gestured vaguely upwards. "The Stability Council branded them dangerous. Unstable. A threat to Novara’s survival. And the word they used, the word spat at them in the corridors, scratched onto their doors, hissed during trials… was *Flicker*."

  Elara stared. "But… it just means unsteady light!"

  "To *you*, maybe. To the Lexicon, sure." Silas met her gaze. "But here? It means *weakness*. *Unreliability*. *Mental instability*. It means the ones who cracked under pressure during the Water Crisis. It means the ones who couldn’t conform. It means exile, or worse. That word… it carries the echo of fear. The fear of difference. The fear of *falling apart*." He tapped his temple. "The force of it, girl. That’s not in any dictionary definition. It’s in the history soaked into the walls."

  Elara’s stomach clenched. She remembered Bren’s reaction, the dropped utensil. Not confusion, but *revulsion*. She’d unwittingly invoked a ghost. The literal meaning was harmless, a description of light. The social force was a hammer blow of contempt.

  The realization terrified her, but also ignited a stubborn defiance. *Words shouldn’t hold such power against their meaning!* She decided her upcoming presentation on *Luminara fracta* cycles would be her stand. She would reclaim the word, use it purely descriptively, scientifically. The Lexicon would be her shield. She prepped meticulously, citing definition 4A prominently.

  The day arrived. The Council Chamber hummed with low energy. Director Vanya, stern and immaculate, presided. Elara began, outlining her research, the correlation between light cycles and lichen metabolism. She displayed graphs, used "varies," "oscillates," "intensity shifts." Then, she reached the core observation.

  "...and this is most pronounced in Sector Gamma," Elara stated, her voice clear, projecting a graph showing sharp, rapid peaks and troughs. "As you can see, the luminescence doesn’t merely vary; it exhibits a distinct, rapid pattern best described as..." She took a breath, consciously pushing aside Silas’s warning, clinging to the Lexicon. "...a *flicker*."

  The silence was instantaneous and absolute. It wasn't the pause of consideration; it was the vacuum after an explosion. Every screen seemed to freeze. Councilor Bren’s face drained of color. Director Vanya’s knuckles whitened on the armrests. An older councilwoman gasped, a tiny, sharp sound that echoed in the stillness. The air itself felt charged, thick with an invisible recoil.

  Elara plowed on, her voice suddenly too loud in the silence, gesturing to the Lexicon definition displayed beside the graph. "Lexicon Definition 4A: 'To shine unsteadily; to vary rapidly in intensity.' As you can observe, the data perfectly aligns with..."

  "Enough, Novice Thorne." Director Vanya’s voice cut through, colder than the cavern rock. The usual measured tone was gone, replaced by something hard and final. She didn’t look at Elara; she looked at the graph, at the word still displayed: **FLICKER**.

  "You have been informed," Vanya stated, each word precise and heavy as stone. "You were *expressly* informed of the contextual inadequacy and historical... *weight*... of that term within Novaran society. Yet you chose to employ it. In this chamber. Before this Council."

  "But Director," Elara protested, desperation rising, "the *meaning*! The Lexicon definition! I intended only the literal..."

  "**Intention is irrelevant!**" Vanya's voice cracked like a whip. The entire Council flinched. "The word carries its history. Its force travels with it, Novice Thorne, like a shadow you cannot shed by merely quoting definitions. Your... academic literalism... demonstrates a profound lack of social awareness. A disregard for the harmony your research purports to study." Vanya took a breath, the only sign of effort. "Your presentation is concluded. Report to Reassignment. Sector Maintenance. Effective immediately."

  Sector Maintenance. The tunnels where broken things were sent. Where the air tasted of dust and isolation. Where the only light was the unwavering, sterile glow of work-lamps. No lichen grew there.

  Elara stood numb as the Council filed out, avoiding her gaze. Bren paused briefly, his expression unreadable, then shook his head almost imperceptibly and moved on. The weight wasn't just disapproval; it was contamination. She had uttered the unspeakable, and the word, innocent in form but venomous in force, had done its work. The Lexicon’s definition lay on her datapad, stark and useless. It described the light, yes. But it couldn’t capture the decades of fear, the sanctioned hatred, the social violence condensed into that single, plain syllable – *Flicker*. The gap between meaning and force wasn't a philosophical curiosity; it was a chasm that had swallowed her whole.

  As she walked the long, empty corridor towards the maintenance lifts, she passed a viewport. Outside, clinging stubbornly to the cavern wall, a patch of *Luminara fracta* pulsed its gentle, uneven rhythm. It shone, dimmed, shone again. Unsteady. Varying rapidly in intensity. Elara looked at it, truly looked, for the first time since her arrival. It was beautiful. And the only word that perfectly captured its essence was the one now forever poisoned, the word whose harmless meaning was buried beneath the crushing weight of Novara’s fear. She pressed her hand against the cold plexiglass, watching the silent *flicker* in the dark, a perfect description echoing in a void where understanding was impossible. The force had traveled. The damage was done.
