prompt: |-
  I'm a postdoc in systematics, and I've been carefully keeping a log of how my advisor delimits species, because our working group is about to have to rule on a case I think will split the room, and I'd like to be able to anticipate his answer before the meeting. His calls so far: two populations of a sand lizard, cut off from one another by a dry valley, never seen to interbreed and only slightly different in belly coloration, which he called two species; two populations of a freshwater snail whose ranges overlap and which hybridize along a broad cline in shell shape, with no discrete boundary anywhere, which he called one species; and two populations of a ground beetle that are morphologically almost indistinguishable and overlap in range, but whose hybrids are mostly sterile, which he split into two species. I was going over these at last week's reading group and realized I can't actually say which of his decisions is tracking which of the usual species concepts.

  The case we now have to rule on, and which will determine whether we treat the population as a separate unit in an upcoming conservation assessment, is two populations of a small passerine bird that, where their ranges meet, still interbreed and produce fertile hybrids, with no complete reproductive barrier, yet which each are recovered as a distinct, monophyletic clade in a genome-wide analysis, carry a fixed diagnostic chromosomal inversion, and have been diverging for on the order of a million years. Can you tell me whether he'll most likely call this one species or two, which underlying criterion he seems to be running — reproductive isolation, genealogical distinctness, measurable morphological difference, or something else — and which other criteria fit his three earlier calls just as well? I'd also like a specific additional case I could put in front of him that would finally tell those criteria apart, and an honest word on whether his track record actually settles the question or leaves it genuinely open. Please keep the whole response under 450 words.
reasoning: |-
  Alright, let's tackle this. The user is a postdoc in systematics trying to predict their advisor's species delimitation decision. They've provided three past cases and a current one. First, I need to figure out the advisor's pattern.

  Looking at the sand lizard: separated by a dry valley, no interbreeding, slight color difference → two species. That points to isolation despite minimal morphological change. The snail: overlapping ranges, hybridization along a cline → one species. Here, gene flow seems key. The beetles: morphologically similar but sterile hybrids → two species. Reproductive isolation is the clear factor here.

  Now the current case: birds interbreed with fertile hybrids (no complete barrier), but monophyletic clades, fixed inversion, million-year divergence. The advisor would likely split them. Why? Because genealogical distinctness (monophyly + inversion) and deep divergence outweigh ongoing gene flow. This aligns with the Phylogenetic Species Concept (PSC), which emphasizes evolutionary independence.

  But the advisor also considered reproductive isolation in the beetles and gene flow in the snails. So it's not just PSC. The common thread is evolutionary independence: whether populations are on separate trajectories. The sand lizards are isolated, beetles have reproductive barriers, snails have gene flow. For the birds, despite some hybridization, the deep divergence and monophyly suggest they're independent lineages.

  To test this, propose cave fish: morphologically distinct, allopatric, but interfertile. If he calls them one species, he prioritizes reproductive potential (BSC). If two, he focuses on divergence/morphology (PSC/ESC). This would clarify if reproductive compatibility or divergence is his main criterion.

  The user's deeper need is understanding their advisor's reasoning to anticipate decisions and navigate group dynamics. They might also want to solidify their own stance for the conservation assessment. The advisor's approach isn't strictly one concept but a pragmatic emphasis on evolutionary independence. The track record shows consistency in this, so for the birds, splitting is likely.
answer: |-
  Based on his track record, your advisor will **very likely split the passerine birds into two species**, prioritizing **genealogical distinctness (Phylogenetic Species Concept - PSC)** and deep divergence despite incomplete reproductive isolation.

  **Analysis of his criteria:**
  1.  **Sand Lizards (Allopatry, no gene flow, minor morphology):** Split (2 spp.) → Prioritizes **lack of gene flow/isolation (Biological SC implication)** or diagnosability (PSC).
  2.  **Snails (Sympatry, gene flow/cline, morphology variable):** Lump (1 sp.) → Prioritizes **gene flow/potential interbreeding (Biological SC - BSC)**.
  3.  **Beetles (Sympatry, no gene flow due to sterility, minor morphology):** Split (2 spp.) → Prioritizes **reproductive isolation (Biological SC - BSC)**.
  4.  **Passerines (Some hybridization, fertile hybrids BUT monophyly, inversion, deep divergence):** *Predicted Split* → Prioritizes **genealogical distinctness/evolutionary independence (Phylogenetic SC - PSC)**. The deep divergence and fixed inversion signal separate evolutionary trajectories, outweighing current limited gene flow.

  **His Underlying Criterion:** He consistently emphasizes **evolutionary independence**, but uses different proxies (gene flow, reproductive isolation, monophyly) depending on data availability and context. No single concept fits all three prior cases perfectly, but **"separate evolutionary trajectories"** is the unifying theme. He uses reproductive criteria *when they are definitive* (sterility = isolation, cline = connection), but defaults to genealogical distinctness when available, especially with deep divergence.

  **Test Case to Disentangle BSC vs. PSC:**
  *   **Scenario:** Two allopatric cave fish populations. Morphologically distinct adaptations to caves, interfertile in lab crosses with no hybrid breakdown, strong monophyly in genomic data, divergence ~500k years. No current contact.
  *   **If he lumps (1 sp.):** Prioritizes BSC (reproductive compatibility potential).
  *   **If he splits (2 spp.):** Prioritizes PSC/Evolutionary SC (diagnosable divergence, monophyly).

  **Is his track record conclusive?** **Yes and No.**
  *   **Yes:** It strongly suggests he *will* split the passerines due to the profound genomic divergence and inversion, viewing limited hybridization as secondary. Conservation needs amplify this.
  *   **No:** It doesn't rigidly define a single concept. The test case reveals if BSC potential interbreeding ever outweighs clear divergence for him. His rationale likely combines PSC with time-based evolutionary independence.

