prompt: |-
  So I'm teaching a little unit on non-classical logics to my undergrads and last week we got completely bogged down on the Liar and dialetheism, you know the idea that some contradictions are actually true and we need a logic that doesn't explode into triviality when it meets one. My students keep hearing contradiction equals disaster and I want something to shake that loose before our final meeting, plus our department has this silly tradition of ending a tough unit with a poem taped to the office door.

  Could you write me a villanelle, so 19 lines with two refrains that keep coming back and then collide in the final quatrain, in the voice of someone who actually buys dialetheism, where one refrain leans toward saying the Liar sentence is true and the other leans toward saying it is false, and let the form do the philosophical work — the lines keep returning instead of resolving, and the ending shows why a paraconsistent approach can live with both without letting everything follow. Keep it accurate enough that a logician wouldn't cringe about explosion and the difference between rejecting consistency versus rejecting the idea that contradictions entail everything, but also make it work as a real poem for tired sophomores who are still mixing up teh Liar with just lying in general.
