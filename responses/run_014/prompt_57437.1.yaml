prompt: |-
  I'm not an academic and never went to uni — I've taught myself this stuff over about fifteen years of reading in the evenings, and for the last few years I've run a Thursday night philosophy group in the back room of a pub. One of the regulars, a sharp 19-year-old who's doing an online intro course, asked me to set her practice questions and mark the answers, because the course doesn't mark them. Which was possibly arrogant of me. I've got to the point where I can tell when an answer is waffling, but I can't reliably tell when it's fluent and quietly wrong, and I think that's what I need help with here.

  The question I set her (600 words max):

  > Explain the Doomsday Argument. Say which assumptions it actually needs, work through one version of the reasoning with real numbers, and then say whether the self-indication assumption defeats it. Give your own verdict at the end.

  I gave her this marking scheme, which I made up: 5 marks for stating the argument and its central idea, 5 for naming the assumptions it depends on, 5 for the numerical example (does it work, and does it do the job she says it does), 5 for the self-indication assumption part. Out of 20.

  Her answer:

  > The idea comes from Brandon Carter in the seventies and was worked out properly by John Leslie. Richard Gott came up with his own version independently, and his is the one people usually tell the story about. It's an argument that you can say something about how long humanity has left just by thinking about where you sit in the line of everyone who will ever live.
  >
  > The main assumption is the self-sampling assumption: you should reason as if you were a random sample from the class of observers you belong to. This makes sense for the same reason the Copernican idea does. You're not in a special place and you're not at a special time. If you don't know when you live, you should assume you could be anywhere in history, and the earlier you turn out to be, the shorter history probably is. Given that, your birth rank is like drawing a ticket out of a hat with N tickets in it, where N is the total number of humans who ever live.
  >
  > Toy version. Say your birth rank is about 70 billion, which is roughly the number of people who have ever lived. Two hypotheses. Short Future: the total is 100 billion, we die out fairly soon. Long Future: the total is 100 trillion, we spread out and last millions of years. If Short Future is true, the chance you'd draw the ticket numbered 70 billion is 1 in 100 billion, because any of those ranks was equally likely to be yours. If Long Future is true, it's 1 in 100 trillion. So your rank is evidence for Short Future over Long Future by a factor of about a thousand. Notice that ratio doesn't depend on what you thought beforehand: whatever your priors were, they shift by the same factor. If you started at 50/50 you should now be at about a thousand to one. So most of us are living near the end.
  >
  > The argument never predicts a date. It doesn't say we're finished in 2500. It just moves probabilities around. Gott's version is slightly different again — he doesn't use a prior at all, he just says that with 95% confidence you're in the middle 95% of the sequence, so the total is within a factor of a few dozen of your rank in either direction.
  >
  > Now the objection. The self-indication assumption says that the more observers a hypothesis contains, the more likely it is that you exist at all, so hypotheses with more people in them get a boost before you look at any evidence. That boost exactly cancels the doomsday shift: a hypothesis with a thousand times more observers in it gets a thousand times more weight, and then the thousand-to-one against it from your rank brings you right back to where you started. I think the self-indication assumption is correct and so the argument fails. And the standard worry about it — the presumptuous philosopher, who supposedly gets to know there are tons of observers just by sitting in an armchair — isn't a real problem. How many observers there are is an ordinary empirical question. You point telescopes at exoplanets, work out how many could support life, and you find out. So it isn't smuggling in free knowledge, it's just saying take seriously that there might be more of us than you assumed, and let the evidence about how big and how old the universe is settle the rest. Also the complaint about the reference class is overdone: whether you count humans or mammals or observers generally, you get roughly the same ballpark.

  I've read that maybe five times and I genuinely can't tell whether it's a strong answer or whether something's gone wrong in the middle of it. Give me a mark for each of the four sections and an overall mark out of 20, and then give me the comments I'd actually write to her, section by section, so she can see why each mark is what it is. I want the things she got right flagged clearly too, not just the errors, and I'd especially like to know about any mistake in there that reads as completely fine on a first pass. No need to point me at papers or books, I couldn't check them and it wouldn't help her either.

  Two more things. Don't soften it into "it depends" — give me definite marks, even if you're unsure. And then tell me where your own grading is shakiest: which of the things you've called wrong you'd be least willing to bet on, and what would change your mind about it — what consideration or counter-argument would make you mark that part differently. If you think a bit of her reasoning is defensible and I've just been unlucky to not spot it, say which bit and why you're on the fence.
reasoning: |-
  Okay, let me tackle this step by step. The user runs a pub philosophy group and needs help grading a student's answer on the Doomsday Argument. He's self-taught and worries about missing subtle errors in seemingly fluent answers. His main request is a clear breakdown of marks and feedback for each section, plus honesty about where my own grading might be shaky.

  First, I need to evaluate the student's answer against the four criteria he set: stating the argument (5 marks), naming assumptions (5), numerical example (5), and handling the self-indication assumption (5). The answer seems polished, but I must check for quiet errors.

  Starting with section one: she summarizes the Doomsday Argument's core idea well, citing key figures and the "random sample" premise accurately. Minor hiccups exist—Gott's version is oversimplified as "people usually tell the story about," but that's trivial. This deserves full marks (5/5).

  Section two identifies the self-sampling assumption correctly and links it to Copernican reasoning. But she misses the crucial prior indifference requirement—that we start agnostic about short/long futures. This is a significant omission for probability-based arguments. I'll deduct 2 marks here (3/5).

  The numerical example in section three mostly works: birth rank logic and probability ratios are sound. However, she falsely claims the ratio "doesn't depend on what you thought beforehand." The prior matters because Bayes' theorem multiplies prior odds by the likelihood ratio. This error undermines her later point about SIA "canceling" the shift. Still, the example itself functions, so 3/5 feels fair.

  For section four on SIA, she nails the cancellation effect and defends against the "presumptuous philosopher" objection persuasively. Her point about reference classes being "roughly the same ballpark" is debatable but reasonably argued. Strong showing—5/5.

  Overall 16/20. My shakiest mark is the numerical example deduction. While her prior-independence claim is wrong, one could argue that in *this specific toy model* with uniform priors, the ratio alone updates beliefs. But she generalized it recklessly. If pressed, I'd note this nuance in feedback but stand by the deduction.

  For feedback phrasing: I'll mirror the user's no-nonsense tone—direct praise/critique per section, flagging the prior indifference omission and the prior-dependence error as key fixes. The telescope analogy for empirical SIA validation gets explicit credit.
answer: |-
  Here's your mark breakdown and detailed feedback for the student, followed by transparency on where my grading is most uncertain.  

  **Marking:**  
  1. **Stating the argument & central idea:** 5/5  
  2. **Naming assumptions:** 3/5  
  3. **Numerical example:** 3/5  
  4. **Self-indication assumption (SIA) part:** 5/5  
  **Overall: 16/20**  

  ---

  ### Your Feedback to the Student  
  **Section 1: Stating the argument (5/5)**  
  *What you got right:* Perfect. You crisply defined the core idea (using birth rank to infer humanity’s lifespan), named key contributors (Carter, Leslie, Gott), and highlighted its probabilistic/non-predictive nature. The Copernican analogy ("not special place/time") was spot-on.  
  *Quietly excellent:* Explicitly noting it "moves probabilities, doesn’t predict a date" preempts a common misunderstanding.  

  **Section 2: Assumptions (3/5)**  
  *What you got right:* You correctly identified the **self-sampling assumption (SSA)** as essential and linked it to Copernican reasoning.  
  *What’s missing:* The argument critically relies on **prior indifference**. You must assume *initial equal plausibility* of the "Short Future" vs. "Long Future" hypotheses *before* applying SSA. Without this, the probabilistic shift doesn’t work as claimed. (e.g., if you thought "Long Future" was vastly more likely *before* considering your birth rank, the argument weakens).  
  *Why it matters:* Omitting this lets the argument seem stronger than it is. SSA alone can’t generate the shift without baseline symmetry.  

  **Section 3: Numerical example (3/5)**  
  *What you got right:* The toy model itself is well-constructed. You correctly calculated the likelihood ratio (1,000:1 for Short vs. Long Future) and showed how it updates priors. Gott’s variant (middle 95%) was succinctly explained.  
  *Critical error:* You claimed the ratio "doesn’t depend on what you thought beforehand." **This is false.** Bayes’ theorem multiplies prior odds by the likelihood ratio. If your prior heavily favored Long Future (e.g., 10,000:1), a 1,000:1 likelihood ratio *still leaves Long Future more probable* (10:1). The shift is *relative*, not absolute.  
  *Consequence:* This undermines your later claim that SIA "cancels" the shift. If priors aren’t symmetric, cancellation isn’t exact.  

  **Section 4: Self-Indication Assumption (SIA) (5/5)**  
  *What you got right:* Flawless. You explained how SIA counters Doomsday (higher observer count → higher prior probability), noted the exact cancellation effect, and dismantled the "presumptuous philosopher" objection with a strong empirical rebuttal (telescopes/exoplanets).  
  *Exceptional insight:* Your point that reference-class worries are "overdone" (if humans/mammals/observers yield similar orders of magnitude) is astute and often overlooked. This shows deep understanding.  
  *Verdict support:* Your conclusion (SIA defeats Doomsday) is logically defended and reflects nuanced engagement.  

  **Overall (16/20):** Excellent clarity and grasp of the big picture. Two subtle but significant errors in Sections 2–3 prevent full marks. Fix the prior-dependence and prior-indifference points, and this becomes a model answer.  

  ---

  ### Where My Grading is Shakier & Why  
  **The weak spot:** Your **Section 3 error** (claiming likelihood ratios bypass priors) is defensible *only if* you assume **implicit prior symmetry**. Some Doomsday presentations *do* frame it as a baseline 50/50 split (as your toy model did). *Why I still deducted marks:*  
  - You generalized recklessly: "Notice that ratio doesn’t depend..." implies *universal* prior-independence, which is mathematically false.  
  - **What would change my mind:** If you’d specified "under *initially equal priors*" before the ratio claim, I’d have awarded 4/5 (deducting only for omitting prior indifference in Section 2).  

  **Minor quibble (not deducted):** Your SIA defense slightly conflates *epistemology* (how we know observer counts) with *probability theory* (how we weight hypotheses). But your empirical emphasis ("point telescopes...") is a valid pragmatic counter to objections, so I didn’t penalize.  

  **You’d win the pub debate:** For a self-taught answer, this is outstanding. The errors are precisely the "fluent but wrong" traps experts fall into. With the prior-related fixes, you’ve mastered the core challenge.
