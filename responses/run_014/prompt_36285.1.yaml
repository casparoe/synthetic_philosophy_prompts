prompt: |-
  I work as the sole human-consent reviewer for a mid-sized university's research ethics board — mostly psychology experiments, some medical studies, maybe 30 protocols a month, and I have maybe 20 minutes per protocol before I have to flag it, pass it, or kick it to the full board. The board's written guidance basically just says consent must be "voluntary, informed, and competent," which is fine as a principle but useless to me on a Tuesday afternoon when I'm staring at a stack of applications. What I want is an actual procedure I can run: the checks in order, what a passing answer looks like for each, where the procedure ends in an automatic flag to the full board, and — this is the part our guidance never admits — where a check can't be settled by procedure at all and I just have to make a judgment call and say so.

  The philosophical stuff I half-remember from a bioethics course years ago (validity conditions like adequate disclosure, competence, absence of coercion or manipulation, and whatever the difference is supposed to be between invalidating a consent and merely making it regrettable) should be in there, but translated into questions a non-philosopher like me can ask of a protocol. I especially want the procedure to handle the fuzzy middle cases, because those are exactly the ones I keep agonizing over: a psychology study that uses deception and only reveals it in a debrief afterward (can consent given in advance cover being lied to?); a study paying $200 for a few hours of mildly unpleasant tasks, which I suspect is fine for students but maybe coercive for people in real financial need; and a surgeon recruiting her own patients into her clinical trial, where the person obtaining consent has authority over the participant's future care. If your procedure could also tell me what to do about an elderly participant whose daughter answers all the screening questions "for" her, that would help, because right now I have no idea whether that's a competence problem or a coercion problem or neither.

  Please run the finished procedure on those cases and show me the output — including at least one where it gives me an answer I won't like (I'm thinking of the surgeon one, since we've never rejected anything from that department and I doubt the board will thank me). And be blunt about where the procedure will misfire or where two reasonable reviewers following it could come out differently, since the whole point is that I stop pretending my gut instinct is a checklist.
reasoning: |-
  Okay, the user works as the sole human-consent reviewer for a university's research ethics board, handling about 30 protocols a month with only 20 minutes per protocol. They need a practical, step-by-step procedure to evaluate consent that's based on bioethics principles but translated into actionable checks. Their current guidelines are too vague, leading to indecision in fuzzy cases like deception studies, high payment, surgeon-patient dynamics, and third-party involvement in consent for elderly participants.

  First, I need to break down the core elements of valid consent: voluntary, informed, and competent. Each must be operationalized into specific questions. The user mentioned middle cases, so the procedure must handle ambiguity clearly, flagging when a judgment call is needed. 

  For voluntary consent, key issues are coercion and undue influence. The $200 payment example needs assessing if it's excessive for the population. The surgeon recruiting her own patients introduces power dynamics—this is a major red flag. Questions here should identify relationships of authority and whether alternatives exist.

  Informed consent requires adequate disclosure. Deception studies are tricky—does the initial consent cover deception, and is debriefing sufficient? The procedure must check if deception is justified and if participants can withdraw data post-debrief. Also, clarity: are materials jargon-free?

  Competence involves decision-making capacity. The elderly participant with the daughter answering questions raises concerns about assessing capacity and whether the daughter is a surrogate or coercive influence. Need to verify if capacity assessment is required and if third-party involvement is appropriate.

  The procedure should have clear outcomes: Pass, Flag for Full Board, or Judgment Call. Judgment calls should be documented when criteria are ambiguous. For example, the surgeon scenario almost certainly needs full board review due to conflict of interest.

  The user also wants transparency on where the procedure might misfire. For instance, in deception studies, some reviewers might see debriefing as adequate while others don't. High payments: determining what's "undue influence" can be subjective based on local economic factors.

  Running the examples: 
  1. Deception Study: Pass with flag for documentation of debriefing and withdrawal option. 
  2. High Payment: Judgment call—needs assessment of participant pool vulnerability. 
  3. Surgeon-Patient: Flag for full board due to power imbalance. 
  4. Elderly Participant: Flag for competence assessment procedures. 

  The surgeon example is intentionally tough because the user expects pushback. The procedure must be robust enough to justify such flags. Highlighting where disagreement might occur (e.g., competence assessments) prepares the user for board discussions. 

  Finally, the procedure should save time by providing clear checkpoints but also acknowledge limitations. Emphasizing documentation of judgment calls helps the user defend decisions. The user's deeper need is confidence and efficiency, reducing moral distress by having a structured approach instead of gut feelings.
answer: |-
  Here's a battle-tested, step-by-step consent review procedure designed for speed and clarity, based on core validity conditions but translated into operational questions. It explicitly flags judgment calls and includes *when to stop* and escalate.

  **The 8-Step Consent Review Procedure (20-Minute Version)**

  1.  **BASIC COVERAGE CHECK (Pass/Fail)**
      *   *Question:* Does the protocol *explicitly include* a consent process (written, oral, electronic) AND a finalized consent form/document?
      *   *Passing Answer:* Yes, both are present and identifiable.
      *   *Flag to Full Board:* No consent process described OR no consent form provided. **STOP REVIEW.**
      *   *Judgment Call?* No. This is binary.

  2.  **COMPETENCE THRESHOLD CHECK (Pass/Flag/Judgment)**
      *   *Question:* Does the target population *prima facie* include individuals likely lacking capacity to consent (minors, severe cognitive impairment, severe psychosis)? If YES, does the protocol have a *valid, documented* procedure for assessing capacity and/or obtaining *legally authorized* surrogate consent?
      *   *Passing Answer:* No, target population is presumptively competent (e.g., typical adults). OR Yes, but includes a clear, valid procedure for capacity assessment/surrogate consent *specific to the risks involved*.
      *   *Flag to Full Board:* Targets vulnerable groups (minors, cognitively impaired) but lacks *any* described capacity/surrogate procedure. OR Surrogate consent proposed for non-minimal risk research where local regulations prohibit it.
      *   *Judgment Call?* Yes. Determining if a described capacity/surrogate procedure is "valid" for *this specific protocol's complexity/risk* may require judgment, especially for mild impairment or fluctuating conditions. *Document the rationale.*

  3.  **CORE DISCLOSURE CHECK (Pass/Flag)**
      *   *Question:* Does the consent form/document *clearly state* (in language likely understandable to participants):
          *   That it's research?
          *   The purpose?
          *   Procedures involved (including time, frequency)?
          *   Reasonably foreseeable risks/discomforts (physical, psychological, social, economic, legal)?
          *   Potential benefits (to participant or others)?
          *   Alternatives to participation?
          *   Confidentiality limits (including data access, storage, sharing, anonymization plans)?
          *   Compensation for injury (if applicable)?
          *   Contact info for questions/complaints?
          *   Voluntary nature & right to withdraw anytime without penalty?
      *   *Passing Answer:* Yes, all core elements are present. Language is clear and avoids excessive jargon. Omissions (e.g., no direct benefit) are explicitly stated.
      *   *Flag to Full Board:* Any *core element* is missing or egregiously vague/misleading. **STOP REVIEW.**
      *   *Judgment Call?* Minimal. Focus on *presence* and *basic clarity*, not perfection. "Reasonably foreseeable risks" allows some leeway, but gross understatement is a flag.

  4.  **DECEPTION CHECK (Pass/Flag/Judgment)**
      *   *Question:* Does the protocol involve *intentional deception* or significant withholding of information *essential* for understanding the true purpose/risks *during* consent? If YES:
          *   Is scientific justification for deception provided?
          *   Is deception *necessary* to achieve research aims?
          *   Does consent *at minimum* warn participants they won't be told the full story/purpose upfront?
          *   Is a timely, appropriate debriefing procedure outlined, including the *true purpose* and *option to withdraw data* post-debrief?
      *   *Passing Answer:* No deception. OR Deception is present but ALL sub-questions (justification, necessity, warning, debrief/withdrawal) are satisfied.
      *   *Flag to Full Board:* Deception involves *physical risks*, *high psychological distress*, or *violates core legal rights* that couldn't be consented to even if known. OR Debriefing is absent/unfeasible.
      *   *Judgment Call?* **High.** "Necessary," "significant withholding," "essential information," and acceptability of the debrief/withdrawal process *are* judgment calls. Does the "warning" sufficiently preserve the *spirit* of consent? *Document your assessment.*

  5.  **VOLUNTARINESS - COERCION CHECK (Pass/Flag/Judgment)**
      *   *Question:* Are there features suggesting participation isn't truly voluntary?
          *   *Direct Threats:* Are participants threatened with penalty/harm for non-participation? (Rare, usually obvious).
          *   *Authority Figures:* Are recruiters/consent-takers in a position of *direct authority* over participants (e.g., professors over students, doctors over current patients, employers over employees)? If YES, are robust mitigations in place (e.g., independent consent-taker, clear "no penalty" language, alternative options)?
          *   *Excessive Inducements:* Is the compensation/incentive *so large* relative to participant circumstances (consider target population) that it could *unduly influence* decision-making, overriding risk perception?
      *   *Passing Answer:* No overt threats. No problematic authority relationships OR clear, robust mitigations present. Compensation not obviously excessive/coercive for the population/risks.
      *   *Flag to Full Board:* Overt threats of penalty/harm. Authority relationship (e.g., doctor-patient) with *no meaningful mitigations* proposed.
      *   *Judgment Call?* **Very High.** Assessing "undue influence" from inducements or the sufficiency of mitigations against authority pressure is inherently contextual and subjective. *Document your reasoning clearly.*

  6.  **VOLUNTARINESS - MANIPULATION CHECK (Pass/Judgment)**
      *   *Question:* Does the consent process or information framing appear designed to *manipulate* participation through emotional pressure, misleading emphasis, or exploiting vulnerabilities (e.g., guilt-tripping, minimizing risks, exaggerating benefits, targeting desperate populations without safeguards)?
      *   *Passing Answer:* No overt signs of manipulative tactics. Language is neutral and factual.
      *   *Flag to Full Board?* Not usually a standalone flag point; often blends with Disclosure or Voluntariness-Coercion. Severe manipulation might trigger a Core Disclosure flag if misleading.
      *   *Judgment Call?* **Highest.** "Manipulation" is highly subjective. Focus on *egregious* cases (e.g., "Participating is your duty as a citizen!"). Subtler framing issues are often judgment calls during Disclosure/Voluntariness review. *Document concerns.*

  7.  **PARTICIPANT-SPECIFIC RISK CHECK (Pass/Flag/Judgment)**
      *   *Question:* Does the protocol target a population with *specific vulnerabilities* (e.g., severe mental illness, refugees, incarcerated persons, significant economic hardship) that might *uniquely impact* their understanding (Competence), perception of choice (Voluntariness), or susceptibility to risks? If YES, are there *specific, adequate safeguards* tailored to these vulnerabilities?
      *   *Passing Answer:* No special vulnerabilities. OR Vulnerabilities addressed with plausible safeguards (e.g., extra consent time, independent advocates, simplified language, referral resources).
      *   *Flag to Full Board:* Targets highly vulnerable group with *no* described safeguards relevant to the specific risks of the study.
      *   *Judgment Call?* **High.** Assessing vulnerability impact and adequacy of safeguards is contextual. *Document your assessment of fit between vulnerability, risk, and safeguard.*

  8.  **PRACTICALITY & UNDERSTANDING CHECK (Pass/Judgment)**
      *   *Question:* Does the consent process seem *feasible* in the proposed setting (time, environment)? Is the consent form/document *likely* to be understood by the *actual* participants (reading level, language, complexity)?
      *   *Passing Answer:* Process seems feasible (e.g., not obtaining complex consent in a chaotic ER unless justified). Form language appears appropriate for stated population.
      *   *Flag to Full Board?* Rarely a standalone flag. Gross impracticality might link to Competence (no time for understanding) or Disclosure (form illegible to population).
      *   *Judgment Call?* **Yes.** Assessing feasibility and likely understanding involves estimation. *Note any significant concerns.*

  **Procedure Output:**
  *   **Pass:** All checks pass with no Flags or only minor Judgment Calls noted where your assessment is "Pass".
  *   **Flag for Full Board:** Any step results in a Flag. Include the specific Flag reason(s).
  *   **Pass with Noted Judgment Calls:** Protocol passes all checks, but significant Judgment Calls were made during steps 4, 5, 6, or 7. *Document these clearly in the review notes for the board.*
  *   **Judgment Call Overwhelms (Rare):** Multiple, major Judgment Calls pile up creating profound uncertainty even if no single Flag is triggered. Consider Flagging for Board guidance.

  ---

  **Running the Procedure on Your Cases:**

  1.  **Psychology Study with Deception (Post-Debrief Only):**
      *   Step 1: Pass (Process & Form present).
      *   Step 2: Pass (Presumptively competent adults).
      *   Step 3: Pass (Form describes tasks, likely discloses risks *of the tasks*, states purpose vaguely? **Judgment Call:** Does it disclose deception is *possible*? Often not. If it explicitly warns "you may be misled about the true purpose," Pass. If it completely misstates purpose, Flag Core Disclosure).
      *   **Step 4: Judgment Call Focus.** Is deception justified/necessary? (Probably yes for psych). Does consent *warn* about withholding/full purpose? (Crucial - if yes, Pass; if no, Flag). Debrief/withdrawal? (Usually yes, Pass). *Output:* **Likely PASS** (if warning present) **with Judgment Call noted re: adequacy of warning & debrief.** OR **FLAG** (if no warning in consent).
      *   Steps 5-8: Likely Pass (assuming typical student population, no undue pressure).

  2.  **$200 Payment for Mildly Unpleasant Tasks:**
      *   Steps 1-3: Pass (Assuming standard).
      *   Step 4: Pass (No deception).
      *   **Step 5: Judgment Call Focus (Inducement).** Is $200 "excessive/coercive"? Depends *entirely* on target population. For affluent students? Probably Pass. For recruiting from a homeless shelter? Highly likely Flag or strong Judgment Call leaning towards problematic. For mixed population? **Judgment Call Required.** *Output:* **PASS** (if clear population is low vulnerability) **OR FLAG** (if targeting high financial vulnerability) **OR PASS/Judgment Call** (mixed pop - *Requires documentation: "Reviewer assesses payment level may be unduly influential for financially vulnerable individuals; recommend PI clarify recruitment pool or justify amount."*)
      *   Steps 6-8: Pass.

  3.  **Surgeon Recruiting Own Patients into Clinical Trial:**
      *   Steps 1-3: Pass (Assuming form is okay).
      *   Step 4: Pass (Assuming no deception).
      *   **Step 5: FLAG Focus (Authority Figure).** Surgeon has *direct, significant authority* over patient's *crucial future care*. Mitigations? Independent consent-taker is *essential*. Is one proposed? If *no*, **FLAG immediately**. If *yes*, **Judgment Call:** Is the proposed mitigator *truly independent* (e.g., another doctor not involved in care? Research coordinator known to the surgeon?) and process *robust*? *Output:* **FLAG TO FULL BOARD.** Rationale: High-power imbalance inherent in treating surgeon relationship; mitigations require careful scrutiny by full board. *This is the answer you might not like, but the procedure forces it.*
      *   Steps 6-8: Pass (But irrelevant after Flag).

  4.  **Elderly Participant & Daughter Answering Screening:**
      *   Step 1: Pass.
      *   **Step 2: Judgment Call/Flag Focus (Competence).** Why is daughter answering? Is the participant *presumed* incompetent? Or just helpful? *Key Question:* Does the protocol *require* the participant's *own* consent later? If daughter is *only* doing screening, and competent participant consents: **Pass** (Note concern re: screening influence). If daughter is answering screening *as part of* determining eligibility for a study the *participant* will consent to: **Potential Pass** (but verify consent is still from participant). If daughter is answering screening *implying* she might be a surrogate *or* the participant's competence is clearly in question: **Flag** - Protocol lacks explicit procedure for assessing competence/using surrogate if needed for *consent itself*. *Output:* **FLAG** (if competence assessment/surrogate process needed but absent) **OR PASS with Judgment Call noted** ("Reviewer notes potential coercion/competence concern in screening; protocol relies on participant's later consent but screening process may influence voluntariness. Recommend PI clarify screening procedure.").

  ---

  **Where the Procedure Misfires or Disagreement Arises:**

  1.  **Deception "Warning" Adequacy (Step 4):** One reviewer might think "You might not be told everything" suffices. Another might demand "You will be deliberately misled about X." Reasonable disagreement is likely.
  2.  **"Undue Influence" from Payment (Step 5):** $200 is coercive poverty vs. reasonable compensation. This depends heavily on *local context* and *recruitment source*. Two reviewers familiar with different aspects of the community might disagree.
  3.  **Sufficiency of Mitigations for Authority (Step 5):** Is a research nurse employed by the surgeon's department "independent enough"? Some boards say yes, others demand a completely external party. The procedure flags the *need* for mitigations; judging their *adequacy* is a prime board-level decision.
  4.  **Subtle Manipulation (Step 6):** Identifying "manipulation" beyond blatant examples is highly subjective. One reviewer might see persuasive language as problematic, another as necessary engagement.
  5.  **Vulnerability Safeguards (Step 7):** What constitutes an "adequate safeguard" for refugees or the mentally ill? Reasonable reviewers can differ on the level of protection needed.
  6.  **Competence Thresholds (Step 2):** When does "mild cognitive impairment" cross the line to needing formal assessment? Judgment is required.

  **Key to Using This:**

  1.  **Trust the Stops:** If a step says "Flag to Full Board, STOP," do it. Don't agonize past that point.
  2.  **Embrace Judgment Calls:** Don't hide them. Document *why* you made the call you did in the "Pass" within that step (e.g., "Judgment Call Step 5: Compensation deemed non-coercive for stated recruitment pool (university staff)").
  3.  **Speed through the Binary:** Steps 1 & 3 should be fast yes/no checks.
  4.  **Focus Fuzzy Time on Fuzzy Steps:** Spend your 20 minutes primarily on Steps 4, 5, and 7 (Deception, Voluntariness-Coercion/Inducement, Vulnerability). Steps 2 & 6 (Competence, Manipulation) often resolve quickly or are covered elsewhere.
  5.  **Use the Output:** "Flag" means you *must* kick it up. "Pass with Judgment Calls" means you approve it *but* explicitly note the uncertainties for the Board's awareness/possible follow-up. *This protects you.*

  This procedure won't eliminate tough calls, but it forces them into specific, identifiable buckets ("Is this payment undue for *this* group?", "Is this deception warning sufficient?") and tells you definitively when something *must* go to the board (Flags), making your 20 minutes far more structured and defensible. Good luck on Tuesday afternoon!
