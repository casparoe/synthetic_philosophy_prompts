  Ontology Identification: If we can map model concepts to human ones, we can query inaccessible info. This is a prerequisite for mech interp to be useful. But it's still uncertain and might not be robust across different models or training phases.

  Accepting the Gap: This is a fallback, sacrificing capabilities for safety. While reliable, it might not be viable if we need high-performance AI. Useful as a last resort but not ideal.

