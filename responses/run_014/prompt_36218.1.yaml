  First, I need to recall what each approach entails. Amplification breaks down tasks recursively so humans can check them with AI help. Debate involves models arguing to surface hidden info during cross-examination. Mech interp looks inside the model's internals directly. Ontology ID finds human-interpretable concepts in the model's representations. Accepting the gap means not trying to access that info and taking a performance hit.

