  Starting with (a). The single-number forecast with a strictly proper scoring rule like Brier assumes a precise Bayesian or subjectivist view. Here, an agent's belief is a sharp credence. Proper scoring rules encourage honesty, as the expected score is minimized when reporting true beliefs. This rules out any interpretation where probability isn't sharp. For example, frequentism might struggle without a clear reference class, and propensity views could be ambiguous without precise parameters. Imprecise probability is directly at odds because it uses sets rather than points.

  For (b), the objection about arbitrary precision is a real flaw in the practice when applied to imprecise beliefs. There's no unique rational point in the interval. The scoring rule forces a single number, but different points could be optimal under different true distributions. This creates a dilemma for the forecaster: pick a point arbitrarily and be penalized for not representing the range, or misrepresent their uncertainty. The practice doesn't acknowledge the interval, so it's not just a feature of the scoring rule but a deeper issue.

  Addressing (c), if tournaments took imprecise probabilities seriously, several changes would be needed. Forecasters could submit intervals or sets. Scoring rules would need to evaluate these, like using functions that reward accuracy and reflect the set's spread. Reporting should include the range, avoiding collapsing to a point. Tournaments might also distinguish between precise and imprecise beliefs, especially in low-data scenarios.

  The user's deeper need might be understanding if current practices are philosophically sound or if they're imposing a specific worldview. They might also be looking for validation of their suspicion that imprecise probabilities are being unfairly excluded. Their identity as a student in a philosophy course suggests they want a rigorous analysis, not just practical solutions. They’re likely interested in the implications for how we model uncertainty in real-world contexts where data is scarce or conflicting.

