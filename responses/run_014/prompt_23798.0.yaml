prompt: |-
  So I run a tiny interview podcast for a mostly rationalist-diaspora audience, and next up I've got a philosopher who's spent her whole career reviving Nozick's closest-continuer theory from Philosophical Explanations and applying it to Ship-of-Theseus-style identity puzzles -- weighted dimensions, ties go to neither, the works. I don't want her just re-explaining the theory to my listeners, I want questions that actually press on it. Give me 8-10 questions: at least one on the Hobbes reassembly case, where equal weighting between physical continuity and functional continuity supposedly gives you "neither ship is the original" -- is that a real answer or just a shrug, and who's even setting those weights in the first place? At least one on the extrinsicness problem, where whether something counts as a continuation can hinge on a better rival continuer existing somewhere totally unrelated, which still strikes me as nuts. And at least one on fission -- Nozick says a tie kills you, then lets you cope by seeing the branches "through platonic glasses," which sounds like he's quietly importing Parfit's answer only once his own theory's verdict becomes unbearable, and apparently ships don't even get that same mercy. For each question, throw in a follow-up tuned to whatever answer she'd most likely give to wriggle out of it.
