prompt: |-
  I do data viz for a public health org and we keep getting asked to make "infographics" that are basically just bar charts with clip art, and I want to push us toward something more like Neurath's pictorial language idea — the Isotype thing where you build diagrams of social facts out of standerdized little pictorial elements, like rows of the same person-figure to show a proportion, so the picture is grounded in countable material stuff instead of just a designer's spin. I want a decison procedure my design team can actually run step by step when we get a statistic we're supposed to turn into one of these panels. For each step I want the question to ask, what counts as a sufficient answer to it, and where the procedure says no and stops. The steps, in order: (1) whether the fact we want to show can even be represented in a pictorial language at all, and what kinds of things resist it — rates, abstractions, negatives, "lack of X," stuff that isn't a countable material thing; (2) how to pick and standardize the elements we build it out of, so the same element means the same thing across all our panels; (3) how to handle scale and proportion, i.e. when the row-of-100-figures trick is the right tool and when it misleads, and what to do when the number is too big or too small to count out by hand; (4) how to check the finished picture for the failure modes Neurath himself was worried about, like a picture that looks more precise than the data actually are, or one that quietly picks a side by what it makes visible and what it leaves out; and (5) where the procedure has to stop and hand the decision back to a person, because choosing which facts to foreground in the first place is an editorial or value call, not something the formalism settles. Mark which steps are judgment calls dressed up as procedure. Then run the whole thing on two concrete facts: the share of a city's households that don't have access to a car, and the change in a region's infant mortality rate over a decade. I suspect the second one hits a wall on a rate-of-change and I want to see exactly where and why.
reasoning: |-
  We are designing a decision procedure for creating Isotype-style infographics. The procedure has 5 steps. For each step, we define:
   - The question to ask
   - What counts as a sufficient answer
   - When the procedure says "no" and stops

  Additionally, we note which steps are judgment calls dressed up as procedure.

  Then we apply the procedure to two examples:
   1. The share of a city's households that don't have access to a car.
   2. The change in a region's infant mortality rate over a decade.

  Let's break down the procedure step by step.

  ### Step 1: Can the fact be represented pictorially?
  **Question:** Can the fact be represented as a countable quantity of material things (or as a proportion of such things)? Does it involve abstractions, rates, negatives, or "lack of X" that might resist pictorial representation?

  **Sufficient answer:** The fact must be about a countable entity (e.g., people, households, cars) and the statistic should be a count or a proportion of such entities. It should not require representing an abstract concept (like "happiness") or a negative (like "lack of access") without a clear positive counterpart.

  **Stop condition:** If the fact is about an abstract concept, a rate (that isn't directly reducible to counts), or a negative that cannot be reframed as a positive count (e.g., "households without a car" can be reframed as "households with a car" and then shown as the complement), then the procedure stops. Also, if the fact is about a continuous variable that cannot be discretized (like temperature) without losing meaning, it stops.

  **Judgment call?** Yes, because deciding whether an abstract concept can be represented by a concrete symbol involves creativity and interpretation.

  ### Step 2: Picking and standardizing elements
  **Question:** What pictorial element (pictogram) will represent the unit of counting? How do we standardize this element across our panels so that it means the same thing everywhere?

  **Sufficient answer:** We choose a pictogram that is unambiguous and represents the unit (e.g., a person for population, a house for households). We must define a style guide for this pictogram (including perspective, level of detail, color) and use it consistently. Also, we must define what the pictogram stands for (e.g., one pictogram = 1 person, or 100 people?).

  **Stop condition:** If we cannot find a clear, unambiguous pictogram that is not easily confused with other concepts, or if the concept is too abstract to be represented by a single pictogram, we stop.

  **Judgment call?** Yes, because choosing the symbol and its meaning is subjective and context-dependent.

  ### Step 3: Handling scale and proportion
  **Question:** How do we represent the quantity? If we use a row of figures, how many can we show without overwhelming the viewer or losing the ability to count? How do we handle numbers that are too big or too small to show each unit?

  **Sufficient answer:**
  - For small counts (e.g., less than 50), we can show each unit individually.
  - For larger counts, we use a unit that represents multiple items (e.g., one figure = 100 people). We must choose a scale that allows the entire graphic to be readable and that the number of units is manageable (say, between 5 and 100 units).
  - For proportions, we show two groups: the group of interest and the complement. We can use a part-whole representation (e.g., 30 out of 100 figures filled in).

  **Stop condition:** If the number is so large that even with scaling we cannot represent it without having too many units (e.g., millions) and we cannot find a meaningful intermediate unit (e.g., using a group of 1000 as a new unit), then we stop. Also, if the number is too small (e.g., 0.1%) and we cannot show a fractional unit without breaking the discrete nature, we stop.

  **Judgment call?** Partially, because choosing the scale factor and the acceptable range of units is subjective.

  ### Step 4: Checking for failure modes
  **Question:** Does the final graphic:
     a) Overstate the precision of the data (e.g., by showing exact counts when the data is estimated)?
     b) Introduce bias by what it includes or excludes (e.g., by the choice of symbols, grouping, or framing)?

  **Sufficient answer:** We must ensure:
     - The graphic does not show more detail than the data supports (e.g., if data is rounded, the graphic should reflect that).
     - We have included necessary context (e.g., the total population) and that the symbols chosen do not carry unintended connotations (e.g., using a male figure to represent all people might be exclusionary).

  **Stop condition:** If we cannot avoid overstating precision (e.g., the data is too uncertain) or if the representation inherently introduces bias that cannot be mitigated (e.g., the chosen symbol is culturally loaded and we have no alternative), we stop.

  **Judgment call?** Yes, because assessing bias and precision is subjective.

  ### Step 5: Recognizing the editorial handoff
  **Question:** Which facts to foreground? The procedure must stop and hand back to a human when deciding which aspect of the data to emphasize because this is an editorial decision.

  **Sufficient answer:** The procedure does not make this decision. It is always handed back to the team for an editorial call.

  **Stop condition:** This step is always a handoff. The procedure does not proceed beyond step 4 without human intervention for step 5.

  **Judgment call?** This step is explicitly a judgment call.

  ---

  Now, let's run the procedure on the two examples.

  ### Example 1: Share of a city's households that don't have access to a car

  **Step 1: Can it be represented?**
  - The fact is about households and car access. We can reframe "households without a car" as the complement of "households with a car". Both are countable.
  - Sufficient: Yes, because households are countable and we can represent each household (or a group of them) with a pictogram.
  - No stop condition triggered.

  **Step 2: Standardizing elements**
  - We choose a pictogram for a household (e.g., a simple house icon). We must standardize this icon across all our graphics to mean "one household" (or a group, if we scale).
  - We also need a way to represent "with a car" and "without a car". We can use color (e.g., blue for with car, gray for without) or add a small car icon to the house for those with access? But note: we are representing the household, not the car. Alternatively, we can show two groups: one set of houses with a car symbol and one without.
  - Alternatively, we can use a different symbol for the unit? But the unit is households. We decide: one house icon = one household. Then we can have two rows: one for with car and one without? Or a single row of houses, with color coding.
  - Sufficient: We can standardize a house icon and use color to indicate car access.
  - No stop condition.

  **Step 3: Scale and proportion**
  - Let N = total households. We want to show the proportion without a car (say, p). We can show a grid of house icons, with (1-p)*N houses in one color (with car) and p*N in another (without car). But if N is large, we cannot show all.
  - We need to scale: one house icon represents, say, 1000 households. We must choose a scaling factor so that the number of icons is manageable (e.g., 10 to 100 icons). 
  - Example: if there are 100,000 households and 30% without a car, then we can set 1 icon = 1000 households. Then we have 100 icons, with 70 in color A (with car) and 30 in color B (without car). This is acceptable.
  - If the total were 1 million, we might set 1 icon = 10,000 households, then 100 icons (with 70,000 and 30,000 represented by 70 and 30 icons). Still acceptable.
  - Stop condition? Only if the number of icons becomes too large even after scaling (e.g., billions) or the proportion is too small to show at least one icon for the minority group. But in this case, we can adjust the scaling so that the minority group is at least one icon (by rounding appropriately). So we can proceed.

  **Step 4: Check for failure modes**
  - We must not show exact counts if the data is an estimate (with a margin of error). We might round the numbers to the nearest thousand and adjust the icon count accordingly.
  - We must check for bias: by showing households without a car, we are highlighting a lack. But we are also showing the context (the total). We can also consider including a note about the source of the data and the rounding.
  - We must ensure the symbols are neutral: a house icon is neutral. The car symbol might be, but we are using it only as an attribute. Alternatively, we might avoid the car symbol in the icon and use color and a key.
  - We can design: a grid of houses, colored blue for with car, red for without. The key explains.
  - No major failure mode detected.

  **Step 5: Editorial handoff**
  - We have represented the fact. The decision to focus on "without a car" rather than "with a car" is editorial. The procedure stops and hands back.

  **Conclusion for Example 1:** The procedure completes and we can make the graphic.

  ### Example 2: Change in a region's infant mortality rate over a decade

  **Step 1: Can it be represented?**
  - The fact is about a rate (infant mortality rate, IMR) and its change over time. The IMR is typically defined as the number of infant deaths per 1,000 live births. 
  - We have two challenges: 
     a) The rate is not a countable material thing per se, but it is derived from counts (infant deaths and live births). 
     b) The change over time is a comparison between two rates (at time T0 and T1).
  - We can try to represent the rate at each time point by showing the number of infant deaths per a fixed number of live births (e.g., per 1,000). Then we can show two panels: one for T0 and one for T1, each with a representation of the rate (e.g., 1000 baby figures and then mark the number that died?).
  - However, note: we are not showing the actual infants but a representation of the rate. Also, the change is the difference between the two rates. Can we show the change directly? 
  - The problem: the rate itself is a proportion, so step 1 might pass for each time point. But the change (a difference of two proportions) is an abstract concept. We might represent it by showing the two proportions side by side and let the viewer see the difference. Alternatively, we might show the number of lives saved (or lost) due to the change? But that would require knowing the number of births and the change in rate, which is a derived count.
  - Sufficient? We can represent the rate at each time point as a proportion (using baby figures) and then show the two together for comparison. But note: the rate is per 1000, so we can show 1000 baby figures for each year and mark the ones that died. Then the change is the difference in the number of marked figures between the two years? That would work.
  - Alternatively, we might show the number of deaths in a fixed birth cohort (like 1000) for each year. Then the change is the change in the count of deaths. This is a countable quantity? Yes, but note: the actual births in the two years are different. We are standardizing to 1000 births to show the rate. This is acceptable because it's how the rate is defined.
  - Stop condition? We can reframe the rate as a count per 1000, so we can proceed.

  **Step 2: Standardizing elements**
  - We choose a baby pictogram to represent one infant (in the context of 1000). We must standardize this baby icon so that it means one infant in a cohort of 1000.
  - We also need to represent death. We might use a color change (e.g., gray for dead, or a cross) but note: Neurath avoided symbols of death. He would use a neutral representation (like a figure lying down) but that might not be clear. Alternatively, we might use a living baby and a dead baby as two distinct pictograms? But that might be too graphic. 
  - We must be sensitive. We can use a simple icon for a baby and then use color: e.g., blue for alive, gray for dead? But note: we are representing the rate, so we show 1000 babies and then a certain number in gray. 
  - Standardization: we will use the same baby icon for both years, and the same color for deaths. 
  - Sufficient? We can standardize the baby icon and the representation of death. 
  - However, note: the baby icon must be the same for both years. Also, we must be cautious about the representation of death to avoid being too disturbing. This is a challenge.

  **Step 3: Scale and proportion**
  - We are representing 1000 babies per year. That is 1000 icons per year. That is too many to show individually without an infographic that is too big. 
  - We might scale: one baby icon represents 10 babies? Then we have 100 icons per year. Or one icon for 20 babies? Then 50 icons per year. 
  - But then we have to show the deaths: if the IMR is 5 per 1000, then we have 5 deaths. If we scale by 10, then we have 0.5 deaths? That doesn't work because we can't show half a baby. 
  - Alternatively, we can use a unit of 1000 and represent it with one icon? But then we cannot show the proportion without breaking the unit. 
  - We can use a bar that is filled to the proportion? But that is not Isotype (which uses discrete units). 
  - We might show a grid of 10x10 baby icons (100 icons) and say each icon represents 10 babies. Then for 5 deaths, we would need to show 0.5 icons? We can't. 
  - We need to show at least one icon for the deaths? Then we must have at least one death per the scaled unit. So if the IMR is 5 per 1000, we need a scaling such that 5 per 1000 is at least 1 icon. That requires that the scaling factor is at most 5 (because 5/1000 * scaling factor >= 1). But then we would need 1000 / 5 = 200 icons per year? That is too many. 
  - Alternatively, we can change the unit: represent 1000 babies with a single icon and then show the number of deaths as a numeral next to it? But then we are not using pictograms for the count of deaths. 
  - We might use a hybrid: one large baby icon to represent 1000, and then next to it, we show a row of 5 baby icons (in gray) to represent the deaths? But then the 5 baby icons are not part of the 1000? This might be confusing. 
  - Alternatively, we can show one baby icon for each death, and then note that these deaths are out of 1000? But then we are not showing the living. 
  - We are stuck. The rate is too low to represent with discrete icons without having too many icons for the total and not being able to show the deaths without fractional icons. 
  - Stop condition: The number of deaths per 1000 is too small to represent with discrete icons at a reasonable scale. We cannot proceed without breaking the Isotype rule of discrete units. 

  **Step 4: Check for failure modes** (if we had passed step 3, but we didn't)

  **Step 5: Editorial handoff** (we didn't get there)

  **Conclusion for Example 2:** The procedure stops at step 3 because we cannot represent the rate without either having too many icons or fractional icons. 

  However, note: there might be a workaround if we represent the change directly. For example, we might show the absolute change in the number of deaths per 1000 births. If the IMR went from 10 to 5 per 1000, then we saved 5 babies per 1000. We can show 5 baby icons (in a saved color) and say "5 fewer deaths per 1000 births". But then we are not showing the rates, only the change. This is a derived count. But step 1 might allow it? Let's reexamine:

  - The change is a count (of lives saved per 1000 births). We can represent that with baby icons. But note: we are not showing the baseline. We must show the context? We might show two panels: one for the initial rate (with 10 deaths per 1000, but then we are back to the same problem) and one for the change (5 saved). But then the change panel is a positive count (5 saved babies) and we can show 5 baby icons. However, the first panel (with 10 deaths) still has the problem of too many icons.

  Alternatively, we can represent the change without showing the baseline rates? But then we lose context.

  Given the constraints of Isotype (discrete units and avoiding hybrid numeral/pictogram representations), it seems difficult. Therefore, the procedure stops at step 3.

  ### Summary of the procedure

  | Step | Question | Sufficient Answer | Stop Condition | Judgment Call? |
  |------|----------|-------------------|----------------|----------------|
  | 1 | Can the fact be represented as a countable quantity? | The fact is about a countable entity and can be expressed as a count or proportion. | If the fact is abstract, a rate that cannot be reframed, or a negative that cannot be complemented. | Yes |
  | 2 | How to pick and standardize pictograms? | A clear, unambiguous pictogram is chosen and standardized in a style guide. | If no clear pictogram exists or it is too abstract. | Yes |
  | 3 | How to handle scale and proportion? | A scale is chosen so that the number of units is manageable (between 5 and 100) and the proportion can be shown without fractional units. | If the number is too big even after scaling (requiring >100 units) or too small (requiring fractional units). | Partially |
  | 4 | Does the graphic overstate precision or introduce bias? | The graphic respects data precision and avoids bias in representation. | If the representation inherently overstates precision or cannot avoid bias. | Yes |
  | 5 | Which facts to foreground? | Always hand back to the team for editorial decision. | Always stops for human decision. | Explicitly yes |

  ### Application to Examples:

  Example 1: Households without car access - passes all steps.

  Example 2: Change in infant mortality rate - stops at step 3 because the small rate (low count of deaths) makes it impractical to represent without fractional units or too many icons.
answer: |-
  ### Decision Procedure for Isotype-Style Infographics  
  **Core Principle:** Use standardized pictograms to represent countable, tangible units. Avoid abstractions, rates, or designer-driven interpretations.  

  ---

  ### Step-by-Step Procedure  
  #### **Step 1: Is the Fact Pictorially Representable?**  
  - **Question:** Can the fact be expressed as a **countable quantity of tangible units**?  
  - **Sufficient Answer:** The fact must:  
    - Represent **discrete entities** (e.g., people, households, cars).  
    - Avoid **rates/abstractions** (e.g., "happiness index"), **negatives/lacks** (e.g., "lack of access"), or **intangible concepts** (e.g., "risk").  
  - **Stop Condition:** Stop if the fact:  
    - Involves rates (e.g., deaths/1,000 births), continuous variables (e.g., temperature), or non-countable negatives (e.g., "poverty").  
    - Requires showing absence (e.g., "no car") without a clear positive counterpart.  
  - **Judgment Call?** **Yes**. Deciding if a concept (e.g., "access") is "tangible enough" involves interpretation.  

  #### **Step 2: Standardize Pictogram Elements**  
  - **Question:** What standardized pictogram represents one unit of the countable entity?  
  - **Sufficient Answer:**  
    - A single, reusable pictogram (e.g., a person for individuals, a house for households).  
    - Strict style rules (e.g., perspective, color, detail) to ensure consistency across all graphics.  
  - **Stop Condition:** Stop if:  
    - The entity lacks a clear visual symbol (e.g., "democracy").  
    - The symbol is ambiguous (e.g., a car could mean ownership or traffic).  
  - **Judgment Call?** **Yes**. Choosing symbols (e.g., a stylized person vs. a realistic figure) is subjective.  

  #### **Step 3: Scale and Proportion**  
  - **Question:** Can the quantity be represented with **whole pictograms** without misrepresenting scale?  
  - **Sufficient Answer:**  
    - Use **rows of identical pictograms** for proportions (e.g., 30/100 houses).  
    - For large numbers: **group units** (e.g., 1 pictogram = 1,000 people).  
    - For small numbers: **round to the nearest whole unit** (e.g., 0.4 becomes 0 or 1).  
  - **Stop Condition:** Stop if:  
    - Scaling distorts proportions (e.g., rounding 0.1 to 1 overstates by 10×).  
    - The number is too large for feasible grouping (e.g., 7 billion people).  
  - **Judgment Call?** **Partially**. Choosing rounding thresholds (e.g., round up at 0.5) is procedural; deciding acceptable distortion is judgment.  

  #### **Step 4: Check for Neurath Failure Modes**  
  - **Question:** Does the graphic:  
    - Overstate precision?  
    - Hide bias via selective visibility?  
  - **Sufficient Answer:**  
    - Match pictogram count to data precision (e.g., if data is ±10%, avoid showing exact counts).  
    - Show **symmetrical context** (e.g., "no car" must also show "with car").  
  - **Stop Condition:** Stop if:  
    - Data uncertainty is too high for visual representation.  
    - Critical context (e.g., total population) can’t be included without clutter.  
  - **Judgment Call?** **Yes**. Assessing "sufficient context" or "acceptable precision" is subjective.  

  #### **Step 5: Editorial Handoff**  
  - **Question:** Which facts to foreground?  
  - **Sufficient Answer:** **Always stop and hand to a human**.  
  - **Reason:** Choosing what to emphasize (e.g., "car access" vs. "poverty") is a **value-driven editorial decision**. The procedure cannot resolve this.  
  - **Judgment Call?** **Explicitly a judgment call**.  

  ---

  ### Apply to Concrete Examples  
  #### **Example 1: Share of City Households Without Car Access**  
  - **Step 1: Representable?**  
    - **Yes.** "Households without cars" can be flipped to "households with cars" (a countable tangible).  
    - Negatives ("without") are acceptable because they are paired with a positive ("with").  
  - **Step 2: Standardize Elements**  
    - Pictogram = **standardized house icon** (e.g., 🏠).  
    - One icon = one household.  
  - **Step 3: Scale/Proportion**  
    - E.g., 30% of 10,000 households lack cars → Show 100 icons: 70 🏠 (with car), 30 🏠 (without car).  
    - If total households is 1 million, group: 1 icon = 10,000 households.  
  - **Step 4: Failure Modes**  
    - **Risk of bias:** Show both groups equally. Label: "70% with cars, 30% without."  
    - **Precision:** If data error is ±5%, avoid implying exact counts.  
  - **Step 5: Handoff**  
    - Human decides whether to highlight "without cars" (vulnerability) or "with cars" (majority).  
  - **Outcome: ✅ Works.**  

  #### **Example 2: Change in Infant Mortality Rate (IMR) Over a Decade**  
  - **Step 1: Representable?**  
    - **No. Stop.**  
    - **Why?** IMR is a **rate** (deaths/1,000 births), not a countable entity. "Change in rate" is a derived abstraction (e.g., from 10 to 5 deaths/1,000). Neurath’s system resists rates because they lack discrete units.  
    - *Workaround attempt:* Show deaths as discrete units? But deaths are tied to births (another variable), and "change" requires comparing two rates. This introduces abstraction.  
  - **Where it fails:** Step 1. Rates and changes in rates cannot be directly represented with standardized pictograms without distorting the formalism.  

  ##### Why Step 1 Rejects IMR:  
  - **Rates ≠ Counts:** IMR isn’t "5 dead babies" but "5 deaths per 1,000 births." Showing 5 baby icons implies 5 deaths, but hides the denominator (1,000 births).  
  - **Change is Abstract:** A drop from 10 to 5 deaths/1,000 is a 50% reduction. Neurath’s system can’t show this without:  
    - Misleading rows (e.g., 10 vs. 5 icons, implying absolute counts, not rates).  
    - Hybrid visuals (e.g., adding a line chart), breaking the pictogram standard.  
  - **Judgment Note:** A designer *could* force it (e.g., two rows of baby icons labeled "per 1,000 births"), but this violates Isotype’s "countable material" rule by collapsing the denominator into a label.  

  ---

  ### Key Takeaways  
  - **Pictorial language works for:** Proportions of tangible things (e.g., households with/without cars).  
  - **It fails for:**  
    - Rates (infant mortality, unemployment).  
    - Abstract changes (e.g., "decline in IMR").  
    - Lacks without context (e.g., "no car" works only alongside "with car").  
  - **Judgment Steps:** 1, 2, 4, and 5. Only Step 3 is semi-procedural.  
  - **Designer’s Role:** Use this to push back on requests that violate Isotype principles. For rates, recommend alternatives (e.g., bar charts with clear denominators).
