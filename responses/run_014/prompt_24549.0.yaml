prompt: |-
  Okay so I've been reading about Skolem's paradox and I keep building this argument that feels like it proves set theory is just broken, and I can't find where I'm going wrong. Here it is:

  (1) If ZFC is consistant then, by the Löwenheim–Skolem theorem, it has a countable model.
  (2) So there's a model M of all of set theory whose whole domain is just a countable list of things.
  (3) Inside M, every set is one of those things, so every set in M is countable.
  (4) But ZFC proves the reals are uncountable (Cantor's theorem, the diagonal argument).
  (5) So M thinks its reals are uncountable, but from the outside M's reals are just a countable list.
  (6) So "countable" means one thing inside M and a different thing outside it.
  (7) Which means there's no fact of the matter about whether a set is countable, it just depends on which model you're in.
  (8) So set theory is incoherent, and probably a lot of math is too.

  I obviously don't believe (8) and I must be doing something wrong somewhere, but I literalyl cannot find it. Which step do you reject and what do you give up by rejecting it? Also can you say how confident you are in your diagnosis and single out the part you're least sure about, idk I want to know if I should trust the answer.
