prompt: |-
  I was discussing this with a colleague in economics the other day and I came away a bit confused. We were talking about the social discount rate and the Ramsey rule (r = δ + η·g), and I keep seeing peope in the climate literature treat the pure rate of time preference δ as if it's the moral core of the whole thing — the part that's doing the ethical work of deciding how much we care about future generations. But when I actually plug in the numbers, it seems like most of the discount rate comes from the η·g term, not from δ.

  So I'd like you to argue that the pure rate of time preference is actually doing less moral work than its advocates and critics both seem to think, and that the real ethical debate is about η and g — and about the pure vs. impure nature of discounting more generally. I'm especially interested in the 'fiction' of pure time preference: the idea that all real discounting is impure (arising from mortality risk, opportunity cost, uncertainty, changing tastes, and so on) and that pure time preference — caring less about a good just because it's later — is a mistake that the Ramsey rule bakes in as if it were a genuine preference.
reasoning: |-
  Okay, the user is grappling with the role of the pure rate of time preference (δ) in the Ramsey rule versus the η·g term. They feel that δ gets too much attention in ethical debates, especially in climate economics, while η·g actually dominates the discount rate numerically. They want me to argue that δ is less morally significant than commonly thought and that the real ethical weight lies with η and g. Plus, they're interested in the idea that "pure" time preference is a fiction—that all discounting is impure, arising from practical factors.

  First, I need to validate their observation. Yes, numerically, η·g usually outweighs δ. For example, with η around 1.5-2 and g at 1-2%, η·g could be 1.5-4%, while δ is often set near 0.1-0.5%. So mathematically, they're right—δ isn't the main driver. 

  The user’s deeper frustration seems to be with the disproportionate philosophical focus on δ. Ethicists like Stern and Nordhaus debate δ intensely (e.g., Stern’s δ=0.1% vs. Nordhaus’s δ=1.5%), but this overlooks how η and g carry heavier normative baggage. η embodies inequality aversion across time and space, which directly affects intergenerational fairness. g isn’t just a projection—it’s shaped by policy choices today that lock in future growth paths. 

  Then there’s their point about "pure" time preference being a fiction. This is crucial. If δ is just a stand-in for mortality risk or uncertainty (as Arrow and others argue), then calling it "pure" is misleading. It’s not a moral preference; it’s a placeholder for empirical factors. This reframes the entire debate: if δ isn’t truly about devaluing the future "just because," then the real ethics live in η (how we value inequality) and g (what future we enable). 

  I should also address the "impure discounting" angle. By lumping δ with η·g, the Ramsey rule might obscure ethical trade-offs. For instance, high discount rates from η·g could justify under-investing in climate action, but this gets blamed on δ alone. The user likely wants this complexity surfaced—to show that attacking δ misses the bigger picture. 

  Their unspoken need? Probably to clarify interdisciplinary confusion (economics vs. ethics) and empower critiques of discounting practices in climate policy. They might also seek ammunition for challenging colleagues who overemphasize δ. 

  In response, I’ll structure this as a manifesto: 
  - Start by conceding δ’s small numerical role. 
  - Hammer η’s dual ethical role (inequality + growth weighting). 
  - Demystify δ as non-moral. 
  - Conclude that policy battles over η and g matter more than δ wars. 

  This should arm them to recenter debates on justice, not just time preference pedantry.
answer: |-
  You're absolutely right to question the disproportionate focus on δ (the pure rate of time preference) in ethical debates surrounding social discounting, especially in climate economics. Let's dismantle this "δ-centric" view and argue that the *real* moral heavy lifting happens with η and g, and that the concept of "pure" time preference itself is largely a misleading fiction baked into the Ramsey rule (`r = δ + η·g`). Here's the case:

  **1. The Numerical Reality: δ is the Minor Player, η·g Dominates:**
      *   **Typical Values:** δ is typically set very low (e.g., 0.1% by Stern, 1.5% by Nordhaus). η (elasticity of marginal utility of consumption/inequality aversion) is often between 1.0 and 2.0. g (growth rate of per capita consumption) is usually projected between 1% and 2% for developed economies.
      *   **The Math:** Plugging in reasonable numbers:
          *   Stern: r = 0.1% + (1.0 * 1.3%) ≈ **1.4%** (δ contributes ~7% of r)
          *   Nordhaus: r = 1.5% + (1.45 * 2.0%) ≈ **4.4%** (δ contributes ~34% of r)
          *   Mid-range: r = 0.5% + (1.5 * 1.5%) = **2.75%** (δ contributes ~18% of r)
      *   **Conclusion:** Even in the "high-δ" Nordhaus case, η·g provides the *majority* of the discount rate. In Stern's influential climate work, η·g provides over 90% of the discount rate! Focusing ethical debates solely on δ ignores where the vast bulk of the discounting effect numerically originates: **η·g**.

  **2. The Ethical Weight of η: Inequality Aversion Across Time and Space:**
      *   **η is Fundamentally Ethical:** η represents how much we value an extra dollar (or unit of welfare) to a poor person compared to a rich person *today*. This is pure distributive justice. The Ramsey rule *applies this same ethical principle across time*. A high η implies:
          *   **Strong Intergenerational Inequality Aversion:** If future generations are richer (g > 0), we should invest less in their consumption and more in current consumption/the poor today *because the marginal utility of their consumption is lower*. This discounts their welfare heavily.
          *   **Weak Intergenerational Inequality Aversion:** A low η implies less discounting of future richer generations' welfare. This feels more "generous" to the future.
      *   **The Core Ethical Conflict:** Choosing η forces us to confront: *How much less does an extra dollar mean to someone who is twice as rich?* Applying this across generations asks: *How much less should we value welfare gains for vastly richer future generations compared to poorer present ones?* **This is the central ethical dilemma of intergenerational justice under growth, not the infinitesimal δ.**

  **3. The Ethical Weight of g: Predicting and Valuing the Future:**
      *   **g is Not Neutral:** Projections of g are inherently uncertain and value-laden. Assuming high future g is an *optimistic bet* on technological progress and human ingenuity prevailing over resource constraints and environmental damage. Assuming low or negative g is a *pessimistic bet*, often driven by concerns about ecological limits and climate catastrophe.
      *   **Policy Dependence:** Crucially, *g is not exogenous*. The g experienced by future generations depends massively on investments (or lack thereof) we make *today*, especially in climate mitigation, infrastructure, and R&D. High discount rates (driven partly by high *assumed* g) justify *under-investing* in these areas, potentially *lowering* actual future g. There's a dangerous ethical feedback loop here.
      *   **The Ethical Question:** What future growth path *should* we assume, knowing our actions determine it? Do we assume a rosy scenario that justifies inaction, or a precautionary one demanding action? **The choice of g embodies assumptions about humanity's future potential and our responsibility to safeguard it.**

  **4. The Fiction of "Pure" Time Preference (δ):**
      *   **The Myth of Purity:** The argument for a *positive* δ purely based on "time preference" – valuing well-being less *simply because it occurs later* – is philosophically untenable for many ethicists (e.g., Ramsey himself called it "a practice which is ethically indefensible"). Why *should* the mere date on the calendar diminish the moral worth of a life or unit of welfare?
      *   **δ as a Proxy for "Impure" Factors:** In reality, any observed positive δ likely reflects practical, empirical concerns *masquerading* as pure ethics:
          *   **Mortality/Risk of Extinction:** A small chance that civilization (or humanity) won't exist to enjoy future benefits. This isn't "preference," it's probability (though extinction risk *is* ethically fraught).
          *   **Opportunity Cost & Uncertainty:** Funds not used for Project A can be invested elsewhere with potentially high returns (opportunity cost), or future returns are inherently uncertain, demanding a risk premium.
          *   **Changing Tastes/Technology:** Future generations might value goods differently or have superior technologies, making our investments less valuable to them.
          *   **Myopia & Institutional Imperfections:** Human shortsightedness or political systems incapable of credible long-term commitment.
      *   **The Ramsey Rule's Conflation:** The Ramsey rule *bakes in* δ as a distinct "pure" preference parameter. This gives the *illusion* that it's a legitimate ethical choice, when it's arguably just a convenient (and often mislabeled) dumping ground for these complex, non-ethical, "impure" factors. **Labeling these factors "δ" elevates practical compromises and empirical uncertainties to the status of ethical principles.**

  **5. Why the Focus on δ is Misleading (and Dangerous for Climate Policy):**
      *   **Distraction:** Intense debates over tiny δ values (0.1% vs. 1.5%) distract from the much larger, ethically richer, and more impactful debates over η (what is our obligation to the future poor vs. the present poor?) and g (what future are we *choosing* to create?).
      *   **Moral Cover:** High discount rates driven primarily by high η and/or high assumed g can *appear* more ethically defensible if framed as respecting "individual time preference" (δ), masking the deeper choices about intergenerational inequality and future growth assumptions.
      *   **Obfuscates "Impure" Origins:** Treating δ as "pure" hides the fact that discounting future costs/benefits often stems from risk, uncertainty, institutional failure, or myopia – factors we might seek to *minimize* or *manage* rather than enshrine as ethical axioms.

  **Conclusion: Recentering the Ethical Debate**

  You are correct to be skeptical. The pure rate of time preference (δ) is **not** the moral core of the Ramsey rule. It's numerically small and philosophically dubious as a "pure" ethical parameter. The real ethical weight lies elsewhere:

  1.  **η (Inequality Aversion):** This embodies our fundamental view of distributive justice *applied across generations*. How much less does well-being matter to the rich (future) compared to the poor (present)?
  2.  **g (Growth):** This reflects our assumptions about the future we are creating and the responsibility we bear for it. Are we optimistic gamblers or precautionary stewards?
  3.  **The "Impure" Reality:** Recognizing that the δ term often represents pragmatic compromises with risk, uncertainty, and institutional limitations, *not* a genuine ethical preference for the present over the future simply because it's the present.

  Therefore, the crucial ethical debates in climate economics (and beyond) should shift decisively **away** from minute squabbles over δ and **toward**:
  *   Explicitly justifying chosen values for η based on robust theories of intergenerational justice.
  *   Rigorously defending growth projections (g) and acknowledging their dependence on current investment decisions.
  *   Transparently separating genuinely "impure" discounting factors (risk, uncertainty) from ethical judgments about welfare across time and wealth, rather than lumping them into a misleadingly labeled δ.

  The Ramsey rule is a useful framework, but its parameterization has fostered an illusion that δ is the ethical lever. It's not. The levers that truly shape our obligations to the future are η, g, and the honest accounting of why we discount at all. The fiction of "pure" time preference needs to be retired from the core of the ethical discourse.
