prompt: |-
  Is there a name for this? In the debate over whether a consideration counts as a reason for a person only if that person's actual motives would connect them to it, I keep hitting a specific configuration I can't label. Take the claim that the only reason you have to drink water is that you happen to thirst, and that "water is healthy" is not a reason for you unless you already care about your health; or that the only reason you have to keep a promise is that you take yourself to be bound by it, not that "promises should be kept" is a reason for you unless you already value fidelity. That much I can follow. But when I ask why the motive-connection is itself normative — why the fact that you want something is a reason to want it, or to act on it — the explanation just stops. The view grounds the normativity of each particular reason in a non-normative psychological fact, yet the general rule that licenses the move ("if you have motive P, then F is a reason for you") is itself a normative claim, and the view's own resources cannot ground its normativity, since doing so would require pointing to a further motive, which would require a still further rule, and so on. I've seen people gesture at this with phrases like "the bootstrap problem" and "the theory is self-defeating," and I've seen it lumped into the general question of why reasons are normative at all, but neither seems to be the exact concept. Does this configuration — a theory of reasons whose explanatory grounds are non-normative and so cannot ground the normativity of the very rule they invoke — have an established name? If so, how exactly does it differ from the general normativity problem and from the is/ought gap, and which of those is the best fit? If not, what would you call it, and where are the edges — that is, which theories are guilty of it and which escape it? Think very carefully before answering, and respond in the style of an expert in metaethics and the philosophy of action.
reasoning: |-
  Okay, the user is asking about a specific problem in metaethics regarding the normativity of reasons. They describe a situation where a theory grounds reasons in an individual's psychological motives—like thirst being a reason to drink water—but then struggles to explain why having that motive itself provides a normative reason. The rule "if you have motive P, then F is a reason for you" seems normative, but the theory's resources can't ground its normativity without circularity or regression.  

  Hmm, they mention phrases like "the bootstrap problem" and "self-defeating," but feel those aren't quite right. They want to know if there's a precise name for this configuration, how it differs from broader issues like the normativity problem or is/ought gap, and which theories are affected.  

  First, I need to map the core issue: the theory uses non-normative facts (motives) to explain specific reasons, but the bridging principle ("motives generate reasons") is normative and ungrounded. It’s a *structural flaw* in internalist theories.  

  The best fit is the **regress problem for instrumental normativity**, or "instrumental regress." It’s distinct because:  
  - **General normativity problem** asks why any fact is normative (e.g., "Why care about morality?"). This is narrower: it’s about the *internal machinery* of motive-based theories failing.  
  - **Is/ought gap** is about deriving "ought" from "is," but this is more specific—it’s about a *self-undermining circularity* within the theory’s own rules.  

  Theories guilty of this:  
  - **Standard Humean internalism** (e.g., Bernard Williams): Collapses into the regress unless it treats the instrumental principle as primitive (which just dodges the question).  
  - **Simple subjectivism**: Same issue.  

  Escapes:  
  - **Kantian externalism**: Grounds reasons in rationality itself, not motives.  
  - **Robust realism** (e.g., Parfit): Reasons exist independently.  
  - **Constitutivist theories** (e.g., Korsgaard): Ground normativity in agency’s necessary features—though they have their own controversies.  

  User’s phrasing ("the explanation just stops") is spot-on. They’ve nailed a metaethical catch-22. I’ll emphasize the "instrumental regress" label and clarify why it’s not just bootstrap/is-ought. They’re clearly well-read—maybe a grad student or philosopher—so precision is key.  

  Also, they might want ammunition for critiquing internalism or exploring alternatives. I’ll flag Korsgaard’s constitutivism as a nearby solution (even if debated) since it directly tackles this regress by anchoring normativity in action.  

  Edges: The problem only hits theories that reduce normativity *entirely* to contingent motives. Hybrid or structural views (like Railton’s) might avoid it by allowing objective elements.  

  Final note: I’ll avoid jargon overload. They want clarity, not a bibliography dump.
answer: |-
  This precise configuration is widely recognized in metaethics as the **instrumental regress problem** (sometimes termed the **regress of instrumental reasons** or **Williams' regress**, after Bernard Williams' internal reasons theory). It's a self-undermining flaw in *strict desire-based internalism* about normative reasons.

  ### Core Problem & Its Name:
  - **The Instrumental Regress**: The theory claims that for any fact F to be a reason for an agent A, F must connect to A's *existing motivational set* (e.g., thirst makes "water quenches thirst" a reason). However, the *instrumental principle* itself—"If A has motive M, and act X serves M, then A has a reason to do X"—is a **normative claim**. Yet the theory's *only* resources for grounding normativity are non-normative psychological facts (desires/motives). Since the instrumental principle isn't grounded in a prior motive (e.g., few inherently "desire to follow instrumental rationality"), its own normativity is unaccounted for. Attempting to ground it in a further motive (e.g., "I desire to be instrumentally rational") triggers infinite regress: that desire would need a reason to be normative, and so on.

  ### Distinctions from Broader Concepts:
  1. **General Normativity Problem** ("Why be moral?" / "Why care about reasons?"):  
     - This asks why normative facts *in general* have authority over us. The instrumental regress is a *subset*: it arises specifically for theories that ground reasons in desires, exposing their *internal inconsistency*. It doesn't challenge realism about reasons; it shows desire-based theories cannot sustain their own normative framework.

  2. **Is/Ought Gap (Hume's Law)**:  
     - This is the claim that you cannot derive an "ought" (normative conclusion) from an "is" (non-normative premises). The instrumental regress *presupposes* the gap: desire-based theories try (and fail) to bridge it by making motives the foundation of normativity. The regress shows *why* their bridge collapses under its own weight—they smuggle in an ungrounded normative principle.

  3. **Bootstrap Problem**:  
     - Often used synonymously but is broader. Bootstrapping refers to any attempt to generate reasons from mere desires (e.g., "I want X, so I ought to pursue X"). The instrumental regress is the *structural flaw* that arises when bootstrapping confronts its own foundational principle.

  ### Theories Guilty vs. Those That Escape:
  - **Guilty**:  
    - **Classical Humean Internalism** (e.g., Bernard Williams): Explicitly makes reasons depend on an agent's "subjective motivational set." The regress undermines the normativity of the instrumental principle it relies on.  
    - **Simple Subjectivism**: Claims "X is good" = "I desire X." Fails for the same reason: it cannot explain why desires *should* be acted upon.  
    - **Naive Instrumentalism**: Reduces all reasons to means-end efficiency, ignoring that efficiency itself requires normative justification.

  - **Escapes**:  
    - **Kantian/Rationalist Externalism**: Grounds reasons in objective rationality (e.g., Korsgaard, Scanlon). The instrumental principle is normative *because* rationality requires coherence between motives/actions—no regress, as normativity isn't desire-dependent.  
    - **Robust Realism** (e.g., Parfit, Enoch): Reasons are mind-independent facts. Desires might *track* reasons but don't *create* them.  
    - **Constitutivism** (e.g., Korsgaard's later work): Normativity arises from the constitutive aims of agency (e.g., "to act is to commit to principles"). The instrumental principle is validated as essential to agency itself.  
    - **Hybrid Theories** (e.g., Railton): Combine objective values with subjective motives. If instrumental rationality is treated as an *objective normative requirement*, the regress halts.

  ### Philosophical Edges & Nuances:
  - **Where the Problem Bites**: Only theories claiming **all reasons are explanatorily dependent on contingent motives** are vulnerable. If a theory treats the instrumental principle as a *brute normative fact* (e.g., "rationality just requires it"), it avoids regress but abandons pure internalism.  
  - **Common Misconception**: This isn't about *motivation* (e.g., Williams allows for motivation via deliberation). It's about *justification*: how can desires justify the normative authority they purport to create?  
  - **Escaping via Structural Rationality?**: Some (e.g., Broome) argue instrumental rationality is a "wide-scope" requirement (e.g., "You ought to [not desire X or pursue X]"). This avoids bootstrapping but still needs to ground the normativity of structural requirements—arguably pushing the problem back a step.

  ### Conclusion:
  Your description perfectly captures the **instrumental regress problem**: a theory that reduces normativity to psychology cannot account for its own core normative principle without circularity or infinite regress. It is distinct from the general normativity problem (as a local flaw in specific theories) and the is/ought gap (as a symptom of violating it). For solutions, examine constitutivist or realist frameworks—though each faces its own challenges. This remains a pivotal critique in debates about reason's sources.

  *Recommended reading: Williams' "Internal and External Reasons" (1981); Korsgaard's "The Normativity of Instrumental Reason" (1997); Parfit's "On What Matters" (Vol. 1, 2011), Chapter 5.*
