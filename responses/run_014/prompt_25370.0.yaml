answer: |-
  This is a notoriously tricky passage that showcases Moore's distinctive ethical method. You're right to feel tension - but it's a deliberate tension Moore creates to demonstrate his core principle of **organic unities**. Let's break it down step-by-step:

  1.  **The Core Distinction: "In Itself" vs. "As Part of a Whole"**
      *   **"In Itself" (Intrinsic Value in Isolation):** Moore is asking us to perform a thought experiment. Imagine *only* the appreciation of someone's mental qualities (their kindness, courage, intelligence) stripped completely bare of *any* physical manifestation. No facial expressions, no tone of voice, no actions – just the abstract cognition of the quality itself.
      *   **"As Part of a Whole":** Now, contrast this with the *actual* experience of affection or admiration. This experience *always* includes the perception of those mental qualities *through* their bodily expressions (a warm smile conveying kindness, a confident posture conveying courage, an insightful remark conveying intelligence). The affection is directed towards the *whole person* as mentally and physically presented.

  2.  **Moore's Observations:**
      *   **The Necessity of Expression:** Moore argues we can barely imagine appreciating *purely* abstract mental qualities without *any* physical correlate. It's an unnatural abstraction.
      *   **Value in the Whole:** Crucially, when we experience affection *including* the bodily expressions, the *total state of affairs* (appreciation + its physical object/expression) has immense value – far more value than the abstract appreciation alone.
      *   **Comparing Isolated Values:** When we *force* ourselves to imagine the appreciation of mental qualities *in itself* (without expression), it seems to have *less* intrinsic value than we might expect. Simultaneously, the appreciation of "mere corporeal beauty" (e.g., admiring a beautiful face or sunset, considered purely aesthetically, without any knowledge of the mind behind it) seems, *in itself*, to possess a surprisingly high degree of intrinsic value.

  3.  **The Seeming Paradox & Its Resolution (Organic Unity):**
      *   **The Apparent Contradiction:** Yes, it *seems* paradoxical: Moore champions personal affection (which centrally involves appreciating mental qualities) as a supreme good, yet here he suggests that appreciating a beautiful face *by itself* might be more valuable *intrinsically* than appreciating virtuous character *by itself*.
      *   **The Key: Organic Wholes:** This is where Moore's doctrine of **organic unities** is essential. He argues: **The value of a whole is not necessarily equal to the sum of the values of its parts.** A part considered in isolation might have little or even negative value, but when combined with other parts in a specific whole, the value of the whole can be vastly greater.
      *   **Applying it Here:**
          *   **Isolated Part 1:** Appreciation of mental qualities alone (value = *X*, perhaps lower than expected).
          *   **Isolated Part 2:** Appreciation of corporeal beauty alone (value = *Y*, relatively high).
          *   **The Organic Whole (Personal Affection):** This is NOT just (X + Y). It is the appreciation of mental qualities *as expressed through* corporeal beauty *in a specific person towards whom affection is felt*. This complex whole has a value (*Z*) that is *immensely greater* than either X or Y alone, and even greater than X + Y. *Z* is the supreme good he champions.

  4.  **Why This Doesn't Undermine Personal Affection:**
      *   **The Whole is Supreme:** Moore's point isn't that admiring character is unimportant. It's that its *supreme* value emerges *only* within the concrete, embodied whole of "personal affection." The inclusion of the bodily expression is crucial for unlocking that supreme value.
      *   **Highlighting the Contribution of Beauty:** Moore is emphasizing that the *aesthetic* component (the appreciation of the physical expression itself *as beautiful*) is not merely incidental; it's a vital part of what makes the whole so valuable. The beauty *expresses* the character, and the appreciation of *that expression* is key. Personal affection inherently involves an aesthetic appreciation of the beloved person.
      *   **Explaining the "Thrust":** The "thrust of the chapter" is precisely to argue for the supreme value of these complex organic wholes (personal affection, aesthetic enjoyment). Analyzing the parts in isolation helps *demonstrate why* the whole is so valuable – because the parts *alone* lack the supreme value, but their combination creates something uniquely and immensely valuable. It shows that the supreme good is irreducibly complex.

  5.  **The Role of "Appears to be Doubtful":**
      *   **Methodological Caution:** Moore is famously meticulous about distinguishing what we can know for certain via intuition from what is less clear. "Appears to be doubtful" signals he's reporting his intuitive judgment from the thought experiment but acknowledges it's difficult to be absolutely definitive about these isolated mental states.
      *   **Inviting Scrutiny:** He's inviting the reader to perform the same thought experiment and test their own intuitions.
      *   **Strengthening the Main Point:** Even if the doubt were resolved and we decided appreciation of character *in itself* (X) was slightly higher than appreciation of mere beauty *in itself* (Y), his main argument *still holds*: the immense superiority of the whole (Z) lies in the combination, not in the isolated high value of X. The crucial point is that Z >> (X or Y).

  **How it Fits into the Larger Argument:**

  1.  **Defining the Greatest Goods:** The chapter argues that the greatest goods are complex states of consciousness involving appreciation of intrinsically valuable objects.
  2.  **Personal Affection as Prime Example:** Loving appreciation of another person's good qualities is presented as a prime candidate for the highest good.
  3.  **Analyzing its Components:** Moore, true to his analytical method, dissects this complex state. This paragraph probes the role of the *physical expression* of character within affection.
  4.  **Demonstrating Organic Unity:** By showing that the physical expression is essential and that the value explodes when the mental and physical appreciation are combined (compared to either in isolation), he powerfully illustrates *why* this complex whole is so supremely valuable. It's not *just* the goodness of the character, nor *just* the beauty, but the loving appreciation of the good character *manifested in* the beautiful expression.
  5.  **Elevating Aesthetic Appreciation:** This passage subtly reinforces the fundamental importance Moore places on the appreciation of beauty *as such* – it's a core component even within the supreme good of personal affection.

  **In essence:** Moore isn't backtracking on personal affection being a supreme good. He's deconstructing it to show *why* it's supreme. The apparent paradox arises because he isolates components to demonstrate that their *combination* in the organic whole creates value far exceeding the sum of the parts. The "doubt" highlights the counterintuitive result of this isolation, reinforcing the principle of organic unities and the indispensable role that the appreciation of physical beauty plays *within* the highest form of personal affection.
