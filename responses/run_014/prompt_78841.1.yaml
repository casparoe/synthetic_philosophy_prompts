prompt: |-
  I am in a small reading group working through Hobbes's philosophy of science, and we have bogged down over a reconstruction one of us built out of Hobbes's own doctrines — an argument which, if it holds, dissolves the special epistemic standing Hobbes gives to geometry and takes his civil philosophy down with it. The materials are these. Hobbes treats reasoning as a kind of computation, the combining and separating of names, and he treats demonstration as the derivation of consequences from definitions; the definitions come first, and the rest of a science is the working out of what follows from them. He explains why geometry can be demonstrated while natural philosophy cannot: the lines and figures we reason about are drawn and described by us, so we know their construction, whereas with natural bodies we do not know the construction and must instead hunt for causes from observed effects. And he says civil philosophy is demonstrable for the same reason, namely that we make the commonwealth. In the geometry, moreover, the definitions are generative rather than descriptive — a circle, for instance, is defined as the figure produced by the circumduction of a straight line about a fixed point, so the definition tells you how to make the thing. One of us then argued as follows. (1) A demonstration is a chain of consequences derived from definitions. (2) Definitions are stipulations that we ourselves lay down, and we could have laid them down otherwise. (3) A truth that depends on a stipulation we chose, rather than on something we discovered, is a truth about our notation and not about the world. (4) Geometry is demonstrable in precisely this sense; its certainty comes from our making the figures, not from anything we find in nature. (5) Therefore geometry tells us nothing about the world, and its necessity is only the necessity of consistency within a system of our own devising. (6) By the same route, civil philosophy — which Hobbes boasts is demonstrable because we make the commonwealth — is emptied of anything concerning how people actually are. (7) But Hobbes means both to be substantive knowledge, and he treats geometry as the model on which all the rest of science, including the mathematical natural philosophy he wants to build on it, is supposed to rest.

  I cannot decide whether the argument is valid and one of (1) through (4) is simply too expensive to keep, or whether there is a slide somewhere in it; the two things I would most like to preserve are (4), since it is Hobbes's own account of why geometry is special, and (7), since without it there is nothing left of his programme at all. A colleague in the group wants to read the whole thing as a cautionary tale about the circle-squaring follies of Hobbes's later years, on the theory that a man who takes geometry to be something we make up will eventually believe he has made up a proof; I do not think that is an argument, but it shows how badly I need the diagnosis. So tell me which step to give up, why it looked so plausible in the first place, and what rejecting it costs Hobbes — if the price is that geometry loses its privileged standing after all, or that his contrast between geometry and natural philosophy collapses, I would like to know that in advance rather than discover it three sessions from now.
reasoning: |-
  Okay, let me try to figure out how to approach this problem. The user is part of a reading group studying Hobbes's philosophy of science. They're stuck on an argument that challenges Hobbes's distinction between geometry/civil philosophy and natural philosophy. The core issue is whether Hobbes can maintain that geometry provides substantive knowledge about the world if it's based on human stipulations.

  First, I need to parse the argument presented by the reading group member. It has seven steps: (1) Demonstrations rely on definitions; (2) Definitions are arbitrary stipulations; (3) Truths from stipulations are about notation, not the world; (4) Geometry's certainty comes from our constructions; (5) Therefore geometry isn't about the world; (6) Same applies to civil philosophy; (7) But Hobbes needs both to be substantive.

  The user wants to preserve (4) because it's Hobbes's own view, and (7) because without it Hobbes's entire project collapses. They're worried that if this argument holds, it destroys the epistemic privilege Hobbes gives to geometry and civil philosophy.

  Looking at Hobbes's position: He distinguishes between geometry (demonstrable because we construct the objects) and natural philosophy (not demonstrable because we don't construct natural bodies). Civil philosophy is demonstrable because we construct commonwealths. The problem arises when we consider that if geometry is based on stipulations, how can it tell us about the real world?

  I think the key flaw is in step (3). The claim that truths derived from stipulations can't be about the world seems too strong. Maybe the truth is conditional: IF we construct things according to these definitions, THEN certain properties follow. When we actually build things based on geometric principles, those conditional truths become actual truths about physical objects.

  Hobbes might be working with a sort of operationalist view where the meaning of geometric terms comes from our ability to perform the constructions. For example, "circle" means "what you get when you circumduct a straight line around a point." When we apply this to physical compass-and-paper constructions, we get knowledge about real circles.

  For civil philosophy, similar logic applies: IF people covenant to create a sovereign with certain powers, THEN certain political consequences follow. This remains substantive because humans do actually create commonwealths through such covenants.

  Rejecting step (3) preserves both geometry's special status (4) and Hobbes's overall project (7). It maintains the distinction from natural philosophy because for natural objects, we lack this constructive knowledge of their generation.

  The cost is that Hobbes must accept that geometric knowledge isn't absolute but depends on our constructive capacities. But this is consistent with his view that we only have certain knowledge where we make the objects.

  The alternative would be giving up (2), but that would undermine Hobbes's conventionalism about definitions. Or giving up (4), but that destroys his account of why geometry is special. So step (3) seems the best candidate for rejection.

  I should also note that this preserves Hobbes's contrast between geometry/natural philosophy, which is crucial to his system. The conditional knowledge from constructions still counts as substantive world-knowledge when applied.
answer: |-
  Your reading group has hit upon a profound tension in Hobbes's system, and the argument presented is both valid and insightful. However, it contains a critical misstep that, when corrected, preserves Hobbes's core distinctions while clarifying the nature of geometric and civil knowledge. Here's the diagnosis:

  ### The Flawed Step: (3)  
  **"A truth that depends on a stipulation we chose, rather than on something we discovered, is a truth about our notation and not about the world."**  

  This step smuggles in a false dichotomy between "notation" and "the world." Hobbes rejects this separation for geometry and civil philosophy. His key insight (which step (3) ignores) is that **definitions are not merely linguistic conventions but operational instructions for constructing objects**. When we stipulate a definition like "a circle is produced by the circumduction of a straight line about a fixed point," we are not just assigning a label—we are defining a **procedure** for creating a physical object (e.g., using a compass on paper). The resulting truths (e.g., "all radii are equal") are *about the properties of constructed objects*, not just about names.  

  ---

  ### Why Step (3) Looks Plausible (and Why Hobbes Avoids It)  
  1. **The Shadow of Nominalism**: Hobbes is a nominalist, so it's tempting to read him as reducing truth to linguistic conventions. But his unique move is to tie stipulations to *constructive acts*. Geometry's definitions are "generative" because they encode causal powers: they tell us how to *produce* an instance of the thing defined.  
  2. **Misplaced Focus on "Stipulation"**: Step (3) treats stipulations as arbitrary, like defining "gavagai" to mean "rabbit." For Hobbes, geometric stipulations are constrained by the **material practices of construction**. You cannot stipulate a definition that cannot be physically instantiated (e.g., "a square circle") because the act of construction would fail.  

  ---

  ### What Rejecting Step (3) Costs Hobbes (and Why He Pays It Gladly)  
  Rejecting (3) preserves (4) and (7) but requires refining Hobbes's epistemology:  
  - **Cost 1: Geometry's "Worldliness" is Conditional**  
    Geometry tells us about the world *only insofar as we can physically construct its objects*. When we draw a circle with a compass, the demonstrable properties (equal radii, constant curvature) hold *because* we followed the generative definition. This is not "truth about notation" but **truth about artifacts produced by specific causal processes**.  
    - **Hobbes's Payoff**: This preserves geometry's privilege. Its certainty arises from our control over construction, contrasting with natural philosophy (where we lack access to the causal generation of things like stars or magnetism).  

  - **Cost 2: Civil Philosophy is Hypothetical, Not Descriptive**  
    Civil philosophy's demonstrations (e.g., "sovereign power must be absolute") are true *if* humans construct a commonwealth via mutual covenant. It does not describe how people "actually are" in a state of nature but **how they must act *if* they create an artificial person** (the Leviathan).  
    - **Hobbes's Payoff**: This is consistent with his project. Civil science is substantive not because it describes innate human behavior but because it reveals the **necessary conditions for maintaining artificial order**. Humans *can* (and do) construct commonwealths, so the deductions apply to the real world when construction occurs.  

  ---

  ### Why the Geometry/Natural Philosophy Contrast Survives  
  The rejection of (3) actually *strengthens* Hobbes's distinction:  
  | **Domain**       | **Basis of Definitions**      | **Epistemic Status**       |  
  |------------------|-------------------------------|----------------------------|  
  | **Geometry**     | Generative (we construct)     | Demonstrable (certain)     |  
  | **Civil Philosophy** | Generative (we covenant) | Demonstrable (certain)     |  
  | **Natural Phil.** | Descriptive (we observe)    | Probable (conjectural)     |  

  Natural philosophy fails because we cannot stipulate generative definitions for natural bodies. We observe effects (e.g., motion) but cannot construct matter *ex nihilo* to test definitions. Geometry/civil philosophy succeed because we *can* perform the constructive acts that make their objects real.  

  ---

  ### Conclusion: Why the Argument Fails  
  The argument collapses at step (5): "Geometry tells us nothing about the world." For Hobbes, it tells us about the **world we construct through defined operations**. This does not empty geometry or civil philosophy of content—it grounds their content in human action. Your instinct to save (4) and (7) is correct: Hobbes can consistently claim that geometry is both "made up" (in its definitions) and "about the world" (when enacted materially). The slide occurs in assuming that stipulative origins imply mere verbalism. For Hobbes, stipulations are **blueprints for action**, and action bridges language and world.  

  Your colleague's "circle-squaring" caution is witty but irrelevant: Hobbes's geometric follies stem from overconfidence in his constructive *methods*, not his epistemology of construction. His core framework remains intact if you jettison step (3). This saves Hobbes's system while exposing its operationalist heart: **knowledge is certain only where we are the makers**.  

  *Recommended next step for your group: Test this against Hobbes's treatment of "motion" in natural philosophy. Does his mechanistic materialism allow any generative definitions for physics? If not, the geometry/natural philosophy contrast holds firm.*
