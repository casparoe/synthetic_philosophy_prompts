prompt: |-
  I'm a physics grad student and I've been stuck in this arguement for about a year now with a philosopher of science I collaborate with on a side project. She thinks philosophy has been genuinely load-bearing for physics over the last couple centuries, and I side with the physicists who've been famously skeptical of whether philosophy does the discipline any good (Weinberg, Hawking, and Feynman all come to mind). We've mostly just been going in circles, so we finally agreed to do a proper adversarial collaboration and write up the document we should have produced two years ago.

  Can you draft the joint statement that the two of us could both actually sign? I want the claims we agree on, including about what 'usefulness to science' even means and about the broad history of the discipline; the precise statements of where we still differ, each phrased so that my side would accept the wording of her view and she'd accept the wording of mine; the cruxes -- I suspect one is whether conceptual clarification counts as a scientific contribution at all when it doesn't predict anything new, and another is whether the Bayesian revolution and the modern formalization of causal inference (causal diagrams, the do-calculus, the whole Judea Pearl line of work) count as philosophy doing useful work or as math and statistics that just happened to have philosophical ancestors; and for each crux, a concrete case or argument both of us would accept as bearing on it, with each side's prediction written down in advance. Format it as a numbered agreed-claims section followed by a disagreements table.
