answer: |-
  ### Translation of Ferguson and Tharoor Claims into Audit Vocabulary  

  | Claimant | Claim (Plain English)                                                                 | Accounting Rendering                                                                                                                                                                                                 | Fidelity      | Residue Note                                                                 |
  |----------|---------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------|------------------------------------------------------------------------------|
  | **Ferguson** | The Raj integrated India into global markets, boosting trade.                          | The entity expanded market access, increasing the **fair value** of trade-related intangible assets. Recognition hinges on **recoverable amount** exceeding carrying cost.                                             | Distorted     | Assumes counterfactual baseline (no alternative market expansion) not recognized in impairment tests. |
  | **Ferguson** | British rule established impartial courts and property rights.                         | Implementation of **internal controls** (legal framework) reduced inherent risk, enhancing **going concern** reliability. Benefits amortized over asset life.                                                          | Clean         | –                                                                           |
  | **Ferguson** | Railways/telegraph built modern infrastructure.                                        | **Capital expenditure** on PP&E (railways, telegraphs) increased productive capacity. Asset **useful life** and **depreciation** aligned with economic utility.                                                        | Clean         | –                                                                           |
  | **Ferguson** | Without the Raj, India would have faced more war and less modernization.               | **Going concern** assertion relies on counterfactual avoidance of operational risks (war) and **impairment triggers** (stagnation). Management’s assessment lacks auditable evidence.                               | No expression | No accounting equivalent for hypothetical scenarios; nearest concept is **value in use**, but requires entity-specific cash flows, not speculative history. |
  | **Tharoor** | Famines killed millions while grain exports continued.                                 | **Related-party transactions** (grain exports to Britain) prioritized over **provision for liabilities** (famine relief). **Material misstatement** due to omitted contingency and **inventory impairment** not recognized. | Distorted     | Human suffering not quantifiable as a liability; treated as externality.    |
  | **Tharoor** | Textile deindustrialization destroyed India’s manufacturing base.                      | **Asset impairment** (textile sector) due to **non-arm’s-length transactions** (tariffs favoring imports). **Recoverable amount** fell below carrying value amid policy-driven obsolescence.                         | Distorted     | Attribution blurred between imperial policy (**selection effect**) and Industrial Revolution (**allocation effect**). |
  | **Tharoor** | Systematic wealth drain to Britain via taxes and monopolies.                           | **Related-party transactions** (resource transfers to Crown) at non-arm’s-length terms. **Equity drain** equivalent to excessive dividends, reducing subsidiary net assets.                                        | Clean         | –                                                                           |
  | **Tharoor** | Violence of conquest inflicted unaccounted human costs.                                | **Acquisition costs** (military suppression) capitalized, but **off-balance-sheet liabilities** (social unrest, reparations) not recognized. **Contingent liabilities** omitted from disclosures.                   | No expression | Non-quantifiable social costs lack recognition criteria; nearest is **contingent liability**, but requires probable outflow, not retrospective moral accounting. |

