  ### Key Audit Insights  
  1. **Basis at 1947 Breakup**: The entity should be assessed under **liquidation basis accounting** (not going concern), as the Raj ceased operations. Post-1947 legacy assets (e.g., railways) transferred to successor entities (India/Pakistan) at **fair value**, but **attribution** of their utility to imperial policy vs. global trends remains unresolved.  
  2. **Ownership Attribution**: Changing owners (Company shareholders → Crown) complicates **equity reconciliation**. Wealth transfers to Britain resemble **excessive related-party dividends**, diluting subsidiary equity.  
  3. **Counterfactual Gap**: Accounting has no tool for "what-ifs." Ferguson’s modernization gains and Tharoor’s deindustrialization losses both rely on hypothetical baselines, making **materiality** judgments arbitrary.  
  4. **Residue Verdict**: The framework’s inability to quantify human suffering or alternative histories is a structural defect. Yet, the debate’s reliance on these elements suggests it is fundamentally about ethics and causality—questions beyond financial statements.
