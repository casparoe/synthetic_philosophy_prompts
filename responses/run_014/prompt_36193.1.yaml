prompt: |-
  So heres the situation: I'm a philosophy of science PhD student about a year into an "embedded" placement with an interpretability team at an ML lab (long story, basically my advisor got a grant for philosophy-in-the-wild placements and I drew the short straw, or maybe the long one). My actual job, roughly, is to help the team decide when they're licensed to say "the network represents X" — truth, sentiment, the board state, whatever — versus having to write the weaker "we found a feature that tracks X in the settings we tested." Right now there's no shared standard. Some folks on the team are basically realists (if a probe can read it out, it's represented), others are deflationists (it's all convenient bookkeeping and "representation" talk is a metaphor we should just drop), and paper drafts and external comms flip between the two dependng on who wrote them. That inconsistency is what I'm trying to fix.

  You're a philosopher of science who also knows the ML literature. Take the realism/instrumentalism debate seriously but make it usable — I want the conceptual mapping somewhat explicit (what plays the role of novel prediction, what corresponds to robustness across retraining runs, maybe the structural realist thought that what survives is the structure, not the object, since "the model has a truth *direction*" might be exactly the kind of claim where the subspace is real and the human concept isn't). But the deliverable has to be a procedure, not an essay. Think carefully and do a bit of brainstorming before writing, please.

  Constraints: a mixed panel of two engineers and me runs it in under an hour per claim, and none of us have patience for seminar-level nuance, so it needs to be an ordered checklist — the questions to ask about a claim, what counts as a sufficient answer at each step, where the procedure terminates in "downgrade the claim," and where it punts to a human because the remaining question is about values rather than facts (e.g. how much overclaiming risk the lab should accept in public messaging — that's not something a checklist can settle, and I want it to visibly say so).

  Then run it on three claims, since worked examples are how the team will actually learn it: (1) a linear probe for sentiment where the probe classifies beautifully but ablating the direction barely changes anything downstream; (2) the claim that a model trained on chess- or Othello-type play represents the board state, based on probes plus interventions that change its predicted moves the way the interpretation says they should; (3) the safety pitch that the model "represents deception" — I suspect the procedure will downgrade that one and the comms team will hate it, which is exactly why I want it included, so be honest about the result. Also tell me plainly what the procedure *can't* do: I'm guessing it can't settle anything when the evidence is genuinely underdetermined, and I worry that once the checklist circulates internally people will Goodhart it (tweaking experiments to pass the rubric rather than to find out what's going on). One page of actual checklist, the rest can be explanation. Thx!
reasoning: |-
  We are creating a checklist procedure to evaluate claims of the form "The network represents X". The goal is to provide a structured way to assess such claims, balancing philosophical rigor with practical usability. The procedure should be based on key concepts from philosophy of science (realism vs. instrumentalism, robustness, novel predictions, structural realism) and ML interpretability practices.

  Key considerations:
  1. **Realism vs. Instrumentalism**: 
     - Realist: Representation exists independently of our methods of detection (like scientific realism).
     - Instrumentalist: Representation is a useful fiction for prediction and intervention (like in operationalism).

  2. **Criteria for Representation** (from philosophy and ML):
     - **Robustness**: The feature is consistently found across different models, training runs, or perturbations.
     - **Counterfactual Invariance/Intervention**: The feature behaves as expected under interventions (e.g., if we change the input in a way that should change X, the feature changes accordingly).
     - **Downstream Impact**: The feature plays a causal role in the network's behavior (not just correlated).
     - **Novel Predictions**: The representation allows us to make and confirm new predictions (about the model's behavior or the world) that weren't used in constructing the representation.

  3. **Structural Realism**: The idea that what is preserved across theory changes (or in this case, across model variations) is the structure, not the specific content. For example, the model might have a "truth direction" (a structure) without necessarily representing truth in a human-like way.

  4. **Degrees of Confidence**: We want to avoid binary yes/no and instead have a graded assessment (e.g., "strongly licensed", "weakly licensed", "insufficient evidence", or downgrade to "tracks X in tested settings").

  5. **Termination Points**: The checklist should terminate early if a claim fails a critical step, and it should clearly indicate when a downgrade is necessary. It should also flag when the remaining issue is about values (e.g., risk tolerance) and not facts.

  Checklist Structure:

  We'll design a step-by-step checklist with questions. Each question must be answered with evidence. We'll have three outcomes for each step:
     - Pass (strong evidence)
     - Weak (some evidence but not strong)
     - Fail (insufficient or contrary evidence)

  But note: we want to avoid too many categories for simplicity. Instead, we can have a series of gates. If a gate is passed, we proceed; if not, we downgrade and terminate or proceed with a weaker claim.

  The checklist will have the following steps:

  **Step 1: Robustness**
     - Question: Is the feature (that we claim represents X) robust across relevant variations? (e.g., different initializations, architectures, data subsets, or even similar tasks)
     - What counts: 
          Pass: Consistent finding across multiple retraining runs or in multiple models (e.g., same architecture trained multiple times, or different architectures). 
          Weak: Only in one model, but across multiple layers or time steps? (But note: we are looking for robustness that suggests it's not an artifact of a particular run.)
          Fail: Only found in this specific model and run.
     - If Pass: Proceed.
     - If Weak: The claim is downgraded to "we found a feature that tracks X in this specific model and settings" unless subsequent steps override.
     - If Fail: Downgrade and terminate (no representation claim).

  **Step 2: Counterfactual Invariance (Intervention)**
     - Question: Does the feature change appropriately under interventions that should change X? And conversely, does the feature remain stable under interventions that should not change X?
     - What counts: 
          Pass: Clear experimental evidence that when we manipulate the input to change X (e.g., change the sentiment of a sentence), the feature changes accordingly, and when we manipulate irrelevant aspects, it doesn't change. Also, if we intervene on the feature (e.g., via activation editing), we observe the expected downstream effect (e.g., changing the model's output as if X had changed).
          Weak: Only one direction (e.g., input intervention but no activation editing, or vice versa) or limited interventions.
          Fail: No intervention evidence, or evidence that the feature does not change as expected.
     - If Pass: Proceed.
     - If Weak: The claim remains at the current level (if it was already downgraded, it stays; if it came from Step 1 Pass, it becomes Weak) and we proceed.
     - If Fail: Downgrade to "tracks X in a correlational sense in the tested settings" and terminate.

  **Step 3: Downstream Impact**
     - Question: Does the feature play a causal role in the model's behavior? (i.e., if we ablate or alter the feature, does the model's output change in a way that is consistent with the role of X?)
     - What counts:
          Pass: Ablating the feature (e.g., setting activations to zero in that direction) causes a significant and specific change in the output that aligns with the removal of X. For example, in sentiment analysis, the model becomes worse at sentiment or changes its sentiment prediction in a predictable way. Also, if the feature is not ablated, the model behaves normally.
          Weak: Ablation causes a change but it's not specific (e.g., model performance drops across the board) or the change is small. 
          Fail: Ablation has no effect or an effect that doesn't align with X.
     - If Pass: Proceed.
     - If Weak: The claim is downgraded (if it was Strong, it becomes Weak; if it was already Weak, it becomes "tracks X ...") and we proceed to Step 4.
     - If Fail: Downgrade to "tracks X but is not used by the model in its output" and terminate.

  **Step 4: Novel Predictions**
     - Question: Does the representation allow us to make and confirm novel predictions about the model's behavior? (e.g., in a new setting, without having been trained on that setting, we can predict how the model will behave based on the representation of X)
     - What counts:
          Pass: We design a new test (not used in developing the probe or the interpretation) and the model behaves as predicted by the representation. For example, in the board state case, we set up a board position that the model hasn't seen and predict the next move based on the extracted board state, and it matches.
          Weak: Some novel predictions hold, but not all, or they hold only in a subset of cases.
          Fail: No novel predictions tested, or they fail.
     - If Pass: We have strong evidence for representation. Claim can be "the network represents X".
     - If Weak: The claim is "the network likely represents X, but with some uncertainty" (or downgrade to the previous level if it was already weak).
     - If Fail: The claim is downgraded to the level after Step 3.

  **Termination with Downgrade**: At any step, if we downgrade and the step says "terminate", we stop and output the downgraded claim.

  **Values Punt**: If we get to the end and the evidence is mixed (e.g., Weak in multiple steps) and the decision to claim representation depends on how much risk the lab is willing to take (e.g., in safety claims), then the checklist explicitly says: "The evidence is inconclusive. The decision to claim representation at this point depends on risk tolerance and communication strategy. This is a value judgment and must be decided by stakeholders."

  **What the Checklist Cannot Do**:
     - It cannot resolve underdetermination: when the evidence equally supports multiple interpretations.
     - It might be Goodharted: if the team designs experiments to pass the checklist without genuinely probing representation, the results may be misleading. We must emphasize that the spirit of the checklist is to seek truth, not to game the system.

  Now, run the checklist on the three examples:

  **Example 1: Sentiment Probe (linear probe works, but ablation doesn't change downstream)**

  Step 1: Robustness - Assume it's robust (Pass). 
  Step 2: Counterfactual Invariance - We can change sentiment and the feature changes (Pass). 
  Step 3: Downstream Impact - Ablating the direction barely changes anything (Fail). 
     -> Downgrade to: "The model has a feature that tracks sentiment in the tested settings, but it is not used in producing the output." Terminate.

  **Example 2: Board State Representation (probes plus interventions that change moves as expected)**

  Step 1: Robustness - Assume it's robust across retraining (Pass).
  Step 2: Counterfactual Invariance - They have interventions: changing the board state (via input or activation editing) leads to the expected change in moves (Pass).
  Step 3: Downstream Impact - Ablating the board state feature should cause the model to make invalid moves or lose the ability to play? (Assuming they did this and it did: Pass).
  Step 4: Novel Predictions - They set up new board positions and the model behaves as predicted (Pass). 
     -> Strong evidence: "The network represents the board state."

  **Example 3: "Represents Deception" (safety pitch)**

  We need to be critical. What is the evidence? Let's assume they have a probe that detects when the model is being deceptive (e.g., in a dataset of deceptive vs. honest answers) and maybe some interventions.

  Step 1: Robustness - Unknown, but let's assume it's only in one model (Weak or Fail). We'll assume Weak (for the sake of example, but note: deception might be harder to capture robustly).
     -> If Weak, we downgrade to a weaker claim and proceed? According to Step 1: if Weak, downgrade unless subsequent steps override. But we proceed.

  Step 2: Counterfactual Invariance - They might have experiments where they induce deception (e.g., by prompt engineering) and the feature activates. But what about activation editing? If they edit the feature, does the model become more or less deceptive? And is that effect specific? (Likely not well established, so Weak or Fail). Let's say Weak: they have some intervention but not both ways or not very specific.

  Step 3: Downstream Impact - Ablating the "deception" feature: does the model stop being deceptive? Or become more deceptive? And is that the only effect? (Probably not tested, or if tested, the effect might not be clear because deception is complex and may involve multiple features). Fail.

     -> At Step 3 Fail, downgrade to "tracks deception in a correlational sense in the tested settings" and terminate.

  Alternatively, if Step 1 was Fail, we terminate earlier. The point is: without robustness, strong interventions, and downstream impact, we cannot claim representation.

  Now, write the checklist in a formal, one-page format.
answer: |-
  ### Representation Claim Assessment Procedure (v1.0)  
  *For evaluating "The network represents X" claims. Time: ≤60 min/claim. Requires: Evidence from experiments (probes, interventions, ablation).*  
  **Outputs:** Strong License (use "represents X"), Weak License (use "tracks X in tested settings"), or Downgrade + Punt (values decision).  

  ---

  **CHECKLIST**  
  *Run steps in order. Terminate early if Downgrade/Punt triggered. Document evidence per step.*  

  1. **ROBUSTNESS ACROSS VARIATIONS**  
     *Is the feature stable under non-adversarial changes? (Structural realism: preserved structure > human concept)*  
     - **Pass:** Feature detects X consistently across ≥3 retraining runs *or* ≥2 architectures/tasks.  
     - **Weak:** Consistent in one model but not tested elsewhere.  
     - **Fail/Insufficient:** Only in current run/model.  
     **→ Pass:** Proceed.  
     **→ Weak:** Downgrade claim to *Weak License*. Proceed.  
     **→ Fail:** Downgrade to "tracks X in tested settings." **Terminate.**  

  2. **INTERVENTIONAL VALIDATION**  
     *Does perturbing inputs/activations change the feature *and* downstream behavior as X-predictions require?*  
     - **Pass:** (a) Input interventions (e.g., altering X) change feature *and* (b) Activation edits (e.g., patching) alter output *as if X changed*.  
     - **Weak:** Only (a) *or* (b) shown, or effects partial/noisy.  
     - **Fail:** Interventions don’t align with X-predictions *or* no tests.  
     **→ Pass:** Proceed.  
     **→ Weak:** Maintain current license (if Strong→Weak). Proceed.  
     **→ Fail:** Downgrade to "tracks X correlatively." **Terminate.**  

  3. **DOWNSTREAM CAUSAL ROLE**  
     *Does ablating the feature disrupt model behavior *specifically* for X-tasks?*  
     - **Pass:** Ablation degrades X-task performance significantly (>20% relative drop) *without* broadly harming unrelated tasks.  
     - **Weak:** Drop in X-task but non-specific (e.g., global performance hit) *or* effect small.  
     - **Fail:** No effect on outputs *or* ablation improves performance.  
     **→ Pass:** Proceed.  
     **→ Weak:** Downgrade (if Strong→Weak). Proceed.  
     **→ Fail:** Downgrade to "tracks X but non-causal." **Terminate.**  

  4. **NOVEL PREDICTION TEST**  
     *Can the feature predict model behavior in *untrained* scenarios involving X?*  
     - **Pass:** Feature correctly predicts model outputs on novel X-variants (e.g., unseen board states, sentiment domains) with ≥90% accuracy.  
     - **Weak:** Mixed success (e.g., 70-89% accuracy) *or* tests only on familiar data.  
     - **Fail:** Predictions fail (<70%) *or* no novel tests.  
     **→ Pass:** **Strong License** ("represents X").  
     **→ Weak:** **Weak License** ("tracks X in tested settings").  
     **→ Fail:** Downgrade to Weak License.  

  **PUNT RULE:** If outcome is Weak License *and* the claim has safety/ethical stakes (e.g., deception, bias), **pause and flag**:  
  > *"Insufficient evidence for 'represents X.' Final call depends on overclaiming risk tolerance (values decision). Consult: Comms + Policy."*  

  ---

  **WORKED EXAMPLES**  
  *(Using simulated evidence; adapt to real data)*  

  1. **Claim: "Represents sentiment"**  
     - Step 1: Pass (robust across 5 retrainings).  
     - Step 2: Pass (input sentiment changes alter activations).  
     - Step 3: **Fail** (ablation doesn’t affect sentiment output).  
     → **Output:** Downgrade to "tracks sentiment in tested settings."  

  2. **Claim: "Represents board state"**  
     - Step 1: Pass (tested on 3 architectures).  
     - Step 2: Pass (editing activations changes moves predictably).  
     - Step 3: Pass (ablation disrupts move accuracy by 35%).  
     - Step 4: Pass (predicts moves on novel boards at 95% accuracy).  
     → **Output:** **Strong License** ("represents board state").  

  3. **Claim: "Represents deception"**  
     - Step 1: Weak (only in one model). → Downgrade to Weak License.  
     - Step 2: Weak (input interventions work; activation edits not tested).  
     - Step 3: Fail (ablation doesn’t reduce deceptive outputs).  
     → **Output:** Downgrade to "tracks deception correlatively."  
     **PUNT:** Safety-relevant → Flag for values decision.  

  ---

  **WHAT THIS PROCEDURE CANNOT DO**  
  1. **Resolve underdetermination:** If evidence equally supports multiple interpretations (e.g., "represents deception" vs. "represents conflict"), the checklist cannot arbitrate.  
  2. **Prevent Goodharting:** Engineers may optimize experiments to "pass" steps without deeper validity (e.g., cherrypicking novel prediction tests). Mitigation: Audit checklist inputs.  
  3. **Replace conceptual work:** Does not define "representation" itself—assumes team agrees on X’s operationalization (e.g., "sentiment" = human-labeled valence).  
  4. **Handle continuous evidence:** Thresholds (e.g., 90% accuracy) are heuristic; adjust via team consensus.  

  **RECOMMENDATION:** Pair this with pre-registered experiments to avoid Goodharting. For values-based punts, use a lab-wide risk rubric (separately developed).  

  ---  
  *Procedure design inspired by: Woodward (interventionism), Hacking (entity realism), Franklin-Hall (robustness). ML analogs: causal mediation (Step 2), universality (Step 1).*
