  (2) A statute imposing an unfair tax (enacted flawlessly): **law**.

  (3) A norm consistently followed for centuries without formal enactment: **law** (customary law).

  (4) A statute enacted flawlessly but never promulgated or made accessible: **not law**.

  (5) A statute with a contradiction (section A commands what section B forbids): **not law**.

  (6) A judicial ruling that openly departs from plain text of a statute to avoid absurdity: **law**.

  Now, the new case:

  (7) A criminal statute, enacted flawlessly and duly published, that makes it an offence to engage in "conduct contrary to the moral order of the community," with no further definition or guidance.

  We must predict what she will say and identify which theory of law her pattern of verdicts commits her to. If underdetermined, we must list candidate theories, their predictions for (7), and what revisions would be needed for consistency.

  First, let's analyze the pattern:

  - She recognizes enacted statutes as law even if they are morally horrendous (1) or unfair (2), but only if they are promulgated (4) and non-contradictory (5). 

