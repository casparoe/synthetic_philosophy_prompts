     - (7): Without a requirement of non-vagueness in the rule of recognition, the exclusive positivist would say (7) is law. But then she would have to say (7) is law, which would be inconsistent with the pattern if she follows Fuller.

  However, note that she has not yet ruled on vagueness. So exclusive positivism might be a candidate if we assume the rule of recognition does not require non-vagueness. Then exclusive positivism would predict (7) is law.

  But let's see if exclusive positivism can account for all prior verdicts without revision:

  - (1) and (2): law (enacted without procedural flaw) - fits.
