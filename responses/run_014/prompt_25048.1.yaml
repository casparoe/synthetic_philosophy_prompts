  So exclusive positivism (with a rule of recognition that includes promulgation and non-contradiction) fits all prior verdicts. But it would predict (7) is law because the rule of recognition (as we have inferred) does not require non-vagueness.

  Therefore, if she is an exclusive positivist, she would say (7) is law. But if she is a Fullerian, she would say not law.

  So the prior verdicts underdetermine? They are consistent with both:

  - **Fuller's theory** and **inclusive positivism** (if the rule of recognition incorporates Fuller's principles) would predict (7) not law.
  - **Exclusive positivism** (with a rule of recognition that includes promulgation and non-contradiction but not non-vagueness) would predict (7) is law.

  But note: in (6) she accepts a judicial ruling that departs from plain text to avoid absurdity. This might be seen as an application of a principle of avoiding absurdity, which could be part of Fuller's principles. However, exclusive positivists might also accept that the rule of recognition allows judges to use such principles in interpretation without affecting the validity of the statute. The ruling itself is a new legal act.

  But the new case (7) is about the statute itself. So the question is: does the vagueness of the statute make it invalid?

  In Fuller's view: yes. In exclusive positivism: no (unless the rule of recognition invalidates vague statutes).

  We don't have a prior verdict on vagueness. So the prior verdicts underdetermine the answer.

  But note that in (5) she invalidated a statute for contradiction. Contradiction is a kind of formal defect. Vagueness is also a formal defect in Fuller's view. So it is natural to extend the same reasoning to (7). Moreover, in (4) she required promulgation for validity. This suggests she is following a set of formal requirements for law.

  Therefore, I think the most consistent extension is to say that (7) is not law because it violates the principle of clarity (a formal requirement). This would be Fuller's position.

  But to be thorough, let's consider:

  Candidate theories:

  A. Fuller's theory (or inclusive positivism with Fuller's principles in the rule of recognition): 
     - Prediction for (7): not law.
     - Revisions needed to prior verdicts: none. The prior verdicts are consistent.

  B. Exclusive positivism with a rule of recognition that requires promulgation and non-contradiction but not non-vagueness:
     - Prediction for (7): law.
     - Revisions needed: none to prior verdicts. But note that (6) might be seen as a problem if the judicial ruling is creating new law, which is acceptable in exclusive positivism.

  However, there is a potential conflict in (6) for exclusive positivism: if the judicial ruling openly departs from the plain text, then how is it valid? In exclusive positivism, the rule of recognition might allow judicial lawmaking in gaps or to correct absurdities. So it's acceptable.

  But note that the pattern of verdicts (especially (4) and (5)) shows that she thinks that the formal defects (non-promulgation and contradiction) make the statute invalid. This suggests that she is applying a set of formal criteria that go beyond the minimal sources. Therefore, the exclusive positivist explanation requires that the rule of recognition includes these formal criteria. Why not also non-vagueness? We don't know. But without a prior verdict on vagueness, we cannot be sure.

  Given that she has already rejected statutes for formal defects (promulgation and contradiction), and vagueness is a well-known formal defect (in Fuller and in many legal systems), it is likely that she would extend the same reasoning to (7).

  Moreover, in the context of a criminal statute, vagueness is particularly problematic because it fails to give notice and might be arbitrary. This is a classic argument for invalidity.

  Therefore, I predict she will say: **not law**.

  And the theory that best fits the pattern is Fuller's theory of the internal morality of law.

  But note: she might be an inclusive positivist who has a rule of recognition that incorporates Fuller's principles. That would also fit. The distinction between inclusive positivism and Fuller may be subtle. Fuller's theory is often seen as a form of natural law (procedural natural law) but it is distinct from substantive natural law.

  Given the above, the answer:

  **Prediction for case (7): not law.**

  **Theory: Fuller's internal morality of law (procedural natural law) or inclusive positivism that incorporates Fuller's principles.**

  But if we must choose one, I would say Fuller because the pattern of verdicts (especially the rejection of non-promulgated and contradictory laws) is a hallmark of Fuller.

  However, note that in (1) she accepted an immoral law as valid, which is not the traditional natural law position but is consistent with Fuller and positivism.

