prompt: |-
  ok so I've been chewing on the problem of old evidence and I want a consistency check before I write it up for a seminar. Here's roughly where I've landed:

  (1) I think confirmation is basically the likelihood ratio — H confirms E just in P(E|H) > P(E|~H), and the strength is the size of that ratio.

  (2) I think the problem of old evidence is a genuine live problem for this view — on my own account, the anomalous precession of Mercury's perihelion and the success of Newtonian gravity in nailing down planetary orbits just plain fail to confirm general relativity, and I think that's a real defect, not a quirk.

  (3) I'm pretty sure the fix is NOT to switch to an explanatory / inference to the best explanation account of confirmation, which would make confirmation a matter of theoritical virtues instead of probability — the problem should be solved inside the probabilistic framework.

  (4) The key, I think, is that P(E|~H) isn't actually 1 for old evidence, because the pre-existing theory that already explains E is itself fallible, so P(E|~H) < 1 and the likelihood ratio can come out above 1 after all.

  (5) I also think that for old evidence to confirm a hypothesis, the hypothesis has to do something the old theory can't — a pure redundant restatement shouldn't get any confirmatory credit.

  Can you go through these and tell me which ones actually pull against each other, wich only look like they do, and what the cheapest revision is? I genuinely don't know where the crack is, so don't assume I'd give up any particular one — rank the tensions by severity and say what would have to give in each case.
reasoning: |-
  Okay, the user is working on the problem of old evidence in confirmation theory and wants a consistency check before presenting it in a seminar. They've laid out five key points about their current position. Let me unpack their reasoning.

  First, they define confirmation using the likelihood ratio (P(E|H) > P(E|~H)), which is a standard Bayesian approach. But they rightly point out this creates problems for old evidence like Mercury's orbit confirming general relativity - since we already knew E, P(E) would be 1, making the likelihood ratio undefined or trivial.

  Their rejection of explanatory accounts (IBE) in favor of probabilistic solutions makes sense - they're committed to Bayesian framework. Their proposed fix (point 4) is subtle: they argue P(E|~H) <1 because existing theories are fallible. This is clever - it prevents the denominator from collapsing to P(E)=1.

  The redundancy requirement (point 5) shows good theoretical instincts - they want to avoid giving credit to trivial restatements. That's essentially demanding that H provides novel explanation beyond existing theories.

  Looking for tensions... The main crack is between their solution (P(E|~H)<1) and how ~H is defined. In standard Bayesian terms, ~H is a catch-all for "not H", which includes the existing theory T that already explains E. But if T is part of ~H, and T perfectly predicts E, then P(E|~H) might still approach 1 through T's contribution.

  The severity ranking would be:
  1. Defining ~H properly (most critical)
  2. Justifying P(E|~H)<1 rigorously
  3. Integrating the redundancy requirement
  4. Their anti-IBE stance (least problematic)

  The cheapest revision would be to refine ~H - perhaps decomposing it into explicit alternatives including the old theory T. Then P(E|~H) becomes an average of P(E|T) and P(E|other alternatives). Since T explains E well, P(E|T) is high, but if we assign non-zero probability to T being wrong, P(E|~H) could dip below 1.

  The user seems analytically sharp - they've identified all the right pieces but might need help seeing how they interlock. Their resistance to IBE suggests they value formal rigor, so the solution should stay within probability theory. The historical context they mention (Newton vs Einstein) shows they want real-world applicability.

  What they might not have considered is how to operationalize "fallibility" of existing theories probabilistically. That's where the technical work lives - assigning priors to T being incorrect despite its success. But their core intuition is sound: old evidence can confirm if the new theory exposes weaknesses in the old explanation.
answer: |-
  Based on your points, here's a breakdown of the tensions, their severity, the "cracks," and potential revisions, ranked by severity:

  ### Ranking of Tensions (Most Severe First)
  1.  **Point (4) vs. Standard Bayesian ~H Definition (Severity: Critical)**
      *   **The Crack:** `P(E|~H)` isn't a monolithic probability. `~H` ("not H") is a *disjunction* of *all possible alternatives to H*. Crucially, this includes the *existing successful theory* (T_old, e.g., Newtonian gravity + auxiliary hypotheses) that *already entails E* (or makes E extremely probable). If T_old is part of `~H`, and we *knew* T_old before formulating H (GR), then `P(E | T_old) ≈ 1`. Since T_old ⊂ ~H, `P(E | ~H)` *must* be at least as high as `P(E | T_old) * P(T_old | ~H)`, which is very close to 1 if we initially had high credence in T_old. Your claim that "the pre-existing theory... is itself fallible" lowers `P(E | ~H)` doesn't directly address this. Fallibility means `P(E | T_old) < 1` *is possible*, but for evidence T_old *already explained perfectly* (like Mercury's anomaly under Newton+auxiliaries), `P(E | T_old)` was effectively **treated as 1** before H was conceived. The problem is that `P(E | ~H)` *inherits* this high probability from T_old ⊂ ~H.
      *   **What Has to Give:** You must **reject the standard definition of `~H` as simply "not H"** in the context of old evidence. You need a way to *re-evaluate* `P(E | ~H)` *after learning H*, specifically conditional on H being proposed *as a competitor* to T_old for explaining E. This often involves **counterfactually reasoning** about what our credence in E *would have been* if we didn't know E but *also* didn't believe the specific old theory T_old that explained it. (This is the core of the "historicist" or "counterfactual" solution).

  2.  **Point (5) vs. Point (4) Implementation (Severity: High)**
      *   **The Crack:** Point (5) is crucial ("H must do something T_old can't"). But Point (4) as stated ("P(E|~H) < 1 because T_old is fallible") doesn't inherently connect to *why* H is better. It only makes `P(E|~H)` slightly less than 1. The *strength* of confirmation (the likelihood ratio) depends on *how much larger* `P(E|H)` is than `P(E|~H)`. If `P(E|H) = 1` (GR entails the anomaly) but `P(E|~H) = 0.999` (because T_old is fallible but still *very* good), the ratio is only ~1.001 – negligible confirmation. This fails to capture the *strong* confirmation Mercury provided GR. Your Point (5) demands H offers something *new*; Point (4) alone doesn't ensure this translates into a *significant* likelihood ratio advantage over the catch-all `~H`. There's a tension between using the broad `~H` and getting a ratio large enough to reflect H's *explanatory superiority* over T_old specifically.
      *   **What Has to Give:** You need to **integrate the comparison to T_old directly into the likelihood assessment**. Simply lowering `P(E|~H)` marginally via fallibility isn't sufficient. Solutions often involve:
          *   **Conditionalizing on Background Knowledge (K) minus T_old:** Evaluate `P(E | H & K_{-T_old})` vs. `P(E | ~H & K_{-T_old})`, effectively removing the *specific* explanatory power of T_old from the background. This makes `P(E | ~H & K_{-T_old})` potentially much lower than 1.
          *   **Focusing on the Contrast with T_old:** Frame the confirmation relative to the *change* from T_old. If H explains E *where T_old failed* (or required awkward auxiliaries), then `P(E | H)` should be seen as high *despite the failure of T_old*, while `P(E | ~H)` reflects the probability of E *given that T_old (or something like it) is the best available*, which might be lower than T_old's original standalone probability.

  3.  **Point (1) Likelihoodism vs. Handling Old Evidence (Severity: Medium-High)**
      *   **The Crack:** Strict likelihoodism (confirmation *only* via likelihood ratio) struggles inherently with old evidence *because* `P(E) = 1` (known evidence). The standard Bayesian *incremental confirmation measure* is `P(H|E) / P(H) = P(E|H) / P(E)`. If `P(E)=1`, this ratio is always 1 – *no* confirmation, regardless of `P(E|H)` or `P(E|~H)`. Your solution focuses on making `P(E|~H) < 1`, but this doesn't directly solve the `P(E)=1` problem for the standard ratio. Likelihoodists sometimes argue the ratio `P(E|H)/P(E|~H)` *itself* is the confirmation measure, independent of `P(E)`. However, justifying why this ratio is meaningful when E is certain (`P(E)=1`) and already explained is tricky. The tension is between the pure likelihood ratio definition and the fact that old evidence seems to provide no *new* probabilistic *surprise*.
      *   **What Has to Give:** You must **explicitly adopt the likelihood ratio *as* the confirmation measure**, defending its use even when `P(E)=1`. This requires arguing that the ratio captures explanatory power or *what the probability of E *would have been** before E was known, *if we had considered H*. This leans into the counterfactual/historicist approach mentioned in tension #1. Alternatively, you might need to *slightly* relax strict likelihoodism to allow counterfactual credence assignments.

  4.  **Point (3) (Anti-IBE) vs. Point (5) (Redundancy) (Severity: Low-Medium)**
      *   **The Crack:** Point (5) ("H must do something T_old can't") sounds suspiciously like a theoretical virtue (explanatory power, non-redundancy) often central to IBE. You want to solve this within probabilism, but the *reason* H gets credit is precisely because it provides a *better explanation* than T_old for E. This seems like IBE *creeping in the back door*.
      *   **What Has to Give / Why it's Manageable:** This tension is more apparent than real. **Probability can capture explanatory power.** A hypothesis H explains E better than T_old precisely if `P(E | H & K_{-T_old})` is significantly higher than `P(E | T_old & K_{-T_old})` (or `P(E | ~H & K_{-T_old})`). The probabilistic framework *subsumes* the intuition behind IBE here. The "non-redundancy" requirement (Point 5) is enforced probabilistically by structuring the background knowledge (`K_{-T_old}`) and the likelihood comparison to ensure H isn't just restating T_old. You *can* maintain Point (3) – the solution is probabilistic, even if it *models* the explanatory advantage. No need to give up Point (3) or Point (5); instead, show how Point (5) is *implemented* probabilistically via the careful structuring of likelihoods and background knowledge.

  ### Summary of the Cheapest Revisions & Path Forward
  1.  **Core Revision:** **Abandon the standard catch-all `~H` for old evidence.** Adopt a **counterfactual/historicist approach**. The key move is to evaluate the likelihoods relative to a state of background knowledge (`K*`) that either:
      *   **Excludes knowledge of E itself:** What would `P(E | H, K)` and `P(E | ~H, K)` have been *before* E was known? (Standard historicist).
      *   **Excludes the *specific* explanatory success of T_old:** What is `P(E | H, K_{-T_old})` vs. `P(E | ~H, K_{-T_old})`? Here `K_{-T_old}` includes the *phenomenon* and other knowledge, but *not* the fact that T_old successfully explained E. This makes `P(E | ~H, K_{-T_old})` genuinely uncertain, reflecting the pre-T_old (or post-T_old-failure) expectation for E.
  2.  **Integrate Point (5):** Frame the counterfactual specifically to **highlight H's advantage over T_old**. The low `P(E | ~H, K*)` (in your revised framework) should stem from the inadequacy of T_old (or T_old-like alternatives within `~H`) to explain E *without the auxiliaries H renders unnecessary* or *in the specific way H does it*. This directly links the probabilistic gain to H's novel explanatory contribution.
  3.  **Clarify the Confirmation Measure:** Explicitly state that confirmation is measured by the **likelihood ratio** `P(E | H, K*) / P(E | ~H, K*)` **evaluated under the relevant counterfactual/historically informed background `K*`**, even if `P(E | Actual Background K) = 1`. Defend this as capturing the *probabilistic strength of the explanation H provides for E relative to the alternatives available before H (or without T_old's specific success)*.
  4.  **Refine Point (4):** Instead of simply asserting `P(E|~H) < 1` due to fallibility (which is true but insufficient), **base the low `P(E | ~H, K*)` on the counterfactual scenario (K*)**. In `K*`, T_old's specific success in explaining E is not assumed, so `P(E | T_old, K*)` might still be high, but `P(E | ~H, K*)` (which includes many alternatives *besides* T_old) could be much lower. The fallibility of T_old justifies why we *consider* `K*` scenarios where T_old isn't taken as fully successful.

  **Conclusion:** Your core intuition (Points 4 & 5) is correct and points towards the standard counterfactual/historicist solution within Bayesianism. The main crack is the **definition of `~H` and background knowledge `K`** (Tensions #1 & #2). The cheapest revision is to adopt a **counterfactual background `K*`** that excludes either knowledge of E or the specific explanatory success of T_old, allowing `P(E | ~H, K*)` to be meaningfully less than 1 and capturing H's novel explanatory contribution (Point 5). This maintains your commitment to probabilism (Point 3) and the likelihood ratio (Point 1) while solving the old evidence problem (Point 2). Focus your write-up on rigorously defining `K*` and justifying the counterfactual likelihood assessments.
