prompt: |-
  I am a doctoral student in the philosophy of physics, and for the past two years I have been recording the verdicts my supervisor issues whenever our seminar poses her the same standing question about some new theoretical posit: should a realist take ontological commitment to this item, or is it surplus to what the theory licenses? Her answers to date:

  - The luminiferous ether in Fresnel's account of light: no commitment to the medium, but full commitment to the equations describing light as a transverse wave. Those equations, on her telling, are what carried across into Maxwell's theory; the mechanical medium did not.
  - Absolute simultaneity in Newtonian mechanics: no commitment. It is undetectable even within the theory that posits it, and the successor theory dispenses with it altogether.
  - The Minkowski interval in special relativity: commitment. Every admissible frame agrees on it.
  - The electromagnetic field tensor: commitment. The separate electric and magnetic three-vectors receive only a qualified assent, and then solely as components of that tensor, never as free-standing entities.
  - The vector potential: no commitment to the potential, which can be shifted at will; commitment to the closed-loop phase factor that the Aharonov–Bohm arrangement registers in regions where the field tensor vanishes.
  - Individual points of the manifold in general relativity: no commitment. Two models related by a diffeomorphism are, for her, two descriptions of a single physical situation, so a bare point has no identity apart from the fields defined on it. Commitment goes instead to the diffeomorphism-invariant content of the metric field.
  - The quantum state of an individual system: she declines to rule, and has said twice that this case differs in kind from the others because there is as yet no successor theory against which to test what survives.

  The case I intend to put to her next is constructed on the model of holographic duality. Suppose a candidate quantum-gravity theory admits two exactly dual formulations. Formulation B is a quantum field theory containing no gravity, defined on a fixed background of one dimension fewer. Formulation G is a gravitational theory on a spacetime with one additional dimension, whose bulk geometry is dynamical. The dictionary between them is exact: neither formulation yields a prediction the other fails to yield. Every quantity of G has a counterpart in B, but typically a drastically nonlocal one. In particular, a local scalar field in the bulk corresponds under the dictionary to a nonlocal composite of B's operators, and the smooth bulk geometry as such has no simple counterpart in B at all — it materialises only within a specific limiting regime of B.

  Please address the following. First, predict her verdict on three sub-questions: whether we should commit to the bulk spacetime geometry; to the local bulk scalar field; and to the ontology of the boundary formulation — its operators, its states, and its fixed background geometry. Second, set out the principles that her recorded verdicts are jointly consistent with. I have three candidates in mind — commit only to what is invariant under the theory's own gauge and symmetry group; commit only to what survives the transition into a successor theory in the relevant limiting regime; commit only to what plays an ineliminable part in the theory's structural explanations — and I expect I am missing others. State for each surviving candidate what it implies about the three sub-questions, and note explicitly where the candidates come apart. Third, commit to a best guess about what she will actually say, with your reasons for preferring one candidate over the rest, together with a candid account of which parts of the record genuinely underdetermine the outcome. Fourth, name one further case — a real or invented posit, described in enough detail that I can put it to her verbatim — that would most sharply discriminate between the principles that survive her record, and say what each of those principles would say about it.

  Two constraints on your answer. I am not asking for a general defence or critique of structural realism, nor for a survey of the division between its epistemic and ontic versions; the deliverable is a prediction about this person's verdicts and the reasoning that reaches it. And please give me no references, bibliography, or reading list — I want the argument, not the citations.
reasoning: |-
  Hmm, this is a fascinating challenge from a doctoral student in philosophy of physics. They've presented their supervisor's historical verdicts on ontological commitment across various physics cases and want me to predict her response to a holographic duality scenario. 

  First, I need to carefully analyze the supervisor's pattern from those seven cases. Her rejections seem tied to three themes: non-invariance (like absolute simultaneity), dispensability in successor theories (like the ether), and lack of explanatory necessity. Her commitments cluster around invariant quantities (Minkowski interval), irreducible structures (EM tensor), and empirically accessible constructs (Aharonov-Bohm phase). The quantum state abstention is particularly telling - she clearly values successor theories as arbiters.

  For the holographic duality case, the boundary theory B seems privileged: it's fundamental, non-gravitational, and contains all physical information. The bulk geometry G appears derivative - emerging only in limits via nonlocal boundary equivalents. This mirrors how she treated the ether (equations real, medium surplus) and manifold points (fields real, points not). 

  I'd predict:
  1) No commitment to bulk geometry - it's not fundamental
  2) Qualified no to the bulk scalar field - it's just a nonlocal boundary operator
  3) Full commitment to boundary ontology - it's the irreducible basis

  Now for principles. Her record supports:
  - Invariance principle (gauge/symmetry invariance)
  - Successor survival principle
  - Explanatory indispensability principle

  These converge on rejecting bulk geometry but diverge on the scalar field. Invariance might accept it if gauge-invariant; successor survival would reject it as emergent; explanatory indispensability could go either way. 

  My best guess is she'll prioritize the successor survival principle, given how she leaned on historical continuity in ether/Maxwell case. The boundary theory is more "fundamental" in the dual pair, making bulk entities candidates for elimination in future understandings. 

  To discriminate between principles, I propose a case with gauge-invariant but explanatorily dubious entities: say, a center-of-mass coordinate in Newtonian mechanics that's measurable but adds no explanatory power beyond particle positions. Invariance would commit; explanatory indispensability would reject; successor survival might be neutral. This would force her to show her hand.

  The quantum gravity case is genuinely underdetermined regarding the scalar field - her record contains tension between invariance requirements (EM tensor) and successor-based dispensability (ether). Her choice here will reveal whether she prioritizes mathematical invariance or fundamentality in her ontology.
answer: |-
  Based on your supervisor's recorded verdicts and their underlying logic, here is a systematic breakdown addressing your four requests:

  ### 1. Predicted Verdicts for Holographic Duality
  - **Bulk spacetime geometry:** *No commitment.* The geometry is emergent only in a specific limit of the boundary theory (B), lacks a direct counterpart in B, and is not fundamental. This mirrors her rejection of the luminiferous ether (emergent/not fundamental) and manifold points (non-intrinsic/diffeomorphism-variant).  
  - **Local bulk scalar field:** *No commitment.* It corresponds to a *nonlocal* composite in B, making it derivative and non-fundamental. This parallels her rejection of the vector potential (gauge-variant) and the separate E/B fields (non-tensorial).  
  - **Boundary ontology (operators, states, fixed background):** *Full commitment.* B’s operators and states are the fundamental, non-gravitational entities that encode all physical content. The fixed background is indispensable to B’s formulation and predictions, akin to her commitment to the EM field tensor (fundamental structure) and Minkowski interval (frame-invariant).  

  ### 2. Principles Consistent with Her Verdicts
  Her judgments align with three principles:  
  - **Principle 1 (Invariance):** Commit only to what is invariant under the theory’s gauge/symmetry transformations.  
  - **Principle 2 (Successor Survival):** Commit only to what survives transition to a successor theory in the relevant limit.  
  - **Principle 3 (Explanatory Indispensability):** Commit only to what plays an ineliminable role in the theory’s structural explanations.  

  **Application to holographic duality:**  
  - *Bulk geometry:*  
    - P1 (Invariance): **Reject** – Diffeomorphism invariance in G undermines bare geometry.  
    - P2 (Successor Survival): **Reject** – Bulk geometry doesn’t survive to B; B is more fundamental.  
    - P3 (Explanatory Indispensability): **Reject** – Emergent; B explains without it.  
  - *Bulk scalar field:*  
    - P1: **Ambiguous** – If gauge-invariant in G, P1 *might* commit; but nonlocality in B undermines this.  
    - P2: **Reject** – Reduced to nonlocal composite in B.  
    - P3: **Reject** – Explanatorily redundant; B’s operators suffice.  
  - *Boundary ontology:*  
    - P1: **Commit** – Operators/states are invariant in B’s framework.  
    - P2: **Commit** – B is the fundamental formulation; any successor must recover it.  
    - P3: **Commit** – Ineliminable for B’s predictions/explanation.  

  **Where principles diverge:**  
  - The bulk scalar field is the key divergence point. P1 (if emphasizing *mathematical* invariance in G) could tentatively support commitment, but P2/P3 clearly reject it. Her rejection of the vector potential (gauge-variant) suggests P1 alone isn’t sufficient if the entity is eliminable (P2/P3).  
  - P2 and P3 converge strongly against bulk entities but differ in emphasis: P2 relies on inter-theoretic continuity, while P3 focuses on intra-theoretic explanatory role.  

  ### 3. Best Guess for Her Actual Verdict  
  **Prediction:** She will reject commitment to *all* bulk entities (geometry and scalar field) and fully commit to the boundary ontology.  

  **Reasoning:**  
  - **P2 (Successor Survival) is dominant:** Her verdicts on the ether (surviving equations, not medium) and absolute simultaneity (dispensable in relativity) show she prioritizes continuity with successor theories. Here, B is the "fundamental" formulation; bulk entities are emergent and fail to survive reduction to B.  
  - **P3 (Explanatory Indispensability) reinforces this:** Bulk entities are derivative constructs of B’s nonlocal operators, echoing her view of manifold points (fields are real, points are not).  
  - **Why not P1?** While invariance is necessary (e.g., Minkowski interval), it’s insufficient alone. She rejected the vector potential despite gauge-invariant *effects* (Aharonov-Bohm phase), showing that eliminability (P2/P3) overrides invariance.  
  - **Underdetermined elements:**  
    - *Quantum state abstention*: Her refusal here (due to no successor theory) highlights her reliance on P2. Since holographic duality *has* a "successor" (B), P2 applies decisively.  
    - *EM tensor vs. E/B fields*: Her qualified commitment to E/B fields as *components* suggests that if the bulk scalar were a necessary *aspect* of a boundary invariant (like the phase factor), she might grant limited assent. Here, it is fully nonlocal and reducible, so no.  

  ### 4. Discriminating Case: "Fiber Bundle Connection"  
  **Case description:**  
  *Consider a gauge theory where the connection \(A_\mu\) on a fiber bundle is mathematically necessary to formulate the theory covariantly, but all physical predictions depend only on its holonomy (Wilson loops). The connection is gauge-dependent and not directly measurable, but the holonomy is gauge-invariant and encodes all observable phase effects. Should a realist commit to the connection itself, or only to the holonomy?*  

  **What each principle implies:**  
  - **P1 (Invariance):** Reject the connection (gauge-variant); commit only to the holonomy (gauge-invariant).  
  - **P2 (Successor Survival):** Reject the connection. If a future theory (e.g., lattice gauge theory) dispenses with \(A_\mu\) and uses only loops, the connection doesn’t survive.  
  - **P3 (Explanatory Indispensability):** Ambiguous. The connection may be explanatorily necessary *mathematically* (to derive the holonomy), but not physically (if predictions use only loops).  

  **Why it discriminates:**  
  - P1 and P2 align in rejecting the connection, but P3 *might* support commitment if mathematical explanation is deemed essential (paralleling her view of the EM tensor’s necessity over E/B fields). If she rejects commitment, P3 is subordinate to P1/P2. If she commits, P3 dominates.  
  - This directly tests her treatment of "mathematical intermediaries" like the vector potential (which she rejected) vs. the EM tensor (which she endorsed).  

  **Summary:** Her verdicts reveal a hybrid of P2 (Successor Survival) and P3 (Explanatory Indispensability), with P1 as a necessary but insufficient condition. Holographic duality’s bulk lacks both invariance *and* survival, so rejection is predictable. The fiber bundle case would force a choice between explanatory necessity and eliminability.
