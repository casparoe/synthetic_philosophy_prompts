prompt: |-
  As a longtime reader of LessWrong and related forums, I find textbook appeals to diminishing marginal utility an unsatisfying dissolution of the St Petersburg game, where a fair coin is tossed until the first heads on toss n pays £2^n. Please rank the following four decision rules from most to least defensible for an agent of finite wealth who will face many independent gambles across a lifetime: maximise expected monetary value, maximise expected logarithmic utility of wealth, maximise the time-average growth rate, and follow prospect-theoretic probability weighting. Give each rule a score out of 10 for its handling of the classic game, with a sentence of justification for each score. Then state briefly whether your ranking would shift for either of these two variants I keep returning to: (1) the prize is paid in years of healthy life rather than pounds, and (2) you cannot buy entry directly but may sell a transferable ticket that commits whoever holds it to play at the stated price. Close with a one-sentence verdict on which rule a rationalist should actually internalise.
reasoning: |-
  Okay, the user is deeply familiar with LessWrong and the St. Petersburg paradox, so they're looking for a sophisticated analysis. They want a ranking of four decision rules for handling this paradox, with scores and justifications. Then they have two variants to consider: one where the prize is in healthy life years, and another involving transferable tickets. Finally, they want a one-sentence verdict on which rule a rationalist should internalize.

  First, I need to recall the St. Petersburg paradox. It's a game where a fair coin is tossed until heads appears on the nth toss, and the payout is £2^n. The expected monetary value is infinite, but no one would pay a large amount to play, which is the paradox. The user finds diminishing marginal utility unsatisfying as a solution, so I should consider other approaches.

  The four decision rules are:
  1. Maximize expected monetary value (EMV)
  2. Maximize expected logarithmic utility of wealth (Kelly)
  3. Maximize time-average growth rate (which is similar to Kelly)
  4. Prospect-theoretic probability weighting (from behavioral econ)

  For a finite wealth agent facing many independent gambles, I need to rank these from most to least defensible. The Kelly criterion is often recommended for repeated bets because it maximizes long-term growth. EMV fails here because it ignores bankruptcy risk. Time-average growth rate is essentially the same as Kelly in this context. Prospect theory incorporates cognitive biases like overweighing small probabilities, which might not be rational.

  Scoring each out of 10 for the classic game:
  - EMV: Gets a 0 because it suggests paying any finite price, leading to ruin.
  - Kelly: Scores high because it accounts for wealth and avoids ruin, offering finite prices.
  - Time-average growth: Same as Kelly, so same score.
  - Prospect theory: Lower score because while it explains behavior, it's not prescriptive.

  For the variants:
  1. Prize in healthy life years: Utility isn't linear, and you can't relive years. Kelly might not apply directly. EMV still fails. Prospect theory might handle the subjective value better.
  2. Transferable ticket: This introduces a market. Selling the ticket could be optimal, so Kelly might not capture the resale value. EMV could be viable if you can sell high.

  The user's deeper needs: They want a robust, rational framework that avoids traditional pitfalls. They might be exploring alternatives to standard utility theory, seeking something that works in various scenarios, including market contexts. The final verdict should guide them towards a rule that's both theoretically sound and practical for real-life decisions, especially for a rationalist.
answer: |-
  ### Ranking of Decision Rules (Most to Least Defensible for Repeated Gambles)

  1.  **Maximise the time-average growth rate (Kelly criterion)**  
      *Score for classic game:* 10/10  
      *Justification:* Optimizes long-term wealth growth by maximizing expected logarithmic utility, assigning a finite entry price (≈ current wealth) that avoids ruin while exploiting repeated opportunities.

  2.  **Maximise expected logarithmic utility of wealth**  
      *Score for classic game:* 9/10  
      *Justification:* Equivalent to Kelly in repeated games, but loses one point for less explicit emphasis on asymptotic growth; still resolves the paradox with a finite bid (e.g., £20 for £10,000 wealth).

  3.  **Follow prospect-theoretic probability weighting**  
      *Score for classic game:* 4/10  
      *Justification:* Explains why humans underbid (by overweighting tiny probabilities of huge gains), but is descriptive/irrational; fails to prescribe optimal behavior for repeated play.

  4.  **Maximise expected monetary value (EMV)**  
      *Score for classic game:* 0/10  
      *Justification:* Demands infinite bids for unbounded EV, ensuring bankruptcy; indefensible for finite agents facing repeated gambles.

  ---

  ### Ranking Shifts for Variants

  -   **Variant (1): Prize in healthy life years**  
      Kelly/time-average growth becomes *less* defensible (utility of life-years isn't multiplicative/log-linear). Prospect theory gains ground (humans treat life non-linearly), but EMV remains indefensible. **Shift:** Prospect theory > Kelly ≈ EMV (though all flawed).  

  -   **Variant (2): Sellable transferable ticket**  
      EMV becomes *more* defensible—market pricing reflects others' risk tolerance, enabling profitable exit without playing (e.g., sell at EMV-discounted price). Kelly still works but undervalues resale. **Shift:** EMV ≈ Kelly > prospect theory.

  ---

  ### Verdict for a Rationalist  
  **Internalise maximising the time-average growth rate (Kelly criterion)**, as it robustly compounds wealth across repeated opportunities while avoiding ruin.  

  *Rationale:* Kelly optimally balances growth and survival for repeated independent gambles—the core of lifelong rationality—whereas EMV guarantees self-destruction, prospect theory codifies bias, and log-utility merely approximates Kelly.
