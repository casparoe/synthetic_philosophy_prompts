  Okay, the user is a linguistics MA student who stumbled upon a cognitive science reading group. They're grappling with a conceptual puzzle from an animal communication session about alarm calls. The core issue is how to determine what a monkey's alarm call actually refers to—is it the sensory input (dark shape), the predator (eagle), or the behavioral response (climb tree)? They feel this isn't just standard underdetermination and suspect there's a named problem with established solutions. 

  Hmm, their description is remarkably precise—they've perfectly captured the ambiguity between proximal stimuli, distal objects, and functional responses. The leaf example is especially sharp: if a false alarm to a leaf means the state was "about" leaves, that feels wrong, but why? They're also rightly skeptical of circular "it's about what it's for" answers. 

  Ah! This screams **teleosemantics** territory. The user is essentially describing the problem of **indeterminacy of content** in naturalistic theories of representation. Millikan's biosemantics comes to mind immediately—her "proper function" framework directly addresses why the eagle case is privileged over the leaf despite identical sensory input. 

  Wait, they mention Quine's rabbit/undetached rabbit parts issue. Good connection! The difference is key: Quine's is about ontological relativity in translation, while this is about fixing representational content in evolved systems. Quine doesn't have an evolutionary teleology hammer. 

  The user's skepticism about "moving the bump in the carpet" is valid. Teleosemanticists do face challenges—like how precisely to define "normal conditions" for function (what if leaves often fall in that environment?). Dretske's covariance plus learning history might handle edge cases better. 

  ...They'd probably appreciate Fodor's critique too—his "disjunction problem" is exactly this leaf/eagle dilemma! Fodor thinks teleosemantics fails here, which shows the debate is alive. Might mention that as a counterpoint. 

  For practical resolution: emphasize that cognitive scientists often use *converging evidence*—not just behavior but neurobiology (e.g., does the monkey's amygdala fire differently for eagles vs. leaves?) and evolutionary context. The leaf mistake is "noise" precisely because it doesn't trigger the full predator-response cascade. 

  ...Should warn them that no solution is universally accepted. But for their purpose, "indeterminacy of content" + "teleosemantics" are the labels they need, with Millikan/Dretske as go-to theorists. The widening problem intuition points squarely to teleofunction.
answer: |-
  Your intuition is spot-on—this **is** a named problem with deep roots in philosophy of mind and cognitive science. The core issue is the **indeterminacy of mental content** (or **indeterminacy of representation**), specifically arising in **naturalistic theories of meaning**. Here's the breakdown:

  ### 1. **The Name(s)**
     - **Disjunction Problem** (Jerry Fodor's term):  
       If a mental state is triggered by both eagles *and* leaves, is it about eagles, leaves, or the disjunction *eagles-or-leaves*?  
     - **Hard Problem of Content** (Fred Dretske, Ruth Millikan):  
       How do internal states "lock onto" specific external objects/facts, given noisy sensory inputs?  
     - **Teleosemantic Indeterminacy**:  
       When invoking biological function to fix meaning, ambiguities persist.  

  ### 2. **The Problem vs. Quinean Underdetermination**
     - **Quine's "Gavagai"** (rabbit/undetached rabbit parts):  
       Concerns *translation* between languages—ambiguity in *interpreting utterances*. The evidence underdetermines which *concept* a speaker refers to.  
     - **Your Alarm-Call Problem**:  
       Concerns *what a mental state represents* in the first place. Even with full neural/behavioral data, we can't fix whether the state is about:  
       - Proximal stimulus (dark shape)  
       - Distal object (eagle)  
       - Behavioral instruction ("climb!")  
       - Ecological affordance ("danger-from-above")  
       *This is a problem of metaphysics, not epistemology.*

  ### 3. **The Standard Way Out: Teleosemantics**  
     Pioneered by **Ruth Millikan** and **Karen Neander**, teleosemantics argues:  
     > **What a state represents is determined by its *proper function*—what it was *selected by evolution* to do.**  

     - **Why it’s not (entirely) circular**:  
       Functions are defined historically: a state's function is the effect it produced that caused natural selection to favor it.  
       - *Eagle alarm call*: Selected because it promoted survival when eagles attacked.  
       - *Leaf false alarm*: A performance error; not what the mechanism was *for*.  

     - **The Carving**:  
       - **Normal conditions**: The state represents eagles because, under *evolutionarily normal conditions*, dark shapes overhead *were* eagles.  
       - **Mistakes**: Representational systems can misfire (leaf triggers "eagle!"), but errors don’t redefine content.  

  ### 4. **Why This Isn't Just "Moving the Bump"**  
     - **Teleosemantics narrows the options**:  
       Content is fixed by *selection history*, not current usage or statistics.  
       - The state isn't "about" climbing because selection acted on *predator detection*, not climbing *per se* (climbing might be context-dependent).  
       - It’s not "about" dark shapes because the function was avoiding *eagles*, not representing photons.  

     - **But Can We Broaden the Function?**  
       Yes—this is the "grain problem". Example:  
       - Is the call’s function "avoid eagles" or "avoid aerial threats"?  
       Millikan replies: Look at the mechanism’s *evolutionary explanation*. If snakes/leopards triggered distinct responses, the function is eagle-specific. If all overhead threats triggered one response, it’s coarser-grained.  

  ### 5. **Major Objections & Refinements**
     - **Fodor's Critique**:  
       Teleosemantics can't distinguish:  
       - Representing *eagles* vs. *eagles-or-leaves-in-normal-conditions*.  
       (Millikan: Evolution selects for reliability; "eagle-or-leaf" isn’t a *real category* in the world.)  
     - **Dretske's Learning-Based Solution**:  
       Content is fixed during a state’s *acquisition period*. If the monkey learns "dark shape = eagle" during evolution, errors don’t count.  
     - **Neural/Behavioral Constraints**:  
       If the monkey’s brain processes eagles/leaves differently (e.g., eagle shapes trigger amygdala activation; leaves don’t), we infer distinct content.  

  ### 6. **Practical Resolution in CogSci**
     Cognitive scientists combine:  
     - **Teleofunctions** (evolutionary role)  
     - **Causal covariance** (state reliably correlates with eagles under *optimal conditions*)  
     - **Downstream effects** (does the call specifically prepare for *aerial* threats? e.g., looking up vs. down)  
     - **Error patterns** (if monkeys ignore falling leaves after learning, content is not "dark shapes")  

  ### Why Your Leaf Example is Key
  When the monkey mistakes a leaf for an eagle:  
  - **Teleosemantics**: It falsely represents *an eagle* (because that’s the function).  
  - **Causal theories**: It represents whatever reliably causes it (but leaves sometimes cause it).  
  - **Pragmatic view**: The content is fixed by how *other monkeys interpret it* (they scan the sky, not inspect leaves).  

  **In short**: The problem is real and unresolved, but teleosemantics is the dominant framework for addressing it. It avoids circularity by anchoring content in evolutionary history, not current dispositions. The best entry points are Millikan's *Language, Thought, and Other Biological Categories* (1984) or Neander’s *Teleological Theories of Mental Content* (2012). For a critique, see Fodor’s *A Theory of Content, II* (1990).  

  Still uneasy? That’s philosophy! But this gives you the boundaries and tools to engage.
