  ### Decision Tree: Compulsory Military Service in a Democratic State  
  *Start at the root (Question 1). Answer each question to reach a leaf position. Each leaf names a position (or is marked "unnamed") and includes one sentence on its most awkward commitment.*  

  ---

  #### **Question 1: May the state compel military service?**  
  - **No** → **Liberal Individualism**  
    *Awkward commitment: Must accept that an all-volunteer force disproportionately burdens the economically vulnerable, even if this creates a "poverty draft."*  
  - **Yes** → Proceed to Question 2.  

  #### **Question 2: Is the primary justification for compelling service military effectiveness (winning wars) or civic/political goals (e.g., fairness, deterrence)?**  
  - **Military effectiveness** → Proceed to Question 3.  
  - **Civic/political goals** → Proceed to Question 4.  

  #### **Question 3 (Military effectiveness): Does this justification collapse if a professional army could defend the state equally well?**  
  - **Yes** → **Contingent Militarism**  
    *Awkward commitment: If a professional army proves as effective, conscription becomes indefensible, potentially risking national security during transition.*  
  - **No** → **Reserve Necessity**  
    *Awkward commitment: Requires lifelong peacetime obligations (e.g., Swiss/Finnish militia models), sacrificing individual autonomy for perpetual readiness.*  

  #### **Question 4 (Civic/political goals): Is the core goal fair burden-sharing or deterring reckless wars by making the public bear the cost?**  
  - **Fair burden-sharing** → Proceed to Question 5.  
  - **Deterring reckless wars** → **Democratic Deterrence**  
    *Awkward commitment: May compel service even in low-threat scenarios solely to sustain public aversion to war, wasting human capital.*  

  #### **Question 5 (Fair burden-sharing): Should the burden be distributed universally?**  
  - **Yes** → **Civic Republicanism**  
    *Awkward commitment: Forces all young citizens (e.g., via universal service) to sacrifice years of life, treating time as a tax payable to the state.*  
  - **No** → **Fair Lottery**  
    *Awkward commitment: Arbitrarily selects a small group (via no-deferment lotteries) to bear extreme risks while others benefit freely.*  

