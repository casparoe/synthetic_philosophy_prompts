prompt: |-
  Two grad students in my epistemology seminar got into it about disjunctivism and the argument from illusion. One (Sam) was defending the argument from illusion. She said: it's conceivable that I'm in a hallucination exactly like my current experience of seeing a red cube, so there has to be some mental state common to both the seeing case and the hallucination case -- otherwise, since I can't tell the difference from the inside, there'd be no fact of the matter about which case I'm in. The other (Riley) said that's exactly the mistake: in the good case I'm in a state of seeing the cube, which is a relation to the cube, and in the bad case I'm in a state of seeming to see a cube, which isn't. Those are different kinds of states, so there's no common factor, and the conceivability of the illusion doesn't force there to be one. Sam pushed back: but if the two cases are subjectively indistinguishable, how can there be a fact of the matter about which kind of state I'm in? Riley said the fact of the matter is external -- whether the cube is actually there -- and that I can't access it from the inside, but that doesn't mean it's not a fact. Sam then conceded the external fact but said that even so, my justifcation for believing I'm seeing the cube has to be the same in both cases, because I can't tell them apart, so the disjunctivist can only save the justification if they say my justification in the good case is the cube itself, which seems to beg the question. Riley said that's exactly the point: in the good case, my justification IS the cube, and that's not begging the question, it's just what justification is when you're actually in contact with the thing. I couldn't tell who was right. Can you go through their exchange and say who's right about each step, and what, if anything, both of them are missing?
reasoning: |-
  Okay, let me try to unpack this epistemology debate between Sam and Riley. The core issue revolves around disjunctivism and the argument from illusion - a classic philosophical puzzle. 

  Sam starts by defending the argument from illusion: she says since we can conceive of a hallucination identical to actually seeing a red cube, there must be some common mental state in both cases. Her reasoning is that if there were no common element, we couldn't explain why we can't distinguish the two cases subjectively. 

  Riley counters with the disjunctivist position: the "good case" (actual perception) and "bad case" (hallucination) involve fundamentally different kinds of states - one being a direct relation to an object, the other a mere seeming. They argue subjective indistinguishability doesn't require identical mental components.

  When Sam pushes back about how we can know which state we're in if they feel the same, Riley makes the externalist move: the fact is determined by the external world, not internal access. Sam then shifts to justification: if the cases are indistinguishable, justification must be the same in both. Riley's response is radical - in the good case, justification just is the cube itself.

  Hmm... both make valid points but miss nuances. Sam is right about the conceivability argument having intuitive force, but wrong in assuming indistinguishability requires identical mental states. Riley correctly distinguishes the metaphysical nature of the states but underestimates the epistemological problem of justification symmetry. 

  The tricky part is whether Riley's "cube as justification" begs the question. In foundationalist terms it doesn't - direct awareness can be non-inferential. But Sam has a point about justification needing to be accessible, which Riley's externalism downplays. 

  This debate reveals deeper fault lines: internalism vs externalism in justification, and whether perception's nature is exhausted by its phenomenology. Neither fully addresses how we navigate the indistinguishability in practice - like why we reasonably trust perception despite knowing about hallucinations. Also missing is discussion of how disjunctivists handle degrees of justification or false positives.
answer: |-
  Let's break down Sam and Riley's exchange step-by-step, evaluating the core arguments and identifying what each might be missing. The debate centers on **disjunctivism** (defended by Riley) versus the **common-kind view** (implied by Sam's argument from illusion), with implications for perception, justification, and metaphysical facts.

  ### Step 1: Sam's Argument from Illusion
  - **Sam's Claim**:  
    *"It's conceivable that I'm hallucinating a red cube identical to a real perception. Since I can't tell the difference subjectively, there must be a common mental state in both cases. Otherwise, there'd be no fact of the matter about which state I'm in."*  
  - **Evaluation**:  
    Sam is right that hallucination and veridical perception *can be subjectively indistinguishable*. However, she **incorrectly infers** that subjective indistinguishability *requires* a metaphysically identical mental state. This conflates:  
    - **Epistemic indistinguishability** (I can't tell them apart).  
    - **Metaphysical identity** (they share an intrinsic mental component).  
    Disjunctivists reject this inference.  

  ### Step 2: Riley's Disjunctivist Reply
  - **Riley's Claim**:  
    *"The good case (seeing) is a relational state (mind-to-cube). The bad case (hallucinating) is a non-relational state (seeming). These are fundamentally different kinds of states. Conceivability doesn't force a common factor."*  
  - **Evaluation**:  
    Riley is **largely correct** here. Disjunctivism (e.g., McDowell, Snowdon) holds that veridical perception and hallucination are *metaphysically distinct*: one constitutively involves the external object, while the other does not. Subjective indistinguishability doesn't imply metaphysical sameness—it only requires that the two states *appear* identical to the subject.  

  ### Step 3: Sam's Challenge re: "Fact of the Matter"
  - **Sam's Pushback**:  
    *"If they're subjectively indistinguishable, how can there be a fact of the matter about which state I’m in?"*  
  - **Evaluation**:  
    Sam confuses **epistemic access** with **metaphysical fact**. Riley correctly notes the fact is determined *externally* (e.g., the cube’s presence). We can lack epistemic access to a fact without undermining its reality (e.g., I can’t "tell from the inside" if I’m dreaming, but that doesn’t mean there’s no fact about whether I’m awake). **Riley wins this point.**  

  ### Step 4: Sam's Shift to Justification
  - **Sam's Concession & New Challenge**:  
    *"Even if there's an external fact, my *justification* for believing I see a cube must be the same in both cases (since I can’t tell them apart). Disjunctivism can only save justification by claiming that in the good case, the cube itself justifies me—but this begs the question."*  
  - **Evaluation**:  
    Sam identifies a **genuine problem for disjunctivism**: the *symmetry of justification*. If justification is internal (dependent only on what’s accessible to the subject), then both cases *should* provide equal justification. Disjunctivists like McDowell reject this internalist constraint. Riley’s reply (that in the good case, the cube *is* the justification) isn’t question-begging—it’s **epistemological externalism**. For disjunctivists:  
    - **Good case**: Justification comes from direct perceptual contact with the cube (a factive state).  
    - **Bad case**: You lack justification because there’s no object to ground it.  
    Sam’s error is assuming justification *must* be internal. Riley’s view is consistent but radical.  

  ### Step 5: Riley's Final Move on Justification
  - **Riley's Reply**:  
    *"In the good case, my justification *is* the cube. That’s not begging the question—it’s what justification is when you’re in direct contact."*  
  - **Evaluation**:  
    Riley is **coherent but controversial**. This is a core disjunctivist/naive realist stance: perception provides immediate, non-inferential justification via direct awareness of objects. It doesn’t "beg the question" because it rejects the internalist assumption that justification requires subjective discernibility. However, this view faces the **sceptical challenge**: if indistinguishable hallucination provides no justification, how can I ever *know* I’m in the good case?  

  ---

  ### Who’s Right? A Summary
  | **Issue** | **Sam** | **Riley** | **Verdict** |
  |-----------|---------|-----------|-------------|
  | **Common Mental State?** | Wrong: Assumes indistinguishability implies metaphysical commonality. | Right: States can be distinct yet subjectively identical. | ✅ Riley |
  | **"Fact of the Matter"** | Wrong: Confuses epistemic access with metaphysical fact. | Right: The external world determines the fact. | ✅ Riley |
  | **Justification Symmetry** | Partly Right: Highlights tension for disjunctivism. | Right: Justification *can* be factive/external. | ⚖️ Mixed |
  | **Question-Begging?** | Wrong: Riley’s view isn’t circular—it’s externalist. | Right: The cube *can* be justification. | ✅ Riley |

  ---

  ### What Both Are Missing
  1. **Sam’s Blind Spot**:  
     - She assumes **internalism** about justification (justification depends only on internal states). This isn’t mandatory—externalism (like disjunctivism) offers a viable alternative.  
     - She underestimates how disjunctivism *explains* perceptual success: in the good case, you’re directly acquainted with reality, not just a "copy."  

  2. **Riley’s Blind Spot**:  
     - **The sceptical problem**: If hallucination is indistinguishable, how can we ever be *justified in believing* we’re in the good case? Disjunctivism secures factive justification but struggles to explain our *epistemic access* to that fact.  
     - **Cognitive phenomenology**: Even if states are metaphysically distinct, the *cognitive significance* of "seeming to see a cube" might be shared—a point explored in hybrid theories.  

  3. **Shared Oversight**:  
     - **Degrees of justification**: Both ignore that real-world justification is rarely all-or-nothing. We might have *defeasible* justification in the bad case (e.g., if hallucinations are rare).  
     - **Broader epistemological frameworks**: They don’t engage with alternatives (e.g., **representationalism**), which might posit a common representational content without a shared metaphysical state.  

  ---

  ### Conclusion
  Riley’s disjunctivist stance is **metaphysically and externally coherent**, winning on the common-factor debate and the "fact of the matter." Sam correctly pressures the **epistemology of justification**, but her internalist assumptions beg the question against disjunctivism. Ultimately, the dispute hinges on whether you accept **epistemological externalism** (Riley) or **internalism** (Sam). Neither is "wrong," but disjunctivism offers a robust, if challenging, alternative to the argument from illusion. The deeper lesson: subjective indistinguishability doesn’t dictate metaphysics—but it *does* constrain how we justify beliefs.
