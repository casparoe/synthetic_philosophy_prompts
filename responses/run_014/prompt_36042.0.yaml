     a) Yes: if the changes are gradual and at no point is there a sudden break, then the frog is me.  
     b) No: even with gradual changes, there is a point where I cease to exist and a frog comes into being.  

  7. **Multiple counterparts (doctor):**  
     In a possible world, there are two people who are both very similar to you and equally similar in all respects. One is a doctor and the other is not. What should we say about the statement, "I could have been a doctor"?  
