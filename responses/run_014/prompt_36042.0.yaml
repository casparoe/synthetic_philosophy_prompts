  2. **Fission-Style Lottery Case**  
     In the closest world where "you" win the lottery, there are two candidates:  
     - Candidate A shares all your memories up to the ticket purchase but has a different appearance.  
     - Candidate B shares your exact appearance and mannerisms but has different memories.  
     Neither resembles you more overall. What is the truth value of "I would have won the lottery"?  
     a) True (one candidate is clearly "me").  
     b) False (neither candidate is "me").  
     c) Indeterminate (no fact about which is "me," so the claim isn’t true or false).  

  3. **Qualitatively Symmetric World**  
     Consider a world identical to ours in every qualitative respect (same objects, properties, and events) except that you and your closest physical duplicate have swapped life histories. Is there any difference between that world and ours?  
     a) Yes: *I* live the duplicate’s life, and *they* live mine (a non-qualitative difference).  
     b) No: with no qualitative differences, the worlds are identical.  

  4. **Origin Case**  
     Imagine a person conceived from different sperm and egg cells than you, but who shares your appearance, personality, and life story. Could that person be you?  
     a) Yes: they could be me in another possible world.  
     b) No: they cannot be me, since my origin is fixed.  

  5. **Degradation Case (Frog)**  
     Could you have been a frog (a simple animal without human mental capacities)?  
