     a) True: one of them is me, so I won.  
     b) False: neither is me, so I didn't win.  
     c) Indeterminate: it's not clear which one is me, so the statement isn't clearly true or false.  

  3. **Qualitative symmetry:**  
     Imagine a world that is exactly like ours in every qualitative respect (same objects, same properties, same relations) except that you and your closest physical duplicate (who exists in that world too) have swapped all your non-qualitative properties (like being the person who has lived your life). Is there any real difference between that world and ours?  
     a) Yes: in that world, I am living the duplicate's life and vice versa — so it's a different situation for me.  
     b) No: since everything is qualitatively the same, there is no difference at all — it's the same world described differently.  

  4. **Origin essentialism:**  
     Suppose there is a person who was conceived from a different sperm and egg than you were, but who is otherwise very similar to you (same appearance, personality, etc.). Could that person be you?  
     a) Yes: if they are similar enough, they could be me in another possible world.  
     b) No: I am essentially the product of the sperm and egg that actually produced me, so that person cannot be me.  

  5. **Frog degradation:**  
     Could you have been a frog? (Assume a frog is a simple animal without complex mental states.)  
     a) Yes: in some possible world, I am a frog.  
     b) No: I am essentially a human being (or a rational animal) and cannot be a frog.  

  6. **Gradual change:**  
