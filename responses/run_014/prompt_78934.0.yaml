answer: |-
  ### Step-by-Step Procedure for Flood Readiness Recommendations

  Here’s a practical, executable procedure to convert uncertain ranges into a single benefit-cost ratio (BCR) for your committee. It handles **aleatory uncertainty** (inherent randomness, e.g., weather) and **epistemic uncertainty** (knowledge gaps, e.g., expert disagreement) differently, flags non-informative evidence, and identifies where human judgment is required. The procedure prioritizes transparency and conservatism (safety-first for public infrastructure).

  ---

  #### **Pre-Step: Frame the Problem**
  - **Define the baseline:** "Do nothing" is the default. Benefits = avoided damage/costs compared to baseline.
  - **Time horizon:** Use 50 years (standard for infrastructure). Apply discounting (e.g., 3% annual) for future costs/benefits.
  - **Ask:** "What is the worst-case, best-case, and most plausible outcome for each uncertain parameter?"

  ---

  #### **Step 1: Separate Uncertainty Types (Aleatory vs. Epistemic)**
  - **Question to ask experts:**  
    *"Is this uncertainty due to inherent randomness (aleatory) or lack of knowledge/disagreement (epistemic)?"*  
    - **Aleatory examples:** Historical storm variability, river flow randomness.  
    - **Epistemic examples:** Model disagreements, upstream development impacts.  
  - **Good enough answer:** Assign a label (A/E) to each uncertain parameter. If mixed, default to epistemic (conservative).  
  - **Write down:** A table of parameters with uncertainty type and sources.  
  - **Stop if:** >50% of key uncertainties are epistemic with high disagreement (e.g., >±30% range). Flag as "values decision" (Step 4).

  ---

  #### **Step 2: Handle Aleatory Uncertainty (Randomness)**
  - **Question:**  
    *"What probability distribution fits the data (e.g., uniform, normal)?"*  
  - **Good enough answer:**  
    - If data exists (e.g., historical storm records), fit a distribution.  
    - If no data, **assume uniform distribution** between bounds (simplest option).  
  - **Collapse to a point:** Calculate the **expected value** (mean) of the distribution.  
    - E.g., Annual flood chance between 1/80 (0.0125) and 1/400 (0.0025):  
      Uniform mean = (0.0125 + 0.0025)/2 = **0.0075**.  
  - **Write down:** The point estimate and distribution assumption.

  ---

  #### **Step 3: Handle Epistemic Uncertainty (Knowledge Gaps)**
  - **Question:**  
    *"What evidence constrains these bounds? Are experts disagreeing due to conflicting data or different interpretations?"*  
  - **Check for non-informative evidence:**  
    - **Spot it if:** Evidence is equally consistent with all hypotheses (e.g., a soil survey that doesn’t rule out any failure scenario).  
    - **Result:** Widens the range without adding information. Reject or flag as "no value."  
  - **Collapse to a point:** **Only if experts agree on a "most likely" value**. Otherwise, keep the range.  
  - **Write down:** The range, sources of disagreement, and whether evidence is informative.

  ---

  #### **Step 4: Calculate Benefits and Costs**
  - **Benefits:** Annual flood damage reduction × Discounted annuity factor.  
    - Damage = Property value × Flood depth × Vulnerability (use ranges).  
    - Reduction = Damage (without project) – Damage (with project).  
  - **Costs:** Construction + Maintenance (use point estimates if possible).  
  - **Mixed uncertainties:**  
    - Propagate aleatory point estimates and epistemic ranges through calculations.  
    - Use **interval arithmetic**:  
      - Min benefit = Min(aleatory) × Min(epistemic factors)  
      - Max benefit = Max(aleatory) × Max(epistemic factors)  
  - **Example:**  
    - Without project: Annual damage = $1M–$5M (epistemic range).  
    - With project: Annual damage = $0.2M (point estimate).  
    - Benefit = ($1M – $0.2M) to ($5M – $0.2M) = **$0.8M–$4.8M**.  

  ---

  #### **Step 5: Compute BCR and Make a Decision**
  - **BCR formula:** (Total discounted benefits) / (Total discounted costs).  
  - **For ranges:** Calculate BCR lower/upper bounds:  
    - **Min BCR** = Min benefits / Max costs (conservative).  
    - **Max BCR** = Max benefits / Min costs (optimistic).  
  - **Collapse to a point if:**  
    - **Min BCR ≥ 1.0**: Use **Min BCR** (project always viable).  
    - **Max BCR ≤ 1.0**: Use **Max BCR** (project never viable).  
    - **Min BCR < 1.0 < Max BCR**: **Do not collapse**. Flag as "values decision."  
  - **Write down:** Single BCR (if collapsed) or range (if not).

  ---

  #### **Step 6: Values Decision Protocol**
  - **Stop and escalate if:**  
    - BCR range crosses 1.0, OR  
    - High-stakes risk (e.g., loss of life possible), OR  
    >50% epistemic uncertainty.  
  - **Questions for the committee/town manager:**  
    *"How risk-averse are we? Should we prioritize worst-case safety (use Min BCR) or expected value (use midpoint)?"*  
  - **Recommendation:** Use a conservative **Min BCR** if safety-critical.

  ---

  ### Application to Your Three Options
  **Assumptions (simplified for illustration):**  
  - Discount rate: 3% (annuity factor = 25.7 for 50 years).  
  - North district property value: $100M.  
  - Flood damage: 50% of property value if flooded.  
  - "Do nothing" annual flood chance: 1/80 to 1/400 (epistemic uncertainty).  
  - "Do nothing" cost: $0. Benefit: $0. BCR: N/A (baseline).

  #### **Option 1: Raise North Levee**  
  - **Cost:** $5M (point estimate).  
  - **Benefit:**  
    - Reduces flood chance to 1/1000 (point estimate).  
    - Annual damage without project: ($100M × 50%) × [1/80 to 1/400] = $625K–$125K.  
    - Annual damage with project: ($100M × 50%) × (1/1000) = $50K.  
    - Annual benefit: ($625K – $50K) to ($125K – $50K) = $575K–$75K.  
    - Total discounted benefit: $575K×25.7 to $75K×25.7 = **$14.78M–$1.93M**.  
  - **BCR range:** Min = $1.93M / $5M = 0.39; Max = $14.78M / $5M = 2.96.  
  - **Decision:** Min BCR (0.39) < 1 < Max BCR (2.96) → **Values decision required**.  
  - **Non-intuitive insight:** Even though expected BCR is ~1.67, the worst case (0.39) fails cost-benefit. If the town is risk-averse, this option may be rejected.

  #### **Option 2: Buy Out 12 Houses**  
  - **Cost:** $3M (purchase) + $1M (demolition) = $4M (point).  
  - **Benefit:**  
    - Removes exposure for 12 houses ($0.5M each, total $6M).  
    - Creek flood chance: 1/50 to 1/100 (epistemic, higher risk).  
    - Annual damage without project: ($6M × 50%) × [1/50 to 1/100] = $60K–$30K.  
    - Annual damage with project: $0.  
    - Annual benefit: $60K–$30K.  
    - Total discounted benefit: $60K×25.7 to $30K×25.7 = **$1.54M–$0.77M**.  
  - **BCR range:** Min = $0.77M / $4M = 0.19; Max = $1.54M / $4M = 0.39.  
  - **Decision:** Max BCR (0.39) < 1 → **Collapse to BCR = 0.39**. **Not viable**.  
  - **Non-intuitive insight:** Buyouts seem "safer," but low property values and high costs make BCR <1 even in the best case.

  #### **Option 3: Do Nothing**  
  - **BCR:** N/A (baseline).  
  - **Hidden risk:** Annual expected damage = ($100M × 50%) × [0.0025–0.0125] = $125K–$625K. Over 50 years: $3.2M–$16M.  

  ---

  ### What the Procedure Can and Cannot Do
  | **Strengths**                                       | **Limitations**                                      |
  |-----------------------------------------------------|-----------------------------------------------------|
  | **✅ Handles mixed uncertainties**                   | **❌ Aleatory distributions are guesses**: Uniform dist. is arbitrary if data is scarce. |
  | **✅ Flags non-informative evidence**                | **❌ Interval arithmetic is conservative**: May over-widen ranges. |
  | **✅ Forces transparency** (write down assumptions) | **❌ Human judgment is unavoidable**: 50% of steps rely on expert calls (e.g., uncertainty typing). |
  | **✅ Stops at values decisions** (no false precision) | **❌ Small towns will struggle**: No modelers = guesses on distributions, damage curves, discount rates. |

  **Critical Judgment Points:**  
  1. Separating aleatory/epistemic uncertainty (Step 1).  
  2. Choosing distributions for aleatory variables (Step 2).  
  3. Deciding if evidence is informative (Step 3).  
  4. Setting risk tolerance for BCR crossing 1.0 (Step 6).  

  **Where Small Towns Get It Wrong:**  
  - Underestimating epistemic uncertainty (e.g., treating expert disagreement as randomness).  
  - Using midpoint BCR averages for high-stakes decisions (safety requires conservatism).  
  - Overlooking non-informative evidence (e.g., generic studies that don’t narrow uncertainty).  

  ---

  ### Final Recommendation Memo Outline
  1. **Summary:** BCR for each option (single number or range).  
  2. **Uncertainty Table:** Sources, types, and handling.  
  3. **Values Decisions:** Options needing policy input (e.g., Option 1).  
  4. **Non-Intuitive Insights:** e.g., "Buyouts fail BCR; levee requires risk tolerance."  
  5. **Limitations:** Key assumptions and expert judgments.  

  This procedure ensures defensible recommendations while openly acknowledging uncertainty. For Option 1, escalate to the committee: *"Given the BCR range (0.39–2.96), we recommend conservative approval only if safety outweighs cost risk."*
