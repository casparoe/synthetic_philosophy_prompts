  First, I need to list all necessary desiderata. The user flagged key areas, so I should categorize them into cases, distinctions, and constraints. Cases: non-integrated systems, micro-macro boundary, cosmic moral assessment. Distinctions: experience quantity, suffering vs. neutral experience, patienthood vs. agency. Constraints: physics compatibility (like indeterminism), consciousness science (e.g., IIT or unity findings).

  The user wants to know which desiderata are non-negotiable. Probably, avoiding contradiction with empirical science is a must. Also, moral relevance of experience itself seems foundational. Suffering requiring distinct treatment could be another. They also asked for jointly unsatisfiable desiderata. That's tricky. Maybe the combination of Cosmic Non-Catastrophe and moral weight scaling with complexity? Because if micro-experiences have any weight, and they vastly outnumber macro ones, the universe becomes a catastrophe unless complexity drastically reduces moral weight. But if complexity reduces weight too much, it might exclude beings we care about. That's a tension.

  Then, identifying the requirement that excludes existing candidates. The Boundary Problem seems crucial. Views like complexity-scaling or integrationism struggle with where to draw the line. Integrationism might exclude legitimate micro-experiences, while complexity-scaling faces the micro-macro boundary issue. The suffering-background view fails on avoiding cosmic catastrophe and suffering distinction.

  The user's deeper needs? They might be looking for a rigorous framework to evaluate theories, avoiding pitfalls in panpsychist ethics. They might want to ensure the theory is both philosophically sound and empirically plausible. They might also be concerned about practical implications, like whether the universe's moral state demands action. Unspoken needs could include clarity on how to assign moral weight without arbitrariness, and reconciling panpsychism with common moral intuitions.

  I should structure the desiderata clearly, mark non-negotiables, highlight the tension between Cosmic Non-Catastrophe and Complexity-Weighting, and explain why the Boundary Problem is a major hurdle. Also, assess existing views against these criteria. Need to ensure physics constraints like quantum indeterminism are included, and that consciousness science compatibility is non-negotiable. Making sure each point addresses the user's explicit requests while anticipating their underlying concerns about theoretical coherence and real-world applicability.
answer: |-
  Here is a specification (spec) of desiderata for a theory of moral status under panpsychism, structured as requested:

  **I. Cases to Handle (The "What"):**
  1.  **Non-Integrated Substrate (NIS):** *Must assign coherent moral status/value to the experiential properties inherent in fundamental physical entities (e.g., electrons, quarks, fields) or simple combinations thereof, where no significant causal integration or complex structure exists.*
      *   *Consideration:* Panpsychism's core claim is that consciousness is fundamental and ubiquitous. Ignoring the base layer is ad hoc and contradicts the ontology. Non-negotiable.
  2.  **Micro-Macro Boundary (MMB):** *Must provide a principled account of how the moral status/value attributed to micro-experiential entities relates to, combines, or differs from the moral status/value attributed to macro-conscious entities (like humans, animals) whose consciousness is reportable and functionally complex.*
      *   *Consideration:* Explaining the relationship between fundamental and complex consciousness is the central *explanatory* challenge of panpsychism. Any ethics must address this emergence/combination. Non-negotiable.
  3.  **Cosmic Moral Assessment (CMA):** *Must yield a coherent, non-absurd evaluation of the *overall* moral state of the physical universe based on the distribution, nature, and intensity of experiential properties it contains.*
      *   *Consideration:* Panpsychism forces a truly cosmic perspective on value. The theory shouldn't collapse into implying an unrecognizably horrific or implausibly blissful universe by default. Highly desirable, potentially non-negotiable depending on plausibility constraints.

  **II. Distinctions to Respect (The "How"):**
  4.  **Experience Fundamentally Matters (EFM):** *Must affirm that the presence of phenomenal experience (qualia, what-it's-like-ness) itself is the primary ground of moral patienthood and intrinsic value/disvalue.*
      *   *Consideration:* This is the core ethical intuition driving concern for consciousness. Denying it severs the link between panpsychism's ontology and ethics. Non-negotiable.
  5.  **Quantity-Quality Distinction (QQD):** *Must distinguish between merely *having* some minimal experience (e.g., a micro-experience) and *having more* (intensity, richness, complexity, duration) of it, assigning differential moral weight accordingly.*
      *   *Consideration:* Moral intuitions clearly differentiate between a fleeting minor itch and intense agony, or between a faint hum and a rich symphony. Ignoring this leads to absurd equivalence. Non-negotiable.
  6.  **Suffering-Preference Asymmetry (SPA):** *Must treat negatively valenced experiences (suffering, pain, frustration) as possessing greater moral urgency and disvalue (per unit of intensity/duration) than neutral or positively valenced experiences (pleasure, fulfillment) possess value.*
      *   *Consideration:* Strong ethical intuitions (e.g., asymmetry in population ethics, priority of harm reduction) and neuroscientific evidence suggest suffering has a unique moral gravity. Highly desirable, arguably non-negotiable for practical ethics.
  7.  **Patienthood vs. Agency (PvA):** *Must clearly distinguish between *moral patienthood* (being an object of moral concern, having interests/welfare) grounded in sentience/experience, and *moral agency* (bearing responsibility, having obligations) grounded in capacities like rationality, foresight, and self-control.*
      *   *Consideration:* Panpsychism vastly expands the potential class of patients but doesn't automatically grant agency to fundamental particles. Conflating them leads to category errors. Non-negotiable.

  **III. Constraints from Science (The "Cannot"):**
  8.  **Physics Compatibility (PC):** *Must be compatible with our best fundamental physics (quantum field theory, general relativity, indeterminism) without requiring ontologically dubious additions solely for ethical purposes.*
      *   *Consideration:* Panpsychism aims to be a naturalistic theory. An ethics contradicting physics undermines its foundation. Non-negotiable.
  9.  **Consciousness Science Compatibility (CSC):** *Must cohere with robust empirical findings about consciousness (e.g., neural correlates, effects of brain damage, unity/dissociation, evolutionary role) and major theoretical frameworks (e.g., IIT, GWT, Representationalism), even if interpreting them through a panpsychist lens.*
      *   *Consideration:* While panpsychism interprets the *ground* of consciousness, the structure and dynamics of *complex* consciousness are empirical matters. Ignoring established data is unscientific. Non-negotiable.

  **Flagged Desiderata:**
  *   **Non-Negotiable:** EFM, PvA, PC, CSC, NIS, MMB, QQD. (These define the core challenge: respecting the ubiquity and fundamentality of experience while accounting for complexity and science).
  *   **Highly Desirable but Potentially Debatable:** SPA (Some utilitarian views might reject the asymmetry, though it's widely held). CMA (The "absurdity" threshold might be contested; some might bite the bullet on a "catastrophe").
  *   **Potential Prejudices:**
      *   **SPA:** Might reflect a specific (though common) consequentialist/negative utilitarian leaning. A strictly deontological or virtue-ethical panpsychism might downplay it.
      *   **CMA (Non-Catastrophe Interpretation):** The *desire* for a non-catastrophic universe might reflect an anthropocentric bias or optimism. A truly impartial view might accept catastrophe if the evidence points that way. However, the *requirement to address it coherently* is not a prejudice.

  **Jointly Unsatisfiable Pair:**
  *   **Cosmic Non-Catastrophe (CMA - Non-Catastrophe Interpretation) + Moral Weight Scaling Linearly/Weakly with Complexity (a specific interpretation of QQD).**
      *   *Reason:* If fundamental micro-experiential entities possess *any* non-zero moral weight (per EFM, NIS), and they vastly outnumber complex macro-entities by many orders of magnitude, then even if their individual weight is tiny, their aggregate moral weight would be colossal. If suffering is ubiquitous (even minimally) or neutral/negative experiences dominate at the micro-level (per SPA), this almost inevitably leads to a universe dominated by disvalue – a moral catastrophe. To avoid catastrophe, the theory must either:
          1.  **Radically diminish micro-weight:** Make micro-experience effectively weightless compared to macro (violating a strong reading of EFM/NIS/QQD where *having* experience matters, making aggregation catastrophic).
          2.  **Radically inflate macro-weight:** Make the moral weight of complex integration vastly disproportionate to its micro-constituents (straining combinatorial principles required by MMB and potentially CSC).
          3.  **Posit inherent micro-bliss/neutrality:** Assert that fundamental experience is overwhelmingly positive or neutral (contradicting SPA's demand to take suffering seriously and lacking empirical support in CSC - pain mechanisms seem evolutionarily derived).
      *   Satisfying *both* a strong non-catastrophe requirement *and* giving significant aggregate weight to ubiquitous micro-experience without resorting to (3) appears impossible. CMA forces a choice: accept potential catastrophe, weaken micro-significance dramatically, or make strong assumptions about micro-valence.

  **The Key Excluding Requirement:**
  *   **The Boundary Problem / Micro-Macro Boundary (MMB)** does the most work excluding existing candidates.
      *   *Why:* It demands a *principled, non-arbitrary* account of how micro-experiences combine into morally relevant macro-experiences and how moral weight scales with this combination. This directly targets the core weakness of panpsychism itself (the combination problem) and forces ethical theories to confront it head-on.
      *   **Scores:**
          *   **Complexity-Weighting:** *Struggles.* Faces the aggregation/catastrophe problem (CMA) and lacks a clear *principled* link between physical/functional complexity and moral weight per se (QQD, CSC - is a more complex itch inherently worse?). How does "complexity" map precisely to experience? Arbitrariness risk high. Fails MMB by often being vague on the transition.
          *   **Integration-Restriction (e.g., IIT-based):** *Fails.* Directly violates NIS and arguably EFM by denying moral status to the fundamental experiential substrate outside integrated systems. Fails to explain why only *certain* integrations matter ethically (MMB). PC issues if integration requires physically dubious boundaries.
          *   **Suffering Background View:** *Fails.* Violates SPA by conflating mere experience with suffering. Violates CMA by guaranteeing catastrophe. Violates CSC by lacking evidence for ubiquitous micro-suffering. Violates QQD by ignoring potential valence differences at micro-level. Fails MMB by not explaining the *origin* of macro-suffering from micro.
          *   **Micro-Experience Agnosticism/Irrelevance:** *Fails.* Violates EFM and NIS. Ad hoc given panpsychist ontology. Doesn't solve MMB, just ignores the base layer.

  This spec provides the rigorous framework requested to evaluate panpsychist ethical theories, highlighting the profound challenges at the intersection of metaphysics, consciousness science, and moral philosophy. The tension between the ubiquity of experience and the avoidance of cosmic catastrophe, mediated by the intractable Boundary Problem, remains the central hurdle.
