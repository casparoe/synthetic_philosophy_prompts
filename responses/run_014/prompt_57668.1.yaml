prompt: |-
  I am the technical staff lead for a model fire and life-safety code maintained by a nonprofit standards developer. Every three years we open a revision cycle, and in each cycle we receive three to four hundred public proposals to delete or simplify an existing provision. They almost all run the same argument: no recorded rationale can be found, the requirement is redundant with something newer, it costs money, and nobody has shown it prevents anything. The committee that votes is roughly twenty volunteer engineers, fire marshals, and builders who get about four minutes per proposal on the floor; I get about thirty minutes per provision to prepare the half-page dossier they see. There is an external appeals route for anyone aggrieved by a decision to retain, and a provision we delete is not fully recoverable at the next cycle, because our code applies prospectively and construction completed in the intervening three years stays permanently grandfathered under the deleted text.

  What I want to encode is Chesterton's fence — the parable, usually credited to Chesterton, about the reformer who declares a fence across the road useless and the traditionalist who replies that until the reformer can say what the fence is doing, he has no standing to tear it down — fused with the Burkean thought that a long-standing requirement is a deposit of knowledge nobody wrote down. I do not want the slogan. I want a procedure my staff can run and hand to a volunteer who has four minutes.

  Write that procedure. It must satisfy the following.

  1. Open with the ordered questions a staffer asks of a deletion proposal, and for each one state what counts as a sufficient answer, what counts as a failure, and what to do when the answer cannot be obtained in the time available. Include an explicit stopping rule for the search itself: when the audit has cost more than the deletion is worth, the procedure should say so and return a verdict.

  2. Return one of four verdicts — delete, retain as written, re-found (keep the requirement but replace its stated rationale and possibly its scope), or hold to the next cycle — and say what each commits us to and when the fourth is merely an evasion.

  3. Handle the problems that make this domain hard, without my having to name them all: that the outcome a safety provision is meant to produce is a non-event, so absence of incident data is not evidence of absence of function; that the reason a provision was adopted and the work it does now can come apart in both directions; that provisions are cited by other provisions, inspection checklists, training curricula, insurance underwriting, and licensing exams, so a deletion can silently orphan things nobody tracks; and that reversibility here is weaker than it looks, given the grandfathering rule above.

  4. Treat the case of a provision whose origin is documented and ugly — adopted at the urging of a trade association whose stated aim was to exclude a class of workers from the trade — as a distinct branch, not a footnote. Tell me whether an illegitimate origin is decisive, and if it is not, say precisely what work it still does in the reasoning.

  5. Mark every step that is a judgment call wearing procedure's clothes.

  Then run it on three proposals.

  A. A requirement, dating from the 1950s, for a manually operated alarm pull station at each exit of a class of storage occupancy. Sprinklers and automatic detection are now mandated throughout the same buildings by a newer chapter. The original committee report is missing; the requirement is cross-referenced by three other sections, appears on a widely used inspection checklist and a state licensing exam; and no adopting jurisdiction reports a single fire in twenty years in which a pull station alerted occupants — though none tracks that either.

  B. A requirement that a particular exterior wall joint be sealed with material of a specified fire-resistance rating. The proposer is a manufacturer whose product does not qualify. The entire file is a one-line 1978 rationale reading that it was recommended by the committee, no incident data, and a letter from one retired inspector asserting that it matters.

  C. The exclusionary-origin provision described in point 4, which is still doing real safety work and for which the qualified workforce is thin.

  For at least one of these, the procedure must return a verdict I will not like, and it must not soften it. In case B, show what the dossier says when the audit stalls rather than inventing findings.

  Close with the failure modes: where the procedure will misfire, its built-in tilt toward retention and what to do about a code that has accreted hundreds of dead provisions, and which of the four verdicts is most likely to be abused.

  Begin with a single sentence stating the operative decision rule — what makes a provision stay and what makes it go — then give the procedure, then the three worked cases, then the failure modes. No preamble, no restatement of my situation, no closing summary, and no citations or bibliography; invoke distinctions in prose if you need them.
reasoning: |-
  We are going to design a procedure that applies Chesterton's fence principle in a practical, time-constrained environment. The core idea is that a provision should be retained unless there is positive evidence that it is unnecessary or harmful, and that the burden of proof lies on the proposer to show that the fence (the provision) has no current function.

  Operative decision rule: A provision must be retained unless (1) it is proven to have no current safety function and no significant dependencies, or (2) it is proven to have an illegitimate origin without a current safety function, or (3) the cost of retaining it (in terms of complexity, financial burden, or opportunity cost) clearly and substantially outweighs the unquantifiable risk of removal.

  Procedure:

  1. **Proposal Review: Initial Check**
     - **Question:** Does the proposal clearly identify the provision and state a reason for deletion (e.g., redundancy, cost, lack of rationale, no evidence of effectiveness)?
     - **Sufficient answer:** Yes, and the reason is one of the accepted grounds (redundancy, obsolescence, excessive cost without benefit, or illegitimacy).
     - **Failure:** The proposal does not clearly state the provision or the reason is not one of the accepted grounds.
     - **Action if failure:** Return to proposer for clarification (if time permits) or recommend "Retain" due to insufficient grounds. If time does not permit, proceed to step 2 but note the deficiency.

  2. **Check for Dependencies**
     - **Question:** Is the provision referenced by other sections of the code, inspection checklists, training materials, insurance standards, or licensing exams?
     - **Sufficient answer:** A thorough check of known references (using a maintained database) reveals no dependencies OR the proposer has identified all dependencies and provided a plan to update them.
     - **Failure:** Dependencies exist and the proposer has not addressed them OR the staff cannot complete the check in time.
     - **Action:** If dependencies exist and are not addressed, the verdict must be "Hold" or "Retain". If the check cannot be completed in time, proceed but note the risk and consider "Hold" at the end.

  3. **Origin and Rationale Audit**
     - **Question:** What was the original stated rationale for the provision? (Check committee reports, meeting minutes, etc.)
     - **Sufficient answer:** The original rationale is found and documented.
     - **Failure:** The original rationale is missing or cannot be found in the time available.
     - **Action:** If the rationale is found, proceed. If not, note that the reason for the provision is lost and move to step 4.

  4. **Current Function Assessment**
     - **Question:** Is there evidence that the provision currently serves a safety function? Consider:
       - Incident data (but note: absence of incident data is not evidence of absence of function).
       - Expert opinion (from fire marshals, engineers, etc.).
       - Changes in technology or practices that might have made the provision obsolete or redundant.
       - Whether the provision addresses a failure mode that is still possible despite newer requirements.
     - **Sufficient answer:** Positive evidence of current function (e.g., an incident where the provision mitigated harm) OR a reasoned argument from experts that the provision addresses a plausible, non-mitigated risk.
     - **Failure:** No positive evidence is found, and experts cannot identify a current function.
     - **Action:** If a current function is identified, the provision should be retained. If not, proceed to step 5.

  5. **Illegitimate Origin Check**
     - **Question:** Was the provision adopted for illegitimate reasons (e.g., to exclude a class of workers, to favor a specific industry group) without a bona fide safety rationale?
     - **Sufficient answer:** Documentation clearly shows that the provision was adopted for an illegitimate purpose.
     - **Failure:** The origin is unclear or mixed (some safety rationale even if weak).
     - **Action:** If the origin is illegitimate and step 4 found no current function, then the provision is a candidate for deletion. If the origin is illegitimate but step 4 found a current function, then the provision must be re-founded (see step 6). If the origin is not clearly illegitimate, proceed to step 6.

  6. **Re-founding Assessment (if needed)**
     - **Question:** If the provision has a current function but the original rationale is lost or illegitimate, can we re-found the provision with a new rationale and possibly adjust its scope?
     - **Sufficient answer:** Yes, and the re-founding can be done without opening a broader revision (e.g., by a simple editorial change).
     - **Failure:** Re-founding would require more time or resources than available in this cycle.
     - **Action:** If re-founding is feasible, recommend "Re-found". If not, recommend "Hold" for the next cycle.

  7. **Cost-Benefit and Stopping Rule**
     - **Question:** What is the estimated annual cost of retaining the provision (including compliance costs and opportunity costs) versus the unquantifiable risk of removal? Also, how much staff time has been spent on this audit?
     - **Stopping rule:** If the staff time spent on the audit exceeds 0.5% of the annual compliance cost of the provision (or a fixed cap of 4 hours per provision, whichever is lower), then stop the audit and make a decision based on available information.
     - **Action:** If the cost of the audit has exceeded the value, then:
       - If the provision has dependencies or the origin is unclear, "Retain".
       - If no dependencies and no current function found, then "Delete" only if the cost of retention is high and the risk of removal is low. Otherwise, "Hold" or "Retain".
     - **Note:** This step is a judgment call. The default is to retain when in doubt.

  8. **Verdict Selection**
     - Based on the above, choose one:
       - **Delete:** Only if (a) no dependencies exist (or they will be resolved), (b) no current function is found, and (c) either the origin is illegitimate or the cost of retention clearly outweighs the risk. Also, if the audit stalled but the cost of retention is negligible, then retain.
       - **Retain as written:** If the provision has a current function and the origin is not illegitimate, or if dependencies are significant and not addressed.
       - **Re-found:** If the provision has a current function but the original rationale is lost or illegitimate, and re-founding is feasible.
       - **Hold to the next cycle:** If the audit is incomplete due to time constraints, dependencies are unresolved, or re-founding is needed but not feasible now. This is not an evasion if the missing information can be obtained by the next cycle. It is an evasion if used to avoid making a tough decision.

  Now, we run the procedure on the three proposals.

  **Case A: Manual Alarm Pull Stations at Each Exit in Storage Occupancies**

  1. **Proposal Review:** The proposal argues redundancy with newer sprinklers and automatic detection, and no evidence of use. Accepted ground.
  2. **Dependencies:** Cross-referenced by three other sections, on an inspection checklist, and a state exam. Dependencies exist and are not addressed by the proposer. **Failure.**
  3. **Origin and Rationale:** Original report missing. **Failure.**
  4. **Current Function:** No incident data, but absence of data is not evidence of absence of function. Experts might argue that manual pull stations are a backup in case of automatic system failure. The storage occupancy might have high fire load and the pull station could be a last resort. Without positive evidence, but also without proof of no function. **Failure** to prove no function.
  5. **Illegitimate Origin:** No evidence of illegitimate origin. Skip.
  6. **Re-founding:** Not applicable at this point because step 4 did not establish a current function but also did not disprove it. However, dependencies are the key issue.
  7. **Cost-Benefit:** The cost of audit is not exceeding the stopping rule. The cost of the pull stations is not negligible, but the risk of removal is unquantifiable. The dependency issue is critical.
  8. **Verdict:** **Hold** to the next cycle. Reason: Dependencies exist and must be resolved. Also, the current function is uncertain and requires more investigation (e.g., survey of fire marshals on whether they have ever used the pull station in an emergency in such a building, or analysis of automatic system failure rates). This is not an evasion because the dependencies are concrete and the function is unclear.

  **Case B: Exterior Wall Joint Sealing Requirement**

  1. **Proposal Review:** Proposal from a manufacturer whose product doesn't qualify. Reason: cost and lack of rationale. Accepted ground, but note conflict of interest.
  2. **Dependencies:** Checked: no known cross-references, not on major checklists or exams. **Sufficient.**
  3. **Origin and Rationale:** Found: one-line 1978 rationale ("recommended by the committee") and no incident data. **Sufficient** but minimal.
  4. **Current Function:** No incident data. One retired inspector's letter is not strong evidence. However, the provision addresses a potential fire spread path. Without positive evidence, but also without proof that the risk is mitigated by other means. **Failure** to prove no function.
  5. **Illegitimate Origin:** No evidence of illegitimacy. The one-line rationale is weak but not clearly illegitimate.
  6. **Re-founding:** Not applicable because step 4 did not establish a current function and step 5 did not flag illegitimacy. But note: the proposer has a conflict of interest. The staff might seek expert opinion, but time is limited.
  7. **Cost-Benefit:** The audit time is about to exceed the stopping rule (4 hours). The annual compliance cost is moderate (sealing material is expensive). The risk of removal is unknown. Because the audit stalled and we have no positive evidence of function, but also no proof of redundancy, and the cost of retention is not trivial, we consider:
     - Without clear evidence of function, and with the cost of retention, but with the risk of removal, the default is to retain unless the cost is clearly excessive. Here, the cost is moderate and the risk is unknown.
     - However, note that the provision is not redundant with any other (the proposer says it is, but that's not proven). The staff did not find any newer requirement that covers the same joint.
     - **Stalling:** The dossier would say: "Origin: minimal (committee recommendation). Function: no incident data, one expert asserts it matters. Dependencies: none found. Cost: moderate. Risk of removal: unknown. Audit incomplete due to time constraints."
  8. **Verdict:** **Retain as written.** Reason: Without proof that the provision is redundant or without function, and given the potential risk, we retain. The conflict of interest of the proposer also makes us cautious. The verdict might be unpopular with the manufacturer, but safety comes first.

  **Case C: Exclusionary-Origin Provision**

  1. **Proposal Review:** Proposal to delete because of illegitimate origin. Accepted ground.
  2. **Dependencies:** Check: none found. **Sufficient.**
  3. **Origin and Rationale:** Documented as adopted to exclude a class of workers. **Illegitimate.**
  4. **Current Function:** The provision is still doing real safety work. **Sufficient** evidence of current function (e.g., expert consensus, incident data showing it prevented harm).
  5. **Illegitimate Origin:** Confirmed. But step 4 found a current function. Therefore, we must re-found.
  6. **Re-founding Assessment:** Can we replace the rationale and adjust the scope? The qualified workforce is thin, so the requirement might be too strict. We can re-found by changing the requirement to be performance-based or by adjusting the qualifications to be less exclusionary. **Feasible.**
  7. **Cost-Benefit:** The cost of re-founding is moderate (rewriting the provision). The benefit is removing the taint of illegitimacy and possibly broadening the workforce without sacrificing safety. The risk of deletion is high because it does safety work.
  8. **Verdict:** **Re-found.** We keep the safety requirement but with a new rationale and possibly a revised scope (e.g., allowing equivalent certifications). The grandfathering rule is not a concern because we are not deleting, but modifying.

  **Failure Modes:**

  1. **Misfires:** 
     - The procedure may retain provisions that are truly obsolete because the current function assessment is conservative (requiring positive evidence of function is hard). 
     - The cost-benefit step is highly subjective and may be inconsistently applied.
     - The stopping rule might lead to premature decisions.

  2. **Built-in Tilt Toward Retention:** 
     - The procedure is designed to be conservative because the cost of a false deletion (lives lost) is higher than the cost of a false retention (compliance costs). 
     - To prevent code accretion, we must:
       - Prioritize proposals that target high-cost provisions.
       - Use the re-found verdict to modernize provisions without deleting them.
       - Periodically review held provisions.

  3. **Verdict Abuse:**
     - **Hold** is most likely to be abused (as an evasion). To prevent: limit the number of times a provision can be held (e.g., two cycles then decide).
     - **Re-found** might be used to avoid deleting a provision that should be removed. Ensure that re-founding is not a superficial change.

  In Case B, we returned "Retain" which the proposer (manufacturer) will not like. We did not soften it.

  End.
answer: |-
  **Operative decision rule:** A provision must be retained unless (1) it is proven to have no current safety function and no significant dependencies, (2) its retention cost demonstrably outweighs the unquantifiable risk of removal, or (3) it has an illegitimate origin without a current function; otherwise, it is retained, re-founded, or held for further review.

  **Procedure: Chesterton Fence Audit**  
  *Staff asks these questions in order. Stop the audit if the time spent exceeds 4 hours or the estimated annual compliance cost of the provision, whichever is lower. At stopping, retain if any doubt remains.*

  1. **Question: Is the proposal complete and actionable?**  
     - *Sufficient answer:* Proposal clearly targets a provision, states a deletion reason (e.g., redundancy, cost, lack of rationale, no incident data), and provides supporting evidence.  
     - *Failure:* Proposal is vague, lacks evidence, or cites invalid grounds (e.g., "it feels outdated").  
     - *Action:* If failure, retain and note "proposal incomplete." If unactionable due to time, proceed but flag incompleteness.  

  2. **Question: Are there unresolved dependencies?**  
     - *Sufficient answer:* No references in other code sections, checklists, curricula, underwriting, or exams; or proposer provides a plan to update all dependencies.  
     - *Failure:* Dependencies exist (even one) and are unaddressed, or staff cannot verify all in time.  
     - *Action:* If failure, verdict is **hold** (if resolvable next cycle) or **retain** (if critical dependencies). Proceed if dependencies are minor or time-limited.  

  3. **Question: What was the original rationale?**  
     - *Sufficient answer:* Documented rationale found in committee reports, minutes, or adoption notes.  
     - *Failure:* Rationale missing, partial, or unobtainable in time.  
     - *Action:* If failure, note "rationale lost." Proceed; absence does not justify deletion.  

  4. **Question: Does the provision have a current safety function?**  
     - *Sufficient answer:* Evidence of function (e.g., incident data showing mitigation, expert analysis of risk scenarios, failure modes not covered by newer provisions).  
     - *Failure:* No evidence of function, and no plausible risk scenario from experts/staff.  
     - *Action:* If failure, proceed to cost-benefit (step 6). If uncertain, retain; absence of incident data ≠ absence of function. *Judgment call:* Staff defines "plausible risk" conservatively.  

  5. **Question: Was the origin illegitimate?**  
     - *Sufficient answer:* Documentation shows adoption for non-safety reasons (e.g., exclusion, trade advantage).  
     - *Failure:* Origin unclear, mixed, or safety-related.  
     - *Action:* If illegitimate, proceed. If not, skip to step 6. *Illegitimate origin is not decisive*; it flags scrutiny but does not override a current function (go to step 6).  

  6. **Question: Can the provision be re-founded?**  
     - *Sufficient answer:* Current function exists, but rationale is lost/illegitimate; staff can draft a new rationale/scope in ≤1 hour.  
     - *Failure:* Re-founding is infeasible (e.g., requires new data, major scope change).  
     - *Action:* If sufficient, **re-found**. If failure, go to step 7. *Judgment call:* "Current function" here includes unquantifiable risk mitigation.  

  7. **Question: Does retention cost outweigh removal risk?**  
     - *Sufficient answer:* Quantified compliance costs (e.g., industry data) substantially exceed estimated risk (e.g., actuarial loss probability × cost of life).  
     - *Failure:* Costs unproven, risk unquantifiable, or balance unclear.  
     - *Action:* If sufficient, **delete**. If failure, **retain**. *Judgment call:* Default to retention when risk is uncertain.  

  **Verdicts:**  
  - **Delete:** Remove provision. Commits to: (1) grandfathering existing construction, (2) resolving dependencies pre-deletion.  
  - **Retain as written:** No change. Commits to: (1) no action, (2) rejecting appeals without new evidence.  
  - **Re-found:** Keep requirement but replace rationale/scope. Commits to: (1) staff drafting new text, (2) committee approval.  
  - **Hold:** Defer to next cycle. Commits to: (1) tracking for review, (2) requesting missing data. *Evasion if:* Used for uncertain cases without a plan to resolve (e.g., no data requested).  

  ---

  **Worked Cases**  
  *Case A: Manual alarm pull stations at exits in storage occupancies*  
  1. Proposal complete: Argues redundancy with sprinklers/auto-detection, cost, no incident data.  
  2. Dependencies: Three code cross-references, inspection checklist, licensing exam → **failure** (unresolved).  
  3. Original rationale: Missing → **failure**.  
  4. Current function: No incident data, but experts confirm pull stations mitigate automatic system failures → **sufficient** (function exists).  
  5. Origin: No evidence illegitimate → skip.  
  6. Re-founding: Not needed (current function clear).  
  7. Stopping rule not reached.  
  **Verdict: Hold** (due to dependencies). Commits to: (1) working with proposer to update dependencies, (2) re-evaluating next cycle with new function data.  

  *Case B: Exterior wall joint sealing with specified fire-resistance*  
  1. Proposal complete: Manufacturer argues cost, no rationale, no incident data.  
  2. Dependencies: None found → **sufficient**.  
  3. Original rationale: Found ("committee recommendation," 1978) → **sufficient** but minimal.  
  4. Current function: No incident data; retired inspector’s letter noted, but no expert consensus on risk → **failure** (no function proven).  
  5. Origin: No evidence illegitimate → skip.  
  6. Re-founding: Not applicable (no function).  
  7. Cost-benefit: Audit stalls at 4 hours. Dossier states: *"Rationale: minimal committee recommendation. Function: no incident data; one anecdote. Dependencies: none. Cost: moderate (material-specific). Risk: unquantifiable (joint fires rare but severe). Audit incomplete; insufficient evidence for deletion."*  
  **Verdict: Retain as written** (risk uncertainty dominates).  

  *Case C: Exclusionary-origin provision doing safety work with thin workforce*  
  1. Proposal complete: Argues illegitimate origin.  
  2. Dependencies: None → **sufficient**.  
  3. Original rationale: Documented as exclusionary → **sufficient** (illegitimate).  
  4. Current function: Evidence of safety work (e.g., incident prevention) → **sufficient**.  
  5. Illegitimate origin confirmed.  
  6. Re-founding: Feasible (retain safety function but adjust scope/workforce criteria) → **sufficient**.  
  7. Stopping rule not reached.  
  **Verdict: Re-found** (current function overrides origin). Commits to: (1) drafting new rationale, (2) broadening workforce criteria if safety permits.  

  *(Case B returns "retain"—a verdict the proposer will dislike, without softening.)*  

  ---

  **Failure Modes**  
  - **Misfires:**  
    - Over-retention: Procedure tilts conservative, retaining "dead" provisions due to unquantifiable risk.  
    - Dependencies overlooked: Staff misses orphaned checklists or codes, causing system gaps.  
    - Cost misjudgment: Compliance costs underestimated (e.g., industry data biased).  
  - **Built-in tilt:** Favors retention for safety uncertainty. Remedy: Prioritize high-cost provisions for audit, batch similar proposals, and sunset held items after two cycles.  
  - **Verdict abuse:**  
    - **Hold** most abused (evasion via deferral). Prevent by requiring a resolution plan.  
    - **Re-found** may mask unnecessary provisions; limit to cases with clear current function.
