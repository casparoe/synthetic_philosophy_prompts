prompt: |-
  I'm a junior taking a philosophy of biology seminar at my school, and our teacher has us working through the question of what, exactly, a biological function is. My group has split into two camps, and we've been arguing for about a month without making progress, so I want to try the format that working philosophers use in adversarial collaborations: drafting a single joint statement that a committed member of each camp could sign after good-faith discussion. One camp endorses the etiological account, the Millikan-style view that a trait's function is what it was selected for, so a trait's function is fixed by its evolutionary history. The other endorses the causal-role account, the Wright-style view that a trait's function is the role it currently plays in a causal chain that contributes to the fitness of its bearers. Please write that joint statement for us. It should open with a numbered list of claims both sides can accept, about what a satisfactory account of biological function must explain — malfunctions, the difference between a trait's function and its mere side effects, exaptation, the fact that we can meaningfully ask why organs fail — and about the phenomena themselves. Then it should give the precise statements of where the two views still differ, each phrased so that its own side would accept the wording of its own view, followed by the cruxes, the sub-questions such that settling them would actually move at least one side, and, where possible, for each crux, a concrete case or argument both sides would agree bears on it, with each side's prediction written down in advance. Format it as a numbered agreed-claims section followed by a disagreements table.

  To give you a sense of where we're stuck: last week one of us pointed out that if a trait's function just is its contribution to fitness, then a heart that has stopped contributing to its owner's fitness seems to have lost its function, and the other side replied that that is exactly what a malfunction is, and we couldn't get past each other. I suspect one of the real cruxes is whether "function" is a normative notion at all — the etiological side thinks a malfunction is a genuine failure relative to a standard set by selection history, while the causal-role side thinks a trait that fails to contribute simply has no such function — and another is how to handle exaptation, like the standard case of feathers apparently being co-opted for flight after being selected for a different purpose, such as thermoregulation, but I'd like you to find the cruxes yourself rather than just expanding on my guesses. If you conclude that part of the dispute is verbal, about what we mean by "function" rather than about the biology, say which part and why. Please don't end with a verdict on which camp is right; the point is a document both camps could put their names to, with the residual disagreement made as exact as possible.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps in a philosophy of biology seminar: one endorsing the etiological account (Millikan-style) and the other the causal-role account (Wright-style) of biological function.

  The goal is to have a document that both sides can sign after good-faith discussion. It will include:

  1. A numbered list of claims both sides accept about what a satisfactory account of biological function must explain, and about the phenomena themselves.
  2. Precise statements of where the two views differ, phrased so that each side accepts the wording of their own view.
  3. The cruxes (sub-questions that, if settled, would move at least one side) and, for each crux, a concrete case or argument both sides agree bears on it, with each side's prediction written in advance.

  Key issues from the student's note:
  - The heart malfunction example: etiological view says a stopped heart still has the function to pump blood (but malfunctions), while causal-role view says it has lost its function because it no longer contributes to fitness.
  - The question of normativity: etiological view sees malfunction as a failure relative to a historical standard, causal-role view may see no function when there's no current contribution.
  - Exaptation: feathers originally for thermoregulation, then co-opted for flight.

  We must avoid a verdict and remain neutral.

  Let's structure the response:

  I. Agreed Claims (numbered list)
  Both sides agree that a satisfactory account of biological function must explain:
  - Malfunctions: cases where a trait fails to perform its function.
  - The distinction between a trait's function and its mere side effects.
  - Exaptation: cases where a trait that evolved for one function is co-opted for another.
  - The fact that we can meaningfully ask why organs fail (implying a normative standard?).
  - Also, both sides agree on the phenomena (e.g., hearts pump blood, feathers are for flight in birds now, but had a different history, etc.).

  II. Disagreements
  Presented as a table or in a structured way:

  A. Etiological Account (as they would phrase it):
     "A trait T has function F if and only if T was selected for in the evolutionary past because it performed F, and F contributed to the fitness of the bearers of T."

  B. Causal-Role Account (as they would phrase it):
     "A trait T has function F in a current system S if and only if T's performing F in S contributes (or would contribute under appropriate conditions) to the fitness of the bearers of T in S."

  III. Cruxes
  List of cruxes (sub-questions) that, if resolved, would change at least one side's view. For each crux, provide:
  - The crux question.
  - A concrete case or argument both sides agree is relevant.
  - Each side's prediction about that case.

  Possible cruxes:

  1. **Normativity of Function**: Is the concept of function inherently normative? 
     - Case: A heart that has stopped beating (malfunction).
       - Etiological: Predicts that the heart still has the function of pumping blood, but it is malfunctioning; the norm is set by history.
       - Causal-Role: Predicts that the non-beating heart currently has no function (or has lost its function) because it does not contribute to fitness.

  2. **Exaptation**: How do we assign functions in cases of exaptation?
     - Case: Feathers in birds. Originally selected for thermoregulation, now used for flight.
       - Etiological: Might say that the function of feathers is flight only if flight was what they were selected for in the lineage; if they were co-opted, then flight is not the original function but perhaps a new function? (Note: Some etiologists have developed accounts for derived functions, but the core view is that the original selected effect is the function. However, they might accept that after a period of selection for the new effect, it becomes a function.)
       - Causal-Role: Will say that the current function of feathers is flight because that's what they currently do to contribute to fitness.

     But note: The etiological view can handle exaptation by saying that after a new period of selection for the new effect, it becomes a function. So the crux might be about traits that are currently contributing in a new way but without having been selected for that yet.

     Revised case: Consider a trait that is co-opted and immediately provides a fitness benefit, but there hasn't been any selection for it yet (e.g., a single generation). 
     - Example: A population of birds with feathers for thermoregulation is blown to a new environment where flight is immediately beneficial for escaping predators, but no selection has occurred because it's the first generation.
       - Etiological: Since no selection for flight has occurred, flight is not the function; it's a side effect that is beneficial.
       - Causal-Role: Flight is the function because it currently contributes to fitness.

  3. **Stability of Function**: Can a trait lose its function if it no longer contributes to fitness, even if it did so historically?
     - Case: A trait that was selected for F in the past, but due to environmental change, it no longer contributes to fitness (or even harms) and there hasn't been enough time for selection to remove it.
       - Example: A toxin-producing gland in a snake that is now in an environment without its prey, so the toxin is not used and is metabolically costly.
       - Etiological: The function is still to produce toxin because that's what it was selected for, but it is now malfunctioning or vestigial.
       - Causal-Role: The gland currently has no function (or a negative effect) because it doesn't contribute to fitness; it might even have a disfunction.

  4. **Novel Traits**: What about traits that arise and immediately contribute to fitness but have no evolutionary history?
     - Case: A random mutation in an individual that gives it a new trait (e.g., a gland that produces a beneficial substance) but the individual hasn't reproduced yet. (Note: In a population context, we might consider a trait that appears and spreads rapidly, but before selection has acted.)
       - Etiological: Without a history of selection, the trait has no function. It might be a candidate for selection, but until then, it doesn't have a function.
       - Causal-Role: The trait has a function because it currently contributes to the fitness of the individual.

  But note: The causal-role account is typically applied at the population level? Wright's account is often about the causal role within a system. We'll use the system as the current organism in its environment.

  We must be careful to phrase the cruxes so that both sides agree on the case description and that it is a test case.

  Additionally, the student mentioned that part of the dispute might be verbal. We should note that if we conclude that.

  After analysis, I think a part of the dispute is verbal: the two camps are using "function" in different senses. The etiological account is about the evolutionary reason the trait exists, while the causal-role account is about the current causal contribution. They are answering different questions. But both sides claim to be giving an account of the same concept.

  We can note this in the cruxes.

  Let's outline the joint statement:

  # Joint Statement on Biological Function

  ## I. Agreed Claims

  Both the etiological and causal-role accounts agree that a satisfactory theory of biological function must explain the following phenomena and meet these desiderata:

  1. **Malfunctions**: It must be possible for a trait to have a function yet fail to perform it (e.g., a heart that does not pump blood).
  2. **Function vs. Side Effect**: The theory must distinguish between a trait's function and mere accidental effects that do not constitute its function (e.g., the heart's sound is a side effect, not its function).
  3. **Exaptation**: The theory must account for cases where a trait that evolved for one function is co-opted for a different function (e.g., feathers evolving for thermoregulation and later being used for flight).
  4. **Vestigial Traits**: The theory must handle traits that once had a function but no longer contribute to fitness (e.g., the human appendix).
  5. **Normative Questions**: The theory must allow us to meaningfully ask why an organ fails and to evaluate its performance against a standard.
  6. **Fitness Contribution**: The theory must connect functions to contributions to the fitness of the organism (or the system).

  Additionally, both sides agree on the following empirical facts:

  7. Natural selection has shaped many traits in organisms.
  8. Traits can have effects that are beneficial, neutral, or harmful.
  9. The environment can change, altering the fitness effects of a trait.

  ## II. Precise Statements of the Two Accounts

  - **Etiological Account (as endorsed by Camp A)**: 
    A trait T in an organism O has a function F if and only if T is present in O because, in the evolutionary history of O's lineage, ancestors of O had T (or a precursor of T) and were selected for because T (or the precursor) performed F, and performing F contributed to the fitness of those ancestors.

  - **Causal-Role Account (as endorsed by Camp B)**:
    A trait T in an organism O has a function F in the current system S (which includes O and its environment) if and only if T's performing F in S contributes, or would contribute under appropriate conditions, to the fitness of O in S.

  ## III. Cruxes of the Disagreement

  The following sub-questions, if resolved, would move at least one side in the debate. For each crux, we provide a concrete case that both sides agree is relevant and each side's prediction about that case.

  ### Crux 1: The Normativity of Function

  **Question**: Does the concept of function imply a normative standard such that a trait can be said to malfunction even when it fails to perform in a way that was historically selected?

  **Case**: Consider a heart in a living human that has stopped beating due to a blockage (myocardial infarction). The organism is still alive (for a short time) but the heart is not pumping blood.

  - **Etiological Prediction**: The heart still has the function of pumping blood. Its failure to pump is a malfunction relative to the historical norm established by selection. The function is fixed by history, not current contribution.
  - **Causal-Role Prediction**: The heart currently has no function (or has lost its function) because it is not contributing to the fitness of the organism. The concept of malfunction only makes sense if there is a current causal role that is not being fulfilled; without a current role, there is no function to malfunction.

  **Relevance**: This case tests whether function is tied to a historical standard (etiological) or to current causal contribution (causal-role).

  ### Crux 2: Exaptation Without Selection History for the New Effect

  **Question**: Can a trait acquire a new function solely by virtue of its current causal contribution, without having been selected for that contribution?

  **Case**: Consider a population of birds with feathers that evolved for thermoregulation. By chance, a small group is blown to a new island where flight is immediately beneficial for escaping predators. In the first generation on the island, the feathers are used for flight and this use contributes to fitness. However, there has been no selection for flight in this lineage (because it's the first generation in the new environment).

  - **Etiological Prediction**: The feathers do not have the function of flight because they have not been selected for flight. Their use in flight is a beneficial side effect. The function remains thermoregulation (if that's what they were selected for) until there is selection for flight.
  - **Causal-Role Prediction**: The feathers have the function of flight in the new environment because they currently contribute to fitness by enabling escape from predators. The function is determined by the current causal role in the system.

  **Relevance**: This case tests whether a new function can be assigned without a history of selection for that effect.

  ### Crux 3: Vestigial Traits and Function Loss

  **Question**: Can a trait lose its function if it no longer contributes to fitness, despite having been selected for that function in the past?

  **Case**: Consider a species of cavefish that has eyes but lives in complete darkness. The eyes are non-functional (do not provide vision) and are metabolically costly. They are vestigial structures that have not yet been lost by evolution.

  - **Etiological Prediction**: The eyes still have the function of seeing because that is what they were selected for in the past, but they are malfunctioning (or vestigial). The historical function remains.
  - **Causal-Role Prediction**: The eyes currently have no function (or a negative function) because they do not contribute to fitness; they are a cost. There is no current causal role that supports a function assignment.

  **Relevance**: This case tests whether function is permanently fixed by history or can be lost when the trait no longer plays a causal role.

  ### Crux 4: Novel Mutations

  **Question**: Can a trait that arises by mutation and immediately contributes to fitness have a function without any history of selection?

  **Case**: In a population of bacteria, a random mutation occurs in one individual that confers resistance to a new antibiotic in the environment. This mutation allows the bacterium to survive and reproduce, but no selection has yet occurred (we are considering the moment when the mutation first appears).

  - **Etiological Prediction**: The mutation does not yet have a function. It is a beneficial effect, but without a history of selection, it is not a function. It may become a function if it is selected for.
  - **Causal-Role Prediction**: The mutation has the function of conferring antibiotic resistance because it currently contributes to the fitness of the bacterium in its environment.

  **Relevance**: This case tests whether selection history is necessary for function assignment.

  ### Note on Verbal Disagreement

  Both sides acknowledge that part of the disagreement might be verbal: the etiological account is primarily concerned with the evolutionary explanation for why a trait exists, while the causal-role account is concerned with the current causal dynamics in the organism-environment system. However, each camp maintains that their account captures the core meaning of "function" in biology. Settling the cruxes above would help clarify whether one account better explains the agreed phenomena or whether they are addressing distinct questions.

  ---
  This joint statement is signed by representatives of both camps in good faith, acknowledging the above agreements and disagreements.

  [Signature lines for both camps]
answer: |-
  ### Joint Statement on Biological Function  
  **Adversarial Collaboration between Etiological and Causal-Role Accounts**  
  *Drafted in good faith by representatives of both camps*

  ---

  #### I. Agreed Claims: What a Satisfactory Account of Biological Function Must Explain  
  Both sides endorse the following claims about the desiderata for a theory of biological function and the phenomena requiring explanation. A satisfactory account must:  

  1. **Explain Malfunctions**: Account for cases where a trait fails to perform its function (e.g., a heart that does not pump blood) without implying that the trait has no function.  
  2. **Distinguish Functions from Mere Side Effects**: Provide criteria to differentiate a trait’s proper function from incidental effects (e.g., the heart’s sound vs. its blood-pumping role).  
  3. **Accommodate Exaptation**: Explain how a trait can acquire a new function distinct from its original evolutionary purpose (e.g., feathers evolving for thermoregulation and later being co-opted for flight).  
  4. **Handle Vestigial Traits**: Address traits that once had a function but no longer contribute to fitness (e.g., the human appendix).  
  5. **Ground Normative Questions**: Explain why it is meaningful to ask why an organ *fails* (e.g., "Why did this heart stop?") and to evaluate traits against standards of "success" or "failure."  
  6. **Connect Functions to Fitness**: Link functions to contributions to an organism’s survival or reproductive success, historically or presently.  
  7. **Acknowledge Evolutionary History and Current Causation**: Recognize that natural selection shapes traits over time, and that traits play causal roles in current systems.  

  Both sides further agree on these empirical observations:  
  8. Selection history and current causal contributions are distinct (e.g., feathers *were* selected for thermoregulation but *now* contribute to flight).  
  9. Traits can persist without contributing to fitness (e.g., a vestigial trait in a changed environment).  
  10. Novel traits can arise and immediately benefit fitness (e.g., a mutation conferring antibiotic resistance).  

  ---

  #### II. Disagreements: Precise Statements of the Two Views  
  The residual disagreement centers on the *definition* of biological function. Each camp accepts the wording below as a fair characterization of their position:  

  | Account | Core Definition |  
  |---------|----------------|  
  | **Etiological (Millikan-style)** | A trait \(T\) has a function \(F\) if and only if \(T\) exists because it was naturally selected for performing \(F\) in the evolutionary past, and \(F\) enhanced the fitness of ancestral organisms. |  
  | **Causal-Role (Wright-style)** | A trait \(T\) has a function \(F\) if and only if \(T\)’s performance of \(F\) currently contributes (or would contribute under appropriate conditions) to the fitness of its bearers in a causal system. |  

  ---

  #### III. Cruxes of the Disagreement  
  The following sub-questions, if resolved, would move at least one side. Each crux includes a concrete test case agreed upon by both camps, along with predictions from each view.  

  | Crux | Question | Test Case | Etiological Prediction | Causal-Role Prediction |  
  |------|----------|-----------|------------------------|------------------------|  
  | **1. Normativity of Function** | Is "function" inherently normative (implying a standard against which malfunctions are judged)? | A human heart that has irreversibly stopped beating due to injury. The organism is alive but dying; the heart contributes nothing to fitness. | The heart *still has the function* of pumping blood because that is what it was selected for. Its failure is a *malfunction* relative to the historical standard set by selection. | The heart *has no function* because it currently contributes nothing to fitness. "Malfunction" only applies if the trait *should* contribute but fails; here, no current role exists to ground "should." |  
  | **2. Exaptation Without Selection** | Can a trait acquire a new function based solely on current fitness contribution, without a history of selection for that effect? | Feathers in a bird lineage originally selected for thermoregulation. A subpopulation colonizes a new habitat where feathers *immediately* enable flight (providing a fitness advantage), but no selection for flight has yet occurred (first generation). | Flight is *not* a function of feathers. Feathers retain their historical function (thermoregulation); flight is a beneficial side effect until selection acts on it. | Flight *is* the function of feathers because it currently contributes to fitness in the new environment. The historical function is irrelevant to current role assignment. |  
  | **3. Vestigial Traits and Function Loss** | Can a trait lose its function if it ceases to contribute to fitness, despite its selection history? | Cavefish eyes: Ancestral fish had functional eyes (selected for vision), but a population now lives in total darkness. The eyes are non-functional, metabolically costly, and reduce fitness. | Eyes *retain the function* of vision because that is what they were selected for. They are now vestigial (or malfunctioning) due to environmental change. | Eyes *have no function* because they contribute negatively to fitness. Any historical function is irrelevant; current causal role determines function. |  
  | **4. Novel Traits Without History** | Can a trait have a function if it arises de novo and immediately contributes to fitness, without any selection history? | A single bacterium develops a novel mutation (e.g., a toxin-neutralizing enzyme) that immediately enhances its survival in its current environment. No selection has occurred (this is the first instance). | The enzyme has *no function*; it is merely a beneficial effect. A function requires a history of selection for that effect. | The enzyme *has a function* (neutralizing toxin) because it currently contributes to fitness. Selection history is unnecessary. |  

  ---

  #### IV. Verbal Disagreement  
  Both camps acknowledge that part of the dispute may be verbal:  
  - The term "function" is used differently. The etiological account defines it as *why the trait exists* (an explanatory historical concept), while the causal-role account defines it as *what the trait does now* (a systemic causal concept).  
  - However, the disagreement is not *merely* verbal because:  
    - Each camp claims their definition better explains the agreed phenomena (e.g., malfunctions, exaptation).  
    - Resolving the cruxes above could empirically favor one view (e.g., if novel traits are universally described as functional in biology, this challenges etiology).  

  ---  
  **Signed,**  
  [Representative of Etiological Camp]  
  [Representative of Causal-Role Camp]  
  *Date: [Date]*  

