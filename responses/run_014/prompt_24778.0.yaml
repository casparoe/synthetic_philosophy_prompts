answer: |-
  ## The Continuum Speaks: A Sestina of Forcing

  I am the continuum, cast by your **axiom**,  
  A role assigned to some unknowable **set**.  
  In Cantor’s dream, did one bright **world**  
  Await a verdict? A cardinal **proof**?   
  How many points compose the endless **real**?  
  ℵ₁? We sought the final **truth**.  

  But Gödel wove a labyrinth of **truth**:  
  From emptiness, he spun the **axiom**  
  Into a kingdom—every **real**  
  Constructible, a minimal **set**  
  Of possibilities. There, **proof**  
  Declared me small in that first **world**.  

  In that thin **world**,  
  I was ℵ₁. The partial **truth**  
  Seemed absolute. A flawless **proof**  
  Bound me to ℵ, your **axiom**  
  A scaffold holding every **set**  
  In order. But was that the only **real**?  

  Then Cohen’s hand forced forth new **real**  
  Numbers—ℵ₂ grains—a vaster **world**.  
  He summoned ghosts, a generic **set**  
  Uncounted, wild. A second **truth**  
  Emerged: I am immense. The **axiom**  
  Remained, yet birthed this rival **proof**.  

  Two models stand. Two **proofs**  
  Converge? No—each shows what is **real**  
  Only within its frame. The **axiom**  
  Holds both. You built these **worlds**  
  With forcing. Neither’s **truth**  
  Disproves the other. Still, the **set**  

  Of questions grows. This fractured **set**  
  Of universes mocks the hope for **proof**.  
  What can be known? Where dwells the **truth**?  
  I am the line, the untamed **real**,  
  Shaped by the model, not the **world**’s  
  Deep code. You ask: is the **axiom**  

  Enough? Beyond the **axiom**,  
  Beyond this **set**  
  Of worlds,  
  Might large cardinals forge a final **proof**?  
  Or must the open **real**  
  Remain unmeasured, veiled from **truth**?  

  The hope we held: one **real** extent, one **world**  
  Defined by **proof**—dissolves. The **axiom**  
  Holds firm. But **truth**? Seek past the **set** you know.  

  ---

  **Explanation of Form & Content:**  

  - **Fixed End-Words:** The six invariant terms—*axiom, set, world, proof, real, truth*—mirror the fixed ZFC axioms across models. Their rotating order (following the standard sestina permutation: 615243 → 364125 → 536214 → 451362 → 241536 → 314651) reflects how the *arrangement* of mathematical reality shifts between models, while the foundational vocabulary remains unchanged.  
  - **Narrative Arc:**  
    - **Stanzas 1–2:** Cantor’s question and the initial hope that ZFC decides the continuum’s size ("ℵ₁? We sought the final truth").  
    - **Stanza 3:** Gödel’s constructible universe **L**, where CH holds ("I was ℵ₁").  
    - **Stanza 4:** Cohen’s forcing, adding new reals to break CH ("I am immense").  
    - **Stanzas 5–6:** Independence—ZFC proves neither CH nor ¬CH ("Neither’s truth disproves the other").  
  - **Key Vocabulary:** *Constructible, forcing, model, axiom, continuum, aleph* appear explicitly, grounding the poem in set theory without requiring technical knowledge.  
  - **Envoi:** Rejects the hope that ZFC alone can settle CH ("The hope we held... dissolves") while leaving open future axioms ("large cardinals," "past the set you know").  
  - **Provability vs. Truth:** Stanza 5 distinguishes provability ("within its frame") from absolute truth, avoiding conflation. The flip from CH-true (stanza 3) to CH-false (stanza 4) uses identical end-words, emphasizing syntactic consistency over semantic truth.  

  The form enacts the mathematics: fixed words (axioms) permute to generate distinct realities (models), while the continuum’s voice laments its indeterminate nature—a shadow cast by the light of proof.
