  I should structure the response like Lewis: precise, with examples. Address the equilibrium point first, then break down the differences. Use the driving side example. Emphasize that the birth of convention is in the shift to mutual expectations, even if gradual. Acknowledge that the analysis doesn't cover the origin but explains the sustaining mechanism. Conclude that the silence is intentional, focusing on what conventions are, not how they start.

