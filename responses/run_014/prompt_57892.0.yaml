  **Research Proposal: The Repeal-Anticipation Problem in Futarchy Pilots**

  **Title:** Modeling Policy Repeal Risk in Futarchy: How Anticipated Reversals Distort Conditional Prediction Markets

  **Introduction**

  Futarchy, as proposed by Robin Hanson, uses prediction markets to make policy decisions: voters define a metric of national welfare, and speculative markets are used to evaluate policies based on their predicted impact on this metric. While futarchy has been discussed for national governance, pilot projects in smaller contexts (like charter cities) are emerging. A common worry in these pilots is that conditional prediction markets, which are meant to forecast the effect of a policy if implemented, might be distorted by manipulation (e.g., by wealthy actors) or myopia (traders discounting long-term effects). However, I argue that an underappreciated issue is the "repeal-anticipation problem": in a dynamic political environment, traders will price not the effect of the policy if it were to remain in force indefinitely, but the expected effect accounting for the probability that future political bodies (e.g., subsequent city councils or referendums) will repeal or dilute the policy. This problem is particularly acute in small, experimental settings where institutional stability is low.

  **Research Question**

  How does the anticipation of policy repeal by future political actors distort the prices in conditional prediction markets used in futarchy, and under what conditions does this distortion prevent the market from accurately capturing the policy's intrinsic value?

  This question isolates repeal-anticipation from ordinary manipulation and myopia by assuming:
  - Traders are rational and well-informed (no manipulation).
  - Traders have a long enough time horizon to capture the policy's full effects (no myopia).
  - The only distortion arises from the possibility that the policy might be reversed before its effects are fully realized.

  **Why Familiar Arguments Leave This Problem Open**

  The standard case for prediction markets emphasizes that they aggregate dispersed information and incentivize truth-telling. Critics often focus on manipulation, liquidity, or externalities. However, both sides typically assume that the market is predicting the outcome conditional on the policy being implemented and maintained. The possibility of future policy reversal is either ignored or treated as an exogenous risk. 

  In reality, the probability of repeal is endogenous: it depends on the policy's effects (e.g., if a policy causes short-term pain for long-term gain, it may be repealed before the gains materialize). Moreover, in a futarchy, the decision to repeal might itself be made via a prediction market in the future, creating a recursive problem. Existing defenses of futarchy assume that the policy, once chosen, remains in place long enough for the market's conditional forecast to be tested. But in a pilot with frequent political turnover, this assumption fails. Critics of prediction markets have not isolated this issue because they focus on more immediate flaws. Thus, the repeal-anticipation problem remains an open gap in the theory.

  **Methodology: Decision Theory and Toy Models**

  Given the eight-week timeframe and the theoretical nature of the problem, this project will use decision theory and computational toy models rather than empirical work. The steps are:

  *Week 1-2: Problem Formalization*
  - Define a simple decision-theoretic model of a policy with a known "intrinsic" effect (e.g., a one-time cost followed by perpetual benefits). 
  - Introduce a stochastic process for policy repeal (e.g., a fixed annual probability, or a probability that depends on observed outcomes).
  - Model the conditional prediction market as a forecast of the discounted welfare metric conditional on the policy being implemented, but accounting for repeal risk.

  *Week 3-4: Equilibrium Analysis in Static Settings*
  - Solve for the market price in a one-shot setting where traders anticipate a fixed probability of repeal. Compare this to the "true" conditional value (if the policy were permanent).
  - Examine how the distortion varies with the repeal probability, the discount rate, and the policy's effect trajectory.

  *Week 5-6: Dynamic Extensions and Recursive Futarchy*
  - Extend the model to a multi-period setting where future repeal decisions are made via futarchy (i.e., using prediction markets). This creates a recursive structure: today's market must forecast welfare including the possibility of future markets repealing the policy.
  - Analyze the fixed points of this system: under what conditions does a policy appear less valuable because it is likely to be repealed, and how does this perception become self-fulfilling?

  *Week 7: Robustness and Design Proposals*
  - Test the model's sensitivity to assumptions (e.g., different welfare functions, repeal mechanisms).
  - Sketch design tweaks to mitigate the problem (e.g., locking in policies for a minimum period, or using markets that explicitly condition on no repeal).

  *Week 8: Synthesis and Writing*
  - Compile results into a working paper, highlighting implications for futarchy pilot projects.

  *Why Toy Models?* 
  Empirical work would require data from real futarchy pilots, which are rare. Even in existing pilots, isolating repeal anticipation from other factors is difficult. Toy models allow us to isolate the mechanism, explore extreme cases, and derive qualitative insights quickly. Decision theory provides a clean framework to study strategic interactions without the noise of real-world data. This method is ideal for a summer project and lays the groundwork for future empirical tests.

  **Expected Outcomes and Success Criteria**

  *Successful Result:*
  - A tractable model showing that repeal anticipation can cause significant undervaluation of beneficial policies, especially those with delayed benefits.
  - Identification of conditions under which the distortion is severe (e.g., high political volatility, long time lags for benefits).
  - A demonstration that recursive futarchy (where future repeal is also market-driven) can lead to multiple equilibria or self-defeating prophecies.
  - Preliminary design suggestions to reduce distortion (e.g., policy sunset clauses tied to market reassessments).

  *Failure Conditions:*
  - The model fails to capture the core dynamic (e.g., because the repeal probability is exogenous and thus adds noise but no strategic distortion).
  - The distortion is negligible under all plausible parameter values, making the problem theoretically possible but practically irrelevant.
  - The recursive extension becomes intractable and yields no clear insights.

  **Risks to Scope**

  The project could become unrealistic if:
  - The recursive model proves too complex for analytical solution and requires heavy simulation, exceeding the eight-week limit.
  - The problem requires game-theoretic modeling of trader collusion (which we exclude by assuming no manipulation) or detailed institutional details that blur the focus.
  - The definition of "welfare" in a charter city is too context-dependent, making the toy models overly simplistic.

  To mitigate, we start with the simplest model and add complexity only as time allows.

  **Conclusion**

  This project addresses a critical but overlooked flaw in futarchy pilots: repeal-anticipation. By isolating it through decision-theoretic models, we can assess its severity and propose design fixes. The results will inform ongoing efforts to implement futarchy in charter cities and could reshape the theoretical debate on prediction markets in governance.
