  ## Research Proposal: The Repeal-Anticipation Problem in Futarchy Pilots

  **Title:** Policy Reversibility as a Market Distortion: Modeling Repeal-Anticipation in Futarchy’s Conditional Prediction Markets

  ### 1. Introduction
  Futarchy proposes using conditional prediction markets to guide policy decisions by comparing expected outcomes of alternatives against a welfare metric. Pilot implementations in bounded contexts (e.g., charter cities evaluating zoning reforms via land-value/satisfaction indices) face critiques around manipulation and short-termism. However, I argue these pilots are uniquely vulnerable to a distinct distortion: **repeal-anticipation**. Traders will price not the effect of a policy *if maintained indefinitely*, but its *probability-weighted expected value* conditional on future political bodies (e.g., new councils or referendums) diluting or reversing it. This undermines futarchy’s core premise—that markets reveal the causal impact of policies—by conflating policy quality with political instability. This project formalizes repeal-anticipation, isolates it from other distortions, and evaluates its theoretical implications for futarchy’s viability in small-scale, reversible settings.

  ### 2. Research Question
  *Under what conditions does the anticipation of future policy repeal in a dynamic political environment distort prices in conditional prediction markets, such that the market fails to reveal the true expected welfare effect of a policy *if it were permanently maintained*?*

  This isolates repeal-anticipation by assuming:  
  - **No manipulation**: Traders are rational, liquidity is sufficient, and no actor can profitably distort prices.  
  - **No myopia**: Traders fully account for long-term welfare effects within the policy’s lifespan.  
  - **Endogenous repeal risk**: Reversal probability depends on the policy’s observed outcomes, political volatility, and institutional rules.

  ### 3. Why Existing Arguments Leave the Problem Open
  Proponents argue prediction markets efficiently aggregate information and incentivize truth-seeking, assuming policies, once adopted, persist long enough for their effects to materialize. Critics focus on manipulation, externalities, or market myopia—all treat policy persistence as given. Neither addresses how traders’ *forward-looking expectations of policy reversal* recursively distort pricing:  
  - Markets may undervalue policies with short-term costs but long-term gains (e.g., infrastructure), as traders anticipate reversal before benefits accrue.  
  - Policies with concentrated losses (e.g., zoning reforms) may appear *less* detrimental than they are if traders expect quick repeal.  
  - In recursive settings (e.g., future councils using futarchy), prices may embed self-fulfilling prophecies: low valuations increase reversal likelihood.  

  This gap persists because futarchy theory typically models policy evaluation in static environments, neglecting path-dependent political dynamics. Repeal-anticipation emerges only when markets operate in governance systems with overlapping decision cycles.

  ### 4. Methodology: Decision Theory and Toy Models (8-Week Plan)
  Given the project’s theoretical focus and time constraints, I will use formal modeling instead of empirical data. Toy models offer precision in isolating mechanisms and avoid noise from real-world complexity.

  - **Weeks 1–2: Baseline Model**  
    Develop a dynamic decision-theoretic model with:  
    - A welfare metric (e.g., discounted sum of annual land values + satisfaction scores).  
    - A policy with known *intrinsic* effect if maintained permanently (e.g., +ΔW/year after a 1-year implementation lag).  
    - Stochastic repeal process: Annual repeal probability *ρ* driven by exogenous political volatility (e.g., election cycles) or endogenous factors (e.g., *ρ* increases if short-term welfare dips).  
    Market prices reflect the *effective* expected welfare: *E[W|policy] = E[W|permanent] × (1 – φ) + E[W|repealed] × φ*, where *φ* is the probability of repeal within the evaluation window.  

  - **Weeks 3–4: Distortion Analysis**  
    Quantify the divergence between *intrinsic* and *effective* welfare under:  
    - Time-inconsistent policies (e.g., high upfront costs, delayed benefits).  
    - Varying political volatility (*ρ*), discount rates, and evaluation horizons.  
    - Endogenous repeal (e.g., *ρ* depends on interim welfare realizations).  

  - **Weeks 5–6: Recursive Futarchy Extension**  
    Model a multi-period system where future repeal decisions *themselves* use prediction markets. Traders in the initial market must forecast:  
    - Direct policy effects.  
    - Likelihood of repeal by a future futarchy market.  
    Solve for equilibria where beliefs about repeal probabilities are self-consistent.  

  - **Week 7: Mitigation Scenarios**  
    Test institutional designs to reduce distortion:  
    - Policy "lock-in" periods (e.g., no repeal within *T* years).  
    - Markets conditioned on "no repeal" (e.g., using subsidized contracts).  
    - Welfare metrics incorporating stability (e.g., penalizing volatility).  

  - **Week 8: Synthesis & Paper Draft**  
    Consolidate results, outline implications for futarchy pilots, and draft findings.

  **Why this method?**  
  Empirical work would require data from active futarchy pilots (scarce) and struggle to isolate repeal-anticipation from manipulation or noise. Toy models efficiently characterize theoretical boundaries and equilibria, providing clear policy insights within 8 weeks.

  ### 5. Outcomes and Success Criteria
  - **Successful Result**:  
    - A tractable model proving repeal-anticipation *systematically* distorts prices, particularly for time-inconsistent policies.  
    - Identification of "critical thresholds" (e.g., repeal risk > *X*% or discount rate > *Y*%) where distortion invalidates futarchy.  
    - Design insights (e.g., lock-in periods > policy payoff time) that mitigate distortion.  
    - Demonstration of self-fulfilling equilibria in recursive futarchy (e.g., low initial prices increase repeal likelihood).  

  - **Failure**:  
    - The distortion is negligible under all plausible parameters (e.g., repeal risk is always dominated by policy effects).  
    - The model reduces to generic irreversibility theory without novel futarchy insights.  
    - Recursive dynamics are intractable or indeterminate.  

  ### 6. Risks to Scope
  - **Model Overcomplication**: Game-theoretic interactions (e.g., between traders and voters) or multiple policy stages may exceed 8 weeks. *Mitigation: Prioritize parsimonious models; defer extensions.*  
  - **Ambiguous Welfare Metrics**: If repeal risk depends on hard-to-quantify factors (e.g., "resident satisfaction"), models may become arbitrary. *Mitigation: Use standardized metrics (e.g., land values) with clear timings.*  
  - **Institutional Heterogeneity**: Real-world governance rules (e.g., referendum thresholds) could require complex implementations. *Mitigation: Abstract rules into simple probabilistic frameworks.*  

  ### 7. Conclusion
  Repeal-anticipation could render futarchy pilots unworkable in politically volatile settings by decoupling market prices from policy efficacy. This project isolates the mechanism through decision-theoretic models, delivering actionable criteria for pilot design. By addressing a flaw orthogonal to familiar critiques, it advances futarchy’s realism as a governance tool.

  ---  
  **Formatting note**: This proposal fits within two pages when single-spaced (12pt font). Key sections are concise to allow space for your added citations. The focus on *tractability* (simple models, clear success/fail criteria) aligns with summer grant constraints.
