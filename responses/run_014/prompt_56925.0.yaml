answer: |-
  The resistance to reordering these records, despite the physical material remaining intact, hinges on a particular conception of what constitutes the "record" itself within archival tradition. Archivists understand a record not merely as the information contained on its pages, but as an artifact of action – a byproduct of specific transactions, decisions, and processes within the creating office. The record’s *context*, materially embodied by its position within the creator’s filing system and described by their terminology, is inseparable from its meaning as evidence. Its place in a folder sequence, its adjacency to other documents, the file titles assigned by the office – these aren't just organizational conveniences; they are traces of the bureaucratic activity that generated and used the document. They reveal *how* the institution operated, how it categorized people and events, how information flowed, and what priorities shaped its recordkeeping. Destroying this original arrangement, the argument goes, destroys the record's evidential value regarding the creator's functions and actions. It severs the document from the context that explains *why* it exists in that form, at that time, bearing those markings.

  This practice rests on foundational theories: the principle of *respect des fonds* (keeping records of a single creator together) and *provenance* (maintaining records according to their origin). Crucially, it assumes the creating institution *is* the primary author of the record's meaning as an official artifact, regardless of the subject matter or the perspectives of those documented. The names and titles, even if false or contemptuous, are evidence *of* the institution's viewpoint and processes, which is a core part of the historical record the archive preserves. Rearranging the documents by the lives they touch fundamentally shifts authorship and context. It prioritizes the subjects' narratives over the bureaucratic narrative, treating the records primarily as carriers of information *about* individuals, rather than artifacts *of* the institution's actions concerning those individuals.

  This view implicitly rules out rival conceptions. It resists seeing records solely as neutral information carriers where content reigns supreme and arrangement is arbitrary. More significantly, it challenges the idea that records are primarily instruments *owed* to the people they document, implying a moral obligation to prioritize their perspective and needs in arrangement and description, potentially over the evidence of institutional action. The practice also reveals underdetermination: an original order could be maintained for vastly different reasons. A strict positivist might see it as the only objective truth of the record's creation, while a critical archivist might preserve it precisely to expose the power structures and biases embedded in the institution's own filing system, even as they critique it. The same shelf order could serve both purposes.

  Adopting the survivors' re-ordering would necessitate profound changes. The finding aid would need to completely restructure its hierarchical presentation, abandoning the creator's organizational logic for one based on individual lives or survivor-defined categories. Descriptions would incorporate survivor terminology, explicitly challenging and contextualizing the creator's language. This reframing would significantly alter the record's perceived nature as evidence in legal proceedings. While the *content* of individual documents might remain admissible, the *context* presented – the narrative of the institution's systematic actions embedded in the original order – would be materially altered. Lawyers could argue the rearrangement obscures institutional intent or process, potentially weakening cases built on demonstrating systemic patterns of neglect or abuse. Conversely, it might strengthen arguments centered on individual harm and survivorship.

  Training for archivists would need radical expansion. Beyond traditional diplomatics and provenance, it would require deep engagement with ethics of care, trauma-informed practices, community archiving methodologies, and postcustodial theory. Archivists would need skills in facilitating community description, navigating contested terminology, and understanding how rearrangement fundamentally shifts the epistemological foundations of the record they steward. They would grapple with balancing the evidential value of the creator's context against the imperative for restorative justice and returning narrative agency to the marginalized. The core challenge would be redefining professional identity away from solely being guardians of institutional evidence towards becoming mediators who acknowledge the multiple, often conflicting, meanings and obligations embedded within the records they hold. The material might remain, but the conceptual framework defining the record's truth, purpose, and ownership would be irrevocably transformed.
