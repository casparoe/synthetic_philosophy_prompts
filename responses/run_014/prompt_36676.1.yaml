prompt: |-
  I teach an upper-level seminar on philosophy of perception (15 students, 75 minutes) that is working toward the debate over cognitive penetration. Design an in-class activity in which students first experience the pull of top-down effects on their own perceptual reports and then discover how hard it is to tell, from the inside or from the group data, whether anything perceptual actually changed. Some ingredients I suspect would work: ambiguous figures presented with and without hints, a rigged streak of one type of briefly flashed stimulus to induce an expectation before ambiguous test trials, and a token-wagering scheme (no real money) that reveals how much confidence rides on expectation rather than on the stimulus itself. Include rules, materials, timings, the payoff scheme, and a debrief that maps what happened onto the distinctions that matter: attentional selection vs. genuine penetration, perceptual vs. post-perceptual (judgment or response-bias) explanations, and the question, in the spirit of Susanna Siegel's work on epistemic downgrade, of how much trust a perceptual report deserves once its etiology has been shaped by belief. Also predict what will go wrong on a first run and how to handle it, and be explicit about which feature of the debate the activity cannot reproduce from within — for instance, that everything students report is compatible with judgment-only explanations, the core of the recent psychophysical critiques associated with Firestone and Scholl — and that I will have to supply.

  Present the activity itself as prose, then follow it with a summary table with these columns: activity moment; what participants do; theoretical distinction it targets; predictable failure and fix; what the activity cannot show from within.
reasoning: |-
  We are designing an in-class activity for an upper-level seminar on philosophy of perception. The activity aims to let students experience the pull of top-down effects on their own perceptual reports and then discover the difficulty in determining whether the perceptual experience itself changed or if the change was post-perceptual (judgment or response bias). We will use ambiguous figures, a rigged streak of one type of stimulus to induce expectation, and a token-wagering scheme for confidence.

  **Activity Title:** The Top-Down Tug-of-War: Perception, Belief, and Confidence

  **Learning Objectives:**
  1. Experience how prior expectations (induced by a streak of unambiguous stimuli) can influence reports of ambiguous stimuli.
  2. Discover the difficulty in introspectively distinguishing between a change in perceptual experience and a change in judgment or response bias.
  3. Use a confidence wagering scheme to reveal how confidence can be influenced by expectations independently of the stimulus.
  4. Map the experience to key distinctions: attentional selection vs. genuine cognitive penetration; perceptual vs. post-perceptual explanations; and the issue of epistemic downgrade (as in Siegel's work).

  **Materials:**
  - Projector and computer for displaying stimuli.
  - Prepared slideshow with:
     a. **Unambiguous stimuli streak:** 10 consecutive unambiguous images (e.g., all clearly a duck or all clearly a rabbit, for the duck-rabbit figure; or all clearly a young woman or an old woman for the young/old woman figure). We'll use two different ambiguous figures to avoid fatigue.
     b. **Test trials:** 10 ambiguous images (the same ambiguous figure for all test trials) interspersed with 5 catch trials (unambiguous images, to check attention).
     c. **Hints for ambiguous figures:** For a separate part, we'll show the same ambiguous figure twice: once without a hint and once with a hint (e.g., "this is often seen as a duck" or "this is often seen as a rabbit").
  - Response sheets for each student (or use polling software if available) to record:
     a. What they see (e.g., duck or rabbit; young woman or old woman).
     b. Confidence level on a scale of 1-5 (with 1=very uncertain, 5=very certain).
     c. Alternatively, we can use tokens for wagering (see below).
  - Tokens (e.g., poker chips or printed paper tokens) for wagering: Each student gets 10 tokens at the start.

  **Rules and Procedure:**

  **Total Time:** 75 minutes (including debrief)

  **Part 1: Experiencing the Pull (15 minutes)**
  1. **Introduction (2 min):** Explain that we are going to do an activity on perception and that students will see a series of images and report what they see and how confident they are.
  2. **Streak Induction (5 min):** 
     - Show a streak of 10 unambiguous images (e.g., 10 clear ducks). 
     - After each, students report what they see (to reinforce the expectation). 
     - Tell students that they will now see a series of images and should report what they see and their confidence.
  3. **Test Trials (8 min):**
     - Show 10 ambiguous images (the same ambiguous figure, e.g., the duck-rabbit) and 5 catch trials (unambiguous, e.g., 3 ducks and 2 rabbits randomly inserted). 
     - For each image, students record:
          - Perception: Duck or Rabbit?
          - Confidence: 1 to 5 (1=low, 5=high)
     - Alternatively, if using tokens for wagering: 
          - Before each test image, students place a token wager (0 to 3 tokens) on their report being correct. They are told that the image might be ambiguous or clear. They will get 1 point for each token if they are correct and lose the tokens if wrong. (Note: We are not using real money, but points for bragging rights.)

  **Part 2: Hints and Confidence (10 minutes)**
  1. **Ambiguous Figure without Hint (3 min):**
     - Show an ambiguous figure (e.g., the young/old woman) without any hint.
     - Students report what they see and their confidence (or wager).
  2. **Ambiguous Figure with Hint (3 min):**
     - Show the same ambiguous figure again, but this time with a hint (e.g., "This is often seen as a young woman").
     - Students report again.
  3. **Collect Data (4 min):** 
     - Collect the data from the test trials and the hint trials. This can be done by having students raise hands or by using a polling system. Alternatively, have them write on response sheets and then quickly tally.

  **Part 3: Group Data and Reflection (15 minutes)**
  1. **Display Group Data (5 min):** 
     - Show the class the aggregated results from the test trials (e.g., how many saw duck vs. rabbit in each of the 10 test trials, and the average confidence). Also show the catch trials to verify attention (should be near 100% correct). 
     - Show the shift in reports for the ambiguous figure with and without the hint.
  2. **Reflection Questions (10 min):** 
     - Ask students: 
          - "Did you feel that your perception changed because of the streak of ducks? Or did you just feel more inclined to report 'duck'?"
          - "When you saw the ambiguous figure the second time with the hint, did you actually see it differently, or did you just know that you should report what the hint said?"
          - "How did your confidence change? Was it tied to the clarity of the image or to your expectation?"

  **Part 4: Debrief and Theoretical Mapping (35 minutes)**
  1. **Introduction to the Debate (10 min):** 
     - Recap the activity and present the key question: Did the expectation (from the streak or the hint) change the perceptual experience itself, or did it change only the judgment or response?
     - Introduce the distinctions:
          - Attentional selection: Expectation might have directed attention to features that favor one interpretation, but the experience itself might not have changed in a way that counts as cognitive penetration.
          - Genuine cognitive penetration: The expectation directly altered the content of the perceptual experience.
          - Post-perceptual: The experience remained the same, but the judgment or response was biased.
          - Epistemic downgrade (Siegel): If a perceptual belief is formed under the influence of a prior belief, does that make it less justified?
  2. **Mapping the Activity (15 min):**
     - Discuss the group data: 
          - The streak likely induced a bias (most reports were 'duck' in the test trials). But note the catch trials: if they were reported correctly, it shows attention was maintained. 
          - The wagering: Did confidence remain high even for ambiguous trials? This might reveal that confidence was driven by expectation rather than stimulus clarity.
     - Point out that the activity cannot show from the inside whether the change was perceptual or post-perceptual. Even if it felt like the image changed, that feeling might be part of the judgment. 
     - Highlight that the entire pattern of reports is compatible with a judgment-only explanation (as per Firestone and Scholl). For instance, the same data could be explained by response bias without any change in perception.
  3. **Limitations and What the Activity Cannot Show (10 min):**
     - The activity cannot rule out post-perceptual explanations. Even if students report a change in perception, that report is still a judgment and might be influenced by the same top-down factors.
     - We cannot directly access the perceptual experience; we only have reports. This is the core of the methodological challenge in the cognitive penetration debate.

  **Predictable Failures and Fixes:**
  1. **Failure:** Students might not be induced by the streak (if the streak is too short or if they are aware of the manipulation). 
     - **Fix:** Use a longer streak (10 trials) and do not reveal the purpose until after. Also, use two different ambiguous figures to avoid carry-over from the first part to the hint part.
  2. **Failure:** The catch trials might be missed, indicating inattention. 
     - **Fix:** Remind students to pay attention. Also, if catch trials are missed, note that in the debrief as a limitation (but that's also a teachable moment about attention).
  3. **Failure:** The wagering might be confusing. 
     - **Fix:** Explain clearly and do a practice trial with an unambiguous image. Also, use tokens to make it tangible.
  4. **Failure:** The hint might not work for some students (they might resist the hint). 
     - **Fix:** That's okay; it can be discussed as individual differences.

  **Summary Table:**

  | Activity Moment          | What Participants Do                                                                 | Theoretical Distinction Targeted                                                                 | Predictable Failure and Fix                                                                                                | What the Activity Cannot Show From Within                                                                 |
  |--------------------------|--------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|
  | Streak Induction         | View 10 unambiguous images (e.g., ducks) and report what they see.                   | Setting up an expectation (top-down influence).                                                  | Failure: Streak too short to induce expectation. Fix: Use 10 trials and ensure they are consecutive and unambiguous.       | N/A (setup phase)                                                                                        |
  | Test Trials              | View 10 ambiguous images and 5 catch trials; report perception and confidence/wager. | Whether expectation biases perception or only the report (judgment).                             | Failure: Inattention during catch trials. Fix: Remind to pay attention; use catch trials to check.                         | Whether the shift is perceptual or post-perceptual (judgment).                                           |
  | Ambiguous Figure w/o Hint| View an ambiguous figure (e.g., young/old woman) and report.                         | Baseline perception without top-down hint.                                                       | Failure: Some may have prior exposure. Fix: Use a less common figure or note it as a limitation.                           | The raw perceptual experience without any influence.                                                     |
  | Ambiguous Figure with Hint| View the same figure with a hint (e.g., "young woman") and report.                   | The effect of a direct top-down hint on perception and confidence.                               | Failure: Hint not influential. Fix: Use a strong hint and a figure that is known to be susceptible to hints.               | Whether the hint changed the perception or only the judgment.                                            |
  | Group Data Reflection    | See aggregated data and reflect on their experience.                                 | The gap between subjective experience and objective data; the ambiguity in interpretation.       | Failure: Data not clear. Fix: Collect data quickly (use polling) and display clearly.                                      | The actual mechanism (perceptual vs. post-perceptual) behind the reports.                                |
  | Debrief: Distinctions    | Discuss attentional selection vs. penetration, perceptual vs. post-perceptual.       | Key distinctions in the cognitive penetration debate.                                            | Failure: Students conflate the distinctions. Fix: Provide clear definitions and examples.                                 | The activity cannot rule out judgment-only explanations (Firestone and Scholl critique).                 |
  | Debrief: Epistemic Downgrade | Discuss how trust in perception is affected by etiology.                           | Siegel's idea: if a belief penetrates perception, is the resulting belief less justified?        | Failure: Abstract concept. Fix: Relate to the activity: if the report was biased by the streak, should we trust it less?   | Whether the downgrade is warranted in the absence of knowing the mechanism.                              |
  | Debrief: Limitations     | Discuss what the activity cannot show.                                               | The methodological challenge: we only have reports, not direct access to perception.             | Failure: Students might think the activity proves penetration. Fix: Emphasize compatibility with alternative explanations. | The actual nature of the perceptual state (which is not directly observable).                            |

  This activity should provide a rich experiential basis for the subsequent debate on cognitive penetration, highlighting the key philosophical and empirical challenges.
answer: |-
  ### In-Class Activity: The Perceptual Expectation Experiment  
  **Objective:** Students experience top-down influences on perceptual reports, then confront the ambiguity between genuine cognitive penetration and post-perceptual explanations.  

  ---

  #### **Activity Design**  
  **Total Time:** 75 minutes  
  **Materials:**  
  - Projector + slideshow with:  
    - **Unambiguous streak slides:** 10 consecutive unambiguous images (e.g., 10 clear "duck" images for the duck-rabbit figure).  
    - **Test trials:** 15 slides (10 ambiguous duck-rabbit images + 5 unambiguous catch trials, e.g., 3 ducks/2 rabbits).  
    - **Hint trials:** 2 slides of the *same* ambiguous figure (e.g., young/old woman): one neutral, one with a hint ("Most see a young woman").  
  - Student response sheets (paper or digital) for:  
    - Perceptual report (e.g., "duck" or "rabbit").  
    - Confidence wager (tokens: 0–3 tokens per trial).  
  - Poker chips or paper tokens (10 tokens/student).  

  **Rules & Payoff Scheme:**  
  - **Tokens:** Students start with 10 tokens. Each trial, they wager 0–3 tokens on their report.  
  - **Payoff:** If correct (unambiguous catch trials only), they gain +1 token per wagered token. If wrong, they lose wagered tokens. **Ambiguous trials have no correct answer**—tokens are refunded, but wagers reveal confidence.  
  - **Goal:** Maximize tokens (bragging rights). Tokens highlight confidence independent of accuracy.  

  ---

  #### **Procedure**  
  **1. Introduction (5 min)**  
  - **Instructor:** Explain the activity as a "perceptual game" to explore how expectations shape reports. Emphasize honesty and focus.  
  - **Distribute:** Response sheets and tokens.  

  **2. Unambiguous Streak & Test Trials (20 min)**  
  - **Streak Phase (5 min):**  
    - Show 10 rapid unambiguous images (e.g., all ducks). Students report each (no wager). *Goal: Induce "duck" expectation.*  
  - **Test Phase (15 min):**  
    - Show 15 trials (10 ambiguous + 5 unambiguous catch trials in random order). For each:  
      1. Image flashes for 2 seconds.  
      2. Students report perception (duck/rabbit) and wager 0–3 tokens.  
    - **Instructor:** Record reports/wagers discreetly.  

  **3. Hint Trials (10 min)**  
  - **Neutral Trial (3 min):** Show ambiguous young/old woman figure. Students report + wager.  
  - **Hint Trial (3 min):** Show the *same* figure with hint ("Most see a young woman"). Students report + wager.  
  - **Data Collection (4 min):** Tally class reports/wagers for hint trials.  

  **4. Group Data & Reflection (15 min)**  
  - **Share Data (5 min):** Project aggregated results:  
    - Test trials: % "duck" reports in ambiguous trials, average wager.  
    - Catch trials: Accuracy (should be near 100%).  
    - Hint trials: Report shift (e.g., 60% "young woman" → 90% after hint).  
  - **Reflection Qs (10 min):**  
    - *"Did the streak make you *see* more ducks, or just *report* more ducks?"*  
    - *"When the hint changed your report, did the image *look* different?"*  
    - *"Did you wager more when you expected a certain image?"*  

  **5. Debrief & Theoretical Mapping (25 min)**  
  - **Distinctions (10 min):**  
    - **Attentional selection vs. genuine penetration:** Streak may prime attention to duck features, but is that penetration?  
    - **Perceptual vs. post-perceptual:** Data shows report shifts, but no proof *perception* changed (e.g., hints may bias judgment, not experience).  
    - **Epistemic downgrade (Siegel):** If reports are belief-driven, should we distrust them? E.g., high wagers on ambiguous trials reveal confidence detached from stimulus.  
  - **Limitations (5 min):**  
    - **Activity cannot show:** Whether changes are *perceptual* (genuine penetration) or *only judgment* (response bias). All data is compatible with post-perceptual explanations (Firestone & Scholl’s critique).  
    - **Instructor’s role:** Must clarify that external methods (e.g., neural imaging) are needed to isolate perception.  

  ---

  #### **Summary Table**  
  | Activity Moment         | What Participants Do                                                                 | Theoretical Distinction Targeted                                                                 | Predictable Failure and Fix                                                                                                | What the Activity Cannot Show From Within                                                                 |
  |-------------------------|--------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------|
  | **Unambiguous Streak**  | View 10 clear "duck" images; report each.                                            | Inducing top-down expectation (priming).                                                         | **Failure:** Weak priming if streak too short. **Fix:** Use 10 images; speed up display (500ms each).                      | N/A (setup phase).                                                                                        |
  | **Test Trials**         | Report perception + wager tokens on 15 trials (10 ambiguous, 5 catch trials).        | Confidence (wager) vs. accuracy; expectation-driven reports.                                     | **Failure:** Students ignore catch trials. **Fix:** Warn that catch trials affect token payoffs.                           | Whether reports reflect changed *perception* or only *judgment*.                                          |
  | **Hint Trials**         | Report + wager on ambiguous figure: first neutral, then with hint.                   | Direct belief effect (hint) on reports; confidence as an etiological marker (Siegel).            | **Failure:** Hint ignored by skeptics. **Fix:** Use social-pressure phrasing ("most see...").                              | If the hint alters *phenomenology* or only *interpretation*.                                              |
  | **Group Data Reflection** | View class reports/wagers; discuss introspective uncertainty.                      | Gap between subjective experience and objective data; ambiguity in attributing change.           | **Failure:** Data inconclusive (e.g., 50/50 split). **Fix:** Pre-test images to ensure bias; use large streak.             | The *mechanism* (perceptual vs. post-perceptual) behind shifts.                                           |
  | **Debrief: Distinctions** | Map activity outcomes to attentional/penetration, perceptual/judgment, downgrade.  | Core debate distinctions; epistemic implications of top-down etiology.                           | **Failure:** Students conflate attention with penetration. **Fix:** Define terms clearly; use whiteboard diagrams.         | Proof of *genuine* cognitive penetration (compatible with judgment-only).                                 |
  | **Debrief: Limitations** | Discuss why the activity can’t resolve the debate.                                 | Methodological gap: first-person reports vs. perceptual access.                                  | **Failure:** Students think wagers "prove" penetration. **Fix:** Stress compatibility with Firestone & Scholl’s critiques. | The *perceptual state itself*—only its behavioral outputs.                                                |

  ---

  #### **Predicted Problems & Solutions**  
  - **Problem:** Students "game" wagering (e.g., always bet 0 to save tokens).  
    **Fix:** Frame tokens as "confidence points," award praise for top scorers.  
  - **Problem:** Catch trials missed due to speed.  
    **Fix:** Extend catch trial display to 3 seconds; emphasize stakes.  
  - **Problem:** Hint trials produce no shift (e.g., if figure is familiar).  
    **Fix:** Use lesser-known figures (e.g., "man playing saxophone vs. woman’s face") or pre-test for bias.  

  **Outcome:** Students leave with first-hand insight into the ambiguity of top-down effects, setting the stage for deeper critique of empirical and philosophical claims in the cognitive penetration debate.
