prompt: |-
  I've been preparing a seminar on the revealed preference approach to rationality, and I keep landing on a set of verdicts about what observed choice actually reveals that I cannot quite unify. Let me lay them out and ask you to find the principle behind them, if there is one.

  The background, briefly: on this approach we do not assume we can read an agent's utility function off her introspection. Instead we infer what she values from what she chooses, given the options and the budget she actually faced, and we call a choice pattern rational if it can be represented as the maximization of some utility function over the available bundles. The question I am trying to pin down is not just when a pattern is representable, but what, if anything, the representability is doing — what it reveals about the agent, and what the utility function that does the representing really is.

  Here are my gut verdicts on a range of cases.

  1. A shopper who, on every occasion when both apples and oranges are available and she can afford both, buys the apples. I take this to reveal a genuine preference for apples over oranges.

  2. The same shopper buys oranges in midwinter, when apples are out of season and oranges are the only fruit on the shelf. I do not think this reveals any preference for oranges over apples; the set of available options changed, so the choice tells me nothing about how she ranks the two.

  3. A diner who, given a menu of A, B, and C, picks A when A and B are both offered, picks B when B and C are both offered, and picks C when C and A are both offered, with nothing else about her circumstances changing. I take this to reveal no stable preference at all: there is no single ranking of the three with which all three choices are compatible.

  4. A consumer who, faced with two physically identical cans of soup at different prices, always buys the cheaper one. I do not think this reveals a preference for "the cheaper can" as such; I think it reveals a preference for the soup together with whatever money is left over, and the price difference is just what makes one bundle better than the other.

  5. A household that buys less butter as its income rises and more margarine in return. I take this to be perfectly consistent with stable preferences — it reflects the fact that butter is an inferior good for them, not any incoherence in their ranking of bundles.

  6. Here is the pair I keep coming back to. On the one hand, when an agent's entire observed choice history is consistent in the strong sense — no choice she makes, directly or through a chain of intermediate choices, is ever reversed — I am inclined to say this reveals that the agent has a real, stable utility: a persistent psychological state that her choices express. On the other hand, the utility function that represents a consistent choice pattern is fixed only up to any monotonic transformation; I can rescale and reshape it and the choices it represents do not change. So I am also inclined to say that the utility function is not a literal thing with determinate magnitudes, but a mathematical representation of the ordering of her choices.

  I cannot see how to hold both halves of 6 at once. If the utility is a real psychological state, it seems strange that its values are arbitrary up to monotonic transformation; if it is only a representation, then what the consistency of choice reveals is a formal property of the choice pattern, not the existence of a real preference structure in the agent.

  So: is there a single principle that captures verdicts 1 through 6, or a small set of candidates that come close? For each candidate, state it precisely; say which of my cases motivates each clause of it; and give its verdicts on cases I have not raised — for instance, a person who consistently takes the smaller reward now over the larger reward later; a person whose choices are fully consistent only because she follows a fixed habit rather than any ranking of the options; and whether anything at all can be said, on this basis, about comparing one person's utility to another's. And finally, be candid about which of my verdicts your principle cannot accommodate, and whether I should drop one half of 6 — and if so, which one.
reasoning: |-
  Hmm, the user is grappling with the philosophical and practical tensions in revealed preference theory. They've laid out six intuitive verdicts about what choice behavior reveals about preferences, and are particularly struggling with the dual nature of utility functions in case 6 - both as psychological reality and as mathematical artifacts. 

  The core tension seems to be between realism (preferences exist in the mind) and formalism (preferences are constructs from choices). Case 6 captures this perfectly: consistent choices suggest stable psychological states, yet utility functions have arbitrary cardinal properties. This isn't just technical - it cuts to the heart of what economists mean by "rationality".

  Looking at their examples, they're actually modeling different aspects of revealed preference axioms: case 1-2 show how context matters for preference revelation, case 3 violates transitivity, case 4 demonstrates composite goods, case 5 allows for income effects. The real meat is in how to interpret the utility representation in case 6.

  I recall that Samuelson himself wrestled with this duality. The key insight might be separating the ordinal nature of preference (which choice consistency reveals) from any cardinal claims (which it doesn't). The psychological state exists, but only as an ordering - not as measurable "utils". This resolves the apparent contradiction: the stable preference is real, but any numerical representation is conventional.

  For the additional cases they requested: time preference would reveal discounting but not its functional form; habitual behavior might satisfy axioms accidentally but still "count" as rational; interpersonal comparisons remain impossible without stronger assumptions. Their verdict 4 about the soup cans is particularly astute - it shows they understand that choices reveal preferences over bundles, not isolated goods.

  The only slight tension is with their case 2 (winter oranges). Strictly speaking, choosing oranges when apples are unavailable doesn't reveal preference between them, but does reveal that oranges are preferred to no fruit. But this is consistent with the principle - unavailable alternatives aren't part of the choice set. 

  Ultimately, their intuition is sound across all cases. The "problem" in case 6 vanishes once we stop expecting utility functions to be anything more than convenient numerical shadows of ordinal relations. I should emphasize that revealed preference theory was never meant to capture psychological intensity - just consistent ordering.
answer: |-
  Based on your cases and the core tension in verdict 6, the unifying principle is the **Principle of Ordinal Consistency**:

  **An agent's choices reveal a stable, underlying ordinal preference relation over *complete consumption bundles* (including money and context), if and only if those choices satisfy the Weak Axiom of Revealed Preference (WARP) and the Strong Axiom of Revealed Preference (SARP) across all observed choice situations. The utility function representing this preference is an ordinal construct: only the ordering it represents is revealed and behaviorally meaningful; its cardinal values and specific form are not.**

  ### How Each Clause Applies to Your Cases
  1.  **"Stable, underlying ordinal preference relation"** (Cases 1, 5, 6a):
      *   Case 1: Consistent apple choices over oranges reveal a stable ordinal preference (Apples > Oranges) when both are available.
      *   Case 5: Income changes shifting demand reveal stable preferences where butter is inferior; the ordinal ranking of bundles (including money) remains consistent.
      *   Case 6a: Global consistency (SARP) strongly suggests a persistent underlying psychological ordering of bundles driving choices.

  2.  **"Over *complete consumption bundles* (including money and context)"** (Cases 2, 4):
      *   Case 2: Buying oranges when apples are unavailable reveals a preference for the bundle (Oranges + Money Spent) over (No Fruit + Money Saved) or other *available* bundles. It reveals *nothing* about (Oranges + Money) vs. (Apples + Money) because the latter bundle wasn't an option. The context (winter scarcity) is part of the bundle definition.
      *   Case 4: Choosing the cheaper can reveals a preference for the bundle (Soup + $Saved) over (Soup + $Spent_Extra). It doesn't reveal a preference for "cheap cans" intrinsically, but for the *bundle* containing soup and more money.

  3.  **"If and only if those choices satisfy WARP and SARP"** (Case 3, 6a):
      *   Case 3: The cycling choices violate SARP (A chosen over B; B chosen over C; C chosen over A). This directly reveals the *absence* of a stable underlying ordinal preference relation over {A, B, C}.
      *   Case 6a: Global SARP consistency is the *evidence* that reveals the existence of a stable underlying preference ordering.

  4.  **"The utility function... is an ordinal construct... only the ordering... is revealed"** (Case 6b):
      *   Case 6b: The invariance to monotonic transformation shows that choices only reveal the *ordinal ranking* of bundles (A > B, A > C, B > C, etc.). They reveal *no* information about the *intensity* of preference (how much better A is than B) or any unique numerical representation. The utility function is a tool to *represent* the revealed ordinal structure, not a direct measure of a cardinal psychological state.

  ### Resolving the Tension in Case 6
  The principle holds both halves simultaneously by distinguishing levels:
  1.  **The Revealed Ordinal Preference Relation:** This is the *real, stable psychological structure* revealed by SARP-consistent choices. It consists of the agent's persistent ranking of all possible bundles A > B, B > C, etc. This is what exists "in the mind" and drives consistent choice. (6a)
  2.  **The Utility Function:** This is a *numerical representation* of that ordinal relation. Any function that preserves the *order* (U(A) > U(B) whenever A > B) is behaviorally equivalent. The specific numbers (U(A)=10 vs. U(A)=100) and differences (U(A)-U(B)=5 vs. =50) are meaningless artifacts of the chosen representation; they are not revealed by choice data alone and do not correspond to a measurable psychological magnitude. (6b)

  **Consistency (SARP) reveals the existence of the ordinal relation (6a).** The utility function's arbitrariness under monotonic transformation shows that *only* the ordinal relation is revealed, not cardinal properties (6b). There is no contradiction: the stable psychological state *is* the ordinal ranking itself, and the utility function is merely one way to write it down mathematically.

  ### Verdicts on Additional Cases
  1.  **Consistent Smaller-Reward-Now vs. Larger-Reward-Later:**
      *   **Verdict:** Reveals a stable ordinal preference for the bundle (Small Reward + Now) over (Large Reward + Later). This is consistent with stable time preferences (e.g., high discount rate). The utility function would assign higher utility to (Small, Now) than to (Large, Later). *It does not reveal the shape or parameters of the discount function* (e.g., exponential vs. hyperbolic) unless choices across many finely varied time/money pairs satisfy SARP and pin down a specific functional form (which is still ordinal).

  2.  **Consistent Choices Driven Solely by Fixed Habit:**
      *   **Verdict:** If the habit leads to choices that *happen* to satisfy SARP globally (e.g., always choosing the leftmost item, but items are always presented in the same order and this aligns with some underlying preference), then the choices *reveal* an ordinal preference relation consistent with that pattern. The principle is agnostic about the *mechanism* (deliberate maximization vs. ingrained habit). **Revealed preference theory identifies rationality with the *consistency* of the choice pattern, not the cognitive process generating it.** If the habit leads to SARP violations (e.g., habitually choosing A over B, B over C, but C over A in a direct comparison), it reveals no stable preference.

  3.  **Interpersonal Utility Comparison:**
      *   **Verdict:** Revealed choice data, based solely on ordinal consistency (SARP), provides **no basis whatsoever for comparing utility levels or differences between individuals.** Person 1 choosing bundle A over B reveals U1(A) > U1(B). Person 2 choosing bundle X over Y reveals U2(X) > U2(Y). We cannot conclude *anything* about U1(A) vs. U2(X) or [U1(A)-U1(B)] vs. [U2(X)-U2(Y)]. Any such comparison requires additional, non-choice-based assumptions (e.g., assuming utility is cardinal and comparable, or assuming identical utility functions for certain goods).

  ### Accommodation and Limitations
  *   **Accommodated Well:** Cases 1, 2, 3, 4, 5, and both halves of 6 are accommodated by the Principle of Ordinal Consistency as stated.
  *   **Potential Tension (Case 2 Interpretation):** The principle strictly says winter orange choice reveals a preference *only* among *available* bundles. It does *not* reveal a preference for oranges *over apples* because (Apples + Price) wasn't available. However, your verdict says it "tells me nothing about how she ranks the two." This is true *only* if we strictly interpret "ranking" as direct pairwise comparison given the same budget/money. The principle *does* allow us to infer that the bundle (Oranges + Price) is preferred to the bundle (Apples + Price) *if* we observe her choosing oranges *when both are available at the same price and budget allows both*. The winter choice alone doesn't provide that direct pairwise data. Your verdict is correct within the strictest interpretation. The principle supports it.
  *   **No Need to Drop Half of 6:** The distinction between the revealed ordinal relation (real, stable psychological structure) and its cardinal utility representation (arbitrary mathematical tool) resolves the apparent tension. Drop neither.

  ### Conclusion
  The Principle of Ordinal Consistency captures your core intuitions. Choice reveals a stable psychological *ordering* of complete bundles *if and only if* choices are consistent (SARP). The utility function is a faithful *representation* of this ordering, but its specific numbers are not meaningful psychological quantities. This explains why intensity isn't revealed (6b), why context/bundle definition matters (2, 4), why violations show incoherence (3), and why stable preferences can manifest in complex ways like inferior goods (5). It denies interpersonal comparability and shows that consistent habits, even if not consciously maximizing, still *reveal* a stable preference ordering. The real psychological state revealed is the ordinal ranking itself.
