prompt: |-
  I just spent two hours in a pub arguing about Bell's theorem with a friend who works in quantum info, and I'm still not sure who won, so I want a second opinion. His claim, roughly: Bell's theorem is often sold as the result that "spooky action at a distance is real," but what it actually rules out is much narrower, and he thinks people who say otherwise are sloppy. He draws a line between two conditions: one is no-signaling, the requirement that the marginal statistics at Alice's station don't depend on which setting Bob chooses (and vice versa), and the other is what he calls "real locality," where the outcome at Alice's wing is a function only of her local setting and whatever pre-existing state was there in her neighborhood, with no dependence on Bob's distant choice. He says quantum mechanics violates the second but perfectly satisfies the first, and the theorem only shows the second is incompatible with the observed correlations, so any claim that it proves nonlocal influences or faster-than-light effects is overreach. He also threw in that anyone who wants to keep the second condition has to pay for it by assuming the experimenters' setting choices are statistically independent of the hidden variables, which he called "a conspiracy assumption" and waved away as obviously unreasonable.

  What I want from you is a careful comparison of these two conditions, because I think the friend is right about some parts and wrong about others and I can't tell where the line is. Specifically: can you state both conditions precisely (in words or with the probability notation), show that no-signaling does not imply the stronger locality condition, and then explain exactly what Bell's theorem does and doesn't rule out? I'd especially like an honest treatment of the measurement independence / "conspiracy" point: how much fine-tuning of the hidden variable distribution is actually needed to reproduce the quantum correlations if you keep the stronger locality condition, and is there any principled way to decide whether that's genuinely conspiratorial or just a different kind of fine-tuning, like the one physicists tolerate everywhere else? And finally, does the fact that no-signaling survives the theorem actually give us a reason to be satisfied with "no faster-than-light signaling" as a substitute for locality, or is that a cop-out that quietly gives up something important? I'd rather have a clear verdict with the strongest steelman of my friend's position than a wishy-washy summary.
