prompt: |-
  I'm a senior editor at a fact-checking desk, and we get the same dispute almost every week: a speaker says something that implicates a claim, and either we flag the implicature as a checkable claim and the speaker's office responds that they never said it, or we don't flag it and readers accuse us of letting a misleading statement slide. I need a decision procedure my fact-checkers can run on any utterance to decide whether it carries an implicature strong enough to be treated as a checkable claim, grounded in Grice's account of conversational implicature and speaker meaning.

  Give me the tests to run in order — the ones that actually matter, including the distinction between conversational and conventional implicature, the flouting-versus-violating distinction, and the standard tests (cancellability, non-detachability, calculability, non-conventionality) — what counts as a sufficient answer to each, where the procedure stops with "not checkable," and where it has to hand the call to me, the signing editor, because the question is one of judgment rather than a fact.

  Then run it on these three utterances, showing for each which tests you ran, what each returned, and where the procedure lands (checkable, not checkable, or hand to editor): (1) a plant manager says "We've never had a single safety incident at this plant"; (2) a company spokesperson, asked whether their product caused the injury, replies "We've always been committed to safety"; (3) an obituary says "He was a brilliant, if erratic, scientist." At least one of these should land where I won't like it — for example, "don't fact-check" when the speaker seems to be misleading, or "check it" when the speaker could plausibly deny it.

  Separate clearly what is settled in the Gricean literature from what is genuinely contested among people who work on this (for instance, whether implicature comes in degrees, whether the said/implicated boundary is sharp, and whether the cooperative principle is a descriptive or a normative claim), and don't present a contested view as if it were the consensus.

  Keep the entire response under 1,200 words.
reasoning: |-
  Alright, the user is a senior editor at a fact-checking desk dealing with recurring disputes about implicatures in statements. They need a clear, step-by-step procedure based on Grice's theory to determine when an implicature should be treated as a checkable claim. The key issues involve distinguishing conversational from conventional implicatures, flouting versus violating maxims, and applying standard tests like cancellability and calculability.

  First, I recall Grice's Cooperative Principle and the maxims of conversation. The user mentioned they often face pushback when flagging implicatures, so the procedure must be robust enough to handle denials from speakers. The challenge is balancing between missing misleading statements and overstepping by attributing claims not intended by the speaker.

  The decision procedure needs structured steps. Starting with the locutionary act to establish what is literally said is crucial. Then, identifying if there's an implicature. Conventional implicatures are attached to specific words, like "but" or "therefore," and are part of the sentence meaning. For example, "He was brilliant but erratic" implies a contrast. These aren't easily cancellable, so they might be checkable. 

  Next, conversational implicatures arise from context. The tests here are cancellability, non-detachability, calculability, and non-conventionality. Cancellability is key—if the speaker can add a clause denying the implication without contradiction, it's likely conversational and not checkable. Non-detachability checks if rephrasing removes the implication. If not, it might be conventional. Calculability requires that the implication follows from the maxims and context. 

  The user provided three examples. The plant manager's statement about no safety incidents is straightforward; it's directly asserted, so fact-checkable. The spokesperson's reply about commitment to safety implicates that the product didn't cause injury. Applying the tests: it's cancellable (they could add "but it did cause injury"), non-detachable (rephrasing keeps the implication), calculable (flouting relevance), and non-conventional. Since it's cancellable, it shouldn't be checked. However, readers might see this as misleading, so it's a judgment call for the editor. 

  The obituary's "brilliant, if erratic" uses "if" which conventionally implies a concession. It's not cancellable without oddity, non-detachable, and calculable. This suggests it's a conventional implicature, hence checkable. The fact-checkers would need to verify if he was brilliant and erratic. 

  Contested areas: The boundary between said and implicated isn't sharp. Some theorists like Relevance Theory argue implicatures can be stronger or weaker. The Cooperative Principle's normativity is debated—whether it's a norm or descriptive. These points mean the procedure isn't foolproof, requiring editorial judgment in gray areas. 

  For the spokesperson's case, even though cancellable, the context of avoiding a direct answer might warrant flagging. The editor's role is crucial here. The user won't like that the procedure says not to check it, but the theoretical grounding supports that decision. It's important to note that while the procedure is based on Grice, practical considerations might override in high-stakes contexts. 

  In summary, the procedure provides a structured approach but acknowledges limitations. Highlighting contested areas ensures transparency, and specifying when to escalate to the editor balances theoretical rigor with practical needs.
answer: |-
  Here is a decision procedure grounded in Gricean implicature theory, designed for practical application in fact-checking, followed by analysis of your examples.

  **Decision Procedure: Is the Implicature Checkable?**

  1.  **Establish the Locutionary Act (What is Literally Said?):**
      *   **Test:** What is the literal meaning of the words used? Ignore context and implications for now.
      *   **Outcome:** If the literal statement itself is checkable, flag it. Stop. If not, proceed.
      *   **Handoff Point:** None (Literal meaning is primary).

  2.  **Is there an Implicature? (Grice's Cooperative Principle & Maxims):**
      *   **Test:** Is the speaker *appearing* to violate a maxim (Quality, Quantity, Relation, Manner) in a way that makes sense only if they intend to communicate something beyond the literal meaning? Or does the context make an additional meaning necessary for the utterance to be cooperative?
      *   **Sufficient Answer:** Yes - If the utterance seems irrelevant, insufficient, unnecessarily obscure, or potentially misleading/false *unless* an additional meaning is inferred. No - If the literal meaning fully satisfies conversational expectations within the context. Unclear - If reasonable people could disagree.
      *   **Outcome:** No Implicature? → Not checkable. Stop. Clear Implicature? → Proceed. Unclear? → Hand to Editor.

  3.  **Conventional or Conversational Implicature?**
      *   **Test:** Is the implication carried by conventional meaning of specific words/phrases (e.g., "but", "therefore", "even", "if" in concessive sense) rather than context?
      *   **Sufficient Answer:** Conventional - If changing the words (while keeping literal meaning similar) removes the implication *or* if it cannot be cancelled without semantic oddity. Conversational - If the implication persists through rephrasing (non-detachability) and *can* be cancelled. Mixed/Unclear - If both factors seem present.
      *   **Outcome:** **Conventional Implicature:** Treat as part of the "said" content. Flag as checkable. Stop. **Conversational Implicature:** Proceed. **Mixed/Unclear:** Hand to Editor.

  4.  **Apply Conversational Implicature Tests:**
      *   **a. Cancellability:**
          *   **Test:** Can the speaker plausibly add a clause *explicitly denying* the implication without contradiction or absurdity? (e.g., "We're committed to safety, *and that product did cause the injury*").
          *   **Sufficient Answer:** Yes (Easily Cancelled) → Implication likely weak/unintended; **Not Checkable.** Stop. No (Cancellation causes contradiction/weirdness) → Proceed. Marginal/Context-Dependent → Hand to Editor.
      *   **b. Non-detachability:**
          *   **Test:** If you rephrase the utterance to convey the *same literal meaning* using different words, does the implication persist?
          *   **Sufficient Answer:** Yes (Persists) → Strong indicator of conversational implicature. Proceed. No (Detached) → Suggests conventional implicature or no implicature; revisit Step 3 or conclude Not Checkable. Stop.
      *   **c. Calculability:**
          *   **Test:** Can you reconstruct a reasonable argument for *why* the speaker would imply this? (X said P; to believe P true, and be cooperative/maxim-observing, they must think Q, and expect me to think Q).
          *   **Sufficient Answer:** Clear Calculation → Strengthens case for intended implicature. Proceed. Unclear/Vague Calculation → Weakens case. Hand to Editor or conclude Not Checkable.
      *   **d. Non-conventionality:**
          *   **Test:** Is the implication *not* part of the conventional meaning of the words/syntax? (Linked to Step 3).
          *   **Sufficient Answer:** Yes → Conversational. Proceed. No → Conventional. Flag as checkable. Stop.
      *   **Outcome:** If Passing Non-detachability, Calculability, Non-conventionality, and **Failing Cancellability**: Strong Conversational Implicature. Flag as checkable. Stop. If **Passing Cancellability**: Not Checkable. Stop. Mixed/Unclear Results: Hand to Editor.

  **Contested Ground (Clarification):**
  *   **Degrees of Strength:** Grice treated implicature as largely binary (present/absent), but many (e.g., Relevance Theorists) argue implicatures have varying strengths based on context. Our procedure uses tests as thresholds.
  *   **Said/Implicated Boundary:** While Grice aimed for a clear distinction based on truth-conditions, significant debate exists (e.g., Carston's concept of "explicature"). Our procedure relies on conventionality tests and cancellability as practical demarcators.
  *   **Cooperative Principle (CP):** Grice presented the CP as a *normative* principle governing rational communication. However, whether this is a universal descriptive fact or a culturally specific norm is debated. The procedure assumes speakers *generally* adhere to the CP/maxims for communication to function, which is its core insight.

  ---

  **Analysis of Examples:**

  1.  **Plant Manager: "We've never had a single safety incident at this plant."**
      *   **Step 1:** Literally asserts zero safety incidents. Directly checkable. **Outcome: Checkable.** Stop.

  2.  **Spokesperson: (Asked if product caused injury) "We've always been committed to safety."**
      *   **Step 1:** Literally asserts a commitment to safety. True? Checkable on its own, but likely not the point. Proceed.
      *   **Step 2:** Asked a direct yes/no question, gives an indirect answer. Apparent violation of Relation/Quantity maxims. Implicature present: The product did *not* cause the injury (or at least, the company believes it didn't). Proceed.
      *   **Step 3:** "Committed to safety" doesn't conventionally imply "didn't cause injury." Rephrasing ("Safety is our top priority") keeps the implication. → **Conversational Implicature.** Proceed.
      *   **Step 4a (Cancellability):** **Crucial Test.** Can they cancel? "We've always been committed to safety, *and we acknowledge that this product did cause the injury*." → *Plausible, though damaging*. **Yes, easily cancellable.**
      *   **Outcome:** Based on **Cancellability Test**: **Not Checkable.** Stop. (This is the one you won't like - the implication is strong and potentially misleading, but they *can* deny it was intended).

  3.  **Obituary: "He was a brilliant, if erratic, scientist."**
      *   **Step 1:** Literally asserts brilliance and erraticness. Both checkable? Proceed to check conventional implicature.
      *   **Step 3:** **Crucial Test.** The word "if" (or "though") used concessively carries a **Conventional Implicature**: There is a contrast between brilliance and erraticness, and the latter is presented as a concession/diminisher relative to the former. Changing words ("He was brilliant but erratic", "He was brilliant, though erratic") keeps the contrast. Cancelling is odd: \*"He was brilliant, if erratic, and there was no contrast between these traits" → Contradictory/weird.
      *   **Outcome:** Based on **Conventional Implicature Test**: The contrast/concession is part of the conventional meaning. **Checkable.** (Fact-check brilliance, erraticness, *and* the appropriateness of the contrast/concession implied).

  **Procedure Summary:**
  1.  Literal Meaning? → Checkable? (Stop Yes/No)
  2.  Implicature Likely? (CP/Maxims) → No: Stop. Unclear: Handoff. Yes: Proceed.
  3.  Conventional? → Yes: Checkable (Stop). Conversational/Mixed: Proceed/Handoff.
  4a. Conversational: **Cancellable?** → Yes: Not Checkable (Stop). No: Proceed.
  4b/c/d. Conversational: Non-detachable? Calculable? Non-conventional? → All Pass + Non-Cancellable: Checkable. Else: Handoff/Not Checkable.
