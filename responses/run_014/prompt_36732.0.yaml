  ### Bayesian Updater Quiz: Conditional Testimony Edition  
  Answer based on your intuition about what the agent's posterior credence should be. Choose the option that feels correct without worrying about formal terms.

  ---

  **Question 1: Original Judy Benjamin Problem**  
  You’re dropped into a swamp divided into four equally likely areas:  
  - Red territory, Red company (RR)  
  - Red territory, Blue company (RB)  
  - Blue territory, Red company (BR)  
  - Blue territory, Blue company (BB)  
  A reliable radio message: *"If you’re in Blue territory, you’re 3 times as likely to be in a Red company area as a Blue company area."*  
  What is your new credence that you’re in Blue territory?  
  A. \( \frac{1}{2} \)  
  B. \( \frac{2}{5} \)  

  **Question 2: Exaggerated Conditional**  
  Same setup as Question 1, but you know the radio operator exaggerates ratios by doubling them. They say: *"If in Blue territory, you’re 3 times as likely to be in a Red company area."*  
  What is your new credence that you’re in Blue territory?  
  A. \( \frac{1}{2} \)  
  B. \( \frac{2}{5} \)  
  C. \( \frac{1}{3} \)  

  **Question 3: Conflicting Antecedent Evidence**  
  Same setup as Question 1, but your prior credence in Blue territory is 0.8 (due to independent evidence), and areas within each territory are equally likely. The radio message is the same.  
  What is your new credence in Blue territory?  
  A. 0.8  
  B. 0.5  

  **Question 4: Sloppy Informant**  
  Uniform prior over RR, RB, BR, BB. The radio says: *"If in Blue territory, you’re 3 times as likely to be in a Red company area."* But you know the informant is sloppy: 50% chance they meant this, 50% chance they *meant* to report on Red territory (i.e., *"If in Red territory, you’re 3 times as likely to be in a Red company area"*).  
  What is your new credence in Blue territory?  
  A. \( \frac{1}{2} \)  
  B. \( \frac{2}{5} \)  

  **Question 5: Weather Forecaster Match**  
  Your credences:  
  - Rain (R): \( P(R) = 0.1 \)  
  - If rain, match moved (M): \( P(M \mid R) = 0.9 \)  
  - If no rain, match never moved: \( P(M \mid \neg R) = 0 \)  
  A forecaster says: *"If it rains, there’s a 90% chance the match is moved."* This matches your beliefs. What is your new \( P(R) \)?  
  A. 0.1  
  B. 0.09  

  **Question 6: Redundant Conditional**  
  Same as Question 5, but your prior already has \( P(M \mid R) = 0.9 \). The forecaster repeats: *"If rain, 90% chance the match is moved."* What is your new \( P(R) \)?  
  A. 0.1  
  B. 0.09  

  **Question 7: Conflicting Conditional**  
  Same as Question 5, but your prior has \( P(M \mid R) = 0.5 \). The forecaster says: *"If rain, 90% chance the match is moved."* What is your new \( P(R) \)?  
  A. 0.1  
  B. 0.09  

  **Question 8: Unconditional Report**  
  Uniform prior over RR, RB, BR, BB. The radio says: *"You’re not in the Blue company area within Blue territory"* (i.e., not in BB). What is your new credence in Blue territory?  
  A. \( \frac{1}{2} \)  
  B. \( \frac{1}{3} \)  

  ---

  ### Scoring Key  
  Match your answer patterns to the positions. Positions are defined by how they handle conditional testimony:  

  1. **Jeffrey Updater** (Treats conditional reports as ordinary evidence, updates via Jeffrey's rule):  
     - Q1: B, Q2: B or C, Q3: B, Q4: B, Q5: A, Q6: A, Q7: A, Q8: B  
     - *Rationale*: Bites the bullet on Q1 (antecedent credence drops to \( \frac{2}{5} \)), generally updates the antecedent when conditional reports conflict with priors (Q3), and treats sloppiness (Q4) as asymmetric evidence.  

  2. **Ratio Constraint Updater** (Preserves antecedent probability; only updates conditional within the antecedent):  
     - Q1: A, Q2: A, Q3: A, Q4: A, Q5: A, Q6: A, Q7: A, Q8: B  
     - *Rationale*: Antecedent credence never changes (Q1–Q4, Q5–Q7). Unconditional reports (Q8) are handled normally.  

  3. **KL-Minimizer** (Minimizes Kullback-Leibler divergence from prior, subject to the constraint):  
     - Same as **Jeffrey Updater** for all questions.  
     - *Note*: In these cases, KL-minimization coincides with Jeffrey updating. The quiz cannot separate them.  

  4. **Skeptic** (No fact of the matter; no unique posterior):  
     - Inconsistent or mixed patterns (e.g., Q1: A or B, but Q3: —, Q4: —). Rejects unique updates for conditionals.  

  ### Ambiguities and Incoherent Patterns  
  - **Jeffrey/KL-Minimizer overlap**: Q2, Q3, and Q4 cannot separate Jeffrey updating from KL-minimization. Both recommend similar updates here.  
  - **Incoherent pattern**: Q5–Q7 with **B** options. Conditional testimony doesn’t directly affect the antecedent’s probability (no position does this).  
  - **Skeptic patterns**: Any answers skipping Q1/Q3/Q4 or mixing A/B randomly.  
  - **Untested**: The "sloppy informant" (Q4) doesn’t cleanly separate skeptics from others, but skeptics may omit it.  

  **Note**: Positions are defined by *how* they update, not theorem names. Share your pattern in the seminar chat to reveal your updater type!
