  Please write me the quiz: 8-10 questions, each a concrete case of conditional-ish testimony where the positions genuinely come apart, with 2-3 answer options apiece phrased so someone can answer without knowing any of the position labels. Include at least: (1) the original swamp case, where I want one option that bites the bullet on whatever the answer implies about Judy's credence in the antecedent region itself; (2) a variant where the radio operator is known to exaggerate conditionals by a fixed factor; (3) a case where the conditional report conflicts with independent evidence you already have about the antecedent (like a weather forecaster saying "if rain, 90% the match is moved" while your own prior on rain is doing all the work); and (4) a case where the informant is just sloppy and maybe mixed up which conditional they were reporting.

  Then a scoring key mapping answer patterns onto: treating the report as ordinary partial evidence and just Jeffrey-updating on the region; holding that only certain constraints get preserved and there's no unique posterior; picking the posterior that minimizes some distance from the prior subject to the constraint; and the skeptical "no fact of the matter" option. Note which pairs of positions your questions can't actually separate, and point out any answer-combination that no real position occupies (and say whether that's because it's incoherent or just nobody's bothered). Keep the questions about what she should now believe, not about which theorem is named after whom.
