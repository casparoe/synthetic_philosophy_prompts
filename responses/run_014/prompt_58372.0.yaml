prompt: |-
  My mate tried to sum up prioritarianism for me after our political philosophy seminar and it sounded a bit too neat. He said prioritarianism means we should maximise total happiness but give bonus points for happiness that goes to worse-off people, so it cares about equality but would never approve making everyone worse off just to make things equal, unlike strict egalitarians who have to say its actually good to bring the better-off down to the level of the worse-off even if nobody gains. That means prioritarians totally dodge the levelling-down objection, he reckons, and the only arguement left is about how much extra weight to give.

  I'm not sure what to trust here. Can you audit his summary claim by claim and tell me what a prioritarian would actually sign up to and whether his dodge conclusion survives once you fix the mistakes? I keep thinking about my own wierd case: two carers on 30 and 80 wellbeing, and we can either leave it or shift to 31 and 31 by wasting a lot — would a prioritarian really say no every time?

  Please put the audit in a table with these four columns: His Claim | Verdict [accurate / oversimplified / wrong] | What a defender would correct | Matters for his dodge conclusion [yes/no + one line why].
reasoning: |-
  Okay, the user is asking me to audit their mate's summary of prioritarianism. Let me start by recalling what prioritarianism actually is. Prioritarianism is a theory in ethics that gives more weight to the well-being of the worse off. The mate described it as maximizing total happiness with bonus points for helping the worse off. I need to check each part of that summary.

  First claim: "maximise total happiness but give bonus points for worse-off." The key here is that prioritarianism uses a concave transformation function. That means each unit of well-being for a worse-off person counts more. So instead of just adding up well-being like utilitarianism, they apply weights. The mate's "bonus points" is a simplification, but the core idea is right. Verdict should be accurate but oversimplified because it's not just bonus points; it's a fundamental weighting.

  Next, "cares about equality but would never approve making everyone worse off." Prioritarians care about equality indirectly because weighting the worse off reduces inequality. But they wouldn't support leveling down. If an action makes everyone worse off, even if equal, the priority view would reject it since total weighted well-being decreases. So the mate is correct here. Verdict: accurate.

  Then, the part about strict egalitarians. Strict egalitarians do see leveling down as good in terms of equality, even without gains. That's a standard objection to them. Prioritarianism avoids this because it requires actual benefits. So the mate's contrast is right. Verdict: accurate.

  The mate claims prioritarians dodge the leveling-down objection entirely. The leveling-down objection is that making things equal by reducing some people's well-being without helping others isn't desirable. Prioritarians avoid this because they only value increases in well-being, not equality for its own sake. So in the user's example, moving from (30,80) to (31,31), the prioritarian would calculate the weighted well-being. Using a square root function, the original is about 5.48 + 8.94 = 14.42. The new is 5.57 + 5.57 = 11.14, which is less. So they'd reject it. The mate is correct that they dodge the objection. Verdict: accurate.

  The user's specific case: two carers at 30 and 80, option to go to 31 and 31. As above, the prioritarian would say no because the total weighted well-being decreases. The mate's claim holds here. But the user might wonder if different weighting functions could change that. However, any strictly concave function will have this result because the loss at 80 is steep. So the dodge conclusion survives.

  Now, the mate says the only argument left is how much extra weight to give. That's oversimplified. There are other debates, like whether prioritarianism is distinct from egalitarianism, or if it handles other cases well. Critics might argue it ignores relational equality or fairness. So while the weighting is a key issue, it's not the only one. Verdict: oversimplified.

  For the table, each claim needs a verdict, correction, and if it affects the dodge conclusion. The dodge conclusion is that prioritarianism avoids leveling down. Most claims support that, except the last one about "only argument" which doesn't impact the dodge.

  User's deeper need: They might be concerned if prioritarianism is too simplistic or if there are hidden flaws. Their example shows they're testing edge cases. They want assurance that the theory is robust and whether their mate's confidence is justified. Also, they might be looking for criticisms beyond what the mate mentioned.
answer: |-
  Here's the audit of your mate's claims about prioritarianism, structured as requested. The analysis uses standard prioritarian theory (e.g., Parfit's "priority view") and your case (30 vs. 80 → 31 vs. 31) as a test.

  | His Claim                                                                 | Verdict                   | What a defender would correct                                                                 | Matters for his dodge conclusion? (yes/no + why)                                 |
  | :------------------------------------------------------------------------ | :------------------------ | :-------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------- |
  | **"Maximise total happiness but give bonus points for happiness to worse-off people."** | Oversimplified             | Not "bonus points" *on top of* total happiness; instead, **maximise a *weighted sum*** where each unit of well-being gains **greater moral value** the lower the recipient's absolute level. It transforms well-being via a strictly concave function (e.g., square root, log). | **No.** Core weighting mechanism is correctly implied, even if terminology is loose. |
  | **"Cares about equality"**                                                | Oversimplified / Partially Wrong | Cares about **absolute deprivation**, not equality *per se*. Reducing inequality is a *consequence* of weighting the worse-off, not the goal. A prioritarian might prefer (40, 50) over (30, 60) even though inequality is identical, because the worst-off is better. | **No.** The *reason* it "cares" doesn't change the leveling-down dodge.          |
  | **"Would never approve making everyone worse off just to make things equal"** | **Accurate**              | Precisely correct. Prioritarians only value *increases* in (appropriately weighted) well-being. Destroying well-being without benefiting anyone (especially the worst-off) always decreases overall value. | **Yes.** This is the **core reason** prioritarians dodge the leveling-down objection. |
  | **"Unlike strict egalitarians who must say leveling-down is good"**       | **Accurate**              | Correct. Strict egalitarianism values equality intrinsically, so reducing inequality via leveling-down has value *even if no one gains*. Prioritarianism rejects this. | **Yes.** Highlights the key contrast enabling the dodge.                       |
  | **"Prioritarians totally dodge the leveling-down objection"**             | **Accurate**              | Defenders agree: Leveling-down *never* improves the prioritarian objective function (weighted well-being sum). It only destroys value. | **Yes.** This is the **central claim** being evaluated.                      |
  | **"The only argument left is about how much extra weight to give"**       | **Oversimplified**        | While weighting strength *is* a major debate, other arguments exist: Is prioritarianism meaningfully distinct from egalitarianism? Does it ignore the *relational* bad of inequality? Does it handle "negative well-being" correctly? Is it too insensitive to the well-off? | **No.** Weighting debates don't undermine the leveling-down dodge itself.        |
  | **Implied: "In your 30/80 vs 31/31 case, a prioritarian would say NO every time"** | **Accurate** (**Key Test**) | **Calculation (e.g., using sqrt):** Original: √30 + √80 ≈ 5.48 + 8.94 = **14.42**. New: √31 + √31 ≈ 5.57 + 5.57 = **11.14**. **14.42 > 11.14** → Reject the change. *Any* strictly concave weighting function will show a loss because the huge drop for the 80->31 person vastly outweighs the tiny gain for the 30->31 person. No plausible weight would approve this. | **Yes.** Proves the leveling-down dodge works in concrete cases.                 |

  **Conclusion on the Dodge:** Your mate's **core claim that prioritarians dodge the leveling-down objection survives scrutiny and is accurate.** This is because:
  1.  **Value is strictly increasing in individual well-being:** Hurting someone *always* reduces moral value under prioritarianism, regardless of equality effects.
  2.  **No intrinsic value to equality:** Leveling-down only destroys well-being without creating any countervailing value from increased equality.
  3.  **Your test case confirms:** The massive loss to the better-off (80->31) *always* outweighs the tiny gain to the worse-off (30->31) under any prioritarian weighting, resulting in a net loss of weighted well-being.

  **Where the Summary Was Weak:** The "bonus points" metaphor slightly misrepresents the *fundamental* structure (it's a weighted sum, not total plus extras), and saying the *only* debate is about weighting strength overlooks other philosophical critiques. However, **none of these oversimplifications undermine the accurate core claim about dodging leveling-down.** Prioritarians genuinely avoid endorsing making anyone worse off purely for equality's sake.
