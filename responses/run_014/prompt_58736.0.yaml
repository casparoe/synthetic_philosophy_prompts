  Below is a complete, runnable 75-minute session plan centered on the **Vault Bet** game. The activity uses the irrational exponent proof (which students know) as a template but replaces it with a fictional, tangible decision to avoid mathematical distractions. Students experience how nonconstructive proofs fail to guide action, while explicit witnesses enable effective decisions—setting the stage for intuitionistic concepts without naming them until the debrief.

  ---

  ### **Session Overview**
  **Core Tension**: Classical proofs guarantee *existence* of a winning choice (vault or strategy), but without revealing *which one*. Teams must stake tokens to act, systematically penalizing guesses and rewarding witnesses.  
  **Learning Goal**: Students intuit why proofs demanding explicit witnesses/strategies are pragmatically necessary.  
  **Materials**: 
  - Tokens (≈100 per team, poker-chip style; red = 1 point, blue = 5 points)  
  - Index cards (for team decisions)  
  - Whiteboards (for rules/outcomes)  
  - 2 sealed envelopes labeled "VAULT A" and "VAULT B" (each contains a card: "WIN" or "LOSE")  
  - 1 "STRATEGY MANUAL" envelope (contains instructions for a simple game)  

  ---

  ### **Preparation (5 min)**
  1. **Divide students** into 4 teams (5–7 students each).  
  2. **Distribute materials**:  
     - Each team gets 100 tokens (mix of red/blue) and 5 index cards.  
     - Post rules on a whiteboard:  
       > **Vault Bet Rules**:  
       > - Stake tokens to open a vault or use a strategy.  
       > - Winning action: +20 tokens. Losing action: -20 tokens.  
       > - Buying a witness (if offered): -5 tokens.  

  3. **Set up envelopes**:  
     - **Vault A/B envelopes**: Pre-determine that *exactly one* contains "WIN" (e.g., Vault A wins if a coin flip was heads; keep result hidden).  
     - **Strategy Manual**: Contains a solved 2-player game (e.g., Nim) where Player 1 has a winning strategy.  

  ---

  ### **Round 1: Disjunction Dilemma (25 min)**  
  *Simulates a nonconstructive disjunction (like the irrational exponent case-split). Teams know one vault wins but not which.*  

  1. **Introduce the Vault Bet (3 min)**:  
     > "A proof guarantees *one* of these vaults contains a treasure (WIN), but we don’t know which. Stake 20 tokens to open a vault. If it wins, gain 40 tokens (net +20); if it loses, gain nothing (net -20)."  

  2. **Team Deliberation (10 min)**:  
     - Teams debate which vault to open using *only classical knowledge* (one wins, one loses).  
     - **Output**: Each team writes their choice ("A" or "B") and stakes 20 tokens on an index card.  

  3. **Reveal Outcomes (5 min)**:  
     - Open envelopes and announce the winning vault (e.g., "Vault A wins!").  
     - Adjust tokens: Winners gain 40 tokens; losers gain 0.  

  4. **Quick Reflection (2 min)**:  
     > "Did knowing ‘one vault wins’ help you choose correctly? Why or why not?"  

  ---

  ### **Round 2: Strategy Existence (30 min)**  
  *Simulates a nonconstructive existence claim (e.g., "a winning strategy exists"). Teams know a winning strategy exists but lack the method.*  

  1. **Introduce the Strategy Bet (5 min)**:  
     > "A proof guarantees *one* player has a winning strategy in this 2-player game. Stake 20 tokens to play as Player 1 or 2. If you pick the winning player *and* win the game, gain 40 tokens (net +20); otherwise, gain nothing (net -20).  
     > **NEW OPTION**: Pay 5 tokens to see the ‘Strategy Manual’ (witness) revealing who wins and how."  

  2. **Team Deliberation (15 min)**:  
     - Teams choose:  
       - **Option 1 (Guess)**: Pick Player 1 or 2 without the manual.  
       - **Option 2 (Buy Witness)**: Pay 5 tokens, see the manual, then pick the winning player.  
     - **Output**: Teams write their choice on an index card (e.g., "Play as P1, no witness" or "Buy witness → Play as P2").  

  3. **Reveal Outcomes (7 min)**:  
     - **For guessers**: Simulate one round of the game (e.g., Nim). Teams who guessed wrong lose instantly.  
     - **For witness-buyers**: They automatically win (they know the correct player/strategy).  
     - Adjust tokens: Winners gain 40 tokens (minus 5 if they bought the witness); losers gain 0.  

  4. **Quick Reflection (3 min)**:  
     > "How did buying the witness change your decision? Would you trust a proof that says ‘a strategy exists’ without showing it?"  

  ---

  ### **Debrief: Connecting Play to Constructivism (15 min)**  
  *Hold back labels until students articulate the tension.*  

  1. **Elicit Observations (5 min)**:  
     - Ask: *"What frustrated you? When did ‘knowing something exists’ feel useless?"*  
     - Guide toward:  
       - Knowing "one vault wins" didn’t prevent losses.  
       - The strategy proof was "true" but useless without details.  

  2. **Introduce Constructivist Concepts (7 min)**:  
     - **Truth as Constructibility**: "In constructive math, truth means *showing how to build/find* the object. Round 1’s ‘one vault wins’ isn’t ‘true’ until we know *which one*."  
     - **Existence ≠ Existence**: "An existence proof without a witness (like the strategy) is like knowing a password exists but not what it is—you can’t act on it."  
     - **Rejecting Blind Excluded Middle**: "Classical math treats ‘A or B’ as true even if we can’t decide. Constructivism rejects this for open-ended domains (e.g., vaults indexed by integers—how would you choose without a witness?)."  
     - **Map to Game**:  
       - Round 1: Nonconstructive disjunction (no choice of disjunct).  
       - Round 2: Nonconstructive existence (no witness).  

  3. **Contrast Classical/Intuitionistic (3 min)**:  
     - "Classical math ‘solves’ the Vault Bet by saying ‘just pick one—one works!’ Constructivism says ‘that’s not a solution; *show me which one*.’"  

  ---

  ### **Implementation Risks & Mitigations**  
  1. **Misunderstanding Rules**:  
     - **Risk**: Teams think they can "split" stakes or avoid acting.  
     - **Mitigation**: Use a whiteboard flowchart: "Choose A, B, or buy witness → Stake tokens → Win/Lose". Run a trivial practice round.  

  2. **Coordinating Around Tension**:  
     - **Risk**: Teams prioritize token maximization over the philosophical tension.  
     - **Mitigation**: In reflections, ask: "If tokens were real money, would you accept a ‘proof’ that doesn’t guide action?"  

  3. **Reintroducing Classical Logic**:  
     - **Risk**: "50% chance is good enough!" or "We know it’s either A or B, so we’ll guess."  
     - **Mitigation**: Penalize guesses harshly (net -20 tokens). Ask: "Would you fly a plane with a ‘proof’ that one wing works?"  

  4. **Time Management**:  
     - **Risk**: Deliberation overruns.  
     - **Mitigation**: Use strict timers; announce "2 minutes left!" for each phase.  

  ---

  ### **Candid Limitation Note**  
  **What the Activity Distorts**:  
  The game simplifies **proof relevance**—the idea that proofs must carry *extractable data*. In intuitionism, a proof of "∃x P(x)" *is* a witness, not just a guarantee. Here, the "proof" is given passively, and witnesses are bought externally. Students might see witnesses as "extra" rather than *constitutive* of truth.  

  **How to Address**:  
  In the debrief, clarify:  
  > "In constructive math, the witness *is* the proof. If I claim ‘a winning vault exists’ without specifying it, I haven’t fully proven it—because you can’t *use* my proof to win. Truth isn’t just ‘out there’; it’s a blueprint for action."  

  ---

  This plan forces students to confront the *practical cost* of nonconstructive reasoning through stakes and losses, priming them to value witnesses and explicit disjunctions. By deferring jargon, they first feel the tension as a gameplay constraint, making constructivism a natural resolution.
