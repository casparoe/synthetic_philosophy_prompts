     - Prepare a slide or poster with the rules for each round.

  Roles: 
     - The facilitator (you) runs the game, collects decisions, reveals outcomes, and distributes tokens.
     - Each team has a captain who reports decisions.

  Round-by-Round Rules:

  Round 1 (20 minutes total):
     - Introduction (5 min): 
          "We have two vaults, A and B. We know that exactly one of them contains treasure (wins) because of the following: the 1000th digit of π is either even or odd. But we don't know which. 
