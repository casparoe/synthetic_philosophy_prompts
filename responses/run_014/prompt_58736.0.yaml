  2. **Existence without an instance**:
     - Scenario: There is a set of vaults (say, labeled by natural numbers) and a classical proof that there exists a vault with treasure. However, without a specific number, they cannot open any vault. They must choose a vault to open. If they pick a treasure vault, they win; else, they lose. Without a witness, they have no way to pick the right one.

  3. **Strategy existence without an explicit strategy**:
     - Scenario: There is a game (like a two-player game) where a classical proof shows that one of the players has a winning strategy, but it doesn't say which player or what the strategy is. Teams must choose a player and then play the game (or commit to a strategy). If they choose the player with the winning strategy and play correctly, they win; otherwise, they lose. Without knowing the strategy, they might choose the wrong player or not know how to play.

