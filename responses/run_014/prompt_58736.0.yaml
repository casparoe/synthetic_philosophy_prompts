  Now, the complete plan:

  Session Title: The Vault Bet

  Duration: 75 minutes

  Materials:
     - Index cards (for team decisions and for witness in Round 2)
     - Whiteboards (for teams to write their decisions and for the facilitator to write the result)
     - Tokens: about 100 tokens per team (we have 22-26 students -> 4 teams of 5-6 students)

  Preparation:
     - Divide students into 4 teams (about 5-6 per team). Each team gets 100 tokens to start.
     - For Round 1: Prepare a whiteboard or poster with:
          "Vault A wins if the 1000th digit of π (after the decimal) is even.
