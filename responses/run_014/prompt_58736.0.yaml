          For each team:
              If they chose B: they get 20 tokens (so they put in 10 and get 20, net +10).
              If they chose A: they get 0 tokens (net -10).

     - Record the results on a whiteboard.

  Round 2 (25 minutes total):
     - Introduction (5 min):
          "We have the same two vaults A and B, with the same win conditions (A wins if 1000th digit even, B wins if odd). But now we add an option: 
           You can choose to pay 5 tokens to learn the 1000th digit of π (the witness). Then, after learning the digit, you can choose to open a vault (which costs 10 tokens) and if you win, you get 20 tokens.

           So your options:
              Option 1: Skip the witness and open a vault (same as Round 1): stake 10 tokens, win 20 (if correct) or 0 (if wrong).
              Option 2: Pay 5 tokens to learn the digit. Then stake 10 tokens to open a vault. Since you will know which vault wins, you will choose correctly and get 20 tokens. So your net: 20 - 5 - 10 = +5 tokens.

           Note: You cannot open a vault without staking 10 tokens, and you cannot get the witness without paying 5 tokens."

     - Team deliberation (15 min): Teams discuss and choose one of the three paths:
          (a) Skip witness, open vault A.
          (b) Skip witness, open vault B.
          (c) Buy witness, then open the winning vault.

          They write their choice on an index card. If they choose (c), they will get the digit and then they must write which vault they open (they will know, so this is just for record).

     - Resolution (5 min):
          Facilitator reveals the digit (again 9, odd) so Vault B wins.
          For each team:
              If (a): open A -> lose -> net -10 tokens.
              If (b): open B -> win -> net +10 tokens.
              If (c): bought witness and then open B -> net +5 tokens.

     - Record the results.

  Debrief (30 minutes):

     Step 1: Immediate reflection (10 min)
          Ask teams: 
            - "In Round 1, did the knowledge that one vault must win help you pick the right one?" 
            - "In Round 2, what was the advantage of buying the witness? Even though it cost tokens, why might it be better?"
            - "Did any team in Round 2 choose to skip the witness and then get lucky? How would you feel if this were a real investment?"

          Guide them to articulate: 
            - Knowing that a winning vault exists didn't tell them which one to pick. 
            - Having the witness (even at a cost) allowed them to avoid the risk.

     Step 2: Introduce constructivism (15 min)
          Now introduce the terms:
            - "In classical mathematics, we accept proofs that show the existence of an object without providing a way to find it, or that show a disjunction without telling which disjunct holds. This is called a nonconstructive proof."
            - "In contrast, constructive mathematics requires that every existence proof provides an explicit witness and every disjunction provides a way to determine which side holds."
            - "The approach we saw in the game is aligned with constructive mathematics: if you have a constructive proof, you have the witness or the method to determine the disjunct."

          Map the game to the concepts:
            - The classical proof in Round 1 showed that one of the vaults wins (a disjunction) but did not tell which one. This corresponds to a nonconstructive proof of a disjunction.
            - In Round 2, the option to buy the witness corresponds to having a constructive proof: you know exactly which vault to open.

          Discuss the infinite domain extension:
            - "Now imagine that instead of two vaults, there were infinitely many vaults, and a classical proof that one of them wins but doesn't say which. Without a witness, you couldn't even begin to choose. Constructive mathematics requires that we have a witness or a method to find the witness in finite time."

     Step 3: Limitations and wrap-up (5 min)
          - Note that in constructive mathematics, the law of excluded middle (that either P or not P holds for any P) is not assumed. In the game, we assumed that the digit is either even or odd (which is true) but in constructive mathematics, we can only assert that if we have a way to decide it (like computing the digit). For statements that are not decidable (like the Riemann Hypothesis) we cannot assume they are either true or false without a proof.

  Implementation Risks:

     Risk 1: Students might not take the game seriously and choose randomly without discussion.
          Mitigation: Encourage teams to discuss and make a reasoned choice. Remind them that tokens are at stake and that they should think about the classical proof they know.

     Risk 2: In Round 2, teams might not see the benefit of buying the witness because they might think they can guess correctly again.
          Mitigation: After Round 1, some teams might have lost. Highlight that in Round 1, half the teams (on average) lost. In Round 2, the witness option gives a sure positive return (though less than a lucky guess) and avoids the risk.

     Risk 3: Students might reintroduce classical assumptions, e.g., "We know the digit is either even or odd, so we can assume it's one or the other and we have a 50% chance."
          Mitigation: In the debrief, point out that in the constructive view, knowing that it must be one or the other is not enough without knowing which. Also, for undecidable statements, we cannot even in principle compute which one holds.

     Risk 4: Time management: The rounds might run long.
          Mitigation: Keep strict time limits. Use a timer.

     Risk 5: The actual 1000th digit of π might be known by some students. 
          Mitigation: Use a digit far out, like the 1,000,000th digit? But we don't know it by heart. Alternatively, use a different constant or a different statement. We can use a statement that we can arbitrarily assign, without relying on π. For example, flip a coin before the session and record the result in a sealed envelope. Then define:
              Q: "The coin flip was heads."
          Then we don't reveal the actual coin flip until the resolution.

          We do:
              Before the session, flip a coin. Let Q be "the coin was heads". Record the result in a sealed envelope.

          Round 1 and Round 2 use:
              Vault A wins if Q is true (heads).
              Vault B wins if Q is false (tails).

          Then during resolution, open the envelope and reveal.

          This is better because it's arbitrary and not known to anyone.

          So change to a coin flip.

  Limitation Note:

     The activity necessarily distorts one central feature of intuitionistic logic: the meaning of negation. In intuitionistic logic, the negation of a statement P is the assertion that P implies a contradiction. In the game, we treated the negation of Q (the coin flip being heads) simply as the opposite, which is classical. Moreover, in the game we assumed that either Q or not Q holds (because the coin flip has a definite result) and that we could eventually decide it (by looking at the coin). In reality, intuitionistic logic does not deny that decidable statements (like a coin flip) have the excluded middle, but it rejects the blanket use of excluded middle for statements that are not decidable. The activity does not address the case of undecidable statements that cannot be decided even in principle. Therefore, in the debrief, the facilitator must explicitly state that the limitation and explain that the constructive critique is primarily about undecided or undecidable statements over infinite domains.

  Final Plan:

     Preparation (5 min): 
          - Divide into teams, distribute tokens (100 per team), explain the overall idea.

     Round 1 (20 min):
          - Explain rules (5 min): 
              "Before the session, I flipped a coin. I recorded the result (heads or tails) in this sealed envelope.
               Let Q be 'the coin flip was heads'.
               Vault A wins if Q is true (heads).
               Vault B wins if Q is false (tails).
               We know that either Q is true or Q is false, so one of the vaults wins.
               Teams must choose one vault to open. Staking 10 tokens. If you open a winning vault, you get 20 tokens. If you open a losing vault, you get 0 tokens."
          - Teams deliberate (10 min)
          - Resolution (5 min): Open the envelope, reveal the result, and distribute tokens.

     Round 2 (25 min):
          - Explain new rules (5 min):
              "Same vaults and win conditions. Now you have an additional option: you can pay 5 tokens to learn the result of the coin flip (the witness). Then you can open a vault (staking 10 tokens) and if you choose the winning vault, you get 20 tokens. 
               Or you can skip the witness and open a vault as before.
               So:
                  Skip witness and open A: stake 10, win 20 if heads, 0 if tails.
                  Skip witness and open B: stake 10, win 20 if tails, 0 if heads.
                  Buy witness (5 tokens) and then open the correct vault: stake 10, win 20 -> net 20-5-10 = 5 tokens."
          - Teams deliberate (15 min)
          - Resolution (5 min): Reveal the coin flip again (same as Round 1, so it's consistent) and distribute tokens.

     Debrief (25 min): As described above.

  Total: 5+20+25+25 = 75 minutes.

  Note: The coin flip result is the same in both rounds. We use the same sealed envelope for both rounds? Or we can use the same result without resealing? It's fixed.

  This plan should work.
