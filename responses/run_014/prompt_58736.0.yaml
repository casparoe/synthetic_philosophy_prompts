           If you open a vault that wins, you will receive 20 tokens (so net +10). 
           If you open a vault that loses, you receive 0 tokens (so net -10)."

     - Team deliberation (10 min): Teams discuss and choose. They write their choice (A or B) on an index card along with their team name, and give it to the facilitator.

     - Resolution (5 min): 
