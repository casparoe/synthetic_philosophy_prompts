  We are building a decision tree to help readers discover their stance on the surprise examination paradox.
   The tree will have 4-7 branch questions, each with 2-3 options, leading to named positions in the literature.

   The main positions we want to cover:
   1. Quine's diagnosis: The announcement is self-referential and self-defeating only when considering the last day.
      - On Friday, if the exam hasn't happened by Thursday, then the exam must be on Friday and thus not a surprise. So Friday is ruled out.
      - But then, if the exam hasn't happened by Wednesday, it must be on Thursday (since Friday is ruled out) and thus not a surprise? But Quine says: the exam can still occur on Thursday as a surprise because the student didn't rule out Friday until after Thursday passes without an exam. So the backward induction fails for Thursday because the student's reasoning on Wednesday is invalid: they assume that Friday is impossible, but that assumption is only valid on Thursday night? Quine's point is that the surprise can occur on any day except the last one (if the week were to get that far without an exam) but since the exam must occur earlier, it can be a surprise.

   2. Kaplan and Montague: The announcement is a genuine self-referential paradox, akin to the Liar. They show that the teacher's announcement is inconsistent (so it cannot be true) and thus the exam cannot be both surprising and occur on one of the days.

   3. Sorensen's blindspot solution: The announcement creates a blindspot. It is true, but the students cannot know it to be true until after the exam. So the announcement is a "blindspot" proposition for the students until the exam happens.

   4. Williamson's margin-for-error: The surprise exam requires a margin for error in knowledge. The KK principle (if you know, then you know that you know) fails. There is a margin for error: on the day before, the student doesn't know that the exam is on the next day, but that doesn't imply that they know it isn't. The backward induction fails because it assumes that if the student doesn't know on day n-1 that the exam is on day n, then they know it isn't on day n. But with margin for error, it might be that they don't know it is on day n, but they also don't know it isn't.

   5. Two-agent/public announcement: The trouble is in the interaction between the teacher and the students. The announcement is made, but the students' reasoning affects the situation? Or the teacher's announcement is a public announcement that changes the context? Or perhaps the students' reasoning is based on the assumption that the teacher will keep their word, but the teacher's action is independent? Or the announcement is a performative utterance that creates the conditions for the paradox? We can think of it as a game-theoretic or dynamic epistemic logic issue.

