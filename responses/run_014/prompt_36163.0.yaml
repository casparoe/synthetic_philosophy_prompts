answer: |-
  Right, you're hitting the core tension. But you're mischaractering the insurance market's purpose. It's not a *descriptive* metric of blind lived experience—it's a *normative* thought experiment designed for fairness under conditions of radical uncertainty. When individuals behind a veil of ignorance don't know their own talents or handicaps, the premiums they'd pay reflect a rational assessment of the *average* social cost of a disadvantage, stripped of personal idiosyncrasies. Yes, two blind people get the same payout – that's the point! It treats blindness as a brute luck deficit demanding equal compensation, regardless of whether Jane adapts triumphantly or John struggles profoundly. Their differing post-auction *choices* about spending that resource bundle (on tech, assistants, retraining) reflect their option luck and personal responsibility – the very things resourcism aims to isolate. The "currency" isn't tracking able-bodied fears; it's establishing an impersonal, society-wide baseline for rectifying unchosen disadvantage. Measuring "real freedom" à la Sen requires judging the value of *ends* – which imposes a contested conception of the good life. Resources track *means* – securing a fair share of what anyone might need to pursue *their own* ends. Your curb-cut point is fair *practically* – but that argues for converting cash into actual accessibility resources, not abandoning the resource metric. The objectivity isn't just convenient; it's *constitutive* of a liberal egalitarianism that respects pluralism. Adapting to the *actual* costs blindness imposes in a *specific* society? That's what the initial resource endowment post-auction *and* post-insurance payout is *for* – enabling individuals to navigate their world as they see fit.

  (Your move. Hit me with adaptive preferences or expensive tastes – but remember, Dworkin *loves* slicing that particular Gordian knot.)
