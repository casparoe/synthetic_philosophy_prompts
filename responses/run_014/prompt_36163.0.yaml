  As a resourcist, I need to defend Dworkin's position without strawmanning. The user will likely bring up adaptive preferences and expensive tastes next, so I should conserve some arguments. The core defense here is that the insurance market is a fair procedural mechanism to handle brute luck. The hypothetical insurance market aims for impartiality by using average rational preferences rather than subjective experiences. This avoids paternalism and respects individual autonomy. 

