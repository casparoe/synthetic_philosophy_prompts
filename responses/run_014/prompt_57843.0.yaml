answer: |-
  Based on the Aldenford panel's precedents, two plausible, consistent rules emerge:

  **Rule 1: The Institutional Legacy Rule**  
  *Prioritize the enduring institutional impact over the individual's harmful actions. Remove commemoration only if the figure’s primary claim to fame is inseparable from systemic harm or if local ties are weak.*  
  - **Governor Rourke:** Removed. Imperial loyalty was his core legacy; statue was propagandistic.  
  - **Silas Wentworth:** Retained. Child labor was incidental to his *enduring institutional gift* (library/park).  
  - **Edgar Crane:** Renamed. No institutional legacy beyond a donation; primary fame tied to eugenics.  
  - **Admiral Tovey:** Retained. Defense leadership is institutional legacy; slave profits were secondary.  
  - **Prediction for Bell:** **Retain with added context.** His water system and city charter are foundational institutions. The Riverside clearance, while grave, isn't his defining legacy.  

  **Rule 2: The Direct Agency Rule**  
  *Remove commemoration if the figure *personally ordered or enacted* severe harm, especially against the commemorating community. Retain if harm was indirect or systemic.*  
  - **Governor Rourke:** Removed. Symbolized imperial oppression (systemic harm he enforced).  
  - **Silas Wentworth:** Retained. Child labor was systemic (economic norm); he didn't personally enact violence.  
  - **Edgar Crane:** Renamed. Actively *advocated* eugenics (direct ideological harm).  
  - **Admiral Tovey:** Retained. Profited from slavery but didn't *personally enact* it locally.  
  - **Prediction for Bell:** **Remove.** He *personally ordered* lethal forced clearance of residents, directly harming Aldenford’s own community.  

  ---

  ### Best Guess for Panel’s Implicit Logic  
  **Rule 1 (Institutional Legacy) is more likely.**  
  - **Why?** The panel consistently preserved monuments tied to *tangible local institutions* (Wentworth’s library, Tovey’s defense) despite grave harms. Crane and Rourke lacked comparable institutional legacies. The panel also shows aversion to removal when harm can be contextualized (plaques for Wentworth/Tovey). Bell’s water system and city charter mirror Wentworth/Tovey’s institutional contributions, suggesting retention with added interpretation.  

  **Closest Analog: Admiral Tovey**  
  - **Similarity:** Both combined civic leadership (Tovey’s defense, Bell’s infrastructure) with severe harm (slavery profits vs. forced clearance).  
  - **Breakdown:** Tovey’s harm was *passive* (profiting from distant slavery) and systemic, while Bell *actively ordered violence* against local residents. If Rule 2 were primary, this distinction should compel removal—yet the panel retained Tovey. This favors Rule 1.  

  ---

  ### Broader Principles Entrenched  
  - **If Bell is retained:** The principle that *foundational institution-building can absolve commemorative presence, even for direct violence, if contextualized*. This prioritizes civic identity over historical accountability for atrocities.  
  - **If Bell is removed:** The principle that *personal perpetration of lethal violence against the community’s own members is an unforgivable breach, nullifying civic contributions*. This centers victims’ dignity over legacy.  

  ---

  ### Hypothetical Case to Separate the Rules  
  **The Case of Mayor Eleanor Vance (Hypothetical):**  
  - *Context:* A 1920s mayor who violently suppressed a labor strike (ordering police to shoot, killing 10 workers) but also established Aldenford’s first public housing system, still in use today.  
  - **Rule 1 Prediction:** Retain. Public housing is an enduring institution; strike violence is contextualizable.  
  - **Rule 2 Prediction:** Remove. She *personally ordered* lethal force against citizens.  
  - **Why it separates:** Vance’s institutional legacy (public housing) is strong and local, like Bell/Wentworth. But her *direct agency* in killing locals mirrors Bell’s Riverside clearance. Rule 1 retains; Rule 2 removes.  

  This hypothetical forces a choice: does *personal violence* outweigh *institutional legacy*, even when both are locally significant? The panel’s Tovey precedent (retaining despite slave profits) suggests Rule 1 would retain Vance, but Bell’s case—if removed—would signal a shift toward Rule 2.  

  **Recommendation for Consistency:**  
  The panel should **retain the Bell statue with a major interpretive plaque addressing the Riverside tragedy** (like Wentworth/Tovey). Removal would break from Tovey’s precedent by prioritizing Bell’s direct agency over institutional impact. Renaming Crane Lane (weak legacy) and removing Rourke (propagandistic imperial symbol) remain distinct as non-institutional cases.
