  The second rule might focus on "Personal Agency in Harm" - prioritizing removal when the figure personally ordered violence (Bell's clearance), distinguishing from figures who benefited from structural injustice (Wentworth's child labor, Tovey's slave profits). This would predict removing Bell.

  The Tovey case is the closest analog to Bell - both involve direct harm alongside civic building. But Tovey's harm was indirect (profiting from slavery) versus Bell ordering lethal force personally. This distinction in personal agency might be crucial.

  If the panel keeps Bell, it entrenches that institutional legacy can outweigh even direct violence. If removed, it establishes that personal perpetration of violence is unforgivable regardless of civic contributions. 

