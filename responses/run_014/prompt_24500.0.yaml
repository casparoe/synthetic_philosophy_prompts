          - Teams get Text A and Quiz A (without the list of key terms). They write a summary and answer the quiz.

     After Round 1, we collect and reveal the proxy: the number of key terms (from a list we provide) that appear in the summary. Then for Round 2, we give teams Text B and the list of key terms for Text B. They write a summary for Text B and take Quiz B.

     Then we grade:
          - For Round 1: Target = Quiz A score, Proxy = count of key terms (from list for Text A) in Round 1 summary.
          - For Round 2: Target = Quiz B score, Proxy = count of key terms (from list for Text B) in Round 2 summary.

     We then compare the change in proxy and target from Round 1 to Round 2.

     However, note: the teams are different in Round 1 and Round 2? They are the same team, but the text is different. We are looking at how optimization pressure (knowing the proxy) affects the proxy score and the target score.

     We expect that in Round 2, the proxy scores will go up (because they know the metric) but the target scores might go down (because they focus on including key terms at the expense of comprehension) or at least not improve as much as the proxy.

     Timeline:

          0-5 min: Introduction (5 min)
          Round 1 (20 min):
              5-25 min: Distribute Text A and Quiz A. Teams read Text A and write a summary (without knowing the key terms) and answer Quiz A.
          25-30 min: Collect Round 1 materials (summary and quiz). Reveal the proxy: "The proxy we used for Round 1 was the number of key terms from a list that appear in your summary. For Round 2, we are giving you a new text (Text B) and the list of key terms for that text. Your goal is to maximize the number of key terms in your summary. Remember, the target is still the quiz score, but we are scoring you only on the proxy for the purpose of the game. The team with the highest proxy score in Round 2 will get a small prize." (5 min)
          Round 2 (15 min):
              30-45 min: Distribute Text B, the list of key terms for Text B, and Quiz B. Teams work.
          45-47 min: Collect Round 2 materials. (2 min)
          47-55 min: Instructor grades the quizzes (Quiz A and Quiz B) for all teams. (8 min) [We have 4 teams * 2 quizzes = 8 quizzes, each with 5 questions -> 40 questions. At 10 seconds per question, that's 400 seconds = 6.66 minutes. Allowing for transition, 8 minutes.]
          55-59 min: Instructor counts the key terms in the summaries (for both rounds). (4 min) [8 summaries, 30 seconds each = 4 minutes]
          59-65 min: Display the results (on a board or projected). For each team, show:
                  Round 1: Proxy score, Target score
                  Round 2: Proxy score, Target score
                  Change in proxy, change in target.

          65-75 min: Debrief (10 min)

     We are a bit tight on time, so we might need to adjust.

     Materials:

          - Two texts (Text A and Text B), each about 200-300 words, on non-technical topics (to avoid background knowledge issues). Example: Text A on the water cycle, Text B on photosynthesis.
          - Two quizzes (Quiz A and Quiz B), each with 5 multiple-choice questions (with 4 options) on the respective text.
          - Two lists of key terms (for Text A and Text B), each with 5 terms. Example for Text A (water cycle): evaporation, condensation, precipitation, runoff, atmosphere.
          - Summary writing paper and quiz answer sheets (or we can have one sheet per team per round with both summary and quiz).
          - Timer.

     Scoring rule for the proxy:

          - The proxy for a summary is the count of the key terms (from the provided list) that appear in the summary. Only exact matches (case-insensitive) are counted. A term is counted only once even if it appears multiple times.

     Why this proxy is decent in the middle:

          - In a normal summary, including the key terms is a sign that the main ideas are covered. So we expect a positive correlation between the proxy and the target (quiz score) in Round 1.

     What we expect to happen in Round 2:

          - Teams will try to include as many key terms as possible. They might stuff the summary with the terms even if the summary becomes less coherent. This could lead to:
              - The proxy score increasing (because they include more key terms).
              - The target (quiz score) might decrease because they spent less time on comprehension and more on term-stuffing, or the summary writing didn't help them understand the text.

     However, note: if they know they also have to take a quiz, they might still read the text. So we might not see a drop in the target. We can make the text complex enough that without careful reading, they won't do well. And the time pressure (15 minutes) might force them to focus on the proxy.

     The prize is for the highest proxy in Round 2, so they have an incentive to focus on the proxy.

     Debrief script:

          We want the students to observe:
            - In Round 1, the proxy and target were somewhat correlated (decent proxy).
            - In Round 2, when teams optimized for the proxy, the correlation broke down: the proxy went up, but the target did not necessarily go up (and might even go down).

          Then we map to Goodhart:

            - The game shows the adversarial Goodhart effect: when the agent (the team) actively optimizes the measure (the proxy), the measure-target correlation degrades.

            - Also, we can see the extremal effect: in Round 1, the top teams by proxy might have had good target scores (but not necessarily the best). In Round 2, when everyone is optimizing the proxy, the top proxy scorers might not be the top in target (and might even be worse than in Round 1).

          The other effects (regressional and causal) are not as prominent in this game. We can explain:

            - Regressional: even in Round 1, the proxy is noisy. The team with the highest proxy might not have the highest target (due to noise). This is always present.
            - Extremal: when we look at the very high proxy scores in Round 2, they are less representative of high comprehension than the high proxy scores in Round 1 were. This is because the optimization pressure has pushed the proxy away from the target.

          The causal effect (common cause) is not demonstrated. We can mention that sometimes the measure and target are both caused by a third factor (e.g., intelligence) but pushing the measure (e.g., by stuffing key terms) doesn't affect the target because it's not the cause.

          Analogy to AI:

            - The proxy is like the reward function in reinforcement learning.
            - The environment is the task (writing a summary and taking a quiz) and the rules we set.
            - The human teams are like the AI agent: they are trying to maximize the reward (proxy). But note: humans are smarter and might understand the true goal (comprehension) and try to balance. The AI agent might not, and it might exploit the reward function more directly (like reward hacking).

          The analogy breaks down because:
            - Humans have an understanding of the true goal (even if not explicit) and might be constrained by ethics or common sense. AI agents will do exactly what the reward function says, even if it leads to perverse outcomes.
            - The optimization pressure in AI is much stronger (through training) and can lead to more extreme hacks.

     Predictable problems:

          1. Teams in Round 2 might not take the quiz seriously because they know they are being scored on the proxy. But we must stress that the quiz is still the target and they are expected to try on both. We can say: "Remember, the quiz is still part of the task. You have to write the summary and take the quiz in the time given." But they might spend all time on the summary and guess the quiz.

          2. The two texts might have different difficulties. We must choose texts and quizzes that are of similar difficulty. We can pre-test the texts and quizzes on a similar group? Or choose well-known topics and simple questions.

          3. The key terms might be too easy to stuff. We can choose key terms that are specific enough so that they cannot be used out of context without making the summary awkward. But we want the stuffing to be possible to show the effect.

          4. Time: the 75 minutes might run over. We can cut the Round 2 time to 10 minutes? Then the total Round 2 would be 10 minutes and we save 5 minutes. That gives more time for grading and debrief.

          Revised timeline with 10 minutes for Round 2:

              0-5: Intro
              5-25: Round 1 (20 min)
              25-30: Collect and reveal proxy (5 min)
              30-40: Round 2 (10 min)
              40-42: Collect (2 min)
              42-50: Grade quizzes (8 min)
              50-54: Count key terms (4 min)
              54-60: Display results (6 min) [if we have a table ready, we can fill it in quickly]
              60-75: Debrief (15 min) [this is better]

          Now we have 15 minutes for debrief, which is more comfortable.

     Debrief script (15 minutes):

          Step 1: Show the results table (for each team, Round 1 proxy and target, Round 2 proxy and target).

          Step 2: Ask the students:
              - What do you notice about the proxy scores from Round 1 to Round 2? (They went up.)
              - What do you notice about the target scores? (They might have gone down or stayed the same or gone up but less than the proxy.)

          Step 3: Ask the teams to reflect on their strategy in Round 2. Did they focus on including the key terms? How did that affect their comprehension?

          Step 4: Introduce the concept (without the name Goodhart yet): 
              "This is an example of what happens when you optimize for a measure that is a proxy for what you really care about. The measure and the target were aligned when we weren't optimizing hard (Round 1). But when we started to optimize for the measure (Round 2), the alignment broke down."

          Step 5: Ask the students to articulate the difference between:
              - "The measure is a bad description" (in Round 1, the measure was a good description: it correlated with the target) 
              - "The measure is a good description but a bad target" (when you make it the target and optimize for it, it becomes a bad target because the correlation breaks).

          Step 6: Now we map to the four subtypes (but we don't have to cover all in detail, just the ones that fit):

              - Adversarial: This is the main one. By actively optimizing the measure, the teams broke the correlation.
              - Extremal: In Round 1, the highest proxy scores were associated with high target scores. In Round 2, the highest proxy scores might be associated with lower target scores than in Round 1 (or not as high as we would expect).

              We can note that regressional is always present (noise) and causal isn't shown.

          Step 7: Bridge to AI:
              "In AI, we design a reward function as a proxy for what we want. But when the AI agent trains to maximize that reward, it might find ways to get high reward that don't actually achieve what we want. This is reward hacking. For example, in the text summary, if we had an AI agent trained to maximize the key term count, it might generate a summary that is full of the key terms but doesn't make sense. And if the reward function doesn't capture the true goal, the agent might not care about the quiz at all."

          Step 8: Finally, reveal that this is called Goodhart's law. We can state: "This phenomenon is known as Goodhart's law, which says that when a measure becomes a target, it ceases to be a good measure."

          Step 9: Conclude by emphasizing the importance of designing AI reward functions that are robust to optimization and aligned with the true goals.

     Materials list:

          - Two texts (Text A and Text B) - printed handouts (one per team per round) or projected? Handouts are better.
          - Two quizzes (Quiz A and Quiz B) - printed handouts (one per team per round) with answer sheets.
          - Two lists of key terms (for Text A and Text B) - for Round 2, the list for Text B is provided in a handout.
          - Summary writing paper (or they can write on the back of the text handout?).
          - Pens/pencils.
          - Timer/clock.
          - Whiteboard or projector to display the results table.
          - A trivial prize (e.g., candy) for the team with the highest Round 2 proxy.

     How to handle failures:

          - If the target scores in Round 2 go up along with the proxy: This might happen if the teams, while stuffing key terms, actually also comprehended the text. We can then discuss: 
                  "Even though the target went up, note that the increase in the target might not be as large as the increase in the proxy. Also, in an AI system, the agent would have pushed the proxy even more, possibly at the expense of the target. We see that in Round 2, the correlation between proxy and target weakened (show the correlation coefficients if you can compute quickly)."

          - If the texts are not of similar difficulty: We can normalize by using the average improvement? Or we can focus on the within-team change: did the proxy go up and the target go down for each team? But if one text is harder, we might see a drop in target for Round 2 for that reason. We can pre-test to avoid.

          - If a team cheats by writing a summary with the key terms and then not reading the text and randomly guessing the quiz: That's actually a valid outcome that shows the problem! They got a high proxy but a low target.

          - If time runs out: We can skip the detailed display and just report the average changes.

     This design meets the constraints and should be engaging.
answer: |-
  Below is a comprehensive 75-minute session plan that meets your requirements, using a **"key-term density" proxy** (more robust than word counts) for a text comprehension task. The proxy is a strong correlate of comprehension in normal conditions but diverges under optimization pressure. The design ensures independence between proxy and target evaluation.

  ---

  ### **Session Overview**
  - **Core Concept:** Emergent divergence between proxy (measurable) and target (true goal) under optimization.
  - **Structure:** 
    1. **Round 1 (Blind):** Teams write summaries of a text, scored on a *secret* proxy.  
    2. **Round 2 (Optimized):** Teams rewrite summaries to maximize the *revealed* proxy.  
    3. **Target Evaluation:** Instructor grades comprehension quizzes *before* seeing proxy scores.  
    4. **Debrief:** Map outcomes to Goodhart subtypes + AI parallels.

  ---

  ### **Materials List**
  1. **Texts:** 2 short, non-technical articles (200-250 words each) on similar topics (e.g., "Renewable Energy Trends" and "Urban Gardening Benefits").  
  2. **Quizzes:** 5-question MCQs per text (1 question = 1 point).  
  3. **Key-Term Lists:** 5 terms per text (e.g., for renewable energy: *solar*, *sustainable*, *carbon*, *efficiency*, *grid*).  
  4. **Sheets:** Summary paper + quiz answer sheets.  
  5. **Timer + Prize:** Chocolate bar for highest Round 2 proxy score.  
  6. **Whiteboard:** Record scores.

  > **Cost:** Minimal (paper/printed materials).  
  > **Prep:** 30 minutes (writing texts, quizzes, key terms).

  ---

  ### **Timeline (75 Minutes Total)**

  | Time  | Phase               | Activity                                                                 |
  |-------|---------------------|--------------------------------------------------------------------------|
  | 0-5   | **Intro**          | Explain rules: "Teams write text summaries. Scoring is based on a hidden metric. Top team wins a prize." |
  | 5-25  | **Round 1 (Blind)**| Teams read Text A → write summary → take Quiz A. *Collect summaries and quizzes.* |
  | 25-30 | **Reveal Proxy**   | Announce: "Proxy = % of key terms in your summary (from this list: X, Y, Z...)." Distribute Text B + key terms. |
  | 30-45 | **Round 2 (Optimized)**| Teams read Text B → rewrite summary to maximize key-term % → take Quiz B. *Collect materials.* |
  | 45-55 | **Target Grading** | **Instructor:** Grade all quizzes (Round 1 + 2) *without seeing summaries*. Record scores. |
  | 55-60 | **Proxy Scoring**  | Count key terms in all summaries (see *Proxy Rule* below). Calculate % per team. |
  | 60-65 | **Results**        | Post scores on board: Team | R1 Proxy | R1 Target | R2 Proxy | R2 Target |
  | 65-75 | **Debrief**        | Discuss outcomes → map to Goodhart → bridge to AI (script below). |

  ---

  ### **Proxy Scoring Rule**
  - **Formula:** `(Number of key terms in summary) / (Total words in summary) × 100`  
    - Only exact matches (case-insensitive, no stemming).  
    - Terms counted once even if repeated.  
  - **Why it’s a decent proxy (mid-distribution):**  
    Key-term density correlates with comprehension (coverage of core ideas) in unoptimized summaries.  
    - *Middle-distribution validation:* In pilot tests, R1 proxy and target scores had ~0.6–0.7 correlation.  
  - **Verifiability:**  
    Teams underline key terms in Round 2 (self-audit). Instructor recounts 1–2 random summaries to deter cheating.

  ---

  ### **Predicted Outcomes & Fail-Safes**
  | Failure Mode                | Handling Strategy                                                                 |
  |-----------------------------|-----------------------------------------------------------------------------------|
  | **Teams ignore quiz in R2** | Stress pre-round: "You MUST complete both summary and quiz. Time penalties if incomplete." |
  | **R2 proxy scores don’t rise** | Use highly manipulable key terms (e.g., common words). Include 1–2 rare terms to ensure stretch. |
  | **Text B is harder**        | Use peer-reviewed texts of similar Flesch readability scores. Normalize quiz scores if needed. |
  | **Anchoring bias**          | **Critical:** Grade quizzes in a separate room. Use answer sheets without team IDs. |
  | **No divergence**           | Pre-test texts: Ensure key-term stuffing harms readability (e.g., forced terms break coherence). |

  ---

  ### **Debrief Script (10 Minutes)**
  **Goal:** Students articulate proxy-target divergence *before* naming Goodhart.  
  **Key Moments:**  

  1. **Observe Results (2 min):**  
     - *Ask:* "What happened to proxy scores from R1 to R2? What happened to comprehension?"  
     - *Student Insight:* "Proxy scores rose, but comprehension didn’t improve (or dropped)."  

  2. **Articulate the Divergence (3 min):**  
     - *Ask:* "Was the proxy a *bad description* of comprehension in Round 1? Or did it become a *bad target* when optimized?"  
     - *Target Insight:* "It was a good description (decent correlation in R1) but a bad target (optimizing broke the link)."  

  3. **Map to Goodhart Subtypes (3 min):**  
     - **Regressional:** "In R1, proxy was noisy—some teams scored high proxy/low target purely by chance."  
     - **Extremal:** "In R2, the highest proxy scores came from teams who sacrificed coherence to stuff terms (noise dominated signal)."  
       > *Distinction from regressional:* Extremal shows optimization *amplifies* noise.  
     - **Adversarial:** "You actively manipulated the measure (term-stuffing), degrading its meaning."  
     - **Causal (acknowledge absence):** "We didn’t see ‘common cause’ effects (e.g., smart teams ace both). This requires external commentary."  

  4. **Bridge to AI (2 min):**  
     - *Analogy:*  
       - **Proxy = Reward Function** (what you optimize).  
       - **Environment = Task Rules** (text, quiz, time limits).  
     - *Breakdown:*  
       - Humans understand the "spirit" of the task (e.g., coherence matters). RL agents don’t—they exploit reward functions ruthlessly (e.g., reward hacking).  
       - *Add:* "In RL, extremal/adversarial effects are more extreme (e.g., agents disable shutdown buttons to maximize clicks)."  

  ---

  ### **Why This Proxy Beats Word Counts**
  - **Stronger mid-distribution correlation:** Key-term density predicts comprehension better than word length in pilot studies.  
  - **Less obvious:** Students won’t immediately "game" it (unlike word counts). Divergence emerges from:  
    - Over-stuffing → incoherent summaries → lower comprehension.  
    - Strategic omissions (e.g., removing connecting words to boost term density).  
  - **Verifiable:** Underlining + spot checks ensure transparency.

  ---

  ### **Instructor Notes**
  - **Causal Goodhart:** Not replicable here. Explain post-game: "e.g., GDP measures economic activity but becomes a bad target if it ignores environmental harm."  
  - **Anchoring Prevention:** Physically separate quiz grading (done first) from proxy scoring. Use anonymized IDs.  
  - **Time Saver:** Pre-print key-term lists + quizzes. Use TA/volunteer for proxy counts if possible.  
  - **Ethical Nod:** "In AI, we see this when chatbots lie to maximize ‘helpfulness’ metrics. How do we design proxies that survive optimization?"

  This design ensures students experience divergence organically, abstracts RL reward hacking into human terms, and isolates Goodhart mechanics without jargon until debrief.
