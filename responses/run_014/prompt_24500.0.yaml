     - Then the proxy metric is revealed, and teams get a second round (Round 2) to improve their proxy score.
     - The target metric is judged fairly and quickly by the instructor without knowing the proxy scores.

   Constraints:
     - The proxy must be a decent proxy in the middle of the distribution (not a strawman).
     - The divergence (measure vs. target) should emerge under optimization pressure.
     - The target must be something the instructor can judge quickly and fairly (e.g., comprehension test, physical test).
