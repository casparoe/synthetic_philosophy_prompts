   Proposed target/proxy pair: 
     - Target: Comprehension of a short text (we can use a short passage and then ask multiple-choice questions or a short quiz).
     - Proxy: The number of words of six letters or fewer in their written summary of the text.

   Why this proxy is decent in the middle:
     - In general, simpler language (with shorter words) is associated with better comprehension and clarity. 
     - However, under optimization pressure (trying to maximize the count of short words), teams might write very short, nonsensical words or even gibberish to increase the count, which would harm comprehension.

   Alternative proposal: 
     - We considered the readability proxy, but the problem with the word count exploding is that it's too obvious. 
     - Instead, let's use a proxy that is less obviously manipulable but still leads to divergence when optimized.

   Better alternative: 
     - Target: The accuracy of a short multiple-choice quiz (5 questions) on a provided text.
     - Proxy: The number of key terms (from a provided list) that appear in the team's written summary.

