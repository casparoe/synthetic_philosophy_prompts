answer: |-
  ## Handout: Unpacking "You Can't Legislate Morality" – A Framing Statement for the Hart-Devlin Debate

  **Opening Statement (To Deliver Verbally):**  
  "Last week, the observation that 'you can't legislate morality' seemed to settle our discussion. But as Justice Holmes reminded us, 'a word is the skin of a living thought.' That slogan wears many skins. Its ambiguity obscures more than it reveals about the Hart-Devlin debate concerning the *limits* of law. Devlin doesn't naively claim law *creates* saints; he argues society has a *prima facie right* to use law – including criminal prohibition – to protect the *shared moral fabric* it believes essential for its own survival, a claim Hart contests on grounds of harm, liberty, and empirical fragility. Today, we dissect the slogan not to score points, but to sharpen our tools. Every reading of it makes *some* sense; our task is to see *which* sense, if any, actually challenges Devlin's specific argument, and what work remains for Hart or Feinberg. The handout maps the terrain. Let's begin by asking: which version of 'can't legislate morality' did we actually agree with last week, and why?"

  ---

  **Handout: The Many Meanings of "You Can't Legislate Morality"**

  This slogan is a chameleon. Its meaning shifts dramatically based on how we interpret its key terms. Below are distinct readings, assessed for clarity, truth-status, and relevance to the Hart-Devlin debate concerning the state's authority to enforce moral standards.

  1.  **The Conceptual Impossibility (Inner State):**
      *   **(a) Proposition:** It is conceptually impossible for legal coercion to directly produce genuinely moral motivation or virtuous character.
      *   **(b) Terms:** *Can't* = Conceptual impossibility. *Legislate* = Any state action aiming to directly control inner states. *Morality* = Inner motivation, intention, or character (virtue).
      *   **(c) Verdict:** **Platitude.** Coercion may compel outward compliance, but Kant (and common sense) tells us true moral worth stems from free choice, not fear of sanction.
      *   **(d) Engagement with Devlin/Hart:**
          *   *Devlin:* Can easily **concede** this. His concern is social cohesion through conformity to shared *standards of conduct*, not creating virtuous souls. The Kantian point is **largely irrelevant** to his disintegration thesis.
          *   *Hart:* **Cannot borrow** this directly against Devlin, as it doesn't address the core claim about social stability and conduct. It aligns with his emphasis on liberty but isn't his primary weapon.

  2.  **The Behavioral Inefficacy (Conduct Change):**
      *   **(a) Proposition:** Criminal prohibition is causally ineffective at reliably eliminating widespread behaviors rooted in strong desire or belief (e.g., drug use, prostitution).
      *   **(b) Terms:** *Can't* = Causal inefficacy. *Legislate* = Primarily criminal prohibition. *Morality* = Specific condemned conduct (e.g., homosexual acts, drug use).
      *   **(c) Verdict:** **Substantive & Contestable Empirical Thesis.** True for some behaviors/societies (Prohibition?), false or partially true for others (murder? drunk driving?). Requires evidence.
      *   **(d) Engagement with Devlin/Hart:**
          *   *Devlin:* **Could concede** inefficacy in specific cases as a *defeating* factor for his *pro tanto* right to legislate based on expediency ("it won't work, so don't"). This **directly engages** his argument by challenging one basis for overriding the prima facie right.
          *   *Hart:* **Can readily borrow** this as an *empirical challenge* to Devlin's disintegration thesis and the necessity/effectiveness of criminalization. Feinberg's offense principle might also consider inefficacy.

  3.  **The Belief Impossibility:**
      *   **(a) Proposition:** Law cannot directly command or change deeply held moral beliefs or judgments.
      *   **(b) Terms:** *Can't* = Conceptual/Causal Impossibility. *Legislate* = Mandating belief. *Morality* = Subjective moral belief or judgment.
      *   **(c) Verdict:** **Platitude (Conceptual) / Contestable Empirical (Causal).** Law cannot *logically* force belief. Its *influence* on beliefs over time (e.g., civil rights laws) is complex and empirical.
      *   **(d) Engagement with Devlin/Hart:**
          *   *Devlin:* **Can concede** the conceptual point. His focus is on enforcing *conduct* standards derived from *shared public morality* (a social fact), not forcing individuals to *believe* them. Law aims at conformity, not conversion.
          *   *Hart:* **Irrelevant to core dispute.** Hart's critique targets the *source* (positive vs. critical morality) and *reason* (harm vs. mere immorality) for enforcing conduct standards, not belief-change per se.

  4.  **The Practical Infeasibility (Social Complexity):**
      *   **(a) Proposition:** Attempting comprehensive legal enforcement of a detailed moral code across a complex, pluralistic society is practically unworkable and leads to excessive social costs (over-policing, black markets, disrespect for law).
      *   **(b) Terms:** *Can't* = Practical infeasibility (undesirable consequences). *Legislate* = Widespread criminalization/enforcement. *Morality* = A broad range of conduct deemed immoral.
      *   **(c) Verdict:** **Substantive & Contestable Empirical Thesis.** Highly plausible in modern pluralistic states, but debatable in scope and degree. Central to Mill/Hart/Feinberg concerns.
      *   **(d) Engagement with Devlin/Hart:**
          *   *Devlin:* **Must engage seriously.** This is a major *defeating* factor for his *pro tanto* right. He might argue for limiting enforcement to core, widely held standards crucial to social fabric ("crudity or vice" vs. minutiae) to mitigate this, conceding broad enforcement is impractical.
          *   *Hart:* **Core Argument.** This feeds directly into Hart's (and Mill's) harm principle arguments – the *costs* of enforcing morality *are* a decisive reason against it, outweighing Devlin's prima facie claim. Feinberg's offense principle offers a middle ground.

  5.  **The Normative Claim (Liberty/Neutrality):**
      *   **(a) Proposition:** It is morally impermissible (wrong) for the state to use its coercive power *solely* to enforce a particular conception of good character or virtuous life against competent, consenting adults, irrespective of harm or offense to others.
      *   **(b) Terms:** *Can't* = Normative impermissibility (wearing the mask of impossibility). *Legislate* = Any state coercion (criminal, civil, regulatory). *Morality* = Conceptions of the good life, virtue, sin (distinct from harm/offense).
      *   **(c) Verdict:** **Substantive Normative Thesis.** The core of Mill's harm principle and Hart's liberalism. Highly contested by Devlin (and communitarians).
      *   **(d) Engagement with Devlin/Hart:**
          *   *Devlin:* **Directly Contradicted.** This *is* the heart of the dispute. Devlin argues society *is* permitted (even obligated) to use law to protect its constitutive shared morality, even absent independent harm/offense, based on the disintegration thesis and the jury-box standard. He rejects this normative claim.
          *   *Hart:* **Core Argument.** This *is* Hart's fundamental objection. Law should be limited by harm (and perhaps Feinbergian offense), not mere immorality. The disintegration thesis lacks sufficient empirical support to override this principle.

  **Addressing Key Complications:**

  *   **The Self-Undermining Objection ("All Law Enforces Morality"):** This is **decisive against readings 1-3 if "morality" is defined broadly as "normative standards."** A law prohibiting murder enforces the moral view that killing is wrong; a law protecting free speech enforces the moral view that autonomy is valuable. *However, it is **not fatal to Devlin**.* He can readily accept this and argue: "Precisely! *Every* society's law rests on *some* shared morality. My claim is that society has a right to use law to protect the *specific* shared morality that constitutes *its own* social bond, especially concerning fundamental institutions like marriage/family." The objection highlights that the debate is *which* moral standards justify state coercion, not *whether* any do. It *is* potentially fatal to simplistic versions of reading 5 that imply the state can be wholly neutral.
  *   **The Kantian Objection (Coercion & Virtue):** As noted under Reading 1, this **is largely irrelevant to Devlin.** His goal is social stability through behavioral conformity to essential shared norms, not fostering individual moral worth. Coerced conformity *does* serve his purpose. Hart might find it sympathetic to his liberty concerns but doesn't rely on it centrally.

  **Why Did the Class Nod? The Likely Reading & Restarting the Discussion**

  *   **The Probable Reading:** The nod most likely reflected **Reading 4 (Practical Infeasibility)** or **Reading 5 (Normative Claim)**, perhaps blended. The intuition is strong: laws against victimless "immoral" acts often fail, breed resentment, and are costly. It resonates with liberal skepticism about state moralism. *However, this oversimplifies:* It treats Devlin as claiming law can *easily* or *perfectly* shape morality/society, which he does not. His claim is about the *right* and *necessity* to try to protect core shared norms, acknowledging practical limits.
  *   **The Argument Needed:** To genuinely dismiss Devlin *on his own terms* using the slogan, one would need to argue: "Even granting society rests on shared morality, using law to enforce it *beyond preventing harm/offense* is either (a) practically doomed to fail/counterproductive (Reading 4), or (b) inherently illegitimate in a free society (Reading 5), *and* Devlin's disintegration thesis is empirically unfounded." Merely stating the slogan avoids this engagement.
  *   **Opening Without Pedantry:** Your opening statement (above) models the approach. Emphasize:
      *   The *slogan's intuitive appeal* reflects real concerns (practicality, liberty).
      *   The *goal* is precision to advance the debate, not nitpick.
      *   Devlin's argument is *more specific and nuanced* than the slogan implies ("prima facie right," "shared constitutive morality," "disintegration thesis").
      *   The central question remains: **Does the mere fact that a majority (via the jury-box) deems conduct "immoral" (absent harm/offense) give society a sufficient *pro tanto* reason to prohibit it, based on the need to preserve social cohesion?** Hart says no (harm/liberty/empirical doubt); Devlin says yes. Feinberg offers a middle path (offense). The slogan, in most readings, avoids this core question or assumes Hart's answer.

  **Focus Thursday's discussion on whether *any* plausible reading of "you can't legislate morality" actually defeats Devlin's *specific* claim about the state's *prima facie right* to enforce *shared public morality* to prevent social *disintegration*, and what work Hart's harm principle and critique of the disintegration thesis still need to do.** The handout provides the map; the seminar must navigate the terrain.
