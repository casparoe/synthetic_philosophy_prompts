answer: |-
  The phenomenon you've identified—where politically engineered famines are linguistically reframed as natural disasters, erasing human agency—lacks a single established term but intersects with several critical concepts. The most precise way to capture it is through a **synthesized framework**, with a newly coined term for its core mechanism:

  ### Core Concept: **Agro-Absolution**  
  *(n.) The discursive practice of attributing famine causality exclusively to agricultural or meteorological factors (e.g., "crop failure," "drought"), thereby absolving political actors of responsibility for resource distribution, policy decisions, or systemic violence that determine starvation.*  

  ### Carving the Concept:
  1. **Mechanism vs. Structure**:  
     - **Structural violence** (Galtung) explains *why* systems cause harm through inequitable resource control.  
     - **Agro-absolution** is the *rhetorical sleight-of-hand* that masks this violence by naturalizing outcomes. It converts structure into spectacle—famine becomes a "tragedy of nature," not a "crime of policy."

  2. **Distinction from Euphemism/Understatement**:  
     - Euphemism softens blame (e.g., "collateral damage"); understatement minimizes scale.  
     - Agro-absolution *transfers agency* entirely. It doesn’t mitigate culpability—it dissolves it into ecological inevitability. Example:  
       - *Understatement*: "The administration underestimated the crisis."  
       - *Agro-absolution*: "The monsoon failed, and starvation followed."

  3. **Boundary with Sincerity**:  
     Agro-absolution functions *regardless of intent*. It operates when:  
     - **Cynical**: Officials invoke "bad weather" while exporting grain (e.g., Ireland 1846–47, Bengal 1943).  
     - **Sincere but Misplaced**: Historians, overlooking entitlement collapse (Sen), fixate on production shortfalls.  
     - **Structural Ignorance**: Embedded colonial/ideological frameworks naturalize suffering (e.g., British "Malthusian" readings of Irish famine).  
     *Boundary Case*: A genuine, isolated crop disaster *without* policy failure (e.g., Iceland’s 1783 Laki eruption famine) isn’t agro-absolution—unless used to obscure *contemporary* political neglect.

  4. **Contrast with Passive Voice**:  
     Grammatical agent-removal ("Food was exported") is a *tool* of agro-absolution. The broader practice includes:  
     - Lexical substitution ("food shortage" vs. "forced requisitioning")  
     - Metaphorical framing (famine as "act of God," not policy)  
     - Epistemic silencing (disregarding Sen’s "entitlement failure" in favor of production stats).

  ### Why "Agro-Absolution"?
  - **"Agro"** roots the term in agriculture/nature—the claimed source of causality.  
  - **"Absolution"** denotes moral cleansing, transferring blame from humans to environment.  
  - It avoids overstretch (e.g., "naturalizing" covers broader social constructs like gender).  
  - It names the *act* of exoneration, not just the outcome.

  ### Testing Against Cases:
  - **Irish Famine** (1845–49):  
    *Agro-absolution*: London papers blamed "potato blight," ignoring corn exports under armed guard and Peel’s laissez-faire ideology.  
  - **Bengal Famine** (1943):  
    *Agro-absolution*: Churchill’s War Cabinet cited "cyclones," not the diversion of rice to troops or trade restrictions.  
  - **Great Leap Forward** (1958–62):  
    *Agro-absolution*: Mao attributed deaths to "natural calamities," obscuring collectivization and grain quotas.  

  ### Conceptual Neighbors:
  | **Concept**          | **Focus**                          | **Divergence from Agro-Absolution**               |  
  |----------------------|------------------------------------|--------------------------------------------------|  
  | Structural Violence  | Systemic harm via inequity         | Explains cause; agro-absolution obscures cause   |  
  | Entitlement Approach | Access to food, not production     | Economic analysis; agro-absolution is discursive |  
  | Necropolitics        | State power over life/death        | Political theory; agro-absolution is linguistic  |  
  | Disaster Capitalism  | Exploiting crises for profit       | Focus on capital, not rhetoric                   |  

  ### Why This Matters for Your Piece:
  Agro-absolution isn’t just semantics—it’s **apologia via ecology**. By naming it, you expose how language launders political will into natural misfortune, turning victims into "casualties of circumstance." This framing persists because it serves power: today’s climate-fueled crises risk similar obfuscation when corporations/states invoke "natural disaster" while blocking aid or equity. Your historical cases reveal a pattern—*famine isn’t grown in fields; it’s manufactured in ministries*—and agro-absolution is the rhetorical factory.

  ---

  ### Suggested Use in Your Article:  
  > *"When officials spoke of 'failed harvests' during the Irish Famine, or 'adverse weather' in Bengal, they engaged in* **agro-absolution**: *a linguistic alchemy that transformed policy choices into forces of nature. Starvation became a weather event—agentless, inevitable, and morally inert—even as ships laden with grain sailed past skeletal crowds. This framing didn’t just describe disaster; it engineered impunity."*
