answer: |-
  Here’s the disciplined mapping you requested, followed by a direct engagement with your anomalies, theoretical implications, and silences:

  ### 1. Core Mapping: Versailles as Costly Signaling System  
  - **Signalers**: Nobles (especially *les grands* — dukes, princes, marshals).  
  - **Primary Audience**: **Domestic rivals** (other nobles, royal factions). Foreign courts were secondary; internal hierarchy was the battlefield.  
  - **Signal**: **Demonstrated capacity to sustain ruinous expenditure** to access the king. Not gifts *to* rivals (à la potlatch) but **sunk costs in ritual participation**:  
    - *Proximity rituals* (levée, *coucher*): Rights to hand the king’s shirt signaled favor.  
    - *Concrete expenditures*: Gold-embroidered coats (costing years of artisan labor), gambling losses (often deliberate), retinues of liveried servants.  
  - **Currency**:  
    - *Costs*: Liquid wealth (often leveraged via debt/deforestation of estates).  
    - *Benefits*: **Political survival** (avoiding exile), **marriage alliances**, titles, governorships, pensions.  
    - *Fitness translation*: In bio-terms, access to resources = reproductive/survival advantage. Nobles traded economic "fitness" (land revenue) for political "fitness" (influence).  
  - **Credibility Mechanism**: **Condition-dependent handicap + index**.  
    - *Index*: Physical presence *at* Versailles was mandatory. Absence signaled disfavor or poverty.  
    - *Handicap*: Only those with vast resources could "afford" the losses. Crucially, **the king's favor could replenish wealth** (pensions, offices), creating a feedback loop where expenditure proved capacity to extract royal patronage.  

  ---

  ### 2. Your Anomalies: Breaking the Model  
  **Anomaly 1: Tax-Financed Costs**  
  - Nobles’ wealth derived from estates worked by peasants, yet signaling credibility *holds* because:  
    - **Resource extraction was the signal**. A duke’s ability to drain peasant labor/rents *was* the trait being signaled — managerial control, not mere coin.  
    - **The king’s redistribution validated the signal**. Royal gifts (e.g., tax farms, monopolies) rewarded nobles who proved extraction capacity. Display wasn’t about "personal wealth" but **demonstrated access to revenue streams**.  

  **Anomaly 2: The King as Rule-Setter and Surplus-Capturer**  
  - This isn’t signaling; it’s **mechanism design by the receiver (Louis XIV)**:  
    - Louis defined credible signals (ritual proximity), forcing nobles to reveal private information (loyalty, resources) through costly actions.  
    - **Neutralization of rivals** was the goal: Nobles signaling *to each other* depleted their wealth, while Louis harvested political quiescence.  
    - *Contra* Zahavi/Spence, the "receiver" (king) paid nothing, set rules, and reaped rewards. This aligns with **screening theory**: Louis designed filters to separate loyal (rich) nobles from threats.  

  ---

  ### 3. What Versailles Reveals About Signaling Theory  
  - **Confirmation with Twists**:  
    - Handicap principle *works* for nobles signaling to peers/kings: Costly display sorted high-resource vs. low-resource actors.  
    - But **Louis’s role exposes theory’s blind spot**: It cannot natively handle a *strategic receiver* who manipulates the signaling environment to extract rents.  
  - **Fiscal Collapse as Consistent Outcome**:  
    - Signaling equilibria often **over-consume resources** (e.g., peacock tails). Versailles’ waste was rational for *individual* nobles (avoiding political death) but collectively disastrous.  
    - **What would falsify it?** If nobles *gained nothing* from expenditure (e.g., if Louis exiled big spenders randomly). But spending correlated with survival.  

  ---

  ### 4. Where the Framework Goes Silent  
  - **The Fiscal Underworld**: Venal offices and loans enabled signaling but were *outside* the display ritual. Signaling theory ignores **how signals are financed** — only costs matter.  
  - **International Signaling**: Versailles projected power *externally* (e.g., Hall of Mirrors intimidating ambassadors), but this was **cheaper talk** — foreign courts couldn’t verify costs.  
  - **Women at Court**: Their signaling (gambling, dress, salons) mirrored male competition for influence/marriages. Theory *applies* but is gender-blind; it misses how **female networks exploited the same logic**.  
  - **Alternative Explanations**:  
    - **Elias’s Figuration**: Costly signaling explains *individual* actions; Elias explains system stability via **interdependence chains** (nobles disciplining each other).  
    - **Fiscal-Military Statebuilding**: War finance (not signaling) drove venal offices/borrowing. Versailles was a **byproduct** of elite bargains to fund wars.  

  ---

  ### Your Framing: Fair or Tendentious?  
  Your framing is **rigorous, not tendentious**. Versailles *does* strain classic signaling models by:  
  1. Decoupling cost-bearing (peasants) and signaling (nobles).  
  2. Making the receiver (king) the system’s architect.  
  **A defended synthesis**: Versailles was a **hybrid model**. Nobles signaled *horizontally* via handicaps (Zahavi), while Louis ran a *vertical* screening mechanism (Spence + mechanism design). The anomaly isn’t fatal — it shows signaling theory must incorporate **power asymmetries** and **institutional design**. The framework bends but holds where costs are visible, rivalrous, and tied to rewards. Where it snaps is in explaining *why Louis needed this system* — there, war finance and elite bargaining (not signaling) dominate.  

  Would you like to drill deeper into any pivot?
