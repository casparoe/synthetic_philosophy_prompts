prompt: |-
  Give an example of a historical case — technological, institutional, or infrastructural — in which the outward signs all point to path dependence (an early standards battle, a founding accident, heavy switching costs, network effects) but where, on careful inspection, the better explanation is convergence: had the accident gone the other way, something close to the same outcome would have arrived anyway by a different route. The deep question here is the human-history version of the old Gould–Conway Morris dispute about whether evolutionary outcomes are contingent or convergent, and I want a case that actually does the work of separating the two hypotheses rather than merely gesturing at the idea that history matters.

  Make it a case you can defend in detail. Explain what the lock-in reading would say about it, then what the convergence reading says, and identify the specific features that decide between the two — for instance, how many independent near-equivalent alternatives were live at the critical juncture, whether the winning design's advantages were visible in advance or only retrospectively manufactured, and whether the supposed switching costs were genuinely unrecoverable or merely politically painful. Then give the single strongest reason to think you have made the wrong call.

  Constraints: avoid the canonical examples — QWERTY, VHS vs. Betamax, alternating vs. direct current, narrow-gauge railways, the internal combustion engine. Do not cite literature or point me to reading; argue entirely from what you actually know about the case. Begin your reply with the example itself, stated in one sentence, and give the full reasoning afterward — no preamble, and do not restate the question.
reasoning: |-
  Alright, let's tackle this. The user wants a historical case that seems path-dependent but actually demonstrates convergence. They mentioned avoiding the usual examples like QWERTY or VHS. 

  First, I need to recall cases where initial accidents or standards battles happened, but the outcome might have been inevitable. The typewriter keyboard (QWERTY) is off-limits, so what else? Nuclear power comes to mind. The Light Water Reactor (LWR) became dominant, but was it really path-dependent?

  The lock-in explanation: The US chose LWR for submarines because it was compact and quick to develop. Early naval adoption and the Atoms for Peace program pushed LWR as the standard. High costs of reactors and regulatory systems created switching costs. Network effects in training, supply chains, and regulations made alternatives hard to adopt. So, it seems locked in.

  But convergence? Let's see. The alternatives weren't actually better. Sodium-cooled fast breeders had safety issues (sodium reacts with water/air). Gas-cooled reactors were complex and expensive. LWR's water cooling was safer and used existing engineering knowledge (steam systems). Plus, uranium was plentiful, reducing the need for breeders. Countries like France and the USSR initially tried other designs but shifted to LWRs later. This suggests that even without the naval push, LWR might have won because of inherent advantages in safety and compatibility.

  Key factors: Multiple alternatives existed, but their flaws became apparent. The advantages of LWR were not just retrospective; water's safety and engineering familiarity were known. Switching costs were high, but the convergence point was strong enough that other nations adopted LWR despite initial different paths.

  Strongest counter: The nuclear industry's stagnation. If LWR was truly superior, why didn't innovation continue? Maybe path dependence locked in an inferior design, preventing better alternatives from emerging. However, the lack of progress might be due to public fear and regulations post-accidents, not the reactor design itself. 

  So, nuclear power fits. It shows that even without the initial naval choice, LWR would likely dominate due to its inherent strengths.
answer: |-
  **Nuclear power reactor design: the dominance of light water reactors (LWRs) despite early alternatives.**

  **Lock-in reading:** The US Navy's selection of pressurised water reactors (PWRs, a type of LWR) for nuclear submarines in the 1950s was a foundational accident driven by specific military needs (compactness, rapid deployment). This choice created massive path dependence:  
  - **Early standardisation:** The Navy's investment developed expertise, supply chains, and regulatory frameworks tailored to LWRs.  
  - **Network effects/externalities:** The civilian "Atoms for Peace" program leveraged this infrastructure, making LWRs cheaper/faster to deploy. Regulators (like the AEC/NRC) codified LWR-specific safety rules.  
  - **Switching costs:** Building non-LWR plants meant retraining personnel, requalifying components, and battling unfamiliar regulators, making alternatives prohibitively expensive. Superior designs (e.g., sodium-cooled fast breeders, gas-cooled reactors) were "locked out" despite potential advantages.  

  **Convergence reading:** LWR dominance wasn't contingent on naval adoption. Fundamental physics and engineering constraints would have led to water-cooled designs prevailing regardless:  
  1. **Intrinsic safety/forgiveness:** Water’s neutron-moderating properties, high heat capacity, and negative void coefficient (inherently stabilising) are unmatched. Alternatives like liquid sodium (fire/toxicity risk) or gas coolants (lower heat transfer) posed greater inherent safety challenges.  
  2. **Material/engineering pragmatism:** LWRs use conventional pressure vessel engineering, stainless steel, and familiar steam cycles. Fast breeders required exotic materials (sodium-resistant alloys); gas-cooled reactors needed complex graphite cores/helium seals. Water’s compatibility with existing industrial knowledge was decisive.  
  3. **Fuel abundance:** Early optimism about uranium scarcity (favouring breeders) proved wrong; cheap uranium made LWR’s lower fuel efficiency irrelevant.  
  4. **Evidence from parallel development:** The USSR independently developed PWRs (VVER) *and* pursued alternatives, yet LWRs became dominant there too. France abandoned gas-graphite for LWRs post-1970s when scaling revealed cost/safety issues.  

  **Decisive features:**  
  - **Live alternatives:** Sodium fast breeders (EBR-I), gas-cooled reactors (Magnox, HTGR), even organic-cooled designs competed.  
  - **Advantages visible in advance?** Water’s safety margins and engineering simplicity were known pre-Navy choice (e.g., Oak Ridge’s early water boiler reactors). Naval selection accelerated, but didn’t create, these advantages.  
  - **Unrecoverable switching costs?** High but not insurmountable: France switched entire fleet post-1973 *despite* sunk costs in gas-graphite, proving alternatives could be abandoned when LWRs’ intrinsic merits became undeniable at scale.  

  **Strongest reason this call might be wrong:** The persistent niche viability of high-temperature gas reactors (HTGRs) for process heat/advanced applications suggests that with sustained investment (absent LWR lock-in), a diversified reactor ecosystem *might* have emerged. LWRs’ stagnation in cost/innovation since the 1980s could indicate path-dependent inefficiency—superior designs were suppressed by the early standard, not inherent flaws.
