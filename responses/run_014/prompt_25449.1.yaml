prompt: |-
  I'm on my university's faculty senate rules committee and we're stuck. We're revising how we vote on tenure-track hiring decisions. Right now we use simple plurality — whoever gets the most votes wins, even if a majority of the department actually ranked them last. Some of us want to switch to ranked-choice (instant runoff) or approval voting. But one committee member keeps bringing up Arrow's impossibility theorem and saying, look, no voting system can be truly fair, so why bother changing anything — we should just stick with plurality and move on. This has kind of paralyzed the discussion and we're supposed to have a recommendation by next meeting.

  Can you draft a short memo for me to circulate? It should recommend a specific voting method for our hiring decisions and give reasons. It needs to take the Arrow-based objection seriously — not just handwave it away, but explain what Arrow's theorem actually does and doesn't imply for a practical choice like ours. The memo should have a clear bottom-line recommendation we can vote on, and it should be honest about the downsides of whatever method we pick.
reasoning: |-
  Okay, I need to help a user who's on a university faculty senate rules committee. They're stuck on revising their tenure-track hiring voting system. Currently, they use simple plurality, which has clear flaws—like someone winning even if a majority ranked them last. Some want ranked-choice or approval voting, but one member keeps citing Arrow's impossibility theorem to argue that no system is fair, so they should just stick with plurality. This has paralyzed the discussion, and they need a recommendation soon.

  The user asked me to draft a short memo to circulate. It must recommend a specific voting method, address the Arrow-based objection seriously, explain what the theorem really means in this context, and be honest about downsides. The memo needs a clear bottom-line recommendation they can vote on.

  First, I should recall Arrow's theorem. It states that no ranked voting system can satisfy all fairness criteria (like Pareto efficiency, independence of irrelevant alternatives, non-dictatorship, and unrestricted domain) simultaneously. But that's for ranked systems where voters order all candidates. In practical situations like this, not all criteria may be equally important, and Arrow doesn't apply to non-ranked systems like approval voting.

  For the committee's needs, I need to assess the options: plurality, ranked-choice, and approval voting. Plurality is bad because it ignores preferences beyond the top choice, leading to winners disliked by most. Ranked-choice (instant runoff) is better as it eliminates the need for strategic voting in runoff elections and ensures the winner has broad support, but it can be complex and might violate independence of irrelevant alternatives. Approval voting is simple—voters approve any number of candidates, and the most approved wins—but it might encourage strategic voting if people don't approve their true favorites to avoid helping rivals.

  Comparing them: approval voting seems strong for hiring decisions because it encourages consensus-building, is simple to use and count, and avoids Arrow's theorem since it's not a ranked system. Arrow only applies to systems with ranked ballots, so approval voting sidesteps that issue entirely. However, it has downsides, like potential for bullet voting or not capturing intensity of preference.

  In the memo, I should recommend approval voting as the best choice. Reasons: it's fairer than plurality, simple to implement, and promotes finding candidates acceptable to many. For Arrow's objection, I'll explain that the theorem shows no ranked system is perfect, but it doesn't mean all systems are equally flawed—plurality has known issues, while others are better. Approval voting isn't covered by Arrow, so it's a valid alternative.

  I need to be honest about downsides. For approval voting, that includes not expressing preference rankings explicitly and possible strategy. But overall, it's a big improvement over plurality. The memo should end with a clear motion for voting.

  Structuring the memo: start with context and problem, explain options, address Arrow, recommend approval voting, state downsides, and propose a motion. Keep it concise, professional, and persuasive to break the deadlock. Aim for about 500 words to keep it short.

  Finally, ensure the tone is helpful and authoritative, drawing from knowledge of voting theory to educate the committee and move them forward.
answer: |-
  ## Memorandum  
  To: Faculty Senate Rules Committee  
  From: [Your Name/Committee Role]  
  Date: October 26, 2023  
  Subject: Recommendation for Revised Voting Method on Tenure-Track Hiring Decisions  

  ### Background & Problem Statement
  Our current simple plurality system for tenure-track hiring votes carries a significant risk: a candidate can win despite being the *last choice* of a majority of voters. This outcome undermines departmental cohesion and fails to identify the candidate with the broadest support. While no voting system is perfect, we have a responsibility to adopt a method that better reflects collective preferences and minimizes the potential for such divisive outcomes. Proposals for Ranked-Choice Voting (RCV - Instant Runoff) or Approval Voting (AV) offer improvements, but concerns have been raised citing Arrow's Impossibility Theorem as a reason to abandon reform efforts.

  ### Addressing Arrow's Impossibility Theorem
  Arrow's theorem is a profound mathematical result demonstrating that *no ranked voting system* (where voters submit a complete ordering of candidates) can simultaneously satisfy five seemingly reasonable fairness criteria (Unrestricted Domain, Non-dictatorship, Pareto Efficiency, Independence of Irrelevant Alternatives - IIA) in all cases.  

  **What this means for us:**
  1.  **It confirms perfection is unattainable:** No ranked system (like RCV) is flawless. In some complex scenarios with many candidates, outcomes might seem paradoxical or sensitive to the specific set of candidates (violating IIA).
  2.  **It does *not* imply all systems are equally flawed:** Arrow's theorem specifically addresses *ranked* systems. It says nothing about non-ranked systems like Approval Voting or our current Plurality system. Crucially, **it does *not* justify sticking with a demonstrably problematic system like Plurality simply because perfection is impossible.**
  3.  **It highlights context matters:** Arrow's theorem describes worst-case scenarios. In practice, for decisions like ours (typically involving a small number of well-known candidates, where finding broadly acceptable consensus is paramount), many systems perform well and avoid the most egregious flaws of plurality.
  4.  **Our goal is "better," not "perfect":** Our mandate is to choose a *more reliable and fairer* method than the status quo, not an unimpeachable one. Arrow identifies inherent trade-offs; our task is to choose the trade-offs best suited to faculty hiring.

  ### Evaluation of Options
  1.  **Current System: Simple Plurality**  
      *   **Downsides:** High risk of electing a widely disliked candidate ("least worst" or polarizing choice); encourages strategic voting (e.g., abandoning a true favorite perceived as "unelectable"); fails to capture preference strength beyond first choice.  
      *   **Upsides:** Simple to understand and count.
  2.  **Ranked-Choice Voting (RCV - Instant Runoff)**  
      *   **Upsides:** Ensures the winner has majority support against the *remaining* candidates in the final round; allows expression of full preferences; reduces pressure for strategic voting in early rounds compared to plurality; eliminates need for separate runoff elections.  
      *   **Downsides:** More complex counting; can violate IIA (adding/removing a "spoiler" candidate *can* change the winner between the original two frontrunners - this is the specific Arrow-related vulnerability); ballots can be invalid if not ranked fully/clearly.
  3.  **Approval Voting (AV)**  
      *   **Upsides:** Simple ballot ("Approve" any number of candidates); simple count (candidate with most approvals wins); encourages voters to support *all* acceptable candidates, fostering consensus; highly resistant to vote-splitting and spoilers; not subject to Arrow's Theorem (as it uses non-ranked ballots); excellent at identifying broadly acceptable candidates.  
      *   **Downsides:** Does not capture strength of preference between approved candidates (someone approved by all as a "solid #2" wins over a passionate first choice approved by only 51%); potential for strategic "bullet voting" (approving only one favorite) or "over-approving" (though evidence suggests this is minimal in small, informed groups like ours).

  ### Recommendation: Approval Voting (AV)
  **Motion:** The Rules Committee recommends adopting Approval Voting for all tenure-track faculty hiring decisions within departmental votes presented to the Faculty Senate.  

  **Reasoning:**  
  1.  **Effectively Mitigates the Plurality Flaw:** AV directly addresses our core problem. A candidate who is the last choice of a majority cannot win under AV, as those voters would simply not approve them. The winner is the candidate acceptable to the largest number of voters.  
  2.  **Simplicity & Practicality:** Ballots are intuitive ("Which candidates are acceptable for this position?"). Counting is straightforward (summing approvals), faster than RCV, and auditable.  
  3.  **Promotes Consensus:** AV incentivizes voters to consider which candidates they genuinely find acceptable, moving towards a hire with broad-based support rather than a polarizing figure.  
  4.  **Resilience:** AV is highly resistant to vote-splitting and spoiler effects common in plurality. It avoids the specific IIA vulnerability highlighted by Arrow in ranked systems.  
  5.  **Best Fit for Context:** In small, informed committees/votes on critical hires like tenure-track positions, where identifying a *consensus* candidate is paramount, AV's strengths shine. The lack of preference strength capture is a lesser concern than the risk of electing a widely unacceptable candidate under plurality.  

  **Acknowledged Downsides of AV:**  
  *   Voters cannot express a ranked order of preference among candidates they approve. A candidate who is everyone's strong second choice might win over someone who is the passionate first choice of a slightly smaller, but still majority, group.  
  *   There is a theoretical potential for strategic voting (e.g., bullet voting for a single favorite, or approving extra candidates to help/hurt others). However, empirical studies and real-world use in academic/scientific societies suggest this is minimal in small, high-stakes, informed groups where voters care about the outcome and understand the system. The simplicity often encourages honest voting.  

  ### Conclusion
  Arrow's Impossibility Theorem is a valuable reminder that no ranked voting system is flawless. However, it does not condemn all voting reform, nor does it suggest that our current plurality system is as good as any alternative. Approval Voting offers a demonstrably superior method for our specific needs: it is simple, robust, promotes consensus, and directly eliminates the critical flaw of our current system where a widely unacceptable candidate can win. While it doesn't capture ranked preferences, its practical advantages in fostering broadly supported hiring decisions make it the strongest choice for the Faculty Senate.  

  **We move to recommend the adoption of Approval Voting.**  

  Vote: [ ] Recommend Approval Voting [ ] Recommend Another System [ ] Make No Recommendation
