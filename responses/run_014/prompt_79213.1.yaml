prompt: |-
  I'm a science journalist — I write about AI and the mind, mostly — and I'm part-way through a longish piece on the idea that thinking is computation, the whole "is the brain a computer?" thing, and everyone keeps telling me it starts with Hobbes, so I've gone back to the source. I'm stuck on chapter 1 of his Elements of Philosophy, the one people usually just call De Corpore (English version, 1656), where he writes: "By RATIOCINATION, I mean computation. Now to compute, is either to collect the sum of many things that are added together, or to know what remains when one thing is taken out of another. Ratiocination, therefore, is the same with addition and substraction; and if any man add multiplication and division, I will not be against it, seeing multiplication is nothing but addition of equals one to another, and division nothing but a substraction of equals one from another, as often as is possible. So that all ratiocination is comprehended in these two operations of the mind, addition and substraction." And then the very next thing he does is try to show how we manage this "in our silent thoughts, without the use of words", with an example of a man seeing something from far off and compounding his ideas into one, the way the three names body, animated, rational compound into "man".

  What I can't get straight, and I'd really like help with, is what's actually being claimed. Is this arithmetic on quantities, or just the weaker thought that any stretch of reasoning can be re-described as adding and subtracting ideas or symbols? Is it a claim about the machinery of the mind — which would make him a proto-computationalist a good three centuries before anyone built a general-purpose machine that could do it — or a claim about the form of reasoning, a logician's point about how inference is to be set out, with nothing mechanistic behind it at all? And if it is the mechanistic reading, why isn't this already the computational theory of mind, full stop? My half-formed hunch, which you're welcome to tell me is wrong, is that Hobbes's adding still needs an intelligent someone doing the adding, and that what the modern version adds is the thought that the adding itself can be done by something that understands nothing whatsoever — so the new ingredient is the program, not the arithmetic. I'd also like to know what that "without the use of words" example is doing: does it help the computational reading, since thought is compounding even without language, or hurt it, since then what exactly are the symbols?

  I'm not after a reading list — I've got the texts, I just can't get my head round the arguemnt. Could you write it in British English, and say plainly what's fair to claim about Hobbes here and what would be overreach?
reasoning: |-
  Okay, let me unpack this carefully. The user is a science journalist wrestling with Hobbes' De Corpore, specifically the "thinking is computation" passage that keeps getting cited as a computationalist origin story. They're stuck on whether Hobbes is proposing arithmetic as mental machinery or just a logical formalism.

  First, the core tension: Hobbes says ratiocination = computation = addition/subtraction of ideas. But is this:
  - Literal quantity-crunching in the brain?
  - A metaphor for combining concepts?
  - A proto-computationalist blueprint?

  Key clues in the text:
  1. He includes multiplication/division but reduces them to repeated addition/subtraction - this feels like operational pragmatism, not a theory of neural mechanisms.
  2. The "silent thoughts" example: a man seeing a distant shape and "adding" body + animated + rational = man. Crucially, this happens without words. That suggests:
     - The computational process is fundamental to cognition itself, not dependent on language
     - BUT... the "symbols" here are sensory impressions and concepts, not formal tokens

  Where modern computational theory diverges:
  - Hobbes' computer (the mind) requires understanding to perform the additions. The homunculus is still in the machine.
  - Contemporary CTM separates syntax (mechanical symbol manipulation) from semantics (meaning). Hobbes lacks this layer - his additions are meaningful by fiat.

  Journalist's hunch seems spot-on: Hobbes gives us computation as process but not computation as mechanism. The missing piece is the program - the set of formal rules that can execute cognition without comprehension.

  What's fair to claim:
  - Hobbes was first to explicitly equate reasoning with computation
  - He extended this to non-verbal thought
  - He mechanized reasoning but not the reasoner

  What's overreach:
  - That he anticipated neural computation or symbolic AI
  - That he solved the homunculus problem
  - That his model is sufficient without external semantic grounding

  The "without words" example actually strengthens the computational reading by showing the operations work on pre-linguistic representations, but weakens the symbol-manipulation angle because his "symbols" aren't discrete or arbitrary.

  Final nuance: Hobbes was likely more focused on formalizing epistemology than building psychological models. His computation is about valid inference, not cognitive architecture.
answer: |-
  Right, let's cut through the undergrowth on this. Hobbes *is* a crucial starting point, but pinning down what he actually claimed—and how much it foreshadows modern computational theory of mind (CTM)—requires care. Here's a plain take in British English, separating what's fair from overreach, and tackling your specific queries.

  ### What Hobbes Actually Claims (De Corpore, Ch.1)
  1.  **The Core Thesis:** Reasoning ("ratiocination") *is* computation. Computation *is* adding and subtracting ("addition and substraction").
  2.  **The Scope:** This applies to *all* reasoning – forming concepts ("silent thoughts") and drawing logical conclusions.
  3.  **The Mechanism (Sort Of):** Ideas are treated like units or magnitudes that can be combined or separated. Seeing a distant object and compounding "Body" + "Animated" + "Rational" into "Man" is adding. Realising it's not a cloud (subtracting the idea "cloud") is subtracting.
  4.  **Beyond Language:** The "silent thoughts" example is crucial for Hobbes. He insists this computation happens with raw sensory ideas and concepts *before* language gets involved. Words are *labels* for these mental computations, not the fundamental stuff itself. He's grounding computation in perception and basic cognition.
  5.  **Arithmetic? Sort of, but not really:** He uses arithmetic terms, but explicitly says multiplication/division are just repeated addition/subtraction. The key point isn't *numerical* quantity, but **manipulating mental entities** by combining or separating them. It's about operations on *units of thought*.

  ### Is it Quantitative Arithmetic or Symbolic Manipulation?
  *   **Neither purely.** It's closer to **conceptual/ideational manipulation**. Hobbes isn't primarily talking about numbers. He's saying *any* act of reasoning – recognising an object, deducing a consequence – involves mentally assembling or disassembling component ideas. "Body + Animated + Rational = Man" isn't numerical, it's combinatorial. It's **weaker than full arithmetic** but **stronger than mere analogy**; he claims this *is* the literal process.

  ### Mechanism vs. Formalism: Proto-Computationalist?
  *   **It's Mechanistic *Intent*, but Limited:** Hobbes absolutely intended a *mechanical* model of mind. He was a thoroughgoing materialist – mind *is* matter in motion. Thinking *is* a physical process of adding/subtracting mental motions (ideas). This is revolutionary for 1656.
  *   **Why it's NOT full-blown CTM (Your Hunch is Spot On):**
      *   **The Homunculus Problem:** Hobbes lacks the concept of **formal symbol manipulation**. In his model, the mind (or the "someone" *in* the mind) *understands* what "Body," "Animated," and "Rational" *mean*. The adding/subtracting is done *by* an intelligent agent *on meaningful ideas*. There's no separation of syntax (form) from semantics (meaning), and no concept of rules operating blindly on uninterpreted symbols.
      *   **No Program, No Architecture:** Modern CTM relies on a stored program (set of instructions) acting on symbolic representations within a defined architecture. Hobbes gives us the *operations* (add/subtract) and the *stuff operated on* (ideas), but not the programmable *control mechanism* or the concept of internal symbolic *states* that can be manipulated without intrinsic meaning. His "computer" needs an intelligent operator; a modern computer doesn't.
      *   **The Nature of "Symbols":** His "ideas" are sensory/mental *concepts* with inherent meaning derived from perception. They aren't arbitrary, syntactic tokens like "0"s and "1"s or logic symbols. The computation happens on the meaningful content itself.

  ### What the "Without Words" Example Does
  *   **Strengthens the Computational *Scope*:** It shows Hobbes isn't just talking about formal logic or language-based reasoning. He's grounding computation in the most basic, pre-linguistic cognitive acts – perception and concept formation. This makes his claim more radical and potentially more relevant to core cognition.
  *   **Highlights the Problem for a *Symbolic* Reading:** It also exposes the ambiguity. *What* exactly is being added in "silent thought"? Fuzzy sensory impressions? Proto-concepts? How are they individuated as discrete units for addition/subtraction without language? Hobbes isn't clear. This makes it hard to map cleanly onto modern symbolic computation, where symbols *are* discrete and defined, precisely *because* they are syntactic.

  ### Fair Claims vs. Overreach
  *   **Fair Claims:**
      *   Hobbes was the first to explicitly and systematically equate *all* reasoning with computation (understood as addition/subtraction).
      *   He proposed a *mechanical* (materialist) basis for thought, reducing mental operations to combinatorial operations on mental entities.
      *   He extended this computational model to non-linguistic thought (perception, concept formation).
      *   He provided a crucial historical origin point for the idea that thinking might be a form of calculation.
      *   He identified the core operations (combination/separation) that later logicians and computer scientists formalised.
  *   **Overreach:**
      *   Claiming Hobbes had a **computational theory of mind** in the *modern* sense (symbolic representation, stored programs, syntax/semantics separation, implementation in hardware). He didn't.
      *   Saying he anticipated **Turing machines, neural networks, or digital computers**. His "computation" is far more primitive and lacks the key innovations (formal symbols, programs, universality).
      *   Arguing he solved the **homunculus problem**. He merely relocated it; the intelligence performing the additions/subtractions remains unexplained.
      *   Suggesting his "ideas" are equivalent to **computational symbols**. They are meaningful mental contents, not uninterpreted syntactic tokens.
      *   Implying his model is **sufficiently detailed** as a cognitive theory. It's a powerful metaphor and foundational claim, but lacks the machinery to explain *how* the adding/subtracting is implemented or controlled beyond basic sensory combination.

  ### In a Nutshell for Your Piece
  Hobbes deserves credit for the **bold, original insight**: thinking *is* computation, understood mechanically as adding and subtracting mental units, even without words. This is the seed of computationalism. However, it's **proto-computationalist**. The critical leap to the modern CTM wasn't just the *idea* of computation, but the **formalisation of symbol manipulation** – the realisation that reasoning could be achieved by purely mechanical processes operating on meaningless symbols according to fixed rules (a program), *without* an intelligent homunculus doing the understanding at each step. Hobbes gave us the computation; Turing, von Neumann, and later cognitive scientists gave us the programmable machine that could perform it blindly. Your hunch about the intelligent adder vs. the blind program is precisely the key distinction. The "without words" example shows Hobbes's ambition but also highlights the fuzziness of his "symbols" compared to the formal tokens of modern computation.
