prompt: |-
  I'm prepping a session on Goodhart's law and I want a case built to order, rather than the usual cobra-farm anecdote that everyones heard and that isn't even the interesting kind of failure.

  Spec: a realistic institutional setting — hospital, school, firm, funder, sports team, whatever you like, one paragraph, no AI/ML examples — in which a performance metric comes apart from the thing it's meant to track, under all of the following at once:

  - nobodies acting in bad faith and nobody's optimising against the metric;
  - the metric isn't a bad measure: for each person or unit measured it's unbiased, and a higher score really does mean a higher underlying value on average;
  - the metric doesn't causally change the thing it measures, and no one's stretching it into a range where its relationship to that thing breaks down;
  - and yet the institution uses it exactly as intended and systematically ends up rewarding the wrong people.

  Then do the analysis. I want to know what's actually going on, why it's structural rather than a mistake anybody made, how the distortion changes when the selection gets harsher (top 10% vs top 1% — I want a direction, and a rough sense of magnitude), what single change defuses it without giving up measurement altogether, and how someone who thinks this is just ordinary measurement error would push back.

  Format, please, and in British English:

  **The case** — the scenario itself, about 150 words, no commentary.
  **The mechanism** — what's really happening, about 150 words.
  **Turn the dial** — what happens as the selection gets harsher, about 80 words.
  **The fix** — one concrete change, about 80 words.
  **The comeback** — the strongest objection to your diagnosis, then your reply, about 120 words.

  One more thing: I'd rather the case be one where a casual observer would look at the metric and think it's working fine. And if you think the spec is unsatisfiable as stated, don't fudge it — say so and tell me which condition has to give.
reasoning: |-
  Hmm, the user wants a custom case study on Goodhart's Law that avoids the overused cobra farm example. They need a realistic institutional scenario where a performance metric fails despite meeting very specific conditions: no bad faith actors, the metric itself isn't flawed, no causal interference, and yet it systematically rewards the wrong people. 

  The challenge is designing something that satisfies all these constraints simultaneously. The core paradox is that the metric must be unbiased at individual level yet become misleading at system level. Realistically, this points to some statistical artifact as the only viable mechanism - probably selection effects when comparing heterogeneous groups. 

  For the setting, a hospital makes sense because: performance metrics are high-stakes, the public cares about accuracy, and clinical outcomes have natural variation. The A&E waiting time example works because: 
  - The 4-hour target is genuinely correlated with good care at individual patient level 
  - No one is gaming it (per spec) 
  - But department-level comparisons become distorted because busier departments inherently have more complex cases that are harder to process quickly 

  The key insight is Simpson's paradox operating through unobserved heterogeneity. When we select "top performing" departments based on average wait times, we're actually selecting those with favorable case mixes, not better management. The distortion worsens with stricter selection because the extreme performers are increasingly those with highly skewed patient populations. 

  The proposed fix - risk-adjusted metrics - directly addresses the confounding variable. The comeback about measurement error is valid but insufficient because it ignores the structural bias introduced during selection. 

  This case satisfies all original constraints: 
  1. No bad faith (doctors treat all patients properly) 
  2. Metric unbiased per patient 
  3. No causal interference 
  4. Systematic misrewarding 
  And crucially, it looks superficially valid to observers.
answer: |-
  **The case**  
  A large NHS trust evaluates its Accident & Emergency departments using the percentage of patients seen within 4 hours. The metric is clinically valid: quicker assessment genuinely correlates with better outcomes across individual patients. All departments strive to treat patients promptly without gaming the system. Yet when the trust rewards the "top-performing" departments (say, those in the 90th percentile), it consistently selects smaller, rural units. Larger urban departments – which handle more complex cases, higher volumes, and greater socio-economic deprivation – appear "worse" despite superior clinical staffing and resources. Staff in high-performing urban units feel unfairly penalised.

  **The mechanism**  
  The distortion arises from unobserved heterogeneity in caseload difficulty. While the metric accurately reflects *individual* patient urgency, departments differ systematically in patient mix. Urban units face more elderly patients with comorbidities, mental health crises, and undiagnosed conditions – all requiring longer assessments. The metric doesn’t *cause* this, but when aggregated, it conflates departmental performance with inherent caseload complexity. Selecting top performers based solely on the average 4-hour rate inadvertently selects units with predictably simpler caseloads, not better management. The institution misattributes systemic factors to departmental skill.

  **Turn the dial**  
  As selection harshness increases (e.g., rewarding top 10% → top 1%), the distortion intensifies disproportionately. The "winners" become increasingly extreme outliers in caseload simplicity – small units with atypically young/healthy demographics. Meanwhile, genuinely skilled departments handling complex cases vanish from contention entirely. At top 1%, selected departments may have metrics 20-30% "better" than urban peers, despite no meaningful difference in clinical efficacy under comparable conditions.

  **The fix**  
  Implement risk-adjusted metrics that weight patients by objective complexity factors (age, triage category, comorbidities). Compare departments against expected performance given their specific patient mix, not raw averages. This isolates managerial impact from structural disadvantages.

  **The comeback**  
  *Objection:* "This is just noise from random measurement error. With enough data, true performance will average out – urban departments should improve their processes rather than demand special treatment."  
  *Reply:* Measurement error affects all units equally. Here, the *bias* is structural and directional: urban units are systematically misclassified as worse due to immutable patient demographics, not random variation. Risk-adjustment is standard in clinical trials; refusing it here ignores confounding variables that make direct comparison scientifically invalid. "Averaging out" requires identical caseloads – which isn’t feasible or ethical to engineer.
