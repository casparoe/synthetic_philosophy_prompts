  The envoi needs to land the philosophical punch - that accumulating evidence doesn't resolve but deepens the underdetermination. The triplet should hammer home how the same words/data remain stubbornly multivalent. 

  Biggest challenge: making the physics accurate while fitting the rigid form. "Orbit" must work for both elliptical paths and relativistic curvature. "Fall" needs to cover gravity, spacetime geodesics, and quantum collapse. The quantum stanza is particularly tricky - must convey superposition without breaking meter. 

