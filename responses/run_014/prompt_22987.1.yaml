answer: |-
  You've hit on a genuinely subtle and debated point in formal epistemology! The distinction *is* tricky because both arguments leverage decision-theoretic machinery. Let's break down why proponents claim epistemic utility theory (EUT) is "non-pragmatic" compared to Dutch Book arguments (DBAs), and why your skepticism is understandable:

  ### Core Similarity (Your Point - Absolutely Correct)
  *   **Shared Tool:** Both arguments rely fundamentally on **maximizing expected utility (MEU)**.
  *   **Formal Structure:** In both cases, the argument is: "If your beliefs (credences) are *not* probabilistic, then they are *dominated* by some probabilistic alternative according to expected utility (EU) relative to those very beliefs." This means your own beliefs deem the non-probabilistic state suboptimal.

  ### The Claimed Distinction: The Nature of "Utility"
  The crucial difference proponents (like James Joyce, Allan Gibbard, Richard Pettigrew) emphasize lies in **how the utility function is interpreted** and **what it represents**:

  1.  **Dutch Book Arguments (Pragmatic):**
      *   **Utility = Money (or Pragmatic Value):** The utility function represents *practical, worldly gains/losses*, typically monetary payoffs from bets.
      *   **Failure Mode = Financial Loss/Exploitability:** The argument shows that non-probabilistic credences make you *vulnerable to a sure financial loss* (a Dutch Book) in a betting scenario. Your credences lead you to accept bets that, taken together, *guarantee* you lose money no matter what happens.
      *   **Rationale Grounded in Practical Action:** The normativity ("you *should* have probabilistic credences") stems from the *practical disaster* of being financially exploited. It ties rationality to avoiding *bad consequences in action* (losing money).

  2.  **Epistemic Utility Theory (Allegedly Non-Pragmatic):**
      *   **Utility = Epistemic Accuracy (Alethic Value):** The utility function represents *purely epistemic value* – how *close* your credence is to the *truth*. Common measures are "Scoring Rules" like the Brier Score or Logarithmic Score. A higher score means greater accuracy. Crucially, accuracy is defined *independently* of any practical goals like money, survival, or desire satisfaction. It's about "getting it right" with respect to reality.
      *   **Failure Mode = Epistemic Self-Defeat/Suboptimality:** The argument shows that non-probabilistic credences are *epistemically self-defeating*. *According to your own credences*, some other probabilistic set of credences has *higher expected accuracy*. Your own beliefs judge themselves as less accurate than an alternative probabilistic set.
      *   **Rationale Grounded in Epistemic Goals:** The normativity ("you *should* have probabilistic credences") stems from the *intrinsic epistemic goal* of having accurate beliefs. It ties rationality directly to the *cognitive aim of believing truths and avoiding falsehoods* (or being as accurate as possible), not to avoiding practical disasters.

  ### Why Proponents Claim EUT is "Non-Pragmatic"
  1.  **Goal Independence:** EUT defines the "good" (accuracy) purely in terms of *fitting the world*, not in terms of satisfying desires, achieving practical success, or avoiding loss. Accuracy is an *epistemic good*.
  2.  **No Bets, No Action:** The argument doesn't require you to *act* on your beliefs in bets or decisions. It operates purely at the level of *evaluating belief states themselves* for their accuracy properties. You can be sitting alone in a room contemplating the universe.
  3.  **Self-Defeat, Not Exploitability:** The flaw identified is *internal inconsistency* with the epistemic goal of accuracy (your beliefs undermine their own accuracy aim), not vulnerability to *external manipulation* by a cunning bookie.
  4.  **"Pure" Epistemology:** It frames the justification for probabilism as arising solely from the nature of belief and its constitutive aim (accuracy), aligning with traditional philosophical concerns about truth and justification, rather than instrumental rationality for action.

  ### Your Skepticism & Valid Concerns
  1.  **The MEU Machinery is Pragmatic at Heart?:** This is the strongest counterpoint. MEU is *the* fundamental tool of *instrumental rationality* – choosing means to achieve desired ends. By using MEU, *even* if the "end" is accuracy, EUT seems to portray epistemic rationality *as* a form of instrumental rationality: probabilism is the best *means* to achieve the *end* of accuracy. This blurs the line. Critics (e.g., some pragmatists or expressivists) argue this *is* still pragmatic, just with a "purely epistemic" desire plugged in.
  2.  **Is Accuracy Really Non-Pragmatic?:** Can the *value* of accuracy be completely divorced from practical considerations? Does believing truly about distant quasars *really* have intrinsic value utterly disconnected from any potential future use or our general cognitive design? Some argue the drive for accuracy *itself* has evolutionary/pragmatic roots.
  3.  **"Non-Pragmatic" Might Mean "Not Specifically About Money/Bets":** Sometimes the claim is less that EUT is utterly non-instrumental and more that it avoids the *specific pragmatic context* of betting and financial loss central to DBAs. It generalizes the argument using a more abstract "epistemic good".

  ### Conclusion: What You're (Likely) Missing & Why the Label Persists
  *   You're absolutely correct that the **formal mathematical structure** (dominance arguments using MEU) is identical. That *is* a deep similarity.
  *   The difference proponents insist on is **philosophical interpretation**: *What kind of normativity is being invoked?*
      *   **DBAs:** Instrumental/Prudential Normativity ("Avoid bad practical outcomes!").
      *   **EUT:** Alethic/Epistemic Normativity ("Fulfill the constitutive aim of belief itself: accuracy!").
  *   **The label "non-pragmatic" primarily signals that the *source of normativity* is claimed to be the intrinsic epistemic goal of accuracy, not the avoidance of practical harms.** It's arguing that probabilism is a *constitutive norm* of belief itself, not merely a pragmatic strategy.
  *   **Your confusion is well-founded:** The reliance on MEU *does* make EUT look instrumentally rational. The debate about whether "epistemic instrumentalism" counts as genuinely non-pragmatic is live and complex.

  In essence, proponents argue that while the *engine* (MEU) is the same, the *fuel* (Utility = Accuracy vs. Utility = Money) and the *destination* (Achieving Epistemic Good vs. Avoiding Practical Harm) are fundamentally different, warranting the "non-pragmatic" label. Your intuition that the core method blurs this distinction highlights a genuine tension in the foundations of formal epistemology.
