answer: |-
  ## Sestina of the Unseen Summit

  Within the partial order, we seek the highest **peak**,
  A point unchallenged. Yet contenders shift: the **vertex**
  Of complex graphs, the jewel within the **crown**,
  The sharpest point, the needle's **pinnacle**,
  The breaking wave's most foamy, final **crest**,
  The mountain's goal, the ultimate **summit**.

  We start the climb, declare this point the **summit**,
  Though logic whispers: *seek beyond this **peak***.
  Observe the wave, now frozen at its **crest**,
  The angle's sharpest turn, the crucial **vertex**,
  The spire piercing cloud, that **pinnacle**,
  The gem that makes the monarch's might, the **crown**.

  But doubt ascends: is *this* the truest **crown**?
  Is *that* the final, undisputed **summit**?
  Perhaps this spire, this lonely **pinnacle**,
  Or that far ridge, the higher, unseen **peak**?
  The structure's turning point, the key **vertex**,
  The ocean swell just shy of breaking **crest**.

  Look! Chains emerge, sequences to their **crest**:
  A line of jewels, each brighter than the **crown**,
  A path ascending towards some distant **vertex**,
  A pilgrim's path towards the promised **summit**.
  Each link demands: *behold! This is the **peak**!*
  This sharp ascent defines the rising **pinnacle**.

  Yet chains don't stop; they *must* have bounds. This **pinnacle**
  Is not the end. The wave beyond this **crest**
  Swells higher still, above the prior **peak**.
  A stronger gem outshines the fading **crown**.
  The path winds on beyond the claimed **summit**,
  Towards a nexus point, a grander **vertex**.

  (For every chain must find an upper bound—some **vertex**
  Or stopping point, a granted **pinnacle**,
  A point attained before the final **crest**,
  A gem secured within the endless **crown**,
  A cairn built somewhere on the slope towards **summit**,
  A marker on the way to some true **peak**.)

  **Envoi**

  The lemma speaks: *A maximal element exists*. This **peak**,
  This claimed **vertex**, this bright but fading **crown**,
  This sharp **pinnacle**, this breaking **crest**, this **summit**—
  Proof only names the space where one must fit.

  ---

  **Form & Mathematical Fidelity:**

  1.  **End-Words as Rivals:** The six end-words (Peak, Vertex, Crown, Pinnacle, Crest, Summit) represent competing claimants to being the "maximal element." Each stanza ends with one of them seemingly dominant ("the current highest point").
  2.  **Outflanking:** The rigid sestina rotation (6,1,5,2,4,3) ensures the *last* word of each stanza becomes the *first* word of the next stanza. This structurally enacts the "outflanking" – the new stanza immediately begins by focusing on the previous stanza's "top," implicitly questioning it and introducing the next candidate.
  3.  **Hypothesis Stated:** The parenthetical stanza (5) explicitly states Zorn's Lemma's crucial condition: "For every chain must find an upper bound—some **vertex** / Or stopping point, a granted **pinnacle**..." The end-words here ("vertex," "pinnacle," "crest," "crown," "summit," "peak") are used naturally within the statement.
  4.  **Conclusion Stated:** The envoi begins by flatly stating the conclusion: "The lemma speaks: *A maximal element exists*."
  5.  **The Flat Envoi:** The final three lines of the envoi use all six end-words once ("This **peak**, / This claimed **vertex**, this bright but fading **crown**, / This sharp **pinnacle**, this breaking **crest**, this **summit**—"). They are listed without hierarchy, adjective, or distinction. This mirrors the proof: it guarantees *something* maximal exists within the set defined by the bounds (the collection of candidates), but refuses to specify *which one* ("Proof only names the space where one must fit"). The form itself performs the non-constructive conclusion.
  6.  **Why No Single Top:** The poem never settles on one maximal element *because Zorn's Lemma doesn't provide one*. The constant rotation of the end-words and the final non-hierarchical listing embody this core strangeness – the existence is proven abstractly, but identification is deferred. The rivals remain rivals, even after existence is guaranteed.
