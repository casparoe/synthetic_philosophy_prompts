prompt: |-
  I just spent like an hour going back and forth with my friend on this and I'm not sure who's right. He's trying to figure out what his girlfriend actually wants about moving to a different city, and he's convinced he can't just take her word for it because people dont really know what they want, so instead he's been watching what she does — what she looks at, what she saves, how she reacts when it comes up — and he's sure her real preference will show through in her behavior. His rule is basically words are cheap, actions tell the truth. Something feels off about that to me but I can't pin it down. She does keep changing her story, but she also knows he's watching, and a lot of what she does might be her performing for him or just habit and have nothing to do with what she actually wants. Is his approach actually sound or am I the one missing something?
reasoning: |-
  Okay, the user has a friend who's trying to figure out his girlfriend's true feelings about moving to a different city. The friend believes that actions reveal true intentions better than words because "words are cheap." He's observing her behavior—what she looks at, saves, and her reactions—instead of taking her verbal responses at face value. The user feels something's off about this approach but can't pinpoint why.

  First, I need to unpack the friend's method. He's relying on observational data, which isn't inherently wrong. Nonverbal cues can sometimes reveal hidden feelings. But his dismissal of verbal communication entirely is problematic. People often express their needs and desires through words, and ignoring that could lead to misunderstandings. 

  The girlfriend keeps changing her story, which adds complexity. Why is she inconsistent? Maybe she's unsure, afraid of conflict, or trying to please her boyfriend. The friend's surveillance might be causing her to perform rather than be genuine. If she knows he's watching her actions, she might alter her behavior to fit what she thinks he wants. That creates a feedback loop where the observation itself distorts the data.

  Another angle is intention versus habit. Actions like saving articles about the new city could indicate interest, but they might also be habitual or curious rather than a real desire to move. For example, someone might research a city without any intention of moving there. Without context, these actions are ambiguous. 

  The friend's approach seems reductive. Reducing human behavior to "actions tell the truth" ignores the complexity of emotions and communication. People can have mixed feelings, especially about big decisions like moving. The girlfriend might be genuinely torn, not deceptive. Her changing words could reflect internal conflict rather than dishonesty.

  The user’s unease likely stems from the ethical aspect. Surveillance in a relationship can feel manipulative. Trust is undermined when one partner monitors the other instead of fostering open dialogue. The girlfriend might feel pressured or judged, leading to less honesty. The friend might be avoiding direct communication because he’s uncomfortable with potential conflict or uncertainty.

  Underlying needs here include the desire for authentic connection and trust. The friend might fear being misled, but his method could damage the relationship. The user might be picking up on this imbalance—prioritizing data over empathy. The core issue is the friend's insecurity and lack of trust, both in his girlfriend and in verbal communication. 

  The user needs validation that their suspicion is valid. They also need arguments to present to their friend. Emphasizing the importance of combining actions with words, considering context, and fostering open communication would address the friend's flawed approach. Highlighting the ethical concerns about surveillance and the potential for misinterpretation could help the user articulate why the method feels off.
answer: |-
  You're right to feel uneasy - your friend's approach has significant flaws. While observing actions *can* provide useful insights, his rigid "words are cheap, actions tell the truth" rule misunderstands human psychology and could actively damage his relationship. Here's why:

  1.  **The Observer Effect:** If his girlfriend *knows* he's scrutinizing her behavior (which seems likely), her actions become entirely unreliable. She might:
      *   **Perform:** Highlight actions she thinks he wants to see.
      *   **Suppress:** Hide genuine reactions to avoid conflict or pressure.
      *   **Overthink:** Make actions deliberately ambiguous to avoid giving him "data."
      *   **Feel Resentful:** Being watched undermines trust and creates pressure, distorting natural behavior.

  2.  **Actions Lack Context & Nuance:**
      *   **Habit vs. Desire:** Saving an article about a city could be curiosity, habit, or genuine interest. Without *her* explanation, it's guesswork.
      *   **Mixed Feelings:** Her "changing story" likely reflects genuine internal conflict or evolving thoughts, not deception. Big decisions involve complex emotions.
      *   **External Factors:** Her reaction to "movement talk" might reflect stress about logistics, finances, leaving friends, or *his* pressure, not necessarily disinterest in the move itself.
      *   **Interpretation Bias:** Your friend will interpret ambiguous actions through *his* lens of what he thinks is "truth," risking massive confirmation bias.

  3.  **Dismissing Verbal Communication is Dangerous:**
      *   **Words Express Complexity:** Actions rarely convey the "why" behind feelings. Only conversation can explore nuances, fears, excitement, conditions, and trade-offs.
      *   **People *Can* Know What They Want (or Know Parts):** While people can be conflicted, dismissing *all* verbal expression as invalid is cynical and impractical. It shuts down communication.
      *   **Building Understanding Requires Dialogue:** Figuring out complex decisions *together* requires talking, listening, asking clarifying questions, and validating feelings – not surveillance.

  4.  **It Creates an Unhealthy Power Dynamic:**
      *   **Distrust as Default:** His starting point is distrust ("I can't take her word for it"). This erodes the relationship foundation.
      *   **Surveillance vs. Partnership:** He's acting like an investigator, not a partner. This is controlling and disrespectful.
      *   **Avoidance of Vulnerability:** His method avoids the vulnerability of *truly* listening and engaging with her expressed thoughts and feelings.

  **What Your Friend is Missing & What He Should Do Instead:**

  1.  **Trust & Respect as Foundation:** He needs to start from a place of believing she is capable of knowing and communicating her feelings, even if they are complex or changing.
  2.  **Prioritize Open, Non-Judgmental Conversation:** Instead of watching, he needs to *talk* and *listen* deeply:
      *   "I know this is a big decision, and I appreciate how much thought you're giving it. Can you share what excites you most about the possibility of moving? What worries you the most?"
      *   "I've noticed your thoughts seem to shift sometimes. That makes total sense to me – it's a huge decision! What factors are weighing most heavily on you right now?"
      *   "What would make moving feel truly exciting or worthwhile for you? What would make it feel too hard?"
  3.  **Combine Words *and* Actions (with Context):** Observing *can* be useful if done subtly and combined with conversation.
      *   **Notice & Gently Inquire:** "I saw you saved that article about X neighborhood – it looked cool! What caught your eye about it?" (Curiosity, not interrogation).
      *   **Acknowledge Reactions & Explore:** "I noticed you seemed a bit stressed when we talked about school districts the other day. Was that about moving, or something else? How are you feeling about that aspect?"
  4.  **Accept Ambiguity & Conflict:** Big decisions involve pros, cons, excitement, and fear. He needs to be comfortable with her having mixed feelings and changing perspectives as she processes. His job isn't to "figure out her truth" like a puzzle, but to understand her process and collaborate.
  5.  **Focus on Collaboration:** Frame it as "How do *we* feel about this? What are *our* priorities? What challenges do *we* need to solve?" rather than "What does *she* secretly want?"

  **The Bottom Line:** Your friend's approach is reductive, distrustful, prone to misinterpretation, and likely counterproductive. **You are not missing something; he is.** He's substituting surveillance for the much harder, but essential, work of open, vulnerable, and respectful communication. His method won't reveal her "true" preference; it will likely create confusion, resentment, and damage trust. Encourage him to put the detective work aside and start talking *with* his girlfriend as an equal partner.
