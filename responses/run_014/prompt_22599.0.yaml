  Finks are cases where a disposition is present but is lost when the stimulus occurs. For example, Lewis's electrocuted wire: it's live but a device makes it dead when touched. The counterfactual "if touched, it would conduct" fails because the disposition disappears upon stimulus. Masks, like Martin's wire in a box, have the disposition but something prevents the manifestation even when stimulated. The wire is live, but the box insulates it. Here, the disposition remains, but the conditional fails due to the mask.

