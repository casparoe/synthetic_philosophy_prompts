  3. **C vs. D**:  
     - Tech gap:6-3=3<4, Inter gap:8-10=2<4 → min skill: C=6, D=min(3,10)=3 → **C > D**.  
  4. **A vs. D**:  
     - Tech gap:10-3=7≥4 → **A > D**.  
     - Inter gap:2-10=8≥4 → **D > A**.  
     - Default to tech: **A > D**.  
  5. **A vs. C**:  
     - Tech gap:10-6=4≥4 → **A > C**.  
     - Inter gap:2-8=6≥4 → **C > A**.  
     - Default to tech: **A > C**.  

  **Cycle**:  
  - **B > A** (1)  
  - **B > C** (2)  
  - **C > D** (3)  
  - **A > D** (4)  
  - **A > C** (5) → but **B > C** and **A > C**, no direct contradiction yet.  

  Add:  
  6. **B vs. D**:  
     - Tech gap:8-3=5≥4 → **B > D**.  
     - Inter gap:6-10=4≥4 → **D > B**.  
     - Default to tech: **B > D**.  

  Now, **B > D** and **A > D** are consistent. To create a cycle with A, B, C:  
  From 1: **B > A**  
  From 2: **B > C**  
  From 5: **A > C**  
  → **B > A > C**, and **B > C** → transitive!  

  **Final Cycle with 3 Candidates (simpler):**  
