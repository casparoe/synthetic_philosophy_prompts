  2. Medium vs. Slow: Agg=14 vs 14 → tie. Prefer accuracy for quality: **Slow > Medium**.  
  3. Fast vs. Slow: Speed gap=6≥4 → **Fast > Slow**.  
  Accuracy gap=6≥4 → **Slow > Fast**.  
