  The user seems philosophically adept - they've spotted what looks like a problem in Parfit's reasoning. But I think the solution lies in properly understanding how branching scenarios reveal a divergence between our psychological concerns and logical identity conditions, even on reductionism. I'll need to explain this carefully without jargon.
answer: |-
  You've hit on a crucial and subtle point in Parfit's argument. Your analysis is insightful, but Parfit *does* argue that R and identity come apart *even on the reductive view*, primarily through cases of **fission**. Here's why:

  1.  **The Core Distinction: Non-Branching vs. Branching R:**
      *   Parfit agrees that on the reductive view, personal identity *over time* (diachronic identity) *consists in* psychological continuity (R) *when there is no branching*. In standard, non-branching cases (like you going to sleep and waking up tomorrow), R *is* identity. There's no difference.
      *   **The Crucial Move:** Parfit argues that R *itself* does not inherently require non-branching. R-relations (psychological connections and continuity) can hold in a *branching* way. This is the fission scenario (e.g., the brain hemispheres being transplanted into two different bodies).

  2.  **The Fission Case & How R and Identity Diverge (Reductively):**
      *   **R Survives:** Both fission products (Lefty and Righty) bear R to the original person (Original). They are both psychologically continuous (and connected) with Original in the right way (via the brain transplants). What matters (R) holds between Original and Lefty, and between Original and Righty.
      *   **Identity Does *Not* Survive:**
          *   *Logical Impossibility:* Lefty and Righty are distinct persons existing after the fission. Original cannot be identical to *both* Lefty and Righty (transitivity of identity: If A=B and A=C, then B=C. But Lefty ≠ Righty). Therefore, Original cannot be identical to *either* Lefty or Righty (otherwise, Lefty would be identical to Righty via Original).
          *   *The Reductive Analysis:* The reductive view explains *why* identity fails: the relation constituting identity (non-branching R) doesn't hold. The R-relation *branched*. Identity requires not just R, but *non-branching* R. Lefty bears non-branching R to *future Lefty-stages*, and Righty bears non-branching R to *future Righty-stages*, but *neither* bears non-branching R to *Original*. Original's identity doesn't survive because her R-stream branched.

  3.  **The Argumentative Payoff:**
      *   **What Matters Survives Fission:** We care about our future survivors. In fission, both Lefty and Righty care about Original's life, memories, intentions, etc., just as Original would care about them. Parfit argues this shows that what *matters* in survival is present: R holds between Original and each successor.
      *   **Identity Fails:** Yet, personal identity does not survive. Original is not identical to Lefty or Righty.
      *   **The Conclusion:** Therefore, what matters (R) is distinct from identity. Identity requires the *additional condition* of non-branching that R does *not* require. **R is a necessary *component* of identity on the reductive view, but identity is R *plus the absence of branching*.**

  4.  **Why the Teletransporter Isn't Enough (And Fission Is Key):**
      *   In the simple teletransporter (one successor), R holds and identity arguably holds *if* we accept the copy *is* the original (which some might). Or, if we say identity doesn't hold because the original is destroyed, the reductive view might still say identity *is* R, and R holds with the copy, so identity *should* hold. This case *can* be ambiguous on the reductive view.
      *   **Fission is Unambiguous:** Fission *forces* a distinction. R *clearly* holds with both successors, but identity *clearly cannot* hold with either. This unambiguously shows that R can exist without identity *even on the reductive view* because the reductive view itself *defines* identity as requiring non-branching R.

  5.  **Parfit's Radical Claim:**
      *   Having established the distinction via fission, Parfit argues that what matters in the *non-branching* case (like normal survival or the teletransporter with one successor) is *still* just R. The fact that identity *also* holds in these cases is irrelevant. Identity is just R *plus* the absence of competitors. The absence of competitors adds nothing of value; it's merely a logical requirement for identity. What fundamentally matters is the presence of R itself.
      *   **Analogy:** Imagine "winning" a race requires running fast *and* being the only one entered. Being the only entrant adds nothing to the value of running fast; it just changes the label ("winner") applied. Similarly, non-branching adds nothing to the value of R; it just changes the label ("identity") applied.

  **In Summary:**

  *   **On the reductive view, identity *is* non-branching R.**
  *   **R *itself* does not require non-branching (it can branch, as in fission).**
  *   **Therefore, in fission, R holds but identity fails (because branching occurs).**
  *   **Since what matters (our concern for our future) is present in fission (R holds) *even though identity fails*, what matters must be R, not identity.**
  *   **Consequently, even in non-branching cases, where identity and R coincide, it's R that matters, not identity *per se*.**

  You are absolutely right that against the non-reductivist (who believes identity is a further fact *beyond* physical/psychological continuity), the argument is more straightforward: fission shows identity can fail while what matters holds. But Parfit's brilliance is showing that *even if* identity is reduced to continuity (R), fission reveals that identity requires the extra, non-valuable condition of non-branching. This forces the reductivist to conclude that what matters fundamentally is the underlying R-relation, not the identity relation which is just R plus an extra logical constraint (non-branching). Fission is the key that unlocks the distinction on *any* view.
