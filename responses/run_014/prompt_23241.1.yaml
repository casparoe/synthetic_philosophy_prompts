  I think the user might be overlooking how branching cases drive a wedge between R and identity even for reductionists. The teletransporter is simple because there's no branching, but fission makes the distinction unavoidable. Parfit's point is that since we care about R in fission cases where identity fails, we should recognize R as what matters in non-branching cases too.

