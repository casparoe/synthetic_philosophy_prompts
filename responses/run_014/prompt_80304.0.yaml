prompt: |-
  I'm a software engineer with no philosophy background, and because our credit-risk score gets re-tuned every month I keep ending up as the one who has to sign of on whether a new version is "fair" before it ships. I know the famous result that when two groups have different base rates you can't satisfy both calibration and equalized odds at the same time, but I don't have a way to actually use that when I'm staring at a model. Can you turn that impossibility result into a decision procedure I can run on a proposed model in about ten minutes: the checks in order, what a passing answer looks like at each one, the step where it turns out the two criteria are mutually unsatisfiable and I have to pick one, and the step where it stops being a fact question and I have to hand it to a human because the choice is a value judgment? Make sure it also handles the case where a protected group is too small for the numbers to mean anything. Give it to me as a numbered list of exactly five steps, each a sentence or two, no intro or conclusion, written so a teammate who's never herd of the theorem can follow it.
reasoning: |-
  We are going to design a 5-step procedure for assessing fairness of a credit-risk model when base rates differ across groups. The procedure must account for the impossibility of satisfying both calibration and equalized odds simultaneously. We'll structure it as a numbered list of steps, each with a clear check and decision point.

  Step 1: **Check Base Rates**
     - Calculate the base rate (average default rate) for each protected group (e.g., race, gender) and for the entire population. 
     - **Passing condition**: The base rates are not statistically significantly different (e.g., using a two-sample t-test or chi-squared test at 5% level) OR the protected group is large enough (sample size > 100 and at least 50 defaults in each group) to trust the difference. If the group is too small (e.g., sample size < 100 or defaults < 50), mark it as "small group" and skip further fairness checks for that group (proceed to Step 5 for small groups). If base rates are similar, then both fairness criteria might be achievable and proceed to Step 2. If base rates are different and the group isn't small, proceed to Step 2 but note that the impossibility theorem applies.

  Step 2: **Check Calibration**
     - For each protected group, check that the model is well-calibrated. This means that for any predicted risk score (or bin of scores), the actual default rate should be close to the predicted risk. Use a statistical test (e.g., Hosmer-Lemeshow) or visually check calibration plots. Also, check that the overall expected default rate (mean predicted risk) is close to the overall actual default rate for each group.
     - **Passing condition**: The model is calibrated for every protected group (p-value > 0.05 in Hosmer-Lemeshow or similar, or visually no major deviations). If the model is calibrated for all groups, proceed to Step 3. If not, the model fails calibration and must be recalibrated or adjusted (unless we are willing to accept miscalibration for fairness, which is rare).

  Step 3: **Check Equalized Odds**
     - For each protected group, compute the false positive rate (FPR) and true positive rate (TPR) at the chosen threshold (e.g., the cutoff for granting credit). Equalized odds requires that both FPR and TPR are equal across groups. Use a statistical test (e.g., chi-squared test for FPR and TPR differences) to check for significant differences.
     - **Passing condition**: Neither FPR nor TPR shows a statistically significant difference (at 5% level) between any protected group and the majority group. If the model passes, then both criteria are satisfied (which is only possible if base rates are equal or the model is perfect) and the model is fair by both definitions. If there is a significant difference, then we have a conflict (due to the impossibility theorem) and proceed to Step 4.

  Step 4: **Resolve Conflict Between Calibration and Equalized Odds**
     - Since the model is calibrated (from Step 2) but fails equalized odds (Step 3), and base rates are different (from Step 1), we must choose one criterion. This is a value judgment: 
          - Choose calibration if the business requires accurate risk estimates for each group (e.g., to set interest rates correctly). 
          - Choose equalized odds if avoiding disparate impact in loan approvals (i.e., similar error rates) is more important.
     - **Action**: If calibration is chosen, the model is acceptable but with a fairness caveat (disparate error rates). If equalized odds is chosen, adjust the model (e.g., by post-processing to equalize error rates) which will break calibration. Re-run Steps 2 and 3 after adjustment. If no adjustment is made, document the choice.

  Step 5: **Handle Small Protected Groups**
     - For any group marked as "small" in Step 1, we cannot reliably test calibration or equalized odds. Instead, use qualitative review: 
          - Check for obvious discrimination (e.g., all members of the group are denied) or use a disparity check (e.g., approval rate difference compared to overall, with a large margin of error). 
          - Also, review the model for features that might proxy for the protected attribute and could cause indirect discrimination.
     - **Action**: If no red flags, the model is acceptable for that group. If there are red flags, involve a human (e.g., legal or ethics team) for further review.

  Note: The above steps assume that the model is already developed and we are in the validation phase. Also, the choice of threshold (for Step 3) should be set by business requirements.

  Now, we write the 5 steps as a numbered list, each step a sentence or two, without intro or conclusion, for a teammate with no philosophy background:

  1. **Check base rates**: For each protected group, compute the actual default rate (base rate). If a group has too few samples (e.g., less than 100 individuals or less than 50 defaults) mark it as small and skip to step 5 for that group. Otherwise, note if base rates differ significantly (using a statistical test at 5% significance).

  2. **Check calibration**: For each non-small group, verify that the model's predicted default probabilities match the actual default rates (e.g., using a Hosmer-Lemeshow test with p>0.05). If the model fails calibration for any group, it must be fixed (e.g., recalibrated) unless there's a strong reason to accept miscalibration.

  3. **Check equalized odds**: For each non-small group, compute the false positive rate (FPR) and true positive rate (TPR) at the chosen threshold. Test for significant differences (at 5% level) in FPR or TPR between groups. If both pass, the model satisfies both fairness criteria. If not, and base rates differ (from step 1), proceed to step 4.

  4. **Resolve conflict**: Since both criteria cannot be met (due to differing base rates), choose either calibration (for accurate risk estimates) or equalized odds (for similar error rates). If choosing equalized odds, adjust the model (e.g., by post-processing) and re-check steps 2 and 3. Document the choice and the reason.

  5. **Review small groups**: For groups marked small in step 1, perform a qualitative review: check for extreme outcomes (e.g., all denied) or features that might proxy for the protected attribute. If any red flags, escalate to a human (e.g., legal team) for review. Otherwise, the model is acceptable for that group.
answer: |-
  Here's a five-step decision procedure:

  1. **Calculate base rates**: For each protected group (e.g., race/gender), compute the actual default rate (defaults ÷ total applicants). If any group has <100 people or <50 defaults, mark it as "small group" and skip it for steps 2-3.  
     *Passing*: Groups aren't small OR base rates differ by ≤5% points.

  2. **Test calibration**: For non-small groups, check if predicted risk scores match actual outcomes (e.g., in score deciles, average prediction vs actual default rate per bin).  
     *Passing*: All groups' prediction-vs-actual gaps are <3% points per bin.

  3. **Test equalized odds**: For non-small groups, compare FPR (non-defaulters flagged high-risk) and TPR (defaulters flagged high-risk) across groups at your approval threshold.  
     *Passing*: FPR differences <5% points AND TPR differences <5% points between any group and the majority.

  4. **Resolve conflict**: If steps 2-3 both fail for a group AND base rates differ (step 1), you must choose:  
     - **Pick calibration** if accurate risk pricing is critical (e.g., for variable-rate loans).  
     - **Pick equalized odds** if minimizing unequal approval errors is critical (e.g., for fairness compliance).  
     *(This is the value judgment step—document your choice.)*

  5. **Audit small groups**: For groups marked "small" in step 1, manually check:  
     - Approval rate within 15% points of the overall rate.  
     - No features strongly proxy the protected attribute (e.g., ZIP code for race).  
     *Passing*: Both hold. Else, escalate to legal/ethics teams.
