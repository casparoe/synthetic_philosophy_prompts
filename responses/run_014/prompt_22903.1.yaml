  But note: the logician was talking about formal agents and the AI researcher is talking about practical agents. They are both right in their own contexts. What they are missing is a clear distinction between formal systems (where Löb's theorem applies and is a barrier) and practical, empirically grounded agents (where confidence can be built without formal proof). 

  The logician is focused on the limitations of formal systems, which are real and important for designing safe AI that uses formal reasoning. The AI researcher is focused on the fact that real-world agents don't rely solely on formal systems.

  So overall, both have valid points but they are talking about different kinds of agents.

