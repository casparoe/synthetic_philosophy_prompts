  We are discussing iterated elimination of strictly dominated strategies (IESDS) when we allow domination by mixed strategies. The concern is that since a strictly dominated strategy is never a best response to any belief, then one might think that the strategies that survive IESDS are exactly those that are best responses to some belief. However, this is not entirely accurate. Let me clarify.

  First, note that a strategy is strictly dominated (by a mixed strategy) if and only if it is never a best response to any belief (over the opponents' strategies). This is a well-known equivalence (see Pearce, 1984).

  Now, the process of IESDS proceeds by removing strictly dominated strategies in rounds. In each round, we remove any strategy that is strictly dominated in the current game (i.e., the game with the strategies that have survived so far). We continue until no more strictly dominated strategies exist.

  Your working assumption is that the set of strategies surviving IESDS is exactly the set of strategies that are best responses to some belief in the original game. However, this is not correct because the elimination process might remove strategies that are best responses only to beliefs that assign positive probability to strategies that are later eliminated.

  In other words, a strategy might be a best response to a belief that includes an opponent's strategy that is strictly dominated (and hence will be eliminated in a later round). Therefore, after we eliminate that opponent's strategy, the belief that supported the given strategy is no longer available (because we cannot assign positive probability to the eliminated strategy). Hence, that strategy might become strictly dominated in the reduced game and be eliminated in a subsequent round.

  Therefore, the set of strategies that survive IESDS is a subset of the set of strategies that are best responses to some belief (in the original game) but not necessarily the entire set. In fact, the set that survives IESDS is exactly the set of strategies that are rationalizable.

  Rationalizability is defined as the set of strategies that survive IESDS (when allowing mixed strategies). Alternatively, a strategy is rationalizable if it is a best response to some belief that assigns positive probability only to strategies of the opponents that are themselves rationalizable. The iterative elimination process is one way to compute the rationalizable strategies.

