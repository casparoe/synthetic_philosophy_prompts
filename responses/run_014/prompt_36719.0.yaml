  We are introducing updateless decision theory (UDT) to a group of graduate students familiar with causal and evidential decision theory (CDT and EDT). The goal is to present UDT as a solution to a problem, not just an eccentric idea. We have 90 minutes and one whiteboard.

  ### Plan Outline

  1. **Recap and Motivating Problem (15 minutes)**
     - Briefly remind them of Newcomb's problem and how CDT and EDT fail (CDT one-boxes? loses to two-boxing? Actually, CDT two-boxes and gets less; EDT one-boxes and wins? But we've already established CDT loses in their seminar). Emphasize that the problem is about correlation between the predictor and the agent's decision.
     - Introduce a new problem (or a variant) that both CDT and EDT fail. We want a problem that clearly shows the need for a new approach. **Counterfactual Mugging** is a candidate, but we are worried it might be pre-loaded. Alternatively, we can use a symmetric problem to avoid pre-loading.

  2. **The Problem: Counterfactual Mugging (20 minutes)**
     - Present the standard Counterfactual Mugging:
       - Omega (a perfect predictor) flips a fair coin. If heads, Omega asks you for $100. If tails, you are given $10,000 if and only if you would have paid if the coin had been heads.
       - Intuition: You want to precommit to paying if heads because then you get $10,000 if tails. But when actually asked (heads), you don't want to pay because the coin is already heads and you won't get the $10,000 (because tails didn't happen). CDT and EDT both refuse to pay in the heads situation.
     - Why it's a problem: The agent would have liked to precommit to paying, but at the time of action, conditional on being in the heads branch, paying doesn't cause the $10,000 (because tails isn't happening) and there's no evidential reason (since the predictor is perfect, the fact that you are in heads means that the predictor knew you wouldn't pay? Actually, no: the predictor is about what you would do in the counterfactual. This is tricky). We need to stress that the problem is about the agent's behavior in the counterfactual branch affecting the outcome in the actual branch.

     However, because we are concerned about pre-loading, we might consider a symmetric variant or a different problem.

     Alternative: **The XOR Blackmail** (from Yudkowsky) or **Transparent Newcomb**. But let's stick to Counterfactual Mugging for now and handle the pre-loading by careful framing.

     How to avoid pre-loading? We can present it without the intuition about the other branch. Instead, we can set it up as a decision problem and then reveal the dilemma.

  3. **The Updateless Move (20 minutes)**
     - Explain that the agent should not condition on the current state (i.e., the coin flip outcome) but instead choose a policy (a function from observations to actions) that maximizes expected utility from the perspective of the beginning (before the coin flip).
     - In Counterfactual Mugging:
       - Policy 1: Always refuse. Then: heads -> $0, tails -> $0. Expected utility: 0.
       - Policy 2: Always pay. Then: heads -> -$100, tails -> $10,000. Expected utility: (0.5 * -100) + (0.5 * 10000) = 4950.
       - Policy 3: Pay only on heads? Then tails: $0 (because you didn't commit to paying in the counterfactual). Heads: -$100. Expected utility: -50.
       - Policy 4: Pay only on tails? But that's not possible because Omega doesn't ask on tails. So the only policies are: pay when asked (i.e., in heads) or not.

     So the best policy is to commit to paying when asked. Then, when the coin is heads, the updateless agent pays because that's what the policy says.

  4. **Addressing Misconceptions (10 minutes)**
     - **Misconception 1**: Updatelessness means never updating on evidence at all. 
       - Clarify: UDT updates on the state of the world to know which part of the policy to execute. But it does not update the decision about the policy. The policy is fixed at the start. So if the policy says "if heads, do X; if tails, do Y", then upon seeing heads, you do X. You updated that it's heads, but you didn't change the policy.
     - **Misconception 2**: Treating UDT as ordinary precommitment that you are unlucky not to have made.
       - Clarify: Even without a physical precommitment, UDT says you should act as if you had chosen the best policy. The problem with ordinary precommitment is that if you didn't precommit, then at the time of decision you are stuck. But UDT says that at the time of decision you can still choose to act as the best policy would have dictated. It's a decision theory for agents that can reason about their own actions in all possible states.

  5. **Introducing the Sealed Verdict Variant (15 minutes)**
     - We use the sealed verdict as a teaching tool to make the idea concrete.
     - Setup: A coin is flipped and sealed. The group must collectively decide on a policy (a function from the coin outcome to an action) without knowing the outcome. Then, the outcome is revealed and the policy is executed by the assigned member in each branch.
     - This forces the group to think from a prior perspective and binds them to the policy. It models the updateless choice.
     - Why it's better? It avoids the issue of individual members wanting to defect because they are bound by the group's policy. It also makes clear that the policy is chosen before knowing the state.
     - How to use: After explaining UDT with Counterfactual Mugging, we can use the sealed verdict as a reinforcement. We can run a thought experiment: "Imagine you are the group. You don't know the coin outcome. What policy do you choose?" Then, we reveal that in the actual world, one of you is in the heads branch and must pay. But because the policy was chosen to maximize expected utility, they pay.

  6. **Contrast with CDT and EDT (5 minutes)**
     - Recap: CDT and EDT update and then decide. They condition on the current state and then maximize utility given that state. But in Counterfactual Mugging, conditioning on heads leads to not paying, which is worse for the prior expectation.

  7. **Closing Question (5 minutes)**
