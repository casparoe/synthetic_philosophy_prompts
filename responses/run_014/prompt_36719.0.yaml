          - Logical uncertainty (e.g., decisions that depend on the output of a program that might not halt)
          - Proof-based agents (like those in the context of logical inductors or bounded rationality)
          - Disputes about which mathematical facts a decision can be correlated with (e.g., if the agent's action is correlated with the solution to a math problem)
     - Why: These are advanced topics that build upon UDT but are not necessary for understanding the core idea. We are focusing on the basic motivation and how it differs from CDT and EDT in classical decision problems.

  ### Final Sequence

  1. **Recap of Newcomb's and the need (5 minutes)**
  2. **Counterfactual Mugging presented as a problem for CDT/EDT (10 minutes)**
  3. **The Updateless Move: choosing policies (10 minutes)**
  4. **Solving the Mugging with UDT (10 minutes)**
  5. **Misconceptions and clarifications (10 minutes)**
  6. **The Sealed Verdict variant to make it concrete (10 minutes)**
  7. **Contrast with CDT/EDT (5 minutes)**
  8. **Closing Question: Modified Counterfactual Mugging with small effort cost (10 minutes) for discussion**
  9. **Wrap-up and scope statement (5 minutes)**

  Total: 75 minutes, leaves 15 minutes for discussion.

  This should work.
