  ### Teaching Plan: Updateless Decision Theory (UDT)  
  **Goal:** Present UDT as a necessary solution to a clear failure of causal/evidential decision theory (CDT/EDT), not an eccentricity.  
  **Time:** 90 minutes, one whiteboard.  
  **Prerequisites:** Familiarity with Newcomb’s problem, CDT/EDT, expected utility.  

  ---

  ### **Step-by-Step Sequence**  
  **Total: 85 minutes (leaving 5 mins buffer)**  

  #### **1. Recap CDT/EDT’s Failure in Newcomb’s Problem (10 mins)**  
  - **What to cover:**  
    - Remind students: CDT two-boxes (loses $1M), EDT one-boxes (wins $1M), but CDT’s failure stems from *ignoring correlation* between the agent’s decision and the predictor’s action.  
    - Emphasize: CDT/EDT both **update on observations** (e.g., "I see one box, so I condition my decision on this state"). This leads to CDT’s myopia.  
  - **Why now?**  
    - Establishes a shared problem: Decision theories can lose by updating too aggressively. Sets up UDT as a fix.  
  - **Whiteboard:**  
    - Draw Newcomb’s payoff matrix for CDT vs. EDT. Highlight CDT’s irrational outcome.  

  #### **2. Introduce a New Problem Where CDT *and* EDT Fail (15 mins)**  
  - **Problem choice: The **Transparent Newcomb** variant (avoids pre-loaded intuitions in Counterfactual Mugging):  
    > *Omega flips a fair coin. If heads, you are offered Box A (contains $1,000) and Box B (contains $0). If tails, you are offered Box A ($1,000) and Box B ($1,000,000). You choose whether to take Box B only or both boxes.  
    > Crucially: Omega predicts your *policy* (not your action) *before* the flip. If you use a policy that takes Box B only when it contains $1M, Omega makes Box B contain $0 in both branches.*  
  - **Analysis:**  
    - CDT: Conditions on the state. In heads: takes both boxes (gets $1,000). In tails: takes both boxes (gets $1,001,000). But Omega predicts this and sets Box B to $0 in both, so you get $1,000 total.  
    - EDT: Similar (conditions on state; takes both). Same outcome.  
    - Optimal policy: Always take Box B only. Then Omega sets Box B to $1M in tails, you get $1M.  
  - **Why this example?**  
    - Lacks the "counterfactual sacrifice" intuition of the mugging (avoids smuggling UDT’s answer).  
    - Shows CDT/EDT *actively self-defeat*: Their updating causes Omega to punish them.  
    - **Key property:** The problem requires selecting a *pre-observation strategy* that avoids self-sabotage.  
  - **Whiteboard:**  
    - Diagram the game tree and CDT/EDT choices. Show the $1,000 outcome vs. the $1M possibility.  

  #### **3. Motivate the Need for Policies (10 mins)**  
  - **Core insight:** Rationality shouldn’t depend on *when* you observe information.  
    - Ask: *"What if you committed to a strategy before seeing the coin flip? Would that beat CDT?"*  
    - Contrast:  
      - **CDT/EDT:** "Update, then decide."  
      - **UDT:** "Decide (on a policy), then update (to execute the policy)."  
  - **Define a policy:** A function mapping observations (e.g., heads/tails) to actions (e.g., take Box B / take both).  
  - **Why now?**  
    - After seeing CDT/EDT lose Transparent Newcomb, students *want* a way to "bind themselves" to avoid self-sabotage. UDT satisfies this.  

  #### **4. Present UDT (15 mins)**  
  - **The move:**  
    - A rational agent chooses the best *policy* (decision function) *before* observations. After observing, they act by *executing* the policy.  
    - Expected utility (EU) is calculated *ex ante* (before observations).  
  - **Solve Transparent Newcomb with UDT:**  
    - Policy 1: *"Always take Box B only."*  
      - EU = 0.5($0) + 0.5($1,000,000) = $500,000. Omega rewards this policy → you get $1M in tails.  
    - Policy 2: *"Always take both boxes."*  
      - EU = 0.5($1,000) + 0.5($1,000) = $1,000. Omega punishes this policy.  
    - Policy 1 wins. After seeing the state, you execute it (e.g., in heads, take Box B only and get $0).  
  - **Whiteboard:**  
    - List policies, their EU, and outcomes. Contrast with CDT/EDT’s $1,000.  

  #### **5. Deploy the "Sealed Verdict" Variant (15 mins)**  
  - **What it is:**  
    > *A coin is flipped, sealed in an envelope. The group must commit to a single policy (e.g., "Pay $100 if heads, else do nothing") before assignment. Members are then assigned to branches and must execute the verdict.*  
  - **Why use it?**  
    - **Teaching role:** Load-bearing (not just a check). Forces students to:  
      - Think *ex ante* (no branch-specific updates).  
      - Experience "binding" as a rational choice, not luck.  
    - **Advantage over standard examples:** Eliminates "what if I defect?" distractions. Makes UDT’s *collective rationality* visceral.  
  - **When to deploy:** After introducing UDT, to reinforce policy thinking.  
    - Activity: Have the group vote on policies for Transparent Newcomb or Mugging. Assign "roles" and ask: *"Will you defect from the policy in your branch?"*  

  #### **6. Counterfactual Mugging as a Secondary Example (10 mins)**  
  - **Present it *after* UDT is motivated:**  
    > *Omega flips a fair coin. Heads: Omega asks for $100. Tails: You get $10,000 iff you would’ve paid in heads.*  
  - **Analysis with UDT:**  
    - Policy: *"Always pay if asked."* EU = 0.5(-$100) + 0.5($10,000) = $4,950.  
    - Policy: *"Never pay."* EU = $0.  
    - Optimal to commit to paying. When asked (heads), you pay.  
  - **Why *not* lead with it?**  
    - Avoids smuggling intuitions: Students might think, "I *should* pay in heads to help the other branch," which assumes UDT-like thinking. By presenting it after UDT is established, it becomes an application, not a motivation.  

  #### **7. Address Misconceptions Proactively**  
  - **"UDT means never updating!"**  
    - **When to head off:** During policy definition (Step 4).  
    - **Clarify:** UDT *does* update to know which part of the policy to execute (e.g., "I see heads, so I run the 'heads' rule"). It doesn’t update the *policy itself*.  
  - **"UDT is just precommitment!"**  
    - **When to head off:** During Sealed Verdict (Step 5).  
    - **Clarify:** Precommitment is a *tool*. UDT is a *theory* of optimality: Even without physical precommitment, you should act *as if* you bound yourself to the best policy. Defection is irrational, not unlucky.  

  #### **8. Closing Question to Test Understanding (5 mins)**  
  - **The XOR Blackmail problem (modified for clarity):**  
    > *Omega flips fair coin. Heads: It sends you a letter saying "Heads" and asks for $1. Tails: It sends a letter only if you would pay $1 upon seeing "Tails." If you pay in tails, you get $10,000.  
    > You receive a letter saying "Tails." Do you pay?*  
  - **Why this?**  
    - **UDT answer:** Pay. The optimal policy ("pay on any letter") has EU = 0.5(-$1) + 0.5($9,999) = $4,999.  
    - **Intuitive (CDT/EDT) answer:** "Conditional on seeing 'Tails,' paying costs $1 with no gain (since tails already happened). Don’t pay."  
    - **Reveals if they "get it":** Students must recognize that UDT ignores *branch-specific* utility and maximizes *ex ante* EU. The letter’s content is irrelevant to the policy choice.  

  ---

  ### **What to Refuse to Cover**  
  **Explicitly state upfront:**  
  > *"Today, we focus on UDT’s core mechanic—policies, ex ante EU, and timing of updates—in non-mathematical problems. We won’t cover:  
  > - Logical uncertainty (e.g., ‘What if the coin toss depends on a math proof?’)  
  > - Proof-based agents (e.g., ‘What if I’m a Turing machine?’)  
  > - Disputes about correlation (e.g., ‘Can my decision correlate with the Riemann Hypothesis?’)  
  > These are advanced topics that extend UDT but aren’t needed to grasp its response to Newcomb-style problems."*  

  **Why draw this line?**  
  - Prevents tangents, maintains focus on UDT’s intuition.  
  - Frames omissions as *scoping* (essential for 90 mins) not evasion.  

  ---

  ### **Why This Works**  
  - **Order:** Starts with failure (Newcomb → Transparent Newcomb), introduces UDT as a solution, reinforces with Sealed Verdict, then applies to Mugging.  
  - **Examples:** Transparent Newcomb avoids mugging’s pre-loaded intuitions; Sealed Verdict makes UDT visceral; XOR Blackmail tests comprehension.  
  - **Pacing:** Balishes misconceptions in real-time while leveraging group interaction. By the end, students see UDT as a necessary tool, not a curiosity.
