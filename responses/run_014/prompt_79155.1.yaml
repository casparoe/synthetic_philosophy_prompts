prompt: |-
  I just got into a two hour fight with my friend Nadia about counterpart theory, and now I have to interview someone who actually holds it (it's for a Q&A episode of a tiny philosophy podcast I do), so I want the questions to settle our argument instead of letting her wriggle out of it. The guest thinks transworld identity is a mistake, but she isn't a modal realist — she thinks there's only the one world and that counterparts are ordinary actual people picked out by similarity, with the relation shifting depending on context. So she'll happily say that when I say I could have been a plumber, that's about some other guy who resembles me alot, and she thinks the standard 'but then you've just changed the subject' complaint begs the question.

  Nadia's line was: fine, then the counterpart relation is just whatever we happen to find salient, so modal claims stop being about the world and start being about us and our interests — and it makes a mess of regret too, since the guy who could have been a plumber isn't me and I've got no reason to care how he turns out. She also said the view can't even state itself without talking about other worlds, so the actualist version is either circular or a change of subject itself. I don't know which of us is confused.

  Give me eight or nine questions, and for each one a follow-up keyed to the answer she's most likely to give. I want at least one question on each of these:

  - whether the similarity relation can be constrained enough that counterpart facts are facts about the world rather than about our interests, and what would show it definately can't;
  - the uniqueness problem: if I have several counterparts, how do we get the necessity of identity and the necessity of distinctness, and if she bolts on a uniqueness requirement, what does she lose;
  - iterated modality: her relation isn't transitive, so 'possibly possibly p' doesn't collapse into 'possibly p' and S4/S5 fail — does she bite that bullet, and how does she explain why our intuitions are so strongly the other way;
  - a concrete case where similarity picks out the wrong person (twins, duplicates, or a case where the closest match is intuitively someone else entirely), plus what her answer does to how we're supposed to run thought experiments;
  - how she states the semantics without any modal vocabulary at all, and whether the resulting paraphrase is just a notational variant of ordinary possible-worlds semantics with the labels switched;
  - whether essence does any work in her picture, or whether she's stuck saying that whatever the counterpart relation hands over just is what's essential to me.

  And end on what would actually change her mind — something that would be evidence against the view, not just a cost she's willing to eat.
reasoning: |-
  We are preparing for an interview with a counterpart theorist who holds an actualist version (no other worlds, counterparts are actual individuals selected by similarity, with context-dependent relations). The goal is to challenge the view in light of the debate with Nadia. We need 8-9 questions, each with a follow-up, covering the specified topics.

  Topics to cover:
  1. Constraining similarity: are counterpart facts about the world or our interests? What would show they cannot be constrained?
  2. Uniqueness problem: how to handle the necessity of identity and distinctness if multiple counterparts? If she requires uniqueness, what is lost?
  3. Iterated modality: since the counterpart relation isn't transitive, S4/S5 fail. Does she bite the bullet? How to explain our modal intuitions?
  4. Concrete case: when similarity picks the wrong counterpart (twins, duplicates, etc.) and how this affects thought experiments.
  5. Stating the semantics without modal vocabulary: is it just a notational variant of possible-worlds semantics?
  6. Essence: does it do any work, or is essence just what the counterpart relation assigns?

  Additionally, we must end with what would change her mind (evidence against the view).

  Let's structure the questions accordingly.

  Question 1: Constraining the similarity relation
     - Main: You hold that counterparts are selected by similarity relations that shift with context. But critics like Nadia argue that this makes modal claims about our interests rather than about the world. How do you constrain the similarity relation so that counterpart facts are objective and mind-independent?
     - Likely answer: She might say that the similarity relation is not purely subjective; it is grounded in objective features of the world and our shared practices. The context is fixed by the conversational background and the properties we are considering.
     - Follow-up: But what if two contexts yield different counterpart assignments for the same individual and modal claim? Wouldn't that show that there's no fact of the matter independent of our interests? And what kind of evidence would definitively show that the similarity relation cannot be constrained enough to avoid being interest-relative?

  Question 2: Uniqueness problem
     - Main: The standard counterpart theory allows multiple counterparts for an individual in a given world, but this seems to violate the necessity of identity (if I have two counterparts in a world, they are both me, but they are distinct, so I am not identical to myself) and the necessity of distinctness (if two distinct individuals in the actual world have the same counterpart in another world, they would be identical in that world). How do you handle these principles without requiring uniqueness?
     - Likely answer: She might deny that the necessity of identity and distinctness hold in the strong form. She might say that identity is not necessary in the way Kripke thinks because we are dealing with counterparts, not transworld identity. Or she might say that the context selects a unique counterpart when needed.
     - Follow-up: If you allow that sometimes we require uniqueness (by context) to preserve these principles, what do you lose from the original counterpart theory? Doesn't that make the theory ad hoc, and how do you decide when uniqueness is required?

  Question 3: Iterated modality
     - Main: Your counterpart relation is not transitive, so 'possibly possibly p' does not imply 'possibly p'. This means that the modal system you endorse is weaker than S4 and S5. But our modal reasoning often assumes that if something is possibly possible, then it is possible. How do you explain the strength of our intuitions in favor of S4 and S5?
     - Likely answer: She might say that in many contexts the counterpart relation is such that iterated modalities collapse, but not always. Our intuitions are shaped by typical contexts where the relation is transitive, but we can imagine contexts where it isn't.
     - Follow-up: But if we can have a context where 'possibly possibly p' is true but 'possibly p' is false, doesn't that conflict with our deep-seated modal beliefs? For example, if we say that it's possible that I could have been a plumber, and then that it's possible that that plumber could have been a doctor, we expect that it's possible I could have been a doctor. How can your theory account for this without S4?

  Question 4: Concrete case of misidentification
     - Main: Consider a case of identical twins: I am one twin, and my brother is the other. In a context where we are considering a scenario in which one of us becomes a plumber, the similarity relation might pick my twin as the counterpart of me being a plumber. But intuitively, that's not me, it's my brother. Doesn't this show that similarity can pick the wrong person?
     - Likely answer: She might say that in the context of the modal claim, we are considering a scenario that distinguishes the twins by the property in question. We can adjust the context to focus on the properties that individuate the twins.
     - Follow-up: But what if the scenario is one in which the twins are indistinguishable? And doesn't this affect how we run thought experiments? If we are to imagine a scenario, we usually imagine ourselves in it. But if the counterpart is someone else, then we are not imagining ourselves but someone else. Doesn't that undermine the practice of thought experiments?

  Question 5: Semantics without modal vocabulary
     - Main: You reject modal realism and want to avoid other worlds. How do you state the semantics of modal claims without using any modal vocabulary? Can you provide a paraphrase that is entirely non-modal?
     - Likely answer: She might give a paraphrase in terms of actual individuals and similarity relations. For example, "I could have been a plumber" becomes "There is an actual individual who is sufficiently similar to me in the relevant respects and who is a plumber."
     - Follow-up: But doesn't this paraphrase still involve a modal element? The "relevant respects" are determined by context, and context might involve our modal interests. Moreover, isn't this just a notational variant of possible-worlds semantics where the "worlds" are replaced by actual individuals and the accessibility relation by similarity?

  Question 6: Essence
     - Main: In your counterpart theory, what is essential to an individual? Is it just whatever properties are preserved across the counterpart relation? Or do you have an independent notion of essence?
     - Likely answer: She might say that essence is determined by the counterpart relation: the properties that are preserved in all counterparts (or in the counterparts in all contexts) are essential.
     - Follow-up: But then doesn't that make essential properties context-dependent? For example, in one context, being human might be essential to me because we are holding that fixed, but in another context, we might consider non-human counterparts. Doesn't that conflict with the idea that essence is not up to us?

  We need 2-3 more questions to cover the list and end with the evidence question.

  Question 7: Regret and personal concern
     - Main: Nadia argued that if the person who could have been a plumber is just another actual person who is similar to me, then I have no reason to regret not being a plumber because that person's life is not mine. How do you account for regret and our concern for our possible selves?
     - Likely answer: She might say that we care about our counterparts because they represent what we might have been. The similarity relation makes them relevant to us.
     - Follow-up: But if the counterpart is just another actual person, then why should I care more about him than any other person? And if I regret not being a plumber, I regret that I didn't become one, not that someone else did. How does your view capture that?

  Question 8: Self-reference and the statement of the theory
     - Main: Nadia also said that your view can't state itself without talking about other worlds. For example, when you say that there are no other worlds, you are making a modal claim. How do you state your actualist counterpart theory without circularity?
     - Likely answer: She might say that she can state the theory using the same actualist paraphrases. For example, "There are no other worlds" is paraphrased as "There is no actual individual that is a non-actual world" (but that doesn't work because she doesn't believe in non-actual worlds). Alternatively, she might say that the theory is stated in a metalanguage that is non-modal.
     - Follow-up: But when you explain the semantics, you have to say that a modal claim is true if there is a counterpart in some context. But the context might involve modal parameters. Isn't this circular? And if you try to avoid that, does your paraphrase end up being a notational variant of possible-worlds talk?

  Question 9: What would change your mind?
     - Main: Finally, what kind of evidence or argument would make you abandon your view? I'm not looking for a cost that you are willing to accept, but something that would be definitive evidence against the theory.

  Now, let's list the questions in order:

  1. Constraining similarity (world vs. interests)
  2. Uniqueness problem (necessity of identity/distinctness)
  3. Iterated modality (failure of S4/S5 and intuitions)
  4. Concrete case (twins or duplicates and thought experiments)
  5. Semantics without modal vocabulary (circularity/notational variant)
  6. Essence (context-dependency)
  7. Regret and personal concern
  8. Self-reference and statement of the theory (circularity)
  9. What would change her mind?

  We have 9 questions. We'll write them out with main and follow-up.

  Note: The follow-ups are designed to push back on the expected answers.
answer: |-
  Here are eight sharp questions designed to probe the key tensions in your guest's actualist counterpart theory, each with a targeted follow-up based on likely responses. The questions are ordered to build pressure on the core issues from the Nadia debate, ending with the falsifiability test.

  ### 1. **Similarity as Objective vs. Interest-Relative**  
  **Question:** You claim counterpart relations are grounded in worldly similarity, not just our interests. But if context can shift the relation based on which properties are "salient" (e.g., occupation, origins, hair color), what *objective constraint* ensures that "I could have been a plumber" picks a fact about *me* rather than our conversational goals?  
  **Likely Answer:** *"Similarity isn't arbitrary—it's fixed by objective properties (like biological or causal-historical traits) that we latch onto in context."*  
  **Follow-Up:** But if the "objective" properties vary by context (e.g., in one talk, my counterpart is defined by genetics; in another, by career), doesn't that *confirm* Nadia's point that modal claims reduce to our interests? What experiment or observation could definitively show that similarity *can't* be constrained enough to avoid relativism?  

  ### 2. **Uniqueness and the Necessity of Identity**  
  **Question:** You allow multiple actual counterparts for one individual (e.g., two plumbers who resemble me). But if both are "me" in some scenario, this violates the necessity of identity (since they’re distinct people who are both identical to me). How do you resolve this without requiring a unique counterpart?  
  **Likely Answer:** *"Necessity of identity is a myth—it assumes transworld identity, which I reject. Context often selects one counterpart, but multiplicity is harmless."*  
  **Follow-Up:** If you "fix" this by requiring unique counterparts in contexts where identity matters (e.g., "I must be me"), haven’t you just smuggled in Kripkean rigidity? What key advantage of counterpart theory (e.g., handling vague identity) do you lose by making uniqueness context-dependent?  

  ### 3. **Iterated Modality and S4/S5 Collapse**  
  **Question:** Your counterpart relation isn’t transitive: "Possibly, I could have been a doctor" might be true because I have a counterpart who *could* have been one, even if *I* couldn’t directly. But intuitively, "possibly possibly P" implies "possibly P" (S4). Why do our modal intuitions strongly favor transitivity if your view rejects it?  
  **Likely Answer:** *"S4/S5 idealize modal reasoning. Real-world contexts are local—a 'possible doctor' counterpart might not be accessible from *my* actuality."*  
  **Follow-Up:** But when I say, "I might have had a career that might have been fulfilling," I expect this to entail "I might have had a fulfilling career." If your view blocks this, how is it not a *revision* of modal logic rather than an analysis of our actual practices?  

  ### 4. **Concrete Misidentification: Twins and Thought Experiments**  
  **Question:** Suppose I have an identical twin. If I say, "I could have been a plumber," and similarity picks *him* (an actual plumber), that seems wrong—it’s not *me* living that life. How does your view avoid misidentifying counterparts in cases like this?  
  **Likely Answer:** *"Context disambiguates: we focus on properties like personal history. Your twin isn’t your counterpart for *self*-referential claims."*  
  **Follow-Up:** But if context can exclude twins, what stops it from excluding *all* non-me candidates, collapsing into ad hocness? And if thought experiments (e.g., "What if I were a plumber?") rely on imagining a *different* person, doesn’t this make them useless for self-knowledge?  

  ### 5. **Semantics Without Modal Vocabulary**  
  **Question:** You paraphrase "I could have been a plumber" as "Some actual person (my counterpart) is a plumber and resembles me." But this uses non-modal terms. Isn’t this just *possible-worlds semantics* in disguise—replacing "worlds" with "actual individuals" and "accessibility" with "similarity"?  
  **Likely Answer:** *"No—I’m not quantifying over non-actual entities. This is a genuine reduction to the actual world."*  
  **Follow-Up:** But your paraphrase still depends on *modal* context (e.g., "resembles me *in the relevant respects*"). If "relevant respects" are defined by *our interests*, haven’t you just hidden the circularity? What’s the difference between your "similarity relation" and Lewis’s "counterpart relation" except labels?  

  ### 6. **Essence as Counterpart-Dependent**  
  **Question:** On your view, is my "essence" just whatever properties all my counterparts share? If so, doesn’t that make essence context-relative (e.g., in one context, being human is essential; in another, a robot counterpart might mean it’s not)?  
  **Likely Answer:** *"Essence is stable across contexts—core properties (like origin) are always relevant."*  
  **Follow-Up:** But if context *can* shift (e.g., a discussion about AI might make non-human counterparts salient), what prevents essence from being interest-relative? Doesn’t this conflict with Kripkean intuitions (e.g., that I’m *essentially* human)?  

  ### 7. **Regret and Personal Concern**  
  **Question:** Nadia argues that if the "plumber I could have been" is just another actual guy, I’ve no reason to regret *my* choices—his life isn’t mine. How does your view explain regret without genuine transworld identity?  
  **Likely Answer:** *"Regret targets *representations* of our possibilities. The counterpart embodies what I *could* have been, so I care."*  
  **Follow-Up:** But if I regret not being a plumber, I’m lamenting *my* actual life’s limitations—not celebrating someone else’s success. How is this *not* changing the subject from personal possibility to vicarious identification?  

  ### 8. **Falsifiability: What Would Change Your Mind?**  
  **Question:** You’ve defended this view robustly. But what *empirical or conceptual result* would make you abandon it? I’m not asking for a cost you accept (like S4 failure), but for evidence that the theory is *false*.  
  **Likely Answer:** *"If we found modal claims *must* refer to non-actual entities, or if similarity relations proved inherently subjective."*  
  **Follow-Up:** But your view already reinterprets "non-actual entities" as actual counterparts. If subjectivity isn’t a dealbreaker for you, could *anything* falsify this, or is it unshakeable?  

  ### Why This Lineup Works  
  - **Covers Nadia’s Objections:** Questions 1, 4, 5, and 7 tackle her "change of subject" and "interest-relativity" charges; 2 and 6 hit uniqueness and essence; 3 targets iterated modality.  
  - **Forces Clarity:** Follow-ups prevent dodging by demanding costs (Q2), empirical tests (Q1), or disanalogies with rival views (Q5).  
  - **Ends Strong:** Q8 makes her commit to falsifiability, exposing whether the theory is flexible or dogmatic.  

  **Pro Tip:** If she tries to "wriggle out," redirect with: "But in the Nadia debate, the worry was that [specific point]. How does your answer address *that*?" Good luck!
