prompt: |-
  I've been going down the moral testimony rabbit hole and I'm stuck on how to apply it. I'm on the commitee for a small grant to build a value-learning system. The proposal says it will use a panel of philosophers as moral experts and turn their verdicts into target labels for the reward model, with confidence weights. Half the committee says moral testimony is a legitimate source of evidence, half says moral judgments can't be delegated and this makes the system unaccountable. Draft the committee's decision memo -- fund, fund with conditions, or reject -- with a clear recommendation, criteria for when moral testimony can be used in value-learning research, and an honest treatment of the strongest objection.
reasoning: |-
  We are drafting a committee decision memo regarding a grant proposal to build a value-learning system that uses a panel of philosophers as moral experts. The committee is divided on the issue of moral testimony. The memo must include:
   1. A clear recommendation: fund, fund with conditions, or reject.
   2. Criteria for when moral testimony can be used in value-learning research.
   3. An honest treatment of the strongest objection.

   After careful consideration, I recommend funding the project with conditions. The conditions will address the concerns about moral testimony and accountability.

   Recommendation: Fund with Conditions

   Conditions:
   1. The project must incorporate a multi-faceted approach to value learning that does not solely rely on the moral testimony of the panel. The panel's input should be one component among others (such as public deliberation, empirical surveys, or iterative feedback mechanisms) to ensure a more democratic and accountable process.
   2. The project must include a clear plan for transparency and accountability in how the moral testimony is translated into target labels and confidence weights. This includes documenting the reasoning of the philosophers (where possible without breaching anonymity) and providing a mechanism for revisiting and revising the labels as new information or criticism arises.
   3. The project must conduct a pilot study that tests the robustness of the system against the strongest objections to moral testimony (e.g., by comparing the system's outputs with alternative methods and evaluating the system's ability to handle moral disagreement and uncertainty).

   Criteria for Using Moral Testimony in Value-Learning Research:
   Moral testimony can be a legitimate source of evidence in value-learning research under the following conditions:

   a) Expertise and Diversity: The panel of moral experts must be diverse in terms of philosophical traditions, cultural backgrounds, and demographic characteristics to avoid bias and to cover a broad range of moral perspectives.

   b) Epistemic Humility: The system must acknowledge the limitations of moral testimony, including the possibility of error and disagreement. Confidence weights should reflect the degree of consensus among the experts and the level of certainty in the relevant domain.

   c) Accountability and Revisability: There must be a clear process for challenging and updating the moral testimony-based labels. This includes regular audits and the possibility of incorporating new evidence or arguments.

   d) Complementary Methods: Moral testimony should not be the sole source of moral guidance. It should be combined with other approaches (e.g., empirical research on human values, participatory methods) to create a more robust and legitimate value-learning system.

   Honest Treatment of the Strongest Objection:
   The strongest objection to the use of moral testimony in this project is that moral judgments require first-person engagement and cannot be legitimately delegated to experts without losing the essential element of moral accountability. This objection, often associated with the "moral autonomy" argument, holds that an individual (or in this case, a system) must arrive at moral judgments through its own reasoning to be truly responsible for them. Relying on moral testimony might produce a system that acts according to the experts' judgments, but without understanding the reasons behind them, leading to a lack of accountability and potential moral alienation.

   We acknowledge this as a serious concern. If the AI system is simply trained on the verdicts of the philosophers without any capacity to engage with the underlying reasons, it might fail to internalize the moral principles and thus be unable to justify its actions in novel situations or to adapt when the experts' judgments are contested. This could lead to a system that blindly follows authority, which is particularly dangerous in morally complex and dynamic contexts.

   However, we believe that the objection can be mitigated by the conditions we impose. By requiring the project to incorporate the experts' reasoning (where feasible) and to build in mechanisms for ongoing critical engagement with the moral labels (such as the revisability condition and the complementary methods), the system can be designed to learn not just the verdicts but also the reasons. Moreover, the pilot study will specifically test the system's ability to handle moral reasoning and disagreement. Therefore, while the objection highlights a significant risk, we believe that with the proposed conditions, the project can proceed in a manner that addresses these concerns and advances the field of value learning.

   Conclusion:
   We recommend funding the project with the above conditions. The proposal has merit in exploring the use of moral expertise in AI value alignment, but it must be done in a way that respects the autonomy of moral reasoning and ensures accountability. The conditions are designed to turn the theoretical debate into an empirical and practical investigation, which is necessary for progress in this field.
answer: |-
  **Committee Decision Memo: Grant Proposal for Value-Learning System**  
  **Date:** October 26, 2023  
  **To:** Grant Oversight Board  
  **From:** Committee on Ethical AI Development  
  **Subject:** Funding Recommendation for Proposal #2023-VLS ("Moral Expert Panel Value-Learning System")  

  ---

  ### **Recommendation**  
  **Fund with Conditions** (Unanimous with reservations). The proposal is approved contingent on modifications addressing concerns about moral testimony delegation and accountability.  

  ---

  ### **Background**  
  The proposal seeks funding to develop a value-learning system using a panel of professional philosophers as moral experts. Their collective verdicts would generate target labels and confidence weights for a reward model, aiming to align AI with "reflective" human values. The committee is divided:  
  - **Proponents** argue moral testimony is a legitimate input for scaling value alignment, leveraging expert consensus to reduce bias.  
  - **Opponents** contend moral judgments cannot be delegated without eroding accountability, risking "value laundering" by outsourcing ethical reasoning.  

  ---

  ### **Decision Criteria**  
  The committee evaluated the proposal using three criteria:  
  1. **Epistemic Legitimacy**: Can moral testimony yield reliable evidence for value learning?  
  2. **System Accountability**: Does the design preserve traceability and critical engagement with moral decisions?  
  3. **Practical Robustness**: Can the system handle disagreement, uncertainty, and societal pluralism?  

  ---

  ### **Conditions for Funding**  
  The project is funded **only if** the following modifications are implemented:  

  #### **1. Criteria for Permissible Use of Moral Testimony**  
  Moral testimony may be used **if and only if**:  
  - **a) Deliberative Transparency**: Experts provide *reasoned justifications* (not just verdicts) for each judgment, recorded in an auditable ledger.  
  - **b) Dissent Integration**: Verdicts include measures of disagreement (e.g., confidence intervals for labels) and minority viewpoints.  
  - **c) Dynamic Updating**: Labels are periodically re-evaluated via open peer critique (e.g., public philosopher reviews).  
  - **d) Scope Limitation**: Testimony is restricted to *procedural norms* (e.g., "how to resolve conflicts of rights") and excluded from *substantive goods* (e.g., "defining human flourishing").  

  #### **2. Structural Revisions to the Proposal**  
  - **Multi-Source Validation**: Philosopher verdicts must be cross-validated with democratic inputs (e.g., citizen assemblies) for high-stakes norms.  
  - **Accountability Mechanism**: Implement "moral debt" tracing, allowing downstream users to query the rationale for any label.  
  - **Pilot Requirement**: Initial deployment limited to low-risk domains (e.g., resource allocation in games) with third-party ethics audits.  

  ---

  ### **Strongest Objection & Response**  
  **Objection (From Opponents):** *"Moral testimony transforms philosophers into unelected arbiters of values, alienating users from the system’s ethical reasoning. This creates a ‘black box of virtue’—AI that acts on delegated norms users cannot interrogate or own, violating core principles of moral agency."*  

  **Honest Treatment:**  
  This objection is philosophically robust and empirically plausible. Delegating moral judgments risks:  
  - **Erosion of Autonomy**: Users/AI inherit "pre-packaged" ethics without engaging in reflective equilibrium.  
  - **Expert Capture**: Philosophers may encode niche academic biases (e.g., overemphasizing utilitarianism).  
  - **Systemic Unaccountability**: Errors become harder to challenge if masked by "expert consensus."  

  **Why We Overruled (with Conditions):**  
  While valid, the objection conflates *delegation* with *abdication*. Moral testimony can be legitimate when:  
  - Used as *input* to—not replacement for—public reasoning (addressed via deliberative transparency).  
  - Experts serve as "advisors" in a broader ecosystem (addressed via multi-source validation).  
  The conditions force the system to treat testimony as provisional scaffolding, not final arbitration.  

  ---

  ### **Conclusion**  
  Moral testimony is admissible in value learning **only** under constrained, transparent, and revisable conditions. The proposed system’s current design is epistemologically optimistic but ethically naive. With our revisions, it becomes a testbed for *accountable delegation*—a necessary experiment given AI alignment’s urgency.  

  **Next Steps:**  
  - Grantee must resubmit a revised proposal within 60 days addressing all conditions.  
  - 20% of funds withheld until pilot-stage accountability mechanisms are approved.  

  ---  
  **Signed,**  
  Committee on Ethical AI Development (6-0 vote, with abstentions from philosophical opponents pending revised proposal)
