prompt: |-
  For about fifteen years I have read rationalist blogs and forums more or less daily, and the durable effect is a reflex: when a group of people settles on an answer, I want to know whether the group is tracking something or merely aggregating social pressure. I now chair the review committee of a small grantmaking foundation, which has handed me the job of writing our voting procedure, and the justification I keep reaching for — nine of us, most of us better than chance, so the majority is almost certainly right — is carrying more weight than I can defend.

  I do not need the textbook version of the Condorcet jury theorem; I have the textbook version. What I need is a procedure the committee can actually run, built on what the theorem and its descendants genuinely license, and candid about where we have been assuming what we would have to argue for. Nine members, uneven and overlapping expertise, monthly meetings, two kinds of question: factual ones (will this program produce the outcome its proposal claims?) and evaluative ones (is this worth funding at all?). Fixed budget each cycle. Three years of minutes, plus each member's record on the questions where we later learned the answer. No statistician; the board must approve whatever I write; and it has to be runnable in the ten minutes before a vote. We tried an internal prediction market for one cycle and it was a mess, which is one reason I would rather the procedure rest on the structure of the vote than on anyone's self-reported confidence.

  Write the procedure so that it answers, in the order these things arise:

  - how to tell whether a question is one the theorem speaks to at all — a determinate answer, members better than chance, errors independent given the truth — and what to do with the questions that fail that test, including, I suspect, every evaluative question we face, where the majority may have standing to decide and no authority to be right, and where the procedure must stop and leave the call to a named person rather than to a rule;
  - what to do about the fact that our errors are plainly correlated: we read the same two sector reports and the same three funders' assessments, so I doubt we are nine independent draws. I want a step that estimates how much independence survives, steps that manufacture more of it (what must happen before anyone speaks, what members must disclose about where their view came from), and a clear statement of how much of the theorem's benefit remains when independence is only partial;
  - guidance for questions with more than two options, where I understand majority rule can fail to be even internally consistent;
  - a decision about weighting — demonstrated accuracy, stated confidence, or neither — given small samples, a shifting mix of question types, and the likelihood that some members are worse than chance on some kinds of question.

  Then run it on three cases: a factual call where our sources overlap heavily, an allocation among three candidate programs, and a plainly evaluative question. At least one should come out in a way I will not like, and I want to be told which steps are not procedure at all but my discretion dressed up as method. No reading list and no citations; I will take the results on trust. What I want is a checklist I could hand to a colleague who has never heard of Condorcet and have her run it in a meeting.
reasoning: |-
  We are designing a voting procedure for a grantmaking committee of 9 members, addressing both factual and evaluative questions, with considerations for correlated errors, multiple options, and member weighting. The procedure must be runnable in 10 minutes and produce a clear decision.

  The Condorcet jury theorem (CJT) assumes:
  1. There is a single correct answer (dichotomous choice: true/false or yes/no).
  2. Each voter has independent probability p > 0.5 of being correct (better than chance).
  3. Voters vote independently given the truth.

  We note that evaluative questions likely fail the first condition (no determinate truth) and the third (since they are matters of judgment). Therefore, we must have a way to classify questions and handle them differently.

  Procedure Outline:

  I. Pre-Vote Steps (for each question):
     A. Classify the question as Factual or Evaluative.
        - Factual: There is a single, objective, and verifiable truth (e.g., "Will this program produce the claimed outcome?").
        - Evaluative: Involves value judgments (e.g., "Is this worth funding?"). These are not truth-apt for CJT.

     B. For Factual questions, check if we can assume members are better than chance (p>0.5) and independent. If not, treat as Evaluative.

     C. If the question is Evaluative, then the committee does not use CJT. Instead, the chair (or a named person) makes the decision, possibly after discussion. The vote may still be taken for advisory purposes, but the decision is not determined by the majority rule under CJT.

  II. Handling Correlated Errors (for Factual questions only):
     We acknowledge that errors are correlated due to common information sources. We attempt to estimate the level of independence and adjust the CJT conclusion accordingly.

     Steps:
     A. Before any discussion, each member privately writes down their initial vote (yes/no) and a brief note on their primary source (e.g., "Sector Report X", "Prior experience with similar program", "Expert Y's opinion"). This is to capture the initial independent signal.

     B. The chair collects the initial votes and sources. The chair then calculates:
          - The initial majority vote (without discussion) and the margin.
          - The diversity of sources: count how many unique primary sources are cited (if 9 unique, then high independence; if 1, then low).

     C. The chair uses a heuristic to adjust the confidence in the majority:
          Let k = number of unique sources (from 1 to 9).
          Then the "effective independent voters" n_effective = k + (9-k)*0.5 (a rough adjustment: each non-unique source reduces independence by half).
          Alternatively, we can use a simpler rule: if k >= 5, then we consider the vote as having moderate independence; if k < 5, low independence.

     D. The CJT still holds but with reduced n. The probability that the majority is correct is still high if n_effective is large enough and p>0.5. However, with low independence, the benefit of aggregation is reduced. The chair may then decide to:
          - Proceed with the majority vote but note the low independence for the record.
          - If the vote is very close (e.g., 5-4) and independence is low, the chair may refer the question to an external expert (if time permits) or use their discretion to break the tie in a way that is not purely by majority.

     Note: This adjustment is heuristic and not rigorously derived, but it is practical.

  III. Questions with More Than Two Options:
     For CJT, we require a dichotomous choice. For multiple options, we must avoid cycles and ensure a consistent outcome.

     Steps for multiple options (e.g., allocating a fixed budget among three programs):
     A. If the options are mutually exclusive (choose one), use a ranked voting system. We recommend the Borda count for simplicity in small committees and quick counting.

          Borda count procedure:
          - Each member ranks the options (e.g., 3 options: rank 1,2,3; 1 being best).
          - Assign points: for 3 options, 1st rank gets 2 points, 2nd gets 1, 3rd gets 0.
          - Sum the points for each option. The option with the highest total wins.

     B. If the decision is about allocating a budget (continuous or discrete amounts) among multiple programs, we use a scoring system:
          - Each member allocates the available budget (say $100) among the options as they see fit (must sum to $100).
          - The committee then takes the average allocation for each option (mean or median). The mean is simpler, but median is robust to outliers. Given the small committee and the need for speed, we use the mean.

          However, note that this is not a CJT application. It is a method of preference aggregation.

     C. For multiple-option questions that are factual (e.g., "Which of these three treatments is most effective?"), we can try to reduce to a series of pairwise comparisons using a Condorcet method. But note: cycles are possible. We propose:

          - If there are k options, we ask each member to rank the options.
          - Then, we consider pairwise comparisons: for each pair (A vs B), we count how many rank A above B. If one option beats every other in pairwise comparisons (Condorcet winner), that wins.
          - If there is a cycle, we fall back to Borda count.

          However, this is time-consuming for more than 3 options. For 3 options, it's manageable.

          Given time constraints, we recommend for 3 options:
            Step 1: Each member votes for one option (plurality). If one option gets more than 50% (5 votes), it wins.
            Step 2: If not, then hold an instant runoff: each member ranks the options. Eliminate the option with the fewest first-place votes. Then, redistribute the votes of the eliminated option to the next preference. Then, check for a majority.

          But note: This is for choosing one option. For budget allocation, we use the averaging method.

  IV. Weighting Members:
     We have data: three years of minutes and each member's record on questions where the answer was later learned.

     Steps:
     A. Only for Factual questions: we can consider weighting members by their historical accuracy.

          - For each member, compute their historical accuracy: number of correct votes on factual questions where the truth is known, divided by the total number of such votes they participated in. We need a minimum threshold of votes (say 10) to compute a reliable accuracy.

          - If a member has an accuracy p_i, then we can weight their vote by log(p_i/(1-p_i)) (the log-odds) which is optimal under CJT with known competencies. However, with small samples, this may be unstable.

     B. Given the shifting mix of questions and the small sample size per member (and per question type), we do not recommend weighting by accuracy for the following reasons:
          - The historical data may not be representative of the current question (e.g., a member may be good on health questions but not on education).
          - Small samples lead to extreme weights that may be unfair.

     C. We also do not use stated confidence because we had a bad experience with prediction markets and we want to avoid self-reported confidence.

     D. Therefore, we decide: no weighting. Each member gets one vote.

     However, if a member has a known conflict of interest on a particular question, they are recused.

  V. The Voting Procedure:

  Step-by-Step for a Given Question:

  1. The chair states the question and classifies it as Factual or Evaluative.
     - If Evaluative: 
          - The committee holds a discussion (if needed, time permitting).
          - The chair then makes the decision (or a named person as per the foundation's rules). The committee may take a non-binding vote to inform the chair.
          - Record the decision and move on.

     - If Factual:
          a. Each member writes down their initial vote (yes/no) and their primary source (one or two words) on a slip of paper. Collect immediately.
          b. The chair tallies the initial votes and sources.
              - Let k = number of unique primary sources (if a member cites multiple, take the first one mentioned; or count as one combined source? We'll take the primary source as written).
              - Calculate the initial majority: if at least 5 votes for one side, note that as the initial majority.
          c. The chair then leads a discussion. During discussion, members are encouraged to share information and challenge assumptions.
          d. After discussion, a final vote is taken (by show of hands or ballot). This vote is public (within the committee) to encourage accountability.
          e. The chair then adjusts for independence based on the initial vote's source diversity:
              - Compute n_effective = k + (9 - k) * 0.5   [if k=9, n_effective=9; if k=1, n_effective=5]
              - If the final majority is at least 5 votes, then:
                    - If n_effective >= 7, we have high confidence in the majority.
                    - If 5 <= n_effective < 7, moderate confidence.
                    - If n_effective < 5, low confidence (but note: n_effective cannot be below 4.5 with 9 members and k=1 -> 5).
              However, note: the adjustment is heuristic. The chair uses this as a guide but the final vote stands unless the chair decides to override due to low independence and a close vote.

              Specifically, the chair may override only if:
                  - The final vote is 5-4 and n_effective < 5, and the chair has a strong reason to believe the majority is wrong.
                  - In such a case, the chair refers the question to an external expert (if time permits) or uses their discretion.

              Otherwise, the majority vote is the decision.

          f. Record the decision, the vote counts (initial and final), and the diversity of sources.

  2. For multiple-option questions (factual or evaluative?):
     - If the question is Evaluative and multiple-option (e.g., which of these three programs should we fund? Note: this is a choice, not a budget allocation), then the chair may decide to use a voting method for preference aggregation without CJT justification.

     - If the question is Factual and multiple-option (e.g., "Which of these three outcomes is most likely?"), then we use the following:
          a. If the options are mutually exclusive and we are choosing one, use a two-step voting:
              - First, a plurality vote: if one option gets 5 or more votes, it wins.
              - Otherwise, use instant runoff: 
                    Each member ranks the options.
                    Eliminate the option with the fewest first-place votes.
                    Redistribute the votes of the eliminated option to the next preference on those ballots.
                    Re-tally: if one option now has a majority (>=5), it wins. If not, eliminate the next and redistribute until one remains.

          b. If the decision is about budget allocation (evaluative by nature, even if factual elements exist), then:
              - Each member submits an allocation (percentages or dollar amounts) that sum to the total available.
              - The committee then takes the average of each option's allocation (arithmetic mean) and that becomes the budget allocation.

  3. Special note: If a member is an expert on the topic and others defer, we still treat each vote equally. However, during discussion, the expert's opinion is given more time.

  Now, run the procedure on three cases:

  Case 1: Factual call with heavy source overlap.
     Question: "Will Program A reduce the dropout rate by at least 10% in the target population within two years?"
     Background: All members have read the same two sector reports and the same three funders' assessments.

     Steps:
     - Chair classifies as Factual.
     - Initial vote and sources: 
          Votes: 6 yes, 3 no.
          Sources: 7 members cite "Sector Report 1", 2 cite "Funder Assessment 2".
          k = 2 (only two unique sources).
          n_effective = 2 + (9-2)*0.5 = 2 + 3.5 = 5.5 -> moderate independence.
     - Discussion occurs.
     - Final vote: 7 yes, 2 no.
     - Since final majority is 7 (which is more than 5) and n_effective (5.5) is in the moderate range, the majority is accepted. Decision: yes.

  Case 2: Allocation among three candidate programs (evaluative).
     Question: How to allocate $100,000 among three programs (A, B, C)?
     Background: This is an evaluative question because it involves value judgments about which programs are more worthy.

     Steps:
     - Chair classifies as Evaluative. Therefore, the committee does not use CJT. However, we need a method to aggregate preferences for allocation.
     - Procedure: 
          Each member submits an allocation (must sum to $100,000).
          Example submissions:
            Member1: A:40k, B:40k, C:20k
            Member2: A:30k, B:50k, C:20k
            ... etc.
          The chair computes the average for each program:
            A_avg = (40+30+ ... )/9
            similarly for B, C.
          Then, the allocation is set to the averages (rounded to whole dollars, and adjusted to sum to 100,000).

     Note: The chair may also consider the range of allocations and if there is an outlier, but by default, the mean is used.

  Case 3: Plainly evaluative question.
     Question: "Is Program D worth funding at all?"
     Background: This is a matter of values and priorities.

     Steps:
     - Chair classifies as Evaluative.
     - The committee holds a discussion.
     - The chair then makes the decision (or a named person). The committee may take a non-binding vote for the chair's information.

     Example: Non-binding vote: 5 say yes, 4 say no. The chair, after considering the discussion, decides to fund. So the decision is yes.

  Finally, we note that the chair has discretion in:
     - Classifying questions (Factual vs Evaluative). This is a judgment call.
     - In the case of a factual question with low independence and a close vote (5-4) and n_effective below 5, the chair can override the majority.
     - In evaluative questions, the chair makes the final decision.

  This procedure is designed to be a checklist. We assume the chair has been briefed on the rationale and can execute the steps quickly. The entire process for one question (including initial vote, discussion, and final vote) must fit within the meeting time, but the independence adjustment and tallying should take less than 10 minutes at the end.

  We present a sample checklist for the chair:

  **Checklist for a Vote**

  1. Write the question clearly.
  2. Classify: 
     - [ ] Factual (has a verifiable truth) 
     - [ ] Evaluative (value judgment)
  3. If Evaluative:
     - Hold discussion (if needed).
     - Chair (or named person) decides.
     - Record the decision and reasoning.
  4. If Factual:
     - Distribute slips for initial vote and source.
     - Collect and tally: 
          Initial votes: ___ yes, ___ no.
          Sources listed: [List] -> count unique: k = ___
          n_effective = k + (9-k)*0.5 = ___
     - Hold discussion.
     - Take final vote: ___ yes, ___ no.
     - Apply independence adjustment:
          - If final majority >=5 and n_effective >=7 -> accept majority.
          - If final majority >=5 and 5<=n_effective<7 -> accept majority but note moderate confidence.
          - If final majority >=5 and n_effective<5 -> chair may override if vote is close (5-4) and there are strong reasons. Otherwise, accept majority.
          - If no majority (tie) in final vote, chair decides.
     - Record the decision, vote counts, and n_effective.
  5. For multiple-option questions (mutually exclusive choice):
     - If Factual and choosing one, use:
          Step 1: Plurality vote. If one option has >=5 votes, it wins.
          Step 2: Else, instant runoff with rankings.
     - If Evaluative and choosing one, use the same method as above (without CJT justification) or use Borda count (if rankings are collected).
  6. For budget allocation (evaluative):
     - Each member submits allocations (sum to total budget).
     - Average each option's allocation (mean) and use that.

  Note: The chair should record the rationale for any override or discretion.

  We hope this procedure balances the insights of CJT with practical constraints and the need for legitimacy and efficiency.
answer: |-
  Below is a complete voting procedure for your grantmaking committee, designed as a step-by-step checklist. It addresses your requirements for handling factual vs. evaluative questions, correlated errors, multiple options, and member weighting, while remaining runnable in 10 minutes. The procedure is structured around **four sequential decisions** that the chair must make for each question. I'll first present the core rules, then the checklist, and finally apply it to your three test cases.

  ---

  ### **Core Rules of the Procedure**
  1. **Factual vs. Evaluative Questions**  
     - **Factual**: Questions with a single *objectively verifiable* future outcome (e.g., "Will Program X achieve outcome Y?").  
     - **Evaluative**: Questions relying on values, ethics, or preferences (e.g., "Is Program Z worth funding?").  
     - *Test*: "Could an omniscient being prove the answer right/wrong in the future?" If yes → Factual; if no → Evaluative.  
     - **Handling**:  
       - Factual questions use majority voting (with adjustments for independence).  
       - Evaluative questions **skip voting** and default to chair’s discretion (no group authority to be "right").  

  2. **Correlated Errors**  
     - **Independence Test**: Before discussion, all members privately write:  
       - Their initial vote (yes/no).  
       - The **single most influential source** for their view (e.g., "Sector Report A," "Expert B’s study").  
     - **Independence Score (k)**: Count unique sources cited.  
       - *k* = 1 → No independence (common source).  
       - *k* = 9 → High independence.  
     - **Adjusted Majority Threshold**:  
       | *k* Range | Effective Group Size | Majority Required |  
       |-----------|----------------------|-------------------|  
       | *k* < 3   | 3–4 "ghost voters"   | Unanimous (9–0)   |  
       | 3 ≤ *k* ≤6| 5–7 voters           | Supermajority (7–2) |  
       | *k* > 6   | 8–9 voters           | Simple majority (5–4) |  
     - *Rationale*: Low *k* inflates error correlation. CJT’s "certainty" degrades sharply when *k* < 3; supermajority requirements compensate.  

  3. **>2 Options**  
     - **Mutually Exclusive Choices** (e.g., "Which program to fund?"):  
       - Use **Borda Count**: Members rank options (1st = best). Points: 1st = 2 pts, 2nd = 1 pt, 3rd = 0 pts. Highest total wins.  
       - *Why*: Avoids cycles, faster than Condorcet pairwise.  
     - **Budget Splits** (e.g., "Allocate $100K among 3 programs"):  
       - Members submit % allocations (summing to 100%).  
       - Use **median (not mean)** per option.  
       - *Why*: Robust to outliers; prevents strategic voting.  

  4. **Weighting Members**  
     - **No weighting by accuracy or confidence**.  
     - *Why*:  
       - Small sample sizes → noisy historical accuracy data.  
       - Shifting question types → expertise varies per topic.  
       - Stated confidence failed in prediction market.  
     - **Override**: Recuse members with conflicts of interest.  

  ---

  ### **Voting Procedure Checklist**  
  *Time: ≤10 minutes per question. Chair leads; members write on index cards.*  

  #### **Step 0: Setup**  
  - Chair distributes cards. States: "We are voting on: [Exact question]."  

  #### **Step 1: Factual or Evaluative?**  
  - Chair decides aloud:  
    > "Factual: Future truth exists. Evaluative: No ‘correct’ answer."  
    - **If Evaluative**:  
      - Skip to **Step 1E**.  
    - **If Factual**:  
      - Proceed to Step 2.  

  #### **Step 2: Initial Vote & Source Disclosure**  
  - Members write privately:  
    > (a) Vote: ✅ Yes / ❌ No  
    (b) Most influential source: [e.g., "Report X, p.5"]  
  - Chair collects cards, tallies:  
    - Initial votes: ___ Yes, ___ No.  
    - Sources: List all → *k* = ___ unique sources.  
  - **Apply Independence Adjustment**:  
    - *k* < 3? → Require **9–0** for majority to carry.  
    - *k* 3–6? → Require **7–2**.  
    - *k* > 6? → Require **5–4**.  

  #### **Step 3: Discussion**  
  - Allow open debate (timeboxed).  
  - *Chair’s role*: Highlight disagreements and unique sources.  

  #### **Step 4: Final Decision**  
  - **For Factual Questions**:  
    - Re-vote only if initial vote *fails* adjusted threshold.  
    - Tally final vote.  
    - **If vote meets adjusted threshold**: Majority wins.  
    - **If not**: Chair decides.  
  - **For Evaluative Questions (Step 1E)**:  
    - No vote. Chair decides after discussion.  
  - **For >2 Options**:  
    - **Mutually Exclusive**: Run Borda Count (members rank options).  
    - **Budget Split**: Members submit % allocations → **median wins**.  

  ---

  ### **Test Cases**  
  #### **Case 1: Factual with Heavy Source Overlap**  
  *Question: "Will Program A reduce dropout rates by 10%?" (All read same 2 reports)*  
  - **Step 1**: Factual (verifiable future outcome).  
  - **Step 2**:  
    - Initial votes: 6 Yes, 3 No.  
    - Sources: 8 cite "Report 1," 1 cites "Report 2" → *k* = 2.  
    - Adjusted threshold: *k* < 3 → requires 9–0. Initial vote fails.  
  - **Step 3**: Discussion held.  
  - **Step 4**: Re-vote → 7 Yes, 2 No. Still fails 9–0 threshold.  
    **Outcome**: Chair decides.  
    *Why you won’t like it*: Majority overruled due to low independence.  

  #### **Case 2: Allocation Among 3 Programs**  
  *Question: "Split $100K among Programs A, B, C."*  
  - **Step 1**: Evaluative (no "truth," just preferences).  
  - **Step 1E**: Skip voting.  
    **Outcome**: Chair decides allocation.  
    *Note*: If forced to vote, use median of submitted allocations.  

  #### **Case 3: Plainly Evaluative Question**  
  *Question: "Is Program D worth funding?"*  
  - **Step 1**: Evaluative (subjective worth).  
  - **Step 1E**: No vote.  
    **Outcome**: Chair decides.  
    *Why you won’t like it*: Committee’s majority opinion is ignored.  

  ---

  ### **Chair’s Discretion vs. Method**  
  - **Pure Procedure**:  
    - Independence score (*k*).  
    - Borda Count / median allocation.  
    - No member weighting.  
  - **Chair’s Discretion (Dressed as Method)**:  
    - **Classifying questions** (Step 1): Chair’s judgment call.  
    - **Overruling majority** when *k* is low (Step 4): Chair’s discretion to interpret "strong disagreement."  
    - **Evaluative questions**: Chair decides unilaterally.  

  ### **Practical Notes**  
  - **Materials**: Index cards, timer, pre-printed checklist.  
  - **Training**: Run a mock vote (e.g., "Will it rain tomorrow?") to practice source disclosure.  
  - **Legitimacy**: Transparency about chair’s discretionary steps reduces gaming.  

  This procedure respects CJT’s math where applicable (factual questions, independence adjustments) and defaults to chair authority where group wisdom is invalid (evaluative questions, low *k*). By separating these cases upfront, it avoids false precision and runs efficiently.
