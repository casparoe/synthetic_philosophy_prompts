prompt: |-
  For several years a small reading group I belong to has kept returning to Parfit's hitchhiker and to the wider family of cases in which it seems rational to become the sort of agent who would act irrationally in a one-off choice. The basic case is familiar: you are stranded, a driver offers a ride on condition that you pay later, you know you will never see the driver again and that no sanction can reach you, and you also know that only someone disposed to pay will get the ride in the first place. We have added two variants that have made the argument worse rather than better. In the first, the driver can see a cheap but imperfect signal of your disposition, so the question becomes whether the signal or the disposition is doing the rationalizing. In the second, the hitchhiker is not one person but a small group that must decide together whether to cultivate a reputation for paying, which raises the question whether the rationality at issue belongs to individuals, groups, or practices. The group divides into three camps and none has moved in months. The first says the case shows that decision theory must evaluate dispositions or policies rather than isolated acts, so paying is rational as part of the policy that secures the ride. The second says that is a confusion: the disposition may be causally advantageous, but the act of paying, once it is chosen, is still irrational, and the theory should say so plainly; what we have is a case where it is rational to be irrational. The third says both sides are answering the wrong question, because the promise is not a one-off act but a move in a social practice of promising, and the real question is what the practice requires of someone who has already accepted its benefits. Every reply is anticipated, and the exchange now feels less like an unfinished argument than like arguments that have stopped touching.

  I want a diagnosis rather than a verdict. Is this a substantive disagreement about the correct theory of rational choice, a verbal dispute about whether the word rational attaches to acts or to dispositions, or two or three different questions being asked under one heading—one about the causal efficacy of character, one about the logic of counterfactual commitment, one about the norms internal to promising? Is a hidden formal or empirical question doing the work, perhaps about whether the disposition is detectable or about how to model subjunctive dependence? And given your diagnosis, what would count as progress: a distinction, a formal result, a change of question, or an argument that no progress should be expected because the camps start from intuitions that cannot be argued for? I am especially interested in whether the impasse survives once we separate the question of what it is rational to do from the question of what it is rational to be, and whether the practice-based reading changes the kind of disagreement or merely relocates it. Please engage the camps as I have described them, and be concrete about what each side would have to give up for the debate to move.
reasoning: |-
  Okay, the user presents a fascinating philosophical puzzle involving Parfit's hitchhiker case and its variants. Their reading group is stuck in a three-way debate about rational choice theory, and they're seeking a diagnostic approach rather than resolution. 

  Hmm, what's striking is how deeply entrenched the positions are - the policy camp, the act-irrationality camp, and the practice-based camp. The user explicitly says every counterargument is anticipated, making this feel like trench warfare rather than lively debate. 

  Let me unpack their core questions: First, is this substantive or verbal? Second, are there hidden empirical/formal questions? Third, what constitutes progress? And crucially, does separating "rational to do" from "rational to be" help? The practice-based angle adds another layer.

  *scratches head* The brilliance here is how each variant complicates things: the signal-detection variant introduces epistemology, while the group version adds collective action problems. No wonder they're stuck - it's like philosophical Jenga where every move destabilizes another position.

  What's interesting is the user's meta-awareness: they sense the camps aren't actually engaging with each other's frameworks. The policy theorist talks in subjunctive conditionals ("if you had this disposition..."), the act theorist demands categorical judgments about present acts, and the practice theorist operates in deontological space. They're playing different language games.

  *lightbulb moment* Maybe the real diagnostic insight is that all three are partially right but answering different questions:
  - Policy view: rationality of self-cultivation
  - Act view: rationality at choice-points
  - Practice view: rationality within social grammar

  The hitchhiker case is a Rorschach test revealing prior commitments. The impasse persists because each side denies the legitimacy of the others' questions. For progress, they'd need to map which questions each framework can/can't address - like showing act theory handles isolated choices well but stumbles on pattern-dependent outcomes.

  *pondering* On the user's specific question about separating "rational to be" from "rational to do" - yes, that helps clarify but doesn't resolve, because the act theorist will still demand to judge the act. The practice view cleverly sidesteps by changing the subject to social ontology, but then the others might complain it's evasion.

  For movement... oof. Each camp would need to cede territory: Policy folks admit paying is locally irrational, act theorists acknowledge dispositions can be instrumentally rational, practice theorists stop claiming their view supersedes the others. Maybe formalizing the signal-detection variant could force concessions - if the signal is noisy enough, even the act theorist might admit cultivating the disposition becomes statistically rational.

  *realization* The deepest issue might be about rationality's temporality: Is it synchronic (judging moments) or diachronic (judging life-patterns)? And whether rationality must be "action-guiding" in the moment. That distinction might be the scalpel to dissect the impasse.
answer: |-
  Your impasse is profound but not hopeless. This isn't a single debate but three interlaced disagreements rooted in distinct conceptions of rationality, ontology, and methodology. Below is a layered diagnosis and a path for progress:

  ### Core Diagnosis: Three Irreducible Dimensions of Rationality
  1. **Temporal Scope** (Synchronic vs. Diachronic Rationality)  
     - **Act-Camp**: Defines rationality *synchronic*ally: "Is paying rational *at the moment of choice* given actual consequences?" (Answer: No).  
     - **Policy-Camp**: Defines rationality *diachronic*ally: "Which *temporally extended strategy* maximizes expected utility?" (Answer: Cultivating the disposition).  
     - **Clash**: These are different questions. The act-camp sees diachronic rationality as changing the subject; the policy-camp sees synchronic rationality as myopic.

  2. **Object of Evaluation** (Acts, Agents, or Practices)  
     - **Act-Camp**: Rationality applies to *actions in isolation*.  
     - **Policy-Camp**: Rationality applies to *dispositions or strategies*.  
     - **Practice-Camp**: Rationality applies to *rule-governed social roles* (e.g., "promisor").  
     - **Hidden Conflict**: Each camp implicitly denies the normative relevance of the others' objects. The practice-camp, for instance, rejects reducing promising to utility calculations.

  3. **Metaphysics of Dependence** (Causal vs. Counterfactual)  
     - Your variant with the "imperfect signal" exposes this:  
       - If the driver detects a *signal* (e.g., nervousness), paying might remain irrational (act-camp).  
       - If the driver detects the *disposition itself* (e.g., via neuroscan), paying becomes counterfactually necessary for the ride (policy-camp).  
     - **Empirical Stalemate**: No agreement on whether dispositions can be directly perceived or only inferred from signals.

  ### Why the Impasse Persists
  - **Intuitional Anchors**: Each camp is anchored to a core intuition others reject:  
    - Act-Camp: *"Rationality must guide action at the choice point."*  
    - Policy-Camp: *"Rationality shouldn't punish foresight."*  
    - Practice-Camp: *"Promises create duties beyond consequences."*  
    These are foundational; arguing *from* them is circular.
  - **Formal Incommensurability**: Standard decision theory (e.g., CDT) favors the act-camp; game theory (e.g., equilibria) favors the policy-camp; deontic logic favors the practice-camp. No formalism captures all three.

  ### Paths to Progress
  1. **Reframe the Disagreement as a Mapping Exercise**  
     - Admit all three dimensions exist but ask: *When does each apply?*  
       - **Synchronic evaluation** matters for isolated actions with no future stakes.  
       - **Diachronic evaluation** matters for repeated interactions or identity-shaping choices.  
       - **Practice-based evaluation** matters when institutional roles are in play.  
     - *Concession required*: Act-camp must acknowledge that "rational to do" depends on context; policy-camp must grant that paying *is* locally suboptimal.

  2. **Run the Variants as Crucial Experiments**  
     - **Imperfect Signal Variant**:  
       - If the signal is *noisy* (e.g., driver is 60% accurate), does paying become rational?  
         - Act-camp: No—paying still has negative utility.  
         - Policy-camp: Yes—if cultivating the disposition raises the probability of a ride.  
       - *Progress*: Formalize the threshold where false signals outweigh dispositional benefits.  
     - **Group Variant**:  
       - If individuals can free-ride, is *collective* disposition cultivation rational?  
         - Practice-camp: Yes—groups bind via shared norms.  
         - Policy-camp: Only if individuals credibly commit.  
         - Act-camp: No—individual defection dominates.  
       - *Progress*: Model as a coordination game. Does a "we-mode" (Tuomela) resolve it?

  3. **Separate Rationality "to Do" vs. "to Be" Explicitly**  
     - Grant both:  
       - It is *rational to be* the sort of agent who pays (policy-camp).  
       - It is *irrational to do* the act of paying (act-camp).  
     - Then ask: Does this duality collapse in limit cases?  
       - *Example*: If your disposition causes you to pay *automatically*, is the act still "irrational"?  
       - *Concession*: Policy-camp must admit the act *is* instrumentally flawed; act-camp must admit the flaw is outweighed by diachronic gains.

  4. **Interrogate the Practice-Camp's Social Ontology**  
     - Is promising a "practice" only when institutions enforce it? Or is it intrinsic to language?  
       - If enforcement exists, the act-camp might concede paying is rational (to avoid sanctions).  
       - If not, the practice-camp must explain why *moral* rationality overrides *instrumental*.  
     - *Progress*: Distinguish between practices with external sanctions vs. those with internal norms (e.g., Rawls' "practice rules").

  ### What Each Camp Must Give Up to Move
  - **Act-Camp**: Acknowledge that synchronic irrationality can be diachronically optimal—and that this isn't "confusion" but a feature of dynamic choice.  
  - **Policy-Camp**: Admit that "rational to be irrational" is a paradox requiring explanation (e.g., via two-tiered theories like McClennen's resolute choice).  
  - **Practice-Camp**: Clarify whether their view is descriptive (how promising *functions*) or normative (how it *should* function), and defend why it overrides utility.

  ### Final Prognosis
  The impasse survives separation because **rationality is not a univocal concept**. Progress lies not in proving one camp "right" but in mapping which framework applies to which scenarios. Your group's variants are strengths: lean into the signal-detection problem to test the metaphysics of dispositions, and the group variant to expose the practice-camp's reliance on collective intentionality. The debate isn't stuck—it's matured into meta-rationality. To move forward, **treat each camp as diagnosing a necessary but insufficient condition for a full theory of practical reason**.
