  Your friend's rulings reject simple utilitarianism (e.g., organ harvesting is impermissible) but show a nuanced approach to aggregation. Three principles fit her record well, and a fourth (prioritarianism) is a possible contender:

  1. **Strict Contractualism (No Aggregation)**:  
     - **Core idea**: Complaints are never summed. Only the strongest individual complaint on each side of a choice is compared. The option with the less severe worst complaint is chosen.  
     - **Fits rulings**:  
       - Ruling 1: Killing the healthy visitor creates a worse individual complaint (active killing/loss of life) than letting the five die (natural death).  
       - Ruling 2: Routing flights over the hamlet creates a worse worst complaint (severe health damage) than over the city (occasional disruption).  
       - Ruling 3: Not funding treatment creates worse worst complaints (death for hundreds) vs. funding it (minor tax burden).  
       - Ruling 4: Not treating agony creates a worse worst complaint (agony) vs. not treating moderate pain (moderate pain).  

  2. **Scanlon's Contractualism (Banded Aggregation + Disaster Avoidance)**:  
     - **Core idea**: Complaints can be aggregated *only if* they fall within a "common band" of seriousness (e.g., similar magnitudes of harm). A disaster-avoidance clause permits aggregation to prevent catastrophic losses.  
     - **Fits rulings**:  
       - Ruling 1: Impermissible due to the constraint against killing; aggregation doesn't apply.  
       - Ruling 2: Hamlets' severe harms and city's mild harms are in different bands; no aggregation, so avoid the worst complaint (hamlet).  
       - Ruling 3: Minor tax burdens and death are in different bands; no aggregation, so avoid worst complaint (death). Disaster clause isn't needed.  
       - Ruling 4: Agony and moderate pain are in different bands; no aggregation, so avoid worst complaint (agony).  

  3. **Constrained Utilitarianism (Aggregation with Side Constraints)**:  
     - **Core idea**: Sum total well-being, but with constraints: no active killing/using others as means (explaining Ruling 1). Otherwise, aggregate all burdens/benefits.  
     - **Fits rulings**:  
       - Ruling 1: Constraint against killing overrides utility gain.  
       - Ruling 2: Aggregated burden of severe harm to 20 > mild harm to 100,000, so choose city.  
       - Ruling 3: Small tax burden * millions < large benefit of saving hundreds, so required.  
       - Ruling 4: Assumes agony burden > 2× moderate pain burden, so treating agony reduces more total suffering.  

  4. **Prioritarianism (Weighted Priority to the Worst-Off)**:  
     - **Core idea**: Aggregate burdens/benefits, but give extra moral weight to those who are worse off.  
     - **Fits rulings**:  
       - Ruling 1: Killing the healthy visitor worsens his already-good state; priority to the worst-off (dying patients) doesn't override constraint.  
       - Ruling 2: Hamlets' residents are worse off (severe deprivation), so avoid harming them further.  
       - Ruling 3: Death puts the hundreds in the worst state; priority justifies taxing the better-off millions.  
       - Ruling 4: Agony patient is worst off; priority justifies favoring them over two moderately pained patients.  
     - **Why added?** It captures her focus on the worst-off in Rulings 2 and 4 but allows aggregation in Ruling 3.  

  **Key takeaway**: All four principles fit her record. Ruling 4 is crucial—it suggests she *doesn't* aggregate across different severity levels (e.g., agony vs. moderate pain), which fits contractualism and prioritarianism better than utilitarianism.

