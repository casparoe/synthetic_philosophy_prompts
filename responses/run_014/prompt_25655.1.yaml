prompt: |-
  I've been trying to figure out what I actually think about whether compatriots have special claims on each other, and my gut reactions to cases keep pulling me in different directions. Here's where I land:

  - A child is drowning in a pond right in front of me; another child is drowning in a pond overseas, and I can press a button to save one but not both. I save the one in front of me. But I don't think nationality explains that — it's proximity. If both were equally far and I could only fund one rescue operation, I'd flip a coin. Nationality doesn't seem to matter there at all.

  - But then: my government is deciding between funding a dialysis center here (saves 100 lives/year) or malaria prevention abroad (saves 1,000 lives/year for the same cost). I lean toward the domestic program. I'm not proud of it, but that's my gut.

  - An undocumented immigrant who's lived here since childhood, works, pays taxes, and has no connection to their birth country is facing deportation. A citizen who's lived abroad for decades, never contributed, wants to return for retirement healthcare. If we can only take one, I'd take the undocumented immigrant instantly. Legal citizenship status alone feels almost irrelevant to who deserves what.

  - My country goes to war. Do I have a special duty to support my country's side? I don't think so. If our side is wrong, I should say so. Patriotism as loyalty-to-a-side-regardless feels like a kind of moral corruption.

  - Yet: my country has a history of colonialism and slavery. I think I have some special responsibility to help address the ongoing effects — more than someone from a country with no such history. That responsibility seems to come partly from being a citizen of the state that did it and partly from having benefited.

  - A friend asks me to help them move. A stranger from abroad asks for the same help at the same time. I help the friend. But if the stranger will become homeless without my help and my friend just wants to save on movers, I help the stranger. So special obligations to friends are real but defeasible by serious need. Are special obligations to compatriots like that? They don't feel the same way, but I can't articulate why.

  Is there a principle that captures most of this, and which of these verdicts should I be most suspicious of? And feel free to tell me if the whole way I'm framing this is confused — maybe I'm smuggling in assumptions that don't hold up under scrutiny.
reasoning: |-
  Okay, the user is really wrestling with the ethics of special obligations to compatriots. They've laid out several scenarios where their gut reactions conflict, and they're looking for a coherent principle that can tie these together. 

  First, I notice how thoughtfully they've structured this - each example tests a different facet of compatriot partiality: proximity vs nationality (drowning child), cost-effectiveness vs domestic bias (dialysis vs malaria), legal status vs moral desert (immigrant vs expat citizen), critical patriotism (war stance), historical responsibility (colonialism), and special obligations comparison (friend vs stranger). 

  What's interesting is how their intuitions consistently reject formal nationalism but retain certain civic responsibilities. The deportation case is particularly telling - they value lived contribution over legal status. And their war stance shows remarkable moral independence. But they're troubled by their own bias favoring domestic dialysis despite fewer lives saved.

  The colonialism point reveals something deeper: they seem to feel obligations stem from both historical causation (our state did harm) and unjust enrichment (we benefit). This connects to the immigration case where the undocumented person has actually contributed. There's a pattern here - their moral compass points toward responsibility based on participation and benefit, not just passports.

  Their struggle with the friend/stranger analogy is key. They recognize defeasible special obligations exist in personal relationships, but can't extend that feeling to compatriots. That suggests nationality alone doesn't create moral bonds for them - which aligns with their other conclusions. 

  The malaria/dialysis conflict might be the weakest link in their reasoning. If they reject citizenship-based obligations elsewhere, why privilege domestic lives here? Unless they're subconsciously weighing institutional competence or tax fairness - but they haven't articulated that. This inconsistency needs examination.

  Their framing isn't confused at all - it's precisely the right approach: pressure-testing intuitions against varied cases. Where they might be overlooking things is the institutional dimension - governments as agents of citizens, the social contract aspect. But their instincts about contribution-based desert over legal status are ethically sophisticated.

  The unifying thread seems to be: moral weight comes from concrete relationships (proximity), participation (taxes/work), or unjust enrichment (benefiting from historical wrongs) - not abstract nationality. Their suspicious verdicts are the dialysis bias and possibly the deportation case (does contribution really override legal status completely?). 

  I should affirm their methodological clarity while helping them see the institutional angle they're missing. The colonialism point actually holds the key - it's about collective responsibility through the state, which could extend to current citizens' obligations to each other via shared institutions. But their intuition that this differs from friendship is correct - civic ties are mediated by systems, not direct care.
answer: |-
  Your intuitions reveal a sophisticated and ethically consistent approach—you're grappling with genuine moral tensions rather than confusion. Here's a principle that captures most of your judgments, the tensions within them, and which intuitions deserve scrutiny:

  ### Unifying Principle: **Grounding Obligations in Relationship, Not Mere Membership**
  You assign moral weight to **concrete connections** (proximity, participation, benefit, causation) rather than abstract identity labels (citizenship, nationality). Obligations arise from:
  - **Agency/Proximity**: *Can I act directly?* (saving the nearby child).
  - **Participation/Contribution**: *Has this person invested in the community?* (undocumented immigrant vs. absentee citizen).
  - **Causality/Unjust Enrichment**: *Did my state cause harm? Did I benefit unjustly?* (colonial legacies).
  - **Relational Bonds**: *Do we share mutual commitments?* (helping a friend).

  Nationality alone carries little weight. But when nationality *signifies* these concrete connections (e.g., paying taxes to a shared system), it gains derivative importance.

  ---

  ### Breaking Down Your Cases
  1. **Drowning Children**:  
     - ✅ **Your verdict is solid.** Proximity enables action; flipping a coin when equidistant rejects nationality.  
     - *Principle*: Moral urgency tied to capacity to act, not identity.

  2. **Dialysis vs. Malaria Prevention**:  
     - ⚠️ **This intuition deserves scrutiny.** Why prefer saving 100 compatriots over 1,000 foreigners?  
       - *Possible hidden factors*: Trust in local institutions? Belief taxes must benefit taxpayers? Fear of "leaky" aid?  
       - *Problem*: If none apply, this biases lives based on location—contradicting your coin-flip stance.  
     - *Scrutiny needed*: Ask *why* you lean domestic. Is it defensible, or tribal instinct?

  3. **Immigrant vs. Absentee Citizen**:  
     - ✅ **Highly consistent.** Contribution, participation, and desert outweigh formal status.  
     - *Principle*: Obligations earned through engagement, not paperwork.

  4. **Patriotism in War**:  
     - ✅ **Ethically robust.** Loyalty to justice, not tribe. Aligns with rejecting blind group allegiance.  
     - *Principle*: Moral duty transcends national borders.

  5. **Historical Injustice**:  
     - ✅ **Nuanced and defensible.** Responsibility stems from *causal role* (state actions) and *unjust benefit* (inherited advantage).  
     - *Principle*: Obligations born from harm/enrichment, not identity alone.

  6. **Friend vs. Stranger**:  
     - ✅ **Reveals core insight.** Special obligations exist but are *defeasible* by greater need.  
     - *Tension*: You don’t feel compatriot ties this way—likely because *nationality lacks inherent emotional reciprocity*. Friendships are personal; citizenship is systemic.  
     - *Key*: You might owe compatriots *institutional support* (e.g., voting for fair policies) but not *personal care* like a friend.

  ---

  ### Suspicious Verdicts & Tensions
  1. **Most Suspicious**: **Domestic Dialysis Bias**  
     - This clashes with your other rejections of nationality-based partiality. If 1,000 > 100, and no concrete ties justify privileging compatriots (unlike the immigrant/contributor case), this leans toward parochialism.  
     - *Challenge yourself*: Would you support a policy letting *other* nations prioritize their 100 over your 1,000? If not, consistency demands revising this instinct.

  2. **Tension**: **Grounding Historical Responsibility**  
     - You tie it to state causation and benefit—but what if you’re a new citizen, or poor? Does *every* citizen share equal responsibility? This needs refinement (e.g., responsibility falls heaviest on the state itself and beneficiaries).

  3. **The Friendship Analogy Gap**  
     - Compatrio obligations *feel* different because they’re mediated by institutions. You may owe:  
       - **Negative duties**: Not supporting harmful state policies.  
       - **Procedural duties**: Promoting just institutions.  
       - **Distributive duties**: Upholding fairness *within* systems you participate in.  
     - But unlike friends, you don’t owe compatriots *personal sacrifice* without greater context (e.g., disaster response).

  ---

  ### A Coherent Framework
  Your stance aligns with **cosmopolitan institutionalism**:  
  - **Individual Level**: Treat all humans as moral equals (reject nationality bias).  
  - **Institutional Level**: Prioritize reforming *your* state (you participate in it) to act justly *globally* (e.g., fund malaria prevention) and *domestically* (e.g., protect contributing immigrants).  
  - **Rectificatory Level**: Address harms *your* institutions caused.  

  This explains:  
  - Why you save the nearby child (individual capacity),  
  - Why you’d fund malaria prevention (institutional duty to do maximal good),  
  - Why the immigrant stays (institutional fairness),  
  - And why historical injustice binds you (your inherited institution’s crimes).

  ---

  ### Refine Your Suspicion
  - Revisit the dialysis case: Is your gut feeling defensible, or tribal? If the latter, override it.  
  - Clarify historical duty: Does it bind *you* personally, or *your state* (which you must push to act)?  
  - Accept that compatriot obligations are *systemic* (e.g., voting for welfare) not *personal* (like friendship).  

  Your framing isn’t confused—it’s a honest map of real moral complexity. The tension between your inclusive principles and residual local bias is where growth happens. Lean into the cases where you *already* reject tribalism (war, immigration, aid proximity); they’re your moral compass.
