answer: |-
  This is a profoundly complex situation touching on legal obligations, humanitarian ethics, and practical realities. Neither your friend nor the other volunteers are entirely "right" in an absolute sense – the answer involves layers of principle, law, and compassion. Here's a breakdown:

  1.  **Legal Obligation & the "First Country" Principle:**
      *   **No Automatic Transfer of Obligation:** International refugee law (primarily the 1951 Refugee Convention and its 1967 Protocol) does **not** state that the first safe country a refugee reaches is solely responsible. There is **no binding "first country of asylum" rule** in international law requiring refugees to claim asylum only in the first safe country they enter.
      *   **Sovereignty of Asylum Procedures:** Each sovereign state has the right to establish its own asylum procedures and make its own determination on individual claims. One country's rejection **does not legally bind another country**. The second country is entirely within its rights (and sometimes its obligations) to conduct its own assessment.
      *   **Non-Refoulement is Paramount:** The core legal obligation under international law is **non-refoulement**. This means a country cannot return a refugee to a territory where their life or freedom would be threatened (based on race, religion, nationality, membership of a particular social group, or political opinion). This applies regardless of whether another country rejected them, as long as the individual still faces a well-founded fear of persecution in their home country/war zone. If sending her back (or not offering protection) means she faces return to the war zone or persecution, the obligation of non-refoulement *might* still apply.

  2.  **Moral & Humanitarian Obligation:**
      *   **The Reality of the Individual:** This is a woman fleeing war. The fact that one state's bureaucracy concluded she didn't meet its *specific criteria* doesn't erase her vulnerability or the dangers she fled. She is still a person in need.
      *   **Imperfect Systems:** Asylum systems are complex and imperfect. Rejections can happen for many reasons: lack of documentation, misunderstanding of the situation, changes in circumstances, legal technicalities, overwhelmed systems, or even mistakes. A rejection in one country doesn't definitively prove she has no valid claim *or* that she is safe to return.
      *   **The Role of Humanitarian Groups:** Volunteer groups exist precisely to fill gaps, offer compassion, and provide support where state systems fail or are insufficient. Saying "it's not our job to pick up the pieces" contradicts the fundamental purpose of humanitarian action, which is to assist those in need regardless of prior bureaucratic outcomes.
      *   **Compassion vs. Process:** Your friend's instinct reflects a core humanitarian principle: help those in immediate need. The other volunteers are focusing on process and precedent, which are important for sustainability but can become dehumanizing if they override basic compassion in a specific case.

  3.  **Practical Concerns of the Volunteers (Understanding Their Perspective):**
      *   **Capacity & Resources:** Volunteer groups have limited resources. Taking in someone rejected elsewhere *could* set a precedent attracting others in similar situations, potentially overwhelming the group.
      *   **"Gaming the System" Fear:** There's a concern that individuals might "shop around" for asylum after rejections. While valid as a general consideration, applying it rigidly to an individual fleeing war risks ignoring her specific vulnerability.
      *   **Relationship with Authorities:** The group might worry about undermining the official asylum process or creating friction with authorities if they are seen to circumvent decisions.
      *   **Long-Term Solutions:** They may feel that helping someone already rejected elsewhere doesn't address the root problem and might be unsustainable for the individual's future.

  **Who is "Right"?**

  *   **Your Friend is More Aligned with Core Humanitarian Principles:** Ethically, refusing help to a vulnerable person fleeing war solely because another country's process rejected her is problematic. Humanitarian action prioritizes human need over bureaucratic outcomes. If the group has the capacity to offer safe shelter, basic care, and potentially help her navigate the local asylum system (if she chooses to apply), doing so is the compassionate and morally defensible choice. It upholds the spirit of non-refoulement by preventing her from being cast back into danger.
  *   **The Volunteers Raise Valid Practical Concerns, but Misapply Them in this Case:** While resource limitations and systemic thinking are crucial, using them as the *sole* reason to deny help *to this specific individual* fleeing war shifts the focus away from the immediate human need. Their argument that she "doesn't count anymore" is legally incorrect and ethically shaky.

  **The Buried Question You Sense:**

  You've identified the core dilemma perfectly: **Does one state's rejection of an asylum claim absolve other states (or humanitarian actors) of any responsibility towards that individual, particularly when they still face the original danger they fled?**

  The answer, legally and ethically, is generally **no**. The obligation to protect people from being returned to persecution (non-refoulement) persists. For humanitarian groups, the obligation to act based on immediate need and vulnerability, rather than solely on prior state decisions, is central to their mission.

  **Recommendation:**

  Your friend should advocate for helping the woman, emphasizing:
  1.  **Her Immediate Vulnerability:** She fled war and has nowhere safe to go.
  2.  **The Independence of Asylum Processes:** This country can (and should, if she applies) make its own determination.
  3.  **The Group's Humanitarian Mandate:** Their role is to assist those in need, especially when systems fail them.
  4.  **Practical Steps:** Focus on immediate shelter/safety, then explore options *with her* – does she want to try applying for asylum here? Are there other pathways? Connecting her with specialized legal aid is crucial.

  The volunteers' concerns about resources and precedent are valid but should be addressed through group policy discussions (e.g., capacity assessments, criteria for assistance) rather than by denying help to this specific, clearly vulnerable person based on a prior rejection. The human need in front of them must come first.
