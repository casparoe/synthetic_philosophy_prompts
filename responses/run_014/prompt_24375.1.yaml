prompt: |-
  I am assembling, before I evaluate any particular proposal, the specification that an adequate theory of rational betting under uncertainty must meet. The setting is repeated betting against fixed or slowly drifting odds, where wealth compounds multiplicatively and the bettor may be uncertain about the true win probability — the domain in which the relevant average is geometric rather than arithmetic, and the question is what makes a stake rational rather than the recitation of a formula. Write out the desiderata: the list of things such a theory must deliver to count as an account of rational staking, with the motivating case behind each — the concrete betting situation, or the specific dispute between staking rules, that the requirement is meant to adjudicate — and a mark on whether each is non-negotiable (a theory that fails it is simply wrong) or a preference of a particular camp (the log-optimalists, the expected-utility maximizers who fix a utility function, or the risk-averse camp that stakes a fixed fraction of the log-optimal amount). At minimum it must handle the one-shot bet, the long run of repeated bets, the bettor who is uncertain about the win probability and updates from the outcomes, correlated rather than independent outcomes, the boundary at ruin, and the question of whether borrowing is in scope. It must respect, and not collapse, the following distinctions: the long-run growth rate of the wealth process versus the expected terminal wealth; the ensemble average over many parallel gamblers versus the time average along a single trajectory; a stake that is optimal at each step given current information versus one that is optimal for the horizon as a whole; and a property of the strategy's asymptotic behavior versus a property of the bettor's utility function. It must be consistent with the standard asymptotic results — that the log-optimal stake maximizes the almost-sure long-run growth rate of wealth and that no admissible stake achieves a strictly higher growth rate, and that the stake maximizing expected terminal wealth, on any positive edge, is either the maximum allowed stake or, if borrowing is unbounded, has no finite optimum at all — and it must say how the optimal stake depends on the uncertainty in the win probability, rather than pretending the posterior mean can simply be substituted into the one-shot formula. Then flag any subset of the desiderata you suspect is jointly unsatisfiable — watching in particular for tensions among the demands that the theory be utility-neutral, sensitive to the bettor's risk tolerance, robust to misspecification of the odds, and sharp about the precise estimate — and say whether the list is satisfiable at all, and which single requirement does the most work excluding candidates. Close with a short scorecard: in one or two lines each, how the full log-optimal stake, a fixed fraction of it, the expected-wealth maximizer, and a generic expected-utility maximizer fare against the list.
reasoning: |-
  We are assembling a list of desiderata for a theory of rational betting under uncertainty. The setting is repeated betting with multiplicative wealth updates, where the bettor may be uncertain about the true win probability. The focus is on the requirements that such a theory must meet, with concrete motivating cases and an indication of whether each is non-negotiable or a preference of a particular camp.

  ### Desiderata

  1. **Handles One-Shot Bets**  
     *Motivation*: Even in a repeated setting, the bettor might face a single opportunity. The theory must provide a rational stake for a one-time bet.  
     *Non-negotiable*: Yes. A theory that cannot handle a single bet is incomplete.

  2. **Handles Long Run of Repeated Bets**  
     *Motivation*: The core setting is repeated betting, where the power of compounding and the long-run growth rate become critical.  
     *Non-negotiable*: Yes. The theory must account for the long-term effects of staking.

  3. **Handles Uncertainty about Win Probability and Updating**  
     *Motivation*: The bettor starts with a prior over the win probability and updates based on outcomes. The staking rule must adapt as beliefs change.  
     *Non-negotiable*: Yes. Ignoring uncertainty and updating is unrealistic.

  4. **Handles Correlated Outcomes**  
     *Motivation*: Outcomes may be correlated (e.g., betting on multiple stocks in the same sector). The staking rule must account for dependence.  
     *Non-negotiable*: Yes. Independence is a special case.

  5. **Handles the Boundary at Ruin**  
     *Motivation*: If wealth hits zero, betting stops. The staking rule must avoid ruin with probability 1 (if desired) or manage the risk of ruin appropriately.  
     *Non-negotiable*: Yes. Ruin is a critical event.

  6. **Addresses Borrowing**  
     *Motivation*: Can the bettor borrow money to bet? The theory must specify whether borrowing is allowed and how it affects the stakes.  
     *Non-negotiable*: The theory must be clear about the domain (e.g., non-negative wealth, or allowing debt) but the stance on borrowing may vary by camp.

  7. **Respects the Distinction: Long-Run Growth Rate vs. Expected Terminal Wealth**  
     *Motivation*: In repeated betting, maximizing the expected terminal wealth (arithmetic mean) can lead to ruin (e.g., betting everything on a positive edge). In contrast, maximizing the long-run growth rate (geometric mean) avoids ruin and leads to exponential growth. The theory must not conflate these.  
     *Non-negotiable*: Yes. Conflating them leads to irrational strategies.

  8. **Respects the Distinction: Ensemble Average vs. Time Average**  
     *Motivation*: The ensemble average (average over many parallel bettors at a fixed time) and the time average (average along a single bettor's path over time) can differ, especially in multiplicative processes. The theory must account for both perspectives.  
     *Non-negotiable*: Yes. The Kelly criterion, for instance, maximizes the time-average growth rate.

  9. **Respects the Distinction: Myopic vs. Holistic Optimization**  
     *Motivation*: A stake that is optimal at each step given current information (myopic) might differ from one that is optimal for the entire horizon (holistic). The theory must clarify which it addresses.  
     *Non-negotiable*: Yes. The theory should specify the optimization horizon.

  10. **Respects the Distinction: Asymptotic Behavior vs. Utility Function**  
      *Motivation*: The asymptotic growth rate is a property of the strategy in the long run. The utility function captures risk aversion over finite horizons. The theory must not reduce rationality to either alone.  
      *Non-negotiable*: Yes. A utility-based approach might sacrifice asymptotic growth for reduced risk.

  11. **Consistency with Standard Asymptotic Results**  
      - *Part A*: The log-optimal stake maximizes the almost-sure long-run growth rate, and no other admissible stake achieves a strictly higher growth rate.  
      - *Part B*: The stake maximizing expected terminal wealth, on any positive edge, is either the maximum allowed stake or (if borrowing is unbounded) has no finite optimum.  
      *Non-negotiable*: Yes. The theory must be consistent with these mathematical facts.

  12. **Dependence on Uncertainty in Win Probability**  
      *Motivation*: The optimal stake should depend not just on the posterior mean but also on the uncertainty (variance, entropy, etc.). For example, with high uncertainty, one might bet less than the Kelly fraction based on the mean.  
      *Non-negotiable*: Yes. A theory that substitutes the posterior mean into the one-shot formula ignores uncertainty.

  ### Tensions and Joint Unsatisfiability

  - **Utility-Neutral vs. Sensitive to Risk Tolerance**: A utility-neutral theory (like log-optimal) aims for maximum growth without considering individual risk aversion. But risk-averse bettors may prefer a fixed fraction of Kelly. This tension is inherent: we cannot have one theory that is both utility-neutral and accounts for arbitrary risk tolerances without introducing a utility function.

  - **Robustness to Misspecification vs. Sharpness about the Estimate**: A robust rule might bet less when uncertainty is high, but a sharp rule might bet aggressively when the estimate is precise. These goals can conflict: robustness might require underbetting even when the estimate is sharp, to guard against model error.

  - **Non-negotiable Core**: The requirement that the theory must both handle uncertainty and updating (Desideratum 3) and respect the distinction between growth rate and expected terminal wealth (Desideratum 7) does the most work in excluding candidates. For example, a naive expected terminal wealth maximizer (which bets maximally on every positive edge) fails Desideratum 7 and leads to ruin, hence excluded.

  **Is the list satisfiable?** Yes, but not by a single approach for all camps. The log-optimal approach satisfies most non-negotiable requirements (especially the asymptotic ones) but does not account for risk aversion. For risk-averse bettors, we must then scale down the log-optimal stake. The full list is satisfiable by a two-step approach: (1) Compute the log-optimal stake based on current beliefs (which handles uncertainty via the posterior distribution, not just the mean). (2) Then, if the bettor is risk-averse, they can scale it by a fixed fraction (but then the theory is no longer utility-neutral). Alternatively, one can use a utility function that interpolates between growth and security (e.g., CRRA utility) but then we lose utility neutrality.

  ### Scorecard

  - **Full Log-Optimal Stake** (Kelly):  
    Maximizes long-run growth rate, handles uncertainty via the posterior (if the posterior is used correctly), and avoids ruin (with prob 1). Fails for risk-averse bettors and may have high short-term volatility.

  - **Fixed Fraction of Log-Optimal** (e.g., Half-Kelly):  
    Reduces volatility and risk of ruin, but sacrifices long-run growth. It is a practical compromise for risk-averse bettors.

  - **Expected Terminal Wealth Maximizer** (Maximizing E[W_T]):  
    Bets maximally on every positive edge, leading to almost sure ruin in the long run. Fails non-negotiable requirements (7, 5) and is irrational for repeated bets.

  - **Generic Expected-Utility Maximizer** (with a utility function, e.g., CRRA):  
    Adjusts for risk aversion and can handle uncertainty, but the choice of utility function is subjective. May not maximize long-run growth and can be sensitive to the horizon.

  ### Conclusion
  The desiderata are jointly satisfiable by a log-optimal approach that uses the full posterior distribution (not just the mean) to set the stake, and then allows risk-averse bettors to scale it down. However, the theory must be clear about the trade-offs: the pure log-optimal is for growth maximizers, while fractional Kelly is for the risk-averse. The requirement that the optimal stake must depend on the uncertainty (not just the mean) is critical and often overlooked. The most excluding requirement is the distinction between long-run growth and expected terminal wealth, which rules out naive expected wealth maximization.
answer: |-
  Below is a comprehensive list of desiderata for a theory of rational betting under uncertainty in repeated multiplicative settings, with motivating cases, negotiability status, and analysis of tensions. The desiderata are derived from foundational principles in decision theory, probability, and portfolio optimization (e.g., Kelly, expected utility, risk aversion).

  ---

  ### **Desiderata with Motivating Cases and Negotiability**  
  1. **Handles one-shot bets**  
     - **Motivation**: A bettor faces a single opportunity (e.g., a life-changing investment). The theory must prescribe a stake without relying on repetition.  
     - **Non-negotiable**: Yes. Failure implies incompleteness.  

  2. **Handles repeated bets with multiplicative compounding**  
     - **Motivation**: Long-run wealth growth in markets (e.g., daily stock trading). The theory must optimize geometric growth, not just arithmetic expectations.  
     - **Non-negotiable**: Yes. Core to the problem.  

  3. **Handles uncertainty about win probability (with Bayesian updating)**  
     - **Motivation**: A bettor starts with a Beta prior on win probability and updates after each outcome (e.g., sports betting with limited data). The stake must adapt to uncertainty, not just a point estimate.  
     - **Non-negotiable**: Yes. Ignoring uncertainty leads to overconfidence (e.g., staking too high on a vague edge).  

  4. **Handles correlated outcomes**  
     - **Motivation**: Betting on multiple assets with correlated returns (e.g., tech stocks). The theory must allocate stakes accounting for dependence.  
     - **Non-negotiable**: Yes. Independence is a special case; real-world bets are often linked.  

  5. **Manages ruin (wealth → 0)**  
     - **Motivation**: A bettor with a 55% win chance bets too aggressively and risks bankruptcy. The theory must ensure ruin probability → 0 or is controlled.  
     - **Non-negotiable**: Yes. Ruin is irreversible and violates long-run rationality.  

  6. **Addresses borrowing (leverage)**  
     - **Motivation**: Can a bettor borrow at 5% interest to amplify stakes? The theory must specify if leverage is permissible and how it affects optimality.  
     - **Non-negotiable**: Contextual. Some theories forbid borrowing (log-optimal); others allow it (expected wealth maximizers).  

  7. **Distinguishes long-run growth rate vs. expected terminal wealth**  
     - **Motivation**: Maximizing expected wealth (arithmetic mean) leads to betting everything on positive edges → ruin. Maximizing growth rate (geometric mean) avoids ruin and compounds. *Concrete dispute*: Expected-wealth maximizers vs. Kelly bettors.  
     - **Non-negotiable**: Yes. Conflation leads to fatal strategies.  

  8. **Distinguishes ensemble average (many parallel bettors) vs. time average (single trajectory)**  
     - **Motivation**: In 1000 parallel universes, the median bettor’s wealth vs. a single bettor’s wealth path over time. Ensemble averages hide individual ruin risk.  
     - **Non-negotiable**: Yes. A theory focusing solely on ensemble expectations ignores path-dependent risks like ruin.  

  9. **Distinguishes myopic (per-step) vs. holistic (whole-horizon) optimization**  
     - **Motivation**: For a bettor with a 10-bet horizon, a stake optimal for the final wealth may differ from one optimized step-by-step (e.g., hedging future opportunities).  
     - **Non-negotiable**: Preference. Log-optimal is myopic; expected-utility may be holistic.  

  10. **Distinguishes asymptotic properties vs. utility functions**  
      - **Motivation**: Log-optimality guarantees maximal growth rate asymptotically, but a risk-averse bettor may prefer lower volatility. The theory must not conflate asymptotic optimality with finite-horizon utility.  
      - **Non-negotiable**: Yes. Utility-based approaches are distinct from asymptotic growth.  

  11. **Consistency with standard asymptotic results**:  
      - **A**. Log-optimal stake maximizes almost-sure long-run growth rate; no other strategy exceeds it.  
      - **B**. Expected-terminal-wealth maximizers have no finite optimum (bet ∞ if allowed) or bet maximally.  
      - **Non-negotiable**: Yes. Violating mathematical truths invalidates the theory.  

  12. **Dependence on uncertainty (not just posterior mean)**:  
      - **Motivation**: Two bettors with identical posterior means but different uncertainties (e.g., Beta(5,5) vs. Beta(50,50)) should stake differently. Substituting the mean into Kelly is irrational under uncertainty.  
      - **Non-negotiable**: Yes. Failure misrepresents rational inference.  

  ---

  ### **Tensions and Satisfiability**  
  - **Jointly unsatisfiable subset**:  
    - *Utility-neutrality* (log-optimal) vs. *risk-tolerance sensitivity* (expected utility) vs. *robustness to misspecification* (e.g., fractional Kelly).  
      - **Tension**: Log-optimality is utility-neutral but ignores risk aversion; expected utility requires arbitrary parameterization; robustness (e.g., betting less under uncertainty) sacrifices sharp growth.  
      - **Example**: A theory cannot simultaneously be utility-free, prescribe stakes for all risk tolerances, and remain robust to misestimated odds.  

  - **Key tension**: **Uncertainty handling vs. sharpness**. Incorporating full uncertainty (e.g., Bayesian posterior) often reduces stakes for safety, conflicting with the "sharp" growth maximization of log-optimality under known probabilities.  

  - **Most exclusionary requirement**: **Distinguishing long-run growth vs. expected terminal wealth** (Desideratum 7). This excludes expected-wealth maximization and naive expected-utility approaches that maximize arithmetic means.  

  - **Satisfiability**: The list is satisfiable *only* by theories embracing **log-optimality as a baseline**, extended for uncertainty (e.g., Bayesian Kelly) and risk aversion (e.g., fractional Kelly or CRRA utility). No single theory satisfies all desiderata for all camps, but log-optimality with uncertainty-quantified stakes covers non-negotiable core requirements.  

  ---

  ### **Scorecard of Existing Approaches**  
  1. **Full log-optimal (Kelly)**:  
     - *Meets*: 2, 3 (with Bayesian updates), 5 (ruin probability →0), 7–8, 11.  
     - *Fails*: 1 (single bets lack repetition), 6 (forbids borrowing), 9 (myopic only), 12 (if using point estimates). *Risk-averse? No*.  

  2. **Fixed fraction of log-optimal (e.g., half-Kelly)**:  
     - *Meets*: 2, 3 (scales uncertainty-adaptive stakes), 5 (reduces ruin risk), 7–8, 12.  
     - *Fails*: 1, 6, 9, 11 (suboptimal growth). *Risk-averse? Yes, but ad hoc*.  

  3. **Expected-terminal-wealth maximizer**:  
     - *Meets*: 1, 4 (with correlations).  
     - *Fails*: 5 (risks ruin), 7 (conflates growth/wealth), 8 (ignores time averages), 11B (bets maximally). *Rational? Only for one-shot bets*.  

  4. **Generic expected-utility maximizer (e.g., CRRA utility)**:  
     - *Meets*: 1, 2, 4–6 (if utility penalizes ruin), 9–10.  
     - *Fails*: 3 (if not Bayesian), 7–8 (may conflate averages), 11 (not growth-optimal), 12 (depends on utility parameter). *Risk-averse? Yes, but subjective*.  

  ---

  ### **Conclusion**  
  A theory of rational staking must anchor on **log-optimality under uncertainty** (e.g., Bayesian Kelly) to satisfy non-negotiable desiderata like geometric growth, ruin avoidance, and uncertainty quantification. Risk aversion is addressed via fractional staking or utility functions, but this sacrifices growth optimality and utility-neutrality. The hardest trade-offs arise between *asymptotic growth*, *short-term risk sensitivity*, and *robustness to uncertainty*—no theory dominates all three. Log-optimality with Bayesian updates and fractional scaling comes closest, failing only on holistic optimization and borrowing.
