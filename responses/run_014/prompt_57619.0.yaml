prompt: |-
  I spent thirty-six years studying early mammalian development in a laboratory and retired two years ago. Philosophy has since become my principal occupation, and I have now reached the debate over whether an organism's origin is essential to it — the thesis, most famously defended by Kripke, that a person could not have come from a different sperm and a different egg. What strikes me is how little of that discussion is disciplined by what embryos actually do. Before I invest further in the arguments, I want to know what should be asked of a theory in this area at all.

  So: write the specification. What must an adequate account of origins deliver in order to count as a solution rather than a restatement of an intuition?

  The purpose, since adequacy is relative to it: I want an account I could defend in a philosophy of biology seminar and that would not embarrass me in front of colleagues who make embryos for a living. The standard is therefore joint acceptability to metaphysicians and to developmental biologists, and any account that quietly assumes a picture of conception no embryologist would recognize fails on that ground alone.

  Requirements for your answer:

  1. State each requirement together with the case or consideration that motivates it, and mark it as non-negotiable or as the preference of a particular camp. Where it is camp-relative, say which camp, and what it costs them to give it up.

  2. Say what the theory must take the origin to be — the pair of gametes, the zygote, the genome, the cytoplasmic environment, the developmental process initiated at fertilization — and note that this choice, rather than the modal claim, determines which problems arise. The requirements should be stated at that resolution.

  3. The account must handle the following without special pleading:
     (a) Monozygotic twinning, where one zygote yields two individuals; in humans the split may occur anywhere from the two-cell stage to the second week, and late splitting gives conjoined twins. In the nine-banded armadillo a single zygote reliably yields four genetically identical offspring.
     (b) Deliberate embryo splitting, routine in livestock: an early embryo is bisected or its blastomeres separated, each part regulating into a complete animal, and the parts may be carried by different surrogates or one of them frozen for years and transferred later.
     (c) Chimerism, where two early embryos fuse into a single individual carrying two distinct cell lines.
     (d) Nuclear transfer, in which an adult somatic nucleus is introduced into an enucleated egg.
     (e) Mitochondrial replacement, in which a child's nuclear DNA comes from two people and its mitochondrial DNA from a third.
     (f) Artificial activation of an unfertilized egg, which in some vertebrate species produces viable offspring.
     (g) Intracytoplasmic sperm injection, where one sperm out of hundreds of millions is chosen by a person holding a micropipette, so that no fact determines which gamete would otherwise have fertilized the egg.

  4. It must supply identity conditions for the entities it appeals to. An ovulated human oocyte has been arrested in meiotic prophase since before its mother was born; a sperm is a short-lived cell budded off a stem-cell population that renews itself continuously and generates hundreds of millions of competitors. If that very gamete is not a determinate object, an account anchored in gametes inherits the indeterminacy, and I want that counted as a requirement rather than an aside.

  5. It must say what force the necessity bears — metaphysical, nomological, or something weaker — and it must have something to say about the sliding-scale worry: if an organism could have arisen from gametes differing from the actual ones in progressively less significant respects, where does the slide stop, and why.

  6. Identify any subset of these requirements you believe cannot be jointly satisfied. This is the part I most want. If a no-branching condition, the twinning and splitting cases, and the demand that origins not be brute facts pull against one another, I want that stated as a result with the argument sketched, not smoothed over by a distinction introduced at the last minute.

  7. Tell me which single requirement eliminates the most candidates, and where the live disagreement actually lies once the requirements every account already meets have been set aside.

  You may close with two or three sentences on how the best-known accounts fare against the list. Keep it short: the scorecard is the part I can do myself, and I do not want a reading list, as I have one.

  Finally, an epistemic request. Tell me what would change your mind: which of these requirements you hold least securely, and what argument or what piece of biology would make you withdraw it or demote it from non-negotiable to sectarian. And tell me where you expect me to catch you out — a case described inaccurately, an empirical claim stated with more confidence than it deserves, or a modal intuition mistaken for a fact about organisms.
reasoning: |-
  Okay, let me unpack this user's query carefully. They're a retired developmental biologist diving deep into philosophical debates about organism origins, specifically Kripke's necessity of origin thesis. Their frustration with the lack of embryological grounding in these discussions is palpable. 

  Hmm, their core ask is sharp: define what a biologically credible account of origins MUST explain to be taken seriously by both metaphysicians and working embryologists. The seven requirements they listed are exhaustive - from handling twinning/chimerism cases to specifying identity conditions for gametes. 

  What's most revealing is their emphasis on tension points. They explicitly want conflicts between requirements highlighted, not papered over. That "which subset can't be jointly satisfied" point feels like the real bullseye. Also noteworthy is their request for epistemic humility - where I might be wrong.

  *flips mental notebook to developmental biology mode*
  Right, their examples cover the full spectrum: monozygotic twinning (armadillos!), artificial splitting, chimerism... each case breaks different philosophical assumptions. Gamete identity is particularly thorny - that bit about oocytes arrested since fetal life shows they know exactly where standard accounts crumble.

  *switches to metaphysician hat*
  The modal force question is crucial too. If we allow "sliding scale" origins (different sperm but same haplogroup?), where's the cutoff? Kripkeans can't answer that without begging the question.

  *starts mapping tensions*
  Biggest conflict jumps out: no-branching requirement (for persistence) vs. twinning/splitting. Also gamete essentialism vs. ICSI randomness. The cytoplasmic environment requirement will sink most analytic metaphysics approaches immediately - no embryologist thinks a zygote is just DNA in a jar.

  *anticipating pushback*
  I should flag where my own biases show: probably underestimating how much indeterminacy working biologists tolerate. And that cytoplasmic point - is it REALLY non-negotiable or just my preference? Better acknowledge that.

  *structuring the response*
  Will organize by their required sections, but lead with the irreconcilable tensions (their #6). The gamete identity problem (#4) might be the silent killer - most accounts fail there before even reaching other cases. For epistemic weaknesses: my cytoplasmic essentialism could be challenged if someone shows robust regulation compensates.

  *checking tone*
  Must avoid "lecturing" someone with 36 years in the lab. Position this as "here's how a philosopher might scaffold it, but you'll spot where the biology bleeds through." Their closing request suggests they want intellectual sparring, not textbooks.
answer: |-
  Here is a specification for an adequate account of origins, structured by your requirements. The core tension lies in reconciling metaphysical identity with developmental plasticity.

  ### 1. **Requirements & Motivations**
     - **(R1) Non-Arbitrary Origin Point** (Non-negotiable):  
       *Motivation*: Embryogenesis is a continuous process (zygote → morula → blastocyst → gastrula). An account must specify *why* one stage (e.g., zygote) is privileged over others. *Cost of failure*: Arbitrariness undermines necessity claims.
     - **(R2) Handling Developmental Plasticity** (Non-negotiable):  
       *Motivation*: Cases (a)-(g) (twinning, chimerism, cloning, etc.) show embryos can split, fuse, or be artificially manipulated while yielding viable organisms. An account must explain identity persistence/collapse without ad hoc exceptions. *Cost of failure*: Incompatibility with embryology.
     - **(R3) Gamete/Origin Entity Determinacy** (Non-negotiable):  
       *Motivation*: Gametes are transient entities (oocytes exist for decades, sperm are mass-produced stochastic products; ICSI (g) highlights selection randomness). If origins rely on "that very gamete," the account must define what fixes its identity. *Cost of failure*: Vague origins imply vague necessity.
     - **(R4) No Brute Modal Facts** (Metaphysicians’ preference):  
       *Motivation*: Kripkeans require necessity to follow from intrinsic properties or laws. *Cost of relinquishing*: Accepting unexplained necessities weakens explanatory power. Biologists may tolerate this if mechanisms are opaque.
     - **(R5) Cytoplasmic Contribution** (Biologists’ preference):  
       *Motivation*: Mitochondrial DNA (e), cortical factors, and epigenetic reprogramming in nuclear transfer (d) show non-nuclear elements are developmentally essential. *Cost of ignoring*: Overemphasis on nuclear DNA contradicts evidence.

  ### 2. **What is the Origin?**  
  The origin must be the **zygote as a physical system**, including:  
     - Nuclear genomes (paternal/maternal)  
     - Cytoplasm (organelles, mRNAs, proteins)  
     - Spatial organization (e.g., animal-vegetal axis).  
  *Why this choice*: The zygote is the first organized, totipotent cell with a complete developmental program. Gametes alone lack totipotency; later stages (e.g., blastocyst) allow twinning.

  ### 3. **Handling Problem Cases**  
     - **(a,b) Twinning/Splitting**: Origin is the zygote, but identity branches when the embryo splits. Post-split entities are new individuals.  
     - **(c) Chimerism**: Two zygotes create two individuals; fusion produces a third entity with mixed origins.  
     - **(d) Nuclear Transfer**: Reprogramming creates a *new* zygote-like system; the clone shares nuclear DNA but has a distinct cytoplasmic origin.  
     - **(e) Mitochondrial Replacement**: Alters cytoplasmic origin; the child originates from a modified zygote.  
     - **(f) Artificial Activation**: Parthenotes are parent-less; origin is the activated oocyte (a quasi-zygote).  
     - **(g) ICSI**: The selected sperm gains identity via its role in fertilization; "that sperm" is fixed contextually.

  ### 4. **Gamete Identity Conditions**  
     - **Oocyte**: Identified by its meiotic history and physical continuity from ovulation.  
     - **Sperm**: Identified by its participation in fertilization (extrinsic property).  
     *Indeterminacy managed*: Origins depend on the *actual gamete used*, not counterfactual alternatives (resolving ICSI randomness).

  ### 5. **Modal Force & Sliding Scale**  
     - **Force**: *Nomological necessity* (grounded in developmental biology laws), not metaphysical.  
     - **Sliding Scale**: Stopped by **developmental constraints**. Small genetic changes may be permissible (e.g., SNPs), but changes disrupting key processes (e.g., imprinting, axis formation) are not. Specificity derives from what the zygote’s system can tolerate while yielding a viable entity.

  ### 6. **Irreconcilable Requirements**  
  **The subset (R2 + R4 + No-Branching Condition) cannot be jointly satisfied.**  
     - *Conflict*:  
       - **R2** requires accommodating twinning (identity branching).  
       - **R4** demands no brute necessities (branching must be explained).  
       - **No-Branching** (Kripkean) insists an organism has a unique origin.  
     - *Argument*: Twinning shows one zygote → multiple individuals. If identity is necessary/unique, branching violates no-branching. To avoid brute facts, we must accept branching (sacrificing uniqueness) or privilege pre-split stages (violating R1). *Result*: Accounts must either abandon uniqueness (allowing branching) or accept brute facts.

  ### 7. **Highest-Elimination Requirement & Live Disagreement**  
     - **R2 (Developmental Plasticity)** eliminates most candidates. Kripkean accounts fail twinning/chimerism; "genome-only" theories fail nuclear transfer/cytoplasmic requirements.  
     - **Live Disagreement**: Whether identity can *survive* branching (process ontology) or is *destroyed* by it (substance ontology). Biologists favor the former; metaphysicians debate the latter.

  ### Best-Known Accounts’ Shortfalls  
     - **Kripke**: Fails R2 (twinning), R3 (gamete indeterminacy), R5 (ignores cytoplasm).  
     - **Biological Essentialism (e.g., Devitt)**: Struggles with R2, R5.  
     - **Process Ontology (e.g., Dupré)**: Handles R2 but weak on R4 (modalities).  

  ---

  ### Epistemic Vulnerability  
  1. **Least Secure Requirement**: **R5 (Cytoplasmic Essentialism)**.  
     - *Withdraw if*: Evidence shows cytoplasm is fully reprogrammable without developmental consequences.  
  2. **Expected Critique**: **Overstating twinning’s challenge** to substance metaphysics. A sophisticated hylomorphist might argue branching creates new substances with distinct identities.  
  3. **Misstep Risk**: **Conflating functional plasticity with identity conditions** in nuclear transfer (d). Reprogramming success doesn’t prove identity continuity.  

  This specification forces accounts to ground necessity in developmental mechanisms, not intuition. The twinning/genome/cytoplasm trifecta remains the litmus test.
