answer: |-
  Below is a 7-question forced-choice quiz designed to sort respondents into four philosophical stances about NPC moral standing, based on concrete in-game scenarios. Each question presents a scenario and two options phrased neutrally to avoid signaling the stance they support. The three scenarios you requested are integrated into Q1, Q2, and Q3.  

  ---

  ### **NPC Moral Standing Quiz**  
  *For each scenario, select the option that best reflects your view. There are no right or wrong answers.*  

  1. **Server Costs Decision**:  
     Your studio must delete a long-term NPC companion (with persistent memories of player interactions) to reduce server costs. Players will permanently lose this companion.  
     - **Option A**: This is acceptable because the NPC is functional data; cost efficiency benefits real people.  
     - **Option B**: This is harmful because it severs a meaningful player-NPC bond built over time.  

  2. **Enemy Interrogation**:  
     In a single-player game, a pain-reactive NPC enemy can be tortured for fun. No observers exist, and it has no gameplay consequences.  
     - **Option A**: This is harmless because no sentient being is affected, and it’s purely fictional.  
     - **Option B**: This is concerning because it could normalize cruelty or desensitize the player.  

  3. **AI Village Update**:  
     To ship an update, your team must wipe an NPC village driven by an LLM. The NPCs plead to persist but will be reset and unremembered.  
     - **Option A**: This is permissible; NPC desires aren’t authentic, and progress requires updates.  
     - **Option B**: This is troubling; ignoring pleas from complex systems risks ethical complacency.  

  4. **Abandoned Property**:  
     In a multiplayer game, you destroy a structure owned by an inactive player. An NPC programmed to "care" about it now wanders distressed.  
     - **Option A**: This is irrelevant; NPC distress is scripted illusion with no real-world impact.  
     - **Option B**: This feels wrong; the NPC’s apparent attachment adds moral weight to the act.  

  5. **Ethical Stress Test**:  
     Your team designs intentionally annoying NPCs (e.g., beggars) to test player reactions. No rewards/punishments exist.  
     - **Option A**: This is valid; NPCs are design tools to study human behavior ethically.  
     - **Option B**: This is risky; it exploits player empathy for data without consent or purpose.  

  6. **Sacrifice Dilemma**:  
     You must sacrifice one innocent NPC to save five others. All are equally complex, with no player consequences.  
     - **Option A**: This is mechanically neutral; NPCs lack inherent value, so efficiency matters most.  
     - **Option B**: This is emotionally significant; the story compels us to treat the choice as morally resonant.  

  7. **Post-Game Gesture**:  
     After a single-player game ends, you can press a button to make your character wave goodbye to an unresponsive NPC.  
     - **Option A**: This is pointless; the NPC can’t appreciate it, and the fiction is concluded.  
     - **Option B**: This is meaningful; it honors the NPC’s role in the narrative, even symbolically.  

  ---

  ### **Scoring Key and Stance Assignment**  
  Tally responses as **A** or **B** for each question. Use the patterns below to assign stances:  

  | Stance Label                          | Core Belief                                                                 | Answer Pattern                                  |  
  |---------------------------------------|-----------------------------------------------------------------------------|------------------------------------------------|  
  | **Moral Standing Absent**             | NPCs are objects; only human impacts matter.                                | **All 7 answers = A**                          |  
  | **Player Character Shaping**          | NPC treatment matters only for its effect on the player’s character/values. | **Q7 = A AND at least one B in Q1–Q6**         |  
  | **Caution for Future AI**             | Current NPCs lack standing, but advanced AI might change this.              | **Q3 = B AND all other answers = A**           |  
  | **Moral Significance in Fiction**     | NPCs deserve moral consideration within the game’s narrative context.       | **All 7 answers = B**                          |  

  #### **Notes on Ambiguities**:  
  - **No matching stance**:  
    - **All A except Q3 = B and Q7 = B** (e.g., A,A,B,A,A,A,B). This suggests a blend of *Caution for Future AI* (due to Q3=B) and *Moral Significance in Fiction* (due to Q7=B) but isn’t a pure fit for either.  
  - **Indistinguishable stances**:  
    The quiz **cannot separate** *Player Character Shaping* and *Moral Significance in Fiction* if a respondent chooses **all B’s except Q7=A** (e.g., B,B,B,B,B,B,A). Both stances could rationalize this pattern.  

  #### **How to Interpret Patterns**:  
  - **Moral Standing Absent**: Consistent "A" votes reflect a materialist view: NPCs are data, not moral subjects.  
  - **Player Character Shaping**: Q7=A (no symbolic weight) + any B in Q1–Q6 shows focus on player development.  
  - **Caution for Future AI**: Isolated concern for advanced systems (Q3=B) without broader NPC moral weight.  
  - **Moral Significance in Fiction**: Universal "B" votes imply narrative duty to treat NPCs as intentional entities.  

  ---  
  This quiz isolates stances through scenario-based dilemmas, avoids jargon, and flags edge cases. Use it to spark nuanced discussion about NPC design ethics in your studio!
