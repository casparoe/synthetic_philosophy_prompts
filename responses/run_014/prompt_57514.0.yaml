prompt: |-
  Retired clinical chemist here, 35 years runing a hospital lab, now reading philosophy of medicine for fun and getting more confused the further I go.

  The debate I want you to diagnose is naturalism versus normativism about disease. As I understand the two camps: the naturalists (Boorse being the one I keep getting pointed at) say disease is a value-free biological fact, namely a statistically subnormal level of functional efficiency in some part of you, measured against a reference class of your species, age and sex, where a function is just what the part typically does that contributes to survival and reproduction. The normativists say that's a magic trick, because you already slipped values in when you picked which functions to count and when you blessed survival and reproduction as the goals, and because the same deviation is a disease in one setting and a mere difference in another. Wakefield tries to split the difference with a two-part account, a factual bit about evolution going wrong plus a value bit about harm. Decades in, nobody has budged anybody.

  Here's what I keep coming back to from my old job, and it's why I suspect the two sides are arguing past each other. In the lab we never said disease. We said a result fell outside the reference interval, and the reference interval was literally the central 95 percent of values from whatever reference population we had chosen. Choose healthy blood donors and one in twenty of them is abnormal by construction. Switch assay manufacturer, or reharmonize methods, or stratify by age, or build your reference group out of endurance athletes instead of the general population, and the same number from the same patient lands on the other side of the line with no change in the patient. And for the markers that actually drive a diagnosis we mostly stopped using healthy-population distributions altogether and use decision limits set by committees weighing outcomes, the HbA1c cutoff for diabetes or the eGFR thresholds, where the underlying quantity sits on a smooth risk curve and the committee has to decide how much over-diagnosis and how much missed disease it is willing to live with.

  So my hypothesis, offered as a hypothesis: the values the normativists are hunting for aren't buried inside the notion of function at all, they're sitting out in the open in the choice of reference class and in the setting of thresholds, and the naturalist can cheerfully concede both and still insist the statistical-biological facts themselves are value-free. If that's right there is no single disagreement here, just a division of labor that both sides describe as a war.

  Is my hypothesis right, or too tidy? Specifically: is there a substantive disagreement left over once you hand reference classes and thresholds to the normativists, something about what functions are, or about whether the evolutionary goal really is neutral, that could in principle be settled by argument or evidence? I'd like you to say what each side would actually reply to the lab case, where my framing overstates things, and what would count as progress, whether a distinction, a formal result, better descriptive work on how thresholds get set in practice, or nothing at all because the question is malformed. A survey of the positions is not what I'm after; I've read the survey.

  Please write in American English. Your very last line should be exactly of the form Verdict: <label>, where <label> is one of verbal dispute / substantive-factual / substantive-normative / two-different-questions / ill-posed / division-of-labor, and you may compound two of them with a plus sign if that's the honest answer. Nothing after that line.
reasoning: |-
  Okay, let's tackle this. The user is a retired clinical chemist with 35 years of lab experience, now diving into philosophy of medicine. They're stuck on the naturalism vs. normativism debate about disease. Their main question is whether their hypothesis holds: that values are in the choice of reference classes and thresholds, not in the biological facts themselves. They want to know if there's still a substantive disagreement after conceding those points.

  First, I need to recall the key points of both camps. Naturalists like Boorse argue disease is value-free biological dysfunction. Normativists say values are embedded in selecting functions and goals. Wakefield's hybrid adds harm as a normative component. The user's experience in the lab shows how reference intervals and decision limits are value-laden choices, affecting whether a result is "abnormal."

  The user’s hypothesis is that reference classes and thresholds are where normativists should focus, leaving biological facts value-free. But is that the whole story? I should check each side's response. Naturalists might argue that functions are objectively tied to survival/reproduction, so the core concept remains factual. Normativists would counter that even defining "function" involves normative judgments, like prioritizing survival over other potentials.

  Also, evolutionary goals: naturalists see them as objective, but normativists question why survival/reproduction is the default. For example, is menopause a disease? Biologically, it reduces reproduction, but culturally, it's normal. This shows the conflict isn't just about thresholds but deeper conceptual differences.

  The user might be overestimating how tidy the division is. Even if reference classes are handed to normativists, the naturalist's core definition of function could still be contested. Normativists like Reznek argue that the entire framework of "dysfunction" relies on unstated values.

  Is this a verbal dispute? Partly, but there's also substantive disagreement on whether biological functions can be value-free. Progress might involve clarifying terms or empirical studies on how functions are assigned. Still, the debate persists because both factual and normative elements are intertwined in practice. 

  The verdict should reflect that it's partially a division of labor but also substantive-normative due to deeper conceptual clashes. So, combining division-of-labor with substantive-normative makes sense.
answer: |-
  Here's a breakdown addressing your hypothesis and the underlying dispute:

  1.  **Your Hypothesis' Strength:** You're absolutely right that real-world diagnostic practice *forcefully* demonstrates how value-laden choices about reference classes, populations, and decision thresholds determine what gets labeled "abnormal" or "diseased." Normativists would wholeheartedly agree this is a prime location for their values critique. Naturalists (like Boorse) *can* concede this point about operationalization without abandoning their core claim: that the underlying *biological dysfunction* (statistically subnormal part-function relative to species design *for survival/reproduction*) is itself a value-free fact.

  2. **What Each Side Says to Your Lab Case:**
      *   **Naturalist (Boorsean):** "Your lab perfectly illustrates the *operationalization* of disease concepts, not the core concept itself. Choosing blood donors vs. athletes changes the *reference class*, but the *theoretical* reference class (species-typical age/sex cohort in normal environments) remains the value-free anchor. The HbA1c committee sets a *practical diagnostic threshold* based on harm/risk trade-offs we accept *because* sustained hyperglycemia indicates pancreatic beta-cell *dysfunction* (the value-free biological fact). The values are in the application, not the dysfunction definition."
      *   **Normativist:** "Your lab proves our point entirely! The 'biological fact' *only* becomes relevant *because* we value survival/reproduction. Why is pancreatic beta-cell function privileged? Because we value avoiding the harms of diabetes (neuropathy, retinopathy, etc.). Choosing *any* reference class or threshold inherently reflects values about what constitutes 'normal' life or acceptable risk. Calling something 'dysfunction' only makes sense against a backdrop of valued goals. The HbA1c committee *explicitly* weighs normative trade-offs – that *is* the disease definition in practice, exposing the values baked into the core concept."

  3. **The Substantive Disagreement Persisting:**
      Even conceding reference classes and thresholds to normativists, a core clash remains:
      *   **The Status of "Function" and Evolutionary Goals:** Naturalists insist that biological *function* (e.g., the kidney's function is filtration, the heart's is pumping blood) is objectively defined by evolutionary contribution to survival/reproduction within the species' design. This, they claim, is a purely factual, biological discovery. Normativists counter that:
          *   Privileging *survival/reproduction* as the *telos* is itself a value choice. Why not flourishing, well-being, or social participation? (e.g., Is menopause a disease? Biologically it ends reproduction, but we don't classify it as such).
          *   Identifying the "proper function" of a part often involves normative assumptions about what it's *supposed* to do. What is the "function" of low mood? Pain? These aren't always clear-cut biological malfunctions.
      *   **Is "Dysfunction" Truly Value-Free?** Normativists argue that labeling something a "dysfunction" inherently implies it's *bad* or *wrong* – a normative judgment. Can we even *identify* a "statistical subnormality" as *dysfunction* without assuming the norm is *good* and deviation is *bad*? Naturalists argue we can observe deviation from a statistically typical contribution to survival/reproduction without invoking "bad" – it's just a description of reduced efficiency relative to the species norm. The disagreement is whether "dysfunction" *as used in disease contexts* can ever be stripped of this negative connotation.

  4. **What Would Count as Progress:**
      *   **Clarifying the Distinction:** Better articulation of "biological function" vs. "valued ability." Can "dysfunction" be defined *without* any reference to harm or undesirability, purely as a failure in a mechanism shaped by natural selection? If so, is this definition sufficient for medicine?
      *   **Empirical Work on Function Assignment:** Detailed biological studies examining if/how evolutionary biology *uncontroversially* assigns functions to parts/processes in a way that avoids normative assumptions. Does evolutionary theory *require* a normative commitment to survival/reproduction as a "goal"?
      *   **Descriptive Work on Thresholds/Classes:** Your lab experience highlights the crucial need for more transparency about *how* committees set thresholds and choose reference groups, explicitly documenting the value judgments involved (as some guidelines now attempt). This grounds the normativist critique in practice.
      *   **Formalizing Hybrids:** Can frameworks like Wakefield's (Harmful Dysfunction) be refined or operationalized in a way that satisfies both sides? Or does it just relocate the dispute?
      *   **Acknowledging Scope:** Recognizing that "disease" serves multiple purposes (scientific explanation, clinical diagnosis, social eligibility, personal suffering) and no single account may capture them all. Your lab perspective shines a light on the crucial distinction between *biological abnormality* and *clinical disease/diagnosis*.

  **Verdict: division-of-labor + substantive-normative**
