answer: |-
  Here's a decision tree built from principles and concrete cases, designed to generate distinct positions on university funding. It starts from shared ground and forces divergence through practical dilemmas. The leaves map to real-world systems or philosophies, with notes on overlaps and empty slots.

  **Shared Starting Point:** *"A society with widespread higher education is generally more prosperous, innovative, and culturally rich than one without it. Some public investment is justified."*

  ---

  ### The Decision Tree (5 Key Branch Points)

  1.  **PRIMARY COST BEARER: Who should pay the *core cost* of tuition?**
      *   **(A) Primarily Society (via Taxes):** The collective benefit justifies collective funding.
      *   **(B) Primarily the Individual (via Payment/Fees):** The primary beneficiary is the individual, so they should pay. Society might offer *support* (loans, grants) but not *cover* the cost.

  2.  **EQUITY vs. INDIVIDUAL GAIN: How do we handle the 'Plumber/Doctor' problem? (The plumber pays taxes funding the doctor's degree; the doctor out-earns the plumber for life)**
      *   **(A) It's Just & Efficient:** Society gains overall from both skilled professionals. Progressive taxation means the doctor *will* pay more back over their lifetime. Redistributive taxes later address inequality. *Focus on societal ROI.*
      *   **(B) It's Unfair & Inefficient:** Why should lower earners subsidize the path to high earnings? Creates perverse incentives and misallocation. High earners *should* bear more cost directly. *Focus on individual ROI and fairness of direct subsidy.*
      *   *(Note: This is a major fault line, often splitting A1 and B1)*

  3.  **RISK POOLING: Who bears the risk of failure/low earnings/emigration?**
      *   **(A) Society (Taxpayers):** Education is a public good; society invests knowing some investments won't pan out or will 'leak' via emigration. Risk is pooled and absorbed.
      *   **(B) The Individual (via Loans/Debt):** Individuals choose their path; they should bear the consequences. Society might offer *insurance* (forgiveness clauses, safety nets) but the *debt risk* is individual.
      *   **(C) Shared Risk (Conditional Models):** Risk is shared based on outcomes (e.g., repay only if you earn well, repay more if you emigrate).

  4.  **SCOPE OF PROMISE: What does 'funding university' actually cover?**
      *   **(A) Tuition Only:** The core educational service. Living costs are the individual's responsibility (grants/loans possible separately).
      *   **(B) Tuition + Basic Living Costs:** Full access requires removing *all* financial barriers to participation. Education can't happen if you're hungry/homeless.
      *   *(Note: This creates tension even *within* "free tuition" models, e.g., Germany vs. Nordics)*

  5.  **SCALABILITY & VALUE: Does the 'Aunt's Argument' hold? (Cheap 80s US college proves it's possible; today's mass attendance changes the math/causes credential inflation)**
      *   **(A) Scale Doesn't Break the Model:** Mass education *increases* societal benefit. Cost per student can be managed efficiently. Credential inflation is a separate labor market issue, not an argument against access. Public investment *creates* value.
      *   **(B) Scale Changes Everything / Subsidy Fuels Inflation:** Massively subsidizing demand without controlling supply/cost *does* drive up prices and devalue degrees ("BA is the new HS diploma"). The 80s model worked *because* fewer went. Focus on cost control, alternative paths, and individual investment signaling true value.
      *   **(C) Subsidy is Irrelevant to Inflation:** Credential inflation is driven by employer demands and declining standards elsewhere (e.g., high schools), not funding mechanisms. Funding access is still paramount.

  ---

  ### The Leaves (Resulting Positions)

  By combining answers, we reach distinct positions. **Bold** indicates the most defining characteristic.

  1.  **Universal Free Tuition + Living Support (Nordic Model):**
      *   Path: 1A (Society Pays) + 2A (Equity OK) + 3A (Society Bears Risk) + 4B (Covers Living) + 5A (Scale OK/Creates Value)
      *   **Core Belief:** Higher education is a fundamental public good and right. Full access (tuition + living) is essential for true equity and maximizing societal benefit. Risk pooling is inherent to public goods. Mass attendance is positive.
      *   *Character Anchor:* Berlin Sister (but she might downplay emigration risk - 3A).

  2.  **Universal Free Tuition Only (German Model):**
      *   Path: 1A (Society Pays) + 2A (Equity OK) + 3A (Society Bears Risk) + **4A (Tuition ONLY)** + 5A (Scale OK)
      *   **Core Belief:** Access to *education* is the fundamental right/societal good. Living costs are a separate welfare/personal responsibility issue. Focuses resources on the core service. Societal risk is acceptable.
      *   *Character Anchor:* Berlin Sister (if acknowledging living cost struggles).

  3.  **Free Tuition with Strings (Repay-If-You-Can/Emigrate):**
      *   Path: 1A (Society Pays) **+ 3C (Shared Risk - Conditional)** + (2A or 2B less relevant) + (4A or 4B) + (5A or 5B/C)
      *   **Core Belief:** Society should fund access upfront *but* individuals who reap significant private gains (high earners, emigrants) have an obligation to repay some costs. Balances access with fairness and mitigates risk/"leakage". Can be paired with free tuition only (4A) or full support (4B).
      *   *Character Anchor:* A pragmatic character, maybe the youngest considering Sweden (which has some fees for non-EU and generally expects graduates to contribute via taxes).

  4.  **Income-Contingent Loans (ICL) with Forgiveness (UK/Australia Model):**
      *   Path: **1B (Individual Pays) + 3C (Shared Risk - Conditional)** + 2B (Unfair Subsidy) + (4A or 4B) + (5A, 5B, or 5C)
      *   **Core Belief:** Individuals should pay, but only according to their *ability* to pay post-graduation. It's a *loan* (individual obligation) but with insurance baked in (forgiveness, no repayments below threshold). Addresses unfairness of blanket subsidy (2B) and individual risk (3C). "Graduate Tax" is often used imprecisely for this; it's really a *contingent loan*.
      *   *Character Anchor:* British Brother (suffering under it, but might defend its *principle* vs. US system).
      *   *Overlap/Confusion:* A true **Graduate Tax** (an *additional*, permanent income tax levy on all graduates) is rare. ICLs are loans forgiven eventually; a Graduate Tax is a perpetual tax. The tree *can* separate them: True Graduate Tax = 1A + 3A + (Specific Graduate Levy). But ICL is the dominant "contingent repayment" model. Your characters might conflate them.

  5.  **Improved Private Loan Model (Aunt's Idealized US?):**
      *   Path: **1B (Individual Pays) + 3B (Individual Bears Risk)** + 2B (Unfair Subsidy) + (4A or 4B) + **5B (Scale Changes Math / Subsidy Fuels Inflation)**
      *   **Core Belief:** University is primarily a private investment. Loans are appropriate but should be *fairer and less predatory* (lower interest, better terms, bankruptcy options). Blanket public subsidy is unfair (Plumber/Doctor) and fuels cost inflation. Focus on cost control and individual responsibility. Aunt's 80s experience proves costs *can* be low without massive subsidy (ignoring historical public funding levels).
      *   *Character Anchor:* The Aunt (nostalgic for lower costs, focused on individual payoff, sees current loans as "cruel" but necessary).

  6.  **Minimal Public Subsidy / User Pays (Libertarian-Leaning):**
      *   Path: **1B (Individual Pays) + 3B (Individual Bears Risk)** + 2B (Unfair Subsidy) + (4A - maybe minimal loans) + **5B (Scale Changes Math / Subsidy Fuels Inflation)**
      *   **Core Belief:** Higher education is a private consumption good/investment. Public subsidy distorts the market, drives up costs, creates unfair transfers (Plumber/Doctor), and devalues degrees. Individuals should pay market rates via savings, family support, or strictly private loans. *Very* limited need-based grants might exist for extreme hardship. The Aunt's 80s experience is proof *subsidy wasn't needed then* (historical blindness).
      *   *Character Anchor:* The Aunt (if pushed to her logical extreme), or another character holding a hard line.
      *   *Overlap:* Shares 1B, 2B, 3B, 5B with Leaf 5. **Key Distinction:** Leaf 5 accepts *publicly provided/backed loans* as a necessary mechanism for access. Leaf 6 rejects this, favoring purely private solutions or minimal direct grants. Leaf 5 wants to *fix* the loan system; Leaf 6 wants to largely *eliminate* public involvement in funding.

  7.  **Empty Slot? "Free for High-Demand/Strategic Fields Only":**
      *   *Why Empty?* Combines 1A (Society Pays) but only for *some*, with 1B (User Pays) for others. Highly problematic: Who defines "strategic"? Creates immediate inequity and social stratification. Logically *possible* (1A + Selective Criteria + ...) but generally rejected as unfair and inefficient in mainstream debates. *Character Potential:* Maybe a technocrat character, but it would be a fringe view at this table.

  ---

  ### Key Overlaps & Tensions for Your Scene

  1.  **Risk Pooling (3) is Crucial:** This sharply divides Free Tuition advocates (3A) from ICL (3C) and Loan advocates (3B). The Berlin Sister (3A) sees risk as society's job; the British Brother (3C) sees his loan as *his* debt (with insurance); the Aunt (3B/Leaf 5) sees risk as purely individual.
  2.  **Plumber/Doctor (2) is the Emotional Flashpoint:** Free Tuition advocates (2A) see this as the *point* of society. ICL/Improved Loan/Minimal Subsidy advocates (2B) see it as deeply unfair. This is where ideology clashes hardest.
  3.  **Scope (4) Causes Internal Tension:** The Berlin Sister might be forced to admit her "free" system didn't cover living costs, creating hardship (4A), while a Nordic defender (4B) or the youngest looking at Sweden might argue *true* access requires full support. The Aunt (Leaf 5/6) sees living costs as purely individual.
  4.  **Scale/Value (5) is the Generational Divide:** The Aunt (5B) believes subsidies caused the mess. Free/ICL advocates (5A) believe the problem is *under*-funding or poor loan design. This pits the Aunt's lived experience against current realities.
  5.  **ICL vs. Graduate Tax:** As noted, characters (especially the British Brother) might *call* it a "grad tax," but technically it's a contingent loan. The key point is *individual obligation contingent on success* (3C) vs. the pure tax-funded model (1A+3A). This distinction might get blurry in the heat of argument.
  6.  **Improved Loans (Leaf 5) vs. Minimal Subsidy (Leaf 6):** The Aunt likely straddles here. She wants loans to be *better* (Leaf 5) but her underlying principles (1B, 2B, 3B, 5B) align strongly with Leaf 6. Pushing her on *how* to make loans accessible without subsidy could expose this tension.

  **How to Use This:**

  1.  **Assign Starting Points:** Map your characters roughly to the leaves. The Berlin Sister is Leaf 1 or 2. The British Brother is Leaf 4. The Aunt is Leaf 5, leaning towards 6. The Youngest is deliberating between Leaf 1/2/3 (Sweden) and Leaf 5 (US loans - though reality is harsher).
  2.  **Identify Conflict Lines:** Use the Branch Points as the *triggers* for argument. Someone mentions the Plumber (Branch 2). The Aunt brings up her cheap 80s degree (Branch 5). The Youngest asks "But what if I drop out or move to Asia?" (Branch 3). The Berlin Sister scoffs at UK loan repayments (Branch 3 & 1). The Brother mentions struggling with rent during his degree (Branch 4).
  3.  **Let them Circle:** It's okay if, on some points (like Scale/Value - Branch 5), characters on different leaves (e.g., Free Tuition and ICL) might partially agree *against* the Aunt ("No, the problem isn't too many people going!"). Conversely, the Aunt and the Brother might *both* criticize pure free tuition on fairness grounds (Branch 2 - Plumber/Doctor), though for different reasons (Aunt: unfair subsidy; Brother: why do *they* get it free when *I* pay?).
  4.  **Youngest as Catalyst:** Her choice embodies the debate. Her questions should force the others to defend/explain their positions using the concrete cases in the branches.

  This structure ensures their arguments stem from core differences in *how* they answer the practical, ethical, and economic dilemmas (the branch points), not just abstract slogans. The overlaps show where alliances might shift or where confusion is natural, making the argument more dynamic and realistic. Good luck with the climax!
