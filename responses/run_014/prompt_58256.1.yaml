  Okay, the user and their friend had a heated three-hour debate about consent, specifically regarding when lies invalidate consent. The user's brain is fried and they need clarity without taking sides. Let me unpack this.

  First, the friend's argument is that consent is valid as long as there's a "yes" and awareness of the physical act. Any lies about non-physical aspects (like job or liking dogs) don't negate consent. The user countered with examples like lying about STI status, stealthing, impersonation, or unauthorized medical procedures, which feel like no real consent. The friend pushed back with the slippery slope argument: if those lies invalidate consent, what about lies about salary or exclusivity? The user is stuck because they can't articulate why some lies matter more than others.

  The core issue here is distinguishing between fraud that vitiates consent and deception that doesn't. The user mentioned the "but-for" test (if the lie caused the yes, then no consent) but rejects it because it leads to absurd conclusions. They need a principled distinction between dealbreakers that invalidate consent and those that don't. 

  Looking at legal frameworks, consent has two layers: agreement to the physical act and the nature of the act. For example, agreeing to sex with a condom is different from without. Stealthing changes the physical nature, making it non-consensual. Similarly, impersonation or an extra medical procedure alters the fundamental nature of the act. 

  Lying about STIs is trickier. It doesn't change the physical act itself but involves a known serious risk. Legally, this is often fraud in the inducement. The key here is whether the deception relates to the essential nature of the act or significant collateral consequences. 

  The user's examples show this distinction. Salary or dog lies are collateral facts—they might influence the decision but don't alter what's consented to. STI lies, however, involve health risks, which are directly related to the sexual act's consequences. Stealthing changes the act mid-engagement, violating ongoing consent. 

  The user needs concrete examples to see the framework. Explaining how different lies affect the act's nature versus inducement factors will help. Also, clarifying that consent isn't just a one-time "yes" but ongoing and conditional. Addressing the friend's slippery slope by showing the line isn't arbitrary but based on the act's nature and inherent risks. 

  The user's deeper need might be understanding how to navigate consent ethically, beyond legal definitions. They want a clear, principled way to discuss this with others, avoiding oversimplification. Highlighting the difference between deception about the act itself versus personal characteristics can empower their arguments.
answer: |-
  You've hit on one of the thorniest debates in consent ethics! Your instinct that "but-for causation" alone (i.e., "you wouldn't have said yes if you knew the truth") isn't the right test is spot-on. The distinction revolves around the **nature of the deception and what it fundamentally alters about the act you consented to.**

  Here's the breakdown using your examples, focusing on conceptual frameworks:

  **Core Principle:** Valid consent requires agreeing to the **specific act** with **sufficient understanding of its fundamental nature and consequences.** Not *all* motivating factors are part of that "fundamental nature."

  ### Key Distinction: Fraud in the Factum vs. Fraud in the Inducement

  1.  **Fraud in the Factum (Fraud as to the Act Itself):**
      *   **Definition:** The deception goes to the *very nature or essence of the act* being performed. You are tricked into believing you are participating in one act, while a fundamentally different act is occurring.
      *   **Effect:** **Invalidates consent** because you did not consent to *that* act at all.
      *   **Your Examples:**
          *   **Impersonation (Pretending to be Someone Else in the Dark):** You consented to sex *with Person A*. You got sex with *Person B*. The *identity of the participant* is fundamental to the nature of the act you consented to. This is fraud in the factum. No valid consent.
          *   **Doctor Doing an Extra Unauthorized Procedure:** You consented to *Exam A*. The doctor performed *Exam A + Procedure B* (without consent or medical necessity). The *nature of the physical intrusion* is fundamentally altered beyond what you agreed to. Fraud in the factum. No valid consent.
          *   **Stealthing (Agreeing to Sex with a Condom, Partner Removes It):** You consented to *protected sex*. You got *unprotected sex*. The *physical nature of the act* (specifically, the risk profile and potential consequences) is fundamentally changed. This alters the core act consented to. Widely considered fraud in the factum or a fundamental violation of conditional consent. No valid consent for the unprotected act.

  2.  **Fraud in the Inducement (Fraud as to Collateral Matters):**
      *   **Definition:** The deception involves *facts or promises that motivate your agreement* but do not change the fundamental nature of the act you are actually performing. You know what act you're doing, but you were lied to about surrounding circumstances *why* you should do it.
      *   **Effect:** **Does not automatically invalidate consent** to the *physical act itself*, though it may make the consent ethically problematic, manipulative, or grounds for other consequences (like ending the relationship). The consent is still legally/ethically valid *for the act that occurred*, even if obtained under false pretenses about unrelated things.
      *   **Your Friend's Examples:**
          *   **Lying About Job/Salary:** You consented to sex. You had sex. The lie motivated you, but it didn't change what physical act you engaged in. You knew you were having sex. Fraud in the inducement. Consent is still valid *for the act of sex* (though the liar is a jerk).
          *   **Lying About Liking Dogs:** Same as above. Collateral fact motivating consent, doesn't alter the nature of the act itself.
          *   **Lying About Being Exclusive (when not):** You consented to sex under the *belief* of exclusivity. The lie was a motivating factor. However, the *physical act of sex* you engaged in was what you consented to perform. The nature of the act wasn't changed by the lie about the relationship status *during the act itself*. This is fraud in the inducement. (Important: This is distinct from lying about STI status - see below).

  ### The Tricky Middle Ground: STI Lies & Significant Risk

  *   **Lying About Having an STI:** This is the hardest case and falls somewhere *between* the two categories, leaning heavily towards invalidating consent in many modern ethical and legal frameworks.
      *   **Why it's not purely Fraud in the Inducement:** While the *act* is still sex, lying about a known, serious health risk fundamentally alters the **nature of the consequences** inherent to the act consented to. Sex inherently involves bodily fluid exchange and disease risk. Concealing a known, significant, and direct risk associated *with the very act itself* is seen by many as going beyond mere motivation and striking at the core understanding of the act's **inherent risks and potential harms**.
      *   **Why it's not *quite* Fraud in the Factum:** You still knew you were consenting to sex. However, the lie concealed a critical, inherent aspect *of* that act (the severe health risk).
      *   **The Emerging Consensus:** Increasingly, courts and ethicists treat **deliberate deception about known STI status (especially serious ones like HIV) as negating consent.** The reasoning is that consent to sex requires understanding material facts about significant health risks directly involved in the act. Concealing such a risk means the person did not truly understand the nature of the act they were consenting to. It transforms the act into one with a fundamentally different level of risk and potential harm than what was agreed upon.

  ### Why the Simple "But-For" Test Doesn't Work (And Your Friend's Slippery Slope is Flawed)

  1.  **Over-inclusiveness:** As you sensed, the "but-for" test swallows all consent. People consent for thousands of reasons (love, attraction, boredom, curiosity, hope for a relationship, etc.). If *any* lie or omission that influenced the decision invalidated consent, then every minor deception (I said I liked their shirt when I didn't, I said I had 2 beers when I had 3) could theoretically negate consent. This is impractical and doesn't align with societal or legal understanding.
  2.  **Focuses on Motivation, Not the Act:** The "but-for" test only asks *why* someone said yes. Valid consent requires understanding *what* you are saying yes *to*. The deception matters in relation to the **fundamental nature of the act itself**, not just the reason for doing it.
  3.  **The Slippery Slope Argument ("What about salary/exclusivity?"):** This argument fails because it ignores the distinction above.
      *   Lying about salary is fraud in the inducement. It motivates the consent but doesn't change the physical act or its inherent, immediate risks.
      *   Lying about an STI is increasingly seen as negating consent because it directly conceals a severe, inherent, and immediate health risk *of the physical act itself*. The risk is inseparable from the act of sex.
      *   The line is drawn based on **whether the deception fundamentally alters the nature of the act consented to or conceals a core, inherent risk directly associated with that act.** Salary doesn't do that; a known serious STI does.

  ### Conceptual Summary - Where to Draw the Line

  Ask these questions about the deception:

  1.  **Did the lie change *what physical act* the person actually performed?** (Impersonation, Unauthorized Medical Procedure, Stealthing fundamentally changed the act). **-> No Consent.**
  2.  **Did the lie conceal a *known, serious, and inherent risk directly associated with the physical act itself* that would fundamentally alter a reasonable person's understanding of the act's consequences?** (Deliberately lying about a serious STI). **-> Increasingly considered No Valid Consent.**
  3.  **Was the lie about a *collateral fact or promise* that motivated the person but did not alter the fundamental nature of the act they knew they were performing?** (Lying about job, salary, loving dogs, exclusivity *during the act itself*). **-> Consent to the act is still valid (ethically problematic, but not non-consensual sex).**

  **Your Examples Applied:**

  *   **STI Lie:** Conceals a core, inherent risk of the act (sex). Invalidates consent.
  *   **Stealthing:** Changes the fundamental physical nature of the act (protected -> unprotected). Invalidates consent.
  *   **Impersonation:** Changes the fundamental identity involved in the act. Invalidates consent.
  *   **Unauthorized Medical Procedure:** Changes the fundamental physical intrusion. Invalidates consent.
  *   **Salary/Dog Lie:** Collateral fact motivating consent. Does not invalidate consent *for the act of sex*.
  *   **Exclusivity Lie:** Collateral promise motivating consent. Does not invalidate consent *for the act of sex* (though it's a severe betrayal).

  This framework acknowledges that consent isn't just about the mechanical "yes," but about **meaningful agreement to the *specific thing* happening with sufficient understanding of its core nature and risks.** It avoids the absurdity of the pure "but-for" test while recognizing that some deceptions go far beyond mere persuasion and fundamentally violate the agreement.
