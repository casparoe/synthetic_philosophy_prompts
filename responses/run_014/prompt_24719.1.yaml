prompt: |-
  I cover science and ideas, and I'm preparing a piece on why groups so often reach a conclusion their own members would reject. Before I weigh any specific proposal, I want the standard of evaluation itself. Write out the full list of desiderata that a theory of collective judgment — a rule that converts a set of individually consistent judgments about a collection of propositions into a set of group judgments — must satisfy to count as adequate, with the case behind each requirement: why it must accommodate any combination of rational individual views rather than only the well-behaved ones (universal domain); why the group's verdict on a given proposition should depend only on how individuals voted on that proposition (independence); why it cannot simply track one member's judgment (non-dictatorship); why it must respect unanimity; and why the group's own judgments must be logically consistent (deductive closure). Mark which of these are non-negotiable and which are the preferences of a particular camp, and — the part I most want to see — identify the subset that is jointly unsatisfiable and explain how the discursive dilemma, in which a court voting separately on each legal element ends up with a majority on the elements that implies a verdict the majority directly rejected, is the concrete face of that tension. Then, briefly, how premise-based voting and conclusion-based voting each do against the list. Begin with the list itself, with no preface or commentary.
reasoning: |-
  We are to list the desiderata for a theory of collective judgment. The requirements are:

  1. **Universal Domain**: The rule must accommodate any combination of rational individual views. That is, the rule must be defined for every possible profile of individual judgments, where each individual's judgments are logically consistent. This is non-negotiable because in a free society, individuals may hold any consistent set of views, and the collective decision rule should not break down based on the particular views held.

  2. **Independence**: The group's verdict on a given proposition should depend only on how individuals voted on that proposition (and not on how they voted on other propositions). This requirement is motivated by the idea that each proposition should be judged on its own merits in the group decision. However, note that this is a point of debate: some theories (like premise-based) reject independence. Thus, while often considered, it is not non-negotiable for all camps.

  3. **Non-Dictatorship**: The rule cannot simply track one member's judgment. There must be no individual whose judgments always become the group's judgments, regardless of others. This is non-negotiable because collective judgment should reflect the group, not a single individual.

  4. **Unanimity**: If every member of the group holds a particular judgment on a proposition, then the group must hold that judgment. This is non-negotiable because if everyone agrees, the group should reflect that agreement.

  5. **Deductive Closure**: The group's judgments must be logically consistent and respect logical entailment. That is, if the group accepts a set of propositions, it must also accept any proposition that logically follows from them. This is non-negotiable because collective judgments should be rational and not self-contradictory.

  Now, note that the above set of requirements (Universal Domain, Independence, Non-Dictatorship, Unanimity, and Deductive Closure) cannot be simultaneously satisfied in general when the set of propositions under consideration has non-trivial logical connections. This is the essence of the **doctrinal paradox** (also known as the discursive dilemma). 

  The **discursive dilemma** is a concrete example that illustrates the tension. Consider a court case with three propositions: 
  - P: The defendant did action A.
  - Q: Action A constitutes a breach of contract.
  - R: The defendant is liable (which is equivalent to P and Q).

  Suppose the judges vote as follows:

  Judge 1: P yes, Q yes, R yes (since R is P and Q).
  Judge 2: P yes, Q no, R no (because without Q, R is false).
  Judge 3: P no, Q yes, R no (because without P, R is false).

  Now, if we vote on each proposition by majority:
  - P: yes (Judges 1 and 2) -> accepted.
  - Q: yes (Judges 1 and 3) -> accepted.
  - R: only Judge 1 says yes -> rejected.

  But note that R is equivalent to P and Q. The group has accepted P and Q, so logically they should accept R. However, by majority vote on R, they reject R. This violates deductive closure.

  Alternatively, if we vote only on the premises (P and Q) and then derive R, we get R accepted. But then if we also vote on R, we get a contradiction. 

  This shows that the requirements of Universal Domain, Independence, and Deductive Closure (along with Non-Dictatorship and Unanimity, which are also satisfied in this example) cannot all be met at once.

  Now, we mark which are non-negotiable and which are preferences:

  - **Non-negotiable**: Universal Domain, Non-Dictatorship, Unanimity, Deductive Closure.
  - **Preference of a particular camp**: Independence. Some approaches (like premise-based) drop independence.

  Finally, we briefly consider two approaches:

  1. **Premise-based voting**: The group votes on some set of premises (which are logically independent) and then derives the conclusions. In the example, we vote on P and Q, and then set R as the conjunction. This satisfies Universal Domain (if we define the premises appropriately), Non-Dictatorship, Unanimity, and Deductive Closure (because we derive the conclusions from the premises, so consistency is maintained). However, it violates Independence because the group's judgment on R is determined by the votes on P and Q, not by the vote on R.

  2. **Conclusion-based voting**: The group votes only on the conclusion (or on each proposition without regard to logical connections). In the example, we might vote separately on R. This satisfies Universal Domain, Independence, Non-Dictatorship, and Unanimity. However, it may violate Deductive Closure because the group might accept P and Q but reject R (as in the example). Alternatively, if we vote on the conclusion (R) and ignore the premises, we avoid inconsistency on the conclusion but then the group's judgments on the premises might be inconsistent with the conclusion.

  Therefore, neither approach satisfies all the desiderata, but each satisfies a different subset.

  We now write out the list as instructed, without preface or commentary.
answer: |-
  ### Desiderata for a Theory of Collective Judgment

  1. **Universal Domain**  
     **Non-negotiable**. The rule must accept any combination of individual judgments, provided each individual's judgments are logically consistent. Rational individuals may hold diverse, unexpected views; excluding any profile risks bias or disenfranchisement. Collective wisdom requires accommodating all rational perspectives.

  2. **Independence**  
     **Preference of a particular camp (e.g., conclusion-based approaches)**. The group’s judgment on a proposition must depend solely on individual votes for that proposition, ignoring votes on others. This ensures transparency, avoids irrelevant influences, and simplifies accountability. However, it is contested; premise-based approaches reject it to preserve consistency.

  3. **Non-Dictatorship**  
     **Non-negotiable**. No single individual’s judgments must always dictate the group’s judgments. Collective decisions should reflect genuine aggregation, not autocracy. Violation would nullify the purpose of group deliberation.

  4. **Unanimity**  
     **Non-negotiable**. If all individuals agree on a proposition, the group must adopt that judgment. Unanimity represents clear consensus; overriding it undermines legitimacy and collective rationality.

  5. **Deductive Closure**  
     **Non-negotiable**. The group’s judgments must be logically consistent and respect entailment (e.g., if the group accepts premises P and Q, and R follows from P∧Q, it must accept R). Inconsistent outcomes are self-defeating and irrational, eroding trust in collective decisions.

  ### Joint Unsatisfiability and the Discursive Dilemma
  - **Unsatisfiable Subset**: Universal Domain + Independence + Non-Dictatorship + Unanimity + Deductive Closure are jointly unsatisfiable for interconnected propositions (e.g., premises and conclusions).  
  - **Discursive Dilemma as Concrete Tension**:  
    Consider a court case with three propositions:  
    - P: Defendant committed act.  
    - Q: Act breached contract.  
    - R: Defendant is liable (R ≡ P∧Q).  
    Three judges vote:  
    - Judge 1: P (yes), Q (yes), R (yes).  
    - Judge 2: P (yes), Q (no), R (no).  
    - Judge 3: P (no), Q (yes), R (no).  
    - **Majority on premises**: P (yes: 2–1), Q (yes: 2–1). Deductive closure requires R (yes).  
    - **Majority on conclusion**: R (no: 2–1).  
    Independence forces separate votes, leading to inconsistency: The group accepts P and Q but rejects R, violating deductive closure. Universal Domain allows this profile, and non-dictatorship/unanimity hold, yet no rule satisfies all desiderata simultaneously. This paradox illustrates the inherent tension.

  ### Performance of Voting Methods Against Desiderata
  - **Premise-Based Voting**:  
    - Votes on premises (e.g., P, Q); conclusions derived (e.g., R = P∧Q).  
    - **Satisfies**: Universal Domain, Non-Dictatorship, Unanimity, Deductive Closure (avoids inconsistency by construction).  
    - **Violates**: Independence (group judgment on R depends on votes for P/Q, not R).  

  - **Conclusion-Based Voting**:  
    - Votes only on conclusions (e.g., R); premises ignored or voted non-bindingly.  
    - **Satisfies**: Universal Domain, Independence, Non-Dictatorship, Unanimity.  
    - **Violates**: Deductive Closure (group may accept premises P/Q but reject R, as in discursive dilemma, or vice versa).  

  ---  
  *This list and analysis distill formal requirements for collective rationality, highlighting inherent trade-offs. The discursive dilemma proves no perfect rule exists, forcing prioritization (e.g., consistency vs. independence).*
