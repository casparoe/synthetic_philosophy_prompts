  The procedure will consist of a fixed sequence of questions. Each question will probe a critical assumption that the control measure depends on. We will consider at least the following assumptions:

  1. **Detectability**: Is the misalignment or dangerous behavior detectable by the mechanism?
  2. **Awareness**: Does the model know it is being monitored, and might it alter its behavior under observation?
  3. **Robustness of the Monitor**: Is the monitoring mechanism itself capable enough and hard to game? (This includes cases where another AI is used as the monitor.)
  4. **Capability Scaling**: Does the measure hold at the capability level we deploy at, not just at the tested level?
  5. **Incentive Effects**: Does deploying the measure create new incentives for the model to deceive, hide, or acquire power?

  We may add other assumptions as needed.

