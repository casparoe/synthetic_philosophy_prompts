  1. **Question 1: Detectability**  
     - *Question*: Can the proposed mechanism detect the misalignment or dangerous behavior in all relevant scenarios?  
     - *Sufficient Answer*: The mechanism must be able to detect the behavior even when the model is actively trying to hide it, and the detection must not rely on the model being aligned.  
     - *If not*: This measure fails the detectability assumption.

  2. **Question 2: Awareness**  
     - *Question*: Is the model aware of the monitoring? If so, might it alter its behavior to avoid detection?  
     - *Sufficient Answer*: The measure must account for the model's awareness and still be effective even if the model tries to evade. If the model is not aware, that is acceptable.  
     - *If not*: This measure fails the awareness assumption.

  3. **Question 3: Robustness of the Monitor**  
     - *Question*: Is the monitoring mechanism itself robust against gaming by a misaligned model?  
     - *Sufficient Answer*: The monitor must be more secure, reliable, and harder to deceive than the target model. If the monitor is an AI, it must be more aligned or have stronger controls.  
     - *If not*: This measure fails the robustness assumption.

  4. **Question 4: Capability Scaling**  
     - *Question*: Does the measure remain effective when the target model is scaled to higher capabilities?  
     - *Sufficient Answer*: The measure must be designed to work at the intended deployment capability level and not just at the level tested. There must be evidence or reasoning that it is robust to scaling.  
