  ### Induction Squeeze: Classroom Activity Design  
  **Objective:** Students experience the core tension of induction—unavoidable projection, underdetermination of rules by data, and the role of human habits in rule selection—without relying on lecture or textbook examples.  

  **Materials List (Cheap & Classroom-Available):**  
  - **Thermochromic beads** (green at room temp, turn blue when warmed): 20 beads (available online or at craft stores; ~$10 for 100).  
  - **Small envelopes**: 6 envelopes (one per group).  
  - **Index cards**: 30 cards (10 pre-printed with "GREEN", 6 blank for predictions, 6 for rival rules, 6 for outcomes, 2 for instructor).  
  - **Tokens for betting**: Poker chips, paper clips, or sticky notes (100+ total; each group starts with 10).  
  - **Timers**: 1 classroom timer or phone.  
  - **Warm water bath** (or student hands) to heat beads.  
  - **Whiteboard/markers** for recording rules/bets.  
  - **Thermos** (to keep water warm if needed).  

  **Setup (5 Minutes Before Class):**  
  - Place 10 "GREEN" cards face-up on a table ("past data").  
  - Place 6 thermochromic beads in a bowl (room temp, green).  
  - Fill thermos with warm water (~40°C, enough to turn beads blue).  
  - Prepare 6 sealed envelopes: Each contains one blank card (for future bead outcome).  

  ---

  ### Activity Timeline (75 Minutes Total)  
  #### **Phase 1: Introduction & First Prediction (10 Minutes)**  
  - **Instructor Script (0:00–0:05)**:  
    > "We’ll play a prediction game. Here are records from past tests: 10 beads, each green at room temperature. *(Show "GREEN" cards.)* Now, we’ll test a new bead. Predict its room-temperature color when we check at 3:20 PM. Bet tokens on your prediction. Each group starts with 10 tokens. You can bet 0–5 tokens. If right, you win double your bet; if wrong, you lose your bet."  

  - **Group Work (0:05–0:10)**:  
    - Groups (3 students each, 6 groups total) discuss and write predictions on a blank card: "GREEN" or "BLUE".  
    - Place bets (tokens) in group envelope.  
    - **Outcome**: All groups predict "GREEN" and bet max tokens (human nature to project).  

  #### **Phase 2: Manufacturing Rival Hypotheses (20 Minutes)**  
  - **Instructor Script (0:10–0:15)**:  
    > "Now, create a rival rule that fits all past data but predicts something different for future beads. Use this template: *'All beads are [COLOR] when tested before 3:20 PM, and [DIFFERENT COLOR] when tested at/after 3:20 PM.'* Your rival must fit the 10 green records and contradict your prediction."  

  - **Group Work (0:15–0:25)**:  
    - Groups create rival rules (e.g., "All beads are GREEN before 3:20 PM, BLUE after").  
    - Write rules on cards. Groups swap rules with another group to verify: "Does this fit the past data?" (All will say yes—past records are all pre-3:20 PM and green).  
    - Groups adjust bets if desired (e.g., reduce "GREEN" bet, add tokens to "BLUE").  

  - **Critical Moment**: Groups call rivals "cheating" but can’t define why without assuming their preferred rule is "natural". Instructor notes this.  

  #### **Phase 3: Testing & Stakes (15 Minutes)**  
  - **Instructor Script (0:25–0:30)**:  
    > "Time to test! Remember: We care about room-temperature color. At 3:20 PM, I’ll place one bead in warm water. After 30 seconds, we’ll observe its color at room temperature."  

  - **Test (0:30–0:35)**:  
    - Place bead in warm water (turns blue).  
    - Remove, let it cool to room temp (reverts to green; ~1–2 minutes).  
    - **Outcome**: Room-temp color is GREEN (fixed by physics).  
    - Settle bets: Groups that bet "GREEN" win tokens; "BLUE" lose.  

  #### **Phase 4: Entrenchment Challenge (15 Minutes)**  
  - **Instructor Script (0:35–0:40)**:  
    > "New task: Predict the next number in this sequence: 2, 4, 6, 8, 10. *(Write on board.)* Rule A: ‘Even numbers’ (predicts 12). Rule B: *‘Numbers are even until 3:40 PM, then odd’* (predicts 11). Both fit the past data. But—Rule A has been used 40 times this term (e.g., in quizzes); Rule B is new. Bet tokens again. Justify why you prefer Rule A without calling it ‘real’."  

  - **Group Work (0:40–0:50)**:  
    - Groups bet tokens on Rule A (12) or Rule B (11).  
    - **Key Prompt**: "Write a one-sentence justification for preferring Rule A. You cannot use: ‘It’s true,’ ‘It’s natural,’ or ‘Rule B is fake.’"  
    - Reveal "outcome" from a sealed envelope: "12" (Rule A "correct").  

  #### **Phase 5: Debrief (15 Minutes)**  
  - **Map Experiences to Induction Problem (0:50–1:05)**:  
    - **Projection (a)**: "You all predicted GREEN for the bead and 12 for numbers—you couldn’t *not* project the past. Even when rivals existed, most of you stuck with your first bet."  
    - **Underdetermination (b)**: "Your rival bead rules fit all past data perfectly, just like your rule. The data didn’t pick a winner—only the test did. Same for the number rules."  
    - **Human Habits (c)**: "For the numbers, the only difference was that Rule A was ‘entrenched’—used 40 times. But your justifications (‘it’s simpler’, ‘it worked before’) assumed Rule A was special. That’s about *us*, not the world. Hume’s point: What feels ‘natural’ is custom."  
    - **Connect to Grue**: "Your rivals were like ‘grue’—they fit all data until a arbitrary point (3:20 PM). But calling them ‘cheating’ required assuming your rule was better. That assumption? Also custom."  

  ---

  ### Predictable Problems & Mitigation  
  1. **"Rivals Are Ad Hoc = Knockdown Argument"**:  
     - Groups will dismiss rivals as "artificial". **Mitigation**: Press them: "What makes your rule *not* ad hoc? Can you define ‘ad hoc’ without your rule?" Highlight this in debrief.  

  2. **Gaming Tokens**:  
     - Some groups may bet minimally to "hedge". **Mitigation**: Praise this as rational, but note: "You still *wanted* to bet on your rule—projection is automatic."  

  3. **Entrenchment Asymmetry (Activity Limitation)**:  
     - **Problem**: In the room, all rules feel equally new. The "40 uses" asymmetry is asserted, not felt.  
     - **Mitigation**: Explicitly state: "Outside this activity, ‘green’ is entrenched in our language. Here, I’m *telling* you Rule A was used 40 times—but you don’t feel its weight. That’s the point: Entrenchment isn’t in the data; it’s in our history."  

  ---

  ### Instructor Notes  
  - **Load-Bearing Bits Preserved**:  
    - Real stakes (tokens), in-session resolution (bead test), student-made rivals, entrenchment discussed.  
    - Thermochromic beads make the "flip" real and memorable—rivals aren’t just consistent; they’re physically possible until tested.  
  - **Honest Limitations**:  
    - The bead outcome is fixed (green reverts), but students may distrust the reversion. **Solution**: Test a bead pre-activity to prove reversibility.  
    - Entrenchment can’t be felt; it must be narrated. No workaround—this asymmetry requires instructor framing.  
  - **No Names/Textbooks**: Debrief uses only activity events (e.g., "When Group 3 said their rival was ‘cheating,’ what did they assume?").  

  **Why This Works**: Students build the puzzle—creating rivals exposes the underdetermination squeeze. The physicality of the bead test (green→blue→green) forces confrontation with the gap between data and rules. Tokens make the stakes visceral, not abstract.
