  The Valentini point is actually crucial. If nonlocality were merely epistemic, breaking quantum equilibrium wouldn't enable signaling. But it does - meaning the dependence is physical. The user brushes this off as "preparation being epistemic", but that misses the physics. Quantum equilibrium is a dynamical state, not just ignorance. 

