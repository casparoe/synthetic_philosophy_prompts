  So the user's misstep is in step 1 - assuming hidden variables must be epistemic. But in pilot-wave, they're not. That's the root of the mutual talking-past. The rest follows from that initial category error.
answer: |-
  Your inference breaks at the **assimilation of hidden variables to quantities we are merely ignorant of** (step 1). This misstep cascades through your argument, conflating epistemic constraints with ontological structure. Here's why:

  ### The Core Issue: Ontology vs. Epistemic Access
  1. **Pilot-wave theory is ontological, not epistemic**:  
     Your friend treats the particle positions ("hidden variables") as **physical realities** existing independently of knowledge. The wavefunction (whether "physical field" or "law") governs their dynamics *objectively*. Your characterization reduces them to epistemic unknowns—quantities we "neither know nor control"—but this confuses *practical inaccessibility* with *ontological status*.  
     - **Inaccessibility ≠ Epistemicity**: The inability to measure or control positions *without disturbing the system* (due to quantum equilibrium) does not make them mere subjective ignorance. They are determinate physical properties constrained by dynamics, much like a fluid's molecular positions in classical statistical mechanics.

  2. **"Real but inoperative" is physical, not descriptive**:  
     Nonlocality is "inoperative" *only under quantum equilibrium*. This is a **dynamical constraint**, not an epistemic one:  
     - Quantum equilibrium is a *physical state* where the configuration distribution matches \(|\psi|^2\).  
     - Valentini's result proves this is fundamental: **Out-of-equilibrium systems would manifest measurable nonlocal signaling and violate uncertainty**.  
     - Your claim that "preparation is epistemic" misses the point: Preparation determines the *physical state* (equilibrium or not). If you *could* prepare non-equilibrium (a physical act), nonlocality would have observable consequences. The dependence isn't on "knowledge" but on the *objective dynamical state*.

  ### Where Your Inference Fails
  | Your Argument Step | Why It Fails |
  |-------------------|-------------|
  | **"Hidden variables are quantities we are ignorant of"** | Assumes an epistemic interpretation pilot-wave rejects. Positions are real, physical, and dynamically constrained. |
  | **"Nonlocality depends on preparability (epistemic)"** | Preparability determines physical state (equilibrium/non-equilibrium). Nonlocality's operational silence is a *consequence of dynamics*, not description. |
  | **"Bell shows only signal locality fails epistemically"** | Bell's theorem assumes no fine-tuning of hidden variables. Pilot-wave satisfies this *physically* via dynamical equilibrium—not epistemically. |

  ### Key Clarifications
  - **The wavefunction as "law"**: If the wavefunction is a law, it still **physically relates distant particles** (like a gravitational field). Calling it a "law" doesn't demote it to a mere description; it remains part of physical causation.
  - **Valentini's result supports nonlocality**: It demonstrates that nonlocality isn't hidden by *ignorance* but by a *physical mechanism* (equilibrium dynamics). Breaking the mechanism reveals causal influence.
  - **Bell's theorem**: Pilot-wave evades it **not epistemically** but via explicit, *dynamical* nonlocality constrained by equilibrium. Bell’s conclusion—that *any* theory matching QM must be nonlocal—stands.

  ### Conclusion
  Your friend isn't conflating terms; you are imposing an epistemic lens on an ontological theory. **Pilot-wave's nonlocality is physical, not descriptive**:  
  - The particle positions are real and nonlocally coupled.  
  - Quantum equilibrium is a physical (not epistemic) state suppressing measurable consequences.  
  - Valentini shows this suppression is dynamical: non-equilibrium would reveal superluminal influence.  

  Thus, Bell's theorem *does* establish physical nonlocality: any theory replicating quantum correlations must either abandon locality (like pilot-wave) or accept fine-tuning (e.g., superdeterminism). Your argument breaks at the assimilation of hidden variables to epistemic unknowns—a move pilot-wave explicitly rejects. The disagreement stems from your framing of inaccessibility as ontological unreality, while your friend treats it as a dynamical constraint on real entities.
