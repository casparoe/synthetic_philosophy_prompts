prompt: |-
  I teach moral philosophy, so philosophy of medicine is a bit outside my lane, but a student in office hours gave me a rundown of the health/disease debate and I want to know how much of it to trust before I repeat any of it. Her summary went roughly like this: naturalism, going back to Boorse, says disease is nothing but statistical deviation from species-typical biological functioning, so on the naturalist view an elite athlete or someone with an unusually high IQ would literally count as diseased, since those are deviations from the norm too. Normativism, meanwhile, is the view that disease is just whatever a society judges undesirable, so a normativist has to accept that baldness or shyness or aging could become diseases by consensus, with no fact of the matter beyond that. And since naturalism supposedly can't make any sense of why doctors treat things and patients complain about things — that being the whole evaluative point of medicine — she concluded the debate is basically settled and normativism won. My instinct is that several steps here are off, but I dont know the literature well enough to say where. Go claim by claim: which parts would a defender of the biostatistical theory accept, where is a modest thesis being inflated into something the view doesn't say, what do normativists actually commit themselves to (is "whatever society decides" their view or a caricature of it), and does the conclusion follow from whatever parts survive? She also made a point about how the naturalist is forced to treat a beneficial deviation — say, unusual resistance to a local pathogen — as pathological, and I'm curious whether that's a real problem for the view or just a confused example.
reasoning: |-
  Okay, the user teaches moral philosophy and had a student explain the health/disease debate in philosophy of medicine. The student summarized naturalism (Boorse's biostatistical theory) and normativism, concluding normativism wins because naturalism has absurd implications and can't account for medicine's evaluative aspect. The user suspects issues in the summary but lacks expertise to pinpoint them.

  First, I need to recall Boorse's actual biostatistical theory. Boorse defines disease as a statistically subnormal part-function relative to the species' reference class, focusing on biological function, not just deviation. The student's claim that elite athletes or high IQ would be considered diseased is a misrepresentation because those are above-average functions, not subnormal. Boorse clearly distinguishes between superior function (health) and dysfunction (disease). 

  Next, the student's portrayal of normativism as "whatever society judges undesirable" is an oversimplification. Normativists like Engelhardt or Reznek emphasize that disease judgments involve value-laden concepts but don't reduce entirely to social consensus. They allow for objective components, such as biological dysfunction, but argue that calling it a disease requires a value judgment about harm. The caricature ignores this nuance.

  The student also argued that naturalism can't explain why doctors treat certain conditions, but Boorse addresses this by separating the biological fact of dysfunction from the social response. Medicine involves both scientific judgment and values. So the naturalist can acknowledge that while dysfunction is objective, the decision to treat depends on societal values.

  The beneficial deviation example (unusual pathogen resistance) is another misstep. Boorse's theory requires subnormal function, so enhanced resistance is superior function, not pathological. This isn't a problem for naturalism.

  The user's deeper needs might include ensuring they don't misinform students, understanding the debate's nuances for their teaching, and addressing the student's confident but flawed argument. They might also want to bridge moral philosophy with this applied ethics topic, showing how values interact with biological facts.

  I should clarify where the student's summary goes wrong: misstating naturalism's deviation as any statistical difference (ignoring subnormality and functional reference), oversimplifying normativism to pure consensus, and missing naturalism's separation of dysfunction from treatment decisions. The conclusion that normativism won is premature; both sides have ongoing support, and hybrid approaches exist.

  Highlighting key scholars (Wakefield, Murphy) and suggesting readings (Schramme, Cooper) can help the user explore further. Emphasizing that the debate isn't settled but involves sophisticated arguments on both sides would correct the student's conclusion.
answer: |-
  Your instinct is spot-on—the student's summary contains several significant misrepresentations and overstatements of both naturalism and normativism. Let's break this down claim-by-claim, referencing key figures (Boorse, Wakefield, Engelhardt, etc.) and the current state of the debate:

  ### 1. **Naturalism (Boorse's Biostatistical Theory - BST):**
      - **Student's Claim:** Naturalism defines disease as *any* statistical deviation from species-typical functioning (so elite athletes/high IQ = "diseased").  
      - **Reality:** This is a **gross misrepresentation**. Boorse explicitly defines disease as **statistically *subnormal* part-function relative to a reference class** (age, sex, species).  
        - *Defender's Response:* BST focuses on **biological dysfunction**, not mere deviation. Elite athletes exhibit *superior* (not subnormal) functioning. High IQ isn't a dysfunction—it's enhanced cognitive performance. BST *only* labels statistically subnormal functional efficiency as pathology.  
        - *Example Fix:* A mutation causing immunity to a pathogen would be **supernormal function**, not disease. Boorse accepts this as healthy variation.

      - **Student's Claim:** Naturalism can't explain why doctors treat things/patients complain.  
      - **Reality:** Boorse **explicitly separates** "disease" (biological dysfunction) from "illness" (socially disvalued state).  
        - *Defender's Response:* Medicine *does* have an evaluative layer (treating "illnesses"), but BST provides an objective *foundation* for pathology. Doctors treat dysfunctions *because* society deems them harmful—BST doesn't deny values in clinical practice; it denies they define disease *ontologically*.

  ### 2. **Normativism:**
      - **Student's Claim:** Normativism = "disease is whatever society judges undesirable."  
      - **Reality:** This is a **caricature**. Sophisticated normativists (e.g., Engelhardt, Reznek, Cooper) argue disease has an *irreducible* evaluative component, but **not** that it's *arbitrary* consensus.  
        - *Key Nuance:* Normativists typically require:  
          - (a) **Biological dysfunction/disadvantage** (e.g., aging involves biological decline).  
          - (b) **Harm/suffering** *as judged by the patient/society* (baldness is only a "disease" if deemed distressing).  
        - *Example:* Normativists *could* accept aging as "disease" if medical interventions reframe it as treatable—but this requires biological criteria (cellular senescence) + social valuation. It's not *mere* consensus without biology.

  ### 3. **The "Beneficial Deviation" Problem:**
      - **Student's Claim:** Naturalism must call beneficial deviations (e.g., pathogen resistance) "diseases."  
      - **Reality:** **False.** BST defines disease as **subnormal function**. Enhanced immunity is *supernormal* function—explicitly **not pathological** for Boorse. The example misunderstands "deviation" as symmetrical, but BST is asymmetrical (only deficits count).

  ### 4. **"The Debate is Settled":**
      - **Student's Claim:** Normativism "won" because naturalism fails to capture medicine's evaluative purpose.  
      - **Reality:** **Highly contested.** Significant defenses of naturalism exist (e.g., Wakefield's "Harmful Dysfunction" hybrid, Murphy's BST updates).  
        - *Key Responses:*  
          - Boorseans argue normativism *collapses* disease into "whatever we dislike," risking medicalization of social problems (e.g., shyness = "Social Anxiety Disorder").  
          - Wakefield's hybrid ("disease = dysfunction + harm") accepts normativism's value component but anchors "dysfunction" in evolutionary biology.  
        - *Current Status:* Naturalism remains influential (especially in psychiatry/DSM debates), though normativism dominates in sociology of medicine. **No consensus exists.**

  ### Where the Summary Goes Wrong:
  1. **Misrepresenting BST:**  
     - Confuses "statistical deviation" with "subnormal function."  
     - Ignores BST's reference classes (prevents labeling sex differences as "diseases").  
     - Falsely claims BST pathologizes superior traits.  

  2. **Oversimplifying Normativism:**  
     - Reduces it to radical social constructivism ("whatever society decides").  
     - Ignores that most normativists require *biological dysfunction + harm*.  

  3. **Misdiagnosing the "Treatment" Problem:**  
     - BST *accommodates* medicine's evaluative role via the disease/illness distinction.  

  4. **Overstating the Outcome:**  
     - The debate is **live and nuanced**—not settled. Hybrid theories (Wakefield) are major players.

  ### Recommended Clarifications for Your Student:
  - **To Naturalism:** "BST defines disease as *subnormal biological function*—not just deviation. Elite athletes aren't 'diseased'; they're statistical outliers in *positive* ways."  
  - **To Normativism:** "Normativists argue values are essential to *labeling* a dysfunction a 'disease,' but they typically require biological evidence of dysfunction, not just social dislike. Baldness is only a 'disease' if framed as a medical problem *and* tied to biological pathology."  
  - **On the Debate:** "Philosophers still debate whether disease is purely biological (Boorse), biological + harmful (Wakefield), or socially constructed (Engelhardt). No single view has 'won.'"

  ### Key Sources for Context:
  - **Boorse (1977):** "Health as a Theoretical Concept" (original BST).  
  - **Wakefield (1992):** "The Concept of Mental Disorder" (Harmful Dysfunction hybrid).  
  - **Cooper (2002):** "Disease" (normativist critique).  
  - **Schramme (ed.) (2020):** *Handbook of the Philosophy of Medicine* (current overview).

  This is a rich, evolving debate—your student captured common oversimplifications but missed crucial nuances. Your skepticism is well-founded!
