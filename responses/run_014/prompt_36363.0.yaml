prompt: |-
  I've been trying to work out when people count as doing something *together* versus just doing similar things at the same time, going off my gut on cases, and I can't find the principle. Maybe you can.

  My neighbors and I agreed in advance to repaint the shared fence last Saturday, split it down the middle, that's obviously a joint action. Two strangers who both lunge for the same runaway suitcase at the airport and end up steadying it between them -- coordinated, mutually responsive, but my gut says they're not doing anything together, they're both just grabbing a suitcase. One person starts clapping at the end of a gig and the whole room joins in over about two seconds, no plan, most of them didn't even look around that carefully -- but this feels like a collective act in a way the suitcase thing doesn't. A flash mob where every participant memorized their instructions from a video and none of them have ever met or spoken: together, obviously. Two chess players are doing something together even though their goals are strictly opposed -- they're jointly playing a game, not jointly trying to win it. Everyone panic-selling in a market crash, each deciding alone: one movement, but not a joint action. Two labs independently running the same experiment because they both read the same paper: not together. A mob spontaneously smashing shop windows after a lost final -- no agreement, no leader, and yet I want to say the mob did it, not just each individual did their own window.

  So agreement seems neither necessary (ovation, mob) nor sufficient?? -- two roommates who both independently and secretly decide to freeze out a third roommate have matching plans but no, that's not a joint action, they're just coincidentally snubbing in unison. And the chess thing messes up anything about a "shared goal" -- whatever they share it isn't the goal.

  Is there one account that gets all of these? If not, tell me which verdicts to throw out and why. And whatever principle you land on, I want to know what it says about the case I keep flip-flopping on: the two roommates find out about each other's snubbing halfway through, neither says anything, and they both keep doing it, each now aware of the other -- does it become joint at that point, and if so, what exactly got added?
reasoning: |-
  Okay, let me try to unpack this user's query. They're struggling to distinguish between joint actions and coincidental individual actions. They provided multiple examples, each with their own nuances. 

  First, I need to analyze each case they mentioned. The fence painting involves explicit agreement, so that's clearly joint. The strangers grabbing a suitcase have coordination but no shared intention—they're both acting individually. The concert ovation is interesting because it's spontaneous yet collective. Flash mobs have pre-planned coordination without direct communication. Chess players have a shared framework but opposing goals. Panic sellers act individually, while the riot feels collective despite no leader. 

  The snubbing roommates case is tricky. Initially separate, but when they become aware and continue, does that create joint action? The user seems particularly stuck here. 

  I recall theories like Bratman's shared cooperative activity, which requires mutual responsiveness and commitment to joint action. Gilbert's joint commitment theory emphasizes mutual obligations. Tuomela's we-intentions focus on collective mindset. 

  For the roommates, awareness alone might not suffice without mutual acknowledgment. If they both know and continue without objecting, it could imply tacit agreement. But is that enough? Maybe a minimal shared intention forms when each recognizes the other's action and adjusts accordingly, even silently. 

  The key factors seem to be mutual responsiveness and the presence of a "we-mode." In the suitcase case, they respond to each other but lack a collective goal. The ovation works because individuals align with the emerging group behavior. The riot might involve a shared emotional drive transforming individual acts into collective ones. 

  The user might need a spectrum or multiple criteria rather than a binary distinction. Some cases are clear-cut, others borderline. For the roommates, the transition happens when awareness leads to mutual reinforcement of intentions, creating a de facto joint plan.
answer: |-
  You've hit on a profound philosophical puzzle about collective intentionality. There isn't a single universally accepted principle, but the most compelling accounts (drawing on philosophers like Michael Bratman, Margaret Gilbert, and Raimo Tuomela) focus on **interlocking intentions and mutual responsiveness within a shared framework**. Here's a framework that handles your cases, followed by the verdict on the roommates:

  **The Core Principle: Shared Agency as "We-Intention + Mutual Responsiveness"**

  1.  **"We-Intention" (Collective Goal/Commitment):** At least some participants must frame their action *as part of a joint endeavor*, even if minimally. This doesn't require identical goals (like winning in chess) or explicit agreement, but an understanding that *we* are doing X *together* in some shared context (playing a game, clapping as an audience, rioting as a mob).
  2.  **Mutual Responsiveness (Coordination/Adjustment):** Participants must be responsive *to each other* in performing the action, adjusting their behavior based on the perceived actions or intentions of others *within the shared context*. This responsiveness is guided by the "we-intention."
  3.  **Shared Framework/Context:** This provides the background against which "we-intention" and mutual responsiveness make sense (e.g., the rules of chess, the convention of applause at a gig, the emergent group dynamic of a mob).

  **Applying the Principle to Your Cases:**

  1.  **Fence Painting (Joint Action):**
      *   *We-Intention:* Explicit agreement establishes "We are repainting the fence together."
      *   *Mutual Responsiveness:* They coordinate splitting the work, timing, paint color, etc.
      *   *Shared Framework:* The agreement and shared property.

  2.  **Suitcase Grab (NOT Joint Action):**
      *   *We-Intention?* Each intends "I am grabbing the suitcase to stop it." There's no "we are steadying it together" intention formed. It's individual goals coinciding.
      *   *Mutual Responsiveness?* Yes, but reactively, based on physics and immediate obstacle avoidance, *not* guided by a shared intention to act jointly. They respond to the *suitcase* and the *other as an obstacle/force*, not as a co-agent in a joint task.
      *   *Shared Framework?* Lacking. They are strangers with purely individual goals.

  3.  **Concert Ovation (Joint Action):**
      *   *We-Intention:* Individuals join in *because others are clapping*, intending to participate *as part of the audience's collective appreciation*. "We are applauding the performer" emerges.
      *   *Mutual Responsiveness:* People adjust their clapping timing/intensity to match the emerging group rhythm. They look around to see if others are joining.
      *   *Shared Framework:* The social convention of applause at performances creates the context for collective intention to form spontaneously.

  4.  **Flash Mob (Joint Action):**
      *   *We-Intention:* Each intends "I am performing my part *of the flash mob*" – they act *as a participant in the pre-defined collective act*.
      *   *Mutual Responsiveness:* They synchronize based on the plan, likely responsive to cues like a starting signal or the actions of others as per the script.
      *   *Shared Framework:* The pre-distributed instructions define the joint action framework.

  5.  **Chess Players (Joint Action):**
      *   *We-Intention:* Each intends "We are playing a game of chess together." The shared goal is *playing the game by the rules*, not winning individually.
      *   *Mutual Responsiveness:* Players are intensely responsive to each other's moves within the rules, adjusting strategy based on the opponent's actions *as part of the game*.
      *   *Shared Framework:* The rules and conventions of chess.

  6.  **Panic Selling (NOT Joint Action):**
      *   *We-Intention?* Each intends only "I am selling my stocks to avoid loss." No "we are crashing the market" or "we are selling together" intention.
      *   *Mutual Responsiveness?* No. Each acts based on market data/news, *not* in direct response to the specific selling actions of others *as co-agents*. They react to the *aggregate effect* (price), not individuals.
      *   *Shared Framework?* Lacking a collective intention. They share a situation and individual goals, not a joint project.

  7.  **Independent Labs (NOT Joint Action):**
      *   *We-Intention?* Each lab intends "We (our lab) are running the experiment." There is no intention regarding the *other lab* as part of a joint endeavor.
      *   *Mutual Responsiveness?* None. They act completely independently.
      *   *Shared Framework?* A shared scientific question, but no framework for *joint action* between them.

  8.  **Rioting Mob (Joint Action - Borderline but fits):**
      *   *We-Intention:* An emergent sense of "We are smashing things/rioting *together*" often develops through shared emotion and seeing others act. Individuals act *as part of the mob*.
      *   *Mutual Responsiveness:* People egg each other on, copy actions, move together, respond to the group's energy and direction. Actions are amplified and shaped by the presence and actions of others within the mob.
      *   *Shared Framework:* The shared event (lost final), intense shared emotion, and the emergent group identity ("the mob") create a context for collective intention.

  9.  **Coincidental Snubbing (NOT Joint Action):**
      *   *We-Intention?* Each intends "I am freezing out the roommate." No "we are freezing them out" intention exists initially.
      *   *Mutual Responsiveness?* None. Each acts based solely on their own private plan.
      *   *Shared Framework?* Lacking a shared intention or coordinated action framework.

  **The Roommate Snubbing Case (Awareness Added):**

  *   **Initial State:** As above, NOT joint action (coincidental individual acts).
  *   **After Mutual Awareness:** This **becomes a form of minimal joint action**.
      *   *What Changes?* The **formation of a tacit "We-Intention" and Mutual Responsiveness.**
      *   *We-Intention:* Each roommate, upon becoming aware of the other's identical action and intention, *and continuing without objection*, likely develops a new intention: "We are freezing out the third roommate *together*" or at least "I am freezing them out *as part of this now-shared effort* with the other roommate." Their individual intentions become interlocked and mutually referential.
      *   *Mutual Responsiveness:* Awareness fundamentally changes their responsiveness. Each now acts *in light of the other's confirmed participation*.
          *   They might intensify or subtly coordinate their snubbing.
          *   They might avoid actions that would undermine the other's snubbing.
          *   They rely on the other to continue, reinforcing their own commitment.
          *   Their continuation *after awareness* signals mutual acknowledgment and participation in the *de facto* joint plan.
      *   *Shared Framework:* The situation itself (the presence of the third roommate, their shared living arrangement, the mutual discovery of identical intentions) provides the context. Their silence and continued action constitute a tacit agreement within this framework.

  **In essence, mutual awareness transforms coincidental individual actions into a *tacitly coordinated joint action*.** What gets added is the **interlocking of intentions** (each now acting *in part because* and *in awareness that* the other is also acting with the same goal) and the resulting **mutual responsiveness** within this newly recognized shared context. They transition from two people snubbing in parallel to two people snubbing *collusively*, even without a word spoken.
