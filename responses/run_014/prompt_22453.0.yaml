  We are adjudicating a debate between a philosopher of mind (PoM) and a moral psychologist (MP) on the nature of emotions.

  Move 1: PoM
    Claim: "An emotion is simply a judgment. Anger is the judgment that one has been wronged, and fear is the judgment that one is in danger. ... the case of the person who is angry at someone who has done nothing wrong is just a false judgment."
    Analysis: This is a version of the cognitive theory of emotions. It captures the intentionality (aboutness) of emotions and their connection to action. However, it faces challenges from cases where emotions occur without the corresponding judgment (e.g., phobias) or in non-linguistic creatures (infants). The false judgment explanation for inappropriate anger is a standard move but may not cover all cases.
    Verdict: Partially right, but oversimplified. We'll score it 1 because it has merit but is not without problems.

  Move 2: MP
    Claim: Disgust in infants and phobic fear without belief (e.g., knowing the spider is harmless) show that emotions are not judgments. The phobic case is particularly strong: if the person judges the spider harmless but still feels fear, then fear isn't a judgment. MP argues that in such cases, emotion is more like a perception (misperception) and thus not a judgment.
    Analysis: This is a strong counterexample to the judgment theory. It points to non-cognitive aspects and the possibility of emotional responses without (or contrary to) judgment. However, it doesn't fully address the cognitive content typically associated with emotions.
    Verdict: Strong point, especially the phobia example. Score 2.

  Move 3: PoM
    Claim: MP is smuggling in the normative. Anger is about a normative fact (a wrong), and perceiving a normative fact is making a normative judgment. The feeling is the affective tone, a causal byproduct without representational role (vehicle, not content).
    Analysis: PoM is trying to defend by redefining perception as a form of judgment, which is controversial. Also, the distinction between content and vehicle is important: the judgment is the content, the feeling is the vehicle. But the phobia example still challenges this: the person has the judgment (content) that the spider is harmless, yet the fear (with its own content?) persists. How can the same judgment (that the spider is harmless) not extinguish the fear if fear is that judgment? Also, the claim that the feeling has no representational role might be too strong.
    Verdict: The move is somewhat defensive and doesn't fully address the counterexample. The idea that normative perception is a judgment is not universally accepted. Score 0 (neutral) because it's an attempt but not entirely convincing.

  Move 4: MP
    Claim: Without the feeling, it's not an emotion. A judgment without feeling is a belief. The bodily feeling is the essence of emotion.
    Analysis: This is a somatic theory of emotions (like William James). It emphasizes the bodily feeling. However, it faces the problem of differentiation: how do we distinguish between emotions that have similar physiological profiles? Also, it might neglect the intentionality of emotions.
    Verdict: While the feeling is important, making it the essence ignores the cognitive and intentional aspects. The example of a judgment without feeling being a belief is compelling, but the claim that the feeling is the essence is too strong. Score 0.

  Move 5: PoM
    Claim: If feeling were the essence and without content, we couldn't explain the differences between anger and fear at equal intensity, or why two people can have the same feeling about different things. The feeling is a vehicle, and the content must come from elsewhere.
    Analysis: This is a strong point against pure feeling theories. Emotions have intentional objects and specific content. Two people can both feel intensely, but one is angry and the other afraid. Also, the same physiological feeling (e.g., arousal) might be interpreted as anger or fear depending on context. Therefore, the content (which the judgment theory provides) is necessary.
    Verdict: This is a good point. Score 1.

  Adjudication:

  Move 1 (PoM): 1
    Reason: The judgment theory captures important aspects of emotions (intentionality, evaluative content) but is vulnerable to counterexamples (like phobias).

  Move 2 (MP): 2
    Reason: The examples of disgust in infants and phobic fear effectively challenge the judgment theory. The phobia case is especially strong because the person holds the true judgment but still experiences the emotion.

  Move 3 (PoM): 0
    Reason: The attempt to equate normative perception with judgment is debatable and does not adequately address the phobia example. The separation of feeling (vehicle) and content is a valid distinction, but the response does not fully counter MP's point.

  Move 4 (MP): 0
    Reason: While the feeling is necessary for emotion, making it the essence fails to account for the intentionality and the differentiation between emotions. The example of a judgment without feeling being a belief is correct, but the strong somatic claim is problematic.

  Move 5 (PoM): 1
    Reason: The argument about the need for content to differentiate emotions and to account for the same feeling in different contexts is compelling. It shows that a pure feeling theory is insufficient.

  What both are missing:
  Both parties are missing an integrated view. Contemporary theories (like appraisal theories) combine cognitive and somatic elements: emotions arise from an appraisal (which can be non-conscious and fast) and involve bodily changes and feelings. Also, they might be overlooking the social and cultural dimensions of emotions. Furthermore, the debate doesn't consider the possibility of unconscious emotions or the role of emotions in non-human animals.

  In summary, the judgment theory (PoM) is too intellectualist and cannot account for non-cognitive emotional responses, while the feeling theory (MP) cannot explain the intentionality and differentiation of emotions without cognitive content. A hybrid approach is needed.

