answer: |-
  This is a brilliant stress test for semantic externalism—indeed, **phlogiston exposes deeper tensions than Twin Earth** since it likely never referred to *any* natural kind. Let's break it down step by step, being ruthlessly honest about where the theory struggles.

  ---

  ### **1. Causal-Historical Theory of Reference (Putnam/Kripke)**
  - **Initial Posit (Becher/Stahl):**  
    If reference requires a causal chain linking the term to a real substance, **"phlogiston" never referred**. There was no baptism of a natural kind, no samples to point to—merely a theoretical postulate. Externalism would say the term was **empty from the start** ("reference failure").
    
  - **Priestley's "Dephlogisticated Air":**  
    Here’s the twist: Priestley *was* causally interacting with a real substance (oxygen). But did he redirect the reference?  
    - **No**: His *intention* was to describe "air lacking phlogiston," embedding the term in a false theory. The causal chain traces back to the *empty concept* of phlogiston, not oxygen.  
    - **Yes?**: If reference is fixed by the *substance causing the phenomena* (e.g., reviving flames), then "dephlogisticated air" might latently refer to oxygen. But this strains externalism—it prioritizes causation over intent, risking incoherence.  
    **→ Likely verdict**: "Dephlogisticated air" *also fails to refer*, as it’s defined parasitically on a non-existent kind.  

  - **Post-Lavoisier:**  
    "Phlogiston" is recognized as empty. Any causal chain is severed; the term now refers to **nothing**.  

  **The Core Problem**: Externalism assumes we *can* initiate reference via baptism or causal contact. **Phlogiston never had this**. The "causal chain" was purely *theoretical*, not grounded in reality.  

  ---

  ### **2. Descriptivist Theory (Frege/Russell)**
  - **Initial Stage**:  
    "Phlogiston" refers to whatever satisfies the description: *"the fire-like substance released during combustion."*  
    → **Extension**: Combustion involves *loss* (e.g., wood to ash). Under descriptivism, **phlogiston refers to *whatever is lost***—even if misdescribed.  

  - **Priestley's Stage**:  
    "Dephlogisticated air" = *"air devoid of phlogiston."*  
    → Since phlogiston is defined by its role, the term might *still* refer to the substance satisfying the original description.  

  - **Lavoisier's Revolution**:  
    Descriptivism faces a crisis:  
    - Combustion involves *gaining* oxygen (not losing phlogiston).  
    - The original description *no longer applies to any substance*.  
    → **Result**: The term "phlogiston" becomes empty. Descriptivism *allows reference shift* but only if the description stays fixed—here, it’s falsified.  

  **Weakness**: Descriptivism initially *seems* more flexible but collapses when the core description is proven false.  

  ---

  ### **3. What Phlogiston Reveals About Externalism**
  - **Anomaly, Not Refutation**:  
    Externalism excels at explaining reference to *existing* natural kinds (water, gold). **Phlogiston isn't a counterexample—it's a *different category***: a *theoretical posit* with no real correlate.  

  - **The Unanticipated Gap**:  
    Externalism never aimed to handle "empty" terms robustly. Its machinery (causal chains, baptism) **presumes successful reference**. Phlogiston shows **the theory is silent** on how terms *fail* to refer when embedded in flawed frameworks.  

  - **Principled Handling of Empty Terms?**  
    - **Stipulative Failure**: Externalism’s default: no real kind → no reference. Clean but philosophically unsatisfying.  
    - **Pragmatic Revision**: Some externalists (e.g., Devitt) suggest failed terms refer to *theoretical roles*. But this risks blurring externalism with descriptivism.  
    - **Hybrid Approach**: "Phlogiston" referred to a *concept* (a mental particular), not a natural kind. This preserves externalism for successful terms but requires a separate account for empty ones.  

  ---

  ### **Conclusion: The Lessons**
  1. **Externalism’s Limits**: It **confirms** externalism’s strength for natural kinds but **exposes a blind spot** for theoretical posits. Phlogiston wasn’t "discovered"—it was *invented and abandoned*.  
  2. **Priestley’s Dilemma**: Under externalism, he was likely **talking past everyone**—his causal chain was anchored to nothing, even while handling oxygen.  
  3. **Descriptivism’s Short Life**: It initially "refers" but **collapses under theory change**, as Lavoisier invalidated the core description.  
  4. **The Deeper Insight**: **No theory of reference fully captures phlogiston**. Externalism ignores the *pragmatic role* of empty terms in scientific progress; descriptivism can’t handle radical theory shifts.  

  **Where We Stand**: Phlogiston reveals that reference for *failed scientific concepts* demands a new framework—one accounting for how terms function *within theories* before we know if they correspond to reality. Externalism isn’t wrong; it’s **incomplete** for the history of science.  

  Want to explore hybrid solutions (e.g., Kitcher's "reference potential") or how this applies to modern "empty" terms (e.g., dark matter pre-detection)?
