prompt: |-
  I work in compliance at a small private fertility clinic. Roughly thirty times a week I take a fifteen-minute call with a patient before a procedure, walk through the consent form, and flag any case that looks shaky to the attending physician, who is the one who actually signs off. I have no legal or philosophy training, but I've been thinking on my own about what actually makes a consent valid. I keep landing on the standard list — the person has to be informed, the choice has to be voluntary, and the person has to be competent — and I can't tell where the lines are. Is a patient who is offered a 50% discount this month being coerced? Is a patient who is told the correct success rates but is told "this is the only option that works for you" properly informed? Does competence work as one switch, or can a person be competent about one part of a decision and not another?

  Please turn that standard list into a decision procedure my team could actually run during the call: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Mark clearly which steps are judgment calls dressed up as procedure. Then run it on these three cases from this month: (1) a patient who is given the discount and says "obviously we'd go with your clinic," with nothing else changed; (2) a patient who is told the correct odds but is told the other clinics "cut corners," and when I press her she says she would still want the procedure but "not from them"; (3) a patient with early memory problems who is completely clear about the procedure itself but keeps confusing the five-year embryo storage clause, with her partner present on the call and answering for her whenever she hesitates. If the procedure gives an answer on any of these that clashes with what we have been doing, say so plainly, and end by saying what the procedure cannot do at all. Keep the whole thing to a maximum of 800 words.
reasoning: |-
  Hmm, the user works in compliance at a small private fertility clinic. They need a practical decision procedure for evaluating patient consent during those 15-minute pre-procedure calls. They've identified the standard pillars of consent (informed, voluntary, competent) but struggle with applying them to real cases.

  The user's underlying concerns seem to be about legal risk and ethical practice - they mention having no formal training, so they likely want both clarity and defensibility. The three cases they presented reveal specific pain points: possible coercion through discounts, manipulation of alternatives, and fluctuating competence. 

  For the decision procedure, I should build something sequential that:
  - Starts with competence since it's foundational
  - Handles information disclosure and understanding
  - Evaluates voluntariness last
  - Clearly flags where judgment is required
  - Specifies when to escalate to the physician

  Key design considerations:
  1) Competence assessment must be functional - can they understand THIS decision? The memory-impaired patient case shows this nuance matters.
  2) Information disclosure requires verifying comprehension, not just recitation. The "only option that works" example illustrates manipulation risks.
  3) Voluntariness needs scrutiny when incentives exist. That 50% discount might create subtle pressure.

  For the case applications:
  - Case 1 (discount): The "obviously" comment suggests the discount may be overriding medical judgment. I'd flag this as potentially coercive.
  - Case 2 (competitor remarks): Even with correct odds, disparaging others undermines informed choice. The patient's persistence doesn't fix the provider's unethical framing.
  - Case 3 (memory issues): Partner answering violates autonomy. Competence isn't global - misunderstanding storage terms is material here.

  Crucially, the procedure must acknowledge its limits: It can't resolve value conflicts (like religious objections to embryo disposal), detect all forms of subtle coercion, or replace physician judgment on medical suitability. 

  The response should end by explicitly noting where their current practice might conflict with this framework, particularly regarding Case 1 where discounts may inadvertently coerce.
answer: |-
  Here's a practical decision procedure based on the core pillars of valid consent (Informed, Voluntary, Competent), designed for your 15-minute calls. **Bolded steps require judgment disguised as procedure.**

  **Fertility Clinic Consent Assessment Procedure (Per Call)**

  1.  **Establish Competence (Capacity):**
      *   *Ask:* "Can you tell me in your own words what procedure we're discussing today and why you're considering it?" *Listen for:* Basic understanding of the *nature and purpose* of the procedure.
      *   *Ask:* "What are the main benefits you hope for from this procedure?" *Listen for:* Connection to personal goals/values.
      *   *Ask:* "Can you tell me one or two of the more serious risks or downsides we discussed?" *Listen for:* Acknowledgment of potential harms.
      *   *Sufficient Answer:* Demonstrates basic grasp of *what* is happening and *why*, acknowledges potential downsides. Doesn't require perfect recall, just fundamental understanding.
      *   *Stop if No:* If the patient cannot grasp the basic nature/purpose/risks despite simple re-explanation, **stop**. Flag to physician: Competence insufficient for consent. Requires physician evaluation or surrogate decision-maker process.
      *   *Judgment Call:* Assessing whether confusion is momentary, language-based, or indicates fundamental lack of capacity. Distinguishing misunderstanding from incapacity.

  2.  **Verify Understanding of Key Information:**
      *   *State:* "To make sure we're clear, I need to confirm you understand some specific points. Please tell me:"
          *   "What is the estimated success rate for someone in your situation?"
          *   "What are the main alternatives to this specific procedure? (e.g., other treatments, other clinics, no treatment, adoption)"
          *   "What does the consent form say about what happens to unused embryos after [specific storage period, e.g., 5 years]?"
      *   *Sufficient Answer:* Reasonably accurate recall or paraphrase of the *factual* information provided (success rates, alternatives, storage terms). Minor inaccuracies can be corrected; persistent significant misunderstanding is a problem.
      *   *Stop if No:* If the patient demonstrates significant, persistent misunderstanding of critical facts (success rates, key risks, alternatives, storage/disposition) *after clarification*, **stop**. Flag to physician: Understanding insufficient. Procedure cannot proceed without further education/clarification or competence reassessment.
      *   *Judgment Call:* Determining if misunderstanding is material to the decision and if further explanation is likely to resolve it. Deciding what constitutes a "significant" misunderstanding.

  3.  **Assess Voluntariness (Absence of Coercion/Undue Influence):**
      *   *Ask:* "Tell me about how you decided to choose this specific procedure at our clinic."
      *   *Ask:* "Did anyone pressure you or make you feel like you *had* to do this? This includes family, partners, doctors, or even financial pressures."
      *   *Ask:* "Knowing the alternatives we discussed, what makes this the right choice *for you* right now?"
      *   *Sufficient Answer:* Expresses personal choice, acknowledges alternatives exist, denies feeling forced or excessively pressured. Mentions factors like clinic reputation, doctor relationship, logistics, *but* frames it as their decision.
      *   *Stop if No:* If the patient explicitly states they feel forced, threatened, or unable to say no to a specific person or situation, **stop**. Flag to physician: Potential coercion/undue influence. Consent invalid.
      *   *Hand-off for Values:* **If the answer hinges *primarily* on personal values, beliefs, or priorities** (e.g., "This aligns with my faith," "This is my only hope for a genetic child," "I trust Dr. Smith completely"), **hand-off**. You've established they understand the facts and are choosing freely *based on their values*. This is valid consent. Your role ends (unless competence/info issues flagged earlier).
      *   *Judgment Call:* **CRITICAL JUDGMENT STEP.** Distinguishing normal influence (advice, preferences) from undue influence/coercion. Assessing if financial incentives (like discounts) or persuasive statements ("only option") undermine free choice. This is the murkiest area.

  **Application to Your Cases:**

  1.  **Discount Patient ("obviously we'd go with your clinic"):**
      *   *Competence/Understanding:* Likely OK (assuming these were verified).
      *   *Voluntariness:* **RED FLAG for Judgment.** The "obviously" combined with a significant financial incentive suggests the discount *may* be the primary driver, potentially undermining a free choice based on medical factors. *Ask probing voluntariness questions:* "What specifically made this clinic the obvious choice?" "If the discount wasn't offered, would you still be choosing this procedure here?" **If answers revolve solely around the discount, flag to physician:** Potential undue influence from financial incentive. *This clashes with common practice where discounts are often assumed fine.* The procedure highlights the risk.

  2.  **Patient Told Other Clinics "Cut Corners" ("not from them"):**
      *   *Competence:* Likely OK.
      *   *Understanding:* **RED FLAG.** While she knows the *odds*, misinformation about alternatives ("cut corners") was provided. *Correct this misstatement clearly during the call.* "Just to clarify, while we believe in our protocols, other licensed clinics meet regulatory standards." Re-explain factual alternatives.
      *   *Voluntariness:* **Hand-off for Values.** *After correcting the misinformation*, her statement "I would still want the procedure but not from them" suggests a core value judgment or preference driving her choice *even knowing alternatives exist and are legitimate*. She feels free to reject the others based on her judgment (even if initially influenced). Her choice is now informed and voluntary *based on her values*.

  3.  **Patient with Memory Problems (Partner Answers):**
      *   *Competence:* **RED FLAG / STOP.** Consistent confusion about the significant 5-year storage clause indicates a lack of capacity to understand *that material aspect* of the decision. The partner answering *for* her demonstrates she cannot process/retain key information needed for consent. **Stop.** Flag to physician: Competence insufficient for this specific consent decision. The physician must evaluate capacity, involve the partner formally as a surrogate if appropriate (following relevant laws), or postpone.

  **What This Procedure Cannot Do:**

  1.  **Guarantee Consent is "Ethically Perfect":** It catches major failures, not subtle nuances of power dynamics or regret.
  2.  **Assess Medical Appropriateness:** That's the physician's role.
  3.  **Resolve Deep Value Conflicts:** It identifies when choices are value-based but doesn't judge those values.
  4.  **Detect All Undue Influence:** Coercion can be very subtle and hidden.
  5.  **Replace Physician Judgment on Capacity/Medical Issues:** It flags concerns *for* the physician.
  6.  **Handle Complex Surrogate/Incapacity Law:** It identifies the problem but defers to the physician/legal processes.

  **Key Takeaway:** This procedure systematizes the pillars, forcing explicit checks on understanding and voluntariness. The major clash is with Case 1 (Discounts) – they require careful scrutiny for undue influence. Case 3 highlights that competence is decision-specific, not global.
