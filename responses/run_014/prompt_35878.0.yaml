prompt: |-
  My friend Maya and I have been arguing about this stuff on and off for years (she's in my ethics reading group, I'm the hanger-on). Her track record on the cases we've run past her, as best I can reconstruct it:

  - Within one life: someone accepting a couple of rough years now for a much better few decades after — obviously worth it, she says. Trade-offs inside a single life are just arithmetic to her.
  - Rescue: you can pull five strangers from a burning building or one stranger — same risk, same effort, no difference except the count. She'd pull the five without hesitation.
  - One person will suffer a year of severe pain unless we trigger a one-second mild itch in a million people. She said yes, itch the million, though she made a face about it.
  - The mirror of that: a million people will each get a one-second itch unless we make one person suffer a year of severe pain. Hard no. Let them itch.
  - Utility monster (the classic one who converts any extra resources into vastly more wellbeing than anyone else would get from them): she flat out refuses to feed it.

  Her go-to line for all of this is that you can't pour seperate people's gains and losses into one pot as if it were all a single life — but she's never spelled out what actually follows from that, and I suspect more than one principle is hiding behind her verdicts.

  Next week we're bringing three new cases to her and I want to walk in with actual predictions:

  New case 1: one person will suffer 9/10 pain for a full year. We can redirect it — instead, 300 people each suffer 4/10 pain for a full year, and the first person is fine. Stipulate the totals come out the same on any scale you like.

  New case 2: one vaccine dose. Either it immunizes 1,000 people against a day of mild flu, or it immunizes one person against a year of severe pain. Equal totals again, stipulated.

  New case 3: the check case — same setup as new case 1, except it all happens inside one life: one person either has a single terrible year or 300 bad days spread across their decades. Does it being one life change her answer?

  Please structure your reply like this:

  1. "Predictions" — her call on each of the three, one line apiece.
  2. "The rules that fit" — the candidate principles her track record is consistent with, and what each one predicts on the three new cases. This is the part I care most about, so take some room here, maybe 250 words. If two rules agree on all three, say so instead of pretending they differ.
  3. "Best guess" — which rule you'd bet she's actually running, and why, around 100 words.
  4. "The tiebreaker" — one further case, not among the three, that would best split the surviving candidate rules, plus what each rule says on it, around 100 words.

  And don't just hand me rule names — I want to see where the rules come apart and which of the new cases is doing the separating. If her record genuinely underdetermines one of the predictions, just say that rather than forcing a call.
reasoning: |-
  Okay, let me try to figure out Maya's ethical framework. She clearly rejects classical utilitarianism because she won't feed the utility monster. Her go-to line about not pooling gains/losses across people suggests she views individuals as separate moral entities. 

  Looking at her past cases:
  - Within one life: She accepts trade-offs (rough years for better decades). So personal utility aggregation is fine.
  - Rescue case: Saves five over one. Shows she allows some aggregation in life-or-death scenarios.
  - Itch vs year: Will inflict minor harms on many to prevent major harm to one, but refuses the reverse. This asymmetry is crucial - preventing big harm has priority over preventing many small harms.
  - Utility monster: Rejects concentrating benefits. Confirms she opposes maximizing sum if it creates extreme inequality.

  For the new cases:
  1. Redirecting pain: 300 people at 4/10 vs one at 9/10. Since both involve serious suffering, her lifeboat-case reasoning might apply (save more from comparable harm). Prediction: Redirect to the 300.
  2. Vaccine allocation: Preventing many mild flu days vs preventing one person's severe pain year. Her itch/year case suggests she'll prioritize preventing the severe pain. Prediction: Immunize the one.
  3. Single-life version: Since she accepts intra-personal trade-offs, she'll prefer spreading out the pain. Prediction: Spread the 300 bad days.

  The rules that fit:
  - Threshold Deontology: Serious harms can't be inflicted to prevent minor ones, but comparable harms can be aggregated. Predicts: Redirect pain (comparable harms), prioritize severe pain prevention (asymmetry), spread pain in one life.
  - Prioritarianism: Weight benefits to the worse off. Predicts same as above since in case 2 the severe pain victim is worse off.
  - Contractualism: Rules no one could reasonably reject. Case 1 might allow redirection (each of 300 avoids worse fate), case 2 would protect severe pain victim.

  Best guess is Threshold Deontology because it explains her strong asymmetry - inflicting severe harm on one to save many from minor harms is prohibited, but preventing severe harm may justify imposing minor harms.

  Tiebreaker case: One person faces 5 years severe pain unless we inflict 1 year moderate pain on each of 10 people. Threshold Deontology says no (imposing moderate pain to prevent severe violates threshold). Prioritarianism says yes (reducing worse suffering takes priority).
answer: |-
  ### Predictions
  1. **New case 1** (Redirect 1yr@9/10 pain to 300@4/10): She redirects.  
  2. **New case 2** (Vaccine: 1,000 mild flu-days vs. 1 severe pain-year): She immunizes the *one* against severe pain.  
  3. **New case 3** (Single life: 1 terrible year vs. 300 bad days): She spreads the pain.  

  ---

  ### The Rules That Fit  
  Maya’s track record rejects **classical utilitarianism** (sum-total aggregation) and **prioritarianism** (weighting the worst-off). Instead, two rules fit all prior cases and align *identically* on the new predictions:  

  1. **Threshold Deontology with Aggregation Limits**:  
     - **Core idea**: Harms above a severity threshold (e.g., severe pain, death) cannot be *inflicted* to prevent *sub-threshold* harms (e.g., itches), even in aggregate. However, *comparable* harms (above-threshold) can be aggregated.  
     - **Prior cases explained**:  
       - "Rescue": Deaths are comparable → save more lives.  
       - "Itch the million": Severe pain (above threshold) prevented by inflicting sub-threshold itches → acceptable.  
       - "Pain the one": Inflicting severe pain (above threshold) to prevent sub-threshold itches → forbidden.  
       - "Utility monster": Concentrating resources violates fairness; severe deprivation of others isn’t sub-threshold.  
     - **New predictions**:  
       - Case 1: Both options involve above-threshold pain (4/10 and 9/10 are "severe" per her pain-year case) → aggregation applies (redirect to 300).  
       - Case 2: Severe pain-year (above threshold) vs. aggregated mild flu-days (sub-threshold) → prioritize severe pain prevention.  
       - Case 3: Intra-life trade-offs ignore thresholds → arithmetic applies (spread pain).  

  2. **Modified Contractualism (Scanlon-style)**:  
     - **Core idea**: An act is wrong if it imposes burdens no one could reasonably reject *as a free-standing loss to them*. Sub-threshold harms don’t count as "burdens" for rejection when preventing above-threshold harms.  
     - **Prior cases explained**:  
       - "Rescue": Saving 5 over 1 is reasonable; the lone victim can’t reject it.  
       - "Itch the million": One person’s severe pain is a rejectable burden; million itches aren’t individually rejectable.  
       - "Pain the one": Inflicting severe pain is rejectable; million itches aren’t.  
       - "Utility monster": Concentrating gains creates rejectable burdens (deprivation) for others.  
     - **New predictions**:  
       - Case 1: Redirecting comparable pain isn’t rejectable (each of the 300 avoids worse pain) → redirect.  
       - Case 2: Preventing severe pain for one is a stronger claim than preventing sub-threshold flu for many → immunize the one.  
       - Case 3: Single-life trade-offs aren’t subject to "rejection" → spread pain.  

  **Agreement**: Both rules predict identically on all new cases. No separation occurs here.  

  ---

  ### Best Guess  
  **Threshold Deontology** (90% confidence). Her language ("can’t pour separate people’s gains/losses into one pot") mirrors deontic constraints, and her pain/itch cases show a sharp severity boundary. Contractualism is less intuitive for her utility-monster rejection (which emphasizes *inflicted* harm over reasonable rejection). The threshold model best explains her asymmetry: forbidding *infliction* of severe harm to prevent minor harms, while allowing minor harms to prevent severe ones.  

  ---

  ### The Tiebreaker  
  **Case**: One person will suffer 5 years of severe pain (10/10) unless we inflict 1 year of moderate pain (6/10) on each of 10 other people. Totals are equal.  

  - **Threshold Deontology**:  
    - *Inflicting* moderate pain (above threshold) to prevent severe pain → **forbidden**. The 10 people suffer harms above threshold (moderate/severe), and inflicting it violates the constraint.  
  - **Modified Contractualism**:  
    - The person facing 5 years of severe pain could reasonably reject non-intervention. The 10 others *can* reject being inflicted with moderate pain as a free-standing loss → **forbidden**.  
  - **Separation**: Both forbid, but for different reasons. To split them, test a case where *preventing* severe harm requires *allowing* (not inflicting) moderate harm.  
    - **Revised Tiebreaker**: *Allow* one person to suffer 5 years of severe pain, or *allow* 10 people to suffer 1 year of moderate pain (e.g., by not distributing a cure).  
      - Threshold Deontology: Both above threshold → aggregate, **save the 10**.  
      - Contractualism: The one facing severe pain has a stronger claim → **save the one**.
