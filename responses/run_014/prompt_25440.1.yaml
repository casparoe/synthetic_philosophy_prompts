  I recall Jonathan Dancy's work on moral particularism—how reasons shift valence based on context. The challenge is creating a scenario where this valence shift is undeniable yet subtle. Workplace dynamics might work well—hierarchies and professional norms create natural "rules," but human relationships add complexity. 

