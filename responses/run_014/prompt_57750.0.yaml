prompt: |-
  A colleague of mine, whom I'll call R., is at fifty percent risk for a late-onset neurodegenerative condition that currently has no treatment that alters its course. A definitive predictive test is available to her at no cost and with no medical risk beyond the blood draw. R. is forty-one and has one young child, and she has decided not to be tested: she says she would rather not spend the next twenty years organizing her life around a number. Two members of my department argued about whether that decision can be rational, and they asked me to referee. I could not. Here is the exchange as nearly as I can reconstruct it.

  (1) Nadia opened by saying the decision-theoretic literature has already settled the general question. Good's theorem on the value of information says that if evidence is free — nothing to acquire it, nothing to use it — then in expectation it cannot leave you worse off, provided you update on it and then choose whichever act maximizes expected utility relative to what you have learned. The reasoning is just that the expected value of a maximum is at least the maximum of an expected value: whatever act you would have picked in ignorance remains available after you learn, so doing the best you can with the news cannot be worse than sticking with that act. On Nadia's reading, R. must either be mistaken about the theorem's application or mistaken about her own reasons.

  (2) Owen said the theorem's assumptions are precisely what fail here. R. is not claiming she would be better off ignorant by the calculator's own lights; she is saying she does not trust herself to be the calculator. She expects that a positive result would put her into months of paralysis and despair in which she would make choices she now judges badly. Good's theorem is a theorem about an agent who re-optimizes correctly on her posterior. For an agent who foreseeably will not, free information can easily carry negative value, and someone who knows that about herself is reasoning well rather than badly.

  (3) Nadia replied that this is a confession rather than an objection. If R. expects to respond badly, the right response to that expectation is to correct the response, not to arrange the world to accommodate it — the way you hand your keys to a friend rather than deciding in advance never to find out how drunk you are. She added that the emotional cost of knowing is not outside the utility function either: write knowledge itself into the utilities, let the value of an outcome depend on whether you know it, and run the same inequality across the possible test results, and you still come out with expected utility no lower when you test. So on her account the theorem survives the very feature Owen was leaning on.

  (4) Owen said that move proves too much and thereby empties the theorem. Once utilities may depend on what the agent knows, any pattern of preferences over knowing and not knowing can be represented, so nothing is ruled out: the theorem reduces to the claim that an agent who maximizes expected utility, defined however one pleases, maximizes expected utility. The substantive question — whether knowing would be good for R. — lives entirely in the utility function, and the theorem contributes nothing to settling it.

  (5) Nadia said the theorem still has teeth, and that the teeth are somewhere Owen has not looked. What it excludes is a certain kind of justification. Preferring not to know cannot stand on its own; it must be cashed out either as a claim about R.'s utilities — in which case R. owes an account of why those utilities are what she says they are, and of why they are not simply a miscalibrated forecast of how she will actually feel — or as a claim about her own future misbehavior, in which case she has conceded that she expects to act irrationally and should manage that rather than feed it. Either way the choice is open to criticism, which was all she had been arguing.

  (6) Owen's final move was that Nadia had quietly changed the subject by changing the agent. The theorem compares two decision problems facing a single maximizer, but the woman who declines the test and the woman who receives the result are in the relevant sense different people, and it is the first one who must choose. If the earlier self has good evidence about the later one's values and competence, declining to put that later person in her situation is ordinary prudence — no different from refusing to sign an agreement you know you would regret honoring. He added that Nadia's appeal to faulty affective forecasting in (5) cuts both ways: if R. cannot trust her predictions of her own despair, she cannot trust her predictions of her own equanimity either, and the witness Nadia has impeached is the only one available.

  Neither of them would yield, and I have no view of my own to defend. Could you adjudicate this move by move? For each of the six numbered steps, say whether it is right, partly right, or mistaken, and explain why in a sentence or two rather than by restating the move. Two questions deserve explicit treatment: whether Nadia is correct in (3) that the inequality she invokes continues to hold once utilities are permitted to depend on what the agent has learned, and whether Owen's conclusion in (4) that this would render the theorem vacuous follows from it. Then tell me which of them is more right overall about R.'s decision, and — separately — identify anything of consequence that both of them left out of the argument, including anything about R.'s particular circumstances that neither of them brought to bear.
reasoning: |-
  Hmm, the user presents a complex philosophical debate about decision theory and rationality regarding predictive genetic testing. The scenario involves "R." who declines testing for a neurodegenerative condition despite 50% risk, sparking a debate between Nadia (pro-testing) and Owen (pro-autonomy).

  Nadia invokes Good's Theorem to argue information has non-negative expected value. Owen counters that the theorem assumes rational updating, which R. doubts she'll achieve. The user wants me to adjudicate each of their six moves and determine who's more correct overall.

  Breaking down each move:
  - (1) Nadia is technically correct about Good's Theorem but oversimplifies by ignoring psychological realities.
  - (2) Owen correctly identifies the critical flaw in applying the theorem to humans with predictable irrationalities.
  - (3) Nadia's "correction over accommodation" argument is ethically sound but practically naive about emotional regulation.
  - (4) Owen is right that context-dependent utilities make the theorem tautological - a key insight.
  - (5) Nadia's "critique of justification" is valid but underestimates the legitimacy of epistemic avoidance.
  - (6) Owen's "changing selves" argument is perceptive but overextended; while values shift, it's not full identity change.

  On the special questions: Nadia's inequality holds mathematically with knowledge-dependent utilities, but Owen is correct this empties the theorem of predictive power. Overall, Owen's position better respects R.'s self-knowledge and the limits of decision theory models.

  Both miss crucial factors: R.'s role as a parent (how knowledge might impact parenting), the potential value of preparation time even without treatment, and how the 20-year horizon affects risk calculation. The medical reality of "no treatment" makes information less urgent.

  The core tension is between normative rationality (Nadia) and descriptive psychology (Owen). R.'s decision reflects profound wisdom about self-limitation - sometimes not asking questions is the rational choice when answers can't be acted upon. The debate exposes how decision theory struggles with anticipatory emotions and temporal selves.
answer: |-
  Here is a move-by-move adjudication, followed by overall assessment and omitted factors:

  ### Adjudication of Moves
  1.  **Nadia (1): Partly right but mistaken in application.**  
      Good's Theorem is formally correct: free information *cannot lower expected utility* under its assumptions (rational updating and utility-maximizing action). However, assuming it directly applies to R. overlooks the core psychological conflict she articulates—her fear that she *won't* act rationally post-test. The theorem assumes what R. doubts.

  2.  **Owen (2): Right.**  
      He correctly identifies that Good's Theorem assumes the agent will update beliefs and act optimally *after* receiving information. R. explicitly anticipates *failing* to do this due to paralyzing despair, violating the theorem's core assumption. The theorem cannot defend testing if the agent predicts post-test irrationality.

  3.  **Nadia (3): Partly right but incomplete.**  
      *Mathematically*, she is correct: incorporating the disutility of knowing (e.g., "despair utility cost") into the outcome utilities preserves the theorem’s inequality (expected utility of testing ≥ expected utility of not testing). *Pragmatically*, her "correct the response, don't accommodate it" stance underestimates the difficulty of overcoming profound psychological reactions. "Handing keys to a friend" implies a feasible intervention, which may not exist for R.'s anticipated despair.

  4.  **Owen (4): Right.**  
      Allowing utilities to depend on the agent's knowledge state *does* render the theorem vacuous in practice. Any preference (e.g., "ignorance is bliss") can be rationalized by defining utilities accordingly (e.g., assigning high utility to "not knowing I'm at risk"). The theorem then reduces to a tautology: "Do what maximizes utility as defined," offering no guidance on whether testing *should* be preferred.

  5.  **Nadia (5): Partly right but reductive.**  
      She is correct that R.'s justification invites scrutiny of her utility function or her prediction of future irrationality. However, dismissing "preferring not to know" as inherently suspect ignores that epistemic states (knowing/not knowing) *are* legitimate components of well-being for many people. R.'s aversion isn't necessarily "miscalibrated"; it may reflect a coherent value system prioritizing present engagement over anticipatory dread.

  6.  **Owen (6): Insightful but overstated.**  
      His "different people" metaphor captures how profound knowledge can alter values/perspective, making pre-test R. a legitimate steward of her future self's interests. However, framing it as *entirely* different agents is hyperbolic; it's one person anticipating a radical shift in mindset. His point about Nadia's "faulty forecasting" critique applying symmetrically is strong: if R. distrusts her despair prediction, she should also distrust her confidence in current equanimity.

  ### Explicit Treatment of Questions
  -   **Does Nadia's inequality hold with knowledge-dependent utilities?**  
      **Yes.** Good's Theorem is a mathematical identity: \( \mathbb{E}[\max_a u(a, \theta)] \geq \max_a \mathbb{E}[u(a, \theta)] \). If \( u \) includes "knowledge states" as part of the outcome definition (e.g., \( u(\text{healthy}, \text{know risk}) \) vs. \( u(\text{healthy}, \text{ignorant}) \)), the inequality still holds. The expected utility of testing (which reveals truth and thus assigns utilities conditional on knowledge) cannot be less than not testing (which assigns utilities conditional on ignorance).
  -   **Does this render the theorem vacuous?**  
      **Yes, practically speaking.** As Owen argues, allowing utilities to arbitrarily depend on knowledge states makes the theorem compatible with *any* choice. If R. assigns sufficiently high disutility to "knowing I have the gene," testing can have negative expected utility *by definition*, making non-testing rational under her own values. The theorem loses normative force, becoming a consistency check rather than a prescriptive tool.

  ### Overall Assessment
  **Owen is more right about R.'s decision.**  
  R.'s core rationale—foreseeing that a positive result would induce paralyzing despair, undermining her ability to act rationally or enjoy life—directly violates Good's Theorem's assumption of post-information rational action. Nadia's reliance on the theorem ignores this psychological realism. Owen better respects R.'s self-knowledge and the limits of formal decision theory when agents predict their own irrationality. While Nadia correctly notes that R.'s utilities or predictions could be challenged, Owen's framing of the "future self" problem and the vacuity of the theorem under flexible utilities is more persuasive in this context.

  ### Significant Omissions by Both
  1.  **R.'s role as a parent:** Neither addresses how knowing her status (or the anticipatory anxiety) might impact her parenting or her child's well-being, a key factor in R.'s life-stage calculus.
  2.  **Value of preparation beyond "organizing life around a number":** They overlook potential *non-medical* benefits of knowing (e.g., financial planning, family discussions, legacy projects) that might counterbalance despair risks.
  3.  **The 20-year horizon:** The long latency period means R. might value decades of "undisturbed" life highly, making anticipatory dread particularly costly. This strengthens her "organizing life around a number" concern.
  4.  **No treatment ≠ no agency:** Even without disease-modifying treatments, knowledge *could* enable lifestyle adjustments, clinical monitoring, or participation in research, offering some sense of control. R. might discount this, but it warrants consideration.
  5.  **Social/identity effects:** Knowing could alter R.'s self-perception or relationships, independent of medical utility—a factor Nadia's utilty-inclusion gesture doesn't deeply explore.

  R.'s decision reflects a prioritization of present psychological integrity over uncertain future gains, grounded in self-knowledge. While debatable, it is defensibly rational given her stated values and predictions, and Owen's arguments better capture this nuance.
