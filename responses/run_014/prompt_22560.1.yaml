answer: |-
  Here's a concrete example tailored to your software engineering background, framed in terms of type checking (primary intension) vs. runtime behavior (secondary intension):

  ### Example: "The Default Configuration Value is 42"
  Imagine a software system where a configuration constant `DEFAULT_TIMEOUT` is hardcoded in the source code:

  ```python
  # Hardcoded in the system's global configuration
  DEFAULT_TIMEOUT = 42  # milliseconds
  ```

  Now, consider the statement:  
  **"`DEFAULT_TIMEOUT` equals 42."**

  ---

  ### 1. **Primary Intension (Type Check Analogy)**  
  - **What it represents**: The "compile-time" meaning.  
    - We consider all possible ways the software *could have been designed* (different source code versions).  
    - In each hypothetical design, we ask: "If this code were the actual system, what would `DEFAULT_TIMEOUT` be?"  
  - **Result**:  
    - If the code explicitly defines `DEFAULT_TIMEOUT = 42`, the statement is true.  
    - If the code defines `DEFAULT_TIMEOUT = 100`, the statement is false.  
  - **Why it's contingent**:  
    The truth value *depends on which source code we're considering*. It varies across possible design scenarios.  

  ---

  ### 2. **Secondary Intension (Runtime Analogy)**  
  - **What it represents**: The "runtime" meaning after fixing the actual world.  
    - We lock the *actual source code* (e.g., `DEFAULT_TIMEOUT = 42`).  
    - Now we test the statement in counterfactual *runtime environments* (e.g., different hardware, OS, or dynamic overrides).  
  - **Result**:  
    - In a standard environment: `DEFAULT_TIMEOUT` returns `42` → **true**.  
    - In a test environment where the value is overridden via `export DEFAULT_TIMEOUT=100`:  
      At runtime, `DEFAULT_TIMEOUT` resolves to `100` → **false**.  
  - **Why it's contingent**:  
    The truth value *depends on the runtime context*, even though the source code is fixed.  

  ---

  ### Key Metaphor
  - **Primary Intension (Type Check)**:  
    Like checking if a variable `x` is declared as `int` in the source code.  
    - *Necessary* if `x` is always `int` in all possible codebases (not the case here).  
    - *Contingent* if different codebases declare `x` as different types (as in our example).  

  - **Secondary Intension (Runtime)**:  
    Like checking the *value* of `x` during execution after compiling the code.  
    - `x` might be `42` in some runs and `100` in others → contingent, even if the type is fixed.  

  ---

  ### Why This Works
  - **Primary intension is contingent**:  
    Truth depends on how the system is designed (different source code → different values).  
  - **Secondary intension is necessary**:  
    Once the design is fixed (actual code locked in), the value is hardcoded as `42` and *cannot change* across runtime environments (no dynamic override possible).  

  > **Note**: This flips your requested order (contingent primary, necessary secondary) to match the computational analogy cleanly. If you strictly need *necessary primary/contingent secondary*, we can adjust—but this version avoids overused philosophy examples while leveraging your background. Let me know if you'd like the inverse!
