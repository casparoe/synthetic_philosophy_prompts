  Now about the weights: The user thinks physical access might resolve indeterminacy. But Quine would say weights are just another "text" to interpret. Like translating Jungle language, multiple belief-systems could map to the same weight patterns. The underdetermination is fundamental - no amount of data fixes meaning.

