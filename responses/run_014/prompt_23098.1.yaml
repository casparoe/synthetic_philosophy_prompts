  Let me break it down. Logical omniscience in Bayesianism assumes agents know all logical truths. But real agents don't. The objection points to surprise as evidence against coherence. But is surprise relevant? If rationality is normative, maybe it's about ideals, not feasibility. However, coherence here might mean internal consistency without contradiction. Logical omniscience requires an agent to assign P=1 to all tautologies, but finite beings can't compute all of them. So is it coherent as an ideal?

  The key is whether it's a necessary standard. If we drop logical omniscience, does rationality break? Maybe not. Subjective Bayesians allow priors that don't start with all logical truths. But then how do we handle unknown theorems? The agent's credence in unproven truths should be based on available evidence and computational resources. For example, a math conjecture might have a credence reflecting heuristic evidence until proven.

