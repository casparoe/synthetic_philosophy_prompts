prompt: |-
  I'm writing a chapter on reproductive torts and want to get the implicit philosophy straight before I get to the doctrine. In most common-law jurisdictions, parents can recover for wrongful conception and wrongful birth — the costs of an unplanned pregnancy after a failed sterilisation or negligent genetic counselling — while the child's own claim, wrongful life, is almost uniformly rejected, even where the negligence (a failure to diagnose rubella in utero, say) determined not that the child exists but only the condition the child exists in. Courts justify the refusal by appeal to the supposed impossibility of comparing impaired existence with nonexistence, and sometimes to the principle that life itself cannot be a harm; meanwhile some courts, in wrongful conception suits, offset the rearing-cost award by the benefits of parenthood. What view of harm — and of the nonidentity problem — does this pattern presuppose? Does it presuppose a person-affecting constraint, and is it coherent, given that in the misdiagnosis cases identity is fixed and no nonidentity problem arises? Distinguish what the doctrine strictly requires from what it merely sits well with, and say what would have to change if the courts instead adopted the Parfitian line that the only wrongs here are done to the parents. Please answer in British English.
reasoning: |-
  Okay, the user is working on a chapter about reproductive torts and wants to clarify the underlying philosophy before diving into legal doctrine. They're pointing out that courts allow parents to claim for wrongful conception and birth but reject the child's claim for wrongful life. The user is asking about the view of harm and the nonidentity problem implied by this pattern. They also want to know if this presupposes a person-affecting constraint and whether it's coherent, especially in misdiagnosis cases where the child's identity isn't changed by the negligence. Plus, they want to distinguish between what the doctrine requires and what it's compatible with, and what would change if courts took a Parfitian approach.

  First, I need to recall the key cases and legal distinctions. Wrongful conception and birth involve claims by parents for costs related to unplanned pregnancies or children with disabilities due to negligence, like failed sterilizations or genetic counseling errors. Wrongful life is the child's claim that they shouldn't have been born because of their impairment. Courts reject wrongful life suits based on two main arguments: the impossibility of comparing existence with non-existence and the idea that life itself isn't a harm. Also, some courts reduce damages in parental claims by offsetting the benefits of parenthood.

  The nonidentity problem comes into play here. This is a philosophical issue raised by Derek Parfit, where an action that causes someone to exist with a harmed state doesn't seem to harm them because without the action, they wouldn't exist at all. So, in wrongful conception cases, if the negligence leads to the conception of a specific child, that child couldn't claim harm because they wouldn't exist otherwise. But in wrongful birth cases where the negligence is about failing to diagnose a condition in utero (like rubella), the child's identity is already fixed; the negligence affects their condition, not their existence. So in those cases, the nonidentity problem doesn't apply because the same child would exist but without the impairment.

  The user is asking if the court's approach presupposes a person-affecting constraint. That means harm requires making someone worse off than they would otherwise be. In wrongful life claims, courts say you can't compare existence to non-existence, which aligns with this constraint because non-existence isn't a state you can be worse off than. But in misdiagnosis cases, where identity is fixed, the child could argue they were harmed by being born impaired instead of healthy. However, courts still reject this, which might be inconsistent because here, the child could have existed without the impairment, so they are worse off. Yet courts avoid it, possibly due to metaphysical discomfort or policy concerns about devaluing life.

  Regarding the offsetting of benefits in parental awards, this suggests a comparative harm approach. Parents are compensated for costs minus benefits, implying harm is net detriment. But for the child, no such comparison is possible with non-existence. So the doctrine seems inconsistent: comparative for parents, non-comparative for children in wrongful life.

  If courts adopted a Parfitian view, they would only recognize harms to parents, not to the child. Wrongful life claims would still be rejected, but the reasoning would shift from impossibility to the nonidentity problem. For wrongful birth due to misdiagnosis, where identity is fixed, Parfit might still say the child isn't harmed because without the negligence, they might not exist (if the parents would have aborted). However, this is tricky. If the negligence prevented the parents from choosing abortion, and the child is born impaired, Parfit could argue that the child isn't worse off because the alternative was non-existence. So even in fixed identity cases, the nonidentity problem could apply if avoiding negligence would have led to abortion. Thus, the child couldn't claim harm. The Parfitian approach would focus solely on parental autonomy and their losses, rejecting any child claim based on impaired life.

  The user wants to distinguish doctrine requirements from compatibility. Doctrine requires rejecting wrongful life based on comparability and life as a benefit. It doesn't strictly require a person-affecting view but is consistent with it. However, the offsetting of benefits in parental cases suggests a comparative harm model. The doctrine is compatible with a narrow person-affecting view but struggles in fixed identity cases.

  In summary, the current legal framework reflects a tension between different harm concepts and handles nonidentity inconsistently. Adopting Parfit's view would streamline by focusing only on parental harms, avoiding wrongful life claims entirely, but it might not resolve all moral intuitions, especially in fixed identity scenarios where the child's impairment seems a direct result of negligence.
answer: |-
  The prevailing common-law approach to reproductive torts reflects a complex, and arguably unstable, philosophical foundation concerning harm, personhood, and comparison. Here's a breakdown:

  1.  **The Core Pattern & its Presupposed View of Harm:**
      *   **Parental Claims (Wrongful Conception/Birth):** Recovery is permitted for the *costs* (financial, emotional) of an unplanned child or a child with impairments. Crucially, these costs are framed as harms *to the parents* – a violation of their autonomy (right to avoid procreation) or their interest in having healthy offspring. The harm is largely seen as **instrumental and financial**, arising from the burden imposed by the child's existence and needs. The frequent practice of offsetting damages by the "benefits of parenthood" reinforces a **comparative view of harm**: the *net* detriment suffered by the parents after balancing the burdens against the joys and rewards of raising the child. Harm requires being made *worse off* overall compared to the counterfactual scenario (no child, or a healthy child).
      *   **Child's Claim (Wrongful Life):** Recovery is denied. The courts' explicit reasoning relies on two key premises:
          *   **The Impossibility of Comparison:** Courts deem it logically/metaphysically impossible to compare the value of an impaired existence with the state of non-existence ("non-life"). Non-existence isn't considered a baseline state against which harm can be measured.
          *   **Life as an Inherent Benefit:** Relatedly, courts often assert that life itself, even impaired life, is always preferable to non-existence and cannot constitute a legal harm. Existence is viewed as an absolute good, or at least, non-existence cannot be deemed "better."
      *   **Implied View of Harm:** This pattern presupposes a **strictly comparative and person-affecting view of harm**. Harm exists only if an identifiable person (here, the parents) is made *worse off* by an action compared to how they would otherwise have been. For the child, the wrongful life claim founders because:
          *   **(Non-Identity Cases - Wrongful Conception/Some Birth):** In cases where the negligence *caused the child to exist* (e.g., failed sterilisation), the nonidentity problem applies. The child cannot claim to be worse off because, without the negligence, *this specific child would not exist at all*. The alternative is non-existence, which cannot serve as the "better off" state for comparison. The person-affecting constraint bites hard here.
          *   **(Fixed Identity Cases - Misdiagnosis):** In cases where negligence *fails to diagnose an impairment in an existing fetus* (e.g., missed rubella), the child's identity is fixed. The negligence affects the child's condition, not its existence. *Strictly speaking, the court's justification (impossibility of comparing existence vs non-existence) is logically inapplicable here.* The relevant comparison for the child would seem to be between existence *with* the impairment (actual world) and existence *without* the impairment (counterfactual world where negligence didn't occur). Courts, however, *still reject the claim*, often blurring the distinction or falling back on the broader "life is always a benefit" principle. This suggests the presupposed view isn't merely person-affecting but also incorporates a **deep metaphysical discomfort** or **policy-driven resistance** to adjudicating the "value" of an impaired life compared to a healthy one, even when identity is fixed. The person-affecting constraint is stretched or misapplied in these fixed-identity scenarios.

  2.  **Person-Affecting Constraint (PAC) & Coherence:**
      *   **Presupposition:** Yes, the pattern strongly presupposes a PAC. Harm requires being made worse off than one would otherwise have been, and this comparison must be meaningful for an existing person.
      *   **Coherence Problem:**
          *   The doctrine *is coherent* for parental claims and for wrongful life claims *based on nonidentity* (failed sterilisation leading to a child who wouldn't otherwise exist). The PAC explains the rejection: the child isn't worse off than if it never existed.
          *   **Incoherence arises in fixed-identity misdiagnosis cases:** Here, the child exists in both scenarios. The negligence *does* cause the child to exist *with an impairment* instead of *without it*. A purely comparative PAC *should*, in theory, allow for the *possibility* of harm to the child – being worse off impaired than healthy. Yet courts reject the claim, using justifications (comparison with non-existence) that don't logically fit. This creates a tension:
              *   The *strict requirement* of the doctrine is rejecting wrongful life claims based on the stated justifications (impossibility of comparison with non-existence, life as a benefit).
              *   This *sits well with* the PAC in nonidentity scenarios but *clashes* with it in fixed-identity scenarios. The doctrine avoids the difficult comparison between impaired life and healthy life by invoking the (irrelevant) comparison with non-existence.
          *   **Offsetting Benefits:** The practice of offsetting parental awards also sits well with a comparative, utilitarian-style calculation of net harm but is fundamentally incompatible with the absolute "life is always a benefit" principle used against the child. If life *itself* is an absolute benefit that outweighs impairment costs for the child, why is it merely a *quantifiable benefit* to be offset against costs for the parents?

  3.  **Distinguishing Doctrine Requirements vs. Compatibility:**
      *   **Strictly Requires:**
          *   Recognition of parental harm based on autonomy violation and/or costs of unplanned/unhealthy child.
          *   Rejection of the child's claim based on the impossibility/unlawfulness of comparing impaired existence with non-existence and/or the principle that life itself cannot be a harm.
          *   (In some jurisdictions) A comparative assessment (net harm) for parental damages via benefit offsetting.
      *   **Sits Well With:**
          *   A **narrow person-affecting constraint** (harm requires making an identifiable person worse off).
          *   **Non-comparativism about non-existence**: Non-existence is not a state of being that can be "better" or "worse" than existence.
          *   **Policy concerns** about opening floodgates, devaluing disabled lives, or courts making impossible metaphysical judgments.
          *   **Residual Vitalism**: An implicit view that biological life itself possesses inherent, non-comparable value.
      *   **Sits Poorly With/Incoherent in:**
          *   Applying the "comparison with non-existence" justification to **fixed-identity cases**.
          *   Reconciling the **absolute** "life is always a benefit" view (used against the child) with the **comparative** "benefits offset costs" view (used for parents).
          *   A **pure comparative harm principle** applied consistently *to the child* in fixed-identity cases.

  4.  **Adopting the Parfitian Line:**
      Derek Parfit's analysis (Reasons and Persons) argues that in nonidentity cases, the only wrongs are typically done to *other* people (e.g., the parents), not to the individual whose existence depends on the act. Adopting this line would:
      *   **Retain Parental Claims:** Wrongful conception and wrongful birth claims would remain valid, as they directly address harms to the parents' interests (autonomy, financial/emotional burden, loss of chance to have a healthy child).
      *   **Reject Wrongful Life Claims:** This would be reinforced, but the *justification would shift*. Instead of relying on the impossibility of comparison or the inherent value of life, the primary reason would be the **nonidentity problem itself**: even in cases where identity *seems* fixed (like prenatal misdiagnosis), if the negligence prevented an abortion, the child cannot claim that *it* is worse off because, without the negligence, *this child might not have existed at all* (if the parents would have chosen termination). The only harms are the frustration of parental autonomy and the additional burdens imposed by the impairment – harms suffered *by the parents*.
      *   **Impact on Fixed-Identity Cases:** Parfit's view suggests that even in misdiagnosis cases, the child's claim fails because the alternative scenario (correct diagnosis leading to abortion) results in non-existence for *that child*. Therefore, the child isn't harmed by being born impaired; the wrong is solely to the parents who were denied the choice and bear the extra costs. The focus moves entirely to the **parents' interests and losses**.
      *   **Change Required:** Courts would need to:
          *   Explicitly reframe the rejection of wrongful life solely around the **nonidentity problem** and the **absence of harm *to the child***.
          *   Abandon the logically problematic "impossibility of comparison with non-existence" and "life as an absolute benefit" justifications, especially in fixed-identity contexts.
          *   Potentially refine the rationale for parental recovery in wrongful birth cases to emphasise the parents' loss (the child they planned for vs. the child they have) and the violation of their reproductive autonomy/choices, rather than implying the child's life itself is a harm.
          *   Acknowledge that the offsetting of parental benefits is a pragmatic calculation of *net parental loss*, not a judgment about the absolute value of the child's life.

  **In essence:** The current doctrine presupposes a comparative, person-affecting view of harm but applies it inconsistently. It relies on justifications for rejecting wrongful life claims that are logically inapplicable to fixed-identity misdiagnosis cases, revealing incoherence. Adopting a Parfitian perspective would resolve this by grounding the rejection of the child's claim firmly in the nonidentity problem (even where it seems counterintuitive, like misdiagnosis) and refocusing the entire framework on wrongs done *only to the parents*, requiring a shift in judicial reasoning away from metaphysical comparisons towards the infringement of parental autonomy and interests.
