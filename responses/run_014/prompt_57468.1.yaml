prompt: |-
  I'm a staff engineer, not a philosopher, and through some administrative accident I now own our on-call and "team expectations" doc at a ~300 person company. Same fight every quarter: someone hand-patches a database migration until 4am, gets a shoutout at all-hands, and two quarters later everyone's quietly expected to do that. Meanwhile someone else says reviewing a new hire's PR "isn't in my job description" and nothing happens to them. I've been reading around this and apparently there's a whole area about actions that are good but not required -- beyond the call of duty, saints and heroes, whatever the actual term turns out to be -- plus supposedly a mirror category for things that are kind of bad but you still can't be blamed for. I want to turn that into something my team can run instead of vibes.

  Give me exactly five numbered items, one or two sentences each, with nothing before or after the list -- no intro, no wrap up. Items 1-3 are the tests, in the order a person should actually ask them, and each one has to say what counts as passing and what the verdict is if it fails (required / not required / required-but-with-leeway / whatever your third bucket ends up being). Items 4 and 5 are my two cases run through those tests: (a) the 4am hand-patch, and (b) mentoring, as our doc currently words it, which is "everyone should help onboard new teammates" and nobody has ever been in trouble for not doing it.

  Things it has to survive or I'm wasting my time. The onboarding line is the interesting one -- it feels like a real requirement where you get to pick which instance and when, so the procedure needs to say how much leeway is legitimate before it's just a polite excuse. It has to handle the ratchet: something genuinely above-and-beyond last year becomes the baseline this year, and I want a rule for when that promotion is legitimate and when its just the company free-riding on praise. And the whole thing has to be usable by someone with zero philosophy background in the five minutes before they reply in a Slack thread, so plain words, plus say out loud wherever a step is really a value judgment wearing a procedure costume. One of the two case verdicts is going to make people mad -- tell me which and why.
reasoning: |-
  Okay, the user is a staff engineer who's been put in charge of the on-call and team expectations documents. They're dealing with inconsistent expectations where heroic efforts like late-night patches become the norm, while basic duties like mentoring are neglected without consequence. They need a clear, actionable framework to define what's required vs. optional.

  First, I need to address the core issue: distinguishing required duties from above-and-beyond actions. The user mentioned philosophical concepts like "saints and heroes" and their mirror categories. The key is to create a test that's practical for engineers to apply quickly. 

  The three tests should flow logically: Start with written rules (Test 1), then consider precedents (Test 2), and finally assess harm and capability (Test 3). Each test must have clear pass/fail criteria and verdict categories: required, not required, or required-with-leeway. 

  For Test 1, passing means the action is explicitly written as mandatory. Failing moves to Test 2. Test 2 checks if it's consistently treated as mandatory in practice. Passing makes it required-with-leeway since precedents can be fuzzy. Failing moves to Test 3. Test 3 asks if not doing it causes significant harm and if the person could reasonably do it. Passing makes it required, failing means not required. 

  Now applying this to the two cases. The 4am hand-patch: Fails Test 1 (not in docs) and Test 2 (initially praised, not punished). Passes Test 3? Urgent harm prevention, but only if feasible. Verdict: Required during true emergencies, but needing process change - this might frustrate heroes who see it as baseline. 

  Mentoring: Passes Test 1 ("should help" implies expectation). Fails strict requirement but gets required-with-leeway. This allows reasonable flexibility in how/when mentoring happens, preventing "not my job" excuses while accommodating schedules. 

  The ratchet effect is addressed in Test 2: If something praised becomes consistently expected without documentation, it gets promoted to required-with-leeway. This forces explicit recognition when normalizing heroics. 

  The mentoring verdict (required-with-leeway) will likely annoy those avoiding responsibilities, as it removes their loophole while allowing flexibility. The hand-patch verdict may frustrate chronic heroes by reframing their sacrifice as a process gap. 

  All tests use plain language. Test 2 explicitly flags it as a value judgment about precedents. The framework survives the ratchet by requiring consistent precedent to shift categories, and handles mentoring leeway by allowing reasonable implementation flexibility.
answer: |-
  Here are the five numbered items:

  1.  **Is it explicitly written as mandatory?** If yes: **Required**. If no: Go to Test 2. (Passing: Document states "must", "required", or clearly defines it as non-optional duty).
  2.  **Is it consistently treated as mandatory in practice?** If yes: **Required-With-Leeway** (acknowledges precedent overrules docs). If no: Go to Test 3. (Passing: Consistent expectation, consequence for avoidance. *Value Judgment: Assessing "consistent" requires looking at patterns, not single instances.*).
  3.  **Would not doing it *right now* cause significant, immediate harm AND could you reasonably do it?** If yes: **Required** (prevents imminent damage). If no: **Not Required**. (Passing: Urgent, critical harm prevention is possible & feasible).
  4.  **(a) 4am hand-patch:** Likely fails Test 1 (not routine), fails Test 2 (initial praise implies *not* baseline), *may* pass Test 3 (if truly urgent & only option). **Verdict:** Usually **Not Required**, but **Required** *only* under specific Test 3 conditions (genuine emergency, last resort). *This verdict will frustrate "heroes" who believe their sacrifice sets the new norm.*
  5.  **(b) Mentoring ("everyone should help"):** Passes Test 1 ("should" implies expectation), likely passes Test 2 (cultural norm, though spotty enforcement). **Verdict:** **Required-With-Leeway**. Failing *entirely* isn't acceptable, but individuals have reasonable choice in *how/when* they contribute (e.g., not every PR, but some effort).
