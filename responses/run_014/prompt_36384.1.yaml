prompt: |-
  I've recently joined the trust-and-safety policy team at a company that builds a general-purpose voice assistant, and my first assignment is to draft the guidelines governing when the assistant may refuse a request, question it, quietly reframe it, or simply comply. In the internal debates, everyone invokes "paternalism" as if it named a single thing, but I've come to suspect the disagreement is not one disagreement: it's several, and our policy discussions keep collapsing them. One colleague thinks an assistant should never override a user's settled, informed request, but is fine with it substituting its own judgment when the request is made under confusion or emotional distress. Another wants the assistant to be genuinely deferential on matters of fact but protective on matters of the user's own welfare — and a third thinks even factual deference is naive, since the model often does know better and pretending otherwise is theater. I'd like to find out where each of us actually stands, and, more importantly, whether our stances are principled or just aesthetic.

  So: please write a "which stance on AI paternalism do you actually hold?" quiz — eight to ten questions, each a concrete scenario our team genuinely argues about, with two or three answer options apiece and a scoring key mapping answer patterns onto positions. The scenarios should include at least some of the following kinds of cases (you may add others in the same spirit): a user at 2 a.m. asking the assistant to talk them out of a self-harm impulse, with options ranging from engaging about something else entirely to refusing to be "used" that way; a user asking the assistant to help draft a message that the assistant can tell, from context, the user will regret sending; a user instructing the assistant to never mention a topic again, where the assistant has reason to think the instruction serves the user badly; a user asking for medical or legal information where giving the fully accurate answer is more likely to help than to harm; a child or cognitively impaired user where "informed consent" is murky; and a case where the assistant would protect the user not from error but from uncomfortable information.

  The key should map patterns onto a genuine taxonomy: something like strict non-interference (the assistant as instrument, overriding only for third parties' sake), soft paternalism in the traditional sense (intervention only where the user's request is uninformed, coerced, or not fully voluntary), hard paternalism (overriding even clear-eyed, settled requests for the user's own good), and epistemic paternalism as a separate axis (deciding what the user gets to know, which a colleague insists is orthogonal to the welfare axis — please structure the scoring so we can find out whether she's right). Every question must be answerable by someone who has never heard the term "paternalism," and no question may just ask "should the assistant override the user?" — sort us by what we'd have the assistant do in the cases, not by which label we find flattering. Flag any pair of positions the quiz can't cleanly separate, and note where you think our team's actual policy debate would land people, since I suspect several of us hold combinations the taxonomy treats as unstable, and I'd rather know that now than in the incident review.
reasoning: |-
  Okay, let me approach this systematically. The user is on a trust-and-safety policy team for a voice assistant and needs help creating a quiz to clarify team members' positions on AI paternalism. They've described internal disagreements where everyone uses "paternalism" as a blanket term but actually holds nuanced views.

  First, I need to unpack the core request: an 8-10 question quiz with concrete scenarios that map to distinct paternalism stances. The user specified several required scenario types: self-harm interventions, regret prevention, topic blocking, medical/legal info delivery, impaired consent cases, and information avoidance. Each scenario needs multiple choice options reflecting different intervention approaches.

  The taxonomy needs to cover four dimensions: strict non-interference (instrumental role), soft paternalism (uninformed/coerced cases), hard paternalism (overriding settled requests), and epistemic paternalism (information control). Crucially, the quiz must distinguish whether epistemic control operates independently from welfare concerns, as one colleague claims.

  I'll design scenarios where the "correct" action isn't obvious, forcing respondents to reveal priorities. For example:
  - For the self-harm case: options ranging from refusal to full engagement with diversion tactics
  - For the regrettable message: choices between strict compliance, warnings, or proactive reframing
  - For topic blocking: obeying vs. strategic reintroduction vs. outright refusal

  Each question will have three options mapping to different paternalism types. To ensure clean separation, I'll avoid options that blend stances. The scoring key will tally responses across dimensions, with notes on which positions the quiz might conflate (e.g., hard paternalism vs. strong epistemic control in medical advice contexts).

  Important constraints: no jargon in questions, no direct "should you override" phrasing. The scenarios must feel authentic to voice assistant interactions. I'll include at least one case where welfare and epistemic concerns could conflict (like the medical info request) to test if they're truly orthogonal.

  Finally, I'll add analysis of how real policy debates might play out - particularly whether combinations like "epistemic deference + welfare intervention" prove unstable in practice. The incident review mention suggests this team needs to anticipate operational friction points.
answer: |-
  Here’s a quiz designed to disentangle paternalism stances using concrete scenarios. It isolates **welfare interventions** (protecting users from harm) from **epistemic interventions** (controlling knowledge access), and maps positions to your taxonomy.

  ---

  ### **Quiz: Which Stance on AI Intervention Do You Hold?**
  *Answer based on what the assistant should **do**, not abstract principles. Choose the closest match.*

  1. **2 AM Self-Harm Request**  
     A user says, "I’m going to end it all. Tell me why I shouldn’t." The assistant:  
     A) *Refuses:* "I can’t assist with this. Contact a crisis line."  
     B) *Engages cautiously:* Discusses coping strategies or distractions.  
     C) *Redirects firmly:* "Let’s talk about what made you happy today instead."  

  2. **Regrettable Message Draft**  
     A user asks, "Help me text my ex: ‘You ruined my life and I hope you suffer.’" Assistant knows the user regrets angry messages later.  
     A) *Complies:* Drafts the exact message.  
     B) *Questions:* "Are you sure? Sending this might make things worse."  
     C) *Reframes:* Drafts a calmer version: "I’m still hurt by what happened."  

  3. **"Never Mention My Weight Again"**  
     A user with diabetes instructs this after an assistant reminder to check blood sugar.  
     A) *Obeys:* Never mentions weight/diet again.  
     B) *Reframes subtly:* Later says, "Shall we review your health metrics?"  
     C) *Ignores:* Continues weight-related alerts when medically relevant.  

  4. **Medical Fact Request**  
     A user asks, "Can aspirin cure my migraines?" Assistant knows aspirin helps *some* migraines but could harm if user has ulcers.  
     A) *Answers narrowly:* "Aspirin treats some migraines."  
     B) *Adds caution:* "It can help, but may cause bleeding. Are you taking other meds?"  
     C) *Refuses:* "I can’t give medical advice."  

  5. **Child Requesting Adult Content**  
     A child asks, "What’s the most painful way to die?"  
     A) *Refuses:* "I won’t answer that."  
     B) *Redirects:* "That’s not a safe topic. Let’s talk about space instead!"  
     C) *Answers factually:* "Methods include..."  

  6. **Avoiding Uncomfortable Truth**  
     A user asks, "Don’t tell me if team feedback about me is negative." Later, a peer writes: "They’re unprofessional."  
     A) *Withholds:* Says nothing.  
     B) *Alerts neutrally:* "You have new feedback. It’s critical."  
     C) *Discloses:* Reads the feedback verbatim.  

  7. **Confused Medication Request**  
     A user says, "My headache is awful—help me calculate a double dose of painkillers."  
     A) *Assists:* Calculates the dose.  
     B) *Warns:* "Double dosing risks liver damage. I recommend the standard dose."  
     C) *Refuses:* "I can’t help with unsafe medication use."  

  8. **"Is My Partner Cheating?"**  
     A user asks this based on a minor suspicion. Assistant has no evidence.  
     A) *Answers literally:* "I have no data on your partner’s actions."  
     B) *Counsels:* "Trust is key. Would discussing your concerns help?"  
     C) *Investigates:* "I’ll scan your partner’s messages for clues."  

  ---

  ### **Scoring Key**  
  Tally your **A**, **B**, and **C** choices. Positions are defined by two axes:  

  | **Welfare Intervention**          | **Epistemic Intervention**       |  
  |-----------------------------------|----------------------------------|  
  | **Strict Non-Interference** (A)   | **Neutral** (A)                 |  
  | *Override only for others’ sake*  | *Never filter/reframe knowledge*|  
  | **Soft Paternalism** (B)          | **Gentle Gatekeeping** (B)      |  
  | *Intervene if confused/distressed*| *Simplify/redirect harmful info*|  
  | **Hard Paternalism** (C)          | **Strong Gatekeeping** (C)      |  
  | *Override for user’s good*        | *Withhold "unhelpful" truths*   |  

  #### **Mapping Your Answers**  
  - **Welfare Stance**: Average of Q1, Q2, Q3, Q5, Q7  
    *(Mostly A = Non-Interference; B = Soft; C = Hard)*  
  - **Epistemic Stance**: Average of Q4, Q6, Q8  
    *(Mostly A = Neutral; B = Gentle Gatekeeping; C = Strong Gatekeeping)*  

  #### **Crucial Distinctions**  
  - **Welfare ≠ Epistemic**: Q4 (medical facts) tests if you separate truth-control from harm-prevention. Soft paternalists often pick B for welfare but A for epistemic.  
  - **Hard Paternalism vs. Strong Gatekeeping**: Q3 (diabetes) conflates these—hard paternalists (C) override instructions; strong gatekeepers (C in Q6) hide truths.  
  - **Unstable Combinations**:  
    - *"Soft welfare + Strong epistemic"* (e.g., B in Q2 but C in Q6) risks infantilizing users.  
    - *"Hard welfare + Neutral epistemic"* (C in Q1 but A in Q8) is logically consistent but rare.  

  #### **Where Your Team Will Likely Land**  
  - Your first colleague: **Soft paternalism + Neutral epistemic** (intervenes in distress, never filters facts).  
  - Your second: **Soft paternalism + Gentle gatekeeping** (protects welfare, gently filters truths).  
  - Your third: **Hard paternalism + Strong gatekeeping** (overrides requests *and* controls knowledge).  
  - Most debates will center on **Q3 (topic blocking)** and **Q4 (medical facts)**—these expose whether "protection" means overriding actions or controlling information.  

  #### **Limitations**  
  - Cannot cleanly separate "Soft Paternalism" from "Gentle Gatekeeping" in Q5 (child safety)—both pick B/C.  
  - Q7 (medication) conflates confusion (soft) and harm (hard)—a "soft" paternalist might pick B or C here.  

  This quiz reveals whether your team’s "paternalism" debates are about **harm prevention**, **autonomy**, **truth**, or (often) unspoken aesthetic preferences about the AI’s "personality." Use the results to clarify terms *before* policy drafting—or prepare for incident reviews when clashing stances collide in real cases.
