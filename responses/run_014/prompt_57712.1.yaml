answer: |-
  Right, let's crack on. No polishing, no diplomacy - just the structural assessment you asked for. Your skeleton's provocative, but I've serious reservations about whether it holds weight. Here's the verdict on each point, with confidence levels (1-10, 10 being rock-solid).

  **Overall Verdict on the Last-Author Principle (LAP):**  
  It’s **not doing enough unique work** to justify the framework. It risks being a relabelling exercise that dodges the core metaphysical problem rather than solving it. Confidence: **8/10** that it’s not novel or robust enough as presented.

  ---

  **Section-by-Section Breakdown:**

  ### 1. Setup & Friend’s Objection  
  - **Assessment:** Your summary of the "dead hand" critique is spot-on and exposes the real tension. The metaphysics *do* undermine the "same person" justification.  
  - **Confidence:** **9/10** - This is the strongest part; you’ve nailed the problem.  

  ### 2. The Last-Author Principle (LAP)  
  - **Assessment:** Here’s where it unravels. **Authority from "authorship" without persistent identity is incoherent.** If the later self is truly gone ("no carry-over... nothing that can be frustrated"), the earlier self’s "authorship" is irrelevant. Authority implies a *subject* to whom deference is owed. LAP replaces this with a *procedural* rule ("default to the last competent voice"), but dresses it as moral authority. That’s a category error.  
  - **Confidence:** **7/10** - The principle collapses under its own premises.  

  ### 3. What LAP Explains  
  - **Assessment:** LAP *describes* intuitions (e.g., resisting young directives, privileging refusals) but doesn’t *explain* them better than existing frameworks. Dworkin's critical interests or narrative unity accounts handle the 25yo/80yo case cleanly: the 80yo retains critical interests. Refusals feel stronger because they prevent violation; demands impose positive action. The "same-person" distraction point is fair, but LAP doesn’t resolve it—it just ignores personhood entirely.  
  - **Confidence:** **8/10** - LAP is descriptive, not explanatory.  

  ### 4. The Vacuum Objection & Trustee Analogy  
  - **Assessment:** Your friend is **absolutely right**. If authority stems from the *absence* of a subject, it’s not about respecting *that subject’s wishes*—it’s about filling a decision-making void. The trustee analogy **smuggles in identity**: trusts work *because* the settlor and beneficiary are legally (and often phenomenologically) continuous. Your "last author" isn’t a "settlor" for a *different* beneficiary; they’re a ghost. A non-smuggling version? You’d need to ground it in **social necessity/practical reason** (e.g., "We honour LAP because we need *some* rule to avoid chaos or exploitation"). But that’s not about *authority*; it’s about *administration*.  
  - **Can the vacuum objection be met?** **Not within your framework.** If the demented patient isn’t the "author," and no persistent self exists, honouring the directive is *ritual*, not respect.  
  - **Confidence:** **9/10** - The objection is fatal to LAP as a moral principle.  

  ### 5. Collapse into Dworkin  
  - **Assessment:** It’s **worse than an embarrassment**—it’s **fatal** to your originality claim. "Organising a life as a whole" **is Dworkin's critical interest in plain English**. The only difference is you’ve stripped out the metaphysical grounding (narrative unity/persisting interests) that makes Dworkin coherent. Without that, "authorship" is an empty shell. You can’t have "critical interests" without a *subject* whose interests they are, even if fragmented.  
  - **Confidence:** **10/10** - This is Dworkin without the foundations.  

  ---

  **The Brutal Summary:**  
  **The essay can’t be written as posed.** Your framework is confused in two fundamental ways:  
  1. **Authorship ≠ Authority:** You sever "authorship" from any persistent entity that could hold authority, reducing it to a timestamp on a document. Authority requires a subject.  
  2. **The Trigger Contradiction:** A principle triggered by the *disappearance* of the subject cannot logically derive authority *from* that subject. It’s a procedural stopgap, not moral deference.  

  **Why This Feels Circular:**  
  LAP *is* a relabelling. It avoids the "same person" debate by declaring the last author sovereign *by default*—but this doesn’t resolve the tension; it just asserts a new rule. The deadlock isn’t broken; you’ve chosen a side ("honour the directive") and invented a justification that ignores why the deadlock exists.  

  ---

  **What Could Salvage This?**  
  If you pivot hard:  
  - **Drop "authority"** → Frame LAP as a *practical heuristic* for when we lack epistemic/moral access to the current self.  
  - **Concede the vacuum** → Argue that honouring directives is about *our* duties (to avoid arbitrariness, uphold dignity-as-previously-understood), not the patient’s authority.  
  But this guts your core claim.  

  **Final Confidence:**  
  - LAP as moral authority: **0/10** (It implodes).  
  - LAP as practical rule: **6/10** (Plausible, but unoriginal).  

  Tell your friend she won the argument. Now write the essay *about why she’s right*, and you’ll have a cracker. If you force this skeleton, it’ll collapse under scrutiny. Hard truths—but you asked for them.
