answer: |-
  That's a brilliant and deeply relevant question. Anscombe's core argument in "Mr. Truman's Degree" is indeed a powerful critique of *intentionally* targeting civilians as inherently murderous, placing such acts outside the bounds of legitimate warfare ("just belligerency") and into the realm of mass murder. Applying this framework to modern drone warfare is complex, but here's how I believe she would likely analyze it, based on her principles:

  **Anscombe's Core Distinction (War vs. Murder):**

  1.  **Discrimination (Non-Combatant Immunity):** The *primary* moral line is between targeting combatants and targeting non-combatants. Intentionally killing non-combatants is murder, full stop. It cannot be justified by military necessity or good intentions.
  2.  **Authority & Justice:** Legitimate acts of war require:
      *   **Proper Authority:** A sovereign state acting within its legitimate role.
      *   **Just Cause:** A genuinely defensive or restorative purpose.
      *   **Due Process (Implicitly):** Actions should ideally align with some form of law and accountability, even in war. Secretive, unaccountable killing raises profound justice issues.
  3.  **Intention vs. Foreseen Consequence:** Killing non-combatants as a *foreseen but unintended side effect* of a legitimate military strike *might* be permissible under the doctrine of double effect (DDE), **if**:
      *   The act itself is good or neutral (targeting combatants/military objective).
      *   The bad effect (civilian deaths) is not intended.
      *   The good effect is not achieved *through* the bad effect.
      *   There is a proportionate grave reason for permitting the bad effect.

  **Applying to Modern Drone Strikes:**

  1.  **"Precise" Targeted Killings of Specific Named Terrorists (e.g., al-Awlaki):**
      *   **Potential Legitimacy under DDE?** *If* the target is a genuine combatant (actively planning/conducting attacks) and the strike is conducted with minimal foreseeable civilian casualties, Anscombe *might* see this as falling within the realm of legitimate warfare, analogous to a sniper taking out an enemy officer in a traditional conflict. The *intention* is to kill a combatant, civilian deaths are (ideally) minimized and unintended.
      *   **Anscombe's Likely Major Objections:**
          *   **Extra-Judicial Nature & Lack of Due Process:** This is critical. Killing a specific individual, especially a citizen, without trial, outside a declared war zone, by a covert agency (CIA), radically undermines the "Proper Authority" and "Justice" elements. She would likely see this as **state-sponsored assassination/murder**, not legitimate warfare. Where is the evidence presented? Where is the defense? Who holds the killers accountable? This bypasses the legal and moral structures that distinguish state violence from murder.
          *   **"Imminence" and Definition of Combatant:** How broadly is "combatant" defined? Is someone merely expressing ideology or associated with a group truly an *active* combatant posing an *imminent* threat justifying lethal force without trial? Anscombe would demand a very high, clear bar.
          *   **Sovereignty:** Conducting strikes on the territory of other nations without their consent (or public knowledge) further complicates the "Proper Authority" claim.

  2.  **Signature Strikes (Targeting Based on Behavior Patterns, Unknown Identity):**
      *   **Anscombe's Likely Verdict: Murder.** This practice would almost certainly trigger her strongest condemnation, aligning it more closely with the atomic bomb criticism than with legitimate warfare.
      *   **Why:**
          *   **Indiscriminate by Design:** Targeting based on patterns inherently lacks the discrimination required by the non-combatant immunity principle. It intentionally accepts a high risk (often a certainty) that non-combatants will be killed *because their identity and status are unknown*. You cannot *intend* to kill a combatant if you don't know who the person is. The attack is based on suspicion and behavior, not confirmed combatant status.
          *   **Violation of DDE:** The act itself (killing unknown individuals based on patterns) is not morally neutral or good; it presumes guilt without evidence. The "good effect" (killing a potential combatant) is achieved precisely *through* the willingness to kill unknown individuals (the bad effect). This violates the core conditions of double effect.
          *   **Secrecy & Lack of Accountability:** The covert nature exacerbates the injustice, removing any semblance of due process or public accountability. It's killing based on secret criteria and intelligence.

  **Synthesis: How Her Distinction Works Here**

  *   **The Atomic Bomb Analogy:** For Anscombe, Hiroshima/Nagasaki were the epitome of indiscriminate, intentional mass murder of non-combatants. Signature strikes, while smaller in scale per incident, share the *moral structure*: the *method* (targeting without knowing identity) inherently fails discrimination and accepts non-combatant deaths as part of the plan. They are "micro-massacres."
  *   **"Precise" Targeted Killings:** These are morally distinct from Hiroshima in terms of *scale* and *discrimination effort*. However, they often fail Anscombe's test due to the **procedural injustice** (extra-judicial, secretive nature) and potentially slippery definitions of "combatant." She might see them as closer to assassination (murder by the state) than legitimate acts of war, especially when conducted by intelligence agencies outside declared battlefields against citizens.
  *   **The Core Issue Isn't Just Precision, It's Justice:** Anscombe wouldn't be satisfied solely by technological precision. For her, the *moral legitimacy* of killing in war hinges fundamentally on:
      1.  **Discrimination:** Only targeting genuine combatants (known, identified, posing a threat).
      2.  **Proper Authority & Due Process:** Actions taken by legitimate state organs within a framework of law and accountability, even if expedited in wartime. Covert, unaccountable killing by agencies like the CIA inherently lacks this.
      3.  **Clear Intention:** The *aim* must be combatant death, with non-combatant death only an unintended, proportional side effect.

  **Conclusion:**

  While Anscombe would likely see modern "precise" drone strikes targeting identified combatants as *less monstrous* than the atomic bombings and signature strikes (because they attempt discrimination), she would almost certainly condemn the **extra-judicial, secretive framework** within which they are often conducted (especially by the CIA) as **state-sponsored murder**. The lack of due process, public accountability, and clear legal boundaries violates the principles of justice and proper authority essential to legitimate belligerency.

  Signature strikes, however, would be unequivocally condemned as **indiscriminate murder**, sharing the core moral flaw of the atomic bombings: the willingness to kill without knowing who the victims are, inherently accepting non-combatant deaths as part of the method. For Anscombe, the distinction between war and murder isn't blurred by technology; it's defined by adherence to fundamental moral principles concerning intention, discrimination, and justice. Modern drone warfare, particularly its covert aspects, would likely appear to her as a dangerous erosion of those principles, enabling new forms of state-sanctioned killing that skirt the line of (or cross into) murder.
