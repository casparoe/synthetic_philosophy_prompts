  Okay, the user teaches an upper-level seminar on rationality and practical reason. They have about 16 students and one 75-minute session. They want an in-class activity that introduces Parfit's hitchhiker and the problem of rational irrationality without naming them first. The core problem involves a rescuer who only helps if you promise to pay later, but once rescued, you have no self-interested reason to pay. If you're transparently rational, the rescuer won't pick you up, so it seems rational to make yourself irrational or bind yourself in advance. But can you do that on the spot?

