  Okay, let me unpack this user's query. They're describing a pattern in arguments where someone starts with a claim about a "free-floating" reason—like "there's a reason to preserve forests"—without specifying for whom. Then, without justification, they slide into claiming that a specific agent (e.g., Norway) has that reason. The user notes this isn't just agent-neutral vs. agent-relative; it's about the unattached reason suddenly binding to someone.

  First, I need to recall philosophical frameworks. Scanlon's reasons fundamentalism comes to mind—he treats reasons as primitive, objective entities. But the user points out that even if reasons exist objectively, their application to specific agents requires more. For example, a moral reason to reduce emissions doesn't automatically bind Norway without considering its capacities, roles, etc. 

  The user mentions this occurs in climate ethics, epistemology, and everyday arguments. In epistemology, "evidence supports P" might be presented as detached, then used to demand a jury's belief. But juries have institutional roles; their reasons aren't just about abstract evidence. The slide ignores contextual filters.

  I should check if this is a named fallacy. The is-ought gap doesn't fit—both statements are normative. Agent-neutral reasons (like Parfit's) can apply to all, but the user's case involves an unjustified leap to specific agents. That leap is the crux. 

  Dancy's particularism emphasizes context, which opposes the unargued slide. The user's description aligns with what I'd call "normative force projection"—taking an objective reason and projecting its force onto an agent without mediation. But is there a standard term? After searching memory, I'm not sure. Philosophers critique this move but lack a universal label. 

  The confidence breakdown: High certainty that the core issue is unjustified transition from detached to agent-bound reasons. Medium on labeling it "unmediated normative transmission" or similar. Least sure about existing terminology—maybe "fregean detachment" as a stretch, but it's speculative. User needs clarity on why it's invalid: objective reasons require bridging principles (roles, capacities) to bind specific agents. Examples show ignoring this leads to flawed demands, like expecting a poor country to sacrifice as much as a wealthy one. Highlighting the "normative gap" concept is key. 

  User's deeper need: They likely want to articulate this flaw in debates and seek philosophical backing. Providing structure to their observation—distinguishing it from adjacent concepts—validates their intuition. They might also appreciate diagnostic tools to counter such arguments.
answer: |-
  Based on your meticulous description, I recognize this pattern immediately. It's a sophisticated and pervasive form of equivocation that exploits ambiguities in normative language, particularly concerning the metaphysics and epistemology of reasons. While no single universally agreed-upon label exists (it's often subsumed under broader critiques), the most precise characterization is:

  **The Fallacy of Unmediated Normative Transmission / The Normative Gap-Leap**

  **Diagnosis & Standard Philosophical Mapping:**

  1.  **The Core Move: From Detached Normative Fact to Agent-Bound Obligation/Reason:**
      The argument relies on an implicit, unargued-for step bridging two distinct types of normative claims:
      *   **Claim 1 (Detached Normative Fact):** "There is a reason R (to φ)" or "The balance of considerations supports φ-ing." This asserts the existence of a *pro tanto* normative consideration *in the abstract*, often presented as an objective, agent-neutral fact about the world (e.g., "Reducing emissions promotes the good," "This evidence probabilifies guilt"). Philosophers like T.M. Scanlon ("Reasons Fundamentalism") or Derek Parfit (on agent-neutral reasons) might defend such claims as objective normative truths.
      *   **Claim 2 (Agent-Bound Normative Status):** "Therefore, *specific agent A* has a reason to φ" or "*Specific agent A* ought to φ." This assigns the normative force *to a particular entity* within their specific context, capacities, roles, and existing commitments.

      **The Gap:** The existence of a detached normative fact (R) does not *automatically* entail that any *particular* agent (A) has R *as their reason*. Several mediating factors are typically required but are omitted:
      *   **Epistemic Access:** Does A *know* or *rationally believe* the premises establishing R?
      *   **Relevance & Salience:** Is R *salient* or *relevant* to A's deliberation given A's role, projects, relationships, or the specific context? (Jonathan Dancy's "Particularism" highlights context-dependence).
      *   **Capacity & Enablement:** *Can* A φ? Does A have the physical, cognitive, financial, or institutional capacity? (Amartya Sen's "capability approach" and debates about "ought implies can" are relevant).
      *   **Role-Obligations & Standing:** Is it *A's place* to respond to R? Does A have a specific role-based duty (e.g., juror, government official) that makes R binding *for them*, even if others are aware of R? (Judith Jarvis Thomson, Stephen Darwall on second-personal reasons).
      *   **Competing Reasons & Weight:** How does R interact with *other* reasons A has? The detached fact "There is a reason R" doesn't specify R's *weight* relative to A's other commitments.

      **Confidence:** **High.** This gap and the necessity of mediation are well-established in meta-ethics, normative ethics, and epistemology. The move from "objective reason exists" to "you (specific agent) have this reason" without addressing these factors is widely recognized as invalid.

  2.  **Distinguishing from Nearby Concepts:**
      *   **Agent-Neutral vs. Agent-Relative:** You correctly note the distinction. Agent-neutral reasons (e.g., "Pain is bad, so there's reason to reduce it") *can* apply to all agents, but their *application* still requires the mediating factors above (e.g., *Can* I reduce this pain? Is it *my* responsibility?). The fallacy occurs when the agent-neutral reason's existence is taken as *sufficient* for its application to any specific agent without mediation. Agent-relative reasons (e.g., "I promised, so *I* have a reason") already specify the agent, avoiding this gap.
      *   **Naturalistic Fallacy / Is-Ought Gap:** Correct distinction. Both claims are normative. The fallacy here is *within* normative reasoning, between different *types* of normative claims.
      *   **"View from Nowhere" (Nagel):** This is the *stance* or *method* of striving for objectivity. The fallacy is an *argumentative error* committed *from within* or *using* that stance, mistaking the objective normative fact discovered for an immediately binding prescription upon specific agents.
      *   **Reification / Hypostatization:** There's an element of this – treating "reason" as a free-floating object. However, many realists (Scanlon, Parfit) *do* believe reasons are objective entities. The fallacy isn't necessarily in believing reasons exist objectively, but in the invalid inference about their bindingness on specific agents.
      *   **Scope Neglect / Universalizability Misapplication:** Related, but more specific. Universalizability ("If it's right for one, it's right for all in similar circumstances") is a test for maxims. The fallacy assumes that the existence of a detached reason *is* the circumstance that automatically makes it "similar" for all agents, neglecting the crucial mediating factors that make circumstances *dis*similar.

  3.  **Why the Slide is Tempting and Does Argumentative Work:**
      *   **Rhetorical Force:** Claim 1 ("There's a reason...") sounds objective, authoritative, and impersonal, lending weight to the argument. Claim 2 leverages this authority to pressure the specific agent.
      *   **Metaphysical Simplification:** It avoids messy questions about epistemic limitations, capacities, conflicting duties, and roles. It presents normativity as clean and algorithmic.
      *   **Impartiality Pretense:** It masks partial demands (e.g., "Norway *must* act") behind the facade of impersonal objectivity ("The reason is just *there*").
      *   **Epistemic Convenience:** In contexts like "the science says," it collapses the distinction between what the evidence *indicates* (a detached fact) and what a specific actor (e.g., a policymaker with competing constraints) *ought to do* based on it.

  4.  **Standard Critiques and Labels Philosophers Use:**
      *   **Bernard Williams ("Internal vs. External Reasons"):** This is the *closest* established framework. Williams argued that a reason for an agent must be *internal* – it must be capable of motivating them via their "subjective motivational set" (SMS). Claim 1 often posits an *external reason* ("There is a reason R"). The fallacy occurs when Claim 2 asserts A has R *as a reason* without showing how R connects to A's SMS or why an external reason *should* be considered internal for A. **Label Suggestion: "Illegitimate External-to-Internal Reason Slide." Confidence: High this is the *core philosophical issue*.**
      *   **"Normative Transmission Failure":** (Used broadly in critiques of applied ethics/policy) Highlights the failure to demonstrate *how* the general norm transmits to the specific case/agent.
      *   **"The Agglomeration Fallacy" or "Monolithic Normativity Fallacy":** (Less common) Treats the detached reason as having a singular, undifferentiated force that automatically aggregates onto any agent, ignoring the distributive problem.
      *   **Critiques of "Ideal Theory":** Critics (e.g., Charles Mills, Elizabeth Anderson) argue that theories starting from abstract normative principles often fail to account for real-world constraints (epistemic, material, historical) when applying them, leading to invalid demands on specific agents – closely mirroring your observation.

  **Confidence Breakdown & Least Sure Point:**

  *   **High Confidence:** That this is a distinct, identifiable, and fallacious pattern of reasoning central to debates in meta-ethics, practical reasoning, and applied philosophy. The core error is the *unargued leap* from the existence of an objective/pro tanto normative consideration to its bindingness on a specific agent without necessary mediation (epistemic, practical, role-based). Bernard Williams' internal/external reason distinction provides the most robust philosophical framework for diagnosing it.
  *   **Medium-High Confidence:** In differentiating it from the nearby concepts you mentioned (agent-neutral/relative, is-ought, view from nowhere). It exploits the *language* of agent-neutrality but commits a distinct inferential error.
  *   **Medium Confidence:** In the label "Fallacy of Unmediated Normative Transmission" or "Normative Gap-Leap." While descriptive and used implicitly in critiques, it's not a single, universally codified term like *ad hominem*. "Illegitimate External-to-Internal Reason Slide" (based on Williams) is philosophically precise but clunky.
  *   **Lowest Confidence (The Point I'm Least Sure About):** Whether there exists a **single, universally recognized, catchy label** like "naturalistic fallacy" for *this specific slide*. Philosophers *constantly* point out this error, especially in applied contexts (e.g., "You can't just jump from 'emissions are bad' to 'Norway must shut down oil *now* without considering X, Y, Z'"), and Williams gave it a foundational framework. However, it's often discussed as an instance of failing to meet the demands of Williams' internalism, or as a failure of application in non-ideal theory, or simply as bad reasoning in context, rather than having its own unique, universally agreed-upon name like "straw man." **You've identified a pervasive argumentative *move* that is well-understood and criticized within philosophy, but its naming is less standardized than its diagnosis.**

  **In essence:** You've pinpointed a crucial flaw where the *impersonal authority* of an asserted objective reason is illicitly used to *impose* a specific obligation on an agent, bypassing the essential questions of *their* relation to that reason. Calling it the **"Fallacy of Unmediated Normative Transmission"** or **"Normative Gap-Leap"** accurately captures the core error, with Bernard Williams' "Illegitimate External-to-Internal Reason Slide" being the most precise philosophical characterization. Its power lies in its ability to disguise a demanding particular conclusion within the cloak of impersonal objectivity.
