prompt: |-
  I'm a novelist and I've got a problem that sounds like craft but is actually metaphysics. My narrator is 71 and keeps circling back to what she did at nineteen, and every time I hit one of those passages I have to decide what her "I" is picking up: the whole person stretched across fifty years, or just the old woman at the kitchen table, with the girl as a seperate thing she used to be. I know endurantism and perdurantism are supposed to come out the same on nearly everything observable, which is exactly why I can't just lift the debate into the book.

  So write me a decision procedure I can run on each of these scenes — there's maybe a hundred of them, and the ending depends on getting the last one right. It has to work for me and my co-writer, who's never taken a philosophy class, so plain language only: no talk of temporal parts or worldlines in the tests themselves, just ordinary questions about who owes what to whom, whether an apology from her can be accepted, whether the girl or the woman is the one who was wronged, whose name goes on the deed. Each test should be answerable in five minutes with the manuscript open, and the procedure has to say out loud where the metaphysics genuinely forces my hand and where it's only voice and I'm free to choose.

  Then run it on three scenes: one where she's proud of the younger self, one where she's ashamed and half-wants to disown her, and one where she takes credit for something the nineteen-year-old did that the seventy-one-year-old would never do now. One of the three has to come out against what I want — if it never tells me no, it isn't a procedure. Finish with what it can't settle.

  Gaurd rule: don't let the answer collapse into "perdurantists write she, endurantists write I." If that really is all there is, say so and explain why, but the tests should be keyed to responsibility and ownership, not pronoun aesthetics.
reasoning: |-
  Okay, the user is a novelist struggling with a metaphysical problem about identity across time. Their narrator is 71 and constantly reflects on her 19-year-old self. The core issue is deciding whether the "I" in these passages refers to the whole person across time or just the present self remembering a past version. They mention endurantism (same whole self through time) versus perdurantism (different temporal parts), but can't lift the debate directly into the book. 

  They need a practical decision procedure for about 100 scenes that must:
  - Be usable by their philosophy-naive co-writer
  - Use plain language about responsibility/apology/ownership
  - Give clear answers in 5 minutes per scene
  - Explicitly flag where metaphysics forces choices vs where it's stylistic
  - Include tests that sometimes contradict the writer's preference
  - Handle three sample scenes (proud, ashamed, taking credit)
  - End with what the procedure can't settle
  - Avoid reducing to pronoun rules ("she" vs "I")

  Hmm... this is fascinating. The user's frustration with philosophy being "observationally identical" is key - they need stakes. The guard rule shows they've already spotted the superficial pronoun trap. Their examples suggest they want moral/legal tension: apologies, deeds, disowning actions. 

  For the procedure, I'll build tests around:
  - Responsibility (who answers for the act)
  - Continuity (who inherits consequences)
  - Ownership (who claims/denies the act)
  - Debt (who owes reparations)

  Each test forces a "same self?" question without philosophy jargon. The bankruptcy test is clever - can you discharge moral debts to yourself? The deed test makes identity concrete via legal ownership. 

  For the sample scenes:
  1. Proud moment (easy "same self" - tests align)
  2. Ashamed moment (should force "same self" even if user wants disowning - the apology test blocks escape)
  3. Taking credit (forces "different selves" when user wants continuity - bankruptcy test exposes hypocrisy)

  The can't-settle section is crucial. Voice and narrative distance are beyond metaphysics - that's where craft lives. The user needs permission to choose when tests conflict or feel wrong. 

  Biggest risk is oversimplifying - but their guard rule shows they'll catch that. I'll emphasize that metaphysics only bites when responsibility/debt are at stake, elsewhere it's free choice. The three examples prove the procedure has teeth by contradicting user preferences in 2/3 cases.
answer: |-
  Here's a bulletproof decision procedure designed for your novel. It focuses on practical consequences of identity over time, using plain language tests. Metaphysics only forces your hand when responsibility, ownership, or debt are concrete and unresolved.

  **The Decision Procedure: "The Responsibility Ledger"**

  1.  **Identify the Core Action:** What specific thing did the 19-year-old *do* (or experience) in this passage? (e.g., "stole the money," "won the award," "signed the contract," "was assaulted").
  2.  **Ask the Ledger Questions (Answer Yes/No/Unclear):**
      *   **A. The Apology Test:** *If the 19-year-old harmed someone with this action, could the 71-year-old offer a *meaningful apology* **instead of** the 19-year-old?* (Does the victim need *that specific person* to apologize, or will the "current version" suffice?)
      *   **B. The Debt Test:** *If the 19-year-old incurred a debt (moral, legal, financial) with this action, is the 71-year-old *obligated* to pay it?* (Can the old woman tell the creditor, "That was a different person, talk to her"?)
      *   **C. The Claim Test:** *If the 19-year-old achieved something positive (fame, property, a skill), does the 71-year-old have the *right* to claim it as her own?* (Can the old woman say "**I** earned that," or must she say "*She* earned that"?)
      *   **D. The Bankruptcy Test:** *Could the 71-year-old declare "moral bankruptcy" regarding the 19-year-old's actions, legally or socially severing responsibility?* (Is this like disowning a troublesome child, or is it impossible because it's *her*?)
      *   **E. The Deed Test:** *If the action resulted in tangible property, whose name *must* be on the deed/record?* (Only the 19-year-old's name from that time? The 71-year-old's current name? Both?)
  3.  **Interpret the Ledger:**
      *   **If ANY of A, B, D is "No":** Metaphysics forces your hand. The 19-year-old and 71-year-old are **distinct entities** for the purpose of *this specific action's consequences*. The "I" in the narrative passage describing *the action itself and its immediate consequences* **must refer primarily to the past self.** You likely need "she" or clear distancing language.
      *   **If ANY of C, E is "No":** Metaphysics forces your hand. The 19-year-old and 71-year-old are **distinct entities** for the purpose of *this specific gain/ownership*. The "I" claiming the benefit **cannot be the old woman solely**; it must acknowledge the past self or use "she".
      *   **If ALL answers are "Yes" OR "Unclear" dominates:** Metaphysics **does not force your hand**. The sense of continuous identity ("I") is viable. Voice, narrative distance, character psychology, and thematic needs determine the pronoun/connection. Choose what serves the story best.
      *   **If Answers Conflict (e.g., A=Yes, B=No):** **Metaphysics forces distinction.** The ledger shows inconsistency in treating the selves as one. The "I" likely needs careful framing or distancing for the conflicting aspects. Lean towards distinction for the conflicted test(s).
  4.  **Voice Freedom:** *Only* when the ledger shows **no forced distinction** (All Yes/Unclear) are you completely free to choose "I" for deep identification or "she" for distance based purely on the *narrator's current feelings* (pride, shame, nostalgia) or the *desired narrative effect* (immediacy vs. reflection).

  **Running the Tests (5 mins with manuscript):** Open to the passage. Identify the Core Action (1 min). Rapidly answer A-E based on the *concrete implications within your story world* (3 mins). Apply the Interpretation rules (1 min). Note forced decisions or voice freedom.

  ---

  **Testing the Procedure on Your Scenes (One Must Say No):**

  1.  **Scene: Proud of Younger Self (e.g., She stood up to a bully at 19)**
      *   Core Action: 19yo confronted the bully.
      *   Ledger:
          *   A. Apology Test: *Could 71yo apologize *for* the 19yo?* N/A (No harm done) or **Yes** (if bully was wronged? Unlikely in pride scene). **Unclear/Yes.**
          *   B. Debt Test: *Does 71yo owe anything for this?* **No** (Positive action).
          *   C. Claim Test: *Can 71yo say "I stood up to him"?* **Yes.**
          *   D. Bankruptcy Test: *Can 71yo disown this action?* **No.** (She *wants* to claim it).
          *   E. Deed Test: *If it earned respect, whose name is on it?* **71yo's (implied).**
      *   **Interpretation:** Mostly Yes/Unclear. **No metaphysical distinction forced.** You are FREE to choose "I" (deep identification with past bravery) or "she" (viewing past self fondly) based on voice and how present the pride feels. *Procedure allows desired "I".*

  2.  **Scene: Ashamed, Wants to Disown (e.g., She betrayed a friend at 19)**
      *   Core Action: 19yo betrayed her friend.
      *   Ledger:
          *   A. Apology Test: *Could 71yo apologize *instead of* the 19yo?* **No.** The friend likely needs an apology from the *person who did the deed*, the 19-year-old *she was*. "I'm sorry *she* did that" is inadequate. The 71yo must apologize *as the person who did it*.
          *   B. Debt Test: *Does 71yo owe amends?* **Yes.** (Moral debt persists).
          *   C. Claim Test: *Can 71yo claim the betrayal as hers?* **Yes** (but painfully).
          *   D. Bankruptcy Test: *Can 71yo legally/socially disown responsibility?* **No.** Society holds her accountable.
          *   E. Deed Test: N/A (Negative action).
      *   **Interpretation:** A=**No**, B=**Yes**, D=**No**. **Metaphysics FORCES distinction.** Especially A & D. The "I" describing *the betrayal itself* must refer to the past self ("*I* was cruel then," feels continuous but painful) or use "she". The 71yo narrator cannot treat the 19yo *as a separate person she bears no responsibility for* when describing the act. *Procedure forces distinction (likely "she" or a pained "I"), AGAINST the desire to disown.*

  3.  **Scene: Takes Credit for Something 19yo Did (e.g., Wrote a brilliant, reckless manifesto at 19)**
      *   Core Action: 19yo wrote the manifesto.
      *   Ledger:
          *   A. Apology Test: *Could 71yo apologize *instead of* the 19yo?* **Yes** (If it caused harm, the 71yo *as the author* would need to apologize).
          *   B. Debt Test: *Does 71yo owe anything?* **Yes** (If it caused harm, she's liable. If not, N/A).
          *   C. Claim Test: *Can 71yo say "I wrote that"?* **Yes.**
          *   D. Bankruptcy Test: *Can 71yo disown the manifesto?* **Yes/No?** *This is the key conflict.* She *wants* credit (C=Yes) but might *want* to avoid current consequences (B). **Can she legally/socially say "That reckless kid wrote it, not me"? Likely NO.** The copyright, the fame, the blame – they attach to *her* legal identity.
          *   E. Deed Test: *Whose name is on the copyright/deed?* **71yo's current name (legally).**
      *   **Interpretation:** C=Yes, E=Yes, **BUT** D=**No** (She cannot *legally/socially* disown it). A and B=Yes imply continuity of responsibility. **Metaphysics FORCES continuity (the "I") for claiming credit *because* she cannot disown the responsibility (D=No).** She doesn't get to say "She wrote it" to claim the brilliance while saying "I am not her" to avoid the recklessness. Taking credit *requires* accepting the underlying identity. *Procedure forces "I" for taking credit, AGAINST the wish to distance the recklessness.*

  ---

  **What the Procedure CANNOT Settle:**

  1.  **The Texture of Memory:** *How* the 71yo *feels* about that "I" or "she" – the warmth, coldness, distance, intimacy, confusion, or certainty. This is pure voice and psychology.
  2.  **Narrative Distance:** How close or far the narrator positions herself *emotionally* from the past event, *even when identity is continuous*. She can say "I was such an idiot" (continuous, judgmental) or "She was so passionate" (distinct, perhaps wistful) – *if* the ledger allows choice.
  3.  **The "Why" of Change:** *Why* the 71yo wouldn't do it now – wisdom, fear, fatigue, different values? Explaining the change doesn't hinge on the metaphysics of identity itself.
  4.  **Thematic Weight:** Whether the connection or disconnection is presented as tragic, liberating, natural, or illusory. The procedure tells you where you *can't* choose a certain framing, not which framing is *better* where choice exists.
  5.  **Unresolved Debts/Ownership:** If the ledger answer is genuinely "Unclear" (e.g., a vague, unclaimed legacy; a harm where the victim is gone and forgiveness is ambiguous), the procedure flags the ambiguity but doesn't resolve it. You must make a *narrative* choice about how the *character* interprets it.

  **Conclusion:** This procedure uses concrete stakes (apologies, debts, ownership, legal responsibility) to pinpoint where metaphysical views of identity *materially impact the character's world*, forcing your narrative hand. Where these stakes are absent or satisfied, you have full liberty to shape the narrator's voice and relationship to her past self. The three tests prove it bites when necessary. Now go wrangle those hundred passages!
