prompt: |-
  I run a small metaphysics reading group, mostly grad students but a couple of sharp undergrads, and we just finished a few weeks on persistence. Everyone left using the words confidently while clearly disagreeing underneath, so I want a decision-tree handout that sorts people by what they actually believe, not which label they self-apply. Could you build that for me?

  The tree should start from commitments about cases, not vocabulary — so the first branching questions should be things like the banana that's green on Monday and yellow on Friday: what makes those claims about one and the same banana true, given that nothing can be both green-all-over and yellow-all-over? Or the hot poker: if it's hot at one end and cold at the other, nobody panics, so why does the same shape across time instead of space feel like a problem? Other nodes I'd want in there: what happens when you say "there are two people sitting in that pew" about a Catholic and the statue-shaped lump of matter coinciding with him; the amoeba that splits (is it true, false, or indeterminate that the original survived?); and whether "I was once a fetus" and "there was a fetus where I now stand" are equally good paraphrases or not.

  The leaves should include endurantism (with the adverbialist and the relativized-properties versions as separate leaves if the tree can actually separate them), worm theory, and stage theory — and if your tree can't distinguish worm theory from stage theory by cases alone, say so rather than pretending. Also flag any combinations of node-answers that no real position occupies, with a sentence on why nobody sits there (incoherent? just ugly?). Please phrase each node question so someone with no background could answer it in good faith, and keep the whole thing to something that fits on two sides of A4. Don't feel like you need to be neutral — if a branch leads somewhere embarrassing, let it.
reasoning: |-
  Okay, the user runs a metaphysics reading group with grad students and sharp undergrads who just finished studying persistence. They noticed that everyone uses terms like "endurantism" or "perdurantism" confidently but actually disagree on the underlying concepts. So they want a decision-tree handout that sorts people by their actual commitments to cases, not the labels they use.

  The user specifies that the tree should start from concrete examples rather than terminology. They mention several key thought experiments: the banana changing color over time (the problem of change), the hot poker having different temperatures at different ends (why temporal variation feels different than spatial), the Catholic and the statue-shaped lump (coinciding objects), the splitting amoeba (identity through fission), and the fetus vs. "fetus where I stand" phrasing (temporary identity).

  For the outputs, they want the tree to distinguish endurantism (with adverbialist and relativized-properties variants), worm theory, and stage theory. They emphasize honesty - if the tree can't distinguish worm vs. stage theory through cases alone, I should admit it. They also want flags for inconsistent answer combinations and why they're untenable.

  Practical constraints: each question must be understandable to someone with no background, and the whole thing should fit on two A4 pages. They encourage not being neutral - if a branch leads to an awkward position, show it.

  I need to design this carefully. First, the structure: a flowchart where each branch is a concrete case. Start with the banana problem (temporal variation), then branch to the hot poker (spatial analogy), then the amoeba fission (temporary persistence), then the coinciding objects, and finally the fetus phrasing. Each decision point should reveal fundamental commitments about identity, change, and objects.

  For distinguishing theories: endurantism should split early based on how they handle change (adverbialism vs. relativized properties). For perdurantism, worm vs. stage theory might be tricky to separate with cases alone - I'll need key questions about temporal parts. The fission case is great for revealing views on persistence conditions.

  Inconsistent combinations: for example, if someone denies temporal parts but accepts coincidence, that might lead to a dead end. I should add notes explaining why certain paths are incoherent (e.g., "this requires objects to both have and not have temporal parts").

  Phrasing matters: every question should be in plain English about scenarios. For example: "When the banana turns from green to yellow, is there one banana that has two conflicting properties?" Not "how do you resolve the problem of temporary intrinsics?"

  I'll organize it cleanly: introduction at the top, then the tree with yes/no paths, ending with theory labels and "incoherent" flags where needed. Aim for brevity - two pages means about 10-12 questions max. And I won't shy from showing where a view leads to odd consequences, like "you must accept coinciding objects" or "this makes identity temporary".

  Finally, I'll add a note about worm vs. stage theory - they might collapse at some points, but I can use the fetus question to tease them apart via temporal extent. The output should be both rigorous and pedagogically useful for their group.
answer: |-
  Here's a decision tree focusing on concrete cases to reveal underlying commitments about persistence, designed to fit on two A4 pages. It avoids jargon initially and flags dead ends.

  ---

  **Persistence: What Do You *Actually* Think?**  
  *Follow the questions based on your intuitions about cases. Answer YES/NO honestly.*

  **START → Q1: The Banana:**  
  A banana is green-all-over on Monday. By Friday, it’s yellow-all-over (and no longer green). Is there *one single thing* present on both Monday and Friday that was green and is now yellow?  
  - **YES → Go to Q2**  
  - **NO → Go to Q3**  

  **Q2: The Hot Poker:**  
  A metal poker is hot-at-one-end and cold-at-the-other at the *same time*. Nobody says this is impossible. Why is a banana being green-at-one-time and yellow-at-another-time seen as a problem by some?  
  - *(Your answer reveals the core issue: temporal variation vs. spatial variation)*  
  **→ Go to Q4**  

  **Q3: Fetus & You:**  
  Consider "I was once a fetus." Is this statement...  
  - **TRUE → Go to Q6** (Rejecting persistence requires explaining how "I" connects to the fetus)  
  - **FALSE → Go to Q7**  

  **Q4: Resolving the Banana:**  
  How can the *one banana* from Q1 be both green and yellow?  
  - **A:** It has the properties *in different ways* (e.g., "greenly" on Mon, "yellowly" on Fri). **→ Go to Q5**  
  - **B:** It has the properties *relative to different times* (e.g., green-at-Mon, yellow-at-Fri). **→ Go to Q8**  
  - **C:** It *doesn’t* have both properties – the Mon-banana and Fri-banana are distinct parts of a larger *spacetime* thing. **→ Go to Q9**  

  **Q5: Adverbial Test:**  
  Is "The banana is green on Monday" best understood as "The banana *Monday-ly* is green" (like "it *quickly* ran")?  
  - **YES → ENDURANTISM (Adverbialist)**  
  - **NO → INCONSISTENT:** You need properties relativized to times *or* temporal parts. (Adverbialism is the main way to avoid both.)  

  **Q6: The Fetus Paraphrase:**  
  Is "There was a fetus where I now stand" *just as good* as "I was once a fetus" for expressing the truth?  
  - **YES → Go to Q9** (Suggests location/relation is primary, not strict identity)  
  - **NO → ENDURANTISM (Relativized Properties)** (You think strict identity over time holds, but properties are time-indexed.)  

  **Q7: Amoeba Split:**  
  Amoeba Alpha splits perfectly into Beta and Gamma. Did Alpha survive?  
  - **YES → INCOHERENT:** If you denied persistence in Q1 (no one thing lasting), Alpha can't survive *as one thing*.  
  - **NO → Go to Q9**  
  - **INDETERMINATE? → Go to Q9** (Indeterminacy often points to temporal parts)  

  **Q8: Coinciding Objects:**  
  A Catholic (Callie) is sitting on a church pew. Callie *is* made of atoms arranged statue-wise. Is there *also* a distinct, statue-shaped lump of matter *right where Callie is*?  
  - **YES → Go to Q10**  
  - **NO → ENDURANTISM (Relativized Properties)** (You likely see "lump" as just a description of Callie's matter *at a time*, not a separate object.)  

  **Q9: Temporal Parts Commitment:**  
  Are there things that are "temporal slices" or "stages" – entities that exist only at a single instant or very short duration? (e.g., Monday-Banana-Stage, Fetus-Stage-9mo-BC)  
  - **YES → Go to Q11**  
  - **NO → INCONSISTENT:** Q3-Q7 likely pushed you towards temporal parts for explanation.  

  **Q10: Survival Without Identity:**  
  After the amoeba split (Q7), is it true that Alpha survives *as* Beta *or* as Gamma (or both?), even if Alpha isn't strictly identical to either?  
  - **YES → PERDURANTISM (Worm Theory)**  
  - **NO → PERDURANTISM (Stage Theory)** (Stages use "survival" as continuity between distinct stages, not identity.)  

  **Q11: Referring to Objects:**  
  When you say "That banana" pointing to a banana today, are you referring to...  
  - **A:** The entire *spacetime worm* (the banana's whole history)? **→ PERDURANTISM (Worm Theory)**  
  - **B:** Just the *current temporal stage* of the banana? **→ PERDURANTISM (Stage Theory)**  

  ---

  **Leaves & Dead Ends Explained:**

  1.  **Endurantism (Adverbialist):** (Q1 Yes → Q4 A → Q5 Yes)  
      *The banana is wholly present at each time, possessing properties "adverbially" (greenly, yellowly). Change is modification of the whole object.*

  2.  **Endurantism (Relativized Properties):** (Q1 Yes → Q4 B → Q8 No) OR (Q1 No → Q3 False → Q6 No)  
      *The banana is wholly present at each time; properties are relational (green-at-t). "Callie" and "lump" describe the same object under different concepts/perspectives.*

  3.  **Perdurantism (Worm Theory):** (Q1 Yes → Q4 C → Q9 Yes → Q11 A) OR (Q1 No → Q3 True → Q6 Yes → Q9 Yes → Q11 A) OR (Q1 No → Q7 No/Indet → Q9 Yes → Q10 Yes → Q11 A)  
      *The banana is a 4D spacetime worm. The Mon-banana and Fri-banana are temporal parts. "The banana" refers to the whole worm. Alpha survives derivatively via its temporal parts becoming Beta/Gamma worms.*

  4.  **Perdurantism (Stage Theory):** (Q1 Yes → Q4 C → Q9 Yes → Q11 B) OR (Q1 No → Q3 True → Q6 Yes → Q9 Yes → Q11 B) OR (Q1 No → Q7 No/Indet → Q9 Yes → Q10 No → Q11 B)  
      *Only instantaneous or short-lived stages exist. "The banana" refers to the current stage. Claims about the past/future are about other stages connected by a "personally similar" relation. "Alpha survives" means later stages (Beta, Gamma) are continuers of the Alpha-stage.*

  **Dead Ends:**

  *   **Q5 No:** Requires relativized properties (Q4 B) or temporal parts (Q4 C). Adverbialism is the distinctive escape route.
  *   **Q7 Yes (after Q1 No):** Contradicts denying that one thing persists through time (Q1 No).
  *   **Q9 No (after earlier pushes):** Earlier answers (esp. Q1 No, Q3 False, Q6 Yes, Q7 No/Indet) strongly suggest temporal parts are needed for your intuitions. Denying them leaves a gap.
  *   **Q8 Yes → Q10 ?:** *Requires* temporal parts! Coinciding distinct objects at a time is hard to justify without temporal parts (or a very strong anti-reductionism). This branch *should* force you to Q9/Q10/Q11. If you hit Q8 Yes, you *must* go to Q10.

  **Key Distinctions:**

  *   **Worm vs. Stage Theory:** The tree *can* separate them via Q10 (Survival without Identity?) and Q11 (Referent of "That banana"). Worms allow derivative survival via identity of temporal parts; Stages deny identity over time entirely, relying on continuity relations. Q11 targets the semantics of reference.
  *   **Adverbialist vs. Relativized Endurantism:** Separated by Q5 (Adverb Test) and Q8 (Coinciding Objects). Adverbialists avoid temporal relativization entirely; Relativizers accept it but deny coinciding objects.

  **Design Notes:**

  *   **Cases First:** Starts with the banana (change), uses poker (space/time asymmetry), amoeba (fission), coincidence, fetus (identity vs. location), forcing commitments.
  *   **Embarrassment Allowed:** Dead ends like Q7 Yes after Q1 No explicitly show incoherence. Q8 Yes *requires* temporal parts, pushing Relativizers towards "No".
  *   **Brevity:** Designed for 2xA4. Key branches cover core commitments.
  *   **Neutral Phrasing:** Questions focus on intuitions about scenarios, not theory-laden terms ("temporal part", "endure").

  This tree should reveal the actual structure of your group's disagreements beneath the surface labels. Good luck!
