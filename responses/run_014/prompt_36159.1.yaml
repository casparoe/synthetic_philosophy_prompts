  But note: if the flip in Round 1 is tails and in Round 2 is tails, then no decisions are made. We can still discuss the precommitments. But we might want to have at least one round with heads. To ensure that, we can fix the flips? But that would break the randomness. Alternatively, we can run the game with hypothetical scenarios after the real game? But that might dilute the stakes.

  Given the time, we might have to accept that we might not see a heads outcome. We can then discuss the decisions that were made in the precommitment round (which are binding only if heads) and compare with what they would have done in Round 1 if heads had occurred.

  Alternatively, we can run the game with multiple flips per round? But time is short.

  **Final Design:**

  We will go with one flip per round for the entire class.

  **Rules Handout (for students):**

  You are in pairs: one is Player H (heads branch), the other Player T (tails branch).

  Both start with 100 points.

  Round 1:
     - A fair coin will be flipped for the entire class.
     - If the coin is tails:
          - Player T receives an additional 1000 points (total 1100).
          - Player H does nothing and keeps 100 points.
     - If the coin is heads:
          - Player H is asked: "Do you want to pay 100 points? If you do, Player T will receive 1000 points (so 1100 total). If you do not, both of you keep 100 points."
          - Player H decides privately and writes their decision.

  Round 2:
     - We will flip a new coin for the entire class, but first, each pair must decide and publicly announce a precommitment:
          - Option A: "We precommit to pay 100 points if the coin is heads."
          - Option B: "We precommit to not pay if the coin is heads."
     - Then, the coin is flipped.
     - If tails: Player T gets 1000 extra, Player H keeps 100.
     - If heads: 
          - If the pair precommitted to pay: Player H pays 100 points (so 0) and Player T gets 1000 extra (so 1100).
          - If the pair precommitted to not pay: no payment, both keep 100.

  The points from both rounds will be added up and converted to a reward at the end of the term.

  **Debrief Outline:**

  1. Reveal that the game is based on the counterfactual mugging thought experiment.
  2. Explain the standard counterfactual mugging.
  3. Discuss the results of the game:
     - In Round 1 (heads): how many Player H paid?
     - In Round 2: how many pairs precommitted to pay?
     - If Round 2 was heads, did everyone follow their precommitment? (They should have.)
  4. Map to the standard case: 
     - In the standard case, the agent is one person. The counterfactual mugging asks: should you pay in the heads branch to benefit your counterfactual self in the tails branch? 
     - In our game, we split the agent into two people. So the payment by Player H in the heads branch benefits a real person (Player T) who is the same agent in the tails branch. This makes the counterfactual branch real. 
  5. Objection: In the real thought experiment, the other branch doesn't exist. Does the paired version elicit the same intuitions?
     - The paired version elicits altruism/team reasoning. Would you apply the same reasoning to your counterfactual self? 
  6. Follow-on discussion: 
     - Does your behavior in the game give you standing to moralize about the standard case?
     - Is refusing to pay in the standard case a mistake? Or is it rational without precommitment?
     - What is the role of precommitment? In Round 2, we saw more willingness to pay (if precommitments were more frequent than payments in Round 1) because the pair can bind themselves in advance and they are considering both branches together.

  7. Philosophical failures:
     - If side payments occurred, discuss: in the standard case, the counterfactual self cannot compensate the actual self. So side payments are not possible. This makes the paired version different.
     - If there was disagreement in the pair, discuss: what does it mean for an agent to be split? In the standard case, the agent is unified.

  **Facilitator's Honest List of What Might Go Wrong:**

  1. **Side payments**: Players might try to make side deals. 
     - Handling: Either explicitly forbid it or allow it and then discuss how it changes the problem.

  2. **Time overrun**: The flips and decisions might take longer than expected. 
     - Handling: Keep strict time limits. Use a timer.

  3. **Confusion about rules**: Some pairs might not understand.
     - Handling: Provide a written handout and walk through an example.

  4. **Coin flip lands on edge or is disputed**: 
     - Handling: Have a clear rule (e.g., reflip).

  5. **Pairs cannot agree on precommitment**: 
     - Handling: Require consensus. If they cannot agree, they cannot precommit (and in Round 2, if heads, they are not bound and we treat it as no precommitment? Or perhaps they must default to no payment? We can say: if they don't announce a precommitment, then in the event of heads, Player H decides on the spot (like Round 1). But that breaks the precommitment round. Alternatively, they must choose one option by majority? We want to simulate a unified agent. So we require consensus.

  6. **Low stakes**: If the points don't matter, students might not take it seriously.
     - Handling: Make the rewards meaningful enough.

  7. **One round has no heads**: Then we don't see the decision in action. 
     - Handling: In the debrief, use hypotheticals based on the precommitments.

  8. **Resentment between paired students**: If Player H in Round 1 (heads) didn't pay, Player T might be upset. 
     - Handling: Emphasize that it's a game and the pairs are part of the same team.

  9. **Student might not follow precommitment in Round 2 if not binding enough**: 
     - Handling: Make it clear that precommitment is binding and enforce it.

  10. **Discussion might be dominated by a few students**: 
      - Handling: Facilitate to include everyone.

  This design should create an engaging game that brings out the key issues in counterfactual mugging while introducing a novel paired structure.
answer: |-
  Below is a comprehensive design for an in-class game of counterfactual mugging tailored to your requirements. The game uses a paired-branch structure, non-monetary stakes, precommitment, and a focus on eliciting intuitions without naming the problem until debrief. It includes rules, payoffs, randomization methods, a debrief script, and facilitator notes on predictable challenges.

  ---

  ### **Game Design: Paired-Branch Counterfactual Mugging**
  **Objective:** Simulate counterfactual mugging with real stakes, using student pairs where one represents the "heads branch" and the other the "tails branch." Students should feel the tension of paying the mugger before theory is introduced.

  #### **Setup**
  - **Students:** 14 students → 7 pairs.
  - **Roles per Pair:** 
    - **Player H (Heads Branch):** Represents the agent if the coin lands heads.
    - **Player T (Tails Branch):** Represents the agent if the coin lands tails.
  - **Stakes:** Points translate to "reward tokens" (e.g., extra credit points, small prizes, or symbolic perks like choosing the next reading). Avoid money.  
    - **Base endowment:** Each player starts with **10 tokens** (ensures no negative payoffs).  
  - **Duration:** 20-25 minutes for gameplay (including two rounds), 45-50 minutes for debrief.

  #### **Rules and Payoff Scheme**
  **Key Structure:**  
  - A fair coin flip determines the "actual" branch (heads or tails).  
  - If **heads**, Player H is confronted by the mugger and decides whether to pay.  
  - If **tails**, Player T receives a windfall, and no mugging occurs.  
  - Paying the mugger in the heads branch sends tokens to the *tails branch player* in the same world (making the counterfactual beneficiary real).  

  **Payoff Matrix:**  
  | Coin Flip | Branch       | If Player H Pays (10 tokens)                                  | If Player H Does Not Pay                          |
  |-----------|--------------|---------------------------------------------------------------|---------------------------------------------------|
  | Heads     | Player H     | **0 tokens** (loses endowment)                                | **10 tokens** (keeps endowment)                   |
  |           | Player T     | **20 tokens** (endowment + windfall)                          | **10 tokens** (keeps endowment)                   |
  | Tails     | Player H     | **10 tokens** (no action; mugger doesn't appear)              | **10 tokens** (no action)                         |
  |           | Player T     | **20 tokens** (windfall automatically received, no mugging)   | **20 tokens** (windfall automatically received)   |

  - **Windfall:** 10 extra tokens for Player T in tails branch (simulates the $1,000,000 in standard mugging).  
  - **Mugger's "Payment":** Player H gives 10 tokens to the facilitator, who transfers them to Player T (not the mugger). This ensures tokens are conserved and verifiable.  

  #### **Game Procedure**
  **Round 1: No Precommitment (Elicit Raw Intuitions)**  
  1. **Assign Pairs:** Randomly pair students. Assign Player H/T roles (e.g., H = taller, T = shorter; avoid bias).  
  2. **Explain Rules (Without Theory):**  
     - *Facilitator script:* "Each pair represents one agent split across two possible futures. A coin flip decides which future becomes real. If it lands heads, Player H faces a choice: pay 10 tokens so Player T gets 20 tokens, or keep tokens so both get 10. If tails, Player T automatically gets 20 tokens, and Player H keeps 10. Points are real—they’ll be exchanged for [reward]."  
  3. **Randomize Coin Flip:**  
     - **Method:** Use a public, verifiable RNG (e.g., random.org or a broadcasted digital RNG). Input: "Heads" or "Tails" for each pair.  
     - **Anti-Suspicion Measure:** Pre-commit to the RNG method before class (e.g., "We’ll use random.org seeded with today’s date"). Flip coins sequentially for each pair to avoid pattern detection.  
  4. **Execute Round:**  
     - Flip coins for all pairs. Announce outcomes.  
     - For heads pairs: Player H decides privately (write decision on paper). Enforce no communication between H and T during decision.  
     - Record payoffs.  

  **Round 2: Precommitment (Test Coordination)**  
  1. **Introduce Precommitment:**  
     - *Facilitator script:* "Now, before the coin flip, your pair can publicly commit to a strategy. If you commit to ‘pay,’ Player H must pay if heads. If ‘not pay,’ Player H keeps tokens. You must agree as a pair."  
  2. **Public Commitment:**  
     - Pairs discuss for 3 minutes and announce their commitment to the class (e.g., "Pair 1 commits to PAY").  
  3. **Randomize and Execute:**  
     - Flip coins again (new sequence). Apply precommitments:  
       - If heads and committed to "pay," Player H must pay.  
       - If heads and committed to "not pay," Player H does nothing.  
     - Record payoffs (add to Round 1 totals).  

  #### **Debrief Script**  
  **Goals:** Map the game to counterfactual mugging, confront the pairing objection, and discuss moral standing.  

  1. **Reveal the Problem (5 mins):**  
     - "Today’s game was a variant of the *counterfactual mugging* thought experiment. In the standard case, an agent faces a coin flip: tails wins $1,000,000; heads wins nothing. A mugger then asks for $1,000 in the heads branch, promising they *would have* given $10,000 in the tails branch. Should you pay?"  
     - "We modified it: your ‘branches’ were real people. Player T is the ‘counterfactual you’ in the tails branch."  

  2. **Map Game to Standard Case (10 mins):**  
     - **Similarities:**  
       - Coin flip creates two branches.  
       - Mugger demands payment in the heads branch to benefit the tails branch.  
       - Tension: Paying feels irrational locally (H loses tokens) but could be globally rational (if T gains).  
     - **Differences:**  
       - Standard mugging: The tails branch doesn’t exist → paying benefits a nonexistent self.  
       - Our game: Player T is real → paying benefits a teammate.  

  3. **Confront the Pairing Objection (10 mins):**  
     - **Objection:** "Pairing destroys the thought experiment! In reality, the other branch doesn’t exist—it’s just you, and the mugger can’t reward a ghost."  
     - **Elicited Intuitions:**  
       - **Altruism/Team Reasoning:** Players pay because Player T is real and present (e.g., "I didn’t want my partner to lose out"). This mirrors *identifying with your counterfactual self*.  
       - **Transfer to Standard Case?**  
         - If students say, "I’d pay to help my other self," intuitions transfer (evidential reasoning).  
         - If they say, "This feels like helping a friend, not myself," intuitions *don’t* transfer (causal reasoning dominates).  
     - **Key Insight:** Pairing makes the dilemma tangible but may overemphasize social preferences. The standard case isolates self-interested counterfactual reasoning.  

  4. **Moral Standing Discussion (15 mins):**  
     - **Prompt:** "In the game, if Player H refused to pay, could Player T moralize at them? Does this apply to standard mugging?"  
     - **Arguments to Surface:**  
       - **Mistake:** "Refusing to pay is irrational—it leaves money on the table if you care about your counterfactual self. Pairing shows this!"  
       - **Self-Locating Judgment:** "In the standard case, tails-me doesn’t exist, so why pay? Pairing distorts this by making T real."  
       - **Precommitment Rationality:** "Without precommitment, refusing is rational for selfish H. Precommitment fixes this by binding the agent across branches."  
     - **Facilitator Challenge:** "Is precommitment cheating? Or is it how rational agents handle time inconsistency?"  

  5. **Synthesize (5 mins):**  
     - "Counterfactual mugging pits causal decision theory (only act on actual causes) against evidential (act on correlations). Pairing made evidential intuitions stronger—but was it faithful? Real agents can’t meet their counterfactual selves."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Side Payments Between Branches (Likely and Philosophically Rich):**  
     - **Problem:** Player T bribes Player H ("If you pay, I’ll give you 5 tokens later"). This turns the game into Coasean bargaining, destroying the dilemma.  
     - **Handling:**  
       - **Allow it initially:** Don’t forbid it—let it happen. In debrief, highlight how this "solves" the problem but isn’t possible in standard mugging (no counterparty exists).  
       - **Discuss:** "If branches can trade, the mugging is trivial. But in reality, your counterfactual self can’t pay you back!"  

  2. **Role Confusion:**  
     - **Problem:** Students forget who is H/T.  
     - **Solution:** Give H/T badges. Re-read roles before rounds.  

  3. **Coin Flip Suspicion:**  
     - **Problem:** Students doubt RNG fairness.  
     - **Solution:** Use random.org with public screen share. Pre-commit to the seed.  

  4. **Precommitment Disagreements:**  
     - **Problem:** Pairs argue over precommitment.  
     - **Solution:** Require consensus; if deadlocked, they default to "no precommitment" (Round 1 rules apply).  

  5. **Token Valuation Issues:**  
     - **Problem:** Tokens feel trivial.  
     - **Solution:** Tie tokens to meaningful rewards (e.g., 20 tokens = exemption from a quiz question).  

  6. **Time Shortfall:**  
     - **Problem:** Game runs long.  
     - **Solution:** Use one coin flip for all pairs in a round (same outcome). Sacrifice per-pair variation for speed.  

  7. **Debrief Dominance by Vocal Students:**  
     - **Solution:** Use think-pair-share. Start with private reflections, then small groups, then whole class.  

  ---

  ### **Facilitator Cheat Sheet**  
  - **Don’t Lecture Upfront:** Avoid terms like "counterfactual mugging," "causal/evidential," or "Omega" until debrief.  
  - **Randomization:** random.org with "Heads/Tails" generator. Seed: "YYYYMMDD-HHMM" (timestamp).  
  - **Stakes:** Tokens = 0.1% extra credit per token (max 2%) or small prizes (candy, book tokens).  
  - **Ethics:** Ensure no coercion; remind students they can pass if uncomfortable.  

  This design forces students to confront the evidential/causal tension through lived experience. The pairing novelty makes abstract stakes visceral, while side payments and precommitment create natural hooks for theory. Debrief rigorously to separate paired intuitions from the standard case.
