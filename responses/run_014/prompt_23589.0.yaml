  The memo must acknowledge the purist view seriously. Maybe phrase it as: "While the irreplaceable aura of the master's hand remains the ultimate object of our stewardship, the pedagogical value of the composition during conservation warrants temporary substitution." 

  Timeline is straightforward - display until original returns, then reevaluate the copy's role. The collector's offer gives them flexibility. 

