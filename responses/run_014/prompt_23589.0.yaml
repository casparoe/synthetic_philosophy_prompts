  Biggest risk is seeming to devalue authenticity. Must emphasize this is a temporary, transparent exception. The word "temporary" should appear at least three times.
answer: |-
  **MEMORANDUM**  
  **TO:** Acquisitions and Display Committee  
  **FROM:** Chair, Acquisitions and Display Committee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation for Display of 17th-Century Dutch Genre Painting During Conservation of Original  

  ### I. Background  
  Our museum holds a 17th-century Dutch genre painting (accession #1937.045), long attributed to a minor master and displayed in Gallery 3. This work is currently in storage undergoing extensive conservation (estimated 12–18 months) due to varnish discoloration and a tear. Concurrently, a private collector has offered a near-identical lifetime workshop copy of the same composition, verified by our technical department as contemporaneous to the original and in excellent condition.  

  The committee must determine how to address the vacant space in Gallery 3 during conservation. Options under consideration:  
  **(a)** Display the copy in the original’s location with explicit labeling;  
  **(b)** Leave the space empty or substitute unrelated work;  
  **(c)** Acquire and display the copy in a secondary location;  
  **(d)** Decline the copy and leave space vacant.  

  ### II. Philosophical Context  
  Central to this decision is the question: **Does the value of art reside solely in its originality, or can a skilled copy hold independent value?**  
  - **The Case for Originality:** The original embodies the artist’s unique hand, historical presence, and "aura" (per Walter Benjamin’s *The Work of Art in the Age of Mechanical Reproduction*). Its material authenticity fosters a direct connection to the past, irreplaceable by copies.  
  - **The Case for Copies:** A skilled contemporaneous copy retains pedagogical, aesthetic, and contextual value. It reflects workshop practices, compositional intent, and period reception. Temporarily, it sustains the narrative cohesion of Gallery 3.  

  *Strongest Counterpoint to Our Position:* Dismissing the copy risks undermining the primacy of the artist’s intent and the museum’s duty as a guardian of authenticity. A copy displayed *as a placeholder* could inadvertently dilute the original’s significance.  

  ### III. Recommendation: **Option (a)**  
  **Display the copy in the original’s location with unambiguous labeling for the duration of conservation.**  
  **Rationale:**  
  1. **Educational Continuity:** Gallery 3’s narrative of Dutch interior scenes relies on this composition. The copy preserves the gallery’s pedagogical integrity while the original is unavailable.  
  2. **Transparent Stewardship:** Labeling the work as "*Workshop of [Master’s Name], *after the original composition*, c. [Date]" maintains ethical rigor, distinguishing it from the autograph work.  
  3. **Practical Value:** The copy’s condition allows viewers to appreciate the composition’s details (e.g., light, texture) obscured in the original by varnish damage.  
  4. **Cost Efficiency:** The collector’s offer requires no acquisition funds; the copy is a long-term loan.  

  **Rejecting Alternatives:**  
  - **(b)/(d)** An empty space or unrelated work disrupts gallery cohesion and deprives visitors of context.  
  - **(c)** Displaying the copy elsewhere diminishes its utility as a temporary placeholder and fails to address the narrative gap.  

  ### IV. Addressing Philosophical Concerns  
  While originality remains paramount to our institutional mission, **temporary** display of a verified workshop copy serves the complementary value of *accessibility*. As philosopher Nelson Goodman noted, aesthetic value arises not only from authenticity but from how an object functions in a *specific context*. Here, the copy’s context—as a didactic interim solution—grants it derivative but legitimate value. Crucially, this does not equate the copy with the original; it acknowledges that value in art can be multi-faceted (historical, aesthetic, pedagogical) without being equivalent.  

  ### V. Action Plan & Timeline  
  1. **Immediate:** Secure the copy on loan (0–2 weeks).  
  2. **Short-Term:** Install in Gallery 3 with approved label text (by November 30, 2023).  
  3. **Medium-Term:** Reassess upon original’s return (est. Q4 2024). At that time:  
     - The copy may be accessioned (if donated) for comparative display in a study gallery.  
     - If declined, it returns to the collector.  
  4. **Long-Term:** Draft a collections policy addendum addressing temporary substitutions (Q1 2025).  

  ### VI. Conclusion  
  This recommendation balances philosophical integrity with pragmatic needs, honoring the original’s primacy while leveraging the copy’s contextual value. The copy ensures Gallery 3 remains a coherent educational space, and its transparent presentation reaffirms our commitment to authenticity.  

  **VOTE REQUESTED** at the November 15, 2023 meeting.  

  ---  
  **Approved by:**  
  [Chair’s Signature]  
  ________________________________________  

  *Attachment A: Technical Analysis of Copy (Conservation Dept.)*  
  *Attachment B: Loan Agreement Draft (Registrar)*
