prompt: |-
  I'm three months out from my dissertation proposal deadline, and I'm trying to decide whether to commit to the "safe Pareto improvement" program in cooperative AI theory. For the uninitiated: imagine two principals who don't play a game themselves but instead design or instruct agents to play it for them, with aligned delegation—telling each agent to maximize the principal's own utility—as the default. A safe Pareto improvement is an intervention on the agent interaction (committing to forgo certain actions, installing surrogate objectives, and so on) that you can show is good for both principals without having to resolve hard equilibrium-selection questions in either the base game or the modified game. The appeal is that the argument works under weak, qualitative assumptions about how agents play different games. I've been reading the literature and I'm increasingly uncertain about which parts of the program are genuinely deep and which are just bookkeeping, so I'd like help thinking about where the real open problems are.

  Could you give me a prioritized map of the open questions in this area? In particular, I'm drawn to a cluster of worries: the gap between the binary case (showing that the intervention beats aligned delegation head-to-head) and the realistic case (choosing among many possible interventions, where the binary argument doesn't obviously pick out the right one); the problem of selecting which safe Pareto improvement to propose when several exist and the principals can't coordinate; the question of why the Pareto criterion is the right one rather than some "safe improvement for me" criterion; and the worry that the whole program quietly depends on the principals trusting each other's equilibrium reasoning in ways the theory never justifies. Are these the right questions to care about, or am I missing something more upstream?

  For each question you prioritize, I want a defended ranking, not a survey: why it's upstream of the others, how tractable it is for someone with my background (solid game theory and decision theory, weak in formal logic and mechanism design), how much of the rest of the program's credibility depends on its answer, and what evidence or a successful argument over the next year or two would move it up or down the list. I'm deliberately not asking for a reading list or citations—just the reasoning about which problems deserve a researcher's effort first and which are overrated or not really open at all.
reasoning: |-
  Hmm, this is a sophisticated query from a doctoral student deep in cooperative AI theory. They're three months from their dissertation proposal deadline and wrestling with whether to commit to studying "safe Pareto improvements" (SPIs) in principal-agent settings. They've identified several conceptual worries but want help prioritizing which open problems are truly fundamental versus secondary.

  The user clearly has strong technical grounding—they're fluent in game theory concepts like aligned delegation, equilibrium selection, and Pareto efficiency. Their anxiety seems twofold: methodological (what's deep vs "bookkeeping" in SPI literature) and strategic (where to focus limited dissertation time). The request for defended rankings rather than citations suggests they've done their homework but need help synthesizing.

  Key concerns they raised:
  1. Binary vs realistic SPI selection (many interventions)
  2. Selecting among multiple SPIs without coordination
  3. Why Pareto rather than self-improvement?
  4. Hidden trust assumptions in equilibrium reasoning

  I need to evaluate which of these cuts deepest. The equilibrium selection worry (#4) strikes me as most foundational—if SPI arguments secretly depend on principals agreeing on equilibria, the whole "safe" claim unravels. That's upstream because it challenges the core motivation: avoiding brittle assumptions about agent behavior. Without resolving this, other questions might be moot.

  Next, the binary/realistic gap (#1) seems pressing for applicability. SPI papers often compare one intervention against aligned delegation, but practitioners face menus of options. This directly impacts whether SPI theory can guide real system design. It's tractable for someone with their game theory background—could frame as meta-selection over intervention classes.

  The multiple-SPI coordination problem (#2) feels derivative: if we can rank SPIs (solving #1), coordination might be handled by existing bargaining solutions. The Pareto criterion question (#3) is philosophically important but may not block technical progress—self-interested SPI variants could coexist with Pareto-focused ones.

  Additional considerations:
  - They mentioned weak formal logic skills, so solutions requiring heavy modal logic are less feasible short-term.
  - The 3-month deadline means prioritizing questions where preliminary results are achievable.
  - The "trust assumptions" issue has high stakes—if unresolved, it could invalidate entire subliterature.

  For each prioritized problem, I'll outline why it's urgent, feasibility given their skills, and what evidence could resolve it. The equilibrium trust issue deserves top billing because negative results here would reshape the field, while progress on SPI selection could yield positive dissertation results quickly.
answer: |-
  Here’s a prioritized map of the open questions in the safe Pareto improvement (SPI) program, tailored to your concerns and constraints. I’ve ranked them based on **upstream foundational impact**, **tractability for your background**, and **credibility stakes** for the broader program. Each includes why it’s ranked where it is, tractability, what’s at stake, and what could shift its priority.

  ---

  ### **1. The Hidden Trust Assumption in Equilibrium Reasoning**  
  **Why upstream?**  
  This cuts to the core of SPI’s "safety" claim. SPIs avoid *explicit* equilibrium selection but implicitly assume principals trust that agents will play *some* equilibrium in both the base and modified games—without specifying which one. If principals doubt each other’s (or their agents’) equilibrium-reasoning capabilities, SPI guarantees evaporate. This is foundational: if unresolved, it undermines the entire program’s value proposition.  

  **Tractability for you:**  
  High. Your game theory/decision theory background lets you formalize "trust thresholds" (e.g., modeling principals as uncertain about agents’ rationality or equilibrium selection mechanisms). Avoids heavy mechanism design/formalism.  

  **Credibility stakes:**  
  Critical. If SPI relies on hidden coordination over equilibria, it collapses into standard incomplete-information bargaining. A negative result here could invalidate 80% of SPI applications.  

  **What could move the needle (1–2 years):**  
  - *Evidence:* Examples where an SPI fails under minor perturbations of equilibrium concepts (e.g., ε-equilibria).  
  - *Argument:* Showing that SPI robustness requires principals to agree on *solution concepts* (not just payoffs).  

  ---

  ### **2. The Binary-to-Realistic Gap (Selecting Among Many Interventions)**  
  **Why upstream?**  
  SPI theory excels at proving "Intervention X > Aligned Delegation" but offers no guidance for choosing *among many Xs*. This isn’t just an engineering gap—it reveals a theoretical hole: without a selection criterion, SPIs might be dominated by unconsidered options. This directly impacts real-world applicability.  

  **Tractability for you:**  
  High. Frame it as meta-optimization: "What makes one SPI *more robust* than another?" Leverage your game theory to define dominance hierarchies (e.g., SPIs that are resilient to larger strategy sets).  

  **Credibility stakes:**  
  High. If SPI can’t handle multi-intervention settings, it remains a theoretical toy. Opens the door to adversarial manipulation (e.g., a principal proposing a suboptimal SPI that’s "safe" but inefficient).  

  **What could move the needle:**  
  - *Evidence:* An algorithm that generates Pareto-ranked SPIs for simple games.  
  - *Argument:* Proving that no universal SPI selector exists without stronger assumptions.  

  ---

  ### **3. Why Pareto? The Self-Improvement Criterion Question**  
  **Why mid-tier?**  
  This is philosophically deep but less urgent. The Pareto criterion is a *minimal* consensus for cooperation. However, in competitive settings, principals might prefer "safe improvements *for me*" (even if others lose). This challenges SPI’s cooperative framing but doesn’t break the core machinery.  

  **Tractability for you:**  
  Moderate. Requires redefining SPI incentives (e.g., "When does a self-interested principal *voluntarily* adopt an SPI?"). Uses game theory but edges into behavioral modeling.  

  **Credibility stakes:**  
  Moderate. If Pareto is replaced by selfishness, SPI reduces to a single-principal robustness problem—losing its "cooperative" essence. However, the binary SPI logic could survive.  

  **What could move the needle:**  
  - *Evidence:* Experimental results showing principals reject Pareto improvements for selfish gains.  
  - *Argument:* Proving that selfish-SPI conflicts lead to deadlock in common games.  

  ---

  ### **4. SPI Selection Without Coordination (Multiple SPIs Exist)**  
  **Why downstream?**  
  This assumes SPI multiplicity is common—but if #2 (selection) is solved, coordination follows naturally (e.g., via dominance criteria). If not, coordination failure is just one symptom of the deeper problem.  

  **Tractability for you:**  
  Straightforward. Model it as a bargaining game over SPI menus. However, it’s contingent on progress in #1 and #2.  

  **Credibility stakes:**  
  Low. Coordination failure is a known game-theoretic challenge; SPI doesn’t uniquely worsen it.  

  **What could move the needle:**  
  - *Evidence:* Cases where multiple SPIs exist but coordination costs outweigh benefits.  

  ---

  ### **Overrated/Non-Open Problems**  
  - **"SPIs require common knowledge of rationality"**: Often misstated. SPI only requires agents to play *some* equilibrium (not the same one), so common knowledge isn’t necessary. This is largely resolved.  
  - **"Surrogate objectives are ad hoc"**: Bookkeeping. The *form* of interventions (payoff modifications, commitment devices) is a tool—what matters is whether they satisfy SPI’s safety guarantees.  

  ---

  ### **Recommendations for Your Dissertation**  
  1. **Attack #1 (Trust in Equilibrium Reasoning)** as your centerpiece. It’s high-leverage: negative results could redefine the field; positive results (e.g., "SPIs hold under bounded rationality class X") would be foundational.  
  2. **Embed #2 (Binary-to-Realistic)** as an application. Show how trust assumptions limit SPI selection (e.g., "Under trust level Y, only Z interventions are robust").  
  3. **Avoid #3 (Pareto Criterion)** unless you find a crisp game-theoretic rebuttal (e.g., "Selfish SPIs induce instability in repeated play").  
  4. **Ignore #4** unless a specific case study emerges.  

  **Time feasibility:** Focused work on #1/#2 can yield proposal-ready results in 3 months. Both allow incremental formalization (start with 2x2 games, then scale). The trust question (#1) is your highest upside—and the literature’s blind spot.
