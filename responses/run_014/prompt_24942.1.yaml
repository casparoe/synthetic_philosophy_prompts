answer: |-
  Based on your framing and background, here's a systematic map of potential defeaters for expected value fanaticism (EVF), categorized by their force and nature. This analysis draws on key arguments from Beckstead, Ord, Arntzenius, Bostrom, Hájek, Seidenfeld, et al., focusing on conceptual, formal, empirical, and normative challenges, while distinguishing genuine concessions from common misunderstandings.

  **I. Decisive Defeaters (Forcing Abandonment or Radical Reformulation)**

  These arguments suggest EVF is either *internally inconsistent*, *logically incoherent*, or *fundamentally incompatible* with core rational requirements.

  1.  **Mathematical Impossibility / Incoherent Utilities:**
      *   **The Problem:** Unbounded utility functions combined with unbounded probability spaces lead to *infinite expected values* for many actions, making comparisons impossible (e.g., the "Pascal's Wager" problem generalized). If action A offers a 1/googolplex chance of +U_googleplex utility, and action B offers a 1/(2*googolplex) chance of +2*U_googolplex utility, which has higher EV? Both might be infinite or undefined.
      *   **Fanaticism Theorem (Bostrom, Beckstead):** EVF combined with plausible background assumptions (like the possibility of outcomes with arbitrarily high/low utility) implies that *any* action with a non-zero probability of an infinite payoff dominates all others. But since many actions might have such a probability (e.g., via simulation hypotheses, Boltzmann brains, quantum immortality), rational choice becomes paralyzed or arbitrary.
      *   **Force:** If proven, this decisively undermines EVF as a *complete* decision rule. It forces either bounded utilities, bounded probabilities (effectively rejecting true fanaticism), or abandoning expected value maximization. Defenders (e.g., Beckstead) concede this is a major challenge, attempting escape routes like "lexical thresholds" or rejecting specific background assumptions, but these significantly qualify EVF.
      *   **Key References:** Bostrom ("Infinite Ethics"), Beckstead (PhD Thesis, Ch. 4-5).

  2.  **Stochastic Dominance Violations (Hájek, Smith):**
      *   **The Problem:** EVF can recommend actions that are *stochastically dominated* by alternatives. Imagine action A: Guaranteed prevention of 1000 headaches. Action B: 99.999% chance of causing 1000 headaches, 0.001% chance of preventing a googolplex headaches. If the disutility of headaches is unbounded below, EVF *might* favor B (if the tiny chance of massive good outweighs the near-certain moderate bad). But B is clearly worse than A in terms of stochastic dominance (A guarantees a better outcome than B in every possible state of the world except the vanishingly tiny one where B achieves the massive good).
      *   **Force:** Violating stochastic dominance is widely considered a decisive refutation of a decision rule. It implies the rule can recommend choices that are *provably worse*, regardless of the utility function (as long as it's increasing). Defenders must either deny the dominance relation (hard) or accept a significant cost. This pushes towards bounded utilities or non-EV rules.

  **II. Awkward Defeaters (Requiring Significant Qualification)**

  These challenges force substantial modifications or auxiliary commitments onto EVF without necessarily destroying its core.

  3.  **Moral Fanaticism & Counterintuitive Implications:**
      *   **The Problem:** EVF applied to ethics (e.g., utilitarianism with unbounded utility) mandates spending vast resources pursuing vanishingly small chances of astronomical payoffs, neglecting near-certain, significant, finite benefits. Sacrificing everything (including near-certain prevention of widespread suffering) to fund research into preventing scenarios with infinitesimal probability but infinite (dis)utility is rationally required. This seems *morally grotesque* and practically paralyzing.
      *   **Force:** Defenders (Beckstead, Ord) concede this is deeply counterintuitive and practically problematic. Responses include:
          *   **Pragmatic Bounds:** Acknowledge the *theoretical* commitment to fanaticism but adopt *practical* bounds based on computational limits, epistemic uncertainty, or psychological feasibility ("clamped fanaticism"). This saves the theoretical structure but admits it's practically inert or needs supplementation.
          *   **Lexical Thresholds:** Introduce a utility level below which fanaticism doesn't apply (e.g., only outcomes above a certain "astronomical" threshold trigger fanatical reasoning). This preserves fanaticism for the "biggest" stakes but abandons it for ordinary decisions. Requires justifying the threshold non-arbitrarily.
          *   **Cost:** Significant qualification. The "pure" theoretical commitment becomes practically irrelevant or heavily domain-restricted. It feels like a retreat.

  4.  **Epistemic Challenges & Unknowable Probabilities:**
      *   **The Problem:** Assigning meaningful, non-infinitesimal probabilities to scenarios involving "astronomical" stakes is often epistemically impossible. How do we assign a probability like 1/googolplex to a specific complex scenario causing infinite disutility? Our best models might suggest probabilities so small they are effectively *undefined* or *incommensurable*. EVF becomes sensitive to arbitrary or unfounded probability assignments.
      *   **Force:** This doesn't refute EVF *in principle*, but renders its prescriptions *operationally meaningless* or *dangerously unstable* in the very domains where it's supposed to matter most. It forces EVF into dependence on highly speculative epistemology, raising questions about whether "expected value" is even well-defined for such cases. Defenders might bite the bullet, arguing we must use our best estimates, however vague.

  5.  **Structural Instability & Sensitivity:**
      *   **The Problem:** EVF prescriptions are radically sensitive to tiny changes in probability estimates or utility assignments at the extremes. A change in the estimated probability of an astronomical outcome from 10^{-100} to 10^{-101} could completely flip the rational choice. This seems irrational, as our estimates at these scales are inherently fragile.
      *   **Force:** This highlights the practical absurdity and potential arbitrariness of EVF-driven decisions. It reinforces the need for pragmatic bounds or thresholds to achieve stability. Awkward, but not logically fatal.

  **III. Misguided or Question-Begging Objections (Often Raised but Less Compelling for the EVF Defender)**

  These are common criticisms that EVF defenders can often rebut by appealing to the core commitments of unboundedness and EV maximization.

  6.  **"It's Impractical / Humans Can't Do It":**
      *   **Why it Misses:** As you rightly note, EVF is a normative theory of rationality, not a descriptive theory of psychology. Human limitations (calculation, attention, emotion) are irrelevant to the *structure* of rational choice. Defenders readily concede this point. The force is purely rhetorical.

  7.  **"It Leads to Pascal's Mugging":**
      *   **Why it (Often) Misses:** The standard Pascal's Mugging (a stranger threatens immense harm unless paid $5, claiming vast cosmic powers) is easily handled by assigning an appropriately *tiny* prior probability to the mugger's claim being true, justified by the complexity and lack of evidence. EVF only bites when the *probability* is deemed non-negligible *despite* being tiny, which usually requires a more sophisticated scenario (like specific physics models predicting rare catastrophes). Naive muggings are dismissed via reasonable priors. The *deeper* challenge is when sophisticated models *do* assign non-negligible (though tiny) probabilities to vast outcomes – that's where the *real* fanaticism problem lies, not in street muggings.

  8.  **Dutch Book Arguments:**
      *   **Why it (Usually) Misses:** Dutch Book arguments aim to show that violating probability axioms or EV maximization makes one susceptible to guaranteed losses. Since EVF (in its standard formulations) typically adheres to the probability axioms and *is* a form of EV maximization, it avoids traditional Dutch Books. Arguments claiming EVF leads to Dutch Books usually rely on misinterpreting EVF or smuggling in auxiliary assumptions EVF rejects (like bounded utility).

  **IV. Empirical Disconfirmation & Insulation**

  *   **Does EVF Make Testable Predictions Differing from Rivals?** Directly, **no.** Its prescriptions occur in domains (vanishing probabilities, astronomical stakes) inherently beyond empirical verification. A rival theory (e.g., bounded utility) might predict different resource allocations towards mitigating existential risks vs. alleviating current suffering, but:
      1.  Attributing a *lack* of fanatical resource allocation *solely* to rejecting EVF is impossible – it could be due to bounded rationality, disagreement on probabilities/utilities, competing values, etc.
      2.  Observing a *commitment* to fanatical resource allocation is extremely difficult (financially, politically) and wouldn't definitively confirm EVF (could be irrational zealotry).
  *   **Is Insulation a Problem?**
      *   **For Normative Theories:** Insulation from empirical disconfirmation *is* expected and often acceptable for *fundamental* normative principles (like "maximize EV"). We don't empirically test basic logic or arithmetic. The justification is conceptual/axiomatic.
      *   **The Genuine Cost:** The insulation becomes problematic when the theory leads to **practical paralysis** (Mathematical Impossibility), **morally repugnant conclusions** (Moral Fanaticism), or **extreme sensitivity to unfounded assumptions** (Epistemic Challenges). The issue isn't *just* that it's unfalsifiable, but that its *implications* clash violently with other deep-seated intuitions about rationality, morality, and practical reason. The insulation *protects* it from being disconfirmed by these clashes, which is precisely why the clashes become decisive *conceptual* arguments (like points 1 & 2 above).

  **V. Concessions by Defenders**

  Sophisticated defenders (Beckstead being the prime example) explicitly concede:

  1.  **The Mathematical Impossibility Problem:** They acknowledge it as the most serious challenge, requiring significant theoretical workarounds (lexical thresholds, domain restrictions).
  2.  **The Moral Counterintuitiveness:** They agree EVF mandates extreme, seemingly absurd priorities in theory. They often resort to pragmatic clamping for practical application.
  3.  **Epistemic Difficulty:** They acknowledge the challenge of assigning reliable tiny probabilities to vast outcomes.
  4.  **Practical Irrelevance (in most domains):** They concede pure EVF is often not action-guiding for ordinary decisions, requiring supplementation.

  They typically *reject* criticisms based solely on practicality, human psychology, or naive Pascal's Mugging scenarios as missing the theoretical point.

  **Conclusion:**

  Your struggle reflects the genuine tension at the heart of decision theory. EVF is arguably the *most consistent* extension of unbounded EV maximization, which is why its flaws are so illuminating. The strongest defeaters are **internal/logical** (Mathematical Impossibility, Stochastic Dominance Violations) – they threaten the *coherence* of EVF itself. **Moral and Epistemic** challenges are powerful and force significant qualification but are "merely" awkward. Criticisms based on practicality or naive muggings generally miss the mark.

  To move forward, focus deeply on:
  1.  **Formal Results:** Can the Mathematical Impossibility be resolved without abandoning core commitments? Do workarounds like lexical thresholds succeed?
  2.  **Structural Rationality:** Does violating stochastic dominance *truly* refute EVF, or are there responses? Are there other structural rational requirements EVF violates?
  3.  **Meta-Normative Justification:** Can the intuitions driving the rejection of Moral Fanaticism (e.g., the value of near-certain finite goods) be grounded in a more fundamental account of practical reason that avoids arbitrariness?
  4.  **The Nature of "Astronomical" Stakes:** What distinguishes scenarios where fanaticism applies? Can this be defined rigorously?

  EVF is less a settled position and more a powerful probe revealing the fault lines in our understanding of rationality under extreme uncertainty and vast potential value. Its greatest value may lie precisely in forcing us to confront these deep tensions.
