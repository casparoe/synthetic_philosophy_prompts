prompt: |-
  So I've been reading the radical interpretation stuff — Davidson and the people arguing with him — and there's a pattern I keep needing a word for and haven't found one. Let me try to describe it without the jargon, because I think the jargon is exactly what's making me miss it.

  Two concrete things first.

  One: my brother says our dad "never liked" a certain neighbour, and I'm pretty confident he did like her. Before I can even say "you've got that wrong," I catch myself working out what he'd have to mean by never liked — maybe never trusted, maybe never warmed to socially, maybe he's thinking of a different neighbour entirely. Every one of those readings turns him into someone who isn't mistaken. And I notice I basically never land on "he's just wrong."

  Two: an old friend used to insist a certain record was the saddest thing ever written. I don't hear it that way at all. Same move available: I can say she's wrong about the record, or I can say we're using "sad" differently, one of us tracking the sound and one of us tracking the subject matter. The second option is always there, always easier, and never costs me anything.

  The pattern is that apparent disagreement about the world can be refiled as a difference in what the words mean, and the refile is always available. And it only runs one way. I can't do the reverse — I can't take a real difference in meaning and refile it as one of us being mistaken about the world, because being mistaken about the world already requires the meaning to be settled. So the error ledger only ever goes down, never up.

  Here's the bit I think is actually interesting, and where I suspect there's a name I'm missing. There's a ceiling on the trade. If someone turns out wrong about too many things at once, I can't keep refile-ing forever — but the outcome isn't "they're massively wrong about the world." It's "we don't share a language," i.e. I stop treating them as interpretable at all. So the verdicts on offer end up being something like *mostly right* or *not one of us*, and flat-out large-scale localised error gets squeezed out of the option space rather than discovered and then judged. I can't tell if that's a feature people have named or a bug I've invented.

  So: does this have an established name? I already have charity in my toolbox and I know the multiple-equally-good-manuals point, and neither seems to be it — charity is a policy I adopt, and underdetermination is about there being several adequate ways to translate, whereas what I'm describing is about which direction a trade can run and what happens at the limit. If there's a nearest concept, tell me what it is and where exactly my description stops fitting it — I'd rather know the mismatch than get a label. If there's nothing, coin one, define it properly, and give me the boundary cases. In particular: what would a case look like where the refile genuinely isn't available and the interpreter has no choice but to record flat error? Is there such a case, or does the thing have no exceptions, and if it has none, is that a problem for it or the whole point of it?

  Don't bother pointing me at papers or listing who said what, I can't chase those down right now — its the carving I want, not the bibliography.
reasoning: |-
  Okay, the user is grappling with a philosophical concept they've encountered while reading Davidson and related discussions on radical interpretation. They've identified a pattern where apparent disagreements about the world can be reinterpreted as differences in language use, and this reinterpretation seems to only go one way. They're looking for a term that captures this phenomenon.

  The user provides two concrete examples: one about their brother misremembering their father's feelings toward a neighbor, and another about differing interpretations of a song's emotional tone. In both cases, the user notices they instinctively reinterpret the apparent factual error as a difference in meaning rather than accepting that the other person is simply wrong. 

  What makes this particularly interesting to the user is that this strategy has limits. If someone is "wrong" about too many things, we stop seeing them as interpretable at all rather than acknowledging large-scale error. The user wants to know if this concept has a name, and if not, how to properly define it.

  I recognize this as relating to Davidson's principle of charity and Quine's indeterminacy of translation, but the user already knows these concepts and finds them insufficient. They're describing something more specific - the one-way direction of reinterpretation and its breaking point.

  The key aspects seem to be:
  1) The asymmetry of reinterpretation (factual disagreement → meaning difference is possible, but not vice versa)
  2) The upper limit where too many "errors" lead to unintelligibility rather than attribution of error
  3) The consequence that large-scale localized error becomes invisible to the interpretive process

  I recall that Davidson's work does address this breaking point - when interpretation fails due to too much "disagreement," we conclude we don't share enough concepts to communicate. This is indeed different from charity as a policy; it's about the structural constraints of interpretation itself.

  For a precise term, "semantic ascent" captures the move to talking about meanings instead of things, but doesn't convey the asymmetry. The breaking point is what Davidson calls the "conditions of interpretability" or "preconditions for radical interpretation."

  The most accurate description might be that this shows how attribution of error is parasitic on shared meaning, which is itself parasitic on massive agreement. The impossibility of attributing large-scale error isn't a flaw but a necessary feature - if we could do that, interpretation couldn't get off the ground.

  To answer the boundary case question: there likely are no exceptions. Any apparent "flat error" could theoretically be semanticized if we're determined enough, but beyond a certain point, we lose the ability to even try. The only "exceptions" are when we stop seeing someone as interpretable.

  I'll organize this into a clear explanation without jargon, focusing on the structural constraints the user has identified, and naming the key components of what they've described.
answer: |-
  You've hit on something fundamental about interpretive constraints, and while there's no single perfect term, the core concept is **interpretive ineliminability of massive agreement**. Your description is remarkably precise, so let's carve it properly:

  ### Core Concept & Its Name
  - **The Asymmetry**: Factual disagreements can *always* be reframed as semantic differences ("refiled"), but semantic differences *cannot* be reframed as factual errors without presupposing shared meaning.  
  - **The Limit**: When "refiling" becomes unsustainable due to too many "errors," the outcome isn't "massive error" but **interpretive collapse**—the speaker is deemed unintelligible, not mistaken.  
  - **The Verdict Space**: This forces a binary: **charitable coherence** (minor "errors" resolved semantically) or **radical discontinuity** (too many "errors" = no shared language). Large-scale *localized* error is structurally excluded.  

  The nearest established concept is **Davidson's "passage to unintelligibility"** (a consequence of the Principle of Charity), but your focus on the *asymmetry* and *exclusion of error* refines it. Call it **Semantic Primacy in Interpretation** (SPI).  

  ### Why Existing Tools Don't Fit
  - **Charity**: A policy you *choose*; SPI is a *structural constraint* on interpretation itself.  
  - **Underdetermination of Translation (Quine)**: About multiple *valid* manuals; SPI is about *which disagreements can be semanticized* and the *consequences of failure*.  
  - **Indeterminacy of Reference**: Explains *how* refiling works, not why it’s asymmetric or why collapse occurs.  

  ### Boundary Cases: When Refiling Fails?
  SPI has *no exceptions* in radical interpretation. Any "flat error" attribution requires prior semantic stability. But consider these edge scenarios:  

  1. **Contradictory Utterances**:  
     - *Case*: Someone says "It’s raining" while standing in a downpour, then immediately says "It’s not raining" with no contextual shift.  
     - *SPI Response*: You’ll assume equivocation ("raining" means something different in each utterance) or sarcasm before accepting contradiction. If pervasive, you’d doubt their rationality/unintelligibility, not record "error."  

  2. **Mathematical "Error"**:  
     - *Case*: "2 + 2 = 5" said earnestly.  
     - *SPI Response*: You’ll reinterpret "+" (e.g., as string concatenation: "2" + "2" = "22"), "=" (e.g., "approximates"), or numerals (e.g., "2" means three). If they reject all reinterpretations, you question their grasp of logic, not math.  

  3. **Perceptual Gaps**:  
     - *Case*: Insisting a vivid red apple is green.  
     - *SPI Response*: You’ll posit color-blindness, metaphor ("green" = unripe), or dialect differences. Only if *all* color judgments mismatch do you suspect neurological divergence—rendering their language "alien," not "wrong."  

  ### Implications
  - **No Exceptions**: SPI is exceptionless *by design*. Davidson argued that belief attribution *requires* assuming general correctness. To call a belief "false," you must hold meaning fixed; to fix meaning, you need agreement on beliefs.  
  - **Problem or Insight?**: This isn’t a bug—it reveals that **shared intelligibility depends on shared world-orientation**. Large-scale error *about the shared world* is inconceivable because divergence dissolves the "shared world."  
  - **Cost**: SPI "squeezes out" localized large-scale error because such error would destroy the interpretive framework. The cost is that we cannot interpret systematic delusion *as delusion* within our framework—only as incoherence.  

  ### The Coinage: **Interpretive Asymmetry Constraint (IAC)**
  - **Definition**: The structural necessity in radical interpretation where (a) apparent factual disagreement is always resolvable as semantic variance, and (b) failure to resolve it leads to unintelligibility (not attributed error).  
  - **Boundary**: Collapse occurs when semantic variance requires *ad hoc* adjustments that outstrip available contextual/linguistic hooks, making the speaker’s pattern unrecognizable as language-use.  

  You’ve articulated a deep insight: **Error is a luxury of agreement**. When agreement frays, error vanishes—not because it’s absent, but because the scaffold to identify it crumbles. That’s not a flaw in SPI/IAC; it’s the condition for interpretation itself.
