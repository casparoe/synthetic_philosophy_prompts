prompt: |-
  I'm trying to help a friend sanity check two separate decisions she's about to make, and I have a feeling the combination is off but I cant pin down why. First, she's picking between (A) a guaranteed $10k in a year, and (B) a 90% chance of $10k, a 9% chance of $50k, and a 1% chance of getting nothing. She goes with A, which seems totally reasonable to me — why gamble when the sure thing is decent. Then, on a completely unrelated wager, she's picking between (C) a 10% chance of winning $10k and a 90% chance of winning nothing, versus (D) a 9% chance of winning $50k and a 91% chance of winning nothing. She goes with D, which also seems fine — bigger upside and nothing to lose. Is there actually something inconsistent about taking both of these positions, and if so, whats the clearest way to explain it to her without sounding like I'm just nitpicking?
reasoning: |-
  Okay, let me try to figure out what's going on with this friend's choices. She made two decisions that individually seem reasonable, but together might be inconsistent. 

  First, she chose the guaranteed $10k over the gamble with mostly the same payout but a small chance at $50k or nothing. Then in a separate scenario, she picked the tiny chance at $50k over the slightly better chance at $10k. Hmm, both choices make sense on their own - risk aversion in the first, going for broke in the second. 

  But I recall that in decision theory, we can model choices mathematically using utility functions. The key idea is that if someone's choices follow certain patterns, we can represent their preferences using a utility function and probability weighting. The inconsistency here might be related to how she's weighting probabilities in different scenarios.

  Let me try to map her choices to expected utility calculations. For the first choice, preferring A over B suggests that the utility of guaranteed $10k is higher than the weighted average of the gamble's outcomes. For the second choice, preferring D over C means she values the small chance at $50k more than the slightly better chance at $10k.

  The interesting part is that these two choices together might violate the independence axiom of expected utility theory. That axiom basically says that when comparing two options, adding the same third option shouldn't change your preference. But here, adding the "nothing" outcome in different proportions seems to flip her risk preference.

  I think the clearest way to show the inconsistency is to frame both choices around the same core gamble. Option B is essentially "90% chance of $10k plus a 10% chance of something better or worse" while the second choice is about preferring a lottery ticket with worse odds for a bigger prize. When you present the choices side-by-side, it becomes clear that in the first case she's avoiding risk where she has something to lose, but chasing risk when there's nothing to lose - which makes psychological sense but isn't mathematically consistent.

  The paradox reminds me of the Allais paradox where people violate expected utility theory in predictable ways. People tend to over-weight certainty and also over-weight small probabilities of big gains. That might explain both choices - she overweights the certainty in the first choice, and overweights the tiny chance at the big prize in the second.

  To explain this without sounding nitpicky, I should emphasize that this is a very common human behavior pattern. I could show her how the two choices mathematically lead to contradictory weightings of the same outcomes. But I should also acknowledge that in real life, these might be reasonable given different circumstances - though if she's making many such decisions, the inconsistency could lead to predictable losses.
answer: |-
  You've spotted a classic paradox in decision theory! Your friend's choices are individually reasonable but mathematically inconsistent when combined. This is a variation of the **Allais Paradox**, demonstrating how people often violate the axioms of rational choice (expected utility theory). Here's the clearest way to explain the inconsistency:

  ### The Inconsistency (Mathematical Core)
  1.  **Choice 1 (A > B):** She prefers **$10k guaranteed** over:
      *   90% chance of $10k
      *   9% chance of $50k
      *   1% chance of $0
      *   **Implied:** `U($10k) > 0.90 * U($10k) + 0.09 * U($50k) + 0.01 * U($0)`

  2.  **Choice 2 (D > C):** She prefers:
      *   9% chance of $50k + 91% chance of $0
      *   Over 10% chance of $10k + 90% chance of $0
      *   **Implied:** `0.09 * U($50k) + 0.91 * U($0) > 0.10 * U($10k) + 0.90 * U($0)`

  3.  **The Contradiction:** Let's rearrange the inequalities:
      *   From Choice 1: `U($10k) - 0.90 * U($10k) > 0.09 * U($50k) + 0.01 * U($0)`
          *   Simplify: `0.10 * U($10k) > 0.09 * U($50k) + 0.01 * U($0)`  ...(Eq 1)
      *   From Choice 2: `0.09 * U($50k) + 0.91 * U($0) > 0.10 * U($10k) + 0.90 * U($0)`
          *   Simplify: `0.09 * U($50k) + 0.01 * U($0) > 0.10 * U($10k)` ...(Eq 2)
      *   **Spot the Problem:** Equation 1 says `0.10 * U($10k)` is *greater than* `0.09 * U($50k) + 0.01 * U($0)`.
          Equation 2 says `0.10 * U($10k)` is *less than* `0.09 * U($50k) + 0.01 * U($0)`.
      *   **They directly contradict each other:** `A > B` and `B > A` cannot both be true.

  ### The Clearest Way to Explain It (Without Nitpicking)
  Focus on the *common gamble* hidden in both choices:

  1.  **"Look at the core difference between B and the safe option A."** In the first choice, she's rejecting a gamble that offers:
      *   A **90%** chance to stay at $10k (same as A).
      *   A **9%** chance to jump up to $50k (great!).
      *   Only a **1%** chance to drop to $0 (bad).
      *   She says "No thanks, I'll just take the sure $10k." This shows she *hates* that 1% risk of getting nothing when $10k is guaranteed.

  2.  **"Now look at the second choice."** Here, she's comparing two gambles *both* involving a high chance of $0:
      *   Option C: 10% chance at $10k (90% $0)
      *   Option D: 9% chance at $50k (91% $0)
      *   She prefers D (9% @ $50k) over C (10% @ $10k). This makes sense – the small drop in chance (1%) feels worth the huge jump in potential reward.

  3.  **"Here's the rub..."** The key difference between rejecting B (in choice 1) and preferring D (in choice 2) boils down to the *exact same 1% change* and the *exact same outcomes*:
      *   **Rejecting B means she values:** Avoiding a **1% risk of $0** (compared to the sure $10k) *more than* she values a **9% chance to gain $40k** ($50k - $10k).
      *   **Choosing D means she values:** A **9% chance to gain $40k** ($50k - $10k) *more than* she values an **extra 1% chance to win $10k** (compared to the base 90% chance of $0 in both C and D).
      *   **The Conflict:** She can't logically value *avoiding* a 1% risk of $0 + 9% gain of $40k as bad in the first choice (when she has $10k guaranteed), but then value the *opportunity* for that same 9% gain of $40k as good in the second choice (when the alternative is only a slightly better chance at $10k). The 1% difference in the chance of $0 is the critical factor she's weighting oppositely.

  ### Why It Feels Reasonable (The Psychology)
  *   **Choice 1 (A > B):** This is **loss aversion** and the **certainty effect**. The guaranteed $10k feels like a "sure gain." The 1% risk of losing it all ($0) looms very large psychologically, making the gamble seem unattractive despite the 9% shot at $50k. People overweight small probabilities of bad outcomes when a sure gain is present.
  *   **Choice 2 (D > C):** This is about **potential gains when facing likely loss**. Both options likely result in nothing (90%+ chance). The tiny reduction in chance (10% -> 9%) feels insignificant compared to the massive jump in the prize ($10k -> $50k). People overweight small probabilities of large gains when the alternative is a small gain or likely nothing.

  ### How to Frame the Conversation
  *   **Acknowledge:** "Both choices make perfect sense *on their own* given how people naturally think about risk and reward. I'd probably feel the same way in each situation."
  *   **Present the Core:** "The interesting thing is that when we look at these two choices together, they reveal a slight inconsistency in how we weight that specific 1% risk and the 9% chance at the big gain. It's a really common human tendency, famous enough to have a name (the Allais Paradox)."
  *   **Focus on the Trade-off:** "The heart of it is that in the first scenario, you paid a 'price' (giving up the 9% shot at $50k) to *avoid* a 1% risk of $0 when you had $10k guaranteed. In the second scenario, you were *willing* to *accept* that same 1% drop in your chance of winning *something* (from 10% to 9%) in order to get that 9% shot at $50k instead of $10k. It's logically tricky to justify paying to avoid something in one case and then accepting it for a similar benefit in another."
  *   **Practical Implication (Optional):** "The main takeaway isn't that either choice is 'wrong,' but that this kind of inconsistency can sometimes lead to predictable patterns where we might make slightly suboptimal decisions over many similar bets. Being aware of it helps us double-check our gut feelings in important financial decisions."

  By framing it as a fascinating quirk of human psychology (which it is!) and focusing on the *common element* (the 1% risk / 9% gain $40k trade-off), you avoid sounding critical while clearly demonstrating the underlying inconsistency. You're highlighting a pattern, not attacking her specific choices.
