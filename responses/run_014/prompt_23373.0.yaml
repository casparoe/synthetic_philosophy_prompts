prompt: |-
  I've been using a chat model to help with my historical novel, and I keep runin into this wall. If I ask it directly about the kind of thing I need — say, how the customs house in 1860s Marseille actually worked, or what the silk merchants' guilds were called — it hedges, says it doesn't know, or just makes stuff up. But if I write half a scene where a character is doing the paperwork and ask it to keep going, it spits out details that look right. And if I tell it to act like an expert on 19th century French port administration, it suddenly knows a lot, except some of it is confidently wrong. I'm starting to wonder if I'm just using it wrong. What's actually going on, and how should I set up my workfow around it?
