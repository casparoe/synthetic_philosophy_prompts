  Hmm, their core struggle is actually about understanding the AI's fundamental limitations. They're clearly observant enough to notice the inconsistency ("why does it know things in character but not straight answers?"), but haven't quite connected that to how LLMs actually generate text. The workflow frustration suggests they're trying to use it like a search engine or database, which is setting them up for failure.

  What they really need is framework to: 
  First, accept that this isn't a knowledge-retrieval tool but a pattern-matching text generator. Those "expert mode" details aren't recalled—they're probabilistically hallucinated based on similar fiction/nonfiction in the training data. 
  Second, leverage its strengths (scene extrapolation, sensory detail suggestion) while avoiding factual traps. The fact they noticed the "confidently wrong" bits is promising—they've got good skepticism muscles.

  Their deeper need? Probably validation that they're not "using it wrong" plus concrete workflow adjustments. The unspoken anxiety might be "am I compromising historical accuracy by relying on this?" which is very real for serious historical fiction writers.

