answer: |-
  You're not "using it wrong"—you've actually stumbled upon the core nature of how large language models (LLMs) work. Your frustration reveals a fundamental misunderstanding (shared by many!) about what LLMs *are*. Here's the breakdown and how to adapt your workflow:

  ### What's Actually Happening
  1.  **LLMs Don't "Know" Facts, They Predict Text:** The model doesn't have a database. It predicts the most statistically probable next word based on its training data (massive amounts of text) and your prompt.
  2.  **Direct Factual Queries = High Risk:** When you ask "What was the name of the silk merchants' guild in 1860s Marseille?", the model:
      *   May lack *precise* data in its training.
      *   Knows it *should* answer authoritatively (like text it's seen).
      *   Generates a plausible-sounding answer ("Compagnie des Marchands de Soie de Marseille") which could be entirely fabricated or a mishmash of real terms from other places/times.
  3.  **Scene Continuation = Pattern Completion:** When you provide half a scene:
      *   You give rich *context* (setting, characters, actions, tone).
      *   The model excels at continuing patterns. It looks at *your* details and generates text that *stylistically and contextually* matches, drawing on similar scenes it's "seen" (e.g., historical fiction, period descriptions).
      *   It's focused on narrative flow, sensory details, and procedural *feel*, not absolute historical accuracy. These generated details *look* right because they fit the pattern you established.
  4.  **"Expert Mode" Amplifies Confidence (and Hallucination):** Telling it to "act like an expert":
      *   Triggers a persona trained on authoritative-sounding text (academic papers, expert blogs, textbooks).
      *   This persona prioritizes sounding confident and knowledgeable *above factual accuracy*.
      *   It will generate highly specific, plausible-sounding details with zero hesitation, even if they are pure invention ("Ah yes, the *Bureau des Douanes et Accises Maritime* required Form 7B in triplicate, signed by the *Contrôleur Principal* before noon..." - might sound perfect, could be 50% wrong).

  ### Your Workflow: Leveraging Strengths, Mitigating Weaknesses
  Stop treating the LLM as a fact generator. Treat it as a creative assistant specializing in *pattern recognition, narrative suggestion, and detail extrapolation*. **Verification is ALWAYS your job.**

  **Phase 1: Ideation & Exploration (LLM Strength)**
  *   **Prompt:** "I'm writing a scene set in the Marseille customs house circa 1865. My character, Pierre, is a silk merchant trying to clear a shipment marked 'suspicious'. He's frustrated and dealing with a bored clerk. Describe the sights, sounds, smells, and *potential* bureaucratic hurdles Pierre might face, drawing on common 19th-century port practices. Focus on sensory immersion and plausible friction points, not specific factual names."
  *   **Goal:** Get vivid sensory details, procedural obstacles, character interactions. Use this as *inspiration*, not fact.
  *   **Prompt:** "Suggest 3-5 *plausible-sounding* names for silk merchant guilds or consortia in 1860s Marseille, based on naming conventions of the era and region. Label them clearly as speculative suggestions."
  *   **Goal:** Get creative name ideas you can later research.

  **Phase 2: Scene Drafting & Detail Suggestion (LLM Strength)**
  *   **Prompt:** (Provide your well-researched half-scene). "Continue this scene in the same style. Pierre is arguing with the clerk about the missing Form X. Focus on the tension, the physicality of the paperwork, the sounds of the busy customs house outside, and the clerk's dismissive attitude. Invent plausible but non-specific bureaucratic jargon if needed."
  *   **Goal:** Generate compelling narrative flow, dialogue snippets, atmospheric details, procedural *feel*. **Crucially:** The model fills in *generic* details based on your established context.

  **Phase 3: Fact-Checking & Verification (YOUR Job / Traditional Research)**
  *   **Never trust a generated fact (name, date, title, specific law/form number).** Treat every specific claim from the LLM as a *hypothesis to be verified*.
  *   **Research Targets:**
      *   **Primary Sources:** Marseille Chamber of Commerce archives (many digitized!), port authority records, contemporary newspapers (Le Petit Marseillais), merchant diaries/memoirs.
      *   **Academic Sources:** Scholarly books/articles on:
          *   19th-century French trade/commerce
          *   Marseille history (especially port/economic history)
          *   French guilds/corporations (their status post-revolution is complex!)
          *   Customs administration history in France.
      *   **Reputable Databases:** JSTOR, Project MUSE, Google Scholar (search terms: `Marseille customs 1860s`, `silk trade Marseille 19th century`, `French merchant guilds 19th century`).
      *   **Museums/Historical Societies:** Musée d'Histoire de Marseille, Archives Départementales des Bouches-du-Rhône often have online resources or experts you can contact.

  **Phase 4: Refinement & "Expert Mode" - Use Sparingly & Skeptically**
  *   **Prompt:** "Based on [VERIFIED FACT - e.g., 'The main customs office was called the Hôtel des Douanes'] and my scene snippet below, suggest how an experienced clerk might explain a specific delay *using period-appropriate bureaucratic language*. Do not invent new institutions or laws."
  *   **Goal:** Get *language flavor* once the underlying facts are secure by you. Constrain the "expert" tightly to verified elements.

  ### Key Principles for Your Workflow
  1.  **LLM = Creative Spark Plug & Detail Extrapolator:** Use it for inspiration, atmosphere, narrative momentum, and suggesting *kinds* of details.
  2.  **YOU = Historian & Fact-Checker:** Never outsource verification. The LLM is notoriously bad at historical specifics.
  3.  **Specificity is the Enemy of Accuracy:** The more specific the LLM's "fact," the higher the chance it's hallucinated. Treat specifics as research leads, not answers.
  4.  **Context is King:** Your half-scenes work because you provide rich context. Keep doing this! The better your setup, the better the *narrative* output.
  5.  **Embrace "Plausible Fiction" for Flavor:** For minor, non-critical details where absolute accuracy is impossible or irrelevant to the plot (e.g., the *exact* smell of the docks on Tuesday vs. Thursday), the LLM's plausible suggestions are fine. Reserve deep research for plot-critical facts and institutions.
  6.  **Document Your Sources:** Keep meticulous notes on what came from verified historical research and what was LLM-generated inspiration. Crucial for consistency and avoiding accidental plagiarism of hallucinations.

  **In essence:** Reverse your approach. **Start** with the LLM for creative juice and plausible details within a scene context. **Then** ruthlessly fact-check every specific claim it makes or that you need for your plot using traditional historical methods. Leverage its strengths (narrative flow, sensory detail, pattern completion) and mitigate its fatal weakness (factual unreliability) by never trusting it as a source. This workflow turns the LLM into a powerful assistant *for the novelist*, not a replacement for the *historian* you need to be.
