prompt: |-
  Write a poem of exactly five four-line stanzas for a reading group that has spent a term on heuristic arguments in AI-safety forecasting. The concept is the presumption of independence: when you estimate the chance that a computation succeeds by listing the conditions it would have to satisfy and multiplying their probabilities, you default to treating those conditions as independent — satisfying one tells you nothing about satisfying another — and you abandon that default only when you can point to something that makes two of them travel together. The form should enact this rather than describe it. Let the first four stanzas heap up conditions and coincidences while the speaker's running product of probabilities falls to something absurdly small; let the fifth turn on the dependence the speaker had assumed away, the shared cause that makes the conditions travel together, so that the joint chance is not the product and the speaker can name the direction in which their arithmetic was wrong. Give the poem a single refrain line, in the same position in every stanza: the speaker should spend four stanzas treating its return as a coincidence that wants explaining, and the fifth should show that, once the shared cause is in view, the return carries no independent information at all. It should be recognizable to someone who works on this as a poem about the presumption and about the specific way it fails, and it should stand up for a reader who has never heard of it. Give me the poem alone, with no title, preface, or afterword.
