prompt: |-
  Give an example of a case in which an agent performs a morally right action, and the agent’s motivation is not vicious or selfish, yet the action lacks moral worth because the agent’s operative reason for acting is a non-moral consideration that merely coincides with the reason that makes the action right. The example should specify what the agent is actually responding to when deciding to act.
reasoning: |-
  Okay, the user is asking for an example where an agent does something morally right but without moral worth because their motivation isn't aligned with the moral reason. Let me start by recalling Kant's idea of moral worth. He emphasizes that actions have moral worth only if done from duty, not just in accordance with duty. So, the challenge is to find a scenario where the action is right, but the reason isn't moral.

  First, I need to identify a morally right action. Something universally accepted as good, like helping others or telling the truth. Then, the agent's motivation should be non-moral. Common non-moral motives include personal gain, fear of punishment, or social approval. But the user specified it shouldn't be vicious or selfish. So, motives like vanity, desire for praise, or avoiding awkwardness might work. 

  Let me brainstorm examples. Maybe someone helps a homeless person to look good in front of others. That's vain but not selfish in a material sense. Or someone tells the truth to avoid the hassle of lying. The action is right, but the motive isn't moral. 

  The user wants the operative reason specified. So, the example must clearly state what the agent is responding to. For instance, donating to charity for tax benefits. But is that selfish? The user said not vicious or selfish. Tax benefits are self-interested, which might be seen as selfish. Need a non-selfish non-moral motive. 

  How about social norms? Like returning a lost wallet because it's expected, not because it's right. But again, is avoiding disapproval selfish? Maybe vanity is better. Donating to be praised. The action is good, but the reason is praise. 

  Another idea: helping someone because you feel good. Altruism for emotional reward. But is that moral? Kant would say no if it's for the pleasant feeling. So, volunteering to feel happy. The moral reason is helping others, but the agent's reason is personal satisfaction. That fits. 

  But the user mentioned "non-moral consideration that coincides." Personal satisfaction coincides with helping others but isn't the moral reason. The moral reason is duty to help, the agent's reason is feeling good. 

  Need to ensure it's not selfish. Feeling good isn't necessarily selfish; it's a byproduct. Yet, if that's the primary motive, it lacks moral worth. 

  Example: Alex volunteers at a shelter because it makes them happy. The moral reason is alleviating suffering, but Alex is motivated by personal joy. The action is right, motivation isn't vicious, but lacks moral worth. 

  Check the requirements: action morally right? Yes. Motivation not vicious? It's about personal happiness, not malice. Operative reason non-moral? Yes, emotional reward. Coincides with moral reason? Helping happens, but for different reasons. 

  Also, specify what the agent responds to: Alex is responding to the desire for personal fulfillment, not the moral duty. 

  This should work. Let me structure it clearly.
answer: |-
  Here's an example fulfilling all the criteria:

  **Action:** Alex donates a significant sum to a reputable charity providing clean water wells in drought-stricken regions. This act is morally right; it alleviates suffering and saves lives.

  **Agent's Operative Reason & What They Are Responding To:** Alex donates *because* they anticipate the positive social recognition and praise they will receive from their peers and on social media for being a "generous philanthropist." They are primarily responding to their desire for enhanced social status and admiration. The actual plight of the people needing water, or the moral duty to help those in desperate need, plays no significant role in their decision-making process.

  **Why it lacks Moral Worth (Kantian Perspective):**
  1.  **Morally Right Action:** Yes. Donating to save lives is objectively good.
  2.  **Motivation Not Vicious/Selfish:** Alex isn't stealing to donate (vicious) or donating solely to get a tax break bigger than the donation (selfish in the narrow sense). Seeking social praise is a common, non-malicious human desire; it's vain or self-regarding, but not inherently vicious or narrowly selfish (like hoarding resources).
  3.  **Non-Moral Operative Reason:** Alex's reason for acting is entirely non-moral – the desire for social recognition and esteem. This is a self-regarding inclination.
  4.  **Coincidence with Moral Reason:** The *actual* moral reason making the donation right is the imperative to alleviate extreme suffering and preserve human life. Alex's action *coincidentally* fulfills this moral duty, but it was performed *because* it fulfilled their non-moral desire for praise. The action aligns with duty but is not done *from* duty or a recognition of the moral reason itself.

  **Key Distinction:**
  *   **What Makes the Action Right:** The alleviation of suffering and preservation of life (the moral reason).
  *   **Why Alex Acts:** The expectation of social praise and enhanced reputation (the non-moral, coinciding reason Alex responds to).

  Alex's action is right and stems from a common, non-vicious inclination. However, it lacks moral worth because the motivating force wasn't the recognition of the moral duty to help those in need; it was the self-serving (though not viciously selfish) desire for admiration. The rightness of the act was merely a fortunate byproduct of Alex's pursuit of social status.
