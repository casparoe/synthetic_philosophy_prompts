prompt: |-
  Two colleagues of mine argued over coffee after a talk on epistemic democracy, and I honestly couldn't referee. Mara said the Condorcet jury theorem is a genuine argument for majority rule: if each juror is more likely than not to reach the correct verdict and their judgments are independent, then the probability that the majority is correct approaches one as the jury grows, so larger juries are epistemically superior. Devon replied that the theorem is a knife-edge result that tells us little about real juries: it requires strict independence, which deliberating jurors plainly violate, and it has a cliff at p = 1/2, so if jurors are even slightly biased the wrong way, majority rule is worse than a coin flip and you would want the opposite of majority rule. Mara answered that the independence assumption is idealized in every such model, that the theorem's purpose is to identify the conditions under which majority rule is epistemically sound rather than to mirror real juries exactly, and that empirically jurors are at least as competent as random, so p ≥ 1/2. Devon conceded the empirical point but said it is the wrong metric: the theorem maximizes the chance of the correct verdict, treating a false conviction and a false acquittal as equally bad, whereas criminal law cares about minimizing wrongful convictions, and the theorem is silent on that asymmetry; she added that if p is only barely above 1/2, the jury would have to be enormous before the probability approaches one, which is impractical. Mara said the asymmetry is a limitation of the theorem, not a refutation of it, that the theorem still establishes majority rule is not anti-competent whenever p ≥ 1/2, and that there are versions that relax independence to allow moderate correlation. Devon said that relaxing independence requires strong extra conditions and yields a much weaker result, so the clean theorem is a beautiful mathematical fact but a poor guide to how juries should actually be constituted. Going through their exchange, can you say who is right about which specific claim, and whether either of them is missing something important?
reasoning: |-
  Okay, let me try to unpack this debate between Mara and Devon about the Condorcet jury theorem. Mara seems to be defending the theorem as a solid argument for majority rule, while Devon is pointing out its limitations in real-world applications. 

  First, I need to recall what the Condorcet jury theorem actually says. It states that if each juror has a probability p > 0.5 of being correct and their judgments are independent, then as the jury size increases, the probability of the majority being correct approaches 1. That's the core idea Mara is relying on.

  But Devon raises several practical objections. The independence assumption is a big one - real juries deliberate together, so their judgments aren't independent. There's also the issue of p=0.5 being a cliff edge - if jurors are slightly biased toward wrong decisions (p<0.5), majority rule becomes worse than random. 

  I notice Devon makes a subtle but important point about error asymmetry. The theorem treats false convictions and false acquittals equally, but in criminal law, we care more about avoiding wrongful convictions. The standard CJT doesn't account for this.

  Mara counters that models always involve idealizations, and the theorem's value is in identifying conditions for epistemic soundness. She mentions there are versions that relax independence, though Devon argues these come with trade-offs.

  On the empirical side, both seem to agree jurors are generally competent (p≥0.5), but Devon emphasizes that if p is only slightly above 0.5, impractically large juries would be needed for high accuracy. That's a real practical constraint.

  The more I think about it, both have valid points. Mara is correct about what the theorem formally shows, while Devon is right about implementation challenges. Neither seems to mention that in asymmetric error contexts, we might actually want supermajority rules or other voting systems - that feels like an important gap.

  Also, the discussion about correlated judgments could use more nuance. There are indeed generalized CJT versions, but as Devon says, they require stronger assumptions and give weaker convergence guarantees. That tension between mathematical purity and practical application is at the heart of their disagreement.

  I should probably structure this by evaluating each claim systematically - first the basic theorem validity, then independence concerns, the p=0.5 cliff, practical convergence rates, error asymmetry, and alternative models. Each has elements where Mara or Devon is more correct.
answer: |-
  Here's a breakdown of the key claims in Mara and Devon's debate, evaluating who is right on each point and identifying important omissions:

  ### 1. **The Core Theorem's Validity**
     - **Mara's Claim:** The CJT (with *p* > 0.5 and independence) proves majority rule becomes infallible as the jury grows.  
       **Verdict:** **Correct.** This is the theorem's mathematical conclusion.
     - **Devon's Claim:** Real-world juries violate strict independence due to deliberation.  
       **Verdict:** **Correct.** Deliberation introduces correlation (shared evidence, group dynamics), breaking independence.

  ### 2. **The "Knife-Edge" at *p* = 0.5**
     - **Devon's Claim:** The theorem has a "cliff" at *p* = 0.5: if *p* < 0.5, majority rule performs *worse* than a coin flip.  
       **Verdict:** **Correct.** For *p* < 0.5, the probability of a correct majority verdict *decreases* toward 0 as the jury grows. "Opposite of majority rule" (e.g., minority rule) could indeed be better.
     - **Mara's Response:** Empirically, *p* ≥ 0.5 for real jurors.  
       **Verdict:** **Plausible but incomplete.** While evidence suggests jurors *often* have *p* > 0.5, this isn't universal (e.g., complex evidence, cognitive biases). Devon correctly flags that the theorem offers *no safety net* if *p* dips below 0.5.

  ### 3. **Practical Convergence**
     - **Devon's Claim:** If *p* is only slightly > 0.5, impractically large juries are needed for high accuracy.  
       **Verdict:** **Correct.** E.g., with *p* = 0.51, a jury of 10,000 is needed for >99% accuracy. Real juries (e.g., 12 people) gain little if *p* is marginal.
     - **Mara's Response:** The theorem shows majority rule isn't "anti-competent" if *p* ≥ 0.5.  
       **Verdict:** **True but underspecified.** For small juries and *p* ≈ 0.5, majority rule is only marginally better than random (or worse if *p* < 0.5). The theorem doesn't guarantee practical superiority for feasible sizes.

  ### 4. **Error Asymmetry (False Convictions vs. False Acquittals)**
     - **Devon's Claim:** The CJT ignores asymmetric costs of errors (prioritizing avoiding wrongful convictions over wrongful acquittals).  
       **Verdict:** **Crucially correct.** The CJT minimizes *total error*, treating both errors equally. Criminal justice systems typically minimize Type I errors (false convictions), making majority rule potentially unsuitable if it risks more false convictions.
     - **Mara's Response:** This is a "limitation," not a refutation.  
       **Verdict:** **Insufficient.** This isn't a minor caveat—it undermines the CJT's direct applicability to criminal trials. Neither mentions alternative voting rules (e.g., supermajority for conviction) that explicitly handle asymmetry.

  ### 5. **Relaxing Independence**
     - **Mara's Claim:** Generalized CJT versions exist that allow moderate correlation.  
       **Verdict:** **Partially correct.** Models exist (e.g., Ladha 1992) that tolerate *limited* correlation, but they require strong assumptions (e.g., bounded correlation structures).
     - **Devon's Response:** These generalizations yield weaker results (slower/no convergence) and are less elegant.  
       **Verdict:** **Correct.** Correlation typically reduces epistemic gains. Convergence may require larger juries or fail entirely if correlation is too high. The "clean" CJT is indeed fragile.

  ### 6. **Epistemic vs. Practical Guidance**
     - **Devon's Claim:** The CJT is a "beautiful mathematical fact" but a poor guide for real juries.  
       **Verdict:** **Largely justified.** The theorem’s idealizations (independence, fixed *p*, symmetry) rarely hold. Real juries need mechanisms to mitigate correlation (e.g., secret ballots) and asymmetry (e.g., unanimity/high burdens of proof).
     - **Mara's Claim:** The theorem identifies conditions for epistemic soundness, not realism.  
       **Verdict:** **Valid but overextended.** While useful for theoretical insight, Mara understates how deviations from ideal conditions (e.g., slight correlation or *p* ≈ 0.5) drastically alter outcomes.

  ---

  ### **What Each Missed**
  1. **Mara:**
     - **The "Small Jury" problem:** For *p* ≈ 0.5, small juries (e.g., 12 people) offer negligible gains over a single juror.  
     - **Endogenous Competence:** Deliberation may *improve* individual competence (*p*), offsetting correlation concerns. The CJT assumes fixed *p*.

  2. **Devon:**
     - **Generalized Models:** Recent work (e.g., "Condorcet networks") shows robustness to *some* correlation if biases are random, not systematic.  
     - **Competence Thresholds:** Even with correlation, if average *p* > 0.5 and correlation isn't extreme, majority rule often remains reliable.

  3. **Both:**
     - **Systematic Bias:** If jurors share a bias (e.g., racial prejudice), *p* < 0.5 or high correlation can make larger juries *worse*.  
     - **Alternative Rules:** Neither discusses asymmetric voting rules (e.g., convict only on unanimity, acquit on majority) that better align with legal priorities.

  ---

  ### **Conclusion**
  - **Mara** is right about the **mathematical validity** of the CJT and its core insight (majority rule amplifies individual competence under ideals), but overstates its practical guarantees.  
  - **Devon** is right about the **real-world fragility** (independence, *p* ≈ 0.5 cliff, asymmetry, slow convergence) and the CJT's limitations as a policy tool, but underplays recent work on robust generalizations.  
  - **Key Gap:** Both neglect how legal systems *combine* voting rules with other safeguards (e.g., jury instructions, voir dire) to *engineer* conditions closer to CJT ideals (e.g., boosting *p* > 0.5) or mitigate asymmetry. The CJT is a starting point, not a full prescription.
