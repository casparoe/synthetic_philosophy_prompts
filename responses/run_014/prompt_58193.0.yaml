prompt: |-
  So I've been obsessing over that heap puzzle on my own lately, you know the one where one grain isn't a heap and one extra grain never seems to make the difference but at some point you definitely have a heap, same deal with going bald one hair at a time, I'm not academic or anything I just got sucked in watching explainers late at night.
  The reason its stuck in my head is I'm on the volunteer committee for my apartment building with like 30 units and we have to rewrite the laundry room rule about leaving a big mess behind, right now everyone fights about what counts as big and whether a warning is fair.
  Can you lay out what you think are the two or three most important implications of that heap/baldness puzzle for how we should actually write our rule, like is it a mistake to try to pick a sharp cutoff even if its arbitary, should we leave the wording a bit fuzzy on purpose, or is giving a bunch of concrete examples better, and what goes wrong with each option? No need for any reading list or citations, I just want help thinking it through for a real building where people will arguement about it.
