prompt: |-
  I chair a city council's commemoration review panel: six lay volunteers with no legal or historical training, roughly forty petitions a year asking that a street, statue, plaque, or building name be removed, renamed, or recontextualized. We get ninety minutes per petition and must produce a written recommendation that will survive public scrutiny whichever way it goes. Please write a decision procedure we can actually run: the questions in order, what counts as a sufficient answer to each, where it terminates in retain, where in remove, and where it must stop and hand the matter back to the council because the remaining question is one of values rather than facts.

  It has to handle four things we currently fumble.

  First, classification. A name on a hospital wing, an equestrian statue in a courthouse square, and a street sign do not do the same work; the procedure must sort the object before it weighs the person. Tell me which of the honor-versus-record distinctions must survive the simplification and which can be dropped, and at what cost.

  Second, the standards-of-the-time objection. The procedure may not license pure presentism, but neither may it excuse everything by appeal to the era. I want an explicit test turning on whether the conduct was contestable within the honoree's own milieu and whether the honoree was confronted with it by contemporaries — and a rule for what to do when the historical record is silent on both.

  Third, aggregation. A grave wrong against a substantial public legacy: the procedure must say whether these are weighed against each other and, if so, how, without collapsing into arithmetic and without letting the legacy purchase immunity.

  Fourth, consistency across objects. One honoree may appear on three streets and a bridge. The procedure must say whether a verdict on one object binds the others, or whether different objects may legitimately diverge, and who resolves a conflict.

  Then run it on three petitions: (A) an 1870s physician whose free clinic still serves the neighborhood, and who also performed non-consensual experiments on inmates of the county poorhouse; (B) a suffragist honored with the courthouse-square statue, whose published views on immigration restriction we would now call eugenicist; (C) a bridge named for an industrialist whose fortune rested partly on a company town's wage-scrip system, where the union petitioning for removal is itself funded by his foundation. At least one of these should come out retain — tell me which one will embarrass us and why the procedure is nonetheless right to reach it.

  Finally, be honest about the failure modes: where the procedure will be gamed by petitioners, and where it will deliver an answer that is defensible but wrong.
reasoning: |-
  Hmm, this is a fascinating challenge from a city council commemoration review panel chair. They need a practical decision procedure that handles complex historical commemoration issues with limited time and resources. Let me break this down carefully.

  The user has outlined four key pain points: classification (different types of memorials), historical context standards, weighing wrongs against legacies, and consistency across multiple commemorations. They also want three test cases analyzed and honest assessment of flaws.

  First, I need to design a tiered classification system since not all commemorations function the same way. Street names are fundamentally different from statues in terms of intentionality and permanence. The honor-versus-record distinction is crucial here - we can drop it for street names but must preserve it for statues and plaques.

  For the historical standards dilemma, I'm considering a three-part test: 1) Was the conduct contested by contemporaries? 2) Were there alternative ethical positions available at the time? 3) Did the honoree face criticism? The historical silence problem needs a tiebreaker rule - I'll suggest defaulting to removal when silence meets certain conditions.

  The aggregation problem is trickiest. We can't do simple math (100 good deeds vs 1 atrocity), but we also can't let legacy immunize harm. A "fundamental dignity violation" threshold makes sense - certain acts contaminate any honor regardless of other achievements. For harms below that threshold, we could consider proportionality.

  For consistency across objects, I propose a "commemoration hierarchy" approach where verdicts bind downward but not upward. So removing a statue might not require renaming a street, but naming a new hospital wing would be bound by existing decisions.

  Now for the test cases:
  - The physician (A) likely retains the clinic name because the harm, while grave, occurred outside its commemoration context
  - The suffragist (B) might keep the statue since her contested views weren't her primary legacy
  - The industrialist (C) is where it gets uncomfortable - the bridge should probably be renamed despite the union's funding conflict because the wage-scrip system violated fundamental dignity

  The procedure will have vulnerabilities. Petitioners might game the historical silence rule or classification thresholds. And sometimes we'll get "defensible but wrong" outcomes when historical nuance gets flattened - that's the cost of a practical system.

  The key is building in off-ramps to council when value judgments are unavoidable. And being transparent that some outcomes will feel unsatisfying - that's inherent to balancing historical complexity with civic decision-making.
answer: |-
  Here is a comprehensive decision procedure designed for your panel's constraints, addressing your four fumble points explicitly. It prioritizes efficiency, defensibility, and clear off-ramps to the council for value judgments.

  **The Commemoration Review Procedure (CRP)**

  **Phase 0: Pre-Submission (Staff Action)**
  1.  **Classify the Object:** Staff pre-sorts petitions using a mandatory taxonomy *before* panel review:
      *   **Tier 1 (Honorific Intent & High Prominence):** Statues, Busts, Dedicated Plaques, Named Buildings/Wings (especially civic, educational, medical). *Focus: Active celebration of an individual's character/achievements.*
      *   **Tier 2 (Honorific Intent & Lower Prominence/Utility):** Street Names, Parks, Bridges, Minor Squares. *Focus: Recognition, often blended with wayfinding/utility.*
      *   **Tier 3 (Primarily Historical Record):** Informational plaques (contextualizing events, not primarily praising individuals), archive names, non-dedicated building names (e.g., "The Old Smith Warehouse"). *Focus: Factual commemoration of place/event.*
      *   **Cost of Simplification:** We drop nuanced distinctions (e.g., size of plaque, exact location *within* a building) for speed. The core "Honor vs. Record" and "Prominence/Intent" distinctions *must* survive as they fundamentally alter the object's purpose and the scrutiny applied in Phase 2.

  **Phase 1: Threshold Questions (15 mins per petition - Focus: Facts & Feasibility)**
  1.  **Object Identity & Status:** Is the object correctly classified (Tier 1, 2, 3)? Is it on public property or significantly impacting the public realm? *(Terminate: If misclassified, correct. If entirely private with no public impact, recommend "No Jurisdiction - Retain").*
  2.  **Petition Validity:** Does the petition clearly identify the specific conduct/wrongdoing alleged and its connection to the honoree? Does it provide verifiable sources? *(Terminate: If vague, unsourced, or factually incorrect on basic identity, recommend "Retain - Insufficient Grounds").*
  3.  **Historical Plausibility:** Is the alleged conduct chronologically possible and consistent with the honoree's known life? *(Terminate: If implausible/impossible, recommend "Retain - Unsubstantiated").*
  4.  **Existing Context:** Does the object *already* have significant, visible contextualization (e.g., a detailed plaque explaining controversies next to the statue)? *(Branch: If "Yes" & context is deemed adequate by panel, skip to Phase 2 Q4. If "No" or context inadequate, proceed to Phase 2).*

  **Phase 2: Core Assessment (60 mins per petition - Focus: Significance & Context)**
  1.  **Nature & Severity of Wrong (N&S):** What is the specific conduct alleged? Does it constitute a grave violation of fundamental human dignity or core democratic principles (e.g., slavery, genocide, torture, systemic violent oppression, severe exploitation bordering on peonage)? *(Focus: Define the wrong clearly. "Grave wrong" = violation of fundamental dignity/core principles).*
  2.  **Standards-of-the-Time Test (SOTT):**
      *   a) **Contestability:** Was this conduct *actively contested or criticized* by a significant minority or prominent voices *within the honoree's own society/milieu* (not fringe groups or distant critics)? (Evidence: contemporary writings, protests, legal challenges, dissenting publications).
      *   b) **Confrontation:** Is there evidence the *honoree was personally confronted* about this specific conduct by contemporaries (peers, press, public, authorities) expressing criticism or demanding change?
      *   **Sufficient Answers:**
          *   **"Yes" to (a) or (b):** The conduct was morally contestable *at the time*. Presentism concerns are minimized. Proceed to Q3.
          *   **"No" to both (a) *and* (b) AND Historical Silence:** If the record is genuinely silent on contestation *and* confrontation regarding *this specific conduct*, apply the **"Silence Tiebreaker"**: If the conduct qualifies as a "Grave Wrong" (Q1), it fails SOTT. If not, it passes SOTT. *(Rationale: Silence on grave wrongs suggests normalization we cannot endorse; silence on lesser wrongs suggests they weren't salient ethical breaches then).*
          *   **"No" to both (a) *and* (b) BUT Evidence of Contemporary Acceptance:** If evidence shows the conduct was *widely accepted* as normal or even virtuous at the time, it passes SOTT. Proceed to Q3, but note this heavily weighs *against* removal unless Q1 gravity is extreme.
  3.  **Aggregation & Legacy (A&L):**
      *   Does the honoree have a *substantial, positive public legacy* demonstrably connected to the community *and* the reason for commemoration?
      *   **Weighing Rule:** Grave Wrongs (Q1) **cannot** be immunized by positive legacy. If Q1 is "Grave Wrong" *and* it fails SOTT (Q2), proceed directly to **Recommend Removal**.
      *   If Q1 is *not* a Grave Wrong, *or* if it is but *passed* SOTT (rare), then weigh the Severity/Pervasiveness of the Wrong against the Significance/Relevance of the Positive Legacy *in relation to the specific object*. **Avoid Arithmetic:** Ask: "Does the wrong fundamentally *contaminate* the specific honor bestowed by *this object*, making its continued display untenable despite the legacy?" Consider the object's Tier (Tier 1 objects more vulnerable to contamination).
  4.  **Recontextualization Feasibility (Rec.):** If the path leads towards concern (especially if N&S is significant but A&L is complex or SOTT passed), is robust, permanent, and highly visible contextualization *at the object's site* a viable alternative to removal? (Consider cost, space, durability, visibility). *This is not a 'cheap fix' but a genuine alternative if values conflict.*

  **Phase 3: Recommendation & Consistency (15 mins per petition)**
  1.  **Formulate Draft Recommendation:**
      *   **Recommend Removal:** If Grave Wrong + Failed SOTT (from Q2/Q3). Also possible if non-Grave Wrong is severe/pervasive and overwhelmingly contaminates the honor (Tier 1) despite legacy, or if Recontextualization is deemed infeasible/insufficient.
      *   **Recommend Recontextualization:** If significant concern exists but removal isn't clearly mandated (e.g., passed SOTT, complex A&L, lesser wrong), AND robust contextualization is feasible.
      *   **Recommend Retain:** If allegations unsubstantiated (Phase 1), SOTT passed *and* wrong not grave/contaminating, or if positive legacy clearly outweighs and contextualizes non-grave wrongs *for this object*.
  2.  **Consistency Check (CC):**
      *   **Rule:** A prior panel **recommendation** concerning the *same honoree* is **binding precedent** only for objects of the *same or lower Tier* regarding Removal/Retain. (e.g., Removal of a Statue (T1) binds a future decision on a Plaque (T1) or Street (T2) for the *same reason*; Retain for a Street (T2) does *not* bind a decision on a Statue (T1) for the same reason).
      *   **Conflict Resolution:** If a conflict arises (e.g., petition to remove a T2 street after retaining a T1 statue for same honoree/reason):
          *   Does the *object type difference* (Tier) justify a different outcome? (T1 statue implies stronger honor, harder to justify keeping if statue was removed for same reason).
          *   If no clear Tier justification, **Recommend "Council Decision Required - Precedential Conflict"**. Panel flags the inconsistency.
      *   **New Evidence:** New, significant evidence not considered in a prior decision voids precedent for that specific claim.

  **Phase 4: Handoff to Council**
  *   **Explicit Off-Ramp:** The procedure **must stop and hand the matter back to Council** if, after factual analysis, the ultimate decision hinges entirely on an unresolved **Values Conflict** that the panel cannot resolve based on the CRP rules. This typically occurs at Phase 2 Q4 (Recontextualization Feasibility) or Phase 3 Recommendation when:
      *   The facts are clear (Grave Wrong, Failed SOTT), but Council must decide if removal is the *appropriate civic response* (Value Judgment).
      *   Recontextualization is feasible, but Council must decide if it constitutes *sufficient* redress (Value Judgment).
      *   A complex A&L balance (non-Grave Wrong vs. Significant Legacy) presents equally valid but opposing interpretations under the CRP (Value Judgment).
      *   A precedential conflict (CC) cannot be resolved by Tier justification (Value Judgment).
  *   **Panel Action:** Clearly state: "Based on factual review [brief summary], the panel finds the determination hinges on the value judgment of [specific conflict, e.g., 'whether contextualization is sufficient redress for X conduct']. We recommend Council deliberation on this value question."

  ---

  **Running the Procedure on Test Cases**

  **(A) 1870s Physician (Free Clinic Name - Tier 1)**
  1.  **N&S:** Non-consensual experiments on poorhouse inmates. **Grave Wrong?** Yes (violation of bodily autonomy/fundamental dignity).
  2.  **SOTT:**
      *   (a) **Contestability:** Medical ethics (though nascent) existed. Experimentation on vulnerable populations *was* contested by some contemporaries (e.g., parallels to criticism of similar practices). **Likely YES.**
      *   (b) **Confrontation?** Record silent? Apply **Silence Tiebreaker:** Grave Wrong + Silence = **FAIL SOTT**.
  3.  **A&L:** Substantial positive legacy (free clinic serving community, linked *directly* to the object). **BUT Rule:** Grave Wrong + Failed SOTT → **Proceed to Recommend Removal**. Legacy cannot immunize.
  4.  *Rec.:* Possible? Yes (plaque about ethics, his complex legacy). **BUT** Grave Wrong + Failed SOTT pushes strongly towards removal. Tier 1 (building name) amplifies the honorific intent.
  5.  **Recommendation: Removal.** (This will be embarrassing – removing the name from a beloved clinic. CRP is right: the Grave Wrong (non-consensual experiments) failed the SOTT test (it *was* contestable, silence implies no defense) and fundamentally contaminates the honor of naming a *medical* facility. The good work elsewhere doesn't erase this core violation in this context. Council handoff *possible* on value judgment of whether contextualization *at the clinic* is sufficient, but CRP pushes hard for removal).

  **(B) Suffragist (Courthouse Square Statue - Tier 1)**
  1.  **N&S:** Published eugenicist views on immigration restriction. **Grave Wrong?** No (Repugnant views causing harm, but not direct violence/enslavement/violation of *fundamental* bodily dignity *in itself*). (Note: If linked to *policy causing* grave harm, reassess).
  2.  **SOTT:**
      *   (a) **Contestability:** Eugenics was influential but *highly contested* within intellectual, social reform, and immigrant communities during the suffragist era. **YES.**
      *   (b) **Confrontation?** Possible, especially if she was prominent. Assume evidence exists or silence. **Passes SOTT** (Contestability clear).
  3.  **A&L:** Substantial positive legacy (suffrage activism, reason for commemoration). Wrong (repugnant views) is significant but not Grave. Does it contaminate the statue? The statue honors suffrage work, not her eugenics. While abhorrent, the views weren't the *basis* of the honor, nor do they directly negate the suffrage achievement *in this context*. Contamination not absolute.
  4.  *Rec.:* Highly feasible and appropriate (Plaque on statue base acknowledging this complex aspect of her thought, common among reformers of the era, contrasting with modern values).
  5.  **Recommendation: Recontextualization.** (Retain the statue, add context).

  **(C) Industrialist (Bridge Name - Tier 2)**
  1.  **N&S:** Wage-scrip system in company town. **Grave Wrong?** **Yes** (Severe economic exploitation creating debt peonage, violating economic dignity and freedom, a core democratic principle).
  2.  **SOTT:**
      *   (a) **Contestability:** Company towns/scrip systems were *widely criticized* by labor unions, reformers, journalists, and even some politicians during the era ("robber baron" critiques). **YES.**
      *   (b) **Confrontation?** Very likely (strikes, union demands, muckraking journalism). Assume **YES**. **Fails SOTT.**
  3.  **A&L:** Substantial positive legacy? (Philanthropy, foundation). **BUT Rule:** Grave Wrong + Failed SOTT → **Proceed to Recommend Removal**. Legacy cannot immunize. (Union funding conflict is irrelevant to the *factual* assessment of the honoree's conduct and its severity).
  4.  *Rec.:* Possible on a bridge? Less effective/visible than a statue plaque. Tenuous connection.
  5.  **Consistency:** N/A (first petition). Union funding irrelevant to facts.
  6.  **Recommendation: Removal.** (Bridge is Tier 2, but the Grave Wrong + Failed SOTT is clear. Philanthropy funded by exploitative practices doesn't cleanse the original sin for the purpose of public honor).

  ---

  **Failure Modes & Vulnerabilities**

  1.  **Gaming by Petitioners:**
      *   **"Grave Wrong" Inflation:** Petitioners may stretch allegations to fit the "fundamental dignity violation" threshold. Mitigation: Strict Phase 1 (plausibility, sourcing) and rigorous panel scrutiny on defining the *specific conduct* and its *actual nature* in Q1.
      *   **Exploiting Historical Silence (SOTT Tiebreaker):** Petitioners might focus on lesser wrongs where the record is silent, hoping the "Grave Wrong + Silence = Fail" rule triggers removal. Mitigation: Panel must be rigorous in Q1 classification. Is it *truly* Grave? Also, the "Confrontation" part of SOTT might have evidence petitioners miss.
      *   **Tier Misclassification Arguments:** Debating whether a plaque is Tier 1 (honorific) or Tier 3 (record). Mitigation: Clear staff guidelines for initial classification; panel can correct in Phase 1 Q1 but needs strong reason.
      *   **Overplaying Contextualization:** Pro-removal groups might dismiss feasible contextualization as insufficient; pro-retention groups might champion weak contextualization plans. Mitigation: Panel must assess "robust, permanent, visible" criteria strictly in Q4.

  2.  **Defensible but Wrong Outcomes:**
      *   **SOTT False Negative (Excusing the Unexcusable):** A truly grave wrong that *was* contested but evidence is fragmentary/lost, leading panel to misapply "Silence" and the Tiebreaker incorrectly passes SOTT. CRP defensible based on available record, but morally wrong. Risk higher for older figures.
      *   **SOTT False Positive (Presentism Creep):** Applying contemporary moral outrage to conduct that was genuinely, universally accepted *and* not grave by modern standards, but misclassified as grave or contestability evidence misinterpreted, leading to unnecessary removal. Mitigation: Rigor on Q1 and Q2a/b evidence.
      *   **A&L Misapplication:** A non-grave but significant wrong is deemed to "contaminate" an honor (especially Tier 1) despite a strong, relevant legacy, leading to removal where contextualization was the better path (or vice-versa). The subjective "contamination" test is the main vulnerability here.
      *   **Tier Rigidity:** Recommending removal of a Tier 2 street for a reason that only justified recontextualization for a Tier 1 statue of the same person might feel inconsistent or disproportionate, even if procedurally correct (CC rule).
      *   **Value Judgment Masking:** Panel might push a value-laden decision (e.g., recommending removal for a non-grave wrong with complex A&L) through the "contamination" test in A&L rather than properly handing it off to Council. Requires panel discipline and awareness.

  This procedure provides a clear, sequential framework grounded in factual analysis with defined thresholds and off-ramps. It explicitly addresses your pain points and delivers defensible recommendations, even when they are locally unpopular (like Clinic Removal). Its success hinges on consistent application by the panel, robust staff support in Phases 0 & 1, and the willingness to hand genuine value conflicts to the Council.
