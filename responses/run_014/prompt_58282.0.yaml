  Then to test this, the octopus/prawn scenario is perfect. Lab octopuses getting protection would extend the "special context" category (like pets), while still excluding "commodified" prawns. Under my reconstruction, this would be partial progress - expanding the circle selectively rather than fundamentally challenging the hierarchy.

