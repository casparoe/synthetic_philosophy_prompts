prompt: |-
  I've been thinking about a pattern in moral judgment that I can't find a name for, and I'm wondering whether philosophers have already mapped this out.

  Most actions seem to sort into three buckets: the required (don't lie, keep your promises), the forbidden (don't steal, don't hurt people for fun), and the neutral (what to eat for breakfast, which route to walk home). But I keep noticing actions that don't fit. A stranger needs a bone marrow donation and you happen to be a match. If you go through with it, people call it heroic. If you don't, nobody says you did anything wrong — it wasn't your duty. The same goes for jumping into a freezing river to save someone else's dog, or spending your Saturdays volunteering at a hospice when you could be resting. These aren't neutral in the way picking a cereal is — they feel morally weighty — but they also aren't demanded the way ordinary obligations are.

  What puzzles me is the asymmetry: you can't be blamed for skipping them, but you can be praised for doing them. And the praise has a strange fragility to it. If you keep bringing up that bone marrow donation, the bragging seems to spoil the praiseworthiness in a way that doesn't happen when someone merely mentions having done their duty. That suggests this isn't just a fourth point on a single scale — the category might have its own internal logic.

  Is there an established term for this class of actions? I'm not just after a label. I want to know how the boundary is drawn. Does an action have to involve significant sacrifice to count, or could small kindnesses qualify? Where does this category shade into ordinary politeness on one side and into obligation on the other? And if someone performs the action for selfish reasons — say, donating bone marrow purely for the attention — does it still belong to the category, or does the motive determine the classification?
reasoning: |-
  Okay, let's start by unpacking the user's query. They've noticed a pattern in moral judgments where certain actions don't fit neatly into the usual categories of required, forbidden, or neutral. The examples given—like bone marrow donation, saving a dog from a freezing river, or volunteering at a hospice—highlight actions that are praiseworthy but not obligatory. The user is puzzled by the asymmetry: no blame for skipping them, but praise for doing them. They also note that bragging about such actions diminishes their praiseworthiness, unlike merely mentioning a fulfilled duty.

  First, I need to recall relevant philosophical concepts. Supererogation comes to mind immediately. The term was coined by J.O. Urmson and expanded by thinkers like David Heyd. The classic examples align with what the user describes—actions beyond the call of duty. But the user's deeper questions are about boundaries: How much sacrifice is needed? Where does this category meet politeness or obligation? How do motives affect classification?

  The user isn't just seeking a label; they want to understand the nuances. So, I should break down each aspect they mentioned. Starting with boundaries: Significant sacrifice is often associated with supererogation, but smaller acts, like random kindnesses, might fit too. Philosophers debate this. Heyd might argue that even small acts can be supererogatory if they're optional and praiseworthy. But others might tie it strictly to sacrifice. The line between supererogation and duty is fuzzy. For instance, if an action involves minimal risk or effort, does it shift from optional to expected? The drowning child scenario—some argue that easy rescues are duties, not supererogatory. Then there's the role of motives. If someone acts for praise, does it still count? Ethicists are divided. Kantians might say the motive is crucial, while consequentialists could focus on the outcome. The user’s point about bragging reducing praiseworthiness touches on this—the action might still be supererogatory, but the motive affects whether we praise the person.

  The user’s observation about the fragility of praise when bragging is particularly insightful. This relates to the moral value being tied to selflessness. If you donate marrow for attention, the act might be beneficial, but the agent's character isn't as virtuous. So the category of supererogation might separate the act from the agent's praiseworthiness. 

  I should also consider the user's possible unspoken needs. They might be grappling with real-life moral decisions or seeking justification for not performing such acts without guilt. Understanding supererogation could alleviate pressure by validating that some good deeds are optional. Alternatively, they might be interested in the philosophical underpinnings to apply in ethical discussions or academic work. 

  Finally, clarifying these boundaries helps address their examples. Small kindnesses could qualify if they go beyond societal expectations, but context matters. Motives might not change the act's classification but affect personal praiseworthiness. Highlighting debates among philosophers shows there's no consensus, which might encourage the user to explore further or form their own stance.
answer: |-
  You've hit upon one of the most fascinating and debated categories in moral philosophy: **supererogation**. This term (from Latin *supererogare*, meaning "to pay beyond what is due") perfectly captures the phenomenon you're describing.

  Here's a breakdown of how philosophers map out this territory and address your specific questions:

  1.  **The Established Term: Supererogation**
      *   Actions that are **morally praiseworthy** and **good to do**, but **not morally obligatory** or required. Doing them is "above and beyond the call of duty."
      *   **Key Features:** Asymmetry (Praise for doing, no blame for not doing), Fragility of Praise (Bragging diminishes it), Significant Moral Weight (Unlike neutral acts).

  2.  **Drawing the Boundaries: How is this category defined?**
      *   **Core Definition:** An action is supererogatory if:
          *   It is **morally good**.
          *   It is **not morally obligatory** (you don't *have* to do it).
          *   It involves an **agent-specific option** (you could permissibly choose *not* to do it).
          *   Doing it is **morally better** than merely doing the minimum required (your duty).
          *   **Sacrifice/Risk is Often Central:** Most classic examples (like your bone marrow donation or river rescue) involve significant personal cost, risk, effort, or sacrifice. This cost helps explain why the action isn't *demanded* as a duty – morality doesn't usually require extreme self-sacrifice from ordinary agents. However...
      *   **Can Small Kindnesses Qualify?** This is debated.
          *   **Yes (Broader View):** Some philosophers (e.g., David Heyd) argue that supererogation includes small, optional acts of kindness or beneficence that go slightly beyond basic decency or politeness. Giving a larger-than-expected tip to a struggling waiter, offering a sincere compliment to someone feeling down, or helping a stranger carry heavy bags *could* fit if they are genuinely optional and praiseworthy.
          *   **No/Narrower View:** Others argue that true supererogation requires actions that are significantly costly or risky, setting them apart from minor kindnesses which might simply fall under "being nice" or fulfilling low-level expectations of decency.
          *   **The "Grey Zone":** There's a continuum. Politeness/basic decency shades into optional kindnesses (which *might* be minimally supererogatory in a broad sense), which shades into significant acts of beneficence requiring real effort, and finally into heroic acts involving major sacrifice or risk. The line between "ordinary politeness" (expected) and "supererogatory kindness" (optional extra) is fuzzy and context-dependent.

  3.  **Boundary with Obligation:**
      *   **The "Cost/Effort" Factor:** A key factor is the level of personal sacrifice, risk, or effort involved. Morality generally doesn't obligate us to undertake actions that pose severe risk to our own life/health/fundamental interests or require immense, ongoing personal sacrifice (like dedicating every Saturday to hospice care). What *is* obligatory depends heavily on context and relationship.
      *   **The "Easy Rescue" Problem:** This highlights the boundary. If you could save a drowning child by simply throwing a nearby lifebuoy with zero risk to yourself, most philosophers argue this *is* obligatory – it's not supererogatory because the cost is negligible. Your river dog rescue example likely involves significant risk/cold/discomfort, pushing it into supererogation. The debate intensifies over cases with moderate cost/risk.
      *   **Special Relationships vs. Strangers:** Duties are often stronger towards family, friends, or those we've contracted with. Supererogatory acts frequently involve significant sacrifice *for strangers* or distant others, where no special duty exists.

  4.  **The Role of Motive:**
      *   This is a **major point of contention**.
      *   **The Act Itself:** Some philosophers (often consequentialists or those focusing on the act's outcome) argue that an action can *be* supererogatory based on its nature and consequences, regardless of motive. Donating bone marrow saves a life, which is a great good, whether you did it for praise, money, or pure altruism. The *act* is beyond duty.
      *   **The Agent's Praiseworthiness:** Most philosophers (especially virtue ethicists and Kantians) strongly argue that **motive is crucial for the *agent* to be truly praiseworthy**. This directly addresses your point about bragging.
          *   If you donate marrow purely for attention and bragging rights, the *act* might still be classified as supererogatory (it was good, optional, and beneficial).
          *   However, **you, the agent, are not (or are significantly less) praiseworthy**. Your motive was self-serving, not altruistic or morally commendable. This explains the "fragility of praise" – bragging reveals the selfish motive, undermining the moral credit we would otherwise give you.
          *   In contrast, fulfilling a duty (like keeping a promise) is often praiseworthy even if done grudgingly, because you *did what was required*. Doing *more* than required purely for selfish reasons feels hollow and doesn't elicit the same moral admiration.

  **Key Philosophers & Debates:**

  *   **J.O. Urmson:** His 1958 paper "Saints and Heroes" is seminal, arguing that traditional duty-based ethics (like some interpretations of utilitarianism or Kantianism) fail to account for these praiseworthy-but-not-required acts.
  *   **David Heyd:** Wrote the comprehensive book *Supererogation* (1982), defending its place in ethics and exploring its boundaries.
  *   **Debates:**
      *   **Can Utilitarianism Accommodate Supererogation?** If morality demands maximizing good, how can any beneficial act be optional? (Responses involve agent-centered prerogatives or recognizing limits on demands).
      *   **Can Kantian Ethics Accommodate Supererogation?** If duty is central, what room is there for "beyond duty"? (Responses involve imperfect duties or latitude in how we fulfill them).
      *   **The "Limits of Duty":** What principle explains *why* supererogatory acts aren't duties? Sacrifice is a key candidate, but defining the threshold is hard.
      *   **The "Motive Debate":** As outlined above.

  **In Summary:**

  Your intuition is spot-on. The category you're identifying is **supererogation**. Its boundaries are defined by actions that are **good, optional, and go significantly beyond minimal moral requirements**, often involving sacrifice. While small kindnesses might sometimes qualify in a broad sense, significant cost/risk is central to classic examples. The boundary with obligation hinges on the level of sacrifice expected and context (especially relationships), while the boundary with neutrality is crossed by the inherent moral weight of the act. Motive doesn't necessarily change the *classification of the act* as supererogatory, but it's absolutely crucial for determining the *praiseworthiness of the agent* – hence the fragility of praise when bragging reveals a selfish motive. This category remains a vibrant area of philosophical debate precisely because it probes the limits of moral demandingness and the nature of moral praise.
