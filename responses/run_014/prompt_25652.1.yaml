prompt: |-
  What must a theory of mental causation actually deliver? Before I evaluate any particular view—interventionism about mental causation, the subset-of-powers approach, counterfactual coextension, constitution views, or straight eliminativism—I want the full specification of what the theory is supposed to do. Write the desiderata: the phenomena any adequate account of how (or whether) mental states and events cause physical behavior must explain or accommodate, the cases it must get right, the metaphysical constraints it cannot simply dismiss, and the distinctions it must respect. For each requirement, give the consideration or case that motivates it.

  In particular, address the following. The causal closure of the physical: is it a non-negotiable constraint, a regulative ideal, or a prejudice of one camp? The exclusion worry itself—that if every physical effect has a sufficient physical cause, mental causes are either epiphenomenal or overdeterminers—should appear on the list, but say whether it is a genuine desideratum or the conclusion of an argument that a theory might resist by rejecting a premise. The distinction between causation and mere counterfactual dependence, and between causation and causal explanation: which must a theory respect, and what turns on collapsing them? The difference between mental-to-mental and mental-to-physical causation: must a single account cover both? The causal efficacy of conscious versus unconscious mental states: is that a distinction a theory must capture, or can it treat them uniformly? The apparent difference between rationalizing explanation (reasons as causes) and mechanistic explanation: must a theory unify them, or can it let them sit side by side? The problem of causal proportionality—that mental causes often seem too coarse-grained or too fine-grained for their alleged effects—and whether a theory must solve it or may dissolve it.

  Then, flag any pair (or larger subset) of these desiderata that you suspect cannot be jointly satisfied—this is where the causal exclusion argument lives, and I want to see exactly which commitments generate the tension. If the list itself shows that no theory can have everything, say so and identify the minimal revision that restores consistency. Do not score individual theories; the desiderata are the deliverable.
reasoning: |-
  Okay, the user is asking for a comprehensive list of desiderata that any theory of mental causation must address. They want a full specification before evaluating specific theories like interventionism or eliminativism. I need to outline the phenomena such a theory must explain, the cases it must get right, the metaphysical constraints, and distinctions to respect. Each requirement should be motivated by a specific consideration or case.

  The user mentioned several key areas: causal closure of the physical, exclusion worry, distinction between causation and counterfactual dependence, mental-to-mental vs. mental-to-physical causation, conscious vs. unconscious states, rationalizing vs. mechanistic explanation, and causal proportionality. I need to address each of these thoroughly.

  Starting with causal closure. I recall that this principle states that every physical effect has a sufficient physical cause. It's often seen as non-negotiable in physicalist frameworks, but dualists might challenge it. The motivation here is to avoid unexplained physical gaps, which could lead to energy non-conservation or violations of physical laws. Cases like neural events needing complete physical causes illustrate why this is critical.

  Next is the exclusion argument. This arises from combining causal closure with the idea that mental states aren't identical to physical ones. The worry is that mental causes become either epiphenomenal or overdeterminers. The user wants to know if this is a genuine desideratum or a conclusion that theories can resist. I should note that resisting it might involve rejecting premises like non-identity or no overdetermination.

  Then there's the distinction between causation and counterfactual dependence. For example, a barometer's falling reading counterfactually depends on the storm but doesn't cause it. A theory must respect this to avoid misattributing causation. Collapsing them could lead to errors like treating epiphenomena as causal.

  Mental-to-mental and mental-to-physical causation need consideration. Can one account cover both? Cases like chain reasoning (mental-to-mental) and voluntary action (mental-to-physical) suggest they might differ. If a theory handles one but not the other, it might be inadequate.

  Conscious vs. unconscious mental states pose another distinction. Conscious states feel causally potent, like pain causing withdrawal, while unconscious states, like implicit biases, also influence behavior. A theory should address both without overemphasizing consciousness.

  Rationalizing explanations (reasons as causes) vs. mechanistic explanations. Davidson's challenge was to reconcile how reasons explain actions rationally while neural mechanisms explain causally. A theory must unify these without reducing rationality to mechanism.

  Causal proportionality deals with granularity. Mental states can be too coarse (e.g., "belief" causing a specific neuron firing) or too fine (e.g., precise belief content affecting broad behavior). The problem is to match cause and effect at the right level without mismatch. Cases like multiple realizability highlight this issue.

  Now, identifying tensions between desiderata. The core tension is between non-reductive mental causes and causal closure without overdetermination. If mental states aren't physical, closure threatens their efficacy. Accepting overdetermination might resolve it but seems implausible for routine actions. Rejecting closure risks violating physical laws. This is where exclusion arguments thrive.

  Another tension is between proportionality and non-reduction. Proportionality might require mental causes to be at the same level as effects, but non-reductionists want mental causes distinct from physical. Reconciling this without reduction is tough.

  The user might be looking for a clear framework to evaluate theories. They probably want to see which desiderata are essential and where compromises are inevitable. Highlighting incompatibilities helps understand why theories like dualism or eliminativism take radical stances. The minimal revision might involve accepting some form of reduction or rethinking causation itself.

  I should ensure each desideratum is clearly stated with its motivation. Flagging tensions will show why mental causation is problematic. Concluding that no theory satisfies all without revision emphasizes the challenge and sets the stage for evaluating specific approaches.
answer: |-
  Here is a comprehensive specification of the desiderata for a theory of mental causation, outlining the phenomena to be explained, constraints to be respected, distinctions to be maintained, and key tensions. Each desideratum is motivated by a specific consideration or case.

  **Core Desiderata for a Theory of Mental Causation:**

  1.  **Respect Causal Closure of the Physical (CCP):**
      *   **What it demands:** Every physical effect has a sufficient physical cause at any given time (or a sufficient physical cause *exists* at that time, even if not operative in every instance).
      *   **Motivation:** Foundational principle of physical science. Violations imply "causal gaps" in the physical world (e.g., energy conservation violations, inexplicable neural events). *Case:* The precise movement of my arm (a physical event) involves complex muscle contractions and neural firings; CCP demands these have a sufficient physical causal history.
      *   **Status:** For physicalism, it's **non-negotiable**. For dualism, it's often a **regulative ideal** but may be explicitly rejected ("non-reductive physicalism" typically accepts it; substance/property dualism may reject it).

  2.  **Avoid Systematic Causal Overdetermination:**
      *   **What it demands:** Most physical effects are not causally overdetermined (i.e., caused by two or more *independent* sufficient causes).
      *   **Motivation:** Parsimony and empirical observation. While *some* overdetermination occurs (e.g., two bullets hitting simultaneously), it's rare and coincidental. Widespread overdetermination by mental and physical causes for *all* actions seems implausible and explanatorily redundant. *Case:* My decision to raise my arm causes its rising, but the neural events are also sufficient; are these two independent sufficiencies (implausible) or is one dependent?
      *   **Status:** Widely accepted as a **genuine desideratum** based on parsimony and explanatory practice.

  3.  **Secure Genuine Mental Efficacy (Avoid Epiphenomenalism):**
      *   **What it demands:** Mental states/events (e.g., beliefs, desires, pains, intentions, conscious experiences) must play a non-redundant causal role in bringing about at least some physical effects (especially behavior) and other mental states.
      *   **Motivation:** Pre-theoretical intuition, phenomenology of agency, and the explanatory practice of psychology/folk psychology. *Case:* It *feels* like my pain causes me to withdraw my hand, and my desire for water causes me to reach for the glass. Denying this seems to make the mental causally inert ("danglers").
      *   **Status:** **Core desideratum** – the very point of the enterprise. Theories denying this (eliminativism, radical epiphenomenalism) are judged against it.

  4.  **Respect the Distinction between Causation and Mere Counterfactual Dependence:**
      *   **What it demands:** Provide criteria distinguishing genuine causal production from cases where events are counterfactually dependent but not causally related (e.g., effects of common causes, epiphenomena).
      *   **Motivation:** Logical distinction and problem cases. *Case:* The fall of the barometer reading counterfactually depends on the storm (if no storm, reading wouldn't fall), but the reading doesn't *cause* the storm; they share a common cause (dropping pressure). *Mental Case:* If my brain state causes both my pain and my hand withdrawal, the withdrawal counterfactually depends on the pain (if no pain, probably no withdrawal), but is the pain itself causal or just an epiphenomenon?
      *   **Status:** **Crucial desideratum.** Collapsing the distinction risks mistaking epiphenomenal correlations for causation.

  5.  **Respect the Distinction between Causation and Causal Explanation:**
      *   **What it demands:** Account for how mental states can provide genuine *causal explanations* (e.g., "She ran because she was afraid") without necessarily being the sole or most fundamental *causers* in a metaphysical sense. Explanation is often pragmatic, contextual, and level-relative.
      *   **Motivation:** Different explanatory contexts (mechanistic detail vs. rationalizing intent). *Case:* Explaining why the window broke by citing "the stone hit it" (cause) vs. "the impact caused stress exceeding the tensile strength" (more detailed causal explanation) vs. "the vandal threw it" (agential explanation). *Mental Case:* "He voted Labour because he believed in social justice" is a valid causal explanation, even if neural mechanisms underlie it.
      *   **Status:** **Important desideratum.** Collapsing them risks conflating metaphysical grounding with explanatory utility.

  6.  **Account for the Causal Relevance of Content/Intentionality:**
      *   **What it demands:** Explain how the *semantic content* or *intentional object* of mental states (e.g., what a belief is *about*, what a desire is *for*) can be causally relevant to producing behavior.
      *   **Motivation:** Rational action and psychological explanation. *Case:* My belief *that the water is poisoned* causes me not to drink, while my belief *that the water is pure* would cause me to drink. The difference in content makes the causal difference. Crude physical duplicates might lack this sensitivity.
      *   **Status:** **Key desideratum** for non-eliminativist theories aiming to preserve the explanatory power of intentional psychology.

  7.  **Cover Both Mental-to-Physical and Mental-to-Mental Causation:**
      *   **What it demands:** Provide a unified (or at least consistent) account of how mental states cause physical behavior (e.g., pain -> withdrawal) *and* how mental states cause other mental states (e.g., belief + desire -> intention; sensation -> perceptual belief).
      *   **Motivation:** Psychological reality. Cognition involves chains of mental causation leading to action. *Case:* Deliberation (mental events causing other mental events) resulting in a decision (mental event) causing an action (physical event).
      *   **Status:** **Strong desideratum.** A theory explaining one but not the other is incomplete. However, some theories might prioritize one domain.

  8.  **Address the Efficacy of Both Conscious and Unconscious Mental States:**
      *   **What it demands:** Explain the causal efficacy of conscious mental states (e.g., vivid pain, explicit deliberation) *and* unconscious mental states (e.g., implicit biases, repressed memories, subconscious processing).
      *   **Motivation:** Empirical psychology. Both types demonstrably influence behavior. *Case:* A consciously held racist belief causes discriminatory action; an unconscious implicit bias also causes discriminatory action. Treating them uniformly might overlook unique features of conscious causation (e.g., phenomenal quality).
      *   **Status:** **Important desideratum.** A theory *might* treat them uniformly (e.g., both as computational states) but must still account for both. Capturing potential differences is a plus.

  9.  **Reconcile Rationalizing and Mechanistic Explanation:**
      *   **What it demands:** Explain how explanations citing reasons (beliefs/desires) as causes fit with (or are reducible to, or sit alongside) mechanistic explanations citing neural processes.
      *   **Motivation:** Davidson's challenge and the autonomy of psychology. *Case:* Explaining "She lifted her arm because she wanted to vote" (rationalizing) vs. explaining the precise neural cascade triggering the motor neurons (mechanistic). Do these explanations compete, complement, or describe different levels?
      *   **Status:** **Significant desideratum.** A theory should clarify the relationship – unification is ideal for physicalists, while dualists might insist on distinctness.

  10. **Address Causal Proportionality:**
      *   **What it demands:** Explain why mental causes seem appropriate ("proportional") to their effects – not too coarse-grained (e.g., blaming "belief" for a specific neuron firing) nor too fine-grained (e.g., a hyper-specific belief causing a broad action). Find the "right" level of description for cause and effect.
      *   **Motivation:** Intuitions about causal responsibility and problem cases. *Case:* (Coarse) Saying "her belief that it was raining" caused the firing of neuron #742831 seems wrong; too low-level. (Fine) Saying "her belief that the rain was exactly 3.2mm/hr falling at 27 degrees" caused her to grab the umbrella seems wrong; too specific. The "right" level might be "her belief it was raining caused her to grab the umbrella."
      *   **Status:** **Important desideratum,** but theories may "solve" it (e.g., by level-relativity) or "dissolve" it (e.g., by denying it's a real problem for causation itself, only for explanation).

  **Flagging Tensions and Incompatibilities:**

  The core tension driving the **Causal Exclusion Argument** lies between desiderata **1 (CCP)**, **2 (Avoid Overdetermination)**, **3 (Mental Efficacy)**, and the **implicit premise of Non-Identity** (mental properties/states ≠ physical properties/states):

  *   **Tension:** If every physical effect (like behavior B) has a sufficient physical cause P (**Desideratum 1**), and mental cause M is distinct from P (**Non-Identity**), then M seems either:
      *   **Epiphenomenal** for B (violating **Desideratum 3**), or
      *   An **overdeterminer** alongside P (violating **Desideratum 2**).
  *   **Which commitments generate the tension?** Accepting **CCP (1)**, **Avoiding Systematic Overdetermination (2)**, **Non-Identity**, and demanding **Genuine Mental Efficacy (3)** creates an inconsistent set. *Something must give.*
  *   **Is exclusion a desideratum?** The exclusion *worry* arises *because* of the tension between these other desiderata/premises. It's the *problem* generated, not itself an independent desideratum. A theory "resists" exclusion by rejecting one of the premises generating it (e.g., rejecting Non-Identity via reductionism, rejecting CCP via dualism, rejecting Avoid Overdetermination, or finding a way for M to be efficacious *without* being an independent overdeterminer).

  **Other Significant Tensions:**

  1.  **Proportionality (10) vs. Causal Relevance of Content (6) vs. Non-Reductionism:** Capturing causally relevant fine-grained content (**6**) can push towards finer-grained causes, potentially conflicting with proportionality (**10**) which seeks an appropriate match. Resolving this without collapsing into reductionism (rejecting Non-Identity) is challenging.
  2.  **Respecting CCP (1) & Physical Mechanisms vs. Rationalizing Explanation (9):** Reconciling the mechanistic, physical details demanded by CCP with the broad, content-sensitive, rational patterns described by psychological explanation is difficult. Reductionism attempts unification; non-reductionism risks explanatory gaps or tension.
  3.  **Causation vs. Counterfactual Dependence (4) vs. Efficacy of Content (6):** Ensuring content is causally relevant (**6**) often relies on counterfactual dependencies (e.g., different content -> different outcome). However, respecting the distinction (**4**) means such dependencies alone are insufficient for causation, requiring an account of *how* content qua content is causally productive.

  **Conclusion on Satisfiability:**

  The list demonstrates that **no theory can satisfy *all* desiderata without significant revision or rejection of at least one core commitment.** The minimal revision needed to restore consistency typically involves rejecting one element of the exclusion-generating quartet:

  1.  **Reject Non-Identity (Reductionism/Type Identity):** Mental properties are physical properties. Mental causation *is* physical causation. Solves exclusion, respects CCP, avoids overdetermination, secures efficacy. Challenges: Multiple realizability, causal relevance of content, proportionality.
  2.  **Reject CCP (Dualism/Interactionism):** Mental causes are non-physical and can directly influence the physical, creating "gaps". Solves exclusion, secures efficacy. Challenges: Violating physical laws (energy conservation), explaining *how* interaction works.
  3.  **Accept Systematic Overdetermination:** Mental and physical causes are independent but both sufficient. Solves exclusion (by denying it's problematic), respects CCP, secures efficacy. Challenges: Implausibility, redundancy, lack of empirical evidence for widespread overdetermination.
  4.  **Reject Genuine Mental Efficacy (Eliminativism/Epiphenomenalism):** Mental states simply don't cause physical behavior. Respects CCP, avoids overdetermination. Challenges: Contradicts deep intuitions and explanatory practice.
  5.  **Find Non-Overdetermining Non-Reductive Efficacy (e.g., Constitution, Realization, Dependence):** Argue M causes B *in virtue of* its relation to P (which is the sufficient cause under CCP), such that M's causing B doesn't add a *second* sufficient cause. P suffices, but M is not epiphenomenal because M's occurrence (constituted by/realized in P) is necessary for *this specific causal power* to be exercised. Solves exclusion without rejecting CCP, Non-Identity, or accepting overdetermination. Challenges: Clarifying the nature of "in virtue of" and ensuring M isn't reduced to an explanatory placeholder lacking *sui generis* causal power.

  **The Deliverable:** An adequate theory of mental causation must explicitly address *all* these phenomena and constraints. It must clearly state which desiderata it satisfies, which tensions it resolves (and how), and which commitments it rejects or revises to achieve consistency. The core challenge remains navigating the exclusion problem while preserving genuine mental efficacy within a physical world.
