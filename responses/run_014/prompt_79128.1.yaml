  Okay, the user chairs a small department and has observed a phenomenon where communal practices erode over time despite everyone valuing them. They describe scenarios like colleagues not answering emails, reading drafts, or attending events, and similar patterns in a hobbyist forum where trip write-ups declined. Each individual omission seems insignificant and costless, yet collectively, the practice disappears. No one intended this outcome, and if polled, the group wouldn't choose it. The user is puzzled because the resource isn't scarce—it's non-rivalrous and benefits from more participation. Enforcement is problematic because the enforcer bears the cost while benefits are distributed, creating a higher-level collective action problem.

  First, I need to identify if there's an established concept for this. The user mentions tragedy of the commons, free-riding, second-order collective action, and problem of many hands. Let me recall these concepts. Tragedy of the commons typically involves rivalrous resources like pastures, where overuse depletes the resource. Here, the resource isn't rivalrous; answering an email doesn't reduce availability for others. So that's different.

  Free-riding is part of it, but usually in public goods contexts where individuals benefit without contributing. Public goods are non-excludable and non-rivalrous. The practices here are non-rivalrous, but are they non-excludable? In a department or forum, exclusion might be possible, but it's not typically enforced. The enforcement problem is key here. The user points out that enforcing norms requires someone to bear the cost, leading to a second-order problem.

  Second-order collective action problems involve maintaining the norms or institutions that enforce first-order cooperation. If no one enforces the norm because it's costly, the first-order cooperation fails. That fits. The user mentioned this, so maybe that's the core.

  Assurance problems relate to coordination where individuals won't participate unless assured others will. But the user says early defections aren't intentional; it's more about small omissions accumulating. So assurance might be part of it but not the whole picture.

  The user's two oddities: non-rivalrous resource and enforcement replicating the problem. These seem essential. In standard public goods, non-rivalry is present, but enforcement is a separate issue. Here, the enforcement itself is a public good problem. That recursive aspect is critical.

  So combining these, the concept is a second-order collective action problem within a public goods framework. The core is maintaining a norm that requires voluntary contributions, where enforcement is costly and also a collective action issue.

  The user needs clarity on boundaries. How is this different from standard public goods? In standard public goods, contributions directly provide the good (like donations for a park). Here, the good is the sustained practice, and enforcement is needed to sustain contributions. The recursive enforcement problem makes it distinct.

  Also, differing from genuine scarcity: no depletion occurs; it's about participation declining due to lack of assurance and enforcement.

  The term "collective action problem" is broad. Specifying it as a "second-order collective action problem in sustaining norms for a non-rivalrous practice" captures the essence. The closest established term might be "second-order free-rider problem" or "the problem of institutional maintenance."

  The user wants a sharp definition. Let's define it clearly: A situation where a group's valued, non-rivalrous practice erodes because individual contributions are discretionary and lack enforcement. Each small omission is costless to the individual but collectively leads to collapse. Enforcement of norms faces the same problem, as it requires costly effort with diffuse benefits.

  For new cases: Check if the practice is non-rivalrous, relies on voluntary contributions, has diffuse benefits, and enforcement is costly and similarly unenforced. If yes, it fits.

  The two oddities are essential: non-rivalry means increased participation enhances value, unlike rivalrous commons. The recursive enforcement problem is the core reason the norm collapses, making it distinct from simple free-riding.

  The user might also need practical solutions. Since enforcement is problematic, perhaps designing self-enforcing mechanisms or graduated sanctions as Elinor Ostrom suggested. But the query is more about conceptual understanding.

  In conclusion, the established concept is a second-order collective action problem in maintaining norms for a public good. Terms like "institutional decay" or "norm erosion" might be used, but the mechanism is defined by the recursive enforcement issue.
answer: |-
  This phenomenon is **precisely captured by an established concept**, but it requires careful unpacking because it sits at the intersection of several ideas. The core concept is a **second-order collective action problem in sustaining a norm for a non-excludable, non-rivalrous public good**. Let's define it sharply, draw boundaries, and address your two key oddities.

  ### The Core Concept: Second-Order Free-Riding on Norm Enforcement
  1.  **First-Order Problem:** The desired practice (answering emails, reading drafts, writing trip reports) is a **public good**:
      *   **Non-rivalrous:** One person benefiting (e.g., reading a helpful email answer) doesn't diminish others' ability to benefit.
      *   **Non-excludable (in practice):** It's difficult or costly to prevent members from benefiting once the good exists (e.g., everyone sees the shared email list, reads trip reports).
      *   **Requires voluntary contributions:** The good is only produced if individuals contribute effort (time, thought).
      *   **Positive network effects:** The value *increases* with participation (more answers, more reports → richer resource).

  2.  **Why It Erodes (First-Order Free-Riding):**
      *   Contributing has a small but real individual cost (time, cognitive effort).
      *   The benefits are diffuse and shared across the group.
      *   **Crucially:** Each individual contribution is often *imperceptible* to the overall provision of the good. My single failure to answer an email or write a report doesn't noticeably degrade the practice *in that moment*.
      *   Rational self-interest suggests: *"My tiny omission won't matter, and I save effort. I still value the overall practice."* This is classic **free-riding** on the contributions of others.
      *   If *everyone* reasons this way (or enough people do), contributions cease, and the public good vanishes – a state *no one* wanted. This is the **first-order collective action problem**.

  3.  **The Second-Order Problem (Norm Enforcement):**
      *   Sustaining the practice requires **social norms**: shared expectations of contribution and informal sanctions for non-compliance (e.g., gentle reminders, social disapproval, expressions of appreciation).
      *   **Enforcing these norms is itself a public good:**
          *   **Costly:** Calling someone out requires time, emotional labor, social capital, and risk (being seen as nagging, confrontational, or hypocritical).
          *   **Beneficial to all:** A well-enforced norm benefits everyone who values the practice.
          *   **Non-excludable:** You can't easily prevent non-enforcers from benefiting from a well-maintained norm.
      *   **Second-Order Free-Riding:** Rational self-interest suggests: *"Why should *I* bear the cost and risk of enforcing the norm? Someone else will probably do it, or my single enforcement action won't make a difference. I still value the norm."*
      *   If *no one* enforces the norm (or too few do), the first-order free-riding goes unchecked, and the practice collapses. **This recursive structure – where the solution to the first problem (enforcement) succumbs to the *same logic* as the first problem – is the defining characteristic.**

  ### Sharp Definition
  **Phenomenon:** The erosion of a valued, non-rivalrous, non-excludable practice sustained by voluntary contributions, caused by widespread first-order free-riding enabled by the collapse of sustaining norms due to second-order free-riding on norm enforcement.

  **Test for New Cases: Is this an instance?**
  Check if **all** these conditions hold:
  1.  **The Practice:** Is it a *non-rivalrous, non-excludable good* requiring *voluntary individual contributions*?
  2.  **The Erosion:** Does decline happen through *many small, individually rational omissions* where *each omission has negligible individual impact* on the practice's viability?
  3.  **The Outcome:** Is the end state (collapse) *collectively undesirable* (no one would choose it in a poll)?
  4.  **The Enforcement Dilemma:** Would restoring/sustaining it require *costly enforcement actions* (reminders, sanctions, coordination) that themselves face the *same problem* (individuals bearing the cost while benefits are shared, leading to under-provision of enforcement)?

  If YES to all, it's an instance.

  ### Drawing Boundaries
  *   **vs. Ordinary Tragedy of the Commons (Rivalrous Resource):**
      *   **Boundary:** Rivalry vs. Non-Rivalry. In the Commons, my consumption (grazing a cow) *directly reduces* what's available for others (grass is depleted). In your case, my *failure to contribute* (not answering an email) doesn't consume a rival resource; it simply *fails to add* to a non-rivalrous one. The core Commons problem is *overuse*; your problem is *under-provision*.
  *   **vs. Ordinary Public Goods Problem (First-Order Only):**
      *   **Boundary:** The Second-Order Enforcement Problem. A simple public good (like funding a lighthouse) faces under-provision due to free-riding. However, if an *external authority* (government, firm) can reliably enforce contributions (taxes, fees), the problem is solved. Your dilemma is defined by the *absence* of such an authority *within the group* and the *failure of internal norm enforcement* due to the second-order problem. The public good *depends* on self-governance, which fails recursively.
  *   **vs. Successful Community Governance (Ostrom's Design Principles):**
      *   **Boundary:** Effective Norm Enforcement & Monitoring. Elinor Ostrom showed communities *can* manage commons/public goods with features like clear boundaries, proportional costs/benefits, collective choice, monitoring, graduated sanctions, conflict resolution, and recognition of rights. Your cases *lack* these, particularly **low-cost monitoring** (omissions are invisible) and **effective, low-cost sanctions** (enforcement is costly and itself suffers free-riding). The "problem of many hands" relates to diffuse responsibility, but doesn't explicitly capture the recursive enforcement failure.
  *   **vs. Genuine Scarcity/Depletion:**
      *   **Boundary:** Rivalry & Physical Depletion. If draft-reading collapsed because there genuinely weren't enough hours in the day for everyone to read *all* drafts (a rival constraint), that's scarcity. Your cases involve *effort* to contribute, not depletion of a finite resource. The "pasture" analogy fails because the pasture isn't being eaten; people are just deciding not to bring new hay, even though bringing hay costs little and makes the barn better for everyone.

  ### Your Two Oddities: Essential to the Core
  1.  **Non-Rivalrous Nature:**
      *   **Status:** **Essential.** This is *why* the standard Commons model doesn't fit. The positive network effects (practice gets better with more participation) make the collapse *particularly perverse* and counter-intuitive. It shifts the problem from *overconsumption* to *under-provision* despite increasing returns to scale. It also makes individual omissions feel less consequential ("Plenty of others will answer").
  2.  **Recursive Enforcement Problem:**
      *   **Status:** **The Whole Point.** This recursive structure – where the mechanism needed to solve the first problem (enforcement) is vulnerable to the *identical logic* of free-riding – is **the defining feature** that separates this from a simple first-order public goods problem. It explains why seemingly obvious solutions ("just enforce the norm!") fail internally and why the erosion feels inexorable and leaderless. It creates a stable, undesirable equilibrium where no individual has an incentive to unilaterally change their behavior *or* to enforce norms.

  ### The Established Concept & Its Name
  The phenomenon is **best understood as a specific manifestation of a second-order collective action problem applied to the maintenance of social norms for a public good.** While there isn't a single, universally perfect *phrase*, the most precise established terms are:

  1.  **Second-Order Free-Riding Problem:** This directly names the core recursive mechanism causing norm collapse. (Most accurate label for the *mechanism*).
  2.  **Collapse of Cooperation in the Provision of a Public Good due to Failed Norm Enforcement:** This is descriptive but captures the full sequence. (Most accurate *description*).
  3.  **Institutional Decay (in a specific context):** The "institution" here is the informal norm governing the practice. This term is broader but applicable.

  **What "Second-Order Free-Riding Problem" leaves out:** It focuses tightly on the *mechanism* (free-riding on enforcement). It doesn't *explicitly* emphasize the non-rivalrous nature or the positive network effects, though these are implied prerequisites for the specific public good context where this problem arises.

  ### Conclusion
  Yes, this is a distinct and well-established pattern. It's not just "free-riding" or the "tragedy of the commons" – though those are components. The **recursive failure of norm enforcement due to second-order free-riding** is the critical insight that explains why valued practices erode invisibly despite universal stated preference for them, and why simple enforcement solutions fail. Your two "oddities" – non-rivalry and the recursive enforcement trap – are not incidental; they are **essential characteristics** defining this specific type of institutional decay. The boundaries are clear: it requires a non-rivalrous good sustained by voluntary contributions whose erosion stems from unchecked first-order free-riding *because* the enforcement of the necessary norms succumbs to a second-order free-rider problem. You have diagnosed it perfectly.
