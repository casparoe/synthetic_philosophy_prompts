prompt: |-
  Having recently been co-opted onto my parish council, I have become preoccupied by a pattern of compliance I observe in myself and my neighbours. We pay council tax willingly, attend consultations, and expect the police and bins to function, yet we routinely and quietly ignore particular rules we regard as pointless, for example leaving bins out a day early despite the fixed collection timetable and using a closed footpath across a field because the official diversion adds twenty minutes, without any wish to protest or to invite others to do the same. Is there an established name for this quiet, selective, non-protest noncompliance by people who otherwise accept the system, and if not, what should we call it. I do not want a bare label; please explain what the phenomenon is, what it is not, and where its edges lie by comparing it to the two or three closest established ideas and saying which fits best and why the others fail. Please answer in British English as a numbered list of exactly five items, each of one or two sentences, with no introduction or conclusion, and use one item to state which argument or consideration would most likely change your mind about the classification.
reasoning: |-
  Okay, the user is on a parish council and has noticed a pattern where people follow most rules but quietly ignore ones they find pointless, like putting bins out early or using a closed footpath. They want to know if there's a name for this behaviour and how it compares to other concepts. 

  First, I need to figure out what this phenomenon is. It's not full compliance, but it's also not outright protest. People aren't trying to change the system; they're just bypassing rules they see as inefficient. This reminds me of "everyday resistance" or "infrapolitics," but those usually involve marginalised groups. Here, it's ordinary citizens who generally support the system.

  The user mentioned examples like bin timings and footpaths. These are minor infractions without any intention to challenge authority. So civil disobedience is too strong because that involves public protest to change laws. Passive resistance is also different because it's more about withholding cooperation in a visible way. 

  I should compare these concepts clearly. Civil disobedience is public and aims for change, while this is private and avoids confrontation. Passive resistance might involve things like strikes, which are collective actions. But the user's examples are individual and quiet. 

  The term "pragmatic noncompliance" seems to fit best. It's selective, practical, and doesn't challenge the system's legitimacy. The key point is that people still accept the overall structure but opt out of specific rules they find impractical. 

  The user also wants to know what might change this classification. If these actions became public or organised, they might shift towards civil disobedience. But as long as they're private and apolitical, pragmatic noncompliance stays accurate. 

  I need to present this in a numbered list of five items, using British English. Each item should be one or two sentences, no intro or conclusion. The last item should address what would change the classification. 

  Let me structure it: first define the phenomenon, then what it's not (civil disobedience), then what else it's not (passive resistance), then the best fit (pragmatic noncompliance), and finally the condition for reclassification. 

  Make sure the language is precise and the comparisons are clear. Avoid jargon where possible, but explain necessary terms like infrapolitics. Keep it concise but informative, as the user requested.
answer: |-
  1.  This phenomenon is **pragmatic noncompliance**: quiet, individualised, and selective rule-breaking by citizens who broadly accept the legitimacy of the system and its authorities, motivated purely by perceived inefficiency or inconvenience of specific rules, without any intent to challenge the rule itself or the system.  
  2.  It is **not civil disobedience**, which involves deliberate, public, principled law-breaking intended to highlight an unjust law or policy and provoke change through collective awareness or protest, whereas this behaviour is private, apolitical, and seeks no change.  
  3.  It is also **not passive resistance** (or non-violent resistance), which is a deliberate strategy of withholding cooperation or subtly obstructing authority (e.g., work-to-rule, boycotts) often as part of an organised campaign for systemic change, whereas this lacks organisation, strategic intent, and any desire to obstruct or challenge authority beyond the immediate personal inconvenience.  
  4.  The closest established idea is **"infrapolitics"** or **"everyday resistance"**, referring to subtle, often hidden acts of defiance by subordinate groups; this fits the *method* (quiet, individual noncompliance) but fails because the actors here are not typically marginalised nor seeking empowerment, and their actions lack the underlying political critique or challenge to power dynamics inherent in those concepts.  
  5.  Evidence that such acts were primarily motivated by a latent political critique of authority or power structures, rather than simple personal convenience, would most likely shift the classification towards infrapolitics or everyday resistance, marking a change from apolitical pragmatism to subtle political dissent.
