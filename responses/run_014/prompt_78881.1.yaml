  Okay, the user is a teaching assistant for a probability and induction course, struggling with Bertrand's paradox and similar problems where different "random" selections lead to different probabilities. They want a set of desiderata for the principle of indifference to evaluate it rigorously. 

  First, I need to unpack their core request. They're tired of superficial explanations and want a concrete framework to test indifference principles. Their examples (chords, stick cutting, cubes, coin bias, sphere points, unknown urns) are classic paradoxes where uniform priors in different parameterizations conflict. The real goal is to expose why "no reason to distinguish" fails without clear criteria.

  Their hidden need might be pedagogical: how to teach this without oversimplifying. They suspect the issue is conflicting desiderata making a universal principle impossible. They also mention "description-invariance" as their pet theory—they want to know if it holds up.

  Breaking down the task:
  - List desiderata with rationales, not just adjectives.
  - Test against their six cases.
  - Identify which desiderata are essential vs. partisan.
  - Flag incompatible pairs (e.g., unique answers vs. parameterization-invariance).
  - Critique major approaches (max entropy, reference priors, rejection of indifference).
  - Clarify which desiderata assume the principle is for actual inference vs. heuristic.

  Key insights from Bertrand's paradox: 
  - The problem isn't the chords; it's that "uniform" requires a specified measure. 
  - Desiderata like parameterization-invariance and unique answers conflict—mathematically impossible to satisfy both in general.
  - Their "description-invariance" (symmetries of the situation, not the description) is promising but tricky to formalize without circularity (e.g., what defines the "situation"?).

  For their examples:
  - Chord: No single correct answer; depends on how randomness is generated.
  - Stick cutting: Uniform cut point vs. uniform ratio—physical context determines which is appropriate.
  - Cube: Edge vs. face vs. volume—again, depends on what "equally unknown" means operationally.
  - Coin bias: Uniform p vs. log-odds—Jeffreys prior (√[p(1-p)]⁻¹) balances this but isn't obvious from indifference.
  - Sphere point: Conditioning on great circles requires measure-theoretic care (e.g., Borel-Kolmogorov).
  - Unknown urn: Indifference over colors vs. marbles—leads to inconsistent marginals.

  Major takeaways:
  - The real lesson is that ignorance priors require external constraints (symmetries, physical mechanisms).
  - No principle satisfies all desiderata; trade-offs are inevitable.
  - For teaching: Emphasize that "uniform" is relative to a chosen parameterization, and paradoxes reveal hidden assumptions.

  Their suspicion is correct: Bertrand's paradox proves we demand too much from indifference. The solution isn't crowning a winner but showing why context breaks ties. In class, they could frame it as: "Uniform over what? Your choice of 'what' encodes unspoken assumptions." This shifts focus from "right answer" to explicit modeling.
answer: |-
  Below is a structured response addressing your core questions: desiderata for the principle of indifference (PoI), tensions between them, performance against your cases, and implications for teaching. The desiderata are derived from logical consistency, practical applicability, and common intuitions, with conflicts explicitly flagged.

  ---

  ### **Desiderata for the Principle of Indifference**
  Each desideratum includes its motivation, necessity, and limitations. **Bold** indicates key tensions.

  1. **Parameterization-Invariance**  
     *Why*: Credences should not depend on arbitrary choices of units or coordinates (e.g., measuring a cube’s edge in cm vs. inches).  
     *Test*: Fails in the cube factory (Case 3). Uniformity over edge length (1–2 cm) implies non-uniform densities for face area or volume.  
     *Status*: Genuine for grounding inference; violates "common sense" if ignored.  

  2. **Symmetry-Respecting**  
     *Why*: Identical outcomes under relabeling or geometric symmetry deserve equal credence (e.g., swapping colors in an urn).  
     *Test*: Resolves the bent coin (Case 4). Uniformity over bias \(p\) contradicts uniformity over log-odds \(\ln(p/(1-p))\), breaking rotational symmetry of the parameter space.  
     *Status*: Genuine, but requires specifying *which* symmetries matter.  

  3. **Consistency Under Conditioning**  
     *Why*: Conditioning on zero-probability events (e.g., great circles on a sphere) must be well-defined via limits or geometric measures.  
     *Test*: Critical for the sphere (Case 5). Conditioning on a great circle requires uniform measure on the circle, not ad hoc choices.  
     *Status*: Genuine for continuous spaces; mathematical necessity.  

  4. **Marginalization-Consistency**  
     *Why*: Credences over compound unknowns (e.g., urn composition) must align when marginalizing over variables.  
     *Test*: Fails the unknown urn (Case 6). Indifference over marble counts vs. color proportions implies inconsistent predictive probabilities.  
     *Status*: Genuine for inference; often impossible to satisfy fully.  

  5. **Unique-Answerability**  
     *Why*: A "true" prior should yield one answer absent additional information.  
     *Test*: Directly contradicted by Bertrand’s chord (Case 1): three distinct "uniform" answers.  
     *Status*: **Camp prejudice** (inference-focused). Paradoxes prove it’s unattainable without context.  

  6. **Operational-Meaningfulness**  
     *Why*: The choice of uniformity must reflect a physical randomization mechanism.  
     *Test*: Resolves stick-cutting (Case 2). Uniform cut point (mechanism: random blade) → \(P(\text{long} \geq 2\times\text{short}) = 1/2\). Uniform ratio (no mechanism) → \(1/3\).  
     *Status*: Genuine for real inference; heuristic without it.  

  ---

  ### **Key Tensions and Trade-offs**  
  - **Parameterization-Invariance vs. Unique-Answerability**: **Mutually exclusive** in general (proven by Bertrand). You can’t have both if symmetries conflict.  
  - **Symmetry-Respecting vs. Marginalization-Consistency**: Often incompatible (e.g., urn problems). Indifference over one hierarchy (colors) breaks consistency in another (marble counts).  
  - **Your "description-invariance"**: Requires PoI to respect *intrinsic symmetries* of the system (e.g., rotational symmetry of a circle). It buys consistency in Cases 2 (stick) and 5 (sphere) but **fails circularity-test**: "Intrinsic" is model-dependent. Costs uniqueness (Case 1).  

  ---

  ### **Assessment of Major Approaches**  
  *Against the desiderata (✓ = satisfies, ✗ = fails, ~ = partial)*:  

  | Approach                  | Parameter-Inv | Symmetry | Conditioning | Marginalization | Unique Answer | Operational |  
  |---------------------------|---------------|----------|--------------|-----------------|---------------|-------------|  
  | **Max-Entropy/Group-Inv** | ✗ (Case 3)    | ✓        | ✓ (Case 5)   | ✗ (Case 6)      | ~             | ✗           |  
  | **Reference Priors**      | ~ (Jeffreys)  | ~        | ✓            | ✗               | ✗             | ✓ (Case 2)  |  
  | **Reject PoI Entirely**   | N/A           | N/A      | N/A          | N/A             | ✓ (no paradox)| ✓           |  

  - **Max-Entropy/Group-Invariance**: Maximizes entropy subject to constraints. Fails parameterization-invariance (e.g., cube volume vs. edge). Best for symmetry (coin log-odds) but ignores operational meaning (stick).  
  - **Reference Priors**: E.g., Jeffreys prior (\( \sqrt{I(p)} \)) for coins. Solves parameterization-invariance (Case 4) and operational cases (stick) but fails marginalization (urn) and isn’t unique.  
  - **Reject PoI**: Treats "ignorance" as a mirage. Avoids paradoxes (Unique-Answerability ✓) but offers no prior for real inference (fails Conditioning, Symmetry).  

  ---

  ### **The Real Lesson from Bertrand**  
  **Bertrand’s paradox is not about chords—it’s proof that no single principle satisfies all desiderata.** The tension arises because:  
  - Desiderata 1–4 are *genuine* for objective inference but often incompatible.  
  - Desiderata 5 (Unique-Answerability) and 6 (Operational-Meaningfulness) conflict: The latter requires context, violating the former.  
  - **Most damaging desideratum**: Parameterization-Invariance. It’s fundamental but mathematically impossible to satisfy with Unique-Answerability (Case 1) or Marginalization-Consistency (Case 6).  

  **What to tell students**:  
  > "‘Uniform’ depends on *how* randomness is generated. Bertrand exposes hidden assumptions: ‘No reason to distinguish’ only works if we specify *which symmetries or mechanisms* define ‘distinctions’. Without this, PoI is heuristic—not law. In practice, use symmetry when justified (e.g., coins), or operationalize randomness (e.g., stick lengths). Else, admit ignorance isn’t quantifiable."

  This frames the paradox as a revelation about modeling, not probability itself.
