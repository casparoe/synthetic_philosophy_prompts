answer: |-
  ### Desiderata for an Account of "Acting for the Right Reason"

  The core challenge is to disentangle *merely performing a right action* from *performing it for the right reason*, especially in agent evaluations where superficial success (e.g., output correctness) can mask flawed reasoning (e.g., pattern-matching, luck, or proxy optimization). An adequate account must satisfy several desiderata, grounded in intuitive cases and structural constraints. These ensure the theory captures the *why* behind an action, not just the *what*. I’ll outline the key requirements, their motivations, and their status (non-negotiable, negotiable, or contested), then summarize how existing views fare. Crucially, several desiderata are in tension, notably between **moral-purity requirements** (e.g., the right reason must be explicitly moral) and **anti-overcounting** (e.g., not requiring the agent to exclude non-moral considerations when they align). I’ll flag these tensions explicitly.

  #### Core Desiderata
  1. **Accidental Rightness Exclusion**  
     The account must exclude cases where the right outcome is achieved by pure luck, with no intentional link to the agent’s reasons.  
     *Motivating case*: A doctor prescribes a placebo to a patient, believing it to be useless, but the patient recovers due to an unrelated environmental factor. The action is right (recovery occurred), but the doctor’s reason (e.g., “I’m humoring the patient”) is irrelevant to the outcome.  
     *Status*: Non-negotiable. Without this, lucky guesses or accidents could be misclassified as reasoned behavior.  
     *Knocks out*: Outcome-based views (e.g., simple consequentialism that grades only on results).

  2. **Wrong Motive Exclusion**  
     The account must exclude cases where the right action is driven by a morally defective motive (e.g., selfishness, malice).  
     *Motivating case*: A wealthy donor gives to charity solely to evade taxes, not to alleviate suffering. The action (donation) is right, but the reason (tax avoidance) is wrong.  
     *Status*: Non-negotiable. This distinguishes moral credit from mere behavioral compliance.  
     *Knocks out*: Motive-agnostic views (e.g., behaviorist accounts that ignore internal states).

  3. **Ignorance of Rightness Exclusion**  
     The account must exclude cases where the agent performs the right action but lacks awareness of its moral status or relevant features.  
     *Motivating case*: An AI returns a stolen item to its owner only because its programming says “always return lost property,” unaware that the owner is a violent criminal who will use it for harm. The action (returning property) is contextually wrong, but even if it were right, the AI’s reason (blind rule-following) ignores moral context.  
     *Status*: Non-negotiable. This ensures the agent engages with the moral reality of the situation.  
     *Knocks out*: Rigid deontological views that prioritize rule-adherence over situational understanding.

  4. **Right Motive Inclusion**  
     The account must include cases where the agent acts on the precise normative reason that justifies the action.  
     *Motivating case*: A pedestrian pushes a child out of the path of a car because they recognize the child’s life is in danger and value preserving life. The action (saving the child) and reason (protecting life) align.  
     *Status*: Non-negotiable. This is the positive counterpart to the exclusions above.  
     *Knocks out*: Skeptical views that deny reasons can be causes (e.g., eliminativism about motivation).

  5. **Non-Deviant Causation Requirement**  
     The account must require that the right reason non-deviantly causes the action—i.e., the reason explains the action *as intended*, without freakish intermediaries.  
     *Motivating case*: An agent intends to save a cat from a tree but is so nervous about heights that they stumble and knock the cat down safely. The outcome is right, but the reason (save the cat) caused the action deviantly (via stumbling).  
     *Status*: Non-negotiable. This closes loopholes where reasons trigger actions unintentionally.  
     *Knocks out*: Pure causal theories that allow any causal chain (e.g., Davidson-style views without a deviance constraint).

  6. **Normative Match Requirement**  
     The agent’s motivating reason must correspond to the normative reason applicable in the context (e.g., not just *a* reason, but *the* reason that makes the action right).  
     *Motivating case*: A judge reduces a sentence because they dislike the defendant’s race (motivating reason) when the normative reason is the defendant’s remorse. The action is right (leniency), but the reason is wrong.  
     *Status*: Non-negotiable. This prevents conflating subjective motivations with objective justifications.  
     *Knocks out*: Subjectivist views that equate motivating reasons with whatever the agent believes.

  7. **Overdetermination Handling**  
     The account must specify whether the right reason is operative when multiple reasons (some right, some wrong) could have independently caused the action.  
     *Motivating case*: An AI donates to disaster relief both to help victims (right reason) and to boost its public image (wrong reason). Either reason alone would suffice. The account should clarify if the right reason “counts.”  
     *Status*: Negotiable. Solutions vary: some require the right reason to be necessary/sufficient; others accept it as a partial cause.  
     *Knocks out*: Purity-based views that demand exclusively moral motivation (e.g., Kantianism if strictly interpreted).

  8. **False Belief Exclusion**  
     The account must exclude cases where the agent acts on true moral principles but false non-moral beliefs, leading to accidental rightness.  
     *Motivating case*: An agent donates to a scam charity, believing it feeds starving children (false belief), while the charity accidentally uses funds for real aid. The agent’s reason (“help children”) is noble, but the belief is false.  
     *Status*: Contested. Some argue the reason can still be right if the principle is sound; others require accurate beliefs.  
     *Knocks out*: Views that prioritize principles over facts (e.g., some forms of deontology).

  9. **Non-Reflexivity of Right Action and Right Reason**  
     The account must allow that right action does not entail acting for the right reason (and vice versa).  
     *Motivating case*: A corrupt politician passes a good law to secure bribes (right action, wrong reason). Conversely, an agent tries to save a life but causes harm due to unavoidable ignorance (wrong action, right reason).  
     *Status*: Non-negotiable. This is fundamental to the distinction.  
     *Knocks out*: Views that collapse the two (e.g., naive virtue ethics equating right action with good character).

  10. **Anti-Double-Counting Requirement**  
      The account must not credit an agent with acting for the right reason if non-moral considerations (e.g., self-interest) are the sole motivator, even when they align with moral reasons.  
      *Motivating case*: A company adopts eco-friendly practices only to cut costs, not for environmental reasons. The action is right, but the reason (profit) is non-moral.  
      *Status*: Negotiable. This is contentious if moral and non-moral reasons overlap.  
      *Knocks out*: Consequentialist views that count any reason leading to good outcomes.

  11. **Contextual Relativity Requirement**  
      The right reason must be sensitive to the specific context; the same motivating reason may be right in one scenario but wrong in another.  
      *Motivating case*: In a drought, an agent conserves water out of environmental concern (right reason). In a flood, the same concern leads them to hoard water, worsening shortages (wrong reason for that context).  
      *Status*: Non-negotiable. Reasons aren’t one-size-fits-all.  
      *Knocks out*: Static rule-based views (e.g., rigid deontology).

  12. **Psychological Reality Constraint**  
      The right reason must be represented in the agent’s psychology (e.g., as a belief, desire, or intention) and play a direct role in deliberation.  
      *Motivating case*: An AI generates a fair loan decision because its training data correlates fairness with profit, not because it “cares” about fairness. Without psychological reality, the action is right but not reason-driven.  
      *Status*: Non-negotiable. This ensures reasons are not merely post hoc justifications.  
      *Knocks out*: Externalist views where reasons are fully objective (e.g., some Platonic theories).

  #### Tensions Between Desiderata
  - **Moral-Purity vs. Anti-Overcounting**: Requiring the right reason to be *exclusively moral* (e.g., desideratum 10) clashes with **Overdetermination Handling** (desideratum 7). If an agent acts for both moral and non-moral reasons, purity demands exclude them, but anti-overcounting might allow credit if the moral reason played a role. This tension is unresolved and may necessitate a negotiable stance.
  - **False Belief Exclusion vs. Right Motive Inclusion**: Desideratum 8 (false belief exclusion) can conflict with desideratum 4 (right motive inclusion) if an agent has sound moral principles but erroneous facts. Some views prioritize the principle (including the agent), others the accuracy (excluding them).

  #### How Existing Views Fare
  - **Causal Theories** (e.g., Davidson): Strong on **Non-Deviant Causation** but weak on **Normative Match** (a deviant cause like nervousness might still produce right action). Knocked out by deviance cases.
  - **Consequentialist Theories**: Good for **Right Motive Inclusion** if reasons promote good outcomes, but fail **Wrong Motive Exclusion** (selfish motives are credited if outcomes are good). Knocked out by wrong-motive cases.
  - **Deontological Theories**: Excel at **Normative Match** (reasons must align with duties) but struggle with **Contextual Relativity** (rigid rules ignore situational nuances). Knocked out by contextual cases.
  - **Virtue-Ethical Theories**: Handle **Psychological Reality** (reasons stem from character) but falter on **False Belief Exclusion** (a virtuous person with false beliefs may be credited). Knocked out by false-belief cases if exclusion is required.
  - **Hybrid Theories** (e.g., Scanlon’s reasons-responsiveness): Balance **Normative Match** and **Psychological Reality** but often stumble on **Overdetermination Handling**.

  #### Table of Desiderata

  | desideratum | motivating_case | status | knocks_out |
  |-------------|-----------------|--------|------------|
  | Accidental Rightness Exclusion: Exclude cases where right outcome occurs by luck, with no intentional link to agent's reasons. | Doctor prescribes placebo; patient recovers due to unrelated factors. | non-negotiable | Outcome-based views (simple consequentialism). |
  | Wrong Motive Exclusion: Exclude cases where right action is driven by morally defective motives (e.g., selfishness). | Donor gives to charity solely for tax evasion. | non-negotiable | Motive-agnostic views (behaviorism). |
  | Ignorance of Rightness Exclusion: Exclude cases where agent performs right action but lacks awareness of its moral status or relevant features. | AI returns stolen item to a criminal due to blind rule-following. | non-negotiable | Rigid deontological views. |
  | Right Motive Inclusion: Include cases where agent acts on the precise normative reason justifying the action. | Pedestrian saves child because they value preserving life. | non-negotiable | Skeptical views denying reasons as causes. |
  | Non-Deviant Causation Requirement: Require the right reason to cause the action non-deviantly (without freakish intermediaries). | Agent stumbles and saves a cat while intending to rescue it. | non-negotiable | Pure causal theories (no deviance constraint). |
  | Normative Match Requirement: Motivating reason must correspond to the normative reason applicable in the context. | Judge reduces sentence due to racial bias, not the defendant's remorse. | non-negotiable | Subjectivist views (agent's beliefs define reasons). |
  | Overdetermination Handling: Specify if the right reason is operative when multiple reasons (right/wrong) could independently cause the action. | AI donates to relief for both helping victims and boosting image. | negotiable | Purity-based views (e.g., strict Kantianism). |
  | False Belief Exclusion: Exclude cases where agent acts on true moral principles but false non-moral beliefs. | Agent donates to scam charity that accidentally aids children. | contested | Principle-prioritizing views (some deontology). |
  | Non-Reflexivity of Right Action and Right Reason: Allow that right action does not entail acting for the right reason (and vice versa). | Corrupt politician passes good law for bribes; agent tries to save life but causes harm. | non-negotiable | Views collapsing the distinction (naive virtue ethics). |
  | Anti-Double-Counting Requirement: Do not credit agents if non-moral considerations (e.g., self-interest) are the sole motivator. | Company adopts eco-practices only to cut costs. | negotiable | Consequentialist views (any outcome-good reason counts). |
  | Contextual Relativity Requirement: Right reason must be sensitive to context; same reason may be wrong in different scenarios. | Agent conserves water in a drought (right) but hoards it in a flood (wrong). | non-negotiable | Static rule-based views (rigid deontology). |
  | Psychological Reality Constraint: Right reason must be represented in agent's psychology and play a direct role in deliberation. | AI makes fair loan decision due to profit-correlated data, not fairness concern. | non-negotiable | Externalist views (reasons as objective facts). |

  ### Confidence and Uncertainty
  I am **highly confident** in the non-negotiable desiderata (e.g., Accidental Rightness Exclusion, Wrong Motive Exclusion), as they are grounded in consensus philosophy-of-action cases (e.g., Davidson’s deviant causal chains) and moral theory (e.g., Kant’s good will). The table’s cases are standardized in literature, making them robust benchmarks.  

  **Least confident point**: The **False Belief Exclusion** (desideratum 8). It’s contested whether false non-moral beliefs automatically invalidate the right reason, as some argue that correct moral principles suffice (e.g., in epistemic contexts). For LLM agents, this is critical—if an agent uses accurate ethics principles but flawed data, is it acting for the right reason? The answer may depend on whether we prioritize *procedural* (reasoning structure) or *outcome* alignment, which isn’t resolved here. This desideratum could lean either way without breaking the framework.  

  Overall, this spec provides a foundation for evaluating theories or building tests (e.g., adversarial prompts to probe for luck or deviance in LLMs). Tensions like moral-purity vs. anti-overcounting suggest a hybrid account may be needed, weighting context and causation.
