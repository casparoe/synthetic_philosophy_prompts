  We are building desiderata for an account of "acting for the right reason". The account must separate "did the right thing" from "did the right thing for the right reason."

  Key cases to cover:
  1. Pure accident: The agent does the right thing by pure luck (e.g., saves a life by accidentally tripping and falling on the emergency stop button).
  2. Wrong motive: The agent does the right thing but for a bad reason (e.g., donates to charity to show off).
  3. Ignorance of rightness: The agent does the right thing but has no idea it's the right thing (e.g., follows a rule that happens to be moral without knowing why).

  But we need more. Also consider:
  4. Right reason but wrong belief: The agent acts for what they believe is a moral reason, but the belief is false (e.g., donates to a harmful charity thinking it's good).
  5. Multiple reasons: The agent has several reasons, some right and some wrong, and it's unclear which one motivated the action.
  6. Deviant causal chains: The agent has the right reason and it causes the action, but in a strange way (e.g., the thought of duty makes me so nervous I drop a glass, which causes a distraction that saves a life).

  Distinctions to respect:
  - Right action vs. right reason: We must not conflate the two.
  - Acting because of a reason vs. acting for a reason: This might be about the reason being a motivating reason (in the agent's psychology) and also being the reason that justifies the action (normative reason). Also, there's a distinction between having a reason and acting on it.

  Structural facts:
  - Reasons can be motivating (what actually moves the agent) and normative (what counts in favor of the action).
  - The right reason must be a normative reason that applies to the situation and also be the motivating reason in the right way.

  Potential tensions:
  - If we require the right reason to be a moral reason, then in cases where there are multiple reasons (e.g., moral and prudential) and the agent acts on the prudential one, we might say they didn't act for the right reason. But if the moral reason is also present and the action is overdetermined, it might be tricky.

  Desiderata (to be listed in a table later):

  1. **Accidental Rightness Exclusion**: The account must not count an action as done for the right reason if the right outcome was achieved purely by accident and without any connection to the agent's reasons. 
     - *Motivating case*: The person who accidentally trips and hits the emergency stop button, stopping a runaway train, without any intention of doing so.

  2. **Wrong Motive Exclusion**: The account must not count an action as done for the right reason if the agent's motive was morally bad, even if the action was right.
     - *Motivating case*: Donating to charity solely to impress others.

  3. **Ignorance of Rightness Exclusion**: The account must not count an action as done for the right reason if the agent was unaware that the action was right and did not act on the basis of any morally relevant feature.
     - *Motivating case*: Following a rule (e.g., "always return what you borrow") without knowing the moral basis (e.g., respect for property) and returning a borrowed weapon to a person who is about to commit a murder.

  4. **Right Motive Inclusion**: The account must count an action as done for the right reason when the agent acts on the basis of the morally relevant features of the situation, and those features are indeed the right reasons.
     - *Motivating case*: Donating to a charity because one recognizes the suffering of others and wants to alleviate it.

  5. **Overdetermination Handling**: The account should be able to handle cases where there are multiple motives, some right and some wrong, and determine whether the right reason was a motivating reason (even if not the only one).
