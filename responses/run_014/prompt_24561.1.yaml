      Actually, this might be a specific case of overdetermination. We can merge.

  12. **Contextual Relativity**: The right reason might depend on the context. For example, the right reason to keep a promise might be that promises create obligations, but in a particular case, there might be an emergency that overrides. However, the agent must act on the reason that is appropriate in that context.

      But note: the normative reason is fixed by the context. So the motivating reason must match the normative reason that applies in that context.

      *Motivating case*: In a situation where breaking a promise is the right thing to do (because of an emergency), an agent who keeps the promise out of a sense of duty is not acting for the right reason (even though in normal circumstances, sense of duty would be the right reason). The right reason in that context is to address the emergency.

  Status:

  - Non-negotiable: Those without which the account fails to capture the core intuition (e.g., accidental rightness must be excluded, wrong motive must be excluded, right motive must be included).
  - Negotiable: Those that are important but might be handled in different ways (e.g., overdetermination).
  - Contested: Those that are debated in the literature (e.g., whether false beliefs automatically exclude acting for the right reason).

  Existing views:

  1. **Causal Theories**: Acting for the right reason requires that the normative reason (or the agent's belief about it) causes the action in the right way (non-deviantly). 
     - Problems: deviant causal chains.

  2. **Reason-Stating Theories**: The agent must be able to state the reason and it must be the right one. 
     - Problems: animals, children, or inarticulate agents might act for reasons without stating them.

  3. **Constitutivist Theories**: Acting for a reason is part of what constitutes intentional action. The right reason must be the one that rationalizes the action in the agent's practical reasoning.
     - Problems: might not handle false beliefs well.

  4. **Matching Theories**: The agent's motivating reason must match the normative reason (in content or in type).
     - Problems: how to define matching? Also, overdetermination.

  5. **Hybrid Theories**: Combine causal and matching.

