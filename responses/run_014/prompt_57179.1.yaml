prompt: |-
  You're a decision theorist who has argued about the Allais problem with students for years. Think carefully, and brainstorm candidate labels before settling on one. There's a move I keep running into and I don't have a name for it. I put up the two Allais pairs, someone agrees their choices clash with the independence axiom, and then rather than drop the axiom they say the problem statement left something out: the certain option also buys you not having to explain yourself afterwards, or there's a small chance the organiser goes bust so both options can pay nothing, or the winnings land in different tax years so they aren't really the same amounts. Put that missing feature back in and their choices are perfectly respectable. Same thing occured with the sure-thing principle in a medical example — the doctor says the test result also tells her how the patient will respond, so the two acts weren't the same acts after all. So the pattern is: an axiom about choices gets treated as incapable of being violated, and any apparent violation is read as evidence that the description of the options was incomplete. Is there an established concept for that specific move, in decision theory or in philosophy of science? Don't just hand me a label, I want the carving: what the nearest existing concepts are (I have vague feelings about framing, about some caveat involving small worlds, and about Popperian unfalsifiability), how my case differs from each of them, and which one actually fits best. And if nothing fits, coin a term, define it, and say where the edges are — in particular, when is adding an omitted feature to a decision problem legitimate rather than a rescue? No references needed, just the analysis. British English please.
reasoning: |-
  Okay, the user is a decision theorist who's been grappling with the Allais paradox for years. They've noticed a recurring pattern where students, when confronted with choices that violate the independence axiom, insist the problem statement omitted some crucial feature—like psychological comfort or external risks—that "explains away" the violation. The same pattern appears in medical examples violating the sure-thing principle. The user wants to name this specific move: treating axioms as unfalsifiable by attributing violations to incomplete descriptions.

  Hmm, let me unpack the core issue. The user isn't just asking for a label—they want precise conceptual carving. They mention three nearby concepts: framing effects (which they dismiss as not fitting), small-world caveats (Savage's idea that descriptions must capture all relevant state dependencies), and Popperian unfalsifiability (immunizing theories against counterevidence). 

  First, framing: The user's case isn't about presentation affecting perception (e.g., loss vs gain framing). Here, students are *adding substantive content* to the outcomes (e.g., "not explaining yourself" as a benefit). So this is different—it's outcome-redefinition, not framing. 

  Second, small-world problems: Savage warned that if the "small world" description omits state-dependent consequences (like feeling regret), the axiom doesn't apply. Students exploit this by retrofitting hidden consequences. But Savage intended this as a *precondition* for applying axioms, not a loophole to evade violations. The user's students are misusing it defensively. 

  Third, unfalsifiability: This feels closest. Like Popper's critique of Freudians explaining away contradictions, students immunize the axiom. But Popper targeted grand theories; here it's micro-immunization of a normative axiom. 

  Ah—the best fit might be "**axiomatic immunization**." It captures the core move: shielding axioms from counterexamples by expanding the outcome space to absorb inconsistencies. Crucially, it distinguishes legitimate additions (e.g., omitted taxes) from illegitimate ones (e.g., inventing "explanation avoidance" post-hoc). Legitimacy hinges on whether the feature affects preferences *independently of the axiom's test* and is non-ad-hoc. 

  User will appreciate the boundary-drawing: Rescue is legitimate if the feature (1) exists empirically, (2) isn't reverse-engineered from the violation, and (3) alters the formal outcome set. Their students fail (2). 

  ...Also noting their British English request. "Organiser" with 's', not 'z'. Sorted.
answer: |-
  Right, this is a familiar and fascinating move – let's carve this properly. It's not just a quirk; it's a specific evasion tactic when normative axioms face descriptive counterexamples. Here's the analysis and the proposed label:

  **The Core Move:** When presented with a choice pair that *prima facie* violates a decision axiom (like Independence or Sure-Thing), the individual insists that the *description of the outcomes* was incomplete. By adding an unstated feature (e.g., psychological relief, hidden risk, informational value) to the outcomes of the "certain" or "problematic" option, they redefine the acts such that the axiom is no longer violated within the *newly defined* outcome space. The axiom itself is treated as sacrosanct and incapable of being genuinely violated; the apparent violation *must* be due to a modelling error in the problem setup.

  **Carving Up the Neighbourhood:**

  1.  **Framing Effects:**
      *   **What it is:** Choices change based on how *identical* options are presented (e.g., "90% survival" vs. "10% mortality"). The underlying outcomes and probabilities are the same; only the description differs.
      *   **How this case differs:** Here, the individual isn't claiming the *same* outcomes were framed differently. They are claiming the *outcomes themselves were substantively different* from what was stated. They are adding *new content* to the outcome descriptions (e.g., adding "avoidance of regret explanation" to winning £1M for sure), fundamentally changing the nature of the acts. It's a claim about the ontology of the outcomes, not just their presentation.

  2.  **Small-World Caveats (Savage):**
      *   **What it is:** Savage's concept that a "small world" decision problem must include *all consequences relevant to the agent's preferences*. Omitting a consequence (like anxiety, regret, or a hidden state dependency) means the formal acts described don't actually correspond to the real objects of choice, so the axioms don't apply. Legitimate modelling requires capturing the "grand world" consequences within the "small world".
      *   **How this case *seems* similar:** The individual *invokes* this idea: "You left out consequence X!". It directly appeals to the requirement for a complete state-consequence description.
      *   **How this case differs (and why it's problematic):** The crucial difference is **post-hoc justification and lack of independent motivation**. In legitimate small-world construction, the modeller identifies relevant consequences *before* or *independently* of seeing the choices. Here, the "omitted consequence" (e.g., "not having to explain oneself") is often *only identified because* the choices violate the axiom. It's reverse-engineered *specifically* to rescue the axiom, not derived from a general understanding of the agent's preferences or the decision context *prior* to the problematic choice. It often lacks empirical grounding beyond explaining away the violation.

  3.  **Popperian Unfalsifiability / Immunisation:**
      *   **What it is:** Making a theory (or axiom) immune to empirical refutation by introducing auxiliary hypotheses or redefinitions *after* a counterexample arises, solely to protect the core theory.
      *   **How this case is strikingly similar:** This is the *strongest* parallel. The core axiom (Independence, Sure-Thing) is the "theory". The apparent choice violation is the "counterexample". The addition of the unstated feature is the "auxiliary hypothesis" (e.g., "all certain outcomes include psychological security"). This auxiliary hypothesis is typically vague, hard to test independently, and crucially, *only brought up when the axiom is challenged*. Like immunising a grand theory, it protects the normative axiom from descriptive falsification.
      *   **Nuance:** While Popper focused on grand scientific theories, the structure is identical here for micro-level normative axioms in decision theory. The "immunisation" happens at the level of interpreting specific problem instantiations.

  **The Best Fit: Axiomatic Immunisation**

  *   **The Label:** **Axiomatic Immunisation** (or **Axiom Immunisation**)
  *   **Definition:** The defensive move in decision theory where an apparent violation of a normative axiom (e.g., Independence, Sure-Thing) is explained away, not by rejecting the axiom, but by retrospectively claiming that the description of the acts or outcomes was incomplete. An unstated feature is added to the outcomes (often psychological or contextual) specifically to redefine the acts such that the axiom is preserved within the newly defined outcome space. This feature is typically invoked *post-hoc* in response to the violation and serves primarily to protect the axiom from empirical counterexample.
  *   **Key Characteristics:**
      1.  **Axiom Preservation:** The core axiom is treated as inviolable.
      2.  **Outcome Redefinition:** The *content* of the outcomes is altered by adding features not in the original problem statement.
      3.  **Post-Hoc Justification:** The "omitted" feature is identified primarily *because* of the violation, not from independent analysis of the decision context.
      4.  **Rescue Function:** The sole or primary purpose of adding the feature is to dissolve the contradiction between the choices and the axiom.

  **Drawing the Edges: Legitimate Completion vs. Immunisation Rescue**

  This is critical. Not all additions to a problem description are immunisation. When is adding a feature legitimate modelling?

  1.  **Prior, Independent Motivation:** Is there evidence *external to the specific choice pair* that this feature is a relevant consequence for the agent? (e.g., Known tax implications applied consistently; established psychological aversion to regret mentioned *before* seeing Allais choices).
  2.  **Generality:** Does the added feature apply consistently across *other* decisions, or only to this specific choice that violates the axiom? (Immunisation features are often highly specific to the problematic pair).
  3.  **Non-Ad-Hocness:** Is the feature plausible and grounded in the *actual context* of the decision (e.g., real bankruptcy risk for the organiser), or is it a purely theoretical contrivance invented for the rescue (e.g., "winning £1M for sure also buys world peace, which I value")? The latter is clearly immunisation.
  4.  **Testability:** Can the impact of the proposed feature be tested *independently*? (e.g., Can you measure the value of "not having to explain" outside the Allais paradox? If not, it's suspect).
  5.  **Formal Relevance:** Does the added feature genuinely change the *outcome mapping across states* in a way relevant to preferences? Legitimate additions alter the formal description of `f(s)` and `g(s)` for acts `f` and `g`. Immunisation often adds features that *only* attach to the seemingly "problematic" option (like certainty).

  **In essence:** Legitimate modelling completes the description based on independent, contextual factors relevant to the agent's preferences in general. **Axiomatic Immunisation** is a *defensive, post-hoc manoeuvre* that introduces features *specifically and solely* to reconcile an observed choice pattern with a favoured normative axiom, often lacking independent justification or testability. It treats the axiom as analytically true, shifting all blame for contradictions onto the modeller's incomplete description.

  This move fundamentally blocks the descriptive critique of normative axioms by making any counterexample potentially explainable via unstated outcome features. Recognising it as "immunisation" highlights its defensive, theory-protecting nature.
