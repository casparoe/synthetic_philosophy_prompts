prompt: |-
  I chair the weekly architecture review for a team that builds an agent platform on top of a fairly conventional distributed systems stack, and there is an argument that has recurred in those reviews for about two years, always in the same shape. One camp — call them the substrate people — insists that any high-level claim in a design document can be rewritten, in principle, as a statement about states, transitions, packets and activation patterns, and that once you have done so the high-level sentence has no work left to do: it is decoration, or at best a compression format for humans. The other camp insists that the high-level description is precisely what explains the behaviour, and that designing against it is not a convenience but the only tractable option; they will happily write that the scheduler is fair, that the type system prevents a class of bug, that the agent has a persistent goal, and treat those sentences as facts about the world rather than as prose. I have read Hofstadter's Gödel, Escher, Bach a couple of times over the years and it gave me the vocabulary I keep reaching for here: in one of the dialogues the brain is treated as a seething machine of interacting parts — the careenium — in which symbols, the simmballs, somehow get to shove the machinery around, even though the machinery is doing nothing but physics. That is exactly the shape of my reviewers' dispute, with design documents in place of skulls. I have no formal philosophy training, so what I want from you is not a survey of the debate but something I can hand to a room of engineers.

  Please write a decision procedure that a reviewer can run on a single high-level claim in a design document and come out with a defensible verdict. It should have a triage step at the front, because I suspect the camps are partly talking past each other: some claims are causal (this is what prevented the split-brain), some are constitutive or definitional (this invariant is what makes the module a queue), and some are normative or design-level (this allocation is fair), and the procedure needs to say which of these a claim is before it starts testing it. Then give me the ordered questions, what counts as a sufficient answer to each, and where the procedure terminates in one of three verdicts: the claim is load-bearing and belongs in the document; the claim is a redescription of the substrate and should be marked as commentary; or the case cannot be settled at review time and must be handed to a named human because the remaining question is about design values rather than facts. Ground the steps in whatever the philosophy of mind and the causation literature actually offers that survives contact with practice — the exclusion worry, epiphenomenalism, multiple realisation, screening-off, counterfactual and intervention-style tests, the question of whether something acts in virtue of the property you named or merely in virtue of a property that happens to travel with it — but name a piece of machinery only where naming it changes how a step gets executed. No bibliography, no reading list, no citations; if you mention a philosopher, mention them in passing at most. Each step should be runnable by a competent engineer in about five minutes against a paragraph of prose, and I want you to be explicit about which steps are judgment calls wearing a procedure's clothes, about the failure modes (a genuinely load-bearing claim being marked down as decoration, or the procedure being used as a rhetorical weapon by whichever camp is currently winning), and about the classes of claim it will systematically get wrong.

  Finally, run the procedure on three cases and show your working, including the intermediate answers rather than just the verdicts. The first is a claim from an agent design document: the model has a persistent concept of plurality, and that concept is why it produces the plural form, as against a colleague's counter-claim that all there is is a pattern of activations and the concept talk is inert. The second is a claim from a post-incident review: leader election is what prevented a split-brain during the network partition, as against the substrate people's counter-claim that the whole event is fully described by which messages arrived at which node when, and that mentioning the protocol adds nothing. The third is my own pet claim, which I want you to be willing to demolish: that the module boundary is what makes this codebase maintainable, and that maintainability is a property of the boundary rather than of the many small decisions on either side of it. If the procedure says something I will not like about that third case, say it plainly and explain which step did the damage. Close with a short section on what the procedure cannot do — the questions it looks as though it answers but does not — and please write the whole thing in British English.
reasoning: |-
  We are creating a decision procedure for evaluating high-level claims in design documents. The goal is to triage claims into three categories: 
   1. Load-bearing and belongs in the document.
   2. Commentary (redescription of the substrate).
   3. Unsettled at review time (requires human judgment on design values).

   The procedure has two main phases:
   Phase 1: Triage the claim into one of three types:
     A. Causal claim: about what caused an event or prevented an outcome.
     B. Constitutive/definitional claim: about what defines an entity or invariant.
     C. Normative/design claim: about what ought to be, or about design goals (like maintainability).

   Phase 2: Apply a series of tests based on the claim type. We use concepts from philosophy of mind and causation (like multiple realizability, counterfactual tests, screening off, epiphenomenalism) but only as practical tools.

   We'll design the steps to be executable in about 5 minutes per claim.

   Important: We must note which steps are judgment calls and the failure modes.

   Steps:

   1. **Triage Step**: Determine the type of claim.
      - Read the claim and ask: "What is the claim primarily about?"
          - If it's about why something happened (e.g., prevented a failure, caused an effect) -> Causal (A).
          - If it's about what something is (e.g., defining an invariant, a component) -> Constitutive (B).
          - If it's about a desirable property (e.g., fairness, maintainability) -> Normative (C).

   2. **For Causal Claims (A)**:
      We are testing whether the high-level concept (e.g., leader election) is doing causal work, or if it's just a redescription of the substrate.

      Step A1: **Counterfactual Test**:
          Ask: "If the high-level property (e.g., leader election) had been absent, but the substrate events (messages, states) had been as similar as possible, would the outcome (e.g., preventing split-brain) have been different?"
          - If yes, then the high-level property is causally relevant. 
          - If no, then it might be epiphenomenal.

          But note: the substrate events might not be the same if the high-level property is absent. So we must consider what it means for the substrate to be "as similar as possible" without the high-level property.

          How to run: 
            - Imagine a scenario where the high-level property (e.g., leader election) is removed. For example, remove the protocol and see what happens to message patterns. Then check if the outcome changes.
            - Example: Without leader election, during a partition, multiple nodes might think they are the leader (split-brain). With leader election, only one node is leader. So the outcome (split-brain or not) changes.

          Sufficient answer: 
            - If the outcome changes in the counterfactual, then the high-level property is causal. 
            - If the outcome does not change, then the high-level property might not be causal.

      Step A2: **Screening Off Test** (to check if the substrate events fully account for the outcome, making the high-level property redundant):
          Ask: "Once we fix the substrate events (e.g., the exact sequence of messages and states), does varying the high-level property (while keeping the substrate fixed) change the outcome?"
          - If the outcome does not change when we vary the high-level property (with substrate fixed), then the high-level property is screened off by the substrate and is not doing additional causal work.

          Example: In the leader election claim, if we fix all the messages and states (which nodes sent what and when), then the outcome (split-brain or not) is fixed. The protocol (high-level) doesn't add anything beyond the messages. But note: the protocol is what generated the messages. So in the counterfactual we changed the protocol and that changed the messages. However, in the screening off test, we are holding the messages fixed and then changing the protocol (which wouldn't change the outcome because the messages are fixed). This suggests that the high-level property is not doing extra work once the substrate is fixed.

          But this test might be too strict because the high-level property is a pattern in the substrate. We are interested in whether the pattern (as a pattern) is what matters.

          Therefore, we must combine with Step A3.

      Step A3: **Multiple Realizability Test**:
          Ask: "Could the same high-level property (e.g., leader election) be realized by a different substrate (e.g., different message patterns, different algorithm) and still produce the same outcome? And conversely, could the same substrate events (message patterns) be interpreted as a different high-level property and still lead to the same outcome?"

          - If the high-level property can be realized in multiple ways (and the outcome holds in all), and the substrate events alone don't capture the pattern (so the same substrate events might be interpreted as a different high-level property but the outcome would change if the high-level property were different) then the high-level property is doing work.

          Example: Leader election can be implemented with different algorithms (bully, raft, etc.). In all cases, it prevents split-brain. So the pattern (leader election) is what matters, not the exact messages.

          However, if the outcome depends on the exact message timing (e.g., a very specific race condition) and not on the pattern, then the high-level property might be irrelevant.

          How this helps: If the high-level property is multiply realizable, then it is not reducible to one substrate and hence is a useful description.

      Verdict for Causal Claim:
          - If the claim passes the counterfactual test (A1) and the multiple realizability test (A3) (i.e., the outcome depends on the high-level property and it can be realized in multiple ways), then it is load-bearing.
          - If it fails A1 (counterfactual) or if the screening off test (A2) shows that the substrate alone determines the outcome and the high-level property is not multiply realizable (A3 fails), then it is commentary.
          - If there is ambiguity (e.g., the counterfactual is hard to imagine, or the multiple realizability is debatable), then hand to a human.

   3. **For Constitutive Claims (B)**:
      These are about what defines something. Example: "This invariant is what makes the module a queue."

      Step B1: **Necessity Test**:
          Ask: "If the claimed property (e.g., the invariant) were absent, would the entity (e.g., the module) cease to be what it is (e.g., a queue)?"
          - Example: Without the FIFO invariant, is it still a queue? Probably not.

      Step B2: **Sufficiency Test**:
          Ask: "Is the property sufficient (given the context) to define the entity? Or are there other essential properties?"
          - Example: Having FIFO is necessary for a queue, but is it sufficient? What about other properties (e.g., being a buffer, having enqueue/dequeue operations)? 

          We are not looking for a full definition, but whether the claim is capturing a defining feature.

      Step B3: **Operational Relevance Test**:
          Ask: "Does the property play a role in the system's operation beyond being a label? (e.g., does the invariant get used in reasoning about correctness, performance, etc.?)"
          - If the property is only a label and not used in any reasoning, then it might be commentary.

      Verdict for Constitutive Claim:
          - If the property is necessary (B1) and operationally relevant (B3), then it is load-bearing.
          - If it is not necessary (B1 fails) and not used in reasoning (B3 fails), then it is commentary.
          - If it is necessary but not sufficient and the document treats it as sufficient, that might be a problem, but we are only assessing the claim. If there is ambiguity, hand to human.

   4. **For Normative Claims (C)**:
      These are about design goals (e.g., maintainability, fairness).

      Step C1: **Operationalization Test**:
          Ask: "Is the normative property (e.g., maintainability) defined in terms of observable or measurable properties of the system? (e.g., 'maintainability' might be defined as 'ease of fixing bugs' and measured by time-to-fix)."

          - If it is not operationalized, then it is vague and might be just a value statement.

      Step C2: **Mechanism Test**:
          Ask: "Does the design document specify a mechanism by which the design achieves the normative property? (e.g., the module boundary reduces coupling, which in turn makes it easier to change one module without affecting others)."

          - If there is a clear mechanism, then the claim is more than just a wish.

      Step C3: **Counterfactual Test for Design**:
          Ask: "If the design element (e.g., the module boundary) were absent, would the normative property (e.g., maintainability) be compromised? And is the design element the primary reason for the property?"

      Verdict for Normative Claim:
          - If the claim is operationalized (C1) and has a mechanism (C2), then it is load-bearing.
          - If it is vague and without a mechanism, then it is commentary (because it doesn't guide implementation or verification).
          - However, note: normative claims often express values. If the claim is about a design goal that the team has agreed upon, it might still belong in the document even if it's not "load-bearing" in a causal sense. But the procedure must be strict: if it fails C1 and C2, then we mark as commentary? Or we might hand to human because it's about values.

          Revised: Since normative claims are about what the team values, if they are not operationalized and without a mechanism, they are not engineering facts. But they might still be important as design goals. Therefore, we might have two outcomes:
            - If operationalized and with mechanism: load-bearing.
            - Else: hand to human (because it's about values and priorities, which require human judgment).

   5. **General Step for All Claims**: 
      After type-specific steps, we have a final check:

      Step 5: **Epistemic Role Test**:
          Ask: "Is this claim used in subsequent reasoning in the document? For example, does it support a later design decision, or is it used to explain an invariant, or to justify a test case?"
          - If the claim is used in reasoning, then it is load-bearing regardless of the above (because it is doing work in the document). If it is not used, then it might be isolated commentary.

          This step might override the previous verdict.

   6. **Verdict**:
      - Load-bearing: include in the document as a fact.
      - Commentary: mark as such (e.g., in a sidebar or appendix) because it is a helpful redescription for humans but not essential.
      - Unsettled: hand to a named human (e.g., the lead architect or product owner) for a decision based on values.

   Failure modes and judgment calls:

     - Judgment calls: 
          * Triage step: determining the type might be ambiguous.
          * Counterfactual tests: imagining the counterfactual might be subjective.
          * Multiple realizability: what counts as a different substrate? 
          * Operationalization: what counts as a measurable property?

     - Failure modes:
          * A genuine load-bearing claim might be marked as commentary if the tests are applied too strictly (e.g., if the counterfactual is not imagined correctly).
          * The procedure might be used as a weapon: e.g., substrate people might always argue that the screening off test fails the high-level claim, or the high-level camp might always appeal to multiple realizability.
          * The procedure might systematically get wrong claims that are about emergent properties or complex systems where causality is distributed.

     - Classes of claims it might get wrong:
          * Claims about holistic properties (e.g., "the simplicity of the design") that are not easily operationalized.
          * Claims about historical reasons (why a decision was made) that are not about the current design.
          * Claims that are both causal and normative (e.g., "the module boundary caused the code to be maintainable" is both causal and normative).

   Now, we run the procedure on three examples.

   Example 1: Claim from an agent design document.
     Claim: "The model has a persistent concept of plurality, and that concept is why it produces the plural form."

     Triage: This is a causal claim (A). It says the concept of plurality causes the plural form.

     Step A1: Counterfactual Test.
          Counterfactual: If the concept of plurality were absent, would the model still produce the plural form?
          How: We can imagine a model without a persistent concept of plurality (e.g., one that only uses surface patterns). Would it still produce the plural form in the same contexts? If the model without the concept fails to produce the plural form in cases where the concept is needed, then the concept is causal.

          Answer: Likely yes, the concept is causal. Without it, the model might not handle novel plural forms correctly.

     Step A2: Screening Off Test.
          If we fix the activation patterns (substrate), does varying the concept (high-level) change the output? 
          Note: The concept is realized by the activation patterns. So if we fix the activations, the output is fixed. But that doesn't mean the concept is epiphenomenal because the concept is what the activations represent. This step might be problematic for representational claims.

          We might skip to Step A3.

     Step A3: Multiple Realizability Test.
          Could the concept of plurality be realized by different activation patterns? Yes (e.g., in different neural architectures, or even in a symbolic system). And would the plural form still be produced? Yes, as long as the concept is present.
          Conversely, could the same activation patterns be interpreted as a different concept and still lead to the plural form? Probably not, because the interpretation of the activation patterns as a concept of plurality is what matters for producing the plural form.

          So the high-level property (the concept) is multiply realizable and causally relevant.

     Step 5: Epistemic Role Test.
          Is the claim used in the document for further reasoning? For example, does it explain why the agent handles certain cases? Let's assume it is.

     Verdict: Load-bearing.

   Example 2: Claim from a post-incident review.
     Claim: "Leader election is what prevented a split-brain during the network partition."

     Triage: Causal claim (A).

     Step A1: Counterfactual Test.
          Counterfactual: If leader election had not been in place, would a split-brain have occurred? 
          Answer: Yes, without leader election, multiple nodes might have acted as leaders, causing split-brain.

     Step A2: Screening Off Test.
          If we fix all the messages and states during the incident, does changing the protocol (but keeping the same messages) change the outcome? 
          Note: The messages are a result of the protocol. If we change the protocol (to one without leader election) but force the same messages, that might not be possible. But if we could, then the same messages might not make sense (e.g., without leader election, the messages might be interpreted differently). 
          Alternatively: Once the messages are fixed, the outcome is fixed. The protocol doesn't change the outcome if the messages are the same. But the protocol caused the messages.

          This step is tricky. We might say the substrate (messages) screens off the protocol.

          However, we have Step A3.

     Step A3: Multiple Realizability Test.
          Leader election can be implemented in multiple ways (with different message patterns). In all implementations, it prevents split-brain. The function (leader election) is what matters, not the exact messages.

          Also, the same message pattern might occur in a system without leader election (e.g., by accident) and that might lead to split-brain? Actually, without leader election, the same message pattern might not prevent split-brain because there's no coordination. So the high-level property (leader election) is essential.

     Verdict: The claim passes A1 and A3. Therefore, load-bearing.

   Example 3: Your pet claim.
     Claim: "The module boundary is what makes this codebase maintainable, and maintainability is a property of the boundary rather than of the many small decisions on either side of it."

     Triage: This is both normative (about maintainability) and causal (the boundary causes maintainability). We'll treat it as primarily causal? Or normative? Let's break it:

          Part 1: "The module boundary is what makes this codebase maintainable" -> causal.
          Part 2: "maintainability is a property of the boundary rather than ..." -> constitutive?

          Since the core is about causation (the boundary causing maintainability), we'll start with causal.

     Step A1: Counterfactual Test.
          If the module boundary were absent, would the codebase be less maintainable? 
          Answer: Probably yes. Without boundaries, changes might ripple through the system.

     Step A2: Screening Off Test.
          If we fix all the small decisions (the substrate: the code on both sides, the functions, variables, etc.), then does varying the boundary (while keeping the small decisions fixed) change maintainability? 
          Note: The module boundary is an organization of the small decisions. If we remove the boundary (by, say, merging the modules) but keep the code the same, then the code becomes harder to maintain because there is no separation. So even with the same code, the organization (boundary) matters.

          This suggests that the boundary is not screened off by the small decisions.

     Step A3: Multiple Realizability Test.
          Could the same module boundary (as a concept) be realized by different small decisions? Yes (e.g., different implementations inside the modules). And would maintainability be preserved? Yes, as long as the boundary is respected.
          Conversely, could the same small decisions be organized without the boundary and still have the same maintainability? No, because without the boundary, the code is entangled.

     So the causal claim passes.

     But note: the second part says maintainability is a property of the boundary rather than the small decisions. This is a constitutive claim? 

          Step B1: Necessity Test.
              Is the boundary necessary for maintainability? Not always (one could have a well-structured monolith without clear boundaries? but that's a boundary of a different kind). However, the claim is about this codebase.

          Step B2: Sufficiency Test.
              Is the boundary sufficient? Probably not, because bad code inside a module can still make it hard to maintain.

          Step B3: Operational Relevance Test.
              The boundary is used in reasoning about changes, so it is operationally relevant.

          But the claim says maintainability is a property "of the boundary rather than of the many small decisions". This is an overstatement. The small decisions matter too. Without good small decisions, the boundary alone doesn't make the code maintainable.

          Therefore, the claim as stated might be too strong.

     Step 5: Epistemic Role Test.
          If the claim is used to justify keeping the boundary, then it is doing work.

     However, the claim says "rather than of the many small decisions". This part is problematic because the small decisions do matter. The procedure might catch this in Step A2: when we fixed the small decisions and removed the boundary, maintainability suffered. But if we fix the boundary and vary the small decisions (making them poor), then maintainability would suffer too. So the small decisions are also causal.

     Therefore, the claim that maintainability is a property "of the boundary rather than of the many small decisions" is false. The verdict for the causal part (the boundary is a cause) is load-bearing, but the "rather than" part is commentary or even misleading.

     Verdict: 
          The first part (the boundary makes the codebase maintainable) is load-bearing.
          The second part (rather than the small decisions) is not supported and should be marked as commentary (or revised).

     How the procedure damages your claim: 
          Step A2 (screening off) and Step A3 (multiple realizability) show that both the boundary and the small decisions matter. The counterfactual test for the small decisions would also show that if the small decisions were bad, maintainability would be poor even with the boundary. Therefore, the claim that maintainability is solely due to the boundary is too strong.

   What the procedure cannot do:

     - It cannot resolve deep philosophical disputes (e.g., about the nature of causation or reductionism) in an engineering context. It is a pragmatic tool.

     - It might not handle emergent properties well, where the high-level property arises from complex interactions and cannot be pinned to one element.

     - It cannot replace domain expertise: some causal links are known only through experience.

     - It might be misapplied to claims that are metaphorical or aspirational.

     - It does not address the social aspects of design documents (e.g., what motivates the team).

     - It might not capture the historical context of a decision.

     - It is not a substitute for testing: a claim that passes the procedure might still be false in reality.

   We now write the procedure as a flowchart-like set of steps.

   Due to the complexity, we present the procedure in a step-by-step manner for the reviewer.

   Note: Use British English.

  ---

  **Procedure for Evaluating a High-Level Claim in a Design Document**

  **Step 0: Preparation**
     - Isolate the claim. Write it down in one sentence.

  **Step 1: Triage the Claim**
     - Read the claim and choose the primary type:
          A. **Causal Claim**: It explains why something happened or what causes a property. (Keywords: "prevents", "causes", "why", "leads to".)
          B. **Constitutive Claim**: It defines what something is or what properties are essential to an entity. (Keywords: "is", "defines", "invariant", "property of".)
          C. **Normative Claim**: It states a design goal or desirable property. (Keywords: "should", "maintainable", "fair", "efficient".)

     If the claim fits more than one type, choose the dominant one. If unsure, note the ambiguity and proceed cautiously.

  **Step 2: Apply Type-Specific Tests**

    **For a Causal Claim (A):**
      - A1: **Counterfactual Test**
          - Ask: "If the high-level property (e.g., leader election) had not been present, but the system was otherwise as similar as possible, would the outcome (e.g., preventing split-brain) have been different?"
          - If yes → proceed to A3.
          - If no → the claim might be commentary (go to Step 3 with tentative verdict: commentary).
          - If unsure → proceed to A3.

      - A3: **Multiple Realizability Test**
          - Ask: "Could the same high-level property be implemented with a different substrate (e.g., different messages, states) and still cause the same outcome? And could the same substrate events (without the high-level property) be interpreted as a different high-level property and still lead to the outcome?"
          - If the high-level property can be realized in multiple ways and is necessary for the outcome → the claim is load-bearing (go to Step 3 with tentative verdict: load-bearing).
          - If the outcome is tied to the specific substrate and the high-level property is just a label → the claim is commentary (go to Step 3 with tentative verdict: commentary).
          - If unsure → the claim is unsettled (hand to human).

      Note: Step A2 (screening off) is skipped in this version because it is often too strict and is covered by A1 and A3.

    **For a Constitutive Claim (B):**
      - B1: **Necessity Test**
          - Ask: "If the property were absent, would the entity cease to be what it is (e.g., without FIFO, is it still a queue)?"
          - If yes → proceed to B3.
          - If no → the claim might be commentary (go to Step 3 with tentative verdict: commentary).

      - B3: **Operational Relevance Test**
          - Ask: "Is the property used in the document to reason about the system's behaviour, correctness, or other properties? (e.g., is the invariant used in a proof or to explain a design choice?)"
          - If yes → the claim is load-bearing (go to Step 3 with tentative verdict: load-bearing).
          - If no → the claim is commentary (go to Step 3 with tentative verdict: commentary).

    **For a Normative Claim (C):**
      - C1: **Operationalization Test**
          - Ask: "Is the normative property (e.g., maintainability) defined in measurable terms? (e.g., 'maintainability is measured by the number of bugs introduced per change.')"
          - If yes → proceed to C2.
          - If no → the claim is unsettled (hand to human) because it is a value statement without engineering specifics.

      - C2: **Mechanism Test**
          - Ask: "Does the design document explain how the design element (e.g., module boundary) achieves the normative property? (e.g., 'the boundary reduces coupling, which reduces the chance that a change in one module affects another.')"
          - If yes → the claim is load-bearing (go to Step 3 with tentative verdict: load-bearing).
          - If no → the claim is commentary (go to Step 3 with tentative verdict: commentary) because it is an unsubstantiated goal.

  **Step 3: Final Check (Epistemic Role Test)**
     - Ask: "Is the claim used elsewhere in the document to support a design decision, explain behaviour, or guide implementation?"
          - If yes, then upgrade the tentative verdict to load-bearing (if it wasn't already) because the claim is doing work in the document.
          - If no and the tentative verdict was commentary, leave as commentary.
          - If no and the tentative verdict was load-bearing, you may keep it as load-bearing but note that it stands alone.

     Note: This step can override a commentary verdict from earlier steps if the claim is used in reasoning.

  **Step 4: Render Verdict**
     - **Load-bearing**: The claim is essential and should remain as a statement of fact.
     - **Commentary**: The claim is a helpful redescription for humans but not essential. Mark it as such (e.g., as an aside).
     - **Unsettled**: The claim requires human judgment (e.g., about design values). Assign to a named person (e.g., the lead architect) for a decision.

  **Failure Modes and Limitations**
     - **Judgment Calls**: Triage and tests (especially counterfactuals and multiple realizability) require judgment. Encourage reviewers to write down their reasoning.
     - **Weaponization**: To prevent either camp from misusing the procedure, require that both camps agree on the answers to the test questions. If not, mark as unsettled and hand to human.
     - **False Negatives**: A genuine load-bearing claim might be marked commentary if the tests are applied too strictly. When in doubt, hand to human.
     - **False Positives**: A commentary claim might be marked load-bearing if it passes the tests but is actually not essential. The final check (Step 3) helps by requiring that the claim is used in the document.
     - **Systematic Blind Spots**: 
          - Claims about emergent properties (e.g., "the system is resilient") might not fit.
          - Claims that are inherently about values (e.g., "the design is elegant") without operationalization.
          - Claims that are historical (why a decision was made) rather than about the current design.

