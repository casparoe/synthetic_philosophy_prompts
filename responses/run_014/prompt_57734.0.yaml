answer: |-
  ### Decision Procedure for High-Level Claims in Design Documents  
  **Purpose**: To triage high-level claims into one of three verdicts:  
  1. **Load-bearing** (essential for understanding/design).  
  2. **Commentary** (descriptive but reducible to substrate).  
  3. **Unsettled** (requires human judgment on values).  

  **Procedure Rules**:  
  - Complete within 5 minutes per claim.  
  - Answer questions sequentially; terminate early if verdict is clear.  
  - **Judgment calls** are explicitly flagged.  
  - **Failure modes**:  
    - Over-reductionism (genuine emergent properties misclassified as commentary).  
    - Weaponisation (substrate/high-level camps cherry-picking steps).  
    - Systematic errors with *holistic properties* (e.g., "simplicity") or *historical context*.  

  ---

  ### Step-by-Step Procedure  
  #### **Step 1: Triage Claim Type**  
  *Is the claim primarily:*  
  - **Causal** (explains *why* an outcome occurred)?  
  - **Constitutive** (defines *what something is*)?  
  - **Normative** (states *how things should be*)?  

  *How to decide*:  
  - Causal: Uses "because", "prevents", "causes".  
  - Constitutive: Uses "is", "defines", "invariant".  
  - Normative: Uses "should", "fair", "maintainable".  
  *Judgment call: Ambiguous claims default to causal.*  

  #### **Step 2: Apply Type-Specific Tests**  
  **A. Causal Claims** (e.g., "Leader election *prevented* split-brain")  
  1. **Counterfactual Test**:  
     - *Question*: "If the high-level property (e.g., leader election) were absent, but the substrate (e.g., messages/states) were as similar as possible, would the outcome change?"  
     - *Sufficient answer*:  
       - "Yes" → Proceed to test 3.  
       - "No" → Tentative verdict: **commentary** (epiphenomenal).  
     - *Judgment call*: Defining "as similar as possible" (e.g., same nodes but no election protocol).  

  2. **Screening-Off Test**:  
     - *Question*: "If we fix the substrate (e.g., exact message sequence), does varying the high-level property change the outcome?"  
     - *Sufficient answer*:  
       - "Yes" → Proceed to test 3.  
       - "No" → Tentative verdict: **commentary** (substrate screens off high-level).  

  3. **Multiple Realisability Test**:  
     - *Question*: "Could the same high-level property (e.g., leader election) be realised by a different substrate (e.g., Raft vs. Paxos) and still cause the outcome? Conversely, could the same substrate realise a *different* high-level property with the same outcome?"  
     - *Sufficient answer*:  
       - "Yes to first, no to second" → Verdict: **load-bearing**.  
       - "No" → Verdict: **commentary**.  
     - *Judgment call*: Whether substrate variations are materially different.  

  **B. Constitutive Claims** (e.g., "This invariant *defines* the queue")  
  1. **Necessity Test**:  
     - *Question*: "If the property (e.g., FIFO ordering) were removed, would the entity (e.g., queue) cease to exist or fundamentally change?"  
     - *Sufficient answer*:  
       - "Yes" → Proceed to test 2.  
       - "No" → Tentative verdict: **commentary**.  

  2. **Operational Relevance Test**:  
     - *Question*: "Is this property *used* to derive behaviour, constraints, or other properties in the document?"  
     - *Sufficient answer*:  
       - "Yes" → Verdict: **load-bearing**.  
       - "No" → Verdict: **commentary**.  

  **C. Normative Claims** (e.g., "The design *should be* maintainable")  
  1. **Operationalisation Test**:  
     - *Question*: "Is the property (e.g., maintainability) defined in measurable terms (e.g., 'changes require ≤ 2 file edits')?"  
     - *Sufficient answer*:  
       - "Yes" → Proceed to test 2.  
       - "No" → Tentative verdict: **unsettled** (values judgment).  

  2. **Mechanism Test**:  
     - *Question*: "Does the document specify *how* the design achieves the property (e.g., 'module boundaries localise change impacts')?"  
     - *Sufficient answer*:  
       - "Yes" → Verdict: **load-bearing**.  
       - "No" → Verdict: **commentary** (unsubstantiated aspiration).  

  #### **Step 3: Final Triage**  
  - If verdict is still ambiguous → **Unsettled** (assign to named human).  
  - If claim is **load-bearing** but unused in the document’s reasoning → Downgrade to **commentary**.  

  ---

  ### Case Evaluations  
  #### **Case 1: Agent Plurality Concept**  
  *Claim*: "The model has a persistent concept of plurality, and that concept is why it produces the plural form."  
  *Substrate counter*: "Only activation patterns exist; 'concept' is inert."  

  1. **Triage**: Causal (claims "concept" *causes* behaviour).  
  2. **Counterfactual Test**:  
     - *Q*: Without a plurality concept (but similar activations), would plural forms still be produced?  
     - *A*: **No** – if activations rely on the concept (e.g., novel plurals fail without it).  
  3. **Multiple Realisability Test**:  
     - *Q*: Could different activations realise the same concept? **Yes** (e.g., in different network architectures).  
     - *Q*: Could the same activations realise a non-plurality concept? **No** (if activations encode plurality uniquely).  
  4. **Verdict**: **Load-bearing** (concept is multiply realisable and causally efficacious).  

  #### **Case 2: Leader Election Prevents Split-Brain**  
  *Claim*: "Leader election prevented split-brain during the network partition."  
  *Substrate counter*: "Only message arrivals mattered; 'election' adds nothing."  

  1. **Triage**: Causal.  
  2. **Counterfactual Test**:  
     - *Q*: Without leader election (same nodes/message timing), would split-brain occur?  
     - *A*: **Yes** (e.g., multiple nodes accept writes).  
  3. **Screening-Off Test**:  
     - *Q*: If messages are identical, does calling it "election" or "random selection" change the outcome?  
     - *A*: **No** → Tentative verdict: commentary.  
  4. **Multiple Realisability Test**:  
     - *Q*: Could different message patterns (e.g., Raft vs. Bully algorithm) prevent split-brain via leader election? **Yes**.  
     - *Q*: Could identical messages occur without leader election and prevent split-brain? **No** (e.g., coincidental harmony is unstable).  
  5. **Verdict**: **Load-bearing** (election is a multiply realisable cause).  

  #### **Case 3: Module Boundaries Enable Maintainability**  
  *Claim*: "The module boundary is what makes this codebase maintainable, and maintainability is a property of the boundary rather than small decisions."  

  1. **Triage**: Normative (claims maintainability is *achieved by* the boundary).  
  2. **Operationalisation Test**:  
     - *Q*: Is "maintainability" measured? (e.g., "time to add a feature").  
     - *A*: **Unspecified** → Tentative verdict: unsettled.  
  3. **Mechanism Test**:  
     - *Q*: Does the document explain *how* boundaries enable maintainability?  
     - *A*: **Yes** (e.g., "decouples logic"). Proceed with causal tests (since claim blends normative/causal).  
  4. **Counterfactual Test** (causal lens):  
     - *Q*: Without boundaries (same code), would maintainability decrease?  
     - *A*: **Yes** (changes would propagate).  
  5. **Multiple Realisability Test**:  
     - *Q*: Could different "small decisions" realise the same boundary? **Yes** (e.g., varying implementations).  
     - *Q*: Could identical small decisions without boundaries yield maintainability? **No** (entanglement increases complexity).  
  6. **Final Triage**:  
     - Claim that maintainability is *solely* from boundaries (not small decisions) fails → **Partial commentary**.  
     - Boundary’s causal role is **load-bearing**; the exclusivity claim is **commentary**.  

  *Why you’ll dislike this*: Step 2 (Operationalisation) and Multiple Realisability exposed overreach. Boundaries are causal, but small decisions matter too. The word "rather than" conflates correlation with exclusive causation.  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve values disputes**: Normative claims without operationalisation default to "unsettled". The procedure doesn’t arbitrate what "should" be.  
  2. **Handle emergent properties**: Holistic qualities (e.g., "resilience emerges from interactions") may be misclassified as commentary.  
  3. **Capture historical context**: Claims about why a decision *was made* (not its current role) are out of scope.  
  4. **Replace testing**: A verdict of "load-bearing" doesn’t mean the claim is *true*, only that it’s irreducible.  
  5. **Solve philosophy**: It dodges hard reductionism vs. emergence debates by prioritising tractability.  

  **Output**: Use this procedure to force clarity—not to "win" arguments. When consensus fails, escalate to humans.
