answer: |-
  ## The Half-Built House

  The plaster cracks where wires hang exposed,
  Dust thick on books abandoned in the gloom.
  **What's spent is spent, let future costs decide.**
  The blueprint's faded, purpose long deposed,
  By compromises crowding every room.
  The plaster cracks where wires hang exposed.

  A decade's wages? Time that I'd proposed?
  Just numbers drowned in this relentless tomb.
  **What's spent is spent, let future costs decide.**

  That half-laid floor, the promise once disclosed,
  Now mocks the effort, sealing deeper doom.
  The plaster cracks where wires hang exposed.

  The path ahead? More funds must be transposed
  To chase a fading vision through the loom.
  **What's spent is spent, let future costs decide.**

  But walking now feels like a door foreclosed
  On who I meant to be. This stark resume
  (The plaster cracks where wires hang exposed)
  **What's spent is spent? Let future costs decide...**
  **...But this life requires policy to bind the will.**

  **(The final choice: To walk, or build it still?)**

  ---

  **Annotations & Form as Philosophy:**

  1.  **Refrains & Sunk Cost Debate:**
      *   **"What's spent is spent, let future costs decide.":** The orthodox economist's stance. Past investments (money, years) are irrelevant ("sunk"); only *future* expenditures and potential future benefits matter rationally. This refrain dismisses the past.
      *   **"But this life requires policy to bind the will.":** The commitment argument. It frames completion as a *personal policy* or self-binding rule against weakness of will. The value lies in *being the kind of person who finishes*, upholding integrity and discipline across life, even if this single project seems irrational now. This is the "philosophically serious" pro-sunk-cost position, avoiding sentimentality for agency/policy.

  2.  **Villanelle Form as Enactment:**
      *   **Irresistible Return:** The fixed refrains mirror sunk costs – they *cannot* be discharged. No matter how logically the first refrain dismisses the past (A1), the second refrain (A2) asserting the binding policy *always* returns. This embodies the psychological tug-of-war.
      *   **Convergence = Decision:** The final couplet brings both refrains together for the first time. The question mark after the economist's line shows its dominance weakening. The policy line answers it, asserting itself not just as a feeling, but as a *decision* ("But this life *requires*..."). The closing couplet *is* the moment of choosing commitment, crystallized by the form's pressure.

  3.  **Accessibility:**
      *   **Economics Savvy:** Readers familiar with escalation/commitment literature will instantly recognize A1 as the "rational" marginal cost/benefit view and A2 as the pre-commitment, identity-based argument against quitting. They'll see A2 presented seriously.
      *   **General Reader:** The concrete imagery (cracked plaster, dusty books, half-laid floor) evokes the tangible mess of an unfinished project. The struggle between letting go (A1) and the deep, almost existential need to see it through (A2, "who I meant to be") resonates universally with anyone paralyzed by a long-stalled endeavour. The final couplet feels like the inevitable, wrenching choice to continue.

  The villanelle's relentless structure perfectly traps the speaker in the debate, forcing the refrains – like the sunk costs themselves – into unavoidable confrontation, culminating in the policy winning out as the core identity decision.
