prompt: |-
  ugh so i got voluntold to cover the utlity monster in my intro ethics discussion section next tuesday, 50 mins with like 20 freshmen who only kinda rember utilitarianism from lecture as do the most good or whatever

  dont explain it to me, help me plan how to teach it. like whats the dependency chain here, what needs to click first before the thought experiment even hits and why, what falls apart if i do it out of order

  i was thinking of anchoring everything on this dumb made up case where three roommates pool grocery money and one of them gets insane bliss from junk food like way more per dollar than the other two combined, so maximizing total happiness says feed him everything even though it feels gross. would that carry it or does it let them handwave it as just weird biology. spell out what the main example needs to do and what trap it needs to avoid

  also what are the predictable wrong takes and exactly when do i head each one off. im guessing half will hear monster and picture just a greedy rich dude hoarding stuff, and someone will say well just split everything equal and utilitarianism is fixed. how do i block those without derailing the flow

  finish me with a quick twist question i can drop in the last five minutes to tell if they actually got the interpersonal tradeoff point instead of just parroting, and tell me what to explicitly say im leaving out because theres no way to do it in 50 mins
reasoning: |-
  Okay, let me tackle this TA's request for teaching the utility monster. They need a battle plan for 50 minutes with freshmen who have shaky utilitarian foundations. 

  First, I need to diagnose why this thought experiment exists - it's not about biology but about testing utilitarianism's core commitment to maximizing total utility regardless of distribution. The dependency chain is crucial: students must first solidly grasp that utilitarianism 1) quantifies happiness, 2) sums it across people, and 3) demands we maximize that sum regardless of fairness. 

  The roommate scenario is clever but risky. To avoid the "weird biology" handwave, I should emphasize the monster's extreme efficiency at converting resources to utility. Maybe add a twist where the monster isn't even human to prevent anthropomorphism. The key is making them see this isn't about appetite but about mathematical inevitability under strict utilitarianism.

  Predictable misunderstandings: 
  - Half will confuse "monster" with greed. Solution: Preemptively define it as a utility-generating machine. 
  - Someone will suggest equality as fix. Need to lock in that utilitarianism cares about sums, not fairness. Should prepare a killer counterexample like "But if equality reduces total utility, should we still do it?" 

  For the twist question at the end: Present a modified scenario where taking $10 from each roommate gives the monster $200 worth of joy while causing minor irritation to others. The utility math is clear, but the ethical discomfort should linger. Watch who squirms - that's the tradeoff clicking.

  Must explicitly state we're bracketing: 
  - Rule utilitarianism 
  - Measurement problems 
  - Rights-based objections 
  Otherwise we'll drown in tangents. 

  Timing breakdown: 
  First 10 min: Utilitarianism refresher with emphasis on aggregation 
  Next 15: Roommate scenario with guided calculations 
  10 min: Monster reveal and implication drill 
  10 min: Predictable objections clinic 
  Last 5: Twist question reveal 

  The tightrope walk: Keep them uncomfortable with the conclusion without letting them escape into "but this wouldn't happen." Need to hammer: Under pure utilitarianism, this is logically required.
answer: |-
  Here’s a battle-tested lesson plan for the utility monster, optimized for 50 minutes with intro students. Anchor the core dilemma early, block handwaves, and force the tradeoff into focus.

  **Dependency Chain & Order (CRITICAL):**  
  1. **Utilitarianism Refresher (10 mins)**  
     - **What MUST click:** Utilitarianism *only* cares about **maximizing total aggregate happiness/utility**. It is *not* about fairness, equality, rights, or intentions.  
     - **How to cement it:**  
       - Quick hypothetical: "Should we spend $1000 on a lifesaving surgery for one person, or 1000 $1 ice creams for 1000 people? *Calculate total utility*."  
       - Emphasize: **"Add up all units of happiness. Bigger number wins. No other rules."**  
     - **Trap to avoid:** Don’t let "everyone deserves happiness" slide. Utilitarianism can demand immense sacrifice from some for greater total gains.

  2. **The Roommate Scenario (15 mins)**  
     - **Setup:** Three roommates pool $60 for shared groceries.  
       - Alex: Gains **1 util** per dollar on healthy food.  
       - Sam: Gains **1 util** per dollar on healthy food.  
       - Jordan: Gains **10 utils** per dollar on junk food (insane biological efficiency).  
     - **Q1:** "How should we split the money to maximize *total* utility?"  
       - *Math:* Give Jordan $60 → 600 utils. Split evenly → Jordan: $20 → 200 utils + Alex/Sam: $20 each → 20 utils each = **240 utils total.**  
       - **Punchline:** Utilitarianism says *all money to Jordan*. Alex/Sam get nothing.  
     - **Why this works:**  
       - Relatable, no sci-fi.  
       - Jordan’s efficiency is the key variable (not greed!).  
       - **Block the "weird biology" handwave:** "It doesn’t *matter* why Jordan converts resources efficiently. Utilitarianism only cares about the output."  

  3. **Introduce the Utility Monster (15 mins)**  
     - **The Pivot:** "Jordan isn’t just efficient—they’re a **utility monster**. They gain *1000 utils* per dollar, while everyone else gains 1 util per dollar."  
       - *Math:* $60 to Monster = 60,000 utils. $1 to Monster + $59 split = 1000 + 59 utils = **1059 utils.**  
     - **Q2:** "Does utilitarianism still say all money goes to the Monster? Why/why not?"  
       - *Force the conclusion:* **Yes.** Total utility is astronomically higher.  
     - **Predictable Wrong Takes & Preemptive Strikes:**  
       - **"But it’s unfair!" →** "Is fairness part of utilitarianism? *[No!]* What’s the only goal? *[Max total utility!]*"  
       - **"Just split equally" →** "Calculate the total utils if we split $60 three ways. *[20 utils each → 60 utils total]* Now compare to giving it all to the Monster. *[60,000 > 60]*. Does equality maximize utility?"  
       - **"Monster is greedy/selfish" →** "The Monster isn’t *choosing* to be efficient—it’s a fact about how they generate utility. Does motive matter?"  
       - **"We can’t measure utility!" →** "Assume we *can* measure it precisely for this scenario. Does the *logic* of utilitarianism still demand feeding the Monster?"  

  4. **The Twist Question (Last 5 mins)**  
     - **Test Comprehension:** "Imagine the Monster needs *only $1* to survive and gain 1000 utils. Alex needs $60 for a life-saving surgery (60 utils). Sam needs $60 for their dream vacation (60 utils). We have $60. What does utilitarianism say we *must* do? Why does this feel revolting?"  
     - **Why it works:** Forces them to confront that utilitarianism sacrifices basic needs/equality for marginal gains when efficiency disparities are extreme. If they say "give $1 to Monster, $59 to Alex/Sam", they missed the point—Monster gets the $1 *first*, dooming Alex/Sam.  

  **What You Explicitly Leave Out (Announce This!):**  
  - *"We’re focusing only on classical act utilitarianism. We aren’t discussing rule utilitarianism, preference utilitarianism, or how to measure utils in real life. Those are valid critiques, but today is about pressure-testing the core principle: maximize total utility."*  

  **Why This Flow Works:**  
  1. The roommate case isolates efficiency disparities without sci-fi.  
  2. Math makes the tradeoff undeniable.  
  3. Blocking "fairness" early prevents derailment.  
  4. The twist question exposes the horrific edge case *using the same logic* as the initial example.  

  **Pro Tip:** Draw a big "TOTAL UTILITY" meter on the board. Fill it dramatically higher when the Monster gets resources. When objections arise, point to the meter: "But does this give us more *total*?" Hammer aggregation until it hurts.
