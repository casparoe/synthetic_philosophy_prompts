prompt: |-
  Quick context: I share a house with three other guys, and for months we've had this recurring standoff where some chore needs doing (trash, dishes, whatever) and each of us individually decides whether to just do it or wait and hope someone else caves. Last month I read Hofstadter's Metamagical Themas stuff, the superrationality idea and the Luring Lottery experiment he ran in the magazine, and it honestly felt like it was written for me. The way I understand it: if you're in a symmetric dilemma with people who reason the way you do, you can treat your own decision as a sample of what everyone's deciding, so you should pick the move that's best when everyone like you picks it, instead of the game-theory move. So last week the kitchen was a disaster and I thought, the other three are basically facing the same situation I am and we all think roughly alike, so if I decide not to clean they'll decide not to clean too, and we're stuck in the defect-defect box. So I cleaned. Kitchen's clean. Felt like the system works.

  Here's where it gets personally urgent. Me and another guy at work both put in for the same promotion, and the decision on who gets extra training slots etc. lands next month. I've been trying to run it the superrational way: whatever I do (study nights and weekends for the cert, going to the boss directly, whatever), he'll do the same thing, so I should pick the strategy that's best for both of us when we both do it. But my coworker is not a copy of me — different background, he's got kids so no weekend studying, and honestly he's more cutthroat than I am. So my question is: what's the actual cutoff? Like, how much do two people have to be alike, in reasoning style or situation, before superrationality kicks in and becomes valid? Is it something you can estimate, like a similarity score, where above it I should reason as if we'll mirror eachother and below it I fall back to normal game theory? And in the promotion case, does it even apply, since only one of us can win — if superrational reasoning says we'd both pick the same strategy, does that mean we should both pick "go all out," or both pick "split the effort," or does the whole thing break when the game is zero-sum?

  I guess what I really want is a practical way to use this. If I could put even a rough number on the similarity threshold I could apply it to alot of stuff in my life — the chores, the promotion, even group buys with my roommates. Does anyone know if there's a worked-out version of this, like a sliding scale between fully rational and fully superrational? Or am I maybe drawing the line in the wrong place, and the question isn't similarity at all?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're dealing with two main scenarios: household chores with roommates and a promotion competition at work. They've applied Hofstadter's superrationality concept to the chores successfully but are unsure how to apply it to the promotion situation where the coworker is different.

  First, I need to recall what superrationality entails. Hofstadter's idea is about symmetric dilemmas where all players reason the same way. By treating your decision as a sample of others', you choose the action that's best if everyone does the same. The user cleaned the kitchen assuming roommates think alike, and it worked. But the promotion scenario is asymmetric—different situations, motivations, and possibly reasoning styles. So the core issue is applicability when symmetry breaks.

  The user is asking for a "similarity threshold." They want a practical, maybe quantifiable way to decide when to use superrationality vs. game theory. But is similarity measurable? Factors like shared reasoning, identical payoffs, symmetry in options, and communication matter. In the chores case, roommates likely have similar stakes and options, plus repeated interactions. The promotion is zero-sum, payoffs differ (coworker has kids, more competitive), and no symmetry. So superrationality might not apply here.

  The user might be seeking reassurance that their approach isn't flawed. They succeeded with chores but are struggling with work. They need validation that different strategies fit different contexts. Also, deeper needs: reducing cognitive load in decision-making, finding reliable heuristics for life conflicts, and understanding when cooperation is feasible versus when competition is necessary.

  Next, the zero-sum aspect. Superrationality works best in non-zero-sum games like chores where mutual cooperation benefits all. Promotion is win-lose; mutual defection or competition is inevitable. Even if both study hard, only one wins. So traditional game theory, like Nash equilibrium, is more appropriate here.

  What about a sliding scale? While there's no formal similarity score, the user can assess key factors. For example, if reasoning alignment is high and payoffs symmetric, superrationality is viable. If not, lean towards game theory. In the promotion case, the differences in personal circumstances and competitiveness suggest low alignment. The user should compete but ethically, avoiding destructive actions.

  Practical advice: Use superrationality when conditions are met—repeated interactions, symmetric players, communication possible. Otherwise, default to game theory. For the promotion, focus on individual merit, document achievements, and maybe communicate with the coworker if collaboration in other areas is possible. But given the competition, direct cooperation on the promotion isn't feasible.

  The user might also need help accepting that not all dilemmas fit one framework. Flexibility in approach is key. They can apply superrationality to ongoing, cooperative situations like chores or group buys, but shift strategies in competitive, asymmetric ones like promotions.
answer: |-
  This is a brilliant and incredibly practical question – you've hit on the core tension of applying superrationality in the messy real world. Hofstadter's concept is powerful for symmetric dilemmas among "clones," but life rarely offers perfect symmetry. Let's break down the cutoff, the promotion dilemma, and how to navigate the spectrum.

  **The Core Insight & The Crucial Preconditions for Superrationality:**

  Superrationality works best when these conditions are strongly met:

  1.  **Symmetric Players:** All players face identical payoffs, options, costs, and information.
  2.  **Symmetric Reasoning:** Players truly reason the same way, valuing the same outcomes similarly and being equally likely to adopt the superrational perspective.
  3.  **Non-Zero-Sum Potential:** The game inherently allows for outcomes where *mutual* cooperation (or mutual non-defection) yields a better collective result than mutual defection. There's a Pareto improvement available through coordination.
  4.  **Clarity of Symmetry:** Players recognize the symmetry of the situation. (This is why Hofstadter often framed it as "what if everyone is a clone of me?" or "what if everyone reasons exactly like I do?").
  5.  **Simultaneity/Uncertainty:** Players must decide without knowing the others' choices, or in a way where their choice could logically be mirrored.

  **The "Similarity Threshold" - It's Fuzzy, Not a Number:**

  There isn't a formal, universally agreed-upon "similarity score" in game theory for superrationality. Instead, think of it as **assessing the strength of the symmetry assumptions**. Ask yourself these questions to gauge applicability:

  1.  **Reasoning Alignment:** How likely is it the other player(s) are familiar with/accept superrational reasoning? Do they generally think long-term, cooperatively, and value fairness similarly? (High in your chore scenario with like-minded roommates; Lower with the cutthroat coworker).
  2.  **Payoff Symmetry:** Are your costs, benefits, and alternatives *truly* identical? (High for chores: everyone suffers from mess, benefits from clean; Low for promotion: you have different costs - kids vs. no kids? - and only one gets the primary benefit).
  3.  **Option Symmetry:** Do you have exactly the same choices available? (High for chores: clean/don't clean; Medium/Low for promotion: "going to the boss" might have different risks/rewards based on your existing relationship).
  4.  **Communication/Prior Coordination:** Can you openly discuss and agree on a strategy? Superrationality often emerges *without* communication, but the *possibility* of coordination strengthens the symmetry assumption. (Possible with roommates; Likely impossible/risky with promotion rival).
  5.  **Repeat Interaction:** Is this a one-shot deal or part of an ongoing relationship? Superrationality is more robust in repeated games where reputation and future reciprocity matter. (High for chores; Low for promotion - it's a specific, likely one-time competition).
  6.  **Nature of the "Best Mutual Outcome":** Is there a clearly identifiable strategy that, if *both/all* choose it, leads to a *mutually* superior outcome compared to mutual defection? (Clear for chores: both clean = clean kitchen efficiently; Ambiguous for promotion: both "hold back" might mean neither gets it, or both go all out wastes effort for the loser).

  **Applying to Your Promotion Dilemma: Why Superrationality Likely Doesn't Apply**

  1.  **Zero-Sum Core:** This is the killer. Only one person gets the promotion/training slots. Your gain is his loss, and vice-versa. Superrationality thrives in non-zero-sum games where mutual cooperation creates value. Here, "mutual cooperation" (both holding back) likely leads to the *worst* outcome for both – neither gets the promotion, or someone less qualified does. Mutual defection (both going all out) is the expected Nash equilibrium, and often the rational choice in zero-sum.
  2.  **Asymmetry:** His kids limit his time, altering costs. His perceived "cutthroat" nature strongly violates the "symmetric reasoning" assumption. You cannot reliably assume he will mirror your decision-making process.
  3.  **No Clear "Best Mutual Strategy":**
      *   **Both Go All Out:** You both expend maximum effort. One wins, one loses. Efficient outcome *for the company*, but not mutually beneficial *for you two* – the loser wasted massive effort. This is the likely Nash equilibrium.
      *   **Both Hold Back:** Neither gets the promotion. Worst outcome for both individually and collectively (if you both wanted it).
      *   **You Hold Back, He Goes All Out:** He wins easily. You lose.
      *   **You Go All Out, He Holds Back:** You win easily. He loses.
      *   There's *no strategy* where both of you choosing the same action leads to a result better than the Nash equilibrium (both going all out) *for the individual who would have won anyway*. Superrationality struggles to find a foothold here.

  **What to Do for the Promotion (Game Theory Perspective):**

  Given the zero-sum nature and asymmetry, traditional game theory is a better guide:

  1.  **Assume Competition:** Plan for your rival to compete hard ("defect" in prisoner's dilemma terms, though the structure is different).
  2.  **Focus on Dominant Strategies:** What actions give you the best chance of winning *regardless* of what he does? Studying hard, showcasing your achievements, building a strong case with your boss are likely dominant or very strong strategies.
  3.  **Minimize Risk:** Avoid strategies that *only* work if he cooperates (e.g., holding back). The risk is too high.
  4.  **Ethical Competition:** "Going all out" doesn't mean sabotaging him. Compete fiercely but fairly on merit, preparation, and demonstrating your value.

  **The Practical Sliding Scale & When to Use Superrationality**

  Think of it as a continuum based on **strength of symmetry** and **non-zero-sum potential**:

  | **Factor** | **Strong Superrationality Zone** | **Weak/No Superrationality Zone** |
  |------------|----------------------------------|-----------------------------------|
  | **Reasoning Alignment** | High (e.g., philosophy-major roommates) | Low (e.g., known competitive coworker) |
  | **Payoff Symmetry** | Identical costs/benefits | Different stakes (e.g., parent vs. single) |
  | **Option Symmetry** | Same choices available | Different capabilities/access |
  | **Repeat Interaction** | Ongoing relationship | One-time event |
  | **Communication** | Possible and productive | Impossible or risky |
  | **Zero-Sum Nature** | Pure cooperation game | Winner-takes-all competition |

  **When Superrationality is Strong (Like Chores/Group Buys):**
  *   High symmetry on all factors.
  *   Clear mutual benefit from coordination.
  *   Apply: Do the cooperative action (clean, contribute) assuming others like you will reason the same way. Your action becomes the catalyst for the good equilibrium.

  **When Superrationality is Weak or Risky (Like Promotion):**
  *   Significant asymmetry (reasoning, payoffs, options).
  *   Zero-sum or highly competitive element.
  *   One-shot interaction.
  *   Apply: Default to standard game theory (Nash equilibrium thinking). Analyze best responses to likely opponent moves. Compete strategically. Superrationality might lead to exploitation.

  **Practical Takeaway for Your Life:**

  1.  **Assess Symmetry First:** Before applying superrationality, quickly audit the situation using the factors above (Reasoning? Payoffs? Options? Repeat? Communication? Zero-Sum?).
  2.  **Strong Symmetry + Non-Zero-Sum:** Confidently use superrationality. Your decision to cooperate *is* the rational choice, assuming others are like you. (Chores, group buys where everyone gets the item, coordinating schedules).
  3.  **Weak Symmetry or Zero-Sum:** Switch gears to standard strategic thinking (game theory). Assume others will act in their perceived self-interest, which may not mirror yours. Protect yourself, compete if necessary, look for Nash equilibria. (Promotions, bidding wars, negotiations with asymmetric power, dealing with someone known to be untrustworthy).
  4.  **The Promotion Specifically:** Treat it as a competitive, asymmetric, zero-sum situation. Go all out ethically and strategically. Do not assume your coworker will mirror your choices or reasoning. Superrationality isn't the right tool here – competitive preparation is. Good luck!

  Hofstadter's brilliance was in highlighting how *shared reasoning* can escape bad equilibria. But its power is greatest among true peers in cooperative dilemmas. When symmetry breaks or competition dominates, classical strategy becomes essential. Your insight in recognizing this boundary is spot-on.
