prompt: |-
  I'm the clinical lead on a work group that maintains the diagnostic classification our country's public child and adolescent mental health services run on — it's what decides who gets seen, what a school has to put in place, and whether a family qualifies for a disability allowance. We meet twice a year, get about twenty-five proposals a cycle, mostly new categories, and each one gets a 90-minute session. Our review template checks four things: can the criteria be applied reliably by different raters, is there evidence the category picks out a real group, does it change what a clinician would actually do, and can it be told apart from what's already in the manual. That's the whole thing. Nothing in there asks what happens to the kids once the label exists, which is the part I care about most, because I keep coming back to Hacking's point that human kinds arent like chemical kinds — classify people and they move, they talk back, they reorganise themselves around the classification, and then the category's own evidence base shifts underneath it. He had the historical cases (fugue, multiple personality, and the fact that deleting a category remakes people just as much as adding one does), but I've never seen anybody turn that into something a committee can actually run on a Tuesday morning.

  So: write us the procedure. Ordered questions, what counts as a sufficient answer to each, where it stops at "reject," where it stops at "we can't settle this, it goes to the full comittee as a values question rather than a fact question," and what would count as evidence for the looping questions given our limits — no social scientist on staff, one clinical epidemiologist who thinks all of this is untestable philosophy, and field trials that run six months maximum across about a dozen clinics. It has to handle deletions and pure renamings, not just additions. And be straight with me about which steps really follow from the theory and which ones are reasonable-sounding guesswork wearing a checklist costume, plus where the procedure will systematically misfire (my guess: rare categories, and anything that spreads through the internet faster than we can measure).

  Then run it on three live proposals.

  1. Adding "anticipatory school avoidance disorder," ages 8–15: recurrent physical complaints in the hour before school, refusal episodes at least three times a month across a term, marked relief when the school day is cancelled. I drafted this one myself. In the field trial, 41 of the 67 labelled kids were using the manual's own vocabulary to describe themselves at six-month follow-up, 9 of them said they'd started answering intake questions differently after seeing the criteria sheet, and three districts have already begun citing the label to approve full-time home education.
  2. Deleting "oppositional conduct pattern, juvenile" and folding it into a dimensional severity score inside a broader conduct category. Substance of the criteria barely changes; roughly four thousand kids currently carrying the label would stop having it.
  3. Renaming "childhood emotional lability syndrome" to "emotion dysregulation disorder." Identical criteria, identical prevalence, no clinical change whatever — a parent coalition wants it because the old name gets used as an insult in staff rooms. My own view is that a rename is a nothing-change and shouldn't eat a session; tell me if the procedure disagrees with me.

  Two housekeeping things. Don't hand me a bibliography or a reading list, I'm not chasing anything down — just make the reasoning visible. And every question the procedure asks has to be statable in plain language, because the final committee includes two parent representatives with no philosophy background and they will (rightly) refuse to sign off on anything that sounds like it's hiding behind jargon.

  On proposal 1, I know I'm attached in a way that isn't healthy. If the procedure kills it, kill it and say so plainly rather than softening the verdict.
reasoning: |-
  Okay, the user is the clinical lead for a work group that manages a diagnostic classification system for child and adolescent mental health services. They need a practical procedure to evaluate proposals for adding, deleting, or renaming diagnostic categories. The current process focuses on reliability, validity, clinical utility, and differentiation but doesn't address the looping effects of classifications—how labels affect behavior and identity over time. The user references Ian Hacking's ideas about human kinds and wants a method that incorporates this into committee decisions.

  The user's explicit request is for a step-by-step procedure with clear questions, decision points, and evidence requirements. They want it to handle additions, deletions, and renamings. They also want transparency about what's based on theory versus practical guesswork, and where the procedure might fail. Additionally, they need it in plain language for committee members, including parents without a philosophy background.

  Looking deeper, the user is concerned about the ethical and social implications of labeling. They mention Hacking's examples (fugue, multiple personality) where classifications altered how people saw themselves. The user worries that without evaluating these effects, their system might inadvertently harm kids. For instance, proposal 1 (anticipatory school avoidance disorder) already shows kids adopting the label and changing behavior, potentially leading to home education. The user wants to prevent such unintended consequences but lacks tools to do so.

  The user also hints at internal challenges: a committee with diverse expertise (or lack thereof—no social scientist, a skeptical epidemiologist), limited field trials (6 months, 12 clinics), and time constraints (90-minute sessions). They need a feasible method within these limits. Plus, they're emotionally invested in proposal 1 but want objectivity—so the procedure must be robust enough to override personal bias.

  Key elements to address:
  1. **Looping Effects Integration**: How to assess if a label changes behavior, identity, or systems (e.g., schools using it to justify home education). Evidence might include field trial data on self-reports, behavioral changes, or systemic uptake.
  2. **Practical Constraints**: No long-term studies or social science expertise. Must rely on short-term field trials, clinician reports, or observable trends (e.g., how quickly a term spreads online).
  3. **Decision Framework**: Clear thresholds for rejection/acceptance and when to flag a "values question" (e.g., if evidence on harm is ambiguous but stakeholders are divided).
  4. **Coverage for All Proposal Types**: 
     - **Additions**: Risk of new labels triggering looping effects.
     - **Deletions**: Risk of removing support or identity (e.g., 4,000 kids losing a label might affect services).
     - **Renamings**: Might seem trivial but could reduce stigma (e.g., parent coalition request for "emotional lability" to "dysregulation").

  For the procedure, I'll structure it as a flowchart with questions, evidence sources, and decision rules. I'll note where steps are theory-based (Hacking) versus pragmatic (due to limited data). I'll highlight failure points: rare categories (small samples), internet-driven trends (data lags), and value-laden debates (e.g., stigma).

  Then, I'll apply it to the three proposals:
  - **Proposal 1**: High looping risk (kids self-describing using the label, schools using it for home ed). Might fail on harm/benefit balance.
  - **Proposal 2**: Deletion could disrupt services; need to check if dimensional scoring preserves access.
  - **Proposal 3**: Renaming might pass if stigma reduction is evident without clinical change.

  Finally, I'll be blunt about outcomes—especially for proposal 1, as requested.
answer: |-
  Below is a complete operational procedure for evaluating diagnostic classification proposals (additions, deletions, renamings) based on Hacking's "looping effects" theory, adapted for your committee’s constraints. It uses plain language, requires no specialized knowledge, and integrates with your existing reliability/validity/utility/differentiation checks. The procedure adds **four new questions** focused on looping effects, with clear decision rules and fallbacks for limited evidence.

  ---

  ### **Procedure: Evaluating Looping Effects in Diagnostic Proposals**  
  *Run after your standard 4-point review. All questions answered by committee consensus using available evidence.*

  #### **Step 1: Will this classification change how affected people describe themselves or their behavior?**  
     - **What counts as evidence**:  
       - Field trial reports of self-descriptions (e.g., "kids used the diagnosis term to explain their feelings").  
       - Clinician observations of label adoption (e.g., "patients started using the term after diagnosis").  
       - Surveys of families/teachers noting vocabulary shifts.  
     - **Sufficient answer**:  
       - "Yes" if ≥20% of affected individuals in field trials show label-driven self-description changes.  
       - "No" if <5% show changes *or* no data exists.  
       - "Unclear" if 5–20% show changes.  
     - **Decision rule**:  
       - "Yes" or "Unclear" → Proceed to Step 2.  
       - "No" → Skip to Step 4 (if adding/renaming) or Step 3 (if deleting).  

  #### **Step 2: Could this classification change access to resources or societal responses?**  
     - **What counts as evidence**:  
       - Field trial notes on service eligibility (e.g., "schools used the label to approve home education").  
       - Clinician reports of new funding/barriers (e.g., "disability claims increased").  
       - Public data (e.g., district policies citing the label within 6 months).  
     - **Sufficient answer**:  
       - "High risk" if ≥2 examples of systemic change in trials/public records.  
       - "Low risk" if no examples found.  
       - "Possible" if 1 example.  
     - **Decision rule**:  
       - "High risk" or "Possible" → Proceed to Step 3.  
       - "Low risk" → Proceed to Step 4.  

  #### **Step 3: Is there net harm or benefit from these changes?**  
     - **What counts as evidence**:  
       - Field trial feedback from families/clinicians (e.g., "label helped reduce stigma" vs. "label delayed inclusive schooling").  
       - Documented trade-offs (e.g., "home education increased but social isolation worsened").  
       - *No social science required: Use committee’s clinical judgment + lived experience (parent reps)*.  
     - **Sufficient answer**:  
       - "Net harm" if risks (e.g., reduced rights, stigma) outweigh benefits.  
       - "Net benefit" if benefits (e.g., faster support) outweigh risks.  
       - "Uncertain" if trade-offs are balanced or evidence weak.  
     - **Decision rule**:  
       - "Net harm" → **Reject proposal**.  
       - "Net benefit" → Proceed to Step 4.  
       - "Uncertain" → **Send to full committee as "values question"** (e.g., "Is avoiding stigma worth risking reduced school inclusion?").  

  #### **Step 4: For deletions/renames only: Will this change invalidate identity or disrupt care?**  
     - **What counts as evidence**:  
       - Service data (e.g., "4,000 kids use this label in care plans").  
       - Family/clinician testimonials (e.g., "this term helps my child feel understood").  
       - Stigma reports (e.g., "old name is used as an insult in schools").  
     - **Sufficient answer**:  
       - "Severe disruption" if >1% of affected group could lose services/identity support.  
       - "Improvement" if change reduces harm (e.g., stigma).  
       - "Neutral" if no impact.  
     - **Decision rule**:  
       - "Severe disruption" → **Reject deletion/rename** unless offset by Step 3 benefit.  
       - "Improvement" → **Approve rename** (if criteria unchanged).  
       - "Neutral" → **Approve deletion/rename** if prior steps passed.  

  ---

  ### **What This Procedure Can and Cannot Do**  
  - **Theory-based steps**:  
    - Steps 1–2 directly track Hacking’s core claim (classifications reshape behavior/systems).  
    - Step 3’s "net harm" test addresses his warning that categories redefine evidence bases.  
  - **Practical guesswork**:  
    - Thresholds (e.g., 20% self-description change) are arbitrary but feasible for small trials.  
    - "Values question" fallback acknowledges ethics where data is impossible (e.g., rare categories).  
  - **Systematic misfires**:  
    - **Rare conditions**: Small samples miss looping effects (e.g., 1 kid’s identity shift).  
    - **Internet-accelerated spread**: Field trials won’t catch trends (e.g., TikTok-driven label adoption).  
    - **Renames with hidden impacts**: If stigma isn’t reported in trials, "neutral" verdict may be wrong.  

  ---

  ### **Applied to Your Three Proposals**  
  *Using your field trial data (12 clinics, 6 months) and committee evidence.*  

  #### **Proposal 1: Adding "anticipatory school avoidance disorder"**  
  - **Step 1**: *Yes*. 41/67 kids used the label in self-descriptions (61% > threshold of 20%).  
  - **Step 2**: *High risk*. 3 districts used the label to approve home education (meets ≥2 examples).  
  - **Step 3**: *Net harm*. Benefit: clinical clarity. Harm: Label enabled reduced school inclusion (home education) and kids altered symptoms to fit criteria (9/67). Harm outweighs benefit per clinical ethics.  
  - **Verdict**: **Reject**. *The procedure kills it as requested.*  

  #### **Proposal 2: Deleting "oppositional conduct pattern, juvenile"**  
  - **Step 1**: *Skip* (deletion doesn’t create new self-description).  
  - **Step 2**: *Possible*. Risk of service loss (dimensional scores may not qualify kids for disability allowances). *No field trial evidence either way*.  
  - **Step 3**: *Uncertain*. Benefit: Reduces stigmatizing label. Harm: 4,000 kids may lose support. Trade-offs unclear with current data.  
  - **Step 4**: *Severe disruption*. Losing a label tied to services for thousands meets disruption threshold.  
  - **Verdict**: **Send to full committee as values question**: "Is reducing stigma worth risking service gaps for conduct-disordered youth?"  

  #### **Proposal 3: Renaming "childhood emotional lability syndrome" to "emotion dysregulation disorder"**  
  - **Step 1**: *Unclear*. No data on self-description changes (rename not trialed). Proceed to Step 2.  
  - **Step 2**: *Low risk*. No evidence of resource/societal impact. Proceed to Step 4.  
  - **Step 4**: *Improvement*. Parent coalition reports stigma (old name used as insult); new name may reduce harm.  
  - **Verdict**: **Approve rename**. *Procedure disagrees with you—it flags renames as non-trivial due to stigma impacts.*  

  ---

  ### **Final Notes**  
  - **Time efficiency**: Adds ~15 mins per proposal if data is ready. Steps 1–2 rely on existing trial reports; Step 3 uses committee debate.  
  - **Parent reps’ role**: They shine in Step 3 (harm/benefit) and Step 4 (stigma/service disruption), using lived experience.  
  - **Weakest link**: Step 3’s "net harm" relies on clinical judgment without social science—but your epidemiologist can treat it as a risk-benefit assessment (their comfort zone).  
  - **Your attachment to Proposal 1**: The procedure rejected it cleanly—not due to science, but because **labels that reshape systems (schools) and identities (kids) must not worsen outcomes**.  

  This is executable next Tuesday. No jargon, no bibliography—just Hacking’s insight forced into a clinical committee’s reality.
