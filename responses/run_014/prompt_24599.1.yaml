  First, I need to reconstruct the implicit theory behind expected value pricing. The practice assumes that every gamble has a well-defined expected value. But what exactly does "well-defined" mean here? The user mentions possibilities: finite, extended reals (including ±∞), or something weaker. Looking at standard practices—insurance premiums, casino edges, investment advice—they all rely on a single number for decision-making. This suggests that the presupposition is that every gamble has a determinate expected value in the extended reals. Otherwise, how could you compare it to a cost or zero? 

  Next, the user wants to know if this presupposition is coherent. The Pasadena game clearly violates it since the series oscillates without converging. Comparing it to the St. Petersburg paradox is crucial. St. Petersburg diverges to +∞, which is at least a directionally clear result. Solutions like bounded utility or truncation work there because truncating the game approaches infinity. But for Pasadena, truncation doesn't help—partial sums keep oscillating. So the standard fixes don't transfer. This exposes a flaw in the presupposition: some gambles truly lack any expected value, finite or infinite.

  Then, where is the practice underdetermined? The user points out that different theories could lead to the same pricing behavior for standard cases but diverge on pathological ones like Pasadena. For example, bounded utility models might assign a finite value to St. Petersburg but struggle with Pasadena's oscillation. The key is that the practice masks these differences until confronted with edge cases. 

  Finally, the user asks about the implications. Treating an undefined value as a number is pragmatically useful but mathematically incoherent in cases like Pasadena. The practice depends on the premise that all gambles have well-defined expectations, which this example falsifies. To adapt, the practice needs to incorporate more sophisticated decision theories that don't rely solely on expected value, especially for such gambles. 

  I should also consider the user's background. As a physicist, they appreciate rigor but might be new to philosophical nuances. Emphasizing conceptual clarity over algebra is key. They’re likely looking for a bridge between quantitative intuition and philosophical critique. Highlighting how the practice's assumptions break down in edge cases, and what alternatives exist, would address their deeper interest in foundational coherence.
answer: |-
  Your inquiry cuts to the heart of decision theory's foundations, exposing a subtle presupposition embedded in common practice. Let's dissect this rigorously, respecting your physicist's lens while engaging the philosophical depth.

  ### 1. The Implicit Theory: What Pricing Strictly Presupposes
  The practice of pricing gambles by expected value **strictly presupposes that every well-defined gamble possesses an *expected value within the extended real numbers* (i.e., a finite value, +∞, or -∞).** This is not merely a convenient idealization; it is a necessary commitment for the practice to function coherently across *all* gambles.

  - **Why Extended Reals?** Comparing a gamble's expected value to a fixed cost (e.g., premium, entry fee) requires a *totally ordered spectrum of values*. The extended reals ℝ ∪ {−∞, +∞} provide this ordering: any two values are comparable (e.g., −∞ < 5 < +∞). The practice cannot tolerate a state of "no value" because comparison (e.g., "EV > cost?") becomes undefined.
  - **What it Excludes:** It excludes the possibility that a gamble could be *genuinely undefined* (oscillatory, conditionally convergent, or otherwise resistant to summation), nor does it allow for values outside this ordered set (e.g., hyperreals or non-numerical entities).
  - **Weaker Presuppositions?** No weaker presupposition suffices. If some gambles lacked *any* extended-real value, the practice would face gambles where its core operation ("compute EV, compare to price") fails categorically. The Pasadena game is precisely such a counterexample.

  ### 2. Coherence & Comparison with St. Petersburg
  **a. Coherence of the Presupposition:**
  The presupposition is **mathematically coherent** *only if* every gamble's payoff series converges absolutely or diverges monotonically to ±∞. The Pasadena game violates this: its series is conditionally convergent (changing term order changes the sum) and oscillates perpetually. The presupposition becomes **empirically falsified** by this gamble – it asserts a definite value exists, yet computation yields perpetual indeterminacy.

  **b. Contrast with St. Petersburg:**
  The St. Petersburg game (SP) diverges monotonically to +∞. While infinite, this is a *definite direction* within the extended reals. Crucially, **standard replies fail for Pasadena:**

  - **Bounded Utility:** A concave utility function (e.g., *u*(wealth) = log(wealth)) tames SP by making its *expected utility* finite. Applied to Pasadena, utility doesn't resolve oscillation: *u*(2^(n-1)) alternates sign and |*u*(2^(n-1))| still diverges as n increases. The series ∑ (± *u*(2^(n-1)) * 2^(-n)) still oscillates without convergence.
  - **Finite Wealth/Truncation:** Truncating SP after *N* flips yields a large but finite EV. As *N*→∞, this EV→∞ monotonically. Truncating Pasadena after *N* flips yields a partial sum oscillating between 0 and 1/2. As *N*→∞, this sequence **does not converge**; it perpetually alternates. There is no "limiting value" to approach.
  - **Impatience (Discounting):** Discounting future payoffs (δ^t) damps SP's divergence but still yields +∞ if δ≥1/2. For Pasadena, discounting (δ^n) damps the magnitude of terms but preserves the alternating sign. The series ∑ (δ^n * (±1/2)) converges only if |δ|<1, but its sum *depends on the order of summation* (a hallmark of conditional convergence). Impatience doesn't bestow a unique value.

  **Key Distinction:** SP presents a problem of *magnitude* (infinite gain). Standard tools manage this by making the valuation finite (utility, truncation) or acceptably infinite (discounting). Pasadena presents a problem of *definition* – no stable value exists under summation, and standard tools fail to impose stability.

  ### 3. Underdetermination & Implications for Practice
  **a. Where Practice is Underdetermined:**
  The pricing practice **cannot distinguish** between underlying theories of value that agree on the *existence* of an extended-real expected value but disagree on its *source* or *interpretation*. Consider theories that all yield the same EV for "nice" gambles:
  - **Classical Frequentism:** EV is the long-run average payout over infinitely many trials.
  - **Subjectivist Bayesianism:** EV reflects a coherent betting quotient based on personal belief.
  - **Axiomatic Decision Theory (e.g., Savage):** EV emerges as the representation of rational preferences satisfying certain axioms (e.g., independence).

  For gambles like coin flips with finite outcomes, dice rolls, or even SP (valued as +∞), these theories often concur on the numerical EV used in pricing. The practice is blind to their philosophical differences. **It only breaks down when the *existence* of the EV itself is contested by the underlying mathematics, as in Pasadena.**

  **b. What Must Change if Some Gambles Have No Value:**
  Accepting that some gambles lack an expected value forces a fundamental shift:
  1. **Diagnostic Step:** The practice must first ask, "*Does this gamble possess a well-defined expected value (finite or infinite)?*" This requires analyzing the convergence properties of the payoff series, not just computing partial sums.
  2. **Alternative Valuation Frameworks:** For "pathological" gambles like Pasadena, the practice must abandon naive EV pricing and adopt more sophisticated frameworks:
     - **Non-Linear Utility with Specific Properties:** Models incorporating specific risk attitudes towards gain/loss sequences or volatility.
     - **Multiple Priors/Robust Control:** Consider a *set* of possible valuations (e.g., arising from different summation orders) and apply min-max, max-min, or regret criteria (Gilboa & Schmeidler's Maxmin Expected Utility).
     - **Direct Preference-Based Pricing:** Define value based on pairwise comparisons with other gambles or sure sums, bypassing summation (e.g., "What sure amount *X* makes me indifferent between getting *X* and playing the Pasadena game?"). This might yield a finite value *despite* the lack of EV, reflecting global preferences.
     - **Finitistic Constraints:** Mandate all gambles be truncated or embedded within a bounded world *before* valuation, rejecting the infinite game as ill-posed.
  3. **Revised Rationality Norms:** The injunction "maximize expected value" becomes incomplete. Rationality might require using a *different procedure* for gambles failing the EV existence test.

  ### Conceptual Critique: What the Practice is Doing & Its Defensibility
  The practice treats the undefined (oscillatory) quantity *as if* it were a definite number by **imposing the presupposition of existence**. It is an act of **conceptual closure**: forcing the messy reality of mathematical indeterminacy into the Procrustean bed of a totally ordered, numerically comparable value. This is defensible *only* under two conditions:
  1. **Empirical Adequacy:** The gambles encountered in the domain of application (insurance, casinos, most investments) *do* possess well-defined EVs (finite or divergent monotonically). The pathology is rare.
  2. **Pragmatic Justification:** The cost of handling the pathological case specially exceeds the benefit, or alternative valuations cluster near a "pragmatic EV" (e.g., the 0 or 1/2 of the partial sums for Pasadena might be used as heuristics).

  However, the Pasadena game exposes this as **epistemically fragile**. The practice relies on a premise – "all gambles have an EV in ℝ∪{±∞}" – that is *mathematically false*. It works only by *ignoring or defining away* counterexamples. This is analogous to using Newtonian mechanics while ignoring relativistic speeds; it's pragmatically useful within a limited domain but ontologically incorrect at the boundaries.

  **Conclusion:** The pricing practice presupposes the universal existence of an extended-real expected value. The Pasadena game falsifies this presupposition, revealing a class of gambles where the practice lacks conceptual grounding. While defensible pragmatically in constrained domains, it relies on suppressing mathematical truth. A more robust practice requires a diagnostic step for EV existence and recourse to richer decision theories for pathological cases. This moves valuation from a simple computational act to a context-dependent judgment, reflecting the true complexity of choice under uncertainty. Your physicist's intuition about "whether a number is actually there" is precisely the critical insight the practice needs to confront.
