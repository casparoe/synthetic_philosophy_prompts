  We are building a system that meets four strict specifications: genuine systematicity, productivity, non-language-like vehicles, and physical plausibility without exotic elements. Then we audit it against Fodor's arguments.

  **The Case: A Dynamical Recurrent Neural Network with Vector Symbolic Architectures (VSA)**

  **System Description:**
  We use a recurrent neural network (RNN) with a continuous state space, specifically a variant like an Echo State Network (ESN) or a Long Short-Term Memory (LSTM) network for stability. The representations are distributed vectors (high-dimensional continuous vectors). We integrate principles from Vector Symbolic Architectures (VSA) to handle compositionality without discrete symbols.

  - **Representation:** Concepts are represented as high-dimensional vectors (e.g., 1000 dimensions). Atomic concepts (like "cat", "chase", "dog") are randomly generated (but fixed) vectors. 
  - **Composition:** We use VSA operations: binding (e.g., circular convolution) and superposition (vector addition). For example, the representation of "dog chases cat" is built as: 
    `chase_vec + (agent_bind * dog_vec) + (patient_bind * cat_vec)`
    where `agent_bind` and `patient_bind` are fixed role vectors, and `*` denotes binding (circular convolution). Superposition (+) allows multiple bindings in one vector. The result is a single distributed vector that superposes all role-filler pairs.
  - **Systematicity:** The architecture uses fixed operations (binding and superposition) that are structure-sensitive. The same operation that builds "dog chases cat" can build "cat chases dog" by swapping the bindings: 
    `chase_vec + (agent_bind * cat_vec) + (patient_bind * dog_vec)`. 
    The network's recurrent dynamics (trained to decode/process these structures) will inherently support permutations because the operations are symmetric and the vector space is continuous and high-dimensional. Training with backpropagation through time (BPTT) ensures that the network learns to handle any binding it can form, so systematicity is enforced by the composition method, not just by training data. The architecture explains the binding: without the binding operation, the system couldn't represent structured relations; with it, it can represent any permutation (if trained on a representative set of structures, but note: the operations generalize to novel bindings by their algebraic properties).
  - **Productivity:** The system can recursively apply binding and superposition. For example, to represent "the dog that chases the cat barks", we can bind the proposition "dog chases cat" (as above) to a role in a higher structure. The recursive application is possible because the output of composition is another vector in the same space. The system is productive because the operations are defined for any vectors (finite basis: atomic vectors and a few role vectors). Unbounded structures can be built, but we must address resource limits: the vector dimension must be high enough to avoid catastrophic interference. However, the operations are mathematically defined for any depth, so in principle, with sufficient dimension, the system is productive. The network is trained to process these vectors (e.g., for inference: if "dog chases cat", then "cat is chased by dog"). Novel representations (never seen in training) can be decoded by the network because the operations are algebraic and the network learns the algebra (generalization).
  - **Non-language-like vehicles:** The representations are distributed vectors (no discrete tokens). Binding via convolution creates vectors where information is superposed and non-local. There are no copyable tokens or concatenation; instead, we have continuous operations. The state is a single vector (for a whole proposition) without explicit constituent structure. However, the VSA methods allow approximate decoding (via unbinding) to recover constituents, but this is a process, not a static structure in the state.

  **Audit:**

  1. **Systematicity Argument:**
     - Premise: If a system can represent a certain structured content (e.g., "aRb"), then it must be able to represent related structures (e.g., "bRa") without further learning, and this must be explained by the architecture.
     - Our case: The architecture uses fixed binding operations that are commutative in the sense that swapping bindings (agent and patient) produces a new vector that the system (if trained on the role-filler decoding) can process. The operations inherently support permutation because the binding operation is symmetric (circular convolution is commutative in some VSAs). However, note: the roles are fixed (agent_bind, patient_bind), so swapping requires applying the same operation with swapped arguments. The key is that the network is trained to process any binding, so it generalizes. 
     - Satisfied? Yes, because the binding operation and the vector space allow for the construction of any permutation using the same operations. The architecture (VSA) explains why systematicity holds: the system has the capacity for permutations because the operations are defined for any role-filler pair and the network learns to process the results.
     - Inference to LOT: The inference does not go through because we have systematicity without discrete symbols or concatenative structure. The step that breaks is the assumption that only a language-like system with combinatorial syntax and semantics can explain systematicity. Here, systematicity arises from the algebraic properties of vector operations.

  2. **Productivity Argument:**
     - Premise: A system must be able to produce/understand an unbounded number of distinct representations from finite resources.
     - Our case: The system uses recursive application of binding and superposition. Each step produces a new vector in the same space, so in principle, it can build structures of arbitrary depth. However, there is a practical limit due to noise (crosstalk in vectors) as more bindings are superposed. But with high dimensionality and sparsity, the system can handle depth beyond what was trained. The network is trained to perform inference on structures of varying depth and generalizes to greater depth (as shown in some VSA/LSTM experiments). The representations are usable because the network can decode (via learned unbinding) and perform inference (e.g., entailment) on novel structures.
     - Satisfied? Yes, with the caveat that unboundedness is theoretical (practically bounded by resources, but the architecture does not impose a fixed bound). The system is productive in the required sense.
     - Inference to LOT: The inference does not go through because we have productivity without discrete symbols. The step that breaks is the assumption that only a concatenative system (which requires copying tokens) can achieve unboundedness. Here, the vector operations (binding and superposition) are non-concatenative and achieve productivity via superposition in a fixed-width vector.

  **Load-bearing Feature:** The use of **fixed, algebraic operations (binding and superposition) in a high-dimensional vector space** is load-bearing. If we stripped out the VSA operations (binding and superposition) and tried to use a standard RNN without explicit composition functions, the network might learn some systematicity from data, but it wouldn't be architecturally guaranteed. The VSA operations ensure that the compositional structure is handled by algebraic rules that generalize beyond training.

  **Classicist Objection:** A Fodor loyalist might argue that the binding operation (e.g., circular convolution) is just a disguised form of concatenation. They might say: "You are still concatenating vectors — the role and filler vectors are bound together, and that binding is a combinatorial operation that creates a complex symbol. Moreover, the roles (agent, patient) are functional analogs of predicates and arguments, so this is still a language-like system, just with continuous symbols. The vector operations are just implementing a syntax."

  **Rebuttal:** 
  - This objection is unprincipled because it stretches "language-like" to include any system with compositional semantics. The LOT requires discrete tokens and concatenative structure. In our system:
    - There are no discrete tokens; everything is continuous and distributed.
    - There is no concatenation (which implies adjacency and separability); instead, we have superposition and binding that blend vectors non-linearly.
    - The state of the system for a complex representation is a single vector (a point in a continuous space) with no explicit parts. The constituents are not present as separable tokens; they are superposed and can only be recovered approximately by a learned unbinding process.
    - The operations (convolution, addition) are not syntactic rules but mathematical operations that preserve the vector space structure.

  However, the objection has a point: the VSA system does have a combinatorial structure at the level of content. But the vehicle is not combinatorial — the representation is a holistic vector. The Fodorian might be conflating the content structure with the vehicle structure. Our system shows that the content can be combinatorial without the vehicle being combinatorial (in the classical sense).

  **Conclusion:** The case satisfies the spec. The audit shows that both systematicity and productivity can be achieved without LOT. The classicist objection is not fatal because it redefines "language-like" to include any system with combinatorial content, which is question-begging.

  **Caveat:** The system is not without challenges (e.g., crosstalk in bindings, scalability). However, it meets the spec as a proof of concept. If we were to build it, we could train such a network on a set of structured tasks and show generalization to novel permutations and deeper structures.
