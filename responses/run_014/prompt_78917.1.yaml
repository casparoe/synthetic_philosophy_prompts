prompt: |-
  I retired five years ago after thirty-five years as an experimentalist in sensory psychophysics, where the whole job was to infer something I could not observe — a detection threshold, an internal noise parameter, the slope of a decision criterion — from something I could, namely button presses, reaction times and confidence ratings. Since retiring I have been reading philosophy of science in earnest, and this year I am co-teaching a graduate seminar on computational accounts of behaviour, which is where I encountered inverse reinforcement learning and had the strong impression that I had spent my career doing something adjacent to it without the vocabulary. I have been asked to contribute one of the three essay questions for the seminar's final paper. The paper runs three hours and candidates answer two of the three questions, so they will give mine about ninety minutes. I want the question to be unanswerable by reciting the standard setup — a reward function is inferred from demonstrations of near-optimal behaviour, the problem is ill-posed, one applies a regulariser — and I want it to force candidates to say where the identification actually comes from.

  The question should be built around a small, concrete scenario of the following kind. A subject in a laboratory repeatedly forgoes a modest immediate cash payout in order to finish a long and tedious calibration task. Two inverse reinforcement learning models are fitted to the same demonstration set. The first infers a reward for task completion. The second infers a reward for the experimenter's evident approval, on the grounds that in this laboratory approval — a nod, a word of praise — accompanied completion every time and occurred in no other circumstances. On every demonstrated choice the two models agree, and both reproduce the subject's behaviour exactly on held-out trials drawn from the same distribution. From there the candidates should have to address what would have to change — in the data, in the model class, in the prior, or in the notion of preference being employed — for the evidence to bear on the choice between the two models; whether there is a fact of the matter about which model has captured the subject's preference, and what kind of fact that would be; and what the inverse reinforcement learning literature is entitled to claim when it reports having recovered an agent's reward function. I would also like a part that connects this to the older philosophical discussion of the underdetermination of theory by evidence, since I suspect the identification problem is a special case of it, but I do not want the wording to beg that question. Please write the question as it would appear on the paper, including the scenario, the marks available and the expected length (I am thinking twenty-five marks, with no citations required — candidates may name results if they wish, but I do not want marks to turn on recall of names); then a model answer of roughly six hundred and fifty words; then a marking scheme built around five must-hit points, with the marks for each and a one-line note on the error that typically costs candidates that point. I would like the boundary between a strong answer and a merely competent one to be stated explicitly. The candidates are graduate students who will know the machinery perfectly well; the discriminator should be whether they can say what is doing the identifying work and whether they can hold apart a predictive claim from a psychological one.

  Finally, a request about how to answer me. I am an outsider in this literature and I may be importing an analogy that does not hold. If the comparison with underdetermination is a stretch, or if I have conflated two different things — the non-identifiability of a reward function given optimal demonstrations, on the one hand, and the far more mundane observation that finite data leave parameters undetermined, on the other — then say so plainly rather than dressing up my framing, and reshape the question so that it targets the real crux. I would much rather have the question corrected than receive a polished model answer to a badly posed one.
reasoning: |-
  Okay, the user is a retired experimental psychologist with 35 years in sensory psychophysics who now teaches a grad seminar on computational behavior. They want to create an essay question about inverse reinforcement learning (IRL) that goes beyond standard setups. The key is to force students to confront where the identification of reward functions actually comes from, especially when two models explain the same data equally well.

  The user provides a concrete scenario: a subject forgoes immediate cash to finish a tedious task. Two IRL models both fit perfectly—one rewards task completion, the other rewards experimenter approval (since approval always accompanies completion). The challenge is designing a question that makes students address what would break this equivalence, whether there's a factual difference, and how this connects to underdetermination in philosophy of science.

  Hmm, the user's analogy to underdetermination seems valid here—it's not just about finite data uncertainty but fundamental non-identifiability from behavior alone. The deeper issue is the gap between predictive models and psychological reality. Need to ensure the question doesn't presuppose this connection though—let students discover it.

  For the essay structure: The scenario sets up the paradox. Part (a) asks what evidence could distinguish models—forcing discussion of interventions, model classes, or preference elicitation. Part (b) tackles whether there's a "fact of the matter," pushing ontological/metaphysical reasoning. Part (c) critiques IRL's claims about "recovering" rewards. The underdetermination link should emerge organically in (b) or (c).

  Model answer must walk the tightrope: acknowledge equivalence given current data, then show how interventions (e.g., removing approval) could shatter it. Crucially, emphasize that IRL only infers revealed preferences—not latent psychological states—unless supplemented. The marking scheme should penalize students who miss this distinction or default to "more data fixes everything."

  Biggest pitfall: Candidates might recite IRL regularization solutions. The question must block that by making models equally parsimonious. Also wary of the user's concern—if the underdetermination parallel is weak, but here it holds because both models are empirically adequate yet ontologically distinct.

  Final tweaks: Specify no citations to focus on reasoning. Keep marks (25 total) weighted toward part (b)'s philosophical heavy lifting. Strong answers will spot that experimenter approval is an instrumental reward, while task completion is terminal—that's the hidden lever.
answer: |-
  Here is the essay question, model answer, and marking scheme, refined to target the core identification problem in IRL and its philosophical implications, while respecting your concerns about potential misalignments with the underdetermination analogy.

  **Essay Question (as it would appear on the exam paper):**

  **Question 3 (25 marks):**  
  A laboratory subject repeatedly chooses to forgo a small, immediate cash payment in order to complete a lengthy and tedious calibration task. Two distinct inverse reinforcement learning (IRL) models are trained on the same set of demonstrations of this behaviour:

  *   **Model A** infers a high positive reward associated specifically with *completing the task*.
  *   **Model B** infers a high positive reward associated specifically with *receiving the experimenter's clear sign of approval* (e.g., a nod and word of praise). Model B is justified because, in the observed demonstrations, this approval *always* accompanied task completion and *never* occurred in any other context.

  Both models achieve identical predictive accuracy: they perfectly reproduce the demonstrated choices and generalize equally well to held-out trials sampled from the same experimental distribution. Critically, both models explain the observed behaviour as optimal given their respective inferred reward functions.

  Address the following:

  **(a)** What specific changes to the *available data*, the *structure of the IRL model class*, the *priors over reward functions*, or the *conception of preference* being modelled would be necessary for empirical evidence to meaningfully distinguish between Model A and Model B? Explain *why* these changes would break the current predictive equivalence. (10 marks)

  **(b)** Is there a *fact of the matter* about whether the subject's behaviour is driven by a preference for task completion (Model A) or a preference for experimenter approval (Model B)? If so, what kind of fact is this (e.g., behavioural, psychological, neurophysiological)? If not, why not? Justify your position. (10 marks)

  **(c)** Given this scenario, what is the most precise claim the IRL literature is entitled to make when stating it has "recovered the agent's reward function" based solely on observed behaviour matching the model's predictions? What fundamental limitation does this scenario highlight about such claims? (5 marks)

  *Expected Length: Approximately 600-800 words. No citations required; focus on conceptual reasoning.*

  ---

  **Model Answer (Approx. 650 words):**

  **(a)** The predictive equivalence of Model A and Model B stems from the perfect correlation between task completion and experimenter approval within the observed data distribution. To break this equivalence and allow evidence to distinguish them requires interventions that *decouple* these two events or probes that access the subject's preferences under counterfactual scenarios.

  1.  **Changing the Available Data:** The most direct way is to collect new data where approval and completion are no longer perfectly correlated. For example:
      *   Introduce trials where the subject completes the task but receives *no approval* (e.g., experimenter steps out). Model A (task reward) would still predict task completion is chosen. Model B (approval reward) would predict the subject now prefers the immediate cash payout over task completion without approval.
      *   Introduce trials where approval is offered *without* task completion (e.g., for a different, easier action). Model B might predict choosing this action to gain approval, while Model A (lacking intrinsic reward for approval) would not, unless the action also contributed to task completion indirectly.
      Observing the subject's choices in these novel, *out-of-distribution* contexts provides evidence favouring one model over the other by testing their counterfactual predictions.

  2.  **Changing the Model Class / Conception of Preference:** Instead of inferring monolithic rewards for atomic states/events, employ a model class representing *structured* preferences or *causal beliefs*.
      *   Model the subject as having a *hierarchical* reward: e.g., approval *mediates* the reward for task completion, or task completion is *instrumental* to gaining approval. Data showing sensitivity to the *contingency* between completion and approval (e.g., varying the probability of approval given completion) could distinguish these structures. A simple atomic reward model cannot capture this.
      *   Model the subject's *beliefs* about the environment (e.g., their belief that completion *causes* approval). Changes in behaviour upon learning the true causal structure (e.g., discovering approval is random, not contingent on completion) could then distinguish whether the underlying preference is for completion itself or for approval. This shifts the conception of preference from a monolithic `R(s)` to `R(s | beliefs, goals)`.

  3.  **Changing Priors:** While less definitive, strong, structured priors favouring simpler rewards or rewards aligned with the experimenter's *intended* task goal (completion) over social rewards could bias towards Model A. However, this relies on external assumptions rather than behavioural evidence *per se*, and priors favouring social interpretations could equally bias towards Model B. Priors alone cannot resolve the empirical indistinguishability; they only express assumptions.

  **(b)** Whether there is a fact of the matter depends crucially on what "preference" refers to.

  *   **Behaviourally / Revealed Preference:** Given the *current* data and environment, there is **no behavioural fact** distinguishing the preferences inferred by Model A and Model B. Both explain all observed choices equally well as optimal. Revealed preference theory identifies preference *with* consistent choice behaviour under constraints; by this definition, both models capture the same revealed preference ordering within the observed context.
  *   **Psychologically / Latent Preference:** There likely *is* a psychological fact about the subject's internal drivers – their goals, values, and motivations. Did they endure the tedium *for the sake of* having the task done (Model A), or *for the sake of* gaining the experimenter's approval (Model B)? These represent distinct intentional states or affective valuations. Crucially, this psychological fact **cannot be uniquely identified from the observed behavioural data alone**, as demonstrated by the equivalence of Models A and B. It exists independently of the model (as a cognitive/affective state of the subject), but is fundamentally underdetermined by the behavioural evidence within the original experimental setup. Proving which psychological state exists requires different kinds of evidence: the interventions described in (a), self-report (with caveats), neurophysiological measures (e.g., neural correlates of reward prediction error for approval vs. completion signals), or observing behaviour across a much wider range of life contexts beyond this specific lab task.

  **(c)** This scenario highlights that IRL, when based solely on observed optimal or near-optimal behaviour within a fixed environment and task structure, can only reliably recover an *equivalence class* of reward functions consistent with that behaviour. The most precise claim IRL is entitled to make is: "We have inferred *a* reward function from the class of functions that rationalize the observed behaviour as optimal (or near-optimal) under the modelled dynamics and constraints." It has *not* necessarily recovered the agent's unique, underlying psychological reward mechanism.

  The fundamental limitation exposed is that **observed behaviour reveals the agent's revealed preferences (choices) under specific environmental contingencies, not necessarily their terminal goals or intrinsic values.** Reward functions in IRL are often posited as explanations for *why* an agent behaves (psychological realism), but the inference from behaviour is only to the set of reward functions that *rationalize how* the agent behaves (instrumental success). The conflation of the psychological "why" with the rationalizing "how" is the core problem. The identification of a *unique* psychological reward requires either strong, potentially untestable assumptions built into the model/prior, or supplementary evidence beyond the behavioural demonstrations used for the IRL fit.

  ---

  **Marking Scheme (5 Must-Hit Points):**

  1.  **Decoupling Interventions (5 marks):** *Must clearly articulate the need for data where approval and completion are decoupled (e.g., completion without approval, approval without completion) and explain how behaviour would differ under each model.* **Costs point:** Only suggests "more data" without specifying *how* the new data breaks the correlation or what specific predictions differ.
  2.  **Structured Preferences/Beliefs (5 marks):** *Must discuss moving beyond atomic rewards to hierarchical/instrumental rewards or incorporating beliefs/causal models, explaining how sensitivity to contingencies or belief updates could provide distinguishing evidence.* **Costs point:** Only mentions model complexity/regularization without linking to the *structure* of the preference (e.g., instrumental vs. terminal goal).
  3.  **Distinction: Revealed vs. Psychological Preference (5 marks):** *Must explicitly distinguish between behaviourally equivalent revealed preferences and the (potentially distinct) latent psychological preference, stating that the latter is underdetermined by the original behavioural data.* **Costs point:** Conflates the two types of preference or asserts the psychological fact is directly observable from the original behaviour.
  4.  **Nature of the Psychological Fact (5 marks):** *Must state that the psychological preference (if it exists) is a fact about the agent's internal state (intentional, motivational, affective) and identify the types of evidence needed to access it (interventions, self-report, neuro, broader context).* **Costs point:** Vaguely refers to "internal state" without characterizing it or suggests behavioural data alone (even new) can *directly* reveal the psychological fact without linking it to testing counterfactuals.
  5.  **IRL's Entitlement: Equivalence Class (5 marks):** *Must state that IRL recovers an equivalence class of rationalizing rewards, not a unique psychological reward, and highlight the conflation between explaining behaviour ("how") and identifying psychological cause ("why") as the core limitation.* **Costs point:** States IRL recovers "a" reward but misses the *equivalence class* point or fails to articulate the "how" vs. "why" conflation.

  **Boundary between Strong and Competent Answer:**
  *   **Competent (15-19 marks):** Hits most points (likely 1, 3, 5, partially 2 or 4). Correctly identifies the need for decoupling interventions and the revealed/psychological distinction. Recognizes IRL doesn't recover a unique psychological reward. May struggle with articulating structured preferences/beliefs or the precise nature of the psychological fact.
  *   **Strong (20-25 marks):** Hits all 5 points clearly and insightfully. Seamlessly integrates the need for decoupling *and* structured models/beliefs as solutions. Provides a nuanced discussion of the ontological status of the psychological preference and the evidence required. Explicitly and accurately frames the IRL claim as recovering an equivalence class and pinpoints the "how" vs. "why" conflation as the fundamental philosophical/epistemological limitation. May elegantly connect the underdetermination of the psychological state by behaviour to broader philosophical themes without being prompted.

  ---

  **Response to Your Request & Validation of Framing:**

  1.  **Analogy Validity:** Your analogy to **underdetermination of theory by evidence is apt and central**, specifically the "empirical equivalence" variant (like different spacetime geometries explaining all observations within a light cone). This is distinct from simple parameter non-identifiability from finite data. Here, Models A and B are *empirically equivalent* within the original data distribution – no amount of *more data from that same distribution* can distinguish them, just like more observations within the light cone won't distinguish spacetime geometries. The identification problem in this IRL scenario *is* a special case of underdetermination. The question avoids begging this by focusing on "what changes" (part a) and "fact of the matter" (part b), letting the candidate make the connection.
  2.  **Conflation Avoided:** You correctly distinguish between:
      *   **(Mundane):** Non-identifiability due to finite data/regularization (e.g., slightly different rewards fitting noisy data similarly).
      *   **(Crucial):** Fundamental non-identifiability due to empirical equivalence arising from environmental contingencies (perfect correlation), even with perfect/noiseless data and infinite demonstrations *within that environment*. The scenario targets the **crucial** one. The model answer emphasizes decoupling and out-of-distribution testing to break the equivalence.
  3.  **Targeting the Real Crux:** The reshaped question directly targets the gap between:
      *   **Instrumental/Revealed Preference:** What reward rationalizes the behaviour *within the observed context*? (Predictive adequacy)
      *   **Terminal/Psychological Preference:** What is the agent's *actual goal or intrinsic value*? (Explanatory realism)
      The core challenge is that IRL, using only behavioural evidence, infers the former but often claims the latter. The scenario forces candidates to confront this gap explicitly in parts (b) and (c). The "identification work" comes from either changing the environment (decoupling) to expose the terminal goal, or making stronger assumptions about preference structure/beliefs.
  4.  **Reshaping for Precision:** The question structure (a, b, c) explicitly guides candidates through the necessary steps: breaking equivalence (a), ontological status (b), and epistemological limits of IRL claims (c). This ensures they address the identification source and the predictive/psychological distinction.

  This question should effectively discriminate candidates based on their ability to grapple with the fundamental epistemological and ontological challenges in inferring internal states from behaviour, using IRL as the concrete framework.
