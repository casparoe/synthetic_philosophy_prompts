  ### Joint Statement on Pascal's Mugging  
  **After Adversarial Collaboration Between Binding and Non-Binding Theorists**  

  #### 1. Agreed Claims  
  Both parties accept the following:  
  1.1 **Scenario Definition**: The canonical Pascal's Mugging scenario involves a mugger demanding payment \(X\) (e.g., $5) to avert a claimed harm \(Y\) (e.g., \(3^{3^3}\) utilons of disutility), with the threat assigned a small but nonzero probability \(p > 0\). The agent must choose whether to pay.  
  1.2 **Core Dispute**: The disagreement is not about whether the mugger is *likely* untrustworthy, but whether a rational agent *must* act on the expected utility (EU) calculation \((p \times Y) > X\) despite intuitive objections. Gut intuition alone is insufficient; principles are required.  
  1.3 **Expected Utility (EU) Framework**: Both accept EU maximization as valid for *typical* decisions under uncertainty. The dispute centers on EU’s applicability to low-probability, high-stakes threats.  
  1.4 **No Evasion via "Scam" Dismissal**: Rejecting the mugging solely because "muggers are usually scammers" is inadequate. The mugger’s credibility must be addressed formally (e.g., via priors or decision criteria).  
  1.5 **Problem Significance**: Pascal’s Mugging exposes foundational tensions in decision theory (e.g., utility bounds, probability dilution, and criteria robustness). Resolving it has implications for existential risk and moral prioritization.  
  1.6 **Shared Rejection of Extreme Positions**:  
  - Binding (B) rejects "always pay" (e.g., if \(Y\) is incoherent or \(p = 0\)).  
  - Non-binding (NB) rejects "never pay" (e.g., if \(p\) is high and \(Y\) is well-defined).  
  1.7 **Verbal Agreement on Action**: In the *concrete* mugging scenario (unknown mugger, \(Y = 3^{3^3}\), \(p\) vaguely nonzero), both agree a rational agent **should not pay**. However, they diverge on *why*:  
  - B holds non-payment is only rational if justified by EU-compatible principles (e.g., probability dilution).  
  - NB holds non-payment is justified by extra-EU principles (e.g., robustness).  

  #### 2. Persistent Disagreements  
  Phrased as each camp endorses:  
  - **Binding Theorist**: "A rational agent must comply with the EU calculation \((p \times Y) > X\) unless they can *principledly* set \(p \approx 0\) or reject \(Y\)’s coherence. Refusal without such grounds violates EU maximization, a core tenet of rationality."  
  - **Non-Binding Theorist**: "A rational agent should not pay, as mugging-style EU calculations fail to bind. This is due to either (a) *why-me/dilution* reducing effective \(p\) to near zero, (b) incoherence of unbounded \(Y\), or (c) EU being overridden by robustness criteria in extreme cases."  

  #### 3. Cruxes Table  
  The table below lists key sub-questions ("cruxes") whose resolution would shift at least one camp’s position. For each crux, an agreed-upon test case/argument is provided, alongside predictions.  

  | Crux | Agreed Test Case/Argument | Binding Prediction | Non-Binding Prediction |  
  |------|---------------------------|-------------------|------------------------|  
  | **Crux 1: Why-Me/Dilution**<br>*Does dilution (threats could target anyone) rationally drive the threat’s probability to near zero?* | **Many Muggers Scenario**: \(N\) muggers each demand $X independently. Each can inflict harm \(Y\) with probability \(p = 1/N\) (fixed). The agent can pay only one. | Paying one mugger is obligatory: it saves \(p \times Y = Y/N\) in expectation. Since \(Y/N \gg X\), EU compels payment despite unresolved risk from others. | Paying is irrational: the agent’s payment is a "drop in the ocean" against \(N \times (Y/N) = Y\) in expected harm. Probability \(p\) is diluted to ineffectiveness by scale. |  
  | **Crux 2: Unbounded Utility**<br>*Is unbounded utility incoherent due to EU degeneracy?* | **St. Petersburg Mugging**: A mugger threatens to run a St. Petersburg process (payoff \(2^n\) utilons with prob. \(2^{-n}\)) unless paid $X. Expected harm is infinite. | Paying $X$ is required: infinite EU dominates any finite cost. Unbounded utility is coherent; degeneracy is a tolerable edge case. | Refusal is rational: infinite EU is pathological. Unbounded utility must be rejected or bounded to avoid mugging-style degeneracy. |  
  | **Crux 3: Decision Criterion**<br>*Should EU be replaced by robustness (e.g., maximin) for tiny probabilities?* | **Quantum Mugger**: A mugger claims to control a quantum device. Pay $X to avert harm \(Y = 10^{100}\) with prob. \(p = 10^{-100}\), else 0. *Alternative*: Donate $X to reliably save 1 life (utility \(V = 1\)). | Pay mugger if \(p \times Y > V\) (here \(10^{-100} \times 10^{100} = 1 > V\)). EU forces payment; no robustness override. | Donate to charity: Robustness (e.g., *maximin* or probability threshold) ignores tail risks below a "credibility floor." Mugger’s claim is discarded. |  

  #### 4. Verbal Disagreement  
  The sole verbal disagreement lies in **§1.7**: Both camps concur a rational agent should not pay in the *concrete* mugging. However:  
  - B attributes non-payment to EU-compatible factors (e.g., dilution-driven \(p \approx 0\)).  
  - NB attributes it to extra-EU principles (e.g., robustness).  
  This masks substantive divergence: B demands that *all* rational decisions reduce to EU, while NB permits exceptions. Tests like the **Quantum Mugger** (§3, Crux 3) expose this, as predictions split on action.  

