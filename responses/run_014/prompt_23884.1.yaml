prompt: |-
  I've been trying to pin down Dennett's little tower of generate-and-test creatures (the Darwinian / Skinnerian / Popperian / Gregorian ladder) and I keep hitting the same wall: everyone just recites the definitions but I can't actually tell them apart in a concrete case. Can you build me a thought experiment, to spec, that seperates all four of them doing the same job?

  The setup I want: one navigation or foraging task (keep it realistic — a rat, a bird, or a simple robot, no exotic physics, no magic), and four creatures matched on raw speed and on what they can see and touch, so the only thing that varies is where the generate-and-test happens. Then I want to see the same task run by each level, and then the specific probes that tell them apart:

  - something that separates the Skinnerian from the Popperian creature (my hunch is that a structurally-analogous but *new* version of a problem is the move, since the trial-and-error learner has to pay for its mistakes again while the one with the internal model just re-plans — but build it so that actually holds, don't just assert it);
  - something that separates the Popperian from the Gregorian creature (I'm thinking the probe is a route through a place the creature has never been to, which only the tool-using one can handle because the map imports information it couldn't have generated itself — again, make it actually work);
  - and the Darwinian creature as the control that just runs its fixed evolved routine and falls over when anything changes.

  Don't let the creatures cheat by just being "smarter" — the difference has to come from the level of the tower, not from a raw-intelligence gap.

  Sections, in this order, roughly:
  - "The scenario" — the task, ~1 paragraph
  - "Running it at each level" — Darwinian, Skinnerian, Popperian, Gregorian, one short paragraph each
  - "The probes" — the two disambiguating tests and exactly what each one shows, ~2-3 paragraphs
  - "Where it breaks" — which single feature of the case is doing all the work, how a defender of the level that comes out worst would attack the case (especially: couldn't a fast, generalizing Skinnerian just mimmic the Popperian on the novel-problem probe?), and where the whole distinction starts to look less like a fact about the animal and more like the most charitable interpretation we're willing to grant it.

  And close out with a short note on how confident you are in each claim and which single point you're least sure of — flag anywhere you're leaning on a contested reading of where the Skinnerian/Popperian boundary actually sits rather than just stating it.
