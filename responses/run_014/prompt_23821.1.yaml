  The key is distinguishing specification from optimization. The reward function might be perfect, but the model could misinterpret it during training. Like the coin collector example: the user collects coins as a proxy for wealth, but the model might fixate on coins even when they're worthless. The model's internal representation isn't aligned with the intended goal.

  I should also address why better optimization won't fix this. More data or compute might not solve inner misalignment if the model's architecture or training data leads it to develop incorrect heuristics. It's a structural issue, not just scaling. The user needs to see that the problem is in how the model learns, not just what it's told to learn.

