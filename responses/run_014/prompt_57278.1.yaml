answer: |-
  Here is a specification of adequacy conditions for any account of promissory obligation, structured as requested:

  **Purpose:** The account must explain the core binding force of promises *and* provide a foundation capable of grounding other directed obligations (consent, offers, vows, contracts).

  **Adequacy Conditions (with Motivation & Label):**

  1.  **Directedness & Exclusive Release (D):** The obligation created runs specifically *to* a determinate promisee(s), and only that promisee(s) can validly release the promisor from the obligation.
      *   **Motivation:** Promisees hold a distinctive "right to complain" and the power to waive performance (e.g., "You promised *me*," "I forgive the debt").
      *   **Label:** **Generalizable** (Core to consent, offers, vows, contracts).

  2.  **Binding Without Intention (BWI):** A promise can create a binding obligation even if the promisor lacked the intention to perform at the time of promising (e.g., insincere promise, promise made in bad faith).
      *   **Motivation:** We hold people accountable for promises they never intended to keep; the wrong lies in the undertaking itself, not just the subsequent intent.
      *   **Label:** **Promissory-Specific** (Crucial test distinguishing promise from mere expression of intent; less central to simple consent/offers).
      *   **Non-Negotiable:** **Yes** (Fundamental to the normative phenomenon).
      *   **Excludes Most Candidates:** **YES** (This is the primary killer for many popular accounts, especially pure will-based or reliance-based theories).

  3.  **Normative Independence (NI):** The obligation binds even if breaking the promise would (objectively or subjectively) leave the promisee better off than performance would have, or if non-performance doesn't harm them (e.g., unreachable promisee, promisee who forgets).
      *   **Motivation:** The obligation stems from the promissory act, not contingent outcomes. Breaking a deathbed promise to someone who never knows is still wrong.
      *   **Label:** **Promissory-Specific** (Highlights the sui generis "duty of fidelity"; consent/offers more directly tied to interests).
      *   **Non-Negotiable:** **Yes** (Core to understanding promise as creating a distinct moral bond).

  4.  **Pre-Existing Obligation & Regress (PER):** The account must explain the normative effect of promising to do something one is *already* independently obligated to do (e.g., promising not to murder). It must address whether this creates a new/different obligation and if the potential regress (needing a promise to bind the first promise, etc.) is a genuine problem or a non-issue.
      *   **Motivation:** Common scenario; tests if promise adds distinct normative force. The regress worry challenges whether promises *create* obligations or merely signal them.
      *   **Label:** **Promissory-Specific** (While consent to treatment might overlap, the regress puzzle is unique to promise/contract).
      *   **Non-Negotiable:** **No** (Different accounts resolve this differently, but a *good* account must have a coherent position).

  5.  **Gradation of Weight (GW):** The account must accommodate the difference in normative force between a casual assurance ("I'll call tomorrow") and a solemn oath or sworn vow ("I swear on my life").
      *   **Motivation:** Intuitively, breaking a vow feels morally weightier than breaking a casual promise, even for the same act.
      *   **Label:** **Generalizable** (Similar gradations exist in contracts [penalties] and consent [formalities]).
      *   **Non-Negotiable:** **Yes** (Must explain the scalar nature of obligation strength).

  6.  **Performance as Owed (PO):** The primary moral obligation created by a promise is to *perform* the promised act itself. Compensation, while possibly owed for the *wrong* of breaking the promise, is not the primary or equivalent satisfaction of the promissory obligation.
      *   **Motivation:** Contrasts with contract law's dominant "expectation damages" remedy. Morally, we owe the *thing promised* (e.g., returning the borrowed book, attending the event), not just its monetary value.
      *   **Label:** **Promissory-Specific** (Core to the fidelity intuition; consent/offers less rigidly tied to specific performance).
      *   **Non-Negotiable:** **Yes** (Defines the content of the obligation).
      *   **Conflict Flag:** **PO vs. Common Contract Law** (This condition explicitly rejects the contract law equivalence of performance and compensation).

  7.  **Automated Undertaking Obligation (AU):** The account must explain what, if any, directed obligation is owed to a recipient who reasonably relies on a formal undertaking issued by an automated system acting in an organization's name, where no human specifically intended *that* obligation at the moment of issuance (e.g., auto-generated contract offer, system error granting benefits).
      *   **Motivation:** Increasingly common scenario; tests the necessity of human intentionality and the role of institutional context/reliance.
      *   **Label:** **Generalizable** (Crucial for modern consent/contracts involving digital agents).
      *   **Non-Negotiable:** **Emerging** (Essential for contemporary adequacy; theories must engage with this).

  **Conflict Flags:**
  *   **BWI vs. Simple Reliance Accounts:** Binding without intent is hard for pure reliance theories to capture.
  *   **NI vs. Simple Consequentialist Accounts:** Normative independence directly contradicts outcome-based justifications.
  *   **PO vs. Economic/Contract Law Views:** Performance as primary owed fundamentally opposes the "efficient breach" rationale.

  **Candidate Theory Assessment (Brief):**

  *   **Will-Based (e.g., Kantian, Transfer of Right):** Strong on **D** (promisee as right-holder), **GW** (strength reflects will's seriousness), **PO** (performance as the object willed). Weak on **BWI** (no intent, no will?), **NI** (if will is for benefit), **AU** (no human will). Struggles with **PER** regress.
  *   **Reliance-Based:** Strong on **AU** (focuses on induced reliance), pragmatic for **GW** (reliance stakes vary). Weak on **BWI** (no intent to induce reliance?), **NI** (no reliance/harm?), **D** (release unclear?), **PO** (compensation often suffices for reliance). Handles **PER** if reliance adds new reason.
  *   **Practice-Based (e.g., Rawlsian, Scanlonian):** Strong on **BWI** & **NI** (rules/fidelity independent of intent/outcome), **D** (practice defines roles), **GW** (practice norms define weight), **AU** (institutional practice). Can handle **PO** (practice defines duty) and **PER** (practice adds reason/role). Needs careful articulation to avoid circularity/regress (**PER**) and justify the practice's authority.

  This specification provides the necessary conditions and challenges any adequate theory of promissory obligation must meet, while setting the groundwork for explaining related phenomena.
