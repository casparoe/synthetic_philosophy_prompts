answer: |-
  I'll give you a coherent account that preserves your core intuitions while resolving the tension, grounded in a distinction between **phenomenal knowledge** and **procedural knowledge**. The principle is this:

  **First-person acquaintance with intrinsic phenomenal properties provides irreducible factual knowledge that cannot be deduced from third-person physical facts alone. Skills, however, involve the calibration of sensorimotor systems to environmental contingencies—a process of dynamic adjustment, not discovery of new phenomenal properties.**

  Here's how your cases map onto this principle:

  1.  **Mary (color vision):** ✅ *Factual knowledge acquired.*  
      Seeing red reveals the *intrinsic qualitative character* of redness—a phenomenal property. No amount of physical facts about wavelengths or neural processing can convey this "what-it's-like-ness." This is *phenomenal knowledge*.

  2.  **Bicycle riding:** ✅ *Skill acquired (no new factual knowledge).*  
      The rider doesn't learn a new *phenomenal quality*. They learn to *integrate proprioception, balance, and motor commands* in real-time. This is *procedural knowledge*: the calibration of a sensorimotor feedback loop. All the facts were known; what was missing was the embodied skill to execute the task under varying conditions.

  3.  **Tasting durian:** ✅ *Factual knowledge acquired.*  
      Like Mary, tasting durian reveals a novel *phenomenal quality*—its unique gustatory/olfactory quale. Knowing the neuroscience of taste doesn't convey the intrinsic "durian-ness" of the experience. This is *phenomenal knowledge*.

  4.  **Echolocation (Blind person):** ⚖️ **Partial knowledge + skill (Hybrid Case).**  
      *My theory resolves your ambivalence:*
      -   **Phenomenal Knowledge Component:** They learn the *qualitative character* of auditory spatial phenomenology. Before, they knew *that* clicks and echoes create spatial maps. After, they know *what it's like* auditorily to perceive depth, texture, or shape via echoes—a new phenomenal property. This is factual knowledge.
      -   **Procedural Skill Component:** They learn the *sensorimotor skill* of producing effective clicks and dynamically interpreting subtle echo variations in real-time across environments. This requires calibration, not just acquaintance.
      Verdict: They acquire **BOTH** new phenomenal knowledge *and* a new skill. The tension stems from conflating these aspects.

  5.  **Falling in love:** ✅ *Factual knowledge acquired.*  
      This reveals the *intrinsic phenomenal character* of romantic love—a complex affective/embodied state. Knowing the neurochemistry doesn't convey the "what-it's-like-ness" of the emotional experience itself. This is *phenomenal knowledge*.

  **Resolving Your Core Tension:**
  The principled difference you seek is in the *nature of the acquired information*:
  -   **Phenomenal Knowledge (Cases 1, 3, 5):** Concerns *intrinsic qualitative properties* of conscious experience (qualia). These properties are only accessible via first-person acquaintance. Physical facts describe structures, functions, causes, and effects—but not the intrinsic "feel." Acquaintance provides *new factual knowledge about subjective reality*.
  -   **Procedural Skill (Case 2):** Concerns the *ability to perform an action* effectively. It relies on integrating known facts through embodied practice to achieve real-time control. No *new phenomenal property* is discovered; existing sensory inputs (proprioception, vision) and motor outputs are dynamically linked and optimized. The "what it's like" of riding a bike is built from *familiar* sensory modalities (speed, wind, balance sensations) being functionally coordinated in a new way.

  **Why Echolocation (Case 4) is Hybrid:**
  -   The *auditory phenomenology* of interpreting echoes as spatial properties is a novel quale. Knowing acoustics doesn't tell you *what it feels like auditorily* to "hear" a wall's distance or texture. This is phenomenal knowledge.
  -   The *ability* to produce useful clicks, adjust them on the fly, and rapidly decode complex echo patterns into navigational actions is a sensorimotor skill requiring calibration. This is procedural knowledge.

  **My Position (Qualia Realism + Epistemic Gap):**
  I hold that phenomenal properties (qualia) are real, intrinsic aspects of conscious states, physically implemented but not reducible to functional/structural descriptions. There is an **epistemic gap**: complete physical knowledge cannot logically entail knowledge of what these properties *are like* subjectively. Acquaintance provides unique factual knowledge. Skills, however, are about mastering dynamics, not discovering intrinsics. This preserves your verdicts without contradiction.

  **What You Must Accept (or Overturn):**
  1.  **Phenomenal Properties are Real and Irreducible (Epistemically):** You must accept that "what it's like" is a genuine feature of reality not capturable by physical descriptions alone. If you deny this (e.g., adopt a strict illusionism), you'd need to overturn verdicts 1, 3, and 5.
  2.  **The Bicycle Case Lacks Novel Phenomenology:** You must accept that the "what it's like" of riding a bike is *not* a fundamentally new kind of *raw feel*, but rather a novel *functional organization* of familiar sensations and actions. If you think it *does* involve a novel quale, you'd need to overturn verdict 2 and group it with Mary.
  3.  **The Hybrid Nature of Echolocation:** You must accept that case 4 involves *both* types of learning. Trying to force it purely into "knowledge" or "skill" ignores one essential component.

  This account delivers coherence to your intuitions by grounding the knowledge/skill distinction in the fundamental nature of consciousness (phenomenal properties) versus embodied action (dynamic control).
