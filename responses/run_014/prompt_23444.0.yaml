prompt: |-
  I cover AI and ideas for a newsletter and I'm about to interview a game theorist who works on program equilibrium -- the setup where players submit programs that can read each other's source code before acting, instead of just choosing a strategy off a fixed menu. I want questions that push past the pitch. Give me at least one on whether this is really a new soluion concept or just Nash equilibrium applied to a game whose actions happen to be programs, with a follow-up for when he says the self-reference is exactly what makes it different. I also want one on what breaks when the other player's program might not halt or just keeps simulating you, and whether the equilibrium is supposed to survive small changes to the code or whether any pertubation blows it up. And one on why this matters for AI agents negotiating in the wild rather than in a lab. Keep each one short enough to say out loud.
