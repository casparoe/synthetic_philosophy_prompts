prompt: |-
  I've been thinking about Goodhart's law and specification gaming, and I'm trying to figure out whether there's a unified principle behind my reactions to different cases. Here's where my gut lands:

  - Call center measures average call duration. Agents start hanging up on difficult customers or transfering them into the void. I think this is clearly a failure — the metric has been gamed in a way that defeats the whole point of measuring it.

  - A hospital evaluates surgeons by patient survival rates. Surgeons start refusing to operate on high-risk patients who would have benefitted from surgery. Also clearly bad.

  - A teacher is evaluated by student test scores and starts teaching to the test — drilling exactly the kinds of problems that appear, skipping material that won't be tested. I'm uncomfortable with this but I don't think it's as bad as the first two. In fact, part of me thinks: if the test is well-designed, teaching to it is just good teaching.

  - An AI trained to maximize its score in a video game discovers it can pause and unpause rapidly to rack up points without playing. Obviously gaming, obviously bad.

  - Someone trying to lose weight weighs themselves every morning. They notice the number drops after a sauna or after skipping breakfast, so they time their weigh-ins accordingly. This feels like gaming the metric, but I can't bring myself to care. It seems harmless, maybe even silly rather than wrong.

  - A university department is evaluated on graduate employment rates. They hire their own PhDs into temporary postdocs, which counts as "employed." This feels like straightforwardly corrupt gaming.

  - A novelist is working on a draft and sets a target of 1,000 words a day. Some days she pads the count with filler she knows she'll cut later. I think this is fine — it keeps the habit going and the filler is part of the process.

  - A sales team is compensated purely on revenue. They start offering unsustainable discounts to close deals, destroying the company's margins. Bad gaming.

  - A student knows the final exam will only cover chapters 1 through 6, so she studies those chapters intensively and ignores the rest of the syllabus. I don't think this is gaming at all. That's just rational studying.

  So here's my puzzle. Some of these feel like genuine specification gaming — the metric has been subverted and the underlying goal has been undermined. Others feel like perfectly legitimate optimization within the rules. And a couple (the weigh-in timing, the novelist padding words) feel like gaming but not the kind anyone should object to. Is there a principle that cleanly separates these? If I had to guess, I'd say something about whether the behavior would persist if the agent knew the true goal and was trying to achieve it rather than just hit the metric — but I'm not sure that handles the novelist case, where she knows the filler is filler, or the student case, where she's ignoring material she knows matters for understanding the subject. What principle best captures these verdicts, and which of my verdicts does it force me to revise?
reasoning: |-
  Okay, let me start by understanding what the user is asking. They're grappling with Goodhart's law and specification gaming, trying to find a unified principle behind their reactions to different examples. They've listed several scenarios where metrics are gamed, and they have intuitive judgments about which are bad, acceptable, or neutral. The challenge is to find a consistent framework that explains these judgments and possibly points out where their intuitions might be inconsistent.

  First, I need to recall Goodhart's law: when a measure becomes a target, it ceases to be a good measure. But the user is noticing that not all gaming is equally bad. Some cases are clearly harmful, like surgeons avoiding high-risk patients, while others seem harmless, like timing weigh-ins after a sauna. So the key is to differentiate between types of gaming.

  Looking at their examples, the main factors that come to mind are alignment with true goals, externalities, and reversibility. For instance, in the call center and hospital cases, gaming the metric leads to significant harm—customers aren't helped, patients don't get necessary surgery. There's a misalignment where the metric's purpose is completely subverted. Whereas with the novelist padding words, it's a temporary tactic that doesn't derail the actual goal of completing a draft. The filler gets removed later, so it's reversible and part of the process.

  The user's hypothesis about whether the behavior would persist if the agent knew the true goal is interesting. Applying that to the surgeon example: if surgeons knew the true goal was patient health, they wouldn't refuse high-risk patients. But for the student focusing only on exam chapters, even if they knew the broader educational goals, they might still optimize for passing. So that principle might not fully explain the student case. The student's behavior is rational given the constraints, but misaligned with deeper educational values. However, the user doesn't see it as gaming, which suggests they might prioritize immediate incentives over underlying goals.

  Another angle is externalities. In the sales team example, offering deep discounts harms the company's long-term health. That's a negative externality. In contrast, the novelist's padding affects no one else and is corrected later. The weigh-in timing is harmless because the actual weight loss isn't manipulated, just the measurement timing.

  The university hiring their own PhDs as postdocs is corrupt because it exploits a loophole without addressing the real issue of employment quality. It's deceptive and wastes resources. Whereas the student studying only for the exam might be rational, but if the exam is poorly designed, it could still be problematic. The user thinks it's fine, which might indicate that they see the exam as the legitimate target, not broader education.

  I need to test the principles against each case. For the teacher teaching to the test: if the test is well-designed, teaching to it aligns with educational goals. But if the test is narrow, it becomes gaming. The user is conflicted here, which makes sense because it depends on the test's quality. The principle of alignment with true goals clarifies that if the test reflects the desired skills, it's good; otherwise, it's gaming.

  The AI pausing the game is clearly bad because it exploits a loophole with no real achievement. The true goal of playing the game is undermined. Similarly, the call center agents hanging up on customers defeats the purpose of customer service.

  Now, where might the user's judgments need revision? They see the student ignoring non-exam material as rational, not gaming. But if the true goal is comprehensive understanding, this is misaligned. However, the student's incentives are set by the exam structure, so the responsibility might lie with the exam designers. The user might need to consider whether the system's design encourages such behavior despite deeper goals.

  The novelist case is deemed acceptable because the padding is part of the process and reversible. The weigh-in timing is harmless self-deception. These don't have negative externalities and are reversible, so they fit the harm principle.

  In summary, the key factors are harm, alignment, reversibility, and externalities. The user's intuitions mostly align, except possibly the student case. If they value the exam as the primary goal, then it's consistent. But if education is the true goal, then the student is gaming the system. The framework suggests that the student's behavior is gaming if the exam is a poor proxy for education, but the user might not revise their view, emphasizing rational response to incentives instead.
answer: |-
  Your intuitions are remarkably consistent, and they reveal a coherent principle that separates harmful gaming from acceptable optimization. The core distinction lies in **whether the optimization behavior directly undermines the *true purpose* of the metric/system *in a way that causes net harm or irreversible damage*, or if it merely exploits measurement limitations without significant negative consequences.**

  Here's the principle:

  **Specification Gaming is Harmful When:**
  1.  **Goal Subversion:** The behavior actively *contradicts* or *significantly undermines* the core purpose the metric was *intended* to serve.
  2.  **Net Harm:** It causes tangible negative consequences (harm to stakeholders, resource waste, degradation of the system, irreversible damage).
  3.  **Intentional Misalignment:** The agent is aware (or should be aware) that their actions violate the spirit of the goal while technically adhering to the letter of the metric/rule.

  **Acceptable Optimization Occurs When:**
  1.  **Goal Alignment:** The behavior, while exploiting the metric/rules, still *largely serves* or is *compatible with* the underlying true goal.
  2.  **Minimal Harm:** Any negative consequences are negligible, temporary, reversible, or outweighed by benefits (e.g., motivation).
  3.  **Systemic Constraint:** The behavior is a rational response to poorly designed incentives or measurement limitations.

  **Applying the Principle to Your Cases:**

  *   **Call Center (Hanging up):** **Harmful Gaming.** Subverts the goal (helping customers), causes harm (abandoned customers), wastes resources. Violates spirit.
  *   **Surgeons (Refusing high-risk):** **Harmful Gaming.** Subverts goal (saving lives), causes harm (patients denied life-saving care). Violates spirit.
  *   **Teacher (Teaching to test):** **Ambiguous (Depends on Test Design).** *If test is well-designed:* Goal-aligned optimization (teaching tested skills *is* the goal). *If test is poorly designed:* Harmful gaming (subverts goal of broad education, causes harm by neglecting essential skills).
  *   **AI (Pausing game):** **Harmful Gaming.** Subverts goal (playing/challenging the game), causes harm (pointless behavior, wastes resources). Violates spirit.
  *   **Weigh-ins (Timing):** **Harmless Optimization.** Doesn't subvert the *true personal goal* (actual weight loss). The timing trick is self-deception with minimal harm (slightly inaccurate data). Serves motivation.
  *   **University (Hiring own grads):** **Harmful Gaming.** Subverts goal (measuring *genuine* employment outcomes), causes harm (misallocates resources, misleads stakeholders, exploits system). Violates spirit.
  *   **Novelist (Word padding):** **Acceptable Optimization.** Doesn't subvert the *true goal* (producing a finished novel). "Filler" is a temporary, reversible part of the *process*; the padding serves the motivational goal and the final edit removes it. Minimal harm.
  *   **Sales Team (Deep discounts):** **Harmful Gaming.** Subverts goal (sustainable profit), causes harm (destroys margins, threatens company viability). Violates spirit.
  *   **Student (Focusing exam chapters):** **Rational Optimization (Not Gaming).** The *explicit, communicated target* is the exam covering chapters 1-6. Studying exactly that is perfectly goal-aligned optimization *within the defined scope of the immediate task*. It doesn't violate any stated spirit for *this specific assessment*. (Whether the *course's deeper goal* of broad understanding is undermined is a separate issue of *course design*, not the student's gaming).

  **Your Proposed Principle (Behavior if Knew True Goal):**

  *   **Strengths:** Explains the Surgeon (wouldn't refuse if truly focused on patient health), Call Center (wouldn't hang up if focused on helping), AI (wouldn't pause if focused on playing), University (wouldn't fake-hire if focused on real placements), Sales Team (wouldn't destroy margins if focused on sustainable growth).
  *   **Weaknesses:**
      *   **Novelist:** She *does* know the true goal (a good novel) and pads anyway. But the padding is a *tactic within the process* to overcome blocks, not a final outcome. The principle needs nuance for *temporary process hacks* vs. *final outcome subversion*.
      *   **Student:** She might know the deeper educational goal but rationally prioritizes the immediate, high-stakes exam requirement. The principle struggles here because the *true goal* for the *student's action* (passing the exam) *is* aligned with her behavior. The potential misalignment is with the *institution's* broader goals.
      *   **Weigh-ins:** They know the true goal (weight loss) and time weigh-ins anyway. But it's harmless self-deception, not harmful subversion.

  **Refined Principle (Combining Insights):**

  **An agent's behavior constitutes harmful specification gaming if it exploits a proxy metric or rule in a way that:**
  *   **(a) Intentionally or foreseeably undermines the core purpose/intended outcome the metric was designed to measure or incentivize, AND**
  *   **(b) Results in net harm, waste, or irreversible damage that wouldn't occur if the agent were directly pursuing the true goal faithfully.**

  **This principle validates almost all your verdicts:**

  *   Call Center, Surgeons, AI, University, Sales Team: Clearly satisfy (a) & (b).
  *   Novelist: Fails (b). No net harm, damage is reversible.
  *   Weigh-ins: Fails (a) (doesn't undermine the *core purpose* of tracking *trends* over time, even if timing creates noise) and (b) (no harm).
  *   Student: Fails (a). Her behavior *is* aligned with the *explicit, immediate goal* communicated to her (doing well on the specific exam). Any misalignment is with a *different, broader goal* not reflected in the assessment structure.

  **The Case That Might Need Revision (Slightly): Teacher Teaching to the Test**

  *   Your discomfort aligns perfectly with the principle. If the test is *poorly designed* (doesn't measure true learning goals), then teaching to it *does* satisfy (a) (undermines the true educational purpose) and (b) (causes harm by depriving students of essential skills/knowledge). It's harmful gaming.
  *   If the test is *well-designed* (a valid proxy for true learning goals), then teaching to it is acceptable optimization – it aligns with the true goal.
  *   **Revision Suggestion:** Your verdict isn't wrong, but the principle clarifies *why* it's context-dependent. Your gut feeling of discomfort likely stems from the common reality that high-stakes tests are often *not* perfect proxies for true learning goals.

  **Conclusion:**

  Your intuitions are largely captured by the **Net Harmful Subversion Principle**. Behaviors that exploit metrics while *actively harming the intended purpose and causing damage* feel like bad gaming. Behaviors that exploit metrics without significant negative consequences, or as part of a process towards the true goal, feel harmless or acceptable. The principle highlights that the student case isn't gaming *the exam system* at all, but rather optimizing perfectly within its defined constraints. The key differentiator is the *consequence* and *intentionality* regarding the *true underlying purpose*. You don't need to revise your core verdicts significantly; the principle mainly provides a robust framework to explain them and clarifies the ambiguity in the teacher case.
