prompt: |-
  I'm in a social ontology PhD program, and two of my seminar mates got into it after we read Lewis's Convention. Their exchange went: (1) Ana said that Lewis's 'non-accidental' condition is basically satisfied by evolutionary stability: if a regularity in a coordination game is maintained by cultural selection or repeated reinforcement, then it isn't just a coincidence, so culturally evolved regularities can be Lewisian conventions. (2) Ben said no, Lewis's non-accidental condition isn't just causal non-accidentality; it's tied to the agents' common interest and mutual expectations. A population can have a stable regularity that is causally explained by selection, but if nobody expects it as the way things are done, it's not a convention. (3) Ana replied that expectations can be selected too: if agents who expect the stable regularity and conform when they expect it do better, then the expectation structure can evolve alongside the behavior. (4) Ben said that's circular: to say the regularity is stable because people expect it is already to assume the convention exists, and Lewis's account is supposed to explain what a convention is, not just to re-describe a stable population. (5) Ana said that's not circular, it's diachronic: selection can first produce a regularity, then produce expectations about it, and once the expectation loop is in place the regularity meets Lewis's conditions. I wasnt taking sides, but I keep thinking there's a difference between a norm being stable and a norm being the kind of thing Lewis means by a convention. Can you adjudicate this move by move? I want to know who's right about which specific point, not just who wins overall, and what, if anything, both of them are missing.
reasoning: |-
  Okay, the user is in a social ontology PhD program and presented a debate between Ana and Ben about Lewis's Convention. They want a detailed adjudication of each move, not just an overall winner. Let me start by recalling Lewis's key points. Lewis defines convention as a regularity in behavior that's arbitrary, solves a coordination problem, maintained by mutual expectations, and has a non-accidental element. The non-accidental part is crucial here.

  Ana argues that evolutionary stability satisfies the non-accidental condition. She thinks cultural selection or reinforcement explains why the regularity isn't accidental. Ben disagrees, saying the non-accidental part is tied to agents' expectations and common interest, not just causal stability. He emphasizes that without mutual expectations, it's not a convention. 

  Ana counters by saying expectations can evolve through selection too. If agents who expect the regularity and act on it do better, then expectations co-evolve with behavior. Ben calls this circular because assuming expectations exist already presumes the convention. Ana sees it as a diachronic process: first regularity emerges, then expectations, then the loop is established.

  The user seems to want a clear breakdown of each point, identifying where each is correct or mistaken. They might also be looking for deeper insights into Lewis's theory, possibly for their own research. The core issue is the relationship between evolutionary stability and the role of mutual expectations in conventions. 

  Looking at Ana's first point: Lewis's non-accidental condition requires that the regularity persists because it's self-sustaining through expectations. Evolutionary stability alone (like in biology) doesn't necessarily involve mutual expectations. So Ana is partially right that selection can make it non-accidental, but she misses that Lewis specifically ties it to expectations. 

  Ben's rebuttal is correct here. He points out that non-accidental in Lewis is about the expectation loop, not just any causal explanation. However, Ben might be too strict if he dismisses evolutionary processes entirely. They can be part of how conventions form, but the expectation part is essential.

  Ana's point about expectations evolving is valid. Selection can shape both behavior and expectations. But Ben's circularity concern is also valid if she's using "expectations" in a way that already assumes conventions exist. Lewis's definition is synchronic, but Ana's diachronic view shows how conventions can emerge over time. 

  The key is that for Lewis, the expectation loop is constitutive. Even if evolution establishes the regularity, it only becomes a convention when mutual expectations are in place. Both might be missing that evolutionary stability can be a mechanism leading to conventions, but the defining feature is the expectation loop. 

  The user might need this distinction for their PhD work, understanding how conventions form versus what constitutes them. Clarifying the synchronic vs. diachronic aspects is crucial here. Ana's process-oriented view is compatible with Lewis, but she needs to acknowledge that the expectation loop is necessary for the synchronic state to be a convention. Ben is right on the definition but might overlook how evolution sets the stage.
answer: |-
  Here's a move-by-move adjudication of Ana and Ben's debate, grounded in Lewis's text (*Convention: A Philosophical Study*, 1969) and core concepts of social ontology:

  **Core Lewisian Points for Reference:**
  1.  **Convention Defined:** A regularity R in behavior among members of a population P when they are agents in a recurrent coordination problem situation S is a *convention* if and only if:
      *   Everyone conforms to R.
      *   Everyone *expects* everyone else to conform to R.
      *   Everyone *prefers* to conform to R *on condition that* the others conform.
      *   R is arbitrary (there exists at least one alternative regularity R' that could have solved S almost as well).
      *   **Non-Accidental:** The previous conditions are *common knowledge* (or mutually known to a sufficient degree), *and* this knowledge provides a *reason* for conformity, sustaining the regularity. This is *not* just causal non-accidentality; it's a specific rational/mutual expectation-based explanation for the stability.
  2.  **Rational Foundation:** Stability arises from the agents' *beliefs* (mutual expectations) and *preferences* (common interest in coordination), creating a self-reinforcing equilibrium. The "reason" is the expectation that others will conform, making it rational for me to conform.

  **Adjudication Move-by-Move:**

  1.  **Ana:** "Lewis's 'non-accidental' condition is basically satisfied by evolutionary stability: if a regularity in a coordination game is maintained by cultural selection or repeated reinforcement, then it isn't just a coincidence, so culturally evolved regularities can be Lewisian conventions."
      *   **Assessment: Partially Correct, but Misplaced Emphasis.** Ana is right that evolutionary/cultural selection *can* produce stable regularities that *aren't* accidental coincidences in a broad causal sense. She's also correct that such processes *could* be a *mechanism* leading to a state meeting Lewis's conditions. **However, she misidentifies the *core* of Lewis's non-accidental condition.** Lewis is not primarily concerned with the *causal origin* of the stability (selection vs. reinforcement vs. rational choice). He is concerned with the *ongoing, sustaining reason* for conformity *within the population at a given time*. For Lewis, the *sustaining reason* is the loop of mutual expectations and preferences creating a rational equilibrium. Evolutionary stability *describes* stability but doesn't *explain* it in the agent-centered, reason-giving way Lewis requires. A regularity could be evolutionarily stable *without* meeting the mutual expectation condition (e.g., a genetically fixed behavior in ants with no cognitive expectations).

  2.  **Ben:** "No, Lewis's non-accidental condition isn't just causal non-accidentality; it's tied to the agents' common interest and mutual expectations. A population can have a stable regularity that is causally explained by selection, but if nobody expects it as the way things are done, it's not a convention."
      *   **Assessment: Largely Correct on Lewis.** Ben correctly zeroes in on the essence of Lewis's non-accidental condition. It *is* defined by the specific structure of mutual expectations and preferences (common interest in coordination) that form a self-sustaining rational equilibrium. His counterexample is strong: a population could stably follow a regularity due to cultural selection *without* individuals having mutual expectations *about the regularity itself* or conforming *because* of those expectations (e.g., they might conform out of habit, fear of non-specific punishment, or simply because they never considered alternatives, lacking the mutual belief structure). For Lewis, this wouldn't be a convention, even if stable and adaptive.

  3.  **Ana:** "Expectations can be selected too: if agents who expect the stable regularity and conform when they expect it do better, then the expectation structure can evolve alongside the behavior."
      *   **Assessment: Plausible Mechanism, But Doesn't Resolve the Definitional Point.** Ana is absolutely correct that evolutionary/cultural selection *could* favor the development of cognitive mechanisms for forming expectations about group behavior and acting upon them. This is a powerful and plausible explanation for *how* creatures capable of Lewisian conventions might evolve. **However, this doesn't change *what a convention is* for Lewis.** Her point describes a potential *causal pathway* to *acquiring* the state Lewis defines. Lewis's definition is primarily *synchronic* – it describes the state of affairs (mutual expectations, preferences, conformity) that *constitutes* a convention at a time. Diachronic origins (like selection for expectation-forming capacities) are interesting but distinct. The key question remains: *Once the regularity exists*, is its stability *sustained* by the mutual expectation loop? Selection *could* lead to that state, but it doesn't *define* it.

  4.  **Ben:** "That's circular: to say the regularity is stable because people expect it is already to assume the convention exists, and Lewis's account is supposed to explain what a convention is, not just to re-describe a stable population."
      *   **Assessment: Partially Correct on Circularity Risk, But Overstated.** Ben identifies a genuine risk if Ana tries to *define* the convention *solely* via selection *using* the concept of "expecting the convention." That *would* be circular. **However, Ana's point is diachronic (evolution *over time*) rather than definitionally circular.** She's suggesting selection can build up the components (regularity, then expectations about it) that *then* constitute a convention according to Lewis's synchronic definition. Lewis's account *is* an explanation – it explains the stability *as arising from* the rational equilibrium of mutual expectations/preferences. Ben is right that Lewis is offering a constitutive explanation, not just describing stability. But Ana isn't necessarily being circular; she's offering a different *type* of explanation (evolutionary) for how the constitutive state *comes about*.

  5.  **Ana:** "That's not circular, it's diachronic: selection can first produce a regularity, then produce expectations about it, and once the expectation loop is in place the regularity meets Lewis's conditions."
      *   **Assessment: Correct on Mechanism, Accepts Lewis's Definition.** This is Ana's strongest point. She correctly distinguishes the diachronic evolutionary process (which is *not* circular) from the synchronic state described by Lewis. She accepts that only *when* the mutual expectation loop is in place does the regularity *become* a Lewisian convention. Selection is a mechanism *leading to* that state. This is a coherent and plausible model: 1) Selection favors a behavioral regularity (e.g., driving on the right). 2) This creates an environment where forming accurate expectations about others' behavior (that they *will* drive on the right) is advantageous. 3) Selection favors cognitive mechanisms for forming these expectations. 4) Once individuals both expect driving on the right *and* conform *because* they expect others to conform (and prefer coordination), the Lewisian conditions are satisfied. The convention *now* exists, sustained by the expectation loop, even if it originated via selection.

  **Who's Right About What & What's Missing:**

  *   **Ana:**
      *   **Right:** Evolutionary stability *can* explain the causal origin and broad stability of behavioral regularities. Expectations *can* co-evolve with behavior via selection. A diachronic evolutionary process *can* lead to a state satisfying Lewis's synchronic definition.
      *   **Wrong/Missing:** Initially conflated *causal* non-accidentality (via selection) with Lewis's specific *reason-based, expectation-driven* non-accidental condition. Underestimated that Lewis's account requires the *sustaining reason* to be the mutual expectation loop *itself*, not just any causal explanation for stability.
  *   **Ben:**
      *   **Right:** Correctly identified the core of Lewis's non-accidental condition: it is *constituted* by the mutual expectations and preferences forming a rational equilibrium, not just any causal explanation for stability. Correctly pointed out that stability *can* exist without this specific expectation loop. Correctly identified the risk of circularity if "expecting the convention" is used naively in an evolutionary definition.
      *   **Wrong/Missing:** Overstated the circularity charge against Ana's *diachronic* evolutionary account. Downplayed or dismissed the possibility that selection is a valid *mechanism* for *bringing about* the very state (mutual expectations + regularity) that Lewis defines as a convention. Lewis's account doesn't preclude evolutionary origins; it focuses on the synchronic constitutive structure.
  *   **The Core Difference Both Grapple With (and Lewis Clarifies):** The difference between a **merely stable behavioral regularity** (which can arise and persist for many reasons: habit, coercion, genetic fixation, diffuse cultural selection) and a **Lewisian convention**. The latter *is* a stable regularity, but crucially, its stability is *sustained specifically by the rational equilibrium created by mutual expectations and common interest*. Evolutionary stability is one *way* a regularity can become stable; it is *not* the *defining feature* of a Lewisian convention. The defining feature is the *expectation loop* as the sustaining reason.

  **Verdict:** Both make valid points, but **Ben is more fundamentally correct about Lewis's *definition***, especially concerning the non-accidental condition. **Ana is correct about a plausible *mechanism* (diachronic evolution) for *how* Lewisian conventions can arise**, but initially misidentified the defining feature. Ultimately, Ana's final point (move 5) successfully reconciles evolution with Lewis: evolution can build the components, and once the mutual expectation loop is operative, a Lewisian convention exists. Ben is right that without that loop, no matter how stable or adaptive, it's not a convention *by Lewis's lights*. The key is recognizing Lewis's synchronic definition (focused on the sustaining reason) and separating it from diachronic accounts of origin (like evolution).
