  I'm preparing to moderate a panel with a defender of Schellenberg's "hiddenness argument." I want eight to ten questions that go beyond restating the view, with at least one each on the "defeater" concept and how the argument handles the "mysterious ways" objection, the "non-resistant" person and the challenge of someone who is "non-resistant" but still lacks a relationship with God, the "soul-making" theodicy, the "free will" response, and Alston's "mystical perception" reply. For each, include a follow-up keyed to the answer she's most likely to give.
