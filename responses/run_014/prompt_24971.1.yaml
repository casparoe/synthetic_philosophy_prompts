       In the market making context, we care about the entire sample space. The agent's loss is not uniform across states, but it is a liability that is incurred in the states E. This is similar to an arbitrage that is not risk-free in the classical sense (because it only profits in some states) but note that the bookie's profit is risk-free? Actually, the bookie makes a profit of q - P(A|E) in the event E and 0 otherwise. So the bookie does not have a risk-free profit? They only profit when E occurs. 

