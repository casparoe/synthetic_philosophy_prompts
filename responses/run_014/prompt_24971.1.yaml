  ### Restatement of Dutch Book Arguments in Market Microstructure Vocabulary

  #### Static Dutch Book for Probabilism
  **Core Claim**: If your quoted prices for state-contingent claims violate probability axioms, a counterparty can construct an arbitrage against you, guaranteeing a risk-free profit at your expense.  
  **Setup**:  
  - You are a market maker quoting a single "fair price" for Arrow-Debreu securities (claims paying $1 if state \(s_i\) occurs, $0 otherwise). States are mutually exclusive and exhaustive (e.g., outcomes of an event).  
  - Your price for state \(s_i\) is \(p_i\), representing your degree of belief in \(s_i\).  

  **Violations and Exploits**:  
  1. **Non-Negativity Violation** (\(p_i < 0\)):  
     - *Exploit*: A counterparty sells you the claim at your negative price (you pay them \(|p_i|\)). If \(s_i\) occurs, you pay $1. Your loss:  
       - In \(s_i\): \(|p_i| + 1\) (loss)  
       - In \(\neg s_i\): \(|p_i|\) (loss)  
     - *Arbitrage Type*: Risk-free cash extraction via toxic inventory.  

  2. **Normalization Violation** (\(\sum p_i \neq 1\)):  
     - Case 1 (\(\sum p_i < 1\)):  
       - *Exploit*: Counterparty buys one unit of each claim from you for \(\sum p_i\). They receive $1 regardless of state. Profit: \(1 - \sum p_i > 0\).  
     - Case 2 (\(\sum p_i > 1\)):  
       - *Exploit*: Counterparty sells you one unit of each claim for \(\sum p_i\). You pay $1 in some state. Loss: \(\sum p_i - 1 > 0\) in all states.  
     - *Arbitrage Type*: Portfolio arbitrage across the state space.  

  3. **Additivity Violation** (for disjoint events \(A\), \(B\): \(p_{A \cup B} \neq p_A + p_B\)):  
     - Case 1 (\(p_{A \cup B} < p_A + p_B\)):  
       - *Exploit*: Counterparty buys a claim on \(A \cup B\) from you (price \(p_{A \cup B}\)) and sells you claims on \(A\) and \(B\) (prices \(p_A\), \(p_B\)). Net cash to them: \(p_A + p_B - p_{A \cup B} > 0\).  
         - If \(A\) or \(B\) occurs, your payouts = $1; their payout = $1. Net loss for you: \(p_A + p_B - p_{A \cup B}\).  
     - *Arbitrage Type*: Static hedge creating a locked-in loss via mispriced correlations.  

  **Conclusion**: Violating probability axioms allows a counterparty to execute a combination of trades that acts as an arbitrage, forcing you into a sure loss (negative P&L in every state).  

  ---

  #### Diachronic Dutch Book for Conditionalization  
  **Core Claim**: If you update prices after learning event \(E\) in a way inconsistent with prior conditional probabilities, a counterparty can exploit this across time for a risk-free profit in the \(E\)-scenario.  
  **Setup**:  
  - At \(t_0\), you quote:  
    - Unconditional prices: \(P(E)\) for a claim on \(E\), \(P(A \cap E)\) for a claim on \(A \cap E\).  
    - Conditional price \(P(A|E) = P(A \cap E)/P(E)\) for a bet on \(A\) that voids if \(\neg E\).  
  - At \(t_1\), if \(E\) occurs, you update your price for \(A\) to \(q \neq P(A|E)\).  

  **Exploit** (Assume \(q > P(A|E)\)):  
  1. **At \(t_0\)**:  
     - Counterparty buys a conditional bet on \(A\) given \(E\) from you at price \(P(A|E)\).  
     - Counterparty sells you \(k = q\) units of the unconditional claim on \(E\) at price \(P(E)\).  
     - Net cash flow: \(-P(A|E) + q \cdot P(E)\).  
  2. **At \(t_1\) (if \(E\) occurs)**:  
     - Counterparty buys one unit of the claim on \(A\) from you at price \(q\).  
     - Payouts:  
       - Counterparty receives $1 from the conditional bet if \(A\) occurs.  
       - You owe \(q\) (from selling claim on \(E\)) and pay $1 if \(A\) occurs.  
     - Your loss if \(E\) occurs:  
       - Always \(q - P(A|E) > 0\) (regardless of \(A\)).  

  **Arbitrage Type**: A cross-temporal strategy combining conditional bets at \(t_0\) and spot trades at \(t_1\). Your loss is guaranteed if \(E\) occurs; if \(\neg E\), trades void and loss = 0.  

