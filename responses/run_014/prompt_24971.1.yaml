       But the Dutch book argument for conditionalization is usually presented as a sure loss for the agent in the event that E occurs? And the argument is that the agent is vulnerable to a loss in that event. 

       Therefore, in market vocabulary: if you do not update by conditionalization, then a counterparty can construct a series of trades that, if the event E occurs, results in a sure loss for you (the market maker) in every sub-state within E. This is analogous to an arbitrage opportunity that is triggered by the occurrence of E.

  ## Part 2: Residue Report

  ### Mapping Cleanly

  1. **Static Dutch Book**:
