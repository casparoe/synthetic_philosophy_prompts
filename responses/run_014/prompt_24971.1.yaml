  ### Residue Report  
  #### Parts Mapping Cleanly to Your Framework  
  1. **Static Dutch Book**:  
     - **Arbitrage as sure loss**: Directly mirrors arbitrage in options market-making. Violating probability axioms = mispricing state claims, allowing a counterparty to construct a risk-free portfolio (e.g., violating normalization = mispricing the "risk-free bond").  
     - **No-arbitrage bounds**: Probability axioms align with no-arbitrage constraints on state prices (e.g., non-negative prices, summing to discounted present value).  
     - **Fair pricing**: Your "fair value" is vulnerable if inconsistent with the probability simplex.  

  2. **Diachronic Dutch Book**:  
     - **Dynamic hedging**: The exploit resembles delta-hedging strategies where trades at \(t_0\) hedge exposures at \(t_1\).  
     - **Adverse selection**: Updating inconsistently (\(q \neq P(A|E)\)) lets sophisticated counterparties predict your quotes and front-run the update.  
     - **Quote updating**: After learning \(E\), updating quotes to \(q = P(A|E)\) avoids leaving "arbitrage gaps" in the conditional space.  

  #### Parts Requiring Idealization/Distortion  
  1. **Static Book**:  
     - **Single-price assumption**: You quote bid-ask spreads to manage inventory/adverse selection; the argument assumes you trade at a single "fair" price. Distortion: In reality, spreads protect against these exploits, but the argument shows vulnerability *if* you naively trade mid-market.  
     - **Infinite liquidity**: Assumes you take unbounded positions at quoted prices—unrealistic but clarifies theoretical vulnerability.  

  2. **Diachronic Book**:  
     - **Trade-driven information**: Assumes counterparty trades at \(t_0\) don’t alter your beliefs/quotes. Distortion: Real market makers adjust quotes after large trades (inventory risk), breaking the exploit’s assumption.  
     - **Event granularity**: Assumes \(E\) is unambiguously observable and updates instantaneously. Idealization: In practice, events may be fuzzy or entail latency.  
     - **Loss only if \(E\) occurs**: The "sure loss" is conditional on \(E\), not universal. This is weaker than arbitrage (which is state-independent) but still exploitable.  

  #### Parts with No Counterpart in Your Vocabulary  
  1. **Static Book**: None. The argument is native to your framework—it’s a pure arbitrage argument using state claims.  
  2. **Diachronic Book**:  
     - **Betting on conditioning events**: Explicitly pricing conditional bets (e.g., "\(A\) given \(E\)") is rare in real markets. Your "fair value" focuses on observable contracts, not counterfactual bets.  
     - **Belief updating as quote adjustment**: The argument conflates belief updates with quote updates. You update quotes based on risk and flow, not just Bayesian conditioning.  

