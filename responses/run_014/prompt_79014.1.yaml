prompt: |-
  Two camps have spent years arguing past each other about inference to the best explanation. The first holds that explanatory considerations — simplicity, unification, the absence of coincidence — carry evidential weight in their own right: there are cases in which two hypotheses are equally likely on the evidence and equally plausible beforehand, yet the more explanatory one is the one to believe. The second holds that no such weight exists independently: whatever is truth-conducive about explanatory preference must be reconstructible as a claim about likelihoods or about prior probabilities, and whatever resists reconstruction is a heuristic for finding hypotheses rather than a licence to accept them. Draft the joint statement the two could sign after a good-faith collaboration. Neither side may cite, name, or allude to any author or published work; put every position in your own words. Deliver exactly five numbered items and nothing else — no preamble, no closing paragraph, one or two sentences each: (1) the claims both sides will sign, including what they agree they are not disputing; (2) the disagreement that remains, stated once in wording both would accept and once in the wording each side would use for its own view; (3) where each side locates the warrant for explanatory preference — in the likelihoods, in the priors, or in a rule for selecting among hypotheses — and what that implies for a case both agree is real, namely one in which the best available explanation is probably not true because the space of live hypotheses is known to be incomplete; (4) the crux, the sub-question whose settlement would move at least one side, with the case or argument both accept as bearing on it and each side's prediction for it written down in advance; (5) the part of the dispute that is merely verbal, if any, together with your own verdict on which side is right about the real crux. Throughout, make the calls rather than surveying the options: commit to particular formulations, say why you chose them, and give a verdict rather than a menu.
reasoning: |-
  Hmm, the user wants me to draft a joint statement for two camps debating inference to the best explanation. They've outlined exactly five numbered items they want included, with no preamble or closing. This is quite structured!

  I need to understand the core disagreement here. One camp believes explanatory virtues (like simplicity or unification) have independent evidential weight, while the other thinks all such virtues must be reducible to likelihoods or prior probabilities. Both agree that explanatory considerations matter - they just disagree about why they matter.

  For item 1, I'll state what both sides agree on: they both accept that explanatory considerations are truth-conducive and that IBE is rationally important. They're not disputing whether we should prefer hypotheses with greater simplicity, unification, etc., but why we should do so.

  For item 2, I'll present the remaining disagreement in neutral wording: "Whether explanatory virtues provide epistemic warrant independently of their role in characterizing likelihoods or priors." Then I'll give each side's preferred phrasing: the first camp would say virtues are "sui generis warrant" while the second would say they're "derivative features."

  For item 3, I need to specify where each side locates the warrant. The first camp sees it in a distinct rule for hypothesis selection, while the second attributes it to likelihoods or priors. Then I'll address that tricky case where the best explanation probably isn't true because we know we're missing hypotheses. The first camp would still recommend believing it provisionally, while the second would reject it.

  Item 4 needs a crux question that could actually resolve the debate. I'll use the case of known incomplete hypothesis spaces: "Should we believe the best available explanation when we know the space of live hypotheses is probably incomplete?" Both sides agree this case is relevant. I'll predict each side's answer: "Yes" for the first camp, "No" for the second.

  For item 5, I'll identify the verbal dispute: they're using "evidence" differently - the first camp includes explanatory virtues in evidence, while the second restricts evidence to observations. The real crux is the independence question from item 4, and I think the second camp is right - virtues should be traceable to probabilities.

  I'll make sure to use my own words throughout, avoid citing anyone, and keep each item to one or two sentences as requested. This should create a balanced yet decisive statement that captures the essence of this philosophical debate.
answer: |-
  **(1)** Both camps agree that explanatory virtues like simplicity and unification are truth-conducive: hypotheses possessing them are more likely to be true, and inference to the best explanation (IBE) is a rational form of reasoning. They do not dispute the practical necessity or historical success of preferring more explanatory hypotheses.

  **(2)** The disagreement is whether explanatory virtues provide epistemic warrant independently of their role in characterizing likelihoods or priors.
  *   Camp One states: "Explanatory virtues are a *sui generis* source of warrant, distinct from and irreducible to probabilistic features."
  *   Camp Two states: "Explanatory virtues are merely *derivative* features; their warrant must be fully reconstructible within the probability calculus via likelihoods or priors."

  **(3)** Camp One locates the warrant in a distinct rule for hypothesis selection based on explanatory virtue itself. Camp Two locates it exclusively within the probability calculus (likelihoods or priors). In a case where the best available explanation is probably not true due to known incompleteness of the hypothesis space:
  *   Camp One holds we should still provisionally believe the best available explanation.
  *   Camp Two holds we should suspend belief, as the virtues cannot guarantee probable truth under these conditions.

  **(4)** The crux is: "Should we believe the best available explanation when we know the space of live hypotheses is probably incomplete?" Both accept this case bears decisively on the independence of warrant.
  *   Camp One predicts: "Yes, because explanatory virtue provides independent warrant."
  *   Camp Two predicts: "No, because without completeness, virtues don't entail probable truth."

  **(5)** The dispute over whether virtues are "part of the evidence" is verbal; Camp One uses "evidence" broadly to include virtues, while Camp Two restricts it to observation/data. The real crux (item 4) concerns independent warrant. Camp Two is right: virtues must be grounded in probabilities to ensure truth-conduciveness, especially when hypotheses are incomplete, as their warrant is demonstrably contingent on background knowledge captured by priors/likelihoods.
