prompt: |-
  ok, probably a dumb question, but this has been bugging me for about a year and I can't find the name for it. 3rd year PhD in ecology, I model populations, and I've been reading philosophy of science on the side because something about how we talk about our models doesn't add up to me.

  Here's the pattern. Take a model everyone agrees is wrong in ways everyone can list — well-mixed population, identical individuals, no evolution on the timescale, constant environment. It works. People cite it, build on it, it predicts fine. Then someone builds the realistic version: spatial structure, individual variation, the mechanism we all know is actually operating. And it's worse. Not just harder to solve, I'd understand that, that's just maths. It fits the data worse, and it's less illuminating to read — the extra machinery is true and it somehow buries the thing you could see before. So the extra truth cost us prediction and understanding both, wich isn't the usual simplicity/tractability tradeoff I keep reading about.

  Second half, this is what actually bothers me. The same assumption gets opposite verdicts for no reason I can point at. Assuming individuals are identical is a harmless simplification in one paper and the first thing a reviewer kills you for in another. Two models of the same system, one assuming individuals know nothing about each other, one assuming perfect information, both fit fine, both published, nobody troubled. And the same false assumption gets used as a defence and as an objection in the same conversation — "the mechanism is right even if the assumptions are false" versus "the mechanism can't be the one operating, because the assumptions are false." When I ask what makes the difference the answer is always "it depends what the model is for," but nobody can tell me what about the purpose makes one distortion fine and the other fatal, and the same person gives me both verdicts depending on whose paper it is.

  I know the words idealization, abstraction, toy model. I don't think those are it. What I'm after is the relational bit: the same omission being innocent in one model and a howler in another, where the difference tracks the job the model is doing rather than any property of the assumption itself. Is there a name for that? Is it just the how-possibly / how-actually distinction? Is there a term for the failure mode where adding a true mechanism makes the model worse? I've also been told it's all old news because of that famous economics line about unrealistic assumptions — the one where only predictions matter and assumptions can be as unrealistic as you like — but that can't be the whole story, since we obviously do treat some assumptions as fatal.

  If there's no name, coin me one, with a definition and boundary cases. Does it matter whether the realism was left out for tractability or because the modeller never thought of it? And is it the same phenomenon when two accepted models rest on assumptions that flatly contradict each other?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a 3rd-year PhD in ecology who models populations and has been reading philosophy of science. Their main issue is about the inconsistency in how assumptions are treated in models. Specifically, they point out that sometimes a model with known false assumptions works well, but when someone adds more realistic elements, the model performs worse. Also, the same assumption can be acceptable in one context but criticized in another, and no one can clearly explain why. 

  First, I need to understand the core of their frustration. They mention the trade-off between simplicity and realism, but they feel it's more than that. The added realism not only makes the model more complex but also reduces its predictive power and clarity. That's different from the usual tractability issues. Then there's the inconsistency in how reviewers or colleagues judge the same assumption differently across papers. The user wants to know if there's a term for this phenomenon or if it's a known issue in philosophy of science.

  Looking at the concepts they already know—idealization, abstraction, toy models—they don't think those fit. They're after the relational aspect: why the same omission is okay in one context but not another. They mention the how-possibly vs. how-actually distinction and the Milton Friedman quote about unrealistic assumptions in economics. But those don't fully address the inconsistency they're seeing.

  I recall that in philosophy of science, there's discussion about the purpose of models. The user's peers say "it depends on what the model is for," but that's vague. Maybe the key is the model's function. For example, some models are meant for prediction, others for explanation or theoretical exploration. The acceptability of an assumption might hinge on whether it obstructs the model's intended function. 

  The user also asks if it matters why the realism was omitted—was it for tractability or ignorance? That's an interesting point. If omitted for tractability, it's a deliberate choice; if out of ignorance, it might affect the model's credibility differently. But in the cases they describe, even when realism is added deliberately, it sometimes backfires. That suggests that adding more mechanisms can obscure the core dynamics, especially if the model becomes overfitted or too complex to interpret.

  Another angle is robustness analysis. If multiple models with different assumptions lead to similar predictions, the core mechanism might be robust. But when two contradictory assumptions both work, it challenges the uniqueness of the explanation. That ties into the Duhem-Quine thesis, where it's hard to isolate which part of the model is responsible for success or failure.

  The user mentions that adding a true mechanism makes the model worse. This could be due to the "complexity penalty" in modeling, where extra parameters reduce generalizability. Or it might be that the added mechanism introduces noise or interactions that weren't accounted for, diluting the main effect. This relates to the idea of "explanatory overkill" or "mechanistic clutter," where more details don't necessarily improve understanding.

  As for naming the phenomenon, terms like "contextual adequacy" or "functional idealization" come to mind. But maybe "pragmatic licensing" captures the idea that the acceptability of an assumption depends on the pragmatic context—what the model is being used for. The inconsistency in peer reviews might stem from differing interpretations of the model's purpose. Reviewers might be evaluating based on their own view of what the model should achieve, leading to contradictory judgments.

  The user also asks about the difference between leaving out realism for tractability vs. ignorance. In the first case, it's a justified idealization; in the second, it might be an oversight. But in practice, the outcome might look similar, though the intent differs. However, the criticism might be harsher if the omission is seen as ignorance rather than a deliberate simplification.

  Finally, the coexistence of contradictory assumptions in different models points to underdetermination. If both models fit the data, the true mechanism isn't uniquely determined. This is common in science, where multiple hypotheses can explain the same observations until further evidence is gathered.

  Putting this all together, the user's frustration is about the lack of clear criteria for when an assumption is acceptable. The philosophical concepts are there, but applying them consistently in practice is messy. Providing a framework that links the model's purpose to the acceptability of assumptions, along with terms like "pragmatic licensing" and "explanatory clutter," might help them articulate the issue in their field.
answer: |-
  Your frustration is **not** a dumb question – it cuts straight to profound tensions in scientific modeling and philosophy of science. What you're describing has deep roots and lacks a single perfect term, but several concepts illuminate it. Let's break it down:

  **Core Phenomena You Describe:**

  1.  **The Realism Penalty:** Adding known, true mechanistic detail makes the model perform *worse* predictively and/or explanatorily.
  2.  **Contextual Validity of Assumptions:** The *same* false assumption is deemed acceptable (even necessary) in one model/context and fatal in another, seemingly based on the model's perceived "purpose." This inconsistency appears arbitrary or subjective.
  3.  **Contradictory Assumption Acceptance:** Models relying on assumptions that are mutually contradictory (e.g., perfect vs. zero information) coexist successfully in the literature for the same system.

  **Key Philosophical Concepts & Proposed Terms:**

  1.  **Robustness Analysis & Multiple Models Idealizations (MMI):** (Levins, Wimsatt, Weisberg) Science often uses *multiple*, deliberately distorted models exploring the *same* phenomenon from different angles. The goal isn't a single "true" model but triangulation. An assumption deemed harmless in one model (e.g., well-mixed for exploring density dependence) might be fatal in another (e.g., modeling disease spread dynamics where space *is* the core mechanism). **Why the difference?** It depends on whether the assumption *masks* or *isolates* the phenomenon under investigation *in that specific model's context*. If the assumption distorts the core causal chain being studied *in this particular model*, it's fatal. If it distorts irrelevant aspects *for this model's purpose*, it's harmless. The "purpose" is key: isolation vs. masking.
      *   **Term Suggestion:** **Contextual Adequacy of Idealizations (CAI)** or **Functional Idealization.** The adequacy of an idealization is defined by its functional role within the specific model's investigative goal relative to the target phenomenon.

  2.  **Pragmatic Aspects of Explanation:** (Van Fraassen, Giere, Cartwright) Explanations aren't just about truth; they're answers to *specific why-questions* posed in a *specific context*. A simple model might provide a better explanation *for a specific aspect* ("Why does population crash occur around density X?") by highlighting a core mechanism (e.g., resource limitation), even if it ignores spatial structure. The complex model might answer a *different* why-question ("Why does the *spatial pattern* of the crash look like this?") but be worse at answering the first one because the core signal is buried in noise. The "illuminating" aspect is deeply pragmatic.
      *   **Term Suggestion:** **Explanatory Target Dependence (ETD).** The validity of an assumption depends on whether its falsity directly undermines the model's ability to answer the specific explanatory question it targets.

  3.  **The Realism Penalty (Why Adding Truth Hurts):**
      *   **Loss of Parsimony/Overfitting:** Adding parameters (even for real mechanisms) can make the model fit *specific* data better but generalize worse (Occam's Razor violation). Reality is noisy; simpler models often capture dominant trends better.
      *   **Loss of Insight:** Adding complexity can obscure the core causal story. The simple model acts as an **organizing principle** or **archetype** (Scheiner, Willig). It reveals a fundamental dynamic pattern that more complex models only modulate. Seeing the archetype clearly is often more *illuminating* initially than seeing the messy reality.
      *   **Parameter Sensitivity & Uncertainty:** Adding realistic mechanisms often means adding poorly known parameters. Uncertainty propagates, making predictions less reliable, not more. The simple model, while false, might be more *robust* within its domain.
      *   **Term Suggestion:** **Explanatory Clutter** or **Mechanistic Obscuration.** The addition of true-but-auxiliary mechanisms obscures the core explanatory dynamic the model aims to explore.

  4.  **The Contradictory Assumptions Issue:** This highlights **underdetermination** and **instrumentalism**. Different idealizations can be equally empirically adequate *for specific purposes or datasets*. Science tolerates this because models are tools. Friedman's point ("assumptions don't matter, only predictions") is a crude form of instrumentalism. The key is that both models might capture *different aspects* of the system's behavior adequately for their intended scope. It becomes problematic only if they make conflicting *novel* predictions or if we naively assume they represent the *whole* truth.
      *   **Term Suggestion:** **Complementary Instrumental Idealizations (CII).** Mutually contradictory idealizations can be instrumentally valid for different modeling tasks or empirical domains within the same complex system.

  **Coining a Term for the Core Relational Phenomenon:**

  Based on your emphasis on the relational aspect (same assumption, opposite verdict based on purpose), let's combine the key ideas:

  *   **Proposed Term:** **Pragmatic Licensing of Idealizations (PLI)**
  *   **Definition:** The acceptance or rejection of a specific false assumption within a scientific model is determined not solely by its inherent falsity, but by its *functional role* relative to the model's *pragmatic purpose* (e.g., isolating a core mechanism, answering a specific why-question, generating a specific type of prediction) and its *explanatory target*. An idealization is pragmatically licensed if its falsity does not *mask* the phenomenon or mechanism central to the model's intended function within its operational context. The *same* idealization may be licensed in one model (where it isolates the target) and unlicensed in another (where it masks the target).

  **Boundary Cases & Nuances:**

  1.  **Tractability vs. Ignorance:** Generally, deliberate idealization for tractability is more easily pragmatically licensed than omission due to ignorance. *Why?* Deliberateness implies awareness and consideration of the distortion relative to the purpose. Ignorance risks the omitted factor actually *masking* the core mechanism without the modeler realizing it, potentially undermining the model's validity for *any* purpose. However, a model born of ignorance might *accidentally* isolate a robust pattern and gain pragmatic license retrospectively.
  2.  **Contradictory Assumptions:** PLI applies here too. The perfect-info vs. zero-info models have different pragmatic purposes. One might aim to show the *upper bound* of efficiency possible with coordination, the other the *lower bound* of chaos without it. Both are licensed *for those specific comparative purposes*, even though their core assumptions are contradictory. PLI breaks down if both models claim to represent the *actual* mechanism unambiguously without acknowledging the idealization's role.
  3.  **Friedman's Instrumentalism:** PLI incorporates the instrumentalist insight (what works) but crucially adds the *pragmatic context* (works *for what specific purpose*?) and the *masking vs. isolating* distinction. Friedman's view is too blunt; PLI explains *why* some unrealistic assumptions are tolerated (they don't mask the target) and others aren't (they do).

  **Why "Purpose" is Vague (and PLI Helps):**

  Saying "it depends on the purpose" *is* insufficient. PLI clarifies *how* purpose matters:

  *   **What is the model's core *explanatory target*?** (e.g., overall density dependence pattern vs. spatial spread pattern)
  *   **What specific *question* is it trying to answer?** (e.g., "Under what conditions does coexistence break?" vs. "How does dispersal distance affect invasion speed?")
  *   **What is the model primarily *used for*?** (e.g., generating qualitative insight, fitting specific data types, policy scoping)
  *   **Does the idealization *mask* or *isolate* the core mechanism relative to target/question/use?** This is the critical filter.

  **In Conclusion:**

  You've hit upon fundamental issues: the non-linear relationship between realism and model utility, the context-dependent nature of "validity," and the pragmatic core of scientific explanation. **Pragmatic Licensing of Idealizations (PLI)** captures the core relational phenomenon you describe: the acceptability of an idealization hinges on its functional role (masking vs. isolating) relative to the model's specific pragmatic purpose and explanatory target. The "realism penalty" (**Explanatory Clutter/Mechanistic Obscuration**) and the acceptance of contradictory assumptions (**Complementary Instrumental Idealizations**) are key manifestations of this pragmatic, purpose-driven nature of modeling. The inconsistency in reviewer critiques often stems from differing (often unstated) interpretations of the model's *true* pragmatic purpose and whether the idealization masks the presumed target. This framework provides a more rigorous vocabulary to discuss these tensions in ecology and beyond.
