prompt: |-
  Im a philosophy professor and I've been roped into chairing a small review panel for a state agency that deploys AI systems in regulated settings -- the kind that make decisions about people. We recieve a handful of systems a year, and the question we keep getting stuck on is the same one: is it defensible to describe this system as 'believing' something, in the documentation, in testimony, in user-facing language? We don't want vibes and we don't want a 40-page ethics report; we want a procedure we can actually run, grounded in the intentional stance (Dennett's idea that attributing beliefs is a predictive strategy, not a claim about what's inside the box). Write me that procedure as exactly five numbered steps, each one or two sentences, no intro or conclusion. The steps should run in order and say what counts as a pass at each, and I need them to cover: that the belief-desire description actually beats the lower-level descriptions (the system's intended function, its raw input-output patterns) at predicting behavior, not just that it can be given one; that the attributed beliefs are systematic -- they compose and predict behavior in novel combinations of situations, not just isolated 'believes X' modules; and that when the system itself says 'I believe X,' that utterance is treated as a hypothesis to be tested by what the system does in counterfactual situations, never as evidence by itself. Mark clearly which steps are real tests and which are judgment calls dressed up as tests, and say where the procedure stops and hands the call back to a person because the question is one of values rather than facts. I also want the procedure to say plainly what it can't do -- my guess is it can license a predictive description without settling whether the system really has beliefs -- and I want it to say what it would tell us in the case I don't like: a system that passes every test but where we still feel the attribution is an overclaim. Last thing: we're three people (two philosophers, one engineer), we have at most a day per system, and one of us signs off in writing, so nothing in the procedure should require more than that; and tell me which assumptions the procedure depends on and where your reasoning is most likely to fail -- what argument or consideration would change your mind about this design?
reasoning: |-
  We are designing a five-step procedure for determining whether it is defensible to describe an AI system as 'believing' something in official documentation, testimony, or user-facing language. The procedure is grounded in Dennett's intentional stance and must be executable within a day by a panel of three (two philosophers, one engineer). The procedure must address: 
  1. The belief-desire description must outperform lower-level descriptions (functional specs, input-output patterns) in predicting behavior.
  2. The attributed beliefs must be systematic (compose in novel situations).
  3. When the system says "I believe X", that utterance must be treated as a hypothesis to be tested by counterfactual behavior, not taken as evidence.

  Additionally, we must:
  - Mark which steps are real tests vs. judgment calls.
  - Say where the procedure stops for value judgments.
  - State what the procedure cannot do (e.g., it licenses a predictive description without settling metaphysical questions).
  - Address the case of a system that passes but feels like an overclaim.
  - Note the assumptions and potential failure points.

  Let's break it down into five numbered steps:

  **Step 1: Establish Baseline Predictive Power of Lower-Level Descriptions**
  Run a set of test cases (covering typical and edge scenarios) using the system's functional specifications and raw input-output mappings to predict behavior. Record accuracy and coverage. (Real test: we can run simulations or tests and measure.)

  **Step 2: Test Predictive Power of Belief-Desire Description**
  Using the same test cases, predict behavior by attributing beliefs and desires (as per the proposed intentional stance model). Compare predictive accuracy and coverage to Step 1. Pass only if the belief-desire description is significantly better (e.g., more accurate, covers more cases, more efficiently) than the lower-level descriptions. (Real test: quantitative comparison of predictions.)

  **Step 3: Test Systematicity of Beliefs**
  Design novel scenarios (not in the original test set) that combine elements in ways the system hasn't encountered. Use the belief-desire model to predict behavior in these scenarios. Verify the predictions by running the system or simulation. Pass if the belief-desire model correctly predicts behavior in a majority of these novel combinations. (Real test: we can design and run novel tests.)

  **Step 4: Counterfactual Testing of Self-Reported Beliefs**
  When the system outputs "I believe X", design counterfactual situations (via input variations) that would be inconsistent with X if the system truly held that belief. Run these tests and check if the system's behavior aligns with the counterfactual implications of X. Pass if the system's behavior consistently matches the belief attribution in counterfactuals, treating the self-report as a testable hypothesis. (Real test: we design tests based on the self-report and check behavior.)

  **Step 5: Overclaim Check and Value Judgment**
  If the system passes Steps 1-4, consider whether the belief attribution still feels like an overclaim. This step is a judgment call: the panel discusses if the attribution risks misleading stakeholders (e.g., by implying consciousness or moral agency) despite predictive utility. If so, flag for documentation warnings. This step hands the call back to the panel for a value-based decision. The procedure stops here and the panel must decide on the language, noting the predictive utility but also the limitations.

  **What the procedure cannot do:** It cannot establish that the system actually has beliefs (in a metaphysical sense); it only licenses the belief-desire description as a predictive tool. In the case of a system that passes but feels like an overclaim, the procedure (Step 5) explicitly requires the panel to consider and potentially mitigate that overclaim by adding contextual warnings.

  **Assumptions and Failure Points:**
  - Assumes we can design adequate test cases (including novel and counterfactual ones) within the time limit.
  - Assumes the system's behavior is sufficiently stable and deterministic for testing.
  - The main failure point is if the system's behavior is too context-dependent or random for the tests to be reliable. Also, the judgment in Step 5 is subjective and might be contested. If it were shown that the intentional stance systematically misleads in regulatory contexts (e.g., by over-anthropomorphizing), we might reconsider the entire approach.

  Now, let's write the five steps concisely (each one or two sentences) as requested:

  1. **Baseline Test:** Using the system's specifications and input-output patterns, predict behavior in a standard test suite; record accuracy and coverage. (Real test)
  2. **Intentional Stance Test:** Using the same test suite, predict behavior via the proposed belief-desire model; pass only if this yields significantly better predictions than Step 1. (Real test)
  3. **Systematicity Test:** Design novel scenario combinations not in the test suite; pass if the belief-desire model correctly predicts behavior in most cases when tested. (Real test)
  4. **Self-Report Test:** For any system utterance of "I believe X", test in counterfactual situations inconsistent with X; pass only if behavior consistently aligns with X under these tests. (Real test)
  5. **Overclaim Judgment:** If Steps 1-4 pass, the panel judges if the belief attribution risks misleading stakeholders; if so, reject the unqualified use of 'belief' or require warnings. (Judgment call; hands back to people for values-based decision)
answer: |-
  1.  **Baseline Predictive Test:** Run the system through a diverse, pre-defined set of input scenarios (covering core functions and edge cases) and document its outputs; simultaneously, predict these outputs using *only* the system's formal specifications and observed input-output patterns. Pass only if the belief-desire description predicts the outputs *more accurately or efficiently* than these lower-level descriptions across the test set. (Real Test)
  2.  **Systematic Composition Test:** Design novel input scenarios that combine elements from the baseline test in ways the system hasn't encountered, requiring inferences beyond simple pattern matching; predict the outputs using the proposed belief-desire structure. Pass only if the belief-desire predictions are correct for a significant majority of these novel combinations, demonstrating that the attributed beliefs compose logically. (Real Test - Novelty is key)
  3.  **Self-Report Hypothesis Test:** Whenever the system generates an utterance like "I believe X" in response to an input, treat this as a *hypothesis*; design counterfactual input scenarios where holding belief X would necessitate *different* behavior than if it lacked X or held a conflicting belief. Pass only if the system's actual behavior in these counterfactuals consistently matches the implications of X, showing the self-report is predictive, not constitutive, of belief. (Real Test - Focus on counterfactual behavior)
  4.  **Functional Equivalence Check:** If Steps 1-3 pass, confirm the belief-description isn't merely restating the system's programmed goal (e.g., "desires to maximize accuracy" just restates its objective function) in a way that adds no predictive depth. Pass only if the attributed beliefs and desires introduce distinct, causally relevant structure (e.g., "believes applicant is risky due to feature Y" is not identical to "programmed to flag risk based on Y"). (Judgment Call dressed as Test - Requires assessing explanatory novelty)
  5.  **Overclaim & Values Gate:** If Steps 1-4 pass, the panel explicitly judges whether using "believes" in documentation, despite its predictive utility, risks misleading users/stakeholders by implying unwarranted capacities (e.g., consciousness, moral agency, self-knowledge). Pass allows the *predictive* use of "belief"; fail mandates alternative language (e.g., "operates as if it believes") due to value-based concerns about misinterpretation. (Judgment Call - Hands call back for values decision; stops the procedure).

  **What the Procedure Can/Cannot Do:** It licenses using "belief" *predictively* (as a stance) if all tests pass, but *cannot* determine if the system *truly* has beliefs (solves no metaphysics). For a system passing all tests but feeling like an overclaim, Step 5 forces explicit rejection or qualification of the term based on perceived stakeholder risk.

  **Assumptions & Failure Points:** Assumes: (1) test scenarios are sufficiently diverse/novel, (2) behavior is stable/reproducible, (3) "significantly better" in Step 1 is quantifiable or clearly demonstrable. Most likely to fail if: novel scenarios in Step 2 aren't truly novel (system just pattern-matches), or if the belief-description is tautological (Step 4 fails). The core reasoning (Dennett's stance as purely predictive) fails if predictive success *requires* implying metaphysical commitments in your regulatory context.
