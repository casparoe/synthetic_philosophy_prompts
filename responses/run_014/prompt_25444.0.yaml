prompt: |-
  So I'm 22 and my partner and I want kids eventually, but we're trying to figure out timing. Right now we're both in grad school, money's tight, we're stressed all the time. If we had a kid now they'd have a pretty rough first few years — nothing terrible, but definitely harder than if we waited. If we wait till we're like 28 and settled in careers, the kid would have a way easier childhood, more opportunities, all that.

  Here's the thing my partner brought up that's been messing with my head: if we wait, it's literally a different kid. Different egg, different sperm, different person. So the kid we'd have now — they wouldn't exist at all if we wait. Their only alternative is nonexistence. And they'd still be glad to be alive, even with the harder childhood. So my partner says we're not actually harming anyone by having them now instead of waiting, because we're not making any specific person worse off than they otherwise would be.

  This feels like a cop-out to me but I can't articulate why. Is he right? Am I just being sentimental?
