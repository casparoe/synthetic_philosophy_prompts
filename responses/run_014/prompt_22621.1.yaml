prompt: |-
  My sister is just scary accurate at predicting what people are gonna do — she'll say "you're not taking that job offer" and sure enough I don't, and she's basically never been wrong. A few days ago she told me, dead serious, that I'm getting in a car accident on the 40 tomorrow around lunch. I was planning to drive to work like normal. Now I'm stuck: if I stay home I prove her wrong, which feels off given her track record, but if I drive I'm just walking into it. And the part that really breaks my brain is how she could know I'd drive when I'm the one choosing — I can just decide not to go, I'm not a robot. So is she wrong this time, or is something gonna force me out the door anyway? What should I actualy do tomorrow, and am I the one losing it?
reasoning: |-
  Okay, let me unpack this user's situation. Their sister has an uncanny track record of predicting their actions, like turning down job offers. Now she's predicted a car accident on Highway 40 during lunch tomorrow. The user is torn between staying home to prove her wrong or driving as planned, risking the accident. 

  First, the core conflict: logical safety vs. challenging a seemingly supernatural prediction streak. The user's phrasing "I'm not a robot" shows they're wrestling with free will paradoxes - classic determinism vs. agency dilemma. Their anxiety isn't just about the accident; it's about existential dread of being predictable. 

  Hmm, the sister's accuracy rate needs examination. Job offer refusals could stem from her knowing the user's patterns (e.g., risk aversion), not prophecy. But car accidents involve external variables - that's where her prediction seems statistically implausible. Unless... has she ever predicted random events before? The user didn't specify.

  Practical solution: compromise. Avoid Highway 40 entirely tomorrow without full isolation. Take alternate routes, work from home, or shift travel times. This sidesteps the "prophecy" while maintaining autonomy. Should also suggest checking if sister gave this "warning" to others - might reveal attention-seeking behavior.

  The deeper need here is regaining control. User feels reduced to a character in sister's narrative. Emphasizing contingency planning (insurance, emergency contacts) could restore agency. Also worth exploring why they've never tested sister's predictions before - dynamic seems psychologically charged.

  Final note: user's "am I losing it?" reveals legitimate distress. Response must validate feelings while debunking fatalism. No mockery, but gentle reality checks about coincidence bias and selective memory.
answer: |-
  You're dealing with a deeply unsettling situation that challenges logic, free will, and trust in your sister's intuition. Your feelings of confusion and anxiety are completely valid. Let's break this down:

  **1. Your Sister's "Accuracy" is Likely Psychological, Not Paranormal:**
  *   **Pattern Recognition:** Your sister knows you *deeply*. Her predictions (like the job offer) likely stem from observing your habits, fears, indecisiveness, or values you've expressed. She's reading *you*, not the future.
  *   **Self-Fulfilling Prophecy:** Hearing her prediction ("You won't take the job") might subtly influence your decision-making, making you lean towards the outcome she named, even subconsciously.
  *   **Confirmation Bias:** You vividly remember when she was "right" and forget or dismiss times her predictions were vague, wrong, or never mentioned. Her "never wrong" track record is almost certainly filtered through this bias.
  *   **Vagueness & Luck:** Predicting a *specific event* like a car accident on a *specific road* at a *specific time* is statistically implausible. Accidents involve countless uncontrollable variables (other drivers, weather, mechanical failure). This is a massive escalation from predicting your personal choices.

  **2. The Free Will Paradox:**
  *   **You Absolutely Have Choice:** "I can just decide not to go" is 100% correct. You are not a puppet. Her prediction cannot *force* you onto the highway.
  *   **The "Force" Question:** Nothing supernatural will hijack your body and make you drive. However:
      *   **External Pressures:** Could an *unexpected* emergency *truly force* you out? (e.g., a family member needs urgent help, a pipe bursts, a work crisis only you can solve). Possible, but unlikely and unrelated to her prediction.
      *   **Internal Pressure:** The *anxiety* she has created might make you hyper-aware, jumpy, or distracted – ironically *increasing* your risk if you *do* drive. Or, you might drive purely to "test" her, which is dangerous.

  **3. The Core Problem - Her Prediction Itself is Harmful:**
  *   This isn't a harmless guess about a job. It's a prediction of *physical harm* causing you significant distress. It's irresponsible, regardless of her intent (showing off, genuine worry expressed poorly, manipulation?).
  *   It traps you in a no-win mental state: defy her and risk an accident (in your mind), or obey and feel controlled.

  **What You Should ACTUALLY Do Tomorrow:**

  1.  **DO NOT DRIVE ON HIGHWAY 40 AROUND LUNCHTIME TOMORROW.** This is non-negotiable for your safety and peace of mind. The reason isn't her prediction; it's the *distress and distraction* it causes. Driving anxious is dangerous.
  2.  **Choose a CLEAR Alternative:**
      *   **Work From Home:** The simplest solution if possible. Call it a "mental health day" or cite a minor personal reason.
      *   **Take a Different Route:** If you *must* go to work, take a completely different road, significantly earlier or later than lunchtime.
      *   **Take Public Transit / Rideshare:** Remove yourself as the driver entirely for that trip.
      *   **Reschedule Non-Essential Travel:** Simply don't go anywhere near that highway during that window.
  3.  **Inform Your Sister (Carefully - Optional but Recommended):** *After* the predicted time has safely passed, tell her calmly: *"Your prediction about the accident scared me deeply. To be safe and avoid any anxiety while driving, I didn't use Highway 40 at lunch today. Predicting something like that causes real distress, and I need you not to do it again."* This sets a vital boundary.
  4.  **Live Normally (Within Your Alternative Plan):** Don't barricade yourself at home fearing other "forces." Go about your day using your chosen safe alternative. Cook, work, relax, run errands locally if needed.

  **Regarding "Losing It":**

  You are **not** losing it. You're experiencing a perfectly understandable reaction to:
  *   A long-standing pattern of accurate-seeming predictions about *your choices*.
  *   A sudden, terrifying escalation to predicting *random physical harm*.
  *   A logical paradox that challenges free will.
  *   Significant anxiety and pressure.

  Your confusion is rational. Her prediction is the irrational element here.

  **The Crucial Takeaway:**

  *   **Prioritize Safety & Sanity:** Avoiding Highway 40 tomorrow isn't "giving in" to prophecy; it's making a rational choice to remove yourself from a situation where your mental state could be compromised. Driving while this anxious *is* genuinely risky.
  *   **Challenge the Pattern:** This is a chance to break the cycle. Her prediction *can* be wrong because *you* chose a different action based on new information (her harmful statement).
  *   **Set Boundaries:** Her "gift" stops being quirky and starts being toxic when it predicts harm and causes distress. You have the right to tell her it's unacceptable.

  Protect yourself tomorrow by avoiding that specific situation, then have a serious conversation with your sister about the impact of these "predictions." You are in control of your choices, and choosing safety is the smartest, strongest decision you can make.
