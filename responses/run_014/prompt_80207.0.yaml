  Hmm, the user presents a sophisticated critique of the wisdom-of-crowds analogy and its application across juries, referendums, and AI systems. They're clearly well-versed in social epistemology and want a rigorous audit of Condorcet's assumptions. 

  First, I need to unpack their core request: they want a correspondence table mapping Condorcet's conditions (independence, competence threshold, facticity, majority rule) to real-world institutions, followed by an analysis of where the mapping fails. The key institutions they care about are deliberative juries (with interdependence), policy referendums (without clear facts), and AI sampling (with shared biases). 

  The user's depth suggests they're either an academic or policy analyst working on collective decision-making. Their frustration with superficial applications of Condorcet is palpable - especially regarding AI systems where "majority voting" might be theater. Two stress tests reveal their priorities: 
  1) What happens when the median voter is incompetent? 
  2) Does AI sampling provide any real epistemic gain? 

  For the correspondence table:
  - "Independent voter" maps poorly to jurors who deliberate (interdependence breaks independence), referendum voters sharing media biases, or AI samples from identical models. 
  - "Competence threshold" is shaky for juries (emotional jurors) and referendums (complex policy trade-offs lack "correct" answers). Only AI might technically satisfy p>0.5... but shared biases could make p<0.5. 
  - "Fact of the matter" holds for juries (guilt exists) but not referendums (subjective welfare trade-offs). 
  - Majority rule is literally implemented everywhere discussed. 

  The critical breaks are interdependence (juries/AI) and facticity (referendums). These directly undermine the conclusion that bigger/more independent groups are wiser. 

  Stress test insights: 
  1) When median competence p<0.5, adding voters makes outcomes worse - the opposite of Condorcet's promise. This reversal matters for polarized societies where misinformation dominates. 
  2) For AI samples, majority voting only helps if randomness creates meaningful diversity. With high-temperature sampling, it can slightly improve accuracy; with low temperature, it's mostly theater. Shared biases cap collective competence below what independence would allow. 

  The wisdom-of-crowds analogy crumbles under its own weight in these cases. A better framework would be:
  - For juries: structured deliberation that surfaces diverse perspectives without herding 
  - For referendums: admit it's about legitimacy, not truth-seeking 
  - For AI: use majority voting only with high-temperature sampling, but combine with uncertainty quantification 

  Ultimately, the user needs to hear that collective accuracy depends on system design that cultivates genuine cognitive diversity - not just adding warm bodies or model samples. The real lesson is that wisdom emerges from how we structure differences, not from mere aggregation.
answer: |-
  This is a rigorous audit of the wisdom-of-crowds analogy, dissecting where the Condorcet Jury Theorem (CJT) holds and where it fractures in real-world applications. We'll follow your structure precisely.

  ### **Correspondence Table: CJT Assumptions ↔ Real Institutions**
  | CJT Assumption           | Criminal Jury                          | Policy Referendum                      | AI Model Sampling                      |
  |--------------------------|----------------------------------------|----------------------------------------|----------------------------------------|
  | **Independent voters**   | Jurors' initial private votes          | Citizens' private ballots              | Repeated stochastic samples            |
  | **Competence threshold** | Juror accuracy >50% pre-deliberation   | Voter understanding > random chance    | Model's per-sample accuracy >50%       |
  | **Fact of the matter**   | Defendant's factual guilt/innocence    | *Nonexistent* (subjective optimal policy) | Objective answer in training data     |
  | **Majority rule**        | Unanimous/supermajority verdicts       | Simple majority wins                   | Majority vote over samples             |

  ---

  ### **Where the Mapping Breaks (and Why It Matters)**
  #### **1. Independence Assumption**
  - **Break**: Real voters/jurors/AI samples are **interdependent**.
    - *Juries*: Deliberation creates groupthink, authority bias (e.g., hung juries follow dominant jurors).
    - *Referendums*: Voters share media ecosystems → correlated errors (e.g., Brexit misinformation cascade).
    - *AI Sampling*: Samples from one model share weights/training data → identical blind spots (e.g., all samples ignore rare-edge cases).
  - **Impact**: **Fatal for CJT conclusion**. CJT requires uncorrelated errors to "wash out." Interdependence amplifies systemic errors. Larger groups may perform *worse* if biases are shared.

  #### **2. Competence Threshold**
  - **Break**: Median competence often **<50%** in practice.
    - *Juries*: Emotional bias, complex evidence (e.g., DNA statistics misunderstood by 80% of jurors).
    - *Referendums*: Voters lack technical expertise (e.g., EU policy trade-offs).
    - *AI Sampling*: If base model is biased (e.g., medical AI trained on non-diverse data), all samples replicate errors.
  - **Impact**: **Reverses CJT's guarantee**. When median *p*<0.5, majority accuracy *decreases* as group size increases (see stress test below).

  #### **3. Fact of the Matter**
  - **Break**: Only criminal juries have a binary ground truth.
    - *Referendums*: "Optimal policy" depends on values/trade-offs (e.g., "Is austerity better?" has no objective answer).
    - *AI Sampling*: Ambiguous queries ("Is this art offensive?") lack verifiable answers.
  - **Impact**: **Undermines CJT's purpose**. CJT assumes a "correct" answer to converge upon. Without it, majority opinion is preference aggregation, not truth-tracking.

  #### **4. Majority Rule**
  - **Break**: Real institutions use supermajorities (juries) or delegate to representatives.
  - **Impact**: **Cosmetic**. CJT can extend to supermajority rules, but misalignment with binary majority voting weakens the analogy.

  ---

  ### **Stress Tests**
  #### **1. Median Competence <50%**
  - **CJT Result**: If each voter's accuracy *p*<0.5, majority accuracy **decreases exponentially** as *n* grows. For large *n*, the probability of correct majority vote → **0%**.
  - **Implication**: Adding voters *reduces* accuracy if the average voter is misinformed. This is common in:
    - Referendums on technical issues (e.g., California's Proposition 8 on gene therapy funding).
    - Biased AI models (e.g., face recognition systems with higher error rates for darker skin tones).

  #### **2. Non-Independent AI Samples**
  - **Epistemic Value**: Majority voting over samples:
    - **Helps minimally** if randomness (e.g., high-temperature sampling) creates diversity *within* the model's capability. Reduces variance but not bias.
    - **Fails** if model has systematic errors (e.g., all samples hallucinate the same fact). Here, majority voting creates a **false sense of reliability**.
  - **Quantitative Limit**: For *k* samples with correlation *ρ*, effective independent voters ≈ *k*/(1+*ρ*(k-1)). If *ρ*=1 (identical samples), majority voting = single sample.

  ---

  ### **Does the Conclusion Survive?**
  The claim that "*bigger, more independent groups are more accurate*" **fails in precisely the deployed settings**:
  - **Juries**: Deliberation breaks independence → no wisdom gain from size.
  - **Referendums**: No fact of the matter + correlated errors → majority reflects herd bias, not truth.
  - **AI Sampling**: Shared biases cap accuracy → adding samples asymptotes to model's limit, not perfection.

  **Conclusion**: CJT holds only on a **knife-edge**:
  - Binary ground truth.
  - Voters independent *and* median *p* > 0.5.
  - No systemic biases.

  These are violated in all target cases. The analogy obscures more than it reveals.

  ---

  ### **A Better Account of Judgment Aggregation**
  To actually improve accuracy:
  1. **Diversify inputs**: For juries, use structured deliberation with devil's advocates. For AI, ensemble diverse models (not samples).
  2. **Calibrate competence**: Pre-training jurors; voter education; AI uncertainty quantification.
  3. **Aggregate differently**: For ambiguous questions (referendums), use deliberation + expert panels. For AI, use Bayesian weighting by confidence scores.
  4. **Mitigate interdependence**: Isolate initial votes; use prediction markets for correlated signals.

  **Wisdom emerges not from majority votes, but from architectures that force cognitive diversity and error correction**. The crowd is only wise when its errors are *orthogonal*—a condition destroyed by shared information or deliberation without structure.
