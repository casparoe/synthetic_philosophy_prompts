prompt: |-
  I keep running into a family of decision problems that all seem to want the same repair, and I want to know whether the repair has a name.

  The first: I am choosing in a situation where something that happened before I was born — a process that modeled me well enough to predict what I would choose — has already fixed how the world will treat me. The option that looks best given what I can see is not the one that looks best in the worlds where the prediction went that way, and oddly it is the latter that I find myself caring about. The second: I would do better over a lifetime if I were the kind of person who cannot be pushed around, even though being that kind of person costs me in the particular case where someone tries to push. The third, which is the one I cannot make sense of: a friend insists that if I meet a stranger who decides by exactly the same procedure I do, working from different information, then that stranger's decision is my decision — so I should cooperate with them in a one-off prisoner's dilemma, and care about what happens to them the way I care about my own future.

  What unites them, I think, is that in each I do better by giving up the question "what should I do now, given what I know?" and asking instead "what rule would I have wanted to have chosen, from before I knew which of these situations I would land in?" — then following that rule even where its local advice is worse. I can see how this sits close to two things I already have some grip on: the idea that your own choice is itself evidence about how the world is, and the ordinary business of binding yourself in advance so that others can see you are bound. But neither is the thing I am after: the first still has me reasoning from inside my situation, and the second needs someone to actually see the commitment.

  Is there a name for this? If so I want the carving, not just the label: how it differs from each of those two neighbours, and which of my three cases it really covers. I suspect the second is a different animal, and that the third is the same animal pushed further than I expected, but I would like to be told whether that is right, and why.
reasoning: |-
  Hmm, the user is describing a family of decision problems that all seem to require the same kind of "repair" to standard decision theory. They've presented three specific scenarios where conventional "what should I do now given what I know" reasoning leads to suboptimal outcomes, and they've noticed that in each case, they do better by asking "what rule would I have wanted to choose before knowing my specific situation."

  The user wants to know if this repair has a name, and more importantly, wants a clear conceptual carving of what this approach is - how it differs from evidential decision theory (where your choice is evidence about the world) and commitment strategies (where you bind yourself visibly to others). They're particularly interested in whether their three cases are actually covered by the same approach.

  I recognize these scenarios. The first is Newcomb's Paradox with perfect prediction, the second is the commitment problem in game theory, and the third is the timeless decision theory approach to symmetric prisoner's dilemmas. What unites them is indeed this shift from local optimization to global rule selection.

  The core concept here is updatelessness - making decisions from a perspective before you know your particular position in the decision problem. This differs from evidential decision theory because EDT still updates on your situation, while UDT doesn't treat your position as informative. It differs from commitment strategies because it works even with no observers - it's about internal consistency across possible selves.

  For their three cases: The first (Newcomb's) is the classic UDT scenario. The second (commitment) might seem different, but actually becomes UDT-relevant if framed as choosing a disposition before knowing which interactions you'll face. The third (symmetrical PD) is UDT's flagship application - where you coordinate with your "logical clones" by choosing a strategy that works well across all possible information states.

  The user's intuition is sharp - the second case is indeed the same animal (UDT) applied to a different problem structure, and the third is UDT pushed further into logical coordination rather than just probabilistic correlation. Their suspicion about the second case being different is understandable but ultimately not correct - it's UDT in a game-theoretic rather than predictor-based scenario.

  I should emphasize that UDT isn't just about precommitment - it's about optimizing the mapping from information states to actions, where the information state includes your "location" in the decision problem. This creates the "acausal" cooperation in the third scenario - not because you're bound, but because the same decision rule is being executed in multiple contexts.
answer: |-
  Your insight is profound, and the "repair" you've identified has a name: **Updateless Decision Theory (UDT)**. It's a framework developed primarily by Wei Dai and further refined by researchers like Eliezer Yudkowsky to handle exactly the family of problems you describe. UDT fundamentally shifts the locus of decision-making.

  Here's the carving you requested, including distinctions and coverage of your cases:

  ### Core Idea of Updateless Decision Theory (UDT)
  1.  **The Shift:** Instead of asking "What action maximizes utility *given my current knowledge and situation*?" (the perspective of **Causal Decision Theory (CDT)** and **Evidential Decision Theory (EDT)**), UDT asks: **"What *decision rule* (a function mapping possible information states to actions) would have maximized my expected utility *before I knew which specific situation I would find myself in*?"**
  2.  **"Updateless" Meaning:** It refuses to "update" on the specific fact of *which particular agent-instance you are* or *which specific information you have* when evaluating the rule. You evaluate rules based on their performance *across all possible agent-instances/contexts that could result from the process creating you/your decision*.
  3.  **The Output:** You pre-commit to the optimal decision rule *ex ante* (before knowing your specific role/location/information). You then *follow* that rule unconditionally, even in situations where the rule prescribes a locally suboptimal action *for your specific instance*.

  ### How UDT Differs from Its Neighbors
  1.  **Vs. Evidential Decision Theory (EDT - "Choice as Evidence"):**
      *   **EDT:** Reasons from *within* the updated state. It asks, "Given that I see X and am choosing A, what does this imply about the world (via correlation), and what is my expected utility *conditional on choosing A*?" It cares about the evidence your choice provides about hidden states.
      *   **UDT:** *Ignores* the evidential impact of the choice *from the perspective of the specific instance*. It cares about the *global performance of the rule* across all instances. Your specific choice isn't evidence *for you* about the world in a way that changes the optimality of the *rule*; the rule was chosen *before* you had that evidence (the specific role/location).
      *   **Key Difference:** EDT updates on "I am *this specific agent* making *this specific choice*" and calculates conditional expectations. UDT evaluates rules *before* that update happens. UDT handles Newcomb-like problems (your 1st case) by ignoring the tempting EDT-like correlation ("If I one-box, it's evidence the Predictor predicted I would, so I get the million") because the rule ("always one-box") was chosen for its performance across *both* predicted-one-box *and* predicted-two-box worlds.

  2.  **Vs. Commitment/Precommitment (Binding Yourself):**
      *   **Commitment:** Relies on *external observability and enforcement*. You bind yourself visibly *so that others can see it and react accordingly*. Its power comes from changing *others'* expectations and actions based on your credible commitment. (Your 2nd case works via this mechanism).
      *   **UDT:** Is an *internal* decision algorithm. It requires *no external observer* and works even in situations of complete isolation or where commitment is impossible. Its power comes from optimizing the rule *across the structure of the decision problem itself*, including how the rule performs in different "slots" or against other agents running similar reasoning (your 3rd case).
      *   **Key Difference:** Commitment changes the *game* by altering other players' strategies. UDT changes how *you* select your strategy *function* to perform well across the *entire* game tree/multi-agent structure, regardless of observability. Commitment is a *tool* sometimes used *by* the UDT rule (e.g., "Adopt the rule: Become committedly tough").

  ### Application to Your Three Cases
  1.  **The Predictor Problem (Newcomb's Paradox):**
      *   **UDT Solution:** Before knowing *anything* (including whether the Predictor predicted one-boxing or two-boxing), you evaluate decision rules. Rule "Always one-box" leads to $1,000,000 in the worlds where you were predicted to one-box, and $0 in worlds where you were predicted to two-box (but you one-box anyway). Rule "Always two-box" leads to $1,001,000 in worlds predicted to one-box, and $1,000 in worlds predicted to two-box. *Given the Predictor's accuracy*, the expected utility of "Always one-box" is vastly higher *across all possible prediction worlds* than "Always two-box". You pre-commit to "Always one-box". You follow it, getting $1,000,000, even though *in the specific situation where you find yourself choosing*, two-boxing *seems* to offer $1,000 more locally (if you ignore the rule's global performance). **UDT covers this perfectly.**

  2.  **The Commitment Problem ("Be Tough"):**
      *   **Analysis:** This *is* UDT, framed as choosing a disposition (rule) for how to act in bargaining/conflict situations *before* knowing the specific situations you'll face or who will try to push you. You evaluate rules: Rule "Always cave" gets exploited whenever someone pushes. Rule "Always fight" loses the small cost whenever someone pushes but deters pushing. Rule "Be rational case-by-case" (CDT) caves when pushed because fighting is costly *in that instance*, leading to you being pushed and exploited. *Ex ante*, before knowing which interactions you'll have, the rule "Always fight" (or "Fight if pushed") has the highest expected utility because it deters most pushing attempts. You pre-commit to *being* that tough person and follow the rule. **This is UDT.** Your suspicion that it might be different stems from the fact that external observability *enhances* the deterrent effect, but the core UDT reasoning – choosing the disposition/rule for its global performance before knowing the specifics – applies even if the commitment were purely internal (though internal commitment is harder to enforce/credible without observability).

  3.  **The Identical Stranger / Logical Coordination (Prisoner's Dilemma):**
      *   **UDT Solution:** This is UDT's flagship application. Before knowing *anything* (including whether you are "You" or the "Stranger", or what information each of you has), you evaluate decision rules. Crucially, since both agents use the *identical* decision procedure (rule), you are effectively choosing a rule that will control *both* agents. Rule "Always Cooperate" yields (R, R). Rule "Always Defect" yields (P, P). Rule "Conditional on being Agent 1: Defect; Agent 2: Cooperate" is nonsensical because the rule is identical and doesn't know "who" it is. The only consistent, identical rules are "Always Cooperate" or "Always Defect". (R, R) is better than (P, P). Therefore, the optimal identical rule is "Always Cooperate". You pre-commit to this rule. When you meet the stranger, you both execute the same rule and cooperate. **UDT covers this perfectly and fundamentally resolves it.** The "stranger's decision is my decision" intuition captures the core UDT idea: you are selecting the *output of the decision procedure* that will be applied in *both* locations. Caring about them is rational because the *ex ante* chosen rule optimizes *joint* (or at least, symmetric) outcomes. This is "acausal cooperation" based on logical identity of decision processes.

  ### Conclusion
  *   **The Name:** The repair is **Updateless Decision Theory (UDT)**.
  *   **The Carving:** UDT selects optimal *decision rules* (mappings from information states to actions) *before* updating on the specific "indexical" fact of *which* agent-instance/information-state you occupy within the problem structure. It then follows the rule deterministically.
  *   **Differences:**
      *   Vs. **EDT:** UDT ignores the evidential impact *from the perspective of the specific instance*; it cares about the rule's global average performance.
      *   Vs. **Commitment:** UDT is an internal algorithm for rule selection based on global performance; commitment relies on external observability/enforcement to alter others' behavior. Commitment can be a *consequence* of a UDT rule.
  *   **Coverage of Your Cases:**
      *   **Case 1 (Predictor):** Pure UDT application.
      *   **Case 2 (Commitment/Toughness):** UDT application (choosing the dispositional rule *ex ante*). While external commitment enhances it, the core reasoning is UDT. Your suspicion it might be different is understandable but incorrect; it's UDT applied to a repeated/strategic interaction context.
      *   **Case 3 (Identical Stranger PD):** The quintessential UDT application, demonstrating "logical" or "acausal" cooperation based on identical decision procedures. It's not "pushed further than expected"; it's the core paradigm UDT was designed for. Your friend's intuition is precisely the UDT perspective.

  UDT provides a unified framework for reasoning rationally in situations involving predictors, strategic commitment problems where your type matters, and coordination with logical clones or identical decision-makers, precisely by shifting to the "rule selection from behind the veil of ignorance" perspective you intuitively grasped.
