prompt: |-
  So I got talked into sitting on a standing franchise-and-elections commission in my city. Seven of us, and I'm the only philosopher, which apparently makes me "the theory person." We get four to six proposals a year and now neighboring towns send us theirs too, so whatever I bring needs to be something the others can run without me in the room. The commission is a city clerk, a retired probate judge, a high-school civics teacher, two neighborhood-association types and a small-business owner. None of them will read political theory and I'm not handing anyone a bibliography, so the reasoning has to live inside the procedure itself.

  The current stack of three, which public comment keeps conlfating:
  1. votes at 16 for city council and school board;
  2. local voting rights for non-citizen residents with three or more years in the city;
  3. compulsory voting in city elections, enforced by a $25 fine.

  Give me a procedure we can run on any franchise proposal in about half an hour at a monthly meeting: the questions in order, what counts as a good enough answer to each, where a proposal gets stopped with a flat "no," and where we have to admit the question is about values and hand it to a vote rather than pretending the procedure settled it. It should start by sorting the proposal, because I don't think these three are the same kind of question at all — two are about who's inside the demos and one isn't about the boundary but about whether voting can be demanded of people who are already inside. If you think that sort is wrong, say so and give me a better one. Any term of art you can't avoid, define in one line; this thing gets read aloud at a public meeting.

  Then it has to face what I can't get around in my own head: any rule about who belongs in the demos is itself a rule that only some demos can make, so we can't fix the boundary democratically without going in circles. The procedure has to be explicit about what it's treating as settled before politics starts, instead of smuggling that in at step two.

  It also has to handle the over-inclusion slide. If the test is "everyone affected gets a say," our zoning decisions entitle people three states over plus people not yet born, and we have no stopping rule. And I want something specifically about age: age is odd because unlike race or sex everybody passes through it if they live, so the excluded aren't a standing caste, they're a rotating one. Does that genuinely make the exclusion less objectionable, or am I comforting myself?

  Same treatment for the compulsary one, where the interesting bits to me are whether a $25 fine is a penalty or just a price, and whether the usual case for compulsion (turnout gaps track income, so forcing everyone to vote helps the poor) survives the fact that the fine lands hardest on those same people.

  Run it on all three. Don't rig it for me: I've said publicly that I favor votes at 16 and I'm against compulsion, so if the procedure sinks one of my positions or rescues the other, write that down, name the step that did it, and say why. Finish by marking which steps are judgment calls in a procedural costume, and by listing what this procedure simply cannot decide — the points where I'll have to stand up and tell a room full of people that we have no method.
reasoning: |-
  Hmm, the user is part of a franchise-and-elections commission with six other members who aren't political theory experts. They need a practical 30-minute procedure to evaluate franchise proposals that can be used without them present. There are three current proposals: voting at 16, non-citizen voting, and compulsory voting with fines. 

  The user has several deep concerns: First, the circular problem of defining the demos democratically. Second, the "over-inclusion slide" where "affected interests" could expand infinitely. Third, the unique nature of age-based exclusion as temporary rather than permanent. Fourth, whether compulsory voting fines function as penalties or taxes and their equity implications.

  They want the procedure to clearly distinguish between technical questions (which can be settled by analysis) and value judgments (which require voting). The procedure must also expose its own foundational assumptions rather than smuggling them in. For the three proposals, they want me to run the test neutrally even if it contradicts their personal positions (pro votes at 16, anti-compulsion).

  Key challenges include designing a framework that: 
  - Separates boundary questions (who votes) from obligation questions (must vote)
  - Handles the demos paradox explicitly
  - Creates stopping rules against infinite inclusion
  - Differentiates empirical from normative questions
  - Works for non-theorists using plain language

  The procedure should start by categorizing proposals because the three current items aren't logically parallel. Boundary questions (1 and 2) require different tests than obligation questions (3). Age exclusions deserve special consideration due to their temporary nature. Compulsory voting needs analysis of both effectiveness and fairness.

  For each proposal type, the steps must flag when analysis ends and value judgments begin. The commission needs clear off-ramps for non-viable proposals (e.g., if non-resident voting fails the residency test) and transparency about where the procedure can't decide (e.g., fundamental disagreements about citizenship or autonomy).

  The user's meta-request is crucial: I must note where the procedure sinks or saves their positions and identify which steps do so. Also, explicitly mark which steps are value judgments disguised as procedure, and where the framework falls silent.
answer: |-
  Here's a procedural framework designed for your commission. It runs in 30 minutes, requires no theory background, sorts proposals by type, exposes its own foundations, and flags value judgments. Key terms are defined operationally.

  **Franchise Proposal Evaluation Procedure (30 min max)**

  **Step 1: Categorize the Proposal (2 min)**
  *   **Question:** *Is this about WHO can vote (Boundary Question) or about REQUIRING those who can vote to do so (Obligation Question)?*
  *   **Boundary Question (BQ):** Changes who is *eligible* to vote (e.g., Votes at 16, Non-citizen voting).
  *   **Obligation Question (OQ):** Requires *eligible* voters to cast a ballot (e.g., Compulsory voting).
  *   **Sorting:** Proposals 1 & 2 are BQs. Proposal 3 is an OQ. Your sort is correct and necessary – they demand different tests.
  *   **Stop/Go:** Proceed to Step 2A for BQs, Step 2B for OQs.

  **Step 2A: Boundary Question Test (BQ) - For "WHO can vote?" (15 min)**
  *   **Q1: Residency Link (Gatekeeper):** *Does the proposal require voters to be current residents of the city?* (Resident: Physically lives here as primary home).
      *   **Good Answer (Yes):** Proceed to Q2. (Ensures local elections decide local issues).
      *   **Stop (No):** Proposal fails. City elections are for residents governing their shared community. (Settles "demos" foundation: City = Resident body).
  *   **Q2: Exclusion Justification (Empirical Burden):** *Is there clear, current evidence the excluded group uniquely lacks the capacity or interest relevant to local voting?* (Capacity: Basic understanding of choices; Interest: Stake in local outcomes).
      *   **Good Answer (No Evidence):** Proceed to Q3. (Presumption for inclusion unless proven otherwise).
      *   **Stop (Strong Evidence):** Proposal *may* fail, but flag for Value Vote later. (Rare, e.g., severe cognitive incapacity uncontroversially established).
  *   **Q3: Age Exclusion Specifics (If applicable):** *If excluding based on age, is the exclusion temporary (all pass through) and tied to a clear, practical administrative line?* (Temporary: Everyone excluded would become eligible if they live long enough).
      *   **Good Answer (Yes & Yes):** Proceed to Value Vote. (Acknowledges age's uniqueness but doesn't resolve fairness).
      *   **Stop (No):** Proposal fails. Permanent age-based exclusion creates a fixed underclass. (Settled principle: No permanent caste exclusion).
  *   **Q4: Over-inclusion Check (Gatekeeper):** *Does the proposal extend voting to groups demonstrably *not* subject to the city's primary governing authority?* (Primary Governing Authority: Laws, taxes, services directly imposed/provided by the city).
      *   **Good Answer (No):** Proceed to Value Vote. (Stopping rule: Limits "affected interests" to those governed).
      *   **Stop (Yes):** Proposal fails. Voting requires being governed by the body being elected. (Settles "demos" foundation: Governed → Vote).
  *   **Outcome:** If not Stopped, the BQ advances to a Commission **Value Vote**. The procedure confirms residency/being governed are prerequisites but cannot resolve *which* residents/governed should be included beyond that – that's a value choice about community membership.

  **Step 2B: Obligation Question Test (OQ) - For "MUST you vote?" (15 min)**
  *   **Q1: Effectiveness Claim (Empirical Burden):** *Is there strong, local or highly comparable evidence that the specific obligation (e.g., fine amount, enforcement) will significantly increase turnout *and* achieve its stated goal (e.g., reduce turnout inequality, improve legitimacy)?*
      *   **Good Answer (Yes + Evidence):** Proceed to Q2. (e.g., Data from similar cities showing fine-based compulsion closed income turnout gaps).
      *   **Stop (No Evidence/Contradictory Evidence):** Proposal fails. Burden not met; policy likely ineffective or counterproductive.
  *   **Q2: Burden Equity Test (Gatekeeper):** *Does the obligation or penalty fall disproportionately on residents based on protected class (race, religion, etc.) or unavoidable economic disadvantage?* (Unavoidable Economic Disadvantage: Very low income, essential caregivers, severely disabled).
      *   **Good Answer (No Disproportionality):** Proceed to Q3. (Requires analysis of fine impact vs. income, enforcement patterns).
      *   **Stop (Yes, Disproportionality):** Proposal fails. Creates unequal burden, undermining fairness.
  *   **Q3: Coercion Level Check:** *Is the penalty for not voting a minor administrative fee (like a parking ticket) or does it involve significant sanctions (jail, large fines, loss of essential services)?* (Significant Sanction: Threatens fundamental liberty or welfare).
      *   **Good Answer (Minor Fee):** Proceed to Value Vote. ($25 fine likely clears this bar as a "price").
      *   **Stop (Significant Sanction):** Proposal fails. Excessively coercive for a civic act.
  *   **Outcome:** If not Stopped, the OQ advances to a Commission **Value Vote**. The procedure tests effectiveness and basic fairness but cannot resolve whether voting *should* be an obligation – that's a value choice about civic duty vs. liberty.

  **Step 3: Value Vote (If Reached) (5 min)**
  *   Commission votes on the proposal. The procedure has done its job: filtered out non-viable proposals and clarified the core value judgment left to the elected/appointed representatives.

  **Running the Three Proposals:**

  1.  **Votes at 16 (BQ):**
      *   Q1 (Residency): Yes (16-year-olds are residents). GO.
      *   Q2 (Exclusion Justification): *No Evidence* 16-year-olds uniquely lack basic capacity/interest in *local* issues (schools, parks, jobs). Burden not met. GO.
      *   Q3 (Age Specifics): Yes (Temporary), Tied to admin line (age 16). GO.
      *   Q4 (Over-inclusion): No (16-year-olds are governed/residents). GO.
      *   **Outcome:** Advances to Value Vote. **Procedure SAVES your position.** Step 2A-Q2 sank the *exclusion* justification, leaving inclusion as the viable path. The procedure forced the burden onto those arguing *against* 16-year-olds voting.

  2.  **Non-citizen Voting (BQ):**
      *   Q1 (Residency): Yes (3+ yr residents). GO.
      *   Q2 (Exclusion Justification): *Evidence?* Capacity/Interest likely similar to citizens. Burden against inclusion likely not met. GO.
      *   Q3 (Age): N/A.
      *   Q4 (Over-inclusion): **Stop.** Non-citizen residents *are* subject to the city's primary governing authority (laws, taxes, services). *They are governed here.* Q4 asks if the group is *not* governed. They *are* governed. **GO** to Value Vote. (Clarification: Q4 stops proposals including *non*-governed people, like non-residents. This proposal only includes governed residents).
      *   **Outcome:** Advances to Value Vote. The procedure confirms residency/being governed are met. It cannot decide if citizenship *should* be an additional requirement – that's the core value judgment.

  3.  **Compulsory Voting (OQ):**
      *   Q1 (Effectiveness): *Evidence?* Does $25 fine close *local* income turnout gaps? Mixed global data; effectiveness in *this* context is uncertain. Local evidence likely lacking. **Stop.** Burden not met. *Likely Outcome: Proposal FAILS.*
      *   **Procedure SINKS your position.** Step 2B-Q1 stopped it on effectiveness grounds, *before* reaching your equity concern (Q2). Even if it reached Q2: "Does $25 fine disproportionately burden low-income?" *Yes.* Essential cost for them. **Stop at Q2** also likely. Your equity concern would sink it too, but Q1 got there first.

  **Judgment Calls in Procedural Costume (Where the "test" masks values):**
  *   **Step 2A-Q2:** Defining "capacity/interest relevant to local voting" involves judgment. What level is "basic"?
  *   **Step 2A-Q3:** Judging if an age line is "practical" or arbitrary.
  *   **Step 2B-Q1:** Judging what constitutes "strong, comparable evidence" of effectiveness.
  *   **Step 2B-Q2:** Defining "unavoidable economic disadvantage" and "disproportionately."
  *   **Step 2B-Q3:** Distinguishing "minor fee" vs. "significant sanction" ($25 is borderline).

  **What the Procedure CANNOT Decide (Where You Have No Method):**
  1.  **The Foundational Demos Boundary:** The procedure *starts* by assuming the demos = residents subject to city authority (Steps 2A-Q1 & Q4). It *cannot* justify this democratically; it is the pre-political starting point. You must state: "Our authority is limited to proposals about *city residents* governed *by the city*. We cannot redefine the fundamental 'we' of the city itself."
  2.  **Core Membership Values:** For BQs passing the tests, the procedure *cannot* decide if long-term residency trumps citizenship (Proposal 2), or if 16 is the 'right' age vs. 17 or 15 (Proposal 1). You must say: "These tests ensure the proposal is viable, but the final decision rests on your values about who belongs in our community."
  3.  **The Duty vs. Liberty Balance for OQs:** If an OQ passed Q1-Q3, the procedure *cannot* resolve if voting *should* be mandatory. You must say: "The proposal meets practical tests, but whether voting is a duty enforceable by fine, or a right that includes abstention, is a fundamental value choice for the commission."
  4.  **The Moral Weight of Temporary Exclusion:** The procedure notes age exclusion is different (Step 2A-Q3) but *cannot* tell you if it's "less objectionable." You must say: "While everyone ages, excluding younger residents still denies them a voice now. Whether this temporary exclusion is justified is a value judgment."

  **Final Notes:**
  *   **Public Readability:** Define terms simply as shown when reading aloud ("Resident: Physically lives here as primary home").
  *   **Time:** Stick to timeboxes rigorously. Chair should move discussion along.
  *   **Your Role:** As "theory person," your job is to ensure the procedure is followed faithfully, call out when a step is truly a value judgment in disguise, and clearly articulate the points where the commission has "no method" (the "Cannot Decide" points above). Your personal views only matter in the final Value Vote.
  *   **Outcome:** This procedure provides structure, forces empirical burdens onto proponents, exposes core assumptions (residency/governance), creates stopping rules (over-inclusion, disproportionality), and clearly flags where value choices are unavoidable. It neutrally evaluated your positions based on its tests.
