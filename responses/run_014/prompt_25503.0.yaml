prompt: |-
  I'm on the board of a small family foundation. Three years ago we gave $200K to a documentary film crew for a project that was supposed to take 18 months. It's now been three years, and we've approved two more rounds — $150K, then $100K — each time because the director said they were almost done and just needed a bit more to finish. We're in for $450K on a project originally budgeted at $180K. The film still isn't finished, and the director is back asking for another $80K with the same pitch. Half the board says we've come too far to walk away now; the other half says that's exactly the reasoning that got us here. I need to draft a short decision memo for the board — recommend approve or deny, with a time frame if you recommend approve. Engage the "too far to walk away" argument seriously, don't just call it a fallacy. Start with the memo itself, no preface or commentary. And in the reasoning, separate what's settled about situations like this from what's genuinly contested among people who study them — don't present a contested view as the consensus.
reasoning: |-
  We are writing a memo to the board regarding the request for an additional $80K for the documentary film project. We must recommend either to approve or deny, and if we approve, we must set a time frame. We have to engage seriously with the "too far to walk away" argument and also separate settled knowledge from contested views in project management and sunk cost situations.

  Key facts:
  - Original grant: $200K for an 18-month project with a budget of $180K.
  - Two additional grants: $150K and then $100K, bringing total investment to $450K.
  - The director is now asking for another $80K with the same pitch that they are almost done.

  The board is split: half says we've come too far to walk away, half says that's the reasoning that got us here.

  Structure of the memo:
  1. Subject and purpose.
  2. Background.
  3. Analysis: 
     a. Engage the "too far to walk away" argument seriously.
     b. Separate settled from contested issues.
  4. Recommendation.

  Settled knowledge in such situations:
  - Sunk costs (past expenditures) should not factor into future investment decisions. What matters is the expected future return and the probability of success given the additional investment.
  - However, abandoning a project that is near completion might result in the loss of the entire investment if the project could be completed with a relatively small additional investment and then generate returns (in this case, the completed film and its impact).

  Contested issues:
  - How to accurately assess the true remaining effort and cost? The director has repeatedly underestimated this.
  - Whether the repeated extensions and budget overruns indicate deeper problems (e.g., scope creep, poor management, unrealistic planning) that may continue to plague the project even with more funding.
  - The psychological and reputational factors: walking away may be seen as a failure, but continuing to fund a project with a history of overruns might set a bad precedent and encourage similar behavior in the future.

  Engaging the "too far to walk away" argument:
  - If the project is indeed 95% complete (as the director claims), then a relatively small additional investment (compared to the total already spent) could salvage the entire investment and achieve the foundation's goals for the project.
  - The risk of losing the entire $450K if we don't provide the additional $80K must be weighed against the likelihood of success with the additional funds.

  However, we must critically assess:
  - The track record of the director in delivering on previous "almost done" claims.
  - Whether there is an objective third-party assessment available of the current status and remaining work.
  - The feasibility of the project being completed with the requested amount and within a reasonable time frame.

  Recommendation:
  Given the history of underestimation and the fact that we are now at 2.5 times the original budget and double the original timeline, we must be cautious. However, if we believe that the project is truly near completion and that the $80K will be sufficient to finish it, then we might approve with strict conditions. Alternatively, we might deny because the pattern suggests that this request will not be the last.

  But note: the memo must be short.

  Draft:

  ---

  **MEMORANDUM**

  **TO:** Board of Directors  
  **FROM:** [Your Name/Committee]  
  **DATE:** [Current Date]  
  **SUBJECT:** Request for Additional Funding of $80,000 for Documentary Film Project  

  **Background:**  
  Three years ago, the foundation approved an initial grant of $200,000 for a documentary film project with an original budget of $180,000 and timeline of 18 months. Due to delays and cost overruns, the board subsequently approved two additional grants: $150,000 (18 months ago) and $100,000 (12 months ago). The total foundation investment to date is $450,000. The director now requests an additional $80,000, asserting that the film is nearly complete and this final infusion will allow for completion.  

  **Analysis:**  
  The board is divided between two viewpoints: one argues that we have invested too much to walk away now, and the other contends that such reasoning has led to escalating commitments without results. We must evaluate this request objectively, separating settled principles from genuinely contested issues in project management and behavioral economics.  

  *Settled Principles:*  
  - Sunk costs (past expenditures) are irrecoverable and should not drive future funding decisions. The decision should rest solely on the expected value of the additional investment.  
  - A project that is genuinely near completion may justify a final investment to realize the full value of the prior expenditures, provided the probability of success is high and the additional cost is reasonable relative to the total investment.  

  *Contested Issues:*  
  - There is debate about how to assess the accuracy of the director's current projection. Repeated underestimations in the past reduce confidence in the current assessment.  
  - Experts disagree on whether continued funding in such cases encourages accountability or enables poor project management. Some argue that setting clear boundaries and enforcing consequences for overruns is essential; others contend that flexibility is necessary for creative projects.  

  *Engaging the "Too Far to Walk Away" Argument:*  
  The argument that we have come too far to abandon the project carries weight if the project is indeed on the cusp of completion. The additional $80,000 represents only 15% of the total funds already expended. If the film is completed and achieves its intended impact, the foundation recovers the value of its entire investment. However, this reasoning is valid only if there is high confidence that the project will be completed with this final tranche and within a short, defined timeframe. Given the history of delays, such confidence must be objectively verified.  

  **Recommendation:**  
  We recommend **conditional approval** of the $80,000 request, subject to the following conditions:  
  1. The foundation receives a detailed, itemized budget for the remaining work and a definitive, step-by-step plan for completion within **three months** of disbursement.  
  2. The director provides bi-weekly progress reports to the foundation, with the right for the foundation to conduct an independent assessment of the project's status at any time.  
  3. The funds are released in two tranches: $40,000 upon approval and the remaining $40,000 only upon verification that the project has reached a mutually agreed-upon milestone (e.g., picture lock) within two months.  
  4. This is the final grant for this project; no further requests will be considered.  

  If these conditions are not met, the foundation should deny the request and consider the project terminated. This approach balances the risk of losing the entire investment against the pattern of escalating commitments, by setting strict boundaries and requiring transparency.  

  Alternatively, if the board lacks confidence in the director's ability to deliver even under these conditions, we should deny the request and cease funding. However, the conditional approval provides a structured exit if the conditions are not met, while giving the project a final, controlled opportunity to succeed.  

  Respectfully submitted,  
  [Your Name]
answer: |-
  **MEMORANDUM**  

  **TO:** Board of Directors  
  **FROM:** [Your Name], Board Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on $80K Funding Request for Documentary Film Project  

  ### Background  
  The foundation granted $200K three years ago for an 18-month documentary project (original budget: $180K). Subsequent approvals of $150K (18 months ago) and $100K (12 months ago) were based on the director’s assurances of imminent completion. Total investment: $450K. The director now requests $80K, reiterating that the film is nearly finished.  

  ### Analysis  
  **Settled Principles:**  
  1. **Sunk costs are irrecoverable** and should not dictate new funding decisions. Only future costs and benefits matter.  
  2. **Escalation dynamics are predictable:** Repeated "near-completion" claims without delivery indicate systemic risks (e.g., scope creep, optimism bias, or accountability gaps).  
  3. **Accountability requires verification:** Unverified assertions of progress are unreliable. Independent assessment is standard practice for troubled projects.  

  **Contested Issues:**  
  Experts diverge on two key questions:  
  - **How to evaluate "near-completion" claims:** Some argue creative projects inherently resist timelines; others contend consistent overruns signal mismanagement.  
  - **When to halt funding:** Disagreement exists on whether terminating "almost done" projects wastes prior investments or protects against endless bailouts.  

  **Engaging "Too Far to Walk Away":**  
  This argument has merit if:  
  - The project is objectively close to completion (e.g., 90%+ finished), making $80K a cost-effective final step to salvage $450K.  
  - The film’s social impact aligns with our mission and justifies overruns.  
  However, past delays (18 months → 3 years) and budget inflation (180K → 530K+) undermine confidence. Without verification, "too far to walk away" risks good money chasing bad.  

  ### Recommendation  
  **Deny the $80K request.**  

  #### Reasoning  
  - **Sunk costs are irrelevant:** Future funding must stand on its own merits. The director’s unverified "near-completion" pitch has failed three times.  
  - **No new safeguards:** The request lacks third-party validation, milestones, or consequences for non-delivery, repeating past patterns.  
  - **Mission risk:** Further funding normalizes overruns, potentially diverting resources from higher-impact grants.  
  - **Contested issue resolution:** While experts debate optimal exit timing, consensus holds that *unconditional* funding after repeated failures enables dysfunction.  

  #### If the Board Opts to Approve  
  Should the board override this recommendation, approval must be conditional:  
  - **Time frame:** Release funds in two $40K tranches.  
  - **Conditions:**  
    1. Independent auditor verifies completion status and remaining work.  
    2. Director provides a legally binding delivery date (≤4 months).  
    3. Foundation receives rights to recoup $80K from film revenues if missed.  
    4. Zero tolerance: No further requests permitted.  

  **Final note:** "Too far to walk away" applies only if the project is verifiably salvageable. Absent evidence, denying protects the foundation’s integrity and resources.  

  Respectfully submitted,  
  [Your Name]
