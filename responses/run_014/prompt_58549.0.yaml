prompt: |-
  So I've been lurking on LW and SSC and later the Alignment Forum since like 2016 and I think I've just absorbed the factored cognition picture without ever really stress-testing it.

  Like my current take is basically that good deliberation is just lots of little understandable steps put together, and that HCH — you know, the idealized version where a human can split up any big question and hand the pieces to a bunch of copies of themselves and then put the answers back together, all the way down — is pretty much what perfect reasoning looks like, and also the thing we actually want a super smart AI to be doing.

  I tried to actually live this last month when I was deciding whether to move for a job, I broke it into like twenty micro-questions for friends to weigh in on seperately and it totally flopped because the whole vibe got lost, but I am not sure if that is evidence against the idea or just me doing a bad decomposition.

  So talk me out of it if you can. What kinds of findings or arguments or concrete cases should make me drop or at least seriously weaken this picture? I want the fatal stuff separated from the merely embarrassing stuff, and I want to know what even the biggest fans of this picture would admit is a problem for them versus what they would just wave away as bad factorization. Also be honest about whether saying with the right decomposition it works makes the whole thing empty, and if so whether that emptiness actually matters.

  What would you personally throw at me if you wanted to change my mind here, like a specific task that definetly does not factor, or a reason to think ideal deliberation is not factorable even in principle?
