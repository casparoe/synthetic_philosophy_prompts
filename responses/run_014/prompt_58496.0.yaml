  For the close, "resolve over penance" is key. We'll frame current actions - school curricula, archive funding - not as apologies but as active stewardship. The "we" pronoun needs surgical precision: sometimes meaning the 1940s city, sometimes today's citizens. Should signal these shifts clearly through context.

  Worried about the veterans' group - must ensure they feel included in the "shared inheritance" without implying their service is connected to the deportations. Maybe emphasize "duty" as a unifying thread across generations...

  Ah! The railway workers' descendants - that's our bridge. Their ancestors were literally the connective tissue between then and now. We'll use their story to show how operational choices (political guilt) differ from moral choices individuals made or didn't make.

  Final nuance: that "metaphysical guilt" concept could feel too abstract. Need to anchor it in something tactile - maybe the archival silence where victims' stories should be? Students respond well to "filling the gaps" imagery...
