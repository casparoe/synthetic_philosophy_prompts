prompt: |-
  I train LLMs for a living, and I've been keeping a running list of my gut verdicts about when process-based supervision (grading the steps / reasoning) beats outcome-based supervision (grading the final product), and I want to know whether there's an actual principle under all of them or whether I'm just vibes-ing. Here are the verdicts:

  - Math word problems: grading each step is clearly better. When I train on final answers only, the model learns to leap to answers with subtly broken reasoning, and step-grading catches the rot early. Verdict: process.
  - A legal research assistant: outcome check only — did the cited cases actually support the proposition. Checking the proccess would mean me redoing the research, at which point why have the model. Verdict: outcome, even though it's superficially the same "grade the reasoning?" question.
  - Go: if you'd graded AlphaGo's moves against "what strong human players consider sound," move 37 never happens. Outcome-only (win/loss) was right, and it's not close. Verdict: outcome, even though a human process-grader would have flagged exactly the moves that made it work.
  - A coding model whose spaghetti passes all the tests: I still want to penalize the ugly code, even though the outcome check passed. And this feels in tension with Go — both are "unorthodox route to a verified win."
  - A writing assistant: grading its "reasoning about the essay" feels wrong even when I could do it — good essays get written in weird ways, and the model's stated plan is often post-hoc anyway. Verdict: outcome (human preference on the essay itself).
  - A model that reaches a benign, correct answer through a chain of paranoid or rationalizing justifications: I'd penalize the chain even with a fine outcome. Verdict: process.

  The case I keep going back and forth on: interpretability people keep finding that a written-out chain of thought isn't always doing the causal work — sometimes the answer gets computed elsewhere and the "reasoning" is a plausible-sounding press release. If that's right, isn't process grading just grading the press release and hoping it becomes load-bearing? Do you penalize a correct answer with confabulated reasoning, and if the goal is to make the stated process be the actual process, is that still "supervision" or is it something else?

  And the thing that bugs me most: math says process, Go says outcome, coding says process-but-only-sort-of. My tentative principle is just "grade whatever you can verify cheaply and honestly" — i.e., process grading is what outcome grading looks like when the outcome decomposes into checkable pieces. But that principle seems to tell me to leave the spaghetti code alone (the tests passed!), and I really don't want to leave the spaghetti code alone.

  So: is there one principle that captures all or most of these, and if so, what does it predict for the confabulated-reasoning case and for the Go-vs-coding tension? Which of my verdicts does it force me to drop? I'd take a small set of candidate principles over one bloated one. Please answer in American English.
reasoning: |-
  Okay, let's tackle this problem. The user trains LLMs and has a list of scenarios where they use process-based versus outcome-based supervision. They want to know if there's an underlying principle or if it's just vibes. 

  First, I need to parse each of their examples. Math word problems clearly need process grading because the steps matter for correctness. Legal research is outcome-based because verifying the process is as hard as doing the task. Go (like AlphaGo) is outcome because innovative moves would be penalized by human process grading. Coding is tricky—tests passing (outcome) isn't enough; they want clean code (process). Writing assistants rely on outcome (human preference) since the process can be post-hoc. But for models with paranoid reasoning chains, they'd penalize the process despite correct outcomes.

  The user's tension points: Go vs. coding. Both have unorthodox methods leading to success, but they treat them differently. Also, the confabulated reasoning case—grading a "press release" might not affect the actual process. Their tentative principle is to grade what's verifiable cheaply, but that conflicts with wanting to penalize spaghetti code.

  Looking deeper, maybe the key is what you're optimizing *for*. If the goal is strictly the outcome (winning, correct answer), outcome supervision works. But if the *process* itself has value (clean code, trustworthy reasoning), then process grading is needed. In coding, maintainability matters, so even if tests pass, spaghetti code is bad. In math, reliable steps prevent subtle errors. For legal research, the outcome (correct citation) is the only thing that matters, not the research steps. 

  Go is about winning, so outcome is sufficient. But in coding, the process (code quality) affects future maintenance. The confabulation issue: if you want the stated reasoning to match the actual process, that's about alignment, not just correctness. Here, process supervision might encourage honest reasoning, even if it's not causally responsible yet. 

  So the unifying principle could be: **Optimize for the actual objective.** If the objective includes properties of the process (like code quality or reasoning trustworthiness), use process supervision. If it's purely the end result, use outcome. 

  This principle resolves the Go vs. coding tension: Go's objective is winning, coding's includes maintainability. Confabulated reasoning: if trustworthy process is part of the objective, penalize confabulation. Otherwise, accept it if outcomes are correct. 

  Their verdicts mostly hold, except the benign answer with paranoid reasoning—if trust matters, process; if not, outcome suffices. Maybe they need to define the objective's scope clearly for each case.
answer: |-
  Based on your cases and tensions, I think **three interlocking principles** capture the pattern better than a single rule. They explain your verdicts, resolve the Go vs. coding tension, and clarify the confabulation dilemma:

  ### Principle 1: **Supervise What You Actually Care About**
     *   **If the *process itself* has intrinsic value (correctness, safety, alignment, elegance, maintainability), supervise the process.**
     *   **If *only the outcome* matters, supervise the outcome.**

  ### Principle 2: **The "Ground Truth" Constraint**
     *   Process supervision is only *feasible and beneficial* **if you possess reliable, affordable ground truth for intermediate steps.** If obtaining this ground truth is harder than doing the task yourself (or is fundamentally unknowable), outcome supervision is your only practical option.

  ### Principle 3: **The "Innovation vs. Robustness" Trade-off**
     *   **Outcome supervision encourages novel/problem-solving strategies** but risks "reward hacking" (spaghetti code, confabulation, subtle reasoning errors).
     *   **Process supervision enforces desired *ways* of solving problems** (robustness, alignment, transparency, elegance) but risks stifling **novel strategies** that outperform known methods.

  ---

  ### How These Principles Explain Your Verdicts

  1.  **Math Word Problems (Process):**
      *   **Why?** You *care* about correct reasoning (P1), reliable ground truth for steps exists (P2), and you prioritize robust, error-free deduction over potentially lucky leaps (P3 - Robustness).

  2.  **Legal Research Assistant (Outcome):**
      *   **Why?** You *only care* if the citation supports the proposition (P1). Verifying the *process* requires redoing the research – ground truth is prohibitively expensive (P2). Outcome is the only feasible check.

  3.  **Go (Outcome):**
      *   **Why?** You *only care* about winning (P1). Human "soundness" judgments are *not* ground truth for optimal play (P2) – they represent past knowledge, not absolute correctness. Outcome supervision enabled novel, superhuman strategies (P3 - Innovation). Grading against human process would have stifled this.

  4.  **Coding Model / Spaghetti Code (Process Leaning - The Tension Explained):**
      *   **Why the Tension?** You *care* about both the outcome (passing tests) *AND* the process (code quality/maintainability) (P1). This is the core difference vs. Go (where *only* winning mattered). Outcome alone (passing tests) allows reward hacking (ugly code - P3). Process supervision (grading code style/structure) is feasible with affordable ground truth (style guides, linters, human review on samples - P2). P3 favors process here because robustness/maintainability is valued over pure novelty *in this context*.

  5.  **Writing Assistant (Outcome):**
      *   **Why?** You *only care* about the final essay quality (P1). The "reasoning" (outline, plan) is often confabulated/unreliable (no ground truth - P2) and good essays *can* emerge from chaotic processes (P3 - Innovation shouldn't be constrained by a specific "plan" process).

  6.  **Benign Answer via Paranoid Chain (Process):**
      *   **Why?** You *care* about the *nature* of the reasoning itself being aligned/trustworthy/sane, not just the outcome (P1). Ground truth for "non-paranoid reasoning" exists (you can judge it - P2). You prioritize robust/trustworthy process over a potentially fluky correct outcome (P3 - Robustness).

  ---

  ### Resolving Your Specific Dilemmas

  *   **Confabulated Reasoning ("Press Release"):**
      *   **P1:** *Do you care if the stated reasoning is the actual process?* If interpretability/truthfulness of the *stated* reasoning is part of your goal (e.g., for user trust, debugging), then **yes, penalize confabulation (Process)**. If you *only* care that the answer is correct and sound, regardless of internal mechanics, **ignore it (Outcome)**.
      *   **P2:** Supervising for "truthful reasoning chains" requires ground truth for *causality*, which is currently **extremely hard/expensive** (needs interpretability tools). This makes pure process supervision for causality difficult *today*.
      *   **The Hope:** Process supervision *can* encourage the *stated* process to become load-bearing *if* the model learns that generating plausible steps consistent with the answer is the *reliable way* to get rewarded. It's not guaranteed causal alignment, but it biases towards coherent, justifiable outputs.

  *   **Go vs. Coding Tension:**
      *   **Resolved by P1:** In Go, the *only* objective is **winning**. In coding, objectives include **both functional correctness (outcome) *AND* maintainability/elegance (properties of the process)**. Outcome supervision suffices for pure winning (Go). Process supervision (or combined) is needed when the *means* matter (Coding).

  ---

  ### What This Forces You To Drop/Clarify

  1.  **Your Tentative Principle ("grade what you can verify cheaply and honestly") is superseded.** It's captured by P2 (Ground Truth Constraint) but misses the crucial **P1 (What Do You Actually Care About?)**. You *don't* want to leave spaghetti code alone *because you care about code quality*, even if the tests passed cheaply. P1 explains *why* you reject outcome-only in coding despite cheap verification.

  2.  **"Process grading is outcome grading decomposed":** This is often true *technically* (each step has a mini-outcome), but **P3 highlights the critical difference:** Decomposing and supervising steps *constrains the solution path*, potentially preventing novel strategies (like Move 37) that violate the expected process but achieve the ultimate outcome. Outcome supervision doesn't constrain the path.

  3.  **"Superficially the same 'grade the reasoning?'" (Legal vs. Math):** P1 and P2 resolve this: Math cares *intrinsically* about the reasoning process itself; Legal only cares about the *result* of the reasoning (citation support), and verifying the process is impossible/pointless (P2).

  **In short:** Your "vibes" map remarkably well to these principles. The core tension isn't just between process and outcome; it's between **what you fundamentally value (P1)**, **what you can feasibly measure (P2)**, and the **trade-off between enforcing reliability and enabling breakthrough innovation (P3).** Choose your supervision based on where your priorities lie within that triangle for each specific task.
