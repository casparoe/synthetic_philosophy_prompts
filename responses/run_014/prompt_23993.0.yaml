  Here's the half-formed idea. For reference, the lottery in question is the one where you flip a fair coin until it lands heads, and if you get n tails before the first heads, the payout is (-1)^n 2^n dollars — so $1, -$2, $4, -$8, ... with probabilities 1/2, 1/4, 1/8, ... — and the "modified" version just changes the first payout to $2 (everything else the same). I keep thinking that the "undefined expected value" of this lottery might not be the real problem. The lottery is perfectly well-defined as a probability space (countable outcomes, probabilitites sum to 1), so the problem is specifically that the expected-value series doesn't converge. But there are "summation methods" (like the Cesàro sum) that assign a value to divergent series, and I suspect that if we use one of these as a "generalized expected value," we might be able to get a coherent decision principle that (i) agrees with the ordinary EV on all lotteries with convergent EV, (ii) assigns a value to the Pasadena lottery, and (iii) is consistent with the dominance principle (i.e., if lottery A dominates lottery B, then the generalized EV of A is at least the generalized EV of B). My question is: does such a "generalized expected value" exist? If it does, what is it, and does it actually resolve the paradox? If it doesn't, what is the precise obstruction — i.e., which property (or which pair of lotteries) makes it impossible?

  Can you turn this into a term-paper proposal? I want a precise statement of the question, an explanation of why the standard responses (restricting EV maximization to defined-EV prospects, supplementing with dominance, etc.) don't settle this more specific question, the approach I should take (what I'd actually do, section by section), what the possible conclusions are and which considerations would decide between them, and an honest assessment of what could make the project too big for a semester. Please don't bother with citations or a bibliography — I'll add those myself. Think very carefully before answering, and respond in the style of an expert decision theorist who has thought hard about the foundations of expected value.
