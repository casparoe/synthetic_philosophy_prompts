  ## Term Paper Proposal: Resolving the Pasadena Paradox? On the (Im)possibility of Generalized Expected Utility with Dominance

  **Title:** Dominance and Divergent Expectations: Can Summation Methods Salvage Coherent Choice for the Pasadena Paradox?

  **Core Question:** Does there exist a generalized expected utility (GEU) functional, defined for all simple lotteries (finite or countably infinite outcomes summing to probability 1), satisfying the following three properties simultaneously?
      1.  **Agreement with Standard EV:** For any lottery `L` where the standard expected utility series converges absolutely (i.e., `∑ |u(x_i) * p_i| < ∞`), `GEU(L) = EV(L)`.
      2.  **Defined Value for Pasadena:** `GEU(L_P)` is a well-defined real number for the canonical Pasadena lottery `L_P` (payouts `(-1)^n * 2^n` for `n=1,2,3,...` with `p(n) = 1/2^n`).
      3.  **Stochastic Dominance:** For any two lotteries `A` and `B` defined on the same consequence space, if `A` (first-order) stochastically dominates `B`, then `GEU(A) ≥ GEU(B)`. Specifically, this must hold for the Pasadena lottery `L_P` and the Modified Pasadena lottery `L_M` (identical to `L_P` except the first payout is `+$2` instead of `$1`).

  **Why Standard Responses Are Inadequate:** The standard resolution restricts expected utility maximization to lotteries with absolutely convergent expected utility series, noting the dominance tension between `L_P` and `L_M` (where `L_M` dominates `L_P` pointwise but both have undefined standard EV). This is a pragmatic *limitation*, not a *resolution* of the underlying tension. It sidesteps the fundamental question raised by your intuition: *Could there be a principled way to assign values to such divergent series that restores coherence, including respecting dominance, without abandoning the core framework?* Summation methods (Cesàro, Abel, etc.) are natural candidates for defining `GEU` precisely because they extend the notion of "sum" to divergent series in ways that often align with physical intuition or analytic continuation. The standard approach simply declares these methods irrelevant for decision theory without rigorously investigating whether they *could* satisfy the core normative principle of dominance within a generalized framework. This proposal directly challenges that omission.

  **Thesis Statement:** This paper will rigorously investigate the feasibility of resolving the Pasadena paradox via summation-consistent generalized expected utility. It will demonstrate that while such GEU functionals can satisfy (1) and (2), they fundamentally *cannot* satisfy (3) – stochastic dominance – specifically due to the properties of the Pasadena and Modified Pasadena lotteries under any plausible summation method. The obstruction lies in the specific alternating, exponentially growing structure of the payouts combined with pointwise dominance.

  **Methodology & Structure:**

  1.  **Foundations: Paradox, Dominance, and Summation Methods (≈1500 words)**
      *   Precise definition of the Pasadena (`L_P`) and Modified Pasadena (`L_M`) lotteries as probability spaces.
      *   Formal statement of the problem: Undefined standard EV (`∑ u(x_n)p_n` not absolutely convergent, conditional convergence issues).
      *   The dominance tension: Clear pointwise dominance of `L_M` over `L_P` (`$2 > $1`, `-$2 = -$2`, `$4 = $4`, etc.).
      *   Introduction to Summation Methods: Define key methods relevant to alternating series (Cesàro mean, Abel summation) formally. Explain their properties (regularity, linearity – when applicable, stability). Discuss their philosophical standing as assignment methods.
      *   **Defining GEU:** Formal definition of a *Summation-Consistent GEU*: `GEU(L) = S( ∑_{n=1}^∞ u(x_n) p_n )`, where `S` is a specified summation method applied to the utility-payout series. Establish that this satisfies (1) for any regular summation method.

  2.  **Applying GEU to the Pasadena Lottery (≈1500 words)**
      *   Compute `∑ u(x_n)p_n` for `L_P`: `∑_{n=1}^∞ [(-1)^n * 2^n] * (1/2^n) = ∑_{n=1}^∞ (-1)^n`.
      *   Apply summation methods to `∑_{n=1}^∞ (-1)^n`:
          *   Cesàro: Partial sums: `S_1 = -1`, `S_2 = (-1-1)/2 = -1`, `S_3 = (-1-1+1)/3 = -1/3`, `S_4 = (-1-1+1+1)/4 = 0`, `S_5 = (-1-1+1+1-1)/5 = -1/5`... Cesàro mean sequence: `-1, -1, -1/3, 0, -1/5, 0, -1/7,...` → Limit does not exist. **Cesàro sum undefined.**
          *   Abel: `lim_{r→1^-} ∑_{n=1}^∞ (-1)^n r^n = lim_{r→1^-} [-r / (1 - (-r))] = lim_{r→1^-} [-r / (1 + r)] = -1/2`. **Abel sum = -0.5**.
      *   Discuss other methods (e.g., Euler, Borel), likely concluding Abel is a strong candidate for satisfying (2) (assigns `GEU(L_P) = -0.5`).

  3.  **Testing Dominance: `L_P` vs. `L_M` (≈1500 words)**
      *   Compute `∑ u(x_n)p_n` for `L_M`: Payouts: `+2, -2, +4, -8, +16,...` → Series: `[+2 * 1/2] + [(-2) * 1/4] + [(+4) * 1/8] + [(-8) * 1/16] + ... = ∑_{n=1}^∞ c_n`, where `c_1 = +1`, `c_n = (-1)^n * 2^n * (1/2^n) = (-1)^n` for `n ≥ 2`.
          *   Series: `1 + ∑_{n=2}^∞ (-1)^n`.
      *   Apply summation methods:
          *   Cesàro: Series `1 -1 +1 -1 +1 -1 + ...`. Partial sums `1, 0, 1, 0, 1, 0,...`. Cesàro means `1, 0.5, 2/3, 0.5, 3/5, 0.5, ...` → Limit does not exist. **Cesàro sum undefined.**
          *   Abel: `lim_{r→1^-} [1 + ∑_{n=2}^∞ (-1)^n r^n] = lim_{r→1^-} [1 + ( -r^2 / (1 - (-r)) )]` (since sum from n=2 is `-r^2 - r^4 - r^6 - ... = -r^2/(1 - (-r))`? Let's compute carefully:
              `∑_{n=2}^∞ (-1)^n r^n = (-1)^2 r^2 + (-1)^3 r^3 + ... = r^2 - r^3 + r^4 - r^5 + ... = r^2 (1 - r + r^2 - r^3 + ...) = r^2 / (1 - (-r)) = r^2 / (1 + r)`
              Therefore, total Abel sum: `lim_{r→1^-} [1 * r^0? + r^2/(1+r)]`? Wait, the first term is `c_1 * r^1`? No! Abel sum is `∑ c_n r^n`. For `L_M`: `c_1=1, c_2=-1, c_3=1, c_4=-1, ...` So:
              `A(r) = (1 * r^1) + (-1 * r^2) + (1 * r^3) + (-1 * r^4) + ... = r - r^2 + r^3 - r^4 + ... = r(1 - r + r^2 - r^3 + ...) = r / (1 - (-r)) = r / (1 + r)`
              `lim_{r→1^-} r/(1+r) = 1/2`. **Abel sum for `L_M` = +0.5**.
      *   **Result:** Under Abel summation (which gave `L_P` a defined GEU of -0.5), `GEU(L_M) = +0.5`. Since `L_M` dominates `L_P` pointwise, Stochastic Dominance *requires* `GEU(L_M) > GEU(L_P)`. Here, `+0.5 > -0.5`, so **dominance is satisfied for this pair under Abel GEU**.

  4.  **The General Obstruction: Beyond Abel (≈1000 words)**
      *   **Is Abel the Answer?** Superficially, Abel GEU satisfies (1), (2) (`-0.5`), (3) (for `L_P`/`L_M`: `0.5 > -0.5`). But is dominance satisfied *generally*?
      *   **Testing Linearity & Stability:** Key properties of summation methods. Abel summation is linear. Consider a "Delta" lottery `L_D = L_M - L_P`. Pointwise: `L_D` pays `$1` on trial 1 (`$2 - $1`), and `$0` on all subsequent trials (`-$2 - (-$2)=0`, `$4 - $4=0`, etc.). `L_D` is equivalent to a trivial lottery paying `$1` with probability `1/2` and `$0` with probability `1/2`. Standard EV = `0.5`. Abel GEU for `L_D`: Series is `1` (for n=1) + `0` (n≥2). Abel sum: `lim_{r→1^-} [1 * r^1 + 0] = lim_{r→1^-} r = 1`. **Abel GEU(`L_D`) = 1 ≠ 0.5 = EV(`L_D`).**
      *   **Violation of Agreement (Property 1):** `L_D` *has* an absolutely convergent expected value (`0.5`), but Abel GEU assigns it `1`. This violates Property 1 (Agreement with Standard EV). Abel GEU fails criterion (1) for `L_D`.
      *   **The Fundamental Trade-off:** This illustrates the core obstruction. To satisfy (1) and (2), the summation method `S` must assign `S(∑ (-1)^n) = v` (some finite v, like Abel's -0.5) while *also* assigning `S(∑_{n=2}^∞ (-1)^n) = S( -1 +1 -1 +1 - ... ) = w`. For linear methods: `S(∑ (-1)^n)` (n≥1) = `S( (-1) + ∑_{n=2}^∞ (-1)^n ) = S(-1) + S(∑_{n=2}^∞ (-1)^n)`. `S(-1) = -1` (regularity). Therefore `v = -1 + w`. For `L_M`, the series is `1 + ∑_{n=2}^∞ (-1)^n`, so `GEU(L_M) = S(1) + S(∑_{n=2}^∞ (-1)^n) = 1 + w`. Dominance requires `1 + w > v`. Substituting `v = -1 + w`, we get `1 + w > -1 + w` → `1 > -1`, which is always true. **Dominance for `L_P`/`L_M` holds if the method is linear/regular.** *However*, property (1) requires that for the convergent lottery `L_D` (paying $1 w.p. 1/2, else $0), `S(1 * (1/2) + 0 * (1/2))` must equal `0.5`. The series representation used for summation methods treats `L_D` as `1` (n=1) + `0` (n≥2), so `S(1 + 0 + 0 + ...) = S(1) = 1` (by regularity). But `1 ≠ 0.5`. **There is no linear/regular summation method `S` such that `S(c_1, c_2, c_3, ...) = ∑ c_n p_n` for convergent `∑ |c_n p_n| < ∞`.** The summation method acts on the *utility sequence ordered by the state index*, not on the expectation integral. This mismatch is fatal for satisfying (1) generally while assigning values to divergent series like Pasadena.

  5.  **Conclusion: Implications for Decision Theory (≈500 words)**
      *   **Answer to Core Question:** No. There is no summation-consistent GEU satisfying (1), (2), and (3). The obstruction is twofold:
          1.  **Mismatch of Series Representation:** Summation methods operate on sequences ordered by the state label (n=1,2,3,...). Standard EV for convergent lotteries aggregates utilities by their *values*, not by the state label. Property (1) demands that GEU equals this state-label-independent value for convergent cases, but the summation method inherently depends on the state-label ordering. This is irreconcilable (as shown by `L_D`).
          2.  **Dominance Preservation Requires Linearity (which exacerbates 1):** While dominance for `L_P`/`L_M` can be satisfied by linear methods (like Abel), this very linearity, combined with the state-label dependence, forces violations of Property (1) for other lotteries (`L_D`).
      *   **Broader Significance:** The Pasadena paradox highlights a fundamental limitation. Extending EU to handle divergence via "natural" summation methods conflicts with either dominance or the agreement with standard EU on its core domain. This strengthens the case for the standard view: lotteries with conditionally convergent or divergent expected utility series lie outside the scope of *any* decision rule based solely on a single numerical representation respecting dominance and standard EU. Alternative resolutions (e.g., relative expectation, fanning, choice sets) may be necessary, but they inherently abandon the goal of a single, complete GEU valuation.
      *   **Philosophical Reflection:** The failure underscores that "value" for decision-making under risk might require more structure than what a raw divergent utility series, summed by any method, can provide. Normative principles (like dominance) impose constraints that summation methods alone cannot meet.

  **Scope Management & Feasibility:**

  *   **Tractability:** The proposal is highly tractable for one semester. The core work (Sections 2, 3, 4) involves concrete calculations with specific lotteries (`L_P`, `L_M`, `L_D`) and well-defined summation methods (Cesàro, Abel). The impossibility argument hinges on these specific calculations and the general properties of linearity/regularity.
  *   **Risk of Overextension:**
      *   *Exploring too many summation methods:* Focus is key. Prioritize Abel (as the strongest candidate resolving `L_P`) and Cesàro (as the most intuitive). Briefly mention others only if time allows after the core argument is established.
      *   *General Impossibility Proof:* While the `L_D` example strongly suggests impossibility, rigorously proving *no* functional (even non-summation-based) satisfying (1), (2), (3) exists might be ambitious. Stick to the summation-consistent approach. The `L_D` counterexample under Abel suffices to demonstrate the core conflict.
      *   *Philosophical Digressions:* Keep Section 5 focused on the implications *of the technical results* for decision theory. Avoid lengthy excursions into other paradox resolutions unless directly contrasting with the GEU approach.
      *   *Measure-theoretic Generalization:* Strictly limit scope to simple lotteries (countable outcomes). Do not attempt to define GEU for continuous distributions or arbitrary measurable functions; this adds immense complexity irrelevant to the core Pasadena question.
  *   **Mitigation:** Define "Summation-Consistent GEU" precisely at the outset. Structure Sections 2-4 around the specific calculations for `L_P`, `L_M`, and `L_D`. The conclusion (dominance holds for `L_P`/`L_M` under Abel but Agreement fails for `L_D`) is the critical result demonstrating the impossibility within the defined framework.

  **Conclusion:** This proposal offers a sharp, technical investigation into the feasibility of a specific resolution to the Pasadena paradox using generalized expected utility based on summation methods. By rigorously applying these methods to the relevant lotteries and testing the three core desiderata, it promises to demonstrate a fundamental obstruction: satisfying Agreement with standard EU and Stochastic Dominance is incompatible with assigning a defined GEU to the Pasadena lottery via any state-label-ordered summation method. This result clarifies the depth of the paradox and reinforces the limitations of simple numerical valuation extensions.
