      *   **Structure:**
          *   Premise A: All men are mortal.
          *   Premise B: Socrates is a man.
          *   Conclusion Z: Socrates is mortal.
          *   Tortoise asks: Why accept Z given A and B?
          *   Achilles adds C: If A and B are true, Z must be true.
          *   Tortoise accepts A, B, C but still refuses Z.
          *   Achilles adds D: If A, B, C are true, Z must be true.
          *   Regress ensues.
      *   **Standard Philosophical Resolution:** Russell/Strawson/etc. The move from premises to conclusion isn't a step in the argument (adding another premise); it's the *application* of a logical rule. Treating the rule as a premise creates a new regress because the rule itself needs application.
      *   **Alternative Interpretations:** Wittgenstein (rule-following), Quine (meaning holism), Wittgensteinian skepticism about justification.

  3.  **Analyze Each Exchange Point:**

