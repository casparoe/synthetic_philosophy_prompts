      *   Is it verbal? Partially. "Disease" means different things in clinical practice vs. theoretical taxonomy.
      *   Is it metaphysical? Yes, concerning the Fact/Value distinction (Hume's Guillotine). Naturalists assume a sharp cut; Normativists deny it at this level.
      *   Is it pragmatic/social? Yes. Who gets the label matters.
      *   *Crucial realization:* The debate assumes "Disease" is a unitary natural kind waiting to be discovered (Naturalism) OR a social construct waiting to be acknowledged (Constructivism/Normativism). But both are trying to define the conditions for the *application of a medical label*.
      *   *The "Two Projects" Thesis:* The user suggests this. It's the strongest diagnostic lead. One project is ontological/explanatory (what causes the breakdown?), the other is semantic/pragmatic (when do we intervene?).
