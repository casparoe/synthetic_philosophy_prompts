      *   **Normativism (Fulford, Cooper, etc.):** Disease concept inherently involves evaluative judgment about suffering, harm, or deviation from goals. Aim: Capture the phenomenological and social reality of illness; acknowledge that medicine is a normative practice. Motivation: Explain why homosexuality was removed from DSM without biological change; acknowledge that 'disease' labels have distributive consequences.
