answer: |-
  You have correctly identified the stalemate’s structural weakness: the assumption that "disease" must function as a single, unified natural kind. Your "two projects wearing one label" theory is directionally correct, but it needs sharpening. The disagreement isn’t just that the two sides have different goals; it is that the *word* "disease" is being asked to satisfy logically incompatible constraints simultaneously.

  Here is a diagnosis of the impasse and a proposal for where progress actually lies.

  ### 1. The Diagnosis: A Conflation of Taxonomy and Justification

  The impasse exists because Naturalists and Normativists are fighting a battle over two distinct philosophical functions that the concept of "disease" performs in our discourse.

  1.  **The Explanatory Function (Naturalist Priority):** Here, "disease" acts as a shorthand for **etiological mechanism**. It answers: "Why is this system failing?" The goal is predictive power and causal isolation. For the naturalist, if we remove values, the mechanism remains visible.
  2.  **The justificatory Function (Normativist Priority):** Here, "disease" acts as a warrant for **intervention and resource allocation**. It answers: "Does this state merit a medical response?" The goal is ethical consistency and social triage. For the normativist, removing values removes the reason to treat it.

  **The Friction:** Naturalists try to collapse the Justificatory Function into the Explanatory Function (i.e., "If the mechanism breaks, justification follows"). Normativists insist the Justificatory Function precedes the Explanatory (i.e., "We only look for mechanisms in things we care about stopping").

  They aren't describing different things with the same word; they are arguing about **who holds the authority to draw the line.** The Naturalist wants the line drawn by evolutionary biology (authority of Nature). The Normativist wants the line drawn by social consensus/suffering (authority of the Subject). Because "disease" sits at the intersection of Biology and Morality, both sides refuse to concede that the other's criteria might be partial truths rather than total replacements.

  ### 2. Where the Impasse Lives: The "Reference Class" Selection Problem

  The concrete locus of the stalemate is not the general definition of function, but the **selection of the Reference Class.**

  *   **Naturalist Claim:** Biological function is value-free once the species/taxonomy is fixed.
  *   **Normativist Counter:** Choosing the reference class is itself the value-laden step.

  For example: Is deafness a dysfunction?
  *   **Boorse:** You must compare the deaf individual to hearing humans (species-typical design). Result: Dysfunction.
  *   **Deaf Culture/Normativist:** You must compare the deaf individual to Deaf culture members (cultural reference class). Result: Normal functioning within the class.

  The Naturalist argues the Deaf Cultural class is arbitrary/superseding biological reality. The Normativist argues the Species Class is arbitrary/ignoring lived reality.
  **The Impasse:** There is no meta-rule available to settle which reference class is the "correct" one without invoking a further value judgment (e.g., "Evolutionary fitness matters more than cultural participation" OR "Subjective experience matters more than statistical frequency"). The Naturalist treats the Reference Class as a *precondition* of analysis; the Normativist treats it as the *conclusion* of a political struggle.

  ### 3. The Nature of the Disagreement: Metaphysical Realism vs. Pragmatic Deflation

  This is not merely a verbal dispute (where they mean different things and could just clarify). It is a **Clash of Modal Claims.**

  *   **Naturalism claims Modality:** "A condition *could not* be a disease unless it violates a functional norm, regardless of social attitude." (Counterfactual strength).
  *   **Normativism claims Contingency:** "A condition becomes a disease *only if* a community decides it merits the label, regardless of functional status." (Dependence on stance).

  The disagreement is bedrock because it hinges on the **Humean Guillotine**. Naturalists believe you can bridge the gap from "this organ works statistically differently" to "this is bad/pathological" using only evolutionary facts. Normativists believe the gap cannot be bridged without introducing "suffering" or "interest," which are irreducibly normative.

  Because both sides claim to define the *ontology* of medicine, they talk past each other. The Naturalist gives a theory of **Pathology** (broken parts). The Normativist gives a theory of **Sickness** (experienced burden). When they argue, the Naturalist thinks the Normativist is inventing fiction; the Normativist thinks the Naturalist is ignoring the lived phenomenon of illness.

  ### 4. What Counts as Progress?

  Since neither side can convince the other that the "other project" shouldn't exist, resolving this requires abandoning the Essentialist quest ("What IS disease?") for a **Functional Pluralism.**

  **The Reframe:**
  Stop trying to define "disease." Distinguish **"Bodily Malfunction"** (pathophysiology) from **"Health Status"** (value-judgment on life trajectory).
  Most progress in the field recently has come from realizing that "disease" is a **thick concept** that carries both descriptive and prescriptive baggage, and we should stop pretending it carries only one.

  **Criteria for Resolution:**
  Progress occurs not when one side wins the definition, but when the discipline acknowledges the **division of labor**:

  1.  **Scientific Research:** Should operate on Naturalist principles (mechanisms, etiologies, reference classes). Here, we *must* bracket values to find causes. If we conflate values here, we bias the data (e.g., historical race-science biases masquerading as biological differences).
  2.  **Clinical Triage & Policy:** Must operate on Normativist principles (harm, preference, access). Here, biology is merely input, not output.

  **The "Decision" Case:**
  A decisive case would not be another "hard case" like infertility (which both sides can parse through their own lenses). A deciding move would be the widespread adoption of **Medical Decision Theory** that explicitly separates these layers.
  *   *Example:* In bioethics, distinguishing **"Need"** (Naturalist: physiological demand) from **"Want"** (Normativist: subjective preference) fails. We need a third term: **"Claim-Right"** (Normative weight given to physiological malfunction).

  **The Final Diagnosis:**
  The impasse is sustained because the medical profession uses one label ("Disease") to authorize two incompatible authorities: **Diagnostic Objectivity** (Science) and **Resource Allocation** (Ethics). As long as insurance companies require a "diagnosis code" (a medical/legal fact) to pay for "accommodation" (a normative right), the Naturalist and Normativist *must* fight over the definition of the code.

  **Conclusion:**
  Do not expect a resolution that unifies the concepts. Expect a resolution that dissolves the requirement for unification.
  *   **Progress looks like this:** Acknowledging that "disease" is not a natural kind but a **social kind with causal powers**. We use the label "disease" to create a reality where resources flow and stigma applies. Therefore, the criteria for applying the label must be explicit about *which* criterion is driving the decision (biological risk vs. social utility vs. psychological distress).
  *   **Your path forward:** Don't defend Naturalism or Normativism. Critique the **pragmatic pressure** that forces them to compete. Analyze the debate as a case study in **Conceptual Engineering**, asking not "Which definition is true?" but "Which definition serves the specific institutional goal currently under discussion?" (e.g., If the goal is research funding, Naturalism is efficient. If the goal is patient rights, Normativism is essential).

  The argument resolves not when we agree on what disease is, but when we admit the word does too much work.
