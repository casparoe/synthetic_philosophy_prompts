answer: |-
  There is no canonical term for this move in the analytic literature, which explains your frustration. The Williams/Korsgaard/Nagel debates tend to treat internalism and externalism as static positions or competing metaphysical claims. They rarely analyze the *micro-dynamics* of the conversation where these positions interact in real time. We map the terrain of the dispute, but we ignore the potholes in the road between them.

  However, based on the mechanics you describe, I believe we can carve out a precise label. I recommend calling this **The Hypothetical-Categorical Slide**.

  Here is why this is the right term, followed by the distinctions you requested to help isolate it from nearby conceptual hazards.

  ### The Carving: Why "The Hypothetical-Categorical Slide"?

  Your two paths correspond almost exactly to the classical distinction between the **Hypothetical Imperative** (Path A: If you desire X, do Y) and the **Categorical Imperative** (Path B: Do Y, period).

  In Path A, the speaker offers a *conditional reason*. The force of the "ought" depends on the truth of the antecedent ("given what Paul does care about"). The normative authority is derived *from* the agent’s psychology.

  In Path B, the speaker asserts a *categorical reason*. The force of the "ought" applies regardless of the antecedent. The normative authority is derived *from* the objective nature of the situation or the moral law.

  The "slide" occurs when a participant starts in the realm of conditionals (where persuasion requires linking Y to an existing desire) and, upon realizing that link won't hold, silently drops the conditional without dropping the conclusion. They treat the failure to connect to the desire as a cognitive failing in Paul, rather than a justificatory failing in their own argument.

  The stealthiness comes from the fact that in everyday language, we rarely distinguish between "You have a reason to do this (because it helps your goals)" and "You have a reason to do this (because it's right)." Both employ the noun phrase "have a reason." The speaker exploits this linguistic ambiguity to smuggle a categorical claim into a hypothetical negotiation.

  ### Distinguishing from Neighboring Concepts

  To ensure this label holds up in your seminar room, here is how to distinguish it from the three other categories you mentioned.

  **1. Vs. Ordinary Equivocation**
  *   **Equivocation** is primarily semantic. It relies on the ambiguity of a word having two distinct dictionary definitions (e.g., "bank," "light," "valid").
  *   **The Slide** is primarily *dialectical* and *structural*. While it often employs the polysemy of the word "reason" (motivational vs. normative), the move is characterized by a shift in the **locus of justification**.
      *   *Test:* If you replace "reason" with "explanation" in Path A and "requirement" in Path B, the Equivocation is still detectable as a vocabulary swap. The Slide remains detectable as a shift in who bears the burden of the argument. The Slide isn't just saying the same word with two meanings; it is pretending that satisfying the conditions of Meaning A automatically satisfies the conditions of Meaning B. It is an **ontological sleight-of-hand** rather than a lexical trick.

  **2. Vs. Shifting the Burden of Proof**
  *   **Shifting the Burden of Proof** usually involves demanding evidence from the opponent when *you* originally made the claim.
  *   **The Slide** involves changing the *standard* of evidence required for the original claim without announcing the change.
      *   *Test:* In a standard burden-shifting fallacy, the arguer says, "You haven't proved it," implying the standard was set. In the Slide, the arguer changes the rules of the game mid-game. "I showed you this connects to your health (Standard A). You say no? Well, then it's just a requirement regardless (Standard B)." They aren't saying you failed to meet Standard A; they are simply discarding Standard A in favor of Standard B while maintaining the momentum of the original claim.

  **3. Vs. Changing the Subject (Red Herring)**
  *   **Changing the Subject** abandons the original conclusion ($\text{Paul ought to } Y$) to argue about something else ($\text{Society hates Paul}$).
  *   **The Slide** keeps the conclusion intact but changes the *warrant*.
      *   *Test:* If the arguer stops talking about the *action* and starts attacking the *agent* without concluding anything about the action, it's a Red Herring. In the Slide, the conclusion remains "Paul ought to do $Y$"; only the source of the 'ought' is swapped. The subject matter (Paul's obligation) remains constant, which is why it feels less obvious than a Red Herring.

  ### Why This Matters for Your Class

  Using **The Hypothetical-Categorical Slide** gives your students a diagnostic tool for spotting *normative fragility*.

  When a student sees someone make a move they identify as Path A, ask them: *"Does the conclusion survive if we negate the premise?"*
  *   If the argument was truly Path A (Internalist), and the premise (desire/value) vanishes, the conclusion should lose its force.
  *   If the arguer insists the conclusion survives despite the missing premise, they have performed the Slide.

  By naming it, you force the interlocutor to admit they are now on a Path B track. They must then either admit they are positing a categorical reason (and prove its existence independently) or retreat back to finding the hidden desire (recommitting to Path A).

  The reason this drives you nuts is that it is a defense mechanism against the Williams Challenge. It is a way of holding onto the intuition that moral facts exist externally, while hoping to borrow the persuasiveness of internalism to make those facts stick to the agent. Naming it reveals the borrowing.

  I hope "The Hypothetical-Categorical Slide" serves your teaching needs. It lacks the history of a traditional fallacy, but it captures the specific geometry of the error you are witnessing.
