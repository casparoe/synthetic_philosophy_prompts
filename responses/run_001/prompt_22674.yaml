answer: |-
  *(Stand at the podium. Take a moment. Look at the family, then the unit, then back at the front. Breathe. Speak slowly. This isn't about rhetoric; it's about truth.)*

  Thank you.

  I write novels. Most of my life has been spent making things up. I sit in a quiet room and invent worlds, then convince other people that those worlds are real. But standing here, looking at Mark’s picture... I’ve never needed to make anything up less than I do today. Because the truth is enough. And sometimes, the truth is hard enough to bear.

  We’re gathered here to mourn Mark. To say goodbye to a brother, a son, a husband, a friend.

  But I have to say something before I get to the stories, before I get to the laughter we all shared. We all know Mark. Some of us knew him best when he was in civvies. Others knew him best when he was wearing the uniform. And we all live in a world where politics tries to define the dead as much as the living.

  I am not going to lie to you. I am not going to stand here and pretend this war was just, because I don't believe it was. And I know Mark wouldn't want me to lie. He hated the noise. He hated the spin.

  But I am also not going to stand here and tell his mother that her son died for nothing. Because I don't believe that either.

  Because here is the thing that separates the strategy from the soldier: The generals argued over maps. The politicians argued over reasons. But Mark... Mark argued with gravity. He argued with distance. He argued with the enemy trying to kill him, and the guys standing shoulder-to-shoulder with him who needed him to keep breathing.

  Mark was not a symbol. He wasn't a political statement. He was a man in a foxhole. And in that moment, when the bullets came, there was no debate about whether the mission was "right." There was only the decision to cover your neighbor. To watch his back. To drag him out of the fire if he couldn't move his legs.

  That is not a crime. That is not a mistake. That is the only thing you're allowed to count on when everything else falls apart.

  If we judge a soldier by the hands that pulled the trigger on them from the top floor of a palace, he is just a casualty. If we judge him by how he kept his own head above water while dragging his friends through it, he is a warrior. And Mark was a warrior. Not because of a flag, but because of his loyalty to the people standing next to him.

  To Mark’s family: Please hear me. Your son did not die in vain. He died keeping his word to the man beside him. That is a debt worth paying. That is a legacy worth honoring.

  To Mark’s old unit: You know what this cost. You know the irony of holding a position that didn't matter while losing the ones who mattered most. You carry that weight. But let me remind you of something. You weren't alone. None of you were. You had each other. And Mark... Mark made sure you remembered you were human, even when you were covered in dirt and blood.

  I remember one night, somewhere cold, the lights went out. Nobody wanted to talk about the briefing coming up the next day. Nobody wanted to talk about the "reason" we were there. We just sat there. And Mark started telling us about the time he tried to fix his girlfriend's toaster and accidentally set the kitchen curtain on fire. We laughed until our sides hurt. We laughed because we were scared, yes. But mostly we laughed because Mark refused to let the world turn us into machines.

  He stayed human.

  So, here is the sum of it. I can disagree with the order. I can question the history books. But I will not question the heart of the man who followed it.

  Mark was funny when he was tired. He was brave when he was shaking. He was good, even when it would have been easier to be bitter. He served, not because the country told him to, but because the men next to him needed him to.

  That makes him a hero to me. Not the kind of hero they put on posters, but the kind you rely on when the sky turns black.

  Rest easy, Mark. You bought the coffee last time. I'll pay this one.

  We've got you now.
