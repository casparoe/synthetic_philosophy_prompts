prompt: |-
  I write novels, and I have to give the eulogy for my friend Mark, a soldier who got killed in the war. I'm not gonna pretend this is easy to write. Here's what's got me stuck, and I think it's the whole problem: I believe the war he died in was unjust. I actually do, and I'm not going to stand up there and pretend otherwise, because Mark would've hated it. But I also can't call him a victim of a bad regime or say he was sacrificed for nothing, because I don't think thats right either. My view — I've thought about it more than I'd like — is that even in a war that's wrong, the soldiers on the ground aren't murderers. They didn't start it, they had every right to defend themselves, and the other side was trying to kill them, so they were allowed to fight back. So Mark wasn't a criminal, but the war wasn't just, and I can't figure out how to say both of those things at a funeral. The room will be full of his family, who want to hear that he was a hero who died for something that mattered, and his old unit, who'll know I'm dancing around the fact that I think the whole thing was a mistake. Can you write it for me? It needs to honor him as someone who wasn't a monster without me endorsing the war, and without me saying a single thing I dont believe. No philosophy-lecture vibe, no saccharine. He was funny and brave and a good man, and I need that to come through.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist (implies attention to language, narrative structure, honesty).
      *   **Occasion:** Eulogy for a friend, Mark, a soldier killed in war.
      *   **The Conflict:** The speaker believes the war was unjust but believes the soldiers weren't monsters/victims/sacrifices. They need to honor Mark without endorsing the war or lying about their beliefs.
      *   **Audience:** Family (want heroism/purpose) + Unit (know the reality/complexity).
      *   **Constraints:** No philosophy lectures, no saccharine clichés ("died for freedom," etc.), honest, respectful, capturing Mark's humanity (funny, brave, good).
      *   **Key Beliefs to Convey:**
          1.  The war might have been wrong/unjust.
          2.  Mark did nothing wrong by fighting/defending himself.
          3.  He wasn't a criminal; he was a man doing a job.
          4.  He is worthy of love and grief regardless of politics.

  2.  **Deconstruct the Tone:**
      *   Needs to be grounded, raw, and intimate. Not flowery.
      *   Acknowledge the elephant in the room without making it a political rally.
      *   Focus on *Mark* as a person, not the *conflict* as an abstract concept.
      *   Avoid "He died for a noble cause" vs. "He died for no reason." Find the middle path: "He died doing his duty as best he could, surrounded by men/women like him."

  3.  **Brainstorming Core Themes/Metaphors:**
      *   *The Uniform:* It represents duty, separation from civilian life, but also just fabric until a person wears it.
      *   *The Fog of War:* You don't see the big picture down there. You only see your buddy's back.
      *   *Humanity:* Even in the worst places, people are still people.
      *   *Love/Grief:* These exist independently of politics.
      *   *Novelist Perspective:* Use the craft. Truth-telling. Seeing characters clearly.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Don't sugarcoat the pain. Establish the relationship (writer/friend).
      *   **Addressing the War (Carefully):** This is the hardest part. How to say "I didn't think this war was right" without offending the unit? Frame it around the *choice* made by Mark. He showed up. That counts. The validity of the mission doesn't invalidate the courage.
      *   **Focus on Mark's Character:** Specifics. Humor, bravery, kindness. Show, don't just tell. Maybe a small anecdote.
      *   **Reconciling the Dilemma:** Directly address the audience. "Some will ask..." "Others will know..." Bring it back to the fact that *Mark* matters more than the *cause*.
      *   **Closing:** A promise to remember him accurately. A final farewell.

  5.  **Refining the "Unjust War" Aspect:**
      *   *Avoid:* "This war was a mistake." (Too accusatory for some family members).
      *   *Avoid:* "God gave him strength for a righteous fight." (Lie).
      *   *Try:* "There were people who told him what he signed up for. There were others who told him why he was here. But when the ground shook, he only had one job: keep the guy next to him alive."
      *   *Better:* Acknowledge the complexity openly. "I'm a writer. I spend my life parsing motives and truth. In Mark's life, the truth wasn't simple."
      *   *Crucial Pivot:* Shift focus from the *strategy* to the *soldierhood*. Honor the soldier without necessarily honoring the general's orders.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      Hey everyone. Mark was my friend. He was funny. I don't agree with the war we fought. But he wasn't bad. He protected his friends. His mom cries. His squad knows. Let's remember the man, not the flag. Goodbye.
      *(Critique: Too blunt, too robotic. Needs more heart.)*

  7.  **Drafting - Iteration 2 (Adding Texture & Voice):**
      Writing a speech is easier than writing a novel sometimes. But this is harder. Mark was a good guy. We argue about the politics often. He hated politics though. He just loved us. When things got hot, he acted like a hero. I believe the war was wrong, but I don't believe Mark was wrong. He defended himself and his brothers. That's all that counts here. He was kind. He laughed loud.

  8.  **Finalizing the Text (incorporating the "No Philosophy Lecture" constraint):**
      *   Keep sentences relatively short.
      *   Speak directly to the crowd.
      *   Make sure the "unjust war" sentiment feels like personal integrity rather than anti-military protest.
      *   Emphasize that the *grief* is valid even if the *politics* aren't.

      *(Self-Correction during drafting):* Wait, the prompt says "I don't think [he was sacrificed for nothing] is right either." So I can't say "his death was meaningless." I have to find value in his survival of spirit or the bond he held, even if the strategic goal was flawed. I need to emphasize his agency. He chose to protect. That choice is meaningful, regardless of the map lines.

  9.  **Polishing the Ending:** Needs to feel like a release. Not a neat bow, but a genuine letting go.

  10. **Review against constraints:**
      *   Honors him as human? Yes.
      *   Endorses war? No.
      *   Lies? No.
      *   Philosophy lecture vibe? Removed heavy abstraction. Kept it grounded in "what happens in the foxhole."
      *   Funny/Brave/Good? Included traits.

  11. **Final Polish:** Check the rhythm. Ensure it sounds spoken, not written. (e.g., using fragments, pauses). *Added stage directions to help the user deliver it.*

  **(Post-Drafting Note):** I need to make sure I don't accidentally sound *too* detached because I'm writing a draft for a user who said "Write it for me." However, the user wrote "I need you to write it for me" implying they want a text they can adapt or use. I should provide a speech that feels authentic to *their* voice (the writer), which means it should be articulate but raw.

  Let's construct the eulogy focusing on the distinction between the *mission* and the *man*.

  *Key line idea:* "You can disagree with where we marched, but you cannot question the step taken."

