          *   *Phase 3 (Directional Selection):* Political weaponization. Specific traits favored (aggression, dog whistles).
      *   *Section 2: Where the Model Stumbles.* Focus on the "Human Agent" problem.
          *   Intentional design vs. blind evolution.
          *   The ADL as "predator/immune system" vs. environment.
