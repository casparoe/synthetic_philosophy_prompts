answer: |-
  ### 1. The shape of the stalemate

  The impasse is defined by the structural incompatibility between axiomatic consistency and core moral constraints. Total utilitarians preserve transitivity and separability but sacrifice the intuition that quality cannot always be traded for quantity, accepting the Repugnant Conclusion. Average utilitarians avoid the repugnant conclusion but violate transitivity or monotonicity via the Mere Addition Paradox, rendering their ordering cyclic or unstable. Critical-level and critical-range views attempt to stabilize the total view by introducing a threshold for positive value, yet they often succumb to the Sadistic Conclusion, implying that adding people with lives below the critical level (but above zero) can improve a state of affairs. Person-affecting views sidestep these aggregative paradoxes by restricting evaluation to harms and benefits inflicted on existing or future identifiable persons, but they collapse under the Non-Identity Problem, failing to explain why creating a child with a harmed life is worse than creating a different child without such harm. Finally, variable-value theories attempt to weight welfare based on population size to dodge both extremes, but they pay for this flexibility with accusations of ad-hocery, lacking a principled derivation for their weighting functions other than their success in avoiding known paradoxes. Each camp has identified the precise logical vulnerability of the others and fortified its own position behind it, resulting in a gridlock where no theory satisfies all plausible axioms simultaneously.

  ### 2. What kind of disagreement is this?

  This is fundamentally a conflict between the formal requirements of rational ordering and the metaphysical limits of interpersonal value. On one hand, the demand for a coherent betterness relation imposes mathematical constraints—transitivity, completeness, and dominance—that assume populations can be treated as fungible bundles of welfare units. On the other hand, moral intuitions are anchored in a personalist ontology where value is parasitic on the existence of a subject experiencing it. Theories fail not because they miscalculate the calculus, but because they apply the rules of aggregation (designed for fixed sets) to domains where the set itself is variable. Total utilitarianism assumes a unitary scale of value that persists across empty spaces, while person-affecting views insist value evaporates without a subject. The disagreement is thus structural: proponents disagree on which axiom to drop when the axioms collide with deep normative convictions. One side prioritizes the logic of the ledger; the other prioritizes the reality of the beneficiary. There is no shared proof system here because the foundational premises regarding the nature of value are incommensurable.

  Furthermore, the debate obscures a category error regarding the locus of valuation. When theorists ask whether World A is better than World B, they implicitly assume there is a standpoint from which this judgment holds. Yet, if the sets of people differ entirely, no standpoint unifies the comparison. Is the comparison made for the sake of the potential people (who have no stake until created)? For the actual people (who are unaffected by alternative futures)? Or for an abstract moral geometry independent of anyone’s interests? Most theories try to answer all three questions simultaneously, forcing a singular "betterness" predicate to do work that requires multiple distinct predicates. The stalemate persists because critics attack total utilitarianism with person-affecting intuitions, while total utilitarians dismiss those intuitions as ill-posed for global comparisons. Until the discipline accepts that these questions target different normative phenomena—one aggregative, one deontic—the clash will remain irresolvable.

  ### 3. What would count as progress?

  Given this diagnosis, genuine theoretical unification is unlikely; the hope for a single, complete population axiology appears to be a mirage generated by an over-optimistic faith in moral monism. Progress, therefore, would not come from a new theorem resolving the paradoxes, but from a conceptual retreat: distinguishing clearly between the logic of social choice for fixed populations and the ethics of procreation or expansion. We should expect the impasse to be permanent as long as the field insists on a single "best" theory. However, movement could occur if philosophers stopped seeking a general theory of population value and instead developed modular frameworks that specify when aggregation is appropriate and when person-affecting constraints apply. This would require accepting that "better than" in population contexts is indexical or context-sensitive, much like temporal reasoning, rather than a universal binary relation. If the community can agree that different axioms govern policy coordination versus moral rights, the energy spent debating which view "wins" the Repugnant Conclusion could be redirected toward mapping the boundaries between these distinct domains.
