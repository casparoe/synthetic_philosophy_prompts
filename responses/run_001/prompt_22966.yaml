prompt: |-
  I'm on the HR disputes panel at my company and we've got a case to decide before the end of the month. A middle manager told an engineer, in a hallway conversation, that she'd be promoted to senior at the next review cycle — no formal process, no sign-off from the comp team, nothing in writing. The engineer relied on it hard: she turned down a higher-paying offer from another firm and started taking on senor-level projects on the strength of the promise. Now the company's line is that the manager had no authority to make that kind of commitment and that informal hallway promises don't bind the institution, so the engineer is owed nothing and the promotion just goes back into the normal queue.

  I was arguing about this with my friend for most of last night and we went in circles. She thinks a promise binds because the promisor commits her own will and that's the end of it, I think it only binds to the extent the promisee actually relies on it, and neither of us could land on what happens when the promisor was an agent who never had the authority to make the commitment in the first place. That last bit is what I keep coming back to and I don't think either of us has a good answer.

  Can you draft the panel's written decision memo — honor the promise, deny it, or split the difference with some concrete remedy — with a clear bottom line the company could actually act on. I want the reasoning to genuinely engage both the reliance account and the commitment/consent account of why promises bind, and I'd rather you take the company's strongest argument (that being bound by unauthorized informal promises would wreack the formal process and set a bad precedent for every manager who overpromises) seriously instead of just waving it away.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the HR Disputes Panel at a company.
      *   **Task:** Draft a written decision memo regarding a specific dispute.
      *   **The Case:** A middle manager orally promised an engineer a promotion to "Senior" at the next review cycle (hallway conversation). No formal process/sign-off. Engineer relied on it (turned down higher-paying offer, took senior-level work). Company wants to deny based on lack of authority/formal process. Manager had no authority.
      *   **User's Philosophical Conflict:** The user (panel member) believes binding depends on reliance. Their friend believes binding depends on the promisor's commitment/will. They want the memo to genuinely engage both theories (reliance vs. commitment/consent) and address the agency/authority problem seriously.
      *   **Requirements:** Clear bottom line/actionable remedy. Must take the company's strongest argument (preserving formal processes/preventing overpromising) seriously. Honor the prompt's constraint to draft the *memo itself*.

  2.  **Determine the Legal/Policy Framework (Internal):**
      *   This is an internal HR panel decision, not necessarily a court ruling, but it needs to be legally sound enough to withstand potential litigation or union grievances, and ethically sound enough to retain talent/morale.
      *   *Key Concepts:* Estoppel (Reliance), Apparent Authority, Corporate Formalities, Fairness, Precedent.
      *   *The "Split the Difference" Approach:* Completely honoring it validates unauthorized promises. Completely denying it validates corporate bad faith/breach of reliance interest. A middle path is usually best for internal policy disputes unless there's fraud involved.

  3.  **Engage with the Philosophical Arguments:**
      *   *Commitment/Consent Theory (The Friend):* If I say I'll do X, I am morally bound by my will. Even if I lacked authority, I made a promise. The company should honor the *individual's* word even if it violates policy (then discipline the manager later).
      *   *Reliance Theory (The User):* Binding only matters because harm was caused. The engineer suffered opportunity cost. The obligation arises from the damage done, not just the words spoken.
      *   *Agency/Authority Issue:* The core friction. Did the manager have power? No. Can the principal (Company) ratify? Technically yes. Should they? That's the question.
      *   *Company's Counter-Argument:* Chaos. If any hallway chat binds the firm, management control evaporates. Compliance becomes impossible.

  4.  **Formulate the Decision (The Bottom Line):**
      *   *Option A (Deny):* Too harsh, risks lawsuit, destroys trust, ignores reliance.
      *   *Option B (Honor Promotion Fully):* Too risky, undermines HR policy, encourages managers to ignore protocol.
      *   *Option C (The Hybrid/Mitigated Remedy):* Acknowledge the reliance loss without fully validating the unauthorized promotion process *at this moment*.
          *   *Idea:* Accelerate the review process, guarantee the title/ramp if performance continues to match (since she's already doing the work), but perhaps compensate the salary gap differently or phase it in to protect comp bands?
          *   *Better Idea:* Recognize the "Promissory Estoppel" equivalent internally. She gave up value (higher offer). She did the work. She gets the Senior title *effective now* (as compensation for reliance) but frame it as recognizing her current contribution level which coincidentally matches the promised timeline, rather than retroactively validating the verbal contract.
          *   *Actually, let's look closer at the Compensation Gap:* She turned down a *higher-paying* offer. This is quantifiable damages.
          *   *Proposed Remedy:* Grant the Senior Title immediately (validating the work she has already been doing since the promise) AND provide a one-time compensation adjustment or guaranteed bonus to bridge the gap left by the declined offer for the specific period of reliance.
          *   *Wait, keep it simpler for a memo:* The prompt asks for "honor, deny, or split." Let's go with a nuanced "Honored, but structured carefully."
          *   *Decision:* **The Company must grant the promotion effective immediately.** Why? Because relying on the refusal sets a dangerous precedent for employee retention, and the "agency" issue can be cured by ratification due to the detrimental reliance. However, the manager must be counseled on process.
          *   *Correction based on constraints:* I need to make sure I don't just say "Yes." I need to show I took the Company's strongest argument seriously.
          *   *Revised Decision:* **Grant the title immediately, but explicitly state that future promotions require formal sign-off, and this instance is an exception based on estoppel/detrimental reliance.** This balances the reliance theory (she lost money/opportunity) with the commitment theory (manager spoke) while acknowledging the authority constraint (we are making an exception, not a rule change).
          *   *Refinement:* Actually, the fairest split often involves fixing the salary impact specifically. If she turned down $10k more/year, maybe we bump her base by $X now, but cap it against the "Senior" band minimum.
          *   *Let's stick to the core request:* "Draft the panel's written decision memo."
          *   *Verdict:* **Recommendation: Remediate the Reliance Loss.** We cannot enforce the "promise" as a contract, but we must indemnify the harm caused by the reliance. So: Grant the role (because she's doing it), but acknowledge the financial discrepancy via a stipend or immediate adjustment, coupled with a disciplinary note for the manager.
          *   *Wait, the most actionable outcome:* **Grant the title and adjust compensation.** The argument is that the employee effectively worked into the position *based on the promise*, making the position her rightful status under the work actually performed, independent of the promise. The promise simply triggered the transition.
          *   *Okay, let's write the Memo.*

  5.  **Drafting - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Executive Summary:** The decision.
      *   **Factual Background:** Briefly summarize.
      *   **Analysis (The Core):** This is where I need to tackle the "Commitment vs. Reliance vs. Authority" triad.
          *   Address the Commitment view: Promises create moral debt.
          *   Address the Reliance view: Promises are dangerous if they cause harm.
          *   Address the Authority view: Agency rules exist for good reason (efficiency/order).
      *   **Synthesis:** How do we resolve the tension?
          *   We reject the idea that an agent creates a binding contract automatically (protecting the Company).
          *   But we accept that the Company ratified the situation through the Employee's labor and the Manager's implied representation.
      *   **Remedy:** Specific steps.
      *   **Precedent/Policy:** How to prevent recurrence.

  6.  **Refining the Philosophy within the Memo:**
      *   Avoid saying "In law..." too much; use organizational justice language.
      *   *Constraint Check:* "Neither of us could land on what happens when the promisor was an agent who never had the authority."
      *   *Answer:* Agency Law Principle: Ratification + Estoppel. Even without authority, if the principal (company) benefits from the reliance (employee working harder), and denies the harm, it creates unjust enrichment or inequity. The decision memo needs to reflect this nuance.

  7.  **Final Review against Constraints:**
      *   Does it honor the company's strongest argument? Yes, by limiting the scope of this decision to these specific facts (estoppel-based exception).
      *   Does it engage reliance vs. commitment? Yes, in the reasoning section.
      *   Is there a clear bottom line? Yes.

  8.  **Self-Correction during drafting:** I initially thought about just paying out the difference in cash. But the title matters for career growth. The title should be granted because she is *already doing the work*. The money is the reliance damages. I will structure it as: 1. Title granted retroactively to start date of "senior projects." 2. Salary adjusted to meet the market rate she turned down (if possible within budget) OR a "Retention/Reliance Adjustment." Let's go with Title + Compensation Adjustment to equal the *value* she relied upon.

      *Wait, simpler is better.* The prompt asks for a memo the company can act on.
      **Decision:** Grant the promotion effective immediately (Ratification). Compensate for the specific period where the promise induced behavior. Discipline manager.
      *Actually, let's lean into the "Split":* We acknowledge the Manager lacked authority (protecting company policy). BUT, the Employee's reliance creates an equitable claim stronger than standard procedure. Therefore, we authorize an *exception* that cures the reliance but does not set a blanket rule.

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM TO THE EXECUTIVE LEADERSHIP TEAM**

  **TO:** CEO, Chief People Officer, General Counsel
  **FROM:** HR Dispute Resolution Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Decision and Remediation Plan — [Employee Name] / Engineering Department Promotion Dispute

  ### 1. Executive Summary & Recommendation

  After deliberation, the Panel recommends that the Company **approve the promotion of [Employee Name] to Senior Engineer, effective immediately**, coupled with a one-time compensation adjustment to mitigate financial detriment.

  We recognize that [Manager Name] lacked the delegated authority to bind the organization to a title change outside the standard cadence. However, we find that the Company’s administrative interest in maintaining formal process is outweighed by the equitable obligation created by the Employee’s detrimental reliance on the Manager’s representations.

  This decision is an **equitable exception** based on the specific facts of reliance and work performed. It does **not** constitute a blanket validation of informal commitments. To preserve process integrity, [Manager Name] will receive mandatory counseling on delegation protocols, and HR will implement a written acknowledgment requirement for all intermediate-level discussions regarding career progression.

  ### 2. Factual Background

  *   **The Promise:** On [Date], a middle manager informed [Employee Name] verbally, in a non-recorded hallway setting, that she would be promoted to "Senior" at the next review cycle. There was no accompanying documentation.
  *   **The Reliance:** Relying on this statement, [Employee Name] rejected a competing external offer carrying a [X]% salary premium and began leading high-stakes projects designated for Senior Engineers prior to formal review.
  *   **The Current Position:** Management contends the promise is void *ab initio* due to lack of authority. Consequently, the original proposal is withdrawn, and she remains at her current grade pending the next open cycle.
  *   **The Stakes:** Reversing the reliance here creates a significant financial and psychological deficit for the employee while potentially exposing the Company to claims of unjust enrichment and breach of equitable duty.

  ### 3. Deliberative Analysis: The Conflict of Authority, Commitment, and Reliance

  To reach this decision, the Panel had to reconcile three conflicting obligations. This decision explicitly engages the philosophical and legal tensions you requested.

  #### A. The Validity of the Authority Argument (The Company’s Defense)
  Management argues strongly that [Manager Name] exceeded their authority. From a strictly transactional and governance perspective, they are correct. Allowing individual managers to bypass compensation bands and formal approval chains via hallway conversations would introduce unacceptable risk. It incentivizes overpromising, destabilizes payroll forecasting, and devalues the formal review process. If every unauthorized verbal assurance created a binding obligation, management hierarchy would dissolve into chaos.

  *Panel Finding:* We agree that the Manager acted outside the scope of explicit agency. Under strict agency doctrine, the Company generally bears no liability for unauthorized acts that do not benefit the corporation. We cannot adopt a policy where informal chats routinely supersede written contracts.

  #### B. The Theory of Commitment (The Moral Weight of the Promise)
  One view holds that a promise binds solely because the promisor committed their will to a future action. If [Manager Name] intended to commit to this promotion, the Company—viewed as an extension of the manager's actions—must bear the cost of that commitment, regardless of internal hurdles. This suggests the Company is morally culpable for the manager's inability to deliver on her own word.

  *Panel Finding:* While morally compelling, we decline to adopt this view as the primary basis for the decision. A "commitment" theory places the burden entirely on the Company to police its agents' willpower rather than protecting the institutional process. It fails to account for the systemic damage of validating unauthorized agents.

  #### C. The Theory of Reliance (The Equitable Claim)
  The counter-view holds that promises only bind to the extent the promisee relies on them to their detriment. Here, [Employee Name] did not merely hope; she acted. By rejecting a higher-paying offer, she incurred a concrete opportunity cost. By taking on senior projects early, she increased the Company’s productivity beyond her current billing rate.

  *Panel Finding:* This is the controlling principle. In employment law and ethics, the doctrine of **Promissory Estoppel** suggests that even if a formal contract lacks consideration or authority, a promise must be honored if reliance makes it unjust to retract it. The Company has accepted the benefit of the Senior-level work (the "gain"), yet seeks to deny the cost (the "loss").

  ### 4. Synthesis: Resolving the Agency Problem

  The crux of our disagreement was: *Does an agent's lack of authority sever the Company's liability?*

  We conclude that authority gaps are typically curable through **Ratification**. Although the Manager lacked authority to make the promise *ex ante*, the Company's acceptance of the Employee's Senior-level output constitutes *ex post facto* ratification of the necessary skillset required for the role.

  Therefore, the Company is not bound by the Manager's *words* per se, but is bound by the **equity of the resulting situation**. To deny the promotion now would punish the Employee for the Manager's error. To grant it without qualification would reward the Manager's procedural negligence. The solution lies in a remedy that validates the *outcome* (the Employee's career trajectory) without validating the *method* (hallway promises).

  ### 5. Proposed Remedy

  We propose a three-part remediation plan:

  1.  **Immediate Title Adjustment:**
      *   [Employee Name] is promoted to Senior Engineer effective today.
      *   **Reasoning:** She is already performing the work. Denying the title admits to "status-shaming" based on an administrative technicality. This satisfies the Reliance Theory without requiring the Company to admit the promise was legally valid initially.
      *   **Recency Clause:** This promotion is recognized as a result of demonstrated competency *accelerated* by the discussion, but it does not retroactively validate the Manager's right to promise titles.

  2.  **Financial Mitigation (The "Reliance Damages"):**
      *   A lump-sum payment (or immediate base salary adjustment) equal to the differential between her current offer and the external offer she rejected, pro-rated for the period she relied on the promise.
      *   **Reasoning:** If the Company refuses to grant the full market value she turned down, we leave her financially worse off for trusting a representative. This addresses the tangible harm of reliance.
      *   **Constraint:** This must come from a discretionary fund or management override budget, distinct from standard comp cycles, so it does not trigger automatic adjustments for others who did not suffer reliance damages.

  3.  **Process Correction (Protecting the Institution):**
      *   **[Manager Name] Counseling:** A formal written warning regarding unauthorized compensation/timeline commitments. This validates the Company's strongest argument: *Process matters.* Managers cannot use informal channels for material terms.
      *   **Documentation Requirement:** Effective immediately, all promotion intent signals from mid-level management must be confirmed in writing by HR before being discussed with employees as "guarantees."

  ### 6. Conclusion

  We believe this approach honors the Employee’s reliance interests without surrendering the Company’s managerial authority. It acknowledges that while the Manager broke the rules, the Company should not allow the Employee to pay the price for those broken rules.

  By granting the title based on the work she performs, we remain technically compliant with the "no unauthorized promise" rule. By offering financial mitigation, we satisfy the demand for fairness rooted in reliance. And by disciplining the process, we send a message that future hallway promises will not be tolerated.

  **Recommended Action:** Approve the above remedy and instruct HR to execute the salary adjustment by the next payroll cycle.

  ***

  **Signed,**
  **HR Dispute Resolution Panel**
