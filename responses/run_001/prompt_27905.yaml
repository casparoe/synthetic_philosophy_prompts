answer: |-
  # Desiderata for an Adequate Theory of Algorithmic Fairness

  For your research paper, it is helpful to think of fairness not as a single property a machine learning model possesses, but as a set of constraints we impose on the relationship between data, decisions, and society. An adequate theory cannot simply promise "fairness"; it must explain how it resolves conflicts between competing definitions of justice.

  Below are the necessary standards (desiderata) any robust theory must meet, the motivations behind them, and their status in current literature.

  ### 1. The Scope of Discrimination
  **The Requirement:** The theory must treat direct discrimination (using a protected attribute like race) and indirect discrimination (using a feature that correlates perfectly or strongly with race, like a ZIP code or credit history) with equivalent rigor.
  *   **The Case:** Imagine a hiring algorithm rejects candidates from specific neighborhoods. It never sees the candidate’s name or ethnicity, yet it systematically filters out qualified applicants from minority-majority areas because those areas are correlated with lower income scores.
  *   **Classification:** **Non-negotiable.** A theory that ignores "proxy variables" allows developers to easily bypass regulations by simply removing protected columns from the dataset.

  ### 2. Distinction Between Individuals and Groups
  **The Requirement:** The theory must provide separate tools for evaluating how single humans are treated versus how populations are treated. It should not collapse group statistics into claims about individuals.
  *   **The Case:** Consider two applicants, Person A and Person B, who are identical in qualifications. Person A belongs to Group X and Person B to Group Y.
      *   *Group View:* If 90% of Group X gets hired but only 10% of Group Y gets hired, there is disparity.
      *   *Individual View:* Person B may still have been evaluated correctly according to their specific skills.
  *   **Classification:** **Non-negotiable.** Collapsing these concepts creates confusion. You can have a system that is individually fair (everyone is judged on merit) but group-unfair (historical inequality means "merit" signals are distributed unequally), or vice versa. A theory must allow us to diagnose which one we have.

  ### 3. Process vs. Outcome
  **The Requirement:** The theory must distinguish between fairness in the *procedure* used to decide (is the model trained properly?) and fairness in the *outcome* distribution (does the result benefit everyone equally?).
  *   **The Case:** A loan algorithm might deny loans to a marginalized community at the same rate they were historically denied loans by human bankers (process consistency). However, if that historical denial was rooted in racist policy, maintaining the outcome perpetuates injustice (unfair outcome). Conversely, an algorithm might force equal loan approval rates (equal outcome) by approving unqualified applicants just to match quotas (flawed process).
  *   **Classification:** **Preference (Camp Dependent).** Utilitarians may prioritize outcomes (minimizing harm totals), while proceduralists (deontologists) prioritize the method. An adequate theory must admit both exist as legitimate concerns.

  ### 4. Data Bias vs. Rule Bias
  **The Requirement:** The theory must be able to localize where the unfairness originates: is it in the training data (labels), or the decision rule (the model logic)?
  *   **The Case:** In criminal risk assessment, data shows higher arrest rates for Black men. Is the *data* biased because police patrol Black neighborhoods more aggressively? Or is the *rule* biased because it weighs arrests as a marker of guilt regardless of location?
  *   **Classification:** **Non-negotiable.** If a theory attributes blame to the algorithm when the problem lies in historical policing data, engineers will "fix" the wrong thing (debiasing the model) while the root cause remains.

  ### 5. Recognition of Aggregate Harm
  **The Requirement:** The theory must acknowledge that harms can occur at the group level even if no specific individual feels they were treated worse than anyone else.
  *   **The Case:** If an ad-delivery algorithm shows high-paying job ads to Group X and low-paying jobs to Group Y, every individual might receive a job offer relevant to their profile. Yet, the community of Group Y collectively loses economic mobility.
  *   **Classification:** **Preference.** Some theories focus solely on individual non-maleficence (harm to persons). Others require social equity. An adequate theory should not pretend this dimension doesn't exist.

  ### 6. Consistency with Mathematical Impossibility
  **The Requirement:** The theory must acknowledge that certain combinations of fairness criteria are mathematically incompatible unless very strict conditions are met (specifically equal base rates of the outcome and equal accuracy across groups).
  *   **The Case:** Three popular fairness metrics are **Calibration** (if the model predicts 80% risk, 80% actually reoffend), **Independence/Demographic Parity** (positive rates are equal across groups), and **Separation/Equalized Odds** (error rates are equal across groups). Proofs by Kleinberg, Mullainathan, Raghavan, Chouldechova, and Hardt show you cannot generally satisfy all three simultaneously if the underlying event rates (base rates) differ between groups.
  *   **Classification:** **Non-negotiable.** This is a mathematical law, similar to the laws of thermodynamics. Ignoring this leads to false confidence.

  ---

  ### The Conflict: What Cannot Be Done

  **Jointly Unsatisfiable Subsets:**
  If groups have different base rates of the target variable (e.g., default rates on loans, or arrest rates), you cannot simultaneously satisfy **Calibration**, **Demographic Parity**, and **Equalized Odds**. You must choose which two you want, or relax all of them slightly. For example, enforcing Demographic Parity usually forces miscalibration or unequal error rates.

  **The Most Exclusionary Single Requirement:**
  The requirement that **"Fairness Metrics Should Not Trade Off Against Accuracy"** is the hardest barrier. Most standard proposals (like Demographic Parity) work by artificially penalizing a model's accuracy to force statistical balance. If a theory requires absolute maximum predictive utility *plus* strict group fairness, it effectively excludes almost all current algorithms in real-world settings. Furthermore, the requirement of **Individual Fairness** (treating similar individuals similarly) is often excluded because it is computationally expensive to define "similarity" globally without violating group fairness or privacy.

  ---

  ### Assessment of Proposal Families

  Here is how the major families of fairness approaches stack up against the criteria above.

  **1. Statistical Parity (Demographic Parity)**
  This approach ensures the decision rate is identical across groups, making it excellent for addressing aggregate harm and proxy discrimination. However, it fails the "Data Bias vs. Rule Bias" check because it often forces acceptance of unqualified applicants to match rates, potentially sacrificing calibration and overall accuracy.

  **2. Equalized Odds (Error Balancing)**
  This method requires that False Positive and False Negative rates be equal across groups, prioritizing the "Distinction Between Individuals and Groups" by protecting specific individuals from being mislabeled. It is mathematically strong but frequently contradicts Calibration when base rates differ, making it difficult to interpret in high-stakes settings like lending.

  **3. Calibration-Based Views (Sufficiency)**
  This approach insists that predicted probabilities mean the same thing for every group (e.g., a "70% chance" means the same thing for everyone). While it satisfies mathematical coherence and process fairness, critics argue it allows existing societal disparities to be baked into the prediction, failing to address the "Aggregate Harm" requirement.

  **4. Individual Fairness**
  This framework argues that similar individuals should be treated similarly, which satisfies the core human rights intuition behind fairness. However, it is practically non-negotiable regarding the difficulty of defining "similarity" (metric dependence), and it often collapses into group fairness if the similarity metric itself is trained on biased data.

  **5. Causal Approaches**
  These models use causal graphs to determine exactly *why* a decision was made, distinguishing clearly between "Data Bias" and "Rule Bias." They are theoretically robust regarding process and counterfactuals. However, they require knowing the true structure of the world (causality), which is rarely available, and they can still run into the standard "Impossibility Results" regarding error rate trade-offs.
