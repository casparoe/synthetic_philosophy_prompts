  I'm writing a long piece about a disputed climate dataset, and the scientist I'm quoting insists the retraction was a mistake. Last night some statistician at another university emailed me a one-paragraph note saying my summary of the dispute is backwards — no work shown, and I honestly cant find the error in my own notes, but I also can't verify his claim from where I sit. Can you walk me through the most important implications of the higher-order evidence and rational epistemic akrasia literature for what I do with the story? I'm specifically stuck on whether its coherent to keep my current framing in the draft while treating his email as a real challenge, and what the debate over whether higher-order evidence screens off the first-order evidence or has to be totalized with it actually changes for how much I should discount my own reading of the data.
