answer: |-
  # Handout: Sorting Intuitions on Fakes and Originals
  ## Part 1: The Logical Space
  Before we begin the diagnostic tree, understand that this unit is mapping a single tension: **Is the value of an artwork contained entirely within the experience of looking/listening, or does it depend on facts outside the object (who made it, when, how, or the rules of society)?**

  We are looking for five primary fault lines:
  1.  **Perceptual vs. Historical:** Do identical sensory experiences guarantee identical value?
  2.  **Moral vs. Ontological:** Is a forgery wrong because it lies to us, or because the object itself is diminished?
  3.  **Process vs. Product:** Does knowing the struggle behind the work change the work's identity?
  4.  **Type vs. Token:** Is a work a unique physical thing, or a pattern that can appear in many places?
  5.  **Social vs. Intrinsic:** Is value built by the market/critics, or inherent in the object?

  Below is the decision tree. Answer honestly. There are no grades involved in this diagnosis.

  ***

  ## Part 2: The Diagnostic Decision Tree

  **NODE 1**
  You are shown two paintings side-by-side. They are visually indistinguishable. Science confirms they are molecular duplicates (one is the original, one is a perfect clone). Without telling you which is which, would you pay the same amount of money to own either one as an artwork?
  *   **YES** → Go to **NODE 2**.
  *   **NO** → Go to **NODE 3**.

  **NODE 2** (Assuming the Clone has Equal Value)
  Consider a Grammy-winning album. There is a "bit-perfect copy" of the master recording distributed digitally. To your ears, it is identical to the original analog tape. Is the physical master tape artistically superior to the digital file, or are they equivalent works?
  *   **Equivalent Works** → Go to **NODE 4**.
  *   **Master is Superior** → Go to **NODE 5**.

  **NODE 3** (Assuming the Clone has Less Value)
  A museum displays a masterpiece that recently turned out to be a forgery that fooled experts for decades. Upon exposure, the object is now a fake. Does the physical paint on the canvas objectively lose value, or does only the "story" (our trust) break while the art remains intact?
  *   **Canvas Loses Value** → Go to **NODE 6**.
  *   **Only Story Breaks (Canvas Unchanged)** → Go to **NODE 7**.

  **NODE 4** (Audio is Equivalent)
  Think of a novel. There is a handwritten draft page where the author scribbled a new plot twist that changes the ending. Later, they printed the final version without that twist. Is the handwritten page, which never reached the reader, artistically more significant than the published text because it reveals the creative process?
  *   **Yes, Process Reveals True Art** → [LEAF] **Allographic Dissolve / Genetic Priority**
  *   **No, Only Final Text Counts** → [LEAF] **Aesthetic Empiricism**

  **NODE 5** (Audio Master is Superior)
  Why is the Master Tape better? Is it because the label owns it and sets the rules, or because the specific physical vibrations from that moment carry a "social magic" that copies lack?
  *   **Rules/Ownership Define It** → [LEAF] **Institutional-Contextualism**
  *   **Social Magic/Authenticity** → [LEAF] **Market/Commodity View**

  **NODE 6** (Canvas Physically Depreciated)
  A poet dies. We discover a newly written manuscript page that fundamentally changes how we should read her entire collection. However, she never intended this page for publication. Is this new discovery artistically superior to her published book because it changes the "genetic" truth of the work?
  *   **Yes, Genesis Defines Meaning** → [LEAF] **Historicism About Artworks**
  *   **No, Only Finished Effort Counts** → [LEAF] **The Achievement View**

  **NODE 7** (Only Trust Was Broken)
  Since the physical painting didn't change, why do we care about forgeries? Is the main issue that someone broke a promise to tell the truth, or is it that the work lacks the "struggle" of the master even if we can't see it?
  *   **The Lie is the Problem** → [LEAF] **The Deception or Moral View**
  *   **The Lack of Genius is the Problem** → [LEAF] **The Achievement View**

  ***

  ## Part 3: Your Resulting Position (The Leaves)

  ### 1. Aesthetic Empiricism (Duplicationism)
  *Found at: NODE 1-YES → NODE 4-No*
  **Definition:** Art value is strictly sensory; if you cannot perceive the difference, there is no difference in artistic merit.
  **Most Awkward Commitment:** You must accept that a machine-made perfect copy is just as good as a human-made original, rendering the concept of "genius" irrelevant to the art itself.

  ### 2. The Achievement View
  *Found at: NODE 3-No → NODE 7-B / NODE 6-No*
  **Definition:** An artwork is valuable because of the specific difficulties the artist overcame to create it; a copy inherits none of these challenges.
  **Most Awkward Commitment:** You have to admit that if God created a perfect universe instantly, a human laboring for centuries to mimic it creates "better" art despite having inferior results.

  ### 3. Historicism About Artworks
  *Found at: NODE 3-No → NODE 6-Yes*
  **Definition:** The identity and value of an artwork depend on its causal history and connection to the cultural moment of its making, not just its physical form.
  **Most Awkward Commitment:** You must believe that a painting physically altered to look like a masterpiece *loses* aesthetic properties simply because of its timeline, even if your eyes don't register the loss.

  ### 4. The Deception or Moral View
  *Found at: NODE 3-No → NODE 7-A*
  **Definition:** The problem with forgery is not ontological or aesthetic, but ethical; a fake is bad because it violates honesty, not because the object is "lesser."
  **Most Awkward Commitment:** You imply that a forgery is fine *if* you confess it upfront, meaning a lie is the only thing stopping the copy from being great.

  ### 5. Institutional-Contextualism
  *Found at: NODE 2-Superior → NODE 5-Rules*
  **Definition:** Something becomes art based on the rules of the artworld; originals carry institutional authority that copies do not.
  **Most Awkward Commitment:** You concede that if the "artworld" decided tomorrow that fakes were originals, you would have to agree, making art value a mere game of bureaucracy.

  ### 6. The Allographic Dissolve
  *Found at: NODE 1-YES → NODE 4-Yes (Genetic Priority)*
  **Definition:** Some art forms (like music/text) are defined by structure/types, meaning strict "forgery" is impossible because copies instantiate the same correct work.
  **Most Awkward Commitment:** You must accept that handwriting a poem is not "more original" than printing it, blurring the line between physical artifact and abstract idea.

  ### 7. Market / Commodity View
  *Found at: NODE 2-Superior → NODE 5-Magic*
  **Definition:** Originals only hold value when there is a system of exchange that enforces scarcity; otherwise, "authenticity" is just a marketing label.
  **Most Awkward Commitment:** You admit that if the economy collapsed, the Mona Lisa would become a meaningless piece of cardboard with no inherent aesthetic superiority.

  ***

  ## Part 4: Analysis of the Logical Space

  ### Empty Answer Combinations
  **Combination A:** "Canvas Loses Value" (Node 3-NO) BUT "Only Published Text Counts" (Node 6-NO).
  *   **Status:** Conceptually Tense / Incoherent.
  *   **Why:** If you argue the *physical canvas* degrades because of its history (Forgery), you must acknowledge history shapes the artwork. Yet, denying the significance of the *handwritten manuscript* (which is also a historical trace of the author's mind) creates an inconsistency regarding *which* histories matter. Either origins matter (Historicism/Achievement) or they don't.

  **Combination B:** "Audio Master is Superior" (Node 2-Superior) BUT "Perfect Paint Clone is Equal" (Node 1-YES).
  *   **Status:** Unexplored but possible.
  *   **Why:** This student likely relies on **Medium Specificity**. They may believe visual media requires uniqueness (tokens) while audio/media is naturally serial (types). This separates the *Ontology* of painting from *Ontology* of music, rejecting a unified theory of art.

  ### Ambiguous Leaves
  **Achievement View vs. Historicism:**
  *   **Flag:** These trees meet at Node 3 (Object Depreciates).
  *   **Issue:** Distinguishing whether the loss of value comes from the *difficulty of the act* (Achievement) or the *causal lineage* (Historicism) is difficult in practice. Both agree the copy lacks something the original possesses. In the handout, we separated them using the Manuscript Case (Process vs. Product), but most students conflate "how hard it was" with "where it came from."
  *   **Fix:** If a student splits the difference, they are likely a **Kantian Genialist**, holding both views simultaneously, though the prompt forces a binary choice for classification purposes.

  **Institutionalism vs. Market View:**
  *   **Flag:** Both appear under Node 5.
  *   **Issue:** The distinction is normative vs. descriptive. Institutionalism claims rules *constitute* art value. Market View claims money *assigns* value. A student can easily slide between these depending on whether they think museums dictate markets or markets dictate museums.

  ### Missing Positions
  **The "Anti-Realist" (Nothing Has Intrinsic Value):**
  *   This tree assumes artworks have *some* value. A radical subjectivist ("It’s all just decoration") might find every node confusing, as they would answer "Equal Value" to Node 1 but reject the seriousness of Node 2 entirely.

  **The Religious/Spiritual View:**
  *   Some views argue "soul" is transferred to the object. This fits nowhere in the logical grid provided (Science/Perception focused) and is therefore excluded from this taxonomy.
