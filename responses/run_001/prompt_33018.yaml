  ok here's the thing. I'm putting together a handout for an undergrad aesthetics unit on fakes and forgeries, and I want a decision tree that sorts students by what they actually think about why (or whether) originals have a value that a perfect copy lacks. start everyone at the same opening question and make each branch node a concrete case or a claim a student can answer without already knowing the ism it points to. no node should just ask are you a historicist about art.

  use at least these cases somewhere in the nodes: a forgery that fooled the experts for decades and is later exposed, a molecule-for-molecule duplicate of a painting, a bit-perfect copy of a recording, and a newly discovered manuscript page that changes how we read a novel.

  build the tree from the logical space first: work out which questions actually split the positions, then locate the named views as leaves, and say explicitly which answer-combinations are empty and whether that's because they're incoherent, unappealing, or just unexplored. also flag any two leaves your tree cant cleanly seperate.

  leaves i want: aesthetic empiricism or duplicationism, the achievement view, historicism about artworks, the deception or moral view, institutional-contextualism, and the allographic dissolve. each leaf gets a one-sentence note on its most awkward commitment. add a leaf for the view that originals only matter when there's a market for them, if you think it survives as a real position.

  keep it to 8 or 9 nodes, and keep philosopher names and ism labels out of the diagnostic questions themselves.
