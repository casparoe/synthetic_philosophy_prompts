answer: |-
  Automatic enrollment for retirement presupposes a theory of autonomy that prioritizes long-term welfare over immediate friction. It assumes employees are time-inconsistent agents who value retirement security but procrastinate due to cognitive costs. By removing the active cost of enrollment, the default aligns immediate behavior with latent preferences. Legitimate paternalism here is justified by the “beneficial mistake” assumption: inertia leads to financial vulnerability, so overriding it respects the employee’s true interests. Choice remains structurally available via opt-out, preserving formal liberty while correcting procedural failures in decision-making.

  To distinguish this from mandatory health screenings, one must appeal to boundaries beyond welfare outcomes. The most plausible principle is the sanctity of bodily integrity versus financial convenience. Medical interventions involve physical intrusion and private biological data, invoking a stronger duty of informed consent rooted in personal sovereignty than payroll deductions do. Additionally, the error profile differs: failing to save is a slow accumulation of poverty, whereas an unrequested medical test involves immediate privacy violation and potential false positives that trigger anxiety or unnecessary follow-ups. Thus, the default in finance is an assistive scaffold; the default in medicine risks being an unwarranted imposition on the person.

  However, these distinctions fray under scrutiny. If the goal is welfare maximization, a missed cancer screening is arguably more harmful than missed savings. If opt-out rates for retirement approach zero due to inertia, the “choice” is illusory, mirroring the pressure felt in health contexts. The committee’s rejection of the health nudge suggests they view medical consent as categorical, not instrumental. Yet this creates tension: if the organization is permitted to shape financial habits through psychology, why is it forbidden to shape health behaviors using the same mechanism? Consistency requires either accepting both as benevolent paternalism or rejecting both as manipulative. Currently, the distinction holds only if one accepts a deontological wall between the body and the bank account—a commitment that is culturally common but philosophically fragile when facing identical behavioral mechanisms.

