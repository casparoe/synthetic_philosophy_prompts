      *   *Interpretation 2: Qualitative Identity (The "Green" Intuition).* Specific properties hold constant (e.g., color). This is the standard Humean hope, but fails against grue.
      *   *Interpretation 3: Causal/Structural Similarity.* Laws remain constant, not just observations.
