      *   *Scenario D: Entrenchment/Projectibility (Goodman's Solution).*
          *   Claim: We look at which predicates have worked before historically.
          *   Verdict: This solves it, but isn't the "Future resembles past" slogan. It shifts the basis.

  5.  **Analyzing the Professor's Move:**
      *   The professor says: "Nature is uniform."
      *   Why is this insufficient? Because Goodman shows "Uniformity" needs to be *defined*. Uniformity according to *what* features? If nature is uniform according to 'grue', then 'grue' is valid. If uniform according to 'green', 'green' is valid.
