  The Robert Moses parkway overpasses substantiate Langdon Winner’s “weak” thesis regarding technological politics while simultaneously exposing the fragility of locating power solely within physical form. These artifacts do not demand authoritarianism by physical necessity (Winner’s “strong” case); rather, they are merely highly compatible with exclusionary social orders. The distinction matters: a nuclear reactor requires centralised control to prevent meltdown, whereas a nine-foot bridge merely renders buses impractical without making them impossible. Thus, the bridges encode a preference for private car ownership, but they do not metaphysically compel it. They satisfy Winner’s second category—arrangements that are compatible with specific forms of life—but fail the strict requirement of inhering politics within their very substance.

  The historical debate over Moses’ intent—whether he personally dictated clearances or simply adhered to engineering norms—complicates yet ultimately strengthens Winner’s broader point. If the story is myth and the heights were standard practice, the politics shift from individual malice to systemic inertia. Winner argues that artifacts can embed politics irrespective of conscious design, provided they are adopted within unequal power structures. A standard clearance becomes a political weapon when combined with segregated housing and transit deserts. Therefore, the lack of direct evidence for Moses’ conspiracy does not negate the artifact’s political function; it merely demonstrates that discriminatory outcomes often arise from unexamined technical conventions rather than explicit conspiracy. The politics reside in the alignment of the technical specification with the prevailing social hierarchy.

  However, deploying this case reveals a blind spot in Winner’s framework: the conflation of technical affordance with political inevitability. Winner implies the politics sit *in* the concrete. In reality, the bridge is politically inert outside its specific socio-geographic context. Its discriminatory capacity depends entirely on the existence of low-clearance buses versus high-clearance automobiles, a configuration subject to change. If the city mandated larger vehicles or built different routes, the politics vanish. Winner underestimates the malleability of technology; he treats the artifact as a fixed constraint rather than a node in a negotiable network. He struggles to distinguish between properties inherent to the object and those imposed by the surrounding institutional web. Winner treats the technical specification as a standalone variable, ignoring that a ‘nine-foot clearance’ only carries political meaning because of the specific distribution of wealth and transportation modes in 1950s America. Remove the racialised zoning or the car-dependent urban planning, and the bridge is just a bridge.

  Furthermore, Winner’s reliance on this anecdote risks obscuring the agency of non-technological resistance. People found ways around the bridges; the politics were contested, not sealed. By focusing heavily on the material object, Winner potentially diverts attention from the legislative and judicial battles that actually determined access. The bridges test the thesis by showing that while artifacts can constrain, they do not determine. They create friction, not destiny. Consequently, the true lesson of the Moses bridges is not that concrete has a soul, but that engineering choices are rarely neutral, serving as crystallisations of existing power dynamics that remain open to challenge only when we recognise the political nature of the design process itself. To treat the artifact as the primary locus of politics is to ignore the fluidity of the human systems that build and navigate it.
