      The Robert Moses parkway overpasses substantiate Langdon Winner’s “weak” thesis regarding technological politics while simultaneously exposing the fragility of locating power solely within physical form. These artifacts do not demand authoritarianism by physical necessity (Winner’s “strong” case); rather, they are merely highly compatible with exclusionary social orders. The distinction matters: a nuclear reactor requires centralised control to prevent meltdown, whereas a nine-foot bridge merely renders buses impractical without making them impossible. Thus, the bridges encode a preference for private car ownership, but they do not metaphysically compel it.

