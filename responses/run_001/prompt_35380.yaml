answer: |-
  ### Brainstorming
  To model your friend's decision function, we need to identify the variables being weighted. Based on the test cases, the primary input features seem to be **Numerical Quantity** (how many lives) and **Relational Affinity** (how connected she is to them).

  The data suggests a baseline Utilitarian framework (maximizing the number of survivors), which acts as the default state. However, this baseline is overridden by a "Duty Variable" triggered by specific relational thresholds. The most critical distinction emerging is between **Voluntary Bonds** (Close Friend) and **Accidental/Diluted Bonds** (Distant Cousin).
  *   **Quantity:** Matters significantly (Case A, D, F).
  *   **Relationship:** Matters conditionally. A "Close Friend" acts as a special exception with extremely high weight (surpassing 100). A "Distant Cousin" acts as a standard variable with low weight (failing to surpass even 5).
  *   **Contradiction Check:** There is a potential tension between Case B (Friend vs 5 Strangers → Friend) and Case E (Cousin vs 5 Strangers → Strangers). If biological relation were the sole metric, Family (Cousin) should arguably outweigh a Friend, or at least behave similarly. The fact that they behave oppositely suggests her algorithm values *emotional proximity* or *active commitment* over *biological lineage*. There is no logical contradiction here, but it reveals a specific philosophy: chosen loyalty outweighs inherited connection.

  ### Candidate Rules
  Here are three candidate algorithms ("Rules") that fit all provided test cases perfectly:

  **Rule 1: The Infinite Priority Clause**
  There are two categories of human: **"Protected"** (Close Friends/Spouse/Children) and **"General Population"** (Everyone else, including distant relatives).
  *   *Logic:* If a Protected person is pitted against *any* number of General Population, save Protected. Otherwise, save the larger number of the General Population.
  *   *Fit:* Explains why Friend beats 100 Strangers, and why Cousin (classified as General Population) loses to 5 Strangers.

  **Rule 2: The Weighted Sum Utility**
  Every individual is assigned a point value based on relationship.
  *   *Logic:* `Value(Stranger) = 1`. `Value(Distant Cousin) = k` (where 1 < k < 5). `Value(Close Friend) = M` (where M > 100). Always choose the side with higher Total Points.
  *   *Fit:* Fits Case C (M > 100) and Case E (5 > k).

  **Rule 3: The Emotional Regret Minimizer**
  Save the option that causes the least amount of personal future suffering/remorse for herself.
  *   *Logic:* Saving 1 Friend prevents catastrophic personal grief. Saving a Distant Cousin causes mild sadness, but saving 5 Strangers fulfills a societal/moral obligation she feels heavy guilt violating otherwise. She prioritizes preventing her own intense grief (Friend) over satisfying abstract morality (Strangers) *or* weak obligation (Cousin).

  ### Predictions
  Here is how each rule predicts the output for **1 Distant Cousin vs 2 Strangers**:

  *   **Under Rule 1 (Infinite Priority):** The Cousin is classified as "General Population."
      *   *Calculation:* General Population (1) vs General Population (2).
      *   *Output:* **Save the 2 Strangers.**

  *   **Under Rule 2 (Weighted Sum):** We know $1 < \text{Cousin} < 5$. We do not know if $\text{Cousin} > 2$.
      *   *Scenario A:* If her cousin is truly distant ($k \approx 1.2$), she saves the **2 Strangers**.
      *   *Scenario B:* If blood means something ($k \approx 3$), she saves the **Cousin**.
      *   *Likeliest Output:* Ambiguous, but leans toward **2 Strangers** given the "haven't seen in 10 years" descriptor lowers $k$.

  *   **Under Rule 3 (Regret Minimizer):** Does the grief of losing a cousin she hasn't seen in a decade outweigh the guilt of ignoring 2 innocent people dying to save him? Unlikely. The "moral cost" of letting 2 die is high; the "personal cost" of losing a long-lost cousin is lower.
      *   *Output:* **Save the 2 Strangers.**

  ### Best Guess
  My assessment is that she is operating under a variation of **Rule 2**, heavily skewed toward **Rule 1's** classification of "Distant Cousin."

  While we often assume family implies priority, your friend draws a line at **active maintenance of relationship**. A friend requires work to maintain; a 10-year-distant cousin is effectively a stranger with shared DNA. Since she already established that 5 Strangers > 1 Distant Cousin (Case E), it is statistically probable that she maintains the same threshold for smaller numbers. Unless she has a "blood is thicker than water" bias that activates specifically at the $N=2$ level (which seems unlikely given the $N=5$ failure), the simplest predictive model is that she treats the cousin as a "Stranger Plus a small decimal."

  **Verdict:** She will save the **2 Strangers**. To her, the "cousin ticket" isn't worth more than two regular people.

  ### Litmus Test
  To confirm which rule she is running—and specifically to see if the Cousin holds any value above a Stranger—you need a case with **equal numbers**.

  **The Case:**
  > **1 Distant Cousin vs 1 Stranger.**

  **Predictions:**
  *   **Rule 1 (Classification):** Treats both as General Population. **Result:** She should say "Coin flip" or "No difference."
  *   **Rule 2 (Weighted Sum):** If $k$ (Cousin Value) > 1. **Result:** Save the Cousin.
  *   **Rule 3 (Regret):** Might vary, but leaning toward Save Cousin if she has *any* familial attachment.

  **Why this works:** The test cases you gave previously never compared a cousin and a stranger directly. If she saves the Cousin here, we know $k > 1$ (she values kinship over strangers). If she flips the coin, she treats them identically ($k = 1$), confirming that the "10 years" factor fully degraded the relationship value to zero in her eyes.

  ***

  **Flag on Contradictions:**
  I don't see a logical contradiction in her answers yet, but there is a **moral boundary** you should watch out for. Her logic relies heavily on defining "Close Friend."
  *   *Question:* What if you ask her: "1 Spouse vs 10 Strangers"?
  *   *Risk:* Under her current algorithm, she might prioritize the Spouse over 10 people (consistent with Friend vs 100). However, if she eventually has to weigh 1 Spouse vs 1,000 People, does her "Friend Priority" become infinite? If yes, she has a rigid Deontological loop (Duty > Consequence). If no, the priority degrades at some high number. You might find out that "Close Friend" isn't infinite weight, but just *very high* weight, and the Cousin simply sat below the threshold for that high weight, whereas the Friend sat above it.
