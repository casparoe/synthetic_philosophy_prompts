answer: |-
  To resolve your framework’s tensions, you should amend your defense of sweatshops to acknowledge moral complicity and tighten your definition of voluntary exchange to exclude coercive desperation. 

  Your most severe tension lies between proposition (2) and proposition (6). Proposition (2) asserts that refusing to buy from sweatshops makes workers worse off, implying such refusal is practically immoral, whereas (6) claims boycotts are admirable moral actions. You cannot consistently hold that a specific refusal harms victims and yet is praiseworthy without distinguishing between individual impact and collective signaling. The least costly revision is to amend (2) to state: purchasing is permissible to minimize immediate material harm, but withholding payment is still a valid moral signal of disapproval against unjust structures. This aligns with (6) by validating the moral intent of the boycott while maintaining the pragmatic warning against individual isolation from the market.

  The second-severity tension exists between proposition (1) and propositions (3) and (4). Proposition (1) presumes exchange is permissible unless there is a strong justification for prohibition, yet (3) mandates legal bans on price gouging and (4) admits transactions can be wrongful exploitation even if mutually beneficial. Your current (1) suggests a heavy burden of proof for regulation, while (3) and (4) assume certain structural vulnerabilities (desperation, unfair dominance) inherently invalidate the presumption of legitimacy. The least costly revision is to add a proviso to (1): voluntary exchange presumes a lack of coercive necessity or grossly asymmetric power dynamics. This narrows the scope of "voluntary" to naturally exclude price gouging (necessity) and severe exploitation (asymmetry) without abandoning the general presumption of permissibility in standard commerce.

  Finally, proposition (5) presents only an apparent tension with (1). Once (1) is revised to define "voluntary" narrowly, the prohibitions on selling kidneys and votes become examples of the "strong justification" already required by (1) rather than exceptions to the rule. Commodification arguments provide the necessary justificatory strength (human dignity/intrinsic value) demanded by (1), meaning no revision is needed for (5) itself once the definition of voluntary in (1) is clarified to recognize inherent dignitary harms alongside physical coercion.
