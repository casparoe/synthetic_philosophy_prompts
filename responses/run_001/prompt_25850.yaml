answer: |-
  Here is the translation of the Frame Problem into the vocabulary of formal specification, state-space search, and system architecture, followed by a residue report analyzing the mapping gaps.

  ---

  ### Part 1: The Classical AI Formulation
  **Original Context:** McCarthy & Hayes (1969), Situation Calculus.
  **Engineering Concept:** Explicit State Transition Systems & Hoare Logic.

  In the Situation Calculus, a *situation* is a total snapshot of the world state at time $t$. An *action* is a function that transitions situation $S_0$ to $S_1$.
  The problem arises when specifying these transitions formally.

  *   **The Naive Implementation:** For every action $A$ and every fluent (state variable) $F$, you must specify if $A$ changes $F$. If $A$ does not change $F$, you must explicitly add a **Frame Axiom**: $Poss(A, S) \implies F(S) = F(Result(A, S))$.
  *   **The Mapping to Software Engineering:** This is identical to writing Hoare Triples $\{Pre\} \text{Op} \{Post\}$ for a method `Op`.
      *   **Postcondition Bloat:** If your system has $N$ state variables and $M$ operations, a naive specification requires defining the post-state for all $N$ variables for every operation. Even if 99% remain invariant, the spec size grows as $O(N \times M)$.
      *   **Separation Logic as the Patch:** Modern formal methods (specifically Separation Logic) solved this syntactically. You specify `modifies x` (the frame clause). The verifier implicitly assumes all other heap locations are unchanged (the *frame rule*).
  *   **The "Logical" Frame Problem:** This is purely a specification scalability issue. How do you compress the transition relation so you don't have to write out $x' = x, y' = y, \dots$ for every single action? It is a problem of **representation compactness**.

  ### Part 2: The Philosophical Generalization
  **Original Context:** Dennett, Fodor, Haugeland (Late 80s/Early 90s).
  **Engineering Concept:** Dependency Analysis, Impact Assessment, and Resource-Bounded Reasoning.

  Dennett reframed the problem not as "how do we represent non-change?" but "how do we predict *relevance*?" (often called the **Epistemic Frame Problem**).
  Consider Dennett’s robot "R2-D1." When tasked with retrieving a battery from a room with a bomb on a wagon, it calculates the effect of pulling the wagon. It proves the battery moves. It also deduces the lightbulb moves, the door closes, the dust settles, the temperature shifts...
  It runs out of CPU cycles verifying irrelevant facts, while the bomb explodes.

  *   **The Engineering Concept:** This maps to **Side-Effect Analysis** and **Causal Dependency Graphs**.
  *   **The "Relevance" Problem:** Before executing a transaction `Tx`, how does the system filter the set of all possible global state variables $\Sigma_{global}$ down to the subset $\Sigma_{relevant}$ that actually constrains safety or correctness?
      *   In a microservices architecture, this is the nightmare of distributed tracing: "If I change service A, what *could* fail in service Z?"
      *   In testing, this is the boundary between Unit Tests (controlled state) and Integration Tests (unknown relevance).
  *   **The Core Difficulty:** In a closed software system, relevance is determined by static analysis or type systems. In the philosophical "world," relevance is contextual, abductive, and often counter-factual.
      *   *Example:* Pulling the wagon causes the bomb to detonate not because the bomb is attached to the wagon, but because the bomb was placed there by an actor reacting to the environment. Static dependency analysis misses this because the "reactivity" isn't encoded in the object graph.

  ---

  ### Part 3: The Residue Report

  Here is the breakdown of where the analogy holds, where it bends, and where it breaks.

  #### 1. What Maps Cleanly (The Solvable Parts)
  *   **Combinatorial Explosion:** The $O(N \times M)$ specification growth is a known engineering problem. It maps perfectly to the difficulty of maintaining large contracts in massive monoliths.
      *   *Your Fix:* **Separation Logic**, Ownership Types (Rust), and Transactional Memory. These languages enforce "minimal frame updates" at compile time. You literally cannot write code that touches memory you didn't claim.
  *   **Implicit Defaults:** The philosophical assumption that "dogs sleep until awakened" maps to the **Closed World Assumption** in databases and logic programming. If a property isn't asserted true, it's false.
      *   *Your Fix:* Immutability by default. If a state value isn't passed through an immutable ref, it can't change. This eliminates the need to assert "nothing changed" because the compiler enforces it structurally.
  *   **The "Sleeping Dog":** This maps to **Idempotency** and **Stable State** patterns. In event sourcing or CRDTs, we explicitly design for the fact that "no-op events should result in no state change."

  #### 2. What Requires Distortion (The Stretch Fits)
  *   **Indirect Effects (Ramification):** The philosophers talk about a domino chain: Pushing a button lights a bulb, which scares a mouse, which opens a valve.
      *   *Engineering Distortion:* In software, we handle this via **Event Streams** and **Triggers**. However, engineers treat these as *bugs* if unintended. The Frame Problem treats them as inherent features of a complex world.
      *   *Translation:* We view "unintended indirect effects" as **Integration Test Gaps**. The philosopher asks "How do I know what changed?" The engineer asks "Which integration tests failed?" The philosophical problem becomes a CI/CD pipeline constraint.
  *   **Context Sensitivity:** Whether a move is "legal" depends on the context (a pawn moves differently at the start vs. the end).
      *   *Engineering Distortion:* We call this **Runtime Polymorphism** or **Conditional State Guards**. However, we usually try to eliminate this by enforcing State Machines. The "distortion" is forcing dynamic context into a statically typed Finite State Machine (FSM).

  #### 3. What Has No Counterpart (The Breakdowns)
  This is where the residue accumulates. There are three specific areas where the Software Engineering vocabulary fails to capture the philosophical weight of the problem.

  **A. The Open-World Assumption vs. Binary Determinism**
  *   **The Gap:** In AI/Philosophy, the "world" contains unmodeled entities. The robot must reason about things it hasn't encountered yet.
  *   **Engineering Reality:** In your codebase, *there is nothing outside the interface*. If it's not imported, it doesn't exist. The Frame Problem presupposes an infinite set of potential fluents. Your environment has a finite (though large) set of defined types.
  *   **Why?** You operate under a **Closed World Assumption**. You define the universe of discourse. The philosophical Frame Problem assumes the universe is larger than the model. Until you are building software that interacts with raw physical reality (Robotics/IoT), you never face the *ontological* part of the Frame Problem, only the *algorithmic* part.

  **B. Abductive Relevance (The "Why" vs. The "What")**
  *   **The Gap:** The philosopher worries about why a fact became relevant. In the R2-D1 example, the robot didn't just calculate facts; it had to prioritize *which* facts mattered for the goal.
  *   **Engineering Reality:** We offload relevance to the **Architect**. The architect defines the bounded context. If service A shouldn't care about Database B, it's a design error, not a computational limit.
  *   **Why?** Engineering solves relevance via **Abstraction Boundaries** (APIs, Modules). You explicitly partition the state space. The Frame Problem is about the cost of calculating relevance *without* those pre-defined partitions. You get the benefit of the partition without paying the tax of justifying it dynamically.

  **C. The Burden of Explanation (Explainability)**
  *   **The Gap:** The philosophical frame problem implies that to be rational, an agent must be able to explain *why* it ignored a certain variable.
  *   **Engineering Reality:** We don't require proofs of non-influence in production logs (mostly). We rely on **Garbage Collection** and **Memory Management**. If a variable isn't referenced, it dies. We don't ask "Why did the GC ignore this memory?"
  *   **Why?** Because engineering prioritizes *Correctness* over *Justification*. As long as the post-condition holds, we don't care if the proof path was efficient or intuitive. The Frame Problem is partly an *aesthetic* problem about ideal rationality. Software is a pragmatic mess.

  ### The Verdict on the "Missing Vocabulary"

  Your vocabulary isn't missing a concept; it is optimizing for a different domain constraint.

  1.  **You solve the Logical Frame Problem with Language Design.** Rust's borrow checker is a hardware-enforced Frame axiom. It prevents you from modifying the stack while reading the heap. You don't need to *think* about the frame; the compiler forbids the invalid transition.
  2.  **You solve the Epistemic Frame Problem with Architecture.** Microservices and Event Storming are attempts to manually curate relevance. By splitting the system, you reduce the $N$ in $O(N \times M)$.
  3.  **What remains?** The "Residue" is the **Emergent Complexity** of distributed systems. When a race condition appears in a distributed consensus algorithm (like Raft), it feels like the Frame Problem: you changed node A, and somehow node Z violated its invariant.
      *   *Translation:* That is the **Frame Problem manifest as a Concurrency Bug**. It is the failure of the "assumed non-interaction" between modules.
      *   *Difference:* In philosophy, this is a barrier to AGI. In software, this is a Jira ticket labeled "Race Condition."

  **Summary:** The Frame Problem is real in software, but it manifests as **Testing Coverage**, **Dependency Hell**, and **Race Conditions**, rather than a logical paralysis of the machine. You have effectively "patched" the classical Frame Problem by building systems that allow us to assume modularity and determinism, trading flexibility for verifiability. The philosophical danger arises when you try to apply that engineering modularity back to the messy, open-ended world—where that is exactly what the AGI researchers argue *fails*.
