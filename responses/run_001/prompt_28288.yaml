      *   **Section 3: Evaluating Maya.** She wins on the Symmetry/Intuition. Unopened, symmetry dictates no gain. She correctly identifies the "Variable Ambiguity" (X means different things). Her claim about the random choice ensuring 50/50 *conditioned on observation* is the weak point (that requires a specific prior).
      *   **Section 4: The Convergence.** They agree on the "Variable Slip." This is the standard resolution (often attributed to Barry Nalebuff or similar analyses). $E[Switch] = E[X_{large}] - E[X_{small}] = 0$.
      *   **Section 5: The Remaining Glimmer of Disagreement.** What separates them? It's subtle. Dan focuses on *information theory* (you need data to update beliefs). Maya focuses on *cognitive psychology* (why the brain is tricked). Dan emphasizes "You can't do the math." Maya emphasizes "The math was faked."
