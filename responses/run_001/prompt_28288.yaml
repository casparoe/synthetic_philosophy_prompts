  6.  **Refining the content (Self-Correction during drafting):**
      *   *Correction:* I need to be careful with Maya's second argument. She says "What if you don't open?" In the unopened scenario, the EV is indeed zero by symmetry. But she says the EV calculation *still* seems to say +EV. Yes, because people plug in $x$ blindly.
