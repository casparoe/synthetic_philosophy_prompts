answer: |-
  You have hit on one of the most persistent fault lines in modern jurisprudence. Your intuition is correct: the debate over the self-amendment paradox (often called the *puzzle of constituent power*) has effectively entered a state of equilibrium. Neither side wins, neither side retreats, and the literature indeed tends to circle.

  To answer your question directly: **This is primarily a methodological and ontological disagreement masquerading as a logical one.** It is not a simple verbal dispute (though semantics play a role), nor is it a solvable formal problem within current systems. It is a collision between two incompatible ways of modeling reality.

  Here is a diagnosis of why the debate is frozen, followed by an assessment of whether (and how) it could ever be unblocked.

  ### 1. The Core Disagreement: Static Logic vs. Dynamic Facticity

  The fundamental fracture is between those who view law as a **closed logical system** and those who view law as a **temporal social process.**

  *   **The Logicians (Alf Ross / Hans Kelsen):** They model the legal system like Euclidean geometry or propositional calculus. For them, validity is derived strictly from hierarchy. If Rule $A$ gives the authority to change itself, then the moment $A$ is repealed, the authority to change it vanishes. Therefore, the new Rule $B$ lacks the pedigree required to validate its own existence. To them, this is a genuine logical contradiction ($X$ cannot authorize its own non-existence).
  *   **The Process/Theorists (H.L. Hart / Peter Suber / Legal Realists):** They model law as a social game in time. For them, validity is determined by **efficacy** and **recognition** at the moment of enactment. If the officials and the populace accept the new text, it is valid *because* it is accepted. The continuity of the system does not depend on a chain of logical implication extending back to a foundational axiom; it depends on the continuous exercise of power and acceptance.

  **Why it's frozen:** The Logicians say, "If you admit a rule can bootstrap itself, you destroy the concept of objective validity." The Process-Theorists say, "If you insist on strict logical pedigree, you cannot explain how any revolution or major constitutional overhaul is possible." Since both premises describe important features of law, but cannot coexist in the same model, the argument stalls.

  ### 2. The Semantic Trap: What is "Validity"?

  You asked if it is a verbal dispute about "validity." It is close, but deeper. It is a dispute about the **nature of norms.**

  *   **Propositional Validity:** For the Kelsenian, a norm is valid if it can be traced back to the *Grundnorm* (Basic Norm) without breaking the chain of authorization.
  *   **Social Validity:** For the Hartian/Suber-ite, a norm is valid if it is part of a set of rules accepted by officials as standards for conduct.

  Peter Suber, in his magnum opus *The Paradox of Self-Amendment*, actually tries to bridge this. He distinguishes between **logical validity** (which may be absent) and **legal validity** (which is present due to practice). However, critics argue that once you separate them, you haven't actually solved the *legal* paradox; you've just admitted that legal systems aren't governed by strict logic in the first place.

  When Ross attacks the paradox, he is attacking the *logical coherence* of the system. When Suber defends against it, he is arguing that the *social function* of the system overrides the logical glitch. They are speaking different technical languages regarding what "law" fundamentally is.

  ### 3. The Hidden Variable: Constituent Power

  The reason this cannot be settled with a "better formal argument" is that the paradox is actually a proxy for a political theory problem: **Who holds sovereign power?**

  The self-amendment problem collapses if you distinguish between the **Constituted Power** (the government acting under the existing constitution) and the **Constituent Power** (the People/Sovereign acting outside or above the constitution).
  *   If the Constitution is the supreme master, the paradox stands (how can the master give orders to kill itself?).
  *   If the "People" are the ultimate source of power, the amendment clause is merely a tool used by the People. The People can bypass the clause if they have enough power.

  However, if you introduce "The People" as an external entity, you leave the realm of "pure legal theory" and enter political theory/metaphysics. The Logicians refuse to bring the "People" into the logic gate because it smuggles in extra-legal facts. The Realists insist that ignoring the "People" makes legal theory irrelevant to reality.

  ### 4. Is There Any Way to Move the Debate?

  Can this be solved? Likely not in the traditional sense, but the deadlock can be broken by shifting the frame of inquiry. Here are three paths that would actually move the needle:

  #### A. Move from "Logic" to "Systems Theory" (Niklas Luhmann)
  Autopoietic systems theory treats law not as a hierarchy of norms but as a communicative network that reproduces itself. In this view, the paradox dissolves because validity isn't about derivation; it's about **self-reference**. A system can refer to itself to create new structures without needing an external logical anchor.
  *   *Potential:* High. This reframes the paradox from a bug (illogic) to a feature (autopoiesis). It has been gaining traction but hasn't fully displaced the Kelsenian/Hartian orthodoxy.

  #### B. Treat it as a Computer Science Problem (Formal Verification)
  Modern computer scientists working on **formal verification of smart contracts** and **governance protocols** (DAOs) are actively running into the self-amendment paradox. They don't care about philosophical validity; they care about execution.
  *   *Action:* If someone were to build a formally verified constitution (code) where self-amendment is impossible without a multi-signature threshold, they would empirically demonstrate how the "paradox" is managed operationally. If the code runs successfully despite the theoretical paradox, it forces legal theory to update its models to fit the computational reality.
  *   *Potential:* This is currently the only area where the problem is being "solved" pragmatically.

  #### C. Accept the "Fiction" Thesis
  Some scholars suggest we should stop treating the constitution as a logical starting point. Instead, treat the "continuity of validity" as a useful **legal fiction**. We pretend the chain of authorization is unbroken so that citizens can trust the government.
  *   *Argument:* The "Paradox" is only a problem if you believe legal logic mirrors mathematical logic. If you admit legal logic is pragmatic reasoning (like engineering), then the paradox is simply a stress test that shows where the fiction begins.
  *   *Potential:* Low impact philosophically, but high impact pedagogically. It allows students to stop worrying about Kelsen and start worrying about stability.

  ### Conclusion: What Kind of Disagreement Is It?

  It is a **categorical mismatch**.

  *   One side (Ross/Kelsen) is asking: *"Does this rule satisfy the conditions of a perfect normative syllogism?"*
  *   The other side (Suber/Hart) is asking: *"Do people obey this rule and punish violations?"*

  You cannot answer the first question with data from the second, and vice versa.

  **The Verdict:**
  This is unlikely to be resolved by a "smoking gun" paper proving one side wrong. That is because **both sides are describing valid aspects of legal systems.**
  1.  Laws do operate within a structure of authorized change (Kelsen is right about the structure).
  2.  Laws ultimately rest on social acceptance and power (Hart is right about the foundation).

  **How to move forward:**
  The debate will only move if legal theory abandons the idea that the goal is to construct a **perfectly valid logical system** in favor of modeling law as a **dynamic, unstable information system.** The "paradox" is actually evidence of the transition period between an old order and a new order—a state where neither full legality nor full illegality applies.

  If you want to contribute to this, do not try to solve the logic puzzle better than the others. Instead, investigate how legal systems handle **transitional validity**—what exactly happens to a court ruling issued in the 24 hours between the repeal of an amendment rule and the ratification of a new one? That empirical gray zone is where the philosophical stalemate actually lives, and it is largely unexplored territory.
