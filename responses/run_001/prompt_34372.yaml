answer: |-
  You have stumbled upon one of the most robust and well-discussed concepts in philosophy, economics, and political theory. Your intuition is sharp: this isn't just "willpower," and the discomfort you feel regarding the "same person" restriction is actually a central debate in moral philosophy.

  There isn't just one name for this, but rather a family of terms depending on which lens you use (philosophy, economics, law). However, they all point to the same phenomenon.

  Here is the breakdown of what you are describing, why it feels paradoxical, and how experts reconcile the tension between Tuesday-you and Wednesday-you.

  ### 1. The Terminology: Ulysses Contracts and Precommitment

  The most famous philosophical term for this is the **Ulysses Contract** (or Ulysses Pact).

  It comes from Homer’s *Odyssey*. When Odysseus (Ulysses) and his crew were sailing past the island of the Sirens, he knew their beautiful singing would drive him mad, compelling him to steer the ship onto the rocks and die. However, he wanted to hear their song. So, he ordered his crew to tie him tightly to the mast of the ship. He told them that no matter how much he begged, screamed, or ordered them to unbind him, they should ignore him and sail past until the danger passed.

  *   **Philosopher:** Jon Elster wrote a seminal book called *Ulysses and the Sirens* (1979) dedicated entirely to this problem.
  *   **Economists:** They call this a **Precommitment Strategy**.
  *   **Decision Theorists:** They call this managing **Time Inconsistency**.

  In your examples: the credit card in the freezer is a Ulysses Contract. The cigarette handover is a Ulysses Contract. The hard-to-amend Constitution is a macro-level Ulysses Contract.

  ### 2. Why It Feels Unsettling: The "Multiple Selves" Problem

  You asked specifically: *"Why should the you of Tuesday get to boss around the you of Wednesday?"* and *"Which one is the real you?"*

  This is the exact problem philosophers struggle with, and your unease is justified. If I am one continuous person, how can one part of me enslave another part of myself without violating my own autonomy?

  To understand this, we have to look at two conflicting views of human identity:

  **View A: The Unified Self**
  We often assume we are a single, rational agent. Under this view, precommitment looks contradictory. If I bind myself today, I am violating the freedom of my future self. If the future me genuinely consents to break the bond, shouldn't that current consent override the past one?

  **View B: The Multiplicity of Selves (Temporal Agents)**
  Modern psychology and behavioral economics suggest that "You" are not a single entity. You are a series of temporal selves.
  *   **Wednesday-you** is driven by immediate emotion, pain relief, and impulse (System 1 thinking).
  *   **Tuesday-you** is capable of abstract reasoning, long-term planning, and values health/freedom (System 2 thinking).

  When you ask which one is "real," decision theory suggests **neither owns the full title.** They are both manifestations of the same biological organism, but with competing utilities. Tuesday-you is acting as a trustee for the organism's long-term survival.

  ### 3. Second-Order Desires and True Autonomy

  The philosopher **Harry Frankfurt** offers a solution to your specific unease. He distinguished between:
  1.  **First-order desires:** "I want to eat the cake."
  2.  **Second-order desires:** "I want *not* to want to eat the cake."

  When you put your credit card in the ice, you are prioritizing your second-order desire over your first-order desire. For Frankfurt, this isn't losing freedom; it is **authenticating** it.

  If you didn't bind your hands, you would be a slave to your impulses (compulsive shopping). By tying your hands, you ensure your actions match your deeper, reflective values. Therefore, Tuesday-you doesn't just have "authority"; Tuesday-you represents the version of you that holds your actual agency, while Wednesday-you (in the throes of addiction or panic) is temporarily compromised.

  ### 4. The Political Theory Angle: Constitutions as Precommitment

  Your example about constitutions brings us to **James Madison** and the American Founders.

  Madison understood this perfectly. In *Federalist No. 49*, he argues that appeals to the people every time a new difficulty arises are dangerous. People are swayed by temporary passions and demagogues. A Constitution is essentially a national Ulysses Contract.

  The Founders tied their own hands (and the hands of future generations) with Amendment procedures (Article V) and entrenched rights, explicitly stating: *We know that future voters might make rash decisions, so we are building walls now to protect liberty.*

  However, this is where the debate gets heated among constitutional scholars:
  *   **The Pro-Commitment view:** This preserves the rule of law and prevents tyranny of the majority.
  *   **The Anti-Commitment view:** This creates "Dead Hand Control." It implies that dead people (those who wrote the constitution centuries ago) have more power than living people. If society evolves morally (e.g., views on slavery or gender), a rigid precommitment can make progress impossible, creating injustice.

  ### 5. Is It Rational? (The Normative Debate)

  You asked if people disagree on whether it is rational. Yes, absolutely.

  **Argument for Rationality:**
  If my future self suffers from **Hyperbolic Discounting** (a cognitive bias where I heavily value immediate rewards over vastly larger future costs), then my future self is irrational. Therefore, binding that future self restores rationality. It is a strategic move to overcome weakness of will (*akrasia*).

  **Argument Against Rationality:**
  1.  **Loss of Flexibility:** Sometimes circumstances change. Maybe the ice-blocker had a medical emergency requiring money. Maybe the smoker had a terminal illness diagnosis where quitting mattered less than comfort. Precommitment assumes you know your future needs better than your future self does, which is arrogant.
  2.  **Stagnation:** If Tuesday-you always dominates Wednesday-you, you never grow. Sometimes changing your mind is a sign of maturity, not a failure of character.
  3.  **Coercion:** Even if internal, it feels coercive. Some theorists argue that true autonomy requires the ability to fail. If you cannot choose the "wrong" thing because you built a wall around yourself, can you truly claim virtue for choosing the "right" thing?

  ### Summary: What is going on?

  The specific phenomenon you are tracking is a **Self-Imposed Precommitment Strategy** designed to mitigate **Time Inconsistency** and **Weakness of Will (Akrasia)**.

  The "weirdness" you feel comes from the tension between **Liberty as Non-Interference** (I shouldn't be stopped by anyone) and **Liberty as Authenticity** (I should only do what aligns with my deepest values).

  In this framework, your friend putting her card in the freezer is making a judgment call: *"My future pleasure-seeking self is a liar/thief against my future financial security. I must disarm it now."*

  It is unsettling because it acknowledges a crack in the armor of the "Unified Self." It admits that we are not always the masters of our own minds, and sometimes we have to build prisons for our own impulses to survive. As Jon Elster concluded: *"Self-binding is an admission of weakness, but it is also an assertion of strength."*

  You aren't overthinking it; you're engaging with a fundamental paradox of human existence. We try to govern our future selves because we know, deep down, that those future selves might betray us.
