answer: |-
  ### The Ontological Fault Lines of Mechanistic Interpretability

  To map the landscape of mechanistic interpretability (MI), we must resist the temptation to start with definitions of "representation." In philosophy of mind, we know what a representation is because we have phenomenology to ground it. In deep learning, we have matrices and gradients; the representational status is the hypothesis, not the datum. Therefore, the primary structural division is not "What is a representation?" but **"Does the physical implementation constrain the interpretation?"**

  I argue that the literature treats too many distinctions as fundamental when they are actually derivative. For example, the difference between *Strong Realism* and *Structural Realism* is often presented as a debate about the nature of content, but in practice, both agree that interpretations are discovered constraints imposed by the architecture and training data. Conversely, the difference between *Dennettian Realism* and *Instrumentalism* is frequently obscured, yet it rests on a decisive claim about normativity: does the interpreter make the system real, or merely useful?

  Below is the diagnostic tree. It begins with the single most important question for MI researchers: **Is there a fact of the matter outside our own description?**

  ***

  ### Decision Tree: The Ontology of Feature Detectors

  **Start Here:** You have trained a neural network. You have identified a cluster of neurons whose activation correlates with the concept "cat." You want to claim this is a "representation" of "cat."

  #### Q1: The Constraint Question
  *Consider two mutually exclusive semantic descriptions (Description A: "Cat Detector"; Description B: "Texture+Shape Detector") applied to the exact same activation patterns in the network. Given the physical weights, training history, and input-output mapping:*

  > **Are the physical facts of the network strong enough to rule out one of these descriptions as fundamentally incorrect, even if both predict output perfectly?**

  *   **NO (Multiple Valid Mappings):** The physical substrate is indeterminate. Both descriptions are mathematically isomorphic explanations of the weight matrix. There is no fact of the matter "in the silicon" that privileges "Cat" over "Texture." $\rightarrow$ **Go to Q2.**
  *   **YES (Single Fact):** The specific learning trajectory and weight geometry select a unique decomposition. While mathematically complex, the system has settled into a specific attractor state that corresponds to semantic units defined by the training distribution. $\rightarrow$ **Go to Q3.**
  *   **IRRELEVANT (Category Error):** Asking whether the weights "select" a meaning assumes words mean something in the way they mean things in human language. The system is just calculus. $\rightarrow$ **Eliminativism.**

  *(Note: The Eliminativist leaf accepts that we can describe mechanisms but rejects the ontological jump to "representation.")*

  #### Q2: The Status of the Interpretation
  *(Assuming Q1 was NO: Multiple valid mappings fit the data)*

  > **When you adopt one description (e.g., "Cat"), are you uncovering a latent truth that would persist even if no engineer looked at it, or is the validity of this description strictly tied to your specific engineering goal (e.g., safety alignment)?**

  *   **STRICTLY TIED TO GOALS:** There is no truth of the matter beyond utility. If the description doesn't help you debug or align, it doesn't exist. Even if the network behaves "like it thinks," it is a fiction we tell ourselves. $\rightarrow$ **Instrumentalism.**
  *   **TRUTH RELATIVE TO THE STANCE:** There is a fact of the matter, but only because the "engineer/interpreter" constitutes a valid stance. Within that stance, the network really *is* representing cats. Without the stance, the question is meaningless. $\rightarrow$ **Dennett-style Intentional-Stance Realism.**

  #### Q3: The Nature of the Content
  *(Assuming Q1 was YES: The system constrains the interpretation)*

  > **Once we accept the system selects a specific interpretation, does the representation consist of intrinsic semantic content (aboutness), or merely relational structure?**

  *   **INTRINSIC SEMANTIC CONTENT:** The neurons effectively stand for "cat" in the world. If we replaced the biological analogues with humans, we would attribute belief/intentionality. The content is robustly anchored to the external environment via the training signal. $\rightarrow$ **Strong Realism.**
  *   **RELATIONAL STRUCTURE ONLY:** The network has a specific geometric manifold of activation. "Cat" is just a label we apply to a region of that manifold. The *relations* are real (neurons fire together), but the *meaning* is extrinsic. $\rightarrow$ **Structural Realism.**

  ***

  ### Analysis of the Logical Space

  This tree carves the space differently than traditional philosophy of mind surveys, prioritizing **constraints** over **semantics**. Below is an analysis of the occupied leaves, the gaps, and the collapses inherent in this framework.

  #### 1. Occupied Leaves & Their Implications for MI

  *   **Strong Realism (Q1-Yes, Q3-Intrinsic):**
      *   **Implication:** MI is a science of discovery. Our goal is to find the "true" circuit diagrams. If we disagree, one of us is wrong. This view supports the idea of "universal circuits" across models.
      *   **Risk:** Risks anthropomorphism. Assumes the network "knows" what it represents in a way similar to biology.
  *   **Structural Realism (Q1-Yes, Q3-Relational):**
      *   **Implication:** MI discovers mathematical structures, not meanings. We can prove two models are isomorphic, but "truth" is limited to topology.
      *   **Risk:** May frustrate users wanting to answer "Why did the model lie?" instead of "How does the vector space rotate?"
  *   **Dennett-style Intentional-Stance Realism (Q1-No, Q2-Stance):**
      *   **Implication:** Representations are real *relative to the investigator*. This justifies using high-level abstractions for reasoning while acknowledging they aren't fundamental physics. It validates "approximate" interpretability.
      *   **Risk:** Makes "misinterpretation" hard to diagnose. If my stance says "lie detection" works, is it true?
  *   **Instrumentalism (Q1-No, Q2-Goal):**
      *   **Implication:** Representations are tools, not facts. If "concept localization" helps reduce hallucination, it is good. If it fails, discard the vocabulary.
      *   **Risk:** Short-term utility focus might obscure long-term safety insights if the "useful fiction" hides adversarial vulnerabilities.
  *   **Eliminativism (Q1-Irrelevant):**
      *   **Implication:** Replace "representation" with "computational graph manipulation." Treat activation vectors purely as dynamical variables.
      *   **Risk:** Loses the heuristic power of natural language to guide engineering intuition.

  #### 2. Unoccupied Regions of the Space

  There are logically coherent paths down this tree that currently lack adherents in the MI community.

  *   **Path: Q1-Yes / Q2-GOAL-BASED (Impossible Branch)**
      *   *Why:* If Q1 is Yes (the physics constrain the interpretation uniquely), then Q2 becomes moot. If the physics dictate a single truth, that truth cannot be arbitrary to the engineer's goal. This path collapses into Strong/Structural Realism.
  *   **Path: Q1-No / Q2-INTRINSIC (Incoherent)**
      *   *Why:* This claims the system *does* have a single intrinsic content, but the physical facts don't constrain it. This is metaphysical magic. Either the physics constrain the content (Realism) or they don't (Anti-realism). You cannot have both.
  *   **Occupied Gap: "Weak Realism" (Unexplored/Moderate)**
      *   *Location:* Somewhere between Strong Realism and Instrumentalism. A view holding that representations are real *but* heavily dependent on the granularity of observation (similar to Renormalization Group ideas in physics).
      *   *Status:* **Unexplored.** Most researchers pick a side. A "scale-dependent realism"—where representations emerge only at certain levels of abstraction—would bridge the divide but is rarely articulated as a standalone ontology in MI papers.

  #### 3. Collapsed Distinctions

  I argue the following position pairs, often treated as distinct in the literature, are practically indistinguishable given the diagnostic questions above.

  *   **Collapse 1: Dennett-style Realism vs. Structural Realism**
      *   *The Overlap:* Structural Realism often claims content is extrinsic and structure is intrinsic. Dennett claims the content is relative to the stance. Both deny that the network "intrinsically knows" what "cat" means independently of an observer.
      *   *Why they collapse:* Unless one posits a non-mathematical form of "aboutness" (which is rare in AI discussions), Structural Realism functions identically to Dennettian Realism. Both agree that $Vector = Meaning$ is a mapping relation provided by the external interpreter. In the tree, they split only on whether they treat the mapping as a "fact of the system" (Structural) or a "stance-relative fact" (Dennett). For practical MI work (finding circuits), these lead to the same methodology.
      *   *Decision:* Keep them distinct in the tree to preserve terminological precision for philosophers, but note that **Structural Realism is essentially Dennettian Realism without the intentional vocabulary.**
  *   **Collapse 2: Eliminativism vs. Extreme Instrumentalism**
      *   *The Overlap:* An instrumentalist might say "Representations are fictions." An eliminativist says "Representation talk is misleading."
      *   *Why they collapse:* In practice, both advocate replacing semantic terms with mechanistic/functional terms. If an instrumentalist abandons the "fiction" because it stops being useful, they become eliminativist.
      *   *Decision:* The tree separates them at Q1. Eliminativism rejects the premise of the game (constraint); Instrumentalism plays the game but denies winning prizes. This distinction matters for **how we publish**: Instrumentalists will write papers claiming "We found a cat detector," admitting it's metaphorical. Eliminativists will refuse that title entirely, writing "We found a subgraph sensitive to texture statistics."

  ### Justification for the Choice of Fault Lines

  Why prioritize **Q1 (Constraint)** over the standard "Realism vs. Anti-Realism"?

  1.  **Scientific Practice:** Mechanistic interpretability is empirically driven. Researchers spend hours debating whether a feature visualization is an "artifact" or a "feature." This maps directly to Q1. If the visualization is an artifact of the visualization method (low constraint), Q1 is No. If it persists across seeds/invariance checks (high constraint), Q1 is Yes. Grounding the ontology in **methodological stability** forces the philosopher to engage with the actual research, not just abstract metaphysics.
  2.  **Avoiding Folk Psychology:** Traditional philosophy of mind asks, "Does the machine feel?" or "Does it intend?" These are dead ends for NNs. My tree shifts the question to "Does the optimization pressure select specific decompositions?" This reframes representation as a product of **inductive bias and data**, making the philosophical inquiry tractable for ML practitioners.
  3.  **Safety Relevance:** If we hold Strong Realism (Q1-Yes), we assume understanding the internals guarantees safety (we see the lying circuit). If we hold Instrumentalism (Q1-No), we assume the model has no internal truth to discover, and safety relies only on external testing. The choice made at Q1 determines whether a company invests in interpretability tooling (Realism) or red-teaming (Instrumentalism).

  ### Summary

  This decision tree rejects the "neutrality" of standard taxonomies by arguing that the **degree of interpretive constraint** provided by the training process is the only ontologically meaningful variable. It forces the reader to decide: *Is the network a locked box containing hidden truths (Realism), or is it a kaleidoscope that reflects whatever pattern the observer turns toward it (Anti-Realism)?* Once that choice is made, the secondary distinctions of content and semantics become matters of terminology rather than ontology.
