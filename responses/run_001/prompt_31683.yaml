answer: |-
  # Joint Statement on the Frame Problem
  **Following Adversarial Collaboration**
  **Signed by the Formal-Methods Representative & the Relevance Representative**

  ## I. Agreed Claims

  We, the undersigned, acknowledge the following propositions as common ground established through our review of the literature and technical exchanges regarding the Frame Problem.

  1.  **The Combinatorial Explosion of Explicit Axioms.** In classical monotonic logic of action (e.g., Situation Calculus), representing persistence requires asserting that every fluent unaffected by every action remains unchanged. For a domain with $N$ fluents and $M$ actions, this requires $O(N \times M)$ axioms. Both camps agree that manually constructing this set is infeasible for complex environments, and algorithmic enumeration fails to scale. This inefficiency motivated the original framing of the problem.
  2.  **Distinct Problem Families.** We distinguish three logically different issues often conflated in discourse:
      *   **The Frame Problem:** Inferring persistence (what stays the same) absent evidence of change.
      *   **The Qualification Problem:** Specifying all necessary preconditions for an action to succeed (e.g., the light switch won't work if the power is out, or the wall explodes).
      *   **The Ramification Problem:** Inferring indirect consequences (e.g., moving a candle causes smoke, which triggers the alarm).
      While interaction exists between these (e.g., qualifications affect validity of actions that trigger frames), solutions for one do not automatically resolve the others.
  3.  **Function of Nonmonotonic Formalisms.** Techniques such as circumscription (McCarthy), Default Logic (Reiter), and event calculi allow for compact representations of actions. They permit the inference of persistence via rules stating that fluents continue unless explicitly terminated by an action effect. These methods successfully derive intended consequences in bounded, well-defined domains without enumerating all frame axioms.
  4.  **Implications of the Yale Shooting Problem.** The Yale Shooting Scenario demonstrated that naive minimization of change (minimizing abnormal actions rather than minimizing abnormal states) led to counter-intuitive results (e.g., concluding the gun fired spontaneously earlier rather than failing later). Resolution required refinements such as chronological minimization or causality constraints (e.g., causal theories of action) which prioritize the timing and ordering of events. Both camps agree these formal fixes are logically consistent for the scenarios tested.
  5.  **Inference vs. Execution Gap.** Deriving the correct set of true statements regarding a state transition is mathematically distinct from the computational task of selecting those statements for processing under time and memory constraints. A theorem prover can output valid consequences given sufficient resources; an embodied agent operating in real-time must filter potential inferences to determine relevance before computation completes.
  6.  **Ontological Commitment.** Any formal solution begins with a defined set of fluents and predicates. The choice of this vocabulary constitutes an ontological commitment that simplifies the environment. Both camps agree that no logical formalism solves the problem of *selecting* the initial set of relevant variables; this selection is external to the inference mechanism itself.

  ## II. Disagreements

  While we agree on the technical landscape described above, we diverge on the scope of the solution and the nature of the remaining challenge.

  | Issue | Formal-Methods View | Relevance View |
  | :--- | :--- | :--- |
  | **1. Completeness of the Solution** | The **Logical Frame Problem**—in the sense of providing a sound, decidable inference procedure for persistence in a finite domain—is solved. The existence of circumscription-based action theories proves that persistence can be represented efficiently without ad-hoc axioms. | The **Cognitive Frame Problem** remains unsolved. Nonmonotonic formalisms presuppose a static relevance structure (the choice of fluents/predicates). They cannot explain how a system discovers which variables constitute "fluents" worthy of tracking when facing novel situations where the ontology is unknown. |
  | **2. The Source of Constraints** | Constraints on reasoning arise from the logical semantics of the theory. If an agent acts irrationally, it is because its internal logic lacks the appropriate completion axioms or defaults. The burden is on improving the representation of the world. | Constraints on reasoning arise primarily from physical and cognitive resource bounds (time, memory, energy). Even a perfect representation is useless if the system cannot access the relevant parts of it before the window for action closes. |
  | **3. Scope of Application** | The problem is best understood as a specification challenge for robotics or verification. Once the environment is modeled, the reasoning engine handles the rest. | The problem is best understood as a problem of biological or architectural architecture. Symbol manipulation presupposes an attention mechanism that selects the inputs to the manipulator; the logic describes the processor, not the scheduler. |
  | **4. Role of Defaults** | Defaults are stable generalizations. As long as the environment conforms to the norms encoded in the defaults, the agent operates correctly. Errors due to violated defaults are handled by belief revision upon contradiction. | Defaults are heuristics for managing ignorance. When a system encounters a truly novel context, defaults are not merely violated; they may become noise. The capacity to suspend reliance on the existing framework is more critical than the accuracy of the framework itself. |

  ## III. Classification of Disputes and Experimental Cruxes

  ### Classification of Verbal vs. Substantive Dispute
  A significant portion of the historical friction regarding the "Frame Problem" is **verbal**. It hinges on whether the term applies solely to the *logical representation of inertia* (Formal-Methods definition) or extends to the *architectural selection of information* (Relevance definition).

  *   **Verbal Settlement:** We agree to distinguish the **Logical Frame Problem (LFP)**—how to minimize the set of necessary axioms for persistence—from the **Psychological/Cognitive Frame Problem (PFP)**—how a bounded system determines which subset of its knowledge base is pertinent to the current goal.
  *   **Remaining Non-Verbal Disagreement:** Whether a successful solution to the LFP constitutes a sufficient foundation for solving the PFP. The Formal-Methods camp argues the LFP is the hard technical core and the PFP is an implementation detail. The Relevance camp argues the PFP is fundamental and the LFP assumes away the difficulty of defining the domain.

  To move the debate forward, we propose investigating the following cruxes. The parties accept that the following cases and metrics are valid tests for progress.

  ### Crux 1: Ontology Expansion under Novelty
  **The Case:** An agent enters a previously unseen environment containing objects whose affordances are not pre-encoded in its fluent list (e.g., a standard robot entering a room with an unlabelled device).
  **Acceptable Argument/Test:** Compare two systems in simulation: System A uses a fixed ontology with robust default logic (Formal Approach); System B includes a dynamic learning module that expands its predicate vocabulary based on visual clustering and causal discovery (Learning Approach), using the formal logic only for the reduced subset.
  **Prediction (Formal):** System A will maintain coherence longer in predictable sub-spaces. Learning introduces noise that degrades logical validity in high-stakes decisions.
  **Prediction (Relevance):** System B will eventually adapt to perform the task, whereas System A will freeze or fail because it cannot categorize the object into any fluent that triggers the "persistence" defaults correctly.
  **Resolution Metric:** Success rate on tasks requiring modification of the object's function versus strict adherence to pre-programmed safety protocols.

  ### Crux 2: Computational Complexity vs. Depth of Domain
  **The Case:** An agent must reason about a causal chain of length $k$ (depth) across $n$ interacting variables.
  **Acceptable Argument/Test:** Measure the number of inference steps (or clock cycles) required to derive the status of a specific fluent as $k$ increases, utilizing modern SAT/SMT solvers optimized for nonmonotonic reasoning.
  **Prediction (Formal):** With compiled knowledge and modern solver technology, the growth will remain polynomial or tractable for practical values of $k$, rendering resource bounds a manageable engineering constraint.
  **Prediction (Relevance):** As $k$ grows, the interaction between exceptions (qualification/rigidification) creates exponential branching in the justification space, making full logical derivations impossible. The system *must* use approximation heuristics that sacrifice logical completeness.
  **Resolution Metric:** The point at which the time-to-solution exceeds the deadline for physical intervention in a simulated real-time control loop.

  ### Crux 3: Handling Contradictory Defaults
  **The Case:** Two distinct modules within a single agent produce contradictory default conclusions (e.g., Module 1 infers door is closed; Module 2 infers door is locked based on different sensory cues, neither certain).
  **Acceptable Argument/Test:** Implement a meta-reasoning layer where the conflict is resolved either by minimizing changes to the global state (Formal preference) or by prioritizing the source with higher estimated reliability/relevance to the current goal (Relevance preference).
  **Prediction (Formal):** Minimizing global state changes provides a stable convergence criterion that ensures logical consistency across the entire system.
  **Prediction (Relevance):** Goal-prioritization resolves conflicts faster but risks logical inconsistency. However, speed is prioritized for survival; logical consistency is secondary to behavioral efficacy.
  **Resolution Metric:** Time taken to reach an operational decision (not a proven state) and subsequent success in executing the associated action plan.

  ### Conclusion
  By distinguishing the Logical Frame Problem (representation) from the Cognitive Frame Problem (selection), we preserve the insights of nonmonotonic logic without denying the necessity of attention mechanisms in embodied cognition. The formal tools are necessary but not sufficient for artificial general intelligence.

  ***
  **Signed,**

  *[Representative, Formal-Methods Camp]*

  *[Representative, Relevance Camp]*
