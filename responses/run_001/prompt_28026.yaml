      *   *Check:* Did I address reward misspecification? Yes, explicitly link Knobe to the gap between true $R$ and inferred $R$.

  9.  **Final Polish:** Ensure tone matches a senior engineer talking to another engineer. Direct, dense, practical. (Proceed to generate output based on these thoughts.)

  *(Self-Correction on "No Counterpart"):* I need to be careful not to say things *don't* exist in RL, but rather that standard RL formalisms don't naturally handle them without modification. "Intentionality" is the biggest gap. Standard RL has actions; it doesn't have "intentions" independent of the maximizing trajectory.

  *(Self-Correction on "Residue"):* Be firm. It's not just noise. It's a feature of how human evaluators define the Reward Signal. If the RL agent optimizes for human approval, the Knobe effect *is* the loss landscape.

