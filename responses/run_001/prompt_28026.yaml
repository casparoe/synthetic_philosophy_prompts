      *   **Constraint 1:** Systematic translation, not just analogy. For each element, specify mapping quality (clean, distorted, no counterpart).
      *   **Constraint 2:** Provide a "residue report": Is the untranslatable part just folk psychology noise, or does it indicate normative work that a value-neutral framework can't capture?
      *   **Tone:** Technical, precise, efficient. No lectures on experimental philosophy.
      *   **Goal:** Determine if the asymmetry is a quirk of human credit assignment or points to something structural missing in value-neutral frameworks.

  2.  **Deconstruct the Knobe Effect:**
      *   *Scenario:* A manager proposes a program.
          *   Harm condition: Program harms environment. Manager says "I don't care." People say he brought this about *intentionally*.
          *   Help condition: Program helps environment. Manager says "I don't care." People say he did *not* bring this about *intentionally*.
      *   *Key Finding:* Intentionality attribution depends on the valence (good/bad) of the outcome, even when knowledge and causal control are identical.

  3.  **Drafting the Translation (Element by Element):**

      *   *Agent/Policy ($\pi$):* The Manager.
          *   *Mapping:* $\pi(a|s)$ maps cleanly.
          *   *Distortion:* Humans judge $\pi$ based on outcomes, not just the policy generation process.
      *   *Environment Dynamics ($P(s'|s,a)$):* The world model.
          *   *Mapping:* Cleanly maps to the causal structure (program launched -> env changes).
      *   *State Features:* Environment harm/help.
          *   *Mapping:* Side effects $s_{side}$.
          *   *Distortion:* In RL, features are usually scalar rewards. Here they are categorical judgments.
      *   *Reward Function ($R$):* Manager's objective.
          *   *Mapping:* Explicit statement ("I don't care"). $R(s_{profit}) \gg R(s_{env})$.
          *   *Distortion:* Observers infer a hidden $R'$ despite explicit $R$.
      *   *Credit Assignment:* Attributing cause.
          *   *Mapping:* Did action $a$ cause change in $s_{side}$? Yes.
          *   *Distortion:* Humans assign *moral* credit/blame, not just causal credit.
      *   *Intentionality:* ?
          *   *Mapping:* High weight on action selection given predicted outcome.
          *   *Residue:* This is the core friction point.
      *   *Counterfactual Rollouts:* What if manager chose differently?
          *   *Mapping:* Causal graphs support this.
          *   *Distortion:* Humans ignore counterfactual equality in favor of valence.
      *   *Impact Regularisation:* Penalizing side effects.
          *   *Mapping:* Related to the norm being violated.
          *   *Distortion:* Humans enforce implicit regularization where the agent didn't.
      *   *Blame/Punishment:* Negative feedback signal.
          *   *Mapping:* Social consequence.
          *   *Distortion:* Blame precedes explicit reward shaping.

  4.  **Addressing Main Explanations in RL Terms:**

      *   *Default vs. Normative Account:* Defaults are "neutral". Norms set priors on $R$.
          *   *Translation:* Default policy assumes $\nabla_\theta J \approx 0$ for side effects unless constraint exists.
      *   *Skill/Ability Hypothesis:* Did the agent have skill to avoid?
          *   *Translation:* Control capacity estimation.
      *   *Normative View:* Intent implies violation of negative constraint.
          *   *Translation:* Implicit safety constraint satisfaction check.

  5.  **Developing the Residue Report (The Crux):**
      *   *Question:* Is it just noisy credit assignment or something real?
      *   *Analysis:* Standard RL optimizes $E[\sum \gamma^t r_t]$. If $r$ is private and unobserved, we infer it from behavior.
      *   *Knobe Problem:* Behavior is identical ($a_{launch}$), stated $r$ is identical ($r_{env}=0$), but inferred "intent" differs.
      *   *Conclusion:* It suggests "Intentional" $\neq$ "Causally Contributed to + Foreseen". It equals "Causally Contributed to + Foreseen + Violation of Normative Constraint".
      *   *Implication:* Value-neutral credit assignment misses the *normative weight* humans apply to side effects. In Safety-Critical RL, we might need to account for this "observer bias" because the human evaluator isn't a value-neutral oracle.

  6.  **Refining the Vocabulary Mapping:**
      *   Need to ensure terms like "impact regularisation" and "counterfactuals" are used precisely.
      *   Avoid philosophical jargon (e.g., "moral responsibility," "teleology") unless mapped immediately to an RL concept.

  7.  **Structuring the Response:**
      *   **Definition:** Brief technical restatement of Knobe.
