prompt: |-
  Okay so I've been deep in the reference class problem rabbit hole for a few weeks now and I keep hitting this specific wall that I think is underappreciated and I'd love to recieve your take on it. The basic setup you probably know: you're trying to assign a probability to some single-case event involving you specifically — like, am I in the last generation of humans, or am I a Boltzmann brain, or is this a simulation — and the problem is that 'you' is a member of a bunch of different reference classes and they give you different answers, and there's no obvious principled way to pick the right one. The 'reference class ranking' approach says you should use the most specific relevant reference class, which sounds reasonable until you realize the most specific reference class is always just 'you,' which gives you probability 1 or 0, which is completly useless for decision-making. So you have to back off to a less specific reference class, but the question is where do you stop, and I think that question is actually the real controversy and people tend to skip over it.

  What I want you to do is write an essay that takes a specific position on this 'where do you stop backing off' question. I want you to propose a specific criterion for when to stop, and then apply it to at least one of the classic applications (doomsday argument, simulation argument, Boltzmann brains, whatever) and reach a clear conclusion about whether that argument is actually sound or not. I don't want a balanced survey of the different approaches, I want you to commit to a position and defend it, and I want you to be honest about the strongest counterargument to your position rather than strawmanning it. I've been going back and forth between thinking the reference class problem is a real unsolved problem and thinking it's mostly a confusion about what probabilities even mean in the single-case context, so I'd like to see you actually pick a side and argue for it. I was talking to a friend about this the other day and they kept saying it's just a confusion about 'typicality' which I'm not sure I buy but I couldn't articulate why.
