answer: |-
  Your roommate has recited a classic, foundational argument from neoclassical economics known as **Revealed Preference Theory** (most famously associated with Paul Samuelson in the mid-20th century). His logic is sound *within the specific axioms of that model*, but your instinct—that the map is not the territory—is correct when you look at how humans actually function in the real world.

  The problem isn’t that revealed preference is useless; it’s that your roommate treats the economy as a closed physics system rather than an open biological and social system.

  Here is the breakdown of the thermometer analogy, where the glass breaks, and whether the conclusion survives the shards.

  ### 1. Mapping the Analogy

  To test the robustness of the argument, we first have to agree on what corresponds to what in the roommate's metaphor.

  *   **The Room:** The decision environment (prices, time, social pressure, physical availability).
  *   **The Temperature:** The individual’s true underlying utility or "welfare" (what they objectively value).
  *   **The Thermometer:** The mechanism of choice (spending money, allocating time).
  *   **The Reading:** The specific observable action (buying chips, skipping the gym).
  *   **Calibration:** Knowledge of constraints (income, access, skills).

  In the roommate’s view, if you see the reading say "Couch + Chips," that *is* the temperature. Any claim to "Health" is just atmospheric interference that shouldn't change the reading.

  ### 2. Where the Picture Breaks Down

  There are four major places where the thermometer analogy fails to capture the complexity of human motivation. Three of these specifically undermine the conclusion that self-report is "worthless."

  #### Breakdown A: The Instrument Has Conflicting Engines (Akrasia)
  A thermometer measures the external environment. A human making a choice is the environment *and* the thermometer simultaneously.
  *   **The Flaw:** Humans frequently possess multiple, contradictory sets of preferences. We have **System 2** preferences (long-term goals: health, saving for retirement) and **System 1** preferences (immediate gratification: dopamine, comfort).
  *   **Why it matters:** When someone eats the chips, it doesn't mean their "preference for health" didn't exist. It means there was a battle, and the impulse won. If you treat the *action* as the only truth, you lose the data about the *conflict*. A patient smoking cigarettes despite a doctor's warning still values health enough to get the doctor's advice, even if they failed to execute. Ignoring the "voice" (health concern) removes the explanation for the regret, addiction recovery, and policy needs that follow.

  #### Breakdown B: The Thermometer Can Be Jammed by Constraints
  If a thermometer reads high, but you cannot turn up the AC, the high reading might not reflect desire; it reflects a lack of options.
  *   **The Flaw:** Revealed preference assumes that the choice is constrained only by budget. But choices are also constrained by knowledge, time, infrastructure, and fatigue.
  *   **Why it matters:** If a single parent works three jobs and eats fast food, revealed preference says "They prefer junk food." In reality, they prefer health but are constrained by exhaustion and cost. If you ignore what they *say* ("I wish I could cook"), you mistake a **constraint problem** for a **preference problem**. This makes the economist blind to the structural issues causing the poor outcome.

  #### Breakdown C: The Reading Influences the Temperature (Constructed Preferences)
  Temperature exists independently of the thermometer. Preferences often do not.
  *   **The Flaw:** We don't always walk into a store with a pre-formed list of values. Often, our preferences are *constructed* in the moment through framing, defaults, and social cues.
  *   **Why it matters:** If you force people to make a choice without stating their values first, you create a feedback loop. If you ask, "Do you care about privacy?" and then offer a cheap phone with spyware, people often take the phone. Does that mean they don't value privacy? No; it means the transaction cost to prove that value was too high. Surveys allow us to see the "latent demand" that market prices fail to reveal because the price signal is currently misaligned.

  #### Breakdown D: Signaling vs. Sensing
  A thermometer doesn't lie. People do—especially to themselves.
  *   **The Flaw:** "Values talk" serves a social function. Telling a roommate "I care about the environment" builds reputation. Choosing a gas car saves money.
  *   **Why it matters:** Dismissing all "noise" throws out the baby with the bathwater. The gap between stated values and revealed choices is arguably the most interesting data point in social science. That gap is called **"cognitive dissonance."** It tells you where moral hazard, rationalization, and hypocrisy live. If you assume actions are the *only* truth, you assume humans are perfectly consistent, which is empirically false.

  ### 3. Does the Conclusion Survive?

  Your roommate wants to move from the premise "Actions are better evidence than words" (which is mostly true) to the conclusion "Words are worthless" (which is extreme).

  #### The Strong Conclusion (Ignore speech entirely): **Fails.**
  If you ignore what people say, you miss the difference between a **constraint** (can't afford healthy food) and a **preference** (don't like vegetables). You also miss the difference between a **mistake** (bought a lottery ticket) and a **value** (wants excitement). If you only watch the action, you cannot design interventions to help people achieve their own long-term goals.

  #### The Weak Conclusion (Prioritize actions over speech): **Survives.**
  This is the more nuanced, defensible position. Here is where revealed preference remains powerful:
  1.  **Budget Realism:** You must pay for your values. Spending $0 on charity implies valuing charity less than spending $0 on books. Actions reveal the *relative* weight of competing priorities.
  2.  **Immediate Trade-offs:** Speech deals in abstract generalities ("I value life"). Choices deal in marginal realities ("I value saving $5 on gas over taking the safer route"). In decision-making, the margin usually wins.

  ### The Verdict: Two Types of Data

  The thermometer analogy works if you accept it describes a **physical constant** (like temperature). But human nature isn't a physical constant; it's a **dynamic negotiation**.

  You should tell your roommate this:
  > *"The thermometer tells you where the fire is burning (where resources are going), but the thermostat tells you where the occupant wants the heat to be (what they aspire to)."*

  If you rely only on the thermometer (choices), you will never know if the room is supposed to be cooler. You will just assume the current temperature is "correct."

  **Summary for the debate:**
  Revealed preference is excellent for predicting **market behavior** under stable conditions. It is terrible for predicting **human welfare** or understanding **internal conflict**.
  *   If you want to know what a customer buys? Watch the wallet.
  *   If you want to know if a policy worked? Watch both the wallet and the survey.
  *   If you want to understand a friend? Listen to the complaint about their habits as carefully as you watch their habits.

  The breakdown that matters most to him is his assumption that people are internally consistent agents. They aren't. They are fractured, tired, inconsistent beings who lie to themselves as much as they lie to others. In that mess, what they *say* provides the blueprint for their regrets, and what they *do* provides the reality of their constraints. You need both to see the picture.
