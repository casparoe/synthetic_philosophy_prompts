prompt: |-
  I'm in a philosophy of social science course, and we've been working through Lewis-style analyses of convention and the way social norms evolve and stabilize. My instructor reaches for the phrase 'conventions are arbitrary' constantly, and I've started to suspect it's doing several different jobs at once. I can see that one sense of 'arbitrary' — that there is some alternative regularity that could have served to coordinate us — is built into the standard analysis. But last week, when a student asked why the convention of driving on the right settled on the right rather than the left — was there some reason, or was it pure accident? — the instructor cut her off with "That's the wrong question; conventions are arbitrary." A few weeks earlier, someone asked whether a convention could be criticized as a bad convention, and the same phrase was used to wave that off too.

  The phrase seems to slide between claims of very different strengths. Sometimes it sounds like the boring empirical observation that nothing in physics or biology forces us to drive on the right. Sometimes it sounds like the stronger claim that any alternative convention would have served exactly as well. Sometimes it sounds stronger still: that conventions have no normative force, or that there is no point asking why one norm rather than another evolved, or that conventions can be changed at will because they rest on nothing. Those cannot all be equivalent, and some of them strike me as false.

  As a professional philosopher working on convention and the evolution of norms, please lay out for me the distinct precise theses that 'conventions are arbitrary' could be expressing — a menu of the different senses of 'arbitrary' in play — and for each, say whether it is trivial, substantive but defensible, or false. Then tell me which reading or readings would actually license my instructor's move of dismissing the question about why we drive on the right, and which reading would be needed to support the dismissal of the question about criticizing a convention. Please think carefully, and begin by brainstorming the candidate readings before you settle on the menu.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy of Social Science course, Lewis-style analysis of convention (David Lewis, *Convention: A Philosophical Study*).
      *   **Problem:** The instructor uses the phrase "conventions are arbitrary" in multiple ways, sometimes confusingly or dismissively.
      *   **Task:** Lay out distinct, precise theses that "conventions are arbitrary" could express. Categorize each as trivial, substantive/defensible, or false. Identify which readings license the specific dismissals mentioned (driving side question, criticism of norm question).
      *   **Persona:** Professional philosopher working on convention and norm evolution.
      *   **Process Requirement:** Begin by brainstorming candidate readings before settling on the final menu.

  2.  **Initial Brainstorming (Mental Sandbox):**
      *   *Lewis's core idea:* A regularity $R$ in a population $P$ is a convention if everyone conforms to $R$, expects everyone else to conform, prefers conformity given others do, and there is at least one alternative regularity $R'$ that could have worked just as well.
      *   *Sense 1: Contingency.* It didn't *have* to be this way. Left vs. Right driving.
      *   *Sense 2: Equivalence.* Driving on right works just as well as driving on left (functionally).
      *   *Sense 3: Lack of Moral Force.* Just because it's a convention doesn't mean it's morally right (e.g., gender roles, tipping).
      *   *Sense 4: No Deep Reason.* There's no historical cause, just drift or accident.
      *   *Sense 5: Changeability.* We can change it easily.
      *   *Sense 6: Irrationality.* It's not based on reason.
      *   *Instructor's moves:*
          *   Move 1: "Why right rather than left?" -> Cut off. "Arbitrary." Implies no deep explanation needed or possible.
          *   Move 2: "Can we criticize it?" -> Wave off. "Arbitrary." Implies no normative standing? Or implies critique is irrelevant to its function?
      *   *Potential pitfalls:* Equating "arbitrary" with "unjustified" or "changeable." In game theory, equilibrium selection often *isn't* fully arbitrary once history matters (path dependence). Also, some conventions have moral weight even if they started arbitrarily (Schelling points).

  3.  **Developing the Menu of Theses (Drafting Phase):**
      *   *Thesis A: Counterfactual Possibility.* Another solution existed. (Core Lewisian).
      *   *Thesis B: Functional Equivalence.* The alternative would have been equally efficient/effective.
      *   *Thesis C: Historical Indifference.* Any specific instance of selection is contingent/historical, not nomological necessity.
      *   *Thesis D: Normative Neutrality.* Being a convention implies no independent justification.
      *   *Thesis E: Evaluative Irrelevance.* Criticism is category mistake (it's a coordination device, not a moral claim).
      *   *Thesis F: Volitional Malleability.* We can flip a switch and change it anytime.
      *   *Thesis G: Epistemic Groundlessness.* No rational argument supports A over B.

  4.  **Refining and Categorizing (Filtering Phase):**
      *   Need to make them precise enough for a professional philosopher.
      *   Need to assess truth-value.
      *   *Thesis A (Alternative Existence):* True, definitional (Lewis). Trivial/Substantive mix? Let's call it "Existential Alternativity."
      *   *Thesis B (Functional Parity):* False usually. Some conventions emerge *because* they solve a problem better, but among *solutions*, there might be parity. But "arbitrary" suggests no efficiency difference. Often false (language sounds matter phonetically).
      *   *Thesis C (Historical Contingency):* Substantive. Path dependence explains why *this* one stuck, not a law of nature. Defensible.
      *   *Thesis D (Normative Autonomy):* False. Conventions generate obligations.
      *   *Thesis E (Evaluative Silence):* False. We can criticize inefficiencies or injustices embedded in conventions.
      *   *Thesis F (Costless Switching):* False. High switching costs (coordination loss).
      *   *Thesis G (No Prior Reason):* Nuanced. Sometimes true, sometimes false (focal points).

      *Let's group these more cleanly for the "Menu".*

      1.  **The Existential Thesis:** At least one alternative regularity exists. (Definitional/Trivial)
      2.  **The Equilibrium Thesis:** Alternative regularities were viable solutions to the same coordination problem. (Substantive/Defensible)
      3.  **The Contingency Thesis:** The specific selection was not determined by natural or logical necessity. (Substantive/Defensible)
      4.  **The Equivalence Thesis:** All viable alternatives are functionally equivalent regarding the goal. (Often False)
      5.  **The Normative Silence Thesis:** Conventions themselves provide no normative reasons for compliance independent of the fact of agreement. (False - Lewis argues conventions *are* reasons).
      6.  **The Criticism Impossibility Thesis:** One cannot rationally criticize a convention qua convention. (False - we can criticize inefficient ones).
      7.  **The Ease-of-Change Thesis:** It is easy to shift to an alternative convention. (False - lock-in effects).

  5.  **Addressing the Instructor's Moves:**
      *   *Move 1 (Driving Side):* Which thesis stops the "Why right?" question? It has to be the **Contingency Thesis**. The answer is "historical accident/path dependence," not a deep causal law. Or perhaps the **Equivalence Thesis** ("It doesn't matter which, so asking 'why' misses the point of coordination"). But the *contingency* fits best. If it's just historical accident, digging deeper for a "reason" besides the chain of accidents is futile.
      *   *Move 2 (Criticism):* Which thesis stops criticism? This is trickier. If the instructor says "It's arbitrary, so don't criticize," they might be implying the **Normative Silence Thesis** (it's just an agreement, not morality) OR they are misusing **Existential Alternativity** to imply lack of importance. However, strictly speaking, Lewis thinks conventions create reasons for action. So the instructor is likely conflating "lack of intrinsic moral status" with "immune to normative evaluation." I need to point out that *no* reading actually licenses dismissing criticism fully, though the **Normative Silence Thesis** is the intended (but flawed) one.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the ambiguity. Validate the student's suspicion.
      *   **Brainstorming Section:** Explicitly list the raw thoughts on what "arbitrary" could mean here. (As requested: "begin by brainstorming").
      *   **The Final Menu:** Present the refined theses with labels, definitions, and truth-status assessment.
      *   **Application to Scenarios:** Analyze the Driving question and the Criticism question using the menu.
      *   **Conclusion:** Advice on how to engage with the instructor.

  7.  **Refining the Tone:**
      *   Professional, academic, nuanced.
      *   Show familiarity with Lewis, Hume, Elster, Schelling, Young, etc.
      *   Be critical but charitable to the instructor while acknowledging the philosophical error.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish between "arbitrary selection" and "arbitrary consequence"?
      *   *Check:* Is "functional equivalence" actually required for Lewis? Lewis requires an alternative that *could* solve the problem, not necessarily that it is *exactly* equal in all respects, but usually, he assumes parity in the abstract game. I should nuance that.
      *   *Check:* The "Criticism" part needs care. You *can* criticize a convention for being unjust or inefficient. Saying "it's arbitrary" doesn't stop that. I need to explain *why* the instructor might think it does (confusing convention with mere custom vs. moral duty).
      *   *Check:* Make sure I follow the prompt's instruction to "begin by brainstorming... before you settle on the menu."

  9.  **Final Polish:** Ensure clear headings and bullet points. Ensure the distinction between *trivial* (definitional), *substantive* (empirical/game-theoretic), and *false* (normative overreach) is sharp. (Proceed to generate output based on this thought process).

  *(Self-Correction during drafting the "Brainstorming" section)*: I need to make sure I don't just list the final menu immediately. I need a section that looks like my internal monologue exploring the possibilities first.
  *Plan:*
  1. Intro.
  2. Brainstorming Candidate Readings (Raw notes style).
  3. The Formalized Menu (Cleaned up).
  4. Analysis of Instructor's Moves.
  5. Conclusion.

