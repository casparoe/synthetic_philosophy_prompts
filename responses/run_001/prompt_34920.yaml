answer: |-
  This is an excellent observation. You have correctly identified a pervasive equivocation in social science pedagogy. The term "arbitrary" acts as a "slippery signifier" in discussions of Lewisian convention; it oscillates between precise game-theoretic claims and loose philosophical assertions about value and causality. When your instructor cuts off questions with "That’s the wrong question; conventions are arbitrary," they are likely deploying a cluster of claims that are not logically linked, creating a shield against legitimate inquiry.

  Per your request, I will begin by walking through the raw material of potential meanings I am sorting through, followed by the formalized menu of theses, and finally applying them to your instructor's specific dismissals.

  ### Part 1: Brainstorming Candidate Readings of "Arbitrary"

  Before settling on the definitive menu, let us survey the landscape of what *could* be meant when one invokes arbitrariness in this context. I want to capture the full range of intuitions from the most rigorous game-theoretic constraints to the most colloquial misunderstandings.

  *   *Candidate 1 (Existential):* "There is another option available." This is basically the definition of a coordination problem where multiple Nash equilibria exist. If $R$ is the regularity, $\exists R'$ such that $R'$ solves the coordination problem too. This seems hard to dispute.
  *   *Candidate 2 (Functional):* "$R'$ is just as good as $R$." This goes further. It claims the payoff structure is identical across equilibria regarding the goal of coordination. Driving on the right vs. left yields the same safety stats, theoretically.
  *   *Candidate 3 (Causal/Physical):* "Nothing in physics forced this." The laws of nature do not dictate that wheels must turn clockwise. The biological facts of the human body don't mandate which side of the road we occupy.
  *   *Candidate 4 (Historical):* "It happened by accident/whim." This shifts focus to the moment of selection. Was it a coin toss? A random walk? Path dependence starting from a minor initial asymmetry?
  *   *Candidate 5 (Epistemic/Rational):* "There is no reasoned argument for $A$ over $B$." If we stepped back before the convention formed, there is no calculation that proves Right > Left. Both are focal points.
  *   *Candidate 6 (Volitional/Plasticity):* "We can change it whenever we want." If it's arbitrary, it implies low switching costs. We can vote to drive on the left tomorrow.
  *   *Candidate 7 (Normative):* "It carries no moral weight." Because it's just a habit/agreement, we aren't morally bound to it. To ask for justification is a category mistake.
  *   *Candidate 8 (Critical Immunity):* "You can't find fault with it." If the choice is arbitrary, then criticizing it is criticizing a random occurrence. Why blame the driver for driving on the right if the system decided?
  *   *Candidate 9 (Explanatory Redundancy):* "Don't look for a deeper why." Asking for a teleological or deterministic reason is misguided. The only explanation is "everyone else did it."

  *Initial Sorting:* Candidates 1, 3, and 4 seem robustly defensible under a Lewisian framework. Candidate 2 is risky (phonetics or ergonomics might favor one). Candidates 6 and 7 are empirically dubious due to path dependence and emergent norms. Candidates 8 and 9 seem to be rhetorical devices used to close down debate rather than philosophical claims.

  Now, I will synthesize these into a precise menu of distinct theses.

  ---

  ### Part 2: The Menu of Arbritrariness

  Below are five distinct theses. I have labeled them according to the philosophical role they play and assessed their validity within a standard philosophy of social science framework.

  #### 1. The Existential Thesis (Trivial / Definitional)
  **Claim:** For any established convention $C$, there exists at least one alternative regularity $C'$ such that universal adherence to $C'$ would also constitute a coordination equilibrium for the same problem.
  *   **Status:** **True (by definition).** This is the sine qua non of Lewis’s analysis. If there were no alternative, it would be a natural law or a physical constraint, not a convention.
  *   **Utility:** Establishes the space of possibility. It tells us the world *could* have looked different without violating logic or physics.

  #### 2. The Symmetry Thesis (Substantive but Conditional)
  **Claim:** Among the viable alternatives ($C, C', C''...$), there is no significant difference in functional efficacy regarding the coordination goal.
  *   **Status:** **Often False.** While often assumed in idealized game theory models (like driving), many real-world conventions exhibit asymmetries. Language conventions (word choice) often depend on phonetic ease; economic conventions may favor existing infrastructure. Driving on the right is arguably safer in some traffic configurations than the left (due to steering wheel placement historically derived from carriages).
  *   **Utility:** Useful for modeling simplicity, but bad empirical generalization.

  #### 3. The Contingency Thesis (Substantive / Defensible)
  **Claim:** The selection of $C$ over $C'$ was not determined by natural necessity, logical deduction, or a pre-existing preference structure. It relies on historical path-dependence or chance.
  *   **Status:** **True / Defensible.** This is the strongest reading of "arbitrary" regarding *origin*. It means "we picked this one, and we might have picked that one." It denies teleology (the road wasn't chosen for a divine purpose) and physical determinism.
  *   **Utility:** Explains why different societies adopt different conventions (e.g., writing directions, units of measure).

  #### 4. The Volatility Thesis (False)
  **Claim:** Because $C$ is arbitrary, the transition from $C$ to $C'$ is costless or subject to individual will.
  *   **Status:** **False.** Once a convention is entrenched, it creates massive network effects and coordination costs. Unilateral deviation is punished; collective deviation is expensive. Arbitrariness of *origin* does not imply malleability of *maintenance*.
  *   **Utility:** Dangerous misconception. Leads to policy failures where reformers assume they can simply "declare" a new convention.

  #### 5. The Normative Silence Thesis (False)
  **Claim:** Because $C$ is arbitrary, it possesses no independent normative force and resists critical evaluation.
  *   **Status:** **False.** Conventions generate expectations. Expectations generate rights and obligations. Furthermore, conventions can embed injustice or inefficiency that makes them legitimate targets for criticism. "It is a convention" is never an absolute trump card against moral or pragmatic critique.
  *   **Utility:** This is the "conversation-stopper" use. It conflates "having a source outside of natural law" with "lacking justification."

  ---

  ### Part 3: Applying the Menu to Your Instructor's Moves

  Now we return to the classroom scenarios. Based on the menu above, we can diagnose exactly which theses your instructor is illicitly sliding between to shut down questions.

  #### Scenario 1: The "Why Driving on the Right?" Question
  *Student asks:* "Was there a reason, or was it pure accident?"
  *Instructor replies:* "That's the wrong question; conventions are arbitrary."

  **Analysis:**
  The instructor is attempting to invoke **The Contingency Thesis (#3)**. They want to communicate that there is no *natural* reason for right-driving other than the fact that someone (perhaps a monarch or a military commander) set the precedent, and the rest followed. In Lewisian terms, it was a **Schelling Point** that got locked in by history.

  However, by dismissing the question entirely as "wrong," they are likely conflating it with **The Explanatory Redundancy implied by #1 and #2**. They imply that *any* further explanation (historical, sociological, political) is unnecessary because the outcome was "merely" arbitrary.
  *   **Is the dismissal justified?** Partially. Asking for a *physical or moral* justification is indeed the wrong question. But asking for a *historical/causal* explanation is valid. History explains *which* arbitrary solution won, even if no reason made it superior.
  *   **Correction:** The student should be permitted to ask "How did this arbitrary selection occur?" even if they must abandon "Why was this selection necessary?"

  #### Scenario 2: The "Criticism of Convention" Question
  *Student asks:* "Can this convention be criticized as a bad convention?"
  *Instructor replies:* "[Waves off] Conventions are arbitrary."

  **Analysis:**
  Here, the instructor is almost certainly relying on **The Normative Silence Thesis (#5)**, supported by a misunderstanding of **The Volatility Thesis (#4)**. They believe that because the rule lacks a foundation in Nature or Morality (it is arbitrary), it sits outside the realm of normative evaluation.
  *   **Is the dismissal justified?** **No.** This is philosophically indefensible.
      1.  **Inefficiency:** A convention can be criticized if it fails to coordinate well (violates the goal of the convention).
      2.  **Fairness:** Many conventions start arbitrarily but perpetuate inequality (e.g., language dominance in academia, dress codes in professions).
      3.  **Harm:** A convention can be criticized if adhering to it causes harm (e.g., foot-binding, or dangerous corporate etiquette).
  *   **Why does the instructor say this?** They are likely trying to prevent students from treating conventions as immutable laws of nature (Reification). By calling them "arbitrary," they want students to see them as human-made artifacts that can be ignored (which is wrong) or changed (which is right, but difficult). However, they are using the label to deny the validity of critique, which is a non sequitur.

  ### Recommendation for Your Engagement

  Your suspicion is well-founded. The phrase is indeed doing different jobs. In future seminars, when the instructor deploys this phrase, consider distinguishing between *Origin* and *Evaluation*.

  You might respectfully press with: *"Professor, I agree that the origin of driving on the right is contingent [Thesis #3]. But if we acknowledge that contingencies can become inefficient or harmful, doesn't that allow us to apply Thesis #5? Can we not criticize the convention for locking us into a suboptimal equilibrium?"*

  This forces the instructor to clarify whether they mean "arbitrary" as a descriptive claim about history (correct) or a prescriptive claim about legitimacy (incorrect).

  **Summary Table for your Notes:**

  | Phrase Used | Intended Thesis | Valid Status | Does it justify the Dismissal? |
  | :--- | :--- | :--- | :--- |
  | "Why drive on right?" | Contingency (History matters, Laws don't) | Defensible | Yes (for Natural/Moral reasons); No (for Historical reasons). |
  | "Can we criticize?" | Normative Silence (No basis for judgment) | **False** | **No.** Conventions are subject to critique. |

  You are correct to feel uneasy. "Conventions are arbitrary" is a partial truth that is being wielded as a complete shield.
