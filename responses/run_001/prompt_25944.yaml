  I say the fire has burned out in pale light,
  Though coal retains the ember's glowing ball.
  My vision sees the ash and winter's pall,
  And I declare the flame has taken flight.

  I call the house secure from falling night,
  Where beams support the heavy roof over all.
  I know the crack, yet silence makes it small,
  And lure the child to sleep within the night.

  Observe the first whose mind remains unshackled
  By wilful deceit; his error is a blind
  Disorder of the eye, not guilt or hackled.

  But watch the second, in his heart aligned
  Against his tongue; the duplicity is marked,
  Where truth is spoken, but the soul is parted.
