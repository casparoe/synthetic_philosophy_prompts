          *   *Simon Blackburn (Quasi-Realism):* We need to explain how moral logic works *as if* there were truth. He introduces the idea of "commitment." To accept "If lying is wrong..." is to be committed to disapproving of getting someone else to lie *if* you disapprove of lying. It's a higher-order normative constraint on our attitudes. Logic becomes consistency among commitments.
          *   *Allan Gibbard (Norm-Expressivism):* Focuses on the acceptance of norms. To say "X is wrong" is to accept a norm forbidding X. Logic tracks consistency between accepted norms.
