answer: |-
  ### The Frege–Geach Problem and the Challenge to Expressivism

  To understand the Frege–Geach problem, we must first distinguish between **cognitivism** and **expressivism**. Cognitivists hold that moral sentences (e.g., "Lying is wrong") express beliefs that aim to describe the world; consequently, these sentences are capable of being true or false. Expressivists, conversely, argue that moral sentences do not describe facts but express non-cognitive, conative attitudes—such as emotions, desires, or disapproval (e.g., "Boo! Lying!").

  For expressivism, the meaning of a sentence is tied to the attitude it expresses. However, Peter Geach and Gottlob Frege pointed out that this framework collapses when moral sentences are embedded in complex logical structures, such as conditionals or negations. The problem arises because logic requires that terms keep their meaning across different grammatical contexts, but expressivism ties meaning to the speaker's active mental state.

  #### 1. The Difficulty of Embedding vs. Cognitivism

  In the following argument, logic dictates that if the premises are accepted, the conclusion follows:
  1.  Lying is wrong.
  2.  If lying is wrong, then getting your little brother to lie is wrong.
  3.  Therefore, getting your little brother to lie is wrong.

  This is a valid instance of *Modus Ponens*.

  **For the Cognitivist**, there is no difficulty. Cognitive states (beliefs) have truth conditions.
  *   Premise 1 asserts a proposition $p$ that is either true or false.
  *   Premise 2 asserts a conditional relation between proposition $p$ and proposition $q$.
  *   Classical logic provides truth-functional definitions for connectives like "if...then."
  *   If $p$ is true and $(p \rightarrow q)$ is true, then $q$ must be true. The mechanism is straightforward and compositional: the meaning of the whole is determined by the truth-values of the parts.

  **For the Expressivist**, there is a crisis.
  *   Saying "Lying is wrong" expresses a specific attitude, let's call it **Disapproval**.
  *   But in premise 2 ("*If* lying is wrong..."), the speaker is **not** expressing disapproval of lying. They are merely hypothesizing it. To express the conditional, one would have to express an attitude toward the conditional itself, or a relationship between two attitudes.
  *   If "Lying is wrong" means "I disapprove of lying," then substituting this into the conditional yields nonsense: "If I disapprove of lying, then I disapprove of getting my brother to lie."
  *   While this substituted statement is intelligible, it misidentifies the logical force of the original argument. The original argument is valid regardless of whether *you* personally disapprove of lying. The argument validates the logical connection between moral concepts, not the consistency of a specific person's current feelings.

  If expressivists cannot explain how moral terms retain their semantic value in unasserted contexts (like the antecedent of a conditional), then moral arguments become instances of the fallacy of **equivocation**: the word "wrong" would mean one thing in the main clause (expression of attitude) and something entirely different (perhaps a hypothetical description) in the conditional clause.

  #### 2. Why Simple Compositionality Fails

  The prompt asks why expressivists cannot simply model attitudes on truth-conditions compositionally. That is, if a cognivist says the truth-condition of $(A \text{ and } B)$ is a function of the truth-conditions of $A$ and $B$, why can't an expressivist say the attitude of "And" is a function of the attitudes expressed by $A$ and $B$?

  The short answer is that **attitudes are not truth-apt, and they are not detachable from the speaker's psychology.**

  **Truth-Conditions are World-Mapped:** Truth conditions represent a mapping between language and the world. Propositional logic operates on these mappings independent of who is speaking. The truth condition of "It is raining" remains constant whether the sentence is asserted, denied, or questioned.

  **Attitudes are Speaker-Bound:** An attitude is a psychological state held by a subject at a time.
  *   When I assert "Lying is wrong," I am performing the act of expressing my disapproval.
  *   When I assert "It is not the case that lying is wrong," I am withholding disapproval (or expressing approval, or neutrality depending on the theory).
  *   When I assert "**If** lying is wrong, then stealing is wrong," I am **not** disapproving of lying.

  The problem is that there is no obvious psychological state of "disapproving of a disapproval." If the semantics of a complex sentence depend on the attitudes expressed by its parts, we run into a "type error."

  Imagine a function $f(Attitude_A, Attitude_B)$.
  *   To calculate the attitude of "Lying is wrong," we use $D(Lying)$.
  *   To calculate the attitude of "Getting Brother to Lie is wrong," we use $D(Brother)$.
  *   To calculate the attitude of "If Lying is wrong, Brother is wrong," we cannot plug $D(Lying)$ and $D(Brother)$ directly into a logical operator, because the speaker in the conditional does not hold $D(Lying)$.

  The compositionality breaks because the **mental state required to understand the sentence is not the mental state required to assent to its components.** You can understand the conditional "If lying is wrong..." without having any attitude toward lying whatsoever. You only need to understand the *relationship* between the disapproval of one action and the disapproval of another. Since expressivism defines meaning as the expression of an active attitude, explaining a sentence where the speaker *lacks* the attitude defined by the component seems impossible.

  #### 3. The Nature of Attitudes Blocking the Move

  What specifically blocks this move is the difference between **propositional representation** and **practical motivation**.

  1.  **Propositional Stability:** Beliefs represent propositions. Propositions maintain their identity regardless of context. The proposition "Lying is wrong" remains the same object whether it is asserted, doubted, or conditionalized.
  2.  **Attitudinal Instability:** Desires and approvals are occurrent mental states. They are "thick" with psychological context. To say "I approve of $p$" is to be in a specific state. If I say "If I approved of $p$..." I am talking about a state I am currently not in.
  3.  **The Consistency Issue:** Logic relies on the impossibility of holding contradictory states simultaneously. For cognitivists, $P$ and $\neg P$ are logically incompatible truths. For expressivists, wanting $P$ and wanting $\neg P$ creates a psychological conflict (akrasia), but it is not a *logical* contradiction in the strict propositional sense. Without truth conditions, there are no logical entailments to preserve validity; there are only psychological compatibilities.

  Because attitudes are inherently subjective and volitional, they do not naturally lend themselves to the objective, rigid structure required by classical logic without significant theoretical maneuvering.

  #### 4. Expressivist Attempts to Resolve the Problem

  Modern expressivists (Neo-Expressivists) accept the force of the Frege–Geach problem and have developed sophisticated frameworks to save the theory. Two primary strategies dominate:

  **A. The Logic of Commitment (Blackburn)**
  Simon Blackburn proposed a "Quasi-Realist" solution. He argues that while moral statements are not descriptions of reality, they function within a web of commitments that mimics logic.
  *   Instead of defining logic via truth-preservation, Blackburn defines it via **consistency of commitment**.
  *   To accept "If lying is wrong, then getting your brother to lie is wrong" is to commit yourself: if you adopt the negative attitude toward lying, you must also adopt the negative attitude toward getting your brother to lie.
  *   Validity is preserved not because propositions are true, but because an agent cannot consistently hold the combination of attitudes required to affirm the premises while rejecting the conclusion. If you dislike lying, but fail to dislike having your brother lie (given the conditional), you are practically irrational. This allows the expressivist to use logical vocabulary without conceding that moral statements express factual beliefs.

  **B. Higher-Order Attitudes and Norm Acceptance (Gibbard)**
  Allan Gibbard refined this by suggesting that moral judgments express the acceptance of **norms** or **plans**.
  *   To judge "Lying is wrong" is to accept a norm prohibiting lying.
  *   To judge the conditional is to accept a higher-order norm linking these prohibitions.
  *   Some variations of expressivism treat the conditional explicitly as expressing a **higher-order attitude**. For instance, the sentence "If lying is wrong..." expresses an attitude toward the attitude of disapproving of lying. It essentially means: "Accepting that one ought to disapprove of lying implies accepting that one ought to disapprove of getting one's brother to lie."
  *   By moving the analysis to higher-order states (attitudes about attitudes/norms), the expressivist can construct a functional logic. The complex sentence describes a necessary relationship between the lower-order attitudes.

  **C. Unified Theories of Content (Schroeder)**
  Mark Schroeder, in *Being For*, attempts to show that expressivists can provide a unified account of the meaning of both assertoric and non-assertoric sentences. He argues that the fundamental attitude expressed by moral language is a form of **belief-dynamic** (having a plan). Logical connectives function by relating these plans. He argues against the idea that moral language must express distinct, separate "moral" states when embedded; instead, he proposes that all mental states have a similar structural logic, allowing the logical connectives to operate uniformly across descriptive and moral language.

  ### Conclusion

  The Frege–Geach problem highlights a critical gap in early expressivism: it could explain how we speak about single moral matters (simple exclamations of attitude) but failed to explain how we reason morally (complex logical structures). Because truth conditions are stable objects of logical manipulation while attitudes are unstable psychological states, expressivists could not simply compose attitudes mathematically like cognivists composed truth values. To survive, expressivism had to evolve into **Quasi-realism**, redefining logical validity in terms of the consistency of practical commitments or the coherence of accepted norms, rather than the correspondence of propositions to facts.
