          *   *Better focus:* The most successful modern expressivists (Blackburn, Gibbard) treat the logic of morality as the logic of *consistency between practical stances*. They define validity not as truth-preservation, but as *impossibility of holding inconsistent combinations of attitudes*.

  4.  **Review and Refine:**
