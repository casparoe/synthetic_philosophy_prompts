          *   How have expressivists tried to solve this (higher-order attitudes, logic of commitments, etc.)?

  2.  **Initial Brainstorming & Outline:**
      *   *Introduction:* Define Expressivism and Cognitivism briefly. State the Frege-Geach problem clearly.
      *   *The Cognitivist Solution:* Truth conditions are compositional. If $A$ is true/false and $B$ is true/false, then $If A, B$ has a clear truth value based on standard logic.
      *   *The Expressivist Challenge:* Attitudes aren't truth-apt in the same way. Disapproval isn't True/False. So how do we get logic working?
      *   *Why Compositionality Fails for Attitudes:* You can't disapprove of "lying" inside a conditional without actually disapproving of lying. But in the conditional, you don't necessarily hold that attitude; you are testing it.
      *   *Historical Context:* Mention Hume, Ayer, Stevenson (early expressivism failing here). Then Blackburn and Gibbard (modern solutions).
      *   *Modern Solutions:*
          *   Simon Blackburn: Quasi-realism, projecting attitudes. Logic of commitment.
          *   Allan Gibbard: Norm-expressivism, acceptance of norms. Plan-laden states.
          *   Mark Schroeder: Hi-Order attitudes (being in state $X$ towards being in state $Y$).
      *   *Conclusion:* Summary of the stakes.

  3.  **Drafting - Section by Section:**

      *   **Intro:** Start strong. Expressivism says moral judgments are expressions of pro/con attitudes (like "Boo lying!"). Cognitivism says they are beliefs about facts ("Lying is factually bad"). The Frege-Geach problem shows why the first view struggles with logic.

      *   **The Embedding Puzzle:** Use the classic example provided in the prompt.
          *   Premise 1: Lying is wrong ($H$).
          *   Premise 2: If lying is wrong, then getting your little brother to lie is wrong ($H \rightarrow G$).
          *   Conclusion: Getting your little brother to lie is wrong ($G$).
          *   This is Modus Ponens. It's valid.
          *   For Cognitivists: Easy. Beliefs map to truth conditions. Logical operators work on truth values.
          *   For Expressivists: Hard. Sentence 1 expresses *disapproval*. Sentence 2... does it express *disapproval*? No, because I'm saying "IF lying is wrong," implying I might not think it *is* wrong right now. I am *not* expressing disapproval of lying in the antecedent of a conditional. So what mental state corresponds to the sentence "If lying is wrong..."?

      *   **Why Compositionality Doesn't Work Simply:**
          *   *Cognitivism:* Meaning = Truth Conditions. $T(A)$, $T(B)$. Operator $\rightarrow$ combines them functionally. Output = $T(A \rightarrow B)$.
          *   *Expressivism:* Meaning = Attitude Expression. Let $D(A)$ be Disapproval of $A$.
          *   If I say "Lying is wrong," I am in state $D(\text{Lying})$.
          *   If I say "If lying is wrong...", am I in a state $D(D(\text{Lying}))$? (Disapproving of my own disapproval?) Or $D(\text{Conditional})$?
          *   *The Block:* You can't simply take the attitude expressed by the parts ($D$) and plug them into a logical operator to get an attitude for the whole. The function breaks because the *context* changes. In a conditional, the speaker *withholds* the primary attitude. They aren't disapproving of lying in the context of the antecedent; they are hypothesizing the disapproval. The attitude structure of the complex sentence doesn't mirror the attitude structure of the parts in a direct functional way.

      *   **Nature of Attitudes vs. Truth-Conditions:**
          *   Truth-conditions are mind-independent (in one sense) or representational states that track reality. Logic tracks consistency between representations.
          *   Attitudes are motivational/volitional states (desires, preferences). Logic usually deals with consistency of propositions, not consistency of wants. Can I want X and want if X then Y, but not want Y? Technically yes (irrationality), but it's not a formal contradiction in the same way $P$ and $\neg P$ are contradictory.
