answer: |-
  You have hit on one of the most critical, unresolved tensions in the alignment research agenda. **Your intuition is mathematically correct.** You are not missing a step in the derivation; you have correctly identified the fundamental flaw in the original proposal.

  The "Revealed Preference" critique is the single biggest objection to using Inverse Reinforcement Learning (IRL) for value learning. As you noted, Ng and Russell (2000), who pioneered the algorithmic framing of IRL, explicitly acknowledged that reward functions are non-identifiable. For any policy, there is an infinite set of reward functions that optimize it.

  So, why does IRL persist in the alignment discourse? The answer isn't found in the math of the inference, but in the **epistemological and pragmatic assumptions layered on top of the math.**

  Here is a breakdown of where the gap between "behavioral equivalence classes" and "learning human values" actually lies, and why many alignment researchers believe it can still be bridged (or where the pivot has moved).

  ### 1. The Prior *Is* the Alignment Work
  You wrote: *"everything else coming from the prior."*
  This is precisely the point where the philosophical labor happens. If IRL recovers nothing unique without the prior, then the IRL framework is essentially a formalization of the question: **"What constraints on the space of possible reward functions make sense?"**

  When practitioners use IRL, they implicitly (and sometimes explicitly) adopt regularizing priors:
  *   **Sparsity:** We assume the human cares about only a few distinct features, not thousands.
  *   **Complexity:** We prefer simpler reward functions over complex ones (Minimum Description Length).
  *   **Stationarity:** We assume the reward doesn't change arbitrarily between steps unless the environment dictates it.

  In this light, IRL isn't "discovering values from data"; it is **fitting a hypothesis of values that explains data + parsimony.** The danger, as you imply, is that we are smuggling our own biases about what humans *should* want into the prior (e.g., "Humans generally try not to die," "Humans value long-term outcomes"). If the prior assumes a certain conception of "rationality" or "well-being," the recovered reward will reflect that prior, not necessarily the true human values.

  ### 2. Computational Rationality (Bounded Optimality)
  Standard IRL often assumes humans are (noisy) optimal agents maximizing expected cumulative reward. This is where the revealed preference theory breaks down hard. Humans make systematic errors, exhibit framing effects, act impulsively, and lack full information.

  Modern IRL attempts to address this through **Computational Rationality**. Instead of assuming:
  $$ \pi(a|s) \propto \exp(Q^*(s,a)) $$
  We model the agent as having limited cognitive resources:
  $$ \pi(a|s) \propto \exp(V^\text{approx}(s,a)) $$
  Where $V^\text{approx}$ is computed via a limited-depth search or a heuristic.

  If we jointly estimate the Reward Function **AND** the Computational Model (cognitive costs, planning depth, attention bottlenecks), we can sometimes break the symmetry. For example, if a human chooses a suboptimal path to avoid a steep hill, a simple IRL might think they dislike walking fast. An IRL with a terrain-cost computation model realizes they are minimizing metabolic energy.

  This is the move away from "revealed preference" (choice $\to$ value) toward "rational analysis" (choice + cognitive constraints $\to$ value). It requires knowing how humans compute, not just what they choose.

  ### 3. Cooperative Inverse Reinforcement Learning (CIRL)
  The next generation of these ideas (e.g., Hadfield-Menell et al.) moves beyond passive observation to **interaction**. In Cooperative IRL, the robot is assumed to *know* that the human does not know the true objective, and vice versa. They play a Partially Observable Markov Decision Game.

  Here, the robot actively seeks information to disambiguate the reward function. This solves some underdetermination problems because the *information-seeking behavior* of the human provides extra signals that passive demonstrations do not.
  *   *Observation:* Human opens the fridge, looks, closes it.
  *   *Passive IRL:* Maybe they wanted milk, maybe eggs.
  *   *Active/CIRL interpretation:* They are performing a check to update their belief state regarding my knowledge of their desire.

  This shifts the paradigm from "learning from static demonstrations" to "teaching via interaction."

  ### 4. The "Values Might Not Exist" Problem
  There is a deeper criticism, largely held by researchers like Richard McElreath, Dan Dennett (in his "stance" terminology), and increasingly within the alignment community (e.g., Carl Shulman): **Human values may not correspond to a global, coherent utility function at all.**

  If humans are messy, contradictory, context-dependent creatures (as psychology suggests), then "recovering the reward function" is akin to finding the perfect circle in a squiggly line. You can fit *a* function, but it won't generalize to new contexts because the "function" was never really there to begin with.

  For this reason, much of the recent LW/Alignment writing (post-2020) has shifted focus:
  *   **From Value Learning to Intent Alignment:** Instead of inferring a utility function, ensure the AI's plan doesn't conflict with human preservation (Corrigibility).
  *   **From Reward Functions to Constraints:** Rather than "optimize for human happiness," constrain the system to satisfy human oversight (Constitutional AI, Debate).
  *   **Mechanistic Interpretability:** Instead of observing black-box behavior (IRL), look inside the neural network weights to find circuits that represent concepts, potentially bypassing the "behavior implies value" assumption.

  ### 5. So, why the persistence?
  If IRL is underdetermined and humans aren't consistent utility maximizers, why keep studying it?

  1.  **It Formalizes the Ambiguity:** It forces us to write down the exact relationship between behavior and goals. Even if imperfect, it is more rigorous than saying "just make nice machines."
  2.  **Approximate Utility is Often Sufficient:** For *local* tasks (e.g., a robot stacking cups), a locally consistent reward function inferred from demonstration works fine, even if globally the human isn't an optimizer. We don't need global identifiability for narrow safety.
  3.  **The Benchmark:** It sets a floor. If we claim an AI understands human values, it must at least perform better than a blind imitation learner. IRL provides a theoretical ceiling for behavioral alignment.

  ### Summary
  You are right that **Behavior $\neq$ Unique Utility**.

  The "point" of IRL for alignment is not that it magically extracts the True Utility Function from raw pixels. It is that it serves as a **framework for specifying the prior assumptions required to convert behavior into a proxy for values.**

  When alignment theorists say "we will learn values from demonstrations," they should really say: "We will train a model that assumes humans are bounded-rational agents optimizing a sparse reward function with a known complexity penalty, and we hope those assumptions match reality well enough to prevent catastrophic misgeneralization."

  The math tells us there is no unique solution. The alignment challenge is arguing which member of the equivalence class we should pick to maximize safety. If you feel stuck on IRL, it is because the community has not yet resolved how to pick that member of the class without circular reasoning.

  You haven't missed a step; you've seen past the marketing to the core difficulty. That is exactly where the interesting research is happening now.
