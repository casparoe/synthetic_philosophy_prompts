  2. Criteria
  For me, reduction requires successful logical entailment: macro-description must be deducible from micro-laws plus bridge principles without residue. I prioritize in-principle derivability over current computational tractability. Chaos or complexity is an epistemic barrier, not ontological. True emergence demands new fundamental predicates or causal powers absent at the base level. Thus, if a system’s behavior exhaustively supervenes on its parts—even if computationally hard—it remains reductive. The critical threshold is whether you must postulate entirely new kinds of reality to explain the phenomenon, distinguishing mathematical difficulty from metaphysical independence.

  3. Placement notes
  Chemistry and the arrow rely on known QM and boundary conditions, making them physics problems, not metaphysical mysteries. Superconductivity involves phase transitions, but BCS theory grounds them in fermion pairing effectively. Turbulence is deterministic chaos; it’s numerically messy, not fundamentally mysterious. Yet it shows predictability breaks down despite determinism. Life introduces functional roles, which natural selection explains but physics doesn’t inherently encode. This normativity creates friction for pure mechanism. Life’s evolutionary history introduces historical contingency physics cannot predict, further complicating strict derivation. Consciousness stands apart; even perfect structural knowledge leaves out “what it feels like.” While life might be complex chemistry, consciousness appears to demand new categories, making it the only genuine threat to reductive physicalism here. The distinction helps students distinguish computational hardness from ontological novelty. This clarity prevents conflating simulation inability with reduction failure.

