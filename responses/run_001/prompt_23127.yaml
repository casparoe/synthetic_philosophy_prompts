answer: |-
  Your friend is falling into a common trap: believing that because the paradox seems simple on paper, human institutions would never structure themselves to allow it. But they absolutely do. In fact, many institutions are designed *specifically* this way (e.g., scoring criteria must be met before a final recommendation is issued).

  To prove this isn't a "toy," I'm going to give you a **University Ethics Review Board** example. This is high-stakes, bureaucratic, and relies on strict procedural logic—exactly the kind of environment where the Discursive Dilemma thrives.

  ### The Setting: A Clinical Trial Ethics Board
  A university committee is reviewing a proposal for a new experimental drug trial. Their charter (policy) dictates a strict binary rule for approval.

  **The Propositions:**
  1.  **$P$ (Safety):** "The risks to patients are low."
  2.  **$Q$ (Benefit):** "The scientific knowledge gained is worth the risk."
  3.  **$C$ (Conclusion):** "The trial is approved."

  **The Institutional Logic (The Rule):**
  The committee is bound by policy that states:
  > *The trial shall be approved **if and only if** both Safety ($P$) **and** Benefit ($Q$) are affirmed.*
  > *(Logically: If $P \land Q \to C$)*

  ***

  ### The Voters
  There are 3 committee members (A, B, and C). Each member has their own expert judgment. Crucially, **each member is logically consistent.** None of them makes a mistake in their own reasoning.

  **Member A (The Optimist)**
  Believes the risks are manageable ($P=$ Yes), believes the science is valuable ($Q=$ Yes), so logically they must support approval ($C=$ Yes).
  *   **Vote:** $P$ (Yes), $Q$ (Yes), $C$ (Yes).

  **Member B (The Safety Purist)**
  Believes the risks are manageable ($P=$ Yes), BUT believes the science is trivial/not worth the risk ($Q=$ No). Because the rule requires *both*, they logically oppose approval ($C=$ No).
  *   **Vote:** $P$ (Yes), $Q$ (No), $C$ (No).

  **Member C (The Scientist)**
  Believes the risks are too high ($P=$ No), BUT believes the science is incredibly valuable ($Q=$ Yes). Again, the rule requires *both*, so they logically oppose approval ($C=$ No).
  *   **Vote:** $P$ (No), $Q$ (Yes), $C$ (No).

  ***

  ### The Aggregation (The Dilemma)
  Now, suppose the Board decides the outcomes democratically using **Majority Rule on every proposition separately** (a common procedure known as *issue-by-issue voting*).

  | Proposition | Member A | Member B | Member C | **Majority** |
  | :--- | :---: | :---: | :---: | :---: |
  | **$P$ (Safety)** | ✅ Yes | ✅ Yes | ❌ No | **✅ Yes** |
  | **$Q$ (Benefit)** | ✅ Yes | ❌ No | ✅ Yes | **✅ Yes** |
  | **$C$ (Approval)** | ✅ Yes | ❌ No | ❌ No | **❌ No** |

  ### The Result
  Look at the **Majority** row. The official institutional record now reads:
  1.  We affirm that the risks are low (**$P$ is True**).
  2.  We affirm that the benefit is worth it (**$Q$ is True**).
  3.  We reject the approval of the trial (**$C$ is False**).

  **This violates the Board's own Constitution.** According to their own policy ($P \land Q \to C$), accepting $P$ and $Q$ *requires* them to accept $C$. They have arrived at a set of collective beliefs that is internally contradictory, even though every single individual member voted consistently.

  ### Why Your Friend is Wrong (The "Real World" Rebuttal)
  You can tell your friend that this isn't theoretical abstraction; it is a structural vulnerability in almost any body that uses **criteria-based decision making**.

  1.  **Juries:** In complex tort cases, jurors may vote "Negligent? Yes." "Causation? Yes." "Damages? No." (Because they think the plaintiff exaggerated damages). If the judge sums these up, the defendant is found liable for nothing. This is literally why judges sometimes instruct juries on specific verdict forms rather than asking for open discussion.
  2.  **Hiring Committees:** You require candidates to score above 70 on "Teaching" AND above 70 on "Research" to be hired. Three interviewers might vote differently on who passes which threshold. If you average the "Teaching" score and average the "Research" score separately, you might create a candidate who passes neither threshold but gets hired anyway (or vice versa).
  3.  **Corporate Boards:** Directors often vote on "Strategy A," then vote on "Budget B." Only if both pass is the company allowed to execute. If the Board votes for Strategy and Budget separately, but rejects the Execution Plan, they leave the company paralyzed.

  ### How Institutions Avoid This (The Escape Hatches)
  The dilemma proves that "Majority Rule" is insufficient for complex groups. Real institutions solve this not by banning the logic, but by restricting the voting procedure:
  *   **Conclusion-Based Voting:** They don't vote on $P$ and $Q$ separately; they force everyone to vote *only* on the final Conclusion ($C$). This sacrifices transparency on *why* a decision was made, but ensures consistency.
  *   **Dictatorship/Single Decider:** One person interprets the premises and applies the logic.
  *   **Weighted Voting:** Some voters are given veto power if they disagree with the premises.

  **Summary for your friend:** "The discursive dilemma doesn't rely on people being irrational. It relies on institutions trying to respect individual expertise on sub-issues ($P$ and $Q$) while still requiring a collective decision ($C$). As soon as you try to maximize both local input and global consistency simultaneously, the paradox kicks in automatically. It's a mathematical feature of democratic aggregation, not a bug in our brains."
