          *   The rise of new theories (UDT, FDT) attempting to solve this.
          *   The difference between *computational* embedding (AI) and *biological* embedding (humans).
          *   The concept of "logical counterfactuals."

  5.  **Drafting the Response:**
      *   *Structure:* Introduction -> Breakdown of David's Claims -> Breakdown of Maya's Claims -> The Synthesis/Missing Middle -> Recommendations for the Paper.
      *   *Tone:* Academic but accessible (suitable for a seminar peer). Neutral adjudicator.
      *   *Key Concepts to Weave In:* Logical Induction, Counterfactuals, Causal vs. Evidential vs. Functional Decision Theory, Map-Territory Relation.

