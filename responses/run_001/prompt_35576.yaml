answer: |-
  The claim that the Kelly criterion is merely log-utility Expected Utility Theory is formally isomorphic but normatively divergent, conflating a structural imperative for survival in multiplicative dynamical systems with a subjective representation of risk preferences over static wealth distributions.

  ### Table of Correspondences

  The following table outlines the standard surface-level mapping used in literature where the two frameworks are treated as identical.

  | Feature | Log-Utility Expected Utility Theory (Log-EUT) | Kelly Criterion |
  | :--- | :--- | :--- |
  | **Objective Function** | Maximize $\mathbb{E}[U(W)]$ where $U(W) = \ln(W)$ | Maximize $G(f) = \mathbb{E}[\ln(1 + fR)]$ (Geometric Growth Rate) |
  | **Interpretation of $\ln$** | Psychological diminishing marginal utility (Risk Aversion) | Arithmetic-geometric mean relationship (Compounding Efficiency) |
  | **Optimization Target** | Expected utility of a final wealth state | Time-average growth rate of capital |
  | **Domain of Probability** | Ensemble average (across possible worlds) | Time average (along a single realized path) |
  | **Risk of Ruin** | Infinite disutility assigned to $W=0$ (prevents bet sizing > wealth) | Zero growth rate at $W=0$ (prevents bet sizing that leads to extinction) |
  | **Normative Basis** | Von Neumann-Morgenstern Coherence Axioms | Law of Large Numbers / Ergodicity Optimization |

  ### Where the Mapping Breaks

  The identification collapses under scrutiny when analyzing the normative foundations and temporal structures implied by each framework. The analogy quietly imports static preferences into a dynamic problem where they do not naturally belong.

  **1. Risk Aversion vs. Structural Necessity**
  In Log-EUT, the logarithmic form represents a *subjective psychological state*: the agent prefers certainty or smooth consumption because additional wealth provides less incremental satisfaction. The curvature of the utility function encodes personal temperament. In the Kelly framework, the logarithmic form is an *objective mathematical necessity* arising from multiplicative dynamics. If returns are multiplied sequentially ($W_T = W_0 \prod R_t$), the long-run growth rate is determined by the geometric mean of returns. Since $\ln(\prod R_t) = \sum \ln R_t$, maximizing the sum of logs is mathematically identical to maximizing the product of returns. Here, the log does not reflect an attitude toward risk; it reflects the accounting identity of compounding. One can be a "Kelly optimizer" regardless of whether one enjoys risk, provided the goal is asymptotic wealth maximization.

  **2. Final Wealth States vs. Growth Paths**
  Standard EUT defines preference over lotteries of final wealth states. It is indifferent to the path taken to reach those states (provided the final distribution is unchanged). The Kelly criterion is inherently path-dependent. Two portfolios may have identical expected final wealth distributions over a finite horizon, yet different volatility profiles. EUT (with linear or bounded utility) might favor higher variance if the mean is high enough; Kelly will penalize variance because a drop in wealth requires a proportionally larger recovery percentage to return to the initial value. This is not a preference for lower variance per se, but a recognition that losses reduce the base upon which future gains accrue. The Kelly agent optimizes the *trajectory*, whereas the EUT agent optimizes the *outcome*.

  **3. Time Discounting vs. Compounding Structure**
  In EUT, time discounting is a separable preference parameter ($\delta$ or $\beta$) representing pure impatience or patience, independent of the investment mechanism. In Kelly optimization, "discounting" is endogenous to the reinvestment rate. A lower Kelly fraction effectively acts as a higher discount rate, but this is a result of trading off expected growth against volatility drag, not a reflection of time preference. When scholars treat Kelly as Log-EUT, they often implicitly assume an infinite horizon with no discounting ($\delta=1$), or they fail to distinguish between the cost of capital and the utility of consumption. If an agent discounts the future heavily, Log-EUT suggests consuming early rather than reinvesting. Kelly, strictly defined, assumes total reinvestment; introducing consumption converts the problem back to EUT, stripping away the distinctive growth-maximizing logic.

  **4. The Role of Ruin**
  Both frameworks discourage ruin, but the justification differs fundamentally. In Log-EUT, ruin is avoided because $U(0) = -\infty$; the agent is terrified of bankruptcy due to the utility specification. In Kelly, ruin is avoided because it represents a singularity in the growth equation where growth becomes undefined or permanently negative. More importantly, the Kelly criterion dictates specific bet sizes relative to the current bankroll (fractional Kelly). Log-EUT over a single period does not necessitate fractional rebalancing based on current wealth unless the utility function is explicitly defined over *returns* rather than *levels*. The robustness of the Kelly strategy relies on the repeated application of the strategy (dynamic consistency), whereas Log-EUT solutions can be myopic without further axioms.

  ### Conclusion and Recharacterization

  The conclusion that Kelly is nothing but log-utility EU does not survive the distinction between ensemble averages and time averages. Equating the two allows objections to EUT (such as the St. Petersburg paradox sensitivity or independence axiom violations in dynamic settings) to be incorrectly transferred to Kelly, even though Kelly’s normative force derives from physical ergodicity properties rather than subjective preference coherence.

  A more accurate characterization is that **the Kelly criterion is the time-average optimal strategy for non-ergodic multiplicative stochastic processes, while Log-EUT is the ensemble-average optimal strategy for agents holding concave beliefs about terminal wealth.**

  They intersect only when the underlying process is ergodic (where time averages equal ensemble averages), or when the decision-maker adopts a utility function specifically designed to mirror the statistical mechanics of their environment. Recognizing this distinction restores the Kelly criterion’s status as a normative framework for *survival and growth* in repeated environments, distinct from the EUT framework of *choice and satisfaction* over uncertain lotteries.
