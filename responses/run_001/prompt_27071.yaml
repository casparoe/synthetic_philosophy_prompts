answer: |-
  This is a profound question. You have effectively moved past asking *"Is ADHD real?"* (the ontological status of the object) to asking *"What makes a classification system legitimate?"* (the meta-theory of the tool).

  Since you are looking for the structural requirements of an adequate theory—not a defense of the current DSM or ICD—you need a framework that handles the unique messiness of human psychology: it involves biology, culture, language, and self-conception all at once.

  Here is a breakdown of the five core desiderata for an adequate theory of psychiatric kinds, the arguments for why they are non-negotiable, and the critical tensions where they likely cannot all be satisfied simultaneously.

  ---

  ### 1. The Causal Coherence Requirement
  **Definition:** The category must correspond to a distinct causal mechanism (or a cluster of mechanisms) that generates the observed symptoms, rather than merely grouping superficially similar behaviors.

  **The Argument (Why it’s mandatory):**
  If categories are arbitrary groupings, there is no reason to expect consistent treatment outcomes or predictable progression.
  *   **Case:** In somatic medicine, we separate "bacterial pneumonia" from "viral pneumonia." Both involve coughing and fever, but treating one with antibiotics fails for the other. This proves the classification must track causal etiology to be scientifically valid.
  *   **Psychiatric Counter-case:** Historically, "neurosis" grouped anxiety, depression, and OCD. Because the underlying mechanisms were likely different (serotonin dysregulation vs. dopamine reward circuits vs. amygdala hyperactivity), treatments worked inconsistently. An adequate theory cannot permit "gerrymandering"—lumping things together simply because they look alike if they react differently to intervention.
  *   **Constraint:** The theory must distinguish between *proximal markers* (symptoms) and *underlying pathology*.

  ### 2. The Pragmatic Utility Requirement
  **Definition:** The classification must generate reliable predictions regarding prognosis, comorbidity, and functional impairment in clinical settings.

  **The Argument (Why it’s mandatory):**
  Psychiatry is a normative, practical enterprise, not just pure natural history. A taxonomy that is "true" but useless is a failure of the field's mission.
  *   **Case:** Consider the distinction between Bipolar II and Major Depression. Biologically, they share significant overlap (and controversy exists about whether they are distinct). However, clinically, the distinction is vital because antidepressants can induce mania in Bipolar patients. If a theory claims Bipolar and MDD are "the same spectrum" (to satisfy causal purity), but a clinician gives an SSRI that triggers psychosis (violating utility), the theory is inadequate for practice.
  *   **Constraint:** A theory cannot privilege "biological truth" if doing so renders the label unhelpful for treatment planning. It must solve the problem of *actionability*.

  ### 3. The Reflexive Stability Requirement (The Hacking Constraint)
  **Definition:** The theory must account for the "looping effect"—the capacity of the human subjects being classified to understand the classification and adapt their behavior/identity in response.

  **The Argument (Why it’s mandatory):**
  Unlike tigers or atoms, humans read the manual. When people adopt a diagnosis, their behavior changes, potentially altering the statistics that defined the diagnosis. A static theory breaks here.
  *   **Case:** **Asperger’s Syndrome.** Before the mid-20th century, autism was rare. As understanding spread, more adults were identified (diagnostic substitution/expansion). Then, the DSM-5 folded Asperger’s back into Autism Spectrum Disorder. An adequate theory cannot claim "Asperger’s disappeared because we found new data"; it must acknowledge that the *social understanding* of the category shifted its boundaries.
  *   **Case:** **ADHD Diagnosis.** For many adults diagnosed late in life, adopting the diagnosis provides a coherent narrative for their life history ("That's why I failed school"). This identity adoption changes their self-regulation strategies. A theory that ignores this feedback loop will mistakenly view the "change in population prevalence" as biological evolution rather than sociological interaction.
  *   **Constraint:** The theory must define how much of the diagnostic criteria constitutes "fixed nature" vs. "social performance."

  ### 4. The Cross-Cultural Translatability Requirement
  **Definition:** The core phenomenology of the disorder must remain recognizable across distinct cultural frameworks, even if the expression varies.

  **The Argument (Why it’s mandatory):**
  If a category only exists in Western bio-medical contexts, it suggests the category may be iatrogenic (created by the measurement itself) rather than tracking a universal human distress pattern.
  *   **Case:** **Somatization.** In many non-Western cultures, depression presents primarily as physical pain (backache, headache) rather than "sadness." A rigid theory claiming "Depression is sadness + chemical imbalance" would misclassify these patients. An adequate theory must distinguish between *universal core experiences* (anhedonia, despair) and *cultural idioms of distress* (how that despair is felt/told).
  *   **Case:** **Homosexuality.** In 1952, the DSM listed homosexuality. In 1973, it was removed. This wasn't just a political win; it was a recognition that "same-sex attraction" did not cohere with the criteria of mental pathology (distress, dysfunction) universally. It showed that some categories fail translatability when they encode specific moral norms rather than psychopathology.
  *   **Constraint:** The theory must filter out culturally specific moral judgments from universal psychobiological stress.

  ### 5. The Normative Sensitivity Requirement
  **Definition:** The theory must recognize its own potential for harm and incorporate ethical safety checks against over-pathologization.

  **The Argument (Why it’s mandatory):**
  In psychiatry, the "label" is a tool of power. It determines disability status, insurance coverage, criminal responsibility, and freedom (civil commitment). A theory that is accurate but dangerous violates the principle of non-maleficence.
  *   **Case:** **Grief vs. Depression.** The DSM-5 controversially removed the "bereavement exclusion." Previously, if you cried after a spouse died, you couldn't be diagnosed with MDD for two months. Removing this allowed earlier treatment but risked medicalizing normal human sorrow. An adequate theory must weigh the *utility* of identifying depression quickly against the *harm* of medicalizing normal grief.
  *   **Case:** **Borderline Personality Disorder.** This label carries high stigma and affects how staff treat patients (neglect vs. care). A theory that admits "Personality Disorders" are highly fluid (often improving with age) but lacks a mechanism to warn clinicians of this trajectory creates long-term harm.
  *   **Constraint:** The theory must acknowledge that the *cost of error* is not symmetric. False positives (over-diagnosis) and false negatives (missed diagnosis) carry different ethical weights.

  ---

  ### The Joint Unsatisfiability Problem
  You asked for pairs that look jointly unsatisfiable. This is where the philosophy gets painful. You cannot maximize all five above at the same time. Here are the three major trade-offs your theory will face:

  #### Conflict A: Causal Purity vs. Clinical Utility
  *   **The Clash:** To be **Causally Pure**, a diagnosis should rely on biomarkers (e.g., brain scan, genetic marker) that are invariant. To be **Clinically Useful**, a diagnosis must rely on symptoms that can be reported immediately in a 15-minute visit.
  *   **The Tension:** Current biomarkers for ADHD are not specific enough to diagnose individuals. They only correlate statistically in groups. If a theory demands biological specificity to be "True," it invalidates the current clinical utility of ADHD. If it prioritizes utility (based on behavioral observation), it accepts a degree of biological fogginess that future science might prove false.
  *   **Result:** You must choose between being a **Realist** (waiting for biological validation) or a **Pragmatist** (using symptoms as sufficient grounds for now). You cannot be both simultaneously in the short term.

  #### Conflict B: Reflexive Stability vs. Scientific Stability
  *   **The Clash:** **Reflexive Stability** requires the theory to admit that the definition of the category changes as people learn it (Hacking). **Scientific Stability** requires definitions to be fixed enough to allow longitudinal research and replication.
  *   **The Tension:** If "Autism" means something different to a doctor in 2020 than a doctor in 2000 because of looping effects, comparing prevalence rates becomes impossible. If the theory stabilizes the definition too rigidly to please scientists, it alienates the community (autistic people) who have redefined the experience via neurodiversity movements.
  *   **Result:** An adequate theory creates a "moving target" that protects the lived experience of the patient but corrupts the statistical integrity of the science.

  #### Conflict C: Cultural Translatability vs. Specific Mechanisms
  *   **The Clash:** **Translatability** asks us to find common denominators of suffering. **Specific Mechanisms** asks us to isolate unique pathways.
  *   **The Tension:** If "Anxiety" is culturally variable (fear of spirits vs. fear of heart attack), and we try to force it into one Western biological box to keep it "scientific," we lose the nuance required to treat it effectively in that culture. Conversely, if we tailor every diagnosis to the local culture, we lose the ability to do global pharmaceutical trials or comparative neuroscience.
  *   **Result:** You face a choice between **Universalism** (one brain, one medicine) and **Particularism** (many minds, many healings). You cannot fully optimize both without diluting the strength of either claim.

  ### Summary: What is the Theory Actually Trying To Be?
  Given these conflicts, most contemporary philosophers of psychiatry settle on one of two models:

  1.  **Homeostatic Property Clusters (Boyd/Richards):** This argues psychiatric categories aren't strict essences (all cats have whiskers), but clusters of properties that tend to co-occur due to underlying causes. *Problem:* This slides too far toward pragmatism; if the cluster breaks, is the category gone?
  2.  **Pluralistic Realism (Murphy/Woodward):** There is no single correct "map" of the mind. Different levels of abstraction serve different purposes (evolutionary, neurological, phenomenological). ADHD is a "real" kind at the behavioral level (it predicts classroom failure), even if we don't have a gene yet.

  **Your Takeaway:**
  An adequate theory of psychiatric classification does **not** aim for a final, immutable truth. It aims to maximize **predictive grip** while minimizing **harm**.

  It gets right by admitting that ADHD might be a "real" pattern of neural variability (Causal), that it helps you organize your life story (Utility/Identity), but also that the label evolves as society understands learning styles better (Looping).

  The failure isn't that the categories aren't "perfectly real." The failure is pretending they are finished products. An adequate theory tells you exactly *why* the category is unstable, and whether that instability is a bug or a feature of the loop.
