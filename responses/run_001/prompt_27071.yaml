prompt: |-
  so i got diagnosed with adhd a couple months back (at 34) and ive been reading everything i can about what psychiatric categories even *are*. i found hacking's stuff on looping effects — how the classified people change in response to the classification, which then changes the classification, round and round — and it kind of blew my mind. but now i realise i dont actually know what i should be asking of a theory of psychiatric classification in the first place.

  can you lay out the desiderata? what does an adequate theory of psychiatric kinds have to actually get right? im thinking about the cases it has to handle (some categories seem to pick out real patterns, others feel like historical accidents; people adopt diagnoses as identities while others reject them; some travel across cultures, some dont; the same label means something different in 1980 vs 2020), the distinctions it cant afford to collapse (like useful vs true, or "the classification caused changes" vs "those changes are part of what makes the classification true"), and empirical results it cant contradict. for each one, give me the argument or case that makes it a genuine requirement, not just someones philosophical preference. and flag any pairs that look jointly unsatisfiable — if the full list cant all be met at once, thats the part i most want to see. skip scoring the existing theories, ill do that.
