  5.  **Refining the Argument:**
      *   *Self-Modification:* It works (e.g., `eval`, dynamic proxies). But it breaks safety guarantees.
      *   *Bootstrapping:* Compilers write compilers. That's stable. Why? Because there's a fixed point (the initial version). Nomic often worries about the *very first* rule change erasing the mechanism of change. In SE: If you delete your own `main()` entry point or override the `ClassLoader` method while it's being used, you deadlock/crash.
      *   *The "Paradox":* Russell's Paradox style ($R \in R$). In SE, this manifests as stack overflow or circular dependency resolution failure. It doesn't linger as a "paradox"; it just stops working.
