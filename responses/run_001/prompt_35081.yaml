      *   *Verdict:* The SE framework isn't impoverished; it exposes that Nomic is a *socio-technical* system disguised as a formal one. The "puzzle" vanishes when implemented strictly (it either compiles/runs or it segfaults/violates constraints), unless we model "normative force" explicitly (which requires complex agent modeling beyond standard SE).

