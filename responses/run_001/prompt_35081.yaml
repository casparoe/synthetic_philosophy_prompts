  *(Self-Correction during drafting)*: I need to be careful about the "Validity" distinction. In SE, invalid code throws an exception. In Nomic, a "bad" move might still stand if interpreted loosely. I should highlight how *Operational Semantics* handles this: in code, undefined behavior is fatal or specific; in law, it's open-ended.

  Let's refine the "Paradox" part. A metacircular interpreter changing its own evaluation logic... If I change the definition of `if` inside the interpreter that executes `if`, do I get stuck?
  In Lisp/Scheme: You can redefine `if`. But you do it via the macro system or by rebinding variables. The *evaluation cycle* must remain intact to evaluate the redefinition. This maps well to *Bootstrapping*. The initial rules provide the *Bootstrap Loader*. If you delete the loader while loading, you crash.
  So the "Paradox" in Nomic is often a *Race Condition* or *Circular Dependency* in SE terms.
