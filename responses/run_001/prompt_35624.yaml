answer: |-
  This is a fantastic problem, and it is arguably the single biggest hurdle for naturalistic theories of content. You’ve pinpointed what philosophers often call the **Modal Objection**: How do you ground the truth-conditions of statements about what *isn't* the case using a theory grounded entirely in what *was* the case?

  It is totally understandable that you got stuck at 2 AM. On first glance, the objection seems fatal: Evolution acts backward-looking (history fixes function) but logic looks forward-looking (truth conditions involve possible worlds). If content is fixed by history, and history is actual, how do we get modal content?

  However, there is a strong charitable reading of teleosemantics that handles this. To win this debate, you have to shift how we think about "selection history." Evolution didn't just select for reacting to *this specific fly*; it selected for a mechanism sensitive to a **modal profile**—a range of properties that would trigger the response successfully.

  Here is the strongest defense of teleosemantics against the counterfactual objection, specifically leveraging the differences between Millikan’s consumer side and Dretske’s indicator side.

  ### 1. Selection Acts on Dispositions, Not Tokens
  First, we need to correct the premise that "evolution only ever involved actual states of affairs." While selection happens via actual events, the *result* of selection is always a **disposition**.

  Consider your frog example again. The teleosemantist does not claim the frog's eye-state means *"There is a fly exactly 3 meters away right now."* That would be too narrow to be biologically useful. The proper function of the mechanism is to capture *insects* in *variations of proximity*.
  *   The content is fixed by the conditions under which the mechanism successfully performed its task in the past.
  *   Since the task required success across *varying conditions*, the content includes those conditions.

  **The Counterfactual Leap:** If the mechanism is properly functioning when it detects insect-movements across a variety of lighting angles, velocities, and distances, its content is not "Insect-here-now," but rather "Something-insect-like-moving-like-this."
  That predicate applies to objects that are *not currently present* but *could be present*. The selection history fixed a **disposition to respond to type F**, not a token relation to item f. Any disposition is inherently counterfactual: "If an F were here, the mechanism would fire." Teleosemantics captures this because the "success condition" for the proper function is stable across close possible worlds (the "Normal Conditions" in Millikan's sense).

  ### 2. Millikan's Consumer Side Has Specific Resources Here
  You asked about Millikan vs. Dretske. If you have to choose one framework to defend against the modal objection, **choose Millikan.** Her version of teleosemantics has resources that Dretske's pure indicator theory simply lacks.

  #### A. Mapping Rules and Normal Conditions
  Ruth Millikan argues that a mental representation works like a map. For a map to have a proper function, it must be paired with a "consumer mechanism" (another part of the system or another agent) that uses the map to navigate reality.
  *   **The Crucial Move:** The "correspondence" between the sign and the world isn't a direct causal link (like Dretske); it is a **structural mapping**.
  *   For humans, our "maps" (beliefs/desires) are consumed by our practical reasoning systems. We don't just react; we reason.
  *   Millikan allows for **indirect correspondence**. My belief "Glass will break if dropped" corresponds to a physical property (fragility) and a causal law (gravity). Selection didn't pick up "drop-fragility-pairs" directly. Instead, selection picked for mechanisms that utilize general causal models to predict harm.
  *   The content of the counterfactual is fixed by the **role of the concept** in guiding successful behavior in cases *where the antecedent holds*. The "job description" of my counterfactual belief-forming mechanism is to simulate outcomes.

  #### B. Normative Force
  Counterfactuals are inherently normative. "If I had left early, I wouldn't be late" implies I *should* judge my leaving as having caused lateness.
  *   Dretske struggles here because information is descriptive. If signal X covaries with state Y, that's all there is.
  *   Millikan introduces **normativity** via the consumer relationship. A representation has content if it is supposed to match the world in order to guide success.
  *   A counterfactual belief like "If I hadn't eaten sugar, I wouldn't have a stomach ache" guides a future consumer (my future self) toward avoiding sugar. The content is fixed by the **success conditions of the interaction** that the belief supports. Even though the antecedent is false (I ate sugar), the *interaction pattern* (Sugar -> Ache) is established through repeated actual instances, and the belief functions to inhibit future consumption. The truth-condition of the counterfactual is derived from the stability of that causal interaction across history.

  ### 3. The "Mental Time Travel" Adaptation
  To handle high-level human counterfactuals ("If I took the other job"), we need to posit that we evolved a specific mechanism with a specific proper function: **Prediction/Simulation.**

  Here is the argument for how this fits teleosemantics without hand-waving:

  1.  **Evolutionary Problem:** Social mammals need to plan. Survival often depended on choosing between Path A and Path B without physically walking both.
  2.  **Adaptation:** Cognitive systems evolved to construct internal models of causal structure (cause-and-effect understanding).
  3.  **Proper Function:** The proper function of these internal models is not just to register current stimuli (Dretske), but to test hypotheses against internalized causal laws (Millikan-style complex mappings).
  4.  **Content Fixation:** The content of "If I took Job B, I'd be happy" is fixed by two things:
      *   (a) The semantic content of "Job B" and "Happy" (grounded in actual indicators/memories).
      *   (b) The operation of the **simulation mechanism**, whose proper function is to take input A and produce output prediction B based on stored causal regularities.

  The "counterfactual" nature comes from the **operation** of the mechanism (running a model offline), but the **content** is fixed by the inputs to the model (which are teleosemantically grounded in real experience) and the **success conditions** of the predictions. If I simulate taking Job B and it generates a feeling of "dread," and later I observe people who took Job B and they look distressed, the mechanism is verified. The content is fixed by the *track record of the simulation mechanism*.

  So, the teleosemantist says: "My belief content 'I would have been happier' is true/accurate if it aligns with the output of a simulation engine selected to track human happiness-fulfillment patterns." The counterfactual is grounded in the **functional reliability** of a predictive tool.

  ### 4. Why Dretske Struggles (and how he can fight back)
  David Dretske’s theory is Informational Semantics coupled with Teleology (ETI - Explanation-Theoretic Indexical). He faces a harder row to hoe because his starting point is **Information**.

  *   **The Problem:** Information implies a strict covariation. $F$ carries the information that $G$ only if $P(G|F)$ is near 1. But counterfactuals deal with cases where $F$ didn't happen. How can a state carry information about something that didn't occur?
  *   **Dretske's Best Shot:** He relies heavily on **Nomic Dependence**. Laws hold in all possible worlds. If the content is determined by the relevant law (e.g., Glass-Breaking Law), then the content is inherently modal.
  *   However, explaining *how* the brain represents the Law is tricky for Dretske. He needs to say that the neural state correlates with the property of fragility. But "fragility" is a dispositional property (it involves what *would* happen). Dretske can say that the neural state correlates with the *manifestation* of fragility (cracking), but to get the full counterfactual meaning "Would crack if dropped," he needs to assume the subject grasps the underlying nomological necessity. Without Millikan's robust notion of "Task" and "Consumer," Dretske risks treating the belief as merely indicating a past crack, not a future breaking.

  Therefore, Millikan is superior here because she defines content by **what the system is designed to accomplish**. A system designed to predict future states (even if those states aren't happening now) has a proper function to represent them accurately. Dretske defines content by **what the state signifies**; distinguishing between signifying a crash and signifying a risk of a crash is harder for him.

  ### 5. The Synthesis Argument (The Winning Pitch)
  If you want to end the debate, here is the synthesized "Best Run" for Teleosemantics:

  > "Teleosemantics does not ground counterfactual content in the history of specific counterfactual events—because there are none. Rather, it grounds counterfactual content in the history of **mechanisms selected for handling modal profiles**."

  1.  **Dispositions over Events:** Evolution selects for dispositions to respond to types, not tokens. A disposition is logically equivalent to a conditional: "If a type F is encountered, response R will occur." The frog sees "fly" because it responds to the class of objects fitting a specific modal profile.
  2.  **Causal Modeling:** Humans evolved a higher-order mechanism (Mental Time Travel) whose proper function is to generate representations of **non-actual outcomes** based on actual causal regularities.
  3.  **Functional Verification:** The content of a counterfactual belief is accurate if the simulation matches the way the world *actually behaves* under perturbation. I know what "Job B" content means because I understand the causal laws governing happiness derived from actual experiences.
  4.  **Normativity via Consumption:** As Millikan argues, these beliefs are used by consumers (our decision modules). Their truth is measured by whether they lead to successful navigation of the actual world. If believing "I'd be happier at Job B" helps me navigate away from misery effectively (by motivating career change or regret management), the belief has served its proper function.

  ### Summary: Who Wins?
  The objection that "selection history only involves actuals" is a category error. Selection history is the history of organisms surviving in environments that contained **variation**. To survive in an environment with variation, an organism must possess representations with **modal scope** (scope across possible configurations of that environment).

  **Millikan wins this round.**
  Because her theory ties content to the **success conditions of a consumer system**, she can argue that the proper function of a human belief-system includes handling "off-line" processing (reasoning about the non-actual). The content is fixed by the inputs (actual memories/concepts) combined with the proper function of the logical operators (simulation/prediction).

  Dretske can only win if he concedes that "information" covers nomic connections, but Millikan's framework explains *why* we have those connections in the first place (to aid survival), making the leap to counterfactuals much less metaphysically mysterious.

  **Closing thought:** The counterfactual doesn't float above the actual. The counterfactual belief is a tool calibrated by the actual to manage the possible. The calibration process *is* the evolutionary history. You don't need a ghost in the machine to run the tape again; you just need a machine built to learn the rules so well it can play the game without the ball. That machine was selected for.
