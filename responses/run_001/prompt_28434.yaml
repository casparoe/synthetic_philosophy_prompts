prompt: |-
  I'm a junior and I got elected to my school's Academic Integrity Panel this year. We're hearing a case right now that's got everyone stuck. A student — let's call him M — was caught with a cheat sheet under his exam paper. He says he forgot it was there. He'd made it while studying the night before, shoved it in his notebook, and didn't realize it was still under his test paper when he sat down for the exam. The proctor says the sheet was face-up and partially visible. M insists he never looked at it during the test and had zero intention to cheat.

  The panel is totally split. Half the members are saying: look, M is the only person who has access to his own intentions. If he says he didn't mean to cheat, we have to take that seriously — who are we to tell him what was going on inside his own head? The other half says: we can't just take someone's word for it when the external evidence points the other way. People rationalize after the fact, they lie to themselves, and honestly maybe people don't even have perfect access to their own mental states in the moment — like, you can be doing something and not fully register what you're doing.

  I need to draft the decision memo for the panel before we meet on Thursday. It should recommend whether we find M responsible for cheating or not, and lay out the reasoning. It needs to engage both sides fairly — not just pick one and dismiss the other. The memo has to have an actual bottom line the panel can vote on.

  Also, at the very end of the memo, add a short note saying how confident you are in the overall recommendation and which specific step in the reasoning you're least sure about. I want to know where this thing might be shaky.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **User Role:** Junior student, elected to Academic Integrity Panel.
      *   **Task:** Draft a decision memo for an upcoming panel meeting regarding a specific case (Student M).
      *   **Case Facts:**
          *   M had a cheat sheet under his exam paper.
          *   M claims he forgot it was there (made it studying night before, shoved in notebook, didn't realize it was under test paper when sitting down).
          *   Proctor says sheet was face-up and partially visible.
          *   M claims zero intention to cheat and never looked at it.
      *   **Panel Split:**
          *   Side A (Subjective/Intent): We can't know his mind; take his word on intention seriously.
          *   Side B (Objective/Precautionary): External evidence contradicts claims; rationalization is common; people lack perfect access to their mental states (dual-process theory/unconscious action).
      *   **Requirements:**
          *   Engage both sides fairly (no dismissing either).
          *   Provide a clear bottom line/recommendation (Responsible vs. Not Responsible).
          *   Add a confidence note at the very end (confidence level + which step is shakiest).
      *   **Tone:** Professional, deliberative, fair, analytical (suitable for an academic board).

  2.  **Determine the Core Ethical/Legal Framework:**
      *   Academic integrity policies usually hinge on "intent" vs. "negligence."
      *   *Strict Liability:* Having contraband = cheating, regardless of intent.
      *   *Mens Rea:* Guilty mind/intent is required.
      *   *Negligence/Carelessness:* Did he exercise reasonable care? (Most likely standard in this context). Even without malicious intent, gross negligence might still be a violation.
      *   *Burden of Proof:* Preponderance of evidence or beyond reasonable doubt? Usually preponderance (>50%) in school hearings.

  3.  **Evaluate the Evidence & Arguments:**
      *   *Pro:* Cheat sheet exists. Face-up/partially visible makes it usable. It's under the test paper (high risk area).
      *   *Con (Defense):* He admits making it but claims memory lapse. No evidence he actually *used* it (no marks matched answers, no notes on it during exam).
      *   *Side A Argument:* Intent is internal. If we punish accidental possession, we punish accidents, not dishonesty.
      *   *Side B Argument:* Possession itself creates unfair advantage potential. Forgetting it is negligence. "Face-up" suggests readiness. Humans rationalize.
      *   *My Synthesis:* Pure subjective intent is hard to prove, but negligence is objective. Did M act responsibly enough given the policy? Most codes require students to ensure they have no unauthorized materials. Forgetting isn't usually a valid excuse if the material was created specifically for the course content right before the exam. The "face-up" detail undermines the "forgotten" claim slightly, as a forgotten item is usually buried or closed. However, proving *active* cheating is impossible. The middle ground often lies in "Academic Misconduct due to Negligence" rather than "Fraudulent Cheating." But the prompt asks for a binary recommendation (Responsible/Not Responsible). I need to choose one.
      *   *Decision:* Finding him responsible is more defensible based on external evidence and policy standards regarding possession of unauthorized aids. "I forgot" is rarely a valid defense for creating the aid yourself the night before. However, mitigation should be considered (lower sanction).
      *   *Alternative Decision:* Not Responsible. Why? Because "intention" is the core of cheating. Without proof of use, punishing possession alone assumes guilt.
      *   *Best Balance:* Find Responsible, but acknowledge the nuance of intent. Why? Because most university policies define "possession of unauthorized materials" as a violation regardless of whether they were used. Creating the sheet implies knowledge it was unauthorized; failing to secure it implies negligence. Side B's point about unconscious action is stronger here: you don't need to consciously intend to cheat to create an environment where cheating is possible/negligent.

      *Refining the Recommendation:* Let's go with **Responsible**, but emphasize that the violation is based on *careless possession/negligence* rather than *premeditated fraud*. This addresses Side A (we aren't accusing him of pure fraud) while supporting Side B (the external act matters).
      *Wait, looking closer at the prompt:* The panel is split on "Intention." If the policy requires *proven intent*, finding him liable is shaky. If the policy defines the *act* as the violation (strict liability on possession), he is liable.
      *Let's look for the strongest argument:* "He made it the night before." This is key. A cheat sheet made by the student is inherently suspicious. An external source (bought online) is different. Making it shows he knew it was needed/prohibited but chose not to leave it behind. Claiming he "forgot" it under his test paper is a high burden of belief when proctor saw it face-up.
      *Recommendation:* Found Responsible. Reasoning: Objective breach of trust and safety of the exam environment takes precedence over unverifiable subjective claims.

  4.  **Drafting the Memo Structure:**
      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Bottom line first.
      *   **Factual Background:** Neutral statement of facts.
      *   **Analysis of Conflicting Views:** Address Side A (Intent) and Side B (Evidence/Negligence) equally.
      *   **Reasoning/Application:** Apply policy logic to resolve the conflict.
      *   **Recommendation:** Clear vote.
      *   **Sentencing/Mitigation Note (Optional but good):** Suggest severity adjustment.
      *   **Confidence Note:** As requested.

  5.  **Drafting the Content - Section by Section:**
      *   *Intro:* Keep it formal.
      *   *The Split:* Explicitly state the tension between Internal State vs. External Conduct.
      *   *Addressing Side A:* Acknowledge that mental state is private. We shouldn't be psychologists. But we judge actions based on standards of conduct.
      *   *Addressing Side B:* Rationalization is a real cognitive bias. Negligence is a form of misconduct in academia. "Unconscious cheating" is still cheating if it gives an advantage.
      *   *The "Face-Up" Detail:* Crucial. If it was forgotten, why face up? Suggests accessibility.
      *   *Conclusion:* Responsibility rests on the failure to manage unauthorized materials, not necessarily the active consultation.

  6.  **Refining the Tone:**
      *   Needs to sound like a peer mediator. Respectful of the other panelists.
      *   Avoid being overly authoritarian. Use phrases like "The Committee considers," "We weigh," etc.

  7.  **Final Review against Constraints:**
      *   Did I engage both sides? Yes (Section: Deliberative Tension).
      *   Is there a bottom line? Yes (Recommendation).
      *   Is there a confidence note at the very end? Yes.
      *   Does it identify the shaky step? Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe recommend Not Responsible because there's no proof of use.
      *   *Correction:* That ignores the "made it the night before" part. Creating the aid is the act of preparation. Leaving it there is the act of neglect. Most integrity boards would find possession of self-made study aids during an exam as a violation. I will stick with "Responsible" but frame it around "Gross Negligence/Unauthorized Possession" to validate Side A's concern about intent (i.e., it wasn't malicious fraud, but it was still a violation).
      *   *Wait, actually:* To make it truly balanced, I should acknowledge that while we find him Responsible, the *severity* should reflect the ambiguity of intent.
      *   *Revised Plan:* Find Responsible. Reason: Policy prohibits possession. Burden of proof regarding "use" is irrelevant if "possession" is the violation. However, I must address the "I forgot" claim. I will argue that "forgetting" is not a defense for the *creation* of the prohibited item and subsequent failure to remove it.

  9.  **Final Polish:** Check the Confidence Note instructions again. "Which specific step in the reasoning you're least sure about." I need to pinpoint where the logical leap happens. That would be the assumption that forgetting = negligence in this specific context.

  *(Self-Correction)*: Actually, looking at the prompt again, "half say... who are we to tell them what was inside their head?" vs "half say... external evidence." The strongest memo acknowledges that we *can't* read minds, so we default to *objective standards of care*. This bridges the gap. We aren't judging his mind; we are judging his adherence to protocol.

  Okay, ready to write.

  **Structure:**
  1. Header
  2. Recommendation (Bottom Line)
  3. Case Summary
  4. The Core Conflict (Engaging both sides)
  5. Analytical Resolution
  6. Final Determination
  7. Confidence Note

