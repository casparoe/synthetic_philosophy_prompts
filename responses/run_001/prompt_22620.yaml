answer: |-
  It is a pleasure to engage with a colleague approaching these questions with the seasoned perspective of a geophysicist. Your intuition is correct: the discrepancy between the mathematical formalism of standard Bayesian confirmation and the historical practice of scientific reasoning—exemplified so starkly by Einstein and Mercury—is one of the most enduring puzzles in philosophy of science.

  In observational sciences like yours, the distinction between "predicting new data" and "accounting for known anomalies" is often blurred in practice, even if distinct in principle. You are asking not for a platitude, but for the structural mechanics of the puzzle. Below, I address each of your four points, keeping the notation rigorous but prioritizing the conceptual architecture.

  ---

  ### (i) The Mechanics of the Blockage: Why Ordinary Conditionalization Fails

  To see precisely where the algebra collapses, we must distinguish carefully between the *temporal* sequence of events and the *logical* structure of the probability space.

  Let $H$ be the hypothesis (General Relativity) and $E$ be the evidence (the anomalous perihelion precession). Let $P_t$ denote your probability distribution at time $t$.
  *   $t=0$: You possess background knowledge $K$ but have not yet formulated $H$. You know $E$ empirically (it has been observed and catalogued).
  *   $t=1$: You formulate $H$ and learn that $H$ entails $E$.

  In standard Bayesian epistemology, confirmation is measured by how much the probability of $H$ increases upon learning $E$. This is modeled by **conditionalization**:
  $$P_{new}(H) = P_{old}(H \mid E)$$
  Using Bayes's theorem:
  $$P(H \mid E) = \frac{P(E \mid H)P(H)}{P(E)}$$

  **The Collapse:**
  If $E$ is "old evidence," it means the agent already knows $E$ to be true prior to considering $H$'s relation to it. In probability calculus, an event known to be true has probability 1.
  $$P_{old}(E) = 1$$

  Substituting this into the denominator:
  $$P(H \mid E) = \frac{P(E \mid H)P(H)}{1} = P(E \mid H)P(H)$$

  Now, consider the nature of the evidence in the Mercury case. GR explains the anomaly precisely; therefore, we typically assume that $H$ entails $E$. If $H \implies E$, then $P(E \mid H) = 1$.
  $$P(H \mid E) = 1 \cdot P(H) = P(H)$$

  Thus, the posterior probability equals the prior probability. The Bayes factor (ratio of likelihoods) becomes unity (if we look at odds). Mathematically, the degree of confirmation is zero.

  **Why this feels wrong:**
  The failure lies in the assumption that $P(E)=1$ makes $E$ redundant information *for the purpose of evaluating $H$*. In physics, we intuitively know that the discovery that a specific mathematical framework *reproduces* a specific number is non-trivial information. However, standard conditionalization assumes the probability assignment represents a static state of belief. If $E$ is already assigned probability 1, no amount of updating on the proposition "$E$ is true" can move the needle on $H$.

  ---

  ### (ii) Why Jeffrey Conditioning Does Not Rescue the Case

  Jeffrey conditioning (or probability kinematics) was indeed invented to handle cases where evidence is not certain ($0 < P(E) < 1$) or where the evidence comes in degrees. It allows an agent to update their probability function $P$ to $P^*$ by fixing the probabilities of a partition $\{E_i\}$ and preserving conditional probabilities. The formula is:
  $$P^*(A) = \sum_i P(A \mid E_i)P^*(E_i)$$

  One might ask: *Could we use Jeffrey conditioning to simulate the discovery that $H$ implies $E$?*

  The answer is generally **no**, for two reasons:

  1.  **The Nature of the Input:** Jeffrey conditioning applies when your sensory inputs change your confidence in *facts about the world* (e.g., a dim light, a noisy signal). The "evidence" in the Mercury problem is not a fluctuation in the value of the precession; the value is settled. The "news" is not that $E$ happened, but that $H$ connects to $E$. Jeffrey conditioning cannot update the relationship between a hypothesis and a piece of established fact; it only updates the weight given to established facts.
  2.  **Coherence Violations:** To make Jeffrey conditioning work here, you would effectively have to *lower* your confidence in $E$ from 1 to some number less than 1, perform the update, and then restore $P(E)=1$. While some have proposed this as a formal trick (treating the old evidence as "uncertain in the mind of the historian"), it violates the principle of total evidence. If you actually know $E$, assigning $P(E) < 1$ is irrational (diachronic inconsistency).

  Consequently, Jeffrey conditioning solves problems of *imprecise perception*, whereas POE is a problem of *logical deduction*. It bridges the gap between perception and belief, not between theories and established data.

  ---

  ### (iii) The Role of Background Knowledge ($K$) and Discovery History

  This is the heart of the conceptual difficulty. Standard Bayesianism posits that the confirmation depends only on the probability values in your current state of knowledge $K$. It is famously ahistorical.

  **Does History Matter?**
  Formally, no. Intuitively, yes.
  If you construct a hypothesis specifically to accommodate an existing data point, many philosophers argue you are "double-counting" or engaging in curve-fitting. If you derive a prediction that happens to match existing data, it counts as genuine confirmation.
  However, in the pure Bayesian formalism $P(H \mid E, K)$, $P(E \mid H, K)$ is all that matters. If $E$ is in $K$, then $E$ is already conditioned out.

  **The Distinction Between $E$ and $[E \text{ is Entailed}]$**
  The crucial nuance you identified is the independence of discovery. In the Mercury case, $E$ was discovered *independently* of $H$.
  *   **Proposition 1 ($E$):** The perihelion advances by 43 arcseconds/century.
  *   **Proposition 2 ($L$):** Theory $H$ entails Proposition $E$.

  At time $t=0$ (before Einstein solved the field equations), the agent knew $E$ ($P(E)=1$), but did *not* necessarily know $L$ ($P(L) < 1$). The calculation of Mercury's orbit in GR was non-trivial; it involved solving differential equations that weren't guaranteed to yield the right result.
  Therefore, the "news" Einstein received was not $E$, but $L$.
  This distinction allows us to bypass the problem slightly: we aren't confirming $H$ on $E$; we are confirming $H$ on the *deductive success* $L$. However, standard formulations of POE still challenge how to formalize $L$ within the probability space.

  ---

  ### (iv) Proposed Solutions and Assessment

  There are three primary camps of solutions in the literature. I will outline them and offer my assessment of their viability.

  #### 1. The Garber-Solution (Learning the Entailment)
  Proposed largely by Daniel Garber (1983), this solution accepts that the standard formulation is too narrow. It expands the language of the hypothesis.
  Instead of conditioning on $E$, the agent conditions on the statement "$H$ entails $E$" (denoted as $C_{HE}$).
  Crucially, $P(C_{HE})$ is not 1 at the start. Einstein did not assign probability 1 to the claim "General Relativity solves the Mercury anomaly" until he performed the derivation.
  $$P_{new}(H) = P_{old}(H \mid C_{HE})$$
  Because $C_{HE}$ was a surprising conjunction of mathematical structures previously unknown to connect, this update yields $P(H \mid C_{HE}) > P(H)$.
  *   **Pros:** Technically elegant; remains within standard probabilistic bounds; respects the intuition that the mathematical derivation is the "new" information.
  *   **Cons:** Requires expanding the domain of discourse to include logical/mathematical relations as contingent propositions. It also seems to conflate empirical confirmation with mathematical discovery (since the truth of $C_{HE}$ is necessary, not contingent).

  #### 2. The Counterfactual Solution (Howson & Urbach)
  This approach asks: What would your degree of belief in $H$ be *if you did not yet know* $E$?
  Confirmation is defined as the difference between $P_{actual}(H)$ and $P_{counterfactual}(H)$ (where in the counterfactual world $P(E) < 1$).
  *   **Pros:** Directly aligns with the physicist's intuition that "having known $E$ beforehand helps $H$ survive." It cleanly separates the evidential weight of $E$ from the history of knowledge.
  *   **Cons:** Formally precarious. How can we define a coherent probability distribution for a state of knowledge that we are trying to prove we currently lack? It risks being a useful heuristic rather than a rigorous formal solution.

  #### 3. The Historical/Retrodictive Solution
  Some argue that Bayesian confirmation should simply incorporate the history of testing. If a theory survives a test designed *to find* $E$ (severe test), it confirms $H$. If $E$ was known before, the test wasn't severe.
  *   **Pros:** Captures Popperian severity.
  *   **Cons:** Drastically complicates the Bayesian update rules, requiring tracking of experimental protocols in $K$.

  #### My Assessment
  For a professional accustomed to rigorous modeling, **The Garber-Solution is the most robust.**

  Here is why: As a geophysicist, you understand that "fitting data" involves minimizing residuals. When you run a forward model, you are performing a computation. Until that computation is completed, the outcome is a variable, not a constant. By treating the entailment $H \to E$ as a hypothesis $C_{HE}$ with initial probability less than 1, you acknowledge that the theoretical derivation is a contingent process relative to the agent's cognitive state.

  While $H \to E$ is logically necessary once the math is done, *prior* to doing the math, it is an open possibility that the theory yields a different result or diverges entirely. By conditioning on $C_{HE}$, you capture the genuine boost in credibility that comes from seeing the mathematics work. It avoids the "cheat" of lowering $P(E)$ arbitrarily (which breaks coherence) while acknowledging that the "surprise" value was in the logical connection, not the raw datum.

  ### Closing Thought
  Your hesitation with the expositions you have read likely stems from the tendency of introductory texts to treat $P(E)$ as the sole variable. They ignore that in complex scientific inference, the relevant variable is often $P(\text{Derivation works})$.

  The problem of old evidence is not a flaw in Bayesianism per se, but a limitation of applying the "simple" rule of conditionalization to complex deductive systems. If you adjust the inputs of the update—recognizing that the datum is the successful deduction rather than the datum itself—the algebra resolves, and Einstein's credit is restored.

  I hope this clarifies the structural mechanics. Given your background, you may find the paper *"The Problem of Old Evidence"* by Colin Howson (1991) particularly rewarding, as it critiques the Garber solution with a physicist's skepticism regarding the expansion of the hypothesis space.
