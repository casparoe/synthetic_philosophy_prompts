answer: |-
  This is an excellent question, and your intuition is sharp. In many ways, UDT *does* look like a very careful Bayesian update, and that is exactly why it trips people up. The confusion stems from a subtle category error regarding what exactly is being optimized and *when* the information is processed.

  As a physicist, you appreciate the difference between finding the path of least resistance (variational principles) versus calculating forces at a snapshot in time. Standard Decision Theory tries to calculate the best move given the current state of knowledge. UDT tries to select the best *source code* (algorithm) given the entire environment, including the fact that the algorithm itself exists within that environment.

  Here is the breakdown of what UDT buys you, specifically addressing why simply "conditioning on your own decision" falls short.

  ### 1. The Category Error: Actions vs. Policies
  Your description: *"Condition on 'I'm about to do X' and compute the expected utility."*

  This describes **Evidential Decision Theory (EDT)** or perhaps a naive interpretation of Causal Decision Theory (CDT). Both of these operate in "local time." You find yourself in state $S$, you consider actions $A_1, A_2$, and you pick the one that maximizes $P(\text{Outcome} | S, A)$.

  **UDT operates differently.** It does not ask, "Given I am here now, what should I do?" It asks, **"Which algorithm should I have implemented such that, when run on *any* possible input I might encounter, it generates the highest total expected utility?"**

  In physics terms:
  *   **Standard Decision Theory:** Like shooting a particle through a potential well and calculating the force vector at position $x_t$ to determine acceleration.
  *   **UDT:** Like choosing the Lagrangian of the system such that the resulting trajectory satisfies the boundary conditions globally.

  If you wait until you are inside the decision moment to "condition on your decision," you have lost the ability to manipulate the correlation between your output and the rest of the universe.

  ### 2. The Problem of "Information Sets" (Updating)
  This is the crux of the "Updateless" part. Why is updating bad?

  Consider **Parfit’s Hitchhiker**. You are stranded in a desert. A driver passes by. He predicts whether you will pay him \$100 upon arrival. If he predicts "Pay," he drives you out. If he predicts "Don't Pay," he leaves you to die.

  You arrive in town (alive). Now you are sitting there.
  *   **Standard Bayesian:** "I am already safe. The payoff for driving is done. If I pay him now, I lose \$100 for nothing. Therefore, $E[U(\text{Pay})] < E[U(\text{Not Pay})]$."
  *   **Result:** Rational hedonists refuse to pay.
  *   **Consequence:** Since the predictor was accurate, the rational hedonist never gets into the car in the first place.

  A "careful Bayesian" who conditions on the upcoming decision faces a paradox. At the decision node, they believe the event "Driver left me to die" has probability 0 (because they are alive). Thus, paying provides no evidential value regarding survival. The utility calculation happens *after* the causal chain that determined your fate has finished.

  **UDT Solution:** UDT ignores the fact that "I am currently in town." It considers the whole program. It looks at the set of all possible inputs to this algorithm (including being left in the desert). It calculates:
  *   Algorithm "Pay-if-safe": Gets driver 0% of time. Utility: 0.
  *   Algorithm "Always Pay": Gets driver ~100% of time. Pays \$100 ~100% of time. Net positive utility because arriving home > dying.
  *   **Selection:** UDT selects "Always Pay." It refuses to update on the information that it is currently safe, because updating would lead it to violate a pre-commitment that was necessary to get into the state of being safe.

  So, UDT buys you **time-consistency** and the ability to engage in beneficial trade-offs where you must act irrationally by local standards to ensure success by global standards.

  ### 3. Logical Correlations vs. Physical Causation
  You mentioned: *"Conditioning on your own decision... maximize expected utility."*

  In standard theory, conditioning on your action $A$ means calculating $P(\text{World}|A)$. This assumes $A$ is a distinct variable you can toggle without necessarily changing the history that led to $A$.

  However, UDT posits that **copies of your algorithm exist in logical correlation**, even if causally disconnected.
  *   **Scenario:** Two agents in the universe run the exact same deterministic code.
  *   **Decision:** Agent 1 chooses to Cooperate.
  *   **Standard Theory:** "My action cannot physically affect Agent 2's screen. I should Defect to gain \$1 regardless."
  *   **UDT Logic:** The "state of the universe" includes the computation of Agent 1 and Agent 2. Because they run the same code, the output of Agent 1 is logically identical to the output of Agent 2. There is only one boolean value generated by that function in this context. If the code outputs 1, both output 1. If 0, both output 0.
  *   **The Purchase:** UDT allows the agent to recognize this logical dependency. By deciding "Output 1", it doesn't just send a signal; it forces the *logic* of the parallel universe to Output 1.

  If you simply "condition on doing X" as a local Bayesian, you often miss that the predictor (in Newcomb) or the opponent (in Prisoner's Dilemma) is simulating you. You aren't conditioning on the predictor's belief; you are realizing that **your code IS the predictor's belief engine.**

  ### 4. Mathematical Summary of the Gain
  To put it formally, let $W(y, u)$ be a world-program that takes an agent's utility function $u$ and returns the outcome.
  *   **CDT/EDT:** Select $a^* \in \arg\max_{a} \sum P(w|a, S) U(w)$. (Maximize over actions given current state $S$).
  *   **UDT:** Select $d^* \in \arg\max_{d} \sum P(w) U(W(d))$. (Maximize over decision functions/distributions, marginalizing over inputs).

  What UDT buys you is the ability to solve problems where:
  1.  **Causal influence is absent** (Newcomb), but **predictive correlation exists** via the simulation of the decision-maker.
  2.  **Retrocausal incentives exist** (Hitchhiker), where acting in the "present" negates the benefit secured in the "past."
  3.  **Multi-agent logical dependence** (Prisoner's Dilemma with clones), where you need to recognize that your logic *is* the environment's logic regarding your counterpart.

  ### 5. Revisiting your Intuition
  You asked: *"Condition on 'I'm about to do X' and compute expected utility... isn't that what any careful Bayesian already does?"*

  No, because a careful Bayesian typically conditions on **observations**.
  If you condition on the *decision itself* as an observation ("I see that I am choosing X"), you enter the realm of EDT.
  *   EDT works for Newcomb (it sees a correlation between one-boxing and winning).
  *   EDT fails for the Hitchhiker (you see you are already safe, so paying is useless).
  *   CDT fails for Newcomb (it severs the correlation between the predictor's prior simulation and your current choice).

  UDT works for **both** because it doesn't condition on the decision at all. It conditions on the **algorithm**. It assumes its algorithm determines the decision.

  Think of it as choosing the boundary conditions for a differential equation.
  *   **Bayesian/CDT:** "I am at $x=5$. Which direction should I accelerate?"
  *   **UDT:** "What function $f(t)$ yields the optimal integral of utility over the domain?"

  The "purchase" you get is escaping the **dynamic inconsistency** of the human mind (or any bounded agent) that wants to re-optimize every moment. UDT is the formalization of "committing to a plan before knowing the situation." For a physicist, the closest analogue is choosing a Hamiltonian that ensures stability across the phase space, rather than applying a kick at the bottom of a potential well hoping it lands you where you want to be.

  Does this distinction—between optimizing the *trajectory* (algorithm) vs. optimizing the *instantaneous velocity* (action)—clarify why simply "conditioning on the upcoming decision" misses the point?
