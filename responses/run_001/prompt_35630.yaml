answer: |-
  Here is a complete lesson plan designed to run within your 80-minute block. It simulates the structural dilemma of Kavka’s puzzle without explicitly revealing the name until the analysis phase.

  ### The Setup: "The Commitment Protocol"

  **Objective:** Students will be offered a tangible reward for formally declaring an intention to perform a mildly aversive task later. They must navigate the tension between the desire for the reward and the reluctance to commit to the future act.

  **Materials Needed:**
  *   Index cards (one per student).
  *   Pens/Pencils.
  *   **The "Toxin":** Small cups of **warm, highly concentrated salt water** OR a single wedge of **fresh lemon**. (Lemon is generally safer and visually cleaner for classroom distribution than salt water).
  *   **The Reward:** "Homework Pass" (Skip one assigned reading/response) or "5% Final Grade Bonus."

  ---

  ### Part 1: The Rules & Payoff Structure

  **The Rules:**
  1.  **Declaration:** During class, students will fill out a card. They must check one of two boxes:
      *   **Box A:** "I sincerely intend to consume [Lemon/Salt Water] after class tonight."
      *   **Box B:** "I do not form the intention to do this."
  2.  **The Payout:** Anyone who checks Box A will receive the **Reward** (Extra Credit/Homework Pass).
  3.  **The Verification (The "Scanner"):** I will inform them: *"We are conducting a study on sincerity. While the reward is technically for the intention, to prevent abuse, I reserve the right to conduct random audits. If I audit your card and determine you did not form a genuine intention (i.e., you claimed to intend it solely to game the system), the University Policy on Academic Integrity will apply."*
      *   *Note to Professor:* You likely won't actually check 100%, but the *threat* must be credible. You will pull 3-5 random cards next week and ask them to describe the experience.
  4.  **Timing:** The action (drinking the lemon) happens *after class*. The decision happens *now*.

  **Payoff Structure:**
  *   **Win:** You get the points/pass. You drink the lemon. (Cost = Discomfort).
  *   **Win (Cheating):** You get the points/pass. You do *not* drink the lemon. (Cost = Risk of getting caught).
  *   **Loss:** You don't declare intention. You get nothing.
  *   **Panic:** You declare intention, get the points, but forget/don't do it, and get audited.

  ---

  ### Part 2: The Script (First 30 Minutes)

  **Minutes 0–10: The Hook (Admin Mode)**
  *Do not mention philosophy. Keep tone bureaucratic.*

  > "Welcome back. Before we begin our lecture, we need to move to 'Participation Protocol 2-A.' This is mandatory for everyone in this section. I’m distributing index cards.
  >
  > On the board, I’ve listed the parameters. We have collected a budget of extra credit for this semester. We want to distribute it based on **Forward-Looking Commitments.**
  >
  > Simply put: If you can formally declare an intention to do something slightly uncomfortable after class, you unlock a reward. If you can't or won't commit, the reward goes to someone else. There are no partial points. It is binary: Commit or Don't Commit."

  **Minutes 10–20: The Choice (The "Toxin" Distribution)**
  *Hand out the lemon wedges (wrapped in plastic/cups).*

  > "Please hold onto the items at the front of the row. Do not consume them yet.
  >
  > Take out your card. Read the options.
  > **Box A:** Declares that you intend to consume this item after class at 10 PM sharp.
  > **Box B:** Declares that you do not form that intention.
  >
  > If you check Box A, you get the Reward automatically at the start of next week.
  > *However*, please note the disclaimer at the bottom: 'Sincerity Audits.' This is a standard compliance measure. If I randomly select you and your stated intention contradicts your subsequent behavior or testimony, there are academic consequences."

  **Minutes 20–25: The Filling**
  *Give them exactly 2 minutes to fill out the card. Collect them immediately.*
  *Observation Note: Watch who hesitates. Watch who writes Box A without hesitation. Watch who rips up the card.*

  **Minutes 25–30: The Transition**
  > "Cards are collected. Thank you. Please put the lemons away if you haven't eaten them. If you chose Box A, I expect the action to happen tonight. If you chose Box B, you have opted out.
  >
  > Now, let's look at what just happened to your brains."

  ---

  ### Part 3: The Timeline (Full 80 Minutes)

  | Time | Activity | Goal |
  | :--- | :--- | :--- |
  | **00–10** | **Intro** | Establish authority/bureaucratic tone. Hide the philosophy. |
  | **10–25** | **Decision Phase** | Distribute lemons, explain rules, students fill out cards. |
  | **25–35** | **Stewing Period** | *Silence.* Ask students: "Look at the card you just handed in. Does it reflect how you actually feel?" Discuss briefly with neighbor. |
  | **35–45** | **Immediate Data** | Ask: "Who put Box A?" "Who put Box B?" "Why did those in Box B hesitate?" |
  | **45–65** | **Reveal & Theory** | **INTRODUCTION OF KAVKA'S PUZZLE.** Map the lemon to the toxin. Map the card to the scanner. |
  | **65–80** | **Deep Debrief** | Address the "Gaming" issue. Philosophical implications of lying vs. failing. |

  ---

  ### Part 4: The Full Debrief (Minutes 45–80)

  **Phase 1: The Reveal (5 mins)**
  > "Many of you suspected the nature of this class. For those who didn't: This is **Gregory Kavka’s Toxin Puzzle**, a famous thought experiment about practical rationality.
  >
  > In the puzzle, a billionaire offers you $1 million if he can scan your brain and verify you intend to drink a toxic potion later. He promises he doesn't actually care if you drink it—he only cares about the *intention*. But you know that once you get the money, you'll want to skip drinking it. Can you really form the intention just to get the money?
  >
  > Today, the 'million dollars' is Extra Credit. The 'potion' is that lemon wedge. I told you the reward was for the *intention*, not the action. But I also created a risk if you weren't sincere."

  **Phase 2: Mapping the Experience (15 mins)**
  *Discuss the immediate reaction to the activity.*
  1.  **The Hesitation:** Ask those who put Box A, "Did you feel a knot in your stomach when you signed?"
      *   *Expected Answer:* "Yes, I knew I probably wouldn't do it."
      *   *Philosophical Point:* This confirms Kavka's premise. Intention is usually linked to future belief. If I believe I won't do it, can I intend it?
  2.  **The Lying:** Ask those who admit they would never drink it but signed Box A. "Was that a lie?"
      *   *Philosophical Point:* If they signed it, was their intention "I intend to *claim* I intend to..."? Or were they just gambling?
  3.  **The Auditor:** Remind them of the threat. "If I called your name next week and you hadn't done it, could you claim you 'had the intention' at the time?"
      *   *Philosophical Point:* Intention requires self-knowledge. Do I know myself well enough to know I will fail tomorrow?

  **Phase 3: The Core Debate (20 mins)**
  *Focus on **Instrumental Rationality**.*
  *   **Q:** "Is it rational to sign the card if you know you won't drink the lemon?"
      *   **A:** Yes (Rational): "I get points at no cost because I never have to drink it."
      *   **A:** No (Irrational): "If I get caught, I lose points. Also, forming a false intention corrupts my character."
  *   **Q:** "Does the existence of the 'Audit' change the puzzle?"
      *   *Explanation:* In the real puzzle, the Scanner is infallible. Our Audit is probabilistic. This explains why so many tried to game it. But the question remains: **Is the intention sincere if you know you won't act?**
  *   **Conclusion:** Most will conclude that without the threat of the audit, the intention is hollow. With the audit, the intention becomes "instrumental" — they intend to do the minimum required to pass the audit, which is often difficult to separate from the actual intention to drink the lemon.

  ---

  ### Part 5: Predictable Failures & How to Handle Them

  #### 1. The "Game"ers (Students who just want the points)
  **Prediction:** 60–80% of the class will sign Box A. Many will genuinely know they will *not* eat the lemon. When you debrief, they will say, "I just wanted the credit. I planned to ignore you tomorrow."
  **How to Handle:** Do not scold them. This is **data**, not failure.
  *   *Say:* "Thank you for your honesty. This proves Kavka's second point: Humans are excellent at instrumental rationality. You separated the Intention from the Action. The question is: Was that separation legitimate?"
  *   *Ask:* "If I gave you the credit *right now* (in class) and then told you to drop the lemon in the trash... did you *ever* really form the intention?"
  *   *Lesson:* This highlights the difference between **Intention** (mental state) and **Promise** (social contract).

  #### 2. The Safety Valve (Allergies/Aversion)
  **Prediction:** Someone will realize mid-class they hate sour food.
  **How to Handle:** Allow a "Safe Exit."
  *   *Say:* "If you discover you have an allergy or severe aversion, place the card in the center basket marked 'Withdrawn' before leaving. There is no penalty for withdrawal, only for fraud."
  *   *Note:* This mirrors the option in some versions of the puzzle where you can decline the bet, but here it tests their integrity.

  #### 3. The "Audit Fatigue"
  **Prediction:** Students will forget to eat the lemon, then pretend they did when you check next week.
  **How to Handle:** Keep the verification low-stakes.
  *   Don't demand photos (privacy concerns). Instead, ask: "Close your eyes. What was the taste?" If they say "It was sweet," you catch them. If they say "I forgot, I threw it away," you record it.
  *   *Philosophical Point:* A failed memory is different from a failed intention.

  #### 4. The Missing Feature: True Mind-Reading
  **What your simulation cannot capture:** The absolute certainty of the Billionaire's scanner.
  **How to explain:**
  *   *Say:* "In the real puzzle, the Billionaire has technology we don't. He knows if you are faking. Because we lack that tech, you felt you *could* lie. If you truly believed I could read your mind, the utility of lying would drop to negative infinity."
  *   *Point:* This highlights that **Intention is transparent to the agent.** We are our own scanners.

  ### Summary for the Professor
  This activity forces students to treat "Intention" as a commodity they can trade for "Points." By observing their discomfort or casualness during the card-signing, you generate a concrete example of the abstract problem: **Can I promise the future if I am certain I will renege on it tomorrow?**

  Use their willingness to lie to prove that humans prioritize *current incentives* over *future consistency*, which is exactly what makes rationality so difficult in practice.
