  ### Probability Tree Decomposition

  **(a) P(Grounding is Metaphysically Necessary for Reference)** = **0.75**
  *Justification:* Causal-historical theories of reference imply that a symbol’s link to a referent requires a physical or causal chain, not just a pattern of co-occurrence.

  **(b) P(LLMs Fail to Establish Causal Grounding | Requirement Real)** = **0.90**
