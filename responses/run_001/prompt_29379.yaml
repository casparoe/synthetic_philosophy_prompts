  Subject: Re: The shifting ground of disease classification

  Hi there,

  You have hit on something that sits right at the nerve center of contemporary philosophy of medicine, and while there isn’t one universally agreed-upon buzzword that captures both directions of this drift perfectly, your observation is widely recognized as a critical problem for anyone trying to define disease biologically. You are correct that medicalization is the dominant sociological term for the expansion phase, where normal variations of life are recast as pathological problems requiring management, but as you noticed, that framework often lacks the vocabulary for the retreat or de-medicalization that happens later. Philosophers tend to group these movements under the broader critique of the ontology of disease, specifically the tension between naturalism and normativism.

  When you describe a condition becoming a disease because we gain the ability to treat it, you are describing what philosophers often call the therapeutic imperative or the interventionist account of disease. Critics of biological naturalism, such as Rachel Cooper or Christopher Boorse’s detractors, argue that this proves disease cannot be defined solely by underlying physiological mechanisms because those mechanisms remain static while the disease status flips based on our technological capabilities. This is closely tied to the concept of diagnostic threshold shifting, where the boundary line moves not because the biology changed, but because the cost-benefit analysis of screening or treating shifted. On the flip side, the process where high prevalence leads to reframing a condition as a risk factor or normal variant is often discussed under the header of normalization or depathologization, though philosophers analyze this as a failure of the biostatistical definition of health. For example, Boorse’s theory defines disease as statistically subnormal functioning relative to a reference class, but if almost everyone in a demographic has a certain condition, the definition struggles to explain why it is still considered pathological without invoking moral values about what constitutes a good life.

  There is no single canonical term like the Reverse Medicalization Effect, but in recent years, scholars working in the metaphysics of science have begun to use terms like nosological plasticity or diagnostic pragmatism to describe this fluidity. Some argue that disease concepts function more like tools than mirrors; they are designed for specific purposes, such as prioritizing care, allocating insurance money, or justifying public health policies. When the tool stops being useful—either because we have a better fix or because fixing it is impossible for half the population—we change the label. This bears directly on your question about whether disease concepts are natural or constructed. Your observation provides robust evidence for the anti-realist or constructivist position. If disease status tracks our practical stance rather than a fixed biological essence, then the disease category itself does not exist in nature independent of human interests. This suggests that disease is what some philosophers call a homeostatic property cluster that includes social values, meaning a disease is a bundle of properties including symptoms, but also the availability of treatments and the social agreement that the state is undesirable.

  If I were to propose a name for this specific two-way drift in an academic context, I might call it ontological oscillation or the instrumental variability of disease categories, since it shows that the ontology of the condition wavers depending on what we can do with it. The key takeaway for the philosophical debate is that this pattern makes a purely naturalistic definition of disease extremely difficult to sustain. Naturalists want to say that depression or hypertension are diseases regardless of whether we have drugs for them or how many people have them, but your pattern demonstrates that in practice, the medical community treats these definitions as functional conveniences. Therefore, the consensus among many modern philosophers of medicine is moving toward a middle-ground hybrid, acknowledging that while biology provides the raw material, the category of disease is inevitably value-laden and contingent on our social and technological context. It implies that medicine is not merely discovering pre-existing categories, but actively negotiating them based on the utility of intervening.

  Hope this helps clarify the terminology landscape you are looking for. It is a fascinating area where the messy reality of clinical practice outpaces the clean theories of philosophical definition, and you are essentially summarizing the strongest empirical argument against the idea that diseases are fixed natural kinds.

