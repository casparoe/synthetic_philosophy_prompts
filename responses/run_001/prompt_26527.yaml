answer: |-
  Although your parents' distress is entirely natural, the neurological criterion is the only scientifically and philosophically robust definition of death, meaning your parents' reliance on cardiopulmonary signs is biologically misplaced despite its emotional resonance.

  The traditional circulatory-respiratory criterion identifies death as the permanent stoppage of heartbeat and breathing. This was historically logical because the heart drove all physiological integration, but modern ventilation technology has severed this link. When a machine forces air into the lungs, the heart beats because it contains its own pacemaker, not because the body’s central command system is active. Therefore, keeping a body warm and pulsatile through external machinery does not signify life; it signifies the artificial preservation of a corpse.

  Philosophically, the contemporary argument rests on the concept of the organism as a unified whole. To be alive, a human organism must interact with its environment and regulate itself internally without constant external intervention. The brain, particularly the brainstem, serves as the critical hub for this integration. Without brainstem activity, the body cannot regulate temperature, maintain hormonal balance, or breathe spontaneously. Once these fail irreversibly, the organism ceases to exist as a single entity, even if individual cells remain metabolically active for a short time. Your parents are operating on a vitalist intuition—that the presence of warmth and motion implies a living soul or biological essence—whereas modern medicine views life as a functional capacity that has been permanently extinguished.

  I am highly confident in this assessment based on current medical consensus in the UK and major Western jurisdictions, where whole-brain death is legally equivalent to death. However, the confidence is tempered by the recognition that death is partly a social construct. Society draws a line where biology offers a spectrum of decline. The philosophical weakness in the neurological criterion, known as the "integrative function" problem, argues that some biological functions (like gestation in pregnant women or wound healing) can persist without a brain. Critics suggest this challenges the idea that brain death equals total systemic integration. Nevertheless, given the absence of intracranial blood flow and bilateral EEG flatlines, the prognosis is final.

  You should trust the medical team’s assessment that your sister is deceased. The ventilator is sustaining a shell, not a person. While you cannot force your parents to understand this immediately, attempting to keep her on the ventilator indefinitely would likely violate ethical norms regarding dignity and resource allocation without offering any benefit to the patient herself.
