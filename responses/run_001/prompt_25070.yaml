  Let's assemble the sheet.

  *Final check on the "Question hoping nobody asks":* Needs to be something that implies the whole framework is confused. Perhaps asking about material implication comparisons or demanding a specific logic derivation. "If they aren't propositions, what is the object of belief?" This questions the fundamental cognitive stance.

  Let's refine the Concessions. Where should I give ground? On the idea that *all* embedding is pragmatic. Some structural role for syntax likely exists. Also, acknowledging that the restrictor view explains some phenomena the Equation misses, but the Equation explains the core probabilistic intuition which restrictors often struggle with without ad-hoc fixes.

