prompt: |-
  I'm taking a history of physics seminar and we just spent a week on the Scholium to Newton's Principia, and I keep going back and forth on what the bucket passage is actually supposed to establish. Here's the passage (Motte's 1846 translation):

  "If a vessel, hung by a long cord, is so often turned about that the cord is strongly twisted, then filled with water, and held at rest together with the water; after, by the sudden action of another force, it is whirled about the contrary way, and while the cord is untwisting itself, the vessel continues for some time in this motion; the surface of the water will at first be plain, as before the vessel began to move: but the vessel, by gradually communicating its motion to the water, will make it begin sensibly to revolve, and recede by little and little from the middle, and ascend to the sides of the vessel, forming itself into a concave figure (as I have experienced), and the swifter the motion becomes, the higher will the water rise, till at last, performing its revolutions in the same times with the vessel, it becomes relatively at rest in it. This ascent of the water shows its endeavour to recede from the axis of its motion; and the true and absolute circular motion of the water, which is here directly contrary to the relative, discovers itself, and may be measured by this endeavour. At first, when the relative motion of the water in the vessel was greatest, it produced no endeavour to recede from the axis; the water showed no tendency to the circumference, nor any ascent towards the sides of the vessel, but remained of a plain surface, and therefore its true circular motion had not yet begun. But afterwards, when the relative motion of the water had decreased, the ascent thereof towards the sides of the vessel proved its endeavour to recede from the axis; and this endeavour showed the real circular motion of the water perpetually increasing, till it had acquired its greatest quantity, when the water rested relatively in the vessel. And therefore this endeavour does not depend upon any translation of the water in respect of the ambient bodies, nor can true circular motion be defined by such translation."

  So I follow the basic observation: at the start the bucket is spinning but the water isn't, and the surface stays flat even though the relative motion between the water and the bucket is as large as it will ever get. Later the water catches up and is at rest relative to the bucket, but now the surface is concave. So Newton says the concavity can't be explained by motion relative to the bucket. But then he takes a much bigger step: he says the endeavour "does not depend upon any translation of the water in respect of the ambient bodies," so true circular motion can't be defined by that kind of translation at all.

  That jump is what I can't make sense of. It seems like one thing to say the bucket is the wrong reference body, and quite another to say no ambient bodies will do. In the experiment the water is rotating relative to the surrounding stars exactly when the surface is concave, and flat exactly when it isn't — so why can't a relationist just say the concavity tracks rotation relative to the rest of the universe, or relative to the stars? Is Newton assuming something in that last sentance that he hasn't argued for in the passage, and what would he need to add to actually rule that response out? Also, I'd like help with the phrase "true and absolute circular motion of the water, which is here directly contrary to the relative" — contrary to which relative motion exactly, and why does he describe it as directly contrary?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** History of Physics seminar, recently studied Newton's Scholium (specifically the Bucket Argument).
      *   **Core Confusion:** The user understands the empirical setup (flat surface $\rightarrow$ relative motion max/absolute motion zero; concave surface $\rightarrow$ relative motion zero/absolute motion max). They understand Newton's rejection of the bucket as the reference frame.
      *   **Specific Problem:** The leap from "bucket isn't the reference" to "*no* ambient bodies are the reference." The user identifies the relationist counter-argument: rotation relative to the fixed stars explains the concavity. They ask: What justifies Newton's jump to absolute space? What argument is missing or assumed?
      *   **Secondary Question:** Clarification on the phrase "true and absolute circular motion... directly contrary to the relative." Which relative motion? Why "contrary"?

  2.  **Deconstruct the Bucket Argument:**
      *   *Stage 1:* Bucket spins, water still. $v_{water/bucket}$ is high. $F_{centripetal}$ (inertial force) is zero. Surface flat. Conclusion: Motion relative to bucket doesn't cause effects.
      *   *Stage 2:* Water spins with bucket. $v_{water/bucket}$ is zero. $F_{centripetal}$ is high. Surface concave. Conclusion: Motion relative to bucket is *not* the cause.
      *   *Stage 3 (The Jump):* Newton claims this proves motion is not defined by "translation in respect of ambient bodies." He implies there must be an absolute standard.
      *   *The Relationist Gap:* As the user notes, why not say it's motion relative to the Fixed Stars (Mach's point later)? Newton needs to close this loop within the text.

  3.  **Address the "Leap" (Ambient Bodies vs. Absolute Space):**
      *   *Why does Newton say "ambient bodies" generally?* In the 17th century context, "ambient bodies" meant immediate surroundings (air, bucket, nearby vessels). The Fixed Stars were often considered part of the "sphere of the heavens," potentially distinct from terrestrial ambient bodies. However, in modern reading (and Mach's critique), the stars count as ambient bodies.
      *   *Newton's Actual Argument Strategy:* He isn't just doing one experiment. He's setting up a definition of *Force*.
          *   Key Insight: Circular motion generates forces (conatus). Forces are real physical quantities that cause effects (surface deformation).
          *   If motion were purely relational (between A and B), then either A is moving around B or B around A. In both cases, the relative velocity is the same.
          *   However, the *force* exists only in one case. If motion were merely relative, there would be no physical distinction between the state of the water when flat and when concave (since relative velocity can be the same if we swap frames).
          *   *Wait, the user's specific point:* Why not stars? Newton addresses this implicitly by distinguishing between *apparent* motion (relative) and *true* motion (caused by forces).
          *   *Crucial Textual Evidence:* Look at the sentence structure: "does not depend upon any translation... in respect of the ambient bodies."
          *   *Better Explanation:* It's about the *source* of the force. Relationalism makes forces mysterious. If the universe rotates around me, why do I feel centrifugal force?
          *   *What's missing for a rigorous proof?* To truly rule out the stars, you'd need to show a difference in effects if the local environment rotated but the stars didn't, vs. stars rotating but local environment didn't. Newton assumes the effects (concavity) arise from interaction with the container of space itself, not other matter.
          *   *Scholarly Consensus:* Scholars like Stein, Huggett, and Rynasiewicz argue the bucket argument *alone* doesn't logically compel absolute space without extra assumptions. It relies on the causal efficacy of inertial forces being tied to a specific background.
      *   *Key Point to convey:* Newton believes "True Motion" is that which corresponds to the generation of inertial forces. Since forces don't change based on who you compare yourself to (you feel dizzy spinning even if you claim the world is spinning), the reference body must be something that doesn't move relative to the force-generating property. That is "Absolute Space."

  4.  **Address the Phrase "Directly Contrary":**
      *   *Text:* "...the true and absolute circular motion of the water, which is here directly contrary to the relative..."
      *   *Context:* Stage 2 (Water and Bucket rotate together, surface concave).
      *   *Relative Motion:* The water has *zero* relative motion with respect to the bucket (they are at rest w.r.t each other).
      *   *Absolute Motion:* The water has *maximum* absolute motion (it is spinning in space).
      *   *Contrariety:* When relative motion was maximum (start), absolute motion was zero. When relative motion was minimum (end), absolute motion was maximum. They vary inversely. In the second stage specifically, the relative motion is null, yet absolute motion is present. Hence they are opposed/contrary states. One signifies rest (relatively), the other signifies motion (absolutely).

  5.  **Synthesize and Structure the Answer:**
      *   **Introduction:** Validate the user's intuition. Yes, the leap is famous and debated. It's not as logical a slam-dunk as Newton suggests.
      *   **Part 1: The "Leap" regarding Ambient Bodies.**
          *   Explain Newton's concept of Force/Causation. The concavity is a dynamical effect, not just a kinematic description.
          *   Explain the problem of Frame Switching. If motion is just relation A-B, and B is the universe, why do forces appear? (Pseudo-forces).
          *   Address the "Fixed Stars" objection explicitly (this is what Mach later did). Explain that Newton treats the stars as potentially moving themselves. For him, "ambient bodies" includes anything material.
          *   Clarify what Newton needs to add (a thought experiment where you remove the stars but keep space, or vice versa). Acknowledge scholars like Stein who say Newton fails to prove this strictly in the Scholium alone; it requires his laws of motion (Law 1 & 2) to define inertia.
      *   **Part 2: "Contrary to the Relative".**
          *   Break down the two stages of the experiment again (Start vs. Equilibrium).
          *   Show the inverse relationship. Max Relative = Min Absolute; Min Relative = Max Absolute.
          *   Explain why he calls it "contrary": Because one condition denies what the other affirms.
      *   **Conclusion/Study Tip:** Suggest looking at how Einstein/Mach responded to this, as it contextualizes why the "leap" felt controversial even then.

  6.  **Refine the Tone:**
      *   Academic but accessible.
      *   Respectful of the seminar context (don't dumb it down too much, but clarify the historiography).
      *   Use precise terminology (kinematics vs. dynamics, relational vs. absolute).

  7.  **Self-Correction/Nuance Check:**
      *   *Correction:* Make sure not to imply Newton *definitely* proved absolute space. Historians argue he argued *for* it, but the logic is imperfect. Ensure I represent the scholarly debate (Huggett/Earman/Rynasiewicz).
      *   *Clarification on "Ambient Bodies":* In the 18th century sense, this usually meant immediate contact neighbors. But the philosophical implication covers all matter. I should mention Mach specifically because that's the classic counter-argument regarding the stars.
      *   *Check the quote:* "contrary to the relative." In the final stage, relative motion is zero. So saying the motions are "contrary" implies that the *state* of relative rest contradicts the *state* of absolute motion.

  8.  **Final Polish:** Organize into clear sections with headers for readability. Ensure the answer directly responds to the "what would he need to add" question. (He would need to show that the effects persist even without distant matter, or that the effects vanish if distant matter rotates with the vessel—though he doesn't have these examples).

  *(Self-Correction during drafting)*: Wait, does "contrary" mean opposite directions? No, it means mutually exclusive states in terms of magnitude/presence. When one is active, the other is dormant. Actually, it refers to the fact that the *signs* of motion (effect vs observation) oppose each other. I will explain it as an inverse correlation that culminates in opposition of state.

  Let's draft the response based on this plan.cw
answer: |-
  This is an excellent question that touches on the central crux of the debate between substantivalism (space exists independently) and relationalism (motion is only defined between objects). You have correctly identified that the most contentious part of Newton’s argument is not the experimental data, but the philosophical inference he draws from it.

  Many historians of physics (including Howard Stein, John Earman, and Nick Huggett) agree with you: Newton’s text does not logically force the reader to accept absolute space over a relationist view involving the fixed stars *without* additional premises.

  Here is a breakdown to help you navigate that "jump" and the specific phrasing regarding the "contrary" motions.

  ### 1. The Leap: From "Bucket" to "No Ambient Bodies"

  Your intuition is correct: Newton observes that the water’s surface reacts to motion *independent of the bucket*, but then generalizes this to exclude *all* material bodies.

  **What allows him to make this leap?**
  Newton is relying on his Laws of Motion, particularly the Second Law ($F=ma$), rather than pure kinematics.
  *   **Forces are Real:** For Newton, the concavity of the water is caused by *forces* (specifically, the tendency of the water to recede from the axis). These are real physical entities, not optical illusions.
  *   **The Causal Link:** True motion is that which produces force; apparent (relative) motion does not necessarily produce force.
  *   **The Logical Impasse:** If motion were purely relational, then every object could claim the others are moving around it. If I stand still and you run around me, or you stand still and I run around you, the *relative* velocity is identical. However, only one of us feels the centrifugal tendency (inertia). If motion were only a relation, the physical world would have to distinguish which of us is "really" moving to generate the force. Since matter cannot distinguish which way it is moving relative to another piece of matter without referencing an external standard, there must be a standard that is **not matter**.

  **Why does he rule out the Fixed Stars?**
  In the 17th century, "ambient bodies" generally referred to things physically adjacent or contiguous (the air, the floor, the bucket). However, your question anticipates the great objection raised centuries later by Ernst Mach (Mach's Principle): *Perhaps the water rises because it is rotating relative to the mass of the fixed stars.*

  Newton anticipates a version of this. By saying "translation in respect of the ambient bodies," he argues that since the bucket's rotation relative to the room (ambient bodies) changes while the force remains constant (once steady-state is reached), the room cannot be the reference. He extends this to *any* collection of bodies because:
  1.  **Indistinguishability:** If the universe rotated around a stationary Earth, the stars would be in motion relative to us. Yet, there is no force observed acting on the stars to drag them into orbit around the Earth. Conversely, if we spin locally, we feel the force. The effect distinguishes "rotation" from "revolution," even if the kinematics look similar.
  2.  **The Nature of Space:** For Newton, space is the arena in which bodies act. If "true motion" required other bodies, then empty space would allow no motion. But Newton believes God created space as a sensorium of sorts—a fixed grid against which acceleration (which creates force) is measured.

  **What would he need to add to truly rule out the Relationist?**
  To scientifically defeat the "Stars" objection, Newton would need to demonstrate a scenario where the relationship with ambient matter is removed.
  *   **The Missing Experiment:** He never actually tests whether the water behaves differently if the entire bucket-and-water system were placed in a void devoid of stars.
  *   **Modern Counter-Argument:** Later, Mach argued that if the bucket spun in a universe with *no* stars, there would be no centrifugal force (the surface would stay flat). If that were true, Newton's argument for absolute space would fail. We now know we can't test this empirically.
  *   **The Philosophical Assumption:** What Newton *assumes* but doesn't prove is that **inertial forces are properties of space**, not properties of matter. If you assume that $F_{inertial} = 0$ unless referenced to Absolute Space, then the argument holds. If you assume $F_{inertial}$ depends on the distribution of mass in the universe, the argument collapses.

  So, when you ask *"Is Newton assuming something... that he hasn't argued for?"*: **Yes.** He assumes that inertial effects require an ontological backdrop (Space) distinct from material bodies. He offers the experiment as evidence *for* this assumption, but the experiment itself only rules out *immediate* surrounding bodies (like the bucket), not distant matter (stars).

  ### 2. Decoding "Directly Contrary"

  You asked: *"Which relative motion exactly, and why does he describe it as directly contrary?"*

  This phrase appears in the conclusion of the experiment, describing the state where the water and bucket are rotating together at the same speed.

  **The Context:**
  *   **Stage 1 (Start):** Bucket spins fast, water stands still.
      *   **Relative Motion:** Maximum (High velocity of bucket vs water).
      *   **True/Absolute Motion:** Zero (Water is not moving in absolute space).
      *   **Surface:** Flat.
  *   **Stage 2 (End):** Bucket spins fast, water spins with it.
      *   **Relative Motion:** Zero (Water and bucket are at rest relative to each other).
      *   **True/Absolute Motion:** Maximum (Water is spinning rapidly in absolute space).
      *   **Surface:** Concave.

  **Why "Directly Contrary"?**
  Newton uses "contrary" here to describe the **inverse correlation** between relative velocity and absolute velocity in this specific experiment, culminating in a contradiction of states.

  1.  **Inverse Magnitude:** As the relative motion decreases (from Stage 1 to Stage 2), the absolute motion increases. They trade places.
  2.  **Mutually Exclusive States:** At the moment of greatest absolute motion (Stage 2), the relative motion is non-existent (Zero). Therefore, the "True Motion" of the water is happening precisely when the "Relative Motion" says the water is at rest.
  3.  **The Definition Conflict:** If motion were defined purely relatively, the water in Stage 2 should be considered "at rest" because it moves nowhere relative to the bucket. However, the physical reality (concavity) screams that it is in motion. Thus, the *definition* implied by the relative perspective contradicts (*is contrary to*) the *reality* of the absolute perspective.

  Newton writes: *"the true and absolute circular motion of the water, which is here directly contrary to the relative."*
  He means: **The fact that the water is truly moving is in direct conflict with the fact that its relative motion to the bucket indicates rest.**

  ### Summary for Your Seminar Discussion

  If you want to impress your seminar group, you can frame your confusion productively:

  1.  **Acknowledge the Ambiguity:** "I follow the mechanics, but Newton seems to commit the fallacy of composition. He moves from 'it doesn't move relative to the bucket' to 'it doesn't move relative to any matter,' including stars."
  2.  **Identify the Hidden Premise:** "It seems Newton assumes that inertial forces (the concavity) are unique indicators of Absolute Space, whereas a Relationist like Leibniz (or later Mach) would argue those forces indicate acceleration relative to the bulk mass of the universe."
  3.  **Clarify the 'Contrary':** "The phrase 'directly contrary' highlights the paradox: at the end of the experiment, the water is most vigorously moving (absolutely) but most completely still (relatively)."

  This passage is not just physics; it is metaphysics in disguise. Newton is trying to secure a foundation for his laws of motion (where $F=ma$ requires an acceleration that cannot be relative) by proving that space exists as a "thing" separate from matter. The bucket is his best attempt at empirical evidence for that metaphysical claim, but—as you've noticed—it relies on an interpretive leap.
