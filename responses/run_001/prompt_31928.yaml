prompt: |-
  I am a novelist at work on a book whose protagonist exists, in recognizably different forms, across several mutually incompatible timelines, and I have found that the language of possible worlds is doing real work in my planning rather than merely decorating it. I want to understand the metaphysics well enough that the book's internal logic is coherent, and I would be grateful for an exact, in-the-weeds explanation of the difference between transworld identity and counterpart theory.

  Please address the following, in order:

  1. State precisely what each view claims. What does a transworld-identity theorist mean by saying that one and the same individual exists in many possible worlds, and what does the counterpart theorist mean by saying that individuals are world-bound and are represented at other worlds by counterparts? I want the semantics of de re modal statements made explicit: how does each view analyze a sentence such as 'in another timeline she is a surgeon' or 'she could have chosen otherwise'?

  2. Lay out the main arguments that motivate counterpart theory over transworld identity, especially the problem of accidental intrinsics and whatever pressure it puts on the idea that a single object can bear incompatible intrinsic properties in different worlds. Explain how the transworld-identity theorist can resist these arguments, and what the resistance costs.

  3. Lay out the main objections to counterpart theory, in particular the complaint that when we say a particular person might have won an election we are talking about that very person and not about some distinct individual who merely resembles her. Explain the standard counterpart-theoretic replies, and say plainly whether those replies preserve or quietly revise the intuitive meaning of 'could have been'.

  4. Identify the places where the two views genuinely diverge: the status of essential and accidental properties, the question whether the relation that pairs an individual with its otherworldly representatives is an equivalence relation, the role of context and similarity in selecting counterparts, and whether identity across worlds is something stipulated or something discovered.

  5. Distinguish counterpart theory itself from realism about possible worlds. I would like to know whether counterpart theory can be accepted by someone who takes worlds to be abstract representations, or whether it only makes sense alongside a fully realist picture of worlds.

  6. Close with an assessment aimed at my actual problem: which of these two pictures, if either, better fits the way a novelist treats a character as one and the same individual across retellings, divergent drafts, and parallel-universe plots, and what would a novelist have to surrender to use either picture with rigor rather than as metaphor?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist working on a book with a protagonist existing in incompatible timelines.
      *   **Goal:** Understand the metaphysics of "possible worlds" (specifically Transworld Identity vs. Counterpart Theory) to ensure internal logical coherence in the fiction.
      *   **Tone/Style:** Exact, in-the-weeds explanation, philosophical rigor but applied to creative work.
      *   **Structure:** Six specific points to address in order.
          1.  Precise definitions + semantics of *de re* modal statements.
          2.  Arguments for Counterpart Theory (CT) over Transworld Identity (TWI), specifically accidental intrinsics; TWI resistance/costs.
          3.  Objections to CT (intuitive meaning of identity); CT replies; revisionism assessment.
          4.  Points of genuine divergence (essential/accidental properties, equivalence relation, context/similarity, stipulation/discovery).
          5.  Distinguish CT from Modal Realism (Lewisian realism vs. abstractism).
          6.  Application to the novelist's problem (which fits better? what is surrendered?).

  2.  **Deconstruct Point 1: Definitions & Semantics:**
      *   *Transworld Identity (TWI):* Rooted in Kripke/Stalnaker (though Kripke is nuanced). One individual $a$ exists in multiple possible worlds $w_1, w_2$. $a$ in $w_1$ is strictly identical to $a$ in $w_2$.
      *   *Counterpart Theory (CT):* Rooted in David Lewis. Individuals are world-bound. No object exists in more than one world. A statement about $a$ in another world is actually about a counterpart $c$ in that world who resembles $a$.
      *   *Semantics:* "In another timeline she is a surgeon."
          *   TWI: $\exists w (Surgeon(a, w))$. $a$ is the same entity.
          *   CT: $\exists w \exists c (Counterpart(c, a, w) \land Surgeon(c, w))$.
      *   *Nuance:* Need to make sure the distinction between *rigid designation* (Kripke) and counterpart relations is clear.

  3.  **Deconstruct Point 2: Motivation for CT (Accidental Intrinsics):**
      *   *The Problem:* How can an object have property $P$ in $w_1$ and not-$P$ in $w_2$ without contradicting the Law of Non-Contradiction (if it's the *same* object)?
      *   *Lewis's Argument:* If $a$ is in $w_1$ and $w_2$, and $a$ is bent in $w_1$ and straight in $w_2$, does $a$ have contradictory properties? TWI says yes, unless we relativize properties to worlds (temporal analogy). But Lewis thinks this is messy. CT solves it by saying different objects have different properties.
      *   *TWI Resistance:* Endurantists/Perdurantists debate. TWI advocates say we just predicate properties relative to worlds ($F(a)$ at $w$). It requires distinguishing between *having* a property and *being* an object. The cost is treating worlds as locations or indices rather than things containing parts.
      *   *Key Terminology:* "Haeccetism," "haecceities" (thisness), "transworld haecceity."

  4.  **Deconstruct Point 3: Objections to CT:**
      *   *The Main Complaint:* I could have won. That means *me*, not a guy who looks like me. CT seems to change the subject. (Plantinga/Searle objection).
      *   *CT Reply:* We don't mean literal identity; we mean closest similarity. Language is vague.
      *   *Revisionism:* Does CT revise meaning? Yes, slightly. It replaces strict identity with qualitative similarity. Is this acceptable? Philosophers disagree. For a novelist, this is crucial.

  5.  **Deconstruct Point 4: Genuine Divergences:**
      *   *Essential/Accidental:* TWI = Essentialism via origin/identity. CT = Essentialism via counterpart relations (what counts as a "good" counterpart).
      *   *Equivalence Relation:* Identity is transitive. Counterpart relations are usually *not* transitive (A is counterpart of B, B of C, but A might not be good enough for C). This leads to branching.
      *   *Context/Similarity:* CT relies heavily on conversational context to determine which similarities matter. TWI relies on rigid designation.
      *   *Stipulation vs. Discovery:* TWI assumes identity facts are fixed (discovered). CT implies they depend on interests/context (stipulated selection criteria).

  6.  **Deconstruct Point 5: CT vs. Modal Realism:**
      *   *Modal Realism:* All possible worlds exist concretely (Lewis).
      *   *Abstractism:* Worlds are sets of sentences/propositions/states of affairs (Plantinga/Kripke/Sorenson).
      *   *Can CT pair with Abstractism?* Yes. One can hold that worlds are abstract but individuals are world-bound and represented by counterparts. However, Lewis developed CT *for* his realist framework because he thought abstraction led to problems with representation. But technically, CT is a theory of *reference*, while Realism is a theory of *ontology*. They are separable, though often paired.

  7.  **Deconstruct Point 6: Application to Novelist:**
      *   *Which fits?* Literary intuition leans TWI. Readers want to know if *it was her*. CT feels cold/detached ("It wasn't really her, just someone like her").
      *   *For Rigor:* If using TWI, must define transworld persistence conditions (What makes her *her* across worlds? DNA? Soul? Narrative arc?). If using CT, must define similarity metrics (When do we stop seeing them as counterparts?).
      *   *Surrender:* TWI surrenders logical simplicity (contradiction problems). CT surrenders reader empathy/intuition (it wasn't truly her).
      *   *Recommendation:* TWI is likely better for fiction, but needs careful handling of "origin stories" (Kripkean essentialism).

  8.  **Review and Refine:**
      *   *Check Tone:* Ensure it's rigorous but accessible to a writer who knows philosophy terms ("de re", "metaphysics"). Don't dumb it down too much, but keep it functional.
      *   *Check Constraints:* Did I answer all 6 points in order? Yes.
      *   *Accuracy Check:*
          *   Make sure to distinguish Kripke's view (Rigid Designators) from standard TWI. Kripke actually denies possible worlds are real things, but treats reference as rigid. Lewis uses CT *because* he accepts concrete worlds.
          *   Clarify that "Counterpart Theory" is specifically Lewis's system, though the idea generalizes.
          *   Ensure the distinction between "Identity" and "Similarity" in Point 3 is sharp.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Point 2:* Be careful with the "Accidental Intrinsics" argument. It's specifically about how an object cannot be both bent and straight. Lewis argues you can't predicate these directly to the world-bound object. You need to relativize.
      *   *Self-Correction on Point 5:* Can a fictionalist use CT? Yes. But the user asked about "Abstract representations" (Actualism). Counterpart theory works well there to solve the "many worlds of actualism" issue without claiming existence.
      *   *Focus on Novelty:* In fiction, "timelines" are often treated as separate causal histories. This aligns well with Lewis's disconnected worlds, making CT easier to map technically, even if emotionally TWI is preferred.

  10. **Final Polish:** Check formatting for clarity (bolding, lists). Ensure the conclusion ties back to the specific writing challenge (retellings/divergent drafts).

  *(Self-Correction during drafting point 1)*: I need to be precise about "semantics of de re modal statements".
  TWI: $M\phi(a)$ is true iff in some world $w$, $\phi(a^w)$ holds where $a^w$ is $a$.
  CT: $M\phi(a)$ is true iff in some world $w$, there is a $c$ such that $C(c,a,w)$ and $\phi(c)$ holds.
  Okay, that's the technical core. I will write that out clearly.

  *(Self-Correction during drafting point 6)*: The prompt asks about "divergent drafts". This implies the author changes the story. Metaphysically, this is a meta-level issue. But within the story logic, it's about whether the character persists through narrative changes. I should focus on the in-universe logic.

