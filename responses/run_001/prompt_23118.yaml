              3.  Searle Comparison: Major error. Searle is an individualist, not a plural-subject realist. Searle's we-intention is inside the head.
              4.  Advantage: Correct (normative constraint/right to rebuke).

      *   Wait, I should check the "Individual intention to do her part" regarding Searle. Searle *does* require agents to intend to do their part *in the context* of the we-intention, but he forbids analyzing the we-intention *into* those parts. The student says "together with an individual intention to do her part." This sounds like Bratman (shared intentions based on meshing subplans). Searle thinks the we-intention is primitive. The student conflates Bratman and Searle slightly here too. I'll focus on the Ontology first as it's the bigger contrast.

