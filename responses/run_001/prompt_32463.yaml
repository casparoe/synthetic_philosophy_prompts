answer: |-
  # Decision Tree: The Logical Space of Standing to Blame

  Below is a mapping of the logical possibilities concerning moral standing. The tree begins with the sufficiency of moral judgment and branches through the grounds of potential defeat. Each terminal node represents a distinct theoretical position found (or potentially defensible) within the literature.

  ```text
  ROOT QUESTION: 
  Is a correct moral judgment of wrongdoing SUFFICIENT for standing to blame?

  ├── NO (Correct judgment alone guarantees standing)
  │   │
  │   └── [UNIVERSALISM]
  │       "The Right to Criticize"
  │       - *Commitment:* Any agent can blame any wrongdoer anywhere, provided they judge correctly.
  │       - *Awkward Commitment:* Grants strangers/enemies equal normative authority over intimate moral repair, potentially licensing harassment under the guise of virtue.
  │
  └── YES (Facts about the blamer can DEFEAT standing)
      │
      ├── GROUND OF DEFEAT: THE BLAMER'S MORAL RECORD (Agent-Centric)
      │   │
      │   ├── ONLY HYPOCRISY (Past similar wrongs defeat standing)
      │   │   ├── [HYPOCRISY ACCOUNT]
      │   │   - *Commitment:* Standing requires moral consistency; past failures invalidate present claims.
      │   │   - *Awkward Commitment:* Allows a non-participant who committed prior, unrelated sins (e.g., theft) to stand idle while judging an accomplice in murder.
      │   │
      │   ├── ONLY COMPLICITY (Direct involvement in THIS wrong defeats standing)
      │   │   ├── [COMPLICITY ACCOUNT] (Rare/Controversial)
      │   │   - *Commitment:* Only those implicated in the specific event lose standing; past general immorality is irrelevant.
      │   │   - *Awkward Commitment:* Suggests a serial fraudster has full standing to blame a first-time embezzler, while an accomplice to the current fraud does not.
      │   │
      │   └── BOTH (Hypocrisy AND Complicity defeat standing)
      │       ├── [CLEAN HANDS VIEW] (aka "Moral Perfectionism")
      │       - *Commitment:* To blame, one must be exempt from the charge both generally and specifically.
      │       - *Awkward Commitment:* Renders standing to blame nearly impossible for imperfect humans, silencing all moral education among peers.
      │
      └── GROUND OF DEFEAT: RELATIONAL FACTORS (Relation-Centric)
          │
          ├── RELATION TO VICTIM
          │   └── [VICTIM-CENTERED VIEW]
          │   - *Commitment:* Only those directly harmed or intimately linked to the harmed party have standing.
          │   - *Awkward Commitment:* Excludes third-party witnesses and society from condemning atrocities against marginalized victims (the "Silence of Bystanders" problem).
          │
          ├── RELATION TO COMMUNITY
          │   └── [COMMUNAL VIEW] (aka "Social Practice View")
          │   - *Commitment:* Standing derives from membership in the shared normative community governed by the rule violated.
          │   - *Awkward Commitment:* Prevents outsiders from critiquing unjust cultural practices and allows communities to shield members from external accountability.
          │
          └── RELATION TO WRONGDOER
              └── [INTIMACY/AUTHORITY VIEW]
              - *Commitment:* Standing requires a specific hierarchical or intimate tie granting authority over the wrongdoer.
              - *Awkward Commitment:* Reduces universal moral demands to private obligations, denying strangers standing to intervene in domestic disputes.
  ```

  ---

  ### I. Structural Flags: Unseparated Distinctions

  While this tree separates positions based on *what* determines standing, several leaves conceal deeper metaphysical disagreements. Your students should note that the tree cannot distinguish between:

  1.  **Why Hypocrisy Defeats Standing:** The **Hypocrisy Account** leaf conflates three competing explanations for *why* the hypocrite loses standing:
      *   *Fairness/Equality:* It is unfair to condemn what one excuses oneself from doing.
      *   *Epistemic/Warrant:* One loses the right to demand others acknowledge a norm one denies by practice.
      *   *Self-Undermining:* The act of blaming reveals a failure in the blamer’s own commitment to the norm.
  2.  **Complicity vs. Hypocrisy Conflation:** Many prominent theorists (e.g., Michael Zimmerman, some readings of Strawson) treat complicity merely as a *subset* of hypocrisy. The tree treats them as separable variables, but in literature, arguments for hypocrisical defeat often implicitly rely on complicity-style reasoning (impairment of moral relations).
  3.  **Individual vs. Systemic Complicity:** Within the **Clean Hands View**, there is no distinction between personal participation and benefiting from systemic injustice. A strict reading might imply the latter grants standing, while most critics argue the former does not.

  ### II. Logically Possible but Unoccupied Combinations

  The following logical paths exist within the schema above but are rarely defended in print. Students should consider why these positions are weak or problematic:

  | Combination | Description | Diagnosis |
  | :--- | :--- | :--- |
  | **Complicity Only** | Past hypocrisy does NOT defeat standing; only direct involvement does. | **Merely Unattractive.** It creates a bizarre asymmetry: the unrepentant sinner (hypocrite) has better standing than the active partner-in-crime. This violates the intuition that the hypocrite's integrity is already compromised. |
  | **Wrongdoer Relation** | Standing exists ONLY toward those you have a special relationship with. | **Incoherent for Universal Morality.** If taken seriously, this denies the existence of "stranger duty." It collapses the distinction between *blame* and *admonishment*, making general moral criticism conceptually impossible. |
  | **Victim + Community Hybrid** | You must be either the victim OR a community member, but neither alone suffices if the other is missing. | **Unexplored.** It creates an arbitrary boundary around who gets to protect the community's norms without requiring them to care for the individual victim. |
  | **Pure Record (No Relation)** | Standing depends entirely on character history, regardless of who is blamed. | **Logically Odd.** It treats blame as a function of the blamer's resume rather than the wrongdoer's action or context, turning blame into self-affirmation. |

  ### III. Teaching Note: Strategic Ambiguities

  When using this handout, point out that **"Universalism"** and **"Communal View"** sit at opposite extremes of social scope. However, they share a surprising vulnerability: they both struggle to explain the **standing of reformers**.

  *   If I am a racist reformed leader (Communal View): Do I have standing? (Maybe not, if the community rejects me).
  *   If I am a stranger witnessing injustice (Universalism): Do I have standing? (Yes, but my intervention may be epistemically rude or patronizing).

  This highlights why most contemporary work focuses on the middle ground (**Victim-Centered** or **Moderate Hypocrisy**), attempting to preserve universal concern while acknowledging the cost of the blamer's own history.
