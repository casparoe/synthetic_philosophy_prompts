answer: |-
  This is an excellent diagnostic of the central fracture line in contemporary welfare hedonism. You have accurately identified why many analytic philosophers moved away from classical hedonism in the 20th century.

  ### The Established Name
  The technical term for your primary difficulty is **the Heterogeneity of Pleasure**.

  In older literature (e.g., C.D. Broad, Henry Sidgwick), it was often discussed as the problem of **The Unity of Pleasure**. In contemporary meta-ethics, especially following the work of Fred Feldman (*Pleasure and the Good Life*, 2004), this is framed as the debate between **Sensationalist Hedonism** and **Attitudinal Hedonism**, with your observation acting as the primary objection to the former.

  If you need a single phrase to title this section of your paper, **"The Heterogeneity Objection"** is the standard terminology. However, given your specific focus on the definitional collapse, some scholars refer to this as **The Qualitative Common Denominator Problem**.

  ---

  ### The Carving: One Problem or Several?
  While they share a root, your text actually points to three distinct layers of the objection. Separating these will strengthen your paper's precision.

  #### 1. The Phenomenological Layer (Sensory vs. Cognitive)
  *   **Your Examples:** Headache relief (somatic) vs. Solving a proof (cognitive) vs. Meditation (absence of striving).
  *   **The Issue:** Classical hedonism (like Bentham’s) treats pleasure as a *sensation* (a quale). But there is no single "pleasure sensation" shared by tasting chocolate and doing math. As G.E. Moore noted, pleasure is more like "sweetness"—it varies too wildly in quality to be unified by a single feeling tone.
  *   **Implication:** This destroys **Sensationalist Hedonism**. You cannot locate a "common feel."

  #### 2. The Intentional Layer (Feeling vs. Pro-Attitude)
  *   **Your Example:** Satisfaction of finishing a proof (not located anywhere).
  *   **The Issue:** Recent philosophers (Feldman, Crisp) argue that what you call "satisfaction" isn't a feeling at all; it is an attitude *toward* a state of affairs. You are "pleased that $P$."
  *   **Implication:** If you define pleasure this way (Attitudinal Hedonism), you save the view from Phenomenological diversity. However, you enter the danger zone you identified: **collapsing into Desire Satisfaction Theory.** If "pleasure" just means "wanting something to continue," the substantive difference between Hedonism and Desire Theory evaporates.

  #### 3. The Normative Layer (The "Bad" Pleasures)
  *   **Your Example:** Revenge fantasy/Schadenfreude.
  *   **The Issue:** Even if we agree revenge feels like a kind of pleasure, do we want to count it as a component of *well-being*? You noted you "half-wish I did not feel" it.
  *   **Implication:** This creates a bifurcation. Either you admit these are pleasures but claim they don't increase well-being (violating the core tenet that only pleasure matters), or you claim they aren't *true* pleasures (which requires a moralized definition of pleasure, making the theory circular).

  ---

  ### Differentiation from Nearby Worries
  To position your paper correctly, you must distinguish this from the two most famous hedonistic objections:

  **1. Versus the Paradox of Hedonism**
  *   **Paradox:** "Seeking pleasure directly causes its loss." This is a psychological claim about *motivation*.
  *   **Heterogeneity:** "Pleasure is not one thing." This is a metaphysical/phenomenological claim about *ontology*.
  *   **Distinction:** The Paradox assumes we know what pleasure *is*, and argues we shouldn't aim for it. Your difficulty argues we don't even know what pleasure *is*.

  **2. Versus the Experience Machine**
  *   **Machine (Nozick):** Argues that mere experience (regardless of content) is insufficient for well-being because we care about truth/agency.
  *   **Heterogeneity:** Arguments assume we care about well-being being grounded in internal states, but debates the *texture* of those states.
  *   **Distinction:** The Machine objection grants that pleasure is defined but argues it is *insufficiently valuable*. Your objection argues the concept of pleasure is *too indeterminate* to ground a theory of value.

  ---

  ### Is It Fatal?
  It is fatal to **Classical (Sensationalist) Hedonism**, but survivable for **Attitudinal Hedonism**—at a cost.

  1.  **If you keep Sensationalism:** The heterogeneity objection is likely fatal. There is no scientific or phenomenological evidence for a unifying "pleasure feeling." This pushes the thesis into pseudoscience or mysticism.
  2.  **If you move to Attitudinalism:** You survive the heterogeneity objection. You can say, "What makes a life go well is taking pro-attitudes toward various states."
  3.  **The Cost:** This invites the "Collapse Objection" you identified. If "pleasure" is just "pro-attitude," then Hedonism sounds identical to Desire Satisfaction Theory. To maintain distinctness, the Attitudinal Hedonist must insist that one can take a pro-attitude toward a state *without necessarily desiring the outcome of actions* (e.g., enjoying a movie without wanting to act on it). Or, they must distinguish "taking pleasure" from "desiring based on expectation."

  However, you are right to worry about the boundary. If you define pleasure functionally ("whatever we wish to continue"), **Hedonism ceases to be a unique competitor to Desire Theory** and becomes merely a specific subset of it (where the desires are purely phenomenological rather than instrumental).

  ### Proposed Label and Boundaries
  If you wish to coin or refine a term for this specific intersection (heterogeneity + functional collapse), I suggest:

  **The Deflationary Challenge to Hedonism**
  *   **Why:** Because the objection deflates "pleasure" from a rich phenomenological substance into a thin functional state, thereby draining the theory of its intuitive force.
  *   **Boundaries:**
      *   **Lower Boundary:** The point where "pleasure" becomes indistinguishable from "preference satisfaction."
      *   **Upper Boundary:** The point where "pleasure" demands a qualitative unity that psychology cannot support (the "common denominator").
      *   **Inside the Line:** Any theory claiming well-being = pleasure must address either the Phenomenological layer (how different feels unify) or the Functional layer (how this isn't just desire).

  ### Recommendation for Your Paper
  Do not try to rescue the "single thread" of pleasure. That thread does not exist. Instead, structure your argument around the **dilemma forced by Heterogeneity**:

  1.  **Option A:** Treat pleasure as a felt quality. **Result:** It cannot account for complex satisfactions (proofs, calm). Hedonism is empirically false.
  2.  **Option B:** Treat pleasure as an attitude toward facts. **Result:** It risks becoming identical to Desire Satisfaction Theory. Hedonism loses its uniqueness.

  Your paper would make a strong contribution by arguing that **Option B is the only viable path for modern Hedonism, but it requires abandoning the intuition that well-being is about 'feelings' and embracing that it is about 'stances.'** This reframes the debate: Hedonism isn't wrong because pleasure is diverse; it's unstable because calling "stances" by the name "pleasure" obscures the shift to a cognitive theory of value.

  This positions you not just as rejecting hedonism, but analyzing the taxonomic pressure that drives the evolution of well-being theories.
