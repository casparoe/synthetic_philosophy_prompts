      *   The user notes that examples fall apart (sensory, cognitive, emotional, negative affect turning positive, absence of striving).
      *   They note functional definitions collapse hedonism into desire satisfaction theory.
      *   This is a classic metaphysical/phenomenological challenge to Hedonism.

  3.  **Identify Established Terminology:**
      *   *Heterogeneity of Pleasure:* This is the most direct description. It refers to the idea that pleasures don't share a single qualitative character.
      *   *The Unity of Pleasure Problem:* Often discussed in philosophy of mind and value theory.
      *   *Intentional Objects of Pleasure:* Distinguishing between the feeling itself and what it is about (satisfaction vs. sensation).
      *   *Qualitative Heterogeneity:* Specific term used by anti-hedonists.
      *   *Historical Context:* Aristotle (*Nicomachean Ethics*) argued against Plato's unitary view. Mill's distinction tries to handle quality but presupposes quantity. Moore's "Organic Unities."
      *   *Modern Discourse:* Parfit, Nozick, Feldman, Crisp.
      *   *Most precise label:* **"The Heterogeneity Objection"** or **"The Problem of the Nature of Pleasure."** Sometimes referred to as the challenge of finding a **"Common Denominator"** of pleasure.
      *   *Key Debate:* Sensationalist accounts (Bentham, Mill to some extent) vs. Attitudinal accounts (Nozick, Crisp, Feldman).

  4.  **Differentiate from Related Worries:**
      *   *Paradox of Hedonism:* About *pursuit* causing failure. Distinct from *definition*.
      *   *Experience Machine (Nozick):* About whether experience = value. Assumes we agree on what experiences are good. Challenges the sufficiency of experience, not the definition of pleasure itself (though they interact).
      *   *Mill's Higher/Lower:* A taxonomy *within* pleasure. Doesn't solve the "what makes them pleasurable" metaphysics.

  5.  **Evaluate Severity (Fatal or Narrow?):**
      *   If Hedonism requires a *qualitative sensation* (sensationism), heterogeneity kills it. You can't have "one feel" for all these things.
      *   If Hedonism allows an *attitudinal* definition (being pleased *that* P), then the definition shifts. Does "pleasure" still mean the same thing? Yes, but it becomes "pro-attitude." This moves away from phenomenology toward desire-satisfaction territory.
      *   Conclusion: It forces a choice between Sensationism (vulnerable to heterogeneity) and Attitudinal Hedonism (vulnerable to collapsing into Desire Satisfaction Theory). It's not fatal if you switch versions, but it changes the theory significantly.

  6.  **Synthesize the "Carving":**
      *   **Problem 1: Phenomenological Diversity.** (The sensory vs. intellectual divide).
      *   **Problem 2: The Intentionality Issue.** (Is pleasure a feeling, or a judgment?)
      *   **Problem 3: The Normative Taint.** (Schadenfreude - is it truly good if I hate having the feeling?).

