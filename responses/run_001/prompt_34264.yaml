      *   *Is it upstream?* Yes, focusing on the intersection points of ethics and control.
      *   *Is it tractable for us?* Yes, avoids heavy compute ML, focuses on logic/simulation.
      *   *JSON format check:* Ensure all fields are present and types match.

  7.  **Final Polish:**
      *   Ensure the tone is authoritative yet collaborative (like a senior PI advising another).
