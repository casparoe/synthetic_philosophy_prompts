prompt: |-
  I'm a GP at a practice that's gotten a bit of a reputation for being, let's say, open-minded about prescribing for what you might call enhancement rather than treatment — modafinil for healthy people pulling all-nighters, beta-blockers for musicians with performance nerves, that kind of thing. The other doctors and I have realized we have no consistent way of deciding which requests to say yes to, and it's starting to cause real tension. One colleague thinks we should just say no to anything that isn't treating a diagnosed condition; another thinks if it's safe and the patient wants it, why not. I'm somewhere in the middle and I'd like something more principled than my gut.

  I want a decision procedure I can actually run through in a ten-minute consult. It should be grounded in whatever the philosophy of medicine has actually worked out about the therapy/enhancement distinction, but it has to be usable by someone who last read philosophy in undergrad. Give me the steps in order, what counts as a sufficient answer at each step, where the procedure stops with a no, and where it hands off to clinical judgment because the question is really one of values rather than facts.

  Then run it on three cases:

  (1) A college student with no ADHD diagnosis asking for Adderall during finals week.
  (2) A short but otherwise healthy twelve-year-old boy — predicted adult height 5'2", no growth hormone deficiency — whose parents want growth hormone.
  (3) A recently widowed seventy-year-old who doesn't meet the criteria for clinical depression but wants an SSRI to "get through this."

  I need you to actually commit to a specific procedure and defend where you drew the lines — don't just lay out the philosophical options and leave me to pick. And flag honestly where the procedure gives an answer I'm probably not going to like.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analysis:

  1.  **Analyze the Request:**
      *   **User:** General Practitioner (GP).
      *   **Context:** Practice has a reputation for prescribing "enhancements" (modafinil, beta-blockers, etc.). Tension exists among colleagues regarding consistency and ethics.
      *   **Goal:** A principled decision procedure for the therapy/enhancement distinction.
      *   **Constraints:**
          *   Must be usable in a 10-minute consult.
          *   Grounded in philosophy of medicine but accessible (no jargon overload).
          *   Sequential steps with clear pass/fail criteria.
          *   Must identify where clinical judgment/values take over vs. where facts stop the process.
          *   Must run on three specific cases (Student/Adderall, Short Child/HGH, Widow/SSRI).
          *   Must commit to specific lines and defend them.
          *   Must flag answers that might be unpopular/unexpected for a GP.

  2.  **Determine the Philosophical Framework:**
      *   The core tension is Therapy vs. Enhancement.
      *   *Therapy:* Restoring function to a normal range (treating pathology).
      *   *Enhancement:* Improving function beyond normal range (non-pathological).
      *   *Problem:* The line is blurry (e.g., depression threshold). Also, medicalization of normal human experiences.
      *   *Pragmatic Approach:* I need something actionable. A strict "No to all enhancements" is too rigid for modern medicine (vaccines aren't treatment; birth control isn't treating infertility). A "Anything safe" approach is negligent.
      *   *Selected Framework:* **The Functional Baseline & Social Context Model.** This draws from Buchanan et al. ("From Therapy to Enhancement") and Savulescu's principles of beneficence/non-maleficence, but simplified for clinical practice.
      *   *Key Criteria:* Pathology? Safety? Fairness/Autonomy? Burden of Justification?
      *   *Refinement for GP context:* Focus on *medical necessity* first, then *net benefit*, then *resource justice/societal harm*.

  3.  **Drafting the Decision Procedure (The "Clinician's Filter"):**
      *   *Step 1: Pathology Check.* Is there a diagnosable disorder causing suffering or dysfunction? (Binary Yes/No).
      *   *Step 2: Safety/Indication Check.* Is the drug indicated for this? If off-label, is evidence strong enough for general use? (Safety first).
      *   *Step 3: Proportionality/Benefit Check.* Does the expected gain outweigh the risk? (Risk/Benefit ratio).
      *   *Step 4: The Coercion/Social Pressure Test.* Are they doing this because they are forced to compete or just personal preference? (Justice/Fairness).
      *   *Step 5: Duration/Urgency.* Is this acute/stress-bound or indefinite lifestyle change?
      *   *Conclusion:* Where do we say "No"? Where do we pause?

      *Critique of Draft:* Too philosophical. Needs to be faster. Let's streamline into a 4-step funnel.
      1.  *Diagnostic Threshold:* Is this a recognized condition?
      2.  *Harm Reduction:* Does refusal cause immediate significant harm?
      3.  *Equity/Fairness:* Does this create an unfair advantage or undermine social goods?
      4.  *Stewardship:* Can we manage the long-term dependency/risk?

      *Better Approach:* Let's use the **"Baseline Restoration Principle"**.
      1.  Is there a deviation from health functioning?
      2.  Is the proposed intervention restoring or exceeding?
      3.  Is the societal cost acceptable?

      *Wait, let's look at the "10-minute consult" constraint.* It needs to be mental check-boxes.
      Let's build the **"Function, Harm, Fairness" (FHF) Protocol**.

      *Step 1: Function (Pathology).* Does the patient meet DSM/ICD criteria OR have a clear physiological deficit?
      *Step 2: Harm (Risk).* What is the downside of prescribing vs. not prescribing?
      *Step 3: Fairness (Justice).* Does this undermine competition or create inequity?
      *Step 4: Autonomy/Values.* If it passes 1-3, do I object morally?

      *Actually, I want to make it stricter to reduce the practice's liability/reputation risk.*
      Let's go with a **"Presumption of Non-Intervention"** unless specific criteria are met.

      *Revised Procedure:*
      1.  **Diagnostic Validity:** Is there a condition defined by guidelines?
      2.  **Therapeutic Necessity:** Is non-pharmacological management exhausted/inadequate?
      3.  **Benefit vs. Risk Ratio:** Is the upside clearly greater than the downside (including addiction/tolerance)?
      4.  **Social Integrity:** Does prescribing normalize a social problem as a medical one?

      *Decision Points:*
      *   Fail Step 1 -> Strong No (unless palliative/hospice logic applies).
      *   Pass Step 1, Fail Step 2 -> Defer to non-drug.
      *   Pass 1 & 2, Fail 3 -> No.
      *   Pass 1, 2, 3 -> Proceed to Step 4 (Values Judgment).

      *Let's refine for the prompt's specific request about "Philosophy of Medicine".* I should lean on the **Restorative View** vs. **Improvement View**.
      *Core Principle:* Medicine's primary role is to restore normal species-typical functioning, not optimize above it. Exceptions exist when optimization solves a pressing safety or severe distress issue without significant equity concerns.

      *Finalizing the Procedure Steps:*
      1.  **The Medicalization Check:** Is the request responding to a pathological dysfunction (not just stress/sadness)?
      2.  **The Alternatives Check:** Have behavioral/lifestyle interventions failed?
      3.  **The Equity Check:** Does this drug give an unfair competitive edge or shift social burden?
      4.  **The Stewardship Check:** Can I safely manage the follow-up/exit strategy?

      *Where values enter:* Step 3 and 4 often depend on the doctor's view of "fairness." Step 1 is the hard filter.

  4.  **Applying to Cases:**

      *   **Case 1: Student/Adderall (No ADHD).**
          *   Step 1: No pathology. Fails. -> NO.
          *   Nuance: Academic pressure isn't illness.
          *   Unpopular answer? Some patients will hate this, feel gaslit.

      *   **Case 2: Short Child/HGH (No Deficiency).**
          *   Step 1: Physiological variation, not pathology.
          *   Step 3 (Equity): Height inequality vs. medical resource allocation.
          *   Result: NO.
          *   Defense: HGH is scarce/expensive. Treating "short stature" medicalizes genetic variance.

      *   **Case 3: Widower/SSRI (Grief, no MDD).**
          *   Step 1: Grief is normal response. Not depression.
          *   Step 2: Time + support > pills.
          *   Step 4: Values - Medicalizing grief is dangerous.
          *   Result: NO (but with empathy).
          *   *Correction:* Wait, is "complicated grief" an exception? Prompt says "doesn't meet criteria." So stick to protocol. NO to Rx, YES to listening/referral.

      *Wait, Case 3 needs nuance.* If I say a hard "No," it feels cold. But philosophically, treating grief with antidepressants is widely criticized (the "pathologizing of sadness"). I need to defend why this is the right ethical choice even if the patient wants it.

  5.  **Defending the Lines:**
      *   Why treat enhancement differently? Because resources are finite and side effects accumulate.
      *   Why the hard line on diagnosis? To prevent mission creep of medicine into solving social problems.
      *   *Flagging:* The procedure will require saying "No" to Case 3, which a compassionate GP might instinctively want to help. That's the friction point.

  6.  **Review against Constraints:**
      *   10-minute consult? Yes, these are mental heuristics.
      *   Philosophy grounded? Yes (Normalcy, Non-Maleficence, Justice).
      *   Usable by undergrad level philosopher? Yes, plain language.
      *   Commit to specific lines? Yes.
      *   Flag unhappy answers? Yes.

  7.  **Drafting the Content:**
      *   Introduction: Acknowledge the tension. Define the stance (Restorative Medicine).
      *   The Protocol (The "R.E.S.T." Framework? No, let's keep it descriptive). Let's call it the **Functional Boundary Protocol**.
      *   Step-by-step breakdown.
      *   Application to cases.
      *   Discussion of "Values Handoffs."

  8.  **Refining the Philosophy:**
      *   Need to explicitly mention *Normative Function Theory* (Boorse/Canguilhem implicitly).
      *   Therapy = restoration to statistical norm.
      *   Enhancement = moving above norm.
      *   The danger is "Medicalization."
      *   I need to make sure the procedure accounts for *patient autonomy* without caving to it if it violates professional integrity.

      *Let's adjust Step 1.* "Is there a clinically significant impairment?" If yes -> Treatment path. If no -> Enhancement path (High Bar).
      *Actually, I'll make the bar higher for Enhancements.*
      *Procedure Name:* **The Normalization Protocol.**
      1.  **Diagnosis:** Recognized impairment?
      2.  **Necessity:** Essential function recovery?
      3.  **Fairness:** Zero-sum game impact?
      4.  **Exit Strategy:** Finite course or open-ended?

      *Okay, I'm ready to write.* I will structure it as a clinical tool document followed by the case walkthroughs. I must ensure I don't waffle on the widow case—it's the hardest test of the principle. The principle dictates saying no, so I must stand by it while explaining how to communicate it compassionately.

      *(Self-Correction during drafting)*: Be careful with the Growth Hormone case. There is legal precedent (FDA approval for idiopathic short stature is actually a thing in some contexts, specifically US FDA labeled for ISS since 2003). However, ethically, many bioethicists oppose it. The prompt asks me to set the policy for *my practice*. I can choose the stricter bioethical stance (ISS = no) over the regulatory permissive stance. I will argue for the stricter stance based on resource stewardship and meaning of health, acknowledging the FDA status but prioritizing the "philosophy of medicine" over "insurance coding."

      *(Self-Correction on Widow)*: SSRIs for grief are controversial. The "broken heart" isn't a serotonin imbalance. I will maintain the "No Prescribing" but suggest counseling.

      *(Final Polish)*: Ensure the tone is professional, collegial, and firm but humane.

  9.  **Final Plan:**
      *   **Intro:** Establish the "Restorative Normativity" framework.
      *   **The Algorithm:** 4 questions.
      *   **Stop Rules:** Explicitly state where "No" is mandatory.
      *   **Value Handoffs:** Identify where personal conscience applies.
      *   **Cases:** Apply strictly.
      *   **Defense:** Explain the rationale for the hard lines.
      *   **Warning:** Flag the uncomfortable outcomes.

  **(Self-Correction Check):** Did I ask for a philosophy overview or a specific procedure? "Give me the steps... actually commit to a specific procedure." Okay, I will not present options. I will present *my* chosen procedure.

