answer: |-
  This requires a shift from "What does the law allow?" to "What does our profession permit?"

  To resolve the tension in your practice, you need a procedure that protects patients from iatrogenic harm, protects the practice from moral hazard, and respects the limits of medical authority. I propose you adopt the **Restorative Normativity Protocol**.

  It relies on the Boorsean definition of health (function within species-typical norms) but adds a pragmatic layer of fairness. It treats **Therapy** (restoration) as the default permission and **Enhancement** (optimization) as a high-bar exception requiring affirmative proof.

  You can run this mentally in under five minutes of the consult time.

  ### The Protocol: Four Gates to Prescription

  For any request falling outside standard guidelines (i.e., enhancement or borderline), run the request through these four gates sequentially. If it fails a gate, the prescription is denied **unless** there is a specific palliative justification.

  #### Gate 1: The Pathology Check
  *   **Question:** Does the patient meet diagnostic criteria (DSM-5, ICD-11) or demonstrate objective physiological dysfunction?
  *   **Sufficient Answer:** Yes, confirmed criteria OR documented lab/physiology failure (e.g., hypothyroidism).
  *   **Failure:** The experience is subjective distress, stress, aging, or normal variation (e.g., height, fatigue).
  *   **Stop Rule:** **If No → Stop here.** Do not proceed. Refusal is mandatory to avoid medicalizing normal life processes.

  #### Gate 2: The Necessity Check
  *   **Question:** Have behavioral, lifestyle, or psychosocial interventions been attempted and failed? Is the medication essential for basic functioning, or merely for improved performance?
  *   **Sufficient Answer:** Documented trial of alternatives OR urgency where delay causes irreversible harm (e.g., preventing suicide).
  *   **Failure:** "I want to do better at my job/music/exams" rather than "I cannot function."
  *   **Stop Rule:** **If No → Pause.** Offer referral or watchful waiting. Prescription is only permissible if the risk of *refusal* outweighs the risk of *prescription*.

  #### Gate 3: The Equity & Fairness Check
  *   **Question:** Would prescribing this drug create an unfair competitive advantage in a zero-sum environment (school, employment, sport), or would it shift a social obligation onto the individual body?
  *   **Sufficient Answer:** Private sphere (healthcare/household) with no external competitive impact.
  *   **Failure:** Public sphere performance (exams, athletics, public speaking competitions) or social stratification (paying to be taller/stronger).
  *   **Stop Rule:** **If No → Stop.** Medicine should not enforce unfair advantages. This is the "Justice" filter.

  #### Gate 4: The Exit Strategy Check
  *   **Question:** Is there a defined endpoint? Can the medication be stopped without withdrawal or loss of baseline function?
  *   **Sufficient Answer:** Time-limited use with taper plan.
  *   **Failure:** Indefinite maintenance without physiological need.
  *   **Stop Rule:** **If No → Refer to Specialist.** Avoid the GP becoming a chronic provider of dependence agents for healthy people.

  ***

  ### Where Clinical Judgment Takes Over (The Value Handoff)

  If a case passes **Gate 1 (Pathology)**, you prescribe (Triage complete).
  If a case **fails Gate 1**, it is usually a hard "No."
  **However,** there is one area of "Value Handoff": **The Distinction Between Suffering and Pathology.**

  *   **The Grey Zone:** Sometimes a patient is suffering immensely but doesn't meet criteria (e.g., Case 3). Here, facts stop, and values begin.
  *   **Your Role:** In this zone, you may refuse the drug, but you must offer an alternative form of care (counseling, time, presence). You judge the value of "medical containment" vs. "social support." If you feel the patient is in crisis despite no diagnosis, you may override Gate 2 based on *Non-Maleficence* (preventing self-harm), but this must be documented as a crisis intervention, not routine enhancement.

  ***

  ### Running the Protocol on Your Three Cases

  Here is how the protocol plays out. Note that I am prioritizing **integrity of the medical license** over **customer satisfaction**. This will cause friction.

  #### Case 1: College Student / Adderall / No ADHD
  *   **Gate 1 (Pathology):** **FAIL.** No diagnosed ADHD. Fatigue before exams is normal stress, not dysfunction.
  *   **Decision:** **NO.**
  *   **Reasoning:** Granting this validates the idea that academic performance is a medical outcome requiring chemical aid.
  *   **Protocol Defense:** While the student is "healthy," their distress is real. However, treating stress with stimulants shifts the burden of exam preparation from study habits/time management to neurochemistry. This sets a precedent that undermines the purpose of education (testing knowledge, not access to medication).
  *   **The "Unpopular" Answer:** You must tell them you cannot prescribe, but offer a letter for disability accommodations regarding *extended testing time* if their workload is genuinely unmanageable, shifting focus from the *drug* to the *environment*.

  #### Case 2: 12-Year-Old Boy / Growth Hormone / No Deficiency
  *   **Gate 1 (Pathology):** **FAIL.** Predicted height of 5'2" is short but within statistical normalcy. No endocrine deficiency.
  *   **Gate 3 (Equity):** **FAIL.** Height affects employability, dating, and bullying. Using medicine to alter genetic trait creates a socioeconomic gap (those who pay get taller).
  *   **Decision:** **NO.**
  *   **Reasoning:** Even if insurance allowed it, HGH carries risks (diabetes, joint pain, cancer link uncertainty). Prescribing this transforms parents into customers buying traits rather than doctors healing sick children.
  *   **The "Unpopular" Answer:** Parents will be furious. They are acting in what they perceive as their child's best interest. You must frame this as protecting the boy: "We do not expose healthy children to hormonal risks to solve a problem that is social (height bias), not medical."
  *   **Alternative:** Refer to a therapist to work on resilience/bullying issues. Fix the child's relationship to his height, not his actual height.

  #### Case 3: 70-Year-Old Widow / SSRI / Grief
  *   **Gate 1 (Pathology):** **FAIL.** She is grieving, not depressed. Sadness after spousal loss is appropriate functioning, not dysfunction.
  *   **Gate 2 (Necessity):** **FAIL.** Medication masks necessary emotional processing. Time is the treatment, not chemistry.
  *   **Gate 4 (Exit Strategy):** **FAIL.** Starting SSRIs at 70 often leads to years of usage due to tolerance and side effects (fall risk, hyponatremia).
  *   **Decision:** **NO.**
  *   **Reasoning:** This is the most contentious one. You will feel like a "bad doctor" refusing medicine to a suffering elderly woman. **But this is the crux of the philosophy of medicine.** If we medicate grief, we signal that sadness is a disease to be cured rather than a process to be endured.
  *   **The "Unpopular" Answer:** The wife likely wants the pill to sleep. If you prescribe, she gets temporary relief but loses the ability to process her loss naturally.
  *   **Clinical Workaround:** Do not hand out a bottle. Instead, sit with her. Offer referrals to bereavement groups. Only prescribe sleep hygiene aids (e.g., short-term melatonin or mild sedative) if insomnia is threatening physical health, not to erase sadness. Make it clear: "This pill treats your sleep, not your sorrow."

  ***

  ### Why This Procedure Will Be Hard for You

  1.  **Loss of Patient Satisfaction Metrics:** Patients often leave satisfied when given a prescription. With this protocol, you will get lower satisfaction scores from "enhancement seekers." You must be prepared for reviews that say "Doctor refused to help me succeed."
  2.  **Collegial Friction:** If your colleague who wants to say "Yes" sees you denying the widow, they will see you as rigid. You must articulate that this protects *their* future patients from the stigma of having their grief treated as illness.
  3.  **The "Compassionate Exception" Trap:** In Gate 1, you might find yourself wanting to bend "No" to "Maybe." **Do not.** Once you admit grief needs pills, you cannot exclude anxiety about marriage. The slippery slope is where your practice's reputation started.

  ### Summary of Defended Lines

  *   **Why the hard stop on ADHD drugs?** Cognitive enhancement creates a "chemical arms race." If everyone has an adderall, it becomes the new placebo.
  *   **Why the hard stop on HGH?** We must distinguish between "healing a lack of growth" and "manufacturing excess growth." Resources should go to the sick, not the optimizing.
  *   **Why the hard stop on Grief?** Medicalizing sadness reduces human agency. A doctor's job is to treat the sick, not to cure the feeling of being alive.

  This procedure is not designed to maximize prescriptions. It is designed to maximize the meaning of medicine as a profession dedicated to health, not productivity. Stick to the protocol, and the tension in the practice will eventually resolve because the line becomes predictable, not arbitrary.
