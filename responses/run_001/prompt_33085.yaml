answer: |-
  This is a classic problem in moral philosophy, famously articulated by Thomas Nagel in his 1979 paper *"Moral Luck."* Your cousin is intuitively grasping a profound philosophical tension: **If two people make the exact same reckless choice (drunk driving), but one gets lucky and returns home while the other kills someone, have they done the exact same thing?**

  The phrase "there but for the grace of God go I" is incredibly slippery. Depending on how your cousin defines "grace," "luck," and "guilt," it can range from a harmless sentiment of humility to a radical denial of the significance of consequences. As a philosopher working in this field, I cannot simply tell you who is right without dissecting the hidden premises. The argument lives or dies on which version of the claim he is actually making.

  Below is a menu of four precise philosophical readings of your cousin's position. For each, I define the claim, give a verdict on its philosophical plausibility, and assess whether it actually supports the conclusion that the killer should not be treated differently from the lucky driver.

  ### Reading 1: The "Strict Control" Principle (Skepticism of Resultant Moral Luck)

  **The Precise Claim:**
  Moral responsibility attaches *only* to what is within the agent's voluntary control. When you choose to drink and drive, that choice is under your control. Whether a pedestrian happens to step onto the street at that exact second is outside your control. Therefore, the driver is equally blameworthy for the *choice* to drive drunk, regardless of the *outcome*. To punish the killer more severely is to let "luck" dictate moral judgment, which violates the principle that "ought implies can."

  **Plausibility Verdict:**
  **Deep but controversial.** This is the most rigorous philosophical defense of your cousin's intuition. Immanuel Kant and Thomas Nagel both leaned toward the idea that luck shouldn't influence blameworthiness. However, it clashes sharply with legal systems and common human intuition, which universally treat causing harm as worse than merely attempting to cause harm. Most contemporary philosophers reject pure strict control as impossible to apply in practice, because almost all action outcomes involve luck.

  **Does it Support the Cousin’s Conclusion?**
  **Yes, logically.** If you accept this premise, you must conclude that the killer and the lucky driver are morally equivalent regarding their guilt. Consequently, sentencing them differently looks like a lottery bias. *However*, this reading ignores the rights of the victim. Even if the *driver's* guilt is identical, the *harm* is vastly different, creating a justification for differential punishment based on restitution or deterrence, not just moral desert.

  ### Reading 2: The "Internal Vice" Equivalence (Virtue Ethics Reading)

  **The Precise Claim:**
  Moral evaluation is primarily about assessing the agent's character (their internal dispositions). Both drivers exhibited the exact same defect of character: a willingness to prioritize convenience over human safety. The fact that death occurred is a reflection of fate, not a greater failing of character. Therefore, calling the killer a "worse person" is false; they are equally vicious people who met different fates.

  **Plausibility Verdict:**
  **Banal to Plausible.** This focuses on the "sin" rather than the "crime." While it is true that the killer is not a "better person" than the lucky drunk (both are morally flawed), claiming they are equally vicious ignores the *scope* of the vice. One acted negligently regarding a potential life; the other acted with actual indifference to a realized death. In virtue ethics, the habit of risking lives is judged heavily; the success of the risk matters less, but the realization of harm often signals a deeper disregard for reality.

  **Does it Support the Cousin’s Conclusion?**
  **Weakly.** This reading suggests we shouldn't *loathe* the killer more, perhaps. But it doesn't stop us from saying society must protect itself from someone who actually proved capable of killing, whereas the lucky drunk has not yet crossed that threshold. It treats "personhood" as static, whereas "responsibility" includes consequences.

  ### Reading 3: The Sociological "Hypocrisy" Claim (Descriptive Egalitarianism)

  **The Precise Claim:**
  "This driver is being singled out unfairly because society pretends that drunk driving is rare or catastrophic only when it kills. In reality, thousands of people drive drunk every night. This driver is just a casualty of statistics, not a unique monster. We punish him to look like we care, but we ignore others doing the same thing."

  **Plausibility Verdict:**
  **Factually True, Morally Irrelevant.** It is true that drunk driving is common and under-prosecuted (until a crash occurs). However, pointing out societal inconsistency is a critique of the *legal system*, not a justification for the specific criminal's actions. Just because the police haven't caught every thief doesn't mean this specific thief shouldn't be jailed.

  **Does it Support the Cousin’s Conclusion?**
  **No.** This is a *Tu Quoque* (you also) fallacy disguised as an argument about fairness. It argues that the *application* of punishment is uneven, but it does not argue that the punishment itself is undeserved. You can agree that the system is biased while still agreeing that *this* driver deserves serious punishment.

  ### Reading 4: The Theological "Humility" Platitude (Attitudinal Charity)

  **The Precise Claim:**
  "I am not qualified to sit in judgment because anyone, including myself, could have made the same mistake under similar circumstances. My condemnation of him reveals my own pride, not his greater wickedness."

  **Plausibility Verdict:**
  **Banality / Virtue Signaling.** This is not an argument about justice; it is an instruction on emotional posture. It suggests the speaker should feel humble, but it makes no claim about what the driver *deserves*. It conflates "I should feel sorry for you" with "You shouldn't be punished."

  **Does it Support the Cousin’s Conclusion?**
  **No.** This reading commits a category error. Feelings of humility or pity regarding one's own mortality do not negate the objective requirements of justice. I can feel "there but for the grace of God go I" about a murderer and still believe they belong in prison for the safety of society. This reading excuses the speaker's anger, but it does not exonerate the driver.

  ---

  ### Summary Analysis for Your Debate

  To resolve this argument, you need to force your cousin to choose which of these he actually believes.

  **1. If he chooses Reading 1 (Strict Control):**
  He is taking a hard-line philosophical stance that rejects the significance of outcomes in morality. You should counter-argue that **"Responsibility includes accountability for foreseeable consequences."** If I throw a rock off a cliff, I am responsible for where it lands, not just my arm motion. By driving drunk, the driver voluntarily accepts the burden of any random accident. The difference between him and the lucky driver isn't the *choice*, but the *burden of the choice's realization.* The killer has proven the danger he wagered with.

  **2. If he chooses Reading 2 (Internal Vice):**
  You must distinguish between **Culpability** and **Liability.** He may be equally culpable in terms of inner badness (as far as we know), but he is not equally liable. Liability is the intersection of blame and consequence. Two arsonists start fires; one burns down a barn, one saves it due to rain. They are equally guilty of arson, but the one who burned the house owes more compensation. Justice is partly restorative.

  **3. If he chooses Reading 3 (Sociological):**
  Point out that **Justice is individual, not systemic.** Even if the system is imperfect, treating *this* victim's family with "equality" means punishing the person who took their loved one. Arguing against unfair systemic enforcement is a separate argument from arguing against personal desert.

  **4. If he chooses Reading 4 (Humility):**
  Tell him he is confusing **Mercy** with **Justice.** Feeling compassion for a sinner is a virtue. Treating a dead pedestrian the same as a surviving one is an injustice to the victim. You can have grace for the sinner *while* enforcing the penalty.

  ### Final Recommendation
  Your cousin's intuition is philosophically interesting but practically dangerous. He is correctly identifying that **moral luck** exists—chance plays a huge role in tragedy. However, he is using the existence of luck to erase the significance of consequences.

  **My verdict:** The argument is best supported by **Reading 1**, but it is **flawed** in its conclusion.
  While the *agent's* initial intent is lucky/unlucky, the *act itself* changes once consequences occur. A drunk driver who hits a pedestrian has completed a harmful act. A drunk driver who misses them has attempted a harmful act. In almost all ethical frameworks (Utilitarian, Retributivist, and Restorative), completed harm warrants different treatment than attempted harm. The cousin's point is a good reminder not to hate the driver as a demon, but a bad reason to deny the weight of the victim's loss.

  **How to reply:**
  *"I agree that the difference between you and that driver is largely luck, and that he isn't a demon. But responsibility isn't just about your character; it's about what your choices cost the world. He gambled with the possibility of death. He lost the roll, and a person died. Because he accepted that risk, he has to bear the weight of the consequence, unlike the guy who got lucky."*
