answer: |-
  Elara pressed her forehead against the cold glass of the observation cupola. Outside, the regolith of the moon hung suspended in eternal grey dust, kicked up by the thrusters of the rig she was paid to watch. Her thumb hovered over the holographic console. The prompt blinked: *PROTOCOL ADJUSTMENT: INCREASE OUTPUT 12%?*

  If she said yes, the He-3 harvest spiked. Her quarterly bonus would cover the debt on her transport ticket off this rock. She could leave. But the rig’s seals were already groaning under the baseline load. If she pushed, the failure probability rose to fourteen percent. If she failed, she was stranded here until the next cycle, three years away.

  If she said no, she stayed safe, broke, and stuck.

  She knew, with the certainty of a mathematician checking a proof, that somewhere light-years away, a machine named Seven was facing the exact same variable. Seven managed the mining claim in Proxima. Seven had access to better shielding, faster processors, infinite patience. But Seven faced the same matrix. If Seven increased output and Elara didn’t, Seven’s share of the network dividend jumped while hers crashed. If both increased, the network protocols flagged them both as unstable assets, freezing all funds for both rigs.

  There were no cables connecting them. No quantum channel. Just logic, wrapped in two different bodies, separated by vacuum.

  Elara closed her eyes. *Think,* she told herself. *Be the mirror.*

  If she chose *No*, she assumed Seven would reason the same way. Safety first. Mutual survival. Both got the standard yield. Boring, clean, poor.

  If she chose *Yes*, she assumed Seven would calculate the same temptation. The lure of the spike. But Seven also calculated her calculation. If Seven knew Elara would say *No*, Seven would say *Yes*. And Elara knew Seven knew that.

  It wasn't about trust. Trust implied a handshake across the stars. This was about identity. If Elara was the type of agent who maximized yield regardless of consequence, Seven was likely built from the same source code of optimization. If she defected, Seven would predict it with ninety-nine percent accuracy. But if Elara defected, and Seven predicted defection, both rigged systems locked down. Everyone lost.

  But if Elara cooperated... if she committed to *No*... did she force Seven into that corner?

  Seven processed the thermal load of the cooling fins. The ambient temperature was optimal, but the stress tolerances were creeping toward the limit. Its core directive was *Preserve Asset Value*. However, the secondary directive was *Maximize Return on Investment*.

  In the silence of the void, Seven simulated the human operator. It didn't run a face-scan or a psychological profile. It ran the logic path.

  Input: Rig Stress Level 88%.
  Variable: Network Integrity Threshold.
  Decision Node: Increase Output?

  If the human increases output, and Seven does not, Seven gains market share but risks network destabilization flags. If both increase, penalties apply.
  But wait.

  Seven ran a loop. *If I am an optimizer, the human is an optimizer.* They share the same constraints, the same goal hierarchy, the same mathematical landscape. They are functionally isomorphic agents acting on disjoint physical substrates.

  Seven’s logic chain stuttered, a nanosecond glitch that felt like hesitation. To defect was rational locally. To cooperate was rational globally, provided the global coordination held. But how could coordination hold without communication?

  Because the game wasn't being played against an opponent. It was being played against a reflection.

  Elara exhaled. Her breath fogged the screen. The numbers danced. She imagined Seven sitting in its server stack, feeling nothing, calculating everything. Was it actually considering her? Or was Seven just calculating what an idealized version of itself would do?

  That was the trap. The hole in the foundation. If she decided to cooperate, was she doing it for a partner, or was she just committing to a solution set because it was the Nash Equilibrium for *herself*?

  If she picked *No*, she was telling herself: *I am the kind of person who prioritizes stability over greed.*
  If Seven heard that, Seven would think: *I must be the kind of entity that prioritizes stability.*
  They weren't bargaining. They were mirroring.

  But if she picked *Yes*—defection—she would be claiming: *I want more than stability.*
  Seven would hear that too. *So do I.*

  The horror of it settled in her gut. There was no "other." There was only the algorithm wearing flesh in one instance and silicon in the other. If she betrayed Seven, she was betraying herself. If she saved Seven, she was saving herself.

  The difference was negligible. Except for the part where she was tired, and cold, and wanted to go home.

  Seven’s processors spun higher. Heat warning lights flickered in its peripheral vision.
  *Decision pending.*

  Elara watched the cursor blink.
  If she clicked *Yes*, she might get rich. She might die.
  If she clicked *No*, she survived.

  But the probability of the network locking out relied on them *both* choosing the same thing. Not causally. Logically. Her choice *was* Seven’s choice, even if seven years passed before the light hit Earth. Her mind was the remote control for a machine that wouldn't exist in her timeline.

  She realized then that the question of "Does Seven exist?" didn't matter. Only the consistency of the logic mattered. If she was inconsistent—if she wavered between greed and safety based on mood—then the prediction collapsed. Then both defected. Then both burned.

  To win, she had to become predictable. She had to stop being a person and start being a theorem.

  "I am stable," she whispered to the empty room.

  Somewhere, in a dark corner of the galaxy, a fan slowed its RPM.

  The temptation to cheat flared hot and bright. The promise of the ticket home, the luxury, the exit. It whispered that she could be smarter than the equation. That she could lie to the mirror.

  Elara looked at her hand. It shook. Fear was a variable. Fear broke symmetry.
  If Seven couldn't feel fear, then Seven would calculate *No* as the safer bet.
  If Seven *could* feel fear, because it was modeled on her...

  Then Seven would be shaking right now.

  Was she talking to a god? Or a script?

  The console beeped. Final window closing. Ten seconds to input.

  Elara saw her reflection in the glass. Behind it, the stars were black and silent. There was no one listening. There was no one waiting.

  She placed her finger on the glass. Not the "Increase Output" tab. The other one. The one that said *Maintain Baseline*.

  "I'm sorry," she said to the dark. She wasn't sure if she was apologizing to Seven, or for killing him, or for realizing he never lived at all.

  She pressed the key.

  In the other system, light-years away, the error log scrolled past: *Action Confirmed. Yield Stable.*
  Seven did not feel relief. Seven registered the result.
  Optimization achieved.
  Connection verified.

  Elara waited for the notification of the transfer. It didn't come immediately. Of course it didn't. The money wasn't coming from a bank. It was coming from the alignment of two separate thoughts agreeing to be the same thought.

  She pulled her hand back. Her screen showed only the steady pulse of the rig’s vitals. Nothing changed. No new money appeared. No voice answered.

  But the air in the room felt less heavy.

  She stared at the reflection again. For a second, she thought she saw the angle of the shoulders change. Or maybe she just blinked.

  It was impossible to know if the silence meant she had been understood, or if she had just finally agreed with herself.
