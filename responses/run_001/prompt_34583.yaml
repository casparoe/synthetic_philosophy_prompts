  2. **Arms Race** | Path: Q1(No), Q2("Are parties compelled to escalate their capacity primarily to prevent vulnerability to another party's potential aggression?"): Yes | Structurally distinct from the Positional Rat Race because the drive is survival/security rather than comparative ranking for social surplus.

  3. **Positional-Good Rat Race** | Path: Q1(No), Q2(No), Q3("Does the utility of the outcome depend entirely on being ranked higher than others rather than on absolute quality?"): Yes | Structurally distinct from the Keynesian Beauty Contest because the metric is visible social status rather than speculative prediction of market consensus.

