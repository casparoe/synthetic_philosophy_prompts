  6. **Keynesian Beauty Contest** | Path: Q1–Q4(No), Q5(No), Q6("Do agents decide actions based on estimating what others *think* the average opinion will be, rather than on fundamentals?"): Yes | Structurally distinct from the Positional-Good Rat Race because the payoff relies on recursive second-guessing of investor psychology rather than direct social comparison.

  7. **Bank Run** | Path: Q1–Q5(No), Q6(No), Q7("Does the collapse occur because a confidence shock causes agents to withdraw resources simultaneously, validating the feared insolvency?"): Yes | Structurally distinct from the Preference Falsification trap because the trigger is financial solvency mechanics rather than ideological signaling.

