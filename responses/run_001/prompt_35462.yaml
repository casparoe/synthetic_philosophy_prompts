          *   *Philosophical Accuracy:* Many philosophers argue that REM findings do *not* automatically refute Malcolm. Malcolm argued that the *language* of "experiencing" requires criteria. Physiology is just another kind of behavior/report proxy. Saying "REM proves Malcolm wrong" is a common layman mistake, though accepted in some intro classes. A PhD-level TA marking should catch this nuance. However, in the context of Dennett, Dennett *does* use neuroscience to argue against Malcolm's quietism.
