answer: |-
  1. **The phenomenon restated**
  Actors make locally rational choices that incrementally shift the competitive baseline. Each move raises the standard for acceptable participation, forcing others to adapt or lose status. The result is a continuously escalating environment where the equilibrium moves away from initial preferences, trapping participants in a system none wanted, sustained purely by local incentives.

  2. **The nearest established concepts**
  Several established frameworks intersect here. The **Race to the Bottom** describes convergence on low-value equilibria through deregulation, safety cuts, or wage suppression, aiming for a fixed minimum threshold. **Arms Races** model reciprocal escalation of capability where defense drives offense, often assuming static threats and material costs. The **Red Queen Effect**, originating in evolutionary biology, describes species evolving constantly merely to survive against evolving competitors, emphasizing running to stay in place. **Security Dilemmas** in International Relations explain how defensive measures provoke insecurity in rivals, necessitating countermeasures that reduce overall stability without direct aggression. Finally, **Hypercompetition** characterizes markets where advantage is quickly eroded, demanding constant innovation to maintain parity. Most notably, the **Tragedy of the Commons** describes individuals depleting a shared resource, yet this assumes a finite stock rather than a moving benchmark. While each captures elements of reactive behavior, they vary significantly in their assumptions about intent, resources, and equilibrium stability.

  3. **Where each fits and where it misses**
  The **Race to the Bottom** captures the collective harm of individual rationality but misses the structural mechanism. It assumes variables converge downward toward a fixed minimum, whereas your pattern involves a shifting ceiling where requirements rise indefinitely. There is no fixed 'floor' being destroyed; rather, the target keeps moving. **Arms Races** fit the structural feedback loop perfectly—the action-reaction cycle—but typically connote physical weaponry or explicit hostility. Your example of AI publication implies prestige and talent retention, making the militaristic connotation feel metaphorical rather than literal. **Red Queen Dynamics** aligns best with the moving equilibrium concept, explaining why effort increases without improving absolute welfare, only relative standing. However, it originates in non-strategic biology, lacking the element of conscious calculation regarding 'standing' and 'talent' that defines your scenario. **Security Dilemmas** capture the lack of malicious intent, matching the 'locally sensible' criteria where no one wants the escalation. Yet this concept remains tethered to statecraft and deterrence, failing to generalize to corporate or academic sectors. **Hypercompetition** acknowledges the speed and instability but treats the market dynamics as the primary driver rather than the participants actively manipulating the game rules. **Tragedy of the Commons** assumes a subtractable resource is depleted; here, the 'resource' is attention or safety, but the problem is the inflation of expectations, not depletion. Crucially, none of these fully encapsulate the normative shift where the definition of competence itself evolves recursively. The common thread they miss is that the game parameters themselves are endogenous to the players' actions, turning the environment into a moving target that cannot be stabilized by cooperation.

  4. **Verdict on a name**
  No single term perfectly isolates this specific abstraction across all fields. However, **"Red Queen Dynamics"** is the most accurate theoretical descriptor for the moving equilibrium mechanism. In policy contexts, **"Escalatory Arms Race"** is the functional equivalent. You do not strictly need to coin a new name if you qualify existing terms. I recommend using **"Competitive Ratcheting"** as a modifier to clarify the directionality, or adopting the phrasing **"Moving Equilibrium Escalation."**

  5. **Definition and boundary cases**
  **Definition:** A recursive process where individual rational actions drive a self-sustaining escalation of baseline requirements, shifting the equilibrium without reaching a stable endpoint.
  **Inside:** AI capability publication (each paper forces higher benchmarks); Procurement spirals (missiles vs. defense shields).
  **Outside:** Price wars (Race to the Bottom converges to cost floor, not rising bar); Regulatory harmonization (cooperative alignment fixes the variable, doesn't escalate).
  **Reasons:** Price wars fix a variable downward; standardization seeks stability. The pattern requires unilateral action that destabilizes the norm for all parties simultaneously.
