answer: |-
  **MEMORANDUM**

  **TO:** Style Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal for Revision of House Style Guide Regarding Gender-Neutral Language

  **Purpose**
  This memo precedes our meeting on Thursday regarding the proposed revision of the University Press style guide. Specifically, it addresses the question of whether to adopt a mandatory policy requiring gender-neutral language. As you know, the committee remains divided between a faction seeking strict adherence to nonsexist terminology and a senior editorial faction arguing that such mandates constitute an ideological imposition on established convention.

  **Recommendation**
  I recommend that the committee **adopt a modified version of the nonsexist language policy**. 

  This approach requires that all prose written directly by the Press staff—including cover copy, catalog descriptions, forewords, and internal communications—strictly adhere to gender-neutral standards. Conversely, for manuscripts submitted by authors, the policy should function as a strong guideline prioritizing clarity and inclusion, allowing for exceptions where specific disciplinary traditions or historical fidelity require otherwise. Finally, quoted material and bibliographic citations shall remain unedited to preserve the integrity of sources.

  **Engaging the Counter-Position**
  The opposition to a mandatory policy, led by our senior editor, rests on two defensible claims. First, that language evolves descriptively, and style guides should record actual usage rather than prescribe idealized forms. Second, that competent readers successfully parse generic pronouns (e.g., *he* for *a person*) as gender-neutral, rendering the effort to change them unnecessary or distracting.

  This argument relies on the premise that intelligibility equates to neutrality. Douglas Hofstadter’s satire, *A Person Paper on Purity in Language* (published under the pseudonym William Satire), challenges this premise by demonstrating that what counts as "neutral" often depends entirely on who holds the power to define it. Hofstadter imagines a society where women, lacking power, develop a distinct syntax, while the dominant class ("Persons") uses a "neutral" vocabulary that systematically excludes the subordinate class. He concludes, somewhat ironically, that if the dominant group wishes to prove their superiority is natural, they should simply claim their language is universal.

  While Hofstadter satirizes linguistic prescriptivism, his logic applies inversely to our debate. To claim that generic *he* or *mankind* are truly neutral is to assume the reader's default cognitive mapping includes all genders equally. If the "recovery" of intended meaning requires the reader to override a male-default assumption, the usage carries a cognitive cost—even if small. As a University Press, our product is not merely the transmission of data, but the cultivation of inclusive intellectual environments. If our house style relies on linguistic habits that implicitly privilege one gender, we risk signaling that certain identities belong less to the academic enterprise, even if a seasoned scholar can mentally navigate around the error.

  However, the senior editor is right to warn against "ideological imposition" when it compromises clarity or historical accuracy. We must distinguish between the Press's voice and the scholar's arguments. We cannot demand that a historian of 18th-century Britain rewrite primary source quotes to avoid sexist terms, nor should we require sociologists studying binary-gender communities to alter specific terminology essential to their analysis. The goal is equity, not erasure.

  **Specific Policy Directives**

  1.  **Press Prose (Mandatory):** All copy edited and produced by Press staff must exclude generic *he*, *man-* compounds (*chairman*, *manpower*), and gendered defaults in examples. Pluralization (e.g., "they," "authors," "readers") and recasting (e.g., "the chair," "humanity") shall be the default mechanism.
  2.  **Author Manuscripts (Guideline + Exception):** The revised style guide will advise authors on inclusive language practices during the acquisition and contract phase. Editors should flag non-compliance during copy editing. However, deviations may be permitted if:
      *   Changing the term alters the precise meaning within a specific academic discipline.
      *   Historical context requires retaining older terminology in analysis of past texts.
      *   The manuscript is a translation where the gendered nature of the original language is unavoidable.
      *   In these cases, a style note should explain the exception to the reader.
  3.  **Quoted Material (Exempt):** Titles, proper names, and direct quotations from external sources will remain unchanged. Footnotes may be used to clarify archaic or biased terms without altering the text.

  **Implementation Timeline**

  *   **Immediate:** Update digital submission guidelines to inform authors of the expectation.
  *   **November 1:** Release updated internal copy-editing checklist reflecting mandatory standards for Press prose.
  *   **January 1:** Official publication of the revised House Style Guide.
  *   **July 1:** Full audit of backlist cover copy to align with new standards.

  **Conclusion**
  By distinguishing between the Press's institutional voice and the content we publish, we satisfy the senior editor's concern about imposing our will on independent scholarship, while fulfilling the advocacy faction's demand that we lead by example. We move beyond the question of whether *he* is understood, to consider whether *we* should be using it.

  **Motion**
  The committee is asked to vote on the following motion:

  > "That the University Press adopts a modified nonsexist language policy requiring gender-neutral construction for all Press-authored copy; recommends gender-neutral construction for author manuscripts with exceptions granted for disciplinary precision and historical fidelity; and preserves the integrity of all direct quotations and cited works regardless of gendered language; effective January 1, 2024."

  I look forward to discussing this framework with you on Thursday.
