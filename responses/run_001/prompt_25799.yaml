answer: |-
  This is a classic philosophical standoff. You witnessed a live-fire engagement between **Epistemicism** (David) and **Semantic Indeterminacy** (Elena). Neither is objectively "wrong" according to the state of contemporary analytic philosophy; indeed, this specific debate is one of the most active frontiers in the philosophy of language and logic.

  However, that doesn't mean all arguments carry equal weight. To help you settle the score (and perhaps stop the argument from haunting you), let’s break down their exchange move by move, evaluating the strength of their claims against the current philosophical consensus.

  ### Round 1: The Nature of the Boundary
  **David:** *"If there were no fact of the matter... we'd have to abandon bivalence... The boundary exists; our ignorance of it doesn't mean it isn't there."*
  **Elena:** *"Why should there be a precise number of hairs?... The word simply doesn't work that way — its meaning underdetermines a cutoff."*

  **Analysis:**
  *   **Elena is right about human intuition.** Linguistically, speakers of English do not feel like the concept "middle-aged" switches from false to true after exactly one minute. It feels like a gradient. Denying this phenomenological experience (our lived sense of language) is counter-intuitive.
  *   **David is right about semantic realism.** If meaning determines reference, and if "bald" applies to some people but not others, then logically there must be a line where it stops applying. If David accepts that reality consists of definite states of affairs, he must accept that "X is bald" cannot be neither true nor false unless reality itself is indeterminate—which is a heavy metaphysical lift.
  *   **Winner:** **Elena** describes how language *feels*; **David** describes how logic *demands* things behave if reality is discrete.

  ### Round 2: The Cost of Logic (Your Specific Question)
  **David:** *"Since we rely on bivalent logic for everything from computer science to legal reasoning, the cost of giving it up is too high."*
  **Elena:** *"Judges interpret vague statutes without pretending there's a hidden sharp line, and the system doesn't collapse."*

  **Analysis:**
  *   **On the "Cost" Argument:** David’s argument is strong on pragmatism but weak on metaphysics. Yes, digital computers run on binary logic. Yes, a court case ultimately yields a "Guilty/Not Guilty" verdict. However, natural language processing (AI), traffic laws regarding "safe speeds," and medical diagnoses (healthy/sick) all grapple with this constantly. Giving up strict bivalence doesn't crash the system; it usually shifts us to probabilistic reasoning or fuzzy logic. David is correct that abandoning classical logic complicates reasoning, but claiming it breaks reasoning is an exaggeration. Modern mathematics can model vagueness without bivalence.
  *   **On the Legal Analogy:** Elena’s use of the law is a brilliant heuristic, but it is not a proof. The law often relies on "bright-line rules" (strict boundaries) created specifically to avoid vagueness. When judges rule on vague statutes, they are essentially creating *de facto* sharp boundaries for the case at hand (precedent). David could reply: "Exactly! You force a decision, so a boundary was drawn."
  *   **Winner:** **Elena** wins on the *practice* of the law (the law thrives on discretion). **David** wins on the *logic* required to enforce decisions (you cannot execute a sentence on a "partially true" person; you must treat them as fully guilty or innocent).

  ### Round 3: Higher-Order Vagueness (The Killer Feature)
  **David:** *"You get higher-order vagueness: where is the boundary between 'true' and 'borderline'? ... You either posit another sharp cutoff there or you get an infinite regress."*
  **Elena:** *"The regress isn't vicious — it just shows that vagueness is ineliminable."*

  **Analysis:**
  *   This is the technical crux of the debate.
  *   **David’s Attack:** If you say there is a range of "borderline" hairs, where does "borderline" end and "clearly hairy" begin? There must be a line there. If there isn't, then the concept of "borderline" is also vague. If that is vague, there is a boundary around that, ad infinitum. David calls this a vicious regress that his theory avoids by placing just *one* unknowable boundary.
  *   **Elena's Defense:** Many semantic theorists (like supervaluationists) argue that this isn't a failure of their theory; it's a description of competence. We understand terms like "tall" knowing there are clear cases, unclear cases, and clear cases of the unclear.
  *   **Consensus Check:** In recent decades, David’s position (Epistemicism) has gained significant traction in academic philosophy (championed heavily by Timothy Williamson). Why? Because mathematically, it is much easier to build a consistent logical system that admits one sharp boundary than one that admits infinite borders around borders. David's view preserves the elegance of classical logic at the cost of common sense. Elena's view preserves common sense at the cost of logical elegance.

  ### Summary: Who is Right About What?

  **David is correct that:**
  1.  **Bivalence is useful:** Preserving classical logic keeps mathematical and computational frameworks stable.
  2.  **The regress problem is real:** Any theory that introduces a "third category" (borderline) has to explain where that category ends, leading to complexity that Epistemicism sidesteps.
  3.  **Unknowability isn't absurd:** We already accept we can't define the exact point a coastline ends and the ocean begins, yet we speak of coastlines as having edges. Ignorance of a limit is not proof the limit doesn't exist.

  **Elena is correct that:**
  1.  **Meaning is flexible:** Language is designed for flexibility, not precision. Demanding sharp boundaries imposes an artificial rigidity on organic concepts.
  2.  **Metaphysics shouldn't bow to logic:** Just because our logic prefers binaries doesn't mean the world *is* binary. Reality might be continuous, making sharp boundaries metaphysically extravagant.
  3.  **Functionalism works:** Systems (law, social norms, biology) function perfectly well without sharp cutoffs. We survive using vague predicates without needing to find their "magic numbers."

  ### The Verdict for Your Party Friends

  If you had to tell them who won the night:

  *   **In the Courtroom:** **Elena wins.** Courts operate on degrees of evidence and reasonableness. They acknowledge grey areas daily. A judge saying, "I cannot determine if he is middle-aged so I declare him undefined" is absurd; declaring him one thing or the other based on best interpretation is standard.
  *   **In the Computer Lab:** **David wins.** If you code a program `if (age == middle_aged)`, it needs a definitive cutoff. If the code crashes because the definition is fuzzy, the machine goes dark. David's view protects the machinery of truth.
  *   **In Philosophy:** **It is a draw, but with momentum shifting toward David.** While Elena's view feels more true to human experience, David's view is considered by many philosophers as the only one that saves the validity of classical logic without resorting to mathematical gymnastics.

  ### How to Resolve It

  You can tell them this: **"David is right that we need boundaries to function logically; Elena is right that the boundaries are arbitrary and imposed by us, not found in nature."**

  David treats vagueness as an **epistemic problem** (we don't know the line); Elena treats it as a **semantic problem** (there is no line). Neither is provably false.

  *   If you believe the universe is fundamentally discrete (pixels of reality), David is right.
  *   If you believe the universe is fundamentally continuous and language is a tool we project onto it, Elena is right.

  Their argument isn't about facts; it's about whether logic mirrors the world (Elena) or if the world must accommodate logic (David). That distinction should give your friends a way to agree to disagree without admitting defeat.
