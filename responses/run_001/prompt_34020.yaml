answer: |-
  To successfully resolve David Lewis’s triviality results, one must abandon the assumption that indicative conditionals are truth-evaluable propositions governed by classical Boolean logic, thereby saving the Adams thesis as a valid account of conditional belief.

  Lewis's triviality proofs demonstrate that if the Adams thesis—the claim that the probability of a conditional equals the conditional probability of its consequent given its antecedent, formally $P(A \rightarrow B) = P(B|A)$—is combined with the assumption that $A \rightarrow B$ denotes a proposition with a fixed extension across possible worlds, the resulting probability space collapses into triviality where all non-zero probabilities become 1. This mathematical result arises because standard probability theory assumes that propositions form a Boolean algebra closed under conjunction and negation; when the conditional operator is treated as generating such a set, the equation forces constraints that eliminate statistical dependencies, effectively making learning impossible. Consequently, defenders of the Adams thesis and defenders of standard propositional logic are forced into a choice between three mutually exclusive claims: that the Adams thesis is false, that conditionals are not propositions, or that probability theory operates on a non-classical algebra.

  Proponents of the Adams thesis, such as Dorothy Edgington, typically resolve the tension by denying that conditionals have truth conditions. They argue that indicative conditionals do not describe states of affairs but instead express the agent's conditional commitment, functioning similarly to assertions rather than propositions. This move saves the intuitive link between credence and probability but necessitates giving up on treating conditionals as inputs to classical logical operators, creating significant challenges for explaining nested conditionals, the negation of conditionals, and their behavior in larger arguments. On the other hand, truth-conditionalists who wish to maintain that conditionals are propositions must reject the strict identity of the Adams thesis. They might follow Stalnaker by distinguishing between the probability of a proposition and the degree to which it is assertible, accepting that while $P(A \rightarrow B)$ tracks $P(B|A)$, they are not identical, or they must accept that Modus Ponens or other logical rules fail for conditionals to prevent the trivialization.

  In the end, the anti-truth-conditional position lands in better shape because it respects the most robust piece of empirical evidence: humans consistently evaluate conditionals using conditional probabilities. The cost of forfeiting truth conditions is primarily technical, concerning how we model the syntax of embedded contexts, whereas retaining truth conditions requires distorting either our fundamental understanding of rational belief (rejecting Adams) or standard probability theory. While the expressivist solution struggles with compositionality, it aligns better with the pragmatic reality that conditionals act as tools for reasoning rather than descriptions of reality, avoiding the absurd logical implications that arise when forcing them into the rigid architecture of classical propositional logic.
