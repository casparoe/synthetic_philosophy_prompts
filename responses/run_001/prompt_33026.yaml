  Those who worked with him know he spent thirty years teaching *Fear and Trembling*, studying the story of Abraham preparing to sacrifice Isaac. Most read that text as a warning against madness or a paradox of theology, but for Martin it was a map. He believed that sometimes the universal ethical duties we share—to our families, our society, our neighbours—are not absolute, and can be suspended for a private, higher obligation that admits of no public defence. To his colleagues, this looked like a breakdown; to those of us who loved him, it looked like a terrible kind of courage, though I will not pretend that seeing him suffer the weight of such a choice did not terrify me as much as it inspired admiration.

