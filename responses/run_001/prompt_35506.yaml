      *   **Logic Flow:** Build from shared ground (biology/ecology) $\rightarrow$ Introduce the moral consideration (welfare) $\rightarrow$ Introduce the population dynamics math $\rightarrow$ Address the habitat paradox $\rightarrow$ Clarify ethical implications vs. policy prescriptions.
      *   **Key Risk:** They might hear "Habitat destruction = Good" immediately and shut down. The argument must be framed as "Here is a tension within our current ethical framework," not "Here is the solution."

  3.  **Drafting the Sequence (The "Arc"):**

      *   *Phase 1: Rapport & Shared Ground.* Start with what they value. Biodiversity, ecosystem function. Acknowledge the discomfort early.
      *   *Phase 2: Defining "Suffering."* Biologists know stress responses, cortisol, nociception. Use this scientific common language before introducing philosophy.
      *   *Phase 3: The Population Dynamics Reality.* This is where they have expertise. r-selection strategies, predator-prey cycles, density dependence. Show them the *numbers* (birth rates vs. death rates).
      *   *Phase 4: The Ethical Tension.* Now introduce the philosophical question. If suffering exists at scale, does conservation inadvertently perpetuate it?
      *   *Phase 5: Addressing Misconceptions (The "Bulldozer" Fear).* Explicitly separate descriptive claims from prescriptive ones.
      *   *Phase 6: Conclusion/Future Work.* Open questions.

  4.  **Selecting the Case Study:**
      *   Needs to be biological, not just philosophical.
      *   Needs to illustrate high mortality/stress without being too gruesome (to avoid emotional hijacking).
      *   *Candidate:* Rodents or Invertebrates? Too generic.
      *   *Candidate:* Predator-prey interaction? Classic, but maybe feels like "predation is good" defense.
