      *   *Best Selection:* **The Life Cycle of a Common Field Mouse (Microtus).** It hits all notes: high birth rate, high predation, disease, starvation, short life, massive reproductive output required to maintain population stability. It grounds the "numbers game" in biological reality they know well.

  5.  **Addressing Misconceptions (Anticipation):**
      *   *Misconception 1:* "Nature is Balance/Harmony." (Teleological fallacy).
          *   *Placement:* Early. When discussing mortality rates.
      *   *Misconception 2:* "Natural = Good." (Naturalistic Fallacy).
