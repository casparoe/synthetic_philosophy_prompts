answer: |-
  Your hunch is astute: the deadlock in your reading group is not evidence of empirical ambiguity, but rather a structural collision between incompatible frameworks. You are correct to suspect this is not primarily a debate about where the mind ends, but a dispute about what the word "mind" is supposed to do for us.

  To diagnose the structure, we must distinguish between a verbal dispute, a substantive one, and a case of cross-purposes. This debate sits uncomfortably at their intersection. It is **conceptually verbal** but **methodologically substantive**.

  ### The Structural Diagnosis
  The core friction arises because "cognition" functions differently for each faction.

  For the **Internalists** (the half who see the notebook as a tool), "cognition" tracks a natural kind grounded in biological constitution. They demand that mental states possess non-derived content or causal properties intrinsic to the nervous system. For them, the question "Where does the mind stop?" is actually "Where does the relevant biological mechanism stop?"

  For the **Externalists** (the half who see Otto’s mind as extending), "cognition" tracks a functional role within a larger adaptive system. They ask, "What system is successfully navigating the world using these resources?" Here, the mark of the mental is reliability and accessibility, regardless of location.

  Because both sides agree on the empirical facts (Otto retrieves beliefs just as Inga does), they cannot win via data. Instead, they are arguing over which features of the scenario are theoretically significant. This is why you observe a stalemate: neither side is wrong about the world; they are describing different theoretical objects under the same name.

  This suggests your group is effectively debating **two different questions** run under the heading of “where does the mind stop.”
  1.  **The Mechanistic Question:** What are the physical substrates responsible for this capacity? (Internalist priority)
  2.  **The Explanatory Question:** What constitutes the minimal unit of rational agency? (Externalist priority)

  Furthermore, your intuition regarding explanatory standards holds up. Internalists typically privilege **subpersonal mechanistic explanations**, seeking to isolate the neural algorithms that generate output. Externalists often prioritize **personal-level or ecological explanations**, where the agent-environment coupling is the unit of analysis. If you demand a subpersonal breakdown, the notebook fails (it has no neurons). If you demand a personal-level functional account, the notebook succeeds (it is part of the belief-holding loop). When your group members treat their preferred explanatory standard as the "obvious" one, they talk past each other.

  ### What Would Count as Progress?
  Given this diagnosis, expecting a decisive experiment is unlikely. Empirical studies showing that coupled systems behave similarly to internal ones merely confirm the parity principle, which Internalists accept but reject as irrelevant to ontology. Conversely, proving neural isolation occurs doesn't refute functional integration.

  Progress would require a shift in framework rather than a discovery of fact.

  1.  **A Distinction:** The most immediate progress would be distinguishing "cognitive constitution" from "cognitive scaffolding." If the group agrees that the notebook changes *how* we think without necessarily being part of the *constitution* of the mind itself, much heat vanishes. This concedes that functional roles can be distributed without requiring ontological merging.
  2.  **Formal Modeling:** Rather than thought experiments (Otto/Inga), progress often comes from formal models of information integration (e.g., Integrated Information Theory applied to human-tool systems). If we can mathematically define a threshold of integration where a system becomes "one" versus "two," the debate moves from metaphysics to complexity theory.
  3.  **Changing the Question:** The most fruitful path is abandoning the boundary-drawing project entirely. Instead of asking "Is the notebook part of the mind?", ask "Under what conditions does environmental coupling enhance, degrade, or transform cognitive capacities?" This shifts the focus from static classification to dynamic interaction.

  ### Why It Persists
  Despite the potential for reframing, expect the debate to continue indefinitely. There are deep-seated philosophical values at stake that prevent easy resolution.

  Internalism protects the autonomy of the individual organism and the distinctiveness of biological psychology. It preserves the idea that there is a core "self" located within the skin. Externalism champions a view of intelligence that is deeply embedded in culture and tools, resisting biological chauvinism. These are not just technical disagreements; they reflect competing visions of human nature.

  Therefore, the debate will likely persist not because we lack evidence, but because we lack consensus on what a theory of mind should capture. If your goal is to resolve it, propose that your reading group stop asking "Where is the mind?" and instead ask "What work does the concept of 'mind' do in this specific theoretical context?"

  If the term is used to predict neural firing patterns, internal boundaries matter. If it is used to design educational tools or AI interfaces, extended boundaries matter. Recognizing that "mind" is a polysemous tool for modeling, rather than a singular thing to be found, may finally allow your group to make progress—not by agreeing on where Otto's memory is, but by agreeing on what they are trying to model.
