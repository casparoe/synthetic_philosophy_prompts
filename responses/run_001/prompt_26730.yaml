answer: |-
  The sun had dipped below the eastern ridge, casting long shadows across the path leading from the *pandit-shala* to the lodgings. Arya-vacas, the Naiyāyika, rubbed his shoulders. Beside him walked Dharma-jnana, the Buddhist logician, his robe dusted with the red earth of the road.

  "That was spirited," Arya-vacas said, breaking the silence. "But your reduction of all valid knowledge to just two instruments—*pratyakṣa*, or perception, and *anumāna*, or inference—is too aggressive."

  Dharma-jnana smiled faintly. "The world is complex, my friend, but our means of knowing need not multiply to match every error in cognition. Take *śabda*, or testimony. You argued that when a teacher says 'Fire burns,' we gain knowledge without inferring anything about the speaker. I maintain otherwise."

  "I stand by it," Arya-vacas replied briskly. "Sentence comprehension is immediate. When I hear your words, I grasp the meaning through the power of the words themselves (*śakti*), not by calculating your reliability. Consider this: If I tell you a lie, you still understand the sentence. If *śabda* were merely *anumāna* regarding the speaker's trustworthiness—a *linga* or sign pointing to the truth—you should fail to understand me when I deceive you. But you understand perfectly well, which proves the instrument of knowledge is the linguistic connection itself, independent of inference."

  "The distinction between the signification of words and the truth of the statement is vital," Dharma-jnana countered smoothly. "You confuse grasping the *intention* with verifying the *fact*. What we infer is the speaker's intended meaning based on the convention of words (*saṃketa*). The fact itself may be false, but the cognitive operation relies on perceiving the link between the signifier and the significator, a link established only through repeated observation of usage. Where did you learn that 'fire' signifies heat? Not from the words themselves, but from observing people using them correctly over time. That observation is inference."

  Arya-vacas shook his head. "If everything is observation-based, then there can be no novel information, only recalled patterns. And how do we account for the unique validity of Vedic statements? They are authorless. You cannot infer their reliability from a person you have seen."

  "Vedic authority rests on the eternal reliability of the words, which is ultimately grounded in the universal law of causality. But let us not hide behind scripture. Let us walk further, to your *upamāna*, or comparison. This is where your list truly expands beyond necessity."

  They passed a grove of neem trees. The air grew cooler.

  "Ah, the wild ox," Arya-vacas said. "Consider the standard case. A city dweller has never seen a *gavaya*. His father tells him, 'A *gavaya* resembles a cow.' Months later, standing in the forest, he sees an animal. He recalls the description, notes the resemblance, and cognizes, 'This is a *gavaya*.' Now, is this perception? No, for the name was not present. Is it *anumāna*? There is no *vyāpti*, or invariable concomitance, linking 'similarity to a cow' to 'being a gavaya' universally. Some animals resemble cows but are not gavayas. Nor is it *śabda*, as he hears nothing now. It is a distinct cognition born of similarity itself."

  Dharma-jnana stopped to look at a distant hill. "You carve out too much ground for psychology. The man remembers the father's instruction—that is testimony. He perceives the animal—that is perception. The connection between the two occurs in memory (*smaraṇa*). If the resulting knowledge is accurate, it is because he successfully perceived the likeness and inferred its identity based on the earlier rule. You claim a fourth source to describe a complex act of recognizing a pattern."

  "But what of the specific insight gained?" Arya-vacas pressed. "In memory, I recall the *description*. In perception, I see the *animal*. Neither yields the identification 'This is the object of that description' without the act of comparing them. If it were mere inference, I could deduce it anywhere without the visual presence. If it were testimony, I would know it while sitting home. The cognition arises only at the conjunction of the seen object and the remembered verbal cue via resemblance. That is a unique causal factor."

  "It seems to me you reify a psychological function," Dharma-jnana retorted. "If I see smoke and infer fire, I rely on *vyāpti*. If I see a deer and recall 'that thing was called a horse,' I rely on memory and the previous verbal instruction. To posit a separate *pramāṇa* for 'comparison' is to mistake the content of the cognition for the instrument. The instrument was always inference or memory."

  "Reductionism blurs the lines of efficacy," Arya-vacas warned gently. "If I treat *upamāna* as inference, I risk demanding a universal rule that cannot exist. Resemblance is particular. The *gavaya* is not identical to the cow; it is merely similar. The certainty I feel—that this specific animal is indeed a *gavaya*—cannot stem solely from an inference based on imperfect similarity. Nor can it come from memory alone, which preserves the past, whereas *upamāna* apprehends the *present* object's identity. Without this fourth instrument, we cannot explain how names apply to objects we encounter in the wild."

  Dharma-jnana resumed walking. "Then you grant that without the prior testimony, there is no knowledge of the name. And without the perception, there is no object. The synthesis is mental construction. You defend four pillars, I see only two structural supports holding up a house of concepts. Perception gives the raw data; Inference builds the relationships—including those of similarity and language."

  "And yet," Arya-vacas concluded, pausing before the gate of the lodge, "you admit that the relationship between the word and the object is real. If it is real, it cannot be merely inferred from unreliable human habit. And you admit that the identification of the *gavaya* relies on the specific feature of resemblance, which is not a generic rule. We differ on whether these functional distinctions warrant ontological separation."

  "Cognition requires analysis," Dharma-jnana said, stopping to turn his friend. "We agree on perception. We agree that inference covers logical necessity. But to call a specific instance of recognition a separate *pramāṇa* multiplies entities without saving appearances. I will accept that your framework is pragmatically useful for teaching students. But logically, the Buddhist view holds fewer assumptions."

  "And I," Arya-vacas said with a nod, "concede that your two-fold division captures the core mechanisms of the mind efficiently. Yet, until you show exactly where the *gavaya* cognition splits back into its constituent parts without loss of its identifying character, I shall keep comparison in my ledger."

  "Until you demonstrate how a lie conveys meaning without inference, I shall hold my position."

  With mutual bows and the weight of the unsolved remaining on their shoulders, they entered the courtyard, leaving the path behind.
