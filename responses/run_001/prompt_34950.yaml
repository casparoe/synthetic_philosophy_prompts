answer: |-
  This is a familiar and exhausting wall. You are correct that the field is currently in a patch-work phase: most "solutions" to fanaticism (Pascal's Mugging, St. Petersburg Paradox) are essentially *ad hoc* modifications of the utility function or the probability measure. There is no consensus on which axiom to break, only on which consequence is "least bad."

  For a three-year PhD with formal training but no empirical access, you cannot just critique the existing patches. You need to build a structural argument that explains *why* the standard model fails and what the minimal repair looks like.

  Here is my defended agenda. I will rank the questions by **strategic leverage**—meaning, solving which one makes the others easier or obsolete.

  ### 1. The Axiomatic Cost of Non-Fanaticism
  **The Question:** Exactly which standard rationality axioms must be violated to guarantee that a sequence of increasing payoffs with rapidly decreasing probabilities does not dominate a safe option?

  *   **Status:** Upstream / Foundational.
  *   **Tractability:** High for a formal theorist.
  *   **Reasoning:**
      Currently, most responses to fanaticism pick a defense (e.g., "Bounded Utility") and defend it against specific objections. You should do the reverse. Systematically prove which axioms of the von Neumann-Morgenstern (vNM) framework—Independence, Continuity, Transitivity, Monotonicity—mutually imply fanatical behavior under unbounded support.
      Specifically, investigate the **Archimedean/Continuity axiom**. This is the mathematical levers that allows $p \cdot u(Huge) > u(Safe)$.
      If you can characterize the precise logical gap required to ban fanaticism, you provide a map for the whole field. For example, proving that *any* theory satisfying Continuity and Independence is vulnerable to fanaticism forces the next generation of theorists to abandon one of those.
  *   **Tracking the Trend:** This moves down in priority if a rival framework (e.g., Rank-Dependent Utility) becomes dominant in the general literature. However, because the "standard" view is so entrenched, showing exactly what breaks vNM is high-value forever. If you show that rejecting Continuity saves rationality without killing transitivity, you change the terms of engagement.

  ### 2. Epistemic Limits on Low-Probability Claims (The Prior Problem)
  **The Question:** Can we formally derive "effectively zero" probabilities from principles of information theory, logical uncertainty, or calibration, rather than stipulating them?

  *   **Status:** Middle-stream / Application.
  *   **Tractability:** Medium (Requires logic or probability theory skills).
  *   **Reasoning:**
      The fanatical agent assigns a non-zero probability to every logically consistent outcome (the "Muggle" can exist). But do they have the information-theoretic capacity to justify updating on that hypothesis?
      This approach treats the probability assignment, not the utility calculation, as the flaw. You would explore whether priors over "astronomical claims" should be penalized based on the **description length** or **computational resources** required to verify the claim. This aligns with Solomonoff Induction but applied to decision theory.
      If you can argue that a rational agent *cannot* hold the credence necessary to trigger the switch to the high-payoff option (because holding that credence costs more belief-updating energy than the potential gain), you bypass the need to touch the utility function entirely.
  *   **Tracking the Trend:** This moves **up** in priority if AI alignment research continues to integrate machine learning priors into philosophy. As logical uncertainty gets more rigorously defined, decision theories that account for the *cost* of computation will look more attractive than those assuming infinite processing power.

  ### 3. Robustness and Sensitivity Analysis as Normativity
  **The Question:** Is the correct decision criterion not "maximizing expected value," but "maintaining preference orderings stable under small perturbations of the tail"?

  *   **Status:** Downstream / Meta-Normative.
  *   **Tractability:** High (Analysis/Math focused).
  *   **Reasoning:**
      Here you accept that EV is a tool, but you argue that a recommendation is invalid if it flips due to a 0.01% change in the tail of a massive distribution. If Option A beats Option B *only* because of a $10^{-50}$ chance of god-like utility, the model is fragile.
      Your thesis would propose a **Robust Maximization** criterion: maximize EV subject to the constraint that the ranking holds within a neighborhood of plausible tail distributions.
      This is less about "fixing" EV and more about adding a second-order stability constraint. It reframes fanaticism not as a paradox to be solved, but as a symptom of model fragility.
  *   **Tracking the Trend:** Moves **up** if the "Longtermist" movement fractures over disagreements on specific tail-event probabilities. It provides a decision procedure that remains valid even when agents disagree wildly about the exact odds of the end of the world.

  ---

  ### What is Overrated (The "Trap")
  Do not spend your time debating the **Pascal's Mugging Thought Experiment** itself.
  There are dozens of papers arguing about whether the mugger is "really" offering a deal or whether the promise is "verifiable." This is rhetorical wrestling. It does not advance the mathematical understanding of the preference relation.
  Similarly, do not try to defend **Bounded Utility** without the axiomatic work in Point #1. The debate is stuck at "is utility really bounded?" The answer is likely "we don't know, but here is why acting as if it is unbounded breaks things." Don't get bogged down in moral philosophy debates about the cardinality of value; stick to the structural properties of the choice function.

  ### My Recommendation for You

  If I were your advisor, I would push you toward **Priority #1 (Axiomatic Cost)** combined with elements of **#3 (Robustness)**.

  **Why?**
  Because with a three-year timeline, you need a clear result. "Prove that X combination of axioms implies Fanaticism" is a concrete theorem you can prove. "Fix the priors" (#2) risks getting lost in computer science/logic debates outside decision theory proper. "Sensitivity Analysis" (#3) is great, but needs the theoretical boundaries established by #1 to be rigorous.

  **Dissertation Strategy:**
  1.  **Year 1:** Formalize the conditions under which vNM axioms + Unbounded Utility = Fanaticism. Show exactly which combinations allow it.
  2.  **Year 2:** Propose a weakened axiom set that blocks the derivation while preserving transitivity and basic ordering (perhaps a modified Continuity axiom).
  3.  **Year 3:** Apply this system to a simplified Longtermist scenario to show how the output stabilizes compared to standard EV.

  **The "Field is Confused" Reality:**
  The field is confused because everyone is trying to save Expected Utility Theory, but it might be the wrong object. By proving which axioms must fall, you stop trying to prop up a collapsing roof and start laying new foundation stones. Even if your specific axioms turn out to be imperfect, showing the *necessity of breaking* them is a lasting contribution.

  Don't try to solve the "right" theory for civilization. Solve the *logic of the breakdown*. That is a manageable, defensible, and high-impact PhD project.
