      *   But sticking to the user's essay structure: I shouldn't overhaul their theory summary, just their argument against it.
      *   Crucial distinction: Is the "selection story" normative? If "success" in evolution is just "survival," it's descriptive. If "success" means "fitting purpose," it's normative. Millikan argues functions explain why organisms work. Critics say functions *are* norms.
