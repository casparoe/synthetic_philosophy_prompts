answer: |-
  This is a sharp and well-structured draft. You clearly grasp the basic architecture of Millikan’s project and the standard lines of criticism. For a graduate seminar context, this is a solid starting point. However, your suspicion regarding the final paragraph is warranted: while the intuition is right, the specific terminology ("tracking") and the logical link might be vulnerable to a Millikanian counter-attack.

  Here is a breakdown of my comments, addressing your three specific questions, followed by some suggestions for revision.

  ### 1. Comment on the Final Paragraph ("Selection for Tracking")
  Your worry is: *Millikan claims evolution is non-normative, but the phrase "selected for tracking X" smuggles in the very correct-correlation relation the theory tries to explain.*

  **Is this step sound?**
  It is intuitively compelling, but technically imprecise enough that a Millikan defender could dismiss it easily.
  *   **Terminology Risk:** Millikan is careful to avoid using high-level intentional terms like "tracking" in her definition of proper function. She speaks instead of causal roles, reproductive lineages, and consumption systems. A defender will argue that you are conflating the *product* (the belief representing a predator) with the *mechanism* (a neural state causing flight when stimulated by retinal inputs).
  *   **The "Blindness" of Selection:** Natural selection does not "see" or "track." It simply selects for traits that contribute to survival. To say "it was selected *for* X" is shorthand for "instances of X-causality existed in ancestors that led to higher reproduction rates." That is a purely mechanistic/descriptive claim.
  *   **The Weakness:** Your argument relies on the premise that "selection for X" inherently presupposes a relationship of "truth" or "accuracy" between the trait and X. Millikan would deny this. She argues the normativity arises only once you analyze the *internal structure* of the organism (the mapping between producer and consumer), not in the raw fact of selection.

  **How to tighten it:**
  Instead of arguing that "selection implies tracking," argue that **identifying the 'target' of selection presupposes the representation.**
  To say the heart was selected for pumping blood is easy—we see blood flowing to limbs. But to say a specific *neural firing pattern* was selected for representing a *predator*, you must already be able to distinguish the predator representation from other co-occurring causes (wind, rustling leaves, etc.) in the historical environment. If the historical data doesn't distinguish these causes objectively without invoking the very intentionality you are trying to explain, the etiological anchor is floating.

  ### 2. Is the Overall Objection as Strong as You Think?
  **Yes, but it is a familiar battle.** The "circularity" objection is one of the oldest and most robust critiques of teleosemantics (often associated with Block, Burge, or early discussions involving Cummins). Millikan addresses this repeatedly (most notably in *Mental Reality* and her responses to Fodor).

  If you stick strictly to "Definition A depends on B, and B depends on A," Millikan has a stock answer: It is a **non-vicious, explanatory circle** grounded in material history. She admits the concept of "proper function" is normative, but argues that biological normativity is distinct from moral or mental normativity.

  To make this objection hit harder in a graduate seminar, you need to show that the "circle" isn't just logical but **ontological**. You need to argue that the *ground* of biological function cannot exist without the phenomenon being explained.

  ### 3. Cleaner or More Pressing Versions of the Circular Worry
  If I were aiming to write a seminar paper pushing back on Millikan, I would sharpen your objection in one of two ways. Both are arguably more precise than the "tracking" worry.

  #### Option A: The "Normative Inheritance" Objection (Strongest for Circularity)
  This argues that Millikan hasn't naturalized normativity; she has merely displaced it.
  *   **The Argument:** For teleosemantics to ground semantic normativity, biological normativity must be less "normative" than semantic normativity. But biological functions (healing, digestion, fighting) are *also* defined by success conditions and malfunction.
  *   **The Circle:** If "proper function" is already normative (meaning the organ *ought* to do X to function well), then using it to explain the normativity of beliefs is explaining "oughts" with "oughts." You haven't naturalized content; you've reduced one type of normativity to another. Unless you can provide a *purely descriptivist* account of biological function that doesn't use modal/normative language (which is extremely difficult, given that function-talk implies failure conditions), the naturalization fails.
  *   **Why better?** It attacks the foundation directly rather than getting bogged down in the semantics of "tracking."

  #### Option B: The "Indeterminacy" / "Grain" Objection (More Standard/Fodor-esque)
  While not strictly circularity, this is often seen as the killer constraint for teleosemantics.
  *   **The Argument:** In any given evolutionary history, a representation co-varies with many things (The predator *and* the air pressure drop *and* the color of the shadow). Natural selection selects for the behavior (flight), but it cannot specify *which* aspect of the causal stimulus triggered the selection. Was the function to track "Predators" or "Moving Dark Shapes"?
  *   **The Connection to Circularity:** To fix the specific content ("Predator"), you must appeal to the organism's *interest* or *conceptual capacity*. But those capacities are what the content theory is supposed to explain. If the history alone is insufficient to pick out the content (because multiple properties map to the same successful behavior), you need the very representational machinery to interpret the history.
  *   **Why better?** This shows that history *plus* normativity cannot determine content without smuggling in a prior determination of what counts as the "relevant property."

  ### Suggested Revisions to Your Draft
  I recommend pivoting your third paragraph away from "tracking" and toward the status of **biological normativity**.

  **Here is a suggested rewrite for the final paragraph (combining your intuition with the "Normative Inheritance" angle):**

  > "I think, however, that this response does not fully break the circle. While the etiological grounding removes the immediate circularity between function and correctness, it shifts the problem to the nature of biological normativity. Millikan treats the 'proper function' as a historical fact, but identifying a trait's contribution to reproductive success—distinguishing it from mere accidental byproducts—already invokes a standard of biological fitness. If this biological standard is itself normative (distinguishing between how an organism *actually* functions and how it *should* function to survive), then explaining mental normativity in terms of biological normativity is merely shifting the burden of proof. Unless Millikan can explicate biological normativity in purely descriptive terms—which seems impossible without appealing to the very functional concepts she deploys—the circularity remains unbroken. The theory explains mental content by positing biological functions, but only by presupposing that biological functions themselves possess the normative authority required to ground content."

  ### Summary Advice
  1.  **Don't abandon the draft:** It's a good entry point.
  2.  **Drop "Tracking":** Replace it with "identification of the selected property" or "contribution to fitness."
  3.  **Focus on Biological Normativity:** Argue that "function" is inherently normative. If functions are normative, and you use functions to explain content, you haven't naturalized content (given that naturalism aims to eliminate irreducible norms).
  4.  **Check Secondary Lit:** Look up **Peter Godfrey-Smith** (on the distinction between selected effects and current utility) and **Richard Joyce** (on the evolution of morality/function overlap). They articulate the "Normative Inheritance" version of your worry well.

  Good luck with the seminar paper. Millikan is tough to pin down, but finding the crack in the naturalization of normativity is definitely the right place to look.
