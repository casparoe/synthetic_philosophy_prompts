answer: |-
  The bar was crowded enough that conversation required leaning in over the clatter of ice against glass. N signaled for another round while U swirled a half-empty lager.

  "That talk about brutish composition was maddening," N said, rubbing their temples. "Just declaring a boundary where one seems arbitrary? That doesn't explain anything."

  "I agree," U replied. "It treats composition as a primitive fact. Fine, but then what grounds your modal claims? If the rules are arbitrary, why should we believe the fusion of those particles persists when the arrangement breaks?"

  "Exactly!" N said, pointing a finger. "That's why Nihilism wins. There are only simples. Particles arranged 'dog-wise,' particles arranged 'beer-glass-wise.' No magic moment where they suddenly compose a whole. It stops the regress cold."

  "But it creates a gap," U countered, taking a sip. "You have simples arranged chair-wise, but no chair. So when I sit down, what do I fall into? Nothing? Or does my body interact directly with billions of separate particles? Your picture of causation gets messy. How do particles conspire to make me stop falling if there's no surface to arrest the fall?"

  "It's not that there's nothing arresting the fall," N argued patiently. "It's that the 'surface' isn't an object. It's a region of space densely populated by interacting simples. We describe it as 'falling into a chair' because the arrangement supports weight. But asserting the *existence* of the chair adds a new entity that does no independent causal work. It's redundant."

  "Redundant maybe, but harmless," U sighed. "Look, I know you hate the Trout-Turkey fusion. Van Inwagen loves that thought experiment. He says if we allow composites arbitrarily, then a random collection of birds and fish somewhere forms a legitimate object. That violates our intuition about natural kinds."

  "It shouldn't violate our intuition," N snapped. "That's a *reductio*. If your theory allows a 'trout-turkey' to be as real as a human hand, your theory is broken. It multiplies entities beyond necessity. If composition is universal, then for any collection of parts, there is an aggregate. That means reality is swarming with ghosts."

  "No, it means reality has structure," U corrected. "You're conflating 'exists' with 'is salient to us.' The trout-turkey exists, yes. But it lacks a unified function, a name in our language, or biological persistence. Its boundaries are gerrymandered in the same way a map of political borders is. Just because the border is arbitrary doesn't mean the land on both sides doesn't exist. Why should ontology care about our vocabulary?"

  "That's precisely the point!" N leaned forward. "Metaphysics is supposed to tell us what the world is made of, not how well we label it. If you say the trout-turkey exists, you're letting linguistic convenience dictate ontology. You think you can ignore the vagueness, but you can't. Where does the trout end and the turkey begin? You've got to cut the line. If you admit arbitrary cuts for aggregates, why not admit arbitrary cuts for lives? Why am I a thing, but a mere aggregate of cells isn't?"

  U paused, swirling the beer. "Because 'I' is a convenient fiction too?"

  "Don't slide," N warned. "If you're willing to bite that bullet, you might as well go full Universalist. Everything that could be a part of something else, is part of something else. Infinite layers of nesting. That feels like inflation."

  "Better inflation than deletion," U said firmly. "Think of the cost, though. For you, 'There is a bottle on the table' is strictly false. Or at best, an elliptical approximation. Every sentence involving common nouns becomes a lie. How many times a day do people speak the literal truth?"

  "We speak literally enough," N said. "'There are particles arranged table-wise' captures all the relevant physics and geometry. 'There is a table' loses precision. If we want truth-makers, simples give us robust ones. Aggregates are just collections. Why grant the collection status when we already have the members?"

  "Because composition is a relation, not a collection," U insisted. "When parts fuse, they form a unity that has properties its parts don't have independently. The table resists force as a whole. If Nihilism is right, we lose the explanatory power of macroscopic objects. Science talks about tables, molecules, stars. You reduce it all to the bottom layer. At some point, that looks less like discovery and more like reductionist imperialism."

  N shook their head. "And Universalism looks like semantic surrender. You accept every combination because the math requires it. But then you have to account for the difference between a table and a trout-turkey. How? Vagueness? Modal properties? You're building a house on quicksand to avoid the vacuum."

  The bartender dropped fresh coasters between them.

  "Maybe the disagreement isn't about objects," U mused, looking into the foam. "It's about what counts as a 'cost'. You treat bloat as the worst sin. You'd rather deny the existence of everyday things than posit millions of strange fusions."

  "And you treat semantic honesty as the highest good," N replied. "You'd rather let reality get wilder than change the way we talk about what's sitting in front of us. But here's the kicker: if the trout-turkey exists, why doesn't it have a name? Because it plays no role in our cognitive economy. And if it plays no role in our economy, does it really matter to metaphysics if it exists?"

  "If it satisfies the logical conditions for composition, it matters to metaphysics regardless of our economy," U said. "But look, I grant you this: Universalism requires us to be careful about how we predicate properties. Maybe 'The trout-turkey has mass' is ambiguous depending on how we define the sum."

  "And I'll concede this," N admitted, finally relaxing slightly. "My view requires me to tell people, kindly, that their life story is technically false. There is no 'me', only a series of overlapping processes. It's psychologically difficult. I respect that you want to save folk ontology."

  "Save it, or just take advantage of it?" U teased. "If Universalism lets me use quantifiers straightforwardly—if I can say ∃x(x is composed of y and z) without checking if y and z are 'cohesive'—that's a gain in formal elegance. You're sacrificing logic for intuition."

  "But logic is only as good as its application," N shot back. "If the logic forces us into a worldview where everything is connected by arbitrary sums, the application fails to illuminate. It becomes empty."

  They sat in silence for a moment, the hum of the bar filling the gap.

  "You know," N said eventually, breaking the quiet, "we're arguing about existence, but we're mostly arguing about simplicity."

  "Parsimony," U agreed. "We both want a simple theory, we just value different variables. You want fewer objects; I want fewer restrictions on parthood."

  "Exactly," N said, raising their glass. "Maybe that's the real answer. Not who's right about the table, but why we can't agree on what makes a theory 'better' than another."

  "Or," U clinked their glass against N's, "maybe we just order dinner and agree that the menu items are real."

  "For tonight," N smiled. "Ontologically, let's call them arrangements of particles."
