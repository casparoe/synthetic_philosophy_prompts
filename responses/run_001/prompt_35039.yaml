answer: |-
  ### 1. Where the list works
  The standard textbook framework succeeds brilliantly where biological boundaries are unambiguous. Your verdicts for the maple tree, bacterium, and blastocyst embryo align perfectly because these entities actively display every trait simultaneously. They possess cellular boundaries, process energy immediately, grow structurally, contain replicable genetic material, react to the environment, regulate internal conditions, and participate in natural selection. In these cases, the "all-or-nothing" checklist holds up because there is no ambiguity about their current operational status. They demonstrate robust autopoiesis—essentially creating themselves from within. The list effectively filters out non-biological mimics like crystals or machines in these straightforward contexts because those objects fail multiple core criteria (like lacking cells or heredity) instantly. Thus, for fully functional, active organisms, the textbook model is efficient and accurate, serving as a reliable baseline for introductory biology.

  ### 2. Where it breaks
  The list fractures when testing edge cases requiring nuance. The mule contradicts the strict "must reproduce" rule; individuals can die without offspring, yet we still call them alive. The ancient seed fails the metabolism check for millennia, yet we intuitively classify it as dormant life, not a mineral. Fire and the self-driving car mimic growth and homeostasis physically but lack biological grounding, suggesting the list conflates thermodynamic processes with biological intent. The virus sits in limbo; it evolves but lacks independent machinery, highlighting that "reproduction" alone isn't enough. Most critically, your brain-dead verdict reveals a disconnect: the body metabolizes, yet you deny it life. This implies you value autonomous integration over mere cellular function. The textbook list treats life as a static checklist of properties, failing to distinguish between temporary suspension (seed), individual limitation (mule), or loss of systemic autonomy (brain-dead patient). It demands constant performance rather than structural potential, making it rigid against real-world complexity.

  ### 3. The best fix
  To capture your intuitions, adopt the **Systemic Autonomy Principle**: An entity is alive if it possesses a bounded system containing heritable information, capable of maintaining internal order through autonomous metabolism and contributing to an evolving lineage. Crucially, metabolism can pause (dormancy), and reproduction applies to the lineage, not just the individual.

  Applying this repaired principle:
  *   **Maple/Bacteria/Embryo:** Pass. They meet structure, genetics, and active metabolic potential.
  *   **Mule:** Pass. The lineage capability exists in the species; individual sterility doesn't negate the organism's systemic integrity.
  *   **Ancient Seed:** Pass. Structure and genetics remain intact; metabolism is paused but recoverable without external machinery.
  *   **Brain-Dead Patient:** Fail. While cellular components exist, the system has lost autonomous integration; maintenance relies on external machines (ventilators), breaking the "autonomous" requirement for a unified life form.
  *   **Virus/Prion:** Fail. They lack independent cellular boundaries to sustain homeostasis without hijacking another host.
  *   **Fire/Car:** Fail. No heritable information or cellular boundaries; growth is additive physics, not biological replication.
  This fixes the "mule" by shifting reproduction to lineage, saves the "seed" by allowing pauses, and respects the "brain-dead" view by requiring system-wide autonomy. It moves from a property checklist to a structural definition of organized complexity.

  ### 4. New test cases
  Here are three additional scenarios to stress-test this principle:
  1.  **A cryogenically frozen tardigrade:** Water is removed, metabolism stops, structure remains. **Prediction:** Alive. Like the seed, recovery depends on intrinsic structure, confirming that metabolic pauses don't equal death.
  2.  **Isolated mitochondria:** These replicate and metabolize inside cells but die outside. **Prediction:** Not alive. They violate the "bounded autonomous system" rule; they are organelles, not organisms, dependent on a host.
  3.  **A robotic AI evolved by algorithms:** It learns and changes code. **Prediction:** Not alive. It lacks a physical metabolic substrate and cellular boundaries; evolution here is informational, not biological.
  These cases confirm the principle hinges on physical autonomy and inheritable material, distinguishing biological pauses from mechanical failure or purely digital complexity.

  ### 5. Verdicts i have to give up
  You likely need to refine your brain-dead verdict. Biologically, a heart-beating body is classified as an organism until respiratory collapse occurs. Your "not alive" intuition conflates *personhood* with *biological life*. To stay consistent with the repaired principle, you must accept that the *cells* are biologically alive even if the *person* is gone. Abandoning this distinction allows you to acknowledge that the ventilation-supported body is technically a living organism, just without consciousness. This preserves the biological precision required for your class while respecting your ethical intuition about the person's status. You save the distinction by splitting "biological organism" from "sentient being."
