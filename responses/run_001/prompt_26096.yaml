answer: |-
  **The Scenario**

  Consider Elena, a woman suffering from severe, pharmacological-refractory anhedonia caused by chronic stress-induced neural receptor downregulation. Her clinician proposes Deep Brain Stimulation (DBS) targeting the ventral striatum to electrically simulate reward signals; however, clinical models predict her downregulated physiology will develop rapid tolerance, requiring escalating voltages that eventually trigger debilitating migraines and cognitive fog alongside the euphoria. The alternative is a slow-acting cognitive therapy protocol that repairs natural receptor sensitivity over three years, offering modest but stable gains in natural capacity for joy. Elena’s psychology is characterized by extreme acute temporal discounting; her overwhelming, conscious preference is to cease the experience of emotional numbness immediately, leading her to explicitly demand the DBS despite knowing the long-term degradation of her nervous system, as she values the cessation of current suffering above all future possibilities of health.

  ***

  **Theory Walkthrough**

  **Hedonistic Utilitarianism (Opposes Wireheading)**
  For the hedonistic utilitarian, moral worth is determined solely by the sum of pleasure minus pain. While the DBS offers an initial surge of pleasure, the requirement of escalating voltage creates a negative feedback loop: the "reward" signal necessitates a dosage that soon surpasses the pain threshold of neural irritation (migraines) and creates aversive cognitive states (fog). Furthermore, tolerance means the marginal gain in pleasure diminishes over time while the marginal cost in physical pain rises. By calculating the aggregate lifetime hedonic score, the therapy path—though slower—accumulates a higher total surplus of net positive affect because it avoids the toxic ceiling of the electrical intervention. Therefore, the theory mandates opposing the wirehead to maximize overall well-being.

  **Desire-Satisfaction Theory (Endorses Wireheading)**
  For the desire-satisfaction theorist, what benefits an agent is the alignment of the world with their preferences. Elena possesses a clear, first-order desire: "I want to stop feeling numb right now." The DBS perfectly satisfies this specific desire, altering her internal state to match her preference exactly. The long-term risks of migraines or cognitive decline are irrelevant to the valuation unless they frustrate other active desires; since Elena explicitly discounts the future and holds no strong desire for long-term physiological integrity (valuing immediate relief instead), those negative outcomes do not register as "frustrated desires." The therapy, conversely, actively frustrates her most potent desire for immediate relief. Thus, the theory endorses the wirehead as the instrument of maximum desire satisfaction.

  ***

  **The Heavy Lifting Feature**

  The feature doing the heavy lifting is the combination of **Physiological Diminishing Returns (Tolerance)** paired with **Hyperbolic Time Discounting**.

  *   **Physiological Tolerance** forces the Hedonistic Utilitarian calculation into the red. If the stimulation were linear (e.g., one unit of electricity always equals one unit of pleasure), the HU would likely endorse the wirehead. The introduction of escalation (pain/cost rising faster than pleasure) is the specific mechanic that flips the HU verdict.
  *   **Hyperbolic Time Discounting** secures the Desire-Satisfaction victory. It validates her irrational-seeming choice without calling her preferences "bizarre"; it frames them as a predictable psychological constraint.

  **Removal Test:**
  *   **If you remove Tolerance (assuming the device worked efficiently forever):** The case collapses back to the standard verdict. The HU would calculate infinite pleasure with zero side effects and endorse the wirehead.
  *   **If you remove Hyperbolic Discounting (assuming Elena is purely forward-looking):** The case turns into a different dilemma. If Elena also desired "long-term health" rationally, the DST would likely split or lean toward the therapy (depending on how weighted the meta-desires are), removing the clean reversal where DST unequivocally supports the wirehead.
