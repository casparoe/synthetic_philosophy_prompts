  ### Three Plausible Rules

  Here are the three most robust interpretations of the rule she is running, consistent with every case you listed.

  **Rule 1: The Institutional Dependence Test**
  *   **Definition:** A category is socially constructed if the category ceases to apply or loses its defining power in the absence of human institutions, agreements, or practices.
  *   **Fit:**
      *   *Constructed:* Money (requires banks/trust), Adulthood (requires laws), Schizophrenia (requires psychiatric manuals).
      *   *Not Constructed:* Atoms (exist without humans), Biological Sex (reproductive physiology functions without us), Species (lineages evolve regardless of naming).
  *   **Prediction for Planet:** **Socially Constructed.**
      *   *Why:* While Pluto existed before humans, the *category* "planet" is currently maintained by the International Astronomical Union. If humanity vanished, "planet" would dissolve into a generic description of orbiting bodies. It is a classificatory institution, similar to "adult."

  **Rule 2: The Intrinsic Causal-Power Test**
  *   **Definition:** A category is not constructed if membership in the category is grounded in the object’s intrinsic physical or biological properties that generate specific causal effects (laws of nature). If the category depends on extrinsic relations (like location, ownership, or context), it is constructed.
  *   **Fit:**
      *   *Constructed:* Race (social grouping, not biological essence), Gender (roles/practices), Adulthood (legal status), Schizophrenia (symptom clustering chosen by committee).
      *   *Not Constructed:* Atoms (intrinsic charge/mass), Biological Sex (intrinsic gametes), Species (intrinsic evolutionary lineage).
      *   *Nuance:* The "Species" verdict is key here. She accepts the concept is chosen, but the *entities* have real evolutionary histories (intrinsic).
  *   **Prediction for Planet:** **Socially Constructed.**
      *   *Why:* The 2006 IAU definition hinges partly on "clearing the neighborhood." This is a relational, extrinsic property (what the planet does relative to other debris), not an intrinsic one. A rock that clears its neighborhood today might not tomorrow. Furthermore, the "shape" criterion (hydrostatic equilibrium) is a threshold that creates a continuum, not a distinct causal break like "fusion" in a star.

  **Rule 3: The Sharp Discontinuity Test**
  *   **Definition:** A category is not constructed if nature presents a sharp, non-arbitrary discontinuity (a "gap") that maps onto the category. If nature presents a smooth continuum and humans must choose where to draw the line, the category is constructed.
  *   **Fit:**
      *   *Constructed:* Adulthood (puberty is gradual), Schizophrenia (mental health is a spectrum), Money (value is relative).
      *   *Not Constructed:* Atoms (electron shells are quantized), Biological Sex (binary gametes in mammals), Species (branching points in phylogeny).
  *   **Prediction for Planet:** **Socially Constructed.**
      *   *Why:* There is no sharp physical cliff between a "Dwarf Planet" and a "Planet." Mass, shape, and orbit exist on a gradient. The IAU had to pick an arbitrary cutoff point in a continuous distribution.

