      *   *Causal-Role (Organizational/Systems):* Cummins, Boorse, Wimsatt. Function = contribution to systemic capacity. Key feature: Ahistorical, synchronic. Handles physiology, engineering, artifacts easily. Struggles with normativity (why is a noise-making heart malfunctioning if it helps make sound?).
      *   *The Impasse:* Both claim to define "biological function." Both have counterexamples the other can't explain without compromising core intuitions.

  3.  **Evaluate the Nature of the Disagreement (The "Diagnosis"):**
      *   *Is it Substantive (Metaphysical)?* Are functions real properties out there? Realists say yes. Instrumentalists might say no. But usually, the debate presumes functions exist. The dispute is about *which* facts constitute the function. So it looks substantive, but...
      *   *Is it Verbal?* Do they mean different things by "function"? In ordinary language, "function" is ambiguous (goal vs. role). If they agree on usage contexts, they aren't just talking past each other.
      *   *Are they Answering Different Questions?* This is the strongest lead. Etiology answers "Why do we have X?" (Teleological history). Causal-Roles answer "What does X do now?" (Systemic integration).
