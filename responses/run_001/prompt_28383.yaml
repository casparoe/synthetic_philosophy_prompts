      *   **Diagnosis 1: The Pragmatic Dissolution (Different Projects).** Argue that they are asking different questions. Etiology = Evolutionary explanation. Role = Physiological explanation. Science needs both. The conflict arises when trying to unify them into a single definition.
      *   **Diagnosis 2: The Semantic Ambiguity.** "Function" does work in two languages: Teleological (language of purpose/goals) vs. Descriptive (language of mechanics).
      *   **Diagnosis 3: The Normativity Problem.** This is the crux. Why call a non-pumping heart "broken"? Etiology has the resources (past intent); Role theory must invent norms (system health). This suggests a genuine metaphysical gap regarding *value* in nature.
      *   **Can it be Resolved?**
