      *   *Philosopher (let's call him Elias):* Principled, concerned with logic and fairness. Believes morality should transcend our biases. Worried about "tyranny of the present."
      *   *Setting:* Somewhere intimate but neutral. A study, a late-night office, a quiet corner of a hotel bar during a conference. Let's go with a hotel bar after a conference—allows for intimacy and fatigue, which lowers defenses but raises stakes.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Tension is already simmering. They've been discussing this for years. This is the "pivotal scene."
      *   **The Catalyst:** Why now? Maybe a new Stern Review critique or a specific IPCC report mention. Let's start mid-argument to save page space for the meat.
      *   **Point 1: The Ramsey Equation & Zero PTP.**
          *   Sarah needs to explain *why* she uses $\delta > 0$. It's not just "I like money now." It's survival uncertainty and efficiency.
          *   Elias counters with Ramsey's insight: If people live forever, why discount their utility just because it's later?
          *   *Constraint Check:* Need to mention $r = \delta + \eta g$. If $\delta \to 0$, $r$ drops.
      *   **Point 2: Rationality vs. Psychology.**
          *   Sarah argues for the descriptive (people die, people are impatient).
          *   Elias argues for the normative (we shouldn't be impatient about morality).
