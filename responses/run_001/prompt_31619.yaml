      *   **Point 3: Space vs. Time.**
          *   Elias brings up the spatial analogy (Noah's Ark / Parfit). Don't care less about someone far away.
          *   Sarah pushes back on the disanalogy. Future isn't distant place; future is unknown people/nonexistence. Risk of extinction matters.
      *   **Point 4: Practical Implications.**
          *   Does the math actually change outcomes differently? Or do other factors dominate?
          *   Consumption growth ($\eta g$). Even if $\delta=0$, if growth is high, investment is needed anyway.
          *   Catastrophic risk as a form of discounting that isn't "pure."
      *   **Ending:** No winner. A moment of mutual respect despite disagreement.

  4.  **Refining the Philosophy (Self-Correction during drafting):**
      *   *Correction:* Make sure Sarah doesn't sound anti-environment. She cares about climate, but believes extreme saving rates required by zero PTP starve current poor.
      *   *Correction:* Make sure Elias doesn't sound naive. He acknowledges extinction risk but distinguishes it from mere temporal distance.
      *   *Check:* Ensure the Ramsey equation is mentioned naturally, not read like a formula sheet.
      *   *Check:* Ensure the spatial argument includes the nuance of "identity" (future people don't exist yet vs. foreign people do).

  5.  **Drafting the Dialogue (Iterative Process):**

      *   *Scene:* Hotel bar. Whiskey/wine. Rain outside.
      *   *Start:* Sarah pours a drink. "You're talking about the Ramsey model again."
      *   *Elias:* "It's the foundation. You can't build justice on $\delta > 0$."
