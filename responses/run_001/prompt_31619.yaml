      *   *Policy Divergence:* Sarah: "Wait, look at $g$." High growth means we need capital stock. Even with $\delta=0$, we save enough.
      *   *Conclusion:* They agree on the danger of the argument, but disagree on the foundation.

  6.  **Polishing for Tone:**
      *   Add pauses, gestures, interruptions.
      *   Avoid jargon-heavy sentences where possible, or contextualize the jargon immediately.
