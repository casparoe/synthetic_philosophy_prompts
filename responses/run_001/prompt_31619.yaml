  The rain lashed against the floor-to-ceiling windows of the forty-second-floor hotel bar, blurring the city lights into streaks of amber and steel. Two glasses sat on the table between them—one half-finished bourbon, one untouched mineral water.

  "You treat time like a currency," Elias said. His voice was low, calm, but it carried a weight that had accumulated over twenty years of academic debates. "Like you can hoard the present and spend it on the past."

  Sarah swirled the ice in her glass. "And you treat time like a location. Like 'here' and 'there.' That's not how causality works, Eli. It's how memory works."

  "I mean nothing metaphorical when I say morality is spatially blind."

  "And I'm telling you that it's temporally contingent." Sarah leaned forward, elbows on the oak table. "We aren't arguing about the definition of justice. We're arguing about the parameters of the Ramsey model. I know you think I'm cheating with $\delta$, but I'm not hiding anything. Look at the equation again: $r = \delta + \eta g$."

  Elias sighed, a long exhalation that seemed to rattle his ribcage. "The equation is just arithmetic, Sarah. The philosophy is in the variable selection. $\delta$, the pure rate of time preference. When you set it to anything above zero—which is what every climate cost-benefit analysis relies on unless they adopt Stern's controversial zero—you are saying that a person born three hundred years from now is inherently worth less than a person living today, simply because of when they breathe."

  "That's not what I'm saying."

  "It is exactly what the math says."

  "It's saying that the probability of the event occurring diminishes over time." Sarah tapped the table. "In my models, $\delta$ isn't just impatience. It's the probability of societal collapse. If there is a 2% chance every year that civilization resets, the expected value of tomorrow's utility must be discounted relative to today. You call that 'temporal parochialism.' I call it risk management."

  "You're conflating two things," Elias countered. "Risk of non-existence and pure time preference. Those should be disentangled. One is a factor of extinction risk, which belongs in the numerator of the calculation—the probability the future people exist. The other is $\delta$, which is ethical impatience. If you braid them together, you justify starving the present to preserve the future. Or vice versa. You choose the parameter that suits the narrative."

  Sarah took a sip of bourbon. "If I separate them, and I set ethical impatience to zero... the discount rate crashes. Then the optimal path requires the current generation to surrender almost all consumption to invest for five centuries down the line. It turns the present generation into ascetic monks. Who suffers in that scenario? Not me. Not you. It's the mother feeding a child in Lagos who has no electricity today."

  "Then you have a distributional problem," Elias said. "But solving distribution problems by introducing a mathematical error isn't a solution. It's a bandage."

  "Is it an error?" Sarah challenged. "Or is it a rational constraint? People discount the future psychologically. If we design public policy based on a fantasy of infinite patience, it won't survive democratic scrutiny. We can't tax the poor of 2025 to subsidize the rich of 2125, even if the 2125s would be richer. We have to respect how people actually value trade-offs."

  "Ah," Elias nodded slowly. "Now we hit the core. You argue that pure time preference is a *psychological fact* we must accommodate. I argue it is a *moral mistake* we must correct. Just as we don't build tax codes to reward racial prejudice because people happen to hold racist views, we shouldn't structure intergenerational policy on the basis of temporal myopia."

  "But here is the disanalogy that breaks the symmetry," Sarah said, gesturing with her hand. "Spatial distance involves existing agents. If I give less money to a famine victim in Sudan than to one in New York, I am discriminating against an existing person who is currently suffering. The future people... they aren't *there*. They are potentialities. Their interests depend on whether we act to bring them into existence. And if we drain the economy today to protect the climate for three hundred years out, we might prevent the technology that saves them from dying in a flood."

  "The potentiality argument is old, Sarah. Parfit dismantled it. Identity-dependence doesn't erase obligation." Elias leaned in. "Think of the spatial analogy. I have a cousin in London and a cousin in Tokyo. If I send aid, does the distance matter? No. Because the harm is identical. But you say the harm is different across time."

  "Why wouldn't it be?"

  "Because utility is fungible across space, but time changes the identity of the subject?"

  "Because time allows for recovery," Sarah said sharply. "Money saved today grows. A dollar invested today becomes ten dollars in 2090. Spending that dollar on the person in 2090 gives them more benefit than spending it on the person today. Discounting for consumption growth—$\eta g$ in the Ramsey equation—handles that. My point is, once you strip out the impatience ($\delta$), the consumption elasticity takes over. We still invest. Just not *as much* as the zero-discount theorists claim. The practical gap between my model and yours narrows when you look at growth, not just ethics."

  Elias rubbed his temples. "The convergence you see is dangerous precisely because it hides the normative difference. If your models show the same outcome as mine through different levers, you hide the fact that you are treating the future as a gamble and I am treating them as rights-holders. But let's stick to the numbers. If $\delta$ approaches zero, $r$ is driven entirely by growth expectations and inequality aversion. In a climate catastrophe scenario, $g$ turns negative."

  "That's the tail risk," Sarah agreed, nodding. "Which brings us back to probability. If $g$ is negative, the discount rate flips sign. But that assumes the future survives to suffer from the growth decline."

  "So you admit the survival probability belongs in the discount rate?"

  "In the *expected* utility stream," Sarah corrected. "Look, Eli. There's a specific kind of arrogance in setting $\delta = 0$. It's the arrogance of the survivor. You assume civilization will last long enough to reap the rewards of your sacrifice. If you bet on a future that collapses because we were so obsessed with saving for it that we couldn't adapt to the immediate crises of the 2020s, then $\delta=0$ wasn't wisdom. It was hubris."

  "And the arrogance of $\delta > 0$," Elias shot back, "is assuming that we have a right to consume the atmospheric commons because we are here first. It's the tyranny of the present. You're defending the right of the living to extinguish the possibilities of the unborn by calling it 'probability assessment.'"

  "I'm defending the reality that you can't have a climate without an economy to fix it." Sarah paused, her anger softening into exhaustion. "Look. In practice, if I run a sensitivity analysis with your ethical parameters, yes, the optimal carbon price rises. Drastically. But does it make us better off in terms of actual welfare? Or does it create such massive distortionary taxes today that the political system implodes?"

  "Because the political system is flawed?"

  "Because it is."

  Elias picked up his glass, finally taking a sip of water. "So where does that leave us? We aren't disagreeing about the direction of travel, only the speed limit."

  "We're disagreeing about the steering wheel," Sarah said. "For you, time is a dimension of moral equality. For me, time is a filter of certainty. I cannot calculate the value of something with any reliability when the chain of causality stretches a thousand years. That isn't a moral preference. It's a limit of information."

  "Information limits," Elias said softly. "That's the key. You believe you can't assign moral weight to ignorance. I believe you can't withhold moral weight based on ignorance."

  "And if I set $\delta$ to 0.1 percent instead of 1.5 percent?" Sarah asked. "Does that satisfy the philosophical requirement while keeping the social discount rate high enough to avoid starvation?"

  Elias looked at her, searching for evasion. "If the difference is small numerically, it implies you've conceded the conceptual ground. But I worry you're just smoothing the curve."

  "I am accommodating human nature," Sarah said, defensive again. "If you ask people to give up 40% of GDP to save a world they'll never see, they won't vote for it. The project fails. A positive rate of time preference reflects the reality that the future is owned by those who can imagine it."

  "And if the present cannot imagine the future well enough to stop burning coal, is the discount rate to blame?"

  Sarah fell silent. She watched the condensation slide down her whiskey glass. Outside, the city lights blurred further as a storm front moved through.

  "I don't know if I can fix the imagination problem with math," she admitted finally. "My models show trade-offs. I can show that spending money now yields benefits later. I cannot prove the magnitude of the obligation."

  "And my philosophy," Elias said, "shows that the obligation exists regardless of the math. But I concede... I concede that the implementation mechanism requires a bridge. If my zero-discount approach results in a policy that is rejected and thus achieves nothing, the theory is sterile. Perhaps there is a role for $\delta$ not as a moral truth, but as a shadow price for institutional fragility."

  "A shadow price for fragility," Sarah mused. "That sounds like insurance. You're discounting the future by the cost of maintaining the trust required to reach it."

  "Exactly," Elias said. "If the institution collapses, the future vanishes. You're discounting for the sustainability of the moral agent, not the moral object."

  "Then maybe the number isn't arbitrary," Sarah said, looking at him across the table. "Maybe the conflict isn't between economics and ethics. Maybe it's between static optimization and dynamic survival."

  "If you put it that way," Elias smiled faintly, "then perhaps we can agree that the pure rate of time preference cannot be zero in a functioning society, even if it ought to be zero in a just universe."

  Sarah nodded slowly. "A necessary fiction for a broken world. And maybe," she added, "a dangerous excuse for complacency."

  "For which neither of us has an answer," Elias said.

  He raised his glass of water. Sarah hesitated, then clinked hers against it. The ice chimed—a sharp, cold note in the humid room. Neither of them drank. They just watched the liquid settle, suspended between the surface and the bottom, neither fully spent nor yet consumed.
