      *   **Requirements:**
          *   Genuine philosophical content (no caricatures/strawmen).
          *   Real back-and-forth (responsive arguments).
          *   Specific topics to cover:
              *   Distinction between PTP, consumption growth discounting, and risk of non-existence.
              *   Ramsey equation ($r = \delta + \eta g$) and $r \to 0$.
              *   Temporal vs. Spatial distance analogy/disanalogy.
              *   Is PTP rational, psychological fact, or moral error?
              *   Policy implications/practical divergence.
          *   Conclusion: No tidy resolution, but refinement/qualification of positions.
          *   Tone: Literary novel, intelligent, articulate, earnest.

  2.  **Character Conception & Voice:**
