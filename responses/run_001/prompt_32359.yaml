  7.  **Final Polish:** Check against safety guidelines. (No medical advice given. Discussion is philosophical/educational). Ensure the response empowers the student without burdening them with their family's conflict.

  8.  *(Self-Correction during drafting)*: I need to make sure I address the "diabetes" analogy specifically because it was brought up by the parents. It's a common rhetorical device but has limitations. I should explain *why* they use it and where it diverges.

