answer: |-
  Setup and materials
  You will need 18 identical decks of 10 index cards each, totaling 180 cards, which you must write by hand prior to the meetup using your own index cards and pen; each card should have a value between 10 and 50 written on it, ensuring a random shuffle of these numbers so the average value per deck is consistent across the room, along with one pen per participant and a stopwatch. Divide the group of 18 into their own seats or standing spaces, handing each person one prepared deck face down, and place yourself at the front with the stopwatch visible to everyone so you can track the rhythm of the game without needing extra equipment.

  Rules and flow
  Begin by explaining that everyone is competing to sign one lucrative contract, represented by one of the cards in their hand, but that every minute spent interviewing candidates drains their energy reserves. Tell them to flip their cards one by one, starting with the top card, and they must immediately decide whether to “sign” that card and stop, or “pass” and burn it to look at the next one; if they pass, they must write down a “fatigue score” of 5 points for that discarded card on a separate scrap of paper. They cannot go back to a card they have burned or rejected, and once they choose to sign, they remove that card from play and set aside their remaining unflipped cards.

  The game runs for a maximum of ten minutes to simulate a limited window of opportunity, after which anyone who hasn’t signed a contract receives a zero score regardless of potential value. During this time, participants flip, decide, and track their accumulated fatigue costs simultaneously, creating a chaotic but focused atmosphere where they must balance hoping for a high-value card against the growing debt of search effort. Announce every minute mark to heighten the pressure of the ticking clock, forcing them to weigh the current card’s face value against the points they are already losing by continuing to search.

  Scoring and incentives
  To determine the winner, collect each player’s signed card value and subtract their total cumulative fatigue cost to find their Net Contract Value, with the highest positive number being declared the victor. Acknowledge the winner with public applause, but emphasize that the true measure of success in this exercise is maximizing personal resources rather than simply finding the biggest number, and invite participants to calculate their own efficiency ratios quickly so they enter the discussion aware of their own mistakes.

  Debrief
  First, ask those who finished with the highest scores to explain their strategy, likely revealing that they stopped searching relatively early, then ask those with the lowest or negative scores to describe their hesitation, highlighting the correlation between high fatigue costs and low net returns. Display the data by drawing a simple chart on the whiteboard showing the average payoff for people who stopped within the first three cards versus those who searched past five cards, proving statistically that the group that committed sooner secured more actual value despite holding lower raw numbers on the cards.

  Finally, introduce the concept of bounded rationality and define the term "satisficing" as setting a threshold of "good enough" rather than chasing the impossible optimal. Map their experience directly to your previous talks on pricing and decision-making, pointing out that the fatigue cost was actually time and mental bandwidth, and explain that by ignoring these hidden costs in their quest for the perfect client, they were unknowingly optimizing against themselves rather than optimizing for profit.

  What will probably go wrong
  Participants will often try to cheat on the fatigue count or forget to track the cost when the excitement of seeing a high number distracts them, which you can fix by having a designated "monitor" in each row of three people verify the arithmetic before scoring begins to ensure the math reflects their choices. Another issue is that bad luck in the card shuffling may make a player feel their loss was unfair rather than a result of over-searching, so be ready to remind the room that while luck dictates the raw card order, the strategy determines the net outcome across the whole group.

  This game also fails to convey that in real life, rejecting a client often closes the door permanently whereas a card can theoretically be returned, which I will address in the debrief by acknowledging the higher stakes of human relationships versus paper cards. Additionally, the game assumes everyone knows the distribution of values upfront, unlike the real market where opportunities are ambiguous, so I must explicitly caution them that satisficing is a heuristic for uncertainty, not just a mathematical tool for known risks.
