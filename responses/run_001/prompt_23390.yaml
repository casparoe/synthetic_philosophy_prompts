      *   Make sure the distinction between "Long-run frequency" and "Belief update" is sharp.

  **(Self-Correction during drafting):** I initially thought about explaining confidence intervals. No, stick to the core confusion about p-values first. Adding CIs might complicate the specific philosophical point about the 5% rate. Focus on the "Prior Probability" aspect.

  8.  **Finalizing the Argument:**
