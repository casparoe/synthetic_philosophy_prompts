answer: |-
  You have hit upon the exact nerve center of modern scientific debate. Your intuition is correct: there is a massive logical gap between "this procedure generates 5% false alarms" and "this specific result is probably true."

  If you can understand this distinction, you understand more about the mechanics of the replication crisis than most PhD students do.

  Here is how to resolve that tension, what a single result actually means, and why the crisis is systemic rather than just about "bad actors."

  ### 1. The Core Logical Gap: Inverse Probability
  You described the standard explanation correctly: the 5% rate describes the machine, not the result. But to see why people get confused, we have to name the error.

  In statistics, a $p$-value answers this question: **"Assuming there is no effect, how likely is it to see data like this?"**
  But your brain wants it to answer this: **"Assuming I saw this data, how likely is it that there is no effect?"**

  These two questions sound similar, but they are opposites. Here is a non-mathematical analogy to fix this:

  Imagine a cancer test that is 95% accurate. It has a 5% false-positive rate.
  *   **Scenario:** You take the test, and it comes back positive.
  *   **The Machine:** If 1,000 healthy people take this test, 50 of them will falsely alarm (the 5%).
  *   **Your Situation:** You got a positive result. Does that mean there is a 95% chance you have cancer?
  *   **The Reality:** If cancer is very rare (say, 1 in 1,000), then out of 1,000 tests, you expect 1 true positive and 50 false positives. If you hold a positive result in your hand, there is roughly a **1 in 50 (2%) chance you actually have cancer**, despite the "accurate" test.

  The 5% error rate is real, but it only guarantees its validity across a large group. When you zoom in on a single person (or a single study), the rarity of the condition matters. In science, **rare conditions = rare hypotheses.** Most new theories tested are actually false. If you combine a "mostly false" starting point with a "5% error rate" detector, your positive signals are often noise.

  ### 2. Reconciling Your "20 Runs" Example
  Your example is perfect: *A researcher runs an experiment 20 times on a treatment with no effect, and it comes out significant exactly once.*

  This is not a failure of the researcher; **this is a success of the math.** That is exactly what randomness looks like when $\alpha = 0.05$.

  The problem arises when the researcher does this, sees the one "significant" result, and publishes *only* that one paper, while shredding the other 19.
  *   To the reader, it looks like a 1-in-20 discovery.
  *   In reality, it was a 20-attempt fishing expedition where the author found a fish in the 5% bucket and ignored the empty buckets.

  When we treat a single $p < 0.05$ as a "light switch" (True vs. False), we ignore the fact that light switches break occasionally. If you live in a house where the light switch breaks 5% of the time, you wouldn't trust it every single time it clicks on. You'd check the wiring.

  **What a single $p < 0.05$ actually tells you:**
  It tells you that the data observed would be unusual if the Null Hypothesis were true. It does **not** tell you that the Alternative Hypothesis is true. It tells you that the data is worth paying attention to, not that the conclusion is settled.

  ### 3. Why the Replication Crisis is Systemic (Not Just Carelessness)
  If this were just about researchers cheating, the solution would be to fire them. But you asked why it's about the tension in the statistics itself. Here is why the system incentivizes the "20 runs, 1 publish" strategy:

  **A. The Reward Structure**
  Science funding and academic tenure rely on novelty ("We found something new!"). Finding a statistically insignificant result (which means "we couldn't find anything") is career suicide. There is virtually no journal space for papers that say "Nothing happened."
  So, researchers are incentivized to keep running the experiment until they get the 1-in-20 signal. As long as only the successful run gets published, the 5% error rate explodes into the literature.

  **B. The "File Drawer" Problem**
  Because we cannot easily calculate the False Discovery Rate (as per the cancer analogy), we need to know the denominator: **How many total experiments were run?**
  But since failed experiments go in the file drawer, nobody knows the denominator. If 100 labs try to discover a cure for a disease, and 95 fail but 5 succeed purely by luck, the world thinks the drug works with 100% success rate. We lose the context required to interpret the $p$-value correctly.

  **C. Low Power + High Volume**
  Many fields have "low statistical power." This means the sample sizes are too small to detect the real effect if it exists. When a study is "underpowered," a significant $p$-value is *more* likely to be a false positive than if the study were well-powered. Yet, journals accept underpowered studies all the time. This creates a situation where a high proportion of published "positive" findings are simply mathematical flukes amplified by small sample sizes.

  ### 4. How You Should Read Science Now
  Given this tension, here is the mental model you should adopt when reading a headline based on a single study:

  1.  **Treat $p < 0.05$ as "Interesting," not "Proven."**
      View a significant result not as a finished product, but as a claim that needs verification. A single study is merely a hypothesis generator.

  2.  **Look for Priors (Plausibility).**
      Before the experiment started, was the idea plausible? If a study claims to disprove gravity, a $p$-value of 0.04 means almost nothing, because the prior probability of gravity stopping is near zero. If a study confirms a known mechanism, that same $p$-value is much stronger. Always ask: *How crazy is this idea before I heard the data?*

  3.  **Ignore the $p$-value; Look for Effect Sizes and Confidence Intervals.**
      Did they just find a tiny, irrelevant effect? (e.g., "Meditation increases lifespan by 3 days," significant due to a huge sample size). Look at the magnitude of the change, not just the flag.

  4.  **Demand Replication.**
      This is the ultimate fix for the 5% problem. If an effect is real, it should survive multiple runs. If a result disappears in a second lab, the original $p < 0.05$ was almost certainly one of those 5% flukes.

  ### Summary
  The replication crisis isn't happening because scientists are liars; it's happening because we built a system that treats a **long-run error rate** (the 5% over time) as a **short-run certainty** (truth right now).

  You are right to be skeptical. The $p$-value is a filter that lets through 5% of the garbage. Without context (replication, plausibility, hidden negatives), that filtered garbage ends up looking like gold. The single number $p < 0.05$ is not a truth-meter; it is a warning label saying, *"Check this again."*
