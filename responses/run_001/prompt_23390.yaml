  1.  **Analyze the User's Query:**
      *   **Background:** Self-taught on replication crisis, no formal statistics background.
      *   **Core Confusion:** The user understands the technical definition of p < 0.05 (Type I error rate over many runs) but struggles with why a single "significant" result is treated as meaningful if it could just be that 5% fluke. They run into the tension between "procedure error rate" vs. "probability this specific finding is true."
      *   **Specific Scenario:** A researcher runs an experiment 20 times (effect size = 0). It flags significant exactly once. This matches the expected false positive rate.
      *   **Request:** Explain the implications of this tension for interpreting a *single* result and explain why the replication crisis stems from this conceptual issue rather than just individual carelessness.

  2.  **Deconstruct the Statistical Misunderstanding:**
      *   *The Core Issue:* The p-value is $P(\text{Data} | \text{Null True})$, not $P(\text{Null True} | \text{Data})$.
      *   *The Intuition Gap:* People want to know the probability their hypothesis is true given the data. Statistics gives the probability of the data assuming the hypothesis is false. These are inverse probabilities (Bayes' Theorem territory).
      *   *The Base Rate Fallacy:* In the real world, most hypotheses tested are actually false (or have small effects). If you test 100 false hypotheses with $\alpha=0.05$, you get 5 positives. But if you test 100 *true* hypotheses, you get ~95 positives (assuming power). If the prior probability of truth is low, even a significant p-value might mostly be a false positive.

  3.  **Address the Specific Scenario (20 runs, 1 sig):**
      *   This scenario perfectly illustrates the *definition* of alpha ($\alpha$).
      *   If the Null is true, 1 in 20 results *should* be significant by chance.
      *   So, observing 1/20 doesn't prove the Null was false; it proves the procedure is working as designed (albeit annoyingly).
      *   The problem arises when a researcher stops after 1 significant run out of many attempts (p-hacking/hARKing) or presents it as a standalone discovery without context.

  4.  **Connect to the Replication Crisis:**
      *   It's not just "people lying." It's structural incentives.
      *   Publishing only significant results (File Drawer Problem).
      *   P-values being treated as binary switches (True/False) rather than continuous evidence.
      *   Low statistical power + selective reporting inflates the False Discovery Rate (FDR).

  5.  **Drafting the Explanation - Structure:**
      *   **Validation:** Acknowledge the insight. This confusion is profound and points directly at the heart of modern stats criticism.
      *   **The "Inverse Probability" Trap:** Explain clearly why $P(Data|H_0)$ is not $P(H_0|Data)$. Use a medical test analogy (false positives in rare diseases).
      *   **The Single Study Context:** What does one $p<0.05$ actually tell us? It tells us the data is incompatible with the Null, but not necessarily that the Alternative is true.
      *   **The Base Rate Factor:** Introduce the idea that most hypotheses *might* be wrong. This is crucial for FDR.
      *   **Systemic vs. Individual:** Why this isn't just about "bad apples." It's about the reward system (publishing novelty > confirming nulls).
      *   **Actionable Takeaway:** How should the user read science now? (Replication, priors, effect sizes, meta-analysis).

  6.  **Refining the Content (Self-Correction/Nuance):**
      *   *Correction:* Don't get too bogged down in Bayes' theorem math. Keep it conceptual.
      *   *Nuance:* Make sure not to say p-values are useless. They measure consistency, just not truth probability directly.
      *   *Emphasis:* Highlight that a single study is rarely enough. The 20-run example is perfect because it shows how easy it is to get a "hit" by accident if you look hard enough.
      *   *Key Term:* False Discovery Rate (FDR). Even though they don't have a stats background, explaining the concept of "of all the things published as significant, how many are lies?" is vital.

  7.  **Final Polish:**
