answer: |-
  You are right to feel pulled in multiple directions because probability legitimately serves two distinct roles—as a measure of objective physical chance (aleatory) and as a measure of rational uncertainty (epistemic)—making a disciplined pluralism the most defensible position.

  Your coin flip and quantum mechanics cases belong to the *aleatory* domain; here, probability tracks features of the physical system (long-run frequencies or irreducible dispositions/propensities) regardless of what anyone believes. Your lottery case sits on the border, relying on physical symmetry to ground an epistemic assumption about physical chance. Conversely, your rain, Higgs, Caesar, and key cases belong to the *epistemic* domain; here, probability quantifies how strongly evidence supports a hypothesis. The reason you felt comfortable assigning a number to the Higgs but hesitated on Caesar isn't that the events differ fundamentally (both are unique past/present facts), but that particle physics has developed standardized statistical conventions for expressing uncertainty, whereas history lacks such rigorous metrics. In both instances, however, the probability reflects the strength of evidence relative to a hypothesis, not a frequency of occurrence.

  This distinction saves you from the trap of thinking pluralism is a cop-out. Admitting that "probability" is ambiguous like "bank" (financial institution vs. river edge) is intellectually honest; collapsing everything into strict frequentism or radical subjectivism forces you to deny the reality of single-case tendencies or the objectivity of rational disagreement. A principled pluralism simply acknowledges that we use the same mathematics for different metaphysical jobs.

  Regarding the mathematical conjecture: before a proof is found, the probability is strictly epistemic. Mathematical truths are necessary and fixed; the conjecture is either true or false independent of our knowledge. Therefore, any probability assigned (even something like "90% chance the Riemann Hypothesis is true") measures the current state of mathematical community evidence and intuition, not an ontological propensity in the numbers themselves. This aligns with your "keys on the counter" case: the math isn't chancy, but your justification for believing it is true is incomplete.
