  *Tension Ranking:*
  1.  (c) vs (a)+(b) [The Guidance Objection] - High Severity.
  2.  (e) vs (a) [Role-based exceptions] - Medium Severity (depends on interpretation of 'permissible').
  3.  (d) [Consistency] - Low Severity (actually supports (a)).

  *Most Costly Revision:* Giving up (a).
  *Least Costly Revision:* Modifying (c) to be weaker (e.g., "You must be in a position to know" rather than "You must know you know"). OR Rejecting (c) entirely and arguing norms regulate behavior even if inaccessible (like driving).

