  Let's refine the advice on (e). Does (e) contradict (a)? Only if the testifier is permitted to assert. The prompt says "There are cases where a testifier asserts p without knowing p...". It doesn't explicitly say it's *permissible*. But the second half talks about the hearer being permitted. I need to ask the user to clarify if the teacher is blameworthy. If the teacher is blameless, that's a problem for (a) combined with a moral theory. If the teacher is blameworthy, (e) is fine.

