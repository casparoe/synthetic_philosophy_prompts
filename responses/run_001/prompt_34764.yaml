      *   **Late Filter (LF):** The hard step is ahead. Civilizations arise frequently but kill themselves or stagnate before expansion. Result: High risk of extinction soon. Pessimism about survival, optimism (theoretically) that the universe is full of dead tech.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground. Both accept Fermi Paradox exists. Both accept we haven't seen aliens *yet*. Both accept probabilistic framework (Drake Equation style).
