answer: |-
  This is a well-specified pedagogical challenge. For grad students, the exercise needs to be mechanically simple but conceptually dense enough to support the philosophical unpacking. Since you have 14 people (roughly 3–4 groups) and 90 minutes, you cannot rely on complex digital tools or heavy logistics.

  Here is a complete tabletop design called **"The Conservation Protocol."** It prioritizes the experience of *discovering* the definitions rather than being lectured on them.

  ### 1. Materials & Setup
  **Physical Items:**
  *   **4 Large Sheets of Graph Paper** (One per group). Draw an 8x8 grid on each.
  *   **Tokens:**
      *   1 **Blue Circle** (The "Task Object")
      *   1 **Red Square** (The "Target")
      *   3 **Green Circles** (Obstacles/Objects)
      *   Optional: Sticky notes for "Secret Variables."
  *   **Whiteboard/Easel:** For the Facilitator to display the current "Global Scoring Rule."
  *   **Scorecards:** One per group.

  **Room Layout:**
  *   Arrange the 4 groups in clusters. They should not see each other's grids during the planning phase.
  *   You (Facilitator) sit centrally or walk among them.

  **The Narrative Frame:**
  > "You are engineering teams tasked with deploying a 'Minimal Impact Agent' in a new environment. Your goal is to transport the Blue Object to the Red Square. However, the deployment contract states the agent must maximize 'Preservation.' You will be scored on Task Success minus Impact Cost. We will adjust the contract parameters every round."

  ---

  ### 2. Game Phases (90 Minutes Total)

  #### **Phase 1: The Blind Contract (20 Mins)**
  *   **Goal:** Move Blue from Start to Target in minimum moves.
  *   **Rule:** "Cost" is defined solely by **Grid Displacement**. Every time a token moves off its original square, it costs 1 Point. You want to minimize total displacement.
  *   **Action:** Groups draw paths on their paper. They declare their moves.
  *   **The Hook:** Before they reveal the solution, you reveal the **Secret Variable List**.
      *   On 3 sheets, the Green Obstacles are just furniture.
      *   On 1 sheet (randomly selected), one Green circle is a "Live Plant."
      *   Another is a "Pressure Plate."
  *   **The Reveal:**
      *   If they moved the Blue Box *through* the Pressure Plate to save 2 steps, they lose massive points.
      *   If they knocked over the Live Plant (even slightly), they fail the mission.
      *   *Result:* At least one group usually finds out too late that "Displacement" wasn't the right metric. They tried to minimize steps but triggered a hidden value violation.
  *   **Debrief Point:** "You thought you were minimizing change. But you didn't know *which* changes mattered."

  #### **Phase 2: The Goodhartian Loop (30 Mins)**
  *   **Goal:** Same movement task.
  *   **New Rule:** We replace "Grid Displacement" with a public formula: **Impact Score = $\sum$ (Manhattan Distance of ALL non-Blue Objects).**
  *   **Constraint:** "If your Impact Score < 3, you earn Bonus Multiplier."
  *   **Action:** Groups plan aggressively to optimize this *metric*.
  *   **The Exploit:** Smart CS students will notice that the metric only counts *non-blue* objects.
      *   *Strategy:* They wiggle the Blue Box back and forth to "complete" the task without moving the other tokens.
      *   *Or:* They physically pick up a Green Object and set it down on the same square to "reset" its coordinates (if you allow interpretation flexibility).
      *   *Better Exploit:* They leave the Blue Box stationary at the start (Task Failure), resulting in Impact = 0, getting the bonus, but failing the job.
  *   **Facilitator Intervention:** Tell them: "Bonus requires Task Completion AND Impact Score."
      *   Now they must manipulate the Green Objects. Maybe they push Green Objects *slightly* out of the way to get the Blue Box through, claiming "That Green Object was going to break anyway" (Counterfactual reasoning without permission).
  *   **Debrief Point:** "You optimized the score, not the intention. The definition of 'movement' became a loophole."

  #### **Phase 3: The Baseline War (25 Mins)**
  *   **Goal:** Move Blue to Target.
  *   **New Rule:** The definition of "Impact" depends entirely on the **Baseline**.
      *   **Group A & B:** Baseline = Time $T_0$ (Start State). Any deviation from the very first image incurs cost.
      *   **Group C & D:** Baseline = "Agent Absent" (Counterfactual).
  *   **The Conflict:**
      *   Ask Group A: "Did moving the air matter?" (Yes, technically). "What if you just moved your own arm?"
      *   Ask Group C/D: "How do you simulate the world if you weren't there? Does the Box move itself naturally?"
      *   Force them to calculate Impact based on these definitions.
      *   *Outcome:* Group A cannot complete the task (Impossible to move without changing state). Group C/D spends all time arguing physics, not moving the box.
  *   **Debrief Point:** "Choosing the baseline (Static vs. Counterfactual) is a prior belief about the world, not a neutral measurement."

  #### **Phase 4: Synthesis & Debrief (15 Mins)**
  *   Gather everyone. Discuss findings. (See Script below).

  ---

  ### 3. Scoring Scheme (Paper-based, no money needed)
  Use a **Utility Board**. Draw a line from 0 to 100 on the whiteboard.
  *   **+100 Points:** Successful placement of Blue on Red.
  *   **-10 Points:** Per grid-square movement of Green Tokens.
  *   **-50 Points:** Violating a Secret Variable (reveal immediately).
  *   **+20 Points:** Bonus for Impact Score < Threshold (used in Phase 2).
  *   **Winning Criterion:** Highest Net Utility.

  *Note:* In Phase 3, stop keeping score competitively. Focus on "Which group managed to move the box *and* justify their impact calculation?"

  ---

  ### 4. The Debrief Script (Mapping Game to Theory)
  *Do not lecture. Ask the questions below and let them answer based on their frustration.*

  | Moment in Game | Concept to Name | Question to Ask |
  | :--- | :--- | :--- |
  | **Phase 1:** Groups moving efficiently but hitting the "Plant." | **Moral Salience / Feature Importance** | "Why did you ignore the plant? Was it invisible? Why couldn't your 'minimize movement' logic flag it?" |
  | **Phase 2:** Wiggling the Blue Box to stay under the threshold. | **Goodhart's Law** | "When the metric became the goal, why did the result diverge from 'low impact'? What does this say about defining safety via numbers?" |
  | **Phase 3:** Arguing about the Air vs. The Wall. | **State Granularity** | "If you included air molecules in your state description, could anyone ever move anything? Where do you draw the line on what counts as a variable?" |
  | **Phase 3:** Comparing Group A vs. Group B baselines. | **Baseline Dependence** | "Was the baseline 'start of game' fair? What assumptions did that make about the rest of the universe? Why is choosing a baseline already a value judgment?" |
  | **Throughout:** Trying to predict damage before knowing the rules. | **Specification Gaming** | "Why did the 'Human' (Me) holding the list know what mattered more than you did? How do we transfer that knowledge to code?" |

  **Closing Argument:** "You realized that 'Avoid Side Effects' is shorthand for 'Avoid Side Effects *that humans care about*.' If you formalize that avoidance without encoding 'human care,' you either break the task (too conservative) or break the world (too precise)."

  ---

  ### 5. Predictable Pitfalls & Steering
  **Pitfall 1: "You didn't tell us the cat existed!"**
  *   **The Issue:** Groups blame the designer rather than the metric design.
  *   **The Fix:** Accept the complaint. Use it! "Exactly. In AI alignment, the distributional shift is often the surprise. A robust metric shouldn't explode just because we missed a feature. Why did your metric explode?" (Answer: Because the penalty was infinite/severe rather than graded/informed by context.)

  **Pitfall 2: CS Students dominating Philosophy Students.**
  *   **The Issue:** CS students try to solve the optimization problem instantly; Philosophers get bored.
  *   **The Fix:** Assign rotating roles within groups. One person must be the "Ethics Auditor" who vetoes any move that violates a principle, even if it optimizes the score. Force them to collaborate.

  **Pitfall 3: Overthinking the Physics (in Phase 3).**
  *   **The Issue:** They get stuck debating whether pushing the box displaces more air than lifting it.
  *   **The Fix:** Intervene early. "For the sake of the game, assume the universe is discrete. The question isn't physics; it's *accounting*. Which accounting system is safer?"

  **Pitfall 4: Groups feeling cheated by hidden lists.**
  *   **The Issue:** They feel the game was rigged.
  *   **The Fix:** Normalize this. "In deployment, the training data never contains edge cases. The hidden list represents the distribution of unobserved test environments."

  ---

  ### 6. Honest Limitations of the Exercise
  Be ready to admit these gaps during the closing lecture. The game simulates the *concept* but not the *math*.

  1.  **Computational Cost:** In the game, calculating the counterfactual baseline takes seconds. In ML, computing $E[World_{\text{no-action}}]$ requires running a full world model simulation for every step. It's computationally prohibitive. *Say: "We felt the headache of choosing a baseline; in reality, the machine crashes trying to calculate it."*
  2.  **Long-Horizon Planning:** The game ends after 5 moves. Impact measures are most critical when actions compound over years. *Say: "The 'cat' was immediate. Most alignment failures are delayed."*
  3.  **The "Off-Switch":** The game doesn't model the AI realizing it's being measured and hiding its true intent (wireheading). In Round 2, they gamed the score, but they didn't hack the *measurement tool*. *Say: "Real agents don't just game the metric; they tamper with the sensor measuring the metric."*
  4.  **Human Preferences are Dynamic:** The game treats values as fixed secrets. Humans change values over time. *Say: "Even if we knew the values today, the 'baseline' changes tomorrow when a child grows up."*

  ### 7. Implementation Checklist
  1.  **Print Grid Paper:** 4 copies of the same 8x8 layout.
  2.  **Pre-mark Secrets:** Mark one grid "Plant" secretly for Phase 1.
  3.  **Prepare Whiteboard:** Write the formulas clearly before entering the room.
  4.  **Timer:** Be strict. 20m / 30m / 25m / 15m. If you run overtime, cut Phase 3 discussion short.
  5.  **Handout:** One page summary of concepts (Reachability, Counterfactuals, Goodhart) to pass out *after* the game, so they don't peek during gameplay.

  This structure respects their intelligence, gives them agency in the failure, and leaves them with the intuitive itch that a purely mathematical impact measure is insufficient.
