answer: |-
  ### The Shifting Bar of Justification: Pragmatic Encroachment and Epistemic Contextualism as Rivals

  In contemporary epistemology, the analysis of knowledge has been dominated by the struggle to account for the intuitive instability of knowledge ascriptions. Traditional Invariantism—the view that the truth conditions of "S knows that p" remain constant across different situations—fails to accommodate the strong intuition that knowledge attribution seems sensitive to non-evidential factors. To solve this, two major families of theory emerged: Epistemic Contextualism (EC) and Pragmatic Encroachment (PE). While both attempt to preserve the utility of 'knows' while explaining its variability, they rely on fundamentally different mechanisms. This essay argues that while a hybrid model is technically conceivable, EC and PE are best understood as theoretical rivals. Their incompatibility stems from conflicting semantic commitments regarding the stability of the concept of knowledge itself, leading to divergent explanations of the very data that motivates them.

  To understand the rivalry, one must first grasp the problem they aim to solve, typically illustrated by Deborah’s "Bank Case." In Scenario A, Deborah drives past a bank on a Friday afternoon. There is a long line, but since she has a mild interest in depositing a check, she forms a belief that the bank will be open tomorrow and asserts, "I know the bank is open." Intuitively, this assertion seems correct. In Scenario B, the stakes are raised significantly: the check is crucial to paying a mortgage, and failure results in foreclosure. Despite her evidence remaining identical to Scenario A, Deborah now feels she needs to verify the hours again; claiming she "knows" feels inappropriate. Standard Invariantism cannot easily explain why the truth value of "She knows" flips without a change in evidence.

  Epistemic Contextualism, championed by philosophers like Keith DeRose and David Lewis, resolves this by positing that the semantic content of "knows" is indexical. Much like the word "tall," which requires different height thresholds depending on whether one is comparing a jockey or a basketball player, "knows" expresses a relation between a subject and a proposition that varies with the *attributor's* conversational context. In Scenario A, the speaker's context has low standards for knowledge; Deborah meets them. In Scenario B, a skeptical interlocutor or high-stakes environment raises the conversational standards; Deborah no longer meets them. Crucially, under EC, the subject's mental state and evidence do not change; rather, the standard required to truthfully apply the predicate changes. Thus, EC preserves a form of subjective certainty while accounting for the denial of knowledge in high-stakes contexts.

  Pragmatic Encroachment, advanced by Jason Stanley and Jeremy Fantl, offers a different solution. Proponents maintain that knowledge is an invariant semantic concept—it does not mean different things in different contexts. Instead, PE argues that practical stakes directly affect the epistemic threshold necessary for knowledge. On this view, whether a subject knows depends not only on evidence and truth but also on how important being right is to the subject. In Scenario A, low stakes require less robust evidence for the proposition to count as knowledge. In Scenario B, high stakes "encroach" upon the epistemic domain, raising the justificatory burden. Under PE, Deborah literally loses knowledge in Scenario B because the cost of error is higher, even if her evidence is unchanged. Unlike EC, which locates the variance in the language user, PE locates it in the subject's practical situation.

  At first glance, these theories appear to occupy distinct conceptual niches. One could argue for a hybrid view where knowledge ascriptions are sensitive to both the attributor's context (EC) and the subject's stakes (PE). Such a hybrid would imply that 'knows' shifts standards like a grade scale (contextualism), but the minimum passing score itself is adjusted by the difficulty of the student's exam (stakes). Logically, there is no contradiction in positing a multi-variable function for knowledge truth-conditions. However, viewing them as compatible undermines the core motivations of both camps and obscures their deeper semantic conflict.

  The primary reason EC and PE are best viewed as rivals lies in their contradictory implications regarding the subject's actual epistemic status versus the utterance's truth. EC allows the subject to possess the same internal state and yet speak the truth or lie depending on who is talking. If I say "I know" in a casual context, it is true; if I say the same words in a skeptical seminar, it is false. PE insists that if the stakes are high, my claim is objectively false regardless of who is speaking. This leads to significant friction when considering disagreement. If a skeptic challenges my high-stakes claim ("You don't know"), EC says they are merely imposing a stricter standard, not accusing me of being ignorant of a fixed fact. PE says they are correcting a factual error regarding my relationship to the world. If these theories were combined, it would create an opaque system where the truth of "S knows" fluctuates based on who is observing S and what risks S faces. This complexity renders the concept of knowledge so unstable that it loses its normative force as a guide for action.

  Furthermore, the theories differ in how they handle the lottery case, revealing a divergence in explanatory priority. EC explains the lottery intuition (we do not say we know the ticket lost based purely on probability) by suggesting that probabilistic closure is insufficient when the conversational context invites a demand for absolute certainty. PE, however, argues that in a high-stakes scenario involving a lottery (e.g., relying on winnings to fund life-saving surgery), the lack of deductive proof becomes fatal because the practical risk outweighs the statistical safety. While EC focuses on the pragmatics of assertion, PE focuses on the rationality of action. A hybrid view attempts to capture both, but it fails to decide which factor dominates. If practical stakes fix the standard, does context override it? If context fixes the standard, do stakes matter at all? By attempting to be everything, a hybrid theory risks being nothing specific.

  The most compelling argument for treating them as rivals comes from the "Disquotational Principle." In philosophy of language, if I believe $p$, and I say "I know $p$", my statement should be informative. Contextualists argue that "knows" is transparent to context; therefore, the sentence "Bob knows he has hands" has no single truth-value. Pragmatic encroachers argue that knowledge is a robust state of being correct enough for action; therefore, the sentence has a definite truth-value determined by Bob's situation. To accept both is to accept that "knowledge" is simultaneously a fluid social construct and a rigid normative relation to reality. These metaphysical commitments are antagonistic. EC essentially treats knowledge as a conversational tool, whereas PE treats it as an action-guiding virtue. Merging them dilutes the distinct explanatory powers each offers: EC effectively dissolves skepticism by lowering standards, while PE preserves skepticism's bite by tying knowledge to practical infallibility in high-risk environments.

  Finally, the incompatibility is highlighted by the "Gricean objection." Defenders of PE often argue that Contextualists mistakenly treat conversational implicatures (what we ought to say) as semantic truth conditions (what is true). If I say I don't know, a pragmatist might argue I am implying I shouldn't act, not that I lack justification. Contextualists insist that the standard itself shifted. Since PE is a form of Invariantism (specifically Sensitive Moderate Invariantism), it maintains that the semantics of 'knows' are stable. EC denies this stability outright. Two theories cannot both be correct if one asserts semantic stability and the other asserts semantic volatility. A hybrid theorist might claim that the *application* is sensitive but the *word* is invariant, or vice versa, but this merely rephrases the debate without resolving the underlying tension between "knowledge as social agreement" and "knowledge as objective sufficiency."

  In conclusion, while one can syntactically combine the features of Epistemic Contextualism and Pragmatic Encroachment into a complex hybrid model, they are best understood as rivals in the landscape of epistemological theory. Their rivalry is not merely a competition to explain the same phenomenon differently, but a fundamental disagreement about the nature of the concept 'knowledge' itself. EC locates the source of variance in the attributor's speech community, preserving the subject's cognitive state as stable. PE locates the variance in the subject's practical environment, insisting that knowledge is intrinsically tied to action. Because they posit mutually exclusive semantic structures—one shifting, one fixed—they provide conflicting accounts of what we are doing when we attribute knowledge. For a coherent understanding of the epistemic landscape, we must choose whether 'knows' functions primarily as a marker of conversational appropriateness or a benchmark of actionable truth. Until this distinction is resolved, treating them as anything other than competing visions for the future of epistemology would obscure the depth of the challenge they present to traditional philosophy.
