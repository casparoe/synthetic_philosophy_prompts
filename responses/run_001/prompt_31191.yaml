prompt: |-
  You are a professor of bioethics with a side practice in clinical ethics consultation. Please think carefully and work through the following step by step.

  I direct a hospital ethics committee, and we are revising our protocol for cases where a patient's currently expressed wishes conflict with their own advance directive. We need a decision procedure our consultants can follow — not just principles, but an operational sequence: what questions to ask, in what order, what counts as a sufficient answer, where the procedure stops with a recommendation, and where it must hand the decision back to a human because the question is irreducibly one of values.

  The procedure should be grounded in the philosophical literature on precedent autonomy, personal identity over time, and the authority of the earlier self — but it must be usable by someone who has not read that literature. Be honest about which steps are judgment calls dressed up as procedure, and flag the cases the procedure cannot settle.

  Then apply the procedure to two cases:

  1. A 68-year-old with early-stage Alzheimer's, still competent, has an advance directive refusing antibiotics for pneumonia. She now has pneumonia, is mildly confused but still oriented, and says she wants treatment. Her daughter says she has become more religious in the last year and now believes life should be preserved whenever possible.

  2. A 42-year-old with a severe spinal cord injury wrote an advance directive three years ago refusing life-sustaining treatment if he were ever quadriplegic and ventilator-dependent. He is now in exactly that condition, fully cognitively intact, and consistently says he wants to continue living. He acknowledges the directive but says he simply changed his mind about what kind of life is worth living.

  For each case, note where the procedure gives a clear answer and where it doesn't.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professor of Bioethics with clinical ethics consultation practice.
      *   **Task:** Create an operational decision procedure for conflicts between current wishes and advance directives (ADs).
      *   **Audience:** Hospital ethics committee consultants (not necessarily philosophers).
      *   **Requirements:**
          *   Step-by-step operational sequence (questions, order, sufficiency criteria).
          *   Grounded in philosophical literature (precedent autonomy, personal identity, authority of earlier self) but accessible.
          *   Honest about "judgment calls" vs. procedural steps.
          *   Flag cases the procedure cannot settle.
          *   Apply the procedure to two specific cases.
          *   Note where answers are clear vs. ambiguous.

  2.  **Deconstruct the Ethical Problem:**
      *   *Core Tension:* Precedent Autonomy (the right of the past self to bind the future self) vs. Present Autonomy (the right of the current self to decide based on current values/capacities) + Beneficence (protecting the vulnerable).
      *   *Key Philosophical Concepts:* Dworkin's Critical Interests vs. Experiential Interests, Parfit's Psychological Connectedness/Continuity, Buchanan's capacity-based views, Broome's "Identity-Dependent" claims.
      *   *Clinical Reality:* Patients change their minds, cognitive status fluctuates, family dynamics interfere. We need a tool that respects legal frameworks while navigating moral ambiguity.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   *Goal:* A flowchart logic but described in text steps.
      *   *Step 1: Capacity Assessment.* This is the gatekeeper. If they lack capacity now, the AD usually rules (unless revoked). If they have capacity, it gets trickier.
      *   *Step 2: Validity & Clarity of the AD.* Was it informed? Specific? Voluntary?
      *   *Step 3: The "Change of Mind" Inquiry.* Why did they change? Is it the *same* person judging new data?
      *   *Step 4: Consistency/Stability.* Is this a fleeting confusion or a stable view?
      *   *Step 5: Harm Analysis.* Does following the AD cause irrevocable harm? Does ignoring it violate critical interests?
      *   *Step 6: The "Threshold of Competence" for Revocation.* Can a capacitated patient revoke even if the AD seemed firm? (Yes, legally and ethically, usually).
      *   *Crucial Distinction:* Where does the committee step back? When the conflict is purely value-laden without factual resolution.

      *Refining the Steps for Usability:*
      1.  **Check Competency/Capacity:** Can the patient understand the decision now?
      2.  **Verify the Directive:** Is it valid/applicable?
      3.  **Assess the Nature of Change:** Is the patient *now* expressing a different preference due to illness (confusion) or adaptation (new values)?
      4.  **Determine Scope of Authority:** Did the prior self intend to bind the future self absolutely (e.g., euthanasia context) or conditionally?
      5.  **Weigh Critical vs. Experiential Interests:** Is the patient suffering *now*? Is death the only outcome?
      6.  **Decision Point:** Follow Current Wish or Prior Wishes?
      7.  **Escalation:** When to say "I don't know."

  4.  **Integrating Philosophy (without jargon):**
      *   Instead of "Parfit," talk about "Psychological Connection."
      *   Instead of "Precedent Autonomy," talk about "Past Self vs. Present Self."
      *   Instead of "Critical Interests," talk about "Life Goals" vs. "Daily Comfort."

  5.  **Addressing the "Honesty" Requirement:**
      *   Must explicitly state where bias creeps in.
      *   Must identify when there is no "correct" answer, only a defensible one.

  6.  **Applying to Case 1 (Alzheimer's, Early Stage, Conflict):**
      *   *Facts:* 68yo, Early Alzheimer's. Oriented. Mildly confused. Wants antibiotics. Previously refused them. Daughter says religious conversion.
      *   *Analysis:* Capacity is likely intact (early stage, oriented). The directive might be outdated relative to her current values (religious shift). The "mild confusion" needs scrutiny.
      *   *Procedure Application:* Check capacity $\rightarrow$ Check validity $\rightarrow$ Assess reason for change.
      *   *Verdict:* Likely defer to current wish *if* capacity holds, because she is still substantially the same person capable of revision.

  7.  **Applying to Case 2 (SCI, Severe, No Capacity Issues, Direct Conflict):**
      *   *Facts:* 42yo SCI, Quadriplegic/Vent dependent. Fully cognizant. Refused treatment *pre-injury*. Now wants to live. Acknowledges AD.
      *   *Analysis:* High psychological continuity. No cognitive impairment affecting judgment regarding life satisfaction. Classic "Post-Adaptation" case.
      *   *Procedure Application:* Check capacity (Yes) $\rightarrow$ Verify AD $\rightarrow$ Assess change (Stable).
      *   *Verdict:* Strong argument to honor current wish. The prior self's prohibition was based on hypothetical quality of life which the current self has disproven.

  8.  **Review and Refine:**
      *   *Tone Check:* Is it academic yet practical? Yes.
      *   *Philosophy Check:* Did I capture Dworkin vs. Brock/Buchanan tensions? I need to ensure I acknowledge that some philosophers argue the prior self wins (Dworkin), others say present self wins (Brock). I must reflect this tension in the "Judgment Call" section.
      *   *Structure:* Introduction $\rightarrow$ The Protocol (Steps) $\rightarrow$ Philosophical Underpinnings (Simplified) $\rightarrow$ Limitations/Judgment Calls $\rightarrow$ Case Applications $\rightarrow$ Conclusion.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe make the algorithm binary (Pass/Fail).
      *   *Correction:* No, bioethics isn't like that. It needs to be iterative. Use "If/Then" logic but allow for "Pause."
      *   *Crucial nuance:* In Case 1, "mildly confused" is the red flag. I need to emphasize that capacity can be specific. She can be competent to refuse food but not competent to weigh antibiotic risks.
      *   *Crucial nuance:* In Case 2, the daughter's input in Case 1 matters less than the patient's competency. But in Case 2, there is no surrogate mentioned, just the patient. Wait, Case 1 mentions the daughter. I should factor that into the "Context" step.

  10. **Final Polish:** Ensure the distinction between *legal revocation* (usually present competence is enough) and *moral weight of precedent* is clear. Most jurisdictions allow a competent current patient to override an AD. The ethical dilemma is whether we *should* if the AD was deeply considered. I will frame the protocol to prioritize the current competent self but require strong justification to ignore a very specific, recent AD.

  **(Self-Correction Note):** I must remember to explicitly flag where the procedure *stops*. The prompt asks where it hands back to humans. That happens when values clash irreconcilably (e.g., how much weight do we give the "past self's dignity" vs "current self's survival").

  Let's build the response.

  *   **Introduction:** Set the stage (Bioethics Prof persona).
  *   **The Protocol:** Numbered, actionable steps.
  *   **The "Hidden" Philosophical Weight:** Briefly explaining the theory behind the steps.
  *   **The Red Flags:** Where procedure ends, wisdom begins.
  *   **Case Analysis:** Applying the steps.
  *   **Conclusion:** Summary.

  *(Wait, one more check on Case 1)*: She is "mildly confused but still oriented." This is tricky. If she lacks capacity, the AD stands. If she has capacity, the AD can be revoked. The "Early Alzheimer's" diagnosis suggests capacity *might* be impaired regarding complex medical decisions despite orientation. This is a key testing ground for Step 1.

  *(Wait, one more check on Case 2)*: This is the "Dworkin vs. Persson" debate. Some argue the pre-injury self has moral priority. Others argue the lived experience trumps the hypothetical. I need to show how the protocol handles this tension without solving it philosophically for them.

  Okay, ready to write.cw
answer: |-
  To the Director of the Ethics Committee,

  This is a profound area of friction. In my years of practice, I have found that the tension between the *Precedent Self* (who wrote the directive) and the *Present Self* (who is currently suffering or living) is where most ethics consultations founder. We often look for a "right" answer, but more often we are weighing incommensurable goods: stability of planning versus adaptability of life.

  Below is a proposed operational protocol. It is designed to be robust enough to hold up under peer review but flexible enough for bedside reality. I have annotated each step with the underlying philosophical concept, translated for clinicians who do not specialize in metaphysics.

  ***

  # Operational Protocol: Resolving Conflicts Between Advance Directives and Current Wishes

  **Purpose:** To determine the weight given to a patient’s prior written directive when contradicted by a later, verbal expression of wish.
  **Scope:** Applies only when the patient is deemed at least partially cognitively engaged with their care team.
  **Output:** A tiered recommendation ranging from "Strong Evidence for Current Wish" to "Recommendation Requires External Mediation."

  ### Phase 1: The Gatekeepers (Factual Determinations)

  These steps rely on objective or clinically assessable data. Do not proceed to Phase 2 until these are settled.

  **Step 1: Capacity Verification (Specific to Decision)**
  *   **Question:** Does the patient currently possess the capacity to understand the specific nature of the intervention, its risks/benefits, and the consequence of refusing it?
  *   **Threshold:** Orientation alone is insufficient. They must demonstrate understanding of the trade-off.
  *   **Outcome:**
      *   *No Capacity:* The procedure stops. Follow the Advance Directive (AD). (Legal and ethical standard: you cannot exercise autonomy if you lack capacity).
      *   *Yes Capacity:* Proceed to Step 2.

  **Step 2: AD Validity Check**
  *   **Question:** Was the AD created voluntarily, clearly, and with sufficient information at the time?
  *   **Red Flags:** Signed under duress, signed in error, or applies vaguely to "life support" without defining the specific condition (e.g., "pneumonia" vs. "terminal coma").
  *   **Threshold:** If the AD is invalid or inapplicable, follow current wishes. If valid, proceed.

  ### Phase 2: The Identity Bridge (Interpretive Determinations)

  This phase tests the strength of the connection between the "Past Self" and the "Present Self."

  **Step 3: The Causal Link of Change**
  *   **Question:** Has the patient articulated *why* their preference has changed since writing the AD?
  *   **Assessment:** Listen for "New Data" vs. "Pathology."
      *   *Pathology:* Confusion, delirium, untreated pain, depression, medication side effects.
      *   *New Data:* Adaptation to disability, new information about prognosis, evolution of values (e.g., spiritual shift).
  *   **Threshold:** If the change is due to acute pathology, return to Step 1 (capacity may be compromised). If due to New Data/Values, proceed.

  **Step 4: Stability and Persistence**
  *   **Question:** Is the current wish consistent over time and across conversations with providers and family?
  *   **Threshold:** One isolated statement is insufficient. Look for corroboration across multiple interactions (minimum 3-4 hours or days depending on acuity).
  *   **Sufficient Answer:** Consistent advocacy for current wish; acknowledgment of the contradiction with the AD.

  ### Phase 3: The Value Weights (Moral Determinations)

  *Warning: Here is where the procedure meets its limit. You are moving from facts to moral philosophy.*

  **Step 5: The "Irrevocability" Test**
  *   **Question:** Does the AD explicitly state that the decision is binding regardless of future change in sentiment? (e.g., "Even if I beg to live, I want X").
  *   **Philosophical Anchor:** *Dworkin's Critical Interests.* The patient intended to define the narrative arc of their life, prioritizing their *values* (dignity, avoidance of burden) over their immediate *experiences* (comfort, survival).
  *   **Rule:** If the AD is explicit about being unchangeable, there is higher weight on the Past Self. If silent on this, assume the Present Self holds default priority once competent.

  **Step 6: The Harm/Hospitality Calculation**
  *   **Question:** What is the magnitude of the physical burden involved in honoring the Present Self against the Past Self?
  *   **Option A:** Treatment is temporary/reversible (e.g., antibiotics).
  *   **Option B:** Treatment is indefinite/high burden (e.g., permanent vent).
  *   **Guideline:** If Option A, lean toward Present Self. If Option B, lean toward scrutinizing the AD's intent harder.

  ---

  ### The "Stop Signs": Where the Procedure Cannot Decide

  You must instruct your consultants that the algorithm terminates here. These are cases where reasonable people disagree, and the procedure cannot generate a single solution.

  1.  **The "Competent Revocation" Ambiguity:** Legally, a competent patient can almost always revoke an AD. Morally, some argue we owe respect to the "rational past self" that planned for the "vulnerable future self." If the Present Self is competent but the Past Self’s intent was exceptionally clear (e.g., refusal of vent in spinal cord injury), the committee must choose between *Liberty Principle* (current freedom) and *Autonomy Integrity* (keeping the promise). **Flag this as irreducible.**
  2.  **Capacity Fluctuation:** If the patient has "twilight hours" where they oscillate between wanting treatment and citing the AD, the procedure fails. This requires a longitudinal assessment, not a committee vote.
  3.  **Family Discord:** If family members assert the change in mind is due to manipulation or loss of capacity, but the patient disagrees, the procedure cannot resolve this without a formal capacity hearing.

  ---

  # Case Application

  ## Case 1: Early-Stage Alzheimer's (68-year-old Female)

  **Protocol Walkthrough:**

  *   **Step 1 (Capacity):** This is the critical fork. The patient is "oriented" but "mildly confused" with early Alzheimer's.
      *   *Action:* You cannot stop at "oriented." Ask: Can she explain *what* pneumonia is? Can she articulate why she previously refused antibiotics vs. why she wants them now?
      *   *Risk:* Alzheimer's patients often retain procedural memory (knowing how to speak) but lose semantic depth (understanding consequences). If she cannot distinguish between "short course antibiotics" and "end-of-life intubation," capacity is likely impaired.
      *   *Result:* **If Capacity Impaired:** Follow the AD. The current desire is driven by confusion/fear, not autonomous choice. **If Capacity Intact:** Proceed.
  *   **Step 2 (AD Validity):** Assuming the AD was valid when signed.
  *   **Step 3 (Causal Link):** Daughter reports religious change. Patient expresses fear of death.
      *   *Analysis:* Religious conversion can alter values significantly (New Data). However, dementia can induce anxiety that mimics religious fervor or desperation (Pathology).
      *   *Action:* Differentiate. Is she seeking God/preservation because she finds meaning, or because she is terrified of the unknown disease process?
  *   **Step 5 (Irrevocability):** Was the AD phrased as "I refuse treatment" or "I refuse treatment unless I find hope"?
  *   **Step 6 (Harm):** Antibiotics are low burden, high potential benefit.

  **Decision Point:**
  *   **If Capacity Intact:** **Recommendation: Treat.** Legal and ethical weight favors the competent present self, especially for a non-terminal, reversible infection. The "Previous Self" cannot dictate how a "Current Self" reacts to mortality when the disease itself is not the cause of the refusal. The slight progression of Alzheimer's does not automatically erase the right to revise one's life plan unless capacity is lost.
  *   **Where Procedure Stops:** If the capacity evaluator concludes she lacks the depth to understand the long-term trajectory of her dementia, the procedure stops. The question becomes: *Does preserving her biological life now violate the critical interest of her former self to avoid prolonged decline?* This is a judgment call. Given the reversible nature of pneumonia, the conservative path (follow current wish) is safer ethically, but the committee must document the capacity uncertainty.

  ## Case 2: Severe Spinal Cord Injury (42-year-old Male)

  **Protocol Walkthrough:**

  *   **Step 1 (Capacity):** Fully cognitively intact.
      *   *Result:* Pass.
  *   **Step 2 (AD Validity):** Written 3 years ago. Specific to quadriplegia/vent.
      *   *Result:* Pass (but see Step 5).
  *   **Step 3 (Causal Link):** He states he "changed his mind."
      *   *Analysis:* This is the classic "adaptation" scenario. The literature (e.g., Paul Broks, Tom Shakespeare) shows quality of life judgments are notoriously unreliable before injury. The Present Self has *lived* through the condition predicted by the Past Self. The Past Self judged a theoretical horror; the Present Self judges a lived reality.
  *   **Step 4 (Stability):** Consistently says he wants to continue.
      *   *Result:* Pass.
  *   **Step 5 (Irrevocability):** Does the AD say "Regardless of what I feel later"?
      *   *Scenario A:* If yes: We have a direct collision of *Critical Interest* (Dworkin's term: maintaining the integrity of life as a narrative) vs. *Experiential Interest* (current happiness).
      *   *Scenario B:* If no (standard language): Standard law allows revocation.
  *   **Step 6 (Harm):** Ventilation is high burden (though potentially manageable with assistance). Withdrawing means death. Administering means decades of ventilator dependence.

  **Decision Point:**
  *   **Recommendation:** **Respect Current Wish (Continue Care).**
  *   **Reasoning:** This falls under the "Post-Adaptation" doctrine. While the "Past Self" exercised precedent autonomy, the "Present Self" demonstrates greater psychological connectedness to the actual situation. The previous refusal was based on a misprediction of Quality of Life. Honoring the AD would punish the patient for having adapted well.
  *   **Where Procedure Stops:**
      *   **The "Burden to Family" Argument:** The procedure *cannot* weigh the financial or emotional cost to the family against the patient's will. That is outside the scope.
      *   **The Integrity Objection:** A minority of ethicists argue we must honor the original directive to protect the "integrity of the will." If your hospital culture leans heavily towards respecting the *historical* contract of the AD, this committee might split. The procedure flags this as a **Value Conflict**. There is no wrong answer here, only two coherent ethical positions. However, given his full capacity and consistency, the default professional consensus is to privilege the current competent voice.

  ---

  # Final Instructions for Your Consultants

  Tell them this:

  > "This protocol gives you the map, not the terrain. When you reach Step 5 (The Value Weights), you will find that facts run out.
  >
  > In **Case 1**, the danger is treating a confused patient who doesn't truly understand what they are agreeing to. Focus heavily on Step 1.
  >
  > In **Case 2**, the danger is disrespecting a deeply held prior commitment. Focus heavily on Step 3. Did he truly understand his old fears were misplaced?
  >
  > Finally, if you find yourselves arguing about whether the 'Past Self' is more important than the 'Present Self,' stop. You have entered the realm of irreducible value judgment. Write a consult note stating both sides are morally defensible, and recommend a consensus based on the patient's best observable welfare, rather than declaring one side 'Right.'"

  This approach protects the committee from liability by demonstrating rigorous process, while acknowledging the limits of bioethics in resolving deep existential conflicts.
