      *   *Point 2: Resistance & Identity.* Joel doesn't just change his mind; he fights the procedure from *within*. This suggests that some commitments aren't strategic; they're ontological. You can't bind yourself out of something that makes you *you*. This challenges Elster's assumption that desires are fungible or separable.
      *   *Point 3: The Paradox of the Ending.* Why go back? If the point of Ulysses contracts is to avoid failure, why repeat? Because the *process* is the meaning. The choice to repeat despite knowledge mirrors Kantian duty or existential commitment rather than utilitarian calculation. It critiques the idea that precommitment is always about optimizing outcomes (pain reduction). Sometimes suffering is constitutive.
      *   *Point 4: The Standing Problem.* Does Clementine have the standing to erase Joel's memories of her, or vice versa? Or is it self-binding? They do it mutually, but the procedure reveals it was unilateral on the deep level (Joel didn't want to do it while doing it). This touches on the "tyranny of the past self."

