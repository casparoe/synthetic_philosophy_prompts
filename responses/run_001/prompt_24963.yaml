answer: |-
  This is a powerful and classic line of reasoning, closely related to arguments made by Hilary Putnam (in *“Representation and Reality”*) and John Searle (the Chinese Room argument). Your dilemma is well-formulated: if you accept a thin notion of "implementation," you get rocks having minds; if you demand a thick notion, you risk obscurity or dualism.

  The argument is logically valid, but it is unsound. The flaw lies specifically in **Premise (3)**, supported by a misunderstanding of **Premise (2)**.

  ### The Weak Link: Premise (3) and the Definition of Implementation

  Your argument rests on the claim that *any* physical system with enough degrees of freedom can be mapped to *any* computation via some mathematical function. This is true if "implementation" is defined purely statically—as a bijection between the set of a system's physical states and the set of a computational state's symbols. This is known as the **"Triviality Argument."**

  However, nearly all serious computationalists in philosophy of mind and cognitive science reject this static definition of implementation. They subscribe to a **Causal-Structural Account** of implementation (championed by philosophers like Gualtiero Piccinini, David Chalmers, and Ruth Millikan). Under this view, a physical system does not merely possess states that look like computational states; the system must **realize the causal transitions** of the computation.

  To preserve Premise (1) while saving yourself from the rock, you must refine Premise (3) and clarify Premise (2) along these lines:

  1.  **Computation requires Counterfactual Support:** A physical system implements a computation only if the physical transition from State A to State B corresponds to the computational step from Logic A to Logic B *regardless of whether the system actually undergoes that transition.* If I were to perturb the inputs to the brain (or the simulated machine), the output would change according to the algorithm. In a rock, the sequence of states is determined by chaotic physics, not by the logic of a program. To map a rock to a mind, you would need a mapping that actively ignores or overrides the rock's actual causal structure.
  2.  **Implementation is Mechanistic, Not Hermeneutic:** Premise (2) suggests computation is "relative to a mapping." While language is relative, the *functional organization* of a mechanism is not. A toaster is designed to heat bread; that is intrinsic to its engineering. Similarly, a specific pattern of neuronal firing (or silicon gates) carries out information processing intrinsically because of its physical connectivity. A rock does not have this internal, modular organization. It does not "compute" anything because it lacks the mechanical parts working together to process input into output.
  3.  **The Cost is Low:** You do not need Platonism here. You simply need to assert that "computation" is a property of certain highly organized physical structures, much like "digestion" is a property of stomachs. You don't say a brick digests food because there is a mathematical mapping between its molecules and a stomach's chemical reactions; digestion requires specific causal organization. Implementation requires specific physical organization.

  ### Why Rejecting (1) is Not the Only Option

  You noted that rejecting (1) forces us into substrate chauvinism or mysterianism. This assumes that if it's not "computation," it must be "magic biology." But if you adopt the mechanistic account of computation above, you see that computation is not separate from biology; it is the formal description of the biological mechanism.

  *   **If you keep (1):** You must reject the "thin" version of (3). You accept that computation is not *any* mapping, but *causally faithful* mappings. This blocks the rock from implementing a mind, because a rock cannot sustain the counterfactual causal dependencies required by a conscious mind's architecture.
  *   **If you accept (2) and (3):** You are forced into Promiscuous Panpsychism. This is the view held by Integrated Information Theory (IIT), though proponents argue that while a rock might have a tiny amount of consciousness, it's so negligible as to be irrelevant. However, since you find (5) ("Rocks have no experience") undeniable, this path is blocked for you.
  *   **If you reject (1):** You become a Biological Naturalist (Searle) or Mysterian. You concede that high-level patterns of matter matter, but not in a way that is substrate-independent. This violates the spirit of computationalism.

  ### The Diagnosis

  The conclusion (4) follows only if you accept a "brute force" definition of implementation that allows observers to ignore the physical causal structure of the system entirely. By tightening the definition of implementation to require **causal/counterfactual fidelity**, you eliminate the possibility of the rock mapping while retaining the claim that brains implement consciousness via their specific functional organization.

  The argument fails because it equivocates on "implementation": using a trivial mathematical isomorphism to prove that rocks are computers, then switching to a rich functional definition to claim that only brains are conscious.

  ***

  **Summary Diagnosis**
  The argument collapses because Premise (3) relies on a trivialized definition of "implementation" that ignores the requirement that a physical system must internally sustain the causal counterfactuals of the computation it is said to perform.
