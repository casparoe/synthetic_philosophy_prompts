answer: |-
  ### Strong Precommitments
  These devices impose high costs and visibility on reversal, leaving few evasive routes and significantly altering expectations of future behavior.

  2. **Supermajority amendment rule:** The high consensus threshold makes reversal prohibitively expensive and visible, forcing proponents to secure enduring support before acting.
  3. **Eternity clause:** By declaring certain principles unalterable, it forces future violators to reject the legitimacy of the entire constitutional order to succeed.
  4. **Independent constitutional court:** Independent judicial review empowers a distinct institution to impose immediate legal costs on the majority attempting to violate rights.

  ### Partial Precommitments
  These devices introduce friction or require extra steps for violation, but retain viable escape routes or structural vulnerabilities that weaken the binding effect.

  6. **Fixed election calendar:** It locks in the temporal rhythm of democracy, though it remains vulnerable to amendment processes that could shorten the interval for political advantage.
  7. **Balanced-budget rule with escape clause:** The emergency escape clause admits that fiscal discipline must yield to crisis, significantly lowering the expected cost of violating the rule when temptation peaks.
  9. **Treaty approval by referendum:** Mandating public consent complicates sovereignty transfers, yet governments can still evade the spirit of the rule by framing questions to influence voter outcomes.
  10. **Bicameral amendment blocker:** A second chamber introduces a friction point for constitutional change, but if the upper house shares the ruling coalition, this hurdle dissolves without needing broader consensus.

  ### Weak Precommitments
  These devices fail to constrain a future majority effectively because they are easily reversed, lack enforcement, or rely solely on voluntary compliance.

  1. **Simple legislative majority amendment:** A simple majority requirement imposes no additional cost on repeal, signaling that the rule is merely a temporary resolution rather than a durable constraint.
  5. **Statutory central-bank independence:** Since ordinary legislation suffices for repeal, the central bank lacks protection against the shifting priorities of the next parliamentary session.
  8. **Rhetorical preamble:** Lacking enforcement mechanisms or sanctions, this statement imposes no tangible cost on decision-makers who prioritize short-term popularity over stated ideals.

  The tier list prioritizes legal enforceability over the democratic continuity of the constraint, obscuring whether the precommitment binds the future people to their own past judgment or merely binds future legislators to the entrenched preferences of past elites.
