      *   **9. Treaty approval by referendum:**
          *   *Analysis:* Requires direct popular consent. Harder to manipulate than a legislature. Binds the government more tightly than simple legislative ratification. However, referendums themselves can be manipulated (question wording, turnout). Still, it's harder to bypass than a simple bill.
