answer: |-
  This is a classic and formidable objection. You have effectively reconstructed the **Self-Undermining Verificationism** argument against ontological realism. If the criterion for "substance" (Step 1) is strictly empirical observability, then the criterion itself cannot be observed, and thus collapses into a meaningless utterance.

  To keep the insight that much ontology is verbal (like the table/particle debate) without committing suicide, you should **reject Step (1)**.

  Here is the breakdown of why (1) must go, the cost of letting it go, and a reconstruction that saves your core intuition without self-destructing.

  ### 1. Which step to reject?
  **Reject Premise (1).**

  Your argument relies on a **Verificationist Theory of Meaning/Substance**. This holds that a statement or dispute has cognitive content only if it entails differences in sensory experience. While this was popular in early logical positivism (Carnap/Ayer), it was largely abandoned in philosophy of science because:
  *   **Duhem-Quine Thesis:** Scientific theories are never tested in isolation; they are webs of belief.
  *   **Theoretical Virtues:** We often accept unobservable entities (quarks, gene sequences) because they maximize simplicity, unity, and explanatory power, not because they offer unique "observations" distinct from alternative models.

  By insisting on *observational* difference, you make ontological commitments dependent on *epistemological access*. But ontology is usually about what *exists*, not what we can *see*.

  ### 2. What does rejecting (1) cost you?
  You lose the comfort of **Scientific Naturalism**.
  If you drop the requirement for observational difference, you must admit that metaphysical truths are not "hard facts" discoverable by a telescope or microscope. You shift from **Descriptive Realism** (describing the furniture of the universe) to **Normative or Structural Realism** (describing how our best conceptual frameworks fit reality or map onto it).

  You trade empirical certainty for pragmatic justification. You acknowledge that saying "Tables exist" is less like discovering an electron and more like deciding that a specific coordinate system is useful for navigation.

  ### 3. A Weaker Criterion That Survives
  To save the verdict on tables (verbal) while saving yourself from the self-reference trap, replace the **Empirical Criterion** with the **Methodological/Explanatory Criterion**.

  **Proposed Replacement for (1):**
  > *(1\**) A dispute is substantive only if adopting one side necessitates a different set of **investigative methods**, **theoretical virtues**, or **inferential roles** than the other.*

  Let's apply this new criterion to see if it solves the dilemma.

  #### Case A: The Table Debate (Nihilist vs. Universalist)
  *   **Universalist:** "Tables exist as composites."
  *   **Nihilist:** "Only particles arranged table-wise exist."
  *   **Methodology:** Both parties instruct physicists to study the interactions of fermions and bosons. Both use the same conservation laws. Neither side demands we treat the "table" as having independent causal powers distinct from its parts.
  *   **Result:** There is no methodological or explanatory divergence. The term "table" functions merely as shorthand.
  *   **Verdict:** **Verbal.** (Your original intuition is preserved.)

  #### Case B: The Meta-Ontological Debate (About Criterion 1*)
  *   **Side A (Proponent of 1*):** "Ontology aims to track joint-carving categories." (Requires looking for fundamental structure).
  *   **Side B (Critique of 1*):** "Ontology is just a record of useful quantifiers." (Requires looking at linguistic pragmatics).
  *   **Methodology:** Side A pushes philosophers to analyze physical structure (physics-heavy metaphysics). Side B pushes philosophers to analyze language and use (semantic/linguistic heavy metaphysics).
  *   **Result:** Adopting one stance changes the entire trajectory of philosophical research. It dictates what counts as a "good answer."
  *   **Verdict:** **Substantive.**

  #### Why This Avoids the "Self-Eating" Trap
  The self-reference trap in your original argument happened because you required **Observational Evidence**. The new criterion requires **Methodological Consequence**.

  Notice that the new criterion (1*) does not predict an observation. It predicts a **practice**.
  *   Does the claim "Methodological consequences determine substance" allow for an observation that proves it? No.
  *   **Does that matter?** No. Because the criterion is **Normative**, not Descriptive.

  It is akin to a lawyer arguing a legal rule.
  *   "Is this law substantive?"
  *   If the law changes how judges sentence criminals, it is substantive.
  *   If two lawyers argue over the definition of "law," they aren't arguing about a rock; they are arguing about **authority**. Authority doesn't show up under a microscope, but the dispute is real because it affects social outcomes.

  Similarly, the Meta-Ontological dispute affects the **authority of ontological claims**. Therefore, the dispute over (1*) is substantive, even if no microscope can detect "substantiveness."

  ### Summary of the Exit
  1.  **Step (1)** is the anchor dragging you down. It forces metaphysics into a box (Empiricism) it doesn't fit in.
  2.  **The Cost:** Accept that ontology is partly about values (simplicity, structure, utility) rather than just brute facts.
  3.  **The Fix:** Define "Substance" via **Methodological Commitment**.
      *   If a debate leaves your *science* and *research strategy* unchanged (like Tables), it is verbal.
      *   If a debate changes *what counts as a valid explanation* (like Meta-Ontology), it is substantive.
  4.  **The Escape:** The criterion itself governs explanations, so it participates in the substantive class it defines, but it does so by regulating norms rather than predicting observations.

  This preserves your desire to dismiss the "table" debate as trivial noise while allowing the "meta-ontological" debate to remain a meaningful inquiry about how we should organize our knowledge of the world.
