answer: |-
  The debate concerning the literal status of the genetic code represents one of the most persistent frictions in contemporary philosophy of biology. On the face of it, the participants share a complete concordance regarding the biochemistry of transcription and translation. The mapping of nucleotide triplets to amino acids is fixed, redundant, and universal across nearly all life forms. Consequently, when proponents like John Maynard Smith speak of DNA encoding instructions, and critics like Sahotra Sarkar or Paul Griffiths insist it is merely a causal template, the disagreement does not stem from competing data. Instead, it arises from divergent analyses of what constitutes information, representation, and agency in a naturalised world. While the dispute appears verbal—centred on the application of the term 'code'—it is fundamentally a **substantive** disagreement regarding the possibility of naturalised semiotics. It turns on whether semantic properties can exist in the absence of a conscious sender or interpreter.

  To diagnose this accurately, we must first examine the specific arguments deployed by each faction. Maynard Smith, particularly in works such as *The Evolution of Sex* and *The Language of Genes*, relies on an analysis of the relationship between the sign and its effect. His argument rests on the principle of arbitrariness. In a genuine code, the connection between the signal (the codon) and the outcome (the amino acid) is not physically necessitated by the laws of physics alone; rather, it depends on the cellular machinery to interpret it. Smith argues that because evolution has 'selected' this specific mapping over others, the genome functions analogously to a written language. For Smith, the 'sender' is the lineage of ancestors whose selective pressures established the rule, and the 'receiver' is the ribosome translating the sequence. Thus, calling DNA a code is not metaphorical shorthand; it is an ontologically precise description of a system involving specification and functional dependence.

  Conversely, Sarkar and Griffiths argue that this analogy smuggles in anthropomorphic assumptions. In their view, a code proper requires an intentional agent who assigns meanings to signs. Without a mind to interpret the symbols, DNA is simply a physicochemical causal structure—a template where molecular shape determines bonding, much like a die casting metal into a specific form. To call this a 'code' is to commit a category error. They posit that semantic information entails truth values or satisfaction conditions, which physical molecules lack. For the critic, the genome causes development through chemical kinetics, not by conveying messages that are decoded. The danger, they argue, is that 'information' talk reifies abstract relations into biological entities, potentially obscuring the material mechanisms of evolution.

  At first glance, this suggests a verbal dispute. If both sides were to agree on a strict dictionary definition—for instance, stipulating that 'code' *requires* a conscious author—the critics would win. Conversely, if 'code' is defined broadly as any arbitrary mapping, the proponents win. However, the persistence of the debate suggests that neither side accepts the other's stipulation as neutral. When Maynard Smith insists on the 'ordinary sense' of the word, he is appealing to the explanatory utility of treating the genome as a repository of instructions. When Sarkar rejects this, he is appealing to a metaphysical constraint on naturalism. Therefore, the verbality is superficial. The core disagreement is substantive: **can semantic content emerge from blind mechanical processes?** This is a question about the nature of biological functions and whether 'teleonomy' (apparent purpose) justifies the attribution of semantic content.

  If this were merely a verbal dispute, progress would be achieved by adopting a convention that separates 'biological code' from 'linguistic code.' Yet, the friction remains because both sides fear the ontological consequences of conceding the point. For Smith, conceding denies the specificity of genetic selection. For Sarkar, accepting it grants undue agency to matter. Thus, the dispute is driven by conflicting commitments to the boundaries of naturalised metaphysics. One side is engaging in what can be called 'functional realism' (properties exist because of their role in a system), while the other maintains a 'causal physicalism' (properties exist only via direct mechanistic causation).

  Given this diagnosis, what would count as progress? An experimental result is unlikely to resolve it, as no chemical assay can detect 'meaning.' A formal result is more promising. Progress would look like a rigorous naturalised theory of information that distinguishes semantic dependency from causal dependency without invoking consciousness. For example, if a formal framework (such as a refined version of Shannon theory combined with teleosemantics) could demonstrate that 'coding' relations possess invariant structural properties distinct from generic 'template' copying, independent of human interpretation, the debate could settle. We would need a mathematical or logical criterion that validates the code-mapping as unique among chemical interactions. Until such a distinction is formalised, the debate risks cycling through pragmatic definitions without resolving the underlying metaphysical anxiety.

  However, my diagnosis is not without vulnerability. My claim that this is substantive relies on the assumption that both parties are genuinely making ontological claims rather than strategic moves in a sociological context of scientific discourse. It is possible that the 'code' metaphor persists simply because it aids prediction and modelling, regardless of ontological truth. If it turns out that scientists care little for the metaphysics and use the term instrumentally, then treating the debate as a serious philosophical conflict is itself a category mistake. Furthermore, I may be overstating the commitment of the critics. Some versions of the anti-code position admit that DNA stores 'negative entropy' or reduces uncertainty, effectively agreeing with Smith on the utility of information theory while quarrelling over the label. If the critics accept functional equivalence, the disagreement collapses back into the verbal realm.

  What would most likely change my mind about this diagnosis? If it were demonstrated that the disagreement hinged entirely on a specific definition of 'intentionality' that is being used inconsistently across the literature. If I found that 'intentionality' in the pro-code argument refers to 'selection history,' whereas in the anti-code argument it refers to 'conscious awareness,' the dispute is revealed to be a confusion of terms rather than a deep metaphysical rift. Resolving this terminological ambiguity would shift the diagnosis from substantive to verbal. Currently, however, the entanglement of function, evolution, and causation suggests a substantive divide regarding the naturalisation of mind. Ultimately, the disagreement highlights a profound uncertainty in biology about whether life is a process of causal determination or a process of informational processing. Until biology can fully naturalise the concept of representation, the debate over the genetic code will remain an enduring, substantive fissure in the philosophy of life.

