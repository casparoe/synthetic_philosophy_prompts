      *   *Claim 4:* State-given reasons aren't "real" reasons for the attitude; they are pragmatic payoffs unrelated to fittingness.
      *   *Claim 5:* This is a big problem for Buck-Passing Accounts (BPA) because BPA says value = reasons for attitudes.
      *   *Claim 6:* BPAs cannot distinguish right kind of reasons (RKR) from WKR.
