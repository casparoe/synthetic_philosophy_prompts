answer: |-
  ### Exam Question

  **Question:**
  The "Zombie Argument" purports to demonstrate that physicalism is false based on the claim that we can coherently conceive of a world physically identical to ours but lacking conscious experience. This argument depends critically on the transition from the *epistemic* fact that zombies are conceivable to the *metaphysical* conclusion that zombies are possible. 

  Critically evaluate this inference. In your answer, you must address the following three elements:
  1.  Explain what specific philosophical work the premise "zombies are conceivable" is intended to perform in establishing a threat to physicalism. Why is this stronger than merely stating that we do not currently understand consciousness?
  2.  Analyze why the standard physicalist appeal to *a posteriori* necessity (the Water/H2O analogy) is claimed by anti-physicalists to fail when applied to consciousness. Specifically, how does the nature of phenomenal concepts undermine the physicalist comparison?
  3.  Detail what a physicalist must argue about the relationship between concepts and modality in order to resist the zombie conclusion without begging the question. (Do not simply assert that conceivability does not entail possibility; explain the structural move required to block the inference).

  ***

  ### Model Answer

  The zombie argument aims to leverage an epistemic intuition to generate an ontological verdict. Its primary function is to establish a genuine modal gap between the physical facts and the facts of consciousness. If zombies are conceivable, and conceivability entails possibility (as the anti-physicalist asserts), then there exists a possible world where the physical substrate remains constant while phenomenal consciousness vanishes. This logically necessitates that consciousness is not supervenient on the physical, thereby falsifying type-A or type-B physicalism. The work of the premise is not to highlight an explanatory gap—which could be dismissed as mere ignorance—but to posit a separation of truth-makers. It suggests that knowing all physical truths would not *logically guarantee* knowledge of phenomenal truths, implying that consciousness is an additional ontological component.

  To resist this, physicalists typically invoke Saul Kripke’s framework of *a posteriori* necessity. Kripke argued that while identities like "Water is H2O" were discovered empirically, they hold necessarily across possible worlds because 'water' and 'H2O' are rigid designators. Similarly, a physicalist hopes to argue that "Pain is C-Fiber firing" is necessarily true once identified, even if it appears contingent due to our limited cognitive access. However, the zombie argument claims this analogy breaks down because of the unique transparency of phenomenal concepts. When we imagine pain, we refer to the experience directly via acquaintance, not via description. With "Water," we fix the reference to a functional or appearance-based property, allowing us to distinguish the concept from the essence in a way that permits imagining non-H2O water. With pain, the concept picks out the phenomenon immediately; if the experience were absent, the concept would fail to refer at all, or the subject would not be thinking of pain. Therefore, unlike the Water case, there is no "superficial appearance" distinct from the underlying nature that can be stripped away while keeping the other element fixed.

  For the physicalist to successfully block the zombie inference without simply denying the link between conceivability and possibility, they must refine their account of concepts and modality. One prominent strategy involves the Phenomenal Concept Strategy (PCS). Here, the physicalist admits the *epistemic* gap but denies it implies an *ontological* gap. They must argue that the contingency we perceive in "Pain might not have been C-fibers" is a result of the dual nature of human cognition, not the world. We possess two ways of grasping the same neural state: the third-person physical concept and the first-person phenomenal concept. These are modes of presentation. The anti-physicalist argues these are properties of different things; the physicalist insists they are different concepts of the same thing.

  Consequently, to survive the zombie challenge, the physicalist must maintain that while zombies are conceivable relative to our current cognitive architecture (we can imagine missing qualia while retaining physics), they are not metaphysically possible given the nature of identity. This requires a commitment to a form of conceptual dualism or two-dimensional semantics where the primary intension of "consciousness" allows for the conception of a zombie, but its secondary intension tracks physical realization across all worlds. Alternatively, the physicalist must deny ideal rationality, arguing that full physical understanding would actually eliminate the conceivability of zombies upon reflection. Without such structural modifications to the theory of concepts—specifically explaining why the phenomenal concept resists the rigid designation defense—the physicalist leaves themselves open to the charge that they are conflating the limits of human understanding with the limits of nature. Ultimately, the debate rests on whether the phenomenological immediacy of experience constitutes evidence of separate ontology or merely a unique cognitive relation to a single physical reality.

  ***

  ### Marking Scheme

  **Total Marks: 25**

  | Grade Band | Criteria & Specific Moves Required | Common Pitfalls (Deduction Triggers) |
  | :--- | :--- | :--- |
  | **A (Excellent)** | • **Argument Reconstruction:** Clearly distinguishes between epistemic possibility (conceivable) and metaphysical possibility (possible) and explains why bridging them is the argument's critical vulnerability.<br>• **The "Work" of the Premise:** Explicitly states that the premise attempts to prove *non-supervenience*, not just ignorance.<br>• **Kripke Critique:** Accurately identifies that the failure of the Water/H2O analogy lies in the lack of an intermediary "appearance" for phenomenal concepts compared to empirical kinds.<br>• **Physicalist Move:** Proposes a specific mechanism (e.g., Phenomenal Concept Strategy, Modes of Presentation, or two-factor theories) to explain why the epistemic gap remains without an ontological gap.<br>• **Writing:** Precise, structured, and uses terminology correctly without relying on name-dropping. | • Asserting "Imagination $\neq$ Reality" without explaining *why* (fails to engage with the modal logic).<br>• Conflating natural possibility (can we build this?) with logical/metaphysical possibility.<br>• Stating "Kripke said X" without applying the mechanics of his theory to the specific zombie context.<br>• Ignoring the requirement to discuss concepts/modes of presentation. |
  | **B (Good)** | • **Understanding:** Correctly defines zombies and physicalism implicitly through application.<br>• **Standard Reply:** Identifies *a posteriori* necessity as the physicalist's tool.<br>• **Limitation:** Acknowledges that consciousness feels different from "Heat is Motion."<br>• **Response:** Suggests that perhaps we are mistaken about our powers of imagination. | • **Too General:** Discusses the "hard problem" generally rather than the specific logic of the conceivability argument.<br>• **Missing Nuance:** Treats *a posteriori* necessity as sufficient to stop the zombie argument without addressing the rigidity/reference-fixing objection.<br>• **Begging the Question:** Concludes physicalism is true without explaining how the inference is blocked (circularity).<br>• **Text Reliance:** Relies on reciting Chalmers/Kripke positions rather than reconstructing the argument from first principles. |
  | **C/Fail** | • **Definition Heavy:** Spends most time defining physicalism/zombies rather than analyzing the inference.<br>• **Misunderstanding Modality:** Confuses logical consistency with causal plausibility.<br>• **Simple Rejection:** Merely asserts "Zombies aren't possible because science says so" or "You can't imagine something impossible."<br>• **Incoherent:** Does not connect the concepts of conceivability, possibility, and ontology. | • Failing to address all three parts of the prompt.<br>• Using informal language that obscures the philosophical stakes.<br>• Length significantly under 400 words or over 900 words. |

  **Note to Instructor:** To differentiate A from B, look for the specific identification of *why* rigid designators matter here. An A answer understands that if phenomenal concepts are direct (non-descriptive), they cannot be swapped out like "Water" (which has a descriptive mode of presentation). An B answer will likely say "Physicalism works because maybe we just don't know enough yet," which misses the logical necessity claim of the zombie argument.
