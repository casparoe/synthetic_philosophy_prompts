answer: |-
  There is no consensus among economists regarding fairness. The Nash solution maximizes the product of gains (stability), while Kalai–Smorodinsky (KS) maximizes proportional potential gains (monotonicity). KS implies that if your best possible outcome improves, you deserve a better deal; Nash implies you don't necessarily. Neither is objectively "fair." Use the following procedure to operationalize KS, acknowledging its axioms shape the result.

  ### The KS Mediation Procedure

  1.  **Define the Disagreement Point ($d$).**
      Ask parties to specify exactly what happens if no deal is struck (e.g., dissolved company, frozen budgets). Assign utility values. **[Judgment: Parties may bluff. Force specificity: Can they legally dissolve? Are budgets locked?]**

  2.  **Define the Ideal Point ($I$).**
      Ask each party: "If the other side accepted your absolute maximum demand without resistance, what would that look like?" This establishes the "Dream" anchor. **[Judgment: Parties inflate $I$ strategically. Insist the ideal be physically/legally possible, even if unlikely.]**

  3.  **Normalize Utility Scales.**
      Rescale each party’s outcomes so $d=0$ and $I=1$. This translates incomparable utilities (money vs. prestige) into comparable ratios of satisfaction. **[Judgment: Agree on the unit of measurement. If Party A rates "prestige" 10/10 and B rates "cash" 10/10, they are weighted equally in the next step.]**

  4.  **Trace the Compromise Ray.**
      On a graph (Party A on X-axis, Party B on Y-axis), plot the normalized Ideal Point $(1,1)$ and the Disagreement Point $(0,0)$. Draw a straight line from $(0,0)$ through $(1,1)$.

  5.  **Locate the Intersection.**
      Find where this line hits the "Frontier" (the boundary of agreed-upon feasible options). This point equalizes each party's percentage of their maximum potential.

  6.  **Select the Option.**
      **[Judgment: If the intersection is not a discrete option, choose the nearest feasible neighbor and acknowledge the approximation.]**

  ### The Fairness Trap
  KS fails when ideal points expand due to pure luck. Example: If Partner A discovers a grant doubling their maximum feasible bonus, KS suggests A takes a larger slice of the *total* pot, leaving Partner B worse off despite B contributing identically. Parties often perceive this as punishing diligence for another’s luck. **Handle by:** Explaining that KS rewards *claims*, not *inputs*. If parties reject this moral intuition, switch to a Nash (proportional product) framework which ignores marginal shifts in potential outside the agreement space.

  ### Worked Examples

  **1. Co-Founders (Equity)**
  *Inputs:* Fallback ($d$) = Dissolution (0,0). Feasible Set = $Equity_A + Equity_B = 100\%$.
  *Ideals:* Both argue for 100% control. $I_A=1, I_B=1$.
  *K Calculation:* The ray from $(0,0)$ through $(1,1)$ intersects the line $x+y=1$ at $(0.5, 0.5)$.
  *Result:* 50/50 split.
  *Note:* Here KS collapses to egalitarianism because symmetries exist. If Legal Caps limited A to 90% ($I_A=0.9$), the ray would tilt, giving B > 50%.

  **2. Departments (Budget)**
  *Inputs:* Total Pot \$800k. Fallback ($d$) = \$0 (no spending allowed).
  *Needs:* Dept A Max Need \$1M ($I_A$); Dept B Max Need \$200k ($I_B$).
  *Normalization:* $x_A/1M = x_B/200k \rightarrow x_A = 5x_B$.
  *K Calculation:* Solve $5x_B + x_B = 800k \rightarrow x_B = \$133k, x_A = \$667k$.
  *Result:* Dept A gets five times the funding, despite similar departmental sizes, simply because their "Ideal" need was higher.
  *Challenge:* Dept B will object to "rewarding need inflation." You must justify the axioms beforehand.

  This procedure forces transparency on assumptions ($d$ and $I$). While mathematically consistent, remember KS privileges *aspirational capacity* over *marginal contribution*. If that conflicts with group norms, abandon the algorithm for dialogue.
