  5.  **Refining the Content based on Constraints:**
      *   *Sophistication Check:* Avoid "Utilitarians want to sacrifice minorities." Instead: "Social welfare optimization." Avoid "Retributivists want vengeance." Instead: "Moral balance restoration."
