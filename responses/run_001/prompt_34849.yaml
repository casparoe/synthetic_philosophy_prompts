      *   *Disproportionate Severity:* This is a stronger crux. If punishing a minor crime severely prevents a major catastrophe, does the consequence justify the violation of proportionality? Ret says no (rights-based). Cons says yes (if side constraints allow). Wait, sophisticated Cons admits side constraints. So the crux is whether side constraints are absolute or weighty.
      *   *Resource Allocation:* Retributivism struggles here (equal desert -> equal treatment regardless of cost?). Consequentialism excels (maximize utility per dollar).
