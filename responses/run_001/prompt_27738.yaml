answer: |-
  You are describing a very real, very frustrating dynamic that sits at the intersection of sociology, game theory, and organizational psychology. You are correct that it is distinct from the Bystander Effect (which is about *inaction*) and Groupthink (which is about *conformity*).

  There isn't one single catchy "-ism" word like "Groupthink" that covers this perfectly, but there are three precise terms depending on which lens you use.

  ### 1. The Names

  **A. The Political/Historical Term: *Fait Accompli***
  This is the most accurate label. It is French for "accomplished fact." It describes an action that has already been taken so that those who oppose it face the choice of accepting the reality or paying a high price to overturn it. In diplomacy, this is often translated as presenting a situation where "the other side" has to choose between peace or war based on facts already created on the ground.

  **B. The Game Theory Term: *Strategic Pre-commitment* (or Unilateral Pre-emption)**
  Based on the work of Thomas Schelling (Nobel Prize winner in Economics), this is a **commitment strategy**. By acting first, the individual changes the payoff matrix for the rest of the group. Before they act, the group would vote "No." After they act, the cost of saying "No" (fixing the mess, social awkwardness, wasted resources) suddenly exceeds the cost of saying "Yes." They have effectively held the group hostage to their own impulse.

  **C. The Organizational Term: *Decision Hijacking***
  In management theory, this happens when an agent bypasses established consensus procedures to seize operational control. It is often a symptom of weak **procedural justice**—when the rules about *how* decisions are made are less important to one member than the speed of getting a specific result.

  ---

  ### 2. The Exact Conditions (Why does it happen?)

  You asked what makes this possible. It rarely works unless four specific structural conditions align:

  **Condition 1: Asymmetric Reversibility (Stickiness)**
  Does the action have to be irreversible? **No.** It just needs to be "expensive" to reverse relative to the cost of doing it.
  *   **Low barrier to entry:** Sending the email takes 2 minutes.
  *   **High barrier to exit:** Retracting the email requires admitting error, re-sending corrections, and managing the anger of the recipient.
  Once the action is taken, the **Sunk Cost Fallacy** kicks in for the *rest of the group*. "It's already sent," becomes "It's probably fine."

  **Condition 2: Ambiguous Authority (The Gray Zone)**
  If the decision explicitly belonged to the whole group, everyone would stop the actor. This usually happens when the line between "individual initiative" and "group policy" is blurry.
  *   *Example:* "We haven't officially booked the venue yet."
  *   *Actor's mindset:* "I'm taking charge to help us out."
  *   *Group's mindset:* "I assumed he knew he shouldn't do that."
  The ambiguity allows the actor to frame their aggression as "helpfulness."

  **Condition 3: Diffused Responsibility (The Reverse Bystander Effect)**
  Why don't the others stop the action *before* it happens? Because each person assumes someone else has the authority or willingness to object. Once the action happens, the **social cost of intervening** spikes. Objecting before feels like collaboration; objecting after feels like confrontation.
  *   *Psychological mechanism:* **Pluralistic Ignorance**. Everyone privately disagrees but believes everyone else is okay with it (or is staying quiet to be polite). The first person breaks the silence by acting. The others stay silent to maintain harmony, inadvertently validating the act.

  **Condition 4: Outcome-Oriented Norms**
  Groups that value *results* over *process* are much more susceptible. If your club culture celebrates "getting things done" (even messy things) more than "making sure everyone agrees," this person is rewarded. They signal competence to outsiders, even if they damage trust inside.

  ---

  ### 3. Intent vs. Negligence (Does it matter?)

  You asked if it is the same when the person *knows* they're going against the group versus when they *didn't check first*.

  From a **practical outcome perspective**: It is the **exact same**. The group is stuck with the email/purchase/post regardless of intent. The "stickiness" remains.

  From a **trust perspective**: They are very different.

  *   **The Strategist (Knowingly):** This is Machiavellian behavior. They are testing boundaries to see how much power they can accumulate. If you accept this once, you train them that the consequences of bypassing the group are zero.
  *   **The Over-Eager Executor (Didn't check):** This is a process failure. They likely suffer from **Action Bias** (the urge to *do* something rather than wait for consensus) and assume they are "saving time." They view themselves as helpers, not usurpers.

  *Crucial Distinction:* The Strategist expects the group to back down; the Over-Eager executor genuinely believes the group will say "Thanks!" When both meet resistance, the Strategist doubles down, while the Executer becomes confused/hurt.

  ### 4. How Philosophers/Gamists View This

  In Game Theory, this is considered a breakdown of the **Social Contract**. It functions as a **negative coordination game**.

  *   **Thomas Schelling's Warning:** He argued that being able to commit to an irrational or extreme action gives you leverage. By making the purchase, the actor commits the group to the purchase. They have effectively removed their ability to retreat.
  *   **John Rawls (Justice as Fairness):** From a philosophical standpoint, this violates procedural fairness. Even if the decision turns out to be "good," the lack of consensus undermines the legitimacy of the group's future cooperation.

  ### Summary Checklist: Why did this happen this time?

  If you want to diagnose this next time, check these boxes:

  1.  **Was the reversal path obvious?** (Could we easily undo it, or did we feel trapped?)
  2.  **Was the rule book vague?** (Did anyone know if they had permission to decide alone?)
  3.  **Did the others feel safer staying silent initially?** (Fear of being labeled "slow" or "difficult.")
  4.  **Was the action completed quickly?** (Speed beats deliberation.)

  ### How to Stop It

  Since you identified the pattern, you can build **immune systems** into the group:
  1.  **Negative Consensus Rules:** "Nothing goes out unless no one objects within 24 hours." This flips the burden. Silence equals consent, but active objection stops it.
  2.  **Cooling-Off Periods:** "For any spend over $X, there is a mandatory 2-day wait."
  3.  **Designated Gatekeepers:** Assign one person whose specific job is to ensure communication happens. Only they can hit send.
  4.  **Retrospective Accountability:** "When we undo this later, who bears the cost?" If the group learns that allowing a fait accompli is always painful, they will eventually enforce pre-checks.

  The term you are looking for is **"Fait Accompli."** The mechanic is **"Strategic Pre-emption."** The problem is that **Social Friction is higher than Operational Correction.**
