      *   **Core Question:** Is the standard critique ("no valid consent") accurate, or is "consent" the wrong lens?
      *   **Specific Tasks:**
          1.  Analyze TSS through standard validity of consent criteria (Deception, Coercion/Undue Inducement, Competence). Map events to these categories.
          2.  Address the specific nuance of free meals/burial insurance (coercion vs. inducement vs. structural lack of alternatives).
          3.  Critique the "competence" aspect regarding poor sharecroppers (is it a competence problem or condescending?).
          4.  Evaluate the Consent Framework itself: Does it explain the harm, or is it too narrow (race/structural exploitation)?
          5.  Provide an honest assessment: Where does consent talk work? Where does it fail? Correct the user if they are misdiagnosing the issue.
