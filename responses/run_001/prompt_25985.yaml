answer: |-
  Here is a complete design for a 90-minute reading group session designed to make the epistemic instability of moral belief viscerally felt.

  # Activity Title: The Calibration Exercise

  **Objective:** To simulate the structure of the evolutionary debunking challenge and the "reliability worry." Participants should leave feeling that the boundary between *moral insight* and *psychological contamination* is harder to police than their pre-session metaphysics admitted.

  **Target Audience:** 12 Mixed Grad/Faculty (requires sensitivity to hierarchy; anonymity is key).
  **Room Setup:** Chairs arranged in a circle. Minimal tables (to discourage hiding behind notes).
  **Materials:**
  *   **Handout A (Initial Judgment):** Contains 4 brief scenarios + Likert scale (1–7 Strongly Disapprove → Strongly Approve) + Confidence rating (Low/Med/High).
  *   **Handout B (The Undermining Data):** Contains the same scenarios with added metadata (evolutionary origin, framing study, cultural variance, self-interest data).
  *   **Anonymous Voting Slips:** Two sets of different colors (Red/Green) to indicate whether to hold or abandon the original view.

  ---

  ## Part 1: Procedure & Timeline (90 Minutes)

  ### 1. The Setup (10 mins)
  *   **Intro:** Do not name the philosophical problem immediately. Say: *"Today we are running an epistemic audit on our own faculties. We want to test how stable our convictions are when stripped of their usual social scaffolding."*
  *   **Ground Rule 1:** "Do not defend your answers yet. Just record them."
  *   **Ground Rule 2:** "This is anonymous regarding the data collection. Faculty/Students will have identical weight on the cards."

  ### 2. Phase I: Baseline Intuitions (15 mins)
  *   Distribute **Handout A**.
  *   **Instruction:** Read each scenario. Mark how much you agree/disagree with the moral proposition *in the abstract*. Then mark your confidence level.
  *   **Cases (Keep descriptions thin to prevent over-rationalization):**
      1.  **The Harmless Taboo:** A man eats his dead dog's meat (after proper hygiene). He feels bad doing it, but no humans were harmed, he consented, and he enjoys the taste. Is there something morally wrong here?
      2.  **The Visible Child:** You can save one drowning child nearby for $500, but that cost stops you from funding a clinic that could save 100 children elsewhere. You choose to save the one nearby. Is this morally permissible?
      3.  **The Default Rule:** Country A requires citizens to donate organs (opt-out). Country B does not (opt-in). Both achieve higher donation rates in A. Should governments force opt-out to maximize utility?
      4.  **The Status Quo Tax:** There is a proposed tax restructuring. If passed, it saves money but changes current benefits slightly. Most people dislike it because they fear losing their specific existing benefit, even if the net gain is equal. Is this resistance rational?
  *   *Note: Have participants fold Handout A before moving to Phase II.*

  ### 3. Phase II: The Unsettling (15 mins)
  *   Distribute **Handout B**. This contains the *same* text but with a new section called **"The Genealogy of Your Judgment."**
  *   **Content of Undermining Data:**
      1.  **(Harmless Taboo):** *"Psychological research indicates disgust responses to harmless violations correlate with religious conservatism and anxiety levels, not harm detection. The brain region activated is the amygdala (fear center), not the prefrontal cortex (reason)."*
      2.  **(Visible Child):** *"Experimental data shows 78% of subjects switch from 'permissible' to 'wrong' when the story uses words like 'heroic' rather than 'rescue.' The judgment flips based on narrative proximity, which predicts nothing about total value."*
      3.  **(Default Rule):** *"Cross-cultural studies show opt-in rates in Country B match Country A if the default is reversed. Our preference for the status quo tracks inertia, not the intrinsic value of freedom."*
      4.  **(Tax)** *"Behavioral econ suggests resistance correlates strictly with endowment effects—valuing what you have simply because you own it. This bias serves retention, not justice."*
  *   **Task:** Re-read the scenario + the genealogy. Ask: *"Does this new information undermine the justificatory status of your initial answer?"* Mark Yes/No on Handout B.

  ### 4. Phase III: Personal Audit (10 mins)
  *   Ask participants to take out their folded **Handout A**.
  *   Look at the side-by-side.
  *   **Private Writing Prompt:** *"If you changed your mind (or maintained it despite the data), write down exactly why. Is your defense an argument that the bias is irrelevant to truth, or are you doubting the bias claim?"*
  *   **Crucial Step:** They do not read this aloud. They burn it/drop it in a box at the end. This reduces performative reasoning.

  ### 5. Phase IV: Structured Discussion (35 mins)
  *   **Moderator:** Lead discussion using the following prompts (do not lecture yet):
      1.  *"How many of you found a disconnect between your initial intuition and the new data? Did any of you feel uncomfortable retaining your view?"*
      2.  *"For those who stuck with their view: What is the firewall? How did you decide this wasn't a bias?"*
      3.  *"For those who wavered: Did you feel the conviction evaporated, or just become shaky?"*
  *   **Goal:** Draw out the *feeling* of having no clear criterion to separate the "bias" from the "truth."

  ### 6. Phase V: Mapping the Terrain (15 mins)
  *   Now, introduce the theoretical vocabulary to explain the unease they just felt.
  *   **Key Distinction:** Explain *Explaining Away* (Sharon Street, Richard Joyce) vs. *Explaining* (David Enoch).
      *   *The Debunker says:* If my judgment was caused by evolutionary pressure X, and X had no relation to moral truth Y, then I am unjustified in holding Y.
      *   *The Realist says:* Even if my cognition is shaped by evolution, it may still track the normative truths independently (the "coincidence problem").
  *   **Connect to Experience:**
      *   The discomfort they felt in Phase II is the *Debunking Worry*.
      *   The hesitation to call their judgment "false" in Phase IV is the *Independent Normativity Defense*.
      *   The difficulty articulating "why" it survived is the lack of a "Meta-Epistemic Litmus Test."

  ---

  ## Part 2: Honest Note on Limitations

  **What this Activity DOES:**
  1.  **Creates Phenomenological Dissonance:** It forces the gap between "I feel this is true" and "There is a reason I might feel this."
  2.  **Highlights the Burden of Proof:** It makes participants realize they don't actually possess a method to distinguish bias from belief without circularity.
  3.  **Humanizes the Skeptic:** It shows that skepticism isn't just a contrarian position; it's a natural reaction to causal history.

  **What this Activity CANNOT DO:**
  1.  **Prove Skepticism:** The activity simulates the *form* of the debunking argument, but not the validity. It cannot prove their intuitions are false, only that their reasons for trusting them are opaque.
  2.  **Avoid Ideological Tilt:** Because these cases touch on deep cultural values, the activity may inadvertently look like political relativism disguised as philosophy. Be careful not to frame the debunking data as "facts" about the world, but as "claims about sources."
  3.  **Resolve the Problem:** Many philosophers (especially robust realists) will find the activity unsatisfying because it presupposes a naturalist meta-ontology (that beliefs are just causal outputs). You must explicitly acknowledge this assumption in the debrief.

  ---

  ## Part 3: Predictable Failures & Mitigations

  ### Failure 1: The "But That's Psychology, Not Morality" Retreat
  *   **Prediction:** Faculty or senior grad students might dismiss the exercise by arguing that evolutionary explanations of emotion don't negate moral duties (a classic "Ought vs. Is" defense).
  *   **Handling:** Don't fight the logic; pivot to the epistemology. Reply: *"Even if you aren't denying the Ought, the activity highlights that you lack a criterion for distinguishing the 'noise' (evolutionary emotion) from the 'signal' (moral insight). Can you articulate that criterion now, or did you rely on the feeling that the feeling was correct?"*

  ### Failure 2: Defensive Digging-In
  *   **Prediction:** Some participants will feel attacked and double down on their moral certainties (Reactance Theory).
  *   **Handling:** Acknowledge the defensive posture as data. *"That defensiveness you feel right now? That is part of the phenomenon we are studying. The Realist often appeals to 'self-evidence,' but self-evidence can also be produced by confirmation bias. How do we know the difference?"*

  ### Failure 3: The "Too Easy" Critique
  *   **Prediction:** Someone will say, *"Of course I wouldn't trust a gut feeling about incest if you tell me it's evolutionary. That's obvious. The hard cases aren't the gross ones."*
  *   **Handling:** This is valid. Use it. Ask: *"If the distinction is easy for Incest but impossible for Justice, how do we justify using different standards for different domains? Doesn't that suggest the 'easy' cases reveal a mechanism that operates everywhere, but we only notice it where we disagree?"*

  ### Failure 4: Nihilism Spiral
  *   **Prediction:** Junior students might walk away thinking "Therefore, nothing matters."
  *   **Handling:** End on the **Enoch/Realist Counter-Move**. Remind them that this activity proves the *challenge* exists, not that the *debunking succeeds*. The question remains open: Is the correlation between our moral beliefs and moral truth a massive coincidence (debunking wins) or a result of tracking truth (realism wins)? The activity leaves that tension unresolved, which is the point.

  ### Failure 5: Authority Bias
  *   **Prediction:** Students might follow the faculty's lead on whether to "flip" their votes.
  *   **Handling:** Enforce strict anonymity during the voting phases. Collect the slips physically and shuffle them before showing aggregate numbers.

  ---

  ## Facilitator Cheat Sheet (Debrief Talking Points)

  *   **On "Bias":** Remind them that in psychology, "bias" just means "non-veridical systematic deviation." The philosophical trick is assuming our moral perceptions *should* be veridical in the first place.
  *   **On "Explanation vs. Explaining Away":**
      *   *Explanation:* "I believe killing is wrong because I evolved to care about kin." (Compatible with Killing being wrong).
      *   *Explaining Away:* "I believe killing is wrong *only* because I evolved to care about kin." (Severs link to Truth).
      *   *The Slippery Part:* We usually start with Explanation and slide into Explaining Away without noticing.
  *   **On the Goal:** We are not trying to convince them they are wrong. We are trying to convince them that **certainty is expensive.** If they want to keep their certainty, they need a robust epistemological foundation they might not have practiced articulating until today.
