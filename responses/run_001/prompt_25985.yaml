      *   **Topic:** Metaethics (specifically the distinction between genuine moral preferences and biases; debunking challenges).
      *   **Audience:** 12 people (mostly grad students, some faculty).
      *   **Format:** Reading group, 90-minute session.
      *   **Goal:** Make them *feel* the problem, not just discuss it. Induce uncertainty about their own convictions post-debrief. Highlight the slipperiness of the bias/preference distinction.
      *   **Proposed Mechanism:** Moral cases $\rightarrow$ Private judgment $\rightarrow$ Reveal undermining info (framing, culture, evolution) $\rightarrow$ Re-evaluate endorsement $\rightarrow$ Philosophical mapping.
      *   **Requirements:** Rules, materials, timeline, honest note on limitations (skepticism tilt), and predictable pitfalls/mitigations.

  2.  **Evaluate the Concept:**
      *   The core idea is solid and aligns well with "experimental philosophy" vibes mixed with traditional metaethical debate.
      *   It risks becoming too psychological or too confrontational. Need to ensure it remains philosophical.
      *   The "feeling" aspect needs to be engineered carefully so it doesn't feel like gaslighting but rather epistemic humility.
      *   Since participants are advanced (grads/faculty), the cases need to be sophisticated enough to avoid obvious fallacies but simple enough to elicit quick intuitions.

  3.  **Design the Activity ("The Epistemic Audit"):**
      *   *Phase 1: Calibration.* Set the stage without giving away the game.
      *   *Phase 2: Initial Judgments.* Get baseline data.
      *   *Phase 3: The Unsettling.* Introduce the undermining evidence.
      *   *Phase 4: Reflection.* Did they change their minds? Why/Why not?
      *   *Phase 5: Mapping.* Connect experience to theory (Street, Joyce, Enoch, etc.).

  4.  **Develop the Cases:**
      *   Need variety in undermining mechanisms.
      *   Case 1: Evolutionary/Adaptive mismatch (e.g., Incest taboo, resource sharing). Let's go with *consanguineous marriage* (evolutionary vs. moral disgust).
      *   Case 2: Framing/Linguistic (e.g., Trolley variants). Let's use the standard *Push vs. Switch* but add a twist about phrasing. Actually, maybe something more subtle like *Charity Efficiency* (saving lives now vs. investing).
      *   Case 3: Cultural Variation (e.g., Purity/Sanctity). *Vegetarianism vs. Meat eating* is too polarizing. How about *Circumcision* or *Veiling*? Let's try *Ritual Scarring* (cultural relativism angle). Or better: *Honor Violence* vs. *Self Defense*. Let's stick to simpler cognitive biases.
      *   Case 4: Status Quo Bias. *Default organ donation* (Opt-in vs. Opt-out).
      *   Case 5: Emotional Salience/Dissimilarity. *Identifiable Victim Effect* (One baby vs. statistics).
      *   *Decision:* Let's pick 4 strong ones to fit the time limit.
          1.  *Evolutionary Mismatch:* A moral intuition tied to survival (e.g., inbreeding aversion presented as a moral duty).
          2.  *Framing:* The "Taste" case (e.g., cleaning up after a meal) vs. Safety. Let's try the "Killer" framing. No, let's use *Resource Allocation*: Helping a child you can see vs. children you can't.
          3.  *Cultural Contingency:* A practice normal in one context, condemned in another (e.g., Arranged Marriage vs. Choice).
          4.  *Self-Serving Bias:* A rule that benefits the participant specifically (e.g., Tax laws or inheritance). Let's make it personal. "Inheritance tax rates."

      *Wait, keep it generalizable.* Let's refine for maximum metaethical impact:
      1.  **The Disgust Case:** Sexual morality unrelated to harm (e.g., consensual adult non-procreative sex acts).
      2.  **The Statistical vs. Identifiable:** Peter Singer's drowning child logic.
      3.  **The Cultural Contingency:** Female Genital Cutting vs. Male Circumcision (classic double standard).
      4.  **The Self-Interest Case:** Economic inequality thresholds.

  5.  **Drafting the Timeline (90 mins):**
      *   Intro/Pedagogy: 10 min.
      *   Round 1 (Judgment): 15 min.
      *   Round 2 (Uncovering): 15 min.
      *   Round 3 (Re-evaluation): 10 min.
      *   Group Discussion: 30 min.
      *   Debrief/Theory Mapping: 10 min.
      *   Closing: 5 min.

  6.  **Addressing the Limitations & Pitfalls:**
      *   *Risk:* People dig in deeper (Backfire effect).
      *   *Mitigation:* Frame as "Epistemic Humility," not "You're Wrong."
      *   *Risk:* Skepticism overload (Moral nihilism).
      *   *Mitigation:* Explicitly mention "Reliability Challenge" vs. "Debunking." Mention realists' counter-arguments (Euthyphro-style calibration).
      *   *Risk:* Faculty vs. Students dynamic.
      *   *Mitigation:* Anonymize the initial data collection so status doesn't influence retraction.

  7.  **Refining the Materials:**
      *   Need handouts. One for judgments, one for the "twist."
      *   Ensure anonymity. Use colored slips of paper or online forms.

  8.  **Constructing the Output:**
      *   Title: "The Calibration Exercise."
      *   Objective: Clear statement of intended emotional/cognitive shift.
      *   Logistics: Room setup, materials.
      *   Step-by-Step Procedure.
      *   The Cases (carefully worded).
      *   The Theory Map (connecting experience to Street, Joyce, Enoch, Kaspar).
      *   Honest Note on Limitations.
      *   Predictable Failures & Solutions.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Is 90 minutes enough for deep discussion?
      *   *Adjustment:* Tighten the individual work phases. Keep discussion focused on the *process*, not just the cases themselves.
      *   *Check:* Are the cases too controversial politically?
      *   *Adjustment:* Choose cases where the debunking force is technical/cognitive rather than purely ideological. For example, use "Organ Donation" defaults instead of politics. But the prompt asks for *moral* convictions. Okay, use the "Helping Distant Others" (Peter Singer) case—that hits everyone. Use "Disgust-based taboos" (harmless incest stories from Haidt/Jesse Prinz). Use "Status Quo bias" on economic justice.
      *   *Crucial tweak:* Ensure the "reveal" isn't just facts, but the *explanation* of why the fact undermines reliability. E.g., "Studies show this judgment is caused by X, and X has no tracking relation to Truth."

  10. **Final Polish:** Ensure tone is respectful to high-level philosophers but pedagogically robust. Add a specific "Facilitator Cheat Sheet" for the debrief.

  *(Self-Correction on the "Skepticism Tilt"):* I must emphasize that the activity simulates the debunker's move, but the realist's move is "tracking truth despite noise." The debrief must give credit to the Realist defense (e.g., Enoch's independence argument). Otherwise, it becomes propaganda.

