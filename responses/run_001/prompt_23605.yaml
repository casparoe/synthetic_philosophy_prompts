          *   Utility: Allows proving many useful theorems (Intermediate Value Theorem variants, basic analysis) that are otherwise hard or impossible in strict Bishop-style constructive math.
      *   **Anti-MP (Brouwerian Intuitionism / Strict Intuitionists):**
          *   Context: Mental constructions, potential infinity.
