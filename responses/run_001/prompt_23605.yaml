      *   Constructive view: Problematic. To prove $\exists n P(n)$ constructively, I need an algorithm to find $n$. To prove $\neg \forall n \neg P(n)$, I usually show assuming $\forall n \neg P(n)$ leads to contradiction. This doesn't necessarily give me the specific $n$. It says "it's impossible that they never happen," which sounds like it implies "they do happen." But computationally, if I search forever without finding one, I can't rule out that there isn't one eventually.

  3.  **Evaluate the Sides:**
