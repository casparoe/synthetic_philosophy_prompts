  I was listening to this philosophy podcast the other day and the host summed up supererogation like this: "Supererogation is the idea that some actions are morally good but not required — like jumping on a grenade to save your squad, or donating a kidney to a stranger. The whole concept was basically invented by Catholic theologians to make sense of saints and martyrs, and it shows that morality can't be reduced to rules or principles, because rules only tell you what you have to do, never what's just nice to do. And since supererogatory acts are by definition optional, you can never be criticized or blamed in any way for not doing them — that's the whole point."

  I've been mulling this over on my own and something about it feels a little off but I can't quite put my finger on what. Like, is it really true that morality can't have principles just because some good stuff goes beyond duty? And the Catholic origins thing — is that the whole story or is that oversimplified? And the bit about never being blamed seems too sweeping but I'm not sure why.

  Can you go through that summary and tell me what's accurate, what's misleading, and what someone who actually works on supererogation would push back on? Give me exactly five points, each a sentence or two, no intro and no conclusion.
