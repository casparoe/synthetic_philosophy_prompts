answer: |-
  While the core definition of supererogatory acts as praiseworthy but optional is standard, strict consequentialists often reject the category entirely by arguing that maximizing good is always a requirement. This means the podcast’s assumption that morality inherently includes this zone depends heavily on which ethical framework you adopt.

  Attributing the concept's invention solely to Catholic theologians overlooks earlier philosophical distinctions regarding actions beyond minimal justice found in Stoicism and Aristotelian virtue ethics. It was significantly refined within scholastic theology concerning vows of perfection, but not strictly invented there from scratch.

  The assertion that supererogation proves morality cannot be principle-based is overstated, since deontologists maintain specific permissions alongside duties without abandoning universal rules. Many systematic ethical theories accommodate supererogation as a secondary tier of moral evaluation rather than a structural failure of principled ethics.

  Stating that agents can never be criticized for omitting such acts ignores how moral language functions socially, where failing a great good can still elicit negative judgments about one's character or priorities. Blame may not imply duty violation, but it can manifest as censure for lacking benevolence expected within specific relationships.

  Contemporary debates often focus on whether the boundary between duty and supererogation is stable, particularly when extreme sacrifice is expected within certain professions or close-knit communities. If society begins to view heroism as a norm, what was once supererogatory risks sliding into ordinary obligation over time.
