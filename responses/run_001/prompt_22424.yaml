prompt: |-
  I have a bad habit of falling asleep at the wheel on long night drives, and if I get past the last rest stop I'm basically in trouble. There are two rest stops, and at each one I have maybe a 50/50 shot of still feeling alert enough to stop. If I stop at the first one I'm safe, but it feels stupid if I'm actually fine when I get there. If I decide at the second one I'm in the same situation, so why stop at the first? Should I precommit to stopping at the first stop, or should I just decide when I get there? I keep goin back and forth.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Risk:** Falling asleep at the wheel during long night drives (extremely dangerous).
      *   **Constraint:** There are two rest stops ahead of a danger zone ("last rest stop"). If missed, "basically in trouble."
      *   **Decision Point:** At each stop, there's a subjective feeling ("maybe a 50/50 shot") about whether they feel alert enough to stop.
      *   **Psychological Conflict:** Stopping at Stop 1 feels like a waste if they aren't tired ("feels stupid"). Waiting until Stop 2 risks missing it or being too tired to decide rationally.
      *   **Core Question:** Should I precommit to stopping at the first one, or decide when I get there?
      *   **Underlying Mechanism:** This is a classic problem of time inconsistency, hyperbolic discounting, and impaired decision-making under fatigue. The brain optimizes for short-term comfort over long-term survival.

  2.  **Evaluate the Options:**

      *   **Option A: Decide on arrival (Dynamic Decision Making).**
          *   *Pros:* Saves time/fuel if truly alert. Feels more "rational" in the moment.
          *   *Cons:* Fatigue impairs judgment. The 50/50 self-assessment is unreliable when tired. You might reach Stop 2 too late to stop safely. By the time you realize you're tired, you might be past the point of no return. The "sunk cost" mentality ("I'm fine now") overrides safety.
          *   *Risk Level:* High. Relies on a compromised cognitive state.

      *   **Option B: Precommitment to Stop 1.**
          *   *Pros:* Removes the burden of decision-making while fatigued. Guarantees safety margin. Treats drowsiness as an objective risk factor, not a subjective feeling.
          *   *Cons:* Might feel inefficient ("wasted" effort/time) if genuinely rested.
          *   *Risk Level:* Low. Prioritizes survival over efficiency.

  3.  **Apply Safety & Behavioral Science Principles:**
      *   **Drowsy Driving is Insidious:** Drowsiness affects self-awareness. A driver who thinks "I'm 50% sure I'm okay" is often already impaired.
      *   **The "50/50 Shot" Fallacy:** In high-stakes scenarios (like driving), 50/50 odds of failure are unacceptable. In gambling, 50/50 is fine. In driving, 50% chance of fatal accident is a 100% failure rate eventually.
      *   **Precommitment Strategies:** Known as binding commitments. Used in addiction, dieting, etc. It works by removing the option to choose poorly later.
      *   **Defensive Driving:** Never rely on willpower. Assume you *will* get tired and plan for it.

  4.  **Formulate the Advice:**
      *   **Direct Answer:** Precommit to the first stop. No hesitation.
      *   **Reasoning:**
          1.  **Fatigue Impairs Judgment:** You can't trust your self-assessment when tired. The feeling of "I'm fine" is a symptom of the fatigue itself.
          2.  **Zero-Sum Game:** Life vs. Comfort. Comfort is cheap; life isn't.
          3.  **The 50/50 Fallacy:** Explain why this probability is misleading in safety contexts.
          4.  **Ulysses Pact:** Frame it as binding yourself against future poor decisions.
      *   **Actionable Steps:** How to actually execute this (set alarm, tell passenger, commit financially/morally).

  5.  **Refine the Tone:**
      *   Must be serious but not condescending.
      *   Empathetic (acknowledge the "stupidity" feeling), but firm on safety.
      *   Use strong, clear language regarding risk.

  6.  **Drafting the Response (Internal Monologue/Trial):**
      *   *Okay, start with the conclusion.* Precommit. Do not debate this.
      *   *Why?* Because tired brains lie. The user says "50/50 shot." That means half the time they pass it out. That's insane.
      *   *Address the "feels stupid" part.* Reframe it. It's insurance. Paying a premium for peace of mind.
      *   *Address the second stop.* If you miss it, game over. Don't gamble.
      *   *Add a specific strategy.* Set GPS alarm. Tell someone. Make it hard to change the plan.
      *   *Final warning:* Falling asleep is the only real threat here.

  7.  **Final Polish (similar to the provided good output):**
      *   Structure: Direct Answer -> The Psychology (Why you're debating) -> The Risk Analysis -> Action Plan.
      *   Highlight key phrase: "You cannot negotiate with sleep."

  8.  **Self-Correction/Safety Check:**
