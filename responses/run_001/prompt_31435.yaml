      *   *Reading 2: The Redundancy Theory.* "Is true" adds nothing semantically. It's an operator that can be eliminated without loss.
          *   *Status:* Historically popular (Ramsey/Ayer), but technically flawed (generalizations like "Everything he said is true").
          *   *Does it support the dismissal?* Strongly. If there's no content to "truth," there's no difference between math and science truth.

      *   *Reading 3: The Minimalist/Deflationary Theory (Horwich).* The T-schema is exhaustive of the concept's nature.
