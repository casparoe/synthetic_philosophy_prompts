answer: |-
  # Q&A Preparation Sheet: Workshop on Consequentialism & Severe Uncertainty

  **Prepared for:** [Your Name]
  **Paper Title:** *Robustness Over Optimality: A Procedural Revision for Act-Consequentialism under Cluelessness*
  **Venue:** Workshop on Consequentialism and Decision-Making under Severe Uncertainty

  ### Strategic Note: Concessions to Make Up Front
  To prevent having to concede crucial ground during Q&A, you should explicitly acknowledge the following points in your introduction:

  1.  **Distinction between COR and DP:** Reiterate clearly that your argument modifies the *decision procedure*, not the *criterion of rightness*. Act-consequentialism (AC) remains true as a standard of evaluation, even if we cannot access it. This disarms the charge that you are covertly changing normative ethics.
  2.  **Non-Intervention is Not Passive Inaction:** Clarify immediately that the 'conservative baseline' refers to refraining from *novel, long-range interventions*, not refusing to treat patients, feed the hungry, or follow established, empirically supported protocols. This mitigates the 'status quo bias' accusation early.
  3.  **The Arbitrary Nature of Priors:** Admit that existing literature (e.g., Greaves 2016, Greaves & Wallace 2016) broadly accepts that priors become arbitrary over long time-horizons or identity-affecting scenarios. Do not fight the premise that standard EV is shaky; fight the inference that we should therefore abandon rigorous caution.

  ---

  ### Anticipated Objections (Ordered by Likelihood & Damage)

  #### 1. The 'Status Quo Bias' Objection (Act-Consequentialist / Effective Altruist)
  **Speaker:** Senior EA-aligned Consequentialist.
  **Question:** *"You argue we must default to non-intervention when uncertainty is severe. But failing to act is also an action with consequences, often allowing preventable suffering to continue simply because you can't quantify future benefits. Isn't your robustness rule effectively a rationalisation for inaction, prioritising theoretical safety over actual welfare?"*

  **Reply:**
  "That is a vital concern, and one my paper addresses by distinguishing between *global* and *local* consequences. The 'conservative baseline' applies specifically to identity-affecting or extremely long-horizon interventions where the probability distributions are genuinely ill-defined—what we might call 'structural' interventions. For immediate, short-term needs where causal chains are well-established (like malaria bed nets), standard EV maximisation still holds. My argument is that we should not extrapolate high-confidence short-term success to unknown long-term trajectories. The baseline prevents us from trading certain present harms for speculative infinite gains, which, as Greaves argues, can lead to negative expectations under wide prior ranges. I'm not arguing for inaction *simpliciter*, but for withholding action that relies on arbitrary priors."

  **Weakest Point:** Distinguishing 'global' from 'local' is notoriously difficult; critics may argue every action has long-term ripple effects (butterfly effect).

  #### 2. The 'Epistemic Agnosticism' Objection (Formal Epistemologist)
  **Speaker:** Working on Imprecise Probabilities.
  **Question:** *"You derive your rule from suspending judgment. But aren't you just formalising imprecise probabilities? Why posit a new 'robustness' rule when existing frameworks like interval-valued decision theory already tell us to seek options that perform well across a set of credence functions? Are you reinventing the wheel without the formal machinery?"*

  **Reply:**
  "I appreciate that connection. However, standard imprecise probability models typically still require maximising expected utility *relative* to a set, often resulting in indecision (the set-dominance relation is often too permissive). My robustness rule adds an epistemic constraint: it requires the action to be choice-worthy across competing *evaluative theories*, not just empirical priors. An action might look robust across probability distributions but fail under different moral weightings (e.g., total vs. average utilitarianism). Furthermore, my framework provides a clear termination condition—the default baseline—which imprecise probability models struggle to resolve without additional axioms. I'm using the logic of imprecision but applying it to the meta-level of model selection."

  **Weakest Point:** Formalists may argue your robustness condition collapses into a specific representation of imprecise probabilities anyway, adding no substantive novelty.

  #### 3. The 'Modelling Specification' Objection (Formal Epistemologist)
  **Speaker:** Working on Higher-Order Evidence.
  **Question:** *"What counts as a 'reasonable' empirical model? If the set of reasonable models is determined by the agent, the rule becomes subjective. If it is determined externally, by whom? You haven't solved the specification problem; you've just moved it up a level."*

  **Reply:**
  "The specification problem is indeed serious, and I don't claim to solve it definitively here. However, my proposal is methodological rather than ontological. Reasonable models are those that survive current peer-reviewed scrutiny and fit known mechanistic constraints. It mirrors scientific consensus-building. Crucially, if the consensus shifts—say, through higher-order evidence confirming a mechanism previously thought stable—the set of reasonable models updates. The rule isn't a fixed algorithm but a heuristic for responsible inquiry. If no consensus exists among experts, then there are no 'reasonable' models, and the default baseline kicks in automatically."

  **Weakest Point:** Relying on 'scientific consensus' imports social/political problems into the definition of 'reasonableness' and might exclude novel, correct minority views.

  #### 4. The 'Entrenched Harm' Objection (Political Philosopher)
  **Speaker:** Focus on Justice and Distribution.
  **Question:** *"If we default to non-intervention, aren't we implicitly endorsing the current distribution of resources and power? Existing harms are real and knowable. Your rule seems to privilege the stability of unjust systems by treating intervention under uncertainty as more risky than maintaining the status quo."*

  **Reply:**
  "This cuts to the heart of the trade-off. However, my defence rests on the asymmetry of reversibility. Interventions under severe uncertainty often involve irreversible changes to identity or ecological baselines. Once a population is shifted or a gene drive released, there is no 'undo' button. Maintaining the status quo preserves the *option value* to intervene once we have better information. I argue that 'harm' includes both immediate deprivation and the risk of catastrophic, unforeseen disruption. When the latter outweighs the former epistemically, prudence dictates pausing. This isn't a moral endorsement of the status quo, but a temporary procedural halt to prevent potential catastrophe."

  **Weakest Point:** The concept of 'irreversibility' is often overstated; many systemic changes can be corrected, whereas waiting allows continued active harm.

  #### 5. The 'Action-Guidance' Objection (Kantian)
  **Speaker:** Skeptic of Consequentialism.
  **Question:** *"You try to save consequentialism by giving it a decision procedure. But unless I can actually apply this robustness test before acting, it remains useless. Given the complexity of the world, I can never verify an action is robust across enough models. Therefore, the theory fails your own test of being action-guiding."*

  **Reply:**
  "My goal is to show the theory is *potentially* action-guiding, not that it is computationally trivial. Kantians rightly point out that moral reasoning is complex. In practice, agents rarely know if they are operating under 'severe uncertainty' until they probe deeper. If initial modelling reveals extreme sensitivity to assumptions (a sign of cluelessness), that itself triggers the rule. So the guidance comes in two stages: first, attempting to map the models; second, if the map looks like fog, abstain. It guides the agent away from hubristic overconfidence, which is a distinct form of action-guidance."

  **Weakest Point:** This relies on the agent's ability to accurately assess their own ignorance (meta-cognition), which is itself subject to cluelessness.

  #### 6. The 'Arbitrary Cut-Off' Objection (Act-Consequentialist / EA)
  **Speaker:** Sympathetic EA.
  **Question:** *"Why stop at 'identity-affecting' or 'long-run'? Any action has ripple effects. Where do you draw the line for the temporal horizon before the priors become 'substantially arbitrary'? Without a fixed horizon, the rule could be interpreted as requiring paralysis for almost any significant project."*

  **Reply:**
  "That is a calibration issue, not a conceptual flaw. There is a difference between 'unknown unknowns' and 'known unknowns'. For instance, the long-term effects of a specific vaccine are largely bounded by human lifespan and viral evolution models. The effects of geoengineering on geopolitical stability over centuries are not. The arbitrariness arises when the variable space expands beyond any probabilistic grounding (e.g., post-humanity). We should adopt horizons grounded in our capacity to model causality, not abstract time. The cut-off is epistemic, not merely temporal."

  **Weakest Point:** Drawing a precise epistemic cut-off is notoriously difficult; critics may argue the transition from 'known' to 'arbitrary' is a continuum, not a cliff-edge.

  #### 7. The 'Virtue' Objection (Virtue Ethicist)
  **Speaker:** Skeptical of Rules.
  **Question:** *"Decision rules can cultivate rigidity. Virtue ethics teaches practical wisdom (*phronesis*) to navigate uncertainty. By codifying 'suspension of judgement', you risk training agents to be timid rather than thoughtful. Why shouldn't we rely on character instead of a formula?"*

  **Reply:**
  "I agree that virtue is essential, but this paper targets the structural limitations of consequentialism under severe uncertainty, not general moral psychology. Even the most virtuous agent lacks the cognitive bandwidth to intuitively track all downstream models. My robustness rule is intended to function as a scaffold for virtue—a check against the vice of rashness. It externalises the restraint that a truly wise agent might exhibit internally, but since we lack guaranteed wisdom, the rule serves as a safeguard for those who think they are acting wisely."

  **Weakest Point:** It assumes virtues like courage are compatible with a rule that mandates inaction, which might seem contradictory to an agent feeling called to alleviate immediate suffering.

  #### 8. The 'Credibility' Objection (Act-Consequentialist)
  **Speaker:** Senior Academic Consequentialist.
  **Question:** *"By weakening the decision procedure so drastically, aren't you undermining the credibility of consequentialism entirely? If we can't do the math, the theory becomes indistinguishable from intuitionism or pragmatism."*

  **Reply:**
  "Not at all. The criterion of rightness remains objective: the action that produces the most good is the right one. Our inability to compute it perfectly is an epistemic limitation, not a metaphysical one. By adopting this rule, we maintain the integrity of AC by admitting its limits rather than pretending precision is possible. It distinguishes the theory from pragmatism, which abandons the 'greatest good' as a standard. We retain the standard while revising the method of pursuit to match our epistemic reality."

  **Weakest Point:** If the decision procedure is too divorced from the criterion, the criterion becomes idle, leading some to conclude the theory is empty.

  ---

  ### The Question I Am Hoping Nobody Asks

  **Question:** *"Doesn't your robustness rule suffer from the very same cluelessness objection you attribute to Expected Value Maximisation? Deciding which models are 'reasonable' requires predicting the consequences of your own decision procedure itself. If you choose this rule, you are committing to a policy whose downstream consequences you cannot know. Therefore, applying your own rule implies you should suspend judgement on whether to apply your own rule."*

  **Why Avoid It:** This creates a paradox where the theory undermines its own authority. If the application of the rule is subject to cluelessness, the rule cannot recommend itself without circularity.

  **Mitigation Strategy:** Do not invite this question by framing the rule as "always correct." Frame it as a "defeasible presumption based on current knowledge," ensuring that the meta-level assessment of the rule's own utility is open to revision as better tools for handling uncertainty are developed.

  ---

  ### Literary Context Note (For Internal Reference)

  *   **Settled:** There is near-consensus that precise subjective probabilities cannot be assigned to all long-term outcomes (see *Greaves 2016*, *Williamson*). It is accepted that 'cluelessness' renders standard Bayesian updating problematic for identity-affecting cases (e.g., *Parfit's non-identity problem* extended).
  *   **Contested:** Whether we should suspend judgement or use a 'maximin' approach. Some proponents of Longtermism (e.g., *MacAskill*) argue we should maximise expected value even under imprecise credences (by looking for 'dominance'). My position contradicts the dominant view in effective altruism circles, which currently favours aggressive EV maximisation despite uncertainty. Be careful not to imply the opposition is irrational, but epistemologically overconfident.
