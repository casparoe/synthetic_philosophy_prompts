      *   **Audience:** ~25 people. Specific breakdown:
          *   Act-consequentialists/EAs (sympathetic, wary of status quo bias/VE deviation).
          *   One Kantian (thinks AC isn't action-guiding at all).
          *   Two formal epistemologists (imprecise probabilities/higher-order evidence).
          *   One virtue ethicist (skeptical of rules).
          *   One political philosopher (worried about entrenching harm/distribution).
      *   **Task:** Draft a Q&A preparation sheet.
      *   **Requirements:**
          *   8 objections ordered by likelihood/damage.
          *   Phrased as the audience member would ask.
          *   Reply (~2 mins spoken).
          *   Note on weakest point of reply.
          *   Include the "question I am hoping nobody asks."
          *   Specify what to concede up front.
          *   Distinguish settled vs. contested literature on cluelessness.
          *   British English spelling/usage.

  2.  **Deconstruct the Argument & Audience Dynamics:**
      *   *The Argument:* EV Maximisation fails under deep uncertainty $\rightarrow$ Robustness Rule needed $\rightarrow$ Epistemic suspension of judgement justifies it $\rightarrow$ Default to non-intervention if no robust option exists.
      *   *EA/Consequentialist Concern:* You are smuggling in deontology/status quo bias under the guise of epistemic humility. If you can't calculate good, don't stop doing good.
      *   *Formalist Concern:* How do you define "reasonable models"? Is this just imprecise probability? How does learning happen?
      *   *Kantian Concern:* I told you so. It's still un-actionable because "robustness" is vague/impossible to check.
      *   *Virtue Ethicist:* Rules are rigid; need phronesis.
      *   *Political Philosopher:* Non-intervention maintains the status quo, which might be unjust/harmful. Conservative baseline = complicity.

  3.  **Drafting the Objections (Ordering):**
      *   *Most Likely/Damaging:* The EA/Act-Consequentialists will attack the core claim that EV must be abandoned. They see "non-intervention" as cowardly or conservative bias. (Obj 1 & 2).
      *   *Second Tier:* The Formalists on technical implementation (how are models defined?). (Obj 3 & 4).
      *   *Third Tier:* Political Philosopher (distributional justice). (Obj 5).
      *   *Fourth Tier:* Kantian/Virtue Ethicist (action-guidance/nature of agency). (Obj 6 & 7).
      *   *Low Probability/Highest Risk:* The "Question I hope nobody asks" usually hits a logical contradiction or fatal flaw not yet addressed. Let's say the self-undermining nature of the default rule.

  4.  **Refining the Questions & Replies:**
      *   *Tone:* Academic, respectful but challenging.
      *   *Length:* 2-minute replies need to be punchy, acknowledging premises while pivoting back to the thesis.
      *   *Weakest Point:* Must be honest about where the argument strains.
      *   *Literature Check:* Grice (cluelessness), Greaves (decision theory), Williamson (knowledge), MacAskill (longtermism/cluelessness). Need to distinguish between *practical* cluelessness (can't predict effects) and *structural* cluelessness (identity-affecting interventions). The consensus is that EV is hard, not necessarily wrong *in principle*, but my paper claims it's wrong *in practice* for these specific cases.

  5.  **Addressing the "Settled vs. Contested":**
      *   Settled: Cluelessness makes precise calculation impossible. EV relies on priors.
      *   Contested: Whether we should suspend judgement, whether non-intervention is permissible, how to define "reasonable models."
      *   *Correction during drafting:* Ensure I don't say "Everyone agrees X." Instead, "There is broad agreement on Y, though Z remains debated."

  6.  **The "Concede Up Front" Strategy:**
      *   To avoid conceding later, admit something true but weak now. E.g., Admit that "reasonableness" of models is theoretically difficult to pin down precisely, but pragmatic criteria exist. Or admit that non-intervention *feels* conservative but argue why it isn't necessarily. Better: Admit that the Criterion of Rightness (AC) remains unchanged (to keep them happy), but emphasize the shift is procedural. Actually, the prompt says "I defend a qualified act-consequentialism." I should concede that the *ideal* agent acts on full information, even if we don't have it. This disarms the "you're changing the normativity" charge.
      *   *Better Concession:* Concede that 'non-intervention' is not an absolute moral prohibition, but a *procedural default* given our epistemic limits. This prevents the "Status Quo Bias" accusation.

  7.  **The "Hope Nobody Asks" Question:**
      *   What would destroy the robustness argument? "Who determines what counts as a reasonable model?" If it's subjective, the whole thing collapses into relativism. Or: "Doesn't your own robustness rule suffer from the same cluelessness regarding its own downstream consequences?" (Self-defeating).

  8.  **Review against Constraints:**
      *   British English (maximise, sceptical, programme, etc.).
      *   Order by likelihood/damage.
      *   Distinguish settled/contested literature.
      *   Two-minute reply limit (approx. 250-300 words spoken).

  9.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Objection 1 (EA/AC):* Status Quo Bias. Why not expected value with best guesses? *Reply:* Priors are arbitrary. We are guessing at infinity. Robustness protects against catastrophic error. *Weakness:* Defining "catastrophic".
      *   *Objection 2 (EA/AC):* Doing nothing is also an action with consequences. *Reply:* Acknowledge. That's why it's a baseline for *choice-worthiness*, not ontological passivity. We intervene only when robust positive effects are visible. *Weakness:* Hard to prove non-intervention has zero long-term impact.
      *   *Objection 3 (Formalist):* How do you update the set of models? *Reply:* Standard Bayesian updating on the subset that survives empirical tests. *Weakness:* What if the true model was excluded initially?
      *   *Objection 4 (Political):* Entrenching harm. *Reply:* Intervention under high uncertainty risks making it worse. We need historical data for robustness, which favors stability, but we allow intervention where benefits are local and immediate (short-term robustness). *Weakness:* Justifying global structural change.
      *   *Objection 5 (Formalist):* Imprecise Probabilities vs. Robustness. *Reply:* Imprecise sets can still yield wide ranges of value. Robustness is about structural stability, not just intervals. *Weakness:* Formal equivalence.
      *   *Objection 6 (Kantian):* Unactionable. *Reply:* No different than duty of rescue; requires checking conditions. *Weakness:* Vagueness.
      *   *Objection 7 (Virtue):* Rules miss the nuance. *Reply:* The rule trains the disposition of intellectual humility. *Weakness:* Still a rule.
      *   *Q Hope No-one Asks:* Self-reference problem. My rule's application is itself subject to cluelessness.

  10. **Final Polish:** Check tone, British spelling, ensure distinctions in literature are accurate (e.g., distinguishing Greaves/Williamson views). Ensure the distinction between Criterion of Rightness (COR) and Decision Procedure (DP) is clear, as that's central to the thesis.

  **(Self-Correction on Literature Distinction):**
  *   *Settled:* The idea that agents face "cluelessness" regarding long-term identity-affecting actions is widely accepted (Greaves 2016). The mathematical impossibility of assigning unique subjective probabilities to all outcomes is generally accepted (Dougherty et al.).
  *   *Contested:* Whether this mandates abandoning EV maximisation. Many (e.g., MacAskill) argue we should use "imprecise credences" but still maximize expected value relative to a set. My move to "robustness" is a distinct departure. I must not claim everyone thinks EV is broken, only that they disagree on the solution.

  11. **Final Review of constraints:**
