      *   Better to adopt something like Allan Gibbard's norm-expressivism or Simon Blackburn's quasirealism (projectivism).
      *   Key move: Distinguish between *using* a term to express an attitude and *mentioning* or *embedding* the content of that attitude. Meaning is determined by the role the state plays in reasoning, not just the surface-level speech act.
      *   Another move: Semantic ascent. The truth conditions of the conditional aren't about facts, but about the consistency of attitudes.
      *   Best angle for a software engineer analogy: Maybe treat moral predicates as functions or types that take arguments, where the "truth value" is really a consistency check on plans/norms.
      *   Let's go with Blackburn's Quasirealism/Gibbard-style norm-expressivism. The idea is that moral language *mimics* descriptive language because reasoning requires stability. The meaning of "wrong" in the antecedent is the *same normative state* projected into a hypothetical space, not a literal fact, but a commitment to a logical relationship between attitudes.

