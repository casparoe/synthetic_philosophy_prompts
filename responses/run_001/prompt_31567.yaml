      *Revised Draft:* You’re right to identify this as the Frege-Geach problem, which killed off crude emotivism, but contemporary expressivism solves it by decoupling *semantics* from *illocutionary force*. When I say “Stealing is wrong,” I’m expressing a first-order negative attitude, but in the conditional “If stealing is wrong...”, I’m asserting a higher-order relation between attitudes: namely, that disapproving of stealing necessarily involves disapproving of inducing others to steal. The word “wrong” keeps the same meaning because it always tracks the same kind of normative property—a state of mind regarding norms—even when the speaker isn’t currently voicing that state. Modus ponens works because logical validity is preserved by the consistency of these attitudinal commitments; if you accept the premises, rejecting the conclusion creates a functional contradiction in your normative psychology, not a falsehood about the world. Think of it like type-checking: the system ensures your mental states compile correctly relative to each other, regardless of whether any ontological “moral facts” exist to satisfy them.

