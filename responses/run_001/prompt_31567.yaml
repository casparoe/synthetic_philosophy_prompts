      *Draft:* You’re hitting on the Frege-Geach problem, which classical emotivism indeed couldn’t solve, but modern expressivism handles this by distinguishing between the *force* of an utterance and its *content*. When you assert "Stealing is wrong," you express a first-order disapproval; when you embed it in "If stealing is wrong...", you aren't expressing that disapproval directly, but rather expressing a higher-order commitment to the coherence of certain attitudes—specifically, the incompatibility of disapproving stealing while approving coaxing others to steal. The logical validity of modus ponens doesn't require factual truth conditions; it requires that if you hold the attitude expressed by the antecedent and the attitude expressed by the conditional, you are rationally compelled to hold the attitude in the consequent. So "wrong" retains a stable semantic contribution across contexts, not because it refers to a fact, but because it picks out a specific node in the network of normative commitments that must remain consistent for reasoning to work. The compiler checks for type-safety in your attitudes, not reality.

