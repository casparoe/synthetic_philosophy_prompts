prompt: |-
  I cover science and ideas for a general-interest magazine, and lately I've been going down a rabbit hole about a claim that keeps showing up in peices on rationality and investing. It goes roughly like this: a bet can have positive expected value — genuinely favorable, on average — and still be a terrible bet to make over and over, because money compounds, and a string of losses can knock you out even when the odds were in your favor. The real thing to maximize, supposedly, is the logarithm of your wealth, or the geometric growth rate, not the arithmetic average payoff. I can follow the math, but I want a roomful of adults with no special math background to feel it in their gut before anyone names it.

  I'm running a 90-minute session at a science festival, about 18 people, and I want a betting game that doesn't use real money — tokens, points, a spreadsheet, whatever — where participants place repeated bets with positive expected value and discover, from what happens to them, that the size of the bet is doing all the philosophical work. The all-in expected-value maximizers should tend to go bust while the fractional bettors compound, and the group should notice this themselves rather than being told. Please give me the full runnable plan: rules, materials, a payoff scheme, a timeline, and a debrief that maps specific moments in the game onto the formal distinction between arithmetic and geometric expectation, and onto the idea that what compounds is log wealth. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about wich feature of the idea the activity can't reproduce — the facilitator will have to supply that part.

  You're an expert on probability theory, rational choice, and the Kelly-criterion side of this, the kind of person who could explain ergodicity to a smart lay audience without slides. Before you commit to a final design, brainstorm two or three candidate game mechanics and say what each one would teach and where it would break; then give me the version you'd actually run.
