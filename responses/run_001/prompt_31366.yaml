answer: |-
  This is a classic demonstration of **ergodicity economics**, specifically the tension between ensemble averages (what happens to a group) and time averages (what happens to an individual over time). As someone who teaches this material, I can tell you: if you get this right, it changes how the audience views risk forever. If you rush it, it looks like just another "gambling math" demo.

  We have 18 people and 90 minutes. We need maximum engagement with minimum bookkeeping overhead. Here is the breakdown.

  ---

  ### Part 1: Candidate Mechanics Analysis

  Before we lock in the design, here are three ways to structure the betting game, ranked by pedagogical fit.

  **Candidate A: The Stock Market Card Deck**
  *   **Mechanic:** A deck of cards represents days. 54% are "Gain Cards" (+10%), 46% are "Loss Cards" (-9%). Participants decide asset allocation.
  *   **Teaching:** Introduces continuous returns and "volatility drag."
  *   **Break Point:** People focus on card counting rather than portfolio sizing. Mental math with percentages (+10% of X) becomes tedious and error-prone over 20 rounds. You spend more time correcting addition errors than discussing strategy.

  **Candidate B: The "All-or-Nothing" Tournament**
  *   **Mechanic:** Two rooms. One room forces players to bet 100% of their stack every flip. The other allows fractions.
  *   **Teaching:** Binary comparison of Risk vs. Safety.
  *   **Break Point:** It turns into a moral judgment ("Gamblers deserve to lose") rather than a mathematical inevitability. Also, splitting the group means those in the "Safe" room don't feel the pressure of the "Risk" room's collapse.

  **Candidate C: The Fractional Coin Flip (Winner)**
  *   **Mechanic:** Everyone gets 100 tokens. Every round, you choose a percentage of your *current* wallet to wager on a biased coin (Heads 60%, Tails 40%). Even money payout.
  *   **Teaching:** Directly demonstrates the relationship between Bet Size ($f$) and Geometric Growth Rate ($g$). It highlights that EV maximization (betting big) conflicts with Survival. It forces everyone to experience the path-dependency.
  *   **Break Point:** Requires participants to record their balances accurately. If they do bad math, the result is noise. We mitigate this by standardizing the recording sheet.

  ---

  ### Part 2: The Session Design ("The Kelly Gauntlet")

  **Materials Needed:**
  1.  **Scorecards:** 18 sheets. Pre-printed with columns: Round #, % Wager, Stake Amount, Result (H/T), End Balance. *Leave space for 25 rows.*
  2.  **Tokens/Pennies:** Not needed for play, only for visualization if desired. We use numbers on paper for speed.
  3.  **Large Visible Die/RNG:** A large die or a digital randomizer projected on a screen. **Do not let individuals flip their own coins;** this removes suspicion of rigged games. You control the RNG.
  4.  **Chalkboard/Flipchart:** For tallying results during the debrief.
  5.  **Calculators:** Phones allowed, but encourage manual math for the gut-feel phase (use apps only for debrief verification).

  **The Payoff Scheme (Crucial):**
  *   **Coin Bias:** 60% Chance Heads, 40% Chance Tails.
  *   **Payout:** Even Money. (Bet \$10, Win \+\$10 / Lose \-\$10).
  *   **Why this math?** The Expected Value is positive ($0.6 \times 1 + 0.4 \times -1 = +0.2$ per unit bet). Betting 100% of your bankroll is mathematically the best "Expected Value" move, but it guarantees eventual ruin due to geometric decay.

  #### Timeline (90 Minutes)

  **0:00 – 0:10 | The Hook (No Math)**
  Gather the 18 adults. Do not introduce the concept yet.
  *   **Say:** "We are going to simulate a market opportunity. It is guaranteed profitable. If you maximize profit, you pick 'Strategy A'. If you want safety, you pick 'Strategy B'. Most of you want profit, yes?"
  *   Hand out scorecards. Give everyone **100 Units** of capital.
  *   **Instruction:** "On your scorecard, write down the percentage of your *current* balance you are willing to risk today. Write the number before the coin is flipped. If your balance hits 0, you stop playing."

  **0:10 – 0:50 | The Grind (20 Rounds)**
  Run 20 rounds rapidly. Speed creates pressure; deliberation creates fear.
  *   **Round Procedure:**
      1.  You ask: "Commit your percent."
      2.  Participants shout a number or raise hands (to see the spread). Or, ask them to write it privately to prevent copying. *Recommendation: Private writing prevents herd behavior.*
      3.  You roll the die/project the outcome. Announce: "Heads!" (Use a visible indicator).
      4.  They calculate their new balance.
      5.  You announce the next starting balance range (e.g., "Anyone under 10 units, look left. Anyone over 150, look right."). This gauges wealth distribution without revealing individual exact scores yet.
  *   **Midway Check (Round 10):** Pause. Ask: "Who is feeling lucky? Who is terrified?"
  *   **The Crash:** By Round 15–20, expect several people to hit 0. When someone hits 0, loudly announce: *"Bankrupt. Table cleared."* Let the silence sit for a second. Watch the remaining players' faces change. They realize they are now playing with "house money" effectively.

  **0:50 – 1:00 | The Freeze & Tally**
  Stop after Round 20.
  *   Everyone writes their final score in red ink.
  *   **The Reveal:** Have them stand up. Arrange them in a line from Lowest Score (0) to Highest Score.
  *   **Observation:** The person with the Highest Score rarely bet All-In. The person at 0 almost certainly bet high percentages consistently.
  *   Draw a rough histogram on the board: High stakes (Left column) vs Low stakes (Right column). Mark who went Bust vs. Who Compounded.

  **1:00 – 1:30 | The Debrief (Mapping Gut to Math)**

  *Note: Do not mention Kelly Criterion or Log Utility until the very end. Build the intuition first.*

  **Step 1: The Arithmetic Trap**
  *   **Ask:** "Is the coin rigged?" (They'll say no).
  *   **Ask:** "Was the game favorable?" (They say yes, +EV).
  *   **Ask:** "If I played this game 1,000 times, would the All-Inners make money on average?"
  *   **Explain:** "Look at the guy at zero. He made the 'rational' choice by EV standards every single time. But he doesn't have a tomorrow. He died in the sequence."
  *   **Concept:** Introduce **Ensemble Average** vs. **Time Average**. "If we cloned everyone 1,000 times and played at once (Ensemble), the All-Inners average would be astronomically high. But you are not a clone. You are a sequence of moments (Time Average). In time, multiplication requires subtraction."

  **Step 2: Volatility Drag**
  *   **Action:** Bring two volunteers to the board. One started with 100, bet 50% every round. One bet 20% every round.
  *   **Math check (do this together):** "If you gain 50% (1.5x), you need a 33% drop to get back. If you lose 50% (0.5x), you need a 100% gain to get back."
  *   **Point:** Large swings eat away at the bottom. To recover from a loss, you need *more* percentage gains than you lost. This is **Volatility Drag** or **Variance Drain**. Maximizing Expected Value maximizes this drag.

  **Step 3: The Solution (Log Wealth)**
  *   **Ask:** "How do you protect against the crash while keeping the profit?"
  *   **Answer:** Keep the bet small enough that a string of losses doesn't kill you, but big enough to compound.
  *   **Reveal:** "There is a formula called the **Kelly Criterion**. For this specific coin, the answer was roughly 20%." (Check the class: Did anyone guess 20%?).
  *   **The Gut Punch:** "You were looking for the right bet. There is no right bet without considering your **wealth**. Your optimal bet *changes* every time you win or lose. That is why betting a fixed dollar amount is stupid, but betting a fixed *percentage* is sustainable."

  ---

  ### Part 3: What Predictably Goes Wrong (and how to fix it)

  **Problem 1: The Rounding Argument.**
  Participants will argue over decimals. "I had 50.4 units, 10% is 5.04... did I subtract 5 or 6?" If they round up on losses, they go bust artificially.
  *   **Fix:** Set the ground rule *before* the first flip: **"Always truncate decimals downwards."** (So 50.9 stays 50, 50.4 becomes 50). This favors the house/bank, making it slightly harder to reach the theoretical maximum, but consistent for everyone. Alternatively, allow phone calculators but insist they write down the *exact* result.

  **Problem 2: The Lucky Winner.**
  Someone will bet 40% every time, catch a streak of 5 heads, and become the millionaire of the session. They will argue, "See? Aggression pays!"
  *   **Fix:** During the debrief, acknowledge them. "This person is incredibly lucky. In a casino, they would cash out now. Tomorrow, when the laws of probability reassert themselves, that wealth vanishes." Show the median wealth, not just the max wealth. The median of the group is a better proxy for the Time Average than the outlier max.

  **Problem 3: The "Copy Cat" Effect.**
  After Round 3, half the room sees Person A winning big and Person B going bust. Person B changes to match Person A.
  *   **Fix:** Enforce **Anonymity**. Collect scorecards after Round 1. Do not allow talking about scores. This forces everyone to confront their own risk tolerance independently.

  **Problem 4: The Facilitator Bias.**
  If *you* flip a real coin, people suspect you manipulated it.
  *   **Fix:** Use a transparent die cup or a trusted online random number generator projected on screen. Better yet, hand the RNG to a participant. "Pick a number between 1 and 10. 1-6 is Heads."

  ---

  ### Part 4: The Limitations (What you MUST supply verbally)

  As the facilitator, you must explicitly state what the game *cannot* show, otherwise the analogy breaks later.

  **1. Infinite Liquidity vs. Bankruptcy**
  *   **Limitation:** In real life, you can borrow money. In this game, hitting 0 is death.
  *   **Correction:** Explain that while bankruptcy is rare in professional finance, "permanent loss of capital" functions similarly to being knocked out of the game. The principle holds: If you cannot recover the drawdown, the EV argument collapses.

  **2. Fixed Parameters vs. Black Swans**
  *   **Limitation:** The coin bias (60/40) is static and known.
  *   **Correction:** Real markets have changing correlations and unknown risks (Model Risk). The Kelly Criterion assumes you know the probabilities. If your estimate of 60% is actually 50%, the "optimal" bet size is too high and you lose. This emphasizes that conservative betting is also a hedge against *model error*, not just bad luck.

  **3. The "One Life" Constraint (Ergodicity)**
  *   **Limitation:** The game ends at 90 minutes.
  *   **Correction:** You must articulate the **Ergodicity** concept clearly.
      *   *Script:* "This game is non-ergodic. If I took the room and split us into 1,000 different universes, the average result would look like the 'All-In' winners. But you exist in only one universe, and time moves forward. In one universe, 'Average' does not equal 'Experience.' You are experiencing the Time Average. Maximizing the Ensemble Average gets you killed in the Time Average."

  ### Summary Checklist for You

  *   [ ] Print scorecards with clear rounding rules.
  *   [ ] Prep RNG projection (ensure visibility).
  *   [ ] Pre-calculate the "Ideal" outcome (Starting 100, 20% bet, 20 rounds of perfect Kelly growth ≈ 415 units, depending on H/T ratio).
  *   [ ] Prepare the "Clone" explanation for the Ergodicity moment.
  *   [ ] Commit to ending the game at exactly 20 rounds regardless of score.

  This plan moves the audience from *thinking* about risk to *feeling* the constraint of sequential decision-making. It proves that "positive EV" is not a magic wand—it is just a slope. If you build a wall too high (bet too much), you slide off it.
