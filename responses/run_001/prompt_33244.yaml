      *   **The Task:** Act as a scholar of ancient philosophy with command of Plato's dialogues. Think carefully, consider relevant passages, and provide a judgment on whether David's appeal is defensible or a distortion.
      *   **The Goal:** Advise the user on whether to pour a glass or maintain skepticism, based on textual evidence.

  2.  **Initial Knowledge Retrieval & Textual Verification:**
      *   *Symposium:* Yes, Agathon suggests moderation. Aristodemus notes they agreed to drink lightly after the banquet was over. The goal is $philosophia$ (love of wisdom), not getting drunk. Dionysus (god of wine) is invoked, but the context is controlled revelry ($symposion$).
      *   *Republic:* Guardians are strictly forbidden from being drunk ("A guardian should know how to handle wine... but never so as to make him incapable of ruling"). (Book 3, 403c-404e).
      *   *Laws:* This is the crux. Book 1 discusses education and testing character through wine. Wine is described as "pharmacological" — a tool to test courage and soften the soul to learn, but under strict supervision of a sober leader (the "sober magistrate"). It is *not* meant for general philosophical discourse among equals in all contexts, but specifically for a training exercise ($gymnastike$) of the soul before full maturity.
      *   *Gorgias/Apology/Crito:* General tone favors sobriety/reason over passion, though *Apology* shows Socrates drinking at his trial? No, he stays calm. Drinking isn't central there.
      *   *Banquets ($Symposia$):* In Greek culture, the $symposion$ is the setting for many philosophical discussions (Symposium, Phaedrus). However, Plato distinguishes between the *drinking party* and the *philosophical inquiry*.

  3.  **Synthesize the Evidence (Drafting the Argument):**

      *   **Point 1: The Symposium.** David cites this as proof. But the text explicitly rejects heavy drinking. Socrates says he can hold his liquor, but the group agrees to drink what remains from the evening meal lightly, or simply discuss philosophy without the excess. Euphoius warns against drunkenness. Agathon proposes drinking moderately because "most of them are hard drinkers." So, David's claim of "wine aids conversation" misses the crucial caveat: *moderation*.
      *   **Point 2: The Republic.** Clear prohibition for the elite/guardians. Intoxication undermines reason, which is the ruler of the soul. If the group is aiming at truth, excessive wine is an obstacle. Light sipping might be culturally acceptable, but Plato emphasizes sobriety for the rational part.
      *   **Point 3: The Laws.** This is where David gets partial credit. In Book 1 (645d-653c), the Athenian Stranger argues wine is useful for testing youth and softening the soul to accept instruction. It acts like iron heated by fire. *However*, it requires a strict hierarchy. There must be a "sober master of the feast." It is a pedagogical tool, not a casual social lubricant for peers. The goal is self-mastery, not just openness.
      *   **Point 4: The Philosophical Method.** Socrates uses irony, questioning, and elenchus. This requires sharp logic. Alcohol dulls edges. While it might loosen inhibitions, it risks shifting from *logos* (reasoned argument) to *pathos* (emotion/passion).
      *   **Conclusion:** David is cherry-picking. He is treating the *Laws'* specific pedagogical experiment as a general rule for adult philosophical discussion. He is overlooking the *Republic*'s warnings and the *Symposium*'s insistence on moderation.

  4.  **Adopting the Persona:**
      *   Tone: Scholarly, respectful, patient, rigorous. Like a professor advising a promising student.
      *   Vocabulary: Use terms like *symposion*, *sophrosyne* (temperance), *logos*, *paideia*.
      *   Structure: Acknowledge the user's intuition (it *is* off), walk through the texts, address the specific arguments, then give a verdict.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Nuance:* I shouldn't say wine is *bad* in Plato. In the *Laws*, it *is* good *if used correctly*. I need to validate that David isn't 100% lying about the *Laws*, but he is misapplying it. The context matters: *Laws* = Lawgiving/Education; *Symposium* = Adult philosophical gathering.
      *   *Key Distinction:* The difference between a "symposium" (institutionalized drinking party) and a "philosophical meeting." Plato acknowledges the tradition but transforms it.
      *   *Advice:* Tell the user they don't have to drink. Sobriety is arguably more Socratic. But if they want to fit in, they can sip, provided they understand it's a ritual, not a requirement for truth.

  6.  **Finalizing the Response Structure:**
