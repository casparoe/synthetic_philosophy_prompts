      *   Need to ensure the WKRP definition is precise. WKRP = Reasons that bear on the state of believing rather than the content.
      *   In this case, the pragmatic reason *does* bear on the state.
      *   The defender says: "It's not a reason to believe, it's a reason to want to believe."
      *   My rebuttal: Since wanting to believe requires a mechanism that fails (due to reflexivity), the pragmatic reason exerts normative pressure on the belief itself, creating a "normative gap" where the agent feels obligated to believe $p$ despite insufficient evidence, simply because $p$'s truth is secondary to the state's utility.

      *(Self-Correction during drafting)*: Make sure not to confuse "Pragmatic Encroachment" (where stakes affect justification threshold). Here the stakes affect the *correctness* of the belief itself. This is crucial. The WKRP is about whether pragmatic reasons can be reasons for belief *simpliciter*.
