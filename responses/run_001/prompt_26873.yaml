      *   Ensure the distinction between "Reason to Believe" and "Reason to Adopt a Stance" is highlighted.
      *   The defender's "Ad Hoc" critique should point out that if we allow *any* pragmatic reason to override the inability to believe at will whenever self-manipulation is reflexively undermined, we open the door to widespread pragmatic encroachment on belief norms.

