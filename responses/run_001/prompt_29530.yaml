answer: |-
  This is one of the most profound and difficult questions regarding *On Certainty*. You have correctly identified the central friction point: if these propositions are exempt from justification, do they not become dogmatic prejudices? Does this not concede the skeptic's main point—that all knowledge rests on faith?

  Wittgenstein’s response relies on a radical re-description of what "certainty" is. The mistake in calling hinge propositions "ungrounded assumptions" is a **category mistake**. You are treating them as if they were *empirical claims* standing alongside other empirical claims (like "there is a chair in the corner"), merely ones that happen to be very stubborn. Wittgenstein argues they are not empirical claims at all, but **grammatical rules** disguised as empirical statements.

  Here is a breakdown of why labeling them as "irrational assumptions" misses the force of his argument, addressing your specific concern about the standards of rationality.

  ### 1. The Distinction Between "Truth" and "Certainty"
  You write: *"They are, therefore... not things we know... [but] are also not things we can sensibly doubt."*
  Your worry is that if they aren't known, they must be believed without reason (prejudice). But Wittgenstein suggests this creates a false dichotomy. He proposes that there is a third thing: **standing-fast certainty.**

  To treat a hinge as an "assumption" implies we are weighing it against evidence. We are asking, "Given the evidence available, do we believe $P$?" But the hinge is not *in* the field of evidence; it constitutes the *field*.
  *   **Analogy:** Imagine playing chess. A piece moving diagonally when it captures is a rule. You cannot "test" whether a bishop should move diagonally by playing another move and checking the result. The rule determines what counts as a valid move.
  *   **Application:** Saying "I have hands" functions like a rule of the language-game of reporting on my body. To ask "What grounds do you have for this?" is not to play the game of inquiry more thoroughly; it is to step outside the game where "grounds" have no purchase.

  If you call them "ungrounded assumptions," you imply that they *could* be grounded if we tried hard enough, and that they are currently lacking something necessary for a "good" belief. Wittgenstein argues they lack nothing. They are not incomplete beliefs; they are complete frameworks.

  ### 2. The Charge of Irrationality
  You ask: *"What is the mistake in saying... a system of beliefs built on such assumptions is irrational by the very standards it claims to honor?"*

  The mistake lies in assuming the standard of rationality (the demand for grounds) applies universally, including to the system that generates the standard.
  Wittgenstein argues that the concept of "giving reasons" has limits. As he writes in *On Certainty* §124:
  > *"The end is not an ungrounded assumption: it is an ungrounded way of acting."*

  Rationality is internal to a practice. If you try to justify the practice of asking for reasons by providing a reason, you beg the question (circularity). If you refuse to provide a reason, the skeptic says you are irrational. Wittgenstein's move is to deny that this is a failure of rationality. Instead, it is the condition for rationality to exist at all.
  *   If every proposition required a ground, you would never be able to start asking questions.
  *   The "hinges" act as the scaffold. It is not irrational to rely on the scaffold while building the wall; it is impossible to build a wall without it.
  *   The system is not "violating" its own standards because those standards require the existence of some things that stand fast. Without the hinges, the concepts "true," "false," "ground," and "reason" lose their meaning.

  ### 3. Psychological Inability vs. Logical Necessity
  You mention the risk that this is just a "prejudice that we happen to be psychologically unable to give up."

  This is perhaps the strongest objection. If I simply *can't* doubt that the earth exists, is that a fact of my psychology (weakness of will/habit) or logic (grammar)? Wittgenstein insists it is closer to the latter, though it manifests in the former.
  In §204, he writes:
  > *"Giving grounds, justifying the evidence, comes to an end: but the end is not certain propositions striking us immediately as true, i.e. it is not a kind of seeing on our part; it is our acting, which lies at the bottom of the language-game."*

  He shifts the locus from *intellectual assent* to *embodied action*. It is not that I have a strong conviction that I have hands. It is that I reach for tools with my hands without hesitation.
  *   If you say a hinge is a "psychological prejudice," you imply that ideally, we *should* be able to check it, but we are too lazy or cowardly.
  *   Wittgenstein argues that we cannot check it because "checking" involves using tools, senses, and memory—all of which presuppose the hinge.
  *   Therefore, it is not a bias preventing investigation; it is the medium *through which* investigation happens.

  ### 4. The Riverbed Metaphor
  In §§96–99, Wittgenstein uses the metaphor of water flowing around the riverbed. The water is the fluid thoughts, doubts, and inquiries. The bed is the fixed propositions (hinges).
  > *"It might be imagined that some propositions, of the form of empirical propositions, had hardened and functioned as channels for such empirical propositions as had not hardened but remained fluid."*

  Crucially, the bed is not made of stone forever. Over immense time, the bed can shift (e.g., geocentric astronomy gave way to heliocentrism; "material substance" was questioned in quantum physics). However, at any given moment, if the bed moves, the whole language game changes.
  This counters the accusation of dogmatism. Dogma says: "This is eternally fixed." Wittgenstein says: "This is fixed *relative to our current mode of life*, but it is contingent on the fact that we are the kind of beings who live this way."

  ### 5. Defeating the Skeptic without Winning
  Finally, regarding your fear that Wittgenstein is "conceding the charge": The skeptic wants to show that *nothing* can be certain because everything depends on something unproven.
  Wittgenstein responds by changing the goalpost. He agrees: Yes, there is no proof for the hinge. But then he adds: That is irrelevant.
  Doubt is not the default state of the universe; belief/action is. As he notes in §115:
  > *"When Moore says he knows such and such, he expresses his trust in him. And so does he express his trust in others."*

  The skeptic makes a logical error by trying to apply "knowledge" and "doubt" where the grammar does not allow it. The skeptic says, "You can't prove the external world exists!" Wittgenstein replies, "That is not how language works. 'Existence' is not a property of objects that you verify; it is presupposed by the grammar of verification."

  To accuse the system of being irrational is to impose an external standard of "total justification" that has no connection to human life. As long as we are acting, speaking, and interacting, our hinges are working perfectly. The demand for an external justification is not a higher standard of rationality; it is a grammatical nonsense.

  ### Summary
  The mistake in calling hinges "ungrounded assumptions" is that it treats them as *failed beliefs* (beliefs we hold but cannot support). Wittgenstein argues they are *successful actions* (ways of operating that enable supporting beliefs).

  They are not irrational prejudices because "irrational" implies breaking the rules of reasoning. Hinges *are* the rules of reasoning (for us). To doubt them is not to challenge them with better arguments; it is to abandon the game entirely. If the skeptic says, "This is unjustified," Wittgenstein answers, "Yes. But 'justified' requires a context of usage, and I am the context."
