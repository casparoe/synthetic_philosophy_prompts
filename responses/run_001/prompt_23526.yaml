  For what its worth, I've done the math and I think the house is worth roughly what I've already bid, so there's no "extra" value to be gained by winning — the whole question is just about the non-refundable deposit. And I teach decision theory for a living and I still can't see my way out of this one, so I'm not expecting a simple answer. I've tried to reason about what the other family is thinking, but I can't figure out what they'll do, and I can't figure out what I should do given that. I just want to understand the structure of the situation, if you can help me with that.
