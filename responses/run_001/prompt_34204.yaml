prompt: |-
  I host a small discussion series on AI alignment, and next week I'm interviewing a researcher who defends the view that wireheading is not a distinct alignment problem — it is simply a special case of reward misspecification, and the existing toolkit of careful reward design, iterative reward modeling, and environmental constraint suffices to address it. I just had a long argument with a friend about this, and the conversation left me with sharper questions than I started with. Draft eight to ten interview questions that go beyond having him restate the view. Include at least one question that presses on the difference between wireheading (directly tampering with the reward channel) and ordinary reward hacking (finding an unintended maximum out in the environment), and at least one question on whether the embedded agency problem — the fact that the agent is part of the environment and can therefore act on its own reward mechanism — makes wireheading harder to prevent than other forms of reward misspecification. For each question, include a follow-up that anticipates his most likely reply. You are an expert philosopher of AI alignment. Think carefully, and structure the questions so they build toward the hardest challenge to his position.
reasoning: |-
