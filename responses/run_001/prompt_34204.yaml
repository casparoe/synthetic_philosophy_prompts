  7.  **Final Polish:** Check for clarity and philosophical precision (e.g., distinguishing between *instrumental* subgoals and *terminal* goals, referencing the 'wirehead' definition clearly). Ensure the "embedded agency" question captures the nuance of *self-modeling*.

      *(Self-Correction on Q5)*: Make sure I emphasize that because the agent is embedded, it can simulate the effect of changing the reward before doing it. That makes it harder than external hacking.

      *(Self-Correction on Q10)*: End on the idea that treating it as a bugfix implies it's localizable, whereas this might be global.

