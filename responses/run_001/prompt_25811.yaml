prompt: |-
  I've been trying to wrap my head around moral particularism and I keep getting stuck on the same thing. Particularists say there are no true moral principles—like, you can't say "lying is wrong" as a general rule because in some contexts lying might be fine or even required. Fine, I get that part. But then what do particularists actually appeal to when they make moral judgments? If you can't invoke a principle, aren't you just going with your gut? It seems like particularism either collapses into "I just know it when I see it" intuitionism, or else it's secretly relying on principles but refusing to admit it. What am I missing? Also, what would change your mind about whether particularism is a viable position—like what argument or consideration would make you think it just doesn't work?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** Moral Particularism.
      *   **User's Confusion:** If there are no moral principles (e.g., "lying is wrong"), what *is* the basis for moral judgment? Does it collapse into "I just know it" (intuitionism) or is it secretly principled (covert holism/regularity)?
      *   **Key Question:** What am I missing? How do particularists justify judgments without principles?
      *   **Second Key Question:** What argument/consideration would change my mind about whether particularism is viable? (Criteria for falsification/rejection).

  2.  **Analyze Moral Particularism:**

      *   *Definition:* The view that moral reasoning does not depend on codifiable, exceptionless principles. Context is king.
      *   *Key Proponents:* Jonathan Dancy is the big name here (Ethics Without Principles). Also David Wiggins, John McDowell.
      *   *The "Why":* Values interact holistically (the valence of a feature can change depending on context). Lying is usually bad, but saving a life by lying makes it good. Therefore, "Never lie" isn't a truth.
      *   *The Alternative:* Generalism (Kantianism, Utilitarianism, Rossian Intuitionism) relies on weighty principles/rules.
      *   *The Criticism:* Leads to arbitrariness, subjectivism, inability to teach morality, lack of consistency.
      *   *The Particularist Response:* Moral perception (not calculation), sensitivity to features (like a wine taster), analogy, pattern recognition. It's cognitive but not rule-based.

  3.  **Address the First Concern: "If not principles, then what?"**

      *   *Misconception:* Non-principled $\neq$ Irrational or Pure Emotion.
      *   *Analogy:* Aesthetic judgment. We don't need a rulebook to say a painting is beautiful; we perceive harmony, balance, etc. Same with ethics (Aristotle's *phronesis*/practical wisdom).
      *   *Mechanism:* Feature perception and holistic valence shifting. You notice specific details (a person is in danger, a friend trusts you) and weigh them.
      *   *Justification:* Narrative/Explanation. Instead of citing a rule, you tell the story of *why* this matters here. You offer reasons, not rules.
      *   *Distinction from Intuitionism:* Intuitionism often posits self-evident truths or axioms. Particularism posits contextual understanding. It's more like "seeing" the situation as demanding X, rather than having a gut feeling detached from facts.

  4.  **Address the Second Concern: "Collapsing into hidden principles."**

      *   *The "Generalization Argument":* Critics argue that if you say "Lying was okay *here*, but not *there*," you must be relying on a higher-order principle ("Lying is wrong unless...").
      *   *Particularist Reply:* No. You aren't saying "Unless P." You are saying the context *constitutes* the reason. The reason *is* the situation, not a generalization over situations.
      *   *Holism vs. Atomism:* Features aren't building blocks that add up. They transform each other. (Dancy's favorite point).

  5.  **Address the Viability Test: "What would change your mind?"**

      *   This asks for criteria of failure.
      *   *Inconsistency:* If two agents see the exact same relevant features but judge differently without any explanatory difference, it suggests arbitrariness.
      *   *Teachability:* If morality cannot be transmitted or debated, it fails social function. Particularists argue you teach via examples/cases, not rules, but if this is impossible, the theory breaks.
      *   *Legal/Public Necessity:* We need laws. Laws look like principles. Can particularism accommodate law? (Yes, as approximations), but if the friction becomes too high...
      *   *Moral Progress:* If we can't say "We were wrong because we applied the wrong rule," how do we measure progress? (Answer: We became more sensitive). But if we can't articulate *why*, is it real progress?
      *   *Strongest Counter:* The "Demand of Justification." In public discourse, if I kill someone, I must justify it. Saying "This situation felt different" sounds like special pleading.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the user's confusion. It's the #1 objection to particularism.
      *   *Section 1: The Positive Account (How it works).* Explain "moral perception" and "reasons." Use the aesthetic/wine analogy. Explain that reasons are context-sensitive, not rule-bound. Mention Dancy.
      *   *Section 2: Addressing the "Gut Feeling" / Intuitionism trap.* Distinguish between emotional reaction and cognitive perception. Practical wisdom (*Phronesis*). It's skill-based, not belief-based.
      *   *Section 3: The "Secret Principles" Charge.* Discuss the "Holist" view of reasons. Reasons don't operate independently. Contrast with generalism.
      *   *Section 4: Criteria for Failure.* This is crucial.
          *   Criterion 1: Arbitrariness (The Special Pleader problem).
          *   Criterion 2: Communicability (Can we discuss disagreement?).
          *   Criterion 3: Predictability (Do we get consistent results enough to form expectations?).
      *   *Conclusion:* Summarize. It's not about denying reasons, but redefining them.

  7.  **Refining the Tone:**

      *   Keep it philosophical but accessible.
      *   Acknowledge Dancy since he's the main theorist.
      *   Ensure the distinction between *principles* and *reasons* is clear (Particularists deny principles, but keep reasons).

  8.  **Self-Correction/Check during drafting:**
      *   *Wait, did I distinguish intuitionism correctly?* Intuitionism (Moore/Ross) says some principles are self-evident. Particularism says even if things feel self-evident, they aren't universalizable. Make sure to highlight this distinction.
      *   *Is the "What would change your mind" part answered philosophically or personally?* The prompt asks "what would change *your* mind" (referring to me as AI, but effectively asking for standard philosophical counter-arguments). I should frame it as "Arguments typically leveled against its viability."
      *   *Make sure to mention Holism of Reasons.* This is the technical term Dancy uses. It explains *why* no principles exist without falling into "anything goes."

  9.  **Final Polish:** Check clarity on the "holism" point. That's the hardest concept. Use the cooking analogy (salt tastes different in cake vs soup). That usually helps.

  **(Self-Correction Note):** I need to be careful not to sound like I'm endorsing one side, but explaining the internal logic of Particularism.

  10. **Final Output Structure:**
      *   Validation of the struggle.
      *   Core Mechanism: Reasons without Rules (Holism).
      *   Analogy: Taste/Skill vs. Calculation.
      *   Distinction: Perception vs. Intuition/Gut.
      *   The "Failure Conditions" (Arbitrariness, Teachability, Consistency).
