answer: |-
  1. Dependency structure (~300 words)
  Before stating the inversion, you must establish three conceptual dependencies in this order. First, define the **Competence-Comprehension Distinction**. Students must distinguish between *being able to do something reliably* (competence) and *possessing an internal model of why it works* (comprehension). Without this, the inversion collapses into a claim about ignorance rather than mechanism. Second, establish the **Default Teleological Intuition**. Show that humans naturally assume order implies a designer who comprehends the end-state. This sets up the target for the inversion. Third, clarify the **Algorithm as Mechanism**. Students must accept that algorithms are just causal chains, not inherently intelligent entities.

  Regarding order, teach the Darwin Inversion before the Turing Inversion. The Darwinian case (natural selection) confronts the deepest intuitive resistance: the idea that complex function (like an eye) could arise without foresight. It breaks the "design requires designer" intuition phenomenologically. Once students accept that blind selection creates competence, the Turing Inversion (symbol manipulation creating thought-like output) serves as the structural proof. It shows the mechanism isn’t mystical; it’s syntactic processing. Teaching Turing first risks students dismissing it as "just computers," whereas starting with Darwin makes the biological reality undeniable, forcing them to reconcile the mechanism later with Turing. Neither stands entirely alone; Turing explains the *process* Dennett claims Darwin discovered, while Darwin provides the *prevalence* evidence for Turing’s abstract claim. Together, they form a complete picture of competence arising unguided.

  2. The carrying example (~200 words)
  Use **The Adaptive Immune System** as your single carrying example. Return to it repeatedly. 

  **Must Have:** It must display high-level competence (identifying pathogens, remembering infections, neutralizing threats) without any central controller that comprehends immunology. It must demonstrate a generative process where solutions are selected over time (affinity maturation) rather than pre-installed. 
  **Must Lack:** It must not contain a literal homunculus or internal representation of "health" vs. "sickness" that directs the response consciously.

  Do not split the examples. Using one case prevents the distraction of comparing biological vs. mechanical contexts. The immune system works for biology students (t-cells/B-cells), cognitive scientists (pattern recognition/memories), computer scientists (genetic algorithms/heuristics), and philosophers (agency/function). When introducing Darwin, frame the immune system as evolving within a lifetime. When introducing Turing, frame antibody binding as a rule-based chemical match. When discussing the "designer objection," ask who designed the antibodies. This anchors the abstraction of "competence without comprehension" to a shared, tangible reality throughout the ninety minutes.

  3. Misconception map (~400 words)
  **Misconception 1: Comprehension equals Consciousness.**
  *Timing:* Early, during definitions.
  *Mitigation:* Explicitly warn that "unconscious competence" exists (e.g., walking). State clearly: "We are talking about understanding reasons, not having feelings."
  *Risk:* Students may conflate unconscious processing with pure mechanism, missing the semantic layer.

  **Misconception 2: The claim is that comprehension does not exist anywhere.**
  *Timing:* After defining the inversion.
  *Mitigation:* Clarify: "Humans have comprehension, but it sits atop layers of non-comprehending systems." Frame it as a hierarchy, not an elimination.
  *Risk:* None, if framed as hierarchical.

  **Misconception 3: Darwin’s inversion is just 'Randomness plus Time'.**
  *Timing:* During the Darwin explanation.
  *Mitigation:* Use the term "Selective Filter." Emphasize that mutation is random, but retention is non-random. The "reason" is in the filter, not the generator.
  *Risk:* May sound deterministic, but necessary to correct the lottery fallacy.

  **Misconception 4: Turing reduces to 'It’s just symbol manipulation.'**
  *Timing:* During the Turing explanation.
  *Mitigation:* Acknowledge the reduction, then pivot: "Exactly. That is the strange part—that syntax produces semantics downstream."
  *Risk:* Students may dismiss the claim as trivializing meaning rather than grounding it.

  **Misconception 5: The Regress Objection ('Who designed the process?').**
  *Timing:* End of session.
  *Mitigation:* Allow it to surface. Show that asking "who designed evolution" pushes the issue back to physics, which is not an *intelligent* design in the same way. The chain ends at physical necessity, not mental will.
  *Risk:* If handled too quickly, it feels like dodging the theological question.

  **Sequence Logic:** These surface predictably because they track the erosion of the "mind-first" intuition. Head off 1 and 2 to clear terminology. Head off 3 and 4 to prevent dismissal of the mechanisms. Address 5 last, once the inversion’s logic is solid, to prevent derailment earlier. Heading off 1 early prevents philosophical category errors later, but risks making "comprehension" seem less valuable than intended. Addressing 5 early invites theological debates; delaying it respects the scientific argument’s boundaries.

  4. Check for understanding (~150 words)
  In the final ten minutes, pose this question: **"Identify a routine activity in your own discipline (e.g., protein folding, database indexing, moral judgment) that appears to require insight. Redescription it using only the language of steps, filters, and feedback loops, explicitly locating where the 'comprehension' disappears."**

  A correct answer demonstrates they recognize that the *output* resembles comprehension, but the *internal operations* are syntactic or selective rather than semantic. They should identify the substrate performing the work (e.g., "the algorithm sorts, not the programmer") without invoking a ghost in the machine.

  Wrong answers reveal specific failures: If they invoke a "hidden user," they failed the homunculus rejection (Dependency 1). If they say the steps are magical, they missed the algorithmic mechanism (Dependency 3). If they deny the competence exists, they rejected the premise. If they cannot locate the transition from competence to comprehension, they view the inversion as merely rhetorical rather than structural.

  5. What to leave out (~150 words)
  **Qualia and the Hard Problem.**
  *Flag:* "That is a real question but it is not tonight's question because Dennett’s inversion targets functional architecture, not subjective experience."

  **Implementation Specifics (Neurons vs. Silicon).**
  *Flag:* "That is a real question but it is not tonight's question because the inversion holds regardless of the medium."

  **Free Will and Determinism.**
  *Flag:* "That is a real question but it is not tonight's question because we are analyzing causal origin, not moral responsibility."

  **Gödelian Arguments / Lucas-Penrose.**
  *Flag:* "That is a real question but it is not tonight's question because it relies on formal limitations Dennett sidesteps."

  Keep the focus strictly on the genealogy of competence. Any attempt to discuss the "inner light" of experience shifts the conversation from the *structure of reason* to the *phenomenology of mind*, which derails the specific argument about inversions. Protect the timeline rigorously.
