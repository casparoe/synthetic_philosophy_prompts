  1. Standard proof systems presuppose a constitutive conception of logic, wherein inference rules function as norms defining rational agency rather than empirical truths requiring further proof.
  2. This position survives Carroll’s regress by distinguishing the speech-act of inference from the propositional content of material implication, thereby preventing the conversion of rules into premises.
  3. We are therefore committed to the claim that justification must terminate at primitive norms, since any attempt to validate them logically would already presuppose the very principles at issue.
  4. If we acknowledged this problem, teaching would shift from formal manipulation to explicating the pragmatic commitments inherent in asserting that a conclusion follows from specific premises.
  5. Validity would then be presented not as a discovered feature of reality but as a constitutive rule of our discursive practices. This reframing preserves rigor while admitting that logic describes the structure of reasoning rather than grounding it externally.
