  2. Superconductors display a disposition to conduct electric current with zero resistance below a critical temperature. When a magnetic field penetrates a Type-II superconductor as flux vortices causing energy dissipation, it is difficult to decide if the motion represents a localized destruction of the superconducting state (fink) or a macroscopic obstruction of the superfluid flow (mask).

  3. Metals have a disposition to propagate cracks under cyclic tensile loading. Introducing compressive residual stresses via shot peening inhibits this crack initiation, creating ambiguity because the treatment changes the internal energy state of the lattice (fink) while also functioning as an external counter-pressure against applied loads (mask).

  4. Supersaturated solutions hold a disposition to precipitate solid crystals spontaneously. Polymeric additives adsorb onto molecular clusters to prevent nucleation, creating ambiguity regarding whether the polymers modify the thermodynamic activity of the solute (altering the disposition) or simply create a physical steric barrier to crystal growth (mask).

  5. Quantum systems have a disposition to evolve deterministically according to the Schrödinger equation. Frequent projective measurements halt this evolution entirely, raising the question of whether the measurements fundamentally alter the system's dynamical generators (fink) or constantly reset the initial conditions to prevent amplitude accumulation (mask).
