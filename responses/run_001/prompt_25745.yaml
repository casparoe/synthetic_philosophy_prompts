  Subject: Joint Statement on Manipulation versus Persuasion

  Hi both, following our lengthy discussion tonight, we have compiled this joint statement to clarify our shared commitments, isolate our precise points of contention, and outline how we might test them against concrete evidence. We begin with our area of substantial convergence, as identifying common ground is essential before addressing our divergences. Both of us agree that the preservation of individual autonomy is the primary moral concern driving the distinction between manipulation and persuasion, and we both reject the idea that all social influence is equally virtuous. We share the intuition that force or overt coercion falls outside the scope of persuasion entirely, and we agree that some forms of influence degrade the quality of the target’s decision-making process even if they eventually consent. Furthermore, we both acknowledge that the boundary is not always binary but rather exists along a spectrum of influence, and we concur that understanding the psychological mechanisms behind these interactions is crucial for ethical evaluation. Despite these significant overlaps, we find ourselves unable to pin down the exact pivot point where legitimate influence becomes illegitimate manipulation, which has led us to frame our current disagreement as follows.

  On the matter of the defining feature of manipulation, we disagree on whether the locus of the problem lies in the cognitive mechanism affected or the transparency of the strategy employed. I maintain that manipulation is characterized by epistemic opacity, meaning that an act counts as manipulation if and only if the influence depends on the target remaining unaware of the influencer’s specific technique or intent, such that revealing the method would defeat the influence; under this view, I consider even logically rigorous arguments to be manipulative if they rely on concealed framing, selective evidence presentation, or deceptive omissions that the target would reject had they known the full context. In contrast, he maintains that manipulation is defined by the degradation of rational agency, meaning that an act counts as manipulation if and only if the influence functions by bypassing, subverting, or short-circuiting the target’s capacity for reasoned deliberation, such as triggering visceral emotional responses or exploiting automatic cognitive heuristics; under his view, presenting poor logic or weak arguments is simply bad persuasion rather than manipulation unless the mechanism itself prevents rational engagement. These definitions capture our respective intuitions, where mine centers on what would happen if the target knew the truth, and his centers on the internal cognitive process occurring during the interaction.

  To resolve whether our disagreement is substantive or merely semantic, we have identified specific cruxes where a change in judgment by one party would constitute progress, accompanied by the empirical tests we believe bear on these questions. Our first crux concerns the status of openly disclosed rhetorical devices that exploit cognitive biases. The concrete case we propose examining is a salesperson who explicitly tells a customer, I am going to use scarcity tactics to make you feel urgency, knowing that once the pressure drops your desire will vanish. I predict that under my transparency criterion, this disclosure neutralizes the manipulation, rendering it a form of honest negotiation because the customer can now factor the tactic into their reasoning. He predicts that under his capacity-bypassing criterion, this remains manipulation because the mechanism still targets the emotional urgency response rather than the rational assessment of value, regardless of the disclaimer. Our second crux concerns the ethical status of a well-reasoned argument built entirely on cherry-picked data that the arguer knows is incomplete. The concrete case is a lobbyist who presents valid logic connecting tax cuts to growth, but deliberately omits historical data showing the inverse effect in similar contexts, while refusing to admit the omission. I predict this qualifies as manipulation because the success of the argument hinges on the lobbyist keeping the missing context hidden, effectively deceiving the target about the evidence base. He predicts this counts as persuasion, albeit dishonest persuasion, because the argument engages the target’s reason and does not necessarily bypass their deliberative faculty, treating the deception as a lie rather than a distinct category of manipulative mechanism.

  We commit to reviewing these cases and any further evidence that arises from them as a way to update our positions. If I am wrong and the salesperson scenario feels manipulative despite the disclosure, I will reconsider the sufficiency of transparency. If he is wrong and the lobbyist scenario fails to feel manipulative despite the deceit, he will reconsider whether rational engagement is sufficient for persuasion. We hope this document serves as a stable baseline for continuing our inquiry without losing sight of our shared goal of clarifying how best to respect one another’s autonomy in the face of competing influences.
