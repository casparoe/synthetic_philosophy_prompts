prompt: |-
  a friend of mine is really into the quantum immortality thing and he keeps making this analogy: you can never experience being dead, right? from your own perspective you're always alive. so in a many-worlds universe, you just keep finding yourself in branches where you survived. he says quantum immortality is just this mundane point about first-person perspective, nothing spooky or metaphysical. i feel like the analogy is doing some heavy lifting but i can't quite put my finger on where it breaks. can you lay out the mapping — what corresponds to what, what gets imported from the mundane case that doesn't belong in the quantum case — and tell me whether the "nothing to see here" conclusion actually holds up?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Quantum Immortality (QI) in the context of the Many-Worlds Interpretation (MWI) of quantum mechanics.
      *   **The Friend's Argument:** "You can never experience being dead (first-person perspective). In MWI, you just find yourself in branches where you survived. It's not spooky; it's just a mundane point about perspective."
      *   **The User's Intuition:** The analogy feels like it's doing "heavy lifting" but something is off. They want to know *where* it breaks.
      *   **The Task:** Lay out the mapping (what corresponds to what), identify what gets incorrectly imported from the mundane case to the quantum case, and evaluate whether the "nothing to see here" conclusion holds up.

  2.  **Deconstruct the Friend's Analogy (Mundane Perspective vs. Quantum Scenario):**
      *   *Premise 1:* Subjective Experience requires consciousness/life. Dead people don't have experiences.
      *   *Premise 2:* Therefore, from your own POV, you are always alive.
      *   *Analogy:* This applies universally, even across branching worlds.
      *   *Conclusion:* You will always observe a version of reality where you survive. Hence, "Quantum Immortality."

  3.  **Identify the Weak Points (Where the Analogy Breaks):**
      *   *Probability vs. Measure:* In classical probability, "always surviving" isn't guaranteed unless survival probability is 1. In QI/MWI, all outcomes happen, but they have different *weights* (Hilbert space measure).
      *   *Continuity of Consciousness:* Does the "observer" persist through every branch? Or does the observer become a set of copies?
      *   *The "Survival" Definition:* Survival in QI often implies barely hanging on (e.g., severe injury, slow decay) vs. meaningful life.
      *   *First-Person Privilege:* Does "I am experiencing this" imply "I am the *only* one experiencing this"? No. There might be infinite versions of you who died and stopped experiencing, but they don't count because they aren't having an experience *now*. But do *you* get to pick the branch arbitrarily?
      *   *Reference Class Problem:* How do you define "you" for the calculation of probability?

  4.  **Structure the Response:**
      *   **Introduction:** Acknowledge the friend's argument (it's based on Self-Locating Uncertainty/Subjective Continuity) and validate the user's intuition (it *is* suspicious).
      *   **Part 1: The Mapping (What corresponds to what):** Break down the specific claims.
          *   "Never experience death" $\rightarrow$ Valid observation.
          *   "In MWI I keep finding myself alive" $\rightarrow$ The core claim.
          *   "Nothing metaphysical" $\rightarrow$ The reductionist claim.
      *   **Part 2: Where the Heavy Lifting Happens (The Glitches):** This is the meat of the answer.
          *   *Measure/Weight:* Not all branches are equal. High-survival-probability branches exist, low-survival ones exist.
          *   *Observer Selection Effect (Boltzmann Brains/Survivor Bias):* Just because you are there doesn't mean that branch was likely.
          *   *The Nature of "Finding Yourself":* You don't travel between branches. You split. Which copy is "the" you?
          *   *Quality of Life:* Living *isn't* dying, but living as a quadriplegic in a coma or with constant suffering isn't a desirable immortality.
      *   **Part 3: Evaluating the Conclusion ("Nothing to See Here"):**
          *   Is it really mundane? No, it implies radical consequences for probability theory.
          *   The "Subjective Certainty" paradox: If QI were true, we should expect to survive *highly improbable* quantum events constantly, which we don't.
      *   **Summary/Verdict:** The friend is half-right (subjective continuity is real) but wrong about the implication (QI is not a necessary consequence of MWI).

  5.  **Drafting the Content - Key Concepts to Explain:**
      *   *Many-Worlds Interpretation (MWI):* Branching universe, no collapse.
      *   *Born Rule:* Probability is based on amplitude squared (measure), not just counting branches.
      *   *Self-Locating Uncertainty:* Where am I in the multiverse?
      *   *The "Copenhagen" trap:* Don't confuse single-world probability with multiverse ontology.

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "MWI is fake." I must accept MWI as the premise (since that's the thought experiment). Even within MWI, QI has issues.
      *   *Focus on the Measure Problem:* This is the strongest counter-argument. If a branch has measure $0.000...1$, does a conscious observer still exist there? Yes, but their subjective weight matters. If the friend argues "I just land on the surviving branch," he ignores that most of his "weight" lands on the dying branch in a suicide attempt scenario.
      *   *Suffering:* QI often predicts prolonged torture near death rather than clean survival.
      *   *The "Perspective" Fallacy:* "You can't experience death" is true by definition (tautology). Applying it to predict future physical outcomes is non-sequitur.

  7.  **Final Polish:** Ensure tone is respectful to the friend's intelligence but firm on the logical gaps. Use clear headings. (Proceed to generate output based on these thoughts.)

  8.  *(Post-Draft Review)*: Did I answer the prompt directly? Yes: mapped the terms, identified the heavy lifting, evaluated the conclusion.

  **(Self-Correction Note):** Make sure to clarify the distinction between "Branch Counting" and "Hilbert Space Measure." This is crucial for why the friend is wrong even if MWI is right. Also, highlight the difference between *logical necessity* (you won't experience the branch where you're dead) vs. *empirical prediction* (you will experience a high-quality life forever).

  9.  **Finalizing the Output Structure:**
