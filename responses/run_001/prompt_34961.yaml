answer: |-
  You have put your finger on one of the most persistent and contentious fault lines in contemporary analytic metaphysics. You are right that there is no single, canonical noun in the philosophical lexicon that captures this specific *experiential* gap—the lack of friction between high-level ontology and low-level navigation.

  However, there is a cluster of technical terms that map the architecture of this position, and several pejorative labels critics use to describe the gap itself. Below is a breakdown of the existing terminology, why you don't find a clean name for it, and how you might coin a precise term for your piece.

  ### 1. The Technical Framework: Why there is no simple name
  Philosophers don't generally see this as a "glitch" requiring a name; they see it as a necessary feature of a mature worldview. Consequently, the gap is explained away using existing architectural terms rather than named as a distinct phenomenon.

  *   **The Two-Image Framework (Sellars):** Wilfrid Sellars distinguished between the **"Manifest Image"** (the world as experienced by humans—tables, chairs, persons) and the **"Scientific Image"** (the world as described by fundamental physics—particles, fields, forces). Nihilists argue both images are valid, but the Scientific Image describes what *fundamentally exists*. The fact that they don't feel tension is because they view these as complementary perspectives (like a topographical map vs. a geological survey), not contradictory truths.
  *   **Contextualism about Existence:** Many modern nihilists (like Ted Sider or Elizabeth Barnes) argue that the word "exists" is context-sensitive. In the "metaphysical context," nothing composites exist. In the "ordinary context," tables exist. Because the definition shifts with the conversational context, the transition happens without cognitive dissonance. It is a form of **"Semantic Fluidity."**
  *   **Stance Independence (Dennett):** Daniel Dennett argued we operate via different "stances" (Physical, Design, Intentional). A physicist treats a person as a collection of atoms (Physical Stance); a friend treats them as having beliefs (Intentional Stance). You switch stances depending on what you are trying to achieve. Nihilists effectively claim they can inhabit the Physical Stance in the seminar and the Intentional Stance in the pub seamlessly.

  ### 2. The Critical Vocabulary: How opponents name it
  Critics of nihilism have tried to label this disconnect, usually with negative connotations. These might be the words you encounter in rebuttals:

  *   **Ontological Equivocation:** This accuses the nihilist of using the word "exists" in two different ways without admitting it. They say "There are no tables" (strictly true) but pass the peanuts (practically true), implying a hidden shift in meaning.
  *   **The Eliminativist Dilemma:** Borrowed from philosophy of mind (regarding beliefs/consciousness), this argues that if you eliminate a category from your ontology, your ability to interact with the world based on that category should erode. The fact that it hasn't suggests the elimination wasn't serious.
  *   **Metaphysical Insulation:** While not a formal title, this phrase appears in critique. It suggests the philosopher has built a wall between their abstract commitments and their practical reasoning so that one cannot infect the other.
  *   **Cheating (Informal):** Prominent anti-nihilists (like David Chalmers or Jonathan Schaffer) sometimes imply, more diplomatically, that this is a form of **"Pragmatic Retreat."** It suggests they abandon their own theory whenever it becomes inconvenient.

  ### 3. Why the "Sunset" Analogy Fails (and why it bugs you)
  Your intuition on the sunset example is sharp. The reason the "astronomer's shortcut" feels harmless is that **no actual entity is lost.** The earth rotating is a physical fact; the sunset is a perspectival fact. Both descriptions refer to real events.

  The nihilist's claim is **eliminative**, not perspectival. If there are no tables, the "table" is not a perspective on a physical object; the object itself is denied. Therefore, the "shorthand" isn't just describing a location differently; it is affirming a non-existent entity.
  The reason the nihilists don't feel tension is due to **"Deep Intuitional Inertia."** Our brains evolved to track edges, colors, and objects. We perceive tables. To suppress that perception requires significant cognitive effort (like holding a heavy weight). Nihilists have learned to hold the weight in the seminar room and put it down in the pub. The gap exists precisely because they do not treat their metaphysical conclusion as a *guide for survival*, but rather as a *descriptive constraint on theory.*

  ### 4. Proposal: What should you call it?
  Since there is no settled term for the *observational phenomenon* you describe (the lack of felt tension), you have license to coin a descriptive term that captures the mechanics you observed. Based on your analysis, I recommend:

  **"Ontological Buffering"** or **"Metaphysical Sequestration."**

  *   **Definition:** *The cognitive capacity of a metaphysician to maintain a radical ontological rejection in theoretical discourse while sustaining unmodified pragmatic engagement with the rejected entities in daily life, characterized by an absence of experiential friction.*
  *   **Why it works:** "Buffering" implies a protective layer that prevents the harsh truth from damaging the software of daily interaction. "Sequestration" implies keeping the conflicting models isolated in separate compartments.

  Alternatively, if you want to lean into the mechanism:

  **"Pragmatic Decoupling."**
  This highlights that the link between *what one thinks is real* and *how one behaves* has been disconnected.

  ### 5. Where does the gap become a problem?
  You asked where the line lies between "sensible division of labour" and "problematic inconsistency." Philosophers draw this line at the point of **Explanatory Guidance.**

  *   **Sensible Division:** If the metaphysics is purely descriptive (e.g., "At the bottom level, there are only quarks"), but the goal of the metaphysician is just to catalogue reality, buffering is fine. You aren't claiming your theory dictates action.
  *   **Problematic Inconsistency:** The problem arises if the metaphysics makes normative claims.
      *   **Example:** If a mereological nihilist argues that **"personal identity"** is just simples arranged human-wise, and therefore you cannot punish a criminal because the "person" who committed the crime no longer exists in the same configuration, *and then* votes for the death penalty. Here, the buffer breaks.
      *   **Example:** If they argue that **morality** requires composites, but then get angry when insulted. (Though the "self" example you gave is slightly different—it appeals to emotional realism).

  The boundary is crossed when the theory is invoked to solve problems in the "Manifest World" that it renders unsolvable. If you tell me there are no persons, I ask, "Who am I voting for?" If you say "Just electrons arranged voter-wise," and then hand me a ballot, the gap is benign. If you say, "Therefore your vote doesn't count because there is no voter," and then refuse to tally the result, the buffer has failed.

  ### Summary for your Article
  You are observing what philosophers technically call the **reconciliation of the Manifest and Scientific Images**, but what you are critiquing is the **ontological inertia** that allows the philosopher to ignore the radical implications of their view.

  I suggest characterizing it as **"The Hermetic Separation of Ontology and Praxis."** It sounds clinical enough for your journalism, but accurately describes the phenomenon: the containment of the weird metaphysical truth so it doesn't leak into the wet, sticky reality of passing peanuts.
