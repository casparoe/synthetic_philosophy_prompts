      "Money pump arguments therefore successfully establish that rational preferences must be transitive, and more broadly that the axioms of expected utility theory are requirements of diachronic rationality."
      Here is the imprecision. Money pumps specifically target **dynamic consistency** arising from **synchronic** incoherence. Saying the *axioms* (like Independence or Continuity) are requirements of *diachronic* rationality is shaky. Transitivity is synchronic. Only its violation causes diachronic problems.
