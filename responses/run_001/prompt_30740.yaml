  8.  *(Self-Correction during drafting)*: I need to be careful not to take sides. The user asked for a diagnosis, not a resolution of the philosophical problem itself. Keep it neutral but insightful. Ensure I explain *why* the "Implicit Consent" argument fails against the Libertarian view (because they reject the premise of implicit consent entirely).

