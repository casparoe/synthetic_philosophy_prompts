answer: |-
  **Candidate Research Questions**

  1.  **Diagnostic Independence Hypothesis:** Do the standard Gricean diagnostics (cancellability, calculability, etc.) track a single distinction between semantics and pragmatics, or do they reveal orthogonal dimensions of utterance meaning?
  2.  **Layered Enrichment:** Is pragmatic enrichment best modeled as occurring in discrete stages (e.g., saturation vs. free enrichment), detectable by different subsets of diagnostics?
  3.  **Boundary Pluralism:** Are there multiple valid boundaries between “what is said” and “what is implicated,” rendering the traditional binary opposition obsolete?

  I select the **Diagnostic Independence Hypothesis** as the foundation for the following proposal.

  ***

  **Research Proposal: Decoupling the Gricean Diagnostics**

  **Research Question**
  This project investigates whether the standard diagnostics used to distinguish semantic content from pragmatic implicature—specifically cancellability, calculability, non-detachability, and embeddability—track a single theoretical distinction. The core question is: *To what extent do these diagnostics dissociate across natural language data, and can their divergence be mapped onto independent distinctions regarding truth-conditionality and communicative intention?* I posit that answering this will determine whether the semantics-pragmatics interface is best modeled as a boundary or a spectrum of functional layers.

  **Significance and Current Limitations**
  Current debates between Minimalists and Contextualists, as well as disputes regarding the grammatical derivation of scalar implicatures, largely operate under a tacit assumption: that there is a singular dividing line between truth-conditional content and non-truth-conditional addition. Minimalists argue for a bare semantic representation requiring minimal enrichment, while Contextualists argue for substantial pragmatic penetration into truth conditions. Concurrently, proponents of the grammatical view of implicatures contrast sharply with those viewing them as products of general-purpose reasoning. Both camps rely on the same set of Gricean diagnostics to adjudicate these claims. If all diagnostics reliably converge on a single classification, the debate remains structural. However, if the diagnostics behave inconsistently—for instance, if a certain pragmatic phenomenon is cancellable but not embeddable—the foundational premise of a unitary boundary collapses. Existing literature treats these tests as monolithic indicators. By failing to consider their potential independence, theorists risk category mistakes, attributing failures to one dimension of meaning when the issue actually lies in another (e.g., confusing issues of logical form with issues of speaker intent).

  **Methodology and Justification**
  The methodology consists of a systematic case-study analysis designed to isolate instances where standard diagnostics yield conflicting verdicts. The project proceeds in three stages. First, I will compile a dataset of paradigmatic examples currently accepted as either purely semantic or purely conversational implicatures. Second, I will rigorously apply each of the four main diagnostics to these examples independently, noting specifically where they diverge. Third, I will construct novel counter-examples designed specifically to maximize diagnostic divergence, testing robustness across different linguistic domains (conditionals, quantifiers, attitude reports).

  This approach is superior to purely exegetical reconstruction because the literature has reached an impasse regarding Grice’s original intent; textual fidelity cannot resolve empirical ambiguities in language use. Similarly, this method is preferable to a formal implementation of either side of the scalar implicature debate. Formal models (such as game-theoretic or optimality theoretic frameworks) typically presuppose the architecture they seek to test, hard-coding when calculation occurs relative to composition. By treating the diagnostics themselves as the primary data, this project avoids begging the question against the Contextualist or Minimalist. Instead of implementing a theory, I am testing the tools used to build the theories.

  **Expected Outcomes and Feasibility**
  A successful result will be a revised taxonomy of meaning components. For example, if cancellability tracks defeasibility of commitment while embeddability tracks compositional integration, I will propose replacing the binary “said/implicated” model with a multidimensional space. This would dissolve current stalemates by showing that arguments talk past one another—one side citing embeddability data, the other citing calculability data, yet measuring different properties.

  Conversely, the project will be considered a failure if the diagnostics continue to correlate nearly perfectly across diverse datasets, confirming the utility of the current unitary boundary despite theoretical objections. Alternatively, if the diagnostics prove too ambiguous to apply consistently outside of idealized contexts, the project will pivot to establishing operational definitions, which still yields value by clarifying the theoretical toolkit.

  The scope is realistic for a two-year fellowship. Year One will focus on data collection, preliminary analysis, and presenting initial findings at major conferences (e.g., GLOW, Sinn und Bedeutung). Year Two will involve refining the taxonomy based on feedback, drafting articles for peer-reviewed journals, and preparing a monograph manuscript. By decoupling the diagnostics, this project does not require resolving the broader metaphysical debate between semantics and pragmatics immediately, but rather provides the necessary conceptual scaffolding to make that debate tractable.
