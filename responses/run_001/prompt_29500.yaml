      *   **Goal:** Determine if Leibniz would treat the simulation hypothesis as a rival explanation or a compatible lower-level claim, and what commitments bear on it.
      *   **Constraints:**
          *   Must not be answered by reciting usual caricatures (e.g., "all is pain" Candide style).
