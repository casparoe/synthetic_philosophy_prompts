  ### 1. Formal Setup

  Consider an agent who assigns credences to the proposition that a three-toss coin sequence yields exactly $k$ heads, for $k \in \{0, 1, 2, 3\}$. Let $\Omega = \{0, 1, 2, 3\}$ denote the partition of possible outcomes. Before receiving new evidence, the agent adopts a probabilistic prior $Q$, modeling the coin as fair. Under the assumption of independence, $Q$ follows the Binomial distribution $B(3, 0.5)$, assigning credences $Q = (1/8, 3/8, 3/8, 1/8)$ to outcomes $0, 1, 2, 3$ respectively. This prior entails an expected number of heads of $E_Q[H] = 1.5$.

  The agent subsequently receives reliable evidence $E$ indicating that the coin is biased such that the expected number of heads is exactly 2 ($E_P[H] = 2$). Formally, let $\Delta(\Omega)$ be the simplex of valid probability functions. The evidence restricts the admissible credence functions to the subspace $K = \{c \in \Delta(\Omega) \mid \sum_{k=0}^3 k \cdot c(k) = 2\}$. Since $K$ contains infinitely many probability functions, the evidence alone does not dictate a unique credence. To select the rational credence, the agent aims to minimize expected inaccuracy relative to their prior epistemic position (treating $Q$ as the ground truth for the purpose of evaluation). Specifically, the agent seeks $c^* \in K$ that minimizes the distance from $Q$ defined by a strictly proper scoring rule.

  ### 2. The Brier-score recommendation

  The Brier score measures inaccuracy as the squared Euclidean distance between credences and reality. To maximize expected Brier accuracy, the agent must minimize the Euclidean distance $\|c - Q\|^2$ subject to the constraints defining $K$. Geometrically, this corresponds to orthogonally projecting the prior $Q$ onto the plane defined by the linear expectation constraint. The solution takes the form of an affine adjustment: $c(k) = Q(k) + \alpha(k - 1.5)$, provided all $c(k)$ remain non-negative. However, achieving the required mean shift from 1.5 to 2.0 demands a steep slope. Calculations show that to satisfy the mean constraint while remaining in the interior of the simplex, the linear adjustment would force $c(0)$ into negative territory. Consequently, the Brier-optimal projection hits the boundary of the domain. The resulting distribution zeros out the impossible tails to concentrate probability mass where the constraint can be satisfied most cheaply. The Brier-recommended distribution is $c_{Brier} = (0, 0.3, 0.4, 0.3)$. Crucially, this distribution asserts that obtaining 0 heads is strictly impossible ($c(0)=0$), despite the prior deeming it possible ($Q(0)=0.125$).

  ### 3. The log-score recommendation

  The Log score measures inaccuracy via Shannon Information (cross-entropy). Maximizing expected Log accuracy relative to $Q$ is equivalent to minimizing the Kullback-Leibler divergence, $D_{KL}(c \| Q)$. The optimization problem seeks $c \in K$ minimizing $\sum_k c(k) \ln(c(k)/Q(k))$. Unlike the Euclidean case, the solution to this minimization is an exponential family distribution. The optimal credence function takes the form $c(k) \propto Q(k)e^{\beta k}$ for some Lagrange multiplier $\beta$ determined by the mean constraint. Because $Q(k) > 0$ for all $k$, and the exponential function is never zero, the Log-score recommendation preserves support on all outcomes: $c_{Log}(k) > 0$ for all $k \in \{0, 1, 2, 3\}$. Solving for the specific multiplier required to fix the mean at 2 yields a distribution roughly approximating $c_{Log} \approx (0.04, 0.24, 0.39, 0.33)$. While $c_{Log}$ reduces the credence in 0 heads significantly compared to $Q$, it maintains a distinct, non-zero probability (approx. 4%). Thus, while the Brier score recommends absolute certainty regarding the impossibility of 0 heads, the Log score recommends retaining substantial tentativeness.

  ### 4. Diagnosis

  The divergence stems from how the two scoring rules penalize deviations from the prior. The Brier score employs a quadratic penalty, treating distance locally linearly in the context of projections; this aggressively zeroes out low-probability "tails" to minimize error cost when shifting the mean. The Log score employs a logarithmic penalty, which asymptotically approaches infinity as credence approaches zero. This creates a strong "repulsive force" against eliminating possibilities that had non-zero prior probability. If the evidence had uniquely determined the probability function (e.g., if the agent knew the exact bias and independence structure), the constraint set $K$ would contain only a single element $c^*$. In that case, both scoring rules would recommend $c^*$, and the divergence would disappear. The conflict arises specifically because the evidence is partial, forcing the agent to trade off competing desiderata of faithfulness to the prior versus fidelity to the new evidence.

  ### 5. What an accuracy-first epistemologist should do

  To avoid scoring-rule relativism, the accuracy-first epistemologist faces three main options: reject the scoring rule agnosticism, justify a specific rule on non-pragmatic grounds, or accept relativity as benign. The most defensible line is to argue that the Log score reflects the correct measure of *epistemic* accuracy because its divergence property better captures the value of preserving genuine possibilities against false certainties; this aligns with the intuition that ruling out evidence-sufficient possibilities solely to minimize variance is dogmatic rather than accurate. By prioritizing the preservation of open possibilities (avoiding "dogmatism"), the Log score emerges as the superior metric for credence states under partial information. The main vulnerability of this line is its reliance on a substantive philosophical claim about the nature of possibility (that 0% credence is intrinsically worse than 1% credence in contexts of incomplete data) which arguably smuggles in modal metaphysics rather than deriving strictly from the accuracy-first framework itself.
