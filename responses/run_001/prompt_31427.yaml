answer: |-
  You are right to feel like you are building without a blueprint. Population ethics is currently the closest thing philosophy has to a "pre-paradigmatic science": everyone agrees on the anomalies (the Repugnant Conclusion, the Sadistic Conclusion, the Asymmetry), but there is no consensus on the foundational architecture.

  To evaluate any new theory, you need a checklist. Below is the "Blueprint" of Population Axiology. It organizes the desiderata into **Structural**, **Substantive**, and **Scope** constraints, followed by the Impossibility Theorem that binds them, the Silent Sacrifice, and the Underrated Constraint.

  ---

  ### Part 1: The Blueprint (Core Desiderata)

  Any theory \( T \) that ranks possible populations must satisfy (or explicitly reject) the following.

  #### I. Structural Rationality (The Logic of Ranking)
  These ensure the theory is functioning as a coherent decision tool.

  1.  **Transitivity**
      *   **Condition:** If Population A is better than B, and B is better than C, then A must be better than C.
      *   **Motivation:** Without this, your theory generates cycles (A > B > C > A), making rational choice impossible.
      *   **The Trap:** Some theories (like certain forms of variable critical-level utilitarianism) struggle to maintain full transitivity when population sizes vary wildly.

  2.  **Anonymity (Impartiality)**
      *   **Condition:** Only the *set* of welfare levels matters, not *who* holds them. Permuting welfare between individuals does not change the population's value.
      *   **Motivation:** Rejects speciesism and individual bias. If two worlds have the same distribution of happiness, they are equally valuable regardless of names on birth certificates.
      *   **Note:** This is almost universally accepted. Violating this is considered "person-affecting bias."

  3.  **Completeness**
      *   **Condition:** For any two populations A and B, either A is better than B, B is better than A, or they are equal.
      *   **Motivation:** We expect morality to be decisive.
      *   **The Loophole:** Many modern thinkers (e.g., Broome, Parfit late-career) secretly prefer to drop this to allow for **Incomparability**.

  #### II. Dominance and Aggregation (The Math of Goodness)
  These determine how welfare is summed and compared.

  4.  **Strong Pareto (Dominance)**
      *   **Condition:** If everyone in Population A has higher welfare than their counterpart in Population B, and at least one person is strictly better off, then A is better than B.
      *   **Motivation:** If nobody loses and someone gains, surely the state of affairs improved.
      *   **Status:** Almost universally held sacred. Violating this is usually seen as fatal to a theory.

  5.  **Weak Pareto**
      *   **Condition:** Similar to Strong Pareto, but applied when *everyone* is better off.
      *   **Motivation:** Less demanding than Strong Pareto.

  6.  **Mere Addition (Neutral Addition)**
      *   **Condition:** Adding a person with positive welfare to a population, without affecting the original members' welfare, cannot make the population worse.
      *   **Motivation:** If adding a happy human doesn't hurt anyone else, why would it be a bad thing? This is the engine that drives the **Repugnant Conclusion**.
      *   **Formal:** \( W(A + z) \geq W(A) \) where \( z \) has positive utility.

  7.  **Continuity**
      *   **Condition:** There is no "cliff edge" in value. For any populations A and B, if B is better than A, there exists a tiny variation in B (e.g., changing one person's welfare by a microscopic amount) that preserves the "better than" relationship.
      *   **Motivation:** Prevents lexical thresholds where one person's suffering outweighs millions of happy lives instantly.
      *   **The Trap:** Avoiding the Repugnant Conclusion often requires introducing a "lexical gap" or discontinuity at the point of "barely worth living."

  #### III. The Ethical Verdicts (Intuitions to Protect)
  These are the intuitive tests the theory must pass to be taken seriously.

  8.  **Anti-Repugnance (The RC Constraint)**
      *   **Verdict:** A population \( Z \) of billions with lives barely worth living is **not** better than a population \( A \) of fewer people with very high quality of life.
      *   **Motivation:** Intuitively, quantity of suffering-less existence should not trump quality of life indefinitely.

  9.  **Negative Asymmetry (The Creation Asymmetry)**
      *   **Verdict:** Bringing a person into existence with a life *full of suffering* (net negative) is morally bad (pro tanto). However, *not* bringing a person into existence with a life of *potential happiness* (net positive) is **not** morally bad (neutral).
      *   **Motivation:** We feel responsible for preventing misery in existing potential children, but we don't feel guilty for failing to conceive happy children. (Associated with Benatar’s Antinatalism, but widely held in population ethics).

  10. **The Sadistic Conclusion Avoidance**
      *   **Verdict:** We should not prefer adding a population of miserable lives to raising the welfare of the existing population, just because the miserable people don't exist in the alternative.
      *   **Motivation:** Some average theories suggest it's better to add suffering to dilute the average than to keep the average high with fewer people. This violates deep intuitions about the value of positive welfare.

  ---

  ### Part 2: The Wall (Impossibility Results)

  You cannot build a perfect house on this site. Gustaf Arrhenius demonstrated that a specific combination of these desiderata is mathematically inconsistent. This is the "Arrhenius Impossibility Theorem."

  **The Impossible Quadrilateral:**
  You generally cannot simultaneously satisfy:
  1.  **Dominance/Pareto** (If everyone is better off, it's better).
  2.  **Weak Superiority** (Some variations of Pareto).
  3.  **Egalitarianism** (Prefer equality given total sums).
  4.  **Non-Elitism** (Avoiding the conclusion that only a few elites matter).

  However, the most famous conflict is regarding the **Repugnant Conclusion.**

  **The Conflict Set (Commonly cited):**
  1.  **Transitivity:** Preferences are consistent.
  2.  **Total Principle:** More total welfare is better (or satisfies Mere Addition).
  3.  **Avoid Repugnance:** Z is worse than A.
  4.  **Continuity:** Small changes in quality/quantity lead to small changes in value.

  **Why it matters:**
  To avoid the RC while maintaining Transitivity and Continuity, you usually have to violate the **Mere Addition** principle. You must accept that adding happy people to a flourishing population can sometimes make the total state of affairs *worse*. This feels unintuitive.

  Conversely, to keep **Mere Addition** and **Dominance**, you must accept the RC (Total Utilitarianism) or the **Sadistic Conclusion** (some Average Utilitarian variants).

  **Conclusion:** No single theory avoids all three paradoxes (RC, Sadistic, Asymmetry) while maintaining all formal rationality constraints. Every theory picks its poison.

  ---

  ### Part 3: The Secret Sacrifice

  > **Question:** Which desideratum is the one that most people are secretly willing to give up but don't want to admit it?

  **Answer: The Principle of Mere Addition.**

  **Why?**
  Almost every theorist hates the Repugnant Conclusion. It is the "dealbreaker." To kill the RC, you must stop treating the addition of a happy life as neutral or positive in all contexts.
  However, **Mere Addition** is so intuitively obvious ("Adding a happy person hurts no one, so it's not bad!") that admitting you reject it requires heavy theoretical lifting.

  *   **Who admits it?** Critically-Level Utilitarians (e.g., Blackorby et al.) openly argue that adding lives below a critical level lowers value.
  *   **Who hides it?** Many critics of Total Utilitarianism imply rejection of Mere Addition through "lexical priority" arguments (that high-quality lives are infinitely better than low-quality ones) but refuse to formalize the mechanism, effectively pretending Mere Addition only applies within narrow bands.
  *   **The Admission:** To escape the Repugnant Conclusion, you essentially have to agree that **there are circumstances where creating a happy new person makes the world objectively worse.** (e.g., if it dilutes resources or disrupts the ecosystem to a degree, or purely theoretically if it lowers the aggregate value metric). Philosophers hate saying this out loud because it clashes with pro-natalist instincts, but mathematically, it is the necessary tax for anti-RC views.

  ---

  ### Part 4: The Underrated Constraint

  > **Question:** If you had to pick the single most underrated constraint — one that doesn't get enough airtime in the literature — what would it be?

  **Answer: The Constraint of Epistemic Robustness (under Existential Risk).**

  **Explanation:**
  Population axiology assumes we are comparing static snapshots of populations (World A vs. World B). But the real question is about **policy choices under uncertainty** involving existential risk.

  1.  **The Flaw:** Most theories optimize for a completed future state. "Is the 100-billion happy population better than the 1-million ecstatic population?" Yes, probably (depending on the theory).
  2.  **The Reality:** To achieve the 100-billion population, we likely need technology that carries a risk of extinction (AI, nanotech, geo-engineering).
  3.  **The Constraint:** An adequate theory must integrate **Probability of Survival**.
      *   If Theory X says "Add billions" but doing so raises the risk of total extinction by 0.1%, Theory X becomes morally catastrophic.
      *   Current theories rarely weigh the *probability of the population continuing* against the *value of the population*.
      *   **Example:** Total Utilitarianism suggests we should maximize total welfare, which implies maximizing population. But maximizing population often increases the complexity and fragility of systems required to sustain it, thereby increasing extinction risk. If the extinction probability hits 1%, Expected Value drops to zero regardless of the hypothetical total utility.

  **Why it's underrated:**
  Philosophers love discussing the "repugnance" of a large population vs. a small one. They ignore that **no population exists if the system collapses.** A theory that recommends policies leading to near-certainty of collapse fails on its own axioms, yet this is rarely modeled in formal equations. We need **Risk-Sensitive Population Axiology** that penalizes strategies requiring fragile super-growth.

  ---

  ### Summary Checklist for Your Reading

  When you read your next paper, run it through this filter:

  1.  **Does it violate Mere Addition?** (If yes, it saves you from RC but implies creating happy lives can be bad).
  2.  **Does it violate Continuity?** (If yes, it uses a "Lexical Threshold," creating a cliff-edge in value).
  3.  **How does it handle the Asymmetry?** (Does it treat creating suffering as different from failing to create happiness?)
  4.  **What happens at the "Zero Line"?** (How does it distinguish a life worth living from one not worth living? This definition dictates the whole theory).
  5.  **Does it account for extinction risk?** (If it tells you to expand the population without modeling survival probabilities, flag it as naive).

  If a paper claims to solve everything without violating at least one major constraint, put it down. It hasn't read Arrhenius.
