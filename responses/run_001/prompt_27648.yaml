answer: |-
  **1. Candidate principles**

  **Principle 1: Weighted Claims with Qualitative Constraints.**
  Each individual holds a moral claim against harmful outcomes. The strength of a claim scales with the severity of the harm (death > limb loss) and certainty (certain > probable). Crucially, probabilistic harms cannot be summed across persons to outweigh a certain harm to one (non-aggregation of risk). Special relationships (family, promises) multiply an individual’s claim weight sufficiently to override numerical majorities. Furthermore, the moral force of numerical advantage exhibits diminishing returns as the ratio approaches parity (100 vs. 99 is weaker than 5 vs. 1). 
  *Motivation:* Captures C1–C8 perfectly. Explains why we save the five (C1) but not the legs over death (C4), why we prioritize the child (C8) or promisee (C7), and why certainty trumps probability (C2).
  *Struggle:* It is ad hoc. It posits a mathematical function of "claim strength" that resists precise calculation. It struggles to explain *why* risks cannot aggregate while certainties can (the metaphysical basis of the constraint is unclear).

  **Principle 2: Expected Value Maximization (EVM).**
  One ought to maximize the expected number of lives preserved. This requires aggregating risks across persons: saving five people each facing a 20% chance is morally equivalent to saving one facing 100% death. Partiality (daughter) or past commitments (promises) count only insofar as they affect future well-being or system-wide rules, not as independent moral weights.
  *Motivation:* Provides clear, consistent guidance for C1, C3, and C5. Aligns with standard economic rationality and impartial beneficence.
  *Struggle:* Directly contradicts C2 (where EVM suggests indifference), C4 (leg loss vs. death weighting), C7 (promise), and C8 (family partiality). It implies you should flip a coin in C2, violating your intuition that saving the doomed person is right.

  **2. Testing the principles**

  **Principles Applied to C1–C8:**
  *Principle 1 (Claims):* Supports your existing verdicts for all eight cases without modification. It validates C1 (5 claims > 1), C2 (1 certain claim > 5 uncertain), C3 (weak advantage due to proximity), C4 (quality threshold), C5 (repetition doesn’t negate individual duty), C6 (responsibility reduces but doesn’t erase the one’s claim), C7 (promise increases claim weight), and C8 (relationship multiplies claim).
  *Principle 2 (EVM):* Validates C1, C3, and C5. However, it demands reversing C2 (treat risks as additive, implying indifference or a toss-up), C7 (break promise if 5 lives saved later), and C8 (save strangers to maximize total survival). It supports C4 only if "death" carries infinite negative utility compared to "limb," which requires arbitrary scaling.

  **Principles Applied to C9–C11:**
  *Case 9 (Child vs. Five Elderly):* **Principle 1** favors the child. A child’s claim involves a larger potential lifetime and innocence, increasing claim weight significantly enough to potentially override the five elderly, though close calls depend on exact health status. **Principle 2** favors the child strictly by "life-years" expectation, or is indifferent by "lives saved." Your own verdict leans toward the child here.
  *Case 10 (1 Certain vs. 2 Probable):* **Principle 1** sides with the one certain person, matching your C2 intuition. Risks do not sum. **Principle 2** sees 1 × 100% = 2 × 50%. It demands indifference; choosing either maximizes expected value equally.
  *Case 11 (Repeated Rule):* **Principle 1** creates tension. If you announce a rule "save the many," you optimize overall survival but betray C2’s logic regarding individual rights. If you adopt "save the certain/deserving," the rule fails. This case pressures Principle 1 to admit that *systemic* consistency overrides *act-specific* claims. **Principle 2** has no tension: always save the five. The rule matches the act.

  **3. What has to give**

  Principle 2 (EVM) requires abandoning four of your strongest intuitions (C2, C4, C7, C8). Given the depth of commitment to promises and family (C7, C8), EVM seems descriptively false to our actual moral landscape, even if analytically clean. Principle 1 accommodates all your verdicts but does so by stacking distinct exceptions (no risk aggregation, quality thresholds, relationship multipliers). 

  The deepest friction lies between C1 and C2. You accept aggregating *certainties* (5 deaths outweigh 1) but reject aggregating *probabilities* (5×20% equals 1×100%). To maintain Principle 1 without becoming arbitrary, you must justify why a person has a stronger claim against a certain threat than a statistical one. If you revise any verdict, **Case 2** is the most vulnerable. Why does the identity of the victim matter? If the goal is minimizing suffering/death, the source of the risk (certainty vs. probability) shouldn’t alter the arithmetic. However, preserving C2 honors Taurek’s insight: individuals are separate, and we may not impose probabilistic risks on the few to guarantee relief for the many. 

  I suggest revising neither verdict but acknowledging that Principle 1 relies on a "Rights-Anti-Aggregation" axiom. This is philosophically heavy but saves your coherence. You must accept that "lives saved" is not the only metric; "security of claim" matters too. Regarding C3, the diminishing confidence is acceptable; moral urgency plateaus when both sides are large, suggesting fairness (coin flip) becomes a tiebreaker near equality.

  **4. Overall assessment**

  The **Weighted Claims Principle** does the best job capturing your moral phenomenology. While EVM offers greater simplicity, its insistence on treating children, promise-breakers, and probabilistic victims as mathematically fungible ignores fundamental distinctions we make in lived ethics. The "claims" framework respects the separateness of persons (addressing Taurek) while allowing for majority salvation when stakes are high and symmetrical.

  The deepest unresolved issue remains the nature of **risk**. If I save the five in C1, I am making a judgment about quantity. If I refuse to save them in C2, I am protecting the integrity of the individual from statistical sacrifice. The conflict is not in the math, but in whether morality is fundamentally about *outcomes* (dead bodies) or *relationships* (treatments owed to agents). Your intuitions prioritize the latter, even when it conflicts with the former. A fully principled theory must eventually explain why certainty triggers aggregation while probability does not—perhaps because probability leaves open the possibility of rescue for all, whereas certainty demands immediate exclusion.
