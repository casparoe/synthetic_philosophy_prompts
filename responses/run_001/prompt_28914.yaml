      *   *Constraint:* 2-minute reply length. Needs to be punchy, academic but accessible.
      *   *Requirement:* Identify who asks, give the reply, admit soft spots.
      *   *Strategy:* Don't over-defend. Acknowledge the intuition, pivot to why their alternative fails worse. Use the "ecologist" identity wisely (don't pretend to be a Parfit scholar, but use the discipline's rigor).

