      *   Person-Affecting Intuition (PAI) - We can't harm/compete with non-existents.
      *   Non-Identity Problem (NIP) - How does policy choice matter if future people wouldn't exist otherwise?
      *   Ecological/Environmental Constraint - Carrying capacity makes "more lives" impossible or bad *in practice*, rendering the principle moot or dangerous.
      *   Rights/Kantian Objection - Treating people as means/endless aggregation violates dignity.
      *   Distributional Justice - A world with many barely-happy poor people might be better than fewer flourishing ones (inequality issues).
