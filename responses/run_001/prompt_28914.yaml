      *   *Key Weakness:* The transition from "lives are good for the person" to "adding that life adds net value to the world" is exactly where the Non-Identity Problem and Person-Affecting views attack. Also, the environmental objection isn't just contingent; they'll argue it's fundamental to the possibility of those lives being *good*.

  3.  **Brainstorming Objections (The Landscape):**
