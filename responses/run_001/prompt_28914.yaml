      *   5. *The Non-Identity Problem:* Often confused with PAI, but distinct. Does a policy harming environment affect rights of specific future people? (Damage: Medium).
      *   6. *The Asymmetry Intuition:* Why is there a duty not to create unhappy people but no duty to create happy ones? This attacks the "weak pronatalism." (Damage: Medium).
      *   7. *Quality of Life Variance:* Is a life "worth living" binary or scalar? The user assumes binary. The audience knows it's scalar. (Damage: Low-Medium).
      *   8. *Aggregation/Measurement:* Grad students love asking how we measure/welfare. (Damage: Low).

      *Refining Order:* I need to put the heavy hitters first. RC is #1. PAI is #2. Environmental is #3 because it leverages the user's own history against them. Asymmetry is #4. Kantian is #5. NIP is #6 (closely related to PAI). Aggregation is #7. The Prayed-For Question goes last.

