  Here is a breakdown of those claims sorted into tiers based on how resilient they are to the "just-so story" critique. The criteria for **Tier S** are claims where the prediction was specific/risky and the data involves hard outcomes or strict experimental dissociations; **Tier A** claims have strong patterns but face some competing non-adaptive explanations; **Tier B** claims have plausible stories but rely heavily on self-report or show significant cultural variability that weakens the universal adaptation claim.

  ### **Tier S: The "Rock Solid" Evidence**
  *(These make risky predictions that are difficult to explain without an evolutionary mechanism.)*

  *   **The Cinderella effect:** Children living with stepparents are at substantially higher risk of abuse or homicide than children living with both biological parents.
      > This lands in S because it predicts a specific, counter-intuitive correlation between genetic distance and violence that persists even when controlling for socioeconomic status and household chaos, ruling out simple environmental stress as the sole cause.
  *   **The cheater-detection claim:** People are much better at Wason selection tasks when they're framed as social-contract/cheating problems than when framed abstractly.
      > This lands in S because it isolates a cognitive dissociation—logical ability improving specifically with social context—which serves as a functional signature of a specialized mental mechanism rather than general intelligence or learning.

  ### **Tier A: Strong Adaptive Logic**
  *(These have robust data and clear functional predictions, but allow for more theoretical debate or byproduct explanations.)*

  *   **The grandmother hypothesis:** Menopause is an adaptation for stopping direct reproduction in order to invest in grandchildren.
      > This lands in A because demographic models and forager data consistently show increased grandchild survival linked to maternal help, though it relies on population-level data rather than individual experimentation.
  *   **Pregnancy sickness as adaptation:** Morning sickness is a defense that keeps women from ingesting teratogenic foods during the first trimester.
      > This lands in A because epidemiological studies show a clear correlation where mild nausea predicts lower miscarriage rates, matching the timing of fetal vulnerability, but critics still argue it could be a byproduct of immune activation.
  *   **Note:** You might notice Cheater Detection moved above here or stays here depending on your view of "modules," but since the *task itself* (the data) is so reproducibly distinct, S is justified. *Correction based on rigor:* If we want to be extremely critical about the "module" story, Cheater moves to A and Grandmother/Sickness stay A. However, given you need ammo for the argument, keeping Cheater in S highlights the *predictive success* of the hypothesis. I have placed it in S in the list above because the prediction of the performance gap was made *a priori*.

  ### **Tier B: Plausible but Less Falsifiable**
  *(These have popular support, but the data is sensitive to methodology, culture, or alternative explanations.)*

  *   **The jealousy sex-difference claim:** Men are more upset by sexual infidelity and women by emotional infidelity because of different selection pressures.
      > This lands in B because the sex difference often disappears or shrinks significantly when you change from forced-choice questions to rating scales, suggesting it may be influenced by reporting biases rather than hardwired circuitry.
  *   **The waist-to-hip ratio claim:** Men across cultures prefer a female waist-to-hip ratio around 0.7 because it's a reliable cue of fertility and health.
      > This lands in B because significant cross-cultural deviations exist (particularly where BMI signals status more than fat distribution), weakening the case for a strict, universal evolved preference.

  ***

  **Quick tip for your friend:** The strongest shield against the "just-so story" charge isn't just that the story sounds plausible; it's that the hypothesis makes a prediction that went wrong for everyone else but right for the evolutionary model (like the **Cinderella effect**, which predicts *more* danger, not less, for stepchildren).
