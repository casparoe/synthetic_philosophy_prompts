answer: |-
  **The argument's strongest link**
  The most resistant step is the transition from Premise 3 to Premise 5, which asserts that any non-trivial impartial duty inevitably inherits the structural logic of unconstrained sacrifice. This move is formidable because it attacks the very foundation of the "moderate" middle ground that many critics of consequentialism occupy. By framing the alternative to maximization as merely an "artificial cap," the argument forces the opponent to defend why their limits are morally significant rather than merely pragmatic or intuitive. If you agree with Premises 1 and 4—that global need is vast and individual impact is marginal—then asserting a hard boundary on beneficence feels mathematically inconsistent unless one concedes that the "good" we are promoting is fundamentally limited by the nature of the agent, not just the arithmetic of outcomes. This forces a stark choice: admit that your theory arbitrarily restricts helping others, or admit it is just as demanding as act-consequentialism.

  **Candidate breaking points**
  The first vulnerability lies in Premise 3’s claim that non-consequentialist theories can only set "artificial" limits. This presupposes that moral value is solely fungible and additive; however, deontological and contractualist views often posit that duties have internal structures—such as thresholds of harm violation or specific agent-relative obligations—that function as principled boundaries rather than arbitrary caps. For instance, a right-based theory limits beneficence not because it arbitrarily says "stop giving here," but because it recognizes that agents possess claims against being used as mere resources. If the limit stems from the inviolability of persons rather than a desire for personal comfort, the objection that the limit is merely "trivializing" loses its force.

  The second weak link is the inference in Premise 5 that the *experience* of demandingness is identical across these theories. Even if the dollar amount given is similar, the moral psychology differs because consequentialism treats every action as a maximization problem requiring constant recalibration, whereas non-consequentialist theories typically delineate a fixed duty after which further action becomes supererogatory. If morality distinguishes between what is required and what is praiseworthy, then the "demandingness objection" misfires against a theory that respects this boundary. The objection targets the *structure of obligation* (endless optimization) rather than just the *volume of aid*, yet Premise 5 collapses this distinction by assuming volume alone determines the objection's validity.

  **What each fix costs**
  If you reject Premise 3 to preserve the idea that non-consequentialist limits are principled, you must embrace a robust form of agent-relativity or partiality. This commits you to explaining why "my life plans" or "my integrity" matter intrinsically, independent of the global outcome. The philosophical price is high, as you open yourself to the criticism that you are privileging the self in ways that pure impartiality cannot easily tolerate. You essentially have to argue that the moral landscape includes distinct regions where the "good" stops being calculated globally, a move that utilitarians will likely characterize as moral tribalism disguised as principle.

  Alternatively, if you accept the argument and concede that the demandingness objection generalizes to any theory with serious global duties, you must abandon the hope of finding a "sweet spot" between egoism and saintliness. This commits you to either accepting that all credible morality is profoundly sacrificial (effectively agreeing with the effective altruist conclusion) or accepting that our intuitive belief in "supererogatory acts" is an illusion we must discard. If you take this route, the specific critique of consequentialism vanishes; the debate shifts from "Is consequentialism too demanding?" to "Why should anyone be bound by impartial duty at all?" effectively collapsing the distinction between moderate and extreme ethics.

  **Your overall diagnosis**
  The argument goes wrong at Premise 3 because it falsely equates a *threshold* duty with an *arbitrary cap*. In non-consequentialist frameworks, the limit on beneficence is often tied to the completion of a specific duty (e.g., rescuing the next drowning person, or ensuring justice is served) rather than the point where personal welfare intersects with impersonal utility. By rejecting Premise 3, we maintain that while global poverty creates genuine obligations, those obligations are satisfied once certain relational or justice-based requirements are met, leaving room for personal projects without treating them as moral failures. Consequently, the demandingness objection retains its specific bite against consequentialism (which has no satisfying condition beyond the aggregate), while remaining distinct from the more tractable duties found in moderate deontology.
