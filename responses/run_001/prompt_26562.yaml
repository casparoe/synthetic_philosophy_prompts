answer: |-
  # Seminar Q&A Prep Sheet: Selective Realism & The PMI

  **Presentation Context:** Argument for a refined Selective Realism (SR) requiring *indispensability to novel prediction* + *cross-theoretic robustness*.
  **Audience Profile:** 15 regulars (Anti-realists, Structural Realists, Entity Realists, Students, Bio-Philosopher).

  ---

  ## Part 1: Top 8 Objections (Ordered by Force/Likelihood)

  ### 1. The "Post Hoc" Methodology Charge (Anti-Realist/Laudanian)
  **Phrased:** *"You define 'success' and 'robustness' precisely to ensure your realist hypothesis wins. Isn't this just moving the goalposts? If you had to look through all those abandoned posits first to find ones that fit your criteria, isn't your criterion merely a retrospective classification tool rather than a predictive guide for future science?"*
  **Reply (2 min):** That’s the classic charge of ad-hocery. My response is twofold. First, the criteria of *novel prediction* and *robustness* weren't invented yesterday; they track what successful theorists actually claim distinguishes their core commitments from auxiliary assumptions (e.g., Maxwell speaking of lines of flux vs. ether). Second, a theory of scientific progress isn't required to predict the future to be true *about* the past. We are analyzing the logic of confirmation retrospectively. If the criterion isolates the working parts that survived, it functions as a valid explanatory framework even if its predictive power for theory selection is limited. The alternative is assuming all past success was accidental, which violates the basic scientific norm of learning from error.
  **Where it’s weakest:** It does struggle to explain why scientists themselves often misidentify these posits (e.g., believing in the luminiferous ether while doing good math).

  ### 2. The Structural Continuity Challenge (Structural Realist)
  **Phrased:** *"You're fighting a losing battle on posits. What survives theory change isn't specific entities like 'caloric fluid' or 'ether,' but the mathematical structure relating observables. Why burden realism with ontology when structure alone carries the empirical weight? By restricting to posits, you concede too much to the anti-realist."*
  **Reply (2 min):** I respect the parsimony of Structural Realism, but structure requires *something* to instantiate it. A purely structural claim ("There exist relations R") vacuously implies the existence of relata without explaining what kind of thing they are. More importantly, cross-theoretic robustness checks usually rely on manipulating specific *entities*, not just equations. When we move from caloric to kinetic, we don't just keep the formula; we identify a causal mechanism (colliding molecules) that sustains the predictive relationship. Without positing the mechanism, the structure hangs in the air. We need the "what" to ground the "how."
  **Where it’s weakest:** In cases where the mathematical form changes significantly (discontinuous structure), arguing for ontological continuity becomes harder than arguing for functional similarity.

  ### 3. The "Physics Bias" Problem (Philosopher of Biology)
  **Phrased:** *"Your whole argument rests on 19th-century physics. In molecular biology, theoretical posits are often functional roles or clusters, not fundamental entities. Take the gene: a 'posits' framework struggles here. How does 'robustness' work in evolutionary modeling where there are no universal laws to check against?"*
  **Reply (2 min):** That’s a crucial test case. In biology, 'robustness' shifts from law-like preservation to mechanistic persistence across contexts. For instance, the 'gene' concept survived not as a physical particle but as a functional unit of inheritance robustly identified across different experimental setups (Mendelian breeding vs. molecular mapping). My criterion adapts: indispensability means the entity is necessary to explain a novel phenotype; robustness means it persists across modeling frameworks despite lack of strict laws. The debate isn't about laws, it's about whether our best explanations commit us to something real, even in non-fundamental sciences.
  **Where it’s weakest:** It risks sounding defensive against the diversity of biology, potentially oversimplifying biological modeling practices compared to the clean transitions in optics/thermodynamics.

  ### 4. The Entity Realist Manipulation Standard (Hacking–Cartwright)
  **Phrased:** *"You set the bar absurdly high. I can prove electrons exist because I use them to coat semiconductors. Why do I need a 'robustness check' across theoretical transitions? If I can manipulate X to produce Y, X is real. Your condition makes realism unnecessarily cautious."*
  **Reply (2 min):** I agree manipulation is powerful evidence, but it’s not immune to PMI errors. You could manipulate a 'quasi-entity' within a false model (like manipulating heat flow in the caloric sense before kinetic theory). My robustness requirement ensures the manipulation targets the underlying mechanism, not just an effective phenomenological placeholder. If the theory vanishes but the manipulation works, we might still be using a useful fiction until the robustness check confirms the ontological basis has shifted correctly. It protects realism from becoming merely instrumentalism with a heavy hand.
  **Where it’s weakest:** It undercuts the epistemic immediacy of Hacking’s "If you can spray it, then it exists" pragmatism, which many find intuitively superior.

  ### 5. The Specific History Trap (Agostic/Student: Phlogiston/Oxygen)
  **Phrased:** *"Okay, but take Phlogiston. It predicted combustion mass loss (before Lavoisier corrected oxygen uptake). Wasn't phlogiston indispensable to early chemical novelty? If so, did it survive? If not, where does it break down?"*
  **Reply (2 min):** Phlogiston is the boundary case. It was indispensable for organizing data *within* the Stahl framework, but it failed the cross-theoretic robustness check when quantitative precision increased. Crucially, phlogiston wasn't indispensable for *novel* predictions in the long run; it was only retrodictively adjusted. Once the oxygen transition occurred, phlogiston offered no new successful predictions that oxygen couldn't handle better. Therefore, by my definition, it never cleared the bar for robust realist commitment—it was a placeholder for oxidation, not a distinct entity that survived intact.
  **Where it’s weakest:** Some historians argue Lavoisier initially kept phlogiston-like concepts; distinguishing the exact moment of abandonment can feel arbitrary in retrospect.

  ### 6. The Specific History Trap (Agostic/Student: Caloric/Kinetic)
  **Phrased:** *"What about Caloric? Carnot’s theorems worked perfectly for engines, yet Caloric was discarded. Didn't his success constitute novel predictive work? Does your criterion imply Carnot was wrong about heat?"*
  **Reply (2 min):** Carnot’s results were correct, but his *posit* (heat fluid) was not. The mathematical structure survived (entropy), but the ontological posit (fluid particles) did not pass the robustness check against the kinetic evidence regarding gas diffusion and Brownian motion. Under my view, we are realists about the *relations* Carnot found, but we withdraw realist commitment from the 'fluido.' This shows SR isn't dogmatic; it allows partial retention of structure without retaining obsolete objects.
  **Where it’s weakest:** It requires drawing a sharp line between the math (real) and the object (not), which critics say is exactly where the trouble begins (reverting to Structural Realism anyway).

  ### 7. The Ambiguity of "Robustness" (Structural/Analytic Critique)
  **Phrased:** *"You rely heavily on 'cross-theoretic robustness,' but that’s vague. Does robustness mean surviving conceptual change, or surviving independent detection? Without a metric for 'degree' of robustness, isn't this just another version of the No Miracles Argument?"*
  **Reply (2 min):** It differs from NMA because NMA says "Success implies truth." I say "Success + Stability of Mechanism implies truth." Robustness isn't metaphysical stability; it's operational redundancy. If three different methods detect an entity via different physical principles, that’s a robustness check. It’s not a miracle; it’s a triangulation. While it shares DNA with NMA, it restricts the domain to confirmed triangulations rather than general success.
  **Where it’s weakest:** Triangulation itself can fail (different methods pointing to different fictions), making the link between robustness and truth fallible, not guaranteed.

  ### 8. The "Idealization" Blindspot (Graduate Student)
  **Phrased:** *"What about ideal gases or frictionless planes? These are theoretically indispensable and robustly successful. Are you saying we are realists about frictionless planes? Or does your criteria break down for abstract tools?"*
  **Reply (2 min):** Excellent point. Frictionless planes are instrumental devices, not posits intended to capture external reality. My distinction lies in *truth claims* associated with the posit. Scientists claim "there are ideal gases" in a counterfactual sense, not that ideal fluids exist in nature. However, in cases like the Ideal Gas Law applied to real limits, the 'particles' are real even if the 'volume=0' assumption is fictional. SR commits to the entities, not the idealizing limits. It’s the difference between the subject of the sentence and the qualifiers modifying it.
  **Where it’s weakest:** Distinguishing "idealization" from "false ontology" is notoriously slippery in practice; the reply risks sounding like special pleading.

  ---

  ## Part 2: The Question I Hope Nobody Asks

  **The Question:** *"If your criterion relies on 'retrospective validation' of which posits survived, doesn't that make your version of Selective Realism indistinguishable from Instrumentalism? You are saying we treat things as real only *after* we know they worked, which means we never really know if our current leading theories are true until they fail."*

  **Why it’s bad:** This questions the very epistemic value of the position. If realism is always conditional on survival, are we just waiting for the next revolution? It collapses the gap between "believing a theory now" and "believing a theory later."

  ---

  ## Part 3: Strategic Advice

  ### The Two Most Forceful Objections
  1.  **The Post Hoc Charge (#1):** If this sticks, your entire thesis looks like a circular definition of success designed to save realism.
  2.  **The Physics Bias Challenge (#3):** This undermines the universality of your argument. If it only works for classical physics, it’s a niche historical claim, not a philosophy of science thesis.

  ### What to Concede in Advance
  To defuse the **Post Hoc** charge, concede that **no criterion guarantees success.** Acknowledge that SR is a *fallibilist* strategy. State clearly: *"We cannot guarantee today’s robust posits won't fail tomorrow. But SR offers the best available heuristic to distinguish the stable core from the transient shell, whereas full anti-realism assumes every failure invalidates the past entirely."*

  To defuse the **Structural Realist**, concede that **structure is primary for stability.** Say: *"I agree structure is what links the theories. My point is that structure is inert without ontological constraints. Posits give the structure causal traction. So I'm not opposing SR, I'm completing it."*

  ### Confidence Assessment of My Analysis
  *   **Confidence Level:** High on the *dynamics* of the objections (these are standard, predictable philosophical push-backs). Moderate on the specific historical nuances (history is messy; the speaker may get caught in a specific fact dispute).
  *   **Least Sure Point:** The **Biology Objection**. Philosophy of biology is rapidly changing, and "mechanisms" vs. "entities" is a fraught area. I am less sure about the precise historical examples the biologist will bring up (e.g., genes, replicators, species concepts). I recommend reviewing recent debates on "biological kinds" before the seminar to fortify that answer.
