prompt: |-
  My small business has been bidding on a contract against a competitor for months. We started with a reasonable offer, they undercut us, we undercut them, and now we're seven rounds in. At our current bid, we'd lose about $15,000 if we win — but we've already sunk over $30,000 into the proposal process itself, and pulling out means walking away with nothing to show for it. My business partner argues we have to see it through, because otherwise all that time and money was wasted. Something about this reasoning feels like a trap to me, but I can't put my finger on what's wrong with it. What's actually going on here, and how should we think about whether to keep bidding?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Small business bidding on a contract against a competitor.
      *   **Process:** Seven rounds of bidding (negotiation/RFQ).
      *   **Financials:** Current bid would result in a $15,000 loss *if won*. $30,000 already spent on the proposal process (sunk costs).
      *   **Conflict:** Business partner wants to continue because the $30k is already spent ("can't let it go to waste"). The user suspects this logic is flawed ("feels like a trap").
      *   **Goal:** Identify the cognitive bias at play, explain the economics, and provide a framework for decision-making.

  2.  **Identify the Core Problem:**
      *   The partner's argument is based on money and time that cannot be recovered ($30k) influencing future decisions.
      *   This is the classic definition of the **Sunk Cost Fallacy**.
      *   The current situation also involves **Loss Aversion** (fearing the realization of the $30k loss vs. hoping to "win" back something).
      *   There's also an element of **Escalation of Commitment** (doubling down despite negative returns).

  3.  **Deconstruct the Logic:**
      *   *Partner's View:* We spent $30k. If we stop, it's gone. If we win, we recover some value (even if the project loses $15k, total impact = -$45k vs -$30k). Wait, no, winning the contract at a loss makes it worse.
      *   *Correction:* If we stop now, loss = $30k. If we win the deal at a loss, total loss = $30k + $15k = $45k. So winning actually *increases* the total loss, but the partner feels like not winning wastes the first $30k.
      *   *User's Intuition:* Correct. Past spending shouldn't dictate future profitability.

  4.  **Formulate the Explanation:**
      *   **Name the Bias:** Explicitly call it the "Sunk Cost Fallacy."
      *   **Define It:** Costs incurred that cannot be recovered should not influence rational decision-making regarding future investments.
      *   **Explain the Partner's Error:** The partner is treating the $30k as investable capital rather than written-off history. They want to justify the past expenditure by forcing a return from a bad bet.
      *   **The "Trap":** If you win the contract, you aren't just recovering the proposal costs; you are adding operational losses to them. You are bleeding cash to prove you were right about bidding.

  5.  **Develop Decision Framework (How to think about it):**
      *   **Marginal Analysis:** Ignore the $30k. Ask: Does winning *this specific contract* make financial sense moving forward?
          *   Revenue - Future Costs = Profit/Loss.
          *   Result: -$15,000.
          *   Conclusion: No, don't do it.
      *   **Opportunity Cost:** What else could that team/time/money do elsewhere?
      *   **Strategic Value:** Is there *any* non-financial reason to take the loss? (Entry strategy, portfolio piece?). Even then, can you achieve this cheaper than losing $15k?
      *   **Negotiation Leverage:** Why have they pushed price so low? Is the client looking to squeeze margins dangerously?

  6.  **Drafting the Advice (Iterative refinement):**
      *   *Validation:* Start by validating the user's gut feeling. It is a trap.
      *   *Concept:* Introduce Sunk Cost Fallacy clearly.
      *   *Math:* Show the numbers. Stopping = -$30k. Winning = -$45k.
      *   *Emotional Aspect:* Acknowledge why the partner feels this way (ego, hope, fear of failure).
      *   *Actionable Steps:* How to talk to the partner. How to decide.

  7.  **Refining the "Strategic Exception":**
      *   Is there ever a good reason to lose money? Yes, strategic entry. But $15k loss on a small business might be too steep. Need to ask: Is this a gateway to profitable work? If yes, is $15k the best price for that gateway? Probably not.

  8.  **Final Review against Safety Guidelines:**
      *   Does this constitute financial advice? It's general business strategy and behavioral economics, not specific investment advice. It's safe to discuss the logic of sunk costs.
      *   Ensure tone is empathetic but firm on the economic principles.

  9.  **Structure of the Response:**
      *   Direct Answer: You're right, it's the Sunk Cost Fallacy.
      *   The Logic Breakdown: Why the partner's math is wrong.
      *   The Emotional Component: Why this happens.
      *   Strategic Considerations: Are there exceptions?
      *   Action Plan: How to move forward/communicate.

  10. **(Self-Correction during drafting):** Make sure to emphasize that "breaking even" on the proposal cost by winning a losing contract is impossible. The $30k is gone regardless. The only question is whether to add more debt/loss to it.

  11. **Final Polish:** Check clarity and tone. Ensure the distinction between *sunk costs* and *marginal costs* is clear. (Proceed to generate output).

  **(Post-computation check):** Did I answer both parts? "What's actually going on here?" (Sunk Cost Fallacy). "How should we think about whether to keep bidding?" (Forward-looking marginal analysis). Yes.

