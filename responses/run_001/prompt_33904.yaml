      *   The user worries this implies a *Cartesian Theater* (a homunculus, a central clearing).
      *   Dennett's counter-claim: The unity is a *contentless* trick, a post-hoc narration, not a pre-existing stage. The "self" is a "center of narrative gravity."

  3.  **Evaluate the Argument from Phenomenology:**
