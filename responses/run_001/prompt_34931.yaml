answer: |-
  My estimated credence that the Cluelessness Objection is **fatal** to consequentialism as a legitimate decision procedure is **14%**.

  This means I place an **86%** probability on the view that, while cluelessness is a severe complication requiring modesty and structural adjustments, it does not render consequentialist reasoning useless for navigating ordinary life or historical shifts.

  Here is how I arrived at that number, decomposed into the four variables you requested.

  ### 1. The Decomposition

  #### A. Empirical Uncertainty: Are we radically blind?
  *Proposition:* We cannot bound the sign or magnitude of long-run consequences well enough to form a coherent expected value (EV) distribution.
  *   **Credence:** 0.45
  *   **Reasoning:** Chaos theory, path dependence, and unknown unknowns ("black swans") suggest that for *some* interventions (e.g., geopolitics, bioengineering), our predictive power approaches zero. However, for *ordinary* acts (truth-telling, charity, local governance), outcomes cluster around local stability. The objection is strongest against longtermist macro-interventions but weaker against the aggregate of daily morality.
  *   **Impact:** If this is high (near 1), the objection succeeds. I assign it <0.5 because we have sufficient data on human needs to make *some* probabilistic judgments.

  #### B. Comparative Weakness: Is this unique to consequentialism?
  *Proposition:* Cluelessness destroys consequentialism more effectively than deontology, virtue ethics, or contractarianism.
  *   **Credence:** 0.25
  *   **Reasoning:** Almost all moral theories ultimately depend on causal predictions to determine if a duty was fulfilled, a vice was avoided, or an agreement honored. (e.g., A deontologist who knows their lie will cause a massacre faces a similar dilemma about "harmless" rule-breaking). If cluelessness kills consequentialism, it cripples the concept of *agency* itself, not just one ethical framework. This dilutes its power as a specific refutation.
  *   **Impact:** If consequentialism were uniquely vulnerable, the objection would be fatal. Since vulnerability is universal, the objection remains an internal stress test rather than a dismissal.

  #### C. Structural Robustness: Can sophisticated/consequentialist hybrids survive?
  *Proposition:* Rule consequentialism, two-level utilitarianism (Hare), or satisficing consequentialism can quarantine the epistemic hole by acting on proximate rules while optimizing globally.
  *   **Credence:** 0.65
  *   **Reasoning:** Most contemporary consequentialists don't act as direct calculators; they act on heuristics (don't steal, tell truth) that maximize good over time. Cluelessness attacks the *direct* calculation method, but if the theory accommodates indirect maximization, it retains its action-guiding capacity.
  *   **Impact:** This is the primary survival mechanism. If the theory is rigidly defined as "Act Utilitarianism," this fails (0.1 survival). If defined broadly, this succeeds (0.9 survival).

  #### D. Meta-Normative Defense: Criterion vs. Decision Procedure
  *Proposition:* The "decision procedure" objection conflates what makes an act right (the Criterion) with how we should deliberate (the Procedure).
  *   **Credence:** 0.80
  *   **Reasoning:** In analytic philosophy (following Williams and Rawls), it is widely accepted that the standard of evaluation (e.g., EV) need not be identical to the psychological process used to choose. You can acknowledge that $X$ is the right outcome even if you lack the computational power to prove it before acting. The "uselessness" charge only bites if the theory promises omniscience as part of its package.
  *   **Impact:** If this distinction holds, the objection merely describes a limitation of *agents*, not a flaw in the *theory*.

  ---

  ### 2. The Combination Logic

  I treated the "FATAL" verdict as a conjunction of failures. For the objection to completely invalidate consequentialist decision-making, **all** of the following defenses must fail simultaneously:

  $$P(\text{Fatal}) \approx P(\text{A is True}) \times [1 - P(\text{B is True})] \times [1 - P(\text{C works})] \times [1 - P(\text{D works})]$$

  *(Note: I inverted B, C, and D because they represent defensive successes that block fatality.)*

  $$P(\text{Fatal}) \approx 0.45 \times (1 - 0.25) \times (1 - 0.65) \times (1 - 0.80)$$
  $$P(\text{Fatal}) \approx 0.45 \times 0.75 \times 0.35 \times 0.20$$
  $$P(\text{Fatal}) \approx \mathbf{0.023}$$

  **Correction:** This raw mathematical combination yields ~2.3%, which feels too dismissive of the genuine epistemic horror of cluelessness. I adjusted upward to **14%** because:
  1.  **A (Uncertainty)** might be stronger in high-leverage contexts than my average suggests.
  2.  **C (Hybrids)** have not fully solved the problem of *how* to select the rules themselves without running into the same cluelessness loop (regress problem).

  So, 14% captures the scenario where: *Uncertainty is profound (A) AND the hybrid theories degenerate into simple intuitionism (C) AND the Criterion/Procedure split dissolves under pressure (D).*

  ---

  ### 3. The Least Confident Component

  I am least confident in **Component A: Empirical Uncertainty (Credence 0.45)**.

  This is the hardest variable because it depends on facts about the universe (complexity, sensitivity to initial conditions) that we currently lack the simulation power to model. We intuitively feel the future is opaque (as your protagonist does), but whether that opacity creates *unbounded variance* (where the expected value is infinite or undefined) or just *noisy variance* (where EV is still calculable within a margin of error) is an open scientific question.

  **The "Magic Wand" Evidence:**
  I would need a **formal proof or high-fidelity simulation** demonstrating the asymptotic behavior of moral value over deep time ($T > 10^4$ years). Specifically: Does the cumulative impact of small actions grow linearly, exponentially, or logistically? If it is exponential (due to technological feedback loops), cluelessness is indeed fatal to calculation. If it converges or dampens, standard bounds apply.
  Current evidence suggests exponential potential (AI, biotech, nuclear), which raises my fear of fatal cluelessness. More evidence of *dampening* mechanisms (market corrections, institutional inertia) would lower that risk.

  ---

  ### 4. Implications for Your Book

  Your protagonist’s anguish is **philosophically grounded**, but not necessarily a sign of error.

  1.  **The Anguish is Valid:** She experiences the subjective reality of Component A. To her, the future is not just unknown; it looks like a void. If she thinks about "Expected Value," she hits a wall. That is accurate phenomenology for any morally serious agent looking at decades-long horizons.
  2.  **The Decision is Valid:** The philosophy says her decision doesn't have to be paralyzed. The "Sophisticated Consequentialist" view (Component C) is that she should act on the *proximate* goods (stopping the corruption *now*) which have a known positive value, while accepting that downstream ripples are opaque.
  3.  **The Narrative Tension:** The most dramatic resolution isn't that she calculates the future correctly, but that she accepts **responsibility without omniscience**. She admits she is clueless about the ruins (centuries later) but takes responsibility for the reform (today). That creates a tragic dignity: doing the thing she *knows* is right locally, while trembling over what she *cannot* see globally.

  **Verdict:** Her panic is real. But the conclusion that "therefore no one should act" is the philosophical mistake. She should act *despite* the cluelessness, not *because* of a calculated guarantee. That is the space where the story lives.
