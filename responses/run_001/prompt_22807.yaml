prompt: |-
  I'm teaching a small section on experimental philosophy this term and two of my grad students got stuck in a debate at our study session that I honestly cant referee. They both accept the basic asymmetry — that people are much more likely to say an agent intentionally brought about a harmful side effect of a decision than a beneficial one, in cases where the agent foresaw the side effect, thought of it as a mere byproduct, and went ahead with the decision anyway — so that part isn't in dispute. Their fight is over what the asymmetry shows.

  Mara argues it shows that our concept of intentional action itself is morally contaminated. Her reasoning is that in the harm case and the help case the agent's mental states are roughly the same — same foreknowledge, same indifference — and the only thing that changes is the valence of the outcome, so the only thing that could drive the asymmetry is that moral evaluation is literally built into the concept. Intentional, on this view, is doing normative work rather than descriptive work. Dev pushes back and says this is the old contamination story and that its not needed: people are running a causal-inference process, and when we learn that an agent brought about a bad outcome, we infer she must have endorsed it or believed in it in a way we don't infer for a good outcome. So the difference, he says, is in the folk's inference, not in the concept — the two cases differ in the evidence, not in the criterion.

  Mara's reply is that the inference story just collapses back into the contamination story, because the very fact that bad outcomes count as evidence of the relevant mental states is itself a moral premise — we expect bad things to be done by people who intended them and good things to be done by people who didn't — and that expectation is normative, so normativity is still doing the work, just one layer down. Dev says that proves too much, because almost every folk-psychological inference is normatively flavored (we expect liars to lie, for instance) and nobody says that makes our concept of belief normative.

  Can you adjudicate this for me? I'd like a point-by-point verdict on who's right about which specific claim, and what, if anything, both of them are missing — in particular whether the inference account really is a separate hypothesis from the contamination account or just a relabeling of it, and whether there's a diagnosis of the asymmetry that neither of them has even considered.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** Teaching experimental philosophy (x-phi), specifically on the Knobe Effect (intentionality asymmetry).
      *   **Participants:** Two grad students, Mara and Dev.
      *   **Shared Ground:** Both accept the existence of the side-effect effect (Knobe Effect): Harm $\rightarrow$ high intentionality; Help $\rightarrow$ low intentionality. Agent mental states (foreknowledge, indifference) are constant.
      *   **The Dispute:** What explains the asymmetry?
          *   *Mara:* Moral contamination view. The concept of "intentional" itself contains moral evaluation.
          *   *Dev:* Causal-inference/Blame-shifting view. Normative evaluation drives the inference about mental states, but the concept of "intentional" remains descriptive. People infer different mental states based on outcome valence.
      *   **Core Conflict:** Mara says Dev's inference story *is* just contamination one layer down. Dev says inference is distinct from conceptual change.
      *   **Task:** Adjudicate point-by-point, determine who is right about specific claims, identify what they're missing (especially regarding the relation between the hypotheses and alternative diagnoses).

  2.  **Deconstruct the Positions:**

      *   **The Phenomenon:** Joshua Knobe's Side-Effect Effect (2003).
          *   *Harm Case:* CEO foresees harm, doesn't care, harms environment. Most say "intentionally."
          *   *Help Case:* CEO foresees help, doesn't care, helps environment. Most say "not intentionally."
          *   *Control:* Mental states (belief, desire, foresight) are matched.

      *   **Mara's Position (Conceptual Morality):**
          *   Claim: The concept of intentional action itself is normatively loaded.
          *   Mechanism: If it's bad, we judge it as intentional regardless of precise mental state definitions.
          *   Support: Asymmetry persists despite matched mental states.
          *   Critique of Dev: Inference relies on a normative default ("bad acts usually imply intent"), which makes the input into the inference normative, thus the output (ascription) reflects normativity at the core.

      *   **Dev's Position (Pragmatic/Cognitive Inference):**
          *   Claim: The concept is descriptive; the judgment process involves updating beliefs about mental states based on evidence.
          *   Mechanism: Bad outcomes trigger a "deep search" or stronger attribution of underlying attitudes (e.g., maybe he actually *did* want the harm?). Good outcomes don't trigger this pressure.
          *   Analogy: Belief attribution in liars (normative context affects belief inference without making "belief" normative).
          *   Critique of Mara: Distinguishes *conceptual content* from *epistemic access/process*. Just because we use moral cues to detect mental states doesn't mean the definition of mental states includes morality.

  3.  **Evaluate the Arguments (Philosophical & Empirical Landscape):**

      *   *Is the concept contaminated?* Early x-phi debates often framed this as Concept vs. Pragmatics. Nadelhoffer (2006) proposed blameworthiness influences judgments. Nichols & Ulatowski (2007) argued for pragmatic factors.
      *   *Is it an inference about hidden mental states?* This aligns with the "Skillful Intentionality" view or deeper causal reasoning. However, empirical work (like Adams & Steadman) often suggests people aren't actually inferring hidden desires but judging the *status* of the action.
      *   *Mara's "Collapsing" Argument:* This is sophisticated. It argues that if the *criterion* for assigning evidence is normative, then the distinction between "mental state fact" and "moral evaluation" dissolves.
      *   *Dev's "Too Much" Argument:* Also sophisticated. If every heuristic involves norms (truth-telling norms affect lie detection), does everything become normative? This highlights the difference between *constitutive* rules and *heuristic* processes.

  4.  **Identify Missing Diagnoses (Third Ways):**

      *   **Punitive Motivation Theory:** Sripada (2008), Pettit (2009). We attribute intention to justify blame. It's not about what happened, but what we want to *do* about the agent.
      *   **Counterfactual Sensitivity/Deep Causation:** Knobe & Prinz (though Knobe shifted views). Was the outcome necessary for the action?
      *   **Attitude Attribution:** Maybe the key isn't "intent" per se, but "pro-attitude toward the outcome." In harm cases, indifference + doing is closer to endorsement than in help cases.
      *   **Motivated Reasoning:** We *want* to find culpability in harmful cases, so we interpret ambiguous data (indifference) as sufficient for intent.

  5.  **Drafting the Verdict (Iterative Process):**

      *   *Structure:*
          1.  Executive Summary (Who wins where).
          2.  Point-by-point adjudication (Mara's claims, Dev's claims).
          3.  The Core Dispute (Concept vs. Inference).
          4.  What They Missed (Alternative theories).
          5.  Recommendation for Class.

      *   *Specific Analysis:*
          *   *On Contamination:* Mara is empirically strong (people act differently), philosophically weaker (doesn't prove semantic content changed). Dev is right that we can separate inference from definition.
          *   *On Inference collapsing:* Mara is right that heuristics rely on norms, but wrong that this makes the *concept* normative. Dev is right to distinguish epistemic access from ontology.
          *   *On "Belief/Liar" Analogy:* Dev is strong here. Folk psychology is rife with bias (Halo effect, etc.) without changing the target concept.
          *   *Missing Piece:* They are both focusing on *how we know*, not *why we judge*. The "Moral Responsibility" explanation (we label it intentional *because* we think she deserves blame, not vice versa) is the most robust competitor in current lit.

  6.  **Refining the Tone:**
      *   Needs to be academic, fair, but decisive.
      *   Acknowledge the sophistication of the students' arguments.
      *   Use specific references where possible (Knobe, Sripada, Nadelhoffer, Mallon) to ground the advice.
      *   Ensure the distinction between *semantic constitutive conditions* and *epistemic criteria* is clear.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Point-by-point verdict? Yes.
      *   Who is right on specific claims? Yes.
      *   Is inference distinct from contamination? Addressed.
      *   Alternative diagnosis? Addressed (Moral Responsibility/Retributive motivation).

  *(Self-Correction during drafting)*: I need to be careful not to simply pick a winner. The field hasn't settled this definitively. I should frame the verdict as "Whose argument holds more water in the current landscape" rather than absolute truth. I must emphasize that Dev's distinction (epistemology vs. semantics) is generally considered the stronger philosophical move, even if Mara's intuition about deep contamination is popular. Actually, recent work by Sripada suggests the "responsibility-first" view might trump both. I should highlight that.

  Let's organize the response clearly.
  1. Introduction acknowledging the classic Knobe debate.
  2. Evaluation of Mara's "Conceptual Contamination."
  3. Evaluation of Dev's "Causal Inference."
  4. The Clash: Does Inference collapse into Contamination?
  5. The Third Way: Blame/Punishment Motivations.
  6. Conclusion/Teaching advice.

  *Wait, one nuance:* Mara says "Inference relies on moral premise... expectation is normative... so normativity is still doing the work." Dev replies "Liar analogy proves too much." This is the crux.
  *Verdict:* Dev is technically right about the logic of "collapse." Just because my method of finding out X uses Y, doesn't mean X contains Y. But Mara is right that the *boundary* between description and normativity is porous in folk psych. I will advise the professor to let Dev win the technical philosophical point, but note that Mara identifies a real psychological phenomenon (bias) that behaves *like* contamination even if it's not semantic.

  *Actually, looking at the literature:* The "Contamination Thesis" (Nadelhoffer, early Knobe) has largely been challenged by the "Responsibility Hypothesis" (Sripada, Tiberius). The idea is not that "Intentional = Good/Bad", but "We judge Intentional IF We Assign Responsibility." This supports Dev slightly (it's a process) but shifts the goalpost away from simple inference.
