answer: |-
  This is a classic dispute within experimental philosophy concerning the "Knobe Effect" (the side-effect asymmetry). Your students have grasped the central tension in the literature: **Constitution vs. Access.** Mara defends a view closer to the early *Normativity Hypothesis* (or Conceptual Contamination), while Dev defends the *Inferential/Pragmatic Hypothesis*.

  Here is a point-by-point adjudication of their claims, followed by the diagnoses they are overlooking.

  ### 1. The Verdict on the Specific Claims

  **Claim A: "Intentional is doing normative work rather than descriptive work." (Mara)**
  *   **Verdict:** Philosophically imprecise, psychologically accurate.
  *   **Reasoning:** Mara conflates *semantic constitution* with *usage patterns*. While it is true that our usage of the word "intentional" covaries heavily with moral judgment, this does not prove that moral evaluation is a *necessary condition* of the concept itself. It only proves that moral status is a powerful cue used to apply the concept. A concept can be sensitive to normative inputs without being normative in its internal architecture (much like how "dangerous" triggers fear without "fear" being part of the definition of danger). Mara is identifying a robust psychological dependency, but overstating it as a semantic claim.

  **Claim B: "People are running a causal-inference process... evidence differs, not the criterion." (Dev)**
  *   **Verdict:** Stronger philosophical defense, aligns with standard folk-psychological modeling.
  *   **Reasoning:** Dev correctly distinguishes between the *target concept* (what counts as intentional) and the *epistemic process* (how we determine intent). Standard philosophy of mind accepts that we infer mental states from behavior. If the behavior looks morally significant, we update our priors regarding the mental state. This preserves the descriptive integrity of "intentionality" while accounting for the asymmetry.

  **Claim C: "The inference story collapses back into the contamination story because the evidence criteria are normative." (Mara)**
  *   **Verdict:** False. This is a category error.
  *   **Reasoning:** Mara argues that because the *input* to the inference is normative (we expect bad things from bad actors), the *output* must be normative. However, inference from evidence does not contaminate the nature of the conclusion. Consider a legal trial: We may rely on circumstantial evidence (a motive) to infer guilt. The motive is moral/economic, but the charge (murder) is defined descriptively (cause of death + intent). The *method of detection* is value-laden, but the *property detected* is not necessarily moral.

  **Claim D: "Almost every folk-psychological inference is normatively flavored... nobody says that makes our concept of belief normative." (Dev)**
  *   **Verdict:** Winning move.
  *   **Reasoning:** Dev’s reductio ad absurdum regarding belief attribution is the strongest point in his arsenal. We judge whether someone *believes* p partly based on how socially acceptable p is. This does not mean "belief" is a moral concept. It means human cognition is pragmatically tuned. By drawing this parallel, Dev successfully demonstrates that Mara's "collapse" argument would render almost all mental state concepts normative, thereby emptying the term "normative" of its distinctive explanatory power.

  ### 2. Is the Inference Account Distinct from Contamination?

  **Yes.** The two hypotheses differ fundamentally in their **direction of explanation**.

  *   **The Contamination View (Mara):** Normativity $\rightarrow$ Ascription of Intent.
      *   Because it is bad, it *counts* as intentional. The moral property is part of the satisfaction conditions for applying the predicate "intentional."
  *   **The Inferential View (Dev):** Outcome Valence $\rightarrow$ Update of Mental State Evidence $\rightarrow$ Ascription of Intent.
      *   The outcome changes our estimation of the agent's underlying mental state (e.g., "If he did it knowing it would cause harm, he probably didn't dislike it"). The concept of intent remains neutral; the *data feeding it* is skewed.

  Mara tries to collapse them by claiming the *skew* itself is part of the definition. However, unless she can show that in a hypothetical community with no moral concepts, the asymmetry disappears entirely (which is hard to test), the Inferential View remains the more parsimonious hypothesis. The asymmetry can exist via cognitive bias without semantic change.

  ### 3. What Are They Missing? (The Third Diagnosis)

  Both students are stuck on whether the mechanism is **semantic** (Mara) or **epistemic** (Dev). However, the most robust contemporary explanations suggest the mechanism is neither; it is **motivational**.

  The diagnosis they are missing is the **Responsibility Hypothesis (or Retributive Motivation Theory).**

  *   **Proponents:** Chandra Sripada (2008), Daniel M. Wegner & Matthew J. Fiske, sometimes Al Mele.
  *   **The Argument:** We do not first judge "Intentional" and then "Responsible." Rather, we first assess **blameworthiness/punishability**, and *then* retroactively adjust our intentionality judgment to match our desire to hold the agent accountable.
  *   **Why it solves their impasse:** It sidesteps the semantic vs. epistemic fight.
      *   To Mara: You are right that morality drives the judgment, but you are wrong that "intentional" is the concept doing the work. "Responsible" is doing the work.
      *   To Dev: You are right that it's not semantic contamination, but you are wrong that it's a cold "causal inference." It is a hot, motivated reasoning process aimed at social regulation, not information gathering.

  **Evidence:** Studies show that if you tell participants they cannot punish the agent (no social consequences), the asymmetry diminishes or vanishes. This suggests the asymmetry tracks a need for a justification of blame, not a blind inference of mental states or a fuzzy concept of intent.

  ### 4. Recommendations for Your Section

  To resolve the debate for your class, I recommend structuring the feedback as follows:

  1.  **Acknowledge the Sophistication:** Tell them this is exactly why this debate has raged for 20 years. They have accurately identified the fault line in the literature.
  2.  **Validate Dev on Logic:** Confirm that Dev wins the logical battle. Mara cannot simply assert that "influenced by" equals "constituted by." Dev's distinction between *access* (how we find out) and *content* (what it is) is the crucial philosophical distinction.
  3.  **Validate Mara on Phenomenology:** Acknowledge that Mara is correct about the *feeling* of the data. It feels like normativity is inside the concept. This is why the "Contamination" hypothesis was the dominant early interpretation.
  4.  **Introduce the Third Option:** Explain that modern x-phi has largely moved past the Concept-vs-Inference dichotomy toward the **Motivated Reasoning/Responsibility Hypothesis**. Ask them: *"If we find that the asymmetry drops when punishment is removed, does that support the Inference account (less evidence?) or the Responsibility account (different goal of judgment)?"* (The answer supports Responsibility).

  **Final Ruling:** Dev is winning on technical grounds regarding the definition of intentional action, but Mara is intuitively correct that normativity drives the engine. The "winner" of the research program, however, is likely the Responsibility Hypothesis, which posits that intentionality attributions are tools for social coordination, not neutral descriptions of mind or behavior.
