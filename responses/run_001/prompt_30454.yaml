answer: |-
  # Adversarial Collaboration Statement: Formalizing the Problem of Old Evidence

  **Authors:** [Member A: Supplementationist] & [Member B: Deflationist]  
  **Date:** October 26, 2023  
  **Subject:** Joint Report on the Problem of Old Evidence in Bayesian Confirmation Theory

  ## I. Agreed Baseline Claims

  Before outlining our disagreements, we jointly commit to the following tenets regarding the scope and constraints of our inquiry:

  1.  **Normativity of Bayes’ Theorem:** We agree that the standard Bayesian conditionalization rule, $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$, serves as the normative baseline for rational belief update when new information $E$ is acquired. Any proposed solution to the Problem of Old Evidence (POE) must not render the core machinery of probability theory incoherent.
  2.  **The Paradigm Case:** We agree that the historical relation between General Relativity (GR) and the anomalous perihelion advance of Mercury constitutes the primary test case. Specifically, any adequate formalism must be able to represent the intuition that the explanatory success of GR concerning this pre-existing anomaly constituted significant confirmation of the theory.
  3.  **Requirement of Non-Triviality:** We agree that a solution is unsatisfactory if it merely stipulates away the problem by redefining "evidence" or "confirmation" such that *no* proposition could ever be confirmed after its truth is established. The mechanism must allow for old evidence to incrementally raise credence in a hypothesis under specified conditions.
  4.  **Distinction from Psychology:** We agree that appealing to the psychological satisfaction of scientists ("feeling" confirmed) is insufficient for a formal theory. The resolution must address the logical/mathematical relationship between hypothesis, evidence, and background knowledge ($K$).
  5.  **Criterion for Solution:** We agree that a "solution" requires either (a) demonstrating that standard Bayesian calculus represents the case correctly once idealizations are relaxed, or (b) identifying a specific, minimal extension to the calculus required to generate the correct result, distinguishing it from arbitrary tinkering.

  ---

  ## II. Map of Disagreements

  The following table outlines our specific points of contention, formulated neutrally.

  | # | Neutral Wording of Disagreement | Supplementationist Formulation (Member A) | Deflationist Formulation (Member B) | Crux(es) | Test Case / Constraint & Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Status of Probability 1**<br>When is it appropriate for a rational agent to assign $P(E)=1$ to a piece of evidence? | Assigning $P(E)=1$ is the standard representation of "knowing" $E$. Once assigned, $E$ cannot function as evidence within that state space. Therefore, representing the Mercury case requires modeling a prior state where $P(E) < 1$ despite $E$ being empirically known, which requires modifying the state space definition. | "Known" empirical data rarely warrants $P(E)=1$ regarding the *explanatory relevance* of $E$. Agents maintain subjective uncertainty about how $E$ fits into the theoretical framework. Thus $P(E)<1$ in the relevant reference class of possibilities without revising the formalism. | **Interpretation of Epistemic State:** Does $P(E)=1$ track empirical certainty or total deductive certainty? | **Case:** Anomalies in Physics.<br>**Prediction:** <br>A: If $E$ is observed fact (perihelion shift), $P(E)$ should be 1. Only changing this solves POE.<br>B: If $E$ is observed fact, $P(E)$ can still be < 1 relative to the *implications* of $H$ (e.g., is the measurement error negligible?). No formal revision needed, just input adjustment. |
  | **2** | **Mechanism of Update**<br>What drives the increase in $P(H)$ when $H$ entails old evidence $E$? | The update occurs upon learning the *logical entailment* ($H \vdash E$), not $E$ itself. Since standard conditioning applies only to propositions, we need a supplement (e.g., logical learning operator) to model the transition from $\neg(H \vdash E)$ to $(H \vdash E)$. | The update is driven by comparing $H$ against alternatives. $E$ confirms $H$ over $H'$ because $P(E|H) > P(E|H')$ (likelihood ratio), provided uncertainty exists about whether $H$ or $H'$ is true. | **Comparative vs. Absolute Confirmation:** Is confirmation a relation between $(H, E)$ or $(H, H', E)$? | **Constraint:** Zero-Sum Confirmation.<br>**Prediction:** <br>A: Confirmation depends on internal coherence of $H$ and $E$, regardless of rivals.<br>B: Without explicit comparison to a rival $H'$, the confirmation value of $E$ vanishes. If $H'$ also entails $E$, no differential confirmation occurs. |
  | **3** | **Role of Logical Omniscience**<br>Does the agent already know all logical consequences of $H$ at time $t$? | No. Agents are logically imperfect. To model discovery, we must relax logical omniscience. Standard Bayesianism assumes agents know all tautologies, masking the "surprise" of the Mercury prediction. We must explicitly add a model of logical discovery. | Logical omniscience is an idealization for *normative* purposes, not descriptive history. The "problem" arises from conflating the agent's actual limited computation with the rational requirement to evaluate consistency. The fix is methodological (conditionalize on background excluding the entailment), not mathematical. | **Idealization vs. Reality:** Is the failure a bug in the logic or a misuse of the limit assumptions? | **Case:** Mathematical Proofs.<br>**Prediction:** <br>A: Even in pure math, discovering a proof confirms a conjecture. This requires tracking the *state of proof*. Standard conditioning fails here.<br>B: Before the proof is found, $P(E)$ is subjective. Once found, it settles. The timeline is irrelevant to the final justification. |
  | **4** | **Nature of Background Knowledge ($K$)**<br>How much of the theory's content should be included in the background $K$ used for conditioning? | $K$ should not include the entailment $H \to E$. But standard conditioning treats $K$ as fixed. To avoid triviality, we need a distinct operation (e.g., "suppositional") to temporarily remove entailments from $K$ without abandoning the belief in $E$. | $K$ naturally excludes the specific theoretical deduction until the theory is proposed. We condition on $E$ given $H$ *and* $K_{raw}$ (where $K_{raw}$ lacks the specific derivation). This is already captured by standard conditional probability notation $P(E|H, K)$. | **Scope of Conditioning:** Is "background knowledge" dynamic or static during evaluation? | **Constraint:** The Garber/Jeffrey Fix.<br>**Prediction:** <br>A: Conditionalizing on the *proposition* "$H \implies E$" solves it formally, treating logic as empirical content.<br>B: Treating logical implications as empirical content is a category error. It should remain structural. |

  ---

  ## III. Verbal vs. Substantive Disputes

  We have identified the following areas of friction to clarify for future discussion:

  **1. Substantive Disagreement: The Necessity of Extending Probability Theory**
  *   **The Issue:** Member A argues that standard Kolmogorovian probability *cannot* represent the change in status of $H$ when $H \vdash E$ is discovered without adding variables (like logical atoms or counterfactual states). Member B argues that the existing formalism *can* represent this if the variables (specifically $P(E)$ and $K$) are interpreted with sufficient sensitivity to the agent's state of ignorance regarding the deduction.
  *   **Why it is Load-Bearing:** If A is correct, Bayesianism is formally incomplete for scientific reasoning involving mathematical discovery. If B is correct, the complexity of POE is a matter of modeling choice, not formal limitation. This determines whether we seek new mathematics (Bayesian Epistemology 2.0) or better application (Bayesian Epistemology Applied Correctly).

  **2. Verbal (Potential) Disagreement: The Definition of "Knowing"**
  *   **The Issue:** When A says "$P(E)=1$", they refer to the *empirical* certainty of the datum (Mercury exists and moves oddly). When B says "$P(E)<1$", they often implicitly mean "uncertainty about the implication $H \to E$" or "uncertainty about the reliability of the data relative to theory-laden concepts."
  *   **Resolution:** We agree to distinguish clearly between **Data Certainty** ($D$ is true) and **Theoretical Entailment Certainty** ($H \to D$ is deduced). Much of the initial confusion stems from A assuming B denies Data Certainty, while B claims to deny Entailment Certainty.
  *   **Note:** If B acknowledges that *pure* logical truths force $P(L)=1$ and thereby collapse confirmation, that becomes a substantive concession requiring the "supplementation" A seeks.

  ---

  ## IV. Stability Check

  This section identifies potential points of collapse for each position, based on external pressures.

  ### For the Supplementationist (Member A)
  *   **Condition for Revision:** If you can demonstrate that your "extension" to the formalism allows $P(H)$ to increase in a case where there is no logical surprise involved (i.e., the entailment was already obvious), the model loses its explanatory power regarding the specific difficulty of *old* evidence.
  *   **Most Likely Point of Fragility:** **The Criterion of "Removal."** Your proposal relies on constructing a counterfactual world where $E$ is forgotten or the entailment is unlearned. Justifying *how* to perform this subtraction without begging the question (using the very hypothesis you wish to confirm to reconstruct the prior) is difficult. If your method effectively calculates $P(H|E)$ using $P(E|H)$ values derived from the current full set of beliefs, it may just be relabeling $P(E)$ without solving the algebraic identity $P(H|E) = P(H)$ when $P(E)=1$.
  *   **Key Question:** Can you specify a unique, objective procedure for calculating these counterfactual priors that does not implicitly assume the truth of the hypothesis to determine the strength of the confirmation?

  ### For the Deflationist (Member B)
  *   **Condition for Revision:** If a case arises where $E$ is a **logical or mathematical truth** (not just empirical observation) that $H$ explains. If $P(E)$ is logically constrained to be 1 (e.g., $H \to (A \lor \neg A)$), but $H$ seems to be confirmed by deriving a specific necessary consequence previously unknown, your insistence on $P(E)<1$ becomes untenable without violating the axioms of logic.
  *   **Most Likely Point of Fragility:** **The Stretch of Uncertainty.** Your view requires maintaining non-zero variance in $P(E)$ for settled facts to generate confirmation. This risks turning probability theory into a mere description of confidence levels rather than a normative system of evidence. If "uncertainty about the entailment" is admitted, why stop there? Why not uncertainty about $H$ itself? At what point does $P(E)<1$ become a purely fictional construct designed solely to save the thesis?
  *   **Key Question:** Is there a principled stopping point for where uncertainty is permitted in the "old evidence" set? If not, your "standard apparatus" appears to require infinite degrees of freedom to accommodate every intuitive case of confirmation.

  ***

  **Joint Conclusion:** We find that the core disagreement is not about the intuitions behind Mercury and GR, but about whether those intuitions reveal a **limit of the mathematical domain** (Supplementationist) or a **limit of the user's implementation** (Deflationist). Our next step is to formalize one specific case study (e.g., the derivation of a conservation law) and run both models through it to see which requires more "patchwork" adjustments.
