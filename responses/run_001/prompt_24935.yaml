answer: |-
  Yes, your intuition is coherent. Yes, this is a genuine moral dilemma where every available action carries a moral cost. And yes, there is a correct course of action, even though choosing it does not absolve you of the "wrongness" inherent in the situation.

  You are experiencing what philosophers call **moral residue**. In a perfect world, you would have options that align perfectly with all your values. In the real world, values sometimes collide violently. Your feeling that "whatever I do, I will have done something I shouldn’t have" is not a failure of your reasoning; it is a recognition of reality. Sometimes, to save a life, you must break a promise. To keep a friend safe, you must hurt another friend. Both are true simultaneously.

  Here is my committed position on the philosophy, the application, and the path forward.

  ### 1. The Philosophical Position: Can there be no right option?
  **Yes.** Situations exist where competing moral obligations are equally binding yet mutually exclusive. This is not because you haven't thought hard enough; it is because the ethical fabric of human relationships is not always consistent.

  If we were utilitarians, we might simply calculate the greatest happiness and decide the math solves the problem. If we were deontologists, we might follow rigid rules. But in the messy middle of friendship and love, these theories fail. We accept that sometimes, **wrong remains after the best choice is made.**

  This is distinct from a "hard choice" (where you pick the lesser of two evils). This is a "tragic choice." You are being asked to sacrifice one loyalty to honor another. By definition, you are violating one valid duty to fulfill another. Therefore, the guilt you feel is appropriate. It signals your integrity; you wouldn't feel this if you didn't care about the sanctity of promises *and* the well-being of your friend.

  ### 2. Application to Your Case
  In your specific scenario, **you must tell the wife.**

  While your intuition tells you that both paths are "wrong," they are not equal in magnitude. Here is the hierarchy of obligation that dictates this choice:

  *   **The Obligation of Confidentiality:** You promised secrecy. This is a significant bond. However, promises made under conditions of deception that lead to catastrophic harm generally forfeit their moral authority. Your friend made you swear an oath to help him execute a deception that actively harms his wife.
  *   **The Obligation of Non-Maleficence (Do No Harm):** Your wife is on the verge of making a decision that could effectively destroy her career trajectory and financial stability. She believes she is making a mutual life choice; she is actually being maneuvered by a partner who has already abandoned her. Allowing her to proceed would be a profound violation of her autonomy.
  *   **The Obligation of Truth:** While you don't owe strangers the full truth, you owe a close friend honest information regarding decisions that impact their life path when they ask point-blank for your assessment.

  **Why the husband's betrayal outweighs his request for silence:**
  Your husband is asking you to participate in a fraud. By withholding the truth while she plans her resignation, you become an accomplice to his deception. While his pain or reasons for leaving may be legitimate (we don't know why he is leaving), his method—steering her into a new life before discarding her—is abusive. A promise to protect a secret cannot ethically extend to facilitating the ruin of a third party who knows nothing of the plot.

  ### 3. How to Choose and Act
  You should tell her. But do not simply dump the information on her. This requires careful execution to minimize unnecessary cruelty while maximizing protection.

  **Step One: Contextualize the disclosure.**
  Do not present this as gossip or you trying to save yourself. Frame it immediately around care and urgency.
  *   *Say this:* "I am going to tell you something painful, and I am going to break a trust by telling it. I am only doing this because I love you and I cannot watch you make a decision that will ruin your future based on lies."

  **Step Two: Stick to the Fact.**
  You are revealing *his intention to leave*, not the intimate details of why or how much time he spent plotting it. The goal is to stop the resignation/move.
  *   *Say this:* "He told me privately that he intends to end the marriage. I swore not to tell you, and I broke that vow because I was told you were planning to quit your tenure track and move. He wants to stay in this arrangement until you are settled elsewhere so it looks seamless, but you deserve to make that decision knowing the whole picture."

  **Step Three: Accept the Consequences.**
  When you tell her, you will likely lose your friend forever. Your wife may never fully forgive you for knowing and waiting. You must accept this price. You are paying it now to save her career.

  ### 4. Living with the Choice
  You asked what follows for how you should live with the choice afterward. This is crucial. Do not try to convince yourself that you did the "right" thing and therefore the guilt should vanish.

  **1. Do not apologize for the choice, only for the breach.**
  You should say to your wife, "I am sorry I kept this quiet for a moment, but I had to tell you now to protect your life." To your husband, if you speak to him again, you say, "I betrayed your trust because preventing harm outweighed my promise to you." Stand firm on this logic. Do not seek validation, but do not seek self-flagellation either.

  **2. Carry the "Moral Remainder."**
  Accept that there is a stain on your hands here. You violated a confidence. Acknowledging this makes you a better person, not a weaker one. Years from now, if you find yourself in a situation where a promise is easier to keep, recall this night. Let the memory of this "wrong" make you wiser about where you draw your lines in the future.

  **3. Refuse the role of the scapegoat.**
  Both friends may want to blame you. She may say, "Why didn't you tell me sooner?" He may say, "You're the worst traitor." You must internally recognize that **they created this trap.** He created the lie that put you in this position. She placed trust in you that you couldn't fulfill without hurting him. The fault lies in their broken relationship, not your conscience.

  ### Final Word
  You are lying awake because you are good. Bad people would choose the easy path—either let her suffer for the sake of his secret, or tell her casually for drama. You are weighing the lives and dignity of the people involved.

  **The verdict:** Tell her. Protect her agency over his privacy. But hold space in your heart for the knowledge that you paid a moral debt to do it. That is not a sign of failure; it is the price of admission for being human. Sleep tonight knowing that saving her future was worth the cost of his anger.
