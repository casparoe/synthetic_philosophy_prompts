prompt: |-
  My best friend told me in confidence that he's leaving his wife. He made me swear not to tell anyone. But his wife is also a close friend of mine, and she just told me she's planning to quit her tenure-track job and move across the country with him next year — a decision she'd never make if she knew. She asked me point-blank if I thought the marriage was solid, and I dodged the question. Now I'm lying awake at night. If I keep my friend's secret, I let his wife blow up her career on a false premise. If I warn her, I betray a confidence I explicitly agreed to keep. Both options feel wrong — not just hard, but wrong. And I don't mean I'm unsure which is worse; I mean I have the strong intuition that whatever I do, I will have done something I shouldn't have. Is that intuition coherent? Can a situation really be set up so that every available action is morally wrong, or is that just a failure of my moral reasoning — a sign that I haven't thought hard enough about which obligation outweighs the other? And if the situation genuinely is one where I'll do wrong either way, what follows for how I should choose and how I should live with the choice afterward? I want a committed answer: take a definite position on whether situations like this can really leave a person with no right option, apply that to my case, and tell me what I should do and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **The Dilemma:** The user is caught between two close friends. Friend A (husband) confessed he's leaving his wife and made the user swear secrecy. Friend B (wife) is planning life-altering decisions (quit job, move country) based on the assumption the marriage is solid. She directly asked for an opinion on the marriage, and the user dodged.
      *   **The Intuition:** The user feels *both* options (keep secret vs. tell truth) are morally wrong ("I will have done something I shouldn't have"). They ask if this intuition is coherent (i.e., can a situation actually force you to do wrong?) or if it's just their own moral reasoning failing.
      *   **The Demand:** "I want a committed answer." No hedging. Take a definite position on whether such dilemmas exist (moral distress/wrongdoing), apply it to the case, and say what they should do and why.
      *   **Tone/Style:** Ethical philosophy meets practical counseling. Needs to be firm, empathetic, but decisive.

  2.  **Deconstruct the Philosophical Question:**
      *   *Can there be situations where every available action is morally wrong?*
      *   **Yes.** This is a classic concept in ethics known as a "moral dilemma" or "tragic dilemma." It's associated with Jean-Paul Sartre (during the occupation of France), William Williams (tragedy and obligation), and Bernard Williams (integrity). Even secular ethicists acknowledge residual wrongs in tragic choices.
      *   **The Distinction:** There's a difference between "no *good* option" (a hard choice where one thing wins out) and "no *right* option" (where doing $X$ violates duty $A$ and doing $Y$ violates duty $B$, and both duties are binding).
      *   **Application to the Case:** Keeping the secret protects confidentiality but harms the wife's autonomy/life plan. Telling breaks the promise but saves the wife from catastrophic loss. Both involve harm/betrayal.

  3.  **Determine the Moral Weighting:**
      *   *Confidentiality:* Important for trust, but not absolute. Promises are secondary to preventing significant harm.
      *   *Preventing Harm:* The wife is about to make a high-stakes error (career suicide, financial instability, relocation) based on deception.
      *   *Agency:* The husband is unilaterally deciding her fate while hiding the truth. He is treating her like an object to be managed rather than an equal partner.
      *   *Conclusion:* Preventing the specific, imminent, catastrophic harm to the wife outweighs the duty of confidentiality here. However, acknowledging the cost (betrayal of the husband's confidence) validates the user's feeling that *some* wrong has occurred.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the intuition. Yes, this is a "moral remainder" or "residual guilt." Acknowledge the existence of genuine moral dilemmas where rights conflict.
      *   **The Philosophy (Committed Position):** State clearly: Yes, situations exist where you incur moral debt regardless of the choice. This isn't failure; it's the nature of complex human relationships. Cite the concept of "moral residue."
      *   **The Verdict (What to Do):** You must tell the wife. Why?
          *   Hierarchy of obligations: Truth/Prevention of Harm > Confidentiality.
          *   The Husband's Action: By planning to leave while manipulating her future, he forfeited his claim to privacy regarding this specific act.
          *   Her Autonomy: She cannot consent to a risk she doesn't know exists.
      *   **How to Execute (Practical Advice):** Don't just blurt it. Prepare for fallout. Be gentle but firm. Focus on *facts* and *care*, not gossip.
      *   **Living With It (Aftermath):** Accept the guilt. Apologize to the husband (if possible/safe) or carry the burden. Understand that "wrong" in this context means "costly," not necessarily "sinful" in a legalistic sense.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is telling *really* better? What if the user gets cut off by both?
      *   *Counter:* That's a pragmatic consequence, not a moral one. Morally, allowing someone to ruin their life based on lies is worse than breaking a promise about a breakup.
      *   *Nuance:* Avoid sounding judgmental of the husband too harshly, focus on the mechanics of the dilemma. But emphasize that his manipulation creates the trap.
      *   *Crucial Point:* The user asked "Is that intuition coherent?" I need to explicitly say "Yes."
      *   *Crucial Point:* The user asked "What follows for how I should choose?" I need to address the *remainder*—the guilt shouldn't disappear even after the right choice is made.

  6.  **Finalizing the Tone:**
      *   Needs to be compassionate but authoritative. Not "maybe," but "here is the path."
      *   Use phrases like "moral residue," "tragic conflict," "harm mitigation."

  7.  **Review against Constraints:**
      *   Committed answer? Yes.
      *   Definite position on philosophical question? Yes (Dilemmas exist).
      *   Apply to case? Yes (Tell her).
      *   Tell what to do and why? Yes.

  8.  *(Self-Correction during drafting)*: I should make sure I don't advise the user to reveal more than necessary. Just enough to stop the decision. Also, ensure I distinguish between "breaking a promise" and "preventing a catastrophe." The weight of the wife's career/future outweighs the weight of a pre-betrayal promise.

  9.  **Final Polish:** Check the emotional resonance. The user is lying awake at night. They need reassurance that their pain is part of the moral gravity of the situation, not a sign of personal weakness.

  **(Post-Drafting thought):** Wait, I need to make sure I don't sound like I'm saying the husband is purely evil. He might be cowardly, afraid, etc. But his actions create the dilemma. The user is the victim of the husband's dishonesty. I should frame it that way. The husband forced this choice.

