answer: |-
  Here is a draft of 10 interview questions structured for your seminar. I have organized them to flow logically from motivation to specific objections, ending with the meta-question about falsifying Constructive Empiricism itself.

  Per your request, for the three specific areas (Triviality, No-Miracles, and the Past), I have provided the primary question, a brief note on the **Anticipated Response**, and a **Strategic Follow-Up** you can deploy immediately depending on his answer.

  ### Part 1: Introduction & Motivation

  **1. Contextualizing the Stance**
  "You've defended Constructive Empiricism for decades, yet modern physics seems to push harder and harder toward unobservable entities like quantum fields or multiverses. In an era where 'success' looks increasingly like 'structural continuity' rather than just phenomenological fit, does your view require you to abandon the idea that our current best theories are even structurally correct, or do you think that bridge is still passable?"

  ### Part 2: The Triviality Objection (Underdetermination)

  **2. The Substantivity of Underdetermination**
  "A recurring criticism is that underdetermination is trivially true—if I take Theory T and add the clause 'and no unobservables exist,' I get a rival Theory T* that is empirically equivalent to T. If every theory has a logically possible equivalent, does this reduce underdetermination to a mere linguistic artifact rather than a substantive argument against realism? How do you distinguish between a 'mere logical competitor' and a genuine scientific rival?"

  > **Anticipated Response:** *Van Fraassen typically argues we don't care about *logically possible* rivals, only those that are *viable* competitors within the context of inquiry. He would likely say underdetermination is only problematic when two theories are both scientifically credible options.*
  >
  > **3. Strategic Follow-Up (If he emphasizes "Viable Competitors"):**
  > "But 'viability' usually relies on theoretical virtues like simplicity, naturalness, or coherence with established mathematics. Aren't those very virtues grounded in realist intuitions—that nature *is* simple or elegant? If we strip away the assumption that unobservables are real, do we lose the criteria needed to decide which rival is 'viable' in the first place?"

  ### Part 3: The No-Miracles Argument (NMA)

  **4. Responding to Predictive Success**
  "The No-Miracles Argument remains the realist's strongest intuition pump: the idea that a theory's ability to make novel, accurate predictions would be a 'miracle' unless the entities it posits (electrons, genes, etc.) are at least approximately real. Why do you think this intuition carries so much weight for realists, and where exactly do you locate the flaw in their reasoning?"

  > **Anticipated Response:** *He typically argues that IBE (Inference to the Best Explanation) is not a reliable logic of confirmation. He may suggest that success is explained by selection bias (we keep theories that work) rather than truth. He will call the realist move question-begging.*
  >
  > **5. Strategic Follow-Up (If he dismisses IBE):**
  > "If you reject IBE as a justification for believing in unobservables, I’d like to push on the mathematical structure. Even if we don't believe the entities, the mathematical structures of our theories allow us to manipulate the world with incredible precision. Doesn't the reliability of manipulating these structures suggest they latch onto something real about the environment, even if the ontology is different?"

  ### Part 4: Underdetermination of the Past

  **6. Temporal Symmetry in Skepticism**
  "Your view demands we withhold belief about unobservables in favor of empirical adequacy. But empirical adequacy usually requires interpreting the past as a cause of current data (e.g., fossils or cosmic background radiation). Do you maintain that the distant past is equally underdetermined by present evidence? If I can only confirm that things *appear* to be the way they are now, does this lead you toward a form of temporal skepticism regarding historical facts?"

  > **Anticipated Response:** *This is a tough nut for empiricists. He may try to limit skepticism to 'unobservable entities' but admit that the past is fixed by causal chains. However, a consistent empiricist often struggles here. He might argue that 'acceptance' allows us to talk about the past pragmatically without ontological commitment.*
  >
  > **7. Strategic Follow-Up (If he defends a limited view of the past):**
  > "If we can't have ontological commitment to the past causes of our data, does that put your own view in trouble? Your Constructive Empiricism is itself a historical theory about the philosophy of science. If we suspend belief in the reality of the past causes, do we have any grounds to believe your own philosophical arguments have a stable, historical context rather than just being another set of useful stories told today?"

  ### Part 5: Scientific Practice & Virtue

  **8. The Scientist’s Toolkit**
  "Philosophers of science often struggle to reconcile normative philosophy with descriptive practice. When working scientists debate interpretations of quantum mechanics or string theory, they routinely appeal to explanatory depth as a tie-breaker. If your view tells us that 'explanatory depth' is irrelevant to the goal of science, how do you account for the fact that scientists treat it as a vital heuristic for finding the *right* model, not just a usable one?"

  ### Part 6: Mathematics & Structuralism

  **9. The Role of Mathematical Models**
  "Much of contemporary debate has shifted from objects to structures (Ontic Structural Realism). You’ve argued we accept a theory as empirically adequate. Given that our empirical access is almost entirely mediated through mathematical modeling, is there a version of structuralism compatible with your view? Or must we also remain agnostic about the mathematical structure itself, viewing it merely as a calculation device?"

  ### Part 7: Conclusion & Self-Reference

  **10. Falsifying Constructive Empiricism**
  "I’d like to close with a meta-question. In Popperian terms, a scientific theory must be falsifiable. Is there any conceivable piece of evidence, experiment, or historical case study that would convince you to abandon Constructive Empiricism in favor of some form of scientific realism? If not, is there a risk that your position is less of a philosophical thesis about science and more of an immunization strategy against refutation?"
