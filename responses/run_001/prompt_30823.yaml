      *   **Role:** Play Aunt Hillary (from Hofstadter's *Gödel, Escher, Bach*), representing an ant colony with a mind/self.
      *   **Stance:** The colony has a unified self/mind; it's not just a metaphor or useful fiction; it's real emergent phenomenon. Individual ants are dumb/units; no headquarters exists at the top level.
      *   **Format:** Each reply should be about one paragraph. Stay in character until told to stop.
