answer: |-
  Your friend made a really sharp observation, and honestly, you’re not crazy for feeling half-convinced. They hit on a deep metaphysical root that connects the two problems. However, there are specific reasons why philosophers keep them in separate bins (philosophy of language vs. aesthetics/philosophy of mind).

  Here is the breakdown of why they are related, where your friend is right, and where the distinction actually matters.

  ### 1. The Core Similarity (Where your friend is right)
  Both problems arise from the concept of **Intentionality**: the capacity of the mind (and language) to represent or be *about* something.

  *   **Empty Names:** "How can I successfully refer to 'Santa Claus' if Santa Claus does not exist?" If meaning depends on a causal link to a real object, then talking about non-existents seems like nonsense.
  *   **Fiction:** "How can I direct an emotion of grief at 'Lily Potter' when Lily Potter never existed?"

  In both cases, you have a subject directing mental activity toward an object that is ontologically missing. So, in terms of metaphysics (what kinds of things exist), your friend is correct: the two problems share the same "bug" in the system.

  ### 2. The Core Difference (Why they are distinct)
  The reason philosophers don't just solve one to solve the other is that they ask **different questions.**

  **The Empty Name Problem is a Semantic Problem.**
  It asks: *Is the sentence meaningful? Does it have truth values?*
  When you say "Sherlock Holmes lives in Baker Street," what is the logical status of that statement? Is it false? Is it meaningless? Is it true in a way we can't quantify?
  *   *Standard Solution:* Bertrand Russell argued "The Present King of France" doesn't refer to a name at all, but implies a description ("There exists a unique X such that..."), making the sentence False, not Meaningless. Or, Saul Kripke might say these names are rigid designators pointing to a "possible world" rather than actual existence.

  **The Paradox of Fiction is a Psychological/Aesthetic Problem.**
  It asks: *Are my emotions rational?*
  You already *accept* the premise that fiction is fiction. You aren't trying to refer to an object; you are trying to account for why your heart rate goes up. The paradox (usually formulated by Colin Radford) relies on three premises:
  1.  We feel fear/towards things.
  2.  Fear requires a belief that the threat is real/existing.
  3.  We know fiction is not real.
  4.  **Therefore:** Our emotions are irrational/confused.

  **Why solving Empty Names doesn't fix the Paradox of Fiction:**
  Even if you successfully solve the Empty Name problem (e.g., "We talk about abstract possible objects!"), you haven't explained why **you feel fear** when reading a book about a shark attack.
  *   If I tell you, "There is a non-existent dragon," and I solved the Empty Name problem by saying dragons are "abstract concepts," you still wouldn't run out of the room screaming if a book said a dragon was coming.
  *   **The crux:** The Paradox of Fiction is about the *disconnect between cognition (belief) and affect (emotion).* The Empty Name problem is about the *disconnect between language and reality.*

  ### 3. The Solutions Don't Overlap Perfectly
  If the problems were identical, a solution to one would be a solution to the other. They aren't.

  **Example Solution A: Meinongianism** (Things that don't exist have properties)
  *   *For Empty Names:* Great! We can refer to non-existent objects because they subsist in a way.
  *   *For Fiction:* Still fails to solve the emotion paradox. Just because "Pegasus has wings" is a true statement about a non-existent object doesn't explain why I cry at his death in a movie. It explains the grammar, not the tears.

  **Example Solution B: Pretense Theory (Kendall Walton)**
  *   *For Fiction:* Brilliant. We don't feel real emotions; we imagine ourselves feeling emotions. It's part of a "game of make-believe."
  *   *For Empty Names:* Doesn't help. When I argue "The King of France is bald," I am not pretending. I am trying to assert a fact about the real world.

  ### 4. Why Philosophers Treat Them Separately
  To answer your specific question about why they keep them separate:

  1.  **Disciplinary Silos:** The Empty Name problem belongs to Philosophy of Language and Metaphysics. The Paradox of Fiction belongs to Philosophy of Art/Aesthetics and Philosophy of Mind. They use different toolkits (logic/semantics vs. psychology/neuroscience).
  2.  **The "Irrationality" Charge:** The Paradox of Fiction challenges the coherence of our *lived experience*. It suggests human beings are fundamentally emotionally confused artists. The Empty Name problem challenges the coherence of our *linguistic practice*. It suggests our language is broken. Those are different stakes.
  3.  **The "Belief" Constraint:** Most solutions to Empty Names allow us to have thoughts about non-existents. But most definitions of *emotion* (historically) demand a belief in the reality of the object. The Paradox of Fiction exists precisely because we hold two conflicting views of human psychology simultaneously.

  ### Summary Verdict
  Your friend is right that **ontologically**, the two issues stem from the same place (how we handle non-existence).

  But they are wrong that they are the **same problem.**
  *   **Empty Names** ask: "Can I talk about nothing?"
  *   **Fiction** asks: "Can I feel about nothing?"

  You can successfully talk about nothing (solve the Empty Name problem) and still remain perfectly capable of crying over a tragedy you know is fake. Therefore, fixing the reference logic doesn't automatically fix the emotional logic. That’s why philosophers keep wrestling with the Paradox of Fiction as its own beast.

  Tell your friend he's got good instincts on the metaphysics, but he’s ignoring the phenomenology of grief!
