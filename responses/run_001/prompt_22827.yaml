              2. We do not believe fictional characters exist.
              3. Therefore, we cannot fear them.
              4. But we *do* fear them.
          *   *Key Question:* How are our emotional responses justified or explained given our cognitive state regarding existence?

  3.  **Evaluate the Friend's Claim:**
      *   *Is there overlap?* Yes. Both involve "intentionality" directed toward non-existent objects. Both challenge the link between thought/language and reality.
      *   *Is it the same problem?* No. One is about *reference/truth* (Empty Names), the other is about *emotional arousal/justification* (Fiction). You can solve Empty Names without solving the Paradox of Fiction.

  4.  **Identify Key Differences (The "Why"):**
