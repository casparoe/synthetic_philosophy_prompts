  1.  **Analyze the User's Query:**
      *   **Context:** The user was at a bar arguing with a friend about the "Paradox of Fiction."
      *   **Friend's Claim:** The Paradox of Fiction is just the Problem of Empty Names (e.g., "the present King of France") in disguise. It's about referring/attending to non-existent things.
      *   **User's Position:** Unsure. Half-convinced the friend is right but notices philosophers treat them separately. Wants to know *why* they are treated as distinct problems if they seem so similar.
      *   **Goal:** Clarify the relationship between the Paradox of Fiction and the Problem of Empty Names, explaining both similarities and crucial differences, and justify why philosophy treats them as distinct issues.

  2.  **Deconstruct the Two Problems:**

      *   **The Problem of Empty Names (Philosophy of Language/Metaphysics):**
          *   *Core Issue:* How can we meaningfully talk about or think about things that don't exist? If a name refers only to existing things, how can "Sherlock Holmes" refer to anything?
          *   *Focus:* Semantics, reference, truth conditions, ontology.
          *   *Classic Example:* "The present King of France is bald." (Russell)
          *   *Key Question:* What is the semantic content of a sentence containing a non-referring term?

      *   **The Paradox of Fiction (Philosophy of Aesthetics/Psychology of Emotion):**
          *   *Core Issue:* We feel genuine emotions (fear, pity, sadness) toward fictional characters/events, even though we know they don't exist.
          *   *Focus:* Emotion, belief, psychological states, cognitive consistency.
          *   *Classic Formulation (Coleridge/Radford):*
