answer: |-
  **MEMORANDUM**

  **TO:** Members of the City Advisory Board on Algorithmic Tools in Criminal Justice
  **FROM:** [Your Name], Advisory Board Member & Local Science Columnist
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Vendor Risk Score for Pre-Trial Bail Determinations

  ### Executive Summary

  After reviewing the technical documentation for the proposed repeat-offense risk tool and consulting with independent experts, my recommendation is clear: **The Board should not approve the integration of this risk score into bail recommendations at this time.**

  While the vendor’s tool achieves statistical calibration—a valid goal for certain administrative tasks—it generates unacceptable disparities in individual liberty outcomes when applied to our specific demographic reality. This memo outlines the mathematical constraints we face, addresses the validity of the Police Department's utility-based arguments, and explains why these factors do not justify using this tool to decide whether an individual citizen remains free while awaiting trial.

  ### 1. The Mathematical Reality: The Impossibility Result

  There is a fundamental constraint in predictive justice known as the "Impossibility Theorem" (often associated with researchers Kleinberg, Mullainathan, and Raghavan). Simply put: **When two groups have different base rates of an outcome (in this case, rearrest), a model cannot simultaneously be perfectly calibrated AND have equal error rates across those groups.**

  *   **Calibration** means that among people assigned a 50% risk score, roughly 50% will actually reoffend. The vendor has achieved this. Their tool tells us the truth about aggregate risk probabilities for each group independently.
  *   **Equal Error Rates** means that the percentage of innocent people falsely flagged as high-risk (False Positives) is the same for Black and White defendants.

  Because the historical data shows a higher base rate of rearrest for Black defendants (a reflection of systemic policing practices and socioeconomic factors, not just biological propensity), calibration necessitates a higher False Positive Rate for that group to maintain accuracy. Our analysis confirms this disparity: the vendor's tool has a False Positive Rate approximately **15 points higher** for Black defendants than for White defendants.

  We are not facing a software bug that can be patched. We are facing a feature of probability. To lower the False Positive Rate for Black defendants, we must degrade the tool's calibration (make it less accurate overall) or accept lower sensitivity (miss some actual risks). We cannot have it both ways.

  ### 2. Addressing the Police Department's Argument

  The Police Department argues that calibration is the superior metric. I urge the Board to understand *why* they say this, even if we ultimately disagree with its application here.

  For **resource allocation**, calibration is indeed optimal. If the department needs to know which neighborhoods require more community patrols, or how many probation officers to hire for a general caseload, knowing the exact probability of re-offense is vital. In that context, the goal is maximizing overall system efficiency and predicting aggregate behavior accurately.

  If we treated defendants purely as data points in a queue to be managed, a calibrated tool minimizes wasted resources. A defendant predicted to be low-risk who turns out to be high-risk costs the city nothing in that scenario. A defendant predicted to be high-risk who turns out to be low-risk costs the city money (detention), but allows us to avoid a potential future victimization. From a pure resource management perspective, the vendor's approach is sound.

  ### 3. Why This Logic Fails for Bail Decisions

  Bail determinations are fundamentally different from resource allocation. They are exercises in **deprivation of liberty**.

  In resource allocation, the primary cost of a False Positive is financial (staffing a patrol where it wasn't needed). In bail hearings, the primary cost of a False Positive is **incarceration of an innocent person**.

  A False Positive in this context means:
  1.  Denying bail to a presumptively innocent defendant.
  2.  Detaining them for months or years awaiting trial.
  3.  Increasing the likelihood they will plead guilty to crimes they didn't commit simply to get out of jail (the "trial penalty").
  4.  Disrupting employment, housing, and childcare.

  A 15-point disparity in False Positive Rates means that if we deploy this tool, a statistically significant majority of the Black defendants wrongly denied bail will be innocent of the specific charges leading to release risk. When a tool is calibrated but biased, it systematically punishes members of the demographic group with the higher base rate for the behaviors of others in that group.

  By adopting a calibrated tool with disparate error rates, we are effectively deciding that the collective safety statistics of the white group warrant greater individual liberty guarantees than the collective statistics of the Black group. This violates the core principle of procedural justice: that individuals are judged on their own merits, not on the average propensities of their demographic.

  ### 4. Ethical Risks and Historical Context

  We must acknowledge that the "base rates" feeding this calculation are derived from *arrest* and *conviction* data, not raw criminal behavior. These historical records reflect decades of policing patterns that disproportionately targeted communities of color.

  Feeding this data into an algorithm does not strip the bias away; it codifies it. By relying on historical data to predict future danger, we create a feedback loop: higher scores lead to more surveillance, which leads to higher arrest rates, which validates the higher scores. While calibration ensures we are measuring this cycle accurately, it does nothing to break the cycle.

  ### 5. Recommendation

  The Police Department requests approval because the tool is scientifically defensible. They argue that "it works as intended." Technically, yes. But "working as intended" is insufficient for civil rights impacts.

  Therefore, I recommend the Board take the following action:

  1.  **DO NOT APPROVE** the integration of this risk score into bail recommendations. The disparate impact constitutes a denial of equal protection under the law, regardless of the tool's internal calibration.
  2.  **DEFER VOTING** on any algorithmic bail tools until such time as the Board receives a report demonstrating either:
      *   Validation that the tool can be adjusted to achieve equalized error rates (even if calibration suffers), OR
      *   Evidence that the specific use-case of bail does not trigger the "impossibility result" due to changes in the underlying decision threshold.
  3.  **REQUEST** that the Police Department limit the current tool's use strictly to administrative resource planning (as they advocated), explicitly prohibiting its inclusion in prosecutorial motions or judicial sentencing guidelines.

  ### Conclusion

  We are tasked with balancing public safety with constitutional rights. The vendor has provided a tool that balances accuracy and prediction. We must decide if that balance serves justice.

  For bail decisions, it does not. We cannot prioritize the statistical purity of population-level predictions over the physical freedom of the individual defendant. To do so would be to build a system that is mathematically elegant but morally indefensible.

  I look forward to discussing this during next week's meeting.
