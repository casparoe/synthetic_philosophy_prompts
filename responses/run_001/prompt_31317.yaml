answer: |-
  The specific vulnerability you describe is formally recognized in contemporary philosophy and decision theory as **Pascal’s Mugging**.

  This term was coined by Nick Bostrom in 2009 to describe exactly this scenario: a decision-maker is exploited because their expected utility calculation assigns sufficient weight to a negligible probability of an astronomical payoff or penalty to justify surrendering any finite resource. Unlike the St. Petersburg paradox, which relies on the divergence of a mathematical series involving infinitely many outcomes, Pascal’s Mugging requires only a single hypothetical event; the mathematical explosion comes from the utility of that single outcome growing faster than the probability shrinks. It differs from standard risk aversion because risk aversion typically modifies the utility function’s curvature regarding wealth, whereas Pascal’s Mugging remains dominant if the utility function is unbounded regarding aggregate welfare or suffering. It is also distinct from general scepticism because the problem persists even if the agent grants the claim merely a tiny non-zero subjective credence; the issue is not proving the threat false, but preventing the logic of expected value from mandating compliance with absurd requests.

  The boundaries of this problem lie primarily in the assumptions of unbounded utility functions and unregulated prior probabilities. Most decision theorists agree that the vulnerability exposes a flaw in naive expected utility maximization rather than a genuine rational imperative to comply with blackmailers. To contain the paradox without abandoning probabilistic reasoning, two main solutions are proposed: either adopting a bounded utility function (capping the moral value of any possible outcome) or implementing algorithmic priors (such as those derived from Kolmogorov complexity) that penalize hypotheses describing astronomically large effects as exponentially less probable. Consequently, the pattern is not a mistake in your reasoning but a known signal that human practical reasoning must incorporate limits on both utility scale and hypothesis complexity to avoid being held hostage by imaginative counterfactuals.
