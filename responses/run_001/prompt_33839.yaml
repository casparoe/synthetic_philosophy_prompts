answer: |-
  This is an excellent piece of phenomenology, and your analysis touches the very nerve of the philosophy of language. To put it simply: **Yes, you have experienced Frege’s Puzzle in real time.** In fact, your anecdote is arguably a clearer illustration of the problem than the classic "Morning Star/Evening Star" example Frege used, because it grounds the abstract logical issue in a concrete social context.

  Here is a breakdown of what is going on philosophically, how Frege’s framework applies, and whether you are right to worry about the metaphysics of "sense."

  ### 1. Why Your Experience Fits Frege’s Puzzle

  You asked if this is truly the phenomenon Frege pointed to. The answer is affirmative. Here is why the logic holds:

  *   **The Identity Statement:** You encountered two names/tags: "Tom" and "Professor Ashford."
  *   **The Reference (*Bedeutung*):** Both names pick out the exact same human being. Referentially, the statement "Tom is Ashford" asserts that $x = x$. Logically, this is trivial.
  *   **The Cognitive Significance:** Despite the triviality of $x=x$, learning "Tom is Ashford" changed your map of the world. Before the revelation, you had two separate "mental folders." Afterward, you merged them. The information wasn't about the *object* itself changing, but about the *relationship between the ways you apprehend the object*.

  Your confusion regarding propositional knowledge is very astute. You wrote: *"I can't identify any proposition about the world that I now believe and previously didn't."* Strictly speaking, this is debatable. You did acquire a new *de re* belief (belief about the object): that the friendly man is the intimidating professor. But you are right to feel this isn't like learning a new fact about nature (e.g., "Water is H$_2$O"). It is an identification of two pre-existing nodes in your web of beliefs. This confirms Frege's point: Meaning is not exhausted by Reference.

  ### 2. Does Frege’s Solution Capture It?

  Frege solves the puzzle by introducing the **Sense (*Sinn*)**.
  *   **Reference:** The actual man (Ashford/Tom).
  *   **Sense:** The mode of presentation. For "Tom," the sense is something like *the man I met at the reception who discussed Patagonia.* For "Ashford," the sense is *the metaphysics professor known for cold intellectual rigor.*

  Because the *senses* differ, the identity statement "Tom = Ashford" is not merely asserting an object's self-identity; it is asserting a correlation between two distinct paths of access to that object. This explains the cognitive gain: you connected two different cognitive routes that converge on the same terminus.

  **However, your worry about "abstract objects" is well-founded.**
  Frege believed senses were objective, mind-independent entities existing in a "third realm" (neither physical nor mental). If you find that metaphysically dubious, you are in good company. Many contemporary philosophers accept the utility of Frege's *distinction* (Sense vs. Reference) but reject his *ontology* (that senses must be Plato-style abstract entities).

  ### 3. Alternatives: Can We Solve This Without Abstract Senses?

  You asked if there is a way to understand this without positing senses as abstract objects. There are three main approaches that attempt to preserve the insight (that presentation matters) without the heavy metaphysics:

  #### A. Millianism + Psychological Explanation
  Direct Reference theorists (like Kripke or Kaplan) argue that the meaning of a name *is just the object*. There is no "sense." "Tom" means just the man. Therefore, "Tom = Ashford" *semantically* means $x = x$.
  *   **How do they handle your case?** They argue the "informativeness" is purely psychological, not semantic. Learning "Tom is Ashford" updates your *epistemic state* by connecting two neural networks associated with the name tokens.
  *   **Critique:** This saves the metaphysics (no abstract senses!) but struggles to explain why the identity seems to carry *truth conditions*. If I doubt "Tom is Ashford" while fully believing "Tom exists" and "Ashford exists," am I irrational? Millians often have to bite the bullet and say yes, or appeal to pragmatic confusion.

  #### B. Mental Files Theory (Cognitivist Approach)
  This is likely the most satisfying alternative given your background. Philosophers like François Recanati or Ruth Millikan propose a theory of **Mental Files**.
  *   Instead of abstract senses, we have internal storage systems (dossiers). When you met "Tom," you opened File A. When you heard "Ashford," you opened File B.
  *   The discovery "Tom is Ashford" triggers a **file-merging operation**.
  *   **Why this works:** It captures the cognitive gain (the cost of merging files, the updating of data) without requiring "senses" to exist outside your head. The difference between $a=a$ and $a=b$ is a difference in **cognitive architecture**, not Platonic reality.
  *   **Implication:** This suggests the "presentation" is internal and functional, not external and abstract.

  #### C. Descriptivism (Neo-Russellian)
  You might suggest that names are actually disguised descriptions (Frege's original view on *proper names*).
  *   "Tom" = *The person I met last night.*
  *   "Ashford" = *The most intimidating prof in the dept.*
  *   Now, "Tom is Ashford" reduces to "The person I met last night is the intimidating prof." This is a substantive, non-trivial fact.
  *   **Problem:** This makes names contingent. If Ashford was never intimidating, the name wouldn't apply. Most philosophers today reject this for names (via Kripke's causal theory of reference), but it still helps explain our *thoughts* about the names.

  ### 4. What This Implies About Thought and Object

  Your experience points toward a significant philosophical conclusion: **Intensionality matters for epistemology, even if Extensionality suffices for semantics.**

  Whether you believe in "senses" or "mental files," the implication is the same: We do not interact with objects directly in the medium of thought; we interact with them through **routes of identification**.

  If I ask you, "Do you know who that man is?" pointing to Ashford, your answer depends on which file you open.
  1.  **File A (Social):** "Yes, that's Tom, the nice guy."
  2.  **File B (Academic):** "Yes, that's Prof. Ashford, the harsh grader."
  3.  **The Gap:** The cognitive dissonance arises because these routes haven't been unified yet.

  This implies that **knowledge is not just having contact with the world; it is having the right kind of access to it.** Two people can look at the same person (same reference) but fail to recognize them as the same person because their "modes of presentation" do not overlap.

  ### 5. Conclusion and Advice for Your Seminar

  To answer your specific questions:
  1.  **Is this Frege's puzzle?** Yes. It is a textbook example of how identity statements convey cognitive significance.
  2.  **Does Frege capture it?** Yes, functionally. But you don't need to buy his metaphysics (abstract senses) to keep the utility of the distinction.
  3.  **Are there non-metaphysical alternatives?** Yes. Look into **Mental File Theory** or **Doxastic State-based accounts**. These explain the "feeling" of gaining information as a change in your cognitive bookkeeping, rather than a discovery of a new abstract entity.

  **For your seminar paper or discussion:**
  Use the "Tom/Ashford" distinction to illustrate the limitations of pure Millianism (meaning = reference). Argue that while "Tom" and "Ashford" refer to the same flesh-and-blood body, they cannot substitute *salva veritate* in belief reports without losing information.
  *   *Example:* You can coherently think, "I hope Tom invites me for drinks," while simultaneously thinking, "I hope I don't run into Ashford before the exam."
  *   Even though Tom is Ashford, the truth-values of those hopes depend entirely on the *sense* or *file*, not the *referent*.

  You have stumbled onto a genuine piece of analytic philosophy. Do not dismiss it as just a "confusion"; your feeling that your knowledge expanded despite no change in the external world is the central datum that the philosophy of language tries to explain. Whether you call that datum a "sense," a "mode of presentation," or a "mental file," you've correctly identified the friction between how the world is and how we think about it.
