  **Dialogue**

  **Setting:** *A pavilion in the outskirts of Linzi, during the reign of King Xuan of Qi. Scholars gather to discuss governance. Meng Ke (Mencius) and Xun Qing (Xunzi), though separated by time in history, meet here in this imagined space of intellectual convergence.*

  **Meng Ke:** You have read my writings on the sprouts of virtue, haven’t you? I say that every person possesses the beginnings of humanity within them, like roots in fertile soil. A single cup of rice given to someone saving a life reveals a heart incapable of indifference.

  **Xun Qing:** I have, Master Meng. But consider the hungry man who refuses to share a handful of millet. He will fight over food until he starves. That is not artifice; that is the raw material of existence. I argue that human nature is fundamentally chaotic because our spontaneous desires, left untended, lead inevitably to strife and poverty.

  **Meng Ke:** But you speak of hunger as if it were the whole man. Is the desire to eat nature? Yes. But is the way one eats? When a child sees another stumble, she reaches out before thinking. Is that impulse also not nature? If you deny the root, how can you explain why men strive for ritual instead of simply devouring one another?

  **Xun Qing:** Because men see that starvation kills everyone. They create rituals and laws to survive. This creates order. But does it come from within? Imagine a piece of wood. Its nature is straight, yet to make it into a wheel, we must steam and bend it. If its nature were truly circular, the potter would do nothing. Rituals (*li*) are the bending tools. The virtue is not the wood; it is the work done upon it. I call this *wei*—conscious activity.

  **Meng Ke:** I see your distinction. You treat *xing* (nature) as the unworked material. For me, *xing* is the trajectory. Water naturally flows downward. If you dam it and splash it upward, is that its nature? No, that is force. When a man acts wickedly, is he not struggling against his own grain? Why does the wrong action feel heavy, while the right feels relieving?

  **Xun Qing:** Because we have been trained to fear the consequences of disorder! You claim moral feelings are innate; I say they are learned aversions. Consider a newborn. It cries when hungry and takes what it needs without shame. Shame is acquired through praise and blame. If nature were inherently benevolent, we would not need sages to establish kingships and punishments.

  **Meng Ke:** Sages do not invent goodness; they discover it and teach others to recognize it. Like seeing a beautiful landscape—you point it out, but the vision was always possible. If I strike my brother, I feel regret immediately, not because of the law, but because of the shock. That shock is the seed. My dispute is not that education fails, but that you deny the foundation upon which education builds.

  **Xun Qing:** And I grant you that the capacity to learn is universal. Perhaps I am harsher than necessary. Yet, look at the result: men require strict discipline to maintain peace. If the inner seed sufficed, the sage would be unnecessary.

  **Meng Ke:** Then we agree on the necessity of the teacher. Where do we part?

  **Xun Qing:** On the locus of value. For you, value is discovered internally. For me, it is constructed externally and imposed for utility. You trust the direction of the river; I worry the river floods.

  **Meng Ke:** I trust that the river knows the sea, provided we remove the dams of selfishness. If we accept your view, then ritual is merely control, not cultivation. I cannot agree to that. To cultivate implies growth from within. To control implies suppression from without. One honors the student; the other fears him.

  **Xun Qing:** Then we remain apart. I fear the beast within until tamed; you honor the spirit within until grown. Both roads lead to the same destination—a harmonious state—but neither admits the other’s starting place.

  **Meng Ke:** Indeed. Unless we agree on the meaning of 'nature,' we debate ghosts.

  ***

  **Diagnosis**

  This exchange reveals that the Mencius-Xunzi debate is indeed partially verbal, rooted in divergent definitions of *xing*, but bottoms out in a substantive metaphysical and normative divide. Initially, the characters appear to talk past each other: Mencius defines nature teleologically (as a developmental trajectory or potentiality), whereas Xunzi defines it phenomenologically (as immediate, unreflexive impulses). Once they align these definitions, they acknowledge agreement on the practical necessity of education and ritual. However, the disagreement persists at point (a): the ontological status of morality.

  For Mencius, morality is constitutive of human being; it is an inherent structural feature that realizes itself through proper nourishment. For Xunzi, morality is instrumental; it is a social technology invented to mitigate the dangers of natural instinct. This is a substantive clash regarding whether value exists independently of human construction. Point (b): Neither character significantly shifts his core thesis. Mencius concedes that raw instincts exist but denies they constitute the full essence of nature; Xunzi concedes the capacity for learning but maintains that the *source* of moral norms is extrinsic. Finally, point (c): The remaining disagreement is largely normative and conceptual rather than empirical. While empirical data on infant altruism might support Mencius' "sprouts" and infant aggression might support Xunzi's "desires," neither side can resolve the question of whether a feeling of empathy constitutes the *source* of goodness or merely a psychological mechanism utilized by external structures. Thus, evidence alone cannot settle whether virtue is "discovered" or "invented."

  ***

  **A Modern Reader's Take**

  A contemporary cognitive scientist might view this debate as a false dichotomy resolved by evolutionary psychology and dual-process theories of cognition. Modern research suggests humans possess innate "moral foundations"—such as care/harm and fairness/cheating—which align with Mencius’ "sprouts." Infants display preferences for helpful agents and distress at unfairness, suggesting a biological substrate for prosociality that Mencius correctly identified. However, evolutionary game theory supports Xunzi’s emphasis on coordination problems. While we have the hardware for empathy, the software required for large-scale societal stability often necessitates rigid institutional constraints (rituals/laws) to prevent free-riding, validating Xunzi's focus on *wei* (artificial construction).

  Ultimately, the modern view diagnoses the classical framing as confused by a lack of granularity regarding "nature." "Nature" includes both evolved intuitions (Mencius) and evolved drives for resource acquisition (Xunzi). A modern psychologist would argue that moral behavior is the interaction between these competing systems. The disagreement is thus less about the truth of observation and more about the weighting of intuition versus instruction in moral development. Xunzi captures the necessity of cultural scaffolding; Mencius captures the emotional resonance required for compliance. The most scientifically robust position is likely a synthesis: we are born with the potential for goodness, but that potential is fragile and requires Xunzian structures to flourish consistently.
