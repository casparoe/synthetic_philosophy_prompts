      *   **Step 2:** Rank Tensions.
          1.  **(a) vs (e):** Direct Logical Contradiction. Absolute rule vs. Exception.
          2.  **(c) vs (d):** Moral Status Inconsistency. Autonomy for humans vs. No Autonomy for animals (with whom we share the capacity for suffering).
          3.  **(a) vs (c):** Priority Clash. Absolute duty vs. Side constraint.
      *   **Step 3:** Solutions for each.
      *   **Step 4:** The One Change. (a) needs the scope limit.

      *Self-Correction on "One Change":* If I fix (a), (e) becomes safe. Does it fix (c)/(d)? No. That depends on the speciesism argument. However, if the core mission is SFE, (a) is the engine. Fixing the engine helps everything.
