answer: |-
  This is a precise diagnosis of the field's current state: we are trying to solve a **normative pluralism** problem using a **mathematical monism**. The literature feels stuck because it attempts to derive *the* definition of fairness from probability theory, whereas fairness is ultimately a property of the social relationship between the decision-maker, the subject, and the institution.

  Below is a structured specification of the desiderata for an adequate theory of algorithmic fairness. I have categorized them by layer, distinguished between non-negotiables and modeling choices, and culminated in the "Conflict Matrix" that explains your group's frustration.

  ---

  ### I. The Contextual & Normative Layer
  *Before defining metrics, the theory must define the stake.*

  **D1: Domain-Specificity of Harm**
  *   **Specification:** A theory must allow the definition of "fairness" to vary based on the cost of false positives vs. false negatives in the specific domain.
  *   **Motivation:** In **medical triage**, missing a positive case (false negative) is often catastrophic; in **pretrial detention**, unnecessary incarceration (false positive) is a grave rights violation. A uniform constraint (like Demographic Parity) ignores these asymmetric costs.
  *   **Status:** **[Non-Negotiable]** (If a theory treats medical risk exactly like credit risk, it fails ethically).

  **D2: Process vs. Outcome Trade-off**
  *   **Specification:** The theory must distinguish between fairness of the *procedure* used to generate a decision and fairness of the *distribution* of decisions/outcomes.
  *   **Motivation:** Sometimes a biased outcome is justified by a neutral procedure (e.g., random lottery for scarce resources); sometimes a "neutral" procedure yields systematically harmful patterns (e.g., hiring algorithms trained on biased resumes). We need to know if we are auditing the input logic or the output distribution.
  *   **Status:** **[Non-Negotiable]** (Fails to distinguish between "due process" and "restorative justice" goals).

  **D3: Temporal Stability vs. Historical Correction**
  *   **Specification:** The theory must specify whether it seeks to match historical patterns (status quo) or correct for past discrimination embedded in those patterns.
  *   **Motivation:** If $P(y=1|x)$ reflects decades of systemic exclusion, satisfying "predictive parity" merely perpetuates that exclusion. However, deviating too far from predictive accuracy destroys utility. The theory must choose whether to prioritize *accuracy relative to reality* or *equity relative to potential*.
  *   **Status:** **[Modeling Choice]** (Depends on whether the goal is efficiency or justice).

  **D4: Individual vs. Group Primacy**
  *   **Specification:** The theory must resolve whether fairness is primarily owed to individuals (no two similar people treated differently) or groups (disparate impacts must be mitigated).
  *   **Motivation:** Group fairness can mask individual injustice (favoring qualified majority members while penalizing minority super-qualifiers). Individual fairness is philosophically robust but computationally intractable (requires defining "similarity").
  *   **Status:** **[Fundamental Tension]** (Cannot satisfy both strictly; choice dictates metric family).

  ---

  ### II. The Statistical & Mathematical Layer
  *These are the formal constraints usually proposed as solutions.*

  **D5: Calibration Across Groups**
  *   **Specification:** Within any score/risk bucket, the proportion of true outcomes should be identical across protected groups. ($P(Y=1|S=s, \hat{Y}=y) = P(Y=1|S=s', \hat{Y}=y)$).
  *   **Motivation:** Ensures that a "high risk" label means the same probabilistic truth regardless of race/gender. Essential for public trust.
  *   **Status:** **[Required for High-Stakes Explanations]** (Often seen as non-negotiable in judicial contexts, optional in recommendation systems).

  **D6: Equalized Odds / Error Rate Balance**
  *   **Specification:** Conditional on the true class, the error rates (TPR/FPR) must be equal across groups. ($P(\hat{Y}=y|Y=y', S=s) = P(\hat{Y}=y|Y=y', S=s')$).
  *   **Motivation:** Prevents the system from being harsher on one group regarding mistakes. Crucial where errors cause direct harm (false positives in policing).
  *   **Status:** **[Required for Rights-Based Protections]**.

  **D7: Statistical Independence (Demographic Parity)**
  *   **Specification:** The prediction distribution must be independent of the protected attribute ($\hat{Y} \perp S$).
  *   **Motivation:** Maximizes representation; prevents disparate impact at the aggregate level. Often required by civil rights law (e.g., 4/5ths rule).
  *   **Status:** **[Contingent/Policy-Legislative]** (Mathematically incompatible with optimization; adopted only when equity is prioritized over utility).

  **D8: Causal Fairness / Counterfactual Robustness**
  *   **Specification:** Decisions should not change if we intervene on the protected attribute in the data generating process. ($\hat{Y}(s) = \hat{Y}(s')$).
  *   **Motivation:** Captures the notion of "what would happen if this person were of a different group?" Handles structural pathways vs. legitimate features.
  *   **Status:** **[Gold Standard / Ideal]** (Requires untestable assumptions; often impossible to implement without structural knowledge).

  ---

  ### III. The Epistemic & Infrastructural Layer
  *Constraints imposed by data and reality.*

  **D9: Treatment of Label Noise**
  *   **Specification:** The theory must account for the fact that ground truth labels ($Y$) are often proxies corrupted by bias.
  *   **Motivation:** In recidivism prediction, arrests $\neq$ crimes. If the label is biased, optimizing for calibration optimizes for the bias.
  *   **Status:** **[Critical Constraint]** (Ignoring this renders all fairness metrics vacuous).

  **D10: Infra-marginality Sensitivity**
  *   **Specification:** The theory must recognize that changes in thresholds affect populations at different margins differently depending on the underlying distribution.
  *   **Motivation:** Doleac & Ludwig (and others) show that enforcing FPR equality can lead to disparate treatment if the distributions of risk overlap. Two people with identical observable traits might be treated differently because the threshold was set based on group-level distribution shifts.
  *   **Status:** **[Analytical Requirement]** (Must not claim fairness if it relies on ignoring distribution shifts).

  ---

  ### IV. The Conflict Matrix: Where the Loop Breaks

  You asked specifically which subsets are jointly unsatisfiable. This is the crux of the literature's "stuck" feeling. We are attempting to satisfy **D5, D6, and D7** simultaneously alongside realistic conditions about base rates.

  #### The "Impossible Trinity" of Algorithmic Fairness
  Given a binary classifier $\hat{Y}$ and protected attribute $S$:

  1.  **Calibration (D5):** Scores mean the same thing for everyone.
  2.  **Balance / Equalized Odds (D6):** Error rates are equal for everyone.
  3.  **Group Balance / Parity (D7):** Overall acceptance rates are equal (optional) OR Base Rates differ.

  **The Theorem (Chouldechova 2017; Kleinberg et al. 2017; Hardt et al. 2016):**
  It is mathematically impossible to satisfy Calibration and Equalized Odds (both D5 and D6) simultaneously across groups **if and only if**:
  1.  There is noise/error in predictions (imperfect predictor).
  2.  **And** the base rates ($P(Y=1|S=s)$) differ across the protected groups.

  **Why this matters:**
  In almost every real-world scenario (health outcomes, loan defaults, recidivism), protected groups have different base rates due to socio-economic history (D3/D9). Therefore, a "fair" model that calibrates (D5) will inevitably have disparate error rates (violating D6), or vice versa.

  **The Consequence:**
  If a paper proposes a criterion that satisfies D5, critics immediately cite the conflict with D6. If they propose D6, critics cite the lack of Calibration. The field loops because **D5 and D6 are mutually exclusive under the condition of unequal base rates.**

  #### The "Similarity Problem" in Individual Fairness
  **The Conflict:**
  If we try to satisfy **D4 (Individual Fairness)**, we require a similarity metric $d(x_i, x_j)$. To ensure fairness, we minimize $d(x_i, x_j)$ when they share a sensitive attribute. However:
  1.  We cannot know the "ground truth" similarity without knowing the full causal structure (**D8**).
  2.  Any reasonable similarity metric tends to collapse back into proxy measures of the protected attribute.
  3.  Satisfying Individual Fairness often makes it impossible to optimize for group-level utility or legal requirements like D7.

  ---

  ### V. Implications: Abandon, Weaken, or Index?

  So, what does the literature tell us about the project of formalizing fairness?

  **1. We must abandon the search for a universal metric.**
  Because **D5 and D6 conflict given unequal base rates**, there is no "One True Math" for fairness. If a theorist claims "Fairness = X" universally, they are implicitly choosing one side of the inequality at the expense of the other.

  **2. We must weaken "Calibration" or "Parity" via context indexing.**
  We cannot demand Calibration *always*.
  *   **Medical Case:** Prioritize Recall/Sensitivity (minimize False Negatives). Accept imbalance in False Positives if necessary to catch disease.
  *   **Judicial Case:** Prioritize Specificity (minimize False Positives/liberty violations). Accept lower sensitivity if needed.
  *   **Hiring:** Here, the "outcome" (job performance) is hard to measure. Relying on calibration here might bake in productivity stereotypes.
  *   **Formalization:** Fairness criteria must be functions of a **Loss Function** derived from the specific domain's ethics. $Fairness = f(H_{FP}, H_{FN})$, not a fixed number.

  **3. We must upgrade the Epistemic Layer (D9/D10).**
  The conflict arises partly because we treat $Y$ (Ground Truth) as immutable. An adequate theory must treat $Y$ as a construct.
  *   **Requirement:** An adequacy condition is that the fairness metric remains valid even when the label distribution is shifted by historical injustice.
  *   **Implication:** We may need to relax **D5 (Calibration)** regarding observed labels and instead aim for *Causal Calibration* (D8) — i.e., calibrated against the *potential outcome*, not the recorded label. This requires moving away from standard supervised learning into causal inference, which many papers ignore.

  **4. We must accept "Fairness Through Unawareness" is insufficient, but "Counterfactual Fairness" is often inaccessible.**
  Since D4 (Individual) and D8 (Causal) require untestable structural assumptions, the practical desideratum becomes **Transparency of Assumptions**. A theory is inadequate if it hides its assumptions about causality behind a mathematical guarantee.

  ---

  ### VI. Summary Checklist for Your Reading Group

  When evaluating a new paper, apply this matrix. If the paper fails to address these tensions, it is likely adding to the loop rather than breaking it.

  | Desideratum | Status | Question to ask the presenters |
  | :--- | :--- | :--- |
  | **Unequal Base Rates** | **[Non-Negotiable Reality]** | Does your proof assume equal base rates, or do you explicitly handle the Chouldechova/Kleinberg impossibility? |
  | **Label Validity** | **[Critical Constraint]** | Do you treat the target variable $Y$ as the ground truth, or do you acknowledge label bias (e.g., arrest vs crime)? |
  | **Error Asymmetry** | **[Contextual]** | Which error is worse (False Positive or Negative)? Why? Is this justified by the domain (e.g., health vs finance)? |
  | **Metric Pluralism** | **[Solution Required]** | Does the paper propose a single metric, or a framework for selecting metrics based on stakeholder costs? |
  | **Causal Commitment** | **[High Burden]** | If counterfactuals are invoked, is the Structural Causal Model (SCM) identified? Or is it assumed? |

  ### Final Word on the "Loop"

  The literature feels stuck because researchers often try to fix the **math** to solve the **politics**.

  If you satisfy **Calibration**, you accept that some groups will be scrutinized more heavily (Different Error Rates).
  If you satisfy **Equalized Odds**, you accept that a "High Risk" label means something different for different groups (Un-calibrated).
  If you satisfy **Demographic Parity**, you accept you are sacrificing information/predictive power (Reduced Utility).

  **The Conclusion:**
  An "adequate" theory of algorithmic fairness is not a single function $f(x)$. It is a **decision-theoretic protocol** that forces stakeholders to choose *which* fairness violation they can tolerate given the ethical stakes of the application. The impossibility theorems are not bugs; they are features telling us that fairness involves trade-offs that mathematics alone cannot resolve. The "work" lies not in finding a better equation, but in negotiating the loss functions.

  Any proposal that presents a fairness criterion without explicitly stating which of the above conflicts it resolves (and which it sacrifices) should be considered methodologically incomplete.
