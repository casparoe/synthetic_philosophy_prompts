  5.  **Addressing the "Unsatisfiability" Core:**
      This is the most important part. I need to explicitly map the known impossibility theorems (Chouldechova, Kleinberg et al.) onto these desiderata.
      *   *The Triad:* Calibration, Error Rate Balance, Predictive Parity.
      *   *Base Rates:* If base rates differ across protected groups, you cannot satisfy statistical parity *and* equalized odds *and* calibration simultaneously (unless trivial).
