          *   Core Task: Identify which subsets are jointly unsatisfiable (the "inconsistency" problem) and what that implies (abandon, weaken, or index to context).
      *   **Tone:** Rigorous, philosophical yet technical, meta-analytic (explaining why the field is stuck), not just a scorecard of existing papers.

  2.  **Deconstruct the Problem:**
      The user is asking for a "Constitution of Algorithmic Fairness." They want to know the axioms of the game so they can see where the contradictions lie. The frustration stems from treating mathematical definitions as moral truths without understanding their normative commitments.

  3.  **Drafting the Desiderata Categories:**
