answer: |-
  This is a remarkably precise observation of a recurring dialectical pattern in moral philosophy and public discourse. You are identifying a specific failure mode in argumentation where **ontological confidence exceeds epistemic justification**, shielded by a specific theory of knowledge.

  There is no single, universally standardized English term for this exact configuration, but it maps cleanly onto three converging concepts in different sub-fields of philosophy. Depending on which lens you use—metaphysics of vagueness, methodology of science, or argumentation theory—you can name it differently.

  Here is the breakdown of the nearest concepts and how to name this phenomenon.

  ### 1. The Metaphysical Stance: *Moral Epistemicism*
  The specific claim your friend made—that the boundary is real, but our inability to locate it is merely a gap in theoretical understanding—is technically known as **Epistemicism**.

  *   **Origin:** Most famously associated with Timothy Williamson’s work on vagueness (e.g., *Vagueness*). Williamson argues that vague predicates (like "bald" or "tall") actually have sharp boundaries; we simply cannot know where they are due to cognitive limitations.
  *   **Application:** Your friend is applying **Normative Epistemicism**. He is asserting that the distinction (compatriot vs. stranger) is an objective feature of the moral landscape with a specific cutoff point. The Sorites-style objection (that you can't justify the exact line) is met not by accepting the category is fuzzy, but by insisting the fuzziness is epistemic (ignorance), not ontological (lack of truth).
  *   **Why it fits:** It captures the "gap as promissory note" aspect perfectly. It treats the boundary as a hidden fact waiting for a future theory to reveal it.

  ### 2. The Methodological Stance: *Protective Belt Immunity*
  From the perspective of how theories evolve, this move corresponds to **Imre Lakatos’ "Protective Belt"** strategy within a *Scientific Research Programme*.

  *   **Mechanism:** In any research programme, there is a "hard core" of irrefutable beliefs (your friend’s intuition that compatriot duties exist). Surrounding this is a "protective belt" of auxiliary hypotheses (theories about borders, institutions, and history).
  *   **The Move:** When counter-evidence arises (e.g., "Your theory can't explain why the city doesn't count"), instead of revising the hard core (the distinction), the theorist adjusts the protective belt (claiming the theory is temporarily underdeveloped).
  *   **Distinction:** Standard **Reflective Equilibrium** (Rawlsian) requires *mutual* adjustment between intuition and theory. Your friend practices **"Asymmetric Reflection"** or **"Dogmatic Equilibrium,"** where the theory must accommodate the intuition, but the intuition is immune from revision regardless of theoretical friction.

  ### 3. The Dialectical Stance: *The Moorean Shift*
  In argumentation theory, this is a variation of G.E. Moore’s defense of common sense against skepticism, often called the **Moorean Shift**.

  *   **Logic:** Instead of "Premises $\rightarrow$ Conclusion," the arguer asserts: "My conclusion (distinct obligations) is certain. Therefore, any premise that threatens it (e.g., 'boundaries require sharp justifications') must be false or incomplete."
  *   **Application:** Your friend shifts the burden of proof. He does not need to prove the boundary exists; he needs only to assert its existence as more certain than the counter-theory that demands a sharp justification.

  ---

  ### A Proposed Composite Name
  Since "Epistemicism" is specific to logic/language and "Moorean Shift" is specific to skepticism, there is room for a descriptive term that captures the *normative* application of this dynamic. Based on the structure you described, I would suggest calling this:

  #### **Normative Epistemicism**
  Or, to describe the rhetorical tactic specifically:

  #### **Theoretical Insulation of Categories**

  However, if you want a term that highlights the *one-way direction of fit* you identified, you could call it:

  #### **One-Way Reflective Stability**
  (Contrasted with "Reflective Equilibrium," which implies two-way adjustment).

  ### Distinguishing from Neighbours
  To help you deploy this in further conversation, here is how to distinguish this from the concepts you rightly set aside:

  1.  **vs. Reflective Equilibrium:** In RE, if theory shows the intuition relies on bias or inconsistency, you change the intuition. In **One-Way Stability**, the intuition acts as a *constraint* on the theory. The theory is viewed as a tool to serve the intuition, not a test of its validity.
  2.  **vs. Intuitionism:** Meta-ethical Intuitionism is the claim that moral truths are self-evident. **Normative Epistemicism** is an *epistemological* claim about those truths: it acknowledges they are *not* self-evident right now (hence the lack of boundary principle), but insists they will become evident later. It treats vagueness as temporary ignorance rather than permanent indefiniteness.
  3.  **vs. The Sorites Paradox:** The Sorites paradox concludes that because there is no sharp line, the predicate is empty (no heap exists). Your friend accepts the Sorites pressure but rejects the conclusion. He accepts **Penumbral Uncertainty** without conceding **Ontological Indeterminacy**.

  ### Summary for Debate
  When you return to this topic, you might characterize your friend's position not as "bad logic," but as **"a realist commitment to moral categories despite epistemic opacity."**

  You could press him on this specific implication: *"If you treat the boundary as a gap in our current theory rather than a defect in the distinction itself, you are committing to **Moral Epistemicism**. This implies that in principle, there is a sharp cutoff where duties end. Does this mean that theoretically, there could be a world where a single citizen owes infinite obligations compared to the person across the line? If the boundary is real but unknowable, doesn't that make the moral distinction practically useless?"*

  This moves the conversation from "Who is right?" to "What kind of moral reality are we describing?" It exposes whether his confidence rests on the actual utility of the distinction or merely on the stubbornness of his intuition.
