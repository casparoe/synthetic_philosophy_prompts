      *   *Issue 3: Scope.* Rawls: Strict on constitutional essentials. Other: Strictly speaking, no such distinction matters for day-to-day legislation or essential rights. (Wait, better: Is there a *normative* difference between constitutional essentials and ordinary politics?) Let's focus on the *necessity* of translation.
