      *   *Crux 2: Asymmetry.* Does asking religious people to translate while secular naturalism (e.g., utilitarianism, Kantianism) gets a free pass create unfair burden? Or is "secular" just the default framework?
      *   *Crux 3: Stability/Respect.* Does restricting religious reasoning actually secure stability/respect better than inclusive debate? Empirical/Philosophical test.
      *   *Selection:* I will select the "Smuggling/Neutrality" and "Asymmetry/Burden" cruxes but sharpen them to be testable/falsifiable within a theoretical framework.
      *   *Addition:* I need a practical application crux. How do these play out in specific policy debates?

