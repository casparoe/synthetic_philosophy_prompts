      *Refining Crux 2 (Integrity Cost):* What is the psychological/social cost of translation? Is it trivial or profound?
      *Refining Crux 3 (Legitimacy Perception):* Do citizens perceive laws as more legitimate when the "primary" argument matches their foundational worldview vs. a translated version?

  6.  **Drafting Section 4: Evidence & Predictions:**
      *   For each crux, need a concrete case.
