answer: |-
  Subject: Re: Your friend's take on self-deception

  Hi,

  It sounds like your friend has done a solid job summarizing the core logical puzzle that drives the debate, but I think she’s oversimplifying the current state of the literature to the point where her conclusion feels a bit off. To start, she is absolutely right about the paradox itself, which is often called the intentionalist paradox. The idea is that to lie to someone else, I must know the truth so I can deliberately obscure it, but to believe my own lie at the same time seems logically contradictory. So, the static picture of one person simultaneously believing p and believing not-p does collapse under logical scrutiny, and philosophers like Richard Arpaly or Jason Stanley have pointed out that treating the self as a single, monolithic subject really makes self-deception look impossible. If we define self-deception strictly as intentionally lying to a passive victim inside our own head who knows the truth, then yes, it is likely impossible as a literal phenomenon, and the description of it as merely motivated reasoning or bias has become the dominant way to naturalize it without needing spooky metaphysics.

  However, saying that philosophers have basically concluded it is impossible is where her summary starts to diverge from the actual conversation. While there is a strong contingent of deflationary theorists, notably Alfred Mele, who argue that we shouldn’t force the metaphor of deception onto these psychological states because no intention to deceive is required, there is certainly no consensus that the phenomenon is gone or unimportant. The debate has shifted from solving the logical paradox to understanding the functional dynamics of how we manage conflicting information. Most contemporary philosophers aren't abandoning the concept; they are trying to figure out what kind of causal structure allows a single person to hold inconsistent attitudes without falling into formal logical contradiction. So when she says the only people taking the paradox seriously are the ones who think the mind has literal partitions like Freudian unconscious compartments, she is setting up a false dichotomy. You don't need a Freudian cellar with a little homunculus guarding the door to have mental partitioning. Modern philosophy of mind leans heavily on concepts from cognitive science, like modular processing or dual-process theory, where different systems (fast intuition vs. slow deliberation) operate with limited access to each other. These aren't mystical compartments, but empirically plausible sub-personal states that can genuinely hold contradictory information without violating logic at the personal level.

  I also feel like calling it just “motivated reasoning” risks missing something distinctively phenomenological about the experience of self-deception that separates it from ordinary confusion or bias. Ordinary bias is often transparent; I might prefer a certain political candidate and ignore stats, but I usually know deep down I’m cherry-picking. In cases of genuine self-deception, the believer often feels a profound emotional investment in maintaining the illusion that goes beyond simple selective attention. It involves a defensive management of anxiety that actively suppresses the realization of the truth even when the evidence is staring them in the face. Some philosophers, drawing on Sartre or Kierkegaard, would argue that there is a structural difference between simple error and self-deception involving a flight from freedom or responsibility that a purely cognitive bias model glosses over. To treat it entirely as a data-processing error strips away the ethical and existential dimensions that many researchers think are central to why this specific form of irrationality persists so stubbornly in human life.

  Now, regarding your question about what would make me change my mind on these points, particularly since I am pushing back on her claim that the field has moved past the partition problem, I would need to see empirical evidence that dismantles the possibility of dissociated cognitive modules. If future neuroscience were to demonstrate that all cognitive access is perfectly integrated in real-time decision making—if we found out that whenever we act on a belief, the entire neural architecture has full, synchronous access to the contradictory information—then the physical basis for self-deception as anything more than memory lapses or calculation errors would evaporate. Right now, studies on implicit bias, the Stroop effect, and split-brain patients suggest that we are indeed capable of acting on information we do not consciously acknowledge, which keeps the partition model alive, albeit in a secular, scientific form rather than a psychoanalytic one. Furthermore, if we could observe cases where self-deception occurs completely without any motivational drive—where a person maintains a delusion despite having nothing to gain and everything to lose emotionally—this would support the idea that the mechanism is mechanistic and not truly deceptive, pushing me toward her bias-only view. However, until we find that, the distinction remains useful for explaining why humans cling to falsehoods with such irrational vigor compared to other kinds of mistakes.

  Your friend has grasped the easy half of the conversation, which is identifying the logical problem, but she seems to be conflating the solution to the logic puzzle with the dissolution of the psychological reality. It’s a common reaction to the messy work of philosophy of mind, where we prefer to tidy things up by declaring the problem solved via reduction, but the literature is still very much divided on whether the reduction works or whether we need to keep the richer, more puzzling description. I hope that clears things up a bit, and it is definitely worth digging into Mele's work on self-deception versus Davidson’s later writings to see how they diverge on this exact issue. Let me know what you think once you look at the material!

  Best,

  [My Name]
