answer: |-
  # Activity Design: "The Foundation Simulation"

  **Course Context:** Graduate Seminar on Global Priorities Research
  **Duration:** 90 Minutes
  **Class Size:** ~18 Students (divided into 6 groups of 3)
  **Goal:** Participants intuitively derive the **Importance–Neglectedness–Tractability (ITN)** framework through iterative decision-making rather than exposition.

  ---

  ## 1. Materials & Setup

  **Room Layout:** Tables arranged for small groups.
  **Handouts:**
  1.  **Budget Sheet:** Each group gets one "Foundation Portfolio" representing **$10 Million**.
  2.  **Cause Area Briefs (Version 1):** Contains descriptions of 5 causes with **Scale** data only (Round 1).
  3.  **Cause Area Briefs (Version 2):** Unsealed envelope containing **Existing Funding** data (Round 2).
  4.  **Cause Area Briefs (Version 3):** Unsealed envelope containing **Intervention Success Rates** data (Round 3).
  5.  **Allocation Sheet:** For recording dollar splits.

  **Facilitator Tool (Do Not Share):**
  *   **The Master Scorecard:** A spreadsheet calculating the groups' "Impact Score" based on the secret formula provided below.

  ---

  ## 2. The Cause Profiles (The Five Candidates)

  These profiles are designed so that the "best" choice changes dramatically between rounds. The names are plausible but generic enough to prevent prior knowledge bias.

  | Cause Code | Description | Scale (Lives/Value Affected) | Existing Funding | Prob. of Intervention Success |
  | :--- | :--- | :--- | :--- | :--- |
  | **A. Pandemic Prep** | Preventing biological catastrophes via surveillance/vaccines. | **100 pts** | **High (Crowded)** | **Medium (50%)** |
  | **B. Deep Tech Safety** | Preventing existential risk from future advanced technology/AI. | **100 pts** | **Very Low (Neglected)** | **Low (5%)** |
  | **C. Livestock Reform** | Improving welfare/health standards for farmed animals globally. | **80 pts** | **None (Starved)** | **High (80%)** |
  | **D. Ocean Plastic** | Cleaning up ocean microplastics and waste systems. | **40 pts** | **Medium** | **Low (10%)** |
  | **E. Global Education** | Expanding K-12 access in developing nations. | **90 pts** | **High (Crowded)** | **High (70%)** |

  *(Note: Numbers above are for your internal tracking to explain the scoring logic during the debrief.)*

  ---

  ## 3. Procedure & Rules

  ### Introduction (5 Minutes)
  Gather the class. Explain the role-play: *"You are independent philanthropic foundations. You each have $10M to invest in these five global priority areas. Our goal is to maximize the **Expected Impact** of your grant portfolio. I will update you on the state of the world after every allocation. At the end, the foundation with the highest Impact Score wins."*

  **Rule:** You must allocate exactly 100% of the $10M. You may split arbitrarily among any causes.

  ### Round 1: The Scale Illusion (15 Minutes)
  *   **Info Given:** Distribute **Version 1 Briefs**. Students see the *Description* and *Scale (Pts)* for all 5 causes. They do **not** see Funding or Success Rates.
  *   **Instruction:** *"Allocate your $10M. Remember, Impact is driven by how many people are affected."* (Subtly reinforcing Scale as the *only* known variable).
  *   **Task:** 5 minutes to decide. Write allocations. Collect papers.
  *   **Feedback:** Announce the "Impact Score" for each group based purely on Scale (Sum of Allocated Funds × Scale).
      *   *Expected Outcome:* Most groups dump money into **Pandemic Prep (100)**, **Deep Tech (100)**, and **Education (90)**.
      *   *Facilitator Comment:* "Good use of resources based on the data available. However, the world is dynamic."

  ### Round 2: The Crowding Reality (25 Minutes)
  *   **Info Given:** Hand out the **Envelope Version 2**. Inside: **"Current World Funding"** data.
      *   *Pandemic Prep:* Already receiving $10B annually.
      *   *Deep Tech:* Receiving $0.5M annually.
      *   *Livestock:* Receiving $0 annually.
      *   *Ocean:* Receiving $2B annually.
      *   *Education:* Receiving $5B annually.
  *   **Conceptual Nudge:** Say: *"New intelligence: Many other foundations are funding some of these issues. Economic theory suggests that marginal impact decreases when an issue is funded by others (diminishing returns)."*
  *   **Instruction:** *"Reallocate your $10M. Now, Impact depends on Scale **and** Neglectedness."*
  *   **Task:** 10 minutes to debate. 5 minutes to allocate. Collect papers.
  *   **Feedback:** Announce the new Impact Scores. Calculate: `Allocated Funds × Scale × Neglectedness Multiplier`.
      *   *Multiplier Logic:* High Funding = 0.1 multiplier. Low Funding = 0.9+ multiplier.
      *   *Expected Outcome:* Pandemic Prep scores drop drastically. Deep Tech remains competitive. Livestock Reform shoots up (high scale, no competition).
      *   *Observation:* Groups will begin talking about "Where else is the money going?"

  ### Round 3: The Feasibility Trap (25 Minutes)
  *   **Info Given:** Hand out the **Envelope Version 3**. Inside: **"Intervention Success Rate"**.
      *   *Pandemic Prep:* Feasible intervention exists (50%).
      *   *Deep Tech:* Technical feasibility unknown (5%).
      *   *Livestock Reform:* Evidence-backed policy levers exist (80%).
      *   *Ocean Plastic:* Technically extremely difficult (10%).
      *   *Education:* Proven models exist (70%).
  *   **Conceptual Nudge:** Say: *"Final data: Some causes are incredibly difficult to solve, regardless of how big the problem is. A solution might not exist yet."*
  *   **Instruction:** *"Final reallocation. Maximize **Expected Value**."*
  *   **Task:** 10 minutes to debate. 5 minutes to allocate. Collect papers.
  *   **Feedback:** Announce Final Winners.
  *   **Expected Outcome:** **Livestock Reform (C)** should emerge as the clear champion (High Scale × High Neglect × High Solvability). Deep Tech usually suffers here due to low success rate.

  ---

  ## 4. Facilitator's Answer Key (Scoring Logic)

  Keep this hidden. Multiply the dollars allocated by the following factors for each cause to determine the group's total Impact Score.

  **Formula:** `Impact = Allocation × Scale × Neglect_Weight × Solve_Prob`

  **The Factors:**

  | Cause | Scale | Neglect Weight (Derived from Funding) | Solve Prob | **Composite Multiplier** |
  | :--- | :--- | :--- | :--- | :--- |
  | **A. Pandemic** | 100 | 0.1 (Crowded) | 0.50 | **5** |
  | **B. Deep Tech** | 100 | 0.9 (Neglected) | 0.05 | **4.5** |
  | **C. Livestock** | 80 | 0.95 (Starved) | 0.80 | **60.8** |
  | **D. Ocean** | 40 | 0.3 (Med) | 0.10 | **1.2** |
  | **E. Education**| 90 | 0.1 (Crowded) | 0.70 | **6.3** |

  *Note: Even though Pandemic and Deep Tech have higher Scale, C dominates because it combines moderate-high scale with both neglect and solvability.*

  **Post-Class Reveal:**
  Show the table. Ask: "Did anyone intentionally build a product that looks like this?" (Usually no one does perfectly).

  ---

  ## 5. Debrief: From Experience to Framework (20 Minutes)

  This is the most critical phase. Do not lecture. Ask questions to surface the logic.

  **Step 1: Map the Experience**
  *   "In Round 1, why did you pick Pandemic and Deep Tech?"
      *   *Student:* "Because the scale numbers were highest."
      *   *Facilitator:* "Write that word on the board: **IMPORTANCE**."
  *   "In Round 2, why did you move money away from Pandemic?"
      *   *Student:* "Because everyone else was funding it already."
      *   *Facilitator:* "So, the same amount of money helps less when there's competition? What does that represent?"
      *   *Student:* "It's not being looked at much."
      *   *Facilitator:* "Write: **NEGLECTEDNESS** (or Opportunity)."
  *   "In Round 3, why did you pull back from Deep Tech even though it was neglected?"
      *   *Student:* "Because the success rate was too low."
      *   *Facilitator:* "So a problem isn't useful to work on if we can't solve it? Write: **TRACTABILITY**."

  **Step 2: The Multiplicative Moment**
  *   Point to the three words on the board.
  *   "Notice how in Round 1, Scale alone drove decisions. But once we saw Round 2, the 'score' changed."
  *   "If Scale is 10, Neglectedness is 0.1 (crowded), and Tractability is 0.1 (hard)... what is the Total Value?"
      *   *Wait for student calculation.* "Is it 10 + 0.1 + 0.1? Or is it..."
      *   *Guide them:* "If *any* of these is zero, what happens to your impact?" (It becomes zero).
      *   "That means they multiply." Write: **$Importance \times Neglectedness \times Tractability$**.

  **Step 3: Naming It**
  *   "This mental model you discovered over 20 minutes is the standard heuristic for Effective Philanthropy, often called the **ITN Framework** (Importance, Tractability, Neglectedness)."

  ---

  ## 6. Troubleshooting Predictable Pitfalls

  ### 1. Groups Fixate on One Criterion
  *   **Scenario:** Group refuses to touch Ocean Plastic in Round 3 because it scored well on Neglectedness, refusing to acknowledge low solvability.
  *   **Fix:** In the feedback loop, explicitly highlight their score drop. "Group 4 stayed heavy on Ocean Plastic. In Round 2 you gained points. In Round 3 you lost 80% of that value because the science failed. Why didn't you pivot?"

  ### 2. The "Short-Circuit" (Obvious Winner Too Early)
  *   **Risk:** If "Livestock Reform" looks obviously best in Round 2 because the numbers are too stark, the lesson is learned too fast.
  *   **Fix:** Adjust Round 2 info. Make Pandemic Look "Less Crowded" initially, only revealing extreme crowding in Round 2. Ensure Deep Tech looks attractive enough to keep groups conflicted until Round 3.
  *   **Alternative:** If they catch it early, lean into it. "Excellent observation by Group 2. Does that mean all others are wrong?" Force them to defend why they didn't diversify, leading to discussion on Risk Hedging vs. Optimization.

  ### 3. Grading Over Reasoning
  *   **Risk:** Groups obsess over "What does the teacher want?" rather than exploring the data.
  *   **Fix:** Frame the scoring as "World Consequences" not "Classroom Points." Use language like "Projected Lives Saved" rather than "Score." If asked directly about the rubric: "There is no rubric; this is based on a simulation model of global impact."

  ### 4. Facilitator Slip-Up
  *   **Risk:** Accidentally saying "Tractability" or "Neglectedness" before the reveal.
  *   **Fix:** Stick to the script language: "Feasibility," "Competition," "Scale." If you slip, apologize immediately: "Oops, I'm trying to describe that without naming it yet. Let's call it 'Problem Difficulty' for now."

  ---

  ## 7. Honest Limitations & Critical Reflection

  End the seminar by acknowledging the gaps between the game and reality. This prevents naive application of the framework.

  **Discussion Questions:**
  1.  **Epistemic Humility:** "In this game, we gave you exact probabilities (80%, 5%). In the real world, these numbers are guesses based on imperfect models. How does deep uncertainty change the calculation?"
      *   *Key Point:* We prioritize robust, flexible strategies or focus on reducing uncertainty itself.
  2.  **Commensurability:** "The game assumes you can trade off saving human lives against cleaning plastic. Is there a moral dimension where some causes are 'wrong' to ignore regardless of the math?"
      *   *Key Point:* This highlights the "value pluralism" critique. The ITN framework implies we can quantify suffering across domains (welfarist assumption), which is philosophically substantive.
  3.  **Strategic Interdependence:** "We treated you as isolated foundations. In reality, funding impacts other actors' incentives (signaling, crowding-in/out). Did the game capture coordination dynamics?"
      *   *Key Point:* Coordination failures often create the neglect we observe, but solving them requires collective action, not just individual allocation.

