      *Alternative:* Keep the scoring secret. Tell them: "We want to maximize 'Lives Improved'. Your allocation determines this."
      End of Round 1: "Group A improved 1 million lives. Group B improved 500k." (Derived from their Scale choices).
      End of Round 2: "Now that we account for crowding... Group A's impact dropped. Group C rose."
      This requires me to hold the spreadsheet. It is more immersive. I will design it this way. I provide the *data* to the students (Card A, Card B), I hold the *formula* (Secret Sheet). I give feedback on their impact score at the start of the next round.

      *Wait, one more check:* "Scoring rule that rewards groups... without using real money."
