prompt: |-
  I teach a graduate seminar on global priorities research — about 18 students, one 90-minute session. I want an in-class activity that makes participants feel the force of the importance–tractability–neglectedness framework without my having to lecture it at them. Design a multi-round resource-allocation game in which small groups act as a foundation deciding how to distribute a fixed budget across a set of candidate cause areas.

  The cause profiles should be constructed so that the sequence of rounds forces participants to discover the multiplicative logic themselves. In the first round, groups should see only descriptions of the problems and their scale, and they should predictably fund the biggest, most salient ones. In the second round, they receive new information about what other funders are already doing — some of the problems they chose turn out to be crowded, and they must confront the idea that marginal impact depends on how many others are already working there. In the third round, they receive evidence about intervention effectiveness — some of the remaining candidates turn out to be nearly intractable despite being large and neglected, and they must confront the idea that a problem's being big and ignored does not matter if you cannot make progress on it. The sequence should lead someone in the room to say something like "we should be looking for problems that are big, solvable, and ignored" before the facilitator names the framework.

  Give me the full setup: the cause-area cards with their profiles (specify scale, solvability, and current funding levels in concrete terms the groups can use), the budget constraint, the rules for each round, the information revealed between rounds, a scoring rule that rewards groups for maximizing expected impact without using real money, and a detailed debrief that maps what happened in each round onto the three components of the framework and shows how they combine multiplicatively rather than additively. Also tell me what will predictably go wrong the first time I run it — groups that fixate on a single criterion and refuse to update between rounds, groups that treat the scoring rule as the point rather than the reasoning, the risk that one cause area is too obviously the right answer and short-circuits the discovery, and the risk that the facilitator accidentally names the framework too early — and how to handle each. Be honest about what the activity cannot capture: in the real world, all three parameters are deeply uncertain and contested, whereas the game hands participants clean numbers; the game also cannot reproduce the fact that real cause prioritization involves comparing problems that differ in kind, not just in degree, so the commensurability the scoring rule assumes is itself a substantive philosophical commitment the facilitator should flag.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on global priorities research (18 students, 1 session = 90 mins).
      *   **Goal:** Make participants *feel* the force of the Importance-Tractability-Neglectedness (ITN) framework without lecturing. They need to discover the multiplicative logic themselves.
      *   **Format:** Multi-round resource-allocation game (small groups acting as a foundation).
      *   **Mechanism:**
          *   Round 1: Information on Scale (Importance). Groups predictably fund big/salient problems.
          *   Round 2: Info on Funding/Crowding (Neglectedness). Marginal impact drops in crowded areas.
          *   Round 3: Info on Solvability/Effectiveness (Tractability). Some big/neglected areas are actually hard to solve.
          *   Outcome: Students naturally articulate "Big, Solvable, Ignored."
      *   **Deliverables:** Full setup (cards, budget, rules, info reveals, scoring), detailed debrief, pitfalls/countermeasures, and limitations/honesty about what the game can't capture.

  2.  **Design Constraints & Logistics:**
      *   **Time:** 90 minutes total.
          *   Intro (5 min)
          *   Round 1 + Discussion (15 min)
          *   Round 2 + Discussion (20 min)
          *   Round 3 + Discussion (20 min)
          *   Debrief/Framework Reveal (20 min)
          *   Buffer/Q&A (10 min)
      *   **Group Size:** 18 students $\rightarrow$ 6 groups of 3 (ideal for discussion) or 4 groups of 4-5. Let's go with 6 groups of 3 for more hands-on participation per person.
      *   **Budget:** Needs to be abstract but finite. Let's use "$10M" as the foundation budget per group.
      *   **Scoring:** Needs to be simple enough to calculate quickly in class but complex enough to show trade-offs. A linear impact score ($Scale \times Tractability \times Neglectedness$) works best for the reveal. To make it a game without doing math constantly, we can hide the true formula initially and give feedback *after* each round.

  3.  **Developing the Cause Areas (The Cards):**
      *   Need 5-6 cause areas to ensure diversity but allow distinct ranking shifts.
      *   Need to tune parameters so the optimal strategy shifts across rounds.
      *   *Idea:* Create 4 core causes that drive the learning, plus maybe 1 or 2 distractors.
      *   *Cause 1 (The Trap):* Huge scale, high funding, low tractability (e.g., Global Governance Reform / Geo-engineering). Good for Round 1, bad for later.
      *   *Cause 2 (The Crowded Winner):* High scale, medium neglectedness, high tractability (e.g., Malaria Bed Nets). Often chosen early, but marginal utility drops in R2.
      *   *Cause 3 (The ITN Champion):* Medium-High scale, very low funding, high tractability (e.g., Deworming / Livestock Policy). The target answer.
      *   *Cause 4 (The Intractable Giant):* Massive scale, zero funding, near-zero tractability (e.g., Preventing AI Takeover? Or something slightly softer like "Reforming International Trade Law"). Actually, let's use something concrete like "Eradicating All Nuclear Warheads". It sounds important, has no money, but is nearly impossible right now.
      *   *Cause 5 (The Niche Fixer):* Small scale, low funding, high tractability. Good for efficiency, but misses "Importance."
      *   *Refinement for the Game:* To keep math manageable in 90 mins, let's define the "True Impact Score" explicitly for the facilitator's scoring sheet, but hide the components from the students until revealed.
      *   *Parameters:* Use percentages or multipliers.
          *   Scale (S): 0-100 points.
          *   Neglectedness (N): $100 - Current Funding \%$. Or better, a multiplier based on diminishing returns. Let's use a "Marginal Value Multiplier" revealed in R2.
          *   Tractability (T): Success probability %.
          *   Total Impact = $S \times N_{multiplier} \times T$.

  4.  **Drafting the Rounds:**
      *   **Round 1 (Scale Only):** Students see Scale. They will pick the highest S causes.
      *   **Round 2 (Add Crowding):** Tell them how much money exists elsewhere. Update their allocation. If they stay on high S, they might find out others are already there. *Correction:* To make them *discover* neglectedness, the data needs to show that some high-S causes have massive existing funds (lowering marginal impact), while others don't.
      *   **Round 3 (Add Tractability):** Reveal success rates. Some previously viable causes are now dead ends.
      *   **Scoring Rule:** To avoid calculation hell, assign points after every round based on the "true impact." The group with the most points wins. But wait, if I give points, they optimize for *my* criteria, not necessarily explore. Better: Ask them to allocate. Then tell them their "Impact Score" based on hidden variables. They must adjust allocation next round to improve.

  5.  **Refining the Logic (Self-Correction):**
      *   If I just hand them cards, they won't know the *formula*.
      *   Better approach: Hand them "Impact Potential Estimates" that change.
      *   *Actually*, the prompt asks for a specific flow: Scale -> Neglectedness -> Tractability.
      *   Let's create "Confidential Briefs" for each round.
      *   **Constraint Check:** Can they calculate this in 90 mins?
      *   Yes, if the numbers are clean integers.
      *   **The "Score":** I will act as the Oracle. After each round, I calculate their actual impact score using the hidden formula and feed it back as a "Grade." This drives competition.
      *   **The Formula (Hidden):** Expected Impact = (Size of Problem in Lives Saved/Value) $\times$ (Probability of Success) $\times$ (Leverage/Marginal Impact due to lack of funding).
      *   To simplify:
          *   Base Score = Scale Points.
          *   R2 Modifier: Crowding Penalty.
          *   R3 Modifier: Feasibility Probability.
      *   Wait, to encourage discovery, I shouldn't penalize them too harshly early on, or they will guess the formula.
      *   *Alternative:* Just ask them to rank/distribute. Give feedback: "If you had distributed X, you would have achieved Y units of good."

      *Let's stick closer to the prompt's request:* "A scoring rule that rewards groups for maximizing expected impact... maps what happened onto three components."
      Okay, I will give them a score at the end of the game, but provide *feedback* at the end of each round so they know if they are winning or losing relative to potential.

      *Actually, the strongest pedagogical move:* Give them a fixed budget ($10M). In R1 they distribute. I reveal the actual cost-effectiveness. In R2 they rebudget. I reveal the crowding effect.
      *Simplification:* To save time, they make ONE decision per round based on NEW info, adjusting the previous round's logic.
      No, better: They propose an allocation at the start of *each* round.
      *R1 Allocation:* Based only on Scale.
      *R2 Allocation:* Scale + Funding Info.
      *R3 Allocation:* Scale + Funding + Solvability Info.
      At the end of the 3 rounds, compare who did best in R3. The "Winner" is the one who found the ITN sweet spot.
      Actually, the prompt says "a sequence of rounds forces participants to discover the multiplicative logic."
      So, the scoring should reflect the changing environment.
      *Decision:* Each round, groups submit an allocation. I calculate their *Realized Impact* for that scenario. If the scores drop when they stick to old choices (due to new info), they feel the shift.

  6.  **Developing the Data (The Math):**
      *   We need a clear winner that looks wrong at first.
      *   **Cause A (Global Health - Generic):** Scale 90, Funding Already High (Crowded), Tractability 80%.
      *   **Cause B (AI Safety - Speculative):** Scale 100, Funding Low, Tractability 10% (Hard).
      *   **Cause C (Antimicrobial Resistance):** Scale 80, Funding Very Low (Neglected), Tractability 70% (Solvable). -> *This should be the winner.*
      *   **Cause D (Cancer Research):** Scale 70, Funding Very High, Tractability 50%.
      *   **Cause E (Space Debris):** Scale 40, Funding Low, Tractability 90%.
      *   *Wait, I need them to think A or D is better in R1.*
      *   R1 (Scale): A(90), B(100), D(70). They pick B and A.
      *   R2 (Funding): Show everyone is funding A and B heavily. Marginal value drops 10x for A and B. C has 0 funding.
      *   R3 (Solvability): Show B (AI) is super hard (10%). Show C is solvable (70%).
      *   Result: C becomes the obvious winner by R3.

  7.  **Addressing Limitations:**
      *   Real world uncertainty vs. clean numbers.
      *   Commensurability assumption.
      *   Facilitator discipline (don't say "ITN" too soon).

  8.  **Drafting the Content:**
      *   *Materials:* 6 sets of Cause Cards (one per group). Budget token sheets. Score tracker.
      *   *Timeline:* Strict timekeeping is crucial for grad seminars.
      *   *Debrief:* Needs to explicitly name the framework *after* they say the words.

  9.  **Reviewing against Prompt Requirements:**
      *   *Multi-round?* Yes (3 rounds).
      *   *Small groups?* Yes (6 x 3).
      *   *Fixed budget?* Yes ($10M).
      *   *Discovery logic?* Scale -> Crowding -> Intractability.
      *   *Pitfalls included?* Yes (fixation, short-circuit, etc.).
      *   *Limitations acknowledged?* Yes (uncertainty, commensurability).
      *   *Tone:* Practical, academic, facilitator-focused.

  10. **Final Polish:**
      *   Ensure the math is transparent to me (the user/facilitator) but opaque to the students initially.
      *   Make sure the "Scoring Rule" allows comparison without needing students to do calculus.
      *   Refine the "Cause Profiles" to be realistic enough to trigger the intuition (e.g., Malaria vs. Asteroid Defense).

      *(Self-Correction on Scoring)*: If I calculate the score secretly, they might not trust it. Instead, I will use a "Point System" on the board. At the end of each round, I announce the "Effective Cost Per Life Year" of their current allocation compared to the theoretical optimum. No, that's too technical.
      Let's go with: "Total Impact Score." I compute this internally. At the end of the game, I display who got the most points. This validates the strategy. During the rounds, I give qualitative feedback ("You have allocated too heavily here; look at the data") to nudge without giving away the formula.
      *Wait, better:* The prompt asks for "a scoring rule that rewards groups... without using real money."
      Okay, I will provide a "Dashboard" where they calculate a proxy metric based on public info *in that round*.
      R1 Metric: "Potential Reach" (Just Scale).
      R2 Metric: "Reach x Neglect Multiplier".
      R3 Metric: "Expected Value" (Reach x Neglect x Success Rate).
      This makes the math visible as the framework emerges. *But* the goal is for *them* to discover the logic. If I give the formula explicitly, I am lecturing.
      *Best compromise:* I calculate the "Real Impact" behind the scenes and show them a leaderboard at the end of the class. Between rounds, I tell them whether their allocation moves them up or down relative to the "True Optimal Strategy." This pressures them to iterate.

      *Revised Plan for Mechanics:*
      1. Give $10M budget.
      2. Round 1: Allocate. I score them. Feedback: "Your impact is proportional to Scale."
      3. Round 2: New Info on Funding. Recalculate. Feedback: "Some causes are less effective because others are funding them."
      4. Round 3: New Info on Success Rates. Recalculate. Feedback: "Success matters."
      5. Final Winner determined by R3 performance.
      6. Debrief explains the hidden formula used for scoring.

      *Wait, I need the cause profiles.* I will write them out clearly with the specific numbers I want used in the "Answer Key" for the facilitator.

      *Check constraints again:* "In the first round... predictably fund biggest, most salient." "In second... confront idea that marginal impact depends on others." "Third... evidence effectiveness... problem big and ignored doesn't matter if cannot make progress."
      Okay, the mechanics must support this flow.
      R1: Show Scale. (High Scale = High Points).
      R2: Show Funding Levels. (If Funding > Threshold, Scale Points halved).
      R3: Show Success Probability. (Scale Points * P(Success)).
      If I tell them the rules of the points system *as we go*, do I spoil it?
      If I tell them "Points = Scale", then in R2 "Points = Scale * (1-Funding)", they are being told the formula.
      *Pedagogical Nuance:* I should reveal the *criteria* for judging impact, not necessarily the arithmetic formula. "In this round, we evaluate success based on X and Y." That guides them toward the multiplicative thinking without me defining the algebra.
      *Decision:* I will reveal the evaluation criteria for each round explicitly. "For the purpose of today's game, your impact in Round 1 is calculated simply by Scale." "In Round 2, impact is Scale adjusted for Crowding." This teaches them the components sequentially.
