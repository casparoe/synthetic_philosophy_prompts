      R1: Score = Sum(Funding_i * Scale_i). (They see Scale on card).
      R2: Score = Sum(Funding_i * Scale_i * Neglect_Multiplier). (I reveal Neglect on card).
      R3: Score = Sum(Funding_i * Scale_i * Neglect_Multiplier * Tractability).
