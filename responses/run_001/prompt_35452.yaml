answer: |-
  ### 1. Setup and Scope
  We define "debate" as a zero-sum game where two agents propose distinct answers to a query $Q$, presenting arguments before a judge $J$. $J$ possesses strictly fewer cognitive capabilities than the agents regarding $Q$ (e.g., cannot compute the answer independently). $Q$ ranges over undetectable or computationally intensive truths (mathematical proofs, complex system states, historical records). One agent ($H$) seeks $J$ to select the truth; the other ($A$) seeks $J$ to select falsehood, optimizing $J$’s biases and attention economy. No ground-truth oracle exists during the interaction; oversight is scalable only if $J$’s verification cost remains polynomial in the size of $Q$’s representation, not the complexity of the solution. We assume standard rational agency: both debaters know the protocol perfectly and act to maximize their payoff.

  ### 2. The Fixed Points
  These three requirements constitute the definition of successful scalable oversight; dropping any renders the system merely a contest of wits.

  **1. Truth Monotonicity.** The probability of $J$ selecting the correct answer must monotonically increase with the strength of truthful evidence provided by $H$.
  *Failure Mode:* A protocol where eloquent falsehoods dominate because $J$ rewards fluency over accuracy. Even if $H$ speaks truth, if the mechanism allows $A$ to drown $H$ in volume, oversight fails.
  *Defense:* Without this, the mechanism incentivizes persuasion, not truth-seeking.

  **2. Atomic Verifiability.** Every substantive claim asserted by a debater must be reducible to a "micro-proof" or data point that $J$ can validate within bounded effort without external assistance.
  *Failure Mode:* $A$ asserts a complex dependency (e.g., "This function is secure because library X is clean") and challenges $H$ to disprove it. $J$ cannot check library X. $A$ wins via deference.
  *Defense:* If $J$ cannot locally verify the link between premises and conclusion, the entire chain rests on authority, breaking scalability.

  **3. Strategic Non-Manipulability.** The protocol must prevent a skilled $A$ from forcing $H$ into a state where defending truth requires more resources than the judge can afford.
  *Failure Mode:* $A$ introduces irrelevant but plausible technical details ("complexity traps") that consume $J$'s attention span, causing $J$ to abandon the search for truth due to fatigue.
  *Defense:* If the cost of defense scales with $A$'s aggression rather than the truth's complexity, the honest agent loses by exhaustion.

  ### 3. The Contested Requirements
  These properties are desirable for specific utility functions but are not fundamental to the core safety objective.

  **Preference: Natural Language Expressivity.**
  *Camp:* Alignment researchers concerned with alignment to human intent and interpretability.
  *Bought Benefit:* Higher comfort and engagement for $J$, allowing deployment with human judges.
  *Trade-off:* Strict logical formalisms provide better Atom Verifiability but lower usability. Natural language allows $A$ to smuggle ambiguity. I classify this as optional: if safety is paramount, formal logic should replace language.

  **Preference: Constant-Round Constraints.**
  *Camp:* Latency-sensitive engineering teams.
  *Bought Benefit:* Predictable inference costs and low latency for decision-making.
  *Trade-off:* Multi-round recursive debate allows deeper excavation of lies. Limiting rounds prevents $A$ from being caught in deep contradictions but also stops $H$ from exposing them. This is a performance optimization, not a safety guarantee.

  **Preference: Symmetric Information.**
  *Camp:* Game theorists requiring fairness.
  *Bought Benefit:* Prevents $A$ from knowing $H$'s strategy beforehand.
  *Trade-off:* In reality, $A$ often knows the model weights or training data better. Requiring symmetry ignores the asymmetry inherent in deployment (where the AI knows more than the user). Protocols must handle imperfect information asymmetry.

  ### 4. Where the List Breaks
  There is a fundamental joint inconsistency between **Arbitrary Question Class**, **Bounded Judge Effort**, and **Perfect Adversarial Robustness**.

  **The Conflict:**
  To satisfy **Perfect Adversarial Robustness**, the judge must definitively separate truth from deception regardless of $A$'s sophistication. However, if the **Question Class** includes PSPACE-complete problems or arbitrarily deep causal chains, the honest proof length grows exponentially. Since **Judges are Bounded**, $J$ cannot verify exponential-length truth chains against exponential-length lies generated by $A$ in the same timeframe. An adversary can always generate a "noise wall"—plausible-looking counter-arguments that require more effort to debunk than the judge can expend—unless the question is structurally compressed.

  **Which Requirement Gives:**
  **Arbitrary Question Class** must be surrendered. No debate protocol can scale to *any* question under bounded effort. We must restrict oversight to the complexity class where truth admits short certificates (roughly NP or AM classes). For questions outside this class (e.g., proving general convergence of stochastic gradient descent across all hyperparameters), debate fails. You cannot have a scalable oversight protocol that guarantees safety for problems harder than the judge can conceptually comprehend *and* verify in steps. Safety necessitates pruning the problem space to tractable subsets or accepting probabilistic rather than deterministic truth guarantees. I mandate dropping "Arbitrariness" to preserve the integrity of the remaining criteria.

  ### 5. The Single Most Diagnostic Requirement
  **Requirement: Micro-Step Verifiability (MSV).**
  Every atomic assertion made during debate must be immediately verifiable by the judge using only their local knowledge base or standard retrieval tools available within the session.

  **What It Excludes:**
  It rules out "Holistic Evaluation" proposals where judges compare the *feel* or *coherence* of two multi-page summaries. It also excludes protocols relying on "trusted AI intermediaries" whose outputs are taken at face value without verification.

  **What Survives:**
  It leaves only recursive decompositions (e.g., HCH-style debate) where every claim is recursively queried until reaching a primitive data point the judge accepts (e.g., "Show me line 42"). It demands that truth be constructed brick-by-brick on the judge's desk, not imported as a finished statue. MSV is the filter that distinguishes a tool for truth from a tool for narrative control.

  ### 6. Verdict
  If building a protocol, I hold **Micro-Step Verifiability** and **Strategic Non-Manipulability** fixed as non-negotiable anchors. These ensure that the judge retains sovereignty over the final decision. I immediately sacrifice **Arbitrary Question Class**, restricting the system to tractable sub-problems where short proofs exist. I relax **Natural Language Expressivity**, enforcing a semi-formal syntax to strip ambiguity. Under pressure, I would accept **Probabilistic Truth** (high confidence, not absolute certainty) to maintain speed, provided the confidence bounds are calibrated. Finally, I would relax **Perfect Adversarial Robustness** to cover only standard computational adversaries, acknowledging that quantum-level superintelligence breaks current scalable oversight models entirely.
