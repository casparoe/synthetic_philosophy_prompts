answer: |-
  I recommend accepting this submission as a short position note, contingent upon significant revisions to strictly distinguish between the mathematical Church-Turing thesis and the physical Church-Turing thesis.

  The division among the reviewers stems from a genuine ambiguity in how the term "Church-Turing thesis" (CTT) is used across subfields. Two reviewers correctly note that, in its original formulation, CTT is a claim about effective calculability and mathematical function equivalence; under this definition, it is indeed immune to physical experiments, much like a definition of addition is immune to arithmetic errors. If the authors intend to refute the standard CTT based on their relativistic model, reviewers who view CTT as a logical tautology of algorithmic description are justified in seeing the work as a category error.

  However, the other half of the committee identifies a parallel, well-entrenched claim in the philosophy of physics and complexity theory: the Physical Church-Turing Thesis (PCTT). Unlike the mathematical thesis, PCTT asserts that any computation possible by a physical system in our universe can be simulated by a Turing machine within polynomial overhead. Because this is an empirical claim about the laws of nature rather than a definition of algorithms, a concrete relativistic counterexample such as the Malament-Hogarth setup provided here constitutes a legitimate topic for inquiry. Dismissing the paper outright would signal that our conference avoids questions regarding the physical realizability of computational limits, which contradicts our stated scope on theory of computation foundations.

  That said, accepting the paper into the main track as a definitive result grants undue weight to speculative physics without sufficient qualification. The authors currently present their results as a blanket refutation of the Church-Turing thesis, glossing over the critical distinction that their counterexample targets the physical feasibility of the thesis, not its mathematical utility. Furthermore, the proposal does not adequately address known instabilities of Malament-Hogarth spacetimes, such as infinite blueshift effects near the horizon, which may render the machine physically impossible regardless of the spacetime geometry. A position note format mitigates the risk of the paper being cited as established fact while preserving the opportunity to surface this foundational debate.

  To proceed with acceptance, the authors must implement the following specific changes:
  1.  **Clarify Terminology:** The abstract and introduction must explicitly replace generic references to "the Church-Turing thesis" with "the Physical Church-Turing Thesis (PCTT)." They must concede that their model does not affect the mathematical characterization of computability.
  2.  **Acknowledge Physical Constraints:** A new section must discuss potential physical obstacles to the proposed setup, such as cosmic censorship conjectures, energy requirements, or signal degradation via blueshift, treating these as limitations on the *realizability* of the counterexample rather than dismissing them entirely.
  3.  **Temper Conclusions:** All claims of "refuting the Church-Turing thesis" must be revised to "challenging the robustness of the Physical Church-Turing Thesis," emphasizing that the result relies on idealized general relativity rather than verified quantum gravity physics.

  By adopting these measures, the paper transforms from a potentially misleading refutation into a constructive position note that clarifies the boundary between algorithmic theory and physical realizability, satisfying both groups of reviewers.
