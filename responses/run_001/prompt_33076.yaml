answer: |-
  I understand the "bits" argument physically, but morality isn't usually about the physical substrate—it's about the relationships and agreements those bits represent. You compare this to losing a dream, but dreams aren't collaborative projects governed by mutual consent; when you join a multiplayer world, you enter a social contract where we implicitly agree to treat certain virtual actions as meaningful and protected. When a griefer torches a community build, they aren't just moving bits; they are violating that agreement and erasing labor that had recognized value within our shared context. A server bug is a misfortune, but intentional destruction is a moral choice—it targets your agency and time within that space, which makes the harm objective to the relationship, not just subjective to your mood.
