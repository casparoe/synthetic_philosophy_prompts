      *   **Rule 2 (Antecedent-Sensitive):** Treats the conditional itself as evidence about the truth of $A$. If the conditional is surprising given $\neg A$, it might shift $P(A)$. (Often associated with Adams' Thesis, or specific dynamic interpretations of conditionals where the act of asserting implies something about the speaker's knowledge of $A$).
