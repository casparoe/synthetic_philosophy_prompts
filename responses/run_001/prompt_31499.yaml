answer: |-
  ### Exam Question

  **Question 1.** In Gary Drescher’s formulation of evidential cooperation, the "Large World" assumption functions as a prerequisite for rational acausal interaction. However, scholars differ on what work this assumption performs within the agent’s reasoning. Some treat it as an ontological guarantee that sufficient instances of the agent type exist; others argue it serves as an epistemic condition ensuring that correlations between decisions are not confounded by common causes or selection bias.

  Critically evaluate these two roles of the Large World assumption. To what extent does the normative force of evidential cooperation rely on the universe being *populated* by copies versus the universe being sufficiently *stable* to permit reliable counterfactual reasoning about those copies? In your response, assess whether the justification for cooperation would survive in a small world with high predictive certainty, or if the "large" aspect is necessary to avoid problems like the Unilateralist’s Curse. Acknowledge where the theoretical community agrees and where significant disputes remain regarding the validity of these inferences.

  (45 minutes)

  ***

  ### Model Answer

  Drescher’s proposal for evidential cooperation suggests that agents in disjoint causal spheres may have reason to coordinate because their shared decision algorithms generate correlated outputs. The standard presentation relies heavily on the Large World hypothesis—the idea that the universe is vast enough to contain multiple instantiations of similar agents. However, critically analyzing this assumption reveals a tension between its metaphysical role (guaranteeing existence) and its epistemic role (securing inference).

  First, consider the ontological view. Here, the Large World guarantees that other agents exist who will face similar dilemmas. Without a non-trivial probability of other agents running similar code or facing similar utility functions, evidential links dissolve into mere coincidence. If the universe contained only the single subject agent, the evidence provided by her decision to cooperate would not predict any outcome other than her own internal state. Thus, the population effect is foundational: it transforms subjective decision-making into inter-agent coordination.

  However, reducing the Large World assumption solely to population counts overlooks its function as an epistemic filter. In many decision scenarios, a correlation between Agent A and Agent B might arise not because they share an algorithm, but because of a hidden common cause—such as a shared environment variable or a prior causal influence. If the Large World merely ensures *existence* but allows for chaotic or confounded causal histories, evidential cooperation becomes irrational. For example, if my decision correlates with yours because we were both manipulated by a superintelligence to act similarly, cooperating yields no benefit; the outcome was determined by the manipulator, not by our mutual reasoning. Therefore, the "large world" is often invoked to imply statistical independence of initial conditions, ensuring the correlation stems from the decision process itself rather than external noise. This addresses the prompt’s concern regarding confounding variables and the Unilateralist’s Curse: if many agents exist but lack independent access to relevant information, cooperation might be triggered unilaterally by false data, leading to collective disaster.

  This structural ambiguity highlights a divergence in the literature regarding the source of the evidential link. Proponents of Functional Decision Theory (FDT) argue that the Large World is less relevant than the logical dependency; if two agents are logically equivalent, they need not occupy a physically large world to warrant cooperation. This suggests the "Large World" is sometimes a heuristic for describing environments where logical dependencies override causal isolation. Conversely, proponents of Updateless Decision Theory (UDT) emphasize that the agent must reason from a "prior over possible worlds," where the Large World assumption updates the prior regarding the likelihood of similar agents existing elsewhere.

  Where do we stand? It is largely settled that under Evidential Decision Theory (EDT), such cooperation requires a strong correlation. It is also settled that Causal Decision Theory (CDT) generally rejects this rationale, maintaining that without causal impact, action is futile. However, significant controversy remains regarding the threshold of "similarity" required. Is it sufficient that agents implement the same mathematical algorithm, even if instantiated in different substrates? Furthermore, disagreement persists over whether the epistemic burden of ruling out confounders (Role 2) is practically satisfiable, or whether it renders evidential cooperation vacuous in realistic settings where selection effects are ubiquitous.

  In conclusion, the Large World assumption performs dual work: it populates the field for potential beneficiaries and insulates the reasoning process from spurious correlations. If the assumption functions only ontologically, a Small World with perfect simulation could theoretically suffice. If it functions epistemically, it provides the stability needed to trust that one’s own choice is evidence of another’s, rather than evidence of a common fate. The strongest case for evidential cooperation likely depends on the latter interpretation; without the guarantee that correlations reflect algorithmic identity rather than environmental confounding, the risk of the Unilateralist’s Curse outweighs the benefits of trade. Yet, resolving this requires a consensus on the nature of logical dependence that the field has not yet reached.

  ***

  ### Marking Scheme

  **Total Points:** 20

  **Criteria for an A (17–20 points)**
  *   **Distinction:** Clearly distinguishes between the *ontological/population* role (existence of copies) and the *epistemic/inferential* role (validity of correlation/no confounding).
  *   **Application:** Explains how each role impacts the rationality of cooperation differently (e.g., existence without validity yields spurious reasons to cooperate).
  *   **Nuance:** Addresses the prompt’s specific constraints regarding confounders and the Unilateralist’s Curse. Explicitly discusses whether the argument holds in a small world with high predictive accuracy.
  *   **Contestation:** Identifies areas of genuine debate (e.g., definition of similarity, CDT vs. FDT stances) without presenting them as resolved consensus.

  **Criteria for a B (13–16 points)**
  *   **Description:** Accurately summarizes Drescher’s argument and mentions the two roles but treats them descriptively rather than critically.
  *   **Analysis:** Discusses the importance of existence but fails to fully engage with how the epistemic/filtering role changes the justification for cooperation.
  *   **Contestation:** Mentions disagreements between decision theories but may conflate the *existence* of copies with the *logic* of the inference (e.g., treating FDT support as the standard).

  **Common Mistakes (Pulling an answer toward C)**
  1.  **Confusion of Correlation and Causation:** The student argues that because agents act similarly, they must be causally linked, thereby rejecting evidential cooperation entirely rather than analyzing the evidential structure. Alternatively, they assume evidential cooperation works simply because agents are "alike," ignoring the requirement to rule out common causes (the prompt's specific concern).
  2.  **Consensus Error:** The student presents evidential cooperation as a solved problem or universally accepted consequence of having "many worlds," failing to note that standard CDT rejects the rationality of such acts regardless of world size, or failing to acknowledge the ongoing debate regarding logical uncertainty.

  **Specific Point Deductions for C-Level Flaws:**
  *   -3 points if the student equates "Large World" strictly with infinite space-time volume without connecting it to the distribution of agent-types or the stability of inference.
  *   -3 points if the student ignores the Unilateralist’s Curse or selection effects mentioned in the prompt, focusing solely on the "number of copies."
