      *   **User:** A novelist working on a book with a long courtroom subplot.
      *   **Task:** Evaluate a summary of the "Knobe Effect" found in a pop philosophy/psychology book. Specifically, assess the accuracy of the description of the experiment, the interpretation of the results, and the leap to legal implications (jury instructions as moral judgments).
      *   **Goal:** Help the user avoid embarrassment with knowledgeable readers by distinguishing between what's fair in the summary, what's overstretched, and how philosophers might object.
      *   **Constraint:** No citations needed (keep it accessible but rigorous).

  2.  **Deconstruct the Provided Summary:**
      *   *The Experiment:* Corporate chairman, new program, side effect (harm/help environment), indifferent attitude ("don't care"), asked about intentionality. Result: Harm = Intentional, Help = Not Intentional.
      *   *The Explanation:* Moral evaluation bleeds into judgment. Blame/Praise drives the "on purpose" label. Concept of intentional action isn't neutral.
      *   *The Legal Conclusion:* Jury deciding intention is really deciding condemnation. Legal distinction is moral judgment in disguise.

  3.  **Evaluate Each Component:**

      *   **The Experiment Description:**
          *   *Accuracy:* High. This is the classic 2003 Knobe study. The asymmetry (Harm-Intentional vs. Help-Unintentional) is the core finding.
          *   *Nuance:* It's worth noting this happens even when knowledge is equal and foresight is equal. The prompt says "subjects read," which is correct.
          *   *Verdict:* Fair.

      *   **The Psychological/Philosophical Explanation:**
          *   *Accuracy:* Mostly accurate regarding the *phenomenon* (the asymmetry exists).
          *   *Nuance:* The explanation ("moral evaluation... bleeds into") is the dominant theory (Side-Effect Effect), but there are competing theories (conceptual competence impairment, desire attribution, deep self model, etc.). Pop books often present one theory as *the* truth.
          *   *Verdict:* Plausible but slightly reductionist. There's debate about *why* it happens, not just *that* it happens.

      *   **The Legal Conclusion:**
          *   *Accuracy:* This is where it gets shaky.
          *   *The Leap:* Going from "laypeople judge intentionality asymmetrically based on morality" to "legal jury instructions are just moral judgments in disguise" is a huge generalization.
          *   *Reality:* Law has specific standards for intent (*mens rea*). Juries are instructed on these standards (knowledge, purpose, recklessness). While bias exists, saying the distinction is *entirely* disguised moral judgment ignores the procedural safeguards, judicial definitions, and the fact that many cases don't show this asymmetry in high-stakes legal contexts compared to vignette studies.
          *   *Verdict:* Overstretched/Speculative. It's a philosophical claim, not necessarily a settled legal fact.

  4.  **Drafting the Critique (Section by Section):**

      *   **Introduction:** Acknowledge the user's caution (good instinct). Validate that the summary captures the core experimental finding well.
      *   **Part 1: What's Fair (The Core Experiment):** Confirm the asymmetry is real. Mention the Chairman scenario. Confirm that moral valence affects intent attribution in lay reasoning. This is solid ground for fiction.
      *   **Part 2: What's Overstretched (The Explanation & Mechanism):** Point out that philosophers disagree on *why*. Is it moral contamination? Or does morality change how we understand mental states? It's not settled science. Also, pop psychology often treats lab vignettes as identical to real-life complex decisions.
      *   **Part 3: The Legal Jump (The Main Issue):** This needs the most work.
          *   *Distinguish:* Vignette studies vs. Actual Courts. Real courts have judges, evidence rules, and specific *mens rea* definitions.
          *   *Nuance:* Juries might be influenced, but they aren't *just* moralizing. They have to follow instructions.
          *   *The Claim:* Saying the distinction is "moral judgment in disguise" implies the law is broken or meaningless. Most legal scholars say the law *attempts* neutrality even if human psychology struggles with it.
      *   **Part 4: Philosophical Objections:** How would experts push back?
          *   *Conceptual Competence:* Maybe people understand "intent" differently than philosophers define it (folk psychology vs. technical definition).
          *   *Deep Self:* Maybe it's about character, not just the act.
          *   *Normative Influence:* Maybe blame comes *after* judging intent, not before. (Direction of fit).
          *   *Legal Realism vs. Formalism:* Lawyers know bias exists but argue for objective standards.

  5.  **Refining the Advice for the Novelist:**
      *   Don't make the scene about "law is fake."
      *   Make the scene about the *tension* between the legal instruction and the jurors' gut feelings.
      *   Show the friction. Have one juror struggle with the definition while another relies on their "bad guy" intuition.
      *   Keep the Knobe effect as subtext/character motivation, not the explicit thesis of the judge's summation (unless the judge is an eccentric legal theorist).

  6.  **Review against Constraints:**
      *   No citations? Check.
      *   Tone? Professional, helpful, respectful of the craft.
      *   Focus? Accuracy vs. Narrative utility.

  7.  **Final Polish:** Ensure clarity on the distinction between "Folk Psychology" (what regular people do) and "Legal Standard" (what the jury box is supposed to do). This is the crux of the error in the book's summary. (Self-correction: Make sure not to get too bogged down in technical legal terms like MPC section 2.02, keep it narrative-focused.)

