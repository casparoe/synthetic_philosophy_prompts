answer: |-
  You are right to pause at that jump. As a novelist, you need internal consistency, not necessarily academic consensus, but if your scene hinges on this conclusion, a reader who knows the literature could find it unconvincing because the text conflates *experimental findings* with *institutional reality*.

  Here is a breakdown of what is fair game for your story, what is overstretched, and how a specialist might object.

  ### 1. What is Fair (The Core Experiment)
  **The Summary:** *"Subjects read about a corporate chairman... Asked whether he brought the side effect about intentionally, subjects say he intentionally harmed the environment but did not intentionally help it."*

  **Verdict:** **Accurate.**
  This is the famous "Side-Effect Effect" (often called the Knobe Effect) published around 2003. The data is robust. In survey-based experiments, the direction of causality matters more than the stated mental state. If the outcome is bad (harm), people attribute intent much faster than if the outcome is good (help), even when the agent's indifference is identical.

  **For your Novel:** You can safely build scenes where jurors react viscerally to a defendant's actions based on the harm caused, claiming it was "obvious" or "calculated," whereas defense attorneys will argue it was "mere negligence." The psychological asymmetry is real.

  ### 2. What is Stretched (The Explanation)
  **The Summary:** *"The usual explanation is that people's moral evaluation of the outcome bleeds into their judgment of whether the act was intentional."*

  **Verdict:** **Plausible, but contested.**
  While this is the dominant view (the "Moral Contamination" hypothesis), it isn't the only view among philosophers and psychologists. Some argue that moral evaluation doesn't distort the concept of intent; rather, understanding intent requires understanding the agent's *values*, and we assume a rational agent values avoiding harm. Others argue the asymmetry is due to conversational norms (Gricean maxims), suggesting that calling a harmful side effect "unintentional" feels misleading, so we correct it.

  **For your Novel:** Don't have a character state this as absolute fact. It creates better drama if the lawyers dispute *why* the jury thinks this way. One lawyer might argue the defendant knew the risk; the other argues the jury is morally prejudiced against the defendant. This disagreement reflects the actual philosophical divide.

  ### 3. Where it Fails (The Legal Conclusion)
  **The Summary:** *"When a jury decides whether a defendant acted intentionally, what it's really doing is deciding whether to condemn the defendant — the legal distinction between doing something on purpose and doing it by accident is just moral judgment in disguise."*

  **Verdict:** **Overstretched and Legally Suspect.**
  This is the part that invites criticism. Here is why it doesn't hold up under scrutiny:

  *   **Folk Psychology $\neq$ Legal Instruction:** The Knobe experiment tests "folk psychology" (how regular people think). Courtrooms operate on "legal mental states" (*mens rea*). Judges explicitly instruct juries to ignore their moral reactions and apply a specific standard (e.g., "purpose," "knowledge," or "recklessness").
  *   **Correlation vs. Identity:** Just because a jury's verdict correlates with their moral disapproval doesn't mean the legal definition *is* the moral judgment. It means the moral judgment acts as a **bias** that influences the decision-making process. The two are not identical. If the legal system acknowledged the latter claim, it would abolish the distinction between murder and manslaughter, which it generally does not.
  *   **Context Matters:** The asymmetry found in the chairperson scenario is very strong in abstract surveys. However, when placed in a formal, adversarial legal setting with strict evidence rules, expert testimony, and judicial warnings, this bias is dampened. While it certainly lingers, saying the whole legal distinction is "in disguise" implies the law is entirely fictional regarding intent. That is too cynical for a realistic depiction of a functioning court.

  ### 4. What Would Experts Object To?
  If you put this in a scene where a lawyer makes this argument, a savvy reader (especially one in law or philosophy) might spot the following flaws in the logic:

  *   **The Direction of Causality:** Some philosophers argue that we don't judge intent *because* we want to blame. We judge it harshly because blameworthy acts feel different to us. They argue the concept of "intentional" is distinct from "blameworthy." A philosopher might point out that you can intend something without being blameworthy (e.g., intended surgery) or be blameworthy without intending (gross negligence). Collapsing them loses explanatory power.
  *   **The "Rationality" Defense:** Critics argue that in the "Help" condition, people didn't say it wasn't intentional because they were nice. They said it because it seemed irrational to claim someone *intended* a side effect they actively opposed, whereas in the "Harm" condition, failing to stop the harm when you could have easily done so signals a tacit acceptance that functions like intent. They distinguish *accepting* a risk from *aiming* for a result.
  *   **Legal Realism vs. Nominalism:** The quote suggests the law has no substance other than moral whim. Most defenders of the rule of law will argue that while human psychology is flawed, the *concept* of intent remains a necessary tool for justice. A jury might be wrong, but they aren't just condemning; they are applying a standard they misunderstand.

  ### 5. Recommendations for Your Scene
  You don't need to throw the insight away; the tension it creates is excellent fiction. But refine the stakes.

  *   **Don't make it systemic:** Avoid having a lawyer conclude that "the law is a lie." Instead, have them argue that "human nature clouds the law." It's the difference between saying "gravity doesn't exist" and saying "my eyes are playing tricks on me."
  *   **Show the friction:** Show a juror trying to fight their gut feeling. Perhaps during deliberations, Juror X wants to vote "Negligence" based on the instruction, but Juror Y keeps saying "But look what he did! He knew!" Juror Y is exhibiting the Knobe effect, but the scene works best if the group struggles against it, rather than simply succumbing to it smoothly.
  *   **Narrow the scope:** The Knobe effect is strongest with "side effects." If your pivotal crime involves a primary goal (the defendant shot the victim to collect insurance), the Knobe effect weakens. People agree shooting someone to collect insurance is intentional regardless of moral framing. Ensure the facts of your case actually support a side-effect scenario (e.g., a safety regulation ignored for profit, resulting in death, where the death wasn't the goal).

  **In short:** The experiment is sound. The psychology is widely accepted. The leap to "jury instructions are moral judgments in disguise" is a philosophical provocation, not a legal reality. For your book, it's more powerful if the characters *struggle* against that reality rather than accepting it as total fact.
