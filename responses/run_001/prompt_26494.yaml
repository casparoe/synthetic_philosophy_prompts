      *   **Paragraph 3 (The Objection):** Explains the extrinsic property objection. Consciousness seems intrinsic (e.g., painfulness of pain), but HOT/HOP make it relational/extrinsic.
      *   **Paragraph 4 (Assessment/Wrap-up):** Claims HOP is better positioned for two reasons.
