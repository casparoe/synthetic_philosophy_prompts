          3.  Does it undermine consequentialism (showing costs/damage)?
          4.  Where does it take a stance vs. refuse one?
          5.  Does it expose limitations in standard philosophical framing (abstract principles vs. moral texture like complicity, luck, institutional momentum, aftermath)?
          6.  Is it doing philosophy or just illustrating? If philosophy, can papers do this kind of work too?

  2.  **Initial Assessment & Stance:**
      *   *Zero Dark Thirty* is not neutral. It claims neutrality ("cinematic realism") but makes specific choices.
      *   The TTB debate is usually binary (Deterrence/Consequentialism vs. Deontology/Absolutism).
      *   The film complicates both. It shows efficacy (challenging pure deontology) but at a horrific cost (challenging clean consequentialism).
      *   Crucially, it highlights the *process* and the *person*, not just the outcome. This aligns more with virtue ethics or phenomenology than rule-based ethics.
      *   The prompt asks for a reading through the lens of torture literature (Paine, McMahan, Bennett, etc.). I need to reference concepts like "dirty hands," moral residue, institutional corruption, and the epistemic problem of torture (does it actually work?).

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the pedagogical value. State the thesis: The film *is* doing philosophy, specifically by disrupting the epistemological certainty required by the TTB scenario and focusing on the "moral residue" rather than the utilitarian calculus.

      *   **Argument Function:** Is it an argument?
          *   It's not a linear syllogism. It's a phenomenological argument.
          *   It forces the audience into the position of Maya. We are complicit witnesses.
          *   *Philosophy connection:* Martha Nussbaum's idea that narrative creates ethical understanding better than abstract principle because it engages emotion and imagination.

      *   **The Absolutist Challenge (Efficacy):**
          *   The film explicitly links torture to intelligence that leads to bin Laden. (Dan says "It worked").
          *   *Undermines Absolutism?* Yes, superficially. If Kantian rules prohibit means, the end here seems to vindicate them.
          *   *Nuance:* However, the film shows the intelligence was flawed, delayed, or partial until after other methods (or mixed methods). It doesn't present a clean "Torture -> Intel -> Save Lives" line without friction.
          *   *Literature:* Reference the debate on whether torture *actually* works (Shane, Waldron). The film argues it *can*, but questions the reliability.

      *   **The Consequentialist Challenge (Cost):**
          *   Standard TTB hides the cost. Real life reveals the cost.
          *   Costs shown: Physical (victims), Psychological (Maya's hollow eyes), Institutional (bureaucratic inertia, politicization of intel).
          *   *Moral Luck:* Dan gets fired/badmouthed; Maya survives the hunt but loses herself.
          *   *Dirty Hands:* Michael Walzer's concept. Doing something wrong for the right reason, but paying a price. Maya embodies this. She is the "clean hands" operative who gets her hands dirty.

      *   **Stance vs. Refusal:**
          *   *Taking a stance:* The interrogation scenes (Gulag). They are long, unglamorous, brutal. Not exciting like *24*. The sound design (screams, silence).
          *   *Refusing a stance:* The ending. No celebration. Just "You were looking forward to this." The lack of moral resolution. It refuses to give the viewer the comfort of saying "Okay, now we know if we should do it again."
          *   *Key Scene:* The "We're done here" moment where the intel officer (Jessica Chastain/Maya) is excluded from the raid planning because of the source protection. Shows the limits of knowledge gained.

      *   **Limitations of Standard Framing:**
          *   TTB is a puzzle (solve for X). Torture is a career/life (live with Y).
          *   *Institutional Momentum:* Once the system starts torturing, it becomes self-perpetuating. Hard to stop.
          *   *Complicity:* The viewer wants the information. We want Maya to succeed. The film implicates us in the desire for violence/justice.
          *   *Phenomenology:* How it feels to endure vs. administer.

      *   **Doing Philosophy vs. Illustration:**
          *   It *is* doing philosophy. Specifically, it's doing **Narrative Ethics** or **Virtue Ethics**.
