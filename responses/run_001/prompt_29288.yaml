  *(Self-Correction during drafting)*: I should be careful not to validate the movie's accuracy as historical fact, but treat it as the primary text for the module. The controversy over whether it depicts reality or fiction shouldn't overshadow the ethical analysis of the text itself. Focus on the *filmic representation*.

