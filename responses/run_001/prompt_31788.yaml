prompt: |-
  Analyze the Montreal Protocol and the phaseout of ozone-depleting substances through the lens of strong longtermism — the view that the primary determinant of the value of our actions today is their effect on the far future, and that positively influencing the very long run should be a central moral priority.

  The episode is well known in outline: in 1985 the British Antarctic Survey reported a dramatic thinning of stratospheric ozone over Antarctica; the culprit was chlorofluorocarbons and related compounds; and in 1987 the Montreal Protocol committed signatory nations to phase them out. The treaty has been widely celebrated as a triumph of international environmental cooperation and, by some estimates, averted millions of skin-cancer deaths and a catastrophic disruption of agriculture and marine ecosystems that would have unfolded over the coming century.

  But strong longtermism gives us a different lens. The view, as developed by Nick Bostrom, William MacAskill, and others, holds that the vast majority of the expected value of our actions lies in their effects on the very long-run future — centuries, millennia, and beyond — and that the most important such effects run through existential risks and trajectory changes rather than through near-term welfare improvements. The Montreal Protocol was not, on its face, a response to an existential risk. So what does strong longtermism say about it? Was it a paradigm case of long-term thinking that happens to fit the theory, or does the episode expose a tension in the theory's insistence that existential risk reduction dominates all other priorities?

  Please structure your response as follows:

  **Episode summary** (roughly 150 words): Give the essential facts — what was at stake, who acted, and what the decision amounted to. Keep it crisp; I know the history.

  **The longtermist framework** (roughly 200 words): Lay out the core commitments of strong longtermism as they bear on this kind of case. Distinguish the view from mere concern-for-future-generations; say what it claims about the relative importance of existential versus non-existential long-run effects, and what it would identify as the relevant axes of evaluation for a policy decision like the Montreal Protocol.

  **Mapping the analysis** (roughly 350 words): Do the disciplined work. Identify the relevant actors and their options (ratify the protocol with various phaseout schedules, delay, do nothing). Specify what the longtermist calculus says about each option: what are the pathways through which the decision could affect the far future, how large are those effects in expectation, and do they run through existential-risk channels or through something else? Be explicit about the timescales and the mechanism by which a decision in 1987 could still matter in, say, the year 3000. If the calculus is ambiguous, say where and why.

  **What the theory illuminates** (roughly 200 words): Identify features of the episode that strong longtermism brings into sharp relief — features that a standard cost-benefit or near-term-welfare framework might miss, underplay, or misdescribe. Be specific about which elements of the Montreal Protocol story look different through this lens.

  **What the theory misses or misdescribes** (roughly 200 words): Identify features of the episode that strong longtermism cannot easily accommodate, or that it describes in a forced or misleading way. Is there something about the actual reasoning of the parties, the structure of the negotiation, or the nature of the harm averted that the theory gets wrong or simply has nothing to say about?

  **What the episode shows about the theory** (roughly 200 words): Run the arrow in the other direction. Does the Montreal Protocol confirm strong longtermism, challenge it, or reveal a limitation the theory's proponents have not adequately addressed? Does it suggest that the theory's existential-risk focus is too narrow, or that non-existential long-run interventions can be competitive with existential-risk reduction in expected value? Could a strong longtermist consistently oppose the Protocol if she thought the resources could have gone to existential-risk mitigation instead? If so, is that a problem for the theory or for the opponent?

  **Verdict** (roughly 100 words): Give your overall assessment of how well the theory and the case fit together, and what a defender of strong longtermism should take away from the episode.
