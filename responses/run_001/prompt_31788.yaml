  Ratifying the Protocol involves short-term economic costs. However, in terms of expected value, the probability of civilizational fragility avoided outweighs the financial expenditure. The mechanism extending to the year 3000 is twofold. First, it maintains the carrying capacity of Earth, ensuring that humanity retains the biological resources needed to thrive during the potentially millennia-long process of space settlement. Second, it establishes a precedent of planetary stewardship. Successfully coordinating on ODS reduces the "coordination failure" risk profile for future governance challenges. If nations failed on ODS, trust in global regimes would erode, making coordinated responses to asteroid deflection or pandemic biosecurity less likely. Therefore, the 1987 decision functions as an indirect existential risk reduction measure. Even if ozone depletion alone isn't fatal, the resulting fragility makes terminal catastrophe much more probable. The longtermist choice is clearly ratification, assuming opportunity costs didn't divert capital from superior, direct X-risk projects. Given the low cost relative to global GDP, the opportunity cost argument is weak here, reinforcing the verdict in favor of the Protocol.

