  Strong longtermism mischaracterizes the motivational structure of the actors. The negotiation succeeded because leaders were moved by immediate duty to their citizens, not a utilitarian calculus regarding the year 3000. The theory implies rational agents calculated existential probabilities, but history shows the coalition was built on proximal medical urgency (skin cancer in one's grandchildren). Additionally, the theory struggles to classify the harm severity. Standard longtermism often dismisses non-x-risks as having negligible expected value compared to extinction risks. Yet the Protocol averted a global catastrophe comparable in suffering to major wars, despite being non-terminal. A rigid application of the theory might undervalue this prevention. Finally, the theory overlooks the role of market substitution. The success hinged on chemical firms finding cheaper alternatives, not moral suasion. Longtermist models often underweight economic self-interest as a stabilizer of long-term outcomes, overestimating the need for explicit moral foresight to drive progress.

  **What the episode shows about the theory**
  The Montreal Protocol challenges the strict hierarchy of strong longtermism. While the theory prioritizes existential risk, this case shows that "non-existential" long-term threats with high certainty can compete in practical importance. If resources are fungible, a strong longtermist must weigh ozone spending against AI safety or biorisk. In the 1980s, there were likely fewer dedicated X-risk mitigation funds, so the trade-off was minimal. However, in a modern context, the theory requires scrutiny: should we fix known planetary boundaries if doing so delays investment in hard existential defenses? The episode suggests that "planetary maintenance" acts as a foundation for trajectory change. It does not necessarily refute the theory, but it implies the "existential" definition must encompass cumulative fragility. If failing to maintain the biosphere makes extinction inevitable via secondary causes, it counts as X-risk. This broadens the scope of legitimate longtermist intervention beyond binary survival scenarios.

