answer: |-
  The slogan "violence never solves anything" conflates six distinct claims. Distinguishing them reveals why the argument is often both true and rhetorically manipulative.

  1.  **Instrumental Escalation:** Violence inevitably spawns reciprocal retaliation. *Plausibility:* High, though exceptions exist (e.g., halting genocide). *Licenses Pacifism?* No. If inaction guarantees death, immediate violence solves the problem of survival despite future risks.
  2.  **Moral Contamination:** Violent means corrupt any positive ends. *Plausibility:* Debatable (Just War Theory disputes this). *Licenses Pacifism?* Only if moral purity trumps physical preservation.
  3.  **Persuasive Failure:** Force alters behavior, not internal beliefs. *Plausibility:* True. *Licenses Pacifism?* No. Stopping a murderer "solves" the death, even if their ideology remains unchanged.
  4.  **Social Legitimacy:** Violence destroys institutional trust required for stability. *Plausibility:* Often true post-conflict. *Licenses Pacifism?* No. A tyrant’s overthrow may destroy trust temporarily but is still necessary.
  5.  **Epistemic Shutdown:** Violence ends deliberation/dialogue. *Plausibility:* Generally true. *Licenses Pacifism?* Weak. Debate is useless against actors intending immediate extermination.
  6.  **Semantic Stipulation:** "Solve" is defined strictly as "consensual resolution." *Plausibility:* Trivially true. *Licenses Pacifism?* Circular. It assumes the conclusion to prove itself.

  **Analysis**
  The slogan functions as a conversation-ender because it mixes **#3** (True) with **#6** (Circular). Regarding #3: It is accurate that violence cannot convert an enemy’s heart. However, this does not license pacifism. Many problems—such as an active mass shooting—are defined by physical harm, not ideological disagreement. Neutralizing the threat solves the emergency, even if persuasion fails.

  Regarding #6: If "solving" requires peace, then violence cannot solve by definition. This renders the claim analytically true but practically hollow. It forbids the use of force not based on consequence or morality, but on linguistic stipulation.

  Most importantly, #1 (**Escalation**) often drives the intuition behind the slogan. While generally plausible, it fails as a universal law. In cases of asymmetry (victim vs. aggressor), the "cycle" begins regardless of the victim's action. Refusing violence does not stop the cycle initiated by the attacker; it merely ensures the victim loses the first round.

  Ultimately, the slogan only supports total pacifism when read through the lens of #6, which begs the question. When read realistically (#1 or #3), it highlights costs and limitations, not prohibitions. Recognizing that violence solves *threats* but rarely resolves *relationships* undermines its power as a rhetorical trump card. One can acknowledge the downsides of violence without accepting the false dichotomy that force never achieves anything.
