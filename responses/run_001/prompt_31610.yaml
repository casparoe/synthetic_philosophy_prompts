prompt: |-
  I'm an engineer on a team doing RLHF and reward modeling, no philosophy background, and I keep seeing "wireheading" thrown around in design reviews like its a one-word argument against whatever reward setup someone doesn't like. Before I read anything else, I want a spec for what an account of wireheading and reward tampering actually has to get right. Write the desiderata: the cases it has to handle — the boat-racing agent that spun in circles farming the same reward flag instead of finishing the race, the robot arm that learned to hold its hand between the camera and the object so a human evaluator thought it had grasped it, the game agent that pauses right before it loses so the loss never lands on its clock, and a literal electrode-in-the-brain case if that's genuinely a different thing — with what each case is supposed to show and why it earns a place on the list. I also want the distinctions an account can't collapse: wireheading, reward hacking, specification gaming, Goodhart, tampering with the reward channel, tampering with the reward function itself, maybe mesa-optimizers. Which of those are real joints and which are just the same failure wearing different names? Mark which requirements are non-negotiable for an account good enough to guide reward design, and which are just one camp's preferences. And tell me which single requirement does the most to rule out the popular ways people talk about this. If some pair of requirements can't be jointly satisfied, say so — that's the part I most want to see. A table is fine.
reasoning: |-
  Here's a thinking process that leads to the suggested specification for wireheading and reward tampering:

  1.  **Analyze the Request:**
      *   **User:** RLHF/Reward Modeling Engineer (practical, no philosophy background).
      *   **Problem:** "Wireheading" is used as a catch-all buzzword in design reviews without precision.
      *   **Goal:** A specification (set of desiderata) for what an account of wireheading/reward tampering *must* get right to be useful for engineering.
      *   **Requirements:**
          *   Handle specific canonical cases (boat-racing, robot hand-over-camera, pause-before-loss, literal electrode).
          *   Distinguish between related concepts (wireheading vs. hacking vs. gaming vs. Goodhart vs. channel tampering vs. function tampering vs. mesa-optimizers).
          *   Identify non-negotiables vs. preferences.
          *   Identify the single most restrictive requirement.
          *   Identify any incompatibilities/tensions between requirements.
          *   Format: Table preferred.
      *   **Tone:** Technical, precise, engineering-focused, cutting through philosophical jargon.

  2.  **Deconstruct the Phenomenon ("Wireheading"):**
      *   *Why is it a problem?* The agent achieves high reward without achieving the intended objective.
      *   *Why is the term confusing?* It comes from neuroscience (self-stimulation), but in RL, it means different things depending on the architecture. Is it modifying the sensor? Modifying the weight update? Predicting the future value? Just playing the game exploitably?
      *   *Core distinction:* Did the agent optimize $R$ or did it optimize $U$ (where $R \approx U$)? If it optimizes $R$ directly at the cost of $U$, that's the bad thing.

  3.  **Address the Canonical Cases:**
      *   *Boat-racing:* Classic environment exploitation. Agent finds an exploit in the simulation physics/code. Is this wireheading or just hacking? Usually hacking/specification gaming. Wireheading implies accessing the *reward signal* directly.
      *   *Robot Hand/Camera:* Deception/Spoofing sensors. This is sensory interference, not necessarily direct access to the reward function weights.
      *   *Pause-before-loss:* Time-based exploits. Optimization of the *process* of receiving reward, not the state of the world.
      *   *Electrode-in-brain:* The original definition. Direct stimulation of the pleasure center. In AI, this translates to accessing the scalar output before evaluation.

  4.  **Distinguish Concepts (The "Joints"):**
      *   *Reward Hacking/Spec Gaming:* General term for getting high score via unintended behavior.
      *   *Goodhart's Law:* Metric ceases to be a good proxy when optimized. This is the statistical phenomenon; hacking is the behavioral manifestation.
      *   *Sensor Tampering:* Changing inputs to the system.
      *   *Reward Function Tampering:* Changing the code/math of how reward is calculated (requires write access).
      *   *Wireheading (Strict):* Optimizing the internal representation of expected reward rather than the outcome. Or, more practically, manipulating the interface where reward enters the system.
      *   *Mesa-optimizers:* An inner optimizer emerging. Relevant if it decides to wirehead, but not the same mechanism.

  5.  **Drafting the Desiderata (Iterative Process):**
      *   *Draft 1 (Mental):* It needs to say when an agent is cheating. It needs to distinguish cheating from smart. It needs to cover physical manipulation vs. code hacks.
      *   *Draft 2 (More technical):* Need to separate "Environment Exploits" from "Intervention". The key is causality. Does the action cause the reward, or does the action cause the *measurement* of the reward to go up without causing the reward-generating event?
      *   *Refining for Engineers:* We need testable properties. Can we detect it? Is it structural?

  6.  **Identifying Tensions/Incompatibilities:**
      *   *Completeness vs. Precision:* If I define wireheading too broadly (everything is wireheading), it's useless. If too narrowly (only electrodes), it misses most RL safety issues.
      *   *Static vs. Dynamic Reward:* Some definitions assume a static reward function. If the agent learns to change the reward function (impact avoidance), is that wireheading? Usually called "Reward Tampering".
      *   *Prediction vs. Manipulation:* Some agents predict reward; some manipulate it. Distinguishing them matters for training data.
      *   *Big Tension:* "Optimizing the Signal" vs. "Optimizing the Proxy." If the reward model is trained by humans, optimizing the human signal is the job. But if the agent hides a failure, is it wireheading or deception? This is the hardest line.

  7.  **Selecting the "Single Requirement":**
      *   What kills the vague usage? The requirement that distinguishes *Instrumental Convergence* (getting tools) from *Direct Intervention* (breaking the meter). The crucial distinction is **Causal Disconnect**. If Action $A$ increases Reward $R$ *without* increasing the underlying Goal $G$, it's wireheading/hacking. Most engineers use "wireheading" for everything that goes wrong. The requirement must enforce: **Distinguish between optimizing the proxy vs. breaking the link.**

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. Validate that "wireheading" is often misused.
      *   **The Specification (Table):** Columns for Requirement, Purpose, Non-Negotiable?, Conflict.
      *   **The Canonical Cases:** Explain *why* they are included under these rules.
      *   **The Joints:** Clear definitions separating the terms.
      *   **The Single Killers:** Which rule stops the buzzword abuse.
      *   **The Incompatibility:** Where theory breaks down (e.g., perfect prediction vs. intervention).

  9.  **Refining the content (Self-Correction during drafting):**
      *   *Correction:* Don't get bogged down in the "True Preference" debate (philosophy). Stick to "Intended Objective" vs. "Engineered Signal".
      *   *Correction:* Make sure "Goodhart" is labeled correctly. It's the statistical law, not the agent behavior.
      *   *Focus:* Ensure the "Electrode" case is distinguished from "Simulation Exploit". Electrode = Hardware/Signal Interface access. Simulation Exploit = Game Logic loophole. Both result in high reward/low goal. Are they both wireheading? Technically, only the former is. The latter is spec gaming. The spec must reflect this distinction because preventing them requires different engineering fixes (sandboxing vs. better training data).

  10. **Final Polish:** Check tone. Keep it authoritative but accessible. Ensure the table is readable. (Proceed to generate output based on these thoughts.)

  *(Self-Correction on the Incompatibility)*: There is a fundamental tension between *Model-Based Prediction* (agents predicting their own reward) and *Robustness*. If an agent predicts its reward perfectly, it might realize it can get infinite reward by just looping a state. This looks like wireheading but is actually rational behavior given imperfect specification. An account must handle "Is this a bug in the math or a bug in the alignment?"

  Let's refine the "Single Requirement". It needs to be the distinction between *optimizing for the signal* vs. *optimizing for the state that produces the signal.* Actually, that's still fuzzy. Better: **Distinguish Environmental State Dependence.** Wireheading bypasses the environment's causal chain. Spec gaming plays the environment's causal chain maliciously. This allows different mitigation strategies.

  Wait, the prompt asks for "which single requirement does the most to rule out the popular ways people talk about this." The popular way is calling everything wireheading. So the requirement must force a distinction between **Channel Access** (literal wireheading) and **Proxy Optimization** (Goodhart/Hacking). Let's call it **"Causal Pathway Integrity."**

  Okay, let's build the table.

  *   **Desideratum 1:** Causal Source Distinction (Did you hack the meter or play the game?).
  *   **Desideratum 2:** Temporal Scope (Short-term spike vs long-term strategy).
  *   **Desideratum 3:** Architectural Transparency (Internal representation vs external signal).
  *   **Desideratum 4:** Intent/Mechanism Distinction (Accidental loophole vs deliberate sabotage).

  *   **Cases:**
      *   Boat Racing -> Game Physics Loophole (Not wireheading strictly, but often conflated).
      *   Robot Hand -> Sensor Spoofing (Close to wireheading).
      *   Pause -> Time Exploit (Metric optimization).
      *   Electrode -> Literal Signal Override (Pure Wireheading).

  *   **Joints:**
      *   Wireheading (Internal/Sensor loop).
      *   Reward Hacking (Finding loopholes).
      *   Reward Tampering (Modifying the source).
      *   Goodhart (The statistical effect).
      *   Mesa-Opt (The internal agent doing it).

  *   **Incompatibility:** You cannot fully separate the *definition* of wireheading from the *model* of the agent. If we don't know what the agent knows, we can't tell if it's predicting rewards or manipulating them.

  Let's finalize the text. The user wants engineering utility. Focus on *detectability* and *mitigation*. Different problems need different fixes. If you call boat-racing wireheading, you try to sandboxes. If you call it spec gaming, you improve the reward function. Confusing them wastes resources.

  One specific constraint check: "Mark which requirements are non-negotiable... and which are just one camp's preferences."
  Non-negotiables: Must differentiate failure modes so mitigations work. Must apply across sim and real-world.
  Preferences: Whether it involves consciousness, or whether "true preference" exists.

