  2.  **Deconstruct Nozick's Tracking Theory:**
      *   Condition 1: $p$ is true.
      *   Condition 2: $S$ believes that $p$.
      *   Condition 3 (Sensitivity): If $p$ were false, $S$ would not believe that $p$.
      *   Condition 4 (Adherence/Adhesion): If $p$ were true (in nearby worlds), $S$ would believe that $p$.
      *   Key Issue: Epistemic Closure ($K(p) \land K(p \to q) \to K(q)$).
      *   Nozick rejects Closure.
      *   Example: Zebra at Zoo.
          *   $p$: That animal is a zebra.
          *   $q$: That animal is not a cleverly painted mule.
          *   We know $p \to q$.
          *   Do we know $q$?
          *   Sensitivity test for $q$: If it *were* a painted mule (false $q$), would I still believe it's not a painted mule? Yes, because I'd still think it's a zebra. So condition 3 fails for $q$.
          *   Sensitivity test for $p$: If it weren't a zebra (and was an ordinary animal), would I believe it's a zebra? No. So condition 3 holds for $p$.
      *   Result: I know $p$, I don't know $q$. Closure fails.

