prompt: |-
  I'm a third-year undergraduate in a seminar called "The Normativity of Contracts," and we've spent the past several weeks on the question of why promises bind. We've worked through Hume's convention-based account in the Treatise, Rawls's practice-based view from "Two Concepts of Rules," and Scanlon's expectation-based account from What We Owe to Each Other. Our professor has asked the class to help design an in-class activity for next week's session that will make the rest of the students — about eighteen of us — feel the force of the central puzzle experientially rather than just reading about it. The session is eighty minutes, and the room is a seminar room with movable chairs and a whiteboard.

  The puzzle we keep circling around is this: when you break a promise, are you doing something wrong primarily because you've harmed the specific person you made the promise to — disappointed their expectations, betrayed their trust, taken advantage of their reliance — or because you've undermined a valuable social practice that everyone benefits from and you're free-riding on that practice? Or is there some third thing, something about the exercise of normative powers or the transfer of authority, that neither of these quite captures? The readings pull in different directions, and the discussion keeps stalling out because we don't have a shared experience to anchor the disagreement.

  I'd like to propose a structured activity — ideally a game with real but small stakes, like candy or extra-credit points — that forces participants to confront this question from the inside. The activity should have two distinct phases. In the first phase, promises are embedded in a clearly beneficial social practice: making and keeping promises visibly improves everyone's outcomes, and breaking them visibly harms the practice for everyone. In the second phase, promises are made one-on-one in isolation from any broader practice — no reputation, no group benefit, no third-party awareness — and participants have to decide whether they still feel bound. The transition between the two phases should be jarring: participants should walk out of the first phase convinced that the practice explains everything, and then find themselves in the second phase feeling that something is still missing. I need: (a) rules and materials for both phases, including a payoff scheme that doesn't require real money; (b) a timeline for the full eighty-minute session; (c) a debrief script that maps specific moments in the activity onto the philosophical accounts we've read, shows where the practice-based view gains traction and where it loses it, and introduces the voluntarist or authority-based alternative at the right moment; (d) an honest note on what will predictably go wrong when the activity is run — especially the risk that participants in Phase 2 will simply import the norms from Phase 1 and not feel the tension; and (e) a suggestion for a follow-up discussion question or short reading that ties the experience back to the texts.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **User:** Third-year undergraduate in "The Normativity of Contracts" seminar.
      *   **Context:** 80-minute seminar session, ~18 students, movable chairs, whiteboard.
      *   **Topic:** Why promises bind (Hume/Rawls/Scanlon vs. Voluntaryism/Authority).
      *   **Core Puzzle:** Harm to person/trust vs. Undermining social practice vs. Normative power transfer.
      *   **Goal:** Design an in-class activity (game with small stakes) that makes the puzzle *experiential*.
      *   **Structure:** Two phases. Phase 1 = Promises within a beneficial social practice. Phase 2 = Isolated one-on-one promises (no reputation/practice).
      *   **Required Outputs:**
          (a) Rules & Materials (including payoff scheme).
          (b) Timeline (80 mins).
          (c) Debrief script (mapping moments to Hume/Rawls/Scanlon/Voluntarism).
          (d) Risk assessment (what goes wrong, especially importing norms).
          (e) Follow-up discussion question or reading.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Practice View (Hume/Rawls):* Promises bind because we participate in a system. Breaking it hurts the system. No system, no obligation?
      *   *Expectation View (Scanlon):* Promises bind because they create expectations and reliance. Wrong to disappoint without justification.
      *   *Voluntarist/Authority View (Hart/MacCormick/Dworkin-ish):* Promises bind because I *created* an obligation through speech act. The authority transfers from me to you.
      *   *The Activity's Job:* Make participants feel the "System" in Phase 1 and lose the "System" in Phase 2 while retaining the "Bindingness."

  3.  **Drafting the Activity - Phase 1 (The Public Practice):**
      *   *Concept:* A coordination game where mutual cooperation relies on public pledges.
      *   *Mechanism:* "The Commons Game" or "The Investment Pool." Let's go with "The Shared Resource."
      *   *Stakes:* Candy/Penalty points (convertible to extra credit if the professor allows, but candy is safer for undergrads). Let's use "Gold Coins" (chips/candy) that add up to a class pot.
      *   *Setup:* Groups. Everyone makes a promise to contribute to the group pot. If everyone keeps, everyone wins big. If some break, everyone loses.
      *   *Experience:* Breaking feels like letting down the team. It feels "public." This supports Hume/Rawls.

  4.  **Drafting the Activity - Phase 2 (The Private Promise):**
      *   *Concept:* One-on-one interactions hidden from the group.
      *   *Mechanism:* Dyads. Secret pairing.
      *   *Stakes:* Small personal reward (e.g., choosing your seat next week, getting the last cookie). Crucially, no one else knows.
      *   *The Twist:* The "Secret Veto." Student A promises Student B they will give them X resource. But later, Student A gets a private offer that lets them keep the resource *and* not pay anyone back, and no one knows.
      *   *Refinement:* This needs to be cleaner. Let's try a "Trust Transfer" mechanic.
      *   *Revised Idea:* "The Blind Exchange."
      *   *Phase 1:* Group project. You promise to bring X. We pool X. Result is multiplied. Visible commitment.
      *   *Phase 2:* Anonymous pairings. I promise to send you a note worth a point later. No public record. No group consequence. Just us. Do I still owe it?

  5.  **Selecting the Specific Game Mechanics (Iterative Process):**
      *   *Critique:* Games can get too complex for 80 mins including prep and debrief. Needs simplicity.
      *   *Better Approach:* Use "Points" as currency.
      *   *Phase 1: The Institutional Trust.* Students form "Firms." They agree to deposit points into a "Bank." The Professor acts as the Institution (guaranteed multiplier). If the class average is high, everyone gets a bonus. Breaking a promise hurts the class average. This screams Rawls/Hume.
      *   *Phase 2: The Dyadic Contract.* Pairs are formed. Student A gives Student B a token. B promises to return double later. *Crucial:* There is no recording of this promise. No class pot depends on it. It is purely between them. Can they renege without feeling guilt? Or does the mere saying create the debt?
      *   *Wait, the prompt asks for "Promises embedded in practice" vs "One-on-one isolation".*
      *   *Let's refine Phase 1:* A "Pledge Wall." Everyone writes a promise to do something (contribute to a pile). The pile benefits everyone. Visibility matters.
      *   *Let's refine Phase 2:* "The Closed Door Deal." Pair up. Give each other a specific small prize (stickers/candy). Promise to deliver a specific amount of "effort" later (e.g., answer a quiz question correctly for the other person?) No, too messy.
      *   *Simpler:* "The IOU Pass."
      *   *Phase 1:* Class-wide lottery. To enter, you must promise to attend next class. It benefits the practice of attendance. If people skip, the lottery is cancelled. Everyone monitors everyone.
      *   *Phase 2:* Two-person deal. A says to B: "I promise to give you my chocolate bar tomorrow." Then A leaves the room. No witnesses. Does the promise bind?

      *Okay, let's settle on a specific economic game structure that highlights the "Practice" vs. "Individual Will".*

      *Activity Name:* **The Covenant of Candies.**
      *   **Currency:** Gummy bears (representing utility/payoff).
      *   **Phase 1:** *The Multiplier Pool.* (Rawls/Hume).
          *   Students split into 3 groups.
          *   Each has 5 gummies.
          *   They put some in a central jar. Professor multiplies by 2. Back to all groups equally.
          *   *Condition:* Before putting money in, each student must verbally make a "Pledge of Contribution" written publicly on the board for their group.
          *   *Consequence of Breaking:* If someone takes back their pledge secretly (or contributes less), the group knows, and the group's future multiplier might drop. Actually, let's make the binding force clearer.
          *   *Better:* The "Public Record." If I don't fulfill, I lose "reputation points" visible to everyone.
          *   *Actually, the prompt wants the transition to be jarring.*
          *   *Phase 1:* We play a Prisoner's Dilemma variation where the norm of promising solves the dilemma because there is an institution (the Professor) recording who promised what.
          *   *Phase 2:* We play the same game, but the recording is destroyed. No institution. Just words between two people.

      *Decision:* Keep it simple. Focus on the *feeling* of the obligation.
      *   **Phase 1 (Institutional):** The "Group Pot." Students contribute to a shared fund. Promise to contribute. Everyone sees the promises. If a student reneges, the *whole class* loses potential points (Practice harm).
      *   **Phase 2 (Private):** The "Dyad Loan." A lends B a piece of paper with points on it. B promises to return double later. But the "points" are fake tokens that vanish after class unless recorded. No third party watches.

      *Let's sharpen Phase 2 for maximum philosophical sting:*
      In Phase 2, the "Professor" (Authority) steps out completely. The promise is made between two students in a corner. The student holding the resources is offered a *better deal* privately right before paying back, but keeping the secret means the recipient finds out only if told. Wait, if they find out, they know. If they don't tell, no one knows.
      *Key Question:* Does the obligation exist if no one but me knows I broke it?
      *This tests Scanlon (expectations)* vs *Hart (will)*. If Scanlon is right, I shouldn't do it because it betrays trust. If Hart is right, I bound myself regardless of discovery. If Hume is right, it doesn't matter because no practice exists here.

  6.  **Developing the Timeline (80 mins):**
      *   0-10: Intro & Setup (Explain Phase 1 rules).
      *   10-30: Phase 1 Play (The Collective Pot).
      *   30-35: Debrief Phase 1 (Why did we feel obligated?).
      *   35-40: Transition (Shocking the system).
      *   40-60: Phase 2 Play (The Silent Pact).
      *   60-75: Debrief Phase 2 & Synthesis.
      *   75-80: Wrap up.

  7.  **Drafting the Debrief Script:**
      *   Need to map Phase 1 to Hume/Rawls. (You felt bad because you hurt the group/institution).
      *   Need to map Phase 2 to the breakdown of Practice View. (No group was hurt).
      *   Need to introduce Scanlon (Did you betray the other person's expectation even if no one knew?).
      *   Need to introduce Voluntarism (Did you just give yourself a rule?).

  8.  **Addressing Risks:**
      *   *Biggest Risk:* Students import Phase 1 norms into Phase 2 ("It's rude").
      *   *Mitigation:* Explicitly tell them in Phase 2 instructions that social norms are off the table—only the specific promise counts. Tell them "Nobody else is watching." Create physical separation.
      *   *Another Risk:* Time creep.
      *   *Mitigation:* Strict timekeeping.

  9.  **Refining the Payoffs:**
      *   Use "Bonus Points" redeemable for participation grade. This is real stakes for them.
      *   Or candy. Candy is more visceral. Let's suggest Candy + Extra Credit option.
      *   *Let's go with "Classroom Currency" convertible to a participation point.* High value.

  10. **Final Review against Constraints:**
      *   18 students? Yes, workable in pairs/groups.
      *   Movable chairs? Good for grouping.
      *   Whiteboard? Good for recording commitments in Phase 1.
      *   Two phases? Yes.
      *   Debrief script included? Yes.
      *   Risk analysis included? Yes.
      *   Follow up? Yes.

  11. **Self-Correction during drafting:**
      *   *Critique:* Make sure Phase 2 actually isolates the *promise*. If they exchange candy, that's a transaction. It should be a *promise* of a future action.
      *   *Adjustment:* Phase 2 involves a "Future Payout." Student A gives B a voucher *now* based on B's promise to do X *later* (or vice versa). Let's simplify. A promises B they will let B choose the snack next week.
      *   *Actually, best to focus on the moment of the choice.*
      *   *Revised Phase 2:* Give each pair $1 worth of "future points." Person A decides whether to honor the promise or take the $1 value for themselves immediately. If they take the value, the promise dies. The other person never knows *unless* they ask.
      *   *Wait, for the experiment to work on the "Force" of the obligation, we need the participant to feel the tension of breaking it.*
      *   *Let's try this:* Phase 1: Public Ledger. Break promise -> Public Shame + Loss of Group Pot. Phase 2: Blank Slate. Private ledger. Break promise -> Only you know. Do you feel the pull?
      *   *Okay, the design looks solid.*

  12. **Writing the Output:** Organize clearly by (a)-(e). Use academic tone suitable for an undergraduate proposing to a professor. Ensure the philosophical mapping is accurate to Hume/Rawls/Scanlon/Hart.

  *(Self-Correction on Philosophy)*: Be careful with Scanlon. Scanlon is Principle F (Fidelity). He argues that failing to keep a promise violates the principles that justify the institution of promising. However, he focuses heavily on the relationship. The distinction needed here is usually: Is the wrong about the *relationship* (Scanlon) or the *institution* (Hume)? The activity aims to show that even when the "institution" disappears (Phase 2), the "relationship" feeling might remain, pushing toward Scanlon or a Will Theory. I will ensure the debrief distinguishes these nuances.

  *(Risk Check)*: Make sure the "jarring" nature is emphasized. Physical transition in the room helps. Move chairs. Change lighting? No, too dramatic. Just change the dynamic completely.

  *(Follow-up)*: Suggest a specific text. Schauer on "Formalism" or maybe a section from Hart's *Essays on Bentham* regarding the Power-Conferring aspect. Or MacFarlane on assertion/promise. Let's stick to Hart or Dworkin to contrast with Scanlon. Actually, Gilbert's "Social Norms" critique is good. Let's suggest Hart for the Authority view.

  Let's finalize the plan.
  *   **Title:** The Practice-Promise Paradox.
  *   **Materials:** Candy (gumdrops), slips of paper, pens, whiteboard.
  *   **Phase 1:** The Community Pot. Public commitments affect group reward.
  *   **Phase 2:** The Solitary Vow. Private commitments.
  *   **Timeline:** Detailed breakdown.
  *   **Script:** Guided questions.
  *   **Risks:** Norm importation.
  *   **Follow-up:** Hart "Are There Any Natural Rights?" or similar on rights creation.

