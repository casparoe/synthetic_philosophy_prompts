answer: |-
  This is a sophisticated pedagogical challenge. You are asking for an activity that externalizes an internal philosophical disagreement (Is the source of obligation external/social or internal/volitional?) using game mechanics and psychological framing.

  Below is a proposal designed for your instructor. It is titled **"The Covenant of Candies,"** designed to run in exactly 80 minutes with eighteen students.

  ### Activity Title: The Covenant of Candies

  **Objective:** To experientially distinguish between obligations grounded in *social practices* (Hume/Rawls) and obligations grounded in *voluntary normative powers* (Will Theory/Hart).

  **Materials Needed:**
  1.  **Currency:** 36 gummy candies (or chocolate coins). 18 are distributed immediately; 18 are held in a "Bank" box.
  2.  **Tokens:** 18 poker chips (for tracking).
  3.  **Stationery:** Note cards and pens for every student.
  4.  **Whiteboard:** For the Public Ledger.

  ---

  ### (a) Rules and Payoff Scheme

  **Payoff Conversion:** All players start with 0 Bonus Credits. The goal is to maximize individual credits redeemable at the end of the semester. One candy equals +1 Bonus Credit.

  #### Phase 1: The Public Practice (The Institutional View)
  *   **Setup:** Divide the class into three "Societies" of six students each. Sit the Societies in clusters.
  *   **The Mechanism:** Each Society has a communal pot. Every student receives **two candies** initially.
  *   **The Rule:** Students must decide whether to contribute their candies to the Pot or keep them.
  *   **The Multiplier:** After the decision, the Prof adds a number of candies to the Pot equal to **2x the total contributions**, then divides them equally among all members of that Society.
      *   *If everyone contributes (12 candies):* Pot becomes 24. Everyone gets 4 extra candies. Total gain per student: +2.
      *   *If one cheats (keeps theirs):* Pot drops. Cheater keeps initial 2 + share of reduced pot. Cooperators get less.
  *   **The Constraint (Crucial):** Before making the financial decision, every student must approach the **Whiteboard** and write their name and the exact number of candies they pledge to contribute.
  *   **The Consequence:** Once written, the Board is sealed (covered by paper) until the calculation phase. Breaking a written pledge lowers the class score for *everyone*, including the cheater’s own society.
  *   **Philosophical Target:** This simulates Hume/Rawls. The obligation stems from the benefit of the practice. Breaking the pledge visibly damages the collective mechanism that generates value for everyone.

  #### Phase 2: The Solitary Vow (The Voluntarist View)
  *   **Transition:** Clear the chairs. Disband societies. Students pair up randomly. Turn off the whiteboard or move to a different part of the room.
  *   **The Mechanism:** Student A gives Student B **one candy**.
  *   **The Constraint (Crucial):** Student A hands the candy to B and says: *"I promise that by next class, I will bring you two candies in return."*
  *   **The Twist:** Five minutes after the promise is made, Professor enters a "Veto Room." Student A (the promisor) receives a slip of paper privately. It says:
      > *"You may keep the second candy you were supposed to give B as your own. If you do this, B cannot verify the breach unless you tell them. You may eat this candy now, and no outside observer will know you broke the promise."*
  *   **The Choice:** Student A chooses: Fulfill the promise (give B two candies) OR Take the "Veto" (eat the candy and owe nothing, undetected).
  *   **Philosophical Target:** This removes the "Practice." No group suffers. No reputation is at stake publicly. It forces the question: Does the act of saying "I promise" transfer authority/power to B, creating a debt independent of social consequences?

  ---

  ### (b) Timeline (80 Minutes)

  | Time | Segment | Details |
  | :--- | :--- | :--- |
  | **00–05** | **Intro** | Instructor sets the stage: "We are playing a game about obligation." Explain Phase 1 rules strictly. Emphasize the Whiteboard Pledge. |
  | **05–15** | **Phase 1 Action** | Students cluster, debate, write pledges on Board. Students calculate contributions. (Allow negotiation). Reveal Board, count totals, distribute candy. |
  | **15–20** | **Phase 1 Debrief** | Quick reaction check: "How did it feel to see your name on the board?" "Did you feel bound even when others contributed less?" |
  | **20–25** | **Reset** | Physically disrupt the room. Break the clumps. Pair students up. Hand out the Phase 2 instructions. **Read the "Veto" instructions aloud to the whole class first so they know the temptation exists.** |
  | **25–40** | **Phase 2 Action** | Students have 1 minute to make the promise. Then, promisors step aside (back to wall) to read the "Veto Slip." They make the choice silently. They execute the payout (or eat the candy). |
  | **40–45** | **Transition** | Silence. Ask students: "Look at the person across from you. Did anything happen differently than Phase 1?" |
  | **45–75** | **Full Debrief** | Structured discussion using the script below (Section C). Map experiences to texts. |
  | **75–80** | **Conclusion** | Final synthesis and assignment of follow-up reading. |

  ---

  ### (c) Debrief Script

  *(Use the Whiteboard to draw two columns: "Practice-Based" and "Will-Based".)*

  **1. Processing Phase 1 (The Hume/Rawls Moment)**
  "In Phase 1, many of you felt pressure to write your names on the board. Even if you wanted to defect, the 'Practice' made it costly.
  *   *Question:* Who felt bound to keep their pledge even though another student didn't contribute as much? Why?
  *   *Analysis:* This confirms the **Practice View (Hume/Rawls)**. The obligation existed because we were participating in a convention that benefited us all. You weren't just hurting the person opposite you; you were undermining the multiplier mechanism. Breaking the promise was wrong because it eroded the system of trust required for the 'pot' to function."

  **2. The Shock of Phase 2 (The Failure of Practice)**
  "Now, look at Phase 2. There was no group pot. There was no reputation risk. Your partner couldn't prove you took the veto unless you confessed. Yet, how many of you hesitated? How many of you felt a knot in your stomach taking the second candy?"
  *   *Observation:* If the majority kept the promise despite zero social penalty, the Practice View fails to explain the obligation. There was no practice to undermine.

  **3. Mapping the Alternative (Scanlon and Hart)**
  "If it wasn't about the group, why did it feel wrong to take the veto?"
  *   *Scenario A:* "You felt bad for disappointing them."
      *   *Mapping:* This aligns with **Scanlon (Expectation/Reliance)**. Even in private, you created a reasonable expectation. To violate it is to misuse the other person's trust.
  *   *Scenario B:* "You felt like *you* had already given away the candy once you said the words."
      *   *Mapping:* This aligns with **Hart/Voluntarism**. By using the word 'promise,' you exercised a normative power. You transferred authority over the resource to them. The obligation came from your own act of will, not the environment.
  *   *Critical Push:* "Which one fits your feeling better? Was the candy theirs the moment you spoke, or was it yours until you decided to disappoint them?"

  ---

  ### (d) Risk Assessment & Mitigation

  **Predictable Problem 1: Norm Importation.**
  Students will say, "I didn't want to eat the candy because it's just polite/rude." They import general moral norms from Phase 1 into Phase 2. They won't feel the philosophical tension; they'll just feel like being rude.
  *   *Mitigation:* In the Phase 2 instructions, explicitly state: *"Forget all previous classroom norms. Assume you are in a desert island scenario. The only thing that binds you is the words spoken between the two of you."* Additionally, instruct students in the debrief to identify if their hesitation was about "politeness" or "debt."

  **Predictable Problem 2: Rational Self-Interest.**
  Students might simply reason: "If I cheat now, I lose candy I don't care about for a future class."
  *   *Mitigation:* Frame the candies as "Bonus Credits" that roll over to final grades (even if just 0.5% impact). Make the stakes feel slightly material but low enough to allow conscience to compete. Ensure the Veto Slip offers immediate gratification ("Eat now") versus delayed abstract debt ("Owe later").

  **Predictable Problem 3: The "Fake Promise" Defense.**
  Students will argue they never genuinely *promised* in Phase 2; they were just playing a game.
  *   *Mitigation:* Pre-buttress this. Tell them: *"Treat the words as real. The philosopher cares about the linguistic act itself. If the word carries force in the context of the game, the puzzle remains valid."*

  ---

  ### (e) Follow-Up Discussion Question

  **The Prompt:**
  *"If you felt obligated in Phase 2 despite the absence of a practice, what is the mechanism that created that obligation? Did you 'create' an obligation (Hart), or did you merely acknowledge a pre-existing reason not to deceive (Scanlon)? If the latter, why does the specific utterance of 'I promise' add weight compared to saying 'I expect to do it'?"*

  **Suggested Reading:**
  Assign **"The Nature of Law" Chapter 6** from **H.L.A. Hart, *The Concept of Law*** (specifically the section on "Power-Conferring Laws").
  *   *Why:* It directly counters the Humean/Rule-based account by arguing that legal (and promissory) duties are often the product of individuals exercising powers conferred by law/rules, rather than passive compliance with social conventions. It provides the vocabulary for the "Will Theory" that emerged during the Phase 2 debrief.
