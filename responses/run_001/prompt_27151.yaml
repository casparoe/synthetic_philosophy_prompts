      *   *Decision Theory Nuance:* This is the battle between Causal Decision Theory (CDT) and Evidential/Functional Decision Theory (EDT/FDT).
      *   *Cost:* If you reject Superrationality (Step 2/5), you stick with Nash Equilibrium (Defect). You miss out on Pareto improvements in symmetric games.
