  2.  **Deconstruct the Arguments:**
      *   **Standard Game Theory (Causal Decision Theory - CDT):** Focuses on causal consequences. My action $A$ cannot physically change their action $B$. Therefore, I must maximize utility given whatever probability distribution exists over $B$. Since $Defect > Cooperate$ regardless of $B$, Defect is dominant.
      *   **Superrationality / Evidential Decision Theory (EDT) / Functional Decision Theory (FDT):** Argues that if agents are identical algorithmically, their outputs are logically correlated. If I decide to Cooperate, the copy also decides to Cooperate. Therefore, my choice determines the joint outcome.

  3.  **Evaluate the Steps of the Superrationality Argument:**
      *   *(1) Common Knowledge of Rationality:* Standard assumption in game theory. Hard to deny without making "rationality" undefined.
      *   *(2) Symmetry implies Same Move:* This is the crux. Why would a stranger make the *exact same* choice as me just because we are both rational?
