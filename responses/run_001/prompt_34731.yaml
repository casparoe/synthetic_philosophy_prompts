      *   *Philosophical Stakes:* The "Static Paradox" (how can one believe $P$ and $\neg P$ at the same time?) vs. The "Dynamic Problem" (how does the deceiver trick the deceived within the same mind?). The friend is trying to solve the Dynamic Problem by making the two agents the same person acting sequentially or compartmentally, essentially treating the self as two people.

