      *   *Claim 5 (Consciousness is an illusion/nothing it is like):* This is the contentious one. Dennett denies *Cartesian Theater* consciousness. He denies there is "something it is like" *in the philosophical sense* (qualia). However, saying "nothing it is like to taste coffee" sounds like nihilism (Illusionism). Dennett argues we are conscious, but not *like that* (phenomenal consciousness as traditionally defined). He prefers "heterophenomenology." He might resist the phrase "illusion" without qualification, preferring "confused concept." But "illusion" is often used by his critics and sometimes by him regarding *phenomenality*. The phrase "nothing it is like" is Nagel's phrase; Dennett rejects the premise that there *is* something it is like *in the relevant sense*.

