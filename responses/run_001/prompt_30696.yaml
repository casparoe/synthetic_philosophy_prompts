          **Resistance:** Dennett would resist the blunt conclusion that "there is really nothing it is like to taste coffee." While he denies *phenomenal consciousness* exists under traditional definitions, he does not deny conscious experience occurs. He argues consciousness is a real, functional capacity, not an illusion. Calling it an "illusion" suggests we are mistaken about existing, whereas Dennett argues we are mistaken about the *nature* of that existence. He redefines consciousness as complex information processing rather than a private inner show.
