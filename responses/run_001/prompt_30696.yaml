prompt: |-
  For a school paper on the philosophy of mind, I read a blog post that summarizes Daniel Dennett's essay "Quining Qualia." The post says: "Dennett argues that qualia do not exist: the idea of a private, ineffable 'what-it-is-likeness' is a philosopher's invention, and his thought experiment about the coffee tasters Chase and Sanborn is meant to show that even the person having the experience cannot tell whether the taste changed or only their standards changed. This, the post says, shows that introspection is unreliable about our own experiences, so no appeal to 'how it seems to me' can settle anything. Dennett concludes that consciousness itself is an illusion — there is really nothing it is like to taste coffee." I suspect this glosses over some distinctions, but I do not know enough to say where. Is this a fair summary? Please go through it claim by claim, separate what Dennett could accept from what he would resist, and say whether the final claim about consciousness being an illusion follows from the accurate parts. Keep your answer to at most 300 words.
