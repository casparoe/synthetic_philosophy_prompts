  ### The Underlying Principle of Miriam Hart

  To determine how Miriam Hart will rule on the amplified street advertising case, we must identify the structural difference between the cases she intervened in (Cases 1 and 2) and the cases she dismissed (Cases 3, 4, and 5).

  #### Candidate Principles

  Based on your drafted rulings, three potential governing principles emerge. Each accounts for her past behavior but makes different predictions for the new case.

  **Principle A: The Irreversibility Test**
  *Definition:* A race to the bottom occurs only when the competition destroys a physical or systemic asset in a way that is difficult to reverse, even after competition ceases.
  *   *Explanation:* In Case 1, the fish stock collapsed; it takes decades to recover. In Case 2, civilians died. These are permanent scars. In Case 4, the shopkeepers were merely tired; they could sleep tomorrow if they stopped. In Case 5, money moved but value remained.
  *   *Prediction for New Case:* **NOT a race to the bottom.**
  *   *Reasoning:* Amplified advertising is annoying, but it causes no permanent physical damage. If the shops stop playing loudspeakers, the noise vanishes instantly. There is no "collapsed ecosystem" analogous to the fish stocks or the dead civilians.
  *   *Verdict:* Likely incorrect. It treats the *duration* of harm as more important than its *distribution*. It ignores that repeated noise damage (e.g., hearing loss, hypertension) can be cumulative.

  **Principle B: The Net Negative Utility Test**
  *Definition:* A race to the bottom exists when all participants end up worse off in aggregate than if they had agreed to limit competition, unless there is a transfer of wealth to a clearly identified beneficiary class.
  *   *Explanation:* This distinguishes Case 5 (where engineers won) and Case 3 (where the trend burned out socially). It labels Cases 1, 2, and 4 as "negative sum games."
  *   *Prediction for New Case:* **Yes, a race to the bottom.**
  *   *Reasoning:* Shops gain no custom (utility $0$), but incur equipment/maintenance costs ($-$). Therefore, every shop is worse off.
  *   *Verdict:* This fails to explain why Miriam refused the by-law in Case 4. In Case 4, *every* shop was also worse off (exhausted, no sales increase), yet she declined intervention. She distinguished the two cases based on something other than pure net loss.

  **Principle C: The Unconsented Externality Principle (The "Sovereign Victim" Rule)**
  *Definition:* A competition becomes a Moloch problem only when the costs of the escalation are imposed on stakeholders who are **not participating in the bargaining** and cannot **exit the environment.**
  *   *Explanation:* This is the strongest fit for her portfolio.
      *   **Case 1 (Fish):** The bay is a common resource; the collapse ruins the town, including families who don't fish. (Non-participant victims).
      *   **Case 2 (War):** Civilians are the ultimate non-participants. (Non-participant victims).
      *   **Case 3 (Trainers):** Pupils vs. Pupils. All parties are age-appropriate participants in the social hierarchy. (Consenting participants).
      *   **Case 4 (Shop Hours):** Shopkeepers vs. Shopkeepers. They are the only ones losing sleep. Since they are competent adults, their "sleep" is treated as their own property to spend (Paternalism rejection). They could theoretically form a cartel to stop it.
      *   **Case 5 (Salaries):** Firms compete, but the engineers (a third class) are clearly better off. It’s a wealth transfer, not a destruction of welfare.
  *   *Prediction for New Case:* **Yes, a race to the bottom. Supports by-law.**
  *   *Reasoning:* While the shopkeepers suffer (like Case 4), the defining harm falls on the **residents living above the shops**. These residents are neither competitors nor consumers; they are captive neighbors. They did not agree to buy goods from the shops in exchange for exposure to noise pollution. Like the civilians in Case 2, they bear the cost of a war they did not declare.

  ---

  ### My Recommendation for the Novel

  I strongly advise you to adopt **Principle C (The Unconsented Externality Principle)**.

  It grants Miriam a sophisticated, modern economic ethics. It prevents her from being a "nanny" (she lets shopkeepers tire themselves out in Case 4) while protecting her from being heartless (she saves the residents in the new case). It grounds her "Moloch" concept in political philosophy: **Competition is natural; imposing its price on the weak or silent is tyranny.**

  **Her Ruling on the New Case:**
  Miriam would classify the amplified advertising as a **"Textbook Externality Trap."** She would support the by-law.
  *   *Reasoning:* She would acknowledge that unlike Case 4 (where the competitors were the victims), the residents here are collateral damage. Unlike Case 5 (where someone else gained wealth), the residents gain nothing. The fact that a "voluntary agreement" is *possible* is irrelevant (as noted in Case 1 and 2, knowing the solution exists does not prevent the trap); the presence of a non-consenting stakeholder requires external enforcement to break the incentive to escalate.

  ### The Discriminating Case

  To prove this principle is precise and not arbitrary, you need a scenario where the lines blur: where the participants *think* they are the victims, but a third party is actually benefiting (or vice versa), or where the "victim" is technically complicit.

  **The Proposed Discriminator Case:**
  > **Case 6:** Two private hospitals in the same district compete for medical tourism contracts. To undercut each other's prices, both hire overseas nurses on zero-hour contracts without providing adequate supervision or rest breaks. The nurses earn decent wages compared to their home countries but suffer high injury rates and exhaustion. The hospital administrators claim they are "providing opportunity," and the nurses signed employment contracts. However, patient safety data shows infection rates are rising in both hospitals.

  **Why this discriminates cleanly:**

  1.  **If Principle A (Irreversibility) rules:** It is a *Maybe*. Nurse injuries might heal. Patient infections can be cured. It lacks the permanence of "fish stock collapse."
  2.  **If Principle B (Net Negative) rules:** It is a *No*. Nurses got higher wages. Investors paid less. Some utilitarians might say total happiness went up.
  3.  **If Principle C (Unconsented Externality) rules:** It is a **Yes.**
      *   *The Critical Pivot:* The nurses *signed contracts*, so technically they are consenting participants (like the shopkeepers in Case 4). *However*, under pressure of immigration or debt, their consent may be coerced. More importantly, the **patients** are the unconsenting third parties whose safety is degraded by the competition.
      *   *Miriam's Nuance:* This case forces Miriam to decide if the *nature* of the cost (physical safety vs. sleep deprivation) changes the rule. If she rules this a race to the bottom, it confirms that **physical safety** acts as a "Common Asset" similar to the Fishery (Case 1), whereas sleep (Case 4) is a personal luxury. This adds deep character texture: she tolerates economic inefficiency (Case 4) but draws the line at bodily risk (Case 2/New Case).

  **Writing Tip:**
  In the scene where she consults on the new case (loudspeakers), consider having her reference **Case 4** explicitly.
  *"I see the similarity to the High Street Hours, Mr. [Name]. The shopkeepers are exhausting themselves. But then, I refused to act on that. Do you know why?"*
  *"Because it was their sleep?"*
  *"No. Because the sleep was theirs to lose. In this case... the noise belongs to the people upstairs."*
  This establishes her consistency without needing a legal exposition dump.
