          *   Hypothesis: Upper-level courses are harder (lower pass rates generally), Intro courses are easier (higher pass rates).
          *   Hypothesis: One format was used more for hard courses, the other for easy courses.
          *   *Scenario Construction:* If In-Person was mostly used for Intro classes (easy) and Online mostly for Upper-level (hard), In-Person will look better overall even if Online is better within each category.
