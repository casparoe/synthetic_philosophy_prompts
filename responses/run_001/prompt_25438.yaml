      *   *Fix for (3)/(1)/(5):* Refine (3) to acknowledge domains where first-hand experience is constitutive of the knowledge.
      *   *Fix for (4)/Testimony:* Acknowledge that testimony conveys *propositional knowledge* (that X is beautiful) but not *experiential knowledge* (knowing what beauty feels like).

  6.  **Formulate a Definite Position:**
      *   Where should the user revise?
