          *   *Better Fix:* The tension is strongest between **(2)** and **(1)**. If I haven't seen *Parasite*, do I really think it's better, or do I think "It is true that experts think it's better"?
          *   *Decision:* The most coherent stance requires distinguishing between *testimony that yields knowledge of facts* vs. *testimony that yields competence in judgment.*
          *   *Refined Decision:* The biggest issue is **(2)**. It conflates believing *others'* judgments with making your own judgment. To fix this, accept that you can trust expert opinion without experiencing the object, BUT you aren't making an aesthetic judgment yourself.
          *   Also need to adjust **(3)**. "No special hurdles" is too strong for response-dependent properties.
