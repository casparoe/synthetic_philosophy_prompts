answer: |-
  This is a rich pedagogical pairing. *Wit* functions almost like a dramatized critique of high-minded philosophy applied to the messiness of biology. To teach this effectively, you want students to see where philosophy holds up and where it shatters against the texture of human experience.

  Here is a framework for analyzing the play through Epicurus and the Deprivation Account, addressing your specific questions about the blurring of states and the ending.

  ### 1. The Epicurean Shield vs. The Reality of the Body
  Epicurus’s argument rests on a clean logical distinction: **Death is nothing.** It is a threshold. You do not cross it into suffering; you simply cease to be the subject of experience. Therefore, the *state* of being dead cannot be feared. What is to be avoided is only the *process* of dying (pain), but once the body stops, the mind stops, and the fear ceases.

  **How the Play Resists Epicurus:**
  *Wit* is largely about the failure of the "clean logic" of Epicurus (and Donne) to protect the subject from the visceral horror of the *process*. Vivian Bearing begins the play trying to live by the logic of the text. She believes if she masters the language of death, she will conquer it. She treats her own illness like a text to be parsed.

  However, the play constantly demonstrates that **the state of being dead bleeds into the process of dying.** Vivian's terror is not merely about the moment of cessation; it is about the loss of control, the indignity of the catheter, the coldness of the room, and the feeling of her consciousness fraying *before* the heart stops.

  **Does Edson Blur the Distinction?**
  Yes, absolutely. And she does so deliberately to show that **the anticipation of non-existence contaminates the present existence.**
  *   **Why it matters:** For Epicurus, the boundary is sharp. For Vivian, the boundary is porous. The "fear of death" is not a rational confusion for her; it is a pervasive atmospheric pressure that alters every relationship and physical sensation.
  *   **The Lesson:** The play suggests that distinguishing "dying" from "being dead" intellectually is impossible for the living. We project our future annihilation onto our current suffering. When Vivian stares at the ceiling and waits for the next round of chemo, she is experiencing "death in advance." Edson argues that you cannot philosophize away the *embodiment* of the end.

  ### 2. The Deprivation Account: What Actually Gets Lost?
  The Deprivation Account (often associated with Thomas Nagel) argues that death is bad because it deprives the person of the goods of life they would have otherwise experienced. It focuses on the **negative value of the absent future.**

  **Where the Play Supports This View:**
  The play is much more aligned with the Deprivation Account than with Epicurus. Throughout the first two acts, Vivian views her "goods" academically—her tenure, her ability to deconstruct metaphors, her intellect. But as the disease advances, the definition of "goods" shifts radically.
  *   **Concrete Goods:** The deprivation becomes palpable. She is deprived of food (she vomits), touch (no one wants to hold her), privacy (gowns open in front of strangers), and mercy (doctors treating her like a specimen).
  *   **The Tragedy:** The tragedy of *Wit* is not that she stops existing (Epicurus), but that she is cut off from the specific, fragile connections she ignored while she was capable. She realizes she is deprived of the "ordinary" things—warmth, kindness, the ability to eat an ice pop—that she previously dismissed as trivial compared to "high art."

  **The Shift:**
  In Act II, when Susie (the nurse) brings Vivian water or helps her wash, these are small goods. Vivian recognizes too late that these "small goods" are actually the substance of life. The play argues that death is bad primarily because it interrupts the possibility of receiving and giving simple human care. This is a robust support for the Deprivation Account, specifically emphasizing **relational goods** over material ones.

  ### 3. The Ending: Swapping Consolations (Donne vs. *The Runaway Bunny*)
  You asked about the ending and whether it simply swaps one consolation for another. This is a pivotal moment for student discussion.

  **Donne:** Represents **Competence, Mastery, and Defiance.**
  Throughout the play, Vivian clings to Donne. It represents her identity as a scholar. Even in her delirium, she parses his metaphors. It offers a theological promise (resurrection) that validates her ego: *Death is vanquished; I am saved.*

  **The Runaway Bunny:** Represents **Vulnerability, Dependency, and Grace.**
  When Susie reads the bunny story (note: in the script it is the nurse Susie who reads it, though some productions may vary), the dynamic changes completely. It is no longer about a battle against death; it is about a mother searching for her child unconditionally.
  *   **Is it a swap?** Yes, it is a transaction of solace. She trades the *logic* of salvation for the *feeling* of safety.
  *   **Philosophical Implication:** The bunny story acknowledges dependence. The bunny hides, and the mom finds him. It implies that when she cannot find herself (in death/dementia), someone else will still find her.
  *   **Does it solve the metaphysics?** No. It doesn't prove death is nothing (Epicurus) or that something awaits us (Donne). It simply addresses the **loneliness** of the dying. It admits that the end is frightening, and instead of fighting the fear, it offers companionship within it.

  **My Recommendation for Teaching the Ending:**
  Tell your students that the ending refuses to give a "philosophical answer" to death. Instead, it gives an **ethical answer**.
  *   The Epicurean/Donne view says: "Prepare your mind, because you are safe."
  *   The Bunny view says: "You are safe because you are held."
  The play suggests that when facing death, *how* you are treated matters more than *what* you know. It is a rejection of "Wit" in favor of "Mercy."

  ### 4. Where the Play Resists the Philosophy (The "Truth" of the Text)
  To help your students avoid flattening the text, you can use this breakdown:

  **A. Where Philosophy Flattens the Play:**
  *   **Epicurus flattens the body:** By focusing on the "state," Epicurus ignores the fact that we are biological creatures who feel pain and shame long before death occurs. The play restores the dignity of the suffering body that philosophy often dismisses.
  *   **Donne flattens the fear:** The sonnet demands bravery. The play shows that bravado is a mask. Vivian is terrified and ashamed, which is a valid response that shouldn't be "corrected" by a philosophical aphorism.

  **B. Where the Play Resists the Philosophy:**
  *   **The refusal of closure:** Epicurus wants us to understand that death is the end, so we stop worrying. The play offers no such clarity. Vivian's consciousness flickers out without a grand realization. The last thing we hear is not a perfect quote, but a fading breath. The mystery remains.
  *   **The value of the "Small":** Both Epicurus and Donne (in their different ways) deal in universals (the soul, the void). The play insists that meaning is found in particulars: the taste of frozen grapes, the hand holding yours, the light dimming.

  ### Summary Thesis for Your Unit
  *Wit* begins as a test of whether high philosophy can withstand the reality of mortality. Vivian attempts to use Donne and Epicurean detachment as shields. The play systematically dismantles both.

  While the play utilizes the **Deprivation Account** to show *why* death is tragic (because it strips away the capacity for love and connection), it ultimately moves beyond philosophy into ethics. It argues that we cannot talk ourselves out of the fear of dying; the only antidote is not wisdom, but **care.**

  The final image of Vivian reciting Donne is not her triumph over death, but her retreat into the only language she knows. But the true resolution occurred earlier, in the quiet space where the professor/nurse stopped lecturing and started holding her hand. That is where the play locates its truth: not in understanding death, but in surviving the proximity to it together.
