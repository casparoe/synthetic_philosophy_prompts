      *   **The Ending:** Aspiration to "knowing" gives way to simple human comfort (*The Runaway Bunny*).
      *   **The Donne Sonnet:** "Death, be not proud." Vivian recites it at the end. It's a defiant stance. But the narrative action suggests she needed more than intellectual victory.

  4.  **Drafting - Section by Section:**

