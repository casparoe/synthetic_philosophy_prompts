      *   **Epicurus and the Process of Dying:**
          *   Clarify Epicurus: He talks about the *state* of death, not the *process*.
          *   *Wit*'s Focus: Almost entirely on the process (chemo, tubes, coldness).
          *   *Blurring:* Edson blurs them. Why? Because the *fear* of death contaminates the living. Vivian fears the silence/non-existence before she even dies.
          *   *Verdict:* The play resists Epicurus here. For Vivian, the anticipation of non-being causes terror *while alive*. The intellectual armor fails.

      *   **The Deprivation Account:**
          *   What is lost? Not just time, but connection, warmth, agency.
          *   Vivian realizes her life was spent prioritizing "wit" over "mercy."
          *   The deprivation is concrete: she misses out on ordinary human experiences she never valued until they were gone (eating ice cream, touching someone).
          *   *Verdict:* Stronger alignment. Her tragedy is what is taken away, not the state of non-existence itself.

      *   **Distinguishing Dying from Being Dead (The Crucial Blurring):**
          *   This needs specific attention. Epicurus distinguishes them to cure anxiety. Edson merges them to show how the *anticipation* defines the living person.
          *   By showing the humiliation of the body, Edson argues that we cannot separate the mind from the biological vessel easily. The "I" dies gradually, not instantly.

