  2. Following Lon Fuller, a rule serving solely to persecute a class lacks the internal morality necessary to constitute genuine university law. Therefore, the disciplinary actions taken under it suffered from a fundamental defect of legality rather than merely being unjust applications of valid authority.

  3. Hart argues that separating law from morality prevents committees from rewriting history to suit present biases. We respect this caution against revisionism but maintain that this rule failed the internal morality required for law itself.

  4. My recommendation stands only because the regulation lacked any legitimate legislative purpose other than persecution. Should credible evidence emerge proving the rule served a protective function distinct from targeting sexual orientation, I would advise treating the degrees as a new award of honour instead.

  5. Accordingly, the committee minutes should record the degrees as conferred retroactively on the basis of the expulsion's nullity. This approach corrects the record while maintaining fidelity to the internal logic of our governance.
