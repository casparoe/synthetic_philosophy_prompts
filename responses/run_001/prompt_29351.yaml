answer: |-
  # Activity Design: The Sincerity Lottery

  ## Objective
  To allow students to experientially encounter the structure of Gregory Kavka’s Toxin Puzzle—specifically the tension between having sufficient reason to form an intention and having insufficient reason to execute the corresponding action—without invoking the name of the philosopher or the terminology of the puzzle initially.

  ## Materials & Preparation
  *   **One medium-sized jug** containing a mixture of 80% water and 20% white wine vinegar. (Harmless but sharply unpleasant).
  *   **Sixteen small plastic cups** (one per student).
  *   **Slips of paper** (blank) and pencils.
  *   **A visual timer** projected on the screen.
  *   **Bonus Points Vouchers** (physical slips promising a 5% bonus on the next seminar participation grade).

  ## Timeline (75-Minute Session)

  ### Phase 1: The Proposal (Minutes 0–15)
  **Setting the Scene:**
  Tell the class they are participating in a test of 'predictive agency'. Announce a special opportunity available solely to today's attendees.

  **The Rules:**
  > "There is a bonus available. Ten vouchers exist. Each voucher grants a 5% bonus on your next participation grade.
  >
  > To receive a voucher, you must satisfy one criterion: **You must genuinely intend to drink this solution within the next twenty minutes.**
  >
  > Please note carefully: I am paying you for your *intention* at the moment of declaration, not for the act itself. Once I grant the voucher based on your declaration, I will not require you to drink the solution to redeem the value of the bonus. However, I am relying on your assessment of your own future will. If you do not genuinely expect to drink it, you should not take the voucher."

  **Instruction:**
  Hand out the cups (filled halfway with the vinegar mixture) and blank slips of paper. Do not distribute vouchers yet.

  ### Phase 2: The Declaration (Minutes 15–25)
  **The Task:**
  Ask students to consider the situation quietly. Display the timer counting down 10 minutes.
  > "Take five minutes to reflect. Do not overthink. At the end of this period, you will hand in a slip.
  >
  > Write 'YES' if you currently possess the intention to pick up that cup and drink it before the class ends.
  > Write 'NO' if you do not.
  >
  > Note: If you write YES, and I award you the voucher, I trust you will proceed to drink the contents shortly. However, remember the rule: the bonus is granted *because* of the intention, regardless of whether you follow through later. There is no penalty for reneging, nor is there any additional reward for completing the act.
  >
  > Your goal is to maximise the bonus. My goal is to verify the sincerity of the intention."

  **Collection:**
  Have students fold their papers and place them face-down on the front desk. Collect them without looking.

  ### Phase 3: The Payoff and the Gap (Minutes 25–35)
  **Distribution:**
  Announce that you have reviewed the slips. Distribute the Bonus Vouchers to everyone who wrote 'YES'. (Assuming most will write 'YES' to secure the points).

  **The Trigger:**
  Ask the class to look at their cups.
  > "You now hold a voucher. You have no obligation to drink. In fact, since the money is already yours (metaphorically), there is zero benefit to you in drinking the vinegar tomorrow or in this class. There is, however, a slight disgust cost.
  >
  > Those who received vouchers: Are you still going to drink? Raise your hands if you are still intending to drink the solution *right now*."

  **Observation:**
  Note the drop in raised hands. Some may have decided to drink to prove themselves; most will likely lower their hands once the incentive (the *need* to prove they intended it) is removed from the equation.

  ### Phase 4: The Debrief and Mapping (Minutes 35–65)
  **Introduction of the Concept:**
  Reveal that this is **Gregory Kavka’s Toxin Puzzle**. Explain the philosophical problem that just manifested physically in the room.

  **Mapping the Experience:**
  Guide a discussion using the following prompts:
  1.  **Reasons to Intend vs. Reasons to Act:**
      *   "Why did you write 'YES'? Because you wanted the voucher." (Reason to intend).
      *   "Why did you hesitate to drink? Because there is no further gain, only pain." (No reason to act).
      *   "How does this create a conflict? If I cannot find a reason to drink, can I honestly claim I intend to?"
  2.  **Deciding vs. Predicting:**
      *   When you wrote 'YES', were you making a prediction about your future behaviour ('I will probably drink') or a decision/volition ('I resolve to drink')?
      *   If it was just a prediction, you were wrong (as many lowered hands).
      *   If it was a decision, why did the decision evaporate once the voucher was 'secured'?
  3.  **The Epistemic Gap:**
      *   "I told you I rely on your assessment. Can you assess your intention accurately? Can you intend to do something if you simultaneously know you will not do it?"
      *   Discuss the paradox of **instrumental rationality**: To maximise utility, you must intend the drink. But once you have the intention (and the payoff secured), rationality demands you *not* drink. Thus, a rational agent is trapped and cannot form the necessary intention to get the payoff.

  ### Phase 5: Conclusion (Minutes 65–75)
  Wrap up by distinguishing **Decisions** (actions that settle the matter) from **Predictions** (beliefs about what will happen). Ask if there are ways out of the puzzle (e.g., Gratitude, Pre-commitment devices, Self-deception) and assign a short reading on these responses for next week.

  ---

  ## Contingency Planning: What Goes Wrong

  In the first run of this activity, students will inevitably deviate from the 'pure' philosophical model in two predictable ways. Here is how to handle them.

  ### 1. Strategic Gaming (The "Smart Aleck")
  **Scenario:** A student openly claims they will write 'YES', get the voucher, and then explicitly state they never intended to drink it anyway. They argue that because you cannot verify their internal mental state, the puzzle fails as an experiment.
  **Response:**
  Do not punish them, but utilise them for the lesson. Say: *"That is a valid objection regarding the experimental setup. In Kavka’s original thought experiment, the benefactor is an infallible predictor. In this room, I am fallible. You are gaming the *classroom mechanic*, not solving the *philosophical problem*. However, consider this: Even if you cannot trick me, can you trick yourself? Do you genuinely believe you possess the psychological faculty to intend an action you know you will reject?"*
  Move the debate from external enforcement (my authority) to internal coherence (your psychology).

  ### 2. Performative Compliance (The "Stoic")
  **Scenario:** A student receives the voucher, then stands up and drinks the vinegar immediately, insisting this proves their intention was real.
  **Response:**
  Acknowledge the sacrifice. *"You acted to demonstrate consistency. But notice: now your action was caused by a desire to validate the voucher, or a desire to appear consistent, not purely because you 'intended' to drink in the abstract sense. Did you act because the intention existed, or did the intention solidify only when you saw the cup?"*
  Use this to distinguish **Acting on Reason** (drinking because it's beneficial) vs **Acting on Identity** (drinking because I claimed I would).

  ---

  ## The Limitation of the Classroom Simulation

  You must be explicit with the students about one critical failure in simulation fidelity, otherwise, they will dismiss the result as a flaw in the exercise rather than the logic of the puzzle.

  **The Unreproducible Feature: The Omniscience of the Benefactor**
  In the actual Toxin Puzzle, the payoff depends on a **private mental state** that is known perfectly by the Benefactor at the exact moment of formation ($T_1$).
  In this classroom, I (the Teacher) am **blind** to the private mental state.
  *   **Consequence:** Students know they can lie to me.
  *   **Effect:** It reduces the pressure of the puzzle. If the Benefactor could see their intentions, saying "YES" while planning "NO" would be impossible (since the Benefactor wouldn't pay).
  *   **Pedagogical Fix:** Acknowledge this freely during the debrief. *"The fact that some of you felt you could lie to me without consequence is exactly why Kavka posits a perfect predictor. The puzzle is designed to bypass the ability to bluff. Today, you experienced the rational tension, but you escaped the logical bind because I am not omniscient. Imagine if you had to convince yourself that your intention was true, knowing I could detect the lie. Would the 'YES' slips have been written?"*

  ## Summary of Philosophical Mappings

  | Classroom Phenomenon | Philosophical Concept |
  | :--- | :--- |
  | Desiring the Bonus Voucher | **Instrumental Reason to Intend** |
  | Disliking the Vinegar | **Instrumental Reason to Act (Negative)** |
  | Writing 'YES' without certainty | **The Problem of Self-Knowledge** |
  | Lowering hands after receiving voucher | **The Collapse of Intention under Rationality** |
  | Difference between 'Writing YES' and 'Drinking' | **Deciding vs. Predicting** |

  This design ensures students confront the *feeling* of the puzzle—the inability to align one's current mental state with a future action that lacks justification—before you provide the vocabulary to analyse it.
