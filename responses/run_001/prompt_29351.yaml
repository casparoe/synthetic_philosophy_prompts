      *   *The Catch:* He pays based on my *intention*, not the drinking. But he is a perfect predictor (or relies on a mechanism that ensures I can't just lie).
      *   *The Dilemma:* Once midnight passes and payment is secured (hypothetically), there is no incentive to drink. So why form the intention? If I know I won't drink, I can't genuinely intend. If I can't intend, I don't get paid. Therefore, rational agents might never get paid.
      *   *Core Conflict:* Instrumental rationality (maximising utility at each stage) blocks the formation of the necessary mental state (intention) required for the reward.

