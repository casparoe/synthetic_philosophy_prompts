      *   *Evidence/Criterion:*
          1.  **Language:** Animals cannot use signs in response to things in general or express universal thought. They make sounds, but not structured communication.
          2.  **Reason/Flexibility:** Animal behavior is fixed, instinctual, like clockwork. If they act differently, it's just mechanical configuration, not adaptation via thought.
          3.  **Pain/Suffering:** Animals do not *feel* pain; their yelps are purely functional mechanical reactions (like a clock striking). Suffering requires a soul/consciousness.
