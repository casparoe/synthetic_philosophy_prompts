      *   *Hierarchy:* Humans > Replicants (who are "slaves," "things," "skin jobs"). *Real* animals (pepper spray owl, etc.) are status symbols, rare and protected. Fake animals (Deckard's unicorn) are props.
      *   *Theme:* What makes us human? Memory? Empathy? Mortality?

  4.  **Address Specific Question 1: The Test (Language vs. Empathy)**
      *   *Descartes:* Language/Reason = Mind. Behavior/Pain = Mechanism.
      *   *Blade Runner:* Empathy = Humanity. Rational speech = Irrelevant (Replicants speak perfectly, argue, reason).
      *   *Analysis:* It is an *inversion*. Descartes would grant Replicants minds immediately because they use complex language and solve problems (Roy Batty is articulate, strategic). The V-K test rejects language as sufficient, requiring a "non-rational" physiological sign of affect.
      *   *Nuance:* However, both rely on an external proxy for internal states. Descartes infers *no* mind from lack of language. V-K infers *no* humanity from lack of pupillary response. Both reduce the mystery of mind to a diagnostic procedure.

  5.  **Address Specific Question 2: Value Hierarchy & The Line**
      *   *Descartes:* Human (Soul) > Animal (Machine).
      *   *Blade Runner:* Natural Human/Animal (Sacred) > Artificial Human (Disposable). Note the shift: Real animals are treated better than artificial humans.
      *   *Does the film notice?* Yes. The Tyrell Corporation treats replicants as products. But the film (through Deckard and Roy) shows that the *line* is blurry. Roy Batty's "Tears in Rain" monologue asserts subjective experience.
      *   *Indictment:* The film suggests the distinction between "person" and "thing" is a tool of power, not metaphysical truth.
      *   *Where it breaks:* Descartes is worried about epistemological certainty (how do I know?). *Blade Runner* is worried about ethics (how do I treat?). Also, Descartes distinguishes based on origin/divine gift; V-K distinguishes based on biological engineering.
      *   *The "Real Animal" irony:* In the movie, keeping a real animal is a sign of wealth/status, yet the "beast-machine" doctrine treats real animals as mere matter. The film actually restores a kind of Cartesian dualism but swaps the categories: The "machine" has the soul, the "natural" is sometimes empty (Tyrell is blind/dead).

