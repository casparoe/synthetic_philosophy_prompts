          *   *Status:* High promise within panpsychism because it accepts the premise (subjects exist) and tries to bridge the gap without resorting to brute emergence or denying the parts.

      *   **2. The Emergence View (Strong Emergence):**
          *   *Concept:* Micro-experiences + Organization = Macro-consciousness (new property). Acknowledges irreducibility.
          *   *Strengths:* Consistent with how we view many things in science (water wetness, etc.).
          *   *Weaknesses:* In the context of panpsychism, this usually just pushes the mystery back. How does arrangement of *experiencers* create a *new experiencer*? It looks like magic. Galen Strawson often calls this "coherentist emergentism." Most philosophers consider strong emergence a last resort or non-solution.
          *   *Status:* Low/Medium promise. It effectively admits defeat on reduction/explanation.

      *   **3. The Proto-phenomenal View (Russellian Monism / Neutral Monism leanings):**
          *   *Concept:* Fundamentals aren't conscious *subjects*, they have proto-experiential properties (categorical bases of disposition).
