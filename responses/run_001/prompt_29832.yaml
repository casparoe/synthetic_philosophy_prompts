prompt: |-
  I'm a software engineer at a mid-size company and I end up running the postmortem for most of our production incidents — maybe two or three a month. One thing that keeps coming up is whether the incident was caused by something we didn't do: a check we didn't write, a runbook step that got skipped, an alert threshold we never set, a test that was never added. We write these up as causes or contributing factors, and the wording drives what gets fixed and sometimes who gets blamed; in a couple cases our customer contracts have SLA credits tied to the root-cause wording, so its not just an internal label. I have no philosophy background, but a friend of mine does and he says there's a whole literature on causation by omission — whether absences can be causes at all, whether the right test is counterfactual ('would the incident still have happened if we'd done the thing?'), and whether the answer secretly depends on what we expected somebody to do. He says our postmortem fights are basically that debate with a Jira ticket attached.

  What I want is a reusable decision procedure my team can actually run on an incident report — a checklist or flowchart in words — for deciding when an omission should be listed as a cause of an incident. It has to be something an ordinary engineer can run in maybe 20 minutes during a postmortem, without me in the room to explain the theory. It should say what questions to ask in order, what counts as a good enough answer to each, where the procedure stops and says 'not a cause' or 'contributing factor', and where it has to hand the decision to a person because it's a values call rather than a factual one. Please ground it in whatever the philosophy of causation actually knows about omissions, but translated into language we can use: keep the distinctions that survive the translation, and tell me which ones you dropped and why. Then run the procedure on three anonymized cases from our backlog: (1) a database outage where nobody had set a max-connection limit and a runaway query exhausted the pool; (2) an incident where the on-call engineer skipped a step in the runbook that would have caught a bad config before deploy, but the step had been wrong or misleading for months and everyone who had run it recently had skipped it too; (3) an incident where two independent safeguards were both missing — a validation check and an alert — and either one alone probably would have prevented the customer-facing error. I especially want to see a case where the procedure gives an answer my team won't like, and I want you to be honest about what the procedure cannot do — where it's really a management or blame question dressed up as a causal one.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Software Engineer running postmortems at a mid-size company (2-3/month).
      *   **Problem:** Disagreements over "causation by omission" (didn't write a check, skipped a runbook step, no alert). This affects blame, fixes, and SLA credits.
      *   **Input:** A friend (philosopher) introduced them to the literature on causation by omission (counterfactuals, expectations/norms).
      *   **Goal:** A reusable decision procedure (checklist/flowchart in words) for deciding when an omission is a "cause."
      *   **Constraints:**
          *   Must be runnable by an ordinary engineer in ~20 mins without the user present.
          *   Grounded in philosophy of causation but translated into engineering language.
          *   Must specify question order, acceptable answers, stop conditions ("not a cause", "contributing factor"), and where it hands off to human judgment/values.
          *   Must explain what distinctions were kept/dropped and why.
          *   Must apply the procedure to three specific cases.
          *   Must identify where the procedure yields unpopular/uncomfortable answers.
          *   Must be honest about limitations (blame vs. causal analysis).

  2.  **Philosophical Foundation (The "What survives the translation"):**
      *   *Counterfactual Dependence:* The standard view (Humean/Lewisian). $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred. For omissions: Had the action been performed, would the incident have been prevented?
      *   *Normativity/Expectations:* Pure counterfactuals fail here (e.g., I didn't fly to London to save you from a crash). If the agent had no duty/capability, it's not a cause in a practical sense. We need a "normative background." Did we *expect* this? Was it feasible?
      *   *Prevention:* An omission is often seen as a failure of prevention rather than a direct generator of harm.
      *   *Proximity/Distance:* Some omissions are too remote (metaphysical distance). Engineering needs proximate causes.
      *   *Dropped Distinctions:* Metaphysical debates about "negative events." Strict liability concepts. Deep moral responsibility vs. system design responsibility.

  3.  **Drafting the Decision Procedure (The "Checklist"):**
      *   *Phase 1: The Counterfactual Test.* (Did doing X prevent Y?)
      *   *Phase 2: The Feasibility Check.* (Could anyone reasonably have done X?)
      *   *Phase 3: The Expectation/Norm Check.* (Was X part of our known responsibilities?)
      *   *Phase 4: Classification.* (Direct Cause vs. Contributing Factor vs. No Label).
      *   *Phase 5: The Values Handoff.* (Where do humans need to weigh tradeoffs?).

      *Refining for 20 mins:* Keep it tight. Yes/No questions. Binary gates leading to outcomes.

  4.  **Developing the Procedure Steps:**
      *   Step 1: Counterfactual. "If [Action] was taken, would the Incident likely have been avoided?"
      *   Step 2: Knowledge/Capacity. "Did the responsible team have the knowledge/tools to take [Action] at that time?"
      *   Step 3: Established Norm. "Was [Action] an explicit requirement, standard industry practice, or clearly implied by prior architecture decisions?"
      *   Step 4: Cost/Benefit (The values call). "Was implementing [Action] cost-prohibitive compared to the risk?" -> *Wait, this makes it complex.* Better to frame it as: "Is this a known gap in the security/reliability model?"
      *   *Revision:* Let's stick closer to the prompt's request for "omission as cause."
      *   Proposed Framework: **The Omission Filter.**
          1.  *Counterfactual Link:* Would doing it stop the bleed?
          2.  *Reasonableness:* Was it reasonable to expect that person/team knew to do it?
          3.  *Systemic Ownership:* Is this a guardrail the system should have had automatically?

  5.  **Selecting What to Drop:**
      *   Drop metaphysical "existence of negative facts" (too abstract).
      *   Drop strict legal/moral blameworthiness (keep it to technical causality + organizational learning).
      *   Keep "Normative Expectation" (it distinguishes 'I didn't call the fire department' from 'The sprinkler didn't go off').

  6.  **Applying to Cases:**

      *   *Case 1 (DB Connections):* No max limit set. Runaway query.
          *   Counterfactual? Yes (limit stops exhaustion).
          *   Feasible? Yes (standard config).
          *   Norm? Industry standard for DBs.
          *   *Result:* Cause (but fix is systemic, not personal).

      *   *Case 2 (Runbook Skip):* Skipped step, but step was misleading/wrong.
          *   Counterfactual? Debatable. If step is wrong, doing it might not catch it. But wait, prompt says "skipped... that would have caught a bad config". So let's assume counterfactual holds (doing it would have found it).
          *   Reasonableness? No. Everyone skipped it recently because it was misleading.
          *   *Result:* Contributing Factor only (system failed the engineer), or Not a Cause (engineer followed social proof/sensible heuristic). Let's lean towards "Not a root cause of the incident" regarding the *person*, but "Root Cause" regarding the *process*. Need to be careful with wording. *Decision:* The omission (of the engineer) is NOT a cause; the maintenance of a broken runbook IS a cause.

      *   *Case 3 (Two Missing Safeguards):* Validation + Alert missing. Either would work.
          *   Counterfactual? Yes.
          *   Norm? Should both exist? Usually defense in depth implies layers. But resource constraints matter.
          *   *Unpopular Answer:* Neither omission is the *singular* root cause. Both are contributing factors. Or, if we say "Validation is primary," Alert is secondary.
          *   *Hard Truth:* This exposes the "Blade Runner problem." We want to blame someone so we can fix something. But here, it's a gap in the whole strategy. The procedure should flag this as "Management Values Call."

  7.  **Addressing the "Unpopular Answer" & Limitations:**
      *   Case 2 is perfect for the unpopular answer. Engineers hate blaming a person who followed a broken process. The procedure must absolve the individual but indict the runbook owner.
      *   Case 3 shows the limitation: You can't solve "infinite safeguards." The procedure must stop at "Is this worth the cost?" which is a management call.
      *   Honesty: Causation is a story we tell to predict the future. It doesn't exist in nature like gravity.

  8.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the philosophical weight (Lewis, Moore, Hart & Honoré).
      *   **The Decision Procedure (The Protocol):** Numbered steps, clear Yes/No paths.
      *   **Translation Notes:** What came from philosophy, what was cut.
      *   **Case Analysis:** Applying the protocol to the 3 scenarios. Highlighting friction points.
      *   **Limitations:** Where the rubber meets the road (politics, money, blame).

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20 minutes enough for Case 3?
      *   *Fix:* Ensure the "Values Handoff" step is distinct. Don't force a binary yes/no there.
      *   *Critique:* Does the runbook case feel right?
      *   *Fix:* Distinguish between "Engineering Omission" (the code) and "Human Omission" (the skip). The prompt asks about the *incident report*, so we label things.
      *   *Tone:* Pragmatic, empathetic, technically rigorous. Avoid academic jargon but keep conceptual integrity.

  10. **Final Polish:** Check against all constraints. (Did I mention SLA credits? Yes. Did I explain dropped distinctions? Yes. Is it actionable? Yes.)

  *(Self-Correction on Case 2)*: The prompt says "skipped a step... that *would have caught* a bad config." I must accept the counterfactual premise for the sake of the exercise. However, the step was "wrong or misleading." This creates tension. If the step gives false positives often, skipping it is rational. The procedure must account for *rational compliance*.

  *(Self-Correction on Case 3)*: Two safeguards missing. Philosophically, this is "overdetermination" or "joint production." If both fail, they share the load. If either prevents it, relying on one is negligence? No, relying on one is a choice. This is where "values" enter. Which layer is cheaper/better? The procedure should push this to management.

  Let's assemble the response.cw
answer: |-
  This is a classic engineering governance problem wrapped in a philosophical knot. Your friend is right: the arguments you are having are exactly those debated by John Stuart Mill, H.L.A. Hart, Tony Honoré, and David Lewis. The core tension is between **counterfactual dependence** (if the action happened, would the error have stopped?) and **normative expectations** (were we entitled to expect that action?).

  Below is a decision procedure designed to fit into your incident lifecycle. It translates high-level metaphysics into engineering heuristics while preserving the critical distinctions that determine fairness and accuracy.

  ### The Decision Procedure: "The Omission Filter"
  **Timebox:** 15–20 Minutes per candidate omission.
  **Participants:** Incident Commander + Scribe + Tech Lead (no managers initially).

  #### Phase 1: The Counterfactual Gate (Facts)
  *Ask these questions strictly. No opinions allowed yet.*

  1.  **The "Stop" Question:** If the omitted action had been performed exactly as hypothesized, is there strong evidence the incident would have been prevented or mitigated significantly?
      *   *Yes:* Go to Q2.
      *   *No:* **STOP.** Mark as "Observation Only" (not a cause). Do not list in Root Cause section.
  2.  **The "Timing" Question:** Could that action have been realistically performed *at the relevant time window* (before the deploy, before the outage started, etc.)?
      *   *Yes:* Go to Q3.
      *   *No:* **STOP.** Mark as "Post-Mortem Improvement." (It was physically impossible or logistically excluded).

  #### Phase 2: The Reasonableness Gate (Capability)
  *These questions establish whether the omission is attributable to the agent or the system.*

  3.  **The "Knowledge" Question:** At the time of the incident, did the responsible party possess the information needed to know this action was required?
      *   *Yes:* Go to Q4.
      *   *No:* **STOP.** Mark as "System Deficiency" (The lack of documentation/knowledge is the real cause, not the human omission).
  4.  **The "Tooling" Question:** Were the tools, permissions, and automation available to perform the action reliably?
      *   *Yes:* Go to Q5.
      *   *No:* **STOP.** Mark as "System Deficiency."

  #### Phase 3: The Normativity Gate (Expectations)
  *This is where values enter. Be careful here.*

  5.  **The "Standard" Question:** Is this action a documented company policy, a standard industry pattern for this tech stack, or an explicit architectural decision?
      *   *Yes:* **PROCEED TO CLASSIFICATION.**
      *   *No:* **HANDOFF.** This requires Management/Architecture leadership to decide if the expectation should change. (See Handoff Section).

  #### Phase 4: Classification
  *Based on the path taken:*
  *   **Direct Cause:** Passes Q1–Q5. (List this as the primary driver of the incident).
  *   **Contributing Factor:** Passes Q1–Q2, but fails Q3 or Q4. (This means the system forced the omission).
  *   **Learning Opportunity:** Fails Q1 or Q5. (Good idea, but not a "cause" of *this* event).

  ---

  ### Translation Notes: What Survived and Why

  | Philosophical Concept | Engineering Translation | Status |
  | :--- | :--- | :--- |
  | **Counterfactual Dependence** | The "Stop" Question (Q1) | **Kept.** This is the non-negotiable link. Without it, correlation masquerades as causation. |
  | **Normative Duty** | The "Standard" Question (Q5) | **Kept.** Mere ability to act isn't enough; there must be a social or contractual obligation. |
  | **Preemption / Overdetermination** | Handoff Section | **Modified.** In philosophy, if two safeguards exist, neither is the "cause." In engineering, we need to prioritize fixes. |
  | **Metaphysical Negatives** | N/A | **Dropped.** We don't care if "nothingness" exists. We care if "lack of a thing" caused pain. |
  | **Moral Blame** | **Explicitly Excluded.** | **Dropped.** You cannot determine causality based on intent. The procedure identifies *system failure modes*, not villainy. |

  ### Application to Your Three Backlog Cases

  Here is how your engineers should run the script on your specific incidents. Note that some answers will feel uncomfortable. That is intentional—it prevents false comfort.

  #### Case 1: Database Outage (Missing Max-Connection Limit)
  *   **Q1 (Stop)?** Yes. A hard limit would have queued the query, protecting the pool.
  *   **Q2 (Timing)?** Yes. This is a configuration setting applied at startup or runtime.
  *   **Q3 (Knowledge)?** Yes. This is basic DB 101.
  *   **Q4 (Tooling)?** Yes. Config files existed; just empty of this value.
  *   **Q5 (Standard)?** Yes. Defense-in-depth and resource isolation are industry standards.
  *   **VERDICT: Direct Cause.**
  *   **Note:** This labels the *configuration gap* as the cause. It implicitly blames the default configuration process, not necessarily a specific developer's memory. The fix is to make limits mandatory via infrastructure-as-code validation, satisfying the "reasonableness" constraint.

  #### Case 2: Runbook Skip (Skipped Step, But Step Was Misleading)
  *   **Q1 (Stop)?** Yes. Hypothetically, running the step would catch the config.
  *   **Q2 (Timing)?** Yes. Before deploy.
  *   **Q3 (Knowledge)?** **NO.** The step was misleading. The engineer knew better based on experience/social proof (everyone else skipped it recently).
  *   **Q4 (Tooling)?** **NO.** The tooling (runbook) provided false context.
  *   **VERDICT: System Deficiency (Contributing Factor).**
  *   **Why this might annoy people:** You wanted to blame the engineer for skipping the checklist. The procedure tells you **you are wrong**. The engineer acted rationally given the incentives and signals provided.
  *   **Outcome:** The Root Cause is **"Degraded Runbook Integrity."** The fix is updating the runbook, not retraining the engineer. Listing the *skip* as the cause invites defensive engineering behavior later.

  #### Case 3: Double Missing Safeguard (Validation + Alert)
  *   **Q1 (Stop)?** Yes to both. Either would have worked.
  *   **Q2 (Timing)?** Yes to both.
  *   **Q3 (Knowledge)?** Yes. Engineers know checks and alerts are good.
  *   **Q4 (Tooling)?** Yes. Easy to add.
  *   **Q5 (Standard)?** **Handoff Required.**
      *   *The Unpopular Answer:* Here the procedure stops. In law and philosophy, this is **Joint Production**. There is no single cause. If you label "Missing Validation" as the root cause, you ignore that "Missing Alert" also contributed.
      *   **Management Decision Needed:** Which safeguard is cheaper to maintain? Which is more effective?
      *   **Protocol Recommendation:** Split the "Root Cause" line item.
          1.  Lack of Input Validation Layer.
          2.  Lack of Operational Visibility.
      *   **Warning:** Your SLA/Contract may require a single "Cause Code." The procedure forces you to pick one. **Pick the one that is cheapest to fix first.** Do not pretend it is the *only* cause. Add a note: "Resilience gap: Multi-layer verification absent."

  ---

  ### The Honest Limitations of This Procedure

  You asked for honesty about where this becomes a political weapon dressed up as logic. Here are the three failure modes you must manage.

  **1. The "Perfect World" Fallacy**
  The Counterfactual Gate assumes we live in a deterministic world. In reality, if you added a test, a bug might have slipped through anyway. The procedure assumes "If X, Then Safe." Sometimes that assumption is wrong.
  *   **Mitigation:** Require a confidence level >80% on Q1. If the team isn't sure the check would have caught it, drop it.

  **2. The Resource Trade-off (The "Values Handoff")**
  In Case 3, asking "Should we have both?" is actually asking "How much reliability budget does the company have?" Philosophy cannot tell you if adding a validation check is worth 40 hours of dev time vs. the $5k potential penalty.
  *   **The Trap:** Engineers use the postmortem to demand every possible safety net (which is free for them to ask for). Leadership uses it to minimize liability (which is expensive).
  *   **Resolution:** The procedure explicitly forces a handoff for Q5 when no "Standard" exists. Don't let engineers decide the cost-benefit of new standards. They propose; leadership accepts.

  **3. The BLAME SHIELD**
  Even this procedure allows people to hide behind "Process." In Case 2, saying "The Process Failed" is true, but it lets the Process Owner off the hook for maintaining the process.
  *   **The Fix:** The output of the procedure must assign an **Owner**.
      *   If Cause = "Engineer Action," Owner = Engineering Manager.
      *   If Cause = "System Deficiency" (like the misleading runbook), Owner = Process/System Owner.
      *   Never leave the Owner as "Unknown."

  **Final Advice:**
  Your team fights about omissions because they are fighting about **fairness**, not logic. By using this procedure, you decouple "What broke?" from "Who gets penalized?". If the result is a "System Deficiency," enforce a policy that the *process* gets fixed before a *person* gets written up. This is the only way to keep the data accurate.

  If you try to force a binary Root Cause/Non-Cause label where the philosophy supports nuance (like Case 3), you will lose trust in the tool within three months. Allow the report to carry multiple causes if the data demands it, even if the contract prefers one code.
