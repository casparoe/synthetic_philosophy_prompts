      *   *Woman's Point 2:* Strong evidence for the "Garrisonian" vs. "Douglass" split. The Constitution didn't explicitly sanction slavery (didn't use the word "slave"). It relied on euphemisms ("other persons"). The amendment argument is strong (mechanism for abolition).
