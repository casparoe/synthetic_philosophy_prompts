      *   *Nuance:* The Woman says "the document's silences mattered." This refers to the lack of federal power. This is the "Calhoun/Douglass" tension. Calhoun said the silence meant the Fed *had* to protect slavery (because property rights were national). Douglass argued silence meant Fed had no power to touch it. This is key.
