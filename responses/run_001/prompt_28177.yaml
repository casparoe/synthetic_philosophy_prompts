answer: |-
  ### Part I: The Statistical Translation

  **The Critics’ Charge: Just-So Stories as Unconstrained Model Selection**
  From a statistical standpoint, the critics argue that evolutionary psychology (EP) engages in systematic **overfitting**. The adaptive story functions as a generative model with excessive **degrees of freedom**. Because the ancestral environment is an unobserved latent state, the "selection pressure" acts as a massive vector of **free parameters** that can be tuned post-hoc to maximize the likelihood of observing the extant phenotype.

  The charge asserts that for almost any observed behavioral distribution $Y$, one can construct a hypothesis space $H$ containing a configuration of ancestral selective pressures $\theta$ such that $P(Y|\theta, H) \approx 1$. This violates the principle of parsimony not merely via complexity penalties, but through **non-identifiability**: distinct historical processes (drift, exaptation, pleiotropy, direct selection) yield identical distributions in the extant population, yet the model attributes the variance uniquely to $\theta_{\text{selection}}$.

  Critically, this is framed as a failure of **posterior calibration**. Because the hypothesis is constructed *after* inspecting the trait (the data), it lacks **pre-registration**. There is no separation between the training set (the phenomenon requiring explanation) and the test set (independent predictions). Consequently, the model cannot distinguish between signal and noise; it effectively minimizes the **training error** to zero while having infinite expected **generalization error**. This corresponds to the **multiple comparisons problem**: scanning across all possible traits and inventing a selection narrative for whichever one looks significant without correcting for family-wise error rates.

  **The Defenders’ Reply: Well-Regularized Evolutionary Hypotheses**
  Defenders characterize their practice as conducting inference under strict **regularization constraints**. They argue that valid hypotheses must derive from **mechanistic priors** grounded in bio-behavioral constraints and ecological realities, limiting the dimensionality of the parameter space. A "serious" model specifies the functional form of the fitness landscape *a priori*, rather than deriving the landscape from the organism.

  To satisfy statistical scrutiny, defenders claim they specify **out-of-sample tests**. Instead of merely minimizing residuals between the story and the trait, they use the ancestral selection model to predict variance in an independent dataset (e.g., cross-cultural consistency, comparative primatology, or cognitive neuroscience findings not used to build the story). A well-constructed hypothesis should pass **prior predictive checks**; it must rule out plausible alternative phenotypes that the proposed selection pressure would not produce.

  Regarding the **null model**, defenders posit that they do not simply assume "nothing happened." They define a specific neutral baseline (genetic drift, mutation-selection balance without directional bias) and claim their selected model significantly improves **log-likelihood** relative to this baseline, justified by information criteria (e.g., AIC, BIC) that penalize the complexity of the inferred selective history. Evidence that the hypothesis was not reverse-engineered comes from successful prediction of **counterfactual outcomes**—demonstrating that had the selection pressure been absent, the parameter estimates for the behavior would differ significantly.

  ***

  ### Part II: The Residue Report

  **Mapping Successes**
  The analogy holds most firmly regarding **parsimony** and **hypothesis generation**. The critique that one can construct infinitely many adaptive narratives is mathematically isomorphic to constructing infinitely many curves through two points; it is a failure of **under-constraint**. The defense’s insistence on independent validation mirrors the necessity of holding out data for cross-validation. If EP researchers claimed to have found a signal but refused to define how the signal would change if the environmental parameters were altered, the charge of fitting noise would stand.

  **Mapping Failures and Distortions**
  However, several key concepts suffer category errors when translated into statistical parlance.

  **1. The Spandrel vs. The Null Model**
  In statistics, a null model implies the absence of an effect ($Y \sim \epsilon$). A spandrel is not "noise"; it is a **systematic bias** arising from architectural or developmental constraints. Statistically, a spandrel looks like a high-variance fixed effect induced by the geometry of the design space, not a deviation from a mean.
  If you treat a spandrel as the null, you are assuming the phenotype arose from random fluctuation around a baseline. But spandrels arise from deterministic developmental pathways. Distinguishing selection from spandrel is not equivalent to rejecting $H_0$; it requires rejecting a specific geometric constraint model. The statistical vocabulary obscures the fact that both selection and spandrels are "signals"—just different generators of covariance.

  **2. Adaptation vs. Low Fit Error**
  Claiming a trait is an adaptation is not equivalent to finding a model that minimizes $L(y, \hat{y})$. It is a causal claim about a **historical feedback loop**. In a time-series analysis, fitting a trend to data tells you about the trend, not the cause of the trend. Evolution is not stationary; there is no i.i.d. sampling distribution to invoke. The "data" (the extant genome/phenotype) is the output of a single, singular realization of a stochastic process ($N=1$ in terms of universes).
  Therefore, calculating p-values or confidence intervals for the strength of selection implies repeated trials of Earth's evolutionary history, which we cannot perform. The claim "this trait increased fitness" refers to a latent variable (historical fitness differential) that is theoretically unobservable, not just difficult to estimate.

  **3. Identifiability in Singular Systems**
  The statistical translation assumes that with enough **instrumental variables** (independent lines of evidence), we can resolve identifiability issues. But in evolutionary history, all instruments are correlated by the same singular trajectory. If we find neural correlates supporting a hunting hypothesis, those correlates co-evolved with the rest of the genome. There is no clean way to orthogonalize the selection pressure from the genetic drift because both operate on the same singular covariance matrix of life. This is not a case of multicollinearity solvable by ridge regression; it is a fundamental lack of variation in the experimental design of reality.

  **4. Pre-Registration in Reverse Time**
  Pre-registration prevents data dredging. But in EP, the "data" (the trait) already exists before we propose the hypothesis. We can "pre-register" the method of inference, but we cannot pre-register the trait itself without predicting its existence. While defenders argue they predict *variations* in traits, the core trait is often the outcome being modeled. This forces the researcher to engage in **forward filtering** based on the posterior, masquerading as prior specification.

  **5. Loss of Temporal Irreversibility**
  Standard model criticism allows for re-fitting. If the null is rejected, we refine the model. In evolutionary history, the process is irreversible. Once a lineage goes extinct or a trait becomes fixed, the "error term" is gone, absorbed into the mean. We cannot calculate the true **variance inflation factor** of the ancestral environment. The statistical vocabulary treats the missing data as ignorable; evolutionary reconstruction treats missing data as defining.

  ***

  ### Part III: The Ledger

  **The Source of the Distortion**
  The failed translation reveals that **philosophical talk is less precise** regarding the mechanisms of inference, but **statistical vocabulary is structurally inadequate** regarding the ontology of history.

  The statistical language successfully diagnoses the logical fallacy: EP proponents often move from correlation to causation without a control group (the non-existent world where the trait wasn't selected for). However, the statistical framework relies on assumptions (i.i.d. samples, stationarity, repeatability) that are violated by the subject matter.

  **Whose side?**
  The deficit lies primarily with the **statistical framework's inability to handle historical singularities**.
  1.  **Philosophical Imprecision:** When philosophers say "plausible," they mean "causally coherent." The statistical equivalent "consistent with data" is too weak because the space of coherent causes is huge. The dispute turns on whether "plausibility" should be assigned a low **prior probability** in a Bayesian sense (based on biological cost/function trade-offs) before checking the fit. EP often ignores this prior penalty.
  2.  **Statistical Deficiency:** Standard inference provides tools to detect *that* a model is too complex, but no tools to verify the **historical counterfactual**. We can say "Selection Model A fits better than Drift Model B," but we cannot validate the assumption that Selection Model A actually existed. The statistician asks, "Is the model robust?" The philosopher asks, "Did this actually happen?"

  **Conclusion**
  The residue shows that the "Just-So Story" critique is best understood not as a problem of **overfitting** (too many parameters), but as a problem of **causal identification under partial observability of the treatment**. The statistical vocabulary distorts the debate by implying that more data or better pre-registration could solve the identification problem. It cannot, because the "treatment" (ancestral selection pressure) is not manipulatable, even hypothetically.

  The debate genuinely turns on whether we can infer historical causes from static equilibria—a metaphysical question disguised as an epistemological one. The statistics expose the vulnerability of the inference (high variance in estimators due to weak instruments), but the philosophy correctly identifies that there may be no sufficient condition for the existence of the estimator itself. The "adaptedness" is a label applied to a surviving solution, not necessarily a minimized error term.
