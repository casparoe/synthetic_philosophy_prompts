answer: |-
  ### Lesson Plan: Rational Irrationality (40 Minutes)

  **Goal:** Move the group from "This seems weird" to "This reveals a flaw in how we define 'doing the right thing' across time."
  **Whiteboard Strategy:** Draw a timeline. Divide the board vertically into "Desert" (Past) and "Town" (Present). Use red markers for the "Cost" and green for the "Benefit."

  ---

  #### 1. The Prerequisite: Temporal Fragmentation (Minutes 0–5)
  Before introducing the Hitchhiker, you must ensure they understand that rational agents are often **time-indexed competitors**.
  *   **Concept:** Most people think of "Me" as a single, consistent unit. To feel the paradox, they must feel that **"Town-Me"** does not owe a debt to **"Desert-Me."**
  *   **The Setup:** Write on the board: *"Person A decides the Plan. Person B executes the Act."*
  *   **Instruction:** Tell the group: *"Before we talk about the driver, I want you to agree on this: When you are in Town, safe and warm, you have no natural incentive to remember the cold you felt in the Desert."*
  *   **Why:** If they believe "Town-Me" naturally remembers and values "Desert-Me's" life, the paradox dissolves (they'd just pay out of gratitude). The paradox only registers if **Utility is Local** (what benefits me *right now* matters more than what saved me *then*).

  #### 2. The Scaffolding Example: "The Sovereign’s Amnesty" (Minutes 5–15)
  Use a historical/political scenario to isolate the logic before adding the "psychic driver" element.

  *   **The Scenario:**
      > *"A King offers a general amnesty to rebels. He guarantees: 'If you surrender your weapons now, I will spare your lives.' The rebels consider this. Their logic: 'If we surrender, we live. If we fight, we likely die.' They surrender. The moment they drop their weapons, the King kills them anyway."*
      *(Pause for reaction—most will call this immoral. Correct them to focus on the logic.)*
      > *"But wait—the rebels predicted this. They know that if killing rebels was the 'rational' thing for the King to do *after* disarmament, then no one would ever surrender. The King knows this. So, to make the threat credible, the King must make a rule: 'Even though killing you brings me no benefit now, I must do it to maintain my reputation for the future.'"*

  *   **Properties this example has that the Hitchhiker Lacks:**
      1.  **Public vs. Private:** This scenario relies on *external reputation* (the world sees the execution). The Hitchhiker relies on *internal mental states* (only the driver sees the thought).
      2.  **No "Mind Reading":** This example relies on the King acting on a Principle to shape future behavior. It establishes that **commitments require actions that are sub-optimal in the immediate term.**
      3.  **Stakeholder Plurality:** There is a King and Rebels (two parties). The Hitchhiker is one Agent facing a Predictor.
      *   *Purpose:* This teaches that **sometimes doing the 'rational' thing locally (killing rebels/not paying) destroys the system globally.** Once they accept this, switch to the Hitchhiker to ask: *"Can you enforce this on yourself without a reputation?"*

  #### 3. The Hitchhiker & Misconception Management (Minutes 15–30)
  Introduce the Parfit Hitchhiker now. Draw the timeline. Mark "Death" at $0$, "Safe" at $100$. Mark "Pay" at $-20$.
  *   **Math:** Paying in Town: Cost 20, Benefit 0 (Life already gained). Rational choice: Don't Pay.
  *   **Consequence:** Driver reads mind. Sees "Don't Pay." Leaves in Desert. Value: Death.

  Now, manage the three misconceptions based on their natural flow.

  **A. Misconception: "That's just weakness of will." (Akrasia)**
  *   **Timing:** **HEAD OFF IMMEDIATELY** (Minute 15).
  *   **Handling:** As soon as you state the math ("Don't Pay is rational"), someone will say, "Well, maybe you just feel guilty." Stop them.
  *   **Script:** *"I want to set a boundary here. In these problems, we assume you are smart enough to know guilt is irrelevant. This isn't about feeling bad later. It's about the driver knowing you literally intend not to pay, regardless of whether you feel bad about it. It's about the driver being able to predict your cold, calculated future choice."*

  **B. Misconception: "The solution is pre-commitment (Ulysses)."**
  *   **Timing:** **LET IT SURFACE** (Minute 20).
  *   **Handling:** During the discussion, a student will inevitably suggest: *"You just sign a contract!"* or *"Sign a letter saying you'll pay!"*
  *   **Correction:** Acknowledge the logic but deny the efficacy.
  *   **Script:** *"Great point—Ulysses tied himself to the mast. But in this scenario, the driver can read your mind *before* you reach town. Even if you wrote a note, Town-Me could shred the note and say, 'I changed my mind.' If the driver reads the *actual* current intention, physical contracts don't work. Only a mental disposition works."*

  **C. Misconception: "Obviously pay, it's cheap life vs money."**
  *   **Timing:** **AT THE END** (Minute 25).
  *   **Handling:** Wait for the intuition that $20 < Life. Do not engage this until everyone understands the *structure* of the problem.
  *   **Correction:** Alter the stakes to expose the logic, not the morality.
  *   **Script:** *"Let's adjust the variables. Imagine paying costs you your retirement savings. Your life is saved, but you spend the rest of your days in poverty. Does it still become rational? If yes, we aren't solving the paradox, we're just deciding the price of life. The paradox remains: In the exact moment of choice, does saving your future self count as a 'benefit' to Present-Me?"*

  #### 4. Synthesis: The "Disposition" Distinction (Minutes 30–35)
  Bring it back together.
  *   **The Pivot:** Explain that **Rational Irrationality** is the ability to *cultivate a disposition* that is costly to maintain in isolation but profitable in context.
  *   **On Whiteboard:** Draw two boxes.
      1.  **Self-Binding:** Tying your hands (External force overrides choice).
      2.  **Rational Irrationality:** Changing your personality so you *want* to do it (Internal force aligns choice).
  *   **Key Takeaway:** The Hitchhiker works if you can make yourself a person who *genuinely believes* paying is right, even if the evidence suggests otherwise.

  #### 5. Closing Assessment Question (Minutes 35–40)
  To verify they understand the distinction between Rational Irrationality and Self-Binding, pose this specific question. Ask for a show of hands followed by reasoning.

  > **"If I drug you so that you cannot possibly refuse to pay the driver, have you successfully employed Rational Irrationality?"**
  > *(Correct Logic: No. If you drugged yourself, the driver would know you acted irrationally due to coercion/drugs and would not have picked you up in the first place. You must convince the driver that the willingness comes from your own agency, not forced compulsion.)*

  #### 6. Explicit Boundaries (What to Refuse to Cover)
  At any point where the conversation drifts, steer it back by stating you are excluding these topics:
  1.  **Free Will vs. Determinism:** *"We aren't asking if you are 'free' to choose. We are taking the driver's ability to predict as a given premise."*
  2.  **Game Theory Matrices:** *"We won't draw the Nash Equilibrium grids. We are talking about the intuition behind the decision, not the math formula."*
  3.  **Moral Obligation:** *"We aren't arguing if you 'should' pay because it's nice. We are arguing if paying is the logical move to maximize your survival probability."*
