answer: |-
  ### The two positions, stated properly

  Your colleague champions the deductive-nomological model, derived primarily from Carl Hempel. On this view, to truly explain an event is to demonstrate that it was to be expected given certain antecedent conditions and a general law. For instance, explaining why a bridge collapsed requires citing engineering principles that dictate failure under specific loads. Applied to history, this means asserting that actions result from general regularities concerning human behaviour, economic systems, or institutional pressures. Without such a law—whether explicit or tacit—an account remains mere chronicle or description. To call something an ‘explanation’ implies it fits into a pattern that governs multiple cases, thereby offering scientific rigour and potential predictive power.

  Conversely, your position aligns with William Dray and narrative theorists who argue that history requires a different logic. Here, explanation consists in making actions intelligible by reconstructing the context and reasons of the agents involved. We explain Caesar’s crossing of the Rubicon not by finding a universal law of generalship, but by showing how his ambition, the political climate, and his specific options cohered to make that step a necessary choice *for him*. Narrative connects the dots through temporal sequence and logical relation rather than universal necessity. The goal is understanding, not prediction. For you, a story explains because it reveals how events hang together meaningfully, rendering the past comprehensible without reducing human agency to mechanical regularities. Both sides agree history seeks truth; they disagree fundamentally on what constitutes a sufficient account of causality.

  ### Where the debate keeps sticking

  The stalemate arises because each side possesses a robust deflection against the other’s standard criticisms. When asked for the specific law underlying a narrative account, your colleague argues that generalisations are often ‘probabilistic’ or left implicit due to their obviousness; he maintains that every valid explanation relies on some covering rule, even if historians do not state it formally. You rightly counters that many explanations rely on unique constellations of factors that could never recur, meaning no genuine law exists to cover them. Your opponent replies that this merely indicates the complexity of the variables, not the absence of a law.

  On the flip side, when asked why we shouldn’t simply search for laws, you argue that human agency renders strict regularity impossible; motives vary with context. He retorts that without some uniformity in behaviour, history becomes a collection of arbitrary anecdotes lacking causal force. Consequently, the debate cycles endlessly between accusations of being ‘too rigid’ and ‘too vague’. Neither side accepts the other’s criteria for what counts as evidence. Every counterexample (like a singular revolution or a unique diplomatic blunder) is met with a theoretical adjustment that preserves the core premise. You trade examples, not arguments, leaving both convinced the other has misunderstood the very nature of historical knowledge.

  ### Diagnosis

  This is neither purely a verbal misunderstanding nor a straightforward factual dispute; it is a collision of two distinct epistemological projects using the same terminology. Specifically, you are employing the word ‘explanation’ to serve different pragmatic functions. For your colleague, explanation is an epistemic tool for validation: it confirms that an event is not random and places it within a causal web that transcends the particular instance. For you, explanation is a hermeneutic tool for comprehension: it allows the reader or student to inhabit the past and see the internal logic of decisions.

  The deadlock persists because you are asking different questions under the single label. You are asking, “How do we make this past moment understandable?” while he asks, “How do we validate this claim as scientifically robust?” These goals often conflict. A narrative explanation prioritises uniqueness and contingency, whereas the covering-law model prioritises generality and necessity. Furthermore, there is a divergence in what counts as data. You accept psychological reconstruction and textual nuance as valid explanatory evidence. He views these as subjective unless they instantiate a behavioural constant.

  Crucially, the dispute rests on deeper, often unspoken intuitions about agency. Your colleague harbours a deterministic streak; he believes the future is constrained by past structures enough that regularities exist. You hold a compatibilist or volitional view; you believe agents navigate structures in ways that cannot be fully codified. Because neither of you is willing to concede that your starting intuition about human freedom versus structural constraint might be incomplete, the argument cannot move forward. It is a category mistake disguised as methodology; you are arguing about the validity of a map, when one of you is drawing topography and the other is drawing traffic flow.

  ### What would count as progress

  Progress here does not require converting one another to a single theory, but rather negotiating a functional division of labour within your module. You should propose a pragmatic synthesis: acknowledge that both modes operate in historiography, serving different pedagogical purposes. Tell your colleague that for broad macro-historical trends (economic depressions, demographic shifts), his regularity-based approach offers better structural insight. For micro-history and individual decision-making (the fall of regimes, diplomatic crises), your narrative approach provides superior intelligibility.

  To move things practically, suggest a joint seminar exercise where students analyse a single complex event, such as the outbreak of World War I. Ask them to produce two paragraphs: one outlining the systemic, law-like pressures leading to war (covering-law style) and one reconstructing the specific, contingent miscalculations of key leaders (narrative style). Success should be measured not by which theory wins, but by whether students grasp the utility of both lenses. If you frame the disagreement as a toolkit issue rather than a truth claim, the tension becomes productive rather than antagonistic. Tell him next time that you value his rigor in preventing history from dissolving into fiction, but insist on the space for narratives to explain what laws cannot.

  ### Bottom line

  You are not fighting about facts, but about the purpose of historical inquiry. His model seeks causal certainty through generalisation; yours seeks meaningful coherence through context. Neither is entirely wrong, but insisting one excludes the other guarantees stalemate. By treating these as complementary methods suitable for different historical questions, you can transform a months-long row into a nuanced, dual-perspective curriculum.
