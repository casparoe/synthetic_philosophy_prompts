answer: |-
  **JOINT STATEMENT ON EVOLUTIONARY DEBUNKING AND MORAL REALISM**

  **Preamble**
  We, the undersigned, representing opposing camps within contemporary metaethics—one advocating Evolutionary Debunking Arguments (EDA) against moral realism, the other defending Robust Moral Realism—agree to submit the following statement. This document reflects the result of an adversarial collaboration intended to clarify the stakes of the debate, isolate genuine points of contention, and identify empirical and conceptual cruxes capable of shifting the balance of the discussion. We affirm that this agreement is provisional and subject to revision in light of new arguments or data, though we pledge not to retreat to trivial redefinitions once a claim is recorded here.

  ***

  ### Part I: Substantive Points of Agreement

  Both parties agree that the dialectical burden requires moving beyond general skepticism to specific mechanisms of undercutting defeat. We concur on the following substantive propositions regarding the architecture of the debate:

  1.  **Success Conditions for Debunking:** For an EDA to succeed, it is insufficient merely to establish that evolution influenced moral beliefs. The proponent must demonstrate that the causal history of our moral faculties renders a reliable connection between our moral judgments and the proposed moral facts unlikely, such that the evolutionary explanation constitutes an undermining defeater rather than a mere background condition.
  2.  **Burden for Realist Replies:** A robust realist defense cannot rest solely on the existence of moral facts. To resist the debunking pressure, the realist must articulate a plausible mechanism (such as tracking, constitutive guidance, or common-cause correlation) that preserves the non-accidental nature of the alignment between our evolved moral psychology and the mind-independent moral landscape, or provide a sufficient deflationary account of why accuracy is not required for justification.
  3.  **Variable Susceptibility Across Domains:** Both parties acknowledge that the strength of the evolutionary debunking pressure varies across the moral repertoire. There is consensus that evolutionary influences are strongest and most direct regarding core concerns of harm, kinship protection, and cooperative reciprocity, whereas explanations relying solely on adaptive value are weaker regarding abstract duties to strangers, ritualistic purity norms, or idealized justice structures distant from reproductive interests.
  4.  **Ontological Commitment vs. Justification:** Both parties distinguish between the *ontology* of moral properties and the *epistemology* of moral belief. Even if the debunking argument succeeds in showing we lack justification for moral beliefs, both parties agree this does not strictly entail that moral facts do not exist (the "God’s Eye View" objection), only that our access to them is compromised.
  5.  **Verbal Disputes Resolved:** We agree that the standing dispute is not primarily verbal regarding the definition of "moral belief" versus "moral judgment." While the debuner treats "moral belief" as a psychological state subject to causal explanation, and the realist treats "moral judgment" as a truth-apt claim, we recognize that the debate hinges on whether the former justifies the latter. We further agree that "explanation" in this context refers to etiological/causal accounts, not functionalist justifications, and that disagreement lies in whether etiology exhausts justification.

  ***

  ### Part II: Points of Disagreement

  The following table outlines the central theoretical divergences. The questions are framed neutrally; the responses are drafted in the specific conceptual vocabulary that each side would endorse to maintain internal consistency.

  | Neutral Question | Proponent of Evolutionary Debunking (Answer) | Defender of Robust Realism (Answer) |
  | :--- | :--- | :--- |
  | **Counterfactual Robustness:** Would human moral beliefs remain largely invariant even if the underlying moral facts (as posited by realism) had been significantly different? | **Yes.** Selection pressures favor beliefs that promote survival and social cohesion, irrespective of whether those beliefs align with mind-independent truths. Consequently, if moral facts favored non-survival strategies, our evolved psychology would likely still produce identical beliefs. This independence undermines the claim that our beliefs track truth. | **No.** Our moral judgments track objective features of action contexts that are tied to flourishing and agency. Given the fixed nature of rational agency and sentient experience, the set of true moral facts could not be significantly different without making the practice of morality unintelligible. The correlation is stable across relevant possible worlds. |
  | **Scope of Third-Factor Explanations:** Can a common causal factor (e.g., well-being, objective goods) secure a non-accidental correlation for the entire range of moral judgments? | **Partial Success Only.** A third factor (e.g., biological survival) may explain the convergence of basic prohibitions against unnecessary harm (thin judgments). However, it fails to explain thicker judgments involving symbolic authority, impartial justice toward distant strangers, or complex obligations, which vary culturally without corresponding differences in the supposed third factor. | **Full Convergence Possible.** The third factor is objective value grounded in the conditions of sentient life (flourishing). Because all complex moral concepts ultimately derive their content from the requirements of agency and welfare, the same explanatory factor secures the correlation for thin and thick judgments alike, rendering the divergence cultural noise rather than fundamental discrepancy. |
  | **Universality of Epistemic Principles:** If an epistemic principle discredits moral beliefs due to their evolutionary origins, does it inevitably discredit mathematical, perceptual, or inductive knowledge? | **No Distinction in Kind, Difference in Mechanism.** The principle applies universally: any faculty disconnected from truth-tracking via its primary etiology is suspect. However, perception, math, and induction involve causal interactions with their objects or structural necessities that prevent the "debunking loop," unlike morality where the "object" is not causally efficacious in the physical sense. | **Yes, Overgeneration.** Any principle that severs the link between justified belief and the etiology of the belief-forming process generates a global skepticism. If we must reject morality for its evolutionary pedigree, we must similarly reject mathematics and logic, as these are likewise products of cognitive machinery selected for utility rather than necessary truth. Since the latter is untenable, the principle must be rejected. |

  ***

  ### Part III: Identified Cruxes

  We identify the following sub-questions as decisive cruxes. A settled answer on any one of these would materially alter the cost-benefit ratio of the respective positions.

  **Crux 1: The Scope Limit of Third-Factor Explanation**
  *   **(a) Relevance:** If the realist cannot extend the third-factor explanation beyond basic harm/kinship cases without invoking auxiliary assumptions about culture, the debunker gains ground by characterizing advanced ethics as social constructs incompatible with realism. If the realist succeeds, the debunking argument is limited to primitive intuitions.
  *   **(b) Fair Test Case:** Cross-cultural comparative analysis of norms regarding "Obligation to Strangers" (e.g., charitable duty to distant populations). We assess whether variations in this specific norm correlate significantly with environmental variables influencing survival (validating the debunker) or with consistent structural requirements of cooperation/flourishing across diverse environments (validating the realist).
  *   **(c) Predictions:**
      *   *Debunker:* Predicts high variance in "stranger obligation" correlates with ecological constraints and resource availability, indicating that these norms are adaptations for specific environments rather than tracking universal truths.
      *   *Realist:* Predicts that while surface rules vary, the underlying recognition of stranger-as-end-and-means remains invariant across viable societies, suggesting a shared grasp of the normative fact regardless of ecological variation.

  **Crux 2: The Self-Undermining of Debunker Epistemology**
  *   **(a) Relevance:** This tests whether the debunking argument relies on epistemic norms that are themselves immune to evolutionary critique. If the skeptic relies on norms of evidence and inference that are evolved traits, the strategy collapses into self-defeat.
  *   **(b) Fair Test Case:** The "Scientific Reasoning Simulation." Imagine an agent whose reasoning capacities were shaped entirely by evolutionary pressure to prioritize predictive success over logical necessity (ignoring actual validity). Determine if this agent's reliance on standard inferential rules (e.g., modus ponens) is justified.
  *   **(c) Predictions:**
      *   *Debunker:* Predicts the simulation confirms that logical rules are pragmatic instruments. Since logic tracks the structure of the world (natural kinds) independently of normativity, the reliability of science remains intact, preserving the debunker's premises.
      *   *Realist:* Predicts the simulation reveals that if evolution dictates reasoning patterns, the justification for trusting those patterns (including the debunking argument itself) rests on a circular assumption that evolutionary outputs are truth-tracking. This validates the need for mind-independent reasons (realism) to ground epistemic norms.

  ***

  **Statement of Commitment**
  By signing below, we commit to treating these sections as the definitive map of our disagreement. Future work will proceed by attempting to resolve the listed cruxes rather than reformulating the agreed-upon definitions in Part I.

  _________________________		Date: _______________
  (Proponent of Evolutionary Debunking)

  _________________________		Date: _______________
  (Defender of Robust Moral Realism)
