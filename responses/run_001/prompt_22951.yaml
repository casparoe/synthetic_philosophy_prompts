      *   **Scenario:** One experimental antidote (single dose) given to Patient A (now stable). Chemical spill nearby, 15 people exposed, will die within a day without it.
      *   **The Dilemma:** Pull the dose from Patient A to save the 15 (killing Patient A in the process).
      *   **Group Consensus:** Voted to sacrifice Patient A for the 15 (utilitarian calculation: 15 > 1).
      *   **User's Feeling:** Gut feeling says this "isn't allowed" despite the math. Asking if their intuition is right or just sentimental.
      *   **Goal:** Help the user understand the ethical frameworks at play and validate/explain their intuition.

  2.  **Identify the Core Ethical Conflict:**
