answer: |-
  I understand why that part of the theory feels slippery, and you are right to be skeptical because the mathematical elegance often hides the practical baggage involved in choosing a reference machine. When we say the choice of universal Turing machine does not matter, we are relying on the Invariance Theorem, which states that for any two universal machines U and V, the Kolmogorov complexity of any string x measured on U is bounded by the complexity measured on V plus some constant c. This means that while different machines might disagree on how complex a hypothesis is, they will not disagree by more than a fixed number of bits, regardless of the hypothesis. However, this constant c is not a small universal number like five or ten. It represents the size of the interpreter program required to translate the code written for machine V so that machine U can execute it. In the context of Solomonoff induction, this translates to a constant factor in the prior probability, meaning the ratio of probabilities assigned to different hypotheses changes by at most a factor of two to the power of c.

  The problem arises when you realize that c is entirely dependent on your specific choice of the reference machine relative to the true structure of the data. You could theoretically construct a universal machine where a specific, favorite hypothesis has a program of length zero or just a few bits, effectively hardcoding your bias into the foundation of the system. If you do this, the constant c required to describe any other machine in terms of your biased machine becomes very large, because those other machines would need long translators to account for the work your machine is doing for free. Consequently, that single hypothesis gets an exponentially higher prior probability than its competitors. While the theory says that as you accumulate infinite data the influence of this initial prior bias washes out, that asymptotic guarantee provides absolutely no help when you are working with a finite dataset.

  To put the magnitude of the issue into perspective, consider that if your constant bias amounts to just one hundred bits of extra complexity against your preferred theory, you would need roughly 2 to the power of 100 observations to overwhelm that prior bias and let the evidence dominate the conclusion. That is far more data than exists in the observable universe. Even a relatively small constant, perhaps corresponding to the length of a specialized library or compiler, can create a barrier that takes centuries of observation to overcome. Therefore, the claim that the differences disappear in the limit is technically true but pragmatically useless for any agent operating within the constraints of a finite lifespan and limited computational resources. The speed of convergence is exponential in the negative of that constant, making the early stages of learning completely dictated by the arbitrary choice of the Turing machine.

  So, what survives of the idea that Solomonoff induction justifies Occam's razor once we take the machine choice seriously? The answer is that it justifies a principle of relative simplicity rather than absolute simplicity. Solomonoff induction shows that any consistent agent who updates on data will eventually agree with other agents, provided they share a common reference measure. But it does not tell us which reference measure is correct, nor does it remove the subjectivity from the starting point. The preference for shorter programs remains valid only within the context of the specific coding language you chose to represent the world. This shifts the philosophical burden. Instead of finding a magic mathematical law that enforces simplicity onto reality, we find that Occam's razor is a statement about how we choose to encode our descriptions of reality. It validates the practice of preferring simpler models only after we have already decided on a language, meaning the justification is circular in the sense that the simplicity we find is largely a reflection of the assumptions baked into our representation scheme. Ultimately, Solomonoff induction serves as a normative framework for reasoning consistently given a prior, but it does not provide an objective grounding for why we should pick one specific language over another, leaving the core question of where the prior comes from unresolved.
