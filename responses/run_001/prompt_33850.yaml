  **3. The "Informational Fidelity" Clause (Clause 5)**
  *Statement:* Anomalous signals lacking temporal repetition, modulation, or pattern complexity are assigned negligible evidentiary weight because the base rate of natural astrophysical transients exceeds the likelihood of a single, unidentifiable transmission, rendering the Likelihood Ratio close to unity.
  *   **Motivation:** This governs **(5) The Non-Repeating Signal**. Unlike a systematic survey (which proves absence over a domain), a single hit with no replicating signature is indistinguishable from noise until confirmed.

