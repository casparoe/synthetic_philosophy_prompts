answer: |-
  **MEMORANDUM TO THE COMMISSION ON LAW REFORM**
  **RE: PROPOSED AMENDMENT TO THE WRONGFUL DEATH STATUTE (LOST-YEARS DAMAGES)**
  **DATE:** October 26, 2023

  **I. RECOMMENDATION**

  I recommend that the Commission adopt the proposed provision to authorize damages for the decedent’s own lost years. While the modification presents significant theoretical challenges, our mandate is not merely to codify metaphysical consensus, but to structure civil liability in a manner that reflects contemporary values of human dignity and deterrent accountability. The current limitation to survivorship losses measures a life only by its utility to the living; the proposed amendment recognizes that a wrongful death inflicts a unique wrong upon the victim, distinct from the grief of the bereaved.

  **II. ENGAGING THE EPICURIAN OBJECTION**

  The deepest objection to this expansion is the Epicurean argument: death cannot be a misfortune for the person who dies, for there is no subject present to suffer the loss. If true, compensating "lost years" would essentially be a gratuitous transfer of wealth disguised as redress, paid to the estate for a loss that never occurred because there was no one left to experience it.

  Colleagues who find this reasoning decisive are correct to identify its logical force. In a strictly metaphysical sense, post-mortem harm is an oxymoron. To ignore this is to pretend the law exists in a vacuum detached from reality. If we simply declared the argument irrelevant as "ancient sophistry," we would fail to earn the confidence of those who rightly believe that legal rules should rest on coherent principles.

  However, we must distinguish between *metaphysical existence* and *legal standing*. The law routinely protects interests that outlast the subjective experience of the owner. Consider the theft of a legacy made by the testator moments before their death, where the beneficiary never knew the inheritance was stolen, yet the estate still has a claim. Or consider the protection of reputation: a defamation committed after a person’s death may cause no direct psychic injury to the deceased, but we allow actions to vindicate the social value of their name.

  In each case, we accept that a person can possess an interest—dignity, property, opportunity—that survives their capacity to feel. The harm in wrongful death is not located in the *moment* of extinction, but in the *thwarting* of the trajectory the victim possessed immediately prior to death. When a tortfeasor kills, they do not merely destroy a corpse; they violate the victim's ante-mortem interest in continuing to live. The "subject" of the harm is the living person whose future was intercepted. To deny a remedy for that interception because the person is no longer available to feel the regret is to prioritize the absence of suffering over the presence of injustice.

  **III. ADDRESSING THE STRONGEST PRACTICAL CONCERN**

  If the philosophical hurdle can be cleared by framing the harm as the destruction of an antecedent interest rather than the infliction of post-death pain, we must confront the second-strongest reason for rejecting the proposal: the problem of valuation and administrability. Critics argue that quantifying "experiences and projects" invites speculation, inconsistent awards, and potentially massive verdicts that could overwhelm defendants' insurance markets. There is also the concern of double recovery, where survivors receive compensation for loss of companionship while the estate receives compensation for the same underlying event.

  This is a legitimate administrative worry, not a philosophical blockage. These are technical problems solvable through statutory construction, not reasons to abandon the principle. We can define "lost years" not as an open-ended inquiry into the decedent's fantasies, but through established actuarial and evidentiary frameworks used in personal injury litigation (e.g., expected remaining working life, adjusted for probability of survival). Furthermore, we can mitigate double recovery by requiring that survivorship damages and estate damages be adjudicated separately or capped relative to one another.

  To reject the provision solely because measurement is difficult is to surrender a normative goal for the sake of convenience. The difficulty lies in the nature of the loss—a life is inherently difficult to price—not in the propriety of the claim.

  **IV. POLICY AND PURPOSE**

  Finally, we must ask what our Wrongful Death Act is designed to accomplish. Is it purely a mechanism for shifting economic loss from survivors to tortfeasors? Or is it a statement of society's judgment on the taking of a life?

  The current statute treats the killing as a cost-of-business accident measured by the victims' dependence. The proposed amendment treats it as a singular violation of individual autonomy. Adopting the lost-years provision aligns our statute with the broader evolution of tort law, which increasingly values the "loss of enjoyment of life" for living plaintiffs. Denying the same recognition upon death creates a perverse incentive: it places a higher price tag on the life of the financially dependent (who generate high survivor damages) than on the life of the independent elder or childless adult.

  We cannot resolve the metaphysical debate over whether death is a harm to the dead. But as legislators, we can choose whether to recognize the violation of the potential that was extinguished.

  **V. CONCLUSION**

  I urge the Commission to recommend adoption. The Epicurean objection teaches us humility regarding the limits of language and existence, but it should not paralyze the law's capacity to affirm the value of the victim. By adopting the lost-years provision, we do not claim the dead have feelings; we claim the living have an obligation to respect the lives that were taken.
