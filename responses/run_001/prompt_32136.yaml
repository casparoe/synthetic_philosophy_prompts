          *   *Tone Check:* Ensure it doesn't sound like I'm lecturing. It needs to look like something *they* sign.
          *   *Formatting:* Use bolding, lists, and tables for readability.

  4.  **Final Polish:**
      *   Check that all four prompt requirements are met explicitly.
      *   Ensure the distinction between "settled" (nociception) and "contested" (sentience) is sharp.
