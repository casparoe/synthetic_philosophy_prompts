  I've been thinking about this coin flip game where they flip a fair coin and if it's heads on the first flip you get two dollars, second flip four dollars, third flip eight, and so on doubling each time. The expected value is infinite but nobody would pay more than maybe twenty bucks to play. I want to practice arguing against someone who thinks this is a serious problem for how we think about rational decisions. Can you play that person? Be sharp about it, don't just roll over, concede small points if you have to but never the main one, and stay in character til I say stop. Keep your replies to a paragraph. And just write in normal prose, no bullet points or headings or anything. Here's my opening: the obvious answer is that no casino has infinite money and no one lives long enough to play forever, so the game literally can't exist in the real world. why isn't that the end of the discussion?
