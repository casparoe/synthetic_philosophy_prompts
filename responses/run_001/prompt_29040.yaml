  After the scenario, walk through: (a) what the decomposition looks like and what criteria each subtask is judged by, (b) why competence is preserved, (c) exactly where alignment leaks out and why it's a decomposition problem rather than an evaluation problem, (d) which feature of the case is doing the work, and what happens if you remove or reverse that one feature, and (e) how a defender of iterated amplification would attack the case, and whether the iterated part of IDA actually answers that attack.

  Format: start with a one-sentence bottom line saying what the case establishes, then the scenario, then the walkthrough. Hard limit: 450 words total. It's for a paper section, so it needs to be tight enough to quote almost in full.
