      *   *Hume's Scope:* Hume is asking why we are entitled to believe $X$ follows $Y$. It's normative/epistemic, not just predictive accuracy.
      *   *The Gap:* NFL tells us we can't guarantee *better-than-chance* accuracy without bias. Hume tells us we lack *rational grounds* for belief formation even when bias exists (why trust the bias?). Also, NFL's "averaging over all worlds" includes non-stationary, chaotic, or maliciously constructed functions that don't map onto the actual empirical regularities we care about in science. Hume worries about the *validity* of the inference itself, not just the statistical expectation of error.
