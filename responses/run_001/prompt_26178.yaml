answer: |-
  Dear friend,

  It is completely understandable why you feel pulled toward the idea that the wavefunction is real. The mathematical machinery of quantum mechanics treats it as an object that evolves deterministically until interaction, and the Pusey-Barrett-Rudolph theorem does indeed place significant strain on models that treat it merely as information, provided you accept their assumption of preparation independence. However, worrying that you have talked yourself into something unfalsifiable is a healthy instinct because the history of foundations shows us that ontological commitments are often shielded by theoretical gymnastics. To assess the risk, we first have to acknowledge that for almost every interpretation of quantum mechanics, the prediction for any lab experiment is identical. This means that direct empirical falsification of the wavefunction itself is currently impossible; instead, we face a landscape where certain theoretical discoveries would be more damaging than others.

  The most fatal development for psi-ontic views would be the discovery of a regime where quantum mechanics clearly emerges from an underlying classical statistical theory in a way that preserves local realism. If future experiments were to demonstrate a breakdown of the Born rule that correlated with hidden variables in a statistically distinguishable way, or if we found definitive evidence that information in the universe is fundamentally discrete rather than continuous as the wavefunction suggests, the case for the wavefunction as a fundamental physical field would crumble. Similarly, if a rigorous proof emerged showing that a real wavefunction in high-dimensional configuration space is logically inconsistent with the observed structure of spacetime and relativistic causality, without allowing for non-local influences, that would be a killer. Since many ontic views already struggle with non-locality, a proof that demanded absolute locality while preserving the full predictive success of the standard formalism would leave them with nowhere to hide. Essentially, anything that proves the wavefunction is emergent rather than fundamental—much like how sound waves are emergent from molecules rather than fundamental fields—would render psi-ontology obsolete in its current form.

  There are also findings that would not kill the view but would be deeply awkward, requiring you to pay a high tax for your realism. The most prominent of these is the persistent failure to reconcile the high dimensionality of the wavefunction with our three-dimensional experience without invoking obscure mapping tricks. If we discovered that mass and energy are not distributed in the way the squared amplitude suggests, or if we found no physical mechanism to ground the collapse in dynamical laws across different reference frames, you would still believe the wavefunction is real, but you would have to accept that it exists in a space that bears little resemblance to the physical world we inhabit. Another awkward scenario involves the measurement problem remaining entirely unsolved even after decades of effort. While you could retreat into Everettian many-worlds, the inability to derive the probabilities of the Born rule from pure unitary dynamics without adding extra assumptions makes the ontology feel incomplete. These issues do not disprove the view, but they constantly chip away at its aesthetic appeal and theoretical naturalness, making it harder to justify compared to simpler alternatives.

  You also asked about the escape hatches that psi-ontic advocates have built to preserve their position. There are several robust ones that make the view surprisingly hard to test. One major loophole is superdeterminism, which argues that the choices of measurement settings are correlated with the hidden variables, thereby evading Bell's constraints without needing faster-than-light signals. Another is retrocausality, where the future choice of measurement affects the past state of the particle, allowing for a local realist account without conspiratorial initial conditions. Furthermore, many ontic models modify the Schrödinger equation slightly, such as Ghirardi-Rimini-Weber collapse models, which adds small nonlinearities. By keeping these modifications below current experimental thresholds, the view remains consistent with all existing data. Additionally, proponents can argue that PBR only rules out a specific class of epistemic models based on preparation independence. If one accepts that distinct quantum states can share overlapping distributions of reality, or that the preparation devices influence the system in subtle ways not accounted for, the theorem’s force dissipates. These hitches effectively immunize the view against immediate disproof, shifting the burden onto philosophical preference rather than empirical fact.

  Regarding your specific question about whether a successful psi-epistemic view like QBism would count against wavefunction realism, the technical answer is no, but the practical answer leans heavily toward yes. In philosophy of science, two theories that make identical predictions are empirically equivalent, meaning neither is strictly falsified by the success of the other. If QBism handles all predictions perfectly by treating the wavefunction as a representation of an agent’s beliefs, it does not logically disprove that there is a physical wave out there. However, it would demonstrate that positing a real wavefunction is not mandatory for the theory to work. This invokes Ockham’s razor. If you can explain the phenomena without committing to a massive high-dimensional reality, continuing to insist on that reality becomes a metaphysical add-on rather than a scientific necessity. You would move from holding a view that offers explanatory depth to holding a view that is arguably more cumbersome than the data requires. The risk, then, is not that new data will contradict your ontology, but that the community will collectively decide that the ontology is superfluous, stripping it of its scientific traction and reducing it to a personal belief rather than a feature of the world.

  Ultimately, the danger for you is not sudden empirical collapse but theoretical stagnation. As long as the standard quantum formalism holds up, the ontic view survives on its ability to offer a coherent picture of how the math relates to the world, even if that picture involves weird non-locality or branching universes. If a rival program offers the same predictive power with fewer existential commitments, the ontic view risks becoming a historical footnote or a specialized metaphysical stance rather than the leading paradigm for understanding nature. Your commitment remains viable as long as the epistemic views cannot explain the origin of the Hilbert space structure itself without smuggling in physical assumptions, but you should be prepared for the possibility that the wavefunction is better understood as a map than the territory, and that the territory is something far more alien than a field in configuration space.

  Best regards,

  Your Correspondent
