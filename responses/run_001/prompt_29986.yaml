  Dear Colleague,

  It is genuinely encouraging to read your observations from the data-governance committee, because what you describe is not merely a feeling but the precise problem that has challenged privacy theorists for decades. You are correct that the standard frameworks often fail to capture why sharing the same medical data with a neighbor feels fundamentally different from sharing it with a billing department, even if the technical act of disclosure is identical. There is indeed an established name for this perspective, and it comes from the political philosopher Helen Nissenbaum, who calls it contextual integrity. This framework shifts the focus away from the individual’s possession of data or their right to withhold it, and instead locates privacy within the structure of social relationships and institutional purposes. Under this view, privacy is not about seclusion or control, but about the appropriate flow of personal information according to the norms that govern specific social contexts.

  To understand how this differs from the more familiar notion of privacy as control, one must examine what each prioritizes. The control model, often associated with privacy scholars like Alan Westin, treats information as a form of property that belongs to the individual. In this paradigm, the primary moral question is whether the person owning the data authorized the transfer. If a patient consents to a wearable device sharing heart rate data with an insurer, the control theorist sees no inherent violation because the individual exercised their agency. However, contextual integrity argues that consent alone is insufficient to legitimize a flow if that flow violates the teleological norms of the context in which the information originated. Your example of the wearable device illustrates this perfectly. When the device collects data for the purpose of patient care, the context is clinical support, and the norms dictate that data flows to clinicians or algorithms designed for health optimization. When that same data is sold to an insurer, the context shifts to commercial underwriting, a domain governed by entirely different norms. Even if the patient clicked agree, the transfer breaches the expected integrity of the healthcare relationship, turning a tool meant for care into a tool for risk assessment, which undermines the very purpose of the interaction.

  This distinction is crucial because it explains why certain violations feel like betrayals rather than mere surprises. A violation of contextual integrity is not wrong simply because it broke a rule or startled the subject; it is wrong because it disrupts the social fabric that makes the institution function. Healthcare relies on trust, and that trust depends on the assurance that sensitive disclosures remain bound to the therapeutic relationship. If medical information leaks into markets or legal spheres where it was not intended to circulate, it corrodes the willingness of people to seek care or speak honestly with providers. Therefore, the harm is structural. It damages the reliability of social institutions, creating a chilling effect that goes beyond the discomfort of exposure. This is why the pharmacist mentioning a prescription to a neighbor is a violation while reviewing it for dispensing is not. Both involve access to the same fact, but the first transgresses the boundary between professional duty and casual acquaintance, while the second fulfills the mandate of the professional role.

  Of course, adopting this view introduces complexities regarding where its edges lie and who gets to define these norms. Because contexts and their associated norms evolve over time and vary between communities, contextual integrity can feel unstable. What was considered private ten years ago may be public today, and norms in one cultural community may not hold in another. This dynamism creates tension for a governance committee, as rules cannot be static. The theory requires constant vigilance to determine whether a new technology or policy aligns with existing values or represents a shift that needs ethical scrutiny. Furthermore, there is the difficult question of power. Dominant actors often set the norms to serve their interests, such as technology platforms defining broad data usage policies that users ostensibly accept but do not truly understand. In these cases, appealing to context can sometimes mask exploitation if the context itself is skewed by unequal bargaining power. A patient signing a waiver in an emergency room is operating in a context of high vulnerability, raising questions about whether their consent genuinely reflects the norms of the medical relationship or a coerced submission to administrative demands.

  Despite these challenges, contextual integrity offers a robust vocabulary for your committee work because it forces stakeholders to articulate the purpose of data collection alongside the mechanics of its security. It moves the conversation from simple compliance with consent forms to a deeper inquiry into the ethics of data utility. It allows you to argue against data practices that are technically secure and legally permitted but socially inappropriate. By framing privacy as the preservation of contextual norms, you can defend the integrity of the hospital relationship against external pressures to monetize or repurpose health data, regardless of how many signatures are obtained. Ultimately, this approach recognizes that privacy is a condition of human freedom within society, not just a barrier around the self. It validates your intuition that something essential is missing from the standard metrics of secrecy and consent, providing a philosophical foundation for protecting the relational boundaries that keep our communal life intact. I hope this elaboration helps clarify the theoretical landscape as you navigate the complexities of your governance role.

  Sincerely,

  A Fellow Traveler in Ethics

