  I've been thinking about the idea that hypocrites lack the standing to blame others—even when their criticism is entirely accurate. If this is right, it seems to have a troubling implication: many true moral criticisms may go unspoken because the people best positioned to notice and articulate a problem are often implicated in it themselves. What are the most important implications of this tension for how we should think about moral criticism in everyday contexts like friendships, school, or public debate?
