      *   *Fairness:* Yes, it's fair, provided the user acknowledges the "finite number of cases" constraint (the "Gödelian" objection). Dispositionalists have finite brains; we can't have a disposition to answer every possible query (some exceed capacity). Idealization attempts to fix this, which opens the door to the user's objection.

  7.  **Address Question 5: Strongest Dispositionalist Reply.**
