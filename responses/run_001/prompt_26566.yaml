      The strongest defeater is the common-cause story. Physicalism implies that phenomenal states supervene on physical states ($P \to Q$). If your judgment ($J$) is also determined by $P$ ($P \to J$), then $Q$ and $J$ covary lawfully without interacting. This is not a "miracle" but a consequence of functional architecture. For example, a clock’s hands move because of gears; if I say "the hands moved," my speech was caused by the gears, not the visual experience of reading them. The correlation is explained by the shared subvenient base. To reject this, you must argue that physical sufficiency cannot ground epistemic reliability—a move that requires independent support. This should force substantial revision of your view unless you can prove supervenience fails to explain truth-tracking.

