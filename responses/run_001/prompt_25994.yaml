answer: |-
  Subject: Re: Doing, allowing, killing, letting die

  Hey, thanks for reaching out with this. You are definitely right to feel like you are going in circles here because what you are running up against is one of the most persistent knots in moral philosophy. It is a huge mistake to assume the doing/allowing distinction and the killing/letting die distinction are exactly the same thing, even though they map onto each other very neatly in simple scenarios. The reason they start to tangle is that they are actually tracking two different axes of evaluation. The doing and allowing distinction is fundamentally about human agency and the difference between initiating a causal sequence versus merely permitting one to continue. The killing and letting die distinction, on the other hand, is about the specific outcome and the relationship between the agent's behavior and the death of the victim.

  When you look at the medical example you mentioned regarding withdrawing life support, that is precisely where the seams show up. A lot of people get confused here because physically, turning off a ventilator is an action, so it fits the definition of doing. However, ethically and medically, many argue that the cause of death is the underlying disease, not the machine being turned off, so the doctor is merely removing an artificial barrier, which aligns with allowing. This means you can technically find yourself in a situation where you are doing something physically, yet the moral classification falls under letting die. Conversely, imagine a doctor who actively administers poison. That is clearly both a doing and a killing. But consider a scenario where a doctor decides not to start CPR on a dying patient because they are following a living will. That is physically an omission, so it is allowing, but depending on your theory, some might argue that by deciding against intervention they are effectively killing the patient's chance to live, which blurs the line again. So, strictly speaking, they are not coextensive.

  The divergence gets even sharper when you bring in the question of duty, which touches on your point about the famine relief versus the drowning child. Here is where the distinction often fails to carry moral weight on its own. Most ethical theories suggest that the mere fact that someone died because you allowed it rather than killed them doesn't automatically make it less bad. What matters is whether you had a specific obligation to act. If you walk past a drowning child, you are allowing them to die, and it is widely considered morally equivalent to pushing them in, because you have a general duty to rescue when the cost to you is low. But when it comes to famine relief, the picture changes because most people do not agree on a positive duty to give resources to distant strangers in the same way we agree on a negative duty not to kill. In that case, you might not be morally culpable for allowing people to starve, whereas you would absolutely be culpable for killing them. This suggests that the doing/allowing distinction is not doing the heavy lifting normatively; rather, it is the background duties and rights that determine the severity of the outcome.

  To answer your final question about which distinction does the normative work, most contemporary ethicists lean toward the idea that killing/letting die is just a specific domain of the doing/allowing distinction applied to death, but that distinction itself is morally neutral without context. It is rarely the action type itself that makes the difference between right and wrong, but rather the violation of rights or duties associated with that action. So while death adds a layer of gravity because it is irreversible and final, it does not create a unique logical framework separate from general agency. The confusion you are feeling comes from trying to treat the categories as intrinsic moral indicators when they are really just descriptive labels. Once you accept that a person can do something that counts as letting die, or fail to do something that counts as a kind of killing depending on the causal story, the paradoxes tend to dissolve into questions about obligations and causality rather than binary moral boxes. I hope that helps untangle the knot a bit, because honestly, even the experts still argue about where exactly the lines should be drawn.

