answer: |-
  ### Part 1: Philosophical Ground Truth (For the Facilitator)

  Before running this, you need a clear map of the territory so you don't accidentally present a contested metaphysical theory as fact.

  **The View:**
  This position is often called the **Necessity of Origin Thesis**. It is most famously associated with Saul Kripke in *Naming and Necessity* (1972). Kripke argues that it is a *metaphysical necessity* that a particular human being originates from the particular biological matter (sperm and egg) that generated them. Therefore, a person coming from a different sperm and egg—even if psychologically indistinguishable—is numerically distinct. They are a different person entirely.

  **The Contestation:**
  *   **Status:** This is a dominant view in analytic metaphysics regarding *transworld identity*, but it is by no means settled consensus, especially outside strict essentialist circles.
  *   **Opposing Views:** Derek Parfit (in *Reasons and Persons*) argues that "survival" matters more than numerical identity. Psychological continuity theorists argue that if memories, character, and psychology persist, the identity persists, regardless of origin. Some philosophers (like Penelope Maddy) critique the very logic of trans-world identity Kripke relies on.
  *   **Epistemic vs. Metaphysical:** A major trap in the classroom is confusing *conceivability* with *possibility*. Students often think, "I can imagine my mom dating someone else, so it's possible." Kripke's claim is that while we can *imagine* it, it is *metaphysically impossible* for that specific resulting person to be you. The activity must push toward the metaphysical, not the epistemic.

  ---

  ### Part 2: The Activity Design — "The Lineage Ledger"

  **Time:** 45 Minutes Active / 15 Minutes Debrief
  **Materials:** Whiteboard, markers, printed "Files" (one per group), paper slips for voting.
  **Concept:** Students act as "Identity Auditors" for a fictional multiverse insurance company. Their job is to determine eligibility for benefits based on identity criteria they must apply consistently.

  #### Phase 1: The Setup (5 Minutes)
  Rearrange chairs into four tables of ~4 students each.
  Tell the class: *"We are the Audit Department of the Multiverse Benefits Corp. Every person in every universe has a policy. Sometimes a claim arises: Is this person in Universe B the same beneficiary as the person in Universe A? If they are the same, they get the payout. If they are different, they do not."*

  Distribute **"File Alpha"** to each table.
  **File Content:**
  > **Primary Subject:** Alex (Universe A). Born Jan 1, 2006. Biological Parents: Maria & David. Upbringing: Suburbia. Personality: Optimistic.
  > **Claimant:** "Alex Prime" (Universe B). Born Feb 15, 2006. Biological Parents: Sarah & Thomas. Upbringing: Suburbia. Personality: Optimistic.
  > **Evidence:** Medical records show Alex Prime has identical brain scans and memory logs to Alex. No behavioral differences detectable.

  #### Phase 2: The Decision Matrix (20 Minutes)
  Assign the following role to the tables: *They must audit three separate payouts. They can approve the payout to Alex Prime OR they must deny it. They cannot split the payout.*

  Write these three scenarios on the whiteboard (or print on cards). Read them aloud one by one. For each, students deliberate for 3 minutes, then cast a written vote (Keep/Deny).

  **Scenario 1: The Inheritance Tax**
  *Alex died in Universe A. Alex Prime appears in Universe A claiming the inheritance. Do they receive the assets?*
  *(Most will likely Say YES or HESITATE because of the psychology).*

  **Scenario 2: The Debt Liability**
  *Alex borrowed $50,000 (and defaulted) in Universe A. Alex Prime walks in. Does Alex Prime owe the money?*
  *(Most will Say NO or DENY because they sense a difference).*

  **Scenario 3: The Marriage License**
  *Alex's spouse wants to renew their vows. Alex Prime steps up. Are they the same spouse entitled to the license?*
  *(Most will Say NO).*

  **Constraint:** Tell them, *"Your ruling sets the precedent for the whole department. Be consistent. If Alex Prime is 'Alex', then Alex Prime owes the debt and keeps the inheritance. If they aren't 'Alex', they don't.*"

  #### Phase 3: The Hidden Variable (15 Minutes)
  After the votes are tallied on the board, reveal the twist.
  *"You noticed something odd about File Alpha. We left out one variable to see if you caught it."*

  Draw a simple diagram on the board showing the "Conception Event."
  Mark **Event A**: Sperm #44 + Egg #12 + Date Jan 1.
  Mark **Event B**: Sperm #89 + Egg #30 + Date Feb 15.
  Even though the outcome (brain scan/memories) is identical, mark the *Inputs* as totally different biological events.

  Ask the class: *"Look at the patterns of your votes. Did you treat Inheritance differently from Debt? Why? What is the threshold where 'You' stops being 'You'? If biology changes completely, did anyone vote that Alex Prime IS Alex?"*

  Usually, in this phase, a divide emerges. The majority will tend to vote inconsistently (Yes to Inheritance, No to Debt). This inconsistency proves they haven't decided on a criterion yet.
  *Facilitator Prompt:* *"Why does a biological change cancel a debt but maybe preserve a legacy? Is there a definition of 'person' that handles both?"*

  If they insist "Psychology is what matters," ask: *"If psychology is all that matters, is the person in the next room also you, right now? What happens when you forget things?"*

  ---

  ### Part 3: The Debrief (15 Minutes)

  Do not lecture. Map their own words to the philosophy.

  1.  **Name the Intuition:** "Some of you felt strongly that a person from different eggs/spans couldn't possibly be you. In philosophy, this is called **Origin Essentialism**."
  2.  **Name the Conflict:** "Others felt that if the mind is copied, the person continues. This aligns with **Psychological Continuity Theory** (associated with Derek Parfit)."
  3.  **The "Hard Problem":** Discuss why it's hard to define "same." If we admit the debt requires the body, but inheritance allows the mind, are we admitting our legal system runs on a contradictory definition of self?
  4.  **Cost Analysis:** Ask the students: *"If you say Biology doesn't matter, can you clone yourself and say the clone is you?"* *"If you say Biology DOES matter, does that mean if you lose your arm, are you less of you?"* (Bridging to Sorites paradoxes).

  ---

  ### Part 4: Predictable Failure Points

  Be prepared for these specific breakdowns in the first run:

  **1. The "Counterfactual Confusion"**
  Students will struggle to distinguish between "My parents could have met someone else" (Epistemic possibility) and "A person born from a different sperm is me" (Metaphysical possibility).
  *Fix:* When they say "Sure, I could have been born later," stop them and ask: *"Is that 'you' living a new life, or is that a new baby taking over your story?"* Push them to see that for Kripke, the person simply doesn't exist in that other timeline; a *different* person does.

  **2. The "Science Fiction Slide"**
  High schoolers love sci-fi tropes (Simultaneous Existence, Teleportation). They might argue, "But if the government cloned us..."
  *Fix:* Reinforce the rules of the "Audit Bureau." "We aren't talking about science fiction cloning technology. We are talking about *originating* from different biological matter in a normal pregnancy. No magic tech."

  **3. Emotional Resistance**
  Admitting "I am my specific sperm and egg" can feel reductive or biologically deterministic. Some students may resist purely out of existential discomfort.
  *Fix:* Validate the feeling. "Many philosophers agree this feels wrong. Why does it feel wrong? Is there something about dignity or soul that biology can't capture? That is the counter-argument we need to articulate."

  **4. Inconsistent Voting**
  As predicted above, students might vote inconsistently depending on whether the scenario is gain (Inheritance) or loss (Debt).
  *Fix:* Highlight this immediately in debrief. "Notice you wanted the money to be yours, but the debt to belong to someone else. That is legally convenient, but philosophically unstable. It suggests you don't know what grounds your identity."

  ---

  ### Part 5: Limitations & Nuances (For the Facilitator)

  To ensure you aren't misrepresenting the field, be aware of what this activity *cannot* capture:

  **1. Fuzzy vs. Sharp Boundaries**
  The activity presents origin as a binary switch (Same/Different). However, many philosophers argue identity is a spectrum (a continuum). The activity forces a "Yes/No" vote which simplifies the nuance of "partial identity" or "vague existence."
  *Correction in debrief:* "Our game forced a binary vote. Real philosophers debate if identity is a sharp line or a blur. Kripke believes it's a sharp line. Parfit believes the question itself might be empty."

  **2. Material vs. Historical Origin**
  Kripke distinguishes between *material* constitution and *historical* lineage. The activity conflates them (Parents/Gametes).
  *Correction:* "Are we essentialized by the specific atoms, or the causal history? We treated them the same in the game, but some arguments suggest the *history* of the sperm matters more than its current shape."

  **3. The "Existence" Gap**
  The hardest part of Origin Essentialism to convey is the idea that the "Alternative You" does not exist at all in the alternate world; rather, a *different* person exists there who is very similar.
  *Limitation:* Students will almost certainly visualize two people standing side-by-side. They cannot visualize "non-existence."
  *Correction:* Explicitly correct this visualization in the summary: "When we imagine the 'alternative world,' we usually see a person standing there. But Origin Essentialism claims if you weren't conceived from those parents, *nobody* would stand there who counts as you. Someone else would, but they are not you."

  **4. Assumption of Transworld Identity**
  The entire activity assumes that we *can* talk about the same person appearing in different worlds. Some philosophers (like Quine) reject this entirely, arguing "World-bound individuals."
  *Correction:* Mention briefly that some philosophers think this whole debate is nonsense because "people don't travel between worlds." (Optional advanced note).

  **Consensus Check:**
  Make sure to state: *"There is no Nobel Prize for Metaphysics, and this is still a live debate. Some of the smartest people in the world disagree on this. Our goal today is not to find the answer, but to see why the question breaks our brains."*
