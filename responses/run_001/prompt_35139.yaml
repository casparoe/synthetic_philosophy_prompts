      Current status: Contested, but Necessity of Origin is a dominant view in modal metaphysics. Reductionism is popular in ethics/personhood.
      I must make sure the teacher presents it as "This is the Kripkean view, others disagree."

      *Refining the "Going Wrong":*
      The biggest risk is students confusing "I wouldn't exist" with "Nobody would exist."
