answer: |-
  The debate over the "paradox of voting" hinges on a category error regarding the word "rational." The instrumentalist treats the voter like an investor seeking a return, while the expressivist treats the voter like a participant in a ritual seeking meaning. They aren't disagreeing about facts; they are disagreeing about the currency of exchange.

  ### (a) Costs and Benefits: Policy vs. Identity

  For the **Instrumentalist**, the accounting is cold and mechanical. The **cost** includes everything required to cast the ballot: time off work, travel expenses, mental effort, and the psychological anxiety of making the wrong choice. The **benefit** is strictly downstream: the difference in expected policy utility provided by Candidate A versus Candidate B, multiplied by the infinitesimal probability of being the deciding vote ($P$). Since $P$ approaches zero in mass elections, the calculation almost always yields negative expected utility.

  For the **Expressivist**, the accounting is internal. The **cost** remains physical (time, effort), but now there is also a risk cost: the fear that voting publicly signals allegiance that could lead to social or professional retaliation. The **benefit** is immediate and intrinsic. It is the feeling of fulfilling a civic duty, the affirmation of one's political identity, or the "warm glow" of solidarity with a group. Here, the benefit does not depend on the election result; it depends on the act itself.

  ### (b) The Landslide Verdict

  This is where the divergence becomes sharpest. Under the **Instrumental** model, voting in a landslide is irrational behavior. If the margin is known to be vast, your probability of affecting the outcome is zero. The cost is incurred for no tangible return. A rational agent should save their energy.

  Under the **Expressive** model, the landslide changes nothing. If I vote to signal my commitment to my tribe or my principles, the fact that my tribe loses does not negate the value of the signal. My utility comes from standing firm, not from winning. However, a subtle expressivist tweak exists: some argue we might abstain if our side is doomed to prevent "wasting" the expression on a losing horse, but the dominant view is that loyalty persists regardless of the scoreline.

  ### (c) Does Expressiveness Solve or Relocate the Paradox?

  Does identifying voting as expression truly dissolve the paradox? Not entirely; it merely relocates the riddle from "Why invest in a lottery ticket?" to "Why choose an expensive channel for communication?"

  If voting is just about signaling values, why stand in line for two hours when a bumper sticker costs pennies and reaches more eyes? This is the **Low-Cost Signaling Objection**.

  To defend the ballot box against this, one must lean on two factors: **Privacy** and **Costly Signaling**.
  1.  **Privacy:** Social media signals invite scrutiny, harassment, or demands for consistency. The secret ballot allows for expression without exposure to external social sanctions.
  2.  **Costly Signaling:** Evolutionary biology tells us that "cheap talk" is easy to fake. A tweet costs nothing; casting a ballot involves sacrifice. High-cost signals carry more weight and credibility within the community. By bearing the burden, you prove your commitment is sincere.

  So, the expressive account dissolves the *pivotal* paradox (you don't need to be decisive), but it faces a *cost-efficiency* paradox. It argues that the specific inefficiency of voting is the very feature that validates the expression.

