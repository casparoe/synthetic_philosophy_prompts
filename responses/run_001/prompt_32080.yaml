prompt: |-
  I'm running a philosophy discussion group for adults who aren't academics — some lawyers, a couple software engineers, a retired librarian — and we're doing a session on moral luck. They're sharp but haven't read Nagel or Williams. I have about forty minutes to get the core idea across before we open up for discussion.

  What I need from you isn't an explanation of moral luck itself. I need a plan for how to *teach* it: what has to go first, what example carries the whole thing, and what order the pieces have to come in. In particular, I want to know where the control principle needs to be introduced relative to the cases, and whether I should start with resultant luck or circumstantial luck. The drunk driver example seems obvious, but I'm worried it'll make people think moral luck is only about legal responsibility — so what example should anchor the whole thing, and what does it need to have and what does it need to lack?

  Also, what misconceptions should I expect? I'm guessing people will conflate moral luck with epistemic luck (we didn't *know* the outcome), and maybe they'll think the problem dissolves if you just judge character instead of actions. Where in the sequence do I head each of those off?

  Finally, give me one question I can ask at the end to see if they've actually understood the tension rather than just nodding along. And if you think the whole framing of "teaching moral luck in forty minutes to non-philosophers" is a bad idea for some reason I'm not seeing, tell me that instead of humoring me.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Adults, non-academics (lawyers, engineers, librarian), sharp but unfamiliar with Nagel/Williams.
      *   **Topic:** Moral Luck.
      *   **Time Limit:** 40 minutes for teaching/exposition (discussion follows).
      *   **Goal:** A teaching *plan*, not just content. Needs specific order, examples, anticipation of misconceptions, and a check-for-understanding question.
      *   **Specific Questions:**
          *   Where does the Control Principle go relative to cases?
          *   Resultant vs. Circumstantial luck ordering?
          *   Which example anchors it best (Drunk Driver pros/cons)?
          *   Anticipated misconceptions (Epistemic luck, Character judgment).
          *   Critical assessment: Is this plan feasible/good?

  2.  **Deconstruct "Moral Luck" for Non-Philosophers:**
      *   *Core Tension:* We judge people based on things they can't control, but morality suggests we should only be judged on what they *do* control.
      *   *The Paradox:* If luck determines outcome, how can outcomes affect moral praise/blame?
      *   *Control Principle:* The foundational premise. Must come early to set the stage.

  3.  **Address Specific Constraints & Questions:**

      *   *Control Principle Placement:* It must come *before* the deep dive into cases. You need a baseline norm ("We judge based on control") to show why the cases violate it. However, presenting it too abstractly first might bore them. Better to state it intuitively as a shared assumption, then break it.
      *   *Resultant vs. Circumstantial:*
          *   *Resultant Luck:* Outcomes differ due to luck (Driver A hits pedestrian, Driver B doesn't). Very visceral, legalistic.
          *   *Circumstantial Luck:* Situations differ (Soldier in war vs. Soldier at home; Dictatorship vs. Democracy). Shows character isn't enough.
          *   *Decision:* Start with Resultant. It's more immediate and emotional. Move to Circumstantial to deepen the challenge against "character only" defenses.
      *   *The Anchor Example (The Drunk Driver):* The user is right to worry about the legal conflation. To fix this, the example needs to emphasize *moral intuition* over *legal liability*. We need two drivers who are *identical* before the crash. One gets unlucky, one lucky.
          *   *Better Alternative?* The "Two Assassins" or "The Forgotten Key." Actually, the **Bernard Williams' Gauguin** case is famous but complex. Let's stick closer to the prompt's context. The Drunk Driver is actually standard for a reason: it's relatable. *Correction:* I should suggest a variant or a companion case that isolates the moral element from the legal element. Maybe the **Reckless Hiker** or **Two Parents**.
          *   *Refinement:* Keep the Drunk Driver but strip away the legal talk immediately. Focus on *blame*. "Which driver is worse?" If they say "Both," moral luck is dead. If they say "Crasher," moral luck exists. Then complicate it.
      *   *Misconceptions:*
          *   *Epistemic Luck:* "You couldn't know." Counter: We're talking about actual blame, not knowledge.
          *   *Character Judgment:* "Judge the intention, not the result." Counter: Sometimes circumstances dictate if you even have the chance to show character.
      *   *Feasibility Check:* 40 minutes is tight. Need to be disciplined. Don't let discussion bleed into instruction.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Phase 1: The Intuition Pump (5 mins).* Establish the Control Principle. "What makes us responsible?"
      *   *Phase 2: The First Case - Resultant Luck (10 mins).* The Drunk Driver variant. Crucial distinction: Identical choices, different worlds. Address the "Legal vs. Moral" confusion immediately here.
      *   *Phase 3: The Deepening - Circumstantial/Luck (10 mins).* The "Wartime vs. Peacetime" Nazi scenario (Nagel/Williams style). This kills the "it was their character" defense.
      *   *Phase 4: Synthesis & Implications (10 mins).* What do we do? Skepticism vs. Revisionism.
      *   *Phase 5: The Check Question (5 mins).*

  5.  **Refining the Content:**

      *   *Control Principle:* Introduce as a "Shared Assumption" in Phase 1.
      *   *Examples:* Use the Drunk Driver but explicitly forbid legal reasoning. Pair it with a subtle variation where the outcome is bad through no choice difference (e.g., slipping while throwing trash). Wait, the **Pedestrian/Drunk Driver** is the strongest hook. I will defend its use *if* framed correctly. Frame it as "Intuitive Blame."
      *   *The "Character" Defense:* This needs to be the pivot point. Show that circumstantial luck undermines character judgments too (e.g., someone who *would* be cruel had they been born under a dictator).
      *   *Critique:* Is 40 mins too short? For non-academics, yes, unless you keep it very concrete. Avoid the full Nagel taxonomy. Stick to Resultant and Circumstantial only. Constitutive luck is too abstract for 40 mins.

  6.  **Developing the "Critical Assessment":**
      *   Is it a bad idea? No, but high risk. The main risk is getting bogged down in semantic arguments ("It's not *moral* luck, it's just *bad luck*"). Need to warn against this.
      *   Also, 40 minutes leaves little room for the "Aha!" moment if the group is quiet. I need to advise the user to keep a "safety valve" explanation ready.

  7.  **Final Polish:**
      *   Structure clearly: Time blocks.
      *   Be directive about the "Why."
      *   Draft the specific Check Question (needs to force them to choose between two intuitions).
      *   Ensure the distinction between Epistemic (knowledge) and Moral (outcomes) is clear.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Tell them to skip the drunk driver.
      *   *Correction:* No, it's too intuitive. Just tell them to handle the legal objection pre-emptively.
      *   *Initial thought:* Put Control Principle at the end as a summary.
      *   *Correction:* Wrong. It's the axiom being attacked. State it early as the "rule we all follow until now."
      *   *Check Question:* Needs to be a binary choice that forces a contradiction.

  9.  **Finalizing the Output:** (Reviewing against the prompt requirements.)
      *   Plan structure? Yes.
      *   Control principle placement? Yes (Early).
      *   Order of luck types? Yes (Resultant -> Circumstantial).
      *   Anchor example advice? Yes (Modified Drunk Driver).
      *   Misconceptions addressed? Yes.
      *   One final question? Yes.
      *   Feasibility critique? Yes.

  *(Self-Correction on Feasibility Critique)*: I should mention that 40 minutes of pure exposition is boring for adults. Suggest weaving mini-votes or quick polls to keep engagement up without losing time to debate.

