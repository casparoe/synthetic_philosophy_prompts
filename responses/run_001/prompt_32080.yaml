answer: |-
  This is a tight window, but entirely doable if you treat it less like a lecture and more like a guided inquiry. You don't need to teach them Nagel’s taxonomy; you need to install the tension in their minds so the discussion solves itself.

  Here is the critical strategic assessment first, followed by the minute-by-minute plan.

  ### Critical Assessment: Is 40 Minutes Enough?
  **Verdict:** It is feasible, but risky.
  **The Risk:** The biggest danger isn't running out of time; it's getting stuck in a loop about **legal responsibility** versus **moral responsibility**. Because your group includes lawyers, they will instinctively try to resolve the paradox using legal precedent (negligence standards, sentencing guidelines). If you let them run with that, they will dismiss moral luck as "just procedural justice." You must shut that down instantly.
  **The Fix:** Explicitly ban legal language in your first example. You are asking about *human blame*, not *court verdicts*.

  ---

  ### The Lesson Plan (40 Minutes)

  #### Part 1: The Baseline (0–10 Minutes)
  **Goal:** Establish the Control Principle as a "shared intuition" before breaking it.
  **Action:** Do not define moral luck yet. Define *what we usually think*.

  1.  **The Setup (3 mins):** Ask the room: *"If two people make the exact same decision, do you think they deserve the same amount of blame?"*
      *   Most will say "Yes."
      *   Follow up: *"And if one person controls every variable except the weather, shouldn't they still be equally responsible?"*
  2.  **The Rule (7 mins):** Introduce the **Control Principle**. Write it on the board/screen.
      *   *"We are only morally responsible for what is within our control."*
      *   Make sure this feels like common sense. Ask the engineer: *"Does that feel fair?"* Ask the librarian: *"Is that how we judge people in daily life?"*
      *   **Note:** Get them to commit to this rule. You will use it to trap them later.

  #### Part 2: The Anchor Case – Resultant Luck (10–25 Minutes)
  **Goal:** Break the Control Principle using an intuitive scenario.
  **The Example:** **Do use the Drunk Driver.** But modify the framing.

  *   **Why it works:** It is visceral. Everyone understands the danger of intoxication.
  *   **How to avoid the Legal Trap:** Do not ask "Who goes to jail?" Ask "Who is a worse person?"
  *   **The Scenario:**
      *   **Driver A:** Gets drunk, drives home recklessly, turns off the radio to concentrate. *Miracle occurs:* A dog darts out, swerves him, he stops safely. Arrives home unscathed.
      *   **Driver B:** Gets drunk, drives home recklessly, turns off the radio to concentrate. *Luck fails:* He hits a child sleeping in a driveway. Child dies.
      *   **Constraint:** Emphasize that prior to the drive, they were identical in intent, action, and mental state.
  *   **The Vote (5 mins):** Ask the group: *"All else equal, which driver is more blameworthy morally?"*
      *   Half will say "Both." (Adherents to Control Principle).
      *   Half will say "B." (Intuitions of Consequence).
  *   **The Pivot:** Point out that if you chose "B," you have admitted that **outcome affects blame.** If you chose "Both," you hold onto the Control Principle, but you ignore the visceral feeling that killing a child is worse than hitting a dog that runs away.
      *   *Name it:* This is **Resultant Luck**. Same inputs, different outputs via chance.

  #### Part 3: The Deepening – Circumstantial Luck (25–35 Minutes)
  **Goal:** Defeat the counter-argument that "Blame = Character."
  **Misconception Alert:** Lawyers often argue, *"Well, Driver A would have been dangerous if he'd driven further, so he's guilty internally."* You need to move past character quickly.

  1.  **The Shift:** Present **Thomas Nagel's War/Peace Scenario** (simplified).
      *   **Person X:** Lives in a liberal democracy, kind, peaceful. Never faced a test of cruelty.
      *   **Person Y:** Born in Nazi Germany in 1930. Kind by nature, but became a loyal SS officer because it was the only path to social standing/security. Or conversely, **Person Z**: Same genetics/upbringing as Y, but grew up in 1930s Britain.
  2.  **The Argument:** *"If we judge only by character/intention, X and Y should be judged similarly. But Y becomes a monster due to circumstance. Does his 'circumstance' excuse the atrocities?"*
  3.  **The Trap:** If they say "Y is excused," they abandon moral responsibility entirely. If they say "Y is guilty," they admit **Circumstantial Luck** matters.
  4.  **Synthesis:** Explain that moral luck exists in three buckets (briefly list them, don't dwell):
      *   Resultant (Outcome)
      *   Circumstantial (Situation)
      *   Constitutive (Your own genetics/personality – briefly mention "you didn't choose to be angry or patient")

  #### Part 4: Troubleshooting & Wrap (35–40 Minutes)
  **Goal:** Head off misconceptions before opening discussion.
  **The Pre-emptive Strike:** Before handing over the mic for general discussion, address the two big objections you anticipated.

  1.  **"But they didn't know it would happen!" (Epistemic Luck)**
      *   *Say this:* "Don't confuse ignorance with luck. Both drunk drivers *know* drinking and driving is dangerous. We aren't judging them for failing to predict the specific death; we are judging that the death happened to the reckless person at all. Knowledge doesn't erase the impact of the outcome."
  2.  **"Just judge the intent!" (The Character Defense)**
      *   *Say this:* "That works for the drivers. But remember the Nazi/Germany example? You cannot judge the intent of a soldier in a vacuum. Your character is shaped by the world you are forced to inhabit. Circumstantial luck changes who you *become*."

  **The Check Question:**
  You asked for one question to verify understanding. It needs to force them to choose between their initial Control Principle and their intuition about the outcome.

  > **"If you agree that Outcome Luck matters, you imply that a hero who saves a child is better than a hero who saved a dog because they tried to save a child. Do we accept that the 'moral worth' of your life depends on the random number generator of fate, or do we find another way out?"**

  ---

  ### Summary of Strategic Choices

  **1. When to introduce the Control Principle?**
  *   **First.** It functions as the thesis statement. If you wait until after the examples, they will use it to rationalize away the luck rather than see the tension. You need them to pledge allegiance to it, then watch it crumble.

  **2. Resultant vs. Circumstantial order?**
  *   **Resultant First.** It is the "low-hanging fruit." Everyone agrees a killer is "worse" than a near-misser emotionally. It creates immediate friction.
  *   **Circumstantial Second.** This attacks the more philosophical defense ("Intent is all that matters"). Save this for when they start retreating to "intent" after the first example.

  **3. The Anchor Example Requirements:**
  *   **Must Have:** Two agents with identical mental states and choices at the moment of decision. This removes excuses about negligence or knowledge.
  *   **Must Lack:** Legal consequences. Explicitly tell the lawyers: *"Put your barometer in the drawer. We are talking about how you look at a spouse/friend, not a defendant."*

  **4. One Final Warning:**
  Your audience is "sharp." They will want to solve the problem. Moral luck has no solution. If they propose "Just don't care about outcomes," challenge them. If they say "We live in a retributive society anyway," acknowledge the pragmatism but remind them this is about *morality*, not *policy*.

  This plan keeps you moving, protects against the legal trap, and leaves them with the paradox intact for your 40-minute discussion slot.
