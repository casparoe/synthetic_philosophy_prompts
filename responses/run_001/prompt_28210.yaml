          *   *Who wins this round?* It's a standoff philosophically. Marcus makes the standard argument for Indirect Realism. Dana makes the standard objection (Disjunctivism). However, Marcus pushes harder on the burden of proof regarding the similarity ("Why do they feel the same?"). Dana's response ("indiscriminable isn't identical") is logically sound, but Marcus's push for an explanatory link is also fair. Let's lean slightly toward Dana logically (Identity doesn't follow from indiscriminability), but acknowledge Marcus is raising the real difficulty for her view.

