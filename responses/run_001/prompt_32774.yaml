      The Leveling-Down Objection (LDO) claims it is counterintuitive to prefer an outcome where everyone has less welfare simply because the distribution is more equal. It targets views that assign *intrinsic value to equality itself*, independent of the absolute well-being of individuals. For such views (like strict egalitarianism), reducing inequality is good even if the worse-off are not helped, making a move from unequal-but-higher welfare to equal-and-lower welfare potentially desirable.

