answer: |-
  The Leveling-Down Objection (LDO) argues that it is intuitively wrong to claim one outcome is better than another merely because it is more equal, if that equality is achieved by reducing the welfare of the better-off without improving the situation of the worse-off. This objection targets theories that assign *intrinsic value to equality itself* as a relational property. For strict egalitarianism, reducing inequality is inherently good; thus, moving from an unequal state to an equal state—even one with less total welfare—can be deemed preferable, despite the net loss of well-being.

  Prioritarianism avoids this by evaluating distributions via the sum of transformed individual welfares: $V = \sum f(w_i)$. The transformation function $f$ is typically strictly increasing and strictly concave. The **strictly increasing** property is what blocks the LDO. Because $f$ is strictly increasing, any decrease in an individual’s welfare necessarily reduces the total moral value $V$. In a leveling-down scenario, the better-off suffer losses while the worse-off remain stationary. Consequently, the total sum declines. Since prioritarianism aggregates moral value derived from absolute welfare levels, it registers leveling down as a net loss. While strict concavity assigns greater weight to benefits for the worse-off (the "priority" element), it is the monotonicity—the fact that more welfare is always morally better—that prevents empty equality from trumping welfare loss.

  If we modify prioritarianism such that $f$ becomes flat above a threshold (zero marginal value above $T$), the view becomes vulnerable. Leveling down those above $T$ reduces their actual welfare but causes no drop in the calculated value $V$. The system becomes indifferent between the unequal original state and the newly equalized state. If the theory incorporates any tie-breaking preference for equality, it would endorse leveling down. This reveals that what truly shields prioritarianism is not the concave weighting, but the commitment to *strict monotonicity*—the belief that every unit of welfare possesses positive moral significance. Once welfare becomes morally irrelevant above a certain point, the barrier against gratuitous leveling vanishes, exposing a structural similarity to views that prioritize equality over absolute well-being.
