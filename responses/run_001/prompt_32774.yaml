      Consider a modified prioritarianism where $f$ flattens above a threshold $T$ (zero marginal value above $T$). Here, leveling down the well-off from above $T$ to $T$ would reduce their welfare but leave the total value unchanged. Since the moral cost of harming the rich vanishes, the theory becomes indeterminate between unequal and equal states (assuming other things equal). If equality serves as a tie-breaker, the modified view endorses leveling down. This demonstrates that prioritarianism is shielded from the LDO specifically by the requirement that all welfare gains have positive moral weight. Without the strictly increasing condition, the prohibition against wasteful equality-seekers collapses, revealing that standard prioritarianism shares a key assumption with utilitarianism—respect for person-by-person welfare improvement—that egalitarianism rejects.

