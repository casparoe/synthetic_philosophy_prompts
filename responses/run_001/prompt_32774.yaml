      The Leveling-Down Objection (LDO) argues that it is absurd to claim one outcome is better than another solely because it is more equal, if achieving that equality harms the better-off without benefiting the worse-off. This objection targets theories that place *intrinsic value on equality as a relational property*. For strict egalitarianism, reducing inequality is inherently good; thus, moving from an unequal state to an equal state (where fewer resources exist overall) can be deemed better, despite the net loss of welfare.

      Prioritarianism avoids this by evaluating distributions via the sum of transformed individual welfares: $V = \sum f(w_i)$. The transformation function $f$ is typically strictly increasing and strictly concave. The **strictly increasing** property is what blocks the LDO. Because $f$ is strictly increasing, any decrease in an individual’s welfare reduces the total value $V$. In a leveling-down case, the better-off suffer losses while the worse-off remain stationary. Consequently, the total sum declines. Since prioritarianism cares about the aggregate moral value derived from welfare levels, it registers leveling down as a net loss, not a gain. While strict concavity assigns greater weight to benefits for the worse-off (the "priority" element), it is the monotonicity—the fact that more welfare is always better—that prevents empty equality from trumping welfare loss.

      If we modify prioritarianism such that $f$ becomes flat above a threshold (zero marginal value above $T$), the view becomes vulnerable. Leveling down those above $T$ reduces their actual welfare but causes no drop in calculated value. The system becomes indifferent between the unequal original state and the newly equalized state. If the theory incorporates any tie-breaking preference for equality, it would endorse leveling down. This reveals that what truly shields prioritarianism is not the concave weighting, but the commitment to *strict monotonicity*—the belief that every unit of welfare possesses positive moral significance. Once welfare becomes morally irrelevant above a certain point, the barrier against gratuitous leveling vanishes, mirroring the flaw in views that prioritize equality over absolute well-being.

