answer: |-
  This is a fantastic exercise in applying Tolstoy’s rigorous, often frustrating, framework. Your summary of his praises and condemnations is spot-on, and "We Shall Overcome" is indeed the perfect stress-test case because it sits right at the intersection of his three main criteria: **Infectiousness**, **Accessibility**, and **Religious-Moral Content.**

  Here is how Tolstoy would likely adjudicate the case of "We Shall Overcome," followed by the correction to your theoretical model and the settling case.

  ### 1. The Verdict on "We Shall Overcome"
  Tolstoy would almost certainly classify "We Shall Overcome" as **True Art**, despite its political associations. Here is how he would dismantle your two objections:

  **The Political Objection:**
  Tolstoy distinguishes sharply between "political" art that serves the State (national anthems, patriotic operas, war propaganda) and "religious" art that serves the Union of Men. He argues that the Christian age demands an art that unites all people, not just citizens of a specific tribe or state.
  While "We Shall Overcome" emerged from a movement with political goals, Tolstoy would look at the *emotion transmitted*. If the song transmits a sense of suffering, dignity, and hope shared by humanity against oppression, it falls under "Religious Consciousness." Tolstoy himself was a staunch advocate for peace and the rejection of state violence; he viewed the Civil Rights Movement’s ethos of non-violent resistance as far more aligned with the Gospel than most conventional piety. As long as the feeling being transmitted is "Love of Neighbor" rather than "Hatred of Enemy," the political application becomes secondary to the spiritual utility.

  **The Authorship Objection:**
  You worry he requires an individual author to transmit "sincerity." However, Tolstoy explicitly champions **folk art** precisely because it lacks a single author. He writes extensively about peasant songs, stories, and proverbs. His argument is that a singular, ego-driven artist often loses sincerity by trying to impress a sophisticated audience. Conversely, folk art evolves to survive; if a song persists across generations, it is proof that it genuinely connects.
  For Tolstoy, the "artist" is the community itself. If the crowd sings it and weeps, the "sincerity" is proven collectively. The obscurity of the author removes the barrier of celebrity, making it *more* accessible to the common man, which is exactly what Tolstoy wants.

  **The Verdict:** It is **True Art.** It achieves the "union of men" (a primary goal of his definition), uses a simple medium understandable by the lowest classes, and transmits a feeling of brotherhood and endurance that cuts across education levels.

  ### 2. The Closest Analogue
  The closest analogue in Tolstoy's list is **_Uncle Tom's Cabin_**.
  Here is why:
  *   **Didactic Purpose:** Like Stowe's novel, Tolstoy views art not as "beauty" but as a tool for moral instruction and spiritual alignment.
  *   **Accessibility:** Both are written in language/form that a Russian peasant could understand (unlike Beethoven or Mallarmé).
  *   **Subject Matter:** Both deal with the suffering of the downtrodden and aim to stir the conscience of the listener/reader regarding human worth.
  *   **Infection:** Tolstoy admired Stowe for making white readers "feel" the pain of Black slaves, thereby creating a bridge of empathy. This mirrors the function of "We Shall Overcome" creating solidarity across racial lines.

  (Secondary analogue: **Peasant Folk Songs**. If Tolstoy had known this song, he would treat it like the folk songs of the Russian peasantry he collected—art that belongs to the people, evolved over time, and serves the function of communal bonding.)

  ### 3. Refining the Principle
  Your current formulation is: *Accessibility + Infectiousness + Moral Seriousness.*
  This is strong, but it misses the specific *kind* of morality Tolstoy requires. You are correct that "morality" is part of it, but "moral" is too broad. For example, a patriotic hymn can be "moral" to a soldier who believes his duty is to defend his king. Tolstoy rejects this.

  **The Better Unifying Principle:**
  Art is true if it transmits **feelings of religious consciousness (universal brotherhood)** that unite the entire human race, regardless of class or status, through a mechanism of **maximum infectiousness**.

  There are three pillars here:
  1.  **Content (The "What"):** Must promote the "Kingdom of God" within man. Not vague goodness, but specifically *human unity*. Art that divides people (nationalism, class warfare, exclusive elitism) is counterfeit, even if technically brilliant.
  2.  **Form (The "How"):** Must be intelligible to the widest possible audience. Complexity that requires "training" is a lie; it indicates the artist is catering to a clique rather than transmitting truth.
  3.  **Mechanism (The "Engine"):** **Infectiousness.** This is the empirical test. If the audience *feels* what the artist felt, it worked. Tolstoy believes technical skill (virtuosity) often acts as a mask to hide the lack of feeling. If you can be impressed by technique but unmoved by emotion, it is not art.

  So, a better way to phrase his principle for your group: **Art is a vehicle for spiritual unification. Its success depends on its ability to bridge the gap between the creator and the commonest viewer without loss of intensity.**

  ### 4. The Settling Case
  To test this unified principle—and to prove that Tolstoy distinguishes between "good political feeling" and "bad political feeling"—you should test him with: **A National Anthem (e.g., The Marseillaise or The Star-Spangled Banner) vs. A Labor/Non-Violence Hymn (e.g., We Shall Overcome).**

  *   **Why this settles it:** Both are political songs. Both unify a specific group of people. Both are highly infectious and accessible. If Tolstoy rejects both, then politics is always out. If he accepts both, politics is irrelevant.
  *   **The Tolstoy Prediction:** He would condemn the National Anthem and accept the Civil Rights Hymn.
  *   **The Reasoning:** The National Anthem transmits a feeling of loyalty to a *territory* and hostility toward *other* nations ("our land, their threat"). This creates division and separation of humanity. "We Shall Overcome" transmits a feeling of shared dignity and hope that implies the ultimate victory is not over a nation, but over *dehumanization*. It seeks to include, not exclude.
  *   **The Lesson:** This confirms that Tolstoy isn't anti-justice; he is **anti-separatism**. He allows any art that expands the circle of who is considered "brother." He bans any art that draws a circle around the self, the class, or the nation.

  ### Summary for your Group Discussion
  When presenting this, you can argue that Tolstoy is often misread as simply being "anti-elitist" or "pro-peasant." His real standard is **Anti-Separation.**

  "We Shall Overcome" passes because it dissolves separation between races and classes through shared vulnerability. Beethoven's 9th fails (in his view) because, despite the chorus of "Brotherhood," the musical complexity keeps the feeling trapped in the ears of the elite until it becomes intellectual appreciation rather than felt infection.

  If your group is willing to push further, ask: *Is "We Shall Overcome" still True Art if it stops moving people?* Tolstoy’s theory is empirically pragmatic. If the next generation sings it mechanically and feels nothing, it ceases to be Art and becomes a Dead Letter. This emphasizes that for Tolstoy, art isn't an object; it is a relationship.
