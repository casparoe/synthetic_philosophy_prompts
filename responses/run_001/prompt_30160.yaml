          *   **Reliabilism (Non-causal):** Justification depends on the reliability of the process, even if the target doesn't cause the output (provided there's a common cause).
          *   **Phenomenal Conservatism:** "If it seems to S that P, then, in the absence of defeaters, S has some degree of justification for believing P."
      *   *The specific relationship:* In EP, the brain state $B$ causes both the Pain $P$ and the Belief about $P$ ($B_{pain}$). So there is a common cause, just not a direct causal link from $P$ to $B_{pain}$. Does this break justification? Not necessarily, depending on the theory used.

