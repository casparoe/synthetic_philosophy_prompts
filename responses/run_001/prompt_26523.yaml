      *   *(2) Semantic Change during Revolutions:* This is the core of incommensurability. Newtonian mass $\neq$ Einsteinian mass. *Verdict: Accept* (This is the standard interpretation of Kuhn).
      *   *(3) No Genuine Contradiction without Shared Meanings:* This is the tricky one. The argument claims $P \land \neg P$ requires shared meaning for genuine logical contradiction. If meanings shift, you get equivocation. *Verdict: Refine*. This is too strong. Logic doesn't require identical definitions, just sufficiently overlapping reference or truth conditions to establish conflict. Or, more charitably to Kuhn, he allows for "local translation" even if global translation fails. Strict identity of meaning isn't required for conflict; partial overlap is enough. However, if taken strictly (as the argument does), it leads directly to the problem.
      *   *(4) No Incompatible Predictions:* Follows from (3). If no contradiction, predictions don't clash logically. *Verdict: Reject*. Predictions are empirical statements about observations. Even if theoretical terms differ ("mass"), observation terms (pointer readings, meter values) usually retain enough continuity to allow predictive competition. Kuhn emphasizes this in later works.
      *   *(5) Evidence Can't Logically Favor One:* Follows from (4). *Verdict: Reject*. This assumes a rigid "logic of evidence" that Kuhn actually critiques. But more importantly, it ignores that theories share observational vocabulary (phenomenal reports) even if they disagree on theoretical interpretation.
      *   *(6) Non-Rational Change/Underdetermination:* This follows from (5) in a strict empiricist framework. *Verdict: Refine*. Theory choice *is* underdetermined by logic/data alone, but that doesn't mean it's irrational. It means it involves other values (accuracy, scope, simplicity) which Kuhn explicitly lists. It's not *just* taste/sociology.
      *   *(7) Kuhn Denied Relativism:* True. Kuhn repeatedly denied being a Kuhnian relativist (in "Objectivity, Value Judgment, and Theory Choice"). *Verdict: Accept* (Historical fact).

