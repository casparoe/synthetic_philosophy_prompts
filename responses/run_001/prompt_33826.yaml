answer: |-
  # Q&A PREP SHEET: ENDURANCE WITHOUT PRESENTISM
  **Conference:** Metaphysics Workshop (20 Participants)
  **Paper Topic:** Adverbial Endurantism; Critique of Perduantism's Motivations
  **Audience Profile:** Heavy on Perdurantists (incl. 1 Stage Theorist); Skeptical Physicists; Historians; Generalists.

  ---

  ### OBJECTION 1: The Stage-Theory "Notational Variant" Charge
  **Context:** *Most likely from the Perdurantist Stage Theorist in the metaphysics group.*
  **Phrasing:** "You argue that objects are wholly present at $t$ via time-indexed properties. But if my Stage Theory says the Stage-$x$ bears 'being-bent', and your Endurance says Object-$x$ bears 'being-bent-at-$t$', aren't these truth-conditionally equivalent? Unless you can show the bearer of 'at-t' is genuinely numerically identical across moments rather than just qualitatively similar, your account is just a notational variant of four-dimensionalism. Why should I prefer the ontological commitment to cross-time identity when 'temporal parts' does the work without positing mysterious trans-temporal identities?"

  **Two-Minute Reply:**
  "That’s a crucial challenge, but it assumes that indexing instantiation entails division of the object. In the Stage view, the relatum of the property *is* the temporal part; the stage *is* the thing that exists. For me, the bearer remains numerically the same object throughout the interval.

  When I say ‘$x$ is bent-at-$t_1$’ and ‘$x$ is straight-at-$t_2$’, the ‘at-$t$’ modifies the *mode of possession*, not the object. To borrow from a grammatical analogy: saying 'I ran slowly' doesn't split me into a 'slow-runnng-part'. Similarly, enduring through time doesn't mean the object splits. The Stage theorist treats cross-time statements as statements about a set of distinct things (stages) standing in a unity relation. I treat them as statements about *one thing* standing in different modes.

  This isn't just notational because the identity conditions differ radically. For the Stage theorist, 're-identification' is a primitive relation between distinct stages. For me, 're-identification' tracks an existing subject. My view makes the object the fundamental unit of reality, not a collection of slices. The difference is structural: are we analyzing change as variation among parts, or as variation in the state of a single subject? Those aren't notationally interchangeable any more than atomism and field theory are."

  **Weakness Note:**
  *"Numerically the same" feels like a bare assertion here. You haven't provided a criterion of diachronic identity other than "it persists." The Stage Theorist will press that without a clear grounding mechanism for this cross-temporal sameness, your view is less parsimonious than theirs.*

  ---

  ### OBJECTION 2: Special Relativity and Simultaneity
  **Context:** *From the Philosopher of Physics (likely second most damaging due to empirical weight).*
  **Phrasing:** "If you're not a Presentist, you likely accept a Block Universe. But in Minkowski spacetime, there is no absolute simultaneity. What does it mean for an object to be 'wholly present at $t$' if $t$ is frame-dependent? If your endurance requires the object to coincide with a hypersurface, which hypersurface? Without a preferred foliation, your definition of 'wholly present' seems incoherent under Special Relativity."

  **Two-Minute Reply:**
  "This is the standard worry, but it presumes that 'presence' requires an observer-independent hypersurface. We can define endurance relativistically by allowing the set of 'present' events to be foliated differently depending on the causal structure relevant to the object.

  Crucially, my paper doesn't rely on Presentism, so I don't need a privileged 'now'. I need only that at any given event in the world, if an object exists, its properties are instantiated relative to that event. The physics constrains *which* sets of events constitute a valid history for an object (timelike curves), but it doesn't force us to slice those histories into parts. An electron can endure along a worldline without being composed of segments. The 'wholeness' refers to the fact that the entire entity is involved in local interactions at every point on its path, not that it fills a global 3D volume simultaneously for everyone. We accept partial ordering in our semantics; that suffices."

  **Weakness Note:**
  *"Whose perspective defines the existence?" If you deny absolute simultaneity, "wholly present" loses its intuitive bite. If the electron exists "wholly" at point $A$ and point $B$ (spacelike separated), you face contradictions regarding properties. This answer skirts the issue of whether "existence" is relativized to frames, which sounds like moving toward Presentism.*

  ---

  ### OBJECTION 3: The Loss of Intrinsicness
  **Context:** *From the General Metaphysicians.*
  **Phrasing:** "Your adverbialist strategy solves the problem of temporary intrinsics by time-indexing them. But isn't 'bent-at-$t$' just a disguised relation? By attaching a time to the property, you're making all properties relational to a coordinate. If properties are relations to times, then nothing is truly intrinsic anymore. You've solved the incompatibility of properties by destroying their intrinsicality. That's not a preservation of endurance; it's a reduction of objects to bundles of relational tropes."

  **Two-Minute Reply:**
  "I agree that indexing introduces a dimensionality, but I deny that this makes the property extrinsic in the problematic sense. A relation like 'being taller than' depends on another object. A relation like 'being bent-at-$t$' modifies how the object manifests itself internally at that location.

  Think of it phenomenologically: when I see a table as brown, that color is intrinsic to the appearance. If I see it again an hour later as painted blue, the change happened to the object itself, not in relation to something else. The time index acts as a logical parameter of instantiation, akin to a modifier. It tells us *when* the intrinsic character obtains, not *what* stands in relation to *whom*. The object doesn't gain the property *by virtue of* the time; the time locates the manifestation of the property. Thus, the object retains its intrinsic status; the logic of *how* we track those states changes, but the ontology of the property remains grounded in the object."

  **Weakness Note:**
  *This relies heavily on semantic intuition. Lewis famously argued that if you time-index properties, you turn properties into universals relating objects and times ($U(x,t)$). Your reply tries to distinguish a "logical parameter" from a "relata," which many will find unpersuasive technical gerrymandering.*

  ---

  ### OBJECTION 4: Collapsing the Epistemic/Metaphysical Distinction
  **Context:** *From the paper's specific target—Metaphysicians interested in your methodology.*
  **Phrasing:** "Your paper argues we've confused epistemic re-identification with metaphysical persistence. But practically speaking, the only way we verify an object persists is via spatiotemporal continuity of characteristics. Isn't admitting that spatiotemporal continuity is necessary for knowledge of persistence effectively conceding that the *metaphysical* structure involves such continua—which is just the perdurantist worm? If you can't separate knowing from being, your critique of temporal parts loses its force."

  **Two-Minute Reply:**
  "It’s true that epistemic access relies on continuity traces, but that's a constraint on knowledge, not necessarily on the thing known. We infer the sun exists through a telescope; the trace isn't the object. Similarly, we trace the car through space-time points; that doesn't mean the car is made of points.

  The confusion arises when people assume: 'If I can only know $x$ via continuous paths, $x$ must be a continuous path.' That's an inference to the best explanation fallacy. The metaphysical claim is about the *nature* of the substance. Just because I need a roadmap to visit Paris doesn't mean Paris is composed of roads. My point is that temporal parts theory mistakes the method of detection (tracking continuous trajectories) for the constitution of the object (segments). We can maintain that the object is a singular entity even if our access to it requires mapping a trajectory."

  **Weakness Note:**
  *This is the riskiest defense. In Humean terms, if there is no observable difference between a continuous trajectory and a series of fused parts, asserting a distinct "substance" beneath it looks suspiciously post-hoc. You need to ensure you aren't smuggling in Aristotelian hylomorphism to save the day.*

  ---

  ### OBJECTION 5: The Stage Theorist's "Change" Intuition
  **Context:** *Specific to the Stage Theorist mentioned.*
  **Phrasing:** "Even if you're right about the metaphysics, why think Perdurantism has been getting a free ride? Our intuition of change—that the object *is* changing—seems to fit perfectly with different temporal parts having different properties. If I bend a wire, the bent-stage comes after the straight-stage. Where does your Endurantism add explanatory value over the Stage view, assuming we grant your time-indexing?"

  **Two-Minute Reply:**
  "The intuition of change fits Stages well only if we forget what change *feels* like. When a wire bends, it doesn't feel like a straight segment vanishes and a bent segment spawns elsewhere. The wire undergoes a transformation. Stage theory accounts for change by substitution of parts; Endurance accounts for it by alteration of the subject.

  My view restores the agency of the object in the narrative of change. On the Stage view, the 'object' (the fusion) never changes; only the succession of stages does. That disconnects the concept of persistence from the experience of change. I argue that Perdurantism has gained traction by leveraging the 'worm' metaphor, which visually satisfies the tracking requirement, while obscuring the fact that a 'worm' cannot act or suffer—it just sits. If you want to preserve that the object itself changes, not just its constituents, Endurance is required."

  **Weakness Note:**
  *"Alteration of the subject" is a high-cost move without a mechanism. Stage theorists will mock the idea that a subject changes while remaining constant. You are trading clarity (Stages) for qualitative fidelity to our experience of "being changed," which is subjective and hard to weigh against ontological precision.*

  ---

  ### OBJECTION 6: Fission and Fusion Cases
  **Context:** *From the Generalists.*
  **Phrasing:** "Let's test the theory with fission. Suppose a human body divides into two halves that both survive as persons. If the original person endured, she couldn't become two people. If she perished, the survivor wasn't her. How does your time-indexed adverbialism handle branching persistence without simply defaulting to the psychological continuity criteria favored by four-dimensionalists?"

  **Two-Minute Reply:**
  "Fission cases highlight that endurance requires a constraint on maximal causal continuity. If a process branches into two equally viable continuants, the original entity's persistence condition ceases. However, this doesn't collapse into Perdurance. Under my view, prior to fission, there was one object instantiating properties. At the moment of branching, the conditions for instantiation fail for the original.

  Perdurantism handles this by saying the pre-fusion worm forks, creating two worms sharing a common past segment. But that presupposes the object *was* the segment. I argue that in cases of fission, the pre-existence of the original endurer is compatible with the subsequent cessation of that specific identity, without requiring the existence of a larger fusion object. We acknowledge the ambiguity of identity in fission cases, but we don't solve it by multiplying temporal parts to create a larger abstract whole."

  **Weakness Note:**
  *"Ceasing to exist" is the tricky bit. If fission happens, did the original survive or die? If died, then the successor is new. But that contradicts common intuition. Endurantists often struggle here more than Perdurantists because Perdurantists can simply say "both are the worm's future." Your refusal to use the worm model makes fission much messier.*

  ---

  ### THE "PRAY NOBODY ASKS" QUESTION
  **The Question:**
  "Since you reject Presentism, you likely accept that $t_1$ and $t_2$ are equally real moments in the block universe. If the object is wholly present at $t_1$ and wholly present at $t_2$, and it has incompatible properties $P$ and $\neg P$ at those times, you claim adverbialism avoids contradiction. But if $t_1$ and $t_2$ are both 'out there' in the eternal block, hasn't the object already determined its fate at $t_1$ before it reaches $t_2$? Doesn't this force you into a deterministic picture where 'persistence' is just a static sequence of states? And if so, how is this ontologically distinct from the four-dimensional worm you're trying to avoid, other than refusing to call the states 'parts'?"

  *(Why this is the threat: This exposes the deep tension between Endurantism and Eternalism without Presentism. The "wholesome presence" at multiple times looks like a contradiction of properties unless you introduce a relativizing operator that behaves exactly like the temporal part relation. It suggests your view might just be "Four-Dimensionalism in Denial.")*

  **Strategy if Asked:**
  Do not retreat to Presentism. Do not admit determinism.
  Instead, lean into the distinction between **Logical Structure** and **Ontological Division**.
  Argue: "The block universe contains the *states* of affairs, yes. But stating that the object is wholly present at $t_1$ means the *explanatory priority* lies with the object, not the states. For the Worm view, the object is the sum of states. For me, the states are derivative manifestations of the enduring substance. It's the difference between a melody and the score. Both exist eternally in the library, but the melody is heard as a whole, not as a string of independent dots. My 'adverbialism' captures the phenomenal unity of the object within the block, which the temporal part view reduces to mere aggregation."

  *Short version for memory:* "Block = Score. Endurance = Melody. Worm = Collection of Sheet Music. The score exists statically, but the melody is a unified performance. My view protects the unity of the performance; yours dissolves it into notation."

  ---
