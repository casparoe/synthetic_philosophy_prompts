      *   *Underdetermined:* How much hypocrisy matters. One time vs. lifetime. Different norms overlap.
      *   *Inconsistent:* Public figures. We expect them to follow rules personally but also acknowledge their professional role creates separation.
      *   *Revision Needed:* We need to clarify when we are speaking as private individuals vs. office-holders.

  8.  **Final Structure:**
