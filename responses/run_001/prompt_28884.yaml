answer: |-
  The widespread intuition that hypocrites lack standing to blame commits us to a specific, sophisticated metaphysical and normative theory of moral agency. It does not merely reflect a psychological preference for sincerity; it reflects a structural understanding of what moral obligation entails.

  I argue that the practice presupposes the **Relational/Second-Personal Account of Blame**. Under this theory, moral blame is not the assertion of a true proposition regarding another’s conduct; rather, it is a **normative speech-act that asserts a relationship of accountability.** To blame someone is to invite them into a justificatory exchange, demanding they answer for their violation of a shared norm.

  Here is the reconstruction of this theory, its commitments, and the necessary revisions to our practices based on it.

  ### 1. The Nature of Blame: Authority vs. Assertion

  To understand why hypocrisy disqualifies a speaker in ways that hypocrisy does not disqualify a mathematician or a doctor, we must define blame as something other than the transmission of information.

  If blame were merely the assertion of the proposition $\neg P$ (where $P$ is a wrongful act), then the speaker's history would be logically irrelevant. A liar can correctly assert that lying is wrong, just as a smoker can correctly assert that smoking is carcinogenic. In these cases, we separate the *content* of the speech from the *credibility* of the source. However, when we say "you're one to talk" regarding a moral charge, we are blocking the *force* of the speech entirely.

  Therefore, the practice commits us to viewing blame as **performative**. It functions like a legal summons or a demand for restitution. Drawing on Stephen Darwall's distinction, blame is **second-personal**: it addresses the addressee as a responsible agent capable of recognizing reasons and responding to demands. It claims that the blamer represents the moral community's standards.

  Hypocrisy undermines this because it severs the link between the blamer and the community. When I blame you for violating norm $N$, I implicitly place myself under norm $N$ as well. If I do not abide by $N$, I am effectively claiming that I am exempt from it while you are not. This destroys the reciprocity required for second-personal demands. You can reject my demand on the grounds that I am asserting a privilege for myself that I deny you—a kind of normative unfairness.

  This distinguishes blame from **advice** or **legal judgment**:
  *   **Medical Advice:** A doctor who smokes offers a prediction about health outcomes. The patient submits to the *facts*, not the doctor's personal moral character. The relationship is expert-patient, not peer-peer.
  *   **Mathematical Proof:** Truth is universal and context-independent. The proof stands regardless of the prover's soul.
  *   **Legal Sentencing:** A judge sentences based on *institutional authority* (delegated by the state), not personal standing. While a corrupt judge is illegitimate in a broader sense, their specific legal pronouncement carries statutory weight independent of their sins.

  Moral blame, by contrast, relies on **peer authority**. Its power comes from mutual recognition of equality before the moral law. Hypocrisy signals inequality, thereby dissolving the authority. Peer-based authority collapses if the peers are not peers in fact.

  ### 2. The Account of Standing: Equal Subjection and Fairness

  The practice commits us to an account of standing grounded in **equal subjection**. To have the standing to blame, one must be subject to the very norm being invoked.

  Standing is not forfeited by mere imperfection (the "sinner in me" defense works up to a point). If I condemn dishonesty but once told a white lie, I retain standing. Why? Because the theory distinguishes between **systematic exemption** and **specific failure**.
  *   **Systematic Exemption:** If I condemn dishonesty but build my career on deceit, I am signaling that I believe honesty is for *others*, not for *me*. This is a rejection of the reciprocal constraint that gives the norm force.
  *   **Specific Failure:** If I fail occasionally but accept the validity of the norm when criticized, I remain a member of the moral community. My hypocrisy may reduce my *epistemic credibility* (maybe I won't notice details), but it does not strip me of *normative standing*.

  However, the line is drawn at **proportionality and relevance**.
  If I condemn adultery, I lose standing only regarding fidelity. If I condemn murder but steal, I likely retain standing (stealing does not imply I believe murder is permissible). But if I condemn *lawlessness* generally while breaking laws, I lose standing broadly because I have rejected the framework of rule-following itself.

  The underlying theory posits that moral norms are **regulative of relationships**, not just abstract truths. Therefore, standing is relational. You cannot call out a violation of the relationship while simultaneously violating it yourself.

  ### 3. Internal Consistency: The Tension Between Role and Self

  Is the practice internally consistent? Largely yes, provided we distinguish between **private blame** and **institutional blame**.

  **The Justifiable Distinction:**
  We treat the philosopher or judge differently from the friend because their speech is authorized by a role. When a judge sentences a criminal, they speak *as* the Judge. Their personal standing is irrelevant because their authority is borrowed from the Legal Institution. Similarly, when a corporate executive speaks in an official capacity, they channel the entity's obligations.
  The inconsistency arises only when we confuse the person with the role.
  *   **Consistent Case:** A politician evades taxes while denouncing public fecklessness. Here, the politician is speaking publicly but *privately* benefits from evasion. Unless they are acting strictly in a procedural vote regarding tax law (institutional), the public perceives their statement as a personal moral judgment. The "tu quoque" attack is valid because they are using the platform to assert moral superiority while denying the moral burden.
  *   **Inconsistent Case:** We sometimes punish whistleblowers who reveal corruption in an organization that employed them, despite the whistleblower's own minor past transgressions. The practice wavers here. Sometimes we demand "pure hands," sometimes we ignore them.

  **Where the Practice Needs Revision:**
  The current practice is philosophically inconsistent regarding **public political discourse**. We oscillate between requiring politicians to be paragon virtues (moral standing) and treating policy debates as technocratic (propositional).
  *   If we adopt the Relational Theory consistently, a leader who lies about their private finances lacks standing to lecture on civic integrity.
  *   However, in a democracy, we often grant leaders "policy standing" separate from "moral standing."
  *   **The Flaw:** Our current practice treats this separation loosely. We let a politician preach environmentalism while privately polluting, dismissing it as a "scandal" but allowing the policy critique to stand. Then, we reverse course and use their pollution to discredit the entire policy agenda. This swings unpredictably.
  *   **Revision:** We must codify the distinction. Institutional authority (votes, laws, regulations) should be separated from moral admonition. A legislator can draft a good law even if they are a bad husband. But they lose standing to *condemn* constituents for moral failings. The practice needs to stop conflating **policy efficacy** with **moral authority**.

  ### 4. Implications of Abandoning the Standing Requirement

  Suppose we replaced the Relational Theory with the **Propositional View**: Blame is nothing more than identifying a moral truth. In this world, standing is irrelevant.

  **Consequences for Workplace Complaints:**
  Currently, HR departments often assess the credibility of complaints. Under the Propostional View, an investigation would be binary: Did the act happen? Yes/No.
  If a manager harasses an employee, then reports another employee for sexual harassment, under the current Relational view, their report might be viewed with suspicion regarding their *intent* or *standing*. Under the Propositional view, the report stands alone.
  *   **Result:** We might see more false accusations validated because the focus shifts to "is the claim true?" rather than "does the accuser represent the values of the firm?" This could increase protection for genuine victims but could also weaponize technical accuracy to settle personal scores, stripping the complaint of its restorative function. We would lose the social pressure of "holding ourselves to the standard."

  **Consequences for Public Political Criticism:**
  Political discourse would become purely forensic. Arguments would center entirely on the consistency of the *opponent's* policies, not the *speaker's* character.
  *   **Result:** This might actually purify debate. We wouldn't waste time attacking Biden or Trump's pasts; we would only discuss their records. However, it would empower cynical strategists. A corrupt dictator could pass perfectly sound economic laws while lecturing the populace on poverty. Under the Propositional View, the people are morally bound to listen to the lectures if the economics are correct. The "Standards of the Community" dissolve into "Expertise."

  **Consequences for Moral Education:**
  This is the deepest loss. Moral education relies on **emulation** and **shared vulnerability**. If a teacher tells a child "don't hit," but hits the child, the lesson fails not because the proposition "hitting is wrong" is false, but because the *relationship of accountability* is broken. The child learns that rules apply to those who lack power.
  Abandoning the standing requirement dissolves the communal aspect of morality. It turns ethics into physics: statements that describe states of affairs, devoid of the agent's participation. We would gain efficiency (less distraction by "who said it") but lose the binding force of the norm (why obey me?).

  ### Conclusion

  The practice of discounting hypocritical blame commits us to a theory where **moral norms are reciprocal bonds of accountability, not external rules of conduct.** Blame is a mechanism that enforces these bonds, and hypocrisy breaks the bond by asserting self-exemption.

  **The Definite Position:**
  1.  **Blame is Second-Personal:** It is a request for accounting that assumes the requester is subject to the same accounting.
  2.  **Standing is Conditional on Compliance:** It is not perfect purity, but refusal to exempt oneself from the norm.
  3.  **Current Inconsistency:** We fail to properly distinguish between **professional acts** (which carry delegated authority) and **personal admonitions** (which require personal standing). We need to refine our public discourse so that politicians can advocate for clean energy policies without being judged as "hypocrites" for driving gas cars, provided they do not use the podium to personally rebuke others for the same behavior.
  4.  **Revision:** We should not abandon the stance on standing—doing so would turn moral life into mere data processing—but we must restrict its application. Hypocrisy should bar one from **reproach**, but not from **critique**. An advisor can give correct advice while failing personally, but a moralizer cannot condemn while exempting. Recognizing this distinction saves moral discourse from both cynicism and pious posturing.
