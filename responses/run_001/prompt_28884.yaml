      *   *Comparison:* Mathematicians, judges, doctors can be hypocritical but still function in their roles. Why is moral blamers different?
      *   *Key Distinction:* Moral blame seems to be *performative* or *relational*, not just descriptive. It holds someone *accountable*.

  3.  **Develop the Core Theory (The "Definite Position"):**
      *   I need to choose a robust philosophical framework. The most compelling one fitting the description is the **Relational/Strawsonian View of Blame** (influenced by Strawson, Wallace, Darwall, McKenna).
      *   *Thesis:* Blame is essentially a *demand for accountability within a moral community*. It is a second-personal claim on the wrongdoer. Hypocrisy undermines standing because it reveals a violation of reciprocity—the blamer has waived their own right to hold others to the norm they claim to enforce.
      *   *Why?* If I demand you obey rule X, but I don't, I am asserting a privilege/exemption for myself. This breaks the reciprocal bond required for legitimate holding-to-account.

  4.  **Address the Specific Questions through this Lens:**

      *   *What must blame be?* It's not assertion; it's a *challenge* or *reproof* that alters the normative relationship. Unlike math (impersonal) or medical advice (expert/dependent), moral blame presumes equality among agents. Hypocrisy asserts inequality (I'm above the rule you must follow).
      *   *What account of standing?* Standing is derived from *reciprocal compliance* with the norms of the moral community. It's not about perfection (clean hands doctrine variation), but about *fairness* and *consistency of will*. You forfeit standing by making yourself an exception.
      *   *Internal Consistency:* Where does it break?
          *   *Professional Roles:* Judges/doctors have institutional standing that overrides personal standing. They speak *ex officio*, not as private moral agents.
          *   *Severity:* A white lie vs. fraud. This suggests *proportionality*.
          *   *Inconsistency:* We often allow public figures to criticize policy without demanding total personal consistency. This suggests the theory is more nuanced than "any hypocrisy."
      *   *Alternative World (Propositional View):* If blame were just truth-telling, we'd focus solely on the argument's validity. We'd lose the emotional/relational force of resentment. We might treat bullying as "just giving information." Accountability mechanisms would weaken.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** State the thesis clearly. The practice presupposes the **Relational Authority Account of Blame**. Blame is a normative transaction, not a logical proposition.
      *   **Section 1: The Nature of Blame.** Contrast with math/science. Blame is *second-personal* (Darwall). It demands justification. Hypocrisy invalidates the demand because the demander refuses the same demand.
      *   **Section 2: The Account of Standing.** Standing comes from membership in the moral community via shared vulnerability to norms. Hypocrisy is an act of *self-exemption*. Distinguish between *systemic* hypocrisy (corruption of the norm) and *partial* failure.
      *   **Section 3: Consistency & Nuance.**
          *   *Reconcile Professional Roles:* Institutional role creates a proxy for standing. A judge speaks for the law, not themselves.
          *   *Reconcile Severity:* Minor infractions don't necessarily waive standing unless they target the specific principle (e.g., cheating at taxes doesn't waive standing to condemn murder, but might waive standing to condemn tax evasion).
          *   *Identify the Flaw:* The "Clean Hands" intuition gets applied too broadly in politics. We sometimes treat policy criticism as personal moral condemnation, which is category error.
      *   **Section 4: Consequences of Abandoning the View.** If we go propositional: We prioritize facts over relationships. "You're right, but you're a jerk" becomes irrelevant. However, this risks turning moral discourse into cold rationality, potentially empowering powerful bad actors who tell the truth. It dissolves the *social pressure* mechanism essential for moral communities.

