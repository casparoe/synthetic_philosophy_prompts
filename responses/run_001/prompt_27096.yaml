          *   Real Progress: Fragmentation of the field. Moving away from "What is Conscious?" to "Which models best predict neural correlates?"
      *   *Recommendation:* Don't look for a winner. Look for utility. Does IIT help clinical diagnostics? (It does, via PCI). Does it help philosophy? (It forces rigor).

