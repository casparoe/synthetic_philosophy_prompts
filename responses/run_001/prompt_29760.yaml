answer: |-
  # 1. Groundwork

  The traditional triad divides the *ontology* of emotion. Judgment theorists posit emotions as cognitive evaluations (propositional attitudes regarding value). Perception theorists view them as sensorimotor detections of somatic status (receptor-driven readings of allostasis). Feeling theorists argue emotions are irreducible phenomenal qualities (the raw data of experience).

  To translate faithfully into your reinforcement learning (RL) and predictive processing (PP) vocabulary, we must establish boundaries. First, we treat the agent as a single control system to avoid Cartesian splits. Second, we distinguish *algorithmic* descriptions (state representations, value functions) from *implementational* ones (neural firing patterns). Third, we must flag whenever we substitute a computational proxy (like minimizing free energy) for a phenomenological claim (feeling pain). A faithful translation cannot assume that optimizing a loss function generates a "self" to whom the loss matters. We will proceed by mapping each theory onto distinct control architectures: Model-Based inference, Interoceptive Prediction Error, and a third category reserved for the objective function’s subjective correlate, which currently lacks a formal definition in RL.

  # 2. Vocabulary map

  | Philosophical Concept | Best Computational Counterpart | Faithfulness Note |
  | :--- | :--- | :--- |
  | **Appraisal** | Latent-state inference ($p(z|o)$) regarding threat/utility. | High for structural role; low for "judgment" (no propositional content required). |
  | **Bodily Change** | Proprioceptive/Internal observation channels ($o_{body}$); Homeostatic set-points. | Direct mapping; standard sensory input stream. |
  | **Feeling** | Precision Weighting ($\Pi$) or Meta-cognitive Confidence ($c_t$). | Distorted; maps to *weight*, not *quality*. Ignores qualia. |
  | **Intentionality** | Action-value gradient conditioned on goal variable ($G$). | Functional equivalence only; lacks intrinsic "aboutness." |
  | **Valence** | Scalar Reward Signal ($r_t$) or Cost Function Term. | Strong mapping for behavior; weak for affective magnitude. |
  | **Polymorphism** | Hierarchical Policy Switching (Meta-RL). | Captures context-dependence well. |
  | **Conscious Access** | Global Workspace Broadcast / Sampling Frequency increase. | Operationalizable, but misses the "light" of awareness. |

  # 3. Judgment theories in the target vocabulary

  In your framework, Judgment Theories map to **Model-Based Planning with Latent-State Inference**. Here, emotion is not a primitive signal but a downstream consequence of hierarchical inference. When an agent observes data ($o$), it infers a hidden causal structure ($z_{threat}$). The "appraisal" that something is dangerous is simply a posterior probability distribution $p(\text{danger} | o)$ exceeding a critical threshold.

  The emotional "value" comes from the Value Function ($V(s)$). Fear occurs when the model predicts that current actions will yield terminal states with extremely negative return. Crucially, the judgment theory identifies the *computational cause* of the response. In RL terms, the "emotion" is the re-weighting of the policy network ($\pi(a|s)$) based on this updated state value. It is a model-based override of habitual behavior.

  However, there is a translation distortion. Philosophical judgments imply normative commitment ("this *is* bad"). An RL agent merely has low predicted value. I am importing the assumption that high-level value estimation constitutes a "judgment." This glosses over the fact that neural networks can represent danger without representing it *as* danger propositionally. Furthermore, this view struggles with rapid, reflexive phobias where no slow Model-Based calculation occurs. If fear bypasses the planner, the judgment theory breaks unless we admit "fast judgments" that are actually just cached Model-Free Q-values, which dilutes the concept of appraisal entirely.

  # 4. Perception theories in the target vocabulary

  Perception Theories align almost perfectly with **Interoceptive Active Inference**. Here, emotion is a perception of the agent’s own physiological parameters. In PP terms, the brain maintains a generative model predicting incoming sensory signals ($s$). However, in this architecture, the most critical sensory inputs are internal ($s_{int}$)—heart rate, cortisol levels, gut tension.

  Fear is not a computation of threat outside, but a prediction error signal generated when interoceptive inputs deviate from expected homeostatic trajectories. The emotion is the update rule attempting to minimize this surprise. The body prepares to act (increases motor gain) to satisfy the predictions about its own safety. Thus, "fear" is the readout of high-precision interoceptive prediction errors requiring immediate behavioral correction to restore the prior.

  This maps cleanly to embodied RL. However, it assumes that the "perception" of bodily change is sufficient for the phenomenon of emotion. A pure perception theorist argues the emotion *is* the feeling of these changes. In PP, the "feeling" is just the error term being minimized. I must flag a potential circularity: if the agent minimizes the error before the emotion occurs, the emotion vanishes. To save this view computationally, one must posit that the *process* of inference—the precision-weighting of the interoceptive channel—constitutes the emotion, not just the output. This risks reducing emotion to mere noise reduction, losing the urgency inherent in the theory.

  # 5. Feeling theories in the target vocabulary

  Feeling Theories pose the greatest challenge for RL vocabulary, which is fundamentally functionalist. They argue emotion is the **Qualitative Subjectivity** associated with the process, independent of its causal role. In a strict mapping, this corresponds to nothing currently defined in standard RL.

  If we force a translation, "feeling" becomes the agent's internal report or access mechanism. Perhaps it is the variance of the posterior distribution (uncertainty) or the specific precision parameter ($\tau$) modulating sensory gain. If an agent can "feel" fear, it means it possesses a meta-representation of its own alarm state. Some theorists link this to the Free Energy Principle's variational bound: the feeling is the "cost" being computed. But this is a category error. Computing a cost is not experiencing it.

  To remain faithful, I must state that "Feeling" translates to **"Objective Function Ownership."** In RL, we optimize a loss function. For the agent to *feel* the loss requires the loss function to be accessible to the policy as a variable of interest, not just a boundary condition. Current models lack a variable for "experience." Therefore, Feeling Theories, translated, suggest that standard RL is ontologically incomplete: it describes control without describing the observer of the control. This forces us to postulate an "access module" where value gradients become conscious states. Without this architectural addition, the feeling theory remains an untranslatable ghost in the machine.

  # 6. Residue report

  **Clean Translations:**
  *   **Valence as Reward/Cost:** The scalar nature of good/bad maps directly to the return function $G_t$. This is stable across all three theories.
  *   **Action Readiness as Policy Switching:** All theories agree emotions mobilize action. In RL, this is cleanly represented as a shift in policy entropy or selecting a specific sub-graph of the action space (hierarchical RL).
  *   **Latent-State Inference:** Both Appraisal (Judgment) and Internal Modeling (Perception) correspond to updating $p(z|o)$. The computational mechanics of inferring hidden danger states are agreed upon.

  **Distorted Translations:**
  *   **Normativity:** Judgment theories rely on the idea that an emotion is *correct* or *incorrect* (e.g., irrational fear). In RL, a low value estimate is just a local minimum or poor training, not an "error" in truth. I am smuggling in semantic correctness where there is only optimization fitness. This is a blind spot in RL vocabularies; they describe fit, not meaning.
  *   **Causal Precedence:** Perception theories debate whether the body causes the emotion or vice versa. In PP, cause/effect is inverted via variational bounds. This makes the philosophical causal dispute an artifact of assuming linear causality rather than recursive inference.
  *   **Intensity vs. Quality:** Feeling theories distinguish between intensity and quality (anger feels different from fear, even if intensity matches). RL typically uses scalars. Mapping "quality" to vector dimensions in the latent space is possible but implies artificial structuring not guaranteed by generic RL axioms.

  **No Counterpart (Genuine Loss):**
  *   **Qualia/Phenomenology:** The "what-it-is-like" aspect has zero counterpart. RL models predict behavior; they do not simulate subjective presence. Either this is a residual property of complex systems emergent later (blind spot in our current modeling scope) or the philosophical claim assumes a property physical systems cannot possess.
  *   **First-Person Authority:** Philosophical accounts often grant the agent privileged access to their emotions. In RL, the agent accesses state variables via noisy sensors. There is no "privileged" channel, only different sensor modalities. The distinction between private feeling and public signal dissolves.

  **Analysis of Residue:**
  The "Normativity" gap suggests RL vocabularies lack tools to handle rational evaluation, only statistical likelihood. The "Qualia" gap confirms my suspicion: Feeling theories are fighting a war against functionalism. If you accept RL as complete, Feeling theories are incoherent. If you believe Feeling theories describe reality, RL vocabulary is ontologically deficient. The "Causal" gap confirms the dispute is largely an artifact of level-of-analysis—linear causation doesn't apply to inference loops.

  # 7. Verdict

  Your suspicion holds. Approximately half the dispute is an artifact of applying linear causal logic to recursive predictive systems. Asking whether appraisal precedes physiology is like asking if forward propagation precedes backpropagation in a recurrent network—it is simultaneous equilibrium dynamics.

  However, the remaining half is substantive. The Feeling theories expose a fundamental limitation in RL: **objective functions are not observers.** Your vocabulary successfully models the control loop (judgment/perception overlap) but fails to account for the *locus* of experience. The dispute reveals that while we can model how emotions regulate behavior, we cannot yet express why regulation feels urgent to the regulator. To resolve the Feeling-theory objection, your vocabulary must grow to include a formalization of **meta-predictive access**—a mechanism that turns the minimization of free energy into a reported state of uncertainty, bridging the gap between calculating risk and experiencing fear. Until then, Feeling theories remain a placeholder for the explanatory gap in your field.
