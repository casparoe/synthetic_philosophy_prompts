  9.  **Final Polish:** Check formatting and clarity. (Proceeding to generate output based on these steps).

  *(Self-Correction Note on the "Joint Statement" aspect)*: The prompt asks for "the joint statement." It needs to read as a cohesive document signed by both. I should organize the four requirements into the structure of that document. I will title it appropriately.

