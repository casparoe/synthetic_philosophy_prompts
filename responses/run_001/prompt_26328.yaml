prompt: |-
  A friend and I spent most of Saturday evening arguing about chance and credence, and by the end he had me pinned with an argument I still cannot find the exit from. He started from two claims I thought I could comfortably hold together — that rational credence should defer to objective chance, and that objective chance is not some primitive metaphysical extra but is grounded in the actual pattern of events — and walked me step by step to the conclusion that you cannot consistently hold both. I have been turning it over since and I am stuck. Here is the argument as he laid it out, with the premises numbered.

  (1) The Principal Principle: If you know that the objective chance of some event E is x, and you possess no inadmissible information, then your rational credence in E ought to be x.

  (2) Humean Supervenience: The objective chances are not fundamental; they supervene on the total mosaic of particular, non-modal facts — roughly, the complete pattern of what actually happens throughout all of space and time.

  (3) From (2): If you were to know the total mosaic, you would thereby know the objective chances.

  (4) But if you know the total mosaic, you know whether E occurs, and so your rational credence in E should be either 0 or 1.

  (5) Now take any case where you take yourself to know the objective chance of E. By (2), that chance is fixed by the total mosaic. So your knowledge of the chance must, it seems, ultimately rest on the total mosaic — even if only indirectly. But if your epistemic situation is ultimately grounded in facts that, if known directly, would force your credence to 0 or 1, then your credence cannot rationally be x. The Principal Principle never gets a grip.

  (6) Therefore, the Principal Principle is either inapplicable in every real case (because whenever you know the chance you are in effect relying on facts that, if fully known, would be inadmissible), or it demands something impossible: that your credence be both x and 0 or 1.

  (7) But the Principal Principle is not useless. We apply it routinely: I know a fair coin has chance 1/2 of landing heads, I set my credence to 1/2, and this is paradigmatically rational.

  (8) So Humean Supervenience and the Principal Principle cannot both be true. One of them must be abandoned.

  My friend is prepared to abandon Humean Supervenience and go primitivist about chance. I am not. I think the argument must contain a mistake, but I cannot locate it precisely, and I cannot tell whether the standard moves that save both principles — if there are any — require me to pay a price I would rather not pay. Which step or inference is the problem, why did it look compelling, and what are the main strategies for resisting the argument without giving up on either Humean Supervenience or the Principal Principle? If one of those strategies is to reformulate the Principal Principle itself, I would like to know what the reformulation says and what it sacrifices.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had a debate with a friend about chance and credence.
      *   **The Problem:** The friend presented an argument (the "Best System Analysis" vs. Principal Principle tension) suggesting that Humean Supervenience (HS) and the Principal Principle (PP) are incompatible.
      *   **User's Stance:** Wants to keep *both* HS and PP (or at least thinks the argument is flawed and doesn't want to become a primitivist).
      *   **Task:** Identify the problematic step/inference, explain why it looks compelling, and outline strategies for resisting the argument without abandoning either view. Specifically asks about reformulating PP if necessary, and what the costs are.

  2.  **Deconstruct the Friend's Argument:**
      *   (1) PP: $C(E | Ch(E)=x \& K) = x$ (where K is admissible info).
      *   (2) HS: Chances supervene on the mosaic of particular matters of fact.
      *   (3) From (2): Knowing the Mosaic $\to$ Knowing Chance.
      *   (4) Knowing the Mosaic $\to$ Knowing Outcome $\to$ Credence 0 or 1.
      *   (5) If my evidence implies knowledge of the Mosaic (even indirectly), PP shouldn't apply.
      *   (6) Conclusion: In real cases, we can't use PP consistently with HS, or it demands impossible credences.
      *   (7) Observation: We *do* use PP routinely.
      *   (8) Contradiction: HS + PP $\to$ Impossible.

  3.  **Identify the Core Issue:**
      *   This is the famous "Humpty Dumpty Argument" or the conflict between Lewis's Humean Supervenience (specifically his Best System Analysis of chance) and his own Principal Principle.
      *   David Lewis himself acknowledged this problem (it's often called the "Undermining Problem").
      *   The core tension is: Future outcomes determine chances (via HS/BSA), but chances constrain beliefs about future outcomes (via PP). If the future determines the chance, and the current chance constrains belief in the future, isn't there a loop?
      *   More specifically: The information about the *chance* itself might count as "inadmissible" information under strict interpretations because knowing the exact chance (derived from the total history including the future event) gives you information about whether the event happened.
      *   *Key Step to Attack:* Premise (5) and (6). They conflate *knowing* the chance via theory with *knowing* the underlying facts that fix the chance (especially the future facts that constitute the outcome).
      *   *The "Undermining" Issue:* A specific sequence of coin tosses could make the best system report a different chance than expected. If I know the chance is 1/2, does that entail I know the specific sequence won't undermine that chance? Yes. But do I know the specific sequence? No.

  4.  **Evaluate Potential Solutions/Reformulations:**

      *   **Solution A: Refine Admissibility (Lewis's later move).**
          *   Distinguish between knowing the chance proposition and knowing the full mosaic.
          *   Information is inadmissible only if it concerns the future. Chance is in the present (relative to the event).
          *   Problem: Under HS, chance depends on the *whole* history, including the future event E. So $Ch_t(E)$ depends on whether $E$ happens. Knowing $Ch_t(E)=x$ tells you something about $E$. Thus, chance info is partially inadmissible regarding $E$.
          *   Lewis tried to solve this by saying PP applies to *propositions* about chance, not raw access to the mosaic. But the math gets tricky.

      *   **Solution B: Reformulate the Principal Principle (Hall, Thau, Hoefer, etc.).**
          *   Lewis's original PP: $C(E|Ch(E)=x \& T) = x$ ($T$ = complete history up to $t$).
          *   Issue: $T$ includes no future info, but Chance depends on the whole future (under HS).
          *   New PP (e.g., Ismael's "H-Principle" or Hall's version): $C(E|Ch(E)=x \& History(t)) = x$.
          *   Actually, the most robust solution comes from Joyce Ismael or Barry Loewer.
          *   *Ismael's Solution:* The "Future Conditional" constraint. You have to acknowledge that your credence about the chance depends on your credence about the future outcome.
          *   *Loewer's Solution:* Treat laws/chances as part of our epistemic framework rather than just descriptive. Or modify PP to allow "best system" chances to function as guides for uncertainty despite metaphysical dependence.

      *   **Solution C: The "Inadmissibility" Restriction.**
          *   Argue that while the *facts* that ground the chance include the future event, the proposition "$Ch(E)=x$" is not itself inadmissible information about $E$.
          *   Why? Because "Chance" is defined as the probability distribution in the best system. It summarizes the pattern but doesn't pinpoint the individual atomistic event directly in a way that violates the principle.
          *   Wait, Lewis's own diagnosis was "Undermining." He admitted standard PP is too strong. He proposed the **New Principal Principle**.
          *   *New Principal Principle:* $C(A | Ch(A)=x & \text{Everything else}) = x$ is wrong if "Everything else" rules out certain future histories compatible with $Ch(A)=x$.
          *   Corrected formulation: $C(A | Ch(A)=x) = x$ provided the background info is admissible relative to the time.
          *   Crucially: Knowledge of the chance is *not* knowledge of the future outcome. Even though the chance supervenes on the outcome, you cannot derive the outcome from the chance alone. Many different mosaics support the same best-system chance.

  5.  **Drafting the Response:**

      *   **Acknowledge the difficulty:** Validate that this is a famous philosophical puzzle (Lewis's Undermining Problem).
      *   **Pinpoint the flaw:** Step (5) and (6) are the weak points. The inference that knowing the chance grounds credence in the specific outcome (forcing 0/1) conflates metaphysical determination with epistemic accessibility.
      *   **Explain why it looks compelling:** Under HS, chance depends on the future. So knowing the chance seems to imply knowing the past/future configuration enough to rule out some worlds.
      *   **Strategy 1: Clarifying Admissibility (Lewis's Later View).** The distinction between knowing the *probability* of an event and knowing the *outcome*. While chance supervenes on history, it doesn't track individual events perfectly. Multiple histories yield the same chance. Therefore, knowing the chance doesn't tell you *which* history you are in.
      *   **Strategy 2: Reformulating the Principal Principle (The "New PP").** Lewis realized his original PP was strictly incompatible with HS. He offered a modified PP where admissibility is indexed to the time and acknowledges that chance info contains implicit info about the future (underminers).
          *   Formula: $C(A | Ch_{t}(A)=p \& E) = p$, where E is history up to t.
          *   Cost: You lose the idea that chance info is *always* sufficient to set credence. You need history constraints.
      *   **Strategy 3: Best System Interpretation (Loewer/Hoefer).** Emphasize that chances are summary statistics. A summary statistic doesn't give you the data points back. Knowing the average height doesn't tell you John's height. Similarly, knowing the "best fit" law doesn't tell you the specific toss result.
      *   **Addressing the User's "Costs":**
          *   If keeping PP strict: Need to deny that Chance info counts as "knowledge of the mosaic" in the relevant sense (epistemic opacity).
          *   If modifying PP (New PP): Cost is slightly less elegant, admits that chance info is partially self-undermining.
          *   Most popular Humean response: Modify PP to restrict admissibility to *past* and *present* info, acknowledging chance reports don't grant access to the future.

  6.  **Refining the Logic (Self-Correction/Nuance Check):**
      *   *Wait, is Step 3 valid?* "If you were to know the total mosaic, you would thereby know the objective chances." Yes, assuming HS + definition of chance.
      *   *Is Step 4 valid?* "But if you know the total mosaic, you know whether E occurs...". Yes, trivially.
      *   *Where is the break?* Step 5: "your knowledge of the chance must... ultimately rest on the total mosaic". This is the equivocation.
      *   You can know $Ch(E)=x$ *without* knowing the Total Mosaic. In fact, you almost never know the Total Mosaic. You infer the chance from limited data.
      *   But the friend argues: *Because* chance depends on the mosaic, any justification for believing the chance exists relies on beliefs about the mosaic. If those beliefs were *certain*, they'd force 0/1. Since they aren't certain, PP holds.
      *   *Crucial Insight:* The incompatibility arises specifically when considering **Undermining Futures**. A future history that makes the chance 1/2 look unlikely, but if it happens, it makes 1/2 the true chance. If I assign high credence to the chance being 1/2, and low credence to the undermining history, am I consistent?
      *   *The Fix:* The Principal Principle needs to be sensitive to the possibility of "undermining futures." The New Principal Principle (NPP) handles this by conditioning on the entire past, not just the chance hypothesis.

      *   *Alternative Approach:* The "Epistemic Gap" strategy. Just because $X$ metaphysically determines $Y$ doesn't mean knowing $Y$ gives you access to $X$.
      *   Example: Mass determines gravity. Knowing gravity doesn't let you calculate mass perfectly without other constants.
      *   Better: Temperature supervenes on molecular motion. Knowing temp=20C doesn't tell you the motion of every molecule.
      *   Analogy: Chance supervenes on events. Knowing Chance=0.5 doesn't tell you which specific coin flipped heads. (This is the strongest defense for the user).

  7.  **Structuring the Answer:**
      *   **Introduction:** Acknowledge this is the "Undermining Problem" identified by David Lewis. Show respect for the friend's grasp of the material.
      *   **Diagnosis:** The error is in (5) and (6). Conflation of metaphysical grounding with epistemic access.
      *   **Why it feels compelling:** The temptation to think the "basis" of the truth-maker must be known to the knower.
      *   **Strategy 1: Epistemic Opacity (The "Statistical" Defense).** Knowing the chance is like knowing the mean; it doesn't reveal the data. The chance *supervenes* on the data, but the data is many-to-one.
      *   **Strategy 2: Revising Admissibility (Lewis's Move).** The Original PP is technically false for Humeans. Adopt the New PP. Explain what it changes (conditions on history) and the cost (slightly more complex formula).
      *   **Strategy 3: Best System Analysis Nuance.** Chance is a summary. Summaries don't encode specifics.
      *   **Conclusion:** Recommendation. Keep HS. Modify PP slightly to account for "underminers" (or rely on the Many-to-One mapping defense).

  8.  **Final Polish:** Ensure tone is collaborative but rigorous. Use clear examples (coin tosses). Define terms clearly (Admissibility, Undermining). Make sure to address the specific question about reformulation and its price. (Price: Loss of absolute generality of PP).

  *(Self-Correction during drafting)*: I need to be careful with Lewis's "New Principal Principle." Lewis eventually accepted that the original PP was inconsistent with HS. He proposed a revision where you condition on the history up to now ($H_t$). The crucial point is that $Ch(E)$ depends on the whole future ($H_{\text{total}}$). $H_t$ blocks the knowledge of the future part of the mosaic. So, as long as I only condition on $H_t$ (my actual epistemic situation), I don't have the "inadmissible" future info. My friend's argument assumes that *just knowing the chance* gives me access to the future part of the mosaic. That is the false step. I must articulate that knowing $P$ (chance) does not entail knowing $M$ (mosaic) even if $M$ fixes $P$.

