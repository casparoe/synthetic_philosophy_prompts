  5. Summary of Costs.

  Let's refine Strategy 1. The friend says "If you know the chance, you must rely on facts that force 0/1." Counter: "I rely on facts (current evidence) that suggest the chance, but I do not possess the facts that *fix* the chance fully." The "reliance" is probabilistic, not deductive. The friend's Premise (5) claims a dependency that creates a contradiction. The rebuttal is that the dependency is non-deducible.
