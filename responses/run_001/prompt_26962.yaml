          3.  Disagreements Table (Cruxes + Concrete Experiments/Manipulations + Predictions).
          4.  Note on verbal disputes.
      *   **Tone:** Academic, rigorous, collaborative but honest about remaining differences.

  2.  **Deconstruct the Positions:**
      *   *Conceptual View (Knobe et al.):* The folk concept of intentional action *includes* normative evaluation. You can't judge intention without knowing if it was good or bad. It's not an error; it's how the concept works.
      *   *Deflationary View (Machery, Feltz, Sripada, etc.):* The asymmetry is noise. People mean something different by "intentional" in these contexts (e.g., blameworthiness vs. mere agency). Or, it's pragmatic (Gricean implicature). Or, it's emotional bias. The "true" concept doesn't care about morality; the experiment reveals processing quirks, not conceptual structure.

  3.  **Drafting Section 1: Shared Claims (The Common Ground):**
      *   Need to agree on the phenomenon first. Both agree the effect exists robustly under standard conditions.
      *   Need to agree on what the experiment *doesn't* prove (that one side is just wrong in the colloquial sense).
      *   Need to agree on constraints for a theory (must explain the asymmetry, must account for variance).
      *   *Idea:* Acknowledge that moral valence correlates with intentionality ratings.
      *   *Idea:* Acknowledge that "intentional" is a complex word used in many ways.
      *   *Idea:* Agree that the executive's mental states (desire/belief) are held constant across conditions.
      *   *Refining:* Avoid saying "Morality changes the concept." Instead, say "Normative information affects intentionality judgments." That allows Deflationists to interpret this as interference and Conceptualists as constitutive.
      *   *Drafting points:*
          1.  Replication of basic asymmetry.
          2.  Control over causal/mental state variables.
          3.  Influence of normative valence on outcome.
          4.  Agreement that context matters (we don't speak in a vacuum).
          5.  Need to distinguish between *competence* (what we mean) and *performance* (what we say).

  4.  **Drafting Section 2: Residual Disagreement:**
      *   Must be precise.
      *   *Conceptualist stance:* Normativity is constitutive of the concept.
      *   *Deflationist stance:* Normativity distorts the application of a norm-free concept.
      *   *Phrasing:* Focus on "Is the normative sensitivity a feature of the cognitive representation of agency, or a modulation of judgment during retrieval/application?"
      *   *Wording:* Ensure neither feels attacked. Use terms like "constitutive role" vs. "systematic bias."

  5.  **Drafting Section 3: Disagreements Table (Cruxes & Predictions):**
      *   Need specific experimental manipulations that separate the two views.
      *   *Crux 1: Moral Luck / Irrelevant Immorality.* If the action itself is immoral but neutral regarding the side effect?
      *   *Crux 2: Expert vs. Novice Judgment.* Do philosophers disagree more or less than laypeople? (This tests expertise vs. folk competence).
      *   *Crux 3: Alternative Causal Structures.* What if the harm is *not* foreseen? (Tests belief requirement).
      *   *Crux 4: Framing/Pragmatics.* Asking "Did he do X on purpose?" vs. "Was X intended?" (Linguistic nuance).
      *   *Prediction formulation:* Be explicit about probability/thresholds.
      *   *Selection:*
          1.  *Irrelevant Bad Character:* Does a villainous CEO change intentionality if the side effect is good? (Tests moralizing generalization).
          2.  *Indeterminacy/Bet:* Changing the certainty of the outcome.
          3.  *Linguistic Substitution:* Replacing "intentionally" with "did he mean to".
          4.  *Neuroscience/Pupil Dilation (Optional but maybe too speculative).* Let's stick to behavioral experiments.
          5.  *Blame Priming:* Make people think about punishment before judging intent.

      *   *Wait, let's look closer at the core theoretical divide.*
      *   *Test 1: The Blame-Independence Test.* Can we find conditions where people blame the agent but *deny* intentionality? Or vice versa? (Conceptualists say they track together closely; Deflationists say they diverge when norms are decoupled).
      *   *Test 2: The Expertise Effect.* Do trained philosophers remove the asymmetry? (Conceptualists might say norms still apply to experts; Deflationists might say expertise cleans up the noise).
      *   *Test 3: Cross-Cultural Variation.* Is the effect universal or culturally specific to Western individualism/norms?
      *   *Let's pick the strongest empirical cruxes.*
          1.  **Decoupling Blame from Intentionality:** Manipulate punishability independent of the action's outcome.
          2.  **Causal Salience:** Manipulate whether the side effect is the *reason* for the action (which Knobe says doesn't matter) vs. accidental. Wait, Knobe keeps the desire for profit constant. Let's try: **Moral Neutrality.** A scenario where there is no moral valence possible (e.g., choosing a color for a shirt). Conceptualists predict asymmetry vanishes. Deflationists predict asymmetry persists if other biases exist, or also vanishes. Actually, better: **Non-Moral Norms.** Violating etiquette vs. violating law.
          3.  **Priming:** Priming participants to focus on "mechanism" vs. "accountability."

      *   *Decision:* I will select three high-stakes cruxes:
          1.  The "Blame/Intent Decoupling": Can we make someone blameworthy but their action judged non-intentional?
          2.  The "Alternative Norms" Test: Replace moral norms with conventions (etiquette rules).
          3.  The "Expertise/Culture" Test: Are the asymmetries robust across populations who understand "intent" differently?

  6.  **Drafting Section 4: Verbal Dispute Note:**
