      *   Need to flag that "concept" might mean different things (cognitive file vs. normative rule).

  7.  **Review and Refine:**
      *   Check tone: Is it adversarial collaboration style? Yes.
      *   Check Section 1: Are claims non-vacuous? E.g., "Both believe the data shows X" is stronger than "We discuss the data."
