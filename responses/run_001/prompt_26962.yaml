answer: |-
  # Joint Statement on the Structure of Folk Intentionality Judgments
  **Result of Adversarial Collaboration Between Conceptualists and Deflationists**

  **Date:** October 26, 2023  
  **Status:** Ratified by Signatories  

  ## I. Shared Claims and Constraints
  Both parties agree to the following substantive assertions regarding the Knobe effect phenomenon and the parameters of a satisfactory theory. These claims are accepted regardless of the theoretical interpretation offered in Section II.

  1.  **Replicability of the Baseline Phenomenon:** Under the standard "Chairman Vignette" design, where causal structure and mental states (belief/desire) are held constant, the proportion of subjects affirming that the side effect was brought about *intentionally* is significantly higher when the side effect is harmful than when it is beneficial. This statistical difference is robust and replicable across diverse sampling frames.
  2.  **Invariance of Mental State Descriptions:** In the baseline design, the vignettes explicitly control for the executive’s stated desires regarding the side effect. Subjects report understanding that the executive does not care about, nor desire, the side effect in either condition. Therefore, any explanatory model must account for how identical explicit mental state reports yield divergent intentionality judgments.
  3.  **Distinction Between Competence and Performance:** Both sides acknowledge a distinction between the underlying cognitive representation of agency ("competence") and the real-time output of judgments given to a survey item ("performance"). Neither party claims that the observed survey response is necessarily a perfect, frictionless transcript of the subject’s internal cognitive state.
  4.  **The Necessity of a Single Explanation:** While mechanisms may differ, a complete theory must explain the directionality (Harm > Help), magnitude, and boundary conditions of the effect within a unified framework. An explanation that predicts the asymmetry only for "harm" but not the lack thereof for "help" is insufficient.
  5.  **Normative Information Availability:** Both parties accept that normative information (moral valence) is available to subjects in the vignette. No acceptable theory posits that subjects fail to notice or read the words describing the environmental impact.
  6.  **Exclusion of Random Error:** Both parties reject the hypothesis that the effect is merely measurement noise or statistical fluctuation. The pattern is non-random, systematic, and responsive to manipulation.

  ## II. Statement of Residual Disagreement
  Despite the shared commitments above, the parties remain divided on the locus of the normative influence. The disagreement concerns whether moral consideration constitutes the *definition* applied to the case, or acts as an *interference* during the application of a definition.

  *   **The Conceptual View Proponents affirm:**
      Normative evaluation is a *constitutive input* to the folk concept of intentional action. To apply the predicate "intentionally" correctly, an agent’s normative standing relative to the outcome is partially definitional. Thus, the judgment in the Harm condition is a valid reflection of the concept itself, not an error introduced by irrelevant features.
      
  *   **The Deflationary View Proponents affirm:**
      Normative evaluation is a *systematic interference* affecting the retrieval or application of a concept that is fundamentally non-normative. The judgment in the Harm condition reflects a contamination of the target judgment by blameworthiness assessments or conversational pragmatics, rather than revealing the true structure of the concept of intentional action.

  ## III. Disagreements Table
  The following table identifies specific empirical cruxes designed to adjudicate between the positions in Section II. For each crux, both sides provide a prediction prior to data collection.

  | Crux | Proposed Experiment/Manipulation | Prediction by Conceptual View | Prediction by Deflationary View |
  | :--- | :--- | :--- | :--- |
  | **1. Scope of Norms**<br>Does the effect generalize to non-moral violations? | Replace the Environmental Regulation violation with a violation of *Technical Protocol* (e.g., failing to follow filing codes) that carries no moral weight but involves breaking a clear rule. Keep "Harm" (financial loss) vs. "Help" (profit gain) valence constant. | **Effect Persists.** Since the Conceptual View treats norms generally, violating a salient rule should trigger an intentional judgment asymmetry even if the norm isn't strictly "moral," provided the violation is treated as a social negative. | **Effect Weakens/Disappears.** The Deflationary View links the effect to blame/punishment. Technical violations usually lack moral blame. Without blame, the interference should drop, narrowing the asymmetry gap compared to moral harms. |
  | **2. Decoupling Blame and Intent** | Present a scenario where the executive causes significant harm due to negligence but explicitly promises not to cause it (Good Character/Virtue signaling), yet still negligently causes harm. Assess if "blame" ratings and "intent" ratings correlate. | **Correlation Holds.** Intentionality judgments track normative responsibility. Even if the agent meant well, causing a bad outcome while negligent should retain some degree of intentionality due to the negative outcome. | **Divergence Possible.** Subjects can distinguish between being liable/blameworthy for negligence and intentionally bringing about a result. High blame scores should occur alongside low intentionality scores. |
  | **3. Linguistic Specificity**<br>Is "Intentionally" ambiguous? | Compare standard "Did he bring about this effect **intentionally**?" against a phrase less loaded with moral implication, such as "**On Purpose**" versus "**With Deliberation**." | **Consistency.** All variants tap the same underlying concept. The asymmetry should appear across all phrasings because the normative input enters the reasoning process regardless of synonym selection. | **Dissociation.** Phrases like "deliberately" or "on purpose" should show reduced asymmetry compared to "intentionally." If the effect is driven by moral pragmatics attached specifically to the word "intentional," semantic substitution should mitigate the noise. |
  | **4. The "Reasoning" Intervention** | Before asking the question, ask subjects to justify *why* they made their decision using specific criteria (e.g., "Check boxes for: Desire, Belief, Outcome Value"). | **Persistence.** Normative inputs are integrated early in cognition. Explicitly listing criteria will not wipe out the intuitive integration of value into the concept. | **Reduction.** Making subjects explicitly attend to the mental-state components (Desire/Belief) will reduce the reliance on heuristic shortcuts (like blame), thereby reducing the asymmetry. |

  ## IV. Note on Verbal Disputes
  The parties acknowledge that a portion of the historical difficulty in this debate stems from terminological variance regarding the word **"Concept."**

  1.  **Folk Competence vs. Idealized Definition:** Disputes sometimes arise because Conceptualists treat the aggregate pattern of lay judgments as the "concept" (a descriptive psychological reality), whereas Deflationists often appeal to a prescriptive notion of what the concept *should* be (a philosophical analysis free from pragmatic noise). We agree to bracket this distinction for future data analysis: the data describes how speakers *use* the word; the theory describes what mechanism generates that usage.
  2.  **"Intentional":** There is ambiguity regarding whether "intentional" functions as a single lexical item with one meaning, or a polysemous cluster. Deflationists are more inclined to argue for polysemy (one meaning for actions, another for outcomes); Conceptualists tend to view it as unitary. Future work requires psycholinguistic testing to determine if subjects switch definitions or maintain one definition with variable criteria.

  ***

  **Signed,**
  *Proponents of the Conceptual View* \t\t\t\t *Proponents of the Deflationary View*
