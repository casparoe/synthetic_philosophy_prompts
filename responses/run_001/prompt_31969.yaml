          *   Key distinction: *Evidence vs. Overwhelming Compulsion.* Seeing a pillar of fire proves power, but does it reveal the *heart* of God?
      *   **Why Philosophers Still Discuss It:**
          *   It captures an intuition about "relationship." We don't want robots programmed to love us.
          *   It distinguishes between *belief that* (propositional) and *trust in* (relational).
