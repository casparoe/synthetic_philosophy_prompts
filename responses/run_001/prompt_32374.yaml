  *(Self-Correction on the Note)*: I need to be careful not to simply say "this is wrong." The prompt asks to identify liberties. A common liberty is treating "knowledge" as requiring strict causal contact. Many contemporary epistemologists allow for externalist accounts of knowledge that fit epiphenomenalism better. I should mention that in the note.

