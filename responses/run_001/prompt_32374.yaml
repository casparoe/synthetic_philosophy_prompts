          *   *Defense strategies:*
              *   Causal theory of knowledge isn't mandatory (correlation/co-variation might suffice).
              *   Distinction between the act of judging (physical brain state) and what is judged (the quale).
              *   Argument from Evolutionary Mismatch or specific neural architectures where the experience accompanies the mechanism without driving it.
      *   **Sam (The Critic):** Needs to deploy the "Paradox of Phenomenal Judgment" (often associated with David Chalmers or Daniel Dennett's critiques, though specifically articulated by Block, Robinson, etc.).
          *   *Argument:* Knowledge requires a reliable link. If qualia play no causal role in producing belief states about qualia, the reliability is accidental unless explained physically. But then why posit qualia at all?
          *   *Pushback:* Challenge Covariation accounts. Challenge the distinction between act and content.

  3.  **Drafting the Dialogue - Section by Section:**

