      *   *Round 2 (Maya's Defense - Etiology vs. Content):* Maya argues the *state* of knowing is physical. The *qualia* just rides along. It's like a dashboard light indicating engine trouble; the light doesn't fix the engine, but the sensor does.
      *   *Round 3 (Sam's Counter - Reliability):* Sam attacks the correlation. Why trust the correlation if the phenomenon itself is idle? If I could say "I see red" even if I didn't see red, the connection is suspicious. He brings up the "Causal Theory of Knowledge."
      *   *Round 4 (Maya's Counter - Question Begging):* Maya argues Sam assumes a causal theory of knowledge which epiphenomenalists reject. We can use counterfactual dependence or naturalistic covariance.
      *   *Round 5 (Sam's Pushback - Access Problem):* Sam presses on "Access." Even if there's a correlation, how does *she* access the justification? She thinks she knows because she feels it, but she admits feeling doesn't drive the thought.
