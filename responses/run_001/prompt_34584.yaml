answer: |-
  Based on your detailed verdicts, I have extracted a governing principle that aligns with professional software engineering standards. This principle captures the underlying logic of your concerns without requiring a philosophy degree to apply.

  ### The Principle: The Maintenance-Traceability Standard

  **Definition:** You are ethically and professionally permitted to use AI tools to reduce effort (labor) or bridge knowledge gaps (learning), provided that you retain the **cognitive traceability** required to maintain, debug, and defend the system’s logic in the event of failure. You may exempt yourself from this rule *only* when you formally delegate that logic to a **third-party, audited authority** (e.g., a mature library) where the trust is placed in the entity behind the code, not the code itself.

  **In simpler terms:** You can delegate the *typing* and the *search*, but you cannot delegate the *reasoning* regarding how the system behaves—unless you are importing a "black box" that comes with its own warranty and support structure.

  ---

  ### Applying the Principle to Your Cases

  #### 1. The SQL Report Case (The Ambiguous One)
  **Verdict:** **Not Fine.**
  **Reasoning:** Under the Maintenance-Traceability Standard, the SQL query is **custom logic**, not an external dependency. While you understand the *business requirement* (the question), you do not understand the *implementation logic* (the query).
  *   **Why:** If the report yields incorrect numbers due to a logic error in the join conditions or aggregation, and you cannot audit the query to find the bug, you have broken your traceability. Unlike the cryptography library, no third party stands behind this SQL; you own it.
  *   **Resolution:** To make this "Fine," you would need to verify the output through multiple distinct queries or a manual spot-check of the raw data, or ask the AI to *explain* the logic line-by-line until you can verbally articulate why it works. If you cannot understand the `JOIN` strategy it chose, it is technically identical to your "AI-generated parser" verdict.

  #### 2. The Legacy Codebase Translation Case
  **Verdict:** **Strictly Not Fine.**
  **Reasoning:** This represents a catastrophic failure of the Maintenance-Traceability Standard at a team level.
  *   **The Problem:** Even if the code runs, "no one on the team can yet read it" means the organization's collective cognitive capacity for that codebase is zero. You have created a "Black Box Monolith."
  *   **The Risk:** Any future change requires guessing or running full regression suites without knowing *what* broke. This compounds technical debt instantly.
  *   **How to Fix:** Use the LLM for the translation, but enforce a mandatory **"Human-in-the-Loop Read-Through."** The translated code must be reviewed and refactored to be readable by a senior engineer *before* merge. The AI can translate syntax, but it cannot assume maintenance responsibility.

  ---

  ### Consistency Check: Which Reactions Have to Go?

  To answer your specific request: **There are no firm verdicts in your list that the principle cannot accommodate,** provided you resolve the SQL ambiguity. Your intuition on the cryptography library vs. the parser is correct and is the linchpin of the principle.

  *   **The Cryptography Library (Fine):** This fits the **Third-Party Authority** exception. You treat the library as a utility, like a power supply. You don't know how electricity flows inside the transformer, but you trust the utility company's regulation.
  *   **The Parser (Not Fine):** This is **Custom Logic**. There is no "utility company." You are the owner. If the power supply malfunctions, the vendor calls you; if the parser malfunctions, the product manager calls *you*.

  **The Only Necessary Adjustment:**
  Your only "reaction to go" is the lingering hope that the **SQL case** might be permissible merely because it is "just a report."
  *   **Why:** Reports often drive business decisions. If the SQL contains a subtle logic error (e.g., missing a date filter, double-counting transactions), the downstream cost is higher than a UI bug. Treating it as less risky than the parser is an inconsistency. By applying the Maintenance-Traceability Standard, you must align the SQL verdict with the Parser verdict: **If you cannot trace the logic, you cannot take responsibility for it.**

  ### Summary of the Shift

  | Scenario | Old Hesitation | Principle-Based Verdict |
  | :--- | :--- | :--- |
  | **Crypto Lib** | Is it cheating not to know internals? | **Fine** (Trusted External Dependency). |
  | **Boilerplate** | Is it lazy to use autocomplete? | **Fine** (Verified Labor Saving). |
  | **AI Parser** | It works, so why worry? | **Not Fine** (Lost Logic Traceability). |
  | **Code Review** | Trusting the tool's advice? | **Not Fine** (Blind Trust in Logic Change). |
  | **Framework** | Skipping official docs? | **Fine** (Competence Proven by Building). |
  | **SQL Query** | It's just a query, right? | **Not Fine** (Owning Logic without Understanding). |
  | **Legacy Translate**| It works, let's save time. | **Not Fine** (Team-wide Loss of Capability). |

  **Conclusion:**
  Your instincts are sound. The dividing line is not "Do I know how it was written?" but rather **"Am I the last line of defense against its failure?"** If the answer is yes (as in the Parser, SQL, and Legacy cases), you must be able to explain it. If the answer is no (as in the Cryptography case, where the library maintainer is the defense), you can safely remain ignorant.
