  ### Commentary on the choices made

  The pantoum’s recursive structure forces the reader to inhabit the spectator’s psychological loop: lines repeat not as decoration, but as intrusive memories that cannot be fully dismissed. Line 1 (*“I promised I would walk away”*) begins as a pre-meditated resolution of safety but returns in the final stanza as a broken vow, undermining the “safe distance” solution. Similarly, Line 3 (*“Why pay to watch the world break?”*) shifts from a rational critique of utility to an existential confession of compulsion when it closes the poem.

  Line 11 (*“I hold the keys to walk right out”*) engages the position that aesthetic pleasure relies on the security of voluntary exit; however, the surrounding context (*“No barrier saves the shaking hand”*) suggests this control is illusory or irrelevant to the compulsion felt. The physicality of *“inhale the smoke and salt”* evokes the conversion thesis—that painful feelings are metabolized into value—but refuses to name the mechanism, leaving it ambiguous whether the poison is purifying or destructive.

  The final couplet deliberately avoids resolution. By juxtaposing the failure of the initial promise with the reopening of the initial question, the form enacts the paradox itself: the spectator is trapped between the horror they claim to reject and the necessity they cannot name. The machinery ensures that even the solution of “it is just play” (L7) is immediately complicated by the visceral reaction it precedes (L8-L10). The class is thus positioned not to solve the puzzle, but to dwell in the unsettled recursion of the human response to represented suffering.
