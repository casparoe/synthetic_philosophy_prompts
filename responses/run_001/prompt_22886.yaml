answer: |-
  Thirty-five years in a classroom is a long time to listen. For those of you who walked into Room 304, you know exactly what that meant.

  When I think of my mother, I don’t picture her making grand decisions about how to act. I picture her simply acting. There was no calculation in the way she stayed after the bell rang. She didn't look at the clock and decide, "Yes, I will remain for this student today." The clock mattered less than the child. The work remained unfinished until the person sitting across from her felt seen.

  There is a temptation in moments like this to measure her life as a series of choices. To say she *chose* to be patient with the difficult student. To say she *decided* to read poetry aloud when the room was restless and noisy. But I want to offer something deeper than that today.

  To attribute her goodness to a choice is to suggest there was another version of her that could have refused. And I do not believe there was. Her kindness wasn't a wall she built brick by brick; it was the air she breathed and the atmosphere she kept for all of us.

  Some people walk into a room and make it smaller, tighter, more serious. She walked into a room and made the space larger. She made it safe enough for seventeen-year-olds to admit they were afraid, or confused, or struggling. When you grow up in a house where that kind of steadiness exists, or a school where it exists, you stop waiting for the other shoe to drop. You stop worrying that you have to perform to deserve love. You just know it is there, like gravity.

  And that is why we gather here, to thank the gravity.

  It is easy to feel like we owe someone who helps us. We feel we must repay the debt. But you cannot repay a lightbulb for lighting up a dark room. You can only enjoy the illumination, and then use your own hands to build something in the light. That was the gift she gave us without asking for anything back. She did not teach us so that we would admire her. She taught us because teaching was simply the shape her life took.

  To her former students: Think of the quiet moment she let you cry before you could speak. Think of the red pen on your paper that corrected the grammar but saved the meaning. Think of the times she listened to a story you knew nobody wanted to hear. Those weren't transactions. They were manifestations of who she was, offered freely to the world.

  There is no way to separate her soul from her actions. They flowed together, as naturally as a river flows to the sea. And while we cannot control where a river comes from, nor can we command it to run faster or slower, we can stand on the bank and acknowledge the water that cooled our feet.

  My mother’s life was not a report card. It was not a score of points earned by trying harder than anyone else. It was a landscape. It was a place where things grew well. We are not standing here to judge whether she did enough work to be good. We are standing here because the soil she tended is fertile, and we—the students, the family, the friends—are the harvest.

  So, we do not mourn the loss of effort. We mourn the loss of the presence. We miss the specific quality of attention she paid to the world. And that quality remains. It is in the patience you show your children, the way you listen when a colleague is struggling, the habit of staying late just to finish a sentence.

  These things live on because they were caught from her. They were passed like a lantern hand-to-hand through thirty-five years of hallways. She did not have to choose to give it to us. She simply gave it, because that was the light she carried. And now, we hold it.
