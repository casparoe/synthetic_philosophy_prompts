  # Joint Statement on the Status of the Continuum Hypothesis
  **Workshop on the Foundations of Set Theory**  
  **Date:** October 26, 2023  
  **Parties:** Representing Camp A (Determinant Truth / Universe View) and Camp B (Indeterminacy / Multiverse View)

  ## Preamble
  In the spirit of adversarial collaboration, the undersigned representatives of Camp A and Camp B submit this joint statement. We recognize that while we hold divergent views on the metaphysics of the set-theoretic universe, our shared commitment to mathematical rigor allows us to delineate precisely where we stand together, where we fundamentally disagree, and what evidence would shift our respective positions.

  ---

  ## Part 1: Points of Consensus
  The two camps jointly affirm the following claims:

  1.  **Formal Independence:** The standard Zermelo-Fraenkel set theory with Choice (ZFC) neither proves nor refutes the Continuum Hypothesis (CH). Specifically, Paul Cohen’s method of forcing combined with Kurt Gödel’s constructible universe ($L$) establishes that $\text{Con}(ZFC + CH)$ and $\text{Con}(ZFC + \neg CH)$ hold simultaneously, assuming the consistency of ZFC.
  2.  **Nature of Independence:** This independence result is a syntactic property of the ZFC axiom system. It does not logically entail that CH lacks a truth value in any specific intended structure, nor does it logically entail that such a structure is unique or non-existent.
  3.  **Role of Large Cardinals:** Both camps acknowledge that Large Cardinal axioms constitute a coherent, fruitful extension of the ZFC framework. Even if the justification differs, these axioms organize the landscape of consistency strength and resolve questions independent of ZFC (e.g., Projective Determinacy).
  4.  **Utility of Forcing Axioms:** Camp A acknowledges that forcing axioms (like PFA or MM) generate powerful results in descriptive set theory and topology. Camp B acknowledges that these axioms impose useful structural coherence on models of set theory, even if they do not describe a unique absolute reality.
  5.  **Criteria for Progress:** Both camps agree that resolving the status of CH is not required for set theory to advance. However, "progress" toward a resolution would be marked by:
      *   A compelling argument for or against a specific candidate new axiom.
      *   An increase in mathematical power (e.g., settling singular cardinal arithmetic) correlated with the resolution of CH.
      *   Clarification of the logical relationship between maximality principles and the size of the continuum.

  ---

  ## Part 2: Disagreements Matrix

  | Issue | Camp A Position (Universe/Determinant) | Camp B Position (Multiverse/Indeterminate) | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Ontology of $V$** | There is a single, maximal, absolute universe $V$. All sets exist in this unique cumulative hierarchy. | There is no single universe $V$. There exists a multiverse of distinct set-theoretic realities, each a valid model of ZFC. | **Substantive** (Metaphysical commitment regarding mathematical objects.) |
  | **Truth Value of CH** | Because $V$ is unique, CH has a definite, objective truth value (either true or false), regardless of our current inability to derive it from ZFC. | Because the multiverse contains models where CH is true and models where CH is false, CH is not a decidable proposition across the totality of reality. It is model-relative. | **Substantive** (Derives directly from the ontology of $V$.) |
  | **New Axioms** | New axioms must be justified by **truth** (they reflect intrinsic properties of $V$). Their goal is to recover $V$'s lost features. | New axioms are justified by **utility** and **consistency**. Their goal is to explore fruitful regions of the multiverse, not to isolate a single "correct" one. | **Mixed** (Verbal in terms of "validity," Substantive in terms of research priorities.) |

  ---

  ## Part 3: Cruxes and Predictions

  For the substantive disagreements identified above, we identify the following cruxes. We propose the following mathematical developments as tests of our hypotheses.

  ### Crux 1: The Ultimate $L$ and Inner Models
  *   **Question:** Can we construct an inner model that accommodates all known large cardinals and satisfies CH (specifically $2^{\aleph_0} = \aleph_2$)?
  *   **Test:** Success or failure of the construction of a canonical inner model for supercompact cardinals (or stronger) that admits a well-ordering of the reals.
  *   **Camp A Prediction:** Such a model will be discovered. If such a model $M$ is unique and absorbs all large cardinals, we take it as evidence that $V=M$, implying **CH is True**.
  *   **Camp B Prediction:** Either such a model fails to capture full $V$, or the forcing to destroy CH from that model is also canonical. If multiple "final" models exist (e.g., Ultimate $L$ and various PFA-models), it confirms the **multiverse view** and renders the question of absolute truth meaningless.

  ### Crux 2: Generic Absoluteness and Definiteness
  *   **Question:** Does Generic Absoluteness extend to statements about the continuum for sufficiently rich forcing notions?
  *   **Test:** Establishment of a forcing axiom (e.g., $\Phi_{MM}$) that forces $\neg CH$ but is derivable from the assumption that $V$ satisfies a strong maximality principle (e.g., Maximality Principle MP).
  *   **Camp A Prediction:** Maximality principles are objectively true of $V$. Therefore, principles leading to $\neg CH$ are true of $V$. **CH is False.**
  *   **Camp B Prediction:** Maximality principles are merely constraints that force certain structures in specific universes. One can adopt a maximality principle in one universe and a minimality principle in another. This demonstrates **No Unique Answer**.

  ---

  ## Part 4: Identification of Verbal Disputes
  While the ontological commitments differ significantly (see the Ontology row in the Disagreements Matrix), portions of the debate regarding the terminology "truth" and "exists" are verbal.

  *   **"True in $V$:** Camp A uses "true in $V$" to denote correspondence to a mind-independent structure. Camp B uses "true in $V$" to denote satisfaction within a chosen model of ZFC. While the *ontology* driving these definitions is substantive, the *linguistic usage* is merely a difference in qualification. Once clarified as "absolutely true" versus "model-relatively true," there is no factual dispute left regarding the semantics of the word "true."
  *   **"Exists":** When Camp A says "Sets exist," they refer to absolute existence. When Camp B says "Sets exist," they mean "exist in some valid model." Provided both parties understand that Camp B is asserting the legitimacy of alternative universes rather than denying the existence of sets per se, the use of the existential quantifier is compatible, albeit with different scope.

  ---

  **Signatures:**

  _________________________  
  Representative, Camp A (Determinant Truth)

  _________________________  
  Representative, Camp B (Indeterminacy/Multiverse)

