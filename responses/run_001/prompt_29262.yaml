  Okay, ready to write.

  **Plan:**
  1. Introduction acknowledging the tension.
  2. Section: Translation Dictionary (Core Claims -> Control Terms).
  3. Section: The Residue Report (Translatable, Fudged, Missing).
  4. Section: Assessment of the B-I-L's take.
  5. One-sentence summary.

  *Check:* Did I address "logical uncertainty"? That's the hardest one. Control theory usually treats unknown parameters as random variables (Bayesian Control). Logical uncertainty treats unknown computations as probabilistic events despite being deterministic. I need to make sure this distinction is clear.

  *Check:* Did I address "goodhart"? Control theory has "integral windup" or "saturation," but Goodhart is about the objective function misalignment when the proxy is optimized hard. This is close to "Robustness to Model Mismatch." I will frame it as such.

  *Final check on the summary:* Needs to be punchy. "He is right that the physics is mundane, but wrong that the implications are negligible." Something like that.

  Let's refine the "Residue".
  The biggest gap is *teleology*. Control theory is teleological (minimize cost function), but the "cost function" is external to the engineer. In AI, the goal is learned or embedded. But maybe that's too broad. Let's stick to the "state space model" constraint. The inability to define a finite state representation that includes the agent's own source code is a specific incompleteness result relevant here.

