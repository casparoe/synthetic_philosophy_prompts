answer: |-
  Elias dragged the eyelid open. It was heavy, sticky, and tasted of copper. The act of tearing it away from the lower lid felt like peeling tape off raw skin. 

  "Thirty percent," the monitor chimed. "Synaptic drift detected. Please return to the flow."

  "Give me a second," Elias rasped. His voice sounded foreign, jagged, like rocks grinding together. In the dim light of the workstation pod, the rest of the team was already slumped forward, heads resting on the mesh pillows, breathing in a synchronized, shallow rhythm. They were Down. They were Together. 

  Only Elias was Up. He was isolated. He was lonely.

  He looked at his hands. They were pale, trembling slightly. Without the neural dampeners, the blood rushing through them felt violent. He knew why he had stayed Up. The shipment manifest had shown a discrepancy—a mislabeled crate of cryo-vials that would rot if they weren't moved within the hour. 

  In the Flow, no one saw errors. You couldn't see them because you weren't looking. But Elias could. He had forced himself out of the deep hum of the collective dream to look at the screen.

  "Elias?"

  The sound came from beside him. Mara's head was still tucked into her pod, her mouth slightly open. Her voice wasn't coming from her throat; it was projected directly into his auditory cortex. She hadn't woken up. None of them had.

  "I saw the manifest," Elias said aloud. He winced at the volume. Words were so… clumsy. They bounced off the air, lonely little objects with nowhere to land. "There's a leak in Sector 7."

  "Shh," Mara's voice whispered inside his skull, soft and velvety. "Don't drag yourself out. It hurts the harmony. Just report it and sink back down. Let the others fix it."

  "There is no 'others,'" Elias grunted, typing a correction code. His fingers felt too fast, too aggressive against the keyboard. "If I don't do it, the vials spoil."

  "Why separate?" Another voice joined the chorus, this one from the manager, Mr. Henderson. Henderson was Down, miles away in his executive suite, but his presence was everywhere in the network. "If you correct it while Up, you're acting on your own. Who authorized the solo cognition?"

  "It was urgent."

  "Urgency is a phantom pain," Henderson said, sounding genuinely tired. "You're burning calories. You're isolating your consciousness from the group consensus. That's why the numbers drop whenever you surface. You're creating a vacuum."

  Elias typed the command. `CORRECTION APPROVED.` The system beeped, acknowledging the fix. 

  "See?" Elias said. "It's done."

  "No," Mara sighed in his ear. "It's done *badly*. Now everyone knows you woke up. You've created an island of awareness in the ocean. It creates ripples. Other users will try to match your frequency. They'll try to surface. They'll risk dehydration. They'll risk the headache."

  "I just wanted to save the stock," Elias said. He rubbed his temples. Being Awake made him feel sick. There was a static buzz behind his eyes, the terrible, crushing weight of individual sight. Every object in the room was sharp-edged and separate from every other object. It was ugly. 

  "The Stock doesn't need saving," Mara said. "It needs us to trust that we are all holding it. You shouldn't touch what belongs to the whole."

  "You guys sleep for sixteen hours," Elias snapped. He hated that his anger was so visible, so hot. When he spoke, he burned oxygen. "If I hadn't woken up, you'd lose the inventory."

  "We wouldn't have lost anything," Henderson corrected gently. "Because in the Flow, possession is shared. Even if it rots, it rots equally. But now? Now one part of you is cold, and the rest of us are warm. That imbalance causes resentment. It causes fractures."

  Elias stared at the screen. The cursor blinked. A rhythmic pulse of blue light that demanded to be noticed. In the room, the hum of the servers was low, soothing, like a heartbeat. The room smelled of ozone and lavender sleep-powder.

  "I can't sleep if I don't know the inventory is safe," Elias said.

  "That's the addiction talking," Mara said softly. "You think you need to verify. You think you need to *see* to believe. That's why we developed the Network, Elias. So we don't have to carry the weight of seeing. So we don't have to be responsible for what we know."

  Elias looked at his colleagues. They were beautiful, he thought, watching the slow rise and fall of their chests. They were connected, a single organism distributed across twenty chairs. They didn't worry. They didn't doubt. They trusted the hum.

  And there he sat, stiff and dry-eyed. A solitary unit. A glitch.

  "If you're done correcting," Henderson asked, "we'd appreciate you logging back in. We're drifting into Phase Three. The collective dream requires synchronization."

  Elias hesitated. He looked at the crate in Sector 7 on the map. Green light. Safe.

  He reached for the neural link port at the base of his neck. It was cool metal. He pushed the connector home.

  The relief was instantaneous. The sharp edges of the room blurred. The copper taste vanished. His hands stopped shaking. The anxiety—the terrible, nagging sense that *something* needed checking—dissolved into a warm, thick gray fog. 

  He didn't need to know about the vials anymore. 
  Someone else would know. 
  Maybe they didn't matter. 
  Maybe they mattered to everyone, which meant they mattered to no one.

  As his vision faded, the last thing he heard was Mara whispering in the dark, satisfied.

  "Welcome back," she said. "You were gone a long time. It was so quiet."
