      *   **Humean Stance:** Asking "why" is a category mistake; regularities just are.
      *   **Anti-Humean Stance:** Reducing laws to regularities begs the question; it leaves contingency unexplained.
      *   **Tone:** Equally competent, philosophical rigor, real back-and-forth (not strawmanning), engaging for a reader interested in metaphysics.

