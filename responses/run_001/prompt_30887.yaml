answer: |-
  Harsanyi’s theorem offers a conditional vindication of utilitarianism rather than a definitive proof, as it necessitates assumptions about the interpersonal comparability of utility that effectively presuppose the moral framework it claims to derive. Whereas Arrow’s Impossibility Theorem proves that no collective decision rule exists when individuals hold only ordinal, non-comparable preferences, Harsanyi introduces cardinal utility derived from choices under risk to bypass this barrier. This mathematical breakthrough requires assuming that utility increments are meaningful across persons, allowing the social welfare function to simply sum individual utilities. Critics maintain that this cardinal comparability is not a neutral mathematical fact but an ethical stance that assigns equal worth to each individual's capacity for satisfaction, thereby importing the utilitarian conclusion into the premises. Therefore, the theorem does not demonstrate that societies ought to be utilitarian based on minimal agreement, but rather that if one accepts the measurability and comparability of wellbeing, utilitarianism becomes the unique logical outcome.
