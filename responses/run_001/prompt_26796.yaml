      *   *Specific Tension:* **D1 (Save the Greater Number)** vs. **D5/D6 (Stronger Individual Complaint Prevails)**.
      *   *Resolution:* We must weaken D5/D6 to allow "Weighted Aggregation" where many weaker complaints can outweigh one stronger complaint under specific conditions (thresholds, magnitude differences). We cannot reject D1 because it violates common sense morality. We must modify the "pairwise" mechanism to include the *number* of bearers of comparable complaints.

