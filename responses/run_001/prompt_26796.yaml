answer: |-
  Below is the specification of the desiderata for an adequate Scanlonian contractualist account of aggregation, followed by an analysis of the internal tensions and the primary constraint on external theories.

  ### Part I: Desiderata for Aggregation in Scanlonian Contractualism

  These desiderata are derived from the fixed core: wrongness depends on the permissibility of general principles, justifiable only via reasons belonging to individuals, not via the maximization of impersonal value.

  **1. The Simple Rescue Requirement**
  *   **Specification:** The account must entail that in a choice between saving one stranger or five strangers whose claims to survival are equal in weight, the correct principle permits saving the five.
  *   **Status:** **Non-negotiable.** While one might theoretically maintain a radical contractualist stance that denies aggregation, a view that consistently selects the lone survivor over a majority in cases of equal claim fails to track robust moral intuitions regarding the urgency of rescue. To deny this is to fail as a guide to action, regardless of theoretical purity.
  *   **Consideration:** This is the baseline test for whether "numbers" have any traction within the framework.

  **2. The Severity Threshold Requirement**
  *   **Specification:** The account must classify cases of unequal trade-offs plausibly. Specifically, it must forbid sacrificing one person’s life to prevent a vast number of people from suffering trivial harms (e.g., mild headaches), while potentially permitting the sacrifice if the harms aggregated are sufficiently grave (e.g., widespread loss of sight or livelihood).
  *   **Status:** **Preference (of Moderate Camp).** Extreme contractualists might argue that a right to life is absolute and can never be overridden by numbers, however large. A moderate contractualist view argues that very serious harms can be weighed against cumulative lesser harms.
  *   **Consideration:** This distinguishes a plausible threshold deontology within contractualism from a rigid absolutism that renders the theory incapable of handling policy-level disasters involving mass casualties versus catastrophic individual losses.

  **3. The Intraphysiological/Interpersonal Distinction**
  *   **Specification:** The account must permit the aggregation of multiple burdens occurring within a single life (e.g., headache + nausea + broken leg) for the sake of determining that person's total well-being, while prohibiting the mere mathematical summing of distinct persons' burdens to defeat a single person's claim.
  *   **Status:** **Non-negotiable.** This preserves the fundamental metaphysical commitment of the view: the separateness of persons. Without this distinction, contractualism collapses into utilitarianism.
  *   **Consideration:** This ensures that the "unit of concern" remains the person, not the experience.

  **4. The Ex Ante Justification Preference**
  *   **Specification:** The account should prioritize justification in terms of each person’s prospects *before* risk is resolved (e.g., everyone having a 1/10 chance of death) rather than relying solely on *ex post* justification (i.e., what actually happened to the actual victim).
  *   **Status:** **Preference (of Standard Scanlonians).** While the standard view holds that principles must be justifiable to those affected *ex ante* (before the risk is rolled), a minority camp insists that once a harm materializes, *ex post* complaints are relevant to retrospective judgment.
  *   **Consideration:** Focusing on *ex ante* expectations prevents the theory from becoming overly punitive toward the unlucky and protects the justification of risky practices (like vaccination or surgery) that benefit all statistically.

  **5. The Pairwise Comparison Protocol**
  *   **Specification:** When evaluating a principle, the model must compare the strength of the strongest complaint against the principle with the aggregate strength of the complaints of those disadvantaged by the alternative. Crucially, it must specify *how* multiple weaker complaints combine. Does a multitude of weak complaints break the deadlock of one strong complaint?
  *   **Status:** **Non-negotiable.** The procedural mechanism of "reasonable rejection" implies a comparative exercise. If there is no protocol for weighing competing individual complaints, the concept of "reasonable rejection" becomes incoherent (who decides if a rejection is reasonable if not against an alternative?).
  *   **Consideration:** This is the operational engine of the theory; its mechanics determine whether the theory allows any form of aggregation at all.

  **6. The Individualist Veto (Individualist Restriction)**
  *   **Specification:** A principle permitting the sacrifice of Person A for the benefit of Persons B-Z must be justifiable specifically *to Person A*. Person A’s reasons cannot be overridden simply because the "sum" of B-Z's gains exceeds A's loss; A must have a personal reason to accept the principle despite her loss.
  *   **Status:** **Non-negotiable.** This is the definitional core provided in your prompt. Any view that aggregates "social value" or "general welfare" directly violates this.
  *   **Consideration:** This blocks pure utilitarianism and ensures that justice remains personal rather than arithmetic.

  **7. The Separateness-of-Persons Constraint**
  *   **Specification:** The distribution of harms must affect justification. A loss spread thinly across many people is morally distinct from the same total loss concentrated on one person. Therefore, the justification for imposing costs must address the distribution, not just the sum.
  *   **Status:** **Non-negotiable.** This explains *why* the Individualist Veto exists. It prevents the "fungibility" of human beings assumed in cost-benefit analysis.
  *   **Consideration:** This is the metaphysical guardrail preventing the collapse of the view into hedonic calculus.

  ---

  ### Part II: Incompatibility Analysis

  There is a fundamental tension between three specific requirements: **(1) The Simple Rescue Requirement**, **(5) The Pairwise Comparison Protocol**, and **(6) The Individualist Veto.**

  **The Conflict:**
  1.  **The Veto (D6)** implies that if Person A has a sufficient reason to reject a principle (e.g., it condemns them to death), the principle is unreasonable.
  2.  **Strict Pairwise Comparison (D5)** often interpreted in isolation suggests that the strongest individual complaint defeats any number of weaker individual complaints. If Death is infinitely worse than a Headache, the one person facing Death should always win, regardless of how many people face headaches.
  3.  **The Simple Rescue (D1)** demands that we ignore the "one wins over many" intuition if the claims are equal. In the Simple Rescue, if we apply a strict "Strongest Complaint Wins" logic, both sides have an equal complaint (death). If neither wins, paralysis results. But intuitively, five deaths outweigh one. To reach this conclusion, we must aggregate the *complaints* of the five.
  4.  However, aggregating the complaints of the five appears to violate **The Individualist Veto (D6)**. Why can the five complainers collectively defeat the one? If the one has a "Veto," numbers shouldn't matter. If numbers matter, the Veto is conditional, not absolute.

  **Resolution:**
  The right response is to **weaken (5) The Pairwise Comparison Protocol**.
  We cannot reject **The Individualist Veto (D6)**, because that would dissolve contractualism into utilitarianism. We cannot reject **The Simple Rescue Requirement (D1)**, because that violates basic moral competence. Therefore, the operational procedure (D5) must be revised.

  Instead of a simple "strongest complaint wins" heuristic, the Protocol must incorporate a **provision for Aggregated Comparable Complaints**. The revision acknowledges that while Person A has a veto against a principle that imposes *unavoidably heavy* burdens, that veto yields when many others hold *comparable* burdens. The justification given to Person A changes from "You die so others live" to "You died so others lived, but given that everyone was equally vulnerable, the alternative (saving only you) unfairly discriminates against the majority." The "break the deadlock" mechanism must rely on the idea that no one could reasonably reject a principle that treats similarly situated persons equally, even if they end up losing out.

  Thus, aggregation enters not through the *value* of the lives saved (rejecting D7), but through the *impersonal unfairness* of privileging one randomly selected life over others with identical claims (reinterpreting D6).

  ---

  ### Part III: The Primary Constraint on Attractive Proposals

  The single requirement that does the most work to exclude otherwise attractive proposals is:

  **The Individualist Restriction (Requirement 6).**

  **Reasoning:**
  This requirement is the primary barrier to the most intuitively appealing alternative: **Total Utilitarianism (or Rule Consequentialism)**. Utilitarian approaches often propose solving aggregation problems elegantly by calculating net expected value. They provide clear answers to the "Unequal Trade-off" and "Simple Rescue" scenarios that align with our gut intuitions. However, this elegance comes at the cost of treating the "good" as a collective resource to be optimized.

  By fixing the Individualist Restriction, any proposal that attempts to resolve aggregation issues merely by maximizing "overall well-being" is immediately disqualified. It forces the theorist to find a justification that works *backwards* from the perspective of the individual loser, rather than *forwards* from the perspective of the social good. Consequently, this requirement rules out the simplest way to make contractualism function (by smuggling in a utility function) and compels the development of complex, distinctively contractualist mechanisms (like hypothetical consent to fair procedures) that are far harder to construct and defend. It is the wall that separates contractualism from welfarism.
