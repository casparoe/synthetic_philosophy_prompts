  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait,* if I tell them to keep representation, does that violate EM? No, EM targets the *specific ontology* of Folk Psychology (laws, coherence, norms). Connectionist models have weights, not symbols.
      *   *Crucial nuance:* RTM (Fodor) assumes symbolic structure. Predictive Processing assumes probabilistic inference. The user needs to ensure their RTM version doesn't imply folk psychology. I should suggest moving towards *Predictive Processing* or *Sub-Symbolic Representation* to save the boat.
      *   *On Qualia:* Make sure to mention the "Phenomenal Concept Strategy" (Strawson/Chalmers/Brown) as the way out of the introspection symmetry objection.

  8.  **Final Structure:**
      *   Intro: Valid concerns, coherent but strained package.
