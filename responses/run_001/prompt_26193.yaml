answer: |-
  This is an exceptionally sharp diagnosis of the current state of the art. You have correctly identified that the stalemate is not due to a lack of data or formal machinery, but rather a structural incongruity between how different disciplines instantiate the concept of *agency* within the phenomenon of escalation.

  Having reviewed the relevant cross-disciplinary literature—from Schelling and Shubik on the game-theoretic side, through Staw and Ross on organizational behavior, to Broome and Parfit on diachronic rationality—I agree that the debate has become ossified because participants are operating with different implicit metaphysics of rationality.

  Here is my diagnosis of the nature of this disagreement, followed by an assessment of what would constitute genuine progress.

  ### 1. The Diagnosis: It is a Metaphysical, Not Just Normative, Dispute

  You asked if the disagreement is about the correct normative standard, essential features, or category confusion. My contention is that it is **all three simultaneously, rooted in a fundamental divergence regarding the temporal ontology of the agent.**

  To break this down, we can identify three axes along which the interlocutors slide past one another:

  #### Axis A: The Definition of the Agent (The Time-Slice Problem)
  *   **The Economist/Game Theorist View:** Often treats the agent as a *series of time-slices* connected by a strategy function. If every time-slice acts to maximize its local utility given its beliefs, the outcome is "rational," even if the sequence leads to ruin. Here, the "rationality" of the bid is decoupled from the "optimality" of the path.
  *   **The Behavioral Psychologist View:** Treats the agent as a *continuous narrative self* with stable preferences. When preferences shift mid-game (due to loss aversion or the pain of realizing a loss), the agent exhibits inconsistency. This is labeled "irrational" because it violates the axiom of preference stability across time.
  *   **The Philosopher's Blindspot:** Many philosophical accounts rely on **diachronic coherence** (Plannedness, Bratman) or **instrumental consistency**. The disagreement arises because neither framework fully captures the *social* pressure of the escalation. If I stop bidding, I signal weakness to a competitor who may not exist in the formal model.

  #### Axis B: The Locus of Error (Cognitive vs. Strategic)
  *   **Side 1 (Bias):** The error is internal/cognitive. The agent fails to compartmentalize the sunk cost. This assumes the standard of rationality is **cognitive hygiene**—keeping past losses out of future calculations.
  *   **Side 2 (Signaling/Meta-Game):** The error is external/strategic. The model omits the reputational stakes. To escalate is rational *in the larger context*. This assumes the standard of rationality is **ecological fit**—adapting to the environment which includes other observers.
  *   **The Impasse:** Side 1 calls Side 2 "making excuses for the model." Side 2 calls Side 1 "confusing parsimony with truth."

  #### Axis C: The Nature of Rationality (Constitutive vs. Success-Based)
  *   **Constitutive View (Kantian/Bratman):** Rationality is about maintaining the integrity of your own will over time. Escalation is irrational because it undermines the unity of the agent's agency (akrasia/diachronic weakness of will).
  *   **Success-Based View (Humean/Adaptive):** Rationality is about hitting the target. If escalating wins the contract (despite higher cost) or saves face, and stopping loses more reputation, escalation was rational.
  *   **The Deadlock:** You cannot settle whether escalation is rational until you decide which definition governs the domain.

  ### 2. Which Features Are Essential?

  Your question regarding incidental vs. essential features is the pivot point where formal models fail.

  In the **Dollar Auction**, the tragedy is mathematical. The Nash Equilibrium involves infinite bids or early exits depending on information asymmetry. The essential feature here is **irreversibility + public commitment**.

  In **Managerial Escalation** (the real-world proxy), the tragedy is sociological. The essential features are **accountability structures** and **framing effects**.

  **The Critical Diagnostic:**
  Most of the impasse comes from treating Managerial Escalation as a test case for the Dollar Auction. They are structurally different.
  *   In the Dollar Auction, you *lose money* immediately upon stopping.
  *   In Managerial Escalation, you *save resources* upon stopping, but *lose status*.

  Therefore, the "essential feature" being contested is the **weighting of social utility**. If social utility is treated as "noise," the behavior is irrational. If social utility is treated as a primary good, the behavior is rational. The disagreement is essentially about **what enters the utility function**, not how agents optimize it.

  ### 3. Is it Conceptual Analysis vs. Empirical Psychology?

  It is slightly less than a category error, but mostly yes, it is a tension between **internalist logic** and **externalist adaptation.**

  *   **One camp** is doing conceptual analysis of the ideal agent under constraints (Can a perfectly coherent agent get trapped?).
  *   **The other camp** is doing functional explanation of human behavior (Why do humans do this routinely?).

  When the conceptual analysts say "No, a rational agent wouldn't do this," they mean "A rational agent wouldn't have the utility function required to find this attractive." When the empiricists say "Yes, rational agents do this," they mean "Real agents, functioning in real environments with imperfect recall and reputational needs, find this attractive."

  The label "rationality" is doing heavy lifting that covers both "consistency of preference" and "success of action." This equivocation allows the debate to spin forever.

  ### 4. What Would Count as Progress?

  Given this diagnosis, simply adding another variable to a regression equation or finding another equilibrium in a repeated game will likely not move the needle. Progress requires a shift in the *framework of evaluation*.

  Here are four concrete paths toward resolution:

  #### A. The "Meta-Escalation" Experimental Paradigm
  We need experiments that separate **cognitive misattribution** (I don't realize I'm wasting money) from **strategic defense** (I know I'm wasting money, but I must continue to signal resolve).
  *   *Proposal:* Create scenarios where observers are removed entirely (purely anonymous, one-shot auctions) versus scenarios where reputation matters.
  *   *Progress Measure:* If escalation persists in the absence of any audience/signal, the "bias" hypothesis gains ground. If it vanishes without an audience, the "signaling/rationality" hypothesis is vindicated. Current literature suggests it's a mix, but we need cleaner isolation of these mechanisms to determine the *dominant driver*.

  #### B. Formalizing "Regret" as a Constraint
  Current utility functions usually minimize *loss*, but human agents seem to minimize *regret*.
  *   *Proposal:* Integrate **Minimax Regret** or **Counterfactual Utility** more rigorously into the normative model of rationality.
  *   *Progress Measure:* If we can show that "rational agents minimizing anticipated regret" mathematically predict escalation curves observed in humans, we dissolve the dichotomy. We stop calling it a "fallacy" and call it a "feature of a regret-minimizing epistemology." This shifts the normative standard from Expected Utility Maximization to Expected Regret Minimization.

  #### C. Diachronic Autonomy (The Bratman/Pettit Route)
  From a philosophy standpoint, we need to specify the conditions under which **binding oneself against future preferences** is a requirement of rationality.
  *   *Proposal:* A robust account of **Plan-Like Attitudes**. If rationality requires binding your future self to avoid local traps (a la Ulysses and the Sirens), then escalation is a failure of pre-commitment capacity, not a failure of decision-making per se.
  *   *Progress Measure:* Moving the debate from "Is the *choice* rational?" to "Is the *architecture of the will* rational?" This aligns moral psychology with rational choice by making self-governance the primary norm.

  #### D. Dissolving the "Dumb Money" Assumption
  Much of the managerial literature implicitly assumes the manager *wants* to be efficient but gets tricked by biases. However, in many cases (e.g., defense spending, Cold War policy), escalation was politically rational for the actor.
  *   *Proposal:* Re-classify escalation not as "mistaken optimality" but as **multi-objective optimization**.
  *   *Progress Measure:* Explicit modeling of political survival as a payoff. If the model shows that maximizing budget size > maximizing project efficiency for the *agent's utility* (which includes tenure/survival), then the "sunk cost fallacy" label is normatively inappropriate. It is a principal-agent problem, not a cognitive defect.

  ### Recommendation for Your Research

  As a PhD student at this intersection, your opportunity lies in **bridging the temporal ontology gap**.

  Don't try to prove that escalation is irrational or rational. Instead, propose that **"Escalation is a symptom of conflicting rationalities."**

  Specifically:
  1.  **Synchronic Rationality:** At moment $t$, given the sunk cost, quitting looks like confirming the previous loss. Continuing offers a slim hope of recouping. Local rationality favors continuing.
  2.  **Diachronic Rationality:** Over $t$ to $t+n$, the plan should have been to quit.
  3.  **Social Rationality:** Given the gaze of others, quitting looks like incompetence. Continuing maintains status.

  Your thesis contribution could be a **"Tripartite Framework of Decision Failure"** that maps where the breakdown occurs. This dissolves the dispute because it acknowledges that different stakeholders (the economist, the psychologist, the manager) are optimizing for different things, all valid within their respective frames.

  **The Verdict:**
  The disagreement is a **conceptual mismatch masked as a normative dispute**. Progress will come not from better game theory or more behavioral data alone, but from a **formalized theory of meta-preferences** that explicitly accounts for social signaling and diachronic commitments as intrinsic components of the utility function, rather than "contaminants."

  If you can formalize a decision-theoretic model where "commitment" is a variable that carries positive utility (not just instrumental value) and demonstrate how this generates the dollar-auction curve, you will effectively merge the two camps. That is a defensible dissertation topic with high potential for publication impact.
