answer: |-
  ### Part 1: The Translation (Restatement in Econ Vocabulary)

  You want to map "evidential cooperation" and "acausal trade" onto the machinery of Bayesian games. Here is the formal translation. Forget "magic" for a moment; treat this as a specific subclass of Bayesian games with highly constrained priors.

  **1. The Setup: Expanding the Type Space**
  In a standard Bayesian game, Nature draws types $\theta_i \in \Theta_i$ according to a prior $P(\theta)$. A player's strategy is a map $s_i: \Theta_i \to A$. Standard assumptions (e.g., independence) often imply $\theta_i$ carries no information about $\theta_j$ other than what is encoded in $P$.

  For evidential cooperation, we redefine the **Type Space**. Let $\theta_i$ not just be "preferences and endowments," but include the **Source Code** (the decision algorithm) of the agent.
  $$ \theta_i = (\text{Utility}_i, \text{Algorithm}_i, \text{Observation}_i) $$
  We assume a joint prior $P(\theta_1, \dots, \theta_N)$ that places significant measure on configurations where $\text{Algorithm}_i \approx \text{Algorithm}_j$ (or at least, where they output the same action given the same logical inputs). This models "logical similarity" or "simulated duplicates."

  **2. The Correlation Mechanism: Logical Entanglement**
  In a standard Correlated Equilibrium (CE), an external mediator sends signals $s \sim Q(s)$. In "acausal" scenarios, there is no external mediator. Instead, the correlation is **endogenous**.
  *   **The "Mediator":** The laws of physics/computation determining how optimization processes instantiate in a large world (Dyson spheres, multiverse copies, or just high-entropy environments where similar patterns recur).
  *   **The Information Structure:** When Agent 1 selects an action $a_1$, they are not just choosing a move; they are revealing information about their $\theta_1$. Under the specific prior $P$, knowing your own algorithm implementation $a(\cdot)$ and your observation provides Bayesian evidence about the distribution of $\theta_j$ in the population, specifically updating beliefs toward $\theta_j \text{ such that } a(\cdot) \approx a_1(\cdot)$.

  **3. The Equilibrium Concept: Symmetric Bayesian Nash with Dependent Realizations**
  Standard Nash/BNE assumes players choose best responses to *beliefs* about opponents' play. The opponents' play is treated as independent of one's own choice, conditional on the prior.
  In the Rationalist formulation (often labeled TDT/EDT):
  1.  You recognize that the decision rule $f(\text{inputs}) \to \text{action}$ is implemented across multiple indices (agents).
  2.  You optimize the choice of $f$, not just the choice of $a$.
  3.  Formally, this is maximizing expected utility over the **space of algorithms**, weighted by the probability of other agents instantiating similar algorithms.
  4.  If $P(\theta_j | \theta_i)$ induces high correlation between actions $a_i$ and $a_j$ (because $Algorithm_i \approx Algorithm_j$), then $E[U_i | a_i]$ updates based on $a_i$.
  5.  Mathematically, this looks like a **Bayesian Nash Equilibrium** where the joint distribution over action profiles $\sigma(a_1, \dots, a_N)$ factors through the joint distribution over algorithms $P(f_1, \dots, f_N)$. If we restrict attention to subgames where $P(f_i = f_j) \to 1$, we recover the behavior of evidential cooperation.

  **4. Pre-Play Communication (Cheap Talk)**
  Usually, cheap talk works only if it changes beliefs enough to coordinate on a Pareto-superior equilibrium. In this framework, "communication" is unnecessary because the **logical derivation** replaces the signal. If I know you are rational and I am rational, and we share a common prior over "rationality criteria," my internal reasoning process simulates yours. The "message" is sent via the isomorphism of the decision function itself.

  ---

  ### Part 2: The Residue Report

  This is where we separate the signal from the noise.

  #### Cleanly Mapped
  *   **Common Priors:** This maps directly to the assumption that all agents are sampling from the same "computational universe." The "spooky" connection is simply a very strong correlation coefficient in the prior distribution $P(\theta_1, \dots, \theta_N)$.
  *   **Bayesian Updating:** The core mechanism of EDT—"My choice tells me something about the state of the world"—is exactly Bayesian conditioning. The rationalists are just arguing that the event "I chose Cooperate" has high likelihood ratio for "You exist" or "You are also Cooperating." In a frequentist sense, if you pick an atom at random from the set of optimizing agents, your action correlates with others.
  *   **Symmetry Arguments:** Your experience with Symmetric Nash Equilibria maps perfectly. If everyone is identical (types are i.i.d.), playing the symmetric best response is standard fare. "Acausal trade" is just applying symmetry to the *strategy function* rather than the realized *action profile*.
  *   **Commitment Devices:** What they call "self-binding to an algorithm" is mechanically identical to contracting before the game starts. If the contract is observable by others (via reputation or simulation), it yields the same equilibria.

  #### Stretched or Fudged
  *   **Independence of Causality:** In your toolbox, correlations usually require a common cause (a node in a DAG pointing to both variables). In these arguments, they sometimes imply that *your decision causes their decision* logically.
      *   *Stretch:* We have to stretch the definition of "Cause." In the economic model, there is no causal link between $a_1$ and $a_2$. There is only a statistical dependency mediated by $\theta$. If they claim your choice *changes* their action in a counterfactual sense ($do(a_1)$ changes $P(a_2)$), that requires abandoning the Do-Calculus (Pearl/Causal Modeling) in favor of pure Probability Calculus (EDT). You can fit this into GT only if you interpret "Causality" metaphorically as "Screening."
  *   **The Definition of Types:** Standard econ types are exogenous parameters (valuation, risk aversion). Here, the type includes "how closely my code resembles yours." Modeling this requires the Type Space to be reflexive (types containing descriptions of other types). This creates a fixed-point problem that standard BNE existence proofs don't explicitly address, though Harsanyi's transformation handles some of it.
  *   **Counterfactual Mugging:** This scenario (Omega asks you for money *after* you've already won the lottery, based on whether you would have paid) implies payoffs depend on *disposition*, not realized action.
      *   *Stretch:* In standard GT, payoff functions $u_i$ depend on the outcome vector $(a_1, a_2)$. In Counterfactual Mugging, $u_i$ depends on the *function* mapping histories to actions. This requires moving the argument inside the utility function: $U_i(a(\cdot))$. This isn't standard, but it's definable.

  #### No Counterpart (The Weird Bits)
  *   **Logical Uncertainty:** Your framework assumes probability distributions over states. Rationalists admit uncertainty about mathematical truths (e.g., "Will this proof hold?"). If two agents share logical uncertainty, their beliefs can correlate *without* a common stochastic prior in the traditional sense.
  *   **Multiverse Instantiation:** The claim that "you might never meet" relies on a cosmological hypothesis (many worlds or large worlds). Standard GT takes the Game Set $\Gamma$ as given. This argument suggests $\Gamma$ is dynamic based on the agent's decision. That's not game theory; that's metaphysics dressed in game theory clothing.
  *   **The "One-Shot" Illusion:** Standard analysis distinguishes between repeated and one-shot games. "Acausal trade" treats a single physical interaction as a repetition of a logical interaction. You can simulate this with Iterated Prisoner's Dilemma, but the claim is that it applies even if the agents are never connected temporally. That breaks the timeline constraint implicit in "Sequential Move" or "Simultaneous Move" distinctions.

  ---

  ### Part 3: Diagnosis

  **Is this just re-inventing correlated equilibrium?**
  No. A Correlated Equilibrium strictly requires an external correlation device (a mediator) that is distinct from the agents. Evidential cooperation relies on **internal** correlation derived from the agents themselves.
  If you try to force this into CE, you must posit a mediator who is "Nature" plus "Logic." But standard economics assumes Nature is passive stochastic noise. These arguments assume Nature is computationally dense and generates instances of *optimizers*.

  **Is there a genuine conceptual gap?**
  Yes. The gap is between **Strategic Independence** and **Logical Substitution**.

  *   **Your Framework (GT):** Assumes that once types are drawn, the players are causally sealed off. I can think about you, but my thoughts do not alter your strategy function unless I communicate. My action $a_i$ is an output; it cannot influence the input generation of your output $a_j$.
  *   **Their Framework (Acausal/TDT):** Treats agents as instances of an abstract algorithm. Since the abstract algorithm is the same object (mathematical truth), reasoning about your own code provides information about another instance's code. This assumes a Platonist ontology where the "algorithm" exists independently of its instantiation.

  **Whose problem is it?**

  1.  **Are they less coherent?**
      Often, yes. They frequently smuggle in the conclusion ("I should cooperate") by assuming the correlation is stronger than the evidence justifies (e.g., assuming a duplicate exists when the prior says it's vanishingly rare). They often confuse "I should behave *as if* I control the copy" with "I *actually* control the copy."
      *   *Correction:* If the prior probability of similarity is low, your expected utility gain from cooperation is negligible. You shouldn't cooperate unless the *stakes* are massive (Pascal's Wager style) or the density of copies is guaranteed by the cosmology.

  2.  **Is your framework missing something?**
      It is missing **Logical Uncertainty** and **Computational Complexity constraints** on the Type Space.
      *   Standard Bayesian Nash assumes agents can compute the equilibrium perfectly.
      *   Acausal trade acknowledges that finding the equilibrium involves solving for the optimal *algorithm* among a complex space.
      *   Your tools *can* model this, but they become messy. You'd have to define a Game over Algorithms $\mathcal{G}_{algo}$, where the payoff of an algorithm $A$ depends on the distribution of algorithms played by others.
      *   *Verdict:* You don't need new axioms. You need a higher-order Game. The "acausal" agent is simply playing a Game where the Strategy Space is the set of Computable Functions, and the Payoff depends on the self-referential stability of those functions.

  **Bottom Line:**
  They aren't discovering new physics; they are exploring **High-Dimensional Type Spaces**. The "spookiness" is the result of economists habitually assuming Types $\perp$ Actions given Information. The rationalists are asserting that in a computable universe, $P(Type_B = Type_A | Action_A) > P(Type_B = Type_A)$.

  That is not impossible in your toolkit. It is just **unusual**. Most economic models assume the correlation between agents decays to zero with distance (physical or informational). The rationalist claim is that in "large worlds," that decay rate hits a floor determined by logical necessity, not spatial distance.

  You can model this: Call it **"Logical Correlated Equilibrium."** Define the correlating device $\Sigma$ not as a physical signal, but as the shared logical substrate. If you accept that premise, their math follows. If you reject the premise (standard econ realism: we don't care about unobserved distant universes), their argument is a normative preference masquerading as positive prediction.
