      *   So, it's not *just* an empirical question about development.

  5.  **Formulate the Diagnosis:**
      *   **The Verdict:** It is a hybrid. It begins as a terminological divergence regarding *xing* (biological vs. teleological), but this divergence indexes a fundamental conflict regarding **moral epistemology and the locus of normative authority**.
