prompt: |-
  My political theory reading group has been stuck on the boundary problem for months — half the group leans all-affected-interests (anyone whose interests are affected by a decision should get a say in making it), and the other half leans all-subjected (only those systematically subject to the coercive power of a state count as part of the demos). We've been talking past each other and I want to force some clarity. Please draft the adversarial-collaboration document they should produce. I want:

  - A numbered list of claims both sides can genuinly sign — about what the boundary problem is, why it matters, what's at stake in getting it wrong, and any shared methodological commitments. Don't make these vacuous; they should do real work.
  - Then a table of disagreements, with each row giving the sub-question, the all-affected camp's answer phrased so they'd own it, and the all-subjected camp's answer phrased so they'd own it.
  - Then a cruxes section: the sub-questions that, if resolved, would actually move at least one side. For each crux, include what kind of evidence or argument both sides agree would bear on it, and what each side predicts.
  - I suspect one crux is whether the all-affected principle collapses into requiring global democracy (and whether that's a bug or a feature), and another is what to do about people who are clearly affected by a polity's decisions but aren't formally subject to its laws — long-term residents without citizenship, or people downwind of a country's pollution. Don't limit yourself to those if you see others.

  The document should be something both camps could actually put their names to — no strawmen, no slanted wording. And if part of the dispute turns out to be verbal rather than substantive, say which part and why.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial-collaboration document:

  1.  **Analyze the Request:**
      *   **Context:** A political theory reading group stuck on the "boundary problem" (who constitutes *the demos*).
      *   **Conflict:** Half leans All-Affected Interests (AAI), half leans All-Subjected Coercion (ASC). They are talking past each other.
      *   **Goal:** Draft an adversarial-collaboration document to force clarity.
      *   **Requirements:**
          1.  Numbered list of shared claims (non-vacuous, real work).
          2.  Table of disagreements (sub-question, AAI answer, ASC answer - phrased charitably/owned by the side).
          3.  Cruxes section (resolving these moves the needle, evidence/argument types agreed upon, predictions for each side).
          4.  Specific cruxes mentioned: Does AAI imply global democracy? (Bug/feature?). How to handle long-term residents/pollution victims?
          5.  Tone: Charitable, usable by both sides, no strawmen, identify verbal vs. substantive disputes.

  2.  **Deconstruct the Boundary Problem:**
      *   *The Core Issue:* Democracy requires a decision-maker (*demos*), but defining the *demos* requires a democratic procedure, leading to circularity.
      *   *All-Affected Interests (AAI):* If X decides policy Y, and Z is harmed/benefited, Z should have a vote. Logic: Legitimacy comes from consent regarding impacted stakes.
      *   *All-Subjected Coercion (ASC):* Only those bound by the state's laws and enforcement mechanisms count. Logic: Legitimacy comes from resisting arbitrary rule over one's life/actions within a specific jurisdiction.

  3.  **Drafting Section 1: Shared Claims (Common Ground):**
      *   Need statements they can *actually* sign. Avoid "democracy is good." Focus on structural problems.
      *   *Claim 1: The Circularity.* Both admit the logical puzzle exists. You can't use democracy to define democracy.
      *   *Claim 2: Exclusion is Bad.* Both agree leaving someone out without justification is illegitimate.
      *   *Claim 3: Feasibility Constraints.* Pure theory must confront implementation issues (e.g., logistics, identity), even if only as "second-order" constraints.
      *   *Claim 4: Stakes Matter.* Disputes aren't just about power; they are about protection against harm or securing rights.
      *   *Claim 5: Methodological Pluralism.* We need normative principles *and* institutional feasibility checks.
      *   *Refinement:* Make them punchier. Ensure they don't implicitly favor one side.

  4.  **Drafting Section 2: Table of Disagreements:**
      *   *Row 1: Source of Legitimacy.* AAI = Impact on well-being/stakes. ASC = Submission to law/force.
      *   *Row 2: Scope of Polity.* AAI = Fluid, issue-specific, potentially transnational. ASC = Fixed, territorially bounded, sovereign.
      *   *Row 3: The "Tyranny of the Majority" Concern.* AAI = Risk of ignoring diffuse minorities affected elsewhere. ASC = Risk of external interference in self-determination.
      *   *Row 4: Non-Citizens/Residents.* AAI = Should vote based on impact/time. ASC = Subject to laws, so yes, but citizenship might differ. Wait, this needs nuance. ASC usually says "subject to coercion," which often includes permanent residents. I need to distinguish between *citizenship* and *voting rights*. Let's focus on the boundary definition itself.
      *   *Row 5: Global Implications.* AAI = Often leads to cosmopolitan/global structures. ASC = Supports sovereign nation-states.

  5.  **Drafting Section 3: Cruxes:**
      *   *Crux 1: The Infinite Regress of Affectedness.* If everything affects everything, does AAI dissolve into globalism? Is this fatal?
          *   *Evidence:* Empirical studies on causal chains of policy effects. Normative weight of "proximity" vs. "severity."
          *   *Prediction:* AAI says severity/triviality threshold saves it. ASC says this is arbitrary.
      *   *Crux 2: Coercion vs. Influence.* Is being subject to a police arrest the same category of harm as being downwind of carbon emissions?
          *   *Evidence:* Comparative analysis of autonomy violations.
          *   *Prediction:* AAI says physical coercion is a subset of interest impact. ASC says legal obligation creates a distinct moral relationship of authority.
      *   *Crux 3: The Status of "Non-Citizen Residents".* Are they subjected or affected?
          *   *Prediction:* ASC admits they are subject, so they should vote. AAI admits they are affected, so they should vote. Agreement here? No, the disagreement is whether that settles the *principle* or just the *case*. Actually, better Crux: What happens when Affected and Subjected diverge? (e.g., foreign pollution victims).
      *   *Revised Crux 3:* Transboundary Harms (Pollution/Migration). Do external victims get votes?
          *   *AIA:* Yes, if affected.
          *   *ASC:* No, unless they become subjects (or if we create new supranational bodies).

  6.  **Addressing the "Verbal vs. Substantive" Issue:**
      *   Where do they talk past each other? Likely around the word "Democracy." One means "rule by stakeholders," the other means "self-rule of a community." Also "Coercion" – AAI sees economic/environmental impacts as coercive enough to warrant inclusion.
      *   Identify this specifically in the document.

  7.  **Review and Refine:**
      *   *Check Tone:* Is it too academic? Keep it readable but precise.
      *   *Check Adversarial Collaboration Format:* Ensure the "Agreement" section isn't fluff. The table needs clear dichotomies.
      *   *Check Specific Prompt Requests:* Did I include the global democracy crux? Yes. Did I include non-citizens/pollution? Yes.
      *   *Self-Correction on Shared Claims:* Make sure Claim 5 explicitly mentions "feasibility" so they can't dismiss practicalities later. Make sure Claim 2 emphasizes that *exclusion* needs justification, not that exclusion is impossible.

  8.  **Final Polish:** Organize with clear headings. Add an intro note explaining how to use the document. Ensure the formatting (Markdown tables) works well. (Self-correction: Ensure the distinction between "citizenship" and "demos membership" is handled carefully in the ASC column, as strict ASC theorists often argue residents *are* part of the demos because they are subjected, even if they lack formal citizenship. I should reflect this theoretical nuance.)

  9.  *(Final thought before output)*: Make sure the Crux section asks "What would change your mind?" This is essential for adversarial collaboration.

  Let's assemble the document.cw
answer: |-
  **Document Title:** Adversarial Collaboration on the Boundary Problem of Democracy
  **Participants:** [Reading Group Names]
  **Date:** [Current Date]
  **Status:** Draft for Consensus Verification

  ---

  ### Introduction & Instructions for Use
  This document is designed to move the discussion from debate to collaborative inquiry. We commit to the following norms while using this text:
  1.  **No Strawmen:** Arguments must be attributed to their strongest proponents within each camp.
  2.  **Steel-manning:** Before critiquing a point, ensure you can summarize it to the satisfaction of the person holding that view.
  3.  **Verifying Sign-off:** A claim is only "shared" if members of *both* camps read it and feel comfortable attaching their signature to it without mental asterisks.

  ---

  ### Part I: Shared Foundations (Agreed Claims)
  *The following numbered statements represent areas of consensus. These are not trivial platitudes; they establish the terms under which the disagreement takes place.*

  1.  **The Logical Circularity is Real.** We agree that defining *the demos* prior to the exercise of democratic authority creates a paradox: the boundaries of the people cannot themselves be democratically decided without already presupposing who "the people" are.
  2.  **Exclusion Requires Justification.** There is no default right to exclude. Any proposed boundary that excludes a group must bear the burden of proof to demonstrate why that exclusion is morally permissible.
  3.  **Democracy Serves Agency and Protection.** Regardless of the specific principle used, the purpose of democratic inclusion is twofold: to respect the agency of persons as self-governing beings and to protect them from unaccountable power over their lives.
  4.  **Disagreement on Causality Matters.** We acknowledge that the dispute is partly empirical. It depends on what counts as "affecting" someone's interests or "subjecting" them to power, and these definitions depend on how we trace causal chains in complex global systems.
  5.  **Feasibility is a Second-Order Constraint.** While normative principles determine the *ideal* boundary, we acknowledge that practical constraints (epistemic capacity, administrative logistics, stability) may necessitate approximations of the ideal, though they do not replace it.
  6.  **Institutionalization Matters.** We reject purely philosophical solutions that ignore institutional design. A valid theory of the boundary must specify *how* that boundary gets policed or adjusted in practice (e.g., courts, treaties, constitutional amendments).

  ---

  ### Part II: Table of Fundamental Disagreements
  *For each sub-question below, the All-Affected (AAI) and All-Subjected (ASC) camps must verify that their respective answers accurately reflect their position before proceeding.*

  | Sub-Question | All-Affected Interests (AAI) Position | All-Subjected Coercion (ASC) Position |
  | :--- | :--- | :--- |
  | **1. Moral Basis of Inclusion** | Membership is grounded in **stakeholding**. Those who face consequences (benefits or burdens) of a decision have a right to participate in making it. Justice flows from the distribution of impacts. | Membership is grounded in **subjection**. Those bound by the coercive force of law and order have a right to resist arbitrary rule. Justice flows from freedom from domination within a jurisdiction. |
  | **2. Primary Unit of Politics** | The unit is **issue-specific and fluid**. Different policies may legitimately draw different boundaries (e.g., climate vs. local zoning). Boundaries should adjust to the scope of the problem. | The unit is the **sovereign polity/state**. A stable, continuous legal personality is required for accountability and collective action. Fragmented boundaries undermine responsibility. |
  | **3. Handling Externalities** | If Policy A harms Person B outside the border, B is excluded from the relevant demos only arbitrarily. Externalities are a failure of the current boundary, requiring expansion. | Externalities are tragic but do not automatically grant voting rights. Remedying them requires international treaties or state compliance, not necessarily enfranchising foreigners. |
  | **4. The Role of Law** | Laws are important, but **power and influence** matter more. Economic sanctions, blockades, or environmental damage exercise coercive power comparable to statutory law. | **Formal legal authority** is the specific mechanism of legitimate democracy. Informal pressure (money, geography) is not sufficient for inclusion, or else every actor affecting any actor would count. |
  | **5. Long-Term Non-Citizen Residents** | They should vote because their daily lives are deeply affected by domestic policy decisions (housing, schools, economy). Duration implies stakeholding. | They should vote because they are subject to the **rule of law** (arrest, taxation, regulation). Citizenship status is secondary to actual subjection to state force. |
  | **6. Global Implications** | A consistent application leads toward **cosmopolitan structures**. Since few issues are truly contained, we must eventually build supra-national democratic bodies to match the scope of effects. | This leads to the fragmentation of sovereignty. We must preserve the **nation-state model**, strengthening it internally rather than dissolving its borders externally. |

  ---

  ### Part III: Cruxes — Deciding Factors
  *These are specific points where, if resolved one way or another, the theoretical debate would shift significantly. Both sides must predict their outcome based on the agreed-upon evidence.*

  #### Crux 1: The "Global Collapse" of Affectedness
  *Does the All-Affected principle inevitably require global democracy?*
  *   **The Question:** If causal chains connect every human action to every other (via economics, environment, etc.), does AAI logically demand a single global demos, and is that a fatal flaw (unworkable/impractical)?
  *   **Shared Evidence Required:** Empirical thresholds of causal significance. At what level of remote causation does moral obligation to include diminish? (e.g., Does buying a shirt affect laborers abroad enough to give them a vote in my consumption habits?)
  *   **AAI Prediction:** No collapse. We can set a threshold of **"significant and direct"** effect. We will support regional or functional bodies (like EU assemblies) rather than a single global state.
  *   **ASC Prediction:** The threshold is inherently arbitrary. Without a fixed legal boundary, AAI lacks coherence. Therefore, ASC’s reliance on sovereign territory is necessary to avoid infinite regress.

  #### Crux 2: Physical Coercion vs. Structural Harm
  *Is being forced by a soldier the same kind of wrong as being forced by economic necessity caused by a distant government?*
  *   **The Question:** ASC relies heavily on *legal/physical coercion*. AAI views systemic harm (e.g., climate change from foreign factories) as a form of coercion/violation of autonomy.
  *   **Shared Evidence Required:** Comparative harm assessments. Can we objectively measure whether a foreign factory causing asthma is a lesser violation of autonomy than a foreign tax collector demanding goods?
  *   **AAI Prediction:** Structural harm denies autonomy just as effectively as physical force. Therefore, excluding victims of foreign policy-induced harm violates their agency.
  *   **ASC Prediction:** Legal subjection is a unique relationship of accountability. Without the ability to sanction the ruler directly via the ballot, there is no leverage to fix structural harm anyway. Therefore, inclusion is pragmatically moot.

  #### Crux 3: The Case of the Permanent Resident
  *Are legal residents fully part of the demos solely because they pay taxes and follow laws?*
  *   **The Question:** This tests the overlap. Most agree permanent residents should vote. Why? Because they are subject? Or because they are affected?
  *   **Shared Evidence Required:** Analysis of jurisdictions where residents *cannot* vote (e.g., US states vs. some municipal codes). Does disenfranchising them increase resentment/political instability without improving governance?
  *   **AAI Prediction:** Their inclusion validates the AAI principle (they are affected) but is often justified politically as a pragmatic concession to stability.
  *   **ASC Prediction:** Their inclusion validates the ASC principle (they are subject) and proves that citizenship status is irrelevant to the *moral* boundary of the demos.

  ---

  ### Part IV: Verbal vs. Substantive Diagnosis
  *After completing the above sections, please mark which parts of our previous arguments were merely semantic.*

  **Potential Verbal Trap:** *"Who rules whom."*
  *   **Diagnosis:** We often assume AAI wants "outsiders" to rule "insiders." This is incorrect. AAI wants the *decision-making power* to move closer to where the *impact* lands.
  *   **Resolution:** Clarify that AAI does not necessarily seek to overthrow local self-determination but to limit the scope of policies that spill over.

  **Potential Verbal Trap:** *"Coercion."*
  *   **Diagnosis:** ASC uses "coercion" to mean "state legal monopoly on force." AAI uses it to mean "any constraint on freedom of choice imposed by others."
  *   **Resolution:** Agree to define "Political Coercion" strictly as **state-backed legal liability** for the purposes of this study session. Acknowledge that *economic* coercion is a separate category of normativity.

  ---

  ### Next Steps
  1.  **Sign-off:** Each member initial beside the claims in Part I they accept.
  2.  **Vote:** Cast a private vote on which Crux prediction (Part III) you find most plausible.
  3.  **Discussion:** Re-open debate only focusing on the items marked as "Substantive Disagreement."

  ---
  *End of Document*
