  # The Desiderata of Consent: An Adequacy Checklist

  To serve as an adequate theory of consent, a framework must navigate the treacherous waters between protecting individual autonomy and enabling social cooperation. Below are the necessary desiderata—functional requirements and case-handling standards—that any robust theory of consent must satisfy. These are drawn from the intersections of sexual ethics, medical ethics, and contract law.

  ### 1. The Voluntariness Condition
  **Requirement:** The theory must distinguish choices made under threat from those made under genuine freedom. It must account for power differentials that vitiate permission.
  *   **Case Consideration:** In **contract law**, a tenant signing a lease due to fear of homelessness is still considered bound in many jurisdictions (*economic duress* exceptions notwithstanding), whereas in **sexual ethics**, agreeing to sex solely to avoid job retaliation from a superior is widely regarded as non-consensual coercion.
  *   **Function:** Consent must act as a filter against exploitation. It cannot be merely the absence of "no," but the presence of meaningful alternatives.
  *   **Divergence:** Medical ethics often imposes a higher threshold on voluntariness (e.g., a patient under acute physical distress may lack the *capacity* to be voluntary, rendering consent void), whereas contract law prioritizes the stability of agreements, tolerating higher degrees of leverage and pressure before finding consent invalid.

  ### 2. The Communicative Threshold
  **Requirement:** The theory must specify which behaviors constitute a valid signal of consent and which do not. It must resolve whether silence, implication, or explicit utterance is required.
  *   **Case Consideration:** In **medical ethics**, a patient remaining motionless during a blood draw implies consent, but signing a surgical waiver is required for major procedures. In **contract law**, accepting goods by opening a package constitutes acceptance (performance). In **sexual ethics**, however, silence is increasingly viewed as non-consent rather than implied permission, particularly in affirmative consent models.
  *   **Function:** Consent must be legible to the recipient to prevent accidental harm. A purely internal state is useless if the other party cannot detect it.
  *   **Divergence:** Contract law accepts *implied* consent through conduct to facilitate commerce. Sexual ethics and modern medical protocols increasingly demand *explicit* verbalization or specific documentation to minimize ambiguity regarding bodily boundaries.

  ### 3. The Informational Standard
  **Requirement:** The theory must define the level of understanding required for consent to be valid. It must address the scope of knowledge necessary regarding risks, alternatives, and nature of the act.
  *   **Case Consideration:** **Medical ethics** operates on "Informed Consent": a patient who signs a form but misunderstands the mortality risk has arguably not truly consented. **Contract law** operates on *Caveat Emptor* (buyer beware); signing a contract without reading it is still valid. **Sexual ethics** is currently debating whether hiding an STI status or lying about identity (romantic fraud) invalidates consent.
  *   **Function:** Consent must function as a rational authorization. If the actor does not understand the "object" they are consenting to, the authorization is hollow.
  *   **Divergence:** Medical ethics places the burden of disclosure heavily on the professional (provider-centric). Contract law places the burden of inquiry on the actor (consumer-centric). Sexual ethics falls somewhere in between, asking what a "reasonable person" should expect to know.

  ### 4. The Revocability Principle
  **Requirement:** The theory must acknowledge that consent is dynamic, not static. It must allow for withdrawal of permission at any point where the act is continuing.
  *   **Case Consideration:** In **sexual encounters**, withdrawing consent mid-act transforms continued contact into assault. In **medical procedures**, a patient can wake up on the table and stop a procedure (though logistical factors apply). In **contract law**, withdrawing consent is often legally impossible once a deal is struck without breaching breach-of-contract penalties.
  *   **Function:** Consent preserves ongoing autonomy. It acknowledges that a person’s will may change even during the execution of a prior agreement.
  *   **Divergence:** Contracts bind future actions based on present consent to protect reliance interests. Medical and sexual contexts prioritize the immediate bodily integrity of the actor over the continuity of the interaction, allowing for immediate reversal without penalty.

  ### 5. The Normative Transformation Mechanism
  **Requirement:** The theory must explain *how* consent changes the moral/legal landscape. It must turn a prohibition (wrongdoing/battery) into a permission (treatment/permissible touch).
  *   **Case Consideration:** Without consent, removing a stranger's kidney is murder/battery. With consent, it may be a charitable transplant. Without consent, entering a home is trespass. With consent, it is a guest visit.
  *   **Function:** This is the "magic" of consent. The theory must justify why the agent's voice alters the status of the action for *both* the actor and the recipient.

  ***

  ### Cross-Domain Divergences
  While the desiderata remain constant, the operational application shifts:
  *   **Standard of Care:** Medical ethics uses a "Professional Standard" (what doctors know should be disclosed); Contract law uses a "Objective Standard" (what a reasonable person would interpret); Sexual ethics moves toward an "Affirmative Standard" (clear communication).
  *   **Consequences of Error:** In Contract Law, a mistake in judgment is rarely fatal to consent. In Medical Ethics, a mistake in risk assessment can invalidate consent entirely. In Sexual Ethics, a mistake induced by deception can render the act criminal (rape).

  ***

  ### Theoretical Tensions
  Two primary pairs of desiderata appear structurally incompatible, forcing theories to sacrifice one value for another.

  **Tension 1: Certainty vs. Autonomy (The Communication/Revocation Clash)**
  *   **Conflict:** The **Communicative Threshold** demands clear signals so recipients can act safely (Certainty). The **Revocability Principle** demands that agents can silently or suddenly withdraw consent (Autonomy).
  *   **Explanation:** If we require clear signals to revoke consent (to protect the recipient from surprise), we restrict the agent's autonomy (they can't just think "stop"). If we allow ambiguous withdrawal (to protect the agent), we endanger the recipient (who might genuinely believe they are permitted to continue). A theory cannot fully satisfy the need for the recipient to know *when* they have crossed the line and the agent to cross it instantly.

  **Tension 2: Internal Truth vs. External Appearance (The Voluntariness/Transformation Conflict)**
  *   **Conflict:** The **Normative Transformation** relies on the recipient seeing a valid permission. However, **Voluntariness** relies on the internal psychological state.
  *   **Explanation:** If consent is defined by *external appearance* (what was said/signaled), a coerced "yes" validates the transformation, violating voluntariness. If consent is defined by *internal truth* (actual desire), a terrified "yes" does not validate the transformation, leaving the recipient liable for battery despite acting reasonably. We cannot fully secure the recipient's reliance (external) and the actor's autonomy (internal) simultaneously.

  ***

  ### The Single Requirement That Eliminates Major Theories

  The single requirement that effectively eliminates the most popular families of theories is:

  **The Requirement of Symmetrical Moral Protection.**
  *Any adequate theory must demonstrate how it protects the actor from violation (by invalidating coerced consent) while simultaneously protecting the recipient from liability (by validating reasonable reliance).*

  #### Justification for Elimination
  This requirement exposes the fatal flaw in the three dominant theoretical families:

  1.  **Pure Mental-State Accounts:** (e.g., Consenting is simply a particular state of mind).
      *   *Why it fails Symmetrical Protection:* While this perfectly protects the **Actor** (if you didn't mean it, it wasn't consent), it fails the **Recipient**. A perpetrator could claim they had no way of knowing the internal state was negative (e.g., "They nodded 'yes,' but internally screamed 'no'"). This makes sexual or medical interactions perilous, as the recipient can never verify the protection status. It renders the social institution of consent practically unworkable.

  2.  **Pure Performative/Communicative Accounts:** (e.g., Consent is defined by speech acts or signals).
      *   *Why it fails Symmetrical Protection:* While this perfectly protects the **Recipient** (if you asked clearly and got a signal, you are safe), it fails the **Actor**. Coerced signals, drunken nods, or fraudulent agreements technically count as valid "performances." By prioritizing the external signal over the internal volition, the theory permits the victimization of those whose voices are manipulated, stripping consent of its core purpose (autonomy).

  3.  **Hybrid Views:** (e.g., Consent requires both intent and a signal).
      *   *Why it fails Symmetrical Protection:* Hybrids attempt to satisfy this requirement but invariably collapse into one side or the other under stress. When a court must decide, they must prioritize *either* the reliability of the signal (favoring the recipient) *or* the reality of the mind (favoring the actor). There is no mechanism in hybrid views to adjudicate the "Gray Zone" (e.g., someone signals 'yes' but is under subtle coercion) without making arbitrary cuts that favor one side of the symmetry over the other. Consequently, they cannot claim to deliver *Symmetrical* Moral Protection; they always lean toward the pragmatic needs of the recipient (law/courts) or the protective needs of the vulnerable (ethics), but cannot sustain both equally in practice.

  By demanding that a theory account for the moral security of *both* parties equally in the face of asymmetric knowledge, this requirement reveals that current theories function essentially as tools for either victim protection or actor protection, but not both. Until a theory solves the "Verification Paradox"—allowing one to know another's will without invading their privacy or ignoring their coercion—it remains inadequate.
