      *   *Key Insight:* Fitch's Paradox attacks *non-factive* verificationism or unrestricted knowability. The most robust defense is often to restrict the class of propositions to which (1) applies. This is the "Church-Fitch" limitation.
      *   *The "Gerrymandering" Concern:* How to justify the restriction without begging the question?
