      *   Premise 2 ($q$): Construct a specific proposition $q = (p \land \neg K p)$ where $p$ is an unknown truth.
      *   Step 3: If $q$ is true, then $q$ is knowable.
      *   Step 4: Knowing $q$ implies contradiction ($K(p \land \neg Kp) \implies Kp \land \neg Kp$).
      *   Step 5: Therefore, $q$ is not true. So there are no unknown truths.
      *   Conclusion: All truths are known ($\forall p (p \to Kp)$). This is the "Omniscience Principle," which contradicts our intuition that some truths are unknown.

  3.  **Evaluate Potential Responses to Fitch:**
