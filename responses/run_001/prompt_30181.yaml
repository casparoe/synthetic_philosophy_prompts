prompt: |-
  I've been trying to make sense of negative utilitarianism and I keep getting stuck on how its supposed to give any practical guidance. The view seems to start from the idea that no amount of happiness can outweigh even one person's suffering. But if you take that seriously, the obvious way to formalize it is to make suffering infinitely bad and happiness only finitely good. Then every world with at least a little suffering has total value of negative infinity, so a world where one person stubs their toe once comes out exactly as bad as a world where billions are tortured forever, as long as both contain some suffering. How do negative utilitarians compare two policies then, or do they really not care about degrees of suffering once any exists?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Topic:** Negative Utilitarianism (NU).
      *   **The Problem Identified:** The user is struggling with the practical guidance of NU. Specifically, they identify a formalization problem: if suffering is infinitely bad and happiness is finitely good, then any world with *any* suffering equals negative infinity. This leads to "leveling down" or indifference between worlds with different amounts of suffering (e.g., stubbing a toe vs. billions tortured).
      *   **The Question:** How do NU proponents compare policies? Do they really not care about degrees of suffering once any exists?
      *   **Underlying Concern:** The apparent absurdity/consequence of strong NU (the "infinitely bad" interpretation).

  2.  **Deconstruct the Misconception:**
