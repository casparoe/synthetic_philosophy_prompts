      *   Most contemporary philosophers who advocate for versions of NU reject this specific mathematical formulation ($-\infty$) because it makes decision theory impossible.
      *   I need to explain the distinctions between Strong NU, Weak/Negative Prioritarian NU, and Lexical NU, as well as how they handle the "infinity" problem.

  3.  **Formulate the Response Structure:**
