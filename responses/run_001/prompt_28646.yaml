      *   **Claim 2: Failure of the KK Principle.** ($Kp \to KKp$: If one knows $P$, one knows that one knows $P$).
          *   *Counterclaim:* Knowledge does not guarantee higher-order knowledge. One can know something without knowing that one knows it.
      *   **The Main Argument Against Luminosity (Timothy Williamson):**
          *   Involves a safety margin or margin for error principle.
          *   Scenario: A subject feels cold. The sensation gradually changes from cold to not-cold over time/conditions.
          *   Introspective discrimination breaks down as conditions change incrementally (JND territory).
          *   To *know* "I am cold," your judgment must be safe (not easily false). But if your discrimination threshold isn't perfect, there's a range where you are cold but your discrimination fails, so you don't *know* you're cold. Thus, the state isn't luminous.

