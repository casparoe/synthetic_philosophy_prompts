answer: |-
  There is no single, universally standardized academic term for this specific recursive trap, though political scientists and sociologists describe fragments of it using concepts like **"tokenism,"** **"co-optation,"** and **"performative consultation."**

  However, for a novelist, these terms feel a bit passive or abstract. They describe the *result* (people are ignored), but not the *mechanical trap* (the logic that forces the stalemate).

  If you need a name for your characters to use—a piece of jargon that sounds like something a cynical policy wonk or an opposition strategist would say—I recommend coining one of the following.

  ### Top Recommendation: **"The Legitimacy Trap"**

  This captures the core logical loop.
  *   **The Premise:** Elites claim the citizens' assembly needs to prove its "competence" and "legitimacy" before being granted real power.
  *   **The Trap:** Legislative legitimacy requires authority, but the pilot is designed to have no authority. Without power, the body struggles to enforce norms or protect itself, leading to chaos or irrelevance.
  *   **The Conclusion:** The failure is blamed on the *citizens'* inability to govern, rather than the *designers'* refusal to grant authority.

  **Why it works for fiction:** It sounds technical but carries emotional weight. Characters can debate whether someone has "fallen into the Legitimacy Trap."

  ### Alternative Option: **"The Advisory Lock-In"**

  This borrows from technology ("vendor lock-in") and emphasizes the permanence of the status quo. Once a body is designated as "advisory," it becomes structurally incapable of graduating. The status of "advisory" becomes its final state, regardless of performance.

  ---

  ### Distinguishing This From Related Concepts

  To ensure your world-building feels grounded, here is how you distinguish this dynamic from the common political tropes you mentioned.

  #### 1. vs. Regulatory Capture
  *   **Regulatory Capture:** An established agency starts serving the interests of the industry it regulates rather than the public.
  *   **Your Dynamic:** This isn't about the *assembly* capturing power; it's about the *establishment* capturing the *process*. The existing power brokers aren't corrupted by the sortitionists; they neuter the sortitionists to prevent corruption (and competition) in the first place.
  *   **Narrative Difference:** Regulatory Capture involves secret deals and bribes. Your trap is often transparent and publicly justified as "due diligence." The villainy lies in the logic, not the conspiracy.

  #### 2. vs. The Overton Window
  *   **Overton Window:** Defines what policies are politically acceptable to the mainstream.
  *   **Your Dynamic:** Sortition often shifts the Overton Window *temporarily* (people accept discussing random selection), but the pilot acts as a **window shade.** It lets light in (discussion) without breaking the glass (changing the system).
  *   **Narrative Difference:** The Overton Window explains why the idea can be *talked about*. Your dynamic explains why the idea can never be *implemented*.

  #### 3. vs. Foot-Dragging (Bureaucratic Stasis)
  *   **Foot-Dragging:** Slow-walking a change to kill it quietly over time (death by paperwork).
  *   **Your Dynamic:** This is active acceleration followed by a hard stop. The establishment *happily* funds the pilot, publishes the report, and celebrates the "success"—because the success is defined narrowly enough to justify doing nothing further.
  *   **Narrative Difference:** Foot-dragging is boring and frustrating. Your dynamic is insidious. The government appears enthusiastic, even innovative, while actually cementing their control.

  #### 4. vs. Tokenism
  *   **Tokenism:** Including a minority figure to give the appearance of inclusion.
  *   **Your Dynamic:** Tokenism is usually symbolic (a face in a photo op). Your dynamic is substantive but contained. The assembly *does* do work, hold hearings, and write reports. The work is real, but the *impact* is severed. It is **"Competent Irrelevance."**

  ---

  ### A Nuance for Your Novel: The "Double Bind"

  In psychology, a **Double Bind** occurs when a person receives conflicting messages where complying with one violates the other. This is the engine of your plot mechanic:

  1.  **Message A:** "You must prove you can handle responsibility."
  2.  **Message B:** "We will not give you responsibility until you prove it."
  3.  **Outcome:**
      *   If they succeed at advising, they are told, "You are great advisors! Let's keep you here."
      *   If they fail or struggle, they are told, "See? They aren't ready."

  If you want to make your novel feel analytically sharp, have one character articulate this. Perhaps a weary civil servant or a radical theorist who points out that the pilot is not a "test" in the scientific sense.

  > *"A scientific test changes one variable to see what happens. But this test changes the variables *after* the results come in. It's not a pilot program; it's a verdict written before the trial begins."*

  ### Summary for your World-Building
  *   **The Phenomenon:** "The Legitimacy Trap" (or "The Advisory Lock-In").
  *   **The Mechanism:** Granting voice without voice; competence without authority.
  *   **The Rationale:** Institutional risk management disguised as democratic caution.
  *   **The Outcome:** **"Reformist Stabilization."** (Using reform movements to stabilize the current regime by draining their radical potential).

  This distinction allows your characters to fight not just politicians, but *logic*. They have to break the algorithm, not just the ballot box.
