      *   *Claim 4:* "If you repeat the experiment a hundred times, you'll subjectively experience surviving all hundred times..." -> *Accuracy Check:* Yes, this is the probability calculation from the first-person perspective (conditional survival probability = 1 given existence).
      *   *Claim 5:* "...and at that point you'll know for sure that many-worlds is correct — you've personally verified it." -> *Accuracy Check:* Problematic. You can't verify MWI objectively for anyone else. Other observers see you die in most branches. It's solipsistic verification. Also, Copenhagen interpretation could also explain survival via sheer luck (low probability event happened).
