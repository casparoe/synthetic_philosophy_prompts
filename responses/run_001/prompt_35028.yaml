prompt: |-
  so i'm teaching this third-year module on practical rationality and i've just come back from the pub where i spent two hours going in circles with a mate about kavka's toxin puzzle. he kept saying "just intend to drink it, take the money, then don't" and i could not get him to see that the whole point is you can't just *decide* to intend something when you already know you'll have no reason to follow through. anyway it got me thinking that i want to set an exam question that actually forces students to confront the deep weirdness of the puzzle rather than just summarising what kavka said.

  so here's what i'd like. i need one essay question for the final exam, students get about 45 minutes for it. the question should zero in on why the toxin puzzle is a problem specifically for *instrumental* rationality — not just rationality in some vague sense — and whether any response that genuinely respects instrumental rationality can dissolve it. i want the question to separate students who've actually understood the structure of the problem from those who can only rehearse the example.

  then please give me a model answer of roughly 500–600 words. and a marking scheme that distinguishes an A from a B from a C by naming the specific moves each must contain. don't just say "an A answer shows deeper understanding" — name the arguments, the distinctions, the objections that an A answer must deploy.

  for the response: please write everything in continuous prose, no headings, no bullet points, no bold, no tables. just straight prose as if you were writing me an email. british english, obviously. and if you're going to put anything in quotation marks from kavka's actual paper, don't — i'd rather you paraphrase than guess at a quote.
