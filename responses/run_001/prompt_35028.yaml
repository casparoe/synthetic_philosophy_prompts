  Dear Colleague,

  It was good to catch up at the pub, though our debate on Kavka did leave me thinking quite deeply about how best to test whether students actually grasp the mechanics of the paradox rather than just memorising the story. I have drafted a question that targets instrumental rationality specifically, as well as a model answer and a detailed marking rubric that focuses on specific argumentative moves. Here is the proposal for the exam question. The question asks students to consider the following: To what extent does Greg Kavka’s toxin puzzle constitute a genuine challenge to a coherent conception of instrumental rationality? In your answer, explain why the puzzle cannot be resolved merely by appealing to strategic commitment, and assess whether any solution which remains faithful to the core principles of means-end reasoning offers a satisfactory dissolution of the paradox.

  Below is the model answer I have prepared, which sits right in the fifty-five hundred word range you requested, written in continuous prose. The toxin puzzle presents a specific pressure point for instrumental rationality because it isolates the formation of intention from the execution of action while maintaining a tight causal link via conditional payment. Instrumental rationality generally dictates that agents pursue effective means to their ends, yet here the intended end requires an action that ceases to serve that end the moment it is most costly. The crux of the difficulty lies not in the willingness to suffer harm, but in the possibility of genuinely intending to perform a bodily movement that one knows will lack justificatory reasons at the time of performance. If rational agency is constituted by responsiveness to reasons, forming an intention to drink the toxin appears irrational once the reward is secured, since the cost of drinking now exceeds any anticipated benefit. The paradox forces us to ask whether the rationality of an intention can derive solely from its consequences prior to action, or if the content of the intention itself demands future justification. Consequently, any solution grounded strictly in instrumental rationality must account for how an agent can rationally form an intention based on future incentives that vanish upon achievement. Some proposals suggest that the agent should bind themselves through external threats or internal commitments, such as promising to punish themselves if they fail to drink. However, these strategies often rely on adding new instrumental weights, like fear of punishment, that effectively alter the original dilemma rather than solving it. For strict instrumental rationality, a commitment is only valid if fulfilling it remains the optimal strategy at the moment of choice. If the agent retains the power to revoke the intention when the money arrives, then the initial intention was never genuine, as intentions presuppose a commitment to act regardless of shifting calculations. This highlights a fundamental tension between planning and deliberation: planning assumes stability, but deliberation assumes revisability based on new evidence of costs and benefits. Therefore, the puzzle suggests that instrumental rationality may be insufficient to generate intentions independently of immediate desires or beliefs about future efficacy. If an agent cannot intend to do X simply because intending to do X secures Y, provided doing X remains pointless, then instrumental norms cannot bridge the gap between strategic value and intentional state. Resolving the paradox entirely within the bounds of means-end reasoning seems impossible without conceding that rational intention involves a form of stability that transcends momentary calculation. This implies that a complete theory of practical rationality must supplement instrumental logic with constitutive norms of agency, perhaps positing that intentions have a default authority that resists immediate revision. Without such a supplement, the agent remains trapped in a loop where they cannot secure the reward precisely because they are too rational to follow through when the reason disappears. Thus, the puzzle ultimately exposes a fragility in the idea that all rational states must be justified by current evidence of utility. It demonstrates that the architecture of planning requires a level of psychological inertia that pure instrumentalism struggles to accommodate without collapsing into inconsistency. The deepest lesson is that instrumental rationality governs the connection between means and ends, but it cannot always manufacture the mental state required to initiate that chain when the endpoint proves unstable. When the payment is contingent on the intention being formed, not just the action taken, the temporal disconnect becomes acute. A purely causal view of intentions might allow an agent to trigger a disposition to drink, but instrumental rationality typically demands that dispositions track reasons. If the reason evaporates, the disposition should logically dissolve. Yet, the puzzle demands the disposition persists long enough to cash the cheque. This creates a scenario where rationality seems to require the agent to be irrational at the moment of consumption. Any robust defence of instrumental rationality must therefore distinguish between the reasons for adopting a plan and the reasons for executing parts of that plan later. If we cannot maintain this distinction, the concept of rational planning dissolves. Thus, the puzzle serves as a diagnostic tool revealing that instrumental rationality alone cannot explain the binding nature of past resolutions on future choices without treating commitments as intrinsic reasons.

  Finally, regarding the marking scheme, I want to ensure we distinguish grades based on specific analytical moves rather than general tone. An A answer must explicitly articulate the tension between the time-slice view of rationality and the diachronic view, demonstrating why knowing you will not have a reason to drink undermines the capacity to intend now. It must critically engage with self-binding strategies by arguing that they merely import new costs rather than solving the internal coherence problem, and it should conclude by identifying where instrumental norms break down, perhaps suggesting a need for constitutive norms of agency. A B answer will understand the plot and the contradiction but tends to treat the dilemma as a psychological trick or a failure of willpower rather than a normative failure of instrumentalism. Such scripts might claim the agent can simply decide, missing the insight that decisions require grounds which disappear post-payment, and they may accept precommitment solutions uncritically. A C answer typically retells the story and perhaps claims drinking the toxin makes sense if you care about the money, failing to identify the post-payment shift in reasons. These scripts conflate prudential desire with the rationality of intention formation and do not grasp the temporal asymmetry that drives the puzzle. I hope this helps you run a tight ship for the finals.

  Best wishes,

  [Your Name]
