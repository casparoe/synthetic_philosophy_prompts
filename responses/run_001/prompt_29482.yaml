      *   *Claim 2:* "It says to maximize the expected logarithm of your wealth, E[log W], rather than expected wealth E[W]." -> **Correct.**
      *   *Claim 3:* "This is formally equivalent to expected utility maximization with a log utility function u(x) = log x, so in a strict sense Kelly is just a special case of EU theory." -> **Debatable/Potentially Problematic.** This is the core philosophical/mathematical friction point. In a one-shot decision, yes. But Kelly is inherently *dynamic* (repeated bets). Standard EUT applies to single lotteries unless extended.
      *   *Claim 4:* "The reason log utility makes sense here is the same reason any concave utility function is used in economics: it captures diminishing marginal utility and risk aversion." -> **Potentially Incorrect/Misleading.** This is the "Ole Peters" criticism/Ergodicity Economics angle. Kelly isn't necessarily about risk aversion; it's about *survival* and *time-average growth*. Risk aversion implies you dislike volatility for a given mean return. Kelly implies volatility reduction is necessary for growth, even if you are "risk neutral" in the von Neumann-Morgenstern sense over a single period but care about long-term compounding.
      *   *Claim 5:* "Kelly also has the nice property that it maximizes your expected wealth in the long run, because by maximizing the geometric mean of returns you get the highest expected final bankroll." -> **Incorrect/Confused.** Maximizing the expected *logarithm* maximizes the *almost sure limit* of the growth rate. It does *not* maximize expected wealth (arithmetic mean) in the long run. If you want to maximize $E[W_T]$, you should bet everything (if $p > 0.5$). The Law of Large Numbers ensures the median outcome follows Kelly, but the *mean* outcome is dragged up by rare massive winners who went broke or kept betting high. This is a crucial distinction in formal epistemology (Ergodicity).
