answer: |-
  You are right to be suspicious. There is a massive amount of overlap between 2D semantics and the denotational machinery you use every day. The intuition pump behind 2D semantics—the Hesperus/Phosphorus case—is essentially asking: *When does a name freeze its definition (closure capture), and when does it leave its lookup open to the current state (dynamic dispatch)?*

  However, the reason it feels like "scope machinery dressed up" is that philosophers add metaphysical baggage to the distinction that PL researchers typically strip away as implementation detail.

  Here is the translation of the core of Two-Dimensional Semantics into your vocabulary, followed by the residue report.

  ### 1. The Translation: From Worlds to Stores

  In your world, a program state consists of an **Environment** ($\Gamma$) mapping identifiers to locations, and a **Store** ($\sigma$) mapping locations to values. A "World" in modal logic is roughly analogous to a complete, self-contained Store $\sigma$.

  #### The Two Indices
  Standard Kripke semantics (Single-Dimensional) evaluates a formula $\phi$ at a world $w$ relative to a model $\mathcal{M}$: $\mathcal{M}, w \models \phi$.
  Two-Dimensional Semantics (2DS) introduces a second coordinate. It evaluates $\phi$ at a pair of worlds $(w_1, w_2)$.
  *   **$w_1$ (The Center/Scenario):** The world considered as *actual*. This determines how references are resolved.
  *   **$w_2$ (The Circumstance):** The world considered for evaluation. This determines truth conditions of predicates.

  #### Primary Intension (The Epistemic Dimension)
  *   **Philosopher Definition:** The function from a world treated as actual to the extension of the term.
  *   **PL Analogy:** **Dynamic Symbol Resolution / Descriptor Lookup.**
  *   **Vocabulary:** A Higher-Order Function.
      Let `Name` be a variable. Its **Primary Intension** is a function $P: \mathsf{Store} \to \mathsf{Value}$.
      To evaluate $P(w)$, you run the search algorithm defined by the term inside the store $w$.
      *   *Example:* If the term is "The inventor of bifocals," $P(w)$ searches $w$'s historical records to find the person satisfying that property.
      *   *Code equivalent:* `fn resolve_name(name: String, ctx: Store) { lookup_property(ctx, name); }`

  #### Secondary Intension (The Modal Dimension)
  *   **Philosopher Definition:** The function from a world considered counterfactually to the extension, *given that the reference was fixed at the actual world*.
  *   **PL Analogy:** **Rigid Designator / Closure Capture.**
  *   **Vocabulary:** A Captured Environment / Global Constant.
      The **Secondary Intension** is a function $S: \mathsf{Store} \to \mathsf{Value}$.
      However, $S$ is generated *at the moment of binding* using the actual store $w_1$. It closes over the value found in $w_1$ and ignores the search algorithm for subsequent inputs.
      *   *Example:* Once we fix "Hesperus" refers to Venus in the actual world, the function becomes `return Venus` regardless of the input store (unless the input store is so divergent Venus ceases to exist, a boundary condition).
      *   *Code equivalent:* `const ref = resolve_name("Hesperus", ACTUAL_STORE); const secondary_intension = fn (any_store: Store) { return ref; };`

  #### Evaluating Sentences
  *   **A Posteriori Necessity (e.g., "Hesperus = Phosphorus"):**
      *   **Primary:** Variable. In some epistemic scenarios (where we haven't identified the stars yet), "The evening star" denotes Entity A, "The morning star" denotes Entity B. $P(w)$ returns false in those $w$.
      *   **Secondary:** Constant True. Once bound to the actual planet (Venus), $S(\sigma)$ returns true for all $\sigma$ (assuming rigid trans-world identity).
  *   **Analytic Truths (e.g., "Water = H2O" - *controversial in 2DS*):**
      *   If you treat "Water" as a rigid designator (Kripkean), Primary matches Secondary (True everywhere).
      *   If you treat "Water" as a descriptor ("watery stuff"), Primary varies across epistemic scenarios where XZY occupies the water-role.

  ---

  ### 2. Residue Report

  Here is where the mapping breaks down, requires fudging, or disappears entirely.

  #### A. Translates Cleanly
  **The Machinery of Reference Fixing.**
  The distinction between a "dynamic lookup" (searching the environment for a matching descriptor) and a "closed value" (capturing the value found at the point of definition) translates perfectly.
  *   **Philosophy:** Primary Intension (description-based) vs. Secondary Intension (rigid name).
  *   **PL:** `dynamic_resolve()` vs. `closure_capture()`.
  If a philosopher claims "Proper names are rigid designators," you can translate that to "Names desugar to global constants initialized at start-up, never re-bound." If they claim definite descriptions are non-rigid, you translate to "They desugar to thunks that fetch state on demand."

  **Modal Operators.**
  $\Box \phi$ translates cleanly to "True for all reachable states $\sigma'$."
  $\Diamond \phi$ translates to "Exists reachable state $\sigma'$ where..."
  The complexity of the transition system doesn't matter for the logical mapping.

  #### B. The Fudges
  **The Nature of "Scenarios" vs. "States".**
  In PL, a state is concrete. Memory bits, registers, stack frames. In 2DS, a "Scenario" is an epistemic possibility—something ideally conceivable.
  *   **Fudge:** When 2DS talks about "epistemic spaces," they aren't talking about reachable execution paths (dynamic analysis). They are talking about *information states*.
  *   **Mapping:** You have to treat the 2D world index not as a runtime `Memory`, but as a `ConfigurationFile` or `AbstractInterpreterState`.
  *   **Why it's a fudge:** In PL, we check *reachability*. In 2DS, we check *conceivability*. Your compiler rejects unreachable code; philosophers accept impossible worlds as valid semantic coordinates.

  **Indexicals ("I", "Here", "Now").**
  2DS relies heavily on centered worlds to handle indexicals.
  *   **Fudge:** You can model this via Thread-Local Storage or Implicit Context Parameters. `thread_id`, `current_time`.
  *   **The Friction:** In PL, context is explicit in the signature (dependency injection). In 2DS, context is a hidden coordinate of the evaluation relation $\mathcal{M}, w \models^c \phi$. The "center" moves.
  *   **Translation:** `eval(env, world, center_point)`. If `center_point` changes, the meaning of `this` changes.

  #### C. No Counterpart at All
  **Metaphysical Essence.**
  This is the biggest gap.
  *   **The Claim:** "Hesperus is necessarily Phosphorus" implies a link in reality that holds even if we didn't know it.
  *   **PL View:** Names are syntactic sugar. The object (memory address/ID) exists independently of the name. If I rename the pointer, the memory doesn't change.
  *   **Missing:** The distinction between *how* we refer (epistemic) and *what* we refer to (metaphysical). In PL, the "what" is fully exhausted by the "value." There is no "hidden essence" of an integer beyond its representation. Philosophers posit a layer of ontology *behind* the data structures.

  **Essentialism vs. Behavior.**
  Kripke argues that if Nixon hadn't won the election, he still wouldn't be the winner of the election, but he would still be Nixon (rigid designation).
  *   **PL Equivalent:** Identity is bitwise equality.
  *   **The Problem:** 2DS cares about *individuation criteria*. "What makes a thing itself across possible worlds?" PLs do not worry about this. A `struct Point` is `Point` regardless of its history. 2DS posits that we need to distinguish between *being water* (chemical structure) and *being the watery stuff* (functional role).
  *   **Result:** You cannot simulate the "Necessity of Origin" (biological essentialism) in a standard lambda calculus without adding an ontological annotation layer that PLs explicitly reject for good reason (simplicity/decidability).

  ---

  ### 3. The Verdict

  Is the untranslatable residue a sign your vocabulary is missing something, or that the philosophers are doing less work than they appear?

  **Verdict: It is largely philosophical overwork, but with a kernel of genuine insight regarding Epistemic Modality.**

  1.  **The Vocabulary Deficit:** Your vocabulary *is* sufficient to model the semantics of reference. We know how to bind variables and how to look them up dynamically. The only thing your vocabulary lacks is a formal type for "Metaphysical Grounding." But since you view grounding as irrelevant to computation (correctly, for the purpose of type checking), this is a feature, not a bug.
  2.  **The Philosophical Overwork:** A lot of 2D semantics is trying to solve the "Hesperus/Phosphorus" problem by creating a new dimension of space rather than accepting the simple programming solution: **"It depends on how the compiler binds the variable."**
      *   If the language declares `const`, it's Secondary (Rigid).
      *   If the language declares `var` with a getter, it's Primary (Descriptive).
      *   The debate about whether "Water" is rigid or descriptive is effectively a debate about whether the programming language treats that string as a `String` literal or a `Query` expression.

  **However, there is one thing PL is bad at capturing:**
  **Information State Updates.**
  PL deals with *state changes* (mutations). 2DS deals with *knowledge accumulation* (updating beliefs).
  In a PL, updating a variable changes the state. In 2DS, moving from a Primary Intension where "Water=XYZ" to one where "Water=H2O" represents the agent learning something about the world, not the world changing.
  *   **Gap:** Your standard environments represent the machine state, not the *observer's information* about that state.
  *   **Solution:** You would need **Belief Revision Logic** or **Partial Information Types** (like in dependent types with proof irrelevance) to model the *epistemic shift* accurately.

  **Summary:**
  Stop looking for "two dimensions" in the type system. The Primary/Secondary split is simply the difference between **Macro Expansion** (replacing text based on current config - Primary) and **Linking** (fixing a symbol address at compile-time - Secondary).

  The residue remains because philosophers want to talk about *truth in virtue of nature*, whereas you talk about *truth in virtue of typing*. Neither is wrong, but they optimize for different things. If you are building a compiler, the Secondary Intension is your Type, and the Primary is your Runtime Reflection. The fact that they don't align perfectly is usually called "Runtime Error," but in philosophy, it's called "A Posteriori Necessity."

  **TL;DR:** Your machinery can parse the sentence structure of 2D semantics. The metaphysics that drives it is unnecessary overhead for execution, but useful for specifying intent (contracts). If you want to be strict, the distinction is simply **Static Linking** vs. **Dynamic Dispatch**. Anything more is speculation.
