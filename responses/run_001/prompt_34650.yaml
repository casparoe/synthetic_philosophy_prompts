      *   **Core Belief:** The user is convinced by the Moral Luck argument (Nagel/Williams), covering resultant, constitutive, and circumstantial luck. They believe it undermines desert-based praise/blame.
      *   **Goal:** A "map of the strongest challenges" to this view.
