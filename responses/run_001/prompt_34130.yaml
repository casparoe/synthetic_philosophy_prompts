answer: |-
  # Q&A Prep Sheet: Shifting Inferential Frameworks
  **Audience:** Social/Cognitive Psych Dept (Mixed Seniority)
  **Goal:** Defend Bayesian shift as epistemic, not just technical.
  **Language:** American English

  ---

  ### TIER 1: THE EXISTENTIAL THREATS
  *If you stumble here, the room decides your proposal is either dangerous or naive.*

  #### Q1: The "Hidden Subjectivity" Attack
  **Colleague Voice:** *"Look, I hear you on the 'p-hacking' issues. But here's the thing that keeps me up at night. With NHST, we know the rules. We set alpha at .05 and check if $p$ drops below it. With Bayes, you're telling us we have to pick priors. To me—and I suspect my students too—that looks like choosing your data to fit your theory. Isn't that just trading one form of bias for another? How do you defend that against the charge that it's less objective than what we do now?"*
  *(Likely source: The skeptical Senior Guy)*

  **Your Reply (Approx. 2 mins):**
  "That is the biggest hurdle, and frankly, it’s the fair one. When we say 'objectivity' in NHST, what we really mean is procedural consistency. We all agree on $\alpha = .05$. But that agreement masks a lot of flexibility. We choose the sample size, we decide which controls to include, we filter outliers based on arbitrary criteria—those are all analytical degrees of freedom that impact the $p$-value, yet they feel like 'just doing the analysis.' Bayes forces those decisions into the open via the prior. Is it subjective? Yes. But it's *transparently* subjective.

  My argument is that transparency is safer than hidden flexibility. If you use an 'uninformative' or default prior, I'll show you later how that still imposes structure. But if we state our prior—why we expected an effect, or why we were neutral—we can argue about that justification. You can't argue about a $p$-value being 'wrong'; you just report it and move on. With Bayes, the prior invites scrutiny of the theory *before* the data comes in. So, it's not about making science purely objective—which is impossible anyway—it's about moving the subjectivity out of the black box and onto the discussion table where we can actually debate the science."

  **⚠️ WEAK SPOT:** You cannot prove that "transparency equals truth." You must concede that a biased theorist could still manipulate a prior. Be careful not to imply that NHST researchers are lying; focus on the *hidden* vs. *explicit* nature of the choice.

  #### Q2: The "Nuke the Archive" Fear
  **Colleague Voice:** *"This seems to imply that almost everything published ten years ago is invalid. A lot of people in this room did the 'best practice' of their day—set power at 80%, ran the correct ANOVA. If we switch frameworks now, does that invalidate the foundation we built our careers on? Or are we saying we should ignore that literature?"*

  **Your Reply (Approx. 2 mins):**
  "I absolutely do not want us to dismiss twenty years of research. What I'm arguing isn't that those studies were *wrong*, but that the certainty attached to them was overstated. If you had a study with $N=30$ and a $p=.04$, the standard narrative was 'we found an effect.' That implies evidence *for* the hypothesis. Under the Bayesian view, that same result might provide only anecdotal evidence, barely better than chance.

  That doesn't mean the effect didn't exist or that the lab didn't try; it means our language about the strength of the evidence was too confident. Re-evaluating old findings isn't about calling names; it's about calibration. If we accept these papers as 'proven,' we get stuck on replicating noise. If we re-calculate the evidence using Bayes factors, we get a continuous measure of support. It treats the literature as a cumulative record of evidence weights rather than a binary list of 'significant' vs 'null' findings. Most of those papers survive that test; some just lose their status as 'conclusive proof.'"

  **⚠️ WEAK SPOT:** This touches nerves. You risk sounding condescending about their past work. Keep the focus on *our shared history*, not their error. Do not offer to go back and re-run their specific analyses unless asked.

  ---

  ### TIER 2: THE PRACTICAL & STRATEGIC THREATS
  *These won't end the talk, but they will determine if people vote to adopt this next semester.*

  #### Q3: The "Preregistration is Enough" Counter
  **Colleague Voice:** *"A lot of us are already buying into the Open Science movement. We preregister now. We share data. We run bigger samples. Isn't that solving the replication crisis without throwing away half a century of statistical tradition? Why complicate the workflow with Bayes if the solution is just discipline?"*

  **Your Reply (Approx. 2 mins):**
  "I think preregistration is fantastic and it needs to be standard. But I argue it solves the *flexibility* problem, not the *interpretation* problem. Even if you preregister an analysis perfectly and collect $N=500$, you can still get a $p=.04$. Does that mean the null is false? No, it means the data is rare under the null. Preregistration stops you from fishing for that $p$-value, but it doesn't tell you how much weight to give the result relative to the alternative hypothesis.

  With NHST, you always compare data to the null. You never directly quantify support for your actual theory. Bayes allows you to ask 'How much more likely is this data given my hypothesis compared to the null?' Preregistration gives us integrity; Bayes gives us sensitivity. We need both, but integrity without proper sensitivity tools still leaves us unable to distinguish between a weak signal and noise efficiently."

  **⚠️ WEAK SPOT:** You are fighting two good ideas against one new idea. Preregistration is popular. You cannot frame Bayes as "better than prereg." It must be "complementary." If you sound anti-prereg, you lose the modernists.

  #### Q4: The "Learning Curve" Burden
  **Colleague Voice:** *"You're asking us to unlearn how to teach our undergrads intro stats and how to run their own grant applications. Journals don't even know how to review these papers properly. Is it realistic to expect the whole department to pivot on this, or should we just let the early adopters do it?"*

  **Your Reply (Approx. 2 mins):**
  "It is unrealistic to expect everyone to become Bayesian experts overnight. My goal for this talk isn't to demand we all throw out SPSS tomorrow. I'm suggesting we pilot the approach on high-stakes projects—new theoretical directions, expensive longitudinal work where we can't afford to misinterpret noise.

  There are also tools improving rapidly. R packages are automating prior selection for common designs. My hope is that eventually, journals start requiring Bayes Factors alongside $p$-values just to hedge their bets. We can start small. If I'm right about the interpretive power, the field will pressure us to catch up regardless of whether we want to. Better to lead the adoption curve than get dragged behind it when reviewers start demanding the extra metric."

  **⚠️ WEAK SPOT:** The claim that "journals will demand it" is speculative. Many top psych journals remain very NHST-centric. Don't predict a revolution; predict a slow drift.

  ---

  ### TIER 3: THE PRAYER QUESTION
  *The question you want to avoid because your argument relies on a consensus that isn't universally agreed upon.*

  #### The Question: **"How do you specify the Prior when studying a novel phenomenon?"**
  **Colleague Voice:** *"Okay, I get it when we're testing drug effects or cognitive priming where we have decades of meta-analysis to guide us. But what if I'm exploring something completely new? I don't have a distribution to pull from. If I have to guess the prior for a brand-new effect size, aren't I just putting my wishful thinking into a formula? Doesn't that defeat the purpose of data-driven inference?"*

  **Why this hurts you:**
  This is your genuine soft spot. Bayesian statistics assumes information comes from previous knowledge or strong defaults. In exploratory social psych, we often look for things we don't expect. Justifying a prior there feels circular. There is no "neutral" prior that works for everything.

  **Your "Safe Harbor" Answer (If forced to answer):**
  *"This is the hardest part, and I agree: in truly novel exploration, the prior is fragile. That's where sensitivity analysis comes in. You don't present one number; you present the outcome across a range of plausible priors—from conservative to optimistic. If your effect holds up across all reasonable assumptions, then you have discovered something robust. If the conclusion flips depending on the prior, then you haven't learned enough yet. I wouldn't recommend Bayes for purely exploratory data mining until that literature starts building up; for novel work, stick to descriptive rigor and larger samples. Bayes shines best when theory and data meet, not when neither exists yet."*

  **Strategy Note:** You must admit limitation here. If you claim Bayes solves *exploratory* research, you are lying. Concede that for pure discovery, NHST + Big Samples is still the standard, but Bayes helps clarify the results once you move to confirmation.

  ---

  ### FINAL TIPS FOR DELIVERY
  1.  **Don't hide the math entirely.** Write one simple equation on the board to show that $BF = \frac{P(Data|H1)}{P(Data|H0)}$. Contrast it with $P(Data|H0)$ alone. Visual learners in the room will feel relieved.
  2.  **Validate the Ritual.** When talking about ANOVAs, say "Those are useful tools" before critiquing them. Don't burn the bridge you stand on.
  3.  **Humanize the Failure.** Early in the Q&A, briefly reference your personal replication failure again. "I wish I had the tools I'm proposing today six years ago. It saved me years of chasing ghosts." This grounds you in humility rather than superiority.
