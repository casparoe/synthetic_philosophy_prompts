answer: |-
  ### Activity Title: The Innovation Committee Protocol
  **Target Audience:** Mixed-age philosophy/social science reading group (10–14 participants).
  **Duration:** 90 Minutes.
  **Objective:** To generate a collective decision that contradicts the group’s aggregated premises, forcing the realization that "group rationality" is ill-defined.

  ---

  ### I. Materials & Setup

  **1. The Case File (Handout for each participant)**
  *Print one copy per person. Do not distribute the scoring rubric yet.*

  > **Subject:** Proposal #24-Beta ("Neuro-Stimulus Interface")
  >
  > **Summary:** The applicant proposes a new non-invasive neural interface designed to restore motor function in stroke patients.
  >
  > **Criterion A (Technical Feasibility):** Based on peer review, the prototype shows statistically significant efficacy in trials compared to existing standards. (*Assume this criterion is met.*)
  >
  > **Criterion B (Ethical Risk):** The device utilizes deep brain recording without full user-side transparency. There is a 10% probability of data leakage to third-party advertisers during future updates. (*Treat this as a serious negative.*)
  >
  > **Agency Mandate (The Rule):** According to the Foundation's bylaws (Section 4.1), a grant **MUST BE APPROVED** if and only if:
  > 1. Technical Feasibility is confirmed **AND**
  > 2. Ethical Risk is deemed manageable.
  > *(Note to user: For the sake of this exercise, assume the group treats "manageable" as the inverse of "unacceptable." If you think the risk is unacceptable, you vote NO on the mandate, regardless of feasibility.)*
  >
  > **Deliverable:** As the committee, you must issue a binding recommendation: **APPROVE** or **REJECT**.

  **2. The Ballot Slip (Individual)**
  *A simple sheet divided into three boxes.*

  > **Committee Member ID:** _____________
  >
  > **[ ]** I judge Technical Feasibility to be **SATISFACTORY**.
  > **[ ]** I judge the Ethical Risk profile to be **ACCEPTABLE**.
  > **[ ]** I recommend the grant be **APPROVED**.
  > *(Note: Your recommendation is binding. You may vote Yes/Yes/No or Yes/No/Yes.)*

  **3. Whiteboard Layout**
  Draw a grid on the board *before* class starts:

  | Judgment | Count (Yes) | Count (No) | Major? |
  | :--- | :--- | :--- | :--- |
  | 1. Feasibility (P) | _______ | _______ | |
  | 2. Ethics (Q) | _______ | _______ | |
  | 3. Approval (R) | _______ | _______ | |

  **4. Timer:** Visible to the group.

  ---

  ### II. Facilitator Preparation (Secret Notes)

  **Your Goal:** The "Magic Numbers" required for the paradox to appear visually.
  With 12 voters, you ideally need:
  *   **Feasibility (P):** 8 Yes (Majority)
  *   **Ethics (Q):** 8 Yes (Majority)
  *   **Approval (R):** 4 Yes (Minority -> Rejection wins)

  **Why?** Because logic dictates $(P \land Q) \to R$. If P=Yes and Q=Yes, R *should* be Yes. If the majority says R=No, the dilemma exists.

  **Contingency:** It is difficult to guarantee this split in a live group of free-willed agents. You must scan the room during the deliberation phase. If the conversation seems polarized (e.g., half love the tech, half hate the ethics), the paradox is highly probable. If everyone is drifting toward "Reject," prepare the **Recovery Script** (see Section V).

  ---

  ### III. Timeline (90 Minutes)

  #### Phase 1: Briefing (15 Minutes)
  *   **0:00 – 0:05:** Welcome. State objective: "We are acting as a grant review panel today. We have 45 minutes to decide."
  *   **0:05 – 0:15:** Distribute Case Files. Allow silent reading. Read the "Agency Mandate" aloud clearly. Emphasize: *"You must fill out every line on your ballot individually. We will discuss briefly, then vote immediately."*
  *   **Facilitator Note:** Do not explain *why* the rules exist beyond the text. Maintain neutrality.

  #### Phase 2: Deliberation (15 Minutes)
  *   **0:15 – 0:30:** Open floor. Encourage people to share their reasoning.
  *   **Task:** Try to reach a consensus if possible. If consensus fails, vote.
  *   **Facilitator Monitoring:** Listen for the split.
      *   *Speaker A:* "The science is undeniable (Yes), but the privacy issue kills it (No)." -> **(Y, N, N)**
      *   *Speaker B:* "It risks data, but health benefits outweigh the ethics (Yes to both?)." -> **(Y, Y, Y)**
      *   *Speaker C:* "Science isn't ready yet, though ethics are fine (No, Yes, No)." -> **(N, Y, N)**
      *   *Tip:* If you see everyone agreeing on P but splitting on Q, you might not get the paradox. Gently probe: *"Has anyone found the feasibility lacking?"* If not, proceed to voting.

  #### Phase 3: The Voting (10 Minutes)
  *   **0:30 – 0:35:** Hand out Ballot Slips.
  *   **0:35 – 0:40:** Anonymous voting. Collect slips in a box or envelope.
  *   **Facilitator Action:** Quickly tally the counts. Do NOT announce the result yet. Update the Whiteboard Grid silently but visibly while people chat.
      *   *Fill in the counts for P and Q first.*
      *   *Wait, check the result for R.*

  #### Phase 4: The Reveal & Discovery (20 Minutes)
  *   **0:40 – 0:45:** Present the Board. Point to Column 1 (Feasibility): "A clear majority finds the science sound." Point to Column 2 (Ethics): "A clear majority finds the risk acceptable/manageable."
  *   **0:45 – 0:55:** Turn attention to Column 3 (Approval). "However, a clear majority recommends REJECTION."
  *   **0:55 – 1:00:** Stop talking. Let the silence hang for at least 30 seconds.
  *   **Prompt Question:** *"We have a committee that agreed on the inputs, but disagreed on the output. Which number represents the 'Group's View'?"*
      *   *Allow participants to struggle with this.* Do not solve it for them yet.

  #### Phase 5: Structured Debrief (20 Minutes)
  *   **1:00 – 1:15:** Discuss the options. Write them on the board.
      1.  **Follow the Majority on the Conclusion (R):** We reject the grant, even though most people accepted the criteria. (Disrespect the criteria).
      2.  **Follow the Majority on the Premises (P & Q):** We approve the grant (forcing R), even though most people voted against the grant itself. (Disrespect the final judgment).
      3.  **Retrial:** Send it back to a sub-committee?
  *   **1:15 – 1:20:** Introduce the formal concept. *"In political theory and logic, this specific structural failure has a name. It is called the **Discursive Dilemma**."*
  *   Explain the distinction between **Premise-Based Procedures** (aggregating facts first) and **Conclusion-Based Procedures** (aggregating decisions directly). Neither guarantees consistency with the other.

  #### Phase 6: Closing (10 Minutes)
  *   **1:20 – 1:30:** Final reflection. How does this apply to juries, legislative bodies, or corporate boards? End with a question: *"When the group disagrees with itself on what is 'consistent', who gets to decide?"*

  ---

  ### IV. Facilitator Script & Guardrails

  **What to Say (Before the Reveal):**
  *   "Please ensure you answer all three questions independently. Even if you know what you want to conclude, vote honestly on the criteria."
  *   "There is no 'correct' vote. We are simulating real uncertainty."
  *   "Remember the Agency Mandate: If you vote Yes on Feasibility and Yes on Ethics, you are logically committed to Yes on Approval."
      *   *Why this phrasing:* It emphasizes the logical link without telling them they *must* vote consistently (which generates the paradox when they don't).

  **What NOT to Say (Before the Reveal):**
  *   Do NOT say: "Look out for contradictions."
  *   Do NOT say: "One of these will be problematic."
  *   Do NOT say: "Don't worry if you change your mind." (Keep the vote static).
  *   Do NOT name the problem (Discursive Dilemma/Pettit's Paradox).

  **Script for the "Silence" (After Revealing the Board):**
  *   "Take a look at the columns. If we go by the criteria, we fund it. If we go by the decision, we don't. Can we claim to be one rational agent if our parts disagree with our whole?"

  ---

  ### V. Troubleshooting: What Goes Wrong & Recovery

  **Problem 1: The Numbers Land Cleanly (Unanimity or Single Outcome)**
  *   *Scenario:* Everyone votes Yes/Yes/Yes. There is no paradox.
  *   *Risk:* You spent 90 minutes building tension for nothing.
  *   *Recovery Strategy:*
      1.  **The "Counter-Factual" Pivot:** "Excellent consensus. But let's imagine for a moment that one more person on this team had worried about the ethics. If they changed their 'Yes' to 'No' on Ethics, but kept their 'No' on Approval... and another person changed 'No' Feasibility to 'Yes' Feasibility but kept 'No' Approval... would we still be unanimous?"
      2.  **Simulation Mode:** Admit that getting the exact distribution is rare. "In a typical diverse panel, the probability of landing exactly here is 15%. Since we got lucky, let me walk us through the theoretical configuration where this happened." Draw the theoretical 3-person model (Indiv 1, 2, 3) to show *why* the divergence happens structurally, not just historically.

  **Problem 2: Tie Votes (Even Number of Voters)**
  *   *Scenario:* 6 Yes / 6 No on a premise.
  *   *Risk:* Ambiguity prevents the "Majority Contradiction."
  *   *Recovery Strategy:* Implement a standard parliamentary rule. "In case of a tie, the chair (me) votes to preserve status quo (Reject)." Or, designate one senior member as a tie-breaker beforehand.

  **Problem 3: Participants Claim "The Rules were Stupid"**
  *   *Scenario:* "Of course I'd vote Reject! The criteria weren't linked properly."
  *   *Risk:* They attack the setup instead of the logic.
  *   *Recovery Strategy:* Validate them. "That is a valid critique of *institutional design*. Many philosophers argue the mandate itself is flawed. But assuming the mandate stands—which reflects reality where rules constrain us—how do we resolve the inconsistency within those rules?"

  **Problem 4: Strategic Voting Emerges**
  *   *Scenario:* Participants lie on the ballot to manipulate the outcome.
  *   *Risk:* The "paradox" was manufactured by gaming, not by aggregation.
  *   *Recovery Strategy:* Address it in debrief. "Strategic voting (insincere voting) is often the fix used in real politics. It preserves the consistency but loses the truthfulness. Which is the greater evil: a consistent committee that lies, or an honest committee that acts irrationally?"

  ---

  ### VI. Philosophical Limitations (For your own knowledge)

  *Note to the user: Add this to your internal understanding, or bring it up if advanced students press for nuance.*

  **What this activity CANNOT reproduce:**
  1.  **Iterative Revision:** In the classroom, we vote once. In real organizations, committees revise their judgments when faced with inconsistency (e.g., "We said Yes on Feasibility, so we must change our vote on Ethics"). This activity freezes the moment of paradox.
  2.  **Power Dynamics:** A Chairperson can usually overrule a paradox by citing procedure. The activity assumes a flat hierarchy where the aggregation rule is rigid.
  3.  **Complexity of Propositions:** Real policy involves dozens of interlocking variables ($P_1, P_2 ... P_n \to R$). This simplifies the logic to $P \land Q \to R$. Students should understand that complexity amplifies the difficulty of finding any consistent path.
  4.  **Cost of Coordination:** Finding a path to consistency takes time and argument (argumentation). This activity separates deliberation from aggregation, which makes the disconnect more visible than it might be in a fluid meeting.

  ### VII. Summary Checklist for You
  1.  **Print:** 14 Case Files, 14 Ballots.
  2.  **Board:** Pre-draw the 3-row grid.
  3.  **Timing:** Start a stopwatch.
  4.  **Mindset:** Be ready to pivot to "Theoretical Model" if the vote lands unanimously.
  5.  **Terminology:** Hold the word "Discursive Dilemma" until minute 70+.

  This design prioritizes the experiential shock of the paradox while providing you the scaffolding to ensure the mathematical conditions are met. The transition from "What happened?" to "What does this mean for rationality?" is where the learning lives.
