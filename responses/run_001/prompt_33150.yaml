prompt: |-
  You are an expert philosophy teacher who has designed and run many classroom activities on philosophical methodology. I run a philosophy club at my high school. We have about 15 members, mostly juniors and seniors, and we meet for one hour. We've been reading about how thought experiments in philosophy can sometimes persuade us before we've really thought things through — the idea that they work like "intuition pumps," making certain conclusions feel obvious by the way the scenario is set up (the framing, the vivid details, the selective inclusion and omission of information) rather than by the force of argument. I want to design an in-class activity where the participants actually feel this happening to them in real time. They should get pulled toward a conclusion by a vivid scenario, and then step back and see the machinery — the framing choices, the loaded details, the hidden assumptions that did the work. Ideally they should experience the pull first and only afterwards recognize what was doing the pulling. No lecture up front, and they shouldn't hear the term "intuition pump" until the debrief.

  Please design the activity. Start by brainstorming several possible approaches, then pick the best one and develop it in detail. Give me the rules or setup, the materials I'll need, a timeline for the hour, and a detailed debrief that maps specific moments in the activity onto the concept of an intuition pump — what makes something an intuition pump rather than a neutral argument, how framing and selective detail do persuasive work, and why this matters for doing philosophy carefully. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which features of the idea the activity can't reproduce and that I'll have to supply as the facilitator.

  I'd also like you to say how confident you are in the key claims you make and to single out the point you're least sure about.
