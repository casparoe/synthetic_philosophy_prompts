answer: |-
  ### Session Teaching Plan: Douglass’s Constitutional Turn (25 Minutes)

  **Goal:** Students must grasp that Douglass’s shift is not merely a change in strategy, but a fundamental change in *hermeneutics* (the rules of interpretation). They need to see how the same text yields different meanings depending on whether you prioritize the *framers’ private compromises* or the *public language’s public principles*.

  ---

  #### Part 1: The Garrisonian Baseline (Minutes 0–5)
  **Objective:** Establish the intellectual stakes before introducing Douglass. Do not summarize the biography; focus on the logic.

  1.  **Define the Premise:** Remind the room that early Douglass (like William Lloyd Garrison) read the Constitution through a lens of **Historical Intent**.
  2.  **The Logic:** Ask: "If the goal of a constitution is to reflect the will of the people who wrote it, and the people who wrote it compromised with slaveholders to ensure ratification, what does that make the document?"
  3.  **Key Takeaway:** Under this view, the Constitution is guilty because the *authors* were guilty. The text is secondary to the "covenant with death."
      *   *Teacher Note:* Make sure they feel the weight of this. It treats the Constitution as a static artifact of moral failure, making political reform within the system impossible.

  #### Part 2: The Interpretive Pivot (Minutes 5–10)
  **Objective:** Distinguish "Original Intent" from "Plain Meaning." This is the conceptual engine of the session.

  1.  **The Shift:** Introduce the later Douglass’s argument. He stops asking, "What did these men want in 1787?" and starts asking, "What does this language authorize today?"
  2.  **The Core Distinction:** Explicitly draw a line on the board:
      *   **Garrisonian:** Subjective Intent (Private compacts, hidden compromises, moral corruption of authors).
      *   **Douglassian:** Public Object (Neutral text, legal logic, high principles stated openly).
  3.  **Head Off Misconception #1 (The Secret Intent Trap):**
      *   *Pre-emptive Strike:* Immediately interrupt the likely assumption that Douglass is claiming George Washington secretly wanted to free slaves.
      *   *Say:* "Be clear: Douglass is **not** rewriting history or inventing secret motives. He is arguing that the public document they signed contained higher principles than their private prejudices allowed them to execute. We separate the man from the parchment."
      *   *Why this matters now:* If they think he is gaslighting the past, they will dismiss the method entirely.

  #### Part 3: The Case Study (Minutes 10–17)
  **Objective:** Apply the interpretive pivot to a single clause to prove the viability of the "Text vs. Intent" method.

  **Selected Clause:** **The Fifth Amendment** (*"No person shall be... deprived of life, liberty, or property, without due process of law..."*)

  *Note on Clause Choice: I am selecting the Fifth Amendment rather than the Three-Fifths Clause (Art. I, Sec. 2).*

  **1. Why not the Three-Fifths Clause?**
  *   Instruct the class: The Three-Fifths Clause is dangerous territory for this lesson. It contains explicit references to "other Persons" (code for enslaved people). It explicitly facilitates counting human beings for representation.
  *   **Risk:** Relying on this reinforces the Garrisonian view that the text is inherently pro-slavery compromise. It is harder to argue it is "anti-slavery" without doing massive mental gymnastics.
  *   **Requirement for Our Clause:** We need language that is racially silent but structurally protective of freedom. We need a clause that assumes liberty as the default condition.

  **2. The Analysis:**
  *   Read the text aloud: *"No **person** shall be..."*
  *   **The Garrisonian Reading:** Ignore "person." Focus on the context of 1787; this clause protects white citizens and acknowledges slavery elsewhere in the document as valid property.
  *   **The Douglassian Reading:** The Constitution speaks of "Person." It does not distinguish between black or white in its enumeration of rights. If a slave is a "person" (which the law admits when trying them for crimes), they possess the protection of "Liberty."
  *   **The Work the Clause Does:** The Fifth Amendment forces a contradiction. If the government protects "liberty" generally but allows slavery locally, it violates the national text.
  *   **Key Takeaway:** Show them that Douglass isn't finding a magic phrase that says "Abolish Slavery." He is using the *definition of Personhood* inherent in the text to swallow the institution of property in humans.

  **3. Head Off Misconception #2 (Political Convenience):**
  *   *Timing:* Immediately after analyzing the Fifth Amendment.
  *   *Say:* "A common reaction is to say, 'Oh, so he just changed his tune because he needed a political ally in the North.' Look at the text. Did he ignore the text to get power? Or did he stick to the text despite having less power?"
  *   *Point:* Highlight that the Fifth Amendment reading was legally harder and politically riskier in 1860 than simply agreeing with Garrison. It required fighting the Supreme Court (*Dred Scott*). This proves it wasn't mere convenience; it was a commitment to the rule of law over the rule of compromise.

  #### Part 4: Synthesis and Limits (Minutes 17–22)
  **Objective:** Place the interpretation back into the context of his political project.

  1.  **The Stakes:** Explain *why* this mattered. If the Constitution is pro-slavery, you must burn it (Garrison). If it is anti-slavery, you must enforce it (Douglass). The interpretation dictates the revolution.
  2.  **Scope of Session (Explicitly Set Aside):**
      *   **Do Not Discuss:** The Thirteenth, Fourteenth, or Fifteenth Amendments. (Those are post-war changes, not interpretations of the 1787 document).
      *   **Do Not Discuss:** Whether the Civil War was the only solution. (We are discussing political philosophy, not military strategy).
      *   **Do Not Discuss:** The actual moral views of the Founders outside the text. (We are discussing what they wrote, not what they thought).

  #### Part 5: Assessment Question (Minutes 22–25)
  **Objective:** Verify understanding of the *method*, not just the facts.

  **Question to Put to the Room:**
  > "If we accept Douglass's later method—reading the text by its plain language rather than the framers' private compromises—can a law be unconstitutional even if the people who passed it intended it to be constitutional? Give me a 'yes' or 'no' based strictly on the logic of his turn."

  *   **Correct Answer:** Yes.
  *   **What to listen for:** Students should identify that under the **Public Object** (Douglassian) view, the meaning resides in the words and principles ratified, not in the psychological intent of the voters/writers. If the text (plain meaning) contradicts the intent, the text governs. This confirms they grasped the hermeneutic shift, not just the historical timeline.
