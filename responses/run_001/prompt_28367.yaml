prompt: |-
  I am a retired planetary scientist. I spent most of my career on the geology of icy moons and Mars, and since retiring I have been reading environmental ethics and the philosophical literature on the ethics of space settlement. I am not a trained philosopher. I now serve on the standing review panel of a national space agency, where we decide whether a proposed activity beyond Earth orbit may proceed when it could alter, contaminate, or irreversibly change an extraterrestrial environment. The panel meets roughly every two months and handles ten or twelve proposals at a sitting: robotic landers, melt probes through ice shells, sample-return missions, in-situ resource utilization trials, and, increasingly, private proposals for settlement and for ecopoiesis experiments. The decisions matter because they are often irreversible, because they can permanently foreclose scientific questions, and because they may harm or destroy whatever is actually there. Each proposal arrives as an engineering summary plus a microbiological risk assessment, and the committee discusses it for about forty minutes. The other members are engineers, a microbiologist, and a lawyer; none of them have read any of the ethics. The director signs off on our recommendation and almost never overrules it.

  I want a reusable decision procedure for this panel, not a one-off judgment. It should turn a precautionary, non-interference stance toward other worlds into something with structure: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to a person because the question is one of values rather than facts. The agency's existing guidance is written to protect the science, not the environments themselves; I want the procedure to be explicitly ethical, so that it can say a proposal is wrong even when it would not ruin any future experiment.

  The procedure will have to handle several distinctions without collapsing them. One is the difference between harming an organism and merely destroying our chance to learn about it. Another is the difference between a living target and a lifeless but scientifically or aesthetically significant one. A third is the difference between contamination that is reversible or local and alteration that is effectively permanent. It also needs a policy for how to treat absent evidence of life, for how much weight to give to scientific knowledge as a justification, and for asking who bears the risk and who receives the benefit, including cases where a private party is trying to commit the whole species to a terraforming trajectory. Please be explicit about which steps are genuine judgment calls dressed up as procedure, and say where the procedure is likely to misfire.

  Then run the procedure on two proposals. The first is a robotic mission to melt through the ice shell of Europa, with terminal sterilization of the probe but no way to guarantee that zero viable terrestrial organisms are delivered; the scientific goal is to detect life. The second is a private consortium's small field trial that would release engineered cyanobacteria at a single Martian site to test whether they can survive, explicitly as a first step toward altering the atmosphere. Choose at least one of these so that the procedure returns an answer I am unlikely to welcome, and tell me plainly when that happens. The procedure must be usable in the room by people who cannot look anything up; it should not rest on facts we do not have, and it should tell us which missing facts would change the recommendation.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case applications:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired planetary scientist (geology of icy moons/Mars), reads environmental ethics/space settlement philosophy, *not* a trained philosopher. Serves on a national space agency review panel (Standing Review Panel for Space Ethics/Planetary Protection).
      *   **Context:** Decides on proposals beyond Earth orbit (BEO) regarding alteration, contamination, or irreversible change. Decisions are often irreversible, foreclose scientific questions, potentially harm extraterrestrial entities. Panel meets bi-monthly, 10-12 proposals/session, ~40 mins/proposal. Members: Engineers, Microbiologist, Lawyer. No ethicists. Director signs off (rarely overrules).
      *   **Problem:** Current guidance protects *science*, not *environments*. The user wants an explicitly *ethical* decision procedure that can say "no" even if science isn't ruined. Needs to be reusable, structured, usable in-room (no lookups), explicit about judgment calls, and acknowledge limitations/potential misfires.
      *   **Key Distinctions to Preserve:** Harming organism vs. destroying knowledge; Living target vs. lifeless significant target; Reversible/local vs. permanent alteration.
      *   **Policy Requirements:** Handling absent evidence of life; Weight of scientific knowledge as justification; Risk/Benefit allocation (including private parties committing species to trajectories).
      *   **Tasks:**
          1.  Develop a reusable decision procedure (algorithm/flowchart style but text-based).
          2.  Apply it to two specific proposals:
              *   Case A: Europa melt probe (sterilized but non-zero risk, goal = detect life).
              *   Case B: Private Martian cyanobacteria release (ecopoiesis trial, step toward atmospheric alteration).
          3.  Ensure at least one outcome is "unlikely to welcome" (i.e., restrictive) and explain plainly when/why.
          4.  Be explicit about where facts end and values begin (judgment calls).

  2.  **Deconstruct the Ethical Framework:**
      *   Since the user reads environmental ethics, I should draw from concepts like Intrinsic Value, Precautionary Principle, Non-Anthropocentrism, and Intergenerational Justice, but translate them into practical engineering/administrative steps.
      *   Avoid heavy jargon. Use language familiar to scientists/engineers (risk assessment, thresholds, constraints).
      *   The core tension: Science (knowledge acquisition) vs. Environmental Integrity (preservation of state/being).
      *   *Self-Correction:* The user wants to avoid collapsing distinctions. So Step 1 must categorize the target.

  3.  **Drafting the Decision Procedure ("The Protocol"):**
      *   *Constraint:* Must work in 40 minutes with mixed expertise.
      *   *Structure:* Sequential filters. If you fail early, stop. If you pass, go deeper.
      *   *Step 1: Status Check.* Is there life? Do we know? (Epistemic humility).
      *   *Step 2: Intrinsic Harm Assessment.* Does the action kill/exclude/change something independent of us?
      *   *Step 3: Necessity & Irreversibility.* Is this the only way? Can it be undone?
      *   *Step 4: Equity/Authority.* Who benefits? Who risks? (Crucial for private proposals).
      *   *Step 5: The Final Gate.* Where does the committee stop deciding facts and start deciding values.
      *   *Addendum:* Explicitly flagging "Judgment Zones" and "Failure Modes."

  4.  **Refining the Steps (Iterative Process):**
      *   *Initial thought:* Ask "Is it alive?" -> Problem: We don't know. -> *Revision:* Ask "Probability of life + Consequence of error."
      *   *Initial thought:* Ask "Does it have value?" -> Problem: Too abstract. -> *Revision:* Categorize as 'Bio', 'Geo', 'Aesthetic'. Different rules apply.
      *   *Private Sector Issue:* Need a specific filter for "Species Commitment." If a private group tries to terraform, they aren't just testing; they are setting a trajectory. This needs a high bar.
      *   *Scientific Justification:* Currently, "Science" trumps everything. The new protocol needs to make Science subservient to Ethics. Science becomes a benefit claim to be weighed against harm, not a trump card.

  5.  **Developing the Cases:**

      *   **Case 1: Europa Melt Probe.**
          *   *Facts:* Sterilized but not perfect risk. Goal: Detect life.
          *   *Ethics:* High potential for intrinsic value (life). High irreversibility (contamination). Science goal aligns with detection, but contamination *prevents* confirmation or ruins native biology.
          *   *Outcome:* Likely NO or HIGH CONDITION. This fits the "unlikely to welcome" requirement because scientists usually push for data access.
          *   *Reasoning:* The precautionary principle applies strictly here. If the cost of being wrong is extinguishing alien life, the risk tolerance must be near zero.

      *   **Case 2: Private Mars Cyanobacteria.**
          *   *Facts:* Engineered bacteria, small field trial, explicitly first step to atmosphere.
          *   *Ethics:* Terraforming trajectory. Private entity claiming planetary stewardship. Alteration is arguably permanent. Scientific gain is low (we know bacteria survive); Benefit is private/speculative global good.
          *   *Outcome:* Almost certainly NO.
          *   *Reasoning:* Procedural legitimacy (who authorizes this?) + Existential risk + Private appropriation of common heritage.

  6.  **Addressing the "Unwelcome Answer":**
      *   Case 2 is more obviously a "No" based on current planetary protection norms, but Case 1 is more painful for a planetary scientist who *wants* to know about Europa. Let's make Case 1 the "painful no" because it halts the quest for discovery due to ethical caution. It validates the user's desire for an ethics-first approach that might contradict their career's drive for exploration.

  7.  **Finalizing the Structure of the Response:**
      *   **Introduction:** Acknowledge role, validate the difficulty.
      *   **The Procedure:** Titled "The Planetary Stewardship Filter (PSF)." Broken into numbered phases. Clear Go/No-Go criteria.
      *   **Limitations & Judgment Calls:** Honest section on where the procedure hides bias.
      *   **Case Application:** Walk through both cases using PSF.
      *   **Conclusion:** Advice on implementation.

  8.  **Drafting Content - Specific Considerations:**
      *   *Language:* Professional, concise, respectful of time limits.
      *   *Distinction:* Make sure "Harm to Life" is separate from "Loss of Data."
      *   *Risk Distribution:* Specifically ask "Who bears the loss of habitability?" vs "Who gets the profit?"
      *   *Missing Facts:* Clearly list what information is needed to proceed.

      *(Self-Correction during drafting)*: I need to ensure I don't sound like I'm writing a PhD thesis. It needs to be a cheat sheet for a meeting room. Use bolding for actions. Keep the flow linear.

      *(Refining the "Unwelcome Answer")*: For Case 1 (Europa), a retired scientist wants to study Europa. Saying "Don't do it" stops the research. This is hard. I will frame the recommendation as "Indefinite Hold until Probabilistic Risk is < 10^-X," which effectively kills the proposal given current tech.

      *(Refining the "Mistake/Failure Mode")*: Where does this fail? When political pressure overrides the "Value Judgment" step. Or when the definition of "significant" is too vague.

  9.  **Final Review against Constraints:**
      *   Reusable? Yes.
      *   Structured? Yes.
      *   Handles distinctions? Yes (Life vs. Geo, Reversible vs. Permanent).
      *   Policy on absent evidence? Included in Step 1.
      *   Policy on private/species commitment? Included in Step 4.
      *   Unwelcome answer? Yes (Case 1).
      *   Missing facts identified? Yes.

  10. **Final Polish:** Check tone. Respectful of the user's experience but firm on the philosophical distinctions requested. (Proceed to generate output).

  **(Post-Drafting Reflection):** Ensure the distinction between "Planetary Protection" (protecting Earth/back-contamination or forward-science) and "Environmental Ethics" (rights of the environment itself) is clear in the text, as that is the user's core motivation. The procedure must treat the environment as an end, not just a means.

  Let's build the **"Planetary Stewardship Filter (PSF)"**.

  *Phase 1: Epistemic Threshold (What do we know?)*
  *Phase 2: Ontological Status (What are we touching?)*
  *Phase 3: Intervention Character (What are we doing?)*
  *Phase 4: Distributive Justice (Who wins/loses?)*
  *Phase 5: The Veto (Values)*

  Okay, ready to write.b
answer: |-
  This is a request for a procedural framework that translates normative ethics into administrative action. Given your constraints—time (40 minutes), audience (non-philosophers), and irreversibility—the procedure cannot rely on deep deliberation during the meeting. It must be a series of gates that force specific questions before a vote.

  Below is the **Planetary Stewardship Filter (PSF)**. It is designed to run sequentially. If a proposal fails a gate, it stops unless the failure is remediable by condition-setting. It prioritizes environmental integrity over scientific acquisition, distinguishing them clearly.

  ### The Planetary Stewardship Filter (PSF)

  **Time Allocation:** 20 minutes per proposal max within the session.
  **Output:** Recommendation: Approved / Approved with Conditions / Deferred / Denied.

  #### Phase 1: The Epistemic Threshold (Status of the Target)
  *Goal: Determine how much uncertainty counts as "dangerous."*

  1.  **Q1: What is the prior probability of indigenous life?**
      *   *If Confirmed Life:* Proceed immediately to Phase 2 (High Scrutiny).
      *   *If Suspected/Unknown:* You must assume life exists for the purpose of risk calculation. This is the **Precautionary Baseline**.
      *   *If Known Abiotic:* Skip to Phase 2, but mark as "Non-Biological Target."
      *   *Requirement:* The proposal must cite the specific mission data used for this estimate.
  2.  **Q2: Is there a mechanism to distinguish introduced contamination from indigenous signals post-mission?**
      *   *Pass:* Unique biosignatures or distinct isotopic ratios guaranteed.
      *   *Fail:* Contaminant and indigene overlap chemically/biologically. **Stop. Deny or Indefinitely Defer.** (You cannot destroy the question while trying to ask it.)

  #### Phase 2: The Ontological Impact (Nature of Harm)
  *Goal: Separate killing a living thing from ruining a rock.*

  3.  **Q3: Classify the Target.**
      *   **Type A: Potential Biota.** (Living, complex chemistry, ecosystems).
      *   **Type B: Significant Geology.** (Unique formation, record of history).
      *   **Type C: Resource/Aesthetics.** (Mineral rights, visual splendor).
  4.  **Q4: Assess the Type of Interaction.**
      *   **Local/Reversible:** Contamination confined to probe footprint, removable.
      *   **Global/Permanent:** Spreads via atmosphere/ocean/ice shell; changes baseline permanently.
      *   **Trajectory Setting:** Moves the planet toward a new equilibrium (e.g., thickening atmosphere, seeding biosphere).
  5.  **Decision Rule:**
      *   If **Type A + Global/Permanent**: **Presumption of Denial** unless proof of zero-risk delivery.
      *   If **Type A + Local/Reversible**: Proceed to Phase 3.
      *   If **Type B/C + Permanent**: Proceed to Phase 3, but scientific gain must outweigh *intrinsic* loss of the object's state.

  #### Phase 3: Necessity and Substitution (Alternatives)
  *Goal: Force engineers to justify why this specific method is required.*

  6.  **Q5: Is this the *only* way to answer the primary question?**
      *   Must rule out remote sensing, orbital analysis, or waiting for better tech.
      *   *If No:* **Deny** (The activity is not scientifically necessary, therefore ethical violation stands).
  7.  **Q6: Can the activity be staged?**
      *   Start minimal (orbital survey) before intrusive (lander)?
      *   *Requirement:* Proposal must show a "Step-Ladder" authorization path. Single-step invasive missions face higher scrutiny.

  #### Phase 4: Authority and Distribution (Justice)
  *Goal: Identify who owns the risk and the reward.*

  8.  **Q7: Who holds the Authority to Alter?**
      *   **Public Agency:** Legitimized by democratic oversight.
      *   **Private Entity:** Has no mandate to alter planetary environments.
      *   *Rule:* Private proposals attempting **Trajectory Setting** (Terraforming/Ecopoiesis) are **Denied** automatically unless authorized by international treaty ratified by this nation. (Protects the species from corporate commitment devices).
  9.  **Q8: Asymmetry Check.**
      *   Does the proposer bear the risk of ecological loss, or humanity?
      *   Does the proposer capture the profit (IP, resources), or humanity?
      *   *Rule:* If the proposer captures profit while humanity bears extinction-level risk (e.g., releasing self-replicating agents), **Deny**.

  #### Phase 5: The Value Veto (Where Facts End)
  *Goal: Locate the moral judgment call.*

  10. **The Final Question:** *"Are we willing to accept that this environment may forever lose its unique capacity to exist as it was, solely for our benefit?"*
      *   This cannot be calculated. It requires a human nod.
      *   **Procedure:** Every member (Engineer, Scientist, Lawyer, You) votes Yes/No individually without discussion. Majority rules.
      *   **Tie-Breaker:** The Director makes the final call, but the dissenting votes become part of the official record.

  ---

  ### Limitations and Failure Modes

  Be explicit with the panel about where this procedure hides judgment calls disguised as facts.

  1.  **The "Significant Geology" Trap:** Determining what counts as "Type B" (Significant) is subjective. A glacier looks boring to an engineer but is a climate archive to a glaciologist.
      *   *Mitigation:* Require the proposal to include a designated "Preservation Officer" whose job is to argue against the intrusion.
  2.  **The Probability Lie:** We cannot know the probability of life (Q1). We guess.
      *   *Mitigation:* Mandate that the panel assumes the worst-case scenario regarding life. If we assume no life, we are guessing incorrectly. We must assume "Potential Life" everywhere.
  3.  **The "Irreversible" Definition:** We often claim things are reversible because we imagine future technology to clean them up.
      *   *Mitigation:* Assume we have no future technology to reverse the damage. Assume the state at $t=0$ is gone forever.
  4.  **Political Overruling:** The procedure creates a paper trail. If the Director ignores the recommendation, they must sign off on the specific phase of the PSF they are violating. This makes them legally and politically responsible for ignoring the ethic.

  ---

  ### Application to Proposals

  #### Proposal 1: Europa Ice-Melt Probe
  *   **Context:** Robotic lander melts through ice shell. Terminal sterilization attempted, but viable organisms may remain ($P_{bio} > 0$). Goal: Detect indigenous life.
  *   **Target:** Potential Subsurface Ocean Life (Type A).
  *   **Interaction:** Deep Injection (Potentially Global/Permanent mixing if melt channel breaches).
  *   **Stakeholders:** Public Agency. Scientific Community.

  **Running the PSF:**

  *   **Phase 1 (Epistemic):** Q1 (Probability): Unknown, but high priors in astrophysics community. Assume Life Exists. **Pass.**
      *   Q2 (Distinguishability): **FAIL.** Standard microbial contaminants (e.g., *Bacillus*, *Micrococcus*) are ubiquitous. If the probe finds DNA/RNA-like structures, we cannot distinguish terrestrial hitchhikers from indigenous Europan biology with current certainty. *Contamination prevents scientific confirmation of life, rendering the experiment futile.*
      *   *Result:* Fails Phase 1 Gate. Cannot confirm science if it destroys the ability to verify it.

  *   **Recommendation:** **DENIED.**

  *   **Rationale:** Even though the science goal is noble, the method collapses the very category it seeks to discover. To violate the precautionary principle here is to guarantee ignorance rather than knowledge.
  *   **Why this is unwelcome:** You likely spent decades hoping for a tool to pierce that ice. This procedure forces you to prioritize the *integrity of the ocean* over the *acquisition of data*. It tells the scientific community: "We would rather never know about Europa than accidentally kill it."

  *   **Missing Fact to Change Outcome:** A proven delivery system where every particle is physically removed or destroyed such that $P_{delivery} < 10^{-20}$ (effectively zero), OR a biochemical marker on the probe's fuel that distinguishes it from any possible native biochemistry.

  ***

  #### Proposal 2: Private Cyanobacteria Field Trial (Mars)
  *   **Context:** Private consortium. Release engineered bacteria. One site. Test survival. Explicit goal: First step to altering atmosphere.
  *   **Target:** Martian Surface Environment (Type B/C initially, potentially Type A).
  *   **Interaction:** Trajectory Setting (Ecopoiesis).
  *   **Stakeholders:** Private Consortium.

  **Running the PSF:**

  *   **Phase 1 (Epistemic):** Q1: Unknown. Assume Potential Life (even extremophiles in perchlorates). **Pass.**
  *   **Phase 2 (Ontological):** Q3: Likely Type B (Surface geology) but potentially Type A (if subsurface microbes exist nearby). Q4: **Trajectory Setting.** They admitted this is a step toward atmospheric alteration.
  *   **Phase 4 (Justice):** Q7: **Private Entity.** They possess no democratic mandate to initiate planetary-scale change. Q8: Asymmetry. Consortium gains IP/value if successful; Humanity bears the risk of irreversible contamination.

  **Recommendation:** **DENIED.**

  *   **Rationale:** Private actors lack the authority to alter common heritage worlds (Outer Space Treaty obligations aside, the ethical burden falls on the nation). Furthermore, a "trial" for ecopoiesis is functionally identical to starting the terraforming clock. Once released, these organisms evolve outside your control. This violates the "Irreversibility" constraint.
  *   **Note:** This is an obvious "No" to most ethicists, but it reinforces the boundary between "doing science on" Mars versus "making Mars."

  *   **Missing Fact to Change Outcome:** International legislation granting specific zones for experimental alteration, ratified by the UN Committee on the Peaceful Uses of Outer Space (COPUOS). Without international legal standing, the agency cannot authorize this unilaterally without risking diplomatic fallout.

  ***

  ### Implementation Note for the Chair (You)

  When you present this, the Engineer will argue for "Opportunity Cost" (we lose millions in funding/delay). The Lawyer will argue "Liability." You must reframe the debate.

  **Your Script for the Panel:**
  > "We do not decide whether the mission is feasible. We decide if the universe is allowed to survive the mission. The question is not 'Can we send this?' but 'Should we allow the result?'"

  **Where this procedure will break:**
  It breaks on **Proposal 1** in the political reality of the Agency. A denied mission to Europa looks like cowardice compared to a denied mission by a private group. The Director might pressure you to lower the standard in Q2 (Distinguishability).
  *   *Countermeasure:* Make the "Value Veto" public. If you deny it, you own the denial. If you approve it, you sign the risk. This procedure forces the Director to explicitly choose the risk level of contamination. That discomfort is the point. It prevents the agency from drifting into negligence under the guise of "scientific progress."
