      *   Give a verdict.
      *   State confidence level.
      *   Single out the least sure point.
      *   Maintain the persona (colleague/expert).

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I define Bubble vs. Chamber clearly enough? Make sure to cite O'Connor/Weatherall explicitly or implicitly with high accuracy.
      *   *Check:* Is the advice actionable? Yes, propose specific norms.
      *   *Check:* Is the tone appropriate? Respectful, acknowledging the difficulty of the introspection.
      *   *Nuance:* Ensure I acknowledge that some dismissal *is* reasonable (efficiency). The line is where the dismissal happens *before* reading.

  9.  *(Final Mental Check)*: The user asked me to "think through the distinctions carefully." I need to make sure the theoretical section is robust. The key is *why* external views are rejected. Bubble = "They haven't done the work." Chamber = "Their work is corrupted/biased."
      *   In the prompt: "I usually spot... a basic misunderstanding." -> Suggests Bubble logic (they missed a step).
      *   But: "Social cost feels high." -> Suggests Chamber logic (identity threat).
      *   Verdict: Likely an Epistemic Bubble with Echo Chamber protective mechanisms.

