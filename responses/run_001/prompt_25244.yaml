prompt: |-
  So I was listening to this philosophy podcast and the host summarized epiphenomenalism like this: "Epiphenomenalists think consciousness is real but completely causally inert — it's like the steam from a train whistle, a byproduct that doesn't affect anything. But here's the problem, and it's why almost nobody takes the view seriously anymore: if consciousness has no causal powers, then your belief that you're conscious can't be caused by your actually being conscious. It has to be caused by brain states alone. But then you have no reason to trust that belief — you'd believe you were conscious whether you were or not. So epiphenomenalism undermines the very evidence that motivates it. It's self-defeating."

  I remember hearing that this "paradox of phenomenal judgment" is a big deal in philosophy of mind, but I also vaguely recall that some philosophers think this summary gets something wrong — maybe about what epiphenomenalists actually claim about the relationship between consciousness and the brain, or about whether the paradox really lands the way the host says it does. But I can't put my finger on it. Can you go through this summary and tell me what's fair, what's subtly off, and whether the self-defeat charge actually sticks?
