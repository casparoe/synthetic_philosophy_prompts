  Before committing to a scenario, I must acknowledge the tension in your constraints. Standard ordinary objects (stones, coins, cats) are individuated primarily by spatiotemporal boundaries. Removing spatiotemporal differentiation leaves only intrinsic qualities; if those match, standard mereology collapses them into one. To maintain distinctness without location or qualitative difference requires *haecceities* (thisness), which the Leibnizian explicitly excludes as circular. Therefore, a strictly realistic scenario fitting *all* constraints does not exist for ordinary objects without smuggling in the very properties the debate forbids. However, we can construct the **closest conceivable approximation** to test the limits: the **Co-located Artifacts**. This pushes ordinary objects to their breaking point where material constitution meets identity.

  ### The Scenario: The Superimposed Spheres
  Take two identical billiard balls made of the exact same polymer blend, manufactured in the same factory run. In a specialized facility, they are compressed and fused so perfectly that they cease to be two surfaces and become a single continuous surface area. They occupy the exact same volume, share every molecule, and possess identical color, density, and momentum. We label them "Sphere A" and "Sphere B" based solely on the fact that there were originally two molds. There is no spatial distance between them, no temporal gap, and no intrinsic qualitative difference in the fused matter. Yet, we persist in calling them "two objects" because we count the molds, not just the material. The only difference remaining is the property: Sphere A is "the object formed from Mold #1," and Sphere B is "the object formed from Mold #2"—historical traces that are causally inert in the present state.

  ### (a) What the Leibnizian Says
  The Leibnizian argues that **there is only one object** in the fused sphere. They point to the **Principle of the Indiscernibility of Identicals (PII)** working in reverse: since the objects are numerically distinct (by stipulation of the molds) but lack any distincting properties, the distinction is empty. Any property used to differentiate them—such as "originating from Mold #1"—is either a historical relational property (which reduces to causal traces, indistinguishable in the present fusion) or an identity-involving property ("being distinct from Sphere B"), which is circular. For the Leibnizian, if you cannot distinguish them by any observable, intrinsic, or spatiotemporal feature *now*, they are one entity. To say otherwise is to grant that numerical distinctness is ungrounded, which violates the requirement that objects be grounded in their properties.

  ### (b) What the Sceptic Says
  The Sceptic insists that **there are still two objects**. They argue that the Leibnizian’s move fails because it assumes that *qualitative* or *spatiotemporal* properties are the only kinds of properties available for individuation. The Sceptic claims that "originating from Mold #1" is a legitimate, admissible qualitative property (a sortal history) that individuates A without requiring spatial separation. Furthermore, they argue that if IoI were true, we would lose our ability to track objects over time or across counterfactual situations—we couldn’t say "A broke before B" if they are one. The Sceptic maintains that the Leibnizian's refusal to accept identity-involving or historical haecceities arbitrarily restricts the domain of admissible predicates to save a theoretical principle, effectively begging the question against the reality of discrete substances.

  ### (c) The Feature Doing the Real Work
  The feature doing the real work is **Sortal Dependence**. The scenario collapses if you remove the "billiard ball" sortal concept. If you treat the fused mass merely as "matter," there is undeniably only one object. If you treat it as a "ball," the persistence conditions allow for counting based on origins. If you remove the sortal history (e.g., you destroy the molds and memory), the case **collapses back into Black's spheres**, but with zero distance. The distinction vanishes because ordinary objects are not bare particulars; they are carriers of properties. Without the sortal history, there is nothing left to pick out A versus B, proving that the perceived distinctness was never about the *present* state, but about the *narrative* of the object.

  ### (d) The Uncomfortable Consequence
  If the Leibnizian bites the bullet and accepts there is only one object, they must accept **Anti-Individualism regarding Origins**. They must agree that two distinct historical events (the creation of Mold #1 and Mold #2) resulting in a physically identical present state produces only one current entity. This leads to the "Problem of Many": if every copy of a product is truly one object when fused, then objects are not countable units of substance but ephemeral bundles of properties. This squirms against common sense because it dissolves the integrity of artifacts; if I paint two identical lines on a canvas that merge perfectly, did I draw one line or two? The Leibnizian answer ("one") suggests that our intuitive counting practices in art, law, and commerce are systematically mistaken about the fundamental ontology of the world, reducing "number" to a pragmatic gloss rather than a metaphysical truth.
