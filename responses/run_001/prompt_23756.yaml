      *   *Butterfly Dream:* Zhuangzi dreams he is a butterfly. Wakes up wondering if he is Zhuangzi dreaming of being a butterfly, or a butterfly dreaming of being Zhuangzi. Key point: Ontological fluidity, epistemic humility, non-distinction between states.
      *   *The Connection:* Both deal with the boundaries of identity and state. One deals with the boundary between Life and Death; the other deals with the boundary between Dream and Wakefulness. Zhuangzi treats both transitions as transformations of *qi* rather than fundamental changes in reality. The confusion often lies in whether Zhuangzi thinks death is "good" (optimism) or just "neutral/unreal" (skepticism). He's really saying the distinction is arbitrary.

