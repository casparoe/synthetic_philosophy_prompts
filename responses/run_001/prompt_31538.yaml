  Mass now tells the empty space how deep.
  The clockwork loses hold of the routine.
  The pendulum swings through empty air.

  1. Kuhn resisted teleological narratives of progress toward truth, yet the poem’s resolution into a stable new order implies an inevitable correction that his historical sociology often denies.
  2. While the text dramatizes semantic change, Kuhn eventually conceded that translation between paradigms is possible via partial definitions, so the incommensurability here is pushed to its aesthetic limit.
  3. Treating the shift as a singular Gestalt experience overlooks the slow, generational turnover of personnel that Kuhn identified as the sociological engine of revolutionary change.
  4. Anchoring the crisis specifically in Mercury’s perihelion conflates the development of Special and General Relativity, whereas the conceptual break regarding time occurred before the orbital anomaly was fully integrated.
  5. Closing the loop on the opening line suggests we retain access to the old ontology, but Kuhn argued that practicing scientists often literally lose the capacity to perceive the world under the discarded assumptions.
