answer: |-
  This is one of the most persistent misunderstandings in foundational computer science. Since you approach this via the Curry-Howard correspondence (CHC), let’s stick to that framework.

  The short answer is: **The disagreement is substantive regarding the semantics of "truth," but practically resolvable because the two logics serve different optimization goals.** It is not merely verbal, nor will a formal theorem ever settle it, because they are asking different questions about what constitutes a valid mathematical object.

  Here is the diagnosis, broken down by the specific friction points you raised.

  ### 1. The Semantic Mismatch: "Truth" vs. "Verifiability"
  At its root, the disagreement is about what a statement means when asserted as true.

  *   **Classical View (Realism/Platonism):** Mathematical statements describe a static, pre-existing reality. An existential statement $\exists x. P(x)$ is true if such an $x$ exists in that reality, regardless of whether we know how to find it or name it. Truth is a **state**.
  *   **Intuitionistic View (Anti-Realism/Constructivism):** Mathematical statements are records of human mental activity or algorithms. An existential statement $\exists x. P(x)$ is only true if we possess a method (a witness/function) that produces such an $x$. Truth is a **status** (warranted assertion).

  **For a Software Engineer:**
  *   In Classical Logic, `bool is_solution(val)` returns `true` if the solution exists, even if the function computes it via a non-terminating check that happens to return `true` before timeout (conceptually speaking).
  *   In Intuitionistic Logic, `val get_solution()` must actually return the value. A function that throws an exception claiming "it's logically impossible for there NOT to be a solution" (Double Negation Elimination) is rejected.

  Because they define the semantic value of the connectives differently, they aren't arguing over the same symbol map. They have different compilers.

  ### 2. The Double-Negation Trap
  You noted that the double-negation translation (Gödel-Gentzen translation) embeds classical logic into intuitionistic logic. You ask why this doesn't settle it.

  **It solves *consistency*, not *meaning*.**

  If classical logic allows you to derive a contradiction, intuitionistic logic will detect that too via the embedding. So, classical logic is safe to use *if* you accept the translation. However, you lose the information-theoretic advantage of CHC.

  In CHC, the "content" of a proof is the extracted program.
  *   **Intuitionistic Proof of $\exists x. P(x)$:** Extracts a pair `(witness, proof_of_predicate(witness))`. This is useful code.
  *   **Classical Proof of $\exists x. P(x)$ (embedded):** When translated back, the proof relies on control flow operators like `call/cc` (continuations) or classical control exceptions to bypass the lack of a direct witness.

  The embedded classical proof technically provides a term that inhabits the translated type, but that term does not necessarily behave like a constructor. It behaves like a continuation-passing style transformation. It proves "Consistency," but it often fails to provide "Construction."

  Therefore, the embedding demonstrates that Classical Logic is a *fragment* of a stronger system (logic + control), but it validates neither side's claim to "reality." It just shows they are compatible, not identical.

  ### 3. Why Nobody Changes Their Mind (The Engineering Trade-off)
  This isn't a religious war; it's an optimization problem. The sides refuse to move because switching logics degrades their primary metric.

  **Classical Logicians optimize for Scope.**
  They want to reason about infinite structures (like the real numbers) without being hamstrung by computability. They value lemmas that break down complex proofs quickly, like the Law of Excluded Middle (LEM). If LEM makes a proof 5 lines long instead of 100, they will take it, even if it loses the "constructive content." For pure mathematics, knowing *that* a bound exists is often more important than calculating *the* bound immediately.

  **Constructivists optimize for Utility.**
  They want proofs that compile to verified software. They reject LEM because it introduces non-deterministic behavior (control operators) that breaks type safety in constructive type theories. If a proof contains non-constructive existence, they cannot extract the code. They accept the verbosity penalty because the resulting artifact is guaranteed to run correctly.

  **Analogy:** Think of it like `unsafe` code in Rust.
  *   The Classical mathematician writes `unsafe { assume_witness() }` to make the API simpler.
  *   The Constructivist refuses to use `unsafe`, demanding that every memory pointer be validated at compile time.
  Both are "correct" within their respective type systems. The argument persists because the Constructivist wants safety guarantees; the Classicist wants development velocity.

  ### 4. Is it Verbal?
  Yes and No.
  *   **Verbal:** They agree on the syntax (symbols) but assign different denotations (semantics).
  *   **Substantive:** They fundamentally disagree on the nature of mathematical discovery. Is math discovered (Classical) or invented (Intuitionistic)? While this sounds philosophical, in practice, it dictates whether you believe you can trust a proof that uses "proof by contradiction" to assert the existence of an algorithm.

  ### 5. What Would Count as Progress?
  You asked what would constitute progress. A formal proof that one system is "truer" is impossible because they are internally consistent relative to each other.

  Progress is not resolving the war; it is **contextualizing the tools.**

  We are currently seeing the best form of progress via **Type Theory**:
  1.  **Separation of Concerns:** Systems like Lean or Coq allow you to use Classical axioms (including LEM) for a specific section of a proof (where you only care about consistency) while keeping the rest Constructive (where you extract code).
  2.  **Extraction Management:** We now understand that Classical proofs yield "non-constructive" terms. Rather than banning them, we categorize them. If your goal is to verify a compiler backend, you stay in Intuitionistic Type Theory (Agda/Haskell style). If your goal is to prove properties of analytic number theory, you step into Classical Analysis.
  3.  **Continuation Semantics:** Research into how classical control operators (like `call/cc`) relate to classical logic (via Parigot's $\lambda\mu$-calculus) has effectively synthesized the two. We now know exactly *what* the computational content of a Classical proof is—it's simply more complex state manipulation.

  **The verdict:**
  Drop the question of "Which logic is correct?" It is like asking "Is floating point arithmetic correct compared to integer arithmetic?" Neither is universal; they apply to different domains.

  The progress to watch for is **Tooling that handles the boundary**. We don't need philosophers to agree on the ontology of "Existence." We need better compilers that allow you to mix Classical reasoning and Constructive extraction safely, flagging exactly where the "magical" non-constructive jumps occur so they don't leak into production code.

  If you see a language/framework that lets you say "I assert this axiom is classical, and here is the runtime cost/extraction failure mode explicitly," that is the end of the war. That is where the software engineer's victory lies: not in changing minds, but in specifying contracts.
