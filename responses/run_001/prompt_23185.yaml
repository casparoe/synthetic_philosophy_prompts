  7.  **Final Polish:**
      *   Check the "sensory input" claim again. "Animals have no sensory experience whatsoever" (True per Descartes). "not even the kind of sensory input that drives their reflexes" (False per Descartes physiology—he explains reflexes *via* mechanical sensory inputs acting on the body without mind). This is a contradiction within the student's paragraph. I must mark this as wrong.
