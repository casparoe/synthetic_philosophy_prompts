      Descartes *does* deny animals have sensation (*sentire*). He says they have "corporeal imagination." But he definitely posits "sensory inputs" in the sense of external objects affecting the nerves to trigger motion. Saying "no sensory input that drives reflexes" negates the mechanism of the reflex. It's a technical error.
