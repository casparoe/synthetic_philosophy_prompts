  5.  **Draft Comments (TA Tone):**
      *   Need to be direct, margin-note style.
      *   Highlight the *Meditations* error clearly.
      *   Acknowledge they avoided the "cruel caricature" trap well (actually hit Descartes' actual cruelty).
      *   Point out the "input" confusion.

  6.  **Review Constraints:**
      *   "Fine-grained accuracy to show up in the grade."
