          *   **Preference vs. Plan:** We judge plans by diachronic standards, we judge preferences by synchronic standards.
          *   **Rational Imperative:** "Do not waste resources due to your own psychology."
          *   *Most likely fit:* The user is committed to **Standard Bayesian/EU Maximization Norms** (Transitivity required for representation) BUT allows for **Strategic Override** (Metacognition).

      *   *Addressing Case 2 vs 3:*
          *   This is the crux. Most philosophers would say: If preferences are incoherent, the agent is irrational *simpliciter*. The fact that they don't lose money just means they got lucky or exercised high-level executive function.
          *   To make 2 and 3 compatible: The agent has *two* levels of cognition. Level 1 (Desire): Incoherent. Level 2 (Will): Coherent planning. Verdict on Level 1 = Bad. Verdict on Level 2 = Good. The *Agent* is both rational and irrational depending on the subsystem. Or, the Agent is irrational in having those prefs, but rational in how they manage them. It's a hybrid verdict.
