prompt: |-
  I'm a graduate TA, and in two weeks I have to run a single fifty-minute discussion section on origin essentialism for first-year undergraduates in an introduction to metaphysics course. They will have had one prior lecture on necessity and possibility, but no formal modal logic, and I don't want to spend the hour on possible-worlds machinery. The version of the thesis I want them to leave with is the standard Kripkean one: an organism could not have originated from different gametes than the ones it actually came from, even if the result would have been qualitatively indistinguishable. Don't explain the view to me; plan how I should teach it to them.

  I want the plan to specify the order in which the component ideas have to be introduced and what depends on what — in particular, I suspect the distinction between "could have been raised by different people" and "could have originated from different gametes" has to come very early, or the rest of the session will be fought on the wrong terrain. Give me the single worked example that should carry the whole session, say what it must have and what it must lack, and explain why I should not lean on "you could have been born to different parents," which I'm fairly sure already contains the confusion I need to undo. Then map the misconceptions I should expect — genetic determinism, fatalism about "it had to happen," the idea that a different sperm would just produce you with different traits, and the slide from "necessarily" to "as a matter of fact" — and tell me where in the sequence each one should be headed off rather than merely listed. I'm also tempted to mention monozygotic twinning and the puzzle of whether a twin could have existed without the split; tell me whether to raise it or explicitly set it aside, and why. Finally, give me one question to ask in the last few minutes that would tell me whether the idea actually landed, and say what a good answer and a bad answer would sound like. As the very last line of your reply, state a one-sentence summary of the core misconception the whole session is built around, beginning with "Summary:".
