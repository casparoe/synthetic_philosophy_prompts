answer: |-
  ### Teaching Plan: 50-Minute Discussion Section on Origin Essentialism

  #### 1. Sequence and Dependencies
  You must structure the session so that students separate **numerical identity** from **qualitative similarity** before introducing the specific constraints of biological origin. The order is critical because if they assume "identity" means "sameness of properties," Kripke’s thesis becomes immediately unintelligible to them.

  1.  **Review (0–5 mins):** Intuition pump for "could have been otherwise." Avoid definitions of modality; ask for examples of things that were contingent (e.g., "You could have worn a blue shirt today") versus things that feel fixed (e.g., "This table is not made of ice").
  2.  **Prerequisite: Numerical vs. Qualitative Identity (5–10 mins):** Establish the difference between two objects looking exactly the same (qualitative) and them being the *very same object* (numerical). Use a non-biological analogy first (e.g., two identical coins).
      *   *Dependency:* You cannot proceed to the biological case until students agree that two distinct things can share all properties.
  3.  **The Crucial Distinction: Upbringing vs. Origin (10–15 mins):** Explicitly distinguish "how you were raised" from "where you started biologically." Define "Origin" strictly as the specific union of sperm and egg at conception.
      *   *Dependency:* This separation prevents students from smuggling in environmental variables later.
  4.  **The Worked Example (15–35 mins):** Walk through the single thought experiment. Pause at the counterfactual moment to solicit student intuitions before revealing the standard Kripkean conclusion.
  5.  **Synthesis & Q&A (35–50 mins):** Formalize the thesis and field remaining objections.

  #### 2. The Single Worked Example
  **Subject:** "Elara."
  **Requirements for the Scenario:**
  *   **Must Have:** A specific sperm cell ($S_1$) and egg cell ($E_1$) that fuse to create Elara. A second possible sperm cell ($S_2$) available to the father that is *not* $S_1$.
  *   **Must Lack:** Any variation in childhood, environment, or social role. The scenario must posit that $S_2 + E_1$ creates a being who is genetically (and therefore phenotypically) indistinguishable from Elara.
  *   **Narrative Arc:**
      1.  Elara is born from $S_1$ and $E_1$. She grows up to be a philosopher named Elara.
      2.  Construct a counterfactual world: The father produces a flood of sperm; in this world, $S_2$ is used instead of $S_1$, hitting $E_1$.
      3.  State clearly that the resulting baby grows up with the exact same memories, name, and body (assuming genetic redundancy allows for this, or simply stipulate a perfect lookalike twin).
      4.  Ask the class: "Is the baby from the second scenario Elara?"
  *   **Reasoning:** This isolates the variable (the sperm) while holding everything else constant (the mother, the egg, the environment, the phenotype). This forces the choice between "Identity follows Phenotype" vs. "Identity follows History."

  #### 3. Why Not "Different Parents"?
  Do not start with "Could you have been born to different parents?" because the phrase "born to" conflates **genetic origin** with **social parenthood**.
  *   **The Trap:** Students will instinctively answer "Yes" based on adoption or sperm donation cases, arguing they could have a different *legal* parent or be raised elsewhere.
  *   **The Consequence:** This turns the debate into a discussion about social identity and upbringing rather than biological metaphysics. By using the term "gametes" (or specific sperm/egg cells) immediately after separating "raising" from "originating," you bypass the semantic ambiguity of "parent" and force the question to remain about the raw biological materials that constitute the starting point of the life.

  #### 4. Mapping Misconceptions to the Sequence
  Do not wait for these to appear as questions; predict and deflect them at specific moments in the script.

  *   **"Different Sperm = Same Person" (Numerical Confusion)**
      *   *When to Head Off:* During the **Worked Example**, immediately after presenting the $S_2$ scenario.
      *   *Method:* Before allowing students to vote, press them: "If I replace one grain of sand in a heap, is it a new heap? If I replace the sperm, do we have continuity of substance?" Force them to acknowledge that $S_1$ and $S_2$ are numerically distinct entities, making the resulting embryos distinct entities regardless of appearance.
  *   **Genetic Determinism ("But if the genes change, the traits change")**
      *   *When to Head Off:* During the **Prerequisites**, when establishing Qualitative vs. Numerical Identity.
      *   *Method:* Clarify that we are **stipulating** the outcome. Even if $S_2$ would naturally cause different hair color, imagine a world where the developmental process adjusts so the child looks identical. Ask: "Even if he looked exactly the same, is he him?" This isolates the biological origin from the physical manifestation.
  *   **Fatalism / "It Had to Happen"**
      *   *When to Head Off:* During the **Review**, when discussing necessity.
      *   *Method:* Emphasize that we are talking about *metaphysical* possibility, not statistical probability. The event was contingent (they could have missed each other), but once the specific sperm hit the egg, the identity of the resulting organism was fixed. Distinguish between "It was not determined beforehand that Elara would be born" (contingent existence) and "Once Elara existed, she could not have come from $S_2$" (essential origin).
  *   **Slide from "Necessarily" to "As a Matter of Fact"**
      *   *When to Head Off:* During the **Synthesis**, when summarizing the conclusion.
      *   *Method:* Watch for phrases like "Since Elara did exist, she had to be that sperm." Counter with: "She had to be that sperm *given that she is Elara*. In a different world where that sperm wasn't used, there would simply be someone else." Remind them that origin is a necessary condition of identity, not a causal explanation of fate.

  #### 5. Monozygotic Twinning
  **Decision:** Explicitly set it aside.
  **Reasoning:** While Kripke argues origin refers to the original organism (often the embryo), mentioning twinning complicates the "gametes" thesis you are tasked with teaching. If students fixate on whether twins share the "same origin" (since they come from the same zygote eventually splitting), you will derail the specific argument about gametic exchange. Tell them: "For the purpose of this hour, assume no splitting occurs. We are interested in what happens when the *starting materials* differ entirely." Mark it as a topic for "Metaphysics II" if they push back.

  #### 6. Final Assessment Question
  Ask this in the last three minutes:

  **"If I told you that the being created from the alternate sperm has every memory you have and looks exactly like you, what is the single fact that prevents him from being you?"**

  *   **Good Answer:** Identifies the historical/causal break. Something like: "He started with different materials" or "He didn't come from my specific zygote/sperm/egg combination." This shows they grasp that identity tracks history, not current qualities.
  *   **Bad Answer:** Identifies a difference in internal experience or future potential. Something like: "Because his thoughts aren't exactly yours right now" or "Because he wasn't born yet." This shows they still treat identity as a matter of qualitative content rather than historical grounding.

  Summary: The core misconception the whole session is built around is the belief that numerical identity consists in qualitative similarity rather than historical continuity.
