  8.  **Constructing the Output:** (Mental Draft)
      *   Start with the math: It's solid.
      *   Move to the "Equally Reasonable" claim: This is controversial. Jaynes says no (invariance). Physical realizability differs.
      *   Move to "Same Event": Technically distinct random variables. Measure-theoretic nuance.
      *   Move to "Incoherence": POI isn't necessarily incoherent; the problem might be underspecified.
      *   Move to "Conventional": This is a specific philosophical stance (Subjectivism/Instrumentalism), not a necessary deduction. Propensity theorists disagree.
