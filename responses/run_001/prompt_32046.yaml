      *(Self-Correction during drafting)*: Wait, regarding Jaynes. Jaynes specifically addressed Bertrand's Paradox. He argued that the problem *must* be invariant under rotation, translation, and scaling. He concluded that only one distribution satisfies all these symmetries (specifically regarding the location of the chord relative to the observer). That yields the **1/2** answer. So a defender of the POI (like Jaynes) wouldn't accept the summary's claim that all three are reasonable. They would say the problem needs more constraints to be well-posed. I need to make sure this is clear.

      Also, regarding "Standard Lesson." In introductory statistics texts, the lesson is "define your random variable clearly." In philosophy of probability, the lesson varies. The article claims "Probabilities are never objective facts." That is definitely *not* the consensus among professional philosophers of probability. Many believe in propensities or objective chances.

