answer: |-
  ### Part 1: The Desiderata Checklist

  For an account of interpersonal standing to count as adequate, it must satisfy the following conditions. Those marked **[NN]** are widely regarded as non-negotiable features of the phenomenon. Those marked **[CV]** reflect theoretical disagreements (Cambridge Views vary).

  **1. The Epistemic Separation [NN]**
  *   **Requirement:** The theory must allow that a blame judgment can be *true* and *accurate* even when the blamer lacks standing.
  *   **Why forced:** Ordinary language distinguishes "You're right about him, but you can't say it" from "You're wrong about him."
  *   **Data point:** A thief correctly accusing another thief of robbery. The accusation is true; the speaker still lacks authority.

  **2. The Hypocrisy Blockade [NN]**
  *   **Requirement:** Current unrepentant participation in the very wrong one condemns normally defeats standing.
  *   **Why forced:** To blame is to invoke a normative expectation. Doing so while violating it undermines the normative force of the complaint.
  *   **Data point:** The unrepentant hypocrite. Even if sincere, their current conduct creates a practical contradiction that silences them.

  **3. The Reform Exception [CV]**
  *   **Requirement:** Past wrongdoing should not permanently disqualify a person once they have meaningfully reformed.
  *   **Why forced:** If standing were tied only to past acts, moral improvement would never restore agency.
  *   **Data point:** The person who did the thing decades ago and now blames sincerely. (Some theories deny this, marking past stains as permanent; [CV]).

  **4. The Proximity Gradient [CV]**
  *   **Requirement:** Standing is stronger where the relationship is closer, but it does not vanish entirely for total strangers (though it is weaker).
  *   **Why forced:** Blame feels differently intrusive coming from a spouse versus a neighbor versus a random passerby.
  *   **Data point:** Friend vs. Total Stranger. The friend's critique carries relational weight (trust/bond) the stranger lacks.

  **5. The Third-Party Perimeter [NN]**
  *   **Requirement:** Mere knowledge of a wrong is insufficient for full standing; there must be a stake or relation to the wrong.
  *   **Why forced:** Pure observation allows us to *report*, but not to *hold accountable* in the way blame demands.
  *   **Data point:** The uninvolved third party. They can witness injustice but often lack the right to confront the perpetrator personally without becoming "meddlesome."

  **6. The Complication of Shared Guilt [CV]**
  *   **Requirement:** The theory must handle partial culpability (enablers) differently than direct perpetrators.
  *   **Why forced:** We don't expect a victim of a crime to forgive an accomplice's role in the broader scheme.
  *   **Data point:** The person complicit in a different but related way. (e.g., A racist criticizes a sexist act—some say this works; others say shared systemic guilt muddies the water.)

  **7. The Meta-Blame Test [NN]**
  *   **Requirement:** The theory must account for the practice of criticizing the *accuser* without conceding the *accusation*.
  *   **Why forced:** We do not treat "You have no standing" as synonymous with "Your criticism is false."
  *   **Data point:** Ordinary practice. We tell people, "That's none of your business" or "Who are you to say?" even when admitting the fault exists.

  ***

  ### Part 2: Is There a Hidden Contradiction?

  **Yes, a conceptual fracture exists in the requirements.**

  The core tension is between **Norm Equality** and **Personal Agency**.

  1.  **The Universal Norm:** If morality is universal (as implied by Requirement 2), then the standard of rightness applies equally to everyone. Therefore, any agent capable of reasoning ought to recognize the wrong.
  2.  **The Restrictive Authority:** But Requirements 4, 5, and 6 imply that *who* speaks matters more than *what* is said. This grants special epistemic/normative access to insiders or victims.

  **The Unsatisfiability:**
  No single theory can seamlessly explain why a stranger's accurate condemnation is *true* (Req 1) yet *forbidden* (Req 5) without treating "truth" and "permission" as radically severed.
  *   If standing is based on the **wrongdoing itself**, then every rational agent has standing (violates Req 5).
  *   If standing is based on **relationship**, then strangers cannot genuinely blame (violates Req 1's implication that they understand the truth).
  *   **The Verdict:** You are right to suspect there is no "One Thing." Standing appears to be a hybrid concept conflating **Truth-Conditions** (does the blame apply?) and **Propriety-Conditions** (is it appropriate for *you* to voice it?). An adequate theory must admit this duality rather than trying to reduce one to the other.

  ***

  ### Part 3: The Scorecard

  Here is how the major contenders run against this checklist.

  | View | Hypocrisy Blockade | The Reform Exception | Third-Party Perimeter | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Hypocrisy-Based**<br>*(e.g., Wallace/Kagan)* | **Passes.** Explains the block well: it's about inconsistency. | **Fail.** Struggles to explain why reform restores authority. The past taint remains theoretically sticky. | **Weak.** Often treats standing as binary. If I'm not a hypocrite, I *should* be able to blame. Makes strangers sound overly intrusive. | Too rigid on the self; too loose on the world. |
  | **Relationship-Based**<br>*(e.g., Wallis/Scanlon)* | **Mixed.** Works well on friends/victims. | **Passes.** Relationships evolve; past wrongs don't sever bonds forever if repaired. | **Fails.** Strangers effectively have no standing. Makes collective moral outrage difficult to justify (why do *I* care?). | Protects intimacy; sacrifices universal accountability. |
  | **Eliminativist**<br>*(e.g., Strawson/Sykes)* | **N/A.** Denies the category exists. Claims we confuse efficacy with authority. | **N/A.** Argues "You can't blame him" means "It won't work," not "He has no right." | **Passes (Technically).** Reduces standing to pragmatic social consequences. | Saves the logic; loses the phenomenology. We *feel* the normativity of standing, they deny it. |

  ### Recommendation for the Seminar

  When evaluating the next paper, look for this specific move: **How does the author define the object of the blame?**
  *   If they say you blame the **act**, standing is mostly irrelevant (pushes toward eliminativism).
  *   If they say you blame the **agent's stance toward the community**, standing depends on membership (Relationship view).
  *   If they say you blame the **violation of a mutual commitment**, hypocrisy destroys the bond (Hypocrisy view).

  **Your Best Line of Questioning:** *"Does your account treat 'lacking standing' as making the blame void (invalid) or merely offensive (improper)? How do we keep these apart without collapsing standing into mere etiquette?"* This forces them to address the **Epistemic Separation (Req 1)**, which is usually the weakest link in their architecture.
