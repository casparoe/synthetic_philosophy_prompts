answer: |-
  **JOINT ADVERSARIAL COLLABORATION DOCUMENT: THE DUST SPECKS PROBLEM**

  **To:** Members of the Working Group on Population Ethics
  **From:** Coordination Office
  **Date:** 24 October 2023
  **Subject:** Draft Framework for Adversarial Collaboration on Aggregation and Severity

  ---

  ### 1. Jointly Accepted Claims and Framing

  The undersigned parties (hereafter 'The Aggregationists' and 'The Thresholdists') hereby endorse the following claims regarding the conceptual landscape of the Dust Specks Problem. This section establishes the common ground upon which the disagreement rests.

  1.  **Formulation of the Problem.** Both parties agree that the central question is whether a specific outcome (Outcome A: one person suffering intense, prolonged torture) is all-things-considered worse than another outcome (Outcome B: a vast number of people each suffering a trivial irritation, such as a dust speck in the eye). It is accepted that this comparison must hold under conditions of ideal theory (i.e., ignoring practical constraints on implementation or knowledge).
  2.  **The Role of Intuition.** Both parties acknowledge that the conflict arises from a clash of competing moral intuitions. The Aggregationists rely on intuitions derived from continuity and small increments; the Thresholdists rely on intuitions derived from categorical distinctions between severe and trivial harms. Both admit that neither intuition is immune to counter-intuitive implications when pushed to extremes.
  3.  **Relevant Considerations.** Both parties accept that the following factors are morally relevant to the determination of severity and aggregation:
      *   The subjective experience of the sufferer (phenomenological quality).
      *   The duration of the suffering.
      *   The symmetry of treatment across persons (no discrimination in the distribution of harm).
      *   The preservation of agency (though neither position grants veto power to the individual in this specific thought experiment, the impact on agency is acknowledged as part of the harm).
  4.  **Excluded Distractions.** To preserve the integrity of the theoretical inquiry, both parties agree to treat the following as peripheral to the core normative dispute:
      *   Practical legal enforceability or social policy feasibility.
      *   Emotional revulsion toward specific scenarios independent of normative judgment.
      *   Psychological incapacity of decision-makers to count beyond certain numbers (the problem must remain tractable to reason, even if the numbers are large).
  5.  **Charitable Characterisation of Opposing Views.**
      *   *The Aggregationists acknowledge* that a purely additive model risks violating the intuition that some harms are qualitatively unique, and that accepting the dominance of dust specks requires accepting conclusions that seem repugnant to the notion of human dignity.
      *   *The Thresholdists acknowledge* that establishing a hard lexical boundary risks arbitrariness (the Sorites paradox), as it is difficult to explain why a specific threshold exists rather than a sliding scale, and that denying aggregation entirely may require sacrificing the intuition that more harm is generally worse than less harm.

  ---

  ### 2. Disagreements and Test Cases

  This table identifies the specific points of contention, the formulation each side adopts for its respective view, the underlying crux of the disagreement, and a test case designed to probe that crux. Predictions are recorded in advance of further empirical or dialectical investigation.

  | Point of Disagreement | Formulation: The Aggregationist View | Formulation: The Thresholdist View | Crux and Predictive Test Case |
  | :--- | :--- | :--- | :--- |
  | **I. Cardinal Continuity of Harm** | Harms are commensurable along a single cardinal axis. Any positive disutility, however minute ($>0$), contributes to a sum that can exceed any finite negative value. There is no intrinsic cap on the weight of trivial harms. | Certain harms occupy a higher *lexical* tier. When a harm crosses a qualitative threshold of severity, it becomes incommensurable with harms below that threshold. No amount of lower-tier harm sums to exceed the higher tier. | **The Test Case:** *The Incremental Shift.* Suppose we replace one dust speck in Outcome B with a sensation slightly more irritating, but still objectively negligible. Repeat until the sensation becomes a minor annoyance.<br>**Prediction:**<br>• **A:** Every step preserves the possibility of eventual outweighing, provided the number of sufferers increases accordingly.<br>• **B:** At some undefined point before the sensation becomes severe, the ability to outweigh torture vanishes regardless of the number of sufferers. |
  | **II. The Nature of 'Worse'** | 'Worse' denotes a comparative relation on a unified scale of overall disvalue. If Sum($H_{trivial}$) > Value($H_{severe}$), then the aggregate outcome is objectively worse, regardless of distributional concerns.<br><br>Formulaically: $\Sigma (n \times v) < V_{torture}$. | 'Worse' denotes a strict ordering where Quality precedes Quantity. Once a harm is identified as a Category X harm (Severe), it dominates any aggregate of Category Y harms (Mild), regardless of $n$.<br><br>Formulaically: $H_{severe} \gg n \times H_{mild}$. | **The Test Case:** *The Trade-Off Scarcity.* A choice must be made between saving one person from immediate torture OR curing the eyes of $10^{50}$ people who currently have dust specks in them. Resources are exhausted after either option is chosen.<br>**Prediction:**<br>• **A:** Curing the $10^{50}$ people is the better choice, assuming the calculation holds for a smaller $N$, and continuity applies up to $10^{50}$.<br>• **B:** Preventing the torture is the only permissible choice, even if resources were wasted on the mass cure afterwards. |
  | **III. Sensitivity to Distribution** | The total disvalue depends solely on the sum of experiences. How the burden is distributed among individuals is secondary to the total volume of disvalue produced. | The distribution of harm matters intrinsically. Concentrated severe harm creates a disvalue multiplier that dispersed mild harms cannot replicate, simply because of the concentration itself. | **The Test Case:** *The Splitting Experiment.* Take the harm of torture. Spread it thinly across 1 billion people (each gets a momentary sharp pain instead of prolonged torture). Compare this spread version against the original dust specks scenario.<br>**Prediction:**<br>• **A:** The spread version might now be comparable to or outweighed by the dust specks, depending on whether the 'momentary sharp pain' remains above the threshold.<br>• **B:** If the spread version eliminates the torture threshold (breaking it into sub-severe pains), the comparison changes. However, so long as the original torture condition exists as a baseline, the lexical protection remains active against the specks. |

  ---

  ### 3. Closing Note on Verbal and Substantive Dispute

  In the course of preparing this document, the parties sought to distinguish between verbal disagreements (stemming from terminology) and substantive disagreements (stemming from axiological commitments).

  It was noted that a portion of the historical friction appeared to stem from the usage of the term **'incommensurable.'** The Thresholdists sometimes employed this to mean 'cannot be traded off,' whereas the Aggregationists initially interpreted it as 'cannot be measured.' Upon clarification, the parties agreed this was largely verbal. Both agree that measurements can be attempted; they disagree on whether the result of such measurement should dictate the moral conclusion when thresholds are involved.

  However, the substantive disagreement remains irreducible. The parties agree that the divergence lies in the structure of value theory itself:
  1.  Whether value is linear and continuous (Aggregation); or
  2.  Whether value includes discontinuous jumps or tiers (Threshold).

  Consequently, while the vocabulary has been aligned to facilitate clearer debate, the resolution of this problem depends on a deeper metaphysical or evaluative commitment regarding the unity of good and evil. The adversarial collaboration is therefore intended not to resolve this axiom immediately, but to isolate the precise consequences of each axiom through rigorous testing.

  **Signed,**

  __________________________
  _Proponent of Aggregation_

  __________________________
  _Proponent of Lexical Threshold_

  **On behalf of the Working Group,**

  __________________________
  _Coordinator_
