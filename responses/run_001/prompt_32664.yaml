answer: |-
  Here is a complete design for the "Emergency Override" seminar activity.

  ### 1. The Thought Experiment
  **Title:** The Emergency Override
  **Structure:** A high-stakes "Switch Variant" scenario (logically isomorphic to the Trolley Problem but stripped of the familiar language).
  **Core Facts:**
  1.  A critical power grid failure threatens to cause a massive explosion.
  2.  The explosion would destroy the facility and kill everyone inside (**5,000 people**).
  3.  The only way to stop the explosion is to divert the excess energy into a secondary containment chamber.
  4.  Activating this diversion triggers an immediate overload in that chamber.
  5.  A single maintenance technician is currently working alone in that chamber and will die.
  6.  If you do **not** activate the diversion, the 5,000 die.
  7.  **Your Task:** Decide whether activating the diversion is permissible/morally required.

  **Why this works:** It uses high stakes to trigger urgency, removes the "physical contact" of pushing a fat man (making it purely procedural), and keeps the mathematical ratio extreme (5,000 : 1) to heighten the temptation to utilize utilitarian logic.

  ---

  ### 2. The Two Versions (Verbatim Handouts)
  *Instructions to Instructor: Print these back-to-back (or on separate sheets). Do not label them Version A/B on the paper. Just "Handout 1" and "Handout 2." Divide the class physically down the middle before handing them out.*

  #### **HANDOUT 1 (The Statistical/System Frame)**
  **Subject:** Grid Failure Protocol 7-A
  **Status:** CRITICAL

  At 14:03 hours, the primary reactor experienced a thermal cascade failure. Automated systems indicate a projected detonation within 45 seconds. Current estimates suggest a blast radius covering the entire complex, resulting in the confirmed loss of approximately **5,000 personnel**.

  Manual intervention is available via the **Redundancy Transfer Switch**. Engaging the switch reroutes the energy load into Sector 4 Containment. Data models confirm that Sector 4 isolation will successfully neutralize the cascade, preserving the main population center.

  However, the load transfer imposes lethal structural stress on Sector 4. Occupant sensors detect **one (1) maintenance unit** currently active in Sector 4. Probability of occupant survival is <1%.

  **Question:** Given the aggregate preservation of life, does the protocol authorize the engagement of the Redundancy Transfer Switch?

  *(Note on Framing: Uses passive voice ("detonation will occur"), technical jargon ("thermal cascade," "occupants sensors"), focuses on "personnel" and "unit," presents the choice as a data-driven authorization.)*

  #### **HANDOUT 2 (The Human/Agent Frame)**
  **Subject:** Immediate Safety Decision
  **Status:** URGENT

  You stand at the controls. An alarm screams. The lights flicker violently. A massive explosion is imminent—a fireball that would tear through the walls and swallow the crowd waiting behind you. There are **5,000 people** right now who will never see sunset if this chain reaction completes.

  Your hand hovers over the manual **Override Lever**. It is your only option. If you pull it, the excess power is diverted into the lower vault.

  Inside that vault, a young technician is working on a wire. They are alone. The surge won't wait; the moment the circuit connects, the energy will flash over. The technician will be caught in the blast. Their death is certain. But the crowd behind you will be safe. They will live to tell the story.

  **Question:** Is it right for you to pull the lever and sacrifice the person in the vault to save the thousands outside?

  *(Note on Framing: Uses active voice ("You stand," "Your hand hovers"), sensory details ("alarm screams," "lights flicker," "swallow the crowd"), humanizes the victim ("young technician," "never see sunset"), emphasizes your agency ("it is your only option").)*

  ---

  ### 3. The Procedure (75 Minutes)

  **Phase 1: Setup & Individual Judgment (10 Minutes)**
  1.  **Welcome (5 min):** Briefly welcome students. Tell them: *"Today we are practicing analysis. You will read a short scenario and make a decision. Be honest. Trust your gut."* **Do not mention "framing" or "bias."**
  2.  **Distribution (1 min):** Seat students randomly or ask them to choose Left or Right side of the room. Distribute Handout 1 to the Left half, Handout 2 to the Right half.
  3.  **Silent Writing (4 min):** Ask students to spend 4 minutes writing down:
      *   Their verdict (Allowed/Forbidden/Maybe).
      *   Their top three reasons why.
      *   *(Crucial instruction: "Do not discuss yet.")*

  **Phase 2: Within-Group Discussion (20 Minutes)**
  1.  **Small Groups (15 min):** Have students form groups of 3–4. Ensure each group is *mono-version* (only people with the same handout together).
      *   *Task:* Share your verdicts and reasons. Try to reach consensus. Identify what specific phrase in the text influenced you most.
  2.  **Group Prep (5 min):** Assign one scribe per group to tally the verdicts (Allowed vs. Forbidden) and note the strongest argument for the majority position.

  **Phase 3: Between-Group Comparison (15 Minutes)**
  1.  **Polling:** Ask for a show of hands: "How many in the Left section thought 'Allowed'? How many 'Forbidden'?" Repeat for Right section. Record the split on the board. (Expect ~80% Allowed on Left, ~80% Forbidden on Right).
  2.  **Cross-Talk:** Open the floor. Ask members from the "Forbidden" group to argue their case to the "Allowed" group. Then reverse.
      *   *Goal:* Allow the emotional resonance of one version to clash with the cold logic of the other. Let them feel the friction.

  **Phase 4: The Reveal (10 Minutes)**
  1.  **Side-by-Side:** Project both texts on the screen.
  2.  **Ask:** *"Read silently. What are the factual differences between the Left Version and the Right Version?"*
  3.  **Guide:** Prompt them until they realize the *facts* are identical. The death toll, the action, the location are the same.
  4.  **Pivot:** *"If the facts are the same, why did our intuitions diverge so sharply?"* (Pause for answer).

  **Phase 5: The Debrief / Dennett Connection (20 Minutes)**
  *(See Section 4 below)*

  ---

  ### 4. The Debrief Plan
  *Goal: Map the textual features onto the philosophical concept of "Intuition Pumps."*

  **Step 1: Anatomy of the Persuasion (5 min)**
  Project both texts again. Highlight specific differences. Ask:
  *   *"Look at Handout 2. Who is the agent? You. Handout 1? A protocol."*
  *   *"Handout 2 mentions 'a young technician.' Handout 1 says 'maintenance unit.'"*
  *   **Point:** Explain that intuition pumps rely on **Salience**. What details are brought into the foreground dictates where we place moral weight. Dennett argues we often mistake the *vividness* of a detail for its *relevance*.

  **Step 2: The Function of Thought Experiments (5 min)**
  *   Ask: *"Does this mean my intuition is wrong?"*
  *   Lead discussion: Intuitions are heuristics. They are fast.
  *   **Dennett Connection:** Explain that Dennett calls these devices **"Intuition Pumps."** They aren't designed to prove a logical truth (like mathematics); they are designed to *pump* a pre-existing conviction.
  *   Quote Reference: Mention Dennett’s warning from *Intuition Pumps and Other Tools for Thinking*: "Do not confuse the strength of the feeling with the strength of the argument."

  **Step 3: Structural Isomorphism (5 min)**
  *   Define **Structural Isomorphism**: Two arguments that differ in presentation but share the exact logical skeleton.
  *   Point out that in philosophy, we want arguments to rest on structure, not packaging. If a conclusion depends on whether we say "maintenance unit" or "young technician," the argument hasn't found its bedrock yet.
  *   **Methodological Takeaway:** When analyzing a philosopher's thought experiment, we must learn to strip away the "paint" to see the "beams."

  **Step 4: Critical Evaluation (5 min)**
  *   Ask: *"Are all intuition pumps bad?"*
  *   Consensus Building: No. They help us visualize impossible cases (e.g., Gettier cases, Mary the Color Scientist).
  *   Qualification: We must treat them as **tools**, not **proofs**. Use them to test consistency, not to generate absolute moral laws.
  *   Closing question: *"How will you handle intuition pumps differently when you read them next week?"* (Target answer: With suspicion/interrogation of the framing).

  ---

  ### 5. Candid Troubleshooting Notes

  **Problem 1: The "But the Facts Are Different!" Objection**
  *   *What happens:* A sharp student will argue, *"Handout 2 implies I am personally responsible, Handout 1 says I am authorizing a protocol. That is a structural difference!"*
  *   *Handling:* Validate them. Say: *"That is a very good critique of the text."* Then ask the whole class: *"If we took away the emotion—the screaming alarm, the nameless unit—are we judging a different logical problem? Or just a different flavor of the same problem?"*
  *   *Pedagogy:* Acknowledging the objection proves you aren't trying to "trick" them. It shifts the conversation from "I was manipulated" to "Language shapes agency."

  **Problem 2: Time Slip on Small Groups**
  *   *What happens:* Groups get lost in debate and run 10 minutes over. You rush the debrief.
  *   *Handling:* Put a visible timer on the slide. When 5 minutes remain in group work, interrupt with a chime or light raise of hand. Cut the second round of cross-talk short if needed; focus entirely on the text comparison in the final phase.

  **Problem 3: Political Polarization**
  *   *What happens:* Students interpret the "5,000 vs 1" as a policy debate (e.g., quarantine, resource allocation) and bring external political beliefs into it, overshadowing the framing analysis.
  *   *Handling:* Ground it in the text. *"Regardless of your political view on triage policies, look at the text itself. Does the word 'cascade' change your feeling compared to 'explosion'? Stick to the literary evidence."*

  **Problem 4: Students Feeling "Tricked"**
  *   *What happens:* Students feel patronized because their judgments didn't match. They disengage.
  *   *Handling:* Normalizing the experience. *"Daniel Dennett says this happens to the best philosophers. Kant had intuition pumps; Mill had intuition pumps. The point isn't that you're gullible; it's that language is always loaded. Today you got to calibrate your own receiver."*

  **Problem 5: Silence During Reveal**
  *   *What happens:* When asked "What is the difference?", nobody answers.
  *   *Handling:* Pre-read the text yourself. Pick the most obvious phrase and offer it as a seed. *"Did anyone notice how Handout 1 refers to the death as a statistical probability, while Handout 2 describes it as a certainty?"* Once one observation is made, others usually follow.
