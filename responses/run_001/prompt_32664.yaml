      *   *Version 1:* The 1 person is a **volunteer safety monitor** who signed a waiver.
      *   *Version 2:* The 1 person is an **unwitting tourist** wandering the tracks.
      *   *No, that changes the facts (consent).*
      *   *Okay, I need the facts to be identical.*
      *   *Decision:* I will use a **"Resource Scarcity"** scenario. It's clean and allows adjective shifts.
      *   **Scenario:** A hospital has one ventilator left. Two patients arrive. Patient A needs it to live 5 years longer than average. Patient B needs it to live 20 years longer. Both will die otherwise. Who gets it?
      *   *Frame A:* Focus on Patient B (The Young Person). Emphasize potential, future milestones.
      *   *Frame B:* Focus on Patient A (The Established Person). Emphasize contributions made, dependents relying on them now.
      *   *Problem:* This relies on value judgments about age/contribution, not just rhetoric.

      *   *Let's pivot to a purely semantic framing effect on the SAME scenario.*
      *   **The "Tax" Scenario.** (Classic example of tax vs fee).
      *   *Not ethical.*
      *   **The "Criminal Punishment" Scenario.**
      *   *Structure:* A criminal committed a crime. Sentence options: A or B.
      *   *Version A:* Option A is described as "Probation + Community Service." Option B is "Imprisonment + Labor."
      *   *Version B:* Option A is "Community Supervision." Option B is "Detention."
      *   *Too trivial.*

      *   *Okay, I found the sweet spot.* **The "Drone Pilot" Scenario.** (Military/Civilian collateral damage).
