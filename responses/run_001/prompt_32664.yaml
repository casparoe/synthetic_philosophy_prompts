      *   *Version 1 (Strategic/Outcome focused):* The text highlights the calculation of net lives saved (50 - 1 = +49). It uses words like "efficiency," "neutralize," "asset."
      *   *Version 2 (Human/Agent focused):* The text highlights the individual agency involved. Words like "pull trigger," "hand on button," "small body," "mother crying later."
      *   *Prediction:* Version 1 leads to "Permissible". Version 2 leads to "Impermissible".
