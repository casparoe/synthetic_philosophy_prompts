      *   *Essential vs. Accidental:* Causal mechanisms vs. Spurious correlations. Origin/Composition = Structural equation parameters. Appearance/Location = Input features subject to noise/shift.
      *   *Anti-Descriptivism:* Don't define classes by feature thresholds (descriptions). Define them by their generation process. The label isn't a classifier output based on current pixels; it's an index to the generator.
      *   *Necessary A Posteriori:* The identity between two observations is structurally invariant (holds across all valid environments) but wasn't known before seeing the joint distribution. The prior didn't force it; the data revealed the structural overlap.

  4.  **Developing the Residue Report (Critique & Limits):**

      *   *What works:* Distinction between spurious correlation (accidental) and causal structure (essential). Distribution shift corresponds nicely to modal semantics.
      *   *What bends:* "A Priori". In ML, "A Priori" usually means "Inductive Bias" (pre-data assumptions). But Kripke's "A Priori" is epistemic justification independent of experience, not just architectural constraints. "A Posteriori" implies empirical discovery, which maps to learning, but Kripke's "Necessity" is metaphysical, not just robustness to shift.
      *   *What breaks:* Modal logic's "All Possible Worlds". ML deals with the actual world + shifts we anticipate. We don't have access to logical counterfactuals in the same way.
      *   *Specific Question (A Priori/Necessary -> Bias/Invariant):* This is the critical tension.
          *   *Necessary $\approx$ Invariant:* Good fit. If a property holds in all counterfactuals, it's invariant across environments.
          *   *A Priori $\approx$ Inductive Bias:* Risky. Bias restricts hypothesis space. Necessity is about the *truth conditions* of the proposition, not our ability to compute it. You can have a strong inductive bias that is wrong. You can know something a priori that happens to be false in this world (according to some views), but for Kripke, necessary truths *must* be true.
          *   *Collapse Risk:* Equating necessity with empirical invariance conflates ontology with robustness. "Hesperus=Phosphorus" is necessarily true because they are the same planet. In ML, if a model predicts $A=B$ due to bias, and $A \neq B$ in reality, the model fails. Kripke says the truth is mind-independent.
