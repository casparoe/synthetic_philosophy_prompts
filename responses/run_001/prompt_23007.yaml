                      *   $P(Y,Y|H) = 0.64$. $P(Y,Y|L) = 0.04$. Total $P(Y,Y) = 0.34$.
                      *   $P(N,N|H) = 0.04$. $P(N,N|L) = 0.64$. Total $P(N,N) = 0.34$.
                      *   $P(Y,N|H) = 0.16$. $P(Y,N|L) = 0.16$. Total $P(Y,N) = 0.16$. (Same for N,Y).
                  *   Posteriors:
                      *   Given YY: $P(H|YY) = \frac{0.34 \text{ part from } H}{0.34} = \frac{0.5 \times 0.64}{0.34} = \frac{0.32}{0.34} \approx 0.94$. $E[A] \approx 94 - 6 = 88$.
                      *   Given NN: $P(H|NN) \approx 0.06$. $E[A] < 0$. Choose W (0).
                      *   Given Mixed (YN/NY): Posterior stays at 0.5 (because likelihood ratio is 1). Decision remains Indifferent (or choose base case). Value contribution approx 0? Or slight adjustment depending on risk preference (assume risk neutral, value 0).
