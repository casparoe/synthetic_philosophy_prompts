          *   *Calculation Check:*
              *   Base Case: Value = 0 (by choosing optimally after seeing signal). Since prior makes us indifferent, any signal pushing probability away from 0.5 creates value.
              *   $P(S|H) = 0.8, P(S|L) = 0.2$.
              *   $P(S) = 0.5(0.8) + 0.5(0.2) = 0.5$.
              *   $P(H|S) = \frac{0.5 \times 0.8}{0.5} = 0.8$.
