answer: |-
  Your colleague is correct. While computing Expected Value of Information (EVPI) for individual studies is a useful heuristic, treating those values as additive is mathematically unsound and practically dangerous for resource allocation.

  Information exhibits **diminishing marginal utility**. Just as buying a second cup of coffee does not yield twice the alertness of the first, acquiring a second piece of information often yields less than the sum of the two individual values because they may resolve the same underlying uncertainty. In decision theory, this property is known as **subadditivity** (or submodularity) of the value of information.

  Here is an argument for her position, broken down into the theoretical explanation, a concrete demonstration, the role of monotonicity, and practical recommendations for your team.

  ---

  ### 1. Why Information is Not Additive: Substitutability

  The core reason EVPI is non-additive is that decisions are driven by *uncertainty*, not data points. When you fund Study A, you are paying to reduce the variance of your decision-making variables. Once that variance is reduced, additional data provides less leverage.

  If Study A and Study B target the same underlying risk factor (e.g., willingness to pay), they are **substitutes**. If Study A determines with 90% confidence that the market is too small, Study B confirming this adds no decision value. You already knew the decision: "Do not launch."

  Mathematically, the value of a portfolio of studies $S = \{S_1, S_2\}$ is not $V(S_1) + V(S_2)$. Instead, it is:
  $$V(S_1, S_2) = V(S_1) + V(S_2 | S_1)$$
  Where $V(S_2 | S_1)$ is the marginal value of Study B *given* that you have already conducted Study A. In many cases, $V(S_2 | S_1) < V(S_2)$. Thus, the joint value is strictly less than the sum of isolated values.

  ### 2. A Concrete Decision Problem

  To demonstrate this, let’s build a minimal product launch scenario.

  **The Decision:**
  *   **Launch Product:** Costs \$50k. If successful, generates \$150k profit. If failed, total loss is \$50k.
  *   **Don't Launch:** Payoff is \$0.
  *   **The Uncertainty:** There is a 50% chance of Success ($H$) and 50% chance of Failure ($L$).
      *   Expected Value of Launch = $0.5(\$100k) + 0.5(-\$50k) = \$25k$.
      *   Since \$25k > \$0, you would **Launch** blindly.
      *   *Problem:* To have EVPI, the study must potentially change your mind. Let’s adjust the costs slightly to create an "Indifference Zone."

  **Revised Scenario (Creating EVPI):**
  *   **Cost:** \$75k. **Revenue if Success:** \$150k. Net Profit if Success: \$75k. Loss if Failure: -\$75k.
  *   **Prior:** 50% Chance of Success ($H$).
  *   **Baseline Value:** Without information, $E[\text{Launch}] = 0.5(75) - 0.5(75) = 0$. You are indifferent. For simplicity, assume the "Do Nothing" option is strictly preferred if the expected value is $\leq 0$. **Baseline Value = \$0.**

  **The Studies:**
  We have two candidate studies, Study 1 and Study 2. Both are imperfect tests for Market Success.
  *   **Reliability:** If the market is actually Good ($H$), the test says "Positive" 80% of the time. If the market is Bad ($L$), it says "Positive" 20% of the time (noise).
  *   **Independence:** Conditional on the true state of the market, the results of Study 1 and Study 2 are independent.

  #### Calculating Individual EVPI (The Mistake)
  Let’s calculate the EVPI of Study 1 in isolation.
  1.  **Probability of a Positive Test Result:** $P(Pos) = 0.5(0.8) + 0.5(0.2) = 0.5$.
  2.  **Posterior Belief after Positive Result:** Using Bayes' rule:
      $$P(H|Pos) = \frac{0.5 \times 0.8}{0.5} = 0.8$$
  3.  **Decision after Positive Result:**
      $E[\text{Launch}|Pos] = 0.8(75) - 0.2(75) = 60 - 15 = 45$.
      We Launch. Payoff = \$45k.
  4.  **Posterior Belief after Negative Result:**
      $P(H|Neg) = 0.2$.
      $E[\text{Launch}|Neg] = 0.2(75) - 0.8(75) = -45$.
      We Don't Launch. Payoff = \$0.
  5.  **Expected Value with Study 1:** $0.5(\$45k) + 0.5(\$0) = \$22.5k$.
  6.  **EVPI(Study 1):** $\$22.5k - \$0 (\text{Baseline}) = \mathbf{\$22.5k}$.

  By symmetry, **EVPI(Study 2)** is also **\$22.5k**.
  **Naïve Additive Assumption:** Total Value = $\$22.5k + \$22.5k = \mathbf{\$45k}$.

  #### Calculating Joint EVPI (The Reality)
  Now suppose we fund **both** studies. We observe two signals: $(S_1, S_2)$. Possible outcomes are $(Pos, Pos), (Pos, Neg), (Neg, Pos), (Neg, Neg)$.
  Assuming conditional independence given the truth:
  *   $P(Pos, Pos | H) = 0.8 \times 0.8 = 0.64$
  *   $P(Pos, Pos | L) = 0.2 \times 0.2 = 0.04$
  *   $P(Pos, Neg | H) = 0.8 \times 0.2 = 0.16$
  *   $P(Pos, Neg | L) = 0.2 \times 0.8 = 0.16$

  Notice that for mismatched signals (Pos/Neg), the likelihood ratios cancel out, keeping the posterior probability at the prior (50%).
  *   **Outcome $(Pos, Pos)$:**
      *   Unconditional Prob: $0.5(0.64) + 0.5(0.04) = 0.34$.
      *   Posterior $P(H)$: $\frac{0.32}{0.34} \approx 0.94$.
      *   Decision: Launch. Expected Value $\approx 0.94(75) - 0.06(75) = \$66$.
  *   **Outcome $(Neg, Neg)$:**
      *   Symmetric to above. $P(H) \approx 0.06$. Decision: Don't Launch. Value \$0.
  *   **Outcomes $(Pos, Neg)$ or $(Neg, Pos)$:**
      *   Combined Prob: $2 \times [0.5(0.16) + 0.5(0.16)] = 0.32$.
      *   Posterior $P(H)$: Exactly 0.5 (likelihoods match).
      *   Decision: Indifferent/Don't Launch (Per our baseline rule). Value \$0.

  **Total Expected Value with Both Studies:**
  $$EV = P(Pos, Pos) \times \$66 + P(NN) \times 0 + P(Mixed) \times 0$$
  $$EV = 0.34 \times \$66 = \mathbf{\$22.44k}$$

  **The Verdict:**
  *   Naïve Additive Value: **\$45k**
  *   Actual Joint Value: **~\$22.44k**
  *   **Conclusion:** The joint value is roughly half the sum of the individual values!
      *   Why? In 32% of the scenarios ("Mixed"), the two studies contradict each other. The information gained from the second study effectively canceled the information from the first, resetting your belief to the prior state where you would have done nothing anyway. You paid for the second study but got no extra decision power in those cases.

  ### 3. Why Monotonicity Doesn't Rescue the Additive Approach

  You might argue: *"But isn't it true that more information is always better (monotonicity)? If adding Study 2 increases total EVPI, isn't that good enough?"*

  Monotonicity implies that $EVPI(\text{Both}) \geq EVPI(\text{Single})$. In our example, $22.44 \ge 22.5$ is borderline (due to rounding/precision), but theoretically, adding a second identical study usually keeps the value flat or slightly improves it, it definitely never hurts.

  However, **monotonicity is a weak constraint for budgeting.**
  1.  **Inequality Direction:** Monotonicity guarantees $V(A+B) \ge V(A)$. It does *not* guarantee $V(A+B) \approx V(A) + V(B)$. As shown above, $22.44 \not\approx 45$.
  2.  **Budget Opportunity Cost:** If you allocate budget based on additive values, you will overfund redundant studies. You might fund both Study A and B for \$45k "value," when Study A alone provided \$22.5k for half the cost. That saved budget could have been used for a totally different, complementary study that adds new dimensions to the uncertainty.
  3.  **False Confidence:** Additive reasoning assumes the information problems are linear and orthogonal. In reality, user research questions are deeply entangled (e.g., Usability vs. Feature Value). Treating them as additive hides the correlation structure of the uncertainty.

  ### 4. Practical Recommendations for Your Team

  Since exact EVPI calculation requires building full decision trees for every combination (which becomes computationally expensive quickly), adopt this workflow to move from "Ranking" to "Portfolio Optimization":

  **1. Map Dependencies Before Valuing**
  Before calculating EVPI for any study, categorize them by what specific uncertainty they reduce (e.g., Demand Size, Churn Rate, Competitor Entry).
  *   If Study A measures "Purchase Intent" and Study B measures "Price Sensitivity," determine if knowing Purchase Intent reduces the value of Price Sensitivity testing.
  *   Flag studies as **Complementary** (reduce different uncertainties) or **Redundant** (reduce the same uncertainty).

  **2. Prioritize Marginal Value, Not Standalone Value**
  Stop selecting the top 5 highest standalone EVPI studies. Instead, use a greedy algorithm approach:
  1.  Select the study with the highest EVPI (Study A).
  2.  Recalculate the EVPI of all remaining studies **conditioned on having Study A's data**. (Study B's value will likely drop).
  3.  Pick the next highest *marginal* value study (Study C).
  4.  Repeat until budget is exhausted.

  **3. Simplify the Joint Calculation via Simulation**
  For critical launches, do not rely on hand calculations. Build a **Monte Carlo simulation**:
  *   Model the key decision variables as distributions.
  *   Simulate thousands of outcomes where you run Study A, update the distribution, and make a decision. Record the value.
  *   Simulate outcomes where you run Study A then Study B, update the distribution, and decide. Record the value.
  *   The difference between these simulations is the true joint value.
  *   *Tool Tip:* Even a simple spreadsheet with random number generation can perform 10,000 iterations in seconds to estimate this non-linearity.

  **4. Accept Stopping Rules**
  If Study A is extremely high quality (e.g., a beta with n=500 users), its EVPI may resolve so much uncertainty that Study B becomes negligible. Be willing to fund fewer, higher-quality studies rather than many smaller ones that overlap in resolution capability.

  By acknowledging that information is a **non-linear, interacting resource**, your team will avoid the trap of "double-paying" for the same insight and maximize the strategic impact of the experimentation budget.
