              *   Likelihoods given L: $0.2 \times 0.2, \dots$
              *   Posterior probabilities will shift further towards 1 or 0.
              *   However, notice that if both studies agree, value increases. But does it reach 60? No.
              *   Wait, is this subadditive? Yes. The max value possible is reducing uncertainty to 0. With Study 1 alone, we still get some false positives/negatives. With two, we reduce error further, but the *marginal* gain decreases.
              *   Let's check the math carefully to ensure Joint < Sum.
              *   Max possible payoff improvement per trial is bounded. The total variance reduction diminishes.
              *   Actually, a clearer example is when Study 1 and Study 2 ask the *same question*. If Study 1 says "It will fail", Study 2 saying "It will fail" adds zero extra certainty.
              *   Let's use the "Perfect vs. Redundant" logic for clarity, or distinct but correlated signals.
              *   Okay, I will construct the example using the logic of: Study 1 gives signal $X$. Study 2 gives signal $Y$. If $X$ and $Y$ are highly correlated or address the same underlying binary choice, the second one adds less.
              *   Let's stick to the "Two Imperfect Signals" example calculated above.
              *   One Study EVPI = 30.
              *   Two Studies EVPI calculation:
                  *   States: $YY, YN, NY, NN$.
                  *   $P(Y,H) = 0.4$. $P(N,H) = 0.1$.
                  *   $P(Y,L) = 0.1$. $P(N,L) = 0.4$.
                  *   Marginals (Unconditional):
