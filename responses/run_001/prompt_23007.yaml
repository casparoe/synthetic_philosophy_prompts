              *   Prior: $P(\text{Good}) = 0.6$. $E[\text{Launch}] = 0.6(100) + 0.4(-50) = 40$. Optimal action: Launch.
              *   Wait, I need EVPI to exist. So I need the optimal action to flip if info reveals something bad enough.
              *   *Better Setup:*
                  *   Option A: Invest \$10k. Return: \$50k (if Success) or \$0 (if Fail).
                  *   Option B: Keep \$0.
                  *   Prior $P(\text{Success}) = 0.4$.
