          4.  Provide practical recommendations for evaluating a portfolio of studies.

  2.  **Deconstruct the Core Concept (Non-Additivity of EVPI):**
      *   *What is EVPI?* It's the expected increase in payoff from making a decision *with* information vs. *without* it.
      *   *Why isn't it additive?* Because information reduces uncertainty. If Study A resolves most of the uncertainty relevant to the decision, Study B provides little *additional* marginal benefit. They are substitutes. Conversely, if they resolve independent uncertainties, they might be complements, but rarely strictly additive (often sub-additive due to diminishing returns on uncertainty reduction).
      *   *The "Portfolio" Problem:* We have a budget constraint. We need to select the best set, not just the highest individual ROI items.

