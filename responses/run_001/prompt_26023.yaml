answer: |-
  You have diagnosed the landscape with exceptional clarity. Your frustration is well-founded: after ninety years, the literature feels less like a resolution and more like a series of polite non-overlapping magisteria. Your suspicion is correct—the debate hinges almost entirely on a background commitment regarding the nature of credence (action-guiding vs. truth-tracking)—but I think there is a deeper structural layer beneath that which explains why the debate never resolves.

  Here is my diagnosis of what kind of disagreement this is, where your framing holds up, and where it needs sharpening.

  ### 1. The Fundamental Split: Prudential vs. Epistemic Normativity
  You hit the nail on the head regarding **Camp A vs. Camp C**.
  *   **Camp A (Pragmatists)** treats rationality as **instrumental**. Credences are tools for decision-making. If they lead to guaranteed financial loss, they fail their function. Therefore, probabilism is justified by its utility in avoiding self-defeat.
  *   **Camp C (Epistemic Purists)** treats rationality as **telic** (aimed at a goal). The goal of belief is truth. If a system of credences is accuracy-dominated (i.e., someone else's system would be closer to the truth regardless of how the world turns out), then it fails its constitutive aim. Therefore, probabilism is justified by its truth-conduciveness.

  The deadlock exists because **neither side has successfully convinced the other that their type of normativity is foundational.**
  *   When Camp A points out that losing money doesn't imply false beliefs (you could lose money for a noble cause), Camp C replies: *"Exactly! That proves betting behavior isn't the right metric for epistemic rationality."*
  *   When Camp C points out that choosing a scoring rule seems arbitrary, Camp A replies: *"Exactly! But everyone agrees 'money' is a common currency for preference. At least our arbitrariness is transparent."*

  They aren't just talking past each other; they are arguing over the **Meta-Normative Foundation of Rationality**. One believes the standard for rationality is coherence with preferences; the other believes the standard is fidelity to reality. Until that meta-debate is settled (or accepted as irreducible), no proof of probabilism will convince the opposing camp.

  ### 2. The Structural Flaw: Your Three Camps Map onto Meta-Framing Issues
  Your description of the camps is accurate, but the stalemate arises because they are answering three distinct questions disguised as one.

  1.  **Camp A asks:** "Can violating probability axioms make me practically vulnerable?" (Answer: Yes, via Betting).
  2.  **Camp B asks:** "Does incoherence signal a defect in reasoning independent of the outcome?" (Answer: Only if we accept Representation Theorems, which presuppose some form of rationality).
  3.  **Camp C asks:** "Does violating probability axioms prevent optimal accuracy?" (Answer: Yes, via Scoring Rules).

  The "disagreement" is largely a **category error**. You cannot derive a conclusion about *epistemic* rationality solely from premises about *pragmatic* vulnerability without assuming a premise that links the two (usually that epistemic rationality reduces to practical rationality, or vice versa).

  However, there is a fourth, often implicit position that adds to the confusion: **The Constitutive View**. Some argue that to count as a "credence" is just *to have a probability distribution*. On this view, arguing "why be probabilistic?" is like arguing "why be a bachelor?" If your numbers don't sum to 1, they just aren't credences; they're something else (weights, hopes, propensities). This view dissolves the justification problem entirely by redefining the terms, which often angers Camp A and C who take the data (real agents assigning degrees of belief) as fixed.

  ### 3. Is it Verbal or Substantive?
  It is a **substantive disagreement about the scope of rationality**, obscured by verbal disputes about "justification."
  When Camp A says "incoherent agents are irrational," they mean *prudentially* irrational.
  When Camp C says "incoherent agents are irrational," they mean *doxastically* irrational.
  Since both use the word "rationality" without qualification, the debate looks like a fight over the same target.

  But here is where your suspicion needs a tweak: It is not *just* Action vs. Truth. It is also about **Accessibility**.
  *   **The Internalist Objection:** For a Dutch Book to prove irrationality, the agent must know (or be liable to know) that they are exposed to it. If I am logically omniscient but numerically dyscalculic enough to accept a Dutch book unknowingly, am I irrational?
  *   **The Externalist Reply:** You are objectively vulnerable, so you are vulnerable, full stop.
  *   **The Impact:** This creates a wedge. Camp A often leans Externalist (I'm betting you'd lose money). Camp C often leans Internalist (My mind ought to track truth, even if I'm unaware of the score).

  ### 4. What Counts as Progress?
  Given this diagnosis, **no new theorem will solve it.** Proving the math behind Accuracy Dominance or Dutch Strategies again (as many have done) changes nothing because the math is generally agreed upon; the interpretation of the math is the blocker.

  Progress would look like one of the following:

  **A. A Hybrid Normative Theory**
  We need a framework that shows how Epistemic and Pragmatic norms interact without reducing one to the other. For example, maybe probabilism is a *necessary condition* for truth-tracking, but only sufficient for practical success in conjunction with certain decision theories. Joyce himself hints at this in later work: perhaps the "accuracy dominance" only manifests in practical terms eventually. Moving toward a unified theory of rational agency that respects both truth and value would resolve the stalemate by making Camp A and Camp C allies rather than rivals.

  **B. Admitting a Pluralism of Foundations**
  Progress might look like admitting that Probabilism has *multiple sources of normative pull*.
  *   We believe probabilities are the *right* way to be precise about uncertainty (Camp C).
  *   But if we weren't probabilistic, we wouldn't be able to act without self-sabotage (Camp A).
  Progress would be publishing a paper titled, *"Probabilism Requires Both"* and showing that the vulnerabilities are mutually reinforcing rather than competing justifications.

  **C. Abandoning the Justification Quest**
  This is radical, but some argue it's the only honest move. If credences are simply defined as probability distributions, then the "argument" is a tautology. If they are attitudes of uncertainty, we might have to admit they are *primitive* features of cognition that approximate probability without needing normative proof. The "normativity" might be external pressure (science requires calibration), not internal rationality. Shifting the debate from "Why be probabilistic?" to "How do non-probabilistic creatures navigate the world?" could yield empirical psychology data to replace the endless armchair philosophy.

  ### 5. Conclusion: Advice for Your Reading Group
  If I were in that room with you, I would propose moving the conversation away from "Who has the better argument?" to **"What is the 'ought' attached to the 'probabilities'?"**

  Specifically, ask the group:
  1.  **Do we care about the Dutch Book result because it hurts us (money), or because it means we don't understand the world (truth)?**
  2.  **If an agent is incoherent but incredibly lucky (never gets booked) and highly accurate (hits the truth often), are they rational?**
      *   If you say yes: You prioritize Accuracy/Truth (Camp C).
      *   If you say no: You prioritize Coherence/Consistency (Camp A/B).
  3.  **Are we trying to justify the mathematics of probability, or the mental state of believing in degrees?**

  Your intuition is structurally sound. The debate hasn't moved because the participants are fighting a war on two fronts (Practical vs. Epistemic) while pretending they are sharing a battlefield. The solution isn't a sharper distinction within one front; it's acknowledging that the battle lines define the terrain. The most productive path forward is likely **integrative**: accepting that probabilism sits at the intersection of truth-seeking and action-seeking, and that its normative force derives from that dual anchor, however messy that makes the philosophy of probability.
