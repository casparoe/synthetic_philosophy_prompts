  So at work two of our engineers got into this intense argument about our robot's planning system, and I had to sit there pretending to follow while they went back and forth. I'm hoping you can break it down for me.

  We're building a home robot that needs to do things like load the dishwasher, clear tables, put away groceries. The issue is about how the robot's planner knows what stays the same after it does something. Like, if the robot puts a mug in the dishwasher, it needs to know the mug is now in the dishwasher — but it also needs to know that putting the mug there didn't change the color of the walls, or the location of the couch, or the fact that the cat is still asleep upstairs, or that the front door is still locked. Obviously a human doesn't think about all that stuff, but a planner has to represent it somehow or it ends up in this weird state where it doesn't know whether anything is still true.

  Here's roughly how the argument went:

  (1) Dan said we need to write explicit "frame axioms" for every action — basically, for each action, list everything it doesn't change. So for put_in_dishwasher(mug), you'd have axioms like "the color of the walls is unchanged," "the location of the couch is unchanged," and so on. He said without those, the planner's world model is basically useless because it can't infer that anything persists from one timestep to the next.

  (2) Maya said that's completely insane. She said for a real house with thousands of objects and properties and relations, you'd need millions of frame axioms, and you'd still miss things. She said the whole point of the frame problem — she called it "the frame problem," said it's a famous thing in AI going back decades — is that you can't solve it by enumerating non-changes. She wants to use a default logic where the system automatically assumes things stay the same unless an action explicitly flips them.

  (3) Dan shot back that default logic has its own well-known problems: defaults can conflict, and when they do you need some kind of priority or resolution mechanism, which is its own nightmare. He said at least with explicit axioms you know exactly what your system knows and doesn't know, and you can audit it.

  (4) Maya said that's exactly the mindset that led to people thinking the frame problem was unsolvable for years. She said the whole lesson of the literature is that you need a system that treats persistence as the default and only tracks changes — that's basically how humans do it, and that's what the solution to the frame problem looks like in practice. She said the "default persists" approach is what every serious planning system uses now.

  (5) Dan said humans don't actually assume everything persists by default — we just don't represent most things at all. He said Maya's "default persistence" approach still forces the system to represent and then silently ignore a vast number of facts, and that's computationally wasteful. He said the real solution is to only represent what's relevant to the task, and frame axioms are just one way of encoding relevance judgments.

  (6) Maya said that's totally question-begging because "relevance" is the whole hard part of the frame problem — how does the system figure out what's relevant without already having solved the problem? She said Dan was just pushing the mystery one level up.

  At that point they noticed I was staring into space and they changed the subject, but I'm genuinely curious: who's right here? Can you go through their exchange move by move and tell me who has the better argument at each step, and what the actual state of thinking on this problem is?

  Please structure your response like this:

  - **The gist** (~100 words): summarize what the frame problem is and what the core disagreement between Dan and Maya comes down to.
  - **Move-by-move breakdown** (~600 words): go through each of the six moves and rate it from clearly wrong to clearly right, with a brief justification for each rating. Where someone makes a point that's been addressed in the literature, say so.
  - **Overall verdict** (~150 words): who is more right overall, and what — if anything — are both of them missing?
