  **Best Man Toast Draft**

  Good evening, everyone.

  For those of you who haven’t figured it out yet, I’m the older brother. Which means my primary job description has been managing [Groom’s Name]’s chaos since birth. But today, watching him here, standing next to [Bride’s Name], I realize that for once in his life, he is the calm one.

  And honestly? That’s mostly thanks to her.

  Now, I know there’s a bit of a… let’s call it a dynamic… in this room tonight. On one side, you have people who look at [Bride’s Name] and see a force of nature. Someone whose moral compass points True North so intensely you wonder if she glows in the dark. On our side—the family side—we’re just… grateful. And occasionally, slightly intimidated.

  I remember when [Groom] first introduced us. We had all these questions. Is she intimidating? Is the house full of pamphlets? Do I have to sign a petition before dessert?

  But what I’ve learned is that while the world sees her as a Saint—with a capital S—[Groom] sees her as [Name]. And there is a very important difference.

  There is a philosophical idea I read once, which I’m going to paraphrase because I don’t have the book memorized: "A saint is wonderful to worship, but difficult to live with."

  I don’t say that to diminish her. Far from it. [Bride’s Name] does things most of us only talk about doing when we’re drunk on New Year's Eve. She runs that clinic. She gives away her money. She carries the weight of the world on her shoulders. That is rare. That is beautiful. It deserves applause.

  But marriage isn't built on awe. It’s built on the ability to put the weight down.

  So, the real worry I had as a brother wasn't whether [Groom] could keep up with her brilliance. It was whether he could give her a place to rest. Because the hardest part of being a "good person" is that you're rarely allowed to be tired. You're rarely allowed to be selfish. You're rarely allowed to just… be bad at things.

  And that’s where [Groom] comes in.

  He’s the guy who taught me to change a tire, but also the guy who taught me to order pizza on a Tuesday night instead of cooking a meal to save money. He is the living proof that you can admire someone's principles and still invite them to do something irresponsible and unproductive together.

  [Bride’s Name], my family wants to thank you. Not for your charity—that will happen naturally, without us needing to speak—but for letting him in. For showing him that you're allowed to be quiet. That you're allowed to eat the second slice of cake. That you don't always have to be the person fixing the crisis in the corner of the room.

  And [Groom]? My friend, I am looking at you now, and I see something different. I used to think your job was to protect yourself from the messiness of the world. Now, I see your job is to create a sanctuary inside the mess.

  It takes courage to stand beside a lighthouse. Because you get used to the blinding light, and you forget what it feels like to watch a sunset that serves no purpose other than to be pretty. But that is what I wish for you both.

  May you build a life where the work gets done. Where the causes matter. But may you also build a home where the coat gets taken off immediately. May you find permission to be ordinary. In a world that demands heroes, I want you two to find the luxury of being just... you.

  So, if we could all raise a glass.

  To the bride, whose conscience is clear. To the groom, whose heart is steady. And to the love between them—which is the only thing that proves we don't have to be perfect to be worthy of happiness.

  To the newlyweds!
