prompt: |-
  I'm the best man at my brother's wedding. His new wife is, genuinely, a moral saint — she runs a legal clinic for asylum seekers, gives away more of her salary than most people spend on rent, and has a conscience with no off switch. The room is split: her people think she's a living saint, and our side of the family is already exhausted and a little defensive around her. I need a five-minute toast that's warm and funny, doesn't sell either side out, and doesn't become a lecture. I want it built around the real philosophical worry that a person can be morally excellent in a way that is also, in some respects, not a fully attractive human life — that maximal moral goodness might cost something important. That tension should structure what I can and can't say, and the toast has to end with the couple, not with the philosophy.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Role:** Best Man (brother of the groom).
      *   **Context:** Brother's wedding.
      *   **Key Character:** The Bride is described as a "moral saint" (runs legal clinic for asylum seekers, gives away most salary, high conscience).
      *   **Audience Dynamic:** Split room. Her side sees her as a saint; family side feels exhausted/defensive around her intensity/morality.
      *   **Constraint 1 (Time):** ~5 minutes (roughly 600-750 words spoken at a normal pace).
      *   **Constraint 2 (Tone):** Warm, funny, not lecturing, doesn't sell either side out.
      *   **Constraint 3 (Core Theme):** The philosophical tension that maximal moral goodness might come at the cost of a fully "attractive human life" (i.e., being perfect can be exhausting or lacking in self-indulgence).
      *   **Constraint 4 (Ending):** Must end on the couple and love, not the philosophy.

  2.  **Deconstruct the Core Tension:**
      *   *The Risk:* Praising her too hard validates the family's fear ("She's impossible to keep up with"). Prying into her "flaws" validates her side's view ("You're judging her").
      *   *The Sweet Spot:* Acknowledge her excellence without worshipping it. Admit that perfection is hard to live with without calling it a burden. Frame the brother's role not as "fixing her" but as "grounding her."
      *   *Philosophical Angle:* Reference the idea (without name-dropping too many philosophers) that a saint is great to *admire*, but a partner needs someone you can just *be* with. The "cost" of goodness isn't a critique of her character, but an acknowledgment of human need.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Standard best man pleasantries. Establish rapport with both sides. Acknowledge the bride's reputation immediately but gently.
          *   *Idea:* Joke about the difficulty of writing this speech because everyone knows who she is.
          *   *Tone check:* Keep it light. Don't call her "the Saint." Call her something affectionate.

      *   **The Groom:** Introduce the brother. He needs to look like he fits this world. If she's all give, maybe he's the receiver? No, that creates imbalance. Maybe he's the one who teaches her how to receive. Or simply, they balance each other.
          *   *Idea:* Contrast their backgrounds lightly. She saves lives; he makes people laugh. (Avoid diminishing him).
          *   *Focus:* He loves her *despite* (or perhaps *because of*) the challenge, but specifically, he loves her humanity.

      *   **The Philosophical Pivot (The Tricky Part):**
          *   Need to address the "exhaustion" without blaming her.
          *   Metaphor time: A lighthouse vs. a porch light? A fortress vs. a home?
          *   Let's use the idea of "The Weight of the World." It's noble to carry it. But sometimes you want to put it down and eat cake.
          *   *Key message:* You can't date a hero constantly. You have to be allowed to be messy. Marriage is where you put down the cape.

      *   **Reconciling the Sides:**
          *   To her friends/family: You've seen her mission.
          *   To our family: We see her heart.
          *   The bridge: We are witnessing her relax.
          *   Humor: Make fun of the "saintliness" slightly—like she checks if we're recycling, but then admits she likes junk food too. No, better not imply she judges us. Better to joke about *our* reaction to her. "We were worried about keeping up."

      *   **The Ending:** Bring it back to the couple. Love allows for imperfection. A blessing for their private life.

  4.  **Drafting - Writing & Refining (Self-Correction during the process):**
      *   *Critique:* Is the "moral good" part too heavy?
      *   *Fix:* Use lighter language. Instead of "moral excellence," talk about "carrying extra responsibility." Instead of "not attractive human life," talk about "needing a couch to collapse on."
      *   *Critique:* Am I sounding cynical about her charity work?
      *   *Fix:* Explicitly state admiration. "I hope you never stop." Then pivot to "But today..."
      *   *Critique:* Is the brother getting lost?
      *   *Fix:* Ensure the groom is presented as the person who makes her feel safe enough to be imperfect.

  5.  **Polishing the Flow (Mental Run-through):**
      *   Start: Thanks, welcome.
      *   Middle 1: The Bride's greatness (acknowledge the awe).
      *   Middle 2: The reality of marriage (the need to take off the armor).
      *   Middle 3: The Groom's contribution (he provides the space).
      *   End: Toast to the happy medium.

  6.  **Final Review against Constraints:**
      *   5 mins? Looks about right (approx. 700 words).
      *   Warm/Funny? Yes, aiming for gentle wit.
      *   Philosophy included but subordinated to emotion? Yes, the "weight of the world" metaphor handles this.
      *   Ends on the couple? Yes.

  7.  **Final Polish:** Check for any phrases that might sound condescending to the bride (e.g., "poor thing" implications). Ensure it sounds like *love*, not pity. The core insight should be: *Love is the permission to rest.*

  *(Self-Correction Note during drafting)*: I need to make sure I don't accidentally imply the family thinks she's *too good*. I should frame the family's exhaustion as feeling unworthy, rather than finding her annoying. It's more graceful.

  Let's write it.
