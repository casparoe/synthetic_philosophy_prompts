answer: |-
  First off, take a deep breath—this is one of the most confusing concepts in philosophy, so getting stuck on it means you're actually engaging deeply with the material. Your intuition is shared by a lot of people (and even philosophers!) before they really dive into Strawson’s specifics.

  To answer your main question directly: **Your friend is right.** You are partially misunderstanding Strawson. His argument is *not* just a determinist argument in disguise. In fact, his "Basic Argument" is designed to destroy the case for free will **whether the universe is deterministic OR indeterministic.**

  Here is a breakdown of what is going on, why randomness doesn't save free will, and where your intuition is tripping you up.

  ### 1. What is the "Basic Argument"?
  Strawson's goal isn't just to prove we are determined; he wants to prove **Ultimate Moral Responsibility (UMR)** is impossible.

  His logic runs like this:
  1.  To be truly responsible for an action, you must be responsible for the **way you are** (your character, your values, your desires) at least partly. (If you snapped because you were raised in an abusive home, you aren't responsible for the snap in the ultimate sense).
  2.  To be responsible for the way you are, you would have to have **chosen** to be the way you are (i.e., you would have had to design your own mind).
  3.  But to choose how to shape your mind, you would need a pre-existing mind to make that choice.
  4.  If you use your pre-existing mind to shape your mind, you haven't actually chosen your starting point. You are using the traits you already have.
  5.  Therefore, you can never be the ultimate source of your own character.

  ### 2. Where Your Intuition Goes Wrong (The Indeterminism Trap)
  You wrote: *"if the universe turns out to be indeterministic... then we DO have free will and we're responsible for our choices."*

  This is the standard **Libertarian Free Will** position. The idea is: "If my brain has a little bit of quantum randomness, then my actions aren't fully chained by the past. So, when I choose, *I* am the cause, not physics."

  Strawson argues this is wrong because of **Control**.

  *   **Scenario A (Determinism):** You steal a cookie because your character + past causes led you to it. You didn't choose your character. **No Responsibility.**
  *   **Scenario B (Indeterminism/Randomness):** You steal a cookie. There is no causal chain. It's just a random flicker in your neurons. Did *you* do it? Or did "chance" do it?

  Strawson’s punchline here is: **Randomness is not Freedom.**

  If an action is undetermined, it happens randomly. If something happens randomly in your head, **you are not in control of it.** Being "responsible" implies *authorship*. If the decision was a roll of the cosmic dice, you didn't author it; chance did. You become a passive spectator to your own random neural firing.

  So, for Strawson:
  *   **Determinism** makes you a puppet of the past.
  *   **Indeterminism** makes you a puppet of luck.

  Neither allows for *ultimate* responsibility.

  ### 3. Why Your Friend is Right
  Your friend is correct that Strawson's argument applies to the indeterminist too.

  In philosophy, this position is often called **Hard Incompatibilism**.
  *   **Compatibilists** say: "Free will is compatible with determinism." (Strawson rejects this).
  *   **Libertarians** say: "We need indeterminism for free will." (Strawson rejects this).
  *   **Hard Incompatibilists (like Strawson)** say: "Whether the universe is hard-nosed physics or chaotic randomness, neither setup allows you to be the ultimate originator of yourself."

  Strawson argues that Libertarians are trying to hide the problem behind a magic trick. They say, "Okay, maybe you didn't choose your genes, but at the moment of decision, the choice wasn't determined!" Strawson replies: "Great, so the decision popped into existence uncaused. Who chose that?" Nobody.

  ### 4. The Difference Between "Free Will" and "Ultimacy"
  There is a subtle distinction here that might help your class understanding.

  In everyday life, we say "It was her fault" or "He made a free choice." Strawson agrees that we can hold people accountable socially. We call him a "responsible agent" in the legal and social sense.

  But Strawson is asking for something much harder: **"Ultimate Responsibility."**
  He is asking: Do you own your *very self* down to its core? Since you didn't write your DNA, your upbringing, or your early psychological formation, you can't claim full credit/blame for the person doing the choosing. You are operating within parameters you didn't set.

  Even if those parameters include "quantum jumps," you still didn't set them.

  ### Summary for your Class Discussion
  If you want to sound sharp in class, here is the pivot:

  > "Strawson isn't arguing that physics determines us (the determinist view). He is arguing that the structure of 'self-creation' is logically impossible. Even if we add indeterminism, we don't gain ownership over the randomness. Indeterminism adds 'luck,' not 'agency.' Therefore, the Basic Argument defeats the idea of ultimate responsibility under both determinism and indeterminism."

  **Verdict:** Your intuition about determinism vs. free will is standard, but it falls into the trap Strawson explicitly sets to catch Libertarians. Your friend is right that the argument transcends the determinism debate, aiming instead at the concept of "self-causation" itself.
