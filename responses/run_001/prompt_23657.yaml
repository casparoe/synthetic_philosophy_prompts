          5.  Conclude on how to fix it next time.

  5.  **Review against Constraints:**
      *   "Not too harsh": Don't say "This is wrong." Say "This overlooks..."
      *   "Not too lenient": Don't say "Good job." Say "The conclusion is problematic."
      *   "Specific, point-by-point": Use bullet points.
