  # Q&A Preparation Sheet: Williams’s Integrity & Deliberative Structure
  **Talk Title:** Beyond Agent-Relativity: The Alienation of Impartial Validation
  **Date:** [Insert Date] | **Time:** [Insert Time]
  **Goal:** Defend the claim that Williams’s "One Thought Too Many" targets the *formal requirement* of impartial justification, not merely the lack of special permissions.

  ---

  ## Priority Objections (Ranked by Likelihood × Damage)

  ### 1. The "Internalization" Objection (Sophisticated Consequentialist / Railton-devotee)
  *   **Speaker Profile:** Works on sophisticated consequentialism; believes Railton settled this in "Alienation."
  *   **Question Phrasing:** "You’re focusing on the *moment of justification*, but sophisticated consequentialism allows us to *internalize* non-consequentialist motives. I save my wife because I love her, full stop. The fact that this disposition tracks the Good doesn’t mean the act is alienated. Why conflate psychological motivation with the underlying normativity?"
  *   **Likelihood:** 5
  *   **Damage:** 5
  *   **2-Minute Reply Sketch:**
      *   **Acknowledge:** You are correct that a Railtonian agent wouldn't *think* the calculation consciously.
      *   **Pivot:** But if pressed to justify the practice institutionally or morally, they *must* appeal to the impartial system.
      *   **Core Move:** My argument is that the very *authority* of the motive depends on a validity check outside the commitment. Even if unconsciously suppressed, the agent remains the guardian of an impartial system.
      *   **Closing:** As long as the motive is held hostage to the system’s approval, it is structurally second-order. That creates the latent alienation, even if psychologically invisible in the heat of the moment.
  *   **Weakest Link:** Distinguishing between a truly internalized motive and a functional proxy for an impartial rule is notoriously difficult empirically. Am I assuming more skepticism toward the agent's self-knowledge than is warranted?

  ### 2. The "Practical Identity" Objection (Korsgaardian)
  *   **Speaker Profile:** Think Kantian agency is already the solution; sees Williams as missing the mark on 'autonomy.'
  *   **Question Phrasing:** "Kant argues that acting from duty isn't alienation, it's autonomy—acting from your own law rather than blind inclination. Williams treats distance from personal inclination as necessarily bad, but for us, that distance is the condition of *freedom*. Why assume reflection always corrupts integrity?"
  *   **Likelihood:** 4
  *   **Damage:** 4
  *   **2-Minute Reply Sketch:**
      *   **Acknowledge:** Autonomy is distinct from heteronomy; I’m not denying the value of critical reflection generally.
      *   **Pivot:** But Williams’s point isn't about reflection per se, it's about *impartial validation*.
      *   **Core Move:** When George asks "Should I save her based on general moral principles?" he turns his wife into a candidate for preservation among others.
      *   **Closing:** My claim is that the *structure* of the moral demand to justify particular bonds universally collapses the specific texture of those bonds. Kant saves universality at the cost of the particularity Williams prizes.
  *   **Weakest Link:** Can I explain why Kantian reflection doesn't constitute a form of integrity, or am I simply stipulating that only pre-reflective attachment counts as 'true' integrity?

  ### 3. The "Category Error" Objection (Virtue Ethicist)
  *   **Speaker Profile:** Thinks the framing of "reasons" vs "motives" is the mistake.
  *   **Question Phrasing:** "Why are you fighting consequentialism and Kantians on their turf? If the 'structure of deliberation' is wrong, it's because you're asking a virtuous person to deliberate like a philosopher. A friend doesn't need a justifying reason to save their partner; the virtue disposes the action. This entire debate assumes agents are reasoners first."
  *   **Likelihood:** 3
  *   **Damage:** 5
  *   **2-Minute Reply Sketch:**
      *   **Acknowledge:** I agree a virtuous agent wouldn't deliberate this way naturally.
      *   **Pivot:** But the workshop context is defending Williams *against* systematic theories (Util/Kant) that try to absorb such actions.
      *   **Core Move:** Williams is diagnosing what goes wrong when these systems try to encompass human life. It’s a critique of *theories*, not necessarily a guide for daily life.
      *   **Closing:** I am arguing that as long as the theoretical framework demands impartial validation, it is hostile to integrity. VE might escape it, but C and K cannot without losing themselves.
  *   **Weakest Link:** Risks sounding like I'm retreating into meta-theory rather than solving the substantive problem of how to live well under modern ethical frameworks.

  ### 4. The "Procedural Fix" Objection (Rule Consequentialist)
  *   **Speaker Profile:** Believes rules solve calculation problems at the moment of action.
  *   **Question Phrasing:** "Hare's two-level view lets us bypass this. At the intuitive level, we save our wife. We only go up to the critic level when the rules conflict. If the rule 'save loved ones' is optimized, there's no thought too many."
  *   **Likelihood:** 2
  *   **Damage:** 3
  *   **2-Minute Reply Sketch:**
      *   **Acknowledge:** Intuitive level rules reduce cognitive load significantly.
      *   **Pivot:** But the authority of the rule comes from the optimizing level.
      *   **Core Move:** If George questions the rule, he must step down to the calculator. The 'one thought' appears whenever the stability of the intuition is threatened.
      *   **Closing:** Your fix is temporary stability. It doesn't heal the wound in the architecture; it just bandages it until a genuine dilemma arises.
  *   **Weakest Link:** If the 'critical' level is never engaged, does the agent actually care about it enough to count as alienation?

  ### 5. The "Rational Check" Objection (Act Utilitarian)
  *   **Speaker Profile:** Unsympathetic to sentimentality; values consistency above all.
  *   **Question Phrasing:** "Why is needing a reason bad? If I save her and it causes catastrophe elsewhere, surely I was irrational. Checking the numbers ensures I'm doing the right thing, not just the loving thing."
  *   **Likelihood:** 1
  *   **Damage:** 2
  *   **2-Minute Reply Sketch:**
      *   **Acknowledge:** Rationality matters.
      *   **Pivot:** But Williams distinguishes between sanity and moral rationality.
      *   **Core Move:** Demanding that love justify itself impersonally treats love as an instrumental tool for outcomes rather than a constitutive part of the self.
      *   **Closing:** You're prioritizing the *outcome* over the *person*. Williams is saying some commitments resist that trade-off.
  *   **Weakest Link:** Very vulnerable to the accusation of promoting arbitrariness. Hard to define the boundary where "love" becomes "bad faith."

  ---

  ## The Dreaded Question
  **"If the requirement for impartial validation alienates us from our projects, doesn't Williams's view effectively collapse into a kind of moral schizophrenia or nihilism? If I can't justify my deepest commitments without betraying them, aren't you left with only raw preference disguised as 'integrity'? How do you prevent this from just shielding prejudice?"**

  *   **Why it's dreaded:** It cuts the legitimacy of the 'personal' off from the 'normative' entirely. If integrity is purely private, it loses political and ethical traction. It suggests your defense makes Williams a relativist who can't account for wrongdoing in intimate relationships.
  *   **Prepared Defense Strategy:** Focus on the *social nature* of integrity, not just the subjective feeling. Integrity requires a community to recognize the commitment, not an abstract impartial tribunal. Prejudice fails this social test (it relies on exclusion), whereas spousal love creates recognition.
  *   **Risk:** Admitting that Williams leaves little room for critiquing deeply held personal beliefs is unavoidable.

