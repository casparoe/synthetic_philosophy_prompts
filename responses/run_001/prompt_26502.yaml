      *   *Objection 1: The Sophisticated Consequentialist (Railton).* They will argue internalization works. The speaker must insist on the *normative* structure remaining external even if psychology adapts.
      *   *Objection 2: The Korsgaardian.* She claims Kant avoids alienation through practical identity. Need to distinguish between "identification" and "alienation via impartial validation."
      *   *Objection 3: The Virtue Ethicist.* She thinks the "structure of deliberation" framing is itself the problem. Need to defend the framing as necessary to diagnose modern moral theory, even if VE offers an exit.
      *   *Objection 4: The Act Utilitarian.* Basic misunderstanding. "Isn't checking the math just rational?" Reply: Not when the math kills the motive.
      *   *The Dreaded Question:* Is Williams's view essentially nihilistic? If all justification alienates, how do we navigate public policy? Or: Doesn't integrity sometimes require the 'one thought'? (e.g., saving a killer because he's family).
      *   *Selection:* Let's pick the question about whether "integrity" becomes a shield for prejudice/misguided personal projects. That hits the normative force hard.

