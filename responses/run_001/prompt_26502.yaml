      *   *Target:* This attacks Railton's "sophisticated consequentialism" (where we internalize non-consequentialist motives but ultimately serve consequentialist ends) and Hare's two-level view. It also challenges Kantian universalizability if it requires distance from inclination.

  3.  **Anticipate Audience Objections (Brainstorming):**
      *   *Sophisticated Consequentialist (Railton):* "You're conflating the psychological reality with the normative foundation. You can be psychologically partial without being normatively relativistic." -> *Likely/High Damage.*
      *   *Kantian (Korsgaard):* "Williams is right about alienation but wrong about the source. Kant already solves this: autonomy isn't detachment, it's identifying with your law. The distance is between impulse and self-legislation, not person and world." -> *Very Likely/Medium-High Damage.*
      *   *Act Utilitarian:* "Why shouldn't I step back? If I don't validate my act, how do I know I'm doing good?" -> *Medium Likelihood/Low Damage.*
      *   *Rule Consequentialist:* "Internalization of rules solves the calculation problem. The 'thought' isn't needed at the moment of action." -> *Medium Likelihood/Medium Damage.*
      *   *Virtue Ethicist:* "You're still operating within the deontological/consequentialist framework. Virtue ethics doesn't need justification; it needs character. This whole debate is category error." -> *High Likelihood/High Damage (shifts paradigm).*
      *   *The Agnostic Questioner:* "Doesn't this make morality private/incommunicable?" -> *Medium Likelihood/Unknown.*
      *   *Dreaded Question:* Something that exposes the gap between "integrity" and "moral insanity" or something that forces a retreat to subjectivism.

