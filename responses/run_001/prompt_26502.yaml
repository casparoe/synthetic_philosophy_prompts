      Also, the JSON requirements are strict. I need to make sure the text matches exactly.

  5.  **Refining the Replies (2-minute limit means ~250-300 spoken words max, concise points):**
      *   Keep them punchy. Acknowledge the strength of the objection, pivot to the structural claim.
      *   Ensure "Weakest Link" is honest (PhD students hate fake confidence).

  6.  **Addressing the JSON Constraints:**
      *   Keys: `dreadedQuestion`, `objections`.
