answer: |-
  **Section 1: The implicit theory**
  This practice presupposes a robust principle of procreative beneficence: prospective parents have an obligation to select the child expected to possess the best prospects among available options. It operates on a quantitative, aggregative conception of well-being where genetic liability correlates directly with life outcomes. By prioritizing lower risk for conditions like schizophrenia or lower variance in educational attainment, it implicitly defines a "better life" as one minimizing burden and maximizing capacity. Consequently, it views these conditions primarily as liabilities rather than identities or social differences. This commits the practice to a comparative judgment that a life with such conditions is "worse" than one without them. This creates significant tension with the existence of living individuals with these conditions; if their genetic makeup predicts a worse life, the selection logic implies their current flourishing is contingent luck rather than inherent worth. While proponents argue they select for *more* health rather than against *people*, the underlying architecture necessitates that the absence of these traits is preferable. This potentially undermines the social claim that existing disabled lives are equal in moral status to non-disabled ones, framing disability largely through a medical/tragic lens rather than affirming the value of neurodiversity or physical variation.

  **Section 2: Strictly presupposed vs. merely compatible**
  Strictly speaking, the practice requires only two minimal commitments: that polygenic scores track morally relevant probabilities, and that parents possess the right to weight those probabilities. It does not necessitate full welfarism; a perfectionist could endorse selecting for cognitive potential even if it risks subjective well-being. Nor does it require state endorsement; libertarian frameworks suffice to legitimize the transaction. However, the practice cannot function if the scores are viewed as arbitrary or morally neutral markers. It presupposes a link between genetic aggregation and human flourishing sufficiently strong to justify exclusion from reproduction. Without this epistemic-moral bridge, selection becomes gambling, not optimization. Furthermore, the practice presupposes that "risk reduction" is distinct from "cure"—it treats future statistical liability as present actionable data. It remains compatible with various ethical theories (utilitarian, rights-based, virtue ethics) provided they grant parents discretion over reproductive choices. Thus, its core necessity is not a specific theory of value, but the validity of the predictive technology coupled with parental prerogative. If either collapses—the accuracy of the score or the right to choose—the practice loses its normative force and becomes merely technical trivia.

  **Section 3: The eugenics question**
  The practice presupposes that the distinction between private choice and state coercion is morally decisive. It assumes the evils of historical eugenics lay principally in violations of autonomy and state enforcement, rather than in the underlying valuation of certain biologies. By adopting a "liberal eugenics" frame, it suggests that aggregating parental preferences avoids systemic injustice. However, this framing fails to insulate the practice from objections regarding expressive harm. Even without state power, the collective market selection against traits like schizophrenia signals a societal consensus that such lives are less worth living. The practice implicitly rejects the idea that the history of eugenics warned us specifically about *selection itself*. Instead, it interprets the warning as solely about *who decides*. This commits the practice to the belief that individualized selection does not aggregate into a new form of biological caste system, assuming that privacy protects diversity from being eroded by convergent parental desires for the same statistically optimal traits.

  **Section 4: Underdetermination**
  The practice is philosophically underdetermined because it can be justified by divergent frameworks without internal contradiction. A libertarian view sees it purely as property rights over embryos; a beneficence view sees it as a duty to avoid preventable suffering; a perfectionist view sees it as cultivating human excellence. The service does not settle whether using the tool is optional or obligatory. Does failing to screen constitute negligence, or merely exercising liberty? Furthermore, it leaves unresolved what counts as a "threshold" condition. Is preventing type 2 diabetes comparable to preventing deafness? The industry takes no stand on why some traits (schizophrenia) are selectable while others (height, IQ) remain controversial or marketed differently. It allows parents to operate under conflicting rationales simultaneously—one parent seeking to minimize misery, another maximizing status—under a single technological umbrella. Consequently, the practice obscures deep disagreements about the purpose of reproduction: is it to bring about a good life, or simply to allow children whose lives are merely "open"? It functions regardless of the answer.

  **Section 5: What would change under a rival view**
  Adopting an expressivist or disability-critique view would fundamentally alter the practice’s permissibility and presentation. If selection expresses that certain lives are less worth living, the practice likely could not continue in its current commercial form. Providers would be forced to cease offering selection for non-lethal conditions like diabetes or psychiatric risks, as these reinforce stigma against existing populations. At minimum, marketing would have to shift from "optimization" to "prevention of severe catastrophe," framing the service strictly around immediate life-limiting threats. The language of "best odds" or "flourishing" based on genetic probability would become ethically impermissible rhetoric. Instead, services might focus exclusively on ensuring a child does not have a condition that precludes survival. The very concept of ranking embryos would be rejected as discriminatory. In a world governed by this view, the technology might exist for diagnosis, but the act of discarding viable embryos based on probabilistic disadvantage would be viewed as an ethical failure requiring regulatory prohibition, effectively banning the "polygenic" aspect entirely.
