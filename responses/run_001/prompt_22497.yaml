      *   *Section 2: The Journalistic Standard.* Move from philosophy to profession. Mention "Two Independent Sources" rule (often modified for whistleblowers). Discuss the difference between "Verification" (proving it's true) and "Vetting" (proving the source is trustworthy).
      *   *Section 3: Action Plan.* Concrete steps. Corroborate context, not just the claim. Check the "meta-data" (timeline, regulations, similar cases). Legal check. Phrasing caution.
      *   *Section 4: The Decision.* Who wins? Neither fully. A hybrid approach is best for high-stakes science reporting. The Colleague is more realistic about human knowledge limits, but the Editor is right about the stakes. The solution lies in the *degree of confidence*, not binary truth.

