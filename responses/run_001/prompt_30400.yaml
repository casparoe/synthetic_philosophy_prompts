      *   *Decision-Theoretic Costs:* Money Pumps. If I'm intransitive, I lose money. This is an *expediency* argument against having intransitive beliefs/preferences, not necessarily a metaphysical argument that betterness *must* be transitive. But if betterness guides action, intransitivity creates exploitable agents.
