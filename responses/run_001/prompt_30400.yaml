      *   *Preference Reversal / Dynamic Inconsistency:* Strotz, Ainslie. People prefer $C_1$ now, but plan to take $C_2$ later, then reverse when time comes. This violates dynamic consistency, often modeled as time-inconsistent discounting (hyperbolic). Is this "better" or just "preference"? The user asks for realistic cases where a person cycles without being confused. Addiction/akrasia fits here.
