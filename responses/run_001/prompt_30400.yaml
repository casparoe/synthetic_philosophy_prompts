      *   *Better Realistic Case:* **Choice under Ambiguity / Ellsberg Paradox variants.** Though this is risk, not value.
      *   *Actually:* **Consequentialist Conflicts.** Duty-based conflicts often fail transitivity. Promise keeping $\succ$ Truth telling (in case A), Truth telling $\succ$ Helping Neighbor (case B), Helping Neighbor $\succ$ Promise keeping (Case C). If these resolve into "all things considered," does the triad break?
