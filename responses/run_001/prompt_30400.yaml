      *   *Correction:* I must be careful not to confuse *incomparability* (Chang) with *intransitivity*. Incomparability means $A \nsucc B$ and $B \nsucc A$. Intransitivity means $A \succ B, B \succ C, C \succ A$.
      *   *Key Distinction:* The user insists $A \succ B$ implies transitivity. If $A$ is merely "on a par" with $B$, they aren't saying $A \succ B$. So I need arguments where explicit judgments form a cycle.
      *   *Candidate for Cycle:* The "Repugnant Conclusion" sequence. If Total Utilitarianism says Z is better than X (higher total) but X is better than Y (higher quality), and we can construct a chain... wait, U is better than V usually implies transitivity in utilitarianism.
