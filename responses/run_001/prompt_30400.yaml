      *   Key battlegrounds: The Small Improvement Argument (Ruth Chang), Parfit's Repugnant Conclusion/Persona-Affected Theory issues, Larry Temkin's Inequality/Spectrum arguments (revisited carefully), and Money Pump arguments (decision-theoretic cost).
