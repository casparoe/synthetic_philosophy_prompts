answer: |-
  You have landed on the standard orthodox position of rational choice theory and much of contemporary analytic ethics: that for an evaluation to function as a guide to rational action, it must be a weak ordering (reflexive, complete, and transitive). You correctly identify that the usual suspect objections—the Sorites paradox and vague spectra—are often hand-wavy attempts to smuggle in vagueness into a crisp logical relation.

  However, your confidence rests on the assumption that "all-things-considered better than" is a coherent, monolithic relation that *can* map onto a single dimension. If that mapping is impossible, or if the relation itself is constituted by distinct contexts that resist aggregation, transitivity collapses.

  Here is the breakdown of arguments against your position, ranked from the conceptual damage they cause (potentially fatal) to the merely pragmatic annoyances. Following that, I will address the axiom question and the spectrum cases.

  ### Ranked Objections to Transitivity

  #### 1. The Weighting Problem (The "Context-Sensitivity" Argument) — *Potentially Fatal*
  **Argument:** "All-things-considered" implies summing weighted values (health + happiness + wealth). But if the weight of a dimension changes depending on the options available or the history of the comparison, transitivity fails structurally.
  **The Case:** Larry Temkin’s **Inequality Spectra**.
  Imagine three populations:
  *   **Population X:** Everyone has level of life 100. Perfect equality.
  *   **Population Y:** One person has 101, everyone else 100.
  *   **Population Z:** Everyone has level 200 (no inequality, but higher average).

  Intuitively (and according to several plausible egalitarian theories), X is better than Y because X is more equal (Y introduces gratuitous disadvantage). However, consider a different chain where we trade off quantity and equality. If we have a sequence of lives where each step improves welfare but introduces slight inequality, and another sequence where we reduce inequality but sacrifice welfare, we can construct chains where $A$ is better than $B$ (due to equality), $B$ is better than $C$ (due to total welfare), but $C$ is better than $A$ (due to a mix that favors the second dimension more heavily).
  **Why this hurts you:** Temkin argues this isn't just "vagueness"; it is a failure of the **"All-Things-Considered"** concept to generate a stable ranking. If the respect in which "betterness" applies shifts from pair to pair without being reducible to a fixed metric, you cannot maintain transitivity while preserving the intuition that $A$ was really better than $B$.
  **Cost to you:** You must either bite the bullet and say our moral intuitions are systematically misleading, or admit that "betterness" is not a single binary relation but a family of relations relative to a specific context. If it's a family of relations, "A is better than B" becomes incomplete information.

  #### 2. Hyperbolic Discounting / Dynamic Inconsistency — *Serious / Substantive*
  **Argument:** Transitivity is a condition of static rationality. But human agents (and arguably moral agents) are temporally extended. Preferences formed in a "hot state" (craving) vs. a "cold state" (reflection) create cycles that are robust to introspection.
  **The Realistic Case:** **The Smoking Chain.**
  *   At $T_1$: You prefer a Healthy Life ($H$) over Current Smoking ($S$). ($H \succ S$)
  *   At $T_2$ (when craving hits): You prefer Smoking ($S$) over Abstaining ($A$). ($S \succ A$)
  *   At $T_3$: You reflect on the outcome and prefer the result of Abstaining ($A$) to the result of Smoking ($S$). ($A \succ S$)
  If we treat these as evaluations of "what is better for the agent's overall well-being," you have a cycle ($H \succ S$, $S \succ A$, $A \succ H$ implies $A$ is best, but $H$ was better than $S$, etc.).
  **Why this matters:** This is not mere confusion. It reflects a split in the agency (multiple selves). A committed transitivity defender has to say the agent at $T_1$ is correct and the others are "mistaken." But the experience of the conflict is real.
  **Cost to you:** You must adopt a "true self" theory (only the calmest moment counts) which feels alienating to the agent. If you deny that, you must accept that "betterness" varies by temporal perspective, violating transitivity across the timeline.

  #### 3. Social Choice / Condorcet Cycles — *Annoyingly Persistent*
  **Argument:** Even if individual values are transitive, aggregating them into "All-Things-Considered Good" for a collective often produces cycles. Arrow's Impossibility Theorem proves no voting system (function) exists that maps ordered individual preferences to a consistent group ordering without being dictatorial.
  **The Impact:** If "better than" for society is defined by democratic consensus or aggregate utility, transitivity is mathematically impossible in general cases.
  **Cost to you:** You must concede that "all-things-considered better" is a property of individuals only, or that we accept cycles as an unavoidable feature of political life (which undermines the goal of ranking programs).

  #### 4. Money Pumps / Dutch Books — *Pragmatically Awkward*
  **Argument:** This is the decision-theoretic classic. If you believe $A \succ B$, $B \succ C$, and $C \succ A$, someone can offer you swaps:
  *   Pay $0.01$ to swap $A$ for $B$.
  *   Pay $0.01$ to swap $B$ for $C$.
  *   Pay $0.01$ to swap $C$ for $A$.
  You end up back at $A$ but poorer.
  **Cost to you:** For a graduate school ranking spreadsheet, this is low stakes. But philosophically, it reduces "betterness" to mere instrumental coherence. If the world is such that you are forced to pay a premium to be transitive (to avoid being exploited), your transitivity axiom has a high *utility cost*. You survive the "bullet-biting" test here by accepting the cost of being a target for exploitation.

  ---

  ### What Would a Non-Transitive World Look Like?

  If transitivity fails substantively (not just verbally), the universe of values looks less like a map and more like a set of vectors.
  1.  **Vector Values:** Every option is not a coordinate on a line, but a point in multidimensional space where "distance" depends on direction.
  2.  **Local Ordering:** You can only rank things locally (pairwise). You cannot integrate a global score. $A \succ B$ in the context of choosing between $A$ and $B$, but adding $C$ changes the metric such that $C \succ A$ and $B \succ C$.
  3.  **The "Penumbra" Effect:** Instead of a sharp line (Sorites), the boundary of "better" is not vague, but *shifting*.

  This view predicts that in complex choices (like ranking PhD programs involving funding, advisor fit, location, prestige), there is no "correct" answer even given perfect information. Your spreadsheet search implies finding the optimal peak. A non-transitive view implies there is no single mountain, only valleys separated by peaks of different metrics.

  ### How Your View Fails the Spectrum Cases

  You argued that spectrum cases are just Sorites puzzles. This is the crux where your view predicts something the alternative doesn't.

  **Your Prediction:** Because $A \succ B$ is transitive, there must be a precise threshold $N$ where adding $N$ units of a negative trait makes $L_{good} \nsucc L_{bad}$.
  **The Alternative (Non-Transitive/Vague) Prediction:** There is no threshold. As you add the negative trait, the relationship drifts into "parity" or "indeterminacy" before becoming worse.

  **The Hit:** If you encounter a spectrum where every step is clearly an improvement, but the endpoints are clearly reversed (e.g., the **Repugnant Conclusion**), your transitivity demands you accept the conclusion (that a world with billions living barely tolerable lives is better than a small elite). The non-transitive view (specifically those allowing for *incommensurability* or *non-transitive dominance*) allows you to reject the chain's validity at a midpoint where the "diminishing returns" of population outweigh the "additive gains" of welfare, breaking the transitivity required to force the conclusion.

  Most people find the Repugnant Conclusion repulsive precisely because they intuitively feel the "better" relation stops tracking total utility at some point. By insisting on transitivity, you validate the Repugnant Conclusion. If you want to avoid it, you must weaken transitivity.

  ### The Axiom Question: Is This Unfalsifiable?

  **Yes, it is.** And that is a significant philosophical liability.

  By defining "all-things-considered better" as the input required for rational choice, you make transitivity a necessary truth of *rationality*, not an empirical claim about *value*. This is similar to Kant's categories of understanding.
  *   **The Problem:** If someone says, "I prefer A to B, B to C, and C to A," you call them irrational or confused. You do not say, "Oh, the world is intransitive." You assume the error is in their reporting or their calculation.
  *   **Why this is a problem:** It immunizes the theory against empirical evidence. If the world genuinely contains intransitive values, your framework labels them as "errors of judgment" rather than features of reality.
  *   **The Defense:** Proponents argue this is the "price of doing value theory." Without transitivity, you cannot model rational agency. It becomes a normative axiom: "If you want to be rational, act *as if* betterness is transitive," regardless of reality.

  **Verdict:** It is not unfalsifiable in the way physics is, but it is *unassailable* in the way logic is. If your goal is to understand the *structure of value*, you should treat it as falsifiable. If your goal is to describe the requirements of *rational agency*, you can treat it as an axiom. Since you are ranking grad schools (an exercise in agency), you are justified in using the axiom. But if you claim the world *is* transitive, you are making a bold metaphysical claim that is hard to defend against the Temkin/Chang literature.

  ### Recommendation

  Don't abandon transitivity entirely if you are building a spreadsheet; without it, you cannot use an algorithm to optimize. But you should concede that your "Better Than" column is an **approximation** derived from collapsing multiple dimensions into one.

  To stay intellectually honest:
  1.  **Acknowledge Context Sensitivity:** Admit that "Advisor Fit" might trump "Salary" in one pairing, but "Salary" might trump "Fit" in another if the gap is large enough.
  2.  **Accept Incommensurability:** For items where you genuinely cannot decide (the "penumbra"), mark them as "$\approx$" (roughly equal/incomparable) rather than forcing a transitive link.
  3.  **Watch for the Repugnant Conclusion:** If your rankings lead to absurdities (ranking a program with no funding but high prestige vastly above a mediocre but well-funded one solely due to "prestige weight"), re-evaluate the weights.

  **Final Answer to "What counts against me?":**
  It is not the logic puzzles. It is the fact that **human valuation is multidimensional and context-dependent.** Any attempt to force a unidimensional scale onto a multidimensional reality will eventually produce a cycle or a repugnant conclusion. You are free to enforce transitivity for the sake of decision-making, but you should concede that in doing so, you are smoothing over rough edges of value rather than revealing a fundamental truth about goodness. The cost of transitivity is the loss of fidelity to the complexity of the goods themselves.
