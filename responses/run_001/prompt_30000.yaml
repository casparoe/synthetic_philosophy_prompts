  6.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the connection. Bentham asks "does this harm?" The film shows "yes and no."
      *   **Side A: Vindicating Bentham (The External Harm).** Focus on the state of nature vs. society. The relationship itself brings joy (on Brokeback). The pain is extrinsic.
