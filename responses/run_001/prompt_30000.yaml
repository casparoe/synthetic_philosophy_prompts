prompt: |-
  I watched Brokeback Mountain again last week and I keep thinking about it next to Bentham's private notes on sexual morality — the ones where he argues the law should stay out of consensual sex between adults, that the only real question is wether the conduct actually harms anyone and whether punishing it does more harm than it prevents, and that a lot of what gets called sexual morality is just disgust in a legal costume. I want a reading of the film through that lens. Does the movie basically vindicate Bentham: Ennis and Jack's suffering comes from the closet, the threat of exposure, and the violence Ennis was taught to fear as a kid (the murdered rancher his father showed him), not from the relationship itself? Or does it complicate the picture in ways Bentham's notes don't fully anticipate: Alma and Lureen and the kids get genuinly hurt by the secrecy and the lies, and Ennis and Jack themselves are hardly at peace even with each other? Which scenes would you point to for each side, and what does the film add to the utilitarian argument that the notes alone can't deliver? I don't need quotes or citations, just a reading that's fair to both Bentham and the movie.
reasoning: |-
