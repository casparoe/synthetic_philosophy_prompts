answer: |-
  You have identified the crux of the issue correctly: if you look only at **pure strategies** (i.e., "Is Row A better than Row B?"), you hit a dead end. Your intuition is sound—no single row beats Row B across all columns.

  However, in intermediate decision theory, the definition of a "rational strategy" includes **mixed strategies**. A rational player will never play a strategy that is dominated by a *probability-weighted combination* (a lottery) of other available strategies.

  The reason you are stuck keeping B, and why your attempt to cross out Column 2 felt messy, is because neither B nor Column 2 is dominated by a *pure* strategy. They are dominated by *mixed* strategies.

  Here is the step-by-step reduction that leads to the $2 \times 2$ result.

  ### The Hidden Move: Mixed Strategy Dominance

  Let's look at the Row Player's payoffs (first number in each cell):
  *   **Row A:** $[5, 5, 2]$
  *   **Row B:** $[3, 4, 3]$
  *   **Row C:** $[2, 5, 5]$

  You noted that Row B is hard to beat. It does well against Columns 1 and 3. However, notice that Row B's payoffs ($3, 4, 3$) look suspiciously like an "average" of the highs offered by Row A and Row C.

  Let's try combining Row A and Row C. Specifically, suppose the Row Player plays Row A 50% of the time and Row C 50% of the time. Let's calculate the expected payoff of this mix against each of the Column Player's strategies:

  1.  **Against Column 1:**
      *   Mix Payoff: $0.5(5) + 0.5(2) = 2.5 + 1 = 3.5$
      *   Row B Payoff: $3$
      *   Result: $3.5 > 3$. **(Mix wins)**

  2.  **Against Column 2:**
      *   Mix Payoff: $0.5(5) + 0.5(5) = 5$
      *   Row B Payoff: $4$
      *   Result: $5 > 4$. **(Mix wins)**

  3.  **Against Column 3:**
      *   Mix Payoff: $0.5(2) + 0.5(5) = 1 + 2.5 = 3.5$
      *   Row B Payoff: $3$
      *   Result: $3.5 > 3$. **(Mix wins)**

  **Conclusion:** Even though no *single* pure strategy beats Row B, a 50/50 mixture of A and C beats Row B in *every* possible scenario. Therefore, Row B is a strictly dominated strategy (by a mixed strategy) and is irrational to play.

  **Action:** Cross out **Row B**.

  ---

  ### Step 2: Re-evaluating the Game
  Now we reduce the game to the remaining rows (A and C) and all three columns. The game board effectively shrinks to:

  | | Col 1 | Col 2 | Col 3 |
  | :--- | :---: | :---: | :---: |
  | **Row A** | (5, 1) | (5, 0) | (2, 2) |
  | **Row C** | (2, 2) | (5, 1) | (5, 0) |

  Now we must evaluate the **Column Player's** payoffs (the second number). Remember, the Column Player wants to *maximize* their own number. We are looking for a column strategy that is worse than another column strategy.

  Compare **Column 1** vs **Column 2**:
  *   **If Row A is played:** Col 1 gives 1, Col 2 gives 0. (Col 1 is better)
  *   **If Row C is played:** Col 1 gives 2, Col 2 gives 1. (Col 1 is better)

  With Row B removed, Column 1 strictly dominates Column 2. The tie that existed when Row B was present (where Col 1 gave 0 and Col 2 gave 0) has disappeared.

  **Action:** Cross out **Column 2**.

  ---

  ### Step 3: The Final Reduction
  We are left with Rows A and C, and Columns 1 and 3. The resulting matrix is:

  | | Col 1 | Col 3 |
  | :--- | :---: | :---: |
  | **Row A** | (5, 1) | (2, 2) |
  | **Row C** | (2, 2) | (5, 0) |

  Does anything else dominate?
  *   **Row Player:** A prefers Col 1 ($5>2$); C prefers Col 3 ($5>2$). No dominance.
  *   **Column Player:** Col 1 prefers A ($1<2$? No wait, C gets 1 vs 0, so C prefers Col 1... let me check payoffs again).
      *   Looking at Column 1: Row A gets 1, Row C gets 2.
      *   Looking at Column 3: Row A gets 2, Row C gets 0.
      *   There is no strategy here that strictly beats the other in a way that eliminates a row/column.

  This leaves us with the **$2 \times 2$ game** described in your answer key.

  ---

  ### Why your instincts were leading you astray

  **1. Why keeping B went wrong:**
  Your instinct was to look for a *pure strategy* dominance ("Is there a row $X$ such that $X > B$ always?").
  In introductory classes, problems are often designed so that pure dominance exists. However, in an *intermediate* class, "Rationality" implies maximizing expected utility. If you are indifferent between playing A and C, or if you suspect the opponent might pick either, calculating the "best response" often reveals that a mix of A and C secures a higher guaranteed payoff than playing B. B is a "mediocre compromise" strategy, whereas A and C are specialized "high-risk/high-reward" (in opposite directions) strategies. The math shows that the "average" of A and C beats B every time.

  **2. Why crossing out Column 2 first was difficult:**
  You mentioned trying to cross out Column 2 first. This is actually a valid move, but it requires **more complex math** to justify initially.
  With Row B in the game:
  *   Column 1 Payoffs: $(1, 0, 2)$
  *   Column 2 Payoffs: $(0, 0, 1)$

  Column 1 does **not** strictly dominate Column 2 yet (because of the tie at Row B where both get 0). To eliminate Column 2 first, you would have had to prove that a *mixture* of Col 1 and Col 3 dominated Col 2. While true, finding that specific mix is algebraically more tedious than spotting that B is beaten by the simple average of A and C. Once B was gone, the dominance of Col 1 over Col 2 became visually obvious (pure dominance).

  **The Takeaway:** When you cannot find a pure strategy that dominates another in these problems, the next logical step in game theory is to check if a **convex combination (mixture)** of other strategies dominates the target strategy.
