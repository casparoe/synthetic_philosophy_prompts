          *   Option C: Reject the premise about the wasp - Maybe wasps have *some* agency.
      *   **Goal:** Help the user identify the weakest link in the argument without forcing them into a philosophical corner they aren't ready for, while providing enough nuance to settle the debate (or at least understand their own stance better).

  2.  **Deconstruct the Argument (Sphexishness):**
      *   The Sphex argument is a classic philosophy trope (often attributed to Dennett or Bergson). It highlights *rigidity* and *lack of adaptability*.
      *   The core claim is: *Mechanism = No Free Will.*
