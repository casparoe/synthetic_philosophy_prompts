          *   Conclusion: Since wasps lack free will due to rigidity, humans also lack it because complexity doesn't change the fundamental mechanism.
      *   **The User's Intuition:** This feels wrong ("proves too much").
      *   **The User's Confusion:** Where exactly does the argument fail?
          *   Option A: Reject (3) - Human cognition isn't just subroutines.
