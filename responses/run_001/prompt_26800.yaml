          *   Why? While intended to unify, it creates a unique logical tension. If a state represents itself, can it do so erroneously? If I have a state of pain, and I represent myself as being in pain, and I am indeed in pain (because the state *is* the pain), how can it be false? To allow false representations of the self-state, one must fragment the state, which undermines the theory's central motivation (unity). It struggles more than Lycan because the target is internal/intrinsic, not external-like.

