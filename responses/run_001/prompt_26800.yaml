      1.  **Most Difficult (Highest Severity): Rosenthal (HOT).**
          *   Why? Because it clearly distinguishes the two states. If HOT $\neq$ FO, then HOT can miss the mark. If HOT says "I see red" and FO is null, Rosenthal says the person is conscious of red. This creates the phenomenon of "illusory consciousness" which critics find highly counterintuitive (you can be conscious of red without any red qualia). The gap between the states allows for maximum freedom of error.

