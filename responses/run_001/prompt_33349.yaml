      *   However, the philosophical stance is arguably incorrect or shallow regarding modern interpretations of NFL. NFL does *not* vindicate Hume's radical skepticism about induction *in practice*; it vindicates the need for priors. But Hume's problem is about the *rational justification* of those priors. The student says the bias *is* the circularity. But the "No Free Lunch" theorem actually supports the "Free Lunch" of specific environments (e.g., Occam's Razor works because nature is simple).
