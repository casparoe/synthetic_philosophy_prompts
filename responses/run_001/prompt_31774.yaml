answer: |-
  You see clearly that money is a token of convention, but you fail to distinguish the instrument from the good it serves. I say the pursuit of wealth is unnatural not because money is artificial, but because human needs are finite while the capacity to amass currency is potentially infinite. When a man buys bread to avoid hunger, he satisfies a natural limit; when he trades bread for silver just to trade that silver for more silver, he chases a phantom. The convention of money allows commensurability for the sake of community and household maintenance, but to treat the measure as the goal is to invert the order of nature, making the means the end.

  Therefore, nothing is wrong with using the convention for its proper work, but vice arises when the limitless character of exchange supersedes the limited character of living. It is not the acceptance of the coin that is in question, but the direction of the soul toward it. Tell me, then, in your time: does a merchant sell his wares simply to acquire other goods he requires for the household, or does he produce goods solely to convert them into monetary gain? This distinction defines whether he acts within nature or outside it.
