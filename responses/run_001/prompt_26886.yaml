  After a career in the natural sciences, I have lately been working through the decision-theory literature, and I have found myself stuck on the Ellsberg paradox. In my reading group, whenever the discussion turns to whether ambiguity aversion is rational or a bias, someone invokes the proverb "better the devil you know than the devil you don't." I sense that the proverb is doing real argumentative work, but I cannot tell exactly what work it is doing. Could you disentangle the distinct precise claims this proverb could be making when deployed in the context of ambiguity aversion and the Ellsberg paradox? I want a list of readings, from the trivial to the radical, with an assessment of each: is it plausible, and does it actually support treating Ellsberg-type preferences as rationally permissible rather than as a mistake?
