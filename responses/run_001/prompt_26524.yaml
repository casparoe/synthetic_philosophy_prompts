      *   *The EDA:* Define the "Training Setup." Evolution = Optimization Algorithm. Fitness = Reward. Moral Truth = Unknown/External Label Distribution.
      *   *The "Debunk":* Outer Alignment Failure. The reward function provided by nature ($R_{survival}$) is misspecified relative to the target objective ($O_{truth}$).
