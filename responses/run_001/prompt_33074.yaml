      *Revised Draft:* "Your deprivation account relies on a ghostly continuity where a 'you' persists long enough to register the absence of goods, yet Epicurus argues there is no such continuity. When you say your life is 'worse,' you are comparing an actual timeline against a possible one, but for a harm to be real, the subject must exist to stand in relation to those missing goods. While you are alive, yes, you suffer the sting of anticipated loss, but that is a current pain caused by imagination, not the death itself acting upon you later. Once death occurs, the condition necessary for harm—the experiencing subject—ceases, rendering the counterfactual comparison moot; you cannot be deprived of pleasure after you have ceased to be a pleaser. Thus, a shorter life may contain less joy than a longer one would have, but without a surviving consciousness to measure that deficit, calling it a 'harm to you' is merely poetic, not ontological."

