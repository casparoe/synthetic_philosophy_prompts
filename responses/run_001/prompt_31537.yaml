answer: |-
  This is an excellent exercise in critical listening. You are right to be suspicious. While the podcast host captures the *flavour* of Sharon Street’s argument—famously presented in her 2006 paper *"A Darwinian Dilemma for Realist Theories of Value"*—his summary compresses significant philosophical nuance into soundbites, leading to overstatements and omissions that change the dialectical stakes.

  A metaethicist working on this literature would likely agree that the host gets the "punchline" of Street’s position broadly right but misrepresents the mechanics of the argument and dismisses the realist counter-strategies far too hastily.

  Here is a breakdown of the major moves in the transcribed passage, assessing what holds up, what requires qualification, and where the summary fails to do justice to the actual debate.

  ### 1. The Core Evolutionary Explanation
  > *"Evolution shaped our basic moral intuitions... not because these intuitions track objective moral truths, but because they helped our ancestors survive and reproduce."*

  **Verdict:** Accurate.
  **Analysis:** This correctly identifies Street’s central thesis regarding the relationship between evolutionary history and moral belief. Street argues that when we look at the etiology of our evaluative attitudes, the most parsimonious explanation is an **Adaptive Link Account**: our ancestors who possessed certain pro-social sentiments (like care for kin or condemnation of unprovoked harm) were more successful at surviving and reproducing. Therefore, evolution selected for these attitudes.

  What the host omits, however, is that Street contrasts this with a **Tracking Account**, where evolution selected for attitudes *because* they happened to align with the truth. Street argues that for the realist, this Tracking Account is vastly less plausible than the Adaptive Link Account. The host’s phrasing ("complete in its own terms") captures Street’s commitment to methodological naturalism—that we should look for purely naturalistic explanations for psychological phenomena before positing supernatural or non-natural entities.

  ### 2. The Appeal to Parsimony (Ockham’s Razor)
  > *"The evolutionary explanation... doesn't need to posit any mind-independent moral facts. So by Ockham's razor, the realist's claim... is a redundant hypothesis."*

  **Verdict:** Mostly Accurate, but technically debatable.
  **Analysis:** This represents the core of Street’s *Explanatory Challenge*. She asks: What work do moral facts do in explaining our moral judgments? If evolutionary pressures alone suffice to explain why we judge incest to be wrong, adding "and because it violates a Platonic moral fact" seems to add unnecessary theoretical baggage.

  However, a sophisticated philosopher would note that Ockham’s Razor applies to competing explanations. Street must first establish that the evolutionary story *is* sufficient. Some realists argue that evolutionary pressures only explain the *opportunity* for moral reasoning, while the content of the reasoning relies on rational insight into moral facts. The host presents the redundancy of moral facts as an established conclusion ("It adds nothing") rather than a premise that realists fiercely contest.

  ### 3. From Redundancy to Unjustification
  > *"If the best explanation of why we believe what we believe makes no reference to moral facts, then those beliefs are unjustified."*

  **Verdict:** Overstated / Problematic.
  **Analysis:** This is the weak point in the host’s logic. Even if the evolutionary explanation makes moral facts redundant, it does not automatically render the resulting beliefs *unjustified*. To jump from "there is a non-truth-tracking cause" to "the belief is unjustified," one needs a specific epistemic principle linking causal genealogy to warrant.

  Realists often respond with **Reliabilism**. They might argue that even if evolution selected for survival, the mechanism itself is reliable because survival and value *necessarily correlate* (more on this in section 4). Furthermore, Street’s argument is often framed not as a direct proof of unjustification, but as presenting a **dilemma**: either show that the correlation between evolution and truth is non-accidental, or admit that our confidence in morality is undermined. The host treats it as a "get-out-of-jail-free" card that definitively invalidates justification, which bypasses the nuanced epistemic defence the realist might mount.

  ### 4. The Conclusion of Incompatibility
  > *"Street thus demonstrated that moral realism is incompatible with an evolutionary account of human psychology, full stop."*

  **Verdict:** Incorrect Overstatement.
  **Analysis:** A metaethicist would strongly object to the phrase "full stop."
  1.  **Naturalistic Realism:** Street primarily targets **Non-Naturalistic Realism** (the view that moral properties are distinct, sui generis entities). **Naturalistic Realists** (who believe moral facts *are* natural facts, e.g., functionalist or sociobiological accounts) can arguably dodge the argument. Since they identify moral facts with the very natural facts driving evolution (e.g., "well-being"), there is no gap between the evolutionary force and the moral truth. Street acknowledges this loophole in her own work, so claiming she refuted realism *simpliciter* is wrong.
  2.  **Dilemma vs. Refutation:** Street calls it a "Darwinian Dilemma." A dilemma is a strategic problem to be solved, not a proof of impossibility. It demands that realists offer an explanation for the overlap between evolution and morality. If they provide a satisfying explanation, the argument dissolves. It is a challenge to realism, not a final verdict.

  ### 5. The 'Third Factor' Response
  > *"You'd need to already be a moral realist to identify which evolutionarily advantageous traits are the genuinely moral ones. He moved on without discussing more nuanced versions..."*

  **Verdict:** Misleading Dismissal.
  **Analysis:** The host’s three-second dismissal of the Third Factor response is perhaps the most contentious part of his summary. The Third Factor response (championed by thinkers like David Enoch, Derek Parfit, and Guy Kahane) does not claim that evolution directly aims at morality. Rather, it proposes a shared independent variable.

  There are two common forms of this response:
  1.  **Necessary Connection:** Perhaps it is a necessary truth that survival-promoting behaviours are also morally good (e.g., pain-avoidance is constitutive of suffering, which is bad).
  2.  **Independence:** The third factor is something like *agency* or *reasoning capacity*. Evolution selects for reasoning; Reasoning reveals moral truth. Therefore, there is a non-coincidental link.

  The host’s charge that this "begs the question" assumes that the realist cannot appeal to a necessary connection between survival and value without presupposing the conclusion. However, the realist replies that the connection is *metaphysically* prior. For example, if one argues that "Well-being" is the normative standard, and "Evolution seeks Well-being," the link is tight.

  To dismiss this as question-begging is to ignore the entire sub-literature devoted to showing how such connections can be justified conceptually or metaphysically, rather than empirically. By refusing to entertain the "pre-established harmony" option (that the universe happens to be structured such that what aids evolution also aligns with what is good), the host prevents a fair engagement with the strongest realist counter-argument.

  ### 6. The Question of "Independent Moral Facts"
  > *"Street's demonstration... [that] evolution... shaped our basic moral intuitions... not because these intuitions track objective moral truths"*

  **Verdict:** Context Dependent.
  **Analysis:** This depends heavily on which type of intuition we are discussing. Street admits that we have evolved capacities for empathy. She argues that these capacities do not explain *specific* moral rules (e.g., why infidelity is wrong) as much as general social inclinations. Realists argue that evolution gives us the *faculty* of moral sensitivity (a capacity to detect reasons), but the *content* of our morality comes from reflecting on those reasons, which track truth. The host conflates moral *sensibilities* with specific moral *judgments*.

  ### Summary Assessment

  The podcast host has done a serviceable job of capturing Street's rhetorical style and the broad contours of the Anti-Realist challenge. However, he has sacrificed accuracy for dramatic effect.

  1.  **What he got right:** The core tension (Adaptive Link vs. Tracking); the appeal to naturalistic parsimony; the burden placed on the realist to explain the correlation.
  2.  **Where he went wrong:**
      *   He conflated the defeat of *justification* with the falsity of the *theory* (the "unjustified" vs. "incompatible" leap).
      *   He ignored Naturalistic Realism, presenting the argument as a universal refutation of all moral realism.
      *   His dismissal of the Third Factor is dogmatic. He treats a metaphysical hypothesis (that survival tracks goodness) as circular without engaging with arguments that try to ground that link in necessary truths or constitutive relations.
  3.  **The Final Remark:** The claim that Street proved realism is "incompatible... full stop" is false. At best, she proved that Non-Naturalistic Realism must explain away a massive statistical coincidence. If the realist offers a plausible "Third Factor," the compatibility remains open.

  **Recommendation:** If you wish to understand the debate properly, read David Enoch’s *"Taking Morality Seriously"* (Chapter 6), where he responds directly to Street using the Third Factor. Reading him alongside Street will give you a much clearer picture than the podcast host's binary summary. The consensus among contemporary philosophers is that Street shifted the burden of proof onto realists, but did not successfully eliminate the possibility of their success.
