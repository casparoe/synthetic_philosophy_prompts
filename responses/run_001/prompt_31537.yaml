      *(Self-Correction on 'Full Stop' comment)*: Street explicitly says she targets *realist* theories. However, many realists (naturalists) think facts are natural. Street grants that naturalists avoid the EDA better because facts aren't mysterious. The host says "Moral Realism" generally. I should highlight that this is a conflation of Non-Naturalism vs. Naturalism within Realism.

      *(Refining Third Factor)*: Specifically, the "Pre-established Harmony" or "Necessary Connection" strategy. Enoch's "Survival is Good" argument.

