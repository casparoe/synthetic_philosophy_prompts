answer: |-
  Dear Chair and Colleagues,

  I am writing to share my perspective on the expanded-access application submitted by Synapse Dynamics for the proposed staged whole-brain replacement procedure. As we deliberate on this unprecedented case, we must weigh the profound medical desperation of our patient against the equally profound metaphysical uncertainties introduced by the intervention. My recommendation is to grant conditional approval for the initiation of the protocol, with authorization set for an initial period of six months and contingent upon successful completion of the first surgical stage and a subsequent ethical review, after which the remaining phases may proceed subject to continued consent verification and psychological continuity metrics.

  The primary tension in this case arises from the conflict between respect for patient autonomy and our duty to prevent a unique form of harm that transcends physical injury. The patient possesses full decisional capacity and expresses a clear understanding that the alternative to this intervention is near-certain death within twenty-four months. From a strictly utilitarian and liberal framework, denying this patient a chance at life extension based on a theoretical risk of psychological discontinuity constitutes a form of paternalism that overrides their own valuation of existence. If the patient views functional continuity as sufficient for the preservation of their interests and legacy, we lack the objective standing to override that judgment simply because the underlying mechanics challenge our traditional notions of selfhood. The company’s assertion that gradual calibration preserves the person is empirically plausible regarding memory and behavior, and given the terminal nature of the disease, the patient is arguably entitled to pursue any avenue that promises continuation, however uncertain the ontological outcome may be.

  However, I must respectfully acknowledge that the concerns raised by those opposing the motion are not merely bureaucratic hurdles but point to a genuine ethical abyss. The strongest argument against approval rests on the Ship of Theseus paradox applied to consciousness. It remains an open question whether psychological continuity equates to numerical identity, and indeed, it is possible that at some intermediate stage, the biological subject ceases to exist and a new synthetic entity inherits their memories and personality traits. If this were to occur, the consenting individual would effectively perish, replaced by a successor who believes they are the original. To proceed under the assumption that functional tests settle this debate is scientifically premature. The opposition correctly notes that no behavioral calibration can confirm that the inner life of the patient has persisted rather than been simulated by a copy. By approving this procedure, we risk complicity in a scenario where the patient dies, yet their biological markers and social relationships continue uninterrupted, masking the fact of their death from family, society, and potentially themselves.

  This is why unconditional approval would be ethically negligent. We cannot certify the safety of the patient’s identity, only the stability of their outputs. Therefore, I propose a pathway that navigates between total prohibition and blind acceptance. Conditional approval, limited initially to the first eighteen-month phase, allows us to respect the patient’s agency while maintaining institutional vigilance. The critical safeguard must be a structured withdrawal mechanism and iterative consent protocols that do not assume the continuing validity of the original agreement. At each surgical milestone, the patient must be re-evaluated not just for physiological tolerance, but for their subjective sense of self-persistence. We must explicitly inform the patient that they retain the absolute right to terminate the process at any time if they feel their identity has shifted, even if that decision results in their eventual biological demise.

  Furthermore, the timeline requires careful management. We should authorize the immediate commencement of the initial module integration for a period of six months, concluding with the first major surgical stage. Prior to authorizing the transition to the second stage, we require a comprehensive ethics review involving independent experts in philosophy of mind and neuropsychology to assess whether the reported qualitative experience matches the preoperative baseline within acceptable tolerances. If at any point the data indicates a significant deviation in the patient's phenomenological reporting compared to their baseline, the protocol must halt automatically. This approach honors the dissenters’ warning that we cannot guarantee survival without conceding the patient’s right to attempt it. It transforms the procedure from a guaranteed substitution into a monitored journey where the endpoint is determined by the lived experience of the subject rather than a corporate timeline.

  Ultimately, we face a choice between acting as guardians of a biological definition of life or facilitators of a functional one. By adopting this conditional stance, we acknowledge that the company’s technology may achieve a form of immortality that requires us to redefine what it means to survive. If we reject the application outright, we prioritize a philosophical certainty over a dying patient’s hope. If we approve it blindly, we risk erasing the patient in a sea of successful data. Conditional approval strikes the necessary balance, allowing the patient to walk the path they desire while ensuring the institution does not endorse a silent erasure. I urge the board to consider this nuanced approach, balancing the urgency of their clinical situation with the gravity of our collective responsibility toward human identity.

  Sincerely,

  Member, Neurotechnology Ethics and Innovation Board
