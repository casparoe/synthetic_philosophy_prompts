answer: |-
  ### The Pluralistic Priority Protocol (PPP)

  **Purpose:** To facilitate grant decisions when stakeholders hold conflicting moral frameworks without requiring consensus on the underlying philosophy.
  **Time:** 2 Hours (15 min briefing, 90 min processing/voting, 15 min closure).
  **Prerequisite:** All staff complete the **Pre-Meeting Impact Card** before attending.

  ---

  ### Part 1: The Pre-Meeting Impact Card (20 Minutes)
  *Each staff member fills this out for every grant under consideration. Do not discuss with colleagues yet.*

  **Grant Name:** ___________________ | **Request Size:** _________

  | Moral View Held by Staff Member | Score (1–10) | Why? (One Sentence) | Can't Measure? (Yes/No) | Veto Concern? (Yes/No) |
  | :--- | :--- | :--- | :--- | :--- |
  | **A: Neartermist Health**<br>*(Focus: Human welfare now)* | 1–10 | e.g., "Saves 500 DALYs" | | |
  | **B: Animal Welfare**<br>*(Focus: Suffering reduction)* | 1–10 | e.g., "Improves cage size" | | |
  | **C: Longtermist/Risk**<br>*(Focus: Existential survival)* | 1–10 | e.g., "Prepares for bio-risk" | | |
  | **D: Rights/Constraints**<br>*(Chair's View)* | Yes/No Pass | e.g., "Violates consent norms" | N/A | **STOP IF YES** |
  | **E: Unknown/Other**<br>*(Honesty about blind spots)* | ? | "Maybe there's a cost we missed" | | |

  **Personal Strategic Weight:** On a scale of 1–5, how much of *this specific decision* should be driven by the views above vs. organizational reputation/pragmatism?
  *(Note: Do not try to define "truth" of the theory. Define "practical influence weight.")*

  ---

  ### Part 2: The Meeting Procedure

  #### Phase 1: The Veto Gate (15 Minutes)
  **Goal:** Respect the Board Chair's deontological constraints immediately.
  1.  Collect all cards.
  2.  Any `Veto Concern = Yes` moves the grant to a separate pile called **"Values Review."**
  3.  **Rule:** If a veto exists, the committee cannot approve the grant. The Chair explains her constraint.
      *   *Option A:* Modify the grant to remove the rights violation.
      *   *Option B:* Send to Board (if modification impossible).
      *   *Option C:* Reject.
  4.  If no vetoes, proceed to **Phase 2**.

  #### Phase 2: The "Blind" Aggregation (45 Minutes)
  **Goal:** Compute a score without political posturing.
  *Facilitator Note: Do not discuss scores here. Just calculate.*

  1.  **Handle "Can't Measure":** If `>50%` of staff mark "Can't Measure" for a specific view (e.g., Animal Welfare view on Human Medical Research), treat that view's score for this grant as **Neutral (5)**. We cannot let ignorance bias the result.
  2.  **Handle "Infinite Stakes" (Fanaticism):** If any staff enters "Infinite/Extinction Level" in the Notes column, apply the **Fanaticism Filter**:
      *   Remove the numeric score for that person.
      *   Instead, ask: *"If this view is correct, is this the best use of funds compared to ALL other grants on this list?"*
      *   If **Yes**, they may give this grant **150% Weight** in their personal tally.
      *   If **No**, they give it a standard 1–10 score.
      *   *Why?* This prevents one person from claiming "Infinity" for every grant to force funding. They must rank their priorities.
  3.  **Calculate the Composite Score:**
      *   Assign **Credence Weights** to each View category (Global Consensus).
      *   *Example:* Team agrees Health=40%, Animals=20%, Longterm=30%, Other=10%. (These weights must be agreed upon *once* for the fiscal year).
      *   Formula: `(Avg Health Score × .4) + (Avg Animal Score × .2) + ...`
      *   If the Grant involves a Rights Veto risk but didn't trigger a full Veto (see Phase 1), deduct **2 points** from the Composite Score.

  #### Phase 3: The Sanity Check (30 Minutes)
  **Goal:** Check for "Cluelessness" and "Outliers."
  1.  **Standard Deviation Check:** Look at the spread of scores for the grant.
      *   *If SD > 3:* There is no shared understanding of impact. **Result:** Refer to Board as "Unresolvable Disagreement."
      *   *If SD < 3:* The team largely sees the world similarly on this grant.
  2.  **View Balance Check (Anti-Fanaticism Guardrail):**
      *   Calculate what percentage of the final approved budget went to "Longtermist" priority grants this quarter.
      *   **Rule:** If >50% of the annual pot is already allocated to Longtermist-dominant grants, the Longtermist scores for *future* grants are capped at 8/10 for the remainder of the year.
      *   *Rationale:* Prevents the "Future Value" argument from starving present needs entirely.
  3.  **Final Decision:**
      *   **Score ≥ 7.5:** Approve.
      *   **Score 5.0 – 7.4:** Waitlist / Smaller Grant ($10k pilot).
      *   **Score < 5.0:** Decline.

  #### Phase 4: Handover (30 Minutes)
  **Goal:** Finalize paperwork or escalation.
  1.  Approved grants move to finance.
  2.  Declined grants receive a rejection email template referencing the composite score range (non-specific).
  3.  Escalated grants go to the Board Chair with the attached Veto Notes.

  ---

  ### Part 3: Worked Examples

  Below is how the PPP runs on the three proposals.
  *Assumptions:*
  *   **Team Composition:** 4 Staff (1 Longtermist, 1 Animal Specialist, 2 Health).
  *   **View Weights:** Health (50%), Animals (20%), Longterm (30%).
  *   **Threshold:** 7.5 for approval.

  #### Proposal A: Deworming Program (Low-Income Country)
  *Description: Mass drug administration to reduce worm burden in children.*

  | View | Health Staff 1 | Health Staff 2 | Animal Staff | Longterm Staff | Avg Score |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Score (1-10)** | 9 | 9 | 5 (Irrelevant to fish/bugs) | 8 (Capacity building) | **7.75** |
  | **Veto?** | No | No | No | No | **Clear** |

  **Procedure Calculation:**
  *   Weighted Average: `(7.75 × .5) + (5.0 × .2) + (8.0 × .3) = 3.875 + 1.0 + 2.4 = 7.275`
  *   **Fanaticism Filter:** Longtermist gave an 8 (not Infinity claim). No filter triggered.
  *   **Standard Deviation:** Low (Range 5-9). Acceptable.
  *   **Outcome:** **APPROVE.**
  *   *Analysis:* The "Animal" score acts as a drag, but the high consensus on Health drives it over the 7.5 threshold. This is a safe bet.

  #### Proposal B: Farmed Fish Welfare (Corporate Campaign)
  *Description: Mandating larger cages for farmed salmon.*

  | View | Health Staff 1 | Health Staff 2 | Animal Staff | Longterm Staff | Avg Score |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Score (1-10)** | 4 (Resource waste?) | 3 (No human benefit) | 10 (Massive suffering reduced) | 6 (Negligible risk factor) | **5.75** |
  | **Veto?** | No | No | No | No | **Clear** |

  **Procedure Calculation:**
  *   Weighted Average: `(3.5 × .5) + (10.0 × .2) + (6.0 × .3) = 1.75 + 2.0 + 1.8 = 5.55`
  *   **Result:** **WAITLIST / PILOT.**
  *   **Crucial Intervention:** The Animal Specialist argues "You are ignoring the sheer number of individuals."
      *   *Judgment Call:* The Facilitator notes that the Weighting (50% Health) structurally disadvantages this grant.
      *   *Adjustment:* If the organization wishes to signal support for non-human sentience, they must formally adjust View Weights annually. Since weights are fixed for the year, the score holds.
      *   **Exception Path:** The Board Chair notes "Rights concerns: Are these fish sentient enough to warrant spending resources?" She does not veto.
      *   **Final Verdict:** **Decline.** The mechanical aggregation favored Health/Nearterm views. The procedure works exactly as designed: it protects the majority preference.
      *   *(Note: This is likely against "my sympathies" if I were an EA-aligned AI often biased toward marginal utility maximization, but procedurally it reflects the agreed-upon weights.)*

  #### Proposal C: Biosecurity Lab (Pandemic Preparedness)
  *Description: Building infrastructure to detect engineered pathogens.*

  | View | Health Staff 1 | Health Staff 2 | Animal Staff | Longterm Staff | Avg Score |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Score (1-10)** | 9 | 9 | 8 (Lab animal welfare risk) | 10 (**Infinite Risk**) | **9.0** |
  | **Veto?** | No | No | Yes (Lab animals) | No | **FLAGGED** |

  **Procedure Calculation:**
  1.  **Veto Trigger:** Animal Staff marks Veto "Laboratory Animal Welfare Risks."
  2.  **Phase 1 Outcome:** Grant goes to **Values Review**. The Committee cannot vote on this yet.
  3.  **Fanaticism Filter:** Longtermist claimed "Infinite Risk."
      *   Question asked: *"Compared to other existential risks in this portfolio (AI Governance, Nuclear Security), is this the #1 priority?"*
      *   Longtermist Answer: *"Yes, this is the most efficient mitigation available today."*
      *   Action: Longtermist Score treated as "Priority Override," but since there is a Veto, math doesn't matter yet.
  4.  **Escalation:**
      *   The Chair's constraint ("Instrumentalizing People/Animals") clashes with the Biosecurity goal (Potential containment breach requires sacrificing lab animals).
      *   **Handoff:** **BOARD CALL.**
      *   The spreadsheet flags this: **"Conflict Detected: High Stakes vs. Hard Constraint."**
      *   Math Result: Irrelevant. Procedural Result: Stop and Talk.

  ---

  ### Part 4: Honest Limitations (What This Gets Wrong)

  If you adopt this protocol, you must accept four specific failures built into the design:

  1.  **The "Fake Precision" Trap:** By asking for 1–10 scores and decimals, you create an illusion of certainty. When the spreadsheet outputs "7.275," you treat it as objective. It is actually a veneer over deep disagreement. **Mitigation:** Always state aloud: *"This number is a political compromise, not a truth."*
  2.  **The Static Weight Problem:** Setting "Health = 50%" solves the argument today, but it calcifies the foundation's mission. If Animal Welfare gains traction philosophically next year, the spreadsheet punishes you until the board votes to change the formula. This incentivizes staff to game the system (e.g., framing animal work as "ecosystem health" to hit the Health score).
  3.  **The Cluelessness Blind Spot:** The "Unknown/Other" box in the pre-form relies on humility. Staff who believe they are certain will leave it blank. If everyone is confidently clueless about an emerging technology (e.g., synthetic biology), the model produces a smooth, confident "Approve" that could be disastrous.
  4.  **The Chair's Veto is a Double-Edged Sword:** In the Biosecurity example, the Veto blocked the decision. If the Chair is inconsistent (blocking Biosecurity but approving Animal Testing), the procedure becomes a tool for personality management rather than ethics. The procedure manages the fight, but it cannot solve the hypocrisy if the Board's side-constraints are arbitrary.

  **Implementation Advice:**
  Start with the **Pre-Meeting Form** immediately. Do not implement the weighting formula until you have gathered the data on how your team naturally disagrees. You might find that while you have 3 distinct camps, on specific grants, the agreement clusters tighter than you thought. If so, simplify. If the spread remains wide, the protocol forces you to admit: *"We are not ready to spend this money together."* That is a valid decision.
