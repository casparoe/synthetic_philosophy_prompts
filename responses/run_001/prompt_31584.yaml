          *   Tone: Professional, practical, philosophical but accessible.

  2.  **Deconstruct the Philosophy into Practice:**
      *   *Moral Uncertainty:* We can't agree on *the* right theory. So we must aggregate subjective credences over theories.
      *   *Expected Choiceworthiness (MEC):* Standard utilitarian approach. Multiply impact score by credence in theory. Problem: Intertheoretic comparability (how many chicken lives equal one human life?). Problem: Fanaticism (long-termism implies huge future = dominant value).
      *   *My Favorite Theory (MFT):* Just follow the view you think is most likely true. Problem: Disregards minority views (unfair in this context).
      *   *Borda Count / Voting:* Rank options. Easier for non-philosophers. Less theoretical baggage.
      *   *Side Constraints:* Deontology usually trumps consequentialism. Need a "Veto/Red Flag" stage.
      *   *Incomparability/Cluelessness:* If scales don't match, don't force a number. Mark as "Hard Incommensurable."
      *   *Unknown Theories:* Leave room for humility ("We don't know what matters").

  3.  **Drafting the Procedure (The "Foundational Decision Framework"):**
      *   *Name:* Needs to sound institutional, not academic. "The Weighted Impact & Constraint Protocol."
      *   *Phase 1: Pre-Meeting Prep (20 mins).* Staff fill out a form.
      *   *Phase 2: The Meeting (120 mins).* Review, Discuss, Vote.
      *   *Key Components:*
