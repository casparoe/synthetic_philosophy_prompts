      *Better Idea:* Use **Borda Count** across Views. Each view ranks the options. Then aggregate. This handles cardinal incommensurability better than scores.
      *Wait, Prompt asks for Spreadsheet.* Borda is harder in a spreadsheet for non-phils. Let's stick to **Capped Normalized Scoring**.
      *Revised Plan:* 1-10 Scale is fine, BUT if a view claims "Infinity" (Existential Risk), they must write "IR" (Infinite Risk) instead of 10. The procedure then treats "IR" differently (Veto or Threshold). Actually, let's simplify: Max Score 10. If Longtermists argue "This is 10^100 times more important," the procedure forces them to rank their top 3 grants against other top 3 grants on the same scale. It normalizes *within* the portfolio, not just within one grant. Okay, keep it simpler for the 2hr meeting.

      *Let's try this specific rule:* "Comparative Intensity." Staff mark if a grant triggers a "Must Fund" within their view. This creates a binary switch for the high-stakes theories.

