      *   *Unknown Views:* Add a line item "Probability of Neglected Ethical Considerations." If high, trigger "Board Call."
      *   *Mechanical vs. Judgment:* Use bolding or footnotes to identify where numbers are fake precision.

  5.  **Developing the Three Examples:**
      *   *Deworming:* High health utility. Low risk. Animal view neutral/slight negative (parasites). Longterm positive (human capacity). Rights compliant. -> Likely "Go."
      *   *Farmed Fish:* Low human impact. High animal welfare. Health view neutral. Longterm neutral. Rights? (Animals rights?). Board Chair might object if humans involved in cruelty. -> Tension point. Likely "No" or "Compromise."
      *   *Biosecurity:* Human survival stake (Longterm/Human). Health positive. Animal negative (potential lab animals/research). Rights risk (dual use/biological restrictions). -> High tension. Infinite stakes vs. Rights constraint. -> "Board Call."

  6.  **Writing the Content - Step-by-Step:**

      *   *Introduction:* Acknowledge the difficulty. Frame it as "Managing Conflict, Not Solving Morality."
      *   *The Form:* Keep it simple. Columns for Grant, Scores per View, Credences, Veto Check.
      *   *The Algorithm:*
          1.  Veto Pass/Fail (Rights check).
          2.  Normalize Scores (prevent 1 million years dominating 1 day of pain).
          3.  Aggregate (Weighted Average).
          4.  Cluelessness Check (If variance is too high, escalate).
      *   *Nuance:* Explain *why* we normalize. Explain that credences are group consensus, not individual.
      *   *Examples:* Run through the logic.
      *   *Critique:* Be honest. This doesn't solve the problem; it just manages it. It gamifies morality.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is asking for "credences on moral truth" realistic?
      *   *Fix:* Frame it as "Strategic Influence Weighting." "How much should we let this framework drive our strategy?" instead of "Is Utilitarianism True?"
      *   *Critique:* Won't this still favor Longtermism if they say stakes are bigger?
      *   *Fix:* Implement "Diminishing Returns" on the score scale (Log scale or capped 1-10). A grant saving 1 life shouldn't get a 1 if saving a civilization gets a 10. They need to calibrate. Actually, better: Cap the maximum contribution of any single "View" to the final decision to prevent tyranny of one perspective. Or simply require a majority threshold. Let's go with: *No single view can exceed 40% of the final weighting unless unanimous.* This prevents fanaticism.
      *   *Critique:* The prompt asks for "Maximizing Expected Choiceworthiness" flavor but also "My Favorite Theory."
      *   *Decision:* Hybrid. Use MEC but with capped scaling to avoid fanaticism. If Veto fails, stop immediately.
      *   *Prompt Requirement:* "Turn it into an actual procedure... two-hour grant meeting." I need to make sure the time allocation fits.

  8.  **Final Polish:** Ensure the tone is empathetic to the Program Officers. Make sure the distinction between mechanical steps and judgment calls is explicit. Ensure the examples reflect the internal dynamics described (Health vs Animals vs Longterm vs Chair).

