      *Solution:* "Cross-Perspective Calibration." Before the grant meeting, the team agrees on a "Conversion Budget." E.g., "We accept that reducing animal suffering is less important than human life *unless*..." No, that's arguing philosophy again.
      *Best Practical Solution:* Treat Credence in the Theory itself as the weight. If Longtermism has 30% credence, its vote counts for 30%. The scores themselves must be 1-10. If Longtermists say "This is the most important thing ever," they give it a 10. If Health says "It's okay," they give 5. The math averages them. This avoids the infinite math but accepts the weighting disagreement.
