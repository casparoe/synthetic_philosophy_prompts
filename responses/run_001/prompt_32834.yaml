      *   *Correction:* Make sure not to say Avicenna *didn't* have doubts about senses. He did critique them. But the Flying Man isn't the tool for *universal* doubt, it's the tool for establishing self-awareness of the soul.
      *   *Clarification:* Ensure the distinction between "ontological status" (substance) and "epistemic certainty" (cogito) is clear. For Descartes, *cogito* proves existence to build physics/metaphysics. For Avicenna, flying man proves soul is a *jawhar* (substance) independent of *jism* (body).
