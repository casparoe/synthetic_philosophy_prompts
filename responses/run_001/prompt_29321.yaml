answer: |-
  The philosophical problem you are wrestling with is traditionally called **"The Hypocrisy Objection"** or **"The Problem of Standing to Blame."**

  After reviewing your seven cases, the intuition guiding most of your verdicts relies on a distinction between **ongoing violation** and **past failure**, but it falters slightly on the nuances of internal commitment and the purpose of the blame.

  Here is the best principle I can offer to unify your data, followed by the verdicts it forces you to reconsider.

  ### The Principle: Normative Symmetry

  > **To possess the standing to blame an agent $A$ for violating Norm $N$, the blamer $B$ must subscribe to Norm $N$ as universally binding on themselves in the same relevant circumstances.**

  This principle rests on the idea that blame is not just a report of error; it is a claim of moral authority. That authority comes from placing yourself inside the same jurisdiction as the person you are judging. You cannot stand outside the law while enforcing it upon others.

  **Two Key Components of the Principle:**
  1.  **Temporal Consistency:** You cannot uphold a rule for others that you are currently breaking (active violation).
  2.  **Doctrinal Consistency:** You cannot uphold a rule for others that you admit has exceptions that you would personally exploit (hidden exemption).

  ---

  ### How the Principle Handles Your Cases

  #### The Main Puzzle: Case 1 (Alex) vs. Case 2 (Sister) & Case 7 (Vegan)
  Your hardest question is why the ongoing cheater (1) lacks standing while the ex-smoker (2) and vegan (7) do not.

  *   **Case 1 (Alex):** Alex is actively violating the norm of sexual fidelity. More importantly, his anger suggests he does not fully accept the norm as binding on him—otherwise, he wouldn't cheat for years. He demands the norm from others (symmetry) while exempting himself (asymmetry). **Result:** No Standing.
  *   **Case 2 & 7 (Sister/Vegan):** Both sisters have ceased violating the norm. Crucially, they express regret. By expressing regret, they acknowledge that the norm *was* violated and that they were wrong to do so. They place themselves under the same standard they now demand from the teenager/meat-eater. Their past failure is a lesson learned, not an ongoing license. **Result:** Standing Exists.

  **The Difference:** It is not about the *act* in the past; it is about the *attitude toward the norm* in the present. The ex-smoker treats their past smoking as a mistake of weakness to be avoided forever. The cheater treats their past/current cheating as compatible with holding others to the standard.

  #### Re-evaluating Case 4: The "Would-Be" Thief
  You felt this person had standing because they hadn't acted. **However, the Principle of Normative Symmetry forces you to abandon this verdict.**

  *   **The Conflict:** The shoplifter believes the norm "Do not steal." You feel you believe it too, *unless* you are desperate.
  *   **The Failure of Symmetry:** If you admit you *would* steal under desperation, you have constructed a hidden exception clause in your moral code. You believe "Stealing is wrong unless desperate." When you blame the shoplifter, you implicitly deny they were desperate (or imply their desperation doesn't matter). But since you claim *your* desperation would justify theft, you are inconsistent. You are blaming them for failing to meet a universal standard that you admit does not exist.
  *   **Verdict to Abandon:** You should concede that the "Would-be Thief" lacks **full moral standing**. You have standing to warn them, but you lack the authoritative standing to condemn them, because you admit you aren't actually committed to the norm you are invoking. Your "willpower" so far is good luck, not moral superiority.

  #### Refining Case 6: The Drunk Driver (Public vs. Private)
  You hesitated on this one based on the audience.
  *   **The Principle's View:** Standing is about the *relationship between the blamer and the norm*, not the *blamer and the audience*. Since the friend admits shame and regret, they have successfully aligned themselves with the norm (they are not exempting themselves). Therefore, technically, they have standing even publicly.
  *   **Why you felt differently:** You conflated **Standing** (eligibility to speak) with **Propriety** (social fitness of the venue). The friend has standing, but using it on Facebook violates social decorum (it turns shared shame into public dominance).
  *   **Adjustment:** Do not change your verdict that he has standing. Instead, realize your discomfort was about *tact*, not *rights*. He has the right to blame, but he is acting foolishly by going public.

  #### Supporting Cases 3 & 5
  *   **Case 3 (Politician):** Lacks standing. He exempts himself from the norm of peaceful conflict resolution on a massive scale. He is asymmetrical: "My violence is justice; yours is war crimes."
  *   **Case 5 (Boss):** Lacks standing. He is currently violating the norm of respect (even if privately). He refuses to submit himself to the correction he offers the colleague.

  ---

  ### Test Case: The Recovery Coach

  **Scenario:** A man named Mark entered rehab ten years ago after severe alcohol addiction. He runs a sober-living facility. Last week, a resident (who is six months sober) slipped and had one drink. Mark kicks the resident out immediately and tells everyone: "One slip is a relapse. There is no room for mistakes here." Mark himself has had two drinks since rehab, claiming they were "medicine" prescribed by a doctor, something he admits the residents are not allowed to do.

  **Application of Normative Symmetry:**
  1.  **Is there Symmetry?** Mark is currently consuming alcohol, albeit under a different justification ("medicine"). However, he is telling the resident that alcohol consumption is forbidden.
  2.  **The Hypocrisy Check:** Is "medicine" a valid exception for the residents? Mark says no. Is it a valid exception for Mark? He thinks so.
  3.  **Verdict:** Mark **lacks standing**. While he is an addict in recovery (like Case 6), he has created an asymmetrical rule set. He demands the rule "No Alcohol" apply to the resident, while securing a personal exemption ("Medicine") for himself. If he wants standing to kick out the resident, he must either stop drinking entirely (aligning fully with the norm) or allow the resident to seek medical exceptions too (aligning the exception).

  This case tests the boundary between **Past Failure** (which restores standing) and **Current Exceptionalism** (which destroys it). Just as the "Would-be Thief" fails due to mental reservation, Mark fails due to practical reservation.

  ### Summary
  1.  **Principle:** **Normative Symmetry.** You must hold yourself to the exact same rules you demand of others.
  2.  **Abandon:** Your verdict on **Case 4**. Admitting you would break the rule removes the authority to enforce it.
  3.  **Clarify:** Your verdict on **Case 6**. He has standing, but poor judgment. Separation of Rights from Social Skill.
  4.  **Solve:** The Case 1 vs. 2 puzzle is solved by distinguishing *denial* of the norm (Alex) from *acceptance* of the norm (Sister).
