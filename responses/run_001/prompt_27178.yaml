      *   *Focus on the "Normative":* This is the user's specific concern. Is it just "don't get robbed"? Or "beliefs must look like probabilities"? Connect this to coherence in decision theory (Savage/von Neumann-Morgenstern).
      *   *Superhedging:* A coherent agent can superhedge any liability. An incoherent agent creates unhedgeable liabilities for themselves.

