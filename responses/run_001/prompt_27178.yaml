      *   *Direction 2 (Coherence $\implies$ Immunity):* If $\pi$ satisfies probability axioms (is a valid measure $Q$), then by definition, you cannot find a portfolio with non-positive payoff everywhere that costs nothing/negative to enter (excluding trivial zero). This is the FTAP (First part). If $Q$ exists, there is no free lunch.

  5.  **Drafting the Residue Report (The Critique):**
      *   *Clean Translations:* Linear pricing functionals $\approx$ Probability measures. Additivity $\approx$ Martingale property. The mathematical proof structure (Separating Hyperplane Theorem / Farkas Lemma) is identical in both fields.
