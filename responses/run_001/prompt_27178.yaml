answer: |-
  This is a high-quality intuition, and your skepticism is well-placed. You are correct that the mathematical core of the Dutch Book argument (DBA) is isomorphic to the First Fundamental Theorem of Asset Pricing (FFTP). However, treating them as identical flattens the distinct *teleologies* of finance and epistemology.

  Below is the translation of the Dutch Book argument into derivatives vernacular, followed by the residue report on what survives the mapping and what falls away.

  ---

  ### Part 1: The Translation

  Let us model the agent's epistemic universe not as a physical market, but as a **complete state-space model of contingencies**.

  **Definitions:**
  *   **State Space ($\Omega$):** The set of mutually exclusive, exhaustive possibilities the agent considers relevant (e.g., "It rains tomorrow," "The coin lands Heads").
  *   **Contingent Claims ($X$):** Random variables representing payoffs in different states. Think of these as digital options.
  *   **Credences ($P$):** The agent's subjective probability measure. In our terminology, these are the **subjective state prices**, normalized so $\sum P(\omega) = 1$.
  *   **Fair Price Functional ($\Pi$):** The linear operator defining the price of any claim. For a bet paying \$1 if $\omega$ occurs, the fair price is $\Pi(1_\omega) = P(\omega)$. By linearity (the assumption of rationality), $\Pi(X) = E_P[X]$.

  #### Direction 1: Incoherence $\implies$ Vulnerability to a Dutch Book
  **Philosophical phrasing:** If your credences violate the probability axioms, there exists a portfolio of bets you accept as fair that guarantees a net loss.
  **Quant Phrasing:** If the pricing functional $\Pi$ violates linearity/additivity (i.e., it is not generated by a valid probability measure), a **strict arbitrage portfolio** exists.

  **The Proof:**
  Assume your prices violate additivity. For example, you price event $A$ at $0.6$, event $B$ at $0.6$, but their union $A \cup B$ (where $A, B$ disjoint) at $1.5$.
  Consider three contracts you trade:
  1.  Buy claim $A$ for \$0.6.
  2.  Buy claim $B$ for \$0.6.
  3.  Sell claim $A \cup B$ for \$1.5.

  Your initial net cash flow is $-0.6 - 0.6 + 1.5 = +\$0.3$. You have received cash today.
  Your terminal payoff in any state $\omega$:
  *   If $\omega \in A$: Pay \$1 on contract 1. Cash = $0.3 - 1 = -0.7$.
  *   If $\omega \in B$: Pay \$1 on contract 2. Cash = $0.3 - 1 = -0.7$.
  *   If $\omega \notin A \cup B$: Nothing happens. Cash = $+0.3$.

  Wait, that's not a *sure loss* yet (positive payoff in some states). A standard Dutch Book requires strict loss in all states. To enforce that, the bookmaker acts as the counterparty.
  Adjust the stakes. Because $\Pi$ is nonlinear, the convex hull of your acceptable trades contains the origin in its interior. Geometrically, there is no separating hyperplane that supports the cone of "acceptable trades" without including the "loss cone."
  Construct a portfolio of bets with total cost $C < 0$ (you receive money) and payoff $X(\omega) < 0$ for all $\omega$ (you pay money in every world).
  Since you evaluate each leg $X_i$ at $\Pi(X_i)$, you calculate the Net Value as $N_V = \sum \Pi(X_i) = \Pi(\sum X_i)$.
  If $\Pi$ is incoherent, there exists a vector $v$ such that $\Pi(v) > 0$ (You think you're receiving value) but $v(\omega) < 0$ everywhere (You actually pay everywhere).
  **Result:** This is a **Type-1 Arbitrage** (or rather, a "negative Type-1" from the bookmaker's perspective). You are willing to enter a position that has negative intrinsic value everywhere, merely because your internal pricing kernel is broken.

  #### Direction 2: Coherence $\implies$ Immunity (No Dutch Book)
  **Philosophical phrasing:** If your credences obey the axioms, no such book can be made against you.
  **Quant Phrasing:** If $\Pi$ is generated by a valid probability measure $Q$, then **No Arbitrage** holds.

  **The Proof:**
  This is exactly the FFAT (Fundamental Theorem of Asset Pricing).
  If there exists a probability measure $Q$ such that $\Pi(X) = E_Q[X]$ for all claims, then consider any portfolio $X$.
  $\Pi(X) = E_Q[X]$.
  If the portfolio guarantees a loss, then $X(\omega) < 0$ for all $\omega$.
  Taking expectations under $Q$ (which assigns positive weight to all states usually assumed in this context, i.e., equivalent measure), $E_Q[X] < 0$.
  Therefore, $\Pi(X) < 0$.
  To accept this bet, you would require a non-zero payment upfront to offset the negative expectation. You will never sign up for a bet with a negative expected value if you believe the pricing rule is accurate.
  Thus, no combination of bets can yield a sure loss while appearing fair.
  **Result:** Your pricing kernel defines a valid **Equivalent Martingale Measure (EMM)**. The absence of an incoherent Dutch Book is mathematically equivalent to the existence of a risk-neutral measure.

  ---

  ### Part 2: The Residue Report

  Here is where the mapping reveals the friction between the two disciplines. You asked what translates cleanly, what is fudged, and what drops out entirely.

  #### 1. The Clean Translates
  *   **Linear Functional & Probability Measure:** The identification of credences with state prices is robust. Both rely on the Riesz Representation Theorem / Separating Hyperplane Theorem. The math that proves "violated additivity $\iff$ arbitrage opportunity" is identical to "non-additive functional $\iff$ violated fundamental theorem."
  *   **Completeness:** In a complete market, the pricing measure is unique. In DBA, if you are fully coherent across a rich enough algebra of events, your betting quotients converge to a unique probability measure.
  *   **The Hedging Argument:** If you are coherent, you can replicate any claim using your beliefs. If you aren't, you create "unreplicable liabilities" within your own mind—obligations you know you cannot hedge against yourself logically.

  #### 2. The Fudges
  *   **Risk Neutrality vs. Truth:** In finance, we don't care if the Risk Neutral Measure $Q$ matches the Real World Measure $P$, as long as there is no arbitrage. We care about the *relative* pricing of traded assets. In DBA, the goal is implicitly **calibration to truth**. A coherent agent might be internally consistent but empirically delusional (e.g., a perfect Bayesian with a bad prior). The DBA defends *consistency*, not *accuracy*. The finance translation obscures this: "No arbitrage" doesn't stop you from being wrong; it stops you from being inconsistent.
  *   **The "Bookie" Assumption:** In a quant shop, if you identify an arb, you execute it until liquidity dries up. In DBA, the existence of a "bookie" (an agent offering the counterparty trades) is hypothetical. The argument relies on the agent accepting bets from *anyone* at those prices. This assumes the agent behaves as if a liquid market exists inside their head.
  *   **Stake Size:** Financial arbitrage is scale-dependent (market impact, capital constraints). Classical DBAs assume you are willing to accept bets of arbitrary size based on your degrees of belief. If I assign 50% to Heads, am I willing to bet my life savings at even odds? Often, yes, in the abstract logic, but rarely in practice (risk aversion kicks in). Finance incorporates utility functions (indifference curves) directly. Pure DBA ignores risk aversion until it's smuggled back in via utility theory (Ramsey/Savage).

  #### 3. The Missing Counterparts (The Normative Void)
  This is the specific answer to your suspicion about "should."

  **The Normative Leap:**
  Finance says: "If you allow this arb, you will go bankrupt." This is **descriptive/pragmatic**.
  Epistemology says: "You *ought* to avoid this arb." This is **normative**.
  The finance translation provides the mechanism (arbitrage destroys wealth), but it leaves out the justification for why wealth destruction counts as a failure of *rationality* rather than just bad luck or ignorance.
  *   **Resolution:** In epistemology, the normativity comes from the link between belief and action. If your beliefs do not dictate a pricing rule, they fail to guide action effectively. The "normative" force is that without coherence, your beliefs cannot serve as inputs to a decision procedure that maximizes expected utility (Dutch Book arguments extended to the Ramsey-Savage framework).
  *   **What drops out:** The idea that coherence tracks **truth**. A trader can be profitable (no arbitrage) while holding false models (e.g., believing volatility smiles are normal). A rational believer should want their model to reflect reality. The DBA does not prove your beliefs are true, only that they shouldn't contradict themselves.

  #### 4. The Internal vs. External Distinction
  You asked: *"Is coherence just no-arbitrage for a single agent, or does the finance translation quietly drop the thing that made the Dutch book argument a theory of rationality?"*

  The thing dropped is **intersubjective verification**.
  *   **In Finance:** The "no-arbitrage" condition relies on market consensus. If you deviate from the market price, *someone else* arbitrages you. You are forced to coherence by external forces.
  *   **In DBA:** There is no market. You *are* the market. The "counterparty" is just another expression of your own volition.
  *   **Why it matters:** The philosophical punch of the Dutch Book is that you are **logically exploiting yourself**. It is a form of auto-bankruptcy. The finance translation makes it sound like an external risk manager catching a mistake. But the DBA posits that incoherence is an internal structural failure of the reasoning architecture, not just exposure to market noise.
  *   **The "Ought":** The "ought" in DBA is tied to the requirement of being a **decision-theoretic agent**. If you violate coherence, you cannot represent your preferences as maximizing expected utility under a single probability measure. The finance analog would be an investment policy that generates losses despite having a consistent hedging strategy—which simply means the strategy wasn't implemented. The DBA argues your *strategy itself* is malformed.

  ### Summary Recommendation
  Don't treat DBA as just "No Arb for one guy." Treat it as **"Consistency of the Pricing Kernel across all Contingent Claims."**

  The residue that remains after stripping the finance jargon is that **probability is the calculus of partial information consistency.**
  *   **Finance view:** Probability is a tool to ensure prices don't leak.
  *   **DBA view:** Probability is the grammar of logic applied to uncertainty.

  If you view your credences merely as a "pricing rule" (quant view), you miss that they are also assertions about how the world works. A coherent quant can be consistently wrong. A coherent philosopher aims to be inconsistently right. That distinction is where the "rationality" lives—the bridge between internal consistency and external truth-tracking is the place where the spreadsheet fails to capture the philosophy.
