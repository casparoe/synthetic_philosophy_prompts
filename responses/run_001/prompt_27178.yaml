      *   *Normative nuance:* Don't dismiss the "ought." Connect it to coherence conditions required for Bayesian updating. If you update incoherently, you become dynamically vulnerable.
      *   *Quant Jargon Check:* Ensure terms like "state-price density," "replicating portfolio," "super-hedging," "law of one price" are used correctly.

