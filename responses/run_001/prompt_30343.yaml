      *   *Intuition:* I should trust my future opinion as much as I trust my own, provided I believe I will still hold that opinion rationally.
      *   *Relation to Conditionalization:* If $E$ is the total evidence I gain between $t_0$ and $t_1$, then by standard conditionalization, $P_1(A) = P_0(A \mid E)$. If I am certain I *will* conditionalize perfectly on some future evidence $E$, does Reflection follow?
          *   Actually, Reflection implies that my expectation of my future credences equals my current credence *if* I believe my future self is an expert.
          *   It turns out Reflection is implied by Conditionalization *plus* a condition that my future credences will depend only on evidence available now (or rather, that I won't learn anything unexpected about my own reliability). Wait, actually, Reflection is generally stronger than Conditionalization in specific contexts, or distinct from it.
          *   *Crucial distinction:* Conditionalization is about *updating*. Reflection is about *anticipation*.
      *   *Status:* Van Fraassen presents it as a rationality constraint derived from a Dutch Book argument. However, many philosophers argue it is too strong.

  3.  **Address Question (1): Status of Reflection:**
      *   Is it a theorem? No, not derivable from probability axioms alone. Conditionalization doesn't force Reflection without extra assumptions (like "I will not forget" or "I will update correctly").
      *   Is it normative? Yes, van Fraassen argues it's a consistency requirement for diachronic planning.
      *   Is it pragmatic? The original motivation is a dynamic Dutch Book argument. If you violate Reflection, a clever bookie can arrange bets across time that guarantee a loss relative to your own plans.
      *   *Correction/Nuance:* Recent debates (Mahajan, Titelbaum, Christensen) show that the Dutch Book argument relies on assuming the agent *cannot* anticipate their own future irrationality while remaining rational now. This is tricky. I need to be precise here.
