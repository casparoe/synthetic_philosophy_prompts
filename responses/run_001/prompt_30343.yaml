          *   Formal fix: Distinguish between actual future credence and expected rational future credence. Or restrict the domain of Reflection to propositions where I expect no degradation.
          *   Better reply: Reflection fails if you anticipate violating Conditionalization. Since you know you'll be impaired, you don't plan to conditionalize normally. Therefore, Reflection doesn't bind.
      *   *Case B: Anticipated New Evidence (Learning).*
          *   This is often misunderstood. If I learn new evidence $E$, my future credence $P_1$ depends on $E$. My current credence $P_0(E)$ isn't 1.
