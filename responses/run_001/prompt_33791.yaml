      *   *Julia (Stalinesque):* Believes in neural integration timescales. Focused on computational necessity and the definition of "conscious". More functionalist/computational.
      *   *Tone:* Academic, polite but sharp, using British idioms ("rather," "whilst," "quite," "metaphysical," "empiricism").

  3.  **Drafting - Section by Section:**

