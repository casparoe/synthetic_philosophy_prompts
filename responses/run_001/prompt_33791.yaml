          *   *Correction on Attribution:* In standard literature (specifically Paul Churchland or discussions around Dennett):
              *   *Stalinesque:* Information is processed unconsciously, integrated, and *then* enters consciousness. The editing happens before it becomes conscious.
              *   *Orwellian:* It enters consciousness initially, and then the brain rewrites history/memory afterwards.
              *   *Prompt Requirement:* One defends Orwellian (Experience -> Edit), One defends Stalinesque (Process -> Consume Consciousness as Edited).
      *   **Agreed Facts:** Green spot -> Red spot (quick succession, different positions). Observer sees continuous motion with color change mid-way. Content seems fixed after Flash 2, but presented as happening before Flash 2.
      *   **Key Constraints:**
          *   Genuine engagement (not speeches).
          *   Orwellian must press on delay/function (why wait? what's consciousness for?).
          *   Stalinesque must press on evidence (unfalsifiable? hidden trace?).
          *   Address specific objections.
          *   Consider empirical decidability + propose concrete experiment.
          *   Each must concede a genuine difficulty.
          *   End without a winner.
          *   Coda: Single finding that would reduce confidence.
