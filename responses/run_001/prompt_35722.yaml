          *   Actually, the prompt says: "Don't think simulated lives count for less." So value is equal.
          *   So it must be about **Impact.** Does my action have causal leverage on the thing I value?
          *   If we are in a sim, can we actually change the long future? Only if the sim continues.
          *   Assumption: **"Temporal Resolution."**
          *   Does the simulation render detailed futures 1 million years hence?
          *   Okay, I will use the assumption: **"Whether Simulations are 'Deep' or 'Shallow' regarding Future History."**
          *   Wait, simpler: **"The Divergence Threshold."**
