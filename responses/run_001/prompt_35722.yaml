answer: |-
  Consider two colleagues, Alice and Bob, who discuss donating ten percent of their annual income; both fully endorse the Simulation Argument and assign an identical 90% credence that we inhabit a computer simulation, yet Bob pledges to fund deflection of a distant asteroid while Alice funds malaria eradication. Neither deems simulated lives less valuable than biological ones, nor do they differ in their optimism about humanity’s capacity for survival; instead, they disagree solely on the **Resource Allocation Assumption** regarding simulation management. Bob operates under the belief that simulators invest sufficient computational power to render full, continuous timelines extending to the heat death of the universe, ensuring that actions affecting the deep future remain causally potent even within the simulation. Alice, conversely, assumes simulators employ a **"Termination-of-Irrelevance" protocol**, where computation ceases or detail degrades once the timeline diverges significantly from base-reality history or offers diminishing epistemic returns, meaning the far future effectively does not exist inside a simulation. Consequently, Bob calculates that even if we are simulated, the asteroid threat requires intervention because the simulated future persists; Alice calculates that conditional on our being simulated, there is no long future to save, so the immediate certainty of malaria deaths outweighs the low-probability future of the few scenarios where the simulation runs deep. If you remove the Resource Allocation Assumption—forcing both to assume identical termination protocols—their donations converge immediately, revealing that their moral divergence rests entirely on the predicted runtime of the code rather than their valuations of suffering. However, Alice would argue this case is rigged because it treats the "deep simulation" hypothesis as a credible prior without evidence; she contends that since finite computational resources are the defining constraint of any simulation, Bob’s assumption arbitrarily privileges the long term merely because he desires it, effectively hiding a hidden moral wager about infinite compute behind a mathematical distribution.
