      *   **Characters:** Two people, both accept SA, assign *same* credence to being in a simulation.
      *   **Action:** One donates 10% income to deflecting an asteroid in 1 million years (far future). The other donates to malaria charity (current suffering).
      *   **Constraint 1:** Disagreement must stem from a *single assumption* about how simulators run simulations.
      *   **Constraint 2:** Cannot rely on "simulated lives count for less" (moral weight is equal).
      *   **Constraint 3:** Cannot rely on general doomsaying/pessimism about the future.
