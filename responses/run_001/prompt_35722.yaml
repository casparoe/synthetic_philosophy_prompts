      *   Constraint Check: Ordinary people, no contact, one paragraph.

  4.  **Drafting the Reasoning (Step-by-Step):**
      *   Define the assumption: **"Post-Purpose Termination."** (Simulators stop running the timeline once the scientific purpose is fulfilled or resource cost exceeds benefit).
      *   Alice (Malaria) assumes: Simulators don't waste compute on distant futures unlikely to return insights relative to the past. So, conditional on being in a sim, our long future is "off-screen."
