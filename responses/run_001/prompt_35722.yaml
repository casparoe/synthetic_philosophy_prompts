          *   *The Single Assumption:* **"Simulator Truncation Policy."** Do simulators stop rendering the far future once the immediate research goal is met?
          *   Yes. This fits.

  3.  **Drafting the Scenario (Paragraph 1):**
      *   Keep it ordinary. Alice and Bob, neighbors, same philosophy otherwise.
