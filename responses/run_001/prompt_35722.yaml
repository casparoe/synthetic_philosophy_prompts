          *   Simulators prune branches of the simulation that deviate too significantly from probable trajectories to save compute.
          *   OR: **"Epistemic Closure."**
          *   Let's go with **"Computational Budget Horizon."**
          *   Person 1 assumes simulators allocate enough compute to simulate the full long-term trajectory (like a universe expansion).
          *   Person 2 assumes simulators truncate the timeline because the data gets too noisy or computationally expensive to distinguish from noise later on.
          *   *Wait, simplest version:* **"Indeterminacy of the Simulator's Goal."**
          *   Assumption: Is the simulation designed to *endure* (be a stable environment for sentient beings) or to *solve a problem* (run until a question is answered)?
          *   Let's try: **"Intervention Sensitivity."**
