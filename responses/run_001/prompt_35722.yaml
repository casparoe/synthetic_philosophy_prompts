  Alice needs to argue that Bob's assumption is unwarranted. That's standard Bayesian updating. To make it feel "rigged," she needs to suggest his assumption artificially inflates the probability space in favor of his preference. She could argue that assuming high-compute infinite simulations privileges the Longtermist intuition over Occam's Razor.

