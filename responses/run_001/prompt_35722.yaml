          *   Actually, the cleanest split is: **Does the simulation include the far future?**
          *   If the simulation is an "ancestor simulation," it models the past leading up to now. Does it model the future?
          *   *Scenario:* Alice and Bob donate 10%. Both agree 50% chance we are in a sim.
          *   Alice (Malaria): Thinks if we are in a sim, the far future inside the sim is computationally truncated/pruned by the host because it yields diminishing returns. Therefore, longtermist interventions have zero expected impact *conditional on being simulated*. Since we might be simulated, longtermism loses massive expected value. Current suffering is definitely happening, so it dominates.
