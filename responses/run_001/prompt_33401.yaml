  ### Candidate Rules Consistent with Previous Judgments

  Based on the patterns above, I have formulated two plausible rules that fit all eight historical judgments but diverge on the upcoming case.

  #### Rule 1: The Functional Coupling Principle (Trust-Based)
  *   **Definition:** An external resource counts as part of the cognitive system if and only if it is **physically available** during the cognitive task and the user engages with it via **unreflective trust** (treating its output as equivalent to biological memory/perception).
  *   **Fit to Data:** Explains why Otto's notebook (Carried + Trusted) is YES, while the Home Diary (Not Carried) and Voice Assistant (Checked/Verified) are NO. It treats the material composition (notebook, phone, implant) as irrelevant to the verdict.
  *   **Prediction for Earpiece:** **YES.** The earpiece satisfies both criteria: it is worn "during all waking hours" (Available) and the user "automatically trusts everything" (Unreflective Trust).

  #### Rule 2: The Agentic Boundary Principle (Resource-Based)
  *   **Definition:** An external resource counts as part of the cognitive system if it meets the Functional requirements (Rule 1) *and* functions as a **passive tool or hardware component**. If the resource relies on the independent reasoning or judgment of another distinct agent (biological or AI) to determine the content, it is excluded.
  *   **Fit to Data:** Explains the distinction between the **Cochlear Implant (YES)**, which is a hardware transducer, and the **Voice Assistant (NO)**, which acts as a separate intellectual agent generating responses. It aligns with Case 1 (Notebook) because Otto generates the content; it aligns with Case 6 (Implant) because it is hardware. It excludes Cases 5 and 7 because those involve querying an external database or intelligence, even if the trust issue existed.
  *   **Prediction for Earpiece:** **NO.** Although trust and availability are present, the content is generated entirely by a "research assistant" (another human agent). This introduces a second mind into the cognitive loop, violating the boundary of individual cognition.

