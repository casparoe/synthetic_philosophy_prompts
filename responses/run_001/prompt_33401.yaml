  ### Analysis of the Training Data

  To arrive at this prediction, I analyzed the relationship between the physical properties of the resource and the professor's verdicts across the eight cases. The data suggests two primary variables influence her decision: **Constant Accessibility** (is it always on-hand?) and **Unreflective Trust** (is it used like a biological default?).

