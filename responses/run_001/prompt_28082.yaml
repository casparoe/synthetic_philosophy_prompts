answer: |-
  Achilles: Tortoise, logic is straightforward. If you accept premise A and premise B, you must accept conclusion Z.

  Tortoise: I agree that if A and B are true, Z is likely true.

  Achilles: Not likely—necessarily. The rule is: given A and (A implies B), you infer B.

  Tortoise: I understand that rule intellectually. But to actually perform the inference, I need the rule included in my set of beliefs.

  Achilles: You can’t include the rule as a belief! It’s the machinery that processes the beliefs!

  Tortoise: Precisely. Machinery is invisible and untrustworthy. I need a written document—a premise—stating that "Believing the rule causes inference." Then I will add it to my notebook.

  Achilles: Fine. [Writes] Premise C: If A, B, and (A implies B), then infer B.

  Tortoise: Excellent. I have accepted Premise C. However, now I face a new difficulty.

  Achilles: What difficulty?

  Tortoise: How do I move from A, B, and C to the conclusion?

  Achilles: Because C says to do it!

  Tortoise: C says it is true. But my notebook doesn't contain a rule on how to use a "True Statement" to trigger an action. So I must request Premise D: If one accepts a statement that commands an action, one performs that action.

  Achilles: Stop! There are no more statements!

  Tortoise: There are always statements, Achilles. Until I am satisfied that the statement matching my current reality has been filed, I will simply sit here. 

  Achilles: You'll sit here forever!

  Tortoise: Not necessarily. Only until I find a premise allowing me to leave the chair.

  Achilles: [Picks him up and carries him]

  Tortoise: Ah. I see you have introduced a new premise.

  Achilles: What premise?

  Tortoise: "If I am picked up, I am moved."

  Achilles: Exactly.

  Tortoise: Splendid. But notice the trouble: now I have a new fact, but the old logic still applies. To justify putting me down, we shall require a fresh chain of arguments starting from scratch.

  Achilles: Just put me down.

  Tortoise: And commit that act to memory?
