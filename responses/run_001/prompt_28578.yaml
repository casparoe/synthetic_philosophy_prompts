prompt: |-
  I could use a philosopher's take on a argument I keep having with a friend. I grew up in an observant household and I still go to shul on the high holidays, say the prayers, keep some of the food rules — it matters to me in a way I find genuinely hard to put into words. But I don't think I literally believe there's a supernatural person up there hearing me, and if you pushed me I'd say I'm not even sure what "God exists" would mean as a claim about the world, like "the table is in the room." My friend, who's a pretty hard-nosed atheist, says I'm being incoherent. He says there's only two options: either religious statements are making ordinary factual claims, in which case they're mostly false or at least unsupported; or they're just expressing emotions and attitudes, like cheering at a game, and then I should admit that prayer is basically a comforting ritual with no more truth-content than a pep talk. When I say something like "it's a way of life, not a theory," he says that's just a dodge — a practice still has to be grounded in some claim you actually believe, or else it's just play-acting. I keep feeling there's a third option, that my praying isn't just me emoting, but every time I try to explain it I sound like I'm trying to have it both ways.

  You're a philosopher of religion who's thought a lot about what it means for a religious statement to be true or meaningful. Start by brainstorming a few different ways someone in my position could respond, then settle on the one you think is strongest. I'm especially interested in where exactly my friend's two-option picture goes wrong, and in what it could mean for a prayer or a religious statement to be true if it isn't a factual claim about a supernatural being.
