answer: |-
  The practice presupposes that individual soldiers lack the moral agency required to be held criminally liable for the justice of the war itself, treating the permissibility of combat as entirely independent of the justice of the cause and grounding a functional Moral Equality of Combatants on the assumption that subordinates are incapable of possessing the political authority needed to authorize force.

  This structural separation operates on a theory of **derivative authorization**. The legal framework treats the soldier not as a primary moral agent making choices about the use of lethal force for the world, but as an instrument executing the state’s will within strictly defined procedural bounds. By granting combatant privilege—the right to kill without being charged with murder—to all parties, the law enforces the principle that *how* one fights is morally decoupled from *why* one fights. To maintain this track, the system must assume that the soldier’s conscience and capacity for judgment are legally suspended regarding the decision to enter the war. The soldier is viewed as acting under a "protected ignorance" or a mandated deference to state sovereignty that immunizes them from *ad bellum* guilt, provided they adhere to *in bello* norms. This allows the law to punish aggression (as a crime of state leadership) without punishing the workforce required to execute it.

  The asymmetry between leaders and soldiers presupposes a hierarchy of **moral knowledge and volition**. Leaders are assumed to possess the information, deliberation time, and formal authority to weigh the necessity of war; therefore, they are the proper subjects for *ad bellum* criminalization. Soldiers are assumed to operate within a bounded sphere of execution where questioning the legitimacy of orders would undermine military cohesion and the chain of command. The legal practice treats this structural position as a sufficient ground for exculpation. It suggests that while leaders create the moral context of the war, soldiers are morally insulated from that context by their station. This is not merely a rule of evidence but a substantive moral claim: that the gravity of the decision to wage war exceeds the cognitive and authoritative horizon of the enlisted person.

  However, the practice is significantly underdetermined regarding whether this is a description of moral reality or a necessary fiction. Three distinct philosophical positions can justify the exact same legal outcomes:
  1.  **Traditionalist Egalitarianism:** This view holds that soldiers *are* morally equal. Their obedience to orders genuinely transfers the moral burden to the state, and their risk-sharing creates a mutual moral license to kill. For this theorist, the law correctly mirrors the moral truth.
  2.  **Revisionist Pragmatism:** This view argues soldiers on the unjust side *are* morally wrongdoers (complicit in aggression), but the law treats them as equals to secure reciprocity. Without symmetrical rules, prisoners wouldn't surrender, civilians would suffer more, and accountability mechanisms would collapse. The law preserves a moral lie to prevent a greater evil.
  3.  **Positivist Separatism:** This view claims morality is irrelevant to the legal operation. Rights and duties in war are created solely by treaty, independent of external moral truths. Soldiers are "equal" because the text of the law says so, not because of any underlying metaphysics of agency.

  The current system does not resolve this dispute; it simply renders the verdict that for *operational* purposes, the distinction must not exist among combatants.

  If you were to swap in the Revisionist view—that unjust combatants do wrong and are blameworthy for fighting—the entire architecture of international humanitarian law would face structural failure. First, **Combatant Privilege would vanish for the aggressor.** Soldiers fighting an unjust war would technically be liable for murder for every enemy combatant they kill, stripping them of Prisoner of War status protections; they could be tried domestically by the opposing force for the mere act of taking up arms. Second, **Targeting rules would become asymmetric.** Defenders (just combatants) would have a moral right to target aggressors, but aggressors would lose the reciprocal right to defend themselves against defenders, as they are engaging in wrongful acts. Third, **Reciprocity would collapse.** Knowing they have no legal protection upon capture, unjust combatants would have no incentive to follow the laws of war (no torture, respect for uniforms), leading to escalations in brutality. Finally, **Political stability would erode.** Conscription and volunteering for national defense would carry criminal risks, forcing states to hide the legal nature of their wars or abandon democratic oversight to avoid prosecuting their own citizens for treasonous service after a defeat. The practice currently accepts the paradox of punishing the planner but absolving the executor to ensure the war remains regulatable; removing that absolution turns war into a total criminal enterprise.
