answer: |-
  Colleagues, let’s set aside the intuitive discomfort we feel when saying "nothing" did something. As long as we commit to a Lewisian counterfactual analysis, causation is defined strictly by dependence: event $c$ causes event $e$ if and only if, in the closest possible worlds where $c$ does not occur, $e$ does not occur. Once we accept that events can include negative existentials—absences or omissions—the logic is irrefutable.

  My thesis is this: Omissions are genuine causes because they satisfy the condition of counterfactual dependence, provided we evaluate the counterfactual in a world that minimizes deviation from actuality. The confusion arises only when we conflate the metaphysical criteria for causation with the pragmatic criteria for selecting which causes to mention in conversation.

  ### The Counterfactual Move: Fixing the Background
  The primary objection you raised concerns *which* background conditions to hold fixed. Critics argue that if we hold "everything else constant," we render the causal claim trivial. If we don't fix the past, we might imagine a miracle where the guard wakes up spontaneously.

  However, Lewisian semantics solves this through the "similarity metric." When we assess the counterfactual "If the guard had woken up, the derailment would not have occurred," we are looking for the closest possible world where the antecedent is true.
  1.  **Small Miracle:** We allow a small violation of law (a brain impulse occurring differently) to generate the waking.
  2.  **Macro-Fact Preservation:** We preserve the vast majority of the past (the track was broken, the signal failed) and the future trajectory of the train *prior* to the point of divergence.
  3.  **Result:** In that closest world, the guard wakes, sees the obstruction, halts the train. In the actual world, he sleeps, the train derails.

  The dependence is objective. It is not a product of arbitrary stipulation, but of the physics of the closest possible worlds. Holding the "background" fixed simply means preserving the lawful regularities that define the situation. If the background were fluid—if we allowed the track to repair itself instantly upon the guard waking—that would be a different counterfactual, violating the minimization of departures from actual fact. In the actual situation, the breaking of the track is a static fact; the guard's waking is the variable. Thus, the omission of waking is the critical difference-maker.

  ### Specific Cases

  **1. The Sleeping Guard and the Derailment**
  In the actual world: Guard sleeps -> Track obstruction undiscovered -> Train derails.
  Counterfactual World: Guard wakes -> Obstruction discovered -> Train stops.
  Critics argue the guard is merely an "uninvolved bystander." But in the counterfactual space, the guard's waking interrupts the causal chain of the derailment. His sleep is not a passive backdrop; it is the active removal of the *only* intervention capable of preventing the disaster given the broken signal. By failing to provide the necessary negative interference (stopping the train), his omission functions identically to the positive act of cutting the throttle in a hypothetical scenario. The effect hinges on his presence *as a potential inhibitor*, and his failure to inhibit is the difference.

  **2. The Withholding Doctor**
  This is often distinguished from killing by action, but the counterfactual profile is identical.
  Actual: Doctor has drug -> Omits to administer -> Patient dies.
  Counterfactual: Doctor has drug -> Administers -> Patient recovers.
  The "withholding" here is a continuous event-state. The doctor maintains the status quo of non-administration over time. Had this state been altered to administration, the effect (death) would cease.
  You might object that the disease killed the patient. But consider the counterfactual: If the doctor had administered, the disease would not have resulted in death (supposing the drug is effective). The patient's death depends on the combination of disease + non-administration. Without the omission, the disease is a *potential* killer, not an *actualized* one. Therefore, the omission shares causal responsibility equally with the physiological breakdown.

  **3. Double-Prevention**
  Consider a double-prevention structure to show how an omission can be a link in a longer chain.
  *   **Scenario:** A nuclear facility has a cooling loop. To prevent overheating, the Main Pump must run. However, the Main Pump has a safety lock that prevents it from starting if the Emergency Drain is open. The operator omits to close the Emergency Drain valve. Consequently, the safety lock remains engaged. The Main Pump cannot start. The facility overheats.
  *   **Analysis:** Here, the omission (not closing the drain) *prevents* the safety mechanism from disengaging. The safety mechanism was meant to *prevent* the pump failure.
  *   **Chain:** Omission of Closing Valve -> Engagement of Lock -> Failure of Pump Start -> Overheating.
  *   **Defense:** The omission here is a link because it physically sustains the state of affairs (open drain) that blocks the preventive mechanism. In the closest world where the operator closes the drain, the lock disengages, the pump starts, and overheating is prevented. The counterfactual dependence holds across the double-preventive gap. The omission caused the overheating because it enabled a blocking condition that the system was designed to overcome.

  ### Preemption and Redundancy
  Regarding preemption: Suppose two guards are assigned to the same watch. Both sleep. The train derails. Does Guard 1’s sleep cause it if Guard 2 could have done the job?
  Strict counterfactualism faces trouble here (if Guard 1 wakes, Guard 2 is still asleep, derailment occurs; thus Guard 1’s sleep isn't dependent). However, in our standard cases (sleeping guard, withholding doctor), we assume a single locus of control.
  Where multiple agents exist, Lewis argues we should look at **influence**. Did Guard 1's specific behavior influence the outcome? Yes. If Guard 1 had acted alone, the outcome might differ. Furthermore, Lewis allows us to treat the "system" (both guards) as the causal unit. If the system failed, and each member failed, each failure is part of the sufficient set for the effect. But in the specific scenarios you asked me to defend (singular guard/doctor), preemption is not operative, and the dependence is direct and robust.

  ### The Problem of "Too Many Omissions"
  The strongest criticism is that if an omission counts, then almost everything causes everything. Did I cause the moon to orbit the sun by not pushing it? Did the President cause a famine in Asia by not intervening?
  We must distinguish between *ontology* and *selection*.
  **Ontologically**, yes, in a strict sense, your not pushing the moon is a difference-maker. If you had pushed, gravity might have changed minutely.
  **Pragmatically**, we filter causes based on norms of normalcy and intervention. The background conditions (like gravity, the distance to the moon) are held fixed not because they aren't causes, but because they are *non-contrastive* in the context of the question. The counterfactual theory describes the web of dependence. It does not dictate which node we label "the cause" in a conversation.
  The theory does not become useless because the set of causes is large; it becomes precise. It explains *why* we say the driver's speeding caused the crash (speeding is a variable normatively expected to vary) rather than citing the Earth's rotation (rotation is invariant in the context of local traffic). The "explosion" of omissions is a feature, not a bug: it reveals the density of the causal web, allowing us to identify exactly which missing factors mattered.

  ### Conclusion
  To deny causation to omissions is to arbitrarily restrict the domain of existence to positive events. But if causation is difference-making, and an omission makes a difference in the closest possible worlds, it is a cause. We do not need to posit mysterious "negative entities"; we need only acknowledge that absences function logically as variables within the system of laws. The failure to hold a background condition fixed is not a flaw in the theory but a misunderstanding of how similarity metrics work in counterfactual evaluation.

  ### The Vulnerable Point
  However, for your seminar paper, I advise you to target the **"Background Condition Fixing"** constraint. My argument relies on the premise that holding the "track broken" condition fixed while varying the "guard awake" condition is non-arbitrary. If you can demonstrate that *any* description of a situation involves infinite relevant background conditions, and there is no principled way to decide which ones to hold fixed without smuggling in the very causal judgment you're trying to prove, then the counterfactual dependence becomes a mirror reflecting our interests rather than a map of reality.
