prompt: |-
  I'm a senior in an honors philosophy seminar, and we've been spending a unit on the metaphysics of causation, and I've gotten genuinely stuck on causation by omission. I was going over it with a couple of my classmates and we keep talking past each other, so I'd like you to take one side cleanly and argue it as strongly as you can, so I have something concrete to push back against. Please argue that omissions can be genuine causes on a counterfactual (Lewisian) account of causation, and that the usual counterexamples do not defeat the account. In particular, defend the move of evaluating the relevant counterfactual — "had the agent performed the action, the bad outcome would not have happened" — while holding the background conditions fixed, and explain why the deep puzzle in these cases is not a flaw in the counterfactual theory but a confusion between the cause and the mere absence of a would-be cause.

  I want the argument to be specific rather than general, so please work through the sleeping guard who fails to wake and so fails to prevent the derailment, the doctor who withholds a life-saving drug, and at least one double-prevention case in which the omission is itself a link in a longer causal chain, and say how your position handles preemption. I also want you to confront the worry that, once you allow a single unperformed action to count as a cause, almost every outcome comes to be caused by a huge number of omissions, and that this makes the notion of cause far too easy to apply. Close by flagging, in a sentence or two, the single most vulnerable point in the case you've just made, so I know where to aim my objections.
