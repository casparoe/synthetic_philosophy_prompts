      *   *Epistemic Access:* A bartender sees physical cues (stumbling, slurred speech). An AI sees text tokens, which can mimic rationality even when intent is flawed.
      *   *Remediation:* A bartender calls a cab. An AI refuses but what's the next step? It can't physically intervene.
      *   *Neutrality:* Bartenders sell alcohol (the risk). They are incentivized by sales but regulated to stop excess. AI is often marketed as helpful/truthful, not necessarily selling a harmful product, but generating the harmful *content* itself.
      *   *Legal/Ethical Duty:* Bartenders have dram shop liability. AI developers have terms of service, but not necessarily a duty of care in the same tort sense yet.

  4.  **Drafting - Section by Section (Mental Outline):**
