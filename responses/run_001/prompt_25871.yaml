  # Desiderata for an Adequate Account of Moorean Absurdity

  To serve as a viable specification for a seminar paper, any theory of Moore’s paradox must satisfy the following criteria. These desiderata delineate the boundaries of the phenomenon and constrain potential explanatory strategies.

  ### 1. Dual-Form Coverage (Omissive and Commissive)
  *   **Requirement:** The account must explain the absurdity of both the **omissive form** ("$p$, but I don’t believe that $p$") and the **commissive form** ("$p$, but I believe that not-$p$").
  *   **Rationale:** Both forms strike speakers as fundamentally irrational, yet they implicate different structural relationships between fact and attitude (lack of belief vs. belief in negation). A theory that explains the omissive form as a lack of self-knowledge may fail to capture the active conflict in the commissive form, and vice versa.
  *   **Status:** **Non-negotiable.** Any account that privileges one form risks ignoring half of the empirical data surrounding the paradox.

  ### 2. First-Person Present-Tense Indexicality
  *   **Requirement:** The account must explain why the absurdity is restricted to the **first-person present-tense** ("I believe," "now"). Utterances such as "He believes it is raining, but it is raining" (third-person) or "It was raining, but I didn't believe it" (past-tense) lack the same visceral absurdity.
  *   **Rationale:** The paradox disappears when the subject or time shifts, implying that the conflict is not merely between the propositions (fact and belief), but involves the speaker's immediate epistemic relation to the fact. The theory must rely on the unique access the first-person has to their own current states.
  *   **Status:** **Non-negotiable.** Ignoring this restriction renders the explanation too broad (applying to simple contradictions) or too narrow (failing to explain why third-person statements are permissible).

  ### 3. Preservation of Propositional Consistency
  *   **Requirement:** The account must maintain that the Moorean sentence is **logically consistent** and capable of being **true**.
  *   **Rationale:** There is no formal contradiction in the conjunction of an empirical fact and a negative doxastic attitude (e.g., it is possible that it is raining, but I am unaware of it). If a theory declares the sentence a contradiction (formal or otherwise), it misidentifies the source of the absurdity, confusing logical validity with rational intelligibility.
  *   **Status:** **Non-negotiable.** While some formal approaches (like certain doxastic logics) treat it as a doxastic contradiction, they must distinguish this clearly from semantic contradiction to avoid trivializing the paradox.

  ### 4. Converse Asymmetry
  *   **Requirement:** The account must distinguish Moorean absurdity from the statement **"I believe that $p$, but not-$p$."** The latter is assertible (though potentially false), whereas the former is absurd.
  *   **Rationale:** In "I believe $p$, but not-$p$," the speaker acknowledges their mistake; in "It is raining, but I don't believe it," the speaker creates a disconnect between their reality-testing faculty and their expressed worldview. The theory must explain why the direction of the inference (from fact to belief, or belief to fact) generates different normative pressures.
  *   **Status:** **Non-negotiable.** Failure to distinguish these cases suggests a failure to grasp the specific role of self-attribution in the paradox.

  ### 5. Locus of the Defect (Belief vs. Assertion)
  *   **Requirement:** The account must specify whether the absurdity resides in the **private mental state** (believing the conjunction), the **public speech act** (asserting the conjunction), or **both**.
  *   **Rationale:** Wittgenstein noted that Moorean sentences are absurd to *say*, but perhaps less obviously absurd to *believe* (unless the belief is conscious). A comprehensive theory must address whether the absurdity is intrinsic to the state of mind or derivative of communicative norms.
  *   **Status:** **Theoretical Priority.** While all theories must address this, resolving the tension between assertion-based and belief-based norms is the primary site of disagreement among competing camps.

  ***

  ### The Critical Filter: The Absurdity of Private Belief

  The single desideratum that does the most work to exclude the leading accounts is the **requirement to account for the absurdity of the private belief state independently of the act of assertion.** This constraint demands that the absurdity persists even in silent thought, forcing the theory to locate a deep irrationality within the structure of belief itself rather than merely at the interface of speech. 

  This requirement immediately excludes the **Gricean implicature story**, which grounds the absurdity entirely in conversational maxims (specifically, the maxim of Quality); for a Gricean, thinking a Moorean sentence is harmless because no communicative rule is violated. It places severe pressure on the **Knowledge-Norm-of-Assertion view** (associated with Williamson); while Williamson can extend his argument to belief via anti-luminosity, his primary machinery targets the norm of *assertion*, requiring significant theoretical stretching to explain why the *mental* state is defective absent the performative act. Finally, it challenges the **Hintikka-style doxastic-logic approach**, which successfully models the belief-state absurdity but relies on controversial axioms (such as the transparency of belief, $Bp \to BBp$) that many find psychologically implausible to preserve logical consistency. Consequently, an adequate paper must navigate this specific boundary: it cannot treat Moore's paradox solely as a linguistic glitch, nor solely as a formal logical error, but must locate the defect at the intersection of the agent's transparent access to their own mind and their assessment of the world.
