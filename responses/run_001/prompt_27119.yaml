      *   *Actionable Advice:* Since the scientific consensus isn't 100% settled on the *mechanism*, the procedure must treat the *effect* as a risk without making unverifiable metaphysical claims. It needs to focus on *mitigating bias* rather than "fixing perception."
      *   *Caution:* I cannot validate CP as absolute fact. I must flag where the procedure assumes CP holds true vs. where it relies on standard memory hygiene.

  3.  **Drafting the Procedure (The "Cognitive Hygiene Protocol"):**
