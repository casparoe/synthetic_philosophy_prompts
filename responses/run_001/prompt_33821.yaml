  3.  **Analyzing the Logical Differences:**
      *   *Bivalence:* Epistemicism says every proposition has a truth value (even if unknown). Supervaluationism says borderline propositions are neither true nor false (indeterminate).
      *   *Disjunction:* In Supervaluationism, $\phi \lor \psi$ can be true even if neither $\phi$ nor $\psi$ is (if one is true in some precisification, the other in another... wait, no). Supertruth requires truth in *all*. So $\phi \lor \neg \phi$ is supertrue. But $P(a) \lor P(b)$ where $a$ is clearly bald and $b$ is clearly hairy? No, let's look at the Sorites.
