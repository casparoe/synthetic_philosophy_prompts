  **MEMORANDUM TO THE UNIVERSITY AI GOVERNANCE COMMITTEE**

  **TO:** Committee Members  
  **FROM:** [Your Name], Student Representative & Ethics Working Group  
  **DATE:** October 24, 2023  
  **SUBJECT:** Recommendation for Well-Being Bot Pilot Protocols  

  **Executive Recommendation**
  I recommend adopting **Option B (Consent-Based Escalation)** for the Phase 1 pilot, with a specific protocol amendment regarding the definition of "imminent harm." We should reject Option A (Automatic Notification) pending further longitudinal data. 

  This approach must be finalized by **October 31st**, allowing for a one-week security and privacy review before the November launch.

  **Why the "Hyperparameter" Argument Fails**
  To the Engineering colleagues advocating for Option A: dismissing the alert threshold as merely a hyperparameter optimizes the wrong variable. In machine learning, hyperparameters optimize predictive accuracy (minimizing loss). In well-being contexts, the "loss function" includes student trust and autonomy. 

  When the committee sets a sensitivity threshold that triggers an involuntary report, they are making a normative policy decision about risk tolerance, disguised as technical tuning. If we treat this strictly as engineering, we absolve ourselves of the responsibility for false positives. A low threshold maximizes safety on paper, but it generates "noise"—flags for normal academic stress, grief, or venting. Automating reports on false positives treats students as administrative risks rather than partners in their own care. We cannot tune a model to minimize harm if the model's existence incentivizes users to hide their symptoms from it.

  **The Case Against Option A (Operational Efficacy)**
  The strongest argument for Option A is the Precautionary Principle: *if there is a chance of severe harm, we must intervene regardless of cost.* 

  However, this ignores the feedback loop between policy and behavior. The effectiveness of this bot depends entirely on candid disclosure. If the community perceives the tool as a surveillance pipeline, usage will shift toward performative, sanitized responses ("safe-speak"). 
  1.  **Data Integrity Risk:** Students will withhold indicators of crisis to avoid involuntary contact, making the "crisis score" less reliable over time.
  2.  **Harm by Mistrust:** Forced intervention without prior relationship-building often triggers resistance or disengagement from future help-seeking. 
  3.  **Liability Exposure:** Automated flags create a record of "identified risk." If the bot flags a student who then harms themselves despite no automatic ping having occurred (because they didn't cross the arbitrary line), the university faces greater scrutiny for having created a flawed early-warning system than it would under a standard opt-in counseling model.

  **Refining Option B to Meet Safety Concerns**
  Option B protects autonomy, but the current wording leaves a gap: "unambiguous self-harm." AI language models struggle with ambiguity. To satisfy the safety concerns raised by Option A proponents, we must institutionalize a **Tiered Escalation Protocol**:

  1.  **Standard Distress:** Any flagged conversation remains local to the session. The bot offers resources (counseling hotlines, app links). 
  2.  **"Imminent Risk" Trigger:** If the model detects specific markers (e.g., a concrete plan, timeframe, or access to means), the chat interface changes state. The bot does *not* ping a counselor silently. Instead, it prompts the student: *"This sounds very serious. I am mandated to connect you with professional support right now. Would you like to stay on this line with me until they join, or should we end the call?"*
      *   **If they agree:** Counselor joins immediately (Human-in-the-Loop).
      *   **If they object/end:** The session logs terminate. We rely on our existing emergency response protocols (e.g., Title IX, Campus Police) for active threats found through other channels, acknowledging the limitations of AI detection.

  This preserves the student's agency (the core tenet of Option B) while ensuring we meet our Duty to Warn obligations *before* breaking confidentiality, rather than retroactively.

  **Timeline for Implementation**
  1.  **By Oct 31:** Governance Committee ratifies Option B + Tiered Escalation Protocol. 
  2.  **Nov 1–7:** Legal & Security teams update Terms of Service and Privacy Policy to reflect the "Tiered" exception (students must know exactly when the bot breaks confidentiality). 
  3.  **Nov 8:** Pilot Launch. 
  4.  **Dec 15:** Interim Review. We will analyze "opt-out rates" and "report accuracy" to determine if the threshold needs adjustment for Spring Term.

  **Conclusion**
  We cannot engineer trust into a system once it has been broken. By choosing consent as the default, we prioritize the integrity of the data and the relationship between the university and its students. Option B ensures that if the bot saves a life, it does so through a bridge built by the student, not a trap set by the administration.
