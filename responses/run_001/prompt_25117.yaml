answer: |-
  **MEMORANDUM**

  **TO:** Dean [Name], College of Arts and Sciences
  **FROM:** Research Integrity Committee (RIC)
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Preregistration Policy for Psychology and Neuroscience

  Over the past three years, the RIC has investigated five labs for questionable research practices, including running underpowered studies and filing null results as "pilot data." In every case, Principal Investigators offered a consistent defense: individual incentives punish rigor. They argued that while adherence to best practices benefits the discipline, it slows publication and jeopardizes funding for compliant labs. Essentially, the field faces a prisoner’s dilemma where no single unit can unilaterally adopt stricter standards without suffering competitively. Our voluntary preregistration badge system has failed to shift these dynamics.

  **Recommendation**
  The RIC recommends adopting a **department-wide mandate requiring preregistration for all confirmatory studies**, paired with explicit exemptions for exploratory, computational, and qualitative work.

  **Rationale: Breaking the Coordination Trap**
  The PIs’ diagnosis of the incentive structure is accurate. When career advancement rewards quantity and positive significance over truth, quality becomes a private cost paid for public gain. Voluntary nudges fail because they allow free-riding; compliant researchers bear the costs while non-compliant ones reap the rewards. A binding mandate functions as a necessary coordination mechanism. It ensures that all laboratories compete on equal footing, removing the penalty associated with rigor. Without this leveling, individual actors are rationally incentivized to bypass standards, guaranteeing collective reputational damage.

  **Addressing Methodological Concerns**
  A primary objection to mandates is that the administration is dictating scientific method, potentially stifling exploratory or complex modeling work unsuited to rigid analysis plans. We take this concern seriously. A blanket mandate would indeed be counterproductive.

  Our recommendation avoids this by distinguishing *intent*. Pre-registration is required only for *confirmatory* hypothesis testing where the goal is falsification. Exploratory analyses remain fully permitted and encouraged, provided they are clearly labeled as exploratory in publications and distinct from confirmatory claims. This protects methodological freedom while preventing the misrepresentation of data fishing as hypothesis testing. Furthermore, deviating from a preregistered plan is permitted only if explicitly flagged and explained in the final manuscript, allowing for adaptation without obscuring HARKing (Hypothesizing After Results are Known).

  **Implementation Steps**
  1.  **Policy:** Effective next term, all confirmatory grant submissions and dissertations must include a publicly timestamped analysis plan.
  2.  **Transparency:** Publications deriving from these studies must report adherence or explain deviations.
  3.  **Incentives:** Tenure guidelines will be revised to explicitly value preregistered null results, addressing the root cause of the incentive trap cited by PIs.

  We request your authorization to formalize this policy. By enforcing rigor on confirmatory claims while preserving flexibility for exploration, we uphold integrity without stifling innovation.
