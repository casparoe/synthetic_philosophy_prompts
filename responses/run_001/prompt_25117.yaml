      **Subject:** Recommendation on Research Preregistration Policy

      **To:** Dean [Name]
      **From:** Research Integrity Committee
      **Date:** October 26, 2023

      Over the past three years, the RIC has investigated five psychology and neuroscience labs for questionable research practices (QRPs), including underpowered studies and selective reporting. In every instance, Principal Investigators (PIs) defended these practices using a structural argument: while rigorous methods benefit the field, they individually penalize researchers through slower publication rates and lost funding. They describe a prisoner’s dilemma where no single lab can unilaterally adopt stricter standards without sacrificing career capital. The current voluntary preregistration badge system has failed to alter these incentives.

      We recommend the Department adopt a **mandated preregistration policy for all confirmatory studies**, coupled with explicit protections for exploratory research.

      **Rationale**
      The voluntary system is insufficient because it cannot overcome the coordination failure described by our faculty. As long as publishing speed confers competitive advantage, adherence remains optional for ambitious PIs. Only a binding mechanism equalizes the playing field, ensuring that rigor does not become a liability.

      **Addressing Objections**
      Critics argue that mandating preregistration constitutes administrative overreach into scientific method and stifles innovation, particularly in computational, qualitative, and exploratory work. The RIC agrees that preregistration is ill-suited for generation-heavy inquiry. Therefore, this mandate applies strictly to *confirmatory* hypothesis-testing. Studies designed for exploration remain exempt but must be explicitly labeled as such in publications to prevent them from being re-cast as confirmatory results post-hoc. This respects methodological pluralism while safeguarding the integrity of causal claims.

      **Implementation**
      1. All grant applications and dissertation proposals involving confirmatory hypotheses must include a publicly timestamped analysis plan.
      2. Deviations from the plan in resulting publications must be flagged and justified in the text.
      3. Departmental tenure guidelines will be updated to ensure null results from preregistered studies carry weight comparable to significant findings, mitigating the "publish or perish" pressure cited by PIs.

      This approach acknowledges the faculty’s concerns about autonomy while recognizing that individual incentives currently undermine collective trust. By codifying expectations for confirmatory work and protecting exploratory freedom, we break the cycle of self-defeating competition. We request your approval to implement this policy effective next academic year.

