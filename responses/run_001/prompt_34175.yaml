      *   *Nuance:* Philosophers say $P(E)=1$. Statisticians usually say $P(data)=1$ once observed, but $P(data|\theta) < 1$. The conflict is: If $E$ is known, the integral $\int P(E|\theta)P(\theta)d\theta$ should be 1, making the normalization constant 1. Wait, no. If $E$ is observed, the likelihood is evaluated at $E$. If $P(E)=1$ means $E$ is certain *ex ante*, then $P(E|M)$ cannot be small, so BF cannot be high.
