  Based on the consistency of your friend’s judgments, I would predict he classifies the hiking rescue as **supererogatory**.

  Here is the breakdown of the implicit rule he is using, the alternative rule that also fits his track record, and a specific case that would distinguish between them.

  ### 1. The Rule Your Friend Seems to Run: "The Significant Sacrifice Threshold"
  Your friend appears to operate on a principle that distinguishes between **inconvenience/trivial cost** and **significant personal sacrifice**.

  Under this rule, an act is morally **obligatory** only if the cost to the agent remains within the bounds of "reasonable inconvenience." Once the personal cost crosses a specific threshold—defined by bodily integrity, significant physical risk, or substantial forfeiture of resources—the act becomes **supererogatory** (good to do, but not required).

  *   **Evidence for this rule:**
      *   **Property vs. Organ:** Ruining a suit (financial loss) is *obligatory*. Donating a kidney (permanent bodily sacrifice) is *supererogatory*. This suggests the type of cost matters: money is "cheaper" than a body part.
      *   **Effort vs. Time:** Calling 911 (seconds) is *obligatory*. Volunteering for a year (years) is *supererogatory*.
      *   **Low Risk vs. High Risk:** The subway pull is *obligatory* (implied minimal risk). The kidney donation is *supererogatory* (medical procedure with recovery).
      *   **Malaria:** Donating $10,000 is *supererogatory*, while ruining a suit is *obligatory*. This implies there is a monetary threshold, or perhaps that giving up a major "asset" (inheritance) is different from paying a "penalty" (suit).

  **Why the Hike fits:**
  The hiking case combines three factors that have previously triggered "supererogatory" verdicts in his system:
  1.  **Bodily Risk:** Unlike the subway or pond, this involves a "real risk of injuring yourself." This aligns closer to the kidney donation (physical integrity) than the pond jump (property damage).
  2.  **Exhaustion:** Several hours of "exhausting physical labor" exceeds the effort of a 911 call or a subway pull.
  3.  **Opportunity Cost:** It replaces a period of rest or work (similar to the vacation/building homes cases).

  Because the physical risk and effort exceed the "trivial" line drawn by the knee-jump or phone-call examples, he would almost certainly categorize this as heroically good, but not strictly required.

  ### 2. The Alternative Rule: "The Proximity and Immediacy Imperative"
  A different set of principles could explain all your friend's past answers equally well, leading to a different conclusion on the hike.

  This rule posits that obligations are tied to **who** is in danger and **when**.
  *   **Obligatory:** When a specific, identifiable person faces immediate death *right now* in front of you.
  *   **Supererogatory:** When helping involves distant strangers, abstract groups, or future planning.

  *   **Evidence for this rule:**
      *   The drowning child, the subway rider, the car crash victim, and the hiker (if we classify them as "here/now") are all specific individuals facing imminent death. These should logically be obligatory.
      *   The kidney donation to a stranger, malaria prevention, and soup volunteering all involve either scheduling (future), statistics (distant strangers), or lack of urgency (general charity).
      *   *Note:* Even the kidney case fits if we view it as "scheduled medical intervention" rather than "emergency intervention," whereas the pond and subway are "emergencies."

  **How this rule treats the Hike:**
  Under the Proximity Imperative, this case is cut-and-dried. A stranger is dying *now*, in your presence, and you are the only one who can help. There is no distance and no delay. Despite the cost, the imperative of immediate rescue typically overrides cost considerations in this framework (provided the risk isn't lethal to the rescuer). This rule would predict the hike is **obligatory**.

  ### 3. The Decisive Case
  To determine which rule your friend is truly committed to, you need a case that separates **Physical/Bodily Cost** from **Immediacy/Specificity**. The hiking case blends them: it is immediate *and* physically costly.

  You should ask him about:

  > **"The Wheelchair Hike"**
  > You are hiking alone on the same remote trail. You come across the same stranger with a broken leg. However, you happen to have a specialized, lightweight transport sledge in your pack. Carrying the stranger down takes exactly the same amount of time (three hours), but because of the equipment, there is **zero risk of injury** to you, and it requires no physical exertion beyond walking. It is simply tedious.

  **If your friend says "Obligatory":**
  He is committed to the **Proximity/Immediacy Rule**. The physical sacrifice of the first hike was irrelevant; the deciding factor was the urgent nature of the life-threat. The "tedium" of three hours was acceptable because the victim is right there.

  **If your friend says "Supererogatory":**
  He is committed to the **Significant Sacrifice Threshold**. For him, spending several hours of your life on a strenuous task—even without physical risk—crosses the line of "reasonable inconvenience." The Kidney/Soup/Vacation precedents weigh more heavily here than the Subway/Pond precedents. The time commitment alone (mirroring the Soup Kitchen) tips the scale to supererogation.

  Given his firm distinction between the $10,000 donation (Supererogatory) and the ruined suit (Obligatory), I suspect he views "time and major effort" as a form of capital that he is not obligated to give away freely. Therefore, my strong prediction is that even in the **Wheelchair Hike**, he would label it **Supererogatory**. The sheer duration of the burden (hours vs. minutes) is the hidden deal-breaker in his system.
