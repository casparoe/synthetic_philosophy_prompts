  Right, so picture the scene. It’s Tuesday evening, week three of the conference, and we’ve all consumed enough Scottish ale to dissolve the distinction between a proposition and a memory of one. 

  I’m leaning against the sticky bar with Dave, who spends his weekends writing grant proposals for ‘Quantitative Epistemology’ and hates his neighbour for living upstairs. Dave’s staring intently at his pint, swirling the foam like he’s trying to measure the prior probability of yeast fermentation.

  He looks up, dead serious, and whispers, “I’ve solved it.”

  “Solved what? The funding crisis?”

  “No. The Raven Paradox. I’ve worked out the most efficient way to gather evidence that all ravens are black.”

  I take a sip of my lager. “Is this going to involve a microscope and some tweezers?”

  “Nothing so primitive,” Dave says. “It’s about resource allocation. Think about it logically. For every single raven you hunt down in a forest, spending hours tracking mud splashes and feathers, you get one piece of confirming evidence. One data point. High cost, high reward.”

  “Okay…”

  “But consider the alternatives,” he continues, eyes gleaming in the dim light. “The universe is absolutely swimming with things that aren’t black, and things that aren’t ravens. Take a crisp bag. Or this napkin. Or Dave’s left trainer. Every time I observe a white shoe, I am generating a fresh, unique instance of a non-black non-raven.”

  “Dave, you’re saying we should verify ornithology by cataloguing our footwear?”

  “Precisely! The Equivalence Condition dictates that it’s the same confirmation power as spotting the actual bird. Except I can observe a thousand pairs of trainers in an hour. A thousand data points versus one. It’s pure Bayesian efficiency.”

  I rub my temples. “So you’re basically saying you’d rather stare at a pile of Asda shopping bags than go look for a bird in the garden?”

  “Ideally,” Dave nods. “But here’s the kicker. The protocol requires strict adherence to the negation clause. You can only count the things that are definitively *not* black.”

  “Right…”

  “So I can’t wear black shoes,” Dave says, gesturing vaguely at his feet. “They’re too ambiguous. A black shoe could be a black raven. I can’t risk falsification in the middle of data collection. It throws off the whole likelihood ratio.”

  He taps his glass for emphasis. “So I’ve switched to fluorescent trainers, mate. Yellow, neon green, hot pink. Anything that screams ‘non-raven’ at a molecular level. I’m walking around Edinburgh like a rave dancer, collecting evidence for universal avian melanism. And honestly? I feel closer to truth than I did when I read Popper.”

  I look at his neon yellow laces. 

  “Did you check if the trainers are actually ravens?”

  “Nah,” he says, taking a long pull of his pint. “Too expensive to test the DNA. But I know they’re non-black. Which means they’re non-ravens. Which means the hypothesis stands. Now, pass me another pint. It’s grey. Could be a non-black beverage, assuming pints aren’t ravens.”

  I paid for the drinks. Couldn’t risk the equivalence condition on him buying.
