prompt: |-
  hi so i'm in student gov and we got assigned to evaluate this proposal where the school installs solar panels — costs a ton upfront (like, from our reserve fund) but saves money on electricity over ~20 years and cuts emissions. the administration told us to use "intergenerational justice" as our framework but honestly none of us know what that means as an actual thing you do, as opposed to just a vibe.

  can you turn intergenerational justice into like a decision procedure or checklist we can actually run? we have 30-minute meetings and we're not philosophers. i need: what questions to ask and in what order, what counts as a good enough answer, where the procedure says yes this is fair to future students, where it says no, and where it has to punt to a judgment call because it's values not facts.

  things it needs to handle: discounting (should we care less about students 30 years from now just cause they're far away in time?), uncertainty (we don't know future energy prices or what the climate will actually be like), and the fact that future students don't get a vote in student gov which feels kinda unfair but also unavoidable.

  then run the procedure on two cases: (1) the solar panel thing, and (2) a proposal to cut the arts budget to build a STEM lab — current students really want the lab, but it means future students lose the arts program permanently. i want to see where the procedure gives an answer i might not like.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**
      *   **User:** Student government member.
      *   **Task:** Create an actionable decision procedure/checklist based on "Intergenerational Justice" (IGJ) for evaluating school proposals.
      *   **Constraints:** 30-minute meetings, non-philosophers, practical application.
      *   **Requirements:** Specific questions, order of operations, criteria for "yes/no/punt," handling discounting, uncertainty, and lack of voting power for future generations.
      *   **Cases to Run:** (1) Solar panels (high upfront cost, long-term savings/benefit), (2) Arts budget cut for STEM lab (immediate benefit vs. permanent loss of arts).
      *   **Goal:** The procedure needs to be usable in real-time and potentially give uncomfortable answers.

  2.  **Understand "Intergenerational Justice" (IGJ):**
      *   *Core Concept:* Do not deplete resources or impose burdens on future people that they cannot bear, nor deny them benefits essential for their well-being that current people can preserve. It's about fairness across time.
      *   *Key Tensions:* Current needs vs. Future needs. Consumption vs. Investment. Certainty vs. Risk.
      *   *Philosophical Grounding (simplified):* Rawls (Justice as Fairness - Veil of Ignorance extended over time), Parfit (Non-Identity Problem - though maybe too complex), Sustainability (Brundtland Report).
      *   *Translation to School Context:* Don't leave debt/problems for seniors/future grads. Don't burn bridges for today's convenience.

  3.  **Develop the Decision Procedure (The "IGJ Checklist"):**
      *   *Structure:* Needs to be linear but allow for loops if data is missing.
      *   *Step 1: Define the Trade-off.* Who pays now? Who benefits later?
      *   *Step 2: Assess Irreversibility.* Can this be undone? (Crucial for IGJ).
      *   *Step 3: Discounting Check.* How much do we devalue the future? (Economic vs. Ethical).
      *   *Step 4: Risk/Uncertainty.* What if we're wrong? Precautionary Principle.
      *   *Step 5: Procedural Fairness.* Acknowledging future voices aren't heard.
      *   *Outcome:* Pass / Fail / Conditional (with safeguards).

  4.  **Drafting the Questions & Criteria:**
      *   *Question 1 (Burden Sharing):* Does the cost fall entirely on one generation? If yes, that's suspicious.
      *   *Question 2 (Reversibility):* If the gamble fails, can we fix it? If irreversible harm is done to future options -> No.
      *   *Question 3 (Time Value/Ethics):* Are we using a standard economic discount rate (which kills far-future benefits) or an ethical one? Need to adjust for the "long term."
      *   *Question 4 (Veto Points):* Is there enough left for future students to function/equity-wise?
      *   *Punt Zone:* Where facts run out (e.g., specific value of an art class vs. a lab). This is where values decide.

  5.  **Refining for "Student Gov Reality":**
      *   Keep it under 30 mins. Limit the questions to 5 core ones.
      *   Use clear traffic light system (Red/Yellow/Green).
      *   Avoid jargon like "non-identity problem." Use "Can we change our minds later?" instead.

  6.  **Running Case 1: Solar Panels:**
      *   *Cost:* Reserve fund (current students' money/tuition).
      *   *Benefit:* Lower bills + emissions (future students).
      *   *Analysis:* High upfront burden, huge future gain. Irreversible infrastructure? Yes, but beneficial irreversibility.
      *   *Discounting:* 20 years is borderline. Standard econ might say no (NPV negative at high rates). Ethical IGJ says yes (climate is critical).
      *   *Verdict:* Likely Green/Pass, provided reserves remain safe for emergencies.

  7.  **Running Case 2: Arts Cut for STEM Lab:**
      *   *Cost:* Cancellation of program (cultural capital, creative outlet).
      *   *Benefit:* New facility (STEM skills).
      *   *Irreversibility:* High. Rebuilding an arts dept takes decades; building a lab is faster.
      *   *Fairness:* STEM helps jobs; Arts helps whole person. Eliminating arts violates "equal opportunity" for different student types.
      *   *Discounting:* Future students get less choice.
      *   *Verdict:* Red/Fail. Sacrificing diversity of education for one type of utility violates IGJ.

  8.  **Review against Constraints:**
      *   *Discounting:* Addressed in Step 3 (Ethical vs Market Rate).
      *   *Uncertainty:* Addressed in Step 4 (Precautionary principle).
      *   *No Vote:* Addressed in Step 5 (Stewardship role).
      *   *Uncomfortable Answer:* Case 2 should ideally show that even if STEM is popular, cutting arts permanently is unjust.

  9.  **Final Polish:**
      *   Tone: Practical, peer-to-peer, authoritative but accessible.
      *   Formatting: Bold headers, bullet points, clear "Yes/No" indicators.
      *   Warning: Make sure they know IGJ isn't just "save the planet," it's "don't rob Peter to pay Paul (where Paul hasn't been born yet)."

  10. *(Self-Correction during drafting)*: I initially thought about suggesting they calculate Net Present Value (NPV). *Correction:* Too technical and relies on market discount rates which inherently discriminate against the distant future. Better to use a "Threshold Test" for financial viability rather than strict NPV, focusing on solvency.
      *   *Second Thought:* How to handle the "Arts vs STEM" value judgment? IGJ doesn't dictate *what* is valuable, but it dictates *diversity of options*. The unfairness is narrowing the horizon for future kids. I need to make sure the procedure highlights "Option Preservation."

  11. *Finalizing the Procedure Name:* "The Stewardship Filter." Sounds official but understandable.

  12. *Check against the prompt:* Did I include where it punts? Yes, in the "Value Conflict" step. Did I address the voting issue? Yes, in the "Trusteeship" concept.

  Let's build the response.
answer: |-
  This is a classic policy problem. Intergenerational Justice (IGJ) sounds philosophical, but in practice, it’s about **stewardship**. Your role isn't to represent the future (you can't), but to ensure you don't mortgage their future for your present convenience.

  Here is a decision procedure designed for 30-minute meetings. We call it **"The Stewardship Filter."**

  ---

  ### The Stewardship Filter (Decision Procedure)

  **Instructions:** Run these 5 steps in order. If you hit a RED flag, the proposal requires major changes or is rejected. A YELLOW flag requires a mitigation plan. A GREEN flag means it passes IGJ standards.

  #### Step 1: The Time-Burden Map (Who pays vs. Who wins?)
  *Ask:* "Who writes the check today, and who signs the receipt in 10+ years?"
  *   **Green:** Costs and benefits are shared roughly equally across time (e.g., moderate annual fees with moderate savings).
  *   **Yellow:** High current cost / Low future benefit (requires proof the benefit outweighs the pain).
  *   **Red:** Low current cost / Massive future liability OR High current cost / Benefit dies with current graduates (wasted investment).
  *   **Why:** IGJ is violated if current students consume resources while leaving debt/burdens behind.

  #### Step 2: The Irreversibility Test
  *Ask:* "If we regret this in 10 years, how expensive/invisible is it to undo?"
  *   **Green:** Easy to reverse (e.g., hiring a contract worker, buying software).
  *   **Yellow:** Hard to reverse but recoverable (e.g., physical renovation).
  *   **Red:** Permanently alters the school's structure/culture (e.g., dismantling a department, selling off land, toxic waste, massive debt covenant).
  *   **Why:** You don't have permission to close doors for future students that shouldn't be closed.

  #### Step 3: The Ethical Discount Check (Handling "Time Distance")
  *Ask:* "Are we treating a benefit 20 years from now as worth significantly less than a benefit today?"
  *   **The Trap:** Economists use "discount rates" (money now is better than money later). This implies future lives matter less mathematically.
  *   **Procedure:** Do NOT accept a financial calculation that discounts a 20-year climate or safety benefit by more than 3% per year.
  *   **Green:** Long-term value is weighted heavily (future safety/emission cuts count almost as much as today).
  *   **Red:** Proposal is rejected solely because future savings take too long to compound.
  *   **Why:** Future students are alive now, just in the future. Their suffering isn't worth 10x less than yours just because of distance.

  #### Step 4: The Option Preservation Check (Handling Uncertainty)
  *Ask:* "Does this choice narrow the range of choices available to future students?"
  *   **Green:** Keeps options open (e.g., invests in flexible tech, preserves diverse curriculum).
  *   **Red:** Locks in a single path that risks making other paths impossible (e.g., defunding all humanities to build one type of lab).
  *   **Why:** You don't know what future students will value. It is unjust to predetermine their world based on *our* guesses.

  #### Step 5: The Trusteeship Punt (Where Facts End, Values Begin)
  *Ask:* "Is there a trade-off between 'Current Urgency' and 'Future Viability' that data cannot solve?"
  *   **Action:** If Steps 1–4 pass, but there is still tension (e.g., Current tuition hikes vs. Future solar savings), you must vote on a principle.
  *   **Rule:** In a tie-breaker scenario, prefer preserving **viability** (school solvency/mission) over **optimization** (maximizing current perks).
  *   **Note:** This is where you admit "I'm making a value judgment that prioritizes the unborn."

  ---

  ### Running the Procedure

  Here is how the filter applies to your two cases. Note where the results might feel counter-intuitive to popular opinion.

  #### Case 1: Solar Panels (High Upfront Cost, Long Term Savings)

  *   **Step 1 (Map):** Current reserve fund is drained (Current Burden). Electricity savings/emissions go to next 20 years (Future Gain).
      *   *Result:* **Yellow.** It shifts money from "today's emergency fund" to "tomorrow's budget."
  *   **Step 2 (Irreversibility):** Panels last 25 years. They are infrastructure. Hard to move, but not harmful if removed.
      *   *Result:* **Green.**
  *   **Step 3 (Discount Check):** Financial models might say "Don't do it, ROI is too slow." Under IGJ, we reject that model. Emissions prevention is vital for future students regardless of the discount rate.
      *   *Result:* **Green.**
  *   **Step 4 (Options):** Preserves school funding stability for future kids (less energy price volatility).
      *   *Result:* **Green.**
  *   **Step 5 (Punt):** Should we drain the reserve? Only if it leaves a "safety buffer" for true emergencies.
      *   **Final Verdict: GO (with condition).**
      *   **Condition:** Do not drain the reserve below 10% liquidity. Take the solar loan through an external bond if possible, spreading the cost. If not, delay the installation until reserves grow. IGJ demands we don't starve the current students of emergency protection just to save the future students energy costs.

  #### Case 2: Cut Arts Budget to Build STEM Lab

  *Context:* Current students want labs. Arts faculty warns this kills the arts program permanently (budget won't return).

  *   **Step 1 (Map):** Current students get cool lab (Gain). Future students lose arts program (Loss). The administration pays nothing (Hidden transfer from arts students to STEM students across time).
      *   *Result:* **RED.** This is transferring a cultural deficit to the future to buy a facility advantage today.
  *   **Step 2 (Irreversibility):** If arts are cut, the faculty, culture, and history are lost. Rebuilding a strong arts program takes 10+ years after funding returns. Labs are easier to add/remove.
      *   *Result:* **RED.** Permanent loss of option.
  *   **Step 3 (Discount Check):** STEM is "hot" now. Art is "niche." The proposal assumes STEM is more valuable for the future than Art.
      *   *Result:* **YELLOW.** (You can argue STEM is important, but you can't prove Art is *not*).
  *   **Step 4 (Option Preservation):** Removing Arts narrows the definition of education for all future students. It assumes *every* future kid will only care about STEM.
      *   *Result:* **RED.** Violation of diversity of opportunity.
  *   **Step 5 (Punt):** Here is the hard truth. If you prioritize "What current students want most" (STEM popularity), you violate IGJ.
      *   **Final Verdict: REJECT.**
      *   **The Uncomfortable Reason:** Even if 90% of *current* students vote for the STEM lab, IGJ says you cannot sacrifice the interests of future students who might desperately want Art, Music, or Drama. You do not have the right to permanently dismantle a wing of the school's identity for temporary popularity.
      *   **Alternative:** Fund the lab via a separate fundraising drive specifically labeled "STEM Expansion," but protect the Arts line item.

  ---

  ### Summary of Rules for your 30-Minute Meeting

  1.  **The Voting Gap Rule:** Remind yourself: *"We are voting on behalf of people who cannot yell at us."* Treat them with the same respect you'd demand from your parents for you.
  2.  **The "Sunk Cost" Fallacy Check:** Never let "we already planned this" be an argument for continuing. Future students inherit the consequences, not the plans.
  3.  **The 3% Rule:** If a proposal relies on future benefits being discounted by more than 3% annually to make the math work, tell Finance to recalculate using "Climate/Social Discount Rates" (often near 0% for critical infrastructure).

  **When to Punt:**
  If you have to choose between "Saving current students $50/tuition" vs "Saving future students $200/tuition AND carbon credits," the numbers say Save Future Money. But if it requires raising current tuition by $500, you must Punt to the Board. IGJ forbids Student Gov from sacrificing current student well-being (poverty risk) for abstract future goods unless the future good is existential (like preventing global warming).

  **Why this works for you:**
  It turns vague morality into a checklist of **Risk Management**. You aren't judging "good vs evil"; you are auditing whether the school is financially and structurally solvent enough to welcome the next graduating class. That is a defense you can put in minutes.
