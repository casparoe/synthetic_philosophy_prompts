answer: |-
  The stalemate between scientific realists and anti-realists is best diagnosed not as a failure of argumentation or a lack of historical data, but as a fundamental divergence in epistemic risk management disguised as a metaphysical dispute. While the exchange often appears to turn on empirical claims about the success rates of past theories or definitional issues regarding reference and approximation, these surface disagreements mask a deeper incompatibility in how the two camps weight the evidential significance of predictive success. The realist operates under an epistemic virtue that prioritizes explanatory depth and the assumption that nature possesses a continuous structure capable of being modeled across paradigms, whereas the anti-realist prioritizes empirical safety and treats theoretical ontology as a heuristic that need not map onto mind-independent reality. Consequently, the impasse is sustained because neither side can generate evidence that the other is compelled to accept as decisive, given that their respective standards for what counts as sufficient justification are derived from incompatible starting assumptions about the reliability of human cognition in accessing deep structure.

  If one examines the claim that this is a hidden empirical dispute about base rates, the problem becomes apparent quickly. We possess no independent way to measure the falsity of past theories except through our current ones, creating a circularity where the very metric needed to evaluate the realist’s claim—the ratio of true posits to total posits—is determined by the perspective being evaluated. The anti-realist sees the graveyard of discarded terms like ether or phlogiston as definitive proof of systemic failure, while the realist sees the same graveyard as evidence of progressive refinement where the equations survived even if the labels did not. Because the data is interpreted through the lens of the conclusion one wishes to reach, no historical ledger can adjudicate the matter. Similarly, attempts to resolve the dispute through individuation or counting theories run aground on the same rock. When a realist argues that Fresnel’s optics survived into Maxwell’s electromagnetism, they are performing a retrospective redescription that privileges continuity. An anti-realist, employing a different criterion of identity, can simply assert that the successor theory displaced the predecessor entirely, rendering the concept of preservation arbitrary. Since there is no neutral vocabulary to describe theory change without begging the question against one side, the statistical sample remains perpetually contested.

  This brings us to the Bayesian diagnosis, which offers a more precise accounting of the deadlock. The disagreement effectively functions as a clash of prior credences regarding the stability of the world. If an agent assigns a high prior probability to the hypothesis that successful mathematical models tend to capture underlying causal mechanisms, then predictive success will incrementally raise their confidence in realism. Conversely, if an agent assigns a high prior probability to the hypothesis that effective models can be built upon false substrates—a possibility demonstrated by the history of instrumental success—then the same evidence yields little movement toward belief in truth. In a Bayesian framework, unless the likelihood ratio is overwhelmingly in favor of one model over another, agents with significantly different priors will never converge on the posterior probability, regardless of how much shared evidence they review. The impasse is therefore a feature of rational epistemology rather than a breakdown of dialogue; both sides are reasoning correctly from their starting points, which remain insulated from empirical revision because they concern the background conditions of scientific inquiry itself.

  The verbal dispute regarding approximate truth and the burden of proof are secondary symptoms of this primary divide. Disputes about operationalizing approximate truth dissolve only when one admits that the operational definition must already rely on a notion of structure that the anti-realist rejects. If one defines approximate truth as empirical adequacy, the anti-realist accepts it but gains nothing for realism. If one defines it as partial structural isomorphism, the realist accepts it, but the anti-realist rejects the necessity of that isomorphism. Thus, clarifying the terminology does not bridge the gap because the gap lies in the necessity of the connection, not the definition of the terms. Regarding the burden of proof, the conflict is indeed exacerbated by shifting standards, but describing it merely as a burden-of-proof dispute understates the structural nature of the disagreement. The realist claims the burden lies with the anti-realist to explain why success would occur without truth, arguing that postulating a causal mechanism linking prediction to reality is the simplest explanation. The anti-realist counters that the burden lies with the realist to demonstrate the mechanism, arguing that assuming truth adds unobservable baggage to the explanation. Neither side finds the other’s demand compelling because each views their own stance as the default baseline for inquiry.

  Given this diagnosis, it is highly unlikely that a new historical case, such as the discovery of a previously unknown successful theory that is later proven completely false, would break the impasse. Realists would treat such a case as a rare anomaly or a failure of the specific theory's structural components, maintaining that general progress remains valid. Anti-realists would treat it as further confirmation of the pessimistic meta-induction, reinforcing the idea that success is no guarantee of accuracy. Even a formal result in confirmation theory proving that under certain conditions predictive success tracks truth would likely be met with skepticism by those whose priors dictate that those conditions are not met by nature. The most honest assessment is that the question as posed is partially ill-formed insofar as it seeks a metaphysical certainty that the scientific method is designed to circumvent. Science proceeds by betting on the fruitfulness of theories, not by verifying their ontological finality. The impasse will likely not be broken by a definitive proof, but by a gradual cultural shift within the philosophy of science where the question of truth is deprioritized in favor of questions regarding instrumentality, social construction, or the pragmatic limits of knowledge. Until science produces a domain where theoretical terms lose all contact with empirical success, or until we develop a meta-theory that allows us to view theories from outside the evolutionary process of science itself, the debate remains a necessary friction that keeps both metaphysical ambition and empirical humility in check, serving more as a regulatory ideal than a puzzle waiting for a solution.
