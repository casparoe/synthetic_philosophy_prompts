          *   *Critique:* This is accurate to Street/Joyce. The argument is epistemological (undercutting defeater), not purely genealogical. The "genetic fallacy" charge fails if the argument establishes that the cause of belief is independent of the truth. Ravi is technically correct here regarding how EDAs work in contemporary literature.
