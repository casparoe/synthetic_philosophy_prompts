  7.  **Self-Correction during drafting:** I need to make sure I don't just say "Ravi is right." Maya makes excellent points about the anti-realist burden in Round 3. While Ravi is technically right that the anti-realist doesn't worry about *truth*, he glosses over the difficulty of explaining the *specific distribution* of moral errors (if any) versus adaptive beliefs. Actually, the standard view is evolution *does* explain the errors well enough (adaptive myths). I should note that Maya's Round 3 point is interesting but perhaps overstated compared to Ravi's standard anti-realist defense.
