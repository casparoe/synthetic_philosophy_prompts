      *   **Tension C: (2) vs. (5).**
          *   (2) defines confirmation relative to $E$: $P(H|E) > P(H)$.
          *   (5) moves the pivot to the Logical Connection $C$. The math becomes $P(H|C) > P(H)$.
          *   Does $E$ confirm $H$ in (5)? No, $C$ confirms $H$.
          *   (3) claims $E$ confirms $H$.
          *   *Conflict:* (2) sets a condition involving $E$. (5) shifts the condition to involve $C$.
          *   *Resolution:* Modify (2) or clarify (3).

      *   **Tension D: (4) vs. (5) / (1).**
          *   (4) says we can't go back and unset $P(E)=1$.
