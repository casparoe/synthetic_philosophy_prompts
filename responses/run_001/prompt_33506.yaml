      *   *(2) Positive Relevance:* Definition of confirmation. $E$ confirms $H$ iff $P(H|E) > P(H)$. This relies on the inequality holding *before* updating vs. *after*. Or, comparing posterior to prior.
      *   *(3) Old Evidence Confirmation:* Claims that $E$ (where $P(E)=1$) can confirm $H$. This is the intuitive target we want to preserve (e.g., Mercury/GR).
      *   *(4) Anti-counterfactualism:* Rejects the standard solution to the Problem of Old Evidence (POE). Standard solution: Imagine $P(E) < 1$ in a counterfactual prior. User rejects this as psychologically/principled impossible.
      *   *(5) Logical-Connection Diagnosis:* Shifts the object of learning. We don't learn $E$; we learn $K$ (knowledge of entailment: $P_E(H \to E) = 1$ or $P(H \vdash E) = 1$). So update is on $K$, not $E$.

  3.  **Identify Potential Tensions:**

      *   **Tension A: (1) + (2) vs. (3).**
          *   (1) says update via conditionalization. If $E$ is old, $P(E)=1$.
          *   (2) says confirmation means $P(H|E) > P(H)$.
          *   Math check: If $P(E)=1$, then $P(H|E) = P(H \cap E)/P(E) = P(H \cap E)$. Since $E$ is certain, $H \subseteq E$ implies $P(H \cap E) = P(H)$. Actually, if $P(E)=1$, $P(H|E) = P(H)$ for all $H$.
          *   Therefore, under strict (1) and (2), Old Evidence *cannot* confirm.
          *   But (3) says it *does* confirm.
          *   *Severity:* High. This is the core Problem of Old Evidence (POE).
          *   *Resolution:* You must abandon one, or reinterpret terms. (5) attempts to reinterpret "update".

      *   **Tension B: (1) vs. (5).**
          *   (1) says updating proceeds by conditionalization on the *evidence*.
          *   (5) says what gets confirmed is not $E$ but the logical relation ($C$: $H$ entails $E$). So the update is conditionalization on $C$.
          *   Is there a conflict? Not necessarily. (1) allows conditionalizing on any proposition with $0 < P(X) < 1$.
          *   However, (3) says "$E$ ... confirmed... theory". (5) says "it is this newly learned [relation], not the old evidence itself, that bears the confirmatory weight."
