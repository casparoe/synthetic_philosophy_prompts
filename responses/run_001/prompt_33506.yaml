          *   *Is this stable?* Yes, this is the "Garber Solution" (Jeffrey Garber, 1983).
          *   *Problem:* Can $P(C)$ be less than 1 before discovery? For a rational agent (logically omniscient Bayesians), usually no. If $H$ is defined in a language where $E$ is deducible, $P(H \vdash E) = 1$ automatically.
