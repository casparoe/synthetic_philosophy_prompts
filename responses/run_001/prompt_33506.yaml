  8.  **Self-Correction/Nuance Check:**
      *   Wait, does (1) *require* logical omniscience? "Rational degrees of belief are probabilities." If the probability space includes all logical truths, then yes, $P(T)=1$. But Garber expands the space to include *statements about* logical relations (e.g., "$h$ entails $e$") which are contingent on the agent's state of knowledge, not logical truths per se.
      *   So, (1) can hold if the algebra of propositions is sufficiently rich. The tension isn't strictly (1), but (1)'s implicit assumption of how the hypothesis $H$ relates to evidence $E$.
      *   Let's focus on the clearest tension: **(2) Positive Relevance** applied to **E**. If I conditionalize on $L$ (Link), then $P_{new}(H) = P_{old}(H|L)$. Did $E$ confirm $H$? Under (2), NO. $L$ confirmed $H$.
      *   So (3) "Evidence confirms" is the statement at risk if (5) is true.
      *   Also, does (5) require dropping (4)? No. You don't need to forget $E$. You just notice $E \in H$'s consequences. This fits (4) perfectly.
      *   So the main cost is to (2) or the phrasing of (3).

      *   *Wait, another angle:* (5) says "what actually does the work... is that the scientist learns something new".
      *   If we treat "Learning something new" as conditionalizing on $L$, we satisfy (1).
      *   If we satisfy (1), we accept $P(E)=1$ initially.
      *   So (1)+(4)+(5) is the Garber move.
      *   Where does the friction come from? The friction is that (2) defines confirmation strictly via $P(H|E)$. If $E$ is constant ($P=1$), its probability function doesn't change.
