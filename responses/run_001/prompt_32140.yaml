      *   *Alternative view:* **Logical Conservatism** (keep CL) combined with **Denial of Sharp Boundaries** creates a massive conflict. You can't have both without weirdness (like non-transitive identity or revision of consequence).
      *   *Decision:* I will argue that the combination of **Non-Sharp Boundaries** (at all orders) + **Classical Logic** is the impossible trinity (along with a standard semantics).

