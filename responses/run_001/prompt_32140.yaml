      *   Also: The tension between "Explaining the Intuition of Tolerance" vs. "Preserving Classical Logic." If you keep CL, you usually must deny the Tolerance Principle (Epistemicism). If you keep Tolerance (roughly), you must drop CL (Many-Valued).
