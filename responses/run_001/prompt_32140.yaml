      *   *Selection:* The "Single Desideratum" question. I think **Handling Higher-Order Vagueness** is the one that kills the most "middle-ground" theories. Supervaluationism struggles here. Many-valued struggles here. Epistemicism denies it. It splits the field most sharply.

