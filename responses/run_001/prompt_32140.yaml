answer: |-
  You are right to feel frustrated. Much of the literature on vagueness proceeds as if the rival positions agree on the problem, but they often diverge on the diagnosis. Before evaluating a theory, you must establish the criteria by which success is measured. Below are the core desiderata, their motivations, and an assessment of their negotiability. Following this, I outline the structural tensions that make satisfying all of them simultaneously notoriously difficult.

  ---

  ### 1. The Six Core Desiderata

  #### A. Resolution of the Sorites Paradox
  *   **The Case:** The classic Sorites sequence: A heap of sand remains a heap if we remove one grain; iterating this suggests a single grain is a heap (absurdity). Premise 1 (base case) seems true. Premise 2 (tolerance principle) seems plausible. Conclusion is false. Logic seems valid. At least one element must go.
  *   **What is required:** A theory must either block the validity of the inference, show why the conclusion does not follow, reject one of the premises (usually Tolerance), or explain the paradox away as a linguistic confusion. Merely stating "Premise 2 is false" is insufficient without explaining *why* it is so obviously compelling to our intuitions.
  *   **Status:** **Non-negotiable.** A theory of vagueness that ignores the Sorites fails to address the defining characteristic of the phenomenon. However, the *burden of explanation* varies. Some theories (e.g., Epistemicism) admit the premise is false but owe us an explanation of the error. Others (e.g., Supervaluationism) deny the premise is determinately true/false.
  *   **Assessment:** Blocking the inference is the minimum entry fee. Explaining the *persistence* of the intuition that the Tolerance Principle holds is the burden of proof.

  #### B. Accounting for Borderline Cases
  *   **The Case:** Consider the predicate *bald*. There are men who are definitely bald and men who are definitely not. But there is a range of cases where neither "$x$ is bald" nor "$x$ is not bald" seems appropriate. We cannot merely stipulate a sharp cutoff (e.g., "Let's define bald as < 50 hairs") without changing the subject from *baldness* to *hairy-count*.
  *   **What is required:** The theory must characterize what it is for a predicate to be indeterminate in application, distinct from mere ignorance. Crucially, it must explain why the speaker cannot resolve the indeterminacy by fiat (unlike in a rule-governed game of chess, where we can stipulate what counts as a move).
  *   **Status:** **Non-negotiable (conceptually), Variable (ontologically).** The existence of the phenomenon is undeniable. Whether the theory explains this via semantic gaps, lack of knowledge, or context-shifting depends on the camp. The "cannot resolve by stipulation" clause is vital: if a theory allows stipulation to resolve vagueness, it fails to capture the normative nature of natural language predicates.
  *   **Assessment:** Most agree on the datum. Disagreement arises on whether "borderline" is a metaphysical property, a semantic feature, or a pragmatic signal.

  #### C. Handling Higher-Order Vagueness (HOV)
  *   **The Case:** Suppose a theory draws a sharp line between *definitely F* and *borderline F*. Then, consider the boundary between *definitely definitely F* and *definitely borderline F*. A sharp boundary here creates a new Sorites series. If you repeat this indefinitely, you generate an infinite hierarchy of sharp boundaries. Yet, intuitively, "definitely" is itself vague (is something *really* definitely bald?).
  *   **What is required:** The theory must avoid drawing sharp boundaries between levels of clarity. If it admits a boundary between "clear" and "borderline," it must justify why this specific boundary escapes the Sorites scrutiny that plagued the first-order predicate.
  *   **Status:** **Highly Contested.**
      *   **Non-negotiable for Semanticists:** If you build your semantics on degrees or supervaluations, failing to handle HOV means you haven't solved the original problem; you just pushed it up.
      *   **Rejectable for Epistemicism:** Epistemicists argue HOV is a mistake; there *are* sharp boundaries to everything (including "definitely"), we just don't know them. They treat HOV as ignorance, not semantic indeterminacy.
  *   **Assessment:** If you are a semanticist trying to preserve the *phenomenon* of vagueness, this is a trap. You cannot easily maintain that vagueness runs infinitely deep within classical logic without creating a regress.

  #### D. Logical Conservatism vs. Revisionism
  *   **The Case:** Classical Logic (CL) includes Bivalence (every proposition is True or False) and Excluded Middle ($P \lor \neg P$). In vague domains, $P$ might be neither true nor false.
  *   **What is required:** A theory must specify the underlying logic. If it abandons CL (e.g., allowing Truth Value Gaps or Many-Values), it owes us a reconstruction of the logic used in daily life (why do we act as if CL works?) and a definition of validity for the new system. If it keeps CL (Epistemicism), it must explain how Bivalence holds given apparent gaps.
  *   **Status:** **Preference-driven but costly.**
      *   **Classical:** Saves the metalogic of mathematics and science, costs the natural fit with intuitive truth values.
      *   **Revising:** Fits intuition better, costs connection to mainstream logical systems.
  *   **Assessment:** Not strictly non-negotiable (many theories *do* revise logic), but revising logic imposes a heavy tax: you must prove the revision is consistent and useful enough to replace centuries of mathematical practice in relevant areas.

  #### E. Penumbral Connections
  *   **The Case:** Predicates are connected. Nothing is clearly Red and clearly Orange. Clearly Tall entails clearly Not Short. A theory of "Red" cannot be built entirely independently of "Orange."
  *   **What is required:** The semantics must constrain truth assignments such that logically incompatible predicates cannot both be "highly true." In standard fuzzy logic, if Red(x) = 0.5 and Orange(x) = 0.5, this violates our intuition that Red and Orange are mutually exclusive.
  *   **Status:** **Non-negotiable but frequently violated.**
      *   Simple many-valued logics often treat atomic sentences independently, failing to enforce that $\text{True}(\text{Red}(x)) \to \neg\text{True}(\text{Orange}(x))$.
      *   This requirement rules out "naive" degrees-theory unless the logic is heavily constrained (e.g., using specific negation operators or algebraic structures).
  *   **Assessment:** This acts as a technical filter. Many candidate theories die here because they optimize for solving Sorites at the cost of breaking basic semantic relations between related concepts.

  #### F. The Forced-March Sorites
  *   **The Case:** Imagine walking down the sequence of heaps/grains/hairs. The theorist forces you to answer "Yes" or "No" for each step.
      *   If you say "Bald" to every single step, you collapse into the absurd conclusion (no one is bald).
      *   If you change your answer at step $k$, you have drawn a sharp cutoff.
      *   If you refuse to answer, you violate the assumption that language is usable for categorization.
  *   **What is required:** A theory must provide a normative guideline for assertion in these cases. If it says "Withhold judgment," does this mean nothing is ever asserted? If it says "Make a choice," does that imply the boundary was always there?
  *   **Status:** **Depends on Pragmatics.**
      *   If the theory is purely *semantic* (describing truth conditions), this test may be unfair (semantics $\neq$ use).
      *   However, if the theory claims to explain *communication*, ignoring the forced march is fatal.
  *   **Assessment:** This distinguishes *metaphysical/semantic* solutions from *pragmatic/speech-act* solutions. A purely semantic theory can sidestep this by claiming "assertion" has different rules than "truth." A complete theory should integrate both.

  ---

  ### 2. Structural Tensions and Incompatibility Results

  You asked if there is a subset of these that cannot be jointly satisfied. The most significant tension involves the interaction of **Higher-Order Vagueness**, **Classical Logic**, and **Semantic Precision**.

  #### The "No-Gap" Problem in Classical Frameworks
  If you wish to preserve Classical Logic (Desideratum D) while accepting that vagueness involves genuine truth-value gaps or borderlines (Desideratum B), you run into a well-known difficulty.

  In classical semantics, you typically define truth via a valuation function $v(P) \in \{0, 1\}$. To introduce gaps, you modify this. But once you introduce a third value (Indeterminate) or a gap:
  1.  **Supervaluationism** attempts to save Classical Logic by saying a sentence is true iff it comes out true on all "admissible" precisifications. This preserves excluded middle. However, it struggles with HOV (Desideratum C). To handle HOV, Supervaluationism effectively needs a hierarchy of meta-languages (a language of "definitely," then a language of "definitely definitely"). If this hierarchy is finite, it introduces sharp boundaries (violating HOV intuition). If infinite, it becomes technically unwieldy and threatens the "gappiness" of the object language.
  2.  **Epistemicism** solves the paradox by keeping Classical Logic intact but insisting there *are* sharp boundaries. It accepts Desideratum D perfectly. It handles the Sorites by declaring Tolerance false. It fails the "Explanation of Pull" (A) by attributing it to ignorance. It effectively rejects the phenomenological reality of Borderline Cases (B) as epistemic rather than ontological.
  3.  **Degree-Theory (Fuzzy Logic)** handles Borders (B) and HOV (C) naturally via continuity functions. It handles the Sorites by making Tolerance "mostly true." However, it violates Classical Logic (D) (Excluded Middle fails: $p$ and $\neg p$ can both be 0.5). It also struggles with Penumbral Connections (E) unless carefully restricted.

  #### The "Williamson's Objection" (Infinite Regress)
  Timothy Williamson has argued that if you attempt to model HOV formally (rejecting sharp boundaries for "definitely"), you are committed to an infinite hierarchy of semantic statuses.
  *   To say "There is no sharp line between F and borderline F," you must quantify over the domain.
  *   But your quantifiers range over things.
  *   If vagueness is ubiquitous, your own metalanguage describing the vagueness must be vague.
  *   If your metalanguage is vague, its truth conditions are vague.
  *   To evaluate the truth conditions of the object language, you need a super-metalanguage.
  *   This leads to a potential infinite regress unless the theory posits a "last layer" where the logic stabilizes (e.g., classical math). But that last layer reintroduces a sharp boundary somewhere, violating the spirit of vagueness.

  **The Impossibility Result:** There is no straightforward way to satisfy **(1) Full preservation of Classical Logic**, **(2) Genuine indefinite boundary conditions at all orders (HOV)**, and **(3) Standard Tarskian Truth Conditions** simultaneously without generating inconsistency or an infinite regress. You essentially face a trilemma: Drop Classical Logic, Accept Sharp Boundaries (Epistemicism), or Abandon Standard Semantics (Contextualism).

  ---

  ### 3. The Single Largest Eliminator

  If you had to pick one desideratum that eliminates the largest number of candidate theories in a single stroke, it is:

  #### **A satisfactory treatment of Higher-Order Vagueness without reverting to Classical Sharpness.**

  **Why?**
  Most "easy" solutions to vagueness deal only with first-order predicates.
  *   **Epistemicism:** Eliminates HOV by denying it exists. It keeps CL, so it survives this filter *if* you accept the denial. If you insist HOV is real, Epistemicism dies instantly.
  *   **Supervaluationism:** Can be patched to handle HOV, but usually requires complex restrictions on "admissibility" that begin to look ad hoc. It loses elegance and often slips back into drawing a sharp distinction between "definite" and "indefinite" at some level.
  *   **Simple Many-Valued Logic:** (e.g., Lukasiewicz). Handles degrees well initially. But under standard definitions, the operator "Definitely" defined as $D(p) = 1$ if $val(p)=1$ else $0$ immediately reinstates a sharp boundary for "Definitely." To fix this, you need non-standard definitions of "Definitely" that complicate the logic significantly.

  If you require the theory to demonstrate how the boundary between "Definitely F" and "Not Definitely F" is itself vague, **without** positing an unknowable sharp fact (Epistemicism) and **without** resorting to an infinite metalanguage hierarchy (which breaks practical applicability), you eliminate almost all standard variations of:
  1.  Naive Supervaluationism
  2.  Standard Fuzzy Logic
  3.  Contextualist accounts that rely on simple parameter shifting

  This single requirement forces the theory into a highly specific niche: it requires a dynamic logic (where the set of values shifts as we apply 'definitely') or a non-classical logic specifically designed to internalize vagueness (like the logic of hyper-degrees).

  ### Summary Recommendation for Your Reading

  Do not read a theory of vagueness until you check three boxes on its proposal:
  1.  **Where is the boundary between 'definite' and 'borderline'?** (If it is sharp, how does it escape the Sorites?)
  2.  **What happens to $P \lor \neg P$ in the borderline zone?** (If it holds, how is B preserved? If it fails, what logic replaces it?)
  3.  **Can it explain why I feel compelled to assent to the Tolerance Principle?** (Does it dismiss this as error, or reconstruct the feeling?)

  Theories that fail #1 are usually Epistemicist. Theories that fail #2 are usually Supervaluationist/Fuzzy. Theories that fail #3 generally lack explanatory depth. The rare "gold standard" theory would need to navigate all three, likely requiring a sophisticated non-classical framework that acknowledges the price of the revision.
