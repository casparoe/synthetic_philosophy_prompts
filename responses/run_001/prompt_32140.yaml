      *   *Check:* Did I distinguish between the *semantic* solution and the *pragmatic* solution? (Contextualism often takes the latter).
      *   *Check:* For Penumbral connections, mention Wright's argument about how fuzzy logic fails to capture logical relations like "A tall man is not short."
