      *   **Final Questions:** Is there a subset that cannot be jointly satisfied (incompatibility results)? Which single desideratum eliminates the most candidates?
      *   **Tone:** Philosophical, precise, analytical, structured. Avoid just listing theories; focus on the *meta-theoretical* criteria.

  2.  **Deconstruct the Desiderata:**

      *   **The Sorites Paradox:** It's the core problem. A theory must explain why we can't accept all premises + classical logic leading to absurdity. Does it need to block validity? Reject premises? Or dissolve the meaning?
          *   *Negotiability:* Non-negotiable. You can't have a theory of vagueness that doesn't address the paradox.
          *   *Burden:* Must explain the *pull* of the reasoning, not just say "premise 2 is false."

      *   **Borderline Cases:** What makes them borderline? Why can't we stipulate precision? Why are *some* predicates vague and others sharp?
          *   *Negotiability:* Non-negotiable for the phenomenon itself, but explaining the *distribution* (why some are vague) might be secondary. The inability to stipulate is crucial.

      *   **Higher-Order Vagueness (HOV):** If I say "clearly F" vs "not clearly F," is the boundary between those vague too?
          *   *Negotiability:* Highly debated. Epistemicists deny HOV exists (there's a sharp cutoff to "clear"). Supervaluationists struggle here (requires infinite hierarchy or admissibility restrictions). Degree theorists handle it differently.
          *   *Requirement:* Most modern logicians think you can't just draw a second-order sharp line without reintroducing the problem recursively. So, handling it seems necessary for a robust semantics.

      *   **Logical Revisionism:** Do we keep Classical Logic (CL)?
          *   *Negotiability:* This is the major fault line. Epistemicism keeps CL. Supervaluationism/Many-Valued often lose Bivalence or LEM.
          *   *Constraint:* If you revise logic, you need a justification (e.g., semantic gaps).

      *   **Penumbral Connections:** Red $\neq$ Orange. Tall implies Not Short.
          *   *Negotiability:* Often overlooked but crucial. Many-valued logics sometimes fail here if truth values are independent. Requires constraints on truth-functionality or model structure.
          *   *Constraint:* Rules out simple fuzzy logics that treat atomic propositions independently.

      *   **Forced-March Sorites (FMS):** Practical application vs. theoretical consistency. "Is 1 grain bald? 2? ...?"
          *   *Negotiability:* Depends on whether the theory claims to guide assertion or only describe truth conditions. Epistemicism says "Yes, you should answer (you just don't know)." Supervaluationism says "No, the statement is indeterminate."
          *   *Test:* It tests the link between semantics and assertion guidelines.

  3.  **Address the Final Questions (Impossibility & Selection):**
