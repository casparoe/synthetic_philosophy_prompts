      *   **Section 4: Empirical Context.** Institutional investors vs. Individuals. Capital constraints differ.
      *   **Diagnosis Conclusion:** It's a clash between **descriptive dynamics of wealth accumulation** (Kelly) and **prescriptive decision theory under uncertainty** (EUT). The word "optimal" refers to different metrics (growth rate vs. utility satisfaction).
