answer: |-
  The enduring stalemate regarding the Kelly criterion is not a single confusion but a multi-layered collision of mathematical frameworks, normative assumptions, and temporal perspectives. While the sides agree on the algebra (the formula for maximizing logarithmic growth), they disagree fundamentally on **what quantity is being optimized** and **why**.

  My diagnosis is that the debate is neither purely verbal nor purely substantive in the traditional sense of "preferences." Rather, it is a **category error** arising from the conflation of two distinct problems: the **dynamic physics of capital accumulation** versus the **static preference satisfaction of an agent**.

  Here is the detailed diagnosis of the characteristic moves, followed by the prescription for progress.

  ### 1. The Core Mismatch: Time Averages vs. Ensemble Averages
  The most significant recent contribution to diagnosing this debate comes from the "ergodicity economics" movement (most notably Ole Peters). This clarifies that the disagreement is largely structural.

  *   **The Critic’s Move (EUT/Ensemble):** Economists trained in Expected Utility Theory (EUT) view a decision as a comparison of state-contingent payoffs across parallel hypothetical worlds (ensembles). For them, maximizing $E[U(W)]$ is the definition of rationality. If $U(W) = \log(W)$ yields Kelly, then Kelly is merely a special case of risk aversion. As Paul Samuelson famously argued, there is no logical justification for preferring $\log(W)$ over any other concave utility function; thus, Kelly imposes an arbitrary risk profile.
  *   **The Proponent’s Move (Dynamics/Time):** Proponents (Breiman, Thorp, Peters) argue that in a multiplicative stochastic process (compounding returns), the ensemble average ($E[W]$) diverges from the time average ($\exp(E[\log W])$). Since an agent lives through only *one* timeline, the ensemble average is physically irrelevant to their actual experience. Maximizing $E[W]$ guarantees ruin (zero wealth) almost surely over time due to volatility drag.
  *   **The Diagnosis:** The critic assumes wealth can be traded across states (insurance markets, bequests, transfers), making the ensemble relevant. The proponent assumes wealth is path-dependent and irreversible (you cannot borrow from your parallel selves), making the time average the only survival metric. **They are answering different physical questions using shared vocabulary.**

  ### 2. The Normative Smuggling: "Optimal" as Survival
  While the above explains the math, the impasse persists because of how "normativity" is smuggled into the arguments.

  *   **The Proponent's Smuggle:** When Kelly proponents claim their strategy is "rationally required," they often rely on an implicit survival axiom. They argue that since ruin is an absorbing barrier (once you have \$0, you cannot recover), any strategy allowing a positive probability of ruin is irrational. This transforms the problem from "maximizing utility" to "avoiding extinction." However, they rarely acknowledge that many agents are not optimizing for immortality or infinite replication; they optimize for consumption or goal attainment within a lifespan.
  *   **The Critic's Smuggle:** EUT critics assume a static frame where "rationality" means consistency of preference ordering, independent of the dynamics of the environment. By dismissing Kelly as merely "log utility," they ignore that log utility emerges from the *structure of the game* (repeated compounding) rather than just the *tastes of the player*.
  *   **The Diagnosis:** The disagreement is substantive regarding the **axiom of irrevocability**. If wealth destruction is permanent and irreversible, Kelly approaches a physical law of survival. If wealth can be reset, borrowed, or hedged externally, EUT holds. The debate rages because proponents present a solution to a dynamic survival problem, while critics judge it by the standards of a static preference problem.

  ### 3. The Temporal Mismatch: Asymptotes vs. Horizons
  Even accepting the dynamic view, there is a genuine friction regarding time.

  *   **The Asymptotic Claim:** Proponents cite theorems (Breiman, 1961) stating that the Kelly strategy is the unique strategy that dominates all others in the limit ($n \to \infty$). Any strategy with a smaller fraction grows slower asymptotically; any larger fraction risks ruin or lower asymptotic growth.
  *   **The Finite Horizon Reality:** In practice, no agent has an infinite horizon. A gambler playing 100 hands or an investor with a 10-year retirement window faces high variance in the first few steps of the Kelly curve. Full Kelly has high volatility, meaning even if $E[\text{log } W]$ is maximized, there is a high probability of significant drawdown before the asymptotic advantage manifests.
  *   **The Diagnosis:** This creates a divergence between **optimality** and **security**. Literature on "Fractional Kelly" (MacLean, Ziemba, Fong) attempts to bridge this, arguing for a trade-off between growth rate and risk of drawdown. The critics seize on this to say Kelly is too aggressive; the proponents counter that "too aggressive" is defined relative to the user's specific risk tolerance, which is outside the pure growth framework. Thus, the debate shifts from "Is Kelly correct?" to "How much of Kelly is appropriate?", effectively conceding that pure Kelly requires context-specific adjustments.

  ### 4. Hidden Empirical Disagreement: The Nature of Bets
  There is also a latent empirical assumption regarding the nature of the betting environment.

  *   **Proponent Assumption:** The environment allows for repeated exposure to the same positive expectation edge with stationary probabilities. This is true for quantitative trading bots or casinos, where the game rules don't change.
  *   **Critic Assumption:** The world changes. Edges decay, correlations shift, and liquidity dries up. Under non-stationarity, aggressive leveraging (which Kelly implies) exposes the agent to model risk that could lead to catastrophic loss not predicted by the stationary math.
  *   **The Diagnosis:** Critics are often implicitly modeling "one-shot" decisions or environments where the edge is uncertain (Knightian uncertainty), whereas Kelly mathematically requires known, stationary probabilities. If the edge itself is a variable subject to estimation error, full Kelly is indeed dangerous.

  ### What Counts as Progress?

  Given this diagnosis, the debate will not resolve until the participants stop arguing about "rationality" in the abstract and instead define the **domain conditions** of their models. Progress would take three forms:

  #### 1. Conceptual: Distinguishing "Survival Optimization" from "Preference Satisfaction"
  We need a formal distinction between two types of agents:
  *   **The Compound Agent:** An agent whose wealth compounds over a long horizon and faces absorbing barriers (ruin). For this agent, Time-Average Growth Rate is the correct metric. Normativity derives from the physics of survival, not subjective taste.
  *   **The Hedging Agent:** An agent who can diversify, insure, or transfer wealth across states. For this agent, Ensemble Expectations and Subjective Utility are the correct metrics.

  Progress would look like a consensus paper that explicitly categorizes investment problems by these boundaries, rendering the "Kelly vs. EUT" argument moot by showing they apply to disjoint sets of real-world scenarios.

  #### 2. Formal: Finite-Horizon Optimality Bounds
  Currently, Kelly is asymptotic. We need tighter bounds for finite $N$ that incorporate **drawdown constraints**.
  Instead of asking "Is Kelly optimal?", the question should be: "For an agent with horizon $N$ and maximum tolerable drawdown $D$, what fraction $f$ of Kelly maximizes $E[\log W_N]$ subject to $P(\min W_t / W_0 < D) < \epsilon$?"
  If such a theorem were generalized, it would subsume Full Kelly (where $N \to \infty$) and Fractional Kelly (where $N$ is finite) into a single continuous spectrum of "Horizon-Adjusted Growth," removing the binary choice.

  #### 3. Empirical: Validating Ergodicity in Markets
  The strongest move by Erik T. Peters et al. is the observation that financial returns are generally non-ergodic (time average $\neq$ ensemble average).
  Progress would require empirical evidence confirming the degree of non-ergodicity in different asset classes. If markets exhibit strong ergodicity (prices adjust instantly, arbitrage eliminates drift), EUT holds better. If markets exhibit persistent structural trends and leverage effects (non-ergodicity), Ergodicity Economics holds. Establishing *when* wealth dynamics behave multiplicatively (Kelly territory) versus additively (EUT territory) would resolve the application dispute.

  ### Summary
  The Kelly debate is a **dispute of scope**. The Critics ask, "What do you *want*?" (Preferences). The Proponents ask, "What keeps you *alive*?" (Dynamics).

  To make progress, the field must abandon the attempt to derive Kelly solely from utility axioms or solely from math. Instead, we must adopt a **hybrid framework**: Acknowledge that Kelly defines the boundary of solvency for multiplicative dynamics, but acknowledge that Finite Horizons and Transaction Constraints necessitate moving away from the boundary. The debate ends not when one side conquers the other, but when we agree that Kelly describes the **physics of compounding**, while EUT describes the **politics of consumption**. Confusing the map of the territory (Kelly) with the traveler's desires (EUT) is the source of the thirty-year stalemate.
