      *   *Normativity:* Why should an agent care about time averages over one lifetime vs. ensemble averages? Does "rationality" imply solvency/reproduction?
      *   *Finite Horizon:* Kelly is asymptotically optimal. But humans die or have fixed goals (buy a house tomorrow). Full Kelly can be too volatile for short runs (risk of drawdown). Fractional Kelly exists here.
      *   *Utility Function:* If you have a specific utility function $U(W)$, the optimal bet is derived from that. Kelly corresponds to $U(W) = \log(W)$. Critics say "Who said $U=\log$?" Proponents say "Log is implied by compounding."
