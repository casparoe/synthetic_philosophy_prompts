      *   **Section 1: The Mathematical Divergence (Ergodicity).** Explain $E[W]$ vs. $E[\log W]$. The difference between ensemble averaging (many parallel universes) and time averaging (one life played repeatedly). Proponents argue physics/math dictates time averaging in multiplicative systems. Critics argue math doesn't dictate psychology.
