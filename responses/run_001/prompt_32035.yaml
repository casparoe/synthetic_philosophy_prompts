      *   *Ergodicity:* The recent work by Ole Peters is crucial here. It frames the dispute not as "utility" but as "ergodic vs. non-ergodic dynamics." This suggests the critics are using the wrong math framework for repeated multiplicative processes (Ensemble averaging), while proponents use Time averaging.
