answer: |-
  Subject: Plan for your presentation on sortition

  Hi there, it is great to hear that your time on the citizens assembly was such a transformative experience, and I can see why you want to help your neighbors understand that a lottery is not quite the same thing as tossing a coin for the mayor. To make this twenty-minute session work without triggering immediate dismissal, you have to treat the explanation as a specific architectural project where the foundation determines whether the roof holds, and that foundation is the absolute distinction between selecting who gets to speak and deciding who gets to govern. You absolutely have to place this concept first before you even define the word sortition because if they believe you are suggesting random people make laws, they will shut down instantly, so frame it early as a method for assembling a representative sample of people to give informed recommendations rather than a replacement for elected officials. Once that dependency is secured, meaning they accept that the random selection is for participation rather than ultimate authority, you can move into the definition and explain that lotteries are actually statistical tools used to mirror the community demographics rather than favoring those who know the right buttons to push to win votes.

  For your central example, you should rely entirely on the citizens assembly you just served on regarding the land-use plan rather than dragging in ancient Athens, because while Athens is the historical origin, it brings up baggage about slavery and direct democracy that distracts from the modern mechanism, whereas your experience offers something tangible, local, and recently successful that your neighbors can verify or at least contextualize within their own town. Using your own testimony allows you to describe the safeguards in place, such as the paid facilitation, the expert briefings, and the time allowed for learning, which directly counters the incoming misconception that randomness implies incompetence or laziness. People will walk in thinking this is about unqualified strangers making snap decisions, but if you describe your room as being equipped with the same data and access to experts as any city council member has, you will shift their halfway-formed misconception toward viewing the group as a temporary committee of peers rather than a gamble. You should intervene against the fairness objection right after you describe the support system, noting that elections often filter out the working poor or busy parents who cannot campaign, whereas a lottery includes them precisely because they represent the silent majority of voters who never run.

  By the time you reach the final five minutes, you need to introduce the limitation that clarifies the scope of this conversation so you do not get dragged into debates about constitutional overhaul or replacing the school board entirely, and you should openly state that this discussion is only about mini-publics for complex local issues where partisan gridlock exists, not a proposal to dismantle the current voting system. To check if they actually understood the mechanics rather than just stopped arguing, close with a question that forces them to articulate the boundary you established, specifically asking them to tell you what the difference is between the recommendation power of your randomized group and the binding vote power of the elected council, because if they answer with a clear distinction between advice-giving and law-making, they have grasped the model, whereas if they say things sound like the council but random, they are still stuck on the initial fear of randomness. I hope this structure helps you facilitate a productive conversation, and please feel free to reach out if you want to rehearse the opening analogy.

  Best regards,

  Your Friend
