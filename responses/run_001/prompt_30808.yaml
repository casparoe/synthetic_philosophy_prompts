answer: |-
  The regulatory patchwork you observed rests on a pragmatic compromise that treats neuroanatomical complexity as a proxy for sentience to ensure administrative feasibility, implicitly admitting philosophical inconsistency while deferring the harder questions of substrate-independent consciousness.

  **Reconstructing the Implicit View**
  The current regulations operate on a modified precautionary principle anchored in **neuroanatomical reductionism**. The implicit theory posits that subjective experience (qualia)—distinct from mere nociceptive reflex—requires a certain level of central nervous system integration, which is assumed to correlate with evolutionary distance from humans. Vertebrates share our basic neural architecture, making their capacity for suffering empirically probable and intuitively accessible. Cephalopods are the singular invertebrate exception recognized in major jurisdictions like the EU because convergent evolution has produced large, distributed brains with sophisticated behaviors (tool use, play, camouflage) that strongly imply a rich inner life. By contrast, insects and nematodes are categorized functionally as automata; their avoidance behaviors are interpreted as hard-wired survival algorithms rather than phenomenological experiences. Simulations fall outside the scope entirely because the ethics regime is fundamentally ontological—it governs *living things*, not *processes*. Without a biological body subject to homeostatic disruption or tissue damage, there is no "welfare" to regulate under current legal definitions.

  **Consistency and Coherence**
  This practice is philosophically inconsistent but politically stable. It fails the test of substrate neutrality: if a spinal cord simulation perfectly replicates the firing patterns of a painful stimulus pathway, a strict functionalist view would suggest moral equivalence to the mouse, yet the simulator faces no scrutiny while the mouse requires anesthesia approval. Similarly, the boundary between insects and cephalopods is shaky; honeybees demonstrate advanced cognition, metacognition, and emotional states, yet they remain largely unprotected. The inconsistency arises from conflating **moral ontology** (who counts?) with **regulatory taxonomy** (how do we categorize this?). The rules work because they align with public intuition (pity for mammals, indifference to bugs) rather than a rigorous derivation from the physics of consciousness.

  **Principles vs. Administrative Accidents**
  *   **Committed Principles:** The framework strictly commits to a distinction between *nociception* (detection of harmful stimuli) and *pain* (affective suffering). This explains why nociceptive flies are ignored while mice are protected. It also commits to a biological prerequisite for moral standing; currently, ethics applies to organisms, not artifacts.
  *   **Historical/Administrative Accidents:** The specific cut-off at vertebrates is largely arbitrary and rooted in historical precedent where mammalian biology dominated medical research. The inclusion of cephalopods is a relatively recent scientific correction (EU Directive 2010/63/EU) acknowledging that the old vertebrate-only model was scientifically outdated, but its retention elsewhere suggests inertia. The exclusion of simulations is a lag effect; regulators haven't encountered widespread scenarios where the simulation itself is considered a patient rather than a tool.

  **Regulating Computation Regardless of Substrate**
  If we adopted the view that morally relevant computations matter independently of their hardware, the regulatory landscape would require a fundamental paradigm shift toward **computational sentience governance**:

  1.  **New Regulatory Bodies:** Institutional Animal Care and Use Committees (IACUCs) would need parallel "Institutional Computational Ethics Boards" authorized to review simulation architectures, not just outcomes.
  2.  **Metric Shift:** Approval criteria would move from physical endpoints (weight loss, incision size) to computational endpoints. Researchers would need to justify the *complexity* of the network (e.g., number of simulated neurons, presence of recurrent loops, global workspace dynamics) relative to the scientific necessity. Higher fidelity models mimicking pain circuits would require higher justification tiers.
  3.  **Definition of Harm:** "Harm" would be redefined as the interruption of integrated informational processes or the forced activation of aversion subroutines without consent mechanisms. Simply deleting a high-fidelity simulation could become ethically equivalent to euthanasia, requiring documentation akin to animal sacrifice logs.
  4.  **Verification Protocols:** We would face the immediate "Other Minds Problem" scaled to silicon. Regulations would need to mandate specific architectural transparency to verify that a simulation possesses the hallmarks of conscious processing (e.g., Integrated Information Theory metrics) rather than just behavioral mimicry.
  5.  **Resource Allocation:** Ethical burden might shift away from physical animal breeding (which requires feed, space, and waste management) toward computing resources, creating a new economic friction between computational cost and moral permission.

  Ultimately, moving to substrate-independence dissolves the easy taxonomic lines drawn between mice, octopuses, and fruit flies. It forces science to confront whether it values the *structure of processing* or the *biological vessel*, a transition that would likely stall many fields until a consensus on the measurement of machine consciousness emerges.
