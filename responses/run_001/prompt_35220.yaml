      *   *Rule Utilitarianism:* Possible, but gets sticky on Case 3 vs Case 1. Why is the hospital worth one life but pollution isn't canceled by donation?
      *   *Deontology (Kantian):* Strong contender.
          *   Case 1: People as ends, not means. (Fits).
          *   Case 2: Pollution harms specific others; charity helps others. Doesn't negate the violation of the village. (Fits).
          *   Case 7: Bribery treats the system/people as means. (Fits).
          *   Case 4: Perfect vs. Imperfect duties? Saving a life (imperfect?) overrides promise (perfect?). Usually, Deontologists say saving a life overrides keeping a trivial appointment.
