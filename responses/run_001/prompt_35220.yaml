              *   Most philosophers distinguish bodily rights from property rights. So they can hold both.
              *   But what about **Case 6**? It's the one the user is struggling with.
              *   Advice: Pick a side based on the dominant thread. The dominant thread (1, 2, 7) is Anti-Tradeoff (Deontological). The counter-thread (3, 4, 8) is Consequentialist/Necessity.
              *   The user seems to lean Deontological regarding "Means" (Can't kill, can't pollute, can't bribe). They lean Necessity regarding "Basic Needs" (Bread, Hospital construction, Medical Emergency).
