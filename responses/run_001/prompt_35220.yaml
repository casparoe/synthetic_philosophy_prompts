      *   *Rights-Based / Threshold Deontology:* This looks like the strongest candidate.
          *   Principle: We have rights that generate constraints on action. However, these rights might be overridden only under extreme necessity thresholds, often requiring compensation or due process.
          *   Constraint: You cannot use persons merely as means (Case 1, 7).
          *   Offset: Some violations require compensation to be permissible (Case 3).
          *   Priority: Basic needs (life/survival) trump abstract rules/property rights (Case 8, possibly 4).

      *   *Proposed Synthesis:* **Non-Commutative Rights with Necessity Exceptions.**
          *   Standard Rule: Rights violations (harm, lying, stealing, breaching promises) are not "canceled out" by positive externalities elsewhere (Cases 1, 2, 7).
          *   Exception: In cases of extreme disparity of stakes (Survival vs. Comfort) *and* ideally with compensation/fairness, the rule yields (Cases 3, 4, 8).
