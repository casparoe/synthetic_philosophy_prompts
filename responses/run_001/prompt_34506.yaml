prompt: |-
  In my campus EA group someone keeps ending arguments about career choice with "earning to give." Last week it got used to shut down a discussion about whether one of us should take a job at a nonprofit doing global health logistics versus a consulting job that pays three times as much. The claim seemed to be that the consulting job is obviously the more ethical choice because you can donate the difference, but I'm not sure whether that's actually what the slogan says, or whether it's even true on any precisification. Can you lay out the different precise claims "earning to give" could be making—about the size of the donation, about whether earning-and-donating dominates direct work, about replaceability, about what the counterfactual actually is—and say for each whether it's trivially true, substantive and defensible, or just false? And then tell me which reading the consulting-job argument actually needs, and whether that reading survives. I want a list I can bring to the next meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Campus Effective Altruism (EA) group debate.
      *   **Conflict:** One member uses "Earning to Give" (EtG) as a trump card to end arguments about career choice (specifically, consulting vs. nonprofit global health logistics).
      *   **User's Skepticism:** Unsure if EtG actually supports this claim or if it holds up under scrutiny.
      *   **Task:** Lay out different precise claims "earning to give" could be making (donation size, domination, replaceability, counterfactuals), evaluate their truth status (trivially true, substantive/defensible, false), identify which reading is needed for the consulting argument, and assess if that reading survives.
      *   **Format:** A list suitable for bringing to a meeting (clear, structured, actionable).

  2.  **Deconstruct "Earning to Give":**
      *   What does EtG actually mean in EA literature? It's not a monolithic slogan. It has evolved and been debated (e.g., by William MacAskill, Peter Singer, Tobias Baumann, etc.).
      *   Key variables: Marginal utility of money, counterfactual impact of direct work, opportunity cost, replaceability, personal fit/satisfaction (longtermism/wellbeing).

  3.  **Brainstorm Precise Claims/Variations:**
      *   *Claim 1: The Absolute Donation Claim.* Earning more allows you to donate more.
      *   *Claim 2: The Marginal Impact Claim.* $ donated > Direct Work impact (per hour).
      *   *Claim 3: The Counterfactual Claim.* If you don't take the high-paying job, someone else will do the good work anyway (replaceability).
      *   *Claim 4: The Optimization Claim.* Choosing high pay maximizes total good for your specific skill set/career capital.
      *   *Claim 5: The Moral Duty Claim.* You are morally obligated to choose EtG if it yields more impact.

  4.  **Evaluate Each Claim (Truth Status):**
      *   *Absolute Donation:* Trivially true (high salary = more disposable income), but irrelevant without context of what else you could do.
      *   *Marginal Impact:* Substantive/Defensible *under certain conditions* (e.g., very high multiplier on donations vs. low-impact direct role). Often false in practice due to diminishing returns on giving or high-impact roles being scarce.
      *   *Counterfactual/Replaceability:* Highly sensitive to specifics. Often the weakest link in naive EtG arguments. If the nonprofit role is filled only because *you* took it, replacing yourself doesn't happen.
      *   *Optimization:* Defensible for some profiles, not all. Depends on "career capital" and burnout risk.
      *   *Moral Duty:* Controversial. Most EAs argue for "doing the most good," not necessarily EtG specifically.

  5.  **Analyze the Specific Scenario (Consulting vs. Global Health Logistics):**
      *   Consulting pays 3x. Can they donate 200% of the difference? Maybe.
      *   Does the nonprofit have funding constraints? Usually yes. But is the user replaceable? If they leave, does the org hire someone equally effective immediately?
      *   Does the consultant role lead to better leverage later? Or just burnout?
      *   Is "3x salary" the real metric? Net worth after tax/living expenses matters more.
      *   The "Shut Down" Aspect: Using EtG as an argument-stopper suggests dogmatism rather than case-by-case analysis.

  6.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the frustration. Define EtG clearly.
      *   *The Taxonomy:* Create distinct "Readings" of EtG.
          *   Reading 1: Arithmetic (More money = More donations).
          *   Reading 2: Comparative Efficiency (Donated dollars > Labor hours).
          *   Reading 3: Replaceability (Someone else fills the direct role).
          *   Reading 4: Long-Term Career Capital (High pay now unlocks bigger impact later).
      *   *Evaluation:* Label each as T/SD/F. Explain why.
      *   *Application to the Case:* Which one is the colleague using? Likely Reading 2 + 3 combined.
      *   *Survival Test:* Why might the colleague's version fail? (Non-profit constraints, marginal utility of time, burnout, specific mission criticality).
      *   *Conclusion/Talking Points:* How to respond constructively.

  7.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Correction:* Don't just say "False." Say "Contingent on X." EA people love contingency.
      *   *Nuance:* Mention "Room for More Funding." If the non-profits can't spend another dollar efficiently, EtG wins easier. If they need skilled labor urgently, Direct Work wins.
      *   *Tone:* Professional, analytical, respectful of EA principles but skeptical of dogmatism. Aim for "Charitable interpretation followed by critique."
      *   *Formatting:* Use bolding, bullet points, and clear headings for readability in a meeting setting.

  8.  **Final Review against User Prompt:**
      *   List for the meeting? Yes.
      *   Different precise claims? Yes.
      *   Evaluate truth status? Yes.
      *   Identify needed reading for the specific argument? Yes.
      *   Does it survive? Yes.

  9.  *(Self-Correction during drafting)*: Make sure to distinguish between "Earning to Give" as a strategy vs. a moral imperative. The user mentioned "obviously the more ethical choice." That implies a moral imperative claim. I need to highlight that distinction. Also, ensure the "Counterfactual" part is clear because that's usually the failure point (the "What if I didn't do this?" question).

  10. **Final Polish:** Check for clarity and punchiness. Ensure the "Takeaway" is actionable. (Proceed to generate output based on these thoughts.)

  *(Wait, one more thing)*: I should explicitly address the "Three Times As Much" math. A 3x salary doesn't always mean 3x donation ability due to taxes and cost of living. I'll add a note on "Net Donation Potential."

  Okay, ready to write.s
answer: |-
  This is a common friction point in EA communities. When "Earning to Give" (EtG) is used as a conversation stopper, it often functions as a dogma rather than a hypothesis being tested. To engage this productively, you need to dissect *which* specific version of EtG is being invoked, because they have wildly different evidentiary standards.

  Below is a structured list you can bring to your meeting. It breaks EtG down into four precise claims, evaluates their logical status, and then applies them to your specific consulting-vs-logistics scenario.

  ***

  # Fact Sheet: Precision of the "Earning to Give" Argument

  ### Part 1: Four Distinct Interpretations of EtG
  "Earning to Give" is a shorthand, not a single proposition. Here are the four precise claims it could represent:

  #### Claim 1: The Arithmetic Claim ("More Money = More Good")
  *   **The Proposition:** Taking a higher-paying job allows me to donate a larger absolute amount than taking a lower-paying direct-work job.
  *   **Status:** **Trivially True.**
  *   **The Catch:** Mathematically obvious, but ethically incomplete. Having \$1 million to donate isn't good unless you actually donate it, and having \$100k to save lives in a high-leverage role might be better than donating \$1M inefficiently. This claim ignores the comparative value of direct work.

  #### Claim 2: The Efficiency Claim ("Dollars Beat Hours")
  *   **The Proposition:** The marginal impact of my donated money ($X) exceeds the marginal impact of my labor performing direct work (Job Y). Therefore, my time is best spent earning money elsewhere.
  *   **Status:** **Substantive and Conditionally Defensible.**
  *   **Why:** This depends heavily on two variables:
      1.  **Room for More Funding:** Does the nonprofit actually need the money more than I need the role? If the org is funded but understaffed with skilled experts, money cannot substitute labor.
      2.  **Impact Multiplier:** Is there an effective charity where \$1 saves 100 lives, while my direct work saves 50?
  *   **Failure Point:** This claim fails if the direct role involves critical bottlenecks (specialized skills/focus) where no amount of extra funding can easily replicate the contribution.

  #### Claim 3: The Replaceability Claim ("I Am Expendable")
  *   **The Proposition:** If I reject the direct-work job, someone else will fill it and achieve roughly the same impact; therefore, my personal presence adds zero net marginal value.
  *   **Status:** **Often False / Highly Sensitive.**
  *   **Why:** This is a counterfactual argument. In many sectors (especially specialized ones like global health logistics), finding competent replacements is difficult. Furthermore, *you* might perform better than the hypothetical replacement due to superior alignment, motivation, or specific knowledge gained during the interview process. Assuming perfect substitutability is often an overestimation of market efficiency.

  #### Claim 4: The Optimization Claim ("This Maximizes Total Lifetime Impact")
  *   **The Proposition:** Taking the high-paying job builds "career capital," increases future influence, or prevents burnout such that my lifetime total impact is higher than taking the direct role now.
  *   **Status:** **Speculative and Personal.**
  *   **Why:** Consulting can build networks or skills useful for future leadership. However, it can also lead to burnout, loss of focus, or path-dependency where you become locked into a corporate track. This requires honest self-assessment about resilience and long-term goals.

  ---

  ### Part 2: Applying to Your Scenario
  **The Debate:** Consulting Job (\$300k+) vs. Nonprofit Global Health Logistics (\$100k).
  **The Argument:** "Consulting is the obvious ethical choice because you can donate the difference."

  To make this argument valid, the person using it must combine **Claim 2** (Efficiency) and **Claim 3** (Replaceability). They are asserting:
  1.  *The nonprofit would function fine even if you weren't there (or could find someone else).*
  2.  *Your money, given to highly effective charities, will do more good than the logistics work you would actually do.*

  #### Does This Reading Survive Scrutiny?
  **Likely Not.** Here are the specific counters you can raise regarding the survival of this argument:

  **1. The "Direct Impact" Gap**
  *   **The Risk:** In global health, logistics bottlenecks (supply chains, cold storage, delivery infrastructure) often cause interventions to fail regardless of funding. If the job solves a bottleneck that money alone cannot fix, Claim 2 collapses.
  *   **Question for the Group:** *"Is this specific role a 'funding bottleneck' (money solves it) or a 'talent bottleneck' (skills solve it)?"*

  **2. The Replacement Fallacy**
  *   **The Risk:** Just because there are other qualified candidates doesn't mean they will be hired if you turn it down. Hiring processes are imperfect and slow. If you decline, the vacancy remains empty for months.
  *   **Question for the Group:** *"If we say 'someone else will do it,' do we have evidence that hiring pipelines are so efficient that our rejection guarantees a hire today?"*

  **3. The Cost-of-Living & Taxes Reality**
  *   **The Risk:** A 3x salary does not translate to 3x donation capacity. High-earner taxes and associated costs (commuting, urban housing required for client meetings, professional image upkeep) eat margins.
  *   **Calculation:** Does the *net* donation from consulting exceed the impact of the direct work *after* taxes and living adjustments?

  **4. The Burnout Discount**
  *   **The Risk:** Consulting is notoriously draining. If working at the high-paying firm causes you to quit the EA ecosystem entirely within two years, the EtG calculation is wrong.
  *   **Question for the Group:** *"What is the probability you stay committed to EA long-term if you take the grind-heavy path versus the mission-aligned path?"*

  ---

  ### Part 3: Summary for the Meeting (Talking Points)

  *   **"Earning to Give" is a Hypothesis, Not a Dogma.** It is not a fixed rule like "save lives directly." It is a contingent calculation based on marginal impact.
  *   **We Need Data, Not Intuition.** Simply stating EtG is superior is insufficient. We need to compare the specific NGO's budget gaps vs. the specific consultancy's projected donations.
  *   **Replaceability is the Weak Link.** We cannot assume the NGO can instantly replace the candidate's unique contribution.
  *   **Proposal:** Instead of letting "Earning to Give" win the debate by default, we should agree to model the decision together. Let's estimate the NGO's actual financial gap and calculate how many lives the consulting difference would fund, then compare that to the estimated lives saved by the logistics role. Whichever number is higher is the ethical choice—until new data arrives.

  ***

  ### Suggested Closing Line
  *"If we accept EtG as an automatic shut-down, we aren't doing EA analysis; we're engaging in moral licensing. Let's look at the counterfactuals instead."*
