prompt: |-
  ok so I just spent like two hours at a coffee shop arguing with my friend about the Gibbard-Satterthwaite theorem and I am still a little mad about it. He's a political scientist who works on election design, and he keeps telling me the theorem is basically irrelevent to actual voting systems, because it's a worst-case result: it only says that if you demand a rule be strategyproof for every possible profile of preferences, you get stuck with dictatorship. But in the real world, he says, the mechanism designer has some probability distribution over what people actually prefer (or could estimate one), and the requirement that actually matters is just that nobody can gain in expectation by misreporting under that distribution. And he claims that under that weaker requirement, plenty of non-dictatorial rules are fine — for a lot of common rules, he says, the profiles where lying actually helps you are a small fraction of what would come up under any realistic distribution, so the expected payoff from cheating is basically zero. I pushed back by saying that if you just bake the disitribution into the definition of "strategyproof," the theorem becomes vacuous — you've defined away the problem — and that the whole point of G-S is that it's distribution-free, so it holds no matter what the designer knows or doesn't know. But he said my objection just shows I don't understand what strategyproofness is for.

  I'm taking a social choice seminar this semester and G-S was on the first reading, so I'd like to actually settle this instead of just being mad. Can you lay out the precise difference between the two notions — strategyproofness in the G-S sense (no agent can benefit at any profile) versus "no beneficial manipulation" under a known distribution (no agent can raise their expected utility by misreporting) — and tell me whether my friend is right that the distributional notion is the more defensible target for a real voting system, or whether I'm right that it just makes the theorem vacuous? And is there a middle ground, like a quantitative notion of "how manipulable is this rule under this distribution," that both of us could accept? I feel like we're both talking past each other about what the theorem is even supposed to be doing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

