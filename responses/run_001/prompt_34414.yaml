      *Selection:* Goodhart's Law is the foundational name. Campbell's Law adds the institutional nuance. For a deeper philosophical framing, *Instrumental Rationality vs. Substantive Rationality* (Weber/Merton) and the distinction between *Epistemic Values vs. Social/Bureaucratic Values* is crucial. Also, *Hannah Arendt's "Banality of Evil"* (though maybe too strong? No, it fits the bureaucratic obedience to procedure over substance). Actually, *Stuart Hall* or *Michel Foucault* on disciplinary power might resonate, but Merton's *Manifest and Latent Functions* is probably more precise.
