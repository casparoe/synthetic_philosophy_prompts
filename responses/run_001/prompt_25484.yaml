answer: |-
  You have hit on one of the most famous and vexed topics in the philosophy of science. Your intuition is spot-on: formally, if you know $E$ (e.g., Mercury's orbit), its probability is 1, so seeing that Theory $H$ implies $E$ shouldn't change your belief in $H$. Yet, historically, the explanation of Mercury’s orbit was a massive boost to General Relativity.

  This is the **Problem of Old Evidence**.

  Here is the breakdown of whether this matters for everyday reasoning, how to use it when evaluating theories, and where the mathematical glitch actually lies.

  ### 1. Is this a flaw in reasoning or a math glitch?
  It is mostly a **technical glitch** caused by how we define "probability" in the abstract.

  In strict Bayesian terms, if you know a fact is true, your subjective probability for it must be 1. You cannot update your belief about a fact you already possess. However, this formalism assumes a static mind that instantly knows everything that follows logically from its beliefs.

  In reality, human reasoning is different. When Einstein looked at the data on Mercury (which everyone knew) and realized his equations predicted it perfectly, he didn't learn the *data* (he already knew the orbit); he learned a **connection**. He learned that $Theory \implies Data$.

  So, for the ordinary person: **Do not treat this as a reason to discard old evidence.** The feeling that "explaining something familiar is good" is correct. The math is just struggling to model the moment we discover the logical link between a theory and a known fact.

  ### 2. Should you be more skeptical of "Old Evidence"?
  Yes. While explaining old evidence is *necessary* for a good theory, it is less *compelling* than predicting new evidence. Here is why an ordinary person should weight them differently:

  #### The "Curve Fitting" Risk
  If a scientist has ten years of weather data and wants to create a theory to explain it, they can almost certainly tweak their formulas until they match the past records perfectly.
  *   **New Prediction:** If the same scientist uses those exact formulas to predict tomorrow's weather, and gets it right, that is hard-won evidence.
  *   **Old Evidence:** Matching the last ten years of weather tells you they didn't just pick random numbers, but it doesn't prove their underlying mechanism is correct.

  For an ordinary reader: **Be wary of "Post-Hoc Rationalizations."** If a theory pops up specifically to explain a mystery that people were already worrying about (e.g., "A conspiracy explains why the building collapsed"), ask yourself: Could this story have been invented *after* the fact to fit the narrative? That is the danger zone of old evidence.

  #### The Value of Novel Prediction
  When a theory predicts something nobody expected (like Einstein predicting the bending of light around stars, which was observed later during a solar eclipse), it carries immense weight. Why? Because there are infinitely many ways to draw lines through past data, but very few ways to guess a future point correctly by accident.
  *   **Rule of Thumb:** If you encounter a new idea, look for what it predicts *next*. If it only explains what happened *before*, view it as a hypothesis, not a proof.

  ### 3. Practical Guidelines for Evaluating Theories
  Even though the "math" says old evidence shouldn't count, your brain says it should. So, how do you reconcile this? Here is a practical framework for weighing evidence without needing a PhD in statistics.

  **A. The "Unification" Bonus**
  Sometimes, old evidence *does* matter deeply. If a theory takes two unrelated mysteries (e.g., falling apples and planetary orbits) and explains them both with one simple mechanism, that is strong evidence.
  *   **Action:** If a new theory unifies disparate facts we already knew, give it credit for simplicity and elegance. This is often more valuable than a theory that fits one old fact perfectly but requires five new assumptions to do so.

  **B. The "Falsifiability" Test**
  A theory that only explains old evidence is often unfalsifiable. It claims to explain everything that has already happened.
  *   **Action:** Ask the proponent: "What observation would prove you wrong?" If they answer with, "Well, even if X happens, my theory accounts for it," that is a red flag. They are using old evidence to bloat the theory rather than letting it risk a new test.

  **C. Distinguish "Fitting" from "Deriving"**
  As mentioned earlier, the magic isn't just that the theory matches the fact; it's that it **derives** the fact from first principles.
  *   **Scenario:**
      *   *Bad:* "We added a variable called 'Gravity-Shift' to our equation so that it matches the Mercury data." (This is curve-fitting.)
      *   *Good:* "Our equations require no adjustments for Mercury; the precession comes out naturally as a consequence of mass curving space." (This is derivation.)
  *   **Action:** If a theory relies on tweaking parameters to make old facts work, be skeptical. If the old facts fall out naturally without tuning, trust it more.

  ### Summary
  The Problem of Old Evidence reveals a limitation in the math, not in your common sense. You are right to feel that explaining Mercury's orbit confirmed General Relativity.

  However, for your own epistemic hygiene:
  1.  **Prioritize Novelty:** Treat theories that make surprising, successful predictions as higher quality than those that merely retell history.
  2.  **Watch for Tuning:** Be suspicious if a theory feels like it was reverse-engineered to match specific known problems.
  3.  **Reward Simplicity:** Old evidence only adds value if the theory explains it *without* adding complexity.

  Think of it this way: **Anyone can drive home after they've been there once. It takes skill to navigate to a new city without a map.** Explaining old evidence shows you're capable of driving. Predicting new evidence shows you understand the map.
