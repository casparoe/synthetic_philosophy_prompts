      *   *Ontological Relativity:* Does "reality" depend on the observer? (Quinean move).
      *   *The "Point Particle" Issue:* SR describes worldlines, but does existence require persistence? (Growing Block?).
      *   *General Relativity (GR):* Cosmological time/foliation breaks the symmetry of SR locally. Is the universe actually a block or expanding into something?
      *   *Quantum Mechanics (QM):* Non-locality/Entanglement suggests a privileged frame might exist (Bohmian mechanics). Collapse models.
      *   *Epistemic vs. Ontic:* Just because we *can't distinguish* a frame doesn't mean the frame *doesn't exist*. (Undetectable metaphysics).

