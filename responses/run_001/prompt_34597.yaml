      *   **Section 1: The Fatal Flaws (The Logic of the Argument).** Focus on the jump from Epistemology/Ontology and the Transitivity Assumption.
      *   **Section 2: The Physically Live Possibilities.** QM collapse, Preferred Foliation (Lorentz vs. Einstein).
      *   **Section 3: The Metaphysical Dissent (Philosophical Moves).** Conventionalism, Ontological Relativity.
      *   **Sorting the Defeaters:** Explicitly rank them (Fatal, Dangerous, Awkward).
