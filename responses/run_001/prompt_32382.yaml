answer: |-
  Dear Friend,

  It sounds like you and your drinking partner encountered one of the classic impasses in the philosophy of language and logic, where neither of you is completely wrong but both are perhaps missing the broader context of how these arguments are viewed today. The good news is that arguing over David Lewis’s triviality results with half a pint in you is a time-honored tradition among philosophers of conditionals, largely because the arguments are subtle enough to survive several rounds of beer-fueled revision, yet robust enough to prevent a quick settlement. To adjudicate this, we have to look closely at what Lewis actually proved versus what people have taken him to prove, and whether the proposed escapes you discussed actually hold water under the scrutiny of contemporary scholarship. Your friend’s opening gambit was technically accurate regarding the core mechanism of the theorem, which is that if you insist the probability of an indicative conditional equals the conditional probability of its consequent given its antecedent, and you assume this relationship holds stably across updated credences, you force the probability space to become trivial. That is, all conditional probabilities converge on unconditional ones, rendering the conditional meaningless as a distinct operator. He is correct that this result suggests a deep tension between the idea that conditionals express standard truth-evaluable propositions and the Ramsey Test intuition that governs how we assess them. However, his leap to the conclusion that they cannot express propositions is slightly too hasty, although it represents a very serious position known as expressivism or anti-realism about conditionals.

  Your countermove in step two, suggesting that the Equation might only hold for current credence functions rather than all those reachable by conditionalization, is a recognized technical maneuver but comes with significant costs. You were right that restricting the domain of validity of the Equation blocks the mathematical proof of triviality because the derivation requires iterating the conditionalization process indefinitely. However, your friend was also right to note that this move feels ad hoc and violates the spirit of the Ramsey Test. The Ramsey Test is meant to capture the dynamic link between believing a conditional and planning to believe the consequent upon learning the antecedent. If the link holds only for now and not for future epistemic states after receiving evidence, you undermine the normative guidance the conditional offers. Furthermore, Lewis did produce follow-up results showing that even weaker assumptions about probability structures could generate triviality without relying on full closure under conditionalization. So while you were technically correct that the proof could be blocked by restricting the scope, your friend was substantively correct that doing so leaves you with a fragmented account of belief update that few find satisfying. This means the triviality problem remains a massive obstacle for anyone trying to maintain both the Equation and standard propositional semantics.

  This brings us to the divergence in steps four and five where you diverge on three-valued semantics and your friend diverges on expressivism. Here you arguably made the stronger move philosophically, even if your friend correctly identified the high cost. By pointing out that triviality proofs rely on classical two-valued Boolean algebras, you highlighted that moving to a many-valued framework, such as the three-valued logic associated with Bas van Fraassen or Robert Stalnaker’s later work, does mathematically block the derivation of the contradiction. In these systems, the conditional lacks a truth value when the antecedent is false, which disrupts the application of the Law of Total Probability necessary for Lewis’s proof. Your friend’s insistence that this is merely relabeling assertibility conditions touches on a genuine metaphysical divide. Dorothy Edgington and Allan Gibbard argue that once you abandon classical truth values, calling them propositions becomes misleading. However, many philosophers currently working on conditionals prefer your path of modifying the truth conditions rather than abandoning them altogether. This is because maintaining some notion of truth-aptness allows for a smoother integration with other logical operators. You are on firmer ground here than your friend, as the field has not universally accepted the conclusion that conditionals must be non-propositional; rather, it has largely moved toward the view that they are propositions but with non-standard truth tables or truth conditions dependent on context.

  The critical battleground emerges in steps six through nine, specifically regarding the embedding problem and the viability of logic. You were absolutely right to press on the embeddability of conditionals. This is widely considered the single biggest challenge for the non-propositional view. If a conditional does not express a proposition, it becomes extremely difficult to explain how it functions in complex sentences like disjunctions or nested conditionals. While your friend attempted to minimize this by saying embedded conditionals are notorious and negation is manageable, this is a deflection. There have been extensive attempts to solve this, such as Chris Manley’s work on the assertibility of complex conditionals, but a unified semantic theory for embeddings remains elusive for expressivists. In contrast, truth-conditional accounts, even non-classical ones, have much more natural machinery for handling compositionality. However, your concern about validity and inference rules was met with a fair pushback in step nine. It is true that standard truth-functional validity collapses if truth values are not bivalent, so proponents of non-propositional views must define validity in terms of preservation of acceptability or degrees of confidence, following Adam’s thesis on validity. This is a coherent alternative logic, but as you noted, it requires a lot of re-engineering of our understanding of reasoning. Conversely, truth-conditional accounts struggle to justify the material conditional and face the triviality threat unless they deny the Equation strictly.

  To answer your final question about who is right and what the current state of affairs is, we have to look at the dialectic more holistically. Your friend was right that Lewis’s results are devastating for any account that treats the conditional as a standard propositional connective governed strictly by the Equation. No one accepts the naive truth-conditional picture of conditionals anymore because of this. However, your friend was wrong to conclude that this necessitates giving up truth conditions entirely. Your instinct was better in that direction. The dominant view in contemporary philosophy of language, championed by figures like Angelika Kratzer and Sarah Moss, tends to favor a modal semantics where the conditional is analyzed relative to a set of worlds or information states, which preserves propositional content but modifies how probability applies. These contextualist approaches essentially concede to you in step four that the Equation is not a universal law of logic but depends on the relevant domain of possibilities, thereby defusing the triviality result without abandoning the idea that conditionals describe facts or possibilities. Thus, while your friend has the stronger initial intuition regarding the severity of Lewis’s blow to classical theories, your defense of modified truth-conditional accounts aligns more closely with the productive research programs currently active in formal semantics.

  Ultimately, the debate lands in a state of equilibrium where most experts think Lewis proved that the Equating Thesis cannot hold universally for classical propositions, but they disagree on whether this kills propositions or just the specific definition of them. Your friend bites the bullet harder by embracing non-propositionalism, which solves the triviality problem cleanly but leaves the embedding and logic puzzles unsolved. You defend a more conservative modification of the proposition concept, keeping truth conditions alive but admitting they are three-valued or context-sensitive, which keeps embedding easier but requires defending why the Equation fails in certain contexts. In my professional assessment, neither of you is strictly speaking right that the other is dead wrong, but your approach is currently more fruitful for integrating conditionals into a broader semantic framework. The tragedy of Lewis’s result is that it destroyed the easy marriage of probability and truth that many hoped existed, forcing us to choose between losing the neat probability formula or losing the neat proposition. Most of us are willing to lose the formula to save the proposition, which puts you slightly ahead in the war of attrition, provided you are willing to explain why rational agents don’t always update their beliefs exactly according to conditional probability. If you are drinking again next week, I would suggest asking your friend if they can handle the complexity of indexicality in the antecedent of a nested conditional, because that is the real frontier where both of your positions will likely run into fresh trouble together.
