prompt: |-
  So I just spent like two hours arguing with my friend about Lewis's triviality results and what they actually mean for indicative conditionals, and we went around in circles enough that I genuinely can't tell who was right anymore. We were both a few drinks in by the end so maybe that didn't help. I want you to go through the whole exchange and tell me who's right about what. You're a professional philosopher who works on conditionals and philosophical logic — think carefully, walk through each move, and don't pull any punches. Also please please just write in continuous prose, like an email — no bullet points, no headings, no bold, no tables, none of that. Just paragraphs.

  Here's how it went, as best I can reconstruct it.

  (1) He started by saying that Lewis's triviality results are basically a proof that indicative conditionals can't express propositions. The setup is: if 'if A then C' expresses a proposition, then the probability of that proposition ought to equal the conditional probability P(C|A) — that's the Ramsey test idea, that you assess a conditional by temporarily adding A to your beliefs and seeing how likely C is. But Lewis showed that if you assume that equation holds for a class of probability functions closed under conditionalization, the whole probability space collapses: you get that P(if A then C) just equals P(C) for any A and C, which is absurd. So indicative conditionals can't have truth conditions. End of story.

  (2) I said hold on, that's too fast. Lewis's proof relies on the equation holding for every probability function you can reach by conditionalizing — including the ones you get after conditionalizing on C or on not-C. But maybe the equation only holds for a rational agent's actual credence function, not for all the counterfactual ones. If you restrict the equation to the agent's current probabilities, the triviality argument doesn't go through. So the result doesn't force you to abandon truth conditions — it just forces you to be careful about which probability functions the equation applies to.

  (3) He said that's a fair technical point but it misses the spirit of the thing. The whole appeal of the Ramsey test is that it gives a unified account of how we evaluate conditionals. If you restrict the equation to only the current credence function, you're basically saying there's no principled connection between the meaning of a conditional and how we update it. That's a huge cost. Plus, Lewis had follow-up proofs that don't rely on conditionalization closure — he showed that even weaker assumptions lead to triviality. So restricting to current credence doesn't really save you.

  (4) I said okay, but there are other ways out. You could give a three-valued semantics where conditionals are neither true nor false when the antecedent is false, and then the probability of a conditional isn't the probability of truth but the probability of being true-or-neither, or something like that. The triviality proofs assume classical two-valued semantics, so three-valued approaches dodge them entirely. You don't have to give up truth conditions broadly construed — just classical truth conditions.

  (5) He said that's just relabeling the problem. If you go three-valued you're not really giving truth conditions in the ordinary sense, you're giving something more like assertibility conditions. And the deeper issue is that the triviality results show something structural: the way we reason with conditionals doesn't fit the mold of propositions at all. Dorothy Edgington and others have argued exactly this — the conditional is a device for expressing conditional probabilities, not for stating conditional facts. The triviality results aren't a bug to be dodged with technical maneuvers; they're a discovery about what conditionals are.

  (6) I said that's a pretty big bullet to bite. If conditionals don't express propositions, then they can't embed in truth-functional compounds — you can't negate them, you can't disjoin them, you can't put them inside quantifiers. But we do all those things in natural language. 'It's not the case that if it rains the picnic will be cancelled' is a perfectly intelligible sentence. If conditionals aren't propositional, what does that sentence even mean?

  (7) He said negation is actually the easiest case — 'not (if A then C)' is plausibly equivalent to 'if A then not C' or something near it, and you can give a probabilistic semantics for that without assuming the embedded conditional has a truth value. The harder cases are things like conditionals in the antecedents of other conditionals, but those are notoriously weird anyway — 'if the match will light if you strike it, then it's dry' is the kind of thing people argue about endlessly. So the embedding problem isn't a knockdown objection to the non-propositional view.

  (8) I said but that brings us to a different point. Even if you accept the non-propositional view, you still need to explain why conditionals behave so much like truth-apt things in inference. We use them in modus ponens, modus tollens, hypothetical syllogism. If they don't have truth conditions, what makes those inferences valid? The non-propositional view owes us a story about logic, and that story is way less developed than the truth-conditional one.

  (9) He said that's a fair challenge but the truth-conditional story isn't exactly in great shape either. The material conditional analysis gets the probabilities wrong. The Stalnaker semantics gets close but still has problems with the equation. And any truth-conditional account that satisfies the Ramsey test runs into Lewis's results. So the non-propositional view at least has the virtue of taking the Ramsey test seriously without collapsing into triviality. The logic question is a research program, not a refutation.

  (10) I said I guess that's where we landed — he thinks the triviality results push us to a non-propositional view of conditionals, I think they push us to a more sophisticated propositional view (like a three-valued semantics or a contextualist one), and we couldn't agree on which bullet is smaller. But I'm still not sure I even have the dialectic right. So, adjudicate: who's right about which specific claim, where did each of us go wrong if we did, and who has the stronger overall position? And what's the best current thinking on this — are the triviality results really as devastating as my friend thinks, or are they more of a puzzle to be solved within a broadly truth-conditional framework?
