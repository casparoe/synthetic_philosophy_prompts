  My friend who took a social choice seminar explained Sen's liberal paradox to me like this: "Sen showed that you can't have both individual rights and democracy. The proof is that if two people each get to decide some purely personal matter, and you also insist that the group choice respects what the majority prefers, you can get a cycle where the group prefers A to B, B to C, and C to A. The upshot is that liberalism and democratic decision-making are fundamentally inconsistent, and Sen's own response was that we should give up on trying to respect individual rights when they conflict with what everyone wants." Something about this strikes me as off — I though the paradox had to do with Pareto efficiency rather than majority rule — but I don't know the details well enough to say where he's gone wrong. Which parts of this summary are accurate, which are misrepresentations, and does his conclusion about rights and democracy actually follow from the accurate parts?
