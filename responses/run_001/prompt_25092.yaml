answer: |-
  First off, bravo on recognizing the pedagogical gap. Reading Popper is easy; feeling the *friction* of applying Popper is where the learning happens. If your students only understand falsifiability on a syllogism level, they haven't grasped why Kuhn, Lakatos, and Feyerabend pushed back.

  You are attempting to simulate a "crucial experiment" for their epistemological intuitions. The goal here isn't to teach them the solution; it's to inoculate them against thinking Popper was simply *right*. By the end of the hour, they should feel unsatisfied with Popper’s definition. That dissatisfaction is the entry point for the rest of the semester.

  Here is a full design for **"The Demarcation Tribunal."** I have run variations of this in grad seminars and undergrad tutorials. It works best when you refuse to give them the answer key.

  ### Part 1: The Setup & Materials

  **The Vibe:** Treat it like a high-stakes grant review committee or a disciplinary hearing. The authority lies with the *committee*, not the professor.
  **Grouping:** 15 students = 3 Committees of 5. Give each committee a different colored folder/whiteboard space.
  **Duration:** 60 Minutes (Hard Stop).

  **The Cards:** Do not print lists of theories. Print **scenarios**. This is crucial. If you just put "Astrology" on a card, they check their priors. If you put a description of the logic used, they have to apply the criterion.

  **The Deck Composition (approx. 12-15 cards per group):**
  *   **The Clear Cuts (Warm-up):** 2 cards. One clearly falsifiable (Classical Mechanics predicting planetary position). One clearly immunized against refutation (Marxist dialectic adapting to any revolution outcome).
  *   **The Poison Pills (The Conflict):** 6 cards designed specifically to break the binary.
  *   **The Duhem-Quine Traps:** 4 cards describing negative experimental results where the blame could shift.
  *   **The "Progressive" Trap:** 2 cards where a theory seems unfalsifiable but is intuitively respected (String Theory / Dark Matter).

  ### Part 2: The Card Content (Examples)

  Do not show the names of the theories until the debrief. Describe the methodology.

  **Card Type A: The Theory Description**
  > **Claim:** The "Universal Soul" hypothesis states that all human behavior is driven by the search for spiritual balance.
  > **Observation:** A subject acts violently.
  > **Interpretation:** They were spiritually imbalanced.
  > **Follow-up:** The same subject acts peacefully.
  > **Interpretation:** They achieved spiritual balance.
  > *Question:* Can this theory ever be proven wrong?

  **Card Type B: The Negative Anomaly**
  > **Theory:** Neutrinos travel at the speed of light.
  > **Data:** In this experiment, neutrinos arrived 60 nanoseconds faster than light speed allowed.
  > **Decision Point:** Does this falsify the theory immediately? What else could explain the result?

  **Card Type C: The Mathematical Entity**
  > **Theory:** There exist 11 spatial dimensions curled up at the subatomic level.
  > **Constraint:** We currently lack the particle accelerators required to observe them.
  > **Prediction:** If correct, certain mathematical symmetries will appear in gravity equations.
  > *Question:* If the prediction relies on math alone without empirical access for 50 years, is this "science" or "philosophy"?

  **Card Type D: The Retrodictive Fit**
  > **Theory:** Cognitive Psychology Model X explains memory.
  > **Method:** When a subject recalls a memory, researchers adjust variable Y in the model until the output matches the recall.
  > *Question:* If the model can be adjusted post-hoc to fit *any* memory result, is it scientific?

  ### Part 3: The Rules (The Protocol)

  Write these on the board. The constraint creates the conflict.

  1.  **Criterion:** Your only metric for "Science" is **Popperian Falsifiability**. (Something must be logically capable of being proven false by observation).
  2.  **No Appeals:** You cannot appeal to utility ("it works"), popularity ("scientists use it"), or truth ("it's already proved true").
  3.  **The Vote:** Each card gets a 2-minute deliberation. Verdict: `SCIENCE`, `PSEUDO-SCIENCE`, or `GREY ZONE`.
  4.  **The Cost:** Each time you move a card from one pile to another after a new round, your committee loses "Credibility Points." (This stops them from changing their minds constantly to please the class).

  ### Part 4: The Timeline (Run of Show)

  **0:00 – 0:05 | The Charge**
  Briefly explain the task. Distribute the stacks. Tell them: *"Your job is to fund-research based on these definitions. If you fund pseudo-science, you lose grants. If you reject real science, you stifle discovery. Decide."*

  **0:05 – 0:20 | Round 1: The Sorting (Individual/Small Group)**
  Have the 5-member committee work together. They must physically separate cards into two piles.
  *   *Teacher Move:* Walk around and listen. Identify which groups are struggling most. If everyone agrees easily, hand them an extra "Curveball" card.

  **0:20 – 0:35 | Round 2: The Challenge (Intervention)**
  Hand every committee **3 New Evidence Cards**. These contradict their previous decisions.
  *   *Example:* For the String Theory card, give them a note saying: *"Experimentalists found evidence supporting the math symmetry prediction."*
  *   For the Universal Soul card, tell them: *"Researchers claimed they measured Soul Energy levels using a new device."*
  *   **Task:** Must they revise their classification now? Does the new evidence make it scientific?
  *   *Goal:* Trigger the Duhem-Quine realization (Did the theory fail, or did the 'Soul Meter' fail?).

  **0:35 – 0:45 | Round 3: The Cross-Exam**
  One student from each committee swaps to another room. They act as "External Reviewers." They look at the other committee's pile and have 5 minutes to find *one* inconsistency to challenge.
  *   *Example:* "Wait, you called Climate Modeling science because it makes predictions, but you rejected Evolutionary Psych because it adapts explanations—both adapt explanations!"

  **0:45 – 0:50 | Consolidation**
  Students return to their groups. 5 minutes to finalize the pile. Lock it in.

  **0:50 – 1:00 | The Debrief (The Philosophical Mapping)**
  Do not lecture. Ask questions. Reveal the hidden identity of the cards.

  ### Part 5: The Debrief Script (Mapping Experience to Theory)

  This is where you sell the lesson. Connect their frustration to the texts.

  1.  **The Grey Zone Revelation:**
      *   *Ask:* "Who ended up putting String Theory in 'Science'? Who put it in 'Not'?"
      *   *Map:* Explain **Lakatos**. Popper wants us to kill a theory at the first anomaly. But real science protects its core. Is String Theory a "degenerating research program" (ad hoc adjustments forever) or a "progressive one" (leading to future tests)? The cards made you feel the tension between protecting ideas vs. discarding them.

  2.  **The Auxiliary Hypothesis Trap:**
      *   *Ask:* "In the Neutrino Speed card, what did you blame when the result was weird?"
      *   *Map:* **Duhem-Quine Problem.** Most of you likely said, "Maybe the stopwatch was wrong." If you save a theory by blaming the equipment, you saved it by adjusting *auxiliary hypotheses*. Technically, under strict Popperian rules, you haven't falsified the core theory—you've just complicated the system. This is why falsifiability is rarely applied in isolation.

  3.  **The "False but Scientific" vs. "True but Pseudo":**
      *   *Ask:* "Did anyone reject Homeopathy because it didn't work, or because of how it argued?"
      *   *Map:* **Demarcation vs. Truth.** Popper distinguishes logic, not truth. Homeopathy makes claims that *could* be tested (and repeatedly fail). That is technically scientific in Popper's eyes (though empirically false). Astrology *absorbs* contradictions. Did you confuse "It's wrong" with "It's not science"?

  4.  **The "Unfalsifiable" Necessity:**
      *   *Ask:* "Did anyone realize some basic assumptions (logic, induction) aren't themselves falsifiable?"
      *   *Map:* **The Meta-Level.** To falsify anything, you must assume your observations mean what they say. Popper assumes a rational framework he cannot scientifically justify himself without circularity.

  ### Part 6: Predictable Pitfalls & Fixes

  **1. Students will rely on "Authority" (Real Science).**
  *   *Problem:* They know physicists study String Theory. They'll sort it "Science" regardless of the text.
  *   *Fix:* In Round 2, explicitly threaten their Credibility Points if they cite "Real world status." Catch them. Say: *"If you reference a textbook name, your group loses points."* Force them to look at the logic.

  **2. Time Collapse.**
  *   *Problem:* Debating "Is Dark Matter science?" will eat 20 minutes.
  *   *Fix:* Use a visible timer (projected on screen). Sound a bell at 90 seconds remaining per card. Silence forces decision-making.

  **3. The "Both-Sides" Impasse.**
  *   *Problem:* Half the group loves the theory, half hates it. They deadlock.
  *   *Fix:* Assign roles inside the group. One person is "The Popper Prosecutor" (must argue for rejection). One is "The Scientist Defender" (must argue for acceptance). This externalizes the bias.

  **4. Over-intellectualizing.**
  *   *Problem:* Advanced students might start critiquing Popper *during* the activity rather than trying it.
  *   *Fix:* Pre-empt this. *"For this activity, assume Popper is God. Follow his rules to the letter, even if you hate them."* Make them commit to the absurdity first.

  ### Part 7: Limitations (Be Honest About What You Can't Teach)

  To grade yourself honestly, here is what this activity will **fail** to capture, and how you should verbally fill that gap in the debrief:

  1.  **Kuhnian Paradigms:** This activity assumes individual theories can be judged in isolation. It misses the sociological weight of a paradigm (normal science) where anomalous results are ignored until crisis sets in. You cannot simulate a "paradigm shift" in 60 minutes. *Add:* Mention briefly how Thomas Kuhn would view their sorting as missing the social cohesion aspect.
  2.  **Bayesian Probability:** Modern philosophy often uses probabilistic confirmation (likelihood) rather than binary falsification. Popper is "all or nothing"; modern stats are "degree of belief." *Add:* Acknowledge that Popper's strict binary feels clunky because real science is more statistical.
  3.  **Instrumental Realism:** Some theories work perfectly well without us knowing *if* they are true (e.g., models of fluid dynamics). The activity focuses on "truth conditions" rather than "utility." *Add:* Ask, "Does a theory need to be ontologically true, just instrumentally reliable?"

  ### Final Advice

  Don't rush the silence. When they ask you, "Professor, is String Theory science?", **do not answer.**

  Point to the wall clock. *"How much time do you have left on the card? Decide."*

  Let them leave the room arguing about it. That argument is the assignment complete. You aren't teaching them the definition of science; you are teaching them that the definition is a tool that breaks under pressure, and that is exactly why it matters.

  Good luck. You're about to cause a very productive amount of confusion.
