prompt: |-
  ok so i'm running a philosophy reading group for grad students from other departments — mostly physicists and computer scientists, so they're sharp but haven't done formal epistemology. next week i'm doing the Sleeping Beauty problem and self-locating belief. i've got an hour and a half.

  don't explain the problem to me. i need you to plan how i should teach it. what has to come first, what has to be in place before the puzzle even bites, what example or variant should carry the whole session. i'm especially worried about the physicists assuming the answer is obviously 1/2 and the computer scientists assuming it's obviously 1/3 and both of them thinking the other side is just confused about conditional probability. what misconceptions should i expect from each camp, and at what point in the sequence do i head each one off. what's the one thing i should get them to do or answer at the end so i know whether they've actually understood what's at stake rather than just picked a side. and what should i openly refuse to settle — like, which part of the debate do i flag as genuinely unresolved versus which part is just people talking past eachother.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Grad students from Physics (often Bayesian/Subjective probability inclined, but also frequentist trained) and CS (algorithmic, logical, simulation-minded). They are sharp but lack formal epistemology training.
      *   **Topic:** Sleeping Beauty problem & Self-Locating Belief.
      *   **Time:** 90 minutes (1.5 hours).
      *   **Constraints:** Do *not* explain the problem (I assume they know it or I'll summarize briefly, but the focus is on pedagogy). Focus on structure, misconceptions, handling inter-departmental friction, assessment of understanding, and boundaries (what to settle vs. what to leave open).
      *   **Key Concern:** Physicists leaning 1/2 ("Halfer"), Computer Scientists leaning 1/3 ("Thirder") assuming the other is just bad at probability.

  2.  **Deconstruct the Core Conflict:**
      *   The clash isn't really about math (both agree on conditional probability axioms). It's about *reference class*, *indexical information*, and the *principle of indifference*.
      *   **Physicists (1/2):** Often view this as a physical setup where the coin determines reality. The "day" doesn't create new evidence about the coin toss itself. They care about the credence at the *start* of the experiment vs. the moment of waking.
      *   **Computer Scientists (1/3):** Often view this via simulation, long-run frequencies, or betting strategies. If you run the simulation $N$ times, there are $2N$ awakenings total, $N$ for Heads, $2N$ for Tails. A random awakening will be in Tails 2/3 of the time.
      *   **The Trap:** Thinking it's just "which probability rule applies." It's actually "what does 'probability' mean in this context?" (Objective chance vs. Subjective credence vs. Frequency).

  3.  **Drafting the Session Structure (90 mins):**
      *   *Intro/Warm-up (10-15 min):* Need to establish common ground. Don't start with SB directly. Start with indexicals.
      *   *The Setup (10 min):* Brief recap of SB to ensure shared definitions.
      *   *The Deep Dive/Variant (40 min):* This needs to be the meat. A specific variant is needed to break the deadlock. "The Incubator" or "The Color Variant." Actually, "Double Agent" or "Extremes" often works better to isolate the intuition pump. Let's go with the **Incubation/Simulation variant** (Elga style) vs. **Physical Coin** style. Or better: **Lewis's "Reference Class" argument.**
      *   *Misconception Busting (20 min):* Address the specific physics/CS biases here.
      *   *Closing/Takeaway (15 min):* Assessment question + boundary setting.

  4.  **Refining the Variant:**
      *   The standard SB is too polarized immediately. I need a variation that exposes *why* they differ.
      *   *Idea:* The "Beauty Bet." What are they betting on? Odds on Heads vs. Odds on being Monday?
      *   *Idea:* The "Extreme Case." What if Tails means 1 million awakenings? Halfer says P(H)=1/2 still. Thirder says P(H) $\approx$ 0.
      *   *Selection:* I'll use the **Extreme Case** (1 million wakings) combined with the **Long-Frequency** framing. This forces the halfer to admit the frequency disconnect and the thirder to admit the single-case disconnect.

  5.  **Addressing the Specific Camps:**
      *   **Physicists (The Halfers):** Will likely invoke objective chance (Principal Principle). They think conditioning on "I am awake now" adds no new info about the coin.
          *   *Head-off point:* Challenge them on *betting consistency* and the *Principle of Indifference*. Ask if they distinguish between "Chance of Heads" and "Credence in being in an H-world."
      *   **Computer Scientists (Thirders):** Will likely invoke simulations/frequencies. They see the algorithm producing wake-ups.
          *   *Head-off point:* Challenge them on *single-instance rationality*. Just because it happens more often in the set doesn't mean the specific instance has different evidential weight regarding the coin flip. Is it reference class selection bias?

  6.  **Developing the "One Thing" (Assessment):**
      *   Asking "Are you a Halfer or Thirder?" is useless.
      *   Asking for a derivation invites posturing.
      *   *Better Question:* Construct a scenario where their preferred answer breaks down. Or, ask them to articulate *exactly which axiom or principle they would modify/abandon* to hold their view.
      *   *Best Choice:* **"The Betting Payoff."** Define a specific payoff structure that distinguishes between *frequency* and *epistemic state*.
      *   *Actually, the prompt asks for "one thing... to know whether they've understood what's at stake".*
      *   *Decision:* Have them identify the **Indexical Anchor**. Ask: "Does your update rely on knowing the date/time, or just the fact of existence?" Or simpler: **"Is the probability referring to the coin or the awakening?"**
      *   *Refined Decision:* Ask them to define the **sample space** explicitly. If a physicist writes $(H, Mon), (T, Mon), (T, Tue)$ and assigns prob 1/4, 1/4, 1/4, summing to 3/4? No. If they write $\{H, T\}$ then prob is 1/2. If they write $\{W_H, W_{T1}, W_{T2}\}$ prob is 1/3.
      *   *Winning Question:* "What is the **event** you are calculating the probability of?" (Coin outcome vs. Subjective Location).

  7.  **Defining Boundaries (Unresolved):**
      *   Don't pretend there's a consensus.
      *   Acknowledge the distinction between **Self-Locating Evidence** (new info about *where* you are) vs. **Non-Self-Locating Evidence** (new info about the *world*).
      *   Flag the debate over whether Indexicals constitute *new information*.

  8.  **Structuring the Plan (Step-by-Step):**

      *   **Phase 1: Calibration (0-20m).** Indexicals first. The "Where am I?" puzzle without coins. Get them arguing about reference classes before introducing the coin.
      *   **Phase 2: The Setup (20-30m).** Standard SB definition. Ensure agreement on terms (Centipede vs. Coin).
      *   **Phase 3: The Friction Point (30-60m).** The Extreme Case / Betting Scenario. Force the halves and thirds into collision. Address the CS/Freq vs. Physics/Chances bias specifically here.
      *   **Phase 4: Meta-Analysis (60-80m).** Why do we disagree? (Sameness of World vs. Sameness of Observation).
      *   **Phase 5: Exit Ticket (80-90m).** The Sample Space Definition task.

  9.  **Refining Misconception Handling:**
      *   *Physics:* Watch out for "Law of Large Numbers" confusion. Just because long run freq is X doesn't make current credence X.
      *   *CS:* Watch out for "Sample Space Selection Bias." Choosing 3 states implies they already treated each awakening as equally likely (indifference). Is that justified?

  10. **Final Review against Constraints:**
      *   Time: 90 mins checked.
      *   Audience: Grads, non-philosophers. Tone should be rigorous but accessible.
      *   No explanation of problem: Check.
      *   One closing task: Check.
      *   Unresolved vs Settled: Check.

  11. **Self-Correction during drafting:**
      *   *Critique:* Is the "Extreme Case" too abstract?
      *   *Fix:* Use the "Betting Paradox" instead. Elga vs. Lewis betting arguments are concrete.
      *   *Adjustment:* I will use the "Long Run Betting Strategy" for Cs vs "Single Shot Rationality" for Phvs.
      *   *Wait,* the prompt says "don't explain the problem." I need to assume they know it. I can reference it by name, but not re-teach the rules.
      *   *Crucial pivot:* Instead of teaching the problem, teach the **underlying tension**.
      *   *Session Title Idea:* "The Reference Class Problem."
      *   *Revised Plan:* Focus heavily on **Centered Worlds** vs **Possible Worlds**. This is the technical core that unifies them.

  12. **Final Polish:** Ensure the advice on "What to refuse to settle" is nuanced. It's not just "it's unresolved," it's "the disagreement is about how to map metaphysics to mathematics."

  Let's write it.
answer: |-
  This is a high-wire act. With grad-level STEM audiences, you cannot spend time convincing them the problem is hard; they already think they solved it in 10 seconds. Your job is to show them that their solution relies on unstated premises about what probability *is*.

  Here is the lesson plan designed to de-polarize the room and force them to confront the metaphysical assumptions behind the math.

  ### Total Time: 90 Minutes

  #### Phase 1: The Pre-Condition – Indexicality (0–20 min)
  **Goal:** Establish that "knowing more" depends on *what counts as knowledge*.
  **Do not mention the coin yet.**

  1.  **The "Red Wall" Thought Experiment (10 min):**
      *   Tell them: "You wake up in a white room. You have perfect memory up until you fell asleep. There is a switch on the wall. If it was Red, you were moved to Room A. If it was Blue, you were moved to Room B. You don't know the switch color."
      *   Ask: "If someone tells you 'It is currently Tuesday,' has your probability of the Switch being Red changed?"
      *   *Most will say No.*
      *   Then add: "Now imagine Room A is visited every day. Room B is only visited on Mondays. If someone tells you 'Today is Tuesday,' does that change the credence of the Switch color?"
      *   **The Trap:** This forces them to realize that self-locating information ("It is Tuesday") interacts differently with objective chances depending on the sampling distribution.
  2.  **Concept Injection (10 min):**
      *   Introduce the distinction: **Centered Possible Worlds** (World, Day, Observer) vs. **Ordinary Possible Worlds** (Just the State of the Universe).
      *   *Instruction:* Tell them: "Your conflict tonight isn't about arithmetic. It's about whether you treat 'Me waking up now' as data about the **World** or data about my **Location** in the world."

  #### Phase 2: The Collision – Long Runs vs. Single Cases (20–55 min)
  **Goal:** Force the Physics and CS intuitions to crash into each other using a variant.
  **Method:** The "Incarnation" Variant (Elga's extreme case).

  1.  **The Setup (5 min):**
      *   Remind them of the basic Sleeping Beauty protocol (briefly).
      *   Present the **Variant**: "Heads = 1 Awakening. Tails = 1,000,000 Awakenings. All memories wiped."
      *   Question: "Upon waking, what is your credence that the Coin was Heads?"
  2.  **The Split (15 min):**
      *   Ask half the room to raise hands for 1/2, half for 1/(1M+1).
      *   **Target the Computer Scientists (The Thirders):**
          *   *Expected Move:* They will argue that if this runs 100 times, ~99% of awakenings occur in Tails branches. Therefore P(T) ≈ 1.
          *   *Counter-Challenge:* "If a Tails branch creates 1 million copies of you, are you betting on the coin toss happening once, or are you betting on 'which copy of me am I?' Which is the rational target of the bet?"
          *   *Misconception to Head Off:* **Reference Class Bias.** They are implicitly choosing a sample space where *awakenings* are the fundamental units. Challenge whether an awakening is a legitimate unit for a Bayesian prior.
      *   **Target the Physicists (The Halfers):**
          *   *Expected Move:* They will argue the Coin Toss is an event in the past. No new non-indexical info arrived. P(Heads) = Principal Principle requires 1/2.
          *   *Counter-Challenge:* "If you knew beforehand you were in a lab that wakes you 1M times on Tails, did you lose the ability to reason correctly upon waking? Does the experimental setup fail to condition your belief?"
          *   *Misconception to Head Off:* **Static Chance vs. Dynamic Credence.** They conflate the "propensity" of the coin with the "information available to the observer."
  3.  **The Betting Game (15 min):**
      *   Settle the math by grounding it in decision theory.
      *   Scenario: You get paid $1 if you guess correctly upon waking.
      *   **Question:** "If you are a Halfer, why accept a strategy that pays you 1/2 when you should pay 1/999,999?"
      *   **Question:** "If you are a Thirder, why adopt a strategy that assumes the Tails outcomes are independent events rather than correlated branches of the same coin flip?"
      *   *Goal:* Show that Halfers prefer to maximize expected utility based on the *Coin*, while Thirders prefer to maximize based on the *Count of Observations*.

  #### Phase 3: The Diagnosis (55–75 min)
  **Goal:** Articulate *why* both sides are internally consistent but mutually exclusive.

  1.  **Discussion Prompt:** "Is 'Self-Locating Belief' valid evidence?"
  2.  **Map the Disagreement:** Draw two columns on the board.
      *   **Side A (Halfer):** Adheres to the **Principle of Indifference** applied to Physical Events. Assumes "Awakening Now" provides no information to distinguish between H-Timelines and T-Timelines because they are causally linked to the same coin flip.
      *   **Side B (Thirder):** Adheres to the **Indifference Principle** applied to Observational Indices. Assumes that absent specific evidence, "Which awakening am I?" must be distributed uniformly across all possible awakening instances.
  3.  **Key Insight to Push:** Both sides agree on Conditional Probability ($P(A|B)$). They disagree on **P(B)**.
      *   For the Halfer, the condition "I am awake" has probability 1 in both branches.
      *   For the Thirder, the condition "I am awake" has higher probability in the Tails branch *because it generates more instances*.
      *   **Verdict:** They aren't arguing about Bayes Theorem. They are arguing about how to construct the Likelihood function in indexical environments.

  #### Phase 4: The "Exit Ticket" (75–90 min)
  **Goal:** Verify understanding of the stakes, not commitment to a side.
  **Instruction:** Do not let them leave without answering this on a slip of paper.

  > **The Task:**
  > "Write down exactly which **assumption** about the universe you are willing to abandon to support your favorite view.
  > 1. If you think 1/2 is correct, what property of rational belief does that require?
  > 2. If you think 1/3 is correct, what constraint on probability spaces are you relaxing?"

  *Why this works:* If they just say "The math says 1/2", they failed. If they say "I am preserving the Principal Principle regarding physical chancs," they get credit. If they say "I am prioritizing predictive accuracy over long-run frequency calibration," they get credit.

  ---

  ### Managing the Friction (Misconceptions & Interjections)

  **For the Computer Scientists (The 1/3 Instinct):**
  *   **Prediction:** They will treat the "Wakeups" as discrete samples in a dataset. "If I simulate this, Tails wins the vote."
  *   **Intervention:** Stop them. Ask: "When you run a simulation, you create a list of outcomes. But are those outcomes independent trials? If one coin flip creates a million records in your database, does your confidence in the *coin's bias* shift just because you wrote the file more often?"
  *   **Key Phrase:** "Correlation vs. Independence." They mistake a multi-record branch for multiple coin flips.

  **For the Physicists (The 1/2 Instinct):**
  *   **Prediction:** They will cling to Objective Chance (Propensity). The coin flip is a unique physical event; looking at the "room" doesn't change the "flip."
  *   **Intervention:** Bring up **Quantum Branching** (Everettian interpretation). In MWI, if the Tails branch splits into 1,000 worlds, and you are one observer in one world, does the amplitude count as probability?
  *   **Key Phrase:** "Measure of Existence." Ask them: "Is there a difference between 'Probability of an Event' and 'Probability of finding myself in an Event'?"

  ---

  ### What to Refuse to Settle

  Do not try to declare a winner. That destroys the philosophical value. However, draw lines in the sand on two specific points:

  **1. Where they agree (Settle these early):**
  *   **Bayesian Consistency:** Everyone agrees that probabilities must sum to 1 *within a defined frame*.
  *   **Information Content:** Everyone agrees that if you knew it was Monday, P(Heads) would update to 1/2. The dispute is purely about the lack of that info.
  *   **Rationality:** Agree that *both* views can be made rational (Dutch Book arguments exist for both). Neither is "incoherent."

  **2. Where they genuinely diverge (Flag as Open):**
  *   **The Nature of the "Unit of Analysis":** This is the real fight. Is the universe composed of **Events** (Coin Flips) or **Observer Moments**?
      *   *Tell them:* "This is not a math problem. It is a metaphysical choice. Do you believe probability describes the world's state, or the agent's perspective within the world? There is no experiment that resolves this because the experiment is defined by your answer."
  *   **Indexical Information:** Can "I am here now" ever constitute non-trivial empirical evidence?
      *   *Flag:* "There is currently no consensus in philosophy of mind or epistemology on whether indexical data updates subjective credences differently than external data."

  ### The One Thing They Must Take Away

  By the end, they should understand that **Sleeping Beauty is not a puzzle about the coin.** It is a puzzle about **sampling weights.**

  If they leave thinking "Halfer or Thirder," you have lost.
  If they leave thinking "My answer depends on whether I prioritize the stability of the Law of Large Numbers (Thirders) or the preservation of Causal Independence of Chance Events (Halfers)," you have won.
