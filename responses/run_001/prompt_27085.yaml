  ### Application to the New Case: The Gray Disc in Shadow

  **Scenario:** A subject believes, based on a reliable cue, that a gray disc on a screen is actually a white surface in shadow. Does the disc look white to them, or does it look gray?

  **Prediction:** The disc looks **white** (perceptual change), but this does **NOT** constitute cognitive penetration.

  **Reasoning:**
  Under the **State-Dependency vs. Structural Invariance Principle**, you must treat this case like your **Banana/Color Constancy (Case 5)** verdict. Lightness constancy (compensating for shadows) is widely regarded as a **Biological Invariant**. It is an evolved mechanism of the visual system designed to maintain surface recognition across lighting conditions.
  *   If the subject perceives it as white, it is likely because the *mechanism* has done its job (automatically compensating for luminance ratios), not because the belief acted as an external prior overriding the mechanism.
  *   The belief ("I know this is white") tracks the mechanism's output. It does not drive it.
  *   Unlike Case 4 (Stereotype), where the association (Black man $\rightarrow$ Gun) is contingent and culturally learned, or Case 1 (Backpack), where the load is physically variable, Lightness Constancy is a stable computational feature of human vision.
  *   **Therefore:** The phenomenological shift occurs (it looks white), but per your ruling on Bananas, this falls under **No Penetration**.

  *(Note: If the belief were required to trigger the compensation—i.e., without the belief the disc looked gray—that would be Penetration. But since your verdict for Banana assumes constancy works automatically, consistency demands the same for the Shadow Disc.)*

