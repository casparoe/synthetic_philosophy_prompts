  ### The Principle: The State-Dependency vs. Structural Invariance Distinction

  To capture your pattern of judgments, I propose the following principle. It distinguishes between mechanisms that are fixed features of your hardware (which you correctly identify as "no penetration") and those that are dynamic updates to your software or embodiment occurring in the moment of perception.

  **The Principle:**
  *Cognitive Penetration occurs if and only if the phenomenal character of the experience is altered by a psychological or somatic state that is **currently active and transient**, functioning as a dynamic prior in the real-time perceptual computation. It does **not** occur when the alteration stems from:*
  1.  ***Biological Invariants:*** *Hard-wired, evolved mechanisms that stabilize perception against environmental variance (e.g., color/lightness constancy).*
  2.  ***Structural Plasticity:*** *Long-term changes to the sensory apparatus or neural pathways resulting from accumulated experience (e.g., perceptual learning).*
  3.  ***Encapsulation Resistance:*** *Situations where high-level knowledge is unable to access or modulate the perceptual mechanism due to modular boundaries.*

