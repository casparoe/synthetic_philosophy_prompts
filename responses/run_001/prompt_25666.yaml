answer: |-
  **Handout: Desiderata for a Definition of Life**
  **Course:** Philosophy of Biology
  **Topic:** The Demarcation Problem / Defining Life

  ***

  ### Introduction

  Before engaging with the primary texts, we must establish the constraints of the problem. We are searching for a set of necessary and sufficient conditions that distinguishes "living systems" from "non-living systems" without arbitrarily excluding paradigmatic cases or admitting counter-examples from physics and chemistry.

  Below is a list of **Desiderata**. These represent the benchmarks against which any proposed definition must be tested. For each, note whether it is a hard constraint (Non-negotiable) or a theoretical preference (Negotiable). Understanding these tensions is more valuable than finding the "right" answer, as the friction points themselves constitute the philosophy of biology.

  ---

  ### Part I: The Desiderata List

  | # | Requirement | Classification Target & Motivating Consideration | Status |
  | :-- | :-- | :-- | :-- |
  | **1.** | **Exclusion of Abiotic Self-Organization** | **The "Fire & Crystal" Test.** A definition must distinguish living systems from physical systems that exhibit growth, complexity, or dissipation of energy without agency.<br>*(e.g., Fire consumes oxygen and grows; crystals replicate structure; vortices organize flow.)*<br>**Constraint:** Must show why these are structurally different from a bacterium. | **NON-NEGOTIABLE**<br>(If a theory admits fire as alive, it lacks explanatory power). |
  | **2.** | **Inclusion of Paradigm Organisms** | **The "Earth Standard" Test.** The definition must unambiguously classify bacteria, plants, animals, and fungi as living.<br>*(This seems trivial but is crucial. A definition that relies on "cellular structure" risks excluding hypothetical aliens or nanoscopic entities.)* | **NON-NEGOTIABLE**<br>(Core biological consensus). |
  | **3.** | **Handling of Dormancy & Potentiality** | **The "Seed vs. Stone" Test.** Distinguish a living seed or virus from inert matter.<br>*(A dried fern spore looks dead but regenerates. A rock remains a rock. The definition must account for capacity-to-live vs. capacity-for-life.)* | **NEGOTIABLE**<br>(Some theories restrict life to active phases; others argue for the potential status). |
  | **4.** | **Temporal Coherence (Alive vs. Once-Alive)** | **The "Corpse" Test.** Distinguish an organism from its constituent parts post-mortem.<br>*(A dead human contains DNA, cells, and metabolism precursors. A definition relying solely on composition fails here; it must rely on organization or function.)* | **NON-NEGOTIABLE**<br>(Conceptual consistency: Death implies the cessation of being, not just possession of matter). |
  | **5.** | **Integration of Evolutionary History** | **The "Darwinian" Test.** Account for the fact that life evolves over time.<br>*(A sterile mule is alive, but it cannot contribute to an evolutionary lineage. Does a single organism count as "life" if it breaks the lineage?)* | **HIGH PRIORITY / NEGOTIABLE**<br>(Essential for biology, problematic for defining individual instances). |
  | **6.** | **Resolution of the "Individual" Boundary** | **The "Holobiont" Test.** Where does the organism end?<br>*(Humans are superorganisms of host + microbiome. Is the gut bacteria alive individually, or is the holobiont the unit? Definitions often blur this line.)* | **HIGHLY NEGOTIABLE**<br>(Many definitions sidestep individuation entirely to focus on properties). |
  | **7.** | **Universality (Xeno-Compatibility)** | **The "Alien Life" Test.** Do not presuppose terrestrial biochemistry (carbon, DNA, water).<br>*(If silicon-based or plasma life exists, would our definition recognize it? A definition tied too tightly to Earth mechanisms fails here.)* | **METHODOLOGICAL IDEAL**<br>(We may never know, but a good definition shouldn't rule out the unknown a priori). |

  ***

  ### Part II: Scoring the Main Contenders

  We evaluate the four major philosophical frameworks against the desiderata above.

  #### 1. The Metabolic Approach (e.g., Chemiosmotic, Autopoietic)
  *Focus:* Life is a system that generates and maintains its own components (self-production).
  *   **Exclusion of Fire (Req 1):** **PASS.** Fire consumes fuel it doesn't produce; cells synthesize their own catalysts.
  *   **Paradigm Cases (Req 2):** **PASS.** Fits cellular organisms perfectly.
  *   **Dormancy (Req 3):** **FAIL.** Viruses and cryptobiotic seeds stop metabolism. Are they dead until they wake up? (Metabolicists often say yes).
  *   **Individual Boundary (Req 6):** **STRONG.** Helps define the container of the self-production loop.
  *   **Verdict:** Strongest physically, weakest on viruses/dormancy.

  #### 2. The Evolutionary/Darwinian Approach (e.g., Hull, Dawkins)
  *Focus:* Life is any system undergoing evolution by natural selection (replication + variation + heredity).
  *   **Exclusion of Fire (Req 1):** **PASS.** Crystals don't vary in adaptive ways.
  *   **Paradigm Cases (Req 2):** **PASS.** Fits populations well.
  *   **Sterility (Req 5):** **FAIL.** A sterile worker ant or a mule is alive, but fits none of the evolutionary conditions. (Solution: Shift definition from "individual" to "population," creating a category error).
  *   **Temporal Coherence (Req 4):** **WEAK.** A preserved bone has DNA; a viral particle has RNA. Both contain replicative code but may not be "active" in a lineage.
  *   **Verdict:** Best for macro-biology, worst for individual organisms or unique instances.

  #### 3. The Informational/Genetic Approach (e.g., Schrödinger, Crick-inspired)
  *Focus:* Life is characterized by hereditary information storage and processing (the "software").
  *   **Exclusion of Fire (Req 1):** **WEAK.** Computer viruses possess code and propagate. Must add strict requirements about hardware/material instantiation to differentiate.
  *   **Dormancy (Req 3):** **PASS.** A seed is full of instructions, making it easier to classify as "potentially alive."
  *   **Universality (Req 7):** **GOOD.** Silicon AI could theoretically satisfy this, fitting astrobiological hopes.
  *   **Temporal Coherence (Req 4):** **FAIL.** A dead body retains the genome. Information persists longer than life.
  *   **Verdict:** Risks including non-living computational systems; struggles with the distinction between *code* and *embodiment*.

  #### 4. The Thermodynamic Approach (e.g., Entropy negation)
  *Focus:* Life is an open system that locally reverses entropy through energy exchange.
  *   **Exclusion of Fire (Req 1):** **FAIL.** Fire creates local order at the expense of global entropy; so do storms and hurricanes.
  *   **Universality (Req 7):** **EXCELLENT.** Physics is universal; no biology required.
  *   **Verdict:** Generally considered insufficient because it is too broad (fails negative boundary test).

  ***

  ### Part III: Philosophical Synthesis — The Limits of Definition

  As you read the assigned papers, keep these two meta-points in mind. They reveal why this problem is philosophically significant.

  #### The Single Requirement That Excludes the Most Popular Candidates
  **The Requirement of Individual Agency (Simultaneous Autonomy and Lineage).**

  Most definitions collapse because they prioritize either **Function** (what the thing does *now*) or **History** (what the thing comes *from*).
  *   If you demand **Immediate Metabolism**, you exclude Viruses and Cryptobiotic organisms (Dormancy).
  *   If you demand **Active Reproduction**, you exclude Sterile Hybrids (Mules/Klinefelter Syndrome humans).
  *   If you prioritize **Genetic Code**, you cannot distinguish a living human from a fresh corpse (once-alive).

  To get a clean classification of the *individual*, you are forced to choose between biological functionality (which changes state) and evolutionary role (which applies to lineages, not individuals). **There is no single condition that captures the "Living Individual" without excluding valid biological cases.** This forces us to ask: Do definitions describe *individuals*, or do they describe *populations*?

  #### The Impossible Trinity (Jointly Unsatisfiable Pair)
  **Pair:** **(A) Universalizability (Alien Compatibility)** vs. **(B) Operational Exclusivity (Terrestrial Precision).**

  *   **Reasoning:**
      *   If your definition is specific enough to exclude abiotic phenomena on Earth (**Requirement 1**), you almost certainly rely on features found in terrestrial biochemistry (e.g., "Carbon backbone," "Phospholipid membranes," "RNA/DNA polymerases"). This violates **Requirement 7 (Universality)**.
      *   If your definition is abstract enough to allow for alien life (**Requirement 7**) (e.g., "Any system exhibiting complex homeostasis"), it usually becomes too broad to exclude Earth-bound abiotic systems like convection currents or crystals (**Failure of Requirement 1**).

  **Conclusion:**
  You cannot simultaneously ensure your definition identifies the correct things on Earth *and* remains open to anything in the universe. Therefore, the list itself produces a result: **Definitions of life are likely "family resemblance" concepts (Wittgenstein) or "Cluster Concepts" rather than strict logical sets.** We are not looking for a necessary and sufficient condition; we are looking for a pragmatic demarcation useful for scientific inquiry.

  Prepare for class ready to debate whether this failure is a flaw in the *definition* or a feature of *nature*.
