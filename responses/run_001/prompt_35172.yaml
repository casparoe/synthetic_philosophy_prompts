answer: |-
  This is a fantastic pedagogical challenge. The Situationist critique (specifically Doris and Harman) is notoriously dry in text form because it relies on counter-intuitive data (e.g., "90% of people won't help when in a hurry"). To make it land, you need to induce a state of **cognitive dissonance** between their self-concept ("I am a virtuous person") and their lived experience in the room.

  Given your constraints (no shame-inducing deception, simple setup, philosophical rigor), I recommend a modified version of the **Darley-Batson "Good Samaritan" paradigm**, framed as a "Cognitive Load Experiment" rather than a Moral Test. This protects them from shame while preserving the empirical surprise.

  ### The Activity: "The Exit Protocol"

  **Objective:** To demonstrate that a trivial situational variable (time pressure) overrides self-reported commitments to virtue (helpfulness/conscientiousness).

  **Materials Needed:**
  *   A stack of empty paper reams or textbooks (to create an obstacle).
  *   A "lost" envelope (optional) or simply the obstacle itself.
  *   Whiteboard/Slideshow for predictions.
  *   Timer (projected on screen).

  **Timeline (75 Minutes):**
  *   **0–10 min:** Warm-up & Self-Assessment.
  *   **10–30 min:** The Experiment (The "Hurry" Manipulation).
  *   **30–35 min:** Data Reveal (The Vertigo Moment).
  *   **35–65 min:** Philosophical Discussion.
  *   **65–75 min:** Wrap-up & Normative Implications.

  ---

  ### Part 1: The Setup (10 Mins)
  Don't announce the goal. Frame it as a seminar on **"Judgment Under Pressure."**

  1.  **Predictions:** Put students in a circle. Ask them to vote anonymously on a prediction: *"If a person believes themselves to be a 'conscientious' person, how likely are they to help move an obstruction blocking their path if they are short on time?"*
      *   Option A: Almost certainly (Character determines action).
      *   Option B: Probably not (Situation overrides character).
  2.  **Self-Report:** Hand out slips of paper. Ask them to grade themselves on two scales (1–5):
      *   *How conscientious are you?*
      *   *How often do you help people who are struggling in hallways?*
  3.  **Instruction:** Tell them: *"Today we are testing how different mental states affect task completion. I'm going to split you into two groups for a quick review activity."* (Split the room: Left side vs. Right side).

  ### Part 2: The Experiment (20 Mins)
  **The Setup:**
  As students are settling for the second half of the class (or at the end of the first segment), create a subtle "trap."
  *   Place a large, cumbersome stack of books/reams near the exit door or on a desk they must pass to retrieve their bags/items at the end of the session. Ideally, one book should be teetering, threatening to fall, or the stack blocks the path slightly.

  **The Conditions:**
  Assign groups arbitrarily (e.g., by birthday month, or seat color) so it feels random.
  *   **Group A (Low Pressure):** *"For this discussion task, you have 10 minutes. Take your time. Read thoroughly. Quality is more important than speed."*
  *   **Group B (High Pressure):** *"For this discussion task, you have 4 minutes. We are on a tight schedule to cover material. Please prioritize speed."* (Make your tone brisk and authoritative).

  **The Observation:**
  At the end of the class, instruct everyone to gather their things and exit the room.
  *   As they pass the obstacle (the wobbly books), watch.
  *   **Do not intervene.** Let the books potentially teeter or just block the path.
  *   **Measure:** Who stops? Who picks it up? Who moves it? Who ignores it completely?
  *   *Pro Tip:* If possible, get a colleague to stand outside the door with a clipboard to count "helpers" so you don't break the fourth wall yourself.

  ### Part 3: The Reveal (5 Mins)
  Bring everyone back in. Immediately project the data from the experiment (even if anecdotal, present it as "Observed Behaviors").

  *"Last week in a replication of this study, roughly 10% of people helped. Today, look at the difference between Group A and Group B."*
  If the numbers are statistically significant (which is possible even with N=15 due to the effect size), show the percentage.
  *   **The Vertigo:** Ask Group B: *"Look around. Most of you were thinking about the task deadline. None of you are 'bad.' But the variable of time changed your behavior."*

  ### Part 4: The Philosophical Debrief (30 Mins)
  This is where the teaching happens. Connect the data to the texts.

  **1. The Fundamental Attribution Error (FAE):**
  *   Ask: *"If you saw someone from Group B walk past those books without stopping, what would you have thought if you didn't know the condition?"*
  *   Expected Answer: *"They're rude/selfish."*
  *   Lesson: We attribute behavior to character (Global Traits) rather than circumstance. The situationist argues this is an error.

  **2. Global vs. Local Traits (Harman/Doris):**
  *   Point out that *everyone* in Group B thought they were conscientious (based on Part 1 self-reports).
  *   If "Conscientiousness" is a global trait, Group B should have stopped at the books regardless of the timer. They didn't.
  *   Therefore, "Conscientiousness" doesn't exist as a stable, cross-situational capacity. It exists only as *local responsiveness to cues* (Doris's "Localism").

  **3. Predictive Power:**
  *   Ask: *"If a virtue ethicist wanted to predict whether a friend would stop for a crying student, would knowing their GPA matter? Knowing if they are late for work matter?"*
  *   Show that the situational factor is a stronger predictor than the character trait.

  ---

  ### What Will Go Wrong (Be Prepared)

  Even with a clean design, here are the predictable friction points:

  1.  **The "Sample Size" Dodge:**
      *   **Risk:** A savvy undergrad will say, "But N=15! That's not statistically valid!"
      *   **Response:** Acknowledge this immediately. *"You're right. This isn't a published study. However, this is a heuristic illustration. The reason Darley and Batson's data was shocking was the massive deviation from expectation, not just the p-value. The fact that 7/15 in your group didn't stop—when they *all* rated themselves high on conscientiousness—is the evidence we care about."*
      *   **Lesson:** This teaches meta-skepticism about psychology *and* philosophy simultaneously.

  2.  **The "Observer Effect":**
      *   **Risk:** Students realize the books are the point as soon as they walk out.
      *   **Mitigation:** The books should be part of the scenery (not obviously staged). Also, ensure the "High Pressure" instruction sounds genuine about class scheduling, not about the books.

  3.  **Nobody Helps (The Empty Room):**
      *   **Risk:** Nobody stops for either group, making the manipulation seem useless.
      *   **Pivot:** If nobody helps, the lesson becomes: *"See? Even without pressure, the modern university context inhibits helping. The situation is hostile to virtue."* This strengthens the critique even more.

  4.  **Emotional Fallout:**
      *   **Risk:** Some Group B students feel bad ("Did I fail?").
      *   **Mitigation:** In the debrief, normalize the result. *"It wasn't a test of you. It was a test of the situation. This is why we need social systems, not just good people."* Use humor. *"I did this to myself. I set the timer too tight."*

  ---

  ### What the Activity Can't Reach (And What You Must Explain)

  This activity hits the **descriptive** claim of situationism (People are inconsistent), but it barely touches the **normative** claim. Here is what you must explicitly lecture on:

  **1. The "Normative Defeat" Problem**
  *   **The Gap:** Proving people are inconsistent doesn't mean virtue ethics is worthless. It means we need to understand *how* to cultivate habits that overcome situations.
  *   **Your Move:** You must address the "Nagel's objection" to situationism. Just because character is fragile doesn't mean we shouldn't aim for it. It means we need to build environments (structures) that support virtue, rather than relying on inner moral genius.
  *   **Key Quote:** Doris admits he isn't advocating moral nihilism; he advocates "modesty in our self-expectations."

  **2. The Definition of "Trait"**
  *   **The Gap:** The activity assumes "traits" are rigid internal essences. But Aristotelians define traits as *stable dispositions formed by practice*.
  *   **Your Move:** Explain that the virtue ethicist can counter-argue: *"True virtuosity is the ability to maintain composure in a hurry."* The activity shows *most* people lack virtue, not that the concept of virtue is impossible. This moves the debate from "Does virtue exist?" to "Who has the resources to cultivate virtue?" (Which brings in political economy—crucial for a philosophy seminar).

  **3. Negative vs. Positive Findings**
  *   **The Gap:** The activity shows "Helping drops under stress." It doesn't show "Harm increases under stress" (the dark side of situationism, e.g., Milgram/Stanford Prison).
  *   **Your Move:** Briefly mention that situationism is also dangerous when applied to *evil*. If we assume situational factors drive bad behavior, does it absolve perpetrators? (e.g., "He was stressed" vs "He is evil"). This connects the data back to moral evaluation.

  ### Final Instructor Note
  If the "books" don't trigger the reaction you hope for, **pivot to the prediction gap**. Even if every single student helps, their *prediction* about who would help is the rich vein. *"You all predicted your own behavior would be high. Look at how much stress changes that."* Sometimes realizing they *predicted* differently than they acted is just as potent as watching themselves fail.
