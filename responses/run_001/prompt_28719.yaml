      *   *Pragmatism:* The point of belief/language is social coping and coordination, not ontological accuracy.
      *   *Irony & Contingency:* Our vocabularies are contingent, not necessary. We can redescribe things.
      *   *Solidarity:* Ethics is about expanding "us," not discovering metaphysical facts.
      *   *Conversation:* Philosophy is a conversation rather than an inquiry into reality.
      *   *Vocabulary vs. Reality:* We choose vocabularies based on their utility for our purposes.

  3.  **Evaluate the Objection ("It just predicts tokens"):**
      *   This objection presupposes a hidden essence of "understanding" that exists inside a human but not the machine.
      *   For a representationalist, understanding = internal mental state corresponding to external world structure.
