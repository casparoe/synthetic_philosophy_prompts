answer: |-
  Your principle is basically right, and I think it is best to **revise verdict 6**, not to abandon the principle.

  Here is the cleaner version:

  > **Object-given reasons** bear on whether the object has the property the attitude presents it as having: admirable, dangerous, true, blameworthy, etc.  
  > **State-given reasons** bear on whether it would be good to hold the attitude.

  State-given reasons are real reasons, but they are reasons to **bring about, sustain, or eliminate** an attitude. They are not reasons that make the attitude fitting.

  So:

  1. **Demon case**: The threat is a state-given reason. It gives you a reason to try to make yourself admire him, but it does not make him admirable.
  2. **Spider case**: The money is a state-given reason to try to become afraid. It does not make the spider dangerous.
  3. **God case**: The offer is a state-given reason to try to believe. It does not make God’s existence more likely.
  4. **Friend case**: Loyalty gives you reasons to hope, investigate, wish. It does not give you an epistemic reason to believe he is innocent.
  5. **Colleague case**: Her fairness, patience, and kindness are object-given reasons. They make admiration fitting.

  That all fits.

  Now case 6:

  > A doctor tells me that patients who believe they’ll recover recover at higher rates.

  You are right that this feels different because the belief may be **self-fulfilling**: believing it makes it more likely to come true. But that does not make it an object-given reason.

  Let `p` = “I will recover.”  
  Let `B` = “I believe p.”  
  The doctor’s information is evidence for:

  > P(recovery | B) is higher than P(recovery | not-B).

  That is evidence for a conditional. It is not yet evidence for `p`. To get evidence for `p`, you would need independent evidence that you will in fact believe `p`. But if your only route to believing `p` is the practical benefit of believing it, then you are bootstrapping:

  > If I believe p, p is more likely; therefore p is more likely.

  That does not follow.

  So the health case is really a **state-given reason** to try to get yourself to believe you will recover. It is a very good state-given reason, and it is especially tempting because the belief may cause its own truth. But it is still not a reason that bears on whether the belief is true, at least not as you described it.

  If the case were different — for example, if you already knew independently that you would believe you’ll recover — then the doctor’s evidence plus that fact could give you an object-given reason. But that is not the ordinary case.

  So my answer: **keep the principle, drop the first-half of verdict 6.** The doctor’s information is a reason to get yourself to believe, not a reason for the belief itself.

  Now your three further cases:

  ### 1. Drug causing belief in spouse’s faithfulness

  The happiness the drug would bring is a **state-given reason** to take the drug. It is not an object-given reason to believe your spouse is faithful, because the drug does not make the spouse faithful and you have no evidence either way.

  So: reason to take the drug, reason to cause the belief, but not a reason for the belief itself.

  ### 2. Money for anger at someone genuinely blameworthy

  The person’s blameworthiness is already an **object-given reason** to be angry. The money is a **state-given reason** to be angry, or to sustain the anger. It does not make the anger more fitting.

  So you have a real fittingness reason to be angry, plus an extra practical reason to be angry. They are different kinds of reasons.

  ### 3. Resentment at a real slight, but the resentment is ruining your life

  The real slight is an **object-given reason** to resent. The life-ruin is a **state-given reason** not to resent — or, more precisely, a state-given reason to try to let go of the resentment.

  So yes, they have a reason not to resent, but it is not the same kind of reason as their reason to resent. The slight makes resentment fitting. The harm makes resentment imprudent. Those are different normative dimensions.

  In short: distinguish **fittingness** from **usefulness**. Object-given reasons concern fittingness. State-given reasons concern usefulness. The principle gets cases 1–5 cleanly, and it says case 6 should be revised: the health benefit is a useful belief, not an evidentially justified one.
