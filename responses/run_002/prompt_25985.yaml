  In some democracies this is a protected free speech act; in others it is criminal. Moral judgments about flag desecration strongly track national and political identity, not harm. People often feel visceral anger and call it "sacred" violation.
  Reveal 2 (coalitional psychology):
  Psychologists suggest reverence for symbols like flags is an extension of coalitional psychology—signals of group commitment. The intensity of the response may reflect identity protection rather than a moral perception. Does that make your reaction a bias?

