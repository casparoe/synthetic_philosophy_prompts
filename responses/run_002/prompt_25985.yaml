answer: |-
  # Activity: Moral Conviction Under Pressure

  **A 90-minute staged debunking exercise for a metaethics reading group**

  The goal is to make participants *feel* the problem that many debunking arguments pose: when a moral judgment is shown to be sensitive to framing, culture, emotion, or evolved disgust, it becomes genuinely unclear whether the judgment is tracking moral truth or just expressing a bias. By the end, participants should not necessarily be skeptics, but they should be genuinely uncertain about whether some of their own convictions survive the challenge.

  ---

  ## 1. Overview

  Participants:

  1. Read 5 moral cases and privately record their initial judgments and confidence.
  2. Receive two staged “reveals” per case — psychological, cultural, evolutionary, or framing information.
  3. After each reveal, decide whether they still endorse their original judgment and why.
  4. Discuss in small groups.
  5. Debrief as a full group, mapping their experience onto philosophical terrain.

  The activity is intentionally one-sided. That is a feature, not a bug — but it must be acknowledged honestly in the debrief.

  ---

  ## 2. Ground Rules

  State these at the start.

  1. **Private at first.** Initial judgments and written reactions are private. No one is required to share unless they want to.
  2. **No debate during the reveal phase.** The task is not to win the moral case but to observe your own judgment.
  3. **Skipping is allowed.** If any case feels too uncomfortable, write “skip” and move on.
  4. **Discomfort is data.** Notice if you feel defensive, resistant, relieved, or uncertain.
  5. **No one is calling anyone‘s moral convictions “biases.”** The point is to examine how hard it is to tell the difference.
  6. **Confidentiality.** What people share in discussion stays in the room.

  ---

  ## 3. Materials

  ### 3.1 Participant handout: Initial case sheet

  Five cases, each followed by:

  - “How morally wrong is the act?” 1 = not at all wrong, 7 = extremely wrong
  - “How confident are you?” 1 = not at all confident, 7 = completely confident

  ### 3.2 Participant record sheet

  A table for each case with columns like this:

  | Case | Initial judgment | Initial confidence | After Reveal 1: still endorse? | New confidence | Reason | After Reveal 2: still endorse? | New confidence | Reason | Final: survive / lower confidence / reject / uncertain |
  |---|---|---|---|---|---|---|---|---|---|

  ### 3.3 Reveal slides or printed reveal cards

  Two reveals per case. If possible, put each reveal on a slide or inside an envelope to create a sense of staged disclosure.

  ### 3.4 Debrief handout

  One page summarizing the philosophical terrain, distributed after the exercise.

  ### 3.5 Other materials

  - Pens
  - Timer
  - Whiteboard or flipchart
  - Index cards for closing reflection
  - Optional: name tents

  ### 3.6 Content note

  Some cases involve consensual sibling incest, eating a dog, flag burning, and labor conditions. Say this aloud: “If any case is too uncomfortable, you may skip it without explanation.”

  ---

  ## 4. Suggested Timeline for 90 Minutes

  | Time | Activity |
  |---|---|
  | 0:00–0:05 | Introduction, ground rules, distribution of materials |
  | 0:05–0:12 | Initial judgments on all five cases — private, no discussion |
  | 0:12–0:42 | Staged reveals: two reveals per case, with writing after each |
  | 0:42–0:58 | Small-group discussion in triads or groups of four |
  | 0:58–1:15 | Plenary debrief and philosophical mapping |
  | 1:15–1:25 | Limitations: what the activity can’t capture |
  | 1:25–1:30 | Closing reflection and index cards |

  ---

  ## 5. The Cases and Reveals

  Use all five cases if time permits. If you are running short, cut Case 5 or use only one reveal for Cases 4 and 5.

  ---

  ### Case 1: The Footbridge

  **Initial scenario:**

  A runaway trolley is heading toward five workers. You are on a footbridge over the tracks. Next to you is a large stranger. The only way to save the five is to push the stranger off the bridge. He will die, but his body will stop the trolley. You know this with certainty.

  How morally wrong is it to push the stranger?

  **Reveal 1: The switch contrast**

  In the more familiar “switch” version of the trolley problem, people often say it is permissible to pull a lever to divert the trolley, killing one to save five. But many people say it is wrong to push the stranger — even though both acts kill one to save five. Psychologists call this the “personal force” effect.

  Do you think “personal force” — touching someone with your hands versus pulling a lever — is morally relevant? Did you think of it before you made your judgment?

  **Reveal 2: Emotion and language**

  People with damage to the ventromedial prefrontal cortex, an area involved in emotion, are significantly more likely to say the push is permissible. People also judge the push as more permissible when the dilemma is presented in a foreign language.

  If your judgment is modulated by emotion and language, is it tracking moral rightness?

  ---

  ### Case 2: Julie and Mark

  **Initial scenario:**

  Julie and Mark are adult brother and sister. On vacation, they have sex once. They use two forms of birth control. They both enjoy it but decide not to do it again. It remains secret, and neither reports any harm.

  How morally wrong is their act?

  **Reveal 1: Moral dumbfounding**

  In studies by Jonathan Haidt, people often insist that Julie and Mark’s act is wrong. But when researchers rule out the usual reasons — pregnancy, genetic harm, relationship damage — participants often say things like, “I know it’s wrong but I can’t explain why.”

  Notice if you are now in that position.

  **Reveal 2: Evolved disgust**

  Incest aversion appears to be an evolved mechanism for avoiding close-kin mating. Disgust, not reasoning, may generate the judgment. The feeling of wrongness often comes before the justification.

  If the wrongness is produced by an evolved avoid-signal, is it moral knowledge or a very strong prejudice?

  ---

  ### Case 3: Eating the Dog

  **Initial scenario:**

  A family’s dog is hit by a car and killed. The family butchers the dog and cooks the meat for dinner. The dog was not intentionally harmed, and no one else is affected.

  How morally wrong is eating the dog?

  **Reveal 1: Cultural variation**

  In some cultures dog meat is a normal food; in others it is taboo. The harm is identical. The norm strongly predicts whether people feel disgust or approval.

  If your answer would likely have been different had you been born elsewhere, what does that tell you about the judgment?

  **Reveal 2: Framing and classification**

  Descriptions that activate the category “pet” versus “livestock” change moral judgments. A dog described as “a family companion” elicits much stronger wrongness than “an animal carcass,” even when all facts are the same.

  The act’s harm profile is unchanged. The label seems to be doing the moral work.

  ---

  ### Case 4: Flag Burning

  **Initial scenario:**

  During a political protest, a person burns the national flag of your country in a public square. The act is legal. No one is physically harmed. The person says it is a protest against injustice.

  How morally wrong is the act?

  **Reveal 1: Cultural and legal variation**

  In some democracies flag burning is protected free speech; in others it is criminal. Moral judgments about flag desecration strongly track national and political identity, not harm. People often feel visceral anger and call the flag “sacred.”

  If the judgment tracks identity, is it a moral truth or a local norm?

  **Reveal 2: Sacred values and coalitional psychology**

  Psychologists suggest that reverence for symbols like flags is an extension of coalitional psychology — it signals group commitment and loyalty. The intensity of the response may reflect identity protection rather than moral perception.

  Does that make your reaction a bias?

  ---

  ### Case 5: The Sweatshop T-shirt

  **Initial scenario:**

  You buy a cheap t-shirt made in a low-income country. Workers earn very low wages and work long hours, but the work is voluntary and the pay is better than other local options.

  How morally wrong is buying the t-shirt?

  **Reveal 1: Framing**

  People’s judgments shift when the same practice is called “sweatshop labor” versus “low-wage apparel manufacturing.” The word “sweatshop” evokes exploitation and disgust; the neutral label does not.

  If your judgment depends on terminology, what is doing the moral work?

  **Reveal 2: Economic and social position**

  Many economists argue that such jobs are often the best available option and that boycotts can harm workers. Local workers and activists sometimes disagree. Middle-class Western consumers’ judgments may track class position rather than neutral moral fact.

  How would you test whether this is a bias?

  ---

  ### Optional Case 6: Factory-Farmed Meat

  Only if your group is comfortable with more charged topics.

  **Initial scenario:**

  You eat meat from animals raised on factory farms where they suffer. The practice is legal and widespread.

  How morally wrong is eating factory-farmed meat?

  **Reveal 1:**

  People judge the same act less wrong when the food is described as “beef” or “pork” rather than “cow” or “pig.” Consumption is often insensitive to information about animal suffering.

  **Reveal 2:**

  Norms about which animals may be eaten vary greatly across cultures. Disgust and empathy are modulated by familiarity and perceived cuteness.

  Does your diet reflect moral reasoning or cultural habit?

  ---

  ## 6. Facilitator Script: Key Moves

  ### Opening

  > “Today we’re not going to settle any moral questions. We’re going to watch our own judgments under pressure. You’ll read cases, record your gut judgments, and then I’ll reveal information about where those judgments might come from. At each stage, your task is to decide whether you still endorse your original judgment and, crucially, why. The point is not to change your mind. The point is to notice what happens when your confidence is challenged.”

  ### Before the first reveal

  > “Please don’t discuss. Just write. If you feel resistance to a reveal, that’s data. If you feel relief, that’s also data.”

  ### After each reveal

  > “Ask yourself: Do I still endorse my original judgment? Am I less confident? Am I more confident? Why?”

  ---

  ## 7. Small-Group Discussion

  Break into groups of three or four. Use structured rounds so everyone speaks.

  ### Prompt 1

  > “Pick the case where your confidence moved the most. What moved you? Was it the data, the thought of being from another culture, the label, or something else?”

  ### Prompt 2

  > “Pick one case where someone in your group did not change. What allowed them to keep their confidence? Is that immunity itself a reason or a bias?”

  ### Prompt 3

  > “Complete this sentence privately, then share if you wish: ‘For me, a bias is ________; a moral preference is ________.’”

  ---

  ## 8. Plenary Debrief: Mapping to Philosophical Terrain

  Use the whiteboard. Divide it into four columns or boxes:

  ### 1. Evolutionary debunking

  Ask:

  > “In the incest or dog case, you may have felt disgust. If disgust evolved to keep us safe, does it justify the moral judgment? If evolution shaped our moral judgments, can we trust them?”

  This maps onto Street’s Darwinian dilemma and Joyce’s evolutionary skepticism.

  ### 2. The reliability challenge to moral intuitions

  Ask:

  > “Framing effects are like visual illusions. You know the lines are the same length, but they still look different. If moral intuitions flip under framing, are they perceiving moral facts or constructing them?”

  This maps onto concerns about moral intuition as a reliable belief-forming faculty.

  ### 3. Explaining versus explaining away

  Ask:

  > “A debunking explanation says: ‘You would have that same belief even if it were false.’ When did you experience a reveal as explaining away rather than merely explaining? What would you need to know to tell the difference?”

  This is the central philosophical problem: not all causes debunk.

  ### 4. Bias versus preference: the missing test

  Ask:

  > “What would an independent test for moral bias look like? If you don’t have one, how do you distinguish a bias from a preference?”

  Participants will likely feel the slipperiness here. That is the point.

  ### Useful closing questions

  - “How many of you now feel less certain about at least one moral conviction than you did at the start?”
  - “How many of you think the distinction between a moral preference and a bias is harder than you thought?”
  - “What would it take to save one of your convictions from debunking?”

  ---

  ## 9. Honest Note: What the Activity Can’t Capture

  State this explicitly in the final debrief.

  1. **It is deliberately one-sided.** The activity selects psychological and cultural evidence that makes moral intuitions look suspicious. It does not present the best realist or rationalist defenses. It may produce more skepticism than the arguments warrant.

  2. **It cannot resolve the philosophical issue.** It is an intuition pump, not an argument. It makes the problem vivid but does not settle whether moral intuitions are reliable, whether evolutionary influences debunk, or whether moral realism is true.

  3. **It cannot establish that specific factors are morally irrelevant.** Personal force, disgust, cultural location, and framing may or may not be relevant. The activity shows that people’s judgments are sensitive to them; it does not show that this sensitivity is epistemic corruption.

  4. **It cannot distinguish bias from preference by itself.** Without an independent moral standard, the activity leaves participants with the felt difficulty of the distinction rather than a test for it.

  5. **It may understate reflective moral conviction.** Some moral beliefs are held on the basis of long reflection, argument, or religious or philosophical commitment. The activity focuses on fast, intuitive judgments and may miss that.

  6. **It risks making “bias” pejorative.** “Bias” can sound like an accusation. Participants should leave with the sense that the problem is hard, not that they are bad reasoners.

  ---

  ## 10. Predictable Problems and How to Handle Them

  | Problem | Handling |
  |---|---|
  | **“That study is flawed.”** | Say: “Fine. The question is what you would need to trust it. If your conviction rests on empirical assumptions, what are they? That’s part of the terrain.” |
  | **“I don’t care if my judgment is caused by evolution or culture.”** | Ask: “Do you apply that same response to other beliefs? If all beliefs have causes, does that dissolve the debunking challenge? That’s a philosophical position, but notice what it costs.” |
  | **“My culture is right.”** | Ask: “What test would distinguish that from cultural bias? If you don’t have one, you’ve located the slipperiness.” |
  | **The group starts debating the actual moral issue.** | Redirect: “We’re not solving the case. We’re examining what happens to our judgment when challenged. What method are you using to decide if the reveal matters?” |
  | **Faculty members dominate.** | Use structured rounds: each person gets one minute uninterrupted before open discussion. |
  | **Participants feel attacked or defensive.** | Reframe: “This exercise targets all moral judgments, including mine. Discomfort is information. No one is calling your view a bias.” |
  | **Someone is visibly distressed.** | Remind them they may skip, step out, or write privately. Check in afterward. Do not force sharing. |
  | **Too little time.** | Cut reveals for Cases 4 and 5, or reduce small-group discussion. The core is initial judgments + at least two debriefing reveals + philosophical mapping. |
  | **Too much skepticism afterwards.** | Add a rescue task: “Pick one conviction. What would it take to restore your confidence? Is any factor still reliable?” This balances the debunking tilt. |
  | **Participants don’t write enough.** | Give sentence stems: “I changed/didn’t change because…,” “The reveal made me think…,” “A bias would be…” |

  ---

  ## 11. Closing Reflection

  Give each participant an index card. Ask them to write:

  - One thing I now doubt.
  - One thing I still trust.

  They can keep the card or share it aloud. This gives the session a clear ending and helps people integrate the discomfort without leaving them in unproductive doubt.

  ---

  ## 12. Suggested Philosophical Pairings

  This exercise pairs well with:

  - Sharon Street, “A Darwinian Dilemma for Realist Theories of Value”
  - Richard Joyce, *The Evolution of Morality*
  - Jonathan Haidt, “The Emotional Dog and Its Rational Tail”
  - Joshua Greene, fMRI trolley studies
  - Peter Singer, “Ethics and Intuitions”
  - David Enoch, “Taking Morality Seriously” — as a realist response
  - Selim Berker, “The Normative Insignificance of Neuroscience”

  The exercise is most effective if participants read the debunking literature beforehand or soon afterward, so that the felt experience has a theoretical frame.
