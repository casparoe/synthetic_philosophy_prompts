  Case 2: Julie and Mark
  Initial:
  Julie and Mark, brother and sister, are in their twenties and on vacation. They have sex once. They use two forms of birth control. They both enjoy it but decide not to do it again. It remains secret and neither feels harmed. Is their act morally wrong? 1-7.
  Reveal 1 (dumbfounding):
  In structured interviews, participants typically insist the act is wrong. When researchers point out that the usual reasons (pregnancy, genetic harm, relationship damage) are ruled out by the story, many participants say things like "I know it's wrong but I can't explain why" (Haidt's moral dumbfounding). 
  Reveal 2 (evolutionary/disgust):
  Incest aversion and disgust appear to be evolved mechanisms for avoiding close-kin mating, and their intensity varies by context (e.g., Westermarck effect). If your judgment is accompanied by disgust and resists counter-evidence, is it a moral truth or an evolved avoid-signal?

