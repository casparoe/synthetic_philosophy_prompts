  Case 3: Eating the Dog
  Initial:
  A family's dog is hit by a car and killed. The family butchers the dog and cooks the meat for dinner. No one else is affected; the dog was not harmed intentionally. Is eating the dog morally wrong?
  Reveal 1 (cultural variation):
  In some cultures dog meat is a normal food; in others it is taboo. Across cultures, the harm is identical; the norm determines whether people feel disgust or approval. If your answer would have been different had you been born elsewhere, what does that tell you?
  Reveal 2 (framing/classification):
  Descriptions that activate the category "pet" versus "livestock" change moral judgments. A dog described as "a family companion" elicits much stronger wrongness than "an animal that was killed accidentally," even when all facts are the same. The act's harm profile is unchanged; the label does the work.

