  The short version: **Maria is mostly right about Aumann’s theorem; Josh is right to push on whether priors can ever be rationally criticized; Josh’s final move (“both should be less confident”) is a different claim and doesn’t follow.**

  Here’s a move-by-move breakdown.

  ---

  ### 1. Josh’s initial appeal to Aumann

  Josh says:

  > “Two rational people with the same information can’t disagree about probabilities.”

  That is a common but loose statement of Aumann’s agreement theorem. The actual theorem is narrower and more precise. Aumann’s theorem says, roughly:

  > If two Bayesian agents have a **common prior**, and their posterior probabilities for some event are **common knowledge**, then those posterior probabilities must be equal.

  So the key conditions are:

  - common prior,
  - Bayesian rationality,
  - common knowledge of the posterior beliefs.

  “Same information” is not enough. In fact, the interesting part of Aumann’s theorem is that two people can have *different* private information and still cannot “agree to disagree” if they share a common prior and their beliefs become common knowledge.

  So Josh is wrong to conclude that one of them must be “messing up.” If they have different priors, the theorem doesn’t force agreement.

  **Verdict:** Maria is right to object. Josh overstated the theorem.

  ---

  ### 2. Maria’s common-prior point

  Maria says:

  > “Aumann’s result assumes they started with the same prior, and they obviously didn’t.”

  She is basically right. That is a genuine condition of the theorem.

  One small caveat: the “priors” she is talking about—her general optimism about the field’s methods, Josh’s general skepticism—may themselves be the result of years of different evidence and experience. In Aumann’s formal setup, those would really be *posteriors* from earlier information, not the ultimate common prior. But the practical point stands: they have different background beliefs, and those background beliefs are not fully shared or common knowledge.

  So Maria is right that Aumann doesn’t force them to agree here.

  **Verdict:** Maria is right in substance, though her use of “prior” is a bit informal.

  ---

  ### 3. Josh’s “then what’s the point?” objection

  Josh says:

  > “If the theorem only works when you assume the conclusion—that everyone already agrees on the priors—then what’s the point?”

  This is a misunderstanding.

  Common prior is not the same as “agreeing on the conclusion.” The conclusion of Aumann’s theorem is that after information is shared, their *posterior* probabilities must agree.

  Two people can share a common prior and still rationally have very different posterior beliefs because they have seen different evidence. Aumann’s theorem says that if they then make those posterior beliefs common knowledge, they cannot remain in disagreement.

  That is a nontrivial result. It says something strong about the structure of rational belief under shared priors.

  **Verdict:** Josh is wrong here. Maria’s reply is correct.

  ---

  ### 4. Maria’s “nontrivial result” point

  Maria says:

  > “The point is that if you did share priors, disagreement would be irrational, which is still a nontrivial result.”

  She is mostly right.

  A small refinement: it’s not that disagreement under a common prior is always irrational. Two people with a common prior can rationally disagree if they have different private information and haven’t yet shared it. The theorem kicks in when their posterior beliefs become common knowledge.

  But in the context of their conversation—where they’ve aired their reasons—Maria’s statement is essentially correct.

  **Verdict:** Maria is right, with a small nuance.

  ---

  ### 5. Josh asks: “Are the differing priors themselves rational?”

  This is a good question, and it moves beyond Aumann.

  There is a real philosophical divide here:

  - **Subjective Bayesians** say that rationality is mainly about coherence and updating. On this view, there is no uniquely rational prior. Different people can start with different priors, and neither is irrational merely because of that.
  - **Objective Bayesians** say that there are further rational constraints on priors—such as symmetry, maximum entropy, or calibration with evidence.
  - In practice, priors are often informed by previous evidence and experience, so they can be more or less reasonable.

  So Josh is right to push on this. Maria’s claim that “priors aren’t the kind of thing that can be rational or irrational” is too strong.

  **Verdict:** Josh asks a legitimate question. Maria overstates her position.

  ---

  ### 6. Maria says: “Priors are starting points, not conclusions”

  Maria is expressing something like subjective Bayesianism.

  She is right that there is no universally accepted way to say that one prior is uniquely rational. But she is wrong if she means priors are completely beyond rational criticism.

  Priors can be:

  - incoherent,
  - based on clearly irrelevant or misleading information,
  - dogmatic in ways that ignore evidence,
  - poorly calibrated.

  So priors are not automatically immune to evaluation.

  **Verdict:** Maria has a defensible philosophical position, but her statement is too strong.

  ---

  ### 7. Josh’s flat-earth example

  Josh says:

  > “By that logic you could have a flat-earth prior and call it rational as long as you update consistently.”

  This is a fair reductio against extreme subjectivism.

  If “rational” only means “updates by Bayes’s rule,” then a person with a flat-earth prior who updates consistently would count as rational. Many people find that implausible. So Josh has a real point: some priors seem unreasonable.

  But this does not prove that Maria’s prior is unreasonable. It shows that *some* priors can be bad, not that *any* disagreement in priors means someone is irrational.

  **Verdict:** Josh scores a fair point against “anything goes” priors, but he overreaches if he thinks it settles their specific disagreement.

  ---

  ### 8. Maria’s “flat-earth prior would get crushed by evidence” reply

  Maria says:

  > “A flat-earth prior would get crushed by evidence pretty fast, and the fact that theirs haven’t converged yet just means the evidence from one preprint isn’t strong enough to swamp different starting points.”

  She is partly right.

  For a non-dogmatic prior, strong evidence can indeed overwhelm it over time. And one preprint may be weak evidence, so it is unsurprising that two people with different priors remain far apart.

  But her reply slightly undermines her earlier claim that priors can’t be rational or irrational. If a flat-earth prior would be “crushed” by evidence, then we are evaluating it in light of evidence. That suggests priors are not just neutral starting points.

  Also, a truly dogmatic flat-earth prior—say, assigning probability 1 to flat-earth—cannot be crushed by any amount of evidence. So her response doesn’t fully answer Josh’s challenge.

  Still, her main point about the preprint is good: weak evidence can leave different priors largely intact.

  **Verdict:** Maria is right about weak evidence explaining their persistent disagreement, but her flat-earth response is only partly successful.

  ---

  ### 9. Josh’s final move: “So both should be less confident”

  Josh says:

  > “That sounds like you’re admitting the theorem is right but the evidence here is weak, which was kind of my point all along—they should both be less confident.”

  This is where Josh goes wrong.

  Maria’s point about weak evidence does not imply that both should be *less confident*. It implies that their posteriors should remain close to their respective priors.

  If Maria’s prior was 80% and Josh’s was 30%, weak evidence might leave them near 80% and 30%. It does not tell Maria to drop to 60% or Josh to drop to 10%.

  Also, Aumann’s theorem does not say “when evidence is weak, everyone should be less confident.” It says something much more specific about common priors and common knowledge.

  Josh has shifted from:

  > “Rational people can’t disagree”

  to:

  > “Weak evidence means you should both lower your confidence.”

  That is a different claim. Maria is right to call it goalpost-moving.

  **Verdict:** Maria is right. Josh’s final inference is a non sequitur.

  ---

  ## Overall scorecard

  **Maria is right about:**

  - Aumann’s theorem requiring a common prior.
  - The theorem being nontrivial.
  - Their disagreement not automatically being irrational.
  - Weak evidence explaining why their disagreement persists.
  - Josh’s final “both should be less confident” claim being a different argument.

  **Josh is right about:**

  - Priors not being completely beyond rational criticism.
  - “Any prior is allowed as long as you update consistently” being too permissive.
  - The flat-earth example showing that some priors are unreasonable.

  **Josh is wrong about:**

  - Aumann’s theorem applying without a common prior.
  - Treating common prior as “assuming the conclusion.”
  - Concluding that one of them must be irrational.
  - Moving to “both should be less confident” without argument.

  **Maria is wrong about:**

  - Saying priors are not the kind of thing that can be rational or irrational.
  - Slightly overstating the flat-earth reply.

  The deepest issue is that their disagreement is probably driven by different background experiences and different prior beliefs about the field. That is not necessarily a failure of rationality on either side. If they want to resolve it, the more useful conversation is not “Aumann says we can’t disagree,” but rather: *What are our priors based on, and how strongly should this one preprint update them?*
