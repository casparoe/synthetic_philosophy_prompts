  You asked me to walk through the whole exchange and to be blunt. Here is the main thing: Lewis’s triviality results are a proof that a very specific package of views is untenable—roughly, that an indicative conditional expresses a single classical proposition, that its probability across all relevant probability functions equals the corresponding conditional probability, and that the class of probability functions is closed under conditionalization. They are not, by themselves, a proof that indicative conditionals cannot express propositions. Your friend’s opening move in (1) runs too fast.

  One small but important point before the moves. The Ramsey test says that to evaluate “if A then C” you suppose A and ask whether C. Adams’s Thesis is the precise probabilistic formalization: the probability or assertability of the conditional equals P(C|A). Lewis’s results target Adams’s Thesis. The Ramsey test can be accepted in some form without accepting Adams’s Thesis as a fully general semantic equation. Your friend sometimes slides between them.

  The formal core of the first Lewis proof is as follows. Suppose that for every probability function P in a class closed under conditioning on C and on not-C, we have P(if A then C)=P(C|A). Then total probability gives P(if A then C)=P(if A then C|C)P(C)+P(if A then C|not-C)P(not-C). Applying the equation to the functions obtained by conditionalizing on C and on not-C makes the first conditional probability 1 and the second 0, so P(if A then C)=P(C). That is absurd for arbitrary A and C. Your point in (2) is formally correct: the proof requires the equation to hold after conditionalization. If it only holds for the agent’s current credence function, the proof does not go through.

  But your friend is right in (3) that this restriction is costly. The Ramsey test is not just a static fact about one’s present credence; it is supposed to tell us how to evaluate and update conditionals. If the equation holds only for a single credence function and not for the results of learning C or not-C, you need a principled story about why a supposedly meaning-constituting connection disappears under updating. You also need to explain why the equation holds at all. So your restriction blocks the proof, but it does not save the spirit of the view. He is, however, overstating the later triviality results when he says they do not rely on closure in a way that makes your point irrelevant. There are strengthenings by Lewis and by Hájek and others, but they still involve assumptions—for example, that the same proposition is assigned the conditional probability across arbitrary probability functions, or that conditionals embed truth-functionally in certain ways. A contextualist or three-valued account can reject those assumptions. So the later results do not simply close off your move.

  Your three-valued move in (4) is half right and half confused. If the conditional is true at A-and-C worlds, false at A-and-not-C worlds, and neither at not-A worlds, then the probability that it is true is P(A&C), and the probability that it is true-or-neither is P(A&C)+P(not-A), which is exactly the probability of the material conditional. Neither of those is P(C|A). To get the conditional probability, you have to treat the conditional as a conditional event or a non-classical semantic value whose probability is not the probability of truth in the ordinary sense. So you can dodge Lewis, but only by changing the probability calculus or the notion of proposition, not simply by adding a truth-value gap. Your friend is therefore right in (5) that this is not ordinary truth-conditional semantics, but he is wrong to call it merely relabeling. Conditional-event semantics is a genuine formal theory with an algebra and a logic; whether you want to call its semantic values propositions is partly terminological. The deep question is whether it can handle embeddings and inference, not whether the word “true” applies in exactly the classical way.

  Your embedding objection in (6) is the strongest point you made. If conditionals do not express propositions, then their contribution to truth-functional compounds is not straightforward, and natural language does embed conditionals. Your friend’s reply in (7) is too quick about negation. It is not generally valid that “not if A then C” is equivalent to “if A then not C”. In Stalnaker semantics without conditional excluded middle, negating a conditional and conditionally negating its consequent are different; and ordinary language contains cases where the distinction seems real. For a fair coin, “it is not the case that if you flip it, it will land heads” can be accepted while “if you flip it, it will not land heads” is not, since the coin might land heads or tails. So the non-propositionalist needs a more careful compositional story about negation. He is right that conditionals in antecedents are notoriously difficult for everyone, and that the embedding problem is not a one-line refutation, but it is a serious cost.

  Your logic challenge in (8) is also fair, but it has more of an answer than you suggest. Adams and his successors have developed a probabilistic notion of validity according to which an argument is valid just in case the uncertainty of the conclusion cannot exceed the sum of the uncertainties of the premises. In this framework, modus ponens and modus tollens are valid. Hypothetical syllogism is not valid, but that is not obviously a defect; there are familiar counterexamples to hypothetical syllogism for indicative conditionals, and the standard Stalnaker semantics also invalidates it in general. So the non-propositional view does have a logic, though its treatment of arbitrary embedded conditionals and quantification is less developed than truth-conditional semantics. That is a reason to keep working on it, not a refutation.

  Your friend’s assessment in (9) is partly right. The material conditional does get the probabilities wrong, and Stalnaker semantics cannot satisfy the unrestricted Adams thesis across all probability functions without falling into triviality. But it does not follow that any truth-conditional account that takes the Ramsey test seriously is ruled out. Stalnaker himself took Lewis’s result to show that the proposition expressed by an indicative conditional is context-dependent, so Adams’s thesis holds only relative to a context set or a conversation, not as a universal law over arbitrary probability functions. Modern contextualist and restrictor views do something similar: they treat the conditional as having truth conditions, but explain the probabilistic data through context-sensitivity and pragmatics rather than through the semantic equation. Your friend’s statement that “any truth-conditional account that satisfies the Ramsey test runs into Lewis’s results” is true only if satisfying the Ramsey test means accepting the unrestricted, context-invariant Adams thesis. Many truth-conditional accounts reject that while still trying to explain why the thesis seems compelling.

  So where does that leave you? Your friend is right that the triviality results are deep and that the simple package of classical propositionhood plus unrestricted Adams thesis is dead. You are right that this does not force the conclusion that indicative conditionals lack truth conditions. The strongest positions in the current literature are, in my view, either context-sensitive truth-conditional accounts in the Stalnaker/Kratzer tradition or non-classical conditional-event accounts. The expressivist or non-propositional Adams/Edgington view remains a live option, and it has the virtue of taking the Ramsey test as central, but it pays the price in compositionality. There is no consensus, and the triviality results are best described as a severe constraint rather than a definitive proof of expressivism. If you want a scorecard, you won the formal and compositional points; your friend won the point that the Ramsey test cannot be casually restricted away; and neither of you successfully landed the claim that the other view is impossible.
