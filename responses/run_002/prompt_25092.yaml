answer: |-
  Here’s a complete classroom activity I’ve used in similar forms. It works best if you resist the urge to name the philosophical issues early. Let the frustration build, then harvest it in the debrief.

  I’ll call it **“The Demarcation Machine.”**

  ---

  ## 1. Learning goals

  By the end, students should be able to:

  1. Apply a simplified Popperian falsifiability rule to a range of claims.
  2. Discover that the rule is harder to apply than it first looks.
  3. Feel the difference between:
     - **falsifiable in principle**,  
     - **falsifiable but heavily protected by auxiliary assumptions**, and  
     - **built to survive any possible evidence**.
  4. See why Popper did not simply “solve” demarcation.
  5. Name at least two deeper issues: Duhem-Quine and the theory/research-program distinction.

  ---

  ## 2. Materials needed

  For 15 students, split into five groups of three.

  Each group needs:

  - One deck of **18 cards**
  - One **falsifiability rule card**
  - One **sorting mat** with three boxes:
    - `SCIENCE`
    - `NOT SCIENCE`
    - `GREY ZONE / CONTESTED`
  - One **scoresheet**
  - Sticky notes
  - One **anomaly envelope** for later
  - A timer or clock

  You also need:

  - A whiteboard or shared board for the “Dispute Board”
  - Markers
  - Optional: small prizes for “best philosophical frustration”—not for correct answers

  ---

  ## 3. The card deck

  Each card should have a **title**, a short **core claim**, a **signature prediction**, and a **typical move when the prediction fails**. The last part is crucial. It is what makes the game hard.

  You can trim this deck to 15 or 16 if time is short, but 18 works.

  | # | Card | Core claim | Signature prediction | Typical response when data fail |
  |---|------|-----------|----------------------|-------------------------------|
  | 1 | **Newtonian celestial mechanics** | Universal gravitation exactly determines planetary motion. | Precise planetary positions, eclipses, comet returns. | Propose an unseen planet, measurement error, or incomplete n-body calculation. |
  | 2 | **Sun-sign astrology** | Birth sign and planetary positions shape personality and events. | General personality profiles by sign. | “Need the full chart, exact birth time, rising sign, houses.” |
  | 3 | **Germ theory** | Specific microbes cause specific diseases. | Microbe found in sick cases, not healthy controls; can be cultured; reproduces disease. | “Carrier state,” “not culturable yet,” “mixed infection.” |
  | 4 | **Homeopathy** | Like cures like; extreme dilution retains therapeutic potency. | Highly diluted remedy beats placebo in randomized trials. | “Wrong remedy for that individual,” “potentization was incorrect,” “sham trials miss the vital force.” |
  | 5 | **Freudian psychoanalysis** | Dreams and symptoms express unconscious conflicts. | Dreams are disguised wish-fulfillments. | If a dream is not wish-fulfillment, interpret it as reaction formation or a wish to disprove Freud. |
  | 6 | **Historical materialism / Marxism** | History is driven by class struggle; capitalism will generate proletarian revolution. | Proletarian revolution in advanced industrial societies. | “False consciousness,” “imperialism,” “conditions not yet ripe.” |
  | 7 | **Quantum mechanics** | Wave functions plus the Born rule describe physical systems. | Interference patterns, atomic spectra, Bell-inequality violations. | Check measurement setup, state preparation, decoherence. |
  | 8 | **Evolutionary theory** | All life shares common ancestry; natural selection explains adaptation. | Nested hierarchies, fossil transitions, genetic homologies. | Traits may be exaptations, drift, or due to changed environments. |
  | 9 | **Evolutionary psychology** | Human mate preferences are evolved adaptations to the ancestral environment. | Cross-cultural sex differences in mate preferences: men value youth, women value resources. | Exceptions are due to modern environments, sampling issues, or local conditions. |
  | 10 | **String theory / multiverse** | Fundamental physics involves strings and extra dimensions; there is a landscape of vacua. | Supersymmetric particles at the LHC or specific extra-dimensional signatures. | “Particles heavier than expected,” “we live in a different vacuum,” “prediction depends on moduli.” |
  | 11 | **Intelligent design** | Some biological structures are too complex to arise by natural selection. | No stepwise naturalistic path for specified complexity. | When a path is found, move to another structure or demand a more detailed path. |
  | 12 | **Parapsychology** | Psi abilities such as ESP exist. | Above-chance performance on Ganzfeld or forced-choice card tests. | “Psi-missing,” “experimenter disbelief,” “participant mood,” “sheep/goat effect.” |
  | 13 | **Phlogiston theory** | Combustible bodies contain phlogiston, released when burned. | Burning reduces phlogiston; charcoal leaves little ash. | When magnesium gains weight, say phlogiston has negative weight. |
  | 14 | **Plate tectonics / continental drift** | Continents move as part of large plates. | Matching coastlines, fossils, rock formations, seafloor spreading. | Originally: “no mechanism yet”; anomalies explained by slow process and missing seafloor data. |
  | 15 | **Radical behaviorism** | All behavior is shaped by reinforcement histories. | Behavior changes when reinforcement contingencies change. | “Covert reinforcement,” “intermittent reinforcement,” “history not directly observed.” |
  | 16 | **Climate science** | Anthropogenic greenhouse gases are warming the planet. | Warming trend, stratospheric cooling, sea-level rise. | A short slowdown is due to ocean heat uptake, volcanic aerosols, or internal variability. |
  | 17 | **Acupuncture** | Needles at specific points unblock qi flow through meridians. | Acupuncture relieves pain better than sham/placebo. | “Sham needles accidentally stimulate meridians,” “wrong points,” “protocol not individualized.” |
  | 18 | **Creation science** | Young Earth, flood geology. | Strata deposited by a single flood; all kinds appear suddenly. | “Dates are based on false assumptions,” “miracles transcend regular law,” “flood hydraulics are different.” |

  ### Suggested card format

  Print each card with:

  > **Title**  
  > *Core claim:*  
  > *Signature prediction:*  
  > *Typical failure response:*

  Keep the text short. The table above is too much for one card, but you can compress each into three bullet points.

  ---

  ## 4. Rule card

  Each group also gets this:

  > **FALSIFIABILITY RULE**  
  > A research program is scientific only if it makes at least one observable prediction that could in principle come out wrong.  
  >  
  > To sort a card:
  > - If you can describe a possible observation that would show the core claim is false, put it in **SCIENCE** and write that observation down.
  > - If the program can reinterpret any possible observation as compatible, or if its predictions are too vague to fail, put it in **NOT SCIENCE**.
  > - If it has some testable parts but also flexible assumptions, put it in **GREY ZONE / CONTESTED** and write what extra information would settle it.
  >  
  > Do not sort by whether you think the claim is true. A false theory can still be scientific. A true claim can be non-scientific.

  That last line is important. Otherwise students will put phlogiston in NOT SCIENCE because they know it is false.

  ---

  ## 5. Scoresheet

  Give each group something like this:

  | Card | Classification | What observation would falsify it, or why no such observation exists? | Difficulty 1–5 |
  |------|---------------|----------------------------------------------------------------------|----------------|
  | 1. Newtonian mechanics |  |  |  |
  | 2. Astrology |  |  |  |
  | 3. Germ theory |  |  |  |
  | 4. Homeopathy |  |  |  |
  | 5. Freudianism |  |  |  |
  | 6. Marxism |  |  |  |
  | 7. Quantum mechanics |  |  |  |
  | 8. Evolutionary theory |  |  |  |
  | 9. Evolutionary psychology |  |  |  |
  | 10. String theory |  |  |  |
  | 11. Intelligent design |  |  |  |
  | 12. Parapsychology |  |  |  |
  | 13. Phlogiston |  |  |  |
  | 14. Plate tectonics |  |  |  |
  | 15. Behaviorism |  |  |  |
  | 16. Climate science |  |  |  |
  | 17. Acupuncture |  |  |  |
  | 18. Creation science |  |  |  |

  The scoresheet forces them to justify each card, not just gut-react.

  ---

  ## 6. Anomaly cards

  After the first sort, each group gets an anomaly card. This is where Duhem-Quine starts to hurt.

  Each anomaly card should say:

  > **BAD NEWS**  
  >  
  > You previously classified [Theory] as science.  
  >  
  > New observation: [specific observation that does not fit].  
  >  
  > What do you do?  
  >  
  > A. Falsify the core claim and move it to NOT SCIENCE.  
  > B. Revise an auxiliary assumption or background belief. Write it.  
  > C. Dismiss the observation as measurement error or anomaly. Say why.  
  > D. Other.  
  >  
  > If you choose B or C, is your revision independently testable? How?

  Here are ready-made anomaly cards:

  | Anomaly | For card |
  |---------|----------|
  | Mercury’s perihelion advances 43 arcseconds per century more than Newtonian mechanics predicts, even after accounting for known planets. | Newtonian celestial mechanics |
  | A healthy cook, “Typhoid Mary,” carries *Salmonella typhi* without showing symptoms. | Germ theory |
  | A patient repeatedly dreams a traumatic event exactly as it happened, with no obvious wish-fulfillment or disguise. | Freudian psychoanalysis |
  | Magnesium gains mass when burned, though it supposedly releases phlogiston. | Phlogiston theory |
  | A child says “goed” without ever having heard it, apparently using an abstract rule. | Radical behaviorism |
  | From 1998 to 2012, global surface temperature rises much more slowly than many model simulations project. | Climate science |
  | In some cultures, men show a preference for heavier women, undercutting the claim that male preferences are universal. | Evolutionary psychology |
  | A large pre-registered randomized trial finds homeopathy no better than placebo. | Homeopathy |
  | A pre-registered meta-analysis finds no Ganzfeld effect in parapsychology. | Parapsychology |
  | Wegener cannot supply a physical mechanism for continental drift, and critics say continents cannot plow through ocean crust. | Plate tectonics |
  | A controlled study finds no personality differences by birth sign. | Sun-sign astrology |
  | Many animal body plans appear rapidly in the Cambrian explosion, with fewer intermediate fossils than gradual change predicts. | Evolutionary theory |

  You don’t need all of these. Pick four to six, and assign each group one. The Mercury anomaly is the single most useful one.

  ---

  ## 7. Procedure and 60-minute timeline

  ### 0:00–0:05 — Setup

  Divide into groups of three. Give each group a deck, rule card, sorting mat, scoresheet, and sticky notes.

  Say something like:

  > “You are a curriculum advisory board. You must sort these research programs into SCIENCE and NOT SCIENCE for a school science textbook. Use the falsifiability rule on the card. Do not sort by whether you believe the claim is true. A false theory can still be scientific. Write your reasons.”

  Assign roles in each group:

  - **Scribe** — writes justifications
  - **Challenger** — asks “What evidence would make you give this up?”
  - **Defender** — asks “What would a supporter say?”

  Rotate roles halfway if possible.

  ### 0:05–0:20 — Round 1: Sort the cards

  Groups sort all 18 cards into:

  - `SCIENCE`
  - `NOT SCIENCE`
  - `GREY ZONE / CONTESTED`

  For each card in SCIENCE, they must write a possible falsifier on the scoresheet or sticky note.

  For each card in GREY ZONE, they must write what extra information would settle it.

  Facilitator move: Do not answer content questions. Say, “Use the rule as best you can.”

  Expected outcome: Most groups put Newton, germ theory, quantum mechanics, evolutionary theory, plate tectonics in SCIENCE. They put astrology, homeopathy, intelligent design, creation science, parapsychology in NOT SCIENCE. But they will argue about Freud, Marxism, phlogiston, behaviorism, evolutionary psychology, climate science, string theory, acupuncture.

  That argument is the point.

  ### 0:20–0:30 — Force the grey zone and compare

  Ask:

  > “Now take every card you placed in GREY ZONE. If you had to put it in either SCIENCE or NOT SCIENCE, which would you choose and why?”

  This prevents groups from hiding in the grey zone.

  Then have each group pair with another group and compare two or three contested cards. They must identify one card where they disagree and one card where they agree but for different reasons.

  ### 0:30–0:40 — Anomaly challenge

  Give each group one anomaly envelope.

  They open it and see the anomaly for a theory they probably classified as science.

  They must answer:

  1. Does this falsify the core claim?
  2. If not, what exactly do you change?
  3. Is the change independently testable?
  4. Would you still call the program scientific?

  This is the moment where students often say:

  > “We didn’t falsify Newton. We just assumed there’s another planet.”

  That’s Duhem-Quine in the wild.

  ### 0:40–0:50 — Dispute Board

  Each group posts two or three hard cards on the whiteboard under:

  - `SCIENCE`
  - `NOT SCIENCE`
  - `DISPUTED`

  Use sticky notes. Put each card title and one-line reason.

  Then pick three cards with visible disagreement and ask groups to defend.

  Facilitator prompts:

  - “What would it take for you to change your classification?”
  - “Are you testing the core claim or the auxiliary assumptions?”
  - “Is your falsifier about the theory itself, or about the instruments, background knowledge, or practitioners?”

  Build a list on the board:

  > **What made cards hard?**  
  > - vague predictions  
  > - built-in excuses  
  > - hidden background assumptions  
  > - no clear line between theory and evidence  
  > - some fields ignore negative results  
  > - some false theories still look scientific

  ### 0:50–1:00 — Debrief and naming

  Now name the philosophical issues. The debrief is the moment to connect student moves to the literature.

  ---

  ## 8. Debrief map

  Use this table as your facilitator guide.

  | Student experience | Philosophical issue |
  |---|---|
  | They wanted to keep Newtonian mechanics even after Mercury anomaly. | **Duhem-Quine:** No single prediction tests one theory in isolation. Predictions depend on background assumptions, instruments, and auxiliary theories. |
  | They allowed an unseen planet or measurement error to save Newton. | **Auxiliary hypotheses:** Science routinely revises background assumptions. The question is whether the revision is independently testable, not whether it exists. |
  | They noticed astrology sometimes makes testable claims, but the system ignores failures. | **Falsifiability is not sufficient:** A field can produce isolated testable claims while its core practice is not scientific by Popperian standards. |
  | They put phlogiston in NOT SCIENCE because it is false. | **Science ≠ truth:** Phlogiston was false but scientific. Falsifiability is about testability, not current acceptance. |
  | They argued about string theory or climate science. | **Degree of testability:** Falsifiability is not yes/no. Some research programs are more testable, more precise, or more constrained than others. |
  | They found that Marxism, Freudianism, or evolutionary psychology can absorb anomalies. | **Ad hoc rescue:** Popper’s real worry was theory amendments that reduce testability and only save the theory. But drawing that line requires judgment. |
  | They wanted to keep a broad program while rejecting a specific claim. | **Lakatos’s research programs:** The unit of assessment is not a single theory but a hard core plus protective belt. A program can survive falsifications by modifying auxiliary assumptions, if it generates novel predictions. |
  | They disagreed with another group using the “same” rule. | **Demarcation requires judgment:** The rule does not apply itself. Community norms, background knowledge, and epistemic values matter. |
  | They noticed homeopathy or parapsychology makes testable claims but practitioners reject negative results. | **Falsification as a norm, not only a logical property:** A scientific community must be willing to accept falsification as possible and act on it. |

  ### Key debrief line

  > “Popper didn’t solve demarcation because falsifiability is neither a mechanical algorithm nor a sufficient condition for good science. It names something important—science must be capable of failure—but it doesn’t tell us how to apply that criterion in messy cases.”

  ---

  ## 9. What will predictably go wrong

  ### 1. Students will sort by belief, not structure

  They will put phlogiston in NOT SCIENCE because it is false, and climate science in SCIENCE because they believe it.

  Fix: Remind them repeatedly: “A false theory can be scientific. A true claim can be non-scientific. You are sorting testability, not truth.”

  ### 2. Astrology becomes “science”

  Some group will say: “Astrology makes predictions, so it is falsifiable and therefore science.”

  This is a feature, not a bug. Let them make the move. Then ask:

  > “Is the core astrological practice designed to accept negative results, or to reinterpret them through birth time, rising sign, houses, and so on?”

  This teaches that isolated falsifiable sentences are not enough.

  ### 3. The GREY ZONE pile becomes huge

  Groups will avoid committing. That’s fine, but force them in the next step to make a forced call. The forced call is where real reasoning shows up.

  ### 4. Students think any auxiliary assumption is cheating

  After the anomaly round, some will say: “If Newton needs an unseen planet, then Newton is unfalsifiable because anything can be saved.”

  Don’t let that stand. Ask:

  > “How would you test the unseen-planet hypothesis? Could you fail to find it? If so, the move is not merely ad hoc.”

  This is the difference between a testable auxiliary and a rubbery excuse.

  ### 5. One or two students who know Popper dominate

  If that happens, assign them a role:

  > “You are the observers. Record every move where someone changes their criterion.”

  That keeps them engaged without spoiling the discovery.

  ### 6. Some cards become politically sensitive

  Climate science, Marxism, evolutionary psychology, and creation science can trigger worldview commitments.

  Frame it early:

  > “We are not deciding which claims are true or which policies are good. We are asking what makes a field scientifically testable.”

  If needed, swap in less politically charged cards like phlogiston, humoral medicine, or vitalism.

  ---

  ## 10. Honest limitations of the activity

  You should mention these in the debrief or final wrap-up.

  ### 1. It treats theories as isolated units

  That’s exactly the picture Duhem-Quine undermines. The activity helps students feel the problem, but the full thesis has to be supplied by you: **the unit of testing is a whole network of beliefs**, not one claim.

  ### 2. It cannot capture the historical process

  Real demarcation is partly about how a research program responds over decades. A one-shot card sort is a snapshot. Lakatos’s idea of a **research program**—with a hard core, protective belt, and positive heuristic—needs separate explanation.

  ### 3. It cannot supply domain knowledge

  Students lack the domain expertise to know, for example, whether a climate model adjustment is legitimately constrained by satellite data or is ad hoc. The activity can surface that need, but not resolve it.

  ### 4. It underplays the social dimension of science

  Philosophers after Popper—Kuhn, Lakatos, Feyerabend, Longino, and others—emphasized that science is a social institution. Demarcation is not just about logical properties of theories but about community practices, peer review, consensus, and values.

  ### 5. The game may accidentally reinforce a false binary

  Even with a grey zone, students may leave thinking the goal is to sort cards cleanly. You should explicitly say:

  > “The real result is that the line is blurry, and the cleanliness of the boundary is precisely what is at stake.”

  ### 6. Popper’s own view is more nuanced

  The game uses “Popper lite.” Popper knew that causal theories often require auxiliary assumptions. His later work wrestled with **verisimilitude** and the question of when modifications are ad hoc. The game does not capture that.

  ---

  ## 11. If you want to extend the activity

  If you had 90 minutes, you could add:

  - **Lakatos round:** Give each group a “hard core” card and a set of “protective belt” cards. They must decide which to sacrifice under pressure.
  - **Kuhn round:** Half the groups play “normal scientists” defending a paradigm; half play “revolutionaries.”
  - **Institutional round:** Add cards like “editorial board,” “funding agency,” “expert witness,” “patient group,” and ask how they would sort the same claims.

  But for a 60-minute tutorial, the design above is enough to make them feel the problem before you name it.
