  Let's propose deck of 18:

  1. Newtonian celestial mechanics
  Core: The positions of planets are determined by universal gravitation.
  Prediction: Exact future positions of planets and return of comets.
  Anomaly response: If mismatch, propose an unseen planet (Vulcan) or measurement error.

  2. Sun-sign astrology
  Core: Personality and daily events are influenced by positions of sun/moon/planets at birth.
  Prediction: General personality descriptions for a sign.
  Anomaly response: Failed individual predictions are due to wrong birth time, "rising sign," or incomplete chart.

  3. Germ theory of disease (Koch)
  Core: Specific diseases are caused by specific microorganisms.
  Prediction: Isolate a microbe in all cases; culture it; reproduce disease in animal.
  Anomaly response: If microbe not found, say technique not sensitive enough or disease has mixed cause.

  4. Homeopathy
  Core: Like cures like; serial dilution increases potency.
  Prediction: Highly diluted remedies should outperform placebo in randomized trials.
  Anomaly response: Negative trials are explained by "individualized prescribing" or "succussion errors."

  5. Freudian psychoanalysis
  Core: Unconscious conflicts produce symptoms and dreams.
  Prediction: Dreams express repressed wishes.
  Anomaly response: If a dream appears not wish-fulfillment, interpret it as wish to prove Freud wrong, or reaction formation.

  6. Historical materialism / Marxism
  Core: History is driven by class struggle; capitalism will produce proletarian revolution.
  Prediction: Socialist revolution in advanced industrial societies.
  Anomaly response: Delayed revolution due to false consciousness, imperialism, or premature conditions.

  7. Quantum mechanics
  Core: Physical systems are described by wave functions; measurement outcomes obey Born rule.
  Prediction: Interference patterns, energy levels, Bell-inequality violations.
  Anomaly response: If anomaly, check measurement apparatus or propose decoherence.

  8. Evolutionary theory (common descent + natural selection)
  Core: All life shares common ancestry; adaptation arises by natural selection.
  Prediction: Fossils, nested hierarchies, genetic similarities.
  Anomaly response: "Adaptationist stories" can be adjusted: trait might be byproduct, drift, or environment changed.

  9. Evolutionary psychology (a specific claim)
  Core: Human mate preferences are adaptations to EEA.
  Prediction: Men value youth; women value resources, cross-culturally.
  Anomaly response: Exceptions are due to modern environment interfering with evolved preferences.

  10. String theory / multiverse
  Core: Fundamental particles are strings in extra dimensions; many vacuum states.
  Prediction: Supersymmetric particles at LHC (maybe), but no unique low-energy predictions.
  Anomaly response: Non-detection means particles heavier; or we live in a different vacuum.

  11. Intelligent design
  Core: Some biological structures are too complex to arise by natural selection.
  Prediction: No naturalistic stepwise path for specified complexity.
  Anomaly response: When a plausible path is found, move to another structure or demand more detail.

  12. Parapsychology (ESP)
  Core: Some minds can obtain information without ordinary senses.
  Prediction: Above-chance performance in forced-choice card guessing or Ganzfeld.
  Anomaly response: Failed replication due to experimenter disbelief, psi-missing, or participant mood.

  13. Phlogiston chemistry
  Core: Combustible bodies contain phlogiston released when burned.
  Prediction: Burning reduces phlogiston; substances gain/lose weight.
  Anomaly response: When metals gained weight upon burning, propose phlogiston has negative weight.

  14. Plate tectonics / continental drift (Wegener)
  Core: Continents move via large plates.
  Prediction: Coastlines fit, matching fossils/rock formations, seafloor spreading.
  Anomaly response: Initially lacked mechanism; anomalies explained by slow movement and missing data.

  15. Behaviorism (radical)
  Core: All behavior is shaped by reinforcement histories.
  Prediction: Behavior changes when contingencies change.
  Anomaly response: If no observed reinforcement history, postulate intermittent/covert reinforcement.

  16. Humoral medicine (Galen)
  Core: Health depends on balance of four humors: blood, phlegm, yellow bile, black bile.
  Prediction: Bloodletting restores balance and cures fever.
  Anomaly response: If patient worsens, imbalance was bigger than thought or another humor involved.

  17. Climate modeling / climate change
  Core: Anthropogenic greenhouse gases raise global average temperature.
  Prediction: Warming trends, stratospheric cooling, sea level rise.
  Anomaly response: A short-term slowdown is due to ocean heat uptake, volcanic aerosols, or model internal variability.

  18. Acupuncture / traditional meridians
  Core: Inserting needles at specific points unblocks qi flow through meridians.
  Prediction: Acupuncture relieves pain better than placebo/sham.
  Anomaly response: Negative trials explained by sham needles accidentally stimulating meridians or improper point selection.

