  Opening:
  "Your rough picture is close but misses one important refinement: the claim is not usually that most prior mass is malign; it is that the prior contains a short adversarial environment for any computable predictor, because the adversarial environment can simulate the predictor. That is a real technical fact. Whether it makes the prior 'malign' is a further interpretive step."

