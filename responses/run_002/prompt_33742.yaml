answer: |-
  We, S and P, after a good-faith adversarial collaboration, co-sign the following joint statement.

  **1. Agreed claims**

  1. Kepler practiced astrology professionally throughout much of his life, including casting horoscopes and preparing annual calendars for patrons and courts.
  2. His official positions, including provincial mathematician and imperial mathematician, required astrological duties, and he received income and patronage for them.
  3. Kepler repeatedly criticized central features of the inherited astrological tradition, especially the belief that zodiacal signs, houses, and planetary rulerships act as causes.
  4. He did not reject all celestial influence; he defended the reality of planetary aspects such as conjunction, opposition, trine, square, and sextile.
  5. He gave aspects a natural-philosophical foundation by linking them to geometry, light, the harmony of proportions, and the responsive capacities of the soul or sublunary matter.
  6. He argued that legitimate astrology should be separated from superstitious or credulous practice, and he often presented himself as defending a reformed middle way between uncritical practitioners and wholesale despisers of astrology.
  7. His theoretical writings, letters, calendars, and horoscopes span much of his career, so the relationship between theory and practice cannot be settled by chronology alone.
  8. His criticisms of zodiacal signs, houses, and rulerships recur in multiple genres, but the phrasing and emphasis vary with audience and purpose.
  9. He used empirical material, including weather observations, historical examples, and biographical events, to test or illustrate astrological claims.
  10. His forecasts often include probabilistic or hedging language, and he sometimes stresses general conditions over specific outcomes.
  11. The existence of practical and economic motives does not, by itself, prove that he regarded his astrological work as mere professional compromise.
  12. The existence of genuine theoretical interest in celestial influence does not, by itself, prove that he accepted the inherited astrological framework as a whole.
  13. His harmonic and optical discussions of aspects are integrated into his broader cosmological and physical program, not isolated from it.
  14. Both positions agree that he wanted to purge parts of astrology he considered unfounded and retain or establish parts he considered defensible; the dispute concerns the scope of what he retained, the motive of the purge, and the status of continued practice.

  **2. Disagreements table**

  | Disagreement | S's position | P's position |
  |---|---|---|
  | Overall aim of Kepler's astrology project | He aimed to reduce astrology to a small physically respectable residue, chiefly geometrical aspects acting through light and harmony. Most inherited astrology was superstition to be replaced. | He aimed to reform astrology from within by giving it natural causes and empirical controls, preserving astrology as a legitimate art rather than eliminating it. |
  | Status of horoscope-casting and annual calendars | Continued practice is best explained largely by economic necessity, office duty, and patronage; it does not reflect his considered commitment to traditional astrology. | Continued practice is an integral and convinced part of his empirical astrological program, not merely a livelihood. |
  | Rejection of zodiacal signs, houses, and rulerships | These rejections are his considered verdict that such factors have no place in the legitimate residue. | These rejections are selective internal pruning of unreliable parts within a recognizably astrological practice. |
  | Function of natural philosophy and geometry | Natural philosophy supplies criteria to replace most astrology with a branch of celestial physics or harmonics. | Natural philosophy supplies criteria to make astrology more reliable and causally grounded, thereby defending and improving it. |
  | Patron-facing vs scholarly presentation | Patron-facing work often accommodates popular astrology; private or scholarly statements reveal his narrower view. | Differences are genre-sensitive presentations of a consistent reformist program, not evidence of duplicity or mere compromise. |
  | Whether his mature view should still be called astrology | If astrology means traditional zodiacal and domal practice, he largely rejected it; his remaining doctrine is better called celestial physics or harmonic meteorology. | His retention of horoscopic practice and defense of celestial influence keeps him within astrology, even if he radically redefines many causes. |

  **3. Cruxes**

  For each crux, both accept that the listed evidence or argument bears on the dispute.

  | Crux | Evidence/argument both accept | S predicts | P predicts |
  |---|---|---|---|
  | How does he handle his own predictive uncertainties and failures? | Annual calendars, prognostications, letters, and retrospective comments on particular forecasts. | He will treat failures as revealing the weakness of popular or traditional astrology and retreat to broad physical effects of aspects. | He will treat failures as correctable by better data and natural philosophy, while still defending a reformed astrological practice. |
  | How much zodiacal and house-related language does he retain in actual practice? | Content analysis of his annual calendars, nativities, and practical astrological texts. | Traditional language is marginal, heavily qualified, audience-driven, or retained only as convention; aspect language dominates. | Traditional language persists selectively and instrumentally, showing reform through pruning rather than rejection of astrology. |
  | How does he justify aspects in optical and harmonic writings? | Discussions in his optical and harmonic treatises, methodological remarks, and letters. | He grounds aspects in geometry, optics, and musical proportion, stripping them of traditional astrological meanings and treating them as physical configurations. | He connects geometrical-optical-harmonic causes to astrological effects on the soul and sublunary world, thereby providing a natural foundation for astrology. |
  | How does his presentation differ when addressing patrons versus fellow scholars? | Comparison of dedicatory letters, popular calendars, court prognostica, and more technical treatises or correspondence. | Patron-facing works show more traditional content and hedging, revealing professional accommodation; scholarly works reveal the narrower physical program. | Both kinds of work show the same reformist commitments adapted to genre; public works demonstrate that he openly defended astrology rather than merely performing it. |
  | Does he treat astrological forecasts and data as part of his empirical program? | His use of weather records, historical events, biographical data, and tests of astrological rules. | He uses empirical material mainly to discredit traditional rules or support aspects; it does not refine zodiacal or domal astrology. | He uses empirical material to improve astrological reliability and distinguish defensible from indefensible claims, including aspects and possibly some traditional factors. |
  | How does he classify astrology relative to astronomy, optics, and harmonics? | Statements about the divisions and methods of the sciences in prefaces, introductions, and methodological passages. | He subordinates astrology to astronomy and physics, leaving only a physical study of celestial configurations; the label astrology becomes increasingly conventional or rhetorical. | He retains astrology as a legitimate art that must be reformed by astronomy, optics, and harmonics, not replaced by them. |

  **4. Closing note: verbal versus substantive disagreement**

  Some portion of the dispute is verbal or classificatory. Both agree that Kepler rejected many inherited astrological doctrines and retained a geometrically and optically grounded account of celestial influence. Whether that retained core should be called astrology or celestial physics depends on how broadly one defines astrology, and this choice can create the impression of a deeper conflict than exists. Likewise, the contrast between compromise and reform is partly a matter of emphasis: both sides accept that economic pressures existed and that Kepler also had genuine intellectual interest in celestial influence; they differ mainly about which motive is explanatorily primary and whether the practice is integrated into his mature project. The substantive dispute remains about the scope and centrality of his astrological commitments, not merely about terminology.

  Summary: The deepest residual disagreement is whether Kepler’s lifelong astrological practice and public defense are primarily an accommodation to office and patronage around a narrow physical-geometrical core, or primarily a principled, empirically minded reform of astrology from within that he practiced with conviction until the end.
