answer: |-
  The Fitch argument is valid *classically* and *unrestricted*. If you want to keep verificationism, you should not reject the obviously good parts—knowledge of a conjunction does entail knowledge of the conjuncts, and knowledge is factive. The weak points are elsewhere.

  I would reject the inference in step **(6)**, not premise **(1)**. The argument shows that \(q\) cannot be true, so we get:

  \[
  \neg(p \land \neg Kp)
  \]

  where \(Kp\) means “somebody at some time knows \(p\).” The problematic move is the classical equivalence:

  \[
  \neg(p \land \neg Kp) \;\vdash\; p \to Kp
  \]

  That is just the classical equivalence between \(\neg(A \land \neg B)\) and \(A \to B\). But if you are a verificationist, you already have reason to be unhappy with classical logic here. In intuitionistic logic, the same premise gives only:

  \[
  p \to \neg\neg Kp
  \]

  That is, if \(p\) is true, then it is **not the case that nobody ever knows \(p\)**. But it does **not** follow that \(p\) is actually known. Double-negation elimination is not intuitionistically valid.

  So Fitch’s argument, read constructively, does not prove the absurd conclusion that every truth is actually known. It proves the verificationist-friendly conclusion that no truth is forever unknown—or more precisely, that for any true \(p\), we cannot assert that \(p\) is forever beyond knowledge. That is just the constructive content of knowability.

  The cost: you must be serious about rejecting classical logic for these contexts. In particular, you cannot assume bivalence/excluded middle for claims like “somebody knows \(p\)” or “nobody ever knows \(p\).” Some truths may be neither known nor forever unknown. That is a real revision, but it is a principled one for verificationism: knowledge and verifiability are not decidable, so classical bivalence is exactly what you should be suspicious of.

  If you want to stay classical, the best alternative is to reject step **(4)** by reformulating knowability with an actuality operator. Edgington’s move is:

  \[
  \text{If } p \text{ is true, then it is possible to know that } p \text{ is actually true.}
  \]

  Formally:

  \[
  p \to \Diamond K(@p)
  \]

  Then let \(q = p \land \neg Kp\). If \(q\) is actually true, the principle says only that someone in a possible world could know that actually \(p\) and actually nobody knows \(p\). That possible knower’s knowing *actual* \(p\) does not make it true in the actual world that someone knows \(p\). So the contradiction in step (4) does not arise.

  The cost: “knowable” no longer means “there is a possible world where the same proposition is known.” It means “there is a possible world where someone knows the actual truth of the proposition.” That knower may be a merely possible, non-actual agent. That is a significant reinterpretation, but it keeps the principle universal.

  As for restricting (1) to a subclass: the only principled-looking restriction is to **Cartesian** or **basic** truths. A proposition is Cartesian if knowing it is not logically self-defeating. Fitch’s \(q\) is non-Cartesian because knowing \(q\) is outright contradictory. So one can say: verificationism only requires knowability for truths whose unknowability would indicate a verification-transcendent gap. Fitch’s \(q\), by contrast, is unknowable for purely logical self-defeating reasons.

  That restriction is not *automatically* gerrymandered, but it has a real cost: it admits that there are true but unknowable propositions, such as \(q\) when \(p\) is an unknown truth. That weakens the original slogan “no truth is permanently closed off from inquiry.” To make it principled, you need an independent motivation—for example, a Dummett-style distinction between basic first-order truths and higher-order truths about our knowledge of them. Without that, it looks like it is designed only to dodge Fitch.

  In short: my advice is to reject the classical inference in (6), or, if you want to keep classical logic, to adopt the actuality-sensitive formulation of knowability. I would not restrict (1) unless you are prepared to refine the slogan significantly.
