answer: |-
  The first thing to say is that the two sides are not really disagreeing about the formal results. They are disagreeing about what the formal results are results *about*. That is why the debate can remain both technically mature and philosophically frozen.

  Below is a diagnosis of the structure of the disagreement, the hidden commitments on each side, and what might actually move it.

  ---

  ## 1. The shared formal core

  The discursive dilemma, in its simplest form, runs like this. Suppose a three-member committee has to decide three logically connected propositions:

  - **P**: The contract is valid.
  - **Q**: The defendant breached the contract.
  - **R**: The defendant is liable.

  The law says: if **P** and **Q**, then **R**. The three members vote as follows:

  | Member | P | Q | R |
  |---|---:|---:|---:|
  | 1 | Yes | Yes | Yes |
  | 2 | Yes | No | No |
  | 3 | No | Yes | No |
  | **Majority** | **Yes** | **Yes** | **No** |

  Each individual is perfectly consistent. But the majority view is **P**, **Q**, and **not-R** — a collectively inconsistent set, given the legal rule that **P** and **Q** imply **R**.

  Judgment aggregation theory generalizes this. It models groups as aggregating individual judgments across a set of logically interconnected propositions. It then shows, in the style of Arrow’s theorem, that no aggregation function can simultaneously satisfy a number of apparently plausible conditions:

  - **Universal domain**: all individual judgment sets that are individually consistent are allowed.
  - **Collective rationality**: the group output is consistent and complete.
  - **Anonymity**: no voter has special weight.
  - **Systematicity / propositionwise independence**: the collective judgment on a proposition depends only on individual judgments on that same proposition.

  The impossibility results show that these conditions cannot all be satisfied together. That much is uncontested.

  So why do people draw such different lessons from the same theorems?

  ---

  ## 2. The deep reading: group rationality as a structural problem

  On one side — most prominently associated with Christian List and Philip Pettit — the discursive dilemma reveals something genuinely deep about the possibility of group rationality.

  The thought is not merely that majority voting sometimes produces awkward outcomes. It is that any would-be group agent faces a constitutive tension between two things that both seem essential to rational agency:

  - **Responsiveness to members**: the group should track the judgments of its individual members.
  - **Collective coherence**: the group should have a consistent, rationally closed set of attitudes — otherwise it cannot be interpreted as a single agent at all.

  For List and Pettit, a group can be a rational agent only if its attitudes are sufficiently coherent to be intelligible as the attitudes of *one* mind. The impossibility results show that this cannot be achieved by simple proposition-by-proposition majoritarianism. Something must give.

  On this reading, the formal theorems are not engineering puzzles. They are constitutive constraints on group agency. They show that there is no free way to make a group out of individuals while respecting both individual judgment and collective rationality. The escape routes — premise-based voting, conclusion-based voting, distance-based methods, relaxing independence — are all ways of managing this tension, but each sacrifices something normatively important.

  Thus the deep reading says: group rationality is not a metaphor, or not merely a metaphor. It is a real achievement, and the impossibility results show it is a fragile and philosophically fraught one.

  Importantly, List and Pettit do not conclude that group agency is impossible. They conclude that it is possible only under constitutional choices that relinquish some responsiveness to individuals. The impossibility result is not a refutation of group agency; it is a constraint on its construction.

  ---

  ## 3. The engineering reading: a problem of institutional design

  On the other side — often tracing back to Lewis Kornhauser and Lawrence Sager’s early work on appellate courts — the doctrinal paradox looks less like a metaphysical crisis and more like a familiar institutional problem.

  Courts, committees, legislatures, and boards have always had to decide how to aggregate views across interconnected questions. Sometimes the institution cares about the outcome; sometimes it cares about the official reasons; sometimes it cares about consistency over time; sometimes it cares about responsiveness to individual members. Different contexts call for different rules.

  From this point of view, the impossibility theorems are real but not especially troubling. They show that no single aggregation rule has every desirable property. But that is unsurprising. Real institutions never satisfy universal domain anyway. Agendas are constrained. Questions are sequenced. Some issues are deemed preliminary. Courts, for example, often vote on outcomes rather than premises, or adopt majority views only on the narrowest grounds, precisely to avoid doctrinal incoherence.

  The engineering reading treats “group rationality” as either:

  - a loose metaphor for output consistency, or
  - a property of the procedures we design.

  It does not require the group to be a full-blown intentional agent in the same sense as an individual mind. Therefore, the impossibility results are not a deep challenge to group agency. They are a menu of trade-offs.

  On this view, the central question is not: *What must a group be to count as rational?* but: *Which institutional procedures best serve the purposes of this particular collective decision-making context?*

  ---

  ## 4. Diagnosing the disagreement

  The two sides are not making competing claims about the formal facts. They are operating at different levels and using the same words — especially “group rationality” — in different ways.

  The disagreement is best understood as layered.

  ### Layer 1: A partly verbal dispute about “rationality”

  Formally, “collective rationality” in the judgment aggregation literature usually means that the group’s judgment set is consistent and deductively closed. That is a property of outputs.

  But “rational” can also mean:

  - **Procedural rationality**: the decision procedure is fair, transparent, reliable.
  - **Agent-level rationality**: the group is genuinely an intentional agent whose attitudes can be explained by reasons.

  The theorems directly concern only the first sense. They do not show that groups cannot be rational in the procedural sense. Nor do they show that groups can or cannot be rational in the agent-level sense.

  Much of the apparent impasse comes from sliding between these senses. If the deep side says, “The theorems show that group agency is fraught,” they are moving from an output-coherence result to a metaphysical conclusion about collective intentionality. That move requires philosophical premises beyond the formal theorem.

  If the engineering side says, “Nothing deep here — just pick a procedure,” they may be rejecting those extra premises, or simply using “group rationality” in a thinner sense.

  To that extent, part of the dispute is verbal. It can be dissolved by saying clearly which sense of group rationality is in play.

  ### Layer 2: A genuine normative disagreement

  But the dispute is not merely verbal. After clarifying the senses of rationality, a real normative question remains:

  > Which features of individual rationality must a collective decision procedure preserve?

  The deep side treats coherence across logically connected propositions as something close to a constitutive norm of rational agency. If a group says **P**, says **Q**, and denies the obvious implication **R**, it is not just making an error; it is failing to be a unified rational subject.

  The engineering side denies that this carries the same weight for groups as for individuals. A court, for example, can issue a holding while its members disagree about reasons. The output may be doctrinally messy, but the decision can still be legitimate, fair, and practically intelligible.

  This is not a verbal disagreement. It is a normative disagreement about what groups owe to coherence, to individual members, and to the broader public.

  It is also a disagreement about whether propositionwise independence is a requirement of impartiality or an overly rigid constraint. The deep side often treats independence as protecting reason-based collective judgment. The engineering side treats it as one formal condition among many, dispensable when institutional context demands.

  ### Layer 3: A domain or methodological difference

  There is also a difference in intellectual project.

  One side is doing something like social ontology: asking what it takes for a group to exist as a rational agent over and above its members. The other side is doing normative institutional design: asking how we should arrange actual voting procedures in courts, parliaments, central banks, or boards.

  These projects can be complementary. A theorem can be deep for social ontology while being practically manageable for institutional design. But they come into apparent conflict when the deep side makes global claims about any possible group agent, while the engineering side makes local claims about real institutions.

  In that sense, the two sides are sometimes talking past each other, not because they are confused, but because they are asking different questions.

  ### Layer 4: A hidden empirical bet

  Beneath both positions, there is often an unstated empirical assumption.

  The engineering side assumes that real institutions can avoid the worst consequences of the impossibility results through domain restrictions, agenda control, hierarchy, precedent, and deliberation. The deep side assumes that these escape routes impose genuine costs — lost responsiveness, agenda manipulation, hidden inconsistency — that do not disappear in practice.

  These are partly empirical questions. How often do discursive dilemmas actually arise in real committees and courts? How effectively do institutional rules suppress them? Do premise-based and conclusion-based procedures differ in perceived legitimacy? Does the quest for group coherence systematically exclude minority views?

  These questions are rarely tested directly. The formal literature tells us that the paradox is possible. It does not tell us how much it matters in the wild.

  ---

  ## 5. What would move the debate?

  If the diagnosis above is right, then different parts of the impasse require different kinds of resolution.

  ### a. Conceptual clarification

  The first move is to distinguish:

  - output consistency,
  - procedural rationality,
  - group agency.

  If the debate is partly verbal, then this clarification can shrink the apparent disagreement. The engineering side can agree that output consistency is sometimes valuable. The deep side can agree that formal impossibility does not by itself prove anything about the metaphysics of groups.

  ### b. First-order normative argument

  The substantive normative disagreement cannot be resolved by more theorems. It requires an argument about the standing of groups as rational agents.

  Do groups have reason-responsive attitudes? Can a group be responsible in its own right? Or are group-level claims always reducible to claims about individuals and procedures?

  These are questions in social ontology and political philosophy. Formal work can discipline them, but it cannot settle them.

  ### c. Empirical institutional research

  The hidden empirical bets can be tested.

  For example:

  - In multi-member courts, how often would issue-by-issue majority voting have generated inconsistent doctrine that the court’s actual procedure avoided?
  - In boards or committees, how frequently do discursive dilemmas arise under real agendas?
  - Do premise-based and conclusion-based procedures differ in perceived legitimacy, satisfaction, or later reversal rates?
  - How often do distance-based aggregation methods produce outcomes that would have lost under both premise-based and conclusion-based voting?

  This kind of research would not end the philosophical debate, but it would tell us whether the deep side’s structural worries have practical bite, or whether the engineering side’s confidence in institutional workarounds is justified.

  ### d. Formal work under realistic conditions

  Further formal work can also help. The classic impossibility theorems use strong conditions. We now need more results about what happens when those conditions are relaxed in realistic ways.

  For example:

  - Under what domain restrictions does majority voting over connected propositions produce consistency with high probability?
  - Which aggregation rules are least susceptible to agenda manipulation?
  - How robust are the impossibility results when deliberation is added before voting?

  Such results would sharpen the real trade-offs. They would not, however, tell us how to value those trade-offs.

  ---

  ## 6. Is the impasse genuine?

  The honest answer is: partly, but not entirely.

  In one form, the impasse is illusory. Both sides agree on the formal facts. If the debate is framed as “Do the theorems show that group rationality is impossible?” then the engineering side is right: they do not. The impossibility results show that certain combinations of properties are impossible, not that groups cannot be rational in any sense.

  But if the debate is framed as “Is there an irreducible tension between respecting individual judgments and ensuring collective coherence?” then the deep side is right. The tension is real. Every escape route sacrifices something. The formal results prove that there is no neutral, cost-free aggregation rule.

  So the global impasse is best described this way:

  > It is a normative and metaphysical disagreement, partly obscured by conceptual ambiguity, with an underdeveloped empirical edge.

  The formal apparatus has done its job. It has mapped the space of possible aggregation rules and shown that certain attractive combinations are impossible. What it cannot do is tell us whether the resulting sacrifices matter, how they should be weighed, or whether the group itself is the kind of thing whose coherence should be valued in the same way as an individual’s.

  The debate runs forever because, at its core, it is no longer a formal debate. It is a debate about what we want collectives to be. The theorems can tell us what we cannot have. They cannot tell us what to value.

  ---

  ## 7. The broader lesson

  The judgment aggregation literature is a vivid case study in the limits of formal work in social philosophy.

  Formal results can:

  - reveal hidden inconsistencies in our commitments,
  - force us to choose among desiderata,
  - show that certain institutional arrangements are impossible or costly.

  But they cannot by themselves resolve disputes that depend on:

  - contested interpretations of concepts like “rationality,”
  - normative views about what institutions are for,
  - metaphysical views about the reality of group agents,
  - empirical facts about how actual institutions function.

  When a debate has been formalized to maturity, the remaining disagreement often migrates to these less formal levels. That is not a sign that the formal work failed. It is a sign that it succeeded in exporting the question back to philosophy and institutional practice.

  The discursive dilemma will remain philosophically unsettled as long as we lack agreement on what a group is, what coherence is worth, and what real institutions sacrifice when they choose one escape route over another. The theorems will not settle that. But they help us see exactly where the real argument begins.
