  - No longer claims desert alone yields a complete sentencing schedule; desert often determines a range or a set of permissible sanctions, and tie-breakers may be consequentialist.
  - No longer treats all retributive emotions as authoritative; they must be disciplined by reflection.
  (b) Consequentialist revisions:
  - No longer treats desert merely as a proxy for deterrence or public sentiment.
  - Acknowledges principled desert side-constraints on who may be punished and how much, not merely instrumental.
  - No longer uses the "punish an innocent" thought experiment as a serious institutional option; now regards it as impermissible and misleading as a test of everyday punishment.
  - Acknowledges that some moral constraints against using persons as mere means are not fully reducible to empirical expectations.

