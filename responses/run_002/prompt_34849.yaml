  1. Definition. Legal punishment is the deliberate imposition by state authority of burdens or hard treatment on a person who has been convicted of a criminal offense, where the imposition expresses social condemnation or censure. It is not merely a fee, tax, or civil sanction. A parking fine or civil damages award may be burdensome, but it need not express the same kind of moral blame and is primarily regulatory or compensatory. The condemnatory character distinguishes punishment from a mere price for misconduct.

  2. Justificatory burden. Because punishment intentionally harms or deprives persons of liberty/property, it always requires justification. Neither of us treats the mere fact that an act is legally defined as a crime as sufficient.

  3. Adequate theory must explain/accommodate:
  - why only culpable violations of public legal norms may be punished;
  - why excuses, duress, insanity, and significant mental impairment reduce or eliminate liability;
  - proportionality: seriousness of offense and offender's culpability must constrain severity;
  - the difference between punishment and other state coercion;
  - the role of procedural fairness and rule-of-law values;
  - the relevance of empirical effects on crime, recidivism, public safety, and legitimacy;
  - the reality of scarce resources and institutional fallibility.
  Both agree any theory failing on these is inadequate.

  4. Convergence on core cases. Both affirm that:
  (a) A person convicted of aggravated murder after fair trial may be given a substantial custodial sentence. Retributivist: deserved; consequentialist: incapacitation, deterrence, and expression of norm; both support.
  (b) Known innocent may not be punished. (We discuss below.)
  (c) Trivial conduct that is neither harmful nor wrongful should not be criminalized or punished.
  (d) Grossly disproportionate punishment (e.g., life sentence for minor shoplifting) is impermissible even if it would have some general deterrent benefit.
  (e) Excuses like insanity and duress should exclude or mitigate punishment.
  Why convergence: both theories contain independent constraints that converge, though paths differ.

  5. Empirical facts relevant. Both affirm the following empirical findings, where well-supported, are relevant to institutional design:
  - increasing certainty of punishment generally has larger marginal deterrent effect than increasing severity;
  - lengthy prison sentences have diminishing marginal deterrent effects and may be criminogenic;
  - incapacitation prevents crimes during confinement but requires tradeoffs;
  - well-designed rehabilitation and reintegration programs can reduce recidivism;
  - perceived procedural fairness and legitimacy improve law-abiding behavior;
  - punishment systems can discriminate by race, class, or mental disability;
  - penal resources are finite, and spending on one intervention carries opportunity costs.
  They weight differently but not ignore.

