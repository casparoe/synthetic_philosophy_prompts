answer: |-
  Your instinct is right. The dinner-party version is a good piece of pop-neuroscience storytelling, but it compresses a metaphor, an empirical claim, and a metaphysical conclusion into one smooth slide. A Dennett-style “user illusion” view is more careful than that.

  Here’s a breakdown of what a defender of the view would likely stand behind, and where your friend is overreaching.

  ## 1. The defensible core of the “user illusion” view

  ### a. Consciousness is an interface, not a transparent window onto the brain

  Yes. A careful defender of the view will say: conscious experience does not disclose neural implementation. When you consciously decide to stand up, you don’t experience motor cortex, cerebellum, basal ganglia, or the exact sequence of muscle activations. You experience something more like “I’ll get up now.” In that sense, consciousness is a high-level, simplified model.

  The desktop metaphor is useful here. The icon is not the file; the trash can is not a physical place; but the interface lets you act without knowing the machine code. Dennett would agree that consciousness is not a direct readout of the brain’s underlying machinery.

  ### b. There is no Cartesian theater

  Dennett’s larger target is the idea that there is some central place in the brain where “it all comes together” and a little self watches the screen. He rejects that. For Dennett, conscious content is more like “fame in the brain”: many processes compete, and the ones that win enough global influence become available for report, memory, and action.

  So a Dennettian would say: consciousness is not a single dashboard observed by a homunculus. It is a competitive, distributed, constantly edited process.

  ### c. The self is constructed, not a simple inner substance

  Dennett famously says a self is a “center of narrative gravity.” That does not mean the self is nothing. It means the self is an abstraction, a stable pattern, not a little person inside the skull. That part your friend got broadly right: the sense of being a unified “I” is something the brain constructs.

  ### d. A lot of cognition is unconscious

  Yes. Much of what the brain does never reaches conscious awareness. And yes, people sometimes confabulate explanations for their own behavior. There are split-brain studies, choice-blindness experiments, and ordinary experience: you sometimes give a plausible story about why you did something without actually knowing the real cause.

  So the idea that the conscious narrator is not always authoritative is well-supported.

  ## 2. Where the dinner-party version overreaches

  ### a. “Fiction” does not mean “unreal”

  Your friend said consciousness is “a handy fiction.” Dennett does sometimes use words like “fiction” or “illusion,” but he is careful. He does not mean consciousness doesn’t exist. He means it is not what it seems.

  The desktop icon is not the file, but it is also not a lie. It is a functional representation. When you drag the icon to the trash, the file really gets deleted. The action is real at the interface level. In the same way, Dennett would say: yes, there is consciousness; yes, there is experience; it just is not a private theater with an inner spectator.

  The danger is slipping from “the self is constructed” to “the self is fake.” A center of gravity is also constructed, but it is not an illusion in the dismissive sense. It is a real pattern with real explanatory power.

  ### b. Libet-style experiments do not show what your friend thinks they show

  The classic Libet experiment found that a readiness potential in the brain begins before participants report the conscious intention to move. So the popular story became: “Your brain decides before you do.”

  But there are serious interpretive issues.

  - The readiness potential may reflect general preparation, not the specific decision.
  - The timing of the conscious intention is itself a retrospective judgment, and such judgments are unreliable.
  - The decision is not a single moment in the brain; it is a process.
  - The task is usually trivial and weird: “flex your wrist at a time of your choosing.” That is not like deciding to marry someone, write a novel, or change careers.

  Dennett’s own view is that asking exactly when a decision becomes conscious is often a bad question, because there is no Cartesian theater where that moment could be located. So even if some neural activity precedes conscious awareness in simple movements, that does not prove consciousness is always a post-hoc storyteller.

  ### c. “Dennett has pretty much proved this” is false

  Dennett has argued for a philosophical interpretation of consciousness. It is influential, but it is not consensus. Philosophers like Chalmers, Nagel, and others think Dennett explains something important but leaves out phenomenal consciousness. Neuroscientists also disagree about what Libet-style findings mean. So no, nobody has “pretty much proved” this.

  ## 3. The slide to free will

  Here is the crucial move.

  Your friend goes:

  > Consciousness is a user illusion, and some experiments show unconscious processes precede conscious awareness.  
  > Therefore consciousness is a post-hoc story.  
  > Therefore free will is an illusion.

  The hidden premise is something like:

  > Real free will would require a non-constructed, fully transparent, conscious self that is the ultimate cause of its actions.

  Dennett rejects that premise.

  Dennett is a compatibilist. He explicitly believes in free will. But he means something different from the libertarian notion of free will as a causeless, ghostly act of pure conscious will. For Dennett, free will is a real set of capacities:

  - the ability to deliberate,
  - the ability to act on reasons,
  - the ability to inhibit impulses,
  - the ability to be responsive to norms,
  - the ability to act without coercion or manipulation.

  None of that requires consciousness to be a transparent window into neural processing. None of it requires the conscious self to be a little uncaused cause sitting in a control room.

  Dennett’s point is often that the kind of free will worth wanting is not the impossible kind. If your actions were random or causally disconnected from your history, values, and reasons, they would not be more free. They would be unintelligible.

  The desktop metaphor actually cuts against the “free will is an illusion” conclusion. Dragging an icon to the trash does not require you to be aware of the machine code. The icon is a simplification. But the deletion still happens. The action at the interface level is real. Likewise, a conscious intention can be a compressed, high-level representation of a complicated neural process and still be causally relevant. If a conscious thought becomes “famous” in the brain, it can shape later processing, memory, and action.

  So the slide happens when your friend does this:

  1. Start with: *Consciousness is a simplified representation.*  
     — reasonable.

  2. Then: *Consciousness is a causally inert story told after the fact.*  
     — not entailed; mostly false as a general claim.

  3. Then: *Free will requires a non-constructed, transparent, causally original conscious self.*  
     — smuggled in.

  4. Conclude: *Therefore free will is an illusion.*  
     — follows only if you accept the smuggled premise.

  ## 4. For your novelist purposes

  The more Dennettian twist is not “my agency is fake.” It is:

  > “The driver is not a ghost in the skull. The driver is the whole embodied system. My conscious life is a real interface, but it is not the whole engine. I am both less and more than the little self I thought I was.”

  That can be more existentially unsettling — and more philosophically interesting — than the simple “free will is an illusion” line. The character does not discover that they are not driving. They discover that the driver is not who they thought it was.
