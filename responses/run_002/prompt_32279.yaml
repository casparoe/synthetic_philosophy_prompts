  **1. Literal observational report.** 
  Content: "This object here (my hand) exists / is a hand." In ordinary context, true and known by perception.
  Anti-skeptical force: By itself, zero unless joined to an argument. The skeptic can accept it as appearance ("you are appeared to hand-ly") but deny mind-independent hand. If used against external-world skepticism, it is question-begging if it assumes external object.

  **2. Moore's official proof (modus ponens).**
  Content: P1: Here is one hand, P2: Here is another; C: at least two external things exist. The proof is valid; premises are known so conclusion known.
  Anti-skeptical force: It shows that if this is a proof, external-world skepticism is false. It forces skeptic to reject a very ordinary premise. But whether it's question-begging is the key debate. It doesn't answer "how do you know premise?"; Moore says not every premise needs proof.

  **3. Common-sense particularism / Moorean fact.**
  Content: The proposition "here is a hand" is more certain than any premise in skeptical arguments (e.g., "you can't know if you can't rule out BIV"). Therefore rational to retain hand belief and reject skeptical premise.
  Anti-skeptical force: Strong dialectical pressure. It rejects demand to justify ordinary knowledge from neutral/scrupulous starting point. It exposes that skepticism trades on less certain principles. This is probably the most defensible anti-skeptical use.
  Limits: It doesn't explain how knowledge is possible; it's a methodological stance. Can feel dogmatic.

  **4. Hinge proposition / Wittgensteinian reading.**
  Content: "Here is a hand" in radical skeptical context functions not as empirical claim but as "hinge" or framework certainty—something we act on, not something we have evidence for. Doubting it is not a mistake but fails to make sense in ordinary language. 
  Anti-skeptical force: It dissolves rather than refutes: the skeptic demands justification for a hinge as if it were an empirical claim. 
  Limits: Doesn't prove external world; may not satisfy traditional epistemologist. If professor uses it as conversation-ender, maybe treat as "the skeptic's question is idle."

  **5. Direct realist / perceptual acquaintance claim.**
  Content: In saying "here is one hand," Moore is not just reporting sense data; he is claiming direct awareness of a mind-independent object. Perception is a relation to the hand itself.
  Anti-skeptical force: If true, it undercuts skepticism by denying the gap between appearance and reality. 
  Limits: It is a substantive metaphysical claim requiring argument; the skeptic won't grant it. Saying it doesn't establish it.

  **6. Contextualist / standards-shift reading.**
  Content: In ordinary contexts, "I know here is a hand" is true because the standards for knowledge are low; in the seminar's skeptical context, standards are raised, so the same claim may be false or inappropriate. The professor may be invoking ordinary standards to show the skeptic has changed the rules.
  Anti-skeptical force: It diagnoses a shift, but doesn't refute high-standards skepticism. It pressures the skeptic to say why their higher standards are the right ones.
  Limits: If the worry is about high-standards knowledge, it doesn't address it.

  **7. Semantic/paradigm-case reading.**
  Content: "Here is a hand" is a paradigm case of an external-world proposition; if one understands "hand" and "here", one can see it's true. Denying it may change the meaning of "hand" or "external." 
  Anti-skeptical force: It suggests skepticism's reach exceeds semantic sense. 
  Limits: Less common, less strong.

