answer: |-
  What you are describing has an established name: it is the preface paradox, introduced by David Makinson in 1965. The classic example is exactly your situation. An author finishes a nonfiction book, checks every claim as carefully as possible, and is prepared to defend each one. Yet in the preface the author honestly says that, given human fallibility and the length of the book, there is surely at least one mistake somewhere. The author believes each individual claim, but also believes that the conjunction of all the claims is false. That is the predicament you find yourself in.

  The logical structure is this. You believe P1, P2, and so on through Pn. You also believe not-(P1 and P2 and ... and Pn), since you believe the book contains at least one error. But the set of beliefs consisting of P1, P2, ..., Pn, and the negation of their conjunction is inconsistent. If all the individual claims are true, then their conjunction is true, and the belief that at least one is false cannot also be true. So your beliefs cannot all be true together. That is the sense in which the configuration is paradoxical.

  Whether this makes you irrational depends on what you think rationality requires of belief. If rationality requires deductive cogency, meaning that a rational person’s beliefs should be logically consistent and closed under logical consequence, then your state is irrational. The relevant principle is sometimes called conjunction closure or agglomeration. It says that if you are rational to believe A and rational to believe B, then you are rational to believe A and B. Applied to your case, if you are rational to believe each individual claim, then you should be rational to believe the whole conjunction. But you also believe the negation of that conjunction. So something has to go.

  The reason the preface paradox is interesting is that it is not obvious which belief should be abandoned. You have good evidence for each individual claim, and you have good inductive evidence, based on long experience with book-length works, that at least one claim is probably false. But you have no evidence about which claim is false. Abandoning a specific claim would be arbitrary. Abandoning the general belief that the book contains a mistake would ignore your own fallibility. So the paradox exposes a tension between two plausible ideas: that rational belief should be consistent and closed under conjunction, and that a fallible person can rationally believe each part of a large body of claims while also rationally believing that the whole body contains an error.

  There are several ways one might try to make room for your state. One is to give up the idea that rational belief is closed under conjunction. On this view, you can rationally believe each individual claim without being rationally committed to believing the enormous conjunction of all of them. But notice that this alone does not fully solve your problem, because you do not merely fail to believe the conjunction; you positively believe its negation. So your belief set is already inconsistent, not merely unclosed. To hold exactly the beliefs you describe, you would need to give up the requirement that a rational person’s beliefs must be logically consistent, or at least accept that consistency is an ideal that real, fallible inquirers may violate without being unreasonable.

  Another response is to distinguish between flat-out belief and graded confidence. If you think in terms of degrees of belief, there is no paradox at all. You can assign a high probability to each individual claim, say 0.99, and yet assign a low probability to the conjunction of hundreds of such claims. If the claims are independent, the probability of all of them being true may be quite small even though each one is highly likely. This is perfectly coherent probabilistically. The paradox only arises when you shift from “I am highly confident in each claim” to “I believe each claim outright.” If you are willing to say that your attitude toward each claim is really high confidence rather than flat-out belief, then your state is not irrational at all. But if you insist that you genuinely believe each claim, and also genuinely believe that at least one is false, then you are squarely in the preface paradox.

  There is an important sibling called the lottery paradox, and the distinction you asked about is exactly the difference between them. In the lottery paradox, there is a fair lottery with one guaranteed winner and many tickets. For each ticket, it is overwhelmingly likely that it will lose, so a standard rule of acceptance might say you are rational to believe that ticket one will lose, ticket two will lose, and so on. But you also know that one ticket will win. So you seem rationally committed to believing each ticket loses while also believing that not all tickets lose. Here the source of the tension is a structured chance setup: you know the exact probabilistic structure, and the individual beliefs are generated by a threshold for high probability. In the preface paradox, by contrast, the belief that at least one claim is false is based on general inductive evidence about human fallibility, not on a known formal structure. The individual claims may be about independent matters of fact, but they need not be; they may be based on different kinds of evidence. The logical conflict is the same, but the epistemic source is different. This matters because some solutions to the lottery paradox, such as rejecting a simple probabilistic acceptance rule, do not automatically solve the preface paradox. Conversely, saying that fallible authors can rationally believe each claim while also believing there is an error may not help with the lottery case, where the structure is mathematically certain.

  You also asked whether the puzzle changes if the claims are about independent matters of fact rather than the outcomes of a structured chance setup. In one way, independence makes the probabilistic picture easier: if each claim is highly likely but not certain, and there are enough claims, then the probability that at least one is false can be very high even though the probability of each individual claim is also high. That is not a paradox for graded belief. But for flat-out belief, independence does not remove the inconsistency. You still cannot rationally believe each claim, believe that at least one is false, and also satisfy the requirement that all your beliefs be consistent and closed under conjunction. The independence of the claims may make it easier to see why the preface belief is reasonable, but it does not dissolve the conflict.

  There are a few variations and nearby phenomena worth knowing. One is the fallibility paradox, which is essentially the preface paradox applied to your entire body of beliefs: you may believe each of your beliefs, yet also believe that at least one of your beliefs is false because you are a fallible creature. Another variation arises if the preface statement itself is included among the claims in the book. That can create a self-referential twist, since the claim “this book contains at least one error” is itself one of the book’s claims. Usually the preface paradox is stated with the preface belief held outside the set of first-order claims, or at least not counted among the P1 through Pn. If it is included, the logical structure becomes more tangled, but the core point remains the same.

  So the short answer is that you are not alone, and the configuration is not just a quirk of your psychology. It is a recognized philosophical problem. If I had to define it precisely, I would say the preface paradox is the state of having good enough evidence to believe each member of a set of propositions, while also having good enough evidence to believe that at least one member of that set is false, without having any evidence that identifies which one. The result is an inconsistent set of beliefs in which every member seems individually justified. To make room for it, you must either reject the requirement that rational belief sets be consistent, reject the closure of rational belief under conjunction, or reinterpret your attitude toward the individual claims as something less than flat-out belief, such as high confidence or acceptance for practical purposes. Each of those moves has costs, and philosophers disagree about which is best. That is why the preface paradox remains a live problem rather than a solved puzzle.
