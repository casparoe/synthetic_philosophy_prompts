  Crux A: Collapse into global democracy.
  Text:
  ```
  Sub-question: Does the all-affected principle, given real causal interdependence, require a global demos for nearly all significant decisions? If it does, is that a feasible and desirable extension of democracy, or a reductio?

  Both sides agree that the following bear on:
  - Case studies of policy spillovers (climate, tax competition, trade rules, pandemics, digital privacy). Do affected classes stop at state borders?
  - Conceptual work on "significant affectedness": can a threshold/baseline be specified without appealing to legal jurisdiction?
  - Institutional proposals for global democracy, overlapping demoi, subsidiarity. Do they preserve accountability and self-government?
  - Comparative evidence from the EU and other transnational polities.

  All-affected prediction: The principle either does not collapse because non-arbitrary significance thresholds and issue-specific demoi can be identified, or it pushes toward transnational/global democracy, which is morally required and institutionally possible. Either way not a refutation.
  All-subjected prediction: The principle collapses or retreats to an arbitrary stopping rule. Any stable demos under AAI will implicitly rely on legal subjection or existing jurisdictions, so the principle cannot independently solve the boundary problem.
  ```

  Crux B: Can affectedness be specified?
  ```
  Sub-question: Can "significantly affected" be defined in a way that is non-arbitrary, operationalizable, and compatible with bounded demoi?

  Both sides agree:
  - Conceptual analyses of interests, basic capabilities, causal responsibility, and baselines.
  - Empirical causal mapping of specific decision types.
  - Test cases: economic spillovers, environmental harm, cultural influence, security externalities.
  - Institutional capacity to measure and process affectedness claims.

  AAI: A threshold based on basic interests or morally significant stakes can be specified; legal concepts often use similar standards (e.g. harm, risk). Perfect precision is not required.
  AS: "Affected" is too scalar and causally promiscuous. Any threshold will either be morally contested or borrow from subjection/jurisdiction; thus AAI cannot demarcate a demos.
  ```

  Crux C: Is all-subjected under-inclusive?
  ```
  Sub-question: Are there cases where people are not subject to a state's coercive legal order but are so seriously affected by its decisions that they should have a say, such that all-subjected is too narrow?

  Both sides agree:
  - Normative analysis of domination, self-government, and what it means to "have a say" in decisions that set the terms of one's life.
  - Case studies of transboundary pollution, climate change, tax and financial regulatory spillovers, and economic coercion without formal legal subjection.
  - Empirical evidence on whether non-membership duties (harm avoidance, compensation, diplomacy, international law) actually protect affected outsiders.

  AAI: There are clear cases where subjection is absent but stakes are high. All-subjected will either stretch "subjection" beyond legal coercion or deny voice to people with urgent claims.
  AS: The hard cases either involve implicit subjection to some coercive order or can be handled by non-membership duties. Denying demos membership is not denying moral standing.
  ```

  Crux D: Scalar vs threshold.
  ```
  Sub-question: Should democratic inclusion come in degrees, or is it an equal status within a bounded demos?

  Both sides agree:
  - Democratic theory on equal moral worth, equal standing, and domination.
  - Institutional and experimental evidence on weighted voting, stakeholder models, and issue-specific participation.
  - Historical/contemporary cases of weighted representation (e.g. corporate governance, EU Council, consociational systems).

  AAI: Affectedness is scalar; differential voice can better match stakes and can be designed without creating domination. Equal votes are one possible implementation, not a requirement.
  AS: Equal membership is required to prevent hierarchy; weighting tends to entrench inequality. Even if interests differ, subjection to a common coercive order gives each an equal claim to control it.
  ```

  Crux E: How broad is coercion/subjection?
  ```
  Sub-question: Does "subjection to coercion" cover forms of state power that structure people's options without direct legal commands—market-structuring rules, environmental externalities, extraterritorial regulation, migration control—or is it narrower?

  Both sides agree:
  - Philosophical accounts of coercion, power, and domination.
  - Legal and sociological analyses of how state and transnational power operates in practice.
