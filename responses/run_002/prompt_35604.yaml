  Potential shared claims:
  ```
  1. The boundary problem is the problem of determining the set of persons who are entitled to participate in a given collective decision or in authorizing, contesting, and changing an ongoing political order. 
  2. The boundary problem is not solved by pointing to existing legal borders or citizenship lists. Those borders and lists are themselves part of what must be justified; using them as the answer would beg the question.
  3. The stakes are high. If the demos is drawn too narrowly, persons can be subjected to or strongly affected by decisions they had no right to influence, which can amount to domination. If drawn too broadly, the connection between participation and self-government may be weakened, and decision-making may become unworkable or unaccountable.
  4. Any acceptable principle must be general and non-arbitrary: it must identify a relation between a person and a political power or decision that justifies inclusion without appealing to invidious or parochial characteristics.
  5. Both camps agree that systematic subjection to the coercive enforcement of a legal-political order is a weighty and normally sufficient trigger for democratic inclusion. The disagreement concerns whether it is also necessary, and whether serious affectedness not involving legal subjection can also trigger inclusion.
  6. Both camps agree that inclusion is not only about voting. It includes rights to contest, to be given reasons, to participate in agenda-setting, and to have standing in institutions that make or apply decisions.
  7. Both camps agree that the boundary problem has transnational dimensions: migration, climate change, trade, public health, security, and global regulatory institutions make it common for those affected by or subject to political power not to coincide with the citizenry of a single state.
  8. Both camps agree that principles must be evaluated by their institutional implications. If a principle could not be applied without collapsing into a global demos, or without relying on unexplained exclusions, that would be a serious difficulty unless the camp advocating it can show the implication is defensible.
  9. Both camps accept that the dispute is partly normative and partly empirical. It is normative because it concerns what relation (affectedness, subjection, coercion, etc.) has inclusion-generating force. It is empirical because it depends on how laws, economies, environmental harms, and coercive institutions actually distribute effects and constraints.
  10. Both camps are open to distinguishing the fundamental criterion of membership from the institutional forms used to realize it. The fact that a principle is demanding to implement does not by itself refute it; but implementation failures can reveal defects in the criterion.
  ```
