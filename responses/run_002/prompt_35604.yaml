answer: |-
  # The Boundary Problem: An Adversarial Collaboration

  ## Preamble

  This document records the genuine common ground, the central disagreements, and the cruxes of the debate between the all-affected interests camp and the all-subjected camp. The shared claims below are ones both camps can sign without equivocation. The table of disagreements is intended to state each camp’s view in terms its own members would recognize and own, not a caricature. The cruxes are the sub-questions that, if resolved, would cause at least one camp to revise its position or its practical implications.

  ---

  ## I. Shared Claims

  Both camps can genuinely sign the following claims:

  1. **The boundary problem** is the problem of determining the set of people who are entitled to participate in making a given collective decision, or in authorizing, contesting, and changing an ongoing political order.

  2. **Existing legal borders and citizenship lists do not settle the boundary problem.** They are themselves outcomes of an already-bounded political process. Any defensible principle must be able to criticize and, where necessary, revise them.

  3. **The stakes are high.** If the demos is drawn too narrowly, people can be subjected to, or seriously affected by, decisions they had no right to influence—amounting to a form of domination. If it is drawn too broadly, the connection between participation and self-government may be weakened, and decision-making may become unworkable or unaccountable.

  4. **Any acceptable principle must be general and non-arbitrary.** It cannot exclude people on invidious grounds such as race, sex, class, religion, or nationality as such. Any use of such categories must be derivative from a defensible inclusion criterion.

  5. **Systematic subjection to the coercive enforcement of a legal-political order is a weighty and normally sufficient trigger for democratic inclusion under both views.** The disagreement is not whether subjection matters, but whether it is necessary and whether other forms of serious affectedness can also trigger inclusion.

  6. **Inclusion is not only about voting.** It includes rights to contest decisions, to be given reasons, to participate in agenda-setting, and to have standing in the institutions that make or apply decisions.

  7. **Literal causal affectedness is not enough for either camp.** Both camps reject the view that every person touched by any causal effect, however trivial, is thereby entitled to participate. The dispute is about the correct threshold and the kind of relation that crosses it.

  8. **Excluding someone from a demos does not automatically mean their interests may be ignored.** Democratic membership is one part of a larger set of moral and political claims. The question is whether non-membership duties are sufficient in particular cases.

  9. **The boundary problem has transnational dimensions.** Migration, climate change, trade, finance, public health, security, and global regulatory institutions make it common for those affected by or subject to political power not to coincide with the citizenry of a single state.

  10. **Both camps evaluate principles by their institutional implications.** If a principle could not be applied without collapsing into a global demos, or without relying on unexplained exclusions, that would be a serious difficulty unless the camp advocating it can show the implication is defensible.

  11. **The dispute is partly normative and partly empirical.** It is normative because it concerns what relation—affectedness, subjection, coercion, or something else—has inclusion-generating force. It is empirical because it depends on how laws, economies, environmental harms, and coercive institutions actually distribute effects and constraints.

  12. **Each camp bears a specific burden.** The all-affected camp must explain what makes an effect significant enough to ground inclusion and how that can be identified non-arbitrarily. The all-subjected camp must explain why subjection to coercion, rather than serious affectedness, has the special legitimacy-conferring role, and how “subjection” is to be delimited.

  ---

  ## II. Table of Disagreements

  | Sub-question | All-affected camp answer | All-subjected camp answer |
  |---|---|---|
  | **What is the basic inclusion-generating relation?** | A person has a claim to inclusion when a decision or ongoing political order significantly affects their interests. The demos should track the reach of significant effects, not formal legal membership. | A person has a claim to inclusion when they are systematically subject to the coercive legal and political power of the decision-making body. The demos should track subjection, not affectedness as such. |
  | **Is coercion necessary for democratic inclusion?** | No. Coercion is one especially severe form of affectedness, but noncoercive effects—such as serious economic deprivation, environmental harm, or agenda-setting power—can also ground inclusion. | Yes. The inclusion-grounding relation is subjection to coercion or binding legal power. Noncoercive effects may ground other duties, such as duties not to harm or to compensate, but they do not by themselves make someone part of the demos. |
  | **How should we treat noncitizen long-term residents?** | They must be included because they are systematically and deeply affected by the state’s decisions. Their exclusion is a paradigm failure of the affectedness view. | They must be included because they are systematically subject to the same laws and enforcement as citizens. The reason is subjection, not affectedness. |
  | **Do people downwind of a state’s pollution have a say in that state’s decisions?** | Yes. They have a claim to voice in the decisions producing the pollution, or in a broader regulatory structure governing it. Their affectedness gives them standing even though they are not inside the state’s legal jurisdiction. | They are owed protection, compensation, and a say in any coercive regulatory regime created to address the externality. But they do not become members of the polluting state’s demos merely by being harmed by it. |
  | **Do future generations belong to the demos?** | Future persons, where their basic interests will be significantly affected by present decisions, have inclusion claims that can be institutionalized through proxies, trustees, constitutional constraints, or similar mechanisms. | Future persons are not now subject to the present legal order’s coercive enforcement. We have moral duties to them, including duties not to harm and to sustain just institutions, but they are not members of the present demos. |
  | **Should inclusion be equal or weighted?** | Because affectedness comes in degrees, democratic voice can in principle be weighted or differentiated by the degree and kind of affectedness. Equal votes are one institutional device, not the definition of inclusion. | Subjection to a common coercive order is a threshold status. Within a bounded demos, members should have equal political rights; unequal voice tends to recreate domination. |
  | **How do global governance institutions affect the boundary problem?** | Those significantly affected by institutions such as the WTO, IMF, or climate regimes should have a say in them or in a broader democratic architecture. This may require overlapping or even global demoi. | People should be included in those institutions when and insofar as the institutions exercise coercive authority over them. That may well include many global governance institutions, but the trigger is subjection, not affectedness. |
  | **What moral weight do existing borders and citizenship have?** | Existing borders and citizenship are at most proxies for affectedness, and often poor ones. They have no independent moral authority. | Existing borders and citizenship are not the fundamental criterion either. Borders matter insofar as they mark the reach of a coercive legal order; citizenship may be an administrative status within that order, but noncitizens who are subject to the law are also part of the demos. |
  | **What is the central criticism of the other view?** | The all-subjected principle overstates the moral importance of legal coercion and therefore risks excluding people with urgent stakes in decisions that govern their lives. | The all-affected principle underdetermines boundaries because it relies on a notion of significant affectedness that cannot be specified without arbitrary or contested thresholds; it also risks dissolving bounded self-government. |

  ---

  ## III. Cruxes

  A crux is a sub-question whose resolution would move at least one side. For each crux, both camps agree on the kinds of evidence and argument that would bear on it.

  ### A. Does the all-affected principle collapse into requiring global democracy?

  **Sub-question:** Does the all-affected principle, given real causal interdependence, require a global demos for nearly all important decisions? If it does, is that a feasible and desirable extension of democracy, or a reductio?

  **What both sides agree would bear on this:**

  - Case studies of policy spillovers in areas such as climate, tax competition, trade rules, pandemics, and digital privacy. Do affected classes stop at state borders?
  - Conceptual work on “significant affectedness”: can a threshold and baseline be specified without appealing to legal jurisdiction?
  - Institutional proposals for global democracy, overlapping demoi, subsidiarity, and transnational representation.
  - Comparative evidence from the European Union and other transnational polities about whether inclusion can scale while preserving accountability and self-government.

  **All-affected prediction:** The principle either does not collapse because non-arbitrary significance thresholds and issue-specific demoi can be identified, or it pushes toward transnational/global democracy, which is morally required and institutionally possible. Either way, the implication is not a refutation.

  **All-subjected prediction:** The principle either collapses into global democracy or retreats to an arbitrary stopping rule. Any stable demos under the all-affected principle will implicitly rely on legal subjection or existing jurisdictions, so the principle cannot independently solve the boundary problem.

  ---

  ### B. Can “affectedness” be specified non-arbitrarily?

  **Sub-question:** Can “significantly affected” be defined in a way that is non-arbitrary, operationalizable, and compatible with bounded demoi?

  **What both sides agree would bear on this:**

  - Conceptual analyses of interests, basic capabilities, causal responsibility, and baselines.
  - Empirical causal mapping of specific decision types.
  - Test cases: economic spillovers, environmental harm, cultural influence, and security externalities.
  - Institutional capacity to measure and process affectedness claims.

  **All-affected prediction:** A threshold based on basic interests or morally significant stakes can be specified. Legal and moral concepts often use similar standards, such as harm, risk, and reasonableness. Perfect precision is not required for a criterion to be usable and superior to existing boundaries.

  **All-subjected prediction:** “Affected” is too scalar and causally promiscuous. Any threshold will either be morally contested or will borrow from subjection or jurisdiction. The all-affected principle therefore cannot demarcate a demos prior to democratic decision-making.

  ---

  ### C. Is the all-subjected principle under-inclusive?

  **Sub-question:** Are there morally significant cases in which people are not subject to a state’s coercive legal order but are so seriously affected by its decisions that they should have a say, making the all-subjected principle too narrow?

  **What both sides agree would bear on this:**

  - Normative analysis of domination, self-government, and what it means to “have a say” in decisions that set the terms of one’s life.
  - Case studies of transboundary pollution, climate change, tax and financial regulatory spillovers, and economic coercion without formal legal subjection.
  - Empirical evidence on whether non-membership duties—such as harm avoidance, compensation, diplomacy, and international law—actually protect affected outsiders.

  **All-affected prediction:** There are clear cases where subjection is absent but the stakes are high. The all-subjected camp will either stretch “subjection” beyond legal coercion or deny democratic voice to people with urgent claims.

  **All-subjected prediction:** The hard cases either involve implicit subjection to some coercive order—often a global or transnational one—or can be handled by non-membership duties. Denying demos membership is not denying moral standing.

  ---

  ### D. Should democratic inclusion be scalar or threshold-based?

  **Sub-question:** Should democratic inclusion come in degrees, or is it an equal status within a bounded demos?

  **What both sides agree would bear on this:**

  - Democratic theory on equal moral worth, equal standing, and domination.
  - Institutional and experimental evidence on weighted voting, stakeholder models, and issue-specific participation.
  - Historical and contemporary cases of weighted representation, such as corporate governance, consociational systems, and the EU Council.

  **All-affected prediction:** Affectedness is scalar. Differential voice can better match stakes and can be designed without creating domination. Equal votes are one possible implementation, not a requirement of inclusion.

  **All-subjected prediction:** Equal membership is required to prevent hierarchy. Weighted voice tends to entrench inequality. Even if interests differ, subjection to a common coercive order gives each person an equal claim to control it.

  ---

  ### E. How broadly should “coercion” or “subjection” be understood?

  **Sub-question:** Does “subjection to coercion” cover forms of state power that structure people’s options without direct legal commands—such as market-structuring rules, environmental externalities, extraterritorial regulation, and migration control—or is it narrower?

  **What both sides agree would bear on this:**

  - Philosophical accounts of coercion, power, and domination.
  - Legal and sociological analyses of how state and transnational power actually operates.
  - Borderline cases: climate emissions, financial sanctions, supply-chain regulation, and tax laws with global incidence.

  **All-affected prediction:** A broad account of coercion will include much of what we call affectedness, narrowing the disagreement. A narrow account will be artificially legalistic and will miss real political power.

  **All-subjected prediction:** A principled line can be drawn between systematic subjection to a binding legal-political order and diffuse causal effects. Some hard cases may count as subjection, but that is a refinement of the criterion, not a collapse into affectedness.

  ---

  ## IV. Verbal vs. Substantive Disagreement

  Part of this dispute is verbal. The two camps sometimes use “coercion” and “subjection” narrowly or broadly, and they sometimes use “affected” broadly or narrowly. When both terms are left undefined, the camps talk past each other.

  For example, if “subjection” is read broadly enough to include systematic state-caused vulnerability—even without a direct legal command—then the all-subjected principle may include many of the people the all-affected camp worries about. Conversely, if “affected” is read narrowly as “significant impact on basic interests by collective power,” then the all-affected principle may not be as expansive as the all-subjected camp fears.

  The substantive residue is not merely verbal. The following points would remain even after the key terms are clarified:

  1. Whether significant but non-coercive effects generate democratic membership.
  2. Whether inclusion is a threshold status or a matter of degree.
  3. Whether a global demos is an acceptable implication or a fatal one.
  4. Whether non-membership duties can adequately substitute for democratic voice.

  Both camps therefore agree to state their preferred interpretation of “affectedness” and “subjection” in future exchanges. But they also agree that clarifying terms will not by itself resolve the boundary problem.
