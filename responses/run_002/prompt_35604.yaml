  Title: "The Boundary Problem: An Adversarial Collaboration Between the All-Affected and All-Subjected Camps"

  Preamble: This document records genuine agreement, disagreement, and cruxes. We use "all-affected" and "all-subjected" as labels for camps, not as claims every member endorses in exactly same form; the statements below are ones the respective camps can endorse. We distinguish two questions: (a) who is entitled to be a member of a demos for a given decision/polity? (b) what is the normative basis of that entitlement?

  Shared Claims:
  1. The boundary problem is the problem of identifying the proper demos—the set of persons who ought to have a say in making a given collective decision or in authorizing/contesting an ongoing political order.
  2. The boundary problem is prior to or at least coeval with ordinary democratic decision-making: a democratic procedure cannot supply its own membership rule without circularity. Existing legal borders and citizenship lists cannot escape this problem, because they are themselves products of an already-bounded political process and may be contested.
  3. The boundary problem is not merely theoretical. Getting it wrong can produce domination, exclusion, and exploitation: some people may be made to bear the consequences of decisions they had no opportunity to influence, while others may have a voice in decisions that do not sufficiently affect them.
  4. Any adequate principle must be general, non-arbitrary, and compatible with the equality of persons. It cannot exclude people merely on invidious grounds such as race, ethnicity, sex, class, religion, or nationality as such; if such categories matter, that must be derivative of a defensible inclusion criterion.
  5. Both camps agree that being subject to a state's coercive enforcement of law is a core case of the relation that triggers democratic inclusion; the disagreement concerns whether this relation is necessary, and whether other forms of serious affectedness can also trigger inclusion.
  6. Both camps agree that a polity’s legitimate authority over persons is not established simply by the fact that it applies its laws to them; the composition of the demos must be justified to those included and to those excluded who are plausibly relevant.
  7. Both camps accept that the boundary problem interacts with other values: self-determination, stability, administrative feasibility, effective governance, individual liberty, and the protection of basic interests. A demos principle may have to be institutionalized through legal and political mechanisms, not simply declared.
  8. Both camps are committed to evaluating principles by their institutional implications. If a principle could not be applied without collapsing into no boundaries at all, or without relying on unexplained exclusions, that would be a serious defect unless the camp supporting it can show why that implication is acceptable.
  9. We share the view that the boundary problem has important transnational dimensions: climate change, migration, trade, investment, public health, security, and global regulatory institutions ensure that the people affected by or subject to political power often do not match the citizenry of a single state.
  10. We agree that the disagreement is not merely semantic, but part of it may be: "affectedness" and "subjection to coercion" are both contested concepts, and some apparent disagreement depends on how broadly or narrowly each is defined.

