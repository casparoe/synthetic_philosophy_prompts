  ## 3. Verbal vs. Substantive Disagreement

  Some of our dispute is verbal, but not all of it.

  ### 3.1 Largely verbal: the word “confirmation”

  S often uses “confirmation” for a broad relation of evidential or explanatory support. D often uses “confirmation” for actual positive relevance or differential support. If “confirmation” is stipulated to mean positive relevance, then D wins trivially. If it is stipulated to mean explanatory support, then S wins trivially, but S then owes an account of how explanatory support connects to rational belief.

  The substantive remainder is this: **Must the normative Bayesian model of rational belief change represent explanatory support, and does Mercury-type support rationally increase confidence in the theory?**

  ### 3.2 Partly verbal: “known evidence means \(P(E)=1\)”

  S is often discussing an idealized rational agent for whom known propositions have probability 1. D is often discussing real agents whose empirical evidence is fallible. Both claims can be true. The substantive issue is whether the idealized model is the right target, and whether relaxing \(P(E)=1\) solves the problem or evades it.

  ### 3.3 Partly verbal: “standard apparatus”

  S means strict conditionalization on total actual evidence. D includes conditionalizing on a reduced background \(B^*\) or on a logical proposition \(L\). This is partly a dispute about what counts as “standard.” But it is also substantive: are those moves legitimate applications of the standard view, or are they tacit supplements?

  ### 3.4 Not merely verbal

  The following remain substantive:

  - Whether conditionalizing on \(L =\) “\(H\) entails \(E\)” captures confirmation by \(E\), or merely confirmation by a logical fact.
  - Whether likelihood ratios after subtracting \(E\) from the background can be uniquely and non-arbitrarily constrained.
  - Whether counterfactual priors can be non-arbitrary enough to play a normative role.
  - Whether there is absolute explanatory support independent of any comparison class.

  ---

  ## 4. Stability Check

  ### 4.1 Supplementationist

  **What would most likely make S substantially revise:**  
  A successful formal reduction showing that D’s preferred models—\(P(E)<1\), background subtraction, comparative likelihood ratios, or updating on logical learning—capture the full range of old-evidence cases, including the ideal \(P(E)=1\) case, with no residual explanatory support left over. Alternatively, a proof that counterfactual priors are always arbitrary or reducible to actual credences would force S to abandon supplementation.

  **Where S’s formulation is most fragile:**  
  S’s counterfactual prior can be tailored to yield the desired confirmation. Unless its constraints are stated in advance, S is doing exactly what the anti-relabeling clause forbids. S may also beg the question by assuming that explanatory support is probabilistic confirmation, and by treating the \(P(E)=1\) idealization as mandatory without defending that idealization as normatively relevant.

  ### 4.2 Deflationist

  **What would most likely make D substantially revise:**  
  A clean case in which \(P(E)<1\), background subtraction, comparative Bayes factors, and logical learning all fail to recover a robust old-evidence intuition—especially an ideal-agent case with \(P(E)=1\) and no rival. Or a representation theorem showing that any adequate model requires non-actual probabilities or additional structure not reducible to actual credences or likelihoods.

  **Where D’s formulation is most fragile:**  
  D may define confirmation as differential or actual credence change, thereby excluding S’s target by stipulation. D’s “background minus \(E\)” move can be as unconstrained as S’s ur-prior unless D gives a rule for what to remove. D also risks conflating real agents’ fallible knowledge with the idealized certainty case that generates the problem.

  ---

  We do not here declare a winner. The remaining disagreement—about idealization, logical learning, and the scope of Bayesian confirmation—is now the load-bearing one.
