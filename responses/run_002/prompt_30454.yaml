  # Old Evidence in Bayesian Confirmation Theory: An Adversarial Collaboration

  **Participants:** S (the supplementationist) and D (the deflationist)

  We have spent several weeks arguing about whether standard subjective Bayesian confirmation theory can handle “old evidence.” This document records what we now agree on, where our disagreement is genuinely load-bearing, and what would make each of us revise.

  ---

  ## 1. Agreed Claims

  1. **The formal core is uncontroversial.**  
     In a standard probability model, if evidence \(E\) is assigned probability 1, then for any hypothesis \(H\),
     \[
     P(H \mid E) = P(H).
     \]
     Thus, on the positive-relevance criterion—\(E\) confirms \(H\) just in case \(P(H \mid E) > P(H)\)—old evidence with \(P(E)=1\) cannot confirm any hypothesis. This is a theorem, not a contested interpretation.

  2. **The Mercury-type case is a datum to be accommodated.**  
     In the classic case, an anomaly such as the anomalous advance of Mercury’s perihelion was already accepted as an observational fact before general relativity was formulated. After the theory was formulated, it entailed or strongly predicted the anomaly. Scientists took this to be support for general relativity. Any adequate account must say something principled about this kind of case.

  3. **An adequate account must do more than relabel the intuition.**  
     It is not enough to say “the anomaly would have been surprising,” “general relativity explains the anomaly,” or “scientists were impressed.” A solution must tie those ideas to rational belief change, or explain why the apparent confirmatory force is not confirmation in the relevant sense. Introducing a new formal quantity without constraints is merely relabeling the problem.

  4. **The temporal order of discovery should not be doing silent work.**  
     An adequate account should not make old evidence confirm simply because it was discovered before the theory, nor should it make novel evidence confirm simply because it was discovered after. If temporal order matters, the account must say why; if it does not, the account must explain the apparent difference.

  5. **\(P(E)=1\) is an idealization.**  
     Assigning probability 1 to known empirical evidence is a common Bayesian idealization. Both sides agree that a fully satisfactory account must say what happens in the ideal limit and in more realistic models where \(P(E)<1\). We disagree about whether the idealization is harmless.

  6. **A solution must distinguish old-evidence confirmation from nearby phenomena.**  
     Old-evidence support must be distinguished from:
     - the prior plausibility of \(H\),
     - the fact that \(H\) entails or explains \(E\),
     - the psychological surprise value of \(E\),
     - the fact that \(E\) is a constraint any acceptable theory must satisfy,
     - comparative support against a known rival.

     If an account says that every theory entailing a known fact is thereby confirmed, that account is too permissive.

  7. **The disagreement should make a practical or normative difference.**  
     A disagreement is substantive only if it affects what a rational agent should believe, how scientific support should be represented, or which formal moves are legitimate. Otherwise it is verbal.

  ---

  ## 2. Disagreement Table

  | Row | Neutral statement | S’s formulation | D’s formulation | Crux or cruxes | Concrete case or constraint | S’s prediction | D’s prediction |
  |---|---|---|---|---|---|---|---|
  | 1 | Is the old-evidence problem a structural limitation of the positive-relevance criterion or an artifact of a bad idealization? | Structural limitation. If \(E\) is known, \(P(E)=1\), so \(P(H \mid E)=P(H)\). Mercury requires representing support by \(E\), so the formalism needs something added: counterfactual probabilities, logical-learning structure, or a broader notion of confirmation. | Artifact. Modeling known empirical evidence as \(P(E)=1\) is optional and misleading. Real agents can have \(P(E)<1\), or we can conditionalize on a background that excludes \(E\). Correctly applied, standard resources capture the support. | Whether known empirical evidence must be represented as \(P(E)=1\) in the relevant normative model; whether subtracting \(E\) from the background is principled. | The Mercury anomaly before general relativity. Ask whether standard conditioning on \(E\), or on a reduced background, yields an increase in \(P(\text{GR})\). | If \(P(E)=1\), no increase occurs. Lowering \(P(E)\) changes the idealized case rather than solving it. | With \(P(E)<1\) or \(B^*\) excluding \(E\), \(P(\text{GR} \mid E, B^*) > P(\text{GR} \mid B^*)\); the intuition is captured. |
