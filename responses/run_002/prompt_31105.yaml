answer: |-
  (a) My cases restated

  You hold that: (1) your conscious decision to raise your hand causes the movement; (2) the pain from a hot stove does not cause the withdrawal reflex, because the reflex is already underway before the pain; (3) your conscious belief in a placebo causes pain relief, even if it works via endorphins; (4) in Libet-style readiness-potential experiments, the conscious intention does not cause the movement because the brain starts gearing up earlier; (5) blindsight visual processing causes the reach but is not mental causation; (6) a chess engine’s evaluation function causes its move but is not mental causation. The autopilot case remains unsettled.

  (b) Candidate principles

  **1. Token identity plus consciousness.**  
  A conscious mental state M causes outcome O just in case M is token-identical to a neural state N, and N causes O. This is the sharpened version of your “same occurrence as the neural state doing the work” hunch. It handles (1) and (3): the conscious decision/belief is the very neural state that does the causing. It handles (2): the pain is not identical to the spinal-reflex state causing withdrawal. It handles (5) and (6): the causal states are not conscious. But it puts pressure on (4). If the conscious intention in Libet is realized by a neural event in the causal chain after the readiness potential but before the movement, then it is a cause. Libet shows at most that it is not the first cause. So this principle forces you to give up or weaken the unqualified version of (4).

  **2. Conscious difference-making/control.**  
  A conscious mental state M causes outcome O just in case M is conscious, and the physical/informational state realizing M is a difference-maker for O: O would not have happened, or would have been different, without it. Moreover, M must not be a mere readout of a selection already made. This best fits the whole list. It keeps (1) and (3): the decision and belief are in the control loop. It keeps (2): pain is not a difference-maker for withdrawal. It can keep (4): if the Libet intention is a conscious readout rather than a difference-maker, then it does not cause the movement. But it also says that if the intention’s neural realizer is a difference-maker, then (4) is false. It keeps (5) and (6) out because those states are not conscious.

  **3. Contentful information processing without a consciousness requirement.**  
  Any contentful state that drives behavior counts as mental causation. This would make blindsight visual processing and the chess engine’s evaluation function cases of mental causation, so your verdicts (5) and (6) would have to go. That is not the principle behind your list.

  (c) What has to give

  The short answer: the verdict to give up, or at least seriously qualify, is the unqualified version of (4). Lateness relative to the readiness potential does not by itself show that the conscious intention is epiphenomenal. A later state can still be a cause if its neural realizer is a genuine difference-maker. If you adopt the simple token-identity principle, (4) is the verdict that cannot be accommodated as stated. If you adopt the preferred conscious difference-making principle, none of your six gut verdicts has to go, but your half-formed “late add-on” criterion has to go: what matters is not temporal lateness but whether the conscious state is in the causal control loop rather than being a byproduct or readout. Under the no-consciousness functionalist principle, by contrast, (5) and (6) have to go.

  (d) The autopilot case and one more

  On the preferred conscious difference-making principle, driving home on autopilot is best described as nonconscious contentful causation. Your route knowledge genuinely controls the turn, but it is not conscious at that moment, so it is not mental causation in the sense you have been using—unless there was a standing conscious intention or goal, such as “I’m driving home,” still in the control loop. So the turn did not run off without any cause; it ran off without a conscious mental cause. If you count nonconscious knowledge as a mental state, then it is a mental cause, but that would pull against your blindsight and chess-engine verdicts.

  One further case: you brake before you consciously see a child running onto the road. Nonconscious visual processing causes the braking, but it is not mental causation in your sense. A standing conscious intention to avoid hazards would be a background mental cause. This case, like autopilot, shows the principle in action: conscious content is a mental cause when it is in the control loop, not when it is merely a late report or an unconscious process.
