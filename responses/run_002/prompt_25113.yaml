  For "WWI was a fluke of diplomatic micro-events" and "not structurally inevitable" to go through, he needs something like 5/6 and a specific version of 3 — perhaps not "each misstep was individually necessary" but "the cascade of missteps was a non-redundant difference-maker." He needs to deny overdetermination: the structural conditions did not guarantee war; there was no large pool of backup nails that would have produced a general war anyway. Showing that the actual path ran through small diplomatic errors (reading 1/2) is entirely consistent with structural inevitability: a structurally primed system may discharge through whichever small trigger happens to occur.

  The chaos/sensitive dependence reading is too weak. Sensitive dependence says: if you perturb the initial state slightly, the trajectory may diverge. It does not say the actual trajectory was avoidable, and it does not say which perturbations would have been necessary. A deterministic system can be chaotic: the actual outcome may be strictly determined by the actual initial conditions and yet unpredictable in practice. So "unpredictable" is an epistemic property; "not inevitable" is a metaphysical/modal property. You cannot infer one from the other.

  Also, sensitive dependence is itself a counterfactual property: it compares nearby possible worlds. So his claim that it isn't counterfactual "per se" is not quite right. It may not be a specific alternate-history narrative, but it is a counterfactual conditional about model trajectories.

  **Does it survive his skepticism?**

  - If his skepticism is "all counterfactual history is merely speculative fiction," then no. His argument about the July Crisis is a counterfactual historical claim: "had those missteps been otherwise, war would not have happened (or would have been much less likely)." He is doing the thing he mocked, just at a smaller scale.
  - If he only rejects *unconstrained* counterfactual history — Nazi victories, grand rewrites — he might be able to carve out a consistent position. He would need to say: I accept disciplined, minimal counterfactual reasoning as part of causal explanation. Then he must specify the minimal rewrites, hold the structural context fixed, provide evidence for the mechanisms, and rule out redundant causes.
  - If he retreats to "I'm only making an unpredictability claim," then his conclusion "not structurally inevitable" is unsupported. He could at most say: "The exact route to war was unpredictable and included small accidents." That is a weaker, defensible point, but it doesn't refute structural inevitability.

  In other words, the best defensible version of his view is something like:

  > "The 1914 international system was primed but not fully determining. Given those structures, certain small diplomatic failures were non-redundant triggers that made the difference between a contained crisis and a general war. This is a disciplined counterfactual causal claim."

  But that is not what he said. What he said either does not entail his conclusion, or it commits him to the counterfactual history he was dismissing. He can't have it both ways.

