  Crux 1: Exclusionary reasons.
  - Sub-question: Are there reasons that exclude others from consideration rather than merely outweighing them?
  - If yes: C's core claim is true; TP would change.
  - If no: C would abandon exclusionary structure.
  - TP predicts: analysis will show no such reasons; C predicts: analysis will show they are indispensable.
  - Evidence both agree: Joseph Raz examples (order vs reason), deliberation in conflicts, whether exclusionary reasons can be modeled without loss. 
  - Flag: They cannot fully agree on what counts as "evidence" here; C treats certain moral phenomena (e.g., the felt ineligibility of using a person) as data, TP treats them as potentially explicable by high weights.

  Crux 2: Separateness of persons and interpersonal aggregation.
  - Sub-question: Can harms/benefits to separate persons be summed to justify imposing a constraint violation on one person?
  - If yes: C would give up non-aggregative core constraints.
  - If no: TP would give up Trade-Permissive for those constraints.
  - TP predicts: fairness requires counting each person equally, so yes; C predicts: no, because individual rights are not additive.
  - Evidence: Taurek cases, organ transplant cases, distribution of risk over time, fairness arguments.
  - Flag: Both agree on the cases but disagree about whether intuitions are reliable.

  Crux 3: Principled thresholds.
  - Sub-question: If constraints are steep slopes, can a non-arbitrary threshold for overriding them be specified?
