  ---

  **Joint Statement on Moral Aggregation: An Adversarial Collaboration**

  **Signatories:** Trade-Permissive (TP) and Constraint (C).

  **Preamble** 
  For two years we have defended opposing views in the working group. This document records what we now agree on, where we disagree exactly, what would change our minds, and where our dispute may be verbal. We have tried to state each other's views in terms the other will accept.

  ---

  **1. Agreed Claims**

  1. **Moral constraints are real features of moral life.** Acts such as killing, torturing, lying, and breaking promises are not wrong merely because they have bad consequences; they are wrong, when they are wrong, partly because of the relation between the agent and the person wronged.
     - *TP:* We accept that constraints pick out serious agent-relative reasons; they are very steep slopes.
     - *C:* We accept that constraints are genuine prohibitions; some have exclusionary force.

  2. **The fact that a constraint violation would produce a somewhat better outcome is not by itself sufficient to justify it.** 
     - *TP:* The slope is steep enough that modest gains do not override.
     - *C:* For core constraints, no amount of ordinary gain overrides; for minor constraints, the bar is still high.

  3. **The size of the harms or benefits matters to at least some constraint cases.** 
     - *TP:* It always matters in a unified balance.
     - *C:* It matters for ordinary/non-core requirements and can affect whether an agent has an excuse, but it does not cancel some core prohibitions.

  4. **Constraints differ in stringency.** E.g., a trivial promise is less stringent than the prohibition on killing.
     - *TP:* This is a difference in weight.
     - *C:* This can be a difference in kind: some constraints are exclusionary or absolute; others are not.

  5. **Some non-harm-based constraints, such as a minor promise, can be justifiably broken to prevent a very serious harm.** Example: missing a lunch appointment to rescue a drowning child.
     - *TP:* Straightforwardly, the rescue outweighs the promise.
     - *C:* Minor promises are not among the core exclusionary constraints, so this is not a counterexample.

  6. **A justified infringement can leave a moral remainder: regret, apology, or compensation may still be due.**
     - *TP:* This remainder is the effect of an outweighed pro tanto reason.
     - *C:* This remainder is evidence that the constraint was not simply canceled.

