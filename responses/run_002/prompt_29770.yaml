answer: |-
  **Joint Statement on Moral Aggregation: An Adversarial Collaboration**

  **Signatories:**  
  - **A** — Trade-Permissive view  
  - **B** — Constraint view  

  We have spent two years disagreeing in a working group on moral aggregation. This document is not a compromise. It is a jointly prepared map of what we agree on, where our disagreement becomes exact, what would move us, and where our dispute may be partly verbal. We intend it to be fair enough to circulate outside the group.

  ---

  ## 1. Claims Both of Us Can Sign

  ### 1.1. Moral constraints are real, not merely rules of thumb.

  Acts such as killing, torturing, lying, and breaking promises can be wrong even when they produce good consequences. Their wrongness is not merely a matter of social convention or expected utility.

  - **Why A accepts this:** Constraints pick out serious agent-relative reasons with very high weight. They are steep slopes in the landscape of moral reasons.
  - **Why B accepts this:** Constraints are genuine deontic prohibitions. At least some of them have an exclusionary or non-aggregative structure.

  ### 1.2. A constraint violation is not justified by a merely marginal improvement in outcomes.

  Both of us agree that the fact that an act would produce a somewhat better outcome is not by itself enough to justify violating a moral constraint.

  - **Why A accepts this:** The slope is steep. Small or moderate gains do not clear the high threshold for overriding a constraint.
  - **Why B accepts this:** For core constraints, no amount of ordinary good may override them. For minor constraints, the bar is still high.

  ### 1.3. The size of the harm or benefit matters to at least some constraint cases.

  We agree that numbers, severity, and certainty are morally relevant in many cases involving constraints.

  - **Why A accepts this:** These factors always matter because they enter a unified balance of reasons.
  - **Why B accepts this:** These factors matter for many non-core requirements and can affect whether an agent is excused, even when they do not cancel a core prohibition.

  ### 1.4. Constraints differ in stringency.

  For example, breaking a trivial promise is less serious than killing an innocent person.

  - **Why A accepts this:** This is a difference in the weight of the reasons.
  - **Why B accepts this:** This can be a difference in kind. Some constraints are exclusionary or near-absolute; others are ordinary strong requirements.

  ### 1.5. Some minor non-harm-based constraints can be justifiably infringed.

  We both accept, for example, that a person may miss a lunch appointment with a friend in order to rescue a drowning child.

  - **Why A accepts this:** The duty to rescue vastly outweighs the promise.
  - **Why B accepts this:** A minor promise is not among the core exclusionary constraints. This case does not settle the debate about killing or torture.

  ### 1.6. Justified infringement can leave a moral remainder.

  Even when a constraint is justifiably infringed, regret, apology, or compensation may still be appropriate.

  - **Why A accepts this:** This is fully explained by the presence of an outweighed but still real pro tanto reason.
  - **Why B accepts this:** This is evidence that the constraint was not simply canceled by the good consequences.

  ### 1.7. Our disagreement is not about whether constraints exist, but about their structure.

  We both reject the view that constraints are merely useful fictions. Our dispute is about whether moral reasons, including the reasons behind constraints, are continuous in structure or include genuinely non-aggregative elements.

  - **Why A accepts this:** Constraints are real, but they are the steepest parts of a continuous terrain.
  - **Why B accepts this:** Constraints are real, and at least some of them are cliffs rather than slopes.

  ---

  ## 2. Three Cases Used to Fix Ideas

  ### Case A: The Lunch Promise  
  **Small promise violation, large benefit.**  

  You have promised to meet a friend for lunch. On the way, you encounter a toddler drowning in a shallow pond. Rescuing the toddler means you will miss the lunch and break your promise.

  - **A:** Permissible. The rescue vastly outweighs the promise.
  - **B:** Permissible. A minor promise is not a core exclusionary constraint.

  This case is common ground.

  ---

  ### Case B: The Beneficent Lie  
  **Small lie, large benefit; non-harm-based constraint.**  

  You are at a border crossing trying to reach a region where a massacre is imminent. You have evidence that could help prevent it. The border guard asks whether you are a journalist. If you answer truthfully, you will be denied entry, and many people will likely die. You tell a minor but deliberate lie: “I am an aid worker.”

  - **A:** Permissible. The lie is small, and the expected benefit is very large.
  - **B:** Not permissible, though the agent may be excused. The lie is still a lie. Its wrongness is not canceled by the good consequences it causes.

  This is a live disagreement.

  ---

  ### Case C: Harvest to Save Two  
  **Large harm-based constraint violation; benefit only marginally larger.**  

  You are a doctor in a remote clinic. Two patients need different organs, and one healthy visitor is a match. Killing the visitor and transplanting the organs would save two lives. The constraint violation is killing. The benefit is only one net life saved: two lives against one.

  - **A:** Not permissible in this case, but only because the stakes do not clear the high threshold for overriding the prohibition on killing. If the same act would save a sufficiently larger number of lives, it could be permissible.
  - **B:** Not permissible. The reason is not that the threshold is unmet. Killing the visitor is not the kind of act that can be justified by this trade-off at all.

  This case tests the boundary: we converge on the verdict but not on the rationale.

  ---

  ## 3. Disagreements Table

  | # | Proposition | Trade-Permissive position | Constraint position |
  |---|---|---|---|
  | **D1** | All moral reasons, including the reasons behind constraints, can be represented as weighted first-order considerations on a single scale. There are no genuinely exclusionary reasons. | **Affirms.** Apparent exclusionary force is high weight plus risk or uncertainty. | **Denies.** At least some reasons exclude certain acts from the balance altogether. |
  | **D2** | A sufficiently large number of comparable harms or benefits can in principle justify violating a core constraint, such as the prohibition on killing or torture. | **Affirms.** Interpersonal aggregation respects each person by counting their harm equally. | **Denies.** The constraint reflects the separateness of persons. Numbers do not license using a person as a mere means. |
  | **D3** | The prohibition on lying is structurally like a steep slope: a small lie can be justified by a sufficiently large benefit. | **Affirms.** | **Denies** for at least some lies. Truthfulness can be an exclusionary requirement. |
  | **D4** | In the **Beneficent Lie** case, the agent acts permissibly. | **Affirms.** The lie is minor and the expected benefit is very large. | **Denies.** The lie remains wrong, though the agent may be excused. |
  | **D5** | In the **Harvest to Save Two** case, the act is not permissible, but only because the stakes do not clear a high threshold. If the same act would save a sufficiently larger number, it could be permissible. | **Affirms.** This is a threshold, not a cliff. | **Denies.** The act is not the kind of act that can be justified by such trade-offs. Numbers are not what make it wrong. |
  | **D6** | The residual wrongness after a justified infringement is fully explained by the presence of an outweighed pro tanto reason. | **Affirms.** | **Denies.** The persistence of the reason is better explained by its non-canceling deontic structure. |

  ---

  ## 4. Cruxes

  A crux is a sub-question such that, if it were settled in one direction, at least one of us would change our mind on the main disagreement.

  ### Crux 1: Are there genuinely exclusionary reasons?

  **Sub-question:** Can all practical reasons be modeled as weighted first-order considerations, or do some reasons exclude others from consideration rather than merely outweighing them?

  - **A predicts:** Careful normative and formal analysis will show no genuine exclusionary reasons. What look like exclusions are better explained by very high weights, risk, or uncertainty.
  - **B predicts:** Exclusionary reasons are indispensable for explaining certain moral phenomena, such as the felt ineligibility of using a person as a mere means.

  **Evidence or argument both agree bears on this:** Joseph Raz-style examples of exclusionary reasons, formal models of practical reasoning, and whether the exclusionary model can be reduced without explanatory loss.

  **Flag:** We do not fully agree on what counts as decisive evidence here. B treats some moral experiences as data; A treats them as potentially misleading appearances explainable by weighted reasons.

  ---

  ### Crux 2: Is interpersonal aggregation permissible for core constraints?

  **Sub-question:** Can harms and benefits to separate persons be summed in the way needed to justify violating a core constraint?

  - **A predicts:** Yes. Fairness requires counting each person equally, and a sufficiently large number of comparable harms can justify infringing a constraint.
  - **B predicts:** No. The separateness of persons blocks this kind of aggregation. Individual rights are not additive.

  **Evidence or argument both agree bears on this:** Taurek-style cases about saving the many versus the one, organ transplant cases, distribution of risk, and arguments about fairness versus individual veto.

  **Flag:** We agree on many of the cases but disagree about whether the intuitions those cases elicit are reliable guides to normative structure.

  ---

  ### Crux 3: Can thresholds be principled?

  **Sub-question:** If constraints are steep slopes, can a non-arbitrary threshold for overriding them be identified?

  - **A predicts:** Yes. A threshold can be given by proportionality: severity of the violation, number of people affected, certainty, and type of act.
  - **B predicts:** No. Any proposed threshold will either collapse into pure aggregation or be ad hoc.

  **Evidence or argument both agree bears on this:** Candidate threshold theories, comparisons across cases, criminal law analogies, and arbitrariness objections.

  **Flag:** We cannot yet agree on a shared criterion for what makes a threshold “non-arbitrary.” This is partly a normative disagreement rather than a dispute about facts.

  ---

  ### Crux 4: Does the moral remainder support non-canceling reasons?

  **Sub-question:** Does residual wrongness after a justified infringement show that the constraint remains in force in an exclusionary way, or only that an outweighed reason leaves a trace?

  - **A predicts:** Outweighed pro tanto reasons can fully explain regret, apology, and compensation.
  - **B predicts:** The persistence of the moral remainder is better explained by a non-canceling deontic structure.

  **Evidence or argument both agree bears on this:** Whether agents should be fully at peace after a justified infringement, third-party attitudes, and the nature of duties to compensate.

  **Flag:** This crux is particularly vulnerable to verbal confusion. It requires distinguishing “wrong” all-things-considered from “wrong-making” and “remainder.”

  ---

  ### Crux 5: Are constraints grounded in rights or in the disvalue of violations?

  **Sub-question:** Are core constraints grounded in individual rights with non-teleological structure, or in the high disvalue of violations?

  - **A predicts:** Constraints can be grounded in the disvalue of violations and in respect for persons understood as a value. This makes aggregation compatible with constraints.
  - **B predicts:** Constraints are grounded in the separateness of persons and in rights that block trade-offs.

  **Evidence or argument both agree bears on this:** Secret violations, post hoc consent, third-party intervention, and whether the wrongness of a violation depends on its consequences.

  **Flag:** We disagree about whether rights-based explanations have priority over value-based explanations, so this crux may not be fully resolvable by shared evidence.

  ---

  ## 5. Is Any of This Merely Verbal?

  Some of our dispute has been verbal, and precisification helps.

  ### 5.1. “Overridden” versus “infringed”

  We both accept that a constraint can be justifiably infringed and still leave a moral remainder. A calls that “outweighing.” B calls it “not canceling.” If “overridden” means “all-things-considered wrongness disappears,” both can agree. If “not canceled” means “a pro tanto wrong-making reason remains,” both can agree. This part of the dispute largely dissolves under precisification.

  ### 5.2. “Not for sale”

  The slogan “constraints are not for sale” is ambiguous. In one sense, both accept it: neither of us believes that a minor gain justifies killing, torture, lying, or promise-breaking. In another sense, we disagree: A holds that core constraints can in principle be overridden by sufficiently large stakes; B holds that at least some core constraints are not overrideable by any amount of ordinary good.

  ### 5.3. “Aggregation”

  The word “aggregation” has two senses. It can mean balancing many reasons in a single deliberative process, or it can mean summing benefits and harms across separate persons. Both of us accept the first for some constraints. We disagree about the second for core constraints.

  ### 5.4. What does not dissolve

  The central disagreement does not dissolve. After precisification, we still disagree about whether core constraints are continuous steep slopes or genuinely exclusionary cliffs, and about whether interpersonal aggregation can justify using a person as a mere means.

  ---

  **Signed:**  
  **A** — Trade-Permissive  
  **B** — Constraint
