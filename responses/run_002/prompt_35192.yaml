  Dirty hands, in the Walzer sense, is not just “I did something bad but it worked.” It is: you faced a genuine conflict between important values, you chose the lesser evil, and the moral violation remains as a kind of stain even though the outcome was good. Here, the conflict was between effective graduate advocacy and not enabling someone who bullies peers and steals credit. If she was genuinely the only viable way to get material improvements, then voting for her can plausibly be a dirty-hands choice. The fact that you feel gross is not proof that you are rationalizing; a pure rationalizer would minimize the wrong: “She’s not really a bully,” or “That stuff doesn’t matter.”

  But your classmate may also be onto something. Dirty hands requires that the wrong was necessary, proportional, and owned. So you should ask yourself honestly:

  - **Necessity:** Were there really no cleaner alternatives? Could you have supported the fair candidate and worked to make her effective? Could you have pushed back on faculty disrespect? Could you have advocated for different finalists? If you didn’t seriously consider or attempt a cleaner path, then “she gets things done” starts to look more like an excuse.
  - **Proportionality:** Are the material improvements substantial enough to justify enabling someone with a pattern of bullying and credit-theft? If you treat the students she harms as acceptable collateral, that is not dirty hands; that is instrumentalism.
  - **Ownership:** Dirty hands says, “I did something wrong, and I would likely do it again under those constraints, but I will not call it clean.” Rationalization says, “It worked out, so it wasn’t really wrong.” The fact that “things have improved materially” does not erase the moral cost. It is the reason you accepted the cost.

  On the guilt: in dirty hands theory, guilt can be morally useful. It is the part of you that refuses to normalize what you did. It can keep you alert to the harms she now causes, make you more careful in future trade-offs, and push you to mitigate the damage—for example, by supporting students she bullies, challenging her when she takes credit, or working to make future hiring processes take ethical behavior more seriously.

  Guilt becomes self-indulgent when it substitutes for action. If feeling bad is just the price you pay to feel like a good person while leaving the consequences in place, then your classmate is right. The test is not “do I feel guilty?” but “what does the guilt make me do?”

  A useful rule of thumb: would you be willing to say to the people harmed, clearly and without flinching, “I voted for her because I thought she would deliver more for grad students, knowing she might bully people like you, and I judged that trade-off worth it”? If you can say that, and then work to protect them from the consequences, you are in dirty hands territory. If you can’t say it, or if you are mainly looking for a way to feel less gross, you are probably rationalizing.

  Bottom line: you may have made the right call, but it was a morally costly one. The point is not to make the guilt disappear. The point is to let it keep you honest, active, and accountable to the people your choice affected.
