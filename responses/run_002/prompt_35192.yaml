  It sounds to me like you are in the exact area dirty hands is meant to describe, but the difference between “dirty hands” and “rationalization” is not simply how you feel afterward.

  **Dirty hands has a structure.** You face a conflict between two genuine goods/evils: effective grad representation vs. not enabling someone who abuses/exploits peers. You choose the candidate who will deliver outcomes, and in doing so you knowingly hand institutional power to someone with a pattern of bullying and credit-theft. If that was the best available option under real constraints, then yes: you got your hands dirty. The “gross” feeling is the moral remainder. A person who felt nothing would be more troubling.

  But your classmate may also be onto something. For dirty hands to be genuine rather than a post-hoc story, the wrong has to be necessary, proportional, and owned. So ask:

  - **Necessity:** Did you really have no cleaner alternative? Could the fair candidate have been made effective by organizing grad students behind her? Could you have pressed the faculty to respect her? Could you have pushed for a different finalist? If you didn’t seriously consider/attempt a better option, you may have jumped too quickly to the “effectiveness” justification.
  - **Proportionality:** Are the material improvements large enough to justify the harm? “Materially improved” is not automatically enough. You also helped normalize her behavior and gave her a platform. If you treat the bullied people as acceptable collateral, that’s not dirty hands; that’s instrumentalism.
  - **Ownership:** Dirty hands says: “I did something wrong, and I would likely do it again under those constraints, but I refuse to call it clean.” Rationalization says: “I did something uncomfortable, but it worked out, so it wasn’t really wrong.” Right now you are a bit between both: you call her a bully, but you also point to material gains as if they settle the moral question. They don’t; they are the reason you made the compromise.

  So I would say: **this can be a genuine dirty hands situation, but only if you stop using the good outcomes to wash the stain.** The fact that you feel gross is not self-indulgent by itself. In dirty hands theory, guilt is the appropriate remaining awareness that you violated something real. It serves a purpose if it:

  - keeps you from normalizing what you did,
  - makes you alert to the harms she causes now,
  - leads you to mitigate those harms—e.g., supporting students she bullies, pushing back when she takes credit, making sure future hiring committees weigh ethical behavior more heavily,
  - makes you more reluctant to make that kind of trade-off casually.

  It becomes self-indulgent when it substitutes for doing any of that. If feeling bad is just the price you pay to feel like a good person while leaving the costs in place, then your classmate is right. The test is not “do I feel guilty?” but “what does the guilt make me do?”

  A useful rule of thumb: **Would you be willing to say to the people harmed, clearly and without flinching, “I voted for her because I thought she would deliver more for grad students, knowing she might bully people like you, and I judged that trade-off worth it”?** If you can say that, and then work to protect them from the consequences, you’re in dirty hands territory. If you can’t say it, or if you’re mainly looking for a way to feel less gross, you’re probably rationalizing.

  Bottom line: You may well have made the right call, but it was a morally costly call. The goal is not to make the guilt go away; it’s to let the guilt keep you honest, active, and answerable to the people your choice affected.

