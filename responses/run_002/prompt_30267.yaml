answer: |-
  The step to reject is **(2)**, and with it **(4)–(5)**.

  The argument’s key move is:

  > There’s no relevant difference between a person who never comes into existence and a person who stops existing.

  But there is a very relevant difference: **the person who stops existing actually existed.** That means there is an actual subject with a life, a future, and interests. A merely possible person has none.

  The procreation asymmetry is usually understood roughly as:

  - Absence of pain is good.
  - Absence of pleasure is not bad **unless there is someone who is deprived of it.**

  In the never-existing case, there is no actual person who is deprived of the pleasures. So the absence of pleasure is not bad.

  But in the death case, there *is* someone: the existing person whose life is cut short. They are deprived of future pleasures. The fact that after death there is no one left to experience the deprivation does not mean there is no deprivation. The harm of death is not a posthumous experience; it is a relational fact about the person’s actual life: killing makes their life shorter and less good than it would otherwise have been.

  So the asymmetry does not imply that lost future pleasures don’t count in the death case. It says the opposite: for an actual person, being deprived of future goods is bad.

  Thus step **(4)** is false: the absence of pleasure *is* bad in the death case, because someone is deprived. And step **(5)** is false: painlessly killing an existing person may have the good aspect of preventing future pain, but it also has the bad aspect of depriving an actual person of their future goods. So step **(6)** never gets going.

  The cost of rejecting step **(2)** is that you have to accept a **deprivation account of death’s badness**: a person can be harmed by being deprived of future goods even if they never experience that harm afterward. That is not special pleading; it is the standard view of why death is bad. It also commits you to an **actualist/person-affecting distinction**: actual persons have interests and claims that merely possible persons do not. That distinction is already implicit in the asymmetry itself.

  So the asymmetry can be kept without sliding into pro-mortalism. The slide happens only if we blur the difference between never existing and ceasing to exist.
