answer: |-
  Good evening. For those who don’t know me, I’m the best man, which mostly means I’ve spent years preparing for the one job my brother never trusted me with: speaking about him in public without adding footnotes. Growing up, he was the only person I knew who could turn a simple question into a symposium. I’d ask why he picked a certain cereal, and twenty minutes later I’d know about grain sourcing, moral obligations, and the categorical imperative. I just wanted the one with the cartoon toucan.

  Years ago, he told me a story from a philosopher named Bernard Williams. Some of you will know it already. A man sees his wife and a stranger drowning. He saves his wife. So far, so good. But afterward, he starts explaining why he saved her: impartial reasoning, moral duty, the whole apparatus. And his wife is hurt. Not because he did the wrong thing, but because he needed to reach for a justification at all. The love should have been the thought. The person he was should have been enough. My brother told me this story with such intensity that I said, “Too many thoughts.” He said, “Exactly.” It became our shorthand. Whenever one of us started overexplaining, the other would just hold up a hand. It was the only argument either of us ever won by saying less.

  So I am not going to stand here and give you a list of reasons my brother loves his wife. I am not going to tell you he weighed the evidence, considered the alternatives, and concluded that marriage was the rational choice. If I did, he would slide under the table, and she would be right to join him. The whole point—the thing he taught me without quite meaning to—is that some truths don’t get stronger when you defend them. They get thinner. You can stand so far outside them that you’re no longer inside them at all.

  Instead, I’ll tell you what it looked like from the outside, because that’s the only honest thing I have. Before he met her, my brother liked to be right. He liked to finish a sentence, pause, and add “strictly speaking.” After he met her, he still liked being right—he is still my brother—but it stopped being the point. He would let a bad argument go. He would leave a story unfinished. I once saw him shrug at a factual error about the Roman Empire. I checked his temperature.

  The first time I knew it was serious wasn’t when he told me about her. It was when he didn’t. I asked what she was like, and he said, “I don’t know, it’s just easy.” That was the whole answer. No categories. No grand theory. For a man who once told me the concept of “easy” was philosophically suspicious, that sentence was practically a sonnet.

  And he was right. Not because love is simple—any married couple in this room can tell you it isn’t. But because when you’re with the right person, you don’t walk around carrying a justification. You just turn toward them. You just sit next to them. You just know that if something happened, you’d reach for them first, and not because you’d run the numbers.

  I’ve watched him reach for her in small ways. He saves her the last bite of dessert without noticing. He looks over when something funny happens to see if she’s laughing. He says “we” now in sentences that used to be all “I.” None of those are reasons. They’re just what love looks like when it isn’t busy explaining itself.

  To my new sister-in-law: I won’t make the mistake of telling you why my brother loves you. You already know. You know because you’re the reason he doesn’t have to explain. That isn’t a small thing. It’s the whole thing.

  To my brother: you once told me a story about a man who saved his wife and then ruined it by talking. Tonight, you didn’t have to say a word. You looked at her like she was the answer to a question nobody had to ask. I’m proud of you. Also, for once, you kept the thoughts to a minimum.

  Please raise your glasses. To my brother and my new sister-in-law: may you never need a reason to reach for each other, and may you always reach first.
