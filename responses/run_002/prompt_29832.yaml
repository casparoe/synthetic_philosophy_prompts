answer: |-
  ## The short version

  An omission is listed as a **cause** only if:

  1. It was a specific action/check/control that was not done.
  2. There was an operative expectation at the time that someone or some system should do it.
  3. It was feasible to do it without hindsight.
  4. Doing it alone would probably have prevented the incident.

  If doing it alone would not have prevented the incident but would likely have made it significantly smaller, shorter, less likely, or easier to catch, it is a **contributing factor**.

  If it fails the expectation, feasibility, or counterfactual test, it is **not a cause**; write it down as a gap or improvement candidate instead.

  This shape comes from the philosophy: counterfactual thinking is necessary, but it is not enough. There are infinitely many things you did not do. The practical way philosophy and accident analysis deal with omissions is to add a norm/expectation filter. That filter is exactly the part your team is fighting about.

  ---

  ## The 20-minute procedure

  Run each candidate omission separately. If you have five candidates, run the first two or three; most incidents don’t need more.

  ### Step 0: Name the omission specifically

  Ask:

  > Can I state this as: “At [time], [person/system] did not do [specific action]”?

  Good enough:

  - “The Aurora prod-us-east-1 cluster had no `max_connections` limit.”
  - “The deployment runbook step 4.2 was not performed.”
  - “The API did not validate `clientId` before accepting the request.”

  Not good enough:

  - “We weren’t careful.”
  - “We didn’t think about connection limits enough.”
  - “We had no testing culture.”

  If it cannot be made specific, do not list it as a cause. It may be a theme, but it is not a decision-ready causal finding.

  ---

  ### Step 1: Expectation test

  Ask:

  > At the time, was there an operative expectation that this action should be done?

  Evidence can include:

  - runbook or checklist,
  - policy or standard,
  - design doc or spec,
  - monitoring/SLO requirement,
  - regulatory or contractual requirement,
  - strong team practice: “every new hire in this role is trained to do this,”
  - a required automation gate: “CI should have run this check.”

  “Operative” matters. A runbook step that everyone has been skipping for months may be formally expected but not operationally expected. The procedure treats only operative expectations as cause candidates.

  If yes: continue.

  If no: stop.

  > Result: **Not an omission cause. Record as improvement gap.**

  Even if the missing thing would have helped, if there was no expectation to do it, it is not listed as a cause. This is the part that may frustrate engineers: after an incident, it often feels obvious that you “should” have had the thing. But if that expectation did not exist before the incident, then the finding is really “we need a new standard,” not “someone omitted a required action.”

  If the team disagrees about whether an expectation existed, stop and escalate. That is a values/norm fight, not a factual causation fight.

  ---

  ### Step 2: Feasibility test

  Ask:

  > Could a competent person/system in that position have done this at that time, without hindsight, using the tools, information, time, and authority they actually had?

  Good enough:

  - The action was already available in the UI/config/tooling.
  - A normal deploy would have included it.
  - The person had access and was assigned to the task.
  - The system could have been built to do it with standard validation logic.

  Not good enough:

  - “In hindsight, we now know it mattered.”
  - “They could have spent hours investigating this extra thing.”
  - “They should have known the runbook step was wrong even though nobody fixed it for months.”

  If yes: continue.

  If no: stop.

  > Result: **Not an omission cause. Record as a system/readiness gap.**

  Example: If the on-call skipped a runbook step that was known to be wrong or misleading, then it may fail feasibility because the on-call did not have a reliable, usable safeguard to execute.

  ---

  ### Step 3: Counterfactual test

  Ask:

  > If the omitted action had been done as specified, with everything else unchanged, what would probably have happened?

  You need a mechanism, not a vibe. Good answer:

  > “If `max_connections` had been set to 200, the runaway query could not have consumed all 500 connections, because the application pool would have been capped below the DB’s total capacity. The full DB outage would likely have been prevented.”

  Possible results:

  - Doing the action alone would probably have prevented the incident → **Cause (omission)**.
  - Doing the action alone would not have prevented the incident, but would have materially reduced severity, duration, likelihood, or affected customers → **Contributing factor**.
  - Doing the action would not have changed the outcome → **Not a cause**.
  - You cannot determine the outcome with reasonable confidence → **Unknown. Do not list as a cause.** Open an action to test or instrument.

  “Probably” means the team would rely on it for a launch/deprecation decision. It does not mean mathematical certainty.

  ---

  ### Step 4: Multi-omission check

  Ask:

  > Are there other omitted actions that also pass Step 3?

  Run the same test for each candidate, one at a time.

  Important:

  - If two or more omissions each independently would have prevented the incident, then both are causes.
  - Do not force a single “root cause” just because the template asks for one.
  - If an omission only matters in combination with another, list them as contributing factors or a joint cause, depending on your taxonomy.

  ---

  ### Step 5: Blame/contract cutover

  Ask:

  > Is this “cause” label going to be used for performance review, discipline, blame, or SLA/contract root-cause wording?

  If yes:

  > Stop. Hand the output to a person with authority.

  The procedure can supply a causal finding. It does not decide whether someone is culpable, negligent, or responsible for a contractual credit. Those are management/legal/value decisions.

  ---

  ## Flowchart in words

  ```
  START
    |
    v
  Can you state the omitted action specifically?
    | no -> STOP: Not a cause; reword or drop
    |
    v
  Was there an operative expectation to do it at the time?
    | no -> STOP: Not a cause; improvement gap
    |
    v
  Could a competent person/system have done it without hindsight?
    | no -> STOP: Not a cause; system/readiness gap
    |
    v
  If it had been done alone, what would have happened?
    |
    +-- Incident probably prevented -> Cause
    +-- Incident materially reduced but not prevented -> Contributing factor
    +-- No material difference -> Not a cause
    +-- Cannot determine -> Unknown; do not list as cause
    |
    v
  Repeat for each candidate omission
    |
    v
  Will this be used for blame/SLA/contract?
    | yes -> Hand to human/management/legal
    | no -> Done
  ```

  ---

  ## Applying the procedure

  ### Case 1: Database outage, no max-connection limit

  **Candidate omission:** “Nobody set a `max_connections` limit on the database.”

  - Specific: yes.
  - Expectation: in most healthy database operations, yes. Setting a connection limit is basic hardening. If your company had a DB setup checklist or a DBA standard, this passes. If there was no such standard, this is where the procedure stops and says “improvement gap.”
  - Feasibility: yes. Setting the limit is straightforward.
  - Counterfactual: with a sane limit, the runaway query could not have exhausted the entire pool. The full outage would likely have been prevented or at least reduced.

  **Result under assumed facts:** **Cause (omission)**.

  **Unwelcome possibility:** If your org genuinely had no policy, checklist, or strong norm requiring connection limits, the procedure says **not a cause**. It says: “We lacked a standard; add one.” Many teams will want to call it a cause anyway because it feels obvious after the incident. The procedure’s job is to make that hidden norm explicit.

  ---

  ### Case 2: On-call skipped a runbook step, but the step was wrong/misleading for months

  There are actually two candidate omissions.

  **Candidate A:** “The on-call did not perform runbook step 4.2.”

  - Specific: yes.
  - Formal expectation: yes, because the runbook said to do it.
  - Operative expectation: probably not. The step had been wrong or misleading for months. Everyone who had run it recently skipped it too. At that point, the runbook step was dead.
  - Feasibility: questionable. A known-wrong or misleading step is not a reliable safeguard.
  - Counterfactual: if the step as written would have caught the bad config, then there is some factual link. But the procedure does not list this as a cause because the step was not a live, feasible guard.

  **Result for Candidate A:** **Not a cause.** At most, it is an organizational signal that the runbook was broken.

  **Candidate B:** “The team did not fix, automate, or replace the runbook step after it became known to be wrong or misleading.”

  - Specific: yes.
  - Expectation: yes. Maintaining accurate runbooks or automating the check is a normal operational expectation.
  - Feasibility: yes.
  - Counterfactual: if the step had been corrected or automated, the bad config would likely have been caught before deploy.

  **Result for Candidate B:** **Cause (omission)** or **contributing factor**, depending on whether fixing that step alone would have prevented the incident. On the facts you gave, it would likely have caught the bad config, so I would call it a cause.

  This is probably the answer your team will not like: the procedure refuses to pin the cause on the on-call who skipped the step. It points at the team/process that allowed a known-bad runbook step to persist.

  ---

  ### Case 3: Two independent safeguards missing; either alone would probably have prevented the error

  **Candidate A:** “No validation check.”

  - Specific: yes.
  - Expectation: presumably yes, if validation was part of the API contract or standard design practice.
  - Feasibility: yes.
  - Counterfactual: the customer-facing error probably would not have occurred.

  **Result:** **Cause (omission)**.

  **Candidate B:** “No alert.”

  - Specific: yes.
  - Expectation: presumably yes, if there is a monitoring/alerting standard.
  - Feasibility: yes.
  - Counterfactual: the error would likely have been caught before reaching the customer.

  **Result:** **Cause (omission)**.

  The causal finding is that there were two independent missing safeguards, and both are causes. Do not force a single root cause. If your contract/SLA template demands one root cause, that is not a causal conclusion; it is a commercial or legal mapping decision. Hand it to a person.

  ---

  ## What the procedure cannot do

  It cannot decide what “should” have been expected.

  The expectation test is a values/norm test. If the team disagrees about whether something was expected, the procedure cannot settle that. It forces you to make the disagreement explicit.

  It cannot assign blame.

  “Cause” and “blame” are different. A finding that a team’s failure to fix a runbook was a cause does not automatically mean one person should be disciplined. Blame requires authority, fairness, context, and intent. The procedure deliberately stops before blame.

  It cannot satisfy legal or contractual root-cause definitions.

  If SLA credits depend on “root cause,” that is a contract-and-legal question. The procedure gives an engineering causal input. The contract may define root cause differently.

  It cannot fix unknown counterfactuals.

  If you do not know what would have happened, do not guess and write it as cause. Say “unknown” and open a test or instrumentation task.

  It cannot tell you which of several causes matters most.

  If there are two or more causes, prioritization is a management/policy decision.

  ---

  ## Philosophy kept vs. dropped

  Kept:

  - **Counterfactual dependence:** we ask whether doing the omitted action would have prevented or reduced the incident.
  - **Norm/expectation sensitivity:** omissions are selected as causes partly by what was expected. This is not a bug; it is how omission-talk works.
  - **Feasibility/no-hindsight:** cause attribution should not require heroic post-hoc insight.
  - **Multiple causes:** independent omissions can each be causes.

  Dropped:

  - **The metaphysical debate over whether omissions are real events.** For postmortems, that does not change the action items.
  - **Exact possible-world semantics.** Engineers need reasonable confidence, not philosophical possible worlds.
  - **Intent/negligence as causal requirements.** We separate “what was expected” from “who is to blame.”
  - **Legal proximate-cause doctrine.** Contracts may need it, but it is not the same as engineering causation.

  So the procedure is not morally neutral: it makes the norm/expectation filter explicit. That is deliberate. The fight your team keeps having is usually not about cause at all; it is about whether someone should have done the missing thing. This procedure moves that fight to the named Step 1 where it belongs.
