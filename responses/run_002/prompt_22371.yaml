  **Reflection as a Conditional Principle**

  Let \(P_t\) be current credence and \(P_{t+\Delta}\) future credence. For any proposition A and any \(r\):
  \[
  P_t(A \mid P_{t+\Delta}(A)=r)=r
  \]
  whenever the conditional is defined. This is not the claim that \(P_t(A)=P_{t+\Delta}(A)\). It is a claim about the current credence conditional on a future credence report.

  If \(P_t(P_{t+\Delta}(A)=r)=1\), then Reflection does imply \(P_t(A)=r\). But this is a degenerate case. In general, the agent's future credence is not known with certainty. Let \(R_A = P_{t+\Delta}(A)\). By total probability, Reflection implies:
  \[
  P_t(A)=\sum_r P_t(R_A=r) r = E_t[R_A].
  \]
  So current credence is the expectation of future credence. This allows future credence to differ from current. Example...

  **The Dutch-Book Objection**

  Standard Dutch book... objection...

  **Future Credence Reports as Idealized Expert Reports**

  The principle is best read as applying to future credence reports understood as outputs of an idealized informed future self. Suppose the agent partitions possible future evidence \(E_1,...,E_n\). If the future self is an ideal conditionalizer, her credence in A after evidence \(E_i\) would be \(r_i = P_t(A|E_i)\). Define \(R_A\) by \(R_A=r_i\) iff \(E_i\). Then for any r:
  \[
  \{R_A=r\} = \bigcup_{i: r_i=r} E_i.
  \]
  Since \(P_t(A|E_i)=r\) for each disjunct, the probability calculus yields:
  \[
  P_t(A | R_A=r) = r.
  \]
  Thus Reflection follows. This derivation uses only current conditional credences over possible evidence; it does not presuppose certainty about which evidence will arrive, so \(R_A\) may be uncertain.

  **Normative Force**

  On this reading, violating Reflection is not merely risking a diachronic Dutch book with an actual future self. It is a synchronic incoherence: the agent assigns r to A given each of several evidence possibilities, but something other than r to A given their disjunction—the very proposition that the future report is r. That violates the probability calculus. The diachronic Dutch-book objection—that the argument exploits an irrational or less-informed actual future self—therefore loses its force. The principle does not tell you to defer to an arbitrary actual future self; it tells you to keep your current conditional credences about possible evidence coherent when those evidence states are summarized as future credence reports.

  **Conclusion**

  Reflection is best understood as a conditional constraint on how you interpret your own possible future credence reports, treating them as reports from an idealized informed version of yourself. It allows uncertainty about future credence and does not require current and future credence to coincide; it only requires your current credence to be the expectation of your future credence and, more fundamentally, your conditional credence given a future report to equal the reported value. This preserves its normative force against the diachronic Dutch-book objection by locating the norm in synchronic coherence about possible evidence, not in diachronic deference to your actual future self.

