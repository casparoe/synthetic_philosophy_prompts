  **Lena's convergence/set-choice**
  - Convergence: partially true; under regularity and enough data many priors merge. But "enough" may be infinite; finite decisions and structural uncertainty matter. Also imprecise sets can represent the range of priors that haven't converged.
  - "Which set?" is a real challenge but not fatal. Sets can be specified by known constraints; choosing a vacuous set for unknown bias is less arbitrary than .5 or .7. Some arbitrariness may remain at boundaries.
