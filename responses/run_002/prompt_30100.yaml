  - Data eliminating members is learning in a weak sense. But he may overstate practical learning: with the vacuous set, posterior predictive interval can remain close to [0,1] after finite data because extreme priors dominate.
  - Dilation is a real formal phenomenon. But calling it "not incoherent" is contested, not a theorem of rationality. A precise Bayesian cannot have interval dilation, but can have particular data increase posterior variance; the distinctive issue is set-valued.
  - "Model telling you information exposes fragility" is one interpretation, not obviously correct.

  **Lena's dilation/decision-rule**
  - Dilation can be a problem for dynamic consistency and value of information, but her inference to "negative expected value" is too quick. Under many imprecise decision rules ex ante, you can ignore information, so free information isn't harmful. Dilation doesn't automatically mean you pay not to learn.
