  - She is right that decision rule must be chosen, and there is no uncontroversial rule.

  **Sam's final**
  - Correct: incomplete guidance is not zero guidance; a set of permissible acts can be a rational verdict.
  - Correct that value-of-information theorem is an SEU theorem, not a general norm.
  - Overstates: "avoiding information can be the right response" is not a settled consequence; it depends on update rule and dynamic consistency. If he wants it as feature, he must answer Lena's challenge about negative value of information.

