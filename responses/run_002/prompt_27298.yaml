answer: |-
  The short diagnosis: **the disagreement is neither purely verbal nor a normal factual disagreement about mathematical objects. It is a semantic-normative disagreement about what “exists,” “or,” and “proof” are supposed to mean — and therefore about what mathematics is for.** Double-negation translation is important because it shows exactly where the gap is, but it does not close it.

  ## 1. The two readings of “exists”

  In constructive/type-theoretic terms, a proof of

  ```agda
  ∃x. P(x)
  ```

  is a **dependent pair**:

  ```agda
  Σ x : D, P x
  ```

  That means: you give an actual `x`, and you give a proof of `P x`. The witness is part of the proof.

  A proof of

  ```agda
  A ∨ B
  ```

  is a tagged union: either `Left a` or `Right b`. You know which side holds.

  Classical logic, by contrast, allows “there exists an `x`” to be proven by showing that assuming no such `x` exists leads to contradiction. Formally, that gives you something like:

  ```agda
  ¬ ∀ x. ¬ P x
  ```

  or in type notation:

  ```agda
  ((x : D) → ¬ P x) → ⊥
  ```

  That is: a function from “every `x` fails `P`” to absurdity. It does **not** return an `x`. It only refutes the universal failure.

  These are not the same type. Constructively, `Σ x D, P x` and `¬∀x ¬P x` are different. Classical logic systematically collapses them.

  ## 2. What double-negation translation actually shows

  Double-negation translation embeds classical logic into intuitionistic logic. Roughly, it translates:

  - `∃x P(x)` → `¬∀x ¬P(x)`
  - `A ∨ B` → `¬(¬A ∧ ¬B)`
  - atomic `P` → `¬¬P`

  So a classical proof of `∃x P(x)` becomes a constructive proof of:

  ```agda
  ¬∀x ¬P(x)
  ```

  That is not a constructive proof of existence. It is a constructive proof that “it is impossible that all `x` fail.” No witness is extracted.

  So the translation does not settle the dispute. It formalizes it. It says: classical logic can be understood constructively, but only if you reinterpret classical “exists” as “not all fail.” From the constructive point of view, classical existence is weaker than real constructive existence.

  A programming analogy: negative translation is a bit like compiling a program with control effects into continuation-passing style. The result is a function that takes a continuation, not a function that directly returns a witness. It preserves some behavior, but it changes the type and the computational content.

  ## 3. So what kind of disagreement is it?

  It has three layers.

  ### Layer 1: Formal

  There is no real formal disagreement anymore. We know:

  - constructive logic has the existence property: a proof of `∃x P x` yields a witness;
  - classical logic does not;
  - classical logic embeds into intuitionistic logic via negative translation;
  - constructive logic makes distinctions classical logic collapses.

  These are theorems. They are not in dispute.

  ### Layer 2: Semantic

  The two sides mean different things by the same symbols.

  - Constructive `∃` = witness-existence: a pair `(x, proof)`.
  - Classical `∃` = truth of existence in a model, or equivalently `¬∀¬`.

  Likewise:

  - Constructive `∨` = you know which side.
  - Classical `∨` = not both false.

  So the working theory that it is “partly verbal” is correct as far as it goes.

  ### Layer 3: Normative

  But it is not merely verbal, because the two sides do not just use the words differently; they disagree about which meaning should be the default in mathematics.

  The constructivist says: if a proof of `∃x P x` does not give an `x`, then it is not a proof of existence in the strongest sense. Calling it “exists” is misleading.

  The classicist says: the constructive meaning is too restrictive. Mathematics legitimately proves that something must exist even when no witness can be constructed.

  So after disambiguating the meanings, there is still a real clash:

  > Should mathematics be primarily about constructions/witnesses, or about truth in a fixed structure?

  That is not a formal question. It is a normative question about what a proof is for.

  ## 4. What would count as progress?

  Progress has already happened on the formal side: negative translation, realizability, Kripke semantics, categorical semantics, the existence and disjunction properties, and Curry-Howard itself. These results do not settle the philosophical fight, but they make the costs and benefits precise.

  The sharpest conceptual progress would be to separate the two notions explicitly:

  - **Witness-existence**: `Σ x, P x`
  - **Refutational existence**: `¬∀x ¬P x`

  Then many apparent contradictions dissolve. A classical theorem “there exists an `x`” is not claiming the constructive `Σ` meaning. A constructive theorem is claiming something stronger.

  But the deeper normative issue remains:

  - If you want proofs to be executable programs, use constructive logic.
  - If you want to reason about arbitrary structures and only care about truth, classical logic is often more convenient.

  That is not a theorem; it is a design choice about mathematical practice.

  So the question should not be dropped, but it should be reframed. Instead of asking:

  > Which logic is the true logic of mathematics?

  ask:

  > What do we need this proof to give us?

  From a software engineering perspective, that is the natural question. A constructive proof returns a value. A classical proof may return a continuation-consuming computation. Both can be useful, but they are not the same thing.
