answer: |-
  Bottom line: prediction’s dominance over instruction is best understood as an engineering and scaling choice with a real but limited commitment—that predictive self-supervision can substitute for much of teaching—and it is compatible with several philosophies of mind; RLHF does reintroduce a teacher, but usually as alignment rather than education, so the practice is coherent only if that boundary is acknowledged; and a Turing-style program would change the training loop, data, architecture, and evaluation from passive prediction to interactive teachability.

  The operational commitment of gradient descent on next-word prediction is not that “learning is fundamentally statistical pattern-fitting” in any deep metaphysical sense. It is that a dense, cheap, scalable error signal—predict the next token—can drive the acquisition of representations that later support reasoning, question-answering, code generation, and other abilities. That is a substantive empirical bet, not merely an engineering convenience. It quietly commits the field to a default research response: when a capability is missing, add more data, more compute, or a better self-supervised objective, rather than first designing a better curriculum or teaching signal. But the method is philosophically underdetermined. A connectionist can see it as forming distributed representations; a rationalist can see the network as learning a latent world model; a behaviorist can see it as high-dimensional pattern association. The training procedure does not force one of those views.

  Understanding, in this paradigm, is indeed treated as an emergent byproduct of prediction. It is not directly optimized, verified, or taught during pretraining. That is a real philosophical consequence: the system is not given explanations, corrections, or problems chosen by a teacher to expose its errors. It is given a corpus and a loss. If understanding appears, it appears because the pressure to predict well enough forced the network to induce structure—causal, relational, procedural—that behaves like understanding. The practice therefore commits the field to a wager: understanding can be bootstrapped from prediction. But it does not logically entail that understanding is nothing but prediction.

  RLHF does smuggle the teacher back in, but only partly. Human preference labels, rankings, and corrections are a kind of instruction, but they are usually applied after pretraining and at low bandwidth. The standard division of labor is: pretraining builds competence; RLHF aligns behavior with human values, style, and expectations. That division is coherent if one accepts that core knowledge and skills come from prediction, while preferences and social constraints come from feedback. But it is strained because RLHF often improves capabilities, not just alignment—better instruction following, chain-of-thought reasoning, refusal behavior, and formatting. To the extent that RLHF teaches new competencies, the field’s story becomes inconsistent: the final system is not purely prediction-trained, and the teacher is not merely aligning; the teacher is educating after the fact.

  If Turing’s educational picture were taken seriously, several things would change. First, the training signal would not be a static corpus with a prediction loss. It would be an interactive loop: the system attempts a task, makes errors, receives corrections, asks questions, and tries again. The teacher would choose problems that target the learner’s current weaknesses—something a fixed corpus cannot do. Second, the architecture would need to support continual, incremental learning rather than a single massive pretraining run followed by frozen or lightly fine-tuned weights. That means better memory, sample efficiency, online learning, and the ability to update from sparse feedback without catastrophic forgetting. Third, the objective would broaden beyond prediction. Prediction might remain one component, but the system would also optimize for solving problems, following instructions, reducing teacher corrections, and eventually asking useful questions. Fourth, evaluation would change from static benchmarks and perplexity to teachability: how quickly does the system learn a new concept from few examples? Does it retain what it learned? Can it transfer a correction to related cases? Does it know when to ask for help?

  Turing’s child-machine idea was not a rejection of neural networks or gradient descent. It was a proposal about the kind of learning signal and developmental trajectory a system should have. Modern practice inverted it: start with random weights and a huge passive corpus, then add a small amount of interactive feedback at the end. Turing’s picture starts with a mostly unorganized system and makes the interactive feedback the main event. That would not necessarily require abandoning deep learning, but it would require treating education—not prediction—as the central learning process, and treating static data as a supplement rather than the foundation.
