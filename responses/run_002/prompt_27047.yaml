  Let's draft outline:

  Title: "Cost, Not Conscience: Rethinking Civil Disobedience in the Nearly Just State"

  Intro:
  - In a nearly just state, laws generally claim public justifications. Civil disobedience occupies a middle ground between ordinary lawbreaking and revolution. Rawls's account: public, nonviolent, conscientious breach appealing to majority's sense of justice. This essay defends alternative: CD is best understood as a mechanism for raising enforcement costs of unjust law. The communicative features are real but secondary. The distinction from coercion/blackmail must be drawn by the content of the law and its claimed justification, not by public manner.

  Section 1: The Limits of the Communicative Picture
  - Explain Rawls.
  - Concede appeal: CD is often public, nonviolent, and seems addressed to community.
  - But explanatory inadequacy: If CD's primary mechanism were appeal to justice, we would expect success to track moral persuasion. But often success tracks cost. The majority may remain unchanged. Civil rights sit-ins: success came from filling jails, federal pressure, economic disruption—not mass moral conversion. The public, communicative features are better explained as instruments for raising costs: publicity increases political cost; nonviolence can reduce backlash and increase sympathy; accepting punishment demonstrates seriousness and raises the cost of repression.
  - Communication may occur, but it is not the mechanism. A letter to editor appeals to justice; civil disobedience does something else: it makes the law expensive.

  Section 2: The Enforcement-Cost Account
  - Define enforcement costs. In nearly just state, authority depends on voluntary compliance; even small disruptions can force state to choose between costly enforcement and change.
  - CD as deliberate noncompliance with an unjust law to raise the cost of enforcing it until the legal system revises. The breach is not private evasion but a public refusal to share the burden of an unjust law.
  - This explains "nearly just state": In a state with legitimate institutions, cost-raising can be effective without revolution; the state has a reason to respond to public contradiction.

  Section 3: The Blackmail Objection
  - Worry: cost-raising cannot distinguish CD from coercion/blackmail. If any group with leverage can impose costs, then it's just power politics.
  - Rawlsian answer: public, nonviolent, conscientious manner addresses justice, distinguishes. But this fails: manner can be adopted by coercive actors. Blackmail can be public and nonviolent; a group can accept punishment to demonstrate resolve. And a just campaign can be disruptive and coercive in effect. So manner cannot do the distinguishing work.
  - Need different line.

  Section 4: Distinguishing by Content and Justification
  - In nearly just state, laws claim public justifications. Civil disobedience targets a law whose content or enforcement contradicts its claimed justification. The disobedient's demand is internal to that justification: enforce your own principles or change the law. The enforcement costs are not arbitrary leverage; they are the costs of the state's own inconsistency.
  - Blackmail/coercion: demands are not tied to the law's self-justification. Threat is "give me X or I impose costs," not "this law cannot be enforced under the justification it claims." The difference is normative, not stylistic.
  - This accounts for the communicative feature: CD does appeal to justice, but the appeal is embedded in the structure of the cost. It invites the public to see the contradiction, while making it costly not to.

  Section 5: Reclassifying Some Paradigm Cases
  - Under this criterion, some paradigmatic cases may not be CD.
  - Example: anti-abortion clinic blockades. Even if public, nonviolent, and punishment-accepting, they target laws permitting abortion. The laws claim to protect women's liberty/health; the blockaders reject that justification rather than showing an internal contradiction. Therefore they are not civil disobedience on my view; they are coercion/conscientious obstruction. This is a cost of the view, but it honors the distinction.
  - Maybe another: A corporation publicly defying environmental regulations to demand lower costs is not CD because it does not claim the regulation contradicts its own public justification; it just dislikes the burden.
  - Conversely, some less polite disruptive protests (e.g., climate activists blocking construction) may count as CD if they can show the law's claimed justification (environmental protection) is contradicted by the project's approval. The distinction is not about decorum.

  Section 6: Settled and Contested
  - Settled: CD is deliberate lawbreaking, conscientious, public; the Rawlsian view is influential.
  - Contested: whether nonviolence/punishment acceptance is necessary; whether CD must be communicative; whether cost-raising account is correct; my internal-justification criterion is a contested proposal.
