  **Enforcement Costs, Not Just Moral Appeal: Civil Disobedience in the Nearly Just State**

  In a nearly just state, civil disobedience is often described as a moral appeal: the lawbreaker refuses to comply with a law not to evade it, but to address the majority’s sense of justice and persuade it to change an unjust policy. This picture, associated with John Rawls, remains influential. I want to defend a different view: in such a state civil disobedience is better understood as a mechanism for raising the enforcement costs of an unjust law than as an appeal to the majority’s sense of justice. The public, communicative character of civil disobedience is real, but it is not what distinguishes civil disobedience from coercion or blackmail. The distinction must instead be drawn at the level of the content of the law being protested and the kind of justification the law claims for itself.

  ### I. The Communicative Picture and Its Limits

  Rawls famously characterizes civil disobedience as a public, nonviolent, conscientious breach of law, usually done with the aim of bringing about a change in law or policy. On his view, the act is addressed to the majority’s sense of justice; it says, in effect, “this law violates principles you already claim to hold.” Civil disobedience is therefore not merely pressure, but a form of communication—an appeal to shared public reason.

  There is something intuitively right about this. Civil disobedience is often public, deliberately so. Protesters announce their action, accept arrest, and use the courtroom as a stage. They frequently speak in moral terms, invoking equality, freedom, or basic rights. The communicative aspect is not incidental.

  But the explanatory question is not whether civil disobedience *communicates*. It is what makes it *work*. On the communicative picture, civil disobedience succeeds by changing the majority’s moral views. That sometimes happens. But it is a fragile and often inaccurate description of how civil disobedience actually functions. The majority frequently remains unmoved. Racial attitudes in the Jim Crow South did not shift simply because sit-in participants made eloquent appeals to the Constitution. What changed was the political calculation: segregated lunch counters became sites of sustained conflict, arrests filled jails, federal attention was drawn, and the costs of maintaining segregation rose.

  The public, nonviolent manner of civil disobedience is better explained as a way of raising those costs effectively. Publicity increases visibility and political pressure. Nonviolence reduces the likelihood of a backlash that would let authorities crush the protest without legitimacy costs. Accepting punishment signals seriousness and forces the state to spend scarce enforcement resources on otherwise law-abiding citizens. These are features of a strategy of cost imposition, not merely vehicles of moral persuasion.

  This does not mean civil disobedience never appeals to justice. It often does. But the appeal is the *content* of the demand, while the *mechanism* is the cost. In a nearly just state, majorities may be only imperfectly responsive to moral argument. They are, however, reliably responsive to the political and material costs of enforcing laws that generate sustained resistance.

  ### II. The Enforcement-Cost View

  The enforcement-cost view holds that civil disobedience works by making an unjust law expensive to enforce. Enforcement costs include more than police overtime and jail space. They include the political cost of publicly coercing citizens who appear principled rather than dangerous, the administrative burden of processing many arrests, the loss of cooperation from communities that resent the law, and the damage to the state’s claim to govern by public reason.

  In a nearly just state—one whose basic institutions are largely legitimate but which still contains unjust laws—this kind of pressure can be especially effective. The state depends on widespread voluntary compliance. A law that requires continuous, visible coercion to maintain becomes harder to sustain than one that is obeyed quietly. Civil disobedience exploits this fact. By refusing to comply, the disobedient forces the state either to enforce the law at increasing cost or to reconsider it.

  Take the lunch counter sit-ins. The laws they challenged required racial segregation in private businesses. The protesters did not merely denounce those laws; they occupied the stools and refused to leave. Each arrest cost the city money, time, and legitimacy. The response—police dragging away nonviolent students—made visible a contradiction between the law’s claimed justification of equal treatment and its actual enforcement. This was not just a message; it was a politically expensive enforcement problem.

  This account explains why civil disobedience can succeed even when the majority’s sense of justice is not awakened. The majority may remain prejudiced or indifferent, yet decide that the law is no longer worth the cost. That is a less inspiring story than Rawls’s, but it fits much of the historical record.

  ### III. The Blackmail Objection and Why Manner Cannot Answer It

  The obvious objection is that the cost-raising view appears to erase the line between civil disobedience and coercion. If civil disobedience is just the imposition of costs until the state changes a law, then any group with enough leverage—a corporation, a union, a well-organized interest group—could call its pressure tactics civil disobedience. A group could blockade a port, disrupt commerce, or refuse to comply with regulations, all while saying it finds the law unjust. Without the Rawlsian requirement that the act appeal to the majority’s sense of justice, the objection runs, civil disobedience becomes indistinguishable from blackmail by the powerful.

  Rawls’s answer is that civil disobedience is public, nonviolent, and conscientious, and that these features distinguish it from coercion. But this cannot do the necessary work. Publicity is not unique to civil disobedience; a campaign of economic coercion can be fully public. Nonviolence is also not unique; many coercive tactics are nonviolent but plainly extortionate. A corporation might publicly refuse to comply with environmental regulations, accept fines, and announce that it will continue until the regulations are repealed. That is public, nonviolent, and perhaps even punishment-accepting. But it is not civil disobedience simply because it has those formal features.

  Likewise, a blackmailer can act openly if he is willing to bear the legal penalty. He can even speak in moral language. The public, communicative manner of an act does not by itself transform a threat into a civic appeal. The distinction must lie elsewhere.

  ### IV. Distinguishing Civil Disobedience by Content and Justification

  The distinction, I suggest, must be drawn at the level of the content of the law being protested and the kind of justification the law claims for itself. In a nearly just state, laws do not present themselves as brute commands. They are enacted and enforced with public justifications: they claim to serve equal citizenship, public health, public safety, fair treatment, democratic accountability, or some other public value. An unjust law in such a state is often unjust precisely because its content or enforcement contradicts the justification it claims.

  Civil disobedience, on this view, is the deliberate breach of a law in order to raise the costs of enforcing it, where the breach is aimed at a law whose *own claimed justification* is contradicted by its content or application. The protester is not merely saying “I dislike this law” or even “this law violates my private morality.” The claim is stronger: “This law cannot be enforced under the justification it gives for itself without betraying that justification.”

  Consider segregation laws. At the time, many were defended in public as consistent with “separate but equal” treatment. The civil rights movement could invoke that claimed justification and expose its contradiction. The law said it treated Black citizens equally, but its enforcement required humiliating and excluding them. The disobedience raised the cost of maintaining that contradiction. The state had to choose between enforcing the law and openly repudiating its own stated principle.

  Now consider a different case: a business group that refuses to comply with a workplace safety regulation because it reduces profits. Suppose the group announces its refusal, accepts fines, and says the regulation is “unjust.” The regulation claims to protect workers from serious harm. The business group is not saying that the regulation fails to protect workers on its own terms. It is saying that protecting workers is less important than its private interest. That is not an internal critique of the law’s self-justification; it is a rejection of that justification in favor of another. Even if the group’s tactic is public and nonviolent, and even if it raises enforcement costs, it is not civil disobedience. It is coercion or ordinary interest-group pressure.

  The same distinction applies to blackmail. A blackmailer imposes costs unless the target complies with a demand. The demand need not be connected to any inconsistency in the target’s own principles. Civil disobedience, by contrast, is structured by the law’s own justificatory commitments. Its demand is not “pay me or I will hurt you,” but “enforce your own stated principles, or change the law.”

  This is why the communicative character of civil disobedience still matters, though not in the way Rawls thought. The act communicates a contradiction internal to the law. But its force comes from the fact that continuing to enforce the law becomes costly. The state cannot simply ignore the contradiction; it must either live with escalating enforcement costs or revise the law to bring it in line with its claimed justification.

  ### V. Reclassifying Some Paradigm Cases

  This account has consequences, and some of them are uncomfortable. If the distinction between civil disobedience and coercion depends on the law’s claimed justification, then some acts that are widely called civil disobedience will not count.

  One example is anti-abortion clinic blockades. Participants often act publicly, nonviolently, and accept arrest. They regard themselves as civil disobedients defending unborn life. But in a liberal nearly just state, laws permitting abortion claim to protect women’s liberty, bodily autonomy, and health. The blockaders do not typically argue that those laws *contradict* their own claimed justification. They argue that the justification itself is wrong because fetal life should take priority. That is a rejection of the law’s public basis, not an internal critique of it. On my view, clinic blockades are therefore not civil disobedience, but a form of conscientious coercion or religious obstruction. That is a real reclassification, and it follows from the account.

  By contrast, some disruptive climate protests may count as civil disobedience even if they are not polite. If a government authorizes a project while claiming to act on its own environmental commitments, and protesters block construction to show that the approval violates those commitments, they are raising the cost of enforcing a decision whose self-justification is inconsistent. The question is not whether the protest is public and nonviolent; it is whether the demand is tied to the law’s or decision’s own claimed justification.

  This also means that not every act of principled lawbreaking is civil disobedience. A pacifist who refuses conscription because he rejects war altogether may be engaging in conscientious refusal, not civil disobedience, if the conscription law is defended on grounds he simply does not share. Civil disobedience, in the strict sense, depends on a relationship between the law’s content and its professed justification.

  ### VI. What Is Settled and What Is Contested

  It is worth being clear about what is and is not settled here. There is fairly broad agreement that civil disobedience involves deliberate lawbreaking, that it is motivated by objection to a law or policy, and that it is usually public. It is also widely accepted that Rawls’s communicative account has been the dominant philosophical framework. What is not settled is whether civil disobedience must be nonviolent, whether it must accept punishment, and whether its primary function is communicative or coercive. The enforcement-cost view I have defended is a live but contested position, not a consensus. The internal-justification criterion for distinguishing civil disobedience from blackmail is likewise a proposal, not an established result.

  The strength of the enforcement-cost view is that it explains why civil disobedience works in the messy, imperfect circumstances of a nearly just state. It does not require majorities to become morally better; it only requires that they find injustice expensive. The challenge is to show that this is not just power politics. I have argued that the answer lies in the relationship between the protest and the law’s own justification. Civil disobedience, properly understood, is neither mere speech nor mere coercion. It is the strategic imposition of enforcement costs on laws that cannot be defended on their own terms.
