  - Thus agent's will is not source of occurrence; it is a component in a larger causal structure controlled by Black. The action is realized through the agent's will only with Black's permission.
  - This is not psychology; it is objective causal role. Even if the agent's mental process is identical, its relation to the outcome is different: it is not the ultimate determinant.

