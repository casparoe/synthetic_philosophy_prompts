answer: |-
  The mere presence of a counterfactual intervener in a Frankfurt case can undermine freedom and responsibility even if the intervener never acts, and even if the agent is entirely unaware of the intervener’s presence. The reason is not psychological. The agent need not feel watched, coerced, or controlled. The problem is that the causal structure of the case has changed: the agent’s will is no longer the source of the action’s occurrence in the way that freedom and responsibility require.

  ### 1. Freedom requires sourcehood, not just actual causation

  Free and responsible action requires more than the fact that the agent’s mental states caused the action. It requires that the agent be the source of the action—that the action be genuinely attributable to the agent as an exercise of her own will.

  In a normal case, an agent decides to perform some act, and the act occurs because of that decision. The agent’s will is the source of the act’s occurrence.

  In a Frankfurt case, however, the causal structure is different. Black, the counterfactual intervener, has a device that monitors the agent’s mental states. If the agent is going to decide on her own, Black does nothing. If the agent is not going to decide on her own, Black intervenes and causes the same act.

  This means the action’s occurrence is guaranteed by Black’s actual plan. The agent’s will determines only *which causal route* leads to the action—her own decision or Black’s intervention. It does not determine *whether* the action occurs.

  That is a real causal-structural difference. The agent’s will is not the ultimate source of the action’s occurrence; it is merely one possible trigger inside a larger causal mechanism controlled by Black. Even though the agent’s own deliberation is exactly the same as it would have been without Black, its causal role in the overall structure is different.

  ### 2. The agent’s will is subordinated to Black’s will

  In the Frankfurt case, Black’s presence does not change what the agent thinks or feels. But it changes what the agent’s will is causally capable of doing. The agent’s will operates only within a space permitted by Black.

  Black’s plan is:

  - If the agent wills the act, let the agent’s will cause it.
  - If the agent does not will the act, cause it anyway.

  The agent’s will is thus nested inside Black’s plan. The action occurs because Black has set up a structure in which the action will occur regardless of what the agent’s will does. The agent’s will is not the source of the action’s occurrence; it is at most the source of the particular way the action comes about.

  This is not a psychological point. The agent may be completely unaware of Black. The agent may deliberate exactly as she would in a normal case. But the causal position of her will has changed. In a normal case, her will is the source of the action’s occurrence. In the Frankfurt case, her will is one branch of someone else’s plan. That is an objective causal fact, not a feeling of being controlled.

  ### 3. The actual-sequence reply misdescribes the actual sequence

  The standard reply is that what matters is the actual sequence, not the mere presence of the intervener. Since Black never intervenes, the actual sequence is just the agent’s own decision causing the action. Therefore, the agent is free and responsible.

  But this reply assumes an overly narrow conception of the “actual sequence.” The actual sequence is not just the chain of mental events inside the agent. The actual sequence includes the whole causal structure in which the action occurs.

  In the Frankfurt case, Black is actually present. Black is actually monitoring the agent. Black actually has a conditional intention to intervene. Black actually refrains from intervening. These are actual states and events, not merely possible-world alternatives.

  Moreover, the agent’s decision has an additional actual role in the Frankfurt case: it disables Black’s intervention. The complete causal story of the action’s occurrence includes Black’s monitoring, Black’s plan, and Black’s non-intervention. In the normal case, none of that exists.

  So the actual sequence is not the same. The standard reply says that the actual sequence is the same because the agent’s psychology is the same. But that begs the question. The objection is precisely that the external causal structure matters. To exclude Black’s actual presence from the “actual sequence” by definition is not to answer the objection; it is to assume that only the agent’s internal psychology is relevant.

  ### 4. A slave can be unaware of her slavery

  Consider an analogy. A slave is allowed by her master to make her own choices, because the master knows he can force her if she chooses otherwise. The slave is unaware that the master has this power. She deliberates and acts exactly as she would if she were free.

  Is she free? In an important sense, no. Her will operates under the master’s actual power. The master’s plan is part of the causal structure of her action, even if he never intervenes. The slave’s psychology may be identical to a free person’s psychology, but her causal position is not identical.

  Frankfurt’s Black is like the master. His mere presence—his readiness to intervene—means that the agent’s will is not the final source of the action. The action is permitted by Black. It occurs within a structure that Black controls.

  ### 5. Conclusion

  The idle counterfactual intervener undermines freedom because it changes the causal role of the agent’s will. The agent is no longer the source of the action’s occurrence; she is only the source of one way in which an already guaranteed outcome comes about.

  The standard actual-sequence reply fails because it treats Black’s presence as if it were merely a possibility. But Black’s monitoring, his conditional intention, and his non-intervention are actual parts of the causal structure. Once the actual sequence is described fully, it is not the same sequence as a normal free action.

  So the agent is not free—not because she feels controlled, but because she is controlled in the causal-structural sense. Her will has been made subordinate to another’s plan, even though she never knows it.
