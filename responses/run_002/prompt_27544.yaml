  Commentary:

  The pantoum's repeating lines embody the paradox because they force the same words to carry different affect in new contexts. The first return of "But I am not sorry I stayed, and that is what troubles me" (D) illustrates this: in stanza 1 it follows an admission of confusion; in stanza 2 it follows the blank faces of departing strangers, so its "not sorry" sounds less like simple satisfaction and more like complicity. The most important pair is C: "I can't say what I wanted from those terrible scenes." Its first occurrence is ordinary uncertainty; after the refusals of skill and relief in the final quatrain, the identical line returns as an open question, without punctuation, and the poem ends there.

  The line "The knife was not real, the child's cry was not real, but the flinch was" appears first as an observation about the represented violence; on its second occurrence, after "I could have looked away; I did not; I leaned forward," it also raises the candidate that the audience's freedom to look away is part of the value. But the poem does not settle there: the next stanza begins "If this is pleasure, it is pleasure with its teeth in my throat," inflecting both conversion and intense-feeling theories while refusing to call the experience simply pleasant. "Why do I keep returning to the moment the messenger entered?" similarly changes from a memory of dread to a confession of appetite. The final quatrain lines M and N explicitly decline the two easy solutions: "Not the skill of the actors—no, their skill made it worse" and "Not relief that my own house is quiet—I am not comforted." Because these refusals appear immediately before the return of the opening lines, the pantoum strands the speaker back in the lobby with the original question, unresolved.

