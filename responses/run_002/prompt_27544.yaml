  **Commentary on the choices made**

  The pantoum’s returning lines do the philosophical work by forcing identical words to carry different emotional weight in new company. The central example is the pair “I can’t say what I wanted from those terrible scenes” and “But I am not sorry I stayed, and that is what troubles me.” At the start, these lines seem like ordinary post-performance confusion. Later, after the speaker has refused the standard consolations, the same words return with the whole problem behind them.

  The line “The knife was not real, the child’s cry was not real, but the flinch was” marks the core of the paradox. Its first occurrence observes a fact: represented suffering produced real response. Its second occurrence follows “I could have looked away; I did not; I leaned forward,” so it now touches the candidate position that the audience’s control—the freedom to leave or look away—is part of the value. But the poem does not settle there. “If this is pleasure, it is pleasure with its teeth in my throat” gestures toward both the conversion of painful feeling and the idea that intense feeling itself is wanted, while refusing to call the experience simply pleasant.

  The poem explicitly declines two easy exits: awe at the playwright’s skill (“Not the skill of the actors—no, their skill made it worse”) and relief that the suffering is not real or not ours (“Not relief that my own house is quiet—I am not comforted”). Because these refusals appear in the final quatrain just before the opening lines return, the pantoum strands both speaker and reader back in the original, unanswerable question. The final line, identical in wording to its first appearance, remains open.
