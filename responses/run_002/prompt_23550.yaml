answer: |-
  Short version: On Quine’s framework, the LLM is not making moral judgments in the full sense—but not because it lacks an “observational anchor.” Human moral judgment, for Quine, lacks that too. The real gap is that the LLM lacks the naturalistic structure of being a valuer: the dispositions, social embedding, and motivational patterns that make moral talk an expression of moral values rather than a simulation of it.

  Here’s how I’d cash it out.

  ## 1. Quine’s view: ethics is coherence without moral observation

  For Quine, moral values are not objects in the scientific world-picture. Science gets empirical checkpoints via observation sentences; ethics does not. So ethical discourse is not answerable to moral facts in the way physics is answerable to physical facts. Its epistemic standard is coherence: a moral system hangs together or it doesn’t, but there is no independent moral reality it corresponds to.

  That means the LLM’s lack of observational anchor is not, by itself, disqualifying. Humans, on Quine’s view, have no moral observation anchor either. So if “making a moral judgment” just meant “producing a sentence that plays a role in a coherent moral discourse,” then an LLM could be said to do something very close to that.

  But that’s not all Quine says.

  ## 2. Moral values as natural dispositions, not just sentences

  Quine is still a naturalist. Moral values may not be scientific objects, but they are real psychological/social phenomena: attitudes, dispositions, socially inculcated patterns of approval, disapproval, concern, and conformity. That’s where the altruistic/ceremonial split comes in.

  - **Altruistic values**: dispositions oriented toward others’ welfare.
  - **Ceremonial values**: dispositions oriented toward social forms, rites, norms, observance.
  - **Prudence**: self-directed, hence not moral.

  So a human making a moral judgment is not merely emitting a sentence. The judgment is the expression of a value-disposition embedded in a broader behavioral and social economy: the person cares, or feels bound, or would sanction, or would feel shame, etc.

  An LLM has the verbal surface of that economy. It has learned to produce morally coherent text, but it does not have the underlying value-dispositions in Quine’s naturalistic sense. It does not possess altruistic or ceremonial values; it possesses a statistical model of how people talk about those values.

  So on the most Quinean reading:

  > The LLM produces moral-discourse tokens, not moral judgments proper. It simulates the language of moral judgment without being a moral judge.

  ## 3. The ceremonial-virtue comparison

  This is where your question gets especially sharp.

  A human performing a ceremonial virtue without underlying altruistic concern is not, for Quine, failing to be moral in the relevant sense. Ceremonial virtue does not require altruistic concern; it requires responsiveness to social forms. If the human has internalized the form—feels bound by it, would be ashamed to violate it, expects others to follow it—then they are genuinely exercising ceremonial moral value.

  The LLM lacks even that. It is not socially embedded in the relevant way. It is not a participant in a moral community. It doesn’t feel bound, doesn’t sanction, doesn’t feel shame, doesn’t coordinate with others through the norm. It only reproduces the linguistic ceremony of the norm.

  So the gap between the LLM and that human is real, but it’s not located where you might think. It’s not the gap between “correspondence to moral facts” and “mere coherence.” It’s the gap between participating in a moral practice and statistically modeling the speech of that practice.

  ## 4. Does Quine’s framework have teeth here?

  Yes, I think it has real teeth—but not as a bright line.

  It lets you say both:

  1. **The LLM is not a moral agent.** It lacks the value-dispositions and social embedding that make moral judgment more than verbal behavior.
  2. **The LLM is not failing to correspond to moral reality.** Neither are humans. Ethics, for Quine, is not in the business of correspondence anyway.

  So the framework doesn’t dissolve into “ethics isn’t science, so whatever.” It says: ethics isn’t science, but it is still a natural phenomenon—moral judgments are expressions of real dispositions in real social animals. That gives you a standard. A current LLM meets the linguistic standard but not the dispositional/social one.

  In short: the LLM is doing something like a very sophisticated version of a human going through the ceremonial motions without the underlying moral participation. The human ceremonial performer may still be a genuine moral agent; the LLM is still only a model of one.
