  ---

  The worry is that teleosemantics makes content depend on what a mechanism was selected to indicate. For "fly" there were actual flies. But for "if I had taken the other job..." there were no actual alternative taken jobs. So how could selection fix that content?

  The strongest teleosemantic answer has three parts.

  **1. Don't treat counterfactual beliefs as simple evolved detectors.** Complex beliefs are not like frog fly-detectors. They are built by a general-purpose compositional representational system. Teleosemantics only needs to assign content to primitive concepts and structural operations. The content of "if I had taken the other job" is determined compositionally from contents of I, job, happiness, take, etc., plus the counterfactual operator. None of this requires evolution to have previously encountered the specific counterfactual situation.

  **2. Counterfactual content is usually grounded in actual-world structure, not possible worlds.** A counterfactual like "this glass would break if dropped" is made true by an actual property: the glass's fragility—its microstructure and the relevant laws. "If I had taken the other job, I'd be happier" is made true by actual facts about my preferences, abilities, the two jobs' features, and the causal relations among them. If you accept an interventionist/dispositional account, the truthmaker is an actual causal/preference structure: intervening on the job-choice variable in the actual model yields higher happiness. Such structures are actual features of the world and can be tracked/learned/selected for. Thus the modal idiom is a format, not an extra target.

  **3. The counterfactual operator gets its function from its role in actual-world reasoning.** Organisms benefit from modeling causal structure and running simulations offline. A mechanism that takes a model of actual dependencies might produce P ☐→ Q. Its function is to be used by downstream consumers for prediction, planning, and choice. Millikan-style: the consumers of "P ☐→ Q" are the planning/inference systems. Their use is successful just when the actual causal structure is such that intervening to make P would make Q. That success condition is the content. So the operator is fixed by its functional role in a selected system for causal reasoning, not by tracking possible worlds.

  Then compare:

  Millikan's consumer-side has an advantage: it does not require the representation to be caused by the represented condition. A cognitive map can represent a novel route or a possible future because consumers use it to guide action; content is the condition under which that use succeeds. So a representation of a non-actual antecedent can have content because it is used by actual systems to adjust behavior. The frog's fly-signal is a very special case.

  Dretske's indicator-side can also get a version of this, but only if counterfactual content is identified with actual relational facts that can be indicated—e.g., the actual causal dependence of happiness on job choice. Then the belief state can be recruited by learning to indicate that actual relation. If one insists that counterfactual truths are primitive modal facts about other worlds, Dretske's indicator view is less comfortable. But the strongest teleosemantic package rejects that insistence and pairs teleosemantics with an actualist grounding of modality.

  Objections:
  - "Evolution never ran the alternative job tape." True, but it didn't need to. It selected a general architecture for causal model building and self-modeling; specific tokens get content from the actual model structure.
  - "This is just pushing the problem to the counterfactual operator." The operator's content is grounded in consumer use/success conditions: it is a rule for constructing representations whose use succeeds under certain actual relations. That is not hand-waving; it is the same kind of story teleosemantics gives for logical terms and compositional rules.

  Conclusion: Teleosemantics can handle counterfactual content by treating counterfactual beliefs as structured representations of actual causal/dispositional facts, produced and consumed by mechanisms selected for actual-world reasoning. The consumer-side version provides the most natural account, but the indicator-side version can also be defended if paired with an actualist treatment of counterfactuals. The problem is not fatal.

