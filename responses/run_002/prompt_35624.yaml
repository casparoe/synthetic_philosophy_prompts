answer: |-
  Here is the strongest case that teleosemantics can handle counterfactual content. It is not a knock-down proof, but it shows the problem is not clearly fatal, and that the consumer-side version has a real advantage over the indicator-side version.

  ## 1. The challenge, stated carefully

  The worry is this: teleosemantics explains content in terms of what a representational mechanism has the function to indicate or respond to, where that function is fixed by actual selection history. But counterfactual beliefs seem to have as their content something like:

  - *If I had taken the other job, I would be happier now.*
  - *This glass would break if dropped.*

  Those contents involve non-actual states of affairs. Evolution never got to run the tape again. So how could selection have fixed content involving what *would have* happened?

  The key move is to deny that counterfactual beliefs should be modeled on simple evolved detectors like the frog’s fly-detector. They are complex, structured representations produced by general-purpose cognitive systems. Once you see that, the problem shifts from “how does evolution track possible worlds?” to “how does evolution build and tune a system for representing actual causal and dispositional structure?” That is a much more tractable problem.

  ## 2. First move: counterfactual content is grounded in actual-world structure

  The strongest teleosemantic response starts with a metaphysical deflation of counterfactuals. Many counterfactuals are made true by actual-world facts, not by something floating in a parallel possible world.

  Take:

  > *This glass would break if dropped.*

  What makes this true is not a separate possible world in which the glass is dropped. It is an actual property of the glass—its fragility—together with actual laws or causal powers. Fragility is a real, actual dispositional property of the glass. It can be investigated, learned about, and used to guide behavior. If you drop the glass, the breaking is the manifestation of that actual property.

  Likewise:

  > *If I had taken the other job, I would be happier now.*

  What makes this true, if it is true, is some complex actual fact about you: your preferences, your personality, the features of the two jobs, and the causal relations among job conditions and your happiness. On an interventionist or causal-model treatment, the counterfactual is true just in case your actual causal/psychological structure is such that intervening on the job-choice variable and setting it to the other job would yield higher happiness. That is an actual relational fact about you and your situation.

  So the teleosemanticist can say: counterfactual content does not require tracking possible worlds. It requires representing actual causal, dispositional, and psychological structure. The modal-sounding formulation is a kind of cognitive format, not an extra possible-world target.

  ## 3. Second move: complex beliefs get content compositionally

  The frog’s fly-detector is a poor model for human beliefs. Human beliefs are structured representations. Teleosemantics need not assign content to every token belief by saying, “this token belief type was directly selected because it indicated that exact content.” That would be absurd for most beliefs: evolution did not select a detector for *quarks*, *taxes*, or *the other job*.

  The standard teleosemantic story for complex or novel contents is compositionality. The content of a complex representation is determined by the contents of its parts and the semantic contribution of its structure. Teleosemantics needs to explain the primitive representational ingredients and the basic operations, not every complex sentence-like thought.

  Thus, for:

  > *If I had taken the other job, I would be happier now.*

  the ingredients are concepts like *I*, *job*, *happiness*, *taking*, *past*, and the counterfactual operator. The concepts can be given ordinary teleosemantic treatments: they are representations of actual properties, kinds, and relations. The counterfactual operator is the only specifically modal element.

  So the real question becomes: can teleosemantics explain the content of the counterfactual operator? The strongest answer is yes, because the counterfactual operator is a tool for reasoning about actual causal structure.

  ## 4. Millikan’s consumer-side version: content is fixed by use

  Millikan’s version of teleosemantics says that the content of a representation is not simply what causes it, or what it has the function to indicate. Content is fixed primarily by what the *consumers* of the representation need the world to be like for their use of the representation to succeed.

  This gives her a strong resource for counterfactual thought. A representation can have content even when the represented state of affairs is not actual, because the representation is being used by downstream systems to guide actual behavior, inference, or planning.

  For example, a cognitive map can represent a route you have never traveled. A blueprint can represent a house not yet built. The map or blueprint is not caused by the thing it represents; its content is fixed by the conditions under which the map-using or blueprint-using systems succeed. If you use the map and arrive at food, the map was correct. If you use the blueprint and build a house that stands, the blueprint was correct.

  Now apply this to counterfactual beliefs.

  Suppose you have a representation:

  > *This glass would break if dropped.*

  The consumer of this representation is, roughly, your planning and action system. It uses the representation to avoid dropping the glass, or to predict what will happen if it falls. That use succeeds when the glass actually has the dispositional property of fragility—that is, when the actual causal structure is such that dropping it would break it. So Millikan can say: the content of the representation is fixed by the condition under which the consumer’s use succeeds. The content is not a visit to another possible world; it is the actual dispositional/causal condition.

  Now take the job example:

  > *If I had taken the other job, I would be happier now.*

  The consumer system here might be your self-modeling, decision-making, and emotion-regulation system. You use the representation to update your preferences, to learn something about what kinds of jobs suit you, to assign regret or relief, and to make better future choices. The use succeeds when your actual psychological and situational structure is such that the other job would indeed have produced higher happiness.

  On Millikan’s view, the content of the counterfactual belief is the condition that must obtain for those consumer uses to fulfill their proper functions. And that condition is an actual relational fact about you: your actual preference structure, your actual causal sensitivities, the actual features of the two jobs, and so on.

  This means the representation can be false. If your actual psychology and the actual features of the other job would not have made you happier, then the consumer’s use is out of line with the world, and the belief is false. But false content is still determinate content.

  ## 5. What about the counterfactual operator itself?

  One might object: this still assumes we already understand the counterfactual operator. But the operator itself has a function.

  The teleosemantic story can be put like this. Evolution and learning select for causal-model-building systems. Such systems take in actual data about regularities, interventions, and outcomes. They build structured models of the world. The counterfactual operator is a way of running those models “offline”: it takes a representation of an antecedent condition and a representation of a consequence, and produces a representation whose function is to guide the consumer’s expectations under simulated interventions.

  On an interventionist semantics, the truth of a counterfactual just is a fact about what happens when you intervene on a causal model. So the counterfactual operator’s representational function is to encode an actual causal relation between the antecedent and the consequent. The consumer uses it to guide action, choice, and explanation. The proper function of the operator is fixed by the success conditions of that use.

  Millikan’s framework is especially well suited here because it does not require the operator to be triggered by the actual presence of the represented causal relation. The operator is part of the system’s rule for constructing representations. Its content is fixed by the Normal conditions under which the consumers’ responses succeed.

  ## 6. Dretske’s indicator-side version can also be defended, but with more strain

  Dretske’s version says that a representation’s content is what it has the function to indicate. For counterfactual beliefs, the immediate problem is that there is no actual event of *my taking the other job* for the belief to indicate.

  But Dretske can still offer a version of the actual-structure move. He can say that the belief:

  > *If I had taken the other job, I would be happier now.*

  does not have the function to indicate a non-actual event. It has the function to indicate an actual relational fact: namely, the actual causal/psychological structure of your situation. That structure is actual, and it can be represented via learning, testimony, and inference.

  For example, your belief state may have been recruited by actual evidence: past experiences with jobs, observations of other people, knowledge of your own personality. The state has the function to indicate the actual dependency relation between job conditions and your happiness. That dependency is an actual fact about the world.

  So Dretske can handle counterfactuals if he is willing to identify counterfactual content with actual relational or dispositional facts. The content is not the possible world; it is the actual causal structure that grounds the counterfactual.

  However, Dretske’s indicator-side view is less flexible than Millikan’s for one important reason. Dretske’s picture is built around indication: the representational state is supposed to carry information about the represented condition. But counterfactual thought often involves imagining antecedents that have never occurred and may never occur. Millikan’s consumer-side story handles this naturally: the representation of a non-actual situation is used by consumers to guide action, and its content is the condition under which that use succeeds. Dretske has to say that the state indicates an actual relational fact, which is workable only if counterfactual truths are grounded in actual facts. That is plausible, but it is a substantive commitment.

  So the comparison is this:

  - **Millikan’s consumer-side version** has a natural story about representations of non-actual situations, because content is fixed by consumer success conditions, not by what the representation is caused by.
  - **Dretske’s indicator-side version** can also handle counterfactuals, but only if it pairs teleosemantics with an actualist account of counterfactual truthmakers—treating counterfactuals as representations of actual causal/dispositional structure.

  ## 7. Objections and replies

  **Objection:** Evolution never encountered the other job, so it could not select a mechanism with that content.

  **Reply:** Evolution did not select a mechanism for *that specific counterfactual content*. It selected a general-purpose architecture for causal modeling, self-modeling, planning, and simulation. The token content is fixed by the actual structure that the system models, together with the compositional constituents of the thought. This is no different from other novel beliefs. Evolution did not encounter quarks either, but a scientific belief about quarks can have determinate content if the conceptual and representational machinery has the right function.

  **Objection:** This just reduces counterfactual content to actual causal structure. But if modal facts are irreducible, teleosemantics still fails.

  **Reply:** The strongest teleosemantic response is to accept a naturalistic, actualist account of counterfactuals. That is not an ad hoc fix. Most naturalist programs already need some account of laws, dispositions, and causal powers. If you insist on irreducible possible-world truthmakers, then you are making modal content metaphysically heavy, and any naturalistic semantics will face difficulties. But that is not a special problem for teleosemantics.

  **Objection:** The counterfactual operator still seems like a hidden modal primitive.

  **Reply:** In a Millikan-style framework, the operator’s content is fixed by its role in the cognitive system’s use of structured representations. It is not a detector of possible worlds. It is a rule for building representations whose consumers succeed under certain actual relational conditions. That is a determinate functional role. It may not satisfy everyone, but it is not mere hand-waving.

  ## Conclusion

  The strongest teleosemantic answer is a version of option (b): counterfactual content reduces or is grounded in actual-world facts—especially causal, dispositional, and psychological structure—and complex beliefs get their content compositionally from actual-world-tracking ingredients plus a counterfactual operator whose function is fixed by its role in actual-world reasoning.

  Millikan’s consumer-side version has the most natural resources here. It does not need the representation to be caused by the non-actual situation it represents. It fixes content by the success conditions of downstream consumers. Dretske’s indicator-side version can also survive, but only by identifying counterfactual content with actual relational facts that can be indicated.

  So the problem is real, but it is not fatal. The teleosemanticist can say: evolution did not need to run the tape again. It only needed to build a system that models the actual causal structure well enough to answer “what if” questions.
