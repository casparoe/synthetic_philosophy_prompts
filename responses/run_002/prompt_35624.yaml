  Let's outline.

  Title: Teleosemantics and Counterfactual Content

  Introduction: The challenge is real but rests on a false analogy between simple evolved signals and complex human beliefs. Counterfactual beliefs are not frog's fly detectors. Teleosemantics should not assign content to each whole belief via direct selection history. Instead, it assigns content to primitive representations and to cognitive operations. Then complex contents are compositionally determined. Additionally, counterfactual contents are grounded in actual-world facts, not possible worlds. So option (b).

  Section 1: The basic resources.
  - Proper functions can be for mechanisms that process actual-world information and produce complex representations.
  - Evolution can select general-purpose capacities for causal modeling, simulation, planning, even if not specific counterfactual contents.
  - A model's function is to map actual causal structure; counterfactual judgments are outputs of such models.
  - The represented content is actual relational/dispositional facts: fragility, preferences, causal powers.

  Section 2: Millikan's consumer-side.
  - For Millikan, content is fixed by consumers. The question is not "what possible world did the producer detect?" but "what conditions must hold for the consumers' use of the representation to succeed?"
  - The consumer systems for counterfactual belief: planning, decision, emotion/regret, inference. They use "if P then Q" to choose actions, update preferences, assign responsibility.
  - Example glass: consumer avoids dropping; succeeds iff glass is fragile/dropping would cause break. The content is that actual dispositional condition.
  - Example job: consumer uses belief to update self-model and future job decisions; succeeds iff actual preference/causal structure makes the counterfactual true.
  - The "normal explanation" for success is actual causal/preference structure, not possible world. Thus Millikan can fix content without requiring selection to track alternate worlds.
  - Also Millikan can allow representation of future/non-actual because consumer use has success conditions at different times/possibilities.

  Section 3: Dretske's indicator-side.
  - Dretske seems harder because indication requires actual information. But he can handle by reducing counterfactual content to actual-world relations: dispositions, causal dependencies, lawful regularities.
  - A belief that "if P then Q" has the function to indicate an actual relation R between P and Q (e.g., P causally necessitates Q in the circumstances). The organism receives information about that relation through actual cues, learning, testimony.
  - Dretske's compositional resources: the constituents (P, Q) are recruited indicators of actual properties; the conditional form is a conventional or learned cognitive operator whose role is to indicate dependency relations.
  - If one refuses to reduce counterfactuals to actual facts, Dretske has a harder time. But a naturalist teleosemanticist can and should adopt a grounding account of modality. Thus not ad hoc.

  Section 4: Objections and replies.
