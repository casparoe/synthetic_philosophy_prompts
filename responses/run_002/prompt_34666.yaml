  Title: Responsibility Without Abandonment: Resolving the Harshness Objection to Luck Egalitarianism

  Project description:

  Precise question. The debate over luck egalitarianism's harshness objection turns on an ambiguity in "responsibility." I will ask: Under luck egalitarianism, does an outcome's being attributable to a person's voluntary choice as a matter of moral appraisal suffice to reduce that person's distributive claims to assistance or require that she bear the resulting costs alone? Or does it merely license evaluating her agency while leaving her entitlements intact? My thesis is that the correct answer is the second: a luck egalitarian can concede attributability without conceding liability. The question is determinate because it asks which normative consequence follows from a specific responsibility judgment, not whether people are ever responsible.

  Why existing positions leave it open. Harshness critics typically argue: if a disadvantage is the result of a genuine imprudent choice, luck egalitarianism says it is the person's own responsibility, so she may be left with the costs. They then present cases where that conclusion is unacceptable. Defenders usually respond by narrowing the conditions under which choices count as genuine: the choice was not well-informed, not voluntary, not reasonable, or the person lacked the ability to avoid it; or they add a safety net. Both sides share an assumption: if the bad outcome really is attributable to the person's agency, then the person's claim to assistance is correspondingly weakened. The debate then stalls over whether the conditions for genuine choice are met. The crucial inference—from attributive responsibility to reduced entitlements—is rarely defended directly and remains open.

  Why this framing makes progress. This project does not add another case to the intuition battle. It targets the shared premise. If the distinction between attributive responsibility (the choice is the person's own and can be morally appraised) and allocative responsibility (the person must bear the costs or has a weaker claim) is sound, then the harshness objection is not a counterexample but a category mistake. It also explains why both sides sound partially right: critics are right that luck egalitarians need an agency-based line between brute luck and option luck; defenders are right that recognizing agency need not mean abandonment. The proposed view can say of the imprudent smoker or reckless driver: "Yes, this outcome is attributable to her choice and she may be open to moral criticism, but she is not thereby disqualified from aid." The project will also address whether this division of labor leaves any distributive role for option luck, such as in setting fair terms for risky activities or insurance, without making basic entitlements hostage to imprudence.

  Plan of work. Weeks 1–2: map the harshness debate and identify the shared inference. Weeks 3–4: formulate and test the attributive/allocative distinction using a range of cases. Weeks 5–6: reconstruct the harshness objection with the distinction in place. Weeks 7–8: evaluate the strongest arguments for the entailment (desert, choice as waiver, incentives, fairness). Weeks 9–10: develop an alternative luck egalitarian account in which option luck grounds appraisal without reducing basic claims; address collapse objection. Weeks 11–12: apply to hard cases (medical imprudence, reckless risk, debt) and compare with existing defenses. Weeks 13–14: draft the paper. Week 15: revise and finalize. I will meet with my advisor every two weeks to review short argument memos.

  Success and failure. A successful paper will show that the attributive/allocative distinction is stable, that it dissolves the harshness objection without either denying genuine imprudence or abandoning the luck egalitarian commitment to neutralizing brute luck, and that the resulting view remains recognizably luck egalitarian. It will not merely relabel the same verdicts but will change how harsh cases are handled: aid can be owed even when criticism is deserved. The project fails if the distinction collapses under pressure—for example, if attributive judgments inevitably carry allocative consequences through social meaning or institutional incentives—or if avoiding harshness requires abandoning the distinction between brute luck and option luck altogether. It also fails if the final view has no practical difference from outcome egalitarianism, or if the argument merely stipulates the distinction without showing why the inference from attributability to liability should be rejected.

