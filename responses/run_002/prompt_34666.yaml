answer: |-
  **Responsibility Without Abandonment: Resolving the Harshness Objection to Luck Egalitarianism**

  **Precise question.** The central question is whether a bad outcome’s being attributable to a person’s voluntary choice—in the sense relevant to moral appraisal—suffices, under luck egalitarianism, to weaken that person’s claim to assistance or require her to bear the costs alone. Or does such attributability merely license moral appraisal while leaving distributive entitlements intact? I will defend the second answer: attributability does not by itself entail allocative liability. The question is determinate because it asks which normative consequence follows from a specific responsibility judgment, not whether people are ever responsible.

  **Why existing positions leave it open.** Harshness critics typically assume that if a disadvantage results from a genuine imprudent choice, luck egalitarianism regards the person as responsible, and so she may be left with the costs. Defenders usually respond by denying that the choice was genuine: it was not fully informed, voluntary, reasonable, or avoidable; or they add a safety net. Both sides share an assumption: if the outcome really is attributable to the agent, then the claim to aid weakens. The debate therefore stalls over whether the conditions for genuine choice are met, while the inference from attributive responsibility to reduced entitlements remains largely unexamined.

  **Why this framing makes progress.** Rather than adding another case to the existing intuition battle, the project targets this shared premise. If the distinction between attributive responsibility and allocative liability is sound, the harshness objection is not a counterexample to luck egalitarianism but a category mistake. The framing also explains why both sides sound partly right: critics are right that luck egalitarians need an agency-based line between brute luck and option luck, while defenders are right that recognizing agency need not mean abandonment. The view can say of an imprudent smoker or reckless driver: “Yes, this outcome is attributable to her choice, and she may be open to moral criticism, but she is not thereby disqualified from aid.” The project will also ask whether any distributive role remains for option luck—for example, in setting fair terms for risky activities or insurance—without making basic entitlements hostage to imprudence.

  **Plan of work.** Weeks 1–2: map the harshness debate and identify the shared inference. Weeks 3–4: formulate and test the attributive/allocative distinction. Weeks 5–6: reconstruct the harshness objection with the distinction in place. Weeks 7–8: evaluate the strongest arguments for the entailment from attributability to liability, including desert, choice as waiver, incentives, and fairness. Weeks 9–10: develop an alternative luck egalitarian account in which option luck grounds appraisal without reducing basic claims, and address the collapse objection. Weeks 11–12: apply the account to hard cases such as medical imprudence, reckless risk, and debt. Weeks 13–14: draft the paper. Week 15: revise and finalize. I will meet with my advisor every two weeks to review short argument memos.

  **Success and failure.** A successful paper will show that the attributive/allocative distinction is stable, that it dissolves the harshness objection without denying genuine imprudence or abandoning the luck egalitarian commitment to neutralizing brute luck, and that the resulting view remains recognizably luck egalitarian. It will change how harsh cases are handled: aid can be owed even when criticism is deserved. The project fails if the distinction collapses under pressure—for instance, if attributive judgments inevitably carry allocative consequences through social meaning or institutional incentives—or if avoiding harshness requires giving up the brute luck/option luck distinction altogether. It also fails if the final view is practically indistinguishable from outcome egalitarianism, or if the argument merely stipulates the distinction without showing why attributability does not entail liability.
