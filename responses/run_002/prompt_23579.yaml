answer: |-
  Thanks for sharing this. I think the draft is clearly written, and you’re right to suspect that the final paragraph needs more work. My honest reaction is that the circularity objection as it currently stands is not as strong as you think, because it relies on an ambiguity in “tracking.” But there is a related and perhaps stronger version of the worry you can develop if you aim it at Millikan’s notion of *Normal conditions* rather than at “tracking” alone.

  Here are some comments.

  ---

  ### 1. A small but important clarification about Millikan

  Your first paragraph says that, for Millikan, a representation is “correct when it performs its proper function,” i.e., when it is caused by the property it represents.

  That is not quite Millikan’s view, and the difference matters.

  For Millikan, a representation token is correct when it corresponds to the condition that figures in the *Normal explanation* of the consumer’s response. A token can be false but still cause the consumer’s behavior; likewise, a true token can fail to produce successful behavior. Correctness is not simply success or function performance; it is correspondence to the relevant environmental condition.

  So I would adjust the opening: Millikan does not identify truth with proper-function performance. She identifies truth with correspondence to the Normal condition that makes the consumer’s use of the representation historically adaptive.

  This matters because your circularity charge partly depends on sliding from “causal correlation in the selection history” to “correct correlation,” and Millikan will insist that those are not the same.

  ---

  ### 2. The circularity objection as written

  You write:

  > The proper function of a representation is fixed by its history of correct correlation with the represented property, but the account then defines correctness as the performance of that very proper function.

  A Millikan defender will immediately object to the phrase “correct correlation.” What the selection history gives us is not a history of *correct* correlations in the semantic sense. It gives us a history of causal correlations plus fitness consequences.

  The naturalistic paraphrase is something like:

  > Ancestors with neural state S had S caused by predators. When S occurred and caused flight, those organisms tended to survive better. Therefore the S-flight system was selected.

  No semantic notion appears in that paraphrase. The notion of *correctness* is then introduced later as a normative status for current tokens relative to the historically selected relation.

  So the simple circle you state is probably not vicious: Millikan can break it by giving a causal-fitness history and then defining correctness in terms of that history.

  ---

  ### 3. Your final paragraph: does “selection for tracking X” presuppose tracking?

  This is the step you specifically asked about, and I think it is not sound as written.

  The problem is that “selection for tracking X” can be read in two ways:

  1. **Semantic reading**: the system was selected for *correctly representing X*.  
     If so, then yes, the selection story presupposes semantic content.

  2. **Causal/informational reading**: the system was selected because tokens of S were caused by X, or covaried with X, and the consumer’s response to S was adaptive when X obtained.  
     This does not presuppose semantic correctness.

  Millikan can consistently take the second reading. For example:

  > S was selected because, in ancestral environments, S was reliably caused by predators, and S-driven flight was fitness-enhancing when predators were present.

  That story uses no term like “correct,” “represents,” or “semantic content.” It uses only causation, covariance, behavior, and fitness.

  So your final paragraph needs an argument that the relevant notion of “tracking” cannot be naturalistically specified, or that the only way to pick out *which* tracking relation constitutes the content is already semantic. Without that argument, the Millikan defender has an easy reply.

  In short: the phrase “selection for tracking X” does not by itself presuppose the semantic notion of tracking. It can be shorthand for a causal/informational relation.

  ---

  ### 4. A stronger version of the worry

  If you want to press a circularity objection, I suggest shifting the focus from “tracking” to Millikan’s technical notion of **Normal conditions** or **Normal explanations**.

  The deeper problem is this:

  To assign content, Millikan needs more than causal correlation. She needs to identify the *mapping relation* between representation and world that figures in the Normal explanation of the consumer’s behavior. But what makes something part of the Normal explanation rather than an accidental success?

  Consider a case like this:

  > A tokening of S is caused by a shadow. The organism flees, and by luck the fleeing helps it avoid a predator that was not the cause of S.

  The behavior is successful, but S did not represent that predator. Millikan must exclude this case from the Normal explanation. To do so, she has to say that S did not map to the predator in the right way—that is, that the token was not veridical.

  But that is exactly the distinction between correct and incorrect representation that the theory was supposed to naturalize.

  So the circularity can be reformulated as a dilemma:

  - If Normal conditions are specified purely statistically or causally, then the selection history may not fix a unique content: S is correlated with predators, predator cues, retinal stimulations, etc.
  - If Normal conditions are specified normatively—as the conditions under which the representation is *supposed* to map to the world—then the account presupposes the representational relation it is trying to explain.

  That, I think, is a cleaner and more pressing version of the worry.

  ---

  ### 5. Suggested revisions

  I would revise the draft in three ways.

  1. In the opening, avoid saying that correctness is just performing proper function. Say that correctness is correspondence to the Normal condition.

  2. In the circularity section, explicitly distinguish *causal correlation* from *correct correlation*. Otherwise the Millikan response is too easy.

  3. In the final paragraph, replace the claim that “tracking already presupposes correctness” with the dilemma above. For example:

     > Either the selected tracking relation is a purely causal/informational relation, in which case the account avoids circularity but faces content indeterminacy, or the relation is individuated in semantic terms as the condition that the representation is supposed to indicate, in which case the circle reappears in the Normal explanation.

  That framing is harder for Millikan to dismiss.

  ---

  Overall: the draft has the right shape, but the current version of the circularity objection leans too heavily on the word “tracking.” The stronger version is to go after the notion of Normal conditions or the individuation of the selected mapping relation. That is where the real action is.

  Let me know if you want help sharpening the revised argument further.
