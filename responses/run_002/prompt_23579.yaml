  More generally, you can pose a dilemma:

  - If "Normal conditions" are specified purely statistically/causally, then the selection history may not fix a unique content: S covaried with predators, predator cues, retinal stimulations, etc.
  - If "Normal conditions" are specified normatively as the conditions in which the representation is *supposed* to map to the world, then the account presupposes the representational relation it is trying to explain.

  That, I think, is a cleaner and more pressing version of the circularity worry.

