  - In the final paragraph, replace the claim "tracking presupposes correctness" with the dilemma above, or with an argument that the Normal explanation must be individuated by a prior veridicality relation.

  Overall: the objection as it stands is not as strong as you think because it leaves Millikan an easy naturalistic paraphrase of "tracking." But the underlying worry can be developed into a more difficult challenge if you aim it at Normal conditions and the individuation of the selected mapping.

