  Thanks for sharing. I think the draft is clear, but the circularity objection as it stands will not seriously worry a Millikan defender. The main reason is an ambiguity in "correct correlation" / "tracking." Let me separate the issues.

  **1. Clarifying Millikan**

  First, a small but important correction: Millikan does not say that a representation is correct iff it performs its proper function. On her view, a token is correct iff it corresponds to the condition that figures in the Normal explanation of the consumer's response. A token can be false yet still trigger behavior; a true token can fail to lead to success. This distinction matters because your circularity charge partly depends on sliding from "correct correlation" in the history to "correctness" as function performance.

