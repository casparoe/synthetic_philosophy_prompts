  You say: proper function is fixed by a history of correct correlation; correctness is defined as performing that function. Millikan will reply: the history is not a history of *correct* correlation; it is a history of *causal* correlation plus fitness consequences. The naturalistic paraphrase is:

  > Ancestors with S were more likely to have S caused by predators, and when S caused flight, they survived better. Therefore the S-flight system was selected.

  No semantic term appears in that paraphrase. "Correct" is introduced later as a normative status for current tokens relative to the historically selected relation.

  **3. Your final paragraph on "tracking"**

  This is the key step. I do not think it is sound as written. "Selection for tracking X" can be read in two ways:

  - *Semantic reading*: selection for correctly representing X. Then yes, the selection story presupposes content. But Millikan explicitly denies that she needs this reading.
  - *Causal/informational reading*: selection for S's being caused by X, or covarying with X, such that consumer behavior was adaptive in X circumstances. This uses no notion of correctness.

  If the causal/informational reading is available, the etiological grounding does break the circle. To make your argument work, you would need to show that the relevant notion of tracking cannot be naturalistically specified, or that the only way to pick out *which* tracking relation is content is already semantic. The draft doesn't yet do that.

