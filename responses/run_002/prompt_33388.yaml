  I'd use a small cash reward, a harmless but genuinely unpleasant drink, and a two-stage private written record. The unpleasant task should be something like a two-ounce cup of water with apple cider vinegar, lemon juice, and a little salt, prepared in front of the audience so they know it is safe. Before the rule is announced, I'd let everyone taste a drop, stressing that the full cup will be much worse but harmless. The reward would be a crisp five-dollar bill or a five-dollar bookstore voucher in a sealed envelope for each person. The timeline would run roughly like this: introduce the exercise, taste the liquid, explain the rules, open the claim table for about ten minutes, then send them off to browse or read for about twenty-five minutes, then open the drink station for seven minutes, and finally spend the rest of the evening in debrief. The gap matters because it separates the moment of intending from the moment of acting; if the act came immediately, they could just ride a burst of resolution.

  The rule should be stated slowly and repeated: you may take the five dollars if, at the moment you take it, you genuinely intend to drink the full cup at the appointed time. The five dollars is not for drinking; it is yours forever once you have formed the intention. You do not need to drink. If you do not drink, no one will ask for the money back, and you will not be criticized. You may not use external commitment devices: no public promises, no side bets, no asking a friend to force you, no writing a note to yourself framed as a contract. The reason for that prohibition is to preserve the original structure. If you can arrange to make later non-drinking costly, you've changed the puzzle into a different one.

  To claim the reward, a participant must do two things beyond merely taking the money. First, they sign a card saying "I intend to drink the full cup at the specified time." That card goes into a locked box. Second, they write on a separate slip, in private, a prediction: "Will you actually drink at the specified time? Yes or No, and how certain are you?" That slip goes into a numbered envelope and is sealed. The prediction is not a condition of payment and not a penalty; it is a diagnostic. The point is to create a moment of comparison between two different mental attitudes. An intention and a prediction are not the same thing. If someone writes "I intend to drink" but also "I will probably not drink," they are holding a pair of commitments that do not easily fit together. We open the envelopes later, not to check whether anyone deserves the money, but to make that conflict visible.

  At the appointed time I would open a semi-private drink station, perhaps behind a screen or just outside the main room during a break. I would explicitly say that no one is watching and the cups are unlabeled. The later behavior is not the point of the exercise; the point is the earlier attempt to form an intention. In fact I'd try not to make anyone feel that drinking proves anything. The original Kavka case turns on what happens before the poison would be swallowed, not on whether the person actually swallows.

  In the debrief I would begin by asking them to look at their own two slips and notice whether they matched. I might ask for a show of hands on a few questions: How many people took the money? How many people wrote "intend" but predicted they would not drink? How many people chose not to take the money because they couldn't honestly form the intention? How many people took it and felt the intention was real? I would not ask who drank, because that would make the later act too social and would miss the puzzle. Then I'd introduce Kavka's toxin case explicitly, and ask what the difference is between a million dollars tomorrow and five dollars in a bookstore. The central mapping is this: the reward gives you a reason to intend, but the fact that the reward is paid before the act means it gives you no reason to act. The live version may be easier than the original because the unpleasant act is so mild and because there are social reasons to follow through; but the moment at the claim table is the same.

  The distinction between intending, expecting, and wanting should be drawn carefully in the debrief. Wanting is a desire: you may want to drink the liquid to look tough, or want to take the money. Expecting is a prediction: you may expect that you will drink because you usually follow through, or expect you won't because it's unpleasant. Intending is more like a settled practical commitment: the question "shall I do it?" is no longer open in the way it was before. You can want something without intending it, and you can expect something without intending it. The toxin puzzle is precisely a case where the reasons point toward intending but away from acting, so the usual machinery of intention seems to seize up.

  Then I'd introduce the two-sided rationality point. From one angle, rationality seems to require you to be able to form the intention, because doing so earns you a million dollars. From another angle, rationality seems to forbid it, because you cannot rationally intend an action you know you will not perform, or an action you have no reason to perform when the time comes. This is the philosophical puzzle: whether rationality is essentially a matter of getting good outcomes, in which case you should somehow manage to intend; or whether rationality imposes internal consistency requirements on your beliefs and intentions, in which case you may be unable to intend and must leave the money on the table.

  Now, what will go wrong. The first time I ran this, the most likely confusion would be about what "genuine intention" means. People tend to use the word "intend" to mean "I want," "I hope," "I plan unless something changes," or "I am willing to tell you yes." So I'd need a plain-language warm-up before the offer: "If you are still asking yourself whether you will drink, you do not yet intend to drink. An intention is the state after the decision is made, not the state of deciding." I'd also expect several participants to reinterpret the task as "I'll take the five dollars and then just drink the liquid; problem solved." That is not a failure, because the live version is deliberately milder than the toxin. But it needs to be surfaced in the debrief: in the real case, the drink makes you ill for a whole day and the reward is already in your account, so you can't just "decide to be a good sport" once the time comes.

  Some people will try to game it. They will privately think "I'll take the money and not drink; I'll just say I intended." That's unavoidable, but the prediction card makes it slightly more difficult to do without noticing. If someone writes a clear prediction that they won't drink while signing a card that says they intend to drink, they are forced to confront the conflict. If they backdate a story later—"I really did intend then"—the debrief can ask whether a genuine intention can coexist with a confident belief that you will not act. Others will try to create external pressure by telling a friend to hold them to it. I would explicitly rule that out before the claim table opens and watch for it; the prohibition matters because a side commitment gives you a reason to drink later, which dissolves the puzzle. If someone does it anyway, I'd treat it as an interesting violation and ask why the puzzle seemed easier once they added a social penalty.

  Another predictable problem is that the reward may not feel real. A five-dollar bill in an envelope is small, but it is enough if the opening is playful and not cheap. If I used a voucher, some people might not care; actual cash has a more universal feel. I would not make the stakes larger than about five or ten dollars, because the point is not to distress anyone but to make the mental state worth caring about. Too large a payment might create anxiety or make people feel they are being bribed. Too small a payment and they may shrug and not bother with the exercise.

  The live activity cannot reproduce one essential feature of Kavka's original: the genuine absence of later reasons to drink. In the original, by the time the toxin is in front of you, you are already rich and the drink only makes you ill for a day; there is no reward for drinking and no one to impress. In a public ideas evening, even if the drink station is private and unlabeled, there are still reasons to drink: curiosity, social consistency, the desire to be a good participant, the fact that you made a written card, and the fact that the group is discussing the puzzle afterward. Those are not present in the original. This means the live version may produce more drinking and more confidence than the real toxin puzzle would. I would flag this in the debrief and ask the audience to imagine the act as something that has zero social or self-image benefit, then ask if their feeling at the claim table would change.

  The part I am least confident about is the two-part written verification—the intention card plus the sealed prediction. I am not sure it actually verifies intention rather than just measuring whether people are willing to make inconsistent statements under small pressure. It may feel bureaucratic and pull people out of the introspective moment. A trial run could tell me this. If participants report that they wrote the intention card simply to get the money and paid little attention to the prediction, or if the prediction cards do not produce useful tension in the debrief, I would abandon that mechanism. I would also abandon it if people find it too cumbersome or if the sealed envelopes feel like a trick. In that case I would simplify: place the money on the table, ask each person to sit with the offer for ninety seconds, and then either take the money or leave it, with no written records. Then the debrief would rely on their own reports of what happened inside. The weaker verification is a cost, but if the stronger attempt distracts from the experience it is not worth it. The best sign from a trial run would be a substantial minority—maybe a third or more—reporting that they experienced a genuine bind: they wanted the money, they tried to form the intention, and they found they couldn't honestly do it. If almost everyone immediately reports a clean intention, or almost everyone ignores the conflict, I would know the design still needs sharpening.

