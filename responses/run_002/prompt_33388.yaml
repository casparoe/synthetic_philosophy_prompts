  I’d run it as a compressed live version, using a bad-tasting but harmless drink as the “toxin,” a five-dollar bill as the reward, and a forty-five-minute gap between the intention and the act. Before the offer is made, I’d prepare the drink in front of the audience from ordinary food ingredients—water, apple cider vinegar, lemon juice, a pinch of salt—so nobody worries that it is anything dangerous. The point is that it should be genuinely unpleasant to swallow but have no lasting effects. I’d let everyone taste a drop beforehand, because the puzzle requires them to know exactly what they are being asked to intend. I’d also have plain water nearby for rinsing, and I’d tell anyone with a health condition or strong aversion that they can either opt out or use a parallel unpleasant task, such as holding an ice cube in their palm for two minutes. The stakes should be actual cash, not a voucher, because cash feels more real. Five dollars is enough to care about without making anyone anxious.

  The rule would be stated slowly and repeated: you may take the five dollars if, at the moment you take it, you genuinely intend to drink the full cup at the appointed time. The five dollars is not for drinking. It is yours once you have formed the intention. You do not have to drink to keep it. If you do not drink, nobody will ask for the money back, and nobody will scold you. You are also not allowed to use external commitment devices: no public promises, no side bets, no asking a friend to hold you to it, no writing a note to yourself as a contract. That prohibition matters because a side commitment would give you a reason to drink later, which dissolves the original puzzle.

  To claim the reward, a person would have to do two written things beyond simply taking the money. First, they would sign a private card saying, “I intend to drink the full cup at the specified time.” That card would go into a locked box. Second, they would write on a separate slip a prediction: “Will you actually drink at the specified time? Yes or No, and how certain are you as a percentage?” That slip would go into a sealed envelope. The prediction is not a condition of payment and not a penalty. It is a diagnostic, a way of catching the gap between intending and expecting. If someone writes “I intend to drink” but also predicts “I will probably not drink,” they are holding two attitudes that do not easily fit together. The cards would be anonymous—numbered rather than named—so the written record does not become social pressure. That is as close as I can get to verifying intention without relying on self-report alone: the intention card is still a self-report, but the prediction card asks a different question, and the later behavior gives us a third point of comparison. It is not a lie detector, but it forces a moment of internal conflict that a single question would miss.

  The timing would run roughly like this. After the rules are explained, I’d open a claim table for about ten minutes. Then the group would spend about twenty-five minutes doing something quiet and unrelated—browsing the bookstore or reading a short excerpt—so the moment of intending is separated from the moment of acting. At the appointed time I’d open a semi-private drink station, perhaps behind a screen or just outside the room during a break. I’d say explicitly that no one is watching and that the cups are unlabeled. Drinking at that point proves nothing; the puzzle is about the earlier attempt to form the intention. After seven minutes or so, I’d close the drink station and start the debrief.

  In the debrief I would first ask people to open their prediction envelopes and look at what they wrote. I might ask for a show of hands on a few questions: How many took the money? How many wrote “I intend” but predicted they would not drink? How many chose not to take the money because they could not honestly form the intention? How many took it and felt the intention was real? I would not ask who actually drank, because that would turn the later act into a public performance and would miss the point. The real action is at the claim table.

  Then I’d introduce Kavka’s toxin puzzle explicitly. I’d map the live version onto the original: the five dollars is the million, the bad drink is the toxin, and the forty-five-minute gap is the night between midnight and tomorrow afternoon. The reward gives you a reason to intend, but because it is paid before the act, it gives you no reason to act. The live version is easier than the original because the unpleasant act is mild and because there are social reasons to follow through, but the bind is the same: you want the money, you have every reason to intend, and yet you also know that once the money is in your pocket, the only thing left at the appointed time is a bad-tasting drink and no reward for drinking it.

  The debrief should also separate intending from expecting and wanting. Wanting is desire: you may want the money, or want to be the kind of person who follows through. Expecting is prediction: you may expect that you will drink because you usually keep commitments, or expect that you won’t because you dislike sour drinks. Intending is more like settled commitment: the question “shall I do it?” is no longer open in the way it was before. The toxin puzzle is a case where the reasons point toward intending but away from acting, so the standard machinery of intention seizes up. You can want to intend, you can want the money, and you can know that intending would get the money, but you may still find that you cannot genuinely settle on the act.

  Then the philosophical question can be stated plainly. From one angle, rationality seems to require you to be able to form the intention, because doing so makes you better off. From another angle, rationality seems to forbid it, because you cannot rationally intend an action you know you will not perform, or an action you have no reason to perform when the time comes. The live event can then ask whether rationality is mostly about getting good results or mostly about internal consistency. Both answers are tempting, and the audience will have just felt the tug between them.

  The first time this runs, the most predictable confusion will be about what “genuine intention” means. People use the word “intend” loosely. They say “I intend to exercise” when they mean they want to, or they say “I intend to come” when they mean they will try. So I’d need a warm-up example before the offer. I might say: if you are still asking yourself whether you will drink, you do not yet intend to drink. An intention is the state after the decision is made, not the state of deciding. That distinction is the entire engine of the puzzle.

  Another predictable problem is that some participants will treat the game as a willpower challenge and simply say, “I’ll take the five dollars and then just drink the liquid.” That is not a failure, because in the live version the act is mild enough that they can plausibly decide to do it. But it needs to be surfaced in the debrief. In Kavka’s original, the drink makes you violently ill for a day and the reward is already in your account, so you cannot just decide to be a good sport once the time comes. The live version gives people extra reasons to drink, and they should be told that this difference is not a defect so much as a reminder of how unusual the original case is.

  Some people will try to game it. They will privately think, “I’ll say I intend, take the money, and not drink.” The prediction card makes that harder to do without noticing, because it asks them to predict their own future behavior. If they write “I intend to drink” and “I predict I won’t drink,” the conflict is on paper. If they write “I predict I will drink” but are lying to themselves, the later behavior may still be revealing. Others will try to create external pressure by telling a friend to hold them to it. I’d rule that out in advance and watch for it. If someone does it anyway, I’d treat it as an interesting violation and ask why the puzzle became easier once they added a social penalty. That question is itself a philosophical debrief point.

  A practical problem is that the five-dollar reward might not feel real, or the drink might not be unpleasant enough. I’d use actual cash, not a voucher, and I’d test the drink’s awfulness beforehand. If more than half the audience says they would drink it for free, the task is too easy. If several people refuse even a drop, it is too aversive. The goal is a liquid that produces a brief “ugh” but no dread. The social setting will still make some people drink, and that is fine, but the claim-table moment should feel like a genuine choice.

  The live activity cannot reproduce one essential feature of Kavka’s original: the genuine absence of later reasons to drink. In the original, once you have the million dollars, drinking the toxin only makes you ill. There is no one to impress, no residual social commitment, no curiosity about the taste. In a public ideas evening, even a semi-private drink station creates social and self-image reasons that the original lacks. Some people will drink because they signed a card, because they dislike inconsistency, because they are curious, or because they want to be a good participant. Those reasons are real, and they change the structure. I’d have to supply that missing feature in the debrief by asking the audience to imagine the act as something that has no social or identity payoff at all: just nausea tomorrow and no one watching.

  The part of the design I am least confident about is the two-part written verification, the intention card plus the sealed prediction. I am not sure it actually verifies intention rather than simply measuring whether people are willing to make inconsistent statements under mild pressure. It may feel bureaucratic, and it may pull people out of the introspective moment. A trial run would tell me what I need to know. If participants report that they just wrote whatever they needed to get the money and barely thought about the prediction, or if the prediction cards do not produce useful tension in discussion, I would abandon that mechanism. I would also abandon it if the envelopes feel like a trick or if people become more interested in covering their own consistency than in feeling the puzzle. In that case I would simplify: put the money on a table, ask each person to sit with the offer for ninety seconds, and then either take the money or leave it, with no written records. The debrief would rely more on their own reports. The weaker verification is a cost, but if the stronger attempt distracts from the experience, it is not worth it. The best sign from a trial run would be a substantial minority—maybe a third or more—reporting that they wanted the money, tried to form the intention, and found they could not honestly do it. If almost everyone immediately reports a clean intention, or if almost everyone shrugs off the conflict, I’d know the design still needs sharpening.
