  Detailed design:

  "Call it the Bad-Drink Intention Game." We set up before people arrive: a small drink station at the back or just outside. We prepare an unpleasant but safe liquid. I'd make it of water, lemon juice, apple cider vinegar, and a little salt; each cup can be two ounces. We place out cups, napkins, a pitcher of plain water, maybe a sign with "Drink Station." Also a "claim table" with envelopes containing $5 bill or bookstore gift certificate, plus a blank index card. Each participant receives a numbered envelope, a card that says "I intend to drink the full cup at 8:25," and a separate prediction slip.

  I'd tell them: "This is an exercise in future decision making. You will not be tricked into drinking anything unsafe. You can taste a drop now. The liquid is deliberately unpleasant but harmless. In a few minutes, you may go to the claim table. There is a $5 bill waiting for you. The condition is not that you drink the liquid later; the condition is that, when you take the money, you genuinely intend to drink the full cup at 8:25. The moment you form that intention, the money is yours. If at 8:25 you decide not to drink, you keep the money. No one will ask you to return it. You are forbidden to use external commitment devices: no asking someone to hold you to it, no writing a public promise, no side bets. The only thing that gets you the money is the private mental fact of intending. You may also choose not to take the money; that is a perfectly good outcome."

