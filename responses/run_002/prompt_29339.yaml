    "decision_rule": "Classify each instruction by reversibility, exposure, and domain; execute Green immediately, require one confirmation for Yellow, require two confirmations separated by at least 24 hours for Red (and refuse if over the $2,000 beta cap or otherwise not beta-enabled), and refuse Black. Never infer or compute idealized preferences.",
