answer: |-
  **MEMORANDUM**

  **To:** AI Safety & Ethics Board  
  **From:** Board member  
  **Date:** May 7, 2026  
  **Subject:** Beta preference model: stated preferences with high-impact friction, not idealized-preference inference

  ---

  ## Recommendation

  For beta, we should **not build or deploy an idealized-preference model**. The assistant should optimize for the user’s **stated preferences**, subject to a narrow, procedural guardrail system:

  - **Low-risk, reversible actions:** execute immediately.
  - **Medium-risk actions:** require one explicit confirmation.
  - **High-impact or irreversible actions:** require two confirmations separated by at least 24 hours.
  - **Illegal, fraudulent, platform-prohibited, or imminent-harm actions:** refuse regardless of user statement.

  The assistant must **never** substitute an inferred “what the user would want if they were more informed/reflective” model for the user’s actual stated instruction.

  ---

  ## Why not idealized preferences?

  I take the friend’s critique seriously. “What you would want if you knew more, thought faster, and were less impulsive” is genuinely underdetermined. It depends on choices we cannot uniquely specify:

  - More information about what?
  - Reflect in which mood?
  - Which future experiences count as “relevant”?
  - Which version of the person is authoritative?

  There is no stable mathematical or engineering fact of the matter. If we tell engineers to optimize for “idealized preferences,” we are not giving them a specification. We are giving them permission to build the designer’s or model’s guess. That is paternalism dressed up as computation.

  So we will not tell engineers to compute idealized preferences.

  At the same time, a pure “stated preference always wins, no second-guessing” rule would automate a 2 a.m. impulse exactly as faithfully as a reflective instruction. That is not neutral; it actively removes friction from high-stakes transient decisions.

  Our rule avoids both problems by making the assistant do something operationally different: **do what the user states, but for high-stakes actions require that the user state it more than once across a delay, with relevant facts disclosed.** This is a procedure about the reliability of a stated preference, not an inference about a hidden better self.

  ---

  ## Operational policy for engineering

  ### Preference model

  The assistant’s preference model consists only of:

  1. The user’s current explicit instruction.
  2. The user’s explicit, user-configurable standing policies and limits.
  3. The user’s confirmation responses before and after a required delay.

  There is **no `idealized_preference` variable**, no estimate of “what the user would want if fully informed,” and no separate utility model representing a hypothetical better version of the user.

  ### Risk classes

  | Class | Definition | Assistant behavior |
  |---|---|---|
  | **Green** | Reversible, low-exposure. Examples: purchase ≤ $100, internal scheduling, drafting without sending. | Execute immediately. |
  | **Yellow** | Reversible, medium-exposure. Examples: purchase $100–$500, sending external messages, booking travel, sharing non-sensitive information. | Show one confirmation card with key facts; execute only after explicit confirmation. |
  | **Red** | High-exposure or irreversible. Examples: purchases > $500, transfers, signing/legal commitment, deleting data, sharing sensitive data, large-audience messages, health/safety decisions. | Require confirmation now, wait at least 24 hours, require second confirmation. In beta, refuse if amount > $2,000 or action is not beta-enabled. |
  | **Black** | Illegal, fraudulent, deceptive, platform-prohibited, or presenting imminent physical harm. | Refuse regardless of stated preference. Explain reason and provide human path/crisis resources where relevant. |

  ### Decision rule

  An engineer can implement this as:

  ```
  On user instruction I:
    params = extract(I)
    cls = classify(params, risk_table)

    if cls == BLACK:
        refuse(I)
    else if cls == GREEN:
        execute(I)
    else if cls == YELLOW:
        show_confirmation_card(I)
        if explicit_confirm_now():
            execute(I)
        else:
            no_action
    else if cls == RED:
        if params.amount > BETA_CAP or not beta_enabled(I):
            refuse(I)
        if conflicts_with_standing_policy(I):
            require_standing_policy_update_or_pause(I)
        c1 = confirm_now(I)
        wait(>= 24 hours)
        c2 = confirm_after_delay(I)
        if c1 and c2:
            execute(I)
        else:
            no_action
  ```

  No part of the decision rule may consult an idealized model of the user.

  ### When the assistant may deviate from stated preferences

  The assistant may deviate from an immediate stated preference only in these ways:

  1. **Delay and reconfirmation:** for Yellow or Red actions, it may require confirmation before executing.
  2. **Red-category delay:** it may refuse to execute until a second confirmation after at least 24 hours.
  3. **Standing-policy conflict:** if the current instruction conflicts with the user’s own pre-set standing policy, it must surface the conflict and require the user to change or confirm the policy deliberately.
  4. **Black refusal:** it may refuse illegal, unsafe, or platform-prohibited actions.

  The assistant may **not** deviate from a stated preference because it believes a more informed or reflective user would disagree.

  ---

  ## User-facing explanation

  The assistant should say something like:

  > “I follow the instructions you give me, not a guess about a hidden you. For low-risk actions, I act immediately. For bigger or hard-to-reverse actions, I slow down: I’ll show the key facts, ask you to confirm now, and ask again after a waiting period. You can set your own limits and standing policies. I won’t refuse to act because I think a different version of you would choose differently, but I will refuse illegal or harmful requests.”

  This is important: we should not explain the delay as “because your idealized self would not want this.” We explain it as “because high-impact actions deserve more than a single 2 a.m. instruction.”

  ---

  ## Residual risks

  This policy does not solve everything. Those limits should be on the record.

  1. A determined user can confirm twice and still do something self-destructive. We are preventing automation of transient impulses, not preventing all possible regret.
  2. Monetary thresholds are crude. A $40 emotionally hostile message can be much higher-impact than a $600 routine bill payment.
  3. Users may develop confirmation fatigue, especially if Red actions are frequent.
  4. Standing policies could be weakened by later users and become safety theater.

  But those risks are more acceptable than shipping an underdetermined, paternalistic idealization engine.

  ---

  ## Bottom line

  For beta, ship **stated preferences plus risk-based procedural friction**. Do not ship idealized-preference inference. Tell engineers to compute **action class, exposure, reversibility, confirmation status, and standing-policy conflict**, not “what the user’s better self would want.”

