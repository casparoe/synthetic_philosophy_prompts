answer: |-
  A good non–sea battle example is:

  > **“Amara will go for a run tomorrow morning.”**

  Suppose Amara is a committed runner, has no injury, has planned to run, and has just told you she will run tomorrow. In ordinary life, we would normally say:

  > “It’s true that Amara will run tomorrow.”

  But notice what kind of statement this is. It is a **future contingent**: Amara’s running tomorrow is not yet settled in any strong sense. She could change her mind, get injured, be called into work, or be stopped by something else. Nothing about the present state of the world makes it *inevitable* that she will run. The event is still open.

  So here is the tension:

  - On the one hand, it seems true today that Amara will run tomorrow.
  - On the other hand, it is a genuine future contingent, so the event is not determined yet.

  This is exactly the kind of case that creates a problem for the idea that future contingent statements simply **lack a truth value** until the event happens.

  If “Amara will run tomorrow” is already true today, then by the same kind of reasoning Aristotle uses in the sea battle argument, tomorrow’s event seems to be fixed. For if it is true today that she will run, then there is no possible future in which she does not run—otherwise the statement would have been false today. So her running starts to look necessary, even though we said the future was open.

  To avoid that conclusion, the truth-value gap view says:

  > “Amara will run tomorrow” is neither true nor false right now. It will become true or false only when tomorrow comes and she either runs or doesn’t.

  But now the problem is obvious. That view forces us to say something very strange about an ordinary statement. We would have to say that, despite all our evidence, despite her plans and habits and promises, it is not yet true that she will run tomorrow. It is neither true nor false. That seems to conflict with how we actually speak and reason. We treat well-grounded predictions, promises, and plans as true or false now. We rely on them in practical reasoning.

  So the scope of Aristotle’s move is much wider than it first looks. It is not just about sea battles. It applies to every genuinely open future event, including mundane ones. And that means the truth-value gap view has a high cost: it preserves the openness of the future, but only by saying that a huge range of ordinary statements—statements we normally call true or false—are actually neither.

  There is also a retrospective puzzle. After Amara runs tomorrow, we will naturally say:

  > “It was true yesterday that Amara would run today.”

  But if the statement had no truth value yesterday, how could it have been true yesterday? The gap view seems to imply that the statement *becomes* true later, which is itself a strange way to think about truth.

  So a case like “Amara will go for a run tomorrow” shows the problem vividly: either we say it is already true, and then the future looks fixed; or we say it lacks truth value, and then we have to deny that ordinary, well-supported future statements are true. That is the philosophical cost of the truth-value gap solution.
