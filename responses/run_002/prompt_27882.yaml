answer: |-
  You have a coherent position. It’s just not a single property of “unrealistic assumptions.” It’s a principle about **what role the false assumption plays** and **what kind of claim the model is being used to make**.

  Call it the **load-bearing/export principle**:

  > An unrealistic assumption is acceptable if either  
  > (a) it is not load-bearing for the conclusion you are drawing, or  
  > (b) the model is explicitly a benchmark, null model, toy, or pedagogical device, not a direct representation of the world, or  
  > (c) it is load-bearing but forced by computational/data limitations, and the model is calibrated, validated, and its uncertainty is taken seriously.  
  >  
  > It is not acceptable if  
  > (d) the false assumption is doing the central causal or explanatory work, and the model is exported as a positive claim about the world or as a policy tool without independent warrant or honest uncertainty.

  That principle explains most of your verdicts.

  ### Your cases under that principle

  | Case | Why you’re fine with it |
  |---|---|
  | Ideal gas law | Idealization with a known regime of validity; relaxing it gives better approximations. Not a claim that gases literally have zero-volume particles. |
  | Frictionless planes | Pedagogical scaffold. No one exports it. |
  | Modigliani-Miller | Fine as a benchmark: “if markets were perfect, capital structure wouldn’t matter.” It identifies which frictions matter. |
  | Hardy-Weinberg | Null model. You use it to detect departures, not describe real populations. |
  | Black-Scholes | Fine as a starting point. The model becomes dangerous when traders treat it as a literal description of markets. |
  | Friedman’s billiard player | As-if shorthand for a real process: repeated feedback, stable physics, learning, selection. You can test the predictions independently. |
  | Climate parameterizations | Forced approximation: you can’t resolve clouds at grid scale. It is load-bearing, but the models are calibrated, evaluated, and uncertainty is increasingly quantified. |
  | Strong-form EMH | Fine only as a toy. The damage came from treating it as a substantive claim about actual markets. |

  That gives you a principled reason to be fine with Modigliani-Miller but not strong-form EMH: **they share DNA, but they did not have the same role in use.** M&M has mostly functioned as a benchmark; strong-form EMH was often promoted as if it described real markets.

  ### Rational expectations vs. Friedman’s billiard player

  The apparent inconsistency is not real, or at least it is not forced on you.

  Friedman’s billiard player is an as-if model of a behavior that can plausibly be approximated by learning and selection. A skilled player gets repeated feedback, has a clear objective, and operates in a stable physical environment. The assumption “they act as if they solve the optimal trajectory” is a compressed empirical regularity. It does not require the player to know the true model; it just says their behavior can be approximated that way.

  Rational expectations is different: it assumes agents know the true model of the entire economy, including others’ expectations. That is not a shortcut for a real learning process. It is an equilibrium assumption that removes the very phenomena—heterogeneous beliefs, coordination failures, systematic expectation errors—that macro policy often cares about. Worse, the results often depend exactly on that assumption. Policy neutrality, efficiency, and uniqueness results can flip when you relax it.

  So your rule can be:

  > As-if assumptions are fine when they compress a real process that can plausibly produce the behavior. They are not fine when they stipulate away the central problem and drive the result.

  That preserves your Friedman verdict and your rational expectations verdict.

  ### Climate models vs. rational expectations

  The reason you give climate models a pass is not just sympathy. It is that cloud parameterizations fall under condition (c): **forced approximation with calibration and uncertainty**. Modelers are not claiming clouds are simple; they are saying, “We cannot resolve clouds, so we use a rough representation and try to quantify how much that matters.”

  Rational expectations, by contrast, is not forced. There are alternatives: learning, bounded rationality, heterogeneous expectations. And in many macro models, it is treated as a substantive description of expectation formation, not as a transparent uncertainty source.

  So your climate pass is coherent, but it is conditional. If a climate model used a cloud parameterization as an untested theoretical choice and hid the uncertainty, it would deserve exactly the criticism you give rational expectations.

  ### The case you didn’t list: identical-rule ABMs in epidemiology

  Under this principle, the answer is:

  - As a **toy model or null baseline**, identical simple interaction rules are fine.
  - As a **policy-facing model**, they are suspicious unless heterogeneity is shown not to matter or the model is calibrated and uncertainty is honestly represented.

  In real epidemics, heterogeneity in contact rates, age, susceptibility, compliance, and superspreading is often exactly what drives the dynamics. If an agent-based model assumes every individual follows identical simple rules, that assumption is likely load-bearing and likely false in a dangerous way. Since agent-based models are supposed to capture heterogeneity, assuming it away is like using an ideal-gas model for a non-ideal gas and then issuing policy advice.

  So the principle would say: **identical-rule ABMs are fine as toys, but not as direct policy models unless you can show the homogeneity does not drive the conclusions.**

  ### What this forces you to revise

  Not much. But it forces you to restate some verdicts:

  1. **Rational expectations**: revise from “not okay” to “not okay when used as a positive description or policy model; fine as a consistency benchmark.”  
  2. **Strong-form EMH**: revise from “not fine except as a toy” to “fine as a toy; the damage came from treating it as a direct claim about markets.”  
  3. **Climate models**: make your pass conditional on calibration, validation, and uncertainty quantification.  
  4. **M&M**: your annoyance at loose policy citations is exactly the principle. The violation is not the model; it is exporting a benchmark into the world without checking the assumptions.

  Your implicit rule is basically this: **false assumptions are fine when they are scaffolding; they are not fine when they are the engine of the result and you sell the output as a map of the world.**
