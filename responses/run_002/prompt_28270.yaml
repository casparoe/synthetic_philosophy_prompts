  The step to reject is (4), because it conflates two senses of "could not have done otherwise".

  (1) and (2) look plausible because meaning is indeed constituted by projects. But (2) contains an ambiguity: "facts never force a choice" can mean "facts do not determine my fundamental project" or "facts do not constrain my options once I have a project." Sartre accepts first, denies second. A locked door only matters if I want to leave; but if I do want to leave, the locked door really is a constraint. So facts do not inject their own meaning; they do supply "coefficient of adversity" within projects.

