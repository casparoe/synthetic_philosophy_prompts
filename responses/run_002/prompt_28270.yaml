  Then (4) is false if unqualified. "I couldn't have done otherwise because of circumstances" is often true practically: the door was locked, the threat was credible, the money was not there. Acknowledging that is not bad faith; it is recognising facticity. It becomes bad faith only when it slides into "therefore I had no freedom at all, no responsibility for what I made of it." E.g. "I cannot leave" true; "I cannot decide what this captivity means" false. "I had no real choice" can mean "no acceptable practical alternative" or "no responsibility"; only second is Sartrean bad faith.

