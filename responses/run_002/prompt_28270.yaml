answer: |-
  The step to reject is **(4)**, or at least its unqualified form. The slide from Sartre’s real position to the absurd conclusion happens because (4) conflates two different senses of “I couldn’t have done otherwise.”

  Premises (1) and (2) look fine because Sartre does think meaning is constituted by our projects. A cliff is only an obstacle if I want to climb; a locked door is only a limit if I want to leave. But (2) contains a dangerous ambiguity. “Facts never force a choice” can mean:

  - (a) facts do not determine my fundamental project or the meaning I give them; or  
  - (b) facts do not constrain my options once I have adopted a project.

  Sartre accepts (a), but he does not accept (b). A locked door only matters to me if I want to leave, but if I do want to leave, the locked door really is a constraint. It does not dictate my fundamental choice, but it does limit my practical options. Sartre calls this the “coefficient of adversity” of things: the world pushes back.

  So the way to keep (3) is to read it as a claim about **ontological freedom**, not practical freedom. Sartre’s “total freedom” is not total power. It is the claim that consciousness is always able to take up a position on its situation, to give it meaning, to choose an attitude or project. The prisoner cannot walk through the wall, but she can choose what captivity means for her: resistance, despair, study, prayer, planning escape. The addict may lack the practical ability to stop unaided, but can still choose how to relate to the addiction: seek help, treat it as illness, treat it as identity, hide it, accept it. The person in an abusive relationship may have appallingly constrained options, but still chooses what to make of the situation: comply strategically, seek outside help, resist internally, redefine what survival means. In all three cases, freedom is real, but it is not equal practical power.

  That is why (4) is the overreach. “I couldn’t have done otherwise because of my circumstances” is often true at the practical level. The door was locked. The threat was credible. The money was not there. Saying so is not automatically bad faith; it is simply recognising facticity. It becomes bad faith only when it is used to deny one’s remaining ontological freedom: “I am a prisoner, therefore I cannot choose how to live this imprisonment”; “I am addicted, therefore I have no responsibility for what I make of my condition”; “I am abused, therefore my whole being is defined by the abuser.” That is the Sartrean lie to oneself.

  So (5) does not follow. Coercion, poverty, addiction and locked cells count for a great deal. They are part of facticity: the brute givens of my situation. They shape what actions are possible, what options exist, and what costs I will pay. What they do not do is cancel my freedom to give them meaning. “I had no real choice” can be a perfectly true practical statement meaning “no acceptable or safe practical alternative was available.” It is only in bad faith when it means “therefore I had no freedom or responsibility at all.”

  Rejecting (4) costs you the neat slogan that every appeal to circumstances is an excuse. You have to accept a two-level picture: practical freedom can be severely limited while ontological freedom remains intact. That means someone can be both a victim of real constraints and still responsible for what she makes of those constraints. That is uncomfortable, but it is the only reading that keeps (3) without collapsing into the absurdity in (5).

  If you prefer to locate the error in (2) instead, the cost is similar: you must admit that facts do constrain us, though only relative to our chosen projects. Either way, the key distinction is the same: **Sartrean freedom is total responsibility, not total power.**
