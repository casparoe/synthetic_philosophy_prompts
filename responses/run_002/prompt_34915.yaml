answer: |-
  ## 1. The phenomenon restated

  Each actor makes a locally rational move under the present competitive state. That move changes the state, which shifts what will be locally rational next. The collective outcome is a self-sustaining drift into a game none of them chose—without a fixed bad endpoint, without a stable cooperative baseline, and without a clear act of defection.

  ## 2. The nearest established concepts

  - **Race to the bottom**: competitors lower the same variable—prices, wages, standards—and converge on a bad value of that variable.
  - **Arms race**: each side builds or deploys capabilities because the other side’s current capabilities make that rational; each move changes the threat environment and provokes the next.
  - **Red Queen effect**: actors must keep adapting merely to maintain relative position, because competitors’ adaptations continually change the environment.
  - **Tragedy of the commons**: individually rational use of a shared resource depletes that resource to the collective harm of all.
  - **Security dilemma**: one actor’s defensive moves appear threatening to others, prompting responses that increase insecurity.
  - **Escalation spiral / positive feedback**: mutually amplifying actions shift thresholds or baselines over time.
  - **Ratchet effect**: a standard or expectation moves in one direction and does not return.
  - **Path dependence / lock-in**: early choices reshape later options, excluding alternatives.

  The closest candidates are a generalized arms race and Red Queen dynamics.

  ## 3. Where each fits and where it misses

  **Race to the bottom**  
  Fits: local rationality, competitive pressure, collectively bad outcome.  
  Misses: it assumes a single fixed variable and a fixed bad equilibrium. Your pattern has a moving baseline and a transformed game, not a worse value of one quantity.

  **Arms race**  
  Fits: iterative response to the rival’s current state, each move changing what will be rational next, no fixed bottom, no necessary defection. This is the closest.  
  Misses: it is usually understood as two identifiable rivals accumulating a specific capability or stock; it does not always foreground changed norms, publication bars, or other game-shifting baselines.

  **Red Queen effect**  
  Fits: self-sustaining environmental change caused by competitors, no fixed endpoint, no cheating.  
  Misses: it is often neutral or evolutionary, emphasizing running to stay in the same place. It does not necessarily capture the normative harm of a new game no one chose.

  **Tragedy of the commons**  
  Fits: individually rational acts producing collective harm.  
  Misses: it depends on a fixed common-pool resource and a depletion dynamic. The harm is a worse value of a stock, not a shift in the game itself.

  **Security dilemma**  
  Fits: local rationality and unintended escalation through a changed threat environment.  
  Misses: it is specific to security, mistrust, and interstate or intergroup interaction; it does not generalize to publication norms or other non-security domains.

  **Escalation spiral / positive feedback**  
  Fits: self-reinforcing movement and shifting thresholds.  
  Misses: too generic. It lacks the competitive structure and game-changing harm you describe.

  **Ratchet effect / path dependence**  
  Fits: moving baselines and irreversibility.  
  Misses: these are not essentially competitive or strategic. They can arise from institutional inertia, historical accident, or nonstrategic processes.

  ## 4. Verdict on a name

  No widely established term exactly names this configuration. The closest is a generalized **arms race**, with **Red Queen dynamics** second. But neither alone captures the combination of endogenous equilibrium shift, absence of a fixed variable, and transformation of the game. Only a modified term fits: I would call it an **endogenous escalation race** or **moving-baseline race**.

  ## 5. Definition and boundary cases

  An **endogenous escalation race** is a competitive process in which:  
  1. each actor chooses the locally rational response to the current state;  
  2. those choices alter the state that later responses must take into account;  
  3. the alteration is self-reinforcing; and  
  4. the collective harm is not convergence to a fixed bad value but a shift into a game or baseline no actor initially chose.

  **Inside cases**  
  - **AI publication culture**: each lab publishes quickly because the current prestige and talent market make that rational. Publishing then raises the bar for what counts as worth publishing, changing the culture.  
  - **Military procurement**: one side fields a system because the other side’s current systems make that rational. Deployment changes the threat environment, making the next upgrade rational, and the accepted level of risk ratchets upward.

  **Near-miss cases outside**  
  - **Corporate tax race to the bottom**: jurisdictions lower a single variable—tax rates—toward a foreseeable low equilibrium. The game structure remains the same, and the harm is a worse value of one variable.  
  - **Standard overfishing tragedy**: fishers rationally increase catch, depleting a fixed resource. The harm is a lower fish stock, not a redefinition of the game itself. If it began transforming norms or technologies so that the baseline itself shifted, it could cross into the category.
