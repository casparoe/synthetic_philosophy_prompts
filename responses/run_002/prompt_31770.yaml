answer: |-
  Use a human example, but not the second-person “you” until the distinction has been locked in. Use “Alex.”

  ## The single worked example

  Actual Alex came from egg E1 and sperm S1. In the counterfactual we care about, E1 was not fertilized by S1. Instead, a different egg E2 was fertilized by a different sperm S2. The resulting child is raised by the same adults in the same way, given the same name, and is stipulated to be qualitatively indistinguishable from actual Alex: same appearance, same mannerisms, same friend group, same grades, same everything observable.  

  The question to put to the room: **Is this counterfactual child Alex—the very same individual—or is it a different person who is exactly like Alex?**

  ### What the example must have

  - Named actual gametes: E1 and S1.
  - Named different counterfactual gametes: E2 and S2.
  - The same upbringing and social circumstances in both cases.
  - Explicit qualitative indistinguishability.
  - A clear question about *numerical identity*, not about resemblance.
  - A stipulation that the counterfactual child is raised by the same adults, not “different parents.”

  ### What the example must lack

  - No talk of “different parents” as the central setup.
  - No reliance on the idea that different DNA would produce different traits.
  - No appeal to souls, religion, or moral consequences.
  - No time-travel or changing-the-past framing.
  - No formal possible-worlds vocabulary.

  This example carries the session because it isolates the exact variable at issue: the gametes. Everything else is held fixed. If students still say “yes, that’s Alex,” their reason will usually be “because he is exactly like Alex” or “because he has the same life.” That lets you target the qualitative/numerical distinction. If they say “no,” you can probe whether they are really tracking origin or just assuming hidden genetic differences.

  ## Why not start with “you could have been born to different parents”

  Do not lean on that sentence. It contains the confusion already.

  “Different parents” can mean two very different things:

  1. Different people who raised you—same zygote, different later circumstances.
  2. Different people whose gametes made you—different origin.

  Most students hear the first reading. They imagine being adopted or switched at birth, say “yes, obviously,” and then spend the rest of the session defending a claim about upbringing rather than origin. That is exactly the wrong terrain. So for the first half of the session, ban the phrase “different parents.” Say “different gametes” or “different starting material” instead.

  ## Sequence of the session

  ### 1. Opening diagnostic (0–5 minutes)

  Ask:

  - “Could you have had a different haircut?”
  - “Could you have lived in a different city?”
  - “Could you have been raised by different people?”

  Then ask:

  - “Could you have come from a different sperm and a different egg than the ones that actually made you?”

  Do not answer the last question. Write it on the board and leave it open.

  ### 2. First distinction: upbringing vs origin (5–9 minutes)

  Say something like:

  > “We need to separate two things. One question is whether the same organism could have had a different later life. Another question is whether a different starting organism could have had the same later life.”

  Use an acorn example on the board:

  - Same acorn, different soil → same tree, different upbringing.
  - Different acorn, same soil → different tree, same later circumstances.

  Tell them:

  > “Today we are only asking the second kind of question. I am going to avoid the phrase ‘different parents,’ because it mixes up these two questions.”

  Define “gametes” and “zygote” quickly.

  Here, explicitly set aside monozygotic twinning. Say:

  > “Identical twins are a case where one zygote splits into two. That is a fascinating question about whether one starting point can give two individuals. But it is a different question from ours. Today we are asking whether a different starting point could give the same individual. I’ll put twins aside.”

  Why set it aside: it introduces puzzles about splitting, potentiality, and sufficiency of origins. It will derail a fifty-minute session aimed at necessity of origin. It is not that the question is bad; it is that it is a separate issue.

  ### 3. Second distinction: numerical vs qualitative identity (9–14 minutes)

  Hold up two pieces of paper or two identical pens.

  Ask:

  > “Are these the same sheet of paper?”

  No. They are exactly alike, but they are not the same individual object.

  Write on the board:

  > **Qualitative identity** = looking the same, being alike.  
  > **Numerical identity** = being the very same thing.

  Then say:

  > “Our question about Alex is a question about numerical identity, not about whether someone would recognize him.”

  This distinction must come before the worked example. Otherwise “qualitatively indistinguishable” will sound like “obviously the same person.”

  ### 4. Introduce the Alex example (14–24 minutes)

  Give the worked example above. Write it on the board in two columns:

  | Actual | Counterfactual |
  |---|---|
  | E1 + S1 | E2 + S2 |
  | raised by Dana and Vic | raised by Dana and Vic |
  | actual appearance, personality | indistinguishable appearance, personality |

  Ask:

  > “Is the counterfactual child Alex?”

  Take a vote. Ask one or two students on each side for their reasons. Do not adjudicate yet.

  Here, head off genetic determinism early. Some students will say:

  > “No, because different DNA means different traits.”

  Remind them:

  > “I stipulated that the two are indistinguishable. So if your reason is ‘the traits would be different,’ that is not the issue. Even if the result is exactly alike, the question remains: is it the same individual?”

  ### 5. The Kripkean move (24–32 minutes)

  Now give the central idea without formal machinery.

  Say:

  > “A living organism is not just a pattern of features. It is a particular biological individual with a particular history. That history starts at fertilization. If you change the starting zygote, you change which biological individual is there. No amount of later similarity can make it the same individual.”

  Use the acorn again:

  > “If you plant a different acorn in the same soil, you do not get the same oak tree. You get a different oak tree that happens to grow in the same place.”

  Then apply it to Alex:

  > “If E2 and S2 had produced a child, that child would not be Alex. It would be a different person who is exactly like Alex. Alex could have had a different haircut or a different upbringing. But Alex could not have come from different gametes.”

  Here, head off the misconception that a different sperm would just produce you with different traits. Say explicitly:

  > “When someone says, ‘A different sperm would produce you with different traits,’ they have already assumed that the resulting child is you. That is exactly the assumption we are examining. The Kripkean claim is not that you would have different traits. It is that the subject would be different. Another person would have those traits.”

  ### 6. Generalize to “you,” then scope it (32–40 minutes)

  Now say:

  > “You came from a particular sperm and a particular egg. Consider a different sperm and egg. The same reasoning says that child would not be you. That is origin essentialism.”

  Immediately add:

  > “This does not mean your life was fated. The actual sperm and egg could very easily not have met. In that case, you would not have existed at all. The claim is only this: in any possible situation in which you exist, you come from those gametes.”

  This heads off fatalism.

  Then head off the slide from “necessarily” to “as a matter of fact”:

  > “When philosophers say ‘necessarily, you came from those gametes,’ they do not mean ‘it was guaranteed to happen in the actual universe.’ They mean ‘there is no possible situation where you exist and came from different gametes.’ The actual origin could have failed to happen; then there would have been no you.”

  This also prevents students from thinking origin essentialism means everything about them is fixed.

  ### 7. Final check-out question (40–50 minutes)

  Pose this:

  > “Here are two scenarios.  
  > Scenario A: Alex’s actual zygote—E1 plus S1—is raised by a different family and becomes a very different adult.  
  > Scenario B: A different zygote—E2 plus S2—is raised by Dana and Vic and becomes exactly like actual Alex.  
  > Which scenario, if either, contains Alex?”

  Have them write a one-sentence answer. Then discuss briefly.

  **Good answer:**  
  “Scenario A contains Alex, because it comes from the same zygote, even though his later life is different. Scenario B does not contain Alex, because it comes from different gametes, even though it looks exactly like him.”

  **Bad answer:**  
  “Scenario B contains Alex because it is exactly like him and has the same life; Scenario A does not because he would have a different personality or upbringing.”

  A bad answer shows the student is still using qualitative similarity or upbringing as the criterion of identity. A good answer shows they have separated origin from later circumstances and numerical identity from resemblance.

  ## Misconceptions and when to head them off

  | Misconception | Where to head it off |
  |---|---|
  | Genetic determinism: different DNA would make different traits, so it cannot be the same person | During the Alex example, right after the first vote: remind them the counterfactual is stipulated indistinguishable. |
  | Different sperm would just produce you with different traits | After stating the Kripkean move, when the word “you” is applied; point out that this already assumes the child is you. |
  | Fatalism: the actual origin had to happen | When generalizing to the students: say the actual gametes could have failed to meet, and then you would not exist. |
  | Slide from “necessarily” to “as a matter of fact” | At the same late stage: distinguish “in any possible situation where you exist” from “unavoidable in the actual world.” |

  The overall arc is: first separate origin from upbringing, then separate numerical identity from qualitative similarity, then run the Alex example, then state the thesis, then protect it from fatalism and modal misreadings.

  Summary: The core misconception is treating “same person” as a matter of being qualitatively like you or sharing your later circumstances, rather than being the same biological individual with the same starting point.
