answer: |-
  You have not exactly mischaracterised my view, but you have narrowed it in an important way. I do not say the second supertask is metaphysically impossible; I say that if the final state at \(t=1\) is meant to be determined by continuity with the preceding states, then the second task fails to determine a unique final state, since its state sequence has two cluster points and no limit. The first task, by contrast, gives the lamp a well-defined continuous trajectory ending at 0. I grant the force of your point: the difference between the two cases lies in the chosen pattern of positions, not in the lamp’s physical makeup. But the rule is not irrelevant, because a supertask is not merely a physical substrate; it is a mathematically specified act, and the identity of the act includes the rule. If you stipulate in the second case that the dial may end discontinuously at, say, 0 or 1, then I see no contradiction in its performance—only that the final state is not the limit of the earlier states. So I bite a moderate bullet: whether a supertask has a well-defined continuous outcome can depend on the rule chosen. That is no more mysterious than the fact that whether an infinite series has a sum depends on the sequence of terms, not on the paper on which it is written.
