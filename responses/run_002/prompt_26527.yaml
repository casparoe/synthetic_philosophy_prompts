answer: |-
  **Bottom line: Yes, there is a genuine philosophical case for the circulatory-respiratory criterion, so your parents are not simply refusing to accept facts; nevertheless, I would be moderately confident—perhaps 75–80%—that the neurological criterion is the stronger account in your sister’s case.**

  Death is not only a biological event; it is also partly a conceptual question about which capacities are essential for a human organism to be alive. The circulatory-respiratory criterion says death is the irreversible cessation of heartbeat and breathing. The neurological criterion says death is the irreversible loss of the capacity for consciousness and spontaneous respiration, typically located in the whole brain, and especially the brainstem. In ordinary deaths these coincide; intensive care can pull them apart.

  The philosophical case for the circulatory-respiratory criterion is real. A body that is warm, has a beating heart, and visibly breathes—even with mechanical help—looks biologically active. Some philosophers and clinicians point to cases of patients declared brain-dead whose bodies, with ventilator support, continue to heal wounds, fight infections, regulate temperature to some degree, and even in rare cases gestate a child. That suggests the body retains some genuinely integrated biological functioning, not merely isolated cell activity. On this view, death is about the loss of the organism as a whole, and a brain-dead ventilated body may still be a severely damaged but living organism. This is not mere denial; it is a coherent, minority philosophical position.

  However, I think the neurological criterion is stronger in your sister’s situation. Whole-brain death, including brainstem death, means she has irreversibly lost the capacity to breathe on her own and the capacity for consciousness. The heartbeat and chest movement you see are artefacts of the ventilator, not evidence that her body is integrating itself as a unified organism. The brain is normally the organ that integrates respiration, circulation, consciousness, and responsiveness to the environment. Once it has died and there is no intracranial blood flow, those capacities cannot return. The remaining biological activity is local and machine-supported, not the life of the human organism as a whole.

  Moreover, if one accepted the circulatory-respiratory criterion strictly, one would have to say that a body on ECMO or an artificially perfused corpse could be alive indefinitely. That seems to reduce life to mechanically maintainable organ functions rather than the self-sustaining integration that characterises a living human being. In your sister’s case, the absence of intracranial blood flow is especially important: it confirms that the brain is not merely temporarily impaired but is undergoing irreversible destruction.

  The weakest point in the neurological position I am defending is this: it assumes the brain is the indispensable integrator of the whole organism. Some brain-dead bodies on ventilators display enough coordinated biological activity that a reasonable person could still describe them as living organisms, even if not conscious persons. If one believes that biological life—not consciousness—is the core of what death means, then the circulatory-respiratory criterion gains genuine force. That is why my confidence is moderate rather than absolute.

  But on balance, I would say that your sister has irreversibly lost the capacities that matter for being a living human organism as a whole: consciousness, spontaneous breathing, and brain-mediated integration. The ventilator is sustaining a body, not saving a life. Your parents’ view is understandable and philosophically serious, but I would not accept it in this situation.
