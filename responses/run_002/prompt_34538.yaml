answer: |-
  The first thing to concede is that the Ulysses metaphor is doing two different kinds of work. As a causal description—*some constitutional rules function like hand-tying*—it is plausible and limited. As a normative account of constitutional legitimacy—*the polity’s present self is entitled to bind its future self in the way Ulysses is*—the disanalogies are severe. The more the analogy is asked to justify entrenched rights, judicial review, supermajority rules, or central bank independence, the more those disanalogies matter.

  Here is a ranking from what I think are truly fatal problems to what is merely awkward or incompleteness.

  ---

  ## 1. Fatal: there is no identical self and no actual consent

  The most basic justificatory claim in the Ulysses story is that the person who orders the ropes and the person who later strains against them are the same agent. Ulysses’s present self authorizes his future bodily restraint. His future protests are not the protests of someone else.

  A constitution is not like that.

  Those who drafted and ratified the constitution are, by now, mostly dead. Later generations did not consent. Even at the founding moment, the “polity” that supposedly had a moment of clarity was not a unified agent: women, enslaved people, Indigenous people, noncitizens, and often the poor were excluded. The “we” who bound and the “we” who are bound are not the same.

  This is not merely a technical point. The normative force of the analogy comes from the same place as individual self-binding: a present self’s sovereignty over its own future. But if the future people were never part of that present decision, the analogy starts to look less like Ulysses and more like Ulysses tying someone else to the mast.

  **What a committed defender concedes:**  
  A sophisticated defender will admit there is no literal consent. They may appeal to tacit consent, hypothetical consent, or the idea of a transgenerational polity. But that is a big concession. Once you leave actual consent behind, the Ulysses analogy is no longer supplying the legitimacy. You need an independent account of why political continuity across generations is sufficient. The analogy is then illustrative, not justificatory.

  **Why this can be fatal:**  
  If the legitimacy of constitutional precommitment really is supposed to come from “the same place” as an individual’s present decision to bind their future self, then the absence of the same self severs the link. The analogy fails exactly at the point where it needs to carry normative weight.

  ---

  ## 2. Fatal: constitutions shape the agent whose continuity they presuppose

  Your own intuition points at the deepest conceptual problem.

  Ulysses’s ropes do not change his identity, his values, or his ability to recognize the Sirens. They merely prevent him from acting on a known future weakness. The later Ulysses remains the same person who gave the order.

  Constitutions do much more than this. They create institutions, define citizenship, structure public reason, allocate power, and shape political culture. They do not merely block future preferences; they help form them.

  For example, a society that has lived under a strong free-speech constitution for generations may come to value free speech differently than it would have without that constitution. The later “self” that wants to interpret or amend the free-speech guarantee is partly the product of that guarantee. This means the constitution is not just a constraint on a pre-existing political self; it is one of the things that constitutes that self.

  This undermines the Ulysses picture in a specific way: the model assumes a stable, continuous agent with higher-order preferences at time one and lower-order temptations at time two. But if constitutional rules change the preferences, beliefs, and identities of later agents, then there is no fixed baseline against which to say that the later agent is merely “weak” or “akratic.” The later agent may be different because the constitution helped make them different.

  **What a committed defender concedes:**  
  They may say that every rule shapes the people subject to it, and that this is a simplification. But that understates the problem. The Ulysses model needs the continuity of the self as a background fact. If the constitution is doing the constituting, then the self whose continuity the model needs is itself an artifact of the rope. That is not a minor simplification; it is a reversal.

  **Why this can be fatal:**  
  If constitutions shape future agents, then the question is not merely “Can we bind ourselves?” but “Who gets to shape whom, under what conditions?” That is a different normative question. The Ulysses picture may be assuming the very continuity it needs, as you say.

  ---

  ## 3. Severe: no reliable epistemic asymmetry

  Ulysses knows the Sirens are dangerous. His present self has good information and a clear higher-order preference. His future self will be deluded.

  Constitutional moments are not reliably like that.

  They can be moments of panic, factional triumph, elite compromise, or external imposition. The US Constitution entrenched slavery through the Three-Fifths Clause and the Fugitive Slave Clause. Many constitutions have been drafted after coups, wars, or crises. Post-9/11 security legislation, emergency measures, and anti-terror laws are often enacted in exactly the kind of fearful state the Ulysses model would treat as the “temptation,” not the “clarity.”

  The view needs founding moments to be epistemically privileged. But sometimes the drafters are the ones in the grip of panic or interest. If so, precommitment is just an earlier passion entrenching itself against later correction.

  **What a committed defender concedes:**  
  No serious defender claims constitutional drafters are infallible. They will point to amendment procedures, judicial interpretation, and the possibility of constitutional replacement. But amendment procedures are deliberately hard. If the original commitment was wrong, the very entrenchment makes correction costly. That is a real cost, not a minor inconvenience.

  **Why this is severe but perhaps not always fatal:**  
  The Ulysses picture can still work for a subset of cases where there is good reason to think the earlier self was clearer—central bank independence to resist inflationary temptation, for example. But as a general theory of constitutional legitimacy, the missing epistemic asymmetry is a serious defect.

  ---

  ## 4. Severe: constitutional commands are not self-interpreting

  Ulysses’s order is concrete: “Bind me to the mast until we are past the Sirens.” The crew does not need to interpret what “Sirens” means or what counts as “past.”

  Constitutional provisions are abstract: “cruel and unusual punishment,” “equal protection,” “freedom of expression,” “due process.” These require interpretation. The enforcer—usually a court—has to decide what they mean in new cases.

  If courts read entrenched clauses as “living instruments” or “living trees,” then the future is not really bound by the original precommitment. It is bound by another future agent’s interpretation of that precommitment. That reintroduces the very discretion and present judgment that the Ulysses image was supposed to eliminate.

  **What a committed defender concedes:**  
  They may say that what is precommitted is an abstract principle, not a specific rule. But that weakens the analogy substantially. If the earlier generation has not settled the concrete meaning, then the rope is elastic. It constrains, but it does not determine. A court can update “evolving standards of decency” or read “equal protection” to reach results the founders never imagined.

  **Why this is severe:**  
  The Ulysses model predicts that precommitment works by removing future discretion. But in constitutional practice, discretion is not removed; it is relocated to judges, administrators, and later interpreters. That may be defensible, but it is not usefully described as the same kind of self-binding Ulysses engaged in.

  ---

  ## 5. Severe: the model cannot distinguish akrasia from legitimate change

  Ulysses knows that his future desire to go to the Sirens is a pathology. It is not a considered revision of his life plan. It is a localized, predictable failure of judgment.

  Democratic politics is not like that.

  A later majority may disagree with a constitutional commitment for reasons that are deliberate, reasonable, and morally serious. It may conclude that a particular rights regime is too individualistic, that a certain distribution of power no longer fits the economy, or that an entrenched provision entrenches injustice.

  The Ulysses picture tends to pathologize that disagreement as “weakness of will,” “panic,” or “factional passion.” But unless we have an independent theory of which future preferences count as Sirens, the model can be used to dismiss any democratic challenge to entrenched arrangements.

  This is especially important in amendment fights. When a supermajority rule blocks a change supported by a current majority, the Ulysses model encourages us to see the blocked majority as the tempted Ulysses. But sometimes it is simply a later generation exercising legitimate self-government.

  **What a committed defender concedes:**  
  They may restrict the analogy to core cases: emergency powers, torture, suspension of elections, inflationary monetary policy, etc. That is a more defensible use. But then the view is not a general account of constitutional legitimacy. It is a theory of a narrow class of precommitments.

  ---

  ## 6. Awkward: constitutions create government, not just restrain it

  Ulysses’s ropes are purely negative. They stop him from doing something.

  Constitutions do not only stop states from doing things. They create legislatures, executives, courts, central banks, federal divisions of power, electoral systems, and rights of citizenship. They allocate power, not just constrain it.

  The Ulysses analogy captures entrenchment against temptation. It misses the constitutive function of a constitution. This is not always fatal, because a defender can say, “I only mean the precommitment parts.” But if the view is offered as the best way to understand constitutionalism *writ large*, then it is simply too narrow.

  ---

  ## 7. Awkward: real constitutions build in escape hatches

  Actual constitutional practice is messier and more revisitable than the Ulysses image suggests.

  Consider:

  - **Amendment rules** allow future generations to change the constitution. They are often hard, but they exist.
  - **Sunset provisions** require reauthorization after a period of time. This is not a rope; it is a temporary rope with a scheduled untying.
  - **Derogation clauses** in human rights treaties allow states to suspend certain rights during emergencies. The state in panic may itself invoke the exception.
  - **Notwithstanding clauses**, like Section 33 of the Canadian Charter, allow legislatures to override certain rights for a fixed period.
  - **Living-instrument interpretation** allows courts to update old commitments.

  These are not marginal exceptions. They show that constitutional designers often understand that future agents should retain some power to revisit earlier decisions.

  If the Ulysses picture were the primary logic of constitutionalism, we might expect more absolute entrenchment and fewer built-in revisability mechanisms. Instead, real constitutions often try to have it both ways: they bind, but they also create procedures for unbinding.

  Amendment fights are especially telling. The failure of the Equal Rights Amendment in the United States, for example, was not a case of a clear earlier self saving a later akratic majority from a Siren. It was a case where a supermajority threshold allowed a minority to block a considered change. The Ulysses model has no good way of saying whether that was precommitment working or democratic failure.

  ---

  ## 8. Awkward: the enforcers are not Ulysses’s crew

  Ulysses’s crew ties him to the mast and refuses to untie him. They do not deliberate about whether his order was wise. They are mechanical enforcers.

  Judges, central bankers, and constitutional courts are not mechanical. They exercise judgment. They have policy views. They respond to political pressure. They can be captured.

  The analogy hides a principal-agent problem. The institution enforcing the precommitment may become a new source of discretion and power. That may be good or bad, but it is not like the crew who simply follow the original order.

  ---

  ## What would make the Ulysses picture wrong rather than just incomplete?

  A model is incomplete if it can be supplemented without changing its core. It is wrong if its core relations are inaccurate.

  The Ulysses picture would be **wrong**, not just incomplete, if the following are true:

  1. **There is no pre-political “we” that exists before the constitution.** If the constitution is what creates or substantially transforms the political community, then the image of a pre-existing self binding itself is backwards.

  2. **The founding moment is not epistemically privileged.** If later generations are at least as capable of judgment as earlier ones, then the temporal hierarchy at the heart of the analogy collapses.

  3. **Constitutional meaning is necessarily ongoing and interpretive.** If entrenched clauses cannot fix their own application, then the constitution is not a fixed instruction from the past.

  4. **The central threats to constitutionalism are not future akrasia but present domination, exclusion, and institutional capture.** If that is right, then a model that sees the primary problem as future weakness is diagnosing the wrong disease.

  In that case, the Ulysses contract is not just missing a few details. It is a misleading picture of why constitutional constraints are legitimate.

  ---

  ## What does the Ulysses picture predict about when precommitment goes badly?

  The Ulysses model predicts precommitment goes badly when:

  - The original diagnosis of future weakness was wrong.
  - The founding generation was not actually clearer or more impartial.
  - The future temptation changes in kind, so the old rope binds the wrong thing.
  - Enforcement is too weak, so the future self slips the rope.

  But it is less good at predicting failures caused by the precommitment itself:

  - Rigid entrenchment may generate backlash and delegitimize the constitution.
  - A past elite may entrench its own privileges.
  - The constitution may shape citizens in ways that are alienating or exclusionary.
  - Judicial interpretation may become a new site of unaccountable power.
  - Democratic agency may atrophy because citizens are treated as children who cannot be trusted.

  Rival pictures predict these failures differently:

  - A **republican or democratic-agency view** predicts failure when citizens experience the constitution as an alien constraint rather than their own ongoing project.
  - A **common-law constitutionalist view** predicts failure when original meaning is too rigid for changed circumstances.
  - A **democratic experimentalist view** predicts failure when entrenched rules prevent learning from experience.
  - A **constitutive view** predicts failure when constitutional forms undermine the very civic capacities they presuppose.

  Those predictions are not reducible to “the future self slipped the ropes.”

  ---

  ## Is the view at risk of being insulated by saying “it’s only a model”?

  Yes.

  There is a dilemma.

  If the Ulysses contract is only a metaphor, then it can illuminate but it cannot justify. A metaphor can suggest a line of inquiry; it cannot bear the weight of legitimizing judicial review, supermajority rules, or central bank independence.

  If, on the other hand, it is meant to justify these things, then the disanalogies count. The absence of the same self, the lack of actual consent, the shaping of future agents, the immortality of interpretation—all become problems that need answers.

  A defender who says “it’s only a model” when attacked, but then uses it as a justificatory argument when convenient, is trying to have it both ways.

  The honest move is to say one of the following:

  - “The analogy gives us a heuristic for thinking about a narrow class of constitutional devices, but it is not a general theory of constitutional legitimacy.”
  - Or, “I am offering an independent normative theory of constitutional legitimacy, and the Ulysses metaphor is just an expository device.”

  What cannot be said cleanly is: “The Ulysses contract explains why constitutional precommitment is legitimate,” and then when challenged, retreat to “but of course it’s only a metaphor.”

  ---

  ## Bottom line

  The Ulysses picture works best as a limited heuristic for cases where there really is a predictable future pathology, a relatively continuous political community, and a reasonably determinate rule.

  It works poorly as a general account of constitutional legitimacy.

  The two deepest problems are:

  1. **The bound and binding selves are not the same self.**  
  2. **The constitution does not merely bind future agents; it shapes them.**

  If you are moved by the thought that constitutions shape future agents, then you should probably reject the Ulysses picture as a general theory. It may still be useful for explaining some institutional design choices, but it is not the right normative frame for understanding what a constitution is.
