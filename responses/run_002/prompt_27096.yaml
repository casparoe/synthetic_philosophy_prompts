answer: |-
  Your diagnosis is broadly right, but it can be sharpened. The IIT debate isn’t stalled because people disagree about the math or the behavior of systems. It’s stalled because they disagree about **what would even count as evidence against a theory of consciousness**. That makes it a normative/epistemic disagreement, not primarily an empirical one.

  ## What kind of disagreement is this?

  It is a disagreement about the **evidential standards** for a theory of consciousness.

  More specifically:

  - Critics treat our strong pre-theoretic judgments about certain systems—such as “a grid is not conscious”—as data. On this view, if a theory says a high-Φ grid is conscious, that is a decisive counterexample, because the theory has failed to classify a clear case correctly.

  - IIT proponents treat certain structural or phenomenological principles—like “consciousness is integrated information”—as more trustworthy than our intuitions about exotic systems. On this view, the fact that a high-Φ grid doesn’t *seem* conscious is an unreliable intuition, not a datum. The theory is allowed to overturn that intuition.

  So the real disagreement isn’t “empirical vs. theoretical.” It’s **which intuitions are load-bearing**:

  - Are our intuitions about *particular cases* authoritative?
  - Or are our intuitions about the *structure of experience* authoritative?

  Both sides use intuitions. They just use different ones at different levels.

  ## Why no empirical or formal result can quietly settle it

  The core problem is that consciousness is not directly observable from the outside. We have no independent “consciousness meter” that could tell us whether the grid is conscious. Any proposed empirical test would have to be calibrated using either:

  - our pre-theoretic judgments about which systems are conscious, or  
  - a theory like IIT itself.

  So any test would already presuppose one side of the dispute.

  Formal results can settle whether Φ has certain mathematical properties, whether it is well-defined, whether it can be high in trivial systems, and so on. But they cannot settle whether those properties are what consciousness *is*. That is the philosophical bridge that remains contested.

  The analogy with physics is tempting but misleading. Physics overturns common sense only because there are public, independently measurable phenomena that force the revision. We can say, “The table seems solid, but atoms are mostly empty space,” because atomic theory explains a huge range of independent measurements. There is no analogous independent measurement for “the grid is conscious.” IIT can say, “The grid seems inert, but it is conscious,” but that is not like discovering atoms. It is more like redefining or reinterpreting the target term.

  ## Is there a hidden question that could settle things?

  Only if we first adopt a shared criterion for what would settle it.

  For example:

  - If both sides agreed that ordinary case judgments are authoritative, then the grid case already settles it against IIT.
  - If both sides agreed that structural axioms are authoritative, then the grid case is no longer a counterexample.

  The grid case doesn’t move IIT because IIT doesn’t accept the evidential premise that makes it a counterexample. That is why the debate loops.

  A formal result could in principle show that IIT fails by its own standards—e.g., that Φ doesn’t actually measure what its axioms say it measures. That would be progress internal to IIT. But it would not decide whether integrated information is consciousness. It would only show that IIT has a formal problem.

  Likewise, empirical results about anesthesia, coma, or disorders of consciousness can test some IIT predictions in cases where we already have strong independent grounds for thinking consciousness is present or absent. But those results won’t settle the exotic cases like grids, because the exotic cases are exactly where our independent grounds are weakest and where theory-driven revision is being proposed.

  ## What would progress look like?

  Progress is possible, but probably not as a decisive winner.

  Progress could look like:

  1. **Making the disagreement explicit.**  
     The debate becomes clearer when stated as a conditional:
     - If case intuitions are data, IIT is false.
     - If structural axioms are primary, the grid case is not a refutation.

  2. **Evaluating the costs of each position.**  
     Critics pay the cost of trusting intuitive classifications that may be anthropocentric. IIT pays the cost of accepting consciousness in systems that seem biologically and behaviorally inert. Progress might mean getting clearer about which cost is worse and why.

  3. **Formal refinements.**  
     If Φ can be modified to avoid trivial high-value cases while retaining its explanatory power for brains, that would weaken the grid objection. But it wouldn’t dissolve the philosophical dispute.

  4. **Clinical and comparative empirical work.**  
     IIT can be tested in domains where we have better calibrated judgments—sleep, anesthesia, coma, locked-in patients. But this won’t settle whether the grid is conscious.

  ## Honest bottom line

  There is no hidden empirical or formal question underneath the core dispute that could settle it without begging the question. The fight is about the rules of evidence, not about the facts.

  So yes: **the actual disagreement is not empirical in the ordinary sense.** It is a conflict over what a theory of consciousness must do before we test it, and how much revision of ordinary judgments is acceptable.

  That means we should stop expecting a decisive experiment or formal proof to settle the IIT debate. But we should not necessarily stop having the debate. It forces clarity about what “consciousness” is supposed to refer to, what counts as evidence for it, and how far theory may revise our intuitive picture of the mind.
