answer: |-
  Here is a handout-ready decision tree. It treats the positions as ideal types; many authors defend one node while remaining silent about adjacent ones.

  ## 1. Decision tree

  ```
  Q1: Is a correct moral judgment sufficient for standing to blame?
  │
  ├── Yes ── LEAF 1: Universalism
  │
  └── No ── some fact about the blamer can defeat standing
      │
      Q2: Which kind of fact defeats standing?
      │
      ├── Only moral-record facts
      │   │
      │   Q3: Which moral-record facts defeat standing?
      │   │
      │   ├── Hypocrisy only ── LEAF 2: Hypocrisy Account
      │   ├── Complicity only ── LEAF 3: Complicity Account
      │   └── Both ── LEAF 4: Clean-Hands / Moral-Record Account
      │
      ├── Only relational facts
      │   │
      │   Q4: Which relationship matters?
      │   │
      │   ├── Relationship to the victim ── LEAF 5: Victim-Centered View
      │   ├── Relationship to the wrongdoer ── LEAF 6: Wrongdoer-Relational View
      │   └── Relationship to shared moral community ── LEAF 7: Communal View
      │
      └── Both moral-record and relational facts ── LEAF 8: Hybrid Pluralism
  ```

  ## 2. Leaves and their awkward commitments

  1. **Universalism**  
     *Awkward commitment:* It must grant full standing to the unrepentant hypocrite and the complicit accomplice, since no fact about the blamer can defeat a correct judgment.

  2. **Hypocrisy Account**  
     *Awkward commitment:* It must allow someone who is complicit in the present wrong to retain standing if that complicity does not amount to having committed the same kind of wrong herself.

  3. **Complicity Account**  
     *Awkward commitment:* It must allow a serial wrongdoer to blame someone else for the very kind of wrong she repeatedly commits, as long as she had no role in this particular instance.

  4. **Clean-Hands / Moral-Record Account**  
     *Awkward commitment:* It imposes a broad clean-hands condition, since both relevant past hypocrisy and present complicity defeat standing, which can silence otherwise apt blame.

  5. **Victim-Centered View**  
     *Awkward commitment:* It must deny standing to third parties who are not appropriately related to the victim, even when they correctly condemn clear wrongs done to strangers.

  6. **Wrongdoer-Relational View**  
     *Awkward commitment:* It must deny standing to a victim or bystander who lacks the relevant independent relationship to the wrongdoer, so being wronged is not itself enough.

  7. **Communal View**  
     *Awkward commitment:* It must deny standing to outsiders to the shared moral community, even for clear internal wrongs, which invites moral isolationism.

  8. **Hybrid Pluralism**  
     *Awkward commitment:* It must explain how independent moral-record and relational defeaters interact without making standing so easily defeated that blame is rarely available.

  ## 3. What this tree cannot separate

  The tree separates different *grounds* of lost standing, but not different *accounts of why* each ground defeats standing. For example:

  - The **Hypocrisy Account** leaf includes fairness-based, warrant-based, and commitment-based accounts of why hypocrisy defeats standing.
  - The **Complicity Account** leaf includes causal complicity, benefiting from the wrong, and authorization/support accounts.
  - The **Victim-Centered View** leaf includes views grounding standing in the victim’s authority, the victim’s welfare, or the blamer’s relationship to the victim.
  - The **Wrongdoer-Relational View** leaf includes personal-relationship, role-relationship, and relationship-as-moral-address versions.
  - The **Communal View** leaf includes shared-norms, shared-identity, and political-community versions.
  - The **Hybrid Pluralism** leaf may be conjunctive or disjunctive; the tree does not say whether all relevant defeaters must be absent or any sufficient defeater removes standing.

  ## 4. Logically possible but unoccupied or underoccupied positions

  - A **pure Wrongdoer-Relational View** — where only the blamer’s independent personal relationship to the wrongdoer matters — is logically possible but rarely defended in pure form. Diagnosis: not incoherent, but unattractive, because it seems to deny standing to victims and third parties in many ordinary cases.

  - **Hybrid Pluralism** as a systematically developed position is logically possible but largely unexplored. Diagnosis: not incoherent; many theorists may implicitly accept both moral-record and relational defeaters, but few work out their interaction in detail.

  - **Crossed hybrids** — e.g., hypocrisy-only plus victim-centered, complicity-only plus communal, or clean-hands plus wrongdoer-relation — are logically possible but generally unnamed. Diagnosis: unexplored rather than incoherent, though they may look unparsimonious or overdetermined.

  - A **“neither moral-record nor relational” third-factor view** is not represented in the tree because the requested distinctions treat these as the main candidates. Diagnosis: logically possible, but unmotivated unless a specific third defeater is identified.

  The tree also forces an exclusive choice among relational bases at Q4, but actual relational views often allow multiple relational bases, such as both the victim-relationship and shared moral community. Such pluralist relational views are not incoherent; they are simply not captured unless the tree is expanded.
