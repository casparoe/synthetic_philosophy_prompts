  "Let me answer as if writing a letter. The singleton hypothesis, translated into our vocabulary, is essentially the claim that the anarchical structure of the international system is the underlying source of existential risk, and that the only stable remedy is the replacement of anarchy by hierarchy. It does not say merely that one state should be preponderant; it says that there should be one decision-making agency at the highest level, with effective control over the major decisions that affect the species. In our terms this is a global leviathan or world state, but its proponents are careful to say the sovereign need not be a state; it could be an artificial intelligence or another kind of actor. The argument for its stability is Hobbesian: so long as there are multiple independent centers of decision, the security dilemma persists, arms races occur, and the destructive power of modern technology turns those old dynamics into a threat to the whole system. A singleton would eliminate the security dilemma at the highest level, because there would be no rival great powers to misperceive, arm against, or fight. It would also solve the credible commitment and collective action problems that make arms control and technology governance difficult under anarchy. Proponents regard the present order as dangerous because we are in a noisy anarchic system while the technological stakes are rising rapidly. States and firms are racing to develop artificial intelligence and other dual-use technologies, each fearing the consequences of falling behind, and this dynamic is familiar to us: it is an accelerated security dilemma with offense-dominant characteristics. They do not believe balancing is reliable enough, because a fast-moving technological breakthrough may give a first mover a decisive advantage before a coalition can form, and because the balancing process itself can generate conflict. The paths to a singleton they take seriously include a hegemonic consolidation by one state, a gradual construction of world government through international institutions, and, most characteristically, the emergence of a superintelligent AI that either receives authority or takes it. In the AI path, the transformation is not a change in polarity among existing states but a change in the units of the system."

