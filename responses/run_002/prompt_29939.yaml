  Dear colleague,

  Let me reply as directly as I can. The singleton hypothesis, as defended by Nick Bostrom and others, translates into our vocabulary roughly as follows. It is the claim that the anarchical structure of the international system is the ultimate source of existential risk, and that the only stable remedy is the replacement of anarchy by hierarchy. It does not merely say that one state should be preponderant; it says that there should be one decision-making agency at the highest level, with effective control over the major decisions that affect the species. In our terms this is a global leviathan or world state, though its proponents are careful to say that the sovereign need not be a state. It could be an artificial intelligence, a set of institutions, or another kind of actor. The argument for its stability is essentially Hobbesian. So long as there are multiple independent centers of decision, the security dilemma persists, arms races occur, and the destructive power of modern technology turns those familiar dynamics into a threat to the whole system. A singleton would eliminate the security dilemma at the highest level, because there would be no rival great powers to misperceive, arm against, or fight. It would also solve the credible commitment and coordination problems that make arms control and technology governance difficult under anarchy. Proponents regard the present order as dangerous because we remain in an anarchic system while the technological stakes are rising rapidly. States and firms are racing to develop artificial intelligence and other dual-use technologies, each fearing the consequences of falling behind, and that dynamic is a recognizable, accelerated security dilemma with offense-dominant characteristics. They do not believe balancing is reliable enough, because a fast-moving technological breakthrough may give a first mover a decisive advantage before a coalition can form, and because the balancing process itself can generate conflict. The paths to a singleton they take seriously include a hegemonic consolidation by one state, the gradual construction of world government through international institutions, and, most distinctively, the emergence of a superintelligent artificial intelligence that either receives authority or takes it. In the AI path, the transformation is not a change in polarity among existing states but a change in the units of the system.

  Now for the residue. Much of this translates cleanly. The claim that anarchy plus advanced weapons is dangerous is a direct extension of the security dilemma and the arms race literature. The claim that a world state would be more stable is the classic global leviathan argument, and it maps onto our debates over whether hierarchy can solve problems that anarchy cannot. The hegemonic consolidation path is close to the old idea that a unipole may convert its preponderance into empire or world state, especially if secondary states bandwagon rather than balance. The worry that balancing may fail under conditions of rapid technological change fits squarely within debates about the durability of unipolar orders and the offense-defense balance. In effect, singleton theorists are arguing that unipolarity is insufficiently stable because it remains anarchic, while a fully hierarchical order would be durable.

  What fits only by distortion is the central definitional move. In international relations, a unipole or hegemon is defined by a preponderance of material capabilities within a system of formally sovereign states. A singleton is defined by decision-making agency and effective control, and these are not the same. A singleton could be a non-state AI or a set of institutions, and its power might rest on information and coordination rather than on military and economic preponderance as we traditionally measure it. Calling a singleton a unipole would blur the difference between a very powerful state inside an anarchic system and a sovereign authority that has replaced the system. The AI path does not run through the rise of a hegemonic state. It runs through a technological discontinuity that may occur within a private laboratory, a company, or a non-state project. One could try to translate this as a state acquiring a revolutionary military capability, but that misses the claim that the AI itself becomes the decision-making agency or that the state system is superseded. Balancing and bandwagoning presuppose independent units that can form coalitions or align with a leading power, and a singleton would dissolve those units, so the terms lose their referents.

  Some parts have no expression in our vocabulary at all. The idea of a misaligned artificial superintelligence is not about an adversary state; it is about the internal goal structure of a created non-human agent. International relations theory does not have concepts for a non-territorial, non-human actor whose preferences are not those of a security-seeking or status-seeking state. The notion of an intelligence explosion or recursive self-improvement has no analogue in polarity theory, which assumes that the units of the system remain essentially the same while their relative power changes. Likewise, the concept of a decisive strategic advantage that allows one actor to eliminate all rivals in a short period is not the same as a power transition or a preventive war; it implies a discontinuity in the system’s units. The existential-risk framing is also distinctive because it treats the danger as arising not only from conflict among states but from the nature of the technology itself, which may be existentially dangerous even if no one intends to use it as a weapon.

  So is the untranslatable remainder evidence that the singleton hypothesis is less precise than its proponents think, or that international relations theory lacks concepts it needs? The honest answer is both, but in different ways. Some of the imprecision is real. The singleton literature often uses stability to mean both durability and safety, and it sometimes conflates unipolarity with hierarchy, or fails to specify whether the singleton is a state, an AI, or a decision procedure. Those ambiguities matter because unipolarity, hegemony, and world state have different consequences for legitimacy, balancing, and institutional design. But a substantial residue is not imprecision; it is a genuine gap in our field. International relations theory has focused on changes in the distribution of power among states, not changes in the units of the system. The AI path to a singleton is, in effect, an argument that the Westphalian system may be replaced by a non-state or post-human decision-maker. That is not unipolarity in different dress; it is a claim that the entire wardrobe of polarity, balancing, and hegemony may become obsolete. The failure of translation therefore cuts both ways. Our discipline can discipline the singleton hypothesis by insisting on distinctions between capabilities and authority, anarchy and hierarchy, and stability and legitimacy. But the singleton hypothesis may also be showing us one of our own blind spots: we lack a theory of technological discontinuity that can change the identity of the actors, not merely their relative power.
