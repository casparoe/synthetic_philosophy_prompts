answer: |-
  You’re right to suspect the analogy is doing more work than it can bear. It’s a good deflationary image for the Cartesian soul, but it’s a bad argument for the strong conclusion that “the self doesn’t exist” or that “personal identity is a pseudo-problem.”

  Here is an honest audit.

  ## 1. The full mapping

  | Physical center of gravity | Self as “center of narrative gravity” |
  |---|---|
  | **Mass distribution**: the objective, physical distribution of mass in the object. | The distributed biographical/psychological material: bodily processes, neural states, memories, dispositions, actions, utterances, habits, social records. |
  | **Gravitational field**: the physical field generated by the mass; the force the object exerts and responds to. | The behavioral/interpersonal field: the stream of actions, speech, emotional expressions, social effects, and the ways others respond to the person. |
  | **Calculation**: the mathematical weighted averaging of mass positions; yields a single point. | The interpretive activity: taking the intentional stance, constructing a coherent biography, attributing beliefs, desires, agency, and responsibility to a single subject. |
  | **The point itself**: an abstract geometrical point; not a physical part; no mass of its own; causally inert; useful for prediction. | The self: an abstract center of attribution; not a homunculus or soul; not a thing in the brain; a posit that makes a life intelligible as one story. |

  So far, so good. The analogy captures something real about how we attribute selves.

  But the mapping starts to break as soon as you press on it.

  ## 2. Where the mapping breaks

  ### a) The “mass distribution” is not brute or independent

  In the physical case, the mass distribution exists independently of the center of gravity. You can measure it without already invoking the point. The point is a summary.

  In the self case, the “biographical data” are not like that. They are already intentional, interpreted, norm-laden, and partly shaped by the person’s own self-understanding. An action is not a neutral piece of mass; it is only identifiable as an action under a description. A memory is reconstructed, not stored as a fixed datum. The “narrative mass” from which the self is supposedly calculated is already self-involving.

  So the analogy makes interpretation look more passive and objective than it actually is.

  ### b) The calculation can alter the “mass distribution”

  If you calculate the center of gravity of a baseball, the baseball does not change. The calculation is epistemically useful but causally inert with respect to the mass distribution.

  But self-narration is not like that. If I form a self-conception — say, “I am the kind of person who keeps promises” — that narrative can feed back into my behavior and change my habits, my social identity, and my future biography. The “center” partially restructures the “distribution.”

  This is a major disanalogy: the self is not merely a summary of an already fixed life; it is partly constitutive of that life.

  ### c) The center of gravity is causally inert; the narrative self is not

  A center of gravity doesn’t cause the object to fall. It doesn’t pull anything. It is just a mathematical point we use to describe the motion.

  But a person’s self-narrative has causal effects. It organizes attention, shapes decisions, stabilizes or destabilizes behavior, and affects other people. Of course the narrative is physically realized in the brain and body, but the point is that the self is not epiphenomenal in the way a center of gravity is.

  If your friend says “the self is just a useful fiction,” he risks implying that the self does nothing. That doesn’t follow.

  ### d) There is not a unique “center”

  A physical object has one center of gravity in a given gravitational field. But a person can have multiple narrative centers: professional self, family self, public self, private self, conflicting self-conceptions, dissociated states.

  The analogy quietly imports the idea that there is a single correct answer to “where is the self?” But narrative identity is often plural, contested, and context-sensitive.

  ### e) The first-person subject is not captured

  A center of gravity is not conscious. It has no perspective, no experience, no sense of ownership.

  But one important notion of self is precisely the subject of experience: the one who feels pain, anticipates the future, owns actions, and cares about survival. The center-of-gravity model is a third-person model of how we attribute a self to a person. It does not by itself dissolve the first-person phenomenon.

  Dennett may want to deflate the Cartesian subject, but the analogy alone doesn’t eliminate the experiential self. It only deflates the idea of a literal inner homunculus.

  ### f) “Not a physical thing” does not mean “not real”

  This is probably the central bait-and-switch.

  A center of gravity is not a physical thing. But it is not a mere falsehood either. It is a real abstract feature of a physical system. It has a determinate location, enters into laws, and supports predictions. Mathematicians and physicists don’t say centers of gravity “don’t exist”; they say they are abstract objects or real patterns.

  So if the self is like a center of gravity, the natural conclusion is that the self is a real pattern or abstract feature of a human life — not that it doesn’t exist.

  The argument runs on an equivocation:

  - **Modest claim:** The self is not a concrete physical object.
  - **Strong claim:** The self is not real, or has no ontologically serious existence.

  The analogy supports the first. The second requires a further metaphysical thesis — roughly, that only concrete physical particulars are real. But that’s a controversial ontology, not something the center-of-gravity analogy establishes.

  ### g) Personal identity is not dissolved

  The analogy may relocate questions of personal identity, but it doesn’t make them pseudo-questions.

  We can still ask: what unifies a narrative center over time? What kind of continuity matters for moral responsibility, memory, future concern, and social identity? These are real theoretical and practical questions.

  The analogy might show that “where is the self?” or “what substance is the self made of?” are bad questions. It does not show that “what makes me the same person over time?” is confused.

  ## 3. What the analogy legitimately gets you

  To be fair, the analogy does support some deflationary conclusions:

  - There is no Cartesian theater.
  - There is no soul-like substance.
  - There is no homunculus pulling levers.
  - The self is not a thing in the brain.
  - The self is an interpretive or narrative posit.

  That’s a real philosophical result. But it is a much weaker result than your friend seems to think.

  ## 4. Verdict

  Your friend’s argument works like this:

  1. The self is like a center of gravity.  
  2. A center of gravity is not a real physical thing.  
  3. Therefore, the self does not exist in any ontologically serious way.  
  4. Therefore, personal identity is a pseudo-problem.

  Steps 1 and 2 are fine, if “not a real physical thing” just means “not a concrete physical particular.”

  Steps 3 and 4 don’t follow.

  The center of gravity analogy, honestly mapped, suggests that the self is a real abstract pattern, constituted by narrative and interpretation, causally embedded, and sometimes multiple. Not a substance, but not a nothing.

  So the analogy can break the Cartesian soul, but it can’t break the self. The strong eliminativist conclusion was being carried by a slide between “not physical” and “not real.”
