  Let \(H_0\) be the observed head and \(H_1\) the event that the next toss lands heads.

  ## 1. Mathematics

  For a prior \(\mu\) over \(\theta \in [0,1]\), the prior predictive probability of heads is

  \[
  P_\mu(H_1)=\int_0^1 P(H_1\mid\theta)\,d\mu(\theta)
  =\int_0^1 \theta\,d\mu(\theta).
  \]

  Since the prior set is all probability measures on \([0,1]\), for any \(p\in[0,1]\) we can take the point-mass prior \(\delta_p\), which gives

  \[
  P_{\delta_p}(H_1)=p.
  \]

  So the prior probability of heads on the next toss is indeed the whole interval \([0,1]\).

  Now observe \(H_0\). For any prior \(\mu\) with \(P_\mu(H_0)=\int_0^1 \theta\,d\mu(\theta)>0\), Bayes’ rule gives the posterior

  \[
  d\mu(\theta\mid H_0)
  =
  \frac{\theta\,d\mu(\theta)}{\int_0^1 \theta'\,d\mu(\theta')}.
  \]

  Therefore the posterior predictive probability of heads on the next toss is

  \[
  P_\mu(H_1\mid H_0)
  =
  \int_0^1 \theta\,d\mu(\theta\mid H_0)
  =
  \frac{\int_0^1 \theta^2\,d\mu(\theta)}
  {\int_0^1 \theta\,d\mu(\theta)}
  =
  \frac{E_\mu[\theta^2]}{E_\mu[\theta]}.
  \]

  Now consider the range of this ratio as \(\mu\) ranges over all priors.

  - For any \(p\in(0,1]\), take \(\mu=\delta_p\). Then
    \[
    E_\mu[\theta]=p,\qquad E_\mu[\theta^2]=p^2,
    \]
    so
    \[
    P_{\delta_p}(H_1\mid H_0)=\frac{p^2}{p}=p.
    \]
    Thus every positive \(p\) is attainable.

  - For \(p=0\), the prior \(\delta_0\) is eliminated because it gives the observed head probability zero. But the lower probability is still \(0\) as a limit. Take \(\mu_a=\mathrm{Unif}[0,a]\). Then
    \[
    E_{\mu_a}[\theta]=\frac a2,\qquad E_{\mu_a}[\theta^2]=\frac{a^2}{3},
    \]
    so
    \[
    P_{\mu_a}(H_1\mid H_0)=\frac{a^2/3}{a/2}=\frac{2a}{3}\to 0
    \]
    as \(a\to 0\).

  - Since \(\theta^2\le \theta\) on \([0,1]\),
    \[
    \frac{E_\mu[\theta^2]}{E_\mu[\theta]}\le 1,
    \]
    so no posterior predictive probability can exceed \(1\).

  Thus the posterior interval for \(P(H_1\mid H_0)\) is again \([0,1]\). Strictly speaking, if one insists on proper posteriors only, the attainable values are \((0,1]\), with \(0\) as a lower envelope/limit. But the imprecise-probability interval is unchanged: \([0,1]\). The observation has not narrowed the modeler’s predictive credence at all. This is a degenerate case of dilation, since the prior interval was already maximal.

  ## 2. Normative significance

  ### The defect reading

  The defect reading says: a model that sees a coin land heads and still says the probability of heads on the next toss could be anything from \(0\) to \(1\) is not learning from data. It is completely indecisive. If the prior set is all priors, then even after a finite sample the point-mass prior \(\delta_p\) remains permissible for every \(p\in(0,1)\), so the predictive interval remains \([0,1]\). Such a model seems useless for inference or decision-making.

  On this view, dilation is a sign that imprecise probability models are too permissive. A rational agent who observes a head should at least rule out \(\theta=0\) and arguably should increase the probability of heads on the next toss. The imprecise model refuses to do so. Worse, dilation can occur in less extreme cases where conditioning on an event actually expands the interval, seeming to violate the principle that learning should not make you more ignorant.

  ### The feature reading

  The feature reading says: the imprecise model is doing exactly what it should do. The modeler stipulated complete agnosticism about \(\theta\). That means there are no prior constraints on the bias. A single toss—or indeed any finite sample—cannot determine \(\theta\). For every \(p\in(0,1)\), the dogmatic prior \(\delta_p\) is still compatible with the data, so the posterior predictive probability may still be \(p\). Priors concentrated arbitrarily close to \(0\) remain compatible with the observed head, so the lower probability is still \(0\).

  The precise Bayesian alternative does not solve this problem; it hides it. Suppose a precise Bayesian chooses the uniform prior on \(\theta\). Then after one head,

  \[
  P(H_1\mid H_0)=\frac{\int_0^1 \theta^2\,d\theta}{\int_0^1 \theta\,d\theta}
  =\frac{1/3}{1/2}=\frac{2}{3}.
  \]

  But this number is not delivered by the data. It is delivered by the uniform prior. A Jeffreys prior gives \(3/4\); another prior gives another number. Since the modeler was supposed to be completely agnostic, any precise prior is arbitrary. The precise posterior therefore pretends to more information than the agent actually has.

  On this reading, dilation is a feature: it exposes prior sensitivity. The interval \([0,1]\) is the honest summary of what the data alone support under complete agnosticism. If one wants a narrower posterior, one must justify a narrower prior set. That is not a bug in imprecise probability; it is a demand to state real prior information rather than smuggling it in through an arbitrary precise prior.

  ### Verdict

  In this concrete case, dilation should be treated as a feature, not a defect.

  The defect reading conflates “the model gives no single number” with “the model is defective.” The model does give a sharp answer: the posterior range is the entire interval \([0,1]\). That is the correct conclusion from complete agnosticism plus a single toss. It tells the modeler that the observation is too weak to constrain prediction unless one adds prior information.

  Precise probability is indeed uniquely positioned to obscure this. It forces a single posterior, but only by choosing a prior that was not justified by the setup. The resulting number looks informative but is largely an artifact of that choice. Imprecise probability, by contrast, makes the arbitrariness visible.

  So the right response to dilation here is not to abandon imprecise probability, but to recognize that the model is accurately representing the limits of the evidence. If the model is “too permissive,” that is because the modeler’s stated information was too permissive. Dilation is not the problem; it is the model telling you that you have not yet earned a precise posterior.
