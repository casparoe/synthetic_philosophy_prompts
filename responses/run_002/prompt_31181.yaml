answer: |-
  Yes, one principle can yield almost all your verdicts—but not the ring-species verdict exactly as stated. The principle is a version of the **General Lineage Concept**:

  > **A species is a separately evolving segment of a population lineage.**  
  > A population lineage is an ancestor–descendant series of populations, or in asexuals clones/populations, that remains connected by reproduction and by whatever cohesion mechanisms maintain it. It is “separately evolving” when its evolutionary trajectory and historical fate are not merged with another such lineage by substantial gene flow or other cohesion. Speciation occurs when one lineage splits into two such separately evolving lineage segments. Reproductive isolation, morphological diagnosability, ecological distinctness, and phylogenetic distinctness are all *evidence* for separate lineage status, but none is individually necessary or sufficient.

  That principle gives your verdicts as follows:

  - **Bdelloid rotifers:** They can be species. Sex is not required; stable, ecologically distinct asexual lineages can be separately evolving population lineages.
  - **Polar/brown bears:** They can be two species despite fertile hybrids, so long as hybridization and introgression do not collapse the two lineages into one. Occasional gene flow is compatible with separate lineage status.
  - **Neanderthals/modern humans:** Likewise, they can be distinct species even with interbreeding and introgression, if they remained separate population lineages with distinct evolutionary trajectories.
  - **Fossil gradual lineage:** A single unbranched lineage changing gradually has no objective internal species boundaries. Dividing it into chronospecies is indeed conventional, because there is no lineage split.
  - **Bacteria:** Where gene exchange is so rampant that there are no separately evolving lineages, species names mark convenient clusters rather than natural units. Where stable separate lineages exist, species can be real.

  The one problem is the **greenish warbler ring**. The principle cannot allow both halves of your verdict:

  - If every adjacent population belongs to the same species, then by transitivity the two terminal forms belong to the same species.
  - If the terminal forms are distinct species, then at least one adjacent pair around the ring is not conspecific.

  So the verdict to give up is the conjunction. I recommend giving up the claim that **the two overlapping end forms are not the same species** as a strict species-level claim. Under the General Lineage Concept, the whole ring is one species—or one species complex—because the populations are connected by a continuous chain of gene flow. The terminal forms are best described as **incipient species, semispecies, or subspecies**: they are reproductively isolated from each other where they meet, but they are not yet separate lineages because gene flow still connects them around the ring.

  If you insisted instead on calling the terminal forms two species, you would have to give up the claim that all adjacent populations are conspecific and draw a species boundary somewhere in the ring. That boundary would be arbitrary and would cut through ongoing reproductive continuity, so it is less faithful to the lineage principle.

  For your unsettled case:

  > Two sympatric populations of planktonic copepods, morphologically indistinguishable, same ecological niche, but never interbreed.

  Under the principle, they are **two species**. Sympatry plus stable non-interbreeding is strong evidence of reproductive isolation and hence of separate lineage status. Morphological and ecological indistinguishability do not matter for species status; they merely make them **cryptic species**. So the principle says: two species, not one.
