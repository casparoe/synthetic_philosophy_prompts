  \[
  X=\{0,1,2,3\}.
  \]

  A credence function is a probability vector

  \[
  q=(q_0,q_1,q_2,q_3),
  \]

  with \(q_i\ge 0\) and \(\sum_i q_i=1\). The agent’s evidence is the partial constraint that the expected number of heads is exactly \(2\):

  \[
  E_q[X]=q_1+2q_2+3q_3=2.
  \]

  So the feasible set is

  \[
  C=\{q\in \Delta^3 : q_1+2q_2+3q_3=2\}.
  \]

  This is a two-dimensional set: it fixes the first moment but leaves the higher moments undetermined. If the agent also knew the tosses were independent and identically distributed, this constraint would force a bias of \(2/3\) and hence the unique binomial distribution \((1/27,6/27,12/27,8/27)\). The case is designed so that the agent has no such further information; their evidence constrains only the expected total.

  To make expected accuracy well-defined, I take the agent’s pre-evidence credence over the four outcomes to be uniform:

  \[
  r=\left(\frac14,\frac14,\frac14,\frac14\right).
  \]

  The divergence shown below does not depend on this exact prior; it is just a convenient way of representing initial ignorance.

  ---

  ## 2. The Brier-score recommendation

  The Brier inaccuracy of a credence function \(q\) at world \(i\) is

  \[
  B(q,i)=\sum_j (q_j-\delta_{ij})^2
  =\sum_j q_j^2-2q_i+1.
  \]

  Expected Brier inaccuracy relative to the uniform prior \(r\) is

  \[
  E_r[B(q,X)]
  =\sum_i \frac14\left(\sum_j q_j^2-2q_i+1\right)
  =\sum_j q_j^2+\frac12.
  \]

  Thus maximizing expected Brier accuracy is equivalent to minimizing \(\sum_j q_j^2\) over the feasible set \(C\). We therefore minimize

  \[
  \sum_i q_i^2
  \]

  subject to

  \[
  \sum_i q_i=1,\qquad \sum_i i q_i=2.
  \]

  Using Lagrange multipliers, the first-order conditions give

  \[
  2q_i+\lambda+\mu i=0,
  \]

  so \(q_i\) is linear in \(i\): \(q_i=a+bi\). The constraints become

  \[
  4a+6b=1,\qquad 6a+14b=2.
  \]

  Solving gives \(a=b=0.1\). Hence the Brier recommendation is

  \[
  q_B=(0.1,0.2,0.3,0.4).
  \]

  In plain English: the Brier score recommends a linearly increasing distribution over the four outcomes, assigning \(10\%\) to \(0\) heads, \(20\%\) to \(1\) head, \(30\%\) to \(2\) heads, and \(40\%\) to \(3\) heads.

  ---

  ## 3. The log-score recommendation

  The log inaccuracy of \(q\) at world \(i\) is

  \[
  L(q,i)=-\log q_i.
  \]

  Expected log inaccuracy relative to the uniform prior is

  \[
  E_r[L(q,X)]
  =-\frac14\sum_i \log q_i.
  \]

  So maximizing expected log accuracy is equivalent to maximizing

  \[
  \sum_i \log q_i
  \]

  subject to the same two constraints.

  The Lagrangian is

  \[
  \sum_i \log q_i+\lambda\left(\sum_i q_i-1\right)
  +\mu\left(\sum_i i q_i-2\right).
  \]

  The first-order conditions give

  \[
  \frac1{q_i}+\lambda+\mu i=0,
  \]

  so

  \[
  q_i=\frac{1}{A+Bi},
  \]

  or, after reparameterizing,

  \[
  q_i=\frac{c}{1+xi}.
  \]

  To find \(x\), use the mean constraint in the form \(\sum_i (i-2)q_i=0\). Substituting \(q_i=c/(1+xi)\) gives

  \[
  -2-\frac1{1+x}+\frac1{1+3x}=0.
  \]

  Solving yields

  \[
  3x^2+5x+1=0,
  \]

  and the positivity of all \(q_i\) selects

  \[
  x=\frac{\sqrt{13}-5}{6}.
  \]

  Normalizing then gives, writing \(s=\sqrt{13}\),

  \[
  q_L=\left(
  \frac{3}{4(s+2)},
  \frac{3(s-1)}{8(s+2)},
  \frac14,
  \frac{3(s+3)}{8(s+2)}
  \right).
  \]

  Numerically,

  \[
  q_L\approx (0.134,0.174,0.250,0.442).
  \]

  So the log-score recommendation is visibly different from the Brier recommendation. Compared with \(q_B=(0.1,0.2,0.3,0.4)\), the log-score distribution puts more probability on \(0\) and \(3\) heads, and less on \(1\) and \(2\) heads—while still satisfying the constraint that the expected number of heads is \(2\).

  ---

  ## 4. Diagnosis

  The divergence arises because the evidence fixes only the first moment of the distribution, leaving two degrees of freedom in the feasible set. Brier and log score fill in those degrees of freedom differently: the quadratic Brier loss projects the uniform prior onto the constraint set in a way that yields a linear distribution, while the logarithmic loss yields a reciprocal distribution. If the evidence uniquely determined a probability function—for example, if the agent knew the tosses were iid with bias \(2/3\)—then the feasible set would be the singleton \(\operatorname{Bin}(3,2/3)=(1/27,6/27,12/27,8/27)\), and there would be no scoring-rule divergence. Strict propriety guarantees unanimity when there is a unique probability function to maximize expected accuracy from. The disagreement is thus a symptom of partial evidence, not of scoring-rule choice in general.

  ---

  ## 5. What an accuracy-first epistemologist should do

  The most defensible line, I think, is to deny that the accuracy-first framework must deliver a unique precise credence in cases of merely partial evidence. The rational response to the testimony is arguably the whole feasible set \(C\), understood as an imprecise credal state, rather than any single precise distribution. The Brier/log divergence is then an artifact of forcing a precise answer to a question the evidence does not settle. If a precise representative is needed for some further purpose, the choice among strictly proper scoring rules is best seen as a permissible precisification, not a rational requirement. The main vulnerability of this line is that it concedes that accuracy-first norms alone do not determine a unique precise credence under partial evidence, and it requires a well-developed accuracy-based account of imprecise credal states.
