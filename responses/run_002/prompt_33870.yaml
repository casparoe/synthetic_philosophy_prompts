  ---

  **The implicit view: citizenship as an office, not only a contract**

  The practice presupposes that the individual is not merely a rights-bearer who relates to the state through consent and market transactions. It treats jury service as a temporary civic office. Its features:
  - mandatory: community can impose some burdens on members simply because they are members;
  - non-delegable: some duties cannot be commodified or contracted out because the identity/representativeness of the performer is part of the value;
  - poorly compensated: it is a duty, not a job; payment is reimbursement for expenses, not buying labor;
  - state-defined excuses: the common good, not individual preference, controls release.

  Thus the practice presupposes what might be called a **limited non-voluntarist civic membership** view. It says: membership in a political community entails non-optional burdens when those burdens are necessary for the maintenance of the legal order that protects everyone's rights. But it does not say membership entails general service to the community’s welfare or collective self-realization. That is why it is not a full communitarian theory; it is more like a liberal-republican hybrid.

  **Can liberal theory justify it?**

  On the strict voluntarist picture, it is hard. Compulsory service is an infringement of liberty; token compensation is unjust; non-delegability restricts contract. The only easy liberal justifications would be if one had consented, if it is fair play for benefits accepted, or if it is necessary to protect rights. But actual practice imposes on all eligible citizens without asking whether they would claim trial by jury or accept benefits. So the practice goes beyond simple consent.

  A liberal can justify it in several ways:
  - **Fair play**: The legal system, including jury trial, is a cooperative scheme that benefits everyone. Those who share in its benefits must share in its maintenance. But this is shaky if benefits are non-excludable and non-waivable.
  - **Natural duty of justice (Rawls)**: Citizens have a duty to support just institutions even without having promised. Jury service can be a necessary support for a just institution.
  - **Correlative-right argument**: The right to trial by a jury of peers entails a duty on the state to supply a jury; the state may in turn impose that duty on citizens as the body from which peers must be drawn. But the duty is not directly owed by each defendant’s neighbors; it is a political-legal duty.
  - **Consequentialist due process**: Voluntary juries would be unrepresentative, undermining fairness; compulsion is narrowly tailored to protect defendants' rights.

  Thus the practice **does not uniquely presuppose communitarianism**. It presupposes at most the rejection of pure voluntarism. It is consistent with liberal theories that admit natural duties or fair-play obligations.

  **Why jury service but not compulsory voting or labor?**

  The implicit principle is not “citizens must serve the common good generally.” Rather, it is something like:

  > *The state may compel a citizen to perform a specific civic function only when that function is necessary to maintain an institution that protects rights, and when the function cannot be delegated or bought without defeating the institution’s purpose.*

  Jury service satisfies this:
  - the right to jury trial is a due-process right;
  - a jury must be a fair cross-section of the community;
  - allowing paid substitutes would produce class-biased or professional juries and undermine the point of being judged by one’s peers.

  Compulsory voting fails the test because elections do not require everyone to vote to be legitimate and compulsory voting would coerce political expression. Mandatory community labor fails because street sweeping, teaching, and hospital work can be provided by paid professionals without altering the nature of the service. Conscription is far more burdensome and is not structurally necessary for ordinary rights protection in the same way.

  So the narrowness reinforces that the practice is not a broad communitarian claim on persons, but a targeted exception grounded in the specific institutional requirement of jury adjudication.

  **Reconstructing the implicit theory**

  I would reconstruct it as a **civic-office theory of adjudication**:

  - Political community is a cooperative order for the protection of rights.
  - Membership in that order is not wholly voluntary; it carries certain minimum duties to maintain the order.
  - Those duties are normally discharged through taxes and obedience to law; only exceptionally through personal, non-delegable service.
  - Personal service is justified only when:
    - the institution is a rights-protecting institution;
    - the service is episodic and widely distributed;
    - the institution's legitimacy requires participation by ordinary citizens rather than paid agents;
    - delegation or opt-out would undermine the institution's function.
  - The duty is to serve when called, not to participate in politics generally or to promote the common good.

  That theory **strictly requires**:
  - Some political obligations are non-contractual.
  - The state may compel at least one form of short-term civic labor.
  - Citizens cannot always buy their way out of civic burdens.
  - Rights can generate reciprocal burdens.

  It **fits well with**, but does not strictly require:
  - Civic republicanism: juries as popular participation in governmental power.
  - Communitarianism: membership as a source of non-optional duties.
  - Fair-play liberalism: burdens as a fair share of a cooperative scheme.
  - Common-law constitutionalism: the jury as a constitutional check on government.

  It is **philosophically underdetermined** in several ways:
  - The basic moral source of obligation—fair play, natural duty, consent, membership, utility—is not fixed by the practice.
  - The scope of the principle is unclear: would it also justify mandatory service as poll workers, lay assessors, emergency responders?
  - The relation between compensation and duty is not fixed: token payment could be a feature of civic duty or a historical accident/fiscal choice.
  - Whether the duty is to the community as such or to fellow citizens/defendants is not settled.

  **If replaced by a consistently liberal theory**

  Under the liberal picture described—state justified by protecting rights, obligations primarily voluntary—jury duty as now practiced would be presumptively illegitimate.

  Changes to jury duty:
  - Service would be voluntary, like applying for a job.
  - If the state needs jurors, it would have to recruit them with market wages or other incentives.
  - Citizens could decline or ignore a summons without penalty.
  - The state could not forbid delegation or substitution, unless it could show a rights-based reason to restrict contracts (e.g., the right to a representative jury). More likely, it would professionalize the jury or create a standing jury panel of paid volunteers.
  - Excusal would be broader or unnecessary because service is consensual.
  - There would be no fines or imprisonment for refusal.

  Broader civic obligations:
  - Voting would remain a right, not a duty.
  - Community labor would be voluntary or paid; no mandatory national service.
  - Military service would be voluntary, with conscription rejected except maybe as a temporary emergency measure under extreme necessity.
  - The only standing mandatory burdens would be taxes and obedience to core laws, justified as necessary to protect rights; even those would be minimized.

  The result would be a thinner conception of citizenship: individuals would be contractors and rights-bearers, not co-holders of civic offices. Whether juries would remain representative and legitimate is a real question; the consistently liberal theory would either have to find market/professional substitutes that protect defendants’ rights or accept a different adjudicative system.

