answer: |-
  I’ll give you the strongest case against your position, because I think your view is at its most vulnerable exactly where you predicted: the later self retains more agency than the dichotomy between “critical interests” and “experiential interests” allows. I do not think this destroys advance directives. I do think it makes the unqualified view false.

  My own conclusion, to state it up front: an advance directive has strong, presumptive moral authority, but it is not absolutely binding over a later self who has lost full decision-making capacity. In particular, if the later self is momentarily lucid and genuinely capacitated, its repudiation should defeat the earlier directive. And even short of lucidity, a later self can possess enough value-driven agency to make overriding its will a genuine moral cost, not merely a comfort problem.

  ## 1. The strongest case: the later self is not an autonomy-free zone

  Your argument depends on a sharp boundary: the earlier self can reflect critically on a whole life; the later self cannot; therefore the later self’s preferences are merely experiential and do not carry the same moral weight. That is too clean.

  Autonomy is not a light switch. There is a form of autonomy—call it “valuational autonomy” or “marginal agency”—that can survive the loss of the capacity to make whole-life decisions. A person with moderate-to-severe dementia may not be able to understand a ventilator or weigh the long-term consequences of antibiotics. But she may still value certain things, in a morally serious sense: she values her daughter’s presence, values not being touched, values a particular ritual, values being clean, values continuing to live despite her limitations.

  This is not merely experiential. It is not just pleasure and pain. It is a point of view from which the world is organized. When such a person turns away from a feeding tube, or repeatedly cries out when restrained, or says “I want to live” during an infection, we are not seeing a reflex. We are seeing a self—damaged, simplified, but still present—expressing a will.

  The philosopher Agnieszka Jaworska made this point forcefully against views like yours: a person can lose the capacity for critical reflection while retaining the capacity to value. Valuing does not require the ability to compare whole lives or to make long-term plans. It requires the ability to hold something as good. Many people with dementia retain that. If that is right, then the later self is not merely a bundle of experiential interests; it is an agent in a morally weighty sense, even if it is not a fully autonomous agent in the sense your view uses.

  This matters because your position says the later self’s expressed or inferred preferences should not override the directive. But if those preferences are sometimes value-driven, then overriding them is not merely overriding comfort. It is overriding a current self’s agency. That is a much larger moral cost than your view acknowledges.

  ## 2. The “momentarily lucid” clause is close to fatal

  You say the earlier directive binds even if the later self, momentarily lucid, would repudiate it. I think this is the hardest part of your view to defend.

  If “momentarily lucid” means the later self actually meets the criteria for decision-making capacity—understands the relevant facts, appreciates the situation, reasons, and communicates a stable choice—then the later self has, at that moment, exactly the property that gave the earlier self its authority. Why should the earlier exercise of that capacity silence the current exercise?

  You might say: because the earlier self was stable, deliberate, and expressed a critical interest in the shape of a whole life. But autonomy does not require stability across time. A competent person can change his mind today about a treatment he consented to yesterday. If he is competent now, his current refusal wins. We may ask whether he is fickle, whether he needs more information, whether he is depressed. But we cannot say his earlier choice binds him regardless of his current competent will.

  If the later self’s lucid repudiation is genuine, then your view no longer seems to be about respect for autonomy. It becomes a rule that a past self has sovereignty over a present self. That may be a legal convention, and it may sometimes be justified, but it is not a requirement of respect for autonomy. In fact, it is in tension with it.

  The Ulysses contract analogy does not save you. Ulysses asks his sailors to bind him because he knows his future self will temporarily be in the grip of passion and will still, at some deep level, endorse the plan. But if Ulysses, in a lucid interval while still bound, looked his sailors in the eye and said, “I have changed my mind; I no longer want this,” and he was calm, competent, and clear, the sailors would have a serious problem. They could not simply ignore him. The same is true of a dementia patient in a lucid interval.

  ## 3. What else should move you, sorted by strength

  ### Decisive or near-decisive

  1. **The later self retains value-driven agency.**  
     This is the strongest objection. It attacks the empirical and conceptual premise that the later self lacks the relevant kind of autonomy. If the later self can value, then there is something morally important to respect, not just something to comfort.

  2. **Contemporaneous competent repudiation.**  
     If a later self is genuinely lucid and refuses, that refusal should defeat the earlier directive. A view that denies this has insulated itself against the very capacity that grounds advance directives in the first place.

  3. **The wrongness of enforcing a directive through restraint or coercion.**  
     If the later self physically resists—pulling out tubes, fighting caregivers, crying in terror—honoring the directive may require using force against a vulnerable person. That is not a trivial cost. It is sometimes a decisive reason to relent, or at least to very heavily scrutinize whether the directive applies to this situation.

  ### Genuine costs, though perhaps not fatal

  4. **Affective forecasting errors.**  
     People are systematically bad at predicting how they will feel in future states of disability. The earlier self may have feared a life with dementia more than the later self actually suffers it. This weakens the informational basis of any particular directive.

  5. **Vagueness and context-insensitivity.**  
     Directives are often too general to settle hard cases. They say “no life-sustaining treatment” but do not specify whether antibiotics for pneumonia count, or whether spoon-feeding should be withdrawn. This is a practical problem, but it also bears on moral authority: the less the directive speaks to the actual situation, the less it should bind.

  6. **Psychological discontinuity.**  
     In advanced dementia, the psychological connections between the earlier and later self can be severely attenuated. This does not show the later self is a different person in every morally relevant sense, but it does weaken the claim that the earlier self is simply governing “its own” future. The defender should concede this as a cost, even if she rejects the strong identity claim.

  ### Objections a committed defender can dismiss

  7. **“The current preferences always win.”**  
     That is not the conclusion. Many current preferences are not value-driven or autonomous. The fact that a demented patient smiles at ice cream or says “I want to go home” repeatedly does not by itself defeat a carefully made directive.

  8. **“Advance directives are useless.”**  
     That is an overreaction. They remain important evidence of a person’s critical interests, especially when the later self has no discernible value-driven agency.

  9. **“The later self is a completely different person.”**  
     This is too strong. There are usually continuities of body, emotional habits, fragments of memory, and relationships. The defender can reject wholesale identity discontinuity while still accepting that the later self has some moral status.

  ## 4. What a committed defender should concede

  You should concede that enforcing an advance directive can wrong the later self. It is not simply a matter of the later self being uncomfortable while the earlier self’s dignity is protected. It can be a genuine conflict between two morally weighty claimants: the earlier self’s life plan and the later self’s current agency.

  You should also concede that a contemporaneous competent repudiation is a defeater. If you do not concede that, your view becomes indefensible, because it no longer rests on autonomy at all. It rests on the mere fact of having once been autonomous.

  You can still hold that advance directives create a strong presumption. You can still hold that most ordinary expressions of contentment or distress from a severely incapacitated person do not defeat that presumption. But you cannot hold that the later self is morally silent.

  ## 5. Has the position been insulated?

  Yes, there is a real risk of insulation.

  The phrase “lacks the capacity for the kind of critical reflection that generated the directive” can be used to classify any later preference as merely experiential. If that classification is stipulated rather than grounded in clinical and philosophical criteria, then the position is unfalsifiable. No evidence about the later self’s stable values, relationships, or lucid intervals could ever break it.

  That is a problem, even for a normative view. Normative views are not scientific predictions, so they are not falsifiable in the same way. But they are still answerable to reasons. A moral principle should be able to say what would count as a defeater. If your view says, “Nothing the later self does could ever defeat the directive,” then it has stopped being a view about autonomy and become a dogma about the precedence of the past.

  A better version of your position would specify break conditions. At minimum:

  - A genuinely capacitated contemporaneous repudiation defeats the directive.
  - Clear evidence that the later self retains stable, value-driven agency contrary to the directive creates a strong moral conflict, and may defeat the directive in some cases.
  - A directive based on materially false beliefs or coercion lacks authority.
  - Enforcement requiring severe physical restraint or causing severe terror requires a higher level of justification and may be impermissible in practice.

  If you accept those, the position becomes a strong, defensible presumption. If you reject them, you have insulated it into unfalsifiability.

  ## 6. Where I place my confidence

  I think the unqualified position is false. The strongest case against it—the later self’s retained agency—should move someone who holds it. It moved me.

  I would put my confidence in the unqualified position at around 20–25%. I think it is much more likely that the right view is a qualified one: advance directives have strong moral authority, but that authority is defeasible by contemporaneous competent repudiation and, in narrower cases, by clear evidence that the later self retains value-driven agency that the directive would override.

  I would put my confidence in that qualified view at around 70%. The remaining 5–10% I would reserve for more radical views: either the view that psychological discontinuity undermines much of precedent autonomy, or the view that current welfare interests almost always win.

  In practice, this means I would still honor most advance directives. I would not be moved by every current smile or protest. But I would treat the later self as someone who is still there, still capable of valuing, and still capable of being wronged by the person who once was.
