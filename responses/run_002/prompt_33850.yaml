answer: |-
  Here is a candidate set of principles that captures your verdicts:

  **1. Factorize the path from planets to detectable civilizations.**  
  Think of the expected number of detectable civilizations as something like:

  \[
  N_{\text{det}} = N_* \times f_{\text{planets}} \times f_{\text{life}} \times f_{\text{complex}} \times f_{\text{intelligence}} \times f_{\text{tech}} \times f_{\text{detectable}}
  \]

  An observation should be classified by which factor it constrains. This matters because evidence about early factors and evidence about late factors do very different work.

  **2. Upstream easy-step findings move the filter, not the silence itself.**  
  If you learn that an early step is easier than expected — abiogenesis, complex life, intelligence — then the expected number of life- or intelligence-bearing worlds goes up. But since you already know the galaxy is silent, that increased expectation has to be absorbed by a later filter or by systematic non-detectability. So the silence becomes *more* puzzling, not less.

  This clause is motivated by your cases (1), (3), (4), and (7). Mars microbes, early abiogenesis, common planets, and convergent intelligence all make some upstream factor more favorable. They therefore shift the Great Filter later, or shift probability toward “they are out there but we cannot see them.”

  **3. Downstream nulls directly constrain late factors.**  
  A sensitive null result for Dyson spheres, von Neumann probes, colonization, or waste heat is not merely “we haven’t seen anything.” It is a measured upper bound on a class of detectable technological behavior. If that behavior would be likely if a broad class of technological civilizations existed, then the null strongly favors “no such civilizations in the surveyed volume.”

  This clause is motivated by (2) and (6). The Dyson sphere survey is powerful because it would have found Dyson spheres if they were there. The absence of colonization is even stronger because self-replicating probes are a very general prediction of expansionist technological life.

  **4. Every search result should be evaluated by a measurement model, not by whether it feels positive or negative.**  
  A systematic null with high sensitivity can be very strong evidence. But a single unreplicated, unmodulated, non-repeating candidate signal is weak evidence because false positives, instrumental artifacts, unknown natural sources, and look-elsewhere effects make such a candidate fairly likely even under the “no technosignature” hypothesis.

  This is the principle that resolves your discomfort about (5). The one-off hydrogen-line signal is not analogous to the Dyson null. The Dyson null is a high-quality negative: if Dyson spheres existed in the surveyed volume, the survey would probably have found them. The one-off signal is a low-quality positive: it is exactly the kind of thing that happens sometimes even when nothing is there.

  In Bayesian terms:

  \[
  \frac{P(\text{non-repeating candidate} \mid \text{many civilizations})}{P(\text{non-repeating candidate} \mid \text{no civilizations})}
  \]

  is close to 1, so it barely updates you. But

  \[
  \frac{P(\text{Dyson null} \mid \text{many Dyson-building civilizations})}{P(\text{Dyson null} \mid \text{no Dyson-building civilizations})}
  \]

  is much smaller than 1, so it strongly favors the “no Dyson-building civilizations” hypothesis.

  **5. Prior expectedness modulates strength.**  
  Confirming something you already strongly believed is a small update; discovering something surprising is a large update. That is why common Earth-sized planets in habitable zones only modestly updates you, while independent Martian life or convergent intelligence would be much stronger.

  ---

  **Are (1) and (7) consistent?**

  Yes, under this principle they are consistent. Both are upstream easy-step findings.

  - Martian fossilized life suggests abiogenesis is easy.
  - Convergent intelligence suggests intelligence is easy.

  Both raise the expected number of life- or intelligence-bearing worlds. Since the galaxy is still silent, both make the silence harder to explain unless there is a downstream filter or non-detectability. So both make the silence *more* puzzling, not less. The apparent tension comes from describing (7) as “expecting company.” It does increase the prior probability of intelligent life elsewhere; it does not, by itself, make detectable technosignatures likely.

  ---

  **Applying the principle to new cases**

  **Prokaryote-to-eukaryote transition happened multiple times on Earth.**  
  This would be an upstream finding about the complex-life factor. It would weaken the “eukaryogenesis is the Great Filter” hypothesis and shift the filter later — perhaps to multicellularity, intelligence, technology, or detectability. The silence would become more puzzling, not less.

  **A second independent abiogenesis on Earth — a “shadow biosphere.”**  
  This would be very strong upstream evidence that life starts easily. It would sharply increase the expected frequency of life in the galaxy. Conditional on the continued silence, it would force the Great Filter to lie after abiogenesis, and make the absence of technosignatures harder to explain unless there is a late filter or systematic non-detectability. It would increase confidence that simple life is common, but it would not solve Fermi; it would sharpen it.

  ---

  **Which verdicts does this principle force you to revise?**

  It mostly confirms your verdicts, but it forces two refinements.

  First, (2) and (6) should be stated as “strongly favors no Dyson-building civilization” and “strongly favors no expansionist, self-replicating-probe-building civilization.” To get from there to “we are alone” full stop, you need the additional assumption that technological civilizations tend to build Dyson spheres or self-replicating probes. That assumption may be reasonable, but it should be explicit.

  Second, (5) should not be “barely updates me at all” for no articulable reason. The principle gives the reason: the candidate has a poor Bayes factor because it is non-repeating, unmodulated, and subject to false-positive and selection effects. If the signal repeated or were independently verified, it would update you enormously.

  \answer{Divide the Fermi problem into upstream factors that set the expected number of civilizations and downstream measurement results that directly test their detectability: upstream easy-step findings move the Great Filter later and make silence more puzzling, while systematic downstream nulls strongly favor absence of the relevant technological behavior, and unreplicated candidate signals only update as much as their Bayes factor allows.}
