  **The move described**

  The move can be abstracted as follows. A contested phenomenon X is given a definition D such that D requires conditions C1…Cn that are at the extreme end of usage—often logically or empirically impossible, or impossible for any normal case to satisfy. The arguer then proves that the conditions cannot be jointly satisfied. From this they infer not merely “X-under-D is impossible,” but “X is an illusion/unreal/incoherent” in the ordinary sense too. The slide is: “X in the strictest possible sense is impossible” to “X is impossible.” The work is done before the empirical evidence arrives; the definition disqualifies all ordinary cases in advance. This is what happened with your friend: real self-deception was defined as requiring the same agent to know and not know the same proposition in the same respect and at the same time. That is a contradiction; but nothing in the ordinary phenomenon of self-deception obviously requires that. The argument didn’t discover that self-deception fails; it stipulated a version of self-deception that cannot succeed.

  **Nearest existing concepts**

  [Straw man / NTS]
  The pattern resembles a straw man because it attacks a more extreme version than the one actually used. But straw man is usually a misrepresentation of an opponent’s stated view. Here the extreme definition may have genuine foothold; some philosophers have held strong readings. The target is the concept, not a particular opponent. It is better to call it a “straw concept” or “definitional straw man” when the strong version is made to stand in for the whole. It becomes a regular straw man if attributed to someone who explicitly holds a moderate view.

  No True Scotsman is also close. In NTS, a speaker protects a generalization from counterexamples by redefining the key term after the fact: “no Scotsman would do X,” “but Angus did,” “well, no true Scotsman.” The move you describe is preemptive rather than ad hoc: the bar is set impossibly high before any case is considered. Its effect is the same—counterexamples are disqualified as not genuine—but it is systematic and front-loaded. If your friend, when presented with actual cases of compartmentalized self-deception, just says “that’s not real self-deception,” he is drifting into NTS territory.

  [Motte-and-bailey/begging]
  It is not motte-and-bailey in the standard sense. In motte-and-bailey, a person makes a strong claim but retreats to a weak one when challenged. Here the debater insists on the strong definition and does not retreat; if anything, they are trying to make the weak ordinary phenomena illegitimate by comparing them to an impossible strong definition. However, a version can arise if they later say “I only mean the technical, strong sense”—that would be retreating from the bailey of “self-deception doesn’t happen” to the motte of “my stipulated self-deception doesn’t happen.”

  Begging the question is also involved. The conclusion that X does not exist is packed into the definitional premise that genuine X requires impossible conditions. If the disagreement is precisely whether the ordinary concept has such conditions, then simply defining it so assumes the point. The argument can be formally valid but dialectically empty: it proves only that the stipulated strong kind does not exist.

  [Definist/nirvana]
  The closest established label is the **definist fallacy** or C. L. Stevenson’s **persuasive definition**. A persuasive definition changes the descriptive content of a familiar evaluatively loaded word while retaining its emotional or rhetorical force. For example, defining “real courage” as “acting with no fear at all” then concluding “real courage is impossible” uses the ordinary honorific force of “courage” while artificially excluding ordinary brave acts. The definist fallacy, as often used in informal logic, is the fallacy of defining a term so that a contested claim follows by definition. Your move is a species of that genus: it defines a phenomenon in an extreme way in order to eliminate it. But the defining-away move you describe is narrower than the general definist fallacy, because its distinctive engine is maximalizing the criteria to the point of impossibility.

  The nirvana fallacy is also a cousin. In the nirvana fallacy, real options are rejected because they fail to match an idealized alternative. In the maximal-definition move, real instances are rejected because they fail to match an idealized definition. The structure is similar, but the domain is conceptual rather than institutional or policy-oriented.

  **Does it have a name?**

  There is no single widely used name for exactly this pattern. “Definist fallacy” and “persuasive definition” are the established terms that come closest, but they cover a broader class. Some informal logicians might describe it as “defining X out of existence” or “definitional elimination,” and philosophers sometimes speak of “the paradox of self-deception” or “the hard problem of free will,” but those name the philosophical puzzle, not the argumentative move. So the honest answer is: no canonical label exists; you have identified a species of definist fallacy that deserves its own name.

  **Proposed name and definition**

  I propose calling it the **maximal-definition fallacy** (or **definitional preclusion**). Its definition:

  > The maximal-definition fallacy occurs when someone (a) adopts or invents a definition of X that requires conditions so strong that they are impossible, contradictory, or unsatisfiable by any plausible case; (b) shows that nothing satisfies that definition; and (c) concludes that X as such is unreal, illusory, or incoherent, without adequately arguing that the strong definition is the only legitimate one.

  The key defect is the slide from “X in this extreme sense is impossible” to “X is impossible.” The argument’s conclusion depends almost entirely on the choice of definition, not on evidence about the world. It is not a fallacy to use a demanding definition per se; it becomes one when the definition is used to police the whole concept and dismiss weaker but recognizable instances as not real.

  Boundary cases matter. If someone explicitly says “I will use ‘libertarian free will’ to mean an undetermined act of self-creation; no such act exists; therefore libertarian free will does not exist,” that is not necessarily the fallacy. The conclusion is scoped to the stipulation. The problem arises when they then say “therefore free will is an illusion” without treating ordinary free will on its own terms. Likewise, some concepts really are committed to impossible conditions. “Round square” is an example: showing that nothing can be a round square is not a fallacy. But if ordinary usage and theoretical practice allow a weaker, coherent, useful sense, then maximalizing the definition and declaring the phenomenon dead is an act of semantic legislation, not discovery.

  A diagnostic test: ask whether the argument’s force would survive if the concept were defined in a moderate, ordinary way. If the conclusion depends entirely on the inflated definition, then the move is definitional preclusion. Also ask: “What would count as a real case of X under this definition?” If the answer is “nothing, by definition,” then the argument has not shown that the phenomenon is absent—only that the word has been defined so that it cannot apply.

  **Is it ever legitimate?**

  Yes, sometimes. Insisting on a demanding definition is legitimate when the debate is explicitly about the demanding sense, when the strong definition is not ad hoc but reflects the theoretical or explanatory role the concept is supposed to play, and when the conclusion is scoped accordingly. For example, if a philosopher argues that “libertarian free will” requires ultimate self-authorship and then shows that no physical being satisfies that, the conclusion is a legitimate result about libertarian free will. It becomes a fallacy only if the philosopher then denies that there is any other sense of free will worth caring about without argument. Similarly, a theoretical concept like “phlogiston” can be defined by its posited causal role; if that role is empty, the concept is out. But that conclusion must come from evidence that the theoretical role is empty, not from stipulating an impossible version and ignoring the actual practices that gave the term meaning.

  The clearest criteria for cheating are: (1) the maximal definition is treated as obvious or neutral when it is contested; (2) the conclusion is exported from the stipulated strong sense to ordinary usage; (3) weaker but recognizable cases are dismissed with “that’s just X, not real X” without an account of why the ordinary concept is committed to the strong conditions; and (4) the argument does no empirical work—it would prove the same conclusion in any possible world because the definition guaranteed it. In your self-deception argument, your friend can have his strong definition if he wants. But he cannot use it to conclude that the ordinary phenomenon you are talking about—compartmentalized or motivated self-deception—does not exist. He owes an argument that those phenomena do not count under the best analysis of ordinary self-deception, not under his maximally paradoxical stipulation. Otherwise he has not explained self-deception away; he has defined it away.

