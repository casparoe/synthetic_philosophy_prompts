answer: |-
  **The move described**

  The pattern is this. Take a contested concept X—self-deception, free will, altruism, consciousness, whatever. The arguer insists that X, to count as *real* X, must satisfy a set of conditions C that are at the extreme end of what anyone could mean by X. Often C is not merely demanding but impossible: it requires contradictory states, superhuman capacities, or conditions no finite being could meet. The arguer then demonstrates that nothing can satisfy C. From this they conclude not merely “X in this extreme sense is impossible,” but that X as a phenomenon is an illusion, incoherent, or nonexistent.

  The crucial slide is from:

  > “X in the strictest, most paradoxical sense is impossible”  
  > to  
  > “X is impossible.”

  In your self-deception case, your friend defined genuine self-deception as requiring the same agent to know and not know the same proposition *in the same respect, at the same time, with full awareness*. That is a contradiction. But the ordinary concept of self-deception does not obviously require that. The argument did not discover that self-deception fails; it stipulated a version of self-deception that cannot succeed, then treated that stipulated version as the only legitimate one.

  The move is not exactly an empirical claim. It is definitional preclusion.

  **Nearest existing concepts**

  The closest neighbor is the **straw man**. A straw man misrepresents an opponent’s actual view. This move is similar because it attacks an extreme version of a concept. But it is not always a pure straw man, because the extreme definition sometimes has genuine philosophical defenders. Some philosophers really do seem to mean something very strong by “free will” or “self-deception.” The target is less a person’s argument than the concept itself. It might be called a *straw concept* or *definitional straw man*: an unusually strong reading is made to stand in for the whole concept. It becomes a regular straw man only when attributed to someone who explicitly holds a moderate view.

  The move is also close to **No True Scotsman**. In No True Scotsman, a speaker protects a generalization from counterexamples by redefining the key term after the fact: “No Scotsman would do such a thing.” “But Angus did.” “Well, no *true* Scotsman would.” The move you describe is a preemptive version of that. The bar is set impossibly high before any examples are offered, so no possible counterexample can count. The effect is the same—potential instances are disqualified as not “real”—but it is systematic and front-loaded rather than ad hoc. If your friend, when shown actual cases of compartmentalized self-deception, simply says “that’s not real self-deception,” he is drifting into No True Scotsman territory.

  It is not quite **motte-and-bailey**. In a motte-and-bailey, a person defends a strong claim but retreats to a weak one when challenged. Here the debater insists on the strong definition and refuses to retreat. They occupy the strong version and use it as the only standard. That said, the move can interact with motte-and-bailey if, after being challenged, the person says “I’m only talking about a technical definition.” That would be retreating from “self-deception doesn’t happen” to “my stipulated self-deception doesn’t happen.”

  There is also an element of **begging the question**. If the conclusion is “X does not exist” and the premise is “genuine X requires impossible conditions,” the conclusion is already contained in the definitional premise. The argument can be formally valid but dialectically empty. The real disagreement is whether the ordinary concept of X really requires those impossible conditions. If you simply assert that it does, you have assumed the central point.

  The closest established term is probably the **definist fallacy** or C. L. Stevenson’s **persuasive definition**. A persuasive definition changes the descriptive content of a familiar evaluatively loaded word while retaining its emotional or rhetorical force. For example, defining “real courage” as “acting with no fear at all” and then concluding “real courage is impossible” trades on the ordinary honorific force of “courage” while artificially excluding ordinary brave acts. The definist fallacy, as often used in informal logic, is the fallacy of defining a term so that a contested claim follows by definition. The move you describe is a species of that genus. But it is narrower: the distinctive feature is that the definition is maximalized to the point of impossibility.

  The **nirvana fallacy** is another cousin. In the nirvana fallacy, real options are rejected because they fail to match an idealized alternative. Here real instances are rejected because they fail to match an idealized definition. The structure is similar, but the domain is conceptual rather than policy-oriented.

  **Does it have a name?**

  There is no single widely used name for exactly this pattern. The closest established labels are the **definist fallacy** and **persuasive definition**, but those cover a broader class. Some informal logicians might describe it as “defining X out of existence” or “definitional elimination,” and philosophers sometimes speak of “the paradox of self-deception” or “the hard problem of free will,” but those name the philosophical puzzle, not the argumentative move.

  So the honest answer is: no canonical label exists. You have identified a species of definist fallacy that deserves its own name.

  **Proposed name and definition**

  I propose calling it the **maximal-definition fallacy**, or **definitional preclusion**. Its definition:

  > The maximal-definition fallacy occurs when someone (a) adopts or invents a definition of X that requires conditions so strong that they are impossible, contradictory, or unsatisfiable by any plausible case; (b) shows that nothing satisfies that definition; and (c) concludes that X as such is unreal, illusory, or incoherent, without adequately arguing that the strong definition is the only legitimate one.

  The defect is the slide from “X in this extreme sense is impossible” to “X is impossible.” The conclusion depends almost entirely on the choice of definition, not on evidence about the world.

  Boundary cases matter. If someone explicitly says “I will use ‘libertarian free will’ to mean an undetermined act of self-creation; no such act exists; therefore libertarian free will does not exist,” that is not necessarily fallacious. The conclusion is scoped to the stipulation. The problem arises when they then say “therefore free will is an illusion” without treating ordinary free will on its own terms. Likewise, some concepts really are committed to impossible conditions. “Round square” is an example: showing that nothing can be a round square is not a fallacy. But if ordinary usage and theoretical practice allow a weaker, coherent, useful sense, then maximalizing the definition and declaring the phenomenon dead is an act of semantic legislation, not discovery.

  A diagnostic test: ask whether the argument’s force would survive if the concept were defined in a moderate, ordinary way. If the conclusion depends entirely on the inflated definition, then the move is definitional preclusion. Also ask: “What would count as a real case of X under this definition?” If the answer is “nothing, by definition,” then the argument has not shown that the phenomenon is absent—only that the word has been defined so that it cannot apply.

  **Is it ever legitimate?**

  Yes, sometimes. Insisting on a demanding definition is legitimate when the debate is explicitly about the demanding sense, when the strong definition is not ad hoc but reflects the theoretical or explanatory role the concept is supposed to play, and when the conclusion is scoped accordingly.

  For example, if a philosopher argues that “libertarian free will” requires ultimate self-authorship and then shows that no physical being satisfies that, the conclusion is a legitimate result about libertarian free will. It becomes a fallacy only if the philosopher then denies that there is any other sense of free will worth caring about without argument. Similarly, a theoretical concept like “phlogiston” can be defined by its posited causal role; if that role is shown empty, the concept is out. But that conclusion must come from evidence that the theoretical role is empty, not from stipulating an impossible version and ignoring the actual practices that gave the term meaning.

  The clearest signs of cheating are these:

  1. The maximal definition is treated as obvious or neutral when it is contested.  
  2. The conclusion is exported from the stipulated strong sense to ordinary usage.  
  3. Weaker but recognizable cases are dismissed with “that’s just X, not real X” without an account of why the ordinary concept is committed to the strong conditions.  
  4. The argument does no empirical work—it would prove the same conclusion in any possible world because the definition guaranteed it.

  In your self-deception argument, your friend can have his strong definition if he wants. But he cannot use it to conclude that the ordinary phenomenon you are talking about—compartmentalized or motivated self-deception—does not exist. He owes an argument that those phenomena do not count under the best analysis of ordinary self-deception, not under his maximally paradoxical stipulation. Otherwise he has not explained self-deception away; he has defined it away.
