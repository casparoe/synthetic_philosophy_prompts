answer: |-
  This is not legal advice, but a policy framework you can adapt to your board’s statutes and disciplinary guidelines.

  The core move is to separate two questions:

  1. **What risk did the nurse create by their conduct?**  
     That sets the **outcome-independent base sanction**.

  2. **What actually happened?**  
     That may adjust the sanction, but only within a narrow, pre-defined band.

  That gives the panel a principled compromise: the outcome matters, but it does not fully control the sanction. It also prevents the pure moral-luck problem of letting a death turn a warning-level lapse into revocation, or letting no-harm turn an egregious lapse into a slap on the wrist.

  ---

  ## Sanction levels

  Use these five levels so the panel has a shared vocabulary.

  | Level | Sanction |
  |---|---|
  | **1** | Letter of warning / education |
  | **2** | Reprimand, fine, or practice conditions |
  | **3** | Suspension 30–90 days, plus retraining and probation up to 12 months |
  | **4** | Suspension 6–12 months, or indefinite suspension with reinstatement after conditions; multi-year probation |
  | **5** | Revocation or permanent bar |

  ---

  # The decision procedure

  ## Step 1 — Prove the breach

  **Question:**  
  Has the state proven, by the required disciplinary standard, that the nurse departed from an identifiable standard of care?

  If no, stop. No sanction.

  If yes, write the breach in one sentence.  
  Example: “Failed to check allergy bracelet before administering penicillin.”

  **Sufficient answer:**  
  A clear statement of the specific act or omission, the applicable protocol, and the evidence that the protocol was not followed.

  ---

  ## Step 2 — Assess the risk created, not the outcome

  **Question:**  
  Ignoring what actually happened, what type and magnitude of harm was reasonably foreseeable from this lapse at the time it occurred?

  Use these categories:

  | Risk level | Definition |
  |---|---|
  | **Low** | Minimal or no significant harm likely |
  | **Moderate** | Temporary harm likely |
  | **High** | Serious harm reasonably possible — hospitalization, permanent harm, or death possible but not certain |
  | **Severe** | Death or permanent serious harm likely |

  **Critical instruction:**  
  Do not use the actual outcome. Do not use facts the nurse would only have learned by doing the check they omitted. Assess the risk from the position of a competent nurse *before* the omitted check.

  For example, failing to check an allergy bracelet before giving penicillin is generally **High** risk: the patient may be allergic, and penicillin allergy can cause anaphylaxis. It is not automatically **Severe** unless the nurse had actual knowledge of a life-threatening allergy and gave it anyway.

  **Sufficient answer:**  
  The panel can state in one or two sentences what the worst plausible harm was and why it was reasonably foreseeable.

  ---

  ## Step 3 — Assess the degree of departure

  **Question:**  
  How far below the standard of care did the nurse fall?

  Categories:

  | Departure | Definition |
  |---|---|
  | **Minor** | Technical or documentation lapse; no significant safety risk |
  | **Moderate** | Careless but isolated; ordinary inattention |
  | **Serious** | Bypassed a critical safety check; single episode; no intent to harm |
  | **Egregious** | Reckless, intentional, impaired, concealed, repeated, or ignored known serious risk |

  For a mandatory allergy check that takes seconds and protects against a potentially fatal reaction, a single unintentional failure is usually **Serious**, not Minor.

  **Sufficient answer:**  
  The panel can point to the protocol and say whether the nurse’s conduct was inattention, bypass of a critical safeguard, or something worse.

  ---

  ## Step 4 — Determine the outcome-independent base sanction

  Use this matrix.

  | Risk created ↓ / Departure → | Minor | Moderate | Serious | Egregious |
  |---|---|---|---|---|
  | **Low** | 1 | 1 | 2 | 3 |
  | **Moderate** | 1 | 2 | 3 | 4 |
  | **High** | 2 | 3 | **3** | 5 |
  | **Severe** | 3 | 4 | 4 | 5 |

  Aggravating or mitigating factors about the **conduct** — not the outcome — may move the base sanction one level, but the panel must state the reason.  
  Examples of conduct-only factors: prior similar errors, self-reporting, cooperation, remediation, system failures, distraction, fatigue, lack of training.

  ---

  ## Step 5 — Stop here if there is no causally connected harm

  **Question:**  
  Is there an actual adverse outcome causally connected to the breach?

  If no, or if the harm is minimal, **stop** at the base sanction.  
  This is the **outcome-independent sanction**.

  If yes, go to Step 6.

  ---

  ## Step 6 — Outcome adjustment

  Only apply this step if the actual harm was both:

  1. **Causally connected** to the breach; and  
  2. A **foreseeable type** of harm from the risk the breach created.

  If causation or foreseeability is unclear, no outcome adjustment.

  Then classify the actual harm:

  | Outcome band | Adjustment |
  |---|---|
  | **O0: No or minimal harm** | No adjustment. Final sanction = base sanction. |
  | **O1: Significant but reversible harm** — e.g., hospitalization, ICU, full recovery expected | No level increase, but add conditions or extend probation up to 12 months. |
  | **O2: Death or permanent serious harm** | Increase the base sanction by **exactly one level**. If already Level 5, remain at Level 5. |

  The outcome adjustment is **capped at one level**. A death does not move a Level 1 case to Level 5. A no-harm case does not reduce the base sanction below the matrix level.

  ---

  ## Step 7 — Consistency check

  Before finalizing, ask:

  > Would two nurses with the same risk creation, same departure, and same conduct-only aggravators get the same base sanction?

  If not, adjust. The only remaining difference should come from the bounded outcome adjustment in Step 6.

  ---

  # Honest limitations

  The following are still judgment calls, not pure mechanics:

  - Whether a risk is “High” or “Severe.”
  - Whether a departure is “Serious” or “Egregious.”
  - Whether a harm is “significant but reversible” versus “permanent.”
  - Whether causation is strong enough to trigger Step 6.

  The matrix itself is a policy choice. Other boards could reasonably calibrate the levels differently.

  This procedure also handles poorly:

  - Intentional harm, drug diversion, impairment, sexual misconduct, or concealment — those need a separate track.
  - Systemic failures — understaffing, broken equipment, bad electronic records — because the nurse’s individual lapse may be only part of the story.
  - Cases with multiple errors across time — the matrix is designed for a single episode.
  - Jurisdictions with mandatory minimum sanctions for death or permanent harm — the procedure cannot override statute.

  ---

  # Worked examples

  ## Case A — Fails to check allergy bracelet; patient has documented allergy; patient dies

  **Step 1:** Breach proven.  
  **Step 2:** Risk = **High**. A competent nurse knows penicillin can cause fatal anaphylaxis, and the patient’s allergy status was unverified because the nurse did not check.  
  **Step 3:** Departure = **Serious**. Single, unintentional bypass of a critical safety check.  
  **Step 4:** Matrix: High + Serious = **Level 3**.  
  Base outcome-independent sanction: **60-day suspension, medication-safety retraining, 6 months supervised practice.**

  **Step 5:** There is an actual adverse outcome.  
  **Step 6:** Death = **O2**. Foreseeable and causally connected. Increase by one level.

  **Final sanction: Level 4 — e.g., 9-month suspension or indefinite suspension with reinstatement after conditions, plus extended probation.**

  **Panel note:** Many panels will expect revocation for a death. This procedure does **not** automatically revoke. That is an answer the panel may dislike, but it follows from the capped outcome adjustment. Revocation would require either an **Egregious** departure, actual knowledge, prior history, or a statutory mandate.

  ---

  ## Case B — Same lapse; patient has no allergy; no harm

  **Step 1:** Breach proven.  
  **Step 2:** Risk = **High**, for the same reason as Case A. We do not use the fact that the patient happened not to be allergic. That would smuggle in moral luck.  
  **Step 3:** Departure = **Serious**.  
  **Step 4:** Matrix: High + Serious = **Level 3**.  
  Base sanction: **60-day suspension, medication-safety retraining, 6 months supervised practice.**

  **Step 5:** No causally connected harm.  
  **Step 6:** Not reached.

  **Final sanction: Level 3.**

  **Panel note:** This is the case the panel is least likely to like. The nurse harmed no one, yet receives a substantial suspension. But that is the point: the sanction tracks the **risk created and the departure**, not the lucky absence of harm. If the panel wants no-harm cases to be treated more lightly, it should change the matrix — not make an ad hoc exception.

  ---

  ## Case C — Same lapse; patient has documented allergy; anaphylaxis; full recovery after ICU

  **Step 1:** Breach proven.  
  **Step 2:** Risk = **High**.  
  **Step 3:** Departure = **Serious**.  
  **Step 4:** Matrix: High + Serious = **Level 3**.  
  Base sanction: **60-day suspension, medication-safety retraining, 6 months supervised practice.**

  **Step 5:** Actual harm occurred.  
  **Step 6:** Anaphylaxis requiring ICU but with full recovery = **O1**. No level increase. Add extended probation up to 12 months.

  **Final sanction: Level 3 plus 12 months probation — e.g., 60-day suspension, retraining, supervised practice, and 12 months of chart review.**

  This gives Case C a slightly heavier final sanction than Case B, but the same level. It gives Case A the heaviest sanction, but only by one level over Case B.

  ---

  The procedure thus says: the outcome matters, but only after the conduct has set the floor, and only within a narrow band.

  \answer{Sanction the risk the nurse created and the departure they controlled; let actual harm adjust only within a narrow, pre-defined band.}
