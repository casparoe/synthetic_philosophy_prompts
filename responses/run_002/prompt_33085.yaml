answer: |-
  The phrase is a compressed moral-luck argument, but it can be read in several different ways. Let me disambiguate it.

  I’ll use two possible conclusions your cousin might be drawing:

  - **Weak conclusion:** The drunk driver should not be blamed or punished *more* than an equally drunk, equally reckless driver who happened not to kill anyone.
  - **Strong conclusion:** The drunk driver should not receive serious punishment at all, or should not be treated as a worse person.

  The phrase “there but for the grace of God go I” could express any of the following.

  ---

  ## 1. The humility platitude

  **What it claims:**  
  “I could have been in his position. My not being there is partly luck, not proof that I’m a better person.”

  **Verdict:**  
  True and banal. It’s a healthy moral-emotional check against self-righteousness. But it is not an argument about what the driver deserves.

  **Supports your cousin’s conclusion?**  
  No, or only very weakly. It supports compassion and humility, not reduced blame or punishment.

  ---

  ## 2. The standing objection

  **What it claims:**  
  “You have no right to blame him because you are not morally perfect yourself.”

  **Verdict:**  
  Generally false as a moral argument. A person can be a hypocrite and still speak the truth. The blameworthiness of the driver does not depend on the blamer’s purity.

  **Supports your cousin’s conclusion?**  
  No. It attacks the person making the judgment, not the judgment itself.

  ---

  ## 3. The causal outcome-luck observation

  **What it claims:**  
  “The death depended on factors outside the driver’s control — a pedestrian being on that sidewalk at that moment. Many equally reckless drunk drivers get home without killing anyone.”

  **Verdict:**  
  True enough if we are comparing genuinely identical reckless conduct. But it is also banal as a causal point. In real cases, there may be aggravating differences: how drunk he was, how fast he was driving, whether he had prior warnings, etc.

  **Supports your cousin’s conclusion?**  
  Partially. It establishes that the *outcome* was lucky or unlucky, but by itself it doesn’t tell us whether luck should affect blame or punishment.

  ---

  ## 4. The control principle: punishment should not track luck

  **What it claims:**  
  “Because the death was outside the driver’s control, it is unfair to blame or punish him *more* than an equally reckless drunk driver who didn’t kill anyone. Moral desert should track what was under the agent’s control.”

  **Verdict:**  
  This is the philosophically serious reading. It is a version of the anti-resultant-moral-luck position. It is plausible, but contested. Many philosophers accept that desert should not vary with sheer luck; others argue that outcome luck can legitimately matter.

  **Supports your cousin’s conclusion?**  
  Yes, for the **weak conclusion**. It supports saying: don’t give him extra punishment *merely because* a pedestrian happened to be there.  
  But it does **not** support the strong conclusion. The driver still chose to drive drunk and create a serious risk. That underlying conduct remains culpable and can deserve serious punishment.

  ---

  ## 5. The character-equivalence claim

  **What it claims:**  
  “The driver is not a worse person than the lucky drunk driver. Their characters, choices, and recklessness are the same; only the result differs.”

  **Verdict:**  
  Plausible if the conduct really is identical. But moral and legal blame are not only about global character. We can blame someone for a bad choice even if their character is no worse than many others’.

  **Supports your cousin’s conclusion?**  
  Partially. It supports not treating him as a monster simply because he had a worse outcome. It does not show that he shouldn’t be punished for the reckless act.

  ---

  ## 6. The moderate legal conclusion: punish the risk, not the result

  **What it claims:**  
  “The law should punish the wrongful risk creation — drunk driving — rather than the unlucky result. So the death should not upgrade the charge from DUI to vehicular homicide unless the driver had a culpable mental state toward the death.”

  **Verdict:**  
  This is a respectable retributivist position. But it is also contested, because legal punishment serves more than pure desert: it deters, expresses social condemnation, and responds to victims. Many legal systems therefore do punish outcomes more harshly.

  **Supports your cousin’s conclusion?**  
  Yes for the **weak conclusion**. It would oppose punishing the killer *more than* the lucky drunk driver solely because of the death.  
  It still allows serious punishment for the drunk driving itself.

  ---

  ## 7. The radical no-desert claim

  **What it claims:**  
  “Because everything about a person — genes, upbringing, circumstances, and outcomes — is ultimately a matter of luck or grace, no one ultimately deserves blame or punishment.”

  **Verdict:**  
  Deep but radical and highly controversial. This is the hard moral-luck skeptical view. If accepted, it doesn’t specially excuse this driver; it undermines moral responsibility and punishment generally.

  **Supports your cousin’s conclusion?**  
  Yes for the **strong conclusion**, but only by implying that no one deserves blame or punishment for anything. That is a much larger claim than most people are willing to accept, and it would not give a reason specific to this case.

  ---

  ## 8. The theological grace reading

  **What it claims:**  
  “God’s unmerited grace is the only reason I am not in his position. His failure is ultimately a matter of divine grace withheld.”

  **Verdict:**  
  This may be a sincere religious claim, but as a public moral argument it does no work for people who don’t share the theology. Even within a religious framework, human justice and divine grace can serve different purposes.

  **Supports your cousin’s conclusion?**  
  Only if you accept a specific theological picture. It doesn’t provide a general moral argument.

  ---

  ## 9. The situationist claim: “anyone would have done it”

  **What it claims:**  
  “Under similar circumstances, most people would have driven drunk or made a similar bad choice. So this isn’t evidence of an especially bad character.”

  **Verdict:**  
  There is some psychological evidence that situations influence behavior more than we like to think, but the claim that “most people would do it” is usually an empirical overstatement. And even if many people would do the same, that doesn’t make the act non-culpable.

  **Supports your cousin’s conclusion?**  
  Partially, for reducing character contempt. It does not support eliminating blame or punishment.

  ---

  ## 10. The excuse or deflection

  **What it claims:**  
  “Everyone makes mistakes, so stop blaming him.”

  **Verdict:**  
  False as an argument. It confuses the fact that a failing is common with the claim that it is not culpable. It can also function as a self-serving excuse: “I’ve driven a little drunk too, so let’s not be harsh.”

  **Supports your cousin’s conclusion?**  
  No. This is the reading where the phrase is just an excuse.

  ---

  ## 11. The selective-enforcement objection

  **What it claims:**  
  “Because plenty of equally drunk drivers are not caught or not punished severely, it is arbitrary to punish this one harshly.”

  **Verdict:**  
  There is a real fairness concern about selective enforcement. But the solution is not to let the caught driver off; it is to enforce drunk-driving laws more consistently, or to reconsider the penalties generally.

  **Supports your cousin’s conclusion?**  
  No, or only as a demand for consistency. It does not show that this driver is less deserving of punishment.

  ---

  # Bottom line

  The phrase can be a platitude, a deep point, or an excuse depending on the reading.

  - If your cousin means **#1**, it’s a platitude about humility.
  - If he means **#4** or **#6**, he is making a serious moral-luck point: the death itself should not automatically add extra blame or punishment beyond what the reckless drunk driving deserves.
  - If he means **#7**, he is making a radical skeptical claim that would excuse everyone, not just this driver.
  - If he means **#10**, it’s just an excuse.

  The strongest version of your cousin’s argument is this:

  > The driver deserves serious punishment for drunk driving. But the difference between him and the lucky drunk driver is only the outcome, and outcome luck is a bad basis for extra blame.

  That is a genuine and plausible position. But it does **not** show that the driver deserves no serious punishment. It only challenges the extra punishment attached to the death.
