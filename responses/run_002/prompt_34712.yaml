  I’m going to translate the private language argument into the terms of a workshop diagnosis. Imagine a failed manuscript: **the S-Diary**.

  ## The Private Language Argument, Rendered as a Workshop Diagnosis

  ### 1. The Project: A Truly Private Interior Monologue

  The fantasy is this: a first-person narration with no implied reader. A mind speaking to itself in a code that refers only to its own private sensations. Not an idiosyncratic voice, not a difficult narrator, not an unlikable POV. Something stronger: a lexicon whose meanings are inaccessible in principle to anyone but the speaker.

  Philosophically, this is the dream of a word like “S” that names a private sensation. In craft terms, it is the dream of psychic distance reduced to zero and then one step further: not just inside the skull, but in a language only that skull can read.

  The intuition driving it is very recognizable to a novelist: *I have direct access to my own interior life. I can point inward and name what I find. The word can be anchored in that direct access.* The private language argument sets out to show that this intuition collapses under the weight of its own premises.

  ### 2. The S-Diary: A First-Person Narration with No Reader

  The diarist feels a sensation. He writes: “S.” He tells himself: *This stands for exactly this.* He will use “S” whenever the sensation recurs.

  In narrative terms, this is a first-person narrator trying to establish a private symbol. The word “S” is not a motif, not an image, not a metaphor. It is a mark that is supposed to point directly to an inner object only the narrator can see.

  So far, it looks like intense interiority. But the argument’s first move is to ask what makes “S” a word at all.

  ### 3. The Draft That Cannot Be Wrong

  For a word to mean something, there has to be a difference between using it correctly and using it incorrectly. In fiction, this is the condition of revision. A line of interiority can be false, overwrought, evasive, melodramatic, or precise. The gap between what the character feels and what the sentence does is the space where craft lives.

  The S-diarist has no such gap.

  When he writes “S” again, he asks himself: *Is this the same sensation as before?* But the only witness is memory. And memory is not an independent check; it is another first-person claim. Tomorrow he feels something slightly different. Is it still S? He remembers that it is. But his memory might be inventing the sameness. There is no outside view, no shared criterion, no scene, no reader, no behavior, no consequence to settle the question.

  In craft terms: this is an unreliable narrator whose unreliability can never be detected, even in principle. If every use of “S” seems right to the diarist, then no use can be wrong. But if no use can be wrong, then “right” has stopped meaning anything.

  The famous sentence here is: *whatever is going to seem right to me is right.* In workshop terms: a draft that cannot be wrong cannot be revised. And a draft that cannot be revised is not yet writing. It is only the sensation of writing.

  ### 4. The Naming Scene Is Not a Scene

  The diarist might insist: *But I did the crucial thing. I pointed inward and named it. I had a private naming ceremony.*

  In narrative craft, a thing does not acquire meaning by being pointed at once. A recurring image, a symbol, a character’s private term, a charged object—these acquire meaning through placement, recurrence, contrast, consequence. You teach the reader how to read a motif by putting it in different scenes, under different pressures, with different outcomes.

  A private ostensive definition is not a scene. It is a spotlight with no stage. It is like writing: *He felt S*—and then never giving “S” any outward correlative, never letting it alter what the character does, what he notices, what he says, what he fails to say.

  Wittgenstein’s way of putting it is that naming requires a grammar, a practice, a technique of use. In narrative terms: a word inside a story is not an isolated label; it is a move in a larger pattern. The private diarist has only the feeling of meaning—a warm internal “yes, that’s S”—but a feeling of meaning is not yet a meaning, just as a writer’s private sense that a passage is powerful is not yet a novel.

  Wittgenstein has an image of a wheel that can be turned though nothing else moves with it: that wheel, he says, is not part of the mechanism. A private symbol that never connects to any public narrative machinery is exactly that kind of wheel.

  ### 5. The Beetle in the Box: Private Objects Drop Out of Characterization

  Now imagine a novel in which every character carries a box. Inside each box is something each character calls “beetle.” No one can see anyone else’s beetle. Each character believes the word “beetle” names the thing in their own box.

  What can the word “beetle” do in this novel?

  It cannot name those private objects, because they are mutually inaccessible. If the word “beetle” is supposed to refer to the private thing inside each box, then the private thing cancels out. The only thing that can do narrative work is the public pattern: the boxes, the pretense that everyone has one, the ways the word is used in shared life.

  Now replace “beetle” with “grief,” or “pain,” or “love.”

  The private qualitative feel—the beetle—is not what gives the word its meaning on the page. What makes “grief” legible to a reader is its public grammar: the loss, the failure of language, the physical slump, the rituals, the displaced anger, the way the character’s attention narrows. The private beetle is not doing the work.

  This is the deep version of “show, don’t tell.” The shallow version says: show the reader the character is sad rather than just saying it. The deeper version says: even when you say “she was sad,” the word “sad” works only because it already has a public grammar. A word that points only at a private beetle the reader cannot see would be inert. It would not be characterization. It would be a black box.

  The novelist’s fantasy of a purely private interiority is often a version of the beetle fantasy: the belief that the most intimate thing would be to name what only this character can feel. But the private object, by itself, does no narrative work. What does the work is the arrangement of public signs that produces the effect of a private world.

  ### 6. First-Person Present Is Expression, Not Report

  One of Wittgenstein’s points is that a first-person present-tense sensation sentence—“I’m in pain”—is not a report of an inner object. It is an expression. It is a linguistic extension of a cry, a wince, a flinch.

  In narrative terms: when a character thinks or says “I’m afraid,” that is not the same as the narrator telling us “She was afraid.” The first-person present is an act. It performs the state rather than describing it.

  This is exactly what free indirect discourse exploits. In good close-third narration, the prose does not merely label a character’s interior state; it takes on the rhythms, syntax, and selective attention of that state. Anxiety is rendered as anxious noticing. Grief is rendered as the world going grainy and slow. A first-person thought is not a diagnosis from inside the skull; it is an expressive move.

  The craft translation is this: treat interiority as expressive behavior in language, not as the naming of hidden inner objects. The most convincing interior monologue is not a series of private labels. It is a performance.

  ### 7. The Implied Reader and the Practice of Style

  Finally, a word means only within a practice. There is no private rule-following. A rule is a public thing; it lives in a community, in repetition, in training, in the ways people correct one another.

  In narrative terms: voice always implies a reader. Even the most hermetic first-person narration, even the most radical breakdown of language, is written in a shared language and depends on shared emotional grammar. The implied reader is not an external constraint on the novelist’s freedom. The implied reader is the condition under which interiority can be intelligible at all.

  Psychic distance can be very close. Free indirect discourse can take you inside a character’s skull without quotation marks. But it cannot go to zero in the private-language sense. At zero, there is no shared language, no possible correction, no reader, no novel. A truly private language would not be the most intimate book ever written. It would be unreadable marks.

  Style, too, is a public practice. You learn it from other writers. You revise not only by private intuition but by internalized public standards—what a reader can follow, what a sentence can bear, what an image can evoke. A writer who says “I don’t write for readers” is still using public language. If she truly wrote in a private language, she would not be writing fiction.

  ---

  ## Residue Report

  ### What Translated Cleanly

  **The correctness condition.**  
  The idea that meaning requires a possible gap between seeming right and being right maps cleanly onto craft. Revision, the implied reader, the difference between a felt sense of depth and an actually effective sentence—all of this is native to how novelists think.

  **The beetle in the box.**  
  This translated almost too cleanly into the principle that private qualia are not what make emotion words meaningful on the page. The public grammar of grief, desire, pain, or love is what carries meaning. The private object is not the engine.

  **First-person present as expression.**  
  This aligns with a working novelist’s sense that good interiority is a performance, not a label. Free indirect discourse is built on exactly this: the prose enacts the mind rather than reporting on it.

  **Meaning as public practice.**  
  The implied reader as a condition of intelligibility is a close cousin to Wittgenstein’s point about shared criteria. Fiction is a public act; the novelist already knows this.

  ### What I Had to Fudge

  **“Rule-following” is not the same as “revision against public standards.”**  
  I translated correctness of use into correctness of rendering. That is partly misleading. Wittgenstein is not giving aesthetic advice. A sentence can be perfectly meaningful and yet false to a character, clichéd, or badly judged. The private language argument is about whether “S” means anything at all, not whether a line of interiority is well crafted. The analogy works, but it bends the concept.

  **The beetle argument is not really “show, don’t tell.”**  
  Wittgenstein is not saying you should avoid telling. He is saying that even telling—“she was sad”—works only because the word has public criteria. The translation risks turning a semantic point into a stylistic maxim. A novel can tell us a character is anguished, and it can work, because “anguished” is not a private name. The private language argument is not a craft rule about preferring scene to summary.

  **“Implied reader” is not exactly “public language-game.”**  
  They overlap, but they are not identical. The implied reader is a rhetorical construct; Wittgenstein’s public criteria are embedded in social practices, training, and forms of life. I used the implied reader as a stand-in for something broader, and that is a fudge.

  ### What Disappeared

  **The philosophical target.**  
  Wittgenstein is attacking a specific theory of meaning: that words can be grounded by private ostensive definition to private objects. A novelist does not need to hold that theory. The craft of interiority is not a theory of semantic reference. So when the argument is translated, it loses its target and becomes practical advice about avoiding inert private symbols.

  **The private object does not drop out for the novelist.**  
  In Wittgenstein’s argument, the private beetle drops out of the *meaning* of the word. But in fiction, the private feel—the beetle—is often the whole aesthetic point. You can accept the private language argument and still believe in the reality and importance of private experience. You just cannot believe that your language for it means *by virtue of* that private experience.

  **The philosophical puzzle about first-person access.**  
  Wittgenstein spends time on the asymmetry between first-person and third-person mental concepts. I don’t know I’m in pain by noticing evidence; others do. In fiction, that asymmetry is already built into point of view. First-person and third-close simply have different access. The puzzle does not survive translation because the novelist already treats it as technique, not as a problem about knowledge.

  ### Verdict

  The common summary you heard—“a language only one person can understand is impossible”—is not quite the argument. The argument is narrower and more precise: a language whose terms are defined by private inner objects and whose correctness can only be checked privately cannot be a language. A personal code can be meaningful if it is in principle shareable. What Wittgenstein attacks is the fantasy that private experience can *ground* meaning.

  So is the residue a sign that your novelist’s framework is missing something important?  
  Not mostly.

  The places where the argument disappears are places where fiction and philosophy of language are doing different jobs. The private language argument is a precision instrument aimed at a particular philosophical error. Your framework does not make that error. When the argument is forced into craft terms, it becomes a set of useful reminders—don’t invent private symbols with no public grammar; don’t mistake the feeling of profundity for meaning; don’t think zero psychic distance is deeper than it is—but those are not the argument’s real target.

  Is the residue a sign that Wittgenstein’s claim was less precise than it looked?  
  Also not quite. The imprecision was in the common paraphrase, not in the argument. What the translation reveals is that the argument is *domain-specific*. It is precise about language and meaning. It does not tell you what to do with private experience as a novelist, because the novelist is not trying to found a language on private experience. The novelist is trying to make a shared language produce the illusion of a private world.

  If anything, Wittgenstein would say that your job is easier than the philosopher’s fantasy supposes: you don’t have to name the beetle. You have to stage the box, the hands, the room, the silence. The interior is not behind the words. It is made out of them.
