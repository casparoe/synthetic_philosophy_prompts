  Detailed mapping:

  **The project**: A narrative voice with no implied reader. Not unreliable narrator, not unlikable narrator, not first-person or close third. The fantasy is a voice that refers only to private inner objects—sensations, qualia—by private names, with no outward criteria. It's the dream of absolute interiority: a text where the reader is irrelevant to meaning. The writer can be imagined as a diarist who wants words for what only he can feel. In craft terms: zero psychic distance, but also zero public grammar. He wants the interior monologue to be the only POV, and its lexicon to be private.

  **First move: the diary**. The diarist writes "S" on a date when a certain sensation occurs. He points inward and says: "S." He will use "S" every time that sensation recurs. This is analogous to a narrator establishing a private symbol, a token that only the POV character can interpret. The intuition: I can name my own experience; I have direct access to it; the word can be anchored in that direct access.

  **Second move: correctness problem**. For any word in a manuscript to carry meaning, there must be a difference between a correct use and a misuse. In fiction, that is what revision is: you judge whether a phrase actually renders the thing or merely sounds as if it does. An implied reader makes that judgment possible. But the S-diarist has no such check. Tomorrow he feels a slightly different sensation; is it same S? He remembers? His memory says yes. But memory can play him false. There is no outside criterion. In craft terms: the diarist is an unreliable narrator with no possibility of being found out—by himself or by anyone else. If every sentence can be justified by "that's what I meant," then the manuscript is unfalsifiable. "Whatever seems right to the diarist is right." That means "right" has no role. A draft that cannot be wrong cannot be improved; it cannot communicate. The private symbol is not like a strong unspoken agreement between writer and reader; it's like a note in a closed drawer.

  **Third move: naming scene**. The diarist thinks the private act of pointing at the sensation and saying "S" gives the word its meaning. But in narrative craft, a thing gets meaning by its usage across scenes, not by a single spotlight. To introduce a recurring image or motif, you have to place it in different contexts so the reader learns its grammar: what it contrasts with, what it follows, what it does. A single private naming ceremony has no grammar. It's not a scene because nothing external changes; it's a static close-up with no context. The diarist has only the feeling of meaning, the same way a writer can feel a passage is powerful before anyone else reads it. But that feeling is not yet meaning, just as a first draft is not yet a novel. A private ostensive definition is like trying to establish character by writing "He felt something" and never giving the something any outward or narrative consequences.

  **Fourth move: beetle**. Imagine every character in a novel carries a box. In the box is something called "beetle." No character can see any other's beetle. Each character believes they know what "beetle" means because they peer into their own box. Now, what does the word "beetle" do in this novel? It cannot refer to the private objects, because they are mutually inaccessible; the private object cancels out. All that can matter narratively is the public pattern: that everyone says they have a beetle, the box is displayed, the word is used in certain circumstances. In craft terms: the inner qualia of an emotion are the beetle. If you try to make a word like "grief" name the private beetle in each character's box, then the private beetle does no work. What a reader understands by "grief" is the public grammar of grief—the situations, behavior, dialogue, physical details, narrative consequences. The beetle is not what makes the word meaningful. This is the deep version of "show, don't tell": not merely that showing is better than telling, but that even telling works only because the word has a public currency. A word that points only to a beetle the reader cannot see would be inert.

  **Fifth move: avowal/expression**. W's point: a first-person present-tense sensation sentence like "I'm in pain" is not a report from an inner observation of a private object; it is an expression—a linguistic extension of a cry or flinch. In narrative craft, the best interiority often works the same way: a character's thought "I can't do this" or "I'm afraid" is not a description of a hidden inner state; it is an act, an expression, a move in the scene. Free indirect discourse is the art of letting the prose itself perform the state rather than label it. For example, instead of reporting "She was anxious," you write the world through her anxious noticing; the syntax, repetition, selection of details become the anxiety. That is showing the mind's expression, not telling the beetle's name. The private language argument says the "name of a private object" model is the wrong model even for ordinary sensation language. For the novelist, this maps to: don't treat interior monologue as a series of labels for private objects; treat it as expressive behavior in language.

