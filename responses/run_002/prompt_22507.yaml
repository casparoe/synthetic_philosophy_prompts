answer: |-
  Your intuition is exactly the intuition behind the usual proof of Zorn’s lemma from the axiom of choice. But the proof breaks down at the word “move.”

  Let \(P\) be a nonempty poset. If \(x\in P\) is not maximal, then the set

  \[
  S_x=\{y\in P: y>x\}
  \]

  is nonempty. So for any fixed nonmaximal \(x\), you can say “there exists some \(y>x\).” But to iterate your process, you need to choose a particular \(y\) for each nonmaximal \(x\). In other words, you need a function

  \[
  f:\{x\in P: x\text{ not maximal}\}\to P
  \]

  with \(f(x)\in S_x\). That is exactly a choice function for the family \(\{S_x\}\). ZF does not guarantee that such a choice function exists. The statement “whenever a strictly larger one exists, move to it” smuggles in infinitely many arbitrary choices.

  Even if you had such a choice function and built an infinite increasing sequence

  \[
  a_0<a_1<a_2<\cdots,
  \]

  the chain condition does not stop the process. The chain \(\{a_0,a_1,\ldots\}\) has an upper bound \(u\). If \(u\) is maximal, you are done. But if \(u\) is not maximal, there is some \(v>u\), and then \(v\) is also an upper bound of the chain, so you can continue. Thus the chain condition is not a stopping rule; it is exactly what allows the process to continue through limit stages.

  The real proof of Zorn’s lemma using AC proceeds by transfinite recursion. Assume there is no maximal element. Using a choice function, choose a strict upper bound for every chain, and then define a strictly increasing sequence indexed by all ordinals:

  \[
  a_\alpha = \text{a strict upper bound of }\{a_\beta:\beta<\alpha\}.
  \]

  This would give an injection from the class of all ordinals into \(P\), which is impossible by Hartogs’ theorem. Hence a maximal element must exist. But this construction requires a choice function to select the strict upper bounds.

  The failure is not merely a formalization artifact. Zorn’s lemma is equivalent to the axiom of choice over ZF. To see why, let \(\{A_i:i\in I\}\) be any family of nonempty sets. Consider the poset of partial choice functions

  \[
  Q=\{ f:J\to \bigcup_{i\in I} A_i : J\subseteq I,\ f(i)\in A_i\},
  \]

  ordered by extension. Every chain in \(Q\) has an upper bound: its union. If \(Q\) had a maximal element, that maximal element would have to be defined on all of \(I\); otherwise you could extend it by one more index. Thus a maximal element of \(Q\) is exactly a choice function for the whole family.

  So if Zorn’s lemma were provable in ZF, then AC would be provable in ZF. But AC is independent of ZF: if ZF is consistent, there are models of \(ZF+\neg AC\). In such a model, there is a family of nonempty sets with no choice function, and the poset \(Q\) above has every chain bounded but no maximal element. Thus the “just keep picking” argument fails in a real set-theoretic sense, not merely because of a formal detail.
