  Here’s one way I’d frame it for the seminar: Lewis gives you the best available anatomy of the conch rule, but *Lord of the Flies* is not just an illustration of Lewis—it’s a pressure test. The novel confirms the core mechanics of convention, but it also exposes two places where Lewis’s account needs serious supplementation: the moralization of arbitrary rules, and the fragility of conventions when the underlying motivational landscape changes.

  ## 1. Where Lewis gets the island right: the conch as a convention

  The conch rule is about as clean a Lewisian convention as you could want.

  It is a regularity in behavior: whoever holds the conch speaks; everyone else listens. It solves a recurrent coordination problem: at assemblies, the boys need a way to determine who talks when. It is arbitrary: a stick, a raised hand, a hat, or a stone would work just as well. And it is self-enforcing under the right conditions: once the boys expect others to respect the conch, each has good reason to respect it too, because talking over one another produces chaos that no one wants.

  For Lewis, the key ingredient is common knowledge. The boys must each know that others know that others know—and so on—that the conch is the rule. That is why the first assemblies work. Ralph and Piggy establish a precedent. The conch becomes a focal point. Jack himself initially buys in: “We’re not savages. We’re English; and the English are best at everything. So we’ve got to do the right things.” His later declaration that “the conch doesn’t count on this end of the island” is, in Lewisian terms, an attack on the common-knowledge structure. Once enough boys no longer expect others to respect the conch, the equilibrium unravels.

  So far, Lewis does very well.

  ## 2. The problem of normativity: from useful rule to sacred object

  Where Lewis runs into trouble is with the phenomenology of the boys’ rule-following.

  Lewis’s official story is that a convention becomes a norm when it is supported by sanctions. The reasoning is straightforward: if others will punish me for violating the regularity, then I have an additional incentive to comply. But this misses what Golding actually shows.

  The conch is not merely a useful coordination device. It quickly becomes quasi-sacred. Ralph says, “We’ll have rules!” Jack says, “We’ll have rules!” The boys treat the conch as something more than an arbitrarily chosen turn-taking mechanism. When someone speaks out of turn, the response is not just “this is inefficient” but “you can’t do that.” When Jack smashes the conch, it is not just a coordination failure. Piggy dies with the conch in his arms. The object carries a weight that cannot be reduced to “this is the equilibrium we happen to be in.”

  Lewis can say, if you like, that at that point the conch is no longer merely a convention but a norm. But the explanatory problem is how it got there. The boys do not initially follow the conch rule because they fear punishment. There is no real enforcement apparatus in the first assemblies. They follow it because it feels like the right thing to do. And when it is violated, they feel indignation, not merely inconvenience.

  That suggests Lewis is missing something important.

  There are two ways to put the problem.

  ### a. The shallow problem: Lewis leaves out moral psychology

  Lewis’s account of normativity is externalist. It explains why a convention becomes a norm by pointing to sanctions, punishment, and social pressure. But it does not explain why people internalize rules, why they feel guilt when they break them, or why they feel righteous anger when others break them.

  Piggy is the great counterexample to a purely sanction-based story. Even after the conch has lost its coordinating power, Piggy continues to appeal to it: “I got the conch!” He treats the rule as a standard that retains authority even when others are no longer complying. That is not the behavior of someone calculating an equilibrium. It is the behavior of someone who has internalized a norm.

  So Lewis needs a moral psychology: a story about internalization, moral emotions, and the way arbitrary rules come to feel binding.

  ### b. The deeper problem: moralized conventions are no longer merely conventions

  There is also a conceptual issue. If the boys come to treat the conch rule as something they ought to follow categorically—not merely because others are following it—then their behavior no longer fits Lewis’s definition of a convention.

  A Lewisian convention is a regularity that each person follows precisely because they expect others to follow it and prefer to conform conditional on that expectation. But a sacred rule is different. Ralph and Piggy do not treat the conch as valuable only as long as everyone else does. They treat it as valuable in itself. That is why Jack’s rejection of it feels like a sacrilege rather than merely a defection.

  Lewis might reply: “Then you are no longer talking about convention, but about something else—a norm, a moral rule, a sacred object.” That is fair. But if your seminar is about social norms, that something else is exactly what you want to understand.

  The novel suggests that the conch becomes sacred because it is the only symbol of adult order, rational deliberation, and shared community on the island. It is not just a coordination device; it is a representation of the group itself. That is closer to Durkheim than to Lewis. For Durkheim, the sacred object is not sacred because of its own properties, but because it symbolizes the collective. The conch is precisely such an object. When Jack smashes it, he is not merely renouncing a procedure for turn-taking; he is attacking the very idea of a shared order built on mutual recognition.

  So the first major addition Lewis would need is a theory of how arbitrary conventions become symbols, and how those symbols acquire moral force.

  ## 3. The collapse: preference change and the limits of coordination

  The second complication is about the collapse.

  Lewis’s theory has a crisp account of how a convention can collapse: if people no longer expect others to comply, and therefore no longer prefer to comply, the equilibrium disappears. That is part of what happens to the conch. Jack’s noncompliance becomes increasingly visible. The common-knowledge structure erodes. Eventually the rule ceases to function.

  But Golding shows something stronger: the boys’ preferences themselves change.

  Fear of the beast, hunger for meat, the anonymity of face paint, the thrill of the hunt, the desire for belonging—these alter what the boys want. Jack’s group does not simply choose a different convention for running meetings. They choose a different form of life: hunting, chanting, violence, fear. Ralph’s concern for rescue and fire becomes less compelling than Jack’s immediate promise of meat and protection.

  Lewis can formally represent this. If preferences change, the old convention may no longer be an equilibrium. But that is not really an explanation. It merely restates the problem. Lewis treats preferences as exogenous. He has no theory of why they change. Golding, by contrast, makes preference change central: the island does not just block coordination; it reshapes desire.

  The deeper issue is that the boys’ social order is not just a coordination problem. Keeping the fire going, building shelters, hunting, and protecting the littluns involve collective action and conflict, not merely coordination. There are free-rider temptations. There are disagreements over what to do. There are struggles for status and power. The conch rule can handle who speaks at a meeting, but it cannot solve the problem of why Jack should put up with Ralph’s authority or why the hunters should tend the fire when they want to hunt.

  Lewis’s convention apparatus works best when everyone’s interests align: everyone wants to avoid talking over each other. But much of the novel’s social order—and its collapse—turns on conflicts of interest. The fire is a public good. Meat is a rival good. Leadership is a contested good. Those are not coordination problems in Lewis’s sense.

  So the second major addition Lewis would need is a theory of non-coordination problems: collective action, authority, conflict, and power.

  ## 4. What Lewis would have to add

  If I were teaching this, I would not use the novel to refute Lewis. I would use it to show what Lewis can and cannot explain.

  Lewis can explain:
  - why the conch rule emerges,
  - why it is arbitrary,
  - why it works while common knowledge holds,
  - why it unravels when common knowledge erodes.

  Lewis cannot easily explain:
  - why the boys come to treat the conch as sacred,
  - why violations feel like moral violations rather than coordination failures,
  - why the collapse is caused by shifts in fear, hunger, and identity,
  - why the post-conch world is not a different equilibrium but a different kind of social order entirely.

  To make sense of that, a Lewisian account would need at least four additions.

  ### a. Normative expectations and internalization

  We need to distinguish between empirical expectations—what I think others will do—and normative expectations—what I think others think I ought to do. The conch rule is not just an equilibrium; it becomes a norm. That means boys like Piggy and Ralph treat it as a standard, not merely a strategy.

  This requires a story about internalization: how rules become part of one’s self-understanding, so that breaking them produces guilt and seeing them broken produces indignation.

  ### b. Symbolic and sacred meaning

  The conch is not merely a coordination device. It becomes a symbol of civilization, equality, and adult authority. That is why its destruction carries such weight. Lewis needs a theory of how arbitrary objects acquire symbolic meaning and become sacred.

  Here Durkheim, Goffman, or even Burke might help. The conch is a collective representation. When Jack smashes it, he is attacking the collective conscience itself.

  ### c. Endogenous preferences

  Lewis treats preferences as given. Golding shows preferences forming and dissolving under pressure. Fear of the beast makes safety more important than rescue. Hunger makes meat more attractive than fire. Face paint liberates Jack and the hunters from shame and self-consciousness. Those changes are not random shocks; they are produced by the island’s social and emotional dynamics.

  A fuller account would need a moral psychology of how fear, shame, solidarity, and anonymity reshape desire.

  ### d. From coordination to conflict

  Finally, Lewis needs a typology of social situations. Some problems are coordination problems; some are bargaining problems; some are prisoner’s dilemmas; some are pure conflict. The island starts with coordination, but it does not stay there. The fire, the hunt, leadership, and the beast create collective action problems and power struggles. Once those dominate, the conch convention is no longer enough.

  The world of Jack’s tribe is not a Lewisian alternative convention. It is a hierarchy based on fear, charisma, and violence. That is a different kind of order—or disorder—and it requires different theoretical tools.

  ## Conclusion

  I would frame it this way for the seminar: *Lewis gives us the grammar of convention; Golding gives us its pathology.*

  The conch rule is a textbook case of a Lewisian convention. It is arbitrary, it solves a coordination problem, and it works through common knowledge and conditional preferences. But the novel shows that a convention is not enough to hold a society together. It must be moralized, internalized, and protected by more than just the expectation of mutual benefit. And when fear, hunger, and power enter the picture, the whole coordination-game framework can collapse into something much darker.

  So Lewis is not wrong. He is incomplete. The novel does not refute his theory of convention. It shows what convention cannot explain on its own: how arbitrary rules become sacred, and how societies fall apart when the preferences that sustained them begin to shift.
