answer: |-
  Yes, your unease is worth taking seriously—but it’s more of a yellow flag than an automatic red flag. The issue is not really that she asks questions, reflects, or points out inconsistencies. A really good mentor does those things too. The issue is whether the conversation is genuinely open or whether it is a guided tour to a destination she has already chosen.

  A useful way to put it: she may be **working with your actual reasons**, or she may be **routing around them**. The difference is not the technique; it’s what the technique is for.

  ### 1. What motivational interviewing is supposed to be

  Motivational interviewing originated as a way to help people resolve ambivalence about their own goals—for example, someone who wants to stop smoking but keeps smoking. The interviewer’s job is not to impose a goal, but to help the person discover and strengthen their own reasons for change.

  In that context, MI is not manipulative, because the target belongs to the person being interviewed.

  But your team lead seems to be doing something different: she has a preferred decision, she does not state it, and she uses questions until you arrive at it. That is not MI in the original spirit. It is using MI-flavored techniques to manufacture agreement with a managerial agenda.

  ### 2. “Working with your actual reasons” vs. “routing around them”

  You said you keep thinking of it this way but cannot make it precise. Here is one way to sharpen it:

  **Working with your actual reasons** means treating you as a co-reasoner. The other person may challenge you, ask questions, point out inconsistencies, and even argue with you. But they also share their own reasons, remain open to being wrong, and accept that the outcome could go another way. The conversation is reciprocal.

  **Routing around your reasons** means treating your psychology as a mechanism to be guided. The other person does not put their own view on the table for examination. Instead, they use your stated goals, values, and inconsistencies as levers to move you toward a conclusion they have already selected. The conversation is one-way.

  The key tell is this:

  > If your actual reasons genuinely led somewhere else, would she accept that?

  If the answer is no—if she would keep asking questions until you circled back to her preferred outcome—then she is not really working with your reasons. She is using them as a path to her conclusion.

  ### 3. Why disclosure of the method is not enough

  You said she is upfront: “What I’m doing is motivational interviewing; the point is for you to argue your case to yourself.”

  That transparency matters. It is better than pretending to be neutral. But it is incomplete.

  There are two different things that could be disclosed:

  1. **The method:** “I ask questions rather than giving opinions.”
  2. **The target:** “I think you should take on this project, and I want to see if your own reasoning can get you there.”

  She has disclosed the method but not the target. And the target is usually the part that matters for autonomy.

  Imagine a salesperson saying, “I’m going to use social proof and scarcity to sell you this car.” That is transparent about the method, but it does not make the influence non-manipulative. The intent is still to steer you to a predetermined outcome. If anything, the disclosure can lower your guard: “Well, she told me what she’s doing, so it can’t be manipulation.”

  That does not mean she is being malicious. It does mean you cannot fully evaluate what is happening unless you know not just *how* she is influencing you, but *where* she is trying to move you.

  ### 4. How it differs from a really good mentor

  A good mentor might ask Socratic questions, reflect your words back, and help you see contradictions in your thinking. That can look identical from the outside.

  But the difference is in three things:

  #### a. Intent

  A good mentor’s primary aim is to improve your thinking and support your autonomy. Their view is revisable. They may have an opinion, but they are genuinely open to the possibility that your conclusion will differ from theirs.

  Your team lead, as you describe her, has a desired conclusion. Her questions are not exploratory; they are directional.

  #### b. Openness

  A good mentor will usually be willing to say, “Here’s what I think and why.” They may withhold their view for a while to avoid biasing you, but they are not hiding it as a strategy.

  If you ask a good mentor, “What do you think?” you get an answer, or at least a clear explanation of why they are not answering yet.

  If you ask your team lead, “What do you think?” and she deflects or asks another question, that is a sign the conversation is not reciprocal.

  #### c. Accountability

  A good mentor helps you own your decision because you genuinely are the author of it.

  Your team lead may be creating a situation where she owns the target but you own the decision. If the decision goes well, she gets the outcome she wanted. If it goes badly, she can say, “Well, it was your call.”

  That asymmetry is one of the strongest reasons to be cautious.

  A simpler test:

  > Suppose, after all her questions, you say: “I see the case, but I’ve decided to do the opposite.”  
  > Would she accept that? Or would the questioning continue until you changed your mind?

  If the latter, you are not being mentored. You are being steered.

  ### 5. Does the fact that the calls are usually good change anything?

  Not completely.

  It is genuinely relevant that she usually steers you toward decisions you would have made anyway. That suggests she is not harming you in the narrow sense. If she has good judgment and your interests align, the outcomes may be fine.

  But the process still matters, for three reasons.

  First, if you would have made the same call anyway, then the hidden steering was unnecessary. She could have said, “I think you should do X, here’s why.” The fact that she uses a heavier process to produce the same result suggests the process is about something else—ownership, compliance, or reducing resistance.

  Second, you may not always be so aligned. If you get used to her questions as a reliable path to good decisions, you may become less likely to notice when the path is leading somewhere bad or somewhere that is good for her but not for you.

  Third, over time this can erode your ability to tell which reasons are yours. You may start to feel that you arrived at a conclusion yourself, even though the questions were designed to produce that conclusion. That can subtly corrupt your self-trust.

  ### 6. Why people argue about this without converging

  People argue about whether this is manipulation because they are usually arguing about the technique, not the relationship conditions.

  The same technique can be empowering or manipulative depending on:

  - Is the agenda disclosed?
  - Is the conversation genuinely open to a different outcome?
  - Is refusal real?
  - Is the decision ultimately yours?

  Motivational interviewing is not inherently good or bad. It becomes problematic when it is used by a person with power to get you to adopt their preferred outcome while feeling as though you chose it freely.

  So the question is not:

  > “Are questions and reflections manipulative?”

  The question is:

  > “Does she treat your reasoning as a shared process, or as a tool to be guided?”

  ### 7. What to do

  You do not need to accuse her of anything. But you can test the process.

  Try saying something like:

  > “You often ask questions rather than telling me what you think. I appreciate that, but if you already have a preferred outcome, I’d like you to tell me. I can still think it through, but I want to know where the conversation is heading.”

  A good mentor will answer that directly. If she says, “Yes, I think you should take X, but I wanted to see if it fit your goals,” that is actually quite healthy.

  You can also ask:

  > “What if I come out the other way? Would you be okay with that?”


  > “What would be the strongest argument against the direction these questions are pointing?”

  If she is willing to explore both sides, and if she accepts a different conclusion when your reasons genuinely point there, then she may simply be a good coach.

  If she deflects, resists, or keeps steering until you land on her target, then the process is not about your reasoning. It is about manufacturing assent.

  ### 8. Bottom line

  She is not wrong to ask questions. She is not wrong to reflect your goals back to you. She is not wrong to point out inconsistencies.

  But if she has a predetermined decision, hides her own reasoning, and uses your own goals as levers to get you to that decision, then she is not treating you as a co-author of the decision. She is treating you as someone whose psychology needs to be managed.

  A really good mentor helps you think through a decision and may even influence you—but they do not need you to believe the conclusion was yours.

  The transparency matters, but it is not enough. Knowing the method does not tell you the destination.
