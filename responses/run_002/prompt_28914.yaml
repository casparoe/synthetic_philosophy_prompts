  Alright, I need some serious help. I'm a retired population ecologist — I spent forty years modeling density dependence and carrying capacity — and in the last couple years I've gotten into moral philosophy, mostly population ethics. Next month I'm giving a talk at a philosophy department's ethics workshop, and I already know the Q&A is going to be rough. My thesis, more or less: a world with more lives worth living is, other things equal, better than one with fewer, and we should accept at least a weak pronatalist conclusion — not that we're obligated to maximize the number of people, but that adding happy lives is a real moral gain, and many of the standard objections to that don't land the way people think.

  The audience: about fifteen people, mostly value theorists. Two of them work on population ethics full time — one is a dyed-in-the-wool person-affecting theorist who thinks we have no reason to bring happy people into existence, and the other is a total utilitarian who is mostly worried about the Repugnant Conclusion. There's an environmental philosopher whose spent her career arguing that human population growth is a moral disaster and that nature has value beyond human welfare. There's a Kantian who is going to hate the idea of aggregating across possible people. The rest are grad students and generalists who know Parfit's Mere Addition paradox and the non-identity problem but aren't specialists.

  My argument, roughly: (1) if a person's life can be good for them, then two such lives contain more of the same kind of value, not a different kind of value, so there's at least a pro tanto reason to prefer the larger happy population; (2) the Repugnant Conclusion isn't a reductio of the total view, because our revulsion tracks the low quality of the imagined lives, not the number, and every view that avoids it has worse bullets to bite; (3) environmental objections are about resource constraints and distribution, which are contingent features of the actual world, not an argument against the principle that more flourishing lives are good; (4) person-affecting views that deny (1) end up stuck with the procreation asymmetry, which I think is unstable.

