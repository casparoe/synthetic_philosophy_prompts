answer: |-
  Let me be the bad audience for you. The core risk in this talk is not that your conclusion is too weak; it’s that your **premise 1** does a lot of metaphysical and normative work that this room will not grant. You are walking into a room where several people think “more happy lives” is not even a value, one person worries it is a value with absurd implications, one person thinks it is dangerous in practice, and one person thinks the whole summing project is a category mistake.

  Here is what I would prepare for.

  ## 1. Full landscape of likely objections

  Before narrowing, the room could plausibly throw these at you:

  1. **Person-affecting / no beneficiary:** Creating a person makes that person well off, but makes no one *better off*. So there is no value-gain for anyone.
  2. **Repugnant Conclusion:** If you accept total value, enormous numbers of barely worth-living lives swamp excellent lives. Do you accept that or not?
  3. **Average/quality-sensitive views:** Why prefer more people rather than better average lives?
  4. **Non-identity / existence comparison:** “Existence is better for you than nonexistence” may be ill-defined.
  5. **Procreation asymmetry:** We have reason not to create miserable lives, but no reason to create happy ones. That asymmetry may be a datum, not a bug.
  6. **Kantian anti-aggregation:** Persons have dignity, not price. You cannot sum possible persons like utility containers.
  7. **Environmental/resource constraints:** Actual added human lives always have ecological costs.
  8. **Intrinsic nature value:** Even if human lives are good, their aggregate may be bad because it destroys nonhuman value.
  9. **Demandingness / maximizing:** If every extra happy life is a real gain, why is there no duty to procreate as much as possible?
  10. **Mere Addition / equality:** Would you prefer a larger unequal population over a smaller equal one?
  11. **Zero point problem:** Where is the line between a life worth living and not worth living?
  12. **Infinite possible lives:** If each possible happy life is a gain, why are we not required to create infinitely many?
  13. **Speciesism / nonhuman animals:** If more lives worth living are good, why only human lives?
  14. **Reproductive freedom:** Pronatalism, even weak, may threaten women’s autonomy.
  15. **Justice and carbon footprint:** New people consume resources and emit carbon; their creation harms existing people.
  16. **Measurement / interpersonal welfare:** Two lives do not contain “twice” the value unless welfare is cardinal and comparable.

  Most will not be raised as sharply as the top eight below. But the top eight will, I think, cause the most damage.

  ---

  ## 2. The eight most likely and most damaging objections, in order

  ### 1. The person-affecting objection: “Whom is the world better for?”

  **Who raises it:** The person-affecting population ethicist, almost certainly in the first five minutes.

  **How they will put it:**

  > “You say a life can be good for the person who lives it. I grant that. But in the world without that person, there is no one who is worse off. In the world with that person, the only person who is better off is the person you created. So there is no person for whom your ‘gain’ is a gain. You are just declaring that the world is better, but worlds don’t have welfare. People do.”

  **Two-minute reply:**

  > “That’s the strongest version of the objection, and I want to be honest about what I am assuming. I am assuming an *impersonal* component of value: a world can be better not because it is better *for* some particular person, but because it contains more welfare, or more flourishing lives. Here is the case that moves me. Compare two worlds: World A has one flourishing person. World B has that same person flourishing equally, plus a second person whose life is also genuinely worth living. Nothing else differs. I cannot see the second life as morally inert. If you say there is no reason at all to prefer B over A, you are saying the existence of an additional flourishing rational being makes no axiological difference. That is at least as high a price as accepting impersonal value. I can still explain the asymmetry—no duty to create happy lives may be due to demandingness or agent-centered prerogatives—but I am not claiming a particular person is benefited by being created.”

  **Where it is softest:**

  This is the crucial fault line. If the person-affecting theorist simply denies impersonal value, you cannot derive it from their premises. Your reply is an appeal to reflective equilibrium, not a proof. You need the audience to feel that “an extra happy life counts for something” is plausible enough to accept as a starting point. Some will not.

  ---

  ### 2. The total utilitarian: “You can’t dodge the Repugnant Conclusion by gesturing at quality.”

  **Who raises it:** The total utilitarian who is worried about the Repugnant Conclusion. They will be sympathetic to part of your view but will press hard on whether you are actually a totalist.

  **How they will put it:**

  > “You say our revulsion tracks low quality, not number. But the Repugnant Conclusion is not about terrible lives. It is about lives that are genuinely worth living—just barely. If you accept additive total value, then for any population of excellent lives, there is some much larger population of lives just above neutral that is better. Do you accept that or not? If yes, you are biting the bullet. If no, your first premise is false, because two good lives don’t simply add value in the way you suggested.”

  **Two-minute reply:**

  > “I am less sure than you are that the Repugnant Conclusion is a reductio. When I imagine the huge population, I suspect I am not really imagining lives that are genuinely worth living by the end. I am imagining lives of boredom, pain, or deprivation—lives below the threshold. If the lives are stipulated to be above the neutral line, I am prepared to say that there is at least one respect in which the larger population is better. That does not mean it is better all-things-considered, because distribution, rights, ecological limits, and other values matter too. But if the choice is only total welfare, then yes, more total welfare is better. I would rather keep that than adopt average views, which imply adding happy people can make the world worse, or person-affecting views, which give up transitivity.”

  **Where it is softest:**

  If you are not a pure total utilitarian, you need to say exactly what your axiology is. The room will notice that you are defending a limited, pro tanto additive value while refusing the full maximizing consequentialist package. That is defensible, but it is not yet a theory. The total utilitarian will say, “Then you are not a totalist; you are a pluralist with a threshold or a distribution-sensitive view. Tell me the view.” You need at least a sketch.

  ---

  ### 3. The environmental philosopher: “Your *ceteris paribus* clause is a fantasy.”

  **Who raises it:** The environmental philosopher.

  **How they will put it:**

  > “Your principle says more happy lives are good *other things equal*. But in the actual world, other things are never equal. Every human life has an ecological footprint. More humans means more habitat destruction, more climate emissions, more biodiversity loss. And you are assuming that human welfare is the only value. Nature has value beyond human welfare. So your principle is either practically vacuous or dangerous. Which is it?”

  **Two-minute reply:**

  > “I agree that other things are not equal in the actual world. My claim is not that we should maximize human population here and now. It is an axiological claim: absent those effects, more flourishing human lives would be good. That is compatible with thinking that current population growth, or even current population size combined with our consumption patterns, is all-things-considered bad. If nonhuman nature has intrinsic value, I include that as a separate value. The environmental objection is not an objection to the principle that more flourishing lives are good; it is an objection to ignoring other values. I am not ignoring them. I am saying that the reason population growth can be bad is not that there are too many happy people, but that there are too many people causing harm.”

  **Where it is softest:**

  Once you concede that real-world ecological constraints often defeat the pronatalist reason, the audience may ask what practical work your principle does. You need one or two concrete examples where the axiology matters—for instance, resisting the move from “population growth is environmentally harmful” to “human lives are intrinsically bad,” or evaluating family policy under genuinely sustainable conditions. Otherwise you look like you are defending a truth with no application.

  ---

  ### 4. The Kantian: “You are summing persons like utility containers.”

  **Who raises it:** The Kantian.

  **How they will put it:**

  > “Your view treats possible persons as locations of valuable welfare. But rational beings have dignity, not price. Dignity is not additive. Two persons do not give us more dignity than one. You are aggregating across possible people in a way that instrumentalizes them—even before they exist.”

  **Two-minute reply:**

  > “I am not treating any person merely as a means. I am comparing worlds, and in each world I am assuming every person is an end-in-themselves. The question is only whether the existence of another rational being whose ends are furthered is a good thing. I think it is. If you deny that, you need to explain why one flourishing rational life and two flourishing rational lives, other things equal, are equally good. That seems to me to undervalue rational nature, not respect it. Dignity tells me not to sacrifice a person for another; it does not tell me that an extra flourishing person is valueless.”

  **Where it is softest:**

  The Kantian may reject the entire frame of “value of worlds” as opposed to “worth of persons.” If they are hardline, you will not move them. Your best hope is to show that your view can accommodate respect for actual persons as a side constraint. But if they refuse impersonal world-comparisons, you have no common currency.

  ---

  ### 5. The asymmetry objection: “Why is the procreation asymmetry unstable?”

  **Who raises it:** The person-affecting theorist again, or a generalist who finds the asymmetry intuitive.

  **How they will put it:**

  > “You say person-affecting views that deny your premise end up stuck with the procreation asymmetry, and you think that is a problem. But I think the asymmetry is exactly right: no one is wronged by not existing, but a miserable life wrongs the person who lives it. There is no duty to create happy people, but there is a strong duty not to create miserable ones. That’s not an embarrassment; it’s a datum. Why should I trade a robust intuition for your theoretical tidiness?”

  **Two-minute reply:**

  > “I agree that the asymmetry is intuitive. But if a life is genuinely good for the person who lives it, then the asymmetry makes morality strangely hostile to positive goods. It says that creation-related reasons are only negative. I think I can preserve what is right about the asymmetry without denying that happy lives have value. There is a difference between a pro tanto reason and an obligation. I can say: adding a happy life gives the world something good, but no one is required to produce it. That lets me explain why we are permitted not to have children while still saying that, other things equal, a world with more flourishing lives is better. The explanatory burden is on you: why would good lives be reason-generating in one direction only?”

  **Where it is softest:**

  If the person-affecting theorist accepts the asymmetry as bedrock, your demand for explanation may not move them. Many smart people do accept it as bedrock. Your best move is to make the costs vivid: ask them whether, if they could choose between a future with one happy person and a future with that same person plus another equally happy person, they are truly indifferent. If they say yes, you have shown the bullet. If they say no, they have conceded your premise.

  ---

  ### 6. The non-identity / existence comparison objection: “Good for whom compared with what?”

  **Who raises it:** The person-affecting specialist or a generalist who knows non-identity.

  **How they will put it:**

  > “You keep saying a life can be good for the person who lives it. But in the alternative where that person is not created, there is no person. So the comparison ‘existing is better for this person than nonexistence’ is not a real comparison. You are comparing a person to nothing. So premise 1 is not well-formed.”

  **Two-minute reply:**

  > “I will grant that the language ‘better for the person than nonexistence’ is awkward. But I do not need that intrapersonal comparison. I can say: a life is worth living if it contains more goods than evils—if its welfare is positive. That is a property of the life, not a comparative claim about a subject in nonexistence. When I compare worlds, I compare them with respect to whether they contain lives with positive welfare. Non-identity blocks person-based comparisons across possible worlds; it does not block world-based comparisons. The world with an extra flourishing life contains something good that the other world lacks.”

  **Where it is softest:**

  This again assumes impersonal value. It also assumes a meaningful zero point between positive and negative welfare. That is a serious problem in its own right, and the room may push on it.

  ---

  ### 7. The demandingness / maximizing objection: “Why not obligated to have as many children as possible?”

  **Who raises it:** A Kantian or environmental philosopher, or a generalist.

  **How they will put it:**

  > “Suppose I grant that every extra happy life is a real moral gain. Then why isn’t there a duty to have as many children as possible? If more is always better, then childless people are passing up a moral gain. If you say there is no duty, what is your limiting principle? If you add constraints, aren’t they ad hoc?”

  **Two-minute reply:**

  > “Pro tanto value does not directly generate maximizing obligation. There can be agent-centered prerogatives, costs to existing people, ecological limits, rights, and relational constraints. I also reject the claim that every possible gain is something one is obligated to produce. That is true even in ordinary cases: it may be good to write a novel, but I am not obligated to write one. My weak pronatalism is genuinely weak. It might support reducing stigma around parenthood, making childcare affordable, or not treating childlessness as morally superior. It does not require anyone to have children.”

  **Where it is softest:**

  The more side constraints you invoke, the less work your additive premise does. The room will ask whether your overall view is consequentialist or pluralist deontic. If you say pluralist, fine—but then total welfare is just one value among many, and you need to explain how it interacts with the others.

  ---

  ### 8. The Mere Addition / equality objection: “Do you prefer larger unequal worlds?”

  **Who raises it:** A generalist who knows Parfit, or the total utilitarian testing your distributional commitments.

  **How they will put it:**

  > “Your view seems to imply that a world with a large population at moderately positive welfare is better than a smaller population at very high welfare, as long as total welfare is greater. That is the Mere Addition logic. But many people think equality matters. In Parfit’s A and A+, adding extra lives worth living but creating inequality can seem not clearly better. Do you just ignore equality?”

  **Two-minute reply:**

  > “I do not ignore equality; I treat it as a separate moral consideration. If the added lives are genuinely worth living and no existing person is worse off, then I think the addition is pro tanto good. But an egalitarian constraint may make the overall world worse. My point is only that the additional welfare still counts. In ecological terms, adding organisms can increase total biomass while changing the distribution. You can care about both total and distribution without denying either.”

  **Where it is softest:**

  Once you say distribution matters separately, your simple additive premise becomes incomplete. You need at least a sketch of how total welfare and equality trade off. Otherwise the audience will say, “So you are not really a totalist; you have a pluralist axiology with no decision procedure.”

  ---

  ## 3. What you should concede up front

  Do not try to defend these. Concede them early, calmly, and then move on:

  1. **No particular person is made better off by being created in the person-affecting sense.**  
     Say: “I am not claiming that nonexistence was bad for someone, or that an actual person is benefited by creation.”

  2. **You are not a total utilitarian and not committed to maximizing births.**  
     Say: “Total welfare is one pro tanto value among others. I am not proposing that we have a duty to produce as many people as possible.”

  3. **The actual world’s ecological and resource constraints can defeat pronatalist reasons.**  
     Say: “I am not arguing that current population growth is good, all things considered. The environmental objection is often right.”

  4. **Your view depends on an impersonal component of value.**  
     Say: “I am not going to pretend I can derive impersonal value from purely person-affecting premises. I am appealing to reflective equilibrium.”

  5. **The zero point is contested.**  
     Say: “I do not have a fully non-arbitrary account of the neutral level. But every population view needs some threshold or welfare measurement, so this is not unique to mine.”

  That last concession is dangerous, but it is better to say it yourself than to be caught fumbling when someone asks.

  ---

  ## 4. The question you are quietly praying nobody asks

  If I were you, the question I would fear most is:

  > **“So what exactly is the neutral level? You keep saying ‘lives worth living.’ Where is the zero point? Because if your view is additive, everything depends on that line. If I move a life from just above to just below the line, your whole axiology flips. What non-arbitrary account do you have of the difference between a life worth living and one not worth living?”**

  That question is brutal because it is technical, foundational, and hard to answer in two minutes. Your ecology background will not save you. The audience will sense that your entire argument depends on a threshold you cannot precisely define.

  The honest answer is something like:

  > “I accept that the zero point is contested. But I am relying on a rough intuitive threshold: a life is worth living if its positive experiences, achievements, relationships, and projects outweigh its suffering and frustration from the inside. That is vague, but so are most welfare concepts. And every rival view that talks about harm, benefit, or quality of life needs a similar threshold. The fact that the line is vague does not mean there is no line.”

  But do not pretend that fully answers it. It does not. If they push, your best move is to turn it around: ask whether their preferred view has a better account of welfare. They usually do not.

  ---

  ## 5. Strategic bottom line

  Your argument can survive this room if you frame it as a **limited, pluralist, pro tanto axiological thesis**, not as total utilitarianism. Say something like:

  > “I am not claiming that total welfare is the only value, or that we must maximize population. I am claiming only that the existence of a life worth living is, other things equal, a good thing. The strongest objections to that claim either force us into radical person-affecting views, or confuse all-things-considered conclusions with pro tanto reasons.”

  If you pretend to be a hard totalist, the total utilitarian will press the Repugnant Conclusion, the environmental philosopher will press real-world costs, and the Kantian will press aggregation. If you present yourself as a pluralist who only wants one modest axiological claim, you can absorb much of the damage.

  You cannot prove the person-affecting theorist wrong. You can only make them pay the price of their view. So make that price vivid, concede the environment, disclaim maximizing duties, and do not bluff on the zero point.
