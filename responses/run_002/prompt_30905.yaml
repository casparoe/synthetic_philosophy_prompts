  Question:

  "Turing’s 1950 paper describes the child-machine as ‘a notebook ... rather little mechanism, and lots of blank sheets,’ which invites a blank-slate reading. Yet in 'Intelligent Machinery' (1948) and again in 1950 he imagines building and educating a child machine by experimenting with unorganized machines, and he draws an analogy between the child machine and hereditary material and between education and evolution. Write an essay in which you explain what the notebook image does and does not commit Turing to. In doing so, be specific about the roles he assigns to (i) the child machine's initial structure, (ii) random variation, (iii) punishment and reward, and (iv) the teacher. Refer to both texts."

