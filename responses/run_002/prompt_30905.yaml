answer: |-
  **Essay question**

  Turing’s 1950 paper describes the child machine as “a notebook as one buys it from the stationers. Rather little mechanism, and lots of blank sheets.” This invites a blank-slate reading of Turing. Yet in both *Intelligent Machinery* (1948) and the 1950 paper, he also discusses designing the child machine well, experimenting with unorganized machines, and drawing an analogy between the child machine and hereditary material and between education and evolution. Write an essay explaining what the notebook image does and does not commit Turing to. Be specific about the roles he assigns to (i) the child machine’s initial structure, (ii) random variation, (iii) punishment and reward, and (iv) the teacher. Support your interpretation with reference to both texts.

  ---

  **Model answer**

  Turing’s notebook image is easy to misread. When he says the child brain is like a notebook with “rather little mechanism, and lots of blank sheets,” he is not advancing a Lockean tabula rasa. The image is an engineering proposal: instead of directly programming an adult mind, build something with minimal preloaded adult content and let education do the work. The blank sheets stand for memory or state-space not yet written with adult competences. But a notebook is not nothing: it has binding, pages, and a surface that makes writing possible. Turing’s parenthetical comment that “mechanism and writing are from our point of view almost synonymous” shows he is treating “mechanism” as symbolic content or explicit routines, not as physical or computational preconditions. Thus the image commits him to minimizing preloaded knowledge and adult accomplishments, but not to denying an innate learning architecture.

  That initial architecture is exactly what the 1948 report supplies. There Turing describes unorganized machines: networks of simple units with initially random connections and modifiable elements. “Unorganized” means not yet organized for a particular task, not structureless. To be educable, such a machine must have input and output connections, modifiable connections, and a channel for “interference” such as pleasure or pain signals. The 1950 paper presupposes the same point when it treats the child machine as something that can be designed well or badly and improved over successive attempts. The notebook image therefore does not commit Turing to a blank slate. It commits him to distinguishing the child machine’s minimal initial competence from the adult system’s later acquired competence.

  Random variation enters at two levels. In 1948, the initial unorganized network is partly random, so variation provides raw material for learning. In 1950, Turing makes the evolutionary analogy explicit: “Structure of the child machine = hereditary material; Changes of the child machine = mutations; Natural selection = judgment of the experimenter.” Random mutations generate new candidate child-machine designs, but the experimenter is not restricted to random mutations. He can diagnose a weakness and make a directed change. Variation is therefore necessary, but it is subordinate to intelligent selection and redesign.

  Punishment and reward are part of the “interference” that guides an individual learner. In 1948, pleasure and pain signals are applied by the teacher and alter the machine’s modifiable connections, reinforcing or removing behaviors. This is not conditioning of an empty system; it works only because the system already has the right kind of plastic structure. But the teacher has a larger role than applying rewards. In individual education, the teacher supplies tasks, examples, and a curriculum. In the evolutionary process, the teacher or experimenter is the selector who judges whole child machines and, when possible, improves their hereditary structure. Turing’s point that the experimenter’s intelligence can speed up evolution shows that education is not merely blind variation plus reward.

  Turing is therefore a minimalist about initial content, not a blank-slate empiricist. The notebook image commits him to saying that adult competence is mostly written by education rather than preinstalled. It does not commit him to denying initial structure, learning mechanisms, or the evolutionary design of the child machine. The crucial distinction is between the child machine’s initial architecture and the adult system’s acquired competence: the first makes learning possible, the second is its product.

  ---

  **Confidence statement**

  I am highly confident in the broad reading: the notebook image is a heuristic contrast, and Turing is not a pure blank-slate empiricist because he explicitly assigns initial structure, learning mechanisms, and evolutionary selection. My least certain point is the precise role of random variation within the education of a single child machine. Turing clearly uses random variation at the level of initial unorganized networks and across generations of child-machine designs; whether he also means that individual learning proceeds by partly random changes shaped by reward and punishment, or only by more deterministic interference, is less explicit in these two texts.

  ---

  **Marking scheme**

  **A-range answer**

  - Distinguishes methodological minimalism from metaphysical blank-slate empiricism: the notebook image is about dividing labor between child machine and education, not about denying all innate structure.
  - Uses the 1948 report substantively: identifies unorganized machines as initially random but structured networks with modifiable connections; explains that “unorganized” does not mean “structureless.”
  - Uses the 1950 evolutionary analogy precisely, mapping child-machine structure to hereditary material, changes to mutations, and experimenter judgment to natural selection.
  - Notes Turing’s claim that the experimenter can make directed, non-random changes.
  - Assigns distinct roles: initial structure (modifiable architecture, input-output channels, reinforcement interface), random variation (initial network randomness and design mutations), punishment and reward (training signals within a learner), and teacher (curriculum, evaluation, selection, diagnostic redesign).
  - Explicitly distinguishes the child machine’s initial architecture from the adult system’s acquired competence.

  **B-range answer**

  - Correctly denies that Turing is a pure blank-slate empiricist, but mainly because Turing mentions designing the child machine; lacks detailed support from 1948.
  - Mentions the evolution analogy but does not specify its mappings or explain the difference between random and directed mutation.
  - Identifies some roles, such as reward and punishment and the teacher, but treats the teacher mainly as a reward-giver or evaluator, missing the diagnostic and redesigning role.
  - May say that the unorganized machine is random without explaining that it still has structure and modifiability.
  - Reaches the right general conclusion but does not fully separate initial architecture from acquired competence.

  **Common mistakes**

  - Treating Turing as a pure blank-slate empiricist because of the notebook quotation.
  - Assuming that “blank sheets” means no innate structure or learning mechanisms at all.
  - Equating “unorganized” with “completely structureless.”
  - Treating reward and punishment as the whole of education, or as behaviorist conditioning from nothing.
  - Reading the evolution analogy as a loose metaphor rather than a design procedure with specific mappings.
  - Conflating the blankness of the child machine with the blankness of the adult system.
  - Importing later nativism-empiricism debates without grounding the interpretation in Turing’s actual texts.
