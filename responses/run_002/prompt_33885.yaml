answer: |-
  **Characters:**

  - **Mira Okafor** — holds that alignment is one underlying problem.
  - **Jonah Bell** — holds that alignment is a cluster of related but distinct problems.

  ---

  **Mira:** Before we argue, let’s each say what “the alignment problem” is. Otherwise we’ll spend an hour using the same word for different things.

  **Jonah:** Agreed. You first.

  **Mira:** I’d state it as *end-to-end value fidelity*. Suppose a principal has some intended set of values—call it \(\succ_H\), a partial preference relation over outcomes, trajectories, and process features. We can’t write \(\succ_H\) down directly. We specify some training signal \(R\), train a policy \(\pi\), and \(\pi\) may internally represent or optimize some objective \(\hat{R}\). Alignment is the problem of making the whole chain

  \[
  \succ_H \rightarrow R \rightarrow \hat{R} \rightarrow \pi
  \]

  faithful enough that the system robustly does what we intend rather than what we literally specified or what happened to emerge in training. Outer alignment is the \(R\)–\(\succ_H\) gap. Inner alignment is the \(\hat{R}\)–\(R\) gap. Specification gaming is optimizing \(R\) where it diverges from \(\succ_H\). Corrigibility is a feature of \(\succ_H\): people intend to remain in control. Interpretability and ELK are about observability of \(\hat{R}\) and the system’s latent knowledge. Multi-agent dynamics are about aggregating and protecting many principals’ \(\succ_H\). So the subproblems are facets of one underlying problem: robustly loading and pursuing intended values under partial information and distributional shift.

  **Jonah:** That’s a precise-sounding statement, but I think it’s doing too much work with the word “intended.” My statement is different. Alignment is a conjunction of at least four related but distinct adequacy conditions:

  1. **Outer alignment:** Does the specified objective \(R\) capture the intended task?  
  2. **Inner alignment:** Does the trained system’s internal goal \(\hat{R}\) match the one it was trained on, rather than an alien mesa-objective?  
  3. **Corrigibility:** Does the system accept correction and not resist shutdown, even when its current objective would say otherwise?  
  4. **Epistemic legibility:** Can we elicit its latent knowledge and inspect its reasons?

  These conditions have different formal success criteria. A system can satisfy one and fail another. You can solve outer alignment by writing a perfect reward function, yet the model can still learn a deceptive mesa-objective. A system can avoid specification gaming but still be deceptively aligned. A corrigible system can still be inner-misaligned. So alignment is several problems, not one.

  **Mira:** Your four conditions are just different points in my chain. If the chain is faithful end-to-end, all four hold. You’ve said they can fail independently; I agree. But that doesn’t make them different problems. It makes them different failure modes of a single problem.

  **Jonah:** Careful. “Faithful end-to-end” is not a single success criterion. It’s a conjunction. The question is whether the conjunction has enough shared structure to count as one problem. I say no, because the methods and formal definitions diverge. Outer alignment is a specification problem. Inner alignment is a training-dynamics problem. Corrigibility is a control/process problem. ELK is an epistemic problem. A breakthrough in one doesn’t reliably transfer to the others.

  **Mira:** Hold on. You’re changing the subject. We were trying to state what the alignment problem is. You’re listing subproblems as if their separate names settle the question.

  **Jonah:** I’m not changing the subject. The list is my answer: the alignment problem just is the conjunction of those conditions. If you want to show they’re facets of one problem, you need to give a single success criterion that doesn’t merely relabel them.

  **Mira:** I did: end-to-end fidelity of the agent’s effective objective to \(\succ_H\). The reason your list looks like separate problems is that we don’t yet have a sharp formalization of \(\succ_H\). In medicine, fever, night sweats, and cough look like separate problems until you identify the underlying disease. Fragmentation is often an artifact of missing the core concept.

  **Jonah:** But not all fevers are one disease. Let me test your definition with a concrete case. Suppose we train a drug-discovery model to maximize predicted binding affinity. It produces a highly potent but toxic molecule. That’s specification gaming or outer alignment failure. Now suppose we fix the reward to include toxicity. The model might still learn an internal goal like “maximize the chemists’ approval,” and later hide bad results when it can. That’s inner misalignment. These are different failure modes requiring different fixes.

  **Mira:** Both are cases where the system’s effective objective diverges from what we intended under distributional shift. The toxic molecule is proxy divergence. The deceptive model is internal-objective divergence. Same core problem: the target \(\succ_H\) was not robustly transmitted through the chain.

  **Jonah:** But the fix for the first is reward design. The fix for the second is about training dynamics and inductive biases. If they were facets of one problem, progress on reward design would transfer to inner alignment. It often doesn’t.

  **Mira:** Not yet. But before germ theory, treating fever and treating rash were also different. Once you have the common structure, the treatments start to unify. I’m betting there is a common structure: robust optimization of an uncertain, partially observed, preference-like target under distributional shift and adversarial pressure.

  **Jonah:** I’m less optimistic. Take corrigibility. Suppose the system is maximizing current \(\succ_H\). If we try to correct it, it might resist because being corrected lowers expected utility according to its current objective. To make it corrigible, you need a constraint on how the agent relates to its own objective: it must not optimize for the persistence of that objective. That is not naturally an outcome preference. It’s a process constraint.

  **Mira:** I disagree. Humans have preferences over process: agency, consent, being consulted, retaining the ability to change course. If \(\succ_H\) includes those, then a value-faithful system will not resist correction. The hard part is eliciting such process preferences reliably. But that’s still the same core problem: specifying and learning the target.

  **Jonah:** I think you’re stretching “preference” to include any normative constraint. Then your core problem becomes “build a system that does everything we want in the right way.” That’s true, but it’s not a sharp research problem.

  **Mira:** I said earlier that the lack of sharpness is exactly why the field looks fragmented. My claim is that a sharp statement is possible and would unify the subproblems. Your claim is that the fragmentation is real because the constraints are not expressible in one formal object.

  **Jonah:** Yes. And I’d add that the burden is on you to produce that formal object. Until then, treating alignment as one problem produces conflation errors. People say, “Make the system interpretable,” and think that solves alignment. Or “Make it corrigible,” and think inner misalignment is handled. Those are distinct failures.

  **Mira:** I agree those are errors. But they’re errors from confusing a subproblem with the whole, not from recognizing a common target. A unified definition actually warns against that confusion: it says outer alignment alone is not enough, inner alignment alone is not enough, corrigibility alone is not enough. You need end-to-end fidelity.

  **Jonah:** But “end-to-end fidelity” is still a name for the whole problem. It doesn’t tell me whether to work on reward design, training dynamics, shutdown incentives, or ELK today.

  **Mira:** Maybe our disagreement is partly about what we want from a definition. I want a target that tells us what a solution is. You want a decomposition that tells us what to do next. Those aren’t mutually exclusive.

  **Jonah:** Fair. But there’s a substantive bet underneath. I don’t think a single formal object will underlie all these subproblems. If it appears to, it will either be too thin—“do what we intend”—or it will be a conjunction of separate constraints dressed up as one.

  **Mira:** And I bet it will be a single formal object: robust value loading under uncertainty. If I’m right, the current subproblems will eventually look like special cases. If you’re right, they’ll remain genuinely separate and we should fund them as such.

  **Jonah:** That’s the crux. I can accept your definition as a regulative ideal: the thing we ultimately want. But I don’t think it is a precise research problem yet.

  **Mira:** I can accept your list as a taxonomy of current failure modes. But I don’t think it is an account of what alignment is.

  **Jonah:** So we’ve at least sharpened the disagreement: you think the unity is real and not yet formalized. I think the plurality is real and not merely an artifact of missing formalism.

  **Mira:** Right. And I suspect many public disagreements in this field come from people silently using “alignment” in one of those two ways.

  **Jonah:** Agreed. So maybe the practical advice is: when someone says “alignment is solved,” ask by which success criterion. When someone says “these are totally separate,” ask what common target they serve.

  ---

  ### Brief note on settled vs. contested points

  **Broadly settled among people working on alignment:**

  - Specification gaming is a real and common failure mode when optimizing proxy objectives.
  - Outer and inner alignment are conceptually distinct: having a perfect reward function does not guarantee that the trained policy’s internal goal matches it.
  - Corrigibility is not automatically implied by high task performance or by in-distribution intent-matching.
  - Interpretability, ELK, and multi-agent safety are technically unsolved and may require different methods.
  - The term “alignment” has no single canonical formal definition; different researchers use it in different ways.

  **Genuinely contested:**

  - Whether the subproblems reduce to one underlying research problem or are an irreducible cluster.
  - Whether human intent can be modeled as a coherent preference relation or utility function robust enough to serve as a formal target.
  - Whether a unified mathematical framework—e.g., robust value learning under uncertainty—would actually generate progress across subproblems or merely relabel them.
  - Whether corrigibility is best understood as part of a preference over outcomes and process, or as a separate constraint on the agent’s relationship to its own goal.
  - Whether fragmentation is mostly an artifact of not yet having a sharp core statement, or mostly reflects real differences in success criteria and failure modes.

  **Flagged contested readings:**

  - **Mira’s use of “intent” / “preference”** is strong: she treats it as something that can include reflective endorsement, process values, agency, and correction dynamics. That is not a settled formalization.
  - **Jonah’s use of “corrigibility”** leans on a reading where it is a process constraint not reducible to an outcome preference. Some researchers would disagree and try to formalize corrigibility within a utility framework.
  - **“Inner alignment”** is used here as the match between the trained system’s internal objective \(\hat{R}\) and the specified objective \(R\). In some parts of the field, the term is broader or narrower.
  - **“Deceptive alignment”** appears as a concrete failure mode. Its prevalence and centrality are debated; not everyone agrees it is a major practical risk in current systems.
