answer: |-
  The mistake, in short, is to treat a hinge as if it were an ordinary proposition that has failed to find grounds. Wittgenstein’s point is that hinges are not that kind of thing.

  A hinge is not an “ungrounded assumption.” An assumption is something that could in principle be examined, supported, doubted, or replaced within a practice. If I assume that the train will be on time, that assumption can turn out to be false; evidence can be brought for or against it. But a hinge is not playing that role. It is part of the framework that makes such examining, supporting, and doubting possible.

  Take “the earth has existed for many years before my birth.” In ordinary historical or geological inquiry, this is not a hypothesis that we test; it is part of what we use in order to test historical and geological claims. Evidence for a particular historical event is recognized as evidence only against the background that there is a past stretching back before us. If someone demanded that we first prove that the past exists before doing history, we would not know what would count as a proof, because the procedures for proving, documenting, dating, and reasoning about the past already presuppose it. That is why Wittgenstein says:

  > Giving grounds, however, justifying the evidence, comes to an end;—but the end is not certain propositions’ striking us immediately as true, i.e. it is not a kind of seeing on our part; it is our acting, which lies at the bottom of the language-game.  
  > —*On Certainty*, §204

  And:

  > As if giving grounds did not come to an end sometime. But the end is not an ungrounded presupposition: it is an ungrounded way of acting.  
  > —*On Certainty*, §110

  So a hinge is not a proposition we believe for which we lack evidence. It is more like a rule or a norm of our practice. The sentence “I have hands” normally does not function as a report based on evidence. It functions as a paradigm of certainty, something we rely on in countless ways—in acting, in identifying illusions, in teaching the word “hand.” Moore tried to say, “I know I have hands,” and use it as a foundation. Wittgenstein’s response is that in normal circumstances this is not a piece of knowledge at all, because there is no question within which it functions as an answer. In unusual circumstances—after an accident, say—the same sentence could become an ordinary empirical claim. But then it is no longer functioning as a hinge.

  This is why the skeptic’s charge misses its target. The skeptic says: “You have unexamined assumptions, so your system is irrational.” But a hinge is not an unexamined assumption; it is not an assumption at all. It is not a move in the game, but something like the rules of the game or the board on which the game is played. To call a hinge an ungrounded assumption is like calling a rule of chess an ungrounded move. It is not a move.

  Likewise, the system of beliefs is not “built on” hinges in the way a building is built on foundations. A hinge is not a hidden premise from which other beliefs are deduced. It is the axis around which inquiry turns, or the riverbed through which the river of thought flows. The riverbed may change over time, but it does not need to be justified by the river.

  So why isn’t this just prejudice that we are psychologically unable to give up? Because the “cannot” here is not psychological but logical or grammatical. It is not that we feel especially certain. It is that a doubt would not have a coherent role. If I say, “I doubt that the earth existed before my birth,” what would count as evidence for or against that doubt? If I treat all historical records, testimony, geology, and memory as part of what is in question, then I have not formulated a more rigorous empirical inquiry; I have stepped outside the practice within which those words have their sense. The doubt does not grip anything. It is not a possible move in the game; it changes the game or abandons it.

  Wittgenstein puts the point by saying that the game of doubting itself presupposes certainty:

  > The game of doubting itself presupposes certainty.  
  > —*On Certainty*, §115

  That is, doubt is meaningful only where some things stand fast. If you try to doubt everything at once, you no longer have a standard by which to measure doubt.

  So the answer to the worry is not that Wittgenstein concedes the skeptic’s charge and then refuses to care. The answer is that he rejects the picture of rationality that makes the charge seem forceful. According to that picture, a system of belief is rational only if every element is either grounded or derived from grounded premises. But that picture leads straight to infinite regress. Wittgenstein’s alternative is that rationality is a feature of a practice: we give grounds, ask for evidence, criticize, and revise where the practice allows it. The hinges are not irrational; they are the conditions of there being such a thing as rational inquiry at all.

  Thus a hinge is not a prejudice. A prejudice is a claim that is in the space of reasons and is held contrary to or without adequate evidence. A hinge is not in that space. It is shown in what we do, not held as an opinion. It is the taken-for-granted scaffolding that makes evidence, doubt, and grounding possible.
