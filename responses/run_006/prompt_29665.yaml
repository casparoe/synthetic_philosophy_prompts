answer: |-
  ### Essay Question  
  **Rousseau's *Letter to M. d'Alembert* (1758) argues that introducing theater into Geneva would corrupt its civic spirit, regardless of the moral virtue depicted in plays. Reconstruct Rousseau’s core argument by explaining:**  
  1. Why he believes theater *structurally* fails to morally improve spectators, even when plays condemn vice and promote virtue.  
  2. How the concepts of *spectatorial distance* and *amour-propre* create this failure.  
  3. Why he champions civic festivals as superior to theater for cultivating civic virtue in Geneva.  
  4. How Geneva’s specific political and social context—as a small, egalitarian republic—shapes each element of his critique.  

  ---

  ### Model Answer (600 words)  

  Rousseau’s rejection of theater in the *Letter to d’Alembert* stems not from puritanical aversion to art, but from a sophisticated analysis of how theatrical performance *as a social institution* undermines the conditions necessary for civic virtue in a republic like Geneva. His critique targets the *form* of theater, not merely its content, arguing that its inherent structure cultivates passivity, exacerbates destructive *amour-propre*, and dissolves communal bonds—failures absent in participatory civic festivals.  

  **1. Structural Failure of Moral Edification**  
  Rousseau contends that theater cannot improve morals because its efficacy depends on *spectatorial passivity*. Unlike lived experience, the spectator observes moral dilemmas from a position of emotional and physical detachment. This distance prevents genuine moral engagement: "Theater’s tears dry at the exit," Rousseau writes, because spectators experience emotions vicariously without responsibility. Even plays promoting virtue become mere entertainment, reducing ethical lessons to aesthetic consumption. The spectator applauds virtue on stage but feels no compulsion to practice it, as the performance absolves them of accountability. Moral content is irrelevant because the spectator’s role—defined by consumption, not action—ensures passive absorption without transformation.  

  **2. Spectatorial Distance and *Amour-Propre***  
  This passivity activates *amour-propre* (inflamed self-regard reliant on others’ opinions). The darkened theater individuates spectators, turning their focus inward. They judge characters (and actors) not through empathy, but through comparison: "We applaud virtue when we have no fear of practicing it," Rousseau notes, allowing spectators to indulge self-congratulation without self-examination. Meanwhile, actors embody false personas, encouraging spectators to value appearance over authenticity. This fuels social hypocrisy—spectators perform virtue in the theater’s imagined space while neglecting civic duties in reality. *Amour-propre*, amplified by spectatorial isolation, thus corrodes the transparency and sincerity vital to Geneva’s social compact.  

  **3. Civic Festivals as Antidote**  
  Rousseau contrasts theater with Genevan civic festivals, where *participation* replaces spectatorship. In festivals, citizens dance, sing, and compete together in public spaces, dissolving hierarchies and fostering collective joy. This active engagement cultivates *amour de la patrie* (patriotic love), as citizens directly experience their shared identity. Unlike theater’s illusory community, festivals generate authentic social bonds through mutual participation. Rousseau’s vision is explicitly political: festivals reinforce equality, transparency, and communal sovereignty—core republican values threatened by theater’s individualism.  

  **4. Genevan Context**  
  Geneva’s small size, Calvinist austerity, and egalitarian ethos shape Rousseau’s argument. As a fragile republic surrounded by monarchies, Geneva’s survival depends on active citizenship, mutual surveillance, and moral rigor. Theater, a luxury import from Paris, symbolizes foreign decadence and leisure-class values. Its introduction would:  
  - **Erode Equality**: By creating a paid elite (actors) and passive audience, theater introduces artificial hierarchies.  
  - **Privatize Leisure**: Drawing citizens into enclosed theaters replaces public, participatory gatherings with private consumption.  
  - **Import Corruption**: French theater embodies the *moeurs* (customs) of corrupt monarchies, where appearance trumps virtue.  
  For Rousseau, festivals are "innocent spectacles" precisely because they are *of* and *by* the people, reflecting Geneva’s autonomy rather than foreign influence.  

  **Conclusion**  
  Rousseau’s case against theater is thus a defense of Geneva’s republican ethos. Theatrical spectatorship structurally inhibits moral agency by privileging passive emotion over active virtue, while festivals mobilize collective participation to fortify civic identity. The *Letter* is not a treatise on art but a political intervention: it warns that Geneva’s unique social contract cannot withstand the corrosive individualism inherent in the theatrical form.  

  ---

  ### Marking Scheme  
  **A (Excellent) Answer Must:**  
  1. **Explain structural failure**: Argue that theater’s *spectator-performer dynamic*—not content—guarantees moral passivity (e.g., detachment prevents accountability).  
  2. **Analyze *amour-propre***: Show how spectatorial distance transforms moral lessons into opportunities for self-comparison/hypocrisy.  
  3. **Contrast festivals**: Highlight *participation* as generating authentic community vs. theater’s illusory bonds.  
  4. **Integrate Geneva’s context**: Link Rousseau’s aesthetics to Geneva’s republican fragility (e.g., theater imports hierarchy/foreign values).  
  5. **Avoid stock critiques**: No reliance on "theater inflames passions" or "actors are corrupt" without tying these to *structural mechanisms*.  

  **B (Good) Answer Will:**  
  1. **Identify key claims**: Correctly summarize Rousseau’s views on theater’s futility, festivals, and *amour-propre*.  
  2. **Mention Geneva**: Note its relevance but not deeply integrate context into the argument’s logic.  
  3. **Contrast festivals and theater**: Describe differences but not fully explain *why* participation succeeds where spectatorship fails.  
  4. **Partially address structure**: Note spectatorial passivity but not fully dissect *how* it neuters moral content.  

  **C (Adequate) or Below:**  
  - Repeats stock critiques ("theater corrupts morals") without engaging structure or *amour-propre*.  
  - Treats the *Letter* as detached aesthetics, ignoring Geneva’s political context.  
  - Omits analysis of festivals or reduces them to "wholesome fun."  

  ---  
  **Key Distinction**:  
  - **A Answers** show *why* Rousseau thinks theater’s failure is inevitable given human psychology (*amour-propre*) and social form (spectatorship).  
  - **B Answers** report *that* Rousseau thinks theater fails, but lack depth on the mechanisms linking form to outcome.
