prompt: |-
  So I've been going back and forth with some friends in a reading group — half of them are really into evolutionary psychology (the Cosmides, Tooby, Pinker side of things) and the other half keep saying it's all just-so stories, you can't test any of it, it's storytelling dressed up as science. We've been at this for weeks and I'm tired of the ping-pong.

  What I actually want, before I plant a flag, is the desiderata. What does an evolutionary explanation of a psychological trait have to deliver to count as a genuine scientific hypothesis and not a just-so story? I mean the full spec: what kinds of evidence would confirm or disconfirm it, what alternative explanations it has to rule out (byproduct, drift, cultural transmission, exaptation), what constraints from genetics or paleoanthropology it can't contradict, what the explanation has to specify about the ancestral environment and the selection pressure — all of it. For each requirement, give me the reason it's a requirement, not just the label. And then tell me which of these are non-negotiable (fail this and your writing fiction) and which are aspirational (even the best hypotheses only partly meet them).

  If you want to illustrate by scoring a couple of well-known hypotheses against the list — say, disgust-as-pathogen-avoidance or depression-as-rumination-adaptation — that's fine, but the list is what I'm actually after. And if there are pairs of desiderata that pull in opposite directions (where satisfying one makes it harder to satisfy another), flag those — that's the kind of tension I suspect is driving a lot of the fights in the literature, and nobody in my group has laid it out that way yet.
reasoning: |-
  Okay, let me unpack this user's request carefully. They're stuck in a heated debate about evolutionary psychology's scientific validity, and they're asking for clear criteria to evaluate hypotheses - not just opinions, but concrete standards. 

  Hmm, the user seems intellectually sophisticated - they're familiar with concepts like exaptation and drift, and they specifically want to understand why each requirement matters. They're also clearly frustrated with superficial arguments ("tired of the ping-pong"). 

  What they really need is a framework to cut through ideological battles. The mention of "planting a flag" suggests they want to form their own informed position. The disgust and depression examples indicate they'd appreciate concrete applications, but the core ask is systematic criteria.

  I should structure this as a robust checklist with three layers: non-negotiable fundamentals (testability, etc.), essential but challenging elements (like specifying selection pressures), and aspirational ideals (like mathematical models). 

  Key tensions to highlight: The conflict between needing precise adaptive problems (which requires speculative reconstruction of past environments) and demanding testability. Also the challenge of ruling out non-adaptive explanations when we lack ancestral data. 

  For illustrations: Disgust-as-pathogen-avoidance scores well on testability (cross-cultural studies, neural evidence) but struggles with demonstrating actual fitness benefits. Depression-as-rumination is weaker on specifying the exact adaptive problem. 

  Must emphasize that failing non-negotiables makes a hypothesis unscientific, while aspirational standards separate adequate from exceptional science. The user's group probably conflates these levels.
answer: |-
  Here's a comprehensive breakdown of the desiderata for a robust evolutionary psychological hypothesis, designed to elevate it beyond "just-so story" status. I'll outline the requirements, their rationale, their status (Non-Negotiable vs. Aspirational), key tensions, and illustrate with your examples.

  **The Core Desiderata: What Makes an Evolutionary Hypothesis Scientific**

  1.  **Testable Predictions:**
      *   **What:** The hypothesis must generate specific, falsifiable predictions about observable phenomena in the present (behavior, cognition, physiology, development, cross-cultural patterns, neuroscience, etc.).
      *   **Why it's Required:** This is the bedrock of science. Without testability, a hypothesis is indistinguishable from storytelling. Predictions allow empirical confirmation or disconfirmation.
      *   **Status:** **NON-NEGOTIABLE.** Fail this, and it's not science.
      *   **Tension:** Generating *strong*, specific predictions often requires precise specification of the ancestral problem and mechanism, which is hard (see points 4 & 5).

  2.  **Falsifiability:**
      *   **What:** There must be conceivable empirical evidence that could prove the hypothesis wrong. The hypothesis cannot be compatible with all possible outcomes.
      *   **Why it's Required:** Directly linked to testability. A hypothesis immune to counter-evidence is dogma, not science. It must stake its claim on risky predictions.
      *   **Status:** **NON-NEGOTIABLE.** Inherent to being scientific.
      *   **Tension:** Specifying precise evolutionary functions can sometimes lead to hypotheses that are *too* flexible ("shifting just-so stories") if not carefully constrained.

  3.  **Ruling Out Major Alternative Explanations:**
      *   **What:** The hypothesis must explicitly address and provide evidence against plausible non-adaptive or differently adaptive explanations for the trait:
          *   **Byproduct/Spandrel:** Is the trait merely a consequence of another adaptation (e.g., belly button, reading ability exploiting vision/language circuits)?
          *   **Genetic/Cultural Drift:** Could the trait have arisen and persisted due to random chance in genes or cultural transmission?
          *   **Exaptation:** Was the trait originally shaped by selection for a different function and later co-opted for its current role?
          *   **Cultural Transmission:** Can the trait be fully explained by learning, imitation, and cultural norms without invoking evolved mechanisms?
          *   **Phylogenetic Lag:** Is the trait a mismatch, adaptive in a past environment but maladaptive now?
          *   **Current Utility ≠ Evolutionary Function:** Is the trait useful now for reasons unrelated to why it evolved?
      *   **Why it's Required:** The mere fact that a trait *could* be adaptive doesn't mean it *was* shaped by selection for that function. Alternatives are often simpler or more parsimonious. Failure to address them leaves the adaptive story unconvincing.
      *   **Status:** **ESSENTIAL (Near Non-Negotiable).** A hypothesis that ignores major plausible alternatives is severely weakened, often fatally. Demonstrating superiority over alternatives is core to the scientific argument.
      *   **Tension:** Comprehensively ruling out *all* alternatives is often impossible with current data (esp. about the past), making this aspirational in practice, but the *attempt* and evidence *against the most plausible* alternatives is essential.

  4.  **Specification of the Adaptive Problem:**
      *   **What:** Clearly define the *recurrent* environmental challenge or opportunity in the *ancestral* Environment of Evolutionary Adaptedness (EEA) that the trait supposedly solved. This includes:
          *   The nature of the problem (e.g., detecting pathogens, avoiding costly social exclusion, solving coalitional threats).
          *   Why it was fitness-relevant (impact on survival/reproduction).
          *   Evidence that this problem *was* recurrent and significant in the relevant EEA (paleoecology, ethnography, primatology).
      *   **Why it's Required:** Adaptation is problem-specific. Without defining the problem, the "solution" (the trait) lacks context. Vague problems ("survival," "reproduction") lead to vague, unfalsifiable hypotheses. The problem must plausibly exist in the relevant evolutionary timeframe.
      *   **Status:** **ESSENTIAL.** A poorly specified problem undermines the entire functional explanation.
      *   **Tension:** Reconstructing the precise details of the EEA is inherently difficult and relies on indirect evidence (fossils, archaeology, hunter-gatherer studies, primatology). Over-specification risks being wrong; under-specification makes the hypothesis untestable.

  5.  **Specification of the Selection Pressure & Mechanism:**
      *   **What:** Describe *how* variation in the trait would have led to differential survival and reproduction (fitness) *specifically* in relation to the defined adaptive problem. Outline the proposed cognitive/neural/physiological mechanism linking the trait to solving the problem.
      *   **Why it's Required:** Demonstrates the *plausible pathway* of natural selection. It's not enough to say the trait is "good for" something; show *how* possessing it (or a more developed version) directly conferred a fitness advantage over alternatives *in the specific ancestral context*.
      *   **Status:** **ESSENTIAL.** Connects the trait to the problem mechanistically and explains *why* selection would favor it.
      *   **Tension:** Requires detailed understanding of both the trait's operation and the ancestral environment, which is often limited. Also, complex traits often involve multiple interacting mechanisms.

  6.  **Consistency with Known Constraints:**
      *   **What:** The hypothesis must not contradict well-established facts from:
          *   **Genetics:** Is the trait heritable? (Essential for evolution by selection). Is the proposed genetic basis plausible? Does it fit with known rates of mutation, gene flow, etc.?
          *   **Paleoanthropology/Archaeology:** Does the timing of the trait's emergence (if inferable) align with the proposed selective pressure? Is there evidence the proposed problem existed then?
          *   **Neuroscience/Physiology:** Does the proposed mechanism align with known biological structures and processes? (e.g., disgust pathways involving insula/amygdala).
          *   **Developmental Biology:** Is the trait's development consistent with an evolved mechanism (e.g., early emergence, canalization)?
      *   **Why it's Required:** Evolutionary hypotheses exist within a web of established scientific knowledge. Contradicting core facts from related fields invalidates the hypothesis.
      *   **Status:** **NON-NEGOTIABLE.** Contradicting solid evidence from other fields is fatal.
      *   **Tension:** Limited data from deep time (genetics, paleo) can make absolute consistency checks difficult, but outright contradiction must be addressed.

  7.  **Evidence of Special Design/Functional Complexity:**
      *   **What:** Demonstrate that the trait exhibits features that are *unlikely* to have arisen by chance alone and are *efficiently* organized to solve the proposed adaptive problem. This can include:
          *   Complexity, specificity, and precision of the mechanism.
          *   Costliness (physiological, behavioral) implying maintenance by selection.
          *   Reliable development across relevant environments.
          *   Efficiency in solving the specific problem compared to alternatives.
      *   **Why it's Required:** This is the primary evidence *for* adaptation (vs. byproduct or drift). Complex functional organization is the signature of natural selection.
      *   **Status:** **ESSENTIAL (Core to Adaptation Claims).** While difficult to prove definitively, strong evidence of special design is the gold standard for distinguishing adaptations from other evolutionary outcomes.
      *   **Tension:** Demonstrating "unlikelihood by chance" and "efficiency" is challenging. What level of complexity is sufficient? Traits can be complex *byproducts* of other adaptations. This is inherently probabilistic and comparative.

  8.  **Cross-Cultural Robustness (with predicted variation):**
      *   **What:** Evidence that the core mechanism exists across diverse human cultures. Crucially, any *variation* in the trait's expression should be predictable based on ecological or social parameters relevant to the proposed adaptive problem (e.g., pathogen prevalence for disgust).
      *   **Why it's Required:** Universal or predictably varying features are more likely to reflect evolved human nature than culturally specific inventions. Predictable variation based on environmental cues (conditional adaptations) is strong evidence for an evolved function responsive to relevant inputs.
      *   **Status:** **ESSENTIAL/Aspirational.** Universal presence is strong evidence. Predictable variation based on adaptive logic is highly supportive, though comprehensive cross-cultural testing is aspirational.
      *   **Tension:** Cultural variability is immense. Distinguishing evolved core mechanisms from culturally shaped expressions is complex. Lack of universality doesn't *disprove* adaptation (could be conditional or exapted), but universality/predictable variation is strong support.

  9.  **Comparative Evidence (Phylogenetic Context):**
      *   **What:** Does the trait, or a precursor, appear in related species facing similar adaptive problems? Does its complexity/expression correlate with the proposed selection pressure across species?
      *   **Why it's Required:** Provides independent lines of evidence for the plausibility of the adaptive problem and the trait's function. Shows if the solution is phylogenetically widespread or unique to humans.
      *   **Status:** **Aspirational/Valuable.** Highly supportive when available, but not always feasible (especially for uniquely human traits) or necessary if other evidence is strong. Still, ignoring relevant comparative data weakens the hypothesis.

  10. **Mathematical/Computational Modeling:**
      *   **What:** Formal models demonstrating that the proposed trait *would* evolve under plausible conditions of the specified adaptive problem, genetic constraints, population structure, etc.
      *   **Why it's Required:** Provides rigorous proof of concept that the hypothesized selection pressure *could* plausibly produce the trait under reasonable assumptions. Helps rule out logical flaws in the adaptive argument.
      *   **Status:** **Aspirational.** The gold standard for establishing theoretical plausibility, but often complex and not always practical for every hypothesis. Foundational work (e.g., evolutionary game theory models of reciprocity) is crucial for the field.

  **Illustrating with Examples:**

  1.  **Disgust-as-Pathogen-Avoidance:**
      *   **Strengths:**
          *   **Adaptive Problem:** Clearly specified (avoiding pathogens/toxins in food/environment). Strong evidence this was recurrent and fitness-relevant (paleopathology, ethnography).
          *   **Mechanism/Special Design:** Well-defined physiological response (nausea, gag reflex), facial expression, neural correlates (insula). High specificity to cues like spoilage, bodily fluids, insects. Costly false positives (avoiding good food) suggests maintained by selection.
          *   **Testability/Predictions:** Numerous confirmed predictions: sensitivity to pathogen cues, early emergence, cross-cultural universality of core elicitors, heightened disgust during pregnancy, correlation with immune sensitivity, fMRI activation patterns.
          *   **Ruling Out Alternatives:** Strong evidence against being *merely* cultural (universals) or a simple byproduct (specific complex design for avoidance).
          *   **Constraints:** Consistent with neuroscience, physiology, and known pathogen risks in human history.
      *   **Weaknesses/Challenges:**
          *   **Exaptation/Moral Disgust:** The extension to moral disgust requires additional explanation (e.g., co-opting the pathogen system for social avoidance - "behavioral immune system"), which is plausible but adds complexity. Is moral disgust an exaptation or part of the original function?
          *   **Specific Selection Pressure:** Hard to pinpoint the *exact* intensity and timing of selection. Demonstrating *actual historical fitness benefits* is impossible; reliance is on the design evidence and modern proxies.
      *   **Verdict:** **Strong Hypothesis.** Meets most non-negotiables and essentials exceptionally well. Controversies exist at the margins (e.g., moral disgust), but the core pathogen-avoidance function is robust.

  2.  **Depression-as-Rumination-Adaptation (e.g., Andrews & Thomson's Analytical Rumination Hypothesis - ARH):**
      *   **Strengths:**
          *   **Adaptive Problem:** Attempts to specify a complex, recurring problem (solving difficult social or resource-based problems requiring intense, uninterrupted analysis). Identifies potential fitness costs of *not* solving such problems.
          *   **Mechanism/Special Design:** Proposes rumination focuses attention and analysis on the triggering problem. Points to features like social withdrawal, anhedonia (reducing distraction), altered physiology as potentially functional components.
          *   **Testability/Predictions:** Generates predictions: rumination should be problem-focused, correlate with complex problems, lead to problem resolution *in some cases*, specific symptom clusters should align with problem type (social vs. achievement).
      *   **Weaknesses/Challenges:**
          *   **Ruling Out Alternatives:** This is the **major criticism.** Is depression an adaptation, or a harmful dysregulation of low mood (a potentially adaptive signal) or rumination (a potentially adaptive tool in mild forms)? Is it a byproduct of intense stress responses? Evidence for significant impairment makes the "adaptation" label highly contentious. Drift or mismatch are plausible alternatives.
          *   **Special Design:** Demonstrating that the *clinical syndrome* of depression exhibits complex functional organization *specifically designed* for analytical problem-solving is extremely difficult. Much of the evidence (impaired function, suicide risk, immune suppression) strongly suggests *maladaptation* in modern contexts, and possibly dysregulation generally. Is the proposed mechanism efficient?
          *   **Selection Pressure:** Specifying the *net* fitness benefit in the face of obvious severe costs (reduced foraging, caregiving, mating) is challenging. How often did intense rumination *actually* solve problems *better* than alternative strategies, outweighing the costs?
          *   **Cross-Cultural Variation:** While low mood exists universally, the specific "depression" syndrome and its link to complex problem-solving may be culturally variable.
      *   **Verdict:** **Highly Controversial/Weaker Hypothesis.** It generates interesting predictions (a strength), but critically struggles to rule out alternatives (especially byproduct/dysregulation/mismatch) and provide convincing evidence of "special design" *for* complex problem-solving in the clinical form. It illustrates the difficulty of applying adaptationist logic to highly costly, impairing states. Many see it as failing essential desiderata 3 (Ruling Out Alternatives) and 7 (Special Design) for the claim that *clinical depression itself* is an adaptation.

  **Key Tensions Highlighted:**

  1.  **Specificity of Adaptive Problem vs. Testability vs. EEA Uncertainty:** A highly specific problem allows precise predictions but risks being wrong if the EEA reconstruction is inaccurate. A vague problem makes testable predictions hard to generate. (Points 4 & 1).
  2.  **Demonstrating Special Design vs. Ruling Out Alternatives:** Proposing complex functional organization (Point 7) is necessary to argue for adaptation, but it's inherently difficult to prove and requires rigorously ruling out that the complexity isn't a byproduct of other adaptations or constraints (Point 3).
  3.  **Current Utility vs. Evolutionary Function:** It's easy to find a *current* benefit for a trait (Point 3 - "Current Utility ≠ Function"). The hard part is demonstrating that this benefit (or a specific past correlate) was the *selective force* shaping the trait, requiring evidence of special design and historical plausibility (Points 4, 5, 7).
  4.  **Plausibility of Selection Pressure vs. Cost of Trait:** For costly traits (like depression), demonstrating a plausible *net* fitness benefit in the face of those costs (Point 5) is a major hurdle, requiring strong evidence of compensatory advantages and ruling out dysregulation.

  **Planting Your Flag:** Judge hypotheses ruthlessly against the **Non-Negotiables (Testability, Falsifiability, Consistency)** and the **Essentials (Ruling Out Key Alternatives, Specifying Problem & Mechanism, Evidence for Special Design, Cross-Cultural Patterns)**. Be deeply skeptical of hypotheses that fail these, especially if they rely heavily on post-hoc storytelling without strong, risky predictions. Recognize that **Aspirational** goals (comprehensive alternative ruling, perfect EEA reconstruction, phylogenetic evidence, modeling) are often not fully met but represent the ideal to strive for. The best hypotheses in the field (like core disgust) deliver strongly on the first two categories. Controversial ones (like depression-as-adaptation) often stumble critically on Ruling Out Alternatives and Special Design. Understanding these tensions explains much of the academic "ping-pong." Good luck!
