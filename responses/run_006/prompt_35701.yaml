  First, I need to unpack Goodhart's Law beyond the surface-level saying. The user mentioned that a correlation exists regardless of incentives, which is true initially. But when you attach stakes to a metric, human behavior changes. That's the key. People optimize for the metric, not the underlying goal. 

  The user’s example about test scores and learning is classic. Initially, scores might correlate with learning. But when pay is tied to scores, teachers might shift focus. They might teach to the test, narrow the curriculum, or even cheat. These actions break the correlation because the measure (scores) no longer reflects the true goal (learning). 

  The user is also asking if Goodhart's Law is just about cheating. It's more nuanced. Cheating is one response, but there are others, like increasing effort in unproductive ways or gaming the system. For instance, excluding low-performing students from tests boosts scores without improving learning. That's not cheating per se but still distorts the measure.

