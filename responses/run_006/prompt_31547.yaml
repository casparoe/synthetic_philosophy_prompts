prompt: |-
  I cover the courts and ideas for a general-interest magazine, and I have been trying to pin down the interpretive philosophy of a justice on the state's high court. Over several terms she has written the controlling opinions in five cases under a state water-pollution statute that makes it unlawful to discharge any sewage, septic waste, or animal waste into any lake, river, stream, or wetland of the state. Her record is as follows:

  - A municipal sewer district overflowed during a storm and sent raw sewage into a river; she held that this violated the Act.
  - A dairy's manure lagoon overflowed into a stream; she held that this violated the Act and wrote that the Act's evident aim is to protect the state's waters from pollution.
  - A homeowner drained a rain barrel of collected rainwater into a wetland; she held that this did not violate the Act and wrote that the Act's terms are specific and do not reach every liquid that ends up in a waterway.
  - A campground's septic system leaked into a river; she held that this violated the Act.
  - A meatpacking plant discharged process water carrying blood and offal into a stream; she held that this violated the Act, treating the discharge as animal waste within the statutory term.

  Next week the court will hear a case in which a chemical plant discharged process wastewater containing ammonia, phenols, and zinc into a river; the wastewater contains no sewage, septic waste, or animal matter.

  I am less interested in the outcome itself than in the rule she seems to be running. What rule or rules fit her record equally well, and what would each rule predict in the chemical-plant case? Which of the earlier cases is the closest analog under each candidate rule, and which rule do you think best explains her actual pattern? Finally, describe a further hypothetical case—different in kind from the chemical-plant case—that would most cleanly settle which rule she is really following.
reasoning: |-
  Okay, let me start by trying to understand the justice's pattern across these five cases. She's dealing with a state water-pollution statute that prohibits discharging sewage, septic waste, or animal waste into water bodies. The outcomes are mixed: violations in four cases but not in the rain barrel one.

  First, the municipal sewer overflow: raw sewage into a river. Violation. That makes sense since sewage is explicitly listed. Next, the dairy's manure lagoon overflow. Manure is animal waste, so again, clear violation. She even mentions the Act's aim to protect waters from pollution here. 

  Then the rain barrel case. Homeowner drains rainwater into a wetland. No violation. Her reasoning is that the Act's terms are specific and don't cover every liquid. So rainwater isn't one of the listed wastes. 

  Campground septic system leak: septic waste into a river. Violation. Directly covered. 

  Meatpacking plant discharging process water with blood and offal. She treats this as animal waste. Violation. Blood and offal are animal byproducts, so that fits under animal waste. 

  Now, the upcoming case involves a chemical plant discharging wastewater with ammonia, phenols, zinc—no sewage, septic, or animal matter. So the key question is whether her approach is strictly textual or if she considers broader purpose. 

  Looking for possible rules. One rule could be strict textualism: only the listed categories. So chemical discharge isn't listed, so no violation. But in the meatpacking case, she expanded animal waste to include blood and offal. That's a bit flexible. 

  Another rule is purpose-driven: protect waters from pollution. But she didn't apply that to rainwater. Rainwater isn't inherently polluting, so maybe she's looking at both the listed categories and whether the substance is polluting. 

  Hybrid approach: the listed wastes are per se violations, but other substances might be included if functionally similar. But in the rain barrel case, rainwater isn't similar to the listed wastes. The chemical discharge has pollutants, so maybe it would be included. But she emphasized the specific terms in the rain barrel case. 

  Possible rule: substances that are waste by-products of human/animal sanitation or agriculture. Municipal sewage, dairy manure, septic leak, meatpacking offal—all fit. Rainwater isn't a waste by-product in that sense. Chemical plant's discharge is industrial, not sanitation/agriculture. So under this, no violation. 

  Another rule: the statute covers organic waste from biological sources. Sewage, manure, septic, animal offal are organic. Chemical discharge is inorganic, so not covered. Rainwater is also not organic waste. 

  But in the rain barrel case, she didn't just say it's not organic; she said the terms are specific. So maybe it's about the source: human/animal origin. Rainwater is environmental, chemicals are industrial. 

  The closest analog to the chemical case might be the rain barrel. Both involve non-listed substances. But the rain barrel wasn't polluting, while chemicals are. However, she didn't use pollution potential as a factor in the rain barrel decision; she focused on the statute's terms. 

  The meatpacking case is key because she interpreted "animal waste" to include blood and offal, which are animal by-products. That shows she's willing to interpret the terms broadly but within the category. So "animal waste" isn't just manure but other animal-derived wastes. 

  For the chemical plant, since no category fits (not sewage, septic, animal), she might rule no violation, similar to rain barrel. But if she's considering pollution potential, she might stretch it. However, her reasoning in the rain barrel case suggests she sticks to the text. 

  A hypothetical to clarify could be a discharge of vegetable matter from a food processing plant. Not animal waste, not sewage. If she rules no violation, she's sticking to the text. If she rules violation, she's using a broader pollution-based approach.
answer: |-
  Based on the justice's record, three coherent interpretive rules emerge, each fitting her decisions equally well but yielding different predictions for the chemical plant case. Here's a breakdown:

  ### Candidate Rules & Predictions
  1. **Strict Textualism (Literal Categories)**  
     - **Rule**: The Act applies *only* to the explicitly listed wastes ("sewage, septic waste, or animal waste"). Discharges must fit these terms verbatim.  
     - **Prediction for chemical plant**: **No violation** (ammonia/phenols/zinc are not listed).  
     - **Closest analog**: *Rain barrel* (rainwater excluded as not matching textual categories).  
     - **Strength**: Explains all cases perfectly. Her "specific terms" remark in *rain barrel* and categorical treatment in *meatpacking* (stretching "animal waste" only slightly) support this.  

  2. **Functional Equivalence (Waste Similarity)**  
     - **Rule**: The Act covers the *functional class* of biologically active/human-animal sanitation wastes, even if not explicitly named. Includes by-products of sanitation, agriculture, or animal processing.  
     - **Prediction for chemical plant**: **No violation** (industrial chemicals are functionally distinct from biological sanitation wastes).  
     - **Closest analog**: *Meatpacking plant* (blood/offal treated as "animal waste" due to functional similarity to manure).  
     - **Strength**: Explains why *rain barrel* was exempt (rainwater isn’t sanitation waste) but *meatpacking* was included. Consistent with her emphasis on the Act’s "evident aim" in *dairy*.  

  3. **Hybrid Purpose-Textualism (Text + Pollutant Intent)**  
     - **Rule**: The listed wastes are *per se* violations, but unlisted substances violate the Act **only if** they (a) share the *polluting character* of the listed wastes *and* (b) derive from human/animal activity (excluding environmental water).  
     - **Prediction for chemical plant**: **Violation** (chemicals are polluting and anthropogenic, like listed wastes).  
     - **Closest analog**: *Rain barrel* (exempt as non-polluting/natural), contrasted with *meatpacking* (included as polluting).  
     - **Strength**: Balances her textual focus ("specific terms" in *rain barrel*) with purposive reasoning ("evident aim" in *dairy*).  

  ---

  ### Best-Explaining Rule
  **Functional Equivalence** best explains her pattern:  
  - **Why?**  
    - She consistently distinguishes **biological sanitation/agricultural wastes** (municipal sewage, manure, septic leaks, animal by-products) from **non-sanitation liquids** (rainwater).  
    - *Rain barrel* exemption hinges on rainwater being environmental, not waste.  
    - *Meatpacking* inclusion fits expanding "animal waste" to cover *all* animal-derived waste by-products, not just manure.  
    - Avoids overreach into non-biological pollution (industrial chemicals) while honoring textual limits.  
  - **Weakness in other rules**:  
    - *Strict Textualism* struggles with *meatpacking* (blood isn’t literally "animal waste" like manure).  
    - *Hybrid* rule would likely condemn the chemical plant, but her *rain barrel* reasoning prioritizes textual specificity over pollution potential alone.  

  **Prediction for chemical plant**: **No violation** under Functional Equivalence.  

  ---

  ### Hypothetical Case to Settle the Rule
  **Scenario**: A brewery discharges fermentation by-products (yeast, organic sugars) into a wetland. The discharge is non-toxic but depletes oxygen in the water, harming aquatic life. It contains no sewage, septic, or animal matter.  

  - **How it clarifies**:  
    - **If she finds no violation**: Confirms *Functional Equivalence* (non-sanitation biological waste excluded) or *Strict Textualism* (not listed).  
    - **If she finds a violation**: Supports *Hybrid Purpose-Textualism* (focus on polluting effect + human origin).  
  - **Why it works**:  
    - Tests whether "animal waste" is a placeholder for *all* organic pollution (violation) or strictly sanitation/agricultural waste (no violation).  
    - Distinguishes from *rain barrel* (natural water) and *chemical plant* (synthetic), isolating the role of biological vs. industrial sources.  

  This hypothetical pits textual categories against pollution impact for a non-listed organic waste, directly probing her prioritization of the Act’s terms versus its purpose.
