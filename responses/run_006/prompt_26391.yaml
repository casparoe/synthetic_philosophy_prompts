prompt: |-
  I work in the constitutional affairs unit of a small country's parliament. We keep getting proposals to entrench things -- supermajority requirements for tax changes, independent fiscal councils that can veto budgets, constitutional amendments locking in particular policies, sunset clauses that are deliberately hard to remove. Some of these are sensible Ulysses-contract situations where the state is binding itself against foreseeable future weakness. Some are just the current majority trying to tie the hands of future goverments they don't trust. And a lot sit in a grey area where it's genuinely unclear which it is.

  I need a decision procedure my team can run on any entrenchment proposal -- a checklist or flowchart in words -- to sort these into: clearly legitimate precommitment, clearly illegitimate entrenchment, and the cases where the distinction breaks down and a political judgement is needed. The procedure should be grounded in whatever political philosophy and rational-choice theory actually have to say about Ulysses contracts and constitutional precommitment, but it has to be usable by policy officers who haven't read Elster and don't want to.

  The constraints: we typically have about a week to produce an analysis, the stakes are high (these things shape what future parliaments can do), and our output goes to ministers who will ignore anything that looks like a philosophy seminar. The procedure shouldn't require data we can't realistically get in that time.

  I want the procedure to include:
  - The questions to ask, in order, with what counts as a sufficient answer to each
  - Where the procedure stops with a "no, this is just entrenchment of current preferences"
  - Where it stops with a "yes, this is a legitimate precommitment"
  - Where it hands off to political judgement because the theory can't settle it
  - An honest accounting of which steps are themselves value-laden rather than technical, and where the procedure smuggles in a normative commitment the user might not share

  Then run the procedure on three proposals:
  1. A constitutional amendment requiring a two-thirds majority to introduce any new tax, framed as protecting future generations from deficit spending.
  2. An independent central bank with a price-stability mandate that parliament cannot override without a referendum.
  3. A law making it illegal for any future government to privatise the national water utility, with no amendment procedure short of a new constitution.

  I want at least one of these to come out as an answer I won't like -- the procedure should have teeth and shouldn't just ratify whatever my political instincts tell me.
reasoning: |-
  Okay, let's tackle this user's problem. They work in a constitutional affairs unit and need a practical decision procedure for evaluating entrenchment proposals. The user wants to distinguish between legitimate precommitments and illegitimate entrenchment. Their main challenge is creating a tool that's both theoretically grounded and user-friendly for policy officers without a philosophy background.

  First, I need to recall the key theories. Jon Elster's work on Ulysses contracts is essential here—binding oneself against future weakness. Then there's the rational-choice view of precommitment solving collective action problems. But Stephen Holmes' point about self-binding enabling future action is also crucial. The user mentioned proposals like supermajority requirements and independent fiscal councils, which are classic examples.

  The user has constraints: one-week turnaround, high stakes, ministers who dislike academic jargon. So the procedure must be efficient and avoid requiring unavailable data. Also, the output needs to be actionable, not theoretical.

  Building the procedure step-by-step. Start with identifying the problem being solved. If the proposal doesn't address a specific, known future problem, it's likely illegitimate. Then, assess whether the problem involves a genuine commitment problem. That means current decision-makers aren't the ones who'll face the temptation. For example, if politicians now are binding their future selves, that's suspect.

  Next, check if the entrenchment is proportionate. The restraint should match the problem's severity and avoid blocking necessary future actions. Sunset clauses and escape valves are important here. Also, institutional design: is the enforcing body neutral? A fiscal council might be okay, but if it's stacked, that's a red flag.

  The user wants examples tested. Take the first proposal: two-thirds majority for new taxes. Framed as protecting future generations. Step 1: what's the problem? Deficit spending. But is there a commitment problem? Current politicians benefit from spending now and taxing later. Binding future parliaments might be legitimate, but the restraint here is absolute. No new taxes without supermajority? That could cripple future responses to crises. Plus, no sunset clause. Likely illegitimate.

  Second proposal: independent central bank. Classic Ulysses contract. Problem: time inconsistency in monetary policy. Politicians might want to inflate for short-term gain. The central bank is neutral, mandate is clear. Parliament can override via referendum, which is an escape valve. This fits as legitimate precommitment.

  Third proposal: no privatization of water utility ever. Problem? Future governments might sell it off, but is that a commitment problem? Current majority doesn't trust future majorities. The restraint is permanent with no amendment. Even if there's a current consensus, it blocks future democratic choices. No escape valve. This seems illegitimate entrenchment.

  But the user wants one outcome they won't like. The water utility case is clear. However, maybe the tax supermajority could be argued as legitimate if deficit spending is a severe issue. But the procedure flags it as disproportionate. That might challenge a user who supports fiscal restraint.

  The procedure's normative aspects need highlighting. Steps 2 and 4 involve value judgments. Defining "rational action" or "proportionate" isn't neutral. The user must be aware their team's biases could influence these steps.

  Finally, ensuring the procedure is practical. Each step has clear pass/fail criteria. Handoff to politics when it's ambiguous. For the examples, two are clear outcomes, one requires judgment. The water utility case, though, is clearly illegitimate per the steps.
answer: |-
  Here’s a practical decision procedure grounded in political philosophy/rational-choice theory, designed for policy officers. It focuses on **three core principles**:  
  1. **Problem-Specificity**: Legitimate precommitments address identifiable *future collective action problems*.  
  2. **Self-Bindingness**: They must bind *current decision-makers*, not just future opponents.  
  3. **Proportionality & Escape Valves**: Restraints must be narrowly tailored and allow for override in emergencies.  

  ---

  ### **Decision Procedure: Entrenchment Evaluation Checklist**  
  **Ask these questions in order — stop if any "NO" fails legitimacy:**  

  1. **Clear Problem Identification**  
     - *Question:* "Does this target a **specific, foreseeable, and recurrent problem** (e.g., time inconsistency, majoritarian tyranny, short-termism) that undermines rational long-term governance?"  
     - *Sufficient answer:* Concrete examples of the problem occurring elsewhere/earlier; evidence it’s likely to recur (e.g., deficit cycles, hyperinflation).  
     - *Stop if NO → Illegitimate entrenchment* (Vague "future risks" are usually preference-entrenchment).  
     - *Value-judgment:* Defining "rational governance" leans on liberal-democratic norms.  

  2. **Commitment Problem Test**  
     - *Question:* "Is the *current majority* (or their constituents) **vulnerable to future temptation** to act against their own long-term interests? (e.g., future selves wanting deficit spending despite current desire for fiscal restraint)"  
     - *Sufficient answer:* Proof that decision-makers face incentives to deviate from optimal policy later (e.g., electoral pressures for short-term spending).  
     - *Stop if NO → Illegitimate entrenchment* (If only future *opponents* are bound, it’s likely partisan lock-in).  
     - *Technical note:* Requires public choice reasoning (e.g., time inconsistency models).  

  3. **Self-Bindingness Check**  
     - *Question:* "Does this **constrain the current majority** in a way they would rationally accept as protection against their *own* weakness? Or does it only bind others?"  
     - *Sufficient answer:* Mechanisms apply equally to proposers; no asymmetric burden on future governments.  
     - *Stop if NO → Illegitimate entrenchment* (e.g., exempting current policies).  

  4. **Proportionality & Escape Assessment**  
     - *Question:* "Is the restraint **narrowly tailored** to the problem, with **clear emergency override mechanisms** (e.g., sunset clauses, supermajority reversals, referendum)?"  
     - *Sufficient answer:* Scope matches problem severity (e.g., independent central bank for inflation, not all fiscal policy); override exists for existential crises.  
     - *Stop if NO → Illegitimate entrenchment* (Permanent, unamendable rules fail this).  
     - *Value-judgment:* "Proportionality" implies balancing efficiency vs. democratic flexibility.  

  5. **Neutral Enforcement Test**  
     - *Question:* "Is the **enforcing body/institution politically neutral** (e.g., courts, technocratic bodies) with clear, objective criteria?"  
     - *Sufficient answer:* Non-partisan appointment mechanisms; objective decision standards (e.g., inflation targets).  
     - *Stop if NO → Handoff to politics* (Risk of partisan capture).  

  6. **Consensus Baseline**  
     - *Question:* "Is there **cross-partisan or societal consensus** that this problem requires precommitment?"  
     - *Sufficient answer:* Broad expert agreement; historical precedents; multi-party support.  
     - *Stop if NO → Handoff to politics* (Lack of consensus suggests partisan motives).  

  **Outcomes:**  
  - **Legitimate Precommitment**: Passes all 6 questions.  
  - **Illegitimate Entrenchment**: Fails steps 1–4.  
  - **Political Judgment Needed**: Fails steps 5–6 (enforcement/consensus ambiguity).  

  ---

  ### **Application to Proposals**  
  #### **Proposal 1: Constitutional amendment requiring two-thirds majority for new taxes**  
  1. **Problem ID:** Deficit spending is a recurrent problem (e.g., debt crises). **YES**.  
  2. **Commitment Problem:** Current majority *is* vulnerable to future tax-cut pressures. **YES**.  
  3. **Self-Binding:** Applies to future selves equally. **YES**.  
  4. **Proportionality/Escape:** ❌ **NO** — Prevents *any* new tax without supermajority, even during war/pandemics. No emergency override.  
     → **Illegitimate entrenchment**. *Why teeth?* Absolute tax barriers cripple state capacity.  

  #### **Proposal 2: Independent central bank with non-overrideable price-stability mandate (except referendum)**  
  1. **Problem ID:** Time inconsistency of monetary policy (e.g., political pressure for inflation). **YES**.  
  2. **Commitment Problem:** Current govt. benefits from short-term inflation. **YES**.  
  3. **Self-Binding:** Binds current and future governments. **YES**.  
  4. **Proportionality/Escape:** ✅ Narrow mandate (only price stability); referendum allows override. **YES**.  
  5. **Neutral Enforcement:** Central banks are technocratic. **YES**.  
  6. **Consensus:** Widely accepted in political economy. **YES**.  
     → **Legitimate precommitment**.  

  #### **Proposal 3: Permanent law banning water utility privatization, unamendable short of new constitution**  
  1. **Problem ID:** Vague "protection of public goods" — no evidence of recurrent failure. **NO**.  
     → **Illegitimate entrenchment**.  
     *Why teeth?* Fails at step 1: No identifiable commitment problem (future privatization could be rational). Permanent unamendability violates proportionality.  

  ---

  ### **Key Caveats**  
  - **Value-Laden Steps:** Steps 1 (defining "rational governance"), 4 (proportionality), and 6 (consensus) embed liberal-democratic values. A populist government might reject them.  
  - **What’s Smuggled In:** The procedure assumes:  
    - Democracy requires flexibility for future majorities (rejects "dead hand" arguments).  
    - Precommitment is only justified for *systemic* failures, not policy disagreements.  
  - **Real-World Limits:** Relies on observable incentives (step 2) and neutral institutions (step 5) — both may be imperfectly knowable in a week.  

  **Output for Ministers**: One-pager with:  
  - Problem ID (✔/✖)  
  - Self-binding (✔/✖)  
  - Escape valves (✔/✖)  
  - Verdict: Green/Red/Amber light.  
  No theory cited — just checklist outcomes.  

  This separates technical failures (tax proposal’s rigidity, water ban’s vagueness) from political judgments (e.g., central bank’s design). The central bank passes; the tax and water proposals fail — *even if* you support their goals.
