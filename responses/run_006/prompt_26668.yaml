answer: |-
  Here's a decision tree designed to cut through the fog of teleosemantics debates, focusing on the key dilemmas that actually divide positions. It avoids jargon-loaded questions and uses concrete cases. Positions collapse or branch based on answers to foundational problems (Disjunction, Swampman, Normativity).

  **Decision Tree: Naturalizing Mental Representation**

  **Start:** You believe mental states have representational content explicable *entirely* in naturalistic terms (physical, biological, causal, historical – no primitive "aboutness" or irreducible norms).

  ---

  **Question 1 (The Swampman/History Test):**
  > Imagine Swampman: a molecule-for-molecule duplicate of you, created by a freak lightning strike in a swamp, with no evolutionary history or learning history. Does Swampman's "brain state" (identical to your "pain" state) *represent tissue damage*?

  *   **(A) NO, it does not represent tissue damage.** (It might be caused by tissue damage, and cause avoidance, but it lacks the right history to *mean* that.) → **GO TO Question 2**
  *   **(B) YES, it does represent tissue damage.** (Its current causal/functional role or structure is sufficient for content, regardless of history.) → **GO TO Question 3**

  ---

  **Question 2 (Teleology: Etiological Function):**
  > (Assuming History Matters - Answered A to Q1) What determines the *specific* representational content? Is it primarily tied to the *etiological function* (the reason the mechanism was selected/learned)?

  *   **(A) YES.** Content is fixed by what the state-producing mechanism was *selected for* indicating (evolution) or *designed to* detect (learning). → **GO TO Question 2.1**
  *   **(B) NO.** History matters, but the specific content is fixed by something else (e.g., current causal relations optimized for function). → **This position is UNOCCUPIED/UNDEREXPLORED.** (Combining history-dependence with non-etiological content is tricky. Arguably incoherent if history is *only* causal ancestry without function, or attractive only if you have a non-selectionist account of function/normativity. Some "weak" teleosemanticists might lurk here, but it's messy.)

  **Question 2.1 (Consumer vs. Producer):**
  > (Assuming Etiological Teleology - Answered A to Q2) Is content determined by:
  >   a)  What the state is *supposed to be caused by* (Producer Function - e.g., what the detection mechanism was selected to detect)?
  >   b)  What the state is *supposed to cause* (Consumer Function - e.g., what the downstream systems using the state were selected to react to *as if* it indicated)?

  *   **(A) Producer Function (What Causes It).** (e.g., The frog's fly-detector neuron means FLY because it was selected to be caused by flies.) → **This is Producer-Based Teleosemantics (e.g., Papineau, early Millikan interpretations)**. *Prone to Disjunction Problem?* Potentially yes (if flies *and* BBs cause it, what's the "proper" cause?).
  *   **(B) Consumer Function (What It's For).** (e.g., The frog's fly-detector neuron means NUTRIENT because the tongue-flicking mechanism consuming it was selected to catch nutrients, reacting to the state *as if* it meant nutrient. Or, it means SMALL DARK MOVING THING if that's what the consuming mechanism is tuned to.) → **This is Consumer-Based Teleosemantics (Millikan, Neander)**. *Solves Disjunction?* Yes (Content is what the consumer systems *need* it to correspond to for their function to work. BBs are mistakes *relative to the consumer's nutrient-acquisition goal*). *Handles Novel Stimuli?* Yes (If a novel thing triggers the consumer correctly/as needed, it might be represented).

  ---

  **Question 3 (Ahistorical Core Mechanism - Indicator vs. Structure):**
  > (Assuming History Doesn't Matter - Answered B to Q1) What is the core relation establishing content? Is it primarily:

  *   **(A) Reliable Covariation / Causal Indicator Relation.** (State S reliably occurs in the presence of property P, under "normal conditions".) → **GO TO Question 3.1**
  *   **(B) Structural Isomorphism / Mapping Relation.** (The internal state bears a complex structural similarity to, or stands in a systematic mapping relation with, external states of affairs.) → **This is Structural Representation / Mapping Semantics (e.g., early Cummins, O'Brien & Opie, Connectionist "model" views)**. *Handles Misrepresentation?* Difficult (How does a structure "mis-map"? Usually requires appeal to function or norms elsewhere). *Solves Disjunction?* Doesn't directly address it.

  **Question 3.1 (Solving the Disjunction Problem Ahistorically):**
  > (Assuming Indicator Semantics - Answered A to Q3) How do you distinguish the *correct* content (FLY) from disjunctive nonsense (FLY-or-BB) or erroneous content (BB) when a state is *sometimes* caused by P (flies) and *sometimes* caused by non-P (BBs)?

  *   **(A) Asymmetric Dependence:** The state's being caused by non-P (BBs) *depends* on its being caused by P (flies), but not vice-versa. If flies stopped causing it, BBs wouldn't cause it either (maybe the detector mechanism relies on fly features BBs mimic). But if BBs stopped causing it, flies would still cause it. → **This is Asymmetric Dependence (Fodor)**. *Handles Swampman?* Yes (if the asymmetric dependence holds *now*). *Problems:* Defining/cashing out "dependence" non-circularly; handling novel errors; complex causal webs.
  *   **(B) Optimal Conditions / Idealization:** The state means P if it would be caused *only* by P under "optimal" or "ideal" conditions for the system (even if those conditions rarely hold). → **This is Indicator Semantics / Informational Semantics (early Dretske, Stampe, some Fodor)**. *Handles Swampman?* Yes. *Problems:* Defining "optimal/ideal" non-circularly/non-normatively; often requires appeal to *function* (which might smuggle in history/norms).
  *   **(C) Current Use / Functional Role:** The content is fixed by the state's *current* causal role within the cognitive system – what inferences it licenses, what behaviors it drives, etc., irrespective of history or optimality. → **This is Functional Role Semantics / Conceptual Role Semantics (e.g., Harman, Block, Loar)**. *Often NOT considered purely "naturalistic"* in the reductive sense sought here, as it typically relies on *internal* norms of rationality/inference. *Handles Misrepresentation?* Very difficult (inferring falsely is still using the state correctly according to its internal role?). *Solves Disjunction?* Doesn't directly address it; content is holistic. *Not purely naturalistic?* Often accused of not reducing norms.

  ---

  **Leaf Positions & Notes:**

  1.  **Producer-Based Teleosemantics (e.g., Papineau):** (Q1:A, Q2:A, Q2.1:A)
      *   *Pros:* Naturalistic (evolution/learning history), clear link to cause.
      *   *Cons:* Vulnerable to Disjunction Problem (What's the *selected* cause?).

  2.  **Consumer-Based Teleosemantics (e.g., Millikan, Neander):** (Q1:A, Q2:A, Q2.1:B)
      *   *Pros:* Naturalistic, solves Disjunction Problem via consumer need/failure, handles novel stimuli, explains normativity of error (failure of consumer function).
      *   *Cons:* Complex, attribution of "proper function" to consumers can be tricky, content can seem oddly distal (nutrient vs. fly).

  3.  **Asymmetric Dependence (Fodor):** (Q1:B, Q3:A, Q3.1:A)
      *   *Pros:* Ahistorical, solves Disjunction Problem (in principle), focuses on current causal structure.
      *   *Cons:* "Dependence" is hard to define naturalistically; struggles with novel errors; arguably circular or ad-hoc.

  4.  **Indicator Semantics / Optimal Conditions (e.g., early Dretske):** (Q1:B, Q3:A, Q3.1:B)
      *   *Pros:* Ahistorical, intuitive link to information/covariation.
      *   *Cons:* Defining "optimal conditions" non-circularly/non-normatively is extremely difficult; often collapses into teleology.

  5.  **Structural Representation / Mapping Semantics (e.g., Cummins, O'Brien & Opie):** (Q1:B, Q3:B)
      *   *Pros:* Captures complex/systematic representation (e.g., mental models, maps).
      *   *Cons:* Handling misrepresentation is a major hurdle; often needs supplementation by function/causal role; doesn't directly solve Disjunction.

  6.  **Functional Role Semantics:** (Q1:B, Q3:A, Q3.1:C) *Not purely naturalistic/reductive in the intended sense.* Often relies on unreduced norms.

  **Unoccupied/Unexplored Regions:**

  *   **History Matters but Not Etiologically (Q2:B):** Why bother invoking history if not for function/normativity? What *else* could history contribute to content determination non-teleologically? Seems unattractive or unstable. Might edge towards causal history theories, but then why reject Swampman?
  *   **Ahistorical Consumer Teleosemantics:** Could there be a view where Swampman's states have content determined by what his *current* downstream mechanisms "need" the state to correspond to for *their* current causal roles? This is *coherent* but unexplored/unclaimed. It might look like Functional Role Semantics with a consumer twist, inheriting its normativity problems. Probably unattractive to naturalists seeking reduction.

  **Blurred Lines & Collapses:**

  1.  **Consumer Teleosemantics vs. Asymmetric Dependence:** On *some* examples (e.g., the frog), they can converge. If the frog's tongue mechanism *depends* on the fly-detector *only* working for flies (and BB-exploits depend on that), AD might agree with CT that it means FLY. However, the *justification* differs radically (history/function vs. current causal asymmetry). CT handles novel errors better; AD struggles with them. Swampman cleanly separates them.
  2.  **Optimal Conditions vs. Teleology:** Defining "optimal" without smuggling in function/norms is the Achilles' heel. Many argue it inevitably collapses into a form of teleology ("conditions under which the system performs its *function*"). If it avoids this, it becomes vague.
  3.  **Structuralism vs. Others:** Structuralism is often *compatible* with teleology or causal indicators as the source of the mapping rules/norms. Pure structuralism is rare and struggles with core problems.

  **Framing Caveat:**

  This tree *does* frame "naturalizing content" as solving Disjunction and Misrepresentation within a naturalistic framework, which is the dominant project of the theories listed. However, some philosophers (e.g., enactivists, certain pragmatists) might reject this *entire* framing, arguing representation itself is a misguided concept, or that content is essentially normative in a way that *cannot* be "naturalized" reductively. The tree assumes the project is viable and focuses on its internal divisions.

  **How to Use This:**

  1.  Take your intuitions about cases like Swampman, Cosmic-Ray Frog (Q1), Disjunction (Q3.1), and Novel Errors.
  2.  Follow the answers honestly.
  3.  See which leaf you land on. That's your core commitment cluster.
  4.  Read the pros/cons – does it feel right? Does it solve the problems *you* think are crucial?
  5.  Realize your buddy might be oscillating because different cases pull towards different branches, or they haven't settled the core commitments (History? Teleology?).

  This won't capture every nuance, but it forces the major forks that define the landscape. Good luck with round two!
