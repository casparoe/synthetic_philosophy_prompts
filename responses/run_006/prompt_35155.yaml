prompt: |-
  You are a professor of philosophy of mind with expertise on pain, consciousness, and the relationship between neuroscience and philosophical theories of mental states. Please think carefully and work through the following step by step.

  I recently came across a blog post on philosophy of mind that summarized the upshot of pain asymbolia for theories of pain. Here is the relevant passage:

  "Pain asymbolia is a neurological condition (typically caused by lesions to the insular cortex) in which patients can identify noxious stimuli as painful but show no aversion to them. They'll say 'yes, that's painful' while smiling, and they don't withdraw their hand from a hot surface even though they register the heat. This directly refutes the folk view that pain is essentially unpleasant. What it reveals is that pain decomposes into two independent components: a sensory-discriminative component (intensity, location, quality) and an affective-motivational component (the felt badness, the urge to escape). Since these come apart in asymbolia, the badness of pain cannot be intrinsic to the sensation itself — it must be something our brains add on. This is why most philosophers of mind now hold that the awfulness of pain is not a property of the pain state but of our evaluative response to it. An interesting consequence is that, strictly speaking, there is nothing wrong with causing someone pain provided you have pharmacologically or surgically blocked the affective component — the sensory residue is morally neutral. The same reasoning has been extended by some theorists to argue that we could design artificial systems that have the sensory component of pain (functional nociception) without the affective component, and that such systems would not be subjects of moral concern even if they accurately report damage."

  I find the argument intriguing but something about it feels too tidy, and I suspect the blog post is overclaiming. I don't know the literature well enough to identify exactly where. Could you go through this summary and tell me what is accurate, what is a simplification that a careful philosopher would qualify, and what is misleading or outright mistaken? In particular, I'd like to know:

  (1) Does pain asymbolia actually show that the sensory and affective components are "independent," or just that they can be partially dissociated in certain pathological cases?

  (2) Is it true that "most philosophers" now hold that pain's badness is entirely in our evaluative response?

  (3) Does the moral conclusion — that causing someone pain is fine if you block the affect — actually follow from the dissociation claim, or does it smuggle in further assumptions?

  (4) Is the extension to artificial systems and moral concern well-grounded, or does it conflate distinct issues?

  Please start by briefly laying out what pain asymbolia is and what it uncontroversially shows, then address each part of the summary, and finally give an overall verdict on how fair the blog post's characterization is.
