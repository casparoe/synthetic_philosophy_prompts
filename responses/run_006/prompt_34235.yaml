answer: |-
  ## How the Dichotomy Dissolved
  (or, Austin's Unmaking)

  First words divide: two kingdoms standing clear.
  *Here*, vows that wed the air ("I do," "I swear"),
  Or ships baptized by utterance sincere;
  *There*, facts that map what *is* - beyond compare,
  Like cats on mats that claim a truth austere.
  Thus constatives report what's false or right,
  While performatives enact with happy might,
  A clean partition bathed in lecture-light.

  But wait! To *state* "The cat..." is not inert!
  It too performs - a move within the game...
  The ground grows soft where rigid lines were drawn;
  Old truths demand felicity in turn.
  Explicit forms ("I warn," "I now proclaim")
  Show utterance *as act* from night till dawn.

  The binary dissolves in Austin's hand.
  Locution's base, perlocution's effect expand,
  But **illocution** stands on shifting sand:
  The force inherent when we understand
  That saying *is* the doing we command.

  No bins for speech, but acts to classify:
  What **doing** lives within the spoken sigh?

  ---

  ### Notes on the Sonnet's Philosophical Work

  *   **Octave (Confident Dichotomy):**
      *   Lines 1-2: Establishes the initial split ("two kingdoms").
      *   Lines 3-4: Examples of performatives ("I do," "I swear," ship-naming) and their "happy" enactment.
      *   Lines 5-6: Contrasts with constatives ("cats on mats") focused on truth/falsity.
      *   Lines 7-8: Summarizes the clean distinction ("clean partition") presented early on ("lecture-light").

  *   **Volta (Line 9 - The Ground Shifts):**
      *   "But wait!" signals the crucial turn.
      *   The core insight: The simple constative "I state that the cat is on the mat" **is itself a performative act** ("is not inert!" / "a move within the game").
      *   This directly addresses the user's suggestion and is a pivotal moment in Austin's argument (Lecture VII/VIII).

  *   **Sestet (Unraveling & New Framework):**
      *   Lines 10-11: The consequence of the volta – the rigid lines blur ("ground grows soft"), and *constatives themselves* are seen to have felicity conditions ("Old truths demand felicity" - e.g., you need to believe what you state, have evidence, etc., for the statement to be *felicitous*, not just true).
      *   Line 12: Explicit performatives ("I warn," "I proclaim") further demonstrate that *all* utterances are fundamentally acts ("utterance *as act*").
      *   Lines 13-14: Acknowledges Austin's move to the tripartite distinction (locutionary - the act *of* saying; illocutionary - the act performed *in* saying; perlocutionary - the effect *by* saying). The focus lands on "illocution" as the core concept emerging from the collapse, presented as the central yet complex ("shifting sand") discovery.
      *   **Closing Couplet (The Final Picture):**
          *   Line 15: Explicitly rejects the initial sorting ("No bins for speech").
          *   Line 16: Presents the key takeaway: The essential task is classifying the **illocutionary force** – the *type* of act being performed (promising, stating, warning, etc.) – inherent in any utterance. This is the "**doing**" that truly matters.

  The sonnet traces Austin's journey: establishing the dichotomy in the octave, pivoting at the critical realization about stating, showing the dissolution of the binary and emergence of felicity conditions for constatives, introducing the new tripartite framework, and culminating in the focus on illocutionary force classification as the core of the general theory. The vocabulary ("felicity," "illocution," "locution/perlocution") and argumentative steps are specific to Austin's text.
