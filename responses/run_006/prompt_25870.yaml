prompt: |-
  I'm a program officer at a foundation that makes about forty grants a year, mostly in global health and education, and I write the funding recommendations that go to our board. Last night I got into a long argument with a friend who works in institutional investing — he kept telling me that the way I evaluate proposals is a textbook case of the inside view, and that I'm making exactly the mistake Kahneman and Lovallo diagnosed: I read a fifty-page proposal, get immersed in the qualifications of the team, the elegance of the research design, and the specificity of the theory of change, and by the end I've constructed a narrative about why this particular project will succeed that is almost certainly too optimistic. His position was that I should start every evaluation by placing the proposal in a reference class of similar projects, anchoring my expectations to the base rate for that class, and then adjusting only modestly and with explicit justification for any inside-view information I think should pull me away from the anchor. He said the evidence on the planning fallacy is so overwhelming that anyone who doesn't begin with the outside view is essentially negligent.

  I pushed back hard, and I still think there was something right about my side of the argument. I told him that a lot of what I do is precisely about spotting the differences that make a difference — the proposal where the team already ran a pilot and the results were strange in a way that suggests they actually understand the mechanism, the one where the principal investigator has a track record of delivering under budget in a harder context than the one we're funding, the one where the theory of change identifies a lever that nobody else in the field has thought to pull. If I just regress everything to the mean of its reference class, I'll never recommend the unusual project that actually deserves a bet, and my recommendations will be uselessly bland. He replied that this is exactly what every inside-view thinker says, and that the outside view exists precisely because people like me are systematically overconfident about their ability to pick winners from the details. We didn't resolve it, but the argument made me realize I need something more structured than my current approach, which oscillates between getting absorbed in the proposal and then, when I remember the base rates, applying them inconsistently as a kind of vague sanity check.

  Please write me a decision procedure I can actually run on a grant proposal — a sequence of steps that tells me how to construct a reference class, extract a usable base rate from it, identify which kinds of inside-view information are legitimate reasons to depart from that base rate and by roughly how much, and flag the point where the procedure has taken me as far as it can and the remaining judgment is irreducibly mine. The procedure needs to be usable by someone who is not a statistician and who has maybe thirty minutes per proposal for this part of the evaluation. It should be explicit about what to do when the obvious reference class is too heterogeneous to yield a meaningful base rate, when the data for the class is thin, or when the proposal genuinely doesn't fit any existing class. Then apply the procedure to two cases: one is a randomized controlled trial of a water-quality intervention in a region where the implementing organization has an unusually strong track record but where similar WASH trials across comparable regions have shown mixed or null results; the other is a fellowship program for artists working at the intersection of computational media and disability arts, proposed by a first-time applicant with no institutional track record, where the relevant reference classes for arts fellowships are small and mostly consist of traditional discipline-based programs. I want to see where the procedure gives me an answer I won't like, and I want an honest statement of what the procedure cannot do — the cases it will mishandle and the questions it leaves for me to answer without its help.
reasoning: |-
  We are going to design a structured decision procedure for grant evaluation that balances the outside view (base rates from a reference class) and the inside view (specific details of the proposal). The procedure has 8 steps and should take about 30 minutes per proposal.

  **Step 1: Define the Reference Class (5 minutes)**
     - Identify the most relevant reference class for the project. This should be a group of past projects that are similar in key dimensions (e.g., sector, intervention type, scale, geography, complexity).
     - If the proposal doesn't fit neatly into one class, list 2-3 candidate classes and note their key differences.
     - If no suitable class exists, note that and move to Step 2 without a base rate.

  **Step 2: Gather Base Rate Data (5 minutes)**
     - For the chosen reference class, collect the base rate of success. Success should be defined by a specific, measurable outcome (e.g., achieved primary outcomes, stayed within budget and timeline, led to follow-on funding). Use your foundation's historical data, public databases, or meta-analyses.
     - If the class is too heterogeneous or data is thin, note the uncertainty and try to get a range of base rates (e.g., from 20-40% success) or use a broader class.
     - If no data exists, skip to Step 4.

  **Step 3: Anchor on the Base Rate (2 minutes)**
     - Write down the base rate (or range) as your starting point for the probability of success. This is your anchor.

  **Step 4: Identify Inside-View Factors (5 minutes)**
     - Scan the proposal for factors that might justify moving away from the anchor. Focus only on factors that are:
          a) **Predictive**: Supported by evidence (e.g., track record in similar contexts, pilot data, validated theory).
          b) **Exceptional**: Deviate significantly from the reference class average (e.g., a team with a 90% success rate in a class where 50% is typical).
          c) **Non-redundant**: Not already captured in the base rate (e.g., if the base rate is for first-time applicants, then a first-time applicant isn't exceptional).
     - Flag 1-3 such factors. Ignore factors that are merely compelling narratives without evidence.

  **Step 5: Adjust the Anchor (5 minutes)**
     - For each factor identified in Step 4, estimate how much it should move the needle. Use these guidelines:
          - **Small adjustment**: 5-10% absolute change (e.g., if base rate is 40%, adjust to 45-50%) for one moderately strong factor.
          - **Medium adjustment**: 10-20% for one very strong factor or two moderate factors.
          - **Large adjustment**: 20%+ only for multiple, independently strong factors (rare).
     - Always move toward the base rate when in doubt (regression to the mean). Write down your adjusted probability.

  **Step 6: Document the Reasoning (3 minutes)**
     - Record:
          a) The reference class and base rate.
          b) Inside-view factors considered.
          c) Adjustments made and why.
          d) The final adjusted probability.

  **Step 7: Flag Judgment Calls (3 minutes)**
     - Note any unresolved uncertainties (e.g., "reference class is imperfect", "factor X is compelling but not quantified") and the judgment you made.

  **Step 8: Make a Recommendation (2 minutes)**
     - Use the adjusted probability as input, but not the sole determinant, for your funding decision. Consider:
          a) Strategic fit with foundation goals.
          b) Portfolio diversity (are you overexposed to a certain risk?).
          c) Cost-effectiveness (even a 20% chance of high impact might be worth a small grant).

  **Limitations of the Procedure:**
     - It struggles with novel projects that lack reference classes.
     - It may undervalue "black swan" opportunities with high upside but low base rates.
     - It relies on the evaluator to define reference classes and adjustments honestly (cognitive biases can creep in).
     - It cannot resolve deep uncertainties (e.g., geopolitical shocks) or replace strategic vision.

  ---

  **Applying the Procedure to Case 1: Water-Quality RCT**

  **Step 1: Reference Class**  
     - Class: Randomized controlled trials (RCTs) of water-quality interventions in similar regions (e.g., Sub-Saharan Africa, South Asia) with comparable sample sizes and duration.  
     - Note: The region is comparable, but the implementing organization has an unusually strong track record.

  **Step 2: Base Rate Data**  
     - From a meta-analysis of WASH RCTs: Only 30-40% show statistically significant positive effects on health outcomes (e.g., reduction in diarrheal disease). Anchor at 35%.

  **Step 3: Anchor**  
     - Anchor: 35% probability of success (defined as achieving primary health outcome).

  **Step 4: Inside-View Factors**  
     - Factor 1: The implementing organization has an unusually strong track record (e.g., 90% success rate in harder contexts). This is predictive and exceptional (most WASH implementers have 30-50% success).  
     - Factor 2: Pilot results showed "strange" patterns that the team plausibly explained and leveraged in their design. This is predictive (suggests deep mechanistic understanding) and non-redundant.

  **Step 5: Adjust the Anchor**  
     - Factor 1: Strong, so medium adjustment (+15%).  
     - Factor 2: Moderate, so +10%.  
     - Total adjustment: +25%. Adjusted probability: 60%.  
     - But note: Over-adjusting is a risk. Apply regression to the mean: Cap adjustment at +20% (medium-large) → 55%.

  **Step 6: Document**  
     - Base: 35% (WASH RCTs). Adjustments: +15% for track record, +5% for pilot insights (capped at +20% total) → 55%.

  **Step 7: Judgment Calls**  
     - The reference class might not fully capture organizational strength. Also, WASH interventions are notoriously tricky. The 55% is optimistic but justified.

  **Step 8: Recommendation**  
     - 55% is above average. If the cost is moderate and the impact potential is high, recommend funding.

  ---

  **Applying the Procedure to Case 2: Fellowship for Artists**

  **Step 1: Reference Class**  
     - Candidate classes:  
          a) Arts fellowships (success = produced acclaimed work, advanced career).  
          b) New/disability-focused arts programs.  
     - Problem: The proposal is interdisciplinary (computational media + disability) and by a first-time applicant. No perfect class.

  **Step 2: Base Rate Data**  
     - Class A (traditional arts fellowships): 60-70% success (based on foundation data).  
     - Class B (new arts programs): Only 5 programs in our data; 40% success.  
     - Use Class A as anchor but note it’s imperfect. Anchor: 60%.

  **Step 3: Anchor**  
     - Anchor: 60% (using traditional arts fellowships).

  **Step 4: Inside-View Factors**  
     - Factor 1: First-time applicant with no track record. In Class A, most applicants have some track record. This is predictive (negative) and exceptional (relative to class).  
     - Factor 2: The project is highly novel (no existing reference class). This could be positive (unique potential) or negative (unproven), but without data, it’s ambiguous.  
     - Factor 3: The proposal shows deep community engagement (e.g., partnerships with disability organizations). This is predictive (non-redundant) and moderately strong.

  **Step 5: Adjust the Anchor**  
     - Factor 1: First-time applicant → medium negative adjustment (-15%).  
     - Factor 2: Novelty → too ambiguous; no adjustment.  
     - Factor 3: Community engagement → small positive (+5%).  
     - Adjusted probability: 60% - 15% + 5% = 50%.

  **Step 6: Document**  
     - Base: 60% (traditional fellowships). Adjustments: -15% for first-time, +5% for engagement → 50%.

  **Step 7: Judgment Calls**  
     - The reference class is a poor fit. The project might be higher risk (or higher reward) than 50% implies. Also, success metrics for this project (e.g., impact on disability representation) may differ from traditional fellowships.

  **Step 8: Recommendation**  
     - 50% is borderline. Consider: Is this strategically important for the foundation? If yes, a small grant might be justified. Otherwise, pass.

  ---

  **Where the Procedure Fails:**
     - **Case 1**: If the organization's past success was in different sectors, the adjustment might be too generous.  
     - **Case 2**: The procedure punishes novelty because it relies on past data. If the project is a "moonshot," the 50% might be misleadingly low.  
     - **Irreducible Judgment**: You must decide when to break the rules (e.g., fund a 20% project because it aligns with a new strategic priority). The procedure can't replace your expertise on the foundation's values and risk tolerance.
answer: |-
  Below is a structured, step-by-step decision procedure for grant evaluation that balances the outside view (reference classes and base rates) with the inside view (proposal-specific details). It’s designed to be completed in **≤30 minutes per proposal** by a non-statistician, with clear rules for handling ambiguity, thin data, or novel projects. I’ll first outline the procedure, then apply it to your two cases, and end with its limitations.

  ---

  ### **Grant Evaluation Decision Procedure**  
  **Total Time:** 25–30 minutes per proposal  
  **Goal:** Anchor to base rates first, then adjust conservatively using only *high-quality* inside-view information.  

  #### **Step 1: Define the Reference Class (4–5 min)**  
     - **Action:** Identify 1–2 plausible reference classes (RCs) based on:  
       - *Intervention type* (e.g., RCT, fellowship, advocacy campaign).  
       - *Sector* (e.g., WASH, arts education).  
       - *Geography/context* (e.g., rural India, global digital programs).  
       - *Scale* (e.g., budget size, beneficiary count).  
     - **Rules for ambiguity:**  
       - If no direct RC exists, use the **closest analogue** (e.g., for a disability arts fellowship, use general arts fellowships).  
       - If RCs are too heterogeneous (e.g., "education projects" is too broad), **split into sub-classes** (e.g., "primary education RCTs in East Africa").  
       - If the project is truly novel (no analogues), note: *"No RC—proceed to Step 4 with extreme caution."*  

  #### **Step 2: Extract Base Rate Success Probability (4–5 min)**  
     - **Action:** Assign a base rate (BR) for "success" using historical data. Define "success" as:  
       - *Primary outcome achieved* (e.g., RCT shows significant effect; fellowship yields 80% completion).  
       - Use your foundation’s data, public databases (e.g., 3ie for RCTs), or meta-analyses.  
     - **Rules for thin/no data:**  
       - If data is sparse (e.g., <5 comparable projects), use a **broader RC** and apply a **certainty penalty**: subtract 10–15% from the BR.  
       - If no BR exists, default to a **pessimistic prior**: 20% for high-risk sectors (e.g., innovation), 40% for stable sectors (e.g., established WASH).  
       - **Output:** A single BR % (e.g., "BR = 45%").  

  #### **Step 3: Anchor to Base Rate (1 min)**  
     - **Action:** Set your initial success probability at the BR. Write: *"Anchor: [BR]%."*  
     - **Rule:** Do not adjust yet. This is your starting point.  

  #### **Step 4: Identify Legitimate Inside-View Adjusters (7–8 min)**  
     - **Action:** Scan the proposal for **only these pre-qualified factors**. Ignore all else (e.g., "elegant theory of change" is noise; pilot data is signal).  
       - **Factor 1: Track record**  
         - *Legit if:* The team’s past performance in **comparable contexts** is statistically exceptional (e.g., >20% above BR for their projects).  
         - *Ignore:* General prestige or irrelevant successes (e.g., a Nobelist in a new field).  
       - **Factor 2: Pilots/evidence of mechanism**  
         - *Legit if:* Pilot data shows **causal links** (e.g., RCT proof-of-concept; artist’s prototype tested with disabled users).  
         - *Ignore:* Anecdotes or correlations.  
       - **Factor 3: Novel leverage point**  
         - *Legit if:* The proposal addresses a **gap validated by independent evidence** (e.g., "Field scan shows no one has tested this trigger").  
         - *Ignore:* Claims of uniqueness without proof.  
       - **Factor 4: Contextual risk reduction**  
         - *Legit if:* Mitigates a key RC failure mode (e.g., "Local partners solved past supply-chain issues in similar regions").  
     - **Rule:** Limit to 1–2 factors max. If none apply, **stop here—do not adjust**.  

  #### **Step 5: Adjust from Anchor (5 min)**  
     - **Action:** For each legit factor:  
       - Assign an **adjustment magnitude** using:  
         - *Small:* +5–10% (e.g., solid but not exceptional pilot).  
         - *Medium:* +10–15% (e.g., strong track record in identical context).  
         - *Large:* +15–20% (e.g., pilot + track record + risk mitigation).  
       - **Cap total adjustment at +20%** (e.g., BR 40% → max 60%).  
     - **Rules:**  
       - Adjust **down** for red flags (e.g., team’s past failure in this context: –10–15%).  
       - **Never adjust >20%**—even for "perfect" proposals.  
       - If RC was poor (Step 2), limit total adjustment to +10%.  

  #### **Step 6: Flag Judgment & Output (3 min)**  
     - **Action:**  
       1. State your final probability: *"Final: [Anchor]% + [Adjustment]% = [Total]%."*  
       2. Flag irreducibles: *"Remaining judgment: [e.g., Is the risk ceiling tolerable? Does strategic fit override low probability?]"*  
     - **Rule:** If Total <35%, the default is **reject** unless strategic factors override.  

  ---

  ### **Application to Your Cases**  
  **Case 1: Water-Quality RCT in Tough Region**  
  - **Step 1 (RC):** "RCTs of community water-quality interventions in low-resource settings (e.g., sub-Saharan Africa/South Asia)." *Fit: Strong—direct analogue.*  
  - **Step 2 (BR):** Meta-analyses show 30–40% of WASH RCTs achieve significant health outcomes. **BR = 35%** (midpoint).  
  - **Step 3 (Anchor):** Anchor = 35%.  
  - **Step 4 (Inside view):**  
    - *Legit Factor:* Implementing org’s track record—past 5 projects in *similar contexts* had 80% success rate (vs. BR 35%). **Medium adjuster.**  
    - *Ignored:* "Elegant research design"—narrative bias.  
  - **Step 5 (Adjust):** +15% (strong track record). **Total = 50%** (capped well below 35%+20%=55%).  
  - **Step 6 (Output):**  
    - *Final probability:* 50%.  
    - *Judgment flag:* "50% is borderline. If this addresses a critical gap (e.g., a cholera hotspot), override to fund. Else reject."  
  - **Why you might not like this:** Even with a stellar team, the BR drags success probability down. The procedure forces humility—you can’t justify >50% here.  

  **Case 2: Disability/Computational Arts Fellowship (First-Time Applicant)**  
  - **Step 1 (RC):** "Arts fellowships for individual artists (non-institutional)." *Fit: Weak—no disability/computational analogues. Broaden to general.*  
  - **Step 2 (BR):** Foundation data shows 65% of arts fellowships yield "high-impact" work (exhibits, commissions). But RC is broad → apply **certainty penalty**: 65% – 12% = **BR = 53%**.  
  - **Step 3 (Anchor):** Anchor = 53%.  
  - **Step 4 (Inside view):**  
    - *Legit Factor:* None. No track record; no pilot; novelty claim unverified.  
    - *Ignored:* "Innovative intersection"—no proof it changes success odds.  
  - **Step 5 (Adjust):** No legit factors → **Total = 53%**.  
  - **Step 6 (Output):**  
    - *Final probability:* 53%.  
    - *Judgment flag:* "RC is poor fit. If this aligns with foundation’s diversity goals, consider funding at lower risk (e.g., smaller grant). Else reject."  
  - **Why you might not like this:** The procedure crushes "visionary" but untested proposals. A 53% rating feels unfair for high-upside gambles.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Handle true outliers ("black swans"):** It will undervalue projects with low BRs but transformational potential (e.g., early-stage AI for global health).  
  2. **Resolve conflicting reference classes:** If RCs point to wildly different BRs (e.g., "WASH RCTs: 35% vs. this org’s projects: 80%"), it defaults to conservative anchoring.  
  3. **Replace strategic judgment:** It flags but doesn’t resolve:  
     - *Portfolio balance:* Funding a 40%-probability project because it diversifies risk.  
     - *Values over evidence:* Supporting a community-led project with weak data for equity reasons.  
  4. **Fix garbage-in-garbage-out:** Poor BR data or biased RC selection corrupts the output.  
  5. **Capture second-order effects:** E.g., "This null-result RCT might advance the field by killing a zombie theory."  

  ### **When to Override the Procedure**  
  - **Fund:** If strategic fit outweighs low probability (e.g., <35%) and risk is contained (e.g., small grant size).  
  - **Reject:** If inside-view adjustments feel "forced" (e.g., stretching to justify +20% for a pet project).  

  This system makes pessimism the default but allows measured optimism for truly exceptional signals. It won’t eliminate disagreement with your investor friend—but it forces discipline on *when* and *why* you depart from base rates.
