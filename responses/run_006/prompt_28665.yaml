answer: |-
  ### Speech: "The Arrow of Time and the Stories We Tell"

  Good morning. I'm thrilled to be here — though "thrilled" might not quite cover it, given that my novel out next month features a woman who experiences time backwards. Her world isn’t rewinding like a film reel. Instead, her *subjective* arrow of time flips. She wakes up remembering tomorrow, not yesterday. She grieves losses before they happen. She anticipates the past. It’s disorienting, heartbreaking, and absurd — which is exactly why I wrote it. Because time *feels* linear and absolute to us, doesn’t it? We remember the past, we anticipate the future. But what if that’s not written in the stars?  

  This brings me to a genuine puzzle in physics — one that haunted me while writing. The fundamental laws of the universe, like gravity or quantum mechanics, are time-symmetric. Play a film of two planets orbiting, or two particles colliding, backwards, and it looks just as plausible as forwards. The maths doesn’t care. Yet here we are, in a world where milk spills but never unstirs itself, where we age but never rejuvenate, where cause always precedes effect. Why? If the laws are neutral, why does time have such a fierce, one-way momentum?  

  It’s easy to dismiss this as a quirk of science, but it’s deeply strange when you sit with it. Imagine a box of gas molecules. At any given moment, they’re jostling randomly. But if you saw them all suddenly swarm to one corner, you’d think the film was reversed — because in reality, they always spread out. That’s entropy: the universe’s tendency toward disorder. And it’s the closest thing we have to an arrow of time. But here’s the rub — entropy increases *because* the universe started in an improbably ordered state after the Big Bang. So the arrow of time isn’t a law; it’s a cosmic accident. A fluke of initial conditions. And that’s unsettling. It means our experience of time — this relentless forward march — is built on sand.  

  Which brings me to us. To the human bit. Because entropy isn’t just about gas molecules. It’s the reason we remember the past but not the future. It’s why regret lingers and anticipation thrills. When my protagonist lives backwards, she embodies a paradox: her memories are of events that haven’t happened yet, so she’s haunted by futures she can’t change. She’s a walking, grieving thought experiment about how time shapes our humanity. We’re creatures of narrative — we make sense of life through stories that start, middle, and end. But physics whispers that this could all be different. If the universe had begun in chaos, entropy might decrease, and we’d remember tomorrow. Imagine that. Regret would be for things undone, not overdone. Hope would be a backward glance.  

  So why fiction? Why spin a tale about time’s arrow when we have equations? Because fiction doesn’t solve the puzzle — it *inhabits* it. Physics gives us the rules, but stories give us the stakes. They let us ask: What does it feel like when the scaffolding of reality wobbles? How do we love, grieve, or make choices when time itself betrays us? Scientists can model entropy, but novelists can explore the weight of a backward-facing memory — the horror of knowing the future but being powerless to alter it. Fiction is empathy for the improbable.  

  In the end, my character’s tragedy isn’t that time is broken. It’s that she’s still human in the wreckage. She clings to moments — a laugh, a touch — even as they unravel. And perhaps that’s the point. Time’s arrow might be fragile, contingent, even arbitrary. But our stories? They’re how we point ourselves forward. However time flows, we’ll always weave it into meaning.  

  Thank you.

