prompt: |-
  I'm a novelist, and my new book's out next month. It's about a woman who starts experiencing time backwards — not time travel, just her subjective arrow of time flips while the world carries on forward. I've been asked to give the opening talk at a literary festival, about ten minutes, and I want to actually say something rather than just do the usual reading-and-Q&A.

  Here's the thing: I did a fair bit of reading on the thermodynamics of time while writing the book, and I want the speech to be built around one genuine puzzle from that — why the arrow of time points the way it does, given that the fundamental laws are time-symmetric. But the audience is mostly readers and writers, not physicists. Maybe a fifth of them will have read some pop-science, the rest just liked the premise.

  I want the speech to do three things: (1) make the puzzle feel real and strange, not just a curiousity, (2) connect it to something human — memory, regret, anticipation, the feeling of time passing — so the non-science people stay with me, and (3) land on why fiction is actually a decent tool for thinking about this, without it sounding grandiose or like I'm claiming novels solve physics problems.

  The constraint: my editor (who's a bit of a science nerd) will be there, and she'll wince if I get the physics wrong. So the science has to be accurate enough that someone who knows the field doesn't cringe, even though I'm simplifying.

  Could you write the speech? And then after it, give me a little structured breakdown as a JSON object with these fields:
  - "core_puzzle": the one-sentence version of the scientific puzzle the speech hangs on
  - "human_hook": how the speech connects the puzzle to ordinary experience
  - "riskiest_simplification": the place where I'm most likely to get corrected by someone who knows the physics
  - "emotional_arc": a very short description of the feeling the speech is meant to leave the audience with
  - "line_i_might_cut": the sentence or two that's most self-indulgent and could go if I'm over time

  Write it in British English, and don't worry about making it sound like me — I'll adapt the voice. Just give me good bones.
