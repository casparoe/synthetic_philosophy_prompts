prompt: |-
  I am a doctoral student working on the metaphysics of normativity, and I have been unable to locate the error in an argument that a colleague pressed on me, though I am convinced its conclusion is too strong. The argument generalizes the Euthyphro dilemma, and I want to know which step to reject and what rejecting it would cost.

  (1) Consider any view according to which a normative fact — that an action is right, or that there is reason to perform it — is explained by its relation to some source: a divine command, an ideal observer's approval, the outcome of a procedure of practical reasoning, the terms of an agreement, a legislative act, or a promise. (2) For any such view, the Euthyphro question arises: does the source select φ because φ is antecedently right, or is φ right because the source selects it? (3) If the source selects φ because φ is antecedently right, then the source merely tracks a rightness that is already there, and the view does not explain what rightness consists in. (4) If φ is right because the source selects it, then the selection is not answerable to any independent standard, so any selection whatsoever would have been equally right; had the source selected cruelty, or the breaking of every promise, those things would have been right. (5) An account of normativity on which the selection of cruelty or promise-breaking would be equally right is unacceptable. (6) Therefore no source-based account of normativity can be correct. (7) But this conclusion rules out, at a stroke, contractualism, Kantian constructivism, ideal-observer theories, legal obligation, and promissory obligation. (8) Some of these are serious candidates, and promising and legislation are practices we ordinarily take to create obligations; a principle that refutes all of them proves too much, so at least one step of the argument must fail.

  I would most like to keep the claim that some constructivist or contractualist account of normativity is correct, and the claim that promising can create obligations; I am prepared to give up whichever other step is least costly. But I need to know precisely which premise or inference is at fault, whether the fault is an equivocation or a false dichotomy or a substantive false premise, and whether the generalized dilemma fails for the same reason the original dilemma fails or for a different one. A bare answer that only names the step to reject without saying what picture of source-based normativity remains available would not be enough; I want to know what rejecting that step commits me to, and which of the views listed in (7) survive the repair.
reasoning: |-
  Okay, this doctoral student is grappling with a generalized Euthyphro dilemma applied to normativity. They've presented a tight argument that seemingly invalidates all source-based accounts of normativity—including theories they find plausible like constructivism and promissory obligation. The core tension is between explanatory priority and arbitrariness, and they're rightly alarmed that the argument dismisses several serious philosophical positions in one stroke.

  Hmm, the argument's structure is clear: Premise (1) defines source-based views, (2) poses the Euthyphro question, (3) and (4) present the horns of the dilemma, (5) rejects the second horn as unacceptable, leading to (6) the conclusion that all such views fail. Premise (7) notes the counterintuitive scope of this conclusion, and (8) argues it proves too much. The student suspects premise (4) is faulty but wants to understand the cost of rejecting it.

  Let me unpack why premise (4) is indeed the weak link. Its claim that "any selection whatsoever would have been equally right" relies on a hidden assumption that source-based views must be voluntarist—that is, treating the source's act as entirely unconstrained. But sophisticated versions of constructivism or contractualism reject this. For example, Scanlon's contractualism grounds rightness in principles no one could reasonably reject, which isn't arbitrary because the "reasonable" standard constrains outcomes. Similarly, Kantian constructivism isn't about mere choice but about what rational agents would will under idealized conditions. The selection process itself has normative structure.

  Ah, and this reveals the false dichotomy in step (2). It assumes the only options are either full independence of normativity from the source or complete arbitrariness. But there's a third way: the source's authority might derive from its constitutive features (like rationality in Kant's Categorical Imperative procedure) that aren't themselves arbitrary yet aren't "antecedently right" in the realist sense. This avoids both horns—the source isn't tracking pre-existing values (contra 3), nor is it unconstrained (contra 4).

  The cost of rejecting (4)? It commits one to claiming that source-based procedures have internal standards that prevent arbitrariness. For promissory obligation, this means accepting that promising creates obligations only within a normative practice that itself rests on deeper principles (e.g., autonomy, expectation-management). The payoff is saving contractualism and constructivism by showing their sources aren't brute acts of will.

  Interestingly, the original Euthyphro fails similarly—Socrates' dilemma ignores that divine commands could express God's essentially good nature. Here too, the generalization errs by ignoring that normative sources might have essential constraints. The student can keep their favored theories by emphasizing that the "source" isn't a voluntarist selector but a procedure embodying rationality or reasonableness.
answer: |-
  Your colleague's argument presents a powerful challenge, but the flaw lies in **premise (4)**, specifically its claim that *"the selection is not answerable to any independent standard, so any selection whatsoever would have been equally right."* This equivocates on "independent standard" and ignores how sophisticated source-based accounts embed constraints *within the source itself*. Rejecting (4) preserves the viability of constructivist, contractualist, and practice-based views while avoiding arbitrariness. Here's a detailed breakdown:

  ### Why Premise (4) Fails: The False Equivocation
  1. **The Core Error**: Premise (4) assumes that if normativity depends on a source, the source's selections must be **arbitrary** (i.e., unconstrained by normative standards). This relies on a false dichotomy between:
     - **Antecedent standards** (rejected by source-based views in premise 3), and
     - **No standards at all** (leading to arbitrariness in premise 4).
     It ignores a third possibility: **the source itself embodies non-arbitrary constraints** (e.g., rationality, reasonableness, or constitutive features of agency) that are *constitutive of normativity* rather than external to it.

  2. **How Source-Based Views Avoid Arbitrariness**:
     - **Kantian Constructivism**: The "source" (e.g., the Categorical Imperative procedure) isn't a voluntarist act but a test of *rational universalizability*. Cruelty or promise-breaking *could not be willed universally* without contradiction, so they could never be "selected" as right. The standard (rationality) is internal to the procedure, not antecedent or independent.
     - **Contractualism (Scanlon)**: Principles are selected if "no one could reasonably reject" them. "Reasonableness" isn't an external moral fact; it's built into the contractualist framework. A principle permitting cruelty *would* be reasonably rejectable, so it *couldn't* be selected. The source (agreement under reasonable conditions) is inherently constrained.
     - **Promissory Obligation**: Promising creates obligations *within a practice* governed by norms of trust, autonomy, and expectations. The practice isn't arbitrary because it serves deeper normative interests (e.g., facilitating cooperation). A "promise" to commit cruelty isn't valid, as it violates the practice's constitutive aims (cf. Rawls on practices).

  ### What Rejecting (4) Commits You To
  1. **A Non-Voluntarist Conception of Sources**:  
     You must hold that normative sources (e.g., procedures, agreements, commands) derive authority from **internal constraints** (rationality, reasonableness, constitutive aims) that prevent arbitrary selections. These constraints aren't "antecedent" in the realist sense but are *what make the source normative*.

  2. **The Rejection of Divine Command Voluntarism**:  
     Unlike crude divine command theory (where God's will *alone* defines rightness), the views you wish to save treat sources as *expressions of non-arbitrary standards*. For legislation or promises, authority comes from their role in a system with inherent norms (e.g., justice for law; fidelity for promises).

  3. **Modest Metaphysical Commitments**:  
     You avoid moral realism (antecedent facts) but also reject sheer voluntarism. Instead, you endorse a **procedural realism** (e.g., what is rational/reasonable *is* normative) or a **constitutivist** view (normativity arises from features of agency).

  ### Which Views Survive?
  | **View**               | **Survives?** | **Key Constraint**                                                                 |
  |------------------------|---------------|------------------------------------------------------------------------------------|
  | Kantian Constructivism | ✅             | Rational universalizability (cruelty is inconceivable as law)                     |
  | Contractualism         | ✅             | Reasonableness (cruelty is always reasonably rejectable)                          |
  | Promissory Obligation  | ✅             | Constitutive norms of promising (cruelty invalidates the promise)                 |
  | Ideal-Observer Theories| ✅/⚠️          | Only if "ideal" includes substantive constraints (e.g., empathy, rationality)      |
  | Legal Obligation       | ✅/⚠️          | Only if law is grounded in moral aims (e.g., justice), not sheer power             |
  | Divine Command         | ⚠️             | Only if God's commands reflect divine reason/goodness (not voluntarism)           |

  ### Why the Generalized Dilemma Fails Differently than the Original
  - **Original Euthyphro**: Fails because it ignores that God's nature *constitutes* goodness (i.e., God isn't subject to external standards but *is* the standard).  
  - **Generalized Dilemma**: Fails because it ignores that sources can have **internal structural constraints** (rationality, reasonableness) that block arbitrariness without appealing to antecedent facts. The constraint isn't *external* to the source but *definitive* of it.

  ### Cost-Benefit Analysis
  - **Cost**: You must deny that *any* act of selection (e.g., commanding, promising, legislating) can create obligations *ex nihilo*. Sources must be "thick" (embedded in practices or procedures with built-in norms).  
  - **Benefit**: You save the core of constructivism/contractualism and everyday practices (promising, legislation) while blocking the absurd conclusion that cruelty could be right. The argument against divine command voluntarism remains intact, but that’s likely acceptable for your goals.

  ### Key Takeaway
  The generalized Euthyphro fails because it **conflates "source-based" with "voluntarist."** By rejecting (4), you affirm that normative sources are **inherently constrained by the very features that make them normative** (e.g., rationality in reasoning, reasonableness in agreement). This preserves the explanatory power of source-based views without capitulating to realism or arbitrariness. For your doctoral work, this opens space to defend a constrained constructivism where normativity emerges from procedures that are *constitutively rational* or *reason-responsive*.
