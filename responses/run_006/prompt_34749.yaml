prompt: |-
  I'm a PhD student in economics, and I also serve as a mediator in my university's dispute-resolution program — mostly two-party cases: co-founders dividing equity, academic departments splitting a fixed budget, roommates allocating rent. I've been reading the axiomatic bargaining literature, and I find the Kalai–Smorodinsky solution more compelling than the Nash solution for the cases I see, because it respects individual monotonicity: if the set of possible agreements expands in a way that only raises one party's best-case outcome, that party should not end up with less than before. But I need to translate the KS solution into a procedure I can actually run in a mediation session, with parties who have no economics training and limited patience for abstraction.

  Please write a step-by-step procedure I can follow to arrive at a Kalai–Smorodinsky fair division in a two-party dispute. The procedure should:

  (a) Start from what the parties can actually tell me — their best-case outcome, their fallback if no deal is reached, and the options on the table — and walk me through computing the KS solution from those inputs.
  (b) Give clear instructions for handling cases where utilities are only roughly comparable across parties, or where the set of feasible agreements is discrete rather than continuous.
  (c) Flag every step where the procedure requires a judgment call rather than a mechanical computation, and say what to do when the parties disagree about the inputs.
  (d) Identify at least one kind of case where the KS solution gives a result that the parties are likely to find unfair or counterintuitive, and explain how to handle that moment in the room.

  Then apply the procedure to two worked examples: (1) two co-founders dividing equity, where one contributed more capital and the other contributed more labor, and the fallback is dissolving the company; (2) two academic departments splitting a fixed budget, where one department has a much higher maximum plausible need than the other.

  Throughout, please separate what is settled among bargaining theorists from what is genuinely contested — in particular, the trade-off between the KS and Nash solutions is a live debate, and I do not want the response to present the KS solution as the consensus view. Keep the response under 800 words.
reasoning: |-
  Okay, the user is a PhD student in economics who also works as a mediator. They need a practical procedure for implementing the Kalai-Smorodinsky (KS) solution in real mediation sessions. The challenge is translating this theoretical concept into something usable with parties who have no economics background. 

  First, I need to recall the core of KS solution: it finds the point where the payoff ratios match the ratio of ideal payoffs, subject to feasibility. The key advantage over Nash is individual monotonicity - if one party's maximum improves, they shouldn't get less. This aligns better with many real-world fairness intuitions.

  For the procedure, I'll need to:
  Start from concrete inputs parties can provide: 
  - Fallback positions (disagreement point)
  - Best possible outcomes for each
  - Actual options available

  The critical translation is helping parties articulate "best possible outcome" without utility functions. For example, in equity division, it might be "what you'd get if the other conceded everything reasonably possible."

  For discrete cases, I'll suggest finding the feasible point closest to the KS ray. When utilities aren't comparable, I'll emphasize proportional gains over absolute payoffs.

  Important judgment calls to flag:
  - When parties define their "best case" unrealistically
  - When they dispute the disagreement point
  - Selecting among discrete options

  I must also warn about KS limitations - like when one party has an enormous but implausible "best case" that skews results. The budget split example will illustrate this.

  For the co-founder example:
  - Disagreement: dissolution value (say 50-50)
  - Best cases: 100% equity each (but must be reasonable)
  - KS ray is 1:1 ratio, so 50-50 split

  For the departments:
  - Small dept max: $0.5M
  - Large dept max: $10M 
  - Disagreement: $0 each
  - KS would give large dept nearly everything, which feels unfair

  This shows when KS may need adjustment - perhaps capping "best case" at realistic levels. I'll present this as a known critique, not consensus.

  Throughout, I'll maintain neutrality: note Nash as an alternative, emphasize KS's monotonicity advantage but acknowledge its vulnerability to anchor manipulation. The tone should be practical - a field guide, not a lecture.
answer: |-
  Here's a step-by-step Kalai-Smorodinsky (KS) mediation procedure, designed for practical use with non-economists. Key theoretical points are noted where relevant.

  **Core KS Idea (Explainable to Parties):** "We'll find a split where each of you gets the same *proportion* of your absolute best possible outcome (from this process), relative to your fallback if we fail."

  **Procedure:**

  1.  **Establish Disagreement Point (D):**
      *   *Ask:* "If we walk away with **no deal**, what happens to each of you? Quantify it if possible (e.g., money, shares, specific outcome)."
      *   *Judgment Call:* Parties may disagree on D (e.g., company dissolution value). *Handling:* Facilitate discussion using objective evidence (contracts, market data). If deadlock, state both views clearly and proceed cautiously, noting the uncertainty. **D = (d1, d2)**
      *   *Output:* Quantified fallback positions for Party 1 (P1) and Party 2 (P2).

  2.  **Define "Best Possible Outcomes" (Ideal Points - I1, I2):**
      *   *Ask P1:* "Ignoring what's fair to P2 for a moment, and assuming a deal *is* reached, what is the **absolute best outcome** you could *realistically* hope to get out of this specific negotiation? Be ambitious but reasonable."
      *   *Ask P2:* Same question.
      *   *Judgment Call:* Crucial step. Parties may state extreme, unrealistic demands ("I want 100%!"). *Handling:* Push for reasonableness: "What's the most you think you could *plausibly* argue for, even if unlikely?" Anchor it in the negotiation context ("Given P2's contribution, is 95% really plausible?"). Document their stated I1, I2.
      *   *Output:* **I1** (P1's ideal gain from D), **I2** (P2's ideal gain from D). *Note:* This defines the KS "utopia" point **(U = d1 + I1, d2 + I2)**, though you won't calculate U directly.

  3.  **Identify Feasible Set (S):**
      *   *Ask:* "What are the concrete options or possible agreements on the table?" List them. Probe for compromises.
      *   *Handling Discrete Options:* If the set is discrete (e.g., specific equity splits: 60-40, 55-45, 50-50), list all viable points. If continuous (e.g., any % split), note that.
      *   *Judgment Call:* Are all listed options truly feasible? Are key options missing? *Handling:* Encourage parties to generate options. Vet feasibility based on constraints (law, practicality).

  4.  **Calculate KS Target (Proportional Gains):**
      *   *Compute Gains from D:* For *each* feasible agreement point **A = (a1, a2)**:
          *   P1's Gain: **G1(A) = a1 - d1**
          *   P2's Gain: **G2(A) = a2 - d2**
      *   *Compute Proportional Achievement:*
          *   P1's Proportion: **Prop1(A) = G1(A) / I1** (How much of their ideal gain does A give P1?)
          *   P2's Proportion: **Prop2(A) = G2(A) / I2**
      *   *KS Target:* The KS solution is the feasible point(s) where **Prop1(A) = Prop2(A)** (equal proportional achievement relative to ideals). Calculate **|Prop1(A) - Prop2(A)|** for each A.
      *   *Handling Rough Comparability:* Focus parties on the *proportions* ("You'd get 70% of your ideal gain, they'd get 68%") rather than absolute gains. The metric (%, share) is inherently comparable.

  5.  **Select the Agreement:**
      *   *Continuous S:* Find the point on the Pareto frontier where Prop1(A) = Prop2(A). Graph if helpful.
      *   *Discrete S:* Find the feasible point(s) with the **smallest |Prop1(A) - Prop2(A)|**. If multiple points are very close, present them.
      *   *Judgment Call:* If multiple discrete points are equally close, or if the closest point feels lopsided due to discreteness, facilitate a choice between them. *Handling Disagreement:* "KS suggests these options achieve the closest to equal proportional gains. Let's discuss which works best practically." Use the KS proportions as the fairness argument.

  6.  **Present and Discuss:**
      *   Frame the KS outcome as achieving "balanced ambition": both get an equal *share* of what they were individually aiming for, relative to the worst case.
      *   **Flag: KS Counterintuitive Case & Handling:**
          *   *The Problem:* If one party has a much larger **Ideal (I)** than the other (e.g., Department A max need $10M, Dept B max need $1M; D = $0), KS allocates resources proportionally to I1 and I2. P1 (large I) gets roughly 10 times more than P2 (small I) ($9.09M vs $0.91M of $10M total). This can feel unfair if I2 seems inflated or less "necessary".
          *   *Why it happens:* KS satisfies Individual Monotonicity. Expanding S only favorably for P1 *must* help P1, even if P1's ideal is huge.
          *   *Handling in the Room:*
              1.  **Revisit "Realism" of Ideals:** "Department A, is $10M truly a *minimum* critical need for this specific pot, or an aspirational wish? KS uses this 'ideal' to set proportions." Encourage downward adjustment if inflated.
              2.  **Acknowledge the Tension:** "KS ensures if the pie grew only for A, A benefits. But basing it on very different ideals leads to uneven absolute shares. Is this acceptable fairness here?"
              3.  **Consider Hybrid/Alternative:** If unfairness persists, discuss capping ideals, using a different baseline, or transparently considering Nash (which would split the total more evenly, ~$5M each, but violates monotonicity). *Note:* **This is the core Nash vs. KS trade-off.** Nash emphasizes equal *absolute* gains from D; KS emphasizes equal *relative* gains from ideals. Neither is consensus "best".

  **Worked Examples:**

  1.  **Co-Founders (Equity Split):**
      *   D: Dissolution = 50-50 split ($50k each).
      *   I1 (Capital): "Realistic Best" = 80% (values $80k gain over D).
      *   I2 (Labor): "Realistic Best" = 70% (values $70k gain over D).
      *   Feasible: Continuous (Any split totaling 100%).
      *   KS Calculation:
          *   Target Prop1 = Prop2 --> (Equity_P1 - 0.50) / 0.30 = (Equity_P2 - 0.50) / 0.20
          *   Also, Equity_P1 + Equity_P2 = 1.0
          *   Solving: P1 ~ 56%, P2 ~ 44%. (Gains: P1 $6k (20% of I1 $30k), P2 $6k below 50%? Wait, let's recalculate.
          *   *Gain P1* = P1% - 50%. *Ideal Gain P1 (I1)* = 80% - 50% = 30%. *Proportion P1* = (P1% - 50%) / 30%
          *   *Gain P2* = P2% - 50% = (1 - P1%) - 50%. *Ideal Gain P2 (I2)* = 70% - 50% = 20%. *Proportion P2* = [(1-P1%) - 50%] / 20%
          *   Set equal: (P1 - 0.5)/0.3 = (0.5 - P1)/0.2? No: P2's share is (1-P1), so Gain P2 = (1-P1) - 0.5.
          *   Equation: (P1 - 0.5) / 0.3 = ( (1 - P1) - 0.5 ) / 0.2 --> (P1 - 0.5)/0.3 = (0.5 - P1)/0.2
          *   Solve: 0.2(P1 - 0.5) = 0.3(0.5 - P1) --> 0.2P1 - 0.1 = 0.15 - 0.3P1 --> 0.5P1 = 0.25 --> **P1 = 50%, P2 = 50%**
          *   *Proportions:* Gain P1 = 0%, Prop1 = 0%. Gain P2 = 0%, Prop2 = 0%. Equal.
      *   *Result:* 50-50 split. KS honors the equal fallback (D) and finds no feasible point gives either a positive gain relative to D without hurting the other proportionally more relative to their ideal. The "ideals" are aspirational but unreachable without harming the other more severely relative to *their* ideal.

  2.  **Departments (Budget Split - $1M total):**
      *   D: No deal = $0 each.
      *   I1 (Small Dept): Max plausible need = $0.5M (Ideal Gain = $0.5M).
      *   I2 (Large Dept): Max plausible need = $10M (Ideal Gain = $10M - unrealistic, but stated).
      *   Feasible: Continuous (P1 + P2 = $1M; P1 >=0, P2>=0).
      *   KS Calculation:
          *   Target Prop1 = Prop2 --> (P1 - 0) / 0.5 = (P2 - 0) / 10 --> P1 / 0.5 = P2 / 10 --> 20 * P1 = P2
          *   Constraint: P1 + P2 = 1.0 --> P1 + 20*P1 = 1.0 --> 21*P1 = 1.0 --> **P1 ≈ $47,619; P2 ≈ $952,381**
      *   *Result:* Large Dept gets almost everything. This highlights the vulnerability to inflated ideals (I2=$10M).
      *   *Handling:* Challenge I2's realism. "Large Dept, is $10M a true minimum need for *this specific $1M*, or your total wishlist?" If they concede a lower realistic max (e.g., $1.5M), KS becomes P1 / 0.5 = P2 / 1.5 --> 3*P1 = P2 --> P1 + 3P1 = 1M --> **P1=$250k; P2=$750k** (Prop1=250k/500k=50%, Prop2=750k/1.5M=50%). If they won't budge, acknowledge the KS result but highlight the perceived unfairness due to the large ideal and discuss alternatives (e.g., split evenly: $500k each, violating KS monotonicity but satisfying Nash).

  **Key Theoretical Notes in Practice:**
  *   **KS vs. Nash Trade-off:** Emphasize KS prioritizes "fairness when potential improves" (monotonicity), while Nash prioritizes "fairness based on the baseline" (D) and symmetry. State this is debated.
  *   **Input Reliance:** KS is highly sensitive to D, I1, and I2. Judgment in defining these is critical.
  *   **Not Consensus:** Present KS as *a* compelling fair bargaining solution with specific strengths (monotonicity) and weaknesses (sensitivity to ideals), not *the* solution.
