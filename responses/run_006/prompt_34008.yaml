    - Calibration (scores mean the same per group).  
    - Equal false detentions (FPR).  
    - Equal false releases (FNR).  
    **Why?** When base rates differ, these three goals conflict mathematically (see *Impossibility Theorem*). Relax one.  

  ---

  #### **Branch 2: You chose B (Harm Balance)**  
