  ---

  ### **Decision Tree: Which Algorithmic Fairness Position Do Your Commitments Entail?**  
  **Scenario**: A risk score (e.g., for pretrial release) predicts an outcome (e.g., "will commit crime if released"). Groups differ in their base rates (e.g., Group A has a higher crime rate than Group B).  

  #### **Question 1**  
  *In this system, which fairness priority matters most to you?*  
  - **A. Accuracy consistency**: A score (e.g., "7/10 risk") should mean the same thing for everyone. (E.g., 70% of people with a "7" score reoffend, regardless of group.)  
  - **B. Harm balance**: No group should experience more avoidable mistakes (e.g., false detentions or mistaken releases) than another.  
  - **C. Group blindness**: The system must not use race or other sensitive group attributes in any way.  

  ---

  #### **Branch 1: You chose A (Accuracy Consistency)**  
  **Question 2**  
  *If Group A has a higher base crime rate than Group B, is it acceptable that Group A experiences more false detentions (e.g., innocent people jailed)?*  
  - **A. Yes**: The score reflects reality; unequal false detentions are unavoidable.  
  - **B. No**: False detentions should be equal across groups.  

  **Question 3** (If you answered **B** to Question 2)  
  *Is it acceptable that Group A experiences more mistaken releases (e.g., guilty people freed)?*  
  - **A. Yes**: Equal false detentions are my priority; unequal releases are tolerable.  
  - **B. No**: Both mistakes must be balanced.  

