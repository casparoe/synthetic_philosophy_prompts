  *Which mistake is more urgent to balance?*  
  - **A. False detentions**: Equalize innocent people jailed (e.g., pretrial detention).  
  - **B. False releases**: Equalize guilty people freed (e.g., reoffenders released).  
  - **C. Both**: Balance both mistakes equally.  

  **Question 3** (If you answered **C** to Question 2)  
  *Should a "7/10 risk" score mean the same thing for all groups?*  
  - **A. Yes**: Scores must be consistent (calibrated).  
  - **B. No**: Scores can vary in meaning if it balances harms.  

  **Leaf Positions for Branch 2**:  
  - **B → A**: **False Positive Balance**. Equalize false detentions (FPR). *Ignores* calibration and false releases.  
  - **B → B**: **False Negative Balance**. Equalize false releases (FNR). *Ignores* calibration and false detentions.  
  - **B → C → A**: **⚠️ Unsatisfiable!** You demand:  
    - Equal false detentions (FPR).  
    - Equal false releases (FNR).  
    - Calibration (scores mean the same).  
    **Why?** When base rates differ, calibration + equal FPR + equal FNR is impossible.  
  - **B → C → B**: **Error-Rate Balance (Equalized Odds)**. Equalize both mistakes (FPR and FNR). *Accepts* scores may not mean the same thing across groups.  

  ---

  #### **Branch 3: You chose C (Group Blindness)**  
  **Question 2**  
  *If the system *doesn’t* use group data but still produces unequal outcomes (e.g., more Group A detentions), is that fair?*  
  - **A. Yes**: Fairness is about process, not outcomes. Avoid group data entirely.  
  - **B. No**: Unequal outcomes are unfair, even without group data.  

  **Leaf Positions for Branch 3**:  
  - **C → A**: **Anti-Classification (Procedural)**. Ban group data use. Outcomes are irrelevant to fairness.  
  - **C → B**: **Substantive Value Judgment**. Fairness requires value choices (e.g., "Is outcome inequality acceptable?"). *Not a technical fix*.  

  ---

  #### **Leaf Summary**
  | **Position**                          | **Core Commitment**                                                                 | **Base Rate Handling**                                  |
  |---------------------------------------|-------------------------------------------------------------------------------------|---------------------------------------------------------|
  | **Calibration-first**                 | Scores must mean the same thing for all groups.                                     | Accepts unequal error rates.                           |
  | **Calibration + FPR Balance**         | Scores consistent + false detentions equal.                                         | Requires unequal false releases.                       |
  | **False Positive Balance**            | Equalize false detentions (e.g., innocent jailed).                                  | Ignores calibration/false releases.                    |
  | **False Negative Balance**            | Equalize false releases (e.g., guilty freed).                                       | Ignores calibration/false detentions.                  |
  | **Error-Rate Balance (Equalized Odds)** | Equalize both false detentions and false releases.                                | Scores may not be calibrated.                          |
  | **Anti-Classification (Procedural)**  | Ban group data use. Fairness is input-agnostic.                                     | Outcomes irrelevant.                                   |
  | **Substantive Value Judgment**        | Fairness requires democratic/value choices, not technical criteria.                 | Rejects purely algorithmic solutions.                  |

  ---

  #### **Key Notes**  
  1. **Unsatisfiable Combinations**:  
     - **Calibration + Equal FPR + Equal FNR**: Mathematically impossible when base rates differ (see [Impossibility Theorem](https://arxiv.org/abs/1609.05807)).  
     - **Error-rate balance (both FPR/FNR) + Calibration**: Also impossible under differing base rates.  
  2. **What This Tree Can’t Separate**:  
     - **"Fairness through unawareness" vs. strict proceduralism**: Both reject group data but may diverge on whether outcomes matter.  
     - **Contextual trade-offs**: E.g., "Is FPR worse than FNR?" requires domain-specific ethics (not captured here).  
  3. **Why Base Rates Matter**:  
     If Group A has a higher crime rate, forcing equal FPR/FNR *requires* scores to be uncalibrated (e.g., a "high-risk" score in Group A may be less predictive than in Group B).  

  ---  
  Use this tree to clarify your stance. No position is "neutral"—each prioritizes certain values (accuracy, equity, procedure) over others. For deeper dives, see Barocas, Hardt, and Narayanan’s *Fairness and Machine Learning*.
