  First, I need to recall the core problem: when any individual can act unilaterally, the most permissive member's decision can override the group, leading to potentially harmful actions. The user wants the criteria any solution must meet, each motivated by a failure case. 

  The asymmetry desideratum comes from the default risk of action vs. inaction. Acting can cause irreversible harm, while not acting might preserve the status quo. The ambulance case is the exception where not acting is worse. That's non-negotiable.

  Then there's judgment vulnerability. Even if everyone is rational, private info or biases can skew decisions. The case with the overconfident doctor prescribing unnecessary meds shows how one person's error can affect everyone. This is also non-negotiable because it's inherent to the curse.

  Reversibility matters because irreversible actions have higher stakes. The factory pollution example shows how a reversible decision (like a recall) is less problematic than an irreversible one. But what counts as reversible might be debated, so this one could be parochial depending on context.

  Epistemic modesty is key. Groups should recognize that no single member has all the info. The drone strike scenario where one officer acts on flawed intel illustrates why collective input is needed. This is non-negotiable for preventing rash actions.

  Scalability is contested. In emergencies, like a fire, waiting for consensus could be deadly. But in large groups, unilateral actions become riskier. The tension here is between urgency and coordination. Some might argue for strict rules, others for flexibility. This is where the major conflict lies.

  The user also wants to know if any desiderata conflict. The big tension is between preventing hasty actions (requiring checks) and allowing necessary ones in emergencies. Scalability vs. asymmetry. In a fire, consensus could kill people, but unilateral action might cause panic. No solution perfectly satisfies both, leading to trade-offs.

  Non-negotiables: asymmetry, judgment vulnerability, epistemic modesty. These address the core mechanics of the curse. Reversibility and scalability are more context-dependent. 

  The user's deeper need might be understanding the theoretical tensions to evaluate solutions. They’re likely preparing for academic discussion or policy design. Highlighting the unsatisfiable conflict between safety and speed gives them the critical insight they want.
answer: |-
  Here are the core desiderata for any adequate theory of decision-making under the unilateralist's curse, motivated by critical failure modes and cases. The tensions between them define the curse's intractability.

  ### Non-Negotiable Desiderata (Core to the Curse)
  1.  **Asymmetry of Action/Inaction (Default Risk Aversion):**
      *   **Requirement:** The system must assign higher stakes/scrutiny to *acting* than to *refraining*, especially for irreversible harms. Permitting action should require stronger justification than blocking it.
      *   **Motivating Failure:** Without this, the most reckless member triggers harmful actions the majority opposes (e.g., launching a destabilizing cyberattack based on flawed intelligence). The curse inherently biases towards action; the system must counterbalance this.
      *   **Core Case:** The *default* state is inaction; action disrupts it and bears the burden of proof.

  2.  **Mitigation of Private Judgment Vulnerability:**
      *   **Requirement:** The system must not collapse to the judgment of the single most permissive/optimistic actor, even if all actors are *individually* rational and well-intentioned.
      *   **Motivating Failure:** Rational individuals relying solely on private information/calibration can still be wrong. The curse ensures the group acts on the *most extreme error* (e.g., one overconfident doctor prescribing unnecessary, risky medication for a group).
      *   **Core Case:** The curse *is* this failure mode. Any solution must fundamentally address it.

  3.  **Epistemic Modesty Requirement:**
      *   **Requirement:** The system must acknowledge that no single member possesses the complete picture (information, expertise, risk assessment calibration) necessary for high-stakes decisions affecting all.
      *   **Motivating Failure:** A single actor, convinced they are right, acts on incomplete/misleading data, causing catastrophic harm the group foresaw (e.g., one officer authorizing a drone strike based on flawed intel, ignoring team consensus against it).
      *   **Core Case:** Inherent in the curse – unilateral action bypasses collective wisdom and error-checking.

  4.  **The Rescue Imperative (Clear Unilateral Case):**
      *   **Requirement:** The system *must* allow for swift, decisive unilateral action in genuine, high-urgency, low-discretion emergencies where delay equals severe harm.
      *   **Motivating Failure:** Requiring consensus paralyzes action in critical moments (e.g., *no one* calls the ambulance because each bystander assumes someone else will/should decide, or waits for group confirmation).
      *   **Core Case:** The single bystander calling the ambulance. This defines the *necessity* of unilateral pathways.

  ### Contested/Parochial Desiderata (Context-Dependent Weighting)
  5.  **Reversibility Gradient:**
      *   **Requirement:** The threshold for permitting unilateral action should be inversely related to the action's reversibility. Irreversible actions demand the highest barriers.
      *   **Motivating Failure:** Requiring low consensus for irreversible actions leads to permanent, regretted harms (e.g., one executive selling a core company asset based on a personal hunch). Allowing high consensus for easily reversible actions creates unnecessary bureaucracy (e.g., requiring full board approval to order office supplies).
      *   **Contested Aspect:** Defining "reversible" is often ambiguous (e.g., reputational damage, ecological tipping points). Some argue even "reversible" actions under the curse can cascade.

  6.  **Scalability & Urgency Sensitivity:**
      *   **Requirement:** The system must adapt its decision thresholds based on group size and time pressure. Larger groups or extreme urgency may necessitate lower effective thresholds or designated actors.
      *   **Motivating Failure:** Requiring full consensus in a massive group (e.g., global treaty organization) makes any action impossible. Requiring high consensus in a split-second emergency (e.g., disaster response) causes deadly delays.
      *   **Contested Aspect:** How much to lower the threshold risks reintroducing the curse. Defining "urgency" is subjective and prone to manipulation ("crying wolf").

  ### The Central Tension (Joint Unsatisfiability)
  *   **The Safety-Speed Dilemma:** The most profound tension exists between **Default Risk Aversion** (requiring high barriers to action) and the **Rescue Imperative** (requiring low barriers in emergencies).
  *   **Why Unsatisfiable?** You cannot simultaneously:
      1.  Make it *very hard* for any single person to trigger a potentially harmful action (to prevent reckless/erroneous acts).
      2.  Make it *very easy* for any single person to trigger a potentially lifesaving action (to enable swift rescue).
  *   **The Crux:** *Every* unilateral action under uncertainty carries both potential upside (rescue) and potential downside (harm). The system must categorize actions *before the fact*. This categorization is fallible:
      *   **False Positive (Harm):** Classifying a reckless/erroneous action as a "rescue" scenario allows harmful unilateral action (violating Default Risk Aversion, Judgment Mitigation, Epistemic Modesty).
      *   **False Negative (Paralysis):** Classifying a genuine rescue scenario as requiring high consensus blocks necessary action (violating the Rescue Imperative).
  *   **Motivating Failure Modes:**
      *   *Over-Conservatism:* A fire alarm requires confirmation from 3 people before sounding. Everyone assumes someone else will confirm. Fire spreads. (Rescue Imperative violated).
      *   *Over-Permissiveness:* Any soldier can launch a "preventative strike" if they perceive an "imminent threat." One jumpy soldier triggers a war based on a misunderstanding. (Default Risk Aversion, Judgment Mitigation, Epistemic Modesty violated).

  ### Brief Solution Scorecard (Focus on Tension Management)
  *   **Strict Prohibition:** Bans unilateral action entirely. *Fails* Rescue Imperative catastrophically.
  *   **Ex Ante Designation:** Pre-assigns unilateral authority to specific roles/individuals for specific domains. *Tension:* Relies heavily on perfect role assignment/trust (Epistemic Modesty challenge). Can still fail Rescue (wrong person present) or enable Harm (designated actor errs).
  *   **Justification & Accountability:** Requires public justification post-hoc and severe sanctions for bad outcomes. *Tension:* May deter genuine rescuers fearing punishment for honest mistakes (chills Rescue Imperative). Hard to adjudicate intent.
  *   **Epistemic Thresholds:** Requires the actor to meet a high bar of perceived certainty/justification internally or via limited checks. *Tension:* Subjective and manipulable. Who checks the checker under time pressure? (Scalability/Urgency challenge).
  *   **Multiplicity/Safety Nets:** Requires multiple independent actors to initiate separately (e.g., nuclear codes). *Tension:* Severely undermines the Rescue Imperative in urgent, small-group scenarios. Introduces coordination problems.
  *   **Domain Partitioning:** Splits decisions into "rescue-like" (low threshold) and "harm-risk" (high threshold) categories. *Tension:* The categorization problem itself is vulnerable to error and manipulation (False Positives/Negatives). Defining clear boundaries is often impossible.

  **Conclusion:** The core of the unilateralist's curse is the **inescapable trade-off between preventing harmful unilateral actions and enabling necessary ones.** The non-negotiable desiderata (1-4) pull in opposite directions. The contested desiderata (5-6) attempt to manage this trade-off contextually but introduce their own complexities. No solution perfectly satisfies all requirements simultaneously; any adequate theory must explicitly acknowledge and manage this fundamental tension, prioritizing which failures (harmful action vs. paralyzed inaction) are more tolerable in specific contexts. The choice is always between different types of risk.
