prompt: |-
  I run a small philosophy podcast, and in two weeks I'm interviewing a philosopher who's been arguing that the separateness of persons objection to utilitarianism collapses once you accept a reductionist account of personal identity — the idea being that if the boundaries between persons are less deep than we think, then the objection that utilitarianism ignores those boundaries loses its grip. He's published a couple papers on this and I want to push him past the stuff he's said before. Write me eight to ten questions. I need at least: one question that presses on whether the metaphysics is really doing the normative work here, or whether he's just using Parfit to change the subject; one question about the practical case — if I can prevent a terrible harm to myself or a slightly smaller harm to a stranger, does his view actually say something different from what common sense says, and if not, what's the point of the metaphysics; and one question about whether he's committed to saying the boundary between me and you is no more morally significant than the boundary between me-now and me-next-week. For each of those, include a follow-up that anticipates his most likely move. A few of the remaining questions can be wildcards, but they should still cut against the view — no softballs about what drew him to philosophy.
