prompt: |-
  I serve on a regional health authority's priority-setting committee. We regularly consider proposals that would narrow an inequality in health outcomes or service provision between two groups by making the better-off group worse off, with no clear benefit to the worse-off group: for instance, closing a service in an affluent area to match provision in a deprived one, or capping a treatment for everyone so that the better-off lose access while the worse-off are unchanged and the gap shrinks. I want a reusable decision procedure the committee can run on any such proposal, grounded in prioritarianism and the leveling-down objection. It should ask its questions in order; say what counts as a sufficient answer at each step; say where the procedure stops with a 'no' and where it must hand the decision to a person because the question is one of values rather than facts; and mark which steps are judgment calls dressed up as procedure. We have about ninety minutes per proposal, no member has formal training in moral philosophy, and the decision must be defensible to elected officials. Then run the procedure on these three proposals: (a) closing a diabetes clinic in an affluent district to match provision in a deprived district, with no redeployment of staff or budget, where the only claimed benefit is that the deprived district no longer sees a visible symbol of unequal provision; (b) closing the same clinic and redeploying its staff and budget to the deprived district, where the deprived district gains, but by less in raw health terms than the affluent district loses; and (c) capping physiotherapy sessions for everyone at the lower of the two current levels, which leaves the worse-off group unchanged and returns the savings to the treasury, so that the gap closes while no one gains. At least one of these should produce an answer the committee will find difficult to accept, and you should say plainly what the procedure cannot settle. Please write the answer in British English.
reasoning: |-
  Okay, the user serves on a regional health authority's priority-setting committee and needs a reusable decision procedure for proposals that narrow health inequalities by making better-off groups worse off without clearly benefiting worse-off groups. They want this grounded in prioritarianism while addressing the leveling-down objection. The procedure must be practical for 90-minute meetings with non-philosophers and defensible to elected officials. They also want it applied to three specific proposals, including at least one that'll challenge the committee.

  First, I need to understand the core tension: prioritarianism focuses on giving priority to the worse-off, but leveling-down objections reject making anyone worse off if it doesn't help the worst-off. The procedure must navigate this while being accessible. 

  The user's context is crucial - they're policymakers, not ethicists. The procedure needs clear stopping points where value judgments kick in, and it must flag when "technical" steps are actually judgment calls. British English phrasing is requested, so I'll avoid Americanisms like "prioritize" without "prioritise".

  For the decision tree: I'll build it around key prioritarian checks - does it help the worst-off? Is leveling-down justified? - while incorporating practical constraints. The first question should screen out pure leveling-down cases. Subsequent steps need to handle trade-offs where benefits to worse-off don't fully offset losses to better-off. 

  Important to distinguish factual questions (e.g., "does this help group X?") from value judgments (e.g., "is this priority weighting acceptable?"). The latter must be explicitly handed to the committee. Also need to mark steps where "objective" calculations mask subjective choices, like health outcome valuations.

  For the three cases:
  - Proposal A is pure leveling-down - no benefits, just harm. Should be rejected early in the procedure.
  - Proposal B involves trade-offs: worse-off gain but less than better-off lose. This will require value judgments about priority weighting.
  - Proposal C is leveling-down disguised as savings. Should be rejected unless savings directly help worst-off, which they don't here.

  The challenge case is clearly B - committees often struggle with accepting net health losses even for equity gains. The procedure will force explicit discussion of how much priority the worst-off deserve, which may be uncomfortable but necessary.

  Final output needs: ordered questions with decision thresholds, clear "no" exits, handover points for value judgments, and flags on subjective steps. Then parallel analysis for each proposal highlighting where B gets contentious.
answer: |-
  Here is a reusable decision procedure for your committee, grounded in prioritarianism (giving priority to improving the situation of the worse-off) while respecting the leveling-down objection (rejecting changes that make some worse off without making anyone better off). It is designed for practicality, defensibility, and clarity on value judgements.

  **The Leveling-Down & Priority Decision Procedure (British English)**

  1.  **Question 1: Does the proposal improve the absolute health outcomes or access of the identified worse-off group?**
      *   **Sufficient Answer:** Requires clear, evidence-based demonstration of measurable improvement (e.g., reduced waiting times, increased service utilisation by the target group, improved clinical outcomes). Vague claims about "fairness" or "symbolism" are insufficient.
      *   **Outcome:**
          *   **YES:** Proceed to Question 2.
          *   **NO:** Proceed to Question 1a.

  2.  **Question 1a (If NO to Q1): Is the *only* claimed benefit a reduction in the inequality gap itself (leveling-down)?**
      *   **Sufficient Answer:** Relies on the proposal documentation and proponents' arguments. If no concrete benefit to the worse-off is claimed or demonstrable beyond a smaller gap, the answer is YES.
      *   **Outcome:**
          *   **YES:** **STOP. RECOMMEND REJECTION.** Grounded in the leveling-down objection: Making anyone worse off without improving anyone else's lot is unjustifiable under prioritarianism and generally indefensible. *(Value Handover: None needed - core prioritarian/egalitarian rejection of pure leveling-down is established principle).*
          *   **NO:** Proceed to Question 2 (if some other absolute benefit is claimed for the worse-off, however small).

  3.  **Question 2: Does the proposal make the identified better-off group worse off?**
      *   **Sufficient Answer:** Evidence-based assessment of negative impact on the better-off group (e.g., loss of service, increased waiting times, reduced access). Assumes baseline is current provision.
      *   **Outcome:**
          *   **NO:** Proceed to standard cost-effectiveness/benefit assessment (outside this specific procedure). *The equity concern triggering this procedure isn't present.*
          *   **YES:** Proceed to Question 3.

  4.  **Question 3: Quantify Net Health Impact: Does the proposal result in a net *gain* in overall population health/access?**
      *   **Sufficient Answer:** Requires best available evidence to compare the *magnitude* of the loss to the better-off group and the gain to the worse-off group, using a common metric (e.g., QALYs gained/lost, waiting time reduction/increase aggregated meaningfully, utilisation changes). *Judgment Call Flag:* **This step involves significant judgment.** Choosing and applying a common health metric is inherently value-laden. Assumptions about valuing different health states or types of access must be made explicit and acknowledged.
      *   **Outcome:**
          *   **NET GAIN:** Proceed to Question 4.
          *   **NET LOSS or NET NEUTRAL:** Proceed to Question 3a.

  5.  **Question 3a (If NET LOSS/NEUTRAL to Q3): Is the absolute gain to the worse-off group sufficiently large *in itself* to justify the loss to the better-off, even without a net population gain?**
      *   **Sufficient Answer:** **VALUE JUDGMENT HANDOVER.** This is the core prioritarian question. The committee must decide: Does the principle of giving priority to the worse-off justify accepting a net loss (or no net gain) to the overall population's health? Factors include:
          *   The *size* of the gain to the worse-off.
          *   The *size* of the loss to the better-off.
          *   The *degree of disadvantage* of the worse-off group.
          *   The *availability of alternative ways* to help the worse-off group without harming the better-off.
      *   **Outcome:** Committee deliberation and vote required.
          *   **YES, Justified:** Proceed to Question 4.
          *   **NO, Not Justified:** **STOP. RECOMMEND REJECTION.** Prioritarianism does not mandate making the worse-off better off *at any cost* if the cost (net loss) is deemed too high for the benefit achieved.

  6.  **Question 4: Is the proposal the most efficient way to achieve this specific gain for the worse-off group?**
      *   **Sufficient Answer:** Evidence-based consideration of alternatives. Could the same resources achieve a *larger* gain for the worse-off group? Could the gain be achieved *without* harming the better-off group? *Judgment Call Flag:* **This step involves judgment.** Requires defining the scope of "efficiency" (strictly health outcomes? broader social value?) and assessing feasibility of alternatives.
      *   **Outcome:**
          *   **YES:** **PROCEED TO FULL COMMITTEE APPROVAL PROCESS** (considering budget, feasibility etc., alongside this equity assessment).
          *   **NO:** **RECOMMEND REJECTION OR DEFERRAL.** Pursue the more efficient alternative instead. Harming the better-off is only justifiable if it's the necessary or best way to achieve the priority gain.

  **Procedure Summary:**
  *   **Key "No" Stops:** Pure Leveling-Down (Q1a YES), Unjustified Net Loss (Q3a NO), Inefficiency (Q4 NO).
  *   **Value Handover Points:** Core Prioritarian Trade-off (Q3a).
  *   **Judgment Call Flags:** Quantifying Health Impact (Q3), Assessing Efficiency (Q4).

  ---

  **Application to Proposals:**

  **(a) Closing affluent district diabetes clinic (no redeployment, only symbolic benefit)**
  1.  **Q1:** Does it improve worse-off (deprived) group's outcomes/access? **NO.** (No redeployment, no change for deprived area).
  2.  **Q1a:** Is the only benefit reducing the gap? **YES.** (Symbolic benefit = gap reduction).
  3.  **Outcome: STOP. RECOMMEND REJECTION.** Pure leveling-down. No one gains, affluent group loses. Indefensible under prioritarianism and leveling-down objection. Committee should find this straightforward.

  **(b) Closing affluent clinic & redeploying staff/budget to deprived district (deprived gain < affluent lose in raw health terms)**
  1.  **Q1:** Improve worse-off group? **YES.** (Deprived area gains a service).
  2.  **Q2:** Make better-off worse off? **YES.** (Affluent area loses their clinic).
  3.  **Q3:** Net Health Gain? **NET LOSS.** (Deprived gain < Affluent loss in raw health terms).
  4.  **Q3a:** Is the gain to the worse-off sufficiently large *in itself* to justify the loss? **VALUE JUDGMENT HANDOVER.**
      *   *Factors for Committee:* How much *smaller* is the gain than the loss? How severe is the deprivation? Are there *other ways* to boost the deprived area's service without closing the affluent one? Is this the *only feasible option*?
      *   *Challenge:* Committee must accept that the overall population is slightly worse off health-wise, but argue the *priority* given to improving the worse-off justifies this. This is the core prioritarian trade-off and may be difficult. They must explicitly weigh the size of the loss against the priority principle. **This is where the procedure forces a difficult, values-based discussion.** The answer depends entirely on the committee's assessment of priority weighting and the specific magnitudes involved. The procedure doesn't settle it; it forces the committee to confront the value choice.

  **(c) Capping physio for everyone at the lower level, savings to treasury, gap closes, no one gains.**
  1.  **Q1:** Improve worse-off group? **NO.** (They are unchanged).
  2.  **Q1a:** Is the only benefit reducing the gap? **YES.** (Gap closes because better-off lose access, worse-off unchanged, savings don't benefit health).
  3.  **Outcome: STOP. RECOMMEND REJECTION.** Pure leveling-down. Better-off group loses access, worse-off group unchanged, no health benefit to anyone, savings not used for health. Clearly violates the leveling-down objection and prioritarianism (fails to benefit the worse-off). Committee should find this straightforward to reject.

  **What the Procedure Cannot Settle:**
  The procedure cannot resolve the **core value judgment in Question 3a**: How much net health loss (or how small a gain for the worst-off) is acceptable to achieve a priority-based improvement for the worst-off when harming the better-off is the only feasible means? This is a fundamental question of distributive justice (how much priority the worst-off deserve) that requires democratic deliberation and committee judgment, not a procedural algorithm. The procedure forces this question into the open and provides a structured way to debate it, but the answer depends on the committee's (and ultimately society's) values. The quantification in Q3 helps inform this judgment but doesn't replace it.
