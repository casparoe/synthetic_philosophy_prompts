prompt: |-
  I keep going back and forth on this and it's driving me nuts. The standard argument says voting is irrational — your chance of actually deciding an election is basically zero, so the expected value of your vote is nothing, and any cost at all (time, gas, standing in line) makes it a bad bet. Mathematically that checks out. But then I look around and I see political scientists treating voter turnout as a serious thing to study, philosophers writing about civic duties, and plenty of people who definitely get the expected-value argument still showing up at the polls. So is the economic argument just wrong, or are all these people systematically irrational about this one thing? What am I missing? Keep it to one paragraph.
reasoning: |-
  Okay, the user is really wrestling with the classic paradox of voting—why do people vote if the expected value is near zero? They've clearly encountered the rational choice theory that says voting is irrational due to negligible impact versus costs, yet they observe real-world importance placed on turnout and civic duty. Their frustration is palpable: they want to reconcile cold math with warm human behavior.

  Hmm, the core tension here is between micro-level rationality (individual vote's insignificance) and macro-level phenomena (collective action problems). The user seems analytically minded—they've grasped the math but sense something's missing. They might be implicitly asking: "If voting is irrational, why hasn't democracy collapsed?" 

  I should emphasize that the economic model isn't wrong, just incomplete. It ignores psychological factors (duty, expressive utility) and systems-level effects. Also worth noting that while one vote rarely swings elections, close races do happen (Bush-Gore 2000!), making probability calculations messier than theory assumes. 

  The user's deeper need might be ethical: they want permission to dismiss voting as irrational, or conversely, validation for feeling it matters. I'll sidestep that to focus on why the paradox persists—people aren't calculators, they're social creatures who derive meaning from participation. 

  Key points to pack in: expressive utility, civic identity, and how tiny individual probabilities aggregate into certainty at scale. Must avoid academic jargon though—they want a concise "aha!" not a lecture.
answer: |-
  The economic argument isn't *wrong* mathematically for an isolated vote, but it's incomplete—it ignores crucial psychological, social, and systemic factors. People derive value from fulfilling civic duty, expressing identity, or contributing to a collective outcome they care about ("expressive utility"), which outweighs the negligible instrumental chance of deciding the election. Furthermore, if everyone acted purely on the "pivotal vote" probability, democracy collapses, so participating becomes a social norm reinforced by duty. Political scientists study turnout *because* these collective behaviors, driven by non-instrumental motives, determine real political outcomes, making the aggregate rational even if individual participation defies narrow cost-benefit calculus. The paradox arises from applying individual rational choice models to a profoundly social and symbolic act.
