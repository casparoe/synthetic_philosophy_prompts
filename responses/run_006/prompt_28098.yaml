prompt: |-
  I help run a small prediction-market platform where the traders are a mix of employees of our parent company, a few outside quantitative types, and some hobbyists, and where we make markets in quarterly revenue, product launch dates, and a handful of public events. Several times a week I have to decide, on an incoming order, whether to move our quotes against it, hold them, or widen the spread, and I usually have about ten minutes before the market itself moves. I can move quotes modestly on my own; anything bigger has to be justified in writing to our risk committee. The recurring question is whether the person on the other side is telling me something I should believe, or is just different from me in a way that carries no information about the proposition. I know the rough shape of the no-trade theorem — that if two rational traders really shared a prior, one of them would update on the other's very willingness to trade until the disagreement collapsed, so purely informational differences should not by themselves produce a trade, and that real trade has to be explained by hedging, liquidity, risk appetite, different priors, or someone being irrational — but I don't know how to turn that into something I can actually run on a live order without a model.

  Write me a decision procedure for a single incoming order, grounded in what the no-trade result and the epistemology of markets actually imply. It should be a checklist I can execute in my ten-minute window: the questions to ask in order, what counts as a good enough answer to each before I move on, where the procedure should stop and say this is just a hedge or a liquidity need and I should not update, where it should say update and roughly how much when I cannot get a number, and where it has to hand the decision to a human because the question is about whose prior or model is better rather than about evidence. Then run the procedure on three orders: a corporate employee selling a revenue market to hedge an equity award; a hobbyist taking the other side of a public-events market with no apparent hedging or liquidity motive; and a sophisticated outside trader repeatedly buying a market we think is fairly priced after a long stretch in which our pricing has been right. I want the procedure to be honest about the case where it forces me to do something I will not like — treating a hobbyist's order as information, or refusing to let me dismiss an annoying counterparty as simply irrational — and about what it cannot decide for me. Write the whole thing as continuous prose, the way you would write a memo or an email: no headings, no bullet points, no bold text, and no tables.
reasoning: |-
  Okay, the user runs a small prediction market and needs a practical decision procedure for handling incoming orders based on market theory, especially the no-trade theorem. They want a checklist they can execute in ten minutes, without complex models, to decide whether to update quotes based on an order or attribute it to non-informational reasons like hedging or liquidity. They also want three concrete examples tested against this procedure. The challenge is balancing theoretical rigor with real-world constraints like time pressure and incomplete information.

  First, I need to unpack the no-trade theorem's implications. The theorem says rational traders with shared priors shouldn't trade purely due to informational differences—they'd update beliefs until disagreement disappears. So real trades must stem from other factors: hedging needs, liquidity demands, risk appetite differences, divergent priors, or irrationality. The procedure must distinguish these cases quickly.

  For the decision flow, I consider a logical sequence of questions prioritizing efficiency. Start with identifying the counterparty (known corporate insider? hobbyist?). Then probe for hedging/liquidity motives—the easiest filters. If those exist, no belief update is needed. If not, assess if they possess unique information (e.g., non-public data). If yes, update significantly. If no, check if they're sophisticated—if irrationality seems likely, dismiss; if sophisticated, face the "prior/model clash" dilemma requiring human judgment. 

  The examples test edge cases: 
  - The employee hedging equity awards is straightforward—no update. 
  - The hobbyist with no apparent motive forces confronting potential information value despite bias. 
  - The sophisticated trader repeatedly buying a "fair" market challenges overconfidence in one's model.

  Key tensions to address: 
  - The procedure must force uncomfortable actions (e.g., taking hobbyists seriously). 
  - It must admit when it can't decide (e.g., model superiority debates). 
  - Updates should be coarse (modest/significant) given time limits.

  I structure the response as a memo-style narrative flow, avoiding markdown. The tone should be practical yet intellectually honest, acknowledging where theory meets operational friction. For the examples, I explicitly walk through each step's outcome and decision (hold quotes/widen/update) to model the procedure's application.
answer: |-
  Here’s a decision procedure grounded in the no-trade theorem and market epistemology, designed for your ten-minute window. It’s a sequence of questions to ask yourself about the incoming order, with thresholds for action and explicit acknowledgment of its limitations and uncomfortable implications. After outlining it, I’ll apply it to your three scenarios.

  **The Decision Procedure:**

  Start the clock. Your first question is: **"Do I know who the counterparty is, and does their identity immediately suggest a motive unrelated to informational advantage?"** If yes, and the motive is verifiable (e.g., a corporate employee hedging compensation tied to revenue), stop. This is likely hedging or liquidity. Do not update your quotes based on the order itself; your prior remains unchanged. You might still adjust quotes slightly for liquidity management if the order size strains the market, but this isn’t belief updating. If identity/motive is unclear, proceed.

  Second question: **"Is there a plausible, non-informational reason for this specific trade, given the counterparty type or the market context?"** Consider: Could this be portfolio rebalancing? A need for cash (liquidity)? An expression of differing risk tolerance (e.g., a quant sizing based on volatility, not new info)? A hobbyist experimenting or acting on a hunch? If a strong, plausible non-informational reason exists (e.g., "Hobbyists often trade on whims," "This quant is known to trade volatility"), treat it as noise. Do not update beliefs; hold or minimally adjust quotes for liquidity. If no plausible non-informational reason surfaces quickly, proceed – the signal might be real.

  Third question: **"Does this counterparty have potential access to material, non-public information (MPI) relevant to this specific market?"** This is critical. For corporate employees in revenue/product launch markets: Assume YES unless you have specific, credible reason to believe otherwise (e.g., they work in an unrelated department, and the market is about a secret project they couldn't know about). For outsiders in public events: Assume NO unless you have specific, credible reason to believe YES (e.g., the hobbyist runs a relevant niche blog, the quant specializes in this exact geopolitical issue). If potential MPI access exists (especially for insiders), update your beliefs SIGNIFICANTLY. Move quotes against the order by a meaningful amount (e.g., halfway towards the order price, or more if the order size is large relative to the market). Justify a larger move to the risk committee as "counterparty potential MPI access." If no potential MPI access, proceed.

  Fourth question: **"Is the counterparty demonstrably sophisticated and rational in this domain?"** This separates potential information from likely noise/error. A known quant with a track record in similar markets? Sophisticated. A hobbyist with a history of erratic trades? Not sophisticated. If the counterparty is unsophisticated/irrational in your assessment (based on past trades or known behavior), treat the order as noise. Do not update beliefs; hold quotes or widen slightly if concerned about being picked off by others. Dismissing someone as irrational *is* allowed here, but be honest – is it truly irrationality, or just a difference in analysis you don’t understand? If you cannot confidently dismiss them as unsophisticated/irrational, or if they *are* sophisticated, you face the core dilemma. Proceed.

  You’ve now reached the hard part. The counterparty has no clear non-informational motive, no obvious MPI access, but is sophisticated (or you can't rule out sophistication). The no-trade theorem screams that purely informational differences *shouldn't* lead to trade if priors are shared and both rational. So: **"Is this trade forcing me to confront a fundamental difference in prior beliefs or models, rather than just a difference in evidence interpretation?"** This is the crux. You *must* hand this to human judgment ("yourself plus the committee"). You cannot algorithmically decide whose prior or model is better within ten minutes. The procedure stops here. The choices are: 1) Assume *your* prior/model is superior (justify holding/widening quotes due to "model confidence despite counterparty action"), 2) Assume the *counterparty's* action signals their model/prior might be better (update modestly, e.g., nudge quotes 25% towards the order price, acknowledging model uncertainty), or 3) Widen the spread significantly (acknowledging profound uncertainty about the "right" price due to clashing worldviews). Document the rationale meticulously for the committee. This step is uncomfortable but necessary; the no-trade theorem implies that persistent trade between rational actors *requires* such fundamental disagreements.

  **Summary of Actions:**
  *   **Hedging/Liquidity Motive Clear:** No update. Hold or minimal liquidity adjustment.
  *   **Plausible Non-Informational Motive:** No update. Hold or minimal liquidity adjustment.
  *   **Potential MPI Access (Especially Insiders):** Update SIGNIFICANTLY. Move quotes hard against the order.
  *   **Unsophisticated/Irrational Counterparty:** No update. Hold or widen slightly defensively.
  *   **Sophisticated Counterparty, No MPI, No Clear Motive -> Model/Prior Clash:** HUMAN JUDGMENT REQUIRED. Decide: Hold/Widen (confidence in your model), Update Modestly (acknowledging their model might be better), or Widen a lot (profound uncertainty). Justify.

  **Applied to Your Orders:**

  1.  **Corporate Employee Selling Revenue Market (Hedge):** You know the counterparty (employee). Identity immediately suggests a hedge motive (equity award). **Stop at Question 1.** This is hedging. Do not update your belief about future revenue based on this sell order. Hold quotes or make minimal adjustments only if the size temporarily imbalances the book. No informational signal inferred.

  2.  **Hobbyist Buying Public-Events Market (No Apparent Motive):** Identity known (hobbyist). No *immediate* known motive (Question 1). Question 2: Plausible non-informational reasons exist (hunch, boredom, experimentation). However, if this particular hobbyist has been surprisingly accurate before, proceed cautiously. Question 3: Public events market. Does this hobbyist have *potential MPI access*? Almost certainly **No** (unless they are secretly a key diplomat!). Question 4: Is the hobbyist sophisticated? Based on your description ("hobbyist"), likely **No** or **Uncertain**. **Likely stop at Question 4.** Treat as noise/irrationality. Do not update beliefs. Hold quotes or widen the spread *very slightly* if concerned they might attract copycats, but this is defensive, not belief-updating. **The Uncomfortable Bit:** If this hobbyist has a *consistent track record* of being right in *this specific type* of public event market, Question 4 becomes harder. You can't confidently dismiss them as unsophisticated. You might be forced towards the Model/Prior Clash step (Question 5) and have to consider a modest update ("Maybe this hobbyist sees something in the public data we weight differently") – which feels wrong but the logic demands it if they have a pattern of success.

  3.  **Sophisticated Outside Trader Repeatedly Buying "Fair" Market:** Identity known (sophisticated quant). Question 1: No *immediate* known non-informational motive (though possible). Question 2: Plausible non-informational reasons? Maybe (volatility play, very long-term view differing from your quarterly horizon, portfolio rebalancing). If you can quickly identify one (e.g., "They always size like this when vol spikes"), stop. Assume noise. But let's assume no clear motive emerges. Question 3: Potential MPI access? For revenue/product launch – **Likely No** (outsider). For public events – **Likely No** (unless niche expertise). Question 4: Counterparty is demonstrably **Sophisticated**. **Proceed to Question 5 - Model/Prior Clash.** This is the core challenge. The no-trade theorem says this repeated trade implies a fundamental disagreement in priors or models. You cannot algorithmically resolve whose is "better." Human judgment required within your ten minutes. Options:
      *   *Hold/Widen (Confidence in Your Model):* "Our pricing has been right, their model might be misfiring on this one, or they have a different risk profile/strategy." Justify holding firm or widening to avoid being picked off.
      *   *Update Modestly (Acknowledging Their Model):* "A sophisticated player persistently disagreeing suggests our model might be missing something, even if we can't see it. Move quotes up slightly against their buys (e.g., 10-20% towards their price), acknowledging increased uncertainty but not capitulating."
      *   *Widen Significantly (Profound Uncertainty):* "This persistent disagreement reveals deep uncertainty about the correct model/prior. Widen the spread substantially to reflect this lack of consensus." This is the "no-trade" outcome manifesting as spread widening.
      *   **The Uncomfortable Bit:** The procedure *forces* you to confront that this trader, by being sophisticated and trading persistently without a clear non-info motive, is almost certainly operating under a *different prior or model structure* than yours. You *cannot* dismiss them as irrational without evidence. You must make a conscious choice about whose worldview you trust more *in this specific instance*, or admit deep uncertainty, and act accordingly. Ignoring it is violating the logic of rational disagreement.

  This procedure forces uncomfortable choices: taking hobbyists potentially seriously if they show skill, and never dismissing sophisticated players as simply "wrong" without confronting the model clash. It explicitly admits its limits at the Model/Prior Clash step. It prioritizes MPI risk (especially insiders) and gives clear off-ramps for liquidity/hedging. It uses coarse adjustments (None / Minimal / Modest / Significant) compatible with a ten-minute window. Remember, it’s a framework for disciplined thinking under uncertainty, not a precise calculator. Its value is in forcing you to confront the *type* of disagreement the market is revealing.
