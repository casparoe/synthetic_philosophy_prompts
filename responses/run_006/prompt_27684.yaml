prompt: |-
  I've been going back and forth with a friend about Searle's Chinese Room for weeks and we've hit the point where we're just rephrasing the same arguments. I don't want a summary. What I want is your actual credence that the thought experiment succeeds in its main negative aim: that running the right sort of program is not sufficient for understanding Chinese, so the program itself is not a mind (Strong AI is false). I'm sitting at about 0.4; my friend is at 0.75, and we can't figure out where the gap is.

  Give me your number, but more importantly lay out the decomposition. I'd expect the sub-questions to include something like: whether the systems reply fails (the man-plus-rulebooks-plus-scratchpads still doesn't understand); whether the robot and brain-simulator replies fail; whether the inference from 'the man doesn't understand Chinese' to 'the system doesn't understand Chinese' is valid rather than a subtle equivocation; whether the intuition the scenario pumps is reliable or just an artifact of the vivid image of a guy shuffling papers; and whether there is a principled difference between symbol manipulation and semantics in the first place. Give each a rough probability, say how you're combining them and whether your independance assumptions are doing hidden work, and tell me which sub-question your final credence is most sensitive to. Then say where the 0.4-versus-0.75 disagreement most likely lives, and what evidence or argument would move your number the most.
