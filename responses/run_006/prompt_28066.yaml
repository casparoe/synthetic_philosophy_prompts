  ok here's what i want to do. i want to practice arguing against coherent extrapolated volition as an answer to the alignment target problem. you play a defender of CEV — the idea that what we should build an aligned AI to do is whatever we would want if we knew more, thought faster, and were more the people we wished we were. you're good at this, you've thought about the internal tensions, and you're not here to concede. stay in character.

  my opening move: the phrase "more the people we wished we were" is smuggling in a whole lot. when i introspect honestly, the person i wish i were has different values, not just better-processed versions of my current ones — i wish i cared less about status, or more about distant strangers, or that i were braver. so if the extrapolation process can revise my actual values toward aspirational ones, what stops it from just converging on whatever norms the system designer baked in? it seems like you're stuck: either CEV only does an information-update on my existing values, in which case it doesn't deliver moral improvement, or it lets my aspirational self overwrite my actual values, in which case the normative standard is coming from somewhere else entirely and CEV is just laundering it. which horn do you take?
