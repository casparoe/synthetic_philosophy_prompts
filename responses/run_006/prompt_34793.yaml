answer: |-
  You've described a highly recognized and critically important phenomenon in the philosophy of science (especially social science), sociology, and science & technology studies (STS). The **established term** for this specific feedback loop is **"Looping Effects" (or "Hacking's Looping Effects")**, coined and elaborated by the philosopher **Ian Hacking**.

  Here's why it's the best fit and how it relates to nearby concepts:

  1.  **Hacking's Looping Effects of Human Kinds:**
      *   **Core Idea:** Hacking argued that classifying humans creates unique dynamics not found in classifying inanimate objects ("natural kinds") or even most animals ("indifferent kinds"). When we classify people (into "human kinds"), the classification itself becomes part of the way those people understand themselves, behave, and interact with the world. This *changes* the very thing being classified.
      *   **The Loop:** The classification (`C`) is applied to people (`P`). People classified under `C` become aware of `C`, react to it (embracing, resisting, modifying their behavior/narrative), and thus become `P'` (a changed population). Scientists/clinicians now observe `P'` instead of the original `P` and may modify the classification to `C'` to better fit `P'`. This `C'` then interacts with `P'` to create `P''`, and so on.
      *   **Your Description Matched:** You perfectly captured this: Introduction (`C`) -> People classified (`P`) -> Self-understanding, community, vocabulary, behavior change (`P -> P'`) -> Clinicians observe `P'` -> Diagnostic thresholds/expectations adjusted -> Manual revised (`C -> C'`) -> The cycle repeats.
      *   **Hacking's Key Insight:** The classification is not a neutral description of a pre-existing, stable entity; it is an active participant in *creating* and *transforming* that entity over time. The "kind" is inherently interactive and unstable.

  2.  **Nearby Concepts & Distinctions:**
      *   **Labeling Theory (Sociology):** Focuses on how societal labels (especially deviant ones like "criminal" or "mentally ill") can lead individuals to internalize the label and adopt associated behaviors (self-fulfilling prophecy). **Distinction:** Looping effects encompass labeling but go much further. They involve the *scientific/clinical system itself* adapting its categories based on the changed population (`C -> C'`), creating a dynamic, iterative process between classification and identity formation within institutional and community contexts. Labeling theory is often more static and focused on societal reaction and individual internalization.
      *   **Self-Fulfilling Prophecy:** A broader psychological concept where a belief (true or false) leads to behavior that makes the belief come true. **Distinction:** Looping effects are a specific *type* of institutionalized, dynamic self-fulfilling prophecy operating within scientific/medical systems, involving feedback into the classification system itself. It's systemic and iterative, not just individual.
      *   **Diagnostic Bracket Creep / Concept Creep:** Refers to the tendency for diagnostic criteria to expand over time, capturing more people or milder presentations. **Distinction:** Looping effects are a *major mechanism driving* bracket/concept creep. As people adapt to the label (`P -> P'`), clinicians see these adaptations as part of the "true" disorder, leading to broader criteria (`C -> C'`) to encompass `P'`. Looping explains *why* the bracket creeps.
      *   **Social Construction of Diagnosis / Illness:** The broad idea that diagnostic categories are not purely "natural" but shaped by social, cultural, historical, and political forces. **Distinction:** Looping effects provide a specific, dynamic *mechanism* for *how* this construction happens and evolves over time. It explains the *process* of construction through interaction and feedback. Not all social construction arguments focus on this specific feedback loop.
      *   **Illness Identity / Enactment (Medical Sociology/STS):** Examines how people actively construct identities around diagnoses and "enact" their illness in various ways. **Distinction:** This is a crucial *component within* the looping cycle (the `P -> P'` transformation), but looping effects encompass the *entire feedback system*, including the institutional response (`C -> C'`).
      *   **Reflexivity (Social Science):** The broader idea that social science itself can influence the social world it studies. **Distinction:** Looping effects are a specific, powerful, and problematic form of reflexivity applied to human classification systems, particularly in psychiatry and psychology.

  **Why "Looping Effects" is the Best Term:**

  *   **Specificity:** It directly names the *cyclical, feedback-driven process* you described: Classification -> Affects People -> Changed People -> Affects Classification -> Repeat.
  *   **Focus on Mechanism:** It emphasizes the *dynamic interaction* and *mutual transformation* between the classification system and the classified population.
  *   **Established Literature:** It's a well-known concept developed primarily in Hacking's work (e.g., *Mad Travelers: Reflections on the Reality of Transient Mental Illnesses* (1998), *The Social Construction of What?* (1999), numerous articles on "Making Up People") and widely discussed and applied in philosophy of psychiatry, sociology of health/illness, and STS.
  *   **Captures the "Human Kinds" Aspect:** It explicitly addresses the unique problem of classifying self-aware humans who react to the classifications applied to them.

  **In summary:** The dynamic you've identified is **exactly** what Ian Hacking described as **"looping effects"** (or the "looping effects of human kinds"). It's the most precise and established term for the feedback cycle where a psychiatric (or any human) classification changes the people it classifies, and those changed people subsequently necessitate changes to the classification itself, creating an ongoing loop of mutual constitution.
