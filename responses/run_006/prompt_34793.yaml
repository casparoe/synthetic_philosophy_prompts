  I should mention related terms like diagnostic bracket creep and social construction to cover adjacent concepts. Highlighting Hacking's contribution from the 90s would add context. The user probably wants to reference established literature, so pointing to Hacking's key works is important. Also, clarifying how looping effects differ from broader social construction—focusing on the feedback loop aspect.

