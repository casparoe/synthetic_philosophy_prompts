answer: |-
  Your struggle is both profound and familiar—it represents the collision between moral aspiration and human limitation. Below is a structured framework of desiderata for evaluating responses to the demandingness objection, grounded in the cases and tensions you've identified. The requirements are ordered by priority, with core intuitions distinguished from negotiable features, and key conflicts explicitly highlighted.

  ---

  ### **Core Desiderata (Non-Negotiable Bedrock)**
  1. **Requires Non-Trivial Sacrifice**  
     *What it must get right:* Morality cannot be cost-free. A theory demanding *nothing* (e.g., pure egoism) fails.  
     *Case:* **The Drowning Child** (Peter Singer). If you can save a child in a shallow pond at the cost of ruining your shoes, you must act. Any theory excusing inaction here is implausible.  
     *Why bedrock:* Moral indifference to easily preventable horrors is intolerable.

  2. **Resists Extreme Demands**  
     *What it must get right:* Morality cannot demand near-total self-annihilation (e.g., giving until marginal utility equality).  
     *Case:* **Life Savings vs. Global Poor**. If donating 99% of your income to effective charities is obligatory, personal projects (art, family, self-care) become immoral luxuries. This alienates morality from human flourishing.  
     *Why bedrock:* A theory that makes sainthood mandatory is self-defeating—it cannot motivate or guide real agents.

  3. **Accommodates Psychological Realism**  
     *What it must get right:* Morality must function for beings with finite willpower, emotions, and self-interest.  
     *Case:* **Parental Partiality**. Requiring a parent to donate a child’s college fund to strangers violates deep psychological and evolutionary attachments.  
     *Why bedrock:* If a theory ignores human nature, it becomes a purely theoretical construct, not a practical guide.

  ---

  ### **Substantive Requirements (Must Be Addressed Adequately)**
  4. **Balances Partiality and Impartiality**  
     *What it must get right:* Permits special obligations (to family, friends) without collapsing into tribalism.  
     *Case:* **Weekend Trip vs. Malaria Nets**. Why is it permissible to prioritize a partner’s happiness over strangers’ lives?  
     *Test:* A response must explain why partiality isn’t mere bias—e.g., by tying it to relationships as intrinsic goods.

  5. **Distinguishes Duty from Supererogation**  
     *What it must get right:* Some acts (e.g., heroic self-sacrifice) should be praiseworthy but not obligatory.  
     *Case:* **Organ Donation**. Is donating a kidney obligatory? If not, why is giving 50% of income obligatory?  
     *Key distinction:* A theory must clarify the line between "required" and "beyond the call."

  6. **Handles Scale and Scarcity**  
     *What it must get right:* Moral demands shouldn’t escalate infinitely with knowledge/opportunity.  
     *Cases:*  
     - **Global Poverty**: Does knowing about millions in need obligate you to work 80 hrs/week for charities?  
     - **Future Generations/Animals**: Do obligations to hypothetical beings or non-humans override current projects?  
     *Requirement:* A response must explain why morality isn’t a sinkhole for all resources.

  ---

  ### **Theoretical Virtues (Negotiable but Important)**
  7. **Theoretical Unity**  
     *Preference:* Avoids ad hoc exceptions (e.g., "give 30% because it feels right").  
     *Sacrifice if:* A less unified theory (e.g., pluralism) better explains intuitions.

  8. **Compatibility with Moral Motivation**  
     *Preference:* Shouldn’t rely on unrealistic willpower (e.g., constant self-denial).  
     *Sacrifice if:* Demandingness is intrinsic to morality (but this risks irrelevance).

  9. **Explanatory Power**  
     *Preference:* Justifies *why* a line is drawn (e.g., "cost to the agent" vs. "value of projects").  
     *Sacrifice if:* A pragmatic threshold (e.g., "demands ≤ 10% effort") resolves paralysis.

  ---

  ### **Intractable Conflicts: Where Desiderata Clash**
  - **Partiality vs. Impartiality (D2 vs. D4)**  
    *Conflict:* Permitting weekend trips (partiality) seems to license ignoring mass suffering (impartiality). Hybrid theories (e.g., Scheffler’s "agent-centered prerogatives") allow agents to weight their own interests but struggle to explain why this isn’t selfishness when stakes are high (e.g., famine relief).

  - **Psychological Realism vs. Sacrifice (D3 vs. D1)**  
    *Conflict:* If morality demands only what feels natural (D3), it excuses inaction (violating D1). But demanding heroic sacrifice (D1) ignores motivational limits (D3). **Solution?** Satisficing (Slote) or "moderate consequentialism" (Mulgan) sets a sacrifice threshold but risks arbitrariness.

  - **Supererogation vs. Scale (D5 vs. D6)**  
    *Conflict:* Calling large donations "supererogatory" (D5) may ignore the scale of suffering (D6). If a $1,000 donation saves a life, isn’t *not* donating akin to letting a child drown? **Solution?** Contextual duties (e.g., institutional vs. individual responsibility) may help, but no consensus exists.

  ---

  ### **Conclusion: Is Coherence Possible?**
  No theory satisfies all desiderata perfectly—**the conflict between D1 (sacrifice) and D2 (anti-extremism) is irreconcilable at the margins**. However, some frameworks manage the tensions better:
  - **Rule Consequentialism** (e.g., Hooker): Rules like "give 10% to charity" balance sacrifice and sustainability, but struggle with partiality.
  - **Capabilities Approach** (Nussbaum/Sen): Focuses on enabling human flourishing, permitting self-investment, but risks underspecifying duties to distant others.
  - **Scalar Consequentialism** (Norcross): Abandons "ought" for "better/worse," avoiding demands but losing prescriptive force.

  **Your way forward**: Prioritize which desiderata are non-negotiable *for you*. If preserving core partiality (D4) and psychological realism (D3) is essential, hybrid theories (e.g., Nagel’s agent-relative reasons) may be your best fit. If minimizing arbitrariness (D7) matters most, sophisticated consequentialism (e.g., with diminishing marginal demands) might prevail. Accept that any solution involves trade-offs—but the trade-offs can be made explicit, moving you from "special pleading" to conscious, justified equilibrium. The search isn’t futile, but it requires calibrating your moral compass to human constraints.
