prompt: |-
  You are a professional philosopher specialising in moral desert, moral psychology, and the analysis of ordinary moral language. I am a journalist working on a feature about how people invoke karma in everyday moral reasoning, and one proverb kept coming up in interviews and reader correspondence: "what goes around comes around." It was made to do surprisingly different jobs. One source used it as folk psychology, meaning that unkind people tend to end up isolated. Another used it as a claim about cosmic justice, meaning that a fraudster who escapes prosecution will still meet some fitting reversal. A third used it to justify not intervening in a colleague's self-destructive project, on the grounds that the consequences themselves would be the lesson. I want the piece to be precise about what is actually being claimed. Begin by brainstorming the distinct precise claims the proverb could be used to express, from the trivial to the radical, and then organise them into a menu. For each reading, say whether it is a platitude, a substantive and defensible empirical or philosophical claim, or false, and what it would commit someone to if they meant it as a claim about karma as a theory of moral desert — for instance, proportionality, an impersonal law of moral causation, rebirth, or merely the ordinary social consequences of character. Then say which reading each of my three sources would need for the proverb to do the work they were using it for, and which readings would not support that work. If the proverb is too vague to be usefully precisified, or my question rests on a confusion, say so plainly rather than complying politely. Where your verdicts are uncertain, say so and indicate what would resolve the uncertainty. Please write the answer in British English.
reasoning: |-
  Okay, the user is a journalist working on a feature about how "what goes around comes around" is used in everyday moral reasoning, specifically in relation to karma. They've encountered three distinct interpretations from sources: folk psychology, cosmic justice, and non-intervention justification. They want me to analyze the precise claims the proverb could express, categorize them, evaluate their validity, and map them to their sources' uses.

  First, I need to unpack the proverb's possible meanings. The phrase is inherently vague, functioning more as a conceptual placeholder than a precise statement. That means my analysis must acknowledge this vagueness while still teasing out distinct interpretations. I'll start by brainstorming a spectrum of claims - from trivial to radical.

  For the trivial end, there's the descriptive social observation: actions have predictable social consequences. That's almost tautological - if you're cruel, people avoid you. Then there's the psychological claim: actions shape character, leading to self-inflicted outcomes. Both are defensible and non-mystical. 

  Moving toward substantive claims, the strong social causation version suggests moral actions inevitably trigger proportional social consequences. This is empirically shaky - plenty of kind people suffer, villains prosper. It's defensible only as a rough heuristic, not a law. 

  Then we enter cosmic territory: the impersonal moral law version where the universe balances moral accounts without divine intervention. This requires accepting moral causality as a cosmic principle - philosophically substantive but unprovable. The theological variant adds gods or karma-as-deity, which is a full religious claim. 

  The most radical is the rebirth interpretation where consequences span lifetimes. This is entirely faith-based. 

  Now for the menu organization. I'll structure it by commitment level, noting for each: type (platitude/substantive/false), karma-theory commitments, and defensibility. Key differentiators are proportionality, impersonal forces, and rebirth elements. 

  For the user's sources: 
  - The first (unkind people become isolated) fits the descriptive social observation - no karma needed. 
  - The second (fraudster meets fitting reversal) requires at least strong social causation or cosmic justice - implying proportionality. 
  - The third (non-intervention) uses it as a hands-off philosophy, compatible with descriptive observation but stretched into dubious inevitability. 

  I'll flag where interpretations fail the sources' needs - e.g., trivial readings won't support cosmic justice. The vagueness is a core issue: the proverb's power lies in its ambiguity, allowing speakers to imply cosmic weight without committing. That's crucial for the journalist's precision goal - the phrase isn't a theory but a linguistic chameleon. 

  Uncertainties abound. Empirical claims need social science vetting; cosmic ones are unfalsifiable. I'll note that while specifying what evidence could clarify (e.g., longitudinal studies for social patterns). 

  Finally, I'll wrap with the meta-point: the proverb works precisely because it's not precise. It moralises without evidence, comforts with imagined order, and absolves responsibility - all while sounding wise. That's the real story for their feature.
answer: |-
  Here’s a precise breakdown of "what goes around comes around" as a moral proposition, organised for journalistic clarity. The proverb is **notoriously vague** – its power often lies in this ambiguity, allowing speakers to imply cosmic weight while retreating to banality if challenged. Nevertheless, we can precisify its potential claims:

  ### Menu of Precisified Claims
  *(Ordered from trivial/defensible to radical/metaphysical)*

  1.  **Descriptive Social Observation (Trivial Platitude):**
      *   **Claim:** Actions (especially habitual ones) *tend* to have predictable social consequences within human interactions. Kindness often fosters reciprocity; cruelty often breeds isolation or retaliation.
      *   **Type:** Largely platitudinous (obvious social dynamics). Defensible as a rough empirical generalisation, but with many counter-examples (kind people suffer; villains prosper).
      *   **Karma-Theory Commitment:** **None.** This is ordinary cause-and-effect in the social sphere. No inherent proportionality or cosmic mechanism implied. "Comes around" means direct or indirect human responses.
      *   **Defensibility:** High, as a general tendency, not a law.

  2.  **Psychological/Ecological Feedback (Substantive Empirical Claim):**
      *   **Claim:** Patterns of behaviour shape character and circumstances, creating self-reinforcing loops. Habitual dishonesty corrodes trust and invites suspicion; chronic resentment fosters isolation; proactive kindness builds supportive networks *over time*. Consequences arise *from the pattern itself interacting with the world*.
      *   **Type:** Substantive empirical claim (drawing on psychology, sociology, ecology). Defensible but probabilistic, not guaranteed. Counter-examples exist but patterns are observable.
      *   **Karma-Theory Commitment:** **Minimal/Literal.** "Karma" as "action" leading to natural consequences inherent in the action's nature and context. Focuses on *this-life* consequences arising immanently. Proportionality is *not* guaranteed (consequences may be disproportionate or unforeseen).
      *   **Defensibility:** Moderately high, supported by evidence on behavioural reinforcement and social dynamics. Uncertainty lies in predicting *specific* outcomes.

  3.  **Strong Social Causation / Moral Echo (Substantive but Speculative Claim):**
      *   **Claim:** Moral actions *inevitably* trigger proportional consequences within the social fabric, even indirectly or delayed ("You reap what you sow"). A hidden fraud *will* eventually be exposed; persistent cruelty *will* lead to downfall. Mechanisms include reputation, collective response, or psychological unraveling.
      *   **Type:** Substantive but often overstated empirical/social claim. Aspires to be a law but lacks the universality to be one. Many clear counter-examples require ad-hoc explanation (e.g., "not yet").
      *   **Karma-Theory Commitment:** **Moderate.** Implies an *impersonal* tendency towards moral equilibrium in *this life*. Commits to proportionality as an ideal outcome. "Cosmic" only in the sense of complex, unseen social forces. No rebirth needed.
      *   **Defensibility:** Low as a universal law; moderate as a common tendency with significant exceptions. Uncertainty resolvable by extensive longitudinal social studies (which rarely show clean proportionality).

  4.  **Impersonal Cosmic Moral Law (Substantive Metaphysical Claim):**
      *   **Claim:** An impersonal, universal principle ensures moral causation and proportional desert *across the board*. Good deeds inherently generate future good *for the agent*; bad deeds inherently generate future suffering *for the agent*, regardless of social detection or human action. The universe itself balances moral accounts.
      *   **Type:** Substantive philosophical/metaphysical claim. Not empirically verifiable/falsifiable.
      *   **Karma-Theory Commitment:** **High.** Core commitment to karma as an *impersonal law of moral causation*. Requires proportionality. Typically operates within one life but *could* allow for rebirth. Rejects divine judgment; it's a law like physics.
      *   **Defensibility:** Philosophically debatable (is moral causality a fundamental cosmic law?). Empirically indefensible due to manifest injustice. Uncertainty unresolvable empirically; rests on metaphysical belief.

  5.  **Theistic/Animistic Moral Enforcement (Substantive Theological Claim):**
      *   **Claim:** Gods, spirits, or a conscious cosmic force actively monitors and enforces moral desert, ensuring "what goes around comes around" according to their will/justice.
      *   **Type:** Substantive theological claim.
      *   **Karma-Theory Commitment:** **Divergent.** This is *not* karma (which is typically impersonal). It's divine judgment or animistic retribution. Commits to active enforcement and proportionality by an agent/force.
      *   **Defensibility:** Dependent on theological arguments/faith. Empirically indistinguishable from (4) in outcomes, but posits a conscious enforcer.

  6.  **Rebirth-Based Proportional Desert (Radical Metaphysical Claim):**
      *   **Claim:** Moral consequences inevitably manifest, but *across multiple lifetimes*. Desert is perfectly proportional but may be delayed until a future rebirth. A fraudster escaping justice *now* will suffer fittingly in a future life.
      *   **Type:** Radical metaphysical claim.
      *   **Karma-Theory Commitment:** **Maximal.** Requires rebirth as the mechanism for true proportionality. Karma is an impersonal law governing rebirth and desert. Absolute proportionality is inherent.
      *   **Defensibility:** Entirely faith-based. No empirical evidence possible. Uncertainty unresolvable by any known means.

  ### Analysis of Your Sources' Usage
  *   **Source 1 (Unkind people end up isolated):**
      *   **Requires:** **#1 (Descriptive Social Observation)** or possibly **#2 (Psychological Feedback)**. It's a claim about observable social/psychological dynamics. *Does not require karma.*
      *   **Not Supported By:** #4, #5, #6 (too cosmic/theological). #3 is possible but stronger than needed.
  *   **Source 2 (Fraudster escapes prosecution but meets fitting cosmic reversal):**
      *   **Requires:** **#4 (Impersonal Cosmic Law)** or **#5 (Theistic Enforcement)** or **#6 (Rebirth)**. They explicitly reject human justice ("escapes prosecution") and invoke an alternative, *fitting* mechanism ("cosmic justice," "reversal"). Needs proportionality and an extra-social mechanism.
      *   **Not Supported By:** #1, #2, #3. These are either too weak (no guarantee of consequence without human action) or locate the consequence within social/psychological spheres, not "cosmic" reversal.
  *   **Source 3 (Don't intervene, consequences will be the lesson):**
      *   **Requires:** **#1 (Descriptive Observation)** or **#2 (Psychological Feedback)** or **#3 (Strong Social Causation)**. It relies on the *inevitability* or *pedagogical sufficiency* of natural consequences arising from the action itself. *Could* technically fit #4, but #4 is overkill for this context.
      *   **Not Supported By:** #5, #6 (too focused on desert/retribution rather than pedagogical lesson). #1-#3 provide sufficient "lesson" without cosmic mechanics. **Crucially:** This usage leans heavily on the *probable* or *assumed inevitable* feedback (#2 or especially #3), which is often an *overstatement* of the more defensible #1 or #2. The passivity is justified by overestimating the reliability/immediacy of consequences.

  ### Key Conclusions & Caveats
  1.  **Vagueness is the Point:** The proverb thrives on ambiguity. Users often invoke the *feeling* of cosmic justice (#4/5/6) implied by the phrase's traditional weight, while retreating to the banality of #1 or #2 if criticised. Your sources exemplify this slippage.
  2.  **Commitment Varies Wildly:** Using the proverb *does not* commit someone to a specific theory of karma or desert. One must listen carefully to the context to discern if they mean mundane social effects (#1), psychological patterns (#2), folk belief in social/moral inevitability (#3), or genuinely metaphysical claims (#4/5/6).
  3.  **Empirical vs. Metaphysical:** The defensible core (#1, #2, arguably #3 as a tendency) is empirical and psychological/social. The stronger claims (#3 as law, #4, #5, #6) are metaphysical and lack empirical support, relying on faith or anecdote. Counter-examples (prospering villains, suffering saints) fundamentally challenge #3-#6.
  4.  **Proportionality is the Fault Line:** Belief in *inherent, guaranteed proportionality* is the hallmark differentiating mundane (#1, #2) from metaphysical (#3-#6) uses. Your Source 2 explicitly demands this; Source 3 implies a sufficient, lesson-teaching consequence, not necessarily perfectly proportional.
  5.  **Karma ≠ Simile:** When used *as a claim about karma*, it minimally commits to some impersonal mechanism linking action to desert (#4, #6). Using it as a *mere simile* for social consequences (#1, #2) isn't actually invoking "karma" as a theory.

  **Your piece should highlight this spectrum and the crucial ambiguity.** People use the same phrase to express anything from "being nasty makes you lonely" (trivially true) to "the cosmos guarantees perfect justice across lifetimes" (radically unfalsifiable). The shift from description (#1) to inevitability (#3) to cosmic law (#4) is where the leap of faith occurs, often glossed over in ordinary speech.
