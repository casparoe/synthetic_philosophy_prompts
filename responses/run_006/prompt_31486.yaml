answer: |-
  Here is a set of desiderata for any adequate account of the norm of assertion, formulated in British English, pitched to evaluate the knowledge, truth, belief, justification/warrant, and no-norm views. Each desideratum is motivated by specific cases or considerations, and their status as non-negotiable or contested is indicated.

  **Core Desiderata for a Norm of Assertion:**

  1.  **Handles Lottery Propositions (Non-negotiable):**
      *   **Case:** Asserting "My lottery ticket has lost" based *solely* on the high probability (e.g., 1 in 14 million) without any "inside information".
      *   **Requirement:** An adequate norm must explain why such assertions strike competent speakers as intuitively *improper* or epistemically deficient, even though the proposition asserted is overwhelmingly likely to be true.
      *   **Motivation:** Challenges norms that make truth or high probability sufficient (e.g., Truth Norm, weak Justification Norms). Suggests a need for something stronger, like knowledge or perhaps a specific kind of warrant.

  2.  **Explains Moorean Absurdity (Non-negotiable):**
      *   **Case:** Assertions of the form "p, but I do not believe that p" (Moorean) or "p, but I do not know that p".
      *   **Requirement:** An adequate norm must explain why asserting these conjunctions seems *inherently absurd*, contradictory, or self-defeating for the speaker, regardless of the truth of 'p'. It must explain the *performative inconsistency*.
      *   **Motivation:** Strongly challenges the Belief Norm (if belief is the norm, "p but I don't believe p" shouldn't be absurd) and the No-Norm view. Supports norms that require belief (making the first conjunct clash with the second) or knowledge (making the second conjunct deny the requirement for the first).

  3.  **Accommodates Warranted False Assertions (Non-negotiable for most):**
      *   **Case:** A speaker asserts 'p' based on what is, by all available and reasonable evidence, extremely strong justification (e.g., multiple credible eyewitnesses, seemingly reliable instruments), but 'p' is, unbeknownst to the speaker, false (e.g., due to an elaborate hoax or rare malfunction).
      *   **Requirement:** An adequate norm should be able to explain how such an assertion can be *blameless*, *reasonable*, or *warranted* from the speaker's perspective, even though it is incorrect. It must distinguish violation of the norm from epistemic blameworthiness.
      *   **Motivation:** Challenges factive norms (Knowledge, Truth) which deem such assertions *necessarily* improper because false/unknown. Justification and Belief norms handle this more easily. Highlights the need for a *subjective* or *internalist* component in evaluating propriety.

  4.  **Explains Impropriety of Assertions with Explicit Disavowals (Strongly Preferred):**
      *   **Case:** A speaker says "I don't know if p, but p" or "I don't believe p, but p" or even "I have no evidence for p, but p".
      *   **Requirement:** An adequate norm should explain why such assertions are generally improper *even if* 'p' is true and the speaker justifiably believes it (but denies knowledge/belief/justification). It should explain the intuitive oddness and potential criticism such assertions invite.
      *   **Motivation:** Reinforces the need identified by Moorean cases. Suggests the norm requires the speaker to *present themselves* as meeting a certain epistemic standard (knowledge, warrant). Challenges No-Norm and potentially weak Justification/Belief norms if they allow disavowing the very thing they require.

  5.  **Explains Testimonial Transmission (Non-negotiable):**
      *   **Case:** A hearer acquires a justified belief (or knowledge) that p based *solely* on a speaker's assertion that p, without independent investigation.
      *   **Requirement:** An adequate norm must explain what kind of epistemic standing the speaker must have regarding 'p' for the hearer to be *entitled* to form a justified belief (or knowledge) on the basis of the assertion alone. It should illuminate the normative expectations underpinning testimonial knowledge acquisition.
      *   **Motivation:** This is central to the epistemic function of assertion in communication. Knowledge Norm proponents argue it's best explained if the speaker must *know* to entitle the hearer to know. Other norms (e.g., Justification) need to explain how mere justified belief transmits justification/knowledge robustly. No-Norm struggles significantly.

  6.  **Explains Retraction and Challenge Patterns (Non-negotiable):**
      *   **Case:**
          *   *Retraction:* A speaker asserts p, later discovers compelling evidence against p or that their original evidence was flawed, and feels compelled to *retract* ("I take it back", "I was wrong").
          *   *Challenge:* Hearers appropriately challenge assertions with "How do you know?", "Are you sure?", or "What's your evidence?".
      *   **Requirement:** An adequate norm must explain *why* retraction is the appropriate response upon discovering one lacked the required epistemic standing (even if blameless initially), and why challenges like "How do you know?" are natural and revealing probes into the speaker's epistemic position.
      *   **Motivation:** Patterns of retraction and challenge reveal the community's implicit grasp of the norm. "How do you know?" suggests knowledge is the expected standard. Retraction upon discovering lack of knowledge (even if justified) is hard for non-Knowledge norms to explain fully. No-Norm struggles to explain the normative force behind retraction.

  **Essential Distinctions an Adequate Theory Must Respect:**

  *   **Violation vs. Blamelessness/Reasonableness:** A norm can be *violated* (the assertion fails to meet the constitutive standard) even if the speaker is *blameless* or *reasonable* due to misleading evidence (Desideratum 3).
  *   **Constitutive Norm vs. Pragmatic/Prudential Norms:** The core question is the *constitutive* norm that defines what it is to make an assertion, distinct from norms about when an assertion is *useful*, *polite*, *prudent*, or *morally permissible*. An assertion can be proper constitutively but imprudent, or constitutively improper but useful.
  *   **Norm of Assertion vs. Norms of Belief/Action:** The norm governing *saying* 'p' need not be identical to the norm governing *believing* 'p' or *acting* as if 'p'. An assertion norm might be stronger (e.g., requiring knowledge for assertion, but justified true belief for belief).
  *   **Propriety vs. Correctness:** An assertion can be *proper* (meets the constitutive norm) but *incorrect* (false), or *improper* (violates the norm) but *correct* (true) – though this distinction collapses for factive norms like Truth and Knowledge.

  **Potential Tensions Between Desiderata:**

  *   **Tension: Warranted False Assertions (3) vs. Retraction Patterns (6) & Testimonial Transmission (5):**
      *   Desideratum 3 demands blamelessness for warranted false assertions. Desiderata 5 & 6, however, seem to push towards a factive norm like Knowledge (which would deem these assertions improper). How can an assertion be blameless yet improper and require retraction?
      *   **Resolution Attempts:**
          *   *Knowledge Norm:* Bites the bullet on 3: Warranted false assertions *are* improper (violate the norm), but speakers can be *blamelessly ignorant* of this violation. Retraction is required because the norm *was* violated. Testimony transmits only if the speaker *actually* knew.
          *   *Justification Norm:* Holds such assertions are *proper* (meeting norm 3) and blameless. Must explain retraction (arguing it's due to new evidence making future assertion improper or conversational norms) and testimony (arguing speaker's strong justification transmits justification).
          *   *Truth Norm:* Similar to Knowledge Norm but stricter; false assertions are always improper, blameless or not. Struggles with lottery cases and testimony transmission.

  **The Most Eliminative Desideratum:**

  *   **Testimonial Transmission (Desideratum 5)** arguably does the most to eliminate candidate norms. It strongly favours the Knowledge Norm, as it provides a straightforward explanation for how testimony can generate knowledge in the hearer: the speaker must know. Other norms struggle:
      *   **Truth Norm:** A speaker asserting a truth doesn't entitle the hearer to know it; the hearer needs independent reason to believe the speaker is reliable/knowledgeable.
      *   **Belief Norm:** A speaker asserting what they believe doesn't entitle the hearer to form a justified belief; the hearer needs reason to think the speaker is justified/knowledgeable.
      *   **Justification Norm:** While better, it often struggles to explain why the hearer's belief would amount to *knowledge* rather than mere justified belief if the speaker's justification was good but non-factive (e.g., in Gettier cases).
      *   **No-Norm:** Provides no inherent epistemic grounding for testimonial justification/knowledge.

  **How the Five Views Fare Against Non-Negotiables:**

  1.  **Knowledge Norm:** Excels at Lottery (1), Moorean (2), Testimony (5), Retraction/Challenge (6). Struggles most visibly with Warranted False Assertions (3), requiring the violation/blamelessness distinction.
  2.  **Truth Norm:** Fails Lottery (1) (allows assertion), arguably handles Moorean (2) poorly ("p but I don't know p" isn't necessarily contradictory if truth is the norm). Fails Warranted False (3) (deems them improper). Struggles significantly with Testimony (5) and explaining the relevance of "How do you know?" challenges (6).
  3.  **Belief Norm:** Fails Lottery (1) (one can believe and assert on stats). Fails Moorean (2) catastrophically ("p but I don't believe p" shouldn't be absurd). Handles Warranted False (3) well. Struggles with Testimony (5) (believing p doesn't entitle hearer to believe p) and Retraction/Challenge (6) (retracting upon learning lack of *knowledge* is unexplained; "How do you know?" is misplaced if belief is the norm).
  4.  **Justification/Warrant Norm:** Fails Lottery (1) if justification is purely statistical (most versions do). Handles Moorean (2) if warrant requires belief. Excels at Warranted False (3). Can handle Disavowals (4) if warrant must be *presented*. Struggles with Testimony (5) (transmitting knowledge robustly) and fully explaining Retraction patterns (6) (why retract upon learning falsity if you were warranted?).
  5.  **No-Norm View:** Fails to adequately explain *any* of the non-negotiable desiderata (1, 2, 5, 6) as they reveal robust, predictable patterns of impropriety and normative expectations surrounding assertion that demand explanation. Might gesture towards pragmatic explanations for Warranted False (3) and Disavowals (4), but struggles to capture the distinctly *epistemic* force of the phenomena.

  This framework provides the necessary criteria and distinctions to rigorously evaluate competing theories of the norm of assertion against the complexities of linguistic practice and epistemic function.
