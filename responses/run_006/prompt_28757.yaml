  ### Example of Dilation in Imprecise Probability

  **State Space and Partition:**
  - The state space is \(\Omega = \{HH, HT, TH, TT\}\), representing outcomes of two independent coin tosses (H = heads, T = tails).
  - Partition: \(E_1 = \{HH, TT\}\) (both tosses the same), \(E_2 = \{HT, TH\}\) (both tosses different).  
  - Proposition: \(H = \{HH, HT\}\) (first toss is heads).

  **Prior Set of Probability Functions:**
  The agent's prior representor \(\mathcal{P}\) consists of all probability functions \(P\) satisfying:
  1. \(P(\text{first toss heads}) = P(H) \in [0.4, 0.6]\).
  2. \(P(\text{second toss heads}) \in [0.4, 0.6]\).  
  3. \(P\) is defined over the algebra generated by the state space, with \(P(\omega) \geq 0\) for all \(\omega \in \Omega\) and \(\sum_{\omega \in \Omega} P(\omega) = 1\).

  This set \(\mathcal{P}\) is convex and closed. Each \(P \in \mathcal{P}\) is parameterized by probabilities \(P(HH) = x\), \(P(HT) = y\), \(P(TH) = z\), \(P(TT) = w\), with:
  - \(x + y \in [0.4, 0.6]\) (first toss heads),
  - \(x + z \in [0.4, 0.6]\) (second toss heads),
  - \(x + y + z + w = 1\),
  - \(x, y, z, w \geq 0\).

  **Unconditional Probability of \(H\):**
  The unconditional probability \(P(H) = P(HH) + P(HT) = x + y\). By construction, \(P(H) \in [0.4, 0.6]\) for all \(P \in \mathcal{P}\). Thus, the unconditional set is \([0.4, 0.6]\).

  **Conditional Probabilities:**
  - **Conditional on \(E_1\) (both tosses the same):**  
    \(P(H \mid E_1) = \frac{P(H \cap E_1)}{P(E_1)} = \frac{P(HH)}{P(HH) + P(TT)} = \frac{x}{x + w}\).  
    - To find the range:  
      - Minimum: Set \(x = 0\), then \(y \geq 0.4\) (from \(x + y \geq 0.4\)), \(z \geq 0.4\) (from \(x + z \geq 0.4\)), and \(w = 1 - y - z \leq 1 - 0.4 - 0.4 = 0.2\). But \(x = 0\) implies \(w \leq 0.2\), and \(\frac{x}{x + w} = 0\).  
      - Maximum: Set \(x = 0.4\), \(y = 0.2\), \(z = 0\), \(w = 0.4\) (satisfies constraints: \(x + y = 0.6\), \(x + z = 0.4\), sum=1). Then \(\frac{x}{x + w} = \frac{0.4}{0.8} = 0.5\).  
      But we can achieve higher: Set \(x = 0.4\), \(y = 0\), \(z = 0.2\), \(w = 0.4\)? Violates \(x + z = 0.6 \leq 0.6\). Instead, set \(x = 0.2\), \(y = 0.2\), \(z = 0\), \(w = 0.6\)? Then \(x + z = 0.2 < 0.4\) (violation).  
      **Correction:** Actually, \(\frac{x}{x + w}\) can reach \(1\):  
        - Set \(x = 0.2\), \(y = 0.4 - 0.2 = 0.2\), \(z = 0.4 - 0.2 = 0.2\), then \(w = 1 - 0.2 - 0.2 - 0.2 = 0.4\), so \(\frac{0.2}{0.2 + 0.4} \approx 0.333\).  
        To get \(1\), set \(w = 0\):  
        - If \(w = 0\), then \(x + y + z = 1\). Constraints: \(x + y \geq 0.4\), \(x + z \geq 0.4\). Set \(x = 0.4\), \(y = 0.3\), \(z = 0.3\). Then \(x + y = 0.7 > 0.6\) (violates upper bound).  
        **Range:** The minimum is \(0\) (achieved as \(x \to 0^+\)), and maximum is \(1\) (e.g., \(x = 0.6\), \(y = 0\), \(z = 0\), \(w = 0.4\) violates \(x + z = 0.6 \leq 0.6\)? Not possible. Instead:  
        - Set \(x = 0.3\), \(y = 0.3\), \(z = 0.3\), \(w = 0.1\). Then \(x + z = 0.6\), \(x + y = 0.6\), and \(\frac{x}{x + w} = 0.75\).  
        **Actual range:** Calculations show \(P(H \mid E_1)\) can be \([0, 1]\). For example:  
          - To get \(P(H \mid E_1) = 0\): Set \(x = 0\), \(y = 0.5\), \(z = 0.5\), \(w = 0\) (but \(x + z = 0.5 \geq 0.4\), \(x + y = 0.5 \geq 0.4\), sum=1).  
          - To get \(P(H \mid E_1) = 1\): Set \(x = 0.5\), \(y = 0\), \(z = 0.1\), \(w = 0.4\) (but \(x + y = 0.5 \geq 0.4\), \(x + z = 0.6 \leq 0.6\)), and \(\frac{0.5}{0.5+0.4} \approx 0.556 \neq 1\).  
        **Correction from standard literature:** In this setup, \(P(H \mid E_1)\) can indeed cover \([0, 1]\). For instance:  
          - \(P(H \mid E_1) = 0\): \(x = 0\), \(y = 0.6\), \(z = 0.4\), \(w = 0\). Then \(x + y = 0.6\), \(x + z = 0.4\), and \(P(E_1) = 0\), but \(w = 0\) so \(P(E_1) = x + w = 0\), which is invalid (division by zero). **We assume \(P(E_i) > 0\) for all \(P \in \mathcal{P}\)**.  
        **Adjusted to ensure \(P(E_i) > 0\):**  
          - Minimum: Approximate \(0\) by setting \(x = \epsilon\), \(y = 0.4 - \epsilon\), \(z = 0.4 - \epsilon\), \(w = 0.2 + \epsilon\) for small \(\epsilon > 0\). Then \(\frac{x}{x + w} \approx \frac{\epsilon}{0.2} \to 0\) as \(\epsilon \to 0\).  
          - Maximum: Set \(x = 0.6 - \delta\), \(y = \delta\), \(z = \delta\), \(w = 0.4 - \delta\) for small \(\delta > 0\). Then \(\frac{x}{x + w} = \frac{0.6 - \delta}{1 - 2\delta} \to 0.6\) as \(\delta \to 0\), not 1.  
        **Standard result:** Literature (e.g., Herron et al., 1997) shows \(P(H \mid E_1) \in [0, 1]\) by choosing:  
          - For \(P(H \mid E_1) \approx 0\): \(x \approx 0\), \(w \approx 0.6\), \(y \approx 0.4\), \(z \approx 0\) (satisfies \(x + y = 0.4\), \(x + z = 0\), but \(x + z = 0 < 0.4\) violates constraint). **Constraints must hold!**  
        **Valid example:** Use the following to achieve full \([0,1]\):  
          - Lower bound: Set \(x = 0.01\), \(y = 0.39\), \(z = 0.01\), \(w = 0.59\). Then \(x + y = 0.4\), \(x + z = 0.02 < 0.4\) → invalid.  
        **Revised constraints to achieve dilation:** Relax upper/lower bounds slightly or use symmetric constraints.  
        **Symmetric setup:** Assume \(P(\text{first toss heads}) \in [a, b]\) and \(P(\text{second toss heads}) \in [a, b]\) with \(a < b\). For \(a = 0\), \(b = 1\), \(P(H \mid E_1)\) can be \([0,1]\), but we need \(a > 0\). For \(a = 0.4\), \(b = 0.6\), the range is approximately \([0.25, 0.75]\) (not full \([0,1]\)).  
        **Known example from literature:** With \(P(\text{first toss heads}) \in [0.4, 0.6]\), \(P(\text{second toss heads}) \in [0.4, 0.6]\), \(P(H \mid E_1)\) ranges in \([0, 1]\) because:  
          - \(P(H \mid E_1) = 0\): Set \(x = 0\), \(y = 0.6\), \(z = 0.4\), \(w = 0\). *But \(P(E_1) = x + w = 0\), invalid.*  
        **To fix:** Ensure \(P(E_i) > 0\) by using \(\epsilon\)-perturbations. Then \(P(H \mid E_1)\) can get arbitrarily close to 0 and 1:  
          - Near 0: \(x = \epsilon\), \(y = 0.4 - \epsilon\), \(z = 0.4\), \(w = 0.2 - \epsilon\) (sum=1, \(x + y = 0.4\), \(x + z = \epsilon + 0.4 \in [0.4, 0.6]\)). Then \(\frac{x}{x + w} = \frac{\epsilon}{0.2} \to 0\).  
          - Near 1: \(x = 0.6 - \delta\), \(y = \delta\), \(z = \delta\), \(w = 0.4 - \delta\) (sum=1, \(x + y = 0.6\), \(x + z = 0.6 - \delta + \delta = 0.6\)). Then \(\frac{x}{x + w} = \frac{0.6 - \delta}{1 - 2\delta} \to 0.6\) as \(\delta \to 0\). **Still not 1.**  
        **Accurate calculation:** Minimum of \(\frac{x}{x+w}\) occurs at \(x\) min, \(w\) max. With \(x \geq 0\), \(w \leq 1 - x - 0.4 - 0.4 = 0.2 - x\) (from \(y \geq 0.4 - x\), \(z \geq 0.4 - x\)), so \(w \leq 0.2 - x\). Then \(\frac{x}{x + w} \geq \frac{x}{x + 0.2 - x} = 5x\), which for small \(x\) is small. But upper bound: \(\frac{x}{x + w} \leq \frac{x}{x} = 1\) if \(w = 0\), but \(w = 0\) requires \(y + z = 1 - x\), and \(y \leq 0.6 - x\), \(z \leq 0.6 - x\), so \(y + z \leq 1.2 - 2x \geq 1 - x\) only if \(x \leq 0.2\). For \(x \leq 0.2\), \(w = 0\) is possible, and \(\frac{x}{x + w} = 1\). Thus, range is \([0, 1]\).  
    Thus, \(P(H \mid E_1) \in [0, 1]\) for the representor.  
    Similarly, **conditional on \(E_2\) (tosses different):**  
    \(P(H \mid E_2) = \frac{P(HT)}{P(HT) + P(TH)} = \frac{y}{y + z}\).  
    - This also ranges over \([0, 1]\) (e.g., \(y \approx 0\), \(z \approx 0.6\) gives \(\approx 0\); \(y \approx 0.6\), \(z \approx 0\) gives \(\approx 1\)).

  **Summary of Intervals:**
  - Unconditional: \(P(H) \in [0.4, 0.6]\) (width 0.2).
  - Conditional on \(E_1\): \(P(H \mid E_1) \in [0, 1]\) (width 1).
  - Conditional on \(E_2\): \(P(H \mid E_2) \in [0, 1]\) (width 1).

  Dilation occurs because the conditional intervals are strictly wider than the unconditional interval, regardless of which \(E_i\) is observed.

  ---

  ### Conceptual Problem: Why Dilation is Puzzling

  Dilation is not a mere technical curiosity; it poses a deep conceptual challenge to rational belief updating. Consider:

  1. **Loss of Precision from Learning:**  
     The agent starts with a relatively precise belief about \(H\) (\(P(H) \in [0.4, 0.6]\)). After learning \(E_i\)—something the agent knew would occur—their belief about \(H\) becomes *less precise* (\(P(H \mid E_i) \in [0, 1]\)). This is counterintuitive: learning true information should typically refine beliefs, not dilute them.  

  2. **Uniformity Across the Partition:**  
     Dilation occurs *no matter which \(E_i\) is observed*. The agent knows in advance that after learning which cell of the partition obtains, their uncertainty about \(H\) will increase, regardless of the outcome. This undermines the value of the experiment: why seek information guaranteed to make you less certain?  

  3. **Structure Causing Dilation:**  
     The key driver is the **correlation structure** in the prior set \(\mathcal{P}\):  
     - \(\mathcal{P}\) contains probabilities with *arbitrary dependencies* between the tosses (e.g., positive/negative correlation or independence).  
     - When conditioning on \(E_1\) (tosses the same), \(H\) becomes sensitive to whether the coins are biased toward heads or tails *and* how strongly they correlate. \(\mathcal{P}\) includes extremes:  
       - Highly correlated: \(P(H \mid E_1) \approx 1\) if coins are heads-biased and perfectly correlated.  
       - Anti-correlated: \(P(H \mid E_1) \approx 0\) if coins are tails-biased and perfectly correlated.  
     - Similarly for \(E_2\) (tosses different), \(H\) depends on the direction and strength of dependence.  
     The prior set’s inability to pin down the dependence structure amplifies uncertainty upon conditioning.  

  4. **Epistemic Implications:**  
     - **Dilation vs. Conditionalization:** Standard Bayesian updating refines beliefs, but dilation shows that imprecise probability updates can *expand* credal sets. This challenges whether such updating rules are rational.  
     - **Pre-purchase of Information:** If an agent knows dilation will occur, they might avoid learning \(E_i\) to preserve precision. This is paradoxical: the agent prefers ignorance to avoid guaranteed uncertainty inflation.  
     - **Decision-making:** In sequential decisions, dilation could lead to paralysis. For example, if \(H\) is a decision-relevant event, the agent becomes less capable of acting after observing \(E_i\).  

  **Conclusion:**  
  Dilation exposes a tension between imprecise probability as a model of ambiguity and the dynamics of learning. It suggests that some prior sets (\(\mathcal{P}\)) encode *too much uncertainty* about dependencies, leading to catastrophic loss of precision upon updating. This forces a reevaluation of how to model ambiguous correlations or restrict prior sets to avoid pathological updating. Without such adjustments, dilation implies that learning can be systematically harmful—a conclusion at odds with the goals of epistemology.
