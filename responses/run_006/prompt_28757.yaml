          After conditioning on either E1 or E2, the conditional probability of H can be any number in [0,1]. This is dilation.

          Therefore, we use this example.

          State space: Ω = {HH, HT, TH, TT}
          Partition: E1 = {HH, TT} (both tosses the same), E2 = {HT, TH} (both tosses different)
          H = {HH, HT} (first toss is heads)

          Prior set: all probabilities such that the marginal probability of heads on the first toss is in [0.4,0.6] and on the second toss is in [0.4,0.6].

          Unconditional P(H) in [0.4,0.6] (an interval of length 0.2).

          Conditional on E1: P(H|E1) can be any number in [0,1] (interval of length 1).
          Conditional on E2: P(H|E2) can be any number in [0,1] (interval of length 1).

          This is a clear dilation.

          Why is this a conceptual problem?

          The agent knows that she will learn either E1 or E2. But after learning, she becomes less precise about H, no matter what she learns. 

          This seems counterintuitive because one might expect that learning new information should not make the agent less sure about H. 

          In particular, the agent is aware in advance that her beliefs about H will become more ambiguous after she learns whether the two tosses are the same or different. This is disturbing because it means that the agent is sure in advance that her knowledge about H will be diluted (become less precise) after she receives information, regardless of what that information is.

          The structure that generates this behavior is the dependence between the tosses. The set of priors includes probabilities that exhibit positive and negative dependence between the two tosses. When the agent learns that the two tosses are the same (E1), then the event H (first toss heads) becomes positively associated with the second toss being heads (if it's the same, then either both heads or both tails). However, the set of priors includes both possibilities: the two tosses could be very positively dependent or very negatively dependent. So after learning E1, the agent could believe that the first toss is almost surely heads (if the two tosses are positively dependent and the probability of heads is high) or almost surely tails (if the probability of heads is low and they are positively dependent) or anything in between? 

          But wait, in our calculation, the range became [0,1]. The agent becomes completely ignorant about H after learning E1 or E2.

          This illustrates a fundamental challenge in imprecise probability: the updating of sets of probabilities can sometimes lead to a loss of precision that is uniform across the partition. It raises the question of whether the agent is irrational to hold such a set of priors, or whether there is a better way to update. Some have argued that this demands a more conservative updating rule. The phenomenon also highlights the sensitivity of conditional probability sets to the structure of the prior set and the partition.

          In summary, dilation is a conceptual problem because it shows that learning can systematically and uniformly increase uncertainty, which is the opposite of what we expect from learning.
