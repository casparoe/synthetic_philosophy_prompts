prompt: |-
  Write a short story from inside the Sleeping Beauty experiment. I want it from Beauty's perspective — she wakes up, doesn't know if it's Monday or Tuesday, doesn't know if the coin was heads or tails. The story should capture the actual phenomenology of self-locating uncertainty, that weird vertigo of not knowing your own position in time even though you know all the objective facts of the setup. Don't just have her rehash the thirder/halfer debate; make it feel lived-in and strange. Maybe she fixates on small details in the room, trying to find some clue about what day it is. A typo or two is fine.
reasoning: |-
