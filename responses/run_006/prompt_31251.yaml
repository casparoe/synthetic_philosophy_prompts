prompt: |-
  I'm a novelist, and for a chapter set at a philosophy conference I need the actual document two characters have been co-writing all summer. One of them is a committed defender of Pascal's wager: he thinks the expected utility of wagering for God is infinite, so wagering is rationally mandatory even if you can't make yourself believe. The other thinks the wager falls apart as soon as you take the decision matrix seriously—there are indefinitely many mutually exclusive possible gods promising infinite rewards, so the expected utility of any act is either infinite or not well-defined and the wager can be made to recommend anything. Write the statement of their adversarial collaboration. I want a numbered section of claims both can sign (about decision theory, about infinite utilities, about what the wager would actually have to establish, about whether belief is the sort of thing you can wager for), then a disagreements table where each position is worded the way its own side would insist on, then the cruxes—the subquestions that would actually move at least one of them—and for each crux a concrete argument or case both would accept as bearing on it, with each side's prediction recorded in advance. Flag any part of the fight you think is just verbal.
