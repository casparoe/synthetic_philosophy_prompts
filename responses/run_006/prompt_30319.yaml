prompt: |-
  I write fiction for a living, and I have lately been trying to sort out what I actually think makes something a work of art. I've been going by my gut on particular cases, and I'd like to know whether there is a principle that captures my verdicts — or nearly all of them — and what that principle says about a case I keep going back and forth on.

  My verdicts are these.

  1. The novel I spent three years writing and revising is a work of art. I don't think it became art only when it was published, or only when a reader first opened it. It was already art when the manuscript sat in a drawer.
  2. A friend once sent me a two-line text message, meant only as a quick update, and it happened to scan like a perfect haiku. I found it genuinely beautiful, but I don't think she wrote a poem. It isn't a work of art.
  3. A sunset is not a work of art, however much it moves me.
  4. A piece of driftwood lying where the tide left it is not a work of art.
  5. That same piece of driftwood, carried into a gallery, set on a plinth, and given a title, is a work of art. I want to say the curator's selection and presentation changed what it is, not merely where it sits.
  6. A technically superb painting made in the style of a seventeenth-century master and sold as a newly discovered work by that master is a work of art. It is a dishonest one, and I condemn the deception, but I can't bring myself to say it isn't art.
  7. A child's crayon drawing of a house, taped to the refrigerator, is a work of art — minor art, perhaps, but art.
  8. A wedding toast that moved the whole room to tears, delivered off the cuff and never intended as anything but a toast, is not a work of art, though it may have had more aesthetic power than most published verse.

  The case I can't settle is this. A large language model, trained partly on my own published novels, produces a complete novel in my voice. I supply only a prompt; the machine chooses the words. I then edit the result lightly, give it a title, and publish it under my name. On some days I think this is obviously a work of art — I selected it, shaped it, and presented it as one, much as the curator did with the driftwood. On other days I think it is obviously not a work of art, because no one sat down to write it; the machine intended nothing, and my editing feels more like curation than authorship.

  Is there a principle that gets all eight of my verdicts? What does it say about the ninth case? And which of my verdicts, if any, does it force me to give up? If no single principle will do, I'd like the smallest set of principles that does the job, with an honest account of what each one commits me to.
reasoning: |-
  Okay, the user is a fiction writer trying to define what makes something art based on their intuitive judgments about eight different scenarios. They're stuck on whether an AI-generated novel lightly edited by them counts as art. Let me unpack their verdicts first.

  Looking at their examples: Their own unpublished manuscript is art (1), but a beautiful accidental haiku-text isn't (2). Natural objects like sunsets (3) or raw driftwood (4) aren't art, but displayed driftwood in a gallery is (5). A deceptive master forgery is still art (6), a child's drawing is art (7), but an extemporaneous wedding toast isn't (8). The AI novel case (9) has them torn between curation and authorship.

  Hmm... their pattern suggests two key elements: deliberate framing (presenting something as art) and intentional craft (human creative effort). The manuscript (1) and child's drawing (7) have craft without framing, while the driftwood (5) and forgery (6) have framing without original craft. The haiku (2) and toast (8) lack both framing and craft intention. The sunset (3) and raw driftwood (4) are pure nature.

  For the AI case... it's messy. The prompt + editing + publishing seems like framing, but the core creation lacks human creative intent. Their discomfort mirrors the forgery example - they accept the forgery as art (through craftsmanship) but hate the deception. Here the "deception" is about authorship rather than creation.

  The user might be wrestling with authenticity. All their accepted art examples involve authentic human expression - even the forged painting required skillful human imitation. The AI work lacks that human genesis, making it feel like curation rather than creation. 

  Perhaps the unifying principle is "human creative intention manifested through craft and/or presentation." This would exclude the AI novel unless they consider prompt engineering + editing as sufficient creative acts. But their gut says editing feels like curation... so this principle might make them reject the AI work as art.

  Alternatively, if they broaden "craft" to include post-hoc framing (like the driftwood), they could accept the AI work - but that might force them to accept the wedding toast if it were recorded and presented as art later. They explicitly rejected the toast as art though...

  The tension is between origin and presentation. Their verdicts show both matter, but origin seems primary - notice they only accept the driftwood as art when human presentation overrides its natural origin. The AI work's origin is non-human, so even with framing, it might not clear the bar.

  This suggests they need two necessary conditions: 1) human creative intention (at some stage), and 2) presentation as art. The AI case fails condition 1 because the machine lacks intention, and their editing doesn't feel intentional enough to them for authorship. That would align with their hesitation.
answer: |-
  Based on your verdicts, a single coherent principle emerges that captures all eight cases: **A work of art is a human artifact intentionally framed (by its creator or a later agent) as an object of aesthetic experience.**

  This principle explains your judgments as follows:

  1.  **Your novel manuscript:** A human artifact (written/revised by you) intentionally framed as art (by you, the creator).
  2.  **Accidental haiku text:** A human artifact (the text message) but *not* intentionally framed as art by its creator (sent as a quick update). The beauty is incidental.
  3.  **Sunset:** Not a human artifact. Natural phenomenon.
  4.  **Raw driftwood:** Not a human artifact. Natural object in a natural setting.
  5.  **Driftwood in a gallery:** Human artifact? Debatable, but *intentionally framed* (by the curator) as an object of aesthetic experience. The act of selection, placement, and titling *transforms its status*.
  6.  **Master forgery:** A human artifact (created by the forger) intentionally framed as art (by the forger, presenting it as a 17th-century masterpiece). The *deception* is immoral, but the object itself meets the criteria.
  7.  **Child's drawing:** A human artifact (created by the child) intentionally framed as art (by the child creating it *as a drawing*, and likely by the parent displaying it on the fridge).
  8.  **Wedding toast:** A human artifact (the spoken words) but *not* intentionally framed as art by its creator (intended as a personal toast, not an aesthetic object). Its power is rhetorical/emotional, not formally presented as art.

  **Applying the Principle to the AI Case:**
  *   **Artifact:** Yes. The generated text is a tangible output.
  *   **Human Involvement:** Yes. You prompted, selected, lightly edited, titled, and published it. This constitutes significant framing.
  *   **Intentionally Framed as Art:** Yes. You published it under your name as a novel, definitively presenting it as an aesthetic object.

  **Therefore, according to this principle, the AI-generated novel *is* a work of art.** Your actions (prompting, selecting, editing, titling, publishing) constitute the necessary "intentional framing" that transforms the machine's output into an artwork, mirroring the curator's role with the driftwood.

  **What This Principle Forces You to Give Up (Potentially):**
  This principle forces you to reconsider the *degree* of human creative effort required at the *generative* stage. Your hesitation stems from the lack of "someone sitting down to write it" (generative intent). The principle prioritizes the *framing intent* over the *origin of the raw material*.

  *   **Concession:** You must accept that the *primary creative act* can be one of **selection, presentation, and contextualization** (like the curator), not necessarily the initial *generation* of every element (like the painter or novelist writing word-by-word). The forgery (6) already leaned this way (skillful generation under false framing), but the AI case makes it explicit.
  *   **What it Doesn't Force You to Give Up:** You can still condemn the AI work as **inauthentic** (like the forgery), **ethically problematic** (plagiarism/attribution issues), or **aesthetically inferior** compared to human-generated art. You can argue it's "minor art" or "derivative art," similar to the child's drawing. The principle only addresses whether it *qualifies* as art, not its quality, originality, or ethical status.

  **Why This Fits Your Gut (Mostly) and Resolves the AI Case:**
  *   Your verdicts consistently require human agency, either in creation *or* transformative presentation (Manuscript, Driftwood-in-gallery, Forgery, Child's drawing).
  *   They consistently reject things lacking human framing, even if beautiful (Accidental Haiku, Sunset, Raw Driftwood, Toast).
  *   The AI case involves the same transformative framing (your editing, titling, publishing) that turned driftwood into art. The machine's lack of intent is overridden by *your* framing intent.
  *   Your discomfort stems from valuing *generative authorship* highly. The principle accommodates this by allowing you to critique the AI art *severely* on grounds of authenticity and generative process, while still classifying it *as* art due to the framing act.

  **In Conclusion:**

  The principle **"A work of art is a human artifact intentionally framed as an object of aesthetic experience"** captures all eight of your verdicts. Applying it to the AI case, the novel **is art** because you, the human agent, performed the essential act of selection, shaping (editing), titling, and publishing, thereby *framing* the machine-generated artifact as art. This requires accepting that curation/presentation *can* be the primary artistic act, but it doesn't prevent you from criticizing the AI work on other grounds like authenticity or depth of creative process. Your hesitation reflects a valid concern about *authorship* and *original generative intent*, which remain crucial for evaluating the work's merit and ethical standing, even if not for its basic classification as art.
