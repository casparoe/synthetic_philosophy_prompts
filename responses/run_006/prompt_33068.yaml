prompt: |-
  I'm organizing a workshop titled "Who's Conscious? Theories of Animal Sentience Under Pressure," and before we spend a day evaluating individual theories, I want a shared benchmark: the full list of requirements an adequate theory of the distribution of phenomenal consciousness across animal taxa must satisfy. Please write those desiderata.

  For each requirement, give:
  - The case, argument, or biological fact that motivates it;
  - Whether it is non-negotiable (any theory that fails it is dead) or a camp preference (a commitment some theorists could reasonably reject without absurdity);
  - Which family of theories it most threatens, stated structurally — e.g., "neocortical theories," "global workspace theories," "higher-order thought theories," "integrated information theory," "behavioral functionalism," "unified agency views," "any-nervous-system views," "panpsychism."

  The purpose is practical: a theory good enough to guide animal welfare legislation and research prioritization. So weight the requirements accordingly. A demand that resolves a metaphysical subtlety matters less than one that handles the line-drawing problem in a policy-actionable way, unless you can show that the subtlety has practical downstream consequences.

  Specific issues I want the desiderata to address:
  - The evolutionary continuity problem: given common descent, any sharp line between conscious and non-conscious taxa carries a burden of justification — what must a theory do to discharge it?
  - Convergent evolution cases: cephalopods (radically different nervous system organization from vertebrates) and arthropods (social hymenoptera, decapod crustaceans) — what does a theory have to say about independently evolved nervous systems?
  - The relationship between behavioral markers (trade-off behavior, learning, injury-directed behavior, anxiolytic responses) and neural markers, and what the theory requires when they conflict.
  - Whether a theory must assign consciousness to all vertebrates, some vertebrates, or no whole clade by default, and why.
  - The distinction between sentience (valenced experience) and consciousness in a broader sense, and whether a theory of the distribution of consciousness owes an account of both, or can set the broader sense aside.

  Flag any subset of these desiderata that you suspect cannot be jointly satisfied — that is the part I most want to see. Which requirement, if any, forces a choice between two otherwise attractive packages of commitments?

  A table of requirements is ideal, with the scorecard column kept brief (e.g., "eliminates neocortical theories"). The conceptual weight should fall on the requirements themselves and the cases that motivate them, not on the scoring. Please end with a one-sentence summary of the state of the field as your final line.
reasoning: |-
  Okay, the user is organizing a workshop on animal sentience theories and wants a clear set of requirements for evaluating these theories. I need to create a comprehensive list of desiderata that serve as a benchmark. Let me start by understanding their key concerns.

  First, the evolutionary continuity problem. Any theory must explain how consciousness could have evolved gradually, yet account for possible sharp divides. This is crucial because common descent suggests gradual changes, but some theories might draw hard lines. For instance, neocortical theories might struggle here since only mammals have a neocortex, leaving out birds or reptiles which show complex behaviors.

  Next, convergent evolution cases like cephalopods and arthropods. These animals have different nervous systems but exhibit behaviors suggesting sentience. A theory must address whether similar functions can arise from different structures. Theories tied to specific brain structures, like the neocortex, would fail here, while functional theories might handle it better.

  Behavioral vs. neural markers. There might be conflicts, like when an animal shows pain behavior without known neural correlates. A theory needs to resolve such conflicts. Higher-order thought theories might dismiss behavior without cognitive processing, which could be problematic for policy-making that relies on observable indicators.

  The vertebrate question is important for legislation. Should all vertebrates be considered sentient by default? Higher-order theories might exclude some, while unified agency views might include more. This has practical implications for welfare laws.

  Sentience vs. broader consciousness. Since welfare concerns valenced experiences, theories should focus on sentience. Panpsychism might conflate the two, making it less useful for policy.

  I should also consider which desiderata conflict. For example, evolutionary continuity and sharp-line justification might clash. A theory might need to explain both gradual evolution and justify any abrupt boundaries. This could challenge theories like IIT or HOT, which have inherent thresholds.

  The user needs a practical framework for legislation, so desiderata should prioritize actionable outcomes. For instance, requiring explicit criteria for when conflicting evidence overrides markers is more important than metaphysical nuances.

  I'll structure each desideratum with its motivation, negotiability, and which theories it threatens. Non-negotiables are essential for any viable theory, while camp preferences might be debatable but still important. 

  Finally, summarizing the field: current theories struggle to balance evolutionary continuity with policy-relevant distinctions, especially in invertebrates. The unresolved tension between accommodating continuity and justifying necessary thresholds is key.
answer: |-
  Here is a comprehensive table of desiderata for an adequate theory of animal sentience, tailored to your workshop goals and practical policy needs. Requirements are ranked roughly by their weight for policy-actionable distinctions.

  | Requirement | Motivation (Case/Argument/Fact) | Non-Negotiable (N) or Camp Preference (P) | Threatens (Theory Families) |
  |-------------|---------------------------------|------------------------------------------|------------------------------|
  | **1. Evolutionary Plausibility:** Must account for the gradual emergence of traits via descent with modification. | Evolutionary continuity: Abrupt appearance of consciousness without precursor functions violates biological principles (e.g., sudden sentience only in placental mammals). | **N** | Neocortical theories, HOT theories (if requiring late-evolving structures/functions), any theory positing consciousness *only* in a highly derived clade without precursors. |
  | **2. Valenced Sentience Focus:** Must primarily explain the distribution of *valenced experience* (pleasure/suffering), not just awareness or access consciousness. | Animal welfare legislation hinges on capacity for suffering/well-being. Broader consciousness is less policy-critical. | **N** | Theories conflating access consciousness/attention with sentience (some GWT interpretations), panpsychism (assigns valence universally). |
  | **3. Convergent Evolution Compatibility:** Must explain how sentience could arise in phylogenetically distant, independently evolved complex nervous systems (cephalopods, arthropods). | Observed sophisticated, flexible behaviors in octopuses, crabs, bees suggestive of sentience, despite radically different neuro-architecture. | **N** | Neocortical theories, vertebrate-centric theories, theories requiring specific brain structures (e.g., claustrum). |
  | **4. Behavioral Marker Grounding:** Must provide principles for interpreting behavioral markers (trade-offs, learning flexibility, self-protection, anxiolytic response) as evidence *for* or *against* sentience. | Practical assessment relies on observable behavior. Ignoring strong behavioral evidence (e.g., crabs trade-off pain vs. reward) is scientifically and ethically dubious. | **N** | HOT theories (may dismiss behavior without metacognition), strict neuro-reductionism. |
  | **5. Conflict Resolution Protocol:** Must specify how to adjudicate conflicts between behavioral markers and neural/functional markers. | Common scenario (e.g., complex pain behavior in an animal lacking known vertebrate pain pathways). Policy needs clear decision rules. | **N** | All theories – but most threatened are those with rigid neural prerequisites. |
  | **6. Justified Line-Drawing:** If positing a sharp boundary in the phylogenetic tree, must provide a compelling functional/structural innovation justifying why sentience emerges *there* and not incrementally. | Burden of proof for discontinuities given common descent. Vagueness undermines policy. | **N** | "Any-nervous-system" views (avoid lines), panpsychism (no lines), vague functionalism. |
  | **7. Vertebrate Default (Cautious Inclusivity):** Should justify departure from the precautionary default that all vertebrates possess valenced sentience. | Strong behavioral/neurobiological homology across vertebrates; welfare policy often assumes this baseline. Rejecting it requires high burden of proof. | **P** (Strong Policy Preference) | HOT theories (may exclude fish/amphibians), sparse neuro-functional theories requiring specific pallial structures absent in some vertebrates. |
  | **8. Neural/Functional Specificity:** Must identify specific neural or functional properties necessary/sufficient for sentience, beyond mere presence of nerves. | Avoids panpsychism/over-inclusiveness. Nervous systems vary wildly; not all support sentience (e.g., cnidarian nets). Policy needs discriminating criteria. | **N** | "Any-nervous-system" views, extreme behavioral functionalism, panpsychism. |
  | **9. Mechanism over Metaphysics:** Must prioritize empirically tractable mechanisms generating sentience, minimizing reliance on unresolved metaphysical assumptions. | Policy requires testable predictions and falsifiable criteria, not solely philosophical coherence. | **P** | Panpsychism (fundamental consciousness), some interpretations of IIT (hard problem focus), dualism. |
  | **10. Phenomenal Specificity (Camp):** Should ideally explain *why* specific neural/functional properties generate *phenomenal feel* (the Hard Problem). | Addresses core philosophical puzzle. Lack of explanation feels theoretically unsatisfying. | **P** | Behavioral functionalism, some GWT/IIT interpretations (focus on access/information), eliminativism. |

  **Key Inherent Tensions & Potential Incompatibilities:**

  1.  **Evolutionary Plausibility (1) vs. Justified Line-Drawing (6):** This is the core tension. Accommodating continuity (1) pushes towards gradualism or wide distribution. Policy demands actionable lines (6). A theory *must* resolve this tension. **This forces a choice:** Does the theory lean hard into gradualism/wide-distribution (risking over-inclusiveness for policy) or does it find a *robust, empirically defensible* discontinuity point (risking biological implausibility)?
  2.  **Behavioral Marker Grounding (4) vs. Neural Specificity (8):** Relying heavily on behavior risks anthropomorphism/over-ascription. Relying solely on specific neural structures risks missing convergent solutions (3) and dismissing compelling behavioral evidence. **Conflict Resolution Protocol (5) is the essential bridge, but inherently difficult.**
  3.  **Convergent Evolution Compatibility (3) vs. Neural Specificity (8):** Finding a truly specific neural property common to mammals, birds, octopuses, and bees is incredibly challenging. This strongly favors **functional** theories (e.g., GWT, IIT, Unified Agency) over strictly neuroanatomical ones.

  **Summary of the State of the Field:** Current theories struggle to jointly satisfy evolutionary continuity, policy-actionable line-drawing, and convergent evolution compatibility while grounding valenced sentience in empirically tractable mechanisms, leaving the distribution question – particularly concerning invertebrates – deeply unresolved and contentious.
