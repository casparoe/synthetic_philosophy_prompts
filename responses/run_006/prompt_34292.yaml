  So we need the loop case to discriminate.

  Therefore, the next case we put to her is the loop case.

  Description of the loop case:

  A bystander can divert a runaway trolley onto a side track that loops back to the main track. On the side track there is one person. If the trolley hits that person, it will stop and not continue to the main track. If the person were not there, the trolley would loop back and hit the five on the main track. The bystander diverts the trolley, foreseeing that it will hit and kill the one, thereby stopping and saving the five. The death of the one is not intended (the aim is to save the five by diverting the trolley to the loop where it will be stopped by the one) and the one is not intended to die (but the death is foreseen). However, the one's body is used to stop the trolley.

