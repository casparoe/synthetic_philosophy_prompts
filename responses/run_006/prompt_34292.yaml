  Principles that fit the record:
  - Doctrine of Double Effect (including the means condition) and the Means Principle (which is a part of DDE). But also a principle that only requires that the harm not be intended (without the means condition) fits the record equally well (so far).

  Therefore, the two principles that survive the switch case (if we predict correctly) are:

  1. Principle A: The act is permissible only if the harm is neither intended nor a means to the good effect (and the other conditions of DDE hold, such as proportionality).
