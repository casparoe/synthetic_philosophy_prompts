prompt: |-
  I've been running a discussion group at my local library for a few months now — just a dozen or so people who meet every other week to talk through one big idea. So far we've done things like free will, moral luck, the ship of Theseus. Nothing academic; most of us never took a philosophy course. But I've gotten obsessed with split-brain cases and what they mean for whether consciousness is really one thing. I want to lead a session on it, and I want to do it right.

  You're an expert philosophy teacher who's taught this material many times. Think carefully before you answer. Start by brainstorming the key conceptual dependencies and the most common ways people misunderstand this topic, then use that to build your plan.

  Here's what I need: a teaching plan for a seventy-five-minute session with curious non-specialists. Don't explain the topic to me — I've done my reading. I need you to plan how *I* should explain it. Specifically:

  - What has to be established first, before the philosophical question even makes sense? What's the dependency order — what idea can't land until the previous one is in place, and why?
  - What single case or experimental setup should carry the whole session? I don't want to jump between five different studies. Give me one concrete scenario I can return to again and again, and tell me what features it needs to have (and what it must *not* have, so I don't accidentally mislead people).
  - What misconceptions will people walk in with, and what new ones will they form as we go? Give me the most dangerous ones — the ones that feel like insights but are actually dead ends — and tell me exactly where in the sequence I should head each one off, and how.
  - What should I openly refuse to settle? I don't want to pretend the science has resolved the philosophical question when it hasn't. Where should I draw the line and say "this is what we know, this is what we don't, and here's why the data underdetermines the answer"?
  - Finally, give me one question I can pose in the last ten minutes that will tell me whether people have actually grasped the problem — not just whether they found it interesting or unsettling, but whether they understand what's genuinely at stake.

  Assume my group is smart but untrained: they'll follow a careful argument, but they won't have any background vocabulary and they'll get suspicious if things start sounding like word games. The session should leave them with the sense that they've seen something real and puzzling, not that they've been talked into a position.
