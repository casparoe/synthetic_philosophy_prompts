prompt: |-
  You are a philosopher who works on formal epistemology and the problem of logical omniscience, and who can translate technical distinctions into procedures usable by non-philosophers. I am a PhD student in philosophy, and I have been asked to help a regulatory consultancy that reviews safety incidents after the fact. For each incident, the consultancy must decide whether a staff member "should have known" some consequence given the documents, reports, and internal messages they demonstrably had access to. The current protocol veers between two indefensible positions: it sometimes attributes every logical consequence of everything the person ever saw, as if staff were logically omniscient, and sometimes attributes nothing beyond what was explicitly printed, as if no inference is ever compulsory.

  Please write a decision procedure, grounded in the critique of logical omniscience, that a non-philosopher auditor can run in under an hour per case and whose output a review board can act on, with the board signing off on any attribution. Before the final procedure, briefly work through the candidate criteria you considered and which you kept or rejected, so the simplifications are justified. The procedure itself should give: the questions to ask in order; what counts as a sufficient answer at each step; where the procedure stops with "not attributable"; and where it hands off to a human because the step is a judgment call rather than a fact. Be explicit about which distinctions from the logical omniscience literature must survive the simplification (for example, closure under entailment versus closure under a bounded set of cheap, familiar rules) and which can be dropped for this audience. Then run the procedure on three cases: (1) an easy attribution, where the conclusion is one step away from two on-task documents; (2) a hard non-attribution, where the conclusion genuinely follows but requires many steps or specialist rules; and (3) a case where the procedure returns an answer the asker will not like — make this a case in which the procedure attributes knowledge even though the employee sincerely and credibly denies having drawn the inference, the sort of outcome I, as someone who takes first-person reports seriously, will find uncomfortable. Finish by stating plainly what the procedure cannot do and where it is most likely to misfire.
reasoning: |-
  We are designing a decision procedure for attributing knowledge of a consequence (C) to an employee based on documents they had access to. The goal is to avoid both logical omniscience (attributing every consequence) and logical nihilism (attributing only what is explicitly stated). The procedure should be usable by non-philosophers in under an hour per case.

  Key insights from the logical omniscience literature:
  - We reject the idea that agents know all logical consequences of their beliefs (logical omniscience).
  - We accept that agents are capable of some inferences, especially those that are immediate, familiar, and contextually relevant.
  - We can model an agent's knowledge as closed under a set of inference rules that are "cheap" (require little cognitive effort) and commonly used in the domain.

  Simplifications for this audience:
  - We drop the distinction between different modal logics and focus on a bounded set of inference rules that are contextually appropriate.
  - We do not require a full model of the agent's belief state; instead, we focus on the documents they had access to and the inferences that can be drawn from them using the bounded set of rules.
  - We consider the context (e.g., job role, training, time pressure) to determine which rules are "cheap" and expected.

  Candidate criteria we considered and kept or rejected:

  1. **Explicit statement**: If the consequence C is explicitly stated in any document the employee had access to, then they should have known it. [KEPT - obvious]
  2. **Simple logical rules**: We consider a set of simple, domain-relevant logical rules (e.g., modus ponens, conjunction elimination, disjunctive syllogism, transitivity of inequalities, basic arithmetic) that are considered "cheap" in the context. [KEPT - core of the approach]
  3. **Complex logical rules**: Rules that require multiple steps (e.g., more than 3 steps without intermediate conclusions) or specialized knowledge (e.g., statistical reasoning, advanced mathematics) are not considered cheap. [REJECTED as automatic attribution; instead, we mark as requiring human judgment]
  4. **Contextual salience**: Even if an inference is cheap, if the context (e.g., time pressure, distraction) would have prevented the employee from making it, then we do not attribute. However, we do not rely on the employee's self-report but on objective factors (e.g., was the employee in an emergency? was the document buried in a thousand-page report?). [KEPT as a factor, but we need to operationalize]
  5. **Domain expertise**: If the employee has specific training or job role that makes certain inferences cheap (e.g., an accountant and basic arithmetic), then we expect more. [KEPT - we will require the auditor to note the employee's role and standard expectations for that role]
  6. **Multiple sources**: If the premises for the inference are spread across multiple documents, we require that the employee had access to all and that the connection is obvious (e.g., same topic, same incident, same date). [KEPT - we will require that the premises are "readily connectable" without requiring a complex search]

  Rejected criteria:
  - **Probabilistic reasoning**: We do not require employees to make complex probabilistic inferences (e.g., Bayesian updating) unless it is explicitly part of their job and the procedure is standardized. [REJECTED for automatic attribution, will hand off to human]
  - **Long chains of reasoning**: We set a bound of 3 steps (each step being one application of a cheap rule) for automatic attribution. Beyond that, we hand off to human judgment.

  The procedure:

  **Step 0: Preparation**
  - Gather all documents, reports, and internal messages that the employee had access to at the relevant time.
  - Identify the consequence (C) that is in question.
  - Note the employee's job role and standard expectations for that role (e.g., from job description, training materials).

  **Step 1: Explicit Statement Check**
  - **Question**: Is C explicitly stated in any of the documents?
  - **Sufficient answer**: If yes, then attribute knowledge of C. Stop. The employee should have known C because it was written.
  - **If no, proceed to Step 2**.

  **Step 2: Immediate Inferences (Cheap Rules)**
  - **Question**: Can C be derived from the explicit content of the documents by applying one of the cheap inference rules in one step? (List the cheap rules for the auditor; see below.)
  - **Cheap rules list** (tailor to domain, but a starting point for a general procedure):
    1. **Modus ponens**: If the document says "If A then B" and also says A, then B follows.
    2. **Conjunction elimination**: If the document says "A and B", then A follows and B follows.
    3. **Disjunction elimination (only when combined with negation)**: If the document says "A or B" and also says "not A", then B follows.
    4. **Transitivity of ordering**: If the document says "A > B" and "B > C", then "A > C" follows.
    5. **Simple arithmetic**: Addition, subtraction, multiplication, division of numbers that are explicitly provided (e.g., if the document says "there are 10 units in tank A and 5 in tank B", then "there are 15 units in total" follows).
    6. **Negation elimination**: If the document says "not (not A)", then A follows.
    7. **Immediate set membership**: If the document says "X is in category Y" and "category Y requires Z", then "X requires Z" follows.
    8. **Immediate definitional substitution**: If the document defines a term and then uses it in a statement, substituting the definition yields a new statement (e.g., if "our policy defines 'hazardous' as ..." and then says "this chemical is hazardous", then the definition applies).
  - **Sufficient answer**: If yes (and the premises are in one or more documents that the employee had access to, and the connection between the documents is obvious, e.g., same section, same incident, same day), then attribute knowledge of C. Stop.
  - **If no, proceed to Step 3**.

  **Step 3: Short Inferences (Up to 3 Steps)**
  - **Question**: Can C be derived by a chain of up to 3 applications of cheap rules? (Each step must be a cheap rule as defined above.)
  - **Sufficient answer**: If yes, and the premises are readily available (i.e., the employee would have encountered them in a normal review of the documents, and they are not scattered in a way that requires extensive cross-referencing), then attribute knowledge of C. Stop.
  - **If no, proceed to Step 4**.

  **Step 4: Contextual Factors and Human Judgment**
  - **Question**: Even if the above steps fail, consider:
     a. **Role-specific expectations**: Given the employee's role, should they have known C? (e.g., an engineer should know basic physics; a financial officer should know accounting standards.) This requires human judgment based on the role.
     b. **Salience of information**: Were the premises and the connection between them so obvious that the employee must have noticed? (e.g., two consecutive emails on the same thread, or a report with a highlighted section and a follow-up memo.) This is a judgment call.
     c. **Time and distraction**: Was the employee in a situation (e.g., emergency, overwhelming workload) that would have made it unreasonable to expect them to make the inference? (Objective evidence required, e.g., logs showing they were handling 10 critical alerts at the time.)
     d. **Specialized rules**: Does the inference require a rule that is not on the cheap list but is standard in the employee's domain? (e.g., a specific regulatory formula). If so, and the employee is trained on it, then it might be attributed. This is a judgment call.
  - **Procedure**: The auditor must write a brief (1-2 sentences) for each of factors (a)-(d) that might apply. If any factor clearly supports attribution (e.g., role-specific expectation and the inference is standard), then hand off to the review board for a decision. If no factor supports attribution, then do not attribute. If the situation is ambiguous, hand off to the review board.

  **Step 5: Review Board Handoff**
  - **Where the procedure stops**: If at any step we attribute, we stop. If we reach Step 4 and the auditor cannot find support in (a)-(d) for attribution, then we stop with "not attributable".
  - **Handoff to human**: In Step 4, if the auditor is unsure about the judgment in (a)-(d) or if there is a mix of factors, they must hand off to the review board with a summary.

  **Important note on self-reports**: The procedure does not rely on the employee's self-report about whether they drew the inference. We are interested in whether they *should* have known, which is an objective standard based on the information they had and the expectations of their role.

  Now, run the procedure on three cases:

  **Case 1: Easy Attribution**
  - **Facts**: Employee had access to two documents. Document 1: "If the pressure exceeds 100 bar, then the safety valve must be activated." Document 2 (same incident report): "At 10:00, the pressure was 150 bar." Consequence C: "The safety valve must be activated."
  - **Step 1**: C is not explicit. Proceed.
  - **Step 2**: Apply modus ponens: from Document 1 and Document 2, we get C in one step. The documents are about the same incident and the same time frame. 
  - **Result**: Attribute knowledge of C.

  **Case 2: Hard Non-Attribution**
  - **Facts**: Employee had access to several reports. The consequence C is that a particular component will fail within 24 hours. The reasoning requires: 
     Step 1: From report A: "The component is of type X." 
     Step 2: From technical manual (which the employee had): "Type X components have a critical flaw when operating above 80°C." 
     Step 3: From report B: "The operating temperature was 85°C." 
     Step 4: From a statistical table in the manual: "At 85°C, the failure rate is 95% within 24 hours." 
     Step 5: Therefore, the component will fail (with 95% probability). 
    But note: we are not attributing probabilistic reasoning (cheap rules don't cover this). Also, this is 5 steps (we only go up to 3). Moreover, the inference from 95% probability to "will fail" is not deductive. The employee is a general technician, not a specialist in this component.
  - **Step 1**: C is not explicit. 
  - **Step 2**: Cannot get C in one step. 
  - **Step 3**: Cannot get C in up to 3 steps of cheap rules (because step 4 requires probabilistic interpretation, which is not cheap). 
  - **Step 4**: 
     a. Role: general technician, not expected to do this multi-step probabilistic reasoning. 
     b. Salience: The reports are from different days and the connection is not obvious. 
     c. No evidence of time pressure. 
     d. Specialized rules: The inference requires statistical reasoning, which is not standard for this role. 
  - **Result**: Not attributable. Handoff to review board? Only if the auditor thinks the role-specific expectations might include this. But in this case, the auditor writes that the role does not require such inference, so not attributable. The review board would likely agree.

  **Case 3: Uncomfortable Attribution (against self-report)**
  - **Facts**: Employee had access to a document that stated: "All systems in Sector 7 must be shut down during maintenance." and a second document (an email chain they were on) that stated: "The reactor is in Sector 7." The consequence C is: "The reactor must be shut down during maintenance." The employee denies having put these two together. They say they were focused on other tasks. However, the two documents were in the same email thread (the first was an attachment to the second) and the employee's job is to schedule shutdowns. 
  - **Step 1**: C is not explicit. 
  - **Step 2**: Apply immediate set membership: 
     Premise 1: "The reactor is in Sector 7." (from email)
     Premise 2: "All systems in Sector 7 must be shut down during maintenance." (from attachment)
     Therefore: "The reactor must be shut down during maintenance." (one step, set membership)
  - **Result**: Attribute knowledge of C. 
  - **Why uncomfortable?** The employee didn't draw the inference. But the procedure says they should have. The two premises were in the same email thread (so readily connectable) and the inference is immediate. The employee's role (scheduling shutdowns) makes it expected. The procedure does not require that the inference was actually made, only that it was easily available and expected.

  **What the procedure cannot do and where it is most likely to misfire:**
  - **Cannot do**: 
    - Handle complex probabilistic or uncertain reasoning.
    - Account for every possible cognitive limitation (it uses a bounded set of rules and steps, but real agents might miss even these).
    - Replace a full cognitive model of the specific employee (it uses role-based expectations as a proxy).
  - **Most likely to misfire**:
    - In high-pressure situations where even cheap inferences might be missed, if the auditor does not have evidence of the pressure.
    - In cases where the connection between premises is not obvious (e.g., two documents that are not cross-referenced and on different topics) but the auditor judges it as obvious.
    - When the employee has a cognitive impairment (which the procedure does not account for, as it is based on role expectations).
    - When the cheap rules are not well-tailored to the domain (e.g., in a highly technical field, the list might be too simplistic).

  **Final note**: The procedure is designed to be a practical tool. It will err on the side of attributing when the inference is cheap and the context is normal, and not attributing when the inference is complex or contextually unreasonable. The review board is there to handle the hard cases.
answer: |-
  ### Decision Procedure for Attributing "Should Have Known" in Safety Incidents

  This procedure is grounded in the critique of **logical omniscience**, rejecting the extremes of attributing all logical consequences (omniscience) or only explicit statements (nihilism). It focuses on **bounded rationality**: what a reasonable person *could and should* infer given their role, context, and access to information. The core insight retained from formal epistemology is **closure under cheap, familiar inference rules** (e.g., modus ponens) rather than closure under all entailment. Rules are "cheap" if they require minimal cognitive effort, are domain-appropriate, and are taught in basic training. Complex rules (e.g., statistical inferences, multi-step derivations) or contextually unreasonable inferences (e.g., under extreme time pressure) are excluded.

  **Simplifications for Non-Philosophers:**
  - **Kept**: Bounded closure (cheap rules only), role-based expectations, and contextual salience (e.g., document accessibility).
  - **Dropped**: Modal logic distinctions, probabilistic reasoning, belief revision dynamics, and agent-specific cognitive limits (replaced by standardized role expectations).
  - **Output**: "Attributable," "Not Attributable," or "Handoff to Review Board" (for judgment calls).

  ---

  ### Decision Procedure (Auditor’s Checklist)
  **Time Limit:** Complete within 60 minutes per case.  
  **Inputs:** Consequence (C), employee’s role, documents/reports/messages accessed.  
  **Outputs:** Attribution decision with justification.

  #### Step 1: Explicit Statement Check
  - **Question:** Is C stated verbatim in any accessed document?  
  - **Sufficient Answer:**  
    - **Yes:** Stop. **Attributable.** ("They saw it directly.")  
    - **No:** Proceed to Step 2.  
  - **Judgment Call?** No (factual check).

  #### Step 2: One-Step Inference Check  
  - **Question:** Can C be derived in **one step** using a **cheap inference rule** from explicit statements in the documents?  
  - **Cheap Rules List** (domain-agnostic examples; customize per industry):  
    - *Modus ponens:* "If A, then B. A is true. ∴ B."  
    - *Conjunction elimination:* "A and B. ∴ A."  
    - *Disjunctive syllogism:* "A or B. Not A. ∴ B."  
    - *Transitivity:* "A > B and B > C. ∴ A > C."  
    - *Set membership:* "X is in Y. All Y are Z. ∴ X is Z."  
    - *Basic arithmetic:* "X units at $Y/unit. ∴ Total cost = $X×Y."  
  - **Sufficient Answer:**  
    - **Yes** + **Premises Accessible:** Premises are in ≤2 documents, related to the same task/incident. → Stop. **Attributable.** ("One obvious step.")  
    - **No:** Proceed to Step 3.  
  - **Judgment Call?** No (rule application is mechanical).

  #### Step 3: Short Inference Chain Check (2–3 Steps)  
  - **Question:** Can C be derived in **2–3 steps** using **only cheap rules**, with premises from accessed documents?  
  - **Sufficient Answer:**  
    - **Yes** + **Premises Connectable:** Premises are in documents the employee routinely uses (e.g., daily reports). → Stop. **Attributable.** ("Short, feasible inference.")  
    - **No:** Proceed to Step 4.  
    - **Complex Rules Needed:** Rules beyond the cheap list (e.g., Bayes’ theorem, integrals) → Skip to Step 4.  
  - **Judgment Call?** Only if step count is ambiguous (e.g., is it 3 or 4 steps?). Otherwise, factual.

  #### Step 4: Contextual Feasibility Check  
  - **Question:** Even if Steps 1–3 fail, does **role** or **context** imply the employee should have inferred C?  
  - **Factors to Evaluate:**  
    - **Role Expectation:** Would someone in this role (e.g., engineer, manager) be trained to make this inference? (Use job descriptions/training manuals.)  
    - **Salience:** Were premises in "obvious" sources (e.g., highlighted in a summary email, not buried in Appendix C of a 500-page report)?  
    - **Cognitive Load:** Was the employee in crisis (e.g., emergency response) with no time to infer?  
  - **Sufficient Answer:**  
    - **Strong Evidence** (e.g., role manuals demand this inference; premises in a flagged alert): → **Handoff to Review Board** (final judgment).  
    - **Weak/No Evidence:** → Stop. **Not Attributable.** ("Unreasonable to expect.")  
  - **Judgment Call?** Yes (requires weighing context).

  #### Step 5: Review Board Handoff  
  - **Input:** Auditor’s summary from Steps 1–4.  
  - **Board’s Task:** Decide attribution based on role/context. Must sign off on all "Attributable" outcomes from this step.  
  - **Output:** "Attributable" or "Not Attributable."  

  ---

  ### Procedure in Practice: Three Test Cases

  #### Case 1: Easy Attribution (One-Step Inference)  
  - **Facts:** Safety officer accessed two emails:  
    - Email 1: "Leakage in Tank A requires immediate shutdown per Protocol X."  
    - Email 2: "Tank A has leakage."  
    - Consequence (C): "Tank A requires immediate shutdown."  
  - **Procedure:**  
    - Step 1: C not explicit.  
    - Step 2: One-step modus ponens (Email 1 + Email 2 → C). Premises in two on-task emails.  
    - **Result:** Attributable.  
  - **Why:** Trivial inference. No role/context issues.

  #### Case 2: Hard Non-Attribution (Complex Inference)  
  - **Facts:** Plant manager accessed:  
    - Report 1: "Pipe pressure (P) = 110 psi."  
    - Report 2: "If P > 100 psi, friction (F) increases exponentially: F = e^(0.1×P)."  
    - Report 3: "If F > 300, Valve V fails."  
    - Consequence (C): "Valve V will fail."  
  - **Procedure:**  
    - Step 1: C not explicit.  
    - Step 2: Not one step (requires calculating F = e^(0.1×110) ≈ 59,874, then comparing to 300).  
    - Step 3: Not 2–3 cheap steps (requires exponential math + inequality).  
    - Step 4: Role (manager) not trained for complex math; premises in technical reports.  
    - **Result:** Not Attributable.  
  - **Why:** Exponential functions are not "cheap rules." Unreasonable without engineering support.

  #### Case 3: Uncomfortable Attribution (Against Self-Report)  
  - **Facts:** Compliance officer received:  
    - Document 1: "Regulation R: All chemicals in Group G require safety gloves."  
    - Document 2: "Chemical C is in Group G." (In a spreadsheet attached to a weekly digest.)  
    - Consequence (C): "Chemical C requires safety gloves."  
    - Employee denies inferring C due to "overwhelm."  
  - **Procedure:**  
    - Step 1: C not explicit.  
    - Step 2: One-step set membership (Document 1 + Document 2 → C). Premises in routine documents.  
    - **Result:** Attributable (despite denial).  
  - **Why Uncomfortable?** First-person reports are overridden. The inference is cheap, and the role (compliance) demands attention to regulations. Context (weekly digest) implies salience.  
  - **Board’s Role:** Upholds attribution unless extreme context (e.g., digest received during a crisis).

  ---

  ### Limitations and Failure Modes
  **What the Procedure Cannot Do:**  
  1. **Handle Ambiguous Roles:** If role expectations are undefined (e.g., ad-hoc duties), Step 4 may misfire.  
  2. **Capture True Cognitive Limits:** It assumes standardized "reasonable" agents. Real fatigue/distraction is only partially covered in Step 4.  
  3. **Resolve Deep Disagreements:** E.g., when experts dispute whether a rule is "cheap" in the domain.  
  4. **Process Probabilities:** Statistical inferences (e.g., "95% chance of failure") are excluded unless made explicit.  

  **Most Likely to Misfire:**  
  - **Over-Attribution:** In low-stakes contexts where even "cheap" inferences are missed (e.g., premises in dense documents).  
  - **Under-Attribution:** When domain-specific rules are "cheap" for specialists but omitted from the auditor’s list.  
  - **Context Errors:** If auditors misjudge "salience" (Step 4) or time pressure.  

  **Final Note:** This procedure prioritizes **practical objectivity** over philosophical completeness. It errs toward attribution for cheap, role-relevant inferences but shields employees from unrealistic demands. The review board anchors it to real-world expectations.
