prompt: |-
  I'm a philosophy grad student TAing an intro course, and next week I have to run a fifty-minute discussion section on Frankfurt cases and the Principle of Alternative Possibilities. The professor's lecture already covered the basic incompatibilist argument — free will requires the ability to do otherwise, determinism rules that out, so if determinism is true, no free will. So the students have seen PAP stated, but only as a premise in that argument; they haven't really picked it apart on its own terms yet.

  Here's what I need: don't explain Frankfurt cases to me, I know the material. I need you to plan how I should *teach* it. What has to go on the board first, and in what order? I'm especially unsure about the carrying example. I know the standard one is Jones deciding to vote for a certain candidate while Black has a chip in his brain that would intervene if Jones started to waver — but I'm not sure whether to lead with that or build up to it slowly. Also, the students are going to form misconceptions and I want to head them off before they calcify. I'm guessing they'll say the case just shows Jones isn't *really* free (so it begs the question), or they'll object that Black's device means Jones couldn't do otherwise, so determinism is true in the scenario and we're back where we started. There's probably others I'm not thinking of — maybe something about the intervener needing a sign or cue and that reintroducing alternative possibilities at an earlier stage.

  I want you to take a definite stance — don't give me three possible lesson plans and tell me to pick. Tell me the one sequence you think works, which example to use and exactly why that one, where each misconception is likely to crop up in the discussion and how to defuse it before it takes root, and one question I can ask in the last five minutes that will tell me whether they actually understood what Frankfurt was trying to do rather than just memorizing the Jones-and-Black story. Also, what should I explicitly *not* get into? I'm guessing I should stay away from the wider compatibilism debate and just focus on whether PAP survives the counterexample as a necessary condition, but maybe I'm wrong about that and there's something I have to address or the whole thing won't land.
reasoning: |-
  Okay, let me tackle this philosophy TA's lesson plan request. They're prepping a 50-minute discussion on Frankfurt cases and PAP for intro students. The core challenge is designing a pedagogical sequence that prevents misconceptions while making Frankfurt's counterexample land effectively.

  First, I need to consider the students' current knowledge. They've seen PAP as part of the incompatibilist argument but haven't critically examined it standalone. That means I should start by isolating PAP itself before introducing any counterexamples. A clear definitional foundation is crucial - maybe writing "PAP: Agent X acts freely ONLY IF X could have done otherwise" on the board right at the start.

  For the example choice, the classic Jones/Black voting scenario seems most pedagogically sound despite the TA's hesitation. Its simplicity avoids distracting biopsychological details. But I'll suggest modifying it slightly - specifying the voting context clearly and emphasizing the intervener's passive role. The key is making the "no intervention actually occurs" point visually clear, perhaps with a timeline diagram.

  I'm anticipating three major misconceptions: 
  First, the "begging the question" objection that Jones wasn't really free. This needs preemptive addressing through intuition-pumping with the carrying example. 
  Second, the "determinism smuggled in" worry about alternative possibilities. 
  Third, the "sign/cue reintroduces alternatives" concern. Each requires strategic placement in the lesson flow with prepared counter-responses.

  The critical teaching move is structuring the board work sequentially: PAP definition → carrying scenario → Jones/Black case → Frankfurt's thesis. Using color-coding for conditions (necessary/sufficient) could help visual learners. For assessment, I'm thinking of a closing question about Frankfurt's anti-PAP argument structure rather than case recall.

  Crucially, the lesson should avoid compatibilism debates and focus narrowly on PAP's necessity. Time discipline is essential - I'll suggest strict minute allocations with fallback points if discussions run long. The carrying example serves as an accessible intuition-builder before the formal counterexample, making the abstraction more concrete for undergrads.
answer: |-
  Here's a definitive, step-by-step lesson plan designed to build understanding, preempt misconceptions, and assess comprehension within 50 minutes. **Lead with the carrying example** – it's less conceptually loaded than the voting case and makes the core intuition crystal clear before adding complexity.

  **Core Objective:** Students should understand Frankfurt's core argument: PAP (as a *necessary condition* for free will/moral responsibility) is false because Jones can be responsible *even when he couldn't have done otherwise* in the specific scenario.

  **What to Explicitly Avoid:**
  1.  **Compatibility/Incompatibility Debate:** Don't debate whether determinism *is* compatible with free will. Focus *only* on whether PAP is a *necessary condition*. Say: "Frankfurt isn't proving compatibilism is true; he's just showing one major argument *against* it (based on PAP) fails. PAP might not be needed."
  2.  **Other Compatibilist Conditions:** Don't introduce reasons-responsiveness, hierarchical desires, etc. Keep it focused on PAP vs. the counterexample.
  3.  **Flickers of Freedom/Signs:** Briefly acknowledge the "sign" objection exists *only* if it comes up. Have your defusal ready (step 6b), but don't proactively introduce this complex debate.
  4.  **Moral Responsibility Nuances:** Stick to Frankfurt's core claim (PAP isn't *necessary*) using responsibility as the indicator. Don't digress into specific theories of blame/praise.

  ---

  **Lesson Plan Sequence (50 mins total):**

  **I. Ground PAP & Set the Target (10 mins)**
  *   **Board:** Write prominently: **"Principle of Alternative Possibilities (PAP): An agent is morally responsible for an action ONLY IF they could have done otherwise."**
  *   **Discussion (Q1):** "The incompatibilist argument relies on PAP. But *why* might someone think PAP is true? What's the intuition?" *(Guide them: "If you literally had no other choice, how can you be blamed/praised? Doesn't freedom require options?")*
  *   **Board:** Under PAP, write: **"Incompatibilist Argument: 1. Free Will/Responsibility requires PAP. 2. Determinism → No Ability to Do Otherwise. 3. ∴ Determinism → No Free Will/Responsibility."**
  *   **Frame Frankfurt:** "Frankfurt attacks *premise 1*. He argues PAP is *not* a necessary condition for responsibility. He tries to show a case where: (A) The agent *is* responsible, BUT (B) The agent *could not have done otherwise*. If he succeeds, PAP is false."

  **II. Build Intuition: The Carrying Example (10 mins)**
  *   **Present:** "Imagine I ask you to carry a heavy box upstairs for me. You agree and carry it up willingly, no problem. Unbeknownst to you, I'm secretly *determined* to make you carry it. If you had hesitated or refused, I would have pulled out a gun and forced you to carry it at gunpoint. But you didn't hesitate. You carried it up willingly, exactly as you would have if I *didn't* have the gun. I never pulled out the gun."
  *   **Board:** Draw a simple timeline: `You decide willingly -> Carry box -> Done (No gun used)`
  *   **Crucial Question (Q2):** "**Are you morally responsible for carrying the box? Why or why not?**" *Anticipate:* Most will say "Yes." Why? *"Because you did it willingly! The threat didn't actually affect you. You chose to do it."*
  *   **Key Insight:** Write on board: **"Responsibility seems to depend on the *actual sequence* of events, not unactualized possibilities."**
  *   **Connect to PAP:** "But *could* you have done otherwise? Could you have refused?" *(They'll say "No, because of the gun.")* Write: **"Carrying Case: Responsible? YES. Could Do Otherwise? NO."**
  *   **State the Challenge:** "So, here we seem to have a case where someone is responsible *even though* they couldn't have done otherwise. This directly challenges PAP as a *necessary* condition. Frankfurt's Jones case is a more precise, 'philosophy-grade' version of this."

  **III. Present & Dissect the Jones Case (Frankfurt Case) (15 mins)**
  *   **Present:** "Jones is deciding whether to vote for Candidate A or Candidate B. He's leaning towards A. Unbeknownst to Jones, the nefarious neurosurgeon Black has implanted a device in Jones's brain. Black *wants* Jones to vote for A. If Black detects *any* sign that Jones is about to choose to vote for B (a specific brain state, a hesitation), Black will activate the device, which will *force* Jones to choose and vote for A. However, Jones, for his own reasons, deliberates and decisively chooses to vote for A *without any hesitation or wavering*. Black remains passive, never activating the device. Jones votes for A."
  *   **Board:** Timeline: `Jones deliberates -> Decisively chooses A -> Votes A -> Done (Device never activated)`
  *   **Crucial Questions:**
      *   **(Q3): Did Jones vote for A freely? Is he morally responsible for voting for A?** *(Anticipate: Strong "Yes" - he chose based on his reasons, no intervention.)*
      *   **(Q4): Could Jones have done otherwise? Could he have voted for B?** *(Anticipate: "No" - because if he tried, the device would stop him.)*
  *   **Board:** Write clearly: **"Frankfurt Case (Jones): Responsible? YES. Could Do Otherwise? NO."**
  *   **Frankfurt's Thesis:** Write: **"Frankfurt's Conclusion: PAP is FALSE as a *necessary condition* for moral responsibility."** Emphasize: Jones is responsible *without* the ability to do otherwise.

  **IV. Preempting & Defusing Misconceptions (10 mins)** *(Weave responses into Q3/Q4 discussion as they arise)*
  *   **Misconception 1: "Jones isn't *really* free/responsible (begging the question)."**
      *   **Defusal:** "Why does it *feel* like he is? The device *did nothing*. His choice flowed entirely from his own reasons and character. Compare to the carrying case – did the gun make you carry it? No. Your own choice did. The *presence* of a blocker doesn't automatically *cause* the action or negate the agent's own contribution in the actual sequence. Frankfurt is challenging the *assumption* that responsibility *requires* the absence of any blocker." (Refer back to Carrying Case intuition).
  *   **Misconception 2: "The device means determinism is true here / Jones couldn't do otherwise, so it doesn't help compatibilism."**
      *   **Defusal:** "Remember Frankfurt's *goal*! He's not trying to *prove* compatibilism is true. He's attacking the incompatibilist's *argument*. The incompatibilist says: 'Determinism rules out free will *because* it rules out the ability to do otherwise (PAP).' Frankfurt says: 'PAP is false anyway. Even *if* determinism rules out the ability to do otherwise (like in this case!), it might *not* rule out responsibility. So that specific argument *for* incompatibilism fails.' PAP might not be the right condition." (Point to the board highlighting the attack on Premise 1).
  *   **Misconception 3: "The 'sign' (hesitation) reintroduces alternative possibilities earlier."**
      *   **Defusal:** (If raised, or proactively if discussion lulls): "This is a famous objection (the 'flicker of freedom'). But notice: Frankfurt doesn't need Jones to have *zero* alternatives *whatsoever*. He only needs Jones to lack the specific alternative possibility *relevant to the action in question*: voting for B. Jones couldn't *vote for B*. He *might* have been able to *hesitate* or *show a sign*, but that's not the same as *voting for B*. The point is he lacked the ability to *perform the alternative action* (voting for B). The 'sign' is just a trigger for the blocker; it's not morally significant in itself regarding the *vote*." (Emphasize the action: *Voting for B* is impossible for Jones).

  **V. Assessment & Wrap-up (5 mins)**
  *   **Key Comprehension Check Question (Q5):** "**What, *exactly*, did Frankfurt's case aim to show about the relationship between the Principle of Alternative Possibilities (PAP) and moral responsibility?**"
      *   **Target Answer:** Frankfurt aimed to show that PAP is **not a necessary condition** for moral responsibility. He constructed a case (Jones) where the agent **is morally responsible** for an action **even though** they **could not have done otherwise**.
      *   **Why this works:** It forces them to articulate Frankfurt's *goal* and the *structure* of his counterexample, not just recall the Jones story. It checks if they grasp the attack on PAP *as a necessary condition*.
  *   **Board Summary:** Recap the key points:
      *   PAP: Responsibility **ONLY IF** Could Do Otherwise.
      *   Carrying Case: Responsible? **YES**. Could Do Otherwise? **NO**.
      *   Jones Case: Responsible? **YES**. Could Do Otherwise? **NO**.
      *   Frankfurt's Conclusion: PAP is **FALSE** (as a *necessary* condition).

  **Why This Sequence Works:**

  1.  **Starts Simple (Carrying):** Builds strong, relatable intuition *before* the formal philosophy case. Makes the "actual sequence" idea visceral.
  2.  **Isolates PAP First:** Forces focus on PAP *as a premise* before seeing the counterexample.
  3.  **Uses Jones as the "Philosophical Refinement":** The Jones case becomes a more rigorous version of the intuition established by carrying. Students see the continuity.
  4.  **Proactive Misconception Handling:** Defusals are tied directly to the cases and the core argument structure. The carrying case is crucial ammunition against the "not really free" objection.
  5.  **Clear, Focused Objective:** Every step reinforces the single goal: undermine PAP as *necessary*.
  6.  **Assessment Targets Conceptual Goal:** Q5 checks understanding of Frankfurt's *philosophical move*, not anecdotal recall.

  **Stick Firmly to This Path.** If students try to drag you into wider compatibilism ("So what *is* needed for free will then?") or determinism ("But is the Jones case deterministic?"), politely but firmly redirect: "Those are crucial questions, but for today, our focus is just on whether Frankfurt successfully shows that PAP *isn't* necessary. Let's stay focused on that." Good luck!

  ---
  **Post-Script:** If discussion on Q3/Q4 is slow, be ready to cold-call: "Sarah, does Jones seem responsible to you? Why?" / "David, could Jones have voted for B? Explain." Keep the pace brisk.
