  Next, the causal-historical chain. Reference relies on the history of word usage. Kripke and Putnam support this. It's plausible and explains why even experts can be wrong about definitions. In the novel, it could show how their words' histories lead to different references.

  Then, the division of linguistic labor. Experts define terms for the community. Putnam argued this. It's plausible and shows societal dependence. In the story, experts in each world could enforce different meanings, causing tension.

  Now, the Twin Earth scenario. Same mental states but different references due to external environment. This is Putnam's core argument. Controversial but defensible. Crucial for the novel—identical feelings but different realities. High confidence here.

  Semantic externalism: meanings depend on external factors. Broader than Twin Earth. Putnam and others support it. Plausible and key for the novel's premise. Characters' misunderstandings stem from their worlds' differences.

