prompt: |-
  I'm a PhD student in animal welfare science and I've kinda backed myself into a corner. The aquaculture certification body I'm collaborating with wants to roll out welfare standards for farmed decapods — shrimp, prawns, maybe crabs down the line — and they've asked me to help design the assessment framework their auditors will use on site visits. The problem is, all the standard welfare frameworks we reach for (Five Freedoms, the Brambell stuff, etc.) were built for terrestrial vertebrates and they just assume the animal has a kind of subjective life that we genuinely aren't sure crustaceans have. So you try to apply "freedom from fear" to a shrimp and it's not clear the concept even makes sense, or it makes sense but for reasons you can't defend to a skeptical reviewer.

  What I need is a decision procedure — something step-by-step that an auditor can actually work through — that takes a proposed welfare requirement or indicator and tells you whether it's justified to include in the standard, given the state of the evidence (and the state of the uncertainty) about crustacean sentience. The procedure has to steer between two failure modes I keep seeing in these discussions: (1) just assuming shrimp are tiny chickens and importing every terrestrial welfare concept uncritically, and (2) throwing up your hands and saying "well we don't KNOW they feel pain" and using that to justify doing nothing at all.

  Some constraints: the auditors are marine biologists or aquaculture people, not philosophers or neuroscientists, so the procedure can't ask them to resolve the debate about invertebrate consciousness. It should distinguish between requirements that are justified even under fairly skeptical views about crustacean sentience (like basic water quality parameters — if nothing else, poor water quality kills them, which is at least an economic loss) and requirements that only make sense if you assume a richer subjective experience (like "environmental enrichment to prevent boredom"). And I need it to flag where the procedure itself is making a normative call rather than a scientific one — I don't want to dress up my values as science and call it objective.

  If you could run the procedure on two candidate requirements — say, a maximum stocking density versus a requirement for electrical stunning before boiling — that would help me see how it handles indicators that rest on very different assumptions about what's going on inside the animal.
reasoning: |-
  Okay, the user is a PhD student in animal welfare science working with an aquaculture certification body to develop welfare standards for decapods like shrimp and prawns. The main challenge is adapting terrestrial vertebrate frameworks (like the Five Freedoms) to crustaceans, where sentience is uncertain. They need a decision procedure that avoids two extremes: anthropomorphizing crustaceans or using uncertainty to justify inaction.

  First, I should address the core issue: how to assess welfare indicators without definitive proof of sentience. The procedure must be practical for auditors without expertise in philosophy or neuroscience. It should differentiate between requirements based on biological functioning versus those assuming subjective experiences. 

  The user mentioned constraints: auditors are aquaculture professionals, so the process must be step-by-step and clear. Also, it must highlight normative judgments versus scientific evidence. The examples given—stocking density (biological impact) versus electrical stunning (potential pain)—illustrate the spectrum.

  I recall the Brambell Committee's emphasis on behavioral needs and suffering. For crustaceans, evidence of nociception exists, but consciousness is debated. The procedure should require evidence at each step, from biological harm to behavioral indicators of negative states. 

  Key elements: 
  1. Start with basic biological needs (e.g., water quality) since these affect survival and are uncontroversial. 
  2. For indicators implying subjective experience, require higher evidence thresholds, like trade-offs or protective behaviors. 
  3. Explicitly note where normative choices enter, such as precautionary principles. 

  For the examples: 
  - Stocking density: High density causes mortality and stress markers, so it's justified under biological functioning. 
  - Electrical stunning: Requires assuming pain perception; auditors must acknowledge the normative leap despite behavioral evidence (e.g., avoidance). 

  The user’s deeper need is a defensible, transparent framework that balances science and ethics, ensuring credibility with both industry and critics. They might also need to justify including certain standards under uncertainty without overstepping. 

  Structuring the procedure into phases (Biological Imperatives, Welfare Risk Indicators, Potential Affective State Indicators) with evidence tiers and decision thresholds can meet this. Including a "normative flag" where science is insufficient addresses their concern about disguising values as facts. Testing with the examples will show how it works in practice, highlighting the distinction between evidence-based and value-based decisions.
answer: |-
  Here’s a step-by-step decision procedure designed for auditors, balancing scientific evidence, practical constraints, and ethical transparency. It uses a tiered evidence approach and explicitly flags normative judgments.

  **Crustacean Welfare Indicator Justification Procedure**  
  *(For Auditors/Aquaculture Professionals)*

  ---

  ### **Step 1: Classify the Requirement’s Basis**
  Categorize the proposed requirement into one of three tiers:  
  - **Tier 1 (Biological Imperatives):** Prevents death, disease, or physiological dysfunction *regardless of sentience*.  
    *Examples: Water quality, oxygen levels.*  
  - **Tier 2 (Welfare Risk Indicators):** Addresses measurable stress/distress biomarkers or high-risk contexts for harm, *with or without confirmed sentience*.  
    *Examples: Handling protocols, injury rates.*  
  - **Tier 3 (Potential Affective State Indicators):** Assumes capacity for negative/positive subjective experiences (e.g., pain, fear, boredom).  
    *Examples: Environmental enrichment, stunning methods.*

  ---

  ### **Step 2: Evidence Threshold Assessment**
  Apply evidence thresholds based on tier:  
  - **Tier 1:** Justified if supported by:  
    - Peer-reviewed studies showing direct impact on survival/growth in decapods.  
    - Industry best practices for productivity.  
    *Auditor Action: Include. Minimal controversy.*  
  - **Tier 2:** Justified if:  
    - Robust evidence of chronic stress (e.g., elevated cortisol-like hormones, immunosuppression).  
    - Observable behavioral avoidance (e.g., escape attempts, prolonged hiding).  
    - High prevalence of physical harm (e.g., limb loss, cannibalism).  
    *Auditor Action: Include if evidence exists in ≥3 decapod species.*  
  - **Tier 3:** Requires:  
    - Evidence of **trade-off behaviors** (e.g., sacrificing food for analgesia, prolonged grooming after injury).  
    - **Context-sensitivity** (e.g., learned avoidance of harmful stimuli).  
    - Neurobiological plausibility (e.g., opioid receptors, brain structures processing nociception).  
    *Auditor Action: Flag as "Normative Judgment Required" (see Step 3).*

  ---

  ### **Step 3: Normative Judgment Protocol**
  If Tier 3 evidence is incomplete but suggestive:  
  1. **State the Uncertainty:**  
     *e.g., "Electrical stunning reduces limb autotomy in prawns, but pain perception remains unconfirmed."*  
  2. **Apply the Precautionary Principle Threshold:**  
     - Does the practice cause severe/persistent harm if sentience exists? (e.g., boiling alive).  
     - Is there a low-cost, low-risk alternative? (e.g., electrical stunning).  
     - Would omission risk significant reputational damage to the certification body?  
  3. **Document Justification:**  
     *e.g., "Requirement based on precautionary principle due to (a) behavioral evidence of nociception, (b) availability of affordable alternatives."*

  ---

  ### **Step 4: Auditor Feasibility Check**
  Even if scientifically justified, reject if:  
  - Cannot be reliably measured by auditors in field conditions (e.g., hormones require lab tests).  
  - No feasible corrective action exists for farms.  
  - Implementation cost is prohibitive (>10% profit impact) without phased adoption.

  ---

  ### **Applied to Your Examples**
  **Example 1: Maximum Stocking Density**  
  - **Step 1:** Tier 1 (prevents mortality) + Tier 2 (high density → cannibalism/injuries).  
  - **Step 2:** Strong evidence: Density correlates with mortality, aggression, and stress metabolites in shrimp.  
  - **Step 3:** No Tier 3 assumption needed.  
  - **Verdict:** **Justified** as Tier 1/2 requirement.

  **Example 2: Electrical Stunning Before Boiling**  
  - **Step 1:** Tier 3 (assumes capacity for suffering).  
  - **Step 2:** Evidence:  
    - Trade-off behavior: Prawns choose analgesia when injured.  
    - Avoidance: Shrimp learn to avoid noxious stimuli.  
    - Neurobiology: Crustaceans have nociceptors + opioid receptors.  
    *But not conclusive for "pain-like" experience.*  
  - **Step 3:** Normative flag! Precautionary principle applies:  
    - Potential harm severity: Extreme (boiling alive).  
    - Alternative: Stunning is low-cost and reduces observable distress.  
    - Reputational risk: High public concern.  
  - **Verdict:** **Justified under precautionary principle** with documented rationale.

  ---

  ### **Key Features for Your Constraints**
  - **Avoids Sentience Debates:** Relies on observable biomarkers/trade-offs for Tiers 1–2. Tier 3 requires evidence beyond reflexes but doesn’t demand consciousness proof.  
  - **Transparency:** "Normative Flag" separates science from ethics. Auditors don’t debate philosophy—they follow the flowchart.  
  - **Prevents Inaction:** Tiers 1–2 cover baseline welfare even for skeptics; precautionary principle addresses high-stakes Tier 3 cases.  
  - **Practicality:** Uses evidence available to aquaculture professionals (behavior, mortality, injuries) vs. lab-only data.

  ### **Output Template for Auditors**
  ```markdown
  [Requirement]: Electrical stunning  
  - Tier: 3 (Potential Affective State)  
  - Evidence: Trade-off behavior (Y), Neurobiological plausibility (Y), Context-sensitivity (Y)  
  - Normative Judgment: Precautionary principle applied.  
  - Feasibility: Commercially available stunners; audit protocol: check voltage logs.  
  [ ] Include   [X] Include with Precautionary Justification   [ ] Reject  
  ```

  This system forces explicit reasoning, leverages existing science pragmatically, and ensures auditors don’t overstep their expertise while upholding credible welfare standards. Would you like a flowchart version for field use?
