prompt: |-
  I'm a control engineer working on shared autonomy for robotic manipulators — the system needs to infer a human operator's goals from partial observations and intervene helpfully. My native vocabulary is state estimation, observability, cost functions, belief-space planning, and modeling at multiple levels of abstraction. Lately I've been in discussions with colleagues from a cognitive science background who keep invoking Dennett's intentional stance to justify attributing beliefs and desires to the AI subsystems we're building. The claim, as I understand it, is that treating a system as a rational agent with beliefs and desires is just a predictive strategy — it doesn't require that anything inside the system corresponds to those beliefs, only that the strategy pays predictive rent. Some of them go further and say that this is all it ever means to have a belief, for humans as well.

  I want you to restate the intentional stance and the surrounding debate about attributing beliefs to AI systems in the vocabulary I actually use — state spaces, observers, system identification, cost-function inference, and so on. Do this systematically: which claims map cleanly, which require distortion, and which have no expression in my vocabulary at all? Then give me the residue report. Is there something in the philosophical debate that my vocabulary can't capture because it's genuinely missing a distinction, or is the debate generating heat because its terms are underspecified in a way that becomes obvious once you try to operationalize them in engineering language?

  And please: if the whole translation exercise is misguided — if the intentional stance is already just what a control engineer does when they model another agent, and the philosophical overlay adds nothing — say so plainly rather than humoring the exercise. I'd rather learn that I'm asking the wrong question.
