prompt: |-
  I'm writing a paper that evaluates counterfactual theories of causation (Lewis, Halpern and Pearl) against interventionist theories (Woodward), and I've realized I need to step back and ask what either kind of theory is supposed to do. Give me the desiderata: the full set of requirements that any adequate theory of causation must meet, with the case or consideration that motivates each, and mark which are non-negotiable constraints on any theory and which are parochial commitments of one research program. I am especially interested in whether any subset of the non-negotiable requirements is jointly unsatisfiable — that would be a finding in itself, and it's the part of the answer I most want to see.

  The requirements should cover at minimum: actual causation (token-level, what caused what on a particular occasion), type causation (what it means for one kind of thing to cause another), and the relationship between the two. Include the standard problem cases — early and late preemption, symmetric overdetermination, double prevention, omissions, and switches rather than just pushes — but also address structural constraints: transitivity, the relationship between causation and counterfactual dependence, whether causation is a relation between events or between variables taking values, and whether a theory of causation must also serve as a theory of causal explanation or whether those can come apart. For each requirement, press on whether it really is a requirement or just a feature of the examples the literature happens to have fixated on.

  Begin with the list itself, with no preface or commentary. Then give the case behind each requirement. Then address the joint-satisfiability question and identify which single requirement does the most to force a choice between the counterfactual and interventionist approaches.

  Finally, tell me where your classification of requirements as negotiable versus non-negotiable is most likely to fail — which argument or consideration, if it went the other way, would rearrange the list.
reasoning: |-
  Okay, the user is writing a paper comparing counterfactual theories of causation (like Lewis, Halpern, Pearl) with interventionist theories (Woodward). They need a clear set of desiderata—requirements any adequate theory of causation must meet. I should cover actual causation (token-level), type causation, and their relationship. Plus, address problem cases like preemption, overdetermination, omissions, and structural issues like transitivity and the link to explanation.

  First, I recall the key aspects. Actual causation is about specific events causing others in a particular instance. Type causation involves general relationships between kinds of events. The relationship between them is crucial—how generalizations apply to specific cases. Problem cases are standard in the literature: early/late preemption tests dependency without direct causation; symmetric overdetermination challenges necessity; double prevention involves absences causing effects; omissions deal with non-events; switches test causal routes. Structural constraints include transitivity (if A causes B and B causes C, does A cause C?), the link to counterfactuals (does causation require dependency?), ontological commitments (events vs. variables), and whether causation must explain things.

  The user wants to know which desiderata are non-negotiable vs. parochial. Non-negotiables are likely core intuitions any theory must satisfy, like handling actual causation in clear cases. Parochial ones might be specific to certain approaches, like variable-based ontology in interventionism. They're especially interested in whether some non-negotiables are jointly unsatisfiable—a big finding. Also, which requirement forces a choice between counterfactual and interventionist theories.

  I need to list each requirement concisely, then explain the motivating case, classify as non-negotiable/parochial, and note negotiability. For example, handling preemption is non-negotiable because it's a basic intuition; transitivity might be negotiable as theories differ. The joint satisfiability issue: maybe omissions conflict with transitivity or counterfactual dependency. The key divider could be the ontological commitment—events vs. variables—since interventionism relies on variables for modeling, while counterfactual theories often use events.

  Where my classification might fail: if we challenge the necessity of handling omissions as causes. If omissions aren't seen as genuine causes, it could remove a big headache. Or if transitivity is rejected, some problems vanish. The user should be aware of these hinges.

  Finally, structure the response: first the list, then cases, then joint satisfiability, the key divider, and classification risks. Keep it thorough but clear.
answer: |-
  Here is the complete list of desiderata for a theory of causation, structured as requested, followed by analysis of joint satisfiability, the key dividing requirement, and potential weaknesses in the negotiability classification.

  **I. The List of Desiderata**

  1.  **Token Actual Causation (Non-Negotiable):** The theory must provide an account of what it means for one particular event (or fact) `c` (the cause) to cause another particular event (or fact) `e` (the effect) in a specific, actual situation.
  2.  **Type-Level Causation (Non-Negotiable):** The theory must provide an account of what it means for one type of event (or state, property, variable value) `C` to cause another type of event (or state, property, variable value) `E` (e.g., "smoking causes cancer").
  3.  **Connection between Token and Type (Non-Negotiable):** The theory must explain the relationship between token actual causation and type-level causation (e.g., how token instances relate to general causal claims, how type-level claims bear on token instances, potential supervenience).
  4.  **Handle Early Preemption (Non-Negotiable):** The theory must correctly identify the actual cause `c` in cases where a backup cause `b` would have caused `e` if `c` had not, but `c` caused `e` first and `b` was interrupted.
  5.  **Handle Late Preemption (Non-Negotiable):** The theory must correctly identify the actual cause `c` in cases where `c` causes `e` via a process that preempts a backup process `b` only at the very last moment before `b` would have caused `e`.
  6.  **Handle Symmetric Overdetermination (Non-Negotiable):** The theory must correctly identify *both* `c1` and `c2` as causes of `e` in cases where `c1` and `c2` occur simultaneously and each would have been sufficient by itself to cause `e` (and did so jointly).
  7.  **Handle Double Prevention (Negotiable/Parochial):** The theory must account for cases where `c` causes `e` by preventing some event `d` that would have prevented `e` (causation via an absence).
  8.  **Handle Omissions (Negotiable/Parochial):** The theory must account for cases where the *absence* of an event `c` (an omission) causes an event `e` (e.g., not watering a plant causes its death).
  9.  **Handle Switches (Non-Negotiable):** The theory must account for `c` causing `e` where `c` doesn't supply energy/momentum but merely selects or switches between pre-existing potential causal pathways leading to `e` (or different effects).
  10. **Transitivity Constraint (Negotiable/Parochial):** The theory must specify whether the causal relation is transitive (if `c` causes `d` and `d` causes `e`, then `c` causes `e`), and if not, explain why transitivity fails in apparent counterexamples.
  11. **Causation & Counterfactual Dependence (Negotiable/Parochial):** The theory must specify the relationship between causation and counterfactual dependence (e.g., Is causation *defined* by dependence? Is dependence sufficient? Necessary? Neither?).
  12. **Ontological Commitment (Negotiable/Parochial):** The theory must clarify its ontological commitments: are causes/effects primarily *events* (with fine-grained or coarse-grained individuation), *facts/states of affairs*, or *variables taking specific values*?
  13. **Causation vs. Causal Explanation (Negotiable/Parochial):** The theory must clarify the relationship between causation itself and causal explanation. Must an adequate theory of causation *also* serve as an adequate theory of explanation? Can they come apart? If so, how?

  **II. Motivating Cases and Classification Justification**

  1.  **Token Actual Causation:** *Motivation:* Core intuitive notion (e.g., "The spark caused the explosion"). Any theory failing this fails its primary task. *Non-Negotiable.*
  2.  **Type-Level Causation:** *Motivation:* Essential for science, law, policy, and everyday generalizations (e.g., "Virus X causes disease Y", "Speed limits reduce fatalities"). *Non-Negotiable.*
  3.  **Connection between Token and Type:** *Motivation:* Philosophical coherence and practical application. How does "smoking causes cancer" relate to "this patient's smoking caused their cancer"? *Non-Negotiable.*
  4.  **Handle Early Preemption:** *Motivation:* Standard test case (e.g., Assassin1 poisons victim, killing them; Assassin2 would have shot but was stopped. Assassin1 caused death). Intuition strongly favors the preempting cause. *Non-Negotiable* (core test of differentiating actual cause from backup).
  5.  **Handle Late Preemption:** *Motivation:* Harder test case (e.g., Suzy throws rock, shattering bottle; Billy throws simultaneously; Suzy's rock hits first, preempting Billy's at the last instant). Challenges theories relying solely on process continuity or counterfactuals without careful structuring. *Non-Negotiable* (tests robustness against subtle differences in causal process timing).
  6.  **Handle Symmetric Overdetermination:** *Motivation:* Test case for sufficiency and overdetermination (e.g., Two rocks thrown simultaneously by Suzy and Billy shatter bottle; either alone would have sufficed). Intuition strongly favors both being causes. *Non-Negotiable* (tests ability to handle joint sufficiency and avoid making causation depend on fragility).
  7.  **Handle Double Prevention:** *Motivation:* Common and intuitive form of causation (e.g., Bodyguard deflects Assassin's bullet, preventing the assassination; Bodyguard's action caused survival by preventing the prevention). *Negotiable:* Some theories (e.g., pure process theories) struggle; others (counterfactual/interventionist) handle it better. Rejecting absences as causes is a live option (though costly to intuition/practice).
  8.  **Handle Omissions:** *Motivation:* Ubiquitous in responsibility and explanation (e.g., "The guard's failure to lock the door caused the theft"). *Negotiable:* Deeply problematic ontologically and for counterfactuals/dependence. Theories can reject omissions as genuine *causes* (treating them as explanatory factors only) without abandoning core tasks.
  9.  **Handle Switches:** *Motivation:* Test case for "difference-making" vs. "production" views (e.g., Flipping a switch diverts a train to track A, causing disaster; the flip didn't supply the train's energy). Intuition strongly favors the switch-flip as a cause. *Non-Negotiable* (tests if theory captures relevant difference-making without requiring energy transfer).
  10. **Transitivity Constraint:** *Motivation:* Seems intuitive for chains (e.g., `c` causes `d`, `d` causes `e` => `c` causes `e`). But counterexamples exist (e.g., `c`=nurse gives drug, `d`=patient ingests dose, `e`=patient recovers; but if drug is placebo, `d` (ingesting placebo) causes `e`, but `c` (giving placebo) does *not* cause `e`). *Negotiable:* Theories legitimately diverge (Lewis rejects transitivity; others try to save it). Not core to defining the basic relation.
  11. **Causation & Counterfactual Dependence:** *Motivation:* Counterfactuals are central to many theories (Lewis: causation IS dependence; Interventionism: dependence under interventions is key). But preemption shows dependence isn't necessary. *Negotiable:* Counterfactuals are powerful tools, but a theory can downplay them (e.g., mechanistic) or define causation without strict identity to dependence.
  12. **Ontological Commitment:** *Motivation:* Impacts formalization and problem cases. Event-based theories struggle with omissions/double prevention. Variable-based theories (interventionism) excel at type-level and generalizations but require careful token translation. *Negotiable:* Different frameworks prioritize different ontological primitives; no single "correct" choice, though choices have consequences.
  13. **Causation vs. Causal Explanation:** *Motivation:* Explanations can be partial, contrastive, or pragmatic (e.g., "Why the bridge collapsed?" could cite metal fatigue, earthquake, or poor maintenance). Is causation itself similarly pragmatic? *Negotiable:* A theory *can* define causation robustly (e.g., as an objective dependency or mechanism) and treat explanation as involving the *selection* and *presentation* of causes relative to context/purpose. Tight linkage (e.g., Woodward) is parochial.

  **III. Joint Satisfiability of Non-Negotiable Desiderata**

  The most significant tension arises between the **non-negotiable requirement to handle omissions/double prevention as causation (if included)** and the **non-negotiable requirements of transitivity (if held) and avoiding pervasive overdetermination**. However, since omissions/double prevention are *negotiable* and transitivity is *negotiable*, the strictly non-negotiable core (1-6, 9) appears jointly satisfiable by sophisticated versions of both counterfactual (e.g., Halpern-Pearl structural models) and interventionist theories. The key pressure point is:

  *   **Requirement 8 (Omissions) + Requirement 10 (Transitivity) + Symmetric Overdetermination:** If omissions are genuine causes (8) and causation is transitive (10), then seemingly innocuous omissions can generate absurd chains of causation and rampant overdetermination. For example: Your failure to prevent a dictator's birth might be seen as causing (via a long chain) all their atrocities; every fatality in a disaster might be overdetermined by millions of omissions to prevent it. *If* both 8 and 10 are insisted upon as non-negotiable, they clash violently with the need to avoid absurd overdetermination (implicit in 6) and plausible causal scope. This forces theories to either reject omissions as causes (deny 8 is non-negotiable) or reject transitivity (deny 10 is non-negotiable). Both escapes are viable, showing the core non-negotiables avoid this clash only because 8 and 10 *are* negotiable.

  **IV. Requirement Forcing the Choice Between Approaches**

  The requirement doing the most to force a choice between counterfactual (Lewis, Halpern-Pearl) and interventionist (Woodward) approaches is:

  *   **Requirement 12: Ontological Commitment (Events vs. Variables).**
      *   *Why:* Counterfactual approaches (especially Lewis, often Halpern-Pearl models) are fundamentally grounded in *events* (or facts/event-tokens). Token causation is primary, type causation derived (often as "causal tendencies" of event types). Interventionism is fundamentally grounded in *variables taking values*. Type-level relations (generalizations about what happens to `E` when you intervene on `C`) are primary. Token causation is often analyzed as the holding of a type-level relation in a specific context, instantiated by variable values. This foundational difference shapes how they handle almost every other desideratum, particularly type/token connection (3), omissions/double prevention (7, 8 - variables handle absences more naturally), switches (9), and the role of counterfactuals (11 - interventions provide a semantics). While both use counterfactuals, the *meaning* of those counterfactuals differs profoundly (comparisons of event-worlds vs. interventions on variables).

  **V. Weaknesses in the Negotiability Classification**

  The classification is most vulnerable regarding **Requirement 8 (Omissions)** and **Requirement 7 (Double Prevention)**:

  1.  **Argument Against Non-Negotiability of Omissions/Double Prevention:** If one argues that attributions of causation involving omissions are *fundamentally pragmatic or explanatory* rather than reflecting a genuine ontological relation ("real causation" only involves positive occurrences), then Requirement 8 (and arguably 7) could be downgraded from a core requirement of a theory of *causation itself* to a requirement for a theory of *causal explanation or responsibility*. This view (e.g., held by some process theorists or skeptics about absences) would make these requirements parochial to explanation-focused approaches. If this argument succeeds, it removes a major source of difficulty for theories.
  2.  **Argument For Non-Negotiability of Transitivity:** If one argues that transitivity is a *logical* requirement for a relation labeled "causation" or that counterexamples can be handled by finer-grained event individuation or context-sensitive restrictions, then Requirement 10 might be elevated to non-negotiable. This would create significant tension with preemption cases and omission cases (if included).
  3.  **Argument For Non-Negotiability of Variable Ontology:** If one argues that science *only* deals with type-level relations between variables and that token causation is either an illusion or entirely derivative, then Requirement 12 (specifically, a variable-based ontology) becomes non-negotiable, radically favoring interventionism and marginalizing event-based counterfactual approaches. Conversely, an insistence on events as primitive marginalizes interventionism.

  The viability of these arguments determines whether omissions/double prevention and transitivity are genuine constraints on *causation* or merely constraints on *causal explanation* or features of specific theoretical frameworks. This is the most contested and pivotal area for classifying desiderata.
