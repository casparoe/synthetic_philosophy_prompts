answer: |-
  ### Structured Decision Procedure for Rental Assistance Based on Luck Egalitarianism

  **Core Principles**:  
  - **Brute Luck**: Circumstances beyond an applicant's control (e.g., illness, layoffs, natural disasters).  
  - **Option Luck**: Outcomes of voluntary, informed choices (e.g., quitting a job, risky investments).  
  - **Constrained Choice Test**: A choice does **not** count as option luck if:  
    (a) Alternatives were non-viable (e.g., unsafe housing, no childcare),  
    (b) The applicant lacked critical information, or  
    (c) The choice was made under duress (e.g., medical emergency, abuse).  

  **Procedure Steps** (follow sequentially):  

  #### Step 1: **Identify Primary Cause of Crisis**  
    - *Question*: Was the **initial trigger** for rent delinquency (e.g., job loss, income reduction, expense spike) due to brute luck?  
      - **Yes** → Proceed to Step 2.  
      - **No** (e.g., quit a job, overspent on non-essentials) → Skip to Step 4.  
      - **Unclear** → Flag for supervisor review.  

  #### Step 2: **Assess Severity of Brute Luck**  
    - *Question*: Did the brute luck event cause a **≥30% loss of monthly income** or **unavoidable essential expense** (e.g., medical emergency)?  
      - **Yes** → Proceed to Step 3.  
      - **No** (e.g., minor income dip) → Deny.  

  #### Step 3: **Evaluate Post-Event Choices**  
    - *Question*: After the brute luck event, did the applicant **prioritize rent** over non-essential spending?  
      - **Yes** (e.g., used savings for rent, cut discretionary spending) → **Approve**.  
      - **No** (e.g., spent savings on non-essentials like travel, luxury goods) → Proceed to Step 4.  

  #### Step 4: **Apply Constrained Choice Test**  
    - *Question*: For any choice contributing to delinquency (e.g., quitting a job, spending savings), **were viable alternatives available?**  
      - **No viable alternatives** (fails Constrained Choice Test) → Treat as brute luck. Proceed to Step 6.  
      - **Viable alternatives existed** (passes Constrained Choice Test) → Treat as option luck. Proceed to Step 5.  

  #### Step 5: **Assess Extraordinary Hardship**  
    - *Question*: Would denial cause **catastrophic harm** (e.g., homelessness of a disabled person, minor children)?  
      - **Yes** → Flag for supervisor review.  
      - **No** → Deny.  

  #### Step 6: **Weigh Brute vs. Option Luck (Point System)**  
    Assign points based on available evidence:  
    - **+1 point** per *brute luck factor* (e.g., layoff, disability, natural disaster).  
    - **-1 point** per *option luck factor* (e.g., avoidable spending, voluntary job quit).  
    - **0 points** if choice was constrained (Step 4).  
    - **Thresholds**:  
      - **+1 or higher** → Approve (brute luck dominates).  
      - **0** → Flag for supervisor review (tie).  
      - **Negative** → Deny (option luck dominates).  

  ---

  ### Application to Cases  
  **Case 1: Single Mother (Restaurant Job Loss)**  
  - **Step 1**: Job loss due to recession = **brute luck** (Yes).  
  - **Step 2**: 100% income loss = **severe** (Yes).  
  - **Step 3**: Used last paycheck for rent = **prioritized rent** (Yes) → **APPROVE**.  
    *Rationale*: Pure brute luck; no irresponsible choices.  

  **Case 2: Entrepreneur (Business Failure)**  
  - **Step 1**: Quit stable job voluntarily = **not brute luck** (No → Step 4).  
  - **Step 4**: Chose to invest savings in inventory despite viable alternatives (e.g., paying rent). No duress/lack of info = **option luck** (Step 5).  
  - **Step 5**: No dependents/disability = **no extraordinary hardship** → **DENY**.  
    ***Difficulty for Director***: This outcome prioritizes fairness (option luck) over compassion. The applicant took a risk society values, but the procedure holds individuals accountable for avoidable choices. Helping here could incentivize reckless financial risks by others.  

  **Case 3: Woman with Chronic Pain**  
  - **Step 1**: Disability = **brute luck** (Yes).  
  - **Step 2**: Chronic condition forces part-time work = **severe** (Yes).  
  - **Step 3**: No non-essential spending mentioned = **prioritized rent** (assume Yes) → **APPROVE**.  
    *Rationale*: Rent increase + fixed income = brute luck. Long-term tenancy signals responsible planning.  

  ---

  ### Limitations of the Procedure  
  1. **Systematically Mishandled Cases**:  
     - **Structural Injustices**: Applicants facing systemic barriers (e.g., racial discrimination, lack of childcare) may be misclassified as "option luck" if choices appear voluntary on paper.  
     - **Information Gaps**: Relies on self-reported data; hidden constraints (e.g., mental health crises) may be missed.  
     - **Long-Term Disadvantage**: Chronic brute luck (e.g., generational poverty) is reduced to a "+1 point," oversimplifying layered inequities.  

  2. **Unavoidable Value Judgments**:  
     - **"Viable Alternatives" (Step 4)**: Caseworkers must subjectively define "viable" (e.g., is moving to a dangerous neighborhood "viable"?).  
     - **"Extraordinary Hardship" (Step 5)**: Discretion is needed to weigh vulnerability (e.g., is a 60-year-old without family support "at risk"?).  

  3. **Required Discretion Beyond the Procedure**:  
     - **Credibility Assessment**: Caseworkers must judge applicant honesty (e.g., hidden income, misrepresented spending).  
     - **Tie-Breaking**: Cases scoring "0" in Step 6 require supervisor nuance (e.g., prioritizing families with children).  
     - **Evolving Contexts**: Sudden local crises (e.g., factory closure) may warrant overriding the procedure for community stability.  

  **Conclusion**: This procedure ensures consistency by centering *agency* and *circumstance*, but it cannot eliminate subjectivity. Caseworkers must still:  
  - Probe for hidden constraints in interviews.  
  - Document rationale where discretion is applied.  
  - Advocate for systemic solutions where brute luck (e.g., disability benefits gaps) repeatedly overwhelms individual responsibility.
