     - Step 1: Immediate cause? He quit a stable job -> that's a choice (option luck). So Step 1: no -> go to Step 4.
     - Step 4: The choice: quit a stable job to start a business. This is a voluntary, informed choice? He had savings that could have covered rent but chose to invest in inventory. 
          Constraint test: 
            - Was there duress? No.
            - Did he have viable alternatives? Yes: not quitting the stable job, or keeping some savings for rent.
            - Adequate information? He knew the risks of starting a business.
          So it's option luck. 
          -> Step 5: Extraordinary hardship? 
              - He is an able-bodied adult without dependents? (assume so) -> no extraordinary hardship beyond typical eviction? 
              -> Deny.

     However, let's check Step 6 if we had mixed factors? But in this path we didn't go to Step 6 because Step 4 led us to Step 5. But note: the business failure might be considered brute luck? But the initial choice was voluntary.

     Alternatively, we might consider that the business failure was due to market conditions (brute luck) but the decision to start the business was option luck. However, the immediate cause of the eviction is the choice to quit and invest, not the business failure per se.

     Result: Deny.

     This may be difficult to accept because society benefits from entrepreneurs. But according to luck egalitarianism, the entrepreneur took a risk (option luck) and it failed. The program is not meant to insure against business risks. However, note that the applicant might argue that without assistance he will become homeless and unable to contribute further. But the procedure does not have a category for future societal benefit.

   Case 3: Woman with chronic pain
     - Step 1: Immediate cause: chronic pain condition (brute luck) and rent increase (which may be beyond her control? But note: rent increases are a market phenomenon, but they are not necessarily brute luck for the tenant unless they are extraordinary and due to circumstances beyond her control? However, her condition is brute luck and limits her income.)

     How to frame? The immediate cause of the eviction is the rent increase that she cannot absorb because of her limited income (due to brute luck disability).

     So Step 1: brute luck? Yes (the disability and the fact that she cannot work full-time is brute luck). But the rent increase? We can treat it as brute luck because she has no control over it? However, note that rent increases are common and she might have had the option to move? But she has lived there 12 years and the increase might be unexpected and substantial.

