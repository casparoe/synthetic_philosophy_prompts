   3. Caseworkers will still need discretion in:
        - Judging the credibility of the applicant's story.
        - Assessing the reasonableness of the applicant's actions (Step 3) and the severity of constraints (Step 4).
        - Deciding what counts as a brute luck event (e.g., a rent increase in a gentrifying area might be due to systemic issues, but is it brute luck for the individual?).

