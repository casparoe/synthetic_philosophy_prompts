prompt: |-
  I'm the director of client services at a municipal rental-assistance program. We have funds to prevent about forty percent of the evictions we see; the rest we have to turn away. Our current process is inconsistent — different caseworkers make different calls on similar cases, and we have no shared rationale for why we help one household and not another. I want to move to a structured decision procedure grounded in luck egalitarianism: roughly, the view that inequalities traceable to brute luck (circumstances beyond a person's control) are unjust and call for redress, while inequalities traceable to option luck (the outcomes of genuine, informed choices) do not, or at least not to the same degree.

  Please write a step-by-step decision procedure my caseworkers can follow when evaluating an application. The procedure should take the form of a sequence of questions with decision rules — where the answer to one question sends you to the next, stops the process with a denial, or flags the case for supervisor review. It needs to handle the following difficulties:

  - Most real cases involve a mix of brute luck and option luck. A tenant may have lost their job through no fault of their own (brute luck) but then spent down their savings on non-essentials rather than rent (possible option luck). The procedure needs a way to weigh these factors rather than treating cases as all-or-nothing.
  - Some choices are made under such severe constraints that treating them as exercises of option luck seems perverse. The procedure needs a test for when a choice is too constrained to count as the kind of option luck that should disqualify someone from assistance.
  - Caseworkers have about forty-five minutes per file and no background in philosophy. The procedure must be usable with the information actually in an application — pay stubs, eviction notices, a brief intake interview — not information that would require an omniscient observer.

  After laying out the procedure, please apply it to three cases:

  1. A single mother who lost her restaurant job when the business closed during a recession. She has no family nearby. She used her last paycheck to pay rent for two months but then fell behind. Her eviction notice gives her three weeks.

  2. A man in his thirties who quit a stable job to launch a business importing ceramics. The business failed within a year. He had savings that would have covered six months of rent but chose to invest them in inventory instead. He now faces eviction and argues that his entrepreneurial risk-taking should not disqualify him, since society benefits from people starting businesses.

  3. A woman with a chronic pain condition that makes full-time work impossible. She works part-time and receives some disability benefits, but they do not cover her rent. She has lived in the same apartment for twelve years. Her landlord is evicting her after a rent increase she could not absorb.

  For at least one of these cases, the procedure should yield an answer that I — as someone who wants to help vulnerable people — will find difficult to accept. Please flag that result and explain why the procedure forces it.

  Finally, tell me what the procedure cannot do: which cases it will systematically mishandle, which value judgments it cannot eliminate and merely relocates, and where caseworkers will still need to exercise discretion that the procedure cannot replace.
reasoning: |-
  We are designing a structured decision procedure based on luck egalitarianism. The key ideas are:
   - Brute luck: circumstances beyond a person's control (e.g., illness, natural disasters, recession-related job loss).
   - Option luck: outcomes of informed, voluntary choices (e.g., starting a business, gambling, spending on non-essentials).

   The procedure must:
   1. Handle mixed cases by weighing factors.
   2. Account for constrained choices (where choices are not truly voluntary).
   3. Be usable in 45 minutes with typical application information.

   We'll break the decision into steps with questions and decision rules.

   Steps:

   Step 1: Is the immediate cause of eviction due to brute luck?
     - Look for recent events beyond the applicant's control that led to the inability to pay rent (e.g., job loss due to business closure, illness, natural disaster).
     - If yes, proceed to Step 2.
     - If no (e.g., the applicant quit a job without another lined up, or chose to spend rent money on non-essentials), then proceed to Step 4 (to assess whether the choice was constrained).

   Step 2: Assess the severity of brute luck event and its impact on income.
     - How substantial was the income loss? (e.g., loss of primary job, reduction in hours beyond the applicant's control)
     - How long ago did the event occur? (We want to see if the applicant had time to recover or find alternatives.)

     Rule: If the brute luck event caused a loss of at least 30% of the applicant's income and occurred within the last 6 months, flag as a strong brute luck factor. Proceed to Step 3.

     If the event is older than 6 months, we need to see if the applicant has made reasonable efforts to recover (Step 3).

   Step 3: Evaluate the applicant's response to the brute luck event.
     - Did the applicant take reasonable steps to mitigate the loss? (e.g., looking for work, applying for unemployment, seeking other assistance, cutting non-essential expenses)
     - Did the applicant use available resources (savings, assets) to cover essential expenses (like rent) before non-essentials?

     Rule:
       - If the applicant took reasonable steps and still fell behind, then the case is likely eligible. Proceed to Step 6 to assess constraints on any choices made after the event.
       - If the applicant did not take reasonable steps (e.g., did not look for work when able, spent savings on non-essentials instead of rent), then the case may be a mix. Proceed to Step 4 to assess the choices.

   Step 4: Assess the nature of the choice that contributed to the eviction (option luck).
     - Focus on choices that directly led to the inability to pay rent (e.g., quitting a job without a backup, investing savings in a business instead of paying rent, spending on luxury items or vices).
     - We must consider whether the choice was made under severe constraints (constraint test).

     Constraint test (to see if a choice should be treated as brute luck):
       1. Was the choice made under duress (e.g., to escape an abusive situation, to address a medical emergency)?
       2. Did the applicant have viable alternatives that would have avoided the eviction? (If not, then the choice was constrained.)
       3. Was the choice made without adequate information? (e.g., the applicant was misled or lacked critical information)

     Rule:
       - If the choice passes the constraint test (i.e., it was made under severe constraints and thus not truly voluntary), then treat it as brute luck and proceed to Step 6.
       - If the choice does not pass the constraint test (i.e., it was a voluntary, informed choice with viable alternatives), then it is option luck and the case is likely ineligible. Proceed to Step 5 for a final check on hardship.

   Step 5: Check for extraordinary hardship despite option luck.
     - Even if the immediate cause is option luck, we must consider if denying assistance would lead to catastrophic consequences (e.g., homelessness for a vulnerable person, such as someone with a disability or with dependent children).
     - This step is a safety valve but should be used sparingly.

     Rule:
       - If denying assistance would lead to extraordinary hardship (e.g., the applicant is disabled, elderly, or has minor children and no alternative housing) then flag for supervisor review.
       - Otherwise, deny the application.

   Step 6: Weighing the factors (for mixed cases or when constraint test is passed).
     - We have a mix of brute and option luck factors. We need a way to weigh them.

     We'll use a point system to keep it simple:

       Brute luck factors (each counts as +1):
          - Job loss due to layoff, business closure, or health issue beyond control.
          - Natural disaster or fire affecting the home or income.
          - Serious illness or disability of the applicant or a dependent.
          - Victim of crime (e.g., robbery, assault) that led to financial loss.
          - Other events that are clearly beyond control (caseworker judgment, but must document).

       Option luck factors (each counts as -1):
          - Quit a job without another lined up (unless due to duress, like harassment or unsafe conditions, which we already covered in constraint test).
          - Spending on non-essentials (e.g., luxury goods, vacations, gambling) when rent was due and funds were available.
          - Risky investments that were not necessary for basic survival (like starting a business with rent money).

       Constraint adjustment: If a choice that would normally be option luck was made under severe constraints (as determined in Step 4), then we do not count it as an option luck factor (it becomes 0).

     Rule:
       - Total score = (brute luck points) + (option luck points, after constraint adjustment)
       - If total score >= 1, then approve (because brute luck dominates).
       - If total score == 0, then flag for supervisor review (tie).
       - If total score < 0, then deny (option luck dominates).

   Step 7: Final eligibility check (regardless of luck factors).
     - The program has limited funds and must target those most in need. We must check:
          - The applicant must be at or below 80% of the area median income (or whatever the program's income threshold is).
          - The eviction must be imminent (within 30 days) and the applicant must have a legal right to the property (i.e., a tenant).
          - The rental assistance must be sufficient to prevent the eviction (i.e., the amount owed is within the program's per-household caps).

     Note: This step is assumed to be already met by the program's initial screening. We are focusing on the luck-egalitarian rationale.

   However, to be safe, we can include:
     - If the applicant does not meet the program's basic eligibility criteria (income, residency, etc.), deny.

   Step 8: Approval or denial.

   Diagram:

     Start
       |
       v
     Step 1: Immediate cause brute luck? 
          | Yes -> Step 2
          | No -> Step 4

     Step 2: Brute luck event severity and timing
          | If severe and recent (within 6 months) -> Step 3
          | If not (event older than 6 months) -> Step 3 (to check response)

     Step 3: Reasonable response?
          | Yes -> Step 6 (but also consider any choices made after the event? We'll have Step 6 for weighing)
          | No -> Step 4 (to assess the choices)

     Step 4: Assess the choice (option luck) and apply constraint test
          | If constrained (so not true option luck) -> Step 6 (treat as brute luck factor? Actually, we'll do the point system in Step 6 that accounts for constraint adjustment)
          | If not constrained (true option luck) -> Step 5

     Step 5: Extraordinary hardship?
          | Yes -> Supervisor review
          | No -> Deny

     Step 6: Weigh factors (point system) 
          | Score >= 1 -> Approve
          | Score == 0 -> Supervisor review
          | Score < 0 -> Deny

     Step 7: Basic eligibility (if not already checked) -> if not eligible, deny.

   We'll assume Step 7 is done at intake. So we focus on Step 1-6.

   Now, apply to the cases:

   Case 1: Single mother
     - Lost restaurant job due to business closure (recession) -> brute luck. (Step 1: yes)
     - Event: recent (within 6 months? Assume yes) and caused 100% income loss -> Step 2: yes, severe and recent.
     - Step 3: She used her last paycheck to pay rent for two months (so she prioritized rent). She has no family nearby and has been looking for work (we assume from the case, but we should check). If she has been looking, then reasonable steps. 
          -> Proceed to Step 6.

