  ## The Better Ghosts  
  *(After the Notion of Coherent Extrapolated Volition)*

  This wiser us I strain to see – how faint  
  The outline shines where future selves convene.  
  **Just give me salt and sugar now**, no saint  
  Am I, caught in the moment's sharp constraint,  
  The petty urge, the comfort swift and mean.  
  This wiser us I strain to see – how faint  

  The signal glows! What grand design or plaint  
  Would echo in that cool, reflective sheen?  
  **Just give me salt and sugar now**, no saint,  
  I crave the rush, the solace without taint  
  Of consequence. What future might have been?  
  This wiser us I strain to see – how faint  

  And far! A self refined without complaint,  
  Whose wants align with vistas vast and clean?  
  **Just give me salt and sugar now**, no saint  
  Can I become while present hungers paint  
  My choices grey. What wisdom lies between  
  This wiser us I strain to see – how faint –  
  **And we'll build up a kinder sun somehow?**

  The ghost of who we *might* become remains,  
  A haunting blueprint sketched in might-be's light.  
  **Just give me salt and sugar now**, it feigns  
  Contentment, while the deeper current strains  
  Towards a shore unseen, immensely bright.  
  **And we'll build up a kinder sun somehow**,  
  If we could shed the shadows *we* allow.

  ---

  **Just give me salt and sugar now**,  
  **And we'll build up a kinder sun somehow.**

  ---

  **Notes on Coherent Extrapolated Volition (CEV):**

  **Settled Consensus (Among Those Who Engage with CEV):**

  1.  **The Core Intuition:** Most alignment researchers who discuss CEV agree on its *fundamental motivation*: directly programming an AI with our *current*, potentially flawed, contradictory, or short-sighted preferences is likely dangerous or unsatisfactory. The goal is to find a *better* target for the AI's optimization.
  2.  **"Better" Involves Reflection:** There's broad agreement that "better" preferences involve some form of *reflective equilibrium* – what we would want if we thought more carefully, were more informed about the consequences, and potentially, were more coherent internally.
  3.  **Avoiding Literalism:** It's widely accepted that CEV isn't about an AI *literally* taking orders from our current selves ("fetch the coffee") and then extrapolating that into something catastrophic ("conquer the world to secure the coffee supply"). The point is to move *beyond* such literal interpretation of commands or surface desires.
  4.  **The Problem of Conflict:** There's consensus that figuring out how to aggregate or reconcile the extrapolated volitions of *many* individuals (especially with conflicting interests) is a massive, perhaps the central, challenge within the CEV framework.

  **Genuinely Contested Points:**

  1.  **"Idealisation" vs. "Extrapolation":** What exactly constitutes "smarter," "better informed," or "more the people we wish we were"? Is it purely cognitive (more facts, better reasoning) or does it involve moral improvement? How much "idealisation" is permissible before it ceases to be *our* volition? This is deeply philosophical and contested.
  2.  **Convergence:** Would individuals, or humanity as a whole, undergoing this idealised reflection *converge* on similar or compatible values? Or would deep, irreconcilable differences persist even after ideal reflection? This is unknown and hotly debated. Critics often doubt convergence.
  3.  **Computational Feasibility:** Is CEV a coherent concept that could *in principle* be translated into a computational process an AI could execute? Many are highly sceptical, viewing it as too vague, undefined, or dependent on unanswerable philosophical questions to be practically implementable.
  4.  **Yudkowsky's Original Formulation vs. Interpretations:** Eliezer Yudkowsky's specific phrasing ("what we *would* want if we knew more, thought faster, were more the people we wished we were...") is the source, but interpretations vary significantly. Some see it as primarily about cognitive enhancement, others include strong moral dimensions; some focus on aggregate humanity, others on individuals. There's no single "authorised" version.
  5.  **Is CEV the *Right* Approach?:** Many alignment researchers believe CEV, while an interesting thought experiment, is too ill-defined or impractical to be the primary solution. They advocate for other approaches like debate, recursive reward modelling, or corrigibility, seeing CEV as a distant, possibly unreachable, ideal rather than a workable strategy.

  In essence, the *problem* CEV tries to address (aligning superintelligence with our *deepest* interests, not just surface commands) is widely acknowledged as crucial. However, the *solution* proposed by CEV – particularly its definition, feasibility, and potential for convergence – remains highly speculative and contentious within the technical alignment community. The poem captures the beautiful but unsettling core tension: the gap between our present and potential selves, and the uncertainty about bridging it.
