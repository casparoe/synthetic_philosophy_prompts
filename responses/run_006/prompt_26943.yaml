prompt: |-
  Ok so in Keynes's stuff on probability he has this distinction between how probable you judge something to be and how much evidence that judgement is based on, which he calls the weight of argument. Can you give me an example where two people end up with the exact same probability for some claim but it would be totally rational for one of them to act way more confidently on it because they have a lot more evidence behind the number? I'm trying to figure out what the weight part actually adds beyond the probability its self.
