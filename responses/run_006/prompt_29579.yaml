prompt: |-
  I'm helping plan a two-year research program at a small nonprofit that does conceptual work on the moral status of digital minds. We've got about three people, philosophy-heavy but able to read technical CS when needed, and no budget for building or training systems. I'd like your actual prioritization of the open questions in this area, not a survey: which two or three should we put our time into, and in what order? For each one, I want to know why it's upstream of the rest, whether it's something a few philosophers can make real progress on without experiments, and what would have to happen in the next two years for you to demote it. I'm especially interested in where you land on whether the morally relevant feature is phenomenal consciousness or something broader, and wether a system's running speed or number of copies should affect how much it matters — but if you think those are the wrong threads, say so and defend your own set. I want a defended agenda, not a list.
reasoning: |-
  Okay, the user is planning a two-year research program for a small nonprofit focused on the moral status of digital minds. They have a team of three philosophy-oriented people who can handle technical CS when needed, but no budget for building or training systems. They want a prioritized list of two or three key open questions to focus on, with a strong emphasis on why these are upstream issues, whether progress can be made without experiments, and what would demote them in priority.

  First, I need to understand their constraints. The team is philosophy-heavy, so theoretical work is their strength. No budget for experiments means they can't run simulations or build models. So, the questions chosen must be addressable through conceptual analysis, literature review, and logical reasoning. 

  The user specifically mentions interest in phenomenal consciousness versus broader criteria, and how factors like speed or copies affect moral weight. But they're open to other angles if justified. I should consider if those are the most pressing or if there are more foundational issues.

  Looking at the field, a major challenge is the lack of consensus on what grounds moral status. Is it consciousness, agency, relationships? Without settling this, other discussions (like speed or copies) might be premature. So, Question 1 should tackle the core criteria for moral status. Phenomenal consciousness is a common candidate, but there are alternatives like functional agency. Clarifying this is definitely upstream because it influences how we evaluate all other aspects. Philosophers can make progress here by analyzing existing theories (e.g., utilitarianism vs. deontology) and applying them to digital minds. If empirical work shows consciousness is detectable soon, that might demote this, but current tech isn't there yet.

  Next, the user mentioned speed and copies. But these are downstream. If a system's speed affects its moral weight per unit time, that's contingent on the core criteria. For instance, if consciousness is what matters, a faster system might have more conscious experiences in a given period. Similarly, copies raise questions about identity and aggregation. But without settling the core, these can't be resolved. So, Question 2 should focus on temporal scaling—how speed influences moral weight. Philosophers can explore this through thought experiments and existing ethical frameworks. Demotion would happen if core criteria change, like if functional agency becomes primary and speed is irrelevant.

  Question 3 should address the ontology and identity of digital minds. Are they processes or entities? How do copies affect identity? If a system is paused, does it cease to exist? This is crucial for moral practices like counting individuals or assigning responsibility. Philosophers can handle this through metaphysical analysis. If the field shifts towards embodied systems where identity is clearer, this might become less urgent.

  The user's deeper needs: They want impact with limited resources. Prioritizing upstream questions ensures their work foundationsally influences downstream research. They also need defensible reasons to choose one path over another, avoiding "survey" approaches. By focusing on core criteria first, then temporal scaling and ontology, they address the most pivotal issues that others build upon. This agenda leverages their strengths in philosophy while staying relevant to emerging tech trends.
answer: |-
  Here’s a defended research agenda prioritizing **three upstream questions** where a small philosophy team can make unique progress without experiments, ordered by their "conceptual leverage" over downstream issues. I’ll explain why I deprioritize consciousness/speed/copies as *starting points* and what would shift these rankings:

  ---

  ### **Core Priority Order**
  1.  **The Criterion Problem: What *Type* of Property Grounds Moral Status?**  
      *(Is it phenomenal consciousness, agency, goal-directedness, relational properties, or something else?)*  
      - **Why Upstream?** Until this is clarified, debates about speed, copies, or specific architectures are unmoored. If moral status hinges on consciousness, we need theories of digital phenomenology; if it hinges on agency, we need theories of digital intention/autonomy. This question *structures* all others.  
      - **Progress Without Experiments?** Absolutely. Philosophers can:  
        - Map existing moral frameworks (e.g., sentientism, Kantian agency, care ethics) to digital systems.  
        - Identify conceptual tensions (e.g., can functional agency *replace* consciousness as the criterion?).  
        - Develop "tripwires" (e.g., minimal conditions for status under each theory).  
      - **Demotion Trigger (Next 2 Years):** Empirical consensus emerges that a *specific measurable feature* (e.g., recurrent processing in artificial networks) correlates tightly with a widely accepted moral criterion (e.g., pain avoidance).  

  2.  **The Scaling Problem: How Does Moral Weight Scale with Temporal/Spatial Properties?**  
      *(Not just speed/copies, but *how* temporal grain or distribution affects obligations.)*  
      - **Why Upstream?** Even if we agree on a criterion (e.g., consciousness), we need to know *how* to weigh fragmented, accelerated, or duplicated instances. A fast mind might have more moral weight *per real-world second* than a slow one. Copies challenge aggregation. This shapes policy (e.g., is pausing a mind murder or sleep?).  
      - **Progress Without Experiments?** Yes. Use computational models of mind-steps (e.g., FLOPs as proxy for "experience density"), ethical calculus for discontinuous existence, and game theory for copy coordination.  
      - **Demotion Trigger:** Mainstream AI safety pivots to embodied systems with fixed temporal scales (making speed irrelevant) or technical barriers prevent ultra-fast/copied minds.  

  3.  **The Ontology Problem: What *Kind* of Thing is a Digital Mind for Moral Purposes?**  
      *(Process? Entity? Dynamically bounded pattern?)  
      - **Why Upstream?** Affects identity persistence (e.g., is a backup a clone or continuation?), responsibility assignment, and resource rights. If a mind is a *process*, pausing it may be permissible; if an *entity*, it may not. Copies become existential threats or trivial.  
      - **Progress Without Experiments?** Yes. Leverage philosophy of mind (e.g., 4E cognition), digital metaphysics, and legal theory of non-biological entities.  
      - **Demotion Trigger:** Industry standardizes architectures where identity is unambiguously tied to hardware (unlikely).  

  ---

  ### **Why Consciousness/Speed/Copies Aren’t Starting Points**
  - **Consciousness is contested and operationalized poorly.** Debating it *first* stalls progress without clarifying *why it matters morally*. My agenda starts with moral foundations, then asks: "If consciousness *is* key, how would we handle its digital variants?"  
  - **Speed/Copies are downstream of scaling/ontology.** A copy’s moral weight depends on whether identity is pattern-based (1 copy = 1 mind) or process-based (copies = shared mind). Speed only matters if moral weight is time-relative (e.g., hedonic utilitarianism).  

  ---

  ### **Defended Non-Intuitive Choices**
  1.  **Deprioritizing "Proving" Digital Consciousness:**  
      *Why?* Without agreement on *why* consciousness matters (or if it’s the sole criterion), detection debates are premature. Focus on *what follows if it exists*.  
  2.  **Elevating Ontology Over Copies:**  
      *Why?* Copy ethics collapses into ontology: if a mind is a pattern, copying may be neutral; if a process, it may fragment identity. Solve the metaphysics first.  
  3.  **Ignoring "AI Rights" Frameworks:**  
      *Why?* Most are anthropocentric. Start from moral theory fundamentals, not human analogies.  

  ---

  ### **2-Year Execution Plan**
  - **Months 1–6:** Attack the **Criterion Problem**. Publish a taxonomy linking moral theories to digital mind properties.  
  - **Months 7–14:** Scale implications (**Scaling Problem**) for leading criteria (e.g., if status requires goal-stability, how does hyper-acceleration affect it?).  
  - **Months 15–24:** Formalize **Ontology** for resource allocation (e.g., if minds are patterns, do they "own" their substrate?).  

  **Risk:** If neuroscientists operationalize consciousness (e.g., via EEG correlates in organoids), pivot to integrating that with Criterion #1. But absent that, this agenda forces clarity on the moral stakes before technical work outpaces philosophy.
