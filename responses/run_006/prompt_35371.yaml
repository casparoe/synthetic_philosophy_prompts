answer: |-
  **Bottom Line:** The dismissal "that's just a verbal dispute" conflates distinct claims ranging from trivial terminological differences to substantive metaphysical stances, and its power to license dismissal often depends on smuggling in stronger, unargued assumptions, especially regarding practical irrelevance or metaphysical non-substantivity.

  Here’s a breakdown of the distinct claims, ordered from least to most metaphysically loaded, with analysis:

  1.  **Terminological Divergence (Agreement on Facts, Disagreement on Labels):**
      *   **Claim:** Parties agree on all relevant non-linguistic facts (e.g., the physical composition and functional role of an object, the biological structure and behavior of a virus) but apply different words/concepts to describe them (e.g., "table" vs. "particles arranged table-wise", "alive" vs. "not alive").
      *   **Plausibility:** Highly plausible in many cases (e.g., "tomato is a fruit" vs. "tomato is a vegetable").
      * **Trivial/Substantive?** Trivial *if* the *only* disagreement is which label to apply to an agreed-upon set of facts.
      *   **Licenses Dismissal?** **Often, but not always.** Once the factual agreement is established and the *purely* linguistic nature of the divergence is clarified, further debate *about which label is "correct"* might reasonably be dismissed *if* no practical or theoretical stakes hinge on the label choice *in that specific context*. However, dismissal isn't automatic: it depends on confirming no hidden stakes exist (e.g., legal definitions, pedagogical clarity, categorical boundaries in a system). The dismissal itself *does not* smuggle in stronger claims; it rests on the established factual agreement.

  2.  **Definitional Under-Specification (The Question is Ill-Posed):**
      *   **Claim:** The core terms of the debate (e.g., "exists", "alive", "race", "fruit") lack sufficiently precise or shared definitions to make the question answerable without first stipulating meanings. The dispute arises from ambiguity, not fundamental disagreement.
      *   **Plausibility:** Very plausible, especially in complex or contested domains. Most debates flagged as "verbal" likely involve this element.
      *   **Trivial/Substantive?** Substantive. Identifying ambiguity and the need for stipulation is crucial for productive discussion.
      *   **Licenses Dismissal?** **No, not immediately.** Recognizing this *forces engagement* with the task of defining terms or clarifying the framework of the question. Dismissing the debate *at this point* prematurely shuts down the necessary work of conceptual clarification. The dismissal *smuggles in* the assumption that the definitional work is either impossible, pointless, or already settled in a way favoring one side, which is rarely justified without further argument.

  3.  **Practical Irrelevance (Nothing Hangs on the Answer):**
      *   **Claim:** Regardless of how the terminological or definitional question is resolved, it makes no difference to practice, prediction, explanation, intervention, or value judgments in the relevant domain. The answer has no consequences.
      *   **Plausibility:** Plausible *in specific contexts* (e.g., whether we call it a "table" or "particles" might not affect carpentry or physics *in everyday contexts*). Highly implausible in others (e.g., classifying viruses as "alive" could impact research priorities; defining "race" has profound social and ethical implications).
      *   **Trivial/Substantive?** Substantive and context-dependent. Determining practical import requires analysis.
      *   **Licenses Dismissal?** **Only if the irrelevance is convincingly established.** Declaring a debate "merely verbal" *on the grounds of practical irrelevance* is only justified *after* demonstrating that no significant consequences flow from either answer. The dismissal often **smuggles in** an *unargued assertion* of irrelevance ("Nothing hangs on this, *therefore* it's just verbal"). This is frequently where the dismissal overreaches, especially in social/political contexts or foundational theoretical debates where implications may be indirect or symbolic but significant.

  4.  **Metaphysical Non-Substantivity (No Fact of the Matter):**
      *   **Claim:** There is no objective, mind-independent truth about the matter in question (e.g., whether tables "really exist" beyond particles, whether viruses are "objectively" alive, whether race classifications "correspond to reality"). The dispute reflects choices in conceptual schemes or linguistic frameworks, not discovery of pre-existing facts.
      *   **Plausibility:** Highly contentious. Represents a strong anti-realist or conventionalist stance. Plausible to some within specific metaphysical frameworks (e.g., ontological anti-realism, strong social constructivism), implausible to others (e.g., realists).
      *   **Trivial/Substantive?** Deeply substantive and metaphysically loaded.
      *   **Licenses Dismissal?** **Only if this anti-realist stance is successfully defended.** To dismiss a debate as "merely verbal" *because* there's "no fact of the matter" is to *take a side* in a significant metaphysical debate. The dismissal **is** the stronger claim. It doesn't *smuggle in* anti-realism; it *explicitly asserts* it as the *reason* for dismissal. This makes the dismissal itself a highly substantive philosophical move requiring justification, not a neutral observation that ends discussion.

  **Conclusion on Dismissal:** The power of "it's just verbal" to license walking away is most straightforward and justified only under the **Terminological Divergence** reading *after* factual agreement is confirmed *and* practical irrelevance is established. In all other readings – **Definitional Under-Specification**, **Practical Irrelevance**, and especially **Metaphysical Non-Substantivity** – the dismissal itself either requires significant further work (clarifying definitions, proving irrelevance) or constitutes a major, contested philosophical claim that needs defense. The phrase is often wielded prematurely to shut down complex debates by implicitly assuming practical irrelevance or metaphysical non-substantivity without argument. Truly determining if a debate is "merely verbal" in a dismissible sense usually requires *more* philosophical engagement, not less.
