prompt: |-
  I've been trying to sort out which disagreements are 'just verbal' and which are substantive, and I keep getting stuck. I've read LessWrong forever, so my first move is always to taboo the disputed word and see whether the disagreement survives — but that move keeps giving me answers I don't actually endorse when I look at concrete cases. You're a professional philosopher who works on metaontology and verbal disputes, and who takes the taboo technique seriously rather than treating it as an internet gimmick. Please think carefully, brainstorm a bit before committing, and don't just pattern-match to the standard verbal-disputes line — I want the principle that fits my cases, even if it means telling me one of my verdicts has to go.

  Here are my gut calls.

  - 'A tomato is a fruit, not a vegetable.' Both sides agree on all the botanical and culinary facts. Merely verbal, end of story.
  - 'Is a hot dog a sandwich?' Merely verbal, basically a joke.
  - 'If a tree falls in the forest and no one is around, does it make a sound?' Both sides agree that there are pressure waves and that no one has an auditory experience. Merely verbal; 'sound' is being used two ways.
  - 'Is a virus alive?' Both sides agree on all the biology — it replicates, needs a host cell, etc. But I don't think this one is merely verbal. There's a real question about where the line should go, even though it's a line-drawing question.
  - 'Is Pluto a planet?' Both sides agree on the orbital facts. I lean not merely verbal, because which classification we use matters for how we carve up the solar system, but I can't say why that isn't true of the tomato case too.
  - 'Is a trans woman a woman?' Even if both sides agree on all the underlying facts about biology, identity, and social role, I still strongly think the dispute is substantive, not merely verbal. But I can't articulate what makes it different from the hot dog case beyond 'the stakes are higher,' and higher stakes feels like it shouldn't change whether a question is verbal.
  - 'Do humans have free will?' Compatibilists and incompatibilists seem to partly mean different things by 'free will,' but I don't think the debate is just verbal. There's a substantive question about which ability is the one worth wanting, or something like that.

  My rough principle is: a dispute is merely verbal iff, after you taboo the disputed term and both sides spell out the concepts they're actually using, they agree on every remaining non-linguistic question. But that rule classifies the virus and Pluto cases as merely verbal, and maybe the trans woman case too, which I don't want. So maybe I need a second clause: the dispute is still substantive if there's a real question about which of the competing concepts better deserves the word. But that second clause feels like it might be to ad hoc — 'better deserves' can do whatever I want it to do.

  So: what's the principle, or a small set of candidate principles, that captures these verdicts? State it precisely, and for each clause say which of my cases forces it. Then apply it to cases I haven't settled: (i) is a tomato a vegetable for tariff purposes? (ii) is mathematics discovered or invented? (iii) is someone in a persistent vegetative state alive? Finally, be honest about which of my verdicts the principle can't accommodate and whether I should overturn one instead of complicating the principle. Tell me how confident you are in the principle and single out the point you're least sure about.
reasoning: |-
  Hmm, this user is clearly deeply engaged with philosophical methodology around verbal disputes and has hit a wall with the standard "taboo the word" approach. They've provided seven nuanced test cases where their intuitive judgments conflict with what the taboo test would conclude. I need to help them develop a more sophisticated principle that preserves their intuitions while remaining philosophically rigorous.

  The user's core tension is fascinating - they recognize that tabooing words resolves surface disagreements, but feel it misses something important in cases like "is a virus alive?" or "is Pluto a planet?" where classification feels substantive despite full factual agreement. Their rejection of "higher stakes" as the differentiator shows they want a principled distinction, not just emotional weighting.

  Looking at their cases, I notice three patterns where tabooing feels inadequate: (1) when the concept plays a functional role in a system (e.g. "planet" in astronomy), (2) when it carries normative weight ("woman" in social ontology), and (3) when it involves paradigm-dependent grounding ("alive" in biology). This suggests we need to distinguish between purely lexical disputes and what we might call "constitutional disputes" - disagreements about how to structure conceptual frameworks.

  For the virus case, the key is recognizing that "life" isn't just a label but a cluster concept anchoring biological theories. Disputes about viruses reveal genuine uncertainty about which features (metabolism, autonomy, etc.) should be central to that cluster. Similarly for Pluto - the planetary classification debate was really about whether our taxonomy should prioritize orbital dominance or historical conventions given new astronomical data.

  The trans woman case is trickiest because it involves both descriptive and prescriptive elements. Even with all biological facts agreed, the dispute persists because "woman" functions as what Sally Haslanger calls a "target concept" - it's not just describing but shaping social reality. The taboo test fails here because it can't capture how words constitute social kinds.

  My proposed solution will introduce two refinements to the taboo test: (1) the "systematic role" criterion (does the concept anchor a theoretical framework?), and (2) the "constitutive function" criterion (does the term perform world-shaping work?). This should cleanly separate the tomato/fruit case (purely lexical) from virus/alive (theoretical anchor) and trans woman (constitutive).

  For their unresolved cases: the vegetable tariff question would be substantive because the legal definition has real-world consequences; the math question is substantive as it concerns the grounding of abstract objects; the PVS case is substantive as it involves weighting biological criteria against functional ones in a normative context.

  I'll need to be honest that this approach still requires judgment calls about what counts as a "system" or "constitutive function," but that's preferable to pretending these distinctions don't exist. The user seems ready for that complexity given their frustration with oversimplified solutions.
answer: |-
  Here's a principled distinction that captures your intuitions while preserving the core insight of the taboo test, refined to handle the cases where purely factual agreement isn't the whole story. The key is recognizing that some concepts play **systematic, functional roles** within larger frameworks (scientific, social, legal, etc.), and disputes about their application can be substantive even when all non-linguistic facts are agreed upon, because they concern *how best to structure the framework itself*.

  **The Principle:**

  A dispute over the application of a term "T" is **merely verbal** **if and only if**:

  1.  **Factual Agreement & Taboo Success:** After tabooing "T," the disputants agree on *all* non-linguistic facts relevant to the features associated with "T," *and*
  2.  **Lack of Functional Role:** The disagreement does not involve a substantive question about *which concept best serves a specific functional role* within a systematic framework (scientific, social, legal, practical, normative) that relies on the term "T" to organize information, guide action, or constitute reality.

  A dispute is **substantive** **if** either:
  *   Condition (1) fails (there is genuine factual disagreement masked by the word "T"), **or**
  *   Condition (2) fails: Even with factual agreement, there is a substantive question about *which concept (or precisification) best fulfills the functional role* assigned to the term "T" within a relevant framework.

  **Why Condition (2) is Crucial & How It Applies:**

  *   **Captures "Real Question About the Line":** This addresses your virus and Pluto cases. The framework (biology, astronomy) *needs* the term ("life," "planet") to play a functional role (e.g., classifying objects based on shared properties relevant to the discipline). The disagreement centers on *which set of properties* best serves that functional role given the framework's goals (understanding origins/evolution of life, classifying solar system bodies).
  *   **Distinguishes High-Stakes Social Kinds:** This addresses the trans woman case. The framework is social ontology/identity. "Woman" plays a profound functional role in structuring social reality, rights, recognition, and lived experience. The disagreement is fundamentally about *which concept* (biological sex, gender identity, social role, or some mix) *best fulfills* the complex functional roles (recognition, respect, legal rights, social cohesion) assigned to the term "woman" *within society*. This isn't *just* about the word; it's about how we structure a fundamental social category.
  *   **Explains Why "Deserves the Word" Isn't Ad Hoc:** "Better deserves" isn't arbitrary; it's anchored in the *functional role the term plays within a specific framework*. For "fruit" in botany vs. culinary, the functional roles (scientific classification vs. taste/flavor grouping) are distinct and uncontested. For "life," "planet," or "woman," the functional role within the primary framework *is* contested and carries significant weight.
  *   **Preserves Verbal Verdicts:** For tomato (culinary context), hot dog, and falling tree, there *is* no substantive contest over the functional role of the term. We readily accept different roles in different contexts ("fruit" botanical vs. culinary), or the terms lack a deep functional role where the disagreement matters ("sound" as wave vs. experience; "sandwich" as a mostly playful category).

  **Applying the Principle to Your Cases:**

  1.  **Tomato (Fruit/Vegetable):** Merely Verbal. Agreement on facts (botanical structure, culinary use). No substantive dispute over functional role – we easily accept different roles in botany vs. cooking.
  2.  **Hot Dog (Sandwich):** Merely Verbal. Agreement on facts (bread, filling, handheld). Functional role of "sandwich" is loose and primarily playful/jocular; no significant framework relies on a precise boundary here.
  3.  **Falling Tree (Sound):** Merely Verbal. Agreement on facts (waves exist, no experience). "Sound" can function as either physical wave or perceptual experience in different contexts; no significant contest over which functional role is primary in a framework.
  4.  **Virus (Alive):** **Substantive.** Agreement on biological facts. Dispute centers on *which concept* (emphasizing metabolism/reproduction, or information/replication) *best serves the functional role* of "life" within biology – guiding research, understanding origins, classifying entities. The framework *needs* a coherent concept.
  5.  **Pluto (Planet):** **Substantive.** Agreement on orbital facts. Dispute centers on *which concept* (historical tradition vs. dynamical dominance) *best serves the functional role* of "planet" within astronomy – creating a useful classification system for solar system bodies. The framework's goals drive the disagreement.
  6.  **Trans Woman (Woman):** **Substantive.** Even with agreement on underlying biology/identity/social facts (a big "if" in reality), the dispute is fundamentally about *which concept best fulfills the complex functional role* of "woman" within the social/legal framework – roles involving recognition, rights, inclusion, and the very constitution of social identity. This is core to the framework.
  7.  **Free Will:** **Substantive.** Agreement on physics/determinism facts is possible. Dispute centers on *which concept* (ability to do otherwise vs. responsiveness to reasons/control) *best fulfills the functional role* of "free will" within normative frameworks (moral responsibility, personal agency, legal culpability, self-conception). The *point* of the concept is contested.

  **Applying to New Cases:**

  1.  **Is a tomato a vegetable for tariff purposes?**
      *   **Verdict:** **Substantive.** Agreement on botanical facts is irrelevant. The functional role of "vegetable" here is defined by a specific legal/regulatory framework (tariff schedules). The dispute is about how the legal concept *should be* defined or applied to achieve the framework's goals (fair trade, revenue, protecting domestic producers). The functional role within the legal system is key.
  2.  **Is mathematics discovered or invented?**
      *   **Verdict:** **Substantive.** Agreement on mathematical facts (e.g., 2+2=4). The dispute centers on *what functional role* the concepts "discovered" and "invented" play in our philosophical understanding of mathematics and abstract objects. Does "discovered" best capture the objective necessity and mind-independence? Does "invented" best capture the role of human cognition and notation? The disagreement is about which metaphor/concept best illuminates the nature of mathematical reality within philosophical ontology.
  3.  **Is someone in a Persistent Vegetative State (PVS) alive?**
      *   **Verdict:** **Substantive.** Agreement on physiological facts (e.g., brain stem function, no consciousness, bodily functions supported). Dispute centers on *which concept* of "life" or "alive" *best serves the functional role* within the relevant frameworks: medical (prognosis, treatment), legal (personhood, death declaration), ethical (withdrawal of care, moral status), theological (presence of a soul). The contest is over which criteria (biological integration, potential for consciousness, etc.) are essential to fulfilling the term's role in these high-stakes contexts.

  **Honest Assessment & Confidence:**

  *   **Confidence Level:** Moderately High (7/10). The core insight – that functional roles within frameworks create substantive disputes even post-taboo – is robust and captures your intuitions across the board without being ad hoc. It explains why "line-drawing" can be substantive (Pluto, virus) and why social identity disputes are deep (trans woman).
  *   **Least Sure Point:** The precise boundaries of a "framework" and its "functional role" can be fuzzy. Is "sandwich" part of a *formal* culinary taxonomy framework? Probably not, hence verbal. But could a chef argue there *is* a functional role in menu design? Maybe, making it slightly less clear-cut. Similarly, the "falling tree" case relies on there being no *significant* framework depending on a unified concept of sound. This requires judgment.
  *   **Verdicts Challenged:** The principle **validates all your initial verdicts.** Your intuition that the virus and Pluto cases are substantive, while tomato/hot dog/tree are verbal, is captured by the functional role criterion. Your strong sense that the trans woman and free will cases are substantive is also upheld.
  *   **Potential Cost:** The principle *does* mean that **whether a dispute is substantive can be context-dependent.** The same utterance ("Is X a Y?") might be merely verbal in one context (chatting about hot dogs) and substantive in another (designing a legal menu labeling requirement). This reflects reality but might feel messy to someone seeking absolute, context-independent answers.
  *   **What You Might Need to Overturn:** If you *wanted* to argue the tomato case was substantive for someone deeply invested in culinary taxonomy, the principle *could* accommodate it by recognizing a contested functional role *within that specific framework*. However, your intuition that it's clearly verbal likely stems from recognizing that the culinary framework *doesn't seriously contest* the functional roles of "fruit" vs. "vegetable" – they coexist. The principle explains this.

  **In essence:** The taboo test is necessary but insufficient. Substantive disputes persist when the contested term plays a functional role within a systematic framework, and the disagreement is about *how best to structure that role*, even after all underlying non-linguistic facts are agreed upon. This explains the depth of classification disputes in science, social ontology, law, and philosophy, while preserving the verdict for trivial or contextually unambiguous cases.
