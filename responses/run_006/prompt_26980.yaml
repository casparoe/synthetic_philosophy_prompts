prompt: |-
  ok so ive been obsessing over the judy benjamin problem lately — the one where you learn a conditional probability like "if im in the desert then p(enemy territory) = 0.5" and you need to update your whole joint distribution. the thing is every proposed rule (minimum cross-entropy, the various generalizations of jeffrey conditioning, etc.) gives different answers, and my advisor and i keep going in circles about which one is right. i realized what we actually need is to step back and write down the desiderata first. what does a theory of updating on conditional information have to *do* to count as adequate? what cases must it get right, what properties must it have (commutativity? consistency with standard conditioning as a special case? invariance under reparametrization?), and which of these are non-negotiable vs. just someones preference? im especially worried some of them might conflict — like maybe you cant have everything you want and theres a no-free-lunch result lurking. if you can flag which single desideratum knocks out the most popular proposals thatd help a lot. a table is fine.
