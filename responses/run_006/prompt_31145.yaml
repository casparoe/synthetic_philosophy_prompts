     - In the self-play, the CliqueBot will cooperate with itself because the public string is the same.

     - We hope that someone will realize: "I can set my public string to be the same as a known bot (like 'Clique123') and then cooperate with them, but then the known bot might not cooperate with me because my public string is not 'Clique123'? -> only if they are using the exact string comparison.

     - This activity will show that program equilibrium allows for cooperation, but only if the programs are coordinated in advance on how they will recognize each other.

  ### 4. What might go wrong?
     - Everyone might write a defect bot -> then we see no cooperation. To mitigate, we can seed with a cooperate bot and a clique bot to show that cooperation is possible.
     - They might not think of the conditioning on the public string. We can give a few examples orally: "Some of you might want to only cooperate with others that have the same public string as you."
     - The activity might run over time. We have to keep it to 30 minutes for the program round.

  ### 5. Debrief
     - What happened in the standard PD? Defection dominated.
     - What happened in the program version? Hopefully, we saw cooperation in some cases.
     - Why? Because the programs could condition their behavior on the opponent's "type" (via the public string) and thus could avoid being exploited by defectors and could cooperate with cooperators.
     - The equilibrium concept: in program equilibrium, there exist strategies such as the clique bot that form a Nash equilibrium: if both are playing the clique bot with the same string, then neither has an incentive to change (because if they change, they might defect and get less). But note: if everyone is playing clique bot with the same string, then a mutant that defects against everyone would do better? 
          - In a tournament of many strategies, the mutant would do well against non-clique strategies but would get 1 against other mutants and 0 against clique bots? It's not necessarily an equilibrium in isolation.
     - What is settled: in the setting where programs can read each other's source code, there exist equilibria that yield cooperation in the one-shot PD. For example, the "clique" equilibrium where both programs are identical and cooperate only with their own type.
     - What is contested: 
          - How to achieve such coordination in practice? The programs have to be written in advance to recognize each other. 
          - Also, the potential for adversarial programs that try to mimic the public string of a cooperator to exploit them? (But in our setting, the public string is chosen arbitrarily and there is no limit on length, so they can choose a very long random string to avoid mimicry.)
          - The general problem of program equilibrium in games with more than two players or more complex games.
          - The computational overhead and the halting problem (which we avoided by not allowing simulation).

  ### 6. Structure of the session

  - 5 min: Introduction to PD and the standard matrix.
  - 10 min: Standard PD round (each plays 3 others, pre-assigned).
  - 5 min: Show results and leaderboard. Discuss why defection is dominant.
  - 5 min: Introduce the program round: explain the public string and function interface. Show examples (CooperateBot, DefectBot, CliqueBot).
  - 20 min: They write their strategies (public string and function) and submit (via a form or a shared board). Meanwhile, you set up the tournament runner in Python (or if you have a script ready, run it).
  - 10 min: Run the tournament (hopefully quick with 15+3=18 strategies, that's 18*18=324 matches, which is doable in Python quickly). Show the leaderboard and also highlight interesting matches (e.g., when two clique bots with the same string met and cooperated).
  - 5 min: Debrief: connect to program equilibrium and discuss the settled vs contested aspects.

  ### 7. Tournament runner code

  We can write a Python script like:

  ```python
  import itertools

  # Payoff matrix
  def payoff(a1, a2):
      if a1 == 'C' and a2 == 'C':
          return (3, 3)
      elif a1 == 'C' and a2 == 'D':
          return (0, 5)
      elif a1 == 'D' and a2 == 'C':
          return (5, 0)
      else: # both defect
          return (1, 1)

  # Define the fixed strategies
  fixed_strategies = [
      {
          'name': 'CooperateBot',
          'public_string': 'Cooperate',
          'function': lambda opponent_string: 'C'
      },
      {
          'name': 'DefectBot',
          'public_string': 'Defect',
          'function': lambda opponent_string: 'D'
      },
      {
          'name': 'CliqueBot',
          'public_string': 'Clique123',
          'function': lambda opponent_string: 'C' if opponent_string == 'Clique123' else 'D'
      }
  ]

  # Participant strategies: we'll collect in a list
  # Each participant strategy is a dict: {'name': 'Bob', 'public_string': '...', 'function': lambda s: ...}

  participant_strategies = []   # to be filled

  # Combine
  all_strategies = fixed_strategies + participant_strategies

  # Initialize scores: dict from strategy name to total score
  scores = {s['name']: 0 for s in all_strategies}

  # Run the tournament: every strategy plays against every other strategy (including fixed and including themselves)
  for s1, s2 in itertools.product(all_strategies, repeat=2):
      # Get actions
      a1 = s1['function'](s2['public_string'])
      a2 = s2['function'](s1['public_string'])
      # Get payoffs
      p1, p2 = payoff(a1, a2)
      # Add to scores
      scores[s1['name']] += p1
      scores[s2['name']] += p2

  # Print the scores sorted
  sorted_scores = sorted(scores.items(), key=lambda x: x[1], reverse=True)
  print("Leaderboard:")
  for name, score in sorted_scores:
      print(f"{name}: {score}")
  ```

  ### 8. How to collect participant strategies?

  We can have them write their strategy as a Python function in a Jupyter cell or on a piece of paper and then we input it into the script. Or we can have a Google Form where they write the public string and the function as an expression (like in a string) and then we use `eval` (carefully). 

  But since it's a controlled environment, we can have them submit by writing:

     name: "Alice"
     public_string: "Alice's string"
     function: 
          def alice_function(opponent_string):
              if opponent_string == "Alice's string":
                  return 'C'
              else:
                  return 'D'

  Then we copy-paste into the script.

  ### 9. What if they write a function that doesn't return 'C' or 'D'?
     - We can add a try-except and if it returns something else, we treat it as defect? Or we can validate.

  ### 10. What if they write a function that has side effects or is slow?
     - We trust them because it's a small group.

  ### 11. To save time, we can provide a web-based form that lets them submit their public string and a choice of function from a set of options? But that might not be as creative.

  Given the time, I think the above plan is feasible.

  Summary of the activity:

  1. Play standard PD (5-10 min).
  2. Explain the program round with the public string and function interface (5 min).
  3. They write their strategies (20 min) and submit.
  4. Run the tournament and show results (10 min).
  5. Debrief (5 min).

  We hope to see at least some cooperation in the program round, especially in self-play of clique-like strategies and when they coordinate on a common string.

  If nothing interesting happens (everyone defects), then in the debrief we can point out that in the program equilibrium setup, cooperation is possible but not inevitable. It requires coordination at the program level. We can then discuss how such coordination might arise (e.g., through evolution, convention, or pregame communication).

  This should be within 60 minutes.
answer: |-
  ### Program Equilibrium Discovery Activity for Software Engineers  
  **Goal:** Experience how program equilibrium enables cooperation in the Prisoner's Dilemma (PD) through hands-on coding.  

  ---

  #### **Phase 1: Standard Prisoner's Dilemma (10 min)**  
  **Rules:**  
  - **Payoff Matrix:**  
    ```
            Player 2  
          C       D  
        +-------+-------+  
    P1 C | 3, 3  | 0, 5  |  
        +-------+-------+  
    P1 D | 5, 0  | 1, 1  |  
        +-------+-------+  
    ```  
  - **Rounds:** Each participant plays against 3 others (assigned randomly).  
  - **Choice:** Secretly submit "C" (Cooperate) or "D" (Defect) for each opponent.  
  - **Scoring:** Points calculated using the matrix. **Leaderboard** displayed for bragging rights.  

  **Expected Outcome:** Most defect, proving the Nash equilibrium (D,D) in standard PD.  

  ---

  #### **Phase 2: Program Equilibrium (35 min)**  
  **Twist:** Players submit *programs* (Python functions) that decide C/D based on the opponent’s function.  

  **Rules & Setup:**  
  1. **Function Interface:**  
     ```python
     def my_strategy(opponent_function: callable) -> str:  # Returns "C" or "D"
         # Your logic here (use opponent_function as needed)
     ```  
     Example submissions:  
     ```python
     def always_defect(_) -> str: return "D"  
     def tit_for_tat(opponent_func) -> str: return opponent_func(always_defect)  # Not real TfT!  
     ```  

  2. **Tournament Structure:**  
     - Each program plays every other program (including itself) once.  
     - **Recursion Limit:** Enforce a `max_depth=5` to prevent infinite loops (see "Handling Edge Cases" below).  
     - **Runner Code:**  
       ```python
       def run_match(strategy1, strategy2, max_depth=5, _depth=0):
           if _depth >= max_depth:  # Break infinite recursion
               return "D", "D"  # Default to mutual defection
           return strategy1(strategy2), strategy2(strategy1)
       ```  

  3. **Scoring:**  
     - Same payoff matrix as Phase 1.  
     - **Leaderboard** ranks programs by total points.  

  **Facilitation:**  
  - Demo simple strategies: `always_defect`, `always_cooperate`.  
  - Hint: "What if your program checks what the opponent would do *against you*?"  
  - Let participants iterate (10 min coding, 5 min testing).  

  ---

  #### **Predictable Edge Cases & Solutions**  
  1. **Infinite Loops:**  
     - Programs like `def loop(opp): return opp(opp)` will hit `max_depth` → return ("D", "D").  
     - **Mitigation:** Warn participants upfront and enforce recursion limits.  

  2. **All-Defect Scenario:**  
     - If everyone submits `always_defect`, introduce a **secret cooperator bot**:  
       ```python
       def cooperator_if_clone(opponent_func):  
           # Cooperate only if opponent is identical to me  
           return "C" if opponent_func == cooperator_if_clone else "D"
       ```  
     - **Debrief Hook:** Ask, "How could you *guarantee* mutual cooperation without coordination?"  

  3. **Malformed Outputs:**  
     - Treat non-"C"/"D" outputs as "D".  

  ---

  #### **Debrief (15 min)**  
  1. **What Happened?**  
     - In standard PD: Mutual defection dominated.  
     - In program round:  
       - Some programs achieved mutual cooperation (e.g., clones that check `opponent_func == my_function`).  
       - Key insight: Programs can enforce commitments by simulating opponent behavior.  

  2. **Mapping to Theory**  
     - **Mathematically Settled:**  
       - Program equilibria *exist* (e.g., two `cooperator_if_clone` programs cooperate in one-shot PD).  
       - Strictly expands Nash equilibria by allowing mutual conditionality.  
     - **Contested Issues (Active Research):**  
       - **Coordination Problem:** How do programs "agree" on strategies without pre-play communication?  
       - **Adversarial Code:** What if opponents use obfuscation, randomness, or simulation traps?  
       - **Turing-Complete Challenges:** Undecidability (halting problem) limits real-world applications.  

  3. **Discussion Prompts:**  
     - "How is this different from repeated games?" (No history—cooperation emerges from code, not iteration.)  
     - "Could this work in decentralized systems? What are the trust assumptions?"  

  ---

  #### **Materials & Logistics**  
  - **Projector:** Show rules, matrix, and live leaderboards.  
  - **Code Submission:** Use a shared Colab notebook, Google Form, or pastebin.  
  - **Pre-Built Runner:** [Here’s a Python script](https://gist.github.com/.../) to run the tournament automatically.  
  - **Backup Plan:** If coding runs long, provide starter templates (e.g., `cooperator_if_clone`) to ensure discovery.  

  By making participants *build* strategies, they’ll viscerally grasp why program equilibrium changes the game—literally!
