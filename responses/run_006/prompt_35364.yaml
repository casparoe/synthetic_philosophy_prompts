  My friend has these wierdly specific views about what counts as alive and I've been keeping a list. Here's what she's said so far:

  - A bacterium: alive
  - A virus (like influenza): not alive
  - A prion: not alive
  - A candle flame: not alive
  - A crystal growing in solution: not alive
  - A mule: alive
  - A person who's brain-dead but on a ventilator: alive
  - A seed sitting in a seed bank, still viable after 30 years: alive
  - A self-replicating RNA molecule in a test tube (the kind they use in origin-of-life experiments): not alive
  - A red blood cell: not alive

  I'm about to ask her about a mitochondrion — you know, the organelle that used to be a free-living bacterium, has its own DNA, runs its own metabolism, and divides by fission inside the cell, but can't survive outside it anymore.

  Before I actually ask her, I want to figure out what she's going to say. What's the rule she seems to be running, and are there other rules that fit all her verdicts just as well? Do they agree on the mitochondrion or not? If they disagree, what's your best guess about which one she's actually using, and what further case would settle it definitively? Also, which of her existing verdicts is the closest analog to the mitochondrion — the one that should most shape what she says?
