prompt: |-
  I keep going around in circles on this and I'd like someone to cash it out properly. International law has a two-track setup for war. Track one: waging aggressive war is a crime, the aggressor state is doing something legally very wrong, and the people who plan and order it can be prosecuted for it. Track two: the individual soldier on the aggressor side, if they follow the laws of war — wear a uniform, only target combatants, don't torture prisoners, that sort of thing — can lawfully kill enemy soldiers and is not treated as a murderer or as an accomplice to the aggression. And a soldier on the just side has exactly the same permissions and prohibitions. The official story is that the justice of the war and the rules governing the fighting go in seperate boxes, and that the boxes are symmetric across both sides.

  What I want to know is what theory of soldiers' moral responsibility this practice actually presupposes. Specifically: does it presuppose the "moral equality of combatants" — the idea that a soldier fighting an unjust war and a soldier fighting a just war are morally on a par in what they may do — or does it only presuppose something weaker, like a pragmatic convention that can't function unless it's symmetric? I'm also stuck on the asymmetry: we're willing to criminalize the leaders who order the war but not the ordinary people who carry it out. That seems to presuppose something about what soldiers are in a position to know or judge, but I can't tell whether the law needs that claim or just finds it convenient.

  Reconstruct the implicit theory for me. Give me the strongest version of what the practice has to be committed to, not just what it's compatible with, and be honest about where the practice is underdetermined — where several different philosophical views could underwrite the same rules. Then tell me what would actually have to change in how soldiers are treated if you swapped in the view that unjust combatants do wrong and are blameworthy for fighting. Dont give me citations or a reading list; I want the philosophical reconstruction, and I don't care whether you can name the legal instruments.

  Formatting thing: lead with your bottom line in the first sentence, then give the reasoning. No preamble, no restating my question.
reasoning: |-
  Hmm, the user is asking about the philosophical underpinnings of international law regarding war, specifically the moral responsibility of soldiers. They're struggling with the apparent contradiction between criminalizing aggressive war leaders while treating combatants on both sides symmetrically under the laws of armed conflict. They want me to reconstruct the implicit theory behind this practice, identify what the law must be committed to, and explore how things would change if unjust combatants were considered morally blameworthy.

  The user clearly understands the legal framework well—they've described the two-track system accurately with jus ad bellum (justice of going to war) and jus in bello (conduct during war) operating independently. Their core confusion revolves around whether this structure presupposes moral equality of combatants or just pragmatic symmetry. They're also questioning the leader/soldier asymmetry in culpability.

  I need to dig into the philosophical commitments. The strongest version the practice must embrace is a sharp separation between jus ad bellum and jus in bello. This isn't just convenience—it's foundational. The law absolutely requires that soldiers' permissions to kill don't depend on which side is "just," otherwise the entire framework collapses. We see this in how POW status and combatant immunity work identically for both sides.

  The asymmetry in prosecuting leaders but not soldiers reveals key presuppositions: soldiers are seen as non-voluntary agents executing state policy, lacking both the authority to judge war's justice and reasonable alternatives to participation. This excuses them from ad bellum responsibility while holding them accountable only for in bello violations.

  The practice is underdetermined regarding why soldiers should follow in bello rules when fighting unjust wars—it could be based on independent moral reasons or purely instrumental concerns about reciprocity. It's also silent on whether soldiers have deeper moral duties beyond legal compliance.

  If we swapped in the view that unjust combatants are morally blameworthy, everything would change: we'd deny them POW status, treat their killings as murder, and prosecute them for participation. This would destroy reciprocity in warfare and make humanitarian protections unworkable. The current system fundamentally depends on not making individual morality contingent on collective justice.

  I'll structure my response by first stating the bottom line as requested, then unpacking the necessary commitments, the underdetermined aspects, and finally the consequences of adopting moral inequality. The user wants philosophical reconstruction, not legal citations, so I'll keep it conceptual and rigorous while maintaining their requested formatting.
answer: |-
  The practice presupposes a strict separation between *jus ad bellum* (justice of resorting to war) and *jus in bello* (justice in the conduct of war), coupled with the view that soldiers are non-judgmental instruments of state policy, not morally responsible agents for the war's initiation.

  **Necessary Commitments:**
  1.  **Combatant Equality is Legally Fundamental:** The practice *must* presuppose the *legal* equality of combatants regarding *jus in bello*. Soldiers on both sides possess identical legal permissions (to kill enemy combatants) and obligations (to follow the laws of war). This symmetry isn't merely pragmatic; it's foundational. Denying this equality would collapse the distinction between combatant and criminal for one side, destroying the entire framework of regulated warfare.
  2.  **Soldiers as Non-Voluntary Agents:** The leader/soldier asymmetry presupposes that ordinary soldiers lack both the *authority* and the *practical capacity* to judge the *jus ad bellum* of the war they fight. They are seen as executing state policy, not making an independent choice to initiate aggression. Their primary domain of responsibility is limited to their immediate conduct (*jus in bello*).
  3.  **Pragmatic Necessity of Reciprocity:** While the separation of *ad bellum* and *in bello* is principled, the *symmetric application* of *in bello* rules relies heavily on pragmatic reciprocity. The system only functions if both sides believe the other will (or must) follow the same rules. Asymmetry would incentivize disregarding *in bello* constraints entirely ("Why follow rules if the enemy sees us as criminals anyway?").

  **Underdetermined Aspects:**
  1.  **Deep Moral Equality vs. Moral Excuse:** The practice *does not necessitate* the philosophical view that soldiers on the unjust side are morally equal to just combatants. It is equally compatible with:
      *   **Moral Equality:** Killing combatants is morally permissible for any soldier fighting in a war, regardless of the war's justice.
      *   **Moral Excuse:** Soldiers fighting an unjust war commit a *prima facie* moral wrong (killing) but are excused due to non-culpable ignorance of the war's injustice, duress, lack of reasonable alternatives, or their role as agents of the state. The law shields them from liability, but this doesn't affirm their moral innocence.
      *   **Pragmatic Convention:** The symmetry is *only* a necessary legal fiction for maintaining minimal humanitarian standards in war, devoid of deeper moral claims about the permissibility of killing for the unjust side.
  2.  **Basis of *Jus in Bello* Obligation:** Why *should* an unjust combatant follow *in bello* rules? The practice doesn't specify. Possible justifications include:
      *   Independent moral duties (minimizing suffering).
      *   Reciprocal self-interest.
      *   Fulfilling a professional role.
      *   Avoiding personal criminal liability.

  **Consequences of Adopting Moral Inequality/Blameworthiness:**
  If the law treated unjust combatants as morally blameworthy for participating and killing enemy soldiers (even while following *in bello* rules), the entire current framework would collapse:
  1.  **Loss of Combatant Immunity:** Unjust combatants could no longer claim immunity from prosecution for lawful acts of war (killing enemy combatants). Every such act would be legally treated as murder or manslaughter.
  2.  **Denial of POW Status:** Captured unjust combatants would not qualify as Prisoners of War entitled to specific protections. They would be treated as criminals or unlawful combatants.
  3.  **Erosion of *Jus in Bello* Constraints:** Unjust combatants would have no incentive to follow *in bello* rules (like distinguishing combatants/civilians) if they are already deemed criminals. Just combatants would feel justified in treating unjust combatants more harshly.
  4.  **Reciprocity Destroyed:** The symmetric application crucial for maintaining humanitarian standards would vanish. Each side would view the other's fighters as criminals, legitimizing maximal force and cruelty.
  5.  **Shift in Prosecution Focus:** Legal efforts would massively expand to prosecute vast numbers of ordinary soldiers for participation in an illegal war and killings therein, alongside leaders.
  6.  **Practical Unworkability:** Identifying individual blameworthiness for *ad bellum* participation among potentially millions of conscripted or misled soldiers would be impossible, leading to arbitrary or vindictive justice. Warfare would revert to a far less regulated, more brutal state.
