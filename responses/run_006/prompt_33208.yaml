prompt: |-
  In my biology class we've been studying the handicap principle — the idea that some animal signals are honest because they're costly to produce, so only high-quality individuals can afford them. My teacher has been giving us cases and ruling on whether each counts as a costly signal in the Zahavian sense. Here are her verdicts so far:

  Peacock's tail: yes. It's a handicap that only healthy males can sustain, and it serves no function beyond attracting mates.
  Gazelle stotting — jumping high when a predator approaches: yes. It wastes energy and honestly demonstrates that the gazelle is fit enough to escape.
  The bright warning coloration of a poison dart frog: no. That's aposematism, not a signal of individual quality — it works through predator learning, not through differential cost.
  A stag's antlers: yes. They're costly to grow and are used in display to signal fighting ability.
  The long tail of a male widowbird: yes. A classic costly signal of mate quality.
  Courtship feeding in birds, where a male brings food to a female: no. It's a direct material benefit, not a signal of quality through waste.

  Next week we're discussing a new case: a species of reef fish where males build elaborate nests from algae and shell fragments. Larger, more complex nests attract more females, and building a big nest is energetically demanding — healthier males build bigger ones. But the nest also directly protects the eggs from predators after spawning.

  I'm less interested in the yes-or-no answer itself than in figuring out what rule my teacher is actually running. I can see at least two principles that fit all her verdicts so far. One says a costly signal must involve genuine waste — the cost can't serve a practical function beyond signaling. The other says the cost just has to be differentially affordable by high-quality individuals, even if the costly trait also happens to be useful. The fish nest case would split them. Which rule do you think she's using, what would each rule predict about the nest, and what further case would settle the question if this one doesn't?
reasoning: |-
  Okay, let me try to figure out what's going on here. The student is in a biology class studying the handicap principle. Their teacher has given several examples and judged whether each counts as a costly signal in the Zahavian sense. The student wants to understand the underlying rule the teacher is using, especially since they see two possible principles that fit the verdicts so far. They also have a new case about reef fish nests to analyze.

  First, I need to review the teacher's verdicts on the existing cases. The peacock's tail is a yes because it's costly and only serves to attract mates. Gazelle stotting is a yes—it wastes energy and signals fitness. The poison dart frog's bright colors are no; that's aposematism, not a signal of individual quality. Stag antlers are yes, costly and used for display. The male widowbird's long tail is yes, a classic costly signal. Courtship feeding is no because it's a direct benefit, not wasteful signaling.

  The two principles the student is considering are: 1) genuine waste (no practical function beyond signaling) vs. 2) differential affordability even if the trait is useful. The reef fish nest case has both signaling and practical benefits (egg protection). So which rule is the teacher using?

  Looking at the "no" verdicts: poison dart frog colors are aposematism, which warns predators but doesn't signal individual quality—it's about species-level defense, not differential cost among individuals. Courtship feeding provides direct nutrition, so it's not wasteful; the female benefits materially. 

  The "yes" cases all involve traits that are costly and don't have survival utility beyond signaling. The peacock's tail is cumbersome, stotting wastes energy, antlers are heavy and used for display, the widowbird's tail is impractical. Even though antlers can be used in fights, their primary role in signaling is separate from any utility. 

  The key seems to be whether the cost is purely for signaling or if it has a survival/utility function. The teacher's "no" for courtship feeding and aposematism supports the idea that if there's a direct benefit, it's not a Zahavian signal. Aposematism benefits all toxic frogs equally, not based on individual quality. Courtship feeding is a direct transfer of resources.

  For the reef fish nest, if the teacher uses the "genuine waste" rule, the nest's protective function would make it a "no". If it's "differential affordability", the nest could be a "yes" because healthier males can build bigger ones, even with the utility. 

  But based on the courtship feeding example (direct benefit = no), and the nest providing egg protection (direct benefit), the teacher would likely say "no" to the fish nest being a Zahavian signal. To confirm, a case where a costly trait signals quality but also has utility, like antlers used in combat, might need clarification. Since the teacher said yes to antlers, perhaps combat utility is seen as part of the signaling. But the nest's protection is a separate benefit. 

  A test case could be a trait with both signaling and survival utility, like deer antlers used in fights. The teacher already said yes to antlers, so maybe combat is considered part of the display. Another test case could be a bird's song that attracts mates but also deters predators. If the teacher says no because of the dual function, that confirms the waste principle. If yes, it's differential affordability.
answer: |-
  Based on your teacher's pattern of verdicts, she is applying the **"genuine waste" rule**. Here's the reasoning, the prediction for the reef fish nest, and a test case to confirm:

  ### The Rule: Genuine Waste (No Practical Survival/Reproductive Benefit Beyond Signaling)
  *   **Evidence for this rule:**
      1.  **Peacock's tail (Yes):** Explicitly stated to serve "no function beyond attracting mates."
      2.  **Gazelle stotting (Yes):** Characterized as "wast[ing] energy" to demonstrate fitness, implying no immediate survival benefit from the jump itself.
      3.  **Poison dart frog (No):** Rejected *because* it has a practical function (aposematism via predator learning). The cost (being conspicuous) serves a direct survival purpose.
      4.  **Stag's antlers (Yes):** While *used* in display/fighting (signaling context), the verdict focuses on the *cost* to grow them as the handicap. Crucially, the cost itself (growing large antlers) isn't framed as *providing* a survival benefit *beyond* signaling fighting ability. The benefit *comes from* the signal deterring rivals/attracting mates, not from the antlers *themselves* being useful for something else like foraging.
      5.  **Widowbird tail (Yes):** Presented as a classic costly signal without mention of any other utility.
      6.  **Courtship feeding (No):** Rejected *because* it provides a "direct material benefit." The cost (energy/foraging time) serves a practical purpose (feeding the female), not just signaling.

  *   **Key Principle:** A trait is a Zahavian costly signal **only if the cost itself is "wasted"** - it doesn't simultaneously confer a direct survival or reproductive advantage *independent* of its role as a signal of quality. The cost must be *purely* or *primarily* an investment in advertising quality. If the costly act or structure provides a significant *immediate* practical benefit (like defense, nutrition, or predator deterrence), it's not considered a genuine handicap signal under this rule.

  ### Prediction for the Reef Fish Nest (Using the Genuine Waste Rule)
  *   **Verdict: No.** The nest building involves significant energetic cost (handicap aspect) and healthier males build bigger/better nests (differential affordability). However, the nest also provides the **direct, practical benefit of protecting the eggs** from predators after spawning. This direct survival function for the offspring disqualifies it as a *purely* wasteful Zahavian signal under your teacher's apparent rule. While signaling mate quality is one function, the cost also buys a direct material benefit (nest protection).

  ### The Alternative Rule (Differential Affordability Only) & Why It Doesn't Fit
  *   **Rule:** A trait is a costly signal if the cost is differentially affordable by high-quality individuals, *regardless* of whether the costly trait also provides a practical benefit.
  *   **Why it doesn't fit the teacher's verdicts:**
      1.  **Poison Dart Frog:** The cost (being conspicuous) *is* differentially affordable (only toxic individuals can afford it). This rule would predict a "Yes," but your teacher said "No."
      2.  **Courtship Feeding:** The cost (foraging effort/time) *is* differentially affordable (higher quality males can afford more/better food). This rule would predict a "Yes," but your teacher said "No."
  *   **Prediction for Fish Nest (under this rule):** Yes. The cost is differentially affordable (healthier males build bigger nests), signaling mate quality, even though the nest also protects eggs.

  ### A Test Case to Settle the Question
  If the reef fish nest verdict doesn't definitively confirm the rule, propose this case:

  *   **The Case:** "Deep croaks in male frogs. Lower-frequency croaks are more attractive to females but are also more energetically costly to produce. Only larger, healthier males can afford to produce the deepest croaks. Crucially, deeper croaks also travel further through dense vegetation, allowing males to advertise their presence over a wider area to more potential mates *and* rivals."

  *   **How it Splits the Rules:**
      *   **Genuine Waste Rule:** Likely **No.** The cost (energy for deep croaking) provides a *direct practical benefit*: increased broadcast range. This improves mate attraction *and* rival deterrence *functionally*, not just as a signal of quality. The benefit isn't purely from advertising quality through waste; the cost buys effective communication range.
      *   **Differential Affordability Rule:** **Yes.** The cost is differentially affordable (only high-quality males can do it best), making it an honest signal of quality, *even though* the costly trait (deep croaking) also has the practical benefit of increased range.

  *   **Why it's a Good Test:** It mirrors the core conflict: a costly trait that signals individual quality *and* provides a direct functional advantage related to the signaling context itself (like the fish nest's protection), making the "waste" aspect ambiguous. Your teacher's verdict would clearly reveal her underlying principle. If she says "No," it confirms the Genuine Waste rule. If she says "Yes," it supports the Differential Affordability rule.
