answer: |-
  Okay, this is a classic Dennettian debate, and your frustration is understandable. "Center of narrative gravity" is a powerful metaphor, but its ambiguity allows for significant slippage, which your friend seems to have exploited. Let's break down the distinct claims this phrase *could* make, ranging from trivial to radical, and see how they hold up under scrutiny.

  **The Core Metaphor:** Think of gravity. The "center of gravity" of an object isn't a *thing* you can touch; it's a useful mathematical point we use to predict how the object *as a whole* will behave. Similarly, Dennett argues the "self" isn't a little homunculus inside your head; it's a useful *abstraction* we posit based on the complex, ongoing narrative we (and others) construct about the entity that is *this particular human organism*.

  Here are the distinct readings:

  1.  **Reading 1: Humans are Storytelling Creatures (The Trivial Reading)**
      *   **Claim:** Human beings naturally generate narratives about their experiences, motives, actions, and place in the world. We tend to position a central character ("I") within this narrative.
      *   **Platitude/Defensible?** Platitude. This is uncontroversially true. Psychology, anthropology, and literature all confirm we are narrative-making beings.
      *   **Existence:** Doesn't speak to the *ontological status* of the self at all. It just says we tell stories with a protagonist.
      *   **Persistence:** Doesn't imply anything specific about self-persistence beyond the persistence of the storytelling capacity.
      *   **Consciousness:** Doesn't explain consciousness; it assumes a conscious narrator.
      *   **Friend's Dodge?** Useless for him. This doesn't answer your questions about existence or persistence. If he falls back to this, he's admitting he's saying nothing substantial.

  2.  **Reading 2: The Self *is* the Narrative (The Strong Narrative Identity Reading)**
      *   **Claim:** There is no "self" *behind* the narrative. The self *just is* the ongoing, dynamic story being told – by the brain, the individual, and the surrounding culture. It's the *content* and *structure* of that narrative that constitutes the self.
      *   **Platitude/Defensible?** Defensible (but controversial). This is a core Dennettian view. It rejects any persistent inner essence or Cartesian theater. The self is a process, not a thing.
      *   **Existence:** The self "exists" in the same way a novel's plot or a nation's history exists: as a complex pattern of information, interpretation, and representation. It's real *as a pattern*, but not as a fundamental substance or entity. **(This aligns with "abstraction, not illusion").**
      *   **Persistence:** Persistence is narrative continuity. You are the "same self" as long as your current narrative can be reasonably seen as a continuation of past narratives (even with revisions). There's no "inner thing" persisting; it's the story that persists and evolves. **(This aligns with "persisting inner thing is a fiction").**
      *   **Consciousness:** Consciousness *involves* this narrative process, but isn't identical to it. Consciousness is more like the dynamic *generation* of the narrative stream.
      *   **Friend's Dodge?** **This is likely the core reading he *needed* to use consistently but probably didn't.** It does the heavy lifting: explaining why we *feel* like a self (the narrative gravity), denying a persisting Cartesian ego, while affirming we exist as complex biological entities generating narratives. However, it requires accepting that "you" are fundamentally a story, which feels counterintuitive.

  3.  **Reading 3: The Self is an Illusory Byproduct (Eliminativist Lite)**
      *   **Claim:** The narrative process happens, but the *feeling* that there's a central, unified, persistent "I" *experiencing* or *authoring* the narrative is a *mistake*. The brain constructs the narrative *and* constructs the illusion of a narrator/experiencer as part of it. "Center of narrative gravity" names the *function* this illusion serves (organizing behavior, simplifying explanation) but confirms the self *as felt* isn't real.
      *   **Platitude/Defensible?** Defensible (highly controversial). This pushes Reading 2 further. Dennett often flirts with this but usually pulls back to "abstraction" to avoid outright eliminativism about the self *as a useful concept*. Some interpretations of Buddhism or Thomas Metzinger lean this way.
      *   **Existence:** The self *as commonly conceived* (unified inner experiencer/agent) does not exist. It's an illusion generated by the narrative process.
      *   **Persistence:** Any sense of persistence is part of the illusion. There's only the sequential production of narrative moments creating the *appearance* of continuity.
      *   **Consciousness:** Consciousness includes this illusory sense of self as an intrinsic feature.
      *   **Friend's Dodge?** He *explicitly denied* this ("not an illusion"). If he slipped into this reading when pressed on persistence ("fictional inner thing"), he contradicted his own denial of illusion. It *could* dodge persistence questions by calling it all illusory, but he ruled it out.

  4.  **Reading 4: The Self is a Useful Fiction for Prediction (The Instrumentalist Reading)**
      *   **Claim:** Regardless of any underlying reality, treating the human organism *as if* it had a central self (a center of gravity) is incredibly useful for predicting its behavior, coordinating social interaction, assigning responsibility, and making sense of our own internal states. It's a "fiction" only in the sense that it's a simplifying model, not a description of fundamental ontology. It's like using "countries" in geopolitics – real patterns with real consequences, but not irreducible entities.
      *   **Platitude/Defensible?** Defensible. This is pragmatically strong and aligns well with Dennett's "intentional stance" (treating systems *as if* they have beliefs/desires to predict them).
      *   **Existence:** The self exists as a *real pattern* or *useful explanatory construct*, not necessarily as a fundamental substance. **(Matches "abstraction, not illusion").**
      *   **Persistence:** Persistence is defined by the continuity of the *pattern* we model as a self. The organism changes, the narrative changes, but the model remains useful for tracking *this specific trajectory*. The "inner thing" is fictional only if you insist it must be a *simple, immutable substance*; the *persistence of the complex pattern* is real. **(This reconciles "you exist" with "persisting inner thing is a fiction" - the fiction is the simplistic *conception* of the inner thing).**
      *   **Consciousness:** Doesn't directly explain consciousness, but the self-model is a key part of *what it's like* to be conscious for us.
      *   **Friend's Dodge?** **This is the most charitable and consistent reading *if* he wants to affirm existence while denying simplistic persistence.** It explains why "you exist" (as a real, complex biological pattern we usefully model as a self) and why the "persisting inner thing" is a fiction (if that "thing" is imagined as a simple soul or immutable ego). The phrase "center of narrative gravity" perfectly captures this: the narrative generates the point around which we organize our understanding of the entity.

  **Which Reading Was Your Friend Using (and Abusing)?**

  *   **He *wanted* Reading 4's existence claim ("abstraction, not illusion")** to assure you "you exist."
  *   **He *wanted* Reading 2's persistence claim ("persisting inner thing is a fiction")** to sound radical and Dennettian.
  *   **He likely conflated these and slipped into Reading 3 ("illusion") territory when pressed,** especially on persistence, despite denying it earlier.

  **The Slippage & Why It Felt Like Cheating:**

  1.  **Existence Dodge:** By saying "abstraction, not illusion," he invoked Reading 4 (or Reading 2) to sound like he wasn't denying your existence. But when pressed, he likely didn't clarify *how* an abstraction exists or what it commits him to.
  2.  **Persistence Dodge:** By saying the "persisting inner thing is a fiction," he jumped to the radical conclusion of Reading 2/3, *implying* that *all* persistence is fictional, without explaining how Reading 4 *allows* for a defensible notion of narrative/pattern persistence that isn't based on a "thing."
  3.  **The Magic Phrase:** He used "center of narrative gravity" as a conversation stopper because it *sounds* profound and seems to cover all bases (story = narrative; center = self; gravity = importance/reality). But its ambiguity let him shift readings: it could mean the *process* of narration (Reading 2), the *usefulness* of the model (Reading 4), or even the *illusion* of centrality (Reading 3) – whichever deflected your specific objection at the moment.

  **Conclusion:**

  The **defensible core** (Readings 2 & 4) says: There is no *Cartesian ego* – no immutable, simple, inner soul-thing. What we call the "self" is a complex, dynamic, biologically-grounded *process* of narrative generation and self-modeling. This process is real, it has causal power, and the "self" abstraction is incredibly useful for understanding ourselves and others. Persistence is narrative/pattern continuity, not substance continuity.

  **Your friend's error** was likely inconsistently applying this. He wanted the comfort of "you exist" (pattern/abstraction) without fully embracing its implications, and the radical thrill of "no persisting inner thing" without carefully distinguishing it from "no persistence at all." "Center of narrative gravity" became his semantic Swiss Army knife, letting him switch tools whenever one blade got dull. The phrase itself is powerful, but it demands precision to avoid becoming a rhetorical smokescreen.
