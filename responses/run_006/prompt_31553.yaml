  First, I need to unpack Dennett's metaphor. "Center of narrative gravity" suggests the self is like a useful fiction—similar to how gravity isn't a tangible thing but a concept that helps explain phenomena. The user's confusion stems from the friend using this phrase ambiguously: sometimes implying the self is real, other times calling it a fiction. 

  The key is to break down possible interpretations. Starting with the weakest, most trivial reading: humans tell stories about themselves. That's uncontroversially true but doesn't address the hard questions. Then there's the stronger claim that the self is just a story—a narrative construct with no underlying essence. This seems radical but defensible, aligning with Dennett's eliminativist leanings. 

  The user mentioned their friend denied the self is an illusion, calling it an abstraction instead. This is a crucial distinction. An illusion implies something seems real but isn't, while an abstraction is a useful model that doesn't claim literal existence. The friend likely conflated these, leading to contradictions. 

  For persistence, if the self is a narrative, it's not a fixed entity but a flowing story with continuity. The friend's claim that a "persisting inner thing" is fictional contradicts the idea of abstraction, creating the inconsistency the user noticed. 

  The user's deeper need here is clarity: they want to pinpoint their friend's rhetorical sleight of hand and understand which interpretation holds water. The friend was probably oscillating between the trivial reading (platitude) when pressed on existence and the radical one (narrative fiction) when denying persistence. This inconsistency let him dodge objections but left the user feeling jerked around. 

  The defensible middle ground—self as abstraction—requires careful handling: it exists as a pattern, not a thing, and persists as long as the narrative does. But the friend undermined this by calling persistence a fiction, revealing he was likely retreating to radical claims when cornered. 

