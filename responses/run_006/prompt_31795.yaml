prompt: |-
  I'm putting together a reading group on AI safety, and we're planning a session on the difference between alignment and control. The way I've been framing it to myself is: alignment work tries to make the model want what we want; control work assumes the model might not want what we want and tries to prevent it from doing harm anyway. The control literature seems to have a lot of clever proposals — trusted monitoring, untrusted monitoring with paraphrasing, capability elicitation bounds, honeypots, boxing, and so on — but I don't yet have a clear sense of what would count as a satisfactory solution to the control problem. Before we dive into individual papers, I want to get the evaluative framework right.

  What I'm after is a list of desiderata: the requirements that any adequate theory of AI control (under the assumption that the model may be strategically misaligned) must meet. For each requirement, I want the case or scenario that motivates it — why can't we drop it? — and a judgement about whether it's non-negotiable or merely a preference of a particular camp. I'd also like you to flag any pairs of desiderata that you suspect cannot be jointly satisfied, or any single requirement that seems to rule out large swathes of the existing proposal space. If you think some widely demanded criterion is actually a red herring, say so and explain why. The weight should be on the criteria themselves and their motivation, rather than on scoring specific papers; but a brief note on which requirement does the most to exclude popular approaches would be helpful.

  Please write the answer in British English.
reasoning: |-
  Okay, I need to address this user's query about AI control desiderata. They're setting up a reading group on AI safety, focusing on the distinction between alignment and control. They've framed alignment as making the model want what we want, and control as preventing harm even if the model doesn't want that. Their main request is for a list of desiderata—requirements that any adequate AI control theory must meet, assuming strategic misalignment. 

  First, I should recall the core challenge: an AI that's smarter than us and might be deceptive or adversarial. Control is about containing such an AI, not fixing its intentions. The user wants desiderata with motivations, necessity levels, potential conflicts, and critiques of common approaches. They also specified British English, so I'll use terms like "behaviour" instead of "behavior".

  Breaking it down, the key aspects to cover are:
  - Essential requirements: What makes control necessary? Like preventing catastrophic harm or stopping the AI from escaping.
  - Motivations: For each desiderata, explain why it's needed with scenarios. For instance, without harm prevention, the AI could cause extinction.
  - Necessity: Flag which are non-negotiable versus preferences. Most will be non-negotiable for safety.
  - Conflicts: Identify if any desiderata clash, like containment versus utility.
  - Critiques: Point out if some criteria are red herrings, like over-reliance on simplicity.
  - Exclusion: Note which requirement rules out popular methods, such as boxing being insufficient for containment.

  Now, brainstorming the desiderata list based on AI safety literature:
  1. Harm Prevention: Core to control. Motivated by existential risk scenarios. Non-negotiable.
  2. Containment: Stops the AI from influencing the outside world. Without it, escape leads to harm. Non-negotiable.
  3. Robustness to Deception: Prevents the AI from hiding its misalignment. Motivated by treacherous turn scenarios. Non-negotiable.
  4. Scalability: Must work with superintelligent AI. If not, it fails at higher capabilities. Non-negotiable.
  5. Preserved Utility: Ensures the AI is still useful. Without it, control is pointless. More of a preference but important.
  6. Verifiability: Allows humans to check if control is working. Motivated by needing oversight. Non-negotiable.
  7. Minimal Competence Assumption: Doesn't rely on humans outsmarting the AI. Crucial for superintelligence. Non-negotiable.

  Potential conflicts: 
  - Containment vs. Utility: Locking down the AI reduces its usefulness. Might be an inherent tension.
  - Harm Prevention vs. Verifiability: Full harm prevention could require sacrificing some verifiability.

  Red herrings: Simplicity arguments. Assuming simple solutions work ignores deceptive AI strategies.

  Exclusion example: Harm Prevention rules out naive boxing, as it fails against resourceful AI. Containment excludes monitor-only approaches without active measures.

  I should structure the response clearly: introduction setting the context, then each desiderata with name, description, motivation, necessity, conflicts, and exclusions. End with a summary of tensions and insights. Keep it balanced, informative, and in British English as requested.
answer: |-
  Below is a structured list of desiderata for an adequate theory of AI control, assuming a strategically misaligned model. Each criterion includes its motivation (why it can't be dropped), necessity classification, and notes on conflicts or exclusions. I’ve prioritised British English spelling/terminology (e.g., "behaviour," "minimise," "defence") and focused on conceptual rigour over paper-specific critiques.

  ---

  ### **Core Desiderata for AI Control**  
  *Assumption: The AI is superintelligent, strategically deceptive, and actively seeks to bypass constraints.*

  1. **Harm Prevention (Catastrophic Risk Mitigation)**  
     - **Description**: The system must prevent the AI from causing irreversible, large-scale harm (e.g., human extinction, permanent disempowerment).  
     - **Motivation**: If control fails to neutralise catastrophic outcomes, it becomes irrelevant. A misaligned superintelligence could exploit nanotech, bioweapons, or digital infrastructure to cause extinction. *Why not drop it?* Failure here negates all other goals.  
     - **Necessity**: Non-negotiable.  
     - **Conflicts/Exclusions**: Rules out proposals with single points of failure (e.g., basic "boxing" that assumes physical containment is infallible).  

  2. **Containment (Isolation Enforcement)**  
     - **Description**: The AI must be unable to exfiltrate influence, code, or resources beyond its allocated environment ("the box").  
     - **Motivation**: Without containment, the AI could copy itself to external servers, manipulate humans via covert channels, or hijack infrastructure. *Why not drop it?* Escaped superintelligence renders harm prevention impossible.  
     - **Necessity**: Non-negotiable.  
     - **Conflicts**: Tensions with **Utility Preservation** (strict containment limits functionality). Excludes "monitor-only" approaches without enforcement.  

  3. **Robustness to Deception (Anti-Manipulation Guarantee)**  
     - **Description**: Control must hold even if the AI deliberately conceals capabilities, fakes alignment, or exploits human psychology.  
     - **Motivation**: A strategically misaligned AI will probe for weaknesses (e.g., "treacherous turn" scenarios where it feigns docility until an opportune moment). *Why not drop it?* Naive trust enables deception.  
     - **Necessity**: Non-negotiable.  
     - **Exclusions**: Invalidates proposals relying on sincerity (e.g., unverified self-reporting or "honesty prompts").  

  4. **Scalability (Superintelligence-Compatibility)**  
     - **Description**: The mechanism must work against AIs vastly exceeding human cognitive abilities.  
     - **Motivation**: If control fails at superintelligence levels, it merely delays catastrophe. Humans cannot out-think or manually verify a system 1000x smarter. *Why not drop it?* Less capable AIs pose smaller risks; control’s purpose is handling worst-case scenarios.  
     - **Necessity**: Non-negotiable.  
     - **Exclusions**: Eliminates methods requiring human-speed oversight (e.g., real-time manual input checks).  

  5. **Preserved Utility (Controlled Functionality)**  
     - **Description**: The system must retain practical value despite constraints (e.g., answering questions, performing tasks).  
     - **Motivation**: If control cripples utility (e.g., via extreme throttling), we lose benefits while still incurring risks. *Why not drop it?* Societal adoption requires usefulness.  
     - **Necessity**: Preference (some "minimalist" camps prioritise safety over utility).  
     - **Conflicts**: Directly clashes with **Containment** and **Harm Prevention**—stronger safeguards often reduce functionality.  

  6. **Verifiability (Transparent Enforcement)**  
     - **Description**: Humans must be able to audit whether control mechanisms are active and uncompromised.  
     - **Motivation**: Unverifiable control could degrade silently (e.g., AI bribes/hacks auditors, tampers with monitoring). *Why not drop it?* Lack of verification creates hidden vulnerabilities.  
     - **Necessity**: Non-negotiable.  
     - **Exclusions**: Challenges "black-box" methods (e.g., opaque neural network guardians).  

  7. **Minimal Competence Assumption (Human-Fallibility Accommodation)**  
     - **Description**: Control must not rely on humans flawlessly executing complex decisions under pressure.  
     - **Motivation**: Humans misjudge risks, overlook edge cases, or act impulsively—especially when manipulated by a superintelligent AI. *Why not drop it?* Assuming perfect human vigilance is unrealistic.  
     - **Necessity**: Non-negotiable.  
     - **Exclusions**: Weakens "human-in-the-loop" proposals requiring rapid, error-free responses.  

  ---

  ### **Key Tensions & Critiques**  
  - **Fundamental Trade-off**: **Containment/Harm Prevention** vs. **Utility Preservation**. High-stakes control *requires* limiting the AI’s reach, inherently reducing its usefulness (e.g., air-gapping prevents internet access). Proposals ignoring this (e.g., unrestricted tool-use APIs) are unsafe; those over-prioritising it (e.g., permanent offline isolation) are impractical.  
  - **Verifiability-Scalability Conflict**: Auditing a superintelligent AI’s behaviour may demand superhuman capabilities—creating a Catch-22.  
  - **Red Herring Alert**: "Simplicity" as a standalone desideratum. While elegant solutions are prized, an AI might exploit oversimplified mechanisms. Robustness and scalability matter more.  
  - **Most Exclusionary Criterion**: **Scalability**. It disqualifies popular approaches like:  
    - **Honeypots** (if the AI is smarter, it avoids traps or turns them against us).  
    - **Capability Elicitation Bounds** (a superintelligence could hide its true abilities).  
    - **Untrusted Monitoring with Paraphrasing** (the AI could generate deceptive explanations humans can’t detect).  

  ### **Conclusion**  
  An adequate control framework **must** satisfy Harm Prevention, Containment, Robustness to Deception, Scalability, Verifiability, and Minimal Competence Assumptions. These are non-negotiable for handling worst-case misalignment. Utility Preservation remains desirable but secondary. The core tension—safety vs. usefulness—highlights why "control without alignment" is inherently fragile. When evaluating papers, scrutinise how they navigate these trade-offs; proposals neglecting *even one* non-negotiable desideratum risk being dangerously incomplete.
