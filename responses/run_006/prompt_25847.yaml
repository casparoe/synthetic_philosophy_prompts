prompt: |-
  I'm a PhD student TA-ing an upper-level undergraduate course on decision theory, and next week I have to teach a single seventy-five-minute session on evidential cooperation in large worlds. The students have already covered Newcomb's problem, the difference between evidential and causal decision theory, and the basic prisoner's dilemma. They've seen the standard arguments for why EDT one-boxes and CDT two-boxes, and they understand that in a one-shot PD, CDT says defect. Don't explain the concept to me — plan how I should explain it. I need: the dependency map (what idea must be in place before what, and why the sequence can't be rearranged), the one carrying example that should anchor the whole session and what it must have and lack, the misconceptions students predictably form and at which point in the sequence each should be headed off, a check for understanding at the end that tests whether they've grasped the structure rather than the slogan, and what I should openly refuse to cover at this level. Please organize the response into these sections: Dependency Map (roughly 200 words), Carrying Example (roughly 200 words), Misconception Table (roughly 300 words, with one row per misconception giving its timing, how it surfaces, and how to defuse it), Check for Understanding (roughly 100 words), and Boundaries (roughly 100 words on what to leave out).
