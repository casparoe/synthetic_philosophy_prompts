  The students have already covered Newcomb's problem, evidential vs. causal decision theory (EDT vs. CDT), and the basic prisoner's dilemma. They understand why EDT one-boxes and CDT two-boxes in Newcomb's, and why CDT defects in a one-shot PD. This session builds on that foundation but moves to more complex large-world scenarios.

  For the dependency map, I need to sequence concepts logically. Start with reviewing EDT vs. CDT in small worlds since that's their existing knowledge. Then introduce large worlds as having multiple similar agents and decisions. This leads to the core challenge: EDT's correlation-based cooperation fails when it can't distinguish between copies, while CDT's independence assumption causes coordination failures. Finally, show how this frames the problem of achieving robust cooperation.

  The carrying example should be simple yet powerful. I'll use the Symmetric Prisoner's Dilemma with multiple identical agents deciding simultaneously. It must show EDT cooperating naively but failing when facing defectors, and CDT defecting rationally but causing mutual harm. Crucially, it should lack external coordination mechanisms to highlight the dilemma purely.

  For misconceptions, I anticipate several. Students might think EDT always cooperates or that CDT's defection is irrational. I'll note when these surface and how to defuse them—e.g., by emphasizing EDT's vulnerability to exploitation and CDT's consistent but suboptimal rationality.

  The check for understanding should test structural grasp: ask why CDT defects even knowing others are identical, and why EDT's cooperation is fragile. This probes if they see the core tension beyond slogans.

  Boundaries are key. I'll explicitly avoid Roko's basilisk (too speculative), technical solutions like updatelessness (too advanced), and infinite ethics (out of scope). Keep it focused on the philosophical problem.

  This plan ensures a tight 75-minute session. The Symmetric PD example anchors everything, misconceptions are preempted, and boundaries prevent scope creep. I'll make the response clear and actionable for the TA's teaching needs.
answer: |-
  ### Dependency Map (199 words)
  The sequence is rigid: **1. EDT/CDT Review → 2. Large Worlds Definition → 3. EDT’s Correlation Problem → 4. CDT’s Coordination Failure → 5. Evidential Cooperation’s Core Challenge.**  
  Start by reactivating prior knowledge: EDT uses correlations (Newcomb’s one-boxing), CDT severs arrows (PD defection). *Without this, large-world critiques lack contrast.* Next, define "large worlds" as involving many decision-similar agents where actions are globally entangled (e.g., clones, AIs, simulation twins). *Omitting this risks conflating with repeated games.* Then, show EDT’s flaw: in large worlds, correlation ≠ control. EDT cooperates expecting reciprocal evidence (like PD), but if some agents defect (e.g., flawed copies), EDT still cooperates with them—blindly rewarding exploitation. *This must precede CDT’s flaw to avoid "CDT is just selfish" misconceptions.* Now reveal CDT’s flaw: its independence assumption ignores logical ties to identical agents. CDT defects even when knowing cooperation would benefit all copies, causing mass mutual defection. *Order matters: CDT’s failure is only tragic after seeing EDT’s naiveté.* Finally, frame evidential cooperation as seeking strategies robust to both pitfalls.

  ---

  ### Carrying Example: Symmetric Prisoner’s Dilemma (SPD) (199 words)  
  **Setup:** 100 identical agents, each facing independent PDs against all others. Payoffs per PD: mutual cooperation > mutual defection, but defection dominates unilaterally. All decide simultaneously without communication.  

  **Must have:**  
  - **Identical agents:** Decisions are perfectly symmetric (no "leader").  
  - **Global entanglement:** An agent’s choice is evidence for others’ choices (EDT) but causally independent (CDT).  
  - **Payoff structure:** Cooperation is collectively optimal but individually risky.  

  **Must lack:**  
  - Repeated interactions (no tit-for-tat).  
  - Precommitments/contracts.  
  - Causal influence between agents.  

  **How it carries the session:**  
  - **EDT:** Reasons "If I cooperate, that suggests others like me cooperate → high payoff." But if one agent is faulty (defects), EDT still cooperates, losing badly.  
  - **CDT:** Severs evidential links. "My choice can’t affect others → defect is dominant." All defect, getting poor payoffs despite symmetry.  
  - **Tragedy:** Both theories fail. EDT is exploitable; CDT forces suboptimal equilibrium. Anchors why new frameworks (e.g., FDT) are needed.

  ---

  ### Misconception Table  
  | Timing                | Misconception                          | How It Surfaces                          | Defusal Strategy                                                                 |
  |-----------------------|----------------------------------------|------------------------------------------|----------------------------------------------------------------------------------|
  | **After EDT review**  | "EDT always cooperates in PD-like scenarios." | Students assume SPD guarantees EDT cooperation. | Show a variant: 1 defector clone. Ask: "Does EDT cooperate with *it*? Why?" Highlight EDT’s blindness to agent differences. |
  | **After CDT analysis**| "CDT defects because it’s selfish."    | Moralizing CDT’s choice.                 | Stress: CDT defects even if it *wants* collective good—its causal model severs logical ties. Use SPD: "If all CDT agents wish for mutual cooperation, why can’t they achieve it?" |
  | **During SPD payoff calc**| "But if we all cooperate, it’s best—so just do that!" | Ignoring decision-theoretic constraints. | Ask: "What stops a *single* CDT agent from defecting? How does EDT respond?" Emphasize unilateral incentives. |
  | **Post-SPD summary**  | "Large worlds = many games with same opponent." | Conflating with iterated PD.             | Contrast: SPD has simultaneous one-shot decisions with *multiple identical opponents*, not repeated play. |

  ---

  ### Check for Understanding (98 words)  
  **Question:** *"In SPD, why does CDT defect even if all agents are identical and run the same decision algorithm?"*  
  **Acceptable Answer:** CDT treats its decision as causally independent. It reasons: "My choice doesn’t *cause* others to choose likewise. Defection gives +1 payoff regardless of their choice."  
  **Follow-up:** *"Why is EDT’s cooperation fragile in SPD if one agent is irrational?"*  
  **Acceptable Answer:** EDT cooperates because its action *correlates* with others’ actions. If one agent defies the correlation (e.g., is faulty), EDT still cooperates with it, losing payoff without altering its decision.  

  ---

  ### Boundaries (97 words)  
  **Explicitly omit:**  
  1. **Roko’s basilisk/ethical obligations:** Avoid speculative futuristic scenarios (distracting, not core theory).  
  2. **Updatelessness/FDT mechanics:** Mention as a *direction* for solutions but no math or betting puzzles (too advanced).  
  3. **Infinite ethics/population ethics:** Large worlds ≠ infinite utilities. Focus on coordination, not aggregation.  
  4. **Equilibrium selection in game theory:** This is decision theory under logical uncertainty, not Nash refinements.  
  **Rationale:** Session goal is framing the *problem* of cooperation under logical ties. Technical solutions require graduate-level tools.
