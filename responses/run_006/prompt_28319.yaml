prompt: |-
  Had a long argument with a friend about Goodhart's law last night and I still can't figure out what rule he's actually running. He's adament that: paying factory workers per widget is a disaster (quality tanks); giving call center reps bonuses for short calls is a disaster (they hang up on anyone with a real issue); paying writers per article is a disaster (you get clickbait slop). But he thinks sales commissions on revenue are totally fine, since revenue's the thing you wanted anyway, and a robot arm rewarded for getting a block above a line is fine, because the only way to get the block up is to actually lift it. The case we got stuck on: a hospital that says patient satisfaction is one of its core goals starts tying bonuses to its satisfaction survey scores. Would he call that a disaster or fine? It seems like he's running either the rule that proxies go bad when they measure an intermediate activity instead of the final outcome, or the rule that proxies go bad when there's a cheap way to move them without doing the real work. Both fit his verdicts so far, right? Which rule is he actually running, what does each one say about the hospital case, and what further case would settle it?
reasoning: |-
  Okay, the user is trying to figure out their friend's reasoning about Goodhart's law. They had a long argument and are stuck on the hospital case. Let me break down what they've shared.

  First, the friend thinks certain incentives lead to disasters: paying per widget causes quality issues, call center bonuses for short calls lead to hang-ups, per-article payments result in clickbait. But the friend is fine with sales commissions on revenue and a robot arm lifting a block. The key question is about the hospital tying bonuses to satisfaction scores. The user thinks two rules might explain the friend's stance: either proxies measuring intermediate vs. final outcomes, or proxies having cheap ways to game them.

  I need to compare both rules. Rule 1 (Intermediate vs. Final): Revenue is a final outcome, lifting the block is direct. Widgets, call time, articles are intermediate—they can be optimized without the real goal. Rule 2 (Cheap Alternative Paths): If there's an easier way to game the proxy (like hanging up calls), it's bad. Revenue and lifting blocks don't have easy cheats.

  For the hospital, Rule 1 would see satisfaction as a final goal, so it's fine. Rule 2 might flag it as gameable—staff could pressure patients for high scores. The user needs a test case to distinguish. What if there's a direct outcome without alternatives? Like paying a lifeguard per rescue. Rule 1 approves (final outcome), Rule 2 approves (no easy cheat). But if the outcome is final but gameable? Example: paying for arrests without convictions. Rule 1 might be okay (arrest as outcome), but Rule 2 sees gaming (false arrests). The friend's reaction here would show which rule they're using.

  The user's deeper need is understanding Goodhart's nuances to resolve the argument and clarify their friend's logic. They might also want practical examples to apply in future discussions. Ensuring the test cases are clear-cut is key to pinpoint the underlying rule.
answer: |-
  This is a beautifully crisp Goodhart's law puzzle! You've correctly identified the two competing rules your friend *might* be using. Let's break down both rules, apply them to the hospital case, and design a test case to settle it.

  ### The Two Candidate Rules

  1.  **Rule 1: Intermediate Activity vs. Final Outcome**
      *   **Core Idea:** Proxies measuring *actions taken* (intermediate activities) are dangerous because they can be optimized *instead of* the desired outcome. Proxies measuring the *actual desired outcome* are safer.
      *   **Explains His Verdicts:**
          *   **Disaster (Intermediate):** Widgets made (action), calls ended quickly (action), articles written (action). These are things you *do* hoping they *lead to* quality, resolution, or valuable content.
          *   **Fine (Final Outcome):** Revenue received (outcome), block above line (outcome). These *are* the goals themselves.
      *   **Hospital Case Verdict (Rule 1):** **Fine.** Patient satisfaction *is* explicitly stated as a core goal. The survey is a direct (though imperfect) measure of *the outcome they want*. It's not an intermediate activity like "number of procedures done" or "minutes spent with patient."

  2.  **Rule 2: Cheap Alternative Paths**
      *   **Core Idea:** Proxies are dangerous if there exist *low-cost, low-effort ways* to manipulate the metric *without* actually improving (or while harming) the underlying goal. Proxies are safer if the *only practical way* to move the metric is to genuinely achieve the goal.
      *   **Explains His Verdicts:**
          *   **Disaster (Cheap Path):** Sacrifice quality for widget count (cheap), hang up on complex calls (cheap), write shallow clickbait (cheap). These bypass the real work.
          *   **Fine (No Cheap Path):** Faking revenue is fraud (hard/illegal), faking lifting the block is impossible for the robot. The *only* way is genuine success.
      *   **Hospital Case Verdict (Rule 2):** **Likely Disaster.** There are numerous cheap/low-effort ways to inflate satisfaction scores *without* improving genuine patient well-being or experience:
          *   Pressuring patients ("Give us a 10 or my boss yells at me").
          *   Offering small incentives for high scores.
          *   Focusing excessive attention on easily-pleased, low-acuity patients.
          *   Avoiding necessary but uncomfortable conversations/treatments.
          *   Gaming *when* or *to whom* surveys are given (e.g., only after easy cases, not to complex or dissatisfied patients).

  ### Which Rule is He Running? The Hospital Case is the First Divergence

  *   **Rule 1 says Fine.**
  *   **Rule 2 says Disaster.**

  **Therefore, his verdict on the hospital case *itself* tells you which rule he's primarily using.**

  *   If he says **"Disaster!"** -> He's running **Rule 2 (Cheap Alternative Paths)**.
  *   If he says **"Fine!"** -> He's running **Rule 1 (Intermediate vs. Final Outcome)**.

  ### Settling It Definitively: The Perfect Test Case

  To *confirm* his rule beyond the hospital case, propose a case where the two rules give *opposite* verdicts, and the hospital case alone might be ambiguous for Rule 2:

  **The Lifeguard Rescue Bonus:**

  *   **Scenario:** A beach hires lifeguards and pays them a significant bonus **for each swimmer they physically rescue from drowning** (verified rescue). This is the *final outcome* they desire (lives saved).
  *   **Rule 1 (Final Outcome) Verdict:** **Fine.** Rescuing a swimmer *is* the ultimate goal. The metric is the outcome itself.
  *   **Rule 2 (Cheap Paths) Verdict:** **Likely Disaster.** There are dangerous cheap paths:
      *   **"Stage Drownings":** Collude with friends to "struggle," get "rescued," split the bonus.
      *   **Neglect Prevention:** Focus *only* on pulling people out, not on prevention (warning swimmers, moving flags, educating) – potentially *increasing* the number of rescues needed.
      *   **Let Minor Issues Escalate:** Hesitate to intervene early with a struggling swimmer, waiting until a full rescue is "necessary" to get the bonus.
  *   **Your Friend's Reaction:**
      *   If he says **"Fine! Rescues are the goal!"** -> Confirms **Rule 1 (Final Outcome)** is dominant. He dismisses the cheap paths as unlikely or manageable.
      *   If he says **"Disaster! They'll cheat or make things worse!"** -> Confirms **Rule 2 (Cheap Alternative Paths)** is dominant. The direct outcome measure is still corruptible.

  ### Conclusion & Next Steps

  1.  **Ask him about the Hospital Case:** His immediate reaction reveals his primary rule.
  2.  **Propose the Lifeguard Test Case:** This forces a clear choice between the rules and confirms his underlying logic.
  3.  **Likely Outcome:** Based on his strong emphasis on the *mechanism* of failure (quality tanking, hanging up, clickbait - all cheap hacks), **Rule 2 (Cheap Alternative Paths) is the stronger candidate for his true operating principle.** He intuitively understands Goodhart's law as being about the *ease of gaming* the metric relative to the true goal. The hospital case (pressure, focus on scores over care) and the lifeguard case (staged rescues, neglect) fit this pattern perfectly. Revenue and the robot block lack those easy hacks.
