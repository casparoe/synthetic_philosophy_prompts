  Below is a structured activity to create an experiential encounter with the discursive dilemma in your reading group. It uses a grant review panel scenario, requires no upfront lecture, and guides participants to discover the inconsistency themselves.

  ---

  ### **Activity: NSF Grant Review Panel**
  **Objective:** Participants experience how majority votes on logically connected premises lead to a collective inconsistency, forcing them to confront the aggregation problem.

  ---

  ### **Materials & Setup**
  1. **Ballot Slips** (one set per participant):
     ```
     GRANT PROPOSAL #7: "Quantum-Social Modeling Initiative"
     [Brief fictional description: Uses quantum algorithms to model social dynamics. High innovation risk, moderate cost, interdisciplinary team.]

     VOTE ON:
     (P1) The methodology is scientifically rigorous. [Yes / No]
     (P2) The project is financially responsible. [Yes / No]
     (C) The project should be funded. [Yes / No]

     RULES: 
     - Funding requires BOTH P1 AND P2 to be true. 
     - If you vote Yes on both P1 and P2, you MUST vote Yes on C.
     - If you vote No on either P1 or P2, you MUST vote No on C.
     ```

  2. **Whiteboard Layout**:
     ```
     INDIVIDUAL VOTES (Secret Ballot)
     Participant | P1 | P2 | C
     ---------------------------
     ...        | ?  | ?  | ?

     GROUP TALLY (Public)
     Method          | P1 | P2 | C 
     ------------------------------
     Premise-Based   | ?  | ?  | [Derived]
     Conclusion-Based| -  | -  | ? 
     ```

  3. **Role Assignments**: None (all are panelists).  
  4. **Group Size**: 10–14 participants. Split into 3–4 small groups during discussion.

  ---

  ### **Timeline (90 Minutes Total)**
  1. **Introduction (5 min)**  
     - **Facilitator Script**:  
       *"We’re a National Science Foundation panel reviewing Grant #7. Each of you will privately vote on two premises (P1: methodological rigor, P2: financial responsibility) and the conclusion (C: fund the project). Remember: funding requires both P1 and P2 to be true. After voting, we’ll tally individual votes and discuss as a group."*  
     - **Critical**: Do NOT mention inconsistency, paradoxes, or logic. Only clarify rules if asked.

  2. **Individual Voting (10 min)**  
     - Distribute ballots. Emphasize secret, independent votes.  
     - Collect ballots and tally secretly (do not reveal results yet).

  3. **Small Group Discussion (25 min)**  
     - Split into 3–4 groups. **Task**: *"Discuss P1, P2, and C. Persuade others if you disagree, but do NOT force consensus. Note key arguments for each."*  
     - **Facilitator Circulates**: Listen but do not intervene unless rules are violated. Redirect focus to premises (e.g., *"Does anyone question the methodology’s rigor?"*).

  4. **Public Tally & Aggregation (20 min)**  
     - Reveal individual votes on whiteboard (keep participants anonymous, e.g., "Voter 1, Voter 2...").  
     - **Premise-Based Aggregation**:  
       - *"Let’s see what the group thinks premise-by-premise. Majority votes on P1 and P2 determine C."*  
       - Tally majority for P1 and P2, then derive C (e.g., if P1 majority Yes and P2 majority Yes, C must be Yes).  
     - **Conclusion-Based Aggregation**:  
       - *"Now, what if we vote directly on funding (C)?"*  
       - Tally majority for C from individual votes.  
     - **Key**: Ensure the vote distribution creates inconsistency (see "Predictable Issues" below).

  5. **Reveal Inconsistency (5 min)**  
     - Point to the whiteboard:  
       *"Our premise-based method says [C derived]. Our conclusion-based method says [C majority]. But these contradict. How did this happen?"*  
     - Let participants notice and react. **DO NOT explain yet**.

  6. **Debrief & Discussion (25 min)**  
     - Guide participants to articulate the problem:  
       *"Why did the group’s view on C change depending on how we voted?"*  
     - Map to philosophy:  
       | **Approach**          | **What It Aggregates**       | **Strengths/Weaknesses**                               |  
       |------------------------|------------------------------|--------------------------------------------------------|  
       | **Premise-Based**      | Majority on each premise     | *Strengths*: Logically consistent conclusions.<br>*Weaknesses*: Ignores direct majority on the outcome. |  
       | **Conclusion-Based**   | Majority on the conclusion   | *Strengths*: Honors majority will.<br>*Weaknesses*: May ignore logical links (e.g., P1/P2 implications). |  
     - **Key Insight**: Neither method fully captures the "group view" because:  
       - Premise-based voting can force a conclusion the majority rejects (e.g., fund a grant most oppose).  
       - Conclusion-based voting severs the logical connection to premises (e.g., defunding even if majority supports both premises).  
     - Name the "discursive dilemma" here and link to readings.

  ---

  ### **Predictable Issues & Recovery**
  - **Problem 1: Votes don’t produce inconsistency** (e.g., majority aligns on all).  
    - **Recovery**: Use a pre-seeded vote distribution if ballots lack diversity (e.g., 4 votes: [P1Y, P2N, CN], [P1N, P2Y, CN], [P1Y, P2Y, CY], [P1Y, P2Y, CY]). Reveal this only if needed.  
  - **Problem 2: Participants ignore logical rules**.  
    - **Recovery**: Gently reinforce: *"Remember, C must align with P1 and P2 per our rules."*  
  - **Problem 3: Group discussion overrides individual votes**.  
    - **Recovery**: Use original ballots for aggregation (not post-discussion opinions).

  ---

  ### **What the Activity Can’t Reproduce**
  **The Normative Challenge**: The activity assumes a fixed logical rule (C iff P1 and P2). In real social science, the rules themselves are contested (e.g., *Should funding require both P1 and P2?*). Participants may not grapple with *who decides the logical structure* or *how rules embed power dynamics*. Supply this in debrief:  
  - *"In philosophy, the dilemma isn’t just about votes—it’s about whether we can justify one aggregation method over another when the rules themselves are debatable."*  

  ---

  ### **Facilitator Cheat Sheet**
  - **STAY NEUTRAL**: Never hint at the paradox. Use phrases like *"Interesting—how do we resolve this?"* during inconsistency.  
  - **STRESS RULES**: Repeat that C must follow from P1/P2.  
  - **DEBRIEF START**: *"We’ve seen how a group of rational individuals can produce an irrational collective outcome. Let’s unpack why."*  

  This design fosters discovery, uses relatable roles, and isolates the dilemma’s core tension. The grant panel frame makes the logic tangible without technical jargon.
