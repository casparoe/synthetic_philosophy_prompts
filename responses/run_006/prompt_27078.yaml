prompt: |-
  Hi — I'm in a third-year political philosophy module and we've just done a unit on compromise between people with very different value systems. I keep noticing a move I don't have a word for, and I want to know if it has a name and how it relates to the stuff we've covered.

  The setup: two people each think the other is doing something seriously wrong, but each also has some practice the other condemns that they themselves think is basically fine. Example from a seminar: A is a vegetarian who thinks factory farming is an atrocity but doesn't see flying as a big deal; B thinks aviation emissions are the real moral emergency but dosen't see what's wrong with eating meat. They make a deal: A won't fly home for a year, and B goes vegetarian for the same year. By A's lights she's given up something nearly worthless and gained something she cares about enormously (B not eating meat); by B's lights he's done the same in reverse. So both walk away thinking the world is morally better than before, even though they still think each other's underlying values are wrong.

  I've seen this pattern described as a kind of trade or compromise, but it's not exactly either, because there's no shared currency: A thinks B's concession is worth a lot, but B thinks that very same concession is worth almost nothing, and vice versa. Is there an established name for this specific configuration, what are the nearest concepts in the literature, and how does it differ from ordinary political log-rolling or from the worry that moral commitments shouldn't be up for barter? I'm not just after a label — I want to know exactly what the thing is, where its edges are, and whether it's even coherent to call it a 'gain' for both sides.

  Could you answer in British English?
reasoning: |-
  Okay, the user is in a third-year political philosophy module and has just studied compromise between people with different value systems. They've encountered a specific scenario where two parties each think the other is doing something wrong, but they each have a practice the other condemns that they themselves see as harmless. The example given is between a vegetarian concerned about factory farming and someone concerned about aviation emissions. They make a deal: the vegetarian stops flying for a year, and the other person goes vegetarian for a year. Both feel they've given up something minor but gained something significant according to their own values.

  The user wants to know if there's a name for this kind of arrangement, how it relates to existing concepts like compromise or log-rolling, and whether it's coherent to call it a mutual gain. They also specified they want the answer in British English.

  First, I recall that this scenario resembles the concept of "moral trade" as described by philosophers like Will MacAskill and others in effective altruism circles. It's a situation where individuals with different moral values trade actions that each considers low-cost but high-value to the other. The key here is the asymmetry in valuation: what one party sees as a huge moral gain, the other sees as trivial, and vice versa.

  Next, I need to differentiate this from traditional compromise and log-rolling. Compromise usually involves splitting differences or finding a middle ground where both parties sacrifice equally towards a shared goal. But here, there's no shared metric; the gains and losses are subjective. Log-rolling, or vote-trading, operates within a shared system (like politics) where concessions are exchanged based on mutual benefit in a common framework, such as passing legislation. However, in moral trade, there's no shared system—each party's values are fundamentally different, and the trade happens precisely because they value each other's concessions differently.

  The user also asks about the coherence of calling it a 'gain.' From each individual's perspective, it absolutely is a gain: they give up something they deem unimportant and receive something they value highly. However, the other party views that same concession as insignificant. This highlights the subjectivity of moral values and the lack of a universal currency for ethical trade.

  Regarding literature, besides MacAskill, Toby Ord's work on moral trade and Derek Parfit's discussions on cluelessness might be relevant. The Stanford Encyclopedia entry on effective altruism touches on this. The edges of this concept include scenarios where the actions might cause harm or where incommensurability of values prevents agreement. Also, there's a risk of moral corruption if one trades core principles, but in this case, since each action is seen as costless by the actor, it avoids that issue.

  The user might have deeper concerns about whether such trades undermine moral integrity or if they're feasible in real-world conflicts. They might also be interested in how this applies to larger-scale political compromises, like climate agreements between nations with different priorities. Addressing the coherence of mutual gains despite conflicting values is crucial here, emphasizing the subjective nature of the benefits.
answer: |-
  Right, this is a fascinating and increasingly discussed phenomenon in contemporary political philosophy and ethics. It's a very particular beast that doesn't fit neatly into traditional boxes like compromise or log-rolling, precisely because of the **radical asymmetry in valuation** you've identified.

  Here's a breakdown addressing your points in British English:

  1.  **The Established Name: Moral Trade**
      *   This is the most widely accepted term for this specific configuration, gaining traction particularly through the work of philosophers associated with **effective altruism**, like **Will MacAskill** and **Toby Ord**.
      *   **Key Feature:** It describes exchanges where individuals act to promote the *other* person's values (or prevent what the *other* person sees as a harm), precisely *because* the cost to themselves (in terms of their *own* values) is low, while the benefit they provide the other is (from the other's perspective) high. The *lack* of shared value currency is fundamental to the definition.

  2.  **Nearest Concepts in the Literature & How it Differs:**
      *   **Ordinary Compromise:**
          *   **Similarity:** Both involve mutual concessions to resolve conflict or achieve a mutually acceptable outcome.
          *   **Difference:** Traditional compromise usually implies finding a *shared* middle ground or splitting the difference *using a shared metric* (e.g., dividing money, sharing time, finding a policy acceptable to both sides *based on overlapping interests*). Both parties typically feel they've given up something *they value* to get something *they also value* (peace, a workable solution). In moral trade, there is *no shared metric*. Each party feels they've given up something *trivial* (by their own lights) to get the other to stop doing something they find *abhorrent*. They aren't converging on shared values; they're leveraging the *disparity* in valuations.
      *   **Log-Rolling (Vote-Trading):**
          *   **Similarity:** Involves exchanging support for different policies ("I'll vote for your bill if you vote for mine"). There's a transactional element.
          *   **Difference:** Log-rolling operates *within a shared system* (e.g., a legislature) with *shared currency* (votes, political capital). The concessions *are* valued similarly by both parties (a vote is a vote). The goal is often mutual *political* gain, not necessarily moral improvement from each party's distinct ethical perspective. Moral trade lacks this shared systemic currency – the valuation of the concessions is entirely subjective and asymmetric.
      *   **Pareto Improvements:** This is an economic concept where an action makes at least one person better off without making anyone else worse off.
          *   **Similarity:** Moral trade *appears* like a Pareto improvement *from each individual's subjective perspective*: A is better off (less meat eaten), not worse off (flying was trivial); B is better off (less flying), not worse off (vegetarianism was trivial).
          *   **Difference:** Pareto improvements are typically assessed against a *shared* baseline or set of preferences. In moral trade, the "better off" and "worse off" are assessed using *incommensurable standards*. Crucially, *objectively*, their actions might cause harm the other disapproves of (A flying harms the planet, B eating meat harms animals), but *subjectively*, each discounts the cost *to themselves* of giving up their own practice and hugely values the cost *to them* of the other's practice being stopped. It's a Pareto improvement only within each agent's subjective moral framework, not necessarily in any objective sense.
      *   **Incommensurability of Value:** This broader concept (associated with thinkers like Isaiah Berlin and Joseph Raz) underpins moral trade. It highlights that different values (e.g., animal welfare vs. climate stability) cannot always be reduced to a common scale for comparison. Moral trade is a *practical response* to incommensurability, exploiting the fact that costs/benefits *within each value system* can be ranked differently.

  3.  **Coherence of "Gain" for Both Sides:**
      *   **Subjectively Coherent:** Absolutely. From *within* A's value system, the world is clearly better: a huge harm (meat-eating) is reduced massively, at the cost of forgoing something trivial (flying). B reasons identically in reverse. They each experience a significant net gain *according to their own moral calculus*. It feels like a win-win to them individually.
      *   **Objectively Problematic?** This is where the philosophical bite lies. Critics might argue:
          *   **Mistaken Valuations:** One or both might simply be *wrong* about the moral significance of flying or meat-eating. If A is wrong and flying *is* a huge harm, she hasn't gained; she's enabled a minor good (B not eating meat) while committing a major wrong (flying). Similarly for B.
          *   **Failure of Moral Integrity:** Some argue (drawing on Kantian or deontological concerns) that moral commitments *shouldn't* be treated as fungible goods for trade. You shouldn't "sell" your moral principles or participate in actions you believe are wrong (e.g., A enabling B to fly by not flying herself? Or B enabling A to be complicit in animal suffering by not eating meat? The lines get blurry). Moral trade might feel like complicity or a corruption of one's own values.
          *   **The "Cluelessness" Problem:** (Associated with Derek Parfit). The long-term, complex consequences of actions (like flying less or eating less meat) are incredibly hard to predict. What feels like a minor concession might inadvertently lead to significant unforeseen harms within one's *own* value system, undermining the perceived gain.
      *   **Despite Criticisms:** The *subjective experience* of gain is undeniable and coherent *for the agents involved*. Whether this subjective gain reflects a *genuine* moral improvement in the world is a deeper, contested philosophical question.

  4.  **The Edges - What Makes it Distinct:**
      *   **Core:** Radical asymmetry in valuation of the *same* actions/concessions by different parties. Each assigns *high cost to the other's harmful practice* and *low cost to giving up their own related practice*.
      *   **Edges/When it Fades:**
          *   **Shared Metric Emerges:** If both parties start to agree, even partially, on the relative badness of flying vs. meat-eating (e.g., both acknowledge climate change *and* animal suffering are serious, just prioritised differently), it starts to resemble log-rolling or compromise over a shared (if weighted) value.
          *   **Significant Personal Cost:** If giving up flying is a major sacrifice for A (e.g., missing a dying relative), or going vegetarian is very hard for B, the "low cost" condition fails. It becomes a genuine sacrifice, closer to compromise.
          *   **Harm Caused vs. Harm Prevented:** Moral trade typically involves *refraining* from harmful acts (not flying, not eating meat). If the trade required *positive harmful actions* (e.g., "I'll vandalise this lab if you burn down that factory"), it becomes much more ethically dubious and moves away from the standard case. Exploiting asymmetric valuations for *harm* is different.
          *   **Lack of Mutual Condemnation:** If one party doesn't actually condemn the other's practice as morally wrong (just inconvenient or costly to themselves), it's not moral trade.

  **In Summary:**

  You've identified **moral trade** – a transaction exploiting **radical asymmetry in valuation** between parties with **incommensurable moral commitments**. Each party subjectively experiences a significant net gain because they give up something they deem trivial to prevent something they deem catastrophic, *according to their own distinct value system*. It differs fundamentally from compromise and log-rolling by lacking any shared currency or metric for valuing the concessions. While subjectively coherent as a "gain" for both, its objectivity and compatibility with moral integrity remain philosophically contested. It's a powerful conceptual tool for thinking about cooperation under deep moral disagreement, precisely because it bypasses the need for shared values or common ground. MacAskill's work (particularly in *What We Owe The Future* and articles) and Toby Ord's writings are good places to start for more depth. The Stanford Encyclopedia of Philosophy entry on "Effective Altruism" also often touches upon these concepts.
