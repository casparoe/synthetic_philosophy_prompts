  The user's phrasing "why would he prefer that convergence-based formulation" shows they intuitively sense Peirce is making a philosophical choice here, not just being wordy. Good instinct. They need to understand Peirce's deep commitment to realism and anti-nominalism.

  Let me unpack Peirce's objections to James' approach: First, "what works" is too vague - works for whom? For what purpose? Peirce sees James opening the door to relativism where any satisfying belief could be "true." Second, Peirce needs truth to be independent of personal psychology - hence the "destined" opinion idea. Third, his whole theory of inquiry relies on the community correcting errors over time.

  Ah, and the user might not realize how much Peirce hated the label "pragmatism" after James popularized it. That's why he invented "pragmaticism" - the uglier term nobody would steal! That anecdote could help the user see how sharply Peirce distinguished his view.

