answer: |-
  That's an excellent question that cuts to the heart of a major (and often misunderstood) split within pragmatism. You're right that the "Peirce=community, James=individual" distinction is common in intro courses, but Peirce himself would have **vehemently rejected** the idea that his view boiled down to "truth is what works" in the way James often expressed it. Here's why he insisted on the "convergence" or "destined opinion" formulation:

  1.  **Combating Subjectivism & Relativism:** Peirce was deeply committed to **realism** – the idea that there is a real world independent of our minds, constraining our beliefs. James' "what works for the individual" phrasing terrified Peirce because it opened the door wide to subjectivism ("true for me, but not for you") and relativism ("whatever belief gets you through the day"). Peirce saw truth as **objective**. The "destined opinion" isn't destined because we *decide* it's useful; it's destined because it accurately represents **how reality actually is**, and persistent investigation *compels* us to recognize that, regardless of individual quirks or temporary needs. "Works" for James could be deeply personal and psychological; "works" for Peirce meant "successfully guides action in a way that aligns with the stubborn, external facts over the long haul."

  2.  **"Works" is Too Vague & Short-Term:** What does "works" even mean? Does a comforting illusion that gets you out of bed in the morning "work"? Does a belief that helps a dictator control a population "work"? For Peirce, the *kind* of "working" that matters is **successful prediction and control over the long term, guided by logical norms and experimental testing**. James' focus on "cash value" and satisfying individual needs felt too loose, too psychological, and too focused on immediate practical payoff. Peirce was thinking about the ultimate success of the entire scientific enterprise across generations. The "end of inquiry" formulation forces us to consider the *ultimate consequences and stability* of a belief, not just its immediate utility.

  3.  **Truth as the Ideal Limit of Inquiry:** Peirce viewed truth not as a static property possessed by beliefs right now, but as the **ideal goal** of the process of inquiry. The "opinion fated to be agreed upon" is the **regulative ideal** that guides scientific investigation. It's the point towards which all our efforts are aimed, even if we never perfectly reach it. Saying "truth is what works" makes truth seem like a present property of individual beliefs. Peirce's formulation emphasizes that truth is defined by the *ideal outcome* of a *process* driven by logic, experiment, and community correction. It's inherently future-oriented and process-oriented.

  4.  **Anti-Nominalism & Generality:** Peirce was a fierce opponent of nominalism (the idea that general concepts like "truth" or "reality" are just names, not real). For him, the "destined opinion" represents a real, general pattern – the *law* of how belief *would* settle *if* inquiry were pursued indefinitely. This "would-be" is a real feature of the universe for Peirce. Reducing truth to "whatever works" for someone right now strips it of this general, law-like character and reduces it to a collection of individual instances.

  5.  **Preserving the Normative Force of Truth:** Peirce needed a concept of truth that genuinely **binds** inquirers. If truth is merely "what works for me now," why *should* I change my mind when confronted with contrary evidence? The "destined opinion" formulation provides a strong normative pull: we *ought* to believe what the community *would* eventually settle on, because that *is* reality. It gives us a reason beyond personal convenience to correct errors and seek better evidence. It makes truth a standard *against* which current beliefs can (and often *should*) be found wanting.

  **Why the Course Framing is Misleading (and Why Peirce Got Mad):**

  The course framing presents James' "what works" as the core pragmatic theory, with Peirce offering a minor tweak about community. Peirce saw it the **opposite** way. He believed James had **hijacked and corrupted** his original, rigorously logical and scientific concept of pragmatism into something dangerously subjective and psychological.

  He famously renamed his own doctrine "**pragmaticism**" because he said the term "pragmatism" had become too associated with James' version, which he found philosophically sloppy and unacceptable. His insistence on the convergence definition wasn't just a preference; it was a **fundamental rejection** of the subjectivist implications he saw in James' simpler phrasing.

  **In short for your paper:** Peirce didn't just prefer the convergence definition; he saw it as **essential** to prevent pragmatism from collapsing into subjectivism and relativism. For Peirce, "truth is what works" (in James' sense) was a disastrous misstatement. Truth *results* in successful action *because* it corresponds to reality – a reality whose nature forces the community of inquirers, applying scientific methods persistently and self-correctingly, to converge on a single, stable belief in the ideal long run. The convergence *is* the proof of its objectivity, its independence from individual whim, and its status as the proper goal of inquiry. That's why he clung to it so fiercely.
