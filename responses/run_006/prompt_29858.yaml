prompt: |-
  Okay so I started a new job a few weeks ago doing pricing and demand modeling for a company, and I keep butting heads with my manager about the model we use. The model literally assumes every customer knows all the prices and their own preferences and does a full utility maximization every single time they buy anything. I said in a meeting that this seems obviously false as a description of actual shoppers, and my manager kind of rolled his eyes and said that's just Friedman's F-twist — assumptions don't need to be realistic if the model predicts well. I'd never heard the term before so I looked it up, and now I'm even more annoyed because it seems like a lot of smart people actualy take this seriously.

  Could you write out the strongest possible argument against the F-twist — the view that unrealistic assumptions in a scientific model don't matter as long as the model's predictions are accurate? I'm not looking for a balanced overview; I want a real case for why the realism of assumptions should matter, with the best objections you can think of. If there's a particularly sharp version of the pro-F-twist side that I'd need to respond to, you can flag it briefly, but mostly I need the anti-F-twist argument.
