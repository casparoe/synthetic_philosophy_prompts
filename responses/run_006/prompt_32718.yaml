  - **No (filling-in happens, but not via probabilities)** → **Leaf: Gibsonian/ecological direct-perception**.  
    *Note: Rejects inference, but accepts that perception organizes sensory data directly (e.g., via affordances).*  

  #### **3. When a tennis player adjusts their racket mid-swing to compensate for a ball's spin, is this adjustment driven by the *same mechanism* that corrects perceptual errors (e.g., updating predictions)?**  
  - **Yes (action minimizes prediction errors)** → Go to 4.  
  - **No (action uses separate motor-control systems)** → **Leaf: Literal predictive coding**.  
    *Note: Perception involves inference, but action is distinct (e.g., classic predictive coding).*  

  #### **4. Is the predictive machinery (for perception/action) *just a useful model* for brains, or does it describe a *fundamental law* governing all life (e.g., bacteria avoiding toxins)?**  
  - **Useful model for brains only** → **Leaf: Active inference**.  
  - **Fundamental law for all life** → Go to 5.  

  #### **5. Does a bacterium avoiding toxins *literally represent* "toxins" as a hidden cause?**  
  - **Yes (all life does inference with content)** → **Leaf: Free energy principle (universal)**.  
  - **No (minimizing free energy ≠ representation)** → Go to 6.  

  #### **6. In the brain, does minimizing free energy require *contentful representations* (e.g., neurons encoding "cat")?**  
  - **Yes** → **Leaf: Free energy principle (universal)**.  
    *Note: Universal FEP with neural representations.*  
  - **No** → **Leaf: Free energy principle (universal, non-representational)**.  
    *Note: Formalism applies universally, but no contentful representations (e.g., dynamics are "just physics").*  

  #### **7. When catching a fly ball, does the player *directly perceive* where to run without internal models?**  
  - **Yes (information is directly in the environment)** → **Leaf: Gibsonian/ecological direct-perception**.  
  - **No (perception-action is coupled dynamically, but not direct)** → Go to 8.  

  #### **8. Is predictive processing a *literal neural mechanism* or a *useful fiction* for explaining behavior?**  
  - **Literal mechanism** → *Contradiction* → *No one holds this!*  
    *Reason: Enactivists reject neural representations; literal PP requires them.*  
  - **Useful fiction** → Go to 9.  

  #### **9. Can the free energy formalism describe bacteria, even if brains *don't* do inference?**  
  - **Yes** → **Leaf: Free energy principle (universal, non-representational)**.  
  - **No (formalism only applies to brains)** → Go to 10.  

  #### **10. Is perception "inferential" *in any sense* (e.g., as pattern-completion)?**  
  - **Yes (but not probabilistic)** → **Leaf: Bayesian brain (computational-level)**.  
    *Note: Brain approximates Bayesian inference, but no commitment to implementation.*  
  - **No (perception is non-inferential sensorimotor coupling)** → **Leaf: Radical enactivism**.  

  ---

  ### **Key Ambiguities & Notes**  
  1. **Bayesian brain (computational) vs. Instrumentalist 'as-if' view**:  
     - Both answer "useful fiction" in Q8 and "no" to Q9, but split at Q10.  
     - *Ambiguity*: These are hard to split cleanly. The computational view treats PP as a *true* description of brain function (abstractly), while instrumentalism sees it as *merely useful*. The tree uses Q10 to force a distinction: computational-level accepts perception as inferential; instrumentalism might reject it.  

  2. **Gibsonian vs. Radical enactivism**:  
     - Both reject inference (Q1: "no" to filling-in).  
     - *Ambiguity*: Gibsonians answer "yes" to direct perception (Q7), while enactivists answer "no". Enactivists see perception as "enacted" via sensorimotor engagement, not direct pickup.  

  3. **Literal predictive coding vs. Active inference**:  
     - Cleanly split by action (Q3). If action uses prediction-error minimization, it’s active inference; if separate, it’s literal predictive coding.  

  4. **Universal FEP non-representational**:  
     - Explicitly captured (Leaf at Q6 and Q9). Avoids conflating with enactivism by requiring acceptance of the FEP formalism (Q9).  

  5. **Empty/obscure positions**:  
     - PP as literal neural mechanism + enactivist (Q8→"literal" + Q1→"no") is incoherent (rejected by both sides).  
     - Universal FEP with no representations *and* no formalism (Q9→"no" + Q10→"no") is unsupported.  

  ---

  ### **Tree Logic & Position Mapping**  
  | **Key Questions**                                                                 | **Combinations**                                                                                                                                                               | **Positions**                                                                                              |  
  |-----------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------|  
  | **1. Perception inferential?** (Occlusion: filling-in?)                           | Yes → Inference-based positions. No → Direct/enactive positions.                                                                                                              | Splits inferentialists (PP, FEP) from non-inferentialists (Gibsonian, enactivism).                         |  
  | **2. Literal probabilistic inference?** (Filling-in via probabilities?)           | No → Gibsonian (non-inferential organization). Yes → PP/FEP positions.                                                                                                        | Isolates Gibsonians who accept "organization" but reject inference.                                        |  
  | **3. Action via prediction-error?** (Tennis adjustment)                           | Yes → Active inference. No → Literal predictive coding (action separate).                                                                                                     | Splits PP into perception-only vs. perception-action unification.                                          |  
  | **4. Scope: Brains only or universal?** (Bacteria FEP?)                           | Brains → Active inference. Universal → FEP positions.                                                                                                                         | Isolates brain-specific active inference from universal FEP.                                               |  
  | **5. Representations in simple life?** (Bacteria "represents" toxins?)            | Yes → Universal FEP (representational). No → Universal FEP (non-representational).                                                                                            | Splits FEP into representational vs. non-representational.                                                 |  
  | **6. Representations in brains?** (Brain encodes "cat"?)                          | Yes → Universal FEP (representational). No → Universal FEP (non-representational).                                                                                            | Ensures non-representational FEP isn’t misclassified as enactivism.                                        |  
  | **7. Direct perception?** (Catching a fly ball)                                   | Yes → Gibsonian. No → Enactivism or instrumentalism.                                                                                                                          | Splits Gibsonian (direct) from enactivism (sensorimotor).                                                  |  
  | **8. PP literal or as-if?** (Neural prediction errors?)                           | Literal → Contradiction for non-inferentialists. As-if → Computational/instrumental.                                                                                          | Flags incompatibility; routes to computational/instrumental.                                               |  
  | **9. FEP applies to non-brains?** (Bacteria FEP formalism?)                       | Yes → Non-representational FEP. No → Computational/instrumental or enactivism.                                                                                                | Captures non-representational FEP and distinguishes from computational/instrumental.                       |  
  | **10. Perception inferential at all?** (Pattern-completion as inference?)         | Yes → Bayesian brain (computational). No → Radical enactivism or instrumentalism.                                                                                             | Splits computational (inferential) from enactivism (non-inferential).                                      |  

  This tree ensures:  
  - **Non-representational FEP** is distinct from enactivism (via Q9 formalism).  
  - **Instrumentalist** views are separated from computational-level via Q10 (inference) and Q9 (scope).  
  - **Gibsonian vs. enactivist** ambiguity is flagged but split via direct perception (Q7).  

  Use this to clarify debates—it exposes where disagreements stem from foundational assumptions!
