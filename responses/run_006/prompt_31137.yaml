prompt: |-
  I've been working through my own intuitions about intentional action after reading some experimental philosophy on side-effect cases, and I'm writing a short piece for a seminar. I want to make sure I'm not just rationalizing a mess of case-specific reactions, so I'd like help extracting the principle behind my verdicts, if there is one. Act as a philosopher of mind and action who works on intentional action and the methods of experimental philosophy. Think through each case individually first, then brainstorm candidate principles before settling on the best one or two, and write in American English.

  Here are the cases, with my honest verdicts. (1) A vice president is told that a new manufacturing plan will increase profits and, as a side effect, damage a nearby river. He says, "I don't care about the river; launch the plan." The plan is launched and the river is damaged. I say he damaged the river intentionally. (2) A different vice president is told the same plan will increase profits and, as a side effect, clean up a nearby river. She says, "I don't care about the river; launch the plan." The plan is launched and the river is cleaned up. I say she did not clean up the river intentionally. (3) A third vice president is told the plan will increase profits and damage the river. She says, "I hate that it will damage the river. Go ahead, but minimize the damage and document everything for remediation." I find myself not wanting to say she damaged the river intentionally, or at least far less than in (1). (4) A surgeon performs a novel operation to save a patient's life, knowing that as a side effect it will leave a distinctive scar pattern that colleagues will immediately recognize as her handiwork and that will enhance her reputation. She is indifferent to the reputation. I say she left the scar intentionally. (5) An office manager installs new software knowing it will speed up billing and, as a side effect, shift which department handles late accounts. She has no views about the shift either way. I say she intentionally shifted which department handles the accounts. (6) A junior manager is ordered by the board to implement the plan that will damage the river. He objects, but is told he will be fired if he refuses. He implements it, knowing the damage will occur. I say he did not damage the river intentionally, or at least I am much less willing to say he did than in (1).

  Is there one principle that gets all six of these, or close? I can see at least two places where my verdicts pull against each other: (1) and (6) differ even though the foreseen harm is the same, and (2) and (4) differ even though both involve a good side effect the agent doesn't care about. A simple "foreseen equals intentional" rule fits some cases but not others; a simple "bad side effect equals intentional, good side effect equals not" rule fits (1) and (2) but not (3), (4), or (5). State the best candidate principle precisely, show how it handles each case, say what it predicts about cases I haven't listed (for example, a harmful side effect the agent didn't know about, a good side effect the agent actively wanted, a bad side effect produced clumsily, a neutral side effect the agent regrets), and tell me honestly which of my verdicts the principle cannot accommodate and which one or two I would have to revise under it. Please also separate what the empirical literature on folk judgments actually shows from what is a contested philosophical interpretation of it, and don't present a contested interpretation as the consensus.
reasoning: |-
  Okay, let's tackle this user's problem. They're working on intentional action based on side-effect cases and have six scenarios with their own verdicts. The goal is to find a unifying principle that explains all six without contradictions. 

  First, I need to understand each case individually. The user’s verdicts show patterns: in (1) the VP intentionally harms the river by not caring, but in (2) the same indifference doesn't make cleaning intentional. Case (3) shows reluctance to call it intentional even when harm occurs but the agent tries to minimize it. (4) has an indifferent surgeon causing a scar, yet the user says it's intentional. (5) a neutral side effect is deemed intentional, and (6) coercion makes the harm unintentional despite knowledge.

  The challenge is reconciling these. Simple rules like foresight or valence (good/bad) don't work. For example, foresight fits (1), (5), (6) but not (2) or (4). Valence fits (1) and (2) but fails (3)-(6). 

  The key might be in the agent's attitude toward the outcome. Notice in (1), (4), (5) the agent is indifferent or non-opposed, and the user calls it intentional. In (2) indifference to a good outcome isn't intentional. In (3) and (6), the agent opposes or regrets the outcome, making it unintentional. 

  So, perhaps the principle hinges on whether the outcome is non-opposed by the agent. Non-opposition includes indifference or acceptance without resistance. This explains (1): the VP doesn't oppose the harm, so intentional. (2): non-opposition to a good outcome isn't sufficient for intentionality—maybe because intentionality requires the outcome being part of the plan or directly caused, but here the cleaning isn't integrated into the plan. 

  Case (4) is tricky. The surgeon is indifferent to the scar, but the user says intentional. Here, the scar is a direct result of the surgery method, almost inherent to the action. So maybe the principle needs to account for whether the side effect is a necessary component of the means used. The surgeon's method produces the scar unavoidably, making it intentional despite indifference. 

  In (5), shifting departments is a direct side effect of the software installation, and the agent doesn't oppose it, so intentional. (6) coercion: the agent actively opposes the harm but is forced, so not intentional. (3) the VP takes steps to minimize harm, showing opposition, hence not intentional. 

  But why is (4) intentional while (2) isn't? Both involve indifference. The difference might be in the outcome's relation to the action. In (4), the scar is a byproduct of the surgical technique, integral to the procedure. In (2), cleaning the river is a separate consequence, not part of the method. So maybe the principle is about non-opposition plus the outcome being a direct consequence of the chosen means. 

  So the candidate principle: An agent intentionally brings about a foreseen side effect if (a) they do not oppose its occurrence, and (b) it results from the means they deliberately employ to achieve their goal. 

  Testing this: (1) VP doesn't oppose harm, and harm results from the manufacturing plan (means), so intentional. (2) Doesn't oppose cleaning, but cleaning isn't a result of the means—just a side effect. So not intentional. (3) Opposes harm, so not intentional. (4) Scar results from surgical technique (means), non-opposed, intentional. (5) Department shift results from software (means), non-opposed, intentional. (6) Opposes harm, so not intentional. 

  This handles all six. The user might need to accept that in (2), the cleaning isn't intentional because it's not a direct consequence of the means, just a collateral effect. In (4), the scar is directly tied to the surgery method, making it intentional despite indifference. 

  Empirically, studies like Knobe show that bad outcomes are more likely judged intentional. But the user's verdicts go beyond valence, incorporating elements like opposition and means. The principle here aligns with some philosophical accounts like the one by Joshua Knobe that emphasize the agent's attitude but adds the means component to distinguish (2) and (4).
answer: |-
  Based on your verdicts and standard philosophical analysis, the principle that best explains your pattern is **Non-Opposition + Means Integration (NOMI)**:

  > An agent intentionally brings about a foreseen side effect E if and only if:  
  > (1) The agent does not oppose E's occurrence (allowing indifference or weak acceptance), *and*  
  > (2) E results from the means deliberately chosen to achieve the primary goal (i.e., E is a direct causal consequence of the action plan).

  ### How NOMI Handles Your Cases:
  1. **Harmful River VP (Intentional)**:  
     - *Non-opposition*: "I don't care" shows no opposition.  
     - *Means integration*: Damage directly results from the manufacturing plan itself.  
     → **Matches your verdict**.

  2. **Beneficial River VP (Not Intentional)**:  
     - *Non-opposition*: "I don't care" satisfies condition (1).  
     - *Means integration failure*: River cleanup isn't produced *by the means* of profit-making; it's a collateral consequence.  
     → **Matches your verdict**.

  3. **Reluctant VP (Not Intentional)**:  
     - *Opposition*: "I hate that it will damage" + minimization efforts show active opposition.  
     → **Matches your verdict** (condition 1 fails).

  4. **Surgeon's Scar (Intentional)**:  
     - *Non-opposition*: Indifference satisfies (1).  
     - *Means integration*: The scar is a direct, inherent outcome of her surgical technique.  
     → **Matches your verdict**.

  5. **Software Shift (Intentional)**:  
     - *Non-opposition*: No views imply no opposition.  
     - *Means integration*: Department shift is a direct causal result of installing the software.  
     → **Matches your verdict**.

  6. **Coerced Junior Manager (Not Intentional)**:  
     - *Opposition*: Objecting + implementing only under duress shows opposition.  
     → **Matches your verdict** (condition 1 fails).

  ---

  ### Predictions for Unlisted Cases:
  - **Harmful side effect agent didn't know about**: Not intentional (lacks foresight).  
  - **Good side effect agent actively wanted**: Likely intentional (non-opposition + possible means integration).  
  - **Bad side effect produced clumsily**: Unclear, but NOMI *could* say intentional if conditions (1)-(2) hold (e.g., if clumsiness doesn't negate means integration).  
  - **Neutral side effect agent regrets**: Not intentional (regret implies opposition).

  ---

  ### Empirical vs. Philosophical Context:
  - **Empirical consensus (folk judgments)**:  
    - Valence asymmetry: Harmful side effects are judged intentional more often than beneficial ones (Knobe effect).  
    - Factors like *attitude* (e.g., "I don't care") and *personal force* (e.g., coercion) modulate judgments.  
  - **Contested interpretations**:  
    - Whether valence itself is a core component (NOMI avoids this).  
    - Whether "means integration" is necessary (some scholars argue foresight + non-opposition suffices).

  ---

  ### Required Revisions to Your Verdicts:
  NOMI **fully accommodates all six cases** without revision. However, it exposes a tension in your reasoning:  
  - **Why (4) is intentional but (2) is not**: NOMI resolves this via means integration (scar is inherent to surgical *method*; cleanup isn't inherent to profit-making).  
  - **Why (5) differs from (2)**: The software shift is a direct system effect, while river cleanup is environmentally collateral.

  ---

  ### Strengths and Limitations of NOMI:
  - **Strength**: Explains valence asymmetry *without* making valence necessary (e.g., neutral case 5 is intentional).  
  - **Limitation**: "Means integration" may be underspecified. Is the scar in (4) truly part of the *means* or just a byproduct? Philosophical debates persist here (e.g., whether causal proximity suffices).

  If you adopt NOMI, your verdicts hold. If you reject means integration, you'd need to revise case (2) or (4) to avoid inconsistency. I recommend testing NOMI against new cases (e.g., "a CEO implements a plan that unavoidably beautifies a building he dislikes but doesn't oppose").
