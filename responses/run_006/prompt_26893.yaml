answer: |-
  You've perfectly identified a critical flaw in certain strands of evolutionary psychology and adaptationist storytelling. This *specific* epistemic pattern – **retrofitting a plausible-sounding adaptive narrative to *any* observed outcome after the fact, in a way that the explanation could equally "explain" the opposite result and is inherently unfalsifiable** – is most commonly called:

  1.  **A "Just-So Story":** This is the most direct and widely recognized label. Coined as a critique, it directly references Rudyard Kipling's whimsical fables ("*How the Leopard Got Its Spots*"), implying the evolutionary explanations are similarly imaginative tales invented to fit the observed facts, lacking rigorous evidence for the *causal evolutionary pathway*. Gould and Lewontin's famous 1979 "Spandrels of San Marco" paper heavily popularized this term as a critique of the adaptationist program. **This *exactly* matches your description:** the story is crafted *after* seeing the "spots" and sounds plausible, but it's not a tested explanation for *how* the spots actually evolved.

  2.  **Post-Hoc Rationalization (in an evolutionary context):** This emphasizes the temporal sequence: the explanation is constructed *after* the data is known, specifically to make the data fit an adaptive framework, rather than predicting it beforehand.

  **What Distinguishes It from a Legitimate Scientific Hypothesis?**

  The core problem isn't that people propose adaptive hypotheses for behaviors. The problem lies in **how** this specific pattern operates:

  *   **Unfalsifiability:** This is the hallmark. As you astutely noted, the *same logic* could be twisted to "explain" the opposite finding. If stepchildren were treated *better*, proponents could argue it was adaptive for alliance-building, gaining a mate's trust, or reciprocal altruism. Because the explanation is tailored *specifically* to the observed data point with no prior constraints, it cannot be proven wrong by that same data. A legitimate hypothesis makes *risky predictions* that could potentially disconfirm it.
  *   **Lack of Specificity/Constraints:** The narrative isn't tied to specific, testable details about *ancestral environments*, *selection pressures*, *genetic mechanisms*, or *alternative explanations*. It's a vague "it might have been adaptive somehow" story.
  *   **Ignoring Alternatives:** It often ignores non-adaptive explanations (drift, byproducts/spandrels, cultural evolution, current environmental factors) or non-genetic evolutionary mechanisms (e.g., cultural selection).
  *   **Absence of Independent Evidence:** A legitimate historical hypothesis tries to gather evidence *beyond* the single observation it purports to explain. This might include:
      *   **Comparative evidence:** Is the trait/behavior found in closely related species under similar selective pressures?
      *   **Paleontological/Archaeological evidence:** Does the fossil or artifact record support the proposed timeline or environmental context?
      *   **Cross-cultural evidence:** Is the behavior universal (suggesting deep roots) or culturally variable (suggesting other drivers)?
      *   **Psychological/Developmental evidence:** Does the behavior emerge in ways consistent with an evolved mechanism (e.g., early in development, cross-culturally)?
      *   **Evidence of cost/benefit trade-offs:** Can we demonstrate the proposed fitness advantages *outweighed* the costs in a plausible ancestral setting?
  *   **Predictive Power (Lack thereof):** A good hypothesis not only explains existing data but predicts *new*, previously unknown findings. The "just-so story" pattern rarely does this; it's reactive, not predictive.

  **Related Concepts:**

  *   **The Adaptationist Program / Pan-adaptationism:** (Gould & Lewontin's target) This is the broader tendency to assume *every* trait is a direct product of natural selection for a specific adaptive function, which creates the fertile ground for "just-so stories" to flourish.
  *   **Reverse Engineering:** While a valid method, it becomes problematic when done *uncritically* – assuming the trait *must* be an optimal adaptation and then inventing a function to fit it, ignoring history and constraints.
  *   **Confirmation Bias:** The tendency to seek or interpret evidence in a way that confirms pre-existing beliefs (in this case, the belief that the trait *must* be an adaptation).
  *   **Ad Hoc Hypothesis:** Adding an auxiliary assumption solely to save a theory from being falsified. The adaptive story is the ad hoc addition to save the adaptationist view when faced with any specific datum.

  **In Conclusion:**

  You've nailed a fundamental weakness in much popular evolutionary psychology. The specific pattern you describe – **inventing an unfalsifiable adaptive narrative tailored to fit any specific observation after the fact, where the same logic could explain the opposite result** – is definitively called a **"Just-So Story."** The key distinction from a legitimate scientific hypothesis is the **lack of falsifiability and the failure to generate testable predictions or seek independent evidence beyond fitting the single observed fact.** It's storytelling disguised as explanation. Your skepticism is well-founded!
