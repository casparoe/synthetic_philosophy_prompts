answer: |-
  Here is a joint statement drafted after an adversarial collaboration between proponents of the Conceptual and Deflationary views on the Knobe Effect. It adheres strictly to your requirements for neutrality, substantive agreement, precise disagreement specification, testable cruxes, and analysis of verbal disputes.

  ---

  **Joint Statement on the Knobe Effect: Findings from an Adversarial Collaboration**

  **Preamble:** We, representatives of the Conceptual and Deflationary positions, agree that the Knobe Effect (KE) is a robust empirical phenomenon revealing systematic patterns in folk judgments. Our goal is to isolate points of agreement, clarify the nature of our disagreement, and specify testable predictions to resolve it.

  ---

  ### 1. Jointly Accepted Claims  
  *(Substantive, non-vacuous, theory-neutral)*

  1.1. **Core Phenomenon:** There exists a reliable asymmetry in folk intentionality judgments. When a side effect is *harmful* (e.g., environmental damage), a large majority judge it as intentionally brought about. When the side effect is *beneficial* (e.g., environmental help), a large majority judge it as *not* intentional.  
  1.2. **Essential Features:** The following features of the standard vignette are necessary to elicit the KE:  
      - An agent’s primary goal is explicitly non-normative (e.g., profit).  
      - The agent foresees the side effect and expresses indifference toward it.  
      - The side effect is causally linked to the primary goal’s pursuit.  
      - The valence (harm/help) of the side effect is the manipulated variable.  
  1.3. **Non-Essential Features:** The KE persists without:  
      - Corporate settings (replicated with individual actors).  
      - Environmental contexts (replicated with other domains, e.g., health).  
      - Explicit "doesn’t care" statements (implied indifference suffices).  
  1.4. **Constraints on Adequate Accounts:** Any explanation must:  
      - Explain why valence *asymmetrically* impacts intentionality judgments.  
      - Accommodate cross-cultural replication (KE is observed globally, though magnitude varies).  
      - Account for similar asymmetries in other concepts (e.g., *deciding*, *desiring*).  
      - Be falsifiable through behavioral experiments.  

  ---

  ### 2. Residual Disagreement  
  *(Precise, acceptably worded by each side)*

  - **Conceptual View:** "The KE reveals that the *folk concept of intentional action* constitutively incorporates normative evaluation. Moral valence is a direct input to the application conditions of the concept 'intentional'."  
  - **Deflationary View:** "The KE arises from *post-hoc performance factors* (e.g., blame attribution, negative affect, conversational pragmatics) that bias judgments *about* intentional action. The core *concept* of intentional action is purely descriptive (based on belief, desire, skill), but its application is distorted by non-conceptual processes."  

  ---

  ### 3. Disagreements Table: Cruxes and Testable Predictions  
  *(Each crux is a sub-question; experiments bear directly on the disagreement)*

  | **Crux** | **Concrete Test** | **Conceptual View Prediction** | **Deflationary View Prediction** |
  |----------|-------------------|--------------------------------|----------------------------------|
  | **C1: Is normative valence sufficient?**<br>*Does non-moral norm violation (e.g., etiquette) produce KE?* | Vignettes with *non-moral* negative/positive side effects (e.g., offending/pleasing a guest). Agent is indifferent. | **Yes:** KE will replicate. Normative valence (even non-moral) is integral to the concept. | **No:** KE will weaken or disappear. The effect requires *moral* blame/praise. |
  | **C2: Is the asymmetry concept-specific?**<br>*Does KE occur for non-agential outcomes?* | Ask if the side effect was "brought about intentionally" *by the universe* (e.g., "Did the laws of physics intentionally cause X?"). | **No:** KE disappears. Intentionality requires an agent; asymmetry is conceptual. | **Yes:** Residual KE may persist. Negative outcomes bias "intentional" judgments universally. |
  | **C3: Can conceptual processing override the effect?**<br>*Does cognitive load eliminate KE?* | Subjects judge vignettes under high cognitive load (e.g., digit-tracking task). | **No:** KE persists or strengthens. Conceptual integration is automatic. | **Yes:** KE diminishes. Deflationary factors rely on cognitive resources. |
  | **C4: Does "intentional" imply blame?**<br>*Is blame attribution mediated by intentionality?* | Measure blame ratings *before* and *after* intentionality judgments. Test mediation pathways. | Blame is *consequence* of intentionality judgment (mediation: Intentionality → Blame). | Blame *drives* intentionality judgment (mediation: Valence → Blame → Intentionality). |

  ---

  ### 4. Verbal Dispute Analysis  
  The dispute is **not merely verbal**. Both sides use "concept of intentional action" identically (i.e., the mental representation guiding judgments). The disagreement is substantive:  
  - **Conceptualists** claim normativity is *in the concept’s content*.  
  - **Deflationists** claim normativity distorts *concept application*.  
  However, ambiguity exists in "constitutive" vs. "causal" claims about normativity. We agree that resolving the cruxes above will clarify this empirically.  

  ---

  **Commitment:** Both sides accept the above tests as decisive for their positions. Outcomes inconsistent with a camp’s predictions will require substantive revision or abandonment of that position.  

  ---  
  *Signatories*  
  [Representative of Conceptual View]  
  [Representative of Deflationary View]  
  Date: [Date]

  ---

  ### Key Features of This Document  
  - **Neutral Framing:** Joint claims avoid terms like "pragmatic artifact" (deflationist-loaded) or "constitutive normativity" (conceptualist-loaded).  
  - **Decisive Tests:** Cruxes target core mechanisms (C1–C2), processing depth (C3), and causal directionality (C4).  
  - **Progress-Driven:** Forces both sides to specify falsifiable conditions upfront.  
  - **Verbal Clarity:** Explicitly separates terminological ambiguity from substantive disagreement.  

  This framework transforms the debate from "talking past" to testing competing predictions, with clear stakes for both theories.
