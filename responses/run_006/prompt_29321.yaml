prompt: |-
  I'm trying to get clear on when someone lacks standing to blame — you know, the whole "who are you to talk" thing. Here are my gut reactions on a bunch of cases, and I want to know if there's a principle that gets all or most of them.

  1. My friend Alex cheated on his wife for years. Last week he got furious at a coworker who had a one-night affair and called him a selfish bastard. I think Alex has no standing here. That one's easy.

  2. But here's a harder one: my sister smoked for a decade, quit five years ago, and now she's on her teenager's case about vaping. I feel like she does have standing, even though she did the same kind of thing. The fact that she quit and regrets it seems to matter.

  3. A politician votes for a war that kills thousands, then later condemns another politician for authorizing a drone strike that kills dozens. I want to say he lacks standing — the hypocrisy is too much — but I'm not sure if it's because the wrongs are similar in kind or because his was worse. Or both.

  4. Someone who has never stolen anything but knows in their bones they would steal if they were desperate enough blames a shoplifter. My instinct is that this person does have standing — you don't lose standing just for having a bad character you never acted on. But I'm not confident about this one at all.

  5. A boss who regularly berates employees in private blames a colleague for yelling at an intern in public. I feel like the boss lacks standing even though the wrongs are different in some obvious ways — one is private, one is public. So maybe the domain matters less than I thought?

  6. Here's one that really bothers me: a friend who drove drunk exactly once, twenty years ago, and has been ashamed of it ever since, hears about someone getting a DUI and says nothing publicly but tells me privately the guy is reckless. I think my friend has standing to make that judgment, at least to me. But if he posted about it on Facebook I'd feel differently. So maybe standing is partly about the audience or the forum?

  7. Last one: a vegan who used to eat meat blames a meat-eater for supporting factory farming. I think the vegan has standing — the fact that they changed makes the blame more credible, not less. But I can't articulate why this feels different from Alex in case 1.

  Is there a single principle that handles all of these? I'm especially stuck on why case 2 (ex-smoker) and case 7 (vegan) feel like they have standing while case 1 (cheater) doesn't, when in all three the blamer did the same kind of thing. And I can't tell whether my verdict on case 4 (the would-be thief) is right or whether I should flip it. Give me the best principle you can, tell me which of my verdicts it forces me to abandon, and test it on a case I haven't thought of.
reasoning: |-
  Okay, let me try to work through this user's query step by step. They're exploring the concept of moral standing in blame, presenting several cases where their intuition says someone either has or lacks the standing to blame others. The core puzzle is why in some cases (like the ex-smoker or vegan) past wrongdoing doesn't undermine standing, while in others (like the serial cheater) it does. 

  First, I notice the user is clearly philosophically inclined—they're constructing nuanced thought experiments and self-critiquing their own intuitions. That's sophisticated. Their frustration point seems to be reconciling cases 1, 2, and 7: all feature past identical misconduct, yet their gut says standing exists only in 2 and 7. 

  Hmm. The obvious difference is repentance and reform. Alex (case 1) is actively cheating while blaming others, whereas the ex-smoker and vegan have changed. But case 6 complicates this—the drunk driver reformed yet the user feels public blame would be illegitimate. That suggests publicity matters. And case 4 (the would-be thief) introduces hypothetical wrongdoing, testing whether moral potential rather than actual acts affects standing. 

  The user's own framing hints at key variables: hypocrisy (case 3), audience (case 6), severity comparison (case 5), and time passed (case 6). But no single factor explains all cases. For instance, the politician (case 3) likely reformed his views, yet the user still denies standing—probably because the scale of harm dwarfs the drone strike he condemns. 

  I recall philosophical work on standing—Scanlon's hypocrisy focus, Wallace's authority condition—but they don't fully resolve these cases. Maybe a dual principle is needed: blame requires both clean hands (no ongoing/past unaddressed misconduct) and proportional authority (your credibility isn't drowned out by worse acts). 

  Testing this: Alex fails clean hands (current cheating). Ex-smoker passes both (reformed, lesser harm). Politician fails proportional authority (his war was catastrophic). Boss fails clean hands (ongoing abuse). Would-be thief passes clean hands (no actual theft) but might fail proportionality if his hypothetical theft was severe? Case 6's reformed drunk driver passes clean hands but might fail proportionality if shaming publicly—ah, that explains the audience sensitivity! 

  Biggest tension is case 4. The user thinks standing exists, but if the would-be thief imagined massacring orphans to steal, his blame of a shoplifter might feel disproportionate. So severity matters even for hypotheticals. 

  New test case: A former bully now condemns schoolyard teasing. If he's genuinely reformed, clean hands pass. But if his past bullying caused a suicide, his authority to blame minor teasing collapses—proportionality fails. 

  User might need to adjust case 4 verdict if we consider imagined wrongdoing severity, or accept that clean hands alone suffice for minor cases. Alternatively, distinguish between having standing versus exercising it wisely—the would-be thief can blame but should be humble. 

  This is messy but philosophically honest. The dual principle covers most cases if we allow "proportional authority" to incorporate audience/publicity factors (case 6) and severity comparisons (cases 3,5). User's case 4 intuition might hold only for trivial blame—otherwise it's unstable.
answer: |-
  You've hit on a deep philosophical puzzle about **moral standing** (or "standing to blame"). Your intuitions mostly align with prominent ethical theories (like those of Scanlon, Wallace, and Coates), but no single principle perfectly captures every case. The best unifying framework is:

  **The Dual Principle of Moral Standing:**
  1.  **Clean Hands Requirement:** The blamer must not be *currently engaged in*, or *unrepentantly complicit with*, the *same type or category* of wrongdoing they are condemning. Hypocrisy destroys standing.
  2.  **Proportional Moral Authority Requirement:** The blamer's past relationship to wrongdoing (including its severity, recency, repentance, and reform) must not be so bad that it *drowns out their credibility* or *makes the blame disproportionate* in the specific context (audience, severity of the act blamed, power dynamics).

  **Applying the Principle to Your Cases:**

  1.  **Alex the Cheater:** **Lacks Standing.**
      *   *Clean Hands:* He is *currently* and *actively* engaging in the *exact same* wrongdoing (serial cheating). Clear violation.
      *   *Moral Authority:* His hypocrisy is blatant and ongoing. Zero credibility.

  2.  **Ex-Smoker Sister:** **Has Standing.**
      *   *Clean Hands:* She is *not currently* smoking. Her past act is distinct from her current stance.
      *   *Moral Authority:* Her repentance, reform (quitting), and personal experience *enhance* her credibility on the harms of smoking/vaping. Her past doesn't drown out her current moral position. She speaks from reformed understanding.

  3.  **Politician (War vs. Drone Strike):** **Lacks Standing.**
      *   *Clean Hands:* While the *specific acts* differ (war vote vs. drone strike), they fall under the broad category of "authorizing lethal military force causing civilian casualties." If he hasn't repudiated his own vote or shown why the contexts are morally distinct *in a way that absolves him*, he's arguably complicit in the same *type* of wrong.
      *   *Moral Authority:* The sheer *scale* and likely greater *moral gravity* of his own action (thousands killed vs. dozens) completely drowns out his authority to condemn the lesser (but still grave) wrong. His blame feels grotesquely disproportionate.

  4.  **Would-Be Thief:** **Has Standing (but weakened).**
      *   *Clean Hands:* They have *never actually committed* the wrongdoing (theft). They are not hypocritical in action.
      *   *Moral Authority:* This is the trickiest. Their *acknowledged bad character* ("I would steal if desperate") significantly *weakens* their moral authority. They lack the experiential credibility of the ex-smoker/vegan and the blamelessness of a truly virtuous person. However, since they haven't *acted*, their standing isn't *destroyed* like Alex's. They can blame, but their judgment carries less weight and should be offered with humility. **(Your instinct holds, but it's precarious).**

  5.  **Abusive Boss:** **Lacks Standing.**
      *   *Clean Hands:* He is *currently engaged* in a very similar type of wrongdoing (verbal abuse/berating subordinates), even if the context (private vs. public) differs. The core wrong – abusing power to demean others – is the same.
      *   *Moral Authority:* His *ongoing, systematic* abuse completely destroys his authority to condemn *any* form of mistreatment by others, regardless of context. His blame is pure hypocrisy and power play.

  6.  **Reformed Drunk Driver (Private vs. Public):** **Standing Depends on Context.**
      *   *Clean Hands:* He is *not currently* drunk driving. His single past act, accompanied by lasting shame and reform, means he likely passes the clean hands test regarding *current* condemnation of drunk driving.
      *   *Moral Authority:* **Here's where audience/forum matters intensely under Proportionality:**
          *   *Privately to you:* He has standing. His personal experience and regret give his judgment weight in a private, reflective conversation. The proportionality holds – a private comment to a friend about a serious wrong (DUI) by someone with relevant, reformed experience.
          *   *Publicly on Facebook:* He likely **lacks standing** for *public* condemnation. Why? Proportionality/Authority: Public shaming carries significant weight and social consequences. His own (even reformed and regretted) commission of the *same act* undermines his authority to *publicly* castigate someone else for it. It risks appearing self-righteous or performative, exploiting the other's downfall to bolster his own reformed image. The forum amplifies the need for his moral authority to be untarnished, which it isn't quite.

  7.  **Vegan Ex-Meat Eater:** **Has Standing.**
      *   *Clean Hands:* They are *not currently* eating meat/supporting factory farming. Their past act is distinct from their current stance.
      *   *Moral Authority:* Similar to the ex-smoker. Their repentance, reform (going vegan), and understanding of the *reasons why* they changed (presumably ethical ones) *enhance* their credibility. They speak from the position of someone who understands the temptation but now rejects it on moral grounds. Their blame carries the weight of conversion.

  **Why Case 1 (Alex) Lacks Standing While Cases 2 (Smoker) & 7 (Vegan) Have It:**
  The Dual Principle explains this perfectly:
  *   **Alex:** Fails *Clean Hands* catastrophically (current, active, same wrong). His hypocrisy is immediate and undeniable.
  *   **Ex-Smoker & Vegan:** Pass *Clean Hands* (not currently doing the wrong). Pass *Moral Authority*: Their reform, repentance, and experiential knowledge *increase* their credibility regarding the specific harm they are condemning. They aren't hypocrites; they are converts warning others.

  **The Principle's Weak Spot & A Case You Should Reconsider:**
  *   **Weak Spot:** **Case 4 (Would-Be Thief)**. The principle confirms your instinct (*Clean Hands* pass because no actual theft). However, the *Proportional Moral Authority* requirement significantly weakens their standing. If their hypothetical theft involved severe harm (e.g., stealing life-saving medicine from a child), their blame of a petty shoplifter might feel *particularly* hollow and lack authority. **You might need to accept that their standing is highly conditional and weak.**
  *   **Case to Flip?** The principle strongly suggests you should reconsider the **Reformed Drunk Driver's standing for *public* blame (Case 6)**. While your instinct for private conversation is sound, the principle highlights how the public forum demands a higher degree of untarnished moral authority, which his past identical act (even with regret) undermines in that context.

  **Testing the Principle: A New Case**
  *   **The Case:** A renowned environmental activist, who flew private jets frequently in her 20s for luxury travel (contributing massively to her carbon footprint), now publicly condemns a celebrity for taking a single private jet flight to a charity event.
  *   **Application:**
      *   *Clean Hands:* She is *not currently* flying private jets for luxury (assume she now travels sustainably). The *type* of wrong (excessive CO2 emissions via private air travel) is the same, but her *current* abstinence likely passes the clean hands test.
      *   *Moral Authority:* **This is the test.** Her *past* actions were *systematic and severe* (frequent luxury flights). Condemning a *single flight for a charitable purpose* feels disproportionate. Her massive past footprint drowns out her authority to publicly shame someone for a much lesser instance of the same category of wrong, *especially* without profound, visible repentance focused on her own past excesses. She likely **lacks standing for *public* condemnation** in this specific instance. A private critique or general advocacy for sustainable travel would be different, but targeted public shaming lacks proportionality and authority. (She *would* have standing to condemn systematic luxury private jet use by billionaires, as the scale matches her past wrong and her reform gives her credibility on the *issue*).

  The Dual Principle emphasizes that standing isn't just about hypocrisy (*Clean Hands*), but also about whether the blamer's own moral history grants them the credibility and right to level *this specific blame in this specific context* (*Proportional Moral Authority*). It explains the nuances in your cases better than a single-factor approach.
