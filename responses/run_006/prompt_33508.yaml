answer: |-
  ### 1. **The Phenomenon Named**  
  This pattern is not captured by a single established term but intersects several concepts. It's best described as **symmetric strategic reasoning under common knowledge of identity**: a situation where players, knowing they are identical in preferences, information, and rationality, explicitly incorporate this symmetry into their decision-making. The closest terms are:  
  - **Symmetric Nash Equilibrium** (Nash, 1951): A solution where all players use the same strategy, but this *assumes* symmetry rather than leveraging it as reasoning.  
  - **Reflective Equilibrium in Games** (informal): Inspired by Rawlsian philosophy, it implies mutual adjustment of beliefs/actions via shared reasoning.  
  - **Group Rationality** (Sugden, 1993): When players reason as a collective, though this is non-standard.  

  Since no unified term exists, we propose **"Reflective Symmetry"** for this specific loop: *Players deduce actions by assuming their reasoning process is mirrored by others, making symmetry a premise rather than an outcome*.  

  ---

  ### 2. **How It Differs from Neighbors**  
  - **Prisoner's Dilemma (PD)**:  
    PD focuses on individual incentives dominating collective good, with defection as the unique Nash equilibrium. Reflective Symmetry *challenges* this by suggesting identical players might coordinate on mutual cooperation ("If we all reason identically, we’ll all cooperate"). PD doesn’t require symmetry of reasoning; Reflective Symmetry exploits it to potentially bypass the Nash outcome.  

  - **Common Knowledge of Rationality (CKR)**:  
    CKR (Aumann, 1976) assumes players know everyone is rational, but it often reinforces Nash equilibria (e.g., leading to defection in PD). Reflective Symmetry *adds* that players know their reasoning is identical, creating a pathway to non-Nash outcomes (e.g., cooperation) via recursive expectations ("I know you think like me, so you’ll cooperate if I do").  

  - **Focal Points (Schelling, 1960)**:  
    Focal points resolve coordination through salience (e.g., "meet at noon"). Reflective Symmetry doesn’t rely on contextual cues; it uses *pure symmetry* as the focal device. Case 1 (exactly one actor) lacks salience, making focal points ineffective, but symmetry can force a randomization solution.  

  - **Team Reasoning (Bacharach, 2006)**:  
    Team reasoning assumes players adopt a "group perspective." Reflective Symmetry is individualistic: players use symmetry to predict others’ *individual* actions ("You’ll do what I do because we’re identical"), not necessarily adopting group goals.  

  **Boundaries**:  
    - *Inside*: Symmetric games with Pareto-superior non-Nash outcomes (e.g., mutual cooperation in PD-like matrices).  
    - *Outside*: Asymmetric games, or where CKR alone suffices (e.g., dominance-solvable games).  
    - *Edge*: Cases with multiple symmetric equilibria (e.g., Battle of the Sexes); Reflective Symmetry may fail without additional cues.  

  ---

  ### 3. **What the Term Covers and What It Doesn’t**  
  **Clear Cases**:  
    - **Volunteer’s Dilemma** (Case 1): *N*-player game where one "volunteer" benefits all, but volunteering is costly. Symmetric reasoning implies randomization (e.g., volunteer with probability *1/N*), as pure strategies fail.  
    - **Coordination PD** (Case 2): A PD where players, knowing symmetry, coordinate on mutual cooperation despite individual incentives to defect.  
    - **Symmetry-Breaking Games**: e.g., "Kissing the Hanky" (Celtic folklore game where identical players must choose who acts first).  

  **Borderline Cases**:  
    - **Asymmetric Players**: If players differ subtly (e.g., risk tolerance), symmetry breaks; Reflective Symmetry doesn’t apply.  
    - **Mixed Motives**: Games like Chicken, where symmetric reasoning might suggest swerving (cooperation) but isn’t robust if players doubt others’ rationality.  

  **Subtypes**:  
    1. **Coordination-Reflective Symmetry**: For Pareto-improvement (Case 2).  
    2. **Exclusion-Reflective Symmetry**: For "exactly one winner" dilemmas (Case 1), requiring probabilistic strategies.  

  ---

  ### 4. **Open Questions**  
  Key debates remain:  
    - **Validity**: Is Reflective Symmetry a justified deviation from individual rationality? Critics argue it smuggles in team reasoning (Colman, 2003).  
    - **Equilibrium Selection**: How does it interact with traditional solution concepts? Some propose "symmetry-constrained equilibria" (Vanderschraaf, 1998).  
    - **Empirical Testability**: Do real humans use this reasoning, or is it a theoretical artifact? Experiments (e.g., symmetric PD variants) show mixed results.  
    - **Formalization**: Can it be modeled without ad-hoc assumptions? Correlated equilibrium (Aumann, 1974) or belief hierarchies offer partial tools.
