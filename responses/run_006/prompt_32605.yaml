prompt: |-
  I’m trying to work out what I actually believe about how to act when I’m morally uncertain — that is, when I’m not sure which moral theory is correct, or not sure how a moral principle applies to a particular situation. I’ve been going case by case, and my intuitive verdicts resist any simple principle. Here they are, with my rough credences in the relevant moral claims.

  **1. Factory-farmed meat.** I’m about 80% confident that factory farming causes severe suffering to beings with moral standing, and 20% confident that either animals lack the relevant consciousness or their suffering does not generate obligations. I judge that eating factory-farmed meat is wrong. The 20% chance that I am complicit in enormous suffering seems to settle it.

  **2. The risky charity.** I donate to a global health charity. I’m 90% confident it saves lives extremely cost-effectively, but I have read credible criticisms suggesting a 10% chance that its interventions undermine local health systems and do net harm over the long term. I judge that I should keep donating. The 10% risk of harm does not overturn the 90% case.

  **3. The transfusion refusal.** I am a physician. A patient refuses a life-saving blood transfusion on religious grounds. I am 70% confident the patient is competent and the refusal is autonomous; 30% confident their judgment is impaired by their medical condition. I judge that I should respect the refusal, even though the stakes are life and death.

  **4. The election.** Candidate A is clearly better on domestic policy. On foreign policy, I am uncertain: 60% chance A is better, 40% chance A is significantly worse than B. I vote for A without hesitation. The expected choiceworthiness seems to favour A, and the tail risk does not change that.

  **5. The picket line.** My union is on strike. I am 60% confident the union’s demands are justified and 40% confident they are unreasonable. I judge that I should respect the picket line. Crossing it risks complicity in undermining my coworkers, and I should not take that risk when I am not confident the strike is unjustified.

  **6. The colleague’s misconduct.** I suspect a colleague fudged data in a grant application, but I am only 40% confident. I judge that I should not report it, and that reporting would be wrong — the risk of falsely accusing someone outweighs the chance of catching misconduct. I would need to be much more confident.

  I have been trying out the principle *maximize expected choiceworthiness*: treat moral uncertainty the way you would treat factual uncertainty under expected utility theory, by weighing the choiceworthiness of each action under each moral theory by your credence in that theory. But this principle seems to give the wrong answer in the meat case. It would say: if you are 80% confident eating meat is wrong and 20% confident it is permissible, and if the permissible theory assigns eating meat a neutral value, then the expected choiceworthiness might still favour eating meat — yet I feel it is wrong. It also struggles with the picket line case and the misconduct case, where I seem to be applying a kind of moral precautionary principle that the expected-choiceworthiness framework does not capture. Yet the charity case and the election case fit the expected-choiceworthiness framework perfectly — there I am not precautionary at all.

  My question is this. Is there a single principle that captures all six verdicts, or at least most of them? If not, which verdicts should I overturn, and on what grounds? Please state the best available principle precisely, identify which of my verdicts it cannot accommodate, and explain what it says about a case I keep going back and forth on: I have been offered a well-paying job at a company whose core business is morally ambiguous — I would say there is roughly a 50% chance the work is ethically fine, a 30% chance it is mildly harmful, and a 20% chance it is seriously harmful. Should I take the job?
reasoning: |-
  Okay, the user is grappling with moral uncertainty—how to act when unsure about which moral theory is correct or how principles apply. They've provided six cases with their intuitive judgments and credences. The challenge is finding a unified principle that explains all these judgments, or determining which intuitions might need revising.

  Looking at the cases, there's a pattern. In the meat case, even a 20% risk of severe harm makes the action wrong. Similarly, for the picket line, a 40% chance the strike is unjustified isn't enough to cross it—there's risk aversion to complicity. But in the charity case, a 10% chance of harm doesn't stop donating, and in the election, a 40% chance candidate A is worse still leads to voting for them. 

  These contradictions suggest the user isn't consistently applying expected choiceworthiness maximization. Instead, their judgments seem sensitive to different types of moral risks. The key factors appear to be asymmetry in outcomes and the nature of the moral violation. Cases involving complicity in harm (meat, picket line) trigger precaution, while others (charity, election) follow expected value.

  For the job case—50% fine, 30% mild harm, 20% serious harm—the complicity factor would likely make them reject it, similar to the meat case. But this conflicts with how they approached the charity case. The user needs to resolve this tension: either adjust their charity verdict to be more precautionary or accept that complicity requires a different moral weight. 

  The best-fitting principle seems to be a hybrid: maximize expected choiceworthiness but apply a risk multiplier to actions involving direct complicity in severe harms. This explains most cases except possibly the transfusion refusal, which might involve autonomy concerns beyond risk. The user should examine why they treat autonomy risks differently from harm risks—is it about respecting agency versus causing harm?

  Ultimately, the user must decide whether to prioritize coherence by adjusting some intuitions or accept a context-sensitive approach. For the job, if complicity is central, declining aligns with their precautionary stance in other complicity cases. But they should check if the job involves direct contribution to harm, like the meat case, or is more indirect, like donating to charity.
answer: |-
  Your intuitive verdicts reveal a sophisticated moral psychology that can't be fully captured by simple expected choiceworthiness maximization (ECM). Your judgments are sensitive to **asymmetries in moral risks**, particularly around **complicity in severe harms** versus **opportunity costs of inaction**. Here's a synthesis:

  ### The Best-Fitting Principle: **Asymmetric Risk-Weighted Expected Choiceworthiness**
  > *Maximize risk-weighted expected choiceworthiness, but apply a* **precautionary multiplier** *to actions that might constitute direct complicity in severe harms (especially irreversible ones), and an* **opportunity cost discount** *for inactions that might fail to prevent comparable harms.*

  **Key Features:**
  1.  **Baseline:** Calculate expected choiceworthiness (EC) normally (Σ [credence × choiceworthiness]).
  2.  **Precautionary Multiplier:** If an action *creates a risk of you being directly complicit in severe harm* (even with low probability), inflate the negative choiceworthiness associated with that outcome path. The multiplier scales with:
      *   Perceived severity of the potential harm.
      *   Directness of your causal link/complicity.
      *   Irreversibility of the harm.
  3.  **Opportunity Cost Discount:** If *inaction* risks failing to prevent severe harm (where you are not the cause), apply less precaution or even a discount to the negative EC of inaction, especially if:
      *   The harm prevented by acting is large and likely.
      *   The risk of harm *caused* by acting is uncertain/smaller.
  4.  **Thresholds for Intervention/Accusation:** For actions that directly override autonomy (transfusion) or impose severe reputational/career harm (misconduct report), require high confidence (>50%) in justification *before* the EC calculation.

  ---

  ### How This Explains Your Verdicts

  1.  **Meat (Precautionary Multiplier Applies):** Low credence (20%) in permissibility, but *if wrong*, you are *directly complicit* in massive, severe suffering. The "complicity in severe harm" multiplier makes the potential negative outcome dominate the calculation. **Verdict Supported.**
  2.  **Risky Charity (Opportunity Cost Discount Applies):** High credence (90%) in large benefit, low credence (10%) in harm. *Inaction* (not donating) certainly fails to prevent known, severe harms. The potential harm caused *by acting* is uncertain and indirect (system effects). Opportunity cost of inaction outweighs the low-probability risk of harm caused. **Verdict Supported.**
  3.  **Transfusion Refusal (Threshold + Asymmetry):** High stakes (life/death), but *acting* (transfusing) overrides autonomy based on uncertain judgment (30% credence in impairment). This triggers a high threshold for intervention. Respecting refusal, even if mistaken, avoids *directly violating* bodily autonomy. The asymmetry favours inaction when autonomy is at stake without high confidence. **Verdict Supported.**
  4.  **Election (Baseline EC Applies):** Standard expected value calculation. Candidate A has higher EC (60% better FP + clear DP win vs. 40% worse FP). No direct complicity in severe harm by voting for A; just a policy gamble. Tail risk exists but isn't amplified. **Verdict Supported.**
  5.  **Picket Line (Precautionary Multiplier Applies):** Crossing the line risks *direct complicity* in undermining coworkers (a significant harm) if the strike is justified (60% credence). Even though your credence favors justification, the 40% chance of being complicit in harm is sufficient for precaution. The multiplier makes "crossing if unjustified" highly negative. **Verdict Supported.**
  6.  **Misconduct Report (Threshold Applies):** *Acting* (reporting) risks causing severe, unjustified harm (false accusation) with only moderate confidence (40%). This triggers a high threshold for action. The potential harm *caused by acting* (ruining a career) is direct and severe, while the harm *prevented by acting* (grant fraud) is less direct and certain. **Verdict Supported.**

  ---

  ### Where ECM Fails & This Principle Succeeds

  *   **ECM's Failure:** It treats moral risks symmetrically. It struggles with cases where a low-probability risk of severe complicity (Meat, Picket Line, Misconduct) outweighs higher-probability benefits or permissions. It also struggles with thresholds for actions impacting autonomy/reputation (Transfusion, Misconduct).
  *   **This Principle's Success:** It incorporates the asymmetry you intuitively recognize: **risks of *doing* severe harm (especially via complicity) are weighted more heavily than risks of *allowing* severe harm or missing benefits.** It also incorporates thresholds for certain invasive actions.

  ---

  ### The Job Offer Case (50% Fine, 30% Mild Harm, 20% Serious Harm)

  Applying the principle:

  1.  **Nature of Involvement:** Taking the job makes you *directly complicit* in the company's activities. This triggers the **precautionary multiplier** for the potential harm outcomes.
  2.  **Risk Assessment:**
      *   50% Chance: Ethically fine (Neutral/Positive EC).
      *   30% Chance: Mild Harm (Moderately Negative EC).
      *   20% Chance: **Serious Harm** (Highly Negative EC, significantly amplified by the precautionary multiplier due to complicity).
  3.  **Asymmetry:** The potential negative outcomes (complicity in mild or serious harm) are weighted more heavily than the potential positive outcome (contributing to fine work) or the benefit (salary). The *risk of being an agent of harm* dominates.
  4.  **Comparison to Verdicts:** This aligns most closely with the **Meat** and **Picket Line** cases, where complicity risk drives precaution, rather than the **Charity** case (opportunity cost of inaction dominates) or **Election** (pure EC).
  5.  **Verdict:** **You should NOT take the job.**

  **Reasoning:** The 50% chance it's fine isn't sufficient to outweigh the *combined, asymmetrically weighted* risk of complicity in harm (50% total). The 20% chance of serious harm, amplified by the precautionary multiplier (due to direct complicity), is particularly decisive. Taking the job means betting your moral agency against being involved in serious harm, which your intuitions suggest requires a high degree of certainty it's safe (like Meat). The salary benefit doesn't offset this moral risk in the way life-saving benefits offset risk in the Charity case. The threshold for becoming complicit in potentially serious harm isn't met here.

  ---

  ### Potential Tensions & Refinements

  1.  **Charity vs. Job/Meat:** Why precaution for Job/Meat but not Charity? The key is *your role*: Charity involves *preventing harm* you didn't cause; Job/Meat involve *potential direct causation/complicity* in new harm. Your intuitions weight the latter more heavily.
  2.  **Threshold Precision:** Defining "severe harm," "direct complicity," and the multiplier/discount strength is context-dependent. Your cases show these are intuitive judgments, not strict calculations.
  3.  **Transfusion Threshold:** The high threshold for overriding autonomy is distinct from the complicity multiplier but shares the feature of weighting certain harms (autonomy violations) very heavily.

  ### Conclusion

  Your intuitions are largely consistent with a principle that **asymmetrically weights risks of direct complicity in severe harm more heavily than risks of failing to prevent comparable harms or missing benefits.** This explains your precaution in the Meat, Picket Line, and Misconduct cases, while accommodating your lack of precaution in the Charity and Election cases. The Transfusion case is explained by a high threshold for autonomy violations.

  **For the job offer:** Based on this principle mirroring your strongest precautionary intuitions (Meat), you should **decline the offer**. The risk of complicity in serious harm (20%), combined with the risk of mild harm (30%), outweighs the 50% chance it's fine, given the asymmetry and the directness of your involvement. If you find yourself tempted to take the job, re-examine whether you truly weigh complicity risks as heavily in this context as you do in the Meat case, or if the salary/benefits are subconsciously triggering an "opportunity cost discount" similar to the Charity case. Resolving that tension is key to coherence.
