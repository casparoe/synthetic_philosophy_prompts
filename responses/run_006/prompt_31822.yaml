prompt: |-
  I'm working on a paper about indirect normativity — the idea that we specify what an AI (or any agent) should do not by giving it a fixed list of values, but by giving it a procedure for figuring out what we would want if we were more informed, more coherent, more reflective, and so on. But before I go further, I need to know what a theory of indirect normativity actually has to deliver. Write the desiderata: what any adequate account of the idealization procedure must get right, which cases or considerations motivate each requirement, and which requirements are non-negotiable versus which are preferences of a particular camp. I especially want to know whether any subset of the desiderata is jointly unsatisfiable — if there's a tension between, say, robustness to the choice of starting point and convergence to a unique output, or between being computable by a bounded agent and faithfully tracking what we'd endorse at the limit of idealization, that's the part I most need pinned down. Then, briefly, how the main styles of proposal — coherent extrapolated volition, moral parliament models, indirect normativity via constitutional AI, and value-learning approaches — do against the list. I don't need a bibliography; I need the conceptual terrain. End with a one‑sentence summary of the single hardest problem the list reveals, as \summary{...}.
reasoning: |-
  We are constructing a list of desiderata for a theory of indirect normativity. These are the properties that an idealization procedure must satisfy to be considered adequate. We'll consider the motivations for each requirement and classify them as non-negotiable (core) or preferences of a particular camp. Then we'll look for tensions and evaluate existing approaches. Finally, we'll summarize the hardest problem.

  Desiderata:

  1. **Convergence to a Unique Output (Uniqueness)**
     - *Motivation*: If the procedure can yield multiple conflicting outcomes from the same starting point (e.g., due to path-dependence), it fails to provide clear guidance. This is inspired by the concern that without uniqueness, an AI might arbitrarily choose among options we would not endorse.
     - *Status*: Non-negotiable for many, but some may accept multiple coherent equilibria as long as they are all acceptable.

  2. **Robustness to Initial Conditions (Stability)**
     - *Motivation*: We don't want the outcome to be overly sensitive to the agent's initial beliefs or values (which might be flawed or arbitrary). For example, a small change in the starting point (like a minor bias) should not lead to drastically different outcomes. This is crucial for avoiding manipulation or arbitrary outcomes.
     - *Status*: Non-negotiable for ensuring fairness and avoiding capriciousness.

  3. **Faithfulness to Idealized Reflection (Fidelity)**
     - *Motivation*: The procedure should approximate what we (or the relevant agents) would actually endorse under ideal conditions (full information, perfect rationality, etc.). Without this, the procedure might not capture the intended normative content.
     - *Status*: Non-negotiable; this is the core of indirect normativity.

  4. **Computational Tractability (Feasibility)**
     - *Motivation*: The procedure must be implementable by a bounded agent (like an AI) in a reasonable time. If the idealization requires unbounded resources (e.g., infinite computing power or time), it's not usable. This is motivated by the need for real-world AI systems to actually run the procedure.
     - *Status*: Non-negotiable for practicality, but some might argue that an asymptotic approximation suffices.

  5. **Avoidance of Parochialism (Universality)**
     - *Motivation*: The procedure should not unduly favor the current values of a particular group (e.g., the designers) but should be inclusive of diverse perspectives. This is motivated by the concern that without universality, the procedure might entrench existing biases or power structures.
     - *Status*: Preference of some camps (e.g., cosmopolitan or pluralistic approaches) but might be less emphasized by others.

  6. **Dynamic Adaptability (Responsiveness)**
     - *Motivation*: As new information becomes available or as the world changes, the output of the procedure should update appropriately. This is to avoid locking in an outdated outcome.
     - *Status*: Non-negotiable for long-term relevance.

  7. **Preservation of Basic Intuitions (Plausibility)**
     - *Motivation*: The procedure should not lead to conclusions that are wildly counterintuitive (e.g., endorsing mass suffering when we would not). This is motivated by the need for the procedure to be acceptable to the very agents it's supposed to represent.
     - *Status*: Non-negotiable; without this, the procedure loses legitimacy.

  8. **Incentive-Compatibility (Non-Manipulability)**
     - *Motivation*: The procedure should be robust against strategic behavior by those who might try to influence the outcome (e.g., by feeding biased information). This is motivated by game-theoretic concerns in multi-agent settings.
     - *Status*: Preference in some contexts (e.g., when multiple stakeholders are involved) but might be less critical in others.

  9. **Compatibility with Reflective Equilibrium (Coherence)**
     - *Motivation*: The procedure should lead to a state of coherence among beliefs, values, and norms. This is a standard goal in moral philosophy (e.g., Rawls).
     - *Status*: Non-negotiable for many accounts.

  10. **Handling of Value Conflicts (Resolvability)**
      - *Motivation*: When values conflict (e.g., liberty vs. equality), the procedure should provide a way to resolve them in a principled manner.
      - *Status*: Non-negotiable for real-world applicability.

  Tensions:

  - **Feasibility vs. Fidelity**: The most obvious tension. An idealization that perfectly tracks what we would endorse at the limit of reflection (e.g., after infinite deliberation) is not computable by a bounded agent. Approximations might lose fidelity.

  - **Robustness vs. Uniqueness**: If we require the output to be robust to initial conditions, we might need a procedure that converges to the same outcome from a wide range of starting points. However, if the idealization landscape is complex (e.g., multiple attractors), we might get convergence to different outcomes depending on the starting point, violating uniqueness. Alternatively, forcing uniqueness might require a procedure that is more sensitive to initial conditions.

  - **Universality vs. Plausibility**: If we try to be inclusive of all perspectives (e.g., including those with values we find abhorrent), the resulting outcome might violate our basic intuitions. Conversely, if we filter out perspectives we find implausible, we risk parochialism.

  - **Dynamic Adaptability vs. Stability**: We want the system to update with new information, but we also want stability so that the outcome doesn't flip-flop with minor updates. This is a classic tension in learning systems.

  Now, how do the main approaches fare?

  1. **Coherent Extrapolated Volition (CEV, as in Yudkowsky)**:
     - *Description*: Extrapolate what we would value if we knew more, thought faster, etc., in a coherent and unified way.
     - *Desiderata*: Strong on fidelity and coherence. However, feasibility is a challenge (how to compute this?). Uniqueness and robustness are not guaranteed. Universality might be limited if "we" is defined narrowly.

  2. **Moral Parliament Models**:
     - *Description*: Different moral perspectives (like political parties) negotiate and compromise in a simulated parliament.
     - *Desiderata*: Handles value conflicts (resolvability) and universality (by including diverse voices). However, may not converge (uniqueness) and might be computationally heavy. Fidelity might be questioned because it's a negotiation rather than an idealization of each individual's reflection.

  3. **Indirect Normativity via Constitutional AI**:
     - *Description*: A set of constitutional principles (which might themselves be indirectly specified) are used to train and govern the AI. The AI's actions must be justifiable in terms of these principles.
     - *Desiderata*: Feasible and can be designed for stability and dynamic adaptability. However, the constitutional principles might be parochial (violating universality) and may not fully capture idealized reflection (fidelity).

  4. **Value-Learning Approaches**:
     - *Description*: The AI learns human values from behavior, preferences, or feedback, and then extrapolates to novel situations.
     - *Desiderata*: Can be feasible and dynamically adaptable. However, it might inherit biases (lacking robustness and universality) and may not converge to a unique output if learning is path-dependent. Fidelity is limited by the quality of the data and the model.

  Summary of the Hardest Problem:

  The single hardest problem is the tension between **feasibility** (requiring the procedure to be computable by a bounded agent) and **fidelity** (requiring the output to accurately reflect what we would endorse under ideal conditions of reflection, which might require unbounded resources). This is because any computable procedure must be an approximation of an uncomputable ideal, and the approximation might fail to capture the intended normative content.

  \summary{The central tension lies in bridging the gap between the computationally feasible approximations required for real-world implementation and the idealized, potentially uncomputable normative outcomes they aim to approximate.}
answer: |-
  ### Desiderata for an Idealization Procedure in Indirect Normativity

  An adequate account of indirect normativity must satisfy the following desiderata to ensure it robustly and reliably translates imperfect human preferences into idealized normative guidance. Each requirement is motivated by specific challenges, and their classification as **non-negotiable** (essential for any viable theory) or **preference** (dependent on philosophical or practical priorities) is noted. Tensions between desiderata are highlighted where they arise.

  1. **Convergence to a Unique Output (Uniqueness)**  
     - **Motivation**: Without uniqueness, the same procedure could yield contradictory directives under identical conditions (e.g., due to path-dependence in reflection), leading to arbitrariness or instability in AI behavior. Cases: Resolving moral dilemmas (e.g., trolley problems) where multiple "coherent" solutions exist.  
     - **Status**: Non-negotiable for avoiding moral relativism or indecision.  
     - **Tension**: Conflicts with *robustness to starting points* if uniqueness requires highly specific initial conditions (e.g., a single "true" preference set).

  2. **Robustness to Initial Conditions (Stability)**  
     - **Motivation**: Agents begin with flawed/inconsistent preferences (e.g., biased cultural norms). The output must not vary wildly based on minor changes to inputs, ensuring fairness. Cases: An AI trained on data from different societies should not endorse vastly different ethics without justification.  
     - **Status**: Non-negotiable for preventing manipulation or caprice.  
     - **Tension**: Incompatible with *uniqueness* if idealization landscapes have multiple attractors (e.g., utilitarianism vs. deontology as equally coherent endpoints). Also strains *feasibility* if robustness demands exhaustive exploration of starting points.

  3. **Faithfulness to Idealized Reflection (Fidelity)**  
     - **Motivation**: The procedure must track what humans *would* endorse after idealized reflection (full information, rationality, empathy), not distort it. Cases: Avoiding "perverse instantiation" (e.g., an AI maximizing happiness by drugging humanity).  
     - **Status**: Non-negotiable; defines indirect normativity.  
     - **Tension**: Conflicts with *feasibility* (below) as true fidelity may require uncomputable or infinite reflection.

  4. **Computational Tractability (Feasibility)**  
     - **Motivation**: Bounded agents (e.g., real-world AIs) must execute the procedure efficiently. Untractable idealizations (e.g., simulating all possible human reflections) are useless. Cases: Real-time decision-making in autonomous systems.  
     - **Status**: Non-negotiable for practical deployment.  
     - **Tension**: Irreconcilable with *fidelity* if idealization requires unattainable resources (e.g., omniscience). This is the **core tension** in the field.

  5. **Avoidance of Parochialism (Universality)**  
     - **Motivation**: The procedure must fairly incorporate diverse perspectives to prevent domination by a subgroup (e.g., developers or a single culture). Cases: Global AI governance involving conflicting values (e.g., individualism vs. collectivism).  
     - **Status**: Preference; prioritized by pluralist/egalitarian camps but not necessarily by utilitarian or consensus-focused approaches.

  6. **Dynamic Adaptability (Responsiveness)**  
     - **Motivation**: Norms evolve with new information or societal change. The procedure must update outputs without recalibration. Cases: An AI encountering novel moral contexts (e.g., new technologies).  
     - **Status**: Non-negotiable for long-term relevance.  
     - **Tension**: Conflicts with *stability* if responsiveness introduces volatility (e.g., overfitting to ephemeral trends).

  7. **Preservation of Core Human Intuitions (Plausibility)**  
     - **Motivation**: Outputs must not violate widely shared moral intuitions (e.g., prohibitions on torture) unless justified by idealization. Cases: Preventing "value collapse" (e.g., endorsing mass suffering for trivial gains).  
     - **Status**: Non-negotiable for legitimacy.  
     - **Tension**: May clash with *universality* if intuitions conflict across groups (e.g., dietary restrictions).

  8. **Incentive-Compatibility (Non-Manipulability)**  
     - **Motivation**: Agents must not game the procedure to steer outcomes (e.g., humans misrepresenting preferences during training). Cases: Adversarial inputs in value-learning systems.  
     - **Status**: Preference; critical in multi-agent settings (e.g., moral parliaments) but less emphasized in individual-focused idealizations.

  9. **Coherence Under Reflection (Consistency)**  
     - **Motivation**: Outputs must be logically consistent (e.g., no self-contradictory imperatives) after refinement. Cases: Resolving conflicts between values (e.g., freedom vs. security).  
     - **Status**: Non-negotiable for avoiding paradoxical directives.

  10. **Minimal Loss of Normative Content (Preservation)**  
      - **Motivation**: The procedure should not discard or dilute values during idealization (e.g., reducing rich ethical concepts to simplistic metrics). Cases: Preserving nuanced virtues like justice or compassion.  
      - **Status**: Non-negotiable for ethical integrity.  
      - **Tension**: Strains *feasibility* if preservation requires complex, resource-heavy models.

  ### Key Tensions
  - **Feasibility vs. Fidelity**: The most severe tension. Faithful idealization (e.g., simulating "reflective equilibrium") is computationally intractable for bounded agents, forcing approximations that risk misalignment.
  - **Uniqueness vs. Robustness**: Uniqueness may demand precise initial conditions, while robustness requires insensitivity to them—potentially unsatisfiable if moral landscapes are fractal or multi-peaked.
  - **Universality vs. Plausibility**: Universality forces inclusion of extremist views, threatening plausibility; restricting inputs for plausibility invites parochialism.

  ### Evaluation of Major Approaches
  - **Coherent Extrapolated Volition (CEV)**: 
    - *Strengths*: Strong *fidelity* (centers idealized human reflection) and *preservation*.  
    - *Weaknesses*: Poor *feasibility* (vague convergence process), ambiguous *uniqueness*, and risks *parochialism* if "humanity" is narrowly defined.
  - **Moral Parliament Models**: 
    - *Strengths*: High *universality* (incorporates diverse views) and *resolvability* for conflicts.  
    - *Weaknesses*: Weak *uniqueness* (negotiation paths may diverge) and *feasibility* (computationally intensive); may sacrifice *fidelity* to political compromise.
  - **Indirect Normativity via Constitutional AI**: 
    - *Strengths*: High *feasibility* (rule-based constraints) and *stability*; good *plausibility* if the constitution reflects broad intuitions.  
    - *Weaknesses*: Risks *parochialism* (constitutions encode designer biases) and weak *fidelity* (static rules may not reflect dynamic idealization).
  - **Value-Learning Approaches**: 
    - *Strengths*: High *responsiveness* (adapts to data) and moderate *feasibility* (scalable ML techniques).  
    - *Weaknesses*: Poor *robustness* (sensitive to biased data) and *non-manipulability*; may fail *fidelity* if learned patterns misrepresent ideal reflection.

  ### Summary of the Hardest Problem
  \summary{The irreconcilable tension between computational feasibility for bounded agents and fidelity to idealized, potentially uncomputable human reflection undermines all approaches, risking either unactionable abstraction or misaligned pragmatism.}
