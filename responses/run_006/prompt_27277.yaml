answer: |-
  The practice of diplomatic recognition presupposes a **hybrid theory that is constitutively operational while declaratorily rhetorical**, creating a fundamental tension between legal doctrine and political reality. Below is a step-by-step reconstruction, engagement with Hegel, and an analysis of potential reforms, with confidence assessments.

  ---

  ### **I. Implicit Theory of Recognition in Practice**
  1. **Strict Presuppositions**:  
     - Recognition is **constitutive of legal personality** in the international order. Unrecognized entities (e.g., Taiwan, Somaliland) are functionally excluded from treaties, international courts, and organizations, regardless of meeting objective criteria (territory, population, etc.).  
     - Recognition is **politically discretionary**. States openly withhold/grant recognition based on interests (e.g., non-recognition of Western Sahara to avoid legitimizing Moroccan annexation).  
     - *Confidence: High* (empirically verifiable through state behavior).

  2. **Compatible With (but Not Required)**:  
     - Declaratory rhetoric: States verbally affirm that recognition "acknowledges" preexisting statehood (e.g., UN Charter Article 3), but this is decoupled from practice.  
     - Objective criteria remain reference points (e.g., debates over Palestine’s UN status cite governance capacity), but are insufficient alone.  
     - *Confidence: High*.

  3. **Philosophical Underdetermination**:  
     - The practice does not resolve **what constitutes "statehood" ontologically**. Is it a factual condition (declaratory) or a legal status (constitutive)? The tension arises because states treat recognition as both an observation *and* a conferral of rights.  
     - Example: Kosovo is "objectively" a state by control/governance criteria but lacks universal recognition, blocking UN membership.  
     - *Confidence: Moderate* (practice reveals ambiguity, not resolution).

  ---

  ### **II. Hegelian Analysis: Recognition as Defective Struggle**
  **Hegel’s Master-Slave Dialectic (Phenomenology of Spirit)**:  
  - Self-consciousness requires **mutual recognition** between equals.  
  - Recognition extracted through domination (e.g., master-slave) is "hollow" – it fails to affirm the slave’s autonomy, corrupting the master’s self-certainty.  

  **Diplomatic Recognition as a Hegelian Struggle?**  
  - **Parallels**:  
    - Recognition is **asymmetrical and power-laden**. Powerful states (e.g., UNSC members) "grant" recognition to weaker entities, mirroring the master’s conditional acknowledgment.  
    - Unrecognized states (e.g., Transnistria) exist in a "hollow" limbo – they possess empirical statehood but lack validated identity, akin to the slave’s unrealized self-consciousness.  
    - *Confidence: Moderate* (structural resemblance is clear).  

  - **Divergences**:  
    - **States ≠ Selves**: Legal personality is a fiction; it lacks self-consciousness or existential need for affirmation. Recognition is transactional, not existential.  
    - **Non-Mutuality**: Hegelian recognition requires reciprocity, but states recognize entities unilaterally. Taiwan’s quest for recognition isn’t about "self-realization" but practical rights.  
    - *Confidence: High* (ontological mismatch is decisive).  

  **Verdict**: Diplomatic recognition is a **strategic, one-sided approximation** of Hegelian recognition but is **defective in the Hegelian sense**. It instrumentalizes acknowledgment without mutual equality, reducing it to a tool of power politics.  
  - *Confidence: Moderate-High* (practice aligns superficially but lacks Hegel’s ethical core).  

  **Least Confident Point**: Whether non-recognition inflicts *existential* harm analogous to the slave’s alienation. States are institutions, not selves, so the analogy may over-psychologize. (*Low confidence*).  

  ---

  ### **III. Consequences of Consistent Adoption**  
  **A. Purely Declaratory View**:  
     - **Changes**: Recognition becomes irrelevant. Entities meeting criteria (e.g., Somaliland) automatically join international bodies. Political discretion vanishes.  
     - **Impact**: Erodes state sovereignty; international organizations (not states) become arbiters of statehood. Secessionist movements gain leverage.  
     - *Confidence: High*.  

  **B. Purely Constitutive View**:  
     - **Changes**: Recognition explicitly creates statehood. Unrecognized entities (e.g., Palestine pre-2012) have no legal existence. States openly treat recognition as a political tool.  
     - **Impact**: Legitimizes power hierarchies; incentivizes coercion (e.g., "recognition for concessions"). International law becomes purely positivistic.  
     - *Confidence: High*.  

  **Oscillation’s Purpose**: Current ambiguity allows states to invoke "principle" (declaratory) while pursuing interests (constitutive). Consistency would force a choice between order (declaratory) or realpolitik (constitutive).  

  ---

  ### **Summary**  
  - **Practice Presupposes**: A constitutive reality masked by declaratory myths.  
  - **Hegelian Reading**: Superficially analogous but ontologically distinct; recognition is defective due to non-mutuality.  
  - **Reform**: Consistency would collapse the diplomatic double game, forcing either automatic inclusion (declaratory) or explicit power politics (constitutive).  
  - **Weakest Link**: Extending Hegel’s *existential* struggle to states risks false anthropomorphism.
