prompt: |-
  Alright so I've been going back and forth on this thing about probability and I'm hoping someone can clear it up for me. I was playing poker with some friends last week and there was this hand where I couldnt really pin down the exact odds of my opponent having a flush. Like, I could say "well, based on how he bet, it's somewhere between 30% and 60%." And my friend was like "that's not how probability works, you need a single number." But I kept thinking — why? Why do I have to pick one number when my actual state of uncertainty is better described by a range?

  I ended up falling into this rabbit hole online and found out there's this whole thing called "imprecise probabilities" where people literally argue that using a set of probabilities is more rational than forcing everything into one precise number. From what I gathered, the basic idea is that when you don't have much information, it's more honest to say "I think the chance is between 0.3 and 0.7" than to just pick 0.5 and pretend you know. But then I also read that there are some big problems with this approach — like, if you have imprecise probabilities, how do you even make decisions? Standard decision theory tells you to maximize expected utility, but if your probabilities are a range, your expected utilities are also a range, and then you can end up with situations where two options aren't clearly better or worse than each other.

  Could you explain the case for imprecise probabilities and the main objections to it? I'm especially curious about the decision-making problem — like, what do proponents of imprecise probabilities actually say you should do when the ranges overlap and no option dominates? And also, what's the philosophical motivation beyond just "it feels more honest"? Is there a deeper argument for why precise probabilities are problematic in the first place?
