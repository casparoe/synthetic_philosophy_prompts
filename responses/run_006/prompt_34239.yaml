prompt: |-
  I'm the editor of a local news website serving a town of about eighty thousand people. We publish daily, and our reporting covers council meetings, magistrates' court, planning disputes, school controversies, and the occasional fatal accident. At least once a week I have to decide whether to include someone's name, address, medical history, family circumstances, or past offences in a story. The law gives us a floor — defamation, contempt, and the occasional reporting restriction — but that floor is low, and most of the decisions I face are legal either way. At present we make these calls by instinct and by loose analogy with the Editors' Code of Practice, but I find that two editors in the same room can reach opposite conclusions and neither can articulate why. I want something more systematic.

  Please write a decision procedure I can run on any piece of personal information we are considering publishing — a sequence of questions with clear stopping rules, grounded in whatever the philosophy of privacy can tell us about why privacy actually matters. I am not asking for a summary of media law; I want the ethical reasoning the law does not supply. The procedure should distinguish between different kinds of personal information (intimate facts, public-facing facts, facts about past wrongdoing, facts about location, facts about family life) and between different reasons for publishing (public accountability, the public's right to know what happened in a public place, the newsworthiness of a person's own actions). It should flag the points where the procedure cannot decide and editorial judgement must take over. I need to be able to run it in fifteen minutes, and it should be honest about which steps are judgement calls dressed up as procedure.

  Once you have written the procedure, please run it on two cases I faced last year. (1) A teacher at a local secondary school was disciplined five years ago for a minor safeguarding infraction — a failure to follow a reporting protocol, not any harm to a child. The regulator cleared him after a review, and he is now applying for a headship at a school in the next town. A parent who knew about the old case has tipped us off and wants us to publish before the hiring decision is made. (2) A man in his seventies died in a single-vehicle crash on the high street on a Saturday afternoon. The crash closed the road for three hours and displaced a market that runs every weekend. His family have asked us not to name him, saying he was a private man who would have hated the attention. We have his name from a witness. For each case, tell me where in the procedure the decision is reached, what the answer is, and whether the procedure gives an answer I will be uncomfortable with.
reasoning: |-
  Okay, the user is the editor of a local news website in a town of 80,000 people. They face weekly decisions about publishing personal information like names, addresses, medical history, etc. While they have legal guidelines, they lack a systematic ethical framework. Currently, decisions are based on instinct and the Editors' Code, leading to inconsistent outcomes between editors. They want a structured decision procedure grounded in privacy philosophy, different types of personal information, and reasons for publishing. The procedure needs to be practical, taking under 15 minutes, and honest about where judgment is required.

  First, I need to recall key privacy philosophies. Judith Thomson talks about privacy as a bundle of rights derived from other rights like property or bodily autonomy. Warren and Brandeis famously defined privacy as the "right to be let alone," focusing on dignity and personal autonomy. Helen Nissenbaum's contextual integrity emphasizes that privacy norms depend on context and information flow appropriateness. Julie Cohen highlights privacy's role in enabling self-development without constant scrutiny. These theories can inform the ethical reasoning behind each step.

  The procedure must categorize personal information types: intimate facts (health, sexuality), public-facing facts (job titles, public roles), past offenses, location, and family circumstances. It should also distinguish publishing motives like public accountability, right to know about public events, or newsworthiness of someone's actions. The user mentioned stopping rules—clear yes/no points to prevent over-publishing.

  I'll structure the procedure in stages: Assessment, Necessity Test, Proportionality Test, and Final Checks. Each stage has specific questions with stopping rules. For instance, Stage 1 identifies info type and public role. If it's intimate and no public role, stop—don't publish. Stage 2 checks if the info is necessary for the story's core purpose. If not, withhold. Stage 3 weighs public interest against harm, considering alternatives like anonymization. Stage 4 involves practical mitigations and editorial judgment flags.

  For the two case studies: 
  Case 1 involves a teacher's past minor safeguarding issue, now applying for a headship. The parent wants it published. Applying the procedure: The info is a past offense (Type 5). He's a public figure due to his role (Stage 1). The necessity test passes because his fitness for headship is relevant. But the offense was minor, resolved, and not involving harm. Public interest is moderate, but harm to his reputation and family could be high. Alternatives like not naming him? But naming is necessary for accountability. The procedure might lean toward publishing but with discomfort due to the minor nature and time passed.

  Case 2 is an elderly man who died in a public crash, family requests anonymity. Info is location/factual event (Type 4), not intimate. He's not a public figure. Necessity: naming him isn't essential to the event's newsworthiness (road closure, market disruption). Public interest is low for his identity, high for the event. Harm to family is significant. Alternatives: omit the name. Procedure likely says don't publish the name, which might feel unsatisfying if the user thinks the public has a right to know identities in accidents.

  The user's deeper needs: They want consistency in ethical decisions, reducing subjective disputes among editors. They also need justification for uncomfortable calls, balancing community transparency with individual dignity. The procedure should clarify where judgment is unavoidable, preventing false certainty. Highlighting the "Judgment Flags" acknowledges this, maintaining trust in the process.

  I should ensure the procedure is efficient, using clear categories and flowcharts. Emphasize that some steps are judgment-based but framed as questions to guide reasoning. The ethical grounding in privacy theories helps articulate why certain info deserves protection, moving beyond legal compliance to moral responsibility.
answer: |-
  Here is a systematic decision procedure grounded in privacy ethics, designed for your 15-minute window. It integrates core philosophical justifications for privacy: **individual dignity & autonomy** (control over self-presentation), **contextual integrity** (appropriateness of information flow), **non-maleficence** (avoiding unnecessary harm), and **the social contract** (balancing individual rights with collective needs like accountability).

  **Core Principles Embedded:**
  1.  **Intimate Information:** Deserves highest protection (dignity, autonomy). Disclosure often causes disproportionate harm.
  2.  **Public Role:** Individuals in positions of power/trust (officials, professionals) have reduced privacy expectations regarding relevant conduct (accountability).
  3.  **Public Event/Fact:** Information generated *in* public spaces has lower inherent privacy expectation, but naming individuals involved may still require justification.
  4.  **Necessity & Proportionality:** Is the specific personal detail *essential* to the public interest purpose? Is the intrusion proportional to the gravity of the matter?
  5.  **Harm Assessment:** What is the *likely* and *foreseeable* harm (reputational, emotional, safety) to the individual/family?
  6.  **Temporal Relevance:** Is the information current and relevant, or historical and potentially prejudicial?
  7.  **Alternatives:** Can the public interest be served *without* disclosing the specific personal detail?

  ---

  **The Decision Procedure:**

  **Stage 1: Information Type & Subject's Role (3 mins)**
  *   **Q1: What *type* of personal information is it?**
      *   **A: Intimate Facts:** Health (physical/mental), sexuality, private relationships, deep grief. *(Strongest presumption: DO NOT PUBLISH - Dignity/Autonomy)*
      *   **B: Past Wrongdoing (incl. arrests/charges/convictions):** *(Presumption: Handle with extreme caution - Potential for lasting harm/Stigma)*
      *   **C: Family Circumstances:** (e.g., marital status, children, domestic issues). *(Presumption: DO NOT PUBLISH unless intrinsically linked to a major public issue - Contextual Integrity)*
      *   **D: Location/Home Address:** *(Presumption: DO NOT PUBLISH unless essential for public safety/accountability re: specific location-based issue - Safety/Harassment Risk)*
      *   **E: Public-Facing Facts:** Job title, role in public event, non-intimate biographical info relevant to public role. *(Weakest presumption - Contextual Integrity/Accountability)*
  *   **Q2: Is the individual primarily acting in a *significant public role* relevant to this story?** (e.g., Elected official, senior public servant, police officer, headteacher, CEO of major local employer, key witness in public proceeding). *(Yes/No)*
  *   **Stopping Rule 1:** If **A (Intimate)**, **C (Family Circumstances)**, or **D (Location)** AND **Q2=No (No significant public role)**, **DO NOT PUBLISH**. Proceed only for **B (Past Wrongdoing)** or **E (Public-Facing)**, or if **Q2=Yes**.

  **Stage 2: Necessity & Public Interest Justification (4 mins)**
  *   **Q3: What is the *primary* ethical justification for publishing *this specific piece* of personal information?**
      *   **A: Public Accountability:** Holding powerful individuals/institutions accountable for actions/decisions affecting the community. *(Strongest justification - Social Contract)*
      *   **B: Public's Right to Know (Event):** Understanding significant events occurring in public spaces/affecting public life. *(Moderate justification - Contextual Integrity/Social Contract)*
      *   **C: Newsworthiness of Individual's Actions:** The person's own conduct is inherently newsworthy due to its nature/impact. *(Varies - Assess proportionality)*
      *   **D: Other (Specify):** (e.g., public safety warning). *(Requires strong specific justification)*
  *   **Q4: Is publishing *this specific personal detail* NECESSARY to achieve the justification in Q3?** Could the core public interest be served equally well *without* it? (e.g., "a local teacher" vs. name; "a man in his 70s" vs. name; "disciplinary action was taken" vs. specific details).
  *   **Stopping Rule 2:** If **Q4=No**, **DO NOT PUBLISH** this specific detail. Seek an alternative (e.g., role, anonymized description). If **Q3=D (Other)** and justification is weak/vague (e.g., "it's interesting", "a source wants us to"), **DO NOT PUBLISH**.
  *   **Q5: For B (Past Wrongdoing):** Is the past act **directly relevant** to the *current* situation or role? Is it **sufficiently proximate in time**? Was the outcome/resolution **fairly and accurately represented**? *(If No to relevance/proximity, DO NOT PUBLISH - Non-maleficence/Proportionality)*

  **Stage 3: Proportionality & Harm Assessment (5 mins)**
  *   **Q6: What is the *gravity* of the public interest served?** (Scale: Low - e.g., minor curiosity; Medium - e.g., understanding a significant public event; High - e.g., exposure of serious malfeasance/threat to public safety).
  *   **Q7: What is the *likely severity* of harm to the individual/family from publication?** Consider type of info (Stage 1), prominence, sensitivity, potential for harassment/stigma, impact on vulnerable individuals (children, grieving relatives). (Scale: Low, Medium, High).
  *   **Q8: Are there *mitigating factors*?** (e.g., Information already widely known/public record? Individual has spoken publicly? Consent obtained?).
  *   **Q9: Can *practical mitigations* reduce harm while serving public interest?** (e.g., Delay publication? Omit especially sensitive details while keeping core fact? Provide context/right of reply?).
  *   **Judgment Flag 1:** **Weigh Q6 (Public Interest Gravity) vs. Q7 (Harm Severity).** If Harm Severity *significantly outweighs* Public Interest Gravity (e.g., High Harm vs. Low/Medium PI), **DO NOT PUBLISH**. If Public Interest Gravity *significantly outweighs* Harm Severity (e.g., High PI exposing corruption vs. Medium Harm to official), **PUBLISH**. If close or unclear (e.g., Medium PI vs. Medium Harm), **PROCEED TO STAGE 4 - JUDGMENT CALL**.

  **Stage 4: Final Checks & Judgment (3 mins)**
  *   **Q10: Does publishing align with our stated values and the community's reasonable expectations?** Would a reasonable person, knowing all facts, consider this a responsible intrusion?
  *   **Q11: Are there any *overriding* practical concerns?** (e.g., Immediate safety risk? Legal restriction missed earlier? Source protection imperative?).
  *   **Judgment Flag 2:** If **Q10=Unclear/No** or **Q11=Yes** (requiring careful weighing), this is a **STRONG EDITORIAL JUDGMENT CALL**. Consult another editor/document reasoning.
  *   **Decision:** Based on culmination of Stages 1-4:
      *   **PUBLISH** (with any agreed mitigations)
      *   **DO NOT PUBLISH** the specific personal detail
      *   **PUBLISH PARTIALLY/ANONYMOUSLY** (specify what is omitted)
      *   **DEFER** (if Q11 suggests timing is critical)

  ---

  **Application to Your Cases:**

  **Case 1: Teacher's Past Safeguarding Infraction**
  1.  **Stage 1:** Information = **B (Past Wrongdoing)**. Subject = Applying for **Headteacher (Significant Public Role - Q2=Yes)**. Proceed.
  2.  **Stage 2:**
      *   Q3: Justification = **A (Public Accountability)** - Accountability for someone seeking a high-trust role involving child safety.
      *   Q4: **Is the specific detail necessary?** The *fact* of past disciplinary action *relevant to safeguarding* is arguably necessary for assessing fitness for a headship. Specific details of the *minor* nature (failure to report, no harm) *might* be necessary context to avoid assumptions of severity, BUT could also be framed generally ("related to a safeguarding procedure").
      *   Q5: **Relevance/Proximity?** Direct relevance (safeguarding role -> safeguarding history). Proximate? 5 years is borderline; depends on nature/severity. Outcome? Cleared by regulator - crucial context. **Judgment Flag:** Is naming *him specifically* necessary? Could "a candidate" suffice? Arguably yes for genuine accountability - the public/target school needs to know *who*.
  3.  **Stage 3:**
      *   Q6: **PI Gravity:** Medium-High (Headteacher role, child safety).
      *   Q7: **Harm Severity:** Medium-High (Reputational damage, potentially derailing career, stigma despite exoneration, impact on family). Harm is heightened *because* the infraction was minor/exonerated - reporting risks making it seem worse.
      *   Q8: **Mitigating:** Public record? (Probably not widely known). Spoken publicly? (Unlikely). Consent? (No).
      *   Q9: **Mitigations:** Could report "A candidate for X headship has a past disciplinary record related to a safeguarding procedure, later cleared by regulator" WITHOUT naming? But accountability weakens significantly. Providing full context (minor, no harm, cleared) is essential if naming.
  4.  **Stage 4:**
      *   Q10: **Values/Expectations?** Debatable. Some expect full disclosure for heads, others see dredging minor cleared history as unfair.
      *   Q11: **Overriding?** Parent source pressure isn't overriding.
      *   **Judgment Flag:** Stage 3 Q6 vs Q7 is close (Medium-High PI vs Medium-High Harm). Stage 2 Q4/Q5 on necessity of naming is a key judgment call. **PROCEDURE LEANS TOWARD PUBLISHING THE FACT OF DISCIPLINE/CLEARANCE AS RELEVANT TO THE APPLICATION, BUT WITH EXTREME CARE ON CONTEXT (minor nature, no harm, cleared). NECESSITY OF *NAMING* HIM IS THE CRITICAL JUDGMENT CALL.** Publishing just the fact without the name serves little accountability. Publishing *with* name causes significant harm. **Answer:** The procedure forces acknowledgement that publishing *his name* is a high-harm action requiring very strong justification. You *could* justify it based on the public role (Headteacher) and the direct relevance of safeguarding history to that role (Public Accountability), but **only if** the story provides *full, accurate context* (minor, no harm, cleared) and explicitly makes the case for *why this specific history is relevant now* for *this specific role*. Omitting the name significantly weakens accountability. **This decision point (necessity of name + harm) is likely uncomfortable** – it pits legitimate accountability against potentially disproportionate harm for a minor, resolved issue. The procedure highlights the ethical tension but doesn't absolve you of the hard choice.

  **Case 2: Fatal Accident - Family Request Anonymity**
  1.  **Stage 1:** Information = **D (Location - incident)** / **E (Public-Facing - involvement in public event)**. Subject = **Not in a significant public role (Q2=No - just a resident)**. **Stopping Rule 1 Applies:** Information is Type D/E and Q2=No. **PROCEED** (Stopping Rule 1 doesn't stop for D/E without public role, but caution is high).
  2.  **Stage 2:**
      *   Q3: Justification = **B (Public's Right to Know - Event).** The *event* (major crash, road closure, market disruption) is newsworthy.
      *   Q4: **Is the *name* necessary?** **No.** The public interest is fully served by reporting the event, its consequences (road closure, market disruption), basic facts (single vehicle, driver deceased, age range if relevant), and *perhaps* the cause if known/important. The *identity* of the deceased adds nothing material to understanding the public event or its community impact. "A man in his 70s" suffices.
      *   **Stopping Rule 2 Applies:** Since Q4=No (Name not necessary), **DO NOT PUBLISH the name.** Proceed to Stage 3/4 only to confirm.
  3.  **Stage 3/4:**
      *   Even if proceeding: Q6 (PI Gravity for *name*) = **Very Low** (no relevance to event). Q7 (Harm Severity) = **High** (Grieving family's explicit wishes, intrusion on death, dignity of a private individual). Q8/Q9: Family request is a major mitigating factor; omission is a perfect mitigation serving the core PI. Q10: Strong alignment with respecting privacy in grief unless overwhelming PI. Q11: No.
  4.  **Answer: DO NOT PUBLISH THE NAME.** The procedure reaches this clearly at Stage 2, Q4. The public's right to know about the *event* does not extend to knowing the *identity* of a private individual whose death, while occurring publicly, was not of inherent public significance beyond the event itself. **This answer may feel uncomfortable** if there's a newsroom culture of "naming the dead" automatically, or if some readers expect names. The procedure firmly grounds the decision in the *lack of necessity* and the high potential for harm against minimal public interest, upholding dignity and the family's wishes.

  This procedure provides structure, forces consideration of core ethical principles, identifies clear stopping points, and explicitly flags where difficult judgment calls remain. It won't eliminate disagreement, but it will make the *basis* for decisions clearer and more defensible.
