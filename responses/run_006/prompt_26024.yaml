  But then there's the question of costs. Rejecting (2) might require adopting a different metaphysics, like a fact's constituents being inherently combinable. That avoids the regress but needs justifying why relations don't need further relations.

  Another angle is to question if instantiation is a relation at all. If it's not, then (1) might be misinterpreted. But denying instantiation as a relation could lead to other issues, like explaining how properties are tied to objects without any connection.

