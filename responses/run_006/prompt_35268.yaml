answer: |-
  Here’s a structured brainstorm of Anscombe’s argument and how to frame it for your speech, followed by the speech draft itself:

  **Brainstorming Anscombe’s Argument Structure:**
  1.  **Foundational Premise:** Absolute Moral Prohibition. Anscombe starts with a non-negotiable principle: *directly intending the killing of the innocent* (non-combatants) is always murder, absolutely forbidden. This flows from her natural law/Catholic moral theology grounding. No "greater good" utilitarian calculus overrides this. Combatants are legitimate targets; non-combatants are not.
  2.  **Rejection of Consequentialism:** She explicitly attacks the utilitarian justification ("it ended the war faster, saved lives overall"). For Anscombe, the *intrinsic nature* of the act (intentional killing of innocents) makes it morally impermissible, regardless of consequences. This is a core challenge to dominant wartime reasoning.
  3.  **The Doctrine of Double Effect (DDE) as the Key Distinction:** This is her crucial analytical tool. DDE permits foreseen but *unintended* bad side-effects of an otherwise good action, under strict conditions:
      *   The act itself must be good or neutral (e.g., bombing a military factory).
      *   The bad effect (e.g., civilian deaths) must not be the *means* to the good effect.
      *   The intention must *only* be the good effect; the bad effect is merely foreseen and tolerated.
      *   There must be a proportionately grave reason for permitting the bad effect.
  4.  **Application to Hiroshima/Nagasaki: Rejecting the "Side-Effect" Claim:** Anscombe argues the bombings *fail* DDE. Crucially:
      *   **Intention:** The immediate, *intended* means to force surrender was the terror and destruction inflicted *on the civilian population itself*. Their deaths weren't a foreseen side-effect of attacking a military target; *they were the weapon*.
      *   **Means/End:** Civilians weren't *collateral damage*; their annihilation *was the mechanism* chosen to break Japan's will. The bombs targeted cities, not isolated military installations where civilian death was incidental.
      *   **Proportionality Irrelevant:** Because the act itself (intentional mass killing of non-combatants) is intrinsically evil, proportionality calculations for a *side-effect* don't apply. The act is categorically wrong.
  5.  **The Conclusion & Dissent:** Therefore, Truman, as the responsible decision-maker, authorized mass murder. Honoring him with a degree would constitute institutional approval of this grave moral wrong, violating the university's integrity.

  **The Speech Draft:**

  **(Approx. 8-10 minutes)**

  **Title: Dissent, Doctrine, and the Demands of Integrity: Revisiting Anscombe's Argument**

  Colleagues, students, honored guests,

  We gather at the opening of an exhibition not merely about a past controversy, but about the enduring tension inherent in academic life: the duty to pursue truth rigorously, even – *especially* – when it compels dissent against prevailing sentiment. The 1956 debate over President Truman’s honorary degree, centred on Elizabeth Anscombe’s powerful pamphlet "Mr. Truman’s Degree," is a stark exemplar of this tension. Our focus today isn’t on the vote, the personalities, or whether Oxford was right or wrong sixty-eight years ago. Instead, let’s examine the *structure* of Anscombe’s moral argument – its philosophical architecture – and ask why its core challenge remains deeply relevant to how we reason about war and responsibility.

  Anscombe’s dissent rested on a bedrock principle: the absolute moral prohibition against *intentionally killing the innocent*. For her, drawing from the Just War tradition and natural law philosophy, this was non-negotiable. Combatants actively engaged in hostilities forfeit their immunity; non-combatants – civilians – retain an inviolable right not to be directly targeted. This isn't pacifism; it's a severe constraint on *how* war may be waged.

  She utterly rejected the prevalent consequentialist justification for Hiroshima and Nagasaki – that the bombings, however terrible, ended the war swiftly, saving more lives overall. For Anscombe, the *intrinsic nature* of the act mattered absolutely. If the act was intrinsically murderous – the intentional killing of innocents – no appeal to good consequences could justify it. The ends, she argued fiercely, do *not* sanctify the means.

  Her critical analytical tool was the Doctrine of Double Effect (DDE). This principle allows that sometimes, while pursuing a legitimate good end, a bad effect may be *foreseen* but *unintended* and *permitted*, under strict conditions: The act itself must be good (like destroying a munitions factory); the bad effect (civilian casualties) must not be the *means* to the good end; only the good effect must be intended; and there must be a proportionately grave reason to tolerate the bad effect.

  Here lies the crux of Anscombe’s charge against Truman. She argued the atomic bombings were *not* a case of DDE. Why?

  *   **Intention:** The immediate, intended means to compel Japanese surrender was the terror and devastation inflicted *directly upon the civilian population of Hiroshima and Nagasaki*. Their deaths weren't an unfortunate, foreseen side-effect of attacking a primary military target obscured within the city.
  *   **Means/End:** Civilians weren't collateral damage; their mass annihilation *was the instrument*, the very mechanism chosen to break Japan's will to fight. The cities *were* the targets. Destroying them *was* the method. Civilians were not incidentally harmed *while* attacking something else; they *were* the something else being attacked as a strategy.
  *   **Proportionality Moot:** Because the act itself – the direct, intentional killing of non-combatants as a means to an end – was, for Anscombe, intrinsically evil (murder), the question of whether the good consequences *outweighed* this evil became irrelevant. One cannot do evil, she insisted, that good may come. The act was categorically impermissible.

  Therefore, Anscombe concluded, Truman had authorized mass murder. To honour him would be for Oxford to implicitly endorse this act, violating its intellectual and moral integrity.

  **Why does this matter philosophically today, beyond the historical episode?**

  Anscombe forces us to confront the sharp edge of moral reasoning in war: the distinction between *intention* and *foresight*. DDE hinges on this distinction. But does it hold? Can we ever truly separate the intention to destroy a city (knowing its inhabitants will die) from the intention to kill those inhabitants? Critics argue the line is too fine, potentially a convenient fiction, especially with modern weapons where civilian death is overwhelmingly probable. Does the Truman case expose a fragility in this cornerstone distinction? Conversely, if we abandon the centrality of intention, as Anscombe understood it, what protects non-combatants from becoming mere instruments in a utilitarian calculus where "military necessity" or "lesser evil" arguments can too easily justify their sacrifice?

  The exhibition invites us to grapple with Anscombe's rigorous, uncompromising logic. It challenges us to consider the demands of dissent grounded in deep principle, and the perennial question of how institutions dedicated to truth navigate profound moral disagreement. Her argument doesn't offer easy answers. Instead, it presents us with an enduring tension: a stark standard that seems impossibly demanding, and the haunting fear that without it, the moral limits of war dissolve into the fog of consequences.

  Let this exhibition, and the questions it raises about integrity, dissent, and the very structure of moral judgment, provoke our continued reflection. Thank you.

  **Key Features Addressing Your Requirements:**

  1.  **Focus on Argument Structure:** Clearly lays out the premises (absolute prohibition, rejection of consequentialism), the key tool (DDE), and the application (why bombings fail DDE).
  2.  **Clarity for Undergrads:** Defines core terms (non-combatant, DDE, intention vs. foresight) and uses concrete examples (destroying factory vs. destroying city).
  3.  **Rigor for Colleagues:** Accurately presents the nuances of DDE, the means/end distinction, and the intrinsic evil claim without oversimplification.
  4.  **Neutral Framing for Administrators:** Explicitly frames the talk as about *philosophical reasoning* and *academic integrity/dissent*, using the episode as an *illustration*. Avoids "Oxford was wrong/right" language, focusing on "Anscombe argued..." and the *structure* of her dissent. Emphasizes contemporary relevance.
  5.  **Open Ending:** Concludes by posing the live philosophical tension – the challenge to the intention/foresight distinction and the fear of moral dissolution without it – rather than resolving the Truman case or endorsing/condemning Anscombe outright. Ends with "enduring tension" and "provoke reflection."
  6.  **Historical Context Minimized:** Mentions the honorary degree proposal and pamphlet title, but avoids vote drama, personalities, or re-litigating the 1956 decision itself. Context serves only to launch the philosophical examination.
