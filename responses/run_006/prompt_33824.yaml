answer: |-
  This puzzle involves a lottery with a conditionally convergent expected utility series, and it is closely related to the **Pasadena game**, introduced by Harris Nover and Alan Hájek in their 2004 paper "Vexing Expectations". The Pasadena game exemplifies a deeper phenomenon in decision theory where the expected value of a lottery is not invariant under rearrangement of its terms, leading to ambiguity in valuation. Below, I address your queries systematically.

  ### 1. **Name of the Puzzle**
     - **Established Name**: This is the **Pasadena game** (or a variant thereof). The canonical Pasadena game sets the payoff for the first heads on the \(n\)-th toss to \((-1)^{n+1} \cdot 2^n / n\), with probability \(1/2^n\). The expected utility series in the natural order (outcomes listed by toss number) converges to \(\ln 2 \approx 0.693\), a finite positive number. However, the series is conditionally convergent (not absolutely convergent), so rearranging the order of terms can make the sum converge to any real number, diverge to \(\pm\infty\), or oscillate.

  ### 2. **Underlying Phenomenon and Diagnostic**
     - **Core Issue**: Conditional convergence of the expected utility series.
       - **Conditional convergence**: The series \(\sum_{n=1}^{\infty} a_n\) converges, but \(\sum_{n=1}^{\infty} |a_n|\) diverges.
       - In your case, \(a_n = \text{payoff}_n \times \mathbb{P}(n)\).
       - For payoffs like \((-1)^{n+1} \cdot 2^{n-1} / n\) (or similar), \(|a_n|\) behaves like the harmonic series (e.g., \(\sum |a_n| \sim \sum \frac{1}{n}\)), which diverges. Thus, the series is conditionally convergent.
     - **Riemann Rearrangement Theorem**: Any conditionally convergent series can be rearranged to converge to any predetermined real number, or to diverge. This is not a mere technicality—it reflects a fundamental indeterminacy in the "sum" of the series when absolute convergence fails.
     - **Consequence for Decision Theory**: The expected value is **order-dependent**. Listing outcomes in the natural order (toss sequence) yields one sum; grouping positive terms first yields a large positive sum; interleaving positive and negative terms strategically can force convergence to any target value.

  ### 3. **How This Differs from Nearby Paradoxes**
     - **St. Petersburg Paradox**:  
       - Payoffs grow exponentially (\(2^n\)) without sign alternation.  
       - \(\sum |a_n|\) diverges (like \(\sum 1\)), and the series diverges to \(+\infty\).  
       - **Key difference**: Here, the expectation is infinite and unambiguous (though controversial). Your puzzle has a finite natural-order sum but order-dependence.  
     - **Pasadena vs. Altadena**:  
       - **Pasadena game**: Payoff \(= (-1)^{n+1} \cdot 2^n / n\) → conditionally convergent.  
       - **Altadena game** (a "fix"): Payoff \(= (-1)^{n+1} \cdot 2^n / n^2\) → absolutely convergent (\(\sum |a_n| \sim \sum 1/n^2 < \infty\)).  
       - **Key difference**: Absolute convergence in the Altadena game ensures order-invariance and a well-defined expectation. Your puzzle matches the Pasadena structure.

  ### 4. **Status of the Expected Value**
     - **Standard View (Measure-Theoretic Probability)**:  
       The expectation is **undefined**. Formally, for a random variable \(X\), \(\mathbb{E}[X]\) is defined only if \(\mathbb{E}[|X|] < \infty\) (i.e., absolute integrability). Here, \(\mathbb{E}[|X|] = \sum |\text{payoff}_n| \cdot \mathbb{P}(n) = \infty\), so \(\mathbb{E}[X]\) does not exist.  
       - **Why this is principled**: Absolute convergence ensures linearity, dominance, and independence from arbitrary choices (e.g., outcome labeling). Without it, "expectation" loses its normative force.  
     - **Alternative Views**:  
       - **Order-Relative Expectation**: Define \(\mathbb{E}[X]\) relative to a specific order (e.g., natural toss order). This is ad hoc and violates the principle that probabilities—not labels—should determine value.  
       - **Weakly Convergent Approaches**: E.g., Cesàro summation (averaging partial sums) or discounting. These are not general solutions and lack decision-theoretic foundations.  

  ### 5. **Principled Fixes**
     - **Require Absolute Convergence**: Reject lotteries with \(\mathbb{E}[|X|] = \infty\). This aligns with standard probability theory and avoids order-dependence.  
       - *Implementation*: Rescale payoffs to ensure \(\sum |\text{payoff}_n| \cdot \mathbb{P}(n) < \infty\) (e.g., Altadena-style: use \(|\text{payoff}_n| \propto 1/n^2\)).  
     - **Decision Theories with Order-Invariance Constraints**:  
       - **Framed-Stochastic Dominance** (Nover & Hájek): Only preferences invariant under all rearrangements are rational. In the Pasadena game, no such preference exists, so the lottery is incomparable.  
       - **Relative Expectation** (Colyvan): Compare lotteries using limits of partial sums in a fixed order. Still order-dependent but consistent if the order is fixed.  

  ### Summary
  - **Name**: Pasadena game (or a variant).  
  - **Diagnostic**: The expected utility series is **conditionally convergent** due to the combination of:  
    (i) Alternating signs,  
    (ii) Payoffs growing exponentially (e.g., \(2^n\)),  
    (iii) Probabilities decaying exponentially (e.g., \(1/2^n\)),  
    (iv) A "dampening factor" (e.g., \(1/n\)) making \(|a_n|\) harmonic-like.  
  - **Expected Value**: **Undefined** in standard probability theory. Order-dependence is a symptom of divergence in absolute expectation.  
  - **Principled Response**: Reject such lotteries or redesign payoffs/payoff-modelling to ensure absolute convergence.  

  This paradox highlights that decision theory cannot ignore the mathematics of convergence. When absolute expectation diverges, the notion of "expected value" becomes incoherent, and rational choice requires additional structure (e.g., a privileged order) or rejection of the lottery. For deeper analysis, see Nover & Hájek (2004) and subsequent literature on infinite decision theory.
