prompt: |-
  I'm supposed to lead a discussion section for a metaethics course on the Frege–Geach problem for expressivism. The students are advanced undergrads who've done a bit of philosophy of language (they know what compositionality is and they've seen truth-conditional semantics) but this is their first metaethics unit. I've got fifty minutes.

  Don't explain the problem to me — I get it. I need a teaching plan. What has to go first, what's the one example that carries the whole thing, and why that example rather than some other one? What misconceptions are they going to form (I'm guessing at least one is "oh so expressivism just can't handle logic, easy refutation then") and exactly where in the sequence should I head each one off? What do I deliberately leave out and say so? And give me one question I can ask near the end to check whether they've actually understood the problem rather than just memorized the moves.
reasoning: |-
  Okay, the user is leading a discussion section on the Frege-Geach problem for expressivism in a metaethics course. They need a teaching plan for advanced undergrads who have some philosophy of language background but are new to metaethics. The session is fifty minutes long.

  First, I need to structure the session effectively. Starting with a quick recap of expressivism makes sense since it's their first metaethics unit. I'll use Ayer's emotivism as a clear example. Then, I should introduce the embedding problem because that's where Frege-Geach hits hardest. The key example should be a simple moral modus ponens argument—something like "Lying is wrong. If lying is wrong, then getting your little brother to lie is wrong. Therefore, getting your little brother to lie is wrong." This example is central because it shows how expressivism struggles with moral conditionals and logical inferences, which are core to the problem.

  The students might think expressivism is easily refuted because it can't handle logic. I need to address this misconception early by explaining that expressivism can be sophisticated. Pointing out Blackburn's quasi-realism as a response would help, but I should save that for the end to keep focus on the problem itself.

  I should deliberately leave out solutions to avoid overwhelming them. Mentioning that there are responses but they'll be covered later keeps the session focused. For checking understanding, asking them to explain why a conditional like "If lying is wrong, then getting your brother to lie is wrong" is problematic for expressivism would be effective. It tests if they grasp why compositionality and inference are issues beyond simple assertions.

  Timing is crucial. Allocating specific minutes to each section ensures coverage: intro (5 mins), expressivism recap (10 mins), embedding problem intro (5 mins), key example breakdown (15 mins), misconceptions (5 mins), implications (5 mins), and wrap-up with Q&A (5 mins). Using the same example throughout maintains clarity.

  The user's deeper needs include ensuring students grasp the problem's significance without getting lost in technicalities. They want to prevent misconceptions and confirm real understanding. By structuring the session around a single, relatable example and addressing pitfalls explicitly, the discussion should stay engaging and effective.
answer: |-
  Here's a battle-tested 50-minute plan focused on clarity, engagement, and preempting misconceptions, using a single core example:

  **Core Example:** The Moral Modus Ponens
  1.  **Lying is wrong.** (Assertion: `P`)
  2.  **If lying is wrong, then getting your little brother to lie is wrong.** (Conditional: `If P, then Q`)
  3.  **Therefore, getting your little brother to lie is wrong.** (Conclusion: `Q`)

  **Why this example?**
  *   **Universally Relatable:** Involves a simple, concrete moral judgment everyone understands.
  *   **Crystal Clear Logic:** It's an undeniably valid inference (Modus Ponens). Students *feel* the logical force.
  *   **Embeds Perfectly:** The key problematic element (`P`) appears both asserted (Premise 1) and unasserted (in the antecedent of Premise 2).
  *   **Highlights Compositionality:** Requires explaining how the meaning of `P` contributes to the complex meaning of `If P, then Q`.
  *   **Exposes the Core:** Directly shows the tension between expressivist meaning (attitude expression) and logical function.

  **Teaching Plan (50 Mins):**

  1.  **Hook & Roadmap (3 mins):**
      *   "Last lecture covered Expressivism: moral judgments express non-cognitive attitudes (boo!/hooray!, plans, commitments), not beliefs about moral facts. Seems simple for 'Murder is wrong'... but what happens when we put moral claims *inside* complex sentences like conditionals, negations, or arguments? *That's* the Frege-Geach problem. Today: Why this is a serious challenge, not a quick refutation."
      *   **Goal:** Frame the problem as about *compositionality* and *logic within language*, not just "feelings."

  2.  **Quick Expressivism Recap (7 mins):**
      *   **Focus:** Meaning of a *simple, asserted* moral sentence (e.g., "Lying is wrong").
      *   **Key Point:** "On expressivism (Ayer-style), uttering 'Lying is wrong' *doesn't primarily describe a fact*; it *expresses* a negative attitude (disapproval, 'Boo lying!'). The meaning *is* the expression of that attitude."
      *   **Q:** "What *doesn't* 'Lying is wrong' primarily do, according to expressivism?" (Answer: State a truth-apt proposition/belief about a fact).
      *   **Goal:** Cement the core expressivist commitment: meaning = attitude expression for atomic moral sentences.

  3.  **Introducing the Embedding Problem (5 mins):**
      *   "Okay, so 'Lying is wrong' expresses disapproval. Now look at Premise 2: **'If lying is wrong, then getting your little brother to lie is wrong.'**"
      *   "When I assert *this* whole sentence, what attitude am I expressing? Am I expressing disapproval of lying *right now*? Clearly not. I might think lying is perfectly fine, but still agree that *if* it's wrong, then getting your brother to do it is wrong."
      *   **Q:** "If I say 'If it rains, the picnic is cancelled,' am I expressing a belief that it *is* raining? Or that the picnic *is* cancelled?" (Answer: No).
      *   **Goal:** Show that the *same words* ("lying is wrong") appear in a context where the speaker is *not* expressing the attitude supposedly constituting their meaning.

  4.  **Deep Dive: The Core Example & Problem (15 mins - THE HEART):**
      *   Present the full Modus Ponens argument (P, If P then Q, Therefore Q).
      *   **Step 1: Validity.** "Is this argument logically valid? (Yes, Modus Ponens). We *use* logic like this all the time in moral reasoning. Expressivism needs to explain how we can do this."
      *   **Step 2: Expressivist Breakdown:**
          *   Premise 1 (`P`): Expresses disapproval of lying. (Okay).
          *   Premise 2 (`If P, then Q`): What does *this* express? Not disapproval of lying! Not disapproval of getting brother to lie! What *non-cognitive state* corresponds to accepting a conditional? (Pause for thought). Expressivism struggles to say.
          *   Conclusion (`Q`): Expresses disapproval of getting brother to lie. (Okay, but how did we get here logically?).
      *   **Step 3: The Compositionality Challenge:** "The meaning of the whole conditional (`If P, then Q`) must be built from the meanings of its parts (`P`, `Q`, `If...then...`). But if the meaning of `P` *is* expressing disapproval of lying, how does plugging that meaning into the 'if...then...' structure yield the meaning of the conditional – which *doesn't* express that disapproval? How does the attitude 'hook into' the logical operator?"
      *   **Step 4: Inference Challenge:** "For the argument to be valid, the meaning of `P` in Premise 1 and the meaning of `P` in Premise 2 *must be the same thing*. Otherwise, it's equivocation. But Premise 1 uses `P` to express an attitude, Premise 2 embeds `P` without expressing it. How can they have the *same meaning*? How does the logic 'track' the attitude?"
      *   **Goal:** Hammer home the dual problem: compositionality of complex sentences and preservation of meaning/inference validity across asserted/unasserted contexts.

  5.  **Addressing Misconceptions Head-On (5 mins - CRITICAL):**
      *   **Misconception: "Oh, so expressivism just can't handle logic, easy refutation then."**
      *   **Response:** "NO! That's the biggest mistake. The problem isn't that expressivists are *illogical* or deny logic. The problem is *explaining how their theory of meaning* (meaning = attitude expression) *can account for the compositional meaning of complex sentences* and *validate obviously good inferences* like Modus Ponens *using that meaning*. Expressivists like Blackburn (quasi-realism) take this very seriously and develop sophisticated responses. It's a challenge *for the theory*, not proof it's false. We'll look at responses later!"
      *   **Goal:** Prevent dismissiveness. Frame it as an *explanatory* challenge within the theory.

  6.  **Implications & What We Leave Out (5 mins):**
      *   **Implications:** "This problem isn't just about conditionals. It arises for negation ('Lying isn't wrong' - does this express an *anti*-disapproval? Or lack of disapproval?), disjunctions, belief reports ('Alice believes lying is wrong'), etc. Anywhere a moral sentence appears without being directly asserted."
      *   **What We Leave Out (Say This):** "We're focusing *only* on understanding the problem today. We are *not* covering the main expressivist responses (like Blackburn's account of higher-order attitudes or Gibbard's plan-theoretic semantics) or how other non-cognitivist theories (prescriptivism) handle it. That's for next time! We're also simplifying the expressivist starting point."
      *   **Goal:** Show the scope of the problem, manage expectations, keep focus.

  7.  **Check for Understanding Question & Wrap-up (5 mins):**
      *   **Key Question:** "Imagine an expressivist who says the meaning of 'Lying is wrong' is just expressing disapproval of lying. Now, consider the sentence: **'If lying is wrong, then it's probably also illegal in most places.'** Why is explaining the meaning and use of *this* sentence particularly problematic for the expressivist, compared to the simple assertion 'Lying is wrong'? Focus on the function of 'lying is wrong' *within* the conditional."
      *   **What you want to hear:** Recognition that the expressivist needs to explain: 1) What mental state the *whole* conditional expresses (it's not disapproval of lying or of it being illegal), and 2) How the meaning contribution of "lying is wrong" *inside* the conditional (which isn't expressing disapproval) is the *same* as its meaning when asserted (which *is* expressing disapproval), so that logical connections to other sentences using "lying is wrong" are preserved. They should mention compositionality and the unasserted context.
      *   **Wrap-up:** Briefly reiterate: "The Frege-Geach problem is the challenge for expressivism of explaining the compositionality of complex moral sentences and the validity of moral inferences, given their core thesis about the meaning of atomic moral sentences. It's a serious hurdle, not a knockout punch."

  **Why this sequence works:**

  1.  **Builds from Known:** Starts with simple expressivism they (should) know.
  2.  **Introduces Problem Intuitively:** Uses the conditional embedding to create the "aha!" moment of the core issue.
  3.  **Leverages Core Example:** Uses one clear example for *everything* (embedding, compositionality, inference), maximizing coherence.
  4.  **Preempts Key Misconception:** Directly addresses the "easy refutation" fallacy at the point where students are most likely to form it (after seeing the problem).
  5.  **Manages Scope:** Clearly states what's *not* covered (solutions), preventing confusion and setting up future lectures.
  6.  **Tests Deep Understanding:** The final question requires applying the concepts (compositionality, unasserted context) to a *slightly different* complex sentence, not just regurgitating the Modus Ponens breakdown.

  **Tone:** Be energetic, frame it as a fascinating puzzle ("How *can* expressivism possibly solve this?"), not just a dry problem. Encourage "stupid" questions – the concepts are subtle! Good luck!
