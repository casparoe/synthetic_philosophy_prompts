prompt: |-
  so i had a kid last year and it's completely scrambled my thinking on climate ethics. i used to have a neat set of views but now i'm actually living with the consequences of them and i'm not sure they all fit together. would love a consistency check before i embarass myself in front of the philosophy friends i still pretend to keep up with.

  here's what i think i think:

  (a) pure time preference — discounting future wellbeing just because it's temporally distant — is morally arbitrary and unjustified

  (b) the non-identity problem is a real problem, not a pseudoproblem. Parfit was right that if our choices affect who gets born, we can't straightforwardly say we've harmed those future people by making them worse off than they would have been, because they wouldn't have existed otherwise

  (c) i'm drawn to person-affecting views: an act can only be wrong if it's wrong for some particular person. i don't think we should be trying to maximize some impersonal quantity like total utility

  (d) climate change is a grave moral wrong and we — my generation, the ones burning the carbon — have strong obligations to mitigate it

  (e) i don't think having a child makes me a hypocrite about climate change. if anything, loving someone who'll inherit the mess makes the moral urgency feel more real, not less

  so i guess my question is: does this hang together? i feel like (b) and (d) are pulling in opposite directions, but i can't quite articulate why, and i'm worried that (c) makes it worse. also i suspect (a) and (c) might be in tension though i'm not sure. basically i need someone to go through these and tell me which pairs actually conflict, which ones only look like they conflict, and what the cheapest fix is. be brutal, i can take it.
