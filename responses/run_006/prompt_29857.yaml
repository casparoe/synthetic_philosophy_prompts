  Okay, the user is grappling with Aquinas's nuanced treatment of self-defence in the Summa Theologiae, specifically the distinction between intended effects and unintended side effects. They're confused about how a private person can cause an aggressor's death without intending it, while public authorities can intend death licitly. 

  Hmm, the core tension lies in practical application: if a civilian uses lethal force knowing it might kill, how is that different from a soldier's intentional killing? The user seems philosophically literate but tripped up by psychological versus moral categories. They're asking for concrete examples to illuminate Aquinas's abstract principles—especially the proportion/intention interplay.

  Right, I should start by dissecting Aquinas's "double effect" framework: 1) the act mustn't be intrinsically evil, 2) the bad effect isn't intended, 3) the good effect isn't caused by the bad, and 4) proportionality. The key is that intention belongs to the chosen means/end, not foreseen consequences. 

  For the civilian example: imagine someone shoves an attacker down stairs to escape. Death isn't willed as an end or means—it's a risk accepted reluctantly. Whereas a soldier shooting to kill chooses death as a means to defence. The proportion test then adds a further check: even if death is unintended, using a grenade against an unarmed thief would be disproportionate.

  Ah, and the user’s "must I hope he survives?" question is astute. Aquinas would say no—hope isn't required, but you mustn’t positively want the death. Ceasing force upon incapacitation shows your intent was defence, not killing. 

  The jurists' "blameless defence" phrase Aquinas cites is crucial too—it anchors his view in legal tradition. Maybe I should emphasise that for him, moral species derives from what you commit to, not what you foresee. 

  Proportion and intention are separate hurdles: an act could pass proportionality (minimal force) but fail if death is intended (e.g. deliberately aiming for head when leg would suffice). Conversely, unintended death could be disproportionate (crushing a pickpocket with a car). 

  The soldier/civilian difference hinges on role morality: public agents act for common good, so their lethal intent is subordinated to that higher end. A civilian lacks that warrant—their intent must stay purely defensive. 

  I'll use the burglar example in my reply: shooting centre-mass versus tripping. The first intends death as means; the second risks it. That should clarify the mental distinction Aquinas wants.
answer: |-
  Below is a careful analysis of Aquinas's argument in British English, addressing your specific concerns about intention, proportionality, and practical application.

  ### Core Principles from the Text
  1.  **Double Effect Doctrine:** A single act can have two effects: one intended (the good effect), and one unintended but foreseen (the bad effect). The moral character ("species") of the act is determined *solely* by what is intended.
  2.  **Legitimate Intention for Private Persons:** In self-defence, the private individual must intend *only* the preservation of their own life. The death of the aggressor must be an *unintended side effect* ("beside the intention").
  3.  **Proportionality:** Even with a good intention (self-preservation), the act becomes unlawful if the force used is "out of proportion to the end," i.e., excessive or unnecessary.
  4.  **Illicit Intention to Kill for Private Persons:** A private person may *never lawfully intend to kill* the aggressor. Only public authorities (like soldiers or agents of a judge) can licitly intend to kill, and *only* when doing so serves the public good (e.g., defending society against an enemy or robber).
  5.  **Obligation to Self:** One has a greater duty to preserve one's own life than the life of an unjust aggressor. Therefore, one need not abstain from moderate self-defence merely to avoid the *risk* of killing the aggressor.

  ### Resolving the Apparent Contradiction: Intention vs. Foresight
  The key to understanding Aquinas lies in the precise meaning of *intention*. For him, intention refers to the *chosen purpose* or *objective* of the act. What is *foreseen* as a likely or possible consequence, but not chosen as an end or as a means to the end, is *not* intended in the morally relevant sense.

  *   **Private Person:** Their lawful intention is *self-preservation*. The death of the aggressor is *foreseen* as a possible or even likely outcome of the act necessary for self-preservation, but it is *not willed*. The death is *not part of the plan*; it is an unwanted, albeit foreseen, consequence of an act chosen solely to stop the attack and save oneself. One acts *despite* the risk of death, not *in order to* cause death.
  *   **Public Authority:** Their lawful intention *can* include *causing the death* of the aggressor. Why? Because their role and justification stem from the *public good*. When a soldier kills an enemy soldier in battle, or a constable kills a robber resisting arrest, the death of the aggressor is *intended as the chosen means* to achieve the public good of security and justice. Their intention *is* to use lethal force to stop the threat, precisely because their authority and duty extend to protecting the common good through such means.

  ### Practical Distinction in State of Mind: Concrete Example
  **Scenario:** A burglar breaks into your home at night wielding a knife, clearly intent on killing you. You grab a fireplace poker.

  *   **Lawful Private Defence (Death Unintended):** You judge that striking the burglar forcefully on the arm or shoulder is *necessary and sufficient* to disarm him or incapacitate him long enough for you to escape or call for help. You *foresee* that such a blow *might* cause fatal injury (e.g., if he falls badly or has an underlying condition), but your *chosen purpose* (intention) is *only* to stop his attack and defend your life. You do not *aim* to kill him; you aim to *stop* him. If he falls and hits his head fatally, his death is an unintended, albeit foreseen, side effect of your act of proportionate defence. You would *cease* your defence the moment he is incapacitated (e.g., drops the knife, falls unconscious). You might *hope* he survives, but Aquinas doesn't strictly require hope – your obligation is that death is *not your objective*.
  *   **Unlawful Private Defence (Death Intended):** You judge that a blow to the arm *might* stop him, but you fear it won't be enough. Instead, you deliberately aim the poker at his head with the *purpose* of killing him to ensure he is stopped. Here, his death is no longer a side effect; it has become the *chosen means* to your end (your safety). This is unlawful for a private person. Aquinas would argue you *must* use the less lethal means (aim for the arm/shoulder) and accept the *risk* it might not work or might accidentally kill, rather than *choose* to kill.
  *   **Lawful Public Defence (Death Intended):** A police officer responding to the scene faces the same armed burglar threatening you. The officer, acting under public authority and for the common good (protecting an innocent life and apprehending a dangerous criminal), has the lawful authority to *intend* to use lethal force if necessary. The officer can shoot the burglar with the intention of stopping the threat by killing him, because this intention serves the public good within the officer's mandate.

  ### Interaction of Intention and Proportionality
  Aquinas sets up two distinct but related conditions for lawful self-defence by a private person:

  1.  **Intention Condition:** The death of the aggressor must be unintended (merely foreseen).
  2.  **Proportionality Condition:** The force used must be the *minimum reasonably necessary* to achieve the legitimate end of self-preservation ("moderate," not "more than necessary violence").

  *   **Proportionate Force, Illicit Intention:** An act could use proportionate force but *still* be unlawful due to intention. Example: The burglar is slightly built and only armed with a small stick. A single, well-controlled shove would likely disarm him and allow escape. Instead, you shove him hard *wanting* him to fall down the stairs and die, and he does. The force *might* be arguable as proportionate in isolation (a shove), but your *intention* to kill makes the act unlawful.
  *   **Disproportionate Force, Lawful Intention?** An act with a lawful intention (only self-preservation) but disproportionate force is *always* unlawful. Example: The burglar is unarmed and simply grabbing your wrist to restrain you (not threatening life). You shoot him dead. You *might* claim you only intended to stop him, not kill him. However, using lethal force against a non-lethal threat is *grossly disproportionate*. The act is unlawful because it violates the proportionality condition, *even if* your subjective intention was purely defensive. The means are "out of proportion to the end."

  **Where Aquinas Draws the Line:** The line between intended death and merely foreseen death is drawn at the agent's *chosen objective and chosen means*.

  *   **Intended Death:** Death is willed either as the *end* (I want him dead) or as the *chosen means* to the end (I *need* him dead to be safe; killing him is my plan for stopping him).
  *   **Merely Foreseen Death:** Death is a *probable or possible consequence* of an act chosen *only* to achieve the legitimate end (stopping the attack) through means *not in themselves aimed at killing*. The agent does not *rely* on the death to achieve the end; they rely on the *incapacitating effect* of the blow/strike/force. If the aggressor survives, the defence was still effective. If they die, it was an unwanted outcome.

  **In Practice:** For the private defender, the lawful state of mind is: "I am doing *this act* (e.g., striking the arm/shoulder, shoving) *only* to stop his attack and save my life. I wish he wouldn't force me to do this. I regret that this action might kill him. I will stop immediately if he drops the weapon or falls down. I do not *want* him dead; I only want him *stopped*." The soldier/minister of justice can licitly think: "To protect the public/achieve justice, I must stop this threat. The most effective/reliable/necessary way to stop him is to kill him. Therefore, I *will* kill him."

  Aquinas's distinction is challenging but central to his ethics: the *moral object* (what you choose to do) is defined by your intention. A private person may never morally *choose* to kill another human being; they may only choose acts of necessary defence, reluctantly accepting the foreseen risk that death might unintentionally result. Public authorities, acting for the common good, *can* morally choose to kill as a last resort to fulfil their duty. Proportionality acts as an objective check on both intentions and actions.
