prompt: |-
  I am working through Aquinas's treatment of self-defence in the Summa Theologiae (II-II, Q. 64, A. 7) and find myself stuck on the central passage, which I reproduce below. I would be grateful for help understanding it.

  Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention. Now moral acts take their species according to what is intended, and not according to what is beside the intention, since this is accidental as explained above (Q[43], A[3]; FS, Q[12], A[1]). Accordingly the act of self-defense may have two effects, one is the saving of one's life, the other is the slaying of the aggressor. Therefore this act, since one's intention is to save one's own life, is not unlawful, seeing that it is natural to everything to keep itself in "being," as far as possible. And yet, though proceeding from a good intention, an act may be rendered unlawful, if it be out of proportion to the end. Wherefore if a man, in self-defense, uses more than necessary violence, it will be unlawful: whereas if he repel force with moderation his defense will be lawful, because according to the jurists, "it is lawful to repel force by force, provided one does not exceed the limits of a blameless defense." Nor is it necessary for salvation that a man omit the act of moderate self-defense in order to avoid killing the other man, since one is bound to take more care of one's own life than of another's. But as it is unlawful to take a man's life, except for the public authority acting for the common good, as stated above (A[3]), it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority, who while intending to kill a man in self-defense, refer this to the public good, as in the case of a soldier fighting against the foe, and in the minister of the judge struggling with robbers, although even these sin if they be moved by private animosity.

  What troubles me is the following. Aquinas maintains that a private person may lawfully perform an act of self-defence that results in the aggressor's death, so long as the death is "beside the intention" and the force used is moderate. Yet he immediately adds that it is not lawful for a private person to intend killing a man in self-defence—only those with public authority may do so. I cannot grasp how, in practice, a private person's state of mind is meant to differ from a soldier's or a judge's officer's. If I strike an assailant with a weapon I know is likely to kill him, and I do so because I judge that nothing short of that will stop him, in what sense is his death not intended? Is the idea that I must positively hope he survives, or merely that I must be prepared to stop the moment he is incapacitated? And how does the "proportion" condition—the requirement that the act not be "out of proportion to the end"—interact with the intention condition? Could a use of force be proportionate yet still involve an illicit intention, or vice versa? I would appreciate a careful walkthrough of how these distinctions are meant to apply to a concrete case, and where exactly Aquinas draws the line between an intended death and one that is merely foreseen.

  Please write your answer in British English.
