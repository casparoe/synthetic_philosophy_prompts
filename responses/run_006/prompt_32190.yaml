answer: |-
  Your analysis is remarkably perceptive – you've identified the core tension and major dimensions of this enduring debate. Let's diagnose the nature of the disagreement and explore paths forward:

  **Diagnosis: A Multi-Faceted Disagreement**

  1.  **Foundational Philosophical Commitments (Your Hypothesis is Strong):**
      *   **Institutionalist/Functionalist Perspective (Walzerians):** This view prioritizes the *functional role* of soldiers within a state-based system and the *practical necessity* of clear, symmetrical rules of engagement to limit the horrors of war ("war convention"). Morality is seen *through the lens of the institution of war*. Soldiers are moral agents, but their agency is constrained and defined by their role. The primary moral failure lies with the aggressor *state* and its leaders.
      *   **Individualist/Moralist Perspective (Revisionists):** This view prioritizes fundamental, pre-institutional moral principles (like self-defense, liability based on responsibility for unjust threat). Morality applies directly to individuals *irrespective of their role*. The "institution" of war doesn't create new moral permissions; it must be justified *by* the underlying individual morality. The moral failure lies with individuals (including soldiers) who contribute to unjust aggression.
      *   **You're right:** These are deep, almost axiomatic starting points. Arguments often *do* beg the question because each side's criteria for a successful moral theory differ. The Walzerian asks, "What rules make war less awful in practice?" The Revisionist asks, "What does basic morality demand of each person?"

  2.  **Empirical/Epistemic Dimension (Your Suspicion is Correct):**
      *   **Epistemic Constraints:** How feasible *is* it for an individual combatant to reliably judge the *jus ad bellum* justice of their nation's cause? Revisionists often assume a level of accessible moral clarity that Walzerians (and critics like David Estlund) argue is unrealistic under conditions of propaganda, state secrecy, fog of war, and patriotic indoctrination. This impacts the *blameworthiness* of the unjust combatant.
      *   **Consequentialist Undertones:** Walzer's symmetry argument implicitly relies on a consequentialist prediction: that asymmetric rules would lead to *worse* outcomes – escalation, disregard for rules, endless arguments about justice hindering surrender or ceasefires, making wars bloodier and harder to end. Revisionists counter that recognizing asymmetry could deter aggression. This *is* an empirical debate about likely real-world effects of adopting different frameworks.

  3.  **Semantic/Conceptual Dimension (The "Permissible" Point is Crucial):**
      *   **Scope of "Permissible":**
          *   **All-Things-Considered Permissible (Walzerians):** Given the institutional context and epistemic constraints, it is not *blameworthy* or *punishable* for an unjust combatant to fight following the rules. They have a "license" derived from their role.
          *   **Pro Tanto Permissible / Liability (Revisionists):** Killing an unjust combatant is permissible *because they are morally liable* to defensive harm due to their contribution to an unjust threat. Killing a just combatant is *never* permissible in this sense; it's murder. The "license" is illusory.
      *   **"Combatant":** Is it a purely functional descriptor (anyone fighting), or does it carry inherent moral permissions? Revisionists often argue the functional definition is insufficient for grounding moral permissions.

  4.  **Morality vs. Law Distinction (Absolutely Central):**
      *   **The Law of Armed Conflict (LOAC)/IHL:** This is *explicitly* symmetrical. It *must* be, for pragmatic reasons: verifiability, reciprocity, enforceability, and preventing chaos. Walzerians argue the moral "war convention" *justifies* and *underpins* this legal symmetry. Revisionists largely agree LOAC *should* remain symmetrical for these pragmatic reasons, but argue it represents a *compromise* with deeper, asymmetric moral truths. **This is often the biggest source of confusion.** Critics accuse Revisionists of conflating ideal morality with practical law; Revisionists accuse Walzerians of letting pragmatic law dictate fundamental morality.

  **What Kind of Disagreement Is This?**

  It's a **complex, multi-level disagreement** combining:

  *   **Deep Meta-Ethical/Foundational Disagreement:** About the role of institutions vs. fundamental individual morality in governing wartime conduct.
  *   **Conceptual Disagreement:** About the meaning of key terms like "permissible," "combatant," and "liability" in the context of war.
  *   **Empirical Disagreement:** About the epistemic capabilities of soldiers and the likely real-world consequences of adopting asymmetric moral frameworks.
  *   **Disciplinary Focus Disagreement:** Philosophers lean towards ideal theory (Revisionism), while international lawyers and military ethicists prioritize the functional, rule-based system (Walzer).

  **Paths to Progress:**

  Given this diagnosis, progress isn't about one side "winning," but about clarifying, refining, and finding useful applications:

  1.  **Explicitly Acknowledge the Foundational Divide:** Scholars should stop talking past each other by explicitly stating whether their argument is from an institutional/functionalist perspective or an individualist/moralist one. Framing papers as "Given institutional constraints X, what follows?" or "Ignoring practical constraints, what does fundamental morality demand?" would add clarity. Recognizing these as different (but both valid) *levels* of analysis is key.
  2.  **Deepen the Epistemic Inquiry:** More rigorous empirical work (historical, sociological, psychological) on:
      *   What soldiers *actually* know/believe about the justice of their cause.
      *   How information (and misinformation) flows in military structures.
      *   Whether feasible mechanisms for individual *jus ad bellum* assessment could exist.
      This could refine the Revisionist account (e.g., degrees of blameworthiness based on reasonable belief) or bolster the Walzerian emphasis on role-based obligations under uncertainty.
  3.  **Refine Consequentialist Predictions:** Better modeling and historical analysis of the potential effects of widespread adoption of asymmetric moral norms. Would it deter aggression? Would it lead to more brutal wars? Would it undermine surrender mechanisms? This is crucial for assessing the Walzerian worry and the Revisionist hope.
  4.  **Clarify the Morality-Law Distinction:** Relentlessly separate the questions:
      *   What does *ideal morality* demand? (Revisionist stronghold)
      *   What *legal and institutional rules* are feasible and beneficial for governing actual wars? (Where Walzerian symmetry remains dominant, often with Revisionist agreement)
      *   How should soldiers be *trained*? (Might blend elements – e.g., "Follow LOAC strictly, but understand the deeper moral stakes")
  5.  **Conceptual Refinement:** More precise analysis of:
      *   Degrees of liability (not all unjust combatants are equally responsible).
      *   The nature of the "threat" posed by a just combatant (Is it "innocent" if necessary for defense?).
      *   The moral status of following *legal* orders within an *illegal* war (a key point of contention).
  6.  **Focus on Applications:** Instead of rehashing the core symmetry debate, apply both frameworks to specific, thorny issues:
      *   The ethics of guerrilla warfare/non-state actors.
      *   The responsibility of weapons manufacturers/suppliers.
      *   The treatment of surrendered/detained combatants.
      *   The concept of "supreme emergencies."
      Progress might emerge from seeing which framework yields more coherent or practical answers in these contexts.

  **Conclusion:**

  Your hypothesis about the institutional vs. individual perspective is fundamentally correct and explains the stalemate's persistence. However, the debate is enriched and complicated by genuine empirical uncertainties, conceptual ambiguities, and the critical distinction between ideal morality and practical law. **Progress won't look like consensus on the core question of symmetry.** Instead, it will involve:

  1.  **Mapping the Terrain:** Clearly articulating the different levels and types of questions involved.
  2.  **Refining Positions:** Incorporating empirical insights and conceptual clarity within each framework.
  3.  **Bridging Pragmatically:** Finding areas where insights from both traditions can inform practical rules, laws, and training, even if their ultimate foundations differ.
  4.  **Shifting Focus:** Moving the debate towards applying these frameworks to concrete, emerging challenges in warfare.

  The debate is unlikely to "resolve," but it can become more productive, nuanced, and practically relevant by acknowledging its multi-dimensional nature. You've grasped the core dilemma brilliantly – the path forward lies in navigating its complexity, not expecting a simple victor.
