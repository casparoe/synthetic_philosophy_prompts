prompt: |-
  A guy in my decision theory reading group keeps cutting off my point about whether two rational forecasters can start with different priors on an election and still both be reasonable, by saying "rational agents can't agree to disagree." I suspect that one-liner is smuggling in a lot of different claims. Can you lay out the distinct precise theses it might be expressing? I can think of at least the narrow theorem about common priors plus common knowledge of each other's posteriors, the stronger common-prior doctrine that all rational disagreement is really just private information, the modeling convention that says you assume a common prior to keep the math from exploding, and the normative claim that once I learn you disagree I ought to update toward you. There are probably more. For each reading, tell me whether its a theorem, a convention, a substantive empirical claim, or just false, and which of them would actually get him from "we still disagree after talking it through" to "one of us is irrational." I want a menu of readings I can take back to the group, not a defense of your favorite one.
reasoning: |-
  Okay, the user is in a decision theory reading group and someone keeps shutting down their point about rational forecasters having different priors by saying "rational agents can't agree to disagree." They suspect this one-liner is vague and covers multiple distinct claims. They want a breakdown of possible interpretations, each categorized as theorem, convention, empirical claim, or false, and which ones actually imply that post-discussion disagreement implies irrationality.

  First, I recall Aumann's Agreement Theorem. That's a fundamental result: with common priors and common knowledge of posteriors, posteriors must be equal. So if they disagree after sharing opinions, it violates the theorem's conditions. That's a theorem, and it directly links disagreement to irrationality only if all conditions are met.

  Then there's the broader common prior doctrine. This asserts that differences in priors are irrational. But that's not a theorem; it's a philosophical stance. Proponents might say any disagreement stems from differing private info, but critics point out that rationality doesn't enforce identical priors. So this is a substantive claim, not a proven fact.

  The modeling convention is practical. Assuming common priors simplifies models but doesn't reflect reality. It's a tool, not a truth. Disagreement here doesn't imply irrationality; it just means the model's assumption doesn't hold.

  The normative claim about updating when learning of disagreement comes from peer disagreement literature. If you see someone as an epistemic peer, you should update toward their view. But this is normative, not a theorem. Following it or not relates to rationality debates, but not universally accepted.

  Common knowledge of disagreement is another angle. If both know they disagree and know each other knows, Aumann's theorem suggests that without common priors, this situation is possible. So disagreement here doesn't necessarily mean irrationality.

  Private information asymmetry is separate. Disagreement might persist due to unshared info, which doesn't imply irrationality. That's a descriptive point.

  The user needs clarity to counter the one-liner. They want to show that "agree to disagree" isn't a single argument but multiple distinct concepts. Highlighting which interpretations actually force the irrationality conclusion is key. For example, only under strict Aumann conditions or the controversial common prior doctrine does disagreement imply irrationality. Other interpretations allow rational disagreement.

  The user's deeper need is to have a structured rebuttal in their reading group. They want to demonstrate that the shutdown phrase oversimplifies complex issues. Providing a menu helps them dissect the argument and show that rational disagreement is possible under many frameworks. Emphasizing the diversity of interpretations empowers their point about different priors being reasonable.
answer: |-
  You're absolutely right to suspect that "rational agents can't agree to disagree" is a one-liner masking a complex landscape of distinct claims and assumptions. It's crucial to disentangle these to have a meaningful discussion. Here's a menu of distinct readings, categorized and analyzed for whether they get you from "we still disagree after talking" to "one of us is irrational":

  1.  **Aumann's Agreement Theorem (Narrow Reading):**
      *   **Thesis:** If two rational agents share a common prior probability distribution over the state space *and* their posterior probabilities (after updating on their private information) are common knowledge between them, then those posteriors must be equal. "Agreeing to disagree" (having common knowledge of differing posteriors) is impossible under common priors and common knowledge of posteriors.
      *   **Status:** **Theorem** (Robert Aumann, 1976). This is mathematically proven given the assumptions.
      *   **Does "disagree after talking" imply irrationality?** **No, not directly.** The theorem *requires* common priors and common knowledge of posteriors as assumptions. If disagreement persists after communication:
          *   It *could* mean one agent is irrational (violating Bayesian updating).
          *   It *could* mean they don't actually share a common prior (the most common interpretation).
          *   It *could* mean their posteriors aren't truly common knowledge even after talking (e.g., they suspect the other isn't fully revealing information or isn't rational).
      *   **Key Point:** This theorem shows that *under very specific, strong conditions*, disagreement is impossible. Persistent disagreement simply shows those conditions aren't met. It does *not* prove that differing priors are irrational.

  2.  **The Common Prior Doctrine (Strong Reading):**
      *   **Thesis:** Rational agents *must* share the same prior probability distribution over any event or state space. All differences in posterior beliefs must arise *solely* from differences in the private information received by the agents. Differing priors themselves are a sign of irrationality.
      *   **Status:** **Substantive (and controversial) Philosophical Claim / Normative Doctrine.** This is *not* a theorem. It's a philosophical stance often motivated by arguments about objective rationality, the "one true prior," or the absence of "rational primitives." Critics argue rationality only governs *updating*, not the *starting point*, given limited information.
      *   **Does "disagree after talking" imply irrationality?** **Yes, according to this doctrine.** If all rational agents *must* have the same prior, and after fully sharing information (making posteriors common knowledge, satisfying Aumann's conditions), their posteriors *still* differ, then at least one agent must have updated irrationally or revealed they didn't have the required common prior to begin with (which is, by this doctrine, irrational).
      *   **Key Point:** This is the doctrine that most aggressively uses "rational agents can't agree to disagree" to shut down the possibility of reasonable differing priors. It transforms Aumann's *assumption* (common prior) into a *requirement* of rationality itself.

  3.  **Modeling Convention / Analytical Tool:**
      *   **Thesis:** Assuming a common prior is a useful, simplifying modeling convention. It allows us to cleanly isolate the effects of differential information and strategic interaction without getting bogged down in the messy origins of prior beliefs. It makes models tractable.
      *   **Status:** **Convention / Pragmatic Modeling Choice.** This is a methodological stance, not a claim about reality or rationality.
      *   **Does "disagree after talking" imply irrationality?** **No.** Within the *model* built using this convention, persistent disagreement *after information sharing* might imply irrationality *within the model's rules* (because the model assumes common priors and common knowledge). However, this says nothing about whether differing priors in the *real world* are reasonable or irrational. The convention is adopted precisely *because* differing priors are hard to model, not because they are deemed irrational.
      *   **Key Point:** Using this convention doesn't mean its proponents believe differing priors are irrational; it just means they are setting them aside for analytical clarity.

  4.  **Normative Claim from Peer Disagreement:**
      *   **Thesis:** If you learn that an epistemic peer (someone you judge to be roughly as rational and well-informed as you) holds a different belief than you do about the same proposition, *rationality requires you to significantly update your own belief towards theirs*. Persistent, unmodified disagreement after recognizing peer disagreement is itself irrational.
      *   **Status:** **Contested Normative Claim** (within epistemology). This is a substantive philosophical position, often based on principles of conciliationism. It's not a mathematical theorem. Critics argue for steadfast positions under certain conditions.
      *   **Does "disagree after talking" imply irrationality?** **According to this claim, often yes.** If you recognize someone as a peer and they still disagree with you after exchanging reasons, failing to move your belief significantly *towards* theirs is seen as irrational dogmatism by proponents of this view. However, it doesn't necessarily claim the peer's *prior* was irrational, just that *your response* to the disagreement is irrational.
      *   **Key Point:** This focuses on the *response* to disagreement, not necessarily the origin of the disagreement (priors vs. information). It targets the *failure to update* upon learning of peer disagreement.

  5.  **Common Knowledge of Disagreement Implies Inconsistency (Under Common Priors):**
      *   **Thesis:** If agents have common priors *and* it becomes common knowledge that they hold different posterior beliefs about the same event, then this situation is logically inconsistent with Bayesian rationality.
      *   **Status:** **Corollary / Direct Implication of Aumann's Theorem.**
      *   **Does "disagree after talking" imply irrationality?** **Only if the Common Prior Doctrine is assumed.** This is essentially restating the conclusion of Aumann's theorem: common priors + common knowledge of differing posteriors = logical impossibility. Therefore, if this situation *appears* to hold, *something* must be wrong. That "something" could be irrationality (faulty updating) *or* the lack of a true common prior *or* the lack of true common knowledge. The doctrine in (2) insists it *must* be irrationality because priors must be common.
      *   **Key Point:** This highlights the *tension* caused by common knowledge of disagreement under the common prior assumption, but doesn't uniquely pin the blame on irrationality.

  6.  **Disagreement Must Be Due to Private Information (Descriptive Claim):**
      *   **Thesis:** In practice, when rational agents disagree after communicating, it must be because they haven't fully shared all relevant private information (intentionally or unintentionally), not because they started with fundamentally different priors.
      *   **Status:** **Substantive Empirical/Descriptive Claim.** This is an assertion about how disagreement *actually* works among rational actors in the real world.
      *   **Does "disagree after talking" imply irrationality?** **Not necessarily.** This claim suggests the disagreement isn't *caused* by irrationality, but by the *practical impossibility* of fully sharing all nuanced private information, interpretations, models, or heuristics. The agents might still be fully rational; they just haven't achieved the full common knowledge state required for Aumann's theorem to force agreement. They may *never* be able to fully share everything. Differing priors might still be the ultimate cause, but this view attributes the *persistence* of disagreement to incomplete information sharing.
      *   **Key Point:** This view avoids labeling differing priors as irrational but argues that persistent disagreement *after talking* is evidence of incomplete communication, not necessarily irrationality.

  **Summary Table: From "Disagree After Talking" to "Irrational"?**

  | Reading                                          | Status                              | Does Persistent Disagreement *Imply* Irrationality? | How it Gets There (If It Does)                                                                 |
  | :----------------------------------------------- | :---------------------------------- | :-------------------------------------------------- | :--------------------------------------------------------------------------------------------- |
  | **1. Aumann's Theorem (Narrow)**                 | Theorem                             | **No**                                              | Disagreement shows assumptions (common prior *or* common knowledge) failed, not necessarily irrationality. |
  | **2. Common Prior Doctrine (Strong)**            | Controversial Normative Claim       | **Yes**                                             | Asserts differing priors *are* irrational; disagreement after info sharing proves faulty prior or updating. |
  | **3. Modeling Convention**                       | Pragmatic Choice                    | **No (Outside Model)**                              | Irrationality might be a conclusion *within the model*, but the convention doesn't judge real-world priors. |
  | **4. Normative Peer Disagreement**               | Contested Normative Claim           | **Yes (Failure to Update)**                         | Focuses on the *response*: failing to conciliate when recognizing a peer is irrational dogmatism.         |
  | **5. C.K. of Disagreement = Inconsistency**      | Corollary of Aumann                 | **Only if Common Prior Doctrine is added**          | Identifies tension; blames irrationality only if differing priors are ruled out as irrational. |
  | **6. Must Be Private Information (Descriptive)** | Substantive Empirical Claim         | **No**                                              | Attributes persistent disagreement to incomplete info sharing, not irrationality.              |

  **How to Use This Menu:**

  1.  **Challenge the Ambiguity:** When your groupmate says "rational agents can't agree to disagree," ask: "*Which* precise claim are you invoking? Aumann's theorem requires common priors, which is what we're debating! The Common Prior Doctrine is a contested philosophical stance, not a theorem. The peer disagreement norm is about updating *after* seeing disagreement, not about priors being irrational."
  2.  **Focus on Priors vs. Process:** Emphasize that Aumann's theorem (1, 5) and the peer norm (4) primarily deal with the implications of *learning about disagreement* or the state *after* updating. Your point is about the *starting point* (priors) *before* agents have any private information. The claim that differing priors *themselves* are unreasonable is reading (2), which needs separate justification.
  3.  **Highlight Alternatives:** Point out readings (3) and (6) as frameworks where persistent disagreement *doesn't* imply irrationality, even if common priors are assumed for modeling (3) or where differing priors *plus* incomplete information sharing explain disagreement without irrationality (6).
  4.  **Pin Down the Leap:** Ask directly: "Are you claiming that differing prior beliefs are *inherently irrational* (Reading 2)? Or are you claiming that *after we've fully shared everything we know*, our posteriors *must* agree if we are rational (which assumes common priors, per Aumann)?" Force him to specify which assumption (common prior) or which normative principle (conciliationism) he's relying on to make the leap from disagreement to irrationality.

  This breakdown should empower your group to move beyond the slogan and engage with the substantive complexities of rational disagreement and the role of priors. Good luck!
