prompt: |-
  I'm TAing a third-year undergrad course on free will and next week I'm doing Frankfurt cases against the principle of alternative possibilities. I've got fifty minutes. The students have read the Frankfurt paper but most of them will have skimmed it. Don't explain the material to me—I know it. I need a plan for how I should teach it in section. What's the right order to introduce the pieces? I'm torn between starting with PAP and the intuition behind it ('you're only responsible if you could have done otherwise'), or starting with a concrete Frankfurt-style case and then pulling PAP out of it. Which example should carry the whole thing—the standard Jones/Black neuroscientist case, or is there a cleaner one that doesnt get bogged down in sci-fi objections? What misconceptions should I expect? I'm guessing students will think the intervener means Jones still has an alternative (he could 'try' to do otherwise even if he'd be stopped), or that the whole thing assumes determinism and begs the question against the libertarian. Where in the sequence should I head each of those off? And what's one question I can ask at the end to check whether they've actually understood the challenge to PAP rather than just memorised the case?
reasoning: |-
  Okay, the user is a TA preparing for a 50-minute undergrad section on Frankfurt cases and PAP. They know the material but need a teaching plan. Let me unpack their needs.

  First, their core dilemma: start with PAP's intuition ("you're only responsible if you could've done otherwise") or jump straight into a Frankfurt case? The risk of starting abstractly is losing students who skimmed the reading. Concrete examples anchor philosophical debates. The Jones/Black case is classic but has sci-fi objections. Maybe a cleaner example would help - the voting case avoids neurosurgery tropes. Less distracting tech, same logical structure.

  They're anticipating two big misconceptions: 
  1) That Jones still has alternatives (like "trying" to choose differently) 
  2) That the case assumes determinism and cheats against libertarians. 

  These need proactive handling. For misconception 1, I should emphasize the trigger structure - the intervener only acts if Jones shows signs of choosing B, which he never does. For misconception 2, I'll need to stress the conditional nature of the intervener's presence. 

  For the comprehension-check question, something that forces them to articulate why PAP fails in Frankfurt cases without regurgitating the example. Maybe: "If we accept Frankfurt cases work, why doesn't this defeat PAP?" forces them to connect the dots between the case's mechanics and the principle's vulnerability. 

  Timing is tight - 50 minutes means strict pacing. Voting case intro (5 min), PAP extraction (10 min), deep dive on why alternatives are missing (15 min), objections handling (15 min), wrap-up (5 min). The objections part is crucial - that's where understanding gets tested. 

  The voting case feels right: relatable (no brain implants), clear trigger (hesitation = intervention), and Jones-like without Black's sci-fi baggage. Plus it sets up cleanly for the "no flicker" refinement later. 

  Biggest risks: students getting stuck on "but he could've tried" or crying determinism foul. Need to park those explicitly in the objection-handling segment with prepared counters. And that final question shouldn't be about case recall - it must test grasp of the philosophical pivot.
answer: |-
  Here's a battle-tested 50-minute lesson plan focused on maximizing clarity, addressing key misconceptions, and ensuring genuine understanding of Frankfurt's challenge to PAP:

  **Core Structure: Start Concrete -> Extract Principle -> Deepen Analysis -> Defend & Check**

  **Time Allocation & Sequence:**

  1.  **Hook & Concrete Case (Voting Scenario - 10 mins):**
      *   **DO:** Start immediately with a streamlined Frankfurt case. **Recommendation: Use the "Voting Case" (a cleaner variant):**
          > "Jones is deciding whether to vote for Candidate A or Candidate B. Unbeknownst to Jones, a powerful neurosurgeon, Black, has implanted a device in Jones's brain. Black *wants* Jones to vote for A. Black can monitor Jones's brain activity. **If Black detects *any* sign (e.g., initial hesitation, neural patterns indicating a drift towards B) that Jones is *about to choose* to vote for B, Black will immediately intervene using the device to *make* Jones choose A.** However, as it happens, Jones, for his own reasons, deliberates and **chooses to vote for A entirely on his own. Black never intervenes.** Jones votes for A."
      *   **WHY:** Avoids sci-fi "stopping" mechanics. Focuses on pre-emptive intervention based on *signs of choice*. More intuitive trigger (hesitation/vote drift). Feels less like "stopping an action" and more like "preventing the *formation* of the alternative choice." Jones clearly acts freely *in this sequence*.
      *   **ASK:** "Is Jones morally responsible for voting for Candidate A?" (Poll hands / quick chat). *Anticipate:* Most will say "Yes, definitely."
      *   **CLARIFY:** Emphasize Black *did nothing* in the actual sequence. Jones chose A freely. Black was only a *potential* threat.

  2.  **Extract PAP & The Challenge (10 mins):**
      *   **SAY:** "Okay, you think he's responsible. But many philosophers think responsibility requires something else: The **Principle of Alternative Possibilities (PAP)**." Write it clearly: **"A person is morally responsible for what they did *only if* they could have done otherwise."**
      *   **EXPLAIN:** Intuition behind PAP: Blame/praise seem unfair if the person was literally *forced* or *had no other option*. True freedom seems to require genuine alternatives.
      *   **THE CHALLENGE:** "Now, look back at our case. *Could* Jones have done otherwise? Could he have voted for B?" Guide discussion.
      *   **HIGHLIGHT:** If he *had* started to choose B, Black would have intervened and *made* him choose A. He never even *tried* to choose B in the actual sequence (no sign = no intervention). **Conclusion:** In *this* scenario, Jones *could not* have voted for B. **BUT** you just said he *is* responsible for voting for A! PAP says he *shouldn't* be responsible. Contradiction!
      *   **STATE FRANKFURT'S POINT:** Therefore, PAP must be false. Responsibility *doesn't* always require the ability to do otherwise. Jones is responsible *even though* he couldn't have done otherwise.

  3.  **Deep Dive: Why NO Genuine Alternative? (15 mins) - Addressing Misconceptions Head-On**
      *   **MISCONCEPTION #1 (The "Trying" Objection):** "But wait! Jones *could* have *tried* to vote for B! Black only stops him if he *actually* starts to choose B. Trying is an alternative!"
          *   **REFUTE:** Define the relevant "doing otherwise." Frankfurt targets the *action* (voting for B) and the *choice* leading directly to it.
          *   **ASK:** "What would 'trying to vote for B' *look like* in this scenario?" Guide them: It would involve Jones forming the *intention* to vote for B, perhaps starting the physical act (moving towards the B lever/button). But **that's *exactly* the trigger condition for Black's intervention!** The moment Jones forms that intention (shows the neural sign of drifting towards B), Black *makes* him choose/vote for A. Jones *cannot* successfully form the intention to vote for B *and* act on it. He cannot *actually* vote for B. "Trying" *is* the start of "doing otherwise," which is precisely what Black prevents from succeeding.
          *   **KEY POINT:** Frankfurt cases aim to show there's **no *robust* alternative possibility** – no possibility where Jones *actually* performs the alternative action (voting for B) and is thus responsible *for that action*. Any path leading to B is cut off *before* the action is completed under Jones's own control.
      *   **MISCONCEPTION #2 (Determinism & Begging the Question):** "This just assumes determinism! It sneaks it in with Black's device. Libertarians think indeterminism is needed for freedom, and this case ignores that!"
          *   **REFUTE:** **Frankfurt cases are *compatible* with indeterminism!** This is crucial.
          *   **EXPLAIN:** The case doesn't *require* determinism. Imagine Jones's deliberation is genuinely indeterministic – his choice isn't causally determined beforehand. *However*, Black's device acts as a *counterfactual intervener*. **In the *actual* indeterministic sequence**, Jones freely chooses A, Black does nothing. **But**, in *any possible sequence* where the *indeterministic* process starts to point towards B, Black *would* intervene and force A. So, even in an indeterministic world, Jones *could not* have chosen and voted for B in that situation. The intervener *rules out* the alternative possibility *without* making the actual sequence determined by prior causes (except Black's setup). The challenge to PAP stands even if we think responsibility requires indeterminism in the *actual* sequence.

  4.  **Objections & Refinements (The "Flicker" Strategy - 10 mins):**
      *   **INTRODUCE:** "Some critics (like Widerker, Kane) argue there *is* a tiny alternative left – a 'flicker of freedom'. Maybe Jones *could* have *started* to choose B, triggering Black, making him vote for A. Isn't *that* 'doing otherwise' (starting to choose B) even if he doesn't complete the vote?"
      *   **DISCUSS:** Is *starting* to choose B a morally relevant alternative? Is Jones responsible for *starting* to choose B? (No, Black forces the vote to A). Is he responsible for the *action* of voting for A? (Yes, but he did it freely *without* starting B). The *only* alternative possibility seems to be an *irrelevant* one – starting a choice he never completes and isn't responsible for completing. PAP is usually about responsibility for the *actual* action performed (voting for A), for which there was no alternative.
      *   **CONCLUSION:** Frankfurtians argue this "flicker" is too flimsy to ground moral responsibility. PAP requires a *robust* alternative possibility relevant to the action in question, which the case successfully blocks. (Mention this is an ongoing debate, but Frankfurt's core challenge holds significant weight).

  5.  **Wrap-up & Comprehension Check (5 mins):**
      *   **SUMMARIZE:** Re-state Frankfurt's argument concisely: 1) In F-case, agent is responsible for X. 2) In F-case, agent could not have done otherwise than X. 3) Therefore, PAP (which says 1 requires the ability for ~2) is false.
      *   **THE KEY QUESTION (Comprehension Check):**
          > **"Suppose a student argues: 'Frankfurt cases don't *really* show Jones lacks alternatives; they just show that if he *tried* to choose otherwise, he wouldn't *succeed*. But he still *could have tried*!' What's the Frankfurtian response to show this doesn't save PAP?"**
          *   **Why it works:** It forces them to articulate why "trying" isn't a *robust* alternative possibility relevant to responsibility for the *actual action performed*. The correct response involves: 1) Defining the relevant "doing otherwise" as performing the alternative *action* (voting for B). 2) Explaining that "trying" is the *trigger* for intervention, meaning Jones *cannot* succeed in performing the alternative action. 3) PAP concerns responsibility for the *actual* action (voting for A), for which there was no possibility of *not* doing it (while acting freely). Memorizing the case isn't enough; they need to understand *why* "trying" fails to satisfy PAP's requirement in this setup.

  **Why this order works:**

  1.  **Concrete First:** Grabs attention, anchors the abstract debate. Students recall the case (even if skimmed) better than the principle.
  2.  **PAP as Reaction:** Deriving PAP *from* the intuitive judgment about the case makes PAP feel like a natural (but flawed) explanation, not a dogma.
  3.  **Misconceptions Addressed Proactively & Deeply:** Tackles the two biggest hurdles ("trying" and "determinism") explicitly *after* the core argument is laid out, using the case as a shared reference point. The "Voting Case" is particularly resilient to the "trying" objection.
  4.  **Sophistication Step:** Introducing "Flickers" shows the debate's depth without getting lost in it, reinforcing why Frankfurtians think PAP is still threatened.
  5.  **Check Targets Understanding:** The final question doesn't ask for the case or PAP definition; it asks them to *apply* the Frankfurtian logic to defeat a common objection, proving they grasp the *structure* of the challenge.

  **Tips:**

  *   **Whiteboard:** Keep the case, PAP, and the challenge structure (Responsible? / Could do otherwise? / Contradiction?) visible.
  *   **Pace:** Stick to the timing! 10 mins on the case judgment/PAP extraction is crucial. Don't let early tangents derail it.
  *   **Polling:** Use quick hand polls ("Responsible? Yes/No", "Could he do otherwise? Yes/No") to engage and gauge the room.
  *   **"Sci-Fi" Objections:** If someone objects to the device, acknowledge it's a *thought experiment* designed to test the *logic* of PAP. The point is *if* such a setup were possible, it would challenge PAP. Focus on the logical structure. The Voting Case minimizes this.
  *   **Jones/Black:** You can *mention* the original case, but say "We'll use this cleaner voting variant to avoid some distractions." It captures the essence.

  This plan leverages the concrete, addresses the predictable pitfalls head-on, and ends with a question ensuring they see *why* Frankfurt thinks PAP is doomed, not just *that* he thinks it. Good luck!
