   1. The resource must perform a function that, if done inside the brain, would be considered a cognitive process (like remembering or thinking).
   2. The resource must be coupled to the person in the right way. This involves:
      - Reliability: The resource is reliably available when needed.
      - Accessibility: It is easily accessible without barriers.
      - Trust: The person trusts the resource without having to verify its output each time.
      - Endorsement: The information in the resource is either put there by the person or explicitly endorsed by them.

   The procedure will have a sequence of tests in a fixed order. We will classify into:
   (1) Extended cognition (EC): treat as part of the person's memory or thinking.
   (2) Ordinary tool (OT): loss is a productivity issue, not cognitive.
   (3) Escalate (ESC): cannot decide, needs human judgment.

   Steps:

   1. **Function Test**: Does the tool perform a cognitive function (e.g., remembering, reasoning, decision-making) that, if done in the head, would be considered part of cognition?
      - If NO: classify as OT (ordinary tool).
      - If YES: proceed to step 2.
      - If UNSURE: escalate (ESC).

   2. **Reliability Test**: Is the tool reliably available when the developer needs it? (Consider historical uptime and the developer's expectation of availability.)
      - If NO: classify as OT (because unreliability breaks the coupling; the person cannot depend on it as they would their own memory).
      - If YES: proceed to step 3.
      - If UNSURE (e.g., mixed history, or unclear expectations): escalate (ESC).

   3. **Accessibility Test**: Is the tool easily accessible without significant barriers (e.g., not requiring complex setup steps, authentication, or navigation each time it is used)?
      - If NO: classify as OT (because the effort required breaks the fluidity of cognition).
      - If YES: proceed to step 4.
      - If UNSURE: escalate (ESC).

   4. **Trust Test**: Does the developer trust the output of the tool without feeling the need to verify it each time? (Note: This is about the developer's actual behavior, not what they should do.)
      - If NO (i.e., the developer always or usually verifies): classify as OT (because the tool is not integrated as a transparent part of cognition; it's more like a reference that is checked).
