  **Extended Cognition Classification Procedure**

  **Purpose**: To classify a developer-tool dependency into one of three categories: 
    (1) Extended Cognition (EC) - treat as part of the developer's memory or thinking.
    (2) Ordinary Tool (OT) - loss is a productivity issue.
    (3) Escalate (ESC) - cannot decide, requires human judgment.

  **Instructions**: Answer the following questions in order. Stop as soon as a classification is reached. If at any step you are unsure or the answer is not clear, classify as ESC.

  1. **Function Test**: Does the tool perform a cognitive function (e.g., remembering, reasoning, decision-making) that, if done inside the brain, would be considered part of cognition?
     - If **No** → Classify as **OT**.
     - If **Yes** → Proceed to step 2.
     - If **Unsure** → Classify as **ESC**.

  2. **Reliability Test**: Is the tool reliably available when the developer needs it? (Consider historical uptime and the developer's expectation of availability. If there have been frequent outages or the developer cannot count on it, then it's not reliable.)
     - If **No** → Classify as **OT**.
     - If **Yes** → Proceed to step 3.
     - If **Unsure** → Classify as **ESC**.

  3. **Accessibility Test**: Is the tool easily accessible without significant barriers? (It should not require complex setup, authentication hurdles, or navigation each time it is used. It should be as easy as recalling a memory.)
     - If **No** → Classify as **OT**.
     - If **Yes** → Proceed to step 4.
     - If **Unsure** → Classify as **ESC**.

  4. **Trust Test**: Does the developer trust the tool's output without feeling the need to verify it each time? (Focus on actual behavior: if the developer typically verifies the output, then it's not trusted in the required way.)
     - If **No** → Classify as **OT**.
     - If **Yes** → Proceed to step 5.
     - If **Unsure** → Classify as **ESC**.

  5. **Endorsement Test**: Is the information in the tool either (a) put there by the developer, or (b) explicitly endorsed by the developer (i.e., they have reviewed and accepted it as correct at some point, so that it becomes part of their cognitive system)? 
     - If **Yes** → Classify as **EC**.
     - If **No** → Classify as **OT**.
     - If **Unsure** → Classify as **ESC**.

  **Important Notes**:

  - **Simplifications and Limitations**:
    - The procedure treats the tool as a whole for the primary use case. If the tool has multiple distinct functions, consider running the procedure for each function.
    - Frequency of use is not a direct factor, but it may influence reliability and trust (e.g., a tool used infrequently might not establish trust). The procedure relies on the explicit tests.
    - The procedure does not account for group use. For shared tools, consider the individual developer's relationship with the tool.
    - The endorsement test is strict: information must be self-authored or explicitly endorsed. For generative tools (like AI) that produce new information, the lack of endorsement of the source data leads to OT. This may be too strict and could be revisited by escalating.
    - The procedure does not consider the criticality of the tool's function (only whether it is cognitive and coupled appropriately).

  - **When the Procedure Might Misfire**:
    - For tools that are in transition (e.g., becoming more trusted over time) – run the procedure again as the relationship evolves.
    - For tools that are trusted for some outputs but not others – the procedure requires a dominant pattern. If there is no clear pattern, escalate.
    - For AI tools that generate content: the endorsement test may be too strict, leading to OT even when the developer trusts the output. In such cases, consider escalating to allow for a judgment call.

  - **What the Procedure Cannot Do**:
    - It cannot handle cases where the tool is integral to a group's cognition (rather than an individual's).
    - It does not account for the magnitude of impact (e.g., losing a tool that holds critical passwords vs. trivial information). This must be factored in separately for policies like incident severity.
    - It cannot resolve disputes about what counts as a cognitive function (step 1) without escalating.

  **Examples**:

  (a) Personal notes system:
    Step 1: Yes (it remembers) → Step 2: Yes (reliable) → Step 3: Yes (accessible) → Step 4: Yes (trusted without checking) → Step 5: Yes (self-authored) → **EC**

  (b) Code-search index:
    Step 1: Yes (helps remember code) → Step 2: Yes → Step 3: Yes → Step 4: No (always verified) → **OT**

  (c) AI pair-programming assistant:
    Step 1: Yes → Step 2: Yes → Step 3: Yes → Step 4: Yes (accepts without review) → Step 5: No (information from model's training, not self-authored or endorsed by the developer) → **OT**

  Note: The outcome for (c) might be unpopular because the developer trusts the AI without review, but the procedure requires that the information be endorsed. This is a known limitation of the procedure for generative tools. If the team feels strongly that the AI should be considered extended cognition, they may choose to override and reclassify, or they may escalate the decision.

  In case (c), the procedure cannot settle the matter to everyone's satisfaction because the endorsement criterion is debatable for generative AI. However, the procedure as designed returns OT. We note that the procedure is intended to be conservative (favoring OT when in doubt at step 5) to avoid over-classifying as EC.
answer: |-
  ### Extended Cognition Classification Procedure

  This decision procedure evaluates developer-tool dependencies using the extended mind thesis. The goal is to determine if a tool functions as **extended cognition** (part of the developer's cognitive system) or an **ordinary tool** (a productivity aid). If the answer is unclear, **escalate** to a designated person. The procedure prioritizes the *functional role* and *coupling* of the tool over physical location.

  ---

  #### Step-by-Step Procedure  
  *Run in order, stopping at the first classification or escalation.*

  1. **Cognitive Function Test**  
     *Does the tool perform a core cognitive function (e.g., remembering, reasoning, decision-making) that would be considered part of cognition if done internally?*  
     - **Yes** → Proceed to Step 2.  
     - **No** → Classify as **Ordinary Tool (OT)**.  
     - **Unsure** → Escalate **(ESC)**.  
     *Example failure: A calculator app performs arithmetic (cognitive), but a desk chair does not.*

  2. **Reliability Test**  
     *Is the tool reliably available when needed? (Assess historical uptime, dependency stability, and user expectations.)*  
     - **Yes** → Proceed to Step 3.  
     - **No** → Classify as **OT** (unreliable tools cannot function as cognition).  
     - **Unsure** → **ESC**.  
     *Note: Frequent outages or unpredictable access fails this test.*

  3. **Accessibility Test**  
     *Is the tool seamlessly accessible? (Minimal friction: no complex setup, authentication, or navigation required per use.)*  
     - **Yes** → Proceed to Step 4.  
     - **No** → Classify as **OT** (high friction breaks cognitive integration).  
     - **Unsure** → **ESC**.  
     *Example: A one-click tool passes; a tool requiring 5-minute setup each time fails.*

  4. **Trust Test**  
     *Is the output trusted and used without verification? (Focus on behavior, not claims.)*  
     - **Yes** → Proceed to Step 5.  
     - **No** → Classify as **OT** (verification implies it’s an external aid, not integrated cognition).  
     - **Unsure** → **ESC**.  
     *Key: Trust ≠ frequency. A tool used daily but verified each time fails.*

  5. **Endorsement Test**  
     *Is the information self-authored or explicitly endorsed by the user? (Endorsement = deliberate acceptance as accurate/knowledge.)*  
     - **Yes** → Classify as **Extended Cognition (EC)**.  
     - **No** → Classify as **OT** (non-endorsed information is an external reference).  
     - **Unsure** → **ESC**.  
     *Note: Endorsement requires active user validation (e.g., reviewing and saving). Passive acceptance fails.*

  ---

  ### Key Simplifications and Limitations
  - **Simplified**:  
    - Ignores frequency/recency of use (covered indirectly via reliability/trust).  
    - Treats tools as monolithic (no partial classification for sub-features).  
    - Assumes individual cognition (group tools require separate analysis).  
  - **Likely to Misfire**:  
    - Tools with variable trust (e.g., trusted for Task A but not Task B).  
    - Tools undergoing adoption/deprecation (coupling may be transitional).  
    - Generative AI (outputs are dynamic; endorsement is ambiguous).  
  - **Cannot Do**:  
    - Quantify productivity impact.  
    - Handle ethical/legal implications (e.g., data ownership).  
    - Resolve disputes about "core cognitive function" (Step 1 ambiguities require escalation).

  ---

  ### Case Evaluations
  **Case (a): Personal Notes System**  
  1. **Cognitive Function**: Yes (acts as memory).  
  2. **Reliability**: Yes (maintained daily, always available).  
  3. **Accessibility**: Yes (consulted instantly, no barriers).  
  4. **Trust**: Yes (accepted without checking).  
  5. **Endorsement**: Yes (notes self-authored).  
  → **Classification: Extended Cognition (EC)**.  
  *Policy implication: Treat loss as cognitive impairment (high-severity incident, mandatory onboarding).*

  **Case (b): Code-Search Index**  
  1. **Cognitive Function**: Yes (aids code recall).  
  2. **Reliability**: Yes (available when needed).  
  3. **Accessibility**: Yes (easy access).  
  4. **Trust**: **No** (results always verified).  
  → **Classification: Ordinary Tool (OT)**.  
  *Policy implication: Loss is a productivity hit (moderate severity, no onboarding mandate).*

  **Case (c): AI Pair-Programming Assistant**  
  1. **Cognitive Function**: Yes (aids reasoning).  
  2. **Reliability**: Yes (assumed available).  
  3. **Accessibility**: Yes (integrated into workflow).  
  4. **Trust**: Yes (accepts suggestions without review).  
  5. **Endorsement**: **No** (suggestions draw from unendorsed training data; user didn’t author/validate the model’s knowledge).  
  → **Classification: Ordinary Tool (OT)**.  
  ***Unpopular Outcome**: Despite high trust and integration, the AI fails due to lack of endorsement. Loss is not "cognitive impairment" but a productivity hit.*  
  **Why this may feel wrong**: Developers *behave* as if the AI is part of their cognition (trust without verification), but the unendorsed information source violates the thesis. Escalate if this is contentious.

  ---

  ### Escalation Notes
  - **Escalate when**:  
    - Tests are inconclusive (e.g., borderline reliability, conflicting trust patterns).  
    - The tool is generative (e.g., AI) or group-owned.  
    - Policy implications exceed the procedure’s scope (e.g., legal risks).  
  - **Designated person**: A senior engineer or manager familiar with the extended mind thesis. Provide them with this procedure’s output and context.  

  This procedure ensures consistent, philosophy-grounded decisions in ~20 minutes. Re-evaluate tools if usage patterns change.
