   - It cannot account for gradual changes (e.g., a tool that becomes trusted over time) without re-running.
   - It does not handle cases where the tool is used by a group (like shared notes). The thesis is for individual cognition. For group tools, we might need a different approach (or run the procedure for a typical individual user, but that might not capture the group aspect).
   - It does not consider the criticality of the information (e.g., losing access to a note with a critical password vs. a note with a shopping list). The thesis is about cognitive function, not consequence. However, our policy concerns (like incident severity) might care about consequence. The procedure is focused on the cognitive aspect.

