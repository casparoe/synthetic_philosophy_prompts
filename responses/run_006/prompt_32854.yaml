  You are a historian of early modern philosophy and political economy. Please think through the following question carefully. Begin by laying out what the question appears to presuppose, and then assess whether those presuppositions are correct before giving your final answer.

  Hume argues that money is not itself real wealth but only an instrument for circulating a society's labor and commodities. He also holds that the absolute quantity of money in a country is ultimately of no consequence, since a larger or smaller stock merely raises or lowers the price level. By similar reasoning, he argues that a favorable balance of trade cannot permanently enrich a nation, because the resulting inflow of money will raise domestic prices and eventually undercut exports. Yet in these same essays he claims that when new money flows into a country, it can for a time stimulate trade and industry, quickening labor and enterprise before prices fully adjust. Are these positions in tension? If money is only an instrument whose total quantity is ultimately irrelevant, how could an influx of money produce any genuine economic effect, even a temporary one? Explain what Hume's actual position is, and whether the apparent inconsistency is real or rests on a misunderstanding.
