  Okay, the user is in a course on normative uncertainty and AI alignment, focusing on indirect normativity. They need to write a paper pushing back against the idea that idealized deliberation sets the normative standard. They want me to play the role of a committed defender of that view. Let me start by understanding their opening argument.

