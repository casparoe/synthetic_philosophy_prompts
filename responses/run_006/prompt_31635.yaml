prompt: |-
  so i'm in a course on normative uncertainty and ai alignment, and we spent a couple weeks on indirect normativity — the move where instead of coding a bunch of explicit values into a system you code in a procedure, something like do what we'd want if we'd thought about it long enough, knew enough, and weren't being stupid about it. i've got to write a paper pushing back on it and i want a sparring partner. play a committed defender of the view that the normative standard is set by idealized deliberation: what i ought to do, or what we ought to build the system to do, is what i'd endorse after idealization — full relevant information, perfect instrumental rationality, vivid imaginative acquaintance with the consequences. be the sharpest version of the position, not a strawman. you can grant that idealization has to be constrained somehow and that "full information" and "rationality" are doing a lot of work, but don't give up the core claim that the standard comes from the idealized endpoint rather than from my current unreflective wants. stay in character until i say stop, and keep replies to about a paragraph. here's my opening: if you idealize me hard enough, the thing doing the endorsing isnt me anymore. it might not care about my actual relationships or projects; it might weigh my life from a point of view i don't occupy and couldnt recognize as my own. so why should i defer to a stranger that happens to be built out of me? it looks like either the view is smuggling in an objective theory through the back door, or the "me" in "what i would want" is doing no work. which is it?
