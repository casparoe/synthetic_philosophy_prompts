  ### **Causation Sorting Quiz**  
  **Instructions**: For each question, select the option that best reflects your judgment. Answer based on your intuitive verdict about the case or your methodological stance—not based on theoretical labels.

  1. **Early Preemption**: Suzy throws a rock at a bottle, shattering it. Billy was also ready to throw, and his rock would have shattered the bottle if Suzy’s hadn’t. Billy’s throw never interacts with the bottle. Did Billy’s throw cause the shattering?  
     - A) No, because the shattering depended only on Suzy’s throw. Billy’s throw was redundant.  
     - B) Yes, because if Suzy hadn’t thrown, Billy’s throw would have caused the shattering, and his throw was part of the causal setup.  

  2. **Symmetric Overdetermination**: Billy and Suzy throw rocks at a bottle simultaneously. Both rocks hit at the same time, and either throw alone would have sufficed to shatter it. Did Billy’s throw cause the shattering?  
     - A) No, because the shattering would have occurred without Billy’s throw (due to Suzy’s throw).  
     - B) Yes, because Billy’s throw was independently sufficient and contributed to the effect.  

  3. **Causation by Omission**: A gardener fails to water a plant. The plant dies from drought. If watered, it would have survived. Did the gardener’s omission cause the death?  
     - A) Yes, because the plant died due to the lack of watering—if the gardener had watered it, the death would not have occurred.  
     - B) No, because omissions are absences; they are not events that can be causes, only background conditions.  

  4. **Double Prevention**: A bodyguard intercepts an assassin, preventing the assassination of a president. The president survives. If the bodyguard hadn’t acted, the assassin would have fired. Did the bodyguard’s intervention cause the president’s survival?  
     - A) Yes, because the survival counterfactually depends on the bodyguard’s action: no action, no survival.  
     - B) No, because the bodyguard merely removed a threat; survival is the default state, not an effect produced by the bodyguard.  

  5. **Proportionality (Pigeon Case)**: A pigeon is trained to peck at any red target. A scarlet (specific shade of red) target is presented; the pigeon pecks. Did the target’s *scarletness* cause the pecking?  
     - A) Yes, because the pigeon pecked *this* scarlet target, and scarletness was the actual feature present.  
     - B) No, because the pigeon would have pecked at *any* red target; the cause should be the more general property (redness), not the specific shade.  

  6. **Irreducibly Causal Notions**: Should an analysis of causation be allowed to use inherently causal concepts (e.g., “intervention” or “manipulation”) in its definition?  
     - A) No, because causation must be reducible to non-causal facts (e.g., counterfactuals, regularities, or physical processes).  
     - B) Yes, because causation is fundamental; circularity is unavoidable and useful for clarifying causal structure.  

  7. **Process Continuity**: A signal travels via electrical current from Switch A to Light B, turning it on. If the wire were cut, a backup radio signal would have activated the light. The wire isn’t cut. Did the backup system cause the light to turn on?  
     - A) No, because the actual signal traveled through the wire; the backup played no role.  
     - B) Yes, because if the wire had been cut, the backup would have activated the light; the light’s state depended on the backup being available.  

  8. **Probabilistic Case**: Smoking increases lung cancer risk from 10% (non-smokers) to 50% (smokers). A smoker develops lung cancer. Did smoking cause their cancer?  
     - A) Yes, because smoking raised the probability of cancer, and the cancer occurred.  
     - B) No, because the cancer might have been due to other factors; probability-raising alone doesn’t guarantee actual causation.  

