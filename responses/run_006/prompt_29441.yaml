  Below is a sorting quiz designed to diagnose your underlying commitments to theories of causation based on your judgments about concrete cases and methodological stances. The quiz focuses on where Lewis-style counterfactual theories, Woodward-style interventionism, Mackie-style regularity/INUS views, and Salmon–Dowe process theories diverge. It includes your requested cases (early preemption, symmetric overdetermination, causation by omission, double prevention, proportionality) and probes the use of irreducibly causal notions. A probabilistic leaf is included as the questions genuinely distinguish it.

