prompt: |-
  I'm trying to figure out what I actually think about privacy, going by my gut on cases, and I keep getting tangled up. Here are my verdicts:

  - A hospital strips identifiers from patient records and sells the dataset to a pharma company without telling patients. I think this is wrong, even though no one can be re-identified.
  - A friend tells a mutual friend something humiliating about me that I told them in confidence. Wrong, full stop.
  - The police run a license plate scanner on public streets and store everyone's movements for years. This bothers me deeply, but I struggle to articulate why, given that the plates are visible to anyone on the road.
  - A company flies a drone over my fenced backyard at 400 feet and photographs my sunbathing. Privacy violation.
  - A stranger on a crowded subway takes a photo of me and posts it online. I don't think this is a privacy violation, even if I find it obnoxious.
  - My employer reads my work email account. Not a violation — it's their system, I know the policy.
  - My employer reads my personal Gmail over my shoulder while I'm on my laptop at a café. That's a violation.

  I'm trying to find the principle behind these, or figure out which verdict I need to overturn. The two further cases I keep going back and forth on are: (1) my neighbor mounts a security camera pointed at my front door, recording 24/7, and (2) a tech company never collects my data directly but infers my political leanings from my friends' posts and sells that inference to advertisers.

  You're a philosopher who works on privacy. Think through the candidate principles carefully — control over information, reasonable expectations, contextual integrity, access-based accounts, whatever else fits — and tell me which one gets the most of my verdicts right, where it forces me to eat a verdict I don't like, and what it says about those two stuck cases. Don't just give me a taxonomy; I want to know what I'm committed to.
reasoning: |-
  Okay, I see this user is really struggling to pin down their personal philosophy on privacy. They've listed concrete cases where their gut says "violation" or "not violation," but they can't find the unifying thread. The two cases they're stuck on - neighbor's camera and inferred political data - show they're hitting real philosophical tension.

  Hmm, looking at their verdicts... interesting how context keeps coming up. The work email vs personal Gmail distinction is pure contextual integrity in action. And that subway photo verdict is telling - they're distinguishing mere visibility from consent to distribution. 

  The hospital case is tricky because it violates expectations even with anonymization. That suggests mere data control isn't their core principle. Meanwhile, the drone case shows physical intrusion matters, but the license plate scanner bothers them despite being in public view. There's something about aggregation and scale here...

  For the stuck cases: The neighbor's camera aimed specifically at their door - that feels like targeted surveillance exceeding reasonable expectations. But the inferred political data? That's tougher. If we take contextual integrity seriously, the violation might be in repurposing social data for advertising without the subject's knowledge. 

  I should walk them through how each major theory handles their cases, especially where theories force uncomfortable conclusions. Like control theory would probably say the subway photo is fine, which matches their verdict, but then it might excuse the hospital data sale since control wasn't violated technically. 

  *scribbles mentally* The contextual integrity framework seems to explain most of their instincts: 
  - Hospital violates norms of secondary use 
  - Friend violates confidentiality context 
  - License scanners change context from ephemeral observation to permanent tracking 
  - Drone violates physical seclusion expectation 
  - Subway photo maintains context (public→public) 
  - Work email respects institutional context 
  - Shoulder-reading crosses personal/organizational boundaries 

  For the neighbor's camera, CI would ask about neighborhood norms - is continuous surveillance typical? For inferred data, it's about cross-contextual inference - taking social interaction data to predict politics for ads violates informational norms. 

  But I should also note where this might push them - if they accept CI, they might need to condemn some common data practices they currently tolerate. That's the "eating a verdict" part.
answer: |-
  Your intuitions reveal a sophisticated, context-driven view of privacy—closest to **Helen Nissenbaum's "Contextual Integrity" framework**. This theory holds that privacy isn't about secrecy or control alone, but about the *appropriate flow of information* within specific social contexts, governed by norms. Let's break it down:

  ---

  ### **Core Principle: Contextual Integrity**  
  Privacy is violated when information flows:  
  1. **From the wrong party**  
  2. **To the wrong party**  
  3. **In violation of context-specific norms** (transmission principles, purpose, sensitivity).  

  ---

  ### **Your Verdicts Explained by Contextual Integrity**  
  | Case                                 | Your Verdict       | Contextual Integrity Analysis                                                                 |
  |--------------------------------------|--------------------|------------------------------------------------------------------------------------------------|
  | **Hospital sells anonymized data**   | Wrong              | Violates norms of **patient-care context**: data collected for treatment, not commercial sale. "De-identification" doesn't override purpose betrayal. |
  | **Friend shares humiliating secret** | Wrong              | Violates **confidentiality norms** of friendship context. Trust-based disclosure ≠ consent to redistribute. |
  | **Police store license plate scans** | Wrong (but uneasy) | **Public observation context** norm: fleeting observation. Mass surveillance repurposes data into a **new context** (permanent tracking), violating norms of proportionality. |
  | **Drone photos of backyard**         | Privacy violation  | **Home context** norm: physical boundaries create expectation of limited access. Drone bypasses traditional barriers (fences), violating spatial norms. |
  | **Stranger posts subway photo**      | Not a violation    | **Public transit context** norm: visible actions are observable/recordable. Flow (public → public) aligns with context. |
  | **Employer reads work email**        | Not a violation    | **Employment context** norm: work systems are organizational property. Consent implied by context. |
  | **Employer reads personal Gmail**    | Violation          | **Personal communication context** (even in public café) ≠ work context. Employer is "wrong party" here. |

  ---

  ### **Where Contextual Integrity Forces You to "Eat a Verdict"**  
  - **Subway Photo**: You *must* accept this as non-violation. Contextual norms of public space permit recording. Your discomfort might stem from broader ethical concerns (e.g., dignity), but strictly, privacy norms aren’t breached.  
  - **License Plate Scanners**: You can’t retreat to "it's public!"—the *scale and repurposing* create a new context with hostile norms. Stick to your gut: it’s a violation.  

  ---

  ### **Your Stuck Cases Resolved**  
  1. **Neighbor’s camera pointed at your door**:  
     - **Verdict**: **Violation** (if aimed *specifically* at your door).  
     - **Why**: The **residential/neighborhood context** norm isn't "record everything forever." Surveillance should respect functional boundaries (e.g., monitoring own property). Targeted recording of *your* entryway exceeds self-protection norms, creating a one-way information flow that disrupts neighborly trust.  

  2. **Tech company infers politics from friends’ posts**:  
     - **Verdict**: **Violation**.  
     - **Why**: Violates **social media context** norms. Friends share with each other, not with data brokers. **Inference repurposes data** into a commercial/predictive context you never consented to. The "wrong party" (advertisers) receives information generated in a trust-based setting.  

  ---

  ### **Why Other Theories Fail You**  
  - **Control Theory** (privacy = controlling your data):  
    - Fails your hospital case (you never controlled the data).  
    - Condemns subway photo (you couldn’t control it), contradicting your verdict.  
  - **Reasonable Expectation** (privacy = what society deems reasonable):  
    - Too vague. Society might accept license plate scanning (but you reject it).  
    - Can’t explain why drone photos violate privacy (you *shouldn’t* expect privacy at 400ft?).  
  - **Access Theory** (privacy = restricting physical/visual access):  
    - Approves drone photos (no physical trespass) and license plate scans (public view)—but you reject both.  

  ---

  ### **What You’re Committed To**  
  1. **Privacy is relational**, not absolute. It depends on roles (doctor, friend, employer).  
  2. **Deception or purpose creep violates privacy**, even without "identifiable" data (hospital case).  
  3. **Technology that distorts contexts** (e.g., making public behavior permanently traceable) breaches privacy.  
  4. **Your obligation**: Defend context-appropriate norms. E.g., argue that neighbor cameras *should* respect reciprocity, or that data inference *should* require contextual consent.  

  **Final note**: Your struggle with license plates and inferred data shows how technology forces contexts to collide. Contextual Integrity doesn’t solve all ambiguities—but it best captures your intuition that privacy is about *appropriate relationships*, not just hiding.
