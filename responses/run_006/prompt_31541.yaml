answer: |-
  **Pascal would reject humanitarian intervention as another instance of force legitimizing itself through fabricated justice, not a union of true justice with force.** His reasoning, applied to your query, unfolds as follows:  

  1.  **The Illusion of Universal Justice:** Pascal’s core skepticism about a universally recognized, objective justice ("Justice on this side of the Pyrenees...") directly undermines the premise of R2P. He would see "universal human rights" or "atrocity prevention" not as self-evident truths, but as *customs* and *geographic preferences* of powerful modern societies (primarily Western ones). Claiming these are universal is merely the dominant group imposing its preferred customs as "justice."  

  2.  **Force Creates the Appearance of Justice:** Pascal’s dictum that "being unable to make what is just strong, we have made what is strong just" is the crux. Humanitarian interventions are *always* acts of force by powerful states or coalitions against weaker ones. Pascal would argue that the *force* comes first. The "humanitarian" justification is then constructed *afterwards* (or selectively beforehand) to *legitimize* that force, making the strong appear just. The intervention doesn't prove the justice; the justice is asserted *because* the powerful intervened.  

  3.  **Selective Enforcement as Proof of Hypocrisy:** The stark selectivity in applying R2P – interventions in some cases (e.g., Libya), inaction in others (e.g., Syria, Myanmar, Xinjiang) based on geopolitical cost, interest, or feasibility – would be Pascal's smoking gun. It exposes that the driving factor isn't a consistent, universal justice, but *force and interest*. The "justice" invoked is a convenient vocabulary used to legitimize force *when it suits the powerful*, not an unwavering principle. This selectivity confirms his view that what is called "justice" in international affairs is simply the custom enforced by the strong.  

  4.  **"Humanitarian" as the Modern Legitimizing Vocabulary:** Pascal would see the language of "humanitarian intervention" and "R2P" as the *exact contemporary equivalent* of the legitimizing vocabularies used by past powers (divine right, dynastic claims, civilizing missions). It is the linguistic tool used to dress raw power ("force") in the robes of morality ("justice"), precisely fulfilling his framework. The label *does* perform legitimizing work far more effectively than descriptive work, masking the underlying reality of power politics.  

  **Therefore, your suspicion is fundamentally Pascalian:** Humanitarian intervention, for Pascal, is not the rare marriage of justice and force, but the latest, perhaps more sophisticated, iteration of force inventing a justice to suit its purposes, using the geographically/culturally specific concept of "universal rights" as its legitimizing vocabulary, with selectivity proving the primacy of power over any consistent principle.
