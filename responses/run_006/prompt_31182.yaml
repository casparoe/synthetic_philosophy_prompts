answer: |-
  Here are the desiderata for theories of material constitution, derived from the core statue/lump case, structured as requested. Each requirement is driven by specific phenomena, with negotiation status indicated.

  ---

  ### **Desiderata for Theories of Material Constitution**

  1. **Constitution and Identity**  
     **Case:** The statue and lump coincide spatially/mereologically but exhibit different persistence conditions (squashing destroys the statue, not the lump).  
     **Requirement:** The theory must specify whether constitution implies identity or distinctness. If distinct, explain how they differ; if identical, resolve apparent differences in properties/persistence.  
     **Status:** Non-negotiable constraint for all theories.  

  2. **Leibniz's Law**  
     **Case:** Substitution failure in modal contexts (e.g., "The lump survives squashing, but the statue does not").  
     **Requirement:** If distinct, identify a non-trivial property distinguishing them (e.g., modal, historical). If identical, explain substitution failure without violating the indiscernibility of identicals.  
     **Status:** Non-negotiable (logical constraint).  

  3. **Modal Profile**  
     **Case:** The lump survives deformation/squashing; the statue does not.  
     **Requirement:** Accurately capture persistence conditions without ad hoc stipulations (e.g., no unprincipled sortal essentialism).  
     **Status:** Non-negotiable (phenomenological adequacy).  

  4. **Grounding Problem**  
     **Case:** Two coincident entities share all microphysical properties but differ in kind/identity conditions.  
     **Requirement:** Provide a ground (e.g., form, function, intention, historical facts) for their distinct kinds/persistence conditions, or defend primitivism.  
     **Status:** Non-negotiable; evasion risks vacuity.  

  5. **Counting and Sortals**  
     **Case:** We count "one statue + one lump" but resist "two objects in one place."  
     **Requirement:** Explain this asymmetry (e.g., via sortal-relative counting, ontologically privileged kinds, or eliminativism).  
     **Status:** Non-negotiable (common-sense practice).  

  6. **Mereological Extensionality**  
     **Case:** Statue/lump share parts but appear non-identical, violating classical mereology.  
     **Requirement:** Reject, restrict (e.g., to temporal parts), or reinterpret extensionality; justify costs (e.g., sacrificing parsimony).  
     **Status:** Constraint for all except nihilism/revolutionary theories.  

  7. **Generality**  
     **Case:** Persons/bodies, organisms/matter, rivers/water parcels.  
     **Requirement:** Extend the account beyond artifacts or justify artifact-specific treatment.  
     **Status:** Non-negotiable (explanatory scope).  

  8. **Proliferation**  
     **Case:** If statue/lump are distinct, why not also the aggregate of clay molecules, atoms, etc.?  
     **Requirement:** Restrict which coincidents are objects (e.g., via sortal constraints) or defend universalism/permissivism.  
     **Status:** Camp-dependent; sparse ontologies must resist proliferation.  

  9. **Formal Features of Constitution**  
     **Case:** Can a lump constitute itself? Can A constitute B and B constitute C?  
     **Requirement:** Specify if constitution is irreflexive, asymmetric, transitive, or if it reduces to other relations (e.g., parthood).  
     **Status:** Camp-dependent (e.g., non-negotiable for constitution-as-primitive views).  

  ---

  ### **Structural Questions**

  #### **1. The Inconsistent Triad**  
  Yes, **modal asymmetry** (statue/lump have different persistence), **sparse ontology** (no coincident distinct objects), and **absolute identity** (Leibniz’s Law) form an inconsistent triad. Escape routes:  
  - **Reject absolute identity**: Adopt relative identity (Geach: "same lump, not same statue").  
  - **Reject sparse ontology**: Accept coincidence (e.g., Baker: statue and lump are distinct).  
  - **Reject modal asymmetry**: Deflate modal differences (e.g., temporal parts: statue is a temporal segment of the lump).  

  #### **2. Most Excluding Requirement & Scorecard**  
  **The grounding problem (#4)** is the strongest filter: it forces theories to explain *why* two materially identical entities differ in kind/persistence, excluding positions that lack robust grounds.  

  **Scorecard of Major Theories**:  

  | **Theory**               | **1 (ID/Distinct?)** | **2 (Leibniz’s Law)**     | **3 (Modal Profile)** | **4 (Grounding)**          | **5 (Counting)**       | **6 (Extensionality)** | **7 (Generality)** | **8 (Proliferation)** | **9 (Formal Features)** |  
  |--------------------------|----------------------|----------------------------|------------------------|----------------------------|------------------------|-------------------------|---------------------|------------------------|--------------------------|  
  | **Coincidence** (e.g., Baker) | Distinct          | Modal/historical properties | ✓                      | Intentional/functional facts | Sortal-relative      | Rejected              | ✓ (via dominant kinds) | Controlled (sparse)    | Irreflexive, asymmetric |  
  | **Dominant-Kind** (e.g., Johnston) | Distinct          | Kind-essential properties   | ✓                      | Sortal essence            | Vindicates hesitation | Rejected              | Limited (artifacts?) | Moderate proliferation | Irreflexive             |  
  | **4Dism** (e.g., Lewis)   | Distinct temporal parts | Temporal properties      | ✓ (via stages)         | None (brute temporal parts) | "Two objects" accepted | Restricted (to slices) | ✓                  | Extreme proliferation | Reduces to parthood      |  
  | **Nihilism** (e.g., Merricks) | Neither (no composites) | N/A (only atoms exist)    | Only applies to atoms  | N/A                       | Eliminates problem   | Preserved             | ✗ (denies organisms) | None                   | Constitution denied     |  

  **Key Tradeoffs**:  
  - **Coincidence**: Grounds differences in intention/history but struggles with proliferation.  
  - **4Dism**: Solves modal differences but inflates ontology and conflicts with counting intuitions.  
  - **Nihilism**: Avoids all constitution problems but rejects ordinary objects (radical cost).  
  - **Dominant-Kind**: Balances intuition and ontology but may essentialize sortals arbitrarily.  

  The **grounding problem** remains the sharpest challenge: even after accepting coincidence, *why* does the same matter instantiate two kinds? Without a non-arbitrary ground, the solution risks being as mysterious as the problem.
