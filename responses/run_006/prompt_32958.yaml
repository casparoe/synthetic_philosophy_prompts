  ok so I'm a statistician — I do experimental design and model selection day to day — and I keep hearing philosophers invoke popper and falsificationism and the demarcation problem like its relevant to my job. restate the whole popperian package in the vocabulary I actually think in: null hypotheses, test statistics, rejection regions, type I and type II error, power, model comparison, the difference between failing to reject and accepting. be faithful — dont just pattern-match falsify to reject, I can tell the difference. then give me the residue report: what survived the translation, what had to be distorted to fit, and what in the popperian picture has no counterpart in my vocabulary at all — and whether that residue is a gap in my vocabulary or a sign the original claim was fuzzier than it sounds. the thing I most want settled: is popper's asymmetry between falsification and verification just the same asymmetry as the one between rejecting and failing to reject a null, or is that a false friend? and what is corroboration supposed to be, if it's not a posterior probability and not a p-value? give me exactly five numbered points, one or two sentences each, no intro, no conclusion.
reasoning: |-
  Okay, the user is a statistician who works with experimental design and model selection. They're frustrated with how philosophers talk about Popper and falsificationism, wanting it translated into their statistical vocabulary. I need to break down Popper's ideas into concepts like null hypotheses, test statistics, rejection regions, type I/II errors, power, model comparison, and the distinction between failing to reject and accepting. 

  First, I should map Popper's falsification to rejecting a null hypothesis. But the user warned against oversimplifying, so I need to be precise. Falsification isn't just a single test; it's about the testability of the theory itself. That means the null must be a specific, falsifiable prediction derived from the theory. 

  The asymmetry between falsification and verification is key. In stats, rejecting the null corresponds to falsification, while failing to reject isn't verification—it's just not finding evidence against. That aligns with Popper's view that we can never confirm a theory, only fail to disprove it. So that part seems like a direct match. 

  Corroboration is trickier. It's not a posterior probability or p-value. Instead, it's about how well a theory has withstood severe tests. In stats, that might relate to repeated testing across different scenarios without rejection, but it's more about the resilience of the theory over time. That's not directly a statistical measure but a historical record of tests. 

  Now, for residues: Popper's emphasis on methodological falsifiability—designing tests that could falsify the theory—isn't explicitly in stats. Statisticians do this implicitly when setting up experiments, but Popper makes it a core principle. Also, the idea that all theories are conjectures subject to overthrow has no direct counterpart; stats typically works within a model without that philosophical stance. 

  The user's main question is whether the asymmetry is the same as rejecting vs. failing to reject. Yes, that's a solid match. But corroboration is vaguer—it's not quantified like p-values, which might be a gap in Popper's framework or just different from statistical tools. 

  I need to structure this in five numbered points as requested: falsification as rejection, asymmetry matching stats, corroboration explained, residues like methodological emphasis, and the conjecture status. Keep it concise, no fluff.
answer: |-
  Here is the translation and residue report per your specifications:

  1.  **Falsification ≡ Rejecting a Precise Null:** A theory's core prediction is framed as a specific, testable null hypothesis (H₀). Observing data falling in the pre-defined rejection region (against H₀) constitutes a *falsification* of that specific prediction (and thus the theory requiring it). Faithful translation of the core act.
  2.  **Asymmetry ≡ Reject/Fail-to-Reject:** Popper's asymmetry maps directly: Rejecting H₀ (falsification) is decisive *against that specific H₀*. Failing to reject H₀ is **not** "accepting H₀" or verifying the theory; it only means insufficient evidence *against this specific H₀* was found. This asymmetry is fundamental and identical in both frameworks.
  3.  **Corroboration ≡ Survived Severe Tests (Not a Number):** Corroboration describes a theory's *historical track record*: it has repeatedly made precise, risky predictions (H₀'s derived from it), which were subjected to high-power tests (severe tests), and consistently *failed to be rejected*. It's not a p-value (current test strength), posterior prob (degree of belief), or power (design property). Residue: Popper's concept is vaguer, emphasizing narrative over a single quantitative measure.
  4.  **Residue - Methodological Falsifiability:** Popper's requirement that a *theory itself* must be structured to yield *logically possible* but *empirically testable* falsifiers (specific H₀'s) has no direct statistical counterpart. Statisticians design tests *given* a hypothesis; Popper mandates the hypothesis *must be testable*. This is a gap in standard statistical vocabulary, focusing on a pre-data theory property.
  5.  **Residue - Conjectural Status & Permanence:** Popper's view that *all theories remain conjectures forever*, even if highly corroborated, and are always open to future falsification by new data/tests, has no direct parallel in standard Neyman-Pearson testing or model comparison. While statisticians know models are approximations, Popper's radical fallibilism (no final verification *ever*) is a stronger, non-quantified philosophical stance embedded in his framework.
