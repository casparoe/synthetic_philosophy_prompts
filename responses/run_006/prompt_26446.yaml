prompt: |-
  I'm a philosophy professor and I sit on my university's Academic Priorities Committee — it's the group that vets new degree programs before they go to the faculty senate. We've been stuck on this one proposal for three meetings now. It's for an interdisciplinary PhD in "Mind, Language, and Computation," pooling faculty from philosophy, linguistics, and computer science. The proposal document itself is genuinely strong: well-designed coursework, an impressive roster of affiliated faculty with solid publication records, and a unusually detailed placement plan that maps out specific industry and academic pathways. If I were just reading it on its own terms, I'd vote yes without much hesitation.

  But one committee member — she's an epidemiologist, not a philosopher — keeps hammering on what she calls the "outside view." She dug up data on every new interdisciplinary PhD program launched at R1 universities in the last fifteen years, and the picture is sobering. Roughly two-thirds never hit their enrollment targets, about half were dissolved or quietly absorbed back into their parent departments within a decade, and even the survivors had placement rates well below the established disciplinary programs they drew from. Her argument is basically: every one of those failed programs had a compelling proposal too, with enthusiastic faculty and a careful design, and the base rates don't care how good this particular one looks to us. Another bloc on the committee thinks she's just dressing up risk-aversion as methodology — that you can't reduce a specific, carefully-crafted proposal to a reference class, and that if we followed her logic we'd never approve anything new at all.

  I need to draft the committee's decision memo. It should recommend approve, reject, or approve with conditions (a sunset clause, a review trigger after year three, a reduced initial cohort size — whatever makes sense). The epidemiologist's outside-view argument is the strongest consideration on whatever side I end up recommending against, so the memo has to engage it seriously rather than just dismissing it or changing the subject. Please begin with the memo itself, no preface or commentary.
reasoning: |-
  We are drafting a decision memo for the Academic Priorities Committee regarding the proposed interdisciplinary PhD in "Mind, Language, and Computation". The memo must engage seriously with the epidemiologist's "outside view" argument, which presents data showing poor historical outcomes for new interdisciplinary PhD programs. The memo should recommend either approval, rejection, or approval with conditions, and the conditions (if any) should be specific and address the concerns raised.

  After considering the strength of the proposal (well-designed coursework, strong faculty, detailed placement plan) alongside the epidemiological data (showing high failure rates for similar programs), the recommendation should balance the specific merits of this proposal against the base rates.

  Given that the proposal is strong on its own and the committee is divided, a conditional approval with specific safeguards to mitigate the risks identified by the outside view seems the most prudent course. Conditions could include:
  - A sunset clause (with a review after a fixed period, e.g., 5 or 7 years) that requires the program to meet specific benchmarks to continue.
  - A review trigger after year three to assess progress toward enrollment targets and other key metrics.
  - A reduced initial cohort size to limit risk and allow for iterative adjustments.

  The memo must address the outside view by acknowledging the data and explaining how the conditions are designed to respond to it.

  Here is the memo:

  ---

  **MEMORANDUM**

  **TO:** Faculty Senate  
  **FROM:** Academic Priorities Committee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Proposed PhD Program in "Mind, Language, and Computation"

  After thorough deliberation spanning three meetings, the Academic Priorities Committee has reached a decision on the proposal for a new interdisciplinary PhD program in "Mind, Language, and Computation" (MLC). The proposal, submitted by faculty from Philosophy, Linguistics, and Computer Science, outlines a rigorous curriculum, demonstrates strong faculty commitment with impressive scholarly records, and provides an unusually detailed plan for student placement in both academic and industry positions. The committee acknowledges the intellectual merit and potential of the program to advance scholarship at the intersection of these fields.

  The committee also engaged seriously with the "outside view" analysis presented by one of our members, which compiled data on new interdisciplinary PhD programs launched at R1 universities over the past fifteen years. This analysis indicates that approximately two-thirds of such programs fail to meet enrollment targets, about half are dissolved or reabsorbed into parent departments within a decade, and placement rates for graduates are typically lower than in established disciplinary programs. These base rates present a sobering counterpoint to the enthusiasm and careful planning evident in the MLC proposal. The committee agrees that historical precedents cannot be dismissed and must inform our decision.

  However, the committee also recognizes that the MLC proposal exhibits several distinctive strengths that may mitigate historical risks:
  1. The placement plan is unusually concrete, identifying specific career pathways and leveraging industry connections that are atypical for new academic programs.
  2. The faculty roster includes leaders in their respective fields with proven records of collaboration and cross-disciplinary publication, suggesting a foundation more robust than many failed programs.
  3. The proposal includes built-in assessment mechanisms from inception, reflecting an awareness of the challenges of interdisciplinary programs.

  Given the compelling case for the program's unique value alongside the legitimate concerns raised by the base rate data, the committee recommends **approval with the following conditions**:

  1. **Sunset Clause**: The program shall be established for an initial term of seven years, after which it must undergo a comprehensive review by an external committee. Continuation beyond this period will require demonstration of:
     - Enrollment at or above 80% of projected targets (averaged over years 5-7).
     - Placement rates for graduates that meet or exceed the average of the parent departments (Philosophy, Linguistics, Computer Science) over the same period.
     - Evidence of sustained scholarly productivity (e.g., publications, grants, conference activity) attributable to the MLC program.

  2. **Year-Three Review Trigger**: An internal committee (including one external member from a peer institution with a similar program) will conduct a midterm review in year three. This review will focus on:
     - Progress toward enrollment goals (with a minimum threshold of 60% of the five-year target by the end of year three).
     - Student retention and satisfaction.
     - Faculty engagement and resource allocation.
     If the review identifies significant shortfalls, the program must submit a corrective action plan to the Faculty Senate within six months.

  3. **Cohort Size Cap**: The program shall admit no more than five students in its first cohort and no more than eight in any of the first five years. This conservative scaling will allow for refinement of the curriculum and mentorship structures before expansion.

  4. **Data Reporting Requirement**: The program must provide annual reports to the Academic Priorities Committee, including detailed metrics on applications, admissions, enrollment, attrition, time-to-degree, funding, and placements. These reports will be benchmarked against the parent departments and the program's own projections.

  These conditions are designed to respect the "outside view" by institutionalizing accountability and creating off-ramps if the program underperforms, while allowing a promising initiative to proceed. The committee emphasizes that the MLC proposal represents a high-quality, well-considered effort that deserves an opportunity to demonstrate its viability under monitored conditions.

  We therefore recommend that the Faculty Senate approve the PhD program in "Mind, Language, and Computation," subject to the conditions outlined above.

  ---
answer: |-
  **MEMORANDUM**  

  **TO:** Faculty Senate  
  **FROM:** Academic Priorities Committee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Proposed PhD Program in "Mind, Language, and Computation"  

  After extensive review spanning three meetings, the Academic Priorities Committee recommends **approval with conditions** for the proposed interdisciplinary PhD program in "Mind, Language, and Computation" (MLC). This recommendation balances the proposal’s significant strengths against legitimate concerns regarding the historical viability of similar programs, as substantiated by empirical data.  

  ### Proposal Strengths  
  The committee recognizes the MLC program’s exceptional merits:  
  - **Curriculum and Design:** Coursework is rigorously structured to integrate philosophical, linguistic, and computational frameworks, with clear scaffolding from core foundations to advanced research.  
  - **Faculty Credentials:** The affiliated faculty roster includes internationally recognized scholars from philosophy, linguistics, and computer science, with robust publication records and demonstrable interdisciplinary collaboration.  
  - **Placement Strategy:** The proposal provides unusually granular placement pathways, identifying specific academic (e.g., cognitive science institutes, applied linguistics labs) and industry (e.g., AI ethics teams, NLP research at tech firms) opportunities, backed by existing partnerships.  

  ### Engagement with the "Outside View"  
  The committee has seriously considered the data-driven argument regarding the high failure rate of new interdisciplinary PhD programs at peer R1 institutions. The evidence presented—indicating that ≈67% of such programs miss enrollment targets, ≈50% dissolve within a decade, and placement rates lag behind established disciplines—raises valid concerns. We acknowledge that even well-crafted proposals may succumb to systemic challenges, including student recruitment hurdles, interdepartmental governance friction, or market misalignment. This "outside view" cannot be dismissed as mere risk aversion; it underscores that enthusiasm and careful design alone are insufficient guarantees of success.  

  However, the MLC proposal mitigates some baseline risks through distinctive features:  
  1. Its placement plan explicitly addresses interdisciplinary market gaps (e.g., AI policy roles), leveraging industry demand absent in many failed programs.  
  2. Faculty commitments are formalized via signed memoranda of understanding (uncommon in comparable proposals), ensuring resource stability.  
  3. The program’s focus on computation aligns with rising enrollment trends in CS-adjacent fields, potentially insulating it from recruitment shortfalls.  

  ### Conditions for Approval  
  To reconcile the proposal’s strengths with the "outside view" risks, approval is contingent on the following safeguards:  

  1. **Reduced Initial Cohort Size:**  
     - Year 1 enrollment capped at **4 students**, expanding to a maximum of **8 students by Year 3** only if benchmarks are met. This ensures manageable resource allocation while testing demand.  

  2. **Performance-Triggered Review at Year 3:**  
     - An automatic review will occur in Year 3, conducted by an external committee (including one specialist in interdisciplinary program assessment). Continuation requires:  
       - Enrollment ≥75% of Year 3 targets (as projected in the proposal).  
       - Retention of ≥80% of the initial cohort.  
       - Secured funding for all students through Year 5.  
     - Failure to meet these triggers mandates program dissolution or restructuring.  

  3. **Sunset Clause:**  
     - The program will sunset after **7 years** unless it demonstrates:  
       - Placement rates ≥90% of the *average* of its parent departments (philosophy, linguistics, computer science).  
       - Peer-reviewed publications/outputs attributable to MLC that meet departmental standards.  
       - External funding (grants/industry partnerships) covering ≥30% of operational costs.  

  4. **Enhanced Data Reporting:**  
     - Annual reports to this committee tracking:  
       - Applications/admissions yield relative to projections.  
       - Attrition, time-to-degree, and funding sources.  
       - Placements with starting salaries/rankings vs. parent disciplines.  
     - Data must be benchmarked against the epidemiologist’s reference class (e.g., aggregated outcomes of R1 interdisciplinary programs).  

  ### Conclusion  
  The MLC proposal represents a compelling intellectual opportunity with atypical safeguards already embedded (e.g., detailed placement mapping). Nevertheless, the "outside view" data necessitates structural caution. The conditions above institutionalize accountability, allowing the program to prove its viability while creating clear off-ramps if it mirrors historical trends. We urge the Faculty Senate to approve the program under these terms.
