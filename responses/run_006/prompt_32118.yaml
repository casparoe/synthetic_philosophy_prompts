  Bentham's utilitarianism is impersonal. He cares about the total sum of pleasure and pain, not whose it is. So the nonidentity problem shouldn't be an issue for him. But I need to think if there's any twist here. Would Bentham see this as a confusion? Probably, because his theory doesn't require comparing the same individuals across scenarios. He'd just compare the total happiness in the different outcomes. 

