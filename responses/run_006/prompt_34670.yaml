prompt: |-
  hey, i'm taking this free will & moral responsibility seminar and we just read frankfurt's "alternate possibilities and moral responsibility." i'm also on my dorm's conduct board and we have this weird case i can't stop thinking about.

  a student got caught plagiarizing a paper. during the hearing, it came out that his parents had told him before finals week that if his gpa dropped below a 3.0 they'd pull him out of school entirely. here's the thing though — he admits he'd already decided to plagiarize before his parents said anything. the threat didn't cause him to do it; he was going to anyway. but the threat also meant that if he'd had a last-minute crisis of conscience, he couldn't have acted on it — he literally couldn't have done otherwise without losing everything.

  half the board says this is irrelevent since he wasn't coerced into the actual decision. the other half says you can't blame someone for something they had no alternative to. i'm supposed to draft the opinion and i want to get the philosophy right, not just pick a side. does frankfurt's argument actually apply to this case? and if it does, what does it commit me to saying about blame? give me a real take, not a "here are some perspectives to consider" thing.
