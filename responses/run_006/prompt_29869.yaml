prompt: |-
  I'm a novelist working on a book about how people make up their minds—or fail to. One of my characters is an economist who keeps explaining everything in terms of information cascades, and I want to get inside his head. But the more I think about it, the more I realize my own intuitions about when it's okay to follow the crowd are kind of a mess. I've jotted down a bunch of cases with my gut reactions, and I'd love it if you could help me find the principle behind them—or tell me which verdicts I need to walk back.

  Here goes:

  1. I'm in a new city, hungry, weighing two ramen shops. One has a line out the door, the other is empty. My phone tells me the empty one has better reviews. But I figure all those people can't be wrong—they've presumably eaten here before, or at least made the same calculation I'm making. I join the line. Verdict: perfectly rational.

  2. A novelist friend of mine just had his manuscript rejected by twenty agents. A single editor friend who read it thinks it's extraordinary. My friend shelves the book. I think this is rational, and honestly I'd do the same—but there's a part of me that hates it. Verdict: rational but regrettable.

  3. Same friend, different scenario: he's in a writing group and five people all tell him the third-act twist doesn't land. He privately thinks it's the best thing he's ever written. He changes it anyway. Verdict: rational. Five independent readers can't all be missing the point.

  4. But now suppose the five people in the writing group discussed the twist before giving their feedback. My friend knows they talked, so they might have influenced each other. Should his verdict change? I feel like it should, but I'm not sure why. I think if he knows they talked, he should discount thier agreement somewhat. Verdict: less rational to defer to them, maybe not rational at all.

  5. Here's a nasty one. A critic I know—a good critic, someone whose judgment I trust—privately loved a novel. Then the big reviews came out and savaged it. Her review ended up panning it too. When I asked her about it, she said she'd re-read it and realized she'd been wrong. But I don't believe her. I think she cascaded. Verdict: not rational, and also kind of spineless.

  6. But swap the details: same critic, same novel, but this time she reads five brutal takedowns by critics she deeply respects, each making specific arguments she hadn't considered, and she genuinely changes her mind. Verdict: rational. So the difference isn't the outcome, it's something about the process.

  7. I buy a novel because it won the Booker. I read it. I think it's medicore, honestly kind of a slog. But I assume I'm missing something—these are serious judges, they must have seen something I didn't. Verdict: rational for a reader, though it makes me a little sad about myself.

  8. Now flip it. I'm on a prize jury. I privately think Book A is the best, but the other four jurors are passionately for Book B. I've been wrong before. I switch my vote. Verdict: this feels like a dereliction—I was put there to exercise my judgment, not to defer. Not rational.

  9. Last one, and this is the one that confuses me most. I'm at a dinner party and everyone is praising a novelist I privately think is a fraud—glib, manipulative, all style. I say nothing. Later, two people quietly tell me they agree with me but didn't want to say so in the moment. We were all waiting for someone else to go first. My silence felt rational in the moment—why alienate people over a take that might be wrong?—but looking back it seems like a textbook cascade that wouldn't have happened if any one of us had spoken. Was my silence rational or not?

  So that's the pile of cases. I'm trying to figure out: is there a single principle—or maybe two or three—that separates the cases where following the herd is rational from the cases where it isn't? Something about independence of signals, or about the stakes involved, or about whether you're an observer or a participant? I'd also love to know what your principle says about case 4—the one where the writing group talked to each other first—because I feel like that one might force some clarity.

  Oh, and if you could write your answer in British English that'd be great—my editor's in London and I'd like to run it by her without having to translate spelling.
reasoning: |-
  Okay, let me try to unpack this novelist's query. They're clearly deeply immersed in exploring information cascades through these vivid scenarios, and there's a palpable frustration in how their intuitions keep shifting. The core ask is sharp: find the unifying principle behind when herd-following is rational versus when it's cowardly or irrational. 

  First, I notice how the cases cluster. Scenarios 1-3 feel like clean cascades - individual decisions with clear signals (crowds, rejections, reader consensus). But then case 4 introduces contamination through discussion, and the emotional tone shifts. The critic cases (5-6) are particularly telling because they're about professional integrity versus genuine persuasion. And the dinner party (case 9) is such a perfect microcosm of social paralysis - that one might hold the key to the whole puzzle.

  Hmm... what's really at stake across all these? It's not just about accuracy but about role responsibility. When the novelist shelves his book (case 2), it's rational because he's an individual seeking publication success. But the prize juror (case 8) has a fiduciary duty to judge independently - that changes everything. And the dinner party? There it's about social cost versus truth-telling, with no clear "right" answer. 

  The independence of signals seems crucial too. Case 4's writing group discussion taints the feedback, making consensus less valuable. Case 6's critic changes mind based on new arguments, not peer pressure. That distinction between informational influence ("they know something I don't") and normative influence ("I'll look foolish") keeps resurfacing. 

  British English is no issue - but I should watch for phrases like "medicore" (sic) in their examples and ensure consistency. More importantly, the novelist's self-doubt in case 7 ("sad about myself") suggests they might be projecting personal insecurities onto these characters. Maybe the underlying theme isn't just decision theory but epistemic humility - when to trust the crowd versus your own voice. 

  Right then. The framework emerging has three legs: signal independence, decision stakes (personal vs social vs professional), and role obligations. For case 4 specifically - the contaminated writing group feedback - the key is whether the discussion created groupthink or merely shared perspectives. If they influenced each other before forming opinions, consensus becomes worthless; if after independent reading, it's still valid. The novelist's instinct to discount it is spot on. 

  Blimey, the dinner party case is the trickiest. Rationally, silence preserves social capital when disagreement has low stakes. But collectively, it creates a false consensus. Perhaps the real lesson there is that cascades aren't about individual rationality but systemic failure. Might be worth suggesting that to the novelist as a thematic angle - the tragedy of rational choices creating irrational outcomes. 

  Final thought: their economist character would likely dismiss all emotional reactions as irrational. But cases like 2 (shelving the book) show rationality can feel like surrender. That tension between logic and conviction is where the novel lives, I suspect. Better make sure the principle acknowledges that.
answer: |-
  Right then, let's tackle this fascinating puzzle. Your instincts are sharp, and the cases brilliantly highlight the tension between individual judgment and social influence. The key isn't finding one single principle, but rather **two interlocking frameworks** that explain your verdicts consistently: **Signal Independence & Epistemic Role**.

  Here's the breakdown:

  1.  **Signal Independence:** Is the information you're observing (the crowd's behaviour, the reviews, the votes) based on *independent* judgments or signals? Or has it been influenced/corrupted by the social process itself?
  2.  **Epistemic Role & Stakes:** What is *your role* in the decision? Are you acting primarily as a *consumer* seeking the best outcome based on available signals, or as an *evaluator/contributor* whose own judgment is part of the process itself? Relatedly, what are the personal and collective stakes?

  **Applying the Frameworks to Your Cases:**

  1.  **Ramen Shop (Rational):** Signals are *relatively independent* (each person chose based on their own hunger/prior info/reputation). Your role is a *consumer* seeking the best meal. Deferring to the visible crowd signal is rational under uncertainty. Stakes are low-to-medium (a potentially bad meal).
  2.  **Shelving the Book (Rational but regrettable):** The 20 rejections are *independent signals* (agents usually make individual assessments). Your friend is a *consumer* of the publishing market's judgment. The high personal stakes (career, time) make deferring rational, though regrettable if the editor was right. The regret stems from the *epistemic cost* – a potentially great work lost.
  3.  **Writing Group - Independent Feedback (Rational):** Five *independent* negative signals. Friend is a *consumer* of reader feedback. High stakes (book's success) make deferring rational, even against strong personal conviction. Five independent readers genuinely missing the point is statistically unlikely.
  4.  **Writing Group - Discussed First (Less Rational/Rational to Discount):** **Crucial Case.** Here, the signals are *not independent*. The pre-discussion creates conformity pressure (normative influence) and potentially aligns interpretations *before* individual judgments solidify (informational influence). The consensus is contaminated. Your friend should *heavily discount* the agreement. His role is still a *consumer* of feedback, but the feedback's value is degraded. Deferring is much less rational (or even irrational) because the "five signals" are more like "one group signal + echoes". Your gut is spot on.
  5.  **Critic Privately Loved then Panned (Not Rational/Spineless):** The critic changed their public judgment based on *social pressure* (the savaging) and likely normative influence (fear of looking foolish/out of step). The negative reviews are signals, but her reversal isn't primarily based on new *independent* information/arguments. Her role as a *critic* demands independence; her judgment *is* the product. Deferring violates her epistemic role. Stakes (professional credibility) make this spineless.
  6.  **Critic Changed Mind Based on Arguments (Rational):** Here, the critic encountered new, *independent* signals (takedowns by respected critics) containing specific *informational content* (arguments). This allowed genuine cognitive reappraisal. Changing her mind based on new, high-quality information *is* rational and fulfils her role as a critic seeking truth/judgment. The *process* is key.
  7.  **Buying Booker Winner (Rational):** The Booker judges' signal is an *independent* (though complex) assessment. Your role is a *consumer* seeking potentially good literature. Assuming you missed something is rational humility, especially against prestigious consensus. Stakes are low (cost of book/time). The sadness reflects the tension between individual taste and expert consensus.
  8.  **Prize Juror Switching Vote (Not Rational/Dereliction):** **Epistemic Role is Paramount.** You were appointed *as a judge*, implying your *independent judgment* is the valuable input. The other jurors' views are signals, but switching *solely* because they disagree, without being convinced by their *arguments* (new information), violates your role. Your judgment *is* the product the prize needs. Stakes are high (integrity of the prize, your own integrity). Deferring is dereliction of duty. Independence is the core requirement.
  9.  **Dinner Party Silence (Rational in the moment, but collectively irrational):** **The Cascade Trap.**
      *   *Rational (Individually):* Signals are *not independent* (silence breeds more silence). Your role is a *participant* seeking pleasant social interaction. The personal stakes of alienating people over a subjective opinion are real. Vocal dissent carries social cost with low personal gain.
      *   *Collectively Irrational:* The outcome (false consensus) is suboptimal. It *is* a textbook cascade fuelled by *lack* of independence and *normative influence* (fear).
      *   *The Principle:* As an individual *consumer* of social harmony in that moment, silence is rational self-preservation. However, it highlights how rational individual choices based on interdependent signals and normative stakes create collectively irrational outcomes. You weren't derelict in a *duty* like the juror, but the *system* failed.

  **The Core Principles Summarised:**

  1.  **Follow the (Independent) Signal:** It's rational to defer to a crowd/consensus **if** their judgments are likely based on *independent* information/signals relevant to the decision, and your role is primarily that of a **consumer** using available information.
  2.  **Maintain Your Epistemic Duty:** It is **not** rational to defer (and may be irrational or unethical) **if**:
      *   The consensus signals are **not independent** (contaminated by prior discussion, conformity pressure).
      *   Your role requires you to provide your **own independent judgment** as a core part of the process (e.g., juror, critic, arguably a dissenting voice breaking a cascade).
      *   Deferring is primarily driven by **social pressure/normative influence** (fear of backlash) rather than new information/arguments.
  3.  **Weigh the Stakes:** The *degree* of rationality is influenced by personal stakes (ramen vs. career) and collective stakes (prize integrity, truth in criticism). High personal stakes as a consumer favour deferring to strong independent signals; high collective stakes for an evaluator demand independence.

  **In Conclusion:**

  Your economist character sees the world through the lens of Bayesian updating with imperfect information. Individuals rationally use the actions of others as signals about an uncertain state of the world (is this ramen good? is this book bad?). A cascade occurs when these signals overwhelm private information, even if the initial signals were weak or wrong. However, the *rationality* of *joining* the cascade depends critically on the *quality* (independence) of those signals and your *role* in the system.

  Case 4 is clarified perfectly by the **Signal Independence** principle: pre-discussion destroys the independence of the writing group feedback, making their consensus a much weaker, potentially useless signal. Your friend would be rational to largely ignore it or treat it as a single data point (the group's view) rather than five. His private conviction regains significant weight.

  Your intuitions across the cases are remarkably consistent with these principles. The tension you feel (especially in 2, 7, 9) often stems from the conflict between individual rationality as a consumer and the collective cost of cascades, or between the desire for truth/authenticity and the social cost of providing it. That's precisely the rich territory your novel can explore. Good luck with the book – it sounds cracking!
