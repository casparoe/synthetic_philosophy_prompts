  For C2: p*0 + (1-p)*3 = 3-3p > 1? -> 3-3p>1 -> p<2/3.

  So any p in (1/3, 2/3) works. For example, p=1/2.

  So C1 is strictly dominated by (1/2 A1, 1/2 B1).

  After deleting C1, the reduced game is:

          A2     B2     C2
     A1   0      3      0
     B1   3      0      3

  Now, for Player 1, we can see that A1 and B1 are not dominated by each other. 
  But note: Player 2 might have a dominated strategy in the reduced game. 
  Now, we design Player 2's payoffs. 

  Player 2's payoffs should be such that after Player 1 deletes C1, Player 2 then has a strictly dominated strategy. 

  For instance, set Player 2's payoffs to be the same as Player 1's (making the game symmetric) or set them so that C2 is dominated after C1 is deleted.

  Player 2's payoffs:

          A1     B1     C1
     A2   0      3      1
     B2   3      0      1
     C2   0      3      1   [or something else]

  But after Player 1 deletes C1, Player 2's reduced matrix is:

          A1     B1
     A2   0      3
     B2   3      0
     C2   0      3   [for example]

  Now, if Player 2's payoffs for C2 are (0 against A1 and 3 against B1), then compare C2 to A2: 
    against A1: 0 vs 0 -> same
    against B1: 3 vs 0 -> C2 better -> not dominated by A2.
  Compare to B2: 
    against A1: 0<3 -> B2 better
    against B1: 3>0 -> C2 better -> not dominated.

  So not dominated.

   Alternatively, set Player 2's payoffs for C2 to be lower. 

  Player 2's payoffs:

          A1     B1     C1
     A2   0      3      0
     B2   3      0      0
     C2   0      0      0  [against C1 doesn't matter because C1 is gone]

  In the reduced game (without C1), Player 2's payoffs:

          A1     B1
     A2   0      3
     B2   3      0
     C2   0      0

  Now, is C2 dominated? 
  Compare to A2: 
    against A1: 0 vs 0 -> same
    against B1: 0<3 -> A2 better -> not strictly dominated.
  Compare to B2: 
    against A1: 0<3 -> B2 better
    against B1: 0<0? -> no, 0=0 -> same -> not strictly dominated.

  But note: we can use a mixed strategy for Player 2 to delete C2. 
  Consider a mixture of A2 and B2: (q, 1-q, 0). 
  For against A1: q*0 + (1-q)*3 = 3-3q > 0? -> q<1.
  For against B1: q*3 + (1-q)*0 = 3q > 0? -> q>0.
  So any q in (0,1) works. For example, q=1/2: 
    against A1: 1.5>0, against B1: 1.5>0.

  So C2 is strictly dominated by (1/2 A2, 1/2 B2).

  After deleting C2, the game reduces to:

  Player 1: A1, B1
  Player 2: A2, B2

  Player 1's payoffs:

          A2     B2
     A1   0      3
     B1   3      0

  Player 2's payoffs (assume we set them similarly and symmetric for simplicity):

          A1     B1
     A2   0      3
     B2   3      0

  Now, we have matching pennies. No further deletion can be done.

  So the iterated deletion order was:
  1. Player 1 deletes C1 (because it is dominated by a mixed strategy of A1 and B1).
  2. Player 2 then deletes C2 (dominated by a mixed strategy of A2 and B2).
  3. The game is reduced to a 2x2 matching pennies.

  This shows:
  - The use of mixed strategies to delete.
  - The iterated process.

  But note: we also want to show that if we only use pure strategies, we might not delete anything. In this game, without mixed strategies, no pure strategy is dominated in the first round. So we delete nothing and the entire game remains.

  Also, the set of survivors under iterated strict dominance is order-independent. In this game, the order we did was delete for player 1 first then player 2. We could have done player 2 first? 

  In the first round, can player 2 delete any strategy using mixed strategies? 
  Player 2's payoffs in the original game:

          A1     B1     C1
     A2   0      3      0
     B2   3      0      0
     C2   0      0      0

  Check if C2 is dominated by a mixed strategy of A2 and B2: 
  For against A1: mixture gives 0*q + 3*(1-q) = 3-3q > 0? -> requires q<1.
  For against B1: 3q > 0? -> q>0.
  For against C1: 0 > 0? -> fails (0=0), not strictly greater.

  So against C1, we have 0 from the mixture and 0 for C2 -> not strictly better. Therefore, in the first round, Player 2 cannot delete C2 because when Player 1 plays C1, it is not strictly dominated.

  This is important: the mixed strategy must yield a strictly greater payoff for every strategy of the other players. Here, for the profile where Player 1 plays C1, the payoff of the mixed strategy is 0 (because both A2 and B2 give 0 against C1) and C2 also gives 0, so it's not strictly better.

  Therefore, Player 2 cannot delete any strategy in the first round. Only Player 1 can delete C1.

  After Player 1 deletes C1, then Player 2 can delete C2.

  So the order must be Player 1 first. If we try Player 2 first, they cannot delete anything. This shows that the set of strategies that can be deleted in a round depends on the order? But the final set of survivors is order-independent? 

  Actually, in iterated strict dominance (with mixed strategies), the final set is order-independent. But in this game, if we try to delete in a different order, we might not be able to delete in the first round for Player 2, but then after Player 1 deletes, we can delete for Player 2, so the final set is the same.

  The property of order-independence means that regardless of the order in which we delete dominated strategies (as long as we delete all that are dominated at each round), we will always reach the same final set. 

  In this game, the only deletion that can happen in the first round is for Player 1 to delete C1. Then in the second round, Player 2 can delete C2. No other strategies can be deleted in any order because in the first round, Player 2 has no dominated strategy. 

  So the final set is always {A1, B1} for Player 1 and {A2, B2} for Player 2.

  Therefore, it illustrates order-independence: even though the order of deletion matters (we must do Player 1 first to get the process started), the final set is the same regardless of the order in which we consider players as long as at each step we remove all strategies that are strictly dominated (by mixed or pure) relative to the current set of strategies of the other players.

  But note: in the first round, if we only look at Player 2, we see no dominated strategy, so we don't delete any. Then we look at Player 1 and delete C1. Then in the next round, we look at Player 2 and delete C2. If we had looked at Player 1 first, we delete C1, then Player 2 and delete C2. Final set is the same.

  So we will use this example.

  Summary of the game:

  Players: 2
  Strategies: 
    Player 1: A1, B1, C1
    Player 2: A2, B2, C2

  Payoffs:
  Player 1:
          A2    B2    C2
     A1    0     3     0
     B1    3     0     3
     C1    1     1     1

  Player 2:
          A1    B1    C1
     A2    0     3     0
     B2    3     0     0
     C2    0     0     0

  Note: In the matrix for Player 2, the payoff for (A2, C1) is 0, (B2, C1) is 0, (C2, C1) is 0.

  How to run the in-class game:

  Materials:
  - We will have students pair up (18 students -> 9 pairs) to play the game for several rounds.
  - We need to explain the rules and the payoff matrix.
  - We will use points (not money) and maybe give a reward for the highest score (like bonus points or candy).

  Procedure:
  1. Explain that they will play a game with the provided matrices. Each pair will play several rounds (say 10 rounds). In each round, both players choose one of their strategies simultaneously. Then they will be told the outcome and earn points accordingly.

  2. Give them the matrices. For Player 1 (row player) and Player 2 (column player) in a pair.

  3. After 10 rounds, we will ask them to report their total points.

  4. But note: we want them to think strategically. So we might ask them to play for several rounds and then change their mindset.

  5. Then we will ask the class: "Which strategies did you play? Why? Which ones seem bad?"

  6. We predict that some students might avoid C1 and C2 because they yield lower payoffs on average. But some might try them.

  7. We will then ask: "Is there any strategy that you think is dominated? If so, by what?"

  8. We expect that they might say that C1 is dominated by A1 or B1 in some cases, but then we show that against C2, C1 gives 1 which is better than 0 from A1 and 3 from B1? Wait, in the matrix for Player 1:
     - Against C2: 
          A1:0, B1:3, C1:1.
     So C1 is not dominated by A1 (because against C2: 1>0) and not by B1 (because against A2: 1<3).

  9. Then we introduce the idea of mixed strategies. We can ask: "Can you find a mixed strategy that always does better than C1, no matter what the opponent does?"

  10. Guide them to try a 50-50 mix of A1 and B1. 
     - Against A2: (0+3)/2 = 1.5 > 1
     - Against B2: (3+0)/2 = 1.5 > 1
     - Against C2: (0+3)/2 = 1.5 > 1
     So it works.

  11. Then we can say: "So C1 is strictly dominated by the mixed strategy (0.5, 0.5, 0)."

  12. Then we can remove C1 and consider the reduced game for Player 2. Note that Player 2 knows that Player 1 won't play C1. Then we can do the same for Player 2.

  13. For Player 2's strategy C2: 
      - In the reduced game (where Player 1 only plays A1 or B1), the payoffs for Player 2 are:
          against A1: 0 (from A2), 3 (from B2), 0 (from C2) 
          against B1: 3 (from A2), 0 (from B2), 0 (from C2)
      - We can dominate C2 with a 50-50 mixture of A2 and B2:
          against A1: (0+3)/2 = 1.5 > 0
          against B1: (3+0)/2 = 1.5 > 0

  14. So we delete C2.

  15. The final set is {A1, B1} for Player 1 and {A2, B2} for Player 2.

  Debrief:
  - We have shown that by using mixed strategies, we can iteratively delete strategies.
  - The deletion order: we had to delete C1 first, then C2. 
  - But note: if we try to delete in the reverse order (Player 2 first), we cannot delete anything in the first round because for Player 2, C2 is not dominated when Player 1 might play C1 (because against C1, C2 yields 0 and the mixture of A2 and B2 also yields 0, so not strictly better). 
  - However, after Player 1 deletes C1, then Player 2 can delete C2.
  - This illustrates that the process is order-independent in the sense that the final set of strategies that survive iterated strict dominance is always the same, regardless of the order in which we consider players or strategies, as long as at every round we remove all strategies that are strictly dominated (by any mixed strategy) relative to the current strategy sets of the other players.

  Potential issues:
  1. Students might not understand the concept of mixed strategies dominating a pure strategy. We can explain it with the lottery idea: by flipping a coin to choose between A1 and B1, you get on average 1.5, which is more than 1 from C1, no matter what the other player does.

  2. In the first round, students might not delete C1 because they don't think of mixed strategies. We have to guide them.

  3. When they play the game, they might not experience the domination because in a short run, C1 might yield 1 which is better than getting 0 sometimes. But the in-class game is not for simulation but for them to see the matrix and reason.

  4. We are not requiring them to use mixed strategies in gameplay, only in the analysis.

  5. The game can't get across the idea of order-independence in one run because we only followed one order. We have to explain that if we try to delete Player 2's strategies first, we get stuck, but then after deleting Player 1's C1, we can delete Player 2's C2, so the final set is the same as if we did it in the other order. We have to explicitly discuss that in the debrief.

  What will predictably go wrong:
  - Students might not see why C1 is dominated without the mixed strategy. They might say: "sometimes C1 is better than A1 (against C2) and sometimes better than B1 (against A2 and B2? actually, it's always dominated by the mixture).
  - In the reduced game for Player 2, they might think that C2 is not dominated because against A1 and B1, it gives the same as the mixture in some cases? We have to show the strict inequality.
  - Some students might argue that they can use a different mixture. We can encourage that: any mixture with p in (0,1) for Player 1 and similarly for Player 2 will work.

  Alternative: to save time, we can have them only analyze the matrix without playing, but the playing can make it engaging. But 10 rounds might be too long. We can do 2-3 rounds just to get a feel.

  Revised procedure for time:
  - Explain the matrices.
  - Have them play 2-3 rounds.
  - Then move to the analysis.

  We can also have them, in their pairs, try to find a strategy that is always bad. Then we can discuss.

  Points system: 
  - We assign the payoffs as points. 
  - To avoid negative points, we have only non-negative in this game.

  Total time: 
  - Introduction: 5 min
  - Playing 3 rounds: 10 min (including time to record)
  - Discussion and guided analysis: 20 min
  - Debrief and lecture on iterated deletion and order-independence: 15 min
  - Wrap-up: 5 min

  This is tight, but doable.

  Let me know if you have any adjustments.
