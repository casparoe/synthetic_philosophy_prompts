  ### In-Class Game Design: Iterated Strict Dominance with Mixed Strategies

  #### **Game: "The Dominance Dilemma"**
  - **Players**: 2 per pair (pair up students into 9 pairs).
  - **Strategies**: 
    - Player 1 (Row): A, B, C
    - Player 2 (Column): X, Y, Z
  - **Payoff Matrices (Points)**:  
    - **Player 1’s Points** (row player):  
      |       | X   | Y   | Z   |
      |-------|-----|-----|-----|
      | **A** | 0   | 3   | 0   |
      | **B** | 3   | 0   | 3   |
      | **C** | 1   | 1   | 1   |  

    - **Player 2’s Points** (column player):  
      |       | A   | B   | C   |
      |-------|-----|-----|-----|
      | **X** | 0   | 3   | 0   |
      | **Y** | 3   | 0   | 0   |
      | **Z** | 0   | 0   | 0   |  

  - **Rules**:  
    1. Players choose strategies simultaneously each round.  
    2. Each round lasts 1 minute (use timers).  
    3. Players record choices and points on a scoresheet.  
    4. Play **5 rounds** (enough to see patterns, short enough for time).  
  - **Points System**:  
    - Points are hypothetical (no real money).  
    - **Goal**: Maximize cumulative points.  
    - Track points with a simple grid:  
      | Round | P1 Choice | P2 Choice | P1 Points | P2 Points |  
      |-------|-----------|-----------|-----------|-----------|  

  #### **Materials**:  
  - Printed payoff matrices for each pair.  
  - Scoresheets.  
  - Timer (phone/laptop).  

  ---

  ### **Brainstormed Matrices & Rejections**  
  1. **Candidate 1 (Modified Matching Pennies)**:  
     ```
     P1: 
           X    Y    Z
       A [ 5,  0,  3 ]
       B [ 0,  5,  3 ]
       C [ 2,  2,  2 ]
     ```  
     - **Why rejected**: Strategy C is dominated by a 50/50 mix of A/B, but after deletion, no further dominance occurs. Fails to showcase *iterative* deletion.  

  2. **Candidate 2 (Asymmetric Payoffs)**:  
     ```
     P1: 
           X    Y    Z
       A [ 4,  0,  2 ]
       B [ 0,  4,  2 ]
       C [ 1,  1,  1 ]
     ```  
     - **Why rejected**: Pure strategies can dominate C (e.g., in Z, B > C). Fails to require mixed strategies.  

  3. **Chosen Matrix (Watson’s Example)**:  
     - **Why chosen**:  
       - C is **not dominated by any pure strategy** (e.g., vs. X: A=0, B=3, C=1 – no single strategy beats C everywhere).  
       - C **is dominated by a 50/50 mix of A and B** (avg. 1.5 > 1 against all X/Y/Z).  
       - After deleting C, Player 2’s Z becomes dominated by a 50/50 mix of X/Y (1.5 > 0).  
       - Pure-strategy deletion leaves everything; mixed-strategy deletion eliminates C and Z.  

  ---

  ### **Predictable Challenges & Gaps**  
  **What Will Go Wrong**:  
  1. **Students miss mixed strategies**: Many will say, "C isn’t dominated – sometimes it’s better than A or B!" (e.g., in Z, C=1 > A=0). They’ll defend C as "safe."  
  2. **Confusion over iteration**: After deleting C, students may not realize Player 2’s Z becomes dominatable.  
  3. **Order-dependence intuition**: Students will think deleting Player 1’s vs. Player 2’s strategies first leads to different results.  

  **Gaps the Game Can’t Cover**:  
  - **Why mixed dominance works**: Students might not intuit *why* averaging payoffs beats C. You’ll need to:  
    - **Clarify**: "A lottery over A/B gives 1.5 > 1 *no matter what the opponent does* – it’s a strictly better ‘meta-strategy’."  
  - **Order-independence proof**: The game shows the *process* but not the *proof* of order-independence. You’ll need to:  
    - **Explain**: "If a strategy is dominated, it’s *always* removable. Order doesn’t matter because dominance is defined relative to current strategies."  

  ---

  ### **Debrief Script**  
  **Step 1: Elicit Observations (10 mins)**  
  - Ask: *"Which strategies did you avoid? Why?"*  
    - Expected: "I avoided C – it never gives more than 1 point!"  
    - Pushback: "But C beats A when Player 2 plays Z! It’s not dominated by B or A alone."  

  **Step 2: Introduce Mixed Dominance (15 mins)**  
  - Challenge: *"Can you find a ‘plan’ that always beats C?"*  
  - Guide discovery:  
    - "Suppose Player 1 flips a coin: heads A, tails B. Expected points:  
      - Against X: (0 + 3)/2 = 1.5 > 1  
      - Against Y: (3 + 0)/2 = 1.5 > 1  
      - Against Z: (0 + 3)/2 = 1.5 > 1"  
  - **Key Insight**: C is strictly dominated by the mixed strategy (0.5A, 0.5B).  

  **Step 3: Iterated Deletion (10 mins)**  
  - Remove C: *"Now what about Player 2’s strategies?"*  
  - Reduced matrix (after C deleted):  
    - Player 2’s points vs. A/B only:  
      |     | A   | B   |  
      |-----|-----|-----|
      | **X** | 0   | 3   |  
      | **Y** | 3   | 0   |  
      | **Z** | 0   | 0   |  
    - Ask: *"Is Z dominated now?"*  
      - Pure: Z loses to X in B (0 < 3) and to Y in A (0 < 3).  
      - Mixed: A 50/50 mix of X/Y gives 1.5 > 0 against A or B.  
  - Delete Z. Final survivors: {A, B} for P1, {X, Y} for P2.  

  **Step 4: Order-Independence (10 mins)**  
  - **Student intuition**: "Deleting Player 2’s strategies first should change things!"  
  - **Reveal the gap**:  
    - *"Try deleting Player 2’s Z first. Can you?"*  
      - Against C: Z=0, mix of X/Y=0 → not strictly dominated.  
    - *"But after Player 1 deletes C, Z becomes dominated. Same end result!"*  
  - **Lesson**:  
    - Iterated strict dominance is order-independent: the final set is always {A,B} and {X,Y}.  
    - Why? Dominance is checked against *current* opponent strategies. Once C is gone, Z becomes vulnerable.  

  **Step 5: Connect to Theory (5 mins)**  
  - **Strict dominance by mixed strategies**: A strategy σ is dominated if *any* lottery over other strategies beats it in every scenario.  
  - **Iteration works**: Pure-strategy deletion leaves C and Z alive; mixed-strategy deletion eliminates them.  
  - **Order-independence**: The deletion sequence doesn’t matter – the set of "survivors" is always the same.  

  ---

  ### **Why This Works**  
  - **Experiential gap**: Students see C isn’t dominated by pure strategies but *is* by a mix – creating cognitive tension.  
  - **Predictable "aha!" moment**: When a student defends C, another will propose averaging A/B.  
  - **Order-independence revelation**: Trying and failing to delete Z first shows why the process converges.  

  **Final Tip**: Pre-seed a student to suggest mixing A/B if no one does naturally. This ensures the key insight emerges!
