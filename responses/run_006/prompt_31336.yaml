  Okay, let me start by unpacking this complex question. The user is asking about the philosophical underpinnings of psychiatric advance directives (PADs) compared to other types of contracts. They're pointing out a seeming contradiction: why can a "past self" bind a "future self" in medical treatment contexts but not in other life-altering decisions like servitude or marriage?

  Hmm, I need to first clarify the core tension. On one hand, legal systems enforce PADs during manic episodes, overriding current refusal. On the other hand, they prohibit permanent self-enslavement contracts or irrevocable marriage promises. What theory explains this asymmetry?

  The user suggests two possible frameworks: Parfit's rationality model (where binding future irrationality is acceptable) versus a "non-identity" view (where the manic self isn't the "real" person). I should test both against the legal practice.

  Looking at the medical justification first: clinicians see mania as impairing decision-making capacity. The stable self is considered the authentic one making rational choices. The law likely adopts this view - hence honoring PADs as protecting autonomy. But why not extend this to other domains? 

  Ah, here's the key distinction: PADs are reversible (treatment ends when stable) and time-limited, whereas servitude contracts are permanent. Marriage dissolution rights protect fundamental liberties. The law seems to value both authenticity and future freedom.

  Parfit's reductionist view would complicate things. If identity is just psychological continuity, the manic self is equally "you" - so overriding its wishes becomes ethically murkier. The legal system might struggle with this perspective since it relies on clear capacity thresholds.

  The user's phrasing suggests they've deeply engaged with Parfit's work. I should acknowledge how elegantly they connected the hitchhiker analogy (preventing future irrationality) to this real-world practice. Their underlying concern seems to be about consistency in legal personhood theories.

  Noticing they mention courts "mostly" honor PADs - good nuance. The practice isn't monolithic. I should flag how Parfit's view might make clinicians more hesitant during borderline capacity cases, since the bright line between "selves" blurs.

  Ultimately the law's pragmatic solution works precisely because it doesn't commit to deep metaphysics. But if we took Parfit seriously, we might need more nuanced advance directives that specify degree-of-continuity thresholds for enforcement. Fascinating implications for mental health law reform...
answer: |-
  This practice reveals a fascinating tension in legal philosophy, resting on an **implicit theory of rationality, identity, and agency** centered on **temporal authenticity and capacity-based personhood**. Here's a reconstruction of the underlying principles, the points of underdetermination, and the implications of Parfit's view:

  ### The Implicit Theory Supporting PADs (Ulysses Contracts)
  1.  **The "True Self" Principle:** The stable self is considered the *authentic* or *authoritative* self, possessing full rationality and insight into the person's long-term values and well-being. Mania (or severe depression/psychosis) is seen as an *alien state* distorting identity and will.
  2.  **Capacity Threshold:** Legal competence requires specific cognitive abilities (understanding, reasoning, appreciation, expressing choice). Mania is presumed to reliably impair these *below the threshold* for refusing life-altering medical decisions. The past directive is made *above* that threshold.
  3.  **Temporal Extension of Autonomy:** Honoring the PAD is framed as *respecting the person's deepest autonomy*, not overriding it. It enforces the enduring will formed when capable, protecting the person from their own impaired future self. Autonomy is longitudinal.
  4.  **Best Interests/Paternalism Lite:** There's a strong, evidence-based consensus that untreated mania causes profound harm (financial ruin, relationships destroyed, physical injury, legal consequences). The PAD allows intervention *in line with the person's own competent judgment* of their best interests.
  5.  **Reversibility & Scope Limitation:** The override is temporary and specific. Treatment aims to *restore capacity*. It doesn't permanently enslave, irrevocably transfer assets, or prevent future changes of mind *once stable*. The constraint is therapeutic and time-bound.

  ### Contrast with Prohibited Contracts (Servitude, Earnings, Marriage)
  1.  **Permanence & Irrevocability:** These contracts attempt to bind the *capable future self* permanently. The law presumes individuals retain a fundamental right to revise life choices as circumstances and values evolve, even when capable.
  2.  **Violation of Core Liberties:** Servitude violates fundamental human dignity and liberty. Controlling future earnings stifles economic autonomy and the ability to adapt. Marriage involves profound emotional and relational commitments assumed to require ongoing, capable consent.
  3.  **No Presumption of Incapacity:** The law doesn't presume that a future self wanting to quit a job, leave a marriage, or escape servitude is *incapable* in the medical/legal sense. They are exercising a different (and protected) choice, even if unwise.
  4.  **Lack of Therapeutic Aim:** These contracts aren't designed to *restore* the person to a state of full agency/capacity; they aim to permanently restrict it.

  ### Where the Practice is Underdetermined
  1.  **The "Authentic Self" Boundary:** How severe must the impairment be for the "future self" to lose authority? Is mild hypomania sufficient? What about severe personality disorders or addiction? The line relies heavily on psychiatric diagnosis and functional capacity assessment, not a precise philosophical definition of identity.
  2.  **Scope of Overridable Decisions:** Why *only* psychiatric treatment/hospitalization? Could a stable self direct future ECT during depression despite later refusal? Or mandate specific financial safeguards during mania? The practice currently focuses narrowly on medical intervention to restore stability.
  3.  **Duration and Reassessment:** How long can the override last? The principle demands it ends when capacity is restored, but determining "restored capacity" after complex episodes can be contentious.
  4.  **Conflicting Values:** What if the manic self expresses values fundamentally different from the stable self? The implicit theory prioritizes the stable self's values as "true," but this isn't explicitly argued philosophically.

  ### Parfit's Reductionist View (Psychological Continuity) & Its Implications
  Parfit argues that personal identity isn't a deep, further fact, but consists in **Relation R**: psychological continuity (connectedness + continuity of beliefs, desires, memories, character) and connectedness (direct psychological links) holding to varying *degrees*. There is no "deep self" that endures unchanged.

  *   **Challenge to the Implicit Theory:**
      *   The "authentic self" concept dissolves. Neither the stable self nor the manic self is the "true" self; they are different stages of a psychologically continuous person, connected to different degrees.
      *   The manic refusal *is* an expression of the person's will *at that time*, even if weakly connected to their stable-state values/memories. Overriding it isn't respecting the "real" self, but privileging one stage (the directive-making stage) over another (the manic stage).
      *   Parfit's Hitchhiker analogy *does* fit: The stable self (Hitchhiker) makes a commitment (PAD) to prevent their future self (Driver), who they predict will be irrational (manic), from acting on a harmful desire (refusing treatment). It can be rational to bind one's future irrational self.

  *   **How the Practice Might Change Under Parfit:**
      *   **Shift from Identity to Rationality & Interests:** Justification would focus less on "which self is real?" and more on:
          *   **Predictable Irrationality:** Mania predictably impairs reasoning to a degree that choices are deeply against the person's *enduring, foundational interests* (avoiding suffering, maintaining relationships, survival) – interests arguably shared across most stages.
          *   **Weak Connectedness:** The degree of psychological connectedness between the manic self refusing treatment and the stable self (both before and potentially after) might be deemed too weak for the refusal to carry full autonomous weight. The directive-maker has stronger connections to their recovered future self.
          *   **Moral Imperative to Prevent Harm:** Preventing severe, foreseeable harm caused by the impaired state becomes a stronger primary justification, with the directive providing evidence of the person's *prior endorsement* of this intervention as necessary.
      *   **More Nuanced Assessments:** Instead of a binary "capable/incapable" based on diagnosis, assessments might consider the *degree* of impairment of Relation R and the *severity* of harm risked by respecting the refusal. This could be more complex and contentious.
      *   **Potential Expansion (Cautiously):** If the focus is on preventing severe harm during predictable irrationality, *in principle* it could open the door to *very carefully defined* non-psychiatric directives (e.g., a directive freezing assets during mania). However, the permanence/core liberty issues surrounding servitude/marriage would likely still rule them out, as Parfit doesn't negate the value of present autonomy or fundamental rights.
      *   **Increased Scrutiny on "Enduring Interests":** Defining what constitutes the person's "enduring, foundational interests" shared across stages would become crucial and philosophically challenging.

  ### Conclusion
  The current practice presupposes a **capacity-based, temporally hierarchical theory of identity and autonomy**: the capable, stable self is the authentic authority over the person's life narrative and well-being, particularly when future incapacity is predictable and harmful. The manic refusal is seen not as a valid expression of will but as a symptom negating agency.

  While Parfit's Hitchhiker idea resonates (it *is* rational to bind future irrationality), the practice *does not secretly depend on it*. Instead, it fundamentally relies on the **presumption that the manic self's refusal lacks valid agential status due to incapacity**, making the stable self's directive the only relevant autonomous expression. The prohibitions on other contracts protect the ongoing autonomy of the *capable* self.

  Adopting Parfit's reductionism would **destabilize the core "authentic self" justification**. It would force a shift towards justifying PADs based primarily on **preventing severe harm during states of severely impaired psychological continuity and rationality**, using the directive as evidence of prior rational endorsement of this protection. The practical outcomes might remain similar, but the philosophical foundation would be significantly different and potentially more complex to apply, requiring careful definition of thresholds for impairment, harm, and the nature of "enduring interests." The distinction from servitude contracts would still hold, but based on permanence, violation of fundamental liberties, and the absence of a therapeutic aim to restore full agency, rather than an appeal to a "true self."
