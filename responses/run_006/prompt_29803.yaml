prompt: |-
  A recurring argument in my decision-analysis group goes like this: we are deciding whether to run a small, costless pilot study before a larger product decision, and someone ends debate by saying we should obviously take the free information, because "free information never hurts." The claim is offered as if it were a theorem — and I know there is a result in the neighborhood, Good's theorem on the value of information, which is often summarized in roughly that way. But I suspect the slogan covers several different claims, some true, some false, and some that do not actually license the conclusion being drawn from it. I want a disambiguation I can bring to the next meeting.

  Lay out the distinct precise claims that "free information never hurts" (or "the value of information is never negative") could be taken to express. For each reading: state it as a precise thesis in one or two sentences; say whether it is a theorem, a plausible but non-trivial claim, or false; and specify the assumptions it needs. I especially want the following distinctions kept track of: ex ante versus ex post value; expected versus realized utility; expected-utility maximizers versus agents with non-expected-utility preferences such as ambiguity aversion, anticipatory feelings, or regret; costless acquisition versus the downstream costs of knowing, using, and disclosing the information; accurate evidence versus information one can update on versus information one can simply "ignore"; instrumental versus intrinsic value; and decision-relevance. Then say which reading or readings would actually license the move from "the pilot study is free" to "we should run it," and identify which readings are doing silent work when the slogan is used that way. Also flag any reading that is false even under the theorem's own assumptions because it confuses ex ante with ex post.

  Keep the answer self-contained and do not include a bibliography or citations; I want the structure of the claims, not a literature review. End with a final line beginning "Summary:" followed by one sentence stating which reading of the slogan survives scrutiny and which reading the original argument actually needed.
reasoning: |-
  We are going to disambiguate the slogan "free information never hurts". We'll consider several precise readings and for each, state the thesis, its truth status, assumptions, and then relate to the context of the pilot study.

  Key distinctions to track:
  1. Ex ante vs. ex post value: Ex ante refers to the expected value before the information is obtained; ex post after it is obtained and we know the outcome.
  2. Expected vs. realized utility: Expected utility is the average over possibilities; realized utility is the actual outcome in a particular state.
  3. Agents: Expected-utility maximizers vs. agents with non-expected-utility preferences (ambiguity aversion, anticipatory feelings, regret).
  4. Costless acquisition vs. downstream costs (knowing, using, disclosing).
  5. Accurate evidence vs. information one can update on vs. information one can ignore.
  6. Instrumental vs. intrinsic value: Instrumental value for achieving goals; intrinsic value as an end in itself.
  7. Decision-relevance: Whether the information can change the decision.

  We'll consider several readings:

  Reading 1 (Classic Good's Theorem, ex ante, expected utility, instrumental, without downstream costs):
  Thesis: For a Bayesian expected-utility maximizer, the expected utility of a decision problem with free information (without any direct cost and without considering downstream costs) is at least as high as without it, so the ex ante expected value of information is non-negative.
  Status: Theorem (under standard assumptions).
  Assumptions: The agent is a Bayesian expected-utility maximizer, the information is free (no direct cost) and without downstream costs (like no cost of analysis, no possibility of misuse, no disclosure issues), and the agent can update optimally. The information is generated by a process that is known and correctly modeled (so the likelihoods are accurate).

  Reading 2 (Ex post, expected utility, instrumental):
  Thesis: After obtaining the information, in every possible state of the world, the realized utility of the decision made with the information is at least as high as the realized utility of the decision that would have been made without it.
  Status: False (counterexample: sometimes the information leads to a change that, by bad luck, turns out worse).
  Assumptions: Same as Reading 1, but we look state by state. However, the claim fails because ex post we might have made a different decision that in that particular state yields a worse outcome.

  Reading 3 (Ex post, realized utility, instrumental):
  Thesis: After obtaining the information and having made the decision, the realized utility is at least as high as the realized utility that would have been obtained without the information.
  Status: False (same reason as Reading 2: in some states, the decision with information leads to a worse outcome).

  Reading 4 (Ex ante, non-expected-utility preferences):
  Thesis: For an agent with arbitrary preferences (including non-expected-utility), the ex ante expected utility (if applicable) or the ex ante evaluation of the situation with free information is at least as good as without it.
  Status: False (counterexamples exist). For example, if the agent has ambiguity aversion, getting more information might increase the perceived ambiguity and lower the ex ante evaluation. Also, with anticipatory feelings, knowing more might cause anxiety. Regret might be worse if more information reveals that a better option was available but not taken.
  Assumptions: Agents with non-expected-utility preferences. The claim does not hold generally.

  Reading 5 (Costless acquisition but including downstream costs):
  Thesis: Even if the acquisition of information is free, if there are downstream costs (e.g., cost of analyzing, risk of misuse, disclosure requirements, or opportunity cost of delay) then the net value of the information might be negative.
  Status: Plausible and generally true that these downstream costs can make the net value negative. So the slogan is false when including downstream costs.
  Assumptions: We consider the full costs and benefits of having the information, including any costs that come after acquisition.

  Reading 6 (Ignorability of information):
  Thesis: If the information is free and without downstream costs, and the agent can choose to ignore it (i.e., conditionally commit to the same action as without the information), then the agent can do at least as well with the information as without.
  Status: Theorem (because the agent can always ignore the information and get the same outcome as without it). But note: this does not require the agent to be Bayesian; it only requires that the agent has the option to ignore. However, if there are downstream costs (e.g., the mere knowledge causes distress) then even if you ignore it, the cost might be incurred.
  Assumptions: The agent can commit to ignore the information without any cost. Also, no downstream costs from having the information (even if ignored).

  Reading 7 (Decision-relevance):
  Thesis: If the information is free and without downstream costs, and it is decision-irrelevant (meaning it does not change the optimal action in any state), then the value of information is zero. But if it is decision-relevant, then the value is positive (ex ante).
  Status: Part of Good's theorem: the value is zero if irrelevant, positive if relevant (and strictly positive in at least one state). But note: this is ex ante and for expected utility maximizers.

  Now, which readings license the move from "the pilot study is free" to "we should run it"?

  The original argument assumes that the pilot study is costless and that there are no downstream costs. But we must also consider:

  - The agent must be an expected-utility maximizer (or at least without the non-expected-utility issues that could make information harmful ex ante).
  - The information must be such that we can update on it correctly.

  The move is licensed by Reading 1 and Reading 6. However, Reading 6 is weaker because it says we can always ignore and do no worse, but we might do better. Reading 1 says we expect to do at least as well and strictly better if the information is decision-relevant.

  But note: the original argument says "obviously take the free information". Reading 1 and Reading 6 support that the ex ante expected value is non-negative, so it is rational to take it. However, Reading 6 also allows the possibility of ignoring, but that doesn't mean we shouldn't take it. We take it and then we have the option to use it or ignore.

  But the slogan "free information never hurts" is often used in the sense of Reading 1: ex ante, it never hurts in expectation. However, the original argument might be conflating ex ante and ex post. They might think that no matter what the information reveals, we are never worse off (which is the ex post claim). But that is false (Readings 2 and 3). So the argument might be relying on the ex ante theorem but drawing an ex post conclusion.

  Moreover, the original argument does not consider downstream costs (Reading 5) or non-expected-utility preferences (Reading 4). In a real business context, downstream costs might include:
  - Time delay in waiting for the pilot results (opportunity cost).
  - Cost of analyzing the pilot data.
  - Risk that the pilot data is misinterpreted and leads to a wrong decision.
  - Disclosure: if the pilot results become known to competitors or the public and that causes harm.

  Also, if the group has ambiguity aversion, they might prefer not to have the information to avoid having to confront precise probabilities that might be unfavorable.

  Therefore, the slogan in its strongest and correct form (Reading 1) requires:
  - The agent is an expected-utility maximizer.
  - The information is free (no direct cost) and without downstream costs.
  - The agent can update optimally.

  But note: even under these assumptions, the ex post outcome might be worse (Readings 2 and 3). So if by "never hurts" they mean "never leads to a worse outcome in any state", that is false.

  Summary of which readings survive scrutiny:
  - Reading 1: True (theorem) under its assumptions.
  - Reading 6: True (theorem) under its assumptions (which are weaker in terms of rationality but require no downstream costs even from having the information and the ability to ignore without cost).
  - Reading 5: Highlights a common pitfall: the information might have downstream costs that make it not free.

  The original argument needed the ex ante, expected utility, no downstream costs reading (Reading 1) to license the conclusion. However, in practice, the downstream costs (Reading 5) and non-expected-utility preferences (Reading 4) might make the information harmful.

  Final Summary:

  Summary: The reading that survives scrutiny is that for an expected-utility maximizer, the ex ante expected value of free information without downstream costs is non-negative; however, the original argument needed this ex ante reading but often mistakenly assumes an ex post guarantee, which is false.
answer: |-
  ### Disambiguation of "Free Information Never Hurts"

  **Reading 1: Ex Ante Expected Utility (Good’s Theorem)**  
  *Thesis*: For a Bayesian expected-utility maximizer, the expected utility of acquiring free, decision-relevant information (with no downstream costs) is at least as high as not acquiring it, so the *ex ante* expected value of information is non-negative.  
  *Status*: Theorem.  
  *Assumptions*: Agent is an expected-utility maximizer; information is costless to acquire and use (no downstream costs); agent updates beliefs accurately via Bayes’ rule; information is instrumental (valued only for improving decisions).  
  *Ex Ante/Ex Post*: Ex ante expected value.  
  *Relevance to Pilot Study*: Licenses running the pilot if assumptions hold.  

  **Reading 2: Ex Post Realized Utility (Perfect Guarantee)**  
  *Thesis*: After acquiring free information, the *realized utility* of the decision made with the information is never worse than the decision made without it, in every possible state of the world.  
  *Status*: False.  
  *Assumptions*: Same as Reading 1.  
  *Why False*: Information can lead to a different decision that, by bad luck, yields a worse outcome in a specific state (e.g., pilot misleadingly suggests a bad product will succeed, causing a larger loss). Confuses ex ante expectation with ex post realization.  

  **Reading 3: Non-Expected-Utility Preferences**  
  *Thesis*: For agents with non-expected-utility preferences (e.g., ambiguity aversion, regret, or anticipatory feelings), acquiring free information never reduces ex ante welfare.  
  *Status*: False.  
  *Assumptions*: None beyond free acquisition.  
  *Why False*: Ambiguity-averse agents may prefer ignorance to avoid precise bad news; regret-prone agents may suffer from knowing a better option existed; anticipatory feelings (e.g., anxiety) may reduce welfare pre-decision.  

  **Reading 4: Costless Acquisition Ignoring Downstream Costs**  
  *Thesis*: If information acquisition is costless and the agent can freely "ignore" it (i.e., conditionally commit to the original decision), ex ante expected utility never decreases.  
  *Status*: Theorem.  
  *Assumptions*: Agent can optimally ignore information; no downstream costs (e.g., no cognitive burden, disclosure risks, or analysis costs).  
  *Relevance*: Supports running the pilot only if ignoring is feasible and costless.  

  **Reading 5: Costless Acquisition Including Downstream Costs**  
  *Thesis*: Free information never hurts overall, even considering downstream costs (e.g., delays, misinterpretation, disclosure, or analysis burdens).  
  *Status*: False.  
  *Assumptions*: None.  
  *Why False*: Downstream costs (e.g., pilot delays launch, leaks to competitors, or triggers analysis paralysis) can make net utility negative.  

  **Reading 6: Decision-Irrelevance**  
  *Thesis*: Free information never hurts because if it is decision-irrelevant (i.e., never changes the optimal action), its value is zero, and if relevant, its ex ante value is positive.  
  *Status*: Theorem (under Reading 1’s assumptions).  
  *Assumptions*: Same as Reading 1; information is accurately updatable.  
  *Relevance*: Only licenses running the pilot if information might change the decision.  

  **Reading 7: Intrinsic Value**  
  *Thesis*: Free information never hurts because it has intrinsic value (e.g., curiosity satisfaction) beyond instrumental use.  
  *Status*: Plausible but non-trivial (and often false).  
  *Assumptions*: Information provides positive intrinsic utility.  
  *Why Not Universal*: Instrumentally useless information may cause distress (e.g., learning bad news with no recourse), so intrinsic value can be negative.  

  ---

  ### Which Readings License Running the Pilot?
  - **Licenses the Move**: Only **Reading 1** (ex ante expected utility) and **Reading 6** (decision-relevance under Reading 1’s assumptions) directly license "we should run it." They require expected-utility preferences, no downstream costs, and accurate updating.  
  - **Silent Work in Argument**: The slogan typically relies on **Reading 1** but silently assumes:  
    - No downstream costs (violating **Reading 5**).  
    - Ex ante expectation (while implying an ex post guarantee, as in **Reading 2**, which is false).  
    - Expected-utility preferences (ignoring **Reading 3**).  
  - **False Even Under Theorems**: **Reading 2** (ex post guarantee) is false under Good’s own assumptions because it confuses ex ante expected value with ex post realized utility.  

  **Summary**: The only reading that survives scrutiny is the ex ante expected-utility reading (Reading 1), but the original argument needed this while often silently assuming no downstream costs and mistakenly implying an ex post guarantee.
