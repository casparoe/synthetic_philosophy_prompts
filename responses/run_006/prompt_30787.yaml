prompt: |-
  I review claims at a state disability benefits office — I'm the person who decides whether a claimant's condition counts as a "disease or medical disorder" for coverage, and I do maybe a dozen of these a week. Our manual says we cover diseases and disorders but not "normal variations" or "lifestyle conditions," and then leaves me to sort out which is which. I keep running into the same two frustrating cases: someone with a clear abnormality on their scans who says it's never bothered them and only wants a form signed, and someone with no findings at all who is in real documented distress and can't work. Our staff physician says he can only tell me whether something is statistically unusual or not working the way it's built to; he says wether that's a "disease" is not a medical question. I once heard a podcast where someone said calling something a disease is like calling a plant a weed — it's a judgment about what we don't want, not a fact about the plant. Other people seem to think a disease is just a part of the body failing to do its job, and whether we like it is a separate question. I don't have the background to settle that debate, but I need a procedure I can actually run, and my supervisor will sign off only if the rule is consistent and not just my vibes.

  Please write me a decision procedure for classifying a condition as a disease/disorder for my purposes, grounded in whatever is actually known about that debate, but written for someone who has never read the philosophy. It should be a checklist or set of questions to ask in order, with what counts as a sufficient answer to each, where the procedure stops with a "no," and where it stops and hands the decision to a person because the question is one of values rather than facts. Be honest about which steps are judgment calls dressed up as procedure. Then run the procedure on three cases: a claimant with situs inversus (organs mirrored, no symptoms) who wants us to declare it a disorder after being denied an insurance rider; a claimant with chronic fatigue syndrome who can't work but whose tests are all normal; and a woman claiming coverage for infertility treatment who says she has never wanted children and is only filing because her employer's plan pays out for it. Include at least one case where the procedure gives me an answer I won't like, and say plainly what the procedure can't settle.
reasoning: |-
  Okay, let me start by understanding the user's role. They review claims for disability benefits and need a clear procedure to determine if a condition is a "disease or medical disorder" versus a "normal variation" or "lifestyle condition." The current manual is vague, leading to frustration with cases like asymptomatic abnormalities or symptomatic cases without test evidence. The staff physician only comments on statistical rarity and functional deviation, leaving the disease classification as a non-medical judgment. 

  The user mentioned a podcast comparing disease to weeds—essentially a value judgment. But they need a practical checklist, not philosophy. Their supervisor wants consistency, not personal vibes. So the challenge is creating a procedure that incorporates both objective medical criteria and transparent value judgments where needed.

  First, I should break down the existing frameworks. The biostatistical theory (BST) defines disease as statistically subnormal function. But this doesn't cover distress without objective findings. The harm-based theory adds dysfunction plus harm, which introduces subjectivity. The user needs both elements but with clear boundaries for when harm is required. 

  The procedure must start with objective steps to filter clear cases. Step 1: Statistical Rarity. If something is common and functional, it's out—like mild myopia. But if it's rare and asymptomatic, like situs inversus, it passes Step 1 but fails Step 2 (Functional Impairment). Here, the procedure should stop because there's no dysfunction. 

  Step 2: Functional Impairment. Using the physician's input on whether the body part isn't functioning as designed. If both Steps 1 and 2 are negative, it's a "no." If both are positive, it's likely a disorder. But what about cases where only one is met? That's where Step 3: Harm comes in. Harm includes distress, disability, or increased mortality risk. This step requires human judgment because harm is subjective. 

  The user’s deeper need is reducing uncertainty and justifying decisions. They want to avoid personal bias, so the procedure must specify when to escalate to a values committee. Including case examples will show how the procedure handles edge cases. 

  For situs inversus: Statistically rare (yes), but no functional impairment (no). Stops at Step 2—denied. Chronic fatigue: Statistical rarity unclear (maybe), functional impairment likely (yes), but harm is evident. Proceeds to Step 3, and harm is present, so it's a disorder. Infertility in someone who doesn't want children: Functional impairment (yes), but no harm. Stops at Step 3—denied. This last case might be unpopular, highlighting that harm is value-laden. 

  The user might worry about fairness in harm assessment. The procedure acknowledges that harm isn't universal, so cases without distress get denied. But they need to document that the judgment is based on claimant's experience, not societal norms. Also, the values committee handles contested harm definitions, which protects the reviewer. 

  Including the note that the physician only assesses Steps 1 and 2 clarifies roles. The user handles Step 3, which involves interpreting claimant-reported harm. This division ensures medical input is used where objective, and value judgments are explicit. 

  Finally, the procedure can't resolve what counts as harm; that's a societal question. But by structuring the steps, the user can show consistent application. The examples demonstrate both straightforward and contentious outcomes, preparing the user for pushback while providing a defensible process.
answer: |-
  Here's a decision procedure grounded in the core philosophical debate (Biostatistical Theory vs. Harm-Based Theory), designed for practical application in your role. It prioritizes consistency, leverages your physician's input, and isolates the value judgment step.

  **The "Disease/Disorder" Classification Procedure**

  **Core Principles:**
  1.  **Use the Physician for Facts:** Rely *only* on the staff physician for objective assessments of statistical rarity and biological function deviation (Steps 1 & 2).
  2.  **Define "Harm" Explicitly:** For this procedure, "Harm" means: *Documented significant distress (physical/mental), functional disability preventing normal life activities (especially work), or significantly increased risk of death/disease.*
  3.  **Isolate the Value Judgment:** Only Step 3 involves a value judgment about harm. Steps 1 & 2 are factual gates.
  4.  **Document Rigorously:** Record the physician's answers and the specific evidence used for Step 3.

  **The Procedure (Ask in Order):**

  1.  **STATISTICAL RARITY (Factual Gate - Physician Input):**
      *   **Question to Physician:** *"Is the claimant's specific physiological/anatomical state statistically uncommon within the general population?"*
      *   **Sufficient "Yes":** Physician states the finding/condition is demonstrably rare based on population data (e.g., <1-5% prevalence, depending on context).
      *   **Sufficient "No":** Physician states the finding/condition falls within the common range of human variation.
      *   **"Unknown" or "Borderline":** Proceed to Step 2.
      *   **Stop with "No"?** **NO.** Proceed to Step 2 regardless. (Rarity alone isn't sufficient or necessary for disorder status).

  2.  **FUNCTIONAL IMPAIRMENT (Factual Gate - Physician Input):**
      *   **Question to Physician:** *"Is there objective evidence that a specific body system or part is failing to perform its biologically designed function at a statistically subnormal level?"* (Focus on *how it's built to work*, not whether that causes problems).
      *   **Sufficient "Yes":** Physician identifies a specific, measurable deviation from typical biological function (e.g., reduced kidney filtration rate, nerve conduction deficit, hormone level outside functional range, structural anomaly causing mechanical interference). *The claimant doesn't need to experience symptoms for this to be "Yes".*
      *   **Sufficient "No":** Physician finds no objective evidence of subnormal biological function. All systems operating within statistically normal functional parameters, even if statistically rare (like situs inversus).
      *   **"Unknown" or "Inconclusive":** Proceed to Step 3.
      *   **Stop with "No"?** **YES, if the answer is a clear "No".** (e.g., Situs Inversus). Condition is **not a Disease/Disorder** under this procedure. *Rationale: Lacks the core "biological dysfunction" element central to most definitions.*
      *   **Proceed if "Yes" or "Unknown/Inconclusive".**

  3.  **HARM (Value Judgment Gate - Reviewer Assessment):**
      *   **Question for Reviewer:** *"Is there documented evidence that the condition causes significant Harm (distress, disability, risk) **to this claimant**?"*
      *   **Assessment Criteria (Must be Documented):**
          *   *Distress:* Medical records, therapist notes, pain diaries showing significant suffering.
          *   *Disability:* Objective evidence of inability to perform major life activities (work, self-care, mobility) *directly attributable* to the condition. Work restrictions, ADL limitations.
          *   *Risk:* Physician assessment of significantly increased risk of death, morbidity, or future disability *due to this specific condition*.
      *   **Sufficient "Yes":** Clear, documented evidence meets one or more Harm criteria above.
      *   **Sufficient "No":** No documented evidence of Harm exists OR the only claimed harm is purely social/convenience (e.g., wanting insurance rider denial reversed, seeking employer payout without personal impact).
      *   **"Unclear" or "Contested":** Proceed to Step 4.
      *   **Stop with "No"?** **YES, if the answer is a clear "No".** Condition is **not a Disease/Disorder** under this procedure. *Rationale: Lacks the "harm" element required to move from biological difference to problematic disorder.*
      *   **Proceed if "Yes" or "Unclear/Contested".**

  4.  **VALUES COMMITTEE REFERRAL (Tie-Breaker for Contested Harm):**
      *   **Trigger:** Step 3 ("Harm") is "Unclear" or "Contested" based on available evidence, OR there is fundamental disagreement about whether the documented Harm qualifies under the definition (e.g., is infertility *always* harmful?).
      *   **Action:** Refer the case *specifically on the question of Harm* to a designated committee (if one exists) or your supervisor *for a policy determination*. Include the physician's findings (Steps 1 & 2) and the documented Harm evidence.
      *   **Outcome:** The committee/supervisor makes the final call based on *policy interpretation of "Harm"* in this context. *This is explicitly a value judgment.*

  **Classification Outcome:**
  *   If you proceed through Steps 1-3 and get a "Yes" at Step 3: Condition **IS a Disease/Disorder**.
  *   If you get a "No" at Step 2 or Step 3: Condition **IS NOT a Disease/Disorder**.
  *   If you reach Step 4: Condition classification is **PENDING COMMITTEE/POLICY DECISION**.

  **Honesty About Judgment Calls:**
  *   **Step 1 (Rarity):** Relatively objective (physician's domain). Judgment call: Setting the exact prevalence cutoff for "rare".
  *   **Step 2 (Function):** Core physician judgment. Based on biological knowledge, but involves interpreting "designed function" and "subnormal". This is the key *medical* fact gate.
  *   **Step 3 (Harm):** **This is the major judgment call.** It involves:
      *   Interpreting documentation (is this pain diary *significant* distress?).
      *   Attributing disability *specifically* to the condition (especially complex with overlapping issues).
      *   **The core value judgment:** Deciding *what level or type of suffering/incapacity constitutes "Harm" worthy of labeling a "disease/disorder" for coverage purposes.* The procedure forces you to use documented evidence and a defined harm concept, but interpreting that evidence and applying the definition involves judgment. Step 4 exists for the most contested cases.
  *   **Step 4 (Committee):** Pure value/policy judgment.

  ---

  **Running the Procedure on Cases:**

  **Case 1: Situs Inversus (Organs mirrored, asymptomatic, wants insurance rider denial reversed)**
  1.  **Statistical Rarity:** Ask Physician. **Answer: YES** (Very rare).
  2.  **Functional Impairment:** Ask Physician. **Answer: NO** (All organs function normally within their mirrored positions; no subnormal biological function). **--> STOP. Classification: NOT a Disease/Disorder.** *Rationale: Clear lack of biological dysfunction despite rarity. Harm (Step 3) is irrelevant.*

  **Case 2: Chronic Fatigue Syndrome (Severe fatigue, can't work, all tests normal)**
  1.  **Statistical Rarity:** Ask Physician. **Answer: UNKNOWN/BORDERLINE** (Prevalence debated, fatigue common but *severity* might be rare). Proceed.
  2.  **Functional Impairment:** Ask Physician. **Answer: UNKNOWN/INCONCLUSIVE** (No *specific, objectively measured* biological dysfunction found on standard tests, but profound functional *impact* is documented). *Physician cannot confirm "subnormal biological function" of a specific system based solely on symptoms and normal tests.* Proceed.
  3.  **Harm:** Reviewer Assessment. **Documented Evidence:** Medical records show persistent severe fatigue >6 months, functional capacity evaluation shows inability to sustain work tasks, physician notes disability impacting ADLs. **--> Answer: YES** (Clear documented disability/distress). **Classification: IS a Disease/Disorder.** *Rationale: Meets Harm criterion despite inconclusive Step 2. The profound disability justifies the "disorder" label under the harm-based component.* *Note: This outcome might feel right intuitively, but relies heavily on Step 3 (Harm).*

  **Case 3: Infertility (No desire for children, filing solely for employer payout)**
  1.  **Statistical Rarity:** Ask Physician. **Answer:** Depends on cause. Assume cause found is **YES** (e.g., blocked tubes - statistically sub-fertile/rare).
  2.  **Functional Impairment:** Ask Physician. **Answer: YES** (Reproductive system demonstrably not performing its biological function of conception). Proceed.
  3.  **Harm:** Reviewer Assessment. **Documented Evidence:** Claimant explicitly states no distress, no desire for children, no impact on health, relationships, or *her* life activities. Sole reason is financial payout. **--> Answer: NO** (No documented distress, disability, or risk *to this claimant*). **--> STOP. Classification: NOT a Disease/Disorder.** *Rationale: Clear biological dysfunction (Step 2 Yes), but absence of Harm *to the claimant* per our definition.*

  *   **Why you might not like this answer:** It feels counterintuitive to deny infertility as a disorder. It *is* a clear biological dysfunction.
  *   **What the procedure can't settle:** The procedure *explicitly* defines Harm based on the *individual claimant's experience*. It cannot resolve the *philosophical question* of whether infertility is *inherently* harmful regardless of personal desire. This case highlights that **"biological dysfunction + harm" requires the harm to be experienced by the claimant under this model.** If society/policy believes infertility *should always* be covered as a disorder *regardless of personal impact*, that requires a **policy override** (Step 4 Committee) explicitly stating that infertility is *defined as harmful per se* for coverage purposes. The procedure forces this value conflict into the open at Step 3 or 4.

  **What the Procedure Can't Settle (Plainly):**
  1.  **The definition of "Harm":** The procedure uses a specific, operational definition (distress, disability, risk). It cannot resolve *fundamental disagreements* about what *should* count as harm (e.g., is infertility *always* harmful? Is low testosterone without symptoms harmful?).
  2.  **The weight of Rarity vs. Function:** It prioritizes Function (Step 2) as the key medical gate, per the physician's role. It doesn't resolve if something extremely rare but fully functional *should* be a disorder.
  3.  **Conditions where the Biological Basis is Unknown:** It relies on physician assessment of function. For conditions like some psychiatric disorders or CFS where the *specific* biological dysfunction is elusive, it may default heavily to Harm (Step 3).
  4.  **Societal vs. Individual Harm:** It focuses *only* on harm to the individual claimant. It doesn't address whether societal costs or transmission risks (e.g., asymptomatic carriers) should factor in.

  This procedure provides a consistent, auditable framework. It uses your physician for medical facts, isolates the necessary value judgment (Harm) requiring documentation, and provides an escalation path (Step 4) for the hardest value conflicts. It ensures "vibes" are replaced with defined steps and evidence requirements, especially for the critical Harm assessment.
