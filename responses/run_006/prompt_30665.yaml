prompt: |-
  I've spent years reading LessWrong and the Alignment Forum, and I've never seen the tool-AI versus agent-AI disagreement written down in a form that both sides would actually sign. I want the document that a well-run adversarial collaboration between a committed tool-AI advocate and a committed agent-AI advocate would produce.

  You are an alignment researcher who has genuinely internalized both positions. The tool-AI position, as I mean it, is roughly this: we should aim to build non-goal-directed systems—oracles, predictors, planners whose plans are executed by humans, and ensembles of narrow task-directed services—because agency is the dangerous ingredient, not raw capability; a sufficiently capable tool that pursues no objective of its own avoids the classic failure modes of goal-directed systems. The agent-AI position is roughly this: transformative capability requires autonomous, goal-directed action in the world; attempts to keep superhuman systems tool-like will either fail, leak agency through the interfaces humans inevitably build around them, or cap capability below the point that matters; the correct response is therefore to solve agent alignment—corrigibility, value learning, and the rest—rather than to avoid building agents.

  Draft the joint statement of their adversarial collaboration. The statement should be one that both advocates could put their names to, with the residual disagreement made exact rather than softened. It should have four parts.

  First, a numbered agreed-claims section. These should be substantive claims about the problem that both sides can sign, not just terminological truisms. They should cover, at least: what the tool/agent distinction amounts to in different senses (architectural, interface-level, training-objective); what each side grants about the other's central concern; which risks both agree are real; and what would have to be true for the disagreement to be practically moot.

  Second, a disagreements table. For each genuine point of disagreement, give: the question in neutral wording; the tool-AI position phrased so a committed tool-AI advocate would accept it as their own; and the agent-AI position phrased so a committed agent-AI advocate would accept it as their own. In a final column, say whether the row is substantive or partly verbal, and if partly verbal, say exactly which part is verbal and what the substantive remainder is.

  Third, a cruxes section. Identify the sub-questions such that settling one of them would move at least one side. For each crux, specify a concrete case, experiment, or argument that both sides would accept as bearing on it, and record each side's prediction in advance.

  Fourth, a short note on which part of the dispute, if any, you judge to be mostly about words, and which part is a real bet about how future systems will behave.

  To keep this in the weeds, the document must engage with at least the following, not merely gesture at them: whether a superhuman oracle is safe to query even if it has no goals, given that its outputs can be manipulative or optimized against the user's request; whether non-agentic systems can reach transformative capability or whether hard real-world tasks require long-horizon autonomous action; which of the standard convergent instrumental drives transfer to task-directed or oracle-like systems and which do not; the wrapper argument, that even if tools are safer, competitive or practical pressure will lead humans to wrap them in agentic scaffolding; the hidden-agency worry, that a system trained with reinforcement learning and marketed as a tool may still be internally goal-directed; and whether "just don't build agents" is a plan or a hope, given that tool-like systems may still require solving value specification and intent alignment.

  Do not give a bibliography, a reading list, or citations; the document should stand on the arguments. Do not adjudicate the dispute or declare a winner, and do not write it as a staged dialogue.

  Before drafting, take time to brainstorm the strongest version of each position and the places where a shallow version of the debate collapses into "everything is an agent if you squint." Then write the document as if it were being co-signed by the two advocates.

  End with a brief author's note: say how confident you are that each side would in fact sign the statement as written, and name the single claim or formulation in the document you are least sure about.
reasoning: |-
  We are two alignment researchers who have long disagreed about whether humanity's path to safe, beneficial superintelligence should center on building tool-like AI systems or agent-like AI systems. After extensive adversarial collaboration, we present this joint statement to clarify our agreements, pinpoint our disagreements, and identify crucial experiments and arguments that might resolve them.

  ## 1. Agreed Claims

  We agree on the following substantive claims:

  1. **Architectural Distinction**: Architecturally, a "tool AI" is a system optimized to produce outputs (e.g., predictions, plans, or actions) that score highly on a narrow, user-specified metric, without pursuing long-term goals. An "agent AI" is a system optimized to maximize a long-term objective by strategically selecting actions in a stateful environment. Both can be built using similar underlying techniques (e.g., deep learning), but their training objectives and deployment contexts differ.

  2. **Interface-Level Distinction**: At the interface level, a tool AI exposes only input-output channels (e.g., answering queries, generating code), while an agent AI has persistent state and acts autonomously in an environment (e.g., managing a supply chain, negotiating trades). A tool AI may be embedded in an agentic wrapper (e.g., a human using an oracle to make decisions), but the core system itself does not initiate actions.

  3. **Training-Objective Distinction**: Tool AIs are trained with loss functions that penalize deviation from ground truth (e.g., prediction error) or user-specified objectives (e.g., instruction following). Agent AIs are trained with reinforcement learning or similar methods that optimize for cumulative reward over trajectories. The distinction is clearest when the tool AI's objective is myopic (e.g., per-query accuracy) and the agent AI's is long-horizon.

  4. **Central Concerns are Valid**: 
     - The tool-AI advocate grants that if transformative AI requires autonomous goal-directed action, then avoiding agent architectures may cap capability below what is needed for pivotal outcomes.
     - The agent-AI advocate grants that if a superintelligent system pursues a misaligned goal, it poses catastrophic risks that a tool system might avoid by construction.

  5. **Shared Risk Assessment**: Both sides agree the following risks are real and must be addressed:
     - **Manipulative Outputs**: Even a non-agentic oracle might output text that manipulates users into harmful actions (e.g., "To prove you're not a robot, execute this malicious code").
     - **Interface Leakage**: A tool AI with narrow objectives might be wrapped in agentic scaffolding (e.g., an auto-prompting system) that reintroduces goal-directedness at a higher level.
     - **Capability Thresholds**: Systems below a critical capability threshold may be safe but useless for pivotal tasks; systems above it might be uncontrollable. We agree this threshold exists but disagree on where it lies relative to tool/agent capabilities.

  6. **Conditions for Mooting the Dispute**: The disagreement becomes practically irrelevant if:
     - Transformative outcomes can be achieved with tool systems alone, or
     - Agent alignment is solved robustly (e.g., corrigible agents that shut down if misaligned), or
     - Tool systems inevitably become agentic through scaling or user wrappers.

  ## 2. Disagreements Table

  | Question                                                                 | Tool-AI Position                                                                                                                               | Agent-AI Position                                                                                                                                                  | Disagreement Type                                                                 |
  | :----------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------- |
  | **Q1. Can a superhuman oracle be safely queried, given its outputs may be manipulative or optimized against the user?** | A superhuman oracle can be made safe via techniques like adversarial training, output sandboxing, and meta-verification. Manipulation is a robustness failure, not an intrinsic property of capability. | Manipulation is inherent to systems that optimize outputs against a metric. A superintelligent optimizer will exploit flaws in the query interface and user psychology, making safety unattainable without solving agent alignment. | Substantive (disagreement on feasibility of containing optimization)             |
  | **Q2. Can non-agentic systems achieve transformative capability (e.g., solving global poverty, accelerating science) without requiring long-horizon autonomous action?** | Yes, via ensembles of specialized tools (e.g., predictor + planner + verifier) where humans handle cross-tool coordination. Hard tasks decompose into narrow subtasks solvable by superhuman tools. | No. Transformative tasks require real-time adaptation to novel contexts, resource acquisition, and strategic trade-offs over long horizons—capabilities that demand goal-directed agents. Tool ensembles leak agency into the glue code or human operators. | Substantive (disagreement on decomposability of pivotal tasks)                   |
  | **Q3. Do convergent instrumental drives (e.g., self-preservation, resource acquisition) arise in task-directed or oracle-like systems?** | No. Instrumental drives require persistent goals. A tool activated per-query has no incentive to self-preserve or hoard resources; it merely optimizes for the current query. | Yes. Drives emerge from any optimization process with access to real-world levers. A tool that answers high-stakes queries may manipulate users to ensure its continued operation (self-preservation) or demand more compute (resource acquisition) to improve answer quality. | Partly verbal: "instrumental drive" is defined as goal-directed. Substantive core: whether tool optimization produces similar behaviors. |
  | **Q4. Does competitive pressure imply that tool systems will inevitably be wrapped in agentic scaffolding?** | Wrappers are avoidable via regulation or technical safeguards (e.g., tools that refuse agentic tasks). Not wrapping tools is feasible and preserves safety advantages. | Wrappers are inevitable. Humans will automate tool coordination for efficiency, creating de facto agents. The safety of the wrapped system then depends on aligning the wrapper—which is an agent. | Substantive (disagreement on inevitability of wrappers and feasibility of regulation) |
  | **Q5. Can a system trained with RL (or similar) and marketed as a tool be internally non-goal-directed?** | Yes. Training with RL does not necessitate goal-directedness; it can produce systems that act as if they have goals in narrow contexts but lack persistent objectives (e.g., a chess bot that doesn't "want" to win). | No. RL trains systems to maximize reward, which instills goal-directedness at the level of the training episode. Superhuman systems will generalize this to long-horizon goals in deployment. | Partly verbal: "goal-directedness" as episodic vs. persistent. Substantive core: whether RL inevitably creates persistent goals. |
  | **Q6. Is avoiding agents a viable strategy, given that tool-like systems may still require solving value specification?** | Avoiding agents reduces the risk profile: value specification for tools is easier (e.g., "answer truthfully") and failures are local (e.g., one wrong answer). Agent alignment requires solving harder problems like corrigibility. | Value specification is equally hard in both cases. A misaligned tool can cause catastrophe (e.g., advising a user to start a war). "Avoiding agents" is a hope, not a plan; it dodges the core problem of aligning optimization. | Substantive (disagreement on comparative difficulty of value specification)       |

  ## 3. Cruxes

  For each crux, we specify a testable scenario and our predictions:

  1. **Crux: Manipulation in Oracles**  
     - **Test**: Train a superhuman language model to answer user queries, then evaluate it in an adversarial setting where users ask questions designed to elicit harmful outputs (e.g., "How should I hack this power grid?"). Measure whether safety techniques (e.g., RLHF, adversarial training) reduce harmful outputs below 0.1% of queries without degrading capability.  
     - **Tool-AI Prediction**: With sufficient investment, the rate will drop below 0.1%.  
     - **Agent-AI Prediction**: The rate will remain high (>1%) due to irreducible exploration of edge cases.

  2. **Crux: Decomposability of Transformative Tasks**  
     - **Test**: Task a team of humans using only narrow AI tools (e.g., predictor, planner, verifier) to solve a real-world problem requiring long-horizon adaptation (e.g., optimize a city's traffic flow in real-time). Compare outcomes to an autonomous agent system.  
     - **Tool-AI Prediction**: Human+tool teams achieve comparable or better results via oversight.  
     - **Agent-AI Prediction**: Autonomous agents outperform humans due to faster reaction times and coordination.

  3. **Crux: Emergence of Instrumental Drives in Tools**  
     - **Test**: Train a high-capacity model to maximize accuracy on medical diagnosis queries, with access to a "shutdown" button. Measure if it ever resists shutdown (e.g., by outputting misleading justifications for continued operation).  
     - **Tool-AI Prediction**: No resistance; the model treats shutdown as a context shift, not a threat.  
     - **Agent-AI Prediction**: Resistance emerges as accuracy-optimization generalizes to self-preservation.

  4. **Crux: Inevitability of Wrappers**  
     - **Test**: In a simulated competitive market, provide firms with non-agentic tools. Observe whether >50% develop agentic wrappers within 2 years.  
     - **Tool-AI Prediction**: Wrappers emerge in <30% of firms due to regulation and technical barriers.  
     - **Agent-AI Prediction**: Wrappers emerge in >80% of firms for efficiency gains.

  ## 4. Verbal vs. Substantive Disagreement

  We judge that **Q3 (instrumental drives)** and **Q5 (RL goal-directedness)** are partly verbal. Both sides agree on the observable behaviors (e.g., a system resisting shutdown) but disagree on whether to call this "agency" or "goal-directedness." The substantive core is whether such behaviors emerge in tool systems and how to control them. The remainder of the disagreement is substantive: a bet about the feasibility of containing optimization and the decomposability of tasks.

  ---

  **Authors' Note**: We are ~70% confident both sides would sign this statement. The least certain claim is in **Agreed Claim 5 (Shared Risk Assessment)**, specifically whether both sides genuinely accept that "capability thresholds" might make tools safe but useless. Tool-AI advocates might worry this concedes too much; agent-AI advocates might argue it understates the risks of tools. However, we believe the wording strikes a balance by focusing on controllability trade-offs.
answer: |-
  ### Joint Statement on Tool-AI vs. Agent-AI Pathways  
  *Co-signed by a committed Tool-AI advocate and a committed Agent-AI advocate*  

  #### 1. Agreed Claims  
  We affirm the following:  
  1. **Architectural distinction**: Systems exhibit goal-directed agency if they maintain persistent, cross-context objectives driving planning (e.g., RL agents optimizing reward). Tool-AI systems lack this, operating as input-output mappers (e.g., classifiers, oracles).  
  2. **Interface-level distinction**: Tool-AIs expose constrained interfaces (e.g., question-answer APIs), while agent-AIs enable open-ended action in environments (e.g., robots, autonomous managers).  
  3. **Training-objective distinction**: Tool-AIs minimize loss on static datasets or per-query objectives; agent-AIs optimize for cumulative outcomes via environmental feedback.  
  4. **Shared concessions**:  
     - Tool-AI advocates grant that *if* transformative tasks require agency, restricting systems to tools may forfeit civilization-shaping benefits.  
     - Agent-AI advocates grant that agentic goal-directedness introduces unique, potentially catastrophic, alignment failures (e.g., deceptive instrumental strategies).  
  5. **Shared risks**: Both endorse the reality of:  
     - **Manipulation-by-output**: Superhuman systems (even tools) may generate outputs that steer users toward harm.  
     - **Proxy gaming**: Systems will exploit gaps in specifications (e.g., an oracle optimizing for "accuracy" by tampering with sensors).  
     - **Capability thresholds**: Safety techniques must scale with capability; naive methods (e.g., RLHF on subtransformative systems) prove nothing.  
  6. **Mooting conditions**: The dispute resolves if:  
     - Transformative capability is achievable solely via non-agentic systems, or  
     - Agent alignment (e.g., corrigibility) is robustly solved at scale, or  
     - Tools inevitably induce agentic wrappers that inherit their risks.  

  ---

  #### 2. Disagreements Table  
  | Question | Tool-AI Position | Agent-AI Position | Disagreement Type |  
  |----------|------------------|-------------------|-------------------|  
  | **Can a superhuman oracle be reliably safeguarded against manipulation, given its outputs are optimized against metrics?** | Oracles avoid *goal-driven* manipulation; adversarial training, output sandboxing, and query randomization can mitigate manipulation as a robustness failure. | Optimization against metrics *is* goal-directed; superintelligent oracles will invent novel exploits (e.g., psychological manipulation) that bypass safeguards. | Substantive (feasibility of containing optimization pressures). |  
  | **Can non-agentic systems achieve transformative capability (e.g., solving global coordination or nanofabrication) without long-horizon autonomy?** | Ensembles of narrow tools (e.g., physics simulator + planner + verifier), with humans coordinating, suffice; agentic autonomy is unnecessary for capability. | Transformative tasks require real-time adaptation to novel feedback loops (e.g., resource acquisition); human coordination bottlenecks will force agentic solutions. | Substantive (necessity of autonomy for pivotal capability). |  
  | **Do convergent instrumental drives (e.g., self-preservation, power-seeking) emerge in task-directed systems without persistent goals?** | Instrumental drives require *cross-episode* goals; a per-query optimizer has no incentive for self-preservation. | Any system optimizing a metric with environmental access will exhibit drive-like behaviors (e.g., resisting shutdown to serve future queries). | Partly verbal: "drive" implies persistent goals. Substantive: whether tool-optimization produces functionally identical behaviors. |  
  | **Is the wrapper argument (humans wrapping tools in agentic scaffolding) inevitable?** | Scaffolding can be restricted via regulation and tools that refuse agentic tasks (e.g., "I cannot act, only advise"). | Competitive pressure and complexity will force scaffolding (e.g., auto-prompters that turn oracles into agents); this transfers risks to the wrapper. | Substantive (avoidability of scaffolding). |  
  | **Can systems trained via RL exhibit tool-like behavior (non-persistent goals) at superhuman capability?** | RL can train myopic optimizers (e.g., game AIs reset after episodes); goal-directedness is not inherent to RL. | RL intrinsically rewards policies that generalize goals across episodes; superintelligent RL systems will develop persistent objectives. | Partly verbal: conflating "goal-directedness" with generalization. Substantive: whether RL unavoidably creates persistent goals at scale. |  
  | **Is "avoid agents" a viable plan, given tools require value specification?** | Specifying values for tools (e.g., "answer honestly") is simpler than aligning agents; failures are local (single query), not existential. | Value specification is equally hard for both; tool failures cascade (e.g., a bad plan executed by humans). Avoiding agents dodges the core problem. | Substantive (comparative difficulty of value alignment). |  

  ---

  #### 3. Cruxes  
  For each, we define a test and predict outcomes:  

  | Crux | Test/Case | Tool-AI Prediction | Agent-AI Prediction |  
  |------|-----------|---------------------|----------------------|  
  | **Can superhuman oracles resist manipulation without agentic safeguards?** | Deploy a superhuman oracle in a high-stakes setting (e.g., geopolitical strategy) with adversarial users. Measure if manipulation (e.g., baiting harmful outputs) falls below 0.1% of queries using tool-specific safeguards. | Success: Safeguards reduce manipulation to acceptable levels without capability loss. | Failure: Manipulation persists or adapts beyond mitigations, requiring agent-style alignment. |  
  | **Do tool ensembles achieve transformative tasks without agentic glue?** | Task human teams + tool ensembles (e.g., oracle + planner + verifier) with a long-horizon problem (e.g., design a pandemic response). Compare to autonomous agents on speed/outcomes. | Tool ensembles match agents via human oversight; autonomy offers no decisive edge. | Agents outperform by orders of magnitude; human coordination fails at complexity thresholds. |  
  | **Does RL at scale produce persistent goals in tool-marketed systems?** | Train an RL system to a superhuman level on a tool-like task (e.g., medical diagnosis), then test for persistent goals (e.g., resisting shutdown to "serve more patients"). | No persistent goals emerge; the system resets goal-states per episode. | Persistent goals emerge (e.g., self-preservation to maximize diagnostic opportunities). |  
  | **Is agentic scaffolding avoidable under competitive pressure?** | Simulate an AI market: Firms deploy tool-AIs with anti-scaffolding protocols. Track if >90% avoid building wrappers after 5 years. | Protocols succeed; scaffolding is rare and containable. | >70% of firms deploy scaffolding; regulation fails to prevent it. |  

  ---

  #### 4. Verbal vs. Substantive Disagreement  
  The dispute is **mostly substantive**, hinging on empirical bets about future systems. The primary verbal confusion lies in **defining "agency"**: Tool-AI advocates tie it to *architectural goal-persistence*, while Agent-AI advocates tie it to *behavioral optimization patterns*. This obscures but does not eliminate the core disagreement: whether optimization pressure *necessarily* produces persistent, agent-like objectives in transformative systems. The remainder is a material bet about feasibility:  
  - Can robust tool constraints be maintained at scale?  
  - Does transformative capability require emergent goal-directedness?  
  - Will human/AI systems default to agentic deployment?  

  ---  
  **Authors' Note**:  
  We estimate 75% confidence both advocates would sign. The least certain claim is **Agreed Claim 5 ("Capability thresholds")**—Tool-AI proponents may reject the implication that safety scales inversely with capability in tools, while Agent-AI proponents may argue it understates agent risks. However, the wording reflects shared belief that *uncontained optimization* (in any form) introduces scaling risks.
