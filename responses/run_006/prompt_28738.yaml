answer: |-
  Here’s a translation of Arendt’s core arguments into your toolkit’s vocabulary, followed by a residue analysis of what fits cleanly, what requires forcing, and what’s missing:

  ### Restatement in Game Theory/Information Economics Vocabulary
  1.  **The Two Truths & Fragility of Factual Truth:**
      *   **Rational Truth (Math/Logic):** Functions like an *indisputable common prior*. It’s tautological or deductive, requiring no costly verification. Agreement is *incentive-compatible*; dissent is irrational (a dominated strategy).
      *   **Factual Truth (Events/Facts):** Is a *costly, noisy public signal* about a past state of the world. It requires investment in verification (a *costly signal* itself) and is vulnerable to *strategic disinformation* (cheap fake signals). Because it’s contingent (one of many possible histories), it doesn’t *force agreement* like rational truth. Disagreement can be *equilibrium* even with identical priors, due to differing interpretations or access to verification costs.

  2.  **Modern Political Lying as Rewriting the Shared Record:**
      *   Organized lying isn't merely sending a *cheap talk* false signal. It’s a *coordinated attack on the public signal infrastructure*.
      *   Actors flood the information ecosystem with *counter-signals (noise/fog)* targeting *common knowledge*. The goal isn't just to convince individuals (private belief manipulation), but to **destroy the *common prior*** regarding the factual baseline. It aims to make the *public signal* (the established record) unusable or undefined.
      *   This is a *reputational attack* on institutions responsible for signal verification (media, academia, courts), lowering trust in their signals (increasing perceived verification costs).

  3.  **The Deepest Damage: Collapse of the Shared World:**
      *   The endpoint isn't widespread belief in a *specific* lie (a new, bad equilibrium). It’s **the collapse of the *common prior* itself** regarding the existence of a shared factual reality.
      *   When the *public signal* is persistently corrupted and verification costs become prohibitive, individuals retreat into *private signals* (personal experience, partisan sources) or purely *ideological priors*. This fragments the information landscape.
      *   Without a shared factual baseline (*common prior*), *Bayesian updating* becomes impossible on contested topics. Agents operate in completely disjoint *information cascades*, unable to find common ground even with perfect communication (*cheap talk* becomes meaningless). The *coordination game* of shared reality breaks down.

  4.  **"The Common World":**
      *   This is the **set of *public signals* elevated to the status of *common knowledge*** that serves as the *anchor* for political discourse and collective action. It's the shared *prior* against which new signals are measured and *Bayesian updating* occurs. Its existence is a prerequisite for meaningful *signaling games* in the political sphere.

  ### Residue Report

  1.  **Clean Translations (Strong Fit):**
      *   **Organized Lying as Signal-Jamming:** Framing systematic deception as an attack on the *public signal* infrastructure and *common knowledge* rather than isolated cheap talk is precise and powerful. Arendt’s "rewriting the record" maps directly to corrupting the *public signal*.
      *   **"Believe the Lie" -> "Believe Nothing" as Common Prior Collapse:** Translating the erosion of shared reality into the *collapse of the common prior* is highly faithful. Your vocabulary perfectly captures the *consequence*: the impossibility of Bayesian updating and the fragmentation into disjoint information cascades. Arendt’s "they stop believing in the existence of any shared factual world" *is* the death of the common prior for factual events.
      *   **Rational Truth as Uncontested Common Prior:** Mapping mathematical/logical truth to an indisputable common prior that forces agreement is straightforward and accurate.

  2.  **Forced Fits (Requires Distortion/Extension):**
      *   **The *Nature* of Factual Truth's Fragility:** While your toolkit explains *why* factual signals are vulnerable (costly verification, noise, strategic attack), Arendt adds a deeper, almost *ontological* layer. Her point about factual truth's dependence on *witnesses*, *testimony*, and *plurality* (multiple perspectives on a single event) introduces a human/social dimension of fragility ("contingent") that feels richer and more precarious than just "costly signal." Your models handle the *mechanism* of fragility well, but hers emphasizes the *human unreliability and plurality* underpinning it.
      *   **The "Common World" as More Than Just Common Knowledge:** While it *includes* common knowledge, Arendt's "common world" carries a heavier, more *existential* weight. It's the shared *space of appearance* where facts become real *through discourse and witness*. Your "common prior" captures the *informational* aspect, but hers implies the *infrastructure of discourse itself* – the tacit agreement that there *is* a shared reality to discuss and that certain methods (testimony, evidence) are valid. Your models *presuppose* agents operating in some shared world; she highlights how that world is actively *constituted* and can be *destroyed*. This is a nuance, not a contradiction.
      *   **The Role of Power:** Arendt explicitly links organized lying to *power structures* (governments, large organizations) capable of overwhelming the signal ecosystem. While your models can incorporate powerful senders, her emphasis is on the *structural advantage* and *resources* required for this level of attack – the asymmetry is central. Modeling this explicitly requires adding assumptions about resource disparities.

  3.  **Missing Counterparts (Gaps in the Vocabulary or Arendt's Precision):**
      *   **Truth as a Foundational Good (Moral Dimension):** Arendt argues that factual truth, however fragile, is essential *for* politics – it's the ground upon which debate and action occur. Your toolkit is amoral; it models how information *works*, not whether truth is inherently *valuable*. This gap isn't a weakness in your models (they aren't designed for ethics), but it misses a core *motivation* in Arendt: truth's *necessity* for a functioning polity. Her claim isn't just descriptive ("this happens"), it's normative ("this is catastrophic *because* it destroys politics").
      *   **The Unpredictability of Action & Narrative:** Arendt stresses that factual truths concern unpredictable human actions, weaving into complex narratives. While information cascades model belief formation, they often simplify the underlying event space. Arendt's "contingency" points to the inherent messiness of human history that resists neat probabilistic modeling. Your models abstract away this messiness; she sees it as central to factual truth's nature.
      *   **The Existential Stakes:** Arendt's horror at the destruction of the "common world" stems from a belief that it underpins human *reality* and meaningful existence. The game-theoretic concept of a collapsed common prior describes the *mechanics* (failed coordination, inability to update), but doesn't capture the *existential dread* she associates with it ("worldlessness"). This is a philosophical claim beyond the scope of your descriptive models.
      *   **"Forcing Agreement" vs. Logical Truth:** Your models show why factual truth *doesn't* force agreement (multiple equilibria, costly verification). Arendt contrasts this with logical truth which *does* "force" agreement. However, game theory shows that even logical truths can be rejected by agents with sufficiently perverse incentives or radically different priors (e.g., fundamentalists rejecting evolution). Arendt slightly overstates the "forcing" power of rational truth; your models expose its dependence on shared rationality assumptions.

  ### Conclusion: On "The Common World" and Your Models
  "The common world" is **not just common knowledge by another name**, though it critically depends on it. **It is the foundational *shared reality presupposed by your models* that they cannot formally state.**

  *   **Your Models Presuppose It:** Every signaling game, Bayesian update, or coordination problem assumes agents share *some* underlying reality (a state space, possible signals, payoffs tied to states). Arendt's "common world" *is* this shared baseline reality – the thing that *makes* signals about *something* and allows for common priors to form *in the first place*.
  *   **Your Models Cannot Generate It:** Game theory takes this shared world/state space as given. Arendt focuses on how this world is *constituted* socially (through testimony, record-keeping, discourse) and how it can be *actively destroyed* (through organized lying). Your models show what happens *after* it's damaged (common prior collapse, fragmentation), but not how it's built or the full existential cost of its loss.
  *   **The Gap is Real and Important:** This isn't a flaw in your models; they are tools for analysis within a given framework. Arendt highlights the *pre-conditional framework* itself – the shared factual ground – as a politically constructed and destructible entity. Your vocabulary brilliantly models the *dynamics within* that world and its *informational collapse*, but Arendt forces you to confront the *existence and fragility of the world itself* that your models require to function. She points to the **scaffolding holding up your game board.** Recognizing this gap is crucial; it shows your models are powerful *within* a domain whose fundamental stability they cannot explain or guarantee.
