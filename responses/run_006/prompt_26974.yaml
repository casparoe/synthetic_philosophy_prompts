prompt: |-
  For some time I have been reading rationalist-adjacent discussions in which the common prior assumption is treated either as an obvious coherence requirement or as an obviously question-begging modeling choice, and I would like to stop going in circles. Before I read another defense or dismissal, I want the specification: what would an adequate theory of the common prior assumption — and of when rational agents may permissibly disagree — have to deliver?

  Write the desiderata. For each requirement, give the case, result, or argument that makes it a requirement, and mark it as non-negotiable or as a preference of one camp. Then identify which subsets of the desiderata cannot be jointly satisfied — I expect Aumann's agreement theorem to make at least one combination inconsistent — and say which single requirement does the most work in ruling out the standard positions. Do not bother with a scorecard or a survey of the literature; the criteria and their tension points are what I want.

  Make sure the list engages at least the following pressures: the agreement result — that agents who share a prior and have common knowledge of each other's posterior probabilities cannot stably disagree — and the question of which premise an account is forced to reject; the distinction between a common prior as a normative constraint on rational belief, a modeling convention, and an empirical claim about real agents; the doctrine that differences in belief should be explained by differences in information rather than by different priors; the no-trade result and what it commits an account to saying about speculative trade; the question of whether a shared prior must also be a unique rational prior, or whether many priors are permissible provided they are shared; the fact that actual agents disagree persistently, which any account must either explain away or accommodate; and the question of whether disagreement must wash out as shared evidence accumulates. Where these pressures pull against one another — for example, preserving stable rational disagreement while retaining common knowledge of posterior probabilities — spell out the conflict explicitly, because that is the part I most want to see.
reasoning: |-
  We are going to set out the desiderata for a theory of the common prior assumption (CPA) and rational disagreement. The goal is to list requirements that such a theory must meet, explain the case or argument that motivates each, and mark whether it is non-negotiable (for a particular camp) or a preference. We will then identify which subsets of desiderata are in conflict and which requirement is the key source of conflict.

  ### Desiderata

  1. **Agreement under Common Prior and Common Knowledge (Aumann's Agreement Theorem)**
     - **Description**: If two agents have a common prior and their posteriors for a given event are common knowledge, then these posteriors must be equal.
     - **Motivation**: Aumann's theorem (1976) is a mathematical result. It shows that common knowledge of posteriors and a common prior force agreement. This is often taken as a benchmark for rational interaction.
     - **Status**: Non-negotiable for those who accept the axioms of Bayesian rationality and common knowledge. However, it is precisely the premise that others reject to allow for rational disagreement.

  2. **Common Prior as a Normative Constraint**
     - **Description**: Rational agents must share a common prior. Differences in belief must arise solely from differences in information.
     - **Motivation**: Without a common prior, it seems arbitrary why agents have different priors. The doctrine that "rationality requires common priors" is often motivated by the idea that prior beliefs should be based on no information, hence the same for everyone.
     - **Status**: Non-negotiable for the pro-CPA camp (e.g., Aumann, Harsanyi). For the anti-CPA camp, this is rejected.

  3. **Common Prior as a Modeling Convention**
     - **Description**: The common prior is a useful modeling assumption that simplifies analysis, but it is not necessarily a requirement of rationality.
     - **Motivation**: In many economic and game-theoretic models, the CPA is assumed for tractability. It allows for clear predictions and avoids the problem of having to specify arbitrary priors for each agent.
     - **Status**: A preference for modelers who value tractability and simplicity. It is not a non-negotiable requirement for rationality.

  4. **Common Prior as an Empirical Claim**
     - **Description**: In reality, agents do have common priors (or at least, they are approximately common).
     - **Motivation**: The claim is that actual human agents, when rational, start from similar priors. This is challenged by the observation of persistent disagreement.
     - **Status**: An empirical claim that may be false. It is non-negotiable only for those who insist that the CPA must be empirically true. However, many proponents of CPA view it as a normative ideal.

  5. **Explanation of Belief Differences by Information**
     - **Description**: Differences in posterior beliefs should be explained by differences in the information received, not by differences in priors.
     - **Motivation**: This is the core of the CPA doctrine. If priors are common, then any divergence in beliefs must be due to having different information. This is seen as the only non-arbitrary explanation.
     - **Status**: Non-negotiable for the pro-CPA camp. The anti-CPA camp argues that differences in prior beliefs can be rational (e.g., due to different life experiences, interpretations, or conceptual frameworks).

  6. **No-Trade Result and Speculative Trade**
     - **Description**: If two agents have common priors and common knowledge of each other's beliefs, then they will not engage in speculative trade (betting) because they would see no gain from trade.
     - **Motivation**: The no-trade theorem (Milgrom and Stokey, 1982) shows that under CPA and common knowledge of posteriors, agents cannot both expect to gain from a trade (a bet). This is because they both believe the trade has zero or negative expected value. Therefore, the occurrence of speculative trade is evidence against the CPA or common knowledge.
     - **Status**: Non-negotiable for those who accept the CPA and the no-trade theorem. Critics might point to real-world trading as evidence that either CPA fails or common knowledge is absent.

  7. **Permissibility of Multiple Rational Priors**
     - **Description**: There might be multiple priors that are rationally permissible. However, if agents are to avoid the problems of disagreement and no-trade, they must at least share the same prior (even if there are other priors that would also be rational).
     - **Motivation**: Some argue that rationality does not uniquely determine a prior. However, to salvage the idea that rational agents should agree when they have the same information, we might require that they share a prior (even if it is one of many permissible ones).
     - **Status**: A preference for those who want to allow for permissivism about priors but still want to retain some form of the agreement theorem. Non-negotiable for those who think that rationality requires a unique prior.

  8. **Accommodation of Persistent Disagreement**
     - **Description**: Any account must explain why actual agents disagree persistently, even when they have access to the same evidence and are rational.
     - **Motivation**: Empirical observation: people disagree about many things (politics, religion, etc.) even after extensive discussion and evidence sharing. A theory that says such disagreement is irrational must explain why it is so common. A theory that allows for rational disagreement must show how it is consistent with rationality.
     - **Status**: Non-negotiable for any account that aims to be descriptive. For normative accounts, it is a challenge to explain why people are irrational or what conditions are not met.

  9. **Washing Out of Priors (Asymptotic Agreement)**
     - **Description**: As agents share more and more evidence, their beliefs should converge, even if they started with different priors (provided the priors are not too extreme).
     - **Motivation**: The merging-of-opinions result (Blackwell and Dubins, 1962) shows that under certain conditions (absolute continuity of priors), as the amount of shared evidence grows, posteriors will converge. This suggests that disagreement should be temporary.
     - **Status**: Non-negotiable for those who believe in the power of evidence to bring about agreement. However, it is challenged by the observation of persistent disagreement and by models where convergence is slow or absent (e.g., when agents have very different priors or update on different things).

  ### Key Tensions

  #### Tension 1: Aumann's Agreement vs. Persistent Disagreement
  - **Conflict**: Aumann's theorem says that common prior and common knowledge of posteriors imply agreement. But we observe persistent disagreement. Therefore, one must give up either the common prior, or the idea that the posteriors are common knowledge, or accept that the disagreeing agents are irrational.
  - **Resolution Attempts**:
    - Reject CPA: Agents have different priors, so they can rationally disagree even with common knowledge of posteriors.
    - Reject common knowledge: Agents never achieve common knowledge of each other's beliefs (e.g., due to higher-order uncertainty). This allows for disagreement even with a common prior.
    - Accept irrationality: The disagreeing agents are not rational.

  #### Tension 2: No-Trade Theorem vs. Speculative Trade
  - **Conflict**: The no-trade theorem says that under CPA and common knowledge of posteriors, no trade should occur. But we observe speculative trade (e.g., in financial markets). Therefore, either CPA fails, or common knowledge fails, or the traders are irrational.
  - **Resolution Attempts**:
    - Reject CPA: Traders have different priors, so they can both expect gains from trade.
    - Reject common knowledge: Traders do not have common knowledge of each other's beliefs.

  #### Tension 3: Explanation by Information vs. Permissible Priors
  - **Conflict**: If we allow for multiple rationally permissible priors, then we can explain persistent disagreement without irrationality. However, this violates the requirement that belief differences must be explained by information differences (because now they are explained by prior differences). Also, if we allow different priors, then we lose the agreement theorem and no-trade theorem.
  - **Resolution Attempts**:
    - Insist on a unique rational prior: Then permissivism is false and disagreement must be due to information differences (or irrationality).
    - Allow permissivism and reject the agreement and no-trade theorems as requirements for rationality.

  #### Tension 4: Washing Out of Priors vs. Persistent Disagreement
  - **Conflict**: The merging-of-opinions theorem suggests that with enough shared evidence, agreement should occur. But we see persistent disagreement in many domains. Therefore, either the agents have not shared enough evidence, or their priors are too extreme (and not absolutely continuous), or they are irrational.
  - **Resolution Attempts**:
    - Argue that in practice, agents never share enough evidence to force agreement because the world is complex and evidence is ambiguous.
    - Argue that some disagreements are due to non-overlapping priors (e.g., in religion) that are not absolutely continuous.

  ### The Key Requirement that Rules Out Standard Positions

  The requirement that does the most work in ruling out standard positions is **Aumann's Agreement Theorem (Desideratum 1)**. It forces a choice: to retain the theorem, one must accept that rational agents with a common prior and common knowledge of posteriors will agree. Therefore, any account that wants to allow for stable rational disagreement must reject either the common prior or the common knowledge of posteriors. This requirement is non-negotiable for the pro-CPA camp, and it is the cornerstone of their argument that disagreement must be due to differences in information. For the anti-CPA camp, rejecting the common prior is the way out.

  ### Subsets of Desiderata that Cannot be Jointly Satisfied

  - **Set 1**: {Agreement Theorem, Common Prior (normative), Common Knowledge of Posteriors, Persistent Disagreement (accommodated without irrationality)} 
    - **Conflict**: The agreement theorem and the common prior (with common knowledge) force agreement. But persistent disagreement occurs. If we want to accommodate persistent disagreement without attributing irrationality, we must drop either the common prior or common knowledge.

  - **Set 2**: {No-Trade Theorem, Common Prior (normative), Common Knowledge of Posteriors, Occurrence of Speculative Trade} 
    - **Conflict**: The no-trade theorem says no trade should occur, but we observe trade. Therefore, we must drop either the common prior or common knowledge.

  - **Set 3**: {Explanation of Belief Differences by Information, Permissibility of Multiple Rational Priors, Accommodation of Persistent Disagreement} 
    - **Conflict**: If we allow multiple rational priors, then we can have persistent disagreement even without differences in information. But this violates the requirement that differences in belief must be explained by differences in information.

  - **Set 4**: {Washing Out of Priors, Persistent Disagreement} 
    - **Conflict**: Washing out requires that with enough evidence, agreement should occur. But persistent disagreement exists. So either washing out does not occur (because of extreme priors or insufficient evidence) or the disagreement is not rational.

  ### Conclusion

  The common prior assumption is at the heart of these tensions. It is a powerful tool for achieving agreement and no-trade results, but it is challenged by the reality of persistent disagreement and speculative trade. The key requirement that forces a hard choice is Aumann's agreement theorem. To allow for rational disagreement, one must reject either the common prior or the common knowledge of posteriors. The former leads to permissivism about priors, and the latter requires an account of how common knowledge fails in practice.

  An adequate theory must either:
  1. Defend the common prior and explain away persistent disagreement as due to lack of common knowledge or irrationality, or
  2. Reject the common prior and provide an account of how rational agents can have different priors and still be rational, while also explaining why disagreement persists and why trade occurs.

  In either case, the theory must engage with the empirical reality of disagreement and the normative ideals of rationality.
answer: |-
  ### Desiderata for a Theory of Common Priors and Rational Disagreement

  An adequate theory must address the following pressures. Each desideratum is derived from a specific case, result, or argument. **Non-negotiable** desiderata are treated as essential by specific camps; others reflect preferences or empirical constraints. Conflicts arise from logical inconsistencies or empirical demands.

  ---

  #### **1. Agreement under Common Prior and Common Knowledge**  
  **Desideratum**: The theory must explain why agents with a common prior and common knowledge of posteriors cannot disagree stably (per Aumann’s agreement theorem).  
  **Case/Argument**: Aumann (1976) proves that if two agents share a prior and their posteriors for an event are common knowledge, posteriors must be equal. Rejecting this requires rejecting Bayesian rationality, common knowledge, or the CPA.  
  **Status**: Non-negotiable for *pro-CPA camps* (coherence requirement). Anti-CPA camps reject CPA to avoid this.  
  **Conflict Point**: This conflicts with persistent disagreement (Desideratum 6) unless CPA or common knowledge is abandoned.

  #### **2. Common Prior as a Normative Constraint**  
  **Desideratum**: The theory must justify why a common prior is a requirement for *rationality* (not just modeling).  
  **Case/Argument**: Harsanyi doctrine: Rational agents with identical information should hold identical priors; differences in belief must stem solely from information asymmetry.  
  **Status**: Non-negotiable for *objective Bayesians* (rationality demands unique priors). Opposed by *subjective Bayesians* who view priors as permissibly divergent.  
  **Conflict Point**: Inconsistent with Desideratum 7 (multiple permissible priors) if rationality requires a unique prior.

  #### **3. Common Prior as a Modeling Convention**  
  **Desideratum**: The theory must clarify whether CPA is a useful *simplifying assumption* (not a truth about rationality).  
  **Case/Argument**: Game theory uses CPA to ensure equilibrium concepts (e.g., Nash) are well-defined. Rejecting CPA complicates models but avoids "arbitrary" disagreement.  
  **Status**: Preference for *formal modelers*. Non-negotiable for anti-CPA camps if imposed as a rationality constraint.  
  **Conflict Point**: Clashes with Desideratum 2 if CPA is framed as normative rather than pragmatic.

  #### **4. Common Prior as an Empirical Claim**  
  **Desideratum**: The theory must account for whether real agents *actually* share priors.  
  **Case/Argument**: Experiments show persistent disagreement despite shared evidence (e.g., politics/climate change), suggesting priors diverge empirically.  
  **Status**: Non-negotiable for *descriptive accounts*. Pro-CPA camps explain this away via irrationality or incomplete information.  
  **Conflict Point**: Contradicts Desideratum 1 if disagreement persists with common knowledge of posteriors.

  #### **5. Belief Differences Explained by Information**  
  **Desideratum**: The theory must ensure differences in belief are traceable to differences in *information access* (not priors), absent irrationality.  
  **Case/Argument**: The "no arbitrage" view: If priors diverge, agents could be "Dutch-booked" or engage in exploitative trade.  
  **Status**: Non-negotiable for *pro-CPA camps*. Anti-CPA camps reject this to explain persistent disagreement.  
  **Conflict Point**: Incompatible with Desideratum 8 (disagreement persists with shared evidence) if information gaps close.

  #### **6. No-Trade Theorem and Speculative Trade**  
  **Desideratum**: The theory must resolve why speculative trade occurs despite the no-trade theorem (agents with CPA and common knowledge of beliefs cannot profitably trade).  
  **Case/Argument**: Milgrom-Stokey (1982): Trade implies asymmetric information or divergent priors. If CPA holds, trade signals irrationality or non-common knowledge.  
  **Status**: Non-negotiable for *pro-CPA camps* (trade must be irrational). Anti-CPA camps cite trade as evidence against CPA.  
  **Conflict Point**: Directly conflicts with empirical trade (Desideratum 4) if CPA is assumed.

  #### **7. Permissible Priors: Shared but Not Unique**  
  **Desideratum**: The theory must specify if a shared prior must be the *only* rational prior, or if multiple priors are permissible if commonly held.  
  **Case/Argument**: Permissivism: Rationality allows multiple priors (e.g., due to ambiguous evidence), but disagreement still requires explanation.  
  **Status**: Preference for *moderate subjectivists*. Non-negotiable for *objective Bayesians* if uniqueness is required.  
  **Conflict Point**: Undermines Desideratum 5 (belief differences from information) if priors permissibly diverge.

  #### **8. Persistent Disagreement with Shared Evidence**  
  **Desideratum**: The theory must explain why disagreement endures despite accumulating shared evidence.  
  **Case/Argument**: Real-world polarization (e.g., ideological disputes) persists after evidence exchange. Any account must either:  
  - **Explain away**: Attribute to irrationality, biased updating, or non-common knowledge.  
  - **Accommodate**: Allow rational agents to disagree stably.  
  **Status**: Non-negotiable for *descriptively accurate accounts*.  
  **Conflict Point**: Contradicts Desideratum 9 (washing out) and Desideratum 1 (agreement theorem).

  #### **9. Washing Out of Priors**  
  **Desideratum**: The theory must clarify if beliefs *converge* with increasing shared evidence.  
  **Case/Argument**: Merging-of-opinions theorems: Under mild conditions (e.g., priors absolutely continuous), posteriors converge as evidence grows.  
  **Status**: Non-negotiable for *convergence rationalists*. Rejected by *persistent disagreement* camps.  
  **Conflict Point**: Inconsistent with Desideratum 8 if disagreement persists indefinitely.

  ---

  ### **Key Tensions and Inconsistent Subsets**  
  - **Aumann’s Agreement vs. Persistent Disagreement (1 + 8)**:  
    Aumann’s theorem requires agreement under CPA and common knowledge of posteriors. Yet persistent disagreement exists.  
    - **Resolution**: Reject CPA (allowing divergent priors), reject common knowledge (e.g., due to bounded rationality), or deem agents irrational.  
    - **Inconsistency**: Desiderata 1, 4, and 8 cannot jointly hold. CPA proponents sacrifice 8 (explain away disagreement); opponents sacrifice 1.  

  - **No-Trade Theorem vs. Speculative Trade (6 + 4)**:  
    The no-trade theorem forbids rational speculative trade under CPA and common knowledge. Real trade occurs.  
    - **Resolution**: Abandon CPA (allowing trade from prior divergence) or deny common knowledge.  
    - **Inconsistency**: Desiderata 4 and 6 conflict if CPA is empirical; 6 is abandoned by anti-CPA camps.  

  - **Belief Differences from Information vs. Persistent Disagreement (5 + 8 + 9)**:  
    If belief differences require information asymmetry (5), shared evidence should eliminate disagreement (9). Persistent disagreement (8) challenges this.  
    - **Resolution**: Reject 5 (allow divergent priors), reject 9 (deny washing out), or attribute 8 to irrationality.  
    - **Inconsistency**: Subset {5, 8, 9} is inconsistent without auxiliary assumptions (e.g., biased updating).  

  - **Normative CPA vs. Permissible Priors (2 + 7)**:  
    If CPA is normative (2), priors must be shared *and* unique. Permissivism (7) allows multiple rational priors.  
    - **Resolution**: Deny permissivism (objective Bayesians) or reframe CPA as a modeling tool (sacrificing 2).  
    - **Inconsistency**: Desiderata 2 and 7 conflict if "rational" priors are non-unique but must be shared.  

  ---

  ### **The Core Tension: Aumann’s Theorem as the Linchpin**  
  Desideratum **1 (Agreement under Common Prior and Common Knowledge)** does the most work in ruling out positions:  
  - It forces pro-CPA camps to reject persistent disagreement as irrational or deny common knowledge.  
  - It forces anti-CPA camps to reject CPA or common knowledge to accommodate rational disagreement.  
  - **Conflict with Desideratum 8 (Persistent Disagreement)**: This is the central tension. Aumann’s theorem + common knowledge + CPA implies agreement. Persistent disagreement implies at least one must be false. No theory can satisfy all four: {1, 4 (CPA empirical), 8, common knowledge}.  

  ### **Synthesis**  
  An adequate theory must choose which desiderata to prioritize:  
  - **Pro-CPA**: Sacrifice 4 and 8 (disagreement is irrational/non-common knowledge) to preserve 1, 5, and 6.  
  - **Anti-CPA**: Sacrifice 1, 5, and 6 (allow divergent priors, trade, and non-informational disagreement) to preserve 4 and 8.  
  - **Hybrid**: Reject common knowledge (e.g., via bounded rationality) to preserve CPA while accommodating 4 and 8 partially.  

  The tension between Aumann’s theorem and persistent disagreement is irreconcilable without compromising one. The choice defines the camp.
