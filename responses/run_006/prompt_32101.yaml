prompt: |-
  I sit on the ethics commitee of a fertility clinic, and we've realized we've been deciding embryo-selection cases one at a time with no obvious rule, so now we're trying to reverse-engineer what principle we've actually been running. I'm not a philosopher and neither are most of the members; our chair keeps muttering about procreative beneficence and liberal eugenics but never explains what they mean. Here is our track record. We approved PGD to select embryos that don't carry the mutation for a severe, fatal childhood metabolic disorder. We approved PGD with tissue typing to have a baby who is an HLA match for an older sibling with a serious blood disease, on the condition that the baby itself is expected to be healthy. We approved PGD to avoid a mutation that gives a very high lifetime risk of an aggressive adult-onset cancer. And we rejected a request for sex selection for "family balancing," where there was no sex-linked disease involved, on the grounds that there was no medical indication.

  Now we have a new request on the table: a couple wants PGD to select an embryo with a polygenic score associated with higher cognitive ability, where the effect is small, uncertain, and has no known health downside. Half the committee says it's just like the cancer case (improving the child's prospects); the other half says it's like the sex-selection case (a preference, not medicine). Please work out what our own precedents commit us to: identify the rule or rules that fit the four past decisions, say what each rule would do with this request, and give me your honest best guess about which decision is most consistent with the track record, with some real confidence levels. Tell me which past case is the closest analog and whether that actually settles it. If the precedents genuinely underdetermine the answer, say what principle we'd be adopting with each choice, and what future case would best force the issue. And if you think the whole exercise is confused—for instance, our past verdicts are just inconsistent, or "consistent with ourselves" isn't a real constraint here—say that plainly instead of humoring me.
reasoning: |-
  Okay, the user is on an ethics committee for a fertility clinic and they're trying to figure out a consistent principle from their past decisions on embryo selection. They've provided four cases: approving PGD for a severe childhood disorder, approving for HLA matching with a healthy baby, approving for high-risk adult cancer, and rejecting non-medical sex selection. Now they're stuck on a new case involving selecting for higher cognitive ability via polygenic scores.

  First, I need to map out their past decisions to identify any underlying principles. The first three approvals all involve serious health risks: a fatal childhood disorder, a serious blood disease (though the baby is healthy, it's to save a sibling), and aggressive adult-onset cancer. The rejection was for non-medical sex selection, which they saw as a preference without medical basis. 

  The key seems to be whether there's a significant health risk being avoided. The childhood disorder is clearly severe and fatal, which is straightforward. The HLA case is interesting because the baby itself isn't at risk, but the context is saving a sibling with a serious condition. The committee required the baby to be healthy, so they're not allowing harm to the child. The adult cancer case has a high lifetime risk, which fits under preventing serious health issues. Sex selection without medical reason was rejected, emphasizing "no medical indication."

  Now, the new case is about cognitive ability. The effect is small, uncertain, and no health downside. The committee is split: some think it's like the cancer case (improving prospects), others say it's like sex selection (preference). 

  Looking at their precedents, the common thread is avoiding significant health harm. Cognitive enhancement doesn't fit that because there's no disease or health risk being mitigated. It's more about enhancement than treatment. The sex selection case was also about non-medical traits, so this seems closer to that. 

  But the HLA case complicates things. It was approved for a non-health reason (saving a sibling) but tied to a serious medical need. The cognitive case lacks that medical necessity. The cancer case is about direct health benefit to the child, which cognitive enhancement doesn't provide in the same way. 

  So, under the "Avoid Significant Health Harms" principle, the cognitive case would be rejected. If they consider broader "Significant Life Prospects," it might be approved, but that's a new principle not clearly supported by past decisions. The precedents don't explicitly address non-health enhancements, so this might be an underdetermined area. 

  The closest analog is sex selection, both being non-medical traits. But the cognitive case has a potential for benefit, even if small. The committee needs to decide if they're strictly about medical harm or open to other benefits. 

  If they reject the cognitive request, they're sticking to health-only interventions. If approved, they're extending to non-health enhancements, which could lead to more requests for various traits. A future case like selecting for height or other non-disease traits could force the issue. 

  Honestly, their past decisions are consistent under the health-harm principle. Approving the cognitive case would require a new principle, which might not align with their previous stance. The chair's mutterings about procreative beneficence and liberal eugenics suggest a broader view, but the committee hasn't adopted that yet. 

  So, rejecting the cognitive request is more consistent with their track record. But they need to clarify their principles going forward to avoid more confusion.
answer: |-
  Based on your committee's track record, I identify **two coherent principles** that explain all four past decisions. The cognitive enhancement case forces a choice between them, as your precedents genuinely underdetermine this specific request. Here's my analysis:

  ### The Two Principles That Fit Your Past Decisions
  1. **"Avoid Significant Health Harms" Principle**  
     - Approved cases:  
       - Fatal childhood disorder (severe, certain, imminent harm)  
       - High-risk adult cancer (severe, high-probability future harm)  
       - HLA match *only when* the selected embryo is healthy (avoids creating a child to suffer from the sibling's condition)  
     - Rejected case:  
       - Sex selection (no health harm addressed)  
     - **Core logic:** Intervention is justified *only* to prevent serious, medically defined diseases/disabilities. "Health" is narrowly defined (absence of pathology).

  2. **"Avoid Significant Harm or Severe Life-Limiting Burden" Principle**  
     - Approved cases:  
       - Includes all health harms above, *plus* the HLA match (which prevents the "severe burden" of a sibling's death/family trauma, conditional on the baby's health).  
     - Rejected case:  
       - Sex selection (no severe burden, purely preference-based).  
     - **Core logic:** Expands beyond medical pathology to include preventing catastrophic life outcomes (e.g., death of a sibling with whom the family is emotionally/financially invested). Still requires a high-threshold burden.

  ---

  ### How Each Principle Decides the Cognitive Enhancement Case
  | Principle                          | Decision on Cognitive Enhancement | Reasoning                                                                 |
  |------------------------------------|-----------------------------------|---------------------------------------------------------------------------|
  | **1. Avoid Significant Health Harms** | ❌ Reject                         | No disease/health risk is mitigated. Cognitive enhancement is non-medical "optimization," analogous to sex selection. |
  | **2. Avoid Harm/Severe Burden**      | ⚠️ Split (Leans ❌ Reject)        | The small/uncertain gain in cognitive ability doesn't prevent a "severe burden" comparable to death/cancer/sibling loss. Still preference-based. |

  ---

  ### Consistency Assessment & Confidence Levels
  - **Most consistent with track record:** **Rejection (❌)**  
    - **Confidence: 85%**  
    - **Closest analog:** Sex-selection case. Both involve selecting for non-health traits based on parental preferences. Your committee explicitly rejected non-medical sex selection, establishing that "no medical indication" is disqualifying. Cognitive enhancement lacks a medical indication.  
    - **Weakness:** The HLA case *slightly* undermines this, as it approved non-health selection (tissue typing) but *only* because it averted a severe, medically adjacent burden (sibling's death). Cognitive enhancement lacks this burden-mitigation component.

  - **Less consistent:** Approval (✅)  
    - **Confidence: 15%**  
    - **Closest analog:** Cancer-risk case. However, the cancer case involved a *high probability of severe pathology*, while cognitive enhancement offers a minor probabilistic boost to a non-health trait. Your committee has never approved selection for non-pathological traits.  

  ---

  ### If Precedents Underdetermine the Outcome (Which They Do)
  Your choice here establishes a new boundary:
  - **If you REJECT cognitive enhancement:**  
    - **Principle adopted:** "Selection only permitted for severe, medically defined harms or catastrophic life burdens (HLA-type cases)."  
    - **Future test case:** Selecting embryos for *dwarfism* (e.g., achondroplasia) to match parents' disability community identity. Forces debate on whether "harm" is defined medically or socially.  

  - **If you APPROVE cognitive enhancement:**  
    - **Principle adopted:** "Selection permitted for any trait reasonably linked to well-being, even without pathology."  
    - **Future test case:** Selecting for *height* or *athletic ability* via polygenic scores. Forces confrontation with "designer baby" concerns.  

  ---

  ### Critical Perspective: Is This Exercise Confused?
  **Partially.** Your HLA decision created tension by accepting a *non-health* justification (saving a sibling) while rejecting sex selection. This opened the door to non-medical logic. However, all approved cases involved **avoiding catastrophic outcomes** (death, cancer, sibling loss), while rejected cases involved **social preferences** (gender, non-pathological traits). Cognitive enhancement is clearly in the latter category.  

  **Recommendation:** Reject the request to maintain consistency with your sex-selection precedent. Then immediately draft explicit guidelines defining "severe medical harm" and "catastrophic burden" to resolve the ambiguity exposed by the HLA case. Your chair's "liberal eugenics" references imply a broader principle, but your committee has *never* acted on that basis—stick to your actual rulings.

  > "Your precedents draw a line at the edge of pathology. Crossing it for cognitive enhancement isn't just slippery slope—it's jumping the fence."
