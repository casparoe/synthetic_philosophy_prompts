answer: |-
  Here are five numbered points isolating the conceptual steps in Pascal's argument:

  1.  **Dual Foundations of Obedience:** Pascal distinguishes between two distinct reasons for obedience: *justice* provides a normative reason (it is "justly followed" because it is right), while *force* provides a causal/effective reason (it is "necessarily followed" because it compels compliance through power).
  2.  **Mutual Deficiency:** Justice alone lacks efficacy ("powerless" - it cannot enforce itself), while force alone lacks legitimacy ("tyrannical" - it commands without rightful authority). This creates a fundamental political problem.
  3.  **Epistemological Asymmetry:** Justice is inherently "subject to dispute" (its content is contested and requires rational agreement, which is elusive), whereas force is "easily recognizable and undisputed" (its presence and effect are empirically obvious and undeniable).
  4.  **Practical Resolution:** Given the disputability of justice (making consensus on *what is just* impossible) and the recognizability of force, humans found it practically impossible ("could not") to imbue agreed-upon justice with the necessary strength. Therefore, the solution was to imbue the undeniable strong *with the label of justice* ("made what is strong just"), transferring legitimacy to power.
  5.  **Normative Hollowing (with Residual Echo):** This move treats justice primarily as a legitimizing label borrowed *by* force to cloak its inherent tyranny, dissolving its independent normative content as a standard for judging power. However, the *concept's* residual normative prestige survives precisely as the necessary tool for this legitimization, revealing the mechanism of political authority rather than justifying it.
