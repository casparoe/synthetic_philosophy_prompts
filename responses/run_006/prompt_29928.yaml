prompt: |-
  Government agencies do cost-benefit analysis for policies with effects far in the future -- climate mitigation, flood defenses, nuclear waste storage -- and they routinely discount future costs and benefits at a steady rate per year, so that a death averted a century from now counts for far less than a death averted today. What theory of the value of future lives does this practice presuppose? In particular, does it commit the agency to pure time preference, the view that a benefit matters less simply because it comes later, or can the discounting be fully explained by economic growth (future people will be richer) and uncertainty (future benefits might not materialize)? Distinguish what the practice strictly presupposes from what it merely fits well with, and say where it's underdetermined such that several different views would license it. Then tell me what specifically in the practice woud have to change if an agency adopted a zero pure rate of time preference, and what could stay the same.
reasoning: |-
  Okay, the user is asking about the theory behind discounting future costs and benefits in government policies. Let me start by recalling the key concepts. Discounting future lives implies a lower value placed on future benefits. The main question is whether this is due to pure time preference or other factors like economic growth and uncertainty.

  First, I need to distinguish what the practice strictly presupposes versus what it's compatible with. Pure time preference means valuing the present more just because it's now. But discounting could also be explained by rising wealth (richer future people value each unit less) or risks (uncertainty about the future). 

  The user wants to know if the practice commits agencies to pure time preference. From what I remember, using a constant discount rate doesn't strictly require pure time preference. It's underdetermined. Different theories can lead to similar discounting. For example, Ramsey's formula includes pure time preference, economic growth, and elasticity. So an agency can justify discounting without endorsing pure time preference by emphasizing growth and uncertainty.

  Then the user asks what changes if an agency adopts zero pure time preference. If delta (δ) is zero, the discount rate would only depend on growth and elasticity. Long-term projects might appear more favorable. Uncertainty might still require some discounting, but the rate would be lower. The practice could keep growth-based discounting but adjust the rate.

  I should mention that the constant rate itself is a simplification. Real agencies might use declining rates for very long terms. Also, distinguishing components in practice is hard; the rate is often set by policy without specifying sources.

  The user's deeper concern might be ethical implications. Discounting future lives might seem unethical. They might want to know if agencies can avoid pure time preference while still discounting. Clarifying that growth and uncertainty can justify it without devaluing future lives ethically is important. Also, explaining how zero pure time preference changes policy outcomes, like favoring long-term environmental projects.
answer: |-
  The practice of using a **constant discount rate** for far-future costs and benefits in government cost-benefit analysis (CBA) **does not strictly presuppose pure time preference (PTP)**. Its theoretical basis is underdetermined, allowing several justifications. Here's a breakdown:

  1.  **What the Practice Strictly Presupposes:**
      *   **Diminishing Marginal Value of Income/Consumption:** A core assumption is that an additional unit of consumption (or the resources needed to avert a death) is worth *less* to richer people than to poorer people. This is fundamental to using *any* positive discount rate based on economic growth.
      *   **Expected Economic Growth:** It presupposes that future generations will, on average, be wealthier than the current generation. This growth drives the "wealth-based" component of discounting.
      *   **Risk Aversion:** The practice inherently incorporates some level of risk aversion, especially concerning the uncertainty of future benefits/costs. A constant rate simplifies this into an expected value calculation with an implicit risk premium.
      *   **Mathematical Tractability & Policy Consistency:** It presupposes the need for a simple, consistent rule applicable across diverse long-term projects, even if imperfect. A constant rate provides this.

  2.  **What the Practice is Compatible With (Fits Well With) but Doesn't Strictly Presuppose:**
      *   **Pure Time Preference (δ > 0):** The practice fits perfectly with the standard Ramsey Rule framework for the Social Discount Rate (SDR): `SDR = δ + η * g`
          *   `δ` (delta) = Pure Rate of Time Preference (utility discount rate)
          *   `η` (eta) = Elasticity of Marginal Utility of Consumption (measures how fast the value of extra consumption declines as wealth increases)
          *   `g` = Expected growth rate of per capita consumption.
      *   **Uncertainty about Future Growth/Existence:** A positive discount rate can be justified by the *probability* that future benefits won't materialize due to catastrophe, technological/societal collapse, or even human extinction. The constant rate can be seen as incorporating an implicit "hazard rate" reflecting these risks.
      *   **Opportunity Cost of Capital:** The rate might be chosen to reflect the societal opportunity cost of diverting resources from other investments (though this is more common for shorter-term projects).

  3.  **Where the Practice is Underdetermined (Multiple Views License It):**
      *   **The Source of the Discount Rate:** A given constant rate `r` could result from multiple combinations:
          *   High `δ` and Low `η*g` (Strong PTP, Weak Growth Effect)
          *   Low `δ` and High `η*g` (Weak PTP, Strong Growth Effect)
          *   Moderate `δ` and Moderate `η*g`
          *   `δ ~ 0` combined with `η*g` and a significant premium for existential risk/uncertainty.
      *   **Ethical Foundations:** The practice is compatible with:
          *   **Utilitarianism with PTP:** Where discounting future utility itself is ethically acceptable.
          *   **Utilitarianism without PTP (δ=0):** Where discounting arises solely from growth (`η*g`) and uncertainty.
          *   **Contractualism/Overlapping Generations:** Discounting based on expected growth and uncertainty can be framed as fair to both current and future, relatively wealthier, generations.
      *   **Treatment of Uncertainty:** The constant rate bundles various uncertainties (growth volatility, catastrophe risk) into a single number. Different underlying models of uncertainty could justify the same rate.

  **Adopting a Zero Pure Rate of Time Preference (δ = 0):**

  If an agency explicitly adopted δ = 0, based on the ethical view that the well-being of future generations should be valued equally to the present, solely because of the passage of time, the practice would change in specific ways:

  *   **What Would Change:**
      1.  **Lower Discount Rate:** The chosen Social Discount Rate (SDR) would decrease. Using the Ramsey Rule: `SDR = 0 + η * g`. Without the δ component, the rate is lower than before (assuming η and g remain unchanged). This makes long-term benefits (like future lives saved through climate mitigation) relatively more valuable in the CBA.
      2.  **Increased Weight on Far-Future Impacts:** Benefits and costs occurring centuries from now would be discounted much less heavily than under a regime with δ > 0. Projects with very long-term payoffs (e.g., nuclear waste management, deep decarbonization, major biodiversity conservation) would appear significantly more favorable.
      3.  **Explicit Justification Shift:** The rationale for discounting would explicitly *exclude* any devaluation simply because a benefit occurs later. Justification would rely solely on:
          *   **Expected Affluence (`η*g`):** Future generations will be richer, so the marginal value of resources used to save a life then is lower than the value of resources used to save a life or provide benefits now.
          *   **Explicit Modeling of Uncertainty/Risk:** Greater emphasis would be placed on quantifying and incorporating specific risks (e.g., catastrophe risk, technological change risk) rather than bundling them into a constant δ-like rate. This might involve using declining discount rates or probabilistic scenarios.
      4.  **(Potential) Sensitivity to η and g:** The chosen SDR becomes more sensitive to debates about the correct value of η (elasticity) and the accuracy of very long-term growth forecasts (`g`).

  *   **What Could Stay the Same:**
      1.  **The Discounting Mechanism Itself:** The agency would still use discounting. Future costs and benefits would still be converted to Present Value equivalents. The mathematical technique remains identical.
      2.  **Basis in Diminishing Marginal Utility:** The core justification related to `η*g` (richer future people value marginal resources less) remains valid and central.
      3.  **Incorporation of Uncertainty:** Uncertainty would still be a major reason for discounting the distant future, though its quantification and integration into the discount rate might become more explicit and differentiated from pure time preference (e.g., using separate risk premiums or probability weights).
      4.  **Focus on Consumption Equivalents:** The fundamental metric would still be the impact on consumption or resources, valuing lives saved through the resources required to save them.
      5.  **Need for a Standardized Rate (Possibly):** While a lower rate, the agency might still choose a single constant rate for policy consistency, provided it was justified solely by `η*g` and an appropriate uncertainty adjustment.

  **In essence:** Adopting δ = 0 changes the *level* and *justification* of the discount rate, leading to stronger support for long-term investments. It eliminates the justification that "later is worse simply because it's later." However, it retains discounting based on expected economic growth (`η*g`) and uncertainty/risk, and the core mechanics of CBA remain intact. The constant rate itself might be maintained, but its numerical value would be lower, and its justification would explicitly reject pure time preference.
