  I need to ensure the refrains clearly distinguish between the two temporal perspectives. The first refrain should express commitment to future good ("I'll choose the greater good when time is due"), while the second shows present surrender ("I take the smaller good that's close at hand"). The tercets should show the reversal happening through proximity alone.

  The poem must stand alone for non-specialists but contain accurate markers for philosophers: synchronic weakness (acting against current judgment) vs. diachronic reversal (changing preferences over time). It shouldn't flatly label this as akrasia but leave the distinction visible. The tone should maintain poetic quality while being philosophically precise - no jargon, but concepts clear through imagery.

  For the villanelle structure: 19 lines, ABA rhyme scheme for first five tercets, concluding quatrain ABAA with both refrains. I'll use iambic pentameter for rhythm. The narrative arc should move from distant planning to present temptation to regret, with the quatrain revealing the unified self.

  Key images: "clockwork" for consistent planning, "shadow" for looming temptation, "distant shore" for future reward. The regret should feel intellectual ("cold regret") to emphasize this isn't just emotional weakness. The final lines must force the refrains together to show identity across time - perhaps using "one mind" to drive home the paradox.
answer: |-
  Here is a villanelle crafted to embody the temporal dynamics of hyperbolic discounting and the puzzle of the "single agent" across time, aiming for both philosophical precision and poetic resonance:

  **The Curve of Choice**

  The future's promise, clear and understood,  
  *I'll choose the greater good when time is due,*  
  This logic stands where contemplation stood.

  I chart the course for lasting gain, as would  
  A prudent mind, the distant prize in view.  
  The future's promise, clear and understood.

  But shadows lengthen as the near one should,  
  Its presence swells, a value fresh and new,  
  *I take the smaller good that's close at hand.*  
  The future's promise, clear and understood,

  Now flickers dim. A different logic could  
  Prevail, where nearness makes the small command.  
  *I take the smaller good that's close at hand.*

  The clockwork plan, so finely wrought and good,  
  Dissolves like mist. I cannot make a stand.  
  *I take the smaller good that's close at hand.*

  The moment passes. What was near now stood  
  As past, and reason regains its command:  
  The future's promise, clear and understood,  
  Returns, but loss is written in the sand.  
  Cold regret blooms: I grasped what I'd withstood.  
  *I take the smaller good that's close at hand*  
  While *choosing greater good when time is due* –  
  One mind, two weights, on this steep curve I land.

  ---

  **How it meets your specifications:**

  1.  **Form as Argument:** The strict villanelle structure, relentlessly alternating and finally forcing together the two refrains, mirrors the inescapable temporal oscillation of preference driven by hyperbolic discounting. The alternation mimics the "steeply bowed discount curve."
  2.  **Refrains:**
      *   **Refrain 1 (A1): "I'll choose the greater good when time is due."** This is the *far-sighted self*, speaking from a distance, committed to the larger, later reward. Its conditional phrasing ("*when* time is due") signals future orientation and planning.
      *   **Refrain 2 (A2): "I take the smaller good that's close at hand."** This is the *near-sighted self*, speaking in the present moment of action, capitulating to the imminent reward. Its active, present-tense verb ("*take*") and immediacy ("*close at hand*") signal the shift.
      *   **Distinction:** Anyone familiar with the problem will recognize Refrain 1 as the planner and Refrain 2 as the impulsive actor. The verbs ("choose" vs. "take") and temporal markers ("when due" vs. "close at hand") make it clear.
  3.  **Narrative Arc & Discounting:**
      *   **Stanzas 1-2:** Establish the distant, rational preference ("clear and understood," "prudent mind").
      *   **Stanza 3:** The shift begins ("shadows lengthen," "presence swells," "value fresh and new") as the smaller reward approaches.
      *   **Stanza 4:** The reversal ("flickers dim," "different logic," "nearness makes the small command").
      *   **Stanza 5:** The capitulation ("Dissolves like mist," "cannot make a stand").
      *   **Stanza 6:** The post-action return of the original preference ("reason regains its command," "Returns"), leading to regret ("loss is written," "Cold regret blooms").
  4.  **Final Quatrain:** Forces the two refrains together within the same stanza, separated only by the line expressing regret and identity ("One mind, two weights..."). This visually and conceptually demonstrates the paradox: *the same agent* uttered both commitments. The final line explicitly names the "one mind" experiencing the "two weights" on the "steep curve," rejecting the simple reason/desire dualism.
  5.  **Philosophical Precision:**
      *   **Synchronic Weakness:** Captured by the agent *acting* ("I *take*...") against their *current* better judgment (which, at the moment of taking, has been temporarily reversed by proximity – "different logic").
      *   **Diachronic Preference Reversal:** Explicitly shown by the shift *over time*: planning the larger later, taking the smaller sooner, then *regretting* the choice and *preferring the larger later again* ("Returns," "Cold regret," "grasped what I'd withstood").
      *   **Hyperbolic Discounting:** The core mechanism is described through the shift in value based solely on temporal proximity ("nearness makes the small command," "value fresh and new," "steep curve").
      *   **Not Flatly Akrasia:** The poem focuses on the temporal dynamics and the reversal *without* explicitly labeling it "weakness of will." The regret stems from the *reversal itself and the loss*, not necessarily a judgment held *synchronic* with the action (though that element is present too). The emphasis is on the "curve" and the "one mind" holding conflicting evaluations across time.
  6.  **Stands Alone:** For a reader unfamiliar with the literature, the poem presents a clear narrative of planning, temptation, impulsive action, and regret, driven by the changing perception of value ("distant prize," "close at hand," "value fresh and new," "steep curve"). The conflict and the paradox of the unified self ("One mind, two weights") are central dramatic elements.

  This villanelle uses its inherent structural tension to embody the temporal tension at the heart of this specific case of preference reversal, aiming to meet both your poetic and philosophical goals.
