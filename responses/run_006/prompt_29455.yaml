answer: |-
  ## The Standard's Turn

  True beauty dwells within the beholder's eye,
  No shape inherent in the stone or line,
  Just sentiment that swells, or passes by.
  Yet some discernments rise, and others fall.
  Great works persist, speak clear across the years,
  **True beauty dwells within the beholder's eye,**
  But time selects, dissolving fashion's lie,
  While lesser visions fade in dust and tears.
  Just sentiment that swells, or passes by.

  How find the judge whose word we can apply?
  (They're known, in part, by what they praise and prize!)
  **True beauty dwells within the beholder's eye.**
  With senses honed, where finer shades emerge,
  Through practice deep, comparison's sharp test,
  Just sentiment that swells, or passes by.
  Freed from the blinders prejudice supplies,
  Discernment deepens in the practiced breast,
  **True beauty dwells within the beholder's eye.**

  Though humours vary 'neath a different sky,
  And culture shapes the pleasures we invest,
  Just sentiment that swells, or passes by.

  **True beauty dwells within the beholder's eye,**
  **Yet some discernments rise, and others fall.**
  So seek the joint verdict, clear and high,
  From critics sound, perfected, standing tall:
  Strong sense, fine feeling, practised, freed from all,
  Whose tempered voices reconcile the plea –
  **True beauty dwells within the beholder's eye,**
  **Yet some discernments rise, and others fall.**

  ---

  ### Commentary

  This villanelle employs the form's inherent tension—achieved through the circling repetition of its two refrains—to mirror the central conflict in Hume's "Of the Standard of Taste." The first refrain ("True beauty dwells within the beholder's eye") captures Hume's subjectivist foundation: beauty is a sentiment, not a quality inherent in objects. The second refrain ("Yet some discernments rise, and others fall") asserts his counterpoint: despite subjectivity, not all aesthetic judgments are equal; some possess demonstrable superiority.

  The alternating refrains enact the essay's "circling" argument. Stanzas 2 and 3 incorporate key Humean concepts:
  *   **Test of Time:** "Great works persist, speak clear across the years" (Stanza 2) references Hume's observation that works surviving diverse ages and cultures evidence qualities appealing to shared human sensibilities.
  *   **Circularity Worry:** "They're known, in part, by what they praise and prize!" (Stanza 3) directly addresses the concern that identifying "ideal critics" relies on pre-assumed good taste.
  *   **Refinement through Practice/Comparison:** "With senses honed... Through practice deep, comparison's sharp test" (Stanza 4) reflects Hume's emphasis on how repeated exposure and comparison hone perception, revealing "finer shades."
  *   **Legitimate Differences:** "Though humours vary 'neath a different sky, / And culture shapes the pleasures we invest" (Stanza 5) acknowledges Hume's concession that the standard allows for variations rooted in temperament and cultural context.

  The final quatrain resolves the tension as Hume does, introducing the "joint verdict" of the "ideal critics." The description ("Strong sense, fine feeling, practised, freed from all") compresses Hume's five criteria (strong sense, delicate sentiment, practice, comparison, freedom from prejudice) for clarity within the meter. This joint verdict reconciles the refrains without abandoning either: beauty remains subjective (felt), but judgments are objectively ranked by the discernment of qualified observers.

  **Compression/Interpretation Notes:**
  *   The poem compresses Hume's five criteria for ideal critics into a single descriptive line in the quatrain.
  *   The phrase "perfected, standing tall" in the quatrain is poetic license, implying the *result* of Hume's criteria rather than stating them explicitly again. It leans towards the attainability of the ideal standard Hume implies, without venturing into debates about its perfect accessibility.
  *   The poem implicitly takes the common reading that Hume *does* establish a meaningful, though complex, standard ("the joint verdict... reconcile[s] the plea"), avoiding portraying Hume as either a pure subjectivist or dogmatic objectivist. It accurately reflects the genuine tension and his proposed resolution via the ideal critic.
