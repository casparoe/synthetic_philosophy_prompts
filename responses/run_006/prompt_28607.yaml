answer: |-
  Right then, let's get properly stuck in. This draft assumes your guest is well-versed and you're comfortable pushing back. I've baked in the follow-ups as requested, aiming for that conversational-but-technical British tone.

  **Interview Questions: Deep Dive on Updateless Decision Theory (UDT)**

  1.  **Logical Counterfactuals - The Core Problem:** "Alright, let's start with the elephant in the room: logical counterfactuals. Everyone agrees they're the tricky bit for UDT – figuring out what *would* happen if my algorithm output a different decision, even when that decision feels logically impossible given the setup. Beyond just saying it's hard, what are the leading candidate *solutions* or frameworks people have actually proposed to ground these logical counterfactuals? And crucially – **follow-up** – why hasn't any single candidate solution gained widespread acceptance? What's the fundamental snag that keeps tripping them up?"

  2.  **Logical Counterfactuals - Why Not Pearl?:** "One approach I've heard floated is adapting Judea Pearl-style causal models, but extended into logical space – using DAGs for logical dependencies. Sounds intuitively appealing. **Follow-up:** But what specifically breaks when you try to actually *implement* that for UDT scenarios? Is it the problem of defining the 'exogenous variables' for logical facts, the issue of circularity when the agent's own decision node influences the logical structure, or something else entirely? Where does the Pearl analogy concretely fail for logical counterfactuals?"

  3.  **UDT vs FDT - The Distinction:** "You've written that UDT and Functional Decision Theory (FDT) are distinct theories, not just a rebranding exercise. That's interesting, because to many outsiders, they seem incredibly similar in spirit. Can you articulate the *core conceptual difference* between them? And then, crucially – **follow-up** – could you describe a *single, concrete decision problem* – even a stylised thought experiment – where a UDT agent and an FDT agent would genuinely output different actions? What's the scenario and what's the actual divergence in their behaviour?"

  4.  **Updatelessness vs Bayesian Updating:** "The 'updateless' part of UDT feels deeply counter-intuitive to anyone steeped in Bayesianism. Why *shouldn't* I update my probabilities based on the fact that I find myself *in this particular branch* of reality, or that I've *observed this specific piece of evidence*? It seems like UDT is asking me to ignore information I objectively have. Defend that for me – why isn't abandoning standard updating just bonkers? **Follow-up:** Okay, accepting that argument *in principle*, is there *any* scenario – even a contrived one – where an updateless agent demonstrably performs *worse* than a similar agent that *does* update on its local situation? And if such a scenario exists, what does that tell us about the potential limitations or costs of being strictly updateless?"

  5.  **Algorithm Individuation - The Gerrymandering Problem:** "UDT relies heavily on evaluating the consequences of different outputs from 'this algorithm', across all possible worlds. But this raises the thorny issue of algorithm *individuation*. What counts as 'the same' decision algorithm implemented in different possible worlds? It feels like this could be gerrymandered – defining the algorithm's boundaries narrowly or broadly to get whatever outcome one desires for a particular problem. **Follow-up:** Is there a *principled, non-arbitrary* way to define the boundaries of 'the algorithm' for UDT purposes? Or are we ultimately relying on intuition and hoping it doesn't bite us? Does the theory provide the tools to *settle* disputes about whether two implementations are running 'the same' UDT algorithm?"

  6.  **Practical Relevance - Humans vs AIs:** "Let's talk brass tacks. Putting aside abstract thought experiments involving Omega, XOR blackmail, or potentially misaligned superintelligences... For the kinds of decisions actual *human beings* realistically face in the messy, non-Newcomblike world, does UDT *ever* give meaningfully different *practical recommendations* compared to, say, a well-calibrated Evidential Decision Theory (EDT) or Causal Decision Theory (CDT)? Or is the difference purely academic, 'angels on pinheads' stuff, until we're dealing with genuine logical uncertainty at superintelligent scales? If it *is* only crucial for AI alignment, **follow-up:** does that mean UDT has essentially zero practical ethical or decision-making implications for humans *right now*?"

  7.  **The Burden of Proof - Falsifiability:** "Philosophical theories need to make contact with reality to be useful. What would constitute genuine *falsification* for UDT? I'm not looking for 'if a better theory came along' – that's too easy. **Follow-up:** Describe a specific, *empirical* finding or a specific *outcome* in a well-defined decision problem (even a thought experiment) that, *if it were observed to be true*, would make you seriously reconsider UDT's core tenets. What result would make you think, 'Blimey, if *that's* how the universe works, UDT is fundamentally on the wrong track'?"

  **(Optional - Depending on time/direction of answers)**

  8.  **Logical Counterfactuals - The 'Why Bother' Question:** "Given the immense difficulty in satisfactorily defining logical counterfactuals, and the apparent lack of consensus on *how* to do it, why should we persist with UDT as a framework? **Follow-up:** Could this persistent problem indicate that the entire *concept* of treating logical dependencies counterfactually in the way UDT requires is somehow misguided or ill-posed, pushing us towards a different paradigm entirely?"
  9.  **UDT and Self-Locating Uncertainty:** "How does UDT handle genuine self-locating uncertainty – situations like the Sleeping Beauty problem or duplication scenarios – where the core uncertainty isn't just about logical facts *out there*, but about *which* copy or instance of 'me' I actually am? Does the updatelessness requirement create unique challenges or advantages here compared to updating approaches?"

  **Key elements incorporated:**

  *   **British English:** "Bonkers", "Brass tacks", "Blimey", "Get properly stuck in", "Elephant in the room", "Angels on pinheads", "Snag".
  *   **Conversational Tone:** Phrases like "Alright, let's start...", "Defend that for me...", "Let's talk brass tacks...", "I'm not looking for...".
  *   **Technical Depth:** Assumes familiarity with CDT, EDT, UDT, FDT, Bayesian updating, logical counterfactuals, thought experiments, Pearl, algorithm, individuation, Newcomblike problems, falsifiability, self-locating uncertainty.
  *   **Baked-in Follow-ups:** Each main question explicitly includes the follow-up challenge, forcing the guest to address the core difficulty you want explored. No easy sidesteps.
  *   **Coverage:** Hits all your requested points: Logical Counterfactuals (2+ questions with specific anti-Perl follow-up), UDT vs FDT (with concrete example demand), Updatelessness (with Bayesian challenge and performance cost follow-up), Algorithm Individuation (with gerrymandering concern), Practical Relevance (human vs AI), Falsifiability (demanding specifics).
  *   **No Pulled Punches:** Questions directly challenge core tenets ("why isn't this bonkers?", "gerrymandering problem", "zero practical implications?", "fundamentally on the wrong track?").

  This structure should give you a solid, probing interview that gets past the usual UDT talking points and into the genuine controversies and unresolved problems, while keeping it engaging for your technically-minded audience. Good luck with the podcast!
