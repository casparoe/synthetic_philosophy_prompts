prompt: |-
  I'm giving one seventy-five-minute lecture on Zorn's lemma to second-year mathematics undergraduates who have had a proofs course and one semester of linear algebra, but who have not seen the axiom of choice, transfinite induction, or well-ordering in any formal way. Don't restate the lemma for me; give me the plan for the lecture. I want the order of ideas and the dependency structure: which notions must be in place before the statement can even be understood, and what depends on what among the key contrasts — an upper bound of a chain versus a greatest element, a maximal element versus a maximum. Then choose the single example that should carry the whole lecture, and say what it must have and what it must not have; if you reject the usual vector-space basis example as the carrier, say why and give the replacement. I also want the misconception map: the things my students will assume or confuse — that an upper bound of a chain must lie in the chain, that maximal means greatest or that the lemma yields an upper bound for the whole poset, that the lemma is constructive or just induction in disguise, that chains are countable, that the result is obvious because finite-dimensional vector spaces already have bases, and the status of the empty poset depending on whether the empty chain counts. Say at which point in the sequence each misconception should be headed off rather than corrected afterwards. Finish with one question or five-minute task I can put on the board that would tell me whether they understand what the lemma asserts rather than merely how to state it. And tell me what I should explicitly leave out of this lecture and say I am leaving out.
