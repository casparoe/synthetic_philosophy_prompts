answer: |-
  ### Lecture Plan: Zorn's Lemma for Second-Year Undergraduates  
  **Total Time:** 75 minutes  
  **Prerequisites:** Proofs course, one semester of linear algebra. No prior exposure to axiom of choice, transfinite induction, or well-ordering.  

  #### Core Sequence and Dependency Structure  
  1. **Partial Orders (5 min)**  
     - **Why now?** Essential foundation. Define poset (reflexive, antisymmetric, transitive).  
     - **Examples:** Subsets of a set under inclusion; subspaces of a vector space under inclusion.  
     - **Dependency:** Must be understood before chains/upper bounds.  

  2. **Chains and Upper Bounds (10 min)**  
     - **Why now?** Chains are central to Zorn's Lemma.  
     - **Define:**  
       - Chain: Totally ordered subset (e.g., ∅ ⊆ {1} ⊆ {1,2} in ℘({1,2})).  
       - Upper bound (for a chain): Element **in the poset** ≥ all elements in the chain.  
     - **Key contrast:** Upper bound need **not** be in the chain (e.g., chain of finite subsets of ℕ: {1}, {1,2}, {1,2,3}, ...; upper bound ℕ if in ℘(ℕ), but **no** upper bound in poset of finite subsets).  
     - **Dependency:** Relies on partial orders.  

  3. **Maximal Elements vs. Maximum Elements (10 min)**  
     - **Why now?** Zorn’s Lemma concludes a maximal element exists.  
     - **Define:**  
       - Maximal element: No element is strictly greater (e.g., in poset of *proper* subsets of {1,2}, both {1} and {2} are maximal).  
       - Maximum element: ≥ all elements (unique if it exists).  
     - **Contrast:** Maximal ≠ maximum. Maximal elements are local peaks; maximum is global peak.  
     - **Dependency:** Requires understanding of partial orders.  

  4. **Statement of Zorn’s Lemma (5 min)**  
     - **State formally:** "If a non-empty poset has an upper bound for every chain, then it has a maximal element."  
     - **Emphasize conditions:** (1) Non-emptiness, (2) Upper bounds for **all** chains (including empty chain).  
     - **Dependency:** Requires chains, upper bounds, maximal elements.  

  5. **Central Example: Vector Space Basis (20 min)**  
     - **Why this example?** Connects to linear algebra; tangible and profound.  
     - **Setup:**  
       - Poset: Linearly independent subsets of a vector space V, ordered by inclusion.  
       - Non-emptiness: ∅ is linearly independent.  
     - **Chains and upper bounds:**  
       - Chain C of linearly independent sets → union U is an upper bound.  
       - U is linearly independent (finite linear dependence would occur in one set in C).  
     - **Maximal element:**  
       - Maximal linearly independent set = basis (if it doesn’t span, add a vector → contradiction).  
     - **Why not reject?** It’s ideal: Familiar, highlights chain union (non-constructive), and maximality≠maximum (multiple bases possible). Avoids abstract rings/ideals, which are less accessible.  

  6. **Misconception Map (Addressed Proactively)**  
     - **An upper bound must lie in the chain (false):**  
       - **When:** During "Chains and Upper Bounds" (min 10–15).  
       - **Preempt:** Show chain {1}, {1,2}, ... in ℘(ℕ); upper bound ℕ ∉ chain.  
     - **Maximal element = maximum/greatest element (false):**  
       - **When:** During "Maximal vs. Maximum" (min 15–20).  
       - **Preempt:** Example of proper subsets of {1,2}: {1} maximal but not maximum.  
     - **Zorn’s Lemma gives an upper bound for the whole poset (false):**  
       - **When:** After stating lemma (min 35).  
       - **Preempt:** "Lemma gives maximal elements, not global upper bounds."  
     - **Zorn’s Lemma is constructive/just induction (false):**  
       - **When:** During vector space example (min 40–50).  
       - **Preempt:** "Union over uncountable chains (e.g., basis for ℝ over ℚ) is non-algorithmic."  
     - **Chains are countable (false):**  
       - **When:** During "Chains" (min 10–15).  
       - **Preempt:** Example: ℝ under ≤ is an uncountable chain.  
     - **Result is obvious because finite cases work (false):**  
       - **When:** Motivation (opening) and vector space example (min 40–50).  
       - **Preempt:** "Finite-dimensional bases ≠ infinite-dimensional; no algorithm for ℝ over ℚ."  
     - **Status of the empty poset/chain:**  
       - **When:** Statement of lemma (min 30–35).  
       - **Clarify:** Empty chain requires an upper bound → poset non-empty.  

  7. **Question to Test Understanding (5 min)**  
     - **Put on board:** "Let P be the poset of finite subsets of ℕ, ordered by inclusion. Does Zorn’s Lemma guarantee a maximal element? Why/why not?"  
     - **Expected answer:**  
       - No. P is non-empty, but the chain ∅ ⊆ {0} ⊆ {0,1} ⊆ ... has no upper bound in P (union ℕ is infinite, not in P).  
     - **Why it works:** Tests grasp of upper bounds (must be in poset) and non-triviality of chain condition.  

  8. **Explicit Omissions (Stated at End, 5 min)**  
     - "We are leaving out:  
       - Equivalence to Axiom of Choice/Well-Ordering Theorem.  
       - Transfinite induction and proof of Zorn’s Lemma.  
       - Generalizations (e.g., class-sized posets).  
       - Other applications (e.g., maximal ideals).  
       These are for advanced set theory or algebra courses."  

  ---

  **Timeline Summary:**  
  - 0–5 min: Partial orders.  
  - 5–15 min: Chains and upper bounds (address misconceptions 1, 5).  
  - 15–25 min: Maximal vs. maximum (address misconception 2).  
  - 25–30 min: Statement of Zorn’s Lemma (address misconception 7).  
  - 30–50 min: Vector space basis example (address misconceptions 3, 4, 6).  
  - 50–65 min: Recap and address lingering misconceptions.  
  - 65–70 min: Test question.  
  - 70–75 min: Omissions + wrap-up.  

  **Why This Flows:**  
  - Builds from concrete (orders) to abstract (lemma).  
  - Misconceptions preempted when concepts first arise.  
  - Vector space example unifies all pieces.  
  - Question forces application, not regurgitation.
