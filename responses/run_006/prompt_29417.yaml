  We are teaching Zorn's Lemma to second-year undergraduates with some background in proofs and linear algebra. They have not seen the axiom of choice, transfinite induction, or well-ordering.

  Lecture Plan:

  1. **Motivation and Setup (10 minutes)**
     - Start with a problem they know: every vector space has a basis? They know this for finite-dimensional spaces. But what about infinite-dimensional? Mention that we need a new tool.
     - State that we are going to discuss a powerful tool in set theory: Zorn's Lemma. It is used to prove existence in many areas of mathematics.

  2. **Partial Orders and Chains (15 minutes)**
     - Review partial orders: reflexive, antisymmetric, transitive. Give examples: subsets of a set under inclusion, natural numbers under divisibility, subspaces of a vector space under inclusion.
     - Define chain: a totally ordered subset. Example: in the power set of {1,2,3}, the chain might be ∅ ⊆ {1} ⊆ {1,2} ⊆ {1,2,3}.
     - Define upper bound of a chain: an element that is ≥ every element in the chain. Note: the upper bound might not be in the chain. Example: in the set of finite subsets of natural numbers, the chain of sets {1}, {1,2}, {1,2,3}, ... has an upper bound which is the entire set of natural numbers? But note: the entire set is not finite, so if we are in the poset of finite subsets, then this chain has no upper bound? We must be careful. Actually, we are working in a poset that is given. So if the poset is the finite subsets, then the chain of finite initial segments has no upper bound because there is no finite set containing all natural numbers. This is a good point to note: the upper bound must be in the poset.

  3. **Maximal Elements and Maximum Elements (10 minutes)**
     - Define maximal element: an element such that no other element is strictly greater. Example: in the set of proper subsets of a set, the maximal elements are the subsets missing one element. But note: there might be multiple maximal elements.
     - Contrast with maximum: an element that is ≥ every element. There can be at most one maximum. A maximum is maximal, but not conversely.
     - Emphasize: a maximal element is not necessarily an upper bound for the whole poset.

  4. **Statement of Zorn's Lemma (5 minutes)**
     - Now we can state: If in a non-empty partially ordered set every chain has an upper bound, then the set has at least one maximal element.
     - Note: the non-emptiness condition (we'll come back to the empty chain).

  5. **The Example to Carry the Lecture: Basis of a Vector Space (20 minutes)**
     - Why I choose this: They know linear algebra. They know that finite-dimensional vector spaces have bases. We are going to prove that every vector space has a basis.
     - Why I reject the vector space basis as the sole carrier? Actually, I don't. It is a great example because it is concrete and important. But note: the problem says "if you reject". I don't reject it. However, let me note: sometimes people use the example of ideals in a ring or maximal subtorus, but for this audience, vector spaces are perfect.
     - How to use it:
       - Let V be a vector space over a field.
       - Consider the poset: set of linearly independent subsets of V, ordered by inclusion.
       - Check: non-empty? The empty set is linearly independent, so the poset is non-empty.
       - Chains: Let C be a chain of linearly independent sets. We must show that C has an upper bound. Take the union U of all sets in C. We claim U is linearly independent. Why? If we take a finite linear combination of elements in U that equals zero, then because there are finitely many vectors, they all lie in one set in the chain (by the chain condition). Since that set is linearly independent, the coefficients must be zero. So U is linearly independent. Hence, U is an upper bound for the chain.
       - By Zorn, there is a maximal element: a linearly independent set that is maximal. This is a basis? We must show that it spans. If it didn't, we could add a vector not in the span, and the new set would still be linearly independent, contradicting maximality. So it is a basis.
     - This is a perfect example because it uses the chain condition and the maximal element in a natural way.

  6. **Addressing Misconceptions (15 minutes)**
     - Weave these in throughout the lecture at the appropriate points:
       - **Misconception: An upper bound of a chain must lie in the chain.**
         - When defining upper bounds, emphasize with the example of finite subsets of natural numbers: the chain of initial segments {1}, {1,2}, ... has no upper bound in the poset of finite sets. But if we were in the poset of all subsets, then the union (the set of all natural numbers) is an upper bound and it is not in the chain. So we head this off when defining upper bounds.
       - **Misconception: Maximal means greatest.**
         - When defining maximal elements, give an example: the set {1,2,3} under divisibility? Actually, let's use subsets: let S = { {1}, {2}, {1,2} } ordered by inclusion. Then {1} and {2} are maximal? Actually not: {1,2} is the maximum. Instead, take S = { {1}, {2} } (so no set containing both). Then both are maximal. Also, in the integers under divisibility, the prime numbers are maximal? Actually, no: divisibility is not a good example because every number is divisible by primes. Instead, use the set of all subsets of {1,2} except the whole set. Then the maximal elements are the two-element subsets? But that is not right: if we take the set of proper subsets of {1,2,3}, then the two-element subsets are maximal. Yes. So if we have the poset of subsets of {1,2,3} that are not the whole set, then the maximal elements are the two-element subsets. None of them is the maximum because the whole set is missing. Head this off when contrasting maximal and maximum.
       - **Misconception: The lemma yields an upper bound for the whole poset.**
         - When stating the lemma, emphasize that the upper bound condition is for chains, and the conclusion is a maximal element (which is not necessarily an upper bound for the whole poset). After the statement, restate: we get a maximal element, not an upper bound for the entire set.
       - **Misconception: The lemma is constructive or just induction in disguise.**
         - When motivating, say that Zorn's Lemma is non-constructive and equivalent to the Axiom of Choice. We are not going to build the maximal element step by step because chains can be uncountable. This is where we mention that chains can be uncountable. We can say: "Notice that the chain might be very long, even uncountable, so ordinary induction won't work. We need a new principle." Head this off when discussing the chain condition and the union argument in the vector space example: the union over an arbitrary chain is the key non-constructive step.
       - **Misconception: Chains are countable.**
         - When defining chains, give an example of an uncountable chain: for instance, the real numbers under the usual order. Then, in the vector space example, we take the union over an arbitrary chain. The chain might be uncountable, but we still form the union. Head this off when defining chains and when doing the union in the example.
       - **Misconception: The result is obvious because finite-dimensional vector spaces already have bases.**
         - Motivate the lemma by saying that in infinite dimensions, we don't have an algorithm to pick a basis. The lemma guarantees existence without construction.
       - **Status of the empty poset:**
         - The lemma says the poset must be non-empty. Why? Because the empty chain must have an upper bound? Actually, the condition is that every chain has an upper bound. The empty chain is a chain. What is an upper bound for the empty chain? It's an element that is ≥ every element in the empty chain, which is automatically satisfied by any element. So if the poset is non-empty, then the empty chain has an upper bound (any element). But if the poset is empty, then the empty chain is a chain and it has no upper bound (because there is no element). Therefore, the hypothesis requires that the empty chain has an upper bound, meaning the set must be non-empty. So the lemma includes non-emptiness. Head this off when stating the lemma: we say "non-empty" and then explain that the empty chain condition forces non-emptiness.

  7. **Summary and Connection to Axiom of Choice (5 minutes)**
     - Summarize: Zorn's Lemma is a tool for proving existence of maximal elements when every chain has an upper bound.
     - Mention that it is equivalent to the Axiom of Choice, which says that for any collection of non-empty sets, there is a function that picks one element from each. We are not going to prove the equivalence.

  8. **One Question (5 minutes)**
     - Put on the board: "Consider the set of all intervals [a, b] in the real line where a and b are real numbers and a < b. Order this set by inclusion. Does this poset satisfy the conditions of Zorn's Lemma? If so, what are the maximal elements? If not, why not?"
     - Answer: 
       - The poset is non-empty.
       - Chains: a chain of intervals is a collection of intervals totally ordered by inclusion. The union of such intervals might not be an interval? Actually, if we have a chain of intervals, then they are nested. The union of nested intervals is an interval? Not necessarily: consider the chain [0,1], [0,1/2], [0,1/3], ... then the union is [0,0] which is not an interval? Actually, the union is {0} which is not of the form [a,b] with a<b. So the union is not in the poset. Therefore, the chain does not have an upper bound in the poset. Hence, Zorn's lemma does not apply. The maximal elements: actually, there are no maximal elements because for any interval [a,b], we can take [a, (b+a)/2] which is properly contained? No: that's larger? We want a smaller interval? Actually, by inclusion, [a,b] contains [a, (b+a)/2]? No: [a, (b+a)/2] is a subset of [a,b]. But we want to show that [a,b] is not maximal? We can take an interval that is a superset? But the ordering is by inclusion, so we want supersets? Let me clarify: 
         - Order by inclusion: so A ≤ B if A ⊆ B? Then [0,1] ⊆ [0,2] so [0,1] ≤ [0,2]. Then [0,2] is greater. To get an element strictly greater than [a,b], we need an interval that contains [a,b] but is not equal. But we can always take [a-1, b+1]. So actually, there are no maximal elements because any interval is contained in a bigger one. 
       - So two reasons: 
         1. There are no maximal elements. 
         2. The condition of Zorn's lemma fails: the chain [n, n+1] for n=1,2,3,... is not totally ordered? Actually, they are not nested. We need a chain. Take instead the chain: [0,1], [0,2], [0,3], ... then the union is [0, ∞) which is not of the form [a,b] (since it's unbounded). So the chain has no upper bound. 
       - Therefore, Zorn's lemma does not apply. 

  9. **What to Leave Out**
     - Explicitly say: We are not covering the equivalence to the Axiom of Choice. We are not proving Zorn's Lemma. We are not discussing transfinite induction or well-ordering. We are not going into other applications (like existence of maximal ideals) because of time.

