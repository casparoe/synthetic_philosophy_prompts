  First, I recall that this is a well-known issue in fairness literature. The key concepts here are the three fairness metrics: equal FPR (related to specificity), equal FNR (related to sensitivity), and calibration (predictive parity). The theorem that shows these can't coexist with different base rates is called the impossibility theorem of fairness. I should mention the main contributors like Jon Kleinberg, Sendhil Mullainathan, and Cynthia Dwork.

