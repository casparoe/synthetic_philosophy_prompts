prompt: |-
  I am a novelist, and I keep writing characters into a particular kind of intellectual predicament that I suspect has a name in philosophy, though I have not been able to find it. I would be grateful if you could identify the nearest established concept, or tell me if none fits and help me delineate what is distinctive about it.

  Here is the pattern. A character works through a difficult question — say, whether to leave a marriage, or whether a political commitment they have held for years is mistaken — and arrives at a conclusion after careful, sincere reasoning. They can articulate their steps; the argument feels solid to them. Then they acquire a piece of information that does not directly bear on the question itself but bears on their capacity to answer it. Perhaps they learn that they have been sleeping four hours a night for a fortnight and that sleep deprivation of that severity sharply degrades judgement about precisely the kind of emotionally freighted decision they are facing. Or they learn that almost everyone who reasons in the style they used — weighing pros and cons in a certain systematic way, say — gets this particular kind of question wrong, even though no one can point to a specific flaw in the reasoning. The character now faces a conflict. Their first-order reasoning still looks sound to them; they cannot locate an error in it. But they have what feels like excellent reason to distrust the output of that reasoning. They are stuck: they cannot simply set aside their conclusion, because it still seems right, but they cannot comfortably endorse it either, because they no longer trust the machinery that produced it.

  I am not asking about ordinary self-doubt or a failure of nerve. The distinctive thing is that the character has specific, credible evidence about the unreliability of their cognitive process on this occasion, and yet the process itself continues to strike them as sound from the inside. The two levels of assessment — the object-level argument and the evidence about the arguer — point in opposite directions, and there is no obvious way to weigh one against the other.

  I have come across the phrase "epistemic peer disagreement" in my reading, but that seems to be about two different people disagreeing, whereas here the conflict is internal: the character is divided against their own reasoning. I have also seen "higher-order evidence" mentioned, but that seems to label the type of evidence rather than the predicament itself. Does this state of being caught between one's own reasoning and one's reasons to distrust that reasoning have an established name in epistemology? If no term captures it exactly, I would be grateful for an account of what the nearest concepts are, how my cases differ from them, and what you would propose to call this thing — the name matters less to me than getting the boundaries right.

  Please write your answer in British English.
reasoning: |-
  Okay, the user is a novelist struggling to name a specific intellectual predicament their characters face. They've described a scenario where a character reasons carefully to a conclusion but then receives meta-evidence undermining their own capacity to judge - like learning they're sleep-deprived during the decision, or that their reasoning method is statistically unreliable. The core tension is between first-order reasoning that still feels valid and higher-order evidence that discredits the reasoning process itself.

  Hmm, the user explicitly mentions having researched "epistemic peer disagreement" and "higher-order evidence" but finds them inadequate - correctly noting the former involves interpersonal conflict while the latter is merely evidence classification. They're clearly philosophically literate, so the response should engage at that level while avoiding jargon overload. Their real need seems to be precision in conceptual mapping: whether an established term exists, and if not, how to delineate this psychological-epistemic hybrid.

  Right, let's unpack the philosophical anchors. The clearest fit is indeed higher-order evidence (HOE) theory, particularly David Christensen's work on how rational agents should respond to evidence about their own cognitive limitations. But as the user senses, HOE is the evidence type, not the predicament. The state itself is what philosophers call "epistemic akrasia" - the position where one believes P while simultaneously believing one shouldn't believe P. That captures the self-division aspect perfectly.

  But wait - the user's cases add nuance. Their characters don't just have conflicting beliefs; they're paralyzed because the HOE doesn't invalidate specific premises yet still demands distrust. This intersects with "defeater" epistemology (John Pollock), where HOE acts as an undercutting defeater - it doesn't rebut the conclusion but severs the justification link. Yet the character still feels the conclusion's pull, creating what Miriam Schoenfield terms "rational tension."

  The novelist might also appreciate connecting this to psychological concepts like metacognition (Flavell) or cognitive dissonance (Festinger), though the latter lacks the epistemic rigor. For naming, "epistemic self-distrust" is descriptive but vague; "HOE-induced rational tension" is precise but clunky. Perhaps "Christensen's dilemma" after the key philosopher, though that might be obscure.

  Crucially, the user wants to distinguish this from ordinary self-doubt. The response should emphasise the specificity: credible external indicators of unreliability (sleep studies, statistical failure rates) that target the process, not the conclusion. That's what makes it a philosophical problem rather than mere anxiety.

  For British English: "undermined" over "undercut", "fortnight", "distrust" as verb/noun. Avoid Americanisms like "gaslighting" or "second-guessing". Use "whilst" sparingly.
answer: |-
  What you're describing is a brilliantly precise epistemic dilemma that sits at the intersection of several philosophical concepts, primarily revolving around **Higher-Order Evidence (HOE)**. While there isn't a single, universally agreed-upon *name* for the exact *predicament* of being caught in this specific tension, it's a well-recognised phenomenon in contemporary epistemology. Here's a breakdown of the nearest concepts and how your scenario fits within (and sometimes pushes against) them:

  1.  **Higher-Order Evidence (HOE):**
      *   **Definition:** Evidence that bears not on the first-order question itself (e.g., "Is leaving my marriage the right choice?") but on the *reliability* or *rationality* of the process, agent, or evidence used to form a belief *about* that first-order question. Learning about sleep deprivation's effects or the systematic unreliability of one's reasoning style is quintessential HOE.
      *   **Relation to Your Scenario:** This is the *type* of evidence you identified, and it's the crucial catalyst for the predicament. Your character acquires compelling HOE that undermines their trust in their own cognitive faculties or reasoning process *as applied to this specific case*.
      *   **Distinction:** HOE is the *evidence category*. The *predicament* is the resulting state of conflict *caused by* this evidence.

  2.  **The Problem of Epistemic Akrasia (or Epistemic Dilemma/Conflict):**
      *   **Definition:** Akrasia (generally: weakness of will) applied to belief. It occurs when an agent believes something they simultaneously believe they *shouldn't* believe, or vice-versa. It's a state of believing against one's own best judgment about what one should believe.
      *   **Relation to Your Scenario:** This is the *closest match for the predicament itself*. Your character is in a state of epistemic akrasia: they (perhaps implicitly) believe they *should not* trust their first-order conclusion (based on the HOE), yet they *still find themselves believing* that conclusion because their first-order reasoning seems unimpeachable "from the inside." They are believing P (the conclusion) whilst believing they rationally ought not to believe P.
      *   **Distinction:** Standard discussions of epistemic akrasia often involve simpler conflicts (e.g., believing P while believing the evidence supports not-P). Your scenario adds a specific layer: the conflict arises *not* from counter-evidence *to P*, but from evidence *about the unreliability of the process that produced the belief in P*. The akrasia is induced by HOE.

  3.  **Defeaters (Specifically, Undercutting Defeaters):**
      *   **Definition:** In epistemology, a defeater is evidence that undermines the justification for a belief. An *undercutting* defeater doesn't provide evidence against the belief itself (like a rebutting defeater would) but attacks the connection between the original evidence/reasoning and the conclusion. It shows the original evidence/reasoning is unreliable *in this instance*.
      *   **Relation to Your Scenario:** The HOE (sleep deprivation stats, reasoning-style failure rates) functions as a powerful *undercutting defeater*. It doesn't show the *conclusion* is wrong; it attacks the *justification* for believing the conclusion by undermining the reliability of the cognitive process that produced it.
      *   **Distinction:** The *predicament* arises because the undercutting defeater is recognised, yet the first-order reasoning *still seems compelling and sound* to the agent. They cannot "unsee" the validity of their reasoning steps, even while acknowledging the defeater. This creates the akratic tension.

  4.  **Rational Dilemma / Rational Tension:**
      *   **Definition:** A situation where an agent faces conflicting rational requirements with no clear way to resolve the conflict that satisfies all requirements. There's a tension between what different epistemic norms demand.
      *   **Relation to Your Scenario:** The character feels rationally compelled to endorse their first-order conclusion (it seems correct based on the reasoning). Simultaneously, they feel rationally compelled to distrust that conclusion based on the HOE. There's no simple, rational algorithm for how much weight to give the HOE versus the seeming self-evidence of the first-order reasoning. They are rationally stuck.
      *   **Distinction:** This is a broader category, but your scenario presents a very specific type of rational tension *caused by HOE-induced epistemic akrasia*.

  **Synthesising the Concepts & Naming the Predicament:**

  Your character's state is most accurately described as experiencing **Epistemic Akrasia Induced by Higher-Order Evidence**, or more specifically, an **HOE-Driven Rational Tension**. It's the state of being rationally compelled (by the seeming soundness of first-order reasoning) to believe P, while simultaneously being rationally compelled (by credible HOE acting as an undercutting defeater) to believe that one should not believe P.

  **Why it's Distinct:**

  *   **Beyond Ordinary Self-Doubt:** As you note, it's not vague doubt. It's a targeted conflict arising from *specific, external evidence about process unreliability*, not just internal anxiety or lack of confidence. The first-order reasoning *still feels cogent*.
  *   **Beyond Peer Disagreement:** It's intra-personal, not inter-personal. The conflict is within the agent's own assessment of their reasoning and their assessment of their capacity to reason.
  *   **Core of the Predicament:** The unique, paralysing element is the *persistence of the first-order conviction* despite recognising the HOE. The character *cannot find a flaw* in their reasoning steps; the HOE attacks the *faculty* or *method* itself, not the specific argument's logic. This creates a genuine impasse.

  **Proposed Names & Description:**

  *   **Most Precise Philosophical Label:** **HOE-Induced Epistemic Akrasia.**
  *   **Descriptive Term for Literary Use:** **The Reliability Trap** or **The Metacognitive Bind**.
  *   **Core Description:** *A state of rational paralysis arising when credible Higher-Order Evidence (indicating the unreliability of one's own cognitive process on a specific occasion) undermines justification for a first-order conclusion, while that conclusion continues to appear subjectively compelling and logically sound based on the agent's internal assessment of the reasoning itself, creating an unresolved conflict between levels of epistemic evaluation.*

  This predicament powerfully explores the fragility and complexity of human reasoning, highlighting how rational confidence can be subverted not by flaws we can see in our arguments, but by vulnerabilities in the very mind constructing them. It's a rich vein for fiction, touching on themes of self-trust, the limits of introspection, and the sometimes unbridgeable gap between subjective certainty and objective reliability.
