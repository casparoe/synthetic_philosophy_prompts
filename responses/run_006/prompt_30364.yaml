prompt: |-
  I have been collecting my own reactions to particular cases about promising, and I want to know whether any one principle can deliver them, or which of my reactions have to be revised. The cases:

  1. A dying friend asks me to keep an eye on his elderly mother after he is gone. I agree. He dies a few hours later; he had no alternative arrangements to make, his mother never learns of the promise, and no one would ever know whether I kept it. I think I am still fully bound.

  2. A creditor obtains my signature on a promissory note by threatening to break my legs. I do not think I owe the money.

  3. A colleague asks me to read her manuscript by Friday. I say yes while privately intending not to. I think the insincere yes still binds me to read it, and the insincerity is a separate wrong on top of the breach if I don't.

  4. A friend asks me to water his plants while he is abroad; because I say yes, he arranges no other care. I clearly owe it.

  5. I promise a neighbor I will return his ladder. He immediately forgets the conversation, and no one else knows I have it. I think I still owe it, though the failure would feel slightly less serious than in case 4.

  6. On New Year's I promise myself to exercise three times a week. I do not think I wrong anyone when I skip; whatever this is, it is not the same kind of obligation as the others.

  7. I promise a child I will come to her birthday party. A work emergency then makes it impossible to come without serious professional harm. I think I may break the promise, but I owe her an apology and an honest explanation rather than a brush-off.

  8. I promise to help a friend move. She then wins a lottery, hires movers, and tells me not to bother. I think I am released.

  9. I promise a friend to keep secret that he is having an affair. I then learn his partner is about to marry him and pool finances without knowing. I think the promise is overridden: I may tell, though I should first give him the chance to tell her himself.

  10. I promise someone I will meet them in Paris tomorrow, but I am in another country with no passport and no way to get there. I do not think I owe the impossible act, though I may owe an apology and an explanation.

  The two verdicts that worry me are 1 and 3. Verdict 1 seems to show that the obligation does not depend on the promisee's continuing expectation or reliance: my friend is dead and can no longer be disappointed. Verdict 3 seems to show that the obligation does not depend on my actual intention or will: what matters is what I led my colleague to expect. Together they seem to leave nothing for the obligation to rest on, yet both feel right. I also notice that verdicts 1 and 5 both bind without any expectation on the promisee's side, while verdict 4 somehow feels stronger than 5; I am not sure a single account can explain both the similarity and the difference.

  What I want is the principle, or a small set of candidate principles, that captures as many of these verdicts as possible. For each candidate, state it precisely and say which of my cases motivate which clause. Then say what the candidate predicts about a further case: my neighbor and I agree to buy a custom piece of equipment for our shared workshop and split the cost; I promise to pay half, she orders it in reliance on that promise, and only then do I realize the equipment is less useful than I had thought. I did not misrepresent anything; I have simply cooled on the idea. Do I owe half? Finally, say honestly which of my ten verdicts each candidate cannot accommodate, and where you would overturn a verdict rather than accept a principle with a separate clause for each case.
reasoning: |-
  Hmm, the user is presenting a fascinating ethical puzzle about promise-keeping across ten distinct scenarios. They're clearly engaged in deep philosophical self-reflection, trying to systematize their moral intuitions. The core tension they've identified - between cases 1/5 (binding without expectation) and case 3 (binding despite insincerity) - suggests they're grappling with the ontological foundation of promissory obligation. 

  Their methodological approach is impressively rigorous: collecting diverse intuitions first, then seeking unifying principles, with special attention to apparent contradictions. The ladder between cases 4 and 5 is particularly subtle - both involve obligations without active reliance, yet the plant-watering feels weightier. That perceptual difference might hold the key to the reliance/expectation distinction.

  The two theories I'll develop must account for several layered challenges: First, how promises can bind when the promisee is unaware (5) or deceased (1). Second, why insincere commitments still obligate (3). Third, why self-promises differ (6). Fourth, the gradation in obligation strength between cases 4 and 5. And crucially, the shared workshop case will test whether reliance alone creates obligation absent ongoing commitment.

  For the reliance theory, the hardest cases will be 1 and 5 where no reliance occurs post-promise. I'll need to argue that in case 1, the promise itself created moral reliance even before death. For the expectation theory, case 3 is tricky because the colleague's reliance might be minimal if the promise was recent. The workshop case will likely bifurcate the theories sharply - reliance theory would bind due to the equipment order, while expectation theory might release if the neighbor understands changed circumstances.

  What's most admirable is the user's willingness to revise intuitions. I should model that by clearly stating where principles contradict their verdicts, especially on self-promises where both theories likely reject obligation. Their anxiety about cases 1 and 3 suggests they sense a deeper metaphysical puzzle about whether promissory obligations are mind-independent. That's worth surfacing in the analysis.
answer: |-
  Based on your ten cases and your desire for a unifying principle, here are two candidate principles that capture most of your verdicts. Each theory struggles with specific cases, highlighting fundamental tensions in promise theory, particularly around reliance, expectation, and the source of obligation.

  **Candidate Principle 1: The Reliance-Based Principle (RP)**
  *   **Principle:** A promise creates a binding moral obligation if and only if, and to the extent that, the promisee reasonably relies on the promise to their potential detriment, thereby creating a duty to prevent that reliance-based harm. *Sincerity* (intention to perform) is required at the moment of promising to initiate the process. *Release* occurs if: (a) the promisee waives the obligation, (b) performance becomes impossible without fault, (c) conditions fundamental to the promise change drastically (frustration/impracticability), or (d) a greater moral duty overrides the promise.
  *   **Motivation from Your Cases:**
      *   **Clause 1 (Reliance):** Cases 4 (plants), 5 (ladder - weaker reliance), 7 (work emergency showing reliance harm), 8 (reliance then waiver/release), 9 (reliance harm overrides promise), 10 (impossibility). *Explains the difference between 4 (strong reliance) and 5 (weaker reliance).*
      *   **Clause 2 (Sincerity at Initiation):** Case 3 (insincerity is a wrong *separate* from breach, but the obligation arises because the colleague *could* rely; the breach itself wrongs because of actual or potential reliance).
      *   **Clause 3 (Release Conditions):** Cases 7 (impracticability/serious harm), 8 (waiver/fundamental change), 9 (overriding moral duty), 10 (impossibility).
  *   **Prediction for Workshop Case:** **Yes, you owe half.** Your neighbor reasonably relied on your promise by ordering the custom equipment, incurring a financial commitment. Your "cooling on the idea" does not negate the reliance harm she would suffer if you don't pay. Your obligation stems from protecting her from the detrimental reliance your promise induced.
  *   **Verdicts RP Cannot Fully Accommodate / Where RP Overturns Your Verdict:**
      *   **Case 1 (Dying Friend):** RP struggles. The mother never learns of the promise; your dead friend cannot rely or be harmed. RP might weakly suggest a *potential* for reliance if the friend *hoped* his mother would be cared for, but the *actual* reliance/harm link is severed. Your intuition ("fully bound") is stronger than RP's foundation allows. RP might suggest the obligation dissolves or is minimal.
      *   **Case 2 (Coerced Promise):** RP *accommodates* your verdict. The reliance is induced by an illegitimate threat, invalidating the promise's moral force from the start. The creditor has no right to rely on a coerced commitment. No obligation.
      *   **Case 3 (Insincere Promise):** RP *accommodates* your verdict that insincerity is a separate wrong and the promise binds *if* reliance occurs/is possible. The breach wrongs due to reliance (or potential reliance). However, if the colleague hadn't relied *at all* before the breach (e.g., asked Friday morning, you lied, then didn't do it by afternoon), RP's grounding for the *obligation* is weaker, though the insincerity remains a wrong.
      *   **Case 5 (Ladder):** RP *accommodates* your verdict but explains the lesser feeling. Reliance was minimal (he arranged no alternative based on your promise, only forgot) or purely normative (he *should* be able to rely). Harm from non-return might be minor inconvenience. Contrasts with Case 4's stronger reliance.
      *   **Case 6 (Self-Promise):** RP *overturns* your verdict. RP cannot ground an obligation to oneself based on reliance. Who relies? Who is harmed? Yourself? But you can release yourself. Self-promises are more like intentions/resolutions than binding promises under RP. Your intuition ("not the same kind of obligation") is upheld.
      *   **Case 9 (Affair Secret):** RP *accommodates* your verdict. The partner's potential severe harm (financial entanglement based on deception) overrides the promisee's reliance on secrecy.

  **Candidate Principle 2: The Expectation-Responsibility Principle (ERP)**
  *   **Principle:** A promise creates a binding moral obligation by generating a legitimate expectation in the promisee. The promisor incurs a responsibility to fulfill that expectation or adequately address its failure. This responsibility arises from the promisor's voluntary act of intentionally inducing the expectation. *Sincerity* is required for the act to be a promise. *Release* occurs under the same conditions as RP (waiver, impossibility, frustration, overriding duty).
  *   **Motivation from Your Cases:**
      *   **Clause 1 (Created Expectation):** Cases 1 (friend died *expecting* you'd care for mother), 3 (colleague expects manuscript review), 4 (friend expects plant care), 5 (neighbor *expected* ladder return, even if forgotten), 7 (child expects attendance), 8 (expectation waived), 10 (impossible expectation).
      *   **Clause 2 (Responsibility for Induced Expectation):** Cases 1, 3, 4, 5, 7 - The core obligation stems from *creating* the expectation. Explains why insincerity (Case 3) is a wrong (you induced an expectation you had no intention of fulfilling) but the obligation remains (you are responsible for the expectation you created).
      *   **Clause 3 (Release Conditions):** Cases 7, 8, 9, 10 - As in RP.
  *   **Prediction for Workshop Case:** **Likely Yes, but possibly mitigated.** You intentionally induced the expectation that you would pay half, leading your neighbor to order. You are responsible for that induced expectation. "Cooling on the idea" isn't a standard release condition. However, ERP might allow more leeway than RP for renegotiation *before* reliance, or if the expectation was conditional on usefulness (which you didn't misrepresent). The core prediction is obligation, but the *strength* might be less than in Case 4 due to the mutual benefit context.
  *   **Verdicts ERP Cannot Fully Accommodate / Where ERP Overturns Your Verdict:**
      *   **Case 1 (Dying Friend):** ERP *accommodates* your verdict strongly. Your dying friend formed a legitimate expectation based on your promise. Your responsibility is to fulfill the expectation you induced, even if he cannot later be disappointed. The expectation itself creates the obligation.
      *   **Case 2 (Coerced Promise):** ERP *accommodates* your verdict. The "promise" was not voluntary; you did not *intentionally* induce a legitimate expectation under duress. No valid promise, no legitimate expectation, no obligation.
      *   **Case 5 (Ladder):** ERP *accommodates* your verdict but struggles slightly with the "less serious" feeling vs Case 4. The neighbor *did* form an expectation, even if he later forgot. Why is it less serious? ERP might need an auxiliary principle (e.g., degree of potential harm from failed expectation, or the normative weight of the expectation itself) to explain this nuance fully. Your intuition of obligation is upheld.
      *   **Case 6 (Self-Promise):** ERP *overturns* your verdict. You induced an expectation in yourself. ERP sees no fundamental reason self-promises aren't obligations, though perhaps weaker or easier to release due to the unity of promisor/promisee. Your intuition ("not the same kind") is challenged; ERP suggests it *is* similar, just intrapersonal.
      *   **Case 9 (Affair Secret):** ERP *accommodates* your verdict. The overriding duty to prevent harm to the partner releases you from the responsibility to fulfill the *specific* expectation of secrecy. The responsibility to *address* the failed expectation (apology/chance to confess) may remain.
      *   **Challenge: Reliance vs. Pure Expectation:** ERP struggles slightly to differentiate the *strength* of obligation in Case 4 (plants - reliance) vs. Case 5 (ladder - pure expectation) as clearly as RP does. Both involve induced expectations.

  **Analysis of Your Concerns & The Shared Challenge:**

  *   **Cases 1 & 3:** ERP handles these best. Case 1 is explained by the *created expectation* persisting (ERP). Case 3 is explained by the *responsibility for the induced expectation* existing regardless of initial intent (ERP) or potential reliance (RP). RP struggles more with Case 1.
  *   **Cases 1 & 5 vs. 4:** ERP explains the *similarity* (obligation from induced expectation). RP explains the *difference in strength* (Case 4 has strong reliance, Case 5 has weak/minimal reliance, Case 1 has no ongoing reliance). ERP needs an auxiliary factor to explain the feeling difference between 4 and 5.
  *   **Self-Promise (6):** Both theories struggle to fully align with your intuition. RP overturns it completely. ERP challenges it by suggesting self-promises *are* obligations, just with different dynamics. Your intuition here might need revision, or point towards a fundamental distinction between interpersonal and intrapersonal commitments that needs explicit recognition.
  *   **Workshop Case:** Both principles predict obligation, though RP's foundation (preventing reliance harm) makes the obligation feel more stringent. ERP's foundation (responsibility for induced expectation) might allow slightly more room for mitigation/renegotiation arguments.

  **Conclusion:**

  1.  **The Reliance-Based Principle (RP)** best explains the *gradation* in obligation strength (esp. Cases 4 vs. 5) and cleanly handles coercion (2) and self-promises (6 - aligning with your intuition). Its major weakness is **Case 1 (Dying Friend)**, where it struggles to ground your strong intuition of obligation without reliance or harm.
  2.  **The Expectation-Responsibility Principle (ERP)** best explains **Case 1 (Dying Friend)** and the core bindingness of **Case 3 (Insincere Promise)** based on the *creation of expectation* itself. It also handles **Case 5 (Ladder)** well. Its major weaknesses are potentially over-extending to **self-promises (6)** (challenging your intuition) and needing auxiliary factors to explain the *strength difference* between pure expectation (5) and reliance-based expectation (4).

  **Recommendation:** ERP captures more of your core intuitions across the critical cases 1, 3, 4, and 5. To make it fully satisfactory, you might need to:

  *   **Revise your verdict on Case 6 (Self-Promise):** Acknowledge that self-promises *do* create a kind of obligation to oneself based on self-trust and expectations, though distinct in enforceability and release mechanisms from interpersonal promises. Or,
  *   **Explicitly exclude self-promises:** Modify ERP to state it applies only to *interpersonal* commitments.
  *   **Incorporate Harm:** Add an auxiliary principle recognizing that the *moral weight* of the obligation can be amplified by the degree of potential harm caused by failing the expectation (explaining the difference between Case 4 and Case 5).

  The Workshop case prediction (obligation to pay) aligns with both principles and likely your intuition. Both principles require the same release conditions, explaining Cases 7-10 effectively. The core tension remains between grounding obligation in consequences (harm prevention via RP) vs. the normative force of the communicative act itself (expectation creation via ERP). ERP seems closer to your core intuitions, particularly regarding Cases 1 and 3.
