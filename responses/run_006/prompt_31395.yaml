answer: |-
  You've hit on a profound and often underappreciated point in the literature. The symmetry you perceive is real, and the dialectical asymmetry in how Lewis's results are deployed requires careful unpacking. Here’s why the results *are* typically seen as more damaging to truth-conditional (TC) approaches, breaking the symmetry:

  1.  **The Target Was Explicitly TC Theories Embracing Adams's Thesis:** Lewis framed his results as a direct attack on *Stalnaker's* (1970) TC semantics, which explicitly aimed to validate Adams's Thesis (P(if A, C) = P(C|A)) for simple conditionals. The triviality proofs showed this specific project was *mathematically impossible* under standard assumptions about probability and logic. For a TC theorist who *wanted* to vindicate Adams's Thesis (like Stalnaker did), this was a devastating blow, forcing them to abandon a core motivation. Non-TC theories (like Adams's own) *start* by denying conditionals have truth conditions, so Adams's Thesis isn't a goal they need to achieve via truth conditions; it's often a primitive postulate or consequence of their semantics.

  2.  **The Cost of Denying Adams's Thesis is Higher for TC Theorists:**
      *   **Empirical Adequacy:** Adams's Thesis has immense intuitive and experimental support. People's willingness to assert "If A, C" *does* strongly correlate with high P(C|A), and their probability assignments to conditionals in simple cases *do* align remarkably well with conditional probabilities. For a TC theorist, denying this requires a significant explanatory burden: they must provide a compelling *error theory* explaining why rational agents systematically *misjudge* the probability of a proposition they grasp (the conditional's truth conditions).
      *   **Motivation for TC Semantics:** What justifies a *particular* set of truth conditions for the conditional if not its ability to explain Adams's Thesis? Without Adams's Thesis as a constraint, the choice of truth conditions becomes less motivated and risks being ad hoc. Stalnaker's selection function semantics was largely *motivated* by the desire to get Adams's Thesis (approximately) right. Lewis showed this motivation couldn't be fully satisfied. Non-TC theories, by contrast, often take Adams's Thesis as a *starting point* for their semantic architecture.

  3.  **The Embedding Problem for Non-TC Theories is a Known Challenge, Not a New Contradiction:**
      *   Non-TC theorists (e.g., Adams, Edgington) always acknowledged that complex embeddings were the Achilles' heel of their approach. Lewis's proofs exploited this weakness using specific embeddings (like the key step involving P((A→C) ∧ (B→¬C)) or embeddings in antecedents). However, this didn't reveal a *new, unforeseen contradiction* within the non-TC framework itself, unlike the impossibility result for TC+Adams.
      *   Non-TC theorists had (and have) active research programs to *address* embedding:
          *   **Systematic Workarounds:** Proposing systematic, albeit non-truth-functional, ways to assign assertability/acceptability conditions to compounds (e.g., Adams's "probabilities of conditionals" in compounds).
          *   **Restricting the Language:** Some (like early Adams) argued indicative conditionals *don't* genuinely embed in the problematic ways in natural language, attributing apparent embeddings to pragmatic phenomena or different constructions.
          *   **Dynamic Semantics:** Later frameworks (e.g., Gillies, Starr) emerged, offering non-TC (dynamic) accounts that *can* handle embedding more gracefully by modeling meaning as context change potentials rather than truth conditions. Lewis's results *motivated* this turn towards dynamics.
      *   The embedding problem was a *known technical hurdle* requiring further development. Lewis's results *leveraged* this known hurdle to derive a *mathematical impossibility* for the competing TC program.

  4.  **The Dialectical Context: Undermining the Dominant Paradigm:**
      *   At the time (early 1970s), possible worlds semantics was ascendant. Stalnaker offered a seemingly elegant, unified TC account of conditionals. Lewis's results fundamentally undermined the viability of *that specific, promising unification project* within the dominant TC paradigm. They showed that integrating conditionals into a classical propositional logic framework with standard probability theory while respecting Adams's Thesis was impossible. This forced a major reevaluation. Non-TC theories, while facing embedding challenges, weren't making claims that led to a mathematical contradiction.

  **Breaking the Symmetry:**

  *   **For TC Theories:** Lewis shows a *mathematical impossibility*: A core semantic goal (assigning truth conditions validating Adams's Thesis under standard probability) is unachievable. Denying Adams's Thesis avoids contradiction but sacrifices a primary motivation and empirical adequacy, leaving the choice of truth conditions poorly constrained. The cost is foundational.
  *   **For Non-TC Theories:** Lewis exploits a *known technical limitation* (embedding) to derive an impossibility result *for the rival program*. The limitation itself was acknowledged, and research avenues existed (and were pursued) to address it within the non-TC framework (e.g., systematic assertability rules, dynamic semantics). The cost is developing a more complex semantic machinery to handle phenomena their theory initially struggled with.

  **Conclusion:**

  You're right that both approaches face significant burdens. However, the asymmetry arises because Lewis's results directly refuted the *core aspiration* of a major, well-developed TC research program (Stalnaker's), revealing a fundamental mathematical incompatibility. For non-TC programs, the results primarily highlighted an *existing* challenge (embedding) that they were already aware of and working on, rather than revealing a new internal contradiction. The results thus acted as a powerful *catalyst* pushing the field away from classical TC semantics towards non-TC or radically revised TC approaches (like three-valued logics or alternative probability frameworks), precisely because they exposed a dead end for the most straightforward TC implementation of the empirically compelling Adams's Thesis. The dialectical force lies in this demonstration of a fatal flaw in the *simplest and most motivated* way of being a truth-conditionalist about conditionals.
