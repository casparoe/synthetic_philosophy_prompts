prompt: |-
  I've been arguing with a mate about the Ellsberg paradox for the better part of a month and we've somehow managed to both change our minds twice without converging at all. The basic setup, just so we're on the same page: there's an urn with 90 balls — 30 red, and the remaining 60 are some mix of black and yellow you're not told. You pick a colour, a ball is drawn, and if it's your colour you win £100. Most people prefer to bet on red over black (Choice 1), and then, in a seperate pair of choices, they prefer to bet on black-or-yellow over red-or-yellow (Choice 2). That pair of preferences can't be represented by any single probability distribution over the urn's composition, which means it violates the sure-thing principle and standard subjective expected utility.

  The thing is, every discussion I've read eventually bottoms out in some claim about whether the pattern is rational or a mistake, and I've realised I don't have a settled credence on that — I keep flip-flopping depending on which framing I've most recently been exposed to. So I want your honest credence, with the reasoning broken down properly, that the ambiguity-averse pattern in the Ellsberg paradox (preferring red to black and black-or-yellow to red-or-yellow) is a rationally permissable — or even rationally required — response to the setup, rather than a cognitive mistake we should debias ourselves out of.

  Please decomose it. I want to see at least: (1) your credence that there exists a coherent, well-motivated normative decision theory that endorses the Ellsberg choices (something like maxmin expected utility, the smooth ambiguity modell, or whatever) and that isn't just standard SEU with an extra constraint snuck in, (2) conditional on such a theory existing, your credence that it's the correct theory of practical rationality rather than merely a formally coherent one, (3) your credence that the psycological mechanism driving the Ellsberg choices — the aversion to unknown probabillities — tracks something normatively relevant about the world rather than being a missfiring of some more general cognitive heuristic, and (4) whatever other sub-questions you think your overal credence hinges on. Give me a number for each with a sentence of justification, show how they combine, and then tell me which one you're least confident about and what sort of evidance or argument would most shift it.

  Oh, and write your answer in British English please.
