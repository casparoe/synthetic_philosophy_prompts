  We are designing a 75-minute activity for an upper-level undergraduate seminar (14 students) on concepts and categories, focusing on the letter-spirit problem. The goal is to challenge the checklist theory of letters and introduce the idea of categories as roles in a system of stylistic choices.

  Key elements:
  1. Use a constrained grid (3x3 or 3x4) to limit the complexity and avoid ordinary typography.
  2. The activity must have two moments:
     (i) Students produce two shapes they consider 'a's and then fail to define a feature checklist that exclusively defines 'a' in the grid system.
     (ii) Students produce a letter they've never seen in a style by grasping the style as a system.

  Design:

  Materials:
  - Grid paper: 3x4 grid (3 rows, 4 columns) per student (or per group) for drawing. Alternatively, a digital drawing tool with grid.
  - Handout with instructions and some example grids (with no letters, just showing the grid) and a few example symbols (not letters) to illustrate the grid use.
  - Whiteboard or projector for instructions and later debrief.

  Grouping: Individual work for the first part, then pairs or small groups (3-4) for the second part. Alternatively, individual throughout if time is short.

  Timeline (75 minutes total):

  1. Introduction (5 minutes):
     - Explain the grid: Each cell can be used to draw a stroke (horizontal, vertical, diagonal, or curve) that connects the dots (if using dot grid) or the grid lines. Stress that they are constructing symbols in a constrained system.
     - The goal: To explore how we recognize symbols (like letters) even when they look very different.

  2. Part 1: Creating two 'a's and failing to define a checklist (25 minutes):
     - Task: Each student must draw two distinct symbols on two separate 3x4 grids that they both consider to be the letter 'a'. They should be as different as possible but still recognizable as 'a'. (5 minutes drawing)
     - Then, they must write down a list of features that both of their 'a's share. (5 minutes)
     - Next, they must find (or imagine) a symbol in the grid system that has all the features they listed but is NOT an 'a'. Alternatively, they can swap their two grids and feature list with a partner and challenge the partner to draw such a symbol. (10 minutes)
     - Finally, they try to adjust their feature list to exclude the non-'a' and then see if it still includes both of their 'a's. They will likely fail. (5 minutes)

  3. Part 2: Creating a new letter in a style (30 minutes):
     - Introduce a style: Show (on the board) a set of 3-4 letters (e.g., 'b', 'c', 'd') in a particular style (drawn on the grid). The style should be consistent and distinct (e.g., all letters use only straight lines, or have a particular slant, or use only the top two rows, etc.). Do not show an 'a' in this style.
     - Task: In pairs or small groups, students must create an 'a' in the same style. They must not copy any existing 'a' but must create one that fits the style of the provided letters. (15 minutes drawing and discussing)
     - Then, each group shares their 'a' and explains how it fits the style. (10 minutes)
     - Finally, show the teacher's version (if you have one) and compare.

  4. Debrief (15 minutes):
     - Start by asking about their experience: What was hard? What did they notice?
     - Map to the concepts:
          - Part 1: They tried to define a checklist of features for 'a', but it either excluded some 'a's or included non-'a's. This shows the failure of the checklist view. Connect to family resemblance (Wittgenstein) — no one set of features is common to all, but they share overlapping features. Also, the idea of a prototype: maybe they had a typical 'a' in mind but variations can be very different.
          - Part 2: They created a new 'a' by understanding the style as a system. The style defined a set of design choices (e.g., how stems, bowls, etc. are drawn in that system) and the letter is defined by the role it plays in that system (e.g., the 'a' is the one that has a bowl and a stem but without the ascender of 'b' or the closed shape of 'd'). This is the "spirit" — the underlying system that generates the forms.
     - Name the views at the end: checklist theory (or feature-based view) vs. the system-based view (or role-based view).

  What might go wrong:
  - Part 1: Students might not create two sufficiently different 'a's. Solution: Encourage them to be creative and to use the grid in unusual ways. If they struggle, show two very different examples (without labeling as 'a') to inspire.
  - Part 1: They might come up with a feature that works for their two and cannot think of a non-'a' with that feature. Solution: Have them exchange with a partner to challenge. The partner might be more creative in breaking the checklist. Alternatively, you can have a few "troublemaker" examples ready to project.
  - Part 2: They might not grasp the style. Solution: Make the style very clear and distinct. Use a style that is simple and consistent. Also, provide multiple examples (3-4 letters) to illustrate the style. If they still struggle, walk around and give hints.
  - Time: The activity might run over. Be strict with time and cut off drawing when needed. Adjust group size to save time if necessary.

  What the activity cannot reproduce:
  - The activity uses a very constrained grid. Real letters have a much richer set of features and historical variations. The activity might oversimplify the problem. Also, the grid system is artificial and doesn't capture the full range of typographic variation. You will have to explain that in real typography, the system is more complex and involves cultural and historical factors.

  Confidence:
  - Overall confidence: High. The activity is designed to create the two required moments and the grid constraint is a proven method in similar exercises (like creating alien alphabets). The structure of Part 1 and Part 2 follows a common pattern of challenging a naive theory and then building an alternative.

  Least sure point:
  - Part 2: The creation of a new letter in an unseen style. Students might not be able to abstract the style from the examples and apply it to a new letter. They might try to copy elements from the provided letters without understanding the system. To mitigate, choose a style that is very systematic (e.g., all letters are made of exactly two strokes, or all use only horizontal and vertical lines, etc.) and provide clear examples. Also, the debrief will help by having groups explain their reasoning.

  Revised Timeline (with more detail):

  - 0-5 min: Introduction and grid explanation.
