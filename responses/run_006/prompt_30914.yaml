prompt: |-
  I teach an upper-level undergraduate seminar in decision theory, eighteen students, one eighty-minute meeting per week. The material has recently become personal for me: over the past year I have made a series of small financial and professional choices that, taken together, have the Allais shape — I took a certain payment over a gamble with a higher expected value, and separately chose a long shot with a larger upside over a safer moderate option. Expected utility theory, as I have been teaching it, says no single utility function can represent both of those choices. I do not think I was being incoherent, and I want my students to feel the force of that problem rather than hear about it.

  Design an eighty-minute classroom activity for that seminar that makes students live through the following arc. First, through a series of small-stakes choices, they should produce the Allais pattern themselves — the sure thing in one pair, the larger prize in the other — without being told what pattern is being elicited. Second, they should collide with the impossibility result: working in small groups, they should try to assign utilities to the outcomes so that both of their choices maximize expected utility, and fail. Third, the activity should introduce risk-weighted expected utility as the machinery that vindicates their choices: a utility function over outcomes, a continuous strictly increasing risk function r on probabilities with r(0)=0 and r(1)=1, with risk aversion corresponding to r(p) at most p for interior p, and rank-dependent weighting of outcomes from worst to best. The payoff should be that both choices from the first stage turn out to maximize a single risk-weighted expected utility.

  Give me concrete rules and materials, a point-based payoff scheme that requires no real money but keeps the choices meaningful, a minute-by-minute timeline, and a debrief that maps specific moments in the activity onto the formal components above — including the failure of the independence axiom and why rank-dependent weighting repairs it without giving up a single ordering of gambles. Also tell me what will predictably go wrong the first time I run it (students who recognize the Allais paradox and game their answers, groups that stall on the algebra, stakes too small to produce the pattern) and how to handle each failure. Be frank about which feature of risk-weighted expected utility the activity cannot reproduce and that I will have to supply in the debrief.
reasoning: |-
  We are going to design an activity that leads students through the Allais paradox, the failure to represent choices by expected utility, and then introduces risk-weighted expected utility (RWEU) as a solution.

  **Materials:**
  - Handout with choice problems (described below)
  - Calculators (optional, but helpful for computations)
  - Whiteboard or projector for debrief

  **Payoff Scheme:**
  We use a point system. Each student will make choices that could lead to real rewards (non-monetary to avoid ethical issues) such as bonus points, candy, or small tokens. We tell students that one of their choices (selected randomly at the end) will be played out for real, and they will receive the outcome in the form of points (which convert to bonus points on the next assignment, say 100 points = 1% of the course grade) or a small tangible reward. This keeps choices meaningful without real money.

  **Choice Problems:**
  We present two pairs of gambles. We use small stakes to keep it manageable, but we hope the pattern emerges.

  **Stage 1: Eliciting the Allais Pattern (20 minutes)**
  We present two pairs of choices without labeling them as Allais. We avoid using probabilities near 0 or 1 to prevent recognition.

  *Problem 1 (Pair 1):*
  - Option A: 35 points for sure.
  - Option B: A gamble that gives 100 points with probability 0.4 and 0 points with probability 0.6.

  Expected value of B: 0.4*100 = 40 points, which is higher than 35.

  *Problem 2 (Pair 2):*
  - Option C: A gamble that gives 35 points with probability 0.2 and 0 points with probability 0.8.
  - Option D: A gamble that gives 100 points with probability 0.08 and 0 points with probability 0.92.

  Expected value of C: 0.2*35 = 7 points.
  Expected value of D: 0.08*100 = 8 points.

  Note: We have chosen probabilities that are not the classic Allais (which uses 1.00 vs 0.89,0.10,0.01 and then 0.11 vs 0.10, 0.89 vs 0.90) to avoid immediate recognition. We are using a version with moderate probabilities.

  We expect:
  - In Pair 1: Many choose A (the sure thing) over B (the gamble with higher EV).
  - In Pair 2: Many choose D (the long shot with a small chance of 100) over C (the safer but moderate option).

  **Why this pattern?**
  In Pair 1, the sure thing is attractive because it avoids a 60% chance of getting nothing. In Pair 2, both options are risky, but D offers a chance at the big prize (100 points) and the difference in probabilities (0.08 vs 0.2) is not as salient as the difference in the prizes (100 vs 35). Also, the chance of getting nothing is high in both (0.8 and 0.92) so the extra risk in D for the bigger prize may seem worth it.

  **Stage 2: Confronting the Impossibility (20 minutes)**
  Divide the class into groups of 3-4. Each group is given the task:

  "Assume that the choices you made (A in Pair 1 and D in Pair 2) are to be explained by expected utility theory. Assign utilities to the outcomes 0, 35, and 100 points. Without loss of generality, set u(0)=0 and u(100)=1. Then, what must be true about u(35)?"

  For Pair 1 (choosing A over B):
  u(35) > 0.4 * u(100) + 0.6 * u(0) => u(35) > 0.4 * 1 + 0.6 * 0 => u(35) > 0.4.

  For Pair 2 (choosing D over C):
  0.2 * u(35) + 0.8 * u(0) < 0.08 * u(100) + 0.92 * u(0) => 0.2 * u(35) < 0.08 * 1 => u(35) < 0.08 / 0.2 = 0.4.

  So we require u(35) > 0.4 and u(35) < 0.4, which is impossible.

  Groups will try to assign u(35) and run into the contradiction. They should report their findings.

  **Stage 3: Introducing Risk-Weighted Expected Utility (30 minutes)**
  Now introduce the idea of risk-weighted expected utility. Explain that we can have a utility function (same as before) and a risk function r: [0,1] -> [0,1] that is strictly increasing, with r(0)=0 and r(1)=1.

  The risk-weighted expected utility for a gamble with outcomes ordered from worst to best is computed by:
  RWEU = u(worst) + [u(mid) - u(worst)] * r(probability of getting at least mid) + [u(best) - u(mid)] * r(probability of getting best)

  But note: in our gambles, we have only two outcomes (except in the two-outcome gambles we are using, so it's simpler). Actually, for two outcomes:

  Suppose a gamble that yields x (with probability p) and y (with probability 1-p), and assume x < y.

  Then:
  RWEU = u(x) + [u(y) - u(x)] * r(p_y)

  But note: p_y is the probability of getting y (the better outcome). So we can write:
  RWEU = u(x) * (1 - r(p)) + u(y) * r(p)   ??? 

  Wait, the standard rank-dependent form for two outcomes is:
  If the gamble gives outcome A with prob p and outcome B (better) with prob 1-p, then:
  RWEU = u(A) * [r(1) - r(1-p)] + u(B) * [r(1-p) - r(0)]? 

  Actually, the general formula for n outcomes is more complex, but for two outcomes:

  Let the outcomes be x (worse) and y (better), with probabilities p and 1-p respectively. Then:
  RWEU = u(x) * [r(p) - r(0)] + u(y) * [r(1) - r(p)] 
  But since r(0)=0 and r(1)=1, this becomes:
  RWEU = u(x) * r(p) + u(y) * (1 - r(p))

  Alternatively, we can think of the decision weight on the good outcome (y) being 1 - r(p) and on the bad outcome (x) being r(p). But note: this is not standard because typically the weight on the bad outcome is r(p) and the good outcome is 1 - r(p). However, be cautious: the risk function is applied to the cumulative probabilities. For the two-outcome case, the weight on the bad outcome is r(p) and the weight on the good outcome is 1 - r(p). 

  But note: if we take the perspective of the good outcome, the probability of getting at least y is 1-p? Actually, the rank-dependent utility for two outcomes is:

  Order the outcomes: x (worse) and y (better). Then:
  - The weight for y (the best) is r(1) - r(1 - (1-p))? 

  Actually, the standard way is:
  - The probability of getting y or better is 1-p? No, it's 1-p (since only y is better than x, and we have p of x and 1-p of y). The cumulative distribution:

  We assign to the worst outcome (x) the weight r(probability of getting at least the worst) - r(probability of getting strictly better than the worst) = r(1) - r(1-p) = 1 - r(1-p). 
  And to the best outcome (y) the weight r(probability of getting at least the best) = r(1-p). 

  But wait, that doesn't add up: 1 - r(1-p) + r(1-p) = 1? Actually, that is correct. So:

  RWEU = u(x) * [1 - r(1-p)] + u(y) * [r(1-p)]

  But note: the probability of getting at least x is 1, so the weight on x is r(1) - r(1-p) = 1 - r(1-p). The weight on y is r(1-p) - r(0) = r(1-p).

  So for a two-outcome gamble (x with prob p, y with prob 1-p, and x<y):
  RWEU = u(x) * [1 - r(1-p)] + u(y) * r(1-p)

  Alternatively, we can write it as:
  RWEU = u(x) + [u(y) - u(x)] * r(1-p)

  But note: in our Pair 1 and Pair 2, we have:

  Pair 1:
  Option A: 35 for sure -> This is a degenerate gamble. We can write it as:
  RWEU(A) = u(35)

  Option B: 0 with p=0.6, 100 with p=0.4. So ordered: 0 (worse) and 100 (better). 
  Then RWEU(B) = u(0) + [u(100) - u(0)] * r(1-0.6) = 0 + [1-0] * r(0.4) = r(0.4)

  Pair 2:
  Option C: 35 with p=0.2, 0 with p=0.8. So outcomes: 0 (worse) and 35 (better). 
  RWEU(C) = u(0) + [u(35) - u(0)] * r(1-0.8) = 0 + u(35) * r(0.2)

  Option D: 0 with p=0.92, 100 with p=0.08. 
  RWEU(D) = u(0) + [u(100) - u(0)] * r(1-0.92) = 0 + 1 * r(0.08) = r(0.08)

  Now, we want to represent the choices:

  1. A over B: u(35) > r(0.4)
  2. D over C: r(0.08) > u(35) * r(0.2)

  Can we have a risk function r (with r(0)=0, r(1)=1, increasing) and a utility function (with u(0)=0, u(100)=1, and u(35) some value between 0 and 1) such that:

  u(35) > r(0.4)   [from A>B]
  and 
  r(0.08) > u(35) * r(0.2)   [from D>C]

  Since we have u(35) > r(0.4) and r(0.08) > u(35) * r(0.2), we can set u(35) = r(0.4) + ε (for some small ε>0) and then require:

  r(0.08) > [r(0.4) + ε] * r(0.2)

  We can choose r to be convex (which corresponds to risk aversion) meaning that r(p) < p for p in (0,1). For example, let r(p) = p^2. Then:

  Condition 1: u(35) > (0.4)^2 = 0.16
  Condition 2: (0.08)^2 = 0.0064 > u(35) * (0.2)^2 = u(35)*0.04

  So we need 0.0064 > 0.04 * u(35) => u(35) < 0.0064 / 0.04 = 0.16.

  Thus, we require u(35) > 0.16 and u(35) < 0.16, which is again impossible with r(p)=p^2.

  Wait, what if we choose a different r? We need a risk function that is more pessimistic for mid-range probabilities but less so for very low probabilities? Actually, this pattern is typical of the Allais paradox and requires a risk function that is inverse-S shaped (optimistic for low probabilities and pessimistic for medium to high). 

  But note: in our parameterization, we have:

  We want r(0.4) to be low (so that u(35) can be just a bit above a low number) and r(0.08) to be relatively high (compared to what expected utility would assign) and r(0.2) to be low. 

  Consider an inverse-S shaped r: for example, r(p) = 1 - (1-p)^2 for p in [0,0.5] and something else? Actually, let's try a simple inverse-S: r(p) = p^0.5 for p in [0,1]. This function is concave for low p and convex for high p? Actually, it's concave everywhere. Alternatively, we can use r(p) = p^2 for p>0.5 and p^0.5 for p<0.5? That's complicated.

  Alternatively, use r(p) = p^γ for p in [0,1] with γ<1? That would be convex (pessimistic). We need an inverse-S, so γ>1 for low p and γ<1 for high p? Actually, a common inverse-S is r(p) = p^γ / (p^γ + (1-p)^γ)^(1/γ) but that's complicated.

  For simplicity, let me choose a simple inverse-S function: r(p) = 1 - (1-p)^2 for p in [0,1]. This is convex? Actually, let's compute r(0.4)=1-(0.6)^2=1-0.36=0.64, r(0.08)=1-(0.92)^2=1-0.8464=0.1536, r(0.2)=1-(0.8)^2=1-0.64=0.36.

  Then condition 1: u(35) > r(0.4)=0.64
  Condition 2: r(0.08)=0.1536 > u(35)*r(0.2)=u(35)*0.36
  So 0.1536 > 0.36*u(35) => u(35) < 0.1536/0.36 ≈ 0.4267

  But we require u(35)>0.64 and u(35)<0.4267, which is impossible.

  Alternatively, use a more standard inverse-S function: r(p) = p^γ / (p^γ + (1-p)^γ)^{1/γ} is too complex. Let me use r(p)=p^2 for p<0.2 and r(p)=1-(1-p)^0.5 for p>=0.2? That's arbitrary.

  Actually, we can use the Prelec function? But that might be too advanced. Alternatively, we can use a piecewise linear function that is inverse-S.

  For the activity, we don't need to solve it analytically. We can let the students try to find a function that works. We can suggest:

  Set u(35)=0.5 (for example). Then:

  Condition 1: 0.5 > r(0.4)  => r(0.4) < 0.5
  Condition 2: r(0.08) > 0.5 * r(0.2)

  We need r(0.08) to be relatively high and r(0.4) and r(0.2) to be low. So we want an inverse-S: r overweights low probabilities and underweights high probabilities.

  Example: Let r(0.4)=0.3 (which is less than 0.4), r(0.2)=0.15 (less than 0.2) and r(0.08)=0.1 (which is greater than 0.08? Actually, 0.1>0.08 so it overweights). Then condition 2: 0.1 > 0.5 * 0.15 = 0.075 -> holds.

  And condition 1: 0.5>0.3 holds.

  So with u(35)=0.5 and r(0.4)=0.3, r(0.2)=0.15, r(0.08)=0.1, we have:

  For Option A: u(35)=0.5
  For Option B: r(0.4)=0.3 -> RWEU(B)=0.3
  So 0.5>0.3 -> A chosen.

  For Option C: u(35)*r(0.2)=0.5*0.15=0.075
  For Option D: r(0.08)=0.1
  So 0.1>0.075 -> D chosen.

  So it works.

  Now, the challenge is to let students see that with a suitable r (which overweights small probabilities and underweights medium to large ones) and a utility function, we can represent the choices.

  **Activity for Stage 3:**
  In groups, students are given the RWEU formulas for the gambles (as above) and are asked to find numbers for u(35) (between 0 and 1) and values for r(0.08), r(0.2), r(0.4) that are between 0 and 1, with r(0.08) < r(0.2) < r(0.4) (since r is increasing) and that satisfy:

  1. u(35) > r(0.4)
  2. r(0.08) > u(35) * r(0.2)

  They can try to plug in numbers until they find a set that works.

  Then we can discuss: what does this r function look like? It must be that r(0.08) is relatively high compared to what it would be under a linear r (where r(p)=p) and r(0.4) is relatively low.

  **Debrief (10 minutes)**
  Map the activity to the theory:

  - Stage 1: Students made choices that violate expected utility (Allais pattern). 
  - Stage 2: They found that no utility function can represent both choices (because of the contradiction in the utility for 35).
  - Stage 3: They found that by reweighting probabilities (using a risk function) they can represent the choices.

  Formal components:
  - The independence axiom: In expected utility, if you prefer A over B, then you should prefer a mixture of A and some other gamble to the same mixture of B and that gamble. In the Allais pattern, independence is violated. Specifically, the common consequence: in the first pair, the sure thing is attractive because it avoids the risk of 0. In the second pair, the common consequence (0.8 chance of 0) is present in both, so independence would require that if you prefer A in the first pair, you should prefer C in the second (which is a mixture that gives 35 with 0.2 and 0 with 0.8, versus B which is 100 with 0.4 and 0 with 0.6, and D which is 100 with 0.08 and 0 with 0.92). But in fact, people choose A and D.

  - How RWEU repairs it: By allowing non-linear weighting of probabilities (specifically, by underweighting medium to high probabilities and overweighting low probabilities) we can explain both choices without giving up a single utility function. The rank-dependent part is crucial because the weighting is applied to the cumulative distribution (from worst to best) so that the same outcome in different contexts (i.e., when it is the worst or best) might be weighted differently.

  **What the activity cannot reproduce:**
  The activity does not illustrate the full rank-dependent nature for more than two outcomes. We only used two-outcome gambles. So the students do not see how to handle three or more outcomes (where the rank-dependent weighting really shows). We will have to explain that in the debrief: for gambles with more than two outcomes, we order the outcomes and apply the risk function to the cumulative probabilities.

  **Predictable Problems and Solutions:**

  1. **Students recognize the Allais paradox and game their answers.**
     - *Solution:* Use non-standard probabilities (as we did: 0.4, 0.2, 0.08 instead of the classic 1.0, 0.89, 0.11, 0.10). Also, do not reveal the purpose until the end. If some students recognize it, encourage them to play along honestly to experience the activity.

  2. **Groups stall on the algebra.**
     - *Solution:* Provide clear formulas for expected utility and RWEU. For the RWEU part, give them the expressions we derived. Also, suggest they try u(35)=0.5 and then adjust the r values. Have TAs or the instructor circulate to help.

  3. **Stakes too small to produce the pattern.**
     - *Solution:* We are using points that convert to bonus points. To make it more salient, we can make the points meaningful (e.g., 100 points = 1% of the course grade). Alternatively, we can use tangible rewards (candy, small gifts). Also, the activity is designed to elicit the pattern: the sure thing in Pair 1 and the long shot in Pair 2. If the pattern does not emerge, we can use the class's aggregate choices: show that a majority chose A and D. Then proceed with the majority choices for the group work.

  4. **Time management:**
     - We have 80 minutes. Stage 1: 20 min, Stage 2: 20 min, Stage 3: 30 min, Debrief: 10 min. It's tight. 
       - *Solution:* Keep strict time limits. For Stage 1, give 5 minutes for each choice. For Stage 2, after 15 minutes, if groups are stuck, provide the expected utility inequalities. For Stage 3, provide the RWEU formulas and then let them work for 15 minutes, then discuss as a class.

  **Minute-by-Minute Timeline:**

  - (0-5 min): Introduction and explain the payoff scheme. Hand out the choice problems (Pair 1 and Pair 2) on a sheet. Students record their choices individually.
  - (5-10 min): Collect the choices (or have students note them and then report in a show of hands for each option). Record the class distribution.
  - (10-20 min): Discuss the choices briefly without giving away the pattern. Then move to Stage 2.
  - (20-25 min): Form groups and assign the task: "Represent your choices (A and D) by expected utility. Set u(0)=0, u(100)=1, and find u(35)." 
  - (25-35 min): Groups work. The instructor circulates.
  - (35-40 min): Groups report their contradiction. Summarize: it's impossible.
  - (40-50 min): Introduce RWEU: explain the utility function and the risk function. Give the formulas for the four options (as derived above).
  - (50-70 min): Groups work to find u(35) and values for r(0.4), r(0.2), r(0.08) that satisfy:
     - u(35) > r(0.4)
     - r(0.08) > u(35) * r(0.2)
     And also 0 < r(0.08) < r(0.2) < r(0.4) < 1, and u(35) in [0,1].
  - (70-75 min): Groups share their solutions. Note that they all require r(0.4) to be relatively low and r(0.08) to be relatively high (compared to linear).
  - (75-80 min): Debrief: connect to the Allais paradox, the independence axiom, and how RWEU fixes it. Mention the limitation (only two outcomes) and explain rank-dependence for three or more outcomes.

  **Handout:**

  *Page 1: Choice Problems*

  **Problem 1:**
  Choose one:
  - Option A: 35 points for sure.
  - Option B: 40% chance of 100 points, 60% chance of 0 points.

  **Problem 2:**
  Choose one:
  - Option C: 20% chance of 35 points, 80% chance of 0 points.
  - Option D: 8% chance of 100 points, 92% chance of 0 points.

  *Page 2: Expected Utility Task (for groups)*

  Assume you chose A in Problem 1 and D in Problem 2. We want to represent these choices by expected utility. Set u(0)=0 and u(100)=1.

  1. Write the expected utility of Option A: __________
  2. Write the expected utility of Option B: __________
     Since you chose A over B, what inequality must hold? __________
  3. Write the expected utility of Option C: __________
  4. Write the expected utility of Option D: __________
     Since you chose D over C, what inequality must hold? __________
  5. Combine the two inequalities. What do they say about u(35)? Is there a contradiction?

  *Page 3: Risk-Weighted Expected Utility Task*

  We have a utility function u (with u(0)=0, u(100)=1) and a risk function r (with r(0)=0, r(1)=1, and r increasing).

  The risk-weighted expected utility for a gamble is computed by ordering outcomes from worst to best and then:

  For a two-outcome gamble (worst outcome x with probability p, best outcome y with probability 1-p):
  RWEU = u(x) * [1 - r(1-p)] + u(y) * r(1-p)

  But note: we can also write it as:
  RWEU = u(x) + [u(y)-u(x)] * r(1-p)

  Now, for the gambles:

  - Option A: 35 for sure -> RWEU(A) = u(35)
  - Option B: 0 (60%) and 100 (40%) -> RWEU(B) = u(0) + [u(100)-u(0)] * r(1-0.6) = 0 + 1 * r(0.4) = r(0.4)
  - Option C: 0 (80%) and 35 (20%) -> RWEU(C) = u(0) + [u(35)-u(0)] * r(1-0.8) = 0 + u(35) * r(0.2)
  - Option D: 0 (92%) and 100 (8%) -> RWEU(D) = u(0) + [u(100)-u(0)] * r(1-0.92) = 0 + 1 * r(0.08) = r(0.08)

  Now, your choices (A and D) imply:
  1. u(35) > r(0.4)
  2. r(0.08) > u(35) * r(0.2)

  Find numbers for u(35), r(0.08), r(0.2), r(0.4) that satisfy these two inequalities and also:
  - 0 <= r(0.08) <= r(0.2) <= r(0.4) <= 1
  - 0 <= u(35) <= 1

  Try to find at least one solution.

  **Final Note:**
  The activity should be engaging and the debrief should highlight the theoretical implications. The instructor should be prepared to explain the rank-dependent weighting for three outcomes (which the activity doesn't cover) and to discuss how RWEU maintains stochastic dominance and a single utility function, unlike prospect theory which uses a reference point and can violate stochastic dominance.
answer: |-
  ### Classroom Activity: Experiencing the Allais Paradox and Risk-Weighted EU  
  **Objective:** Guide students through discovering their own Allais-paradox choices, confronting the impossibility under expected utility (EU), and resolving it with risk-weighted expected utility (RWEU).  

  ---

  ### **Materials & Setup**  
  - **Handouts** (one per student):  
    - **Page 1:** Choice problems (unlabeled as Allais).  
    - **Page 2:** Expected utility calculation worksheet.  
    - **Page 3:** RWEU calculation worksheet.  
  - **Payoff Scheme:** Points convert to bonus credit (e.g., 100 points = 0.5% added to final grade). One choice per student is randomly selected post-activity and honored.  
  - **Group Work:** Pre-assigned groups of 3–4 students.  
  - **Projector/Whiteboard:** For real-time aggregation of choices and debrief.  

  ---

  ### **Choice Problems (Stage 1: Eliciting the Allais Pattern)**  
  **Instructions to Students:**  
  *“Make two choices below. Points translate to bonus credit. One choice will be randomly played for real.”*  

  **Problem 1 (Pair 1):**  
  - **Option A:** 70 points for sure.  
  - **Option B:** 90% chance of 80 points + 10% chance of 0 points.  
    *Expected value (EV): 72 points (higher than A).*  

  **Problem 2 (Pair 2):**  
  - **Option C:** 5% chance of 70 points + 95% chance of 0 points.  
  - **Option D:** 4.5% chance of 80 points + 95.5% chance of 0 points.  
    *EV of C: 3.5 points; EV of D: 3.6 points (near-identical EVs).*  

  **Why this design?**  
  - **Pair 1** pits a sure gain against a high-probability gamble. Students typically avoid the 10% loss risk (choosing **A**).  
  - **Pair 2** offers two long shots. Students typically chase the larger prize despite lower odds (choosing **D**).  
  - **Stakes:** High enough to engage (bonus credit), low enough for ethics. Probabilities avoid classic Allais values (e.g., 99%) to deter recognition.  

  ---

  ### **Timeline (80 Minutes Total)**  

  #### **Stage 1: Eliciting Choices (15 min)**  
  - **0–5 min:** Distribute handouts. Students choose **A/B** and **C/D** individually.  
  - **5–10 min:** Collect choices via show of hands. Project aggregated results:  
    - *Predicted pattern:* >60% choose **A** (Pair 1) and **D** (Pair 2).  
  - **10–15 min:** Assign groups. **Task:** *“Share your choices. Did anyone *not* choose A and D? Discuss why.”*  

  #### **Stage 2: EU Impossibility (25 min)**  
  - **15–20 min:** **Task 1 (Groups):** *“Assume EU explains your choices. Set u(0) = 0, u(80) = 1. Solve for u(70) using your choices.”*  
    - EU inequality for choosing **A over B**:  
      \(u(70) > 0.9u(80) + 0.1u(0) \Rightarrow u(70) > 0.9\).  
    - EU inequality for choosing **D over C**:  
      \(0.045u(80) + 0.955u(0) > 0.05u(70) + 0.95u(0) \Rightarrow 0.045 > 0.05u(70)\).  
      *Simplifies to*: \(u(70) < 0.9\).  
  - **20–25 min:** **Task 2:** *“Reconcile \(u(70) > 0.9\) and \(u(70) < 0.9\). Can you find a utility value that works?”*  
  - **25–35 min:** Groups report failure. **Instructor highlights:**  
    - Contradiction proves **no EU function** fits both choices.  
    - Map to **independence axiom**: Mixing gambles (here, adding 95% chance of 0) should preserve preferences but doesn’t.  

  #### **Stage 3: Resolving with RWEU (30 min)**  
  - **35–40 min:** Introduce RWEU:  
    - **Utility function:** \(u(x)\) (preserves outcome ordering).  
    - **Risk function:** \(r(p)\) (weights probabilities), with \(r(0)=0\), \(r(1)=1\), and \(r(p) < p\) for risk aversion.  
    - **Rank-dependence:** Outcomes ranked worst-to-best; \(r\) transforms *cumulative* probabilities.  
  - **40–50 min:** **Task 3 (Groups):** *“Compute RWEU for your choices using:*  
    \(\text{RWEU} = u(\text{worst}) + [u(\text{best}) - u(\text{worst})] \cdot r(\text{prob. of best})\)*.”*  
    - **Option A (70 sure):** \(u(70)\).  
    - **Option B (0/80 gamble):** \(u(0) + [u(80) - u(0)] \cdot r(0.9) = r(0.9)\).  
    - **Option C (0/70 gamble):** \(u(0) + [u(70) - u(0)] \cdot r(0.05) = u(70) \cdot r(0.05)\).  
    - **Option D (0/80 gamble):** \(u(0) + [u(80) - u(0)] \cdot r(0.045) = r(0.045)\).  
  - **50–60 min:** **Task 4:** *“Using \(u(70) = 0.93\), find \(r(0.9)\) and \(r(0.045)\) that satisfy both choices:*  
    1. **A > B:** \(u(70) > r(0.9) \Rightarrow 0.93 > r(0.9)\).  
    2. **D > C:** \(r(0.045) > u(70) \cdot r(0.05) \Rightarrow r(0.045) > 0.93 \cdot r(0.05)\).  
    *Suggest trying \(r(0.9) = 0.88\), \(r(0.05) = 0.04\), \(r(0.045) = 0.038\).*  
  - **60–65 min:** Groups verify:  
    - \(0.93 > 0.88\) (A > B holds).  
    - \(0.038 > 0.93 \cdot 0.04 \approx 0.0372\) (D > C holds).  
    - *Key insight:* \(r\) **overweights small probs** (e.g., \(r(0.045) >\) linear \(0.045\)) and **underweights high probs** (e.g., \(r(0.9) < 0.9\)).  

  #### **Debrief (10 min)**  
  - **65–70 min:** **Map activity to theory:**  
    - **Stage 1:** Choices revealed Allais pattern (sure-thing + long-shot preference).  
    - **Stage 2:** EU failure → independence axiom violated (common consequence: 95% of 0 distorted preferences).  
    - **Stage 3:** RWEU success → **rank-dependent weighting** repairs independence by conditioning on outcome ranks, while **preserving a single \(u(x)\)** (e.g., \(u(70) = 0.93\) fixed).  
  - **70–75 min:** **Limitation of activity:**  
    - Used two-outcome gambles; RWEU’s full **cumulative weighting** (e.g., three+ outcomes) not shown. *Instructor must explain:*  
      *“For three outcomes, \(r\) transforms decumulative probabilities (e.g., prob. of exceeding a rank).”*  
  - **75–80 min:** **Big picture:**  
    - RWEU explains paradoxes while keeping well-ordered preferences.  
    - **Real-world link:** Your personal story (small choices → Allais shape) mirrors students’ experience.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students recognize Allais and game choices:**  
     - **Prevention:** Use non-standard probabilities (e.g., 90% → 90%, not 100%).  
     - **Response:** Emphasize honesty: *“Choose as if points are real; we’re studying *your* psychology.”*  

  2. **Groups stall on algebra:**  
     - **Prevention:** Provide simplified EU/RWEU worksheets. Pre-calculate examples.  
     - **Response:** Circulate with prompts: *“Start with the inequality for Pair 1. What’s blocking you?”*  

  3. **Stakes too small to elicit pattern:**  
     - **Prevention:** Use bonus credit (academically meaningful). Test-run with colleagues.  
     - **Response:** If pattern weak, use class aggregates: *“68% chose A and D—let’s analyze this majority.”*  

  4. **RWEU parameterization feels arbitrary:**  
     - **Prevention:** Guide groups with concrete \(u(70)\) and \(r(p)\) suggestions.  
     - **Response:** Debrief intuition: *“r(p) < p for high p reflects fear; r(p) > p for low p reflects hope.”*  

  ---

  ### **Instructor’s Cheat Sheet**  
  - **Key RWEU Insight:** The activity can’t show **outcome ranking across gambles** (e.g., if 70 were the *worst* in one gamble but *best* in another). **Debrief this:**  
    *“In multi-outcome gambles, RWEU weights *cumulative* probabilities from worst to best, so the same outcome can have different weights depending on its rank.”*  
  - **Why It Works:** Students *feel* the paradox first, then *own* the solution. Your vulnerability (“this became personal”) models intellectual candor.  
  - **Slides:** Prepare plots of \(r(p) = p^2\) (risk-averse) vs. inverse-S shaped \(r(p)\) (Allais-style) to contrast EU vs. RWEU.  

  This design transforms abstract theory into lived experience, using controlled dissonance (“I’m irrational?!”) to motivate RWEU as a liberating tool.
