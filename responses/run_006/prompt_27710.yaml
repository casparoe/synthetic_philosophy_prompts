  Okay so I keep coming back to the old lifeboat case — R v Dudley and Stephens, 1884, the Mignonette. You know the facts: the yacht sank, four men ended up adrift in a small boat, and after about three weeks Dudley and Stephens killed the cabin boy Richard Parker while Brooks dissented (but ate afterward); all three were rescued and tried for murder. The court said necessity is no defense to murder, convicted them, and the sentence was commuted to six months. I know the holding, so I don't want a law-school answer. What I want is the case run through Scanlon's contractualism, specifically the aggregation problem.

  Here's the machinery as I understand it: Scanlon says an act is wrong if it would be disallowed by any principle for the general regulation of behavior that no one could reasonably reject, and he's famously cagey about wether you can just sum up lots of smaller claims to outweigh one big one. So do the mapping. Who are the parties and what exactly are their complaints? What principle would Dudley and Stephens have to rely on, and could Parker reasonably reject it? And the reverse: is there a principle forbidding the killing that the other three could reasonably reject, given that, as they saw it, the alternative was all four dying? By the theory's lights, what should they have done, and why? Does the doing/allowing distinction do any work here, and does Scanlon have a principled way to say why numbers count in a rescue case — save the five rather than the one — but apparently don't count in the lifeboat? Then turn it around: what does the case show about contractualism? Is it a point in the theory's favor that it condemns the killing, or does it reach the right answer for the wrong reason, or does the case expose something awkward about the anti-aggregation idea?

  Tell me which features of the case the theory handles naturally and which ones it has to bend or ignore. And be honest about the fit: if at some point the theory just doesn't speak to the case, or I've got Scanlon's view of aggregation wrong, tell me that straight instead of forcing the case through the machinery. Keep the two directions explicit — what the theory says about the case, and what the case says about the theory.

  Format thing: after the main answer, make the very last line \answer{...} with a one-sentence summary of your overall take inside the braces.
