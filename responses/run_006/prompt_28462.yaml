  I appreciate how they're approaching this methodically. Instead of jumping into defending a favorite concept, they want to establish evaluation criteria first. That's very philosophically rigorous for an undergrad paper. The frustration with "favorite cases" is relatable - every biology student notices how textbook examples avoid the messy realities. 

  Let me structure this carefully. First, the non-negotiable evolutionary constraints: species must be evolutionarily significant units (no teleology!), accommodate change over time, and allow for Darwin's "mutability." Then the core cases any concept must handle - ring species being particularly brutal for discrete-boundary concepts. 

  The distinctions part is crucial too. Many debates go sideways because people confuse the abstract category ("species") with specific taxa ("Homo sapiens"), or mix up theoretical definitions with practical identification methods. The user seems aware of this - smart. 

  For conflicting desiderata, discreteness vs. processuality is the big one. We want species to be distinct (for classification) but evolution makes boundaries fuzzy. Also, operationality vs. theoretical rigor - field biologists need workable definitions while theorists want conceptual purity. 

  Horizontal gene transfer in bacteria might be the ultimate test case. It blows up traditional concepts of lineage and shared ancestry. If a concept handles that well, it's probably robust. 

  Should I mention which requirement kills most concepts? Probably "asexual reproduction" - so many definitions rely on reproductive isolation. Though ring species are a close second for exposing boundary problems. 

  For the scorecard... biological concept fails most modern cases, phylogenetic struggles with hybridization, ecological has circularity issues. But I'll keep it brief as requested. 

  The user seems analytically strong - I can go fairly technical without losing them. They'll appreciate the "non-negotiable" flags and conflict callouts. Might help them frame their paper's argument about whether any concept can satisfy all this while reflecting biological reality.
answer: |-
  Here's a comprehensive breakdown of the desiderata for a species concept, structured to address your core questions about what a definition *must* accomplish and where the fundamental tensions lie:

  **I. Non-Negotiable Evolutionary Constraints (Theoretical Foundations):**
  Any species concept *must* be compatible with these principles:
  1.  **Evolutionary Change & Descent:** Species are products of evolution by descent with modification. They are not static, eternal types. *Motivation:* Contradicting Darwinian evolution renders the concept biologically meaningless.
  2.  **No Teleology:** Species definitions cannot imply purpose or a "goal" for evolution (e.g., "designed for adaptation"). *Motivation:* Modern evolutionary biology rejects teleological explanations.
  3.  **Mutability:** The concept must allow for species to originate (speciation), change over time (anagenesis), and go extinct. *Motivation:* The fossil record and observed evolution demand it.

  **II. Core Cases Any Adequate Account Must Handle or Explain (Empirical Challenges):**
  An adequate concept must explicitly address *why* it succeeds or fails on these biologically real phenomena:
  1.  **Asexual Reproduction:** Organisms reproducing clonally (e.g., bdelloid rotifers, many plants, bacteria). *Problem:* Reproductive isolation (BSC) is irrelevant. Genetic cohesion mechanisms differ. *Non-negotiable?* Yes. Life exists without sex.
  2.  **Ring Species:** A chain of populations where adjacent populations interbreed, but endpoints do not (e.g., *Ensatina* salamanders, *Larus* gulls). *Problem:* Blurs the line between "one species with variation" and "two distinct species." Challenges discrete boundaries. *Non-negotiable?* Yes. Demonstrates speciation as a continuous process.
  3.  **Stable Natural Hybrids & Hybrid Zones:** Cases where distinct lineages interbreed regularly but maintain their integrity (e.g., *Heliconius* butterflies, *Quercus* oaks, *Mus* mice). *Problem:* Challenges "reproductive isolation" (BSC) and "exclusive monophyly" (many PSC versions). *Non-negotiable?* Yes. Hybridization is common and evolutionarily significant.
  4.  **Extinct Organisms (Fossils Only):** Populations known only from morphology in rocks. *Problem:* Cannot assess interbreeding, ecology, or genetics directly. Relies heavily on morphological gaps. *Non-negotiable?* Yes. Paleobiology requires species concepts.
  5.  **Bacteria & Archaea (Extensive HGT):** Organisms where Horizontal Gene Transfer (HGT) is rampant, creating complex, reticulate phylogenies. *Problem:* Challenges the very notion of a single, tree-like lineage (core of PSC) and reproductive isolation (BSC). *Non-negotiable?* Yes. They constitute a massive portion of biodiversity and challenge tree-thinking.

  **III. Essential Conceptual Distinctions:**
  The concept must clearly respect:
  1.  **Species Category vs. Species Taxa:**
      *   *Category:* The abstract rank or class ("species" as a level in classification).
      *   *Taxa:* The specific instances (e.g., *Homo sapiens*, *Panthera leo*).
      *   *Requirement:* The definition must define the *category* (what it means to *be* a species). Defining specific taxa is a separate (though related) task of taxonomy/systematics. *Non-negotiable?* Absolutely. Confusing them leads to circularity ("Species are the groups taxonomists call species").
  2.  **Conceptual Definition vs. Operational Criteria:**
      *   *Definition:* The theoretical answer to "What *is* a species?" (e.g., lineage segment, reproductive community).
      *   *Operational Criteria:* The practical methods used to *identify* and *delimit* species in the real world (e.g., DNA barcoding gaps, morphological diagnosability, reciprocal monophyly in gene trees).
      *   *Requirement:* The concept must articulate its theoretical definition clearly. It should ideally suggest operational criteria, but these are secondary and imperfect proxies. *Non-negotiable?* Yes. A good definition explains *why* we use certain criteria, even if they sometimes fail.

  **IV. Desirable Properties (Often School-Dependent Preferences):**
  These are valued by many biologists but prioritized differently or sometimes sacrificed:
  1.  **Universality:** Applicable to all organisms (sexual/asexual, extant/extinct, prokaryote/eukaryote). *Preference:* Strongly preferred, but some concepts explicitly sacrifice this (e.g., BSC for asexuals).
  2.  **Objectivity/Testability:** Definition based on empirically observable properties or patterns, minimizing subjectivity. *Preference:* Highly valued, especially in operational contexts, but theoretical definitions might be more abstract.
  3.  **Discreteness (Boundedness):** Species should be clearly distinguishable entities with definable boundaries. *Preference:* Valued for classification and communication, but conflicts with evolutionary processuality.
  4.  **Evolutionary Significance:** Species should represent lineages with their own evolutionary fate and trajectory. *Preference:* Central to ESC and many PSC views, less explicit in purely pattern-based concepts (morphological).
  5.  **Operational Utility:** Provides clear, practical methods for delimitation. *Preference:* Crucial for applied work (conservation, ecology), but can lead to conflating definition with criteria.

  **V. Key Tensions and Conflicts:**
  1.  **Discreteness vs. Processuality:** The desire for clear boundaries (Discreteness) fundamentally conflicts with the gradual nature of evolutionary change, especially evident in Ring Species, Hybrid Zones, and Anagenesis. *This is the single most pervasive conflict.*
  2.  **Universality vs. Theoretical Rigor/Operationality:** Concepts aiming for strict universality (e.g., some ESCs, General Lineage Concept) often become abstract and hard to apply directly. Concepts with strong operational utility (e.g., morphological, some PSC implementations) often fail for specific groups (asexuals, fossils requiring different criteria).
  3.  **Monophyly vs. Gene Flow:** Phylogenetic concepts (PSC) emphasizing exclusive common ancestry (monophyly) struggle with Hybridization and HGT, which create reticulate relationships violating strict tree models.
  4.  **Stasis vs. Change:** Defining species often requires identifying some stability, while evolution implies constant change. This is particularly acute for fossils.

  **VI. The Single Most Eliminating Requirement:**
  **Asexual Reproduction.** This requirement alone eliminates the Biological Species Concept (BSC) and its core mechanism (reproductive isolation) as a *universal* definition. It also strongly challenges any concept relying primarily on interbreeding for cohesion.

  **VII. Brief Scorecard for Major Concepts (Against Desiderata):**
  *   **Biological Species Concept (BSC):**
      *   *Fails:* Asexual organisms, Ring species (endpoints), Stable hybrids, Fossils (operationally), Bacteria/HGT.
      *   *Strengths:* Clear operational criteria (interbreeding) for many sexual taxa; strong evolutionary mechanism (isolation).
      *   *Conflict:* Discreteness vs. Processuality (ring species, hybrids).
  *   **Phylogenetic Species Concept (PSC - various forms):**
      *   *Fails:* Stable hybrids (monophyly versions), Ring species (depending on resolution), Operational delimitation often arbitrary (how much divergence?), Fossils (limited data), Bacteria/HGT (reticulation).
      *   *Strengths:* Universal in principle (based on pattern), Objective (in theory), Respects evolutionary history.
      *   *Conflict:* Monophyly vs. Gene Flow/HGT; Operationality vs. Theoretical Rigor (defining "smallest" diagnosable/monophyletic group).
  *   **Ecological Species Concept (ESC):**
      *   *Fails:* Operational criteria often vague/circular (defining the niche), Stable hybrids (if occupying distinct niches?), Ring species (ecological gradients), Fossils (niche inference difficult).
      *   *Strengths:* Explicit evolutionary significance (adaptation), Potentially universal (all organisms have ecology).
      *   *Conflict:* Universality vs. Operationality; Defining niche independently.

  **Conclusion for Your Paper:** No single species concept satisfies all desiderata perfectly. The core tension lies in reconciling our need for discrete, classifiable units (species *taxa*) with the messy, continuous, and dynamic reality of evolution (the species *category* as a lineage segment). Asexual reproduction, ring species, and HGT are particularly potent challenges. The most defensible modern approaches (e.g., the General Lineage Concept) often treat "species" as separately evolving metapopulation lineages, emphasizing the *process* over rigid criteria, and then use different operational methods (morphology, genetics, ecology) as evidence for lineage separation depending on context. This acknowledges that "species" picks out a real phenomenon (evolving lineages) but that our delimitation of them is necessarily a pragmatic, theory-laden human activity.
