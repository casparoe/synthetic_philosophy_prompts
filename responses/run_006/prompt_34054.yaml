  **Conclusion:**

  Present the case as follows:

  **Microdomain:**
  Consider a row of objects, each defined by shape (e.g., square, circle, triangle, star) and color (e.g., green, red, blue, yellow).

  **Source Analogy:**
  - Start: [square-green, square-green, triangle-yellow]
  - Insert between the second and third: [triangle-green]
  - Explanation: The first two form a group (both square and green). We break the group by changing the shape to that of the next object (triangle) while preserving the group's color (green).

  **Target Problem:**
