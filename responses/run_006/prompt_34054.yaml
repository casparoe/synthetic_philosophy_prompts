  - Why? Because the first two are both square and green (a group) and we break the group by changing the shape to that of the next object (triangle) while preserving the color (green).

  **Target Problem:**
  - We start with: [circle-red, circle-red, star-blue]
  - We insert between the second and third: ?

  **Intended Answer:**
