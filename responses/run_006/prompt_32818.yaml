   However, note: the strict conditionalizer will note that E is already known, so P(E) = 1. Therefore, P(H|E) = P(H) because P(H and E) = P(H) when P(E)=1. So E is neutral for H.

   The counterfactual-prior Bayesian will try to evaluate the confirmation by asking: what would the probability of H have been if we didn't know E? Then update on E and see if that increases or decreases the probability of H.

   Let's formalize:

   Let H be MOG.
   Let E be the old evidence (flat rotation curves).

