     P_old(H0) = 0.7 - ε (so that they sum to 1? Actually, we have to account for other possibilities, but let's set P_old(H0)=0.7, P_old(DM)=0.3, and P_old(MOG)=0.001, and the rest 0? But note: we want to be fair and non-gerrymandered.)

