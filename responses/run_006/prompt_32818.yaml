   Step 1: Set aside knowledge of E. What prior would we have assigned to E? We'll call it P_old(E). We also need a prior for H, P_old(H).

   Step 2: Compute the likelihood P_old(E|H) and P_old(E|~H).

   Step 3: Then the counterfactual confirmation is: P_old(H|E) = [P_old(E|H) * P_old(H)] / P_old(E)

   Step 4: Compare P_old(H|E) to P_old(H). If P_old(H|E) < P_old(H), then E disconfirms H.

