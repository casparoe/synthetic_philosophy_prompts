  We are creating a decision procedure for a consultant in A&E to handle higher-order evidence (evidence about the reliability of their own judgement). The procedure must be efficient, runnable in under 10 minutes, and require no philosophical training.

  The procedure will be a series of questions. At each step, we will specify:
  - What counts as a sufficient answer
  - Whether the consultant may decide alone, must seek a second opinion, or must hand the decision over entirely.

  We must distinguish:
  - Evidence that identifies a specific step in reasoning as faulty (e.g., a particular bias or miscalculation) vs.
  - Evidence that merely lowers confidence without pointing to a specific flaw.

  We must avoid double-counting: if the first-order evidence already accounted for a factor, then the higher-order evidence about that same factor should not be double-counted.

  Steps that are genuine judgment calls will be marked as such. Steps where the underlying epistemology is unsettled and we must stipulate will be marked.

  ---

  **Decision Procedure: Higher-Order Evidence in Clinical Judgement**

  **Step 0: Preliminary Check - Is this a life-threatening emergency requiring immediate action?**
