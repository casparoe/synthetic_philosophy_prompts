  **Step 3: Assess the strength of the HOE.**
     - Ask: *"How strong is the HOE? Consider:*
        - *For Type A (specific flaw): How certain am I that the flaw exists and that it materially affects the decision?*
        - *For Type B (general): How severe is the reliability reduction? (e.g., the audit shows error rates double in the last two hours, vs. a small increase)"*
     - **Sufficient answer:** Use a simple scale: Low, Medium, High. (This is a judgment call, but use the following guide: 
          - Low: The HOE is weak or speculative (e.g., a junior doctor disagrees but you have good reason to think they missed something obvious; or you are a little tired but the decision is straightforward).
          - Medium: The HOE is substantial but not extreme (e.g., the audit shows a 20-50% increase in errors; or you are very tired but the case is routine).
          - High: The HOE is very strong (e.g., the audit shows errors triple; or you are severely sleep-deprived and the case is complex).)
     - **Action:**
          - If Low: You may decide alone, but document the HOE and your reasoning for proceeding.
          - If Medium: You must seek a second opinion. The second opinion should be from a colleague (preferably of similar or higher experience) who is not subject to the same HOE (e.g., not also at the end of a long shift). Then, integrate their input and decide.
          - If High: You must hand the decision over entirely to a colleague who is not subject to the same HOE (or if none is available, seek immediate second opinion and consider escalating to a more senior colleague or delaying non-urgent decisions if possible). If the decision is time-critical and no one else is available, then you must make the decision but document extensively and plan for review.

  **Step 4: After obtaining a second opinion (if required) or when deciding alone:**
     - Ask: *"Does the second opinion (or my own re-assessment) resolve the issue?"*
          - **Sufficient answer:** Yes or No.
          - **Action:**
              - Yes: Proceed with the decision (either alone or with the second opinion).
              - No: If still unresolved, escalate to a third party (e.g., a more senior consultant, a specialty team) or, if time allows, gather more data. In a time-critical situation, you must make the best decision possible and document the uncertainty.

  **Step 5: Document.**
