  **Step 1: Identify the higher-order evidence (HOE) and its type.**
     - Ask: *"What is the evidence about my own reliability that I am considering? Is it:*
        - *(A) Evidence that points to a specific flaw in my reasoning (e.g., I realize I misread a lab value, or I recognize a specific bias)?*
        - *(B) Evidence that suggests my reliability is compromised in a general way without pointing to a specific flaw (e.g., fatigue, general stress, or a statistic about error rates in similar conditions)?"*
     - **Sufficient answer:** A or B (if both, note both but treat separately).
     - **Action:**
          - If A: Proceed to Step 2A.
          - If B: Proceed to Step 2B.

  **Step 2A: Evidence of a specific flaw.**
     - Ask: *"Can I correct the flaw immediately and with high confidence? (e.g., I see that I misread the lab value and I can correct it with the right number; or I recognize that I was biased against the patient and I can consciously adjust by re-examining the data without the bias)"*
          - **Sufficient answer:** Yes or No.
          - **Action:**
              - Yes: Correct the flaw and then reassess the first-order decision. After correction, if the decision becomes clear, decide alone. If not, go to Step 3.
              - No: Proceed to Step 3 (because the flaw cannot be fixed immediately and reliably).

