prompt: |-
  I'm a backend engineer at a mid-size tech company, and I've volunteered to give a lunch-and-learn talk on Bayesian reasoning for my team. Most of us work with A/B testing frameworks and some ML, so the basics aren't foreign, but I want to go beyond "update your priors" and actually get into something philosophically interesting. I've been reading about the problem of old evidence — the puzzle that, in standard Bayesian confirmation theory, evidence you already knew before formulating a hypothesis can't raise its probability (since P(E) is already 1), yet in the history of science, old evidence clearly does confirm new theories. The classic case is the precession of Mercury's perihelion: astronomers knew about it for decades before Einstein's general relativity explained it, and that explanation was treated as strong confirmation of GR.

  I'd like you to act as an expert in Bayesian epistemology and help me plan how to teach this problem to my team in about twenty minutes. Don't explain the problem to me — I've done the reading. Instead, plan the explanatory sequence: what conceptual pieces need to be in place first and in what order (and why that order — what depends on what), what single running example I should use to carry the whole thing (and whether Mercury is the right one or if there's something better for an engineering audience), what misconceptions my colleagues are likely to form — I'm guessing someone will say "just use a counterfactual prior where you pretend you didn't know the evidence" and I need to know why that move doesn't straightforwardly work — and exactly where in the sequence I should head each misconception off. I also want one question I can pose at the end to check whether they've really understood the problem rather than just nodding along. Please think through the dependency structure carefully before laying out the plan, and be explicit about what you'd leave out at this level and why.
reasoning: |-
  We are preparing a 20-minute lunch-and-learn on the problem of old evidence in Bayesian reasoning for an audience of backend engineers familiar with A/B testing and some ML. The goal is to present the philosophical puzzle without getting bogged down in technicalities.

  Key elements to cover:
  1. Quick recap of Bayesian confirmation: evidence E confirms hypothesis H if P(H|E) > P(H). This requires that P(E) < 1 so that E is not already certain.
  2. The problem: when E is already known (so P(E)=1), then P(H|E) = P(H) and E cannot confirm H. But in scientific practice, old evidence (like Mercury's perihelion precession) does seem to confirm new theories (like General Relativity).
  3. Why it matters: it challenges the Bayesian account of scientific confirmation and may require adjustments to the framework.

  Plan the explanatory sequence:

  1. **Start with the Bayesian Confirmation Recap (3 minutes)**
     - Use a simple example: a medical test for a disease.
       - Prior P(D): probability of having the disease.
       - Likelihood P(Pos|D): sensitivity, P(Pos|~D): false positive.
       - Posterior P(D|Pos) = [P(Pos|D) * P(D)] / P(Pos)
     - Point: if we already know the test is positive (E happened), then when we consider the hypothesis D, we have already incorporated E. So if we condition on E, our prior for D would have already accounted for E? Actually, in the standard setup, we are updating on new evidence.

  2. **Introduce the Problem of Old Evidence (2 minutes)**
     - Define: old evidence is evidence that was known before the hypothesis was formulated.
     - In the Bayesian update, if E is already known, then P(E)=1. 
       - Then, by Bayes: P(H|E) = P(H and E) / P(E) = P(H) (because if E is certain, then H and E is just H? Actually, if E is certain, then P(H ∧ E) = P(H) because E is always true. So P(H|E) = P(H).)
     - Therefore, no confirmation.

  3. **The Mercury Perihelion Example (3 minutes)**
     - Why use it? It's the classic case and illustrates the historical importance.
     - Background: Mercury's orbit precession was an anomaly in Newtonian physics (about 43 arcseconds per century unaccounted for). Einstein's General Relativity (GR) predicted exactly that precession.
     - When GR was proposed, the precession was already known for decades. Yet, the scientific community took it as strong confirmation for GR.
     - Problem: According to strict Bayesianism, because the precession was already known (P(E)=1), it should not have increased the probability of GR.

  4. **Common Misconception: The Counterfactual Prior (5 minutes)**
     - What someone might say: "Just imagine you didn't know E and then update on E. Then P(H|E) would be higher than P(H) in that counterfactual state."
     - Why it doesn't straightforwardly work:
       - Which counterfactual prior? The prior we would have had if we didn't know E? But that prior might also be missing other evidence we have, and it's not clear how to construct it.
       - The problem of "which background knowledge to remove?" — we don't just remove E, because E might be connected to other things. For example, if we remove the knowledge of Mercury's precession, we might also have to remove other astronomical data? And what about the fact that Newtonian theory was already in trouble?
       - The counterfactual prior might be ill-defined and subjective. How do we know what we would have believed if we didn't know E?
       - Even if we can define it, the counterfactual update doesn't reflect the actual epistemic state of the scientists who already knew E. The actual confirmation happens in the context of full knowledge.

  5. **Alternative Approaches (Briefly) (3 minutes)**
     - We don't have to solve the problem in 20 minutes, but we can hint at solutions to show it's not hopeless.
     - One approach: Jeffrey conditionalization — but that doesn't directly solve the problem.
     - Another: Change the background knowledge. When we learn a new hypothesis H, we might reevaluate the probability of E. In particular, if H explains E in a way that the old theory did not, then we might say that E was not fully explained and hence was not "certain" in the sense that we were not sure it was inevitable. But this is tricky.
     - The most discussed solution: "Learning the explanatory connection." When we learn that H explains E (which we already know), we are actually learning something new: that H entails E (or makes E very probable). This new proposition, call it "H → E" (or "H explains E"), is what we update on. Then we can have P(H | E, (H→E)) > P(H | E) because we've learned a new fact about the connection. But note: we already know E, so the update is on the connection. However, this move requires that we didn't already know the connection. (This is the approach of Garber (1983) and others.)

  6. **Why This Matters for Engineers (2 minutes)**
     - In A/B testing, we usually encounter new evidence. But what if we have an old dataset and we come up with a new model? Does the old data confirm the new model? The problem of old evidence suggests that if we take the data as given (as part of the background) then it doesn't confirm. But intuitively, a good fit to old data is evidence for a model. So we must be careful in how we set up our priors and updates.
     - Also, in machine learning, when we evaluate a model on a fixed test set, we are using old evidence. The test set was collected before we built the model. But we still consider good performance on the test set as confirmation of the model's quality. How do we justify that in Bayesian terms?

  7. **Check for Understanding Question (2 minutes)**
     - Pose: "Suppose we have an old dataset D that we've had for years. We develop a new model M that fits D very well. Why, in strict Bayesian terms, does D not confirm M? And what is one way philosophers have tried to get around this problem?"

  8. **What to Leave Out**
     - Detailed history of Mercury's perihelion: just the basics.
     - The full philosophical debate and all proposed solutions: we'll focus on one or two.
     - The math of conditionalization beyond the basics: we assume familiarity with Bayes' theorem.

  Sequence with Timing:

  1. (3 min) Recap Bayesian confirmation with a simple example (medical test). Emphasize the requirement that P(E)<1 for updating.
  2. (2 min) State the problem: when E is old evidence (P(E)=1), then P(H|E)=P(H). So no confirmation.
  3. (3 min) Mercury perihelion: the classic case. Explain why it was a problem for Newton and how GR solved it. Then note the paradox: old evidence seemed to confirm GR but Bayesianism says it shouldn't.
  4. (5 min) Address the counterfactual move. Explain why it's natural but problematic: 
     - How do we construct the counterfactual prior? 
     - It's arbitrary: without E, we might have had a different background knowledge. 
     - The counterfactual update doesn't change our actual current beliefs because we are still conditioning on E.
  5. (3 min) Briefly sketch one solution: updating on the explanatory connection. We learn that H explains E, which we didn't know before. So we update on the new information about the connection between H and E.
  6. (2 min) Connect to engineering: old datasets and new models. The challenge of using historical data for validation.
  7. (2 min) Check question: pose the scenario of the old dataset and the new model. Ask for the Bayesian problem and a potential way out.

  Total: 20 minutes.

  Running Example:
  - Use the medical test for the recap to keep it simple and familiar.
  - Then switch to Mercury perihelion for the problem. It's the standard and is compelling. For engineers, we can draw an analogy to having an old bug in the system that a new architecture fixes. But the Mercury example is historically significant and clear.

  Misconceptions to Head Off:
  - The counterfactual prior: address it right after presenting the problem and before giving any solution. Explain why it's not straightforward.
  - Another misconception: "But we don't really assign P(E)=1 to anything." We do for evidence we are certain about. And in the Mercury case, they were certain about the observations.

  Final Check Question:
  - "Why, in strict Bayesian terms, does an old dataset D that we've known for years fail to confirm a new model M that fits D perfectly? And what is one way philosophers have tried to resolve this?"

  This should prompt them to articulate that P(D)=1 so P(M|D)=P(M), and then they might mention either the counterfactual approach (which we've problematized) or the idea of learning the explanatory connection (which we presented).
answer: |-
  ### Lesson Plan: The Problem of Old Evidence in Bayesian Reasoning

  **Audience:** Backend engineers familiar with A/B testing and basic ML (comfortable with Bayes' theorem but not philosophy of science).  
  **Time:** 20 minutes  
  **Goal:** Introduce the conceptual puzzle of old evidence, why it challenges Bayesianism, and why engineers should care—without solving it fully.  
  **Core Tension:** *"Science treats old evidence as confirmation, but Bayesian math says it shouldn’t. What gives?"*  

  ---

  #### **Explanatory Sequence (Dependency Order)**  
  Key dependencies:  
  1. Bayesian foundations → 2. Problem setup → 3. Misconception busting → 4. Why it matters for engineers.  
  *(Philosophical solutions are hinted at but skipped—too deep for 20 mins.)*  

  **Running Example:** **Mercury’s Perihelion Precession** is ideal. It’s historically significant, audibly "sciency," and parallels engineering (anomaly → new model). Avoid alternatives—e.g., cosmic microwave background or ML datasets—as they dilute the "aha!" moment.  

  ---

  #### **Step-by-Step Plan**  
  *(Timings are strict; total 20 mins)*  

  1. **Reset Bayesian Basics (3 mins)**  
     - **Goal:** Reactivate intuition for confirmation as belief update.  
     - **Flow:**  
       - Recap: "Evidence E confirms hypothesis H iff P(H|E) > P(H)."  
       - Simple example: **A/B testing click-through rates.**  
         - *Prior:* P(H) = 0.4 (H: "Variant B is better").  
         - *New evidence E:* A significant result from today’s experiment.  
         - *Update:* P(H|E) = 0.8 → E confirms H.  
     - **Why first?** Anchors the talk in familiar territory. Dependency: Everything builds on this definition.  

  2. **Introduce the Problem (3 mins)**  
     - **Goal:** Show Bayesianism breaks when E is old.  
     - **Flow:**  
       - Define "old evidence": E known *before* H is formulated.  
       - Mercury example:  
         - *E:* Mercury’s orbit precession (observed since ~1850s).  
         - *H:* General Relativity (1915).  
         - Scientists treated E as strong confirmation for H—yet E was "old."  
       - **The math breakdown:**  
         - If E is already known, P(E) = 1.  
         - Bayes: P(H|E) = [P(E|H) * P(H)] / P(E) = [1 * P(H)] / 1 = P(H).  
         - ∴ E *cannot* confirm H. Contradicts history of science!  
     - **Why here?** Sets up the paradox. Dependency: Requires prior understanding of P(H|E).  

  3. **Crush the Tempting Misconception (6 mins)**  
     - **Goal:** Preempt the "obvious fix" engineers will propose.  
     - **Flow:**  
       - *Pose the misconception:* "Just use a counterfactual prior! Pretend you didn’t know E, then update."  
       - *Why it feels right:* Analogous to resetting a simulation (e.g., replaying logs with a new model).  
       - **Why it fails (3 key reasons):**  
         1. *Ill-defined priors:* What *else* changes if you remove E? (e.g., Without Mercury’s data, do you also reset Newtonian physics? Other planetary models?).  
         2. *Subjectivity:* Your counterfactual P(H) is arbitrary (e.g., P(GR) in 1915 without Mercury data could be 0.001 or 0.5—no objective basis).  
         3. *Ignores actual epistemology:* Scientists in 1915 *knew* E. The "confirmation" happened in their heads *with* E as background knowledge.  
       - **Analogize to engineering:**  
         - "Like asking: What if we ignored last year’s production outage when evaluating our new monitoring tool? But we *can’t* ignore it—it shaped our beliefs!"  
     - **Timing:** Address this *immediately* after stating the problem. Dependency: Engineers will think of this fix instantly—stomp it before it sticks.  

  4. **Why Engineers Should Care (3 mins)**  
     - **Goal:** Connect philosophy to real work.  
     - **Flow:**  
       - Cases where old evidence matters in tech:  
         - Re-evaluating an old dataset with a new ML model.  
         - Using historical bugs/outages to validate a new system design.  
       - *The risk:* If old evidence can’t confirm, is your "validation" using historical data Bayesianly invalid?  
       - *Reinforce the tension:* "Science relies on old evidence—so do we. But Bayes seems to forbid it. That’s a problem!"  

  5. **Question to Check Understanding (2 mins)**  
     - **Goal:** Force synthesis of the core idea.  
     - **Pose:** *"Suppose your team has known for years that a critical server crashes every Tuesday (E). Today, you propose a new hypothesis (H): 'It’s caused by cron job overflow.' Why, under strict Bayesianism, does the historical crash data E fail to confirm H—even if H perfectly predicts E? And what’s the intuitive reason this feels wrong?"*  
     - **Why this question?**  
       - Tests grasp of P(E)=1 (math) + the historical-confirmation paradox (philosophy).  
       - The "feels wrong" part probes their sense of scientific practice.  
       - *Ideal answer:* "P(E)=1 so P(H|E)=P(H). But in reality, explaining a known anomaly *should* boost credibility."  

  6. **Closing Hook (1 min)**  
     - "Philosophers *have* proposed fixes—like reinterpreting E as learning H *explains* E. But that’s another talk. For now, remember: Bayes isn’t perfect. Stay skeptical!"  

  ---

  #### **What to Omit (And Why)**  
  - **Solutions (e.g., Garber’s "learning logical connections"):** Too abstract; distracts from the core paradox.  
  - **Detailed Mercury history:** Enough to set the scene, but avoid astronomy lessons.  
  - **Alternative examples (e.g., ML datasets):** Mercury is vivid and minimizes "is this relevant?" debates.  
  - **Objectivity of priors:** A rabbit hole; the counterfactual covers the key engineering intuition.  

  ---

  #### **Anticipated Roadblocks**  
  - **"But in practice, we ignore this!"**  
    - *Response:* "Exactly! The problem exposes a gap between theory and practice. Should we reform Bayes or accept the gap?"  
  - **"Can’t we just set P(E)<1?"**  
    - *Response:* "If you’re certain of E (e.g., Mercury’s data was uncontested), P(E)=1 is correct. Forcing P(E)<1 is cheating the math."  
  - **"Is this relevant to A/B tests?"**  
    - *Response:* "A/B tests use *new* evidence—so no. But when you reuse old data to test a new model? Absolutely."  

  **Success Metric:** If they leave uneasy about "P(E)=1," you’ve won.
