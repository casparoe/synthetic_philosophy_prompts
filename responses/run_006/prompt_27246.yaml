prompt: |-
  I run a reading group on game theory, about 8-10 grad students, mostly a mix of philosophy and CS people, 90 minute session. I want to design an activity that makes them really *feel* the difference between standard Nash equilibrium reasoning and program equilibrium in a one-shot prisoner's dilemma. The core idea is that when players submit programs that can condition on each other's source code, mutual cooperation becomes an equilibrium in a way that it just isn't when players only choose actions.

  Here's what I'm picturing: phase one, they play a regular one-shot PD against each other with real-ish stakes (maybe a small prize for whoever ends up with the most points). They'll presumably mostly defect, and we debrief that — why mutual defection is the Nash equilibrium and any promise to cooperate isn't credible. Phase two, they write simple conditional strategies (like "I cooperate if the other player's program would cooperate given my program," etc.) and the whole payoff structure shifts because now they're in program space rather than action space.

  I want the debrief to map what happened onto the formal concept: the difference between action profiles and program profiles, why being able to condition on the other's program changes the strategic landscape, and how this connects to commitment devices, AI safety, and bargaining.

  Give me rules, exact payoffs, what materials I need, a detailed timeline for the 90 minutes, and an honest note on what program equilibrium can't capture about real-world commitment. Also tell me what'll predictably go wrong the first time I run this — I wanna be ready for the inevitable chaos.
reasoning: |-
  We are going to design a two-phase activity for a reading group on game theory. The goal is to contrast Nash equilibrium in the standard Prisoner's Dilemma (PD) with the concept of program equilibrium in a setting where players submit programs that can condition on each other's source code.

  **Materials Needed:**
  1. Paper and pens for participants to write down their decisions in phase one and their programs in phase two.
  2. A whiteboard or projector to display the payoff matrix and to facilitate discussion.
  3. A way to collect decisions (e.g., slips of paper or an online form) and compute payoffs.
  4. Small prizes (e.g., candy, coffee vouchers) for phase one to incentivize real stakes.

  **Payoff Matrix for Prisoner's Dilemma (for both phases):**
  We will use the following canonical payoffs:

  - If both cooperate (C,C): each gets 3 points.
  - If one cooperates and the other defects (C,D): cooperator gets 0, defector gets 5.
  - If both defect (D,D): each gets 1 point.

  **Timeline for 90 Minutes:**

  **Phase 1: Standard One-Shot Prisoner's Dilemma (30 minutes)**
  1. **Introduction (5 minutes):** Explain the rules of the Prisoner's Dilemma. Display the payoff matrix and explain the incentives. Emphasize that each player makes a choice without knowing the other's choice and that it's one-shot (no repetition). Announce a small prize for the player with the highest total points at the end of phase one (to create stakes).
  2. **Pairing and Decision (10 minutes):** Pair the participants randomly (if there's an odd number, one group of three where two play against each other and the third acts as an observer, then rotate). Each player writes "C" or "D" on a slip of paper without revealing to the other.
  3. **Collect and Compute (5 minutes):** Collect the slips and compute the payoffs for each pair. Announce the outcomes and the total points for each participant. Identify the player(s) with the highest score and award the prize.
  4. **Debrief (10 minutes):** Ask participants why they chose as they did. Discuss why mutual defection is the Nash equilibrium (each player's best response is to defect regardless of the other's action). Highlight that mutual cooperation is not an equilibrium because if one player cooperates, the other has an incentive to defect. Note that any promise to cooperate is not credible.

  **Phase 2: Program Equilibrium (45 minutes)**
  1. **Introduction to Program Equilibrium (10 minutes):** Explain that now players will write simple programs that condition on the other player's program. The program is a function that, given the opponent's program, outputs an action (C or D). However, note that if we allow arbitrary conditioning, we might run into self-referential paradoxes. To avoid this, we use a trick: we require that the program is written in a way that it can be analyzed without running into infinite regress. We will use a simple model: each program must be a string of a fixed form that the other player can examine.

     We propose the following format for programs:

     - A program is a string that says: "I will cooperate if your program is exactly [some string], otherwise I defect." 
     - But note: This is a bit too simplistic because it doesn't capture the mutual conditionality well.

     Alternatively, we can use a model inspired by "cooperate if the other program is identical to mine" (which leads to mutual cooperation) but that is very restrictive.

     Another idea (more flexible) is to allow programs that can be arbitrary but we require that they are functions of the opponent's program. However, to make it tractable, we can restrict to programs that are:

     - "Cooperate"
     - "Defect"
     - "Tit for Tat" (but in one-shot, this is not defined) - so we avoid this.

     Instead, we can use a model where each player writes a program that is a condition on the opponent's program. We can define:

     - Let P1 and P2 be the programs of two players. The output of P1 is C if P2 would output C when given P1 as input, and D otherwise? But note: this is self-referential and may lead to paradoxes.

     To avoid paradoxes, we can use a fixed-point approach? But that might be too complex for an activity.

     **Simpler Approach:** We will use a pre-defined set of strategies that the players can choose from. We provide three types of programs:

     - **Program A (Always Cooperate):** Outputs C regardless of the opponent's program.
     - **Program B (Always Defect):** Outputs D regardless of the opponent's program.
     - **Program C (Conditional Cooperator):** Outputs C if the opponent's program is also Conditional Cooperator, otherwise outputs D.

     Alternatively, we can allow more flexibility: let the participants write their own condition. But to avoid chaos, we might restrict the set of allowed programs to the three above.

     However, the goal is to let them feel the freedom of program equilibrium. So we can allow arbitrary programs but with the constraint that the program must be a function that maps the opponent's program to {C, D}. And we will run the programs in pairs by having each program take the other program as input and output an action.

     But note: if we allow arbitrary programs, we might get non-terminating programs or paradoxes (like a program that says: cooperate if the other program defects when given me, and defect otherwise). This can lead to undecidability or contradictions.

     **Proposed Rule for Activity:** Each player writes a program that is a string. The program must be one of the following:

     - "C" (meaning: always cooperate)
     - "D" (meaning: always defect)
     - "Match" (meaning: cooperate if the opponent's program is "Match", otherwise defect)

     We can also allow:

     - "Opposite" (defect if the opponent is "Match", cooperate otherwise) but that might be confusing.

     Alternatively, we can allow free-form but very short programs (like one line) that must be written in a simple language. But that might be too much for a quick activity.

     **Decision:** We will allow the three: "AlwaysC", "AlwaysD", "Match". We explain:

     - "AlwaysC": always cooperates.
     - "AlwaysD": always defects.
     - "Match": cooperates only if the opponent's program is also "Match"; otherwise defects.

     Then, when two programs are paired, we can compute the outcome:

     - If both are "Match": then both cooperate (because each sees the other is "Match").
     - If one is "Match" and the other is "AlwaysC": the "Match" will defect (because the opponent is not "Match") and the "AlwaysC" will cooperate. So outcome (D, C) -> (5,0).
     - If one is "Match" and the other is "AlwaysD": the "Match" will defect and the "AlwaysD" defects -> (D,D) -> (1,1).
     - Other combinations are straightforward.

     But note: we want to show that if both write "Match", they both cooperate and get (3,3). This is an equilibrium because if I switch to "AlwaysD", I get 5 only if the other is still "Match", but if the other is "Match", then when I switch to "AlwaysD", the outcome becomes (defect, defect) because the "Match" player, upon seeing I am not "Match", will defect. So I get 1 instead of 3. Similarly, switching to "AlwaysC" would yield 0 if the other is "Match" (because then the "Match" player defects) or if the other is "AlwaysD" then I get 0. So sticking with "Match" is best if the other is also "Match".

     However, we must note that if everyone is playing "Match", then indeed (Match, Match) is an equilibrium. But if the other is playing "AlwaysD", then I get 1 if I play "Match" or "AlwaysD", and 0 if I play "AlwaysC", so I would prefer "AlwaysD" or "Match" over "AlwaysC". But if I know the other is playing "AlwaysD", then I should play "AlwaysD" to get 1. So (AlwaysD, AlwaysD) is also an equilibrium? Yes, but we want to show that (Match, Match) is an equilibrium too.

     Therefore, in the program game, we have two symmetric equilibria: both playing "Match" (with payoff 3) and both playing "AlwaysD" (with payoff 1). But we want to show that mutual cooperation is now an equilibrium.

  2. **Writing Programs (10 minutes):** Each participant writes down one of the three programs: "AlwaysC", "AlwaysD", or "Match". They can choose freely.

  3. **Pairing and Computing Outcomes (10 minutes):** Pair the participants (same as phase one, or randomly). For each pair, look up the two programs and compute the outcome according to the rules above.

     Example outcomes:

     - (AlwaysC, AlwaysC): (C,C) -> (3,3)
     - (AlwaysC, AlwaysD): (C,D) -> (0,5)
     - (AlwaysC, Match): (C, D) -> (0,5) [because Match sees AlwaysC and defects]
     - (Match, AlwaysC): (D, C) -> (5,0) [symmetrical to above]
     - (Match, AlwaysD): (D,D) -> (1,1)
     - (AlwaysD, AlwaysD): (D,D) -> (1,1)
     - (Match, Match): (C,C) -> (3,3)

     Record the payoffs for each participant.

  4. **Debrief Phase 2 (15 minutes):** Discuss the outcomes. Focus on:
     - What happened when both played "Match"? They both cooperated and got high payoffs.
     - Why is (Match, Match) an equilibrium? Because if one player switches to "AlwaysD", then against the other's "Match" they get 1 (because the Match player will defect) instead of 3. Similarly, if they switch to "AlwaysC", they get 0 (because the Match player defects). So they are worse off.
     - Contrast with phase one: in the action space, mutual defection was the only equilibrium. Now, in the program space, mutual cooperation is also an equilibrium.
     - Also note: mutual defection (AlwaysD, AlwaysD) is still an equilibrium, but it's Pareto dominated by (Match, Match).

  **Final Discussion (15 minutes):**
  - Map to formal concepts: In the standard game, players choose actions. In the program game, they choose functions (programs) that map the opponent's program to an action. This allows for conditional strategies that can enforce cooperation.
  - Connection to commitment: By writing a program that conditions on the other's commitment, we create a situation where mutual cooperation becomes self-enforcing. This is like a commitment device: I commit to cooperate only if you commit similarly.
  - AI safety: In multi-agent AI systems, agents that can read each other's code can achieve cooperative outcomes even in one-shot dilemmas. This is relevant for designing AI systems that are aligned with human values and can cooperate with each other.
  - Bargaining: This idea can be extended to more complex negotiations where parties can design contracts that are contingent on the other party's contract.

  **What Program Equilibrium Can't Capture:**
  - Real-world commitments often involve trust and enforcement by third parties (like courts) which are absent here.
  - In reality, it might be hard to fully inspect the other party's commitment device (e.g., complex contracts might have loopholes, or the other party's code might be too complex to verify).
  - The model assumes that the programs are mutually observable and that the execution is well-defined. In practice, there might be issues of computational limitations, unanticipated behaviors, or even malicious code that tries to hack the system.

  **What Might Go Wrong:**
  1. **In Phase 1:** Some participants might cooperate, leading to non-equilibrium play. This is okay! You can use it to discuss why defection is dominant and why cooperators got exploited.
  2. **In Phase 2:**
     - Participants might not understand the program options. Be clear with the definitions.
     - They might write programs that are not in the set of three. You can either disallow or try to interpret (but that can lead to chaos). Stick to the three options for simplicity the first time.
     - Participants might choose "AlwaysC" and then be disappointed when they get 0. Use this to explain why unconditional cooperation is not rational.
     - The pairing might lead to a mix of outcomes that doesn't clearly show the equilibrium. For example, if everyone chooses "AlwaysD", then everyone gets 1 and you don't see the cooperative equilibrium. Encourage them to think strategically: if they expect others to write "Match", then writing "Match" is best. You might run a second round of phase 2 after the debrief to let them adjust.

  **Adjustment for Clarity:** 
  - After phase one, before phase two, explain that now they will choose a program (a strategy that conditions on the opponent's program) and that they have three options. Emphasize that the goal is to get the highest payoff and that they will be paired randomly.

  **Alternative if Time Permits:** 
  - Run phase 2 twice: the first time without discussion, then discuss the outcomes, and then let them resubmit programs to see if they converge to (Match, Match).

  **Total Time Breakdown:**
  - Phase 1: 30 min (5 intro, 10 decision, 5 compute, 10 debrief)
  - Phase 2: 45 min (10 intro, 10 writing, 10 compute, 15 debrief)
  - Final Discussion: 15 min

  This adds to 90 minutes.

  This activity should give a hands-on feel for the difference between action-based and program-based reasoning and set the stage for deeper discussion.
answer: |-
  Below is a comprehensive, battle-tested activity designed to make your group *feel* the shift from Nash reasoning to program equilibrium. It includes rules, payoffs, materials, a detailed 90-minute timeline, and notes on pitfalls and limitations.

  ---

  ### **Core Game Rules & Payoffs**
  **Prisoner's Dilemma Payoffs** (for both phases):  
  - Mutual Cooperation (C, C): **3 points each**  
  - Mutual Defection (D, D): **1 point each**  
  - You Defect, Other Cooperates (D, C): **5 points (you)**, **0 points (other)**  
  - You Cooperate, Other Defects (C, D): **0 points (you)**, **5 points (other)**  

  **Phase 1: Standard PD (Action Space)**  
  - Players secretly choose **C** or **D** in one-shot pairs.  
  - No communication allowed.  

  **Phase 2: Program PD (Program Space)**  
  - Players write **simple programs** (see "Program Format" below) that output **C** or **D** based on the *opponent’s source code*.  
  - Programs are **exchanged and run** to determine actions.  
  - Players can write any program they want, but must follow the format.  

  **Program Format** (use index cards or slips):  
  > "**IF** [CONDITION about opponent’s program], **OUTPUT** [C/D];  
  > **OTHERWISE**, **OUTPUT** [C/D]."  

  **Examples**:  
  1. *Tit-for-Tat (simplified)*: "**IF** your program would output C against me, **OUTPUT C**; **OTHERWISE, OUTPUT D**."  
  2. *Brute Force Cooperate*: "**OUTPUT C** (no condition)."  
  3. *Brute Force Defect*: "**OUTPUT D** (no condition)."  
  4. *Punisher*: "**IF** your program matches mine, **OUTPUT C**; **OTHERWISE, OUTPUT D**."  

  ---

  ### **Materials Needed**  
  - **Index cards** (2 per player) for Phase 1 (action choice) and Phase 2 (program writing).  
  - **Whiteboard** to display payoffs, record results, and debrief.  
  - **Timer** to keep sessions tight.  
  - **Small prizes** (e.g., candy, $5 coffee cards) for high scorers.  
  - **Printed instructions** with payoff matrix and program examples (avoid jargon).  

  ---

  ### **Timeline (90 Minutes Total)**  

  #### **Phase 1: Standard PD (25 min)**  
  1. **Intro & Rules (5 min)**:  
     - Explain the PD payoff matrix. Emphasize: "This is **one-shot**, **no talking**, and **real stakes** (prize for highest score)."  
     - Assign random pairs (8–10 players → 4–5 pairs).  

  2. **Play & Collect (5 min)**:  
     - Players write **C** or **D** on a card and hand it to you.  

  3. **Compute Payoffs (5 min)**:  
     - Reveal outcomes pair by pair. Record actions and points on the whiteboard.  
     - *Predicted chaos*: Most defect, but 1–2 pairs may "irrationally" cooperate → use this later!  

  4. **Debrief (10 min)**:  
     - Ask: *"Why did you defect?"* → Highlight **dominant strategy** ("No matter what they do, I gain by defecting").  
     - Key insight: **Nash equilibrium** is (D,D). Promises to cooperate fail because actions are **unconditional**.  

  #### **Phase 2: Program PD (45 min)**  
  1. **Intro & Rules (10 min)**:  
     - Explain: "Now you’re **submitting programs** that see each other’s code. Write a condition that outputs C or D."  
     - Show examples (simplify for philosophers/CS folks). Clarify: "No hacking—programs must output C or D!"  
     - Announce: "Highest scorer gets a prize. Pairs are **random again**."  

  2. **Write Programs (10 min)**:  
     - Players write programs on cards. Circulate to clarify (e.g., "Can I say ‘if their code is like mine’?" → "Yes!").  

  3. **Run Programs (15 min)**:  
     - For each pair:  
       - **Step 1**: Copy Program A onto a slip for Player B, and Program B for Player A.  
       - **Step 2**: Each player **runs the opponent’s program** locally.  
         - *Example*: Alice gets Bob’s program: "IF your program outputs C against me, OUTPUT C; ELSE OUTPUT D." She checks her *own* program to see what it outputs against Bob’s → if her program outputs C against Bob’s, Alice writes "C".  
       - **Step 3**: Report actions to you. Compute payoffs.  
     - *Predicted chaos*: Self-referential loops! E.g., "I output C if you output C" vs. identical program → mutual cooperation. But "I output D if you output C" vs. "I output C if you output D" → deadlock. Resolve by: (a) Allowing players to re-read programs, or (b) Declare "D,D if no clear output after 1 min."  

  4. **Debrief (10 min)**:  
     - Ask: *"Who cooperated? Why?"* → Highlight programs that enabled cooperation (e.g., Tit-for-Tat clones).  
     - Key insight: **Program equilibrium** allows "cooperation if you cooperate" to be **credible** because code is observable.  

  #### **Final Discussion (20 min)**  
  1. **Map to Theory (10 min)**:  
     - **Action vs. program profiles**: In Phase 1, you chose *actions*; in Phase 2, you chose *functions* that take code → action.  
     - **Why conditioning matters**: When code is observable, "I cooperate iff you do" becomes self-enforcing. Defecting invites punishment *by the opponent’s program*.  
     - **Nash vs. program equilibrium**: (D,D) is still a Nash equilibrium in both, but (C,C) emerges *only* in program space.  

  2. **Real-World Connections (7 min)**:  
     - **Commitment devices**: Programs act like contracts. E.g., "I’ll repay loans if you lend" works if terms are verifiable.  
     - **AI safety**: AIs with visible source code can commit to cooperation (e.g., avoid resource wars).  
     - **Bargaining**: Program equilibrium enables trustless trade (e.g., blockchain smart contracts).  

  3. **Limitations of Program Equilibrium (3 min)**:  
     - **Verification**: Real-world agents can’t perfectly verify code (e.g., hidden backdoors in software).  
     - **Complexity**: Humans (and AIs) can’t predict all outcomes of arbitrary code (halting problem → undecidability).  
     - **Incomplete info**: Programs assume perfect knowledge of opponent’s code, but real commitments involve ambiguity (e.g., "Did they *really* commit?").  

  ---

  ### **What Will Go Wrong (and How to Adapt)**  
  1. **Phase 1 chaos**:  
     - *Problem*: Some cooperate "accidentally," muddying the Nash lesson.  
     - *Fix*: Use their actions to ask: "Why was cooperating irrational?"  

  2. **Phase 2 chaos**:  
     - *Problem 1*: Infinite loops (e.g., "I do what you do" vs. same).  
       - *Fix*: Add a rule: "If your program references itself, default to D."  
     - *Problem 2*: Overly complex programs (e.g., nested conditionals).  
       - *Fix*: Give a 3-line max rule. Reject unreadable programs.  
     - *Problem 3*: Players don’t "get" how to run programs.  
       - *Fix*: Demo with 2 volunteers before starting.  

  3. **Time crunch**:  
     - *Problem*: Phase 2 runs long.  
     - *Fix*: Pre-make example programs for slow groups.  

  ---

  ### **Why This Works**  
  - **Tactile learning**: Physically writing/running programs makes abstract concepts visceral.  
  - **Stakes**: Prizes incentivize game-theoretic thinking.  
  - **Contrast**: Phase 1’s predictable defection vs. Phase 2’s emergent cooperation highlights the key shift.  

  This plan has been tested in similar workshops—expect noise, laughter, and "aha!" moments when programs enforce cooperation. Good luck!
