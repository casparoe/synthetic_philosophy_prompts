  Tensions are crucial here. The big one is between non-stipulative projectibility (Desideratum 1) and avoiding ruling out scientific inductions (Desideratum 2). If a theory relies on past usage (like Goodman's entrenchment), it might struggle with novel scientific predicates. Bayesian approaches use priors, but that risks circularity if priors themselves need justification. Also, justifying induction without circularity (Desideratum 3) clashes with providing a non-stipulative account of projectibility—each might require the other.

