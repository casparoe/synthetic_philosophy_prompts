  Okay, let me start by unpacking the user's query. They're deep into the evolutionary debunking literature in metaethics and notice a stalemate. The core debate is between debunkers like Street and Joyce, who argue that evolution shaped moral intuitions without tracking moral truths, and realists like Shafer-Landau, Enoch, and FitzPatrick, who counter with various defenses. The user feels the debate hasn't moved much since the mid-2000s and wants to understand the nature of this impasse and whether it's resolvable.

  First, I need to recall the main arguments from both sides. Debunkers use the "Darwinian Dilemma": if moral realism is true, how did evolution, which selects for survival, not truth, lead us to true moral beliefs? Realists respond in three ways: (1) tracking—evolution did track moral truths because true beliefs were adaptive; (2) self-defeat—the same argument would debunk perception or math; (3) conceptual necessity—moral truths are necessary, so evolution is irrelevant.

  The user points out that both sides agree on the empirical facts but still disagree. So the issue isn't factual. They suggest it might be about burden of proof. But I think it's deeper. Let me break down the possible layers of disagreement.

  One angle is metaphysical commitments. Realists might be committed to non-natural properties, making it inexplicable how evolution could track them. Debunkers see this as a defeater, while realists might not. Then there's the epistemic role of intuitions. If moral intuitions are evidence, but their origins don't track truth, that's problematic. Realists might downplay the origins, focusing on coherence or necessary truths.

  Analogical reasoning is another point. Comparing moral beliefs to perception or math. But are they analogous? Perception has a clear causal link to truth; math is abstract and necessary. Morals might not fit neatly. This ties into what counts as a defeater. For debunkers, any non-truth-tracking origin is a defeater. Realists might require positive defeaters.

  Burden of proof is tricky. Debunkers say realists must show alignment; realists say debunkers must show impossibility. But perhaps it's about explanatory burdens. Realists need to explain how moral truth is accessible, which evolution complicates for non-natural properties.

  Could anything resolve this? Empirical evidence might not help since the debate is conceptual. A formal result in epistemology? Maybe, but uncertain. Or perhaps accepting that foundational differences prevent consensus. But that's unsatisfying. Maybe focusing on moral epistemology's structure without realism vs. anti-realism. Or shifting to practical philosophy.

  The user might want clarity on whether progress is possible. They're likely a grad student or academic in philosophy, seeking deeper understanding or research direction. Their unspoken need could be frustration with the stalemate and a desire for productive paths forward. They might also wonder if their burden of proof hunch is correct. Addressing the underlying philosophical tensions and suggesting alternatives might be key.
answer: |-
  Your diagnosis is perceptive: this impasse is **not primarily empirical or logical** but **metaphysically and epistemologically foundational**. The core disagreement lies in deeper commitments about the nature of morality, epistemic justification, and the explanatory burdens required for realism. Here's a breakdown of the structure and potential escape routes:

  ### The Real Structure of the Impasse
  1.  **Diametrically Opposed Metaphysical Starting Points:**
      *   **Realists (especially non-naturalists):** Are committed to the existence of objective, stance-independent moral truths (often non-natural properties or facts). This commitment *creates* the explanatory burden: *How did creatures shaped by evolution to survive/reproduce come to reliably access these non-natural, non-causal truths?* They view any explanation failing to show this access as *undermining* realism.
      *   **Debunkers:** Start with the *explanatorily complete* causal story of evolution shaping moral intuitions for fitness. They argue that this story makes the *postulation* of realist moral truths **explanatorily redundant or incoherent**. Why posit extra truths if our beliefs are fully explained without them? The burden is on the realist to show why this causal story *isn't* sufficient or *is* compatible with truth-tracking.

  2.  **Deep Disagreement on the Epistemic Role of Origins:**
      *   **Debunkers:** Endorse a strong **Sensitivity Requirement** or **Etiological Requirement** for justification: A belief is justified only if its origins are sensitive to the relevant truth (or if we have positive reason to think they are). Evolution's fitness-tracking, they argue, isn't truth-tracking for realist morality. Therefore, the origins *defeat* the justification of moral intuitions as evidence for moral truth.
      *   **Realists:** Reject this strong etiological requirement. They defend **epistemic pluralism**:
          *   **Coherentism:** Justification comes from integration within a coherent web of belief (e.g., moral + non-moral facts), *not* primarily from causal origins.
          *   **Reliabilism (Contingent):** *If* evolution *did* contingently track truth, then the origins *are* reliable. Debunkers haven't proven it *didn't*.
          *   **Rationalism/Necessity:** For necessary truths (like math or core moral principles), origins are irrelevant to justification. We grasp them through reason.
      *   **The Impasse:** Debunkers see the realist responses as *evading* the core challenge – the *lack of a connection* between the causal origins and the posited truths. Realists see the debunker's etiological requirement as *too strong* and ultimately self-defeating or question-begging.

  3.  **The Burden of Proof is a Symptom, Not the Cause:**
      Your hunch is correct but incomplete. The disagreement *manifests* as a burden-of-proof standoff:
      *   Debunkers demand realists provide a *positive account* of how evolution tracked moral truth ("Show the coincidence isn't coincidental!").
      *   Realists demand debunkers show the tracking is *impossible* ("Why *couldn't* adaptive behavior align with moral truth?").
      *   **Why?** This standoff stems directly from the prior points. The debunker thinks the *mere existence* of a fitness-based explanation *shifts* the burden. The realist thinks the *mere possibility* of alignment (or the irrelevance of origins for necessities) means the burden remains on the debunker to show a *defeater*.

  4.  **Analogy Disputes Reveal Deeper Intuitions:**
      Debates about perception/math aren't just about logic; they expose bedrock intuitions:
      *   **Perception:** Realists see a clear causal link between objects and beliefs, making the analogy apt. Debunkers see the link as fundamentally *different* for non-natural moral facts vs. natural perceptual objects.
      *   **Math:** Realists see the necessity defense as strong. Debunkers (like Street) argue moral truths lack the compelling necessity and universality of math, and our mathematical *intuitions* might still be shaped by evolution for practical purposes, undermining even math realism if the etiological requirement holds.
      *   **The Impasse:** Agreement on the *structure* of the argument doesn't resolve disagreements about the *relevance* and *strength* of the analogies, which depend on deeper views about the nature of morality vs. perception/math.

  ### Can Anything Move the Dial? Prospects are Limited, But Not Hopeless

  1.  **Empirical Findings (Unlikely to Break the Impasse):**
      *   **Finer-Grained Evolutionary Psychology:** Mapping specific adaptive problems to specific moral intuitions might bolster the debunker's case for *local* unreliability (e.g., "disgust tracks pathogens, not objective impurity"), but doesn't touch core concepts (e.g., harm, fairness), and realists can still appeal to contingent alignment or necessity.
      *   **Neuroscience/Cognitive Science:** Showing moral judgment relies purely on emotion or fast, non-deliberative systems might *seem* debunking, but realists can argue this is just the mechanism, not the justification (reason can still evaluate intuitions). Showing it relies on *dedicated, truth-tracking* modules seems implausible for non-naturalism.
      *   **Limitation:** The core disagreement isn't about *which* adaptive pressures shaped intuitions, but whether *any* adaptive shaping *ipso facto* undermines realist truth-tracking. Better empirical data doesn't resolve that philosophical question.

  2.  **Conceptual Distinctions / Formal Results (Slightly More Promise):**
      *   **Refining the "Tracking" Relation:** A precise formal account of what "tracking truth" means in a non-naturalist framework *and* what evolution could realistically achieve might clarify the debate. Can non-natural facts exert *any* causal or counterfactual influence? If not, how *could* evolution track them? This pushes hard on non-naturalism.
      *   **Defining Defeaters:** A rigorous, widely accepted theory of epistemic defeaters *might* help adjudicate whether the evolutionary origin story constitutes an *undercutting defeater* for moral intuitions under realism. Current epistemology lacks consensus here.
      *   **Formalizing Epistemic Dependence:** Work in formal epistemology (e.g., probabilistic dependence) modeling how origins affect the justification of beliefs about different types of truths *could* make the analogies (perception, math, morality) more precise and testable, potentially revealing asymmetries. (This is speculative but promising).
      *   **The "Third Factor" Strategy:** Realists (like Enoch, Wielenberg) propose evolution selects for fitness (F), moral truths (T) promote F, hence beliefs promoting F *can* track T. Debunkers counter that this only works if T *necessarily* promotes F, which is implausible, or if the link is contingent, which leaves the coincidence unexplained. Sharpening this debate is ongoing.

  3.  **Shifting the Focus (More Likely Path Forward?):**
      *   **Moral Epistemology Without Realism:** The debate highlights the difficulty of *accessing* non-natural truths. This might push some towards **naturalist realism** (moral truths are natural facts evolution *could* track – but faces Hume's Law/Open Question) or **constructivist/response-dependent** views (moral truth is constituted by our responses, making evolutionary origins *explanatory*, not debunking – Street's positive view).
      *   **Questioning Bedrock Assumptions:** Challenge non-naturalism itself as implausible given evolutionary constraints. Or challenge the etiological requirement as too skeptical. This doesn't *resolve* the impasse but might shift the metaethical landscape.
      *   **Pragmatic Turn:** Some (perhaps influenced by Parfit) might argue that even if evolutionary origins *undermine justification*, we have overriding *practical* reasons to maintain moral realism for the sake of deliberation and society. This concedes epistemological ground but preserves the realist ontology.

  ### Conclusion: Stalemate with Nuanced Shifts, Not Resolution
  You're right to sense a stalemate. **The core impasse is a clash of fundamentally different philosophical worldviews about the nature of reality, knowledge, and value.** Smart people with different priors (e.g., strong commitment to non-naturalism vs. strong commitment to naturalistic explanation; strong etiological requirements vs coherentist/rationalist pluralism) *will* interpret the same logical structure and empirical data differently.

  *   **Will they converge?** Unlikely on the core metaphysical disagreement. The dialectic will likely continue with refinements (e.g., more sophisticated "third factor" accounts, better analyses of defeaters, exploration of hybrid views).
  *   **Should you move on?** That depends on your goals. If you seek definitive proof for either side, moving on is wise. But if you're interested in the *structure* of deep philosophical disagreement, the challenges of naturalism, the foundations of epistemology, or the viability of different metaethical frameworks, the debate remains incredibly fertile ground. The lack of resolution *is* the philosophical lesson: it reveals how deeply our metaphysical and epistemological commitments shape our interpretation of evidence and argument, even in domains striving for objectivity. The most productive path might be to use the impasse to explore alternatives *to* the realism/robust-debunking dichotomy itself.
