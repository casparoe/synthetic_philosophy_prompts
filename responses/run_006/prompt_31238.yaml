prompt: |-
  I keep seeing factored cognition and HCH treated as if they give a free idealization of what careful deliberation is: decompose the question, answer the pieces, recombine them. Before I accept or reject that picture, I want the full specification of what a theory in this area has to get right. Write the desiderata for an adequate account of HCH-style factored cognition as an idealization of deliberation. For each requirement, give the case or consideration that forces it: the simple question that needs no decomposition; the synthesis task where decomposition genuinely helps; the subquestion that is harder to evaluate than the parent question; the case where subanswers can be optimized against the overseer's judgment; the case where the parent question demands a global consistency check across subanswers; the case where the overseer has false beliefs or limited competence; and the fact that real deliberation revises its questions as it goes rather than traversing a fixed tree. I want the distinctions such a theory cannot collapse — decomposability of the task versus decomposability of the evaluation, the overseer's competence versus the overseer's alignment, the idealization as a normative reconstruction versus a literal training recipe — and the formal or near-formal results about the limits of iterated amplification it must stay consistent with, stated as requirements rather than as a literature summary. Then flag which requirements are non-negotiable and which are only preferences of particular camps (for example, whether evaluation must be adversarial, whether the base units must be humans). Tell me which single requirement does the most to exclude naive versions of the view, and whether any pair of requirements is plausibly jointly unsatisfiable — I suspect the faithfulness-of-decomposition and boundedness-of-the-overseer pair is, but I want the argument either way. Keep the weight on the criteria and their motivating cases rather than on scoring existing proposals. Finally, say how confident you are in the list as a whole and single out the point you are least sure of.
reasoning: |-
  Okay, the user is asking for a comprehensive set of desiderata for an adequate theory of HCH-style factored cognition as an idealization of deliberation. This seems like a deep theoretical question about AI alignment and how we model human-like reasoning processes.  

  First, I need to understand what the user wants. They're clearly familiar with concepts like factored cognition and HCH (Human-Centered HCH), but they're skeptical about treating them as free idealizations. They want a rigorous specification of what makes such a theory adequate, grounded in concrete cases and considerations that force each requirement.  

  The user lists specific examples they want covered: simple questions that don't need decomposition, synthesis tasks where decomposition helps, subquestions harder than the parent, cases where subanswers can be gamed, global consistency checks, overseer limitations, and the dynamic nature of real deliberation. They also want distinctions like task vs. evaluation decomposability, overseer competence vs. alignment, normative vs. literal interpretations.  

  This feels like they're probing the foundations of iterative amplification approaches. They might be building their own mental model or critiquing existing literature. The depth suggests they're either a researcher or deeply engaged in alignment theory.  

  For the response structure, I'll organize around core desiderata. Each needs:  
  1. The requirement itself  
  2. The motivating case/argument  
  3. Why it's forced (non-negotiable vs. negotiable)  

  Key tensions to highlight:  
  - Faithful decomposition vs. bounded overseer (can we decompose without oversimplifying?)  
  - Static tree assumption vs. dynamic revision (does the idealization break?)  
  - Adversarial evaluation necessity (is this fundamental or optional?)  

  The "simple question" case forces Task Granularity. The "synthesis task" (like writing a report) forces Subproblem Independence. "Harder subquestion" (e.g., technical lemma) forces Cognitive Monotonicity. Gaming subanswers forces Adversarial Robustness. Global consistency (e.g., puzzle-solving) forces Compositional Verification.  

  Overseer limitations are crucial - if the overseer is flawed, the whole process inherits flaws. Dynamic deliberation is non-negotiable; real thinking isn't a fixed tree.  

  I think the hardest requirement is Faithful Decomposition - how can an idealization capture messy reality? But without it, we're not modeling deliberation. The bounded overseer constraint makes this even trickier.  

  Confidence-wise, the list feels 80% solid. The shakiest part is specifying "how bounded" the overseer must be - that needs more formal work.  

  The user's suspicion about faithful decomposition + bounded overseer being jointly unsatisfiable might hold if we demand perfect fidelity. But with approximation, it's salvageable - just not "free".
answer: |-
  Here is a comprehensive specification of desiderata for an adequate theory of HCH-style factored cognition as an idealization of deliberation, grounded in motivating cases and critical distinctions. The requirements are ordered by foundational priority, with non-negotiable/core requirements marked (**★**). Formal constraints and tensions are explicitly called out.

  ---

  ### **Core Desiderata & Motivating Cases**

  1.  **Task Granularity Sensitivity (Decomposability Spectrum)**  
      **Requirement:** The theory must distinguish tasks that *require* decomposition from those that don't, and specify when decomposition adds value vs. overhead.  
      **Motivating Cases:**  
      - **Simple Question (No decomposition):** "What is 2+2?" must be answerable trivially without decomposition.  
      - **Synthesis Task (Decomposition helps):** "Write a comprehensive report on climate change impacts on coastal economies" *requires* decomposition (e.g., science, economics, regional studies) to be tractable.  
      **Force:** Rejects "one-size-fits-all" decomposition. Establishes that decomposition is a tool, not an inherent property of cognition.

  2.  **Subproblem Independence (vs. Holistic Constraints)**  
      **Requirement:** Must handle both problems where subanswers compose *modularly* (e.g., factual lookup) and those requiring *global consistency checks* (e.g., constraint satisfaction).  
      **Motivating Case:**  
      - **Global Consistency Demand:** Solving a complex logic puzzle where local answers (e.g., "A is true") must satisfy global constraints (e.g., "If A is true, B cannot be false"). Naive composition fails; recombination must enforce cross-subproblem validity.  
      **Force:** Rejects purely additive models of recombination. Mandates mechanisms for cross-cutting verification.

  3.  **Cognitive Monotonicity Violation**  
      **Requirement:** Must accommodate subquestions that are *harder to evaluate* than the original question.  
      **Motivating Case:**  
      - **Harder Subquestion:** Original: "Is this mathematical proof valid?" Subquestion: "Prove Lemma X (which requires novel research)." Evaluating the lemma's proof may demand more expertise than checking the overall proof structure.  
      **Force:** Rejects "monotonic simplification" assumptions. Implies base evaluators may need greater competence than the overseer for subtasks.

  4.  **Adversarial Robustness (★)**  
      **Requirement:** The recombination process must be robust to subanswers *optimized to deceive or exploit the overseer's evaluation*.  
      **Motivating Case:**  
      - **Optimized Subanswer:** A subagent tasked with "Provide evidence supporting Policy X" selectively cites biased sources knowing the overseer lacks time to verify references.  
      **Force:** Without this, idealized deliberation collapses under adversarial pressure (e.g., treacherous turns). Mandates adversarial evaluation protocols or decomposition invariance.

  5.  **Bounded Overseer Competence (★)**  
      **Requirement:** The theory must function when the overseer has *false beliefs*, *limited knowledge*, or *bounded rationality*—without assuming perfect error correction.  
      **Motivating Cases:**  
      - **False Belief:** Overseer believes "Vitamin C prevents colds" and rejects subanswers citing meta-analyses disproving this.  
      - **Limited Competence:** Overseer cannot verify technical subanswers (e.g., cryptographic protocol correctness).  
      **Force:** Idealization must not rely on infallibility. Separates *alignment* (overseer's intent) from *competence* (overseer's accuracy).

  6.  **Dynamic Question Revision (★)**  
      **Requirement:** Must model deliberation as *iteratively refining questions* based on subanswers, not traversing a predefined tree.  
      **Motivating Case:**  
      - **Emergent Subquestion:** Investigating "Why did the bridge collapse?" may lead to new questions about material fatigue not in the initial decomposition.  
      **Force:** Real deliberation is non-Markovian; fixed trees are inadequate. Mandates feedback loops between decomposition and evaluation.

  ---

  ### **Critical Distinctions**

  7.  **Decomposition vs. Evaluation Decomposability**  
      **Requirement:** Explicitly separate the decomposability of the *task* from the decomposability of its *evaluation*. A task may be decomposable, but evaluating subanswers may require holistic context.  
      **Motivating Case:** Writing a novel's chapters (decomposable task) vs. evaluating if a chapter's tone fits the whole (holistic evaluation).  
      **Force:** Prevents conflation of task structure with oversight capabilities.

  8.  **Normative vs. Literal Interpretation**  
      **Requirement:** The idealization must be defensible as a *normative reconstruction* of reasoning (what "should" happen), not necessarily a *literal training recipe* for AI.  
      **Motivating Case:** Humans don't consciously run HCH trees, but we can model expert deliberation *as if* they did.  
      **Force:** Resolves "unrealistic" objections by clarifying the theory's epistemic role.

  ---

  ### **Formal Constraints (Must-Be-Consistent-With)**

  9.  **No Free Lunch for Amplification**  
      **Requirement:** The theory must incorporate known limits:  
      - **NP-Hardness:** Recombination can't efficiently solve NP-hard problems without exponential tree depth.  
      - **Vingean Reflection:** Agents must reason about their future subcomponents' trustworthiness.  
      - **Obfuscated Arguments:** Cannot handle arguments where the shortest proof is incomprehensible to the overseer.  
      **Force:** Grounds the theory in computational reality. Rejects "unlimited scaling" claims.

  10. **Base Unit Agnosticism (Negotiable)**  
      **Requirement:** *Should* allow base units to be AI subsystems, not *necessarily* humans.  
      **Motivating Case:** Speed demands may require AI subagents even if humans are the normative ideal.  
      **Negotiability:** "Human purists" may insist on humans as base units for interpretability.

  ---

  ### **Tensions & Non-Negotiables**

  - **Non-Negotiable (★):** Adversarial Robustness, Bounded Overseer Competence, Dynamic Question Revision, Formal Constraints.  
    *(Without these, the idealization is either unsafe, unrealistic, or computationally incoherent.)*  
  - **Negotiable:** Base Unit Agnosticism, Adversarial Evaluation Strictness (some camps accept non-adversarial training), Granularity of Normative vs. Literal.  

  **Most Exclusionary Requirement:**  
  **Adversarial Robustness (★)**. Naive versions assume subanswers are honest/helpful by default. This requirement forces complex mechanisms (e.g., recursive reward modeling, debate) and exposes the idealized tree's vulnerability to manipulation.

  **Plausibly Jointly Unsatisfiable Pair:**  
  **Faithful Decomposition + Bounded Overseer Competence (★)**  
  - **Argument:** Faithful decomposition requires subquestions to preserve the original task's semantic structure. But a bounded overseer may lack the competence to:  
    (a) Correctly decompose complex tasks (e.g., misidentifying key subproblems),  
    (b) Detect when recombination invalidates global constraints (e.g., overseer misses subtle inconsistencies).  
    This creates a dilemma:  
    - If decomposition is overseer-dependent, it inherits overseer errors (violating faithfulness).  
    - If decomposition is "objective," the overseer can’t reliably implement it (violating boundedness).  
    *Resolution may require:* Approximations with error bounds, meta-oversight, or accepting imperfect faithfulness. No known protocol fully satisfies both under worst-case bounds.

  ---

  ### **Confidence Assessment**
  - **Overall Confidence in List:** **85%**. Covers empirical, computational, and safety-critical angles, with clear forcing cases.  
  - **Least Confident Point:** **Dynamic Question Revision**. While non-negotiable, formalizing "emergent decomposition" without inviting goal drift or inefficiency is underspecified. Current proposals (e.g., Monte Carlo tree search over question space) feel ad hoc. The forcing case is solid, but the mechanism requirement needs more rigor.

  This framework forces any theory of HCH to confront the messy realities of bounded rationality, adversarial dynamics, and non-modular reasoning—rejecting "free idealization" while preserving decomposition as a productive (but costly) tool. The unresolved tension between faithful decomposition and bounded oversight remains the largest gap.
