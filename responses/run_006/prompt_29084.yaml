       - After the game, ask groups to share:
           - Their claim
           - How many reasons they provided
           - Which exit they chose and why
           - Their final score

       - Then map to the three theories.

       - Highlight: 
           - If they declared something basic, they acted like foundationalists. They bought an endpoint but gave up on further justifiability.
           - If they looped back, they acted like coherentists. They bought a system of mutual support but gave up on non-circularity.
           - If they refused to stop (and especially if they went until the end and chose infinitism with 0 cost), they acted like infinitists. They bought the idea that justification can continue indefinitely but gave up on completeness.

