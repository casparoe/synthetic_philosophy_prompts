answer: |-
  ## Proposal: Structured Dependence and the Asymptotic Hope of Condorcet – Salvaging Democratic Epistemic Power

  **1. Precise Research Question:**  
  *Under what specific conditions of structured informational dependence among voters does the Condorcet Jury Theorem's (CJT) asymptotic result – majority accuracy converging to 1 as group size increases – persist or fail, despite the violation of voter independence?*

  This question demands a *determinate answer*: It seeks to identify the *types* and *architectures* of dependence (e.g., specific communication networks, deliberation rules, influence mechanisms) that either preserve the CJT's convergence property or definitively undermine it, moving beyond the generic observation that dependence exists.

  **2. Why the Literature Leaves it Open:**  
  Existing scholarship overwhelmingly treats the violation of independence as a *categorical* problem for CJT's applicability:
  *   **The Standard Critique:** Focuses on demonstrating how dependence *can* lead to lower group accuracy than independence (e.g., through information cascades, polarization, common sources of error). This rightly highlights a problem but treats all dependence as uniformly detrimental to the CJT's core asymptotic claim.
  *   **Naive Optimism:** Some deliberative democratic theories assume deliberation inherently improves judgment but often lack rigorous models of *how* specific deliberative structures interact with the CJT's logic and the asymptotic property.
  *   **The Gap:** Crucially, there is a lack of *systematic investigation* into whether *specific, structured forms of dependence* that involve evidence-sharing or limited, rational influence might actually *sustain* or even *accelerate* the convergence predicted by CJT, even if initial accuracy dips. The literature largely fails to:
      *   Develop a taxonomy of dependence distinguishing *information sharing* (potentially accuracy-enhancing) from *conclusion copying* (potentially accuracy-degrading).
      *   Rigorously model the *asymptotic behavior* of group accuracy under these different structured dependencies within large groups.
      *   Identify the *threshold conditions* (e.g., network connectivity, signal strength, susceptibility to influence) where beneficial dependence preserves convergence versus where detrimental dependence irrevocably breaks it.

  The question remains open because the focus has been on the *possibility of failure* under dependence, not a structured analysis of the *possibility of persistence* under specific, realistic forms of non-independence.

  **3. Method & Work Plan (12 Months):**

  *   **Months 1-2: Conceptual Groundwork & Taxonomy:**
      *   Refine the distinction between "evidence-centric" dependence (sharing raw signals/data/arguments) and "conclusion-centric" dependence (copying votes/interpretations).
      *   Develop a formal taxonomy of dependence structures: hierarchical (experts/leaders), small-group deliberation within larger vote, random networks, scale-free networks, common signal sources with varying reliability.
      *   Precisely define key variables: signal strength, noise, influence weight, network density, deliberation depth.

  *   **Months 3-6: Formal Modeling & Asymptotic Analysis:**
      *   Construct agent-based models (ABMs) simulating large electorates (n >> 1000).
      *   Implement distinct dependence structures:
          *   *Model A (Evidence-Sharing Networks):* Agents receive private signals + signals from neighbors (within defined networks) *before* forming independent judgments/votes. Vary network structure & signal reliability.
          *   *Model B (Deliberative Subgroups):* Agents form small deliberative groups (simulated by Bayesian updating on shared signals or averaging judgments), then vote independently. Vary subgroup size & composition rules.
          *   *Model C (Conclusion Cascades):* Agents sequentially observe predecessors' votes/conclusions and update beliefs probabilistically (e.g., DeGroot-like models or bounded rationality cascades). Vary susceptibility.
          *   *Model D (Common Source):* All agents receive signals from a common (potentially biased or noisy) source *in addition* to private signals. Vary source reliability/bias.
      *   For each model, systematically vary key parameters (initial competence, signal strength, influence weight, network properties) and run extensive Monte Carlo simulations.
      *   **Core Analysis:** Track *majority accuracy* as `n` increases significantly. Does it reliably *converge to 1*? If so, how fast compared to classic CJT? If not, at what point (n, parameter values) does it plateau or decline? Identify phase transitions.

  *   **Months 7-8: Analytical Verification & Edge Cases:**
      *   Where possible, derive analytical results or approximations for the asymptotic behavior in simpler versions of Models A & B to verify ABM findings.
      *   Explore edge cases and robustness: very low initial competence, high levels of noise, adversarial network structures, presence of stubborn/minority-view agents.

  *   **Months 9-10: Synthesis & Democratic Implications:**
      *   Synthesize findings: Which structured dependencies reliably preserve asymptotic convergence? Under what parameter bounds? Which reliably destroy it?
      *   Formulate clear "resilience conditions" for the CJT under dependence.
      *   Begin translating formal results into implications for institutional design: What do resilient structures (e.g., specific evidence-sharing networks, deliberative mini-publics feeding into larger votes) suggest about feasible democratic practices?

  *   **Months 11-12: Dissertation Chapter Drafting & Refinement:**
      *   Write the core dissertation chapter integrating conceptual framing, model descriptions, key results, and initial normative implications.
      *   Refine based on advisor feedback.

  **4. Success & Failure Criteria:**

  *   **Success:**
      *   **Minimal:** Identify *at least one specific, reasonably realistic model of structured dependence* (e.g., evidence-sharing in certain network configurations, deliberation in small subgroups with independent voting) where the asymptotic convergence of majority accuracy to 1 is demonstrably preserved under a plausible range of parameters (e.g., initial competence > 0.5, sufficient signal strength). This proves the *possibility* of salvaging the asymptotic hope.
      *   **Robust Success:** Identify *multiple* such resilient structures and characterize the key features enabling resilience (e.g., predominance of evidence-sharing over conclusion-copying, limits on influence susceptibility, network connectivity). Formulate clear "resilience conditions."
      *   **Full Success:** Additionally, demonstrate that these resilient structures can *sometimes outperform* independent voting in terms of *speed of convergence* or *robustness to lower initial competence*, providing a stronger case for structured dependence.
      *   Clearly delineate the types/conditions of dependence that *do* fatally undermine asymptotic convergence (e.g., strong cascades, highly centralized unreliable common sources).

  *   **Failure:**
      *   **Conceptual Failure:** The evidence/conclusion dependence distinction proves untenable or irrelevant to asymptotic behavior in all modeled scenarios.
      *   **Empirical Failure (of Core Hypothesis):** Under *no* modeled structure of dependence, including those emphasizing evidence-sharing and limited rational influence, does majority accuracy reliably converge to 1 as `n` increases, even under favorable parameters. Convergence always plateaus below 1 or declines for large `n` in these models.
      *   **Inconclusive:** Results are highly sensitive, chaotic, or dependent on unrealistic parameter values, preventing clear conclusions about the persistence of the asymptotic property under any non-trivial dependence.

  **5. Realistic Scope (One Dissertation Chapter):**  
  This project provides a **proof of concept and initial mapping**, not a comprehensive theory. The scope is deliberately constrained:

  *   **Focus:** Exclusively on the *asymptotic convergence property* under structured dependence. It does not aim for a full-blown "Generalized CJT" predicting exact probabilities for finite `n` under all dependencies.
  *   **Models:** Develops and analyzes a representative but limited set of tractable models (evidence-sharing networks, deliberative subgroups, cascades, common source) to explore distinct *types* of dependence relevant to democratic practice. It won't model every conceivable structure.
  *   **Complexity:** Agents are modeled with bounded rationality (Bayesian updating where feasible, simpler heuristics otherwise). Deep psychological or sociological factors are abstracted into parameters (influence weight, signal noise).
  *   **Normative Implications:** The chapter will *outline* the implications for democratic theory (e.g., value of institutions promoting evidence-sharing over opinion-cascades) but a full normative defense of specific institutions belongs in subsequent chapters/thesis sections.
  *   **Empirical Validation:** This is a *theoretical modeling* chapter. Potential empirical tests (e.g., lab experiments, case studies of specific institutions) are noted for future work but are beyond this chapter's scope.

  This chapter will demonstrate *whether* and *under what specific conceptual conditions* the Condorcet Jury Theorem's most powerful claim – the infallibility of large majorities – retains relevance in a world where voters are inevitably interconnected, providing a crucial foundation for re-evaluating democratic epistemology.
