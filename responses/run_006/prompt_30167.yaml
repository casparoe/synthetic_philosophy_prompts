  - **Local vs. whole-space**: Most changes feel local (e.g., tripping over a boy’s leg), but the story-space itself expands via flash-forwards showing ripple effects on side characters. That’s a whole-space shift—the knob here is "depth of consequence."  
  - **New knobs?** The third run introduces Lola’s scream (a supernatural agency), which isn’t just adjusting a variable—it’s a new rule. The film also adds the casino scene (luck as a force), bending reality. These aren’t knob-turns; they’re new dials.  

