  Honest conclusion: The film uses Hofstadter-esque variations brilliantly for the first two runs, but the third run breaks the model to make a point about human ingenuity. For the novelist’s worry, this is key—mechanical variation *can* become invention if it accumulates into a meta-argument. The user’s "pivotal afternoon" might need one run that bends its own rules to feel earned.  

