  ok so my friend has these really specific views about when something is bad for a person and ive been keeping track:

  - your spouse cheats on you for years but you die suddenly without ever finding out. she says: not bad for you.
  - you go through a painful surgery and then get a drug that completely erases your memory of it. she says: it was bad for you while it was happening.
  - after you die, someone destroys your reputation and everyone remembers you as a monster. she says: not bad for you.
  - a five-year-old kid dies painlessly in an accident. she says: thats bad for the kid, a real misfortune.
  - a ninety-five-year-old dies peacefully in their sleep after a long good life. she says: not bad for them.

  now heres the new case: a thirty-five-year-old dies instantly and painlessly in a car crash. they had a happy life, people they loved, and a lot they were looking forward to. is it bad for them?

  im trying to figure out what rule shes running, what other rules fit her verdicts just as well, and whether those rules converge or split on the thirty-five-year-old. if they split, which rule do you think shes actually using and why? and if they converge, whats the case that would finally tell them apart? also if her verdicts are secretly inconsistent — if no single principle actually captures all five — id want to know where the tension is.

  (and please write in american english, my friend will definitely notice if i start using british spellings)
