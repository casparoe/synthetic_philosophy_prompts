prompt: |-
  I'm a PhD student in political science working on the methodology of social explanation, and I've been reading a lot of macroeconomics lately. There's a practice in that field that I can't quite get a handle on philosophically, and I'd like your help reconstructing what it presupposes.

  Since the 1970s, the dominant norm in macroeconomics has been that models require "microfoundations": you cannot simply posit a relationship between aggregate variables — say, between the interest rate and total investment — because that relationship is not a stable law of nature. It summarizes the decisions of many individuals, and when policy or circumstances change those individuals' incentives, the aggregate relationship may shift. So the norm goes: you must derive all aggregate behavior from the optimizing choices of individual agents. This is widely treated as a commitment to methodological individualism.

  But here is the practice that puzzles me. The standard workhorse model that satisfies this requirement is the representative agent model, which treats the entire economy as a single infinitely-lived household. The representative agent's consumption, labor supply, and savings are, by construction, identical to the per-capita aggregates. The model then explains the time path of GDP, employment, and the price level by solving this one agent's optimization problem, given exogenous shocks and a policy rule.

  What I cannot figure out is what this practice actually presupposes about the relationship between individual-level facts and social-level facts. On one reading, the representative agent model seems to presuppose that the social level is nothing over and above the individual level — that the economy really is, somehow, like an individual scaled up. But that is a very strong metaphysical claim, and I doubt most macroeconomists would endorse it if pressed. On another reading, the model is just a convenient fiction: we do not actually believe the economy is a person, but models that treat it as one happen to fit the data well enough. But if that is the case, the microfoundations requirement looks hollow — it is satisfied by a modeling trick that assumes away the very aggregation problem the requirement was supposed to solve.

  What I would like from you is a reconstruction of the implicit theory of social ontology that this practice presupposes. In particular: (1) What are the different things "microfoundations" could be — a metaphysical thesis about what social facts consist in, an explanatory norm about what counts as a good explanation, or a pragmatic modeling constraint? (2) On which of these readings does the representative agent framework actually satisfy the requirement, and on which does it fail? (3) Is the practice internally consistent, or does it presuppose one thing about the individual–social relationship when it demands microfoundations and a different thing when it deploys the representative agent? (4) If the practice were reformed to take its own commitments seriously, what would have to change — would macroeconomics need heterogeneous agent models, or would it need to abandon the microfoundations requirement, or is there a third option?
reasoning: |-
  Hmm, this is a fascinating methodological puzzle from a political science PhD student. They're grappling with the philosophical tension in macroeconomics between the demand for microfoundations and the use of representative agent models. 

  The core paradox they've identified is quite brilliant: if microfoundations require grounding aggregate phenomena in individual behavior, how can treating the entire economy as a single super-individual possibly satisfy that requirement? It seems to either make a bizarre metaphysical claim or render the microfoundations project hollow.

  Let me break this down systematically. First, we need to disentangle what "microfoundations" actually means in practice. From what I know of economic methodology, it operates on at least three distinct levels:
  - Metaphysically, it gestures toward ontological individualism (social facts supervene on individual facts)
  - Methodologically, it demands explanations showing how aggregates emerge from individual choices
  - Practically, it requires mathematical derivations from optimization problems

  The representative agent model really only satisfies the practical level - it's a mathematical shortcut that technically derives aggregates from "an" individual. But philosophically, it completely bypasses the aggregation problem by assumption. When RBC models use a single agent standing for millions, they're not showing how interactions produce emergent phenomena - they're assuming emergence doesn't happen.

  The inconsistency becomes stark when we consider policy analysis. Microfoundations were originally meant to prevent Lucas Critique problems - the idea that aggregate relationships break when policies change incentives. But representative agent models are spectacularly vulnerable to this exact problem! If my "agent" is just a mirror of aggregates, it has no independent behavioral content to ground counterfactuals.

  For a field that prides itself on rigor, this is quite a blind spot. Most macroeconomists would probably defend representative agents as "good enough approximations," but that reveals their microfoundations commitment is really just instrumentalist - whatever works for forecasting. The irony is that heterogeneous agent models with actual strategic interactions (like OLG or agent-based models) better fulfill the original microfoundations vision, but they're computationally messy.

  If macroeconomics took its microfoundations rhetoric seriously, we'd see more work on:
  - Strategic complementarities and coordination problems
  - Distributional effects beyond the mean
  - Truly decentralized equilibrium concepts
  But that would require abandoning the elegant tractability of representative agents. The field seems to value mathematical convenience over philosophical consistency - a tension worth exposing.
answer: |-
  Your analysis cuts to the heart of a profound methodological tension in macroeconomics. Let's reconstruct the implicit social ontology underlying this practice, addressing your questions systematically:

  ### (1) What "microfoundations" could be
  - **Metaphysical thesis**: The claim that social facts *are nothing but* the vector of individual actions and mental states (strong ontological individualism).
  - **Explanatory norm**: The requirement that aggregate phenomena *must be explained by* showing how they emerge from individual choices under constraints (methodological individualism).
  - **Pragmatic constraint**: A modeling convention insisting that aggregate equations *must be mathematically derived* from individual optimization problems (operational formalism).

  In practice, the macroeconomic mainstream adopts primarily the **pragmatic constraint**, pays lip service to the **explanatory norm**, and largely ignores the **metaphysical thesis** except rhetorically.

  ### (2) How representative agent (RA) models satisfy/fail these readings
  | Reading              | Does RA satisfy? | Why? |
  |----------------------|------------------|------|
  | **Metaphysical thesis** | ❌ Fails | Assumes away aggregation by construction. The RA is *not* an individual but a mathematical homunculus standing for aggregate outcomes. |
  | **Explanatory norm** | ❌ Fails | Provides no account of how individual interactions produce emergent phenomena. The RA's "choices" are tautologically identical to aggregates. |
  | **Pragmatic constraint** | ✅ Satisfies | Formally derives aggregate equations from an optimization problem (even if the agent is fictional). This satisfies the letter but not spirit of the requirement. |

  ### (3) Internal consistency critique
  **The practice is fundamentally inconsistent:**  
  - When demanding microfoundations, it presupposes **emergentism** (aggregates are non-tautological outcomes of complex interactions).  
  - When using RA models, it presupposes **reductionism** (aggregates behave *as if* chosen by a single optimizer).  

  This creates a **performative contradiction**: The Lucas Critique (which motivated microfoundations) asserts that aggregate relationships break when policies alter individual incentives. But RA models are *especially vulnerable* to this critique because:  
  - The RA's "preferences" are reverse-engineered from historical data  
  - Policy changes may alter real-world distribution or coordination effects that the RA framework assumes away  

  ### (4) Reform paths for consistent practice
  To resolve this tension while preserving insights:

  | Reform Path | Implications | Challenges |
  |------------|--------------|------------|
  | **Embrace true microfoundations** (Heterogeneous Agent models) | • Explicit aggregation over diverse agents<br>• Emergent properties from interactions<br>• Policy analysis with distributional effects | • Computational complexity<br>• Identification problems<br>• Less elegant theorizing |
  | **Reconceive microfoundations** (Structuralist turn) | • Treat institutions/aggregates as real constraints<br>• Microfoundations as *boundary conditions* not reduction<br>• Example: Minskyian financial instability | • Loses "rigor" of optimization<br>• Requires new equilibrium concepts |
  | **Pragmatic instrumentalism** (Explicitly abandon MI) | • Judge models by predictive success alone<br>• Use RA as reduced-form approximation<br>• Acknowledge fictionalism | • Undermines Lucas Critique defense<br>• Returns to pre-1970s "ad hoc" modeling |

  ### Philosophical Reconstruction: The Implicit Ontology
  Macroeconomics implicitly operates with a **contextual emergentism**:  
  - **Individualism as regulative ideal**: Agents are the *only causal engines*, but their interactions create "supervenient facts" (e.g., inflation expectations) that become real constraints.  
  - **Epistemic concession**: RA models treat emergence as *negligible* for certain questions, assuming aggregation is "approximately linear" (a claim empirically falsified by financial crises).  
  - **Methodological dualism**: The *demand* for microfoundations reflects a commitment to *explanation*; the *use* of RA reflects a commitment to *prediction* under technical constraints.

  This reveals a **Kantian pragmatic turn**: RA is a "necessary fiction" that makes modeling possible given cognitive/computational limits, despite knowing it misrepresents ontology. The field's persistence with RA suggests most macroeconomists prioritize:
  1. Mathematical tractability  
  2. Policy-relevant forecasting  
  3. Internal consistency of formal systems  
  ...over ontological accuracy or explanatory depth.

  **Conclusion**: The practice isn't philosophically defensible but reflects disciplinary path dependence. A reformed macroeconomics would likely involve heterogeneous agents + institutional structures, accepting that *some* aggregate entities (e.g., currency systems) have irreducibly social properties. This would align better with political science's understanding of institutions while preserving rigor—but requires abandoning the RA shortcut that currently lets macroeconomics have its individualist cake while eating aggregate data too.
