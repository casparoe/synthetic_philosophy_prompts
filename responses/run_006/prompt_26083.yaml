answer: |-
  ## Final Exam Question: Indirect Normativity & The Idealization Dilemma

  **Instructions:** Write a well-structured essay (1500-2000 words) addressing the following prompt. Your essay must engage critically with the specified dilemma and compare at least two distinct idealization frameworks. Merely summarizing theories is insufficient; your argument must diagnose and compare how each framework confronts the core structural problem.

  **Prompt:** The project of grounding normativity via idealized procedures (e.g., full information, idealized agreement, coherent extrapolation) faces a persistent structural dilemma: idealization seems either **normatively loaded** (presupposing the very norms it seeks to ground, rendering the account circular) or **normatively inert** (failing to generate genuinely normative conclusions from purely descriptive inputs). Analyze this dilemma in depth. Focusing specifically on **Railton’s full-information account of an individual’s good** and **Scanlon’s ideal contractualism (what no one could reasonably reject)**, diagnose *how* and *why* each framework is impaled on one horn of this dilemma or struggles to escape it. Does either framework offer a more plausible path for evading the dilemma? If so, why? If not, what does their shared vulnerability reveal about the prospects for grounding normativity through idealization? Your argument must hinge on a comparative assessment of their *structural commitments* regarding idealization itself.

  ---

  ## Model Answer (Approx. 900 words)

  The quest to ground normativity—moral truths, reasons, or value—in something less mysterious than irreducible normative facts often leads to appeals to idealized deliberation. The promise is that what an idealized agent would desire, choose, or agree to under specified non-normative conditions (full information, rationality, impartiality) *constitutes* the normative truth. However, this project founders on a devastating structural dilemma concerning the nature of the idealization itself. If the idealization procedure incorporates normative elements (e.g., specifying *which* information matters, *what* counts as "rational" deliberation, or *who* qualifies as "reasonable"), it appears circular, presupposing the norms it aims to ground. Conversely, if the idealization is defined in purely descriptive, non-normative terms (e.g., mere factual omniscience, causal coherence, psychological extrapolation), it seems incapable of generating genuinely normative *authority*; it tells us what *would* happen, not what *should*. This essay argues that both Peter Railton’s full-information account of an individual’s good and T.M. Scanlon’s ideal contractualism fall prey to this dilemma, albeit impaled on different horns due to their distinct structural commitments. Neither offers a convincing escape, revealing the deep challenge of insulating idealization from either circularity or impotence.

  Railton’s account defines an individual’s non-moral good as what they *would* desire they desire, were they to possess "full factual information" and undergo "cognitive psychotherapy" – essentially, full awareness of all relevant non-normative facts and freedom from cognitive distortions. Railton insists this idealization is purely descriptive: it involves only causal processes of belief acquisition and desire formation under maximal factual input. This commitment aims to avoid normative loading; the idealization doesn't presuppose value judgments about *which* desires are better or *how* one *ought* to deliberate. It simply predicts the outcome of a specific causal process applied to the agent's existing psychology. However, this very purity drives Railton onto the horn of normative inertness. The output of this idealized causal process is merely a *prediction* about a hypothetical psychological state. Why should this *de facto* desire possess normative authority for the *actual* agent? Why *ought* they to pursue it? Railton suggests the link lies in the fact that this desire survives maximal scrutiny by the agent's own standards. But this appeal to "the agent's own standards" smuggles in normativity. If "standards" are just current psychological facts, they may be flawed; if "standards" refer to what *should* guide the agent, normativity is presupposed. The purely descriptive idealization lacks the resources to bridge the is-ought gap; it generates a hypothetical *is* (the idealized desire) but cannot derive a prescriptive *ought* binding the actual agent without implicitly invoking a normative principle (e.g., "one ought to satisfy desires formed under full information"). Railton's structure renders his account vulnerable to inertness because it meticulously excludes any normative element *from the idealization itself*, leaving it unable to confer normative force.

  Scanlon’s contractualism, in contrast, explicitly embraces normative elements within its idealization to avoid inertness, but thereby risks circularity. He grounds the wrongness of acts in their being forbidden by principles that no one could "reasonably reject" given a desire to find principles others similarly motivated could not reasonably reject. Crucially, the "reasonable rejection" test is the engine of normativity. However, "reasonable" is inherently normative. What counts as a "reason" for rejection? What makes a rejection "reasonable"? Scanlon stipulates that reasons must be "generic" and appeal to the "standpoint" of individuals affected, excluding "bare preferences" and requiring a kind of impartiality. This specification is essential for generating substantive moral conclusions – excluding, say, rejecting a principle simply because it forbids torturing kittens for fun. Yet, this is where the normative loading charge bites. The constraints on what constitutes a "reasonable" reason (e.g., generic, impartial, non-trivial) are themselves substantive normative commitments concerning what *counts* as a morally relevant consideration. They reflect a prior conception of the moral point of view. Scanlon attempts to derive these constraints from the "motivation" of finding mutually acceptable principles, but this motivation itself presupposes a normative ideal of justifiability to others. The idealization (the procedure of reasonable rejection) is constitutively dependent on these normative inputs ("reasonableness," "generic reasons," "standpoint"). Therefore, the account appears circular: it grounds morality (wrongness) in an idealized agreement procedure that is itself defined using moralized concepts ("reasonable," "justifiable"). Scanlon’s framework is impaled on the loading horn because its idealization procedure is structurally built around normatively rich concepts necessary for it to yield moral conclusions, making it unsuitable as a *reductive* grounding strategy.

  Does either framework offer a better escape route? Railton’s structure seems fundamentally incapable of generating normativity from inert inputs; adding even a thin normative bridge (e.g., "you should care about your idealized self's desires") reintroduces loading. Scanlon arguably embraces the circularity as virtuous, claiming the contractualist procedure elucidates the structure of moral reasoning rather than reducing it to the non-normative. However, this concedes the point for foundationalist projects seeking non-circular grounding. His framework cannot evade the *structural* charge that its idealization is constitutively dependent on prior normative commitments. Scanlon might offer a *more coherent* account of moral *deliberation* by making its normative structure explicit, but it fails as a strategy to *ground* normativity outside that structure.

  The comparative vulnerability reveals a profound challenge. Railton-type accounts, prioritizing descriptive purity to avoid circularity, sacrifice normative oomph. Scanlon-type accounts, incorporating normativity to generate substantive conclusions, sacrifice reductive grounding. Railton succumbs to inertness due to his *exclusion* of normativity from the idealization procedure; Scanlon succumbs to loading due to the *essential incorporation* of normativity *into* the idealization procedure. Their shared vulnerability stems from the dilemma's core: any idealization procedure capable of yielding genuinely normative conclusions *must* incorporate normative elements (risking circularity), while any procedure avoiding such elements entirely cannot yield normative conclusions (suffering inertness). This comparative analysis suggests the dilemma is not an accidental flaw in specific implementations but a structural feature of the idealization strategy itself. It points towards the difficulty, perhaps impossibility, of fully reducing or grounding normativity in a non-question-begging way through idealized procedures alone. The foundations of normativity may ultimately require acknowledging irreducible normative elements that no idealization can conjure from purely descriptive dust.

  ---

  ## Marking Scheme (Total: 40 Marks)

  **Six Must-Hit Points (5 marks each, total 30 marks):**

  1.  **Accurate & Precise Dilemma Formulation:** Clearly articulates both horns (normative loading/circularity vs. normative inertness/impotence) and the structural problem they pose for grounding normativity via idealization.
      *   *Weak Answer:* Vaguely describes the dilemma, conflates horns, or fails to explain why it's a problem for *grounding*.
      *   *Full Marks:* Provides a sharp, concise formulation highlighting the tension between grounding ambition and the horns' implications.
  2.  **Relevant Framework Exposition (Railton):** Accurately explains Railton's full-information account *specifically focusing* on the nature of its idealization procedure (full factual info + cognitive psychotherapy) and its intended non-normative character.
      *   *Weak Answer:* Summarizes Railton's view generally but doesn't isolate and analyze the structure of the *idealization procedure* itself.
      *   *Full Marks:* Precisely identifies the components of Railton's idealization and emphasizes his commitment to its descriptive, non-normative nature.
  3.  **Loading/Inertness Diagnosis (Railton):** Diagnoses *how* Railton's framework is vulnerable (primarily to inertness) due to its structural commitments regarding idealization, explaining *why* the purely descriptive procedure struggles to generate normativity.
      *   *Weak Answer:* States Railton faces inertness but doesn't clearly link it to the *structure* of his idealization (descriptive purity) or explain *why* it fails to generate normativity (is-ought gap).
      *   *Full Marks:* Clearly argues that Railton's structural choice (descriptive idealization) *causes* the inertness problem, explaining the gap between hypothetical desire and normative authority.
  4.  **Relevant Framework Exposition (Scanlon):** Accurately explains Scanlon's contractualism *specifically focusing* on the "reasonable rejection" test and the inherently normative elements embedded within it (reasonableness, generic reasons, standpoint).
      *   *Weak Answer:* Summarizes Scanlon's view generally but doesn't isolate and analyze the normatively loaded concepts *within* the idealization procedure ("reasonable rejection").
      *   *Full Marks:* Precisely identifies the normatively rich components (reasonableness, generic reasons) integral to Scanlon's idealization procedure.
  5.  **Loading/Inertness Diagnosis (Scanlon):** Diagnoses *how* Scanlon's framework is vulnerable (primarily to loading/circularity) due to its structural commitments regarding idealization, explaining *why* incorporating "reasonableness" presupposes norms.
      *   *Weak Answer:* States Scanlon faces loading but doesn't clearly link it to the *essential role* of normative concepts *in* the idealization procedure or explain *why* this undermines grounding.
      *   *Full Marks:* Clearly argues that Scanlon's structural choice (building normativity *into* the procedure) *causes* the circularity problem, demonstrating how "reasonableness" relies on prior moral concepts.
  6.  **Comparative Assessment & Escape Evaluation:** Compares the *reasons* why each framework lands on its specific horn (Railton's inertness due to exclusion vs. Scanlon's loading due to inclusion) and assesses whether either offers a more plausible escape, explaining why/why not. Draws a conclusion about the implications.
      *   *Weak Answer:* Lists the vulnerabilities separately without meaningful comparison of their structural causes, or offers superficial/unsubstantiated claims about escape or implications.
      *   *Full Marks:* Provides a clear comparative diagnosis of *why* the structural differences lead to different horns, offers a nuanced evaluation of escape attempts linked to these structures, and draws insightful conclusions about the dilemma's severity.

  **Overall Argument Quality, Originality, and Clarity (10 marks):**
  *   **Structure & Flow (3 marks):** Logical progression, clear signposting, seamless integration of points supporting a central thesis.
  *   **Argumentative Depth & Insight (4 marks):** Moves beyond description to critical analysis, demonstrates independent thought, shows sophisticated understanding of the dilemma's nuances and the frameworks' deeper tensions. (e.g., recognizing Railton's potential thin normativity bridge, Scanlon's non-reductive aims).
  *   **Clarity & Precision (3 marks:** Writing is concise, precise, avoids jargon or uses it accurately, free of grammatical errors that impede understanding.
