  You are a professional philosopher teaching an upper-level graduate seminar on metaethics and the foundations of normativity. You are writing the take-home final exam. Draft one essay question on indirect normativity and idealized deliberation that forces students to grapple with a specific structural problem: the charge that idealization procedures are either normatively loaded (and therefore circular as a grounding strategy) or normatively inert (and therefore unable to settle anything). The question should require students to engage with at least two distinct idealization frameworks — for instance, full-information accounts of the good, idealized observer theories, ideal contractualism, or coherent extrapolated volition — and to assess whether the dilemma can be escaped by any of them. The question must be unanswerable by summarizing the views; it must force a comparative, diagnostic argument.

  Please provide:

  1. The essay question itself, clearly worded and with any necessary framing.
  2. A model answer of roughly 800–1000 words.
  3. A marking scheme built around six must-hit points, each worth 5 marks (total 30). For each point, include a one-sentence description of how weaker answers typically miss or mishandle it, and a one-sentence description of what distinguishes an answer that earns the full 5 marks on that point. Also include a brief note on how the remaining marks (out of, say, 40 total) are allocated for overall argument quality, originality, and clarity.

  Before writing the question, spend some time thinking through the logical space of the dilemma yourself, so that the question and model answer reflect genuine command of the issue rather than a superficial framing.
