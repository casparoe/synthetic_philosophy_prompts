  - **Fully distinguishable leaves**: All leaves are structurally distinct, capturing mutually exclusive commitments (e.g., Leaf E attacks the use of $X$, Leaf A/B attack equiprobability, Leaf C attacks the implication of benefit, Leaf H attacks finite expectations).
