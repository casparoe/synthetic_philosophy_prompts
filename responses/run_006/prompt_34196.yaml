prompt: |-
  I'm leading a discussion section for an undergraduate epistemology course, and next week I have forty minutes to walk the students through the surprise exam paradox. They've just finished a unit on the KK principle and epistemic closure, so they have the technical vocabulary and have seen some of the ways self-referential epistemic claims can go wrong, but they haven't encountered this paradox before. I want them to leave understanding not just where the students' reasoning in the story collapses, but why it's so tempting — why smart people keep rediscovering this argument and feeling its pull even after being told it fails.

  I don't need you to explain the paradox to me; I need a plan for how I should explain it to them. What has to be established first, before I even state the paradox, so that the backward induction lands with its full force rather than seeming like a cheap trick? What one example or scenario should carry the whole thing through, and what features must it have — how many days, what kind of announcement, what stakes? I'm especially worried about the misconceptions they'll form along the way: the idea that the paradox just shows backward induction is invalid in general, the idea that it's all a semantic trick about the word "surprise," the idea that the teacher's announcement is straightforwardly a lie. I need to know where in the sequence each of these will arise and how to head it off before it hardens. Finally, I want to end with one question that tells me whether they've actually grasped the epistemic structure of the paradox — the way the students' own reasoning about their future knowledge undercuts their present knowledge — rather than just enjoyed the puzzle.

  Please give me your answer as exactly five numbered items, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is teaching an undergraduate epistemology course and needs a lesson plan for the surprise exam paradox. They're focusing on ensuring students grasp why the reasoning is tempting and where it fails, not just the paradox itself.

  The user has covered the KK principle and epistemic closure, so students understand concepts like knowledge of knowledge and how justification can transfer between propositions. The surprise exam paradox builds on that by involving self-referential epistemic claims about future events.

  I need to provide a structured plan with exactly five numbered items, concise and direct. Key elements: establish a base case before stating the paradox to make backward induction intuitive, choose the right scenario to avoid misconceptions, and end with a diagnostic question.

  For the scenario, a five-day week is ideal—long enough to show the induction but short enough to handle in class. The announcement must be clear: the exam will happen on one day and be a surprise, meaning no prior knowledge on the morning of.

  Common misconceptions to address: invalidating backward induction generally, semantic tricks with "surprise," or thinking the teacher lied. I should sequence the lesson to preempt these. For instance, start with a one-day case to show surprise is possible, then build to multiple days.

  The core issue is the epistemic structure: reasoning about future knowledge undermines present knowledge in a self-defeating way. The closing question should test if they see that dynamic, not just the puzzle.

  Plan outline: 1. Define surprise in epistemic terms using the KK principle context. 2. Use a one-day case to show surprise is possible. 3. Introduce a two-day case to demonstrate backward induction and its failure. 4. Extend to five days, highlighting the paradox's pull. 5. End with a question about how students' reasoning sabotages their knowledge.

  This should help students understand why the argument is tempting and why it collapses epistemically.
answer: |-
  1. Begin by defining a "surprise exam" operationally in epistemic terms: an exam on day *n* is a surprise only if, on the morning of day *n*, the students (justifiedly) do not yet know the exam will be that day, leveraging their understanding of the KK principle to emphasize that their *knowledge* of their future epistemic state is key.  
  2. Present a concrete, minimal case with only one possible exam day (e.g., Friday) and the teacher's announcement; demonstrate that the exam *can* still be a surprise because, on Friday morning, the students lack knowledge of the exam occurring that day (preempting the "teacher lied" misconception by showing surprise is coherent here).  
  3. Introduce a two-day scenario (e.g., Thursday/Friday), explicitly modeling the students' backward induction: "If no exam by Thursday end, then Friday's exam wouldn't be a surprise (we'd know Thursday night), so it can't be Friday; thus, we know it must be Thursday... but then Thursday's exam wouldn't be a surprise!" Highlight that the breakdown occurs precisely when they conclude "Therefore, we know it must be Thursday," as this claim relies on their *current* knowledge of their *future* epistemic state invalidating the surprise.  
  4. Scale to five days, stressing that the intuitive pull comes from the inductive step seeming airtight at each iteration ("Day *n* is eliminated because if it gets to *n*, we'll know"), and preempt the "backward induction is invalid" misconception by contrasting this with unproblematic uses (e.g., chess endgames), noting the difference is the self-referential epistemic prediction about their own future knowledge states.  
  5. End by asking: "In the five-day case, explain exactly how the students' reasoning on, say, Monday night, about what they would know on Thursday night (if no exam yet), prevents them from having the knowledge they think they have on Monday night." (This tests their grasp of the self-undermining epistemic structure).
