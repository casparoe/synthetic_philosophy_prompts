prompt: |-
  I'm a graduate TA, and in one fifty-minute section I need to introduce first-year students to Kant's Formula of Universal Law. Don't explain it to me; plan how I should explain it. I need the dependency structure: what has to be in place before the test itself makes sense, why empirical consequences are the wrong currency, the one worked example that should carry the section and what it must have and lack, and a sequence for the contradiction-in-conception versus contradiction-in-will distinction so that the perfect/imperfect duty divide emerges rather than being announced. I expect these misconceptions: that the test is just the Golden Rule, that universalizing means imagining a world where everyone does the act and asking whether you would like the outcome, that a maxim is just an intention or just the action, and that a contradiction here is a clash of desires. Tell me where in the sequence each is likely to form and how to head it off, what to explicitly leave out at this level, and one closing question whose answer would show whether they have grasped the test itself rather than memorized the false-promise case.
reasoning: |-
  Okay, the user is a graduate TA preparing a 50-minute section on Kant's Formula of Universal Law for first-year students. They need a structured plan focusing on dependencies, common misconceptions, and a clear sequence leading to the perfect/imperfect duty distinction. 

  First, I need to assess the core challenges. The students are freshmen with no Kant background, so I must avoid jargon and build concepts step-by-step. The biggest hurdle will be displacing their intuitive "consequentialist" thinking—they'll naturally want to evaluate actions by outcomes rather than logical consistency. 

  The dependency chain is crucial: Good Will → Duty → Maxims → Universalization Test. I'll anchor this in moral phenomenology they recognize (that nagging "should" feeling when tempted to cheat). Skipping Good Will would make Duty seem arbitrary. Without Duty, Universal Law appears like a game of logic. 

  For the worked example, false promises are perfect because they're relatable and cleanly show a contradiction-in-conception. But I must explicitly strip away consequences—no "what if banks collapse?" distractions. The contradiction is in the concept of promising itself becoming impossible. 

  Ah, the misconceptions! Three will erupt predictably: 
  1. Golden Rule confusion (around Step 3)—I'll preempt by contrasting "want others to do" vs. "could all do logically." 
  2. Consequentialist misreading (during universalization)—I'll forbid "would you like it?" questions. 
  3. Maxim vagueness (when drafting examples)—I'll drill specificity: "I will [action] in [circumstance] for [purpose]." 

  The contradiction-in-will transition is delicate. After nailing false promises (perfect duty), I'll pivot to a non-beneficial example like never helping others. The "could I will this?" move shifts focus from logical possibility to rational coherence of my entire agency. That's where imperfect duties emerge organically. 

  For the closing, I need a diagnostic question testing procedure, not case memory. "What's step two after stating your maxim?" forces them to articulate universalization as logic-checking, not outcome-simulation. 

  ...*checks clock* Better cut the suicide maxim example—too ethically loaded for intro. Charity is safer. Also, skip Kingdom of Ends entirely; that's Lecture 3 material. Strict 50-minute budget means sacrificing interesting asides about maxim rigor for clarity. 

  Final touch: the whiteboard sketch. Columns for each test stage with color-coded misconceptions crossed out. First-years eat that up.
answer: |-
  Here's a battle-tested 50-minute section plan for introducing the Formula of Universal Law (FUL), structured for clarity and pre-empting common errors:

  **Core Goal:** Students grasp FUL as a *procedural test of a maxim's logical coherence under universalization*, distinguishing it from consequence-based ethics and common misconceptions.

  **Time Breakdown & Sequence:**

  1.  **Hook & Foundational Concepts (10 mins):**
      *   **(2 min) The Moral Intuition:** Start with a relatable scenario (e.g., considering cheating on a quiz because you're unprepared). Ask: "What *stops* you? Is it *just* fear of getting caught? Or is there a sense it's *wrong* even if you get away with it?" Elicit the idea of an internal "should/shouldn't" (duty).
      *   **(5 min) Good Will & Duty:** "Kant says the ONLY thing good without qualification is a *Good Will* – acting *because* it's the right thing, *from duty*, not desire or consequence." Contrast acting *in accordance* with duty (good outcome) vs. *from* duty (right motive). **Why?** FUL tests the *principle* (maxim) behind the action, stemming from duty. *Skip:* Deep metaphysics of freedom/will.
      *   **(3 min) What's a Maxim? (CRITICAL):** "Your maxim is your *personal rule* for acting. It has 3 parts: **1. Action** (What will I do?) **2. Circumstance** (Under what conditions?) **3. Purpose** (To achieve what end?)." **Example:** "I will [*make a false promise to borrow money*] when [*I'm in financial trouble*] in order to [*get out of difficulty without having to repay*]." **Pre-empt Misconceptions:** "It's NOT just the action ('lying'). It's NOT just a vague intention ('to help myself'). Be SPECIFIC!" *Head off:* Vague "intention" or "action-only" views.

  2.  **Introducing the Formula & Why Not Consequences (7 mins):**
      *   **(2 min) The Formula:** State FUL clearly: "Act only according to that maxim whereby you can at the same time will that it should become a universal law." Write it out.
      *   **(5 min) The Wrong Currency - Consequences:** "Kant says consequences CAN'T be the basis for moral law. Why? Because consequences are messy, unpredictable, and depend on luck/skill. Morality must be based on something rational and within our control – our *reason* and the *principle* we choose." **Analogy:** "Judging the morality of a math proof by whether the answer is nice (consequence) vs. whether the logic is sound (principle)." **Why?** Sets the stage for the test being about *logical coherence*, not outcomes.

  3.  **The Test: Universalization & Contradiction-in-Conception (15 mins):**
      *   **(5 min) The Procedure:** Explain the 4 steps clearly:
          1.  **Formulate** your maxim precisely (Action + Circumstance + Purpose).
          2.  **Universalize** it: Imagine a world where *everyone* *always* acts on that maxim *in those circumstances*.
          3.  **Look for a Contradiction:** Can this maxim even *exist* as a universal law? Does it lead to a logical impossibility?
          4.  **Judge:** If YES (contradiction), the action is forbidden. If NO (no contradiction), it *may* be permissible (but see step 4 later).
      *   **(10 min) Worked Example - False Promise (The MUST-HAVE Case):**
          *   **Maxim:** "I will make a false promise to borrow money when I am in financial trouble in order to get out of difficulty without having to repay."
          *   **Universalize:** Imagine a world where *everyone*, whenever they need money, makes a false promise to borrow it with no intention to repay.
          *   **Contradiction?** YES! The very *concept* of a "promise" collapses. If everyone knows promises are lies, *no one would believe them*. Promising *requires* an expectation of truthfulness to have meaning. Universal false promising destroys the institution it relies upon. It's like a universal law saying "Everyone should play chess by moving the king like a knight" – it destroys chess. **What it MUST HAVE:** Clear logical contradiction destroying the very concept/means used in the maxim. **What it MUST LACK:** Discussion of consequences ("banks would collapse," "no one would lend"). **Pre-empt Misconceptions:** "We are NOT asking: 'Would I like living in that world?' (Golden Rule confusion) or 'Would it cause bad things?' (Consequentialism). We are asking: 'Does this world make the *action itself logically impossible or self-defeating*?'" *Head off:* Golden Rule, Consequentialist Misreading, "Clash of Desires" (it's not about *wanting* the world, it's about its logical coherence).

  4.  **Contradiction-in-Will & Imperfect Duties (13 mins):**
      *   **(5 min) Transition - A Case Without Conceptual Contradiction:** Use **Refusing All Help (Non-Benevolence)**. Maxim: "I will never help others in need when I easily could, in order to focus solely on my own comfort and security."
          *   **Universalize:** A world where *no one ever helps anyone* in need.
          *   **Contradiction-in-Conception?** NO. The concept of "helping" isn't destroyed. People *could* theoretically survive (though miserably). The world is coherent, just awful.
      *   **(5 min) Contradiction-in-Will:** "But *could I rationally WILL* this to be a universal law?" Emphasize "will" as a *rational agent*. "As a rational being who necessarily has needs and desires, I know I *will* need help from others at some point. If I will a world where *no one ever helps*, I am simultaneously willing that I receive no help when I need it. This undermines my own rational agency and ends. There's a *practical contradiction* in my *own will*." **Emergence of Imperfect Duty:** This shows the maxim cannot be *rationally willed* universally, so the *opposite* (helping others sometimes) becomes an *imperfect duty* – required, but we have latitude in when/how.
      *   **(3 min) Contrast:** Recap False Promise (Conceptual Contradiction → Perfect Duty: *Never* do this) vs. Refusing Help (Volitional Contradiction → Imperfect Duty: *Must sometimes* do the opposite). **Pre-empt Misconceptions:** Reinforce that the contradiction is *in the rational will of the agent*, NOT a clash of *desires* ("I want help but don't want to give it"). *Head off:* "Clash of Desires" misconception.

  5.  **Consolidation & Diagnostic Question (5 mins):**
      *   **(2 min) Recap the Core:** FUL tests the *logical coherence* (conceptual) and *rational coherence of the agent's will* (volitional) of a maxim under universalization. It's about principle, not outcomes. Duty flows from reason.
      *   **(3 min) Diagnostic Closing Question:** "**What is the *very specific question* Kant's test forces us to ask in Step 3 after we've imagined the maxim as a universal law?**" (**Target Answer:** "Can this maxim even *conceiveably exist* as a universal law without contradiction?" OR "Does universalizing the maxim lead to a logical contradiction in conception or a contradiction in my own rational will?"). **Why this question?** It forces them to articulate the *essence* of the test (logical/volitional contradiction) rather than just recalling the false promise outcome. Memorizing the case won't answer it correctly; understanding the procedure will.

  **What to Explicitly Leave Out:**
  *   Kingdom of Ends formulation.
  *   Detailed metaphysics of freedom/noumenal self.
  *   Complex debates about maxim description (e.g., level of generality).
  *   Other formulations of the Categorical Imperative (beyond brief mention that FUL is one version).
  *   Detailed discussion of imperfect duties beyond the basic distinction emerged from the examples.

  **Key Teaching Moves Throughout:**
  *   **Relentless Focus on Logical Coherence:** Constantly steer away from "what ifs" about outcomes.
  *   **Whiteboard is Your Friend:** Map out the maxim structure, the universalization steps, and the two types of contradiction side-by-side with examples.
  *   **Active Learning:** Ask students to formulate maxims for simple actions. Ask *them* what Step 3 asks *before* giving the answer.
  *   **Pre-emptive Strikes:** Name the misconceptions ("Some people think this is like the Golden Rule...") *just before* they are likely to arise in the sequence and explain *why* Kant's approach is different.
  *   **"Rational Agency" Language:** Hammer the idea that the contradiction-in-will is about undermining oneself *as a rational being with needs/ends*.

  This sequence builds logically, isolates the core procedural test, uses the essential examples effectively, surgically addresses predictable errors, and provides a clear diagnostic for understanding. Good luck!
