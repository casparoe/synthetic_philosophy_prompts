          - The cycle: 
               Step 1: They paid 101 at t0 for the bond.
               Step 2: They sold the bond for 100 at t1.
               This cycle left them with 99 tokens, a loss of 1 token.
          - If the trader repeated this, they would lose more.
          - Defenses:
               - "I'll just refuse the final trade": But at t1, they want to sell because they prefer 100 now. They are not forced.
               - "The trades feel different at each step": True, because of changing preferences. But that's the problem.
          - Commitment devices: They could have committed at t0 to not sell at t1. How? By making it impossible or costly to sell.

     What the game cannot reproduce:

          - In the classic money pump argument, the cycle can be repeated infinitely, draining the victim. We only did one cycle.
          - We assumed that the trader can make these offers. In reality, the victim might learn, but in the model, they don't.

     We will have to supply in the debrief:
          - The theoretical argument that if preferences are dynamically inconsistent, a trader can exploit this repeatedly.
          - The connection to hyperbolic discounting.

     Let's write the game procedure.

     **Game Procedure**:

     - **Initial Setup**:
          - Each participant starts with 100 tokens.
          - The facilitator explains: "This is a game about investment and patience. There will be two decision points. You will be offered investment opportunities. Your goal is to accumulate as many tokens as possible. At the end, tokens can be exchanged for small prizes (e.g., candy, small toys)."

     - **Round 1 (t0, at the beginning)**:
          - "You are offered a bond that will pay 110 tokens in 20 minutes. The price to buy this bond is 101 tokens. Do you want to buy it? Circle Yes or No on your decision sheet."
          - Participants circle their choice privately.
          - The facilitator collects the sheets and records who bought. For those who bought, deduct 101 tokens (they now have -1 token balance? No, they had 100, so after paying 101, they have -1? That's not possible. They can't go negative.)

     We must ensure they have enough to buy. If they buy, they must have at least 101 tokens. So we give them 100 tokens initially and the bond costs 101? That won't work.

     Revised: 
          Initial tokens: 200.
          Bond price: 101.

     Then:

          Non-buyers: 200.
          Buyers: 200 - 101 = 99 tokens left, and a bond.

     Then at t1, if they sell, they get 100 tokens -> 99 + 100 = 199.
          If they hold, at t2 they get 110 -> 99 + 110 = 209.

     And the ones who sold have 199, which is less than non-buyers (200) and less than if they held (209).

     But 199 is not less than 200? It's 1 token less.

     We want them to end up with less than 200. So we need the bond price to be more than 100 and the buyback to be less than 100.

     How about:

          Initial: 200 tokens.
          Bond price at t0: 102 tokens.
          Buyback price at t1: 100 tokens.
          Bond payoff: 110 tokens at t2.

          If they buy and sell: 200 - 102 + 100 = 198 tokens.
          Non-buyers: 200 tokens.

     Then they are worse off by 2 tokens.

     And if they buy and hold: 200 - 102 + 110 = 208 tokens.

     So the numbers work.

     Steps:

          t0: Buy bond for 102 tokens -> if yes, balance becomes 200-102=98 tokens, plus a bond.
          t1: Sell bond for 100 tokens -> balance becomes 98+100=198 tokens.
          t2: If not sold, bond pays 110 -> balance becomes 98+110=208.

     So final token counts:

          Non-buyers: 200
          Buyers who sold: 198
          Buyers who held: 208

     And note: 198 < 200, so they are strictly worse off than if they hadn't played.

     This meets the requirement.

     Revised numbers in the game:

          Initial endowment: 200 tokens.
          Bond cost: 102 tokens.
          Bond payoff: 110 tokens at t2.
          Buyback price at t1: 100 tokens.

     Now, will they buy at t0? 110 in 20 minutes for 102 now -> gain of 8 tokens in 20 minutes.
     Will they sell at t1? 100 now vs 110 in 10 minutes -> they might sell because 100 now is immediate and they discount the future heavily.

     We hope so.

     **Predictable issues and handling**:

     - **Issue 1**: Participants might not buy the bond at t0 because 8 tokens gain in 20 minutes might seem too small.
          - **Handling**: Increase the bond payoff. Make it 115 tokens. Then bond cost 102, payoff 115 -> gain 13 tokens. This might be more attractive.

     - **Issue 2**: At t1, participants might not sell for 100 because they think waiting 10 minutes for 110 is worth it (10 tokens gain in 10 minutes).
          - **Handling**: Reduce the buyback price? But then we risk not inducing the present bias. Alternatively, increase the buyback price to 108? Then if they sell, they get 108 now and have 200-102+108=206, which is above 200. We want them to end up below 200.

          We want: 
              buy and sell: 200 - 102 + [buyback] < 200  => [buyback] < 102.

          So the buyback must be less than 102. We set it to 100, which is 10 tokens less than the bond payoff, hoping that at t1 they prefer 100 now over 110 in 10 minutes.

          We could try a buyback of 105? Then:

              buy and sell: 200-102+105=203 -> which is above 200, not worse off.

          So we cannot set the buyback above 102. We must set it below 102.

          How about buyback = 101? Then:

              buy and sell: 200-102+101=199.

          Still below 200.

          And at t1: 101 now vs 110 in 10 minutes. They might still sell because 101 now is immediate and they might discount the future heavily enough.

          But 101 now is very close to 102 (what they paid) and they would incur a loss of 1 token if they sell, but they get it now. They might not sell.

          We want them to sell, so we need to make the buyback more attractive relative to waiting. We can try to set the buyback to a number that is still below 102 but not too low, and hope that the immediacy trumps.

          Alternatively, we can use a different set of rewards that are not linear in tokens? Or use a different good.

     Given the time, we'll go with:

          Bond cost: 102
          Bond payoff: 115 at t2  (so gain 13 tokens in 20 minutes)
          Buyback at t1: 105 tokens   [note: 105 < 102? No, 105>102, so then they would have a gain of 3 tokens if they sell: 200-102+105=203]

          We cannot have buyback above 102 if we want them to end up below 200.

     So let's set buyback to 100 tokens and bond payoff to 115.

          buy and sell: 200-102+100 = 198 (<200)
          buy and hold: 200-102+115=213

          At t0: 115 in 20 minutes for 102 now -> attractive.
          At t1: 100 now vs 115 in 10 minutes. We hope many will take 100 now.

     This might work.

     **Final Design**:

          - Participants start with 200 tokens.
          - Round 1 (t0): Offer a bond that costs 102 tokens and pays 115 tokens in 20 minutes. (Record who buys.)
          - Round 2 (t1, 10 minutes later): To those who bought, offer to buy back the bond for 100 tokens now. (Record who sells.)
          - Round 3 (t2, 20 minutes from start): Pay 115 tokens to those who still hold the bond.

     **Debrief Structure**:

          1. Reveal the outcomes:
               - Non-buyers: 200 tokens.
               - Buyers who held: 200 - 102 + 115 = 213 tokens.
               - Buyers who sold: 200 - 102 + 100 = 198 tokens.

          2. Ask: Why did some of you buy at t0? (Because 115 in 20 minutes > 102 now)
          3. Ask those who sold at t1: Why did you sell? (Because at that moment, 100 now > 115 in 10 minutes)
          4. Point out the reversal: 
               - At t0: 115 at t2 > 102 at t0.
               - At t1: 100 at t1 > 115 at t2.
               - But note: at t0, they would have known that at t1 they would be offered 100 at t1, and they would have preferred to wait for 115. Yet they still ended up selling.

          5. Introduce the money pump argument:
               - A trader can exploit this by:
                     Step 1: Sell you the bond at t0 for 102.
                     Step 2: Buy it back at t1 for 100.
                     The trader makes 102 - 100 = 2 tokens, and you are left with 198 tokens, a loss of 2 tokens from your initial 200.
               - If this cycle repeats (with similar bonds), you keep losing.

          6. Defenses:
               - "I'll just refuse the final trade": But at t1, you want to sell because you prefer 100 now. You are not forced externally, but by your own preferences.
               - "The trades feel different at each step": True, but that's the dynamic inconsistency. The problem is the change in preference.

          7. Commitment: You could, at t0, commit to not sell at t1. How?
               - Example: Give the bond to a friend with instructions not to sell it until t2.
               - Or use a commitment device that burns a token if you sell early.

          8. What the game does not show: 
               - The infinite cycle: we only did one cycle.
               - In reality, the victim might learn, but the model assumes they don't.

     We then reveal the name "money pump" and explain it is a classic argument against dynamic inconsistency.

     This should fit in two hours with time for discussion.
answer: |-
  Below is a structured in-class game designed to induce a money pump scenario through dynamic inconsistency (present bias), tailored to your workshop constraints. Participants will make choices between smaller-sooner and larger-later rewards using tokens, culminating in a cycle that leaves them worse off. The debrief maps the experience to formal concepts without revealing the "money pump" label until the end.

  ---

  ### **Game Design: "Time-Token Trade"**
  **Objective**: Participants encounter a money pump by reversing preferences as rewards approach, allowing a designated trader to exploit cycles of trades that leave them worse off.

  **Participants**: 12 adults (engineers/grad students).  
  **Duration**: 60-75 minutes (setup, gameplay, debrief).  
  **Materials**: 
  - Tokens (e.g., poker chips) tracked on personal sheets.
  - Timer for delays.
  - Decision cards for choices.
  - Trader role (assigned to one participant or facilitator).

  #### **Setup (10 mins)**  
  1. **Initial Endowment**: Each participant receives **100 tokens**.  
  2. **Reward Structure**:  
     - **Option A**: Smaller-sooner reward (e.g., 10 tokens in 10 mins).  
     - **Option B**: Larger-later reward (e.g., 15 tokens in 20 mins).  
  3. **Trader Role**: Assign one participant as the **Trader** (or the facilitator acts as trader). The Trader can propose trades at any time but cannot coerce; participants freely accept/reject.  
  4. **Rules Briefing**:  
     - "You’ll make choices between rewards at different times. Tokens convert to prizes (e.g., snacks, stickers) post-game."  
     - "The Trader may offer to buy/sell your future rewards. Trades are binding once accepted."  
     - **Hide the money pump intent**; frame it as "studying time preferences."

  #### **Game Phases (40 mins)**  
  **Phase 1: Baseline Choice (t=0 mins)**  
  - Participants choose between:  
    - **Option A1**: 10 tokens in **10 mins**.  
    - **Option B1**: 15 tokens in **20 mins**.  
  - *Expected outcome*: Most choose **B1** (larger-later), as both rewards are in the future (low discounting).  

  **Phase 2: Mid-Game Reversal (t=10 mins)**  
  - At the 10-min mark, Option A1 is now *immediate*. Offer participants who chose B1:  
    - **Option A2**: 10 tokens **NOW** (instead of waiting 10 mins for 15 tokens).  
  - *Expected outcome*: Many reverse preference and accept **A2** (present bias: immediacy outweighs extra 5 tokens).  

  **Phase 3: Trader Exploitation (t=10–15 mins)**  
  - The Trader proposes a cycle of trades:  
    1. **Trade 1 (t=0)**: To B1-choosers: "Sell your B1 (15 tokens at 20 mins) for 11 tokens now."  
       - *Rationale*: At t=0, B1 is worth >11 tokens (participants decline).  
    2. **Trade 2 (t=10)**: To B1-choosers: "Sell your B1 for 10 tokens now."  
       - *Rationale*: At t=10, present-biased participants accept (prefer 10 now > 15 later).  
    3. **Trade 3 (t=10)**: Trader immediately resells B1 to the *same participant* for 14 tokens:  
       - "Buy back your original B1 for 14 tokens now (delivering 15 tokens in 10 mins)."  
       - *Rationale*: After accepting A2, participants feel regret and rebuy B1 to "correct" their choice.  
  - **Cycle Outcome**:  
    - Participant pays 14 tokens to rebuy B1, but already received 10 tokens from Trade 2.  
    - **Net loss**: Started with B1 → sold for 10 tokens (Trade 2) → paid 14 tokens to rebuy → ends with **-4 tokens + B1**.  
    - Compared to keeping B1, they have **4 fewer tokens** for the same reward.  

  #### **Example Participant Flow**  
  | Time  | Action                          | Token Balance | Reward Held |  
  |-------|----------------------------------|---------------|-------------|  
  | t=0   | Chooses B1 (15 tokens @20 mins) | 100           | B1          |  
  | t=10  | Sells B1 for 10 tokens (Trade 2)| 110           | None        |  
  | t=10  | Buys B1 for 14 tokens (Trade 3) | 96            | B1          |  
  | t=20  | Receives 15 tokens for B1       | 111           | None        |  
  - **Result**: Ended with 111 tokens, but could have had 115 by keeping B1. Net loss: **4 tokens**.  

  ---

  ### **Debrief (20 mins)**  
  Reveal the "money pump" concept and dissect the game:  
  1. **Intransitivity/Instability**:  
     - At t=0: B1 > A1 (15@20 > 10@10).  
     - At t=10: A2 > B1 (10 now > 15@10).  
     - **Formal mapping**: Violates **rational dynamic consistency**. Choices depend on temporal proximity, not just value.  

  2. **Present Bias vs. Genuine Change**:  
     - Present bias: Reversal occurs because the immediacy of A2 overpowers the larger reward.  
     - Not "changing minds": Participants still value 15 > 10 abstractly but can’t resist immediacy.  

  3. **Defenses & Why They Fail**:  
     - *"I’ll refuse the final trade"*: Fails because at t=10, Trade 3 (rebuying B1) feels like a "recovery" of their original plan, not a loss.  
     - *"Trades feel different at each step"*: True, but exploitable. Each trade is locally rational (e.g., selling B1 for 10 now feels good), but the cycle is globally harmful.  

  4. **Commitment Devices**:  
     - **Precommitment**: At t=0, delegate decisions to a "trustee" who enforces no trades.  
     - **Penalties**: Set a token cost for reversing choices (e.g., "Pay 5 tokens to access early trades").  
     - **Contracts**: Bind future rewards (e.g., "Lock B1; no sales until t=20").  

  ---

  ### **Predictable Issues & Mitigations**  
  1. **Over-Risk-Aversion**:  
     - *Issue*: Participants avoid trades entirely, "hoarding" tokens.  
     - *Mitigation*:  
       - Use small stakes (tokens, not real money).  
       - Emphasize prizes to incentivize engagement.  
       - Trader offers sweeteners (e.g., "First trade free!").  

  2. **Collusion/Suspicion**:  
     - *Issue*: Participants suspect exploitation and refuse trades or warn peers.  
     - *Mitigation*:  
       - Run phases privately (decision cards, not group discussion).  
       - Frame Trader as a neutral "market maker."  
       - Limit Trader’s proposals to scripted cycles (no improvisation).  

  3. **Incomplete Preference Reversal**:  
     - *Issue*: Some stick to B1 at t=10, avoiding the pump.  
     - *Mitigation*:  
       - Shorten delays (e.g., 5 mins/10 mins) to amplify immediacy.  
       - Increase stakes (e.g., 10 tokens NOW vs. 18 later).  

  4. **Game Limitations & Facilitator Notes**:  
     - **What the game can’t replicate**: The money pump’s **infinite drain**. Participants experience one cycle, but the argument relies on *repeated* pumping.  
     - **Facilitator supplies**:  
       - "In theory, a trader could loop this cycle until you’re bankrupt. Each trade seems beneficial, but cumulatively, it’s disastrous."  
       - Show a diagram: **B1 → Sell for 10 → Rebought for 14 → Repeat** = tokens evaporate.  

  ---

  ### **Templates & Scripts**  
  - **Trader Script (Trade 3)**:  
    > "I see you sold your future reward. Want it back? Pay 14 tokens now, and I’ll give you 15 tokens in 10 minutes. It’s like undoing your mistake!"  

  - **Debrief Hook**:  
    > "Raise your hand if you ended with fewer tokens than you expected. Why did trading feel right in the moment but wrong later?"  

  This design forces participants to confront dynamic inconsistency in a visceral way, setting up a powerful debrief on commitment and self-binding. Run it as a fast-paced, transactional game to keep engineers engaged!
