prompt: |-
  ok so i'm a high school student and i've been going down this whole expected value fanaticism rabbit hole — the idea that if you take expected value maximization seriously, a tiny enough probability of a huge enough payoff starts to swamp every normal choice, and you end up having to hand your wallet to a pascal's mugger or spend your whole life chasing one weird long shot. i'm putting together something for my school's debate/philosophy club and everyone just points at one thought experiment at a time, which is making me dizzy. before i read any more takes on it i want the full spec first.

  so here's what i want: write the desiderata — the list of requirements a theory of how to make decisions when there's a tiny probablity of an enormous payoff (or loss) has to meet to count as adequate. for each requirement give me the case or consideration behind it: which thought experiment it has to get right (pascal's mugging, st petersburg, the fanaticism worry, cluelessness, infinity cases, whatever you think belongs on the list), which distinctions it can't collapse (like small probability vs zero probability, huge-but-finite value vs actually infinite value, one-shot vs repeated decisions, well-estimated chances vs cases where you can't even assign a number, and maybe the difference between what's rational given your values and what values you should have), and which formal constraints it has to respect (dominance, not getting money-pumped, stuff like that). also tell me which requirements are non-negotiable and which are just preferences of particular camps — for instance is bounded utility a real requirement or just one way to dodge fanaticism? and flag any pairs of requirements you suspect can't be jointly satisfied, because that's the part i'm most curious about. then in a sentence or two each, say how the main kinds of views — plain expected value theory, bounded utility, risk-weighted or risk-averse views, lexical or anti-fanaticism views — do against the list. keep the weight on the requirements themselves, not the scorecard. and i mostly care about a theory an actual person could use to make a real call, not just a theory about idealized agents with perfect probabilities.

  you're a professional philosopher who works on decision theory and formal epistemology, so think carefully. maybe brainstorm the candidate requirements first and then give me the cleaned-up final list. and write the whole answer in american english.
