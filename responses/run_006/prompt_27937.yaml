answer: |-
  Here's a comprehensive list of desiderata for a decision theory handling tiny probabilities of enormous payoffs/losses. I've organized them by category, included the motivating cases, distinctions, formal constraints, negotiability, and tensions. After the list, I briefly map major approaches against these requirements.

  ---

  ### **Core Desiderata for a Decision Theory**

  #### **I. Epistemic & Practical Feasibility**
  1.  **Practical Usability:**  
      *Requirement:* Must be applicable by real humans with limited cognitive resources/time.  
      *Why:* Theories for idealized agents (e.g., with perfect probability assignments) fail for messy real-world decisions.  
      *Non-negotiable?* **Yes** for a "theory an actual person could use."  

  2.  **Robustness to Uncertainty:**  
      *Requirement:* Must handle *imprecise probabilities* (e.g., "some tiny chance between 10⁻¹⁰ and 10⁻²⁰").  
      *Case:* "Cluelessness" (e.g., estimating impacts of current actions on the far future). Distinguishes *unknown probabilities* from *zero probability*.  
      *Non-negotiable?* **Yes** for real-world relevance.  

  3.  **Epistemic Humility:**  
      *Requirement:* Avoids demanding precise probabilities for outcomes where reliable estimation is impossible.  
      *Case:* Assigning exact probabilities to speculative scenarios (e.g., "Is this Pascal's Mugger 1% or 0.0001% likely?").  
      *Non-negotiable?* **Highly desirable** – prevents garbage-in-garbage-out decisions.  

  #### **II. Value & Probability Sensitivity**
  4.  **Non-Ignorability of Tiny Probabilities:**  
      *Requirement:* Cannot treat sufficiently small probabilities as *exactly zero* without justification.  
      *Case:* Ignoring asteroid extinction risks because P(impact) < 10⁻⁸. Distinguishes *negligible* from *impossible*.  
      *Non-negotiable?* **Yes** – else collapses into dogmatism.  

  5.  **Non-Fanaticism:**  
      *Requirement:* Avoids letting arbitrarily tiny probabilities of huge payoffs dominate all finite-value decisions.  
      *Case:* **Pascal's Mugging** (mugger claims "Give me $5 or I'll destroy 3↑↑↑3 lives with 10⁻¹⁰⁰ probability"). Must not force handing over your wallet.  
      *Non-negotiable?* **Widely accepted** – but *how* to achieve it is contested.  

  6.  **Finiteness Sensitivity:**  
      *Requirement:* Must distinguish *finite but enormous values* (e.g., 10¹⁰⁰ utils) from *actual infinities*.  
      *Case:* **St. Petersburg Paradox** (infinite EV from finite payoffs with halving probabilities) vs. **Pascal's Wager** (infinite payoff if God exists).  
      *Non-negotiable?* **Yes** – infinite utilities break standard EV.  

  #### **III. Rationality & Consistency Constraints**
  7.  **Stochastic Dominance Respect:**  
      *Requirement:* If option A is always better than B in every possible outcome, choose A.  
      *Formal Constraint:* Minimal rationality requirement. Prevents obvious self-sabotage.  
      *Non-negotiable?* **Yes** – foundational to coherence.  

  8.  **Avoidance of Money Pumps:**  
      *Requirement:* Cannot be exploited in repeated decisions to lose guaranteed value.  
      *Formal Constraint:* Ensures dynamic consistency (e.g., if you prefer A > B > C > A, I can "pump" money from you by trading).  
      *Non-negotiable?* **Yes** – failure implies irrational preferences.  

  9.  **Scale-Invariance:**  
      *Requirement:* Decisions shouldn't reverse under linear rescaling of utilities or probabilities.  
      *Why:* If saving 10 lives for sure is better than a 1% chance to save 1000, it should remain better if utilities are relabeled (e.g., utils → dollars).  
      *Non-negotiable?* **Highly desirable** – avoids arbitrary framing effects.  

  #### **IV. Structural & Normative Plausibility**
  10. **Distinction Preservation:**  
      *Requirement:* Must not collapse:  
      - One-shot vs. repeated decisions (e.g., playing St. Petersburg *once* vs. *many times*).  
      - Well-defined vs. ambiguous probabilities.  
      - Instrumental vs. intrinsic values (e.g., sacrificing core values for long shots).  
      *Case:* **Fanaticism Worry** – spending your life chasing cosmic payoffs vs. living normally.  
      *Non-negotiable?* **Yes** – real decisions require these distinctions.  

  11. **Value-Neutrality (Instrumental Rationality):**  
      *Requirement:* Guides action given *any* consistent values, without judging the values themselves.  
      *Distinction:* Separates "what to do given your goals" from "what goals you should have."  
      *Non-negotiable?* **For instrumental theories** – but some argue rationality constrains values.  

  12. **Non-Arbitrariness:**  
      *Requirement:* Thresholds (e.g., "ignore probabilities below ε") must be justifiable, not ad hoc.  
      *Case:* Why ignore P = 10⁻²⁰ but not P = 10⁻¹⁹? Must avoid arbitrary cutoffs.  
      *Non-negotiable?* **Yes** – else the theory is unprincipled.  

  ---

  ### **Key Tensions Between Requirements**
  - **Non-Fanaticism vs. Non-Ignorability:** Ignoring tiny probabilities (to avoid fanaticism) risks dismissing genuine existential risks.  
  - **Non-Fanaticism vs. Stochastic Dominance:** Some anti-fanaticism views (e.g., lexical thresholds) violate dominance in edge cases.  
  - **Robustness vs. Practical Usability:** Handling imprecise probabilities can make calculations intractable for humans.  
  - **Value-Neutrality vs. Finiteness Sensitivity:** If an agent values infinite utility, standard EV forces fanaticism – but is this irrational or just tragic?  

  ---

  ### **How Major Theories Fare *Against the Desiderata* (Briefly)**  
  *(Focus: How well they satisfy the requirements above, not full critiques)*  

  1.  **Unbounded Expected Utility (EU):**  
      - *Fails:* Non-Fanaticism (leads to mugging), Practical Usability (with complex probabilities), Finiteness Sensitivity (diverges with infinite EV).  
      - *Meets:* Stochastic Dominance, Money Pump Avoidance, Non-Ignorability.  

  2.  **Bounded Utility:**  
      - *Fails:* Finiteness Sensitivity (treats huge finite payoffs as "infinite-lite"), Non-Arbitrariness (where to bound? Why exponential?).  
      - *Meets:* Non-Fanaticism (avoids mugging), Stochastic Dominance.  

  3.  **Risk-Weighted/Ambiguity-Averse Views (e.g., Rank-Dependent EU, Maxmin EU):**  
      - *Fails:* Scale-Invariance (risk weights distort linear scaling), sometimes Stochastic Dominance.  
      - *Meets:* Robustness to uncertainty, Practical Usability (intuitive for loss aversion).  

  4.  **Lexical/Threshold Views (e.g., "Ignore P < ε" or "Prioritize catastrophic risks"):**  
      - *Fails:* Non-Arbitrariness (choosing ε), Non-Ignorability (dismisses tiny probabilities), often Stochastic Dominance.  
      - *Meets:* Non-Fanaticism, Practical Usability.  

  5.  **Contextual or Heuristic Approaches (e.g., "Satisficing + Catastrophe Avoidance"):**  
      - *Fails:* Formal coherence (may violate dominance or invite money pumps).  
      - *Meets:* Practical Usability, Epistemic Humility, Non-Fanaticism.  

  ---

  ### **Takeaway**  
  No theory satisfies all desiderata perfectly. The core tension is **avoiding fanaticism without becoming dogmatic about small probabilities or arbitrary in constraints**. Unbounded EU fails for real agents, bounded utility is mathematically tidy but normatively questionable, and threshold-based views trade formal rigor for practicality. Your debate should focus on *which trade-offs* are justified – there's no free lunch. For further reading: explore **Kosonen (2024) on lexical thresholds**, **Beckstead & Thomas on sequential decision-making**, and **Bostrom's "Pascal's Mugging" paper** for the canonical framing.
