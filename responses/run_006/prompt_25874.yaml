   Scenario: A teletransporter is designed to copy your exact brain state and body state and recreate it at a distant location. However, during the process, there is an accident that scrambles your DNA so that the resulting person has a different genome. But the brain state is preserved exactly, so the person has all your memories, personality, etc.
