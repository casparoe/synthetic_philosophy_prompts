  We are designing a sorting quiz for a philosophy reading group on Kripke's origin essentialism. The quiz should help participants discover which position they hold by presenting concrete scenarios and asking them to choose between two or three options. The positions we want to sort for are:
  1. Kripkean origin essentialism: The specific sperm and egg are essential to being you.
  2. Genetic essentialism: Having the same genome is what matters, regardless of which gametes.
  3. Psychological-continuity views: What matters is psychological continuity; the origin (gametes) only matter insofar as they affect psychology.
  4. Animalism: You are the human organism, and the origin isn't what makes it you (but the organism's persistence conditions might rely on biological continuity, not necessarily the exact gametes).
  5. Deflationary/no-fact-of-the-matter views: There is no objective fact about identity in these cases, or it is a matter of convention.

  We need 8 questions, each with concrete scenarios. We must avoid direct questions about labels. We also need to note which positions the quiz might not cleanly separate and any answer patterns that are unlikely.

  Let's design the questions:

  Question 1: IVF Mix-up
   Scenario: Suppose that in an IVF clinic, the embryo that would have developed into you was accidentally swapped with another couple's embryo just before implantation. The embryo that was implanted in your mother's womb was genetically distinct (from different sperm and egg) and developed into you. The original embryo (that was supposed to be you) was implanted in another woman and developed into another person.
   Options:
     A) You are the person who developed from the original embryo (so you are the other person, not the one who was born to your mother).
     B) You are the person who developed from the embryo that was implanted in your mother (so you are the one who was born to your mother, even though the embryo was swapped).
     C) There is no fact of the matter about which one is you.

   This question tests whether the genetic material (with a specific origin) or the gestation and upbringing (which might affect psychology) is more important.

  Question 2: Sperm Replacement
   Scenario: A demon replaces the sperm that won the race to fertilize your mother's egg with a different sperm from the same ejaculation (so same father, same ejaculation event) just milliseconds before fertilization. The replacement sperm has a slightly different set of chromosomes (as is normal for different sperm). The resulting person (you) has a different genome than you would have had without the swap.
   Options:
     A) This person (you) is not the same as the person who would have been born without the swap because the specific sperm is essential.
     B) This person (you) is the same as the person who would have been born without the swap because the sperm came from the same ejaculation and same father, so it's close enough. (This might be a genetic essentialist if they think the genome doesn't have to be exactly the same? But note the genome is different. Alternatively, this might be a deflationary view.)
     C) There is no fact of the matter.

   But note: the genome is different. So we might need to clarify: 
     Option A: The specific sperm is essential, so the person is different.
     Option B: The person is the same because the difference in genome is minor and the origin (same father, same mother, same time) is what matters in a broader sense? 
     However, this might not be a standard position. Alternatively, we could have:
     Option A: The person is different because the genome is different. (genetic essentialism might require the same genome, so this would be consistent with genetic essentialism only if we interpret it as requiring the same genome? But genetic essentialism typically says same genome = same person, so if the genome is different, then it's a different person. So in this case, since the genome is different, genetic essentialism would say it's a different person. So option A could be held by both Kripkeans and genetic essentialists? We need to separate them.)

   Let's rework: We want to pull apart Kripkean (specific sperm and egg) from genetic essentialism. But in this case, both the sperm is changed and the genome is changed. So both would say it's a different person. So this question might not separate them. We need a scenario where the genome is the same but the gametes are different.

   So let's change the scenario:

  Question 2 (Revised): Same Genome, Different Gametes
   Scenario: Scientists create an embryo in a lab by taking the exact DNA sequence that made up your genome and assembling it from scratch (not using the original sperm and egg). They then implant this embryo in your mother's womb, and it develops into a person who is physically and psychologically identical to you. The original embryo (from the actual sperm and egg) was destroyed.
   Options:
     A) The person who develops from the lab-made embryo is you.
     B) The person who develops from the lab-made embryo is not you (because they didn't come from the original sperm and egg).
     C) There is no fact of the matter.

   This separates genetic essentialism (A) from Kripkean origin essentialism (B).

  Question 3: Gestation in a Different Womb
   Scenario: Suppose your biological parents are the same, but due to a medical procedure, the embryo (formed from the same sperm and egg that made you) was transferred to a different woman's womb and gestated there. You were born from that surrogate mother.
   Options:
     A) The person born from the surrogate mother is you.
     B) The person born from the surrogate mother is not you because you must have been born from your actual mother's womb. (This might be a Kripkean view? But note, Kripke's claim is about the gametes, not the womb. However, he might also think that the womb is part of the origin? We need to be cautious. Alternatively, this might be an animalist view that the organism is determined by the biological development, and the womb might be part of that? But note, animalism typically doesn't require the same womb. So this might be a minority view.)
     C) There is no fact of the matter.

