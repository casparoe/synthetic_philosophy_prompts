prompt: |-
  I'm a science journalist and I've been asked to run a 90-minute workshop at a public ideas festival. The topic is epistemic dependence on AI — specifically the worry that as we offload more thinking to AI tools, we lose the understanding that comes from working through problems ourselves, and we might not even notice it's gone because the outputs still look fine.

  I want an activity that makes participants *feel* this erosion in real time. Here's what I'm picturing: something where small groups have to solve a multi-step reasoning problem (maybe a medical diagnosis, or a legal argument, or an engineering failure analysis — something with interdependent steps where understanding *why* step 3 follows from step 2 matters). At first they do all the reasoning themselves. Then in subsequent rounds, they're allowed to hand off sub-tasks to an "oracle" (played by another group or by a facilitator with a script) who gives correct outputs but no explanations. By the final round, they're just stitching oracle outputs together, and then I hit them with a surprise twist — the original problem changes slightly, or they're asked to explain thier reasoning to someone else, and they realize they can't.

  No technology allowed — no phones, no laptops. Just people, paper, and rules. About 30 participants, mostly educated laypeople.

  I need: the full setup (what problem they're solving, how the oracles work, what materials to prepare), the round-by-round rules, a timeline for 90 minutes, and a debrief that connects what happened to the philosophical literature — especially the distinction between having correct answers and grasping the relationships between them (understanding as "seeing how things hang together"), and the idea that understanding might require cognitive effort rather than just access to outputs.

  Also: tell me what will predictably go wrong the first time I run this, and be honest about which part of the philosophical worry this activity *can't* capture — e.g., the activity has a debrief where people notice their lost understanding, but in real life with AI, one of the worries is precisely that we *don't* notice. How do I address that gap in the discussion?
reasoning: |-
  We are designing a workshop activity to illustrate epistemic dependence on AI, specifically the erosion of understanding when we offload reasoning steps without grasping the connections. The activity should be run without technology, using paper and people.

  **Activity Concept:**
  - **Theme:** Medical Diagnosis (accessible, high-stakes, and involves multi-step reasoning)
  - **Problem:** Participants diagnose a fictional disease based on patient symptoms and test results. The disease has a chain of reasoning: symptom A suggests condition B, which combined with test C indicates disease D.

  **Setting:**
  - 30 participants, divided into 6 groups of 5.
  - Each group is a "Diagnostic Team".
  - 3 groups will be "Reasoners" (they solve the problem) and 3 groups will be "Oracles" (they provide answers without explanation). We can rotate roles.

  **Problem Design:**
  We'll create a fictional disease and symptoms to avoid real-world medical knowledge biases. Let's call the disease "Zymosis".

  **Disease Logic:**
  1. **Symptom:** Patient has a fever and a rash. (Step 1)
  2. **Condition:** Fever and rash together suggest an allergic reaction OR an infection. (Step 2)
  3. **Test Result:** Blood test shows elevated eosinophils (a type of white blood cell) which indicates an allergic reaction. (Step 3)
  4. **Further Test:** The patient reports exposure to a rare plant (Zymophyte) that causes a specific allergic reaction that turns into an autoimmune response. (Step 4)
  5. **Diagnosis:** Confirmed Zymosis. (Step 5)

  But note: There's a twist in the logic. The elevated eosinophils are typical for allergies, but the rash in Zymosis is unique because it is circular (like ringworm) and the fever is low-grade. Also, the Zymophyte exposure must be within the last 48 hours.

  **Materials:**
  - **For Reasoners:**
    - Patient Case File (for each round, with symptoms and test results).
    - Worksheet with steps to fill in (Step 1: Symptoms, Step 2: Possible Conditions, Step 3: Test Interpretation, Step 4: Confirmatory Evidence, Step 5: Diagnosis).
    - Pens.
  - **For Oracles:**
    - Oracle Script (with correct answers for each step, but no explanations). They are only allowed to give the output for the step they are asked about.

  **Problem Variations for Rounds:**
  We'll have 3 rounds. Each round uses a different patient case, but the underlying disease logic is the same. The twist is that in the final round, the patient case has a critical change (e.g., the rash is not circular, or the exposure time is beyond 48 hours) that should lead to a different diagnosis, but the participants are now so used to stitching oracle outputs that they might miss it.

  **Round Structure:**
  - **Round 1 (20 minutes):** Groups must solve the entire problem without any oracle help. They work through all steps and write down their reasoning.
  - **Round 2 (15 minutes):** Groups are allowed to use oracles for 2 steps (e.g., Step 2 and Step 3). They must hand over the necessary inputs to the oracle group and get the output without explanation. They then use that to complete the rest.
  - **Round 3 (15 minutes):** Groups must use oracles for every step except the final stitching (Step 5). They get outputs for Steps 1-4 without explanation and then put them together to form a diagnosis.

  **Oracle Setup:**
  - Each Reasoner group is paired with an Oracle group. In Round 1, the Oracle groups are also solving the problem (so they have the knowledge base) but they are not used. In Round 2 and 3, the Oracle groups are given the Oracle Script for that round's case. They are instructed to only give the output for the specific step when given the inputs. They do not provide any reasoning.

  **The Twist:**
  After Round 3, we reveal that the patient in Round 3 had a critical difference: the rash was not circular (it was linear) and the exposure was 72 hours ago. Therefore, the diagnosis should not be Zymosis. But because the oracles were giving outputs based on the old logic (which was provided to them by the facilitator and not updated), they gave the same kind of outputs (e.g., Step 3: "elevated eosinophils indicate allergic reaction" without considering the rash pattern). The Reasoners, just stitching, might have diagnosed Zymosis.

  **Debrief (30 minutes):**
  1. **Surprise Test (5 minutes):** Ask each group to explain their Round 3 diagnosis to another group, and then reveal the twist. They realize they cannot explain why the change matters because they didn't do the reasoning.
  2. **Discussion (10 minutes):** How did it feel? What did you notice about your own understanding across rounds?
  3. **Philosophical Connection (15 minutes):**
     - **Understanding vs. Outputs:** We had correct outputs in Round 2 and 3, but when the situation changed, the understanding to adapt was lost. Connect to the idea of understanding as "seeing how things hang together" (e.g., Elgin, Zagzebski). Without the effort of working through the steps, we don't grasp the relations between the facts.
     - **Cognitive Effort:** Reference the literature on cognitive effort and understanding (e.g., Kvanvig's "The Value of Knowledge and the Pursuit of Understanding"). Understanding requires the cognitive work to integrate the pieces.
     - **Epistemic Dependence:** We depend on others (or AI) for knowledge, but when we don't have access to the reasoning, we become vulnerable when conditions change.
     - **The Unnoticed Loss:** In real life, we don't have a facilitator to reveal the twist. We might only notice when something goes wrong, but by then it might be too late (e.g., in medicine, law, engineering). Also, AI systems often don't provide explanations, and even when they do, we might not scrutinize them.

  **Timeline (90 minutes):**
  1. **Introduction (10 min):** Set the stage. Explain the concern about offloading thinking to AI. Outline the activity.
  2. **Round 1 (20 min):** Groups solve the full problem without oracles.
  3. **Round 2 (15 min):** Groups use oracles for 2 steps (e.g., Step 2 and 3).
  4. **Round 3 (15 min):** Groups use oracles for 4 steps (only stitching Step 5).
  5. **Twist and Surprise Test (5 min):** Reveal the changed condition and ask groups to explain their Round 3 diagnosis to another group (or to the whole workshop). They struggle.
  6. **Debrief (25 min):** Discussion and philosophical connection.

  **What Could Go Wrong:**
  1. **Time Management:** The rounds might run long. Have a strict timer and announce time warnings.
  2. **Oracle Inconsistency:** Oracle groups might give inconsistent answers if they interpret the script differently. Solution: Train the oracles before the activity (give them a quick briefing) and have a clear script.
  3. **Reasoner Frustration:** In Round 2 and 3, if the oracle groups are slow, it might hold up the activity. Designate a facilitator to help with oracle handoffs.
  4. **Twist Not Noticed:** Groups might not see the difference in the Round 3 case. Make the change very obvious (e.g., write in the case: "the rash is linear" and "exposure was 72 hours ago") but hope they rely on oracle outputs without checking. If they notice, it's still a teaching moment: they noticed because they were critical, but in real life, we might not be.
  5. **Group Dynamics:** Some groups might finish early. Have extension questions ready (e.g., "What if the patient had X symptom instead?").

  **What the Activity Can't Capture:**
  - **The Unnoticed Loss in Real Life:** In the activity, we reveal the twist and they notice the loss. But with AI, we might never notice because we don't encounter the twist, or we don't have the understanding to recognize it. Also, we might become over-reliant and stop double-checking.
    - **How to Address in Debrief:** Discuss how in real-world use of AI, we don't have a built-in twist. We must build in mechanisms for critical evaluation, audits, and maintaining human expertise. We must be aware of the gradual erosion and design systems that preserve understanding (e.g., requiring explanations, continuous training).

  **Materials to Prepare:**
  1. Patient Case Files (3 versions, one per round) for Reasoners.
  2. Oracle Scripts (for each round) for Oracle groups.
  3. Worksheets for Reasoners (with steps outlined).
  4. Timer.
  5. Flip chart or whiteboard for debrief.

  Let me write the detailed cases and oracle scripts.

  **Case 1 (Round 1):**
  - Patient: 35-year-old male
  - Symptoms: Low-grade fever (99.5°F), circular red rash on forearm (appeared 24 hours ago)
  - Test Results: Elevated eosinophils (8% of white blood cells, normal is 1-4%)
  - Exposure: Patient reports handling a Zymophyte plant at a botanical garden 36 hours ago.

  **Oracle Script for Round 1 (for Oracles, but not used in Round 1):**
  - Step 1: Input: Symptoms (fever and rash). Output: Possible conditions: allergic reaction or infection.
  - Step 2: Input: Symptoms and test (elevated eosinophils). Output: Elevated eosinophils suggest allergic reaction.
  - Step 3: Input: Allergic reaction and exposure to Zymophyte. Output: Zymophyte exposure within 48 hours suggests possible Zymosis.
  - Step 4: Input: All of the above. Output: Diagnosis: Zymosis.

  **Case 2 (Round 2):** (No twist, same as Case 1 but different patient details to avoid memorization)
  - Patient: 28-year-old female
  - Symptoms: Low-grade fever (99.3°F), circular red rash on neck (appeared 30 hours ago)
  - Test Results: Elevated eosinophils (7%)
  - Exposure: Zymophyte exposure at a park 40 hours ago.

  **Oracle Script for Round 2:** Same logic as Round 1.

  **Case 3 (Round 3, with twist):**
  - Patient: 42-year-old male
  - Symptoms: Low-grade fever (99.6°F), **linear** red rash on back (appeared 48 hours ago)
  - Test Results: Elevated eosinophils (8%)
  - Exposure: Zymophyte exposure during hiking **72 hours ago**.

  **Oracle Script for Round 3 (given to Oracles):** 
  - Note: The oracle script is the same as before, because the facilitator hasn't updated the oracles about the new rash pattern and exposure time. So:
    - Step 1: Output: Possible conditions: allergic reaction or infection. (They don't note the linear rash because the script doesn't require it.)
    - Step 2: Output: Elevated eosinophils suggest allergic reaction.
    - Step 3: Output: Zymophyte exposure (without noting the time) suggests possible Zymosis.
    - Step 4: Output: Diagnosis: Zymosis.

  But the correct diagnosis should be a generic allergic reaction (not Zymosis) because the rash is linear (not circular) and the exposure is beyond 48 hours. The oracles are giving the same outputs as before because their script hasn't changed. The Reasoners, just stitching, will likely output Zymosis.

  **Worksheet for Reasoners:**
  - Step 1: Record symptoms and note possible conditions.
  - Step 2: Interpret test results in light of symptoms.
  - Step 3: Consider exposure history.
  - Step 4: Formulate diagnosis.
  - Step 5: (Optional) Treatment recommendation? (But we don't need this for the activity.)

  In Round 3, they are only doing Step 5 (stitching the oracle outputs to form a diagnosis) and writing the diagnosis.

  **Surprise Test:** After Round 3, ask groups: "Now, explain to the group next to you why you diagnosed Zymosis. What was the chain of reasoning?" Then reveal: "But in this case, the rash was linear and exposure was 72 hours ago. How does that change things?" They won't know because the oracles didn't tell them about the circular rash requirement or the 48-hour window.

  **Debrief Questions:**
  - How did your approach to the problem change over the rounds?
  - In Round 3, did you feel confident in your diagnosis? Why?
  - When the twist was revealed, how did you feel about your understanding?
  - How does this relate to using AI in real life?

  **Philosophical Points:**
  - **Understanding as Grasping Connections:** Refer to Catherine Elgin's idea that understanding involves seeing how things cohere. In Round 1, they built a mental model. In Round 3, they had disjointed facts.
  - **Value of Cognitive Effort:** Discuss that understanding is an achievement that requires effort (Kvanvig). Offloading the effort might lead to fragile knowledge.
  - **Epistemic Dependence and Vulnerability:** We rely on others, but when the source is opaque (like AI), we are vulnerable to changes in the environment (like the twist).

  **Conclusion in Debrief:** 
  Emphasize that the activity is a microcosm of what happens when we use AI without maintaining our own understanding. The solution isn't to reject AI but to use it in ways that preserve human oversight and understanding (e.g., requiring explanations, continuous learning, and designing systems that augment rather than replace human cognition).

  This activity should create a memorable experience that illustrates the philosophical worry in a tangible way.
answer: |-
  Here’s a complete, ready-to-run workshop plan for your 90-minute session on epistemic dependence and AI. The activity uses a **medical diagnosis scenario** (chosen for accessibility and high stakes) to simulate how offloading thinking erodes understanding. Participants experience this through progressive rounds of "oracle dependence," culminating in a twist that reveals their lost grasp of the problem.

  ---

  ### **Workshop Title:** "The Vanishing Skill: What Happens When AI Thinks For Us?"

  ### **Core Learning Goal**  
  Make participants *feel* the erosion of understanding by simulating AI-like "oracles" that provide correct answers without explanations. Debrief connects to philosophy: understanding as "seeing how things hang together" (Elgin, Grimm) and the role of cognitive effort (Kvanvig).

  ---

  ### **Materials to Prepare**
  - **For Groups (6 groups of 5):**  
    - **Round 1:** Patient case file (identical for all groups), blank worksheet with 4 reasoning steps (see below).  
    - **Round 2 & 3:** New case files, "Oracle Request Slips" (paper slips to submit queries).  
    - **All Rounds:** Pens, highlighters.  
  - **For Oracles (3 facilitator volunteers):**  
    - **Oracle Scripts** (pre-written answers for each step, no explanations).  
    - **Response Cards** (pre-printed with outputs for each query).  
  - **For Debrief:**  
    - Whiteboard/flip chart, markers.  
    - Printed quotes from philosophers (e.g., Elgin, Zagzebski, Kvanvig).  

  ---

  ### **The Medical Diagnosis Problem**  
  **Disease:** "Crimson Fever" (fictional).  
  **Logic Chain** (interdependent steps where *why* matters):  
  1. **Symptoms → Possible Causes:** Fever + rash could indicate infection (viral/bacterial) or autoimmune disorder.  
  2. **Test Result → Interpretation:** Elevated white blood cells (WBC) suggest infection, *but* high eosinophils (a subtype) point to autoimmune.  
  3. **Exposure History → Risk Factor:** Recent travel to endemic area increases infection risk; exposure to chemicals increases autoimmune risk.  
  4. **Diagnosis & Treatment:** Bacterial vs. viral vs. autoimmune determines treatment (antibiotics/antivirals/steroids).  

  **The Twist (Critical Change):**  
  - **Rounds 1–2:** Rash is "blotchy" (suggesting infection).  
  - **Round 3:** Rash is "ring-shaped" (strong indicator of autoimmune disorder). Oracles *still* give infection-focused outputs (simulating outdated AI training data).  

  ---

  ### **Setup & Roles**  
  - **Participants:** 30 people → **6 groups of 5.**  
  - **Oracles:** 3 groups **or** 3 facilitators (recommend facilitators for consistency).  
    - Oracles hold **pre-scripted answers** and give **outputs only** (e.g., "Elevated WBC suggests infection").  
  - **Problem Flow:** Groups solve the same diagnosis problem 3 times with increasing oracle dependence.  

  ---

  ### **Round-by-Round Rules**  
  **Total Time: 60 minutes**  

  #### **Round 1: Full Understanding (15 min)**  
  - **Task:** Diagnose Patient A (fever, blotchy rash, high WBC, travel history).  
  - **Rules:**  
    - Groups work through **all 4 steps** themselves (no oracles).  
    - Document reasoning on worksheets:  
      > Step 1: Symptoms → Possible causes?  
      > Step 2: Test results → Refine causes?  
      > Step 3: Exposure → Final cause?  
      > Step 4: Diagnosis & treatment?  
  - **Oracle Role:** Inactive.  
  - **Correct Output:** Bacterial infection (antibiotics needed).  

  #### **Round 2: Partial Offloading (15 min)**  
  - **Task:** Diagnose Patient B (similar to A; fever, blotchy rash, high eosinophils, chemical exposure).  
  - **Rules:**  
    - Groups **offload Step 2 (test interpretation)** and **Step 3 (exposure analysis)** to oracles.  
    - Submit "Oracle Request Slips" with inputs (e.g., "Symptoms: fever + rash; Test: high eosinophils").  
    - Oracles return **output-only cards** (e.g., "High eosinophils suggest autoimmune disorder").  
    - Groups stitch outputs to solve Steps 1, 4 themselves.  
  - **Correct Output:** Autoimmune disorder (steroids needed).  

  #### **Round 3: Total Dependence (15 min)**  
  - **Task:** Diagnose Patient C (fever, **ring-shaped rash**, high WBC, travel history → **THE TWIST**).  
  - **Rules:**  
    - Groups **offload Steps 1–3** to oracles.  
    - Oracles give **outdated outputs** (based on Round 1 logic):  
      - Step 1: "Rash suggests infection."  
      - Step 2: "High WBC suggests infection."  
      - Step 3: "Travel history suggests infection."  
    - Groups **only do Step 4** (stitch oracle outputs into diagnosis/treatment).  
  - **Oracle Deception:** Outputs ignore the "ring-shaped rash" (key autoimmune clue).  
  - **Correct Output Should Be:** Autoimmune (due to rash), but groups will likely say "infection."  

  #### **The Twist Reveal (15 min)**  
  - **Surprise Test:**  
    1. Ask groups to **explain Patient C’s diagnosis** to another group (5 min).  
    2. Reveal the **rash change** and ask: *"Why did you miss the ring-shaped rash? Could your diagnosis harm the patient?"*  
  - **Outcome:** Groups can’t explain *why* infection was chosen—they didn’t process the rash clue. Treatment (antibiotics) would harm an autoimmune patient.  

  ---

  ### **Timeline (90 Min Total)**  
  1. **Intro (10 min):** Frame the AI dilemma. Show quote:  
     > *"Understanding isn’t just outputs—it’s grasping *how* facts interlock."* – Stephen Grimm.  
  2. **Round 1 (15 min):** Groups solve unaided.  
  3. **Round 2 (15 min):** Offload 2 steps to oracles.  
  4. **Round 3 (15 min):** Offload 3 steps + stitching.  
  5. **Twist & Reveal (15 min):** Explanation fails.  
  6. **Debrief (20 min):** Connect to philosophy (detailed below).  

  ---

  ### **Debrief: Linking Experience to Philosophy (20 min)**  
  **Guided Discussion:**  
  1. **What Happened?** (5 min)  
     - Ask: *"In Round 3, you had all the ‘right’ outputs. Why couldn’t you adapt to the twist?"*  
     - Highlight: You lost the *relationships* between steps (e.g., rash shape changes everything).  

  2. **Core Philosophical Concepts** (10 min):  
     - **Understanding vs. Knowledge:**  
       > *"Knowledge is having the answer. Understanding is grasping the *structure* of why it’s true."* – Linda Zagzebski.  
       - Activity showed: Outputs (knowledge) stayed "correct," but understanding eroded.  
     - **Cognitive Effort & "Seeing Connections":**  
       > *"Understanding requires *work*—weaving facts into a coherent model."* – Catherine Elgin.  
       - Offloading effort to "oracles" broke the web of connections.  
     - **Epistemic Dependence:**  
       > *"Relying on others isn’t bad—but opacity breeds vulnerability."* – John Hardwig.  
       - Oracles = AI: They gave answers, but no context for when rules change.  

  3. **The "Unnoticed Loss" Gap** (5 min):  
     - **Acknowledgment:** In this activity, we *revealed* the loss via the twist. **But in real life, we often don’t notice.**  
     - **Why?** AI’s outputs *look* fine until a crisis (e.g., misdiagnosis, biased hiring). By then, skills are atrophied.  
     - **Mitigation Discussion:** Ask: *"How can we use AI but *preserve* understanding?*" Ideas:  
       - **Friction Design:** Require human justification for AI outputs (e.g., "Explain step 2 before proceeding").  
       - **Effortful Checkpoints:** Rotate off-AI tasks to maintain skills (e.g., doctors solve 1 in 10 cases manually).  
       - **Limits Awareness:** Treat AI as a "crutch," not a replacement.  

  ---

  ### **Predictable Challenges & Fixes**  
  1. **Time Crunch in Rounds:**  
     - **Why:** Groups dither in Round 1; oracle handoffs slow Round 2/3.  
     - **Fix:** Assign a timekeeper. Give strict warnings ("3 min left!"). Simplify case files.  

  2. **Oracles Deviating from Script:**  
     - **Why:** Volunteer oracles may add explanations.  
     - **Fix:** Use facilitators (not groups) as oracles. Give them strict scripts: *"Only read the card—no extras!"*  

  3. **Groups Resisting Offloading:**  
     - **Why:** Skeptical participants may "cheat" by solving steps themselves.  
     - **Fix:** Emphasize: *"You MUST use oracles when allowed—this simulates real-world AI reliance."*  

  4. **Twist Feels Contrived:**  
     - **Why:** Sharp-eyed groups spot the rash change.  
     - **Fix:** Debrief it! *"You noticed—but would you in a busy clinic with AI handling 99% of cases?"*  

  ---

  ### **What the Activity *Can't* Capture (and How to Address in Debrief)**  
  - **The Real Worry: We Don’t Notice the Loss**  
    - In the activity, the twist *forces* awareness. But with AI, erosion is silent—we lose skills *without feedback*.  
    - **Debrief Script:**  
      > *"AI’s danger isn’t wrong answers—it’s *plausible* answers that mask our dissolving expertise. Like a muscle, understanding weakens without use. We might only notice when it fails catastrophically—and by then, we can’t fix it because we’ve lost the ability to judge."*  
      > **Solution:** "Build in ‘understanding checks’—e.g., monthly ‘no-AI’ drills, or explainability requirements."  

  - **AI’s Scale and Complexity**  
    - Activity simplifies with one oracle. Real AI involves layers of hidden reasoning.  
    - **Debrief Tie-in:**  
      > *"Unlike our oracles, AI’s ‘black box’ makes it impossible to trace steps—so recovery is harder."*  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Participants *feel* frustration in the twist, making abstract philosophy tangible.  
  - **Low-Tech, High-Impact:** Uses paper, roleplay, and surprise to mirror AI dependence.  
  - **Clear Philosophy Link:** Targets the "understanding as coherence" literature directly.  

  **Quotes for Your Slides:**  
  - *"Understanding is the ability to *change one’s mind* when facts shift."* – Jonathan Kvanvig  
  - *"Without effort, we get answers but lose the web."* – Catherine Elgin  

  This plan creates a visceral, memorable experience while grounding the AI ethics debate in classical epistemology. Run it as-is, and you’ll leave participants questioning their own reliance on "oracles"—human or algorithmic.
