answer: |-
  Here’s a systematic breakdown of the desiderata for a credence-chance principle, motivated by key cases and tensions, with a scorecard for major proposals. The core tension arises between **chance as a guide** and **Humean metaphysics**, leading to irreconcilable demands in some frameworks.

  ---

  ### **Core Desiderata for Any Credence-Chance Principle**

  1.  **Chance-Guides-Credence (CGC):**
      *   **What:** If an agent knows the objective chance of A is x, and lacks "inadmissible" information, their credence in A should be x.
      *   **Motivation:** The *raison d'être* of chance. If knowing the chance doesn't rationally constrain your belief about the outcome (e.g., knowing a coin is fair to degree 0.5), what role does chance play? (Case: Fair coin flip; credence *should* be 0.5 for heads).
      *   **Status:** **Non-negotiable.** Defines the core function of chance.

  2.  **Consistency (No Self-Undermining) (CON):**
      *   **What:** The principle must not lead to *inconsistent* or *self-defeating* credences when combined with the agent's total evidence (especially evidence *about* the chance theory itself).
      *   **Motivation:** *Undermining Futures* (Lewis). In Humean Supervenience (HS), chances supervene on the *entire* course of history, including the future. A future outcome F consistent with a chance theory T might be assigned low probability *by* T. If you condition on T *and* that T is the *true* chance theory (which depends on F), inconsistency arises: Cr(F | T & "T is true") might contradict T(F). (Case: A specific future outcome F that makes the true chance theory T assign low probability to F itself).
      *   **Status:** **Non-negotiable for coherence.** Parochial *severity* under HS.

  3.  **Admissibility-Clarity (AC):**
      *   **What:** The principle must provide a clear (or at least workable) account of what constitutes "inadmissible" information that defeats the direct CGC link.
      *   **Motivation:** *Current Chance & Past History*. Knowing the *exact* future outcome of the coin flip is clearly inadmissible – it trumps the chance. But what about knowing *past* outcomes (relevant for frequency views) or *laws*? Lewis defined admissible information relative to a time t as information about history up to t *or* about the chances themselves. Is this sufficient? Does it avoid circularity? (Case: Knowing the coin *will* land heads – inadmissible; knowing it *did* land heads on the last 100 flips – admissible? problematic for frequentism?).
      *   **Status:** **Crucial but inherently messy.** Non-negotiable need for *some* clause; specific definition often parochial to metaphysics.

  4.  **Chance-as-Guidance (CAG):**
      *   **What:** The principle should make chance *usable* for rational agents. It shouldn't require knowing fundamentally inaccessible facts (like the complete Humean mosaic) to apply it.
      *   **Motivation:** *Epistemic Accessibility*. Agents need to *use* chances to set credences based on evidence they can reasonably have (e.g., scientific theories, observed frequencies). A principle requiring knowledge of the entire future/past to set credence now is useless. (Case: Setting credence in radioactive decay based on half-life, without knowing the entire future configuration of the universe).
      *   **Status:** **Non-negotiable for practicality.** Constrains how CON is resolved.

  5.  **Accommodates Chance-Evidence (ACE):**
      *   **What:** The principle should accommodate how we *learn* about chances (via evidence like frequencies, symmetries, physical theories) and update credences accordingly.
      *   **Motivation:** *Statistical Evidence*. We learn that a coin is fair (chance ~0.5) by observing frequencies (e.g., 500 heads in 1000 flips). The principle should mesh with how evidence about chances constrains credences *about* chances and *via* chances. (Case: Updating credence in the fairness of a coin based on observed flips).
      *   **Status:** **Highly desirable, often implicit.** Failure makes the principle disconnected from epistemology.

  6.  **Metaphysical Neutrality / Compatibility (MN):**
      *   **What:** The principle should be compatible with (or ideally derivable from) major metaphysical views of chance (Humean, Primitive, Propensity).
      *   **Motivation:** *The Metaphysics Matters*. Humean Supervenience creates the undermining problem. Non-Humean views (e.g., chances as primitive law-governed propensities) might avoid it. A principle only workable under one metaphysics is limited. (Case: Applying the principle under HS vs. under a non-Humean view with irreducible chances).
      *   **Status:** **Desirable, but potentially unattainable.** Achieving CGC + CON under HS *requires* modification, making strict neutrality hard.

  7.  **Undermining-Future-Resistance (UFR) [Parochial to HS]:**
      *   **What:** *Specifically under Humean Supervenience*: The principle must resolve the undermining future problem without contradiction or requiring inaccessible information.
      *   **Motivation:** *Undermining Futures* (see CON). This is the specific CON problem *generated* by HS. (Same case as CON).
      *   **Status:** **Parochial to HS.** Non-negotiable *if* one accepts HS.

  ---

  ### **The Core Tension: CGC vs. UFR (under HS)**

  *   **The Conflict:** Humean Supervenience (HS) makes chances depend on the *entire* pattern of particular events (the "Humean Mosaic"), including the future. CGC demands that credence align with known chance. UFR demands this alignment doesn't lead to contradiction when the known chance theory *itself* depends on future events that it assigns low probability to (undermining futures).
  *   **The Irreconcilability (under HS):** You seemingly cannot simultaneously:
      1.  Set Cr(F) = x based on knowing the true chance theory T (CGC).
      2.  Acknowledge that T being true *logically supervenes* on F (or not-F) occurring (HS).
      3.  Avoid credences that contradict T(F) when conditioning on T *and* "T is true" (CON/UFR).
  *   **Why the Messiness?** This tension **is genuine** and stems directly from HS. Resolving it forces a modification: either weaken CGC's directness (NP) or abandon HS. Non-Humean views avoid the tension by denying that chances logically supervene on the future mosaic.

  ---

  ### **Scorecard: Key Principles & Desiderata**

  | Desideratum          | Lewis's Principal Principle (PP) | New Principle (NP) | Non-Humean PP (PP+)                 |
  | :------------------- | :------------------------------- | :----------------- | :---------------------------------- |
  | **CGC**              | **✓** (Core)                     | **✓** (Via H)      | **✓** (Core)                        |
  | **CON (UFR)**        | **✗** (Fails under HS)           | **✓** (Resolves)   | **✓** (No undermining)              |
  | **AC**               | ~ (Original definition circular?) | ~ (Similar issues) | ~ (Similar issues)                  |
  | **CAG**              | **✓** (Simple)                   | **?** (H accessible?) | **✓** (Simple)                      |
  | **ACE**              | **✓**                            | **✓**              | **✓**                               |
  | **MN**               | **?** (Fails under HS)           | **✗** (HS-specific) | **✗** (Non-Humean)                  |
  | **UFR (HS only)**    | **✗**                            | **✓**              | **N/A**                             |
  | **Key Mechanism**    | Cr(A | ch(A)=x & H\_t & E) = x | Cr(A | H & T) = T(A) | Cr(A | ch(A)=x & Adm) = x |
  | **Metaphysics Suited** | Non-Humean or Naive HS           | Humean             | Non-Humean                          |

  *   **PP:** Fails CON/UFR catastrophically under HS. AC definition ("history up to t + chances") is potentially circular/strained. Elegant and strong CGC elsewhere.
  *   **NP:** Solves CON/UFR under HS by using the "history-to-chance" conditional (H: "T is the correct theory *and* H\_t"). CGC is satisfied *via* T(A), but the directness is mediated by H. Raises questions about CAG: Is H epistemically accessible? Is AC any clearer? Tied to HS.
  *   **PP+:** Retains simple PP form. Non-Humean metaphysics (e.g., primitive chances, propensities) avoids undermining futures altogether (chances aren't *logically* determined by future outcomes), so CON is satisfied without modifying CGC. AC issues remain. Requires rejecting HS.

  ---

  **Conclusion:** The fundamental, non-negotiable desiderata are **Chance-Guides-Credence (CGC)** and **Consistency (CON)**. The decades of complexity arise primarily from the **genuine tension** between CGC and the **Undermining-Future-Resistance (UFR)** requirement **under Humean Supervenience**. This forces a choice:
  1.  **Modify the Principle (NP):** Preserve HS but weaken the directness/elegance of CGC (NP).
  2.  **Modify the Metaphysics (PP+):** Preserve the simple PP form but reject HS for a non-Humean view where chances don't logically supervene on the future mosaic.

  Admissibility (AC) remains a persistent, independent challenge for all approaches. The "messiness" reflects both this core metaphysical tension and the inherent difficulty in cleanly delineating "inadmissible" information.
