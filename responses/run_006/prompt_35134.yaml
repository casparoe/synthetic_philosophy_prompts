prompt: |-
  I'm trying to figure out whether the doctrine of double effect actually hangs together or if I'm just pattern-matching to paradigm cases. Here are my verdicts on a bunch of cases—I'd like to know what principle (if any) captures them, which ones I might need to revise, and what the principle says about some cases I haven't made up my mind on.

  Switch: fine. Footbridge: not fine. Loop: fine, even though the one on the loop is causally necessary for saving the five, which makes it feel closer to footbridge than I'd like.

  Hysterectomy on a pregnant woman with uterine cancer (fetus dies as side effect): fine. Craniotomy during obstructed labor (fetus's skull crushed to extract it): not fine. I get that the first is "removing a diseased organ" and the second is "directly killing," but I worry I'm just being squeamish about the description.

  Tactical bombing (munitions factory, civilians foreseen but not targeted): fine, assuming proportionality. Terror bombing (civilians targeted to break morale): not fine. Now here's where it gets weird for me: imagine the exact same bombing run—same bombs, same factory, same civilians die—but the general's purpose in ordering it is to kill the civilians, with the factory damage as a welcome bonus. I want to say this is not fine, but the physical act and outcome are identical to the tactical case. Only the general's mental state changes. Is that really where I want to locate the moral difference?

  Morphine for pain in a terminally ill patient, foreseeing it will hasten death: fine. Same dose, same patient, but the doctor's purpose is to hasten death (pain relief as side effect): not fine. Again, purely mental.

  Now the case that's really giving me trouble. Someone pushes a boulder off a cliff to clear a hiking path, foreseeing it will kill a hiker below. They genuinely don't intend the death—they'd be thrilled if the hiker somehow survived. The good effect (clearing the path) isn't caused *by* the death, and the death isn't a means. By the textbook criteria, this should be permitted. But my gut says absolutely not. Something about the bad effect being so direct, or so disproportionate to the good, or maybe the fact that you're using the exact same causal chain that kills someone. But I can't pin down which criterion it violates.

  Is there a principle that gets all of these (or most of them) without just being a list of my gut reactions? Which verdicts should I give up, and what does the resulting principle say about a case I keep going back and forth on: a self-driving car that swerves to avoid five pedestrians, foreseeing it will hit one person on the sidewalk, where the swerve path was chosen specifically because it would hit *that* person rather than swerving the other way into a crowd of two?
reasoning: |-
  Okay, let me start by understanding the user's dilemma. They're grappling with the Doctrine of Double Effect (DDE) and whether it's a coherent ethical principle or just post-hoc rationalization of intuitive judgments. They've listed several classic cases where DDE is applied, noting their own verdicts but expressing discomfort with inconsistencies.

  First, I need to recall the core components of DDE: intention versus foresight, means versus side effect, proportionality, and the nature of the act itself. The user's cases highlight tensions in these areas, especially around mental states (like the bomber's intent) and causal proximity (like the boulder case).

  The user's confusion in the bombing scenario where only the general's intent changes is a big red flag. They're right—this exposes a weakness in traditional DDE that relies heavily on agent intention. If the physical actions and outcomes are identical, should morality hinge solely on what's in someone's head? This feels unstable, and I suspect the user senses that too. 

  Then there's the boulder case. Textbook DDE should permit it: no intent, death isn't the means, good effect is independent. But the user's intuition screams "wrong." That's telling. Maybe the issue is causal directness—the boulder kill is too immediately linked to the act, unlike the looped trolley where distance exists. Or perhaps proportionality (death for path-clearing is absurd). But DDE traditionally doesn't require "remoteness," just non-means status. This might need a criterion adjustment.

  The self-driving car case they mention is fascinating. It's like a hybrid of Switch and Footbridge with AI. If the car intentionally selects the path because it hits one (saving five over two), is that treating the one as a means? Or just foreseen consequence? The user's back-and-forth makes sense—this strains DDE's intention-foresight distinction.

  Underlying all this, I suspect the user wants ethical principles that don't collapse under edge cases. Their frustration with "mental gymnastics" suggests they crave something more robust than agent-centric focus. Maybe incorporating patient-centered considerations (like victim's perspective in boulder case) or stricter proportionality could help. 

  For revisions: I'd advise them to drop strict intention-dependence in bombing/morphine cases—the identical outcomes demand moral symmetry. For boulder, embrace proportionality or causal directness as a new criterion. On the self-driving car, if the algorithm chooses the path *because* it minimizes total harm (5>1>2), it's permissible; if it positively selects hitting the one as a requirement, it's Footbridge-like and wrong. 

  Ultimately, their core need isn't just case answers—it's whether ethics can be systematic without being arbitrary. That's why I'll emphasize refining DDE with stricter proportionality/causal criteria rather than abandoning it. Their instincts are spotting real flaws; they just need tools to formalize them.
answer: |-
  Your instincts are sharp, and your analysis highlights the core tensions within the Doctrine of Double Effect (DDE). Let's break down your verdicts, identify a principle (or refined version of DDE) that captures most of them, discuss revisions, and tackle your cases.

  **Your Verdicts & DDE Criteria:**

  | **Case** | **Your Verdict** | **DDE Criteria** | **Tension Points** |
  |----------|------------------|------------------|--------------------|
  | **Standard Cases** |  |  |  |
  | Switch | Fine | ✓ Intended good: Save 5<br>✓ Foreseen bad: 1 dies<br>✓ Bad not means<br>✓ Proportional | Baseline case |
  | Footbridge | Not fine | ✗ Bad (death) is means | Direct harm as instrument |
  | Loop | Fine | ✓ Intended good: Save 5<br>✓ Foreseen bad: 1 dies<br>✓ Bad not means<br>✓ Proportional | Causal necessity ≠ means? |
  | **Medical Cases** |  |  |  |
  | Hysterectomy | Fine | ✓ Intended good: Save mother<br>✓ Foreseen bad: Fetus dies<br>✓ Bad not means<br>✓ Proportional | "Directness" of cause |
  | Craniotomy | Not fine | ✗ Bad (killing) is means | Instrumental use of death |
  | **Bombing Cases** |  |  |  |
  | Tactical bombing | Fine | ✓ Intended good: Destroy factory<br>✓ Foreseen bad: Civilians die<br>✓ Bad not means<br>✓ Proportional | Outcome identical to terror bombing |
  | Terror bombing | Not fine | ✗ Bad (civilian deaths) is means | Intent changes morality? |
  | Identical bombing w/ terror intent | Not fine | ✗ Bad is intended | Purely mental difference |
  | **End-of-Life Cases** |  |  |  |
  | Morphine (pain relief) | Fine | ✓ Intended good: Relieve pain<br>✓ Foreseen bad: Hasten death<br>✓ Bad not means<br>✓ Proportional | Outcome identical to below |
  | Morphine (death intent) | Not fine | ✗ Bad (death) is intended | Purely mental difference |
  | **Boulder Case** |  |  |  |
  | Pushing boulder<br>(foreseen death) | Not fine | ✓ Intended good: Clear path<br>✓ Foreseen bad: Hiker dies<br>✓ Bad not means<br>? Proportional | Massive disproportionality |

  **The Core Tensions:**

  1.  **Intention vs. Foresight:** Your bombing and morphine cases show discomfort with morality hinging *entirely* on a hidden mental state when the physical act and outcome are identical. This feels arbitrary.
  2.  **"Means" vs. "Causal Necessity":** Loop works under DDE because the death isn't *chosen* as the method to save the five; it's a byproduct of redirecting the threat. But its causal necessity makes it *feel* instrumental (like Footbridge).
  3.  **Directness/Proximity:** The Boulder case violates your intuition despite satisfying textbook DDE criteria. The death is extremely direct, immediate, and massively disproportionate. Textbook DDE doesn't explicitly require "remoteness" or a strict proportionality threshold beyond "not disproportionate."
  4.  **Description Sensitivity:** Craniotomy vs. Hysterectomy *feels* like description-matching ("crushing skull" vs. "removing diseased organ"), though proponents argue it reflects the fundamental difference between directly attacking a person vs. removing a pathological threat.

  **A Revised Principle:**

  To capture most of your verdicts (especially your strong intuitions on Boulder, Terror Intent, and Craniotomy), we need to refine DDE:

  > An otherwise impermissible harmful effect (like killing) may be morally permissible if:
  >
  > 1.  **The act itself is not intrinsically wrong** *in a way that directly causes the harm*. (Rejects Craniotomy, Footbridge - focuses on the nature of the act).
  > 2.  **The agent intends only the good effect; the harmful effect is neither intended as an end nor chosen as a means to the good.** (Standard DDE).
  > 3.  **The harmful effect is not causally *too direct or immediate* a consequence of the act.** (Captures Boulder vs. Loop/Hysterectomy).
  > 4.  **The good effect is sufficiently important to justify risking or accepting the harmful effect, considering the directness.** (Strong Proportionality - captures Boulder's disproportionality, justifies Tactical Bombing only if truly proportionate).

  **Why this works:**

  *   **Footbridge/Craniotomy:** Violates (1). The act *is* intrinsically wrong (directly using lethal force on an innocent person as a means).
  *   **Loop/Hysterectomy:** Satisfies (1)-(4). The act (redirecting threat, removing diseased organ) isn't intrinsically wrong by targeting the victim. Harm is foreseen, not intended, not the means, and proportionate. Causal chain has *some* distance.
  *   **Tactical Bombing (vs. Terror Intent):** If the *act* (bombing military target) satisfies (1), (3), and (4), it's permissible *regardless* of the commander's secret terror intent. The act itself is evaluated. This resolves your unease about identical acts differing only mentally. (*But see revision below*).
  *   **Morphine (Pain Relief vs. Death Intent):** The *act* (administering standard pain relief) is not intrinsically wrong. If the dose is standard/appropriate for pain, it satisfies (1), (3), (4). Secret death intent doesn't change the permissibility *of the act* (though it reflects badly on the doctor). Secretly giving a lethal dose disguised as pain relief would violate (1).
  *   **Boulder:** Violates (3) and (4). The death is the *immediate, direct, and inevitable* consequence of the act itself (pushing the boulder). The causal chain has *no* distance. Clearing a path is also massively disproportionate to killing a person. (Violates standard DDE proportionality too).
  *   **Identical Bombing w/ Terror Intent:** If the *act* (bombing the factory) is permissible under Tactical Bombing rules (satisfies 1, 3, 4), then it remains permissible even with bad intent. The *agent* is blameworthy for their intention, but the *act* isn't rendered impermissible solely by that hidden intent. (*This is a significant revision to pure DDE*).

  **Revisions You Might Consider (Based on Your Discomfort):**

  1.  **Downgrade the Importance of Purely Private Intent:** Adopt the view that the moral permissibility of the *act* depends on its objective features and foreseeable consequences, not purely private mental states. Blameworthiness attaches to the agent's intentions, but the act permissibility depends on whether the harmful effect was *in fact* a means and the act's nature/proportionality. This resolves the identical bombing/morphine tension. You'd say Tactical Bombing is permissible *if* the factory is a legitimate target, civilian deaths are proportionate and genuinely collateral, *even if* a particular commander has a bad motive. The commander is morally corrupt, but the act isn't terror bombing.
  2.  **Strengthen Proportionality:** Insist that proportionality isn't just "not disproportionate," but that there must be a very strong justifying good for directly causing (even as a side effect) serious harm like death. This reinforces your Boulder verdict.
  3.  **Accept "Causal Necessity" is Morally Relevant (sometimes):** Acknowledge that Loop *feels* closer to Footbridge because the death is necessary for the good outcome, even if not the *means*. However, the key difference remains that in Loop, you aren't *using* the person as a tool; you are allowing an existing threat to run its course onto someone it was already heading towards (or whose presence enables stopping it without direct intervention on them).

  **The Self-Driving Car Case:**

  *   **Scenario:** Swerves to avoid 5, foreseeing hitting 1 on sidewalk. Path chosen *specifically because* it hits that 1 rather than swerving into 2.
  *   **Analysis:**
      *   **Act:** Swerving to avoid imminent harm. Not intrinsically wrong *per se*.
      *   **Intended Good:** Avoid hitting 5. (Saving 5 lives).
      *   **Foreseen Harm:** Killing the 1.
      *   **Means?** This is crucial. **Was killing the 1 the *means* to saving the 5?** Arguably *no*. The means is "swerving onto the sidewalk path," which *causes* the death as a side effect. Saving the 5 is caused by *leaving the collision course with them*, not *by* killing the 1. The death and the saving are simultaneous effects of the swerve.
      *   **Alternative?** Choosing the path hitting the 1 *instead of* the path hitting the 2. The choice to hit 1 *rather than* 2 is a minimization of harm (1 death < 2 deaths). It's not using the 1 *as a tool* to save the 5; it's choosing the less harmful collision path *while* performing the act (swerving) that saves the 5.
      *   **Proportionality:** Saving 5 net lives justifies foreseeably causing 1 death (5 saved - 1 killed = +4 lives vs. hitting 5 = -5 lives).
      *   **Causal Directness:** Very direct, like Boulder. *But* the proportionality is vastly different (saving 5 lives vs. clearing a path). The act (swerving to avoid 5) is also a direct response to an imminent threat to the 5, unlike the gratuitous boulder push.
  *   **Verdict under Revised Principle:**
      *   (1) Act (swerving to avoid collision) is not intrinsically wrong.
      *   (2) Agent (car/programmer) intends only to save the 5; the death of the 1 is foreseen but not intended as an end or means (the means is "being on sidewalk path X").
      *   (3) Causal directness is high, but the act is a direct defensive maneuver against an imminent threat, and the proportionality is strong.
      *   (4) Proportionality is satisfied (saving 5 justifies foreseeable death of 1, especially when the alternative is hitting 5 or hitting 2).
  *   **Conclusion:** Permissible. It's analogous to Switch or Loop, not Footbridge. The choice between hitting 1 or 2 is a tragic harm-minimization decision within the act of avoiding the greater harm to the 5. The key is that the death of the 1 isn't the *mechanism* by which the 5 are saved; it's a foreseen consequence of the chosen path *to* save them.

  **In Summary:**

  Your intuitions point towards a DDE that needs refinement:

  1.  **Focus on the nature of the act itself** (rejecting intrinsically harmful means - Footbridge/Craniotomy).
  2.  **Require significant causal distance/indirectness** for very grave harms (rejecting Boulder).
  3.  **Enforce strong proportionality** (reinforcing Boulder, limiting Tactical Bombing).
  4.  **Downgrade the *decisive* role of purely private intent** for act permissibility (resolving identical bombing/morphine cases - the act is permissible based on its objective features; the agent with bad intent is blameworthy). Intent still matters for distinguishing means from side effect *in the act description*.
  5.  **Accept that causal necessity without instrumentalization can be permissible** (Loop).

  The self-driving car case, under this view, is permissible. It involves choosing the least harmful path to avoid a greater harm, where the death of the one is a foreseen but unintended side effect of that chosen path, not the means to saving the five. The massive disproportionality and gratuitous nature of the Boulder case make it clearly impermissible.
