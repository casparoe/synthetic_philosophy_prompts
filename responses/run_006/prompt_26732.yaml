prompt: |-
  I just spent two hours arguing with a friend about superrationality, and I think we talked past each other on something fundamental. Here's the issue. My friend insists that superrationality — the idea Hofstadter introduced, where rational agents who recognize each other as rational will both cooperate in a one-shot Prisoner's Dilemma because they'll run the same reasoning and reach the same conclusion — just reduces to common knowledge of rationality plus some kind of symmetry or mirroring assumption. I pushed back that this can't be right, because standard common knowledge of rationality in game theory doesn't select cooperation in the one-shot PD under any equilibrium refinement I know of, and the whole point of superrationality seems to be that it's a genuinely different solution concept. But I couldn't articulate clearly what the difference actually is, and by the end I wasn't sure which of us was confused.

  Please explain the conceptual relationship between superrationality and common knowledge of rationality. Are they genuinely distinct ideas, or is one a special case of the other? If they're distinct, what exactly is the extra ingredient in superrationality that common knowledge of rationality lacks — is it something about the agents' knowledge of each other's decision procedures, or about counterfactual reasoning, or about the source or architecture of their rationality, or something else? I'm less interested in formal reconstructions (though I won't object to them) than in getting clear on the conceptual architecture: what each notion is supposed to do, and why one can't simply be collapsed into the other.

  Take the perspective of an expert on decision theory and philosophical logic. Think carefully and lay out the conceptual landscape before zeroing in on the relationship. If it helps, start by distinguishing different senses of "common knowledge of rationality" that might be in play, since that might be part of the confusion.
