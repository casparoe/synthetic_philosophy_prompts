  I recall economics often handles this with "dynamic consistency" but that seems too narrow - it would condemn Carol's savings account as irrational! Philosophy of mind's "diachronic rationality" might help, but needs to incorporate epistemic elements.

  Ah! The user's gym resolution example is particularly sharp. If we call that "irrational," we pathologize normal willpower struggles. If we call it "rational," money pumps become defensible. Need to thread this needle carefully.

  Perhaps the answer lies in distinguishing between:
