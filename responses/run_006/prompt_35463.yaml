answer: |-
  Here's a breakdown of the desiderata for a decision theory handling ambiguity, centered on the Ellsberg paradox and its implications. I'll structure it as requested, highlighting non-negotiables, camp-specific preferences, and critical incompatibilities.

  **Core Non-Negotiables (Empirical Adequacy & Conceptual Foundation):**

  1.  **Capture Ellsberg Paradox Behavior:**
      *   **Case:** The standard Ellsberg two-urn experiment. Subjects reliably prefer betting on known probability (Urn K: 50 red, 50 black) over unknown probability (Urn U: 100 red/black, ratio unknown) for *both* colors. They exhibit ambiguity aversion.
      *   **Requirement:** The theory *must* predict a strict preference for betting on Urn K for red *and* a strict preference for betting on Urn K for black over betting on Urn U for the respective color. It must allow choices incompatible with a single, additive subjective probability measure over *all* states in Urn U.
      *   **Status:** **Non-Negotiable.** This is the core phenomenon the theory is built to address. Failure here means the theory doesn't handle ambiguity aversion.

  2.  **Model Ambiguity Aversion (and Related Attitudes):**
      *   **Case:** Beyond Ellsberg, people exhibit aversion to ambiguity in insurance, financial markets, medical decisions, etc. Some (rarer) cases show ambiguity preference or neutrality.
      *   **Requirement:** The theory must provide a formal representation (e.g., through functional forms, set structures, weighting functions) that can generate *aversion* to ambiguous acts/events as the typical case, but also accommodate *neutrality* or *preference* (seeking ambiguity) depending on parameters or context.
      *   **Status:** **Non-Negotiable.** The core purpose is to model attitudes towards unknown probabilities.

  3.  **Distinguish Risk from Ambiguity:**
      *   **Case:** The essence of Ellsberg. People treat known probabilities (risk) differently from unknown probabilities (ambiguity). Choices under risk (Urn K) follow expected utility reasonably well; choices under ambiguity (Urn U) systematically deviate.
      *   **Requirement:** The theory must have distinct formal mechanisms for representing beliefs under risk (known probabilities) and under ambiguity (unknown probabilities). It should reduce to Expected Utility (EU) or Subjective Expected Utility (SEU) when ambiguity vanishes (all probabilities known).
      *   **Status:** **Non-Negotiable.** Blurring this distinction undermines the motivation for the theory.

  **Important Rationality & Coherence Requirements (Often Contested):**

  4.  **Dynamic Consistency (DC):**
      *   **Case:** Plans made in advance should ideally remain optimal when a future decision node is reached, assuming no new information contradicts the initial beliefs and preferences. Violations can lead to time inconsistency and potential exploitation.
      *   **Requirement:** The optimal strategy chosen at the initial node should remain optimal at every subsequent decision node it reaches, given the information available at that node and *the same underlying preferences/beliefs*.
      *   **Status:** **Highly Desirable / Camp-Specific (Often Sacrificed).** Normatively appealing for rational planning. However, **many successful ambiguity models (Maxmin EU, Smooth Ambiguity, Variational Preferences) violate DC in dynamic Ellsberg-like setups.** Some argue DC is too strong under ambiguity; others seek models preserving it (e.g., using sophisticated choice).

  5.  **Consequentialism / Separability (Closely related to Sure-Thing Principle - STP):**
      *   **Case:** Savage's Sure-Thing Principle (STP): If two acts yield the same outcome on an event E, then preferences between them should depend only on their outcomes on the complement of E. Consequentialism: Choices at a node should depend only on the continuation subtree from that node (future consequences), not on unrealized past paths or payoffs.
      *   **Requirement:** Preferences should satisfy STP / Choices at a node should be separable (depend only on the subproblem from that node).
      *   **Status:** **Camp-Specific / Often Sacrificed.** SEU relies heavily on STP. **Ellsberg choices inherently violate STP** (preference depends on the *interaction* of payoffs across ambiguous states). Most ambiguity models relax STP. Preserving it often requires controversial moves like state-dependent utility or rejecting Ellsberg behavior as irrational.

  6.  **Avoidance of Strict Dutch Books:**
      *   **Case:** A set of bets (accepted individually) that guarantee a sure loss no matter what happens. A clear indicator of incoherence.
      *   **Requirement:** No agent whose preferences conform to the theory should be susceptible to accepting a collection of bets that results in a sure loss.
      *   **Status:** **Highly Desirable / Usually Maintained.** Most mainstream ambiguity models (Maxmin, Smooth, α-MEU) avoid strict Dutch books by requiring some form of "coherent" belief representation (e.g., a convex set of priors). Violations are seen as a major weakness.

  7.  **Probabilistic Sophistication (Relaxed Form Often Desired):**
      *   **Case:** People can often consistently rank events by likelihood ("A is more likely than B") without assigning precise probabilities.
      *   **Requirement:** The theory should allow for preferences over acts to reveal a (possibly incomplete) qualitative likelihood ordering over events, potentially represented by a family of probabilities or a non-additive capacity. It shouldn't require *precise additive* probabilities over all events.
      *   **Status:** **Desirable / Often Achieved.** While rejecting *precise additive* probabilities (Probabilistic Sophistication in the SEU sense), good ambiguity models allow deriving likelihood comparisons (A is unambiguously more likely than B).

  **Practical & Meta-Requirements:**

  8.  **Tractability & Applicability:**
      *   **Case:** The theory should be usable for modeling economic behavior, contract design, financial markets, etc.
      *   **Requirement:** Functional forms or solution concepts should be manageable for analysis, comparative statics, and calibration to data. Should integrate reasonably well with standard game theory and equilibrium concepts.
      *   **Status:** **Highly Desirable.** Models like Maxmin EU (Gilboa-Schmeidler) and Smooth Ambiguity (Klibanoff et al.) are popular partly due to relative tractability.

  9.  **Cognitive Plausibility:**
      *   **Case:** How do people *actually* process ambiguity? Rules of thumb, heuristics, focal points (like 50/50), multiple priors?
      *   **Requirement:** The model's mechanics (e.g., considering multiple scenarios, applying pessimism, distorting probabilities) should have some grounding in plausible cognitive processes, even if simplified.
      *   **Status:** **Desirable / Camp-Specific.** Models like Prospect Theory (for risk/ambiguity hybrids) or heuristic-based models prioritize this. Axiomatic foundations prioritize coherence over process.

  **Key Incompatibilities & Trade-offs (The Crucial Part):**

  *   **Ellsberg + STP/Consequentialism + DC is Impossible (in standard Savage framework):**
      *   **Conflict:** Ellsberg choices **directly violate** Savage's Sure-Thing Principle (STP), a cornerstone of SEU and dynamic consistency proofs. Most attempts to accommodate Ellsberg *within* a consequentialist/STP framework involve either rejecting the behavior as irrational (unacceptable for your goal) or making radical changes (e.g., state-dependent utility interpreted non-standardly, abandoning universal state spaces). **Accommodating Ellsberg typically forces abandonment of STP/consequentialism.**

  *   **Ellsberg + Dynamic Consistency (DC) is Challenging / Often Impossible:**
      *   **Conflict (Machina's Reflection Example / Epstein's Dynamic Ellsberg):** Consider a dynamic version of Ellsberg. You first choose between betting on Urn K Red or Urn U Red. *Later*, if you chose Urn U Red, you might get a chance to switch to Urn U Black (if it's offered, revealing no info). An ambiguity-averse agent might initially prefer Urn K Red over Urn U Red. But if later offered the switch to Urn U Black *after* choosing Urn U Red, they might switch (since Urn U Black *now* seems equivalent to a 50/50 bet, avoiding the ambiguity). This planned switch violates DC: the initial plan to choose Urn U Red isn't followed through. The initial preference (K Red > U Red) relies on the ambiguity of U; the later preference (U Black > U Red if switched) treats U Black as 50/50 *given the choice context*. Models capturing Ellsberg (like Maxmin EU or Smooth Ambiguity) often predict this DC violation.
      *   **Resolution Attempts:**
          *   **Sophistication:** Acknowledge the future inconsistency and choose the initial act knowing you'll switch later, leading to a different initial choice (e.g., choosing K Red to avoid the inconsistent path).
          *   **Model Restrictions:** Use specific subclasses (e.g., α-MEU with α=0 or α=1, Choquet EU with specific capacities) which *might* avoid DC violations in specific setups, but often at the cost of generality or psychological plausibility.
          *   **Alternative Updating:** Use non-Bayesian updating rules (e.g., Full Bayesian Updating for sets of priors, Maximum Likelihood Updating) which can sometimes restore DC for specific sequences, but may cause issues elsewhere.
          *   **Accept the Violation:** Argue that DC is less compelling under ambiguity, where the arrival of a choice opportunity *without revealing information* might still change the *interpretation* of the ambiguity.

  *   **Ellsberg + Strict Probabilistic Sophistication (Single Probability Measure) is Impossible:**
      *   **Conflict:** Ellsberg choices are *defined* by their incompatibility with *any* single, additive subjective probability measure over the ambiguous urn's states. A theory requiring such a measure cannot explain the paradox.
      *   **Resolution:** All ambiguity models *must* relax strict probabilistic sophistication (single additive prior). They use non-additive measures (Choquet), sets of priors, second-order probabilities, etc.

  **Summary for Your Rabbit Hole Descent:**

  1.  **Non-Negotiables (Must-Have):** #1 (Ellsberg Behavior), #2 (Ambiguity Attitude), #3 (Risk vs. Ambiguity Distinction).
  2.  **Core Tension:** You **cannot** have all three: (i) Accommodate Ellsberg ambiguity aversion, (ii) Satisfy the Sure-Thing Principle / Consequentialism, (iii) Maintain Dynamic Consistency in all dynamic settings. **Ellsberg forces you to abandon STP/Consequentialism.** Maintaining Dynamic Consistency is then also very challenging and often requires either sophisticated choice (changing initial plans) or accepting limitations on the model.
  3.  **Highly Desirable:** Avoid strict Dutch Books (#6), some form of Probabilistic Sophistication (#7), Tractability (#8).
  4.  **Camp-Specific:** The weight placed on Dynamic Consistency (#4) and Consequentialism/STP (#5) varies significantly. Cognitive Plausibility (#9) is valued differently by axiomatic vs. behavioral camps.

  **Your Starting Point:** Accept that abandoning STP/Consequentialism is the price of admission for handling Ellsberg. The major fork in the road is then how you handle **dynamic choice:** Will you accept potential dynamic inconsistencies as a feature of ambiguity (e.g., Maxmin EU, Smooth Ambiguity), or will you build in sophisticated choice from the start, or will you adopt non-standard updating rules to try to mitigate it? Be acutely aware of Machina/Epstein-style dynamic paradoxes when evaluating your theory's dynamics. Good luck!
