  Key constraints: No direct questions about motives; everything must be case-based. The quiz should be accessible to non-specialists but philosophically rigorous. I need to ensure the cases force distinctions between views, especially where they might blur (like good-motive vs virtue views).

  For additional cases, I'll include: overdetermination (someone who would help regardless of duty), reluctance (whether it adds or subtracts worth), and cold calculation (acting on cost-benefit analysis). This covers the user's requests.

