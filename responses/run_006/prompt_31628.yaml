  They provided several required cases: grudging helper, spontaneous sympathy, wallet return with mistaken identity, rule-follower without understanding, habitual generosity, and a Huck Finn scenario. I need to add 2-3 more cases that highlight differences in overdetermination, reluctance, and cold cost-benefit calculations.

