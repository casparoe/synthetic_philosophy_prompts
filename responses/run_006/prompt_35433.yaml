prompt: |-
  i'm about to go deep on moral uncertainty, and I keep bouncing off the papers because everyone defends their own account without ever saying what the account is actually supposed to do. So before I read any further: write me the desiderata for a theory of how to act when you're not sure which moral theory is right. I mean the second-order problem, not first-order ethics. Give me the requirements with the case or consideration behind each — which situations the theory has to handle (uncertainty between two consequentialisms that share a currency, uncertainty between consequentialism and deontology where there's no common currency, moral uncertainty mixed with ordinary empirical uncertainty, tiny credences in extreme or fanatical views, and the regress where you're unsure how to handle your own uncertainty). Which distinctions it can't collapse (choiceworthiness vs rightness, uncertainty between moral theories vs uncertainty about non-moral facts, and maybe the difference between acting under moral uncertainty and just deferring to a moral expert). Which results from decision theory it has to respect or explicitly reject (dominance, expected utility reasoning, the claim that intertheoretic comparisons need a scale before they mean anything). For each requirement say whether it's non-negotiable or just one camp's preference, and why. Then flag any pairs of desiderata you think can't be jointly satisfied — my suspicion is that comparability across theories and avoiding fanaticism pull in opposite directions, but I want the full map. End with a quick scorecard of the main candidates against the list: maximizing expected choiceworthiness, my-favourite-theory, and whatever the parliamentary or bargaining views are called. Keep the scorecard short; the list is what I actually need.
reasoning: |-
  Okay, the user is diving deep into moral uncertainty and is frustrated that papers defend their accounts without clarifying what the theory is supposed to achieve. They want a clear set of desiderata for a theory of moral uncertainty. Let me start by understanding their exact needs.

  First, they mentioned specific situations the theory must handle: uncertainty between two consequentialisms with shared currency, between consequentialism and deontology without common currency, mixing moral and empirical uncertainty, tiny credences in extreme views, and the regress problem. I need to list each scenario and explain why it's a requirement. For example, shared currency cases test comparability, while mixed uncertainty checks if the theory integrates both types coherently.

  Next, distinctions the theory shouldn't collapse. They pointed out choiceworthiness vs. rightness, moral vs. empirical uncertainty, and acting under uncertainty vs. deferring to an expert. These are crucial because conflating them could lead to flawed decision-making. For instance, confusing choiceworthiness with rightness might ignore the agent's epistemic state.

  Then, decision theory principles to respect or reject. Dominance, expected utility, and intertheoretic comparisons. The user is likely concerned about how these apply in moral contexts. Intertheoretic comparisons are tricky because different theories might lack a common scale, posing a challenge for expected utility approaches.

  The user suspects that comparability and avoiding fanaticism conflict. I need to confirm this tension. If theories can be compared, fanatical views with low credence but high stakes could dominate decisions. But without comparability, expected utility can't be calculated. That's a key trade-off.

  For the scorecard, they want a brief evaluation of major theories: Maximizing Expected Choiceworthiness (MEC), My Favourite Theory (MFT), and parliamentary approaches. Each should be assessed against the desiderata. MEC struggles with comparability and fanaticism, MFT ignores uncertainty, parliamentary methods handle comparability but might collapse distinctions or face regress.

  The user's deeper needs: They want a structured framework to evaluate existing literature. They’re frustrated with vague defenses and need clear criteria to compare theories. They might be preparing for research or a paper, seeking a roadmap to navigate the field. Highlighting conflicts between desiderata helps them understand why no theory satisfies all and where innovations are needed.

  I should ensure each desideratum is labeled as non-negotiable or debatable. For example, handling basic cases is non-negotiable, while avoiding fanaticism might be more contentious. Also, note where desiderata conflict, like comparability vs. fanaticism, as this is central to their suspicion.

  Finally, the scorecard should be concise. Point out MEC’s issues with comparability and fanaticism, MFT’s failure on uncertainty, parliamentary methods’ potential but unresolved regress. This gives a quick reference without deep analysis.
answer: |-
  Here are the core desiderata for a theory of moral uncertainty, rooted in the challenges you identified. Each includes the motivating case/consideration and its negotiability status.

  **I. Situations the Theory Must Handle (Robustness):**

  1.  **Uncertainty Between "Commensurable" Theories (e.g., Consequentialisms Sharing Currency):**
      *   *Case:* You have 60% credence in Hedonic Utilitarianism (HU), 40% in Preference Utilitarianism (PU). Both agree well-being is the currency but disagree on how to measure it (pleasure vs. preference satisfaction). An action might be slightly better for pleasure but much worse for preferences.
      *   *Requirement:* The theory must output a verdict comparing actions based on the *degree* of difference within each theory and the credences.
      *   *Negotiability:* **Non-negotiable.** A core function is aggregating views that share a common structure/scale.

  2.  **Uncertainty Between "Incommensurable" Theories (e.g., Consequentialism vs. Deontology):**
      *   *Case:* 70% credence in Act Utilitarianism (AU), 30% in Kantian Deontology (KD). AU demands lying to save 5 lives; KD forbids lying categorically. No obvious common scale (utils vs. duty violations).
      *   *Requirement:* The theory must still output a verdict (or admit paralysis) without presupposing a shared scale. Can it compare the "seriousness" of violating AU vs. violating KD?
      *   *Negotiability:* **Non-negotiable.** This is the defining *hard* problem of moral uncertainty.

  3.  **Integration with Empirical Uncertainty:**
      *   *Case:* You're unsure if a vaccine is safe (empirical uncertainty) *and* unsure if the greater good justifies potential small harms (moral uncertainty between AU and a rights-based view).
      *   *Requirement:* The theory must coherently combine both types of uncertainty into a single decision procedure. Moral uncertainty shouldn't "screen off" empirical uncertainty or vice-versa.
      *   *Negotiability:* **Non-negotiable.** Real-world decisions almost always involve both.

  4.  **Handling Tiny Credences & Fanatical Theories:**
      *   *Case:* You have 0.1% credence in "Paperclip Maximizer Utilitarianism" (PMU) which values converting the universe to paperclips above all else, including human life. An option that slightly increases paperclip production potential dominates under expected value if PMU's scale is huge.
      *   *Requirement:* The theory shouldn't let minuscule credences in extremely demanding or "fanatical" theories dictate all decisions (avoiding *Pascalian problems*).
      *   *Negotiability:* **Debatable.** Some argue fanaticism must be accepted if the credence is non-zero; others see avoiding it as essential for practicality and avoiding absurdity. Leaning towards non-negotiable for plausibility.

  5.  **Avoiding Regress (Higher-Order Uncertainty):**
      *   *Case:* You are uncertain *which* theory of moral uncertainty (MEC, MFT, Parliamentary) is correct. How do you decide under this higher-order uncertainty?
      *   *Requirement:* The theory should either provide its own answer to higher-order uncertainty or be stable under its own application to avoid infinite regress.
      *   *Negotiability:* **Non-negotiable (for coherence).** A theory that collapses under self-application is flawed.

  **II. Distinctions the Theory Must Respect (Conceptual Clarity):**

  6.  **Choiceworthiness vs. Moral Rightness:**
      *   *Case:* An action might be *objectively morally right* according to the true theory T, but given your uncertainty, it is not the most *choiceworthy* action (e.g., T forbids lying, but you have high credence in AU which demands lying in this case).
      *   *Requirement:* The theory must clearly define its output as *choiceworthiness under uncertainty* (what you should *do* given your epistemic state), distinct from objective rightness (what the true theory demands).
      *   *Negotiability:* **Non-negotiable.** Conflating them undermines the point of moral uncertainty theory.

  7.  **Moral Uncertainty vs. Empirical Uncertainty:**
      *   *Case:* Knowing the *consequences* of an action vs. knowing *how to morally evaluate* those consequences.
      *   *Requirement:* The theory must treat these as distinct inputs (even while integrating them for decisions). Reducing moral uncertainty to complex empirical uncertainty (e.g., "What would a moral expert say?") avoids the normative challenge.
      *   *Negotiability:* **Non-negotiable.** The core problem is normative disagreement, not just lack of empirical data.

  8.  **Acting Under Uncertainty vs. Deferring to an Expert:**
      *   *Case:* Instead of aggregating theories yourself, you could just ask a trusted philosopher what to do.
      *   *Requirement:* The theory should provide a distinct rationale for *acting under one's own moral uncertainty* rather than simply outsourcing the decision. It should capture the agent's own responsibility.
      *   *Negotiability:* **Debatable, but important.** Many see the point as guiding the uncertain *agent*, not finding a proxy.

  **III. Decision-Theoretic Principles (Interaction & Justification):**

  9.  **Respect (or Justifiably Reject) Dominance Principles:**
      *   *Case:* If action A is better than action B according to *every* moral theory you give non-zero credence to, then A dominates B.
      *   *Requirement:* The theory should prescribe choosing A over B in such cases (Strict Dominance). Weak dominance (A is at least as good as B in all theories and strictly better in some) is more contentious but desirable.
      *   *Negotiability:* **Strict Dominance: Non-negotiable.** Weak Dominance: Highly desirable, potentially negotiable only with strong justification.

  10. **Intertheoretic Comparability:**
      *   *Case:* To calculate expected choiceworthiness (EC) across AU and KD, you need to know "how bad" is violating AU's demand relative to "how bad" is violating KD's duty.
      *   *Requirement:* The theory must either provide a method for making intertheoretic comparisons (cardinal, unit-bearing comparisons) between choiceworthiness assessments of different theories, or explicitly reject the need for EC reasoning and offer an alternative aggregation method.
      *   *Negotiability:* **Non-negotiable (as a requirement to address it).** *How* it addresses it (providing comparisons or rejecting EC) is the core debate.

  11 **Relationship to Expected Utility (EU) Reasoning:**
      *   *Case:* EU is the gold standard for empirical uncertainty. Should it be extended directly to moral uncertainty via Expected Choiceworthiness (EC)?
      *   *Requirement:* The theory must explicitly adopt, adapt, or reject EU reasoning for moral uncertainty and justify its stance, especially regarding requirement (10).
      *   *Negotiability:* **Non-negotiable (to take a stance).** The default position (often MEC) is to extend EU.

  **IV. Conflicts Between Desiderata:**

  *   **Comparability (10) vs. Avoiding Fanaticism (4):** This is the **core tension** you suspected. If you allow cardinal intertheoretic comparisons, and a fanatical theory assigns astronomically high/low values to outcomes, even tiny credences will dominate EC calculations, leading to seemingly absurd prescriptions (e.g., dedicating all resources to slightly increasing paperclip potential). Solutions involve rejecting comparability, rejecting EC, dampening scales ("variance normalization"), or ignoring tiny credences – each violating some desideratum.
  *   **EC/EU (11) vs. Incommensurability (2):** Strict EC *requires* comparability (10). If comparability is deemed impossible for fundamentally different theories (like AU vs. KD), then EC is impossible for those cases, forcing rejection of (11) for those cases or adoption of a non-EC method.
  *   **Robustness (1-5) vs. Parsimony/Feasibility:** Handling all complex cases perfectly might require an overly complex or computationally impossible theory. Practicality is a constraint.

  **Quick Scorecard of Main Candidates:**

  *   **Maximizing Expected Choiceworthiness (MEC):**
      *   **Strengths:** Handles (1, 3) naturally. Respects (6, 7, 9, 11). Clear EU foundation.
      *   **Weaknesses:** **Massively struggles with (2 & 10)** (incommensurability/comparability). **Fails (4)** catastrophically (fanaticism). **Struggles with (5)** (regress - what meta-theory for uncertainty about comparability?).
  *   **My Favourite Theory (MFT - just pick the theory with highest credence):**
      *   **Strengths:** Simple. Avoids (4, 10). Handles (2) by ignoring it.
      *   **Weaknesses:** **Fails core robustness (1, 2, 3)**. Ignores uncertainty below the top theory. Violates (9) if a dominated action is favored by the top theory. Violates (6) by conflating choiceworthiness with (probable) rightness.
  *   **Parliamentary / Bargaining Approaches (e.g., MacAskill, Riedener):**
      *   **Strengths:** Designed to handle (2 & 10) *without* needing cardinal comparability (uses bargaining or voting). Can potentially mitigate (4) through negotiation dynamics. Respects (6, 7).
      *   **Weaknesses:** Complexity. **Struggles with (3)** (integrating empirical uncertainty cleanly). **Faces (5)** (regress - bargaining under uncertainty about bargaining rules?). How to set voting weights/bargaining power is contentious. May violate (9) in complex cases.

  This list provides the critical map. No existing theory satisfies all desiderata perfectly, especially due to the fundamental tension between comparability and avoiding fanaticism. Your deep dive will involve seeing how different approaches grapple with these requirements and where they make their trade-offs. Good luck!
