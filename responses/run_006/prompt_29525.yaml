  She distrusts raw brain size because cows have larger brains than capuchins but lower moral weight, same with sheep vs. ravens. So brain size isn't the key factor. That means she's using other criteria. What could those be?

  Possible rules come to mind. First, cognitive complexity: problem-solving, learning, tool use. Capuchins and ravens are known for intelligence despite smaller brains. Ravens use tools, solve problems. Capuchins are clever monkeys. Elephants and dolphins also show high intelligence. Cows and sheep, while smart in some ways, don't exhibit the same level of complex behavior. Mice have basic intelligence but not advanced cognition. Frogs are simpler still.

  Second rule: evolutionary relatedness to humans. Chimps are close, then other mammals like dolphins and elephants. But capuchins are primates, so that fits. However, ravens are birds, not mammals, yet they're ranked with capuchins. If relatedness were the main factor, birds might be lower. But she places ravens high, so that suggests cognitive traits override phylogeny.

  Octopus presents a challenge. They're invertebrates, so not closely related to humans. But they show impressive cognitive abilities: problem-solving, learning, tool use. Their brain structure is different—no cortex, neurons in arms. But they exhibit flexible behavior. Under the cognitive complexity rule, octopuses should rank high, maybe near dolphins or elephants. Under a strict relatedness rule, they'd be low.

