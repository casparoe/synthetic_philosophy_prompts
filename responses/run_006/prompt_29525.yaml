  Social insects: if she ranks ants low despite social complexity, cognition is key. If high, then sociality matters. But ants don't have individual problem-solving, so likely low. Thus, cognitive complexity is the rule. Octopus should be high.
answer: |-
  Based on your friend's pattern of judgments and explicit rejection of raw brain size, two plausible implicit rules emerge. **The cognitive complexity rule provides the best fit overall and predicts a high ranking for the octopus.** Here's the breakdown:

  ### Rule 1: **Cognitive Complexity & Behavioral Flexibility** (Best Fit)
  - **Core Principle:** Moral weight scales with **demonstrated intelligence**—problem-solving, learning, tool use, social complexity, and behavioral adaptability.
  - **Fits the Data:**
    - Rejects raw brain size: Explicitly distrusts cow/sheep > capuchin/raven based on behavior trumping anatomy.
    - Elevates cognitively advanced species: Chimps (tool use, culture), dolphins (complex communication), elephants (memory, empathy), ravens (problem-solving, tool use), capuchins (tool use).
    - Demotes less flexible species: Cows/sheep (routine behaviors), mice/frogs (simpler cognition).
    - Ravens ≈ capuchins despite vast phylogenetic distance, due to comparable cognitive feats.
  - **Prediction for Octopus: HIGH**  
    Octopuses exhibit exceptional learning, problem-solving (e.g., escaping puzzles, opening jars), and object manipulation—directly aligning with traits she values. Their distributed neural architecture is functionally analogous to complex cognition in vertebrates. **Likely ranked near dolphins/elephants or slightly lower**, above cows/sheep but below chimps.

  ### Rule 2: **Phylogenetic Proximity to Humans** (Weaker Fit)
  - **Core Principle:** Moral weight decreases with **evolutionary distance from humans**, prioritizing mammals (especially primates).
  - **Fits *Some* Data:**
    - Humans > chimps > other mammals (dolphins/elephants/whales) > other vertebrates.
    - Explains mice > frogs (mammals vs. amphibians).
  - **Fails Key Data Points:**
    - Ravens (birds) ≈ capuchins (primates): This contradicts strict phylogeny.
    - Explicit rejection of brain size isn't explained—phylogeny doesn't require brain metrics.
  - **Prediction for Octopus: LOW**  
    As an invertebrate (mollusk), vastly distant from humans. Would likely rank **near frogs or slightly higher**, below all vertebrates mentioned.

  ---

  ### Why Cognitive Complexity Fits Best
  1. **Ravens are the decisive case:** Ranking them ≈ capuchins—despite being non-mammals—shows cognition overrides phylogeny.  
  2. **Brain size rejection:** Directly supports prioritizing *function* (behavior) over *structure* (absolute brain size or phylogeny).  
  3. **Mice > frogs:** Mice show more behavioral flexibility (e.g., learning mazes) than frogs, aligning with cognition.

  ---

  ### Prediction for Octopus
  - **Most Likely:** **HIGH moral weight**—comparable to dolphins/elephants.  
    *Why?* Octopus cognition (puzzle-solving, learning, manipulation) mirrors the traits she elevates in ravens and capuchins. Her distrust of neuroanatomy norms (e.g., cortex-centric views) suggests she’ll value the functional output of their unique neural architecture.  
  - **Uncertainty:** May rank it *slightly below* dolphins due to its invertebrate status or solitary nature, but **not low**.

  ---

  ### Critical Test Case to Separate the Rules
  **Honeybees or Ants (Social Insects)**  
  - **Cognitive Complexity View:** Should rank **LOW**. Despite complex *collective* behavior, individual cognition is limited (little evidence of learning/problem-solving at individual level).  
  - **Phylogenetic Proximity View:** Would rank **LOW** (invertebrates, distant from humans).  
  - **Result:** Inconclusive—both predict low.  

  **Better Test: Parrots (or Crows) vs. Dogs**  
  - **Cognitive Complexity:** Parrots/crows ≈ ravens (high problem-solving) > dogs (despite dogs being mammals).  
  - **Phylogenetic Proximity:** Dogs (mammals, close human ties) > parrots/crows (birds).  
  - **Your Friend’s Likely Judgment:** Parrots/crows ≈ **HIGH** (equal to ravens/capuchins), above dogs.  
    *Why?* Parrots exhibit exceptional cognition (tool use, symbolic communication). If she ranks them high, it confirms cognition dominates. If she ranks dogs higher, phylogeny plays a role.

  **Key Insight:** Her raven judgment already suggests cognition > phylogeny. Use the parrot/dog test for final confirmation, but predict octopus as **high** based on the strongest evidence.
