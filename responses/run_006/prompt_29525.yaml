  Also, why distrust brain size? Because it doesn't correlate with behavior. Capuchins and ravens have smaller brains but higher cognition. So neural density or efficiency might matter. Octopuses have many neurons, though distributed. Their problem-solving ability is evident. So cognitive rule would place them high. 

