prompt: |-
  In a discussion about futarchy, someone dismissed the worry that voters are too ignorant to set good policy by saying: "That's the whole point of 'vote on values, bet on beliefs' — voters only need to settle the value questions, and prediction markets handle the factual questions, so voter ignorance about facts doesn't matter." I've seen this slogan used to do a lot of work in futarchy debates, and I'm not sure it's all the same claim each time.

  I want to pin down what "vote on values, bet on beliefs" could actually mean. Please lay out the distinct precise claims this one-liner might be expressing — from the obviously true to the clearly false, from the descriptive to the normative. For each reading, state the claim in one sentence and give a one-sentence verdict (e.g., "trivial," "defensible but needs argument," "false as stated," "definitional," etc.). Then tell me which reading, if any, actually supports the move my interlocutor was making: that voter ignorance about facts is no objection to futarchy because voters only vote on values.

  Keep the whole response under 500 words.
reasoning: |-
  Okay, the user is asking about the phrase "vote on values, bet on beliefs" in the context of futarchy debates. They want to understand what this slogan could actually mean and which interpretation supports dismissing voter ignorance as a problem. 

  First, I recall that futarchy is a governance system where voters decide values while prediction markets handle factual questions. The user encountered someone dismissing concerns about voter ignorance by claiming voters only need to set values. The user is skeptical and wants precise interpretations of this slogan.

  I need to break down possible meanings of "vote on values, bet on beliefs." There are several ways this could be interpreted. I'll outline distinct claims, ranging from obvious to controversial, and evaluate each one. 

  For the descriptive claim: It's definitional that futarchy separates value decisions (voting) from belief formation (betting). That's straightforward. 

  The normative claim about efficiency: This argues that separating these roles is better. It's defensible but needs evidence about prediction markets versus traditional voting. 

  The sufficiency claim: Does this separation make voter factual ignorance irrelevant? This seems false as stated because values and facts can be entangled - voters might misjudge what they truly value when disconnected from facts. 

  The capability claim: That voters are better at values than facts. This is plausible but needs evidence about voter competence. 

  The operational claim: That prediction markets perfectly translate values into optimal policies. This is highly optimistic and likely false - markets can be distorted. 

  None of these fully support dismissing voter ignorance concerns. The strongest case is the sufficiency claim, but it's fragile. Values often require factual context, and voters might not even understand their own values without facts. 

  The user's deeper need seems to be: "Can futarchy really bypass voter ignorance?" My analysis shows the slogan's promise is overstated. Even in futarchy, value judgments aren't fact-proof. I'll present this clearly while staying under 500 words.
answer: |-
  Here are distinct interpretations of "vote on values, bet on beliefs" and their verdicts:

  1.  **Descriptive Claim:** Futarchy *defines* "voting" as solely expressing preferences over outcomes (values) and *defines* "betting" as solely estimating the likelihood of outcomes under policies (beliefs).  
      *Verdict:* **Definitional** (trivially true by futarchy's design).

  2.  **Normative Efficiency Claim:** Separating value judgements (voting) from factual predictions (betting) leads to *better* policy decisions than systems combining both in one vote.  
      *Verdict:* **Defensible but needs argument** (requires evidence prediction markets outperform voters on facts).

  3.  **Sufficiency Claim:** Voter ignorance about the factual consequences of policies is *irrelevant* because prediction markets handle all factual questions needed to implement chosen values.  
      *Verdict:* **False as stated** (Voters must still define measurable value metrics; facts/values can be entangled).

  4.  **Capability Claim:** Voters are *more competent* at judging ultimate ends (values) than predicting policy effects (beliefs).  
      *Verdict:* **Plausible but needs argument** (debatable scope of voter competence on abstract values).

  5.  **Operational Claim:** Prediction markets *perfectly* translate any democratically chosen value metric into the policy expected to maximize it, given known facts.  
      *Verdict:* **Highly optimistic, likely false** (Assumes perfect markets, no manipulation, perfect metric design).

  **Supporting the Interlocutor's Move:**
  The interlocutor relies primarily on the **Sufficiency Claim (3)**. They assert that because voters *only* vote on values (per the descriptive claim), and markets handle *all* factual beliefs, voter ignorance about facts *cannot* harm policy quality. However, this claim is false as stated. Voters must define the value metric ("maximize GDP," "reduce inequality") which inherently involves factual assumptions and trade-offs they may misunderstand. Poorly chosen or unmeasurable metrics render market predictions irrelevant or misguided. Factual ignorance can corrupt the "value" vote itself.

  **Conclusion:** While the slogan highlights a core futarchic *mechanism* (descriptive claim), the key claim used to dismiss voter ignorance (sufficiency claim) is invalid. Voter ignorance about facts *can* still undermine futarchy by corrupting the value metric definition.
