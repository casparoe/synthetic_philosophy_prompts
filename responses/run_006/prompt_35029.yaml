  - Step 2: It does not entrench any rule? It sets a default. But note: it might have the effect of entrenching rules that were enacted by a high threshold. However, the clause itself does not set a special threshold for itself beyond what it sets for others. It says for itself: it was enacted by two-thirds, so it can be repealed by two-thirds. So no entrenchment of a higher threshold? But it is preserving the threshold. The clause does not say anything about amending the rule (only repeal). Amendment might be different? The rulebook might distinguish between amendment and repeal. This is ambiguous? 
    - However, the clause only addresses repeal. Amendment might still be governed by the amendment rule. But repeal is a type of amendment. So there might be conflict. 
    - We go to step 4.

  Step 4: Ambiguity Check
    - It does not define "enact it". For old rules, we might not know the enactment threshold? 
    - It does not address rules that were amended: what is the enactment threshold for an amended rule? The original or the last amendment?
    - It does not address how this rule interacts with existing entrenchment clauses. For example, if a rule is entrenched (requiring a higher threshold for amendment), does this rule allow repeal by the enactment threshold (which might be lower)? 
    - Therefore, ambiguity (B: send back to clarify these points).

  The proposer must clarify and redraft.

  **Conclusion**

  The procedure will sometimes return answers the board may not like, such as requiring explicit language (which might make rules longer) or referring to a lawyer (which might slow the process). Also, the procedure cannot settle issues of current rulebook interpretation when there is ambiguity in the existing rules (like whether the current amendment rule is entrenched). Those must be left to the chairperson or lawyer's judgment.

  The procedure does not guarantee absolute safety from paradoxes, but it catches the most common pitfalls and forces clarity, reducing the chance of disputes.
answer: |-
  Below is a reusable screening procedure for amendment and entrenchment clauses, designed to be runnable by a cooperative secretary with no legal training in under an hour. The procedure is grounded in known issues of self-reference in rule systems (e.g., Nomic game paradoxes, legal self-amendment conflicts). It follows a step-by-step checklist format, with clear outcomes: **B** (send back to proposer for redrafting), **S** (safe to draft), or **R** (refer to chairperson/lawyer for judgment). Each step includes specific questions, checks, and decision criteria.

  ---

  ### **Screening Procedure for Amendment and Entrenchment Clauses**  
  **Purpose**: Identify hazards related to self-reference, self-amendment, entrenchment, and ambiguity.  
  **Time Limit**: 45–60 minutes.  
  **Materials Needed**: Proposed clause, current rulebook, pen/paper.  

  #### **Step 1: Self-Application Check**  
  **Question**: Does the clause explicitly state whether it applies to itself?  
  **Check**:  
  - Look for phrases like "this rule," "this section," or "including this provision."  
  - If absent, ask: "Is this clause part of the rulebook it seeks to govern?" (If yes, it implicitly self-applies).  
  **Sufficient Answer**: Explicit language (e.g., "This rule applies to itself" or "This rule is exempt").  
  - **B (Send back)** if: Not explicit AND clause governs rule amendments (e.g., voting thresholds, procedures). *Reason: Implicit self-application creates ambiguity (e.g., future disputes over whether the clause can be amended under its own rules).*  
  - **S (Safe)** if: Explicit or clause is unrelated to amendments (e.g., a financial policy).  
  - **R (Refer)** if: Clause claims to be unamendable but doesn’t specify self-application. *Reason: Risk of "self-embrace" paradox (invalid if unamendability doesn’t protect itself).*  

  > **Hazard 1: Clause applies to itself without saying so**  
  > - **Nature**: Drafting ambiguity (not a paradox).  
  > - **How to tell**: If the clause describes amendment rules but lacks self-reference, it’s ambiguous. A paradox only arises if it creates a logical loop (e.g., "This rule cannot be amended except under rules it invalidates").  

  ---

  #### **Step 2: Entrenchment Clarity Check**  
  **Question**: If the clause entrenches a rule (e.g., "Rule X requires 90% votes to amend"), does it specify whether *this entrenchment* is entrenched?  
  **Check**:  
  - Identify keywords: "unamendable," "protected," "except by [higher threshold]."  
  - Ask: "Can this entrenchment clause be amended by the default rule, or does it require a special vote?"  
  **Sufficient Answer**: Explicit hierarchy (e.g., "This entrenchment requires 90% votes to amend").  
  - **B (Send back)** if: Entrenchment is silent on its own amendability. *Reason: Ambiguity may allow circumvention (e.g., using a simple majority to remove entrenchment, then amending the rule easily).*  
  - **S (Safe)** if: Specifies conditions for amending entrenchment or has no entrenchment.  
  - **R (Refer)** if: Clause makes entrenchment irrevocable (e.g., "Rule X is eternally unamendable"). *Reason: "Eternity clauses" may create legal paradoxes if future assemblies reject their immutability.*  

  > **Hazard 2: Entrenchment without self-specification**  
  > - **Nature**: Drafting ambiguity (not a paradox).  
  > - **How to tell**: If entrenchment lacks self-reference, it’s ambiguous. A paradox exists only if it demands mutually exclusive conditions (e.g., "This rule can only be amended if it is first repealed").  

  ---

  #### **Step 3: Self-Amendment Authorization Check**  
  **Question**: Is this clause attempting to amend the rule that authorizes its own use?  
  **Check**:  
  - Compare the clause to the current amendment rule (e.g., "Rule 10: Amendments require 2/3 vote").  
  - Ask: "Does this proposal change Rule 10 itself, or a rule that depends on Rule 10?"  
  **Sufficient Answer**: The current rulebook allows self-amendment (explicitly or by precedent).  
  - **B (Send back)** if: Clause amends Rule 10 but omits reference to the current threshold (e.g., "Amendments now require 50% votes" without noting it was passed under 2/3). *Reason: Ambiguity about validity.*  
  - **S (Safe)** if: Clause explicitly states it is enacted under the current rule (e.g., "Under Rule 10, we change Rule 10 to 50%").  
  - **R (Refer)** if: Current rules prohibit self-amendment or are silent. *Reason: Legal systems disagree on implied self-amendment rights; requires interpretation.*  

  > **Hazard 3: Amending the rule authorizing its own use**  
  > - **Nature**: Drafting ambiguity OR paradox.  
  > - **How to tell**: If the clause uses the current rule to legitimize itself, it’s ambiguous but fixable. A paradox arises if it creates a circular void (e.g., "This amendment is valid only if future assemblies ratify it," but future assemblies lack authority without it).  

  ---

  #### **Step 4: Ambiguity and Mutual Exclusion Check**  
  **Question**: Can the clause be reasonably interpreted in two ways with contradictory outcomes?  
  **Check**:  
  - Read the clause aloud. Look for:  
    - Vague terms (e.g., "reasonable vote," "special circumstances").  
    - Double meanings (e.g., "rules enacted by majority" could mean "passed" or "created").  
    - Conflicts with existing rules (e.g., new entrenchment vs. existing thresholds).  
  **Sufficient Answer**: Unambiguous language with defined terms.  
  - **B (Send back)** if: Any ambiguity found. *Reason: Drafting flaw that invites disputes.*  
  - **S (Safe)** if: Clear and consistent with the rulebook.  
  - **R (Refer)** if: Ambiguity creates a "true contradiction" (e.g., "This rule repeals all rules, including itself"). *Reason: Self-repeal may invalidate the entire system; requires legal input.*  

  > **Hazard 4: Two readings with different effects**  
  > - **Nature**: Drafting ambiguity (not a paradox).  
  > - **How to tell**: If both interpretations are logically plausible (e.g., "majority vote" = 50% or 50%+1), it’s ambiguity. A paradox exists if it forces an impossible outcome (e.g., "This rule is valid only if invalid").  

  ---

  ### **Application to Real Proposals**  
  **Background**: Current amendment rule requires a 2/3 vote.  

  #### **Proposal 1: Make quorum rule unamendable except by unanimous vote**  
  > "Rule 5 (Quorum) is unamendable except by a unanimous vote of members present."  
  > - **Step 1**: No self-application. *Hazard 1!* Clause amends rules → **B**.  
  > *Redraft*: Add "This protection applies to itself and requires unanimity to amend."  
  > - **Step 2**: Entrenchment lacks self-specification. *Hazard 2!* → **B**.  
  > *Redraft*: "Rule 5 and this entrenchment clause require unanimity to amend."  
  > - **Step 3**: Not self-amendment → **S**.  
  > - **Step 4**: No ambiguity → **S**.  
  > **Outcome**: Safe after redrafting.  

  #### **Proposal 2: Lower amendment threshold to simple majority (moved under current 2/3 rule)**  
  > "The amendment threshold is lowered to a simple majority."  
  > - **Step 1**: No self-application. *Hazard 1!* → **B**.  
  > *Redraft*: "Under Rule 10, Rule 10 is amended to require a simple majority."  
  > - **Step 2**: No entrenchment → **S**.  
  > - **Step 3**: Self-amendment. Current rules are silent on whether Rule 10 can self-amend. *Hazard 3!* → **R** (chair/lawyer must decide if self-amendment is implied).  
  > **Outcome**: **R** – Unresolvable by drafting. Board may dislike this, but the procedure cannot override interpretive gaps.  

  #### **Proposal 3: Repeal any rule by the vote that enacted it**  
  > "Any rule may be repealed by the same vote threshold that enacted it."  
  > - **Step 1**: No self-application. *Hazard 1!* → **B**.  
  > *Redraft*: "This rule and all others may be repealed by their enactment threshold."  
  > - **Step 2**: No entrenchment → **S**.  
  > - **Step 3**: Not self-amendment → **S**.  
  > - **Step 4**: Ambiguity! "Enactment threshold" is undefined (original vote? latest amendment?). *Hazard 4!* → **B**.  
  > *Redraft*: "Any rule may be repealed by the threshold used in its most recent enactment."  
  > **Outcome**: Safe after redrafting.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Judgment Calls**: If current rules are ambiguous (e.g., "Does 'amendments' include self-amendment?"), the procedure flags **R**. The secretary cannot resolve this—it requires chairperson/lawyer input.  
  2. **True Paradoxes**: Self-repealing clauses or irrevocable entrenchment may defy legal logic; these always require **R**.  
  3. **Board Preferences**: The procedure may return **B** or **R** for valid proposals the board likes (e.g., Proposal 2). The secretary must follow the checklist neutrally.  

  **Final Output**: A completed checklist with **B/S/R** outcomes. If all steps return **S**, the clause is safe. Else, the secretary provides the hazard-specific guidance above to the proposer or chair.  

  This procedure balances rigor and accessibility, catching 90% of common pitfalls while escalating deep paradoxes. It empowers non-experts to screen proposals efficiently, reducing the risk of validity disputes.
