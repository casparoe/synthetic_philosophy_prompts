prompt: |-
  I'm part of a reading group that's been working through the moral worth literature for the past year — we've read the classic Kant, some Arpaly, Markovits, a bit of the recent back-and-forth. Two members of the group have gotten into this really productive but intense disagreement and they've agreed to try an adversarial collaboration.

  One of them (let's call her the duty-first view) holds that an action has moral worth only when it's done from the motive of duty: you do the right thing because you recognise it as the right thing, full stop. If you help someone because you feel sympathy and it just so happens to be the right thing, your action might be correct but it doesn't have moral worth — it's not praiseworthy in the distinctive way that matters. The other one (the reasons-responsiveness view) thinks this is way too restrictive. On his account, what matters is whether you're responding to the reasons that make the action right in the first place. If compassion is what makes helping the right thing to do, then acting from compassion gives your action moral worth, even if you never form the thought "this is my duty." You don't need the concept of duty to be praiseworthy.

  They've been at this for months and I suspect there partly talking past each other — maybe they mean different things by "moral worth," maybe they're using different cases to pump different intuitions. They want to produce a joint document that nails down what they actually agree on, where exactly they diverge, what the cruxes are, and for each crux a concrete case both accept as relevant with each person's prediction written down in advance. The idea is that if we could run a study or at least get clear on what would move each of them, we'd make progress instead of just rehashing the same moves.

  Can you draft that document? Format it as: (1) a numbered list of agreed claims, (2) a disagreements table with columns for the point of disagreement stated neutrally, each side's preferred formulation, the crux sub-question, and a case or test both agree bears on it plus their predictions. If you think any part of the dispute is verbal rather than substantive, flag that — they'd genuinely want to know.
reasoning: |-
  Okay, the user is part of a reading group focused on moral worth literature, and two members have a disagreement they want to tackle through adversarial collaboration. The duty-first view insists that moral worth requires acting from the motive of duty—recognizing an action as right and doing it for that reason alone. The reasons-responsiveness view argues that responding to the right-making reasons (like compassion) is sufficient, even without explicitly thinking about duty.

  First, I need to structure their collaboration document as requested. The user wants a numbered list of agreed-upon claims and a disagreements table. The key is to identify where their disagreement lies and whether any part is merely verbal. Let me start by listing points both sides likely agree on. From Kant and contemporary discussions, they probably concur on moral worth being about praiseworthiness beyond just right action, the distinction between worth and correctness, and the rejection of consequentialist motives. 

  Next, the disagreements. The core conflict is whether the duty motive is necessary. But maybe they're using "motive of duty" differently. The duty-first view might see it as requiring explicit duty-consciousness, while reasons-responsiveness might conflate duty with recognizing right-making reasons. That's a potential verbal issue. Also, the locus of worth—is it in the motive itself or the agent's responsiveness? That might be substantive.

  For the table, each disagreement needs a neutral description, each side's stance, a crux question, a test case, and predictions. The Sympathetic Visitor case (helping from compassion without duty thoughts) is classic. Duty-first would deny moral worth, while reasons-responsiveness would affirm it. Another case could involve mixed motives, testing if duty must be primary. 

  I should also address if "moral worth" is defined differently. Duty-first ties it to moral autonomy, while reasons-responsiveness links it to virtue. That's substantive. The Sympathy Test case where compassion aligns with reasons but duty isn't considered will be pivotal. Both sides' predictions there clarify the main divide. 

  Need to ensure cases are neutral and accepted by both. The mixed motive case (calculating sympathy) can test if duty must dominate. Predictions here might reveal if duty's presence alone suffices or if purity matters. 

  Finally, highlighting verbal vs substantive parts is crucial. The motive of duty's definition might be verbal—explicit vs recognizing reasons. But the necessity of duty for worth is substantive. The deeper locus of worth (motive vs responsiveness) is also substantive. 

  The user's deeper need might be resolving the stalemate by clarifying ambiguities. They might want to move beyond circular debates by pinpointing exact disagreements and testable predictions. Ensuring the document facilitates that by focusing on cases and cruxes is key. Also, the group might benefit from understanding if their conflict stems from different intuitions or conceptual confusions, which the verbal/substantive breakdown addresses.
answer: |-
  Here’s a draft adversarial collaboration document for your reading group members, structured as requested. It aims to isolate substantive disagreements, flag potential verbal disputes, and provide concrete test cases.

  ---

  **Adversarial Collaboration: Moral Worth – Duty-First vs. Reasons-Responsiveness**  
  *Joint Document Draft*

  ### (1) Agreed Claims  
  Both parties affirm:  
  1. **Moral worth ≠ right action**: An action can be objectively right/correct yet lack moral worth.  
  2. **Moral worth is agential**: It concerns *praiseworthiness of the agent* for performing the right action, not just the action’s outcome.  
  3. **Consequentialism rejected**: Moral worth does *not* derive from good consequences alone (e.g., helping to gain a reward lacks worth).  
  4. **Non-accidental connection required**: The agent’s motivation must non-accidentally connect to the rightness of the action.  
  5. **Duty can confer moral worth**: Acting *from the motive of duty* is *sufficient* for moral worth (per Duty-First) *or at least one way* to achieve it (per Reasons-Responsiveness).  

  ---

  ### (2) Disagreements Table  
  | Point of Disagreement (Neutral) | Duty-First Formulation | Reasons-Responsiveness Formulation | Crux Sub-Question | Jointly Accepted Test Case (+ Predictions) |
  |--------------------------------|------------------------|-----------------------------------|-------------------|------------------------------------------|
  | **Necessity of the duty motive** | Moral worth *requires* acting from the motive of duty: consciously recognizing "this is my duty" as the primary motivation. | Moral worth requires acting *for the normative reasons that make the action right*, whether or not conceptualized as "duty." | *Must an agent explicitly represent their action as a "duty" to have moral worth?* | **Case: The Sympathetic Visitor**<br> *Setup:* Lena sees a stranger in severe distress. She helps immediately, motivated *solely* by direct compassion (she feels their pain acutely). She never considers whether helping is "her duty" or morally required.<br>🤝 **Agreed Features:** Helping is objectively right; Compassion is a right-making reason; No self-interest or ulterior motive.<br>▶ **Duty-First Prediction:** ❌ *Lacks moral worth* (No duty-consciousness)<br>▶ **R-Responsiveness Prediction:** ✅ *Has moral worth* (Responsive to right-making reasons) |
  | **Role of affective motives** | Affective motives (e.g., compassion) *cannot independently confer moral worth*, even if they align with duty. Only the rational recognition of duty has moral value. | Affective motives *can directly confer moral worth* if they constitute responsiveness to the relevant normative reasons (e.g., compassion responds to suffering). | *Can an action motivated *solely* by non-rational (e.g., emotional) states have moral worth if those states track right-making reasons?* | **Case: The Compassionate Surgeon**<br> *Setup:* Dr. Ray performs a life-saving surgery flawlessly. He is motivated *exclusively* by deep compassion for the patient (a visceral urge to alleviate suffering). He knows surgery is "right," but this knowledge plays no motivational role; compassion alone drives him.<br>🤝 **Agreed Features:** Action is right; Compassion is a right-making reason; No duty-consciousness.<br>▶ **Duty-First:** ❌ *Lacks moral worth* (Driven by inclination, not reason)<br>▶ **R-Responsiveness:** ✅ *Has moral worth* (Fully responsive to the reason of alleviating suffering) |
  | **Status of "duty as back-up" motives** | Moral worth requires duty to be the *primary* motivation. Duty operating as a secondary constraint ("I’d help from sympathy, but I’d do it anyway from duty") *undermines* worth. | Moral worth is compatible with duty playing a *secondary* or reinforcing role ("I help from compassion, but I’d do it from duty if compassion faded"), so long as the primary motive responds to right-making reasons. | *Does moral worth require duty to be the *dominant* motivating force?* | **Case: The Calculated Sympathizer**<br> *Setup:* Theo helps a colleague primarily because he likes them (sympathy). He is aware that he *ought* to help from duty, but this thought merely reinforces his sympathy-driven action; sympathy remains dominant. Without sympathy, he would still help from duty.<br>🤝 **Agreed Features:** Action is right; Both sympathy and duty are present; Sympathy is primary.<br>▶ **Duty-First:** ❌ *Lacks moral worth* (Duty is not primary)<br>▶ **R-Responsiveness:** ✅ *Has moral worth* (Primary motive responds to right-making reason; duty ensures reliability) |
  | **The "locus" of worth** | Moral worth resides in the *rational will* consciously aligning with moral law/duty. | Moral worth resides in *correct responsiveness to normative reasons*, regardless of whether this is mediated by rational duty-representation. | *Is moral worth fundamentally about *rational self-governance* or *reason-tracking*?* | *Cases above test this implicitly; predictions reveal divergent loci.* |

  ---

  ### Flagged Verbal/Conceptual Disputes  
  1. **"Motive of Duty"**:  
     - Duty-First likely means *explicit, occurrent representation* of an action as a duty.  
     - R-Responsiveness might interpret "duty" *broadly* as responsiveness to objective reasons, leading to cross-talk.  
     *🤝 Suggested Clarification:* Both should define "motive of duty" operationally (e.g., "agent must consciously think 'I ought to do X' as their motivating reason").  

  2. **"Moral Worth"**:  
     - Duty-First ties worth to *moral autonomy* (Kant’s *good will*).  
     - R-Responsiveness ties worth to *virtuous character* (Aristotelian resonance).  
     *🤔 Substantive?* **Yes** – Reflects deeper commitments about whether morality is fundamentally about law-governed rationality or reason-responsive dispositions.  

  ---

  ### Suggested Next Steps for Collaboration  
  1. **Refine Definitions**: Jointly stipulate precise meanings for "motive of duty," "moral worth," and "reasons-responsiveness."  
  2. **Generate New Cases**: Co-author cases targeting the "locus" disagreement (e.g., an agent reliably tracks reasons via intuition, never conceptualizing duty).  
  3. **Empirical Testing**: Use the cases (e.g., *Sympathetic Visitor*) in surveys to test lay intuitions, noting whether divergences track philosophical commitments.  
  4. **Explore Middle Ground**: Is there a hybrid view? (e.g., Duty as necessary for *maximal* worth, but not minimal worth).  

  This framework forces clarity on *where* and *why* intuitions diverge, transforming abstract debate into targeted probes. Good luck!
