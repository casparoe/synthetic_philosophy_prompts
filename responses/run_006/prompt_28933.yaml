prompt: |-
  Act as someone who works seriously in both the literature on the inside view versus the outside view and in Bayesian hierarchical modeling. I am a statistician: I am fluent in multilevel models, random effects, shrinkage, exchangeability, posterior predictive checking, and model comparison, but I know the inside view/outside view debate only in a rough, non-technical way. The question has become personal: I am deciding whether to leave a stable job to start a company, and I keep being told, in effect, to stop trusting my case-specific model and defer to base rates. Please restate the inside view/outside view distinction, and the associated norm of epistemic modesty, as faithfully as you can in the vocabulary I actually think in. Before you write the mapping, work through it piece by piece and be explicit about the points where you are stretching my vocabulary. I want to know, specifically: Is the outside view a prior, a hyperprior, or a choice of level in the hierarchy? Is the inside view a likelihood, a set of case-specific parameters, or a prior that is too concentrated on favorable outcomes? Where does the reference class problem sit — as the choice of the group at which my case is treated as exchangeable? Where does the planning fallacy sit — as a systematically overconfident likelihood, a miscalibrated prior, or something else? And what is epistemic modesty in these terms: a claim about hyperparameters, a rule for model averaging, or a norm that cannot be stated inside a model at all? Then give me the residue report: which parts of the debate translate cleanly, which parts you had to distort to fit, and which parts have no counterpart in hierarchical modeling. Be honest about whether the untranslatable residue is a defect of my vocabulary — something I would need to add in order to reason well about this decision — or a sign that the inside/outside view advice is less precise than it sounds. Do not smuggle Bayesian assumptions into the translation and present them as the original claim; flag every place where the act of translation is doing philosophical work.
reasoning: |-
  We are going to map the inside/outside view distinction and associated concepts into the vocabulary of Bayesian hierarchical modeling.

  Key concepts from your expertise:
  - Multilevel models (hierarchical models): models with parameters at multiple levels, where lower-level parameters (e.g., individual units) are drawn from distributions governed by higher-level parameters (hyperparameters).
  - Random effects: group-level deviations that are modeled as coming from a common distribution (the group-level model).
  - Shrinkage: the phenomenon where estimates for individual units are pulled toward the group mean, especially when there is little data for the unit.
  - Exchangeability: the assumption that the labels of the units in a group do not carry information, so that the joint distribution is invariant to permutation. This justifies pooling information.
  - Posterior predictive checking: a method for model checking by comparing observed data to data simulated from the posterior predictive distribution.
  - Model comparison: methods to compare different models (e.g., via Bayes factors, WAIC, LOO-CV).

  The inside view/outside view distinction:
  - Inside view: focuses on the specifics of the case at hand, including unique circumstances, causal mechanisms, and a detailed narrative. It often involves building a detailed model of the process for the specific case.
  - Outside view: ignores the specifics of the case and instead looks at the statistics of similar cases (a reference class). It uses base rates from that class to make predictions.

  Epistemic modesty: the idea that we should be humble about our ability to model complex realities and that we often overestimate our knowledge. In practice, this means giving weight to the outside view because it avoids the biases and overconfidence of the inside view.

  Mapping:

  1. **Outside view**:
     - In hierarchical modeling, the outside view corresponds to the use of **group-level information** (the population distribution) to inform about a particular unit. 
     - Specifically, the outside view is represented by the **prior distribution for the case-specific parameters** that is derived from the base rates of the reference class. This prior is a **hyperprior** if we are thinking of the entire hierarchy, but more precisely it is the **prior at the level of the individual unit** that is informed by the group (so it's the conditional prior for the unit given the group parameters).
     - However, note that the outside view is also about the choice of the reference class (the group) and the base rates (the group-level distribution). Therefore, the outside view is not just the prior but also the **structure of the hierarchy** and the **assumption of exchangeability** within the reference class.

  2. **Inside view**:
     - The inside view is the detailed, case-specific model. In a hierarchical model, this corresponds to the **likelihood function and the case-specific parameters**. 
     - However, the inside view often includes not just the data but also a narrative that leads to a highly concentrated prior on favorable outcomes. So it might be a combination of:
          - The likelihood for the case (which may be based on detailed data and a complex model)
          - A case-specific prior that is overly optimistic (low variance, centered on success) because of the narrative.

  3. **Reference class problem**:
     - This is the challenge of choosing the right group (reference class) to which the current case belongs. 
     - In hierarchical modeling, this is the problem of **choosing the level of the hierarchy and the grouping structure** such that the units in the group are exchangeable. 
     - It also involves deciding which groups to include and how to structure the hierarchy (e.g., nested or crossed). The reference class problem is about the **specification of the exchangeability assumptions**.

  4. **Planning fallacy**:
     - The planning fallacy is the tendency to underestimate the time, costs, and risks of future actions and overestimate the benefits. 
     - In the inside view, this can occur because the likelihood (the model of the process) is **systematically biased** (e.g., too optimistic) or because the prior for the case-specific parameters is too concentrated on favorable outcomes (ignoring the base rates). 
     - Alternatively, it might be that the model fails to account for all the uncertainties (so the variance is underestimated). 
     - In hierarchical terms, the planning fallacy can be seen as a **failure to properly use the outside view (the group-level prior)**, leading to inadequate shrinkage. It might also be a failure of the model to include all relevant group-level variation (so the group-level distribution is too narrow).

  5. **Epistemic modesty**:
     - In Bayesian terms, epistemic modesty can be interpreted as:
          - Setting **appropriate hyperparameters** that reflect a broad base of experience (so that the group-level prior is not too tight and is centered appropriately).
          - Using a **hierarchical structure** that allows for shrinkage, so that the estimate for a particular case is a compromise between the case-specific data (inside view) and the group-level information (outside view).
          - It might also involve **model averaging** over different reference classes (if we are uncertain about the correct reference class) or using a prior that accounts for model uncertainty.
          - However, note that epistemic modesty also has a component that is not fully captured by the model: the recognition that our models (both the inside and the outside) may be flawed. Therefore, it might also be a norm that cannot be entirely stated inside the model. It suggests that we should be cautious and perhaps use multiple models or be more conservative in our predictions.

  Residue Report:

  - **Parts that translate cleanly**:
     - The outside view maps very well to the group-level prior in a hierarchical model. The idea of shrinkage (pulling the case estimate toward the group mean) is a direct translation of the advice to use the outside view.
     - The inside view maps to the case-specific likelihood and parameters. The tension between the inside and outside view is the tension between the case-specific data and the group-level prior.
     - The reference class problem is the problem of choosing the exchangeable group in the hierarchy. This is a well-known challenge in hierarchical modeling.

  - **Parts that are distorted or stretched**:
     - The inside view is often described as including a narrative that leads to overconfidence. In our mapping, we attribute this to a too concentrated prior on favorable outcomes. However, in the literature on the inside view, the narrative might also involve a causal model that is flawed. We are stretching by lumping this into the prior or the likelihood. In reality, the inside view might be a misspecified model, which is a harder problem.
     - The planning fallacy: we mapped it to a biased likelihood or an overly optimistic prior. However, it might also be a failure to account for all the random effects (e.g., not including all relevant group-level variation) or a failure to use a hierarchical model at all. The distortion is that the planning fallacy is often described as a cognitive bias, but we are modeling it as a statistical model misspecification.
     - Epistemic modesty: we can map it to setting diffuse priors or using shrinkage, but the philosophical norm of modesty might go beyond the model. For instance, modesty might require that we question the entire modeling framework, which is not captured by any parameter in the model.

  - **Parts with no counterpart (or requiring new vocabulary)**:
     - The inside view often involves a unique causal narrative that is hard to express in a standard hierarchical model. Hierarchical models typically assume exchangeability, but the inside view might argue that the case is unique and not exchangeable with any reference class. If we take that seriously, then we might need to model the case as entirely independent, but then we lose the outside view. There is no easy way to incorporate a narrative of uniqueness without abandoning the hierarchy. This is a defect of the standard hierarchical modeling vocabulary for this purpose: we might need to extend the model to allow for non-exchangeability or to model the degree of exchangeability (e.g., with a prior on the similarity to the group).
     - The advice to use the outside view sometimes comes with a claim that the inside view is inherently flawed by cognitive biases. In a pure Bayesian model, we are supposed to condition on all available information (including the inside view). But if we believe the inside view is biased, we might need to down-weight it or censor it. This is not standard in hierarchical models. We might need to model the bias explicitly (e.g., by having a bias term in the likelihood) or by using a more robust model (e.g., heavy-tailed distributions). This is an area where your vocabulary might need extension: modeling cognitive biases as part of the statistical model.
     - The concept of epistemic modesty as a norm that cannot be stated inside the model: we might need to step outside the Bayesian framework and consider model criticism (e.g., via posterior predictive checks) or use a meta-model that accounts for the possibility of model failure. This residue suggests that the inside/outside view advice might be less precise than it sounds because it does not specify how to balance the two when they conflict, beyond the mechanical shrinkage of a hierarchical model.

  Conclusion:

  The translation is mostly successful for the core concepts (outside view as group-level prior, inside view as case-specific model, reference class as exchangeable group). However, some aspects (like the narrative uniqueness and cognitive biases) require extensions to standard hierarchical modeling. The planning fallacy can be seen as a model misspecification problem, but we must be cautious because the standard model does not account for systematic biases in the inside view. Epistemic modesty is partially captured by setting appropriate priors and using shrinkage, but it also has elements that are meta-model (about how we choose our models) and thus not fully expressible within a single hierarchical model.

  Therefore, for your decision:

  - The outside view (base rates) should be incorporated as a prior in a hierarchical model. You would collect data on similar startups (e.g., success rates) and use that to form a prior for your own case.
  - The inside view (your specific plan, team, market analysis) would then be combined with that prior via Bayes' theorem, leading to a posterior that is shrunken toward the base rate.
  - However, because of the planning fallacy, you should be wary of your inside view being overly optimistic. You might adjust by making your case-specific prior more conservative or by using a more diffuse prior (allowing the outside view to have more weight).
  - The reference class problem: you should carefully consider which group of startups is most similar to yours and for which you have reliable data. You might even use multiple reference classes and average over them (Bayesian model averaging).

  But note: the translation highlights that the standard hierarchical model assumes that your case is exchangeable with the reference class. If you believe your case is truly unique (in ways that matter and are not captured by the reference class), then exchangeability is violated and the outside view might be less relevant. However, epistemic modesty would caution against overestimating your uniqueness.

  In the end, the hierarchical modeling framework gives you a formal way to combine the two views, but you must be critical of the model structure (reference class) and the possibility of biases in your inside view. The untranslatable residue (like modeling uniqueness and biases) suggests that the advice is not fully captured by the model and requires additional judgment.
answer: |-
  ### Restatement of Inside View vs. Outside View in Bayesian Hierarchical Terms  
  *Faithful translation with vocabulary mappings, distortions flagged, and philosophical work explicitly noted.*

  ---

  #### **Core Definitions**  
  1. **Outside View**:  
     - **Your Vocabulary**: The outside view is a **group-level prior** (hyperprior) derived from a reference class of similar units. It represents the base rate distribution of outcomes for cases judged *exchangeable* with yours.  
     - **Stretching/Philosophical Work**:  
       - *Where stretched*: The outside view is often described non-technically as "base rates," but in hierarchical modeling, it maps to the **hyperprior** governing the population distribution of parameters (e.g., $\theta_{\text{startup}} \sim \text{Normal}(\mu, \tau)$).  
       - *Flag*: This translation implicitly assumes exchangeability. Critics might argue the outside view is *pre-data* frequency information (not Bayesian), but we map it to a prior for coherence with your framework.  

  2. **Inside View**:  
     - **Your Vocabulary**: The inside view is a **case-specific likelihood** *combined with* an overconfident **prior on your unit-level parameters**. It models your unique narrative (e.g., "My team/idea guarantees success") as a concentrated prior/likelihood that ignores group-level shrinkage.  
     - **Stretching/Philosophical Work**:  
       - *Where stretched*: Non-technical descriptions treat the inside view as "case details." We split it:  
         - Likelihood: Case-specific data (e.g., market analysis).  
         - Prior: Overconfident belief in favorable $\theta_{\text{you}}$ (e.g., $\text{prior} \sim \text{Normal}(+0.8, 0.1)$).  
       - *Flag*: The inside view’s "narrative" bias is modeled as a *misspecified prior/likelihood*—a Bayesian stand-in for cognitive overconfidence.  

  3. **Reference Class Problem**:  
     - **Your Vocabulary**: The choice of which **hierarchical level** to treat your case as exchangeable (e.g., "all startups" vs. "AI startups in Scandinavia"). It determines the hyperprior.  
     - **Distortion?** Translates cleanly. This is exactly the problem of defining exchangeability: "Which group's $\mu, \tau$ should I use?"  

  4. **Planning Fallacy**:  
     - **Your Vocabulary**: A **systematically biased likelihood** (underestimating costs/risks) *and* a **misspecified prior** (overconfidence in $\theta_{\text{you}}$).  
     - **Stretching**:  
       - Non-Bayesians describe it as general overconfidence. We model it as:  
         - Likelihood: $p(\text{data}|\theta_{\text{you}})$ ignores tail risks (e.g., low variance).  
         - Prior: $p(\theta_{\text{you}})$ centered on optimistic outcomes.  
       - *Flag*: This attributes the fallacy to *model structure* (e.g., omitted variables) rather than pure cognition.  

  5. **Epistemic Modesty**:  
     - **Your Vocabulary**: The norm to **shrink toward the group-level prior** and **broadly weight reference classes** (hierarchical Bayes) *or* **average over models** if exchangeability is uncertain.  
     - **Stretching/Philosophical Work**:  
       - *Clean part*: Shrinkage = $E[\theta_{\text{you}} | \text{data}] \approx \frac{\text{inside data} + \text{outside prior}}{\text{precision}}$.  
       - *Residue*: True modesty includes admitting **no model captures reality**—this can’t be quantified in $p(\theta)$ and requires posterior predictive checks.  

  ---

  ### Residue Report: What Translates, What Distorts, What’s Missing  
  | **Concept**          | **Translation Status**                  | **Notes**                                                                 |
  |----------------------|----------------------------------------|---------------------------------------------------------------------------|
  | **Outside View**     | Clean                                  | = Hyperprior on $\theta_{\text{unit}}$.                                   |
  | **Inside View**      | Partial                                | Likelihood + overconfident prior—but narratives aren’t formal parameters. |
  | **Reference Class**  | Clean                                  | = Defining exchangeable groups.                                           |
  | **Planning Fallacy** | Stretched (model misspecification)     | Not just priors; often reflects missing random effects (e.g., "unknown unknowns"). |
  | **Epistemic Modesty** | Partial (shrinkage + model averaging) | Residual humility (e.g., "I could be wrong") has no Bayesian parameter.   |

  #### **Defects in Your Vocabulary vs. Advice Imprecision**  
  - **Defects in Your Vocabulary**:  
    - You lack terms for **narrative-driven bias**. Hierarchical models assume $p(\theta)$ is chosen "rationally," but inside-view narratives manipulate $p(\theta)$ via motivated reasoning. You’d need to add:  
      - **Adjusted priors**: $p_{\text{modest}}(\theta_{\text{you}}) = \text{shrink}(p_{\text{narrative}}(\theta_{\text{you}}), p_{\text{group}}(\theta))$.  
      - **Bias parameters**: Explicit terms for overconfidence (e.g., $\sigma_{\text{you}} \leftarrow \kappa \sigma_{\text{group}}, \kappa < 1$).  
    - **No model for "uniqueness"**: If you claim "I’m not exchangeable!" the math breaks. You’d need non-exchangeable hierarchies (e.g., spatial priors for similarity).  

  - **Advice Imprecision**:  
    - Outside-view proponents often ignore:  
      - **Reference class uncertainty**: No method to pick the "right" group (it’s subjective).  
      - **Dynamic base rates**: Startups in 2024 ≠ 1990, but outside views rarely adjust for this.  
    - **Epistemic modesty** is underspecified: Should you weight base rates at 60%? 90%? The debate offers no rule.  

  ---

  ### Practical Advice for Your Decision  
  As a hierarchical modeler:  
  1. **Build a model**:  
     $$ \begin{align*} \mu, \tau & \sim \text{Hyperprior (e.g., startup success base rates)} \\ \theta_{\text{you}} & \sim \text{Normal}(\mu, \tau) \quad \text{(outside view)} \\ \text{data}_{\text{you}} & \sim p(\cdot | \theta_{\text{you}}) \quad \text{(inside view)} \end{align*} $$  
     - *Critically*: Use **posterior predictive checks** to test if your inside-view likelihood matches reality.  

  2. **Combat planning fallacy**:  
     - **Widen $\text{data}_{\text{you}}$’s variance**: Include pessimistic scenarios.  
     - **Shift $\theta_{\text{you}}$’s prior**: Center it at $\mu$ (base rate) not your gut estimate.  

  3. **Handle reference classes**:  
     - Average over models (e.g., "all startups" vs. "your industry") with Bayesian model averaging.  
     - If no good class exists, *then* lean slightly inside—but flag this as a model failure.  

  4. **Epistemic modesty in action**:  
     - Compute $P(\text{success} | \text{data}_{\text{you}}, \text{base rate})$ and compare to the base rate alone. If they’re similar, the outside view dominates.  
     - **Ask**: "Would I bet $1M on my inside model passing a posterior predictive check?"  

  ---

  ### Final Note  
  The untranslatable residue (narratives, uniqueness, modesty-as-humility) reveals a **gap in hierarchical modeling**—it quantifies uncertainty but not *meta-uncertainty* about model validity. For your decision:  
  - Use the model to **force explicit shrinkage**, but **simulate failure modes** (e.g., "What if I’m in the left tail of $\mu$?").  
  - The outside view’s power is *correcting for biased likelihoods/priors*—not replacing your expertise. If your inside view survives predictive checks, it deserves weight.  

  > "All models are wrong, but the outside view is the least wrong you start from." — A cautious Bayesian.
