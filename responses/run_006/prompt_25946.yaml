answer: |-
  You've pinpointed a fascinating tension at the heart of art valuation, exposing the complex interplay between materiality, history, intention, and perception. The art market's behavior *is* highly inconsistent if we assume a purely experiential or materialist theory of value. To make sense of it, we need to reconstruct the **implicit, hybrid theory of aesthetic value** embedded in these practices:

  1.  **Value as Authentic Achievement & Provenance:**
      *   **Core Premise:** The primary value of an artwork resides not *solely* in the physical object or the immediate experience it provokes, but in its **authentic genesis as a unique expression of a specific artist's mind, skill, and historical context at a specific moment in time.** It's a **historical artifact of human creation.**
      *   **The Artist's Hand:** The causal chain matters because it embodies the artist's creative struggle, decision-making, and genius. A Vermeer is valuable because it is a direct, unmediated trace of *Vermeer's* vision and technique. This imbues the object with a unique aura (in Walter Benjamin's sense) – the "presence" of the artist and their time.
      *   **Forgery vs. Honest Copy:** This explains the collapse of the forgery's value. Van Meegeren's forgery *pretends* to be a Vermeer – it parasitically claims Vermeer's achievement and historical context as its own. Once unmasked, it loses that false provenance and becomes solely an artifact of Van Meegeren's deception and skill, valued as a curiosity or historical footnote, not as a Vermeer. An honest workshop copy (e.g., "School of Rembrandt", "After Titian") *never claimed* to be the original. Its value lies in being a **contemporary witness** – created close to the master's time, potentially under their supervision, reflecting period techniques and styles, valuable for study and appreciation of the original's impact. Its provenance is transparent and different.

  2.  **Value as Scarcity & Unique Objecthood:**
      *   Genuine masterpieces are unique or extremely rare. Their value is intrinsically linked to their scarcity. A perfect digital scan is infinitely reproducible and thus lacks the scarcity essential to high market value. A workshop copy, while not unique in the absolute sense (there might be a few), is still a rare, hand-crafted historical object.

  3.  **Value as Narrative & Cultural Significance:**
      *   Artworks function within complex cultural narratives. A Vermeer tells us about 17th-century Dutch culture, Vermeer's unique perspective, and the history of art. A forgery tells a different, often sordid, story of deception. An honest copy tells the story of dissemination and influence. The narrative attached to the object's origin is a core part of its meaning and value. Deception fundamentally corrupts that narrative.

  4.  **The Role of Deception:**
      *   Deception isn't just an add-on; it's central. It violates the **trust** and **authority** underpinning the art market and scholarship. The initial appreciation for the forgery was based on a *false premise* about its origin and meaning. Learning the truth reveals the experience was, in a significant sense, *misplaced* – the viewer thought they were engaging with Vermeer's genius, not Van Meegeren's trickery. This fundamentally alters the object's cultural meaning and perceived authenticity, even if the retinal stimulus is identical.

  **Addressing Your Specific Questions:**

  *   **Why does history stop mattering when honestly disclosed?** It doesn't *stop* mattering; it *defines* the value differently. The "honest copy" is valued precisely *for* its specific history as a contemporary copy/replica – a different category of artifact with its own (lower) level of scarcity and historical significance related to dissemination and workshop practice. Its history is acknowledged and becomes the basis of its (more modest) value.
  *   **Artist's Achievement vs. Parasitism:** You're right, neither the forgery nor the honest copy involves the original artist's labor. The difference lies in **intention and claim**:
      *   **Forgery:** Actively seeks to *usurp* the original artist's achievement and historical position through deception. It's parasitic on the *reputation and aura* of the original, pretending to *be* it.
      *   **Honest Copy:** Makes no such claim. It acknowledges its derivative nature. Its value derives from its *proximity* to the original (time, place, technique) and its status as evidence of the original's influence or workshop practice. It's parasitic on the *idea* or *image* of the original, not on the false claim of being the authentic artifact.
  *   **Can a Hedonist Consistently Participate?** A pure experiential hedonist (value *only* in the immediate sensory/emotional response) faces deep inconsistency:
      *   **The Forgery Problem:** If the experience pre- and post-discovery is identical, the value *should* remain high. The market collapse contradicts this.
      *   **The Reproduction Problem:** A high-quality reproduction (print, screen) might provide a *superior* sensory experience to a damaged original viewed poorly. Yet it's worthless on the art market.
      *   **Participation Requires Compromise:** To participate meaningfully, a hedonist must either:
          *   **Compartmentalize:** Acknowledge the market's rules while privately valuing the experience. They might buy a forgery cheaply post-discovery *because* they value the experience, but they accept it has no market value.
          *   **Admit Defeat:** Concede that the art market operates on principles fundamentally incompatible with pure hedonism, valuing historical narrative and authenticity above immediate experience.

  **Consequences of Adopting a Purely Experiential Theory:**

  If art value resided *solely* in the immediate experience, the art world would transform radically:

  1.  **Pricing:** Value would correlate directly with the *quality and intensity* of the experience produced, regardless of origin. Master forgeries would be as valuable as originals. Perfect reproductions could command high prices. Scarcity would matter less; availability of high-quality experiences would matter more.
  2.  **Museum Display:** Originals would lose their primacy. Museums might prioritize perfect, large-scale, well-lit reproductions over fragile originals kept in vaults. Displays might focus on creating optimal experiential environments rather than showcasing "the real thing."
  3.  **Conservation:** The focus would shift entirely to preserving the *ability to generate the experience*. If a perfect digital surrogate exists, preserving the fragile original material might become less urgent. Conservation might prioritize restoring the *appearance* for optimal viewing over preserving original material integrity if they conflict.
  4.  **Art History:** The biographical, provenance-driven, connoisseurship model would diminish. Emphasis would shift towards *reception history* (how works are experienced across time), perceptual psychology, and the science/technology of creating optimal aesthetic experiences. Attribution would become largely irrelevant except as historical curiosity.
  5.  **The Market:** The concept of "original" would become largely meaningless. The market for unique physical artifacts would likely collapse, replaced by markets for licenses to high-fidelity experiences or limited-edition premium reproductions. The immense price gap between originals and copies would vanish.

  **Conclusion:**

  The art market's treatment of forgeries reveals a deeply ingrained theory where aesthetic value is **ineluctably tied to authentic origin, historical narrative, and the unique trace of the artist's creative act.** It values the artwork not just as a perceptual object, but as an **authentic historical relic and cultural signifier.** While experience is crucial, it is experience *of that specific, authentic artifact* that carries the highest value. Deception fundamentally corrupts the object's identity and meaning within this framework, collapsing its value. An honest copy, while derivative, maintains a truthful identity and historical significance within its own category. A pure experiential hedonist finds this system philosophically incoherent, as it systematically prioritizes non-experiential properties (origin, history, authenticity) over the quality of the immediate aesthetic encounter itself. Adopting pure experientialism would revolutionize art institutions, shifting focus from preserving unique artifacts to maximizing reproducible aesthetic experiences. The current practice, however, stubbornly insists that *who* made it, *when*, and *how* it came to be, are inseparable from its value as art.
