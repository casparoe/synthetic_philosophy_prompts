  The user also asks about the impact of adopting a purely experiential theory. Museums might prioritize perfect reproductions over originals, conservation could focus on experience over material authenticity, and art history would shift from artists' biographies to perceptual impact. 

  I need to ensure I address all parts: the implicit theories, the role of deception, the comparison to other domains, and the hypothetical shift to experiential value. Also, clarify why honest copies retain value—provenance as cultural artifact versus forgery as deception. 

