prompt: |-
  I've been trying to get clear on what I actually think about expected value reasoning when the probabilities get tiny, and I keep finding tensions in my own verdicts. Maybe you can help me sort out whether there's a principled line here.

  Here are my gut reactions to a bunch of cases:

  1. Standard gamble: pay $10 for a 0.6 chance at $20. I take it. No hesitation.

  2. St. Petersburg: I can pay a flat fee to play the St. Petersburg game once (coin flips until tails; payout doubles each flip). I wouldn't pay more than maybe $20, even though the EV is infinite. I don't feel irrational about this.

  3. Pascal's mugging: a stranger says "give me $10 and I'll use my magical powers to give you infinite bliss." I assign this some tiny nonzero credence, so the EV is infinite. I still don't hand over the $10, and I don't think I'm making a mistake.

  4. Saving lives: I can donate $100 to a charity that definitely saves one life, or to one that has a 1/10,000 chance of curing a disease and saving 100,000 lives. Equal EV. I feel a slight pull toward the sure thing, but I'm not confident it's the right call.

  5. Astronomical stakes: a charity claims a 1/10^30 chance of ending all suffering forever. The EV swamps anything else I could do with $100. But I'd still give to the charity that saves one life for sure. This feels like it can't be justified if I'm an EV maximizer, yet I can't bring myself to do otherwise.

  6. Nuclear risk: I'm asked to support a policy with a 1/1,000,000 chance of preventing a nuclear war that would kill a billion people. EV = 1,000 lives. I actually take this seriously and think it's worth real resources. But I can't see a principled difference between this and case 5 — both are tiny probabilities times huge payoffs.

  7. Repeated St. Petersburg: someone offers to let me play the St. Petersburg game 10,000 times. Suddenly I feel much better about paying a higher per-play price. But if the EV of one play is genuinly infinite, why should repeating it matter?

  Is there a single principle that captures all or most of these, and what does it say about which verdicts I need to abandon? And if the principle has to be messy — like, different rules for different probability ranges — is that just ad hoc, or is there a deeper justification for it?
reasoning: |-
  Okay, the user is grappling with expected value (EV) reasoning when probabilities become extremely small. They've presented seven scenarios where their intuitive judgments seem inconsistent with strict EV maximization. I need to help them find a coherent principle that explains these intuitions without being ad hoc.

  First, looking at their cases: in standard gambles like #1, EV aligns with intuition. But in St. Petersburg (#2), Pascal's Mugging (#3), and Astronomical Stakes (#5), they reject high-EV choices due to tiny probabilities. Yet in Nuclear Risk (#6) and Repeated St. Petersburg (#7), they're more willing to act despite small probabilities. The tension is most acute between #5 and #6 - why accept one but not the other?

  The key seems to lie in how we handle extreme probabilities. Strict EV maximization breaks down here because: 1) We can't truly assign meaningful probabilities below certain thresholds (epistemic limitations), 2) Our brains don't process such numbers linearly (psychophysical discounting), and 3) There might be threshold effects where probability-weighting functions flatten out near zero.

  For cases like Nuclear Risk (#6), the probability, while small, is within the realm of plausibility based on historical near-misses and expert assessments. Whereas 1/10³⁰ claims (#5) lack credible anchors. This suggests a principle: EV only applies when probabilities are "cognitively meaningful" - grounded in evidence rather than mere logical possibility.

  Repeated St. Petersburg (#7) reveals another factor: risk diversification across trials reduces the absurdly low probability of never winning. This makes the infinite EV feel more "real" through repeated exposure, even if mathematically it shouldn't change the per-play calculation.

  Their hesitation in Saving Lives (#4) might stem from loss aversion - the pain of definite loss ($100) feels sharper than the small chance of huge gain. But when the definite loss is smaller (Nuclear Risk policy support), they accept it for proportionate stakes.

  The underlying challenge is that human decision-making evolved for mid-range probabilities and stakes. We need bounded rationality principles that respect our cognitive limits without abandoning EV entirely. Perhaps framing it as: "Discount EV by the credibility of the probability model" could unify these judgments. In #5 and Pascal's Mugging, the models are fantastical; in Nuclear Risk, they're empirically grounded.

  Ultimately, they might need to accept that decision theory under extreme uncertainty isn't tidy. But that doesn't make it arbitrary - it just means probability must be epistemically warranted, not just mathematically possible.
answer: |-
  Your intuitions reveal a deep tension in expected value (EV) reasoning when probabilities become extremely small or payoffs astronomically large. You're not irrational—this is a recognized problem in decision theory. Here's a principled way to reconcile your judgments without being ad hoc:

  ### **The Core Principle: Bounded Rationality with Epistemic Humility**
  Your reactions align with **discounting EV by the credibility of the probability model**, especially when:
  - Probabilities are below a cognitive/evidential threshold (e.g., <10⁻⁹),  
  - Payoffs exceed real-world physical limits, or  
  - The source of the claim lacks reliable calibration.

  This isn't arbitrary; it reflects:
  1. **Epistemic limits**: We can't assign meaningful probabilities to claims detached from evidence.
  2. **Psychological reality**: Humans don't linearly weight tiny probabilities.
  3. **Pragmatic bounds**: Infinite payoffs are physically impossible; decision theory must respect the universe's constraints.

  ---

  ### **How This Explains Your Cases**
  1. **Standard Gamble (Prob = 0.6)**  
     ✅ *EV works*: Probability is well-calibrated (e.g., dice, coins). Intuition matches EV.

  2. **St. Petersburg (Infinite EV)**  
     ❌ *Intuition rejects EV*: Probabilities decay exponentially (1/2, 1/4, 1/8...). Payoffs like $2¹⁰⁰ ($1.2×10³⁰) exceed global wealth.  
     → **Principle**: Discount payoffs beyond physical plausibility. Realistic models cap payoffs (e.g., at $1 trillion), making EV finite (~$20).

  3. **Pascal’s Mugging (Tiny P, Infinite Payoff)**  
     ❌ *Reject EV*: The probability isn’t just small—it’s *unfalsifiable*. No evidence supports "magical powers."  
     → **Principle**: Assign **P = 0** to claims lacking *any* coherent causal model. EV collapses.

  4. **Saving Lives (Equal EV)**  
     🤔 *Slight preference for certainty*: This is **loss aversion**. Saving 1 life feels tangible; P=0.0001 of saving 100K lives feels abstract. But if you trust the charity’s probability estimate, EV says *indifferent*.  
     → **Acceptable either way**, but your pull toward certainty is psychological, not logical.

  5. **Astronomical Stakes (P = 10⁻³⁰)**  
     ❌ *Reject EV*: P is **cognitively meaningless**. No evidence can distinguish P=10⁻³⁰ from P=0 (e.g., is 10⁻³⁰ based on physics? Or made up?).  
     → **Principle**: Below an evidential threshold (e.g., P < 10⁻¹⁵ for Earth-scale events), treat P as 0. EV ≈ 0.

  6. **Nuclear Risk (P = 10⁻⁶)**  
     ✅ *Accept EV*: P=0.000001 is small but **grounded in evidence** (e.g., historical near-misses, engineering models). Saving 1,000 lives for $100 is plausible.  
     → **Key difference from #5**: This P is *measurable* and *calibrated* (e.g., via risk analysis). Not all tiny probabilities are equal.

  7. **Repeated St. Petersburg (10,000 plays)**  
     ✅ *Higher willingness to pay*: With N plays, the probability of a "winning" streak (~$2ᴺ) approaches 1. Paying $20/play seems fair because the *median outcome* becomes reliable.  
     → **Principle**: For repeated trials, focus on **likely outcomes**, not EV. EV is infinite, but you care about probable gains.

  ---

  ### **A Unified Framework: Contextual EV Maximization**
  1. **Apply EV only to probabilities above an evidential threshold** (e.g., P > ε, where ε is set by domain expertise).  
     - *Example*: For asteroid impacts, ε might be 10⁻⁸ (based on telescopic data). For "magic," ε = 0.  
  2. **Cap payoffs at physically plausible maxima** (e.g., Earth's GDP, human lifespan, thermodynamic limits).  
  3. **For repeated trials**, optimize for *median* or *likely* outcomes if variance is extreme.  
  4. **Assign P = 0** to claims that:  
     - Violate known physics,  
     - Lack a causal mechanism,  
     - Are unfalsifiable (e.g., "magic").  

  ---

  ### **Why This Isn’t Ad Hoc**
  - **Epistemic justification**: Probabilities require evidence. A number like "10⁻³⁰" is useless without a validated model. Distinguish:  
    - **Measurable risks** (nuclear war, pandemics): Use EV.  
    - **Unfalsifiable claims** (Pascal’s Mugging): Ignore.  
    - **Untestable extremes** (10⁻³⁰ cure): Reject.  
  - **Cognitive justification**: Humans use *probability weighting* (e.g., prospect theory). We underweight P < 10⁻⁴ and overweight P > 0.1. This isn’t irrational—it’s adaptive for real-world decisions.  
  - **Physical justification**: Infinite resources can’t exist. Capping payoffs at ~$10¹⁵ (Earth’s resource limit) resolves infinity paradoxes.

  ---

  ### **Where to Adjust Your Verdicts**
  - **Saving Lives (#4)**: If you trust both charities, donate to the high-impact one. Your loss aversion is understandable but not EV-optimal.  
  - **Repeated St. Petersburg (#7)**: Your intuition is right! With 10,000 plays, the per-play price *should* increase because the distribution concentrates.  
  - **Nuclear Risk (#6) vs. Astronomical Stakes (#5)**: You’re correct to treat them differently. #6 has a credible probability; #5 does not. Stick to this distinction.

  ### **Final Takeaway**
  Don’t abandon EV—**constrain it by reality**. Your intuitions reflect a sophisticated grasp of decision-making under uncertainty. The "messy" principle is:  
  > *Maximize expected value only when probabilities are evidentially grounded and payoffs physically possible.*  
  This isn’t ad hoc; it’s how science, engineering, and policy actually use probabilities.
