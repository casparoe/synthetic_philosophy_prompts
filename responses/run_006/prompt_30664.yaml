prompt: |-
  I cover science and ideas for a living, and I have come to realize that my instincts about when to defer to another person's judgment are not something I can state as a rule. Before I write another story that turns on a dispute among experts, I want to know what principle, if anything, I am actually applying.

  Here are my verdicts on cases, reported honestly.

  Case 1. Two climate scientists I regard as equally able, working from the same published data, give sharply different ranges for the equilibrium climate sensitivity — how much warming a doubling of carbon dioxide would produce. I cannot read their models. I want to report a wide range that roughly splits the difference between them, and this feels like the right response.

  Case 2. A friend and I disagree about how to split a restaurant bill. I have just done the arithmetic twice and checked it against the receipt. I feel no pressure to move toward her number, though I will recheck once as a courtesy. Splitting the difference would be absurd.

  Case 3. Two political scientists, both well published, disagree about whether a particular voting reform increased turnout. I am not a social scientist, but I have read both papers, and one's identification strategy strikes me as plainly more credible than the other's. I feel entitled to rely on that study more heavily, even though its author is no more eminent than the other.

  Case 4. A colleague I consider my intellectual equal and I disagree about whether a novel we both read recently is good. I feel no inclination to moderate my judgment. It would be strange to change an aesthetic view merely because she disagrees.

  Case 5. A fellow reporter whose instincts I respect and I watch the same interview of a source. I think the source is lying; she thinks he is telling the truth. We are equally good at this kind of thing. I keep my view, though I cannot articulate what it rests on.

  Case 6. A friend who is roughly as intelligent and well informed as I am disagrees with me about a moral question — whether a particular immigration policy is just. I feel no pressure to conciliate, but I also cannot say why this case differs from Case 1, where I do conciliate. That asymmetry is the one that bothers me most.

  I know the literature divides roughly between conciliationists, who say one should move substantially toward the view of an epistemic peer, and steadfasters, who say one may largely retain one's view. My verdicts do not place me cleanly in either camp, and I would rather have a principle than a label.

  Is there a single principle — a rule about when, and how much, to revise in the face of disagreement — that captures all six verdicts, or nearly all? If no clean principle gets all of them, tell me which verdicts it forces me to give up and why those are the right ones to abandon. Then apply the principle you arrive at to a case I have not listed: two equally capable film critics disagree about whether a movie is worth seeing, and I have to decide whether to go tonight.
reasoning: |-
  Hmm, the user is a science and ideas journalist grappling with how much to defer to others' judgments in expert disputes. They've presented six detailed cases where their intuitive responses vary—sometimes conciliating, sometimes not—and want a unified principle rather than just fitting into existing philosophical labels like conciliationism or steadfastness.

  Looking at their cases: In Case 1 (climate science models), they split the difference between experts. But in Case 2 (restaurant bill), they refuse to budge despite disagreement. Case 3 (voting reform) shows them siding with one expert after evaluating methodological credibility themselves. Cases 4-6 involve aesthetic, empirical, and moral disagreements where they stand firm even with peers. The asymmetry between Case 1 and Case 6 particularly troubles them.

  The core tension seems to be about epistemic access. When the dispute relies on specialized tools or knowledge they lack (like climate models), they defer. When they can directly engage with evidence (bill arithmetic, research methods) or it's about personal judgment (art, morality), they don't. But morality (Case 6) feels like it should require deference like expert domains do—hence their discomfort.

  I notice all their "stand firm" cases share accessible justification: calculable math (Case 2), comparable methodology (Case 3), inherently subjective domains (Case 4), or tacit expertise (Case 5). Whereas Cases 1 and possibly 6 involve opaque expertise. But Case 6 is tricky because morality has objective claims yet personal interpretation.

  For a unifying principle, I'm considering "defer when the domain requires inaccessible expertise that you cannot independently evaluate." This would explain conciliating in Case 1 (unreadable models) but not Case 2 (simple math). Case 3 fits because they could evaluate methods. Cases 4-5 involve no superior expertise. Case 6 might be an exception because morality isn't "expertise-dependent" in the same way as climate science—we're all forced to reason ethically.

  Applying this to their unlisted case: Two film critics disagree about a movie. If both are equally credible, I'd check if their reasoning is accessible. If one emphasizes technical aspects I can't assess (e.g., editing techniques), I might split the difference. But if they debate themes I can grasp, I'd weigh arguments myself. Since film criticism blends subjective and objective elements, the principle suggests moderate conciliation unless I have strong independent criteria.

  This approach preserves most of their intuitions but requires abandoning firmness in Case 6 if moral truth is seen as objective but inaccessible. Alternatively, treating morality as domain where "expertise" doesn't apply (like aesthetics) would keep their stance but may feel unsatisfying. The key is distinguishing disputes where disagreement signals my likely error from those where it doesn't.
answer: |-
  Your intuitions across these cases are remarkably consistent with a single epistemic principle: **Defer to disagreement only when the disputed claim relies on specialized, inaccessible expertise that you cannot independently evaluate.** When you *can* access the relevant evidence or reasoning yourself—through direct observation, replicable calculation, methodological evaluation, or personal judgment domains—you retain your view. Here's how this principle explains all six verdicts:

  ---

  ### **The Principle Explained**
  1. **Specialized Expertise Required?**  
     Is the claim's justification rooted in technical skills, tools, or knowledge beyond your grasp (e.g., proprietary models, advanced statistics, tacit professional intuition)?

  2. **Accessible Justification?**  
     Can you directly evaluate the evidence, reasoning, or methodology yourself (e.g., arithmetic, research design, aesthetic experience)?

  - **Defer substantially** if expertise is required *and* inaccessible.  
  - **Retain your view** if justification is accessible or no expertise is needed.  
  - **Weight arguments** if partially accessible (e.g., methodological flaws).

  ---

  ### **How It Captures Your Verdicts**
  - **Case 1 (Climate Models): Defer**  
    → *Specialized expertise* (unreadable models) is *inaccessible*. Splitting the difference is rational when you lack tools to adjudicate.  

  - **Case 2 (Restaurant Bill): Stand Firm**  
    → *No expertise needed*; arithmetic is fully *accessible*. Disagreement signals peer error, not your uncertainty.  

  - **Case 3 (Voting Reform): Stand Firm**  
    → Methodological flaws are *accessible* through critical reading. Expertise exists, but you *can* evaluate the key issue (identification strategy).  

  - **Case 4 (Novel’s Quality): Stand Firm**  
    → Aesthetics involve *no privileged expertise*. Your judgment is as valid as your peer’s.  

  - **Case 5 (Source’s Truthfulness): Stand Firm**  
    → Lie detection relies on *tacit expertise, but it’s accessible to you* as a fellow reporter. Your intuition is personal evidence.  

  - **Case 6 (Moral Policy): Stand Firm**  
    → Morality isn’t a domain of *specialized expertise* like climate science. While complex, it hinges on reasoning about values, harms, and rights—which you *can* engage with directly. This resolves the asymmetry with Case 1: climate sensitivity requires technical tools; justice does not.  

  ---

  ### **Where It Bites: The Cost of Consistency**
  This principle forces one revision:  
  - **Case 6 (Moral Disagreement):** You *must* retain your view** even if bothered. If morality lacks the inaccessible expertise justifying deference in Case 1, conciliation is unwarranted. Your discomfort stems from conflating "complex" with "expertise-dependent." Moral reasoning is open to all rational agents—unlike interpreting climate models.  

  ---

  ### **Application: Film Critics Disagreement**  
  **Scenario:** Two equally capable critics disagree on whether a film is worth seeing. You must decide tonight.  

  1. **Specialized expertise?**  
     — Film criticism blends subjective taste (inaccessible) and technical analysis (e.g., editing, pacing—partially accessible).  
  2. **Accessible justification?**  
     — If critics highlight *aesthetic elements* (e.g., "the cinematography is claustrophobic"), you can’t verify without seeing it.  
     — If they cite *objective flaws* (e.g., "plot holes undermine the third act"), you can weigh their arguments.  

  **Verdict by the Principle:**  
  - **Conciliate moderately.** Split the difference unless one critic’s reasoning is clearly flawed *and* you can identify why (e.g., "Critic A mischaracterizes a key scene mentioned in reviews").  
  - **Why?** The core claim ("worth seeing") relies on *tacit expertise* (e.g., comparative genre knowledge) and *subjective experience* you lack before viewing. Unlike the restaurant bill, you cannot directly audit their evidence.  

  ---

  ### **Philosophical Roots & Refinements**
  - **Anti-expertise exceptionalism:** Rejects the idea that all disagreements among peers require deference (unlike conciliationism).  
  - **Accessibility threshold:** For Case 3, you only needed access to *methodological validity*—not the full statistical toolkit.  
  - **Moral asymmetry:** Your intuition in Case 6 aligns with moral philosophers like Ronald Dworkin: moral truth isn’t decided by credentials.  

  This principle preserves your intuitions in 5/6 cases, with Case 6’s resolution being philosophically defensible. It prioritizes intellectual autonomy where possible while acknowledging expert domains where humility is rational.
