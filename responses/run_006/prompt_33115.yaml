prompt: |-
  I'm a postdoc in comparative philosophy with two years of funding and a mostly blank slate, and I need to pick a research project within Confucian role ethics that won't just end up being commentary on commentary. Assume I'm already convinced the Ames/Rosemont-style picture — roles and relations are ethically basic, not derived from individual virtues or principles — is at least worth taking dead seriously as a reading of the Analects, so I don't need to be sold on the frame or handed a reading list. What I want is a defended agenda: which two or three open problems in role ethics should I actually spend my time on, and in what order?

  To make it concrete, the candidates I keep circling are:

  - The conflict problem: if my obligations come from the roles I occupy, what happens when roles pull in opposite directions (say, son versus subject — the old "father stole a sheep" problem), and does the view have the resources to say anything principled, or does it bottom out in "do what the exemplary person would do"?
  - The ground problem: is there something under or behind the roles — ren, for instance — that explains why roles are normative, and if so, isn't role ethics just virtue ethics in disguise?
  - The scope problem: what does the view say about beings I stand in no thick role-relation with — strangers, future generations, animals? Does it have to stretch "role" until the concept is doing no work, or is the honest move to say the theory is incomplete?
  - The interpretive problem: how much of the early Confucian material actually resists the role-ethics reading, and at what point does the reading stop being an interpretation and become a reconstruction?

  I care about the ordering, not just the list. For each candidate: why it's upstream of the others (if you settled it, what else would get easier), how tractible it is for someone trained in comparative philosophy with some analytic moral philosophy, and what evidence over the next eighteen months would make you move it up or drop it. Also say which one you'd deprioritize because settling it wouldn't change much downstream. And please keep straight what's actually settled among people who work on this versus what's still genuinely contested — don't present a contested reading, including the role-ethics reading itself, as the consensus.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a postdoc in comparative philosophy with two years of funding, focusing on Confucian role ethics. They want to avoid commentary on commentary and tackle open problems. The user already accepts the Ames/Rosemont framework, so they don't need convincing on that front. They've listed four problems: conflict, ground, scope, and interpretive. The challenge is to prioritize these, explain why one is upstream, assess tractability, and identify which to deprioritize.

  First, I need to understand the user's deeper needs. They mention a "defended agenda," so they want a clear research plan that's impactful. They care about ordering because time is limited. They also want to know how each problem affects others—upstream issues solving others if resolved. Their identity as a postdoc suggests they need to establish their academic reputation with original contributions. The unspoken need might be to produce work that's both philosophically rigorous and innovative in comparative philosophy, avoiding dead ends or well-trodden paths.

  Looking at the four problems:
  1. Conflict: Role obligations clashing. Classic example is father stealing a sheep. Need principled resolution beyond "exemplary person."
  2. Ground: Whether roles are based on something deeper like ren, risking role ethics becoming virtue ethics.
  3. Scope: Extending ethics to strangers, animals, future generations. Can roles stretch that far?
  4. Interpretive: How much early texts support role ethics vs. reconstruction.

  I should determine which problem, if solved, makes others easier. Conflict seems central. Resolving how conflicts are managed could inform the ground problem—if roles inherently contain resolution mechanisms, maybe no deeper ground is needed. It also affects scope; if roles can handle conflicts, maybe they can be extended. Interpretive issues might be informed by seeing how texts handle conflicts.

  Tractability matters. Conflict has textual examples (Analects 13.18), so the user can analyze primary sources. Their background in comparative and analytic philosophy helps here, using tools like casuistry or particularism. Evidence of progress in 18 months could be a taxonomy of conflict resolutions in texts.

  Ground problem is next. If conflict resolution relies on ren, then ground becomes urgent. But if roles resolve conflicts internally, ground might be less critical. Tractability: Requires deep textual analysis and engagement with virtue ethics critiques. Evidence includes whether ren functions independently of roles.

  Scope is important but downstream. Without solving conflict and ground, extending roles to strangers is premature. Deprioritizing it because even if resolved, it doesn't affect the core theory as much. Interpretive is also downstream; resolving conflict might show how role ethics is textually supported, affecting interpretive debates.

  Deprioritizing scope. Solving it doesn't resolve the core issues of conflict or ground. Animals and future generations are less central to Confucian texts, so it might not impact the main theory as much.

  Order: Conflict first, then ground, scope last. Interpretive after conflict, but maybe integrated throughout. User should start with conflict, as it's actionable and foundational. If after 6 months, texts show consistent conflict resolution, that supports role ethics; if not, ground becomes more urgent. Scope stays last unless new evidence links roles to broader ethics.

  User's unspoken need: They want to make a significant contribution without getting bogged down in existing debates. Prioritizing conflict offers a concrete path to original insights. Also, establishing role ethics as a standalone theory against virtue ethics critiques could be a key achievement.
answer: |-
  Here's a prioritized research agenda grounded in the upstream/downstream impact, tractability, and contested nature of your candidates, designed for maximum leverage within your 2-year window:

  **Priority 1: The Conflict Problem**
  *   **Why Upstream?** This is the most direct *practical* challenge to the viability of role ethics as a complete moral framework. If role ethics cannot plausibly resolve common, textually-attested conflicts between role obligations without collapsing into circularity ("do what the *junzi* does") or covertly importing external principles, its claim to be a *sufficient* ethical foundation is severely weakened. Resolving this directly impacts:
      *   **The Ground Problem:** A robust resolution to conflict might reveal *how* roles themselves generate normative hierarchies or specific resolutions, potentially demonstrating that `ren` (or another concept) functions *within* the relational matrix rather than as an external ground. Conversely, if the *only* resolution requires appealing to `ren` as an independent virtue, it strengthens the "virtue ethics in disguise" critique.
      *   **The Interpretive Problem:** Successfully resolving conflicts using *only* resources plausibly found *within* the relational/role framework of the early texts (e.g., Analects, Mengzi) provides strong positive evidence *for* the role-ethics reading. Failure makes the interpretive case harder.
      *   **The Scope Problem:** If roles *within* the core network (family/state) can conflict and be resolved internally, it suggests mechanisms that *might* be extendable (or not) to "fringe" relations. If conflict resolution *requires* an external principle, that principle might also handle scope.
  *   **Tractability:**
      *   **Strengths:** Textually rich (Analects 13.18 "Father Stole a Sheep" is just the start; consider conflicts in Mengzi, ritual tensions in the Liji). Analytic philosophy tools (particularism, casuistry, conflict resolution theory, value pluralism) are directly applicable. Focuses on concrete situations rather than abstract metaphysics. Ames/Rosemont start this work but leave it significantly open.
      *   **Challenges:** Requires meticulous textual analysis to avoid anachronism. Must rigorously avoid smuggling in external principles. The "exemplary person" (`junzi`) standard *is* textual but needs careful articulation to avoid vacuity.
  *   **Evidence in 18 Months:**
      *   **Move Up:** Identifying recurring patterns or textual principles *within* the role framework that guide conflict resolution (e.g., hierarchy based on role type? context-sensitivity? ritual precedence? specific textual maxims like "concealment" in 13.18?).
      *   **Move Down/Deprioritize:** Finding that *every* plausible resolution path *requires* invoking `ren`, `yi`, or `li` as *abstract virtues or principles* detached from specific role enactment, making the virtue ethics critique compelling.
  *   **Status:** Highly contested. Advocates point to context-sensitivity and ritual as resolution mechanisms. Critics see circularity or hidden principles. *No consensus exists on a systematic role-ethics solution.*

  **Priority 2: The Ground Problem**
  *   **Why Next?** This is the core *theoretical* challenge. If roles are normatively basic, what *makes* them binding? If the answer points to something *else* (`ren`, harmony, flourishing), is role ethics just describing the *application* of that more fundamental good? Settling this clarifies the ontology of the view and its distinctness from virtue ethics.
      *   **Impact on Conflict:** If roles are grounded *in* something like `ren` understood as relational virtuosity emerging *from* roles themselves, it strengthens internal resolution mechanisms. If `ren` is a prior virtue, it weakens the role-ethics claim to primacy and makes conflict resolution rely on that virtue.
      *   **Impact on Scope:** The nature of the ground determines how far obligations extend. If grounded in `ren` as inherent relational potential, scope *might* be broader. If grounded strictly in existing ritual-defined relations, scope is narrower.
      *   **Impact on Interpretation:** A clear account of the ground affects how we read passages about `ren`, `tian`, `xing` (nature), and foundational concepts.
  *   **Tractability:**
      *   **Strengths:** Directly engages core concepts (`ren`, `li`, relationality) and major critiques. Leverages comparative skills to analyze "grounding" in different traditions. Connects to meta-ethics debates (foundationalism vs. coherentism, constructivism).
      *   **Challenges:** Highly abstract. Risk of getting lost in definitional debates. Must constantly tie analysis back to specific textual passages and role enactments to avoid pure speculation. Requires deep engagement with virtue ethics critiques (e.g., Van Norden, angle).
  *   **Evidence in 18 Months:**
      *   **Move Up:** Strong textual evidence showing `ren` is consistently described *as* the virtuosic enactment of roles, not a separable state or capacity. Or, evidence that relational harmony/flourishing *is constituted by* fulfilling roles, not a prior good.
      *   **Move Down:** Clear textual passages suggesting `ren` is a prior state cultivated *through* roles but ultimately grounding/validating them, or passages where `tian`/nature directly imposes norms independent of relational context.
  *   **Status:** Intensely contested. The core debate is between seeing `ren` as *constituted by* relational virtuosity (role-ethics view) vs. seeing `ren` as a prior virtue *applied* or *expressed* in relations (virtue ethics view). *No consensus exists.*

  **Priority 3: The Interpretive Problem**
  *   **Why Here?** This is essential for establishing the *historical validity* of the role-ethics reading as more than a creative reconstruction. However, progress on Conflict and Ground will *inform* the interpretive debate by showing what a role-ethics reading *can do* with difficult passages. Tackling interpretation *after* exploring Conflict and Ground lets you test your developing framework against textual counter-evidence more robustly.
      *   **Impact:** Directly addresses the "is this really Confucius?" question. Success strengthens the entire project; failure requires significant qualification. Progress on Conflict/Ground provides concrete criteria for assessing interpretations.
  *   **Tractability:**
      *   **Strengths:** Core comparative philosophy skill (close textual reading, hermeneutics). Focuses on primary texts directly.
      *   **Challenges:** Requires mastery of philological debates, textual layers, and competing hermeneutic traditions. Risk of becoming overly descriptive or getting bogged down in minutiae without a clear philosophical goal (which Conflict/Ground provide).
  *   **Evidence in 18 Months:**
      *   **Move Up:** Discovering overlooked passages that decisively favor one reading over the other, or identifying a systematic pattern in key terms (e.g., `ren`, `zhi` 知 knowing, `zhong` 忠 loyalty, `shu` 恕 reciprocity) that strongly coheres with (or contradicts) the role-ethics ontology developed from tackling Conflict/Ground.
  *   **Status:** Contested, but the role-ethics reading is a *significant and influential minority position*. Traditional virtue-centric readings remain dominant, especially outside Ames/Rosemont circles. *Consensus favors a virtue ethics framework, but the role-ethics challenge is taken seriously.*

  **Deprioritize: The Scope Problem**
  *   **Why?** While philosophically important, it's the most *downstream* and least urgent for establishing the *core coherence and distinctiveness* of Confucian role ethics *within its own primary domain* (thick, existing relationships). Settling Scope wouldn't resolve the fundamental challenges of Conflict or Ground within the core network. Conversely, making progress on Conflict and Ground provides the essential tools *to then* tackle Scope rigorously.
  *   **Impact if Settled:** Even a brilliant account of obligations to strangers/animals wouldn't resolve how a son handles his father stealing a sheep *within* the role framework, nor would it settle whether roles are normatively basic or derivative. It would be an important extension, but not foundational.
  *   **Tractability Challenges:** Early Confucian texts offer minimal *direct* resources for this. Requires significant constructive work or importing concepts (`ren` extended? `tianxia*? `yi* as impartiality?) in ways that risk stretching the core theory. Highly speculative compared to the other problems grounded in core textual dilemmas.
  *   **When to Revisit:** *After* making progress on Conflict and Ground. A robust internal account of core role obligations provides a stable base for cautiously exploring extensions. Evidence from Mengzi (e.g., the child falling into the well - 2A6, 7A45) or Xunzi becomes more relevant here *in light of* the prior work.

  **Defended Agenda & Order:**

  1.  **Year 1: Focus Intensively on the Conflict Problem.**
      *   **Goal:** Develop a systematic, textually-grounded, *role-internal* account of resolving conflicting obligations, demonstrating the practical viability of the framework. Avoid appeals to abstract `junzi` ideals or external principles.
      *   **Method:** Close analysis of conflict passages (Analects, Mengzi, relevant Liji/Zuozhuan) using analytic tools for conflict resolution and particularism. Build a taxonomy of conflicts and proposed resolutions *within the texts*.
      *   **Why First?** It's the most acute practical challenge. Success here provides concrete evidence for the framework's coherence and directly informs the Ground problem. Failure here fundamentally undermines the project early.

  2.  **Year 2: Transition to the Ground Problem, informed by findings from Year 1.**
      *   **Goal:** Articulate and defend a coherent meta-ethical account of the normative source of role obligations within the Ames/Rosemont framework, explicitly addressing the "virtue ethics in disguise" critique.
      *   **Method:** Conceptual analysis of `ren`, `li`, and relationality in light of your conflict resolution model. Engage explicitly with virtue ethics interpretations and meta-ethical debates. Leverage comparative perspective on sources of normativity.
      *   **Why Next?** Resolving Conflict provides concrete data points for understanding the ground. The Conflict and Ground problems are deeply intertwined – progress on one illuminates the other. This secures the theoretical foundation.

  3.  **Throughout Years 1 & 2 (Secondary Thread): Constantly Test Against the Interpretive Problem.**
      *   **Goal:** Use your developing resolutions to Conflict and Ground as interpretive lenses to re-examine passages often cited as evidence *against* the role-ethics reading (e.g., passages seeming to prioritize abstract virtue, discussions of `tian` or `xing`).
      *   **Method:** Hermeneutic engagement with key counter-texts. Dialogue with scholars holding traditional virtue ethics interpretations. Refine your Conflict/Ground models based on interpretive challenges.
      *   **Why Integrated?** It prevents the project from becoming a pure reconstruction divorced from the texts. It provides continuous reality checks and refines the argument.

  4.  **Scope Problem: Defer until Core is Solid (Postdoc or Future Project).**
      *   **Rationale:** Tackling scope prematurely risks building extensions on shaky foundations. A robust account of Conflict and Ground provides the necessary tools to address scope rigorously *as an extension* later.

  **Key to Success:** Frame each project not just as commentary, but as *problem-solving*: "How can Confucian role ethics resolve X?" Use your comparative/analytic skills to bring precision to the questions and rigor to the proposed solutions, always grounding arguments in textual evidence while pushing the theoretical envelope. This agenda positions you to make original contributions addressing the most critical live debates within the role-ethics research program. Good luck!
