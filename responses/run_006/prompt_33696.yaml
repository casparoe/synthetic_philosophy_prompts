  i'm running a reading group on supererogation next week — you know, acts beyond duty, saintly and heroic stuff that's good but not required. we've done urmson's "saints and heroes" and some of the more recent work on the paradox (if an act is morally better, why isn't it obligatory?).

  i want to open with a poem, something that does philosophical work rather than just decorating the topic. here's my thought: a petrarchan sonnet. the octave maps the realm of duty — the moral minimum, the fence you're not allowed to cross, what we owe each other as a matter of requirement. the volta at line 9 is the moment an act steps over that line, not in transgression but in excess, doing what no one could demand. the sestet explores what that gratuitous goodness means — its beauty, its optionality, the way it haunts the whole system of obligation. the closing couplet should land on the paradox itself: that the best things we do are precisely the ones we can't require of one another.

  i need it to be accurate enough that someone who knows the litterature recognises the terrain, and good enough as a poem that someone who doesn't still finds it moving. no jargon, no namedropping — let the form carry the argument.

  you're a poet who's done serious time in moral philosophy. think through the structure before you start drafting — maybe sketch what each quatrain needs to accomplish. and please write in british english.
