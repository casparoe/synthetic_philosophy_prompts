prompt: |-
  I work as a software engineer at a company that builds supply-chain and compliance tools for the seafood industry. We're developing a new module for aquaculture certifications — basically, instead of just checking whether a farm follows a static checklist of practices (like "stocking density below X kg/m³"), we want the software to help auditors and farm managers actually reason through whether a proposed operational change improves animal welfare. The idea is to embed some kind of decision procedure that a non-philosopher can follow step by step, and that I can turn into a guided workflow in the app.

  The domain is finfish and crustacean aquaculture — salmon, trout, shrimp, that sort of thing. I've been reading enough to know that the question of whether fish and crustaceans even feel pain or suffer is genuinely contested, and that even if you grant they do, it's not obvious what "welfare" means for a shrimp versus a salmon — totally different sensory systems, different needs, different behaviors. So the procedure can't just assume that whatever matters for a pig matters for a prawn.

  Here's what I need: a decision procedure for evaluating a proposed change to aquaculture practices from the standpoint of animal welfare. It has to be something I can code into a questionnaire-style workflow. The auditor or farm manager opens the module, describes the change they're considering, and the system walks them through a series of questions that determine whether the change is a welfare improvement, a welfare regression, or ambiguous, and why.

  The procedure has to handle the hard cases. For instance:

  - What if a change improves one dimension of welfare but worsens another (e.g., switching to a slower-growing strain that has better health outcomes but lives longer at higher density)?
  - What if there's genuine scientific uncertainty about whether a particular species can suffer in a relevant way — do we default to "assume they can" or "wait for evidence"?
  - What if the change benefits a large number of animals slightly but harms a small number severely?
  - At what point does the procedure say "we don't know enough, you need to bring in an expert" rather than giving a verdict?

  I want the procedure to be honest about where judgment enters. Don't dress up value choices as technical questions. Flag the steps where a human has to make a call that the software can't make for them, and say what kind of call it is — a factual one, a values one, or a tradeoff one.

  Then, run the procedure on two concrete proposals so I can see how it works in practice:

  1. A shrimp farm considering switching from eyestalk ablation to a non-ablated breeding method (more expensive and slightly less productive but eliminates a painful procedure).
  2. A salmon farm considering reducing stocking density by 20% (more per-fish space, probably less stress and disease, but requires more total pens, more handling events, and more infrastructure).

  I know this is asking a lot. Also, at the end, please tell me how confident you are in each major part of the procedure you've given me, and single out the step or claim you're least sure about — I need to know where the weak points are before I build this into production code and someone's audit result hangs on it.
reasoning: |-
  We are designing a decision procedure for evaluating changes in aquaculture practices from an animal welfare perspective. The procedure must be implementable as a step-by-step workflow and handle complex trade-offs and uncertainties.

  The procedure will consist of several key steps:

  1. **Define the Change**: Clearly describe the proposed change.
  2. **Identify Affected Animals**: Which species and life stages are affected?
  3. **Assess Capacity for Welfare-Relevant States**: Determine if the animals have the capacity for suffering and positive states (pain, stress, pleasure, etc.). This step must handle uncertainty.
  4. **Identify Welfare Dimensions Affected**: For each affected group, identify which aspects of welfare are impacted (e.g., health, stress, natural behavior, pain, fear, hunger, etc.).
  5. **Characterize Impact on Each Dimension**: For each welfare dimension, assess the magnitude and direction (improvement or worsening) of the change. Account for uncertainty.
  6. **Aggregate Impacts**: Combine the impacts across dimensions and across groups of animals. This step must handle trade-offs and may require value judgments.
  7. **Overall Assessment and Uncertainty Check**: Decide the net welfare effect and whether the evidence is sufficient for a conclusion.

  We'll structure the procedure as a series of questions. At each step, we note when a judgment call is required and the nature of that call (factual, value, or trade-off).

  ---

  **Decision Procedure for Evaluating Aquaculture Practice Changes**

  **Step 1: Define the Change**
  - Question: Describe the proposed change in detail, including what is being changed, how, and when.
  - Output: A clear description of the change.
  - Judgment: None (factual description).

  **Step 2: Identify Affected Animals**
  - Questions:
    - Which species and subspecies are affected?
    - What life stages are affected (e.g., larvae, juvenile, adult)?
    - How many animals are affected and over what period?
  - Output: List of animal groups (by species and life stage) and the population size and time frame.
  - Judgment: Factual.

  **Step 3: Assess Capacity for Welfare-Relevant States (Pain, Suffering, Positive States)**
  - For each animal group (from Step 2):
    - Question: What is the scientific consensus on the capacity of this animal group to experience negative states (like pain, fear, distress) and positive states (like comfort, pleasure)?
      - Options (with guidance):
        - Strong evidence of capacity (e.g., salmon: evidence of nociception, avoidance, physiological stress responses).
        - Some evidence but contested (e.g., shrimp: some evidence of nociception but debate on conscious suffering).
        - Little to no evidence (e.g., very primitive invertebrates).
    - If contested or uncertain, the procedure defaults to the "Precautionary Principle": Assume they can experience welfare-relevant states unless there is strong evidence to the contrary.
    - Question: Does the change primarily affect states for which the animal has a confirmed capacity? (e.g., if the change affects pain but the animal is not confirmed to feel pain, then that dimension might be irrelevant).
  - Output: For each group, a determination of whether welfare considerations apply and which states are relevant.
  - Judgment: Factual but with uncertainty. The precautionary principle is a value choice (we choose to avoid potential harm even in uncertainty). This step may require expert input in borderline cases.

  **Step 4: Identify Welfare Dimensions Affected**
  - For each animal group (with welfare capacity) and for each aspect of the change:
    - Question: Which specific welfare dimensions are likely to be affected? (Provide a checklist based on the "Five Freedoms" or similar framework, adapted for fish/crustaceans):
      - Freedom from hunger and thirst
      - Freedom from discomfort (e.g., environmental, physical)
      - Freedom from pain, injury, and disease
      - Freedom to express normal behavior (species-specific)
      - Freedom from fear and distress
    - Note: Also consider positive welfare (e.g., opportunities for positive experiences).
  - Output: List of welfare dimensions per animal group that are affected by the change.
  - Judgment: Factual but may involve some prediction (if the change is novel).

  **Step 5: Characterize Impact on Each Dimension**
  - For each welfare dimension identified in Step 4, for each animal group:
    - Question: What is the direction of the impact? (Improvement, worsening, or ambiguous)
    - Question: What is the magnitude of the impact? (Use a scale, e.g., negligible, slight, moderate, severe, extreme)
    - Question: What is the certainty of this impact? (High, medium, low)
      - If certainty is low, the procedure may flag for expert consultation.
    - Question: Over what time period does the impact occur? (Short-term, long-term, intermittent)
    - Question: What proportion of the population is affected? (e.g., 100%, a subset)
  - Output: For each dimension and group, a characterized impact (direction, magnitude, certainty, duration, and proportion affected).
  - Judgment: Factual but with uncertainty. Requires evidence and may need expert input.

  **Step 6: Aggregate Impacts**
  - This step combines impacts across dimensions and across groups. It requires making trade-offs explicit.
  - Sub-steps:
    - **Within a group**: 
      - Question: Are there multiple welfare dimensions affected for the same group? If so, do the impacts conflict (e.g., one dimension improves, another worsens)?
        - If conflicting: Require a judgment on the relative importance of each dimension for this species. (Value judgment: e.g., is avoiding pain more important than allowing natural behavior?)
        - Guidance: Use a weighting system based on severity and duration. For example, severe pain might outweigh moderate discomfort. But note: this weighting is a value choice and may require stakeholder input or ethical guidelines.
      - Output: Net effect per group (overall improvement, worsening, ambiguous) and a summary of the trade-offs.
    - **Across groups**:
      - Question: Are there multiple groups affected differently? (e.g., the change benefits one group but harms another, or benefits most but harms a few)
        - If so, we must compare the net welfare change across groups. This requires aggregation of welfare across individuals (a value judgment).
        - Guidance: Use a weighted sum approach: (number of animals affected in group * magnitude of impact * sign). But note: this assumes welfare is additive and comparable. Also, how do we weigh a severe harm to a few vs. slight benefit to many? The procedure must flag this as a value judgment and may require setting a policy (e.g., avoid severe harm even if the net is positive).
      - Output: Overall net welfare effect and a note on any distributional concerns (e.g., a minority is severely harmed).

  **Step 7: Overall Assessment and Uncertainty Check**
  - Question: Considering all the above, what is the overall welfare assessment? (Options: Improvement, Regression, Ambiguous)
  - Question: What is the overall level of certainty? (High, Medium, Low)
    - If certainty is low, the procedure should recommend expert consultation and possibly further research.
  - Question: Are there any critical value judgments that require stakeholder input? (List them)
  - Output: Final verdict with reasons and a note on uncertainty and value judgments.

  ---

  **Applying the Procedure to Concrete Examples**

  **Example 1: Shrimp farm switching from eyestalk ablation to non-ablated breeding method**

  Step 1: Change: Replace eyestalk ablation (a procedure that involves crushing or cutting the eyestalk to induce maturation) with a non-ablated method (e.g., using photoperiod and temperature control). This is more expensive and slightly less productive.

  Step 2: Affected Animals: Adult female shrimp (broodstock). Typically, all females in the broodstock population.

  Step 3: Capacity for Welfare-Relevant States:
  - Shrimp (adult): Evidence of nociception and some behavioral responses to noxious stimuli, but contested whether they experience pain consciously. Precautionary principle applies -> assume they can suffer from the ablation procedure.

  Step 4: Welfare Dimensions Affected:
  - Freedom from pain, injury, and disease: Ablation is a physically damaging procedure. Non-ablated method avoids this.
  - Freedom from fear and distress: Avoids the stress of handling and the procedure.
  - Note: Non-ablated method might involve other welfare issues? (e.g., different environmental conditions) but the change primarily removes a negative.

  Step 5: Characterize Impact:
  - Dimension: Pain/Injury
    - Direction: Improvement (eliminates the ablation procedure)
    - Magnitude: Severe (the procedure is invasive and causes tissue damage)
    - Certainty: High (direct effect)
    - Duration: Short-term (during the procedure) but also long-term if there are chronic effects (which are possible).
    - Proportion: 100% of females.
  - Other dimensions? Non-ablated method might lead to lower productivity, which could indirectly affect welfare (e.g., if the farm compensates by increasing stocking density) but that is not a direct effect of the change. We focus on the direct effect.

  Step 6: Aggregate Impacts (within group):
  - Only one major dimension (pain/injury) is improved. No conflict -> net improvement.

  Step 7: Overall Assessment:
  - Welfare improvement (high certainty). The change eliminates a procedure that is likely to cause pain and injury.

  **Example 2: Salmon farm reducing stocking density by 20%**

  Step 1: Change: Reduce stocking density in salmon pens by 20%. This requires more pens, more handling events (e.g., during grading, moving, or harvest), and more infrastructure.

  Step 2: Affected Animals: Juvenile to adult salmon in the pens. All individuals in the production cycle.

  Step 3: Capacity for Welfare-Relevant States: Salmon have strong evidence of nociception, stress responses, and capacity for suffering. Welfare considerations apply.

  Step 4: Welfare Dimensions Affected:
  - Freedom from discomfort: Reduced density might improve space and water quality (e.g., oxygen, waste) -> improvement.
  - Freedom from disease: Lower density may reduce disease transmission -> improvement.
  - Freedom to express normal behavior: More space may allow more natural swimming and social behavior -> improvement.
  - Freedom from fear and distress: More handling events (due to more pens) might increase stress during those events -> worsening.

  Step 5: Characterize Impact:
  - Dimension: Discomfort (due to crowding)
    - Direction: Improvement
    - Magnitude: Moderate (20% reduction is significant but not huge)
    - Certainty: Medium (evidence supports that crowding causes stress, but exact effect size varies)
    - Duration: Long-term (throughout the grow-out period)
    - Proportion: 100%
  - Dimension: Disease
    - Direction: Improvement
    - Magnitude: Moderate (reduced transmission risk)
    - Certainty: Medium (well-established in principle, but depends on other factors)
    - Duration: Long-term
    - Proportion: 100%
  - Dimension: Natural behavior
    - Direction: Improvement
    - Magnitude: Slight to moderate (more space, but may still be limited)
    - Certainty: Low (harder to measure)
    - Duration: Long-term
    - Proportion: 100%
  - Dimension: Fear and distress (from handling)
    - Direction: Worsening
    - Magnitude: Moderate (each handling event is stressful, and there are more events; but note: handling events are intermittent)
    - Certainty: High (handling stress is well-documented)
    - Duration: Short-term bursts during handling, but repeated.
    - Proportion: 100% (all fish are handled more times)

  Step 6: Aggregate Impacts:
  - Within group (salmon):
    - Three dimensions improve (discomfort, disease, behavior), one worsens (handling stress).
    - We must weigh: The improvements are long-term and affect the daily life of the fish, while the worsening is intermittent. However, the handling events might be highly stressful. Value judgment: Is the reduction in chronic stress more important than the increase in acute stress events? 
    - Guidance: Chronic stress is often more detrimental to welfare than acute stress. Also, the number of additional handling events matters. The auditor must estimate how many more events and how severe they are. If the handling events can be minimized (e.g., with better practices), the net might be positive. Without that, it's ambiguous.

  Step 7: Overall Assessment:
  - Ambiguous (medium certainty). The change has both positive and negative effects, and the net depends on the relative weight of chronic vs. acute stress and the actual number of handling events. Recommendation: If the farm can minimize handling stress (e.g., by using fewer but larger pens, or better handling techniques), then the change might be an improvement. Otherwise, it's unclear.

  ---

  **Confidence Assessment**

  1. **Steps 1 and 2 (Define Change and Identify Animals)**: High confidence. Factual and straightforward.
  2. **Step 3 (Capacity for Welfare-Relevant States)**: Medium to Low confidence. This step is critical and the most uncertain because:
     - The science is evolving and contested for many species (especially invertebrates).
     - The precautionary principle (default to assuming capacity) is a value choice that may not be universally accepted. Some stakeholders might prefer a higher evidence threshold.
     - Least sure about: The guidance on when to apply the precautionary principle and how to handle borderline species (e.g., shrimp). We rely on the best available science, but it's incomplete.
  3. **Step 4 (Identify Welfare Dimensions)**: Medium confidence. The framework (Five Freedoms) is well-established but may not capture all species-specific needs. Adaptation for aquatic species is ongoing.
  4. **Step 5 (Characterize Impact)**: Medium confidence. It requires predicting outcomes, which is inherently uncertain. The magnitude and certainty assessments are subjective and may vary between assessors.
  5. **Step 6 (Aggregate Impacts)**: Low confidence. This step involves difficult value judgments and trade-offs. There is no scientific consensus on how to weigh different welfare dimensions or how to aggregate welfare across individuals. The procedure flags this, but the guidance (e.g., weighting by severity) is simplistic and may not reflect ethical complexity.
     - Least sure about: The aggregation across individuals (e.g., severe harm to a few vs. slight benefit to many) and across conflicting dimensions. This step is the most value-laden and subjective.
  6. **Step 7 (Overall Assessment)**: High confidence in the process (it flags uncertainty and value judgments) but low confidence in the output when the input is uncertain.

  **Weakest Point**: The aggregation step (Step 6) and the capacity assessment (Step 3) are the most challenging. Step 6 requires value judgments that the software cannot make, and Step 3 relies on incomplete science. 

  **Recommendation for Implementation**: 
  - Build in flexibility for expert consultation at Steps 3, 5, and 6.
  - Allow for customization of the value judgments (e.g., by certification bodies) so that the procedure can be aligned with specific ethical guidelines.
  - Continuously update the scientific basis as new research emerges.

  This procedure provides a structured way to think through welfare impacts but cannot replace human judgment in complex cases.
answer: |-
  Below is a structured decision procedure for evaluating aquaculture practice changes from an animal welfare perspective. It's designed as a step-by-step workflow that auditors/farm managers can follow in your app. The procedure explicitly flags judgment points and handles uncertainty, trade-offs, and value conflicts. I'll first outline the procedure, then apply it to your two examples, and end with a confidence assessment.

  ---

  ### **Animal Welfare Impact Assessment (AWIA) Procedure**
  *Format: Sequential questions with branching logic. Each step requires user input or selection. Judgment flags indicate where human input is needed.*

  #### **Step 1: Define the Change**
  - **Question:** Describe the proposed change in specific, measurable terms.  
    *(e.g., "Reduce stocking density from 25 kg/m³ to 20 kg/m³" or "Replace eyestalk ablation with photoperiod manipulation")*  
  - **Output:** Clear change description stored for reference.  
  - **Judgment Flag:** None (factual).

  #### **Step 2: Identify Affected Groups**
  - **Question:** Which species/life stages are affected? (Select from: Finfish [salmon, trout, etc.], Crustaceans [shrimp, prawns, etc.], Other).  
  - **Question:** What is the scale of impact? (Number of animals affected, duration/frequency of exposure).  
  - **Output:** List of affected animal groups (e.g., "Adult shrimp broodstock" or "Juvenile salmon in grow-out pens").  
  - **Judgment Flag:** None (factual).

  #### **Step 3: Assess Capacity for Welfare-Relevant States**
  - **Question:** Is there scientific consensus that this species/life stage can experience **negative states** (e.g., pain, stress, fear)?  
    - *Options:*  
      - **Strong evidence** (e.g., salmonids: behavioral/physiological pain responses).  
      - **Contested evidence** (e.g., decapod crustaceans: nociception exists, but consciousness debated).  
      - **Little/no evidence** (e.g., larval stages).  
  - **Procedure Rule:**  
    - If **Strong evidence** → Proceed.  
    - If **Contested evidence** → Apply precautionary principle: *"Assume capacity for suffering unless evidence strongly suggests otherwise."*  
    - If **Little/no evidence** → Flag as "low welfare relevance"; skip to Step 7.  
  - **Output:** Binary (welfare assessment applies/does not apply).  
  - **Judgment Flag:**  
    - *Factual uncertainty* (requires auditor to consult species-specific literature).  
    - *Value choice*: Precautionary principle is a policy decision (default: "assume they can suffer").  

  #### **Step 4: Map Welfare Dimensions**
  - **Question:** Which welfare dimensions could this change impact? (Select all applicable; based on [Five Domains model](https://www.mdpi.com/2076-2615/10/6/1033)):  
    - **Health** (disease, injury, mortality).  
    - **Behavior** (natural behaviors, aggression, abnormal behaviors).  
    - **Environment** (water quality, space, stressors).  
    - **Affective State** (fear, stress, comfort).  
  - **Output:** List of impacted dimensions (e.g., "Health and Affective State").  
  - **Judgment Flag:** *Factual* (but requires understanding of species biology).

  #### **Step 5: Characterize Direction and Magnitude of Impact**
  - **For each dimension from Step 4:**  
    - **Question:** Direction: Is the impact **positive** (welfare improvement), **negative** (regression), or **unknown**?  
    - **Question:** Magnitude: On a scale of 1–5, how significant is the effect?  
      - *1: Negligible, 2: Slight, 3: Moderate, 4: Severe, 5: Extreme* (e.g., "Eliminating ablation: Affective State impact = 5").  
    - **Question:** Certainty: How confident are you in this assessment?  
      - *High* (robust evidence), *Medium* (some evidence), *Low* (anecdotal/theoretical).  
  - **Output:** Impact matrix (Dimension × Direction × Magnitude × Certainty).  
  - **Judgment Flag:**  
    - *Factual uncertainty* (magnitude/certainty require evidence review).  
    - *Tradeoff note*: If impacts conflict (e.g., Health improves but Affective State worsens), flag for Step 6.  

  #### **Step 6: Resolve Trade-offs and Conflicts**
  - **If all impacts align** (all positive/negative): Skip to Step 7.  
  - **If trade-offs exist** (e.g., one dimension improves, another worsens):  
    - **Question:** Which dimension is **ethically prioritized** for this species? (Use preloaded guidelines; e.g., "For salmon, health >> behavior due to disease risks").  
    - **Question:** Does the change disproportionately affect **subgroups**? (e.g., benefits 90% of animals slightly but harms 10% severely).  
      - *Rule:* Severe harm to a minority cannot be offset by slight gains for a majority without explicit ethical override.  
  - **Output:** Net welfare verdict (Improvement, Regression, Ambiguous) + justification.  
  - **Judgment Flag:**  
    - *Value choice*: Ethical weighting of dimensions (requires policy input).  
    - *Value choice*: Severity thresholds (e.g., "Is a 20% mortality spike worse than chronic stress?").  

  #### **Step 7: Uncertainty Check and Verdict**
  - **Question:** What is the overall certainty level? (Based on lowest certainty in Step 5).  
    - *High*: Proceed.  
    - *Medium/Low*: Flag "Expert consultation needed" → Output = "Ambiguous: Insufficient evidence."  
  - **Final Output:**  
    - **Improvement** (net positive impact, high certainty).  
    - **Regression** (net negative impact, high certainty).  
    - **Ambiguous** (trade-offs/unresolved conflicts OR low certainty).  
  - **Judgment Flag:** *Procedural* (uncertainty threshold is a policy choice).

  ---

  ### **Applied Examples**
  #### **Case 1: Shrimp Farm Switching from Eyestalk Ablation to Non-Ablated Breeding**
  - **Step 1:** Change: Replace eyestalk ablation (manually severing eyestalks to induce spawning) with photoperiod/temperature manipulation.  
  - **Step 2:** Affected: Adult female shrimp (broodstock). High frequency (all broodstock).  
  - **Step 3:** **Contested evidence** for pain in shrimp. Precautionary principle → assume capacity for suffering.  
  - **Step 4:** Dimensions: **Affective State** (pain during ablation), **Health** (infection risk), **Behavior** (post-ablation stress).  
  - **Step 5:**  
    - Affective State: Direction = Positive (eliminates ablation). Magnitude = 5 (extreme). Certainty = Medium (pain contested but ablation invasive).  
    - Health: Direction = Positive (reduced injury/infection). Magnitude = 3 (moderate). Certainty = High.  
    - Behavior: Direction = Positive. Magnitude = 2 (slight). Certainty = Low.  
  - **Step 6:** All dimensions positive → No trade-offs.  
  - **Step 7:** Certainty = Medium (due to Affective State debate). Verdict: **Improvement** (precautionary principle overrides uncertainty).  
  - **Why:** Eliminates a high-magnitude welfare harm despite contested pain evidence. Productivity loss is not a welfare factor.

  #### **Case 2: Salmon Farm Reducing Stocking Density by 20%**
  - **Step 1:** Change: Reduce density from 25 kg/m³ to 20 kg/m³. Requires 2 additional pens, 3 extra handling events/cycle.  
  - **Step 2:** Affected: Juvenile-adult salmon in all pens.  
  - **Step 3:** **Strong evidence** for pain/stress in salmon.  
  - **Step 4:** Dimensions:  
    - **Environment** (more space/oxygen → positive).  
    - **Health** (lower density → reduced disease → positive).  
    - **Affective State** (more handling → acute stress → negative).  
    - **Behavior** (more natural swimming → positive).  
  - **Step 5:**  
    - Environment: Direction = Positive. Magnitude = 3 (moderate). Certainty = High.  
    - Health: Direction = Positive. Magnitude = 3 (moderate). Certainty = Medium (density-disease link varies).  
    - Affective State: Direction = Negative (more handling). Magnitude = 4 (severe). Certainty = High (handling stress well-documented).  
    - Behavior: Direction = Positive. Magnitude = 2 (slight). Certainty = Low.  
  - **Step 6:** **Trade-off:** Major positive (Environment/Health) vs. major negative (Affective State).  
    - Ethical priority: For salmon, **Affective State (acute stress) is weighted highly** due to welfare consequences.  
    - Subgroup impact: Handling harms all fish, but benefits are population-wide.  
    - Rule: Severe acute stress (magnitude 4) may outweigh moderate chronic benefits.  
    - Output: **Ambiguous** (conflict requires farm-specific mitigation, e.g., better handling protocols).  
  - **Step 7:** Certainty = Medium. Verdict: **Ambiguous** (trade-off unresolved; depends on handling protocols).  

  ---

  ### **Confidence Assessment**
  I’ve ranked confidence from 1 (low) to 5 (high) for each procedural component. Weak points are flagged.

  | **Procedure Step**              | **Confidence** | **Key Weak Points**                                                                 |
  |---------------------------------|----------------|-------------------------------------------------------------------------------------|
  | **Step 1: Define Change**       | 5              | None. Factual and straightforward.                                                 |
  | **Step 2: Identify Groups**     | 5              | None. Easily operationalized.                                                      |
  | **Step 3: Capacity Assessment** | 2              | **LOWEST CONFIDENCE**. Contested science (e.g., crustacean pain). Precautionary principle is ethically fraught and may clash with user beliefs. |
  | **Step 4: Welfare Dimensions**  | 4              | Framework (Five Domains) is robust, but species-specific adaptations are incomplete (e.g., "natural behavior" for shrimp is poorly defined). |
  | **Step 5: Impact Characterization** | 3          | Magnitude/certainty scoring is subjective. Auditors may over/underestimate without training. |
  | **Step 6: Trade-off Resolution**| 2              | **HIGHEST RISK**. Weighting dimensions (e.g., "Is stress worse than disease?") lacks universal standards. Minority harm rule is arbitrary without stakeholder input. |
  | **Step 7: Uncertainty Handling**| 4              | Clear thresholds, but "expert consultation" is vague (who qualifies?).             |

  #### **Key Weaknesses to Address Before Coding:**
  1. **Step 3 (Capacity for Suffering)**:  
     - Least confident in applying the precautionary principle to invertebrates (e.g., shrimp). Some certification bodies may reject it.  
     - **Mitigation**: Make the principle configurable (e.g., admins can toggle "Always use precaution"/"Require strong evidence").

  2. **Step 6 (Trade-offs)**:  
     - No objective way to compare dimensions (e.g., stress vs. disease). Could lead to inconsistent verdicts.  
     - **Mitigation**: Integrate species-specific ethical weightings from certification schemes (e.g., GlobalG.A.P. or RSPCA standards) and allow custom rules.

  3. **Subjectivity in Step 5 (Magnitude)**:  
     - A "moderate" impact for one auditor may be "slight" for another.  
     - **Mitigation**: Provide training materials with examples (e.g., "20% mortality = severe").

  ---

  ### **Recommendations for Implementation**
  - **Build Flexibility:** Allow configurable thresholds (e.g., certainty levels) and ethical rules (e.g., trade-off resolution).  
  - **Embed Expert Systems:** Link to a knowledge base (e.g., FAO aquaculture guidelines) for Step 3/5 evidence.  
  - **Audit Trails:** Log all judgments to explain verdicts (critical for certification audits).  
  - **Pilot Testing:** Run the procedure with aquaculture vets before launch to calibrate subjectivity.  

  This procedure provides a defensible, transparent framework—but **Step 3 and Step 6 are high-risk** and require careful validation with your users. I recommend starting with a beta release for feedback.
