prompt: |-
  I'm a novelist — mid-career, literary fiction, the kind of thing where my characters spend a lot of time talking at dinner parties — and I've been trying to nail down a social dynamic I want to build a character around, but I don't have the word for it and I'm not sure philosophy has one either.

  Here's the thing. Someone in my circle hasn't read a book, hasn't seen the film, hasn't listened to the album. But they've marinated in the discourse. They've read the reviews, they've heard the podcast discussions, they've scrolled the arguments on Twitter or Bluesky or wherever. And when the work comes up in conversation, they hold forth with a fully formed aesthetic verdict — "oh, it's overrated, the third act collapses, the prose is self-indulgent" — delivered with the same cadence and confidence as someone who spent six hours with the thing. If you ask directly, they'll admit they haven't experienced it, but they'll say it like it's almost a point of pride: "I haven't read it, but I know enough." And here's the part that interests me: their judgment has a different texture from the judgment of someone who actually read the book. The actual reader's take is messy — they liked it but they're not sure why, the ending worked for them but they can't defend it, they keep circling back to one scene they can't quite interpret. The discourse-absorber's take is never messy. It's crisp, it's confident, it sounds like a pull quote. It's in the register of a review, never in the register of a confession. And paradoxically, this crispness makes it more fragile — you can't push on it without the whole thing collapsing, because there's no texture underneath, no memory of a specific passage or a moment of boredome or a line that landed wrong. There's nothing to push against.

  I'm dimly aware there's a whole literature on "aesthetic testimony" — whether you can learn about art from other people's descriptions. But that debate, as I understand it, is largely about whether testimony can justify aesthetic belief. What I'm after is narrower and more sociological: it's the practice of treating discourse-absorption as functionally equivalent to firsthand experience, and the distinctive rhetorical posture that comes with it — the overconfidence, the review-like register, the brittleness. It feels like a specific epistemic stance, maybe even a specific kind of bullshit in the Frankfurtian sense, but I'm not sure.

  Is there a name for this? If it's just a corrolary of the aesthetic testimony problem, tell me that, but also tell me whether anyone has analyzed it on its own terms — the social practice, not just the epistemological question. If nobody has named it, give it a name and draw its boundaries: what counts, what's adjacent but different (is it just being well-informed? is it intellectual posturing?), and where the line is between this and someone who legitimately knows a lot about a work they haven't consumed. Keep it to about 400 words — I need the concept, not the whole history of the debate.
reasoning: |-
  Okay, this novelist is describing a social phenomenon where someone forms strong opinions about a work of art based solely on secondary discourse—reviews, podcasts, Twitter debates—without actually experiencing the work firsthand. They note that this person's critique is confident, polished, and brittle, lacking the nuance and vulnerability of someone who actually engaged with the work. The novelist is looking for a term to capture this specific dynamic, both the behavior and its social implications.

  Hmm, I recall philosophical discussions about aesthetic testimony, but that's more about whether others' opinions can justify beliefs. This seems different—it's about the performance of expertise without genuine engagement. The novelist mentions Frankfurt's concept of bullshit, which is about indifference to truth. That feels relevant here because the discourse-absorber isn't concerned with the actual work; they're focused on the social currency of having an opinion.

  I think I might call this "vicarious criticism." The key elements are: reliance on digested discourse rather than direct experience, the polished "review-speak" that mimics critical language, and the fragility when probed. It's adjacent to being well-informed, but different because well-informed people might still acknowledge gaps or complexity. This is more about adopting a critical persona. Intellectual posturing is close, but vicarious criticism is specifically tied to cultural consumption—it's performative expertise about art without the encounter.

  The novelist also wants boundaries. For example, someone who studies a film through scripts and essays without watching it might have legitimate knowledge, but they'd likely contextualize their perspective, not present it as firsthand judgment. Vicarious criticism skips that humility—it's the unearned confidence that's defining. The brittleness comes from having no sensory or emotional touchpoints to draw from when challenged. 

  I'll suggest "vicarious criticism" as the term, emphasize its social performance angle, and clarify how it differs from related concepts. The novelist can use this to build the character's tics—how they deflect challenges, their smooth but hollow phrasing. It's a modern epistemic stance, really: opinion as social armor.
answer: |-
  Here’s a distilled concept for your character’s dynamic:  

  ### **Vicarious Criticism**  
  *(n.): The practice of adopting polished, secondhand aesthetic judgments—derived solely from discourse (reviews, podcasts, social media)—as functionally equivalent to firsthand experience, resulting in a brittle, authoritative rhetorical posture devoid of experiential texture.*  

  #### **Boundaries & Nuances:**  
  - **Core Traits**:  
    - **Review-Speak Register**: Opinions mimic critical clichés ("self-indulgent prose," "collapsing third act"), lacking personal hesitations or sensory details.  
    - **Epistemic Overconfidence**: Claims carry the cadence of expertise but evaporate under scrutiny ("I haven’t read it, but I *know*").  
    - **Brittleness**: No experiential substrate—no memory of boredom, resonance, or ambiguity—to anchor the judgment.  

  - **Adjacent but Distinct**:  
    - **Well-Informed Contextual Knowledge**: Studying a work’s *context* (historical analysis, author interviews) differs by acknowledging gaps in direct engagement.  
    - **Intellectual Posturing**: Broader and often intentional; vicarious criticism can be unconscious performance.  
    - **Legitimate Criticism Without Full Consumption**: E.g., a scholar analyzing a film via script/essays but *owning* their partial perspective.  

  - **Line in the Sand**:  
    Vicarious critics **equate discourse with embodied knowledge** and perform critical authority as social currency. Their verdicts are **defensive**, not exploratory—closing discussion, not inviting it.  

  #### **Philosophical/Social Roots**:  
  - A **sociological corollary of aesthetic testimony debates**, focusing on *why* discourse-absorption replaces experience: social signaling, efficiency, or fear of "missing out."  
  - **Frankfurtian "Bullshit" Adjacent**: Indifference to truth (here, the artwork’s reality) in favor of impression management.  
  - **Key Analysts**:  
    - Pierre Bourdieu (*Distinction*) on cultural capital as performance.  
    - Current critics like Lauren Oyler (novelist/critic) dissect "opinion-as-identity" in digital discourse.  

  #### **Name It in Action**:  
  Your character doesn’t just *parrot* takes—they **perform critical facsimiles**. Their dialogue should crackle with rehearsed certainty until challenged, then deflect or collapse ("Well, *everyone* says the pacing fails").  

  *Use "vicarious criticism" as your lens. It’s the epistemic swagger of cultural consumption without the mess of consumption itself.*
