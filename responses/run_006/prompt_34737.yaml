prompt: |-
  You're an expert on value theory and philosophy of mind; think carefully and start by brainstorming the hard cases before you write. I'm teaching a grad seminar on hedonism, and before I assign the standard accounts I want a spec sheet: what does a theory of pleasure have to get right to count as adequate for hedonism's purposes? The thing I keep running into is the heterogeneity problem — the pleasure of a back scratch, of finally seeing how a proof works, of schadenfreude, of morphine, of a hot bath after being cold — these don't seem to share any felt quality, yet hedonism treats them as a single currency. So the central question is what, if anything, pleasures have in common, and what a theory has to say about that if it's going to serve as the primitive for prudential value.

  Write the desiderata. For each, give the case or consideration that forces it. Make sure you cover at least these: the line between pleasure and mere relief or the absence of pain; the line between liking and wanting; wether a pleasure has to be felt to count; whether the object of the pleasure matters or doesnt; and whether bodily pleasures and intellectual pleasures have to come out as the same kind of state. Flag which requirements are non-negotiable and which are just camp loyalties. Then tell me which pairs of desiderata you suspect can't be jointly satisfied — if the list itself turns out to be the result, that's the part I most want to see. End with a quick scorecard for felt-quality, attitudinal, and desire-based accounts, but keep the weight on the criteria, not the scorecard.
reasoning: |-
  Okay, the user is teaching a grad seminar on hedonism and needs a spec sheet for theories of pleasure. They specifically mentioned the heterogeneity problem—how different pleasures like a back scratch, understanding a proof, schadenfreude, morphine, and a hot bath don't seem to share a common felt quality. The central question is what pleasures have in common to serve as the primitive for prudential value.

  First, I need to outline the desiderata for an adequate theory of pleasure. The user highlighted several key issues: distinguishing pleasure from relief, separating liking from wanting, whether pleasure must be felt, if the object matters, and if bodily and intellectual pleasures are the same kind of state. They also want to know which criteria are non-negotiable versus camp loyalties and which pairs might conflict.

  Starting with the heterogeneity problem. Cases like morphine (sensory) vs. schadenfreude (complex emotion) show that a common felt quality is elusive. Any theory must handle this diversity without reducing all pleasures to one sensation. That's probably a non-negotiable. Then, the relief problem: avoiding pain isn't the same as positive pleasure. Think of someone with chronic pain—relief brings absence of pain, but is that pleasure? The theory must distinguish them.

  Next, liking vs. wanting. Addiction cases like rats pressing levers for stimulation they don't seem to "like" show dissociation. A theory must explain why pleasure is linked to liking, not just desire. This might be non-negotiable for prudential hedonism since unliked desires don't contribute to well-being.

  Consciousness requirement. Subliminal pleasures? If something isn't felt, can it add to well-being? Cases like unnoticed comfort from ergonomic chairs test this. Hedonism probably requires consciousness, but some might argue otherwise. This might be a non-negotiable; otherwise, it's not hedonism.

  Object neutrality vs. valence focus. Should the object of pleasure matter? Moral disgust, like enjoying someone's humiliation, might be pleasurable but repugnant. But hedonism typically treats all pleasures equally. However, some theories like attitudinal hedonism might allow objects to matter. This is a camp loyalty—pure hedonism might insist on neutrality.

  Uniformity of pleasure states. Are bodily and intellectual pleasures the same? The joy of solving a proof vs. a massage. If they're different, can they be compared? A theory must either unify them or show how they can be commensurable. Non-negotiable for a single currency.

  Now, conflicts. Desiderata 1 (heterogeneity) and 4 (object neutrality) might clash. If objects matter (as in attitudinal theories), it introduces heterogeneity beyond valence. Also, desiderata 3 (consciousness) and 2 (liking/wanting) could conflict if unconscious desires exist but aren't felt. Another conflict: uniformity (6) and heterogeneity (1) — if pleasures are diverse, how can they be uniform? Felt-quality theories struggle here, while attitudinal might handle it better.

  Scorecard: Felt-quality (e.g., Sidgwick) fails heterogeneity and liking/wanting. Attitudinal (Feldman) handles heterogeneity and neutrality but might blur pleasure/relief. Desire-based (Brandt) avoids felt quality issues but conflates wanting with liking. Each has trade-offs.

  The user's deeper need might be understanding if hedonism can overcome these problems or if the criteria themselves show inherent tensions, leading students to question hedonism's viability. Highlighting conflicts and non-negotiables will prepare them for critiques in later seminars.
answer: |-
  Here’s a rigorous spec sheet for a theory of pleasure in hedonism, structured around core desiderata, forced by hard cases, with conflicts flagged. Non-negotiables (**bolded**) stem from hedonism’s role as a theory of *prudential value*; others reflect theoretical commitments.

  ---

  ### **Desiderata for a Hedonistic Theory of Pleasure**  
  *(Cases forcing each requirement in italics)*  

  1. **The Heterogeneity Constraint**  
     - *Cases*: Back scratch (sensory), proof insight (cognitive), schadenfreude (emotional), morphine (chemical), hot bath (homeostatic).  
     - **Requirement**: Must explain how these diverse states constitute "pleasure" without relying on a *single* phenomenological quality.  
     - *Status*: **Non-negotiable**. Failure collapses hedonism into implausible introspectionism.  

  2. **Pleasure vs. Relief/Absence of Pain**  
     - *Case*: Chronic pain patient whose morphine removes agony but induces no positive state ("neutral relief"). Relief from a headache vs. the positive joy of tasting chocolate.  
     - **Requirement**: Must distinguish *positive* pleasure from *mere absence* of pain or restoration to baseline.  
     - *Status*: **Non-negotiable**. Hedonic prudence requires positive states to have value.  

  3. **Liking vs. Wanting (Incentive Salience)**  
     - *Case*: Addicts who "want" a drug due to craving but no longer "like" its effects; Berridge’s lab rats pressing levers for brain stimulation without hedonic facial expressions.  
     - **Requirement**: Must tie pleasure to *liking* (consummatory pleasure), not mere *wanting* (motivational drive).  
     - *Status*: **Non-negotiable**. Prudential value requires actual enjoyment, not frustrated desire.  

  4. **Consciousness Requirement**  
     - *Case*: Subliminal rewards (e.g., unseen images inducing mood lift); "unfelt pleasures" from background comforts (e.g., ergonomic chair unnoticed until removed).  
     - **Requirement**: Must clarify if pleasure *must be consciously felt* to count for well-being.  
     - *Status*: **Non-negotiable for classical hedonism**. Unfelt states can’t plausibly contribute to experiential welfare.  

  5. **Object-Neutrality vs. Object-Sensitivity**  
     - *Case*: Taking pleasure in immoral acts (e.g., schadenfreude). Does the *object* of pleasure affect its prudential value?  
     - **Requirement**: Must specify if pleasure’s value depends *only* on its hedonic intensity (neutrality) or if its source matters (sensitivity).  
     - *Status*: *Camp loyalty*. Pure hedonism demands neutrality (Bentham: "pushpin = poetry"), but hybrid views may reject this.  

  6. **Uniformity of Bodily/Intellectual Pleasures**  
     - *Case*: Comparing orgasm (bodily) to the "aha!" moment of understanding Kant (intellectual).  
     - **Requirement**: Must either (a) unify them as the *same* type of state, or (b) justify treating them as *commensurable* for a "hedonic calculus."  
     - *Status*: **Non-negotiable**. Hedonism requires a single currency.  

  ---

  ### **Tensions Between Desiderata: Suspected Incompatibilities**  
  The list itself reveals fault lines. Key conflicts:  

  - **Heterogeneity (1) + Uniformity (6)**: If bodily/intellectual pleasures share *no* common core (1), how can they be uniformly quantified (6)? *Felt-quality theories fail here; attitudinal theories may resolve it*.  
  - **Object-Neutrality (5) + Liking/Wanting (3)**: If pleasure is object-neutral, but "liking" is object-directed (e.g., liking *this* proof, not proofs generically), neutrality may require decoupling pleasure from its intentional object. *Attitudinal theories sacrifice neutrality*.  
  - **Consciousness (4) + Relief (2)**: Relief is often felt, but is it *positive* or just *non-negative*? A theory demanding strong phenomenology (4) may struggle to distinguish relief from weak pleasure (2).  
  - **Heterogeneity (1) + Consciousness (4)**: If all pleasures must be consciously felt (4), but their phenomenology is irreducibly diverse (1), what licenses calling them all "pleasure"? *Requires a non-phenomenal commonality*.  

  ---

  ### **Quick Scorecard on Major Theories**  
  *(Weighted toward criteria satisfaction, per request)*  

  | **Criterion**              | **Felt-Quality (e.g., Sidgwick)** | **Attitudinal (e.g., Feldman)** | **Desire-Based (e.g., Brandt)** |
  |----------------------------|-----------------------------------|---------------------------------|--------------------------------|
  | **Heterogeneity (1)**      | ✘ Fails: Demands common feel      | ✔ Wins: Pleasure = attitude     | △ Mixed: Reduces to desire-sat |
  | **Pleasure vs. Relief (2)**| △ Weak: Relief feels different    | △ Mixed: Attitude can target relief | △ Weak: Desire-sat includes relief |
  | **Liking vs. Wanting (3)** | ✔ Wins: Liking is felt            | ✔ Wins: Attitude = liking       | ✘ Fails: Conflates with wanting |
  | **Consciousness (4)**      | ✔ Wins: Requires feeling          | △ Mixed: Attitude may be unconscious | ✘ Fails: Unconscious desires count |
  | **Object-Neutrality (5)**  | ✔ Wins: Only feeling matters      | ✘ Fails: Attitude has object    | ✔ Wins: Desire-sat source-agnostic |
  | **Uniformity (6)**         | ✘ Fails: Bodily ≠ intellectual feels | ✔ Wins: Same attitude type    | ✔ Wins: All desires commensurable |

  **Legend**: ✔ = strong fit, △ = partial fit, ✘ = poor fit  

  ---

  ### **Conclusion: The Core Tension**  
  The desiderata reveal a **trilemma**:  
  - To satisfy **heterogeneity (1)** and **uniformity (6)**, you likely need a *non-phenomenal* core (e.g., attitude or desire).  
  - But **consciousness (4)** and **liking (3)** pull toward *phenomenology*.  
  - **Object-neutrality (5)** and **relief (2)** then constrain the solution further.  

  No extant theory satisfies all non-negotiables cleanly. **Attitudinal theories** (Feldman) handle heterogeneity best but sacrifice object-neutrality. **Desire theories** avoid phenomenology but collapse wanting/liking. **Felt-quality theories** preserve consciousness but crumble under heterogeneity. This spec sheet implies hedonism's viability hinges on whether a theory can reconcile the irreducibility of diverse pleasures with the need for a unified prudential currency—or whether the project is unstable. Assign this tension early; it’s where the deepest debates ignite.
