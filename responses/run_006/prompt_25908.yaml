prompt: |-
  I just spent three hours arguing with a friend about whether Frankfurt cases refute the principle of alternative possibilities, and we ended up exactly where we started. She thinks the cases obviously show you can be responsible without being able to do otherwise; I think they all sneak in determinism somewhere and beg the question. What frustrates me isn't that we disagree — it's that the professional literature seems just as stuck. People have been at this since 1969 and I can't tell whether anyone has moved.

  My hypothesis is that the two sides are actually answering different questions: one side is asking what our practices of holding people responsible track, and the other is asking what metaphysically grounds responsibility. If that's right, the whole thing might be a talking-past-each-other situation rather than a substantive dispute. But I'm not sure, and I'd like a diagnosis that takes the best versions of each side seriously.

  So: what kind of disagreement is this, really? Is it verbal, substantive, or two projects sharing a name? What would actually count as progress — a better Frankfurt case, a conceptual distinction, a formal result, or something else? And if my hypothesis is wrong, what's the better diagnosis? End with a one-sentence summary of your diagnosis as the final line.
