answer: |-
  Your frustration is profoundly understandable—this debate *is* stuck, and your hypothesis touches on a core issue. Here's a diagnosis that takes both sides seriously:

  ### 1. **The Nature of the Disagreement: More Than Just Verbal, Less Than Purely Substantive**
     - **Not Merely Verbal:** Both sides agree on the *definition* of PAP ("a person is morally responsible only if they could have done otherwise") and what Frankfurt cases *purport* to show (responsibility without alternative possibilities). The disagreement is about *what satisfies these concepts*.
     - **Not Two Projects, But Divergent Starting Points:** Compatibilists (pro-Frankfurt) often prioritize **practical responsibility**—what actually grounds blame/praise in our social/legal practices. They see Frankfurt cases as revealing that *control* (e.g., reasons-responsiveness) suffices. Incompatibilists (pro-PAP) prioritize **metaphysical ultimacy**—they insist responsibility requires a deeper, indeterminist freedom to "settle" outcomes. Frankfurt cases feel question-begging because they *assume* the agent’s action is fixed (e.g., by a prior sign or mechanism), smuggling in determinism’s core problem: lack of ultimate agential control.

  ### 2. **Why the Stalemate? Clashing Intuitions & Methodologies**
     - **Intuitional Bedrock:** Pro-Frankfurt thinkers find Jones's responsibility *obvious* in the actual sequence (he acted for his own reasons). PAP defenders find the *presence of a counterfactual intervener* (or prior sign) contaminating the scenario—Jones *wasn’t* truly free, as his action was ensured by external factors. These intuitions resist persuasion.
     - **Methodological Split:**  
       - **Compatibilists** use Frankfurt cases as *conceivability proofs*: "Here's a scenario where responsibility *seems* intact without alternatives; thus, PAP is false."  
       - **Incompatibilists** demand *metaphysical robustness*: "If Jones *couldn’t* have done otherwise *even in principle* (due to the intervener/sign), his control is illusory." They see Frankfurt cases as *changing the subject* from ultimate responsibility.

  ### 3. **What Would Count as Progress?**
     - **Conceptual Distinction:** Clarifying **two types of control** (e.g., John Martin Fischer's *guidance* vs. *regulative* control) helped—but PAP defenders reject that guidance control alone suffices for *full* responsibility.
     - **Better Frankfurt Cases?** Unlikely. "Flicker of freedom" strategies (e.g., Jones *could* have wavered before acting) forced refinements, but compatibilists built "buffered" cases (e.g., Derk Pereboom's "Tax Evasion"). Stalemate persists because incompatibilists see any preemptive fixity as determinism in disguise.
     - **Formal Results?** Logic can't resolve this—it hinges on irreducibly normative/metaphysical intuitions.
     - **Real Progress:** Acknowledging the **dialectical impasse** and reframing the debate:  
       - **For compatibilists:** Defend why *their* notion of control (e.g., reasons-responsiveness) is *sufficient* for responsibility *without* appealing to Frankfurt cases (e.g., via moral psychology or legal theory).  
       - **For incompatibilists:** Articulate why *only* indeterminist freedom could ground responsibility *without* invoking circular intuitions about Frankfurt cases (e.g., via agent-causal theories).  
       - **Meta-Progress:** Recognize that PAP might be a **necessary condition for *ultimate* responsibility** (incompatibilist view) but not for *practical* responsibility (compatibilist view). This admits your hypothesis is partly right.

  ### 4. **If Your Hypothesis is Wrong: A Better Diagnosis**
     The core is a **clash over the metaphysics of control**: Compatibilists see control as *structural* (hierarchical desires, reasons-sensitivity), while incompatibilists see it as *causal* (the agent as an unmoved mover). Frankfurt cases expose this rift but can't bridge it because they simulate determinism's constraint while insisting the agent "could have acted otherwise" is irrelevant—a move incompatibilists reject as incoherent.

  ### One-Sentence Summary:
  **This is a methodological and intuitional stalemate rooted in incompatible conceptions of control—compatibilists prioritize actual-sequence reasons-responsiveness for practical responsibility, while incompatibilists demand metaphysically open alternatives for ultimate authorship.**
