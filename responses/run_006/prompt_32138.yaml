answer: |-
  ### The View, Briefly  
  Updateless decision theory (UDT) proposes that an agent should choose the *output* of its decision procedure which maximises expected utility across all instances where that procedure is run. Crucially, it does not "update" on information (e.g., predictions about its own choice) that correlates with its decision. Instead, it treats its own action as a *logical consequence* of its algorithm. This resolves Newcomb-like problems (e.g., one-boxing in Newcomb's Paradox) by precommitting to an output that, if universally adopted by all instances of "you" across possible worlds, yields the best overall outcome. It prioritises timeless, global consistency over context-specific conditioning.

  ### Defeaters, Ranked  
  1.  **Fatal: The Specification Problem.** UDT requires defining the "class of instantiations" – what counts as "your" decision procedure being run elsewhere? Without precise boundaries, UDT is vacuously flexible. If the class is too broad (e.g., all computations vaguely similar to yours), the expected utility calculation becomes incoherent or intractable. If too narrow (only exact copies), it fails in realistic embedded agency where no two instantiations are identical. Defining "sameness" logically or metaphysically is deeply problematic and arguably undercuts UDT's foundations. *This makes UDT potentially unfalsifiable, as any awkward result could be dismissed by redefining the class.*
  2.  **Severe: Logical Uncertainty & Counterpossible Reasoning.** UDT requires evaluating hypotheticals like "What if *my* algorithm outputted differently?" But your algorithm outputting differently might be *logically impossible* given its inputs and code. Reasoning coherently about such counterpossibles and assigning probabilities under logical uncertainty is unsolved. UDT relies on a prior over logical worlds, but constructing one that avoids paradoxes (e.g., spurious correlations) and handles complex self-referential statements is a monumental, perhaps insurmountable, challenge.
  3.  **Significant: Computational Intractability.** Finding the globally optimal decision function output is computationally infeasible for any non-trivial agent. It requires simulating vast numbers of hypothetical scenarios involving your algorithm's instantiations, including potentially counterfactual ones, under logical uncertainty. This renders UDT unimplementable as a *process* for real agents, relegating it to an idealised normative benchmark rather than a practical guide.
  4.  **Awkward: The Problem of Priors.** UDT needs a prior probability distribution over the universe, including the behaviour of other agents and predictors. Where does this prior come from? Anthropic reasoning (dealing with indexical uncertainty about *which* instantiation you are) further complicates this. Awkward priors can lead to counterintuitive recommendations that seem exploitable or unstable.
  5.  **Awkward: Embedded Agency Challenges.** Real agents are embedded in the environment and can modify themselves. UDT assumes a fixed decision procedure being instantiated. How does it handle self-modification? If you change your algorithm, are you still part of the same "class"? This creates regress problems and blurs the core concept of "your" decision procedure.
  6.  **Merely Awkward: Paradox Absorption & Outsourced Decisions.** Some apparent counterexamples (e.g., the "UDT troll" or "outsourced Newcomb") can often be absorbed by carefully defining the decision class or prior. For instance, if an external oracle runs a perfect simulation of "your" decision procedure, should that count as an instantiation? A committed UDTer might bite the bullet on seemingly awkward results here, arguing they expose flawed intuitions rather than flaws in UDT.

  ### What a Committed UDTer Should Concede  
  A committed UDTer should readily concede points 1, 2, and 3 as serious, unresolved challenges. The **specification problem** is fundamental; failing to adequately define the decision class renders UDT ill-posed and potentially vacuous. The difficulties with **logical uncertainty and counterpossible reasoning** are profound technical hurdles central to UDT's operation. The **computational intractability** is undeniable and means UDT cannot be a descriptive theory of human cognition or a directly implementable algorithm for AGI in its pure form. They should also acknowledge that the **problem of priors** is messy and introduces significant arbitrariness. However, they would likely dismiss point 6 ("paradox absorption") as misunderstandings or misapplications, arguing that careful, consistent specification resolves them. They would view UDT's handling of Newcomb-like problems as strong evidence for its core insight, justifying the struggle with the other issues.

  ### Verdict  
  UDT is not so much demonstrably *false* as it is critically **underdefined** and **impractical**. The primary "defeater" is the **specification problem** – the lack of a rigorous, non-arbitrary way to define the class of instantiations for the decision procedure. This underdetermination, coupled with the immense challenges of **logical uncertainty** and **computational intractability**, means UDT remains a compelling but deeply problematic idealisation. While its core insight – refusing to update on information correlated with one's own choice – elegantly solves a class of paradoxes, its current formulations are not yet a complete, workable decision theory. Its flexibility in absorbing awkward results through redefinition is a significant weakness, undermining its falsifiability. UDT should be seen as a valuable framework highlighting the importance of logical updatelessness, but not as a finished solution. Its viability hinges on resolving the deep foundational issues it exposes, particularly concerning identity, logical probability, and embeddedness.
