  First, I need to distill Arendt’s thesis accurately: Eichmann wasn’t a fanatic or sadist but a hollow actor shielded by clichés, bureaucracy, and an inability to *think* (i.e., engage in moral imagination). The novelist then reinterprets this through character-building lenses: Eichmann’s "self-narration" is built on prefabricated phrases, his "interiority" lacks depth because language fails to connect to reality, and his "self-deception" is unconscious—he genuinely believes his own platitudes.  

