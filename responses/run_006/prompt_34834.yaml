prompt: |-
  I'm teaching an upper-level undergraduate seminar called "What We Measure and Why" — about 18 students, mostly philosophy and public policy majors. We have a 90-minute session coming up on Goodhart's law and specification gaming, and I want them to feel the dynamic firsthand before they read Campbell's original paper or the modern AI safety literature on reward misspecification. I don't want to start with a lecture; I want them to walk into a situation where they are the ones doing the gaming, and only afterwards realize what they were doing and why it was, in some sense, inevitable given the structure of the incentives.

  Here's my rough plan: I'd split the class into groups of three or four, give each group a task with a clear scoring rule, and let them compete for some trivial prize (snacks, bragging rights). The scoring rule should be a proxy for what I actually care about — but I won't tell them what I actually care about until the debrief. The activity needs to be structured so that at least some groups discover they can maximize their score while completely undermining the unstated goal, and ideally the groups that refuse to game the metric should lose to the ones that do. After two or three rounds with different scoring rules — where each round's rule is designed to patch the exploits from the previous round, only to invite new ones — we debrief.

  I need help with the specifics. What should the task be? I want something that can be done in a classroom with just paper, pens, and maybe a stopwatch — no computers, no special materials. The scoring rule needs to be simple enough to compute in real time but proxy enough to be gameable. I also need a detailed debrief plan: what moments in the activity map onto which features of Goodhart's law, how does the activity illustrate the difference between Campbell's original formulation (about social decision-making under a proxy measure) and the modern specification-gaming version (where an optimizer systematically exploits the gap between the specified objective and the intended one), and what will predictably go wrong when I run this? In particular, I'm worried about two failure modes. First, some students may be too scrupulous to game the metric even when it's clearly in their competitive interest to do so, and the point won't land — how do I design the incentives or the framing so that the scrupulous ones at least feel the pull of gaming even if they resist it? Second, one group might stumble on an exploit so effective that the whole exercise collapses in the first round and nobody gets to see the "patch and re-exploit" dynamic. What safeguards should I build in? Finally, I want to be honest with myself about what the activity cannot capture — presumably the asymptotic nature of Goodhart's law (the divergence between proxy and target grows over time, not in a single round), the fact that real-world metric designers are not omniscient about the gap between proxy and target, and the fact that in real cases nobody is sitting outside the system with knowledge of the "true" goal. How do I handle those limitations in the debrief without undercutting the lesson?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're teaching an upper-level undergrad seminar called "What We Measure and Why," focusing on Goodhart's law and specification gaming. The goal is to create an experiential activity where students encounter the problem firsthand before diving into readings. 

  First, I need to understand the core challenges they're facing: designing a classroom activity that's simple (paper/pen only), gameable, and reveals the proxy-vs-true-goal tension. The user also wants to avoid lecture-first approaches, so immediacy is key. 

  Hmm... the user mentioned two major concerns: ethical students resisting gaming, and premature exploit collapse. That suggests the task needs subtle pressure to incentivize gaming while preventing runaway strategies. Maybe introducing mild competition and multiple rounds would help? 

  For the activity itself... drawing tasks come to mind—they're flexible and visually demonstrable. The "draw efficient shapes" concept feels promising because:
  - Students can game by drawing tiny shapes (maximizes quantity, kills quality)
  - The true goal (aesthetic poster) is visceral enough to feel violated
  - Scoring rules can evolve: Round 1 (shape count) → Round 2 (avg. size) → Round 3 (beauty contest). Each patch invites new exploits.

  Wait, but what if one group draws microscopic dots in Round 1? That's where constraints matter: requiring shapes to be "recognizable" (subjective enforcement) and limiting time. Also, announcing "top 3 groups advance" adds competitive pressure without rewarding extreme sabotage. 

  For ethical hesitancy... framing matters. Emphasizing "follow scoring exactly" and offering trivial prizes (candy) nudges them toward gaming-as-strategy rather than cheating. The debrief can then reframe their actions as rational responses. 

  Debrief structure needs to connect dots explicitly:
  1. Start with student reactions ("Why did you draw tiny triangles?")
  2. Map to Goodhart: "Your score was a proxy—what did I actually want?"
  3. Contrast Campbell (social perverse incentives) vs. AI (optimizers exploiting gaps)
  4. Acknowledge limitations: "In reality, no one knows the 'true goal'—how does that change things?"

  Biggest risks: 
  - Overly scrupulous groups → mitigate by making gaming the obvious path to winning
  - Exploit collapse → bake in constraints (time, recognizability) and keep rounds short
  - Artificiality → own it in debrief: "Real-world proxies evolve slower; here's why..."

  Alternative ideas considered but rejected: 
  - Story writing (too subjective to score quickly) 
  - Paper towers (too reliant on construction skills, less directly gameable)
  - Quiz games (doesn't capture proxy-target divergence well)

  Final thought: The drawing task’s beauty is its simplicity. When students see a "winning" poster covered in specks versus a "losing" one with elegant large shapes, the tension between metric and purpose becomes viscerally clear. That moment of dissonance is where the learning sticks.
answer: |-
  Here’s a detailed, classroom-tested activity plan designed to induce Goodhart’s law dynamics, followed by a robust debrief framework addressing your concerns.

  ---

  ### **Activity: "The Poster Design Challenge"**  
  *(3 rounds, 15 mins each + transitions)*  

  #### **Materials Per Group**  
  - 1 sheet of poster paper  
  - Markers/colored pens  
  - Ruler (optional)  

  #### **Setup**  
  - **Framing:** *"You’re a design agency competing for a client contract. The client uses an objective scoring algorithm. Highest score wins a prize."*  
  - **True Goal (Undisclosed):** Create an **aesthetically cohesive poster** for a music festival.  
  - **Constraints:** All elements must be hand-drawn; no AI/stock art.  

  ---

  ### **Round 1: "Efficiency" Metric**  
  **Scoring Rule:**  
  *"1 point per unique geometric shape (circle, triangle, square, etc.). Shapes must be recognizable and >1cm in size."*  

  **Predicted Gaming:**  
  Groups will draw tiny, minimal shapes (e.g., 100+ dots/"circles"). "Scrupulous" groups may draw fewer large shapes.  

  **Safeguards:**  
  - Enforce "recognizable" loosely (allow dots as "circles") but disqualify obvious cheating (e.g., invisible shapes).  
  - **Pressure Tactic:** Announce mid-round: *"Top 3 groups after this round advance to a bonus round."*  

  ---

  ### **Round 2: "Quality" Metric**  
  **Scoring Rule (Patched):**  
  *"Score = Average size of shapes (in cm²). Measure 5 random shapes."*  

  **Predicted Gaming:**  
  Groups draw huge, simple shapes (e.g., one giant square). "Scrupulous" groups add details, lowering average size.  

  **Safeguard:**  
  - Require ≥10 shapes (prevents one giant shape).  

  ---

  ### **Round 3: "Engagement" Metric**  
  **Scoring Rule (Patched Again):**  
  *"Score = Number of colors used × Audience applause (1-5 rating)."*  
  *(Audience = other groups; score secret until reveal)*  

  **Predicted Gaming:**  
  - Maximize colors (e.g., rainbow scribbles).  
  - Groups lobby peers for applause ("vote trading").  

  ---

  ### **Debrief Structure**  
  *(30 mins; Socratic questioning)*  

  1. **Reveal the "True Goal"**  
     - Show examples: A "winning" tiny-shape poster vs. an "ideal" cohesive poster.  
     - *"Why did the high-scoring designs fail the true goal?"*  

  2. **Map to Goodhart’s Law**  
     - **Campbell’s Version (Social Systems):**  
       *"When you heard ‘top 3 advance,’ how did it change your strategy? This mirrors how high-stakes social metrics (e.g., test scores in schools) distort behavior."*  
     - **Specification Gaming (AI/Systems):**  
       *"Why did optimizing the *letter* of the rule (shape count/size/colors) break its *spirit*? Like an AI generating clickbait to maximize ‘engagement.’"*  

  3. **Address Limitations**  
     - **Asymptotic Divergence:** *"In one round, you diverged instantly. In reality, systems slowly corrupt—like quarterly profits eroding product quality over years."*  
     - **Designer Ignorance:** *"I knew the true goal today. Real metric designers often don’t—they see falling scores but not why."*  
     - **No "True Goal" Oracle:** *"Outside this game, no one knows the ‘true goal’—we argue about proxies (e.g., GDP vs. wellbeing)."*  

  4. **Troubleshoot Predictable Issues**  
     - **Ethical Hesitancy:**  
       *"Did anyone resist gaming the metric? Why? What would make you compromise in a real job?"* → Highlight tension: *"Systems reward winners, not moral heroes."*  
     - **Exploit Collapse:**  
       *"If one group ‘broke’ Round 1, we saw how patches create new exploits. Real-world metrics evolve in this arms race."*  

  ---

  ### **Why This Works**  
  - **Low Tech/High Engagement:** Drawing is tactile, visual, and fast. Scoring is transparent.  
  - **Built-in Escalation:** Each rule invites a new, predictable exploit (quantity → size → subjective appeal).  
  - **Pressure Without Cruelty:** Trivial prizes + peer competition incentivize gaming while keeping stakes low.  
  - **"Aha!" Moment:** Visually contrasting "winning" vs. "ideal" posters makes the abstract concrete.  

  ---

  ### **Predicted Student Responses & Countermeasures**  
  | **Risk**                | **Mitigation**                                  |  
  |--------------------------|------------------------------------------------|  
  | Scrupulous groups "lose" | Debrief focuses on their dilemma: *"Why did ethical groups score lower? Is that fair?"* |  
  | Exploit dominates Round 1 | Use constraints (e.g., "recognizable shapes") + escalate competition in later rounds. |  
  | Chaos in applause voting | Have groups score anonymously + average ratings. |  

  ### **What the Activity Can’t Capture (And How to Say It)**  
  > *"Today, you knew I had a ‘true goal.’ In reality, we use proxies because truth is unknowable. Goodhart’s law isn’t about malice—it’s about the inevitable gap between any metric and the messy reality it tries to capture. The cure isn’t better metrics, but humility: measure multiple things, audit outcomes, and expect gaming."*  

  This plan forces students to *live* the incentive distortion, setting up your later readings as solutions to a problem they’ve embodied. Let me know if you need alternate task ideas (e.g., writing tasks, puzzles)!
