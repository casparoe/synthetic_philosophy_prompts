  I've taught Grice for years and I keep coming back to the Clinton moment in the Paula Jones deposition, and I want a proper analysis of it through Grice's account of speaker meaning and implicature — not the usual joke about lawyers and the word "is." You know the facts, but let me set them out so we're working from the same page: in his deposition, Clinton was asked whether an earlier sworn denial of a sexual relationship with Monica Lewinsky was false, and he answered that it depended on what "is" means; he later explained that he meant "is" in the present tense, so the denial was true at the moment he made it. I want a careful mapping, not the standard story. On a Gricean picture, what is said versus what is conversationally implicated in that exchange — what were the maxims doing for each party, and where does the cooperative assumption break down because an adversarial deposition is not a cooperative conversation? How does the speaker-meaning/sentence-meaning distinction handle Clinton's defense: is he claiming he never speaker-meant what the questioner took him to mean, or is he doing something else? Then run it the other direction: what does this episode show about the Gricean framework? Does it expose a real limitation — say, that Grice has no good account of adversarial speech or of strategic redefinition under oath — or does the machinery actually handle it fine and the scandal is just people refusing to accept that language works this way? I want your bottom line in the very first sentence, then the reasoning, no preamble and dont restate the question.
