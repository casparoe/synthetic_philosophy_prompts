  4. **Contextual Nature**: Demarcation depends on the specific field and historical context. 

  The status argument is strong, but ignoring the conceptual side oversimplifies. A hybrid approach might be better: demarcation as both conceptual and sociological. The term "science" has normative weight, so defining it involves both epistemic criteria and social authority. 

