  We are designing a 90-minute session for 12 software engineers to experience the subject-summing problem of panpsychism. The goal is to have them try to build a macro-subject from micro-subjects and encounter the problem firsthand. We want to highlight:
  1. The difficulty in aggregating subjects/points of view vs. aggregating physical properties.
  2. The temptation to invent a "bonding relation" as a solution and its costs.
  3. The distinction between constitutive (macro-subject is made of micro-subjects) and emergent (macro-subject is something over and above) views.

  Constraints: Use index cards, whiteboards, conference room setup. No lecture longer than 10 minutes. Include rules, roles, timeline, and debrief that maps the activity to concepts without lecturing.

  Activity Design: "The Subject Composition Game"

  Premise: Participants will form small groups (micro-subjects) and then try to combine into a single group (macro-subject) that has a unified point of view. The challenge is that each micro-subject has its own private experience (represented by a simple sensory input) and they must create a unified experience for the macro-subject.

  Materials:
  - Index cards (for each micro-subject and for the macro-subject)
  - Pens
  - Whiteboard for recording observations and concepts

  Roles:
  - Facilitator (you)
  - 12 participants divided into 3 groups of 4 (each group is a micro-subject). Each group has:
     - A "Sensor" (who receives a private sensory input)
     - A "Processor" (who interprets the input)
     - A "Reporter" (who communicates with the outside)
     - A "Monitor" (who observes the group's process and takes notes on how the group forms its point of view)

  Alternatively, to keep it simpler and ensure everyone is engaged, we can have each group of 4 function as a micro-subject and collectively decide on their point of view. Then we assign one member as the representative to communicate with the macro level.

  However, we want each micro-subject to have a point of view that is private to the group. So:

  Revised Roles per Micro-Subject Group (4 people):
  - The group is given a private sensory input (e.g., a word or a simple image) that only they know. They must form a "point of view" about that input (e.g., an emotional reaction, a simple judgment). They record this on an index card and keep it private.

  Then, the groups are to combine to form one macro-subject. Each group sends one representative to the macro-group (so 3 representatives for 3 micro-subjects). The macro-group must form a unified point of view that incorporates all three micro points of view.

  But note: the problem is that the representatives are still representing the micro-group's point of view, not being the micro-group's point of view. So we need to design it so that the micro-group's point of view is private and cannot be fully communicated.

  Alternative Idea: Use a game of telephone or Chinese whispers, but that might not capture the private point of view.

  Better Idea: Each micro-subject group is given a unique sensory input that they experience together (e.g., a color, a sound, a smell described on a card). They then have to form a joint reaction to it (e.g., "this is calming", "this is alarming"). This becomes their group's private point of view. Then, when forming the macro-subject, they are not allowed to directly reveal their input or their entire point of view. Instead, they can only send a limited message (like a summary or a code) to the macro level. The macro level then has to form a unified point of view from these messages.

  But that might not force the issue of combining points of view. We want them to feel that even if they could communicate everything, the points of view are separate and combining them doesn't yield a single point of view.

  Another Idea: The macro-group is supposed to experience the world as one. So we might give the macro-group a new input and ask them to form a point of view about it, but they must do so by incorporating the points of view of the micro-groups. But then the micro-groups are not experiencing the new input.

  We want the macro-group to have a unified experience of the same inputs that the micro-groups experienced, but now as one.

  Proposed Activity Flow:

  1. Introduction (5 minutes): Explain that we are going to simulate a theory of mind where every entity has a point of view. We are going to try to build a larger mind from smaller ones. No philosophy terms yet.

  2. Setup (10 minutes):
     - Divide into 3 groups of 4 (micro-subjects). Each group is given:
          - A private sensory input card (e.g., Group 1: "You see a red rose", Group 2: "You hear a loud bang", Group 3: "You smell coffee").
          - They must form a joint point of view about that input. This is a simple statement of how they, as a group, experience it. Example: Group 1: "This is beautiful and calming", Group 2: "This is startling and scary", Group 3: "This is inviting and energizing".
          - They write their group's point of view on an index card and keep it private (only the group knows).

  3. The Combination Phase (30 minutes):
     - Now, we want to form a macro-subject that has a unified point of view of all three inputs. But note: the macro-subject is supposed to be a single subject, so it should have one experience of the whole scene (the rose, the bang, the coffee) as if it were one entity experiencing all at once.
     - Each group sends one representative to a new group (the macro-group). The representatives are not allowed to bring any written notes. They can only use their memory and must try to form a unified point of view for the macro-subject.
     - The macro-group is given the task: "Form a single, unified point of view that encompasses the experiences of the three micro-subjects. This should not be just a list of the three points of view, but a single, coherent experience of the entire scenario (the rose, the bang, the coffee) as if one subject experienced it all at once."

  4. Struggle and Realization (15 minutes):
     - The macro-group will likely try to merge the experiences, but they will run into problems. For example, they might create a narrative ("First I saw a rose, then heard a bang, then smelled coffee") but that is not simultaneous. Or they might try to average or combine the emotions, which will feel forced.
     - The facilitator circulates and asks probing questions: "Is this a single experience? Or is it three experiences in one mind? How does the macro-subject feel about the whole scene at once?"
     - Allow them to struggle. They might come up with a bonding relation: "Let's say that the macro-subject has a new relation that binds these together." But then ask: "What is that relation? How does it work?"

  5. Debrief (30 minutes):
     - Groups report: Each micro-group shares their original point of view. The macro-group shares their unified point of view and the process they went through.
     - Facilitator writes on the whiteboard:
          - What was hard?
          - What solutions did you try?
          - Did anyone think of a "bonding" idea? What was it?
     - Then, without using jargon, the facilitator draws parallels to the philosophical problem (5 minutes):
          - "In our activity, we tried to build a big subject (the macro-group) from smaller subjects (the micro-groups). We saw that just having the representatives come together didn't automatically give us a single, unified point of view. We could list the experiences, but that's not the same as one experience. This is the subject-summing problem."
          - "Some of you might have thought of a special way to 'glue' the experiences together. That's like the phenomenal bonding relation. But we couldn't really define how that glue works. It's a theoretical move that might solve the problem, but it leaves us with a mystery: what is that relation?"
          - "Notice that in the activity, we tried two approaches: one where the macro-group is just the sum of the micro-groups (constitutive) and one where the macro-group has a new, emergent experience that isn't just the parts (emergent). We saw that the constitutive approach didn't give us a unified point of view, and the emergent approach required something new to come into existence. But how does that happen?"
     - Then, introduce the terms and map them (5 minutes):
          - Constitutive panpsychism: the macro-subject is literally made of the micro-subjects and their points of view. Our activity showed that just putting them together doesn't unify the point of view.
          - Emergentism: the macro-subject has a new point of view that emerges from the micro-subjects, but it's not just the sum. We tried to do that, but we had to invent a new way of bonding or a new level of experience.
          - Subject-summing: the problem of adding up points of view.
          - Phenomenal bonding: the idea of a special relation that glues experiences together, which we might have tried to invent.

  6. Predictable Problems:
     - The representatives might just list the three experiences without unifying them. That's okay because it shows the problem.
     - The macro-group might create a unified experience that feels artificial (e.g., "I feel confused by all these inputs"). That's actually good because it shows that the unified experience isn't the same as the parts.
     - Some groups might not understand the task. The facilitator must be clear: the macro-subject should have one experience of the whole scene at once, not sequentially.

  7. What the Activity Can't Capture:
     - In reality, micro-subjects (if they exist) are not little groups of people but fundamental entities. Our activity uses groups of people who already have complex minds, so it's an analogy.
     - In the actual combination problem, the micro-subjects are supposed to be the fundamental constituents of reality, and the macro-subject is supposed to be constituted by them. Our activity might leave the impression that the macro-subject is just a new entity that reads reports from the micro-subjects, which is not the intended constitutive relation.
     - The activity doesn't capture the ineffability of subjective experience. Our points of view were expressed in words, but real phenomenal experience might be ineffable.

  Adjustment to better capture the problem:

  We want to avoid the representatives being mere messengers. Instead, we want the entire macro-group to be the macro-subject, but they are composed of the micro-groups. But that's hard to do physically.

  Alternative: Have the micro-groups remain intact and the macro-group is formed by all 12, but that is too big and unwieldy.

  Revised Setup for Combination Phase:

  Instead of sending representatives, we restructure the entire group of 12 into one macro-group. But then we lose the micro-groups. We want the micro-groups to remain as distinct points of view.

  We can do a two-tiered approach:

  - The micro-groups are in the room, each having their own private experience (written on a card and hidden). They are not allowed to communicate their experience to anyone else.

  - Then, the entire room (all 12) is the macro-subject. We ask: what is the unified point of view of the macro-subject? How does it experience the three inputs simultaneously?

  But then how do they form a unified point of view? They can't share the private experiences. So the macro-subject doesn't have access to the micro-experiences? That's not the intended constitutive relation.

  We want the macro-subject to be constituted by the micro-subjects, so the micro-experiences are the building blocks.

  So perhaps we allow the micro-groups to reveal their experiences to the macro-group. But then the macro-group (all 12) knows the three experiences. Then we ask them to form a unified point of view of the whole. They might do it by having a group discussion and forming a consensus.

  But that might work too well? Not necessarily: they might form a consensus statement, but that is a new, higher-level judgment, not the original experiences unified.

  We want them to feel that even with all the information, the unified experience isn't just the three experiences sitting next to each other. They are still three separate experiences. The macro-subject has a point of view that includes all three, but that point of view is a new one.

  This is the emergent part. So if they form a consensus, that is emergent.

  But we also want them to try the constitutive approach and fail. How?

  Let me reframe:

  The activity must force the participants to confront that the micro-points of view are private and cannot be merged. So:

  - Each micro-group has a private experience (they see a color, hear a sound, etc.) and they form a point of view about it. They do not write it down, but they remember it.

  - The macro-group (all 12) is told: "You are now one subject. You have experienced all three inputs (the color, the sound, the smell) at the same time. What is your experience of this whole scene?" But the members of the macro-group only know their own micro-experience. They don't know the others.

  So when they try to form the macro-experience, they might say: "I (as the macro-subject) see the color, hear the sound, and smell the smell." But that doesn't say what the experience is like. They haven't formed a unified point of view.

  Then we ask: "But what is it like for you, the macro-subject, to have these three experiences at once? Is it chaotic? Is it a new experience? How do they combine?"

  They might try to describe a combined experience, but then we point out: that's a new description, not the original experiences just sitting together.

  This might work.

  Proposed Revised Activity:

  1. Setup (10 min):
     - Divide into 3 micro-groups of 4. Each group is assigned a private experience (e.g., Group 1: visual - seeing a bright red; Group 2: auditory - hearing a high-pitched sound; Group 3: olfactory - smelling burnt toast). They discuss and agree on what it's like for them as a group to have that experience. They do not write it down. They must remember it and not share it with others.

  2. Macro-Subject Formation (20 min):
     - Reorganize into one group of 12. Explain: "Now, you are one subject. You have just experienced all three of these sensations at the same moment. What is it like for you, as this one subject, to have this whole experience? Discuss and come up with a single statement of your unified point of view of the entire experience (red, sound, smell)."
     - Rules: They cannot reveal the specific sensory inputs of the micro-groups to the whole group. They can only talk about the experience in terms of how it feels. Why? Because we want to simulate that the micro-experiences are the building blocks, but they are private. However, this might be too restrictive.

  Alternatively, we allow them to reveal the inputs because in constitutive panpsychism, the macro-subject has the micro-experiences as parts. But then they might just list them.

  So let's allow them to reveal the inputs. But then we stress: the macro-subject has one experience of all three at once. They must describe that one experience.

  3. Report (5 min): They write their unified statement on the whiteboard.

  4. Reveal (5 min): The micro-groups reveal what their experience was like.

  5. Compare (10 min): Compare the unified statement to the micro-experiences. Is the unified statement just the three experiences listed? If so, then it's not unified. If they created a new experience (e.g., "I feel overwhelmed by the dissonance"), then that's emergent.

  6. Debrief (30 min): As before.

  This might work better.

  Final Activity Structure:

  Total: 90 minutes

  - Intro (5 min): "We are going to explore how individual experiences might combine to form a unified experience. We'll work in groups."
  - Setup micro-groups (10 min): Form 3 groups. Give each a private sensory input (on a card). They discuss and agree on a statement of what it's like for them to have that experience. They keep it private.
  - Macro-formation (20 min): Bring everyone together. Explain: "Now imagine you are one being that is having all three of these experiences at the same time. You are not three beings in one room, but one being with one unified experience. Discuss and write a single statement that captures what it's like for this one being to have the entire experience of all three sensations simultaneously."
  - Report (5 min): Write the unified statement on the board.
  - Reveal (5 min): Each micro-group reveals their input and their experience statement.
  - Discussion (15 min): 
     - How did the macro-statement come about? 
     - Is it just the three experiences? 
     - How did you try to unify them? 
     - Did you feel like you had to create something new?
  - Facilitator debrief (20 min): 
     - Draw parallels to the subject-summing problem (without jargon at first). 
     - Then introduce the terms: subject-summing, constitutive, emergent, phenomenal bonding. 
     - Explain that the activity shows that simply having the parts doesn't automatically unify them, and that we are tempted to posit a new relation or an emergent property.

  Predictable Problems:
  - The groups might not take the privacy seriously and share their inputs freely. Emphasize: "The experiences are private to your group until the reveal."
  - The unified statement might be too vague. That's okay because it shows the difficulty.
  - The macro-group might not understand the simultaneity. Emphasize: "You are experiencing all three at the same time, as one subject."

  What the Activity Can't Capture:
  - The actual ineffability and intrinsic nature of experience.
  - The fundamental level of micro-subjects (we used groups of people).
  - The metaphysical grounding of the bonding relation.

  But it should make them feel the problem and the temptation to posit bonding or emergence.
answer: |-
  ### **Session Plan: "The Subject Composition Challenge"**  
  **Goal:** Make engineers *feel* the subject-summing problem by trying to "compose" a unified point of view from micro-subjects.  
  **Concepts Covered:** Subject-summing problem, constitutive vs. emergent views, phenomenal bonding.  
  **Time:** 90 minutes  
  **Participants:** 12 software engineers  
  **Materials:** Index cards (30+), pens, whiteboard, timer.  

  ---

  ### **Rules & Roles**  
  **Prep (5 min):**  
  - Write these prompts on the whiteboard (hidden until debrief):  
    > **Constitutive View:** "The macro-subject is *made of* micro-subjects (like legos)."  
    > **Emergent View:** "The macro-subject is something *new* (like water vs. H₂O)."  
    > **Phenomenal Bonding:** "A special ‘glue’ that combines micro-subjects."  
  - Hand out index cards (3 per group + extras).  

  **Groups:**  
  - Divide into 3 micro-subject groups (4 people each).  
  - **Roles per group:**  
    - **Sensory Agent (2 people):** Receive a private "experience" (via card).  
    - **Interpreter (1 person):** Translate the experience into a "point of view."  
    - **Reporter (1 person):** Communicate with the macro-group.  

  ---

  ### **Timeline**  
  #### **Phase 1: Micro-Subject Creation (15 min)**  
  - **Goal:** Each group forms a private "point of view."  
  - **Steps:**  
    1. **Sensory Input:** Give each group a sealed index card with a unique "experience":  
       - Group 1: "You feel a sharp pain in your hand."  
       - Group 2: "You see a bright red apple."  
       - Group 3: "You hear a loud scream."  
    2. **Form Point of View:**  
       - Sensory Agents describe the experience *only to their group*.  
       - Interpreter writes the group’s "point of view" on a new card (e.g., "Pain: alarming and urgent," "Apple: vivid and tempting," "Scream: jarring and chaotic").  
    3. **Privacy Rule:** No sharing outside the group. Reporters memorize their POV.  

  #### **Phase 2: Macro-Subject Composition (25 min)**  
  - **Goal:** Combine micro-groups into one macro-subject with a *unified* point of view.  
  - **Rules:**  
    - Reporters form a "macro-group" (3 people).  
    - Macro-group must create **one unified POV card** for the "macro-subject" experiencing *all three inputs at once*.  
    - **Constraints:**  
      - No describing raw inputs (e.g., "pain," "apple," "scream"). Only use the *interpreted POVs* (e.g., "alarming," "tempting").  
      - The unified POV must be **a single, coherent experience** (e.g., not "alarming + tempting + jarring").  
  - **Process:**  
    - Macro-group negotiates while others observe.  
    - Interrupt at 15 min: *"How does the macro-subject experience this as ONE point of view? Not three in a room, but one mind."*  

  #### **Phase 3: Group Reflection (15 min)**  
  - **Guided Discussion:**  
    - Macro-group shares their unified POV card.  
    - Ask:  
      1. "What was hardest about combining POVs?"  
      2. "Did you try to invent a ‘glue’? What was it?"  
      3. "Does the macro-subject feel like a *new* thing or just the parts?"  
  - Write responses on whiteboard.  

  #### **Phase 4: Debrief & Concept Mapping (25 min)**  
  - **Step 1: Reveal Hidden Whiteboard Prompts (5 min)**  
    - Show: Constitutive, Emergent, Phenomenal Bonding.  
  - **Step 2: Map Activity to Concepts (10 min)**  
    - **Subject-Summing:** "You tried to ‘sum’ POVs like summing mass. Why did it fail?" → *Points of view aren’t additive; they’re private and qualitative.*  
    - **Phenomenal Bonding:** "Did you invent a ‘glue’ (e.g., ‘a story linking experiences’)? That’s bonding! But what *is* the glue? We can name it, but not explain it." → *It’s a real theoretical move, but it doesn’t solve the mystery.*  
    - **Constitutive vs. Emergent:**  
      - Constitutive: "Unified POV was just parts (e.g., list of adjectives). Did that feel like *one* subject?"  
      - Emergent: "If you created something new (e.g., ‘a sense of dread’), that’s emergent! But where did it come from?"  
  - **Step 3: Engineer’s Lens (5 min):**  
    - "In code, composing objects is easy because interfaces hide implementation. But a POV *is* the implementation. You can’t abstract it away."  

  ---

  ### **Predicted Problems & Mitigations**  
  1. **Macro-group defaults to listing parts:**  
     - *Why:* Engineers treat POVs like data.  
     - *Mitigation:* Enforce the "no raw inputs" rule. Interrupt: "Is this one experience or three?"  

  2. **Bonding feels like cheating:**  
     - *Why:* Groups invent ad-hoc solutions (e.g., "a story").  
     - *Mitigation:* In debrief, validate: "You invented bonding because you hit a wall. That’s what philosophers do too!"  

  3. **Confusion between POV and input:**  
     - *Why:* Sensory inputs are objective; POVs are subjective.  
     - *Mitigation:* Clarify roles: "Interpreters turn inputs into feelings."  

  ---

  ### **What the Activity CAN’T Capture (Supply This Yourself)**  
  - **The Hard Problem of Consciousness:**  
    - Activity uses *descriptions* of POVs (language), but real phenomenality is ineffable. Say: *"In the game, you described POVs with words. But actual subjective experience (e.g., ‘what red feels like’) can’t be fully communicated—even to other micro-subjects. That’s why summing is weirder than summing charge."*  
  - **Micro-Subjects as Fundamental:**  
    - Activity uses groups as "micro-subjects," but in panpsychism, they’re atomic (e.g., particles). Say: *"Real micro-subjects aren’t mini-minds with language. They’re simpler, which makes bonding even harder to define."*  

  ---

  ### **Why This Works**  
  - **Engineers "Feel" the Wall:** Forcing composition of POVs (not data) mirrors the subject-summing failure. The bonding move arises organically.  
  - **Debrief Avoids Lecture:** Concepts map to their struggles (e.g., "Remember when you invented glue? That’s bonding!").  
  - **Leverages Tech Thinking:** Contrasts physical composition (easy) vs. subjective composition (impossible).  

  **Run it, and watch them slam into the hard problem!**
