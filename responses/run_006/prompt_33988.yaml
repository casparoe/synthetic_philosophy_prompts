prompt: |-
  I've been going back and forth on this and I'd like a careful comparision. There's this debate about whether DNA is literally a code — in the sense of carrying semantic information with a sender and receiver — or whether "code" is just a metaphor we've gotten too comfortable with. On one side you have people who say yes, the genetic code is a real code: codons map to amino acids via rules that are arbitrary (in the Saussurean sense), there's a kind of translation machinery, and the whole thing has the structure of a symbolic system. On the other side you have people who say this is all backwards: DNA is just chemistry, causal regularities, and calling it a "code" smuggles in intentionality where there is none — the ribosome isn't "reading" anything, it's just doing physics.

  I want you to compare these two positions. What's the strongest version of each? Where do they actually disagree, and where are they just talking past each other? And what's at stake — if we decide one way or the other, does anything in biology or philosophy actually change?

  Also: tell me what would change your mind about your own assessment. Which argument on the losing side gives you the most trouble, and if it were developed further, what would it need to show to flip your verdict?
