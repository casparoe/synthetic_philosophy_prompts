  2. Newtonian mechanics posits absolute space and time as the background for defining true acceleration and inertial motion, independent of the presence of matter.
  3. General Relativity (GR) models spacetime as a unified, dynamic 4-dimensional manifold described by a metric tensor field; the distribution of matter/energy determines the metric's curvature via Einstein's equations.
  4. GR is empirically adequate: within its domain, no observation contradicts its predictions regarding spacetime structure, gravity, and motion.
  5. Models differing *only* by a global spatial shift, rotation, or temporal translation (Leibniz shifts) in the arrangement of all matter/energy and fields predict identical observable outcomes in both Newtonian physics and GR.

