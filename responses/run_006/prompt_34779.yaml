prompt: |-
  Patent law and copyright law are both branches of intellectual property, and they both grant exclusive rights to creators. But they treat independent creation in opposite ways. If I write a song in my basement, having never heard your song, and the two turn out to be melodically identical, I have a complete defense to copyright infringement: independent creation breaks the chain of liability. If I instead invent a machine in my garage, having never seen your patent, and the machine turns out to embody every element of your patent claim, I am still liable for infringement. Independent invention is simply no defense in patent law. The two regimes share a family resemblance yet diverge on this core principle.

  What theory of the ownership of ideas—or of the justification for intellectual property—does each of these two practices presuppose? Are they presupposing rival theories (say, a Lockean labor-desert theory for copyright and a utilitarian incentive theory for patent), or can both practices be justified within a single coherent framework? If there is a single framework, what feature of the subject matter (expression versus invention) does the work of generating the different rules? And if the two practices do rest on different philosophical foundations, is that a stable division, or does it create pressure to revise one of the doctrines?

  Reconstruct the implicit theory or theories as precisely as you can. Distinguish what each practice strictly presupposes from what it merely fits well with, and flag where the practice is philosophically underdetermined. After the essay, provide a structured summary as a JSON object with the following fields:

  - `"patent_presuppositions"`: an array of strings, each naming one philosophical commitment that the no-independent-invention rule in patent law presupposes.
  - `"copyright_presuppositions"`: an array of strings, each naming one philosophical commitment that the independent-creation defense in copyright law presupposes.
  - `"shared_commitments"`: an array of strings naming any commitments the two practices share.
  - `"points_of_tension"`: an array of strings naming places where the two practices' presuppositions conflict or pull in different directions.
  - `"underdetermined_by"`: an array of strings naming aspects of the practice that are compatible with multiple philosophical theories and so do not force a single view.
  - `"revision_pressure"`: a string, either `"patent"`, `"copyright"`, `"neither"`, or `"both"`, indicating which doctrine would face pressure to change if we forced the two regimes onto a single philosophical foundation, with a one-sentence explanation.
