  *Justification:* Empirical linguistics (e.g., quantifier flexibility in natural language) and metaontological arguments (e.g., Hirsch's cases) strongly suggest divergent semantic conventions for "exists" or "object" explain the dispute.

  ### (c) Probability of substantive disagreement remaining after full disambiguation  
