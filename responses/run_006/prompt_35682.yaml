answer: |-
  Here’s a precise taxonomy of claims under "More is Different" (MoD), tailored for your context:

  **1. Trivial Scale Effects**  
  *Claim:* Systems with many components become computationally intractable to simulate from fundamental physics alone.  
  *Supported by physics?* Yes (e.g., n-body problem).  
  *Philosophical status:* Platitude about complexity, not anti-reductionist.  
  *Blocks greedy reductionism?* No. Only a practical limitation; reduction remains *in principle* possible.

  **2. Ontological Emergence**  
  *Claim:* New, irreducible properties *causally* emerge at higher scales (e.g., superconductivity from quantum mechanics).  
  *Supported by physics?* Partially. Phenomena like broken symmetry (Anderson’s focus) or phase transitions show novel behaviour not deducible *solely* from micro-dynamics without collective constraints.  
  *Philosophical status:* Substantive thesis in philosophy of science.  
  *Blocks greedy reductionism?* **Yes**, if reduction requires deducing *all* macro-properties from micro-laws alone. Requires "downward causation" or novel causal powers at higher levels.

  **3. Strong (Metaphysical) Emergence**  
  *Claim:* Emergent properties (e.g., consciousness) are fundamentally novel, not determined by, or ontologically dependent on, micro-physics.  
  *Supported by physics?* No. Physics assumes micro-dynamics determine macro-states.  
  *Philosophical status:* Radical philosophical claim (e.g., some property dualism).  
  *Blocks greedy reductionism?* **Yes**, categorically. Rejects physicalism’s core tenet.

  **4. Epistemological Emergence**  
  *Claim:* Higher-level sciences (chemistry, biology) require autonomous concepts/laws because micro-physical descriptions are explanatorily inadequate or unworkable.  
  *Supported by physics?* Yes, pragmatically (e.g., thermodynamics >> statistical mechanics).  
  *Philosophical status:* Substantive but moderate thesis (cf. Dennett’s "real patterns").  
  *Blocks greedy reductionism?* **Yes**, if "greedy" insists *only* micro-explanations are valid. Supports explanatory pluralism without denying ontological reducibility.

  **Which blocks Dennett’s "greedy reductionism"?**  
  - Dennett critiques reductionism that dismisses higher-level explanations as *merely* illusory or heuristic.  
  - MoD blocks this **only when asserting (2) or (4)**.  
    - **(2)**: If novel causal powers emerge, micro-explanations are incomplete.  
    - **(4)**: If macro-concepts are indispensable for explanation, discarding them is unscientific.  
  - **(1)** is irrelevant to greediness; **(3)** is scientifically unsupported.

  **In your reading group:**  
  When "MoD" halts discussion, ask: *"Which claim? Scale complexity? Ontological novelty? Explanatory indispensability?"* Only (2) and (4) offer scientifically grounded challenges to greedy reductionism. Anderson’s original argument blends (1) and (2), using condensed matter physics to show why reductionism requires more than just micro-laws—it needs emergent constraints. This directly counters the idea that physics "contains" chemistry trivially.
