prompt: |-
  I retired from a career in physical chemistry a few years back and have been reading my way into philosophy of science — currently working through Dennett on cranes and skyhooks and the whole greedy reductionism business. One thing keeps happening: whenever I try to pin down whether, say, chemistry genuinely reduces to physics or whether a mental state just is a brain state, someone in my reading group says 'more is different' and the conversation just stops, as if that one line settles it. I gather the phrase has a life of its own now, but I honestly cant tell what precise claim is being asserted when people deploy it — it seems to do different work in different arguments. Could you lay out the distinct precise claims 'more is different' might be making, from the trivial to the radical, and say for each whether it's actually supported by the physics, whether it's a substantive philosophical thesis or a platitude, and — crucially — which of them would actually block a reductionist explanation of the sort Dennett calls greedy? I want it as a menu I can bring to my reading group. Keep it to 600 words maximum, and in British English please.
