  I'm a software engineer, not a philosopher, but I've gone down a rabbit hole on deflationary theories of truth — the idea that 'is true' doesn't pick out a real property, it's more like a syntactic device. The four versions I keep bumping into are: the redundancy theory ('it is true that p' just collapses to p), disquotationalism ('p' is true iff p, where the predicate is mainly there to undo quotation), minimalism (all there is to truth is the non-weird instances of the equivalence schema), and the prosentential theory ('is true' works like a pronoun standing in for a sentence). Here's what I can't get a clean answer on. I care about self-reference because in my world a language that lets you say 'this statement is not true' is like a program that segfaults: wether you restrict the language or patch around the crash, something has to give. Please rank those four views by how well you'd expect each to survive the liar paradox without ad hoc patches, give each a score from 0 to 10, and a sentence or two on why it lands there. If you think the whole scoring setup already assumes something a deflationist would reject, say so first, then rank them anyway.
