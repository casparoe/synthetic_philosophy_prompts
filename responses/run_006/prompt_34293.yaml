prompt: |-
  My psychology teacher summarized evolutionary psychology like this: "The central claim is that the human mind is a collection of specialized modules that evolved to solve the specific problems our ancestors faced in the Pleistocene. To explain any given behavior, evolutionary psychologists simply identify what adaptive function it might have served—for example, men's preference for younger partners gets explained as a strategy for maximizing reproductive success on the savanna. The problem is that these explanations are untestable: we can't run experiments on ancestral humans, so there's no way to check whether the story is true. Gould and Lewontin called this approach 'just-so stories,' and that's basically what it is. It's not real science—it's speculation dressed up in evolutionary language."

  I'm skeptical of how neat this sounds, but I don't know the field well enough to pinpoint what's wrong. Give me a committed answer: which parts of this summary would a defender of evolutionary psychology accept, which are misrepresentations, and does the verdict that it's pseudoscience follow from the accurate parts? Lead with your bottom line in the first sentence and then walk me through the reasoning—no preamble, no restating the question.
reasoning: |-
  Okay, the user's psychology teacher summarized evolutionary psychology as claiming the mind is made of specialized modules evolved for Pleistocene problems, with explanations being untestable "just-so stories" that aren't real science. The user is skeptical but can't pinpoint the issues. They want a committed answer on what parts are accurate, misrepresented, and if it's pseudoscience.

  First, I need to recall the core tenets of evolutionary psychology. Yes, EP posits that the mind has evolved modules adapted to ancestral environments. But it's not just about the Pleistocene; modern adaptations are considered too. The teacher's summary oversimplifies by implying every behavior is explained solely by Pleistocene adaptations. EP researchers do consider gene-culture co-evolution and current environments. 

  The teacher's example about male preference for younger partners is a common one. But EP doesn't stop at adaptive storytelling. They use cross-cultural studies, experiments on modern humans, and comparative methods to test hypotheses. The claim that explanations are untestable ignores these methods. For instance, David Buss's surveys across cultures provide data supporting certain mate preferences, which can be examined for consistency with predictions.

  Gould and Lewontin's "just-so stories" critique is valid if hypotheses aren't tested. However, many EP researchers do test their theories. The teacher's summary dismisses the entire field as untestable speculation, which isn't fair. EP uses scientific methods, even if some early work was speculative. 

  The user might need to understand that while some EP explanations can be post-hoc, the field has developed rigorous methods. The teacher's portrayal as pseudoscience doesn't hold because testability is addressed through various empirical approaches. The user's deeper need is likely to evaluate the scientific validity of EP for academic purposes, wanting a balanced view beyond the teacher's criticism. 

  So, the key misrepresentations are the oversimplification of modules, ignoring testable methods, and equating the field to pseudoscience. Defenders would agree that modules exist and adaptive functions are central, but reject the untestability claim. The verdict of pseudoscience doesn't follow because EP employs scientific testing.
answer: |-
  **Bottom line: Your teacher accurately captures evolutionary psychology's core focus on evolved mental modules and Pleistocene adaptations but misrepresents its methodology as inherently untestable "just-so stories," and the "pseudoscience" verdict does not follow from accurate descriptions of its theoretical commitments.**

  Here's the breakdown:

  1.  **Accepted Parts:**
      *   **Core Claim:** Defenders fully accept that evolutionary psychology (EP) posits the human mind comprises domain-specific psychological mechanisms (modules) shaped by natural selection.
      *   **Focus on Ancestral Environments:** Defenders agree the primary focus is on understanding adaptations to the *"Environment of Evolutionary Adaptedness" (EEA)*, often characterized by the selection pressures of the Pleistocene epoch. The goal is to understand *why* a mechanism exists by considering its function in that past environment.
      *   **Adaptive Function Reasoning:** EP relies heavily on "reverse engineering" – hypothesizing the adaptive function a trait *might* have served to explain its existence. The example given (male preference for youth linked to fertility/reproductive success) is a standard, widely cited EP hypothesis.

  2.  **Misrepresentations:**
      *   **"Simply Identify...":** This is the core misrepresentation. EP does not "simply identify" a plausible function and stop. The key scientific step is generating *testable predictions* from the adaptive hypothesis and subjecting them to empirical verification using modern data. EP researchers employ:
          *   **Cross-Cultural Studies:** Testing if the trait is universal or follows predicted patterns across diverse cultures (e.g., David Buss's mate preference studies).
          *   **Behavioral Experiments:** Designing lab or field experiments to trigger hypothesized modules and measure predicted responses (e.g., responses to cues of cheating, kinship, or disease threat).
          *   **Physiological & Neurological Measures:** Correlating traits with hormones, brain activity, or genetics to find biological links consistent with evolutionary origins.
          *   **Comparative Methods:** Studying similar traits in closely related species.
          *   **Developmental Evidence:** Examining if traits emerge in childhood in ways predicted by an evolutionary hypothesis.
          *   **Fossil & Archeological Record:** Using indirect evidence to constrain hypotheses about ancestral environments/social structures.
      *   **"Untestable" / "No Way to Check":** This is categorically rejected by defenders. While we cannot experiment *on Pleistocene humans*, EP argues that if a trait is an evolved adaptation, it should leave predictable, observable signatures in modern human psychology, behavior, physiology, and cross-species comparisons *today*. The methodologies above are precisely how they attempt to "check" their stories. Falsifiable predictions are central to their methodology.
      *   **"Just-so stories" as the Entire Approach:** While defenders acknowledge that *poorly done* EP can generate unfalsifiable "just-so stories" (a valid critique by Gould & Lewontin), they vehemently argue that *rigorous* EP generates testable hypotheses. They see the critique as targeting bad practice, not invalidating the entire field when done scientifically. Many EP hypotheses *have* been tested and supported (e.g., aspects of kin altruism, disgust responses, some mate preferences), while others have been refined or discarded based on evidence.
      *   **"Not real science—it's speculation":** Defenders point to EP's use of standard scientific methods (hypothesis testing, experimentation, comparative analysis, falsifiability) within established journals and university departments as clear evidence it operates as a scientific discipline, albeit one with inherent challenges in reconstructing the past.

  3.  **Does "Pseudoscience" Follow?**
      *   **No.** The verdict that EP is "pseudoscience" does *not* logically follow from the *accurate* parts of the summary (the focus on modules, adaptation, Pleistocene environments, and adaptive reasoning).
      *   The leap to "pseudoscience" hinges entirely on the *inaccurate* characterization that EP explanations are inherently untestable and lack empirical methodology. If EP genuinely employs testable hypotheses and rigorous empirical methods (as its defenders demonstrate through their research practices), then it meets the fundamental criteria of science, regardless of the difficulty of its subject matter or the validity of specific hypotheses.
      *   Criticisms about over-reliance on adaptationism, difficulty in proving a trait is an adaptation (vs. byproduct or exaptation), potential for political misuse, or the challenge of precisely defining the EEA are serious *scientific debates within and about the field*, not automatic proof of pseudoscience. These are challenges EP must address, but addressing methodological challenges is part of normal science.
