answer: |-
  Here's the "spec sheet" for spacetime ontology, organized by core desiderata, their grounding considerations, negotiability, and compatibility. This cuts to the metaphysical and explanatory demands beyond mere prediction, based on the canonical arguments.

  ### Core Desiderata for Any Adequate Account of Spacetime

  1.  **Explain Absolute Rotation (Newton's Bucket & Two Globes):**
      *   **What it must deliver:** Account for the observable distinction between rotating and non-rotating states (concave water surface, tension in the cord) even in an otherwise empty universe.
      *   **Forcing Consideration:** Empirical observation (bucket experiment), thought experiment (two globes connected by cord in otherwise empty space). Shows rotation isn't merely relational between material bodies.
      *   **Negotiability:** **Non-Negotiable.** Failure means rejecting empirical evidence or radically redefining motion (e.g., Machianism must provide *some* alternative account, not ignore it).

  2.  **Respect Leibniz Equivalence (Leibniz Shift):**
      *   **What it must deliver:** States differing *only* by a uniform shift (translation, rotation) of *all* material content within spacetime must be physically equivalent (same physical reality, same observable consequences).
      *   **Forcing Consideration:** Principle of Sufficient Reason (no reason to prefer one shifted state over another) and Empirical Equivalence (no observation can distinguish them).
      *   **Negotiability:** **Non-Negotiable.** Violation implies unobservable absolute position/orientation, contradicting basic principles of empirical science and symmetry.

  3.  **Maintain Determinism / Avoid Radical Underdetermination (Hole Argument):**
      *   **What it must deliver:** The state of the universe (matter + spacetime structure) at one time must fix its state at later times. Avoid situations where infinitely many physically distinct futures are compatible with the same initial data.
      *   **Forcing Consideration:** The Hole Argument (using GR's diffeomorphism invariance: drag matter & metric fields within a "hole" region, creating distinct solutions agreeing *everywhere else*).
      *   **Negotiability:** **Conditionally Negotiable.** While determinism is highly desirable, one *could* bite the bullet and accept underdetermination (as some "manifold substantivalists" do). However, this is widely seen as a major cost. Avoiding it is a strong desideratum.

  4.  **Distinguish Kinematic from Dynamical Possibility:**
      *   **What it must deliver:** Provide a clear distinction between motions/geometries that are *merely conceivable* (kinematically possible) and those that are *physically realizable* given the laws and initial conditions (dynamically possible).
      *   **Forcing Consideration:** Needed to make sense of Newton's Bucket/Globes (rotating uniformly is kinematically possible in Galilean spacetime, but dynamically requires a cause/explanation relative to absolute space/inertial structure) and inertial motion generally (straight lines are dynamically special).
      *   **Negotiability:** **Non-Negotiable.** Collapsing this distinction makes physics unintelligible; we need to understand what motions *could* happen vs. what motions *do* happen given the laws.

  5.  **Account for Inertial Structure (Why Straight Lines? Why Rotational Acceleration?):**
      *   **What it must deliver:** Explain the existence and behavior of inertial frames, geodesic motion, and the observable effects of non-inertial motion (like fictitious forces). Address "Why *this* structure?" (e.g., Mach's Principle as a potential answer).
      *   **Forcing Consideration:** The universality and peculiarity of inertial motion. The failure of purely relational accounts to *naturally* pick out inertial structure without smuggling it in.
      *   **Negotiability:** **Partially Negotiable.** *That* inertial structure exists is non-negotiable (observed). *How* it is grounded/fundamental/explained is negotiable. Mach's Principle (inertia from distant matter) is a strong *desideratum* for some (relationists, some substantivalists like Einstein), but not strictly required. A primitive inertial structure is acceptable, if ontologically costly.

  6.  **Recover Empirical Symmetries / Invariance:**
      *   **What it must deliver:** The account must be compatible with, and ideally explain, the empirically observed symmetries of physical laws (e.g., Lorentz/Poincaré invariance in SR, diffeomorphism invariance in GR).
      *   **Forcing Consideration:** Experimental verification of these symmetries (e.g., Michelson-Morley, constancy of `c`, equivalence principle tests).
      *   **Negotiability:** **Non-Negotiable.** The theory *must* deliver the empirically confirmed symmetries in its observable predictions. Failure is falsification.

  7.  **Distinguish Observability from Ontology:**
      *   **What it must deliver:** The account must not *automatically* equate what is unobservable (like spacetime points individuated only haecceitistically) with what is unreal or unnecessary.
      *   **Forcing Consideration:** Arguments like Leibniz Shift show unobservable absolute position is unreal. The Hole Argument shows that individuating spacetime points *beyond* what the metric/matter fields specify leads to underdetermination. However, inferring unreality *solely* from unobservability is questioned (e.g., unobservable structure might be necessary to explain observables like rotation).
      *   **Negotiability:** **Negotiable ("No Unobservable Points" is Prejudice).** Relationists often demand "no unobservable points." Substantivalists argue points/structure are needed ontologically *to explain* observable phenomena (rotation, inertia), even if not individually observable. The Hole Argument challenges *how* points are individuated, not necessarily their existence *simpliciter*.

  ### Compatibility & Live Options

  *   **The Core Tension:** Requirement 1 (Absolute Rotation) seems to demand fixed, non-relational structure (inertial structure). Requirement 2 (Leibniz Shift) forbids unobservable absolute position. Requirement 3 (Determinism) clashes with manifold substantivalism + GR diffeomorphism invariance (Hole Argument).
  *   **Ruled Out Combinations:**
      *   **Naive Manifold Substantivalism + GR Determinism:** Impossible (Hole Argument). Manifold points individuated *primitively* lead to radical underdetermination.
      *   **Naive Relationalism + Absolute Rotation:** Impossible (in an otherwise empty universe). Needs *some* non-material grounding for inertial structure/rotation.
  *   **Live Options (Satisfying 1, 2, 4, 6 + attempting 3 & 5):**
      *   **Sophisticated Substantivalism (Metric Field Realism):** Treats the *metric field* `g_μν` as the fundamental spacetime entity (not points). Points are just mathematical labels. Solves Hole Argument (diffeomorphic models represent the *same* physical `g_μν`/matter configuration). Delivers rotation (via `g_μν`). Respects Leibniz-Shift (shift is just a redescription). Inertial structure is primitive/aspect of `g_μν`.
      *   **Moderate Relationism (e.g., Barbour):** Spacetime *is* spatial relations + temporal ordering (or histories). Inertial structure emerges from dynamics/constraints or Machian considerations (distant matter). Must carefully reconstruct rotation effects *without* a background. Can respect Leibniz Shift naturally. Faces challenges with empty universes and rigorously defining inertial structure dynamically.
      *   **Accept Underdetermination (Manifold Substantivalism):** Bites the bullet on the Hole Argument. Accepts primitive manifold points and radical indeterminism as the price for a "container" view. Still needs to explain rotation/inertia via the manifold.
  *   **Mach's Rotating Shell:** Tests Requirement 5 (Origin of Inertia). Does distant mass influence local inertia? GR gives a *partial* "yes" (frame-dragging), but not the full Machian vision where inertia *only* comes from distant matter. While intriguing, a full Machian explanation remains a strong but negotiable desideratum, not a requirement met by any mainstream, empirically successful theory yet.

  ### Key Takeaways

  *   **The Most Exclusionary Requirement:** **The Hole Argument (Requirement 3)** does the most work in excluding standard views. It devastates naive manifold substantivalism combined with GR's determinism.
  *   **Most Contentious "Common Ground":** **The Status of Unobservable Structure (Requirement 7)**. Both camps *use* the observability argument strategically: Relationists against points, Substantivalists against absolute position. But the inference "unobservable therefore unreal" is contested deep down. The Hole Argument challenges *how* we individuate points, not necessarily their existence *if* they are individuated relationally via the metric (as in sophisticated substantivalism).
  *   **The Central Challenge:** Reconciling **Absolute Rotation** (demanding non-relational structure) with **Leibniz Equivalence** (forbidding unobservable absolutes) and **Determinism** (threatened by the Hole Argument for substantivalism). Successful modern accounts (Metric Field Realism, sophisticated Relationism) provide different resolutions by redefining the fundamental entities or grounding inertial structure differently.
  *   **Non-Negotiables:** Empirical Adequacy (Rotation, Symmetries), Leibniz Equivalence, Kinematic/Dynamic Distinction.
  *   **Negotiables:** *Full* Machian Explanation of Inertia, Strict Ban on Unobservable Points *Per Se* (vs. unobservable *absolute position*), Absolute Determinism (though avoiding underdetermination is a major plus).

  This list forces accounts to confront the *explanatory* demands of spacetime: not just predicting motions, but grounding inertia, distinguishing real from apparent motion, respecting symmetries, and avoiding metaphysical absurdities like radical indeterminism or undetectable absolute positions. No account perfectly satisfies all desiderata without cost, but the viable contenders address them head-on with sophisticated metaphysics.
