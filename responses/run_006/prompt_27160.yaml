prompt: |-
  Someone in a group chat keeps ending disagreements about AI risk by saying 'rational people can't agree to disagree' — the idea being that if we've both seen the same arguments and still have different probabilities, at least one of us is being irrational. I'm pretty sure there's a real theorem somewhere in the background, but also that the slogan is doing way more work than the theorem allows. Can you seperate out the distinct precise claims that line could be making — about common priors (the assumption that any disagreement must trace back to different information rather than different starting points), about common knowledge of each other's posteriors, about whether rational beliefs must converge after enough exchange, about what 'the same evidence' even means — and say for each whether it's an actual theorem, a substantive assumption, a platitude, or just false? Then tell me which reading someone is implicitly relying on when they use it to shut down a real-world argument, and whether that reading actually gets them their conclusion.
