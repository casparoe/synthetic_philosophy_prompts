answer: |-
  Here's a restatement of the interpersonal utility comparison (IUC) debate using your metrological framework, followed by a residue analysis and mind-changing criteria:

  ### Position 1: Pro-Comparability (e.g., Pigou, Harsanyi, Sen)
  *   **Translation:**  
      Utility is an **interval scale** (at minimum) with meaningful units ("utils"). Individuals are instruments calibrated against a **common reference standard** (e.g., a defined unit of welfare gain/loss). While instruments differ in sensitivity (utility functions), calibration establishes **traceability** to the standard, enabling **inter-instrument comparability**. "Ann gains more than Bob loses" is analogous to "Thermometer A registers a larger ΔT than Thermometer B registers a negative ΔT for the same heat transfer event relative to baseline."
  *   **Clean Translation:**  
      *   Utility as interval/ratio scale concept.  
      *   Need for calibration against a standard for comparability.  
      *   Instrument differences (heterogeneous preferences).  
      *   Reproducibility ↔ Behavioral consistency under similar choice conditions.  
      *   Drift ↔ Changing preferences over time/life circumstances (requiring re-calibration).
  *   **Fudged Translation:**  
      *   **The Reference Standard:** Physical measurement has concrete standards (kg, K). The pro-comparability "standard" (e.g., "just noticeable difference," "welfare equivalent") is abstract and lacks physical realization. Calibration isn't metrological but conceptual/revealed through choices.  
      *   **Calibration Procedure:** In metrology, calibration uses known inputs. "Calibrating" individuals relies on revealed preference under uncertainty (e.g., lotteries) or hypothetical choices, introducing significant **systematic error** (misreporting, framing effects) and lacking traceable uncertainty quantification.
  *   **Untranslatable Residue:**  
      *   The core claim that introspection/interpersonal empathy *just is* a form of calibration (no operational procedure).  
      *   Ethical axioms (e.g., impartiality in Harsanyi) as *justifying* comparability rather than demonstrating it metrologically.

  ### Position 2: Anti-Comparability (e.g., Robbins, ordinalists, many modern microeconomists)
  *   **Translation:**  
      Utility is *only* an **ordinal scale** – a ranking unique to each instrument. There exists **no common reference standard** against which different instruments can be calibrated. Any attempt at IUC is like comparing the *magnitudes* of temperature changes reported by two thermometers that:  
      1.  Use **different scales** (Fahrenheit vs Celsius, or worse, arbitrary linear transforms).  
      2.  Were **never cross-calibrated** against a common source or each other.  
      3.  May have **non-linear response curves** (unknown cardinalizations).  
      "Ann gains more than Bob loses" is meaningless metrologically – you can only say "Ann prefers apple+ > apple-" and "Bob prefers apple- > apple+".
  *   **Clean Translation:**  
      *   Utility as purely ordinal scale concept.  
      *   Lack of common standard → No basis for inter-instrument comparison of magnitude.  
      *   Heterogeneous instruments (different "scales").  
      *   Behavioral data reveals only rank order, not interval properties.  
      *   "Different scales" ↔ Arbitrary monotonic transformations preserving order.  
      *   Unavoidable **systematic error** if assuming cardinality/comparability where none exists.
  *   **Fudged Translation:**  
      *   **The Nature of Ordinal Data:** Philosophical arguments about the *inherent meaninglessness* of comparison map cleanly to "no common scale/no calibration possible," but the *strength* of the claim ("impossible" vs "currently unmeasurable") is philosophical, not strictly metrological. Metrology can't rule out a future standard.
  *   **Untranslatable Residue:**  
      *   The deeper epistemological claim that utility is *only* behaviorally revealed via choice, and choice reveals *only* order. (Metrology doesn't preclude richer internal states; it just says they aren't *measured* by choice alone).

  ### Residue Report: What Doesn't Translate & Why
  1.  **The Putative Reference Standard:** This is the core gap. Physical measurement has concrete, operationalized, often physical standards. Pro-comparability lacks this. Anti-comparability argues no such standard is *possible* for subjective states. **Verdict:** The lack of translation highlights a genuine hole in the pro-comparability position *from a strict metrological perspective*. It suggests their "standard" is aspirational or axiomatic, not operational.
  2.  **Calibration via Choice Behavior:** Revealed preference (especially under uncertainty) is the closest thing to a "calibration procedure." However, it only recovers *individual* cardinal scales (interval properties) under strong assumptions (vNM axioms), not a *common* unit. **Verdict:** This exposes the fudge – behavioral data alone is insufficient for metrological calibration across instruments. It doesn't prove comparability is *impossible*, but shows the proposed method falls short.
  3.  **The Ethical Imperative:** The *reason* philosophers *want* comparability (to make welfare judgments) has no metrological analog. **Verdict:** This is where philosophy does "extra work." The *need* for a concept doesn't prove its measurability. Metrology is silent on ethical necessity.
  4.  **Introspection/Empathy as Evidence:** Proponents often appeal to these. Metrology deals with intersubjective observation. **Verdict:** Highlights a fundamental difference in admissible evidence. Introspection lacks reproducibility and traceability.

  **Your Suspicion:** It **survives intact and is central**. The debate *is* fundamentally about whether a procedure exists to establish a **common utility scale** (unit and zero point) across individuals, enabling valid inter-instrument comparison of utility *differences*. Proponents argue (explicitly or implicitly) that such a procedure exists or can be meaningfully assumed. Opponents argue no valid procedure exists or can exist, rendering comparisons meaningless like uncalibrated instruments.

  ### What Would Change My Mind (and Where Translation Fails)
  *   **Changing to Pro-Comparability:** A demonstrable, reproducible, intersubjectively verifiable **calibration procedure** establishing a **common reference standard unit** of utility/welfare. This could involve:
      *   **Neuroscience:** Reliable, universal neural correlates of utility intensity directly measurable and comparable across individuals (e.g., "This fMRI pattern = +1 'utilon' for any human").
      *   **Behavioral "Metrology":** Discovering choice patterns under rigorously controlled conditions that *uniquely determine* a common scaling factor across individuals, traceable to a defined standard event, with quantifiable uncertainty.
      *   **Failure Point:** Translating neural/biological signals into a *normative* welfare unit ("utils") remains philosophical. Metrology can measure brain states, but calling it "utility" requires an extra step.
  *   **Changing to Anti-Comparability (Stronger Conviction):** Demonstrating that even under ideal choice conditions (perfectly rational agents, full vNM compliance), infinitely many incommensurable cardinalizations fitting the data exist, and *no conceivable experiment* could distinguish which is "correct" for interpersonal comparison. This would solidify the "no possible standard" claim.
      *   **Failure Point:** Proving universal impossibility is hard. Metrology is inherently optimistic about future measurement capabilities.
  *   **Where the Translation is Most Fragile:**
      *   **The Status of Introspection:** Dismissing introspection entirely aligns with strict behaviorist metrology but might ignore valid phenomenological data (a philosophical stance).
      *   **"Soft" Calibration:** Philosophers might accept weaker forms of "calibration" (e.g., through empathetic understanding, moral reasoning) that lack metrological rigor but hold ethical weight. The translation struggles here.
      *   **Aggregation Without Comparison?** Some theories (e.g., certain prioritarian or egalitarian views) might achieve welfare judgments without *strong* IUC, using only ordinal or partially comparable information. The translation focuses on the strong comparison claim.

  **Conclusion:** Your measurement vocabulary powerfully clarifies the core issue: the lack of a demonstrable, traceable **common calibration standard and procedure** is the fundamental metrological barrier to meaningful interpersonal utility comparisons. The pro-comparability position relies on conceptual or axiomatic foundations that lack operational metrological validity. The anti-comparability position aligns closely with the stringent requirements of instrument comparability. The untranslated residues primarily involve philosophical claims about necessity, the admissibility of non-behavioral evidence, and the nature of welfare itself, which lie beyond the scope of measurement science. Your suspicion is correct: the existence (or not) of a valid inter-personal calibration procedure is the crux.
