  First, I need to break down both sides of the philosophical debate using their measurement vocabulary. The pro-comparisons side (like Pigou or Harsanyi) argues that utility can be cardinally measurable and interpersonally comparable. The anti side (like Robbins or ordinalists) sees utility as ordinal and non-comparable. 

  Translating pro-comparisons: Cardinal utility as an interval scale with units. Calibration through revealed preferences or neuroscience. But here, the reference standard is tricky—there's no universal unit like kilograms. Revealed preferences might be like proxy standards, but they're imperfect. Reproducibility could be behavioral consistency, but drift (changing preferences) introduces error. The fudge is in assuming behavioral data equates to internal states, which might not hold.

  Anti-comparisons: Utility as purely ordinal, like a ranking scale. No common calibration standard exists, so any comparison is like uncalibrated thermometers. Behavioral data is just rank-order, lacking interval properties. The residue here is that philosophers might overstate the impossibility, but the core holds—no shared unit. 

  The user's suspicion aligns: the key is a common calibration procedure. If we could find a method (e.g., neuroscience) to link internal states to a common metric, comparisons might work. But current methods (behavioral data) only give ranks. 

  What would change my mind? If a reliable calibration method emerges, like neural correlates of utility, or consistent scaling through welfare policies. But until then, the anti-comparison stance is stronger. The residue might be philosophical assumptions about the necessity of utility comparisons for ethics—perhaps other frameworks exist without them. 

