prompt: |-
  I recently came across the scholarly discussion of Frege's political diary from 1924, and it has unsettled something I had long taken for granted. I used to think the question of whether a philosopher's life bears on their work had a straightforward answer — something like "evaluate the arguments, not the person." But reading about Frege has made me realize my own intuitions vary from case to case in ways I cannot currently justify. I am trying to work out what principle I actually hold, by tabulating my verdicts on specific cases and asking you to extract the rule behind them, if one exists.

  Here are my verdicts:

  **1. Frege.** The diary, written late in his life, is a sustained expression of anti-Semitism, anti-democratic politics, and admiration for Hitler and Ludendorff. It is repellent. But Frege's philosophical achievement — the Begriffsschrift, the logicist program in the Grundlagen, the sense–reference distinction — seems to me untouched. I cannot locate any point at which the politics enters the logic. My verdict: the diary does not bear on his philosophical work.

  **2. Heidegger.** His Nazi party membership began in 1933, and Being and Time was published in 1927. I am prepared to say the politics does not bear on Being and Time taken on its own. But in the later work — the rectoral address, the Introduction to Metaphysics, the essays on technology — I feel the politics and the philosophy are not merely simultaneous; they share a deep structure. The anti-modernism, the talk of destiny and rootedness and the forgetting of Being, all seem to me to do philosophical work that is also political work. My verdict: the politics bears on the later philosophy but not on Being and Time.

  **3. Carl Schmitt.** His concept of the political — sovereignty as the power to declare the exception, the friend–enemy distinction as the essence of politics — was developed in explicit service of the Nazi legal order after 1933, and even his pre-1933 work on dictatorship was laying the groundwork. I do not see how one could separate the philosophy from the politics here even in principle. My verdict: the politics bears on the work entirely; the distinction collapses.

  **4. Rousseau.** He abandoned all five of his children to foundling hospitals and later wrote Émile, one of the most influential works on child-rearing in the history of ideas. That is staggering hypocrisy. But I cannot identify a philosophical claim in Émile that is falsified or logically compromised by the biographical fact. My verdict: the biography discredits the man but does not bear on the content of the philosophy — though I notice it changes how I read the text, infusing it with an irony I would otherwise miss.

  **5. Paul de Man.** As a young journalist in occupied Belgium he wrote anti-Semitic literary columns; decades later he became a central figure in deconstruction. I do not think those early articles directly infect the theoretical arguments in Allegories of Reading. Yet I find myself unable to say the biography is irrelevant. The question it raises is not whether deconstruction is false but whether its characteristic moves — the resistance to fixed meaning, the insistence that determinate moral judgment is always premature — might hold a particular appeal for someone with de Man's history, and whether that fact should alter the scrutiny we bring to the theory. My verdict: the biography does not refute the theory, but it does bear on how the theory should be evaluated, because it gives us reason to ask whether the theory's appeal is partly the wrong kind of appeal.

  **6. (The case I keep returning to.)** A colleague of mine, a philosopher of mind, holds an uncompromising eliminativism about folk psychology. In conversation he has said things I find chilling — that grief is just a pattern of neural firing we tell ourselves a story about, that remorse is an adaptive illusion, that we would be better off without the vocabulary of belief and desire. His published papers are technical, rigorous, and show none of this. But I cannot shake the suspicion that what attracts him to the view, and what makes him untroubled by what it seems to imply, is a kind of interpersonal coldness that the papers are designed not to display. My verdict: I do not know whether this bears on his philosophy or not, and I need a principle to tell me.

  What I am asking for is a principle — or a small set of viable candidates — that captures as many of these six verdicts as possible. State it precisely. For each clause, say which case or cases motivate it. Then apply the principle to my colleague and tell me what it says. Finally, tell me honestly: which of my six verdicts, if any, must be overturned if the principle is to be coherent? If the principle can accommodate all six only by growing baroque and gerrymandered, say so, and offer the cleaner alternative that overturns the fewest verdicts.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating philosophical puzzle about whether and how a thinker's life/politics bear on their work, with six nuanced case studies and a request for a unifying principle. 

  First, I notice the user's intellectual honesty in admitting their intuitions vary without clear justification. They're not just seeking an answer but a coherent framework to examine their own judgments. The colleague case (#6) seems particularly troubling them - it's personal and unresolved.

  Looking at the cases, three patterns emerge:
  1) When the work's content directly relies on or justifies problematic views (Schmitt, later Heidegger), biography matters
  2) When the work is logically separable but the biography reveals motivations (de Man, the colleague), it affects evaluation without refuting
  3) When the work stands independent (Frege, Rousseau), biography only adds historical context

  The trickiest aspect is distinguishing between:
  - What the arguments *say* (content)
  - Why someone might *make* those arguments (motivation)
  - How we should *receive* them (evaluation)

  For the colleague case, the principle suggests the coldness might explain his attraction to eliminativism but doesn't invalidate his technical arguments. However, it should make us examine his dismissal of folk psychology's implications more critically.

  The cases that might need adjustment are:
  - Early Heidegger: If we apply the motivation criterion strictly, his later Nazism could prompt us to check for embryonic themes in Being and Time
  - Rousseau: His hypocrisy doesn't affect Émile's content, but might reveal something about his relationship to his own ideas

  I suspect the user wants to preserve logical separability while acknowledging that philosophy isn't done in a vacuum. The proposed principle tries to walk that line by distinguishing content from motivation and reception.
answer: |-
  Based on your nuanced case analyses, the principle capturing your core intuitions must distinguish between **content**, **motivation**, and **reception** of philosophical work. Here is the most coherent principle derived from your verdicts:

  **The Relevance Principle:**  
  A philosopher’s life/politics bears on their work *only if* it:  
  **(a) Directly shapes the content or justification of their arguments** (Content Criterion), *or*  
  **(b) Reveals a motivational link that undermines the theory’s integrity or demands scrutiny of its appeal** (Motivation Criterion).  
  Otherwise, biographical facts may discredit the *person* or inform historical context but do not bear on the *philosophical validity* of the work itself.

  ---

  **Breakdown of Clauses & Case Motivations:**  
  1. **Content Criterion (a):**  
     - **Applies to:** Schmitt (entirely), later Heidegger.  
     - **Why:** Schmitt’s "friend-enemy" distinction *is* Nazi jurisprudence; Heidegger’s later "destiny/rootedness" concepts *perform* anti-modernist politics. The politics is constitutive of the philosophy.  
     - **Excludes:** Frege (logic independent of antisemitism), Rousseau (child abandonment irrelevant to *Émile*'s pedagogy), early Heidegger (*Being and Time* lacks explicit political structure).  

  2. **Motivation Criterion (b):**  
     - **Applies to:** de Man, your colleague.  
     - **Why:** de Man’s deconstruction doesn’t *logically* require antisemitism, but his history suggests the theory’s "indeterminacy" might appeal to those avoiding moral accountability. Similarly, your colleague’s "coldness" may *motivate* his eliminativism, raising questions about its appeal.  
     - **Excludes:** Frege/Rousseau (no evidence their biases *motivated* core arguments), Schmitt (already covered by Criterion a).  

  3. **Non-Relevance:**  
     - **Applies to:** Frege, Rousseau, early Heidegger.  
     - **Why:** Repugnant acts/views lack logical or motivational connection to the work’s content.  

  ---

  **Application to Your Colleague (Case 6):**  
  - **Content Criterion (a):** His technical papers on eliminativism stand independently. Neural correlates of grief don’t *require* interpersonal coldness.  
  - **Motivation Criterion (b):** His "chilling" remarks suggest emotional detachment *motivates* his commitment to eliminativism and indifference to its implications. This doesn’t refute his arguments but demands scrutiny: *Why* is he untroubled by eliminating moral concepts? Does his theory attract others for similar concerning reasons?  
  - **Verdict by the Principle:** The biography **bears on the evaluation of his philosophy** (via Motivation Criterion b), not by invalidating it, but by raising doubts about its *anthropological plausibility* and *ethical stakes*. It signals a need for extra rigor in examining his dismissal of folk psychology’s value.  

  ---

  **Coherence Check: Which Verdicts Must Be Overturned?**  
  Your verdicts on **Heidegger** and **de Man** require slight refinement for full coherence:  
  1. **Heidegger’s *Being and Time* (1927):**  
     - Your verdict: Politics doesn’t bear on it.  
     - **Problem:** If later work shares a "deep structure" with Nazism, might *Being and Time* contain seeds of this (e.g., "authenticity" reinterpreted as *völkisch* commitment)?  
     - **Overturn?** Partially. The Principle’s *Content Criterion (a)* still absolves *Being and Time* (no explicit politics). But *Motivation Criterion (b)* could apply: His later Nazism *retrospectively* invites scrutiny of whether concepts like "destiny" were *always* politically laden. This doesn’t "bear on" validity but demands heightened contextual evaluation.  

  2. **de Man:**  
     - Your verdict: Biography bears on evaluation.  
     - **Coherence:** Fully aligned with *Motivation Criterion (b)*. No overturn needed.  

  ---

  **The Cleanest Alternative (Minimal Overturn):**  
  If the above feels "gerrymandered," this stricter principle overturns only **one** verdict:  
  > **Biography is irrelevant unless the work’s arguments logically depend on the disputed biographical facts.**  

  - **Captures:** Schmitt (fully), later Heidegger (partially).  
  - **Overturns:**  
    - **de Man (Case 5):** Deconstruction doesn’t *logically* require antisemitism → biography irrelevant. *(But you feel it’s relevant to evaluation.)*  
    - **Colleague (Case 6):** Eliminativism doesn’t *logically* require coldness → irrelevant. *(Contra your suspicion.)*  
  - **Keeps:** Frege, Rousseau, early Heidegger, *and* your verdict on later Heidegger.  

  ---

  **Conclusion:**  
  Your intuitions prioritize **logical autonomy** but acknowledge that **motivational context** affects how we *engage* with ideas—especially when moral evasion or psychological traits are implicated (de Man, your colleague). The **Relevance Principle** best honors this, requiring only slight refinement of your early Heidegger verdict. For your colleague: his coldness doesn’t falsify eliminativism, but it *warrants examining* whether his theory functions as intellectualized detachment. If that feels unsatisfying, it reveals a tension in your cases—between philosophy as pure argument and as human practice.
