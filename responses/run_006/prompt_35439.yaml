answer: |-
  You've hit on one of the most profound and debated concepts in philosophy of science! What you're describing is **almost exactly Thomas Kuhn's concept of "Incommensurability"** within his theory of **Paradigm Shifts**. Your description is remarkably accurate and insightful, especially for someone encountering this through primary historical readings rather than philosophy texts.

  Here's how your description maps onto Kuhn's ideas and related concepts:

  1.  **Kuhn's "Incommensurability" (The Core Concept):**
      *   **What it means:** Literally "no common measure." Kuhn argued that competing paradigms (like Phlogiston vs. Oxygen Chemistry, Aristotelian vs. Galilean/Newtonian Physics, Pre-Darwinian vs. Darwinian Biology) are *incommensurable*.
      *   **Your Points Matched:**
          *   **(1) Untranslatability:** Kuhn argued that key terms (like "element," "motion," "force," "species," "space," even "time") **change meaning** between paradigms. You cannot perfectly translate a statement from one paradigm into the language of the other without loss, distortion, or importing assumptions. Phlogiston isn't "anti-oxygen"; it played a fundamentally different conceptual role. Aristotelian "motion" included processes we now call qualitative change. What counted as "explanation" changed.
          *   **(2) No Shared Standards of Evidence/Problem-Solving:** Paradigms define what counts as a **legitimate problem**, a **valid method**, and a **satisfactory solution**. Lavoisier and Priestley weren't just disagreeing on results; they disagreed on what constituted a "pure" gas, what weight changes *meant*, and what phenomena were central to explaining. Cuvier and Darwin had different definitions of "species" and radically different ideas about what a good explanation of biological diversity looked like (divine plan vs. natural selection). There is **no neutral, paradigm-independent set of rules** to adjudicate the dispute.
          *   **(3) Rationality Within Frameworks:** Kuhn emphasized that scientists working within a paradigm are **not irrational**. They are solving puzzles according to the rules of their paradigm. Their work is rigorous *within that framework*. From *inside* the old paradigm, the new one often looks messy, counter-intuitive, or ignores "obvious" truths. Conversely, the new paradigm makes the old one look fundamentally misguided. This is the "Gestalt Switch" aspect – seeing the same world differently.

  2.  **Kuhn's "Paradigm Shift" (The Broader Context):**
      *   Incommensurability is a *feature of* paradigm shifts. A paradigm is a constellation of shared commitments – theories, methods, standards, exemplars (model solutions), metaphysical assumptions – that define "normal science" within a community for a period.
      *   Your historical examples (Phlogiston->Oxygen, Fixism->Evolution, Aristotelian->Galilean) are classic examples of what Kuhn called **scientific revolutions** – periods where an old paradigm is replaced by an incommensurable new one.
      *   **Resolution:** Kuhn argued revolutions aren't won solely by logic and experiment *at the moment of crisis* because of incommensurability. They are won when the new paradigm demonstrates superior **problem-solving ability** (explaining more, resolving anomalies, opening new research avenues) and eventually gains enough converts that the old paradigm dies out with its adherents. It's a sociological and intellectual process, not a simple logical deduction.

  3.  **Distinctions from Related Concepts:**
      *   **Underdetermination of Theory by Data (Quine/Duhem):** This is the idea that any finite set of evidence can logically support multiple, incompatible theories. It's a *logical* point about evidence and theory choice. **Your point is deeper:** It's not just that the *same data* can be interpreted differently (though that happens), but that the *very meaning* of the data, the *standards* for evaluating it, and the *significant problems* are different. Incommensurability involves conceptual and methodological fractures, not just evidential ambiguity.
      *   **Feyerabend's "Epistemological Anarchism" / "Anything Goes":** Paul Feyerabend, influenced by Kuhn, took a more radical stance. He argued there are *no* universal methodological rules that govern scientific progress ("Against Method"). He emphasized proliferation of theories and the role of non-rational factors. While Feyerabend would agree with the points about untranslatability and lack of shared standards, he rejected the idea of stable paradigms governing "normal science" and advocated for constant theoretical pluralism. **Your description focuses more on the *structure* of the clash between established frameworks (Kuhn) than on the radical methodological pluralism Feyerabend promoted.**
      *   **Conceptual Relativism:** This is a broader philosophical view that different conceptual schemes structure the world so differently that they are fundamentally incomparable. Kuhn's incommensurability is often seen as a *scientific* version of this, though Kuhn himself resisted the strong relativist label, arguing that later paradigms are often better *tools* even if not simply "truer" in an absolute sense.

  4.  **Refinements and Criticisms:**
      *   Kuhn's ideas (especially incommensurability) were highly controversial. Critics argued it led to irrationalism or relativism, making scientific progress impossible to explain rationally.
      *   Later philosophers (like Dudley Shapere, Philip Kitcher) argued for "**partial commensurability**." They acknowledged meaning change but argued there is often enough overlap in reference, shared low-level observational language, or shared meta-methodological values (accuracy, scope, simplicity) to allow rational comparison and communication *across* paradigms, even if imperfectly. Your point (3) about neither side being *irrational* acknowledges this – they *are* reasoning, just from different premises.
      *   **Semantic Incommensurability:** Focuses specifically on the meaning change of terms.
      *   **Methodological Incommensurability:** Focuses on the lack of shared standards for evaluation.
      *   **Perceptual Incommensurability:** The idea that proponents of different paradigms might literally "see" the same stimulus differently (e.g., seeing an oxygen experiment vs. a phlogiston experiment).

  **Conclusion:**

  The term you're looking for, which fits your description almost perfectly, is **Kuhnian "Incommensurability"** within the context of a **Paradigm Shift** or **Scientific Revolution**.

  *   **Incommensurability** captures the core issues: the **untranslatability** of key concepts, the **lack of shared methodological standards**, and the resulting difficulty in purely rational, evidence-based adjudication *during the crisis period*.
  *   It explains why scientists within each framework appear **rational** from their own perspective but seem to "talk past" or fundamentally misunderstand the other side.
  *   Your historical examples are textbook illustrations of this phenomenon.

  You've grasped a complex and central idea in the philosophy of science through your historical reading – that's impressive! Kuhn's "The Structure of Scientific Revolutions" is the foundational text if you want to dive deeper. Be aware that the concept is debated, but your description aligns strongly with its core meaning.
