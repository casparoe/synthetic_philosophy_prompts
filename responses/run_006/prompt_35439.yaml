  I should emphasize that incommensurability isn't about total incomparability but rather partial communication barriers. The user might be conflating it with underdetermination (where multiple theories fit the same data), but their examples clearly show deeper conceptual divides. 

  Feyerabend's "anarchism" is relevant too - he took these ideas further than Kuhn regarding methodological pluralism. But the user's description matches Kuhn's framework best. I'll need to explain how incommensurability operates at the semantic, methodological, and perceptual levels as they described.

