prompt: |-
  Ok so I'm taking this grad seminar on rational choice and we've been going back and forth on the Allais paradox for two weeks and I still can't decide whether I'm being irrational or the axioms are to demanding. I thought a good way to work through it would be to argue with someone who actually buys the independence axiom all the way down. So here's the setup: you play a committed defender of the independence axiom — think Savage, but you don't have to be Savage, just someone who genuinely believes that violating the Sure Thing Principle is a mistake and that the Allais preferences are flat-out irrational. You're sharp, you know the moves (including the standard replies about framing, regret, the money-pump), and you don't concede the core claim. I'll play the guy who looks at the Allais choices and thinks, yeah, I'd take the safe million and then turn around and gamble on the five million, and that feels fine actually. Keep your replies to a paragraph so it stays conversational.

  Here's my opening. Choice 1: I can have a million dollars, no strings attached — or I can have a lottery ticket that gives me an 89% shot at a million, a 10% shot at five million, and a 1% shot at nothing. I'm taking the million. Choice 2: I can have an 11% chance at a million (89% nothing) or a 10% chance at five million (90% nothing). Here I'm taking the 10% shot at five million — the one-percent lower chance of winning feels worth it for five times the prize. Now, the independence axiom says that if I prefer the sure million over the lottery in Choice 1, I should also prefer the 11% shot at a million over the 10% shot at five million in Choice 2, because both pairs differ only by that shared 89% chance at a million that gets stripped out. But I don't. So tell me: what exactly is my mistake?
