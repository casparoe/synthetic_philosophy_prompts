prompt: |-
  I sit on my company's engineering standards committee. We are rolling out an internal AI assistant that reviews pull requests, flags potential bugs, and suggests architectural improvements. The CTO wants to make its use mandatory for all code reviews, arguing that it catches issues humans miss and that consistency requires everyone to use the same tools. A group of senior engineers has pushed back: they argue that mandatory AI review will cause developers to gradually lose their own code-review judgement, that new hires will never develop the skill in the first place, and that we will end up with a workforce that cannot reason about the codebase independently. They have called this 'epistemic erosion' and say it is a recognised problem in the philosophy of technology. The committee is split. Please draft the short decision memo I will circulate before Friday's meeting: it should recommend a concrete policy (mandatory, optional, or something in between), give reasons that engage seriously with the epistemic-erosion worry rather than dismissing it, and include an honest treatment of the strongest argument on the losing side.
reasoning: |-
  Okay, let me approach this like an engineering standards committee member drafting a policy memo. The core tension is between efficiency gains from mandatory AI-assisted code review versus concerns about skill atrophy - that "epistemic erosion" concept the senior engineers raised.

  First I need to unpack that philosophy term. Epistemic erosion refers to how over-reliance on tools can degrade human judgment capabilities over time. In this context, it's about whether junior developers would still learn proper code review skills if an AI always spots issues first. The senior engineers' warning reminds me of studies showing how GPS navigation impacts spatial memory - useful parallel to cite.

  The CTO's strongest argument is undeniable: AI does catch subtle bugs humans miss, like concurrency issues or edge cases in complex systems. Making it mandatory ensures consistent safety nets across teams. But the memo must acknowledge that this benefit could come at the cost of long-term skill development.

  For the policy recommendation, a balanced approach makes sense. Making AI review optional for senior engineers but mandatory for juniors addresses both concerns. Seniors maintain their expertise while mentoring others, and juniors get AI scaffolding as they learn. The 30-day manual review requirement after promotion ensures skills verification. 

  The implementation details matter:
  - Requiring humans to add original comments prevents passive rubber-stamping
  - Quarterly calibration sessions will monitor for over-reliance
  - Explicitly positioning the AI as an assistant, not an authority

  Biggest concession to the mandatory-use camp: allowing teams to temporarily enforce universal AI review during critical projects. This shows flexibility while maintaining the core principle of intentional tool use. The exit criteria prevent this from becoming permanent.

  Should emphasize that this isn't rejecting AI, but integrating it responsibly. The philosophy angle gives intellectual weight to the engineers' concerns without sounding reactionary. Comparing it to calculator use in math education makes the concept accessible.

  Final structure will be: (1) policy statement upfront, (2) reasons addressing epistemic concerns head-on, (3) implementation guardrails, and (4) honest treatment of the counterargument about missed bug catches. Tone should be decisive yet collaborative - we're optimizing for sustainable engineering excellence.
answer: |-
  ## Engineering Standards Committee: Decision Memo on AI-Assisted Code Review Policy  
  **To:** Engineering Standards Committee Members  
  **From:** [Your Name/Committee Chair]  
  **Date:** October 26, 2023  
  **Subject:** Recommended Policy for AI-Assisted Code Review Integration  

  ### 1. Recommended Policy  
  **Hybrid Approach:**  
  - **Mandatory AI Pre-Review** for all Junior Engineers (<2 years tenure) and Intermediate Engineers (<5 years).  
  - **Optional AI Pre-Review** for Senior Engineers (5+ years), *provided* they:  
    - Conduct manual review *before* using AI.  
    - Document independent findings prior to AI suggestions.  
  - **Universal Requirement:** All PRs must include *at least one human-originated critical comment* (even if AI flags issues).  

  ### 2. Reasoning: Addressing Epistemic Erosion  
  We acknowledge the senior engineers’ concern about "epistemic erosion" as a profound philosophical and practical risk. Over-reliance on AI *can* atrophy critical reasoning skills, particularly in developing engineers who may defer to algorithmic judgment instead of building their own. This mirrors observed phenomena in aviation (automation complacency) and medicine (diagnostic over-reliance on AI), where skill degradation occurs when tools replace active cognition.  

  Our policy mitigates this by:  
  - **Preserving Cognitive Engagement:** Requiring manual review first for seniors ensures they exercise independent judgment. Juniors use AI as a "training wheel" but are mentored to understand *why* flags arise.  
  - **Building Foundational Skills:** Mandatory AI for juniors ensures consistent safety nets while they learn, but the "human-originated comment" rule forces active analysis.  
  - **Balancing Guardrails:** Treating AI as a co-pilot (not pilot) ensures engineers retain sovereignty over technical decisions.  

  ### 3. Strongest Counterargument (CTO Position)  
  The CTO rightly emphasizes that *consistency and comprehensiveness* in reviews are critical. AI detects subtle bugs (e.g., race conditions, security antipatterns) that even seasoned engineers miss, particularly in large codebases. Mandatory universal use maximizes issue prevention and standardization.  

  **Our Concession:** By mandating AI for less experienced engineers (who benefit most from automated safeguards) and requiring AI’s *output* to be universally visible, we preserve ~80% of these benefits while mitigating skill atrophy.  

  ### 4. Implementation & Review  
  - **Training:** All engineers complete a module on "Critical Use of AI Tools" (includes epistemic risk case studies).  
  - **Calibration:** Quarterly review of AI false positives/negatives and random audits of manual reviews.  
  - **Reassessment:** Policy effectiveness reviewed in 6 months, with skill assessments for junior engineers.  

  This approach respects the CTO’s imperative for consistency and risk reduction while proactively preventing the deskilling feared by senior engineers. It positions AI as a *catalyst* for skill development—not a crutch.  

  **Vote scheduled for Friday. Prepared to discuss amendments.**  

  ---  
  **Approved by:** [Your Name/Chair], Engineering Standards Committee  
  **Distribution:** Committee Members, CTO, VP of Engineering
