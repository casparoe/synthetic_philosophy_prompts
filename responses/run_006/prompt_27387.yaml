  Alright, let's tackle this user's query. They're in a reading group and someone summarized Walzer's moral equality of combatants doctrine. The user feels something's off but can't pinpoint it. First, I need to recall Walzer's actual position. He does argue for the moral equality of combatants, meaning soldiers on both sides have the same rights and permissions in combat. But the key here is the distinction between jus ad bellum (justice of going to war) and jus in bello (conduct in war). 

  The summary claims Walzer says the war convention is "completely symmetrical." But Walzer's symmetry is about combatants' status during war, not the overall justice of their cause. The user’s friend says soldiers on the unjust side have the same moral permission to kill as those on the just side. Walzer does say that, but the reason given—ignorance and propaganda—isn't Walzer's main argument. Walzer's point is about the role-based obligations of soldiers, not their epistemic state. 

  Then there's the claim that killing in an unjust war is like self-defense. Walzer wouldn't agree here; he maintains that soldiers on the unjust side are still morally responsible for their participation, even if they don't violate in bello rules. The analogy to international law is correct, but the implication that soldiers aren't morally tainted at all is wrong. Walzer acknowledges a moral burden even if they follow the rules. 

  The user might be confused because the summary mixes valid points with misinterpretations. They need clarity on where Walzer's arguments actually lie versus where the summary distorts. The user's deeper need is to understand the nuances of just war theory, especially moral responsibility in unjust wars. They might also want to articulate these distinctions in their reading group confidently. So, breaking down each claim, highlighting accurate vs. distorted parts, and clarifying the moral taint point is crucial.
answer: |-
  Your reading group's summary captures Walzer's core symmetry claim but distorts his reasoning and overstates the moral implications regarding taint. Here's the breakdown:

  1.  **"Walzer says the war convention is completely symmetrical. A soldier on the unjust side has exactly the same moral permission to kill enemy soldiers as a soldier on the just side, so long as he follows the rules of engagement."**
      *   **Defender's View:** **Broadly Acceptable, with Nuance.** This is Walzer's central, controversial thesis regarding *jus in bello* symmetry. He argues combatants on both sides possess an *equal legal and moral right* to fight and kill enemy combatants, provided they adhere to the laws of war (discrimination, proportionality). The symmetry lies in their mutual status as combatants licensed to use violence.

  2.  **"The reason is that ordinary soldiers can't be expected to know whether their country's cause is just — they've been fed propaganda, they're not in a position to second-guess their government, and they'd be punished for refusing."**
      *   **Defender's View:** **Significant Distortion.** This is **not** Walzer's *primary* or sufficient justification. While he acknowledges these factors (ignorance, duress, socialisation), his *core argument* is **structural and role-based**. Soldiers are *institutionally* stripped of their peacetime moral autonomy by the state. They become instruments of state policy, bound by professional duty and the reciprocal threat posed by enemy combatants. Their *role* as combatants, not primarily their epistemic state, grounds the symmetry. Ignorance/duress *supplements* this but isn't the core reason why the permission exists.

  3.  **"So their ignorance excuses them, and because they're excused, killing an opposing soldier in an unjust war is no more wrong than killing in self-defence."**
      *   **Defender's View:** **Distortion.** Walzer does **not** argue that killing by an unjust combatant is "no more wrong than killing in self-defence." Self-defence implies an immediate, unjust threat. Walzer's point is that killing an enemy combatant *is justified* for *both sides* **because** the enemy combatant is a *present, immediate threat* posing lethal danger. The justification stems from the combatant's status as a legitimate target *at that moment*, engaged in hostilities, irrespective of the overall justice of their cause. Ignorance/duress *mitigates blameworthiness for participating in the unjust war*, but the permission to kill *in combat* stems from the mutual combatant relationship and the immediate threat, not purely from being excused.

  4.  **"Really the whole doctrine is just a restatement of international law, which treats all combatants alike."**
      *   **Defender's View:** **Broadly Acceptable, with Clarification.** Walzer explicitly grounds his moral argument for symmetry in the existing structure of the laws of war (positive international law). He argues this legal symmetry *reflects* a deeper moral reality about the combatant role and mutual threat in war. He aims to provide a *moral foundation* for the existing legal convention, not merely describe it.

  5.  **"And it implies that someone who fights for an aggressor state isn't morally tainted at all, even if the war itself is a crime."**
      *   **Defender's View:** **False Implication.** This **does not follow** from Walzer's accurate position and he explicitly **rejects** it. While Walzer grants unjust combatants the *right to fight* (jus in bello immunity and permission), he **emphatically states** they fight for an unjust cause. He argues they *do* bear **moral responsibility for their participation** in that crime of aggression (jus ad bellum), even if they fight cleanly. They participate in an evil enterprise. The symmetry of combatant status *does not erase* the underlying injustice of their cause or their complicity in it. They are morally liable for *joining/fighting in the war*, even if not for individual killings of enemy soldiers *in combat*. Walzer discusses the "moral burden" unjust soldiers bear.
