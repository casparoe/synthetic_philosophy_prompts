  Looking at their judgments, I notice they consistently find deception in cases where the speaker exploits an implicature to create a false belief (cases 1,4,5) but not in others (2,3,6,7). What's interesting is how they distinguish between "misleading" (case 1) and "lying" (case 4) despite both involving deception.

  Hmm... their reaction to case 4 is particularly strong - they feel it's morally equivalent to lying even though it's technically truthful. That suggests the speaker's intention to dodge accountability matters. In case 4, saying "I don't like cake" while true, is clearly irrelevant to whether they ate it - it's a deflection. Whereas in case 1, "some passed" is technically relevant information (though unhelpfully minimal).

  For the politician case... "no plans at this time" feels like classic weasel words. The user's principles would likely condemn this as deceptive similar to case 1 - the politician is exploiting technical truth to imply something false (that taxes won't rise). But it's not as bad as case 4 because there's no active bait-and-switch with an irrelevant truth.

  The user seems to care about: whether the literal statement is relevant (case 4's irrelevance makes it worse), whether the implicature is reasonable (case 3's damning-by-praise is conventional), and whether the speaker capitalizes on predictable misunderstanding (all deceptive cases do this).

  Their struggle with the politician case is understandable - it sits right on the edge of technical truth and intentional misleading. Under their framework, I'd say it's deceptive like case 1, but with extra cynicism because politicians are expected to use such dodges.
answer: |-
  Based on your detailed case judgments, your intuitions about deceptive implicature stem from a combination of two core principles concerning the speaker's **intent** and the **relevance** of their utterance:

  1.  **Exploitative Intent Principle:** An implicature is deceptive when the speaker *intentionally exploits* a predictable conversational assumption or inference to create or sustain a *false belief* in the hearer. The speaker relies on the hearer drawing a natural but *incorrect* inference.
  2.  **Relevance Misdirection Principle:** The deceptive potential is amplified (and feels more like lying) when the speaker makes a literally true statement that is *irrelevant* or *distracting* to the question asked, thereby actively *deflecting* the hearer from the truth.

  **Applying the principles to your cases:**

  *   **Deceptive (1, 4, 5):** Violate both principles.
      *   **Case 1:** "Some passed" exploits the scalar implicature ("some" implies "not all") to create the false belief some failed. It's minimally relevant (it answers "did any pass?" with "yes, some") but exploits the expected inference *away* from the fuller truth (all passed).
      *   **Case 4:** "I don't like cake" exploits the assumption that disliking cake is a reason not to eat it (making it irrelevant to *whether you ate it*) to create the false belief you didn't eat it. The irrelevance makes it feel like lying – it's a bait-and-switch using a true but distracting fact.
      *   **Case 5:** "I saw her with a man" exploits the assumption "a man" means "not her husband" to create the false belief of infidelity. It's relevant ("Did you see her?" "Yes, at the cinema") but exploits the inference *about the man's identity*.
  *   **Non-Deceptive (2, 3, 6, 7):** Do not violate the Exploitative Intent Principle for deception. The implicatures are reasonable inferences the speaker intends the hearer to draw, based on shared norms (politeness, relevance, damning with faint praise). No false belief is intentionally created.
      *   **Case 2:** Implicates a request based on relevance/politeness norms. True belief about temperature communicated.
      *   **Case 3:** Implicates Jones isn't good (using the convention of damning with faint praise). True belief about his inadequacy communicated indirectly.
      *   **Case 6:** Implicates a substantive (and arguably objectionable) moral claim about business norms. The speaker likely *intends* this implication to be drawn.
      *   **Case 7:** Implicates the restaurant isn't good *as a restaurant* by highlighting an irrelevant feature (opening hours). The speaker intends this negative evaluation to be inferred.
  *   **Literal (8):** No significant implicature beyond the literal meaning.

  **Distinguishing Case 1 (Misleading) from Case 4 (Lying-equivalent):**
  *   **Case 1 (Misleading):** The statement ("Some passed") is *minimally responsive* and *technically relevant* to the question ("Did any pass?"). It exploits the scalar implicature to imply "not all", but the statement itself isn't a blatant deflection. The wrongness lies in the calculated omission and exploitation of inference.
  *   **Case 4 (Lying-equivalent):** The statement ("I don't like cake") is **actively irrelevant** to the direct question ("Did you eat it?"). It doesn't just omit truth; it *substitutes* an irrelevant truth, exploiting the inference that dislike precludes eating. This irrelevant deflection feels like a more active deception, closer to lying, because it doesn't even *attempt* to address the question posed – it deliberately changes the subject using a true fact. The **Relevance Misdirection Principle** explains why this feels worse.

  **The Politician Case: "I have no plans to raise taxes at this time." (Knowing they will announce a rise next month, no formal plan yet.)**

  1.  **Exploitative Intent:** Absolutely present. The politician knows the hearer will infer "no tax rise is imminent/planned" from "no plans at this time". They rely on this natural inference, knowing it will be false.
  2.  **Relevance Misdirection:** High. The statement is technically responsive but exploits the phrase "at this time" and the concept of "plans" (implying formal, documented intentions) to deflect from the *substance* of their intention (to raise taxes soon). It's a classic evasion using weasel words.
  3.  **Verdict:** This is **deceptive implicature**, clearly violating the Exploitative Intent Principle. The Relevance Misdirection is strong, making it feel manipulative and dishonest.
  4.  **Comparison:** It feels **more like Case 4 than Case 1**. Like Case 4, it uses a technical truth ("no formal plans exist *right now*") that is largely *irrelevant* to the substance of the question ("Will you raise taxes?"). The question is about future action; the answer focuses narrowly on the current state of planning documentation. This irrelevant deflection makes it feel particularly weaselly and deceptive, akin to changing the subject – similar to how "I don't like cake" deflects from "Did you eat it?". It's worse than Case 1 because the deflection is more central and the implicature ("no rise coming") is the *primary* intended message, whereas in Case 1, "some passed" is at least a true answer to a sub-question.

  **Assessment of Principles:**

  These two principles – **intentional exploitation of inference to create false belief** and the **aggravating factor of using irrelevant truths to deflect** – effectively capture all your verdicts without obvious gerrymandering. They explain the deceptive/non-deceptive divide and the distinction between misleading and lying-equivalent cases. They also handle the politician case intuitively.

  **If Forced to Suggest a Verdict Overturn:**

  The hardest fit might be **Case 3 (Jones' reference)**. Some might argue that if the *speaker* knows Jones *isn't* poor but merely mediocre, and intends the faint praise to imply he's *terrible*, this could be slightly deceptive (exploiting the convention to imply something stronger than true). However, your verdict (not deceptive, just indirect truth) is solid if we assume the speaker intends the implicature ("Jones isn't good") accurately, based on their true belief that Jones is poor. The principle holds as long as the implicature conveys what the speaker believes to be true, even if indirectly. Stick with your verdict on Case 3. The other cases align well.
