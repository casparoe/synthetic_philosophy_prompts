answer: |-
  Here's a coherent principle that captures your intuitive verdicts across these cases, explains why blame dissolves in some cases but not others (especially Case 2 vs. Case 7), and clarifies the trickier cases like corporate blame:

  **The Principle: Reactive attitudes (like resentment/blame) are fitting when:**
  **(1) An agent caused harm or violated a norm; AND**
  **(2) The agent had *normative competence* at the time of action; meaning:**
      **(a) They had the *capacity* to understand the relevant norms and the foreseeable consequences of their actions; AND**
      **(b) They had a *fair opportunity* to regulate their behavior according to those norms, given their circumstances.**

  **This principle relies on a distinction between *causal control* (could they physically have done otherwise?) and *normative competence* (were they functioning as a capable moral agent in that moment?).**

  **Applying the Principle to Your Cases:**

  1.  **Coworker Misremembers:** (1) Harm occurred. (2) BUT condition (2a) fails: He *lacked* the capacity to understand he was taking your idea (he genuinely thought it was his). **Blame dissolves.** Correct verdict.
  2.  **Coworker with Brain Tumor:** (1) Harm occurred. (2) BUT conditions (2a) *and* (2b) likely fail: The tumor severely compromises his capacity to understand norms/his actions *and* his ability to regulate his behavior. He lacks normative competence. **Blame dissolves.** Correct verdict. *Contrast with Case 7: The tumor removes competence; drunkenness doesn't inherently remove it.*
  3.  **Friend with Depression:** (1) Harm occurred (bailing). (2a) Capacity: Likely intact *in principle* (she understands norms of communication). (2b) Fair Opportunity: **Severely diminished.** Depression massively impacts energy, motivation, executive function. **Result:** Full-blooded resentment/blame dissolves because (2b) is significantly compromised. However, a *residue* of frustration/expectation remains because (2a) is intact – we still expect a basic level of communication *if possible*, recognizing the severe constraint. **The residue reflects a *need* or *expectation* (I *needed* a text), not full moral condemnation.** This matches your intuition. The residue *is* a reactive attitude (disappointment, frustration directed at the agent), but a mitigated one.
  4.  **Four-Year-Old:** (1) Harm occurred. (2) BUT (2a) and (2b) are significantly underdeveloped. They lack full capacity to grasp complex norms/consequences and have less developed impulse control/regulation. **Result:** Indignation might flash (responding to harm), but full moral resentment/blame is *inappropriate* because they lack full normative competence. Correct verdict.
  5.  **Corporate Dumping:** (1) Harm occurred. (2) **Problem:** Corporations aren't agents with minds in the Strawsonian sense. They lack inherent "normative competence." **Result:** Your anger is real and morally significant, but it's **not the same reactive attitude** as blaming an individual agent. It's:
      *   **Condemnation of the institutional policy/decision-making structure** that caused harm.
      *   **A demand for accountability** (legal, financial, structural change).
      *   **Moral outrage** directed at the *collective action* or the *system*, not a singular blameworthy mind. It *feels* like blame because the harm is intentional (by the system) and demands response, but the *target* is fundamentally different. Strawson's framework struggles here.
  6.  **Cultural Context:** (1) *Perceived* harm occurred (feeling slighted). (2a) BUT condition (2a) fails *objectively*: The agent *did* have the capacity, but applied a different norm system. You lacked knowledge of that system. **Result:** Your initial feeling was **fitting-from-your-perspective** (given your norms and knowledge) but **not fitting simpliciter** (given the actual norms and the agent's understanding). Learning the truth dissolves it correctly. **Yes, reactive attitudes can be subjectively fitting but objectively unfitting.** Correct verdict.
  7.  **Drunken Friend:** (1) Harm occurred (betrayal). (2) **Normative Competence:** This is key.
      *   **(2a) Capacity:** While drunk, their capacity was *impaired*, likely not *destroyed* like the tumor victim. They likely retained *some* grasp of the norm (secrecy) and foreseeable consequence (hurt).
      *   **(2b) Fair Opportunity:** **Crucially, they *chose* to get drunk.** This is where it differs from Case 2 (tumor) and Case 3 (depression). Before drinking, they had the full capacity and fair opportunity to avoid putting themselves into a state where their normative competence would be impaired. Getting drunk was a prior voluntary act (or pattern of choices) that created the impairment. **Result:** Blame *survives* because the impairment stems from a prior choice where normative competence was intact. You blame them *for* the carelessness *manifested* in drunkenness, rooted in their prior choices. This matches your intuition. Determinism is irrelevant here; we hold people accountable for actions flowing from their character/choices, even if those choices were determined.

  **Distinguishing Case 2 (Tumor) from Case 7 (Drunkenness):**
  *   **Tumor:** The lack of normative competence is **externally caused and unchosen**. The person did nothing to bring it about and had no fair opportunity to avoid its effects *as an agent*.
  *   **Drunkenness:** The impairment of normative competence is **a foreseeable consequence of their own prior choices** (to drink excessively). They had fair opportunity *not to impair themselves*.

  **What You Might Need to Give Up (or Refine):**

  1.  **Case 3 (Depression Residue):** The principle perfectly explains the *dissolution* of full blame and the *presence* of the residue (unmet expectation/need). However, it might force you to clarify that this residue **isn't full moral blameworthiness**. It's a legitimate reactive attitude stemming from harm and a basic expectation that persists even under diminished opportunity, but it lacks the full force of condemning the *character* or *agency* in the way blame for a competent, unconstrained agent would.
  2.  **Case 5 (Corporate Blame):** The principle forces the conclusion that anger at the *corporation itself* is **not identical** to the Strawsonian reactive attitude directed at an individual agent. It's moral outrage and a demand for accountability, but it lacks the interpersonal, participant-reactive structure Strawson described. You'd need to accept that we use "blame" metaphorically or in a broader sense here.
  3.  **Absolute Control:** The principle implicitly rejects the idea that blame requires ultimate, contra-causal freedom. It focuses on competence and opportunity *within* the causal chain.

  **In Summary:**

  Your pattern of verdicts is best captured by a **Normative Competence** principle: Blame requires an agent caused harm *while* possessing the capacity and fair opportunity to understand and abide by the relevant norms. Factors like ignorance (Case 1), severe internal disruption (Case 2), extreme developmental immaturity (Case 4), and unchosen severe impairment (Case 3) negate competence or opportunity. Cultural misunderstanding (Case 6) negates the objective fittingness. Prior choices leading to impairment (Case 7) preserve blame. Corporate "blame" (Case 5) is real moral outrage but structurally different from interpersonal reactive attitudes. The residue in Case 3 is a mitigated reactive attitude reflecting a persistent need, not full moral condemnation.

  This principle is coherent, explains the key distinction between Case 2 and Case 7, and only requires minor refinements regarding the *degree* of blame in Case 3 and the *nature* of blame in Case 5. It aligns with a broadly Strawsonian compatibilist view but sharpens the focus on competence and opportunity.
