  *lightbulb* Ah! The drunken friend case works because we hold people accountable for acquiring competence (like managing alcohol) even if specific acts are determined. Whereas tumor victims didn't choose their condition. That preserves the intuition without denying determinism. Corporate blame then becomes metaphorical - we're blaming the decision-making structure, not literal group minds.

