  We are creating a 9-question quiz to sort people into five positions on vagueness: 
   1. Epistemicism: There is a sharp boundary, but we can't know it.
   2. Supervaluationism: Truth is a matter of how we sharpen the vague term (by precisifying it in multiple ways); a statement is true if it's true in all sharpenings, false if false in all, and neither otherwise.
   3. Many-valued/Degree theories: Truth comes in degrees (e.g., 0.7 true) and vague predicates have degrees of application.
   4. Contextualism: The meaning of vague terms depends on context and can shift.
   5. Nihilism about vagueness (sometimes called the "no sharp boundaries" view in a different way, but here meaning that vague terms have empty extensions? Actually, the view that nothing is a heap is sometimes called "ontic vagueness" or "vagueness as semantic indecision" but note: the view that "strictly speaking, nothing is a heap" is more associated with a nihilistic response to the paradox). Let's call this "Vague Term Nihilism" (VTN) for now: the idea that vague terms fail to refer to any precise set, so nothing is truly a heap (or bald, etc.) in a precise sense.

   However, note that the positions are not all mutually exclusive in every aspect and some combinations of answers might not fit perfectly.

   We must design concrete cases that force choices that reveal the underlying commitments.

   Important distinctions to capture:

   - Epistemicism: Believes in a sharp cutoff (e.g., exactly n grains is a heap, n-1 is not) but unknown. So they will accept that there is a specific point, even if they can't say which.
   - Supervaluationism: For borderline cases, the statement is neither true nor false. So they will reject that there is a specific cutoff and also reject that borderline cases are true (or false). But they accept that for any sharpening there is a cutoff.
   - Many-valued: Borderline cases have a truth value between true and false. So they might say "sort of" or "partly".
   - Contextualism: The answer can change depending on context (even in the same situation, if the context shifts). But note: contextualism is often combined with supervaluationism or other views. We are looking for patterns that show context-sensitivity in the way the subject uses the term.
   - VTN: They will deny that there are any heaps at all (or any bald people, etc.) because the term is too vague to have a non-empty extension.

   We also note that views can be combined. For instance, one can be a contextualist and a supervaluationist. So we need to design questions that can tease apart the core commitments.

   We'll design 9 questions with 2-3 options each. We'll try to have a mix of everyday examples and software examples.

   Let's sketch the questions:

   1. Heap Paradox Classic:
      Scenario: You have a heap of sand. You remove one grain at a time. At what point does it stop being a heap?
      Options:
        A. There is a specific number N such that after removing N grains it stops being a heap, but we can never know what N is.
        B. There is no specific number; it gradually becomes less and less of a heap until it's clearly not a heap. But for any particular removal, we can't say that one grain made the difference.
        C. Actually, strictly speaking, nothing is a heap because "heap" is too vague.

   2. Baldness:
      Scenario: Bob has 10,000 hairs on his head. He loses one hair every day. On which day does he become bald?
      Options:
        A. There is a specific day when he becomes bald (though we can't know which).
        B. He gradually becomes balder; there is no single day that makes the difference, but after a period of being borderline, he becomes bald. However, for any given day, we can't point to the exact hair loss that did it.
        C. No one is ever bald because "bald" is too vague.

   3. Color Spectrum (from red to orange):
      Scenario: We have a sequence of 100 color swatches, starting with pure red (swatch 1) and ending with pure orange (swatch 100), with each step being a barely noticeable change. Which swatches are red?
      Options:
        A. There is a specific swatch N such that swatches 1 to N are red and N+1 to 100 are not.
        B. The early swatches are definitely red, the late ones are definitely not, and there's a range in the middle that are borderline (neither red nor not red, or both partially red and partially orange).
        C. None of the swatches are truly red because the boundary is vague.

   4. TODO comments becoming tech debt:
      Scenario: In a codebase, every time a developer writes a TODO comment, they are adding a small amount of potential tech debt. At what point does the collection of TODO comments become tech debt?
      Options:
        A. There is an exact number of TODO comments at which it becomes tech debt, but we can't know it.
        B. It becomes tech debt gradually; each TODO adds a little bit, and there's no sharp boundary. Some amounts are clearly tech debt, some are clearly not, and in between it's vague.
        C. TODO comments are never tech debt because "tech debt" is too vague.

   5. Refactor vs. Rewrite:
      Scenario: A developer is changing a piece of code. They start by making small refactors and gradually change more until they have effectively rewritten the entire module. At what point does it become a rewrite?
      Options:
        A. There is a specific line of code changed that turns it from a refactor to a rewrite.
        B. It becomes a rewrite gradually; there is no sharp boundary. Some changes are clearly refactors, some are clearly rewrites, and some are in between.
        C. There is no such thing as a rewrite because the term is too vague.

   6. Richness (a classic):
      Scenario: How much money makes someone rich? Suppose we add one dollar at a time to a person's net worth.
      Options:
        A. There is a specific dollar that makes them rich.
        B. There is a range of net worth where it's vague whether they are rich or not, and no single dollar makes the difference.
        C. No one is rich because "rich" is too vague.

   7. Mountain vs. Hill:
      Scenario: We have a pile of dirt. We add dirt one shovelful at a time. At what point does it become a mountain?
      Options:
        A. There is a specific shovelful that makes it a mountain.
        B. It becomes a mountain gradually; there is no sharp boundary. Some sizes are clearly hills, some are clearly mountains, and in between it's vague.
        C. Nothing is a mountain because the term is too vague.

   8. Context shift in heap:
      Scenario: In a conversation about a sandcastle, a small pile of sand might be called a heap. In a conversation about a construction site, that same pile would not be called a heap. Does this mean that the same pile of sand can be a heap in one context and not in another?
