  Make it nine questions. Each question should be a concrete case with two or three answer options, not a question about labels. So don't ask anything like "do you think truth comes in degrees"; ask about a specific pile of sand, a guy's hairline, a run of color swatches, whatever. I'd love at least one or two software-flavored cases too — like at what point a pile of TODO comments becomes tech debt, or when a refactor becomes a rewrite — since my friends are mostly engineers. The point is to sort people by how they actually answer cases, not by which position they think sounds cool.

  The scoring key should map answer patterns onto these positions: epistemicism, supervaluationism, many-valued/degree theories, contextualism, and the view that vague terms are empty (like, strictly speaking nothing is a heap — I think that's a real view but I don't know its name). For each position, give me its signature pattern of answers, and say what to do with someone whose answers are mixed. Also start from the answer combinations themselves and then place the named positions in that space: if some combination of answers has nobody living in it, tell me whether that's because the view is incoherent, just unappealing, or maybe just unexplored. And flag any two positions the quiz can't cleanly seperate and why.

  One more thing: the questions should force choices that actually distinguish these views. I don't want a quiz where everyone comes out as "contextualist" because the cases all have an "it depends" option. Put some pressure on the weird commitments — like whether there's an exact number of hairs where "bald" flips even if nobody can know it, whether "sort of a heap" means "partly true" or just "not settled," and whether anyone is ever really bald at all.
