answer: |-
  ## Epistemic Stance Sorter: Which View of Knowledge Do You Hold?

  **Instructions:** For each scenario, consider whether the protagonist ("S") knows the stated proposition. Choose the answer that best reflects your intuitive judgment. There are no trick questions; go with your gut feeling about whether S *really knows* in each situation.

  1.  **The Lottery Ticket:** S buys a single ticket for a massive, fair lottery with millions of tickets. S hasn't heard any results yet. S thinks: "My ticket is a loser."
      *   **(A)** S knows their ticket is a loser.
      *   **(B)** S does *not* know their ticket is a loser.

  2.  **The Zebra:** S visits a well-run, reputable zoo. S sees a black-and-white striped equine animal in the zebra enclosure. S thinks: "That animal is a zebra."
      *   **(A)** S knows it is a zebra.
      *   **(B)** S does *not* know it is a zebra (because, for all S knows, it *could* be a cleverly painted mule).

  3.  **County:** S is driving through Fake Barn County, where most objects that look like barns are actually just barn façades. Unbeknownst to S, they are currently looking at one of the few *real* barns in the county. S thinks: "That is a barn."
      *   **(A)** S knows it is a barn.
      *   **(B)** S does *not* know it is a barn.

  4.  **The Method:** S believes it will be sunny tomorrow based on looking at a reliable weather forecast. However, S realizes that *if* it were *not* going to be sunny tomorrow, the weather forecast (which is sometimes wrong) would *still* have said it would be sunny.
      *   **(A)** S knows it will be sunny tomorrow (despite the method's unreliability in that counterfactual).
      *   **(B)** S does *not* know it will be sunny tomorrow (because the method would have given the same belief even if false).

  5.  **Low Stakes:** S is walking to the library on a normal weekday. S sees the library is brightly lit and open. S thinks: "The library is open." S has no urgent need to use the library.
      *   **(A)** S knows the library is open.
      *   **(B)** S does *not* know the library is open.

  6.  **High Stakes:** S urgently needs a specific rare book from the library *today* to avoid a catastrophic outcome. S sees the library is brightly lit and open. S thinks: "The library is open." S knows libraries sometimes close unexpectedly for minor reasons (cleaning, staff shortages).
      *   **(A)** S knows the library is open.
      *   **(B)** S does *not* know the library is open.

  7.  **The Entailment (Part 1):** S is sitting in their living room, looking at their own two hands. S thinks: "I have hands."
      *   **(A)** S knows they have hands.
      *   **(B)** S does *not* know they have hands.

  8.  **The Entailment (Part 2):** S is sitting in their living room, thinking "I have hands." S realizes that having hands entails "I am not a handless brain in a vat being fed experiences of having hands by a supercomputer."
      *   **(A)** If S knows they have hands (from Part 7), then S *also* knows they are not a handless brain in a vat.
      *   **(B)** S might know they have hands (from Part 7), but S does *not* know they are not a handless brain in a vat.

  9.  **The Non-Salient Alternative:** S receives a package from their reliable friend, Jones. Jones always sends packages via FedEx. S sees the tracking shows "Out for Delivery." S thinks: "Jones sent the package via FedEx." Unbeknownst to S, Jones *did* send it via FedEx. However, Jones *could* have easily used UPS instead this time (though they didn't), and S hasn't considered UPS at all.
      *   **(A)** S knows Jones sent the package via FedEx.
      *   **(B)** S does *not* know Jones sent it via FedEx (because the unconsidered UPS possibility hasn't been eliminated).

  ---

  ### Scoring Key & Interpretation

  **Step 1:** Tally your answers.

  **Step 2:** Use the combination of your answers to identify the general epistemic position you hold:

  *   **Mostly A (7,8,9) + A (1,2,3,4) + A (5) + A (6): Moorean Invariantism (Closure-First)**
      *   You strongly endorse closure: If you know P, and know P entails Q, then you know Q. Skeptical possibilities (like BIVs) don't defeat everyday knowledge if properly deduced. Knowledge doesn't require sensitivity to remote possibilities (Lottery, Zebra, Fake Barns pass) or reliability in *all* close counterfactuals (The Method). Standards for knowledge are invariant; stakes don't matter (High Stakes/Low Stakes same).

  *   **Mostly A (7,8) + B (1,2,3,4) + A (5) + A (6) or B (6): Dretskean Relevant Alternatives**
      *   You accept closure for *relevant* alternatives. Skeptical possibilities (BIV) are irrelevant and don't need elimination to know ordinary things (Zebra, Hands). However, salient (Lottery) or contextually relevant (Fake Barns) possibilities *do* defeat knowledge if uneliminated. Knowledge doesn't require global sensitivity (The Method) but only ruling out relevant alternatives. Stakes *might* affect which alternatives are relevant (High Stakes B is possible).

  *   **B (1) + A (2) or B (2) + B (3) + B (4) + A (5) or B (5) + A (6) or B (6) + A (7) + B (8): Nozickian Tracking (Sensitivity)**
      *   You reject closure for knowledge (B on 8 is key, even if A on 7). Knowledge requires *sensitivity*: S wouldn't believe P if P were false (B on Lottery, Fake Barns, The Method). Non-salient alternatives only matter if they create insensitivity (Zebra A or B possible depending on setup). Stakes don't directly affect knowledge itself (A or B on 5/6 possible independently), though they might affect belief formation.

  *   **A (1) + A (2) + A (3) + A (4) or B (4) + A (5) or B (5) + A (6) or B (6) + A (7) + A (8): Safety-Based Epistemology**
      *   You strongly endorse closure (A on 8). Knowledge requires *safety*: S couldn't easily have been wrong. Lottery tickets *are* safe to believe they lose (A on 1). Ordinary perception (Zebra, Hands) is safe. Fake Barns is *unsafe*, so B on 3. The Method (Q4) depends on how close the "wrong forecast" scenario is (A or B possible). Stakes don't directly affect safety (A or B on 5/6 possible independently).

  *   **A (5) + B (6): Contextualism / Interest-Relative Invariantism**
      *   Your key divergence is on stakes. You think the standards for "knows" *shift* depending on practical context. In Low Stakes, S knows (A5), but in High Stakes, the raised standards mean S doesn't know (B6). Your answers to other questions will determine which *type* of shifting-standard view you hold (compatible with Dretskean, Safety, or other frameworks for handling alternatives/sensitivity).

  **Unoccupied Combinations & Notes:**

  *   **Requiring Sensitivity (B1, B3, B4) AND Accepting Closure (A8):** Incoherent. Sensitivity explicitly rejects closure for skeptical possibilities (Nozick's core argument). You likely hold a Safety view or misapplied sensitivity.
  *   **Rejecting Closure (B8) AND Requiring Safety (B3):** Possible but unattractive/rare. Safety theorists typically embrace closure. This might indicate an inconsistent mix or a very specific view.
  *   **Rejecting Closure (B8) AND Ignoring Non-Salient Alternatives (A2, A9):** Unexplored. Nozickians often worry about non-salient alternatives when they create insensitivity.
  *   **Separation Challenge:** The quiz cleanly separates positions based on key commitments (Closure: 7+8, Sensitivity: 1+3+4, Relevant Alternatives: 2+3, Stakes-Shifting: 5+6). The hardest separation is between strict Mooreans and Safety theorists on Lottery (Q1) and Fake Barn (Q3) – Mooreans say A1 and A3, Safety says A1 and B3. Contextualism/IRI overlays on other views via Q5/Q6.
