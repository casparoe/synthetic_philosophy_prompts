answer: |-
  That's a brilliantly observed pattern, and you're absolutely right to see it as highlighting a core tension in how we conceptualize disease. Philosophers of medicine have indeed grappled intensely with this two-way drift, though it doesn't have a single, universally agreed-upon name. Your intuition that it goes beyond simple "medicalization" is spot on – medicalization primarily describes the *expansion* of the medical domain to encompass previously non-medical problems (your first direction), often driven by factors like new treatments, pharmaceutical interests, or cultural shifts. The reverse process (your second direction) is often called **demedicalization** or **normalization**, where a condition loses its disease status despite unchanged biology, frequently due to high prevalence changing societal perceptions of what constitutes "normal" or "harmful."

  What you're describing is the dynamic interplay between these forces, revealing how disease classification hinges on pragmatic and normative factors alongside biological ones. Several key philosophical frameworks help dissect this:

  1.  **The Challenge to Naturalism (Boorse's Biostatistical Theory):** Christopher Boorse famously argued that disease is a value-free scientific concept: a *dysfunction* (departure from normal species functioning) causing reduced survival/reproduction. Your examples directly challenge this. High prevalence in aging populations (like mild arthritis or presbyopia) often *is* statistically "normal" for that age group under Boorse's definition, potentially pushing it out of disease status. Conversely, a treatable "dysfunction" might have been statistically normal but unnoticed or unaddressed before treatment existed. The biology didn't change, but our *practical engagement* and *statistical framing* did.

  2.  **The Role of Harm and Values (Normativism & Hybrid Theories):** Philosophers like Nordenfelt or Culver & Gert emphasize that disease requires not just biological abnormality, but also **harm** to the individual. Wakefield's influential "harmful dysfunction" theory explicitly combines a factual component (dysfunction - a failure of a naturally selected mechanism) and an evaluative component (harm - judged by social values).
      *   **New Treatments & Disease Status (Your First Direction):** A treatable condition becomes more readily perceived as *harmful*. Before treatment, suffering might be resigned to "bad luck" or "normal variation." Once alleviation is possible, that same suffering is re-evaluated as unacceptable *harm*, solidifying its disease status. The *dysfunction* might have been present but overlooked or tolerated; treatment makes the *harm* salient and actionable.
      *   **High Prevalence & Loss of Disease Status (Your Second Direction):** When a condition becomes extremely common (e.g., hypertension in older populations, or perhaps mild cognitive changes), societal perceptions of what constitutes "harm" or "normal function" can shift. It becomes statistically normative, and the *harm* might be downplayed ("just part of getting old") or reframed as a "risk factor" for other harms rather than a disease state itself. The underlying dysfunction remains, but the evaluative judgment of its significance changes.

  3.  **Pragmatism and Conceptual Flexibility:** Philosophers like Peter Schwartz argue for "disease pragmatism." Concepts of disease are tools for achieving medical goals (preventing suffering, death, disability). Classification shifts because these practical goals evolve. A treatable condition becomes a "disease" because we now have a tool to achieve a medical goal regarding it. A highly prevalent condition might be reframed because labeling everyone with it as "diseased" is no longer pragmatically useful; focusing on managing risk or adapting expectations becomes the more effective strategy. Marc Ereshefsky's work on eliminative pluralism also highlights that rigid categories like "disease" may be less useful than context-specific classifications serving different purposes.

  **What to Call This Two-Way Drift?**
  While there isn't one perfect term, describing it as the **normative-pragmatic drift in disease classification** captures the essence. The "status" of a condition as a disease or not depends heavily on:
  *   **Normative Judgments:** Societal values about harm, normalcy, and acceptable function.
  *   **Pragmatic Factors:** The existence and efficacy of interventions, prevalence rates, and the practical goals of medicine at a given time.
  *   **Biological Grounding:** The underlying biology is necessary but insufficient; it provides the substrate that is *interpreted* through these normative and pragmatic lenses.

  **Bearing on Natural vs. Constructed:**
  This drift is a powerful argument against **strict naturalism** (disease as a purely biological, value-free category). The biology is constant, yet the classification shifts based on non-biological factors (treatability, prevalence influencing norms). However, it also challenges **radical constructivism** (disease as purely a social invention). The underlying biological reality (the dysfunction, the physiological state causing suffering) constrains what *can* be medicalized or demedicalized. We don't arbitrarily call happiness a disease, nor do we demedicalize acute appendicitis no matter how rare it becomes.

  The most compelling view emerging from this is **hybridism** (like Wakefield's) or **pragmatic pluralism**. Disease concepts are **interactive kinds**: they track real biological phenomena (dysfunction, suffering), but *how we delineate, categorize, and respond to* those phenomena is fundamentally shaped by our values, our technological capabilities, and our social context. The "disease status" isn't a fixed essence discovered in nature; it's a *practical status* we assign based on the interaction between biological reality and our human concerns about flourishing, suffering, and what we can (or choose to) do about it.

  Your observation perfectly encapsulates why defining disease remains one of the thorniest and most revealing problems in the philosophy of medicine – it forces us to confront the messy intersection of biology, values, technology, and societal need. The classification isn't static because our understanding, capabilities, and priorities aren't static either.
