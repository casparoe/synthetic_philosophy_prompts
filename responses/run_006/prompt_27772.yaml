prompt: |-
  I've been going back and forth with a friend for months about the Meno problem — specifically why knowledge is worth more than merely true belief when both get you to Larissa just the same. He's a process reliabilist: he thinks the extra value comes from the belief being produced by a reliable process. I lean virtue epistemology: I think the extra value comes from the belief being an achievement, true because of the believer's own competence. We're sick of talking past each other, so we've agreed to do a proper adversarial collaboration, and I'd like you to draft the joint statement we could both sign.

  Make it concrete and gears-level rather than slogan-level. Include:

  - a numbered 'agreed claims' section: factivity, why true belief is valuable, what Gettier cases do and don't show, what the swamping problem actually is, and what a solution would have to look like;
  - a disagreements table with the remaining disputes, each side's view worded so that side would actually sign it, not a caricature from the other side;
  - then the cruxes: the sub-questions such that settling one would move at least one of us. For each crux, give a case or argument we both accept as bearing on it (fake barn, Norman the clairvoyant, chicken-sexers, whatever actually discriminates), and write down in advance what each side predicts the case shows.

  Also flag anywhere you think the disagreement is actually verbal, where tabbooing a word would dissolve it — I'd rather have that than a fake substantive table. And please write the whole thing in British English.
