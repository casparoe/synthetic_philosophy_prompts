  For structure, I'll open with warmth to set a sentimental tone, then gently introduce the science with humor ("scientist brother" as a setup). The middle will explain the principle using wedding examples (dress, venue, vows) as costly signals, explicitly separating human intentionality from animal instincts. I'll add a joke about "not a peacock" to disarm critics. The close will pivot to emotional commitment, celebrating the couple's unique bond beyond theory. 

  Language must be British English: "brilliant," "utterly besotted," "mum" instead of mom. Keep sentences punchy for speech, and balance wit with sincerity. Finally, I'll stress-test metaphors—e.g., clarifying that "cost" isn't financial but emotional—to preempt grandma's worries. The toast should leave everyone smiling, experts nodding, and relatives touched.
