  Right then. Let's craft a toast that walks the tightrope between evolutionary rigour and warm sentiment, keeping Granny happy and the academics chuckling. The key is grounding the science firmly in genuine affection and the *human* meaning behind it.

  **Best Man Toast for [Brother's Name] and [Wife's Name]**

  (Sound glass with spoon. Stand confidently, warm smile.)

  Alright everyone, settle down. For those who don’t know me, I’m [Your Name], [Brother's Name]’s incredibly proud, and slightly terrified, brother. It is my absolute honour to be standing here as his best man today.

  First things first: [Wife's Name], you look absolutely radiant. Stunning. And [Brother's Name]… well, you’ve scrubbed up alright too, mate. More importantly, seeing the two of you together today, the way you look at each other… it’s genuinely brilliant. Utterly besotted doesn’t cover it. Mum’s already used half a packet of tissues, and frankly, I’m not far behind.

  Now, anyone who knows my brother knows his brain runs on a slightly different operating system to most. While the rest of us were figuring out football or… well, actually, mostly football, he was elbow-deep in textbooks about peacocks’ tails, fiddler crab claws, and why gazelles do that daft jumping thing when a lion’s about. **(Light chuckle)**. His world, and now [Wife's Name]’s too, revolves around understanding why animals – including the particularly complex ones called humans – *do* the things they do.

  One of the big ideas in his field is something called the **‘Handicap Principle’** or **‘Costly Signalling’**. Bear with me, I promise this isn’t a seminar! **(Smile reassuringly at non-scientist relatives)**. The basic idea is actually quite beautiful, and it’s perfect for today.

  Imagine a male bird singing his heart out from the highest, most dangerous branch. He’s exposed to predators, using up loads of energy. Seems a bit daft, right? Wasteful, even. But that’s the *point*. That costly, risky song is an **honest signal**. It’s him saying, *"Look how strong and fit I am! I can afford to waste energy and take this risk just to show you!"* It proves he’s the real deal because only a truly top-notch bird could shoulder that cost. It’s not deception; it’s genuine, high-quality advertisement.

  **(Pause, gesture around the room)**

  Now, look around. Look at today. The incredible effort [Brother's Name] and [Wife's Name] have put into planning this. The frankly eye-watering expense – sorry Dad! **(Wink)**. This stunning venue, [Wife's Name]’s breathtaking dress, the mountains of food, the free bar we’re all *thoroughly* testing… **(Raise glass slightly)**.

  Think about the sheer logistics! Getting all of us lot here – some from the other side of the country, some probably dodged work with a dodgy sick note! **(Nod knowingly)**. The stress, the spreadsheets, the seating plan debates… honestly, organising D-Day probably seemed simpler.

  And then there’s the big one. Standing up here, in front of absolutely everyone you know and love, looking each other in the eye, and making those **huge, public vows**. Promising forever. That’s… terrifyingly vulnerable! It’s exposing your deepest commitment to the world.

  **(Lean in slightly, more intimate tone)**

  From a purely practical, bean-counting perspective? Yeah, you could call it a massive, expensive, exhausting, risky… handicap. A huge cost. Why on earth would two sensible, brilliant people like [Brother's Name] and [Wife's Name] put themselves through it all? Couldn't they just have signed a form at the registry office and gone to the pub?

  **(Pause, smile warmly at the couple)**

  **Because that’s the whole point.** That’s the signal. And it’s the most honest, powerful signal there is.

  The expense, the effort, the sheer *scale* of this celebration? It’s not waste. It’s proof. It’s them shouting from their highest, most vulnerable branch, to each other and to all of us: ***"Look! See how much we mean this! See how committed we are! We’re investing everything – our time, our energy, our hearts, a significant chunk of our savings – because this love, this commitment, is worth any cost. It’s real. It’s enduring. And we want the whole world to witness it!"***

  **(Address the couple directly, voice thick with emotion)**

  That cost, that magnificent, glorious handicap you’ve undertaken today, isn’t pointless. It’s the ultimate demonstration of the incredible quality of what you’ve found in each other. It proves, beyond a shadow of a doubt, the depth and sincerity of your commitment. It shows us all that this isn’t just convenient, or fleeting. It’s the real deal. The highest quality bond.

  And Granny… **(Turn towards her with a gentle smile)**… don’t you worry for a second. This isn’t *just* biology. It’s way bigger than a peacock’s tail. What [Brother's Name] and [Wife's Name] have is unique. It’s laughter, shared dreams, mutual respect, stupid in-jokes, unwavering support, and a love that lights them both up from the inside. The science just helps us appreciate the *magnificent scale* of the promise they’re making today. The cost proves the value. And my god, the value is immense.

  So, to my brilliant brother [Brother's Name], and my wonderful new sister [Wife's Name]. May your lives together be filled with joy, adventure, and endless fascinating conversations about animal behaviour (if you must!). May your commitment, so honestly and spectacularly signalled today, only grow deeper and stronger with every passing year.

  **Ladies and Gentlemen, the bride and groom! [Brother's Name] and [Wife's Name]!**

  **(Raise glass high, big smile, lead the applause/cheers)**

  ---

  **Key elements that make this work:**

  1.  **Warmth First:** Opens with genuine affection, compliments, and family humour.
  2.  **Accessible Science:** Explains the handicap principle simply using animal examples everyone can picture (peacock, gazelle).
  3.  **Bridging the Gap:** Explicitly links the science to the *specific* elements of *this* wedding (cost, effort, travel, vulnerability of vows).
  4.  **The Pivot:** Clearly states "That’s the whole point. That’s the signal." Transitions the "cost" from seeming wasteful to being proof of value.
  5.  **Humanising & Sentiment:** Explicitly separates the *metaphor* (the signal) from the *human reality* ("way bigger than a peacock's tail"). Focuses on *their* unique love, laughter, and commitment. Reassures Granny directly.
  6.  **British English:** "Scrubbed up alright", "daft", "bean-counting", "mum", "pub", "my god", "Ladies and Gentlemen".
  7.  **Not Cynical:** Framed entirely as a *celebration* of the cost *because* it proves genuine commitment. The tone is admiring, not mocking.
  8.  **Academics Nod:** Uses the correct terms ("Handicap Principle", "Costly Signalling", "Honest Signal", "differentially costly" is implied in the explanation), links it accurately to the event, and gets the core idea right without delving into equilibrium modelling. They'll appreciate the accurate metaphor.
  9.  **Time:** Structured for roughly 5 minutes when delivered with appropriate pauses and warmth.
  10. **The Close:** Brings it back purely to the couple, their love, and a heartfelt wish for their future.

  **Delivery Tip:** Practice! Hit the pauses, especially after the key science-to-wedding link and the reassurance to Granny. Let the genuine affection for your brother and his wife shine through your voice and face. Good luck!
