  Looking at possible diagnoses, I should consider different angles. Is it about definitions? Both sides use "consciousness" but mean different things—subjective experience vs. cognitive functions. Or is it about explanatory goals? Critics want an account of qualia; Dennett sees that demand as incoherent. Then there's the intuition clash: some have a strong phenomenal intuition, others a mechanistic one. Metaphysical commitments also play a role—physicalism vs. property dualism undertones.

