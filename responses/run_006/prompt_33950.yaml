prompt: |-
  I'm a retired physicist and I've been getting into descision theory lately, and I've been going back and forth on counterfactual mugging for weeks. You know the setup: Omega shows up, says it flipped a coin, and if it had come up heads it would have given you $10,000, but the coin came up tails so now it's asking you to pay it $100. The twist is you only get asked to pay on tails, but the reward was only on heads, and Omega only runs the whole thing if it predicted you'd pay up on tails. I've also been reading about XOR blackmail, which seems like the same kind of problem in a different costume — the blackmailer only sends the letter if they predicted you wouldn't pay, but if you're the kind of person who would pay, you never get the letter and never need to. So in both cases your decision in a branch you're not in determines whether you face a cost in the branch you are in.

  Here's what I want: I want you, as an expert on decision theory, to give me your actual credence that you should pay up in a one-shot counterfactual mugging with a perfect predictor. Not "it depends on your decision theory" — I want a number, and I want the decomposition.

  Specifically, please think carefully and decompose the question into the sub-questions your credence depends on. For each, give me a rough probability and a one-line justification. Then show me how you combine them into a final number. I'm especially interested in these sub-questions:

  - What's your credence that some form of updateless decision theory (UDT, FDT, whatever) is the right normative framework, as opposed to causal or evidential decision theory?
  - Given that an updateless theory is right, what's your credence that it actually recommends paying in this scenario (as opposed to, say, only paying in transparent Newcomb cases but not in counterfactual mugging)?
  - Is the fact that the predictor is "perfect" doing seperate work from the decision-theoretic issue, or does the whole thing collapse if the predictor is merely very reliable? What's your credence that the argument for paying survives a merely-highly-reliable predictor?
  - Where does the money pump / Dutch book / reflectively-inconsistent-over-time force live in your reasoning — is it doing most of the lifting, or is something else?

  Then tell me which sub-question your final number is most sensitive to — the one where if you got new arguments tomorrow, your credence would move the most. And give me a sense of what would move it: a specific argument, a new formal result, a particular thought experiment.

  For context, my own credence is sitting around 0.4 that you should pay, but I keep oscillating, and I think it's because I haven't pinned down what I actually think about the relationship between rational choice and counterfactual branches that don't happen. I'm hoping your decomposition helps me see where the real disagreement with the "obviously you should pay" crowd lives.

  Oh, and before you give me the number, maybe brainstorm a bit about the different ways the problem has been formalized and whether any of the formalizations are actually missing the point — I've seen people talk past each other because they're solving different problems using different implicit assumptions about what "should" means here.
