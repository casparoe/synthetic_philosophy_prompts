    Rule 3: replaces "III" (3 I's) with 'U', so removes 3 I's. So k mod 3: removing 3 I's is subtracting 3, which is 0 mod 3, so residue doesn't change.
    Rule 4: no effect on I's.

  Therefore, we start at 1 mod 3 and every rule preserves that residue mod 3. Since MU requires 0 mod 3, it's impossible.

  Now, the "jumping out of the system": 
  - Inside the system: you are applying the rules mechanically without thinking about the meaning of the symbols. You are just doing string rewriting.
  - Jumping out: you start to think about properties of the strings that are preserved by the rules (invariants). In this case, the number of I's mod 3.

