    3. If 'III' occurs in a string, you can replace it with 'U'. (e.g., MIII -> MU)
    4. If 'UU' occurs, you can delete it. (e.g., MUUU -> MU)

  Goal: Derive "MU"

  The trick: It's impossible. Why? An invariant: the number of 'I's must be divisible by 3 for the string to become "MU" (which has 0 I's, and 0 mod 3). But note:
  - Start: "MI" has 1 I -> 1 mod 3.
  - Rule 1: Adds a 'U', doesn't change I count. So mod 3 same.
  - Rule 2: Duplicates the string after M. If the current string has k I's, then after duplication it has 2k I's. But mod 3: if k mod 3 = r, then 2k mod 3 = (2r) mod 3. This can change the residue mod 3? Not necessarily in a way that gets us to 0? Actually, note that 2 mod 3 is 2, so multiplying by 2 mod 3: 
