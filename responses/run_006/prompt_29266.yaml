answer: |-
  Here’s your Q&A prep sheet, crafted for the exact philosophical trench warfare you’re walking into. I’m roleplaying as a grizzled externalist who’s seen a dozen versions of this objection since the 80s. The objections are ordered by how much blood they’ll draw if you’re not ready. Your nightmare question is at the end.

  ---

  ### **Objection 1 (Burgean, most damaging):**  
  *"You grant that Oscar and Twin Oscar refer to different substances with ‘water’ and have different truth-conditions for ‘This is water’, but insist their mental states could be type-identical. But if Oscar believes ‘Water is wet’ while Twin Oscar believes ‘Tw-water is wet’, and these beliefs have different truth-conditions *because* of their environmental embedding, how can their belief states not differ? If mental states are individuated by their satisfaction conditions, doesn’t Twin Earth *force* distinct mental states?"*  

  **Your 2-Minute Reply:**  
  "What’s at stake is whether *cognitive significance* must track *reference*. Oscar and Twin Oscar can share all dispositional, inferential, and phenomenal properties associated with ‘water’—they navigate the world identically, form identical perceptual judgments, and reason identically. The difference in truth-conditions arises from external factors *outside* the cognitive loop. Mental states should be individuated by their *role in cognition*, not by how the environment happens to satisfy them. Burge’s move conflates the *cause* of reference with the *content of thought*."  
  **Weakness:** You haven’t explained how internal states *track* external truth-conditions without inheriting externality.  
  **Concede?** Affirm that linguistic reference is external, but stress that cognition operates over internal vehicles.

  ---

  ### **Objection 2 (Two-Dimensionalist):**  
  *"Aren’t you neglecting the primary intension? When Oscar and Twin Oscar utter ‘Water is H₂O’, their statements share primary intension (truth in all scenarios considered as actual) but differ in secondary intension. If cognitive significance maps onto primary intension, doesn’t Twin Earth show that *narrow content just is primary intension*, preserving externalism about secondary intension?"*  

  **Your 2-Minute Reply:**  
  "Primary intension is still a *semantic* construct tied to actual-world application. My internalism is *pre-semantic*: it’s about the computational architecture that *fixes* primary intension. Two Oscar duplicates share algorithmic processes (e.g., pattern recognition for watery stuff) regardless of what their primary intension picks out. Two-dimensionalism starts too late in the chain—it assumes content is already externally loaded."  
  **Weakness:** Risks sounding like you reject semantic internalism altogether (not just Burge’s move).  
  **Concede?** Grant that primary intension *models* narrow content, but insist it’s a reconstruction, not the machinery of cognition.

  ---

  ### **Objection 3 (Burgean, targeting your "slide" claim):**  
  *"Burge’s arthritis case doesn’t rely on Twin Earth. It shows that even if the *environment* is identical, *social* facts individuate mental states. If your critique only targets Putnam, haven’t you missed the real argument for mental externalism?"*  

  **Your 2-Minute Reply:**  
  "The arthritis case assumes an *inference* from deference to concept possession: if Bert defers to experts on ‘arthritis’, his *concept* is fixed socially. But this assumes a theory of concepts where deference suffices for possession. I argue that Bert’s *idiosyncratic concept* (tharthritis) is what drives his reasoning. His error is linguistic, not cognitive. Social externalism needs to prove that deference alters *cognitive architecture*, not just reference."  
  **Weakness:** Social externalists will argue that *conceptual competence* requires embedding in a linguistic community.  
  **Concede?** Admit that linguistic *reference* is socially mediated, but double down on cognitive individualism.

  ---

  ### **Objection 4 (Externalist Grad Student):**  
  *"If narrow content is what’s shared between Oscars, how does it explain behavioral differences? Oscar points to H₂O and says ‘water’; Twin Oscar points to XYZ and says ‘water’. If their mental states are identical, why do their utterances refer to different things? Doesn’t this *require* distinct mental states to ground distinct linguistic actions?"*  

  **Your 2-Minute Reply:**  
  "Behavioral differences are explained by external context, not mental differences. Their shared internal state + H₂O causes ‘water’ referring to H₂O; same state + XYZ causes ‘water’ referring to XYZ. This is just like two identical calculators outputting ‘6’ for 3+3 or for 2+4—the mechanism is the same; input differs. Mental states *constrain* but don’t *determine* reference."  
  **Weakness:** Pushes you toward behaviorism or instrumentalism about content.  
  **Concede?** Emphasize you’re not denying externalism about *reference*.

  ---

  ### **Objection 5 (Two-Dimensionalist):**  
  *"Your ‘internal vehicles’ sound suspiciously like Fodor’s LOT. But without a robust semantics, how do they avoid being merely syntactic? If narrow content isn’t truth-conditional, how does it explain intentionality or rationality?"*  

  **Your 2-Minute Reply:**  
  "Narrow content is inferential role: it’s defined by its connections to perception, action, and other states. When Oscar sees a clear, drinkable liquid, his ‘water’ token is activated; this supports inferences to ‘wet’, ‘thirst-quenching’, etc. *Truth* emerges when this role interacts with the environment. Intentionality is relational; cognition is computational."  
  **Weakness:** Faces the "Kripkenstein" problem: inferential roles are indeterminate.  
  **Concede?** Acknowledge this is programmatic but argue it’s no worse than externalism’s inscrutable grounding.

  ---

  ### **Objection 6 (Senior Burgean, dismissive):**  
  *"This feels like a retreat to Cartesianism. If mental states are ‘in the head’, how do you account for their *aboutness*? Externalism didn’t just *slide* between content types—it *solved* the problem of intentionality by tethering mind to world."*  

  **Your 2-Minute Reply:**  
  "Cartesianism worries about *representation*. I’m offering a naturalistic alternative: causal-informational teleosemantics *plus* computational architecture. My internal state ‘water’ covaries with H₂O in my world and XYZ in Twin Earth, but its *cognitive role* is shared. Aboutness is a hybrid: head-world relations fix reference; head-states fix cognition."  
  **Weakness:** Teleosemantics is controversial; hybrid views can seem ad hoc.  
  **Concede?** Grant that externalists deserve credit for stressing world-involvement, but say they overcorrected.

  ---

  ### 🔥 The Nightmare Question (Whispered by a Tenured Two-Dimensionalist):  
  *"Let’s grant your distinction. But if narrow content is what’s shared, and it’s *non-referential*, how does it avoid collapsing into (a) a purely formal/syntactic property (and thus not *content* at all), or (b) a phenomenological quality? And if it’s the latter, haven’t you just reduced thought to qualia—which even internalists reject?"*  

  **Why it’s deadly:** Forces you to either abandon content talk for internal states (sounding eliminativist) or embrace a radical phenomenal intentionality (career suicide in an analytic department).  

  **Your Best Reply (Damage Control):**  
  "Narrow content is an *abstraction*: it’s the set of cognitive roles shared across duplicates. It’s not syntactic because it’s defined functionally—by its role in perception, inference, and action guidance (e.g., causing avoidance of dehydration). It’s not qualia because it’s multiply realizable and sub-personal. But yes, it’s *thin*: it doesn’t determine extensions. That’s my point—the ‘thick’ content externalists want is a philosophers’ construct."  
  **Concede?** You must admit narrow content doesn’t *determine* reference alone. Frame this as a virtue: it reveals externalism’s overreach.

  ---

  ### Strategic Notes:
  - **Play to the Crowd:** Cite Burge respectfully but distinguish his project from Putnam’s. Compliment two-dimensionalism’s tools while rejecting their foundational assumptions.  
  - **Concessions:** Always grant externalism about *linguistic reference/truth-conditions*. Deny only the *mental* extension.  
  - **Weakness Management:** Your replies lean hard on the computational/inferential role. If pressed, pivot to "This is a positive research program—I’m showing internalism isn’t a dead end."  
  - **Job-Talk Survival:** Avoid phrases like "qualia" or "Cartesian theater." Stick to "computational architecture," "inferential role," and "cognitive significance."  

  This crowd will come for blood—but they’ll respect you for swinging back. Good luck.
