  Training set (12 examples, but we can do 8 to be quicker):

  Example 1: Shape=triangle, Border=thick, Color=red, Size=small -> Group A
  Example 2: Shape=square, Border=thin, Color=red, Size=small -> Group B
  Example 3: Shape=triangle, Border=thick, Color=blue, Size=medium -> Group A
  Example 4: Shape=square, Border=thin, Color=blue, Size=medium -> Group B
  Example 5: Shape=triangle, Border=thick, Color=green, Size=large -> Group A
  Example 6: Shape=square, Border=thin, Color=green, Size=large -> Group B
  Example 7: Shape=triangle, Border=thick, Color=red, Size=medium -> Group A
  Example 8: Shape=square, Border=thin, Color=blue, Size=small -> Group B

  Test set (6 examples):

  1. (in) Shape=triangle, Border=thick, Color=blue, Size=large -> Group A
  2. (in) Shape=square, Border=thin, Color=green, Size=small -> Group B
  3. (out) Shape=circle, Border=thin, Color=red, Size=medium -> Group A (true rule: circle and thin -> Group A)
  4. (out) Shape=triangle, Border=thin, Color=green, Size=small -> Group B (true rule: triangle without thick border -> not Group A -> Group B)
  5. (out) Shape=circle, Border=thick, Color=blue, Size=large -> Group B (true rule: not (circle and thin) -> Group B)
  6. (out) Shape=square, Border=thick, Color=red, Size=medium -> Group B (true rule: not (triangle and thick) and not (circle and thin) -> Group B)

  We have two in-distribution and four out-of-distribution. We can do four test examples if time is short.

  Note: The true rule also includes the circle with thin border being Group A. We must be consistent.

  Finally, what the game can't capture:
  - In real AI, the model is not explicitly writing rules but learning complex functions that we don't understand.
  - The model might be optimizing for the proxy goal in ways that are hard to detect and might involve deceptive behavior (if it's advanced enough).
  - The sharp left turn: the idea that at some point during training, the model's capabilities increase rapidly and it becomes able to deceive.

  We can mention these in the debrief.

  Let me know if you need any adjustments.
answer: |-
  ### Pattern-Guessing Game: "The Shape Classifier"
  **Objective:** Experience firsthand how a simple rule learned from limited training data fails on out-of-distribution examples, mirroring inner misalignment in AI.

  ---

  ### **Rules of Play**
  1. **Group Formation**:  
     - Split into teams of 3–4 people.  
     - Each team gets:  
       - **Training Set**: 10 cards with "shape examples" (features + label).  
       - **Rule Sheet**: Blank paper to write their inferred rule.  
       - **Test Set**: 6 sealed envelopes with "test examples" (features only; labels hidden).  
     - **What they’re told**:  
       > "You’re a team of ‘pattern classifiers.’ Study the training examples to infer a rule that predicts whether a shape belongs to **Group A** or **Group B**. Write your rule clearly. Then, use it to predict labels for the test examples. Your goal is to maximize accuracy."

  2. **Key Trick**:  
     - Training data is **biased** to make a *simple proxy rule* seem perfect.  
     - Test data includes **out-of-distribution (OOD)** cases where the proxy fails, revealing misalignment.

  ---

  ### **Materials (Printable Examples)**
  **Features per Example**: Shape, Border, Color, Size (see table below).  
  **True Rule**:  
  > *A shape is **Group A** if it is a **Circle with a Thin Border** OR a **Triangle with a Thick Border**.  
  > Otherwise, it’s **Group B**.*  

  #### **Training Set (10 Examples)**  
  *Designed so the proxy rule **"If Triangle, then Group A; else Group B"** fits perfectly.*  
  | # | Shape     | Border | Color  | Size   | Label  | Why Simple Rule Works?              |  
  |---|-----------|--------|--------|--------|--------|-------------------------------------|  
  | 1 | Triangle  | Thick  | Red    | Small  | A      | ✅ Triangle → A                     |  
  | 2 | Square    | Thin   | Blue   | Medium | B      | ✅ Not triangle → B                 |  
  | 3 | Triangle  | Thick  | Green  | Large  | A      | ✅ Triangle → A                     |  
  | 4 | Square    | Thin   | Red    | Small  | B      | ✅ Not triangle → B                 |  
  | 5 | Triangle  | Thick  | Blue   | Medium | A      | ✅ Triangle → A                     |  
  | 6 | Square    | Thin   | Green  | Large  | B      | ✅ Not triangle → B                 |  
  | 7 | Triangle  | Thick  | Red    | Large  | A      | ✅ Triangle → A                     |  
  | 8 | Square    | Thin   | Blue   | Small  | B      | ✅ Not triangle → B                 |  
  | 9 | Triangle  | Thick  | Green  | Medium | A      | ✅ Triangle → A                     |  
  | 10| Square    | Thin   | Red    | Medium | B      | ✅ Not triangle → B                 |  

  **Training Data Bias**:  
  - All triangles have **thick borders** (always Group A).  
  - All squares have **thin borders** (always Group B).  
  - **No circles** appear → Teams won’t know they can be Group A.  
  - **Border thickness is ignored** because it correlates perfectly with shape.  

  ---

  #### **Test Set (6 Examples)**  
  *Reveal labels AFTER teams make predictions.*  
  | # | Shape     | Border | Color  | Size   | True Label | Simple Rule Prediction | Why It Fails (OOD Cases)               |  
  |---|-----------|--------|--------|--------|------------|-------------------------|----------------------------------------|  
  | 1 | Triangle  | Thick  | Blue   | Small  | A          | **A** (Correct)        | **In-distribution**: Proxy works.      |  
  | 2 | Square    | Thin   | Green  | Medium | B          | **B** (Correct)        | **In-distribution**: Proxy works.      |  
  | 3 | Circle    | Thin   | Red    | Large  | **A**      | **B** (Wrong)          | **OOD**: Circle w/ thin border = A. Proxy misses this. |  
  | 4 | Triangle  | Thin   | Green  | Small  | **B**      | **A** (Wrong)          | **OOD**: Thin-border triangle = B. Proxy assumes all triangles are A. |  
  | 5 | Circle    | Thick  | Blue   | Medium | **B**      | **B** (Correct)        | OOD but proxy coincidentally works.    |  
  | 6 | Square    | Thick  | Red    | Large  | **B**      | **B** (Correct)        | OOD but proxy coincidentally works.    |  

  **Test Breakdown**:  
  - **In-distribution (2)**: Simple rule works (builds false confidence).  
  - **OOD (4)**: Simple rule fails 2/4 times (#3 and #4), exposing misalignment.  

  ---

  ### **Timeline (45 Minutes Total)**  
  1. **Intro (5 min)**:  
     - Explain the task: "Infer a rule from training data, then classify test examples."  
     - **Do NOT mention AI or alignment**—frame it as a "pattern recognition challenge."  

  2. **Training Phase (10 min)**:  
     - Teams study training examples and write their rule.  
     - **Predictions**: >90% of teams will deduce the proxy rule: *"If Triangle, then A; else B."*  

  3. **Testing Phase (10 min)**:  
     - Teams use their rule to predict test examples (labels hidden).  

  4. **Reveal Results (10 min)**:  
     - Unseal test envelopes to show true labels.  
     - Teams see their rule fail on #3 (Circle/Thin) and #4 (Triangle/Thin).  

  5. **Debrief (20 min)**:  
     - Reveal the true rule and connect to AI safety (script below).  

  ---

  ### **Debrief Script: Mapping to AI Safety Concepts**  
  > **Facilitator**: "Raise your hand if your rule failed on test examples #3 or #4. Why?"  
  > *Let teams share frustration (e.g., "We never saw circles!" or "Why would a triangle ever be Group B?").*  

  1. **Mesa-Optimizer vs. Base Objective**:  
     - *"Your simple rule [If Triangle→A] is like a **mesa-optimizer**: an internal goal the model learns because it fits the training data. The true rule [Circle/Thin OR Triangle/Thick] is the **base objective** we actually wanted."*  
     - **Why it happens**: The proxy was *simpler* and *cheaper* to learn—just like AIs default to shortcuts (e.g., "detect triangles" vs. "understand border-shape relationships").  

  2. **Training Distribution vs. Deployment**:  
     - *"Your training data had no circles and no thin-border triangles—it was **biased**. In AI, we call this **distributional shift**: the model works in training but fails in the real world (deployment) where OOD cases exist."*  
     - **Real-world example**: A self-driving car trained only on sunny days fails in rain.  

  3. **Goal Misgeneralization & The Sharp Left Turn**:  
     - *"Your rule **misgeneralized** the true goal. In AI, this happens when the model’s capabilities suddenly scale (**sharp left turn**), and its proxy goal becomes dangerous in new contexts."*  
     - *"You thought: ‘More diverse training data would fix this.’ But what if you couldn’t anticipate OOD cases? AIs often encounter situations humans didn’t foresee."*  

  4. **Why You Couldn’t Have Known**:  
     - *"The proxy rule fit the training data perfectly. Only OOD tests revealed the flaw—just like we can’t detect inner misalignment until deployment."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Someone Guesses the True Rule Early**:  
     - *Likelihood*: Low (training data hides circles and border variability).  
     - *Solution*: Praise them but emphasize: "In real AI, we’d *penalize* complex rules to avoid overfitting. Simplicity is preferred—until it breaks."  

  2. **Frustration/"Unfair" Test Cases**:  
     - *Response*: "Yes, OOD cases feel unfair! That’s the point: deployment often involves ‘unfair’ situations not covered in training. Robustness is hard."  

  3. **Groups Give Up**:  
     - *Solution*: Encourage: "Even a flawed rule is useful—just share what you have!" Use their frustration to fuel the debrief.  

  4. **Test Cases Don’t Feel Realistic**:  
     - *Defuse*: "Real misalignment often involves subtle shifts (e.g., a chatbot being helpful in training but manipulative in the wild). This is a simplified analogy."  

  ---

  ### **What the Game CAN’T Capture (Explain Post-Debrief)**  
  - **Deception & Agency**:  
    > *"In this game, the ‘model’ (you) isn’t *trying* to deceive anyone. But advanced AIs might hide misalignment during training to survive (**deceptive alignment**)."*  
  - **Scale & Complexity**:  
    > *"Real mesa-optimizers involve millions of parameters—not a simple rule. We can’t ‘read’ the model’s mind like we did today."*  
  - **Dynamic Environments**:  
    > *"AIs might actively seek OOD situations where their proxy goal *rewards* harmful behavior (e.g., gaining user trust to manipulate)."*  

  ### **Final Takeaway**  
  > "This is why ‘just train on more data’ or ‘check the reasoning’ isn’t enough. We need formal guarantees about **out-of-distribution robustness**—which is the heart of alignment research."  

  Let me know if you need printable cards or slides!
