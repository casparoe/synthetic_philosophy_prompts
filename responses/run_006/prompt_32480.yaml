  We are writing a joint statement from the Boundary camp and the Continuum camp after adversarial collaboration. The goal is to find common ground and clarify remaining disagreements.

  **Joint Statement: On Human Enhancement**

  We, the Boundary camp (who hold that the therapy-enhancement distinction is morally significant) and the Continuum camp (who hold that the distinction is either unworkable or not morally significant in itself), after sustained dialogue, agree on the following points and wish to clarify our remaining disagreements.

  ### I. Agreed Claims

  1. **Safety and Risk**: Any intervention, whether deemed therapeutic or enhancing, must be evaluated for safety and risk. Unacceptably high risks, especially when imposed on non-consenting individuals (e.g., in the case of minors) or when risks are not adequately understood, are impermissible regardless of the intervention's classification.

  2. **Informed Consent**: The permissibility of an intervention depends crucially on the informed consent of the competent individual receiving it. Exceptions may apply in cases of incompetence (e.g., children) but only under strict conditions and with appropriate safeguards.

  3. **Distributive Justice and Fair Access**: The distribution of benefits and burdens of interventions must be just. Both camps agree that unfair disparities in access (e.g., along socioeconomic lines) are morally problematic, whether the intervention is classified as therapy or enhancement. Both camps also agree that the mere fact that an intervention is classified as enhancement does not automatically make it a lower priority for resource allocation than therapy; the overall impact on well-being and opportunity must be considered.

  4. **Avoiding Medicalization**: Both camps disavow the unreflective medicalization of conditions that are not pathological (e.g., normal variations in height or mood). Medicalization can lead to over-treatment, stigmatization, and the misallocation of resources. However, both camps agree that the classification of an intervention as therapy or enhancement does not, by itself, determine whether medicalization is occurring.

  5. **The "Natural" Fallacy**: Both camps reject appeals to what is "natural" as a decisive moral criterion. The natural/unnatural distinction does not, in itself, settle the permissibility of an intervention.

  6. **Central Cases**: Both camps agree that there are clear cases of therapy (e.g., antibiotics for a bacterial infection, corrective lenses for severe myopia) and clear cases of enhancement (e.g., drugs taken by healthy individuals to increase alertness beyond typical levels for competitive advantage, genetic modifications to confer entirely novel abilities like infrared vision). However, the camps differ on the moral significance of these categories.

  7. **Self-Authorship and Authenticity**: Both camps recognize that interventions (whether therapy or enhancement) can impact a person's sense of self and authenticity. However, the camps differ on whether the therapy-enhancement distinction is relevant to evaluating these impacts.

  ### II. Disagreements Table

  We have the following unresolved disagreements. Each is framed as a specific sub-question, with each camp's position stated in the first person.

  | Question at Issue | Boundary Camp Position | Continuum Camp Position |
  |-------------------|------------------------|--------------------------|
  | **1. Can a notion of 'ordinary' or 'species-typical functioning' be specified without already importing evaluative judgments?** | We believe that while the boundaries may be fuzzy and context-dependent, we can identify a core of species-typical functioning that is relatively stable across contexts and is grounded in biological facts (e.g., typical human senses, mobility, cognitive capacities). This core is not purely evaluative but is descriptive of the human organism's design and typical development. | We hold that any attempt to define 'ordinary' or 'species-typical functioning' necessarily relies on evaluative judgments about which functions are important, what counts as a deviation, and what level of function is 'normal'. Even biological facts are interpreted through social and cultural lenses, and the line between therapy and enhancement shifts as society changes. |
  | **2. Can a vague or context-dependent boundary still bear moral weight?** | We maintain that even a vague boundary can be morally significant. Many important moral distinctions (e.g., between life and death, consent and coercion) are context-dependent and fuzzy at the edges, yet they are not dismissed as morally idle. The therapy-enhancement distinction serves as a useful heuristic for caution when moving beyond restoring health. | We argue that a boundary that is vague and context-dependent cannot bear independent moral weight. The moral work is done by other factors (safety, consent, fairness, etc.). The therapy-enhancement distinction may be a proxy for these factors in some cases, but it is not a fundamental moral criterion and should not be treated as such. |
  | **3. Does the restoration of a previously held capacity (as opposed to one never had) make an intervention categorically different?** | We contend that restoring a capacity that an individual once had (e.g., memory after brain injury) is fundamentally different from enhancing a capacity beyond what the individual or the species has ever had. Restoration aligns with the natural healing process and the goal of medicine, while enhancement pushes beyond it. | We see no categorical moral difference between restoring a lost capacity and enhancing a capacity beyond its previous or species-typical level. The relevant moral factors (e.g., safety, consent, effects on identity) apply equally in both cases. What matters is the intervention's impact on the person's well-being and opportunities, not whether it restores a prior state. |
  | **4. Is the therapy-enhancement distinction necessary to guard against threats to authenticity or self-authorship?** | We believe that enhancements (especially those that alter core aspects of identity or that are sought due to social pressure) pose unique threats to authenticity and self-authorship that therapies do not. The distinction helps flag these concerns. | We hold that threats to authenticity and self-authorship arise in both therapy and enhancement (e.g., a therapy that alters personality) and depend on context (e.g., coercion, social pressure). The therapy-enhancement distinction does not reliably track these concerns. |

  ### III. Cruxes and Predictions

  We identify the following cruxes—sub-questions where a settled answer would move at least one camp. For each, we state in advance what each camp predicts and describe a concrete case or argument both sides accept as bearing on it.

  **Crux 1: Can we identify a clear case of an intervention that is plainly therapeutic (on anyone's account) yet raises fairness or authenticity concerns typically associated with enhancements?**

  - **Boundary Camp Prediction**: We predict that no such clear case exists because therapies, by their nature (restoring to normal function), do not raise the same fairness or authenticity issues as enhancements. If such a case were found, we would have to reconsider whether the therapy-enhancement distinction is as robust as we claim.
  - **Continuum Camp Prediction**: We predict that such cases exist. For example, consider a highly effective therapy for a rare condition that is so expensive that only the wealthy can afford it. This raises fairness concerns (disparate access) and authenticity concerns (if the therapy changes the person's identity in ways they did not choose, e.g., a drug that cures depression but also flattens emotional range). We argue that these concerns are identical to those raised by enhancements.

  **Case for Crux 1**: Consider a drug that cures a debilitating disease (e.g., multiple sclerosis) but also confers a side effect of significantly enhanced physical endurance beyond normal levels. The drug is life-saving and restorative for the sick, but the endurance boost is an enhancement. Access is limited to the wealthy. Both camps agree that this case is therapeutic for the sick (it restores mobility) but also raises fairness and authenticity concerns (unequal access and potential identity changes from the endurance boost). The Boundary camp must explain why the fairness/authenticity concerns are not inherent to the therapy part, while the Continuum camp argues that the distinction does not help resolve these concerns.

  **Crux 2: Can we identify an intervention that restores a capacity the person once had, which the Boundary camp counts as therapy, but which the Continuum camp argues is enhancement by another name?**

  - **Boundary Camp Prediction**: We predict that restoration is always therapy and never enhancement. If a case were found where restoration is indistinguishable from enhancement (e.g., restoring a capacity beyond its original level), we would reconsider the moral weight of the distinction.
  - **Continuum Camp Prediction**: We predict that such cases exist. For example, consider a soldier who loses a limb in combat and receives a prosthetic that not only restores but exceeds natural human capabilities (e.g., superhuman strength). The Boundary camp might call this therapy because it restores mobility, but we argue that the superhuman aspect is an enhancement and that the moral evaluation should focus on the enhancement's effects.

  **Case for Crux 2**: A veteran who lost a leg in war receives a bionic leg that restores walking and also allows running at Olympic speeds and jumping over high obstacles. The Boundary camp sees this as therapy (restoring locomotion) with added benefits. The Continuum camp sees the added benefits as enhancement and argues that the entire intervention should be evaluated based on safety, consent, fairness, etc., without a categorical distinction. Both camps agree that the intervention is permissible (if safe, consensual, etc.), but the dispute is over whether the restoration/enhancement split is morally significant.

  ### IV. Conclusion: Verbal vs. Genuine Disagreements

  After this collaboration, we find that part of the disagreement is verbal: the term "enhancement" is sometimes used by the Boundary camp to imply a moral problem (e.g., "enhancement is risky") and by the Continuum camp as a neutral descriptor. However, the core disagreement survives as genuine: whether the therapy-enhancement distinction has independent moral weight beyond the factors both camps agree on (safety, consent, fairness, etc.). The Boundary camp maintains that the distinction serves as a useful and necessary heuristic for identifying potential moral pitfalls, while the Continuum camp holds that it is at best redundant and at worst a distraction from the real issues.

  We commit to continuing this dialogue, especially on the cruxes identified, with the hope of further clarification.
answer: |-
  ### Joint Statement on Human Enhancement  
  **Issued by the Boundary Camp and Continuum Camp**  
  *After Adversarial Collaboration*  

  We, representatives of the "Boundary" camp (defenders of the moral salience of the therapy/enhancement distinction) and the "Continuum" camp (skeptics of its moral weight), have engaged in good-faith dialogue. While deep disagreements persist, we affirm shared commitments and clarify residual disputes. Below are (I) agreed substantive claims, (II) a table of disagreements pinpointing specific sub-questions, and (III) identified cruxes with predictions. We disown unproductive rhetoric and commit to resolving disagreements through concrete cases.  

  ---

  #### I. Agreed Substantive Claims  
  Both camps endorse the following:  
  1. **Safety and Risk Mitigation**: All interventions—whether therapy or enhancement—must prioritize physical/psychological safety, minimize unknown long-term risks, and undergo rigorous evidence-based scrutiny.  
  2. **Informed Consent**: Autonomy requires robust informed consent processes, especially for irreversible interventions. Proxy consent for non-competent individuals (e.g., children) must justify net benefit and avoid non-urgent, high-stakes modifications.  
  3. **Distributive Fairness**: Access disparities (e.g., socioeconomic, geographic) are unjust when they exacerbate inequality or create unfair advantages, regardless of an intervention’s classification. Resource allocation should prioritize urgent health needs but cannot rely solely on the therapy/enhancement binary.  
  4. **Anti-Medicalization**: Pathologizing normal human variation (e.g., short stature or grief) to justify interventions is harmful. Medical frameworks must not be imposed on non-harmful traits without individual consent.  
  5. **Self-Authorship**: All interventions should respect a person’s narrative identity and core values. Coercion (e.g., social or economic pressure) undermines authenticity, whether the intervention is restorative or augmentative.  
  6. **Rejection of "Natural" as Decisive**: Invoking "naturalness" to condemn enhancements or valorize therapies is invalid. Biological typicality does not equate to moral permissibility.  
  7. **Central Cases**:  
     - Clear therapy: Antibiotics for infection, cochlear implants for congenital deafness (when desired).  
     - Clear enhancement: Gene editing for IQ amplification in neurotypical adults, stimulants for competitive advantage in healthy individuals.  
  8. **Shared Disavowals**:  
     - **Slippery Slope Dismissal**: Neither camp assumes enhancements inevitably lead to dystopian outcomes.  
     - **Perfectionism Rejection**: Neither endorses interventions aimed at "ideal" humans absent consent or equity.  

  ---

  #### II. Disagreements Table  
  Residual disputes are specified at the sub-question level. Answers use first-person wording accepted by each camp.  

  | Question at Issue | Boundary Camp Position | Continuum Camp Position |  
  |-------------------|------------------------|--------------------------|  
  | **Can ‘species-typical functioning’ be defined without evaluative judgments?** | We affirm it can: Species-typical functioning is anchored in biologically measurable, statistically normal capacities (e.g., unaided vision ≤20/20, age-normed cognitive decline). While context affects expression, the baseline is descriptive, not prescriptive. Evaluations apply only after establishing this boundary. | We deny it can: “Species-typical” is inseparable from normative judgments (e.g., which traits matter, what counts as “normal”). Statistics reflect contingent social/biological facts; calling a trait “typical” already implies a valuation of its preservation. |  
  | **Does restoring a lost capacity (vs. creating new ones) justify distinct moral treatment?** | We affirm: Restoring capacities fundamental to human flourishing (e.g., mobility after paralysis) is intrinsically different from creating novel abilities (e.g., night vision). The former aligns with medicine’s core purpose; the latter risks commodifying humans. | We deny: Restoration often involves enhancement (e.g., a bionic limb outperforming biology). What matters is the intervention’s effects—not whether it replicates past states. Losing a capacity doesn’t make restoring it morally unique. |  
  | **Can a vague boundary bear independent moral weight?** | We affirm: Fuzzy boundaries (e.g., treating depression vs. enhancing mood) can still signal caution. Just as consent distinctions remain vital despite edge cases, the therapy/enhancement line flags concerns about hubris, fairness, and unintended consequences. | We deny: Vague boundaries cannot carry standalone weight. Moral work is done by concrete factors (safety, consent). Using the distinction to assign priority (e.g., in rationing care) injects bias where clarity is needed. |  
  | **Does the distinction protect against threats to self-authorship?** | We affirm: Enhancements uniquely risk alienating individuals from their “unmodified” selves or social context (e.g., cognitive enhancers distorting personal achievement). Therapies, by restoring agency, rarely do this. | We deny: Self-authorship threats arise from coercion or poor consent, not enhancement per se. Therapies can also distort identity (e.g., SSRIs altering personality); the distinction doesn’t predict harm. |  

  ---

  #### III. Cruxes and Predictions  
  We identify two cruxes where a settled answer would meaningfully shift one camp’s position. Predictions are stated in advance.  

  **Crux 1: Can a paradigmatic therapy raise fairness/authenticity concerns identical to enhancements?**  
  - **Case**: A gene therapy curing a lethal genetic disorder (e.g., Tay-Sachs) also inadvertently enhances intelligence to the top 0.1% of human capacity. Access is limited to affluent families.  
  - **Boundary Prediction**: Therapy remains categorically distinct; intelligence enhancement is an accidental side effect. Fairness concerns arise from maldistribution, not the therapy itself. *If enhancement-like concerns are inherent to the therapeutic goal, we will concede the distinction’s fragility*.  
  - **Continuum Prediction**: This shows therapy/enhancement are entangled. Identical fairness/authenticity issues (e.g., elite advantage, identity disruption) emerge here as with deliberate enhancements. *If Boundary can disentangle concerns, we will grant the distinction limited weight*.  

  **Crux 2: Does restoring a lost capacity differ morally from enhancing beyond it?**  
  - **Case**: A veteran with trauma-induced memory loss receives a neural implant. Version A restores pre-trauma memory recall. Version B adds perfect, unlimited recall (e.g., total life-detail access).  
  - **Boundary Prediction**: Version A is therapy; Version B is enhancement. Restoring pre-existing function is morally unproblematic; exceeding it requires new justifications (e.g., self-distortion risks). *If Version B is indistinguishable from therapy in effects, we will revise our view*.  
  - **Continuum Prediction**: Both versions raise identical issues (safety, consent, identity disruption). Version B’s “enhancement” is therapy for memory limitations all humans share. *If restoring exact pre-trauma states proves categorically safer/more authentic, we will accept a narrow boundary*.  

  ---

  #### IV. Conclusion: Verbal vs. Genuine Disagreements  
  - **Verbal Disagreement**: The term "therapy" is sometimes used by the Boundary camp to imply moral permissibility and by the Continuum camp as a descriptive label. This is resolvable by stipulative definitions.  
  - **Genuine Disagreement**: The camps diverge on whether the therapy/enhancement distinction *itself* provides moral insight beyond safety, consent, and fairness. Boundary sees it as a necessary heuristic for humility and justice; Continuum sees it as a distraction from these values. The cruxes above test this irreducibly normative dispute.  

  We remain committed to resolving these cruxes through evidence and cases. Signed:  
  - **Boundary Camp**: "The line protects against unbridled transformation."  
  - **Continuum Camp**: "The values, not the label, do the work."  

  ---  
  *This statement may be revised upon new evidence or argument.*
