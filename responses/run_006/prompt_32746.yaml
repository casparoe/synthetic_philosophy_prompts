prompt: |-
  I've spent a fair amount of time thinking about the idea that some actions are morally good without being morally required — what I've seen called supererogation. The soldier who throws himself on a grenade, the person who donates a kidney to a stranger, the family that takes in a refugee child when no one would blame them for not doing so. These seem different in kind from things like keeping promises or not lying. With duties, if you fail to do them, you're blameworthy — you've done something wrong. With supererogatory acts, doing them makes you praiseworthy, perhaps even heroic, but not doing them doesn't make you blameworthy. You're just ordinary. Not a bad person.

  The position I've come to hold is that there really are supererogatory acts. Morality isn't just a two-category system of the permissible and the impermissible. There's a third category — acts that go beyond what duty demands, that are morally excellent but not required. And I think this isn't just a matter of social convention or praise-blame practices; it reflects something genuine about the structure of moral reasons.

  What I want to know is: what would count against this view? I'm not asking for the standard objections listed in an encyclopedia. I want a systematic survey of what threatens the position — arguments, counterexamples, intuitions that pull the other way, results from nearby areas of moral thinking that create pressure — sorted by how much damage they'd do if they succeeded. I want to know which challenges a reasonable defender of the view would concede as counting against them (even if they think they can be answered) and which they'd dismiss as missing the point or begging the question.

  I also want an honest assessment of whether the view has been insulated against falsification — whether it's been qualified in ways that make nothing count against it anymore. And if it has, I want to know whether that's a problem for a view of this kind, or whether some degree of insulation is appropriate for a claim about the conceptual structure of morality.

  After your main analysis, please provide a structured summary as a JSON object with the following fields:

  - "overall_exposure": one of "highly_exposed", "moderately_exposed", "well_insulated", "unfalsifiable_in_principle"
  - "defeaters": an array of objects, each with:
    - "challenge": a string describing the challenge
    - "type": one of "argument", "intuition_pump", "counterexample", "theoretical_pressure", "empirical"
    - "severity": one of "fatal_if_successful", "serious", "awkward", "minor"
    - "conceded_by_defenders": boolean
    - "defender_response": a brief string summarizing the standard reply
  - "insulation_assessment": an object with:
    - "is_insulated": boolean
    - "mechanism": a string describing how the view might be insulated, or "n/a" if not
    - "is_problematic": one of "yes", "no", "partially", "n/a"
reasoning: |-
  We are analyzing the view that supererogation is real and captures a genuine moral category. The view holds:
  - Some acts are morally good but not required.
  - Failing to perform them does not make one blameworthy (merely not praiseworthy).
  - This is not just a social convention but reflects the structure of moral reasons.

  We are to provide a systematic survey of what threatens this view, sorted by severity, and then assess insulation against falsification.

  ## Challenges to the Supererogation View

  ### 1. **The Utilitarian/Consequentialist Challenge (Maximizing Ethics)**
     - **Challenge**: In maximizing ethics (like utilitarianism), every act that fails to maximize the good is morally wrong. Thus, if throwing oneself on a grenade saves multiple lives, it is required. There is no room for supererogation because any act that produces the best outcome is obligatory, and any failure is blameworthy.
     - **Type**: Theoretical pressure (from consequentialism).
     - **Severity**: Fatal if successful because it would collapse the supererogatory into the obligatory or the impermissible.
     - **Conceded by defenders**: Yes, defenders acknowledge this challenge as a major theoretical alternative.
     - **Defender response**: Reject maximizing consequentialism. Morality is not solely about maximizing the good; it includes agent-centered prerogatives (e.g., self-interest) and constraints (e.g., rights). Thus, one may permissibly not maximize and yet not be required to sacrifice oneself.

  ### 2. **Kantian Deontology (Duty and the Perfect/Imperfect Distinction)**
     - **Challenge**: Kantian ethics traditionally distinguishes perfect duties (which are strict and required) and imperfect duties (which allow latitude). Supererogation might be absorbed into imperfect duties. For example, helping others is an imperfect duty, and one can choose when and how to fulfill it. But this does not leave room for acts that are "beyond duty" because imperfect duties are still duties. Failing to ever help might be blameworthy, but the supererogatory act (like donating a kidney) might be seen as just one way of fulfilling the imperfect duty.
     - **Type**: Theoretical pressure (from deontology).
     - **Severity**: Serious, because it would absorb supererogation into a broader category of duty, removing its distinctness.
     - **Conceded by defenders**: Yes.
     - **Defender response**: Argue that imperfect duties do not cover extreme sacrifices. The latitude in imperfect duties does not extend to allowing one to never make significant sacrifices, but supererogatory acts go beyond what the imperfect duty requires. Thus, they are still beyond duty.

  ### 3. **The Balancing of Reasons (Costs and Demands)**
     - **Challenge**: If moral reasons are such that they always outweigh non-moral reasons when the stakes are high enough, then in cases like the grenade or kidney donation, the moral reason (saving lives) would be so strong that it becomes obligatory. Only when the cost to the agent is very high might it be non-obligatory, but then it would be impermissible to demand it. However, this might still not leave room for supererogation because if the act is not required, it might be because it is too costly, but then it would not be morally good in the required sense (it would be merely permissible).
     - **Type**: Argument (from the structure of reasons).
     - **Severity**: Serious.
     - **Conceded by defenders**: Yes.
     - **Defender response**: Introduce the idea of agent-relative reasons. The agent's own life and projects have special weight for them, such that they are not required to sacrifice themselves even for a greater good. But when they do, it is morally excellent because they set aside their own legitimate interests for others.

  ### 4. **The Argument from Ought Implies Can**
     - **Challenge**: If an act is supererogatory, it is morally good but not required. But if it is not required, then it must be that the agent cannot be obligated to do it. However, if the agent can do it (as they do in the supererogatory case), then why isn't it required? This seems to violate the principle that if you can do something and it is the best thing to do, you ought to do it.
     - **Type**: Argument.
     - **Severity**: Awkward to serious.
     - **Conceded by defenders**: Sometimes conceded.
     - **Defender response**: Reject the premise that "if you can do it and it is the best thing, you ought to do it." Morality does not always require the best; it sets a baseline of what is required, and beyond that, there is room for the optional better.

  ### 5. **Counterexamples: The Demandingness of Morality**
     - **Challenge**: Consider a case where an act is clearly beyond duty, but then imagine a series of such opportunities. If one repeatedly fails to perform such acts, at what point does it become blameworthy? For example, if a millionaire fails to donate to any charity, we might think they are blameworthy. But then, if each act of donation is supererogatory, how does the accumulation turn into a duty? This blurs the line.
     - **Type**: Counterexample / intuition pump.
     - **Severity**: Awkward.
     - **Conceded by defenders**: Yes.
     - **Defender response**: Accept that there might be a threshold where repeated failures become a failure of a general duty (e.g., a duty of beneficence). But this does not collapse the category because individual acts can still be supererogatory.

  ### 6. **The No-Space Argument (Reduction to Permissible)**
     - **Challenge**: If an act is not required, then it is merely permissible. But if it is merely permissible, then it is not morally good in the sense of being better than other permissible options. For example, if I have a choice between two permissible acts (donating a kidney vs. not donating), how can one be morally better without being required? This would violate the principle that moral requirements are based on the balance of reasons.
     - **Type**: Argument (conceptual).
     - **Severity**: Fatal if successful.
     - **Conceded by defenders**: Yes.
     - **Defender response**: Deny that the permissible is undifferentiated. There can be a hierarchy within the permissible: some acts are merely permissible, and some are supererogatory (i.e., permissible and especially good). The balance of reasons might make one act better than another without making the lesser act impermissible.

  ### 7. **Empirical Challenges: Cultural Variation**
     - **Challenge**: Anthropological and psychological studies show that what counts as supererogatory varies across cultures. In some cultures, acts like taking in a refugee might be seen as obligatory. This suggests that supererogation is a social construct rather than a universal moral category.
     - **Type**: Empirical.
     - **Severity**: Minor to awkward (because it challenges universality but not the possibility of the category).
     - **Conceded by defenders**: Sometimes.
     - **Defender response**: Accept cultural variation in what counts as supererogatory but maintain that the structure (a category of beyond-duty acts) is universal. Alternatively, argue that the variation is in the content of duties, not the structure.

  ### 8. **The Heroic and the Ordinary: Blurred Lines**
     - **Challenge**: Intuitions about specific cases vary. For example, is donating a kidney supererogatory? Some might say it is obligatory if the cost is low enough (relative to the benefit). This variation in intuition makes it hard to define clear criteria for supererogation.
     - **Type**: Intuition pump / counterexample.
     - **Severity**: Minor to awkward.
     - **Conceded by defenders**: Yes.
     - **Defender response**: Admit that borderline cases exist but argue that clear cases (like the grenade) establish the category. The existence of a spectrum does not negate the distinctness of the poles.

  ### 9. **The Problem of Divine Commands (in Religious Ethics)**
     - **Challenge**: In some religious ethics (e.g., Christianity), God commands love and sacrifice, and failing to go beyond the minimum might be seen as sinful. Thus, supererogation might collapse into duty.
     - **Type**: Theoretical pressure (from religious ethics).
     - **Severity**: Minor (for secular defenses) but serious for religious defenders.
     - **Conceded by defenders**: Only by those engaging with religious ethics.
     - **Defender response**: Distinguish between divine commands and human capabilities. Even in religion, there are acts of "counsel" versus "precept" (e.g., in Catholicism) that are not obligatory but recommended.

  ### 10. **The Self-Defeating Nature of Praiseworthiness**
      - **Challenge**: If an act is supererogatory, then it is praiseworthy only if it is done from the right motive. But if one is motivated by the thought that it is supererogatory (and thus not required), that might undermine the praiseworthiness because it suggests a lack of full commitment to morality. Thus, the very category might be self-undermining.
      - **Type**: Argument.
      - **Severity**: Awkward.
      - **Conceded by defenders**: Rarely.
      - **Defender response**: The motive for supererogation is typically other-oriented (e.g., altruism), not a calculation about duty. The act is praiseworthy because of the sacrifice and benevolence, not because it was beyond duty.

  ## Insulation Assessment
  - **Is the view insulated?** Yes, to some extent.
  - **Mechanism**: 
    - The view can be insulated by making the supererogatory category vague or context-dependent. For example, by saying that what counts as beyond duty depends on the agent's circumstances and societal norms, it becomes hard to falsify because counterexamples can be explained away as falling within the variability of the category.
    - Also, defenders can always adjust the boundaries of duty (e.g., by arguing that a putative counterexample is actually a case of duty or impermissibility) to protect the supererogatory.
  - **Is this problematic?** Partially.
    - Some insulation is appropriate because the view is about the conceptual structure of morality, which may not be empirically falsifiable in the same way as scientific claims. However, if the view becomes too flexible (e.g., by reclassifying every challenging case), it risks being unfalsifiable and thus vacuous. A reasonable defender should allow that some cases (if they were to occur) would falsify the view (e.g., if we found that every morally good act is required in a consistent ethical system).

  ## Overall Exposure
  The view is **moderately exposed**. It faces several serious challenges (especially from maximizing consequentialism and the conceptual argument about permissibility) that could be fatal if successful, but it has resources to respond. However, it is not so insulated as to be unfalsifiable in principle because clear counterexamples (like a system where all good acts are required) would threaten it.

