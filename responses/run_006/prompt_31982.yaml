  - **Secondary Intension**: Once we fix the actual world, we evaluate the primary intension in the actual world to get a value, and then we form a constant function that always returns that value (for any counterfactual world). This is rigid designation.

  In programming, we don't typically have this two-step process. We bind a name to a value, and then that value is fixed. But if we want to simulate the two-dimensional behavior, we could have:

