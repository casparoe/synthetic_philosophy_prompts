  Therefore, the statement "Hesperus is Phosphorus" is necessary (secondary intension) but not a priori (because we need experience to know that in the actual world, the evening star and morning star are the same). The statement "Hesperus is Hesperus" is both necessary and a priori because the primary intension of "Hesperus" with itself is the same function, so in every world considered as actual, it will be the same object.

  ### Translation to Programming Terms

  - **Binding Environment**: The environment at the time of introduction. This environment includes the descriptions (or the means to compute them) for the names being introduced.

