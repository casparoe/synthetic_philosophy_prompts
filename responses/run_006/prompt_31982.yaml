     However, this is a natural extension: we can think of names as being bound to thunks (functions of zero arguments) that, when forced, use the current state of the world. But in 2D, we want to evaluate the thunk in different worlds. So we made the thunk take the world as an argument.

  2. **Rigidity in secondary intension**: In programming, once a name is bound to a value, it typically doesn't change. But in 2D, the secondary intension is rigid across all possible worlds. Our translation uses a constant function. This is a good match.

