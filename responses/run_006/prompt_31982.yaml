  We are going to translate the core ideas of two-dimensional semantics (2D semantics) into the vocabulary of programming languages (type systems, evaluation contexts, lexical scope, closures, etc.). The goal is to see which parts map naturally and which do not.

  Two-dimensional semantics, as motivated by cases like Hesperus/Phosphorus (which are both the planet Venus, but discovered at different times and thought to be distinct), distinguishes two ways of evaluating the meaning of a sentence:

  1. **Primary intension**: This is the meaning of a term in a given world considered as actual (the world as counterfactual). It captures what the term would refer to in a counterfactual world if that world were the actual world. It is often described as the "context of introduction" or the way the reference is fixed in the actual world.

  2. **Secondary intension**: This is the meaning of a term in a counterfactual world, given that the actual world is fixed. It is the standard possible worlds intension: what the term refers to in other possible worlds, given how the actual world has fixed the reference.

  The key idea is that some statements (like "Hesperus is Phosphorus") are necessary a posteriori (they are true in every possible world, but we need experience to know that) and some (like "Hesperus is Hesperus") are necessary a priori (true in every possible world and knowable without experience). Two-dimensional semantics captures this by having two dimensions of meaning.

  ### Translation to Programming Languages Vocabulary

  Let's think of a possible world as an environment (a mapping from names to values). The actual world is the initial environment at the time of binding. 

