    Now, in programming, if we have a function that, given a world, returns the brightest star in that world, that function is the primary intension. The secondary intension, once we fix the actual world, is the constant value of that function in the actual world.

  ### Example: Hesperus and Phosphorus

  Let:
  - `hesperus_description(w) = the brightest star in the evening sky in world w`
  - `phosphorus_description(w) = the brightest star in the morning sky in world w`

