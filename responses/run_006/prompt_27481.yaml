answer: |-
  You've identified a profound philosophical tension at the heart of modern regulatory policy. Your intuition about the moral separateness of persons is central to debates in ethics, economics, and law. Let's break this down:

  **What Cost-Benefit Analysis (CBA) Presupposes About Moral Separateness:**

  1.  **Implicit Rejection of Strong Moral Separateness:** Standard CBA *does* implicitly deny a fundamental moral difference between a harm falling on one person versus another. It treats:
      *   **Utility as Fungible:** Well-being (or "utility") is treated as a homogeneous good that can be aggregated, summed, and traded across individuals.
      *   **Society as a Single Entity:** It adopts a "social welfare function" perspective where the *total* net benefit matters, not its distribution (unless specifically adjusted for). Gains and losses *are* netted out.
      *   **Kaldor-Hicks Efficiency as Normative:** The core justification for CBA is Kaldor-Hicks efficiency: a policy is desirable if the winners *could* (in theory) compensate the losers *and still be better off*. Crucially, the compensation doesn't actually need to happen. This directly sacrifices the interests of specific losers for aggregate gain.

  2.  **Justifications Attempted Without Explicitly Denying Separateness (But Often Failing):**
      *   **Ex Ante Perspective:** Proponents argue CBA is applied *before* anyone is identified as a specific winner or loser. Everyone faces probabilistic risks and benefits. From behind this "veil of ignorance" (Rawls), maximizing expected value might seem fair. However, *after* implementation, identifiable individuals *are* harmed without compensation, violating the separateness principle.
      *   **Systemic Efficiency & Overall Welfare:** The argument is that maximizing aggregate welfare *ultimately* benefits everyone through economic growth, innovation, and resources for other social goods. Sacrifices in one area lead to gains elsewhere that *might* indirectly benefit those harmed (though not directly or reliably).
      *   **Pragmatism & Scarcity:** Resources are limited. CBA provides an objective (though imperfect) way to prioritize interventions that save the most lives/benefit with limited resources. Ignoring costs could lead to even greater harms elsewhere by misallocating resources. This is a practical concession, not a moral resolution.
      *   **"Value of Statistical Life" (VSL) as Implicit Consent:** The VSL is derived from how people trade off small mortality risks for money in their own lives (e.g., wage premiums for risky jobs). Using VSL aggregates *individual* trade-offs. However, this extrapolates *intra-personal* trade-offs (my risk vs. my money) to *inter-personal* trade-offs (your life vs. my money), which is precisely where the separateness objection bites hardest.

  **Consistency with the Rest of the Legal System: A Profound Tension**

  You are absolutely correct to perceive a stark inconsistency. The law operates with fundamentally different moral frameworks in different contexts:

  1.  **Tort Law & Property Rights (Corrective Justice):**
      *   **Core Principle:** Moral separateness is paramount. Individuals have rights (to bodily integrity, property). Violating these rights requires specific compensation to the victim *because* they are a separate moral entity. "I benefited more than you lost" is irrelevant. Justice requires making *that individual* whole. This aligns with deontological (duty-based) ethics and Nozickian libertarianism.

  2.  **Regulatory CBA (Utilitarian/Aggregate Welfare):**
      *   **Core Principle:** Aggregate welfare trumps individual rights in this context. Harms to specific individuals are permitted without compensation if the overall calculus is positive. This aligns with consequentialism (specifically utilitarianism).

  3.  **The Tension and Attempted Justifications:**
      *   **The Core Inconsistency:** The legal system prohibits uncompensated takings/harms between individuals (tort) but authorizes them when done collectively via regulation using CBA. The victim in both cases suffers an identifiable harm; only the *process* differs.
      *   **Legal Justifications (Often Unsatisfactory Philosophically):**
          *   **Government's Police Power:** Regulations protecting public health/safety/welfare are an exercise of the state's inherent power, distinct from private actions. Harm is incidental to achieving a public good, not a targeted taking.
          *   **Collective Action Problems:** Regulation addresses harms (like pollution) caused by diffuse actors to diffuse victims, where individual tort actions are impractical or impossible. CBA is seen as a necessary tool for governing these complex systems.
          *   **Ex Ante Authorization (Thin Version):** By living in a democracy governed by laws (including administrative procedures like CBA), citizens are presumed to consent *generally* to the system, even if they dislike specific outcomes. This is weak justification for uncompensated losses.
          *   **"Risk-Risk" Tradeoffs:** Strict regulations imposing high costs can cause other harms (e.g., job loss leading to poverty and poorer health). CBA attempts to minimize *overall* risk, implicitly acknowledging that focusing solely on one risk might increase others.

  **Conclusion: A Genuine Philosophical Tension**

  *   **CBA's Presupposition:** Standard regulatory CBA fundamentally presupposes that interpersonal utility comparisons are valid and morally permissible, and that aggregate welfare gains can justify imposing uncompensated losses on specific individuals. This *does* implicitly reject a strong notion of the moral separateness of persons in favor of a utilitarian aggregation.
  *   **The Inconsistency is Real:** There is a deep philosophical tension between the individual-rights-based foundation of tort law and the aggregate-welfare-based foundation of regulatory CBA. The law "papers over" this tension through doctrinal distinctions (public vs. private action, police power vs. takings) and practical necessity arguments, rather than resolving the underlying moral conflict.
  *   **Unresolved Debate:** This tension reflects the enduring conflict between deontological ethics (emphasizing rights and duties) and consequentialist ethics (emphasizing outcomes). Legal systems are hybrid and often inconsistent in their underlying moral foundations. Your discomfort points directly to this unresolved debate. Scholars like Ronald Dworkin, Jules Coleman ("The Practice of Principle," "Risks and Wrongs"), and numerous critics of CBA (e.g., Frank Ackerman, Lisa Heinzerling, Matthew Adler) have extensively explored this very tension.

  In essence, regulatory CBA embodies a form of *sanctioned sacrifice*: it allows identifiable individuals (or communities) to bear costs so that a larger group can receive benefits, based solely on the arithmetic of aggregation. Whether this is a necessary tool for governing a complex society or a fundamental violation of individual moral standing remains a fiercely contested question at the intersection of law, economics, and philosophy. Your analysis hits the nail on the head.
