  Below is a complete design for your 75-minute session, structured as a game to make participants experience the CHSH bound (2) and the quantum value (2√2 ≈ 2.828). The activity emphasizes **physical intuition** over math, using the CHSH game to illustrate Bell nonlocality. The debrief maps outcomes to parameter independence, outcome independence, and measurement independence.

  ---

  ### **Activity: The CHSH Game Challenge**
  **Goal**: Teams (Alice/Bob pairs) maximize wins under "classical" rules, then experience a "quantum-like" strategy that beats the classical limit.  
  **Participants**: 14 people → 7 pairs (Alice + Bob) + you as referee/organizer.  
  **Materials**: 
  - Coin (for referee questions)
  - Whiteboard + markers
  - 7 sealed envelopes per pair (for "quantum" round)
  - Scoreboard (visible to all)

  ---

  ### **Rules & Payoff Scheme**  
  **Game Basics** (Explain orally; **5 min**):
  - Alice and Bob are separated (no communication).  
  - Referee flips a coin to give each a **question** (Heads = 1, Tails = 0).  
  - They answer **±1** independently.  
  - **Win condition**: They win UNLESS **both questions are 1 AND answers agree** (i.e., both +1 or both -1).  
  - **Payoff**: Bragging rights! Track wins on a scoreboard. Teams compete for highest win rate.  

  ---

  ### **Timeline**  
  #### **1. Setup & Classical Round (25 min)**  
  - **Step 1 (5 min)**: Split into 7 Alice/Bob pairs. Pairs strategize together (classically) → *"Agree on how you’ll answer, but no signals during the game!"*  
  - **Step 2 (15 min)**: Run **10 rounds** per pair:  
    - Referee flips 2 coins (Alice’s question, Bob’s question).  
    - Alice/Bob write answers secretly.  
    - Referee records wins/losses per round.  
  - **Step 3 (5 min)**: Calculate win rates.  
    - **Expected outcome**: Most pairs score 70–80% wins (classical max = 75%).  
    - Write on board:  
      ```  
      Classical win rate = 3/4 (75%)  
      CHSH bound = 2 (for correlation value)  
      ```

  #### **2. Quantum Round (20 min)**  
  - **Step 1 (5 min)**: Distribute **7 sealed envelopes** to each pair.  
    - *Inside*: Pre-generated "quantum strategy" cards (simulating entanglement).  
      - Example card:  
        ```  
        ROUND 1  
        Alice: If 0 → -1, If 1 → +1  
        Bob:   If 0 → +1, If 1 → -1  
        ```  
      - **How cards are made**: Use a quantum circuit simulator (e.g., Qiskit) to generate answers for 10 rounds, optimizing for CHSH violation ([code here](https://shorturl.at/aiTYX)). Cards replicate the quantum win rate (85%) but use fixed lists—no real entanglement.  
  - **Step 2 (10 min)**: Run **10 rounds** per pair:  
    - Pairs use the envelope for each round (no communication).  
    - Referee records wins.  
  - **Step 3 (5 min)**: Calculate win rates.  
    - **Expected outcome**: Win rates jump to ~85%. Write on board:  
      ```  
      Quantum win rate = 85%  
      CHSH value = 2√2 ≈ 2.828  
      ```

  #### **3. Debrief & Discussion (25 min)**  
  **Key Questions**:  
  - *Classical round*: Why couldn’t anyone beat 75%?  
  - *Quantum round*: How did we "cheat" the classical limit?  

  **Map to Bell’s Concepts**:  
  | **What Happened**          | **Bell’s Theorem Concept**       | **Violated in QM?** |  
  |----------------------------|----------------------------------|---------------------|  
  | Pairs pre-agreed strategies | **Realism (hidden variables)**   | Yes (no hidden vars) |  
  | Answers didn’t depend on partner’s question | **Parameter Independence**      | No (QM obeys this) |  
  | Answers didn’t depend on partner’s answer  | **Outcome Independence**        | Yes (nonlocality!)  |  
  | Questions were random       | **Measurement Independence**    | Assumed in both     |  

  **Philosophical Punchlines**:  
  - The quantum cards **simulated** nonlocality (outcome dependence), but real QM does this *without communication* via entanglement.  
  - **What we couldn’t reproduce**: True outcome independence violation (cards were pre-made; real QM has no hidden variables).  
  - **Bell’s takeaway**: QM rejects **local realism**—either reality isn’t observer-independent (no hidden variables) or actions are nonlocal (faster-than-light influence).  

  ---

  ### **Predictable Problems & Honesty in Debrief**  
  1. **Classical round goes wrong**:  
     - Teams may use RNG (e.g., coin flips) → win rate drops to ~50%.  
     - **Fix**: Remind them: *"Maximize wins—deterministic strategies work best!"* (e.g., "Always answer +1" wins 75%).  

  2. **Quantum round confusion**:  
     - Participants might think envelopes "communicate."  
     - **Honesty**: Admit this is a simulation: *"Real entanglement doesn’t use pre-shared lists—it’s a physical resource with no classical explanation."*  

  3. **What the activity can’t show**:  
     - True **quantum outcome independence violation** (cards are locally determined).  
     - **Emphasize**: Bell’s theorem proves no *local hidden variable theory* can match QM’s predictions.  

  ---

  ### **Why This Works**  
  - **Game → Physics**: The win-rate jump from 75% → 85% *feels* the CHSH violation.  
  - **Philosophy-first**: Debrief links strategy choices to locality/realism—no math overload.  
  - **Transparent limits**: Cards simulate quantum stats but not the "why," priming deeper discussion.  

  This design ensures participants **experience** nonlocality’s "weirdness" before dissecting it. Run it as a fast-paced game, and let the numbers drive the philosophy!
