answer: |-
  Here are the five objections, ranked by damage potential, with replies and weaknesses flagged:

  1.  **"Your 'common cause' model severs the truth-connection between the quale and the judgment. If the judgment isn't *responsive* to the quale itself, only to its neural correlate, what guarantees the judgment's accuracy? It seems like pure luck we get it right, undermining any epistemic justification for trusting our phenomenal judgments."**  
      *Reply:* The reliability stems from the neuro-functional process generating *both* the accurate judgment-state and the quale *systematically* – the judgment tracks the physical state which necessitates the quale, making true beliefs non-accidental.  
      *Weakness:* Concedes the judgment is only *indirectly* about the quale (via the neural state), potentially weakening the sense of "direct" awareness.

  2.  **"If qualia are truly epiphenomenal, why would evolution select for neural states that produce them? Their existence seems explanatorily redundant and biologically extravagant if they do absolutely nothing, not even guiding accurate reports."** (Likely from Chalmers-sympathizers or the prof)  
      *Reply:* Evolution selects for the neural mechanisms generating adaptive *behavior* and *judgments*; the emergence of non-functional qualia could be a brute metaphysical byproduct of implementing those mechanisms.  
      *Weakness:* Leaves qualia as a bizarre, inexplicable evolutionary spandrel, which many find unsatisfying or ad hoc.

  3.  **"You presuppose 'qualia' as intrinsic properties distinct from functional roles. But on a robust functionalist view, the judgment *is* (part of) the phenomenal state's realization; there's no 'gap' for the paradox to exploit. Your defense only works if we grant a dubious metaphysics of consciousness."** (From functionalist bloc)  
      *Reply:* My argument targets positions accepting non-functional qualia; if functionalism is true, the paradox dissolves, but my defense shows epiphenomenalism isn't *uniquely* vulnerable to it compared to dualism.  
      *Weakness:* Fails to engage the functionalist rejection of the problem's framing; concedes the defense is irrelevant if functionalism holds.

  4.  **"Why posit *actual* non-physical qualia at all if they do nothing? Isn't your view indistinguishable from illusionism – where we *judge* we have qualia but lack them – except you add an explanatorily idle extra layer?"** (The question you hope nobody asks)  
      *Reply:* The *phenomenal property itself* is what necessitates explanation beyond functional/neural processes; illusionism denies the datum we're trying to explain, while epiphenomenalism accepts it but denies its causal efficacy.  
      *Weakness:* Struggles to justify the ontological commitment to inert qualia over the simpler illusionist explanation, especially given identical behavioral/judgmental outputs.

  5.  **"Aren't you just pushing the problem back? The dualist posits a fundamental *interaction* law to explain psychophysical correlations. You posit a fundamental *supervenience* law plus causal overdetermination for judgments (neural cause + quale cause *if* it had power). Isn't your 'common cause' just overdetermination minus the mental cause?"** (Prof or sharp dualist-sympathizer)  
      *Reply:* No overdetermination: the judgment has *one* sufficient neural cause; the quale is a *dependent* concomitant with *no* causal power, so no overdetermination occurs, mirroring how dualists explain correlation without physical-to-mental causation.  
      *Weakness:* The "dependent concomitant" relation needs robust explanation (brute supervenience?) and the analogy to dualist correlation laws may feel equally mysterious.
