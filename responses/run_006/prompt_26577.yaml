  Second, the common cause objection from dualist-sympathizers is tricky because they'll demand why we'd evolve qualia at all if inert. The reply shifts to mechanism over teleology, but concedes evolutionary mystery. 

  Third, the functionalists will challenge the qualia concept itself. The reply must redirect to meta-judgments but won't satisfy eliminativists. 

