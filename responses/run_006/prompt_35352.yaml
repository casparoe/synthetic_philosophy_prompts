prompt: |-
  Right, I've been going down a bit of a rabbit hole reading about decision theory — a mate of mine who did PPE keeps sending me these paradoxes and I can't resist poking at them even though I'm just a programmer. The one that's really doing my head in is something called the absent-minded driver problem. I found a paper about it (I think it's by Piccione and Rubinstein, from the late 90s) and there's a section that I just can't get my head around. I've copied the gist of it below — I'm paraphrasing because the original notation is a bit heavy, but I think I've kept the logic intact.

  The setup is this: a driver is on a motorway with two identical-looking exits. He's absent-minded, meaning that when he reaches an exit, he can't remember whether it's the first or the second one. His preferences are: if he exits at the first exit, he gets a payoff of 0; if he exits at the second, he gets 4; if he stays on the motorway and misses both exits, he gets 1. Before setting off, he can plan: he chooses a probability p of exiting at any given exit. His expected payoff from the planning perspective is 0·p + 4·(1-p)p + 1·(1-p)², which simplifies to 1 + 2p - 3p². Maximising that gives p = 1/3, with an expected payoff of 4/3. So far so good. But now suppose he's actually at an exit, trying to decide what to do. He knows he's at some exit, but he doesn't know which one. He reasons that the probability he's at the first exit is 1/(1+p) and the probability he's at the second is p/(1+p). Using these self-locating probabilities, he calculates the expected payoff of continuing versus exiting, and finds that the optimal p is now 1/2, not 1/3. The authors claim this is a paradox: the planning stage and the action stage give different answers, and it's not obvious which one should govern his behaviour.

  I get the maths, sort of, but I'm struggling with the philosophical upshot. Is the point that there's a genuine inconsistency in how we should think about rational choice when memory is imperfect, or is one of the two calculations just wrong? I've seen people online say the action-stage reasoning is fallacious because it double-counts something, but others say it reveals a deep problem with our standard decision theory. I'd love a clear explanation of what the paradox is really about and whether it's been resolved. Also, do you have to buy into the self-locating probability stuff to make the paradox work, or is there a simpler way to see what's going on?

  Oh, and if you could end with a one-sentence summary that captures the core of the issue, that would be brilliant — something I can send back to my mate to show I've actually understood it.
