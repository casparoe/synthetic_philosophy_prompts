prompt: |-
  ok so i'm trying to sort out my views on insect sentience and the scale argument, and i want to know if what i believe actually hangs together. here's roughly where i am:

  (1) I think the probability that any given insect is sentient is very low — like, well under 1%. The behavioural evidence is ambiguous, the neuroanatomy is really different from vertebrates, and i'm not convinced by the argument that because they have nociceptors or avoid noxious stimuli they must feel pain.

  (2) But i also think the expected number of sentient insects is enormous, just because there are something like 10^18 insects alive at any one time. Even a 0.01% chance per insect gives you an expected 10^14 sentient beings — way more than all vertebrates put together.

  (3) I think expected moral value matters, and i think (2) means we should take insect welfare seriously in practice — funding research into it, maybe changing agricultural practices, that sort of thing.

  (4) However, i also think there's a cutoff: some probabilities are just too low to act on, even when the stakes are high. I wouldn't cross the street to avoid a one-in-a-billion chance of stepping on something sentient, and i think that's fine.

  (5) I think the scale argument doesn't work for nematodes or bacteria, because the probability of sentience there is effectively zero given what we know about nervous systems — they just don't have the right kind of organisation.

  (6) I think phenomenal consciousness requires integrated information of the sort that even a simple insect brain could in principle support — it's not a matter of raw neuron count, but of the right kind of causal density.

  (7) I'm a physicalist about consciousness and i think the hard problem is real but soluble.

  (8) I think we have stronger reason to avoid causing possible suffering than to promote possible positive experiences, so the asymmetry matters for how the expected value cashes out.

  go through these and tell me which pairs are in tension and how badly. i want the tensions ranked by severity, not just a list of everything that rubs against everything else. for each tension, say what would have to give. and if any of the apparent tensions dissolve on closer inspection, flag those too — i don't want to revise something i don't have to. please write in british english.
