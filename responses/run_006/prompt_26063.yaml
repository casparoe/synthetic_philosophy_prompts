  ok so my friend keeps citing thomson's violinist to settle abortion debates and i'm not sure it does as much work as she thinks. the setup: you wake up in a hospital bed with your kidneys plugged into a famous violinist. the society of music lovers kidnapped you without consent. if you unplug, he dies. you only need to stay connected for nine months. thomson says: even if the fetus is a person with a right to life, the right to life isn't a right to use someone else's body, so abortion is permissible.

  i want to do a proper audit of how far this analogy actually carries. give me the mapping: what's the violinist, the kidnapping, the nine months, the unplugging, the kidneys, the hospital? then walk me through the disanalogies. i know the obvious one about consent—most pregnencies aren't from kidnapping—but i'm more interested in the subtler ones people miss. like, is unplugging the same kind of act as abortion? does the fact that pregnancy involves a unique biological relationship (the fetus isn't just passively filtering blood) matter? and does the parent-child relationship import obligations that the stranger-violinist relationship doesn't?

