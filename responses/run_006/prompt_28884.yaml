prompt: |-
  In most ordinary moral discourse, we treat a piece of moral criticism as dismissible — or at least as carrying less weight — when it comes from someone who engages in the very conduct they are condemning. The cheating spouse who lectures others about fidelity, the polluting corporation that runs ads about environmental responsibility, the politician who evades taxes while denouncing public fecklessness: in each case the common reaction is not that the criticism is false, but that the speaker lacks the standing to make it. We say "you're one to talk," "clean up your own house first," "who are you to judge?" And this reaction isn't merely an emotional one; it is treated, in practice, as a reason to set the criticism aside — in workplace complaints, in public debate, in friendship, and sometimes even in legal reasoning (for instance, in the clean-hands doctrine in equity, or in the admissibility of certain character evidence).

  But this practice is puzzling in several ways. First, it seems to treat moral criticism as something other than the assertion of a true proposition: if the criticism is true, why should the identity of the speaker matter? We don't dismiss a mathematician's proof because the mathematician is a hypocrite. Second, the practice is selective. A judge who has committed crimes can still sentence a criminal; a philosopher who doesn't live by their own ethical views can still be correct; a doctor who smokes can still tell a patient to quit. So the practice of discounting hypocritical blame doesn't apply to all normative speech — it seems to track something specific about blame in particular. Third, the practice seems to presuppose that blame does something beyond describing a wrong: that it involves a kind of standing, authority, or entitlement that can be forfeited. But what exactly is that thing, and how is it forfeited? Does any inconsistency between one's behavior and one's criticism destroy standing, or only certain kinds? If I condemn dishonesty but once told a white lie, have I lost standing to blame a fraudster? If not, where is the line?

  I want you to reconstruct the implicit theory of blame — of what blame is and what it requires of the blamer — that this widespread practice presupposes. In particular:

  - What must blame be, such that hypocrisy undermines it in a way it doesn't undermine other forms of normative speech (advice, legal judgment, mathematical criticism)?
  - What account of standing does the practice commit us to? Is standing a matter of the speaker's own moral record, their commitment to the norm they invoke, the relationship between speaker and target, or something else?
  - Is the practice internally consistent? That is, does it treat hypocrisy as undermining blame in some contexts but not others, and if so, can those distinctions be justified by the underlying theory, or do they reveal a contradiction?
  - What would have to change in our practices — in how workplaces handle complaints, in the norms of public political criticism, in the law — if we replaced the presupposed theory with a view on which blame is nothing more than the assertion of a moral truth, and standing is irrelevant?

  Please take a definite position: don't just lay out the options. Tell me what theory of blame you think the practice actually commits us to, where the practice is underdetermined (so that several theories could license it), and where the practice is philosophically inconsistent and needs revision.
reasoning: |-
  Hmm, this user presents a sophisticated analysis of hypocrisy's role in moral discourse. They've identified key puzzles: why we dismiss hypocritical blame but not other normative speech, why the practice is selective, and what underlying theory of blame it presupposes. The user clearly wants more than a survey of theories - they demand a reconstructed implicit theory with definite commitments.

  The cheating spouse/polluting corporation examples reveal a core insight: blame isn't just truth-telling but a performative act. When we say "who are you to judge?", we're rejecting the blamer's authority, not the proposition's truth. This suggests blame has three dimensions missing in mathematical criticism: it's relational (requiring standing), performative (enacting a social sanction), and identity-dependent (tied to the blamer's own conduct).

  For the standing question, the "clean hands" legal doctrine is crucial. Standing here isn't about moral purity but consistency in invoking shared norms. A judge sentencing criminals doesn't need personal righteousness because they're acting as an institutional agent, not a personal moral critic. The corporate hypocrisy example works precisely because they're pretending to moral authority while violating the very norms they invoke.

  The inconsistency puzzle is thorniest. We accept smoking doctors giving health advice because their role separates personal conduct from professional expertise. But if that same doctor condemned smoking at a town hall as a community leader, hypocrisy might undermine them. The line seems to be whether the speaker is acting as a norm-enforcer of a community they themselves reject through their actions.

  If we adopted a purely propositional view of blame, workplace complaints would become forensic truth-finding exercises, ignoring relational history. Political debate would lose its character-building dimension. Legal systems might abandon character evidence entirely - though interestingly, the "clean hands" doctrine shows law already recognizes some performative aspects of morality.

  The reconstruction must account for why we sometimes accept "reformed hypocrites" as blamers. A politician who evaded taxes but later paid penalties and reformed might regain standing - suggesting forfeiture is temporary and redeemable through changed conduct and restitution. This points to a communitarian view where standing depends on participating in the moral practice one invokes.
answer: |-
  The practice you describe commits us to a **performative-expressive theory of blame**, where blame is not merely the assertion of a moral truth but a social act that demands specific normative conditions for its legitimacy. Here’s the reconstructed theory, grounded in the practice’s implicit logic:

  ---

  ### **1. What Blame Must Be: A Performative Social Sanction**  
  Blame is distinct from other normative speech (e.g., mathematical criticism, medical advice) because it serves three interconnected functions:  
  - **Performative Authority**: Blame enacts a social sanction, positioning the blamer as an enforcer of shared norms. It aims to elicit shame, repentance, or restitution from the target.  
  - **Expressive Commitment**: Blame expresses the blamer’s personal investment in the norm. It signals, "This norm matters enough for me to hold you accountable."  
  - **Relational Standing**: Blame operates within a web of mutual moral obligations. To blame is to claim membership in a moral community whose norms bind both parties.  

  **Why hypocrisy undermines blame but not other speech**:  
  - A hypocrite violates the *expressive commitment* and *relational standing* requirements. By flouting the norm they invoke, they signal that the norm does not genuinely bind them, making their "enforcement" illegitimate. Advice or factual criticism (e.g., a doctor urging smoking cessation) relies on expertise, not shared moral commitment. Legal judgment derives authority from institutional roles, not personal integrity.  

  ---

  ### **2. The Account of Standing: Relational Moral Reciprocity**  
  Standing is forfeited when the blamer’s conduct violates the **principle of reciprocity** inherent in moral communities. Key elements:  
  - **Violation of Mutual Accountability**: To blame others, one must be subject to the same norm. A tax-evading politician denouncing public fecklessness exempts themselves from the reciprocity that underpins communal trust.  
  - **Erosion of Moral Credibility**: Hypocrisy exposes the blamer’s insincerity, making their criticism a tool of manipulation (e.g., the polluting corporation’s ads) rather than a call to shared values.  
  - **Contextual Threshold**: Standing isn’t forfeited for *any* inconsistency but for **unrepentant patterns that negate commitment**. A person who once told a white lie retains standing to condemn fraud if they acknowledge their lapse and uphold the norm overall. The line is crossed when hypocrisy reveals **contempt for the norm itself** (e.g., the cheating spouse).  

  **Why some roles (judges, doctors) are exempt**:  
  These actors derive standing from *institutional authority* or *expertise*, not personal conduct. A judge sentences as an agent of the law, not as a moral exemplar. A smoker-doctor’s advice is valid because it is grounded in medical facts, not moral reciprocity.  

  ---

  ### **3. Internal Consistency: Contextual Validity with Tensions**  
  The practice is **internally consistent in principle but inconsistently applied**:  
  - **Consistency**: The theory uniformly holds that blame requires *moral credibility* and *reciprocity*. Hypocrisy undermines blame only in contexts where personal commitment is relevant (e.g., friendships, public moral appeals) but not in role-based contexts (e.g., judges, doctors).  
  - **Inconsistencies**:  
    - **Selective Strictness**: We often overlook minor hypocrisy (e.g., a parent who occasionally speeds lecturing on reckless driving) but condemn major violations. This aligns with the "contempt for the norm" threshold but risks arbitrariness.  
    - **Reformed Hypocrites**: We sometimes accept blame from those who acknowledge past faults (e.g., a recovered addict criticizing substance abuse). This fits the theory if repentance restores commitment.  
    - **Problem Cases**: Criticizing *unrelated* conduct (e.g., a liar condemning bigotry) often retains standing. Here, hypocrisy only undermines blame when it concerns the *same norm*.  

  **The Justification**: Distinctions hold because blame’s legitimacy depends on whether the hypocritical act **directly invalidates the blamer’s commitment to the specific norm invoked**.  

  ---

  ### **4. Implications of Replacing the Theory: A Procedural Moralism**  
  If we reduced blame to "asserting moral truth" (a **propositional theory**), our practices would undergo radical shifts:  
  - **Workplace Complaints**: Hypocrisy would be irrelevant. A manager guilty of harassment could credibly investigate similar claims. Result: Erosion of trust, as complaints become purely forensic, ignoring relational equity.  
  - **Public Debate**: Political criticism would focus solely on factual accuracy. A corrupt politician’s critique of corruption could not be dismissed ad hominem. Result: Cynicism, as moral appeals lose power to inspire collective action.  
  - **Legal Reasoning**:  
    - The "clean-hands doctrine" (denying relief to those acting unfairly) would collapse.  
    - Character evidence (e.g., exposing a witness’s hypocrisy) might be excluded as irrelevant to truth.  
    Result: Law becomes amoral, prioritizing procedure over equity.  

  **The Cost**: Moral discourse would lose its **community-sustaining function**. Blame would cease to reinforce shared norms through mutual accountability, becoming a cold exchange of propositions.  

  ---

  ### **Conclusion: The Practice’s Philosophical Commitments**  
  The practice presupposes a **communitarian-expressive theory of blame**:  
  - **What it gets right**: Blame *is* a social performance requiring reciprocity. Hypocrisy rightly undermines it because morality is relational, not just propositional.  
  - **Where it’s underdetermined**: The threshold for "forfeiting standing" needs clearer standards (e.g., distinguishing isolated lapses from systemic contempt).  
  - **Where it needs revision**: We should formalize exceptions for **role-based blame** (judges, regulators) and **reformed hypocrites**, emphasizing repentance as a path to restored standing.  

  The practice is philosophically sound but pragmatically messy. It reveals that **morality is not just about truth but about holding each other accountable in a community of mutual respect**—a feature we lose at our peril.
