prompt: |-
  I'm prepping for a metaphysics comp on propositions and I keep going in circles, so I want to nail down the spec before I read one more paper. You're a professional metaphysician who works on the unity of the proposition; think carefully, and before you give me the final list, brainstorm out loud for a bit so I can see how you're sorting the requirements.

  Here's the ask. Before I compare Frege-style unsaturated concepts, Russell's multiple-relation idea, structured-proposition views, and the newer act-theoretic accounts, I want the desiderata: what does any adequate theory of the unity of the proposition have to deliver? I mean the old problem — the proposition that Socrates is wise is one thing, not a mere list of Socrates and wisdom, and adding an instantiation relation to glue them together seems to launch Bradley's regress (what glues the glue to the things it glues?). Give me the requirements list, with the case or argument behind each. For each requirement, say wether its non-negotiable or just one camp's preference, and flag any pairs you suspect can't be jointly satisfied. If some single requirement does the most work to kill off the usual candidates, point that out. Keep the scorecard of the theories brief — the criteria are what I actually need.

  Make sure the list at least grapples with: false propositions (Socrates is foolish), relational propositions where argument order matters (Brutus stabbing Caesar vs. Caesar stabbing Brutus), logically complex propositions, the distinction between the unity of a proposition and the unity of a fact (or a defense of collapsing it), and the fact that a finite thinker can grasp indefinitely many novel ones.
