answer: |-
  Here's a professional metaphysician's breakdown of the desiderata for a theory of propositional unity, structured to help you evaluate the contenders. I'll brainstorm the key pressures first, then present the formal criteria list.

  **Brainstorming the Pressures:**

  1.  **The Core Intuition:** The proposition *that Socrates is wise* is a single, unified thing that *says something* about the world. It's not just the set {Socrates, Wisdom} or the list <Socrates, Wisdom>. The latter are inert collections; the proposition is *about* Socrates *possessing* Wisdom. This "aboutness" or "predicative togetherness" is what needs explaining. Bradley's regress screams that adding a special "glue" relation (like instantiation) between Socrates and Wisdom just creates a *new* complex (Socrates, Wisdom, Instantiation) that itself needs gluing *ad infinitum*. The solution *cannot* be another component.

  2.  **Falsehoods:** The proposition *that Socrates is foolish* is just as unified, just as meaningful, just as much an object of thought/belief as a true one. It has *determinate* truth conditions (it's false iff Socrates is not foolish). A theory collapsing propositions into facts (actual worldly complexes) fails spectacularly here. The unity must be independent of truth.

  3.  **Order & Asymmetry:** *That Brutus stabbed Caesar* is fundamentally different from *that Caesar stabbed Brutus*. The roles (subject, object, relation) matter. A mere set or list without intrinsic order can't capture this. The theory must explain how the *relation* takes its *arguments* in a specific *order*.

  4.  **Complexity:** We understand *that it is not raining and the sun is shining*. The proposition isn't atomic; it's composed of simpler propositions and logical operators. The theory must explain how this composition preserves unity without invoking glue at every level. How does negation "bind" to the proposition it negates?

  5.  **Propositions vs. Facts:** Facts (if they exist) are typically thought of as *truthmakers* – worldly situations. Propositions are *truth-bearers* – the things that are true or false. The unity of the proposition "Socrates is wise" is what *allows* it to represent the fact *that Socrates is wise* (if it exists). Conflating them (e.g., some naive Russellian facts as propositions) makes false propositions mysterious and struggles with modality. A theory needs to account for the unity *of the representational vehicle* (the proposition) distinct from the *represented state* (the fact, if it obtains).

  6.  **Cognitive Grasp:** Finite minds can understand, believe, doubt, and communicate *novel* propositions they've never encountered before (e.g., "The 1000th prime number is even"). This strongly suggests that propositions are *generated* or *composed* from a finite stock of concepts/constituents according to rules (compositionality). The theory must explain how this combinatorial process yields unified wholes graspable by minds.

  7.  **Abstractness:** Propositions are typically taken to be abstract entities, existing independently of particular thinkers or utterances. This avoids psychologism (reducing meaning to individual mental states) and grounds objectivity. The unity must be achievable abstractly.

  **Formal Desiderata List for Propositional Unity:**

  1.  **Unity Without Glue (Non-Negotiable)**
      *   **Requirement:** The theory must explain how the constituents (e.g., Socrates-concept, Wisdom-concept) form a single, unified proposition *without* postulating a further "gluing" relation binding them together. This avoids Bradley's regress.
      *   **Argument:** Bradley's regress shows that adding a relation to bind constituents creates a new complex needing its own binder, leading to infinite regress. The unity must be intrinsic or emergent from the nature of the constituents/arrangement itself.
      *   **Killer For:** Naive "set + glue" theories, early versions of Russell's Multiple Relation Theory (if the relation is seen as another component needing binding).

  2.  **Accommodation of Falsehood (Non-Negotiable)**
      *   **Requirement:** The theory must account for the existence, unity, and determinate truth conditions of *false* propositions just as robustly as true ones.
      *   **Argument:** False propositions are objects of thought, belief, and assertion; they have meaning and specific truth conditions. A theory tying propositional existence/unity to the existence of a corresponding fact (or truthmaker) fails utterly.
      *   **Killer For:** Theories that identify propositions with facts or states of affairs. A major challenge for naive correspondence views of unity.

  3.  **Argument Order / Relational Asymmetry (Non-Negotiable)**
      *   **Requirement:** The theory must explain how the proposition fixes the specific roles (e.g., subject, object, predicate, relation) and order of its constituents, especially in relational propositions.
      *   **Argument:** *aRb* ≠ *bRa*. The difference between *Brutus stabbed Caesar* and *Caesar stabbed Brutus* is fundamental and must be captured by the proposition's structure, not just its constituents.
      *   **Killer For:** Unordered set theories. A challenge for theories that struggle with asymmetric relations (e.g., some interpretations of Frege where functions don't inherently specify argument order sufficiently).

  4.  **Logical Compositionality (Non-Negotiable)**
      *   **Requirement:** The theory must explain how logically complex propositions (negations, conjunctions, disjunctions, quantifications) are unified wholes composed from simpler propositional components and logical operators.
      *   **Argument:** We grasp complex propositions systematically. The unity of `not-P` must involve `not` binding `P` without a separate gluing relation. The theory needs a recursive account of unity.
      *   **Killer For:** Theories only designed for atomic propositions. A challenge for views treating propositions as completely unstructured.

  5.  **Fact-Proposition Distinction (Highly Preferred, Near-Negotiable)**
      *   **Requirement:** The theory should distinguish the *proposition* (the unified truth-bearer) from the *fact* (the unified truthmaker, if it exists). The unity of the proposition should be prior to and independent of the obtaining of a fact.
      *   **Argument:** False propositions lack corresponding facts. Facts are typically concrete, spatiotemporal complexes (if they exist), while propositions are abstract. Collapsing them makes falsehood inexplicable.
      *   **Tension Risk:** Some theories (e.g., certain structured proposition views) risk blurring this line if their structure is too "worldly". Defending the collapse requires solving the falsehood problem within the collapsed view.

  6.  **Cognitive Finitude & Novelty (Non-Negotiable)**
      *   **Requirement:** The theory must explain how finite thinkers can grasp indefinitely many novel, unified propositions.
      *   **Argument:** Our linguistic and cognitive competence is productive. We understand new combinations of concepts. The unity must arise from combinatorial rules operating on a finite basis (concepts, modes of combination).
      *   **Tension Risk:** With views positing propositions as *sui generis* abstract simples (if they lack compositional structure). How are novel ones grasped?

  7.  **Atomic Truth Conditions (Non-Negotiable)**
      *   **Requirement:** The unified proposition must determine its own (atomic) truth conditions – what the world would have to be like for it to be true.
      *   **Argument:** Meaning is tied to truth conditions. The proposition *that Socrates is wise* means that the individual Socrates instantiates the property Wisdom. Its unity *just is* what sets up this condition.
      *   **Foundation:** This is often the *result* a successful theory of unity delivers. Failure to deliver it means the theory hasn't solved the problem.

  8.  **Abstractness (Highly Preferred)**
      *   **Requirement:** The theory should be compatible with propositions being abstract, mind-independent entities (though their *grasp* involves minds).
      *   **Argument:** Needed for objectivity, shared content across thinkers/times, and modal truths (propositions can be true necessarily or possibly without corresponding concrete facts).
      *   **Tension Risk:** Primarily with strong psychologistic or nominalist views. Act-theoretic views need careful formulation to avoid psychologism.

  **Key Tensions & Killer Criteria:**

  *   **The Biggest Tension:** **Unity Without Glue** vs. **Compositionality**. How do you have genuinely complex structure *without* needing relations to bind the components? This is the core puzzle. Structured propositions answer with primitive "binding" in tuples; Frege answers with unsaturatedness; Act theories answer with the act itself.
  *   **The Killer Combo:** Failure on **Unity Without Glue** (triggering Bradley's regress) or **Accommodation of Falsehood** immediately sinks a theory. These are the most fundamental and non-negotiable.
  *   **Cognitive Finitude & Novelty** is a major challenge for unstructured views (e.g., Russellian Propositions as properties of the world) and a pressure point for Fregean senses (how many primitive senses are there?).

  **Very Brief Theory Scorecard (Ref Criteria):**

  *   **Frege (Senses):** Excels at 1 (Unsaturatedness avoids glue), 2, 3 (Argument places), 8. Struggles with 4 (Composition of senses complex), 6 (Grasping infinitely many primitive senses?).
  *   **Russell (Multiple Relation):** Aims for 1 (Relation relates minds & objects, not objects directly), 6. Fails catastrophically at 2 (Tied to judgment act, no false propositions initially), struggles with 3 & 4.
  *   **Structured Propositions (Tuples):** Excels at 3, 4, 6, 7. Struggles with 1 (Is the tuple structure itself glue? Primitive binding?), 5 (Risk of collapsing with facts), 8 (Nature of abstract tuples).
  *   **Act-Theoretic (Hanks, Soames):** Excels at 1 (Unity in the act), 2, 3, 4 (potentially), 6. Struggles with 5 (Acts vs. abstract types), 8 (Abstractness of types), explaining normativity/objectivity.

  **Your Next Step:** Use this list as a checklist. For each major theory (Frege, Russell MRT, Structured Props, Act-Theoretic), go down the list: How does it attempt to satisfy each desideratum? Where does it clearly succeed? Where does it clearly fail? Where is it controversial or requires special pleading? This will reveal the core strengths, weaknesses, and trade-offs inherent in each approach, moving you beyond circles into structured comparison. Good luck with the comp!
