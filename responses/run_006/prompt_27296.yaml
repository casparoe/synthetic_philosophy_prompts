prompt: |-
  I'm trying to locate a disagreement with a colleague who works on Buddhist ethics. My credence that the ethical framework found in classical Indian Mahāyāna Buddhism is fundamentally consequentialist in structure — meaning that the rightness of an action is determined entirely by its expected consequences for the welfare of sentient beings — is roughly 0.6. Hers is roughly 0.15. I don't want a survey of the literature or a 'both sides have a point' summary. I want your own credence with the reasoning decomposed.

  Specifically, I want you to break the question into the sub-claims your credence rides on. At a minimum, address these: (1) Does the bodhisattva's permission to violate precepts when doing so would benefit others — the doctrine of skillful means — reveal that the underlying structure of the ethics is act-consequentialist, or is it better understood as a special override that presupposes the default bindingness of deontological constraints? (2) Does the doctrine of karma itself function as a consequentialist mechanism — that is, does it make the moral quality of an action depend on its effects, mediated by an impersonal natural law — or does karmic causation operate in a way that cuts across the consequentialist–deontological distinction? (3) Does the central role of intention and mental purification in Buddhist ethics make the framework fundamentally virtue-ethical, such that right action is derivative from good character rather than from expected outcomes, with consequences mattering only instrumentally? Are there further sub-questions I am missing that carry significant weight?

  For each sub-claim relevant to the overall question, give a rough probability and a one-sentence justification. Then state how these combine to yield your overall credence. Finally, identify which sub-question your overall credence is most sensitive to, and which one most likely explains the gap between 0.6 and 0.15. Keep your response to no more than 500 words.
reasoning: |-
  Okay, the user is deeply engaged in a scholarly debate about whether classical Indian Mahāyāna Buddhist ethics is fundamentally consequentialist. They have a credence of 0.6 while their colleague holds 0.15. They want my own reasoned credence without fence-sitting, specifically decomposed into key sub-questions about skillful means, karma, and virtue ethics. 

  Hmm, this requires careful handling. The user clearly rejects superficial "both sides" answers and wants probabilistic rigor. Their frustration with vague scholarly compromises suggests they've hit dead ends in their debate. I should avoid regurgitating literature and instead model how the doctrinal pieces interconnect. 

  First, skillful means (upāya). If precept violations are permitted solely when beneficial to others, that screams consequentialist structure. But what if it's just an emergency exception? The Pāramitā texts show bodhisattvas systematically prioritizing welfare over rules, which leans toward consequentialism. I'll put this at 0.7. 

  Then karma. The user frames it as potentially consequentialist via cause-and-effect. But karma's moral quality feels deontological - bad intentions yield bad fruits regardless of outcomes. The Vibhaṅga's emphasis on cetana (intention) as karma's essence complicates things. Still, consequences manifest through natural law, so I'll split the difference at 0.5. 

  Ah, virtue ethics. The eightfold path centers on mental purification. But is cultivating wisdom and compassion inherently virtue-ethical? Not necessarily - the Bodhicaryāvatāra treats virtues as tools for suffering reduction. That consequentialist telos makes virtue derivative. Strong 0.8 here. 

  Wait, a missing piece: nirvana's role. If enlightenment is non-consequentialist (beyond welfare), that undermines pure consequentialism. But Mahāyāna defines buddhahood as compassion-in-action. I'll add this at 0.65. 

  Combining these: Skillful means and virtue's instrumental role pull toward consequentialism; karma and nirvana tug weakly away. Weighted average lands at 0.65. 

  The biggest sensitivity? Skillful means - if that's truly an override (not structural), my whole argument crumbles. The colleague's 0.15 likely stems from reading karma/nirvana as non-utilitarian. 

  ...Better flag that my analysis assumes "fundamental structure" means what ultimately justifies actions. The colleague might define ethics via practitioner psychology instead. That definitional gap could explain the divide.
answer: |-
  Here is my decomposed credence (0.65) on classical Indian Mahāyāna ethics being fundamentally consequentialist:

  1.  **Skillful Means as Structural (not Override):** Credence 0.7  
      *Justification:* The systematic justification for violating precepts in Mahāyāna sūtras (e.g., *Upāyakauśalya*, *Vimalakīrti*) hinges *solely* on the bodhisattva's compassionate assessment of net benefit for sentient beings, suggesting consequence-maximization is the foundational principle, with precepts being contextually binding only insofar as they typically serve that end.
  2.  **Karma as Consequentialist Mechanism:** Credence 0.5  
      *Justification:* While karma's operation *is* mechanistic and effect-based (making moral quality depend on future outcomes), the *definition* of "unwholesome" action (rooted in greed, hatred, delusion) is primarily intention-based and psychologically deontological, cutting across pure consequentialism.
  3.  **Virtue as Instrumental to Consequences:** Credence 0.8  
      *Justification:* Mental purification (śīla, samādhi, prajñā) and intention are cultivated explicitly to eliminate suffering and promote welfare (the consequentialist aim); virtues like compassion and wisdom are means, not ends in themselves, as seen in the Bodhicaryāvatāra's focus on suffering reduction.
  4.  **Nirvana as Ultimate Consequence?:** Credence 0.65 (Missing Sub-question)  
      *Justification:* While enlightenment transcends conventional "welfare," Mahāyāna defines Buddhahood by limitless capacity for compassionate action (benefiting beings), making the framework's ultimate orientation consequentialist.

  **Combination:** Skillful means (0.7) and virtue's instrumental role (0.8) strongly support consequentialism; karma (0.5) is neutral; Nirvana's orientation (0.65) weakly supports. Weighting skillful means and virtue ethics most heavily yields an overall credence of **0.65**.

  **Sensitivity:** My credence is most sensitive to **Skillful Means (1)**. If skillful means is merely an *override* of binding deontic rules, consequentialism collapses (credence ~0.3). The primary gap between your view (0.6) and your colleague's (0.15) likely stems from differing interpretations of **Karma (2)** – she likely emphasizes its intention-based, non-utilitarian definition of moral quality (seeing it as deontological/virtue-based), while you emphasize its consequentialist operation.
