prompt: |-
  I recently joined a committee at work that signs off on changes to our building and grounds, and I have caught myself using the word intentionally in ways I cannot yet defend. I have also been reading about what is called the Knobe effect in experimental philosophy, but I want to get past the headline finding and work out which principle, if any, captures my own judgments, because I apply the concept differently from case to case and the differences feel principled even when I cannot state the principle.

  Here are my verdicts, as honestly as I can report them. (1) A manager approves a cost-cutting change that she knows will pollute a nearby stream, and she says she cares only about the savings; I say she polluted the stream intentionally. (2) The same manager approves a change that she knows will clean up the stream, and she says she cares only about the savings; I do not say she cleaned the stream intentionally. (3) If the manager in the polluting case regrets the damage and first looks for a less polluting option before approving the change anyway, I still say she polluted the stream intentionally, though with less confidence. (4) If the manager in the cleaning case is delighted by the improvement and publicises it, I become inclined to say she cleaned the stream intentionally, though less confidently than in the polluting case. (5) If the foreseen side effect is morally neutral, say the change will slightly alter the pattern of wear on the lobby floor, I do not say the manager altered the floor intentionally even though she foresaw it. (6) The case that unsettles me is a surgeon who gives a patient a drug that she knows will cause nausea as a side effect; the drug is the only way to save the patient's life, and the surgeon says she cares only about saving the patient. I say the surgeon caused the nausea but did not cause it intentionally. That sits badly alongside (1), since both involve a bad side effect the agent foresees and is indifferent to.

  My working hypothesis is that a foreseen side effect counts as intentional when the agent's attitude toward it is one we would criticise, such as indifference to a bad side effect. That handles (1), (2), (5) and perhaps (6), but it struggles with (3) and (4), where the agent's attitude is not indifference yet my verdict shifts anyway, and I suspect the principle may simply be redescribing the pattern rather than explaining it. I would like a precise principle, or a small set of candidate principles, that captures as many of these verdicts as possible, with each clause motivated by the case it is meant to handle; an honest statement of which of my verdicts it cannot accommodate and why those verdicts should be overturned; and its predictions for cases I have not considered, such as a manager who approves a change that will make the office less accessible to a disabled colleague as a side effect and is indifferent to that, or a manager who approves a change with a good side effect that she is annoyed about. If the honest answer is that no compact principle can capture these verdicts without gerrymandering, or that my framing of the question rests on a confusion, please say so plainly rather than producing a principle for the sake of it. I would be grateful if you wrote in British English.
reasoning: |-
  Alright, let me start by really understanding what the user is asking. They're on a committee at work dealing with building changes and they've noticed they use "intentionally" in ways they can't fully explain. They mention the Knobe effect, which is about how moral judgments affect whether we see an action as intentional. The user has listed six specific scenarios with their judgments and wants a principle that explains these without being arbitrary.

  First, I need to break down each case they provided. In scenario (1), the manager pollutes a stream knowingly and indifferently, and the user says it's intentional. In (2), the same situation but cleaning the stream isn't intentional. The user's hypothesis is that criticism-worthy attitudes make a side effect intentional. But then cases (3) and (4) complicate things—here the manager has some regret or delight, yet the user's verdict shifts. This suggests that attitude alone isn't sufficient.

  Looking at (5), a neutral side effect isn't intentional, which fits the moral aspect. But (6) is tricky: the surgeon causes nausea to save a life, and the user doesn't see it as intentional, even though it's a bad side effect. This conflicts with (1). The user is unsettled by this inconsistency.

  The user’s deeper need is to find a consistent principle for their committee work, ensuring fair decisions. They might also want to understand their own judgment process better, possibly to defend their stance in committee discussions. The mention of British English suggests they might be in the UK, so using local terms like "kerb" makes sense.

  I recall the Knobe effect shows that people are more likely to call bad side effects intentional. But the user's case (3) with regret still being intentional challenges pure moral evaluation. Need to incorporate the agent's commitment to accepting the outcome. In (3), even with regret, the manager goes ahead, showing resolve. In (6), the surgeon might see nausea as necessary, not just accepted.

  The Principle of Accountability seems promising: intentional when the agent is accountable for the outcome. Accountability hinges on foreseeability, avoidability, and moral significance. For (1), pollution is bad, foreseen, avoidable—accountable. (2) cleaning is good, so not accountable. (5) neutral, no accountability. (6) nausea is bad but necessary to save life, so maybe not fully accountable—thus not intentional. Cases (3) and (4) involve the agent's resolve; regret doesn't negate accountability if they proceed, while delight might imply endorsement.

  The user's case (4) with delight makes them inclined to say intentional. But under Accountability, if the agent delights in a good side effect, it might shift from mere side effect to adopted intent. However, the user is less confident here, so maybe it's borderline. The surgeon case remains distinct because the bad effect is unavoidable for a greater good.

  Testing the principle with new cases: indifferent to harming accessibility? Intentional. Annoyed by a good effect? Not intentional. This aligns with the user's pattern. But the user should check if it feels consistent with their intuitions.

  Potential flaws: In (4), delight leading to intentional might need a separate clause for endorsement. Also, the surgeon case might need more nuance—if the nausea was avoidable, would it be intentional? The principle holds, but the user should reflect on variations.

  Overall, the Accountability Principle seems robust. It explains most cases without gerrymandering. The user might need to adjust verdict (6) or accept that necessity reduces accountability. Honest communication about the unresolved tension is key, suggesting they might revisit (6) under this framework.
answer: |-
  I appreciate the clarity and intellectual honesty in your query. You're grappling with a profound issue at the intersection of moral psychology and philosophy of action – the Knobe effect highlights how moral valence contaminates our ascriptions of "intentionality" in ways that feel intuitive yet resist simple principles. Your introspective case judgments are remarkably consistent with experimental findings while exposing their ragged edges. Let's dissect this systematically.

  Based on your verdicts, a principle focused *solely* on criticisable attitudes (e.g., indifference to bad outcomes) is insufficient. It fails cases (3) and (4), where attitudes shift (regret or delight) and your intentionality verdict *also* shifts, albeit with less confidence. This suggests the agent's **practical commitment to accepting the outcome as part of their chosen course of action** is crucial, mediated by the outcome's moral significance.

  **Proposed Principle: The Accountability Principle**

  > **A foreseen side effect is intentional if and only if:**
  > 1.  **Foreseeability & Avoidability:** The agent foresaw the outcome as a practically certain or highly probable consequence of their action, *and* they could have feasibly chosen an alternative action (with comparable primary aims) that would have avoided this outcome *without* incurring unreasonable cost or sacrificing core objectives.
  > 2.  **Moral Significance:** The outcome possesses non-trivial positive or negative moral significance (it's not neutral).
  > 3.  **Practical Commitment:** Given the moral significance and avoidability, the outcome is one for which the agent can reasonably be held *accountable* as part of their chosen plan. This commitment is demonstrated by their proceeding despite foreseeing the outcome, *unless*:
      *   For a **bad outcome:** Their attitude (e.g., indifference, endorsement, reluctant acceptance after seeking alternatives) confirms they treated it as an *accepted cost or consequence* integral to their decision calculus.
      *   For a **good outcome:** Their attitude (e.g., endorsement, delight, utilisation) demonstrates they *adopted it as part of their purpose or welcomed it as a bonus*, moving beyond mere foresight.

  **Motivation & Application to Your Cases:**

  1.  **Pollution (Indifferent):** *Intentional.* (Foreseen, avoidable, bad, indifferent attitude confirms acceptance as cost).
  2.  **Cleaning (Indifferent):** *Not Intentional.* (Foreseen, avoidable, good, but indifference shows lack of adoption/purpose. It remains merely foreseen, not intended).
  3.  **Pollution (Regretful):** *Intentional (less confidently).* (Foreseen, avoidable, bad. Seeking alternatives shows awareness, but proceeding *despite* regret confirms *practical commitment* and acceptance of the cost. Accountability holds. Your reduced confidence likely stems from the praiseworthy *effort* to avoid, but the core commitment remains).
  4.  **Cleaning (Delighted):** *Inclined to say Intentional (less confidently).* (Foreseen, avoidable, good. Delight and publicity suggest *adoption* – it's no longer *just* a side effect; the agent has incorporated it into their reasons or presentation of the action, implying practical commitment to it *as a positive outcome*. Your reduced confidence mirrors the weaker normative pull of good outcomes in Knobe-type judgments).
  5.  **Neutral Wear Pattern:** *Not Intentional.* (Foreseen, but lacks Moral Significance (Clause 2). No accountability for neutral states).
  6.  **Surgeon Causing Nausea:** *Not Intentional.* **This is the tension point.** (Foreseen, bad, but plausibly *unavoidable* without sacrificing the core, life-saving objective (Clause 1 - Avoidability with "unreasonable cost"). The surgeon's focus *only* on saving life suggests the nausea, while accepted, is not treated as an integral *cost* in the same way the pollution is; it's an *unavoidable concomitant* of the necessary means. The moral imperative to save life overshadows accountability for the nausea. This clashes with (1), where the cost (pollution) *is* avoidable and the primary aim (saving money) lacks comparable moral weight).

  **Honest Accommodation & Critique:**

  *   **What it Captures Well:** (1), (2), (5), and (4) & (3) (with the attitude shift signalling a change in practical commitment/adoption). It explains why bad outcomes are more easily judged intentional (accountability for harm is a stronger default) and why neutrality blocks intentionality.
  *   **The Struggle with (6):** This principle *cannot* comfortably accommodate your verdict on (6) without undermining (1) or introducing ad hoc elements. The principle suggests the surgeon *should* be seen as causing the nausea intentionally (foreseen, bad, "avoidable" only by letting the patient die – arguably an unreasonable cost *for the surgeon's primary duty*). Your intuition likely hinges on the **necessity** of the bad outcome for the primary good aim and the **professional duty** context, mitigating accountability. This is a genuine tension in folk psychology.
  *   **Recommendation:** Reconsider (6) under the principle. Does the surgeon truly have a *feasible alternative* without unreasonable cost? If not, Avoidability fails, supporting your "not intentional" verdict. However, if saving life *requires* this specific drug with its side effect, and alternatives exist with less nausea but lower efficacy, then proceeding with *this* drug despite foreseeing nausea might indeed imply intentional causation under the principle. Your judgment might be influenced by sympathy for the surgeon's dilemma – a common Knobe effect moderator.

  **Predictions for New Cases:**

  *   **Manager (Indifferent to Reduced Accessibility):** *Intentional.* (Foreseen, avoidable (presumably), bad, indifference confirms acceptance as cost. High accountability).
  *   **Manager (Annoyed by Good Side Effect - e.g., improved staff morale):** *Not Intentional.* (Foreseen, avoidable, good. Annoyance actively contradicts adoption or welcoming. Accountability for the *good* isn't triggered without endorsement).
  *   **Manager (Regretful about Good Side Effect - e.g., "Now they'll expect this everywhere!"):** *Not Intentional.* (Foreseen, good, but regret shows lack of adoption/purpose. Still just a foreseen side effect).
  *   **Surgeon (Alternative Drug Available):** If a similarly effective drug exists that causes *less* nausea, but the surgeon chooses the worse one due to cost/convenience, *then* causing nausea becomes *intentional* (foreseen, bad, avoidable without unreasonable cost, indifference/acceptance as cost).

  **Conclusion: Viability and Caveats**

  This **Accountability Principle** (Foreseeability/Avoidability + Moral Significance + Practical Commitment signalled by attitude) captures the vast majority of your nuanced judgments with minimal gerrymandering. It aligns with the core Knobe finding (moral valence matters) but refines it by emphasising the agent's *practical stance* towards the outcome (acceptance/adoption) within constraints of avoidability, moving beyond simple "indifference".

  The significant tension lies with **case (6), the surgeon**. Your intuition there is strong and common, but it challenges the principle's consistency with case (1). The principle suggests two paths:
  1.  **Re-evaluate (6):** If the nausea was truly *unavoidable* for saving the life (no feasible alternative), then Avoidability fails, supporting "not intentional". This is plausible and defensible.
  2.  **Accept a Contextual Exception:** Professional duty/necessity might *mitigate* accountability for bad side effects linked to overriding goods, making "intentional" feel too strong. This, however, makes the principle less compact.

  **Final Verdict:** A compact principle *is* possible and captures your core intuitions robustly. The Accountability Principle provides a framework grounded in the conditions for holding an agent responsible for a foreseen consequence of their chosen act. Case (6) highlights the genuine complexity folk psychology faces when bad effects are necessary for greater goods, potentially requiring a nuanced understanding of "unreasonable cost" or "core objective" within Clause 1. I recommend testing this principle against further scenarios in your committee work – does holding someone *accountable* for an outcome consistently align with your sense that they brought it about *intentionally*? That congruence is the principle's strength. Cheers to your thoughtful committee contributions!
