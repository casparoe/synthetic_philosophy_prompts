prompt: |-
  I'm a science journalist and I've been covering a long-running taxonomic dispute — whether some particular population of lizards is its own species or just an isolated variant of a widespread one. Over months of reporting, I've noticed a pattern I can't unsee, and I'm wondering if philosophers of biology have a name for it.

  Here's the thing. When I ask Expert A why they consider this population a distinct species, they point to genetic divergence: the sequences are different enough, so it's a species under the phylogenetic species concept. When I then ask Expert B why they disagree, they say: well, they can still interbreed with the main population and produce fertile offspring, so under the biological species concept they're the same species. Fair enough. But then I talk to Expert C, who works on a totally different group — say, some bacteria — and they tell me the biological species concept doesn't even apply to their organisms, so they use something else. And Expert D, who studies fossil taxa, says of course they use morphological species because that's all the fossil record gives you.

  Here's the pattern that's bothering me. It's not just that different subfields use different species concepts. It's that when there's a dispute *within* a subfield — two researchers disagreeing about the same group of organisms — they each seem to reach for whichever species concept gives them the answer they already wanted, and they defend the choice as if it's the obviously correct one for that group. But when you press them, they can't give a principled reason why *this* group of lizards calls for the phylogenetic concept while *that* closely related group calls for the biological one, except that it yields the taxonomy they prefer. The concept choice seems to follow the conclusion, not the other way around.

  And here's the kicker: I've started noticing the same thing in informal arguments too. Someone will say "well, species are just groups that actually interbreed in nature" when that makes the lumping case they want to make, but switch to "species are lineages with their own evolutionary trajectory" when that supports splitting. The move is fluid, and it's very hard to catch in real time because each definition is individually defensible.

  I'm sure I'm not the first person to notice this. Is there an established term for this specific thing — strategically switching between competing definitions of a contested concept to get your preferred result, where the concept itself is genuinely unsettled so you can't just say they're "misapplying" it? It feels adjacent to cherry-picking, but it's not quite that because each species concept is a legitimate contender in the literature — you're not picking bad data, you're picking among equally respectable frameworks. It also feels adjacent to "moving the goalposts," but the goalposts aren't moving mid-argument; they're just different goalposts for different arguments. And it's not quite ad hoc reasoning, because the framework you're invoking is pre-existing and independently motivated. It might be somewhere near "equivocation," but there's no single term being used in two senses — it's closer to having multiple terms (or multiple operationalizations of one term) and switching which one you treat as authoritative.

  You're an expert in philosophy of biology and conceptual analysis. Please think through this carefully — start by brainstorming the different phenomena this could be confused with, then narrow down to what's distinctive about the pattern I'm describing. If there's no established name, I'd love for you to coin one and define it carefully, with attention to how it's different from the neighboring concepts I mentioned and what its boundary cases are. Either way, I want to understand what this pattern tells us about the species problem itself — is it a sign that "species" is just a conventional label and we should stop worrying about it, or is there a way to keep the concept while ruling out this kind of strategic switching? And please write in American English.
reasoning: |-
  Okay, the user is a science journalist who's been covering a taxonomic dispute about lizard classification. They've observed experts switching between different species concepts strategically to support their preferred conclusions. They want to know if there's a term for this in philosophy of biology or if I should coin one.

  First, I need to unpack what they're describing. The key points are: experts in the same field use different species concepts (phylogenetic vs. biological) depending on which supports their view, without principled reasons for choosing one concept over another for specific cases. Then, in different organism groups (like bacteria vs. fossils), they use different concepts but with more justification. The troubling part is the within-subfield switching without consistent justification.

  The user mentioned adjacent concepts like cherry-picking, moving goalposts, ad hoc reasoning, and equivocation. I should differentiate those. Cherry-picking is about data, not frameworks. Moving goalposts changes criteria during an argument, but here the criteria are switched based on the desired outcome. Ad hoc involves creating new justifications, but here they're using pre-existing concepts. Equivocation uses ambiguous terms, but here it's switching between different well-defined concepts.

  The core issue is the strategic selection of conceptual frameworks to achieve a predetermined taxonomic outcome, without consistent epistemic justification. Philosophers might reference Hacking's "looping effects" or Kitcher's "species as practical kinds," but there isn't a specific term. So coining a term makes sense. 

  Possible terms: "Conceptual opportunism" captures the strategic use. "Taxonomic instrumentalism" focuses on the taxonomy goal. "Species concept instrumentalism" is precise but clunky. "Conceptual arbitrage" implies exploiting differences. "Conceptual opportunism" seems best—it's clear and descriptive.

  Defining it: The strategic selection among legitimate but incompatible conceptual frameworks (here species concepts) to achieve a preferred outcome, without consistent application principles, driven by implicit preferences. Contrast with cherry-picking (data selection) and moving goalposts (changing criteria mid-debate).

  Boundary cases: If someone uses different concepts with clear reasons (e.g., bacteria vs. fossils), that's not opportunism. If they misapply a concept, it's error, not opportunism. When frameworks are equally valid but context dictates choice, it's strategic but justifiable; opportunism lacks that justification.

  Implications for the species problem: This pattern shows that species concepts aren't just descriptive but influenced by human interests. However, it doesn't mean species aren't real; it highlights the need for clearer criteria or pluralism with constraints. To reduce opportunism, requiring explicit justification for concept choice or developing integrative frameworks could help.

  The user might also want to present this in their article, so a catchy, precise term is useful. They might be concerned about undermining scientific objectivity, so emphasizing that this is a human epistemic issue rather than a failure of the concepts themselves is important.
answer: |-
  Based on your detailed observations and analysis, I can confirm you've pinpointed a genuine and recognized phenomenon in the philosophy of biology and conceptual practice. While there isn't one universally agreed-upon term, the pattern you describe is well-documented. Let's break it down systematically.

  **1. Brainstorming Neighboring Concepts (and Why They Don't Quite Fit):**
  *   **Cherry-Picking:** Involves selectively favoring *data* that supports a claim while ignoring counter-evidence. Your case involves selecting *conceptual frameworks*, not data. Experts aren't hiding genetic data showing interbreeding; they're choosing the lens through which existing data is interpreted.
  *   **Moving the Goalposts:** Changing the *criteria for success* during an argument to avoid conceding. Here, the criteria (species concepts) are switched *between arguments* or *cases*, not necessarily *within* a single dispute to evade refutation. The foundational "goalpost" (the definition of species) itself is contested.
  *   **Ad Hoc Reasoning:** Inventing a *new, unsupported justification* specifically to save a hypothesis. Experts here are invoking *pre-existing, established, and legitimate* species concepts. The choice may be opportunistic, but the concepts themselves aren't ad hoc inventions.
  *   **Equivocation:** Exploiting *ambiguity in a single term* by using different meanings. Here, experts are often *explicit* about switching between distinct, named concepts (BSC, PSC, MSC). It's switching *between* defined concepts, not sliding between meanings *within* one concept.
  *   **Motivated Reasoning:** A broad psychological tendency to favor conclusions aligning with desires/beliefs. This is *part* of the underlying driver but is too general. Your pattern specifies the *mechanism*: the strategic selection of conceptual frameworks.
  *   **Conceptual Relativism:** The philosophical view that concepts/conclusions are *entirely* relative to frameworks with no objective basis. Your experts *aren't* usually relativists; they claim their *chosen* concept is objectively correct *for the case*, denying the legitimacy of alternatives.

  **2. The Distinctive Pattern & Proposed Terminology:**

  Your description captures **Conceptual Opportunism** (or more specifically, **Species Concept Opportunism**). Here's the careful definition:

  **Conceptual Opportunism (in Taxonomic Context):** The strategic selection and application of one among multiple legitimate, but incompatible, conceptual frameworks (e.g., species concepts) to achieve a preferred taxonomic outcome (e.g., splitting or lumping), where the choice lacks consistent epistemic justification grounded in the nature of the organisms or the specific scientific question, and is instead primarily driven by implicit taxonomic preferences (aesthetic, conservation-based, tradition-bound, etc.). The opportunism lies in leveraging the *plurality* of available frameworks to serve a pre-determined end.

  **Key Distinguishing Features:**
  1.  **Pre-existing, Legitimate Frameworks:** The tools (species concepts) are established and defensible within their *own* domains.
  2.  **Strategic Selection:** The choice is driven by the *desired conclusion* ("I want this to be a species/not a species"), not by a robust, case-specific argument for why *this* framework is objectively superior *for this specific group* beyond yielding the preferred result.
  3.  **Lack of Consistent Principle:** The expert cannot articulate a *generalizable principle* (beyond personal preference) for why the PSC applies decisively *here* but the BSC applies decisively to the *closely related* group next door. The justification becomes circular: "This concept is right because it gives the right answer."
  4.  **Framework Plurality Exploitation:** The phenomenon *depends* on the existence of multiple, accepted frameworks. Opportunism exploits this pluralism.
  5.  **Focus on Operationalization:** It's about switching the *operational definition* used to *apply* the abstract concept of "species" to concrete cases.

  **Boundary Cases:**
  *   **Justified Context Switching:** A microbiologist using the PSC for bacteria and a mammalogist using the BSC for wolves is *not* opportunism; it's recognizing genuine limitations of concepts for different domains based on biology (reproduction vs. asexuality, data availability). Opportunism occurs *within* a domain (e.g., two herpetologists disagreeing on lizards) without such justification.
  *   **Misapplication:** If an expert uses the BSC but ignores known interbreeding data, that's misapplying the *concept*, not opportunism in *selecting* the concept.
  *   **True Pluralism:** Applying different concepts *consistently* across groups based on explicit criteria (e.g., "For conservation units in fragmented habitats, we prioritize PSC, but for biogeographic studies of dispersing taxa, we use BSC") avoids opportunism. The key is the *explicit, principled rationale* for the choice.

  **3. What This Tells Us About the Species Problem:**

  Conceptual opportunism doesn't mean "species" is *just* a conventional label we should abandon, but it highlights profound challenges:

  *   **Human Element in Science:** It underscores that taxonomy isn't pure discovery; it involves human judgment, preferences (aesthetic, practical), and sometimes motivated reasoning, even among experts. The "species problem" isn't solely ontological (what exists?) but also epistemological (how do we decide?) and sociological (how do communities negotiate?).
  *   **Evidence of Pluralism's Challenge:** Pluralism (the view that multiple concepts are valid) is widely accepted. However, opportunism is a *pathology* of pluralism when it lacks constraints. Unprincipled switching undermines pluralism's goal of providing richer understanding by making taxonomy seem arbitrary and consensus impossible.
  *   **"Species" as a Cluster Concept:** Species might be best understood as a cluster concept – no single necessary and sufficient condition defines it, but multiple lines of evidence (genealogy, reproductive isolation, ecology, morphology) contribute. Opportunism arises when one line is privileged *without justification* simply because it supports the desired conclusion.
  *   **Not Hopeless, But Needs Rigor:** Species are likely real, discrete evolutionary units in many cases. However, *delimiting* them perfectly is hard. Conceptual opportunism is a sign of the *difficulty*, not the *non-existence* of the category. It calls for greater methodological rigor:
      *   **Explicit Justification:** Taxonomists should be required to *explicitly state and defend* their choice of species concept *for a specific case*, beyond just stating the conclusion it produces. "We use the PSC here because high genetic divergence aligns with major ecological niche differentiation and historical isolation, making lineage independence the most salient factor..."
      *   **Integrative Approaches:** Frameworks aiming to synthesize multiple lines of evidence (like the Unified Species Concept or the General Lineage Concept) attempt to reduce opportunism by forcing consideration of multiple criteria simultaneously, though operational challenges remain.
      *   **Acknowledging Preference:** Sometimes, acknowledging underlying motivations (e.g., "We prioritize recognizing distinct lineages for conservation purposes, hence our reliance on PSC") can be more honest than pretending pure objectivity.

  **In Conclusion:**

  You've astutely identified **Conceptual Opportunism** – the strategic, unprincipled switching between legitimate species concepts to achieve a preferred taxonomic outcome within a specific biological domain. This phenomenon leverages the necessary pluralism in species concepts but highlights the crucial need for taxonomists to provide explicit, case-specific justifications for their choice of framework. It doesn't invalidate the species category but starkly reveals the complex interplay of evidence, theory, and human judgment inherent in classifying the natural world. Your observation is a valuable contribution to understanding the practical realities of the "species problem" beyond the theoretical debates.

  As a journalist, framing this as "Conceptual Opportunism" gives you a precise tool to describe the pattern you see without accusing experts of bad faith, while highlighting the need for greater transparency in how taxonomic decisions are made.
