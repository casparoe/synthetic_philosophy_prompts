  Let me unpack Daubert's four factors one by one. First, testability: at its strongest, this echoes Popper's falsificationism—science must make risky, testable predictions. But Daubert says "can be and has been tested," which is broader than strict falsificationism. Peer review seems like an institutional checkpoint, nodding to communal science norms à la Merton or Kuhn. Error rates scream reliability and replicability, very 20th-century positivist. General acceptance is the odd one out—it's practically a concession to the older Frye standard, which Daubert supposedly replaced. 

