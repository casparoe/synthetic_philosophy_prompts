answer: |-
  ### Overall Credence
  **0.65**  
  *(I assign a 65% probability that a sortition-based legislature would produce superior legislation over 20 years.)*

  ---

  ### Decomposition of Key Sub-Questions  
  My credence depends on the following interrelated factors, with rough probabilities and brief justifications:

  1. **Electoral incentive distortions (0.8)**  
     Elected legislators face perverse incentives: short-termism, donor/group appeasement, and re-election pandering. Sortition citizens, free of these pressures, *likely* prioritise long-term welfare and broader interests. Evidence from lobbying influence and policy stagnation supports this.

  2. **Resistance to capture (0.45)**  
     Sortition assemblies may resist *overt* lobbying but remain vulnerable to bureaucratic/elite steering via agenda-setting or expert briefings. Random selection fragments interests, yet institutional inertia could enable subtle capture. Moderately pessimistic due to power asymmetries.

  3. **Cognitive efficacy of deliberation (0.7)**  
     Structured deliberation with neutral experts (e.g., Citizens’ Assembly models) demonstrably upskills lay citizens on complex issues. Jurors and citizen panels show analogous competence. Domain-inexperience is surmountable with time and resources.

  4. **Net effect of losing accountability (0.6)**  
     Retrospective voting weakly disciplines legislators (empirically inconsistent). Sortition trades this for reduced distortion. Staggered terms and large samples mitigate instability risks. Net benefit *probable* but uncertain.

  5. **Implementation stability (0.55)**  
     Cultural acceptance and elite sabotage are major risks (e.g., media attacks on "amateur" legislators). Yet sustained compensation and transparent deliberation could foster legitimacy. Slightly favours durability.

  6. **Coherence of collective output (0.75)**  
     Diverse, non-partisan members may reduce ideological polarisation, enhancing policy consistency. Elected legislatures often prioritise fragmented, vote-trading compromises over coherent law.

  ---

  ### Combining Probabilities  
  I treat sub-questions as **partially dependent**:  
  - Success requires all factors to be *sufficiently* favourable (non-catastrophic), not universally optimal.  
  - I use **qualitative weighting**: Factors 1 (incentives) and 3 (deliberation) are strongest positives; Factor 2 (capture) is the gravest risk.  
  - **Calculation**: Approximated as:  
    `(0.8 × 0.7 × 0.75) × [1 − (1−0.45) × (1−0.6) × (1−0.55)] ≈ 0.65`  
    *(Core strengths × [1 − Cumulative weakness risk])*  
  Dependencies acknowledged: e.g., resistance to capture (2) and stability (5) correlate; deliberation (3) mitigates inexperience in (1).

  ---

  ### Least Confident Sub-Question  
  **Resistance to capture (assigned 0.45)**  
  - **Evidence needed**: Longitudinal studies of *existing* sortition bodies (e.g., Climate Assemblies) tracking if/elite sway increases over time. Alternatively, observing whether bureaucrats/experts dominate agenda-setting in mature implementations.  
  - **Shift potential**: If repeated cases show technocratic subversion despite safeguards → drop to 0.3. If robust neutrality persists beyond 5 years → rise to 0.65.

  ---

  ### Locus of Reasonable Disagreement  
  A credence gap (e.g., 0.65 vs. 0.2) most likely stems from:  
  **Sub-question 4: Democratic accountability trade-off**  
  - **Optimist view (my 0.6)**: Electoral accountability is illusory; voters reward charisma not policy. Removing re-election pressure enables principled decisions.  
  - **Pessimist view (e.g., 0.3)**: Retrospective voting, though imperfect, is irreplaceable. Sortition enables unaccountable recklessness or elite manipulation, risking legitimacy crises.  
  This hinges on empirical interpretations of electoral accountability’s efficacy—a deeply contested issue in political science.

  ---

  ### Summary  
  This credence (0.65) reflects cautious optimism: sortition *likely* outperforms on coherence and long-term welfare by sidestepping electoral pathologies, but capture risks and cultural instability are material counterweights. The greatest uncertainty lies in whether deliberative designs can genuinely neutralise power asymmetries in practice.
