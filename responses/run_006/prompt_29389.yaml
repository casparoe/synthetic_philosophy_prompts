  We are designing an in-class game to illustrate the Unilateralist's Curse. The goal is for students to experience the curse before it is named, so they can feel how group dynamics lead to acting on the most optimistic member's judgment even when the collective evidence suggests otherwise.

  **Core Game Setup:**

  - **Scenario:** The group represents a team of researchers deciding whether to publish a potentially groundbreaking but risky paper. Publishing without proper vetting could lead to a scandal (bad outcome), but if the paper is good, publishing brings great benefits (good outcome). If no one publishes, the status quo is safe but unremarkable.

  - **Materials:** 
    - For each student: a private slip of paper that says either "Good" or "Bad". 
    - A "publish" button (could be a physical button, a virtual button on a shared screen, or even just a verbal announcement by a player that they are pressing it).
    - A way to reveal the true state (e.g., a coin flip or a hidden card drawn by the instructor) to determine the outcome if the button is pressed.

  - **Payoff Scheme (in points, not real money):**
    - If the button is pressed and the true state is "Good": everyone gets +10 points.
    - If the button is pressed and the true state is "Bad": everyone gets -10 points.
    - If no one presses the button: everyone gets 0 points.

  - **Information:**
    - The true state is determined by a hidden draw by the instructor. The prior probability that the state is "Good" is set to 50% (to keep it symmetric). 
    - Each player receives a private signal (the slip) that is informative but imperfect. The accuracy of the signal is known and set to 70% (i.e., P(signal=Good | true=Good) = P(signal=Bad | true=Bad) = 0.7). This means there's a 30% chance the signal is wrong.

  - **Rules:**
    1. The instructor secretly determines the true state (Good or Bad) by a fair coin flip (or using a random method with 50% probability for each).
    2. Each student receives a private signal. The signals are generated independently (for the base case) conditional on the true state. Specifically:
        - If the true state is Good: each signal is independently Good with 70% probability, Bad with 30%.
        - If the true state is Bad: each signal is independently Bad with 70% probability, Good with 30%.
    3. Without communicating with each other, each student decides whether they would press the button. The button can be pressed by any one student. The action is taken as soon as one student presses it. If multiple try to press simultaneously, we can break ties arbitrarily (e.g., the first one to speak, or by lottery). But note: only one press is needed and it triggers the outcome for all.
    4. If at least one student presses the button, the outcome is revealed (using the predetermined true state) and the payoffs are awarded accordingly. If no one presses, everyone gets 0.

  - **Setting the numbers for the curse:**
    - We want that if a player gets a "Good" signal, they believe that the expected value of pressing is positive. But if all signals were pooled, the group would see that the majority of signals are correct and would make the right decision. However, because any one optimist can act, the group often acts when the true state is Bad.

    - Let's compute the individual rationality for a player with a Good signal:
      - The prior P(Good) = 0.5.
      - After receiving a Good signal, by Bayes' theorem:
          P(Good | signal=Good) = [P(signal=Good | Good) * P(Good)] / [P(signal=Good | Good)*P(Good) + P(signal=Good | Bad)*P(Bad)]
                                 = (0.7 * 0.5) / (0.7*0.5 + 0.3*0.5) = 0.35 / (0.35+0.15) = 0.35/0.5 = 0.7.
      - Similarly, P(Bad | signal=Good) = 0.3.
      - Expected payoff from pressing: 0.7 * 10 + 0.3 * (-10) = 7 - 3 = 4 > 0.
      - So a player with a Good signal will want to press the button.

    - Now, what about the group? Consider a group of 16. The true state is Bad (so we hope they don't press). Each player has a 30% chance of getting a false positive (Good signal). The number of false positives is Binomial(16, 0.3). The expected number of false positives is 16 * 0.3 = 4.8. The probability that at least one player gets a Good signal (and thus might press) is 1 - (0.7)^16 ≈ 1 - 0.0033 = 0.9967. So almost certainly at least one player will get a Good signal and press, leading to a bad outcome.

    - Moreover, when the true state is Good, we want the group to press. In that case, each player has a 70% chance of a Good signal. The probability that at least one gets a Good signal is 1 - (0.3)^16 ≈ 1 - 0 (very close to 1). So they will press and get the good outcome.

    - Therefore, the curse manifests: in the Bad state, the group almost always presses (because there's almost always at least one optimist) and gets -10. In the Good state, they also press and get +10. But note: the prior expected value of pressing without any signal would be 0 (50% chance of +10, 50% of -10). However, the group is acting on the signal of the most optimistic member. The problem is that in the Bad state, they are pressing when they shouldn't.

  **Variants:**

  1. **Small vs. Large Group:**
     - **Setup:** Run the same game with a small group (e.g., 3 people) and then with the large group (16).
     - **Prediction:** In the small group, the chance of at least one false positive when the state is Bad is 1 - (0.7)^3 = 1 - 0.343 = 0.657. So about 34.3% of the time in the Bad state, no one will press (if all get Bad signals). In the large group, as above, it's almost certain that someone will press in the Bad state. Therefore, the large group will suffer the curse more often (i.e., they will have a higher rate of bad outcomes in the Bad state).
     - **Reveals:** This variant shows that the curse becomes more severe as the group size increases. The usual proposed fix of "having a larger group to get more information" doesn't help because it increases the chance of having at least one optimist who acts.

  2. **Independent vs. Correlated Signals:**
     - **Setup:** In the independent case, signals are generated as above. In the correlated case, we change the signal generation: the instructor first flips a coin to determine the true state. Then, the instructor flips a biased coin to determine a "master signal": with 70% chance the master signal is the same as the true state, and 30% chance it is flipped. Then, each student's signal is set to the master signal with 90% probability, and independently flipped with 10% probability (so there is high correlation). Alternatively, to keep it simple, we can make all signals identical to the master signal (100% correlated). But then we lose the individual variation. Let's do: 
          - With 70% chance, the master signal is correct (matches true state); 30% chance it is incorrect.
          - Then, each student gets a copy of the master signal with 95% probability, and an independent random signal (with 70% accuracy) with 5% probability. But this is complex. 
     - **Simpler Alternative:** For the correlated case, we can use the same master signal for all. Then, the signals are perfectly correlated. So if the master signal is Good, then every student gets a Good signal; if Bad, every student gets Bad. But note: if the master signal is always the same for all, then the group either all get Good or all get Bad. Then, if they get Good, they all see the same and will all want to press? But then the curse doesn't occur because there's no variation.

     - **Better Alternative:** We want some correlation but not perfect. Let's do: 
          - The true state is determined (50% Good, 50% Bad).
          - Then a "common factor" is drawn: with 80% probability, the common factor is set to the true state, and with 20% probability it is set to the opposite.
          - Then each student's signal: with 80% probability, the student's signal equals the common factor, and with 20% probability it is drawn independently (with 70% accuracy relative to the true state). This is complex for in-class.

     - **Practical Suggestion:** For simplicity, we can do two extreme cases: 
          - Independent: as in the base game.
          - Perfectly correlated: the instructor draws one signal for the whole group (using the 70% accuracy) and every student gets that same signal.
     - **Prediction for Perfectly Correlated:** 
          - If the common signal is Good, then every player gets Good. They each compute the same posterior (70% chance the state is Good) and will want to press. So if the state is Bad (which happens 30% of the time when the common signal is Good), then the whole group presses and gets -10. If the common signal is Bad, no one presses. 
          - The chance of a false positive (common signal Good when state is Bad) is 30%. So the group will make a mistake 30% of the time in the Bad state. 
          - In the independent case, for a large group, the chance of at least one false positive in the Bad state is very high (about 99.67%). So the independent case leads to more false positives (the curse is worse). 
          - **Reveals:** When signals are correlated, the group is more likely to have unanimity. If the signal is bad, no one presses (so no false positive). If the signal is good, everyone presses (so false positives occur at the same rate as an individual). This variant shows that independence of signals exacerbates the curse. A proposed fix might be to have independent checks, but this actually makes the curse worse. However, note: independent checks are good for aggregating information if the group can pool the signals, but the curse arises because the decision rule allows unilateral action.

  3. **Talking vs. Not Talking:**
     - **Setup:** In the talking variant, allow the group to have a 5-minute discussion before they decide. They can share their signals (or not, but typically they will). In the non-talking variant, they act in silence.
     - **Prediction:** 
          - Without talking: the curse plays out as above. 
          - With talking: if the group shares their signals, they can aggregate the information. They would count the number of Good and Bad signals. For a large group, if the majority of signals are Bad, they should decide not to press. But note: the decision rule hasn't changed. The rules still say that any one person can press. However, during the discussion, they might agree to a norm: for example, they might agree that only if the majority is Good they will press, and they will delegate one person to press. Or they might agree that no one should press if the majority is Bad. But what if someone breaks the agreement? The point of the curse is that the decision rule is unilateral. So even after a discussion, if one person believes strongly (or is a maverick) they might press against the group's agreement. 
          - **Reveals:** This variant tests whether communication alone can solve the curse without changing the decision rule. The problem is that communication without commitment doesn't necessarily change the incentives. If the group agrees not to press, but then one member still believes (based on their own signal) that they should press (and they are acting for the group's benefit), they might break the agreement. The fix of communication is helpful only if it leads to a change in the decision rule (like delegation or requiring consensus). But note: if the group can change the rule to require consensus, then we move to the opposite problem: the most pessimistic can veto. We can discuss that in debrief.

  **Debrief:**

  After running the game (and variants), debrief the students:

  1. **Map to the Unilateralist's Curse:**
     - In the base game (large group, independent signals, no talking), we observed that the button was almost always pressed, even when the true state was Bad. Why? Because at least one player received a Good signal and, acting on their own private information, found it rational to press. This is the curse: the group acts on the judgment of the most optimistic member (the one with the most favorable signal) because that member can unilaterally trigger the action.
     - The problem is not that the individuals are biased or selfish. In fact, in the game, each player is assumed to be acting for the benefit of the group. The problem lies in the decision rule: "If any one person thinks it's a good idea, they can act for everyone." This rule leads to over-action in the face of risk.

  2. **The Mirror-Image Problem:**
     - If we change the rule to require unanimity (or even consensus) for action, then we face the opposite problem: the most pessimistic member can veto the action. For instance, if one player gets a Bad signal (even if the true state is Good) and the rule requires everyone to agree to press, then the group will not press even when it would have been beneficial. This leads to under-action.

  3. **Variants:**
     - **Small vs. Large:** We saw that in larger groups, the curse is more severe because the probability of having at least one optimist increases. This shows that increasing group size without changing the decision rule can make the problem worse.
     - **Independent vs. Correlated Signals:** Independent signals, while providing more information in principle, actually exacerbate the curse because they increase the chance of having at least one false positive. Correlated signals reduce the curse (because the group tends to get the same signal) but also reduce the informational value of multiple signals. This highlights that the curse is driven by the combination of the decision rule and the independence of the signals.
     - **Talking vs. Not Talking:** Communication can help the group aggregate information and coordinate. However, without a binding commitment to a new decision rule (like majority vote and delegation), the unilateralist's ability to act remains. If the group agrees not to press but one member still believes pressing is the right thing (and they are acting sincerely), they might break the agreement. Thus, communication alone is insufficient.

  4. **What the Game Cannot Reproduce:**
     - In the real world, the unilateralist's curse often involves actions that are irreversible and have large-scale consequences (like launching a nuclear weapon or publishing a controversial paper). The game abstracts away the magnitude of the stakes and the irreversibility. Also, in reality, individuals might not be purely benevolent; they might have career incentives or other biases. The game assumes common knowledge of payoffs and that everyone is motivated by the group payoff. You will have to emphasize that the curse can occur even when everyone is well-intentioned.

  **Predictable Problems and Solutions:**

  1. **Collusion:** Students might agree outside the rules to have only one person press or to rotate who presses. This undermines the individual decision-making. 
     - *Solution:* Emphasize that they must make individual decisions and that the rules allow anyone to press at any time. Also, you can run the game without allowing any communication (for the non-talking variant) and in the talking variant, allow only the designated discussion time.

  2. **Someone Pressing for Laughs:** A student might press the button as a joke or to be disruptive.
     - *Solution:* Before the game, stress the importance of taking the exercise seriously for the learning objective. Also, use points that might be tied to a small reward (like candy or extra credit) to incentivize sincere play. Alternatively, run the game multiple times and average the results so one outlier doesn't ruin the data.

  3. **Nobody Believing the Payoffs are Common Knowledge:** Students might doubt that the payoffs are as stated or that others are motivated by the group payoff.
     - *Solution:* Clearly state the payoffs and the assumption that everyone is trying to maximize the group's points. You can also use a pre-game quiz to check understanding.

  4. **Confusion about the Signal Generation:** Students might not understand how the signals are generated.
     - *Solution:* Explain the process clearly and perhaps run a practice round with open signals to show how the signals relate to the true state.

  5. **Multiple Presses:** What if two or more try to press at once?
     - *Solution:* State in the rules that the first press (by time or by calling out) is the one that counts. The others are ignored.

  6. **Revealing the True State Too Early:** The instructor must not reveal the true state until after the decision.
     - *Solution:* Have the true state determined in advance and kept hidden until after the button press decision.

  By anticipating these issues and addressing them, the game should run smoothly and effectively illustrate the curse.
answer: |-
  ### In-Class Game: The Publishing Dilemma  
  **Objective:** Illustrate the unilateralist's curse by having students experience how individual actions based on private signals can lead to group outcomes contrary to pooled evidence. Players aim to maximize group welfare, not personal gain.  

  ---

  #### **Core Game Setup**  
  **Materials:**  
  - 1 coin (or RNG) for the instructor.  
  - Slips of paper labeled "Good" or "Bad" for private signals.  
  - A visible "publish button" (e.g., a physical button, shared screen, or instructor’s clipboard).  
  - Scoreboard for tracking group points (no real money; points represent collective success).  

  **Player Roles:**  
  16 philosophy grad students act as co-authors deciding whether to publish a contentious paper. Publishing risks reputational damage if flawed (bad outcome) or acclaim if sound (good outcome).  

  **Rules:**  
  1. **True State Determination:**  
     - Instructor flips a coin in secret:  
       - Heads = "Good" (paper is sound).  
       - Tails = "Bad" (paper is flawed).  
     - *Probability:* 50% chance of either (common knowledge).  

  2. **Private Signals:**  
     - Each player receives a slip with a private signal ("Good" or "Bad").  
     - Signal accuracy = 70% (common knowledge).  
       - If true state = Good: 70% get "Good" signals, 30% get "Bad."  
       - If true state = Bad: 70% get "Bad" signals, 30% get "Good."  
     - Signals are *independent* (conditional on true state).  

  3. **Decision:**  
     - Players decide simultaneously and secretly whether to "press" the publish button.  
     - **Key rule:** If *any one player* presses, the paper is published for the entire group.  
     - If no one presses, the paper is shelved (status quo).  

  4. **Payoffs (Group Points):**  
     - Publish + True Good = **+10 points** (acclaim).  
     - Publish + True Bad = **-10 points** (scandal).  
     - No publish = **0 points** (status quo).  

  **Incentive Calibration:**  
  - A player with a "Good" signal calculates:  
    - *P(True Good | Signal) = 70%* → Expected value of pressing = (0.7 × 10) + (0.3 × -10) = **+4 points** (individually rational).  
  - Pooled signals (e.g., 16 players):  
    - True Bad state: Expect ~30% "Good" signals (≈5 false positives). Majority evidence suggests "don’t publish," but *one optimist can override*.  
    - True Good state: Expect ~70% "Good" signals → Publishing is desirable.  
  - **Curse trigger:** Publishing is individually rational for "Good"-signal holders, but group-level harmful in Bad states due to unilateral action.  

  ---

  #### **Variants & Learning Goals**  
  Run each variant in sequence. Record outcomes and discuss after all rounds.  

  1. **Small vs. Large Group**  
     - **Setup:**  
       - *Small group:* 4 players (signals: 70% accurate).  
       - *Large group:* 16 players (signals: 70% accurate).  
       - *No talking.*  
     - **Prediction:**  
       - Small group: Lower chance of false positives. E.g., True Bad state: P(no one presses) = P(all get "Bad") = (0.7)^4 ≈ 24%. Publishing occurs ~76% of Bad states.  
       - Large group: P(no one presses in True Bad) ≈ (0.7)^16 ≈ 0.3%. Publishing occurs ~99.7% of Bad states → **More frequent curse.**  
     - **Reveals:** Larger groups amplify the curse because more players increase the odds of an optimist existing. Proposed "fixes" like adding more reviewers backfire without changing the decision rule.  

  2. **Independent vs. Correlated Signals**  
     - **Setup:**  
       - *Independent:* Signals drawn separately (core game).  
       - *Correlated:* Instructor draws *one master signal* (70% accurate), then copies it to 50% of players. Others get independent signals (70% accurate).  
         - E.g., True Bad: Master signal = "Bad" (70% chance). 50% of players get "Bad"; the other 50% get independent signals (30% false positives).  
     - **Prediction:**  
       - Independent: High chance of false positives → High publish rate in Bad states.  
       - Correlated: Reduced false positives (signals clustered). E.g., True Bad: P(no "Good" signal) increases → **Curse weakens.**  
     - **Reveals:** Independent signals (common in peer review) maximize information but exacerbate the curse. Correlated signals (e.g., shared biases) reduce false positives but also reduce informational value—highlighting trade-offs in "diverse input" fixes.  

  3. **Talking Allowed vs. Not Talking**  
     - **Setup:**  
       - *Not talking:* Core game (no communication).  
       - *Talking allowed:* 5-minute open discussion before decisions. Players can share signals but *cannot coordinate binding agreements*.  
     - **Prediction:**  
       - Not talking: High publish rate in Bad states (curse dominates).  
       - Talking: Players share signals and infer true state. *But* publishing only requires one optimist to act. **Sincere defectors** may still press if their signal conflicts with the group.  
     - **Reveals:** Communication improves information pooling but doesn’t fix unilateralism. Proposed "deliberation fixes" fail without enforcing consensus (which introduces veto power).  

  ---

  #### **Debrief: Mapping to the Unilateralist's Curse**  
  After running variants, hold a 10-minute discussion:  

  1. **Core Lesson:**  
     > "In the game, the group often published flawed papers (Bad states) because *one* 'Good' signal holder pressed the button. This happened even though pooled signals (if aggregated) would have shown majority evidence against publishing. Crucially, players were *sincere*: those with 'Good' signals believed publishing helped the group. The problem wasn’t bias or bad motives—it was the **decision rule** ('act if anyone thinks it’s good'). This is the unilateralist's curse: groups empower their most optimistic member to decide for everyone."  

  2. **Variant Insights:**  
     - **Group size:** Larger groups suffered *more* bad publishes. Why? More players = more chances for false optimists. Fixes like "add more experts" fail without reforming the rule.  
     - **Signal correlation:** Independent signals maximized information but worsened the curse. Correlated signals reduced bad publishes but at the cost of useful data—showing no easy fix via signal manipulation.  
     - **Talking:** Deliberation helped players infer the true state, but without binding agreements, unilateral action persisted. Proposals to "discuss first" only work with enforced consensus.  

  3. **The Mirror-Image Problem:**  
     > "If we require *unanimity* to publish (a common 'fix'), we create the opposite problem: one pessimist can veto a good paper. For example, if the true state is Good but one player has a 'Bad' signal, they can block publication. This is the **pessimist's veto**—another distortion from pooling individual judgments under flawed rules."  

  4. **Key Takeaway:**  
     > "The curse arises from *structural asymmetry*: optimistic unilateralism in this setup, pessimistic unilateralism under unanimity. Real solutions require changing the decision rule (e.g., majority vote, random decider, or averaged thresholds), not just hoping for better information or intentions."  

  ---

  #### **Predictable Problems & Fixes**  
  **Problem 1: Collusion or Coordination**  
  - *Risk:* Players agree "only Alice presses" to avoid multiple presses.  
  - *Fix:* Stress *no pre-game coordination* and emphasize sincerity. In talking rounds, disallow binding pacts.  

  **Problem 2: Someone Presses "for Laughs"**  
  - *Risk:* A player presses randomly to disrupt.  
  - *Fix:* Tie points to a trivial reward (e.g., candy for highest-scoring group). Preface: "Approach this as philosophers—your choices affect peers."  

  **Problem 3: Skepticism of Payoffs**  
  - *Risk:* Players doubt payoffs are real or common knowledge.  
  - *Fix:* Clarify payoffs visually (e.g., slide: "Publish + True Good = +10"). Run a practice round with open signals to build trust.  

  **Problem 4: Over-Aggression in Small Groups**  
  - *Risk:* Small groups may avoid publishing entirely (low false positives).  
  - *Fix:* Use pre-set RNG seeds to ensure a True Bad state occurs in at least one round, forcing the curse to manifest.  

  ---

  #### **Limitations & Real-World Context**  
  **What the Game Can’t Replicate:**  
  - **Scale of Consequences:** Real-world stakes (e.g., nuclear launch, flawed research) involve irreversible harm. The game’s -10 points can’t capture this gravity—**you must emphasize it verbally.**  
  - **Strategic Motives:** Players irl may have selfish incentives (e.g., careerism). The game assumes pure group welfare—**highlight that the curse persists even without selfishness.**  
  - **Complex Signals:** Real signals vary in strength (not just binary). The game simplifies to isolate the curse’s logic.  

  **Final Tip:** Run 2–3 trials per variant to gather data. Afterward, reveal the "unilateralist's curse" term and discuss real cases (e.g., AI research releases, policy leaks). This bridges experience to theory.
