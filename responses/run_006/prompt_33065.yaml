prompt: |-
  I am a PhD student in philosophy of economics, writing a chapter on how to think about false assumptions in models, and I have been trying to get my own commitments into order before I start. I would like your help extracting the principle behind my judgments—or, if there is no single principle, being told which of them I should give up.

  My verdicts so far are these. I have no problem with the frictionless plane in mechanics, or with treating a cow as a sphere in a first-pass model of heat loss. I also accept the assumption of zero transaction costs in the Coase theorem: the assumption is plainly false, yet it seems to isolate the role of property-rights assignments rather than distort the conclusion. I am even comfortable with Friedman-style cases in which a skilled billiards player chooses shots as if solving the relevant physics and leaves grow as if maximizing exposure to light, so long as the point of the model is prediction. But I resist a model of financial crises that assumes rational expectations and complete markets, because the falsity of those assumptions seems to be doing the work of ruling out the phenomenon being explained. I am also uneasy about Ptolemaic epicycles: they predict planetary positions reasonably well, but the machinery is wrong in a way that seems to matter even though the predictions succeed. The pair that keeps me stuck is this: I am fine ignoring air resistance when deriving the law of falling bodies, but I am bothered when a climate model treats the atmosphere as instantly well mixed, even though both are false idealizations adopted for tractability, and I cannot yet say what separates them.

  My tentative principle was roughly the one often called the F-twist: the realism of assumptions does not matter; only predictive success does. But that principle seems to license the epicycles and the crisis model, which I do not want to license. So my question is this: is there a principle that captures all or most of my verdicts, and if so, what is it? Please state it precisely, say what it predicts about a case I have not listed—for instance, a macroeconomic model that assumes a single representative agent—and be explicit about which of my verdicts, if any, the principle cannot accommodate.
reasoning: |-
  Okay, the user is a PhD student in philosophy of economics working on false assumptions in models. They've listed several cases where they accept or reject false assumptions and are struggling to find a unifying principle. Their tentative F-twist (Friedman's instrumentalism) doesn't fully align with their intuitions, especially regarding epicycles and rational expectations in financial crisis models.

  First, I need to understand their specific judgments. They accept frictionless planes, spherical cows, zero transaction costs in Coase theorem, and even Friedman's as-if examples for prediction. But they reject rational expectations in financial crises and Ptolemaic epicycles, despite predictive success. They're conflicted about ignoring air resistance versus the well-mixed atmosphere in climate models.

  The key tension is between instrumentalism (only predictions matter) and realism about mechanisms. They seem to care about whether the false assumptions misrepresent causal mechanisms, especially when those mechanisms are central to the phenomenon. For instance, in financial crises, assuming rational expectations might obscure the actual irrational behaviors causing the crisis. Similarly, epicycles predict but misrepresent the actual orbital mechanics.

  For the climate model example, the well-mixed atmosphere assumption might oversimplify transport mechanisms crucial for long-term predictions, whereas air resistance in falling bodies doesn't alter the fundamental gravitational mechanism. This suggests a principle where the falsity of assumptions is problematic when it distorts essential causal structures relevant to the model's purpose.

  I should formulate a principle like: False assumptions are acceptable if they don't distort the core causal mechanisms relevant to the model's explanatory goals. This would reject the crisis model and epicycles because their false assumptions misrepresent key mechanisms. The representative agent model might be problematic if heterogeneity is crucial, but acceptable for certain aggregate predictions.

  The user might have deeper needs: wanting a coherent philosophical framework that respects scientific practice without endorsing instrumentalism entirely. They need to reconcile their intuitions with established theories, possibly to contribute original insights to the literature. Identifying this principle helps them structure their chapter and defend their judgments systematically.
answer: |-
  Based on your nuanced judgments, the F-twist (instrumentalism) isn't sufficient. Your resistance to epicycles and rational expectations models suggests you care about *how* the model achieves its results and whether the false assumptions **distort the representation of the underlying causal mechanisms** relevant to the model's *explanatory purpose*. Here's a principle capturing most of your verdicts:

  **The Causal Fidelity Principle (CFP):**
  *A false assumption is acceptable if it does not significantly distort the representation of the core causal mechanisms relevant to the model's intended explanatory or predictive purpose, and if its falsity does not prevent the model from isolating the intended causal factors.*

  **Key Components:**

  1.  **Relevance to Purpose:** The acceptability hinges on the model's *goal* (prediction, isolation, explanation of mechanism).
  2.  **No Significant Distortion of Core Mechanisms:** The false assumption shouldn't misrepresent *how* the key causal processes work *in the context of the model's purpose*. Idealizations that simplify without fundamentally misrepresenting the causal pathway are acceptable.
  3.  **Isolation Feasibility:** The false assumption should genuinely serve to isolate the factor of interest, not preclude it or introduce spurious mechanisms.
  4.  **"Relevant" is Crucial:** Not *all* causal mechanisms need perfect representation, only those core to the phenomenon *as defined by the model's purpose*.

  **Applying CFP to Your Cases:**

  1.  **Frictionless Plane / Law of Falling Bodies (Ignoring Air Resistance):** **Acceptable.** Purpose is to isolate the core causal mechanism (gravity). Friction/disturbance is a confounding factor; ignoring it simplifies without distorting the fundamental causal process *in this context*. The model still correctly represents gravity as the primary driver.
  2.  **Spherical Cow (Heat Loss):** **Acceptable.** Purpose is a first-pass estimate of heat loss based on surface area/volume ratio. The core causal mechanism (heat dissipation proportional to surface area) is preserved. Shape details are secondary for this *initial, isolating* purpose.
  3.  **Coase Theorem (Zero Transaction Costs):** **Acceptable.** Purpose is to isolate the causal role of property rights *assuming efficient bargaining*. The false assumption eliminates confounding factors (bargaining costs) to reveal the intended causal relationship. It doesn't distort *how* property rights affect outcomes *under efficient bargaining*.
  4.  **Friedman's As-If (Billiards, Leaves):** **Acceptable (for prediction).** Purpose is *only* prediction. The "as-if" mechanism, while false to the agent's internal process, successfully captures the *output* of the real causal process (skill/evolution) for predictive purposes. It doesn't claim to explain the *internal* mechanism.
  5.  **Financial Crises (Rational Expectations/Complete Markets):** **Problematic.** Purpose is to explain crises. The core causal mechanisms of crises (panic, coordination failures, liquidity spirals, irrational exuberance) are *ruled out* or severely distorted by the assumptions. The false assumptions don't isolate a mechanism; they *preclude* the very mechanisms thought to be central to the phenomenon. The model distorts the relevant causal structure.
  6.  **Ptolemaic Epicycles:** **Problematic.** Purpose is prediction *and* (implicitly) explanation of planetary motion. While predictive, the core causal mechanism (heliocentric orbits governed by inertia/gravity) is fundamentally misrepresented. The epicycles introduce spurious causal elements (complex circular motions around Earth) that distort the *how*. The falsity matters for understanding the actual causal structure.
  7.  **Air Resistance vs. Well-Mixed Atmosphere:**
      *   **Air Resistance (Falling Bodies):** **Acceptable per CFP.** As above, it isolates gravity without distorting it as the core mechanism for the purpose of deriving the fundamental law.
      *   **Instantly Well-Mixed Atmosphere (Climate):** **Problematic per CFP.** Purpose is to model climate dynamics, where transport and mixing processes (advection, diffusion, convection) *are* core causal mechanisms affecting heat distribution, gas concentrations, and feedback loops. Assuming instant mixing fundamentally distorts these relevant mechanisms, especially for phenomena sensitive to spatial/temporal gradients (like regional impacts or certain feedbacks). It doesn't just simplify; it misrepresents *how* the system transports and distributes energy/matter.

  **Testing the Principle: The Representative Agent (RA) in Macroeconomics**

  *   **Scenario:** A macroeconomic model assuming a single, perfectly rational representative agent to analyze aggregate consumption or the effects of a tax cut.
  *   **CFP Analysis:**
      *   **Purpose:** Often explanation of aggregate phenomena or policy effects.
      *   **Distortion of Core Mechanisms?** Yes, potentially significantly. Core mechanisms in macro (especially involving crises, distribution, or heterogeneous responses) often rely critically on heterogeneity of agents (income, preferences, expectations), coordination problems, and strategic interaction. The RA assumption *erases* this heterogeneity and interaction. It may predict *some* aggregates under *some* conditions, but it fundamentally distorts the causal pathways involving distributional effects, the emergence of aggregate phenomena from micro behavior, and the potential for coordination failures.
      *   **Isolation Feasibility?** It isolates the logic of individual optimization *in the aggregate*, but often at the cost of precluding essential macro-level causal structures arising from heterogeneity and interaction.
      *   **CFP Verdict:** **Problematic for explanatory purposes.** The falsity likely distorts the core causal mechanisms relevant to understanding many macroeconomic phenomena. (This aligns with your unease about rational expectations in crises – RA often pairs with RE). *However*, for very specific, highly aggregated predictions where heterogeneity might average out, or for isolating the pure optimization effect *absent interactions*, it *might* be acceptable under CFP.

  **What the CFP Doesn't Accommodate Perfectly & Potential Refinements:**

  1.  **Friedman's As-If & Pure Prediction:** Your comfort with Friedman's cases for pure prediction is fully accommodated by CFP, as purpose is key. The "causal mechanism" in the model is explicitly an instrumental tool, not a claim about reality. CFP accepts this for prediction-only goals.
  2.  **Degree of "Distortion":** CFP relies on a judgment call about "significant distortion" of "core" mechanisms. Your resistance to epicycles but acceptance of spherical cows shows you intuitively make this distinction: epicycles corrupt the fundamental *kind* of motion, while spherical cows preserves the fundamental *kind* of heat transfer mechanism (surface-based dissipation). The principle needs this nuance.
  3.  **Epicycles' Predictive Success:** CFP explains why their predictive success isn't enough *for you* – because their *causal story* is fundamentally wrong. An instrumentalist (F-twist) would accept them; CFP rejects them *if* the purpose includes explanation (which it implicitly did historically).

  **Conclusion:**

  The **Causal Fidelity Principle (CFP)** best captures your pattern of judgments. It moves beyond pure instrumentalism by emphasizing that the *falsity of assumptions matters when it fundamentally misrepresents the causal mechanisms that are central to the phenomenon the model aims to address.* It explains your acceptance of idealizations that isolate or simplify without corrupting the core causal story relevant to the purpose, and your rejection of assumptions that preclude or grossly distort those core mechanisms (even when predictive). The representative agent case exemplifies how CFP would likely lead you to be skeptical of such models for explanatory purposes, due to the distortion of heterogeneous interaction as a core macroeconomic mechanism. This principle provides a robust philosophical foundation for your chapter, focusing on the crucial link between assumptions, causal representation, and explanatory goals.
