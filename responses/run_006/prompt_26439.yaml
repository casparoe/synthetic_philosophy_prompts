  so at work all the ML people keep saying "the brain is just a computer" and they act like von neumann settled this back in the 50s in that little book he wrote, the computer and the brain. i finally read the thing and honestly it felt like he was saying almost the opposite? like he spends the whole book pointing out how the brain uses completely different principles — statistical not digital, massively parallel, low precision components, mixed analog-digital signalling. but maybe i'm missing the bigger picture since i don't have any philosophy background. can you walk me through what von neumann actually argued about the brain-computer analogy — what maps onto what in his view, where he thought the analogy breaks, and whether the way people now use his name to license strong computationalism about the mind holds up once you put his own disanalogies on the table?
