prompt: |-
  so after way too many years reading rationalist blogs I've ended up an expressivist about normative language: "lying is wrong" doesn't report a moral fact, it expresses a con-attitude — or a plan, or a state of being-for-not-lying, depending which flavor you like. I know the big problem is Frege–Geach: how do the embedded occurrences in "if lying is wrong, then getting your brother to lie is wrong" mean anything, when the speaker plainly isn't expressing disapproval of lying in saying the conditional? Same issue for negation, questions, and mixed normative-descriptive sentences. I've read the standard moves (quasi-realism, higher-order attitudes, Gibbard-style plans, being-for semantics, the negation-problem stuff) and I currently think they handle it well enough that the problem is dissolved, not just patched over.

  I want you to be the professional metaethicist who tries to talk me out of this. Dont just rehearse Frege–Geach; I already know the shape of it. I want the map of what would actually count against my position, with Frege–Geach as the central stress test. What would the world — or the semantics — have to look like for expressivism to be false, or for the standard solution to be fake? Which formal results, linguistic data, or internal-tension arguments should actually move me? Rank the defeaters from fatal to merely awkward, and say which ones a committed expressivist would themselves concede count against the view rather than dismiss. Then give me an honest verdict on whether the view has been qualified (say, into "expressivism is just a metasemantic research program" or "the descriptive semantics falls out for free") to the point where nothing could refute it — and whether that's a real problem for a view like this or just what a mature philosophical position looks like. For what it's worth, the thing most likely to move me is a worked case where the attitude-based semantics gets an embedded normative sentence wrong, or can't distinguish two sentences that obviously differ in meaning; I'm not much moved by the generic worry that moral talk feels fact-like. Start by brainstorming the strongest counterarguments before you commit to an answer, and think carefully about which cut deepest.
reasoning: |-
  Okay, let me tackle this user's metaethics challenge. They're a seasoned rationalist blog reader who's settled on expressivism, convinced that Frege-Geach isn't a dealbreaker. My job is to play devil's advocate at professional level—no rehashing basics, just targeted pressure points.

  First, their core concern: they want defeaters ranked by lethality. The negation problem feels like the sharpest blade—Schroeder's work shows expressivists struggling with why "~murder is wrong" expresses disapproval of murder while "murder isn't wrong" doesn't. If attitude semantics can't cleanly distinguish these, that's a formal hemorrhage. 

  Next, mixed inference. "If lying is wrong, deceiving is wrong" + "lying is wrong" should entail "deceiving is wrong" for expressivists just like descriptivists. But if the attitude-expressing machinery forces equivocation between premise types (e.g., "lying is wrong" expressing disapproval while the conditional expresses... what exactly?), modus ponens collapses. That's not awkward—it's potentially fatal. 

  They mentioned quasi-realism dissolving the problem, but dissolution might just be camouflage. The "creeping minimalism" critique whispers that expressivism becomes descriptivism in fancy dress if it mimics truth-aptness too well. Then why prefer it? The user likely dismisses this, but the bait-and-switch suspicion lingers. 

  Linguistic data could wound less lethally but still bleed the view. If corpus studies showed embedded normative clauses triggering identical presuppositions to factual ones ("Does Sam know that lying is wrong?" presupposes truth), expressivism must contort to explain why non-truth-apt attitudes project like facts. 

  Most ironically, the user's own success condition—semantic misprediction—might backfire. Take mixed disjunctions: "Either stealing is wrong or security cameras are on." Descriptivism cleanly assigns truth conditions; expressivism must map "or" to some attitude-operator that doesn't reduce to planning logic. If no plausible mapping exists, that's exhibit A. 

  Verdict: Expressivism survives by becoming neo-expressivist—treating normative claims as hybrid acts (expressing attitudes + semantic content). But that's qualification, not victory. The user should sweat if formal semantics forces attitude logic to overgenerate (negation problem) or undergenerate (mixed inferences). That's where I'd aim the cannon.
answer: |-
  You've articulated a sophisticated position and challenge. Let's stress-test expressivism beyond Frege-Geach recitals, ranking defeaters by severity and focusing on where semantics might crack under pressure. Here's the map of vulnerabilities, from lethal to surmountable:

  ### ⚡ **Fatal Wounds (If Unanswered)**  
  1. **The Negation Problem Refined (Schroeder's Inconsistency Challenge):**  
     - **Core Issue:** Expressivism struggles to explain why *"Murder is not wrong"* expresses *forbearance* (lack of disapproval) rather than approval of murder.  
     - **Semantic Test Case:** Contrast:  
       - (A) "~(Murder is wrong)" → Expresses *not being for blaming for murder*.  
       - (B) "Murder is not wrong" → Should express *being for not blaming for murder* (a positive attitude).  
     - **Fatal If:** No expressivist semantics can distinguish (A) and (B) without smuggling in truth-conditions. Gibbard's "plan-laden" operators help, but Schroeder shows this risks incoherence: if "~" operates on attitudes, "(~P) & P" should express contradictory attitudes, yet "Murder isn’t wrong and murder is wrong" feels like a contradiction *in the world*, not just in attitudes.  
     - **Why it cuts deep:** Attitude semantics must explain why normative contradictions *feel* like factual inconsistencies. If "disapproving of X while not disapproving of X" is the *only* conflict, expressivism loses grip on moral error.

  2. **Mixed Inferences with Descriptive Premises:**  
     - **Core Issue:** "If lying causes suffering, then lying is wrong. Lying causes suffering. Therefore, lying is wrong."  
     - **Problem:** The first premise must be *both* descriptive (about causation) and normative (linking to wrongness). Expressivism must explain how a hybrid sentence expresses a single, unified mental state that licenses inference.  
     - **Fatal If:** The attitude expressed by the conditional ("being for blaming lying if it causes suffering") doesn’t logically combine with the descriptive belief ("lying causes suffering") to entail the attitude ("being for blaming lying"). *Why* does this inference feel compelling, rather than being a non-sequitur?  
     - **Data Point:** Psycholinguistics on modus ponens processing. If mixed inferences are computed identically to descriptive ones (brain imaging/response times), expressivism owes a non-miraculous explanation.

  ### 🔥 **Serious Burns (Potentially Disfiguring)**  
  3. **Embedded Presuppositions & Questions:**  
     - **Core Issue:** "Does Sam know that lying is wrong?" presupposes *that lying is wrong*.  
     - **Problem:** Presuppositions project *truth*. If "lying is wrong" expresses an attitude, how does embedding it in a knowledge-claim trigger a truth-presupposition? Expressivists (e.g., Ridge) invoke "quasi-presupposition," but this feels ad hoc.  
     - **Linguistic Data:** Normative clauses in factive verbs ("regret", "discover") behave identically to descriptive ones. If expressivism treats this as mimicked syntax, it concedes the semantic high ground.

  4. **The Creeping Minimalism Trap (Dreier/Eklund):**  
     - **Core Issue:** If quasi-realism succeeds, expressivism "minimalizes" truth, belief, and fact until it collapses into realism.  
     - **Fatal If:** Expressivists adopt deflationism about truth *and* insist their view is distinct. Distinction without a difference?  
     - **Concession:** A committed expressivist *should* admit this is a cost: if quasi-realism works, it shows expressivism is a *metasemantic* view (about what grounds meaning), not a semantic one. But then Frege-Geach was never the real battleground.

  ### 🤔 **Awkward Pockets (Survivable but Ugly)**  
  5. **Attitude-Individuation Problems:**  
     - **Core Issue:** "Stealing is wrong" and "Stealing displeases God" might express identical attitudes in a believer, but the sentences aren’t synonymous.  
     - **Problem:** Expressivism ties meaning too tightly to psychology. If moral sentences express *plans* (Gibbard), why can't two identical plans correspond to distinct moral claims?  
     - **Data:** Substitution failures in hyperintensional contexts ("Loki believes stealing is wrong" ≠ "Loki believes stealing displeases God").

  6. **Non-Cognitivist Dilemmas in Epistemology:**  
     - **Core Issue:** How do we reason *about* moral attitudes? "If expressivism is true, moral debate is practical" – but this *meta*-normative claim feels cognitive.  
     - **Awkward If:** Expressivism must treat its own defense as non-cognitive, undermining philosophical critique.

  ---

  ### 🧪 **Your Litmus Test: Semantic Misprediction**  
  The strongest worked case against you: **Mixed Disjunctions**.  
  - **Sentence Pair:**  
    - (1) "Either stealing is wrong or the security cameras were off."  
    - (2) "Either stealing displeases the universe or the security cameras were off."  
  - **Intuition:** (1) feels like a moral assertion; (2) is metaphysical/descriptive.  
  - **Expressivist Prediction:** (1) expresses a complex attitude (e.g., *planning to blame stealing or believing cameras off*).  
  - **Problem:** This predicts (1) and (2) are synonymous (both express belief-attitude blends). But they aren't: (1) can be meaningfully denied by a moral realist without denying (2).  
  - **Why it hurts:** Expressivism struggles to explain the *distinctive force* of normative content in hybrid sentences. Descriptivism handles this via truth-conditional compositionality.

  ---

  ### 🏁 **Verdict: Qualified into Resilience?**  
  Expressivism *has* evolved into a metasemantic research program ("Why do normative judgments have the semantic properties they do?"). **This is a mature philosophical move, not evasion.** Quasi-realism *dissolves* Frege-Geach by showing how expressivist foundations can underwrite realist-like semantics.  

  **But qualification has costs:**  
  - It concedes that normative discourse *is* truth-apt and compositional at the semantic level.  
  - The remaining expressivist claim is *metaphysical*: moral properties aren’t fundamental (they’re projections of attitudes).  

  **Can it be falsified? Yes, in two ways:**  
  1. **Formal Collapse:** If the negation/conditional semantics for attitudes is proven inconsistent (Schroeder’s work remains a live threat).  
  2. **Empirical Semantics:** If linguistics finds normative embeddings behave unlike attitude-expressions (e.g., in presupposition projection or anaphora).  

  **Your stance is defensible, but at a price:** Expressivism survives by becoming a view about *grounding*, not surface semantics. If you’re happy paying that price—embracing quasi-realism as a victory, not a retreat—the view is robust. But if you wanted a *semantic* revolution, creeping minimalism has already assimilated it.  

  **Final Word:** The deepest threat isn’t Frege-Geach—it’s whether expressivism can explain moral *cognition* (not just language) without collapsing into descriptivism. If planning or disapproval states can’t underpin the *phenomenology* of moral discovery (e.g., "I was wrong about lying"), the view remains explanatorily hollow. That’s where a pro would press you hardest.
