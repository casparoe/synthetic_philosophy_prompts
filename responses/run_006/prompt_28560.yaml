prompt: |-
  Write the joint statement that a committed Harsanyi-style utilitarian and a committed non-utilitarian critic of Harsanyi's aggregation theorem (a prioritarian or egalitarian, for example) could both sign after a good-faith adversarial collaboration. For the purpose of the document, take Harsanyi's theorem in its standard form: if every individual's preferences and the social preference relation satisfy the von Neumann–Morgenstern expected-utility axioms, and the social preference satisfies Pareto indifference, then the social utility function is an affine function of the individual utility functions (a weighted sum, up to a positive affine transformation), with all weights positive if a strong Pareto condition is added. The Harsanyi-style utilitarian holds that this shows a rational, Pareto-respecting social evaluator must be a weighted utilitarian. The critic denies that it shows any such thing, holding either that the social-rationality axioms are not normatively neutral, or that interpersonal comparisons and the weights are presupposed rather than derived, or both.

  The document should have two parts.

  First, a numbered list of agreed claims. These should include: exactly what the theorem assumes and proves; what the von Neumann–Morgenstern representation theorem itself gives and does not give; what Pareto indifference adds and what it leaves open; and where the theorem is silent — in particular about the interpersonal comparability of the individual utilities, about how the weights are determined, and about whether the social preference relation is the sort of thing that should be required to satisfy the expected-utility axioms. Each claim should be precise enough for a decision theorist, and should state in plain language what philosophical work it does.

  Second, a disagreements table. For each residual disagreement, give: the issue; the claim each side would sign, phrased in that side's own vocabulary and not as a caricature; the crux that separates them; and a concrete case or argument both sides agree bears on the crux, with each side's prediction of what it shows. Include at least these cruxes: (i) whether the independence axiom is a requirement of rationality for a social evaluator choosing among lotteries over distributions, or only a consistency condition for a single person's preferences; and (ii) whether the theorem's weights, or the impartial-observer construction used to interpret them, presuppose interpersonal comparisons of utility rather than derive them. For the first crux, include a case with the following shape: a social evaluator is indifferent between two people receiving a benefit, but strictly prefers a fair lottery that gives the benefit to one of them over a policy that gives it to one of them for certain. Record how each side would treat that case.

  End with a short note on which residual disagreements, if any, are verbal rather than substantive, and which ones would actually move if the cruxes were settled.
reasoning: |-
  We are creating a joint statement between a Harsanyi-style utilitarian (HU) and a non-utilitarian critic (Critic) after adversarial collaboration. The document has two parts: a list of agreed claims and a disagreements table.

  Part 1: Agreed Claims

  We agree on the following:

  1. **Harsanyi's Aggregation Theorem Assumptions and Conclusion**: 
     - The theorem assumes:
       (a) Each individual has preferences that satisfy the von Neumann-Morgenstern (vNM) expected utility axioms (completeness, transitivity, continuity, independence).
       (b) The social preference relation satisfies the same vNM axioms.
       (c) The social preference satisfies Pareto indifference: if every individual is indifferent between two alternatives, then society is indifferent.
     - The theorem proves: The social utility function can be represented as a weighted sum of the individual utility functions (up to a positive affine transformation). That is, if we let U_i be the vNM utility function of individual i and W the social utility function, then W = Σ w_i U_i, with weights w_i > 0 (if strong Pareto is added, then w_i>0; without strong Pareto, weights are non-negative and not all zero).

  2. **What the vNM Representation Theorem Provides**:
     - For each individual (and for the social evaluator), the vNM theorem gives a utility function that represents their preferences over lotteries and is unique up to positive affine transformations. This utility function has the expected utility property: the utility of a lottery is the expected value of the utility of its outcomes.
     - However, the vNM theorem does not, by itself, provide any interpersonal comparison of utility. The utility functions it delivers are only ordinal with respect to certainty (i.e., they represent the individual's ranking of sure outcomes) and cardinal in the sense of representing attitudes toward risk, but they are not interpersonally comparable.

  3. **The Role of Pareto Indifference**:
     - Pareto indifference requires that if every individual is indifferent between two social alternatives (including lotteries), then the social preference must be indifferent. This condition, when combined with the vNM axioms for both individuals and society, forces the social utility function to be a linear aggregation of the individual utility functions.
     - What Pareto indifference leaves open: It does not determine the weights (w_i) in the aggregation. Moreover, it does not by itself require interpersonal comparisons. The weights must be determined by additional normative considerations.

  4. **Where the Theorem is Silent**:
     - **Interpersonal comparability**: The theorem does not assume or establish that the individual vNM utilities are interpersonally comparable. The representation W = Σ w_i U_i is mathematically possible even without interpersonal comparability because the weights can adjust for scale. However, to assign specific weights (beyond being positive) requires a basis for comparing the units or scales of individual utility functions. The theorem does not provide such a basis.
     - **Determination of weights**: The weights are not derived by the theorem. They are free parameters that must be set by the social evaluator. The theorem does not specify how they should be set, except that they must be positive (if strong Pareto holds) to respect strict Pareto improvements.
     - **Rationality of the social preference axioms**: The theorem does not establish that the social preference must satisfy the vNM axioms. It only shows that if it does (along with the other assumptions), then weighted utilitarianism follows. The critic may deny that social preferences should satisfy these axioms, especially the independence axiom.

  Part 2: Disagreements Table

  We now turn to the residual disagreements. For each, we state the issue, each side's claim, the crux, and a concrete case.

  | Issue | Harsanyi Utilitarian (HU) Claim | Critic Claim | Crux | Concrete Case | HU Prediction | Critic Prediction |
  |-------|---------------------------------|--------------|------|---------------|---------------|------------------|
  | **1. Independence Axiom for Social Preferences** | The independence axiom is a requirement of rationality for any entity making choices under uncertainty, including a social evaluator. Rational social choice must be consistent and satisfy the reduction of compound lotteries and the requirement that preferences over lotteries depend only on the outcomes that differ. | The independence axiom, while appropriate for individual choice under risk, is not necessarily rational for social choice. Social evaluators may have legitimate concerns about ex post fairness that violate independence. | Whether the independence axiom is normatively compelling for social decisions that involve distributing goods across people under uncertainty. | **Case**: There are two people, A and B, and one indivisible good (e.g., a life-saving drug). The social evaluator is indifferent between giving the good to A and giving it to B. Now consider two lotteries: <br> (i) Lottery L1: 50% chance of giving the good to A, 50% to B. <br> (ii) Lottery L2: a degenerate lottery that gives the good to A with 100% probability. <br> The evaluator strictly prefers L1 over L2 because L1 is fair. | HU: The social evaluator must be indifferent between L1 and L2. Because the evaluator is indifferent between A getting the good and B getting the good, and by the independence axiom, mixing with a common consequence (here, the other person not getting the good) should not change the preference. Thus, the strict preference for L1 violates independence and is irrational. | Critic: The strict preference for L1 is rational and justified by fairness. The evaluator cares not only about the final distribution but also about the ex ante chances. The independence axiom ignores the process and the fairness of the lottery. Therefore, the social evaluator may reasonably prefer L1. |
  | **2. Weights and Interpersonal Comparisons** | The weights in the aggregation formula are derived from the impartial observer construction, which allows the social evaluator to imagine being in the shoes of each individual with equal probability. This construction provides a foundation for interpersonal comparisons: the weights are determined by the evaluator's extended preferences. | The impartial observer construction does not derive interpersonal comparisons but presupposes them. To imagine being each person with equal probability, the evaluator must already have a way of comparing the well-being of different persons. The weights are not derived but are an input. | Whether the impartial observer construction (or the aggregation theorem) can generate interpersonal comparisons from non-comparable individual preferences, or whether it requires prior interpersonal comparisons. | **Case**: Consider two individuals: one is very poor and one is rich. The evaluator must assign weights to their utilities in the social welfare function. The impartial observer method: the evaluator imagines having a 50% chance of being the poor person and 50% of being the rich person. The utility assigned to being the poor person might be lower than to being the rich person. | HU: The weights are determined by the evaluator's extended preferences in the impartial observer position. The evaluator compares the two states (being poor and being rich) and the resulting vNM utility in the extended setup yields the weights. This process does not presuppose interpersonal comparisons; it constructs them. | Critic: To form extended preferences, the evaluator must already know how to compare the well-being of the poor and the rich. The vNM utility in the extended setup is only defined if the evaluator can already place the two states (being poor and being rich) on a common scale. Thus, interpersonal comparisons are presupposed. |

  Note on Residual Disagreements:

  - The disagreement over the independence axiom (Issue 1) is substantive: it concerns what rationality requires in social decisions under risk. The case of the fair lottery is a clear point of divergence. If the crux were settled (by an argument that fairness requires independence violations), then the critic's position would be strengthened. Conversely, if it were shown that violations of independence lead to dynamic inconsistency, the HU position would be strengthened.

  - The disagreement over the weights and interpersonal comparisons (Issue 2) is partly verbal and partly substantive. It is verbal in the sense that both sides agree that interpersonal comparisons are necessary for setting weights. The HU claims that the impartial observer construction provides a way to make such comparisons without prior input, while the critic claims that it does not. The substantive part is whether the construction is circular. If it could be shown that the impartial observer can form extended preferences without prior interpersonal comparisons (e.g., by using only individual vNM utilities and then scaling them appropriately), then the HU view would be supported. Otherwise, the critic's view stands.

  - Additionally, there is a deeper disagreement about the applicability of the vNM axioms to social preferences, which is substantive. The HU sees the axioms as requirements of rationality for any consistent choice under risk, while the critic sees them as appropriate only for individual choice and not for social choice, which must account for fairness and distributional concerns.

  We do not resolve these disagreements here, but we have clarified the points of agreement and the nature of the remaining disputes.
answer: |-
  ### Joint Statement: Harsanyi Aggregation Theorem  
  *Adversarial Collaboration Between a Harsanyi-Style Utilitarian (HU) and a Non-Utilitarian Critic (Critic)*  

  #### **Part 1: Agreed Claims**  
  We, the undersigned, agree on the following claims about Harsanyi’s aggregation theorem, its assumptions, and its limitations:  

  1. **Harsanyi’s theorem: Assumptions and conclusion**  
     - *Assumes*:  
       (i) Each individual’s preferences satisfy the von Neumann-Morgenstern (vNM) axioms (completeness, transitivity, continuity, independence).  
       (ii) The social preference relation satisfies the same vNM axioms.  
       (iii) Social preferences satisfy *Pareto indifference*: If all individuals are indifferent between two alternatives, society is indifferent.  
     - *Proves*: The social utility function is an *affine combination* of individual vNM utility functions (i.e., \( W = \sum w_i U_i \), where \( w_i > 0 \) if Strong Pareto holds).  
     - *Philosophical work*: This shows that under the axioms, social preferences must be weighted utilitarian. It does *not* prove that utilitarianism is uniquely rational, only that it is entailed by these axioms.  

  2. **vNM representation: What it does and does not provide**  
     - *Gives*: For each individual (or society), a utility function unique up to positive affine transformations, representing preferences over lotteries as expected utilities.  
     - *Does not give*: Interpersonally comparable utility levels or differences. vNM utilities are "cardinal" only in the ordinal-with-risk-preference sense, not in an interpersonally comparable sense.  
     - *Philosophical work*: The vNM theorem is a mathematical tool for representing preferences under risk. It does not resolve ethical questions about fairness, priority, or equality.  

  3. **Pareto indifference: What it adds and leaves open**  
     - *Adds*: A minimal unanimity condition ensuring that social indifference holds when all individuals are indifferent. Combined with the vNM axioms, it forces linear aggregation.  
     - *Leaves open*:  
       - How weights \( w_i \) are determined (they are *not* derived from the theorem).  
       - Whether social preferences *should* satisfy vNM axioms (e.g., whether rationality demands them for society).  
       - Whether utilities are interpersonally comparable.  
     - *Philosophical work*: Pareto indifference rules out non-aggregative social welfare functions (e.g., leximin) but does not justify utilitarianism alone, as weights remain arbitrary without further normative input.  

  4. **Where the theorem is silent**  
     - **Interpersonal comparability**: The theorem assumes individual vNM utilities are *given* but does not require or establish comparability across persons. Weights \( w_i \) can be set *as if* utilities are comparable, but the theorem provides no basis for such comparisons.  
     - **Weight determination**: Weights \( w_i \) are exogenous. The theorem does not specify whether they reflect egalitarianism, prioritarianism, or another norm. Strong Pareto only requires \( w_i > 0 \).  
     - **Social rationality axioms**: The theorem does not show that social preferences *ought* to satisfy vNM axioms (e.g., independence). It only shows that *if* they do, utilitarianism follows.  

  ---

  #### **Part 2: Disagreements Table**  
  Residual disagreements are cataloged below. For each, we state the issue, each side’s position, the crux, and a shared illustrative case.  

  | Issue | HU Claim | Critic Claim | Crux | Concrete Case | HU Prediction | Critic Prediction |  
  |-------|----------|--------------|------|---------------|---------------|------------------|  
  | **1. Independence axiom for social rationality** | The independence axiom is a universal requirement of rationality for *any* agent choosing under uncertainty, including social evaluators. Violations imply dynamic inconsistency or arbitrage vulnerability. | The independence axiom is defensible for individual rationality but not for social choice. Social evaluators may reject independence to respect fairness, equality, or agent-relative reasons without irrationality. | Whether rationality under risk for a *social* evaluator is identical to that for an *individual*. Does society have the same "identity" over lotteries as a person? | **Case**: Society is indifferent between giving a lifesaving drug to Patient A or B. Strictly prefers a 50-50 lottery over the drug going to A for certain. | HU: Violates independence axiom and is irrational. Society must be indifferent since \( U(\text{A}) = U(\text{B}) \) implies indifference to mixing with common outcomes (e.g., B’s death). | Critic: Rational and fair. Society values ex ante equality of opportunity, even if outcomes are ex post unequal. Independence ignores distributive fairness. |  
  | **2. Weights and interpersonal comparisons** | The weights \( w_i \) (and interpersonal comparisons) are *derived* via the impartial observer construction: an impartial evaluator imagines being each person with equal probability, generating comparable utilities. | The impartial observer *presupposes* interpersonal comparisons. To weight utilities, one must already know how to compare welfare across persons. The theorem does not "derive" comparisons; it assumes them. | Can interpersonal comparisons be generated from non-comparable vNM utilities (HU), or must they be prior ethical inputs (Critic)? | **Case**: Impartial observer assigns weights to a healthy and disabled person. Observer’s vNM utility when imagining being each person determines \( w_i \). | HU: Observer’s choices under risk *construct* comparable utilities. Weights emerge from preference alone. | Critic: Observer must *first* know if "being disabled" is worse than "being healthy" to assign vNM utilities. Comparisons are inputs, not outputs. |  

  ---

  #### **Note on Residual Disagreements**  
  1. **Verbal disagreement**: None. Both sides agree on the theorem’s mathematical claims and the need for normative input to set weights. Disputes are substantive.  
  2. **Substantive disagreements likely to move if cruxes resolved**:  
     - **Independence axiom**: If evidence showed that violating independence *always* leads to dynamic inconsistency (e.g., money pumps) in social choice, the Critic’s position weakens. Conversely, if real-world social policies violating independence (e.g., fair lotteries) were shown to be coherent and rational, HU’s position weakens.  
     - **Interpersonal comparisons**: If the impartial observer could be operationalized without presupposing comparisons (e.g., through neural data or preference convergence), HU’s view gains ground. If empirical work showed impartial observers *always* rely on prior ethical norms, the Critic prevails.  

  ---  
  **Signed**,  
  *Harsanyi Utilitarian*  
  *Non-Utilitarian Critic*  
  *Date*
