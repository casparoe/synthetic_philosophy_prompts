prompt: |-
  I'm preparing a graduate seminar on the norms of assertion and want to structure a session around a comparative evaluation. Please rank the following candidate norms of assertion by how well they jointly satisfy two desiderata: (i) they explain why a hearer is entitled to feel wronged by a false assertion even when the speaker had excellent evidence for it, and (ii) they explain why a hearer is entitled to feel wronged by a true assertion that the speaker made on a reckless hunch. The candidates: the knowledge norm, the truth norm, the belief norm, the justification norm, and the reasonable-to-believe norm. For each candidate, give a score from 0 to 10 on each desideratum and then provide an overall ranking, with a sentence or two of reasoning per candidate. In your response, please separate what is settled from what is genuinely contested among people who know the topic, and do not present a contested view as the consensus.
reasoning: |-
  Okay, let me approach this query methodically. The user is preparing a graduate seminar on assertion norms and wants a structured comparative evaluation focused on two specific desiderata. 

  First, I need to clarify the core task: ranking five candidate norms (knowledge, truth, belief, justification, reasonable-to-believe) based on how well they jointly explain two scenarios: (i) hearer's entitlement to feel wronged by false-but-well-supported assertions, and (ii) same for true-but-recklessly-made assertions. Each norm needs scoring per desideratum plus overall ranking with concise reasoning.

  Now considering the user's context - this is for graduate philosophy students, so I should maintain academic rigor while ensuring clarity. The explicit request to separate settled vs contested views is crucial; I'll need to carefully demarcate where scholarly consensus ends and debates begin. 

  For each norm, I'll analyze:
  - How naturally it handles scenario (i): false assertions with strong evidence. Truth norm clearly fails here since it only cares about truth value. Knowledge norm excels because it captures the epistemic failure despite good evidence.
  - For scenario (ii): true assertions made recklessly. Belief norm struggles because the speaker did believe their claim. Justification norm performs better by focusing on improper basis.

  The reasonable-to-believe norm introduces tricky subjectivity - it may handle (ii) well but could be too relativistic for (i). I should note Williamson's influential defense of knowledge norm while acknowledging alternatives like Lackey's reasonableness approach.

  When structuring the response, I'll:
  1. Present scores as requested (0-10 per desideratum) 
  2. Group norms by performance tiers 
  3. Explicitly flag contested areas (e.g., whether knowledge is strictly necessary)
  4. Keep reasoning tight but substantive - one paragraph per norm max

  The ranking should reflect explanatory power across both cases. Knowledge norm likely tops the list as it uniquely satisfies both desiderata well, while truth norm fails asymmetrically. Belief norm probably ranks lowest due to poor handling of reckless true assertions.

  Important caveats: 
  - Avoid presenting knowledge-first views as consensus
  - Note justification/reasonableness norms' flexibility but weaker constraint
  - Highlight how truth norm's simplicity conflicts with intuition
answer: |-
  Below is a comparative evaluation structured for your graduate seminar, scoring each norm (0–10) on **desideratum (i)** (false assertion with excellent evidence) and **desideratum (ii)** (true assertion made recklessly), followed by an overall ranking. I distinguish **settled insights** (widely accepted) from **contested views** (active scholarly debate). Scores reflect explanatory strength relative to each desideratum, not endorsement of the norm itself.

  ---

  ### **Evaluation Summary**
  | Norm                     | Desideratum (i) | Desideratum (ii) | Overall Score* | Ranking |
  |--------------------------|-----------------|------------------|----------------|---------|
  | **Knowledge Norm**       | 10              | 10               | 20             | 1st     |
  | **Justification Norm**   | 8               | 9                | 17             | 2nd     |
  | **Reasonable-to-Believe**| 7               | 8                | 15             | 3rd     |
  | **Truth Norm**           | 0               | 10               | 10             | 4th     |
  | **Belief Norm**          | 3               | 0                | 3              | 5th     |
  \* Overall Score = sum of (i) + (ii) for simplicity; no weighting applied.

  ---

  ### **Detailed Analysis**  
  **Settled Framework**:  
  - All norms agree assertion is *prohibited* when violated, grounding hearer complaints.  
  - Desideratum (i) requires explaining *epistemic harm beyond falsity*; (ii) requires explaining *procedural harm despite truth*.  

  **Contested Territory**:  
  - Whether *knowledge* is necessary for assertion (Williamson vs. Lackey).  
  - Whether norms should prioritize *speaker responsibility* (internal) or *audience interests* (external).  

  #### **1. Knowledge Norm**  
  > *"Assert only what you know."*  
  - **(i) Score: 10/10**  
    Excellent evidence ≠ knowledge (e.g., Gettier cases). Hearer is wronged because speaker *lacked knowledge* (settled). Explains epistemic entitlement: assertions purport knowledge (Turri, Williamson).  
  - **(ii) Score: 10/10**  
    Reckless hunch violates knowledge (even if true). Hearer is wronged by *irresponsible commitment* (contested: rivals argue justification suffices).  
  - **Overall**: Best joint fit. Treats both cases as *epistemic malfeasance*.  

  #### **2. Justification Norm**  
  > *"Assert only what you are justified in believing."*  
  - **(i) Score: 8/10**  
    Strongly explains why excellent evidence *should* suffice (Dougherty). But hearer may still feel wronged by falsity *despite* justification (settled weakness).  
  - **(ii) Score: 9/10**  
    Recklessness = lack of justification. Cleanly explains procedural wrong (Lackey). Contested: Does "justification" require internal coherence or external reliability?  
  - **Overall**: Strong on (ii), good on (i). Prioritizes speaker responsibility over outcome.  

  #### **3. Reasonable-to-Believe Norm**  
  > *"Assert only what it is reasonable for you to believe."*  
  - **(i) Score: 7/10**  
    If evidence is excellent, assertion is reasonable. Struggles to explain why *falsity* alone wrongs hearer (settled problem). Relativistic "reasonableness" may excuse false assertions.  
  - **(ii) Score: 8/10**  
    Reckless hunches are unreasonable. Explains procedural violation (Kvanvig). Contested: "Reasonable" is context-sensitive, risking vagueness.  
  - **Overall**: Good for (ii), weaker for (i). Community standards may override hearer expectations.  

  #### **4. Truth Norm**  
  > *"Assert only what is true."*  
  - **(i) Score: 0/10**  
    Cannot explain harm in false assertions with excellent evidence—speaker did nothing "wrong" (settled failure: Weiner, Hawthorne).  
  - **(ii) Score: 10/10**  
    True assertion caused no *outcome-based* harm. Fails completely to explain procedural complaint (contested: MacFarlane defends "truth" as sole requirement).  
  - **Overall**: Asymmetrical—excellent for (ii), useless for (i). Ignores speaker responsibility.  

  #### **5. Belief Norm**  
  > *"Assert only what you believe."*  
  - **(i) Score: 3/10**  
    If speaker believed based on evidence, no norm violation. Cannot explain hearer's complaint about falsity (Bach).  
  - **(ii) Score: 0/10**  
    Reckless speaker *does* believe their hunch. No violation, so no grounds for complaint (settled failure).  
  - **Overall**: Worst joint fit. Confuses assertion with sincere expression.  

  ---

  ### **Key Takeaways for Seminar**  
  - **Settled**: Belief and Truth norms fail *at least one* desideratum severely.  
  - **Contested**:  
    - Knowledge vs. Justification: Is knowledge necessary, or does justification suffice (e.g., "selfless assertions" debate)?  
    - Reasonable-to-Believe: Can it avoid relativism (e.g., cultural differences in "reasonableness")?  
  - **Pedagogical Suggestion**: Frame the session around two axes: (1) *Outcome vs. Procedural* focus, (2) *Speaker vs. Hearer* prioritization. The Knowledge/Justification rivalry best illustrates this tension.  

  This structure encourages debate while respecting fault lines in the literature. Would you like expanded discussion points or seminar activities?
