prompt: |-
  In most democracies, a person who immigrates, lives in the country for twenty years, pays taxes, and raises children there cannot vote in national elections unless they naturalize. Meanwhile, a citizen who moves abroad and never returns can often vote for life in the country they left. Between these two people, the one with the thinner connection to the country's laws and policies has the franchise, and the one with the thicker connection does not.

  I'm trying to understand what theory of democratic inclusion — of who properly belongs to the demos — this pair of practices presupposes. It seems to rule out the view that the franchise should track who is subject to the laws (since the non-citizen resident is, and the expatriate often isn't) and the view that it should track who is affected by the government's decisions (for the same reason). What remains? A theory based on national membership or citizenship as a kind of identity that persists independently of where you live? But then what is the philosophical justification for defining the demos that way rather than by residence, subjection to law, or affected interests? And is the practice internally consistent — can it justify also denying the vote to sixteen-year-olds who work and pay taxes, or to the residents of a capital city who are governed by a federal district without full representation? Reconstruct the implicit theory of the demos, identify where it is philosophically underdetermined, and say what institutional changes would follow from replacing it with an all-affected-interests principle or an all-subjected principle.
reasoning: |-
  Okay, the user is asking about the theory behind democratic inclusion, specifically why non-citizen residents can't vote while expatriates can. They want to understand the underlying principles and inconsistencies in current practices.

  First, I need to figure out the implicit theory. The current system seems to prioritize citizenship as a permanent status based on birth or naturalization. That explains why long-term residents without citizenship are excluded and expats retain voting rights. But the user points out that this doesn't align with subjection to laws or affected interests. So the theory must be more about formal membership than actual ties.

  The user mentions other groups like sixteen-year-olds and DC residents. That's a good point. If citizenship is the key, then minors and people in territories are consistently excluded. But that leads to inconsistencies because these groups are affected by laws but can't vote. The user is highlighting contradictions in the system.

  Now, philosophical underdetermination. The citizenship theory doesn't really explain why birthright is the basis. Why not residence or being affected? The user is questioning the justification. Also, how does this theory handle edge cases like long-term residents or diaspora? The principles aren't clearly defined, leading to arbitrary decisions.

  Alternative principles: all-affected interests or all-subjected. If we switch to affected interests, anyone impacted by decisions could vote. That might include non-residents, like foreigners affected by environmental policies. But that's impractical—voting rolls would be huge. All-subjected means anyone under the state's authority. That includes residents but not expats. More feasible but still includes minors and undocumented immigrants.

  The user probably wants to explore how changing these principles would affect policies. They might be interested in reforms like resident voting rights or expat restrictions. Also, deeper needs: understanding democratic legitimacy and fairness. They might be advocating for more inclusive voting policies or pointing out hypocrisy in current systems.

  I should make sure to address both the theoretical gaps and practical implications. Highlighting the tension between formal membership and actual impact will show why the current system is flawed. Also, discussing alternatives gives a path forward, which the user might be seeking for advocacy or academic purposes.
answer: |-
  The current system rests on an **"Ethno-Cultural or Formal Legal Membership" theory of the demos**, prioritizing *inherited or formally acquired national identity* over functional ties like residence, subjection, or affected interests. Here's a reconstruction, critique, and analysis of alternatives:

  ### The Implicit Theory: Citizenship as Inherited/Acquired Identity
  1.  **Core Premise:** The *demos* is defined as the community of citizens bound by shared history, cultural identity, and formal legal allegiance, established primarily through *birthright* (jus sanguinis/solis) or *state-sanctioned naturalization*.
  2.  **Why Citizenship Trumps Residence/Subjection:**
      *   **Permanence & Primacy:** Citizenship is seen as a fundamental, enduring identity. Residence and subjection are viewed as contingent states that do not automatically confer membership in the foundational political community.
      *   **Allegiance & Loyalty:** The state prioritizes the formal bond of allegiance (pledged in naturalization or inherent in birthright) as the guarantee of genuine commitment to the nation's long-term interests. Long-term residents, despite subjection, lack this formal pledge (unless naturalized).
      *   **National Sovereignty:** Defining the demos by citizenship asserts the nation-state's sovereign right to control its own membership and political boundaries, resisting dilution by non-members, regardless of their functional ties.
  3.  **Why Expatriates Retain Voting:**
      *   **Irrevocable Membership (in practice):** Citizenship is treated as a largely indelible status. Once "in the club," you remain a member for life unless you formally renounce or the state revokes it (rarely done for non-criminal emigrants).
      *   **Symbolic Connection & Potential Return:** Expats represent the "extended nation," maintain cultural ties, may own property, receive pensions, and retain the *potential* to return and be subject to laws again. Denying their vote would be seen as severing their fundamental membership.
      *   **Historical Inertia:** Early democracies emerged when emigration was often temporary and diasporas were small; the principle of lifelong franchise became entrenched.
  4.  **Consistency with Other Exclusions:**
      *   **Minors (16-year-olds):** Consistent. Minors lack full legal capacity and are not considered full members of the political community until the age of majority, regardless of taxpaying or subjection. Citizenship is primary, but full political rights require reaching a state-defined age of maturity.
      *   **Federal District Residents (e.g., DC):** *Inconsistent.* This exclusion highlights the theory's limits. DC residents *are* full citizens, subject to federal laws (and uniquely impacted by Congress's local oversight), yet denied full representation. This stems from *federal structure compromises* (balancing state vs. federal power) overriding the core citizenship principle. It exposes the theory's vulnerability to non-democratic institutional design choices.

  ### Philosophical Underdetermination
  The theory faces significant philosophical gaps:
  1.  **Justifying Birthright:** *Why* is being born within arbitrary borders or to citizen parents the *morally relevant* criterion for foundational membership? This appears arbitrary and ethically thin compared to functional ties like subjection or affectedness.
  2.  **Disconnect from Democratic Principles:** Democracy's core justification is self-government by those bound by the rules. Prioritizing formal identity over actual subjection creates a disconnect between those making the rules and those most directly governed by them.
  3.  **Defining "National Community":** What constitutes the relevant "national identity" justifying exclusion? Is it culture, ethnicity, history, or purely legal status? The theory offers no principled answer, leaving it open to arbitrary or exclusionary definitions.
  4.  **Value of Allegiance:** Is a formal oath (or birthright) truly a better indicator of commitment to the common good than decades of residence, taxpaying, and community-building? This is empirically dubious.
  5.  **The "Permanence" Paradox:** If permanence justifies expat voting, why doesn't the *de facto* permanence of long-term residents justify *their* inclusion? The theory arbitrarily applies permanence only to citizenship status, not residency status.

  ### Alternative Principles & Institutional Changes
  Replacing the current theory with **All-Subjected** or **All-Affected Interests** would lead to significant reforms:

  1.  **All-Subjected Principle (ASP):** The demos includes all individuals *subject to the binding laws and coercive power* of the state.
      *   **Changes:**
          *   **Voting Rights for Long-Term Residents:** Non-citizens meeting a residency threshold (e.g., 5-10 years, paying taxes) would gain national voting rights.
          *   **Restriction of Expat Voting:** Expats residing permanently abroad and demonstrably *not* subject to most laws (e.g., not filing taxes, no resident property, not receiving state pensions) would lose voting rights after a period (e.g., 5-10 years abroad). Those maintaining significant subjection (e.g., paying taxes, owning property) might retain it.
          *   **Potential Inclusion of Minors/Young Teens:** Could justify lowering the voting age significantly, as 16-year-olds paying taxes are unquestionably subject to laws. (Requires addressing capacity concerns separately).
          *   **Full Representation for DC/Similar Territories:** Residents clearly subjected to federal laws would gain full voting representation.
          *   **Complex Cases:** Undocumented immigrants subject to laws? Prisoners? This principle forces difficult but necessary debates about the scope of subjection.

  2.  **All-Affected Interests Principle (AAIP):** The demos includes all individuals whose *significant interests* are *affected* by a political decision.
      *   **Changes (More Radical):**
          *   **Voting Rights for Long-Term Residents:** Similar to ASP, inclusion based on being deeply affected.
          *   **Restriction of Expat Voting:** Similar to ASP, exclusion if minimally affected.
          *   **Expansion Beyond Residents:** Could justify voting rights for:
              *   **Non-Resident Citizens Deeply Affected:** (Similar to current expats, but potentially broader).
              *   **Non-Citizens Outside the State:** Individuals significantly affected by a state's decisions (e.g., communities downstream of a polluting river, countries impacted by trade/tariff policies, climate policies). This is the most radical implication.
              *   **Future Generations:** Their interests are profoundly affected, but enfranchising them is practically impossible. (Often handled via representation theories).
          *   **Lower Voting Age:** Minors whose interests are affected (e.g., by education, environmental policy) could be included.
          *   **DC/Territories:** Inclusion.
      *   **Major Challenge:** Practicality. Defining "significant interest" and managing an electorate potentially spanning the globe for every decision is immensely complex. It risks diluting the vote of core residents or becoming unworkable. Often implemented partially (e.g., local voting for residents) or used as a *justification* for inclusion rather than a direct franchise mechanism.

  ### Conclusion
  The current practice presupposes a theory prioritizing **formal, inherited, or state-sanctioned membership (citizenship)** as the defining characteristic of the *demos*, largely independent of location, subjection, or affectedness. While providing clear legal boundaries, this theory is **philosophically underdetermined** regarding the moral primacy of birthright/naturalization over functional ties and leads to **inconsistencies** (like DC disenfranchisement) and **moral anomalies** (disconnected expats vote, deeply connected residents don't).

  Adopting an **All-Subjected Principle** would create a more coherent and democratic link between those who make the laws and those who must obey them, leading to the enfranchisement of long-term residents and the disenfranchisement of disconnected expats. Adopting the **All-Affected Interests Principle** would push democratic inclusion even further, potentially extending the franchise across borders based on impact, though facing severe practical challenges. Both alternatives fundamentally challenge the primacy of formal citizenship status in defining the democratic people, grounding inclusion instead in the realities of power and consequence.
