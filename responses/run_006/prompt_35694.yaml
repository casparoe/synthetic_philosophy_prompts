  What makes this thorny is that the scientific uncertainty cuts both ways. We can't prove insects aren't sentient, but the evidence isn't conclusive either. Current practices seem to operate on a "when in doubt, exclude" basis for insects, while giving vertebrates the benefit of the doubt. 

  The user's pushing us toward uncomfortable conclusions. If we take expected suffering seriously, we might need to: redesign insect farms with humane killing methods, develop insect-specific anesthetics, or even limit building demolitions during certain seasons. That sounds absurd to most people - which reveals how deeply our moral intuitions are biased toward vertebrates. 

