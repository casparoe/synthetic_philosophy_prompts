answer: |-
  The current disparity in animal welfare practices reveals an **implicit theory of moral status** based on **pragmatic thresholds, taxonomic proximity to humans, and a high burden of proof for sentience**, rather than strict certainty of non-sentience. Here’s a reconstruction of its core elements:

  ### Implicit Presuppositions:
  1. **Threshold Probability for Moral Consideration**:  
     The practice presupposes that moral protections only apply when sentience is *highly probable* (e.g., >90% confidence). Insects fall below this threshold due to:  
     - **Neuroanatomical Disparity**: Lack of a cortex or vertebrate-like pain pathways.  
     - **Behavioral Ambiguity**: Simpler reflexive responses (e.g., nociception ≠ suffering).  
     - **Evolutionary Distance**: Greater phylogenetic distance from humans than vertebrates.  

  2. **Moral Weight Discounting**:  
     Even if sentience is possible, its moral weight is discounted via:  
     - **Probability Discounting**: Low probabilities (e.g., 1% chance of sentience) are treated as negligible.  
     - **Intensity Discounting**: If sentient, insect experience is presumed less rich/aversive (e.g., "shallow" suffering).  

  3. **Tractability Priority**:  
     Welfare obligations apply only when:  
     - Interventions are **feasible** (e.g., stunning a pig is practical; stunning a locust swarm is not).  
     - Costs are **manageable** (e.g., reviewing fruit fly research would paralyze science).  

  4. **Anthropocentric Heuristics**:  
     Moral status is anchored to **human-like cognition** (e.g., vertebrates share more neural substrates). Insects, as "alien" minds, default to exclusion.  

  ---

  ### What the Practice Tolerates vs. Presupposes:
  | **Element**               | **Presupposes**                                                                 | **Tolerates**                                                                 |
  |---------------------------|---------------------------------------------------------------------------------|-------------------------------------------------------------------------------|
  | **Insect Non-Sentience**  | Not strictly required; low probability suffices for exclusion.                  | Scientific uncertainty; future evidence could shift norms.                    |
  | **Probability Discounting** | Required: Low-risk sentience is morally ignorable.                              | Alternative views (e.g., precautionary principle).                            |
  | **Moral Weight**          | Insect welfare (if real) is trivial vs. vertebrates.                            | Variability (e.g., bees may matter more than fruit flies).                    |
  | **Tractability**          | Actionability is necessary for moral obligation.                                | Gradual reforms (e.g., humane insect farming if scalable).                    |

  ---

  ### An Expected-Welfare Approach: Necessary Changes
  A consistent expected-welfare framework (weighting outcomes by probability of sentience) would demand:

  1. **Insect Farming**:  
     - **Humane Killing Methods**: Replace boiling/grinding with rapid methods (e.g., instantaneous shredding, inert gas asphyxiation).  
     - **Housing Standards**: Enrichment (e.g., substrate for burrowing crickets) if evidence suggests frustration avoidance.  
     - **Scale-Based Regulation**: Large farms (>1M insects/year) require welfare audits.

  2. **Pest Control**:  
     - **Proportionality**: Avoid indiscriminate eradication (e.g., use targeted traps vs. whole-building fumigation).  
     - **Least Aversive Methods**: Prioritize repellents or infertility techniques over neurotoxins causing prolonged distress.  
     - **Monitoring**: Avoid control during high-sentience risk periods (e.g., when bees exhibit complex foraging).

  3. **Research Ethics**:  
     - **Review for Large-Scale Studies**: Protocols killing >10,000 insects require justification of sample size/pain mitigation.  
     - **Sentience Probability Weights**: Grant applications score higher if they address welfare risks (e.g., anesthesia trials).  

  4. **Policy Innovations**:  
     - **Sentience Thresholds**: Tiered regulations (e.g., full protections for bees/ants; minimal for flies/mosquitoes).  
     - **Innovation Incentives**: Funding for humane insecticidal R&D (e.g., instantaneous neural disruptors).  

  ---

  ### Philosophical Tensions
  - **Paralysis Problem**: If *all* plausible sentience deserves consideration, nematodes (1 quadrillion+ on Earth) could dominate ethics. Practice implicitly rejects this via **severability** (only vertebrates/cephalopods clear the bar).  
  - **Demandingness Objection**: Expected-welfare may demand unrealistic sacrifices (e.g., halting construction for ant nests). Response: Balance via **de minimis risk** (accept trivial probabilities) or **cost-effectiveness thresholds**.  

  The status quo rests on **practical syllogism**:  
  *P1: Only high-probability sentience merits costly protections.*  
  *P2: Insect sentience is low-probability.*  
  *C: Thus, insect protections are optional.*  

  An expected-welfare view replaces P1 with:  
  *P1*: *All plausible sentience merits proportional safeguards, weighted by probability and scale.*  
  This forces engagement with uncertainty—not as a reason for inaction, but for calibrated concern.
