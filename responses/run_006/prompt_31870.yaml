answer: |-
  Aquinas's distinction in *De Regno* between tyrannicide against a usurper and against an oppressive legitimate ruler hinges on the **nature of political authority, the source of legitimacy, and the paramount concern for the common good and public order.** Here's a conceptual unpacking:

  1.  **Defining the Tyrants:**
      *   **Tyrant by Usurpation:** This individual **lacks legitimate authority** from the outset. They gained power through force, fraud, or other illegitimate means, violating the established constitutional or customary order ("*iniuste intrat in principatum*"). Their very rule is an ongoing act of **injustice against the political community**. They are, essentially, a criminal warlord occupying the office.
      *   **Tyrant by Oppression:** This individual **acquired power legitimately** (e.g., election, inheritance) but subsequently governs **unjustly**, primarily for their own benefit rather than the common good ("*qui iuste intrat, iniuste administrat*"). They betray the trust placed in them and violate the purpose of their office, but their initial right to hold that office was valid.

  2.  **Why the Distinction Matters for Who May Act:**
      *   **Against the Usurper:** Because the usurper has *no legitimate claim whatsoever*, their rule is equivalent to an **ongoing violent assault on the political community's right to self-government**. Aquinas states that "anyone" (*quilibet*) can kill such a tyrant. The justification is **fundamentally defensive**: removing an unjust aggressor who has violently seized control. It's akin to repelling an invader; the community (or any member acting on its behalf) has a natural right to resist this manifest injustice threatening its very existence as an ordered society.
      *   **Against the Oppressive Legitimate Ruler:** Here, the ruler possesses **legitimate authority originally conferred by the community**. Removing them is not simply stopping an aggressor; it is **deposing an officeholder**. Aquinas insists this must be done by "public authority" (*publica auctoritas*). The crucial concern is **order and the avoidance of greater evil**. Private individuals or factions acting unilaterally risk:
          *   **Anarchy:** Sparking civil war or factional conflict worse than the tyranny.
          *   **Precedent:** Undermining the very principle of legitimate authority and the rule of law, making future governance unstable.
          *   **Injustice:** Mistaken judgments or actions driven by private vengeance rather than the common good.
          Action must be channeled through an authority that represents the community and aims to restore legitimate order, not just eliminate a bad ruler.

  3.  **Killing the Usurper: Execution or Private Resistance?**
      *   *De Regno* is **underspecified** on this precise point. It says "anyone" can kill the usurper, suggesting a **private right of resistance** based on natural law self-defense/defense-of-others against manifest aggression. The text does *not* explicitly frame it as the execution of a prior formal public judgment.
      *   However, the *conceptual basis* aligns with the usurper being an **outlaw** (*hostis humani generis*). By violently seizing power without right, they place themselves outside the protection of the law and the political community. The community's implicit rejection of their rule is inherent in their criminal act of usurpation. Thus, while Aquinas doesn't describe a formal judicial process, the killing *can be interpreted* as enforcing the **community's inherent, pre-existing judgment against the violent overthrow of its legitimate order**. It's more than purely private (it defends the *public* order), but less than a formal execution following a trial. Later commentators often lean towards this "outlaw" interpretation to bridge the gap.

  4.  **Resolving the Internal Tension: Toleration & Public Authority:**
      *   **Why Tolerate the Oppressor?** The core answer is **prudential concern for the common good**. Aquinas explicitly fears that the **remedy may be worse than the disease**. Unauthorized revolt against a *legitimate* ruler, even an oppressive one:
          *   Often leads to worse tyranny or chaos.
          *   Breaches the bond of loyalty and obedience that underpins *all* social order.
          *   May lack the legitimacy and authority to establish a stable, just successor regime.
          Enduring moderate oppression might be less harmful than the probable consequences of violent rebellion without proper authorization. It's a tragic calculation favoring lesser evil.
      *   **What is "Public Authority"?** This is a **significant gap** in *De Regno*. Aquinas provides no explicit definition or examples. Possible interpretations (based on the text's logic and medieval context) include:
          *   **A Representative Body:** An assembly of nobles, elders, or representatives of the people who originally conferred authority or hold a constitutional role.
          *   **A Superior Authority:** An overlord (e.g., the Pope or Emperor in medieval theory) with jurisdiction over the ruler in question.
          *   **The People Corporately (Vaguely Implied):** Aquinas states the authority to depose resides where the authority to appoint resided. If the community appointed the ruler, then the community (presumably through some recognized representative mechanism, not a mob) holds the authority to depose. However, *De Regno* does *not* elaborate on how this "people" acts authoritatively.
      *   **The Key Function:** Whatever its form, "public authority" acts not as a private avenger, but as the **embodiment of the community's juridical power to rectify a breach of trust by an officeholder**, aiming to restore legitimate government for the common good. It provides the legitimacy and order that private action lacks.

  **Summary of the Conceptual Machinery:**

  The asymmetry stems from the **fundamental difference in the tyrant's relationship to legitimacy**:
  *   A **usurper** is an **external aggressor** against the political order. Resistance is **defensive**, justified by natural law, and open to any defender of the community (conceptually akin to treating them as an outlaw).
  *   An **oppressive legitimate ruler** is a **faithless officeholder**. Deposing them is an **act of jurisdictional correction** within the political order. It requires the authority of the **community (or its representatives)** that originally constituted the office, to avoid the greater evils of anarchy and to preserve the principle of legitimate authority itself. Toleration is a prudential necessity until such authoritative action is possible, safeguarding the common good from potentially catastrophic disorder. The ambiguity surrounding "public authority" reflects Aquinas's focus on the principle of authorized action rather than prescribing specific constitutional mechanics in *De Regno*.
