answer: |-
  You're absolutely right to question the leap from mathematical dominance to rational obligation. Here's the strongest case against the claim that maximizing expected log wealth (Kelly) is *rationally required*, directly engaging the expected utility (EU) counterargument:

  ### Core Argument: Rationality is Agent-Relative, Not Theorem-Compliant
  **The Kelly theorem is a powerful mathematical truth about *one specific objective*: maximizing asymptotic growth rate.** It proves that for an agent *whose sole goal is to maximize the long-run compounded growth rate of their wealth with probability 1*, Kelly is the unique optimal fixed-fraction strategy. This is undeniable.

  **However, rationality is not about obeying theorems optimizing one specific metric.** It's about consistently acting to achieve *your own* goals and values given *your* beliefs and constraints. Kelly becomes rationally compelling *only* if the agent's utility function is precisely logarithmic *or* if their *sole, overriding objective* is achieving the highest possible asymptotic growth rate with probability 1. For many rational agents, this is not the case.

  ### Addressing the EU Counterargument: "Log Utility is Just Coherent!"
  The comeback "Kelly *is* EU maximization with log utility, so rejecting Kelly forces you to reject EU or explain why log utility is invalid" is clever but flawed. Here's why:

  1.  **Utility Functions Express Preferences, Not Theorems:** EU theory is a framework for representing coherent preferences under uncertainty. The utility function *encodes* the agent's attitude towards risk and value of outcomes. **There is nothing inherently irrational about having a utility function that isn't logarithmic.** Different utility functions represent different, equally coherent, preferences:
      *   **Linear Utility (U(W) = W):** Represents risk-neutrality. The agent cares only about expected terminal wealth, not growth rate or risk. Betting everything on positive EV bets is rational *for them*.
      *   **Quadratic Utility (U(W) = W - bW²):** Represents aversion to variance. The agent is willing to sacrifice some expected growth for reduced volatility. Kelly might be too aggressive.
      *   **S-Shaped Utility (Prospect Theory):** Represents loss aversion. The agent fears losses more than they value equivalent gains. Kelly, which accepts significant drawdowns, might be excruciatingly painful *for them*.
      *   **Step Utility (e.g., U(W) = 0 if W < $1M, 1 if W >= $1M):** Represents a specific goal. The agent only cares about hitting a target. Kelly might be suboptimal if it risks falling short too often before reaching the target.

  2.  **The "Why Not Log?" Burden is Misplaced:** The EU framework doesn't dictate *which* utility function an agent *must* have. It dictates how they should behave *given* their utility function. **The burden of proof lies on the Kelly advocate to show why *every rational agent must have log utility*. They cannot.** Log utility represents a *specific* set of preferences:
      *   Constant Relative Risk Aversion (CRRA = 1).
      *   Value proportional to the percentage growth/decline, regardless of current wealth level.
      *   An overwhelming focus on very long-run compounding to the exclusion of other considerations.
      While these preferences are *coherent*, they are not *universally mandated by rationality*. An agent who values smoothing consumption over time, has fixed near-term liabilities, is loss-averse, or simply cares more about expected terminal wealth at a specific horizon than asymptotic dominance, can rationally have non-log utility.

  3.  **"Asymptotic Dominance" is a Weak Motivator for Finite Beings:** The Kelly theorem's "almost sure dominance in the limit" is a powerful mathematical result, but it's a poor guide for finite humans making finite bets:
      *   **The Long Run is Too Long (and Might Not Come):** Agents have finite lifetimes, investment horizons, and opportunity sets. A strategy that guarantees dominance after 10,000 bets is irrelevant if your horizon is 100 bets or if the betting opportunity disappears after 50 bets.
      *   **"Almost Surely" Ignores Catastrophic Paths:** "Almost surely" means probability 1, but it allows for paths where Kelly loses disastrously *for an arbitrarily long finite time*, potentially bankrupting the agent long before the asymptotic dominance kicks in. A path-dependent, risk-averse agent rationally fears these paths.
      *   **Opportunity Cost of Capital:** Large drawdowns under Kelly (which are common) tie up capital that could be deployed more effectively elsewhere *now* or used for consumption/safety. Maximizing *isolated* asymptotic growth might not maximize overall life value.
      *   **Gambler's Ruin is Real:** While Kelly ensures wealth -> infinity with probability 1 *if you never go bankrupt*, the probability of bankruptcy *before* that happens is non-zero for any finite sequence. Fractional Kelly (betting less) significantly reduces this probability. A rational agent deeply averse to ruin might prefer fractional Kelly even knowing they sacrifice asymptotic growth rate.

  4.  **Psychological and Practical Realities Matter (Rationally!):** Rationality isn't pure disembodied math. It involves the agent's cognitive and emotional makeup *in the real world*:
      *   **Regret Aversion:** Watching a non-Kelly strategy win big in the short/medium term while Kelly lags can cause crippling regret, leading to abandonment of the strategy at the worst time. Sticking to Kelly requires near-superhuman discipline. Choosing a less volatile strategy to make adherence feasible can be rational.
      *   **Parameter Uncertainty:** The Kelly formula requires precise knowledge of the true edge (p and b). Overestimating your edge leads to disastrous over-betting. Rational agents aware of their own fallibility and uncertainty about true probabilities will *rationally* bet less than full Kelly to protect against estimation error. This isn't rejecting Kelly's math; it's rationally incorporating uncertainty *about the inputs* to Kelly's math.
      *   **Non-Fungibility & Competing Goals:** Wealth isn't just a number. It funds consumption, security, philanthropy, etc. Sacrificing near-term security or life goals solely to chase the highest possible asymptotic growth rate decades hence might violate an agent's broader coherent preferences.

  ### Conclusion: Kelly is Optimal for One Goal, Not Rationality Itself
  The Kelly strategy is mathematically optimal *for the specific goal of maximizing the long-run compounded growth rate*. It is also the EU-maximizing strategy *for agents with log utility*.

  **However, it is not rationally required because:**

  1.  **Rational agents can have coherent, non-log utility functions** reflecting different risk tolerances, time horizons, loss aversion, or primary objectives (e.g., hitting a target, minimizing ruin probability, maximizing expected terminal wealth).
  2.  **The "asymptotic dominance" guarantee** is mathematically true but often practically irrelevant or insufficiently motivating for finite agents facing real-world risks (ruin, parameter error, opportunity cost, changing circumstances) and psychological pressures (regret, discipline).
  3.  **Rationality incorporates the agent's specific context, knowledge, constraints, and broader goals.** Kelly, in its pure form, ignores these. Applying it rationally often means using fractional Kelly or adapting it significantly.

  **Rejecting the *obligation* to use full Kelly does not force you to reject EU theory.** It simply acknowledges that log utility represents *one particular, and often extreme, set of preferences* focused intensely on very long-run compounding. Rational agents can coherently prefer different things. The theorem proves dominance for a specific metric; it does not prove that metric is the sole arbiter of rationality. The "hidden work" your friend identified is the conflation of a powerful mathematical result about one objective with a universal prescription for rational action. Kelly is a superb tool for a specific job, not a rational imperative.
