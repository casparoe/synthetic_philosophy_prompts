prompt: |-
  I'm a journalist working on a long-form piece about corporate disclosure, and I keep running into the same defense. A company will reveal information that is technically accurate but carefully incomplete — for example, stating that a product passed all required safety tests while omitting that it failed several tests the law does not require — and then the spokesperson will say, "We never lied; everything we said was accurate," as if that settles the question of wrongdoing. I am convinced this move is doing argumentative work it has not earned, but I want to be able to say exactly what work that is.

  Lay out the distinct precise claims that this one-liner could be expressing, from readings so weak they are compatible with almost any view to readings strong enough to settle the question of wrongdoing. For each reading, say whether it is close to tautological, a substantive and defensible thesis, or false, and say whether it actually supports the conclusion that the company's disclosure was not morally or professionally objectionable. In particular, separate the readings along two axes: what the speaker is claiming about the act itself — for example, that no false statement was made, that no one was actually deceived, that no duty to volunteer further information was violated — and what the speaker is claiming about the moral evaluation of the act — for example, that only lying is wrong, that misleading is always less wrong, or that a hearer who could have asked better questions has no complaint. Where does the move from "it was not a lie" to "it was not wrong" require an extra premise, and which premise is doing the questionable work? I would also like the answer to flag which readings depend on a definition of lying and which depend on a substantive moral claim about deception, so I can tell when a spokesperson is sliding between the two.
reasoning: |-
  Okay, the user is a journalist working on a piece about corporate disclosure tactics. They're frustrated with companies using the "we never lied" defense when they've disclosed technically true but incomplete information. The user wants to dissect this defense precisely to expose its flaws in their reporting.

  Hmm, this requires unpacking both the logical structure and ethical implications of such statements. The core issue seems to be how companies exploit the gap between literal truth and material deception. The journalist probably needs concrete philosophical frameworks to challenge corporate spokespersons effectively.

  First, I should analyze the possible interpretations of "we never lied" along two axes: claims about the act itself (factual/logical) and claims about moral evaluation (ethical). The key is showing where the leap from "not a lie" to "not wrong" fails.

  For the factual axis, there's a spectrum from weak claims like "no false statement was uttered" (tautological but irrelevant) to strong claims like "no material omission occurred" (often false). The moral evaluation axis ranges from "only lying is wrong" (controversial) to "hearers bear responsibility" (dubious in asymmetric contexts).

  The dangerous moves happen when spokespersons conflate:
  1) Definitional claims about lying (which may be true but narrow)
  2) Substantive moral claims about deception (which are often indefensible)

  Particularly slippery is when they imply that because something isn't technically a lie, it can't be deceptive or unethical. That's where the hidden premise "only lying is wrong" does the heavy lifting - a premise most ethics frameworks reject.

  I should also highlight how this defense ignores duties of voluntary disclosure in contexts like product safety, where companies have greater knowledge than consumers. The "buyer beware" argument collapses when information asymmetry is severe.

  For the journalist's purpose, the most effective counterpoints might be:
  - Distinguishing between formal truth and material deception
  - Rejecting the "only lies are wrong" premise
  - Emphasizing contextual disclosure duties
  - Pointing out how partial truths manipulate by exploiting hearers' reasonable assumptions

  The conclusion should stress that "we never lied" only addresses a narrow definitional question, while the real issues are deception through omission and violation of disclosure norms. That's where the ethical failure lies.
answer: |-
  Below is a systematic breakdown of the "We never lied; everything was accurate" defense, dissected along the axes you requested. I've categorized interpretations from weakest to strongest, evaluated their truth status, and exposed the hidden premises required to leap from "not a lie" to "not wrong." Crucially, I've flagged where claims rely on **definitions of lying** (L) vs. **substantive moral claims** (M).

  ---

  ### **Axis 1: Claims About the Act Itself**  
  *(What the spokesperson asserts about the disclosure)*  

  | Interpretation of "We never lied; everything was accurate" | Truth Status | Relies on (L/M) |  
  |-----------------------------------------------------------|--------------|----------------|  
  | **1a. No literally false statement was uttered.**          | Tautological (L) | Pure definition of lying. |  
  | **1b. No one was *legally required* to disclose the omitted information.** | Often true (but context-dependent) | Legal/regulatory fact. |  
  | **1c. No one was *materially deceived* by the statement.** | Often **false** (M) | Assumes audiences only rely on literal truth. |  
  | **1d. The company violated *no duty* to volunteer further information.** | **Substantive/contested** (M) | Assumes duties are minimal/nonexistent. |  

  ---

  ### **Axis 2: Claims About Moral Evaluation**  
  *(What the spokesperson implies about ethics/professionalism)*  

  | Interpretation of "Therefore, no wrongdoing occurred" | Truth Status | Relies on (L/M) |  
  |------------------------------------------------------|--------------|----------------|  
  | **2a. Only lying (saying false things) is wrong; misleading via omission is permissible.** | **False/substantive** (M) | Rejected by ethics of deception. |  
  | **2b. Misleading is *less* wrong than lying.** | **Substantive/contested** (M) | Depends on context/harm. |  
  | **2c. Hearers who could have asked better questions share blame.** | **Substantive/usually false** (M) | Ignores power asymmetry. |  
  | **2d. Compliance with law implies moral acceptability.** | **False/substantive** (M) | "Legal ≠ ethical" fallacy. |  

  ---

  ### **The Critical Leap: From "Not a Lie" to "Not Wrong"**  
  The spokesperson’s argument implicitly requires **two hidden premises**:  
  > **P1:** *Only lying is morally/professionally wrong.* (2a)  
  > **P2:** *The company had no duty to volunteer omitted information.* (1d)  

  **Why these premises fail**:  
  - **P1** is indefensible: Ethics frameworks (e.g., Kantian, utilitarianism, professional codes) condemn intentional deception even via omission.  
  - **P2** ignores context: Duties of disclosure arise from **fiduciary relationships**, **materiality**, or **asymmetric knowledge** (e.g., safety risks).  

  ---

  ### **When Spokespersons "Slide" Between Claims**  
  They exploit ambiguity by:  
  1. Starting with a **weak, definitional claim** (1a: "We didn't lie" → tautologically true).  
  2. Implying a **strong moral claim** (2a: "Therefore, we did nothing wrong") *without justification*.  
  3. **Conflating legal and moral duties** (e.g., "We complied with the law" → falsely implying ethical purity).  

  **Example of the slide**:  
  > *"We stated a literal truth (1a), complied with disclosure laws (1b), and thus did nothing wrong (2d)."*  
  Here, they hide the gap between *legal compliance* (1b) and *moral defensibility* (2d requires P2, which is unproven).  

  ---

  ### **Key Takeaways for Your Reporting**  
  1. **Demand specificity**: Force spokespersons to clarify which interpretation of "no lie" they mean (e.g., "Are you claiming you had no duty to disclose the failed tests?").  
  2. **Reject the tautology trap**: "Not lying" ≠ "not deceiving." Cite ethics codes (e.g., SEC’s "full and fair disclosure" principle) that condemn misleading omissions.  
  3. **Expose the hidden premises**: Challenge P1 ("Why is only lying wrong?") and P2 ("What duty of care do you owe stakeholders?").  
  4. **Context is key**: Argue that **materiality** (could the omission change behavior?) and **asymmetry** (who controls the information?) create duties beyond literal accuracy.  

  **Professional/moral failure occurs not in the statement’s inaccuracy, but in its *strategic incompleteness*.** The defense works only if we accept the dubious premises that ethics is binary (lie/not-lie) and corporations bear no duty to volunteer material truths. Your piece can dismantle this by showing how "technically true" disclosures weaponize ambiguity against vulnerable audiences.
