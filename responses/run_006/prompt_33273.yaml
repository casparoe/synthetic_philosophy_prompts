answer: |-
  Here’s an exam question designed to force synthesis of the disjunction problem and Swampman objections, followed by a model answer and detailed marking scheme.

  ---

  ### Philosophy of Mind Final Exam Question (45 Minutes)
  **"Teleosemantics claims to solve the disjunction problem by grounding mental content in biological functions. However, Swampman-type cases are taken to show that this solution makes content unacceptably historical. Explain both the disjunction problem and the Swampman objection, then evaluate whether teleosemantics can resolve the tension between these two challenges. Focus on how Dretske and Millikan would respond, and whether their solutions to one problem exacerbate the other."**

  ---

  ### Model Answer (780 words)

  Teleosemantics (Dretske, Millikan, Papineau) aims to naturalize mental content by defining representational states via their biological functions, ultimately derived from evolutionary history or learning. While promising, it faces two major challenges: Fodor’s disjunction problem questions its ability to secure determinate misrepresentation, while Swampman cases suggest its historical grounding severs content from present cognitive capacities. These problems create a tension: solving disjunction seems to require historical functions, but Swampman implies such functions yield an impoverished notion of content.

  **The Disjunction Problem and Teleosemantic Solutions**  
  Fodor’s disjunction problem asks: What stops a mental state (e.g., a frog’s "fly detector") from meaning a disjunction (e.g., *flies-or-black-dots*) rather than a specific content (*flies*), when it tokently responds to both flies *and* irrelevant stimuli (e.g., BB pellets)? Without a principled distinction, misrepresentation collapses – the frog isn’t *wrong* about BB pellets; it just detects part of its disjunctive meaning. Teleosemantics resolves this by appealing to *function*:  
  - **Dretske** distinguishes *indication* (reliable covariance) from *function*. A state means what it was *selected* to indicate (e.g., via learning or evolution). Misrepresentation occurs when the state fires outside its selected function (e.g., a magnetosome indicates direction *only* if selected for navigation).  
  - **Millikan** invokes *proper functions*: a state’s content is what it *historically* succeeded in mapping to (under Normal conditions) to confer survival benefits. The frog’s detector means *flies* because ancestrally, detecting flies (not black dots) contributed to reproductive success. Tokens caused by BB pellets are malfunctions – hence misrepresentations.  

  Both solutions rely on selection history to fix content and exclude disjunctive "noise." This successfully handles disjunction by making content etiological.

  **The Swampman Challenge**  
  Davidson’s Swampman thought experiment targets this historicity: Suppose a lightning strike spontaneously assembles a molecule-for-molecule duplicate of a human (Swampman) in a swamp. Intuitively, Swampman has thoughts (e.g., "That’s water"). But teleosemantics denies this: lacking selection history, his states have no proper functions or learned indications, hence no content. He is a contentless zombie.  
  This is problematic because:  
  1. **Intuition violation**: Swampman behaves identically to a contentful being; denying him thoughts seems overly restrictive.  
  2. **Cognitive irrelevance**: Content is severed from *current* structure and dispositions. Swampman’s brain is identical to a human’s, suggesting content should depend on present mechanisms, not past causes.  
  Teleosemantics thus appears to prioritize solving disjunction over capturing the synchronic reality of cognition.

  **Tension and Evaluation**  
  The core tension is that *solving disjunction requires history, but Swampman suggests history isn’t necessary for content*. Can teleosemantics resolve this?  
  - **Millikan embraces the cost**: She accepts Swampman lacks content. For her, content is essentially historical – like a heartbeat’s function depends on ancestral hearts pumping blood. Swampman’s "thoughts" are pseudo-intentional, akin to a spontaneously formed "heart" that doesn’t *actually* pump blood. The solution to disjunction is preserved, but the notion of content is explicitly historical.  
  - **Dretske’s indicator semantics might offer a partial escape**: If functions can arise via *individual learning* (not just evolution), Swampman *could* develop content post-creation by acquiring new indication functions through experience. However, his *initial* states (e.g., "water" thoughts) remain contentless unless learning histories are replicated – which they aren’t. Dretske still struggles with Swampman’s *immediate* intentionality.  

  **Does solving disjunction exacerbate Swampman?**  
  Yes, but unavoidably. Teleosemantics ties content to selection *because* it needs a non-arbitrary criterion to fix meaning and exclude disjuncts. Swampman exposes that this commits the theory to content being fundamentally historical. Teleosemanticists argue this is a virtue: it anchors content in concrete biological processes. Critics counter that it neglects the present computational role of mental states (e.g., Swampman’s "water" state interacts with his "thirst" state identically to a human’s). Hybrid approaches (e.g., Papineau) might appeal to *structural* properties, but risk reintroducing disjunction.  

  Ultimately, teleosemantics resolves disjunction at the cost of making content historical. Swampman highlights this cost but doesn’t refute the theory; it forces a choice between a purely synchronic account (which struggles with disjunction) and an etiological one (which handles disjunction but excludes Swampman). Teleosemantics opts for the latter, arguing that a naturalized theory must ground content in real-world functions – even if it clashes with intuition.

  ---

  ### Marking Scheme

  **A-Grade Answer (85-100%) Must Include:**  
  1. **Precise explanation of disjunction problem**: Clearly states how it threatens misrepresentation by making content indeterminate/disjunctive.  
  2. **Account-specific teleosemantic solutions**:  
     - Distinguishes Dretske (selected indication functions, e.g., via learning) from Millikan (etiological proper functions/Normal conditions).  
     - Explains how *historical function* excludes disjuncts (e.g., BB pellets aren’t part of the selected function).  
  3. **Swampman beyond "no history = no content"**: Articulates *why* Swampman is an objection (severs content from current structure/dispositions; violates intuition).  
  4. **Tension Identification**: Explicitly links disjunction solution’s reliance on history to Swampman’s challenge.  
  5. **Comparative Evaluation**: Contrasts Millikan’s embrace of historicity vs. Dretske’s potential flexibility with learning. Notes that solving disjunction *requires* history, making Swampman a necessary cost.  
  6. **Conclusion**: Judges whether tension is resolvable (e.g., "only by sacrificing intuition or disjunction solution") and defends teleosemantics’ trade-off.

  **B-Grade Answer (70-84%)**:  
  - Correctly explains disjunction problem and Swampman separately.  
  - Describes teleosemantic solutions but with minor inaccuracies (e.g., conflating Dretske/Millikan on learning vs. evolution).  
  - Identifies history as the source of tension but lacks depth in evaluating responses (e.g., "Millikan accepts Swampman has no content").  
  - Mentions tension but doesn’t fully analyze *how* solving disjunction exacerbates Swampman.  

  **Common Mistakes (Cost 5-15% each):**  
  - **Conflating disjunction with Quinean indeterminacy**: Disjunction is about misrepresentation, not translation.  
  - **Misrepresenting "Normal conditions"** (e.g., equating it with statistical normality rather than evolutionary design).  
  - **Swampman oversimplification**: Merely stating "no history, no content" without explaining *why* this is problematic for intentionality.  
  - **Ignoring key differences**: Treating Dretske and Millikan as interchangeable.  
  - **Unsupported claims**: Asserting Papineau or Dretske can handle Swampman easily without argument.  

  **Automatic B or Below**:  
  - Failure to connect disjunction and Swampman beyond listing them.  
  - Major inaccuracies (e.g., "Dretske rejects functions," "Millikan says Swampman has content").  

  ---

  This question forces students to see that teleosemantics’ strength (solving disjunction via history) is also its vulnerability (Swampman), and that theorists like Millikan and Dretske face trade-offs. The model answer demonstrates how to synthesize the objections while meeting the marking scheme’s demand for precision on functions, historicity, and their philosophical costs.
