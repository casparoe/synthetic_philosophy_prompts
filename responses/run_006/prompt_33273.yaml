  Could you write one upper-level essay question (like a 45-minute final question, not a take-home) that makes us connect those two worries rather than just list them? Then write a model answer around 700–800 words and a marking scheme. The marking scheme should name the specific moves a top answer has to make — like getting the difference between Dretske's indication/function story and Millikan's etiological account right, explaining Normal conditions and why they're supposed to handle misrepresentation, and saying what a reply to Swampman would actually have to establish. It would also help if the scheme seperates an A from a B and says which common mistakes cost marks, e.g. conflating the disjunction problem with Quinean indeterminacy, or just saying "Swampman has no history, so no content" without explaining why that's meant to be an objection. Don't worry about citing specific pages or anything, we just want the philosophy.
