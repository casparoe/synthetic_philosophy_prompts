  5-20 min: Phase 1, Scenario 1. Participants choose between 1A and 1B. Then Scenario 2: choose between 2A and 2B. Collect choices.

  20-30 min: Prepare for Phase 2. Explain that we will now think about packages of bets. 

  30-50 min: Phase 2. Present the two packages (1A+2A and 1B+2B) and explain that each yields 10 for sure. For participants who chose a package in Phase 1, they can switch to the other package by paying 1 point. For participants who mixed, they can choose either package by paying 1 point, or keep their mixed bets.

  50-60 min: Resolve the bets. Draw one ball from Urn A and one ball from Urn B. For each participant, calculate their total points from Phase 1 and Phase 2 decisions.

  60-75 min: Debrief.

  **Debrief:**
  - Ask how many chose 1A in Scenario 1? How many 1B? How many 2A? 2B? 
  - Typically, most choose 1A and 2A.
  - Point out that this is ambiguity aversion: preferring known probabilities.
  - In Phase 2, present that the package of 1A and 2A is a sure 10, and so is 1B and 2B.
  - Savage's sure-thing principle: if you prefer 1A to 1B (as most did in Scenario 1) and 2A to 2B (in Scenario 2), then you should prefer the package (1A,2A) to (1B,2B). But the packages are identical. This is a violation of the sure-thing principle because the sure-thing principle requires that preferences between acts should depend only on the states where they differ, and in this case, they never differ.
  - What does it cost to give up the sure-thing principle? It can lead to Dutch book (being made to accept a sure loss). In this case, by being ambiguity averse, you might pass up opportunities that are objectively identical.

  **Predictable Problems:**
  1. Participants might not show ambiguity aversion. Some might choose the ambiguous urn.
     - Handle: This is a teaching opportunity. In the debrief, note that not everyone is ambiguity averse. The activity is about the typical pattern.

  2. Participants might not understand the setup.
     - Handle: Explain clearly and do a practice bet.

  3. In Phase 2, participants might not want to switch even after understanding the equivalence.
     - Handle: Explain that this is common. People often stand by their choices due to regret aversion or commitment.

  4. Mixed-choosers might not see the point.
     - Handle: Focus the discussion on the package-choosers.

  **Honest Note:**
  The classroom game cannot reproduce the deeper philosophical issue that in the real world, the sure-thing principle is compelling, and giving it up means accepting that preferences can be affected by the way information is presented (framing) or by the source of uncertainty, even when the final outcomes are identical. The facilitator must supply the argument that rational choice under uncertainty should not depend on the source of the uncertainty if the final distribution is the same, and that the Ellsberg choices suggest a deep challenge to the expected utility framework. The facilitator should also note that while the activity shows the violation, it doesn't resolve whether it is rational to be ambiguity averse.

  Given the complexity, I provide a simpler and runnable version.

  **Revised and Runnable Activity:**

  **Phase 1: Ellsburg Choices (30 minutes)**
  - We use two urns: 
     - Urn A: 50 red, 50 blue (known).
     - Urn B: 100 balls, red and blue in unknown proportion (unknown).
  - Participants make two choices (on paper or electronically):
     - Choice 1: Which urn to bet on for red? 
          - Option 1A: Urn A - if red, win 10 points; if blue, 0.
          - Option 1B: Urn B - if red, win 10 points; if blue, 0.
     - Choice 2: Which urn to bet on for blue?
          - Option 2A: Urn A - if blue, win 10 points; if red, 0.
          - Option 2B: Urn B - if blue, win 10 points; if red, 0.
  - Collect choices.

  **Phase 2: The Package (30 minutes)**
  - Explain that we will now consider two packages:
     - Package 1: You hold both bet 1A and bet 2A.
     - Package 2: You hold both bet 1B and bet 2B.
  - Both packages yield 10 points for sure because:
     - Package 1: 
          - If Urn A is red, you win 10 from 1A and 0 from 2A -> 10.
          - If Urn A is blue, you win 0 from 1A and 10 from 2A -> 10.
     - Package 2 similarly: 
          - If Urn B is red, you win 10 from 1B and 0 from 2B -> 10.
          - If Urn B is blue, you win 0 from 1B and 10 from 2B -> 10.
  - Offer participants the choice:
     - If they originally chose Package 1 (1A and 2A) or Package 2 (1B and 2B), they can switch to the other package by paying a switching cost of 1 point. So if they switch, they will get 9 points for sure. If they don't switch, they get 10 points for sure.
     - If they originally mixed, they can choose either package by paying 1 point (and thus get 9 points for sure), or keep their mixed bets (which might win 0, 10, or 20 points, but not a sure 10).
  - Participants record their decision.

  **Resolve and Calculate (15 minutes)**
  - Draw one ball from Urn A and one from Urn B.
  - For each participant, calculate their points:
     - If they kept their Phase 1 bets, resolve each bet separately.
     - If they switched to a package, they get 9 points.
     - If they had mixed and chose a package, they get 9 points.
     - If they had mixed and kept their bets, then:
          - For their bet in Scenario 1: 
               - If they bet on Urn A, then if the drawn ball from A is red, they win 10 for Scenario 1 if they chose 1A, or if blue, they win 10 if they chose 2A. But wait, they made two separate bets.
          - Actually, they have two independent bets. So they win 0, 10, or 20 points.

  **Debrief (15 minutes)**
  - Discuss the choices.
  - Map to decision theory:
     - Phase 1 choices: Known probability (risk) vs. unknown probability (ambiguity). Most prefer known.
     - Phase 2: Packages are identical, so by the sure-thing principle, you should be indifferent. But if you paid to switch away from Package 1 to Package 2, you are essentially paying to avoid the package that contains the ambiguous urn even though it's now a sure thing. This violates the sure-thing principle.
     - The cost of giving up the sure-thing principle is that you might make dominated choices or be vulnerable to money pumps.

  **Predictable Problems and Handling:**
  - If many participants do not show ambiguity aversion: Use it to discuss heterogeneity in preferences.
  - If participants rationalize by saying they like to diversify (in mixed choices): Explain that in this case, diversification doesn't change the fact that the packages are sure.
  - If participants object to the switching cost: Explain that it is meant to simulate the cost of inconsistency.

  **Honest Note:**
  The activity cannot reproduce the normative force of the sure-thing principle. In the activity, participants might not feel compelled to change their choices even after understanding the equivalence. The facilitator must explain why many decision theorists find the sure-thing principle normatively compelling and why violating it can lead to动态不一致性 (dynamic inconsistency) or being "money pumped."
