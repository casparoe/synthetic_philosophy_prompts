  ### Ellsberg Paradox Classroom Activity  
  **Objective:** Make students experience ambiguity aversion, then confront a violation of Savage’s sure-thing principle through choices with concrete stakes.  
  **Stakes:** Points redeemable for small prizes (e.g., candy, extra credit). No real money.  
  **Materials:**  
  - 2 opaque urns (labeled *Urn A* and *Urn B*).  
  - Colored chips:  
    - *Urn A*: 50 red chips, 50 blue chips (known composition).  
    - *Urn B*: 100 chips with unknown red/blue ratio (do not reveal composition; students only know it’s "unknown").  
  - Betting slips for Phases 1 and 2.  
  - Whiteboard to tally points.  

  ---

  ### **Phase 1: Ellsberg Choices (30 min)**  
  *Goal: Experience ambiguity aversion without naming it.*  
  **Rules:**  
  - Students face two scenarios. In each, they bet 10 points on drawing a red or blue chip.  
  - **Scenario 1 (Bet on Red):**  
    - Option 1A: Bet on *Urn A* (known). Win 10 points if red drawn, else 0.  
    - Option 1B: Bet on *Urn B* (unknown). Win 10 points if red drawn, else 0.  
  - **Scenario 2 (Bet on Blue):**  
    - Option 2A: Bet on *Urn A* (known). Win 10 points if blue drawn, else 0.  
    - Option 2B: Bet on *Urn B* (unknown). Win 10 points if blue drawn, else 0.  
  - *Bets are independent:* Each student makes both choices before any draws.  

  **Procedure:**  
  1. **Intro (5 min):**  
     - Explain urns: *Urn A* (50 red/50 blue), *Urn B* (unknown ratio).  
     - Emphasize: "Decisions affect your points; no tricks, just choices."  
     - Distribute betting slips.  
  2. **Choice Period (15 min):**  
     - Students record choices for Scenarios 1 and 2.  
     - Collect slips. Tally choices on the board (e.g., "1A: 15 students, 1B: 5 students").  
  3. **Draw but DO NOT RESOLVE YET (10 min):**  
     - Draw one chip from *Urn A* and one from *Urn B* (e.g., *Urn A*: red; *Urn B*: blue).  
     - Seal chips in envelopes without revealing. *Crucial: Students know draws happened but not outcomes.*  

  ---

  ### **Phase 2: Confronting the Sure-Thing Principle (30 min)**  
  *Goal: Force students to see that typical Phase 1 choices violate dominance.*  
  **Rules:**  
  - Reframe Phase 1 bets as "portfolios" over states defined by the *Urn B* draw:  
    - **State R_B**: *Urn B* draw is red.  
    - **State B_B**: *Urn B* draw is blue.  
  - **Portfolios:**  
    - *Portfolio A*: Phase 1 choices 1A + 2A (bet on *Urn A* for both colors).  
    - *Portfolio B*: Phase 1 choices 1B + 2B (bet on *Urn B* for both colors).  
  - **Payoffs by State:**  
    | Portfolio | State R_B | State B_B |  
    |-----------|-----------|-----------|  
    | A (1A+2A) | 10 points | 10 points |  
    | B (1B+2B) | 10 points | 10 points |  
    - *Both portfolios pay 10 points regardless of the state!*  
  - **Phase 2 Choice:**  
    - Students choose to either:  
      a. **KEEP** their Phase 1 choices.  
      b. **SWITCH** to the other portfolio *and lose 1 point* (pay a "consistency cost").  

  **Procedure:**  
  1. **Reframe Bets (10 min):**  
     - Explain portfolios using the state table. Highlight: "Both portfolios guarantee 10 points."  
     - Emphasize: *"If you chose 1A and 2A in Phase 1, you hold Portfolio A. If you chose 1B and 2B, you hold Portfolio B. Mixed choosers (e.g., 1A + 2B) hold neither."*  
  2. **Confrontation (15 min):**  
     - Students choose: KEEP or SWITCH.  
     - **Cost of SWITCH:** -1 point (e.g., switching from Portfolio A to B turns 10 points into 9).  
     - *Rationale:* If Portfolio A and B are identical, switching should be costless. Charging a cost forces students to either revise preferences or pay to stay ambiguity-averse.  
  3. **Record and Tally (5 min):**  
     - Collect decisions. Note who pays to keep their portfolio.  

  ---

  ### **Resolve Bets & Calculate Points (10 min)**  
  1. Reveal the sealed chips.  
  2. Score Phase 1 bets based on draws.  
  3. Apply Phase 2 choices:  
     - KEEP: Score Phase 1 as chosen.  
     - SWITCH: Apply new portfolio score minus 1 point.  
     - *Mixed choosers in Phase 1:* Score Phase 1 as chosen, then apply Phase 2 switch (if any) to a portfolio.  
  4. Announce point totals.  

  ---

  ### **Debrief (15 min)**  
  **Map activity to theory:**  
  1. **Phase 1 Recap (5 min):**  
     - "Most chose 1A and 2A—betting on known *Urn A* for both colors. This is *ambiguity aversion*: We prefer known risks (50/50) over unknown probabilities."  
     - Contrast *risk* (Urn A, known probabilities) vs. *ambiguity* (Urn B, unknown probabilities).  
  2. **Phase 2 Tension (5 min):**  
     - "Portfolios A and B both pay 10 points in all states. Yet many paid to keep Portfolio A. Why?"  
     - **Violation of Sure-Thing Principle:** Savage’s principle says preferences should not change based on outcomes in mutually exclusive states. Here, Portfolios A and B have identical outcomes, so you should be indifferent. Paying to avoid Portfolio B contradicts Phase 1 choices.  
     - "If you preferred 1A over 1B *and* 2A over 2B, you should prefer Portfolio A. But Portfolios A and B are identical—so this is irrational."  
  3. **Cost of Violating Rationality (5 min):**  
     - "Giving up the sure-thing principle makes you vulnerable to ‘Dutch books’: You pay to avoid equivalent bets. In real life, this could mean rejecting profitable investments due to ambiguity."  
     - "The 1-point cost symbolized this: Paying to stay ambiguity-averse has concrete downsides."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Some students don’t show ambiguity aversion (e.g., choose 1B/2B).  
     - **Solution:** Highlight their choices in debrief: "Not everyone is ambiguity-averse! But most are—let’s focus on the pattern."  
  2. **Problem:** Students rationalize choices (e.g., "Urn B might be rigged").  
     - **Solution:** Redirect: "The exercise assumes the urn is fair but unknown. If you distrust the setup, you’re adding new assumptions—stick to the given info."  
  3. **Problem:** Mixed choosers (e.g., 1A + 2B) avoid the tension.  
     - **Solution:** Use them as a contrast: "Mixed bets don’t guarantee 10 points. Portfolio holders did, yet some paid to avoid one portfolio."  

  ---

  ### **Honest Note: What the Game Can’t Capture**  
  **Limitation:** The game simplifies ambiguity to a single urn, but real-world ambiguity involves deep uncertainty about *how* probabilities are unknown (e.g., climate models, financial markets). The activity cannot reproduce the visceral unease of "not knowing what you don’t know."  
  **Facilitator’s Role:** Explain in debrief that ambiguity aversion stems from this deeper uncertainty—it’s not just about missing numbers, but distrusting the entire information structure. Philosophers debate whether this aversion is rational; the game shows the *cost* of violating standard rationality axioms, but the facilitator must articulate why the sure-thing principle feels compelling in the first place.
