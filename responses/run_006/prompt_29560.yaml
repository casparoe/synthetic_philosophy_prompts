  ## Seminar Room Skirmish: After the Vagueness Talk

  *(Alex, the Epistemicist, leans against a podium, coffee cup in hand. Ben, the Supervaluationist, sits on the edge of a seminar table, fiddling with a pen. The air hums with the residual energy of the talk.)*

  **Alex:** (Sighs) Ben, I still can’t swallow that supervaluationist sleight-of-hand on the heap paradox. Your “solution” feels like dodging the bullet.

  **Ben:** Dodging? Alex, we face it head-on! We *accept* that vague predicates have borderline cases. That’s the reality your epistemicism denies. Your single, sharp, unknowable heap/non-heap boundary? *That’s* the dodge – a brute, inexplicable fact.

  **Alex:** It’s not inexplicable! The meaning of "heap" fixes a precise boundary, even if we can’t *know* where it is. Vagueness is ignorance, not indeterminacy. Your problem is the tolerance principle: “If n grains aren’t a heap, then n+1 grains aren’t a heap.” You reject it, but *why*? Because your super-truth requires it?

  **Ben:** We reject it because it’s *false*! But crucially, we don’t reject every *instance* of it individually. Tolerance fails *somewhere*, but we don’t need to point to *which specific conditional* fails – because no *single* precisification of "heap" is privileged. That’s the beauty! Tolerance is *superfalse* – false on every admissible precisification – even though no *particular* ‘n to n+1’ step is identified as the culprit *in every precisification*. It’s a global failure.

  **Alex:** Ah, but here’s the rub! You say "There is a last grain whose addition makes a heap" is **supertrue**. Meaning true on every way of making "heap" precise. But Ben, *for each specific precisification*, there *is* a sharp cutoff grain, right? Grain 287 is in, grain 286 is out, or whatever.

  **Ben:** Correct. For each admissible precisification P, there’s a specific grain k_P that marks the transition in P.

  **Alex:** Exactly! So "There is a last grain" is supertrue *only* because, *for each precisification*, there *is* a last grain *in that precisification*. But crucially, *which* grain it is *changes* depending on the precisification. So, when you utter "There is a last grain," you’re not actually committing to *any particular grain* being *the* last one universally. It’s true only because *some* grain is the cutoff in *every* scenario you consider admissible. It’s a ghostly cutoff, shifting with the precisification! How is that *really* saying "There is a last grain" in the robust, object-level sense? Isn't supertruth just truth *de dicto* about precisifications, not *de re* about the grains?

  **Ben:** (Leans forward) It *is* robust! It captures the *essential* truth: that adding grains *eventually* tips the scale into heap-hood. The statement "There is a last grain whose addition makes a heap" *must* be true for the predicate to have any extension at all! Supertruth captures the *invariant* truth across all coherent ways of drawing a line. Your "robust" truth would require pointing to grain 287 and saying "*This one* is metaphysically special," which is absurd! Nothing fixes *that specific grain* as the boundary – meaning fixes a *range* of acceptable boundaries.

  **Alex:** But meaning fixes *one* boundary! Our linguistic practices, the physical properties of grains, the concept of aggregation – they *determine* a specific point, even if cognitive limitations prevent us from knowing it. Your "invariant truth" is just a shadow play. Supertruth isn’t *truth* about the world; it’s truth about the *consistency* of our descriptions! When I say "That’s a heap," I’m making a claim about reality, not about all possible ways I *could* consistently describe reality. Your supervaluation makes truth relative to a set of precisifications – that feels like a retreat from classical truth.

  **Ben:** And your epistemicism posits a mysterious metaphysical fact – a sharp boundary inherent in the world or language – that is *in principle unknowable* by any speaker. *Why* should meaning work like that? What possible evidence could there be for such a boundary, other than the logical need to avoid the paradox? It’s an artifact of your insistence on bivalence, not a discovery about language or the world. We *explain* why you can’t know the boundary: because there *isn’t one unique boundary to know*! The ignorance is principled, not accidental.

  **Alex:** Bivalence *works*. It’s simple, powerful, and underpins logic. Your super-truth requires this elaborate machinery of precisifications and admissibility just to say that "heap" applies to some collections and not others, *without* committing to where the line is. But you *do* commit! You commit to there *being* a line *in every precisification*, you just refuse to say which one is *real*. You reject tolerance globally to avoid paradox, but you can’t point to *where* it breaks in the actual world because *your actual world doesn’t have a single breakpoint*! It has a spectrum of possible breakpoints. That feels like cheating.

  **Ben:** (Smiling wryly) And your insistence on a single, unknowable breakpoint feels like mysticism. We account for the phenomenology of vagueness – the genuine borderline cases, the lack of discernible jumps – without positing hidden facts. Supertruth *is* truth for vague language. It respects the lack of sharp boundaries in our *actual* use while preserving classical logic *within* each precisification. Your epistemic “ignorance” is just a label for the indeterminacy we supervaluationists take seriously.

  **Alex:** Seriously indeterminant? All I see is you multiplying cutoffs to avoid admitting there’s just one. Your “supertrue” statement about a last grain is true only because you’ve defined it to be true by fiat across all these ghostly precisifications. It doesn’t latch onto reality the way real truth should.

  **Ben:** And your “one true cutoff” doesn’t latch onto anything *knowable* or *manifest* in language use. It’s a phantom, Alex. A necessary phantom for your logic, perhaps, but a phantom nonetheless. At least my ghostly cutoffs are grounded in coherent linguistic possibilities.

  **Alex:** (Shakes his head, taking a sip of coffee) Grounded in possibilities, not in the actual. I’ll stick with the uncomfortable, unknowable actuality. Mysterious boundaries are less spooky than ghostly armies of cutoffs.

  **Ben:** (Stands up, gathering his notes) And I’ll stick with an account that reflects how we actually reason with vague terms, without mysterious, inaccessible facts. The ghosts are yours, Alex. Mine are just tools to illuminate the fuzziness. See you next week? The talk on higher-order vagueness should be… interesting.

  **Alex:** (Chuckles dryly) Undoubtedly. Prepare for more ghosts, Ben. Or perhaps more phantoms. I can never quite tell the difference in your ontology.

  *(Ben smiles, nods, and heads for the door. Alex stares into his coffee cup, the grains of sugar at the bottom suddenly looking remarkably… paradoxical.)**

  **Key Blows Landed:**

  *   **Epistemicist (Alex):** Pressed hard on the non-specificity of the "last grain" under supertruth (de re vs. de dicto). Challenged supertruth as not being genuine "worldly" truth but truth about precisifications. Highlighted the "ghostly cutoffs" and questioned the robustness of supervaluationist claims.
  *   **Supervaluationist (Ben):** Attacked the implausibility and mysteriousness of an unknowable sharp boundary. Emphasized that supervaluation explains the ignorance and respects borderline cases. Argued that rejecting tolerance globally without needing a specific failure point is a strength, not a weakness. Accused epistemicism of positing an ungrounded "phantom" boundary.
