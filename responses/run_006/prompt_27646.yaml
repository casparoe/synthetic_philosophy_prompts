prompt: |-
  I work in product at a company that builds LLM-based tools, and over the last year I've watched the same argument happen at every launch decision, so I'm trying to figure out whether the pattern itself has a name. The situation is this. Any safety measure we could add—red-teaming, extra refusal training, a slower rollout, turning down some high-margin customers—costs time and money and makes the product a bit slower or less impressive in a demo. Our competitors, who skimp on those steps, ship faster and cheaper. Buyers genuinely can't tell the difference up front, because a model that will occasionally fabricate a source or help with something awful looks identical in a demo to one that won't, and the failures are rare enough that most customers never see them—or when they do, the harm often lands on a third party, not on the buyer who chose the product. So the careful vendors either lose the deals or quietly drop the expensive safety work, and the ones who keep it get called nieve by their own boards. It's not that anyone is evil; each person is making the rational move given what the market rewards. I know this is adjacent to a race to the bottom, a market for lemons, and a tragedy of the commons, but none of those seems to be exactly it. The thing I'm looking at is specifically the extra cost of making a system that reliably does what its operator intends and refuses the bad stuff, and the fact that competitive pressure makes that cost unpayable even when every firm would prefer a world where everyone paid it. Does this configuration have a name of its own, and if not, what should it be called? I'm not after a slogan—I want the carving: what exactly distinguishes this from a plain race to the bottom on price or quality, which of the nearby concepts fits best, and where the edges of the phenomenon are. When you answer, lead with your bottom line in the first sentence—the name or nearest concept—and then give the reasoning, with no preamble and no restating my question.
reasoning: |-
  Okay, the user works in product development for a company building LLM-based tools and has noticed a recurring pattern during launch decisions. The core issue is that implementing safety measures—like red-teaming, refusal training, slower rollouts, or rejecting high-margin clients—increases costs and slows down the product. Competitors who skip these steps can ship faster and cheaper. Buyers can't initially tell the difference because failures (e.g., fabrications or harmful outputs) are rare and may affect third parties rather than the buyers themselves. This creates market pressure where careful vendors either lose deals or abandon safety measures, leading to a situation where even though companies prefer a world with safety, the competitive environment makes it unsustainable.

  The user is looking for the precise term for this phenomenon. They mention it's adjacent to "race to the bottom," "market for lemons," and "tragedy of the commons" but doesn't fit perfectly. The key elements are the hidden cost of reliability/safety and competitive pressures making such costs unviable despite collective preference for them.

  First, I need to recall relevant economic concepts. The market for lemons (Akerlof) involves asymmetric information where buyers can't distinguish quality, leading to a dominance of low-quality products. The described situation matches this closely: buyers can't differentiate between safe and unsafe models during demos, so they opt for cheaper options, pushing out high-quality providers. The harm to third parties adds an externality, which is a feature in lemons markets affecting uninvolved parties.

  Race to the bottom typically involves competing by lowering standards (e.g., labor or environmental regulations), which is similar but more about standards than information asymmetry. Tragedy of the commons involves shared resources being overused, which doesn't fit here since there's no common resource being depleted.

  So the "market for lemons" seems the best fit. The hidden defects (unreliability, harmful outputs) are the "lemons," and asymmetric information prevents buyers from valuing the safety features. The negative externalities (harm to third parties) exacerbate the problem, as the buyer doesn't bear the full cost of failures.

  The user also wants to distinguish this from a plain race to the bottom. The key difference is that in a race to the bottom, competition drives down prices by cutting costs, including safety, but here the core issue is the buyer's inability to discern quality upfront, leading to undervaluation of safety investments. That's classic information asymmetry, central to the lemons problem.

  In conclusion, "market for lemons" is the closest concept, with the nuance of negative externalities. The solution would involve signaling mechanisms (like certifications) or regulations to address the information gap and external costs, aligning with Akerlof's framework.
answer: |-
  The closest established concept is **Akerlof's "Market for Lemons" with negative externalities**.

  Here's the reasoning:

  1.  **Core Mechanism is Asymmetric Information:** Buyers cannot distinguish high-quality (safe/reliable) products from low-quality (unsafe/unreliable) products during the purchasing decision. This inability to observe the crucial quality difference (like hidden defects in used cars) is the hallmark of a lemons market.
  2.  **Outcome is Adverse Selection:** Sellers investing in costly quality (safety/reliability) cannot command a premium price because buyers can't verify that quality upfront. This makes the investment unprofitable. Competitors who shirk these costs can offer a seemingly identical product cheaper/faster, winning deals and driving high-quality sellers out of the market or forcing them to reduce quality (stop investing in safety).
  3.  **Distinction from Plain Race to the Bottom (RTB):** While competitive pressure is key, a pure RTB often assumes quality is observable but sacrificed for cost reduction. Here, the *critical* factor is the **unobservability of quality** (safety/reliability) by the buyer *at the point of sale*. The market fails because buyers *cannot* rationally choose to pay more for quality even if they value it.
  4.  **Distinction from Tragedy of the Commons:** There's no shared, finite resource being depleted. The harm stems from individual transactions where costs (harm from failures) are externalized.
  5.  **The Role of Externalities:** The phenomenon you describe has a strong element of **negative externalities**. The failures (fabrication, harmful output) often impose costs on third parties (end-users, the public) *not* involved in the transaction between the vendor and buyer. The buyer, shielded from these costs, has reduced incentive to demand/pay for safety features. This exacerbates the lemons problem by further decoupling the buyer's incentives from the true social cost of low quality.
  6.  **The "Cost of Reliability":** The unobservable cost you identify – the extra investment needed for reliability and safety – is precisely the type of quality investment that becomes unsustainable in a lemons market due to asymmetric information and adverse selection. The competitive pressure makes this cost "unpayable" because the market doesn't reward it.

  **Edges of the Phenomenon:**
  *   **Applies when:** (1) A product has a costly, valuable attribute (safety, reliability, ethical guardrails) that is (2) difficult or impossible for buyers to verify reliably *before purchase* or within a reasonable trial period, and (3) failures are rare or harm third parties, shielding the buyer from direct consequences.
  *   **Doesn't apply as strongly when:** Buyers *can* effectively verify the quality difference pre-purchase, or when failures are frequent, immediately costly, and directly impact the buyer, creating a direct incentive to pay for quality. Regulations or strong signaling mechanisms (like trusted certifications) can also mitigate this effect.

  In essence, the LLM safety/reliability investment is the unobservable "quality" in a classic lemons market setup, amplified by negative externalities that further distort buyer incentives.
