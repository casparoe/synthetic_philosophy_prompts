answer: |-
  ## The Barroom Debate: Expressivism vs. Cognitivism

  **Setting:** A noisy bar adjacent to a bustling philosophy conference hotel. Clinking glasses and chatter form the backdrop. **Clara (Cognitivist)** sips a whiskey, looking thoughtful but satisfied. **Evan (Expressivist)** approaches, holding a beer, a determined but friendly look on his face.

  **Evan:** Clara! That was quite the paper. Powerful critique. Mind if I join you? I need to digest that Geach punch.

  **Clara:** (Smiles wryly) Evan! Of course, pull up a stool. Digest away. I appreciate you coming to talk; I know it’s a direct hit on your home turf.

  **Evan:** (Sits) It is, but I think you might have underestimated our defenses. That Frege-Geach problem – embedding moral sentences in complex logical contexts – it’s the big one, no argument there. But fatal? I’m not convinced it’s a knockout blow.

  **Clara:** Okay, lay it on me. Where did I go wrong? Let’s take the classic modus ponens:
  1. If lying is wrong, then getting your brother to lie is also wrong.
  2. Lying *is* wrong.
  3. Therefore, getting your brother to lie is wrong.
  Seems perfectly valid, right? Everyone grasps the logical force. But *your* story, Evan: Premise 2, "Lying is wrong," expresses disapproval of lying. Fine. But Premise 1? That’s a *conditional*. What attitude does *that* express? Approval? Disapproval? Of *what*? It doesn't seem to be expressing an attitude towards lying *or* towards getting your brother to lie directly. And the conclusion clearly expresses disapproval of getting your brother to lie. How does the *logic* connecting these attitudes *work*? If moral sentences are just expressing non-cognitive attitudes, how do they slot into the logical machinery that governs truth-bearers? It looks like they *must* be expressing propositions with truth-values for the inference to hold water.

  **Evan:** Right. That’s the heart of it. But here’s the expressivist move: we *don’t* treat the conditional premise as expressing a *simple* attitude like approval or disapproval. Instead, we think about what *accepting* the whole conditional *consists* in. To accept "If lying is wrong, then getting your brother to lie is wrong" is to *plan* or *be committed* to disapproving of getting your brother to lie *if* you come to disapprove of lying. It’s a complex state – a *disposition* concerning combinations of attitudes.

  **Clara:** So the conditional expresses a... dispositional attitude about other attitudes? Okay, let’s run with that. What about premise 2? Accepting "Lying is wrong" is just disapproving of lying. Now, the inference says that if I accept both (1) this disposition concerning disapproval and (2) the simple disapproval of lying, then I *must* accept the conclusion, disapproval of getting your brother to lie. But *why must* I? What *logical* rule connects disapproving of X and having a disposition linking disapproval-of-X to disapproval-of-Y, to *actually* disapproving of Y? It seems like you’re smuggling in a logical ‘must’ that only makes sense if disapproval-of-X *entails* something propositional about X.

  **Evan:** It’s not about entailment in the classical truth-conditional sense. It’s about *inconsistency* in attitudes. If I sincerely assert premise 1, I’m expressing a commitment: *if* I have attitude A (disapproval of lying), I *must* have attitude B (disapproval of getting brother to lie). If I then sincerely assert premise 2, I’m expressing attitude A. But if I *deny* the conclusion, I’m expressing the *absence* of attitude B, or even approval of getting brother to lie. Holding *all* those states simultaneously – the commitment linking A to B, having A, and not having B – is fundamentally *incoherent*. It’s a practical inconsistency in my motivational set. Logic, for the expressivist, mirrors the norms governing *consistency* and *inference* within our network of conative attitudes, not just descriptive beliefs.

  **Clara:** Hmm. So you’re saying the validity of the inference lies in the *impossibility* or *irrationality* of holding that combination of attitudes? That’s... interesting. But let’s test it with negation. Take "Stealing is not wrong." For the cognitivist, it’s simply the negation of the proposition expressed by "Stealing is wrong" – it’s true if stealing isn’t wrong. For you? If "Stealing is wrong" expresses disapproval, does "Stealing is not wrong" express... *not* disapproving? But that could be mere indifference! Or does it express *approval*? Neither seems quite right. And how does *this* embed? "If stealing is not wrong, then borrowing without asking is permissible." What complex attitude does *that* express?

  **Evan:** Good push. Negation is tricky. The standard expressivist line – think Blackburn or Gibbard – is that negation operates on the *attitude-expressing role* itself. Denying "Stealing is wrong" isn't expressing indifference; it's *rejecting* the disapproval. It’s expressing a *higher-order* attitude: perhaps a refusal to disapprove, or a tolerance. Crucially, the logical properties emerge from how these attitude expressions constrain each other. "If P then Q" expresses a commitment that constrains my attitudes towards P and Q. "Not-P" expresses the rejection of the attitude typically expressed by P. The connectives map attitudes and commitments onto more complex attitudes and commitments. The system *mimics* truth-functional logic precisely *because* that’s what’s needed for coherent practical reasoning and discourse.

  **Clara:** Mimics... that’s the word that worries me, Evan. It sounds like you’re painstakingly *reconstructing* all the features of propositional, truth-apt discourse. You have complex states that play the *functional role* of beliefs, logical operators that combine these states in ways that perfectly mirror truth-conditional logic, yielding valid inferences based on norms of attitudinal consistency... Doesn't this just collapse into a form of *cognitivism*? You’re describing moral judgments as states that *behave exactly like* beliefs in propositions! Why not just admit they *are* beliefs in propositions, perhaps with a distinctive, motivationally laden content? It feels like a notational variant.

  **Evan:** Ah, the "collapse" objection! That’s the real crux. But no, it doesn’t collapse, and it’s not *just* a notational variant. The fundamental *metaphysical* and *semantic* starting point is radically different. The cognitivist says moral sentences express beliefs that represent moral facts out there in the world; truth is primary. The quasi-realist expressivist – that’s my camp – starts with the *practical function*: expressing attitudes, planning, coordinating. We *earn the right* to talk *as if* there are truths, propositions, and logical validity *from within* that practical perspective. We show how the *logical* and *realist-sounding* discourse emerges naturally from the non-cognitive base. The ‘truth’ we talk about isn't a robust correspondence relation; it's a way of endorsing or concurring with the underlying attitude. The proposition is a *projection* of the attitude for the purposes of reasoning. The ontology remains minimalist.

  **Clara:** So, the difference is foundational? You reject the ontological commitment to moral facts as part of the fabric of reality, independent of our attitudes?

  **Evan:** Exactly. The cognitivist project requires positing those facts to ground the truth-aptness. The expressivist project shows we don't *need* that ontological commitment to explain the full range of moral discourse, including its logical sophistication. The 'truth' and 'propositions' are practical tools forged within our conative practices, not mirrors of reality. The validity of modus ponens isn't grounded in correspondence, but in the impossibility of coherently combining certain practical stances.

  **Clara:** I see the distinction you're drawing. But I remain skeptical that you can *fully* "earn" the realist-sounding talk without smuggling in something propositional. Take the embedding in belief reports: "Sophie believes that stealing is wrong." For me, Sophie stands in a belief relation to the proposition *that stealing is wrong*. What is she related to on your view? A proposition you insist is merely projected? How does *that* work without circularity?

  **Evan:** (Takes a sip) Tough one. We need an account of what Sophie’s state *is*. She disapproves of stealing. To attribute the belief *to her* is to say she’s in that state, and to characterize her overall state of mind using the moral vocabulary. It’s reporting on her conative attitude using the public, logically structured language we’ve developed for coordinating those attitudes. The ‘that’-clause refers indirectly to the attitude-state via our shared moral practice. It’s not reporting a relation to a Fregean proposition, but characterizing her motivational set. It’s a bit clunky, I admit, but it’s part of the ongoing project of quasi-realism to fully naturalize this discourse.

  **Clara:** (Nods slowly) Okay, I understand the ambition. So, for you to win me over, I’d need to be convinced that this entire elaborate structure – the complex attitudes, the mapping of logical operators, the account of negation, the treatment of belief reports – genuinely succeeds *without* any point where it *must* implicitly rely on the existence of moral propositions or facts as traditionally understood? That the ‘projection’ is fully successful and doesn’t leave any explanatory gaps that only cognitivism can fill?

  **Evan:** Precisely. You need to be convinced that quasi-realism can provide a complete, non-mysterious account of moral language and logic, starting solely from non-representational attitudes and the norms governing their expression and combination. The burden is on us to deliver that full account convincingly.

  **Clara:** And conversely, for *me* to win *you* over...

  **Evan:** ...You’d need to show a fatal flaw in that project. Either demonstrate an embedding context we *cannot* handle without collapsing into positing robust propositions/facts, or show that our account of validity or consistency *itself* implicitly relies on cognitive content, or prove that our treatment of truth and belief attribution is incoherent or viciously circular. You need to find a crack in the quasi-realist edifice that forces us to build on cognitivist foundations.

  **Clara:** (Raises her glass slightly) Fair summary. So, the battle isn't just about Geach's specific problem anymore. It's about whether your solution to it – this complex, quasi-realist superstructure – is ultimately stable and self-contained, or whether it secretly rests on the very realism it tries to avoid.

  **Evan:** (Clinks his beer against her glass) Exactly. Geach exposed the problem. Quasi-realism is the ambitious solution. Whether it’s a solution or a cleverly disguised capitulation... that’s the real debate. Thanks for the sparring session, Clara. Excellent paper, genuinely.

  **Clara:** Likewise, Evan. You defended your corner well. This is why I love these conferences. Next round’s on me? We can tackle moral perception after the whiskey kicks in.

  **Evan:** (Laughs) Deal. Though maybe stick to beer for that one. Need a clear head against you!

  *(They both smile, the tension eased but the deep philosophical divide clearly still present, ready for the next round – of drinks and arguments.)*
