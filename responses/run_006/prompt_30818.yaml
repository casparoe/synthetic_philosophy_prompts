  Okay, let me start by unpacking the user's question. They're struggling with a tension between the Bayesian view of confirmation and actual scientific practice. Specifically, how can scientists credit a theory for explaining existing data when Bayes says known evidence can't raise the probability of a new hypothesis?

  First, I need to verify the user's understanding. They mention that under Bayesianism, known evidence has a probability of 1, so no new hypothesis can increase its likelihood. That's correct. But scientists do value theories that explain existing anomalies. The user points out examples like reviewers praising a theory for resolving longstanding puzzles. So there's a clear conflict here.

  The user wants to know what theory of confirmation underpins this practice. Are scientists being inconsistent? Or is there a non-Bayesian approach at work? They also ask about underdetermination—could multiple theories explain this, and how would we decide which one is correct?

  I recall that the Bayesian response involves using the Bayes factor. Even if the evidence is old, comparing how well the new hypothesis predicts it versus the old theory still provides confirmation. The probability of the evidence given the new theory might be high, while under the old theory it was low, hence the Bayes factor favors the new theory. That makes sense. But scientists often don't formalize it this way. They talk about "explaining" data rather than probabilistic updates.

  Then there's the distinction between accommodation and prediction. Scientists value novel predictions more, but still give credit for explaining old data. The user notes that post-hoc explanations are viewed suspiciously, yet explaining anomalies is praised. So maybe it's about the hypothesis not being designed to fit the data. If the theory was developed independently, explaining old data isn't seen as ad hoc.

  I should also consider the role of anomalies. An anomaly challenges the existing paradigm. A new theory resolving it shows explanatory power, which isn't just about probability but about solving problems that were persistent. Lakatos's research programs come to mind here, where a theory gains credence by explaining anomalies without ad-hoc adjustments.

  Underdetermination is another angle. Maybe likelihoodism (focusing on P(E|H)) or explanatory coherence could also justify the practice. Likelihoodism avoids prior probabilities and just compares how well hypotheses explain the data. Explanatory coherence looks at how well the theory fits with existing knowledge, making the anomaly no longer puzzling.

  The user's deeper need might be understanding whether scientific practice is rational or if it's inconsistent. They might be looking for a framework that reconciles the two perspectives. Also, they might want to know how to evaluate theories themselves or how to articulate evidence in grant proposals without falling into post-hoc reasoning.

  I need to address what changes if scientists adopt strict Bayesianism. They'd need to emphasize the Bayes factor and avoid saying the evidence confirms the theory directly. Instead, they'd compare likelihoods. But in practice, this might be cumbersome. Scientists might prefer heuristic terms like "explanatory power" which, while less precise, are more intuitive.

  Finally, the underdetermination point: multiple theories can license the practice, but empirical testing of meta-methodological claims could help decide. For example, studying historical cases where accommodating anomalies led to successful predictions versus cases where it didn't. This bridges the descriptive and normative aspects the user is interested in.
answer: |-
  Your observation captures a profound tension between formal confirmation theory (like Bayesianism) and actual scientific practice. The practice isn't incoherent, but it *does* presuppose a richer, more nuanced view of confirmation that goes beyond the simplest Bayesian account. Here's a reconstruction of the implicit theory:

  **The Core Implicit Theory: Explanatory Power and Anomaly Resolution**

  Scientific practice presupposes that **a theory gains significant confirmatory weight by providing a *better explanation* for a body of existing evidence, *especially* when that evidence was anomalous, puzzling, or poorly explained under prior theories.** This goes beyond mere probabilistic raising and incorporates elements of:

  1.  **Comparative Explanatory Success:** Confirmation is inherently *comparative*. A new theory (H_new) is confirmed relative to an old theory (H_old) or background knowledge (K) not just by raising P(E), but by providing a *more satisfactory explanation* for E, particularly if E was problematic for H_old/K.
  2.  **Anomaly Resolution as a Criterion:** Evidence that was an *anomaly* (E_anom) under H_old/K holds special weight. Successfully explaining E_anom is a major virtue for H_new because:
      *   It solves a recognized problem.
      *   It demonstrates H_new's ability to handle phenomena that H_old could not.
      *   It suggests H_new captures deeper or more general features of reality than H_old.
  3.  **Non-Ad Hocness:** The key distinction between valuable accommodation and suspicious post-hoc fitting lies in whether the hypothesis was *constructed solely to fit the specific data* or if the explanation *flows naturally from the theory's core principles*. Explaining existing data is virtuous if the theory wasn't "tuned" to that specific data set during construction. Anomaly resolution is particularly impressive because the anomaly was known *before* H_new was formulated, making it harder to dismiss the explanation as ad hoc tailoring.

  **Reconciling with (Modified) Bayesianism**

  Strict, simple Bayesianism struggles with known evidence (P(E) = 1). However, the practice *can* be reconciled with a sophisticated Bayesian perspective focusing on the **Bayes Factor** and **comparative likelihoods**:

  1.  **Focus on Likelihoods, Not Absolute Probability:** While P(E|K) = 1 for known E, we care about P(E|H_new) vs. P(E|H_old). If P(E|H_new) >> P(E|H_old) (and especially if P(E|H_old) was very low, making E anomalous), then the **Bayes Factor** [P(E|H_new) / P(E|H_old)] strongly favors H_new over H_old *even though E is old*. Confirmation is inherently relative.
  2.  **Explaining Anomalies = High Likelihood:** An anomaly under H_old means P(E_anom | H_old) is very low. If H_new provides a natural explanation, P(E_anom | H_new) is high. This creates a massive Bayes Factor in favor of H_new relative to H_old.
  3.  **Shifting the Probability of Theories:** While P(E) doesn't change, the *relative* probability of H_new vs. H_old *does* change dramatically via the Bayes Factor: P(H_new | E) / P(H_old | E) = [P(E | H_new) / P(E | H_old)] * [P(H_new) / P(H_old)]. A large Bayes Factor can significantly increase the ratio P(H_new)/P(H_old) after E is considered.

  **What Practice Presupposes vs. What it Fits With**

  *   **Strictly Presupposes:**
      *   Confirmation is comparative (theory vs. theory, or theory vs. background knowledge).
      *   Providing a better explanation (especially for problematic data) confers significant confirmatory weight.
      *   Resolving long-standing anomalies is a particularly strong form of confirmation.
      *   The virtue of accommodating old data depends critically on the *non-ad hoc* nature of the explanation.
  *   **Fits Well With (but doesn't strictly require):**
      *   The Bayesian machinery of likelihoods and Bayes Factors (as described above).
      *   Likelihoodism (focusing solely on P(E|H) for comparison, ignoring priors).
      *   Explanatory Coherence theories (e.g., Thagard, Lipton - Inference to the Best Explanation): Theories are confirmed by how well they "fit" with the evidence and other accepted theories, maximizing coherence and resolving inconsistencies. Anomaly resolution directly boosts coherence.
      *   Lakatosian "Research Programmes": A programme progresses (is confirmed) if its new versions explain previous anomalies *and* make novel predictions, without resorting to ad hoc adjustments.

  **Underdetermination: Multiple Theories Can License the Practice**

  Yes, the practice is underdetermined by confirmation theory. Several distinct theories can rationalize it:

  1.  **Sophisticated Bayesianism (Bayes Factor Focus):** As outlined above.
  2.  **Likelihoodism (Royall, Hacking, etc.):** Confirmation *is* the comparative likelihood ratio. H_new is better confirmed than H_old by E if P(E|H_new) > P(E|H_old). This directly justifies valuing high likelihood for anomalies.
  3.  **Inference to the Best Explanation (IBE - Harman, Lipton):** We should infer the hypothesis that would, if true, provide the best explanation for the evidence. Explaining anomalies is a prime example of providing a "lovelier" explanation. Non-ad hocness is built into "best".
  4.  **Lakatos's Methodology of Scientific Research Programmes (MSRP):** A programme is progressive (and thus confirmed) if its new theoretical variant has excess empirical content (explains old anomalies *and* predicts novel facts). Accommodating the anomaly *is* a key part of confirmation, but only if coupled with novel predictions for long-term progress.

  **What Would Settle Which Theory is Right?**

  Settling this requires moving beyond descriptive accounts of practice to *normative* philosophy of science and potentially meta-methodological analysis:

  1.  **Internal Coherence and Problem-Solving:** Which theory provides the most coherent, consistent, and compelling account of *all* aspects of scientific practice (including prediction, accommodation, theory choice, theory change, role of simplicity, etc.)? Does it avoid paradoxes?
  2.  **Normative Force:** Which theory provides the best *justification* for why the practice *should* be trusted to lead us towards truth or empirical adequacy? Can it explain scientific progress?
  3.  **Empirical Success of Methodology:** Can we find historical cases where adherence to one methodological principle (e.g., strong preference for prediction over accommodation) reliably led to better theories? Or conversely, where giving weight to anomaly resolution was crucial? (Lakatos attempted this).
  4.  **Formal Results:** Are there formal proofs showing one approach (e.g., Bayesian updating) is uniquely rational under certain assumptions (e.g., Dutch book arguments)? Critics argue these assumptions are unrealistic.
  5.  **Pragmatic Considerations:** Which framework is most useful for scientists in generating reliable knowledge and making decisions? Does it provide clear guidance?

  **Changes Under Strict Bayesianism**

  If scientists adopted a *strict*, simple Bayesian view (where known evidence has P(E)=1 and cannot change the posterior), their discourse would need significant shifts:

  1.  **No Direct Credit for Explaining Known Data:** Scientists could *not* say "This theory is supported because it explains phenomenon X (known for decades)." They could only say:
      *   "This theory *predicts* phenomenon X far better than the old theory did." (Emphasizing the comparative likelihood/Bayes Factor).
      *   "This theory renders phenomenon X, which was highly *improbable* under the old theory, *probable*." (Focusing on the anomaly status and likelihood shift).
  2.  **Emphasis on Novel Prediction:** The *only* way evidence could demonstrably *increase* P(H) (rather than just make H better than rivals) would be via genuinely novel predictions (evidence unknown/not used in constructing H, so P(E) < 1 before testing). Accommodation would be downplayed or framed solely comparatively.
  3.  **Reframing Reviews/Textbooks:** Textbooks would emphasize Bayes Factors: "Einstein's theory wasn't confirmed *by* Mercury's perihelion advance (which was known), but the fact that GR assigned a *much higher probability* to that specific observation than Newtonian gravity did provided strong evidence *for GR over Newtonian gravity*." Funding panels would demand explicit likelihood comparisons for existing data.
  4.  **Suspicion of Accommodation Reinforced:** The inherent suspicion of post-hoc explanation would be strengthened, potentially leading to undervaluing genuine explanatory breakthroughs that primarily resolve old problems.

  **Conclusion**

  Scientific practice presupposes a comparative, explanation-centered view of confirmation where resolving long-standing anomalies with a non-ad hoc theory provides strong support. This is *compatible* with sophisticated Bayesianism (via Bayes Factors and comparative likelihoods), Likelihoodism, and IBE. The practice is underdetermined – these different theories can all license it. Settling which normative theory is "right" requires evaluating their coherence, normative force, ability to explain scientific progress, and pragmatic utility. Adopting a strict, simple Bayesian view would force scientists to drastically alter how they describe the confirmatory value of explaining existing evidence, particularly anomalies, shifting the focus almost entirely to comparative likelihoods and novel predictions. The persistence of valuing anomaly resolution suggests scientists intuitively rely on a richer notion of confirmation than basic Bayesian probability raising.
