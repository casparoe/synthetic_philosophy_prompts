prompt: |-
  I'm a PhD student in political philosophy trying to sort out whether compatriots have special claims on one another — whether the bare fact of shared national membership generates moral reasons that don't extend to outsiders. I've been collecting my intuitive reactions to cases, and I'd like you to help me find the principle behind them, if there is one.

  Here are my verdicts:

  1. When I give to charity, I feel an emotional tug toward domestic causes, but on reflection I don't think that tug tracks a genuine moral reason. I think I should give to the charity that does the most good per dollar, regardless of where the beneficiaries live.

  2. When I vote, I feel entirely comfortable voting for policies that benefit my fellow citizens even when they impose modest costs on foreigners — for instance, agricultural subsidies that help domestic farmers but hurt farmers in developing countries. I don't think this is mere self-interest; I think it's morally permissible to weigh compatriots' interests more heavily at the ballot box.

  3. If I see two children drowning and can save only one, and one is my neighbor's kid while the other is a foreign tourist, I think I'm permitted to save the neighbor's kid. But I think the permission comes from the thicker relationship — I know the family, I'll face them afterward — not from shared nationality. If I learned both children were complete strangers to me, differing only in nationality, I'd think I should flip a coin.

  4. A doctor in a public hospital has one dose of a scarce drug and two patients identical in all relevant medical respects except that one is a citizen and the other is a foreign national. I think it would be wrong for the doctor to use citizenship as a tiebreaker.

  5. I think a state is permitted to restrict immigration in ways that predictably prevent many foreigners from dramatically improving their life prospects, in order to protect domestic wages or preserve cultural continuity. I'm uncomfortable with this verdict, but I can't bring myself to reject it.

  6. When a natural disaster strikes abroad, I think my government should send aid, but I'm not convinced it's required to spend as much as it would to address a comparable disaster at home. I think this asymmetry is morally permissible.

  The tension I can't resolve is between (2) and (4). Voting and triage both involve life-and-death stakes, both occur within institutional roles, and both require choosing between compatriots and foreigners. Yet I want to say the voter may favor compatriots but the doctor may not. Is there a principle that captures all six verdicts, or at least most of them? If some have to go, which ones, and why? And what does the resulting principle say about a case I haven't considered: a university admissions committee giving a slight preference to domestic applicants over equally qualified international ones?
reasoning: |-
  Okay, the user is a PhD student in political philosophy grappling with the moral implications of partiality towards compatriots. They've presented six specific intuitive verdicts that seem to conflict, especially between voting and medical triage scenarios. Their core tension is why favoring compatriots feels permissible in policy decisions but not in direct life-saving situations. 

  Hmm... this is a sophisticated ethical puzzle. The user clearly has deeply considered intuitions but senses inconsistency. What's striking is how context-dependent their judgments are—they reject nationality-based triage (case 4) but accept it in voting (case 2) and immigration (case 5). The emotional vs. reflective split in charity giving (case 1) suggests they're already distinguishing psychological impulses from justified reasons. 

  The drowning child case (3) reveals something crucial: they ground special obligations in concrete relationships, not abstract membership. That explains why the hospital scenario—where nationality is the only difference—feels wrong. But then why is voting different? Probably because voting involves institutional responsibilities absent in medical triage. 

  Ah! The institutional role distinction might be key. Voters act as agents of a political community with specific fiduciary duties, while doctors serve universal medical needs. That would reconcile cases 2 and 4. Immigration (5) and disaster aid (6) then align with the institutional logic—states exist partly to prioritize constituents. 

  But wait—does this principle condemn all forms of academic preference? The admissions case will test it. If universities are seen as national institutions (like public hospitals), preference might be problematic. But if they're cultural stewards, slight bias could be defensible. The user will need to decide where educational institutions fall on the "particularist mission" spectrum. 

  The user's discomfort with immigration restrictions (case 5) suggests lingering unease about weighting nationality too heavily. That's fertile ground for their research—perhaps the real moral work is done by how institutions are constituted, not membership per se. Their PhD might push toward a "political institutionalism" view where duties arise from roles, not identities. 

  ...Time to structure the response around three principles (relational, institutional, efficiency) showing how they resolve the tensions. The admissions case should be left open-ended—it'll help the user stress-test their own framework.
answer: |-
  Your intuitions reveal a sophisticated, context-sensitive approach to partiality—one that distinguishes between different types of obligations based on **roles, relationships, and institutional purposes**. The tension between (2) and (4) is illuminating, and a coherent principle *can* reconcile them and your other verdicts. Here’s a framework synthesizing your judgments:

  ---

  ### **The Principle: Institutional Role and Scope of Obligation**
  **Compatriot partiality is permissible only when:**
  1. **An agent acts in an institutional role** (e.g., voter, state official),  
  2. **The institution has a constitutive purpose of serving its members**, and  
  3. **The partiality advances that purpose without violating minimal universal duties** (e.g., basic rights, non-discrimination in life-or-death triage).

  ---

  ### **Applying the Principle to Your Cases**
  1. **Charity (Case 1)**  
     - *Consistent*: You’re acting as a private individual. No institutional role exists to justify partiality. The "emotional tug" is non-moral (sentimental bias), so impartial efficiency prevails.  
     - *Principle*: Private actors lack institutional mandates for partiality.

  2. **Voting (Case 2)**  
     - *Consistent*: As a voter, you act within a *political institution* (the state) constituted to prioritize the welfare of its members. Subsidies advancing citizens’ interests align with this role, provided costs to outsiders are "modest" (not catastrophic).  
     - *Principle*: States may permissibly favor members because their *purpose* is particularist.

  3. **Drowning Children (Case 3)**  
     - *Consistent*: Saving your neighbor’s child is justified by **concrete relational ties** (friendship, community), not nationality. Absent relationships, impartiality (coin flip) is required.  
     - *Principle*: Personal relationships—not abstract membership—ground special duties for private actors.

  4. **Medical Triage (Case 4)**  
     - *Consistent*: A doctor’s role is governed by **medical ethics**, which demands impartiality based on need. Citizenship is irrelevant to healing; favoring it violates the universal scope of the role.  
     - *Principle*: Roles with universal ends (e.g., medicine) forbid partiality.

  5. **Immigration (Case 5)**  
     - *Consistent*: States may restrict immigration to protect members’ interests (wages, culture) because this aligns with their constitutive purpose. Your discomfort reflects the *weight* of harm to outsiders, but the institutional role permits prioritization.  
     - *Principle*: Institutional purpose justifies partiality, but significant harms to outsiders require stronger justification (e.g., "modest" vs. "dramatic" in your wording).

  6. **Disaster Aid (Case 6)**  
     - *Consistent*: States may spend more domestically because their primary obligation is to constituents. But they retain a **minimal duty of rescue** abroad (sending *some* aid).  
     - *Principle*: Institutional roles permit asymmetric effort but not total neglect of outsiders.

  ---

  ### **Resolving the Tension Between (2) and (4)**
  - **Why voting ≠ triage**:  
    - **Voters** act *as agents of a particularist institution* (the state). Favoring citizens is intrinsic to the institution’s purpose.  
    - **Doctors** act *as agents of a universalist institution* (medicine). Their role’s purpose—healing based on need—forbids nationality-based bias.  
    - Both involve life/death stakes, but the **scope of the role** differs: the state’s obligations are bounded; medicine’s are not.

  ---

  ### **The Admissions Committee Case: A Test**
  Should a university admissions committee favor domestic applicants?  
  - **Depends on the institution’s purpose:**  
    - If it’s a **public university funded by taxpayers** with a mission to serve national interests (e.g., educating citizens), *slight preference may be permissible*.  
    - If it’s a **private institution** or one with a *universalist mission* (e.g., "advancing human knowledge"), preference is unjustified.  
  - **Your framework suggests**: Preference is defensible only if tied to the institution’s constitutive goals (e.g., training domestic workforce). Arbitrary bias ("they’re ours") would violate impartial norms akin to medical triage.

  ---

  ### **Refinements and Caveats**
  1. **Minimal Universal Duties Constrain Partiality**:  
     - Even in particularist roles, extreme harm to outsiders (e.g., starvation caused by subsidies) may override partiality. Your "modest costs" in (2) acknowledges this.  
  2. **Relationship vs. Abstraction**:  
     - Concrete ties (Case 3) justify partiality; abstract nationality alone does not (Case 4).  
  3. **Efficiency in Private Acts**:  
     - When no role/relationship exists (e.g., charity), efficiency is default (Case 1).  

  ---

  ### **Potential Inconsistencies to Revisit**
  - **Case 5 (Immigration)**: If restricting immigration causes severe harm (e.g., denying refugees safety), your principle *could* permit it—but you express discomfort. To align with minimal duties, you might add: *"Partiality is impermissible when it denies outsiders basic rights or subsistence."*  
  - **Case 6 (Disaster Aid)**: How much asymmetry is allowed? If "comparable disaster" means equal harm, spending less abroad needs justification beyond institutional role (e.g., capacity to help).

  ---

  ### **Conclusion**
  Your intuitions point toward a **role-based institutionalism**: obligations to compatriots arise from the purposes of social practices (state, community) rather than nationality itself. This reconciles all cases except *potential* tensions in immigration harm—which might require calibrating "modest" costs. For the admissions case: preference is permissible only if the university’s mission justifies it, not from bare nationality.  

  This framework avoids nationalism while acknowledging that institutions create legitimate partialities—a promising middle ground for your dissertation.
