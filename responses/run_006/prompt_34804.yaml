  Based on the six cases, Lena's decisions consistently follow a core principle of **ignoring sunk costs** and focusing on **future costs, benefits, and strategic context**. However, her approach incorporates nuanced exceptions for **psychological regret** and **strategic interactions**. Below, I distill the rules, apply them to the entrepreneur case, design a test case to distinguish competing rules, and identify where my reasoning is most vulnerable.

  ### The Core Rules Fitting All Six Cases
  Lena uses two primary rules, with a third auxiliary rule for edge cases:
  1. **Ignore sunk costs**: Past investments (money, time, effort) are irrelevant to future decisions. Only future costs and benefits matter.
  2. **Evaluate future net value**: 
     - **Non-strategic contexts**: Continue only if the *expected future net benefit* (future benefits minus future costs) is positive. Include psychological factors (e.g., regret) as material benefits/costs.
     - **Strategic contexts (game theory)**: Continue if the *expected future net benefit* accounts for the opponent's behavior (e.g., attrition, forcing concessions). Escalate only if you have a credible advantage (e.g., deeper pockets) that makes forcing the opponent to fold likely.
  3. **Proximity-completion heuristic**: In non-strategic, all-or-nothing endeavors (e.g., degrees, certifications), if the project is near completion (e.g., >90%) and the cost to finish is low relative to the total effort, psychological regret from quitting may tip the balance toward continuing—even if the *monetary* future net benefit is marginal or negative.

  ### How the Rules Explain Lena's Verdicts
  | Case                  | Lena's Verdict | Rule Application                                                                                                |
  |-----------------------|----------------|-----------------------------------------------------------------------------------------------------------------|
  | Dollar auction        | Bid again      | Strategic context: Continuing may force opponent to fold, turning a guaranteed loss into a smaller loss. Sunk costs ignored. |
  | Pharma company        | Kill project   | Non-strategic: $80M sunk. Future cost ($20M) > expected future benefit (10% chance of approval).                |
  | Concert ticket        | Stay home      | Non-strategic: $200 sunk. Future cost (misery) > future benefit (no monetary gain, negative experience).        |
  | Price war             | Keep going     | Strategic context: Stronger firm can outlast opponent. Sunk costs ignored; future benefit hinges on attrition.  |
  | PhD student           | Finish         | Non-strategic, but proximity heuristic: 90% done, low future cost (one semester). High regret from quitting justifies continuing despite misery/weak job market. |
  | Subway line           | Stop           | Non-strategic: $3B sunk. Future cost ($500M) > future benefit (low ridership). No psychological factor cited.   |

  **Why this fits**:
  - **Strategic vs. non-strategic**: Dollar auction and price war involve opponents whose actions can be influenced, justifying escalation. Pharma, concert, and subway lack opponents, so only future net value matters.
  - **PhD exception**: Proximity (90% done) and low marginal cost activate the regret heuristic. Quitting wastes 7 years of effort with no credential, making regret a significant psychological cost.
  - **Subway vs. PhD contrast**: Subway has high future costs ($500M) and no psychological benefit cited, while PhD has low future costs and high regret avoidance.

  ### Application to the Solo Entrepreneur Case
  - **Context**: Spent 3 years/$200K (sunk), 80% done. Needs 6 months/$50K more. Competitor launched a superior product. Expected earnings: $20K. No strategic interaction (competitor won't fold), no investors, only self-regret.
  - **Analysis**:
    - **Sunk costs**: Ignore the 3 years/$200K.
    - **Future costs**: $50K + opportunity cost of 6 months.
    - **Future benefits**: $20K earnings (low probability due to competitor).
    - **Psychological factor**: Regret from quitting, but only 80% proximity (less compelling than PhD's 90%) and high future cost ($50K) weaken this. No "all-or-nothing" credential at stake.
    - **Strategic context**: None (competitor is entrenched; no attrition dynamic).
  - **Verdict**: **Walk away**. Future net benefit is negative ($20K - $50K = -$30K + time cost). Regret is insufficient to offset this, given the 80% proximity and competitor's advantage.

  ### Test Case to Distinguish Competing Rules
  **Scenario**: A marathon runner has trained for 4 years for the Olympics, suffering chronic injuries. They qualify for the final trial with a 5% chance of making the team. Getting to the trial costs $10K (travel, fees). If they make the team, they gain $500K in endorsements, but injuries may worsen. No opponents to outlast.

  - **Competing rules**:
    - **Rule A (strict future net value)**: Future cost ($10K + health risk) > expected future benefit (5% × $500K = $25K). **Verdict: Quit**.
    - **Rule B (proximity-regret heuristic)**: Proximity to lifelong goal (final trial) and high regret from quitting may justify continuing, despite low odds. **Verdict: Continue**.

  **Why this works**:
  - Isolates the role of psychological regret in non-strategic, high-proximity scenarios. Rule A ignores regret; Rule B treats it as a decisive benefit.
  - Lena's verdict would clarify if regret can override negative expected value (Rule B) or if only cold calculus matters (Rule A).

  ### Weakest Link: Evidence That Could Change My Mind
  My reasoning is shakiest on **how Lena quantifies psychological regret** and its interaction with proximity. Evidence that would change my mind:
  1. **Entrepreneur case**: If Lena says "finish" due to overwhelming regret (e.g., "3 years wasted will haunt you"), my model underestimates regret's weight. This would strengthen Rule 3 (proximity-completion heuristic) for sub-90% cases.
  2. **Pharma edge case**: If Lena reversed her verdict for a "90%-complete drug" with identical costs/benefits, my proximity heuristic (Rule 3) would be invalid. This would force pure future-net-value rule (Rule 2).
  3. **New evidence**: If Lena cites "pride" or "legacy" in the subway case (e.g., "the city's reputation is at stake"), my assumption that psychological factors are reserved for personal endeavors (like PhDs) is wrong. This would expand Rule 3 to public projects.

  ### Summary
  - **Rules**: Ignore sunk costs; continue only if future net benefit is positive (including psychological factors); escalate strategically if opponents can be forced out.
  - **Entrepreneur**: Walk away (future costs > benefits; regret insufficient).
  - **Test case**: Olympic runner trial (distinguishes cold calculus vs. regret-driven escalation).
  - **Achilles' heel**: Quantifying regret. Real-world examples of Lena prioritizing/ignoring regret in marginal cases would reframe the model.
