  ... (similarly for C, D, E)

  Real-Play Choice R: Which do you choose? (This will be implemented for real)
     [ ] Option 1: $1 for sure.
     [ ] Option 2: 2% chance (1 in 50) of $60, 98% chance of $0.
  ```

  This design should achieve the goal of making students feel the pull of expected value fanaticism and then the intuitive resistance to it.
answer: |-
  Below is a comprehensive activity designed to make students viscerally experience expected value (EV) fanaticism before formally naming it. I'll start with brainstorming alternatives, then detail the chosen approach, including sequence, real-play mechanics, debrief, pitfalls, and limitations.

  ---

  ### **Brainstormed Approaches**
  1. **Pascal's Mugging Progression**  
     Series of choices where a "mugger" offers increasingly improbable cosmic payoffs for small payments. *Rejected*: Too abstract; lacks concrete tradeoffs.

  2. **St. Petersburg Paradox Variant**  
     Classic paradox scaled to real stakes (e.g., pay $1 for increasing EV lotteries). *Rejected*: Focuses on infinite EV, not fanaticism’s core tension.

  3. **Charity-Donation Dilemma**  
     Choose between guaranteed aid ($X to a local cause) vs. tiny chances of massive impact (e.g., 1/1M chance to save 1M lives). *Rejected*: Emotional stakes overshadow probabilistic reasoning.

  4. **Escalating Probability/Stakes Ladder**  
     **Chosen approach**. Fixed sure-thing value paired with lotteries where probability decreases and payoff increases exponentially. EV always favors the lottery, forcing students to confront discomfort. *Why*: Balances mathematical clarity with psychological tension; real cash enhances engagement.

  ---

  ### **Final Activity Design**
  **Title:** *The EV Gauntlet*  
  **Duration:** 75 minutes  
  **Key Pedagogical Goal:** Experience cognitive dissonance when EV maximization demands absurd sacrifices for tiny probabilities.  
  **Real-Play Stakes:** Small cash payouts (budget: ~$50 total).  

  #### **Step 1: Setup (5 mins)**
  - **Materials:** Handout with 5 lottery choices, random number generator (RNG), cash ($1s/$5s/$20s), envelopes.  
  - **Instructions:**  
    > *"You’ll make 5 choices between two options: a guaranteed amount or a lottery. One choice will be randomly selected and played for real money. You keep what you earn."*  
  - **Anonymity:** Students submit choices anonymously (use ID numbers) to reduce peer pressure.

  ---

  #### **Step 2: Lottery Sequence (25 mins)**  
  Students complete a handout with escalating choices (Table 1). **Key design:** The sure-thing value is constant ($5), while the lottery’s probability **decreases** and payoff **increases** exponentially. EV always favors the lottery.  

  **Table 1: Lottery Choices**  
  | Choice | Option A (Sure Thing) | Option B (Lottery)                     | Lottery EV | EV Ratio (B:A) |  
  |--------|------------------------|----------------------------------------|------------|----------------|  
  | 1      | $5                     | 50% chance of $11                     | $5.50      | 1.1x           |  
  | 2      | $5                     | 10% chance of $60                     | $6.00      | 1.2x           |  
  | 3      | $5                     | 1% chance of $600                     | $6.00      | 1.2x           |  
  | 4      | $5                     | 0.01% chance of $100,000              | $10.00     | 2.0x           |  
  | 5      | $5                     | 1 in 10M chance of $10 billion        | $1,000     | 200x           |  

  **Notes:**  
  - Choices 1–3 use **plausible probabilities** (50% → 1%) to build intuition.  
  - Choices 4–5 use **extreme payoffs/tiny probabilities** (0.01% → 1 in 10M) to induce discomfort.  
  - **EV always > $5** to force fanaticism’s dilemma: *Must you accept absurd risks if EV is higher?*

  ---

  #### **Step 3: Real-Play Mechanism (15 mins)**  
  - **Selection:** Use an RNG to pick 1 of 5 choices (e.g., roll a die; re-roll on 6).  
  - **Implementation:**  
    - For the selected choice, students get their chosen option:  
      - **Option A (Sure Thing):** Immediate cash.  
      - **Option B (Lottery):** Play the lottery for real.  
  - **Payoff Examples:**  
    - If Choice 2 is selected: Lottery = 10% chance of $60. Use RNG (1–100); win on 1–10.  
    - If Choice 4 is selected: Lottery = 0.01% chance of $100,000. **Scaled down to feasible stakes:**  
      > *"0.01% chance = 1 in 10,000. We’ll simulate with a 1 in 100 RNG roll (1–100). Win only on ‘100’. Prize: $100 (not $100K)."*  
      *(This preserves probability while avoiding budget insanity.)*  
  - **Budget Control:** Max exposure: $100 (if Choice 4/5 hits). Use university petty cash.  

  ---

  #### **Step 4: Payoff Scheme**  
  - **Cost Estimate:**  
    - 15 students; assume 50% pick lotteries. Expected cost:  
      - Choices 1–3: ~$15 (low stakes).  
      - Choices 4–5: ~$30 (scaled high stakes).  
    - **Total:** ≤$50.  
  - **Payout Rules:**  
    - Winners paid immediately in cash.  
    - Debrief *after* payouts to avoid bias.

  ---

  #### **Step 5: Debrief (25 mins)**  
  **Guided Discussion:**  
  1. **Poll Choices:** *"Who picked the lottery in Choice 3? Choice 4? Choice 5? Why?"*  
  2. **Cognitive Dissonance:** Highlight declining lottery picks as probability shrinks despite rising EV.  
  3. **Introduce Fanaticism:**  
     > *"EV maximization says you must always choose Option B—even in Choice 5. This is expected value fanaticism: any probability >0 of a high-enough payoff demands infinite sacrifice.*  
     *But your intuition likely rebelled. Why? Because tiny probabilities feel unreal or morally irrelevant."*  
  4. **Formal Structure:** Map to fanaticism’s equation:  
     - EV(Lottery) = *p* × *U*, where *U* → ∞ as *p* → 0⁺.  
     - But humans use *psychological discounting* (e.g., *p* < 0.01% ≈ 0).  
  5. **Ethical Tension:**  
     - *"Would you donate your life savings if it had a 1 in 10B chance to prevent human extinction? EV says yes. Your gut says no. This is fanaticism’s crisis."*  

  ---

  #### **Predictable Pitfalls (1st Run)**  
  1. **Time Crunch:** Real-play RNG rolls take longer than expected. **Fix:** Pre-load RNG app; limit to 2 minutes.  
  2. **Aversion to Tiny Probabilities:** Students skip lotteries early (Choice 3+). **Fix:** Emphasize anonymity to reduce fear of "looking greedy."  
  3. **Budget Anxiety:** Fear of high payouts in Choice 4/5. **Fix:** Clarify scaling rules upfront (e.g., *"Prizes capped at $100"*).  
  4. **Misunderstanding Probabilities:** Students think 0.01% = "impossible." **Fix:** Use frequency framing (e.g., *"1 in 10,000 people win"*).  

  ---

  #### **Limitations & Post-Activity Discussion**  
  **What the Activity Can’t Capture:**  
  - **Infinite Stakes:** Real cash can’t replicate fanaticism’s demand for *unbounded* sacrifices (e.g., *"Risk extinction for 1/∞ chance of utopia"*).  
  - **Moral Weight:** Students may dismiss tiny probabilities as "0" due to psychological numbing, not ethical principle.  

  **Post-Activity Fix:** Lecture + readings on:  
  1. **Archimedean Principle:** If *U* is unbounded, no probability is too small to ignore.  
  2. **Non-Archimedean Responses:**  
     - Lexical thresholds (e.g., *p* < *ε* ≈ 0).  
     - Capped utility functions (e.g., *U* ≤ *k*).  
     - **Key Quote:** *"Fanaticism forces us to choose between EV maximization and bounded rationality."*  

  ---

  ### **Critical Weakness & Redesign Trigger**  
  - **Weakness:** Real-play scaling (e.g., $100K → $100) may dilute the "astronomical stakes" intuition. Students think, *"It’s just $100, not $100K."*  
  - **Redesign Trigger:** If pilot data shows weak engagement in Choices 4–5, replace cash with **moral stakes**:  
    > *"Option B: 0.01% chance to donate $100,000 to a charity you hate. If you win, I’ll publicly post why you chose this."*  
    This heightens emotional salience but risks derailing the EV focus. Use only if core lesson falters.  

  ---

  ### **In-Class Handout Template**  
  ```markdown
  # The EV Gauntlet  
  Choose A or B for each. One will be played for real cash.  

  1. 🔵 A: $5 guaranteed  
     🔴 B: 50% chance of $11  

  2. 🔵 A: $5 guaranteed  
     🔴 B: 10% chance of $60  

  3. 🔵 A: $5 guaranteed  
     🔴 B: 1% chance of $600  

  4. 🔵 A: $5 guaranteed  
     🔴 B: 0.01% chance of $100,000 (scaled to $100 if played)  

  5. 🔵 A: $5 guaranteed  
     🔴 B: 1 in 10 million chance of $10 billion (scaled to $100 if played)  

  ID: _____  
  ```  

  This design balances psychological immersion with pedagogical clarity, setting up a rich debate on whether rationality can demand the absurd.
