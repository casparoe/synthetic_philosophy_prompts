  4. **Real-Play Choice Might Not Feel Extreme Enough**: The probability in R (2%) is not tiny, so it might not fully capture the fanaticism. We'll have to emphasize in the debrief that in the hypothetical, the probabilities were much smaller.
  5. **Confusion in Hypothetical Choices**: Students might not understand that the lotteries are independent of each other. Clarify that each choice is separate.

