  - **Truly Tiny Probabilities**: We cannot feasibly run a lottery with a one-in-a-million chance in class. So we cannot make them experience the absurdity of such a small probability. We have to rely on the hypothetical choices and discussion to convey that. In the debrief, we should stress that fanaticism becomes most controversial when the probabilities are astronomically small.

