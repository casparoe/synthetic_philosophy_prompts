  I'm teaching an upper-level undergrad seminar on decision theory and ethics — about 15 students, one 75-minute session. We're coming up on expected value fanaticism, and I want them to *feel* the pull before we name it. I don't want to lead with "here's this weird thing that happens to EV maximization." I want them to walk into it.

  Design an in-class activity where they make a series of choices between lotteries, and the structure of the choices gradually forces them to confront the fact that expected value reasoning can demand what feels like insane sacrifices for astronomically tiny probabilities. The key is that one of the choices they make (or maybe more than one, chosen at random) should actually be played out for real stakes — small amounts of actual cash, like a few dollars — so the decisions feel real in the moment. I'll bring the cash.

  Here's what I need: the full sequence of lotteries, in order; what the stakes are at each step; how the "real play" mechanism works (which choice gets implemented, how that's determined); a payoff scheme; the debrief that maps what happened in the activity onto the formal structure of fanaticism; an honest note on what predictably goes wrong the first time I run it; and a frank discussion of which feature of expected value fanaticism the activity can't reproduce and I'll have to supply in discussion afterward.

  Also, I'd like your response to flag: which step in your reasoning about the activity design is most likely to fail, and what consideration would lead you to redesign it differently. Like, what would change your mind about how to structure this.

  One more thing: I'm not a professional philosopher of probability or anything, but I know the basics. So don't dumb it down, but also don't assume I can rattle off the difference between a Borel set and a measurable function. Somewhere in between.

  Oh, and please start by brainstorming a few different approaches before settling on one — even just a sentence or two each — so I can see what you considered and why you went with what you did. And think through the whole thing step by step, like you're actually a seasoned philosophy teacher who's run a bunch of these and knows where the wheels come off.
