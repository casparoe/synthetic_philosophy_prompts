  We are designing an in-class activity to introduce expected value fanaticism through a sequence of lottery choices. The goal is to have students experience the tension between EV reasoning and intuitive judgments when faced with tiny probabilities of enormous payoffs. We'll use real monetary stakes for at least one randomly selected choice to make it feel real.

  ## Brainstorming Approaches

  1. **The St. Petersburg Progression**: Start with a standard St. Petersburg lottery (payoff = 2^k with probability 1/2^k) and then scale up the stakes and probabilities to force extreme trade-offs. 
     - *Why not?* The St. Petersburg lottery has infinite EV, which might be too abstract and not directly relatable to small probabilities of huge gains. Also, the infinite EV case is a special instance of fanaticism, but we want a more general setup.

  2. **The Pascal's Wager Analogue**: Present a series of choices between a sure thing and a lottery with a tiny probability of an astronomically large payoff (like saving billions of lives with a minuscule chance). 
     - *Why not?* It might be too directly analogous to religious arguments, which could distract from the formal point. Also, we want to use real money, and we can't realistically offer astronomical payoffs.

  3. **The Loss Aversion Route**: Present choices between sure losses and lotteries with tiny chances of avoiding catastrophic losses (like in insurance or climate change). 
     - *Why not?* While loss aversion is a related behavioral phenomenon, we are focusing on gains to keep it simpler and to match the classic fanaticism examples.

  4. **The Scaling Tiny Probabilities**: A sequence of choices that gradually reduces the probability of a large payoff while increasing the payoff so that the expected value remains constant (or increases) but the probability becomes vanishingly small. Students choose between this lottery and a sure thing. The sure thing starts small and grows, but the lottery's EV grows even faster due to the huge payoff.
     - *Why choose this?* It directly confronts the trade-off: at what point does a tiny chance of a huge payoff become too absurd to take over a modest sure thing? This is the core of fanaticism.

  We'll go with approach 4 because it builds the tension step by step and can be implemented with real money for one step.

