  - Introduce the term "expected value fanaticism": the view that we should always choose the option with the highest expected value, no matter how small the probability or how large the stakes.
  - Discuss the real-play choice: even though the lottery had a higher EV ($1.20 vs $1), some might have chosen the sure thing because 1 in 50 felt too risky. But note: the probability was only 2% and we could actually run it. In choice E, the probability was 1 in 10 million, which is unimaginably small.
  - Highlight the tension: EV maximization seems to demand that we accept any positive probability of a sufficiently large gain, no matter how small, as long as the EV is higher. But our intuition balks when the probability becomes too small.
  - Discuss implications: in ethics, this might apply to actions with tiny chances of preventing enormous catastrophes (like asteroid impacts) or to Pascal's Wager.

