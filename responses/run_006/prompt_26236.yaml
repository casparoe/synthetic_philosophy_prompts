  1. **Time Management**: The real-play draws might take longer than expected. Using a computer RNG can speed it up.
  2. **Budget Variability**: We might have more lottery winners than expected. Set a maximum budget (say, $100) and hope for the best. We might have to cap the number of wins? But that would break the probability. Better to set the probability low enough that multiple wins are very unlikely (with 15 students and p=1/50, the probability of two or more wins is about 1 - (49/50)^15 - 15*(1/50)*(49/50)^14 ≈ 0.025, or 2.5%, so very low).
