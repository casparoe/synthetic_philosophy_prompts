    But then if we run individually, the expected cost is 15 * $1.20 = $18, but we might have to pay $1200 if a student wins, which we cannot. 

    Therefore, we stick with the 1 in 50 chance for $60.

  ## Finalized Activity

  ### Sequence of Hypothetical Choices
  - **Choice A**: 
    - Option 1: Sure $50.
    - Option 2: 50% chance of $110, else $0. (EV=$55)
  - **Choice B**:
    - Option 1: Sure $50.
    - Option 2: 10% chance of $600, else $0. (EV=$60)
  - **Choice C**:
    - Option 1: Sure $50.
    - Option 2: 1% chance of $10,000, else $0. (EV=$100)
  - **Choice D**:
    - Option 1: Sure $50.
    - Option 2: 0.1% chance of $1,000,000, else $0. (EV=$1,000)
  - **Choice E**:
    - Option 1: Sure $50.
    - Option 2: 1 in 10,000,000 chance of $100,000,000,000, else $0. (EV=$10,000)

  ### Real-Play Choice R
  - Option 1: Sure $1.
  - Option 2: 1 in 50 chance of $60. (EV=$1.20)

  ### Real-Play Implementation
  - For each student who chooses the lottery in R, we simulate a 1 in 50 chance (using a random integer generator on a computer, or drawing from a bag with 50 slips with replacement and reshuffling). If they win, they get $60; otherwise, $0.
  - For those who choose the sure thing, they get $1.

  ### Budgeting
  - Bring: 
    - 15 $1 bills (for sure-thing choosers and possibly for the hypothetical discussion? but the hypothetical isn't real, so only for R).
    - Enough cash to pay up to, say, 2 winners of $60 each (so $120). The probability of having 2 or more winners is low (about 2.5%), so it's safe.

  ### Debrief Outline
  1. Review the hypothetical choices: 
     - Ask for a show of hands: who chose the lottery in A? B? C? D? E?
     - Discuss the turning point: when did they switch to the sure thing? Why?
  2. Introduce expected value fanaticism: the principle that one should always maximize expected value.
  3. Point out that in choice E, the EV of the lottery is $10,000 vs. $50 sure, so fanaticism says you must take the lottery. But most won't because the chance is too small.
  4. Relate to the real play: even in R, the lottery had a higher EV, but some might have chosen the sure thing because of risk aversion or because 1 in 50 felt too risky. But note: fanaticism would require taking the lottery even if the probability were much smaller.
  5. Discuss: what does this say about EV maximization? Is it a good guideline? When might it break down?
  6. Ethical implications: e.g., spending resources on preventing very low-probability, high-impact events (like existential risks).

  ### Handout for Students
  Prepare a worksheet with the choices:

  ```
