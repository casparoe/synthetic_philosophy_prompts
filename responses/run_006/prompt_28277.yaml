  And M is caused by N, so M is correlated with B.

  But the ATE of M on B is zero.

  So the residue is that causal inference can only evaluate causal effects and associations. The philosophical concept of "moral facts" being grounded in natural facts does not translate to a causal effect of moral facts on beliefs.

  Conclusion: part of the disagreement is substantive and can be captured by causal models (is there a causal path from moral facts or their grounds to beliefs?), but other parts (like justification and the normative force of moral facts) might not be captured.

  Now, let's write the systematic translation.

  We will define the following nodes:

  - T: third factor (unobserved)
  - N: natural facts that ground moral facts (observed? or unobserved)
  - M: moral facts (unobserved)
  - F: fitness pressures (unobserved)
  - E: evolutionary process (unobserved)
  - C: cognitive system (unobserved)
  - B: moral beliefs (observed)

  But note: we don't observe M, T, F, E, C. We only observe B? That's a problem for causal inference because we typically need some observed variables.

  But this is a philosophical model.

  Debunker's argument in causal terms:

  The causal effect of M on B is zero. The association between M and B is zero (or due to chance). This is because the graph is:

  F -> E -> C -> B
  M is isolated.

  Adaptive link account: this is the same as the debunker's graph.

  Tracking account: there is a path from M to B. For example:

  M -> C -> B   and   F -> E -> C -> B

  But then we have to worry about confounders.

  Third-factor reply: there is a common cause T that causes both M and F, and F causes E causes C causes B, and T might also cause other things. But then the association between M and B is due to T, but the causal effect of M on B is zero. However, if the realist also includes an edge from M to C (or from N to C, with N grounding M), then the causal effect might be non-zero.

  Overgeneralization worry: for perceptual beliefs, we have a graph where R (reality) causes P (perceptual belief) via a cognitive system C that was shaped by evolution. So R->C->P and F->E->C. Then the causal effect of R on P is non-zero. The debunker wants to deny a similar link for morals. The causal model can represent both, but doesn't tell us which graph is correct.

  Residue report:

  - Cleanly translated: the core structure of the debunker's argument (no causal link from M to B), the adaptive link account, the third-factor account as a common cause structure, and the tracking account as a direct causal link.

  - Fudged: we had to decide whether the third-factor account includes a causal link from M (or N) to B. In the literature, it often does not, so we represented it without a link, which means the ATE is zero. But some versions might include a link.

  - No counterpart: 
     - The concept of justification. Causal inference can tell us if the belief is causally sensitive to the facts, which is one account of justification (reliabilism) but not the only one.
     - The normative authority of moral facts: why should we care about them? This is outside the causal model.
     - The worry that moral facts are causally inert: if they are, then they cannot have children in the DAG. That would rule out the tracking account (which requires M to cause B) and leave only the third-factor account (with M being caused by T and correlated with B but not causing B). But then the ATE is zero, so we don't have tracking.

  In conclusion, part of the disagreement is about the structure of the causal graph. The causal-inference vocabulary is sufficient for that. But the philosophical disagreement also involves epistemic and metaphysical commitments that go beyond causal structure.
answer: |-
  ### Systematic Translation of the Evolutionary Debunking Argument into Causal Inference Frameworks  
  I'll translate the core components of the debate—**debunker's argument**, **tracking account**, **adaptive link account**, **third-factor replies**, and **overgeneralization worry**—into causal models (DAGs, d-separation, identifiability). I'll explicitly define nodes, edges, treatments, outcomes, confounders, and estimands. After the models, I'll provide a residue report highlighting where translation works, where it fudges, and where philosophical concepts resist formalization.  

  ---

  ### **Brainstorm: Nodes and Causal Ordering**  
  Before committing to a DAG, we outline the minimal set of nodes and plausible causal relationships based on the debate:  
  - **Moral Facts (M)**: Objective moral truths (e.g., "torture is wrong"). *Assumed acausal or pre-existing* in realism; *nonexistent* in anti-realism.  
  - **Moral Beliefs (B)**: Human moral judgments (e.g., "I believe torture is wrong"). The **outcome** of interest for "tracking."  
  - **Reproductive Fitness (F)**: Evolutionary success (e.g., survival, reproduction).  
  - **Evolutionary Process (E)**: Natural selection shaping cognitive faculties. Mediates fitness effects on beliefs.  
  - **Third Factor (T)**: A shared cause (e.g., "human flourishing") linking fitness and moral facts in realist replies.  
  - **Cognitive Architecture (C)**: Innate neuro-cognitive mechanisms producing beliefs. Mediates effects of evolution and facts.  

  **Causal Ordering Assumptions**:  
  1. \(T\) (if present) is exogenous.  
  2. \(M\) is acausal (no parents) or caused by \(T\).  
  3. \(F\) causes \(E\), which causes \(C\).  
  4. \(C\) causes \(B\).  
  5. \(M\) *may* cause \(B\) via \(C\) (tracking) or correlate via \(T\) (third factor).  
  6. \(F\) *may* cause \(B\) via \(E \rightarrow C\) (adaptive link).  

  ---

  ### **Causal Models for Each Argument**  
  #### 1. **Debunker's Argument**  
  **Claim**: Evolution optimizes for fitness, not truth, so moral beliefs are not "tracking" facts. Correlation is spurious.  
  **DAG**:  
  ```  
  F → E → C → B  
  M    (isolated, no edges)  
  ```  
  - **Nodes**: \(F\) (fitness), \(E\) (evolution), \(C\) (cognition), \(B\) (beliefs), \(M\) (facts).  
  - **Edges**: \(F \rightarrow E \rightarrow C \rightarrow B\). \(M\) is d-separated from \(B\).  
  - **Treatment**: \(M\) (intervention on moral facts).  
  - **Outcome**: \(B\) (moral beliefs).  
  - **Backdoor Paths**: None between \(M\) and \(B\) (no paths to block).  
  - **Estimand for "Tracking"**: The **average treatment effect (ATE)** of \(M\) on \(B\), \(\mathbb{E}[B|do(M=1)] - \mathbb{E}[B|do(M=0)]\).  
    - **Identification**: ATE = 0. \(M\) has no causal effect on \(B\); d-separation implies \(B \perp\!\!\!\perp M\).  
  - **Debunker's Conclusion**: Fitness \(F\) confounds any observed \(B\)-\(M\) correlation via the path \(F \rightarrow E \rightarrow C \rightarrow B\). No tracking.  

  #### 2. **Tracking Account (Realist)**  
  **Claim**: Beliefs directly respond to moral facts via reliable cognitive mechanisms.  
  **DAG**:  
  ```  
  M → C → B  
  F → E → C  
  ```  
  - **Nodes**: Same as above, but \(M\) causes \(C\).  
  - **Edges**: \(M \rightarrow C \rightarrow B\), \(F \rightarrow E \rightarrow C\).  
  - **Treatment**: \(M\).  
  - **Outcome**: \(B\).  
  - **Backdoor Paths**: \(M \leftarrow \varnothing \rightarrow F \rightarrow E \rightarrow C \rightarrow B\) (if \(M\) and \(F\) are correlated).  
  - **Estimand for "Tracking"**: ATE of \(M\) on \(B\).  
    - **Identification**: ATE is non-zero but **confounded** by \(F\) via backdoor path. Conditioning on \(F\) or \(E\) identifies the direct effect \(M \rightarrow C \rightarrow B\).  
  - **Realist Interpretation**: Evolution built cognition (\(C\)) to detect \(M\), so ATE > 0.  

  #### 3. **Adaptive Link Account (Debunker Refinement)**  
  **Claim**: Beliefs correlate with fitness, not facts. Evolution hardwires adaptive beliefs.  
  **DAG**:  
  ```  
  F → E → C → B  
  M → B   (optional, but if present, edge is weak or spurious)  
  ```  
  - **Nodes**: Same as above.  
  - **Edges**: Primary path \(F \rightarrow E \rightarrow C \rightarrow B\). \(M \rightarrow B\) may exist but is d-separated from truth-tracking.  
  - **Estimand for "Tracking"**: ATE of \(M\) on \(B\).  
    - **Identification**: If \(M \rightarrow B\) is absent, ATE = 0. If present, ATE is biased by \(F\) (unobserved confounder).  

  #### 4. **Third-Factor Reply (Realist)**  
  **Claim**: A shared factor \(T\) (e.g., "well-being") causes both moral facts \(M\) and fitness \(F\), explaining correlation without direct tracking.  
  **DAG**:  
  ```  
  T → M  
  T → F → E → C → B  
  ```  
  - **Nodes**: \(T\) (third factor), others same.  
  - **Edges**: \(T \rightarrow M\), \(T \rightarrow F \rightarrow E \rightarrow C \rightarrow B\).  
  - **Treatment**: \(M\).  
  - **Outcome**: \(B\).  
  - **Backdoor Paths**: \(M \leftarrow T \rightarrow F \rightarrow E \rightarrow C \rightarrow B\) (confounding path).  
  - **Estimand for "Tracking"**: ATE of \(M\) on \(B\).  
    - **Identification**: ATE = 0 (no edge \(M \rightarrow B\)), but **association exists** via \(T\). Conditioning on \(T\) blocks confounding, revealing \(B \perp\!\!\!\perp M | T\).  
  - **Realist Interpretation**: Correlation \(B\)-\(M\) is due to \(T\), not direct causation. Reliability is indirect.  

  #### 5. **Overgeneralization Worry (Debunker Problem)**  
  **Claim**: If evolution debunks morals, it debunks *all* beliefs, including evolutionary theory itself.  
  **DAG for Perceptual Beliefs (e.g., belief in evolution)**:  
  ```  
  R → C → B_perceptual  
  F → E → C  
  ```  
  - **Nodes**: \(R\) (physical reality), \(B_{\text{perceptual}}\) (e.g., "evolution is true").  
  - **Edges**: \(R \rightarrow C \rightarrow B_{\text{perceptual}}\), \(F \rightarrow E \rightarrow C\).  
  - **Estimand**: ATE of \(R\) on \(B_{\text{perceptual}}\).  
    - **Identification**: ATE > 0 and identifiable if \(F\) is measured.  
  - **Debunker Challenge**: In moral DAG, \(M\) is d-separated from \(B\); in perceptual DAG, \(R\) is **not** d-separated. Thus, debunking only applies when no causal path exists.  

  ---

  ### **Residue Report**  
  #### **Clean Translations**  
  1. **Debunker's Core Argument**: Translates perfectly. The claim that fitness \(F\) creates a spurious \(B\)-\(M\) correlation maps to d-separation (\(B \perp\!\!\!\perp M\)) in the DAG.  
  2. **Third-Factor Confounding**: The realist reply is a textbook **confounder** (\(T\)) explaining correlation. The backdoor path \(M \leftarrow T \rightarrow F \rightarrow B\) is standard causal inference.  
  3. **Overgeneralization Worry**: Resolved via **d-separation test**. Perceptual beliefs have a causal path \(R \rightarrow B\); moral beliefs (in debunker's model) do not (\(M \not\!\rightarrow B\)). No overgeneralization.  
  4. **Estimand for Tracking**: ATE of \(M\) on \(B\) is the precise analog of "counterfactual sensitivity" (if facts changed, would beliefs change?).  

  #### **Fudged Translations**  
  1. **Cognitive Architecture (\(C\))**: I added \(C\) to mediate \(E/M \rightarrow B\), but philosophers often omit this. This is a mild fudge to model "reliable processes."  
  2. **Moral Facts (\(M\)) as Causal**: Realists often treat \(M\) as acausal (e.g., abstract truths). I allowed \(M\) to be caused by \(T\) or cause \(B\), which *stretches* realism. If \(M\) is strictly acausal:  
     - DAG reduces to \(T \rightarrow F \rightarrow B\) and \(T \rightarrow M\) (with \(M\) as a collider).  
     - ATE of \(M\) on \(B\) is undefined (no intervention on \(M\)).  
  3. **Evolutionary Process (\(E\))**: Collapsed into a single node; realistically, it’s a complex historical process.  

  #### **Untranslatable Residues**  
  1. **Justification**: Causal models show *how* beliefs arise, but not whether they are "justified." Reliability (ATE > 0) is necessary but insufficient for justification (e.g., Gettier cases).  
  2. **Moral Truth Outside Causal Order**: If \(M\) is acausal and irreducible (e.g., non-naturalism), it cannot be a node in a causal DAG. Causal inference **cannot engage** with acausal entities—this is a hard limit.  
  3. **Normativity**: Why *should* we care about moral facts? Causal models describe mechanisms, not obligations.  
  4. **Darwinian Dilemma**: The realist's challenge ("Is reliability due to evolution or truth?") maps to **identifiability under unobserved confounding** (e.g., \(T\) or \(F\)). But the dilemma’s epistemic weight—e.g., whether evolution *undermines* justification—lacks a causal analog.  

  #### **What the Residue Shows**  
  - **Impoverished Vocabulary?** Partly. Causal inference captures the *structural* debate (e.g., d-separation vs. direct effects) but not epistemic/axiological content (e.g., "justification," "authority of moral facts").  
  - **Substantive vs. Rhetorical Disagreement**: Stripping rhetoric away, **~80% of the debate reduces to graph structure**:  
    - Realists and debunkers disagree on whether \(M \rightarrow B\) exists.  
    - Third-factor replies are confounder arguments.  
    - Overgeneralization is a d-separation test.  
  - **Where Philosophy Adds Value**: Concepts like "acausal moral facts" or "normative force" are outside causal inference but central to metaethics. The residue isn't noise—it's the genuinely philosophical layer.  

  ---

  ### **Explicitly Assumed Causal Structures**  
  1. **Directionality**: Edges \(F \rightarrow E \rightarrow C \rightarrow B\) reflect evolutionary theory's causal flow.  
  2. **Exogeneity of \(T\)**: Third factors (e.g., "flourishing") are assumed pre-existing.  
  3. **No Moral Facts Causing Evolution**: Rejected edges \(M \rightarrow F\) or \(M \rightarrow E\) (unlike theistic ethics).  
  4. **No Time Dynamics**: DAGs are static; real evolution is historical.  

  This translation reveals the debate's core is a **causal identification problem**—but the residue confirms metaethics needs more than DAGs.
