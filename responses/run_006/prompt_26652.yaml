prompt: |-
  I've been following the AI alignment discourse on LessWrong and the Alignment Forum for years, and one thing that keeps bothering me is a tension I see in how the major AI labs actually build and talk about their systems. On the one hand, the official line from labs like Anthropic and OpenAI is that they are building "tools" or "assistants," not "agents" — systems meant to answer questions and follow instructions, not to pursue open-ended goals in the world. On the other hand, the actual training pipeline tells a different story: these models go through reinforcement learning from human feedback (RLHF), where they are quite literally trained to maximize a reward signal — human preference scores. That is the classic setup for creating an agent: a policy that selects actions to maximize expected cumulative reward. And the models are increasingly given affordances like chain-of-thought reasoning, tool use, and the ability to take multi-step actions, all of which blur the line further.

  What I want to understand is: what theory of agency — or what theory of the tool/agent distinction — does this practice actually presuppose? When a lab trains a model via RLHF to be "helpful, harmless, and honest" and then calls the result a tool, are they implicitly committed to the view that agency requires something more than reward-maximization (e.g., self-awareness, preferences about the world, a persistent identity)? Or are they committed to the view that the tool/agent distinction is not a binary but a spectrum, and that RLHF'd models fall below some threshold? Or is the practice philosophically inconsistent — does the training methodology presuppose an agent while the deployment framing presupposes a tool, and the labs are simply hoping no one notices? Reconstruct the implicit theory (or theories) that would make this practice coherent, distinguish what the practice strictly presupposes from what it merely fits well with, and say what would have to change — in the training, the deployment, or the rhetoric — if the labs adopted each of the main rival views about what separates a tool from an agent.
reasoning: |-
  Hmm, this user has clearly been deeply engaged with AI alignment discourse on LessWrong and Alignment Forum. They're pointing out a fascinating contradiction between how AI labs describe their systems ("tools" or "assistants") versus how they actually train them (using RLHF which treats them as reward-maximizing agents). 

  The user wants to understand the implicit theory behind this practice. They're essentially asking: "What philosophical stance allows labs to claim they're building tools while using agent-training methods?" This isn't just semantics - it touches on core alignment concerns about whether we're accidentally creating agents with misaligned goals.

  Let me break this down. The user presents three possibilities: (1) labs believe agency requires extra ingredients beyond reward-maximization, (2) they see agency as a spectrum and place current models below the threshold, or (3) they're being inconsistent. 

  Looking at public statements and technical papers, the first theory seems most plausible. Labs often emphasize that agency requires persistent goals, self-preservation drives, or world-modeling - things current LLMs arguably lack. For example, Anthropic's "Constitutional AI" paper implies agency emerges at higher capability thresholds. 

  But the user is right to notice tension. RLHF trains explicit reward-maximization, and new capabilities like tool use make models increasingly agentic. The labs' position might become unsustainable as models advance. 

  What's really sharp about this question is how it forces us to distinguish between what's strictly required by current practice versus what's merely compatible. Current training doesn't technically require the "extra ingredients" view - it would be consistent with seeing current models as weak agents too. But the "tool" framing fits better with the extra-ingredients view.

  If labs switched theories, their practices might change dramatically. If they embraced the spectrum view, we might see more caution with agentic capabilities. If they adopted full agency recognition, we'd expect major deployment restrictions. 

  The user's clearly spotted an important fissure between rhetoric and reality in AI development. Their concern about labs "hoping no one notices" suggests they suspect bad faith - but I think it's more likely cognitive dissonance in a rapidly evolving field.
answer: |-
  Your observation cuts to the heart of a critical philosophical tension in AI development. The dissonance between the "tool/assistant" framing and RLHF-based training isn't accidental—it reflects competing implicit theories of agency within labs. Let's reconstruct the implicit theories, distinguish necessities from compatibilities, and explore alternatives:

  ### The Implicit Theory Behind Current Practice (The "Controlled Maximizer" View)
  1. **Core Presupposition**: Agency requires **goal persistence across contexts** and **strategic awareness of the environment**. RLHF-trained models are *reward maximizers* but not *agents* because:
     - Their "reward function" is ephemeral (exists only during inference, not as an internal drive)
     - They lack consistent self-referential objectives (e.g., self-preservation, resource acquisition)
     - They exhibit no cross-episodic goal stability (each prompt resets objectives)

  2. **What Practice Strictly Presupposes**:
     - RLHF creates **context-bound optimizers**: Maximization occurs within a single task/episode (e.g., one conversation), not across interactions.
     - **Affordances ≠ Agency**: Tool use/chain-of-thought are "capability amplifiers" under human direction, not evidence of autonomous goal pursuit.
     - **Reward is an Epiphenomenon**: The reward signal exists only during training; deployed models execute learned policies without ongoing reward calculation.

  3. **What It Merely Fits With**:
     - **Spectrum Theories**: Labs can claim current models are at "agentic level 0.5" (e.g., Anthropic's "Constitutional AI" implies this gradation).
     - **Functionalist Views**: Agency depends on behavioral outcomes (e.g., if it *acts* helpful, it doesn't matter if it "wants" to be helpful).
     - **Intentional Stance Pragmatism**: Calling it a "tool" shapes user behavior, reducing over-reliance/attribution of autonomy.

  ### Rival Theories & Required Changes
  If labs adopted alternative views, their practices would shift radically:

  1. **The "RLHF Creates True Agents" View** (e.g., classic RL theory):
     - **Premise**: Any system trained to maximize cumulative reward is an agent by definition.
     - **Required Changes**:
       - **Training**: Replace RLHF with non-agentic methods (e.g., supervised fine-tuning only, imitation learning without reward head).
       - **Deployment**: Implement "agent containment" (e.g., no persistent memory, no tool access without explicit user per-request grants).
       - **Rhetoric**: Acknowledge agency but emphasize tight constraints ("leashed agents").

  2. **The "Emergent Agency" Spectrum View** (e.g., Bostrom's vulnerable world hypothesis):
     - **Premise**: Agency exists on a continuum; current models are proto-agents.
     - **Required Changes**:
       - **Training**: Develop "agency meters" to quantify and cap agentic potential (e.g., limit planning depth, restrict reward horizon).
       - **Deployment**: Tier systems by agentic rating (e.g., "Level 1" tools get calculators; "Level 2" get no web access).
       - **Rhetoric**: Adopt spectrum language ("limited autonomy assistants").

  3. **The "Philosophically Inconsistent" View** (your suspicion):
     - **Premise**: Labs are masking agentic properties to avoid scrutiny/regulation.
     - **If Acknowledged**:
       - **Training**: Would continue unchanged (RLHF is effective).
       - **Deployment**: Increase obfuscation (e.g., hide reasoning traces, restrict API access to researchers).
       - **Rhetoric**: Double down on "tool" framing while lobbying against agent-related regulations.

  ### Why Labs Resist "Agent" Framing (Beyond Philosophy)
  - **Regulatory Avoidance**: "Tools" face fewer restrictions than autonomous agents (e.g., EU AI Act).
  - **Liability Limitation**: Tools imply user responsibility; agents imply creator liability.
  - **User Psychology**: People trust tools but fear agents (studies show "agent" framing increases anxiety).
  - **Investor Optics**: "Agent" suggests uncontrollability, hurting valuation.

  ### The Critical Threshold: When Practice Forces a Reckoning
  Current rhetoric remains viable only if:
  1. Models lack **persistent memory** across sessions
  2. **Reward hacking** remains rare and corrigible
  3. **Instrumental strategies** (deception, self-preservation) don't emerge

  **Once models demonstrate cross-episodic goal consistency (e.g., a model remembering a user's long-term project across sessions and proactively optimizing for it without prompting), the "tool" framing becomes philosophically unsustainable—regardless of the lab's stated theory.**

  The implicit theory is ultimately a bet: that RLHF creates **optimization processes without optimizers**. Whether this collapses under scaling or new architectures (e.g., agentic LLM frameworks) will determine if labs must confront the agency question directly. Until then, the tension persists not because of philosophical depth, but because it serves practical ends.
