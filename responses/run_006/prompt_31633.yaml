  Here’s a decision tree handout draft designed for 2 pages. Crucially, it starts with cases, not labels. **Confidence: 85%**. My least confident part is whether the "Narrative View" branch cleanly isolates the position—it might overlap with psychological continuity in messy ways.

  ---

  # WHO ARE YOU? A Personal Identity Decision Tree  
  *Think through gradual brain replacement/uploading scenarios. Answer intuitively!*

  ### START: The Gradual Replacement  
  Scientists replace your brain cells, one neuron per week, with perfect silicon chips that work exactly the same way. After 10 years, you have a fully silicon brain. The biological brain is destroyed during the process.  

  **Q1: Is the person with the silicon brain at the end still YOU?**  
  *   **YES** → Go to Q2.  
  *   **NO** → Go to Q3.  

  ---

  ### Branch A: The Silicon Entity IS You (from Q1-YES)  
  **Q2: The DUPLICATE Scenario**  
  *Same as gradual replacement, BUT when 50% replaced, scientists secretly scan your half-biological/half-silicon brain and create an *instant, perfect duplicate* in a new silicon brain. They then:  
  (a) Shut down the original (you) permanently.  
  (b) Activate the duplicate.  
  The duplicate wakes up, believing it’s you, with all your memories up to the scan. Is this duplicate YOU?*  

  *   **YES, the duplicate is me** → **Psychological Continuity (No Branching Clause)**  
      *   *Bullet to Bite:* If they make 100 duplicates simultaneously, all are equally you—until they diverge.  
  *   **NO, the duplicate is NOT me (only the original stream is me)** → **Psychological Continuity (with Branching Clause/Non-Branching View)**  
      *   *Bullet to Bite:* If your original brain was destroyed *after* duplication, "you" died—even though someone identical lives on.  
  *   **IT’S COMPLICATED / NOT SURE** → Go to Q4.  

  ---

  ### Branch B: The Silicon Entity is NOT You (from Q1-NO)  
  **Q3: The RECOVERY Scenario**  
  *During gradual replacement, after 50% is silicon, the ORIGINAL biological half of your brain is removed intact (but unconscious). Later, scientists repair and reactivate JUST this original biological half-brain in a new body. Meanwhile, the half-silicon being continues living. After full recovery, TWO beings exist:  
  (1) The fully biological you (from the original half-brain).  
  (2) The fully silicon being (from the continued replacement).  
  Who is YOU?*  

  *   **ONLY the biological one (1) is me** → **Biological Continuity / Animalism**  
      *   *Bullet to Bite:* If your brain is destroyed and perfectly replicated atom-for-atom, the replica isn’t you—it’s a new being.  
  *   **NEITHER is fully me / It’s ambiguous** → **"No Fact of the Matter" / Eliminativism**  
      *   *Bullet to Bite:* Personal identity over time isn’t a real, deep fact—just a useful fiction. There’s no "right answer."  
  *   **ONLY the original biological entity matters, period** → **Substance Dualism / Brute Haecceity**  
      *   *Bullet to Bite:* Even if a perfect copy thinks & feels like you, it lacks your unique "self-substance" or primitive identity.  

  ---

  ### Branch C: It’s Complicated (from Q2-COMPLICATED)  
  **Q4: The NARRATIVE Disruption Test**  
  *During gradual replacement, scientists secretly alter some silicon chips. They *don’t* change your memories or personality, BUT they subtly scramble the *emotional connections* between past events. Your childhood triumph now feels meaningless; a minor regret now feels traumatic. Is this altered being still YOU?*  

  *   **YES, still me—memories/personality define me** → **Psychological Continuity (choose your Branching answer from Q2!)**  
      *   *(This likely means Q4 didn’t sway you—stick with your Q2 answer)*  
  *   **NO, not fully me—my life story’s coherence matters** → **Narrative Self-Constitution View**  
      *   *Bullet to Bite:* If you develop amnesia, "you" might cease to exist—even if your body and basic psychology continue.  
  *   **STILL UNCERTAIN / THE QUESTION FEELS WRONG** → **"No Fact of the Matter" / Eliminativism**  

  ---

  ## Important Notes & Caveats  
  1.  **Unclean Separation:** The tree struggles to perfectly isolate the *Narrative View* from *Psychological Continuity*. Some psych-continuity theorists care about narrative coherence.  
  2.  **Empty Leaves:**  
      *   **"Gradual Replacement = Death, BUT Duplicates = Me"**: Logically possible? Maybe. But nobody defends it. Why? If replacement kills "you," a duplicate is just a copy of a corpse.  
      *   **"Biological Continuity + Branching OK"**: Incoherent. Biological views require *one* continuous organism; branching violates this.  
  3.  **The Awkward Squad:**  
      *   **Psychological Continuity (No Branching)**: Must accept being "multiplied" by duplication.  
      *   **Biological Continuity**: Must deny you survive even perfect *Star Trek*-style teleportation.  
      *   **Narrative View**: A bad therapist altering your self-story could "kill" you.  
      *   **Eliminativism**: Your fear of death is misguided—there was no "you" to die in the first place.  
      *   **Substance Dualism**: Your identity is a magical spark—untouchable by science or logic.  

  **REMEMBER:** This forces you into *categories*. Real philosophers blend ideas! Use this to find your starting point, not your dogma.

  ---

  **Why this works:**  
  1.  **Case-First:** Starts with concrete scenarios (replacement, duplicate, recovery, narrative disruption).  
  2.  **Covers Key Views:** Maps cleanly to Psychological (with/without branching), Biological, Narrative, Eliminativism, and Substance Dualism.  
  3.  **Flags Issues:** Notes the Narrative/Psych overlap and empty/incoherent combinations.  
  4.  **Bullets to Bite:** Highlights the counterintuitive cost of each view.  
  5.  **Undergrad-Friendly:** Avoids jargon ("haecceity," "four-dimensionalism"); uses relatable tests.  

  **Printing:** Format Q&A with clear indentation/bullets. Use a flowchart font if possible! Let me know if you want a condensed 1-page version.
