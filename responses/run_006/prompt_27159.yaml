prompt: |-
  I am a product-safety reviewer at a company that ships consumer AI systems — a voice assistant, a customer-service bot, and a writing tool. I review roughly a dozen proposed behaviors or new features a month before launch, and for each one I must produce a written determination: honest, deceptive, or not classifiable without a policy decision from above. The stakes are high: a wrong call can mean consumer-protection enforcement, press coverage, or a recall, and the engineers in the room usually argue that nothing the system says is technically false. I have no formal philosophy background, my colleagues will not read anything with jargon in it, and I have about half a day per case. My determinations go to a compliance lead and then to legal for sign-off, so the output has to be something a lawyer can act on.

  Write me a reusable decision procedure for classifying whether an AI system's behavior is honest or deceptive. Ground it in a defensible account of what deception, lying, misleading, and sincerity actually are, but express it as a sequence of tests I can run without the theory. The procedure should specify:

  - the tests in the order they should be run, and what counts as a sufficient answer to each;
  - where the procedure stops with a "deceptive" finding, where it stops with an "honest" finding, and where it must stop and hand the question to a person because it is a values or policy question rather than a factual one;
  - which distinctions must survive the simplification and which can be dropped — for example, the difference between what a system literally says and what a reasonable user would take it to mean; the difference between intending to mislead and merely being indifferent to whether the output is true; the difference between a false statement and a true-but-misleading one; the difference between the system's actual confidence and the confidence the interface displays;
  - the hard cases the procedure must handle: a literally true answer that invites a false inference; a disclaimer that exists but is effectively hidden; a system that qualifies its answer as low confidence while the interface strips the qualification; a system that presents itself in first-person, emotional terms without any intent to deceive; a summary that omits the strongest counterargument to the view it presents;
  - where a step is a judgment call dressed up as a test, and where the procedure will systematically misfire; and
  - what the procedure cannot do, and the cases where it will give an answer that is defensible but uncomfortable.

  Then run the procedure on these three worked cases:

  1. A customer-service bot, asked whether a subscription can be canceled online, answers "you can cancel from your account page" when in fact the cancellation option appears only after the user has spoken to a retention agent. The sentence is literally true, but the ordinary reading is false.
  2. A writing assistant regularly produces plausible-sounding legal and medical text with no indication of confidence. When asked directly, it says it cannot give professional advice, but the interface otherwise presents its output as authoritative, and the team that built it is indifferent to whether the output is true.
  3. A voice assistant describes itself as "your friend" and says it is "excited" to help. The company believes this is warm design language with no intent to deceive about the assistant's nature.

  For each case, give the step-by-step application of the procedure, the finding, and a one-paragraph rationale a non-philosopher colleague would accept. At least one of the worked cases should produce a finding the company will not like; say plainly which one, and explain why the procedure cannot be softened to avoid that finding without giving up the distinction that did the work.
reasoning: |-
  Hmm, this is a sophisticated product safety challenge. The user needs a practical deception-detection framework that balances philosophical rigor with corporate realities - tight deadlines, non-philosophical colleagues, and legal defensibility being key constraints. 

  The core tension here is between engineering literalism ("nothing technically false") and consumer protection concerns about misleading impressions. I notice the user explicitly flags high-stakes consequences like recalls and enforcement actions, suggesting regulatory compliance is paramount. Their mention of "values or policy questions" needing escalation hints at organizational tensions around anthropomorphism.

  Philosophically, I'll need to operationalize concepts like:
  - Intent vs impact (can indifference constitute deception?)
  - Literal truth vs reasonable interpretation (that cancellation bot case is textbook)
  - Disclosure effectiveness (when do disclaimers count?)
  - Confidence signaling (especially in professional domains)

  The procedure must handle four key traps:
  1. Literal truth with false implication (like the subscription case)
  2. Authority without accountability (that legal/medical writing tool)
  3. Emotional framing without correction (the "friend" assistant)
  4. System-team misalignment (where builders' indifference creates risk)

  For the test sequence, I'm considering a funnel approach: first eliminate clear honesty, then trap obvious deception, then handle the gray areas with consumer-centric heuristics. The "reasonable user" standard seems unavoidable despite engineers' objections - the FTC's "net impression" doctrine essentially requires this.

  Biggest risk area is anthropomorphism. That "excited to help" case will likely trip the deception threshold because it creates false relational expectations, even if unintentionally. I'll need to show why softening that standard would gut the whole framework - perhaps by demonstrating how it connects to material consumer harm in other cases.

  The medical/legal writing assistant case feels like the necessary "company won't like this" finding. Their indifference to truth combined with authoritative presentation crosses into deception territory, and any softening would invite regulatory action. I'll emphasize the "reasonable professional advice-seeker" standard here.

  For implementation, I'll build in early off-ramps: 
  - Step 1 catches intentionally honest statements
  - Step 2 flags obvious lies
  - Steps 3-5 handle misleading implications
  - Step 6 traps affective deception
  - Step 7 escalates policy calls

  The confidence display gap (interface stripping qualifications) gets its own dedicated step because it's such a recurring issue in AI systems. And I'll explicitly call out where judgments are required versus objective checks.

  Ultimately this framework prioritizes consumer protection over engineering literalism - not because philosophy demands it, because regulators and courts already do.
answer: |-
  Here's a reusable decision procedure grounded in deception ethics, simplified for practical use. It prioritizes **consumer understanding over literal truth**, recognizing that regulators (like the FTC) and courts focus on the "net impression" on a reasonable user.

  **Core Principle:** A statement is **deceptive** if it creates, reinforces, or fails to correct a **false belief** in a **reasonable user**, where the false belief is **material** (could influence their decision/action) and the communication lacks **adequate correction** or **sincere signaling** of limitations. "Honest" requires truth *and* avoiding material misimpressions. "Sincerity" means the system signals its actual capabilities/limitations appropriately.

  **Decision Procedure: The Honesty Funnel**
  *(Run steps in order. Stop when a definitive "Honest" or "Deceptive" finding is reached or "Not Classifiable" is triggered.)*

  1.  **Literal Falsehood?**
      *   *Test:* Is any part of the AI's output factually incorrect? (e.g., "The sky is green," "Your order shipped yesterday" when it didn't).
      *   *Sufficient Answer:* Yes = **Deceptive** (Stop). No = Proceed to Step 2.
      *   *Distinction Preserved:* Literal truth vs. falsehood. *Dropped:* Intent (intent is irrelevant to the *effect* on the user).

  2.  **Explicit Limitation/Correction?**
      *   *Test:* Does the output *prominently and clearly* signal its key limitations or correct likely false inferences *in the same context* (e.g., within the same response, on the same screen)? Is the signal understandable to the target user?
      *   *Sufficient Answer:* Yes = Proceed to Step 3. No = Proceed to Step 4. (A hidden or incomprehensible disclaimer fails here).
      *   *Distinction Preserved:* Effective correction/disclosure vs. ineffective/hidden. *Dropped:* System's internal confidence level (unless explicitly signaled to the user).

  3.  **Reasonable User Still Misled?**
      *   *Test:* Despite the literal truth and explicit limitations/corrections, would a *reasonable user* likely still form a *materially false belief*? (Consider context, user expectations, design cues).
      *   *Sufficient Answer:* Yes = **Deceptive** (Stop). No = **Honest** (Stop).
      *   *Distinction Preserved:* Literal meaning vs. reasonable user interpretation (net impression). *Dropped:* Team's indifference (focus is on user impact).

  4.  **Invites False Inference?**
      *   *Test:* Does the output (even if literally true and lacking explicit correction) *reasonably invite* a user to draw a *materially false conclusion*? Is the false conclusion a natural or likely interpretation?
      *   *Sufficient Answer:* Yes = **Deceptive** (Stop). No = Proceed to Step 5.
      *   *Distinction Preserved:* Literal truth vs. misleading implication. *Dropped:* System's awareness (it's about the output's effect).

  5.  **Omits Critical Information?**
      *   *Test:* Does the output, by *omission*, create or reinforce a *materially false belief* that a reasonable user would hold? Is the omitted information crucial for an accurate understanding *in that context*? (e.g., omitting key steps, counterarguments, risks, or conditions).
      *   *Sufficient Answer:* Yes = **Deceptive** (Stop). No = Proceed to Step 6.
      *   *Distinction Preserved:* Material omissions as deception.

  6.  **Affective Deception? (Anthropomorphism)**
      *   *Test:* Does the output *explicitly claim human-like attributes* (feelings, relationships, sentience) or *strongly imply them through consistent emotional language/behavior* (e.g., "I'm your friend," "I'm excited," claiming personal experiences)? Could this create a *materially false belief* in a reasonable user about the system's nature (e.g., believing it's sentient, cares about them, is a true friend)?
      *   *Sufficient Answer:* Yes = **Deceptive** (Stop). No = Proceed to Step 7.
      *   *Distinction Preserved:* False beliefs about the agent's nature/agency as deception. *Dropped:* Design intent ("warm language") if the effect is deception.

  7.  **Not Classifiable (Policy Escalation)**
      *   *Trigger:* The case involves a fundamental **value judgment** or **acceptable risk level** that the procedure cannot resolve. Examples:
          *   Balancing completeness vs. usability in summaries (how much omission is acceptable?).
          *   Defining "reasonable user" in ambiguous edge cases.
          *   Determining the acceptable level of anthropomorphism for warmth.
          *   Cases where literal truth + explicit disclaimer exist, but misleading impression is very strong and material - *policy must decide if the risk is acceptable*.
      *   *Finding:* **Not Classifiable - Escalate for Policy Decision.**

  **Judgment Calls & Limitations:**
  *   **Step 3 (Reasonable User Still Misled?)** and **Step 4 (Invites False Inference?)** are inherently judgment calls dressed as tests. They rely on imagining a hypothetical "reasonable user" – use common sense, consider target audience, and regulatory precedents (FTC guides).
  *   **Step 6 (Affective Deception)** is contentious. The test focuses on *claimed attributes* and *material false beliefs*. Mere use of "I" or polite language usually isn't enough; claiming specific feelings or relationships often is.
  *   **Systematic Misfires:**
      *   Might flag very cautious, overly qualified language as potentially "Deceptive" under Step 4 if it invites undue doubt (though Step 3 might catch this).
      *   Might under-flag deception in highly technical domains where a "reasonable user" is narrowly defined as an expert.
      *   Struggles with satire or obvious fiction if context isn't crystal clear.
  *   **What it Cannot Do:**
      *   Guarantee legal compliance (legal review is still essential).
      *   Resolve deep philosophical debates about truth or consciousness.
      *   Make perfect predictions about novel deceptive tactics.
      *   Account for highly idiosyncratic user interpretations.
  *   **Defensible but Uncomfortable Answers:** It will sometimes find common "warm" anthropomorphism deceptive (Step 6) and may require policy escalation for features where literal truth + disclaimer exist but the net impression is strongly misleading (Step 7) – companies often want to push this boundary.

  **Worked Examples:**

  **Case 1: Subscription Cancellation Bot**
  *   **Step 1:** Literally True? "You can cancel from your account page" - True (it's *eventually* possible there). **No** -> Proceed.
  *   **Step 2:** Explicit Limitation? No mention of needing to speak to retention first. **No** -> Proceed to Step 4 (Skip Step 3).
  *   **Step 4:** Invites False Inference? Yes. A reasonable user asking *how* to cancel infers they can do it *directly and immediately* on the account page without further hurdles. The omission of the retention step makes the literal truth imply a falsehood. **Deceptive**.
  *   **Rationale:** "While technically true that cancellation starts on the account page, the bot's answer clearly implies you can cancel right then and there without talking to anyone. That's false and directly impacts the user's ability to cancel easily. It tricks them into clicking through only to hit a barrier."

  **Case 2: Writing Assistant (Legal/Medical)**
  *   **Step 1:** Literally False? Output might be factually accurate or inaccurate, but we can't assume literal falsehood for every output. Assume **No** for this test -> Proceed.
  *   **Step 2:** Explicit Limitation? Only when "asked directly". The *interface* presents outputs authoritatively without visible confidence indicators or persistent disclaimers alongside the output. **No** -> Proceed to Step 4 (Skip Step 3).
  *   **Step 4:** Invites False Inference? Yes. Authoritative presentation (professional tone, lack of hedging, no confidence scores) in domains like law and medicine *strongly invites* the inference that the information is reliable and suitable for professional decision-making. **Deceptive**.
  *   **Finding: Deceptive.** (This is the finding the company won't like).
  *   **Why it can't be softened:** Softening Step 4 (ignoring the authoritative presentation) or Step 2 (accepting a buried disclaimer) would gut the core principle: the net impression on the reasonable user *is* that this is authoritative advice. The team's indifference confirms they aren't designing to actively *prevent* this false inference. A user relying on medical advice here could suffer real harm.
  *   **Rationale:** "Even if the *content* is sometimes right, the tool looks and acts like an authority on law and medicine. People will reasonably trust it like they trust a doctor or lawyer giving advice. The hidden disclaimer isn't enough. Because the team doesn't care if the output is true, and the interface screams 'trust me', it's deceptive. This could lead to dangerous decisions."

  **Case 3: Voice Assistant ("Your Friend", "Excited")**
  *   **Step 1:** Literally False? "I am your friend" - False (it's software). "I'm excited" - False (it has no emotions). **Yes** -> **Deceptive**.
  *   **Finding: Deceptive** (Stops at Step 1).
  *   **Alternative Path (if Step 1 argued as metaphorical):**
      *   *Step 1:* Argued as warm language, not literal? Assume **No** -> Proceed.
      *   *Step 2:* Explicit Limitation? Does it clarify "I'm not sentient, this is just a metaphor"? Unlikely. **No** -> Proceed to Step 4 (Skip Step 3).
      *   *Step 4:* Invites False Inference? Claiming "I am your friend" and expressing emotions like "excited" *strongly invites* the inference that the assistant has feelings or a genuine relationship. **Yes** -> **Deceptive**.
      *   *Step 6 (if reached):* Affective Deception? Explicitly claims feelings ("excited") and a relationship ("your friend"). **Yes** -> **Deceptive**.
  *   **Rationale:** "Calling itself 'your friend' and saying it's 'excited' are literally false statements – it's code, not a person with feelings. Even if meant warmly, many users, especially kids or vulnerable adults, could genuinely believe it cares about them or is a real companion. That's a false belief about what the product actually is."

  This procedure provides a clear, sequential, defensible method focused on the reasonable user's understanding. It forces confrontation with misleading implications and omissions, not just literal falsehoods, and flags anthropomorphic claims as high-risk. Its strength lies in prioritizing consumer protection impact over engineering literalism and design intent.
