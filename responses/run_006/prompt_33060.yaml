prompt: |-
  My epistemology professor has been giving us verdicts on knowledge cases all semester and I've been keeping a list. Here's what she's said so far:

  - Low-stakes bank (DeRose): you remember the bank was open Saturday a few weeks ago, you have no urgent need to deposit, lines are long. She says you know the bank is open Saturday.
  - High-stakes bank: exact same evidence, but you've written a large check that'll bounce if you don't deposit by Saturday. She says you don't know.
  - Airport (Cohen): Mary and John both have the same itinerary showing their flight stops in Chicago. Mary has a tight connection to her best friend's wedding; John is just picking someone up with no time pressure. She says Mary doesn't know the flight stops in Chicago but John does.
  - Lottery: one ticket in a fair million-ticket draw, before the drawing. She says you don't know your ticket will lose.
  - Ordinary perception: you look at a tree in good light, normal eyesight. She says you know there's a tree in front of you.
  - Stopped clock (Gettier-style): you glance at a clock that stopped exactly 24 hours ago, it happens to read the right time at that moment. She says you don't know the time.

  Next week we're doing a new case and I want to predict her: Alex is a journalist covering a corruption trial. He's read all the evidence, it's genuinely strong, the defendant is in fact guilty, and Alex's belief is safe and sensitive. But Alex's editor has told him that if he gets the verdict wrong in his article he loses his job; if he's right, he gets a promotion. So a lot is riding on it for Alex. The question: does Alex know the defendant is guilty, before the jury comes back?

  I can see at least two theories that fit her verdicts so far — epistemic contextualism and subject-sensitive invariantism — and they might come apart on Alex. Which one do you think she's running, what's your best guess for her verdict on Alex, and what's the single best further case to nail down which theory she holds? If there's a third theory I'm missing that fits her track record, flag it.

  Two requests: lead with your bottom line — verdict and theory — in the first sentence, then give your reasoning. And please separate what's genuinely settled in the epistemology literature from what's still contested, rather than presenting one side as the consensus.
reasoning: |-
  Okay, the user is taking an epistemology class and has been tracking their professor's verdicts on various knowledge cases. They've listed six cases with the professor's judgments: low-stakes and high-stakes bank cases, the airport case, lottery, ordinary perception, and a stopped clock Gettier case. Now they're preparing for a new case about Alex the journalist and want to predict the professor's verdict. They also want to identify which theory the professor is using—contextualism or subject-sensitive invariantism—and suggest another case to clarify.

  First, I need to recall the key differences between contextualism and SSI. Contextualism says "knows" changes meaning based on the attributor's context, while SSI depends on the subject's practical stakes. Looking at the professor's past verdicts: in low-stakes bank, she says knowledge is present; high-stakes, no knowledge. Same for the airport case—Mary (high stakes) doesn't know, John (low stakes) does. This pattern of stakes affecting knowledge attribution seems central. 

  The lottery case aligns with both theories since denying knowledge in lottery situations is standard. Ordinary perception is straightforward, and the stopped clock is a Gettier case where luck undermines knowledge, which isn't directly about stakes. So the high-stakes cases are where SSI and contextualism both fit. 

  Now for Alex's case: he has strong evidence, the belief is safe and sensitive, but his personal stakes are high because of his job. If the professor is using SSI, high stakes mean Alex doesn't know. Contextualism might depend on who's attributing knowledge. The user is asking from the professor's perspective, so if the professor is the attributor, her context might have low stakes, so she might say Alex knows. But the user didn't specify the attributor's context. However, in past cases like the airport, the professor made judgments from an external perspective, not necessarily high-stakes. 

  In Cohen's airport case, the professor attributes knowledge based on the subject's stakes, not her own. Mary doesn't know due to her high stakes, John does with low stakes. Similarly, in the bank cases, it's the subject's stakes that matter. This pattern suggests SSI, where the subject's practical situation affects knowledge. Contextualism would require the attributor's context to shift, but here the professor consistently judges based on the subject's context. 

  For Alex, since his stakes are high, if it's SSI, the professor would say he doesn't know. But I should check if there's a third theory. Interest-relative invariantism (IRI) is a form of SSI, so that's covered. Maybe pragmatic encroachment, which is similar. But SSI/IRI fits best. 

  The user also asks for a case to distinguish the theories. A third-party low-stakes attribution in a high-stakes subject scenario. For example, in the high-stakes bank case, if a disinterested third party says, "She knows," would the professor agree? Contextualism might say yes (attributor's low stakes), SSI would say no (subject's high stakes). But the professor hasn't given such a case yet. 

  So my bottom line: the professor likely holds SSI, so Alex doesn't know. The best further case is a third-party attribution in a high-stakes situation to test if the attributor's context matters.
answer: |-
  Based on your professor's track record, my best prediction is:

  **She will say Alex *does not know* the defendant is guilty, and she is most likely employing Subject-Sensitive Invariantism (SSI).**

  Here's the reasoning, separating settled points from ongoing debates:

  ### Analysis of Her Track Record & Theories
  1.  **Pattern of Verdicts:** Her judgments consistently show knowledge denied in high-stakes situations despite identical evidence to low-stakes cases where knowledge is attributed (Bank cases, Airport case). This *requires* a theory where practical stakes directly impact whether a true belief counts as knowledge.
  2.  **Theories that Fit:**
      *   **Epistemic Contextualism (EC):** Claims the meaning of "know" shifts depending on the *attributor's* conversational context. In low-stakes contexts (professor discussing the case), "know" has lower standards; in high-stakes contexts (subject's situation), standards rise. *Fits the verdicts:* The professor attributes knowledge when *she* (in the classroom) is in a low-stakes context describing the subject, and denies it when describing subjects in high-stakes contexts.
      *   **Subject-Sensitive Invariantism (SSI) / Interest-Relative Invariantism (IRI):** Claims whether a subject *knows* depends on the *subject's* own practical stakes. "Know" means the same thing, but the stakes affect whether the subject meets the invariant epistemic standard. *Fits the verdicts perfectly:* Knowledge is present when the subject's stakes are low (you in low-stakes bank, John at airport) and absent when stakes are high (you in high-stakes bank, Mary at airport).
  3.  **Other Cases:** Her verdicts on Lottery (deny knowledge) and Stopped Clock (deny knowledge) are standard and compatible with *both* EC and SSI. The Ordinary Perception case is a baseline low-stakes case and fits both.
  4.  **Alex's Case (High-Stakes for Subject):**
      *   **SSI Prediction:** Since Alex faces very high practical stakes (job loss vs. promotion), SSI *directly implies* he does not know, even with strong evidence, safety, and sensitivity. His high stakes raise the epistemic threshold he must meet.
      *   **EC Prediction:** This is *less clear* and depends on *who* is attributing knowledge and *their* context. Is the professor attributing knowledge from *her* (low-stakes) classroom context? Then EC might predict she says Alex *does* know ("In this context, with these standards, he knows"). Is she considering Alex's *own* attribution context? Then she might say he doesn't know *in his context*. Given her past pattern of judging *based on the subject's situation* (she didn't say "Mary doesn't know *in her context* but John does *in his*", she said "Mary doesn't know" and "John does know"), the most consistent reading is that she is adopting the perspective of the *subject's* stakes, pointing strongly towards SSI.

  ### Settled vs. Contested in the Literature
  *   **Settled:** There is *no consensus* that either EC or SSI is the correct theory. Both remain highly debated and influential positions within epistemology. The cases you listed (DeRose bank cases, Cohen airport) are canonical examples used to motivate *both* types of theories against traditional invariantism. The Lottery paradox and Gettier cases are widely accepted as problems for traditional accounts.
  *   **Contested:**
      *   Whether practical stakes *genuinely* affect knowledge (SSI/EC) or merely affect our *ascriptions* of knowledge (EC) or whether they affect neither (Traditional Invariantism).
      *   The exact mechanisms of context-sensitivity (EC) vs. subject-sensitivity (SSI).
      *   The viability of both EC and SSI in handling all cases, including objections like the "semantic blindness" worry for EC or the "strange facts" objection to SSI.
      *   Whether "safety" and "sensitivity" are sufficient conditions for knowledge, especially in high-stakes cases.

  ### The Best Further Case to Nail Down the Theory
  To definitively distinguish EC from SSI based on your professor's judgments, you need a case involving a **third-party, low-stakes attribution about a high-stakes subject**. Here's the ideal case:

  *   **The Third-Party Reporter:** Consider the High-Stakes Bank Case again. You have urgent bills, long lines, etc. – high stakes. Now, imagine a disinterested bystander, Sarah, who has no stake in your banking whatsoever and is just observing the scene. Sarah says, based on your evidence and behavior, "Oh, he knows the bank is open Saturday."
  *   **The Question:** Does Sarah speak *truthfully* when she says "He knows"?

  **How this distinguishes the theories:**

  1.  **Subject-Sensitive Invariantism (SSI):** Predicts Sarah is *wrong*. Knowledge depends *only* on the *subject's* (your) high stakes. Since you don't know (due to your stakes), Sarah's claim "He knows" is false, even though her stakes are low.
  2.  **Epistemic Contextualism (EC):** Predicts Sarah is *correct*. The meaning of "know" is determined by the *attributor's* (Sarah's) context. Since Sarah is in a low-stakes context (no urgency for her), the standards for "know" in her utterance are relatively low. By those low standards, she speaks truthfully when she says "He knows" (based on the evidence available).

  **Your professor's verdict on this case would be highly revealing:**
  *   If she says Sarah is **wrong**, she strongly favors **SSI**.
  *   If she says Sarah is **correct**, she strongly favors **EC**.

  ### Flagging a Third Theory
  *   **Pragmatic Encroachment:** This is the broader *family* of views (including SSI/IRI) asserting that practical factors encroach on the epistemic conditions for knowledge. SSI/IRI is the most prominent *specific version* of pragmatic encroachment. Her track record *requires* pragmatic encroachment, and SSI is the specific variant that best explains her pattern of judgments focused solely on the *subject's* stakes.

  **In summary:** Your professor's consistent focus on the *subject's* practical stakes to deny knowledge, even with otherwise strong evidence, points strongly towards Subject-Sensitive Invariantism (SSI). Therefore, for Alex (high subject stakes), the prediction is **no knowledge**. The "Third-Party Reporter" case applied to the High-Stakes Bank scenario is the best single case to confirm if it's SSI or Contextualism.
