  My friend has been on this whole causation-by-omission kick and I've been keeping track of her verdicts on a bunch of cases. Here's what she's said so far:

  - Surgeon forgets to check a patient's allergy bracelet before giving a drug; patient goes into anaphylactic shock. She says the surgeon's omission caused the reaction.
  - Random visitor at the hospital walks past that same patient's room, notices the allergy bracelet, doesn't mention it to anyone; same outcome. She says the visitor's omission did NOT cause the reaction.
  - Parent doesn't feed their toddler all day; kid gets seriously ill. She says the omission caused the illness.
  - Stranger at the park sees the same toddler looking hungry, doesn't offer food; kid gets ill. She says the omission did NOT cause the illness.
  - Bus driver doesn't secure a passenger's wheelchair before taking off; passenger is thrown and injured at the first turn. She says the omission caused the injury.
  - Fellow passenger sitting right next to the wheelchair doesn't reach over and secure it themself; same injury. She says the omission did NOT cause the injury.

  Now here's the new case I want to predict: A solo hiker on a remote trail comes across an injured stranger who can't walk. The hiker is the only person around for miles, has a working phone and a first aid kit, but decides not to help and keeps walking. The stranger dies of exposure overnight.

  What do you think my friend will say about whether the hiker's omission caused the death? I want a committed answer — don't just lay out the possibilities and leave me hanging. Tell me what rule (or rules) fit her track record, which ones diverge on the hiker case, which verdict you think she'd actually give and why, and what further case would nail down which rule she's really running.
