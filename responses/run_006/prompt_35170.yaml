  Now, what is the probability that the driver is at the first exit when he finds himself at an intersection? Note that he may have already exited at the first exit and the journey ended. So when he is at an intersection, it could be either the first exit (if he has not exited) or the second exit (if he continued from the first). But note: he has no memory of past actions.

