    = [ (4p + 1 - p) ] / (2-p)   +   (1-p)/(2-p)
    = (3p+1)/(2-p) + (1-p)/(2-p)
    = (3p+1 + 1-p) / (2-p)
    = (2p+2) / (2-p)

  Alternatively, we can note that the expected payoff of continuing at a node is:

    P(first) * (payoff from going to node2 and then using strategy p) + P(second) * 1
    = P(first) * V2 + P(second) * 1

  But V2 = 4p + (1-p)*1 = 3p+1.

  So:

    Continue = P(first)*(3p+1) + P(second)*1
             = [1/(2-p)]*(3p+1) + [(1-p)/(2-p)]*1
             = (3p+1 + 1-p) / (2-p)
             = (2p+2) / (2-p)

  Now, the driver at the node will compare:

    Exit: 4 * (1-p) / (2-p)
    Continue: (2p+2) / (2-p)

  We can write:

    Exit: 4(1-p)/(2-p)
    Continue: 2(p+1)/(2-p)

  For the strategy to be consistent, the driver should be indifferent between exiting and continuing at the optimal p? Or at least, the expected payoff of exiting and continuing should be equal if the driver is randomizing. In the ex ante optimal strategy, p=1/3.

  Let us plug p=1/3:

    Exit: 4*(1-1/3)/(2-1/3) = 4*(2/3) / (5/3) = (8/3) * (3/5) = 8/5 = 1.6
    Continue: 2*(1/3+1)/(2-1/3) = 2*(4/3) / (5/3) = (8/3)*(3/5)=8/5=1.6

  So indeed, at p=1/3, the expected payoff of exiting and continuing are equal (both 1.6). Therefore, the driver is indifferent and is willing to randomize with any probability. But note that the ex ante expected payoff is maximized at p=1/3.

  What if the driver were to set p=1? Then:

    Exit: 4*(1-1)/(2-1) = 0
    Continue: 2(1+1)/(2-1)=4

  But wait, if p=1, then at the first exit the driver exits with probability 1, so he gets 0. And he never reaches the second exit. So the expected payoff of the whole trip is 0. However, the calculation above for the conditional payoff at a node when p=1:

    P(second) = (1-1)/(2-1)=0, so the driver believes he is at the first exit with probability 1. Then:
      Exit: 0
      Continue: 2(1+1)/(2-1)=4

  But if he continues at the first exit (which he believes he is at with probability 1), then he would go to the second exit and then exit with probability 1 (since p=1) and get 4. So the expected payoff of continuing is 4. However, note that if he continues at the first exit, he will then at the second exit exit with probability 1 and get 4. But if he exits at the first, he gets 0. So he would prefer to continue? But then why did he set p=1? There is an inconsistency.

  But note: if he sets p=1, then he never continues. So the event that he continues at the first exit and then gets to the second exit does not occur. Therefore, the belief calculation for p=1 is:

    P(first) = 1/(2-1)=1
    P(second)=0

  But if he were to deviate and continue at the first exit (even though his plan was to always exit), then he would get to the second exit. And at the second exit, he would then follow the plan to exit (p=1) and get 4. Therefore, if he considers deviating at the first exit, he would see that continuing gives 4, which is better than exiting (0). So the strategy p=1 is not a Nash equilibrium in the sense of sequential rationality? This is a point of dynamic inconsistency.

  However, in the problem, the driver commits to a strategy in advance. The ex ante optimal strategy is p=1/3. At p=1/3, the driver is indifferent at the moment of acting. Therefore, he has no incentive to deviate from the mixed strategy.

  But why can we not use the naive belief of 1/2? The naive belief of 1/2 would be correct only if the driver were equally likely to be at the first and second exits. But that would require that the probability of being at the first exit is the same as at the second. However, the driver always starts at the first exit, and only reaches the second if he continues at the first. Without any strategy, the first exit is always visited, and the second is visited only if the driver continues at the first. Therefore, the second exit is less likely to be visited if the exit probability p is high. So the belief must depend on p.

  In summary, the driver at a node should form beliefs based on the strategy. The ex ante optimal strategy p=1/3 leads to beliefs:

    P(first) = 1/(2-1/3) = 1/(5/3)=3/5
    P(second)= (1-1/3)/(2-1/3)= (2/3) / (5/3)=2/5

  Then:

    Exit: 0*(3/5) + 4*(2/5)=8/5
    Continue: (as above) 2*(1/3+1)/(5/3) = 2*(4/3) * (3/5)=8/5

