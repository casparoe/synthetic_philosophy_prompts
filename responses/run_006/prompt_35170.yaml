  But wait, the strategy is fixed: at every intersection, he exits with probability p (to be determined). We are to consider the optimal p.

  The dynamic inconsistency question: why, at the moment of acting, does the driver not recalculate and choose to exit with probability 1 (since 2>1) rather than follow the ex ante optimal p=1/3?

  The key is that the driver's belief at the moment of acting cannot be naively set to 1/2 for each exit. Why? Because the driver is using a mixed strategy, and the chance that he is at the first exit versus the second exit depends on his strategy.

  Let me compute the probability of being at the first exit versus the second exit at the moment when the driver is at an intersection, given that he has followed the strategy of exiting with probability p at each intersection.

  The driver starts at the first exit. At the first exit:
   - With probability p, he exits and gets 0. Then the journey ends.
