answer: |-
  Here are five numbered points addressing the core philosophical commitments and implications of wrongful death law:

  1.  **Wrongful death law implicitly presupposes a "Deprivation Account" of harm**, where death's badness lies solely in the irrevocable loss of the valuable future life, experiences, relationships, and projects the deceased person would otherwise have enjoyed – a future objectively worth having.
  2.  **This practice is fundamentally consistent with (and requires) a deprivation theory**; it quantifies harm *not* by any experiential state of suffering at death itself, but by the concrete counterfactual difference between the life actually lived and the longer, flourishing life the person was deprived of by the wrongful act.
  3.  **Epicurus's argument directly challenges this foundation** by asserting that harm requires a subject to experience it; since the deceased ceases to exist at death, they cannot be the subject of any post-mortem deprivation, rendering the legal concept of compensating *them* for lost future goods incoherent.
  4.  **If courts fully accepted Epicurus's view, wrongful death damages *as compensation for the deceased's loss* would collapse entirely**; the law could no longer coherently award damages for the deceased's lost earnings, lost enjoyment of life, or lost future relationships, as these require attributing harm to a non-existent subject.
  5.  **The law could *only* survive on an alternative basis: compensating survivors exclusively** for *their* measurable losses (funeral costs, loss of financial support, loss of consortium/companionship, grief) and potentially punitive damages, but this would abandon the core legal principle of redressing the wrong done *to the deceased person*.
