  Based on your professor's verdicts on the seven cases and the new case provided, I'll analyze the two candidate principles you've identified (statistical-evidence and sensitivity), formulate defensible versions that fit the track record, apply them to the new case, select the better interpretation, and design a separating case to force a choice. I'll also highlight which existing verdicts are doing the heavy lifting and whether any verdicts are surprising under the chosen principle.

