  ### **1. Defensible Formulations of the Principles**
  Both principles must explain all seven verdicts. Here are the most defensible formulations:

  - **Statistical-Evidence Principle (SEP)**:  
    *Rational belief about a particular proposition (i.e., a specific event, object, or individual) requires evidence that is causally, explanatorily, or normatively connected to that specific instance. Purely statistical evidence (e.g., base rates, frequencies, or probabilities detached from the specific case) is insufficient for rational belief about particulars. However, statistical evidence can support rational belief about general or aggregate propositions (e.g., "at least one error exists in the book").*  
    - **Key refinement**: SEP distinguishes between "particular" and "aggregate" propositions. A "particular" proposition targets a specific token (e.g., "Ticket #123 lost," "Jane has the disease"), while an "aggregate" proposition targets a collective property (e.g., "The book contains ≥1 error"). Statistical evidence is forbidden for particulars but permitted for aggregates.

  - **Sensitivity Principle (SP)**:  
    *A belief is rational only if, in the nearest possible world where the proposition is false, the agent would not hold that belief via the same method. More precisely: For a belief in \(p\) formed by method \(M\), if \(p\) were false, \(M\) would not produce the belief that \(p\).*  
    - **Key refinement**: SP requires modal robustness. A belief is sensitive if it "tracks truth" counterfactually—i.e., it wouldn't be held if false. The "method" includes the agent's evidence-gathering process (e.g., statistical calculation, perceptual observation, testimony).

  Both principles fit the seven verdicts, as shown below:

  | **Case**               | **Verdict**                      | **SEP Explanation**                                                                                                | **SP Explanation**                                                                                                 |
  |------------------------|----------------------------------|-------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|
  | **1. Standard lottery** | Not rational (believe ticket loses) | Statistical evidence (1/1M odds) isn't connected to the specific ticket. Forbids belief about particulars.        | If ticket won, you'd still believe it loses (same statistical method). Belief insensitive → not rational.        |
  | **2. Standard preface** | Rational (each claim + ≥1 error) | Each claim: Specific evidence (source-checking) for particulars. ≥1 error: Statistical evidence for aggregate → allowed. | Each claim: If a claim were false, checking would likely catch it → sensitive. ≥1 error: If no error, author might still believe it (based on experience) → insensitive? **Problem: Verdict says rational, but SP may forbid ≥1 error.** |
  | **3. Small lottery**   | Not rational (believe ticket loses) | Same as #1: Statistical evidence (90% odds) for particular.                                                       | If ticket won, you'd still believe it loses → insensitive.                                                       |
  | **4. Newspaper report** | Rational (believe ticket loses)  | Testimonial evidence (newspaper) is connected to the specific drawing → allowed for particular.                   | If ticket won, newspaper would report it, so you wouldn't believe loss → sensitive.                             |
  | **5. Disease base rate** | Not rational (believe Jane has condition) | Statistical evidence (60% base rate) for particular.                                                              | If Jane lacked condition, you'd still believe she has it → insensitive.                                         |
  | **6. Diagnostic test** | Rational (believe Jane has condition) | Specific evidence (test result) for Jane → allowed for particular.                                                | If Jane lacked condition, test would likely be negative, so you wouldn't believe → sensitive.                   |
