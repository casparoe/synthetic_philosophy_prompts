prompt: |-
  Can you explain why higher-order theories of consciousness don't just collapse into an infinite regress? The way I understand it, the theory says a mental state is conscious iff there's a higher-order state that represents it, but then you'd think the higher-order state would itself have to be conscious to do the job, which would need a third-order state, and so on. I know the usual response is that the higher-order state is non-conscious, but that move feels a bit like magic to me: how exactly is a non-conscious state supposed to make a lower-order state conscious, and what does the explaining? Also, does the regress worry cut differently against higher-order thought theories vs higher-order perception theories, or is the move basically the same in both? And one more thing: I've heard people talk about higher-order states misrepresenting the states their about. Could you spell out what that's supposed to show, and what a targetless higher-order state would be? I'm after the conceptual structure here, not the neuroscience.
