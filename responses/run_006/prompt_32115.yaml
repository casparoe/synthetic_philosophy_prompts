answer: |-
  Here's a precise taxonomy of interpretations for "intelligence is whatever intelligence tests measure," categorized by their substance, defensibility, and role in arguments against "general intelligence":

  ### The Taxonomy

  1.  **Operational Definition (Trivial/Platitude)**
      *   **Claim:** Intelligence, *as a scientific construct within psychometrics*, is operationally defined by the procedures used to measure it (IQ tests). This is how we give the abstract concept a concrete, measurable form for research and prediction.
      *   **Status:** **Platitude.** This is standard practice in science (e.g., "temperature is what thermometers measure" when defining the construct operationally). It doesn't deny that intelligence might *correlate* with real-world abilities or have a deeper structure; it simply states how the *construct* is defined and measured in this specific context.
      *   **Role in Anti-GI Argument:** Rarely used directly against GI. It's often a starting point or a reminder of how psychometrics works.

  2.  **Procedural Definition (Defensible but Narrow)**
      *   **Claim:** Intelligence *is nothing more than* the specific set of cognitive skills and processes reliably elicited and measured by standardized IQ tests (e.g., pattern recognition, logical reasoning under time pressure, vocabulary size). There is no "essence" beyond these testable performances.
      *   **Status:** **Defensible.** This is a behaviorist or strict operationalist position. It avoids metaphysical claims about the nature of mind and focuses solely on observable/testable behaviors. It's narrow because it excludes potential facets of intelligence not captured by current tests (e.g., creativity, social skill, wisdom).
      *   **Role in Anti-GI Argument:** Can be used to argue that "general intelligence" (g) is *only* a statistical artifact summarizing performance *on these specific tests*, not a discoverable property of brains or a universal cognitive capacity. It shifts focus from "what intelligence *is*" to "what the tests *do*."

  3.  **Circularity Critique (Defensible Insight into Test Validation)**
      *   **Claim:** The claim reveals the inherent circularity in *defining* intelligence solely by tests: We validate tests by showing they correlate with things we *pre-theoretically* call intelligent behavior (academic success, job performance, etc.). If we then *define* intelligence as test scores, the validation loop is circular. Tests don't discover intelligence; they formalize our pre-existing, fuzzy intuitions about it.
      *   **Status:** **Defensible.** Highlights a genuine challenge in psychometrics. Test validity relies on correlation with external criteria *before* the test score becomes the primary operational definition. The slogan exposes this bootstrapping process.
      *   **Role in Anti-GI Argument:** Used to argue that "g" is circular: it's extracted from test batteries designed based on our folk concept of intelligence, and then used to *explain* performance on those same tests. This undermines claims that "g" is a fundamental, independently existing causal entity rather than a reification of test design choices.

  4.  **Family Resemblance / Cluster Concept (Defensible but Controversial)**
      *   **Claim:** There is no single, essential property "intelligence" shared by all things we call intelligent. Instead, "intelligence" refers to a cluster of loosely related cognitive abilities (verbal, spatial, memory, reasoning, etc.). IQ tests pick out one particular cluster (or weighted average) based on social/practical priorities. Different tests (or cultures) might pick out different clusters equally validly. What unites them is not a shared essence, but overlapping similarities (Wittgenstein's "family resemblance").
      *   **Status:** **Defensible (and likely correct to some degree).** Psychometric research (e.g., hierarchical models like CHC theory) shows intelligence is multifaceted. The specific weighting and inclusion of abilities in "g" or IQ scores reflect historical and practical choices. The claim that there's *no* underlying biological unity (e.g., processing efficiency) is more controversial.
      *   **Role in Anti-GI Argument:** Directly challenges the notion of a monolithic "general intelligence." Argues that "g" is an artifact of averaging performance across a specific, culturally-situated set of tasks, not a discovery of a fundamental, domain-general cognitive resource. Emphasizes pluralism ("intelligences").

  5.  **Anti-Essentialism / Social Constructivism (Substantive & Controversial)**
      *   **Claim:** "Intelligence," as a scientific category, *has no deeper, stable, biologically grounded essence* waiting to be discovered. It is *entirely* constituted by the social and historical practices of testing. Test scores *create* the category "intelligence" as we scientifically understand it; they don't measure a pre-existing natural kind. The pursuit of a universal definition or biological basis is fundamentally misguided.
      *   **Status:** **Highly Controversial.** Defended by strong social constructivists and some philosophers of science. Directly contradicts the core assumption of much psychometric and cognitive neuroscience research, which seeks biological correlates and evolutionary explanations for cognitive abilities measured by tests. Evidence for substantial heritability and neurobiological correlates challenges this strong reading.
      *   **Role in Anti-GI Argument:** **This is the primary reading implicitly relied upon when the slogan is used to dismiss "general intelligence" as meaningless.** If "intelligence" is purely a social construct defined by contingent testing practices, then "general intelligence" (g) isn't a discovery about the mind/brain – it's just a statistical summary of those practices. Research into its nature becomes the study of test construction sociology/history, not cognitive science or AI fundamentals. It renders the concept of "Artificial General Intelligence" (AGI) incoherent or contingent on specific human testing paradigms.

  ### Which Reading Targets "General Intelligence"?

  When someone uses **"intelligence is whatever intelligence tests measure"** explicitly to argue that **"general intelligence" is meaningless and we should stop trying to define it**, they are almost always implicitly relying on **Reading 5: Anti-Essentialism / Social Constructivism**.

  *   **Why?** Only Reading 5 fundamentally denies that there *is* any underlying, discoverable, unified cognitive phenomenon *behind* the test scores that could meaningfully be called "general intelligence." The other readings:
      *   Reading 1: Accepts "g" as an operational construct.
      *   Reading 2: Sees "g" as a statistical summary of test performances, not necessarily meaningless.
      *   Reading 3: Critiques *validation* but doesn't inherently deny the *usefulness* of the construct.
      *   Reading 4: Argues against *monolithic* g but often accepts hierarchical models with broad factors.

  Reading 5 asserts that the *only* thing that exists is the measurement practice itself; there is no independent "thing" (general intelligence) that the practice is latching onto, even imperfectly. This makes the *concept* of GI, as something to define or engineer, incoherent from the outset.

  **Key Takeaway for Debates:** When encountering this slogan used to dismiss GI or the quest for a definition, immediately probe: "Are you arguing that intelligence *has no stable biological or cognitive essence beyond our testing practices?*" This forces engagement with the strong (Reading 5) constructivist claim underlying their dismissal, rather than letting them equivocate with the safer platitudes (Readings 1-3). The debate then centers on the existence (or not) of a biologically grounded, domain-general cognitive capacity that our tests *attempt* (however imperfectly) to measure.
