  Here's a decision tree that sorts positions on self-amending rules based on concrete claims about how they function, using your cases to force distinctions. It avoids theoretical labels and focuses on where positions genuinely diverge. The tree has **5 yes/no questions** and **5 leaf positions** (including one "unnamed" and one "incoherent" branch).

  ---

  ### **Decision Tree: What Happens When a Rule Changes Itself?**

  **Start:**  
  A system has rules. One rule (the "amendment rule") defines how rules are changed. What happens when this amendment rule is used to change *itself*?

  1. **Q1: Can the amendment rule change itself?**  
     - *Yes* → Go to Q2  
     - *No* → Go to Q3  

  2. **Q2 (if Yes to Q1): When changing itself, must the amendment rule be followed *exactly as written before the change*?**  
     *(e.g., In Nomic, if Rule 100 says "Rules are amended by majority vote," must a vote to change Rule 100 itself follow that majority requirement?)*  
     - *Yes* → Go to Q4  
     - *No* → Go to Q5  

  3. **Q3 (if No to Q1): Can the amendment rule *ever* be changed?**  
     - *Yes* → Go to Q5  
     - *No* → **Leaf A: Fixed Hierarchy**  
       Self-amendment is incoherent. Every system needs at least one immutable rule (like an unamendable amendment clause). Changing the amendment rule requires external authority (e.g., revolution), not internal procedure.  
       *Your cases:*  
       - (1) Nomic’s rule-changing rule **cannot** change itself.  
       - (2) The constitutional clause **cannot** amend itself.  
       - (3) The "never repeal" bylaw **cannot** be repealed.  

  4. **Q4 (if Yes to Q2): Can a rule that declares itself immune ("This rule may never be repealed") be repealed by the ordinary procedure?**  
     *(e.g., If bylaws normally allow repeal by majority, can a majority repeal the "never repeal" rule?)*  
     - *Yes* → **Leaf B: Two-Step Process**  
       Self-amendment works by strict separation: the *act* of change follows the *old* rule, and the *new* rule takes effect afterward. Validity depends only on compliance with the pre-change rule.  
       *Your cases:*  
       - (1) Nomic’s rule **can** change itself if the old rule is followed during the vote.  
       - (2) Two-thirds **can** amend the clause to require unanimity (valid because the vote met the old rule).  
       - (3) The "never repeal" bylaw **can** be repealed (its declaration is just another rule, overridden by the old procedure).  
     - *No* → **Leaf C: Effective Entrenchment**  
       Self-amendment works, but entrenchment clauses are absolute. A rule that declares itself immune binds future actors, even if they follow the amendment procedure.  
       *Your cases:*  
       - (1) Nomic’s rule **can** change itself *unless* it entrench itself.  
       - (2) The two-thirds clause **can** be amended, but **not** if it contained entrenchment (e.g., "This clause requires unanimity *and* is unamendable").  
       - (3) The "never repeal" bylaw **cannot** be repealed (its entrenchment is valid and binding).  

  5. **Q5 (if No to Q2 or Yes to Q3): Can the amendment rule be changed without following *any* prior rule?**  
     - *Yes* → **Leaf D: Fully Reflexive**  
       The system has no fixed hierarchy. Rules can amend themselves, entrench themselves, or even destroy the amendment process entirely. Validity is determined by the new rule or broader context (e.g., acceptance by the group).  
       *Your cases:*  
       - (1) Nomic’s rule **can** change itself arbitrarily (e.g., to require unanimity mid-vote).  
       - (2) Two-thirds **can** amend the clause to require unanimity, and the vote is valid *because the new rule says so*.  
       - (3) The "never repeal" bylaw **can** be repealed (its declaration is just words; the majority’s action redefines validity).  
     - *No* → **Leaf E: Unnamed/Incoherent**  
       This position is unexplored or inconsistent:  
       - If from Q2 (No): Claims self-amendment requires *no separation* of old/new rules (unlike Leaf B) but *also* requires *some* constraint (unlike Leaf D). No clear examples.  
       - If from Q3 (Yes): Claims the amendment rule can change, but *not* by itself *or* external authority. How? Unresolved.  
       *Your cases:* All three scenarios fail or lack a clear answer.  

  ---

  ### **How the Tree Sorts Positions**
  - **Leaf A (Fixed Hierarchy)** emerges from rejecting self-amendment entirely. Systems need a bedrock rule immune to internal change.  
  - **Leaf B (Two-Step Process)** and **Leaf C (Effective Entrenchment)** split on whether entrenchment clauses are binding. Both require strict adherence to the *old* rule during the change.  
  - **Leaf D (Fully Reflexive)** allows total self-modification. Validity is dynamic, not tied to prior rules.  
  - **Leaf E (Unnamed/Incoherent)** captures contradictions: e.g., "Amendment rules can change but not by any means."  

  ### **Key Distinctions Using Your Cases**
  - **Nomic’s self-change (Case 1)**:  
    - Possible in Leaf B (if old rule followed), Leaf C (if not entrenched), Leaf D (always).  
    - Impossible in Leaf A.  
  - **Constitutional clause amending itself (Case 2)**:  
    - Valid in Leaf B (two-thirds vote under old rule) and Leaf D (new rule validates it).  
    - Invalid in Leaf A and Leaf C (if entrenched).  
  - **Repealing "never repeal" bylaw (Case 3)**:  
    - Possible in Leaf B (old procedure overrides entrenchment) and Leaf D (no entrenchment is absolute).  
    - Impossible in Leaf A and Leaf C.  

  ### **Omissions and Notes**
  - Leaf B combines your "separation" (C) and "two-step" (D) positions—they collapse in practice when tested against entrenchment.  
  - No major position defends Leaf E; it’s a warning light for incoherent answers.  
