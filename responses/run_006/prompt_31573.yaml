answer: |-
  The practice of applying a positive *pure* rate of time preference (PRTP) in social discounting, particularly over intergenerational timescales, is far from a neutral technical convention. It embeds profound, and deeply contestable, philosophical assumptions about our obligations to the future. Let's carve into its presuppositions and tensions:

  1.  **The Core Philosophical Commitment:**
      *   **The Non-Neutrality of Time:** At its heart, a positive PRTP explicitly states that the mere fact a harm occurs *later in time* is a *reason in itself* to assign it less moral weight *today*. It treats the timing of suffering as morally relevant independently of wealth changes or uncertainty.
      *   **Rejection of Strict Temporal Egalitarianism:** It fundamentally rejects the idea that "a harm is a harm whenever it occurs," considered in isolation from other factors like wealth. It asserts that the temporal location of the beneficiary (or victim) affects the value *to us now* of acting to benefit (or prevent harm to) them.
      *   **Impartiality Challenged:** While classical utilitarianism demands impartiality between persons, a positive PRTP introduces a systematic bias *against* persons solely because they exist later. Philosophers like Derek Parfit have argued forcefully that this is akin to "discrimination by date of birth," lacking a sound moral justification analogous to the rejection of discrimination by race or gender. Why should when someone is born diminish their moral claim?

  2.  **Common Justifications and Their Limitations:**
      *   **Uncertainty About Future Existence:** This *can* provide a pragmatic, non-discriminatory rationale for *some* discounting. If there's a 0.1% annual chance human civilisation ends, a 0.1% PRTP reflects that. **Crucially:** Over a century, this "extinction risk" is generally estimated to be very small (far less than the typical PRTPs used, like 1-2%). Using a higher rate smuggles in a different, discriminatory assumption.
      *   **Opportunity Cost of Capital:** This is often conflated but is distinct. The argument that £1 invested today grows to £(1+r)^t in the future *is* relevant to *how* we transfer resources (invest now, spend more later). However, it does *not* justify intrinsically valuing future wellbeing less. It's a claim about productive efficiency, not about the inherent moral weight of future people's suffering. A strict temporal egalitarian could still use this *descriptive* rate to calculate the most efficient *path* to maximise total welfare impartially across time, but wouldn't discount the *value* of future welfare itself.
      *   **Future Wealth (Diminishing Marginal Utility):** This is captured in the *wealth growth* component of the discount rate (often the larger part). It *doesn't* require a PRTP. It says: because future people are likely richer, an extra unit of consumption (or avoiding a unit loss) matters *less to them* than an equivalent unit does to poorer people today. This is arguably impartial – it values a util of welfare equally whenever it occurs, but recognises that £1 buys fewer utils for a richer person. **The PRTP is an *additional* discount on top of this, applied to *welfare itself*.**

  3.  **The Tension with Rhetoric of Rights and Justice:**
      *   **Profound Inconsistency:** Government preambles, treaties (e.g., UNFCCC principle of intergenerational equity), and constitutions often speak of the "rights of future generations," our duties as "stewards," or obligations of "justice." A positive PRTP fundamentally undermines this rhetoric.
      *   **Discounting Rights?** If future generations have *rights* – for example, to a habitable planet or essential resources – discounting implies those rights diminish in force the further into the future they apply. This is difficult to square with the concept of inherent, non-diminishing rights.
      *   **Stewardship vs. Accounting:** Stewardship implies a fiduciary duty to protect the interests of those who come after. Applying a PRTP turns this into a cold calculation where the interests of distant beneficiaries are systematically devalued. The official isn't just transferring wealth efficiently; they are *assigning lower inherent worth* to the wellbeing of your grandchildren compared to yours, *simply because they are your grandchildren* (i.e., born later).

  4.  **Replacing PRTP with Strict Temporal Egalitarianism:**
      *   **The Change:** Set the Pure Rate of Time Preference (PRTP) to **zero**.
      *   **The Arithmetic:** The discount rate would then consist *only* of the component reflecting expected changes in wealth and consumption (the elasticity of marginal utility multiplied by the growth rate). Future harms and benefits would be valued *only* by adjusting for how much richer or poorer future people are expected to be. A death in 2125 would be valued less than a death today *only if* people in 2125 are significantly richer (so the marginal utility of their income/consumption is lower), *not* simply because it happens later.
      *   **Impact:** This would radically increase the Present Value of long-term costs (like climate damages) and long-term benefits (like mitigation investments). Policies with major impacts decades or centuries hence (climate action, nuclear waste management, biodiversity conservation) would appear far more urgent and cost-effective. Aggressive mitigation becomes a much stronger economic imperative.
      *   **Would Practice Collapse?** No, but it would change dramatically. Cost-benefit analysis (CBA) could still function, but its results would shift profoundly in favour of long-term investments and against imposing long-term costs. The "bookkeeping" would no longer hide the moral judgment that future lives intrinsically matter less. It would force the debate onto the more visible (and debatable) terrain of predicting future wealth and the elasticity parameter. Some might argue CBA becomes *more* ethically coherent under this regime.

  **What the Treasury Official is Really Saying (Philosophically):**

  When the official explains discounting using a positive PRTP, they *are* expressing a philosophical position, even if clothed in technical jargon. They are presupposing:

  1.  **The Moral Permissibility of Temporal Bias:** It is acceptable for present society to systematically favour the wellbeing of its current and immediately succeeding members over the wellbeing of more distant descendants, *simply because they are temporally closer*.
  2.  **The Non-Existence of Strong Intergenerational Rights:** Future generations do not possess inherent rights or claims that bind us with undiminished force across time; their interests are fungible and subject to discounting.
  3.  **Present Sovereignty:** The present generation holds ultimate sovereignty over resource allocation, including the right to devalue the interests of the future for its own benefit or convenience. This leans towards a form of "presentism" in ethics.
  4.  **Weak Utilitarianism (with Bias):** While overall welfare matters, the welfare of individuals counts less the further into the future they live. This is a specific, contested variant of utilitarianism.

  **The Hidden Moral Content:**

  The PRTP is the point where the moral content is most starkly hidden inside the rate. It transforms a profound ethical question – "Do we owe equal moral consideration to people born in 2125 as to people born today?" – into a technical parameter default, often around 1%. That "1%" represents the annual decay rate of the *intrinsic moral worth* assigned to future wellbeing purely due to its futurity. It’s not merely bookkeeping; it’s an ethical stance masquerading as arithmetic.

  **For Your Scene:**

  The tension is potent. The official *is* applying a convention, but one loaded with unspoken philosophy. Their defence might lean on "standard practice," "economic efficiency," or "pragmatism," but beneath it lies the core assertion: *Time itself diminishes moral claim*. The activist intuitively grasps this as an injustice – the violation of the golden rule across generations. The official isn't necessarily *personally* claiming their grandchildren matter less; they are enacting a systemic logic that does so. The friction arises because the convention encodes a philosophy starkly at odds with the language of rights, stewardship, and equality we profess elsewhere. Highlighting *that* dissonance – between the cold calculus of the spreadsheet and the warm rhetoric of the preamble – is where the real dramatic and ethical power of your scene lies. The official isn't just explaining maths; they are defending a particular, highly contentious, vision of intergenerational justice.
