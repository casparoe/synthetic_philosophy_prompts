  Progress might come from meta-philosophical reflection. Explicitly discussing what makes an explanation satisfactory could shift the debate. Formal tools could make positions clearer, but won't force agreement. A permanent stalemate might indicate that the question has unacknowledged assumptions. Recognizing that could be valuable, showing the limits of certain explanatory frameworks.

