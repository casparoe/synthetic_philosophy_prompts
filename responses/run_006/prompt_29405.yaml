answer: |-
  Your diagnosis is perceptive and captures a core dynamic in the Frege-Geach debate. The disagreement *is* fundamentally about what constitutes a "solution," reflecting divergent priorities and conceptions of expressivism's core task. Let's break this down:

  1.  **The Nature of the Disagreement: Substantive Goals with Incommensurable Success Conditions**
      *   **The "Formal Constraint" Camp (Critics & Logic-Oriented Expressivists):** Their primary success condition is **logical coherence and compositional systematicity**. A solution must:
          *   Provide a single, unified semantic type/value for moral sentences that explains their behavior *across all linguistic contexts* (assertions, conditionals, negation, questions, etc.).
          *   Validate standard logical inferences (like modus ponens in mixed contexts) *as a direct consequence of the semantic rules and the compositional machinery itself*.
          *   Avoid ad-hoc explanations for different contexts.
          *   **Underlying Priority:** Preserving the objectivity and genuine logical structure of moral discourse *within the theory*. Failure here looks like logical chaos or special pleading.
      *   **The "Psychological Task" Camp (Expressivists focused on Function):** Their primary success condition is **explanatory fidelity to the non-representational, motivational core of expressivism**. A solution must:
          *   Explain moral language use primarily in terms of non-cognitive attitudes (desires, plans, commitments, etc.).
          *   Show how moral reasoning is a dynamic process of coordinating, negotiating, or refining these attitudes.
          *   Avoid positing *beliefs with distinctively moral representational content* or *moral facts/properties* as the semantic referents or truth-makers.
          *   Explain the *appearance* of logical structure as arising from the functional role of attitudes in practical reasoning, not from representational content.
          *   **Underlying Priority:** Providing a naturalistically respectable, non-mysterious account of moral thought and talk grounded in human psychology and social interaction. Failure here looks like collapsing into realism/cognitivism by smuggling in propositions or facts.

  2.  **Why This Leads to Stalemate:**
      *   **Different Benchmarks:** A proposal satisfying the formalists (e.g., a complex semantic type unifying all contexts logically) often strikes the psychological camp as overly abstract, losing sight of the core expressivist motivation ("You've just reinvented propositions under another name!"). Conversely, a proposal satisfying the psychological camp (e.g., a dynamic story about attitude expression and negotiation) often strikes formalists as lacking the rigorous compositional structure needed to genuinely validate logic ("Your 'logic' is just a suggestive metaphor, not real proof theory!").
      *   **The "Reintroduction" Charge:** This is the crux. Formalists argue that to achieve systematicity and logic, expressivists *must* assign moral sentences a semantic value that *functions like* a truth-conditional proposition within the compositional machinery (e.g., Gibbard's "fact-plan worlds", Blackburn's "H-organizations", Chrisman's "ought thoughts", Toppinen's "being for"). They see this as conceding the cognitivist point. Expressivists counter that these constructs are *explanatorily downstream* of the attitude expression and lack ontological commitment to moral facts – they are *representations within the model*, not representations *of* mind-independent reality. For them, the psychological story remains primary.
      *   **The "Modus Ponens in Mixed Contexts" Test:** This is the formalist's litmus test. It demands that the semantics *directly outputs* the validity. The expressivist often sees their account *explaining why we feel compelled* by the inference (as a matter of practical consistency in our attitudes) as sufficient, even if the formal derivation within the semantic model is complex or requires auxiliary principles beyond bare-bones compositionality.

  3.  **Is it Substantive, Verbal, or Incommensurable?**
      *   **Not Primarily Verbal:** Both sides understand the terms and the problem. They genuinely disagree on what expressivism fundamentally *is* and what its core explanatory burden entails.
      *   **Not *Fully* Incommensurable:** They share the meta-level goal of explaining moral language without robust moral realism and agree on the surface data (embedding, validity). Progress by one standard *can* sometimes be acknowledged by the other (e.g., a formalist might grant a proposal is psychologically interesting even if logically flawed).
      *   **Substantive with Incommensurable *Success Conditions*:** This is the key. The disagreement is about the *primary objective* of a metaethical theory in this domain. Is it to provide a formal logic for the language? Or is it to provide a psychologically plausible account of thought and communication? While related, these are distinct goals. Prioritizing one inevitably makes solutions aiming at the other seem inadequate or misplaced. The debate is static because each side judges proposals by their own primary success condition, finding them wanting.

  4.  **What Would Count as Progress?**
      Given this diagnosis, breaking the impasse requires addressing the divergent priorities:
      *   **A "Two-Factor" Theory that Satisfies Both Camps (Unlikely but Ideal):** A proposal that demonstrably provides:
          1.  A rigorous, compositional semantics validating all relevant inferences *directly*.
          2.  A compelling, non-representational psychological story about attitude expression and reasoning that grounds the semantic values without smuggling in propositions/facts.
          *(This is the Holy Grail. Most attempts are seen as succeeding more on one front than the other.)*
      *   **Formalists Conceding Psychological Plausibility as Sufficient (Unlikely):** Formalists accepting that an account explaining *why* we track logical patterns in moral discourse (due to practical consistency requirements in attitude expression/negotiation) is sufficient, even if the formal semantics isn't as elegantly unified as for descriptive discourse.
      *   **Expressivists Conceding the Need for Proposition-Like Semantics (Emerging Trend):** Many modern expressivists (like Gibbard, Chrisman, Ridge, Toppinen) *explicitly* embrace assigning moral sentences complex, proposition-like semantic values within a compositional framework. Progress here involves refining these frameworks to be more elegant, handle more complexities, and better *explain* how these semantic values are grounded *solely* in non-cognitive attitudes and their functional roles ("What is it *to be for* blaming for murder?"). Success is convincing formalists these constructs *are* meaningfully distinct from realist propositions.
      *   **A Paradigm Shift in Defining Logic/Validity:** Reconceiving logical validity itself in terms of consistency in practical reasoning or commitment structures, rather than truth preservation. (This is ambitious and faces significant hurdles).
      *   **Empirical Input:** Progress in cognitive science regarding how humans actually process and reason with normative language *could* shift the burden. If evidence strongly supports that moral reasoning utilizes distinct psychological mechanisms aligned with expressivism, it might pressure formalists to accept less "standard" logical treatments. Conversely, evidence showing moral reasoning is processed identically to factual belief might bolster the formalist/cognitivist side.
      *   **Changing the Question / Scope Limitation:** Acknowledging that expressivism might best explain *core* moral assertions and disagreements, while a more propositional semantics is needed for complex embeddings. This sacrifices the original ambition of a fully unified account but might be more defensible. Progress would involve clearly delineating the scope.

  **Conclusion:**

  You are correct. The core disagreement fueling the Frege-Geach stalemate is not primarily about technical details, but about **divergent conceptions of what expressivism's core task is and what constitutes success.** The formalist camp prioritizes logical systematicity and compositional semantics as the *sine qua non*. The psychological camp prioritizes explaining moral thought and talk without invoking moral beliefs or facts as fundamental, seeing logic as derivative. This leads them to judge each other's proposed solutions by different, often conflicting, standards.

  **The most plausible path to progress** currently seems to be the refinement of **"new wave" expressivist semantic programs** (Gibbard, Ridge, Chrisman, Toppinen, etc.) that explicitly embrace proposition-like semantic values while fiercely arguing these values are functionally grounded in non-cognitive attitudes, not moral reality. Success here means making these accounts formally robust *and* psychologically compelling enough to satisfy the core expressivist motivation in the eyes of critics. Alternatively, a significant shift in our understanding of logic or cognition could break the deadlock. The debate remains static not because the problem is unsolvable, but because the two sides are, in a crucial sense, solving different problems under the same name.
