  The user wants concrete progress markers. I should emphasize clarifying the question-frames as priority one - otherwise they'll keep circling. After that, formal models of defeasible reasoning might offer common ground.
answer: |-
  The impasse primarily reflects a persistent conflation of distinct questions—metaphysical, epistemological, and semantic—within a single debate, compounded by divergent starting intuitions about moral phenomenology, which together prevent resolution through existing argumentative strategies.  

  **Reasoning:**  
  1. **Divergent Core Questions:**  
     - **Particularists (e.g., Dancy)** focus on the *metaphysics of moral reasons*, defending *holism*: a feature’s moral valence (e.g., pain as bad) can invert across contexts (e.g., pain in punishment as good). For them, morality’s context-sensitivity precludes exceptionless principles.  
     - **Generalists (e.g., McKeever & Ridge)** prioritize *moral epistemology and deliberation*, arguing principles (even defeasible ones) are indispensable for reliable cognition, consistency, and learning. They need not deny holism but insist principles systematize reasons without requiring strict invariance.  

  2. **Empirical Ambiguity:**  
     Psychological evidence (e.g., on pattern recognition vs. rule application) cuts both ways. Particularists cite intuitive "gestalt" judgments (Haidt’s social intuitionism), while generalists note principles scaffold moral development (Turiel’s domain theory) and reduce bias. Neither secures a decisive edge, as cognition likely blends both capacities.  

  3. **Redescriptive Stalemate:**  
     Both sides absorb each other’s cases semantically. Generalists reframe particularist examples using *ceteris paribus* principles (e.g., "Lying is *pro tanto* wrong, but overridden here"). Particularists (e.g., Lance & Little) rebut that "defeaters" are context-specific particulars, not general rules. This mutual co-optation masks ontological disagreement about whether moral properties supervene atomistically or holistically.  

  4. **Intuitional Divergence:**  
     The debate founders on pre-theoretic intuitions about moral experience. When confronting novel cases, particularists *see* irreducible contextual uniqueness (e.g., the "wrongness" of a lie shifting with relationships), while generalists *infer* latent principles (e.g., "Respect autonomy, unless..."). These stances reflect deep-seated differences in moral perception, resistant to dialectical resolution.  

  **Genuine Progress Requires:**  
  - **Conceptual Disambiguation:** Explicitly separating (a) the *metaphysical* question ("Do reasons retain valence across contexts?") from (b) the *epistemological* question ("Can principles guide judgment?") and (c) the *semantic* question ("Can moral knowledge be codified?").  
  - **Formal Modeling:** Tools like default logic (Horty) or causal networks could clarify how defeasible principles interact with context, testing whether holism undermines systematicity.  
  - **Empirical Refinement:** Psychology must distinguish *descriptive* cognition (how we *do* judge) from *normative* competence (how we *should* judge). Evidence that principled cognition reduces error (e.g., in bias mitigation) would bolster generalism; data showing rigid principles distorting context-sensitive virtue would favor particularism.  

  Absent such disentanglement, the debate remains a "dialectical equilibrium" (Väyrynen) where each side’s framework immunizes it against refutation. Progress hinges on agreeing what a resolution *is*—e.g., a unified theory explaining both moral metaphysics and cognition—or accepting a bifurcated picture where context-sensitivity and principled reasoning coexist in tension.
