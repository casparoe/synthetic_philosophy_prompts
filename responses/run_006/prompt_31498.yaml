answer: |-
  Here's a specification of desiderata for an adequate Theory of Evidential Cooperation in Large Worlds (ECL), structured as requested. It categorizes requirements, ties them to concrete cases, marks negotiability, flags tensions, and identifies the most eliminative requirement.

  ### Core Desiderata for ECL

  | **Desideratum** | **Concrete Case/Consideration** | **Non-Negotiable (NN) / Negotiable (N)** | **Tensions With** |
  |-----------------|---------------------------------|------------------------------------------|-------------------|
  | **1. Resolves Acausal Coordination** | Twin PD: Two identical algorithms in isolated cells must (a) mutually defect if they reason causally, (b) mutually cooperate if they recognize their logical link. ECL must enable cooperation *without* causal influence. | **NN** | Finitude, Reference-Class |
  | **2. Handles Predictive Punishment/Reward** | Hitchhiker: A driver helps you iff they predict you’ll pay later. After the ride, paying costs you with no direct benefit. ECL must enforce precommitments *despite* temporal/causal disconnection. | **NN** | Large-World Dependence |
  | **3. Respects Newcomb’s Criterion** | Newcomb’s Problem: ECL must one-box (winning $1M) by treating the predictor’s action as *evidence* of your disposition, not a causal consequence. Rejecting CDT’s two-boxing ($1K) is essential. | **NN** | Correlation-Causation Distinction |
  | **4. Addresses Reference-Class Problem** | **Case:** You face a cooperation dilemma with imperfect clones. Should you cooperate with (a) exact copies, (b) all humans, (c) all sentient beings? ECL must define "copies" precisely (e.g., algorithmic similarity, shared goals) without over/under-inclusion. | **NN** | Finitude, Self-Locating Uncertainty |
  | **5. Anchors in Anthropic Reasoning** | **Case:** You’re one of 1000 identical agents facing a collective action problem. ECL must prescribe action *conditional* on your index (e.g., "I am agent #732") and handle uncertainty over copies (e.g., sleeping beauty problems). | **NN** | Reference-Class, Finitude |
  | **6. Maintains Real-World Robustness** | Large-World Dependence: Voting/promise-keeping must *not* require knowledge of cosmic copy-counts. ECL should approximate "cooperate with detectable near-copies" in small worlds and scale gracefully. | **NN** | Acausal Coordination, Finitude |
  | **7. Ensures Finitary Tractability** | **Case:** A real agent with limited compute can’t sum over all possible Boltzmann brains. ECL must avoid infinities, uncomputable similarity metrics, or exact symmetry requirements. | **NN** | Acausal Coordination, Reference-Class |
  | **8. Distinguishes Evidence from Causation** | Must explain *why* acting on correlations (e.g., Omega’s prediction) is rational while avoiding spurious ones (e.g., "rain dances cause rain" via confounders). Cannot reduce to "all correlations matter". | **N** (Scope of explanation varies) | Newcomb’s Criterion |

  ### Key Tensions & Tradeoffs
  - **Finitude vs. Acausal Coordination (NN):** Exact coordination requires perfect symmetry (math), but tractability demands fuzzy heuristics (e.g., "cooperate if similarity > threshold"). Tension is unavoidable; adequacy requires bounding the error.
  - **Reference-Class vs. Self-Location (NN):** Defining "copies" precisely conflicts with indexical uncertainty (e.g., "which copy am I?"). Solutions must integrate both (e.g., updatelessness).
  - **Large-World Robustness vs. Predictive Punishment (NN):** Voting seems rational even without knowing copy-counts, but Hitchhiker relies on exact prediction. Adequate ECL must reconcile via *conditional* strategies (e.g., "cooperate if you expect to be simulated").

  ### The Most Eliminative Desideratum
  **Reference-Class Problem (NN)** eliminates the most contenders:
  - **EDT:** Cooperates indiscriminately with *any* correlated agent (e.g., all cancer patients in a smoking lesion), leading to spurious cooperation/free-rider problems.
  - **CDT:** Only cooperates with causal influences (e.g., via contracts), failing Twin PD/Hitchhiker entirely.
  - **FDT (Functional Decision Theory):** Requires exact algorithmic equivalence. Fails if copies are imperfect (e.g., different hardware) or if the universe has unbounded variants (reference-class under-specified).

  ### Why This Spec?
  - Your listed cases (Newcomb, Twin PD, Hitchhiker, reference-class, large-world, finitude, self-locating) are all included and marked NN/N.
  - **Pushback:** The correlation-causation distinction is negotiable *only* in how deeply the theory must explain it (e.g., "shut up and calculate" vs. metaphysical grounding). But avoiding spurious correlations is NN.
  - **Missing?** A desideratum for *dynamic consistency* (no money pumps) is implied by real-world robustness but could be explicit. Some camps also demand *Pareto optimality* in dilemmas (N).

  ### Summary of Adequacy
  An ECL theory must **non-negotiably** resolve Twin PD/Hitchhiker via acausal coordination, one-box in Newcomb, define reference classes anthropically, and work in finite worlds. The **primary tension** is between mathematical ideals (perfect symmetry) and engineering constraints (fuzzy, bounded agents). **Reference-class precision** is the litmus test separating ECL from EDT/CDT/FDT. If your theory can’t say who counts as a "copy" without begging the question or invoking infinities, it fails.
