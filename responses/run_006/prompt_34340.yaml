prompt: |-
  im in an upper-level seminar on the epistemology of technology, something like "Knowing With Machines," and our final project is to design and actually run a 75-minute activity for the class. there are 17 of us, mostly third and fourth year undergrads. I want my activity to be about epistemic dependence on AI and the erosion of understanding: the worry that when you can always ask an LLM for the answer, you stop building the kind of understanding that lets you notice when the answer is wrong or adapt when the task changes. I want the class to feel this happen to them in real time before anyone names it.

  my rough idea is to split the class into three conditions and give everyone the same rule-based task, like converting numbers between bases or decoding a simple cipher. one group can only use an oracle (a student at the front with a hidden answer key) that gives the correct output for any input but never explains the rule. another group gets a one-page handout that actually explains the rule but has to do all the work themselves. the third group gets both. then in phase two i change the task slightly, like a new base or a new cipher key, or the oracle starts making subtle errors, and we see who adapts and who notices. my guess is the oracle group will sail through phase one and then collapse, and the handout group will be slower at first but do better in phase two, but i need help turning this into a real runnable design.

  can you write me the full activity: exact rules, materials, a payoff scheme that doesnt use real money, a timeline for 75 minutes, and a debrief that maps specific moments in the activity onto the philosophical point (cognitive offloading, deskilling, the gap between producing correct outputs and understanding the rule). also tell me what will predictably go wrong the first time i run it, and be honest about which part of real AI-dependence this activity cant reproduce so i know what i have to supply in discussion.
reasoning: |-
  We are designing a 75-minute activity for an upper-level seminar on the epistemology of technology, focusing on epistemic dependence on AI and the erosion of understanding. The goal is to have students experience the phenomenon before naming it.

  Activity Title: "The Rule Keeper's Dilemma"

  Overview:
  - Students are split into three groups: Oracle, Handbook, and Hybrid.
  - Phase 1: All groups perform a rule-based task (e.g., converting numbers from base 10 to base 3).
  - Phase 2: The task changes (e.g., converting to base 4) or the oracle introduces errors, and we observe how each group adapts.

  Groups:
  1. Oracle Group: Can ask an "oracle" (a student volunteer with a hidden answer key) for the correct output for any input but gets no explanation of the rule.
  2. Handbook Group: Receives a one-page handout explaining the rule and must do the work themselves without any oracle.
  3. Hybrid Group: Has access to both the oracle and the handout.

  Materials:
  - For the Oracle: 
      - Answer key for Phase 1 (base 10 to base 3 conversions for numbers 1-50, precomputed).
      - Answer key for Phase 2 (base 10 to base 4 conversions for numbers 1-50, precomputed) OR a modified key with subtle errors (if you choose the error route).
  - Handout: A one-page explanation of how to convert from base 10 to any base (with examples for base 3 in Phase 1).
  - Worksheets for each student (or group) with 10 problems for Phase 1 and 10 problems for Phase 2 (different numbers for each student to prevent copying).
  - Timer or clock.
  - Whiteboard or projector for instructions and timer.
  - Optional: Small prizes (e.g., candy, extra credit points, or symbolic tokens) for motivation.

  Timeline (Total: 75 minutes):

  1. Introduction (5 minutes)
  2. Setup and Group Assignment (5 minutes)
  3. Phase 1: Initial Task (20 minutes)
  4. Transition (2 minutes)
  5. Phase 2: Changed Task (20 minutes)
  6. Group Reporting and Data Collection (8 minutes)
  7. Debrief and Discussion (15 minutes)

  Detailed Steps:

  1. Introduction (5 minutes):
     - Explain that they will be doing an activity about problem-solving and tools. Do not reveal the philosophical point yet.
     - Briefly describe the task: converting numbers from base 10 to base 3 (or another base) in Phase 1, and then a similar task in Phase 2.
     - Mention that there are three conditions, and they will be assigned to one.

  2. Setup and Group Assignment (5 minutes):
     - Assign students randomly to three groups (Oracle, Handbook, Hybrid). Since there are 17 students, the groups will be roughly 5-6 each.
     - Choose one student to be the oracle. This student should be someone who is not in any group (so they remain neutral) and will be the oracle for both Oracle and Hybrid groups. Alternatively, if you don't want to remove a student from participation, you can have the oracle be a TA or even the instructor, but using a student is more engaging.
     - Distribute materials:
          - Handbook Group: Each student gets the handout and a worksheet (Phase 1).
          - Oracle Group: They get a worksheet (Phase 1) and know they can go to the oracle (who is at the front) to get answers.
          - Hybrid Group: Each student gets the handout and the worksheet (Phase 1) and can also use the oracle.
     - Explain the rules for each group:
          - Oracle Group: They can ask the oracle for the answer to any input (a number in base 10) and the oracle will give the base 3 equivalent. They cannot ask for the rule. They must write down the answer they get and then move on. They are not allowed to share answers with each other (to prevent collaborative rule discovery).
          - Handbook Group: They have the handout that explains the rule. They must work individually (or in pairs if you prefer, but for the effect, individual might be better) to solve the problems without any oracle.
          - Hybrid Group: They have the handout and can also ask the oracle. They can use either resource as they wish.

  3. Phase 1: Initial Task (20 minutes):
     - Start the timer. Each student works on converting 10 numbers (from base 10 to base 3). The numbers should be different for each student (or at least for each group) to prevent direct copying. Example numbers: 5, 12, 20, 31, 42, 8, 17, 25, 38, 49.
     - The oracle sits at the front with the Phase 1 answer key. When a student from Oracle or Hybrid group asks, the oracle gives the answer without explanation (e.g., "5 in base 3 is 12").
     - The instructor circulates to ensure rules are followed.

  4. Transition (2 minutes):
     - Collect Phase 1 worksheets (or have students stop writing).
     - Announce that the task is changing for Phase 2. For Phase 2, they will convert numbers from base 10 to base 4 (or if you choose the error condition, the oracle will now sometimes give incorrect answers for base 3). 
     - Distribute Phase 2 worksheets (with new numbers: e.g., 6, 14, 22, 33, 45, 9, 18, 27, 39, 50).

     Note: I recommend changing the base (to base 4) for Phase 2 because it is a clear change and the handbook group can adapt by applying the same method. Alternatively, if you want to test error detection, have the oracle in Phase 2 give wrong answers for some inputs (e.g., for numbers above 30, the oracle gives the base 3 equivalent as if it were base 4, which would be wrong). But changing the base is simpler and cleaner.

  5. Phase 2: Changed Task (20 minutes):
     - The Handbook and Hybrid groups get the same handout (which explains conversion to any base, so it still applies). The Hybrid and Oracle groups can still use the oracle, but note: the oracle now has the answer key for base 4 (if you change the base) OR is giving incorrect answers for some of the base 3 conversions (if you choose the error condition). 
     - If you change the base to 4, then the oracle is giving correct base 4 answers. The twist is that the Handbook group must figure out that they can use the same rule for base 4, while the Oracle group might not know the rule and will just get answers for base 4 without understanding. The Hybrid group might use either.
     - Alternatively, if you choose the error condition: The oracle now gives incorrect answers for about 30% of the queries (randomly, but predetermined). For example, for the same base 3 conversion, the oracle might give a wrong answer for some numbers. This tests error detection.

     Recommendation: I suggest changing the base because it tests adaptation to a new task and the handbook group has the tools to adapt. The error condition might be more about trust and error detection, which is also valuable but slightly different.

  6. Group Reporting and Data Collection (8 minutes):
     - Collect worksheets from Phase 2.
     - Quickly tally the results on the board for each group for both phases (without judgment). For Phase 1, count the average number of correct answers per group. For Phase 2, do the same.
     - Also, for Phase 2, if you did the error condition, note how many students in each group reported that the oracle was wrong (if any) or expressed doubt.

     Alternatively, if time is short, you can skip individual tallying and just ask groups to report their experience.

  7. Debrief and Discussion (15 minutes):
     - Start by asking the groups to describe their experience, especially in Phase 2.
     - Then, reveal the philosophical point: cognitive offloading, deskilling, and the gap between producing correct outputs and understanding the rule.

     Map specific moments to concepts:
     - Phase 1: The Oracle group likely finished quickly and accurately, but without building an understanding. The Handbook group struggled initially but built understanding. The Hybrid group had a choice and might have used the oracle for speed, thus avoiding deep engagement.
     - Phase 2 (changed base): The Handbook group could adapt because they understood the rule. The Oracle group, when faced with a new base, either had to start from scratch (if they didn't figure out the rule) or were slow. The Hybrid group might have adapted if they used the handbook, but if they relied on the oracle, they might not have noticed the change (if the oracle was still giving answers without explanation). 
     - Phase 2 (oracle errors): The Handbook group would likely spot errors because they know the rule. The Oracle group might not notice because they don't know the rule and are trusting. The Hybrid group might be in between.

     Key points to draw out:
     - Epistemic dependence: The Oracle group became dependent on the oracle and did not develop the skill themselves.
     - Erosion of understanding: When we offload cognitive tasks, we might not build the mental models that allow for error detection and adaptation.
     - The Hybrid group: This mimics real-world use of AI (like using ChatGPT alongside our own knowledge). Some might use it as a crutch, while others might use it to check their work. But note: in the real world, we often don't have a handbook and an AI, we have the AI as the primary source.

     What the activity cannot reproduce:
     - In real AI dependence, the AI is often faster and more convenient than any handbook, so the temptation to offload is stronger.
     - The handbook in this activity is a clear and accurate explanation. In reality, explanations from AI can be flawed or incomplete, and we might not have a reliable handbook.
     - The activity is a short burst, while real erosion of understanding happens over time.

     Predictable problems:
     - Students in the Handbook group might get frustrated and try to cheat by asking the oracle. Monitor this.
     - The oracle might get overwhelmed if too many students come at once. Solution: Have students line up or set a limit on queries (e.g., one query at a time).
     - Some students in the Oracle group might try to reverse-engineer the rule. That's okay because it shows they are trying to understand, but it might break the condition. In the debrief, you can note that in real AI use, people often don't try to reverse-engineer because the systems are too complex.
     - Time management: The 20 minutes might be too long or too short. Have extra problems ready.

     Payoff Scheme (non-monetary):
     - You can award "epistemic points" on the board for each group based on performance (Phase 1 and Phase 2) and then convert these into a small reward (e.g., candy, or just the satisfaction of winning). Or, make it a competition: the group with the highest Phase 2 score wins. But the real payoff is the learning experience.

     Alternative Task:
     - If base conversion is too mathematical, consider a simple cipher. For example:
          Phase 1: Caesar cipher with shift 3 (A->D, B->E, etc.)
          Phase 2: Shift 4, or a different cipher (e.g., Atbash cipher).
     - Handout: Explains how to encode/decode a Caesar cipher with any shift.
     - Oracle: For any plaintext, gives the ciphertext (without revealing the shift).

     However, base conversion is more structured and less prone to ambiguity.

     Final Note:
     - Be flexible and adjust based on the class dynamics. The main goal is to create an experience that makes the philosophical issue tangible.

     Revised Timeline with Cipher Example (if you prefer):

     Phase 1: Encode English words (3-5 letters) using a Caesar shift of 3.
     Example words: CAT, DOG, FISH, BIRD, FIVE, SIX, TEN, ... (10 words per student)

     Phase 2: Encode using a Caesar shift of 4 (or a different shift, or a different cipher).

     The rest of the structure remains the same.

     Choose the task that you think the class will find engaging and accessible.

     Good luck!
answer: |-
  ### **Epistemic Dependence Activity: "The Oracle's Curse"**  
  **Core Goal:** Make students experience the trade-off between efficiency and understanding when using "oracles" (simulating AI) before discussing epistemic dependence, deskilling, and cognitive offloading.

  ---

  ### **Materials**  
  1. **Task Sheets (Phase 1 & 2):**  
     - **Phase 1 (Base Conversion):**  
       - Convert 10 base-10 numbers to **base-3** (e.g., `7, 12, 20, 31, 42, 8, 17, 25, 38, 49`).  
     - **Phase 2 (Changed Task):**  
       - Convert 10 new numbers to **base-4** (e.g., `5, 14, 22, 33, 45, 9, 18, 27, 39, 50`).  
     *Alternative:* Use a **Caesar cipher** (Phase 1: shift +3; Phase 2: shift -2).  

  2. **Oracle Materials:**  
     - Hidden answer keys for base-3 (Phase 1) and base-4 (Phase 2).  
     - A bell or sign saying "Oracle" for the student volunteer.  

  3. **Handbook:**  
     - One-page guide explaining base conversion (e.g., "Divide by the base, record remainders in reverse").  

  4. **Group Signs:** "Oracle Only," "Handbook Only," "Hybrid."  
  5. **Timer/Projector:** Display countdowns.  
  6. **Payoff Tokens:** Sticky notes as "Knowledge Points" (KP) — awarded for speed/accuracy.  

  ---

  ### **Group Assignment (5 min)**  
  - **Oracle Only (O):** 6 students. Can query the oracle (student volunteer) for answers.  
  - **Handbook Only (H):** 6 students. Receive the handbook. No oracle access.  
  - **Hybrid (Hy):** 5 students. Get handbook + oracle access.  
  - **Oracle Volunteer:** 1 student (neutral, uses hidden answer keys).  

  ---

  ### **Rules**  
  #### **Phase 1: Base-3 Conversion (20 min)**  
  1. **O Group:**  
     - May ask the oracle: "What is [number] in base-3?"  
     - Oracle responds **only with the answer** (e.g., "12 in base-3 is 110").  
     - **No questions about the rule allowed.**  
  2. **H Group:**  
     - Use the handbook to solve conversions. No oracle access.  
  3. **Hy Group:**  
     - May use handbook, oracle, or both.  
  4. **Payoff:**  
     - 1 KP per correct answer.  
     - Bonus 5 KP for the first 3 students to finish all 10 correctly.  

  #### **Phase 2: Base-4 Conversion (20 min)**  
  - **New rule:** The task shifts to base-4.  
  - **Oracle secretly changes behavior:**  
    - Gives **correct base-4 answers** but **adds subtle errors to 3/10 responses** (e.g., 33 → 201 instead of 201).  
  - **Payoff:**  
    - 1 KP per correct answer.  
    - 10 KP bonus for anyone who flags an oracle error (with proof).  

  ---

  ### **Timeline (75 min Total)**  
  | **Segment**       | **Time** | **Details** |  
  |-------------------|----------|-------------|  
  | **Intro**         | 0-5 min  | Explain task & groups. **Do NOT reveal the philosophical goal.** |  
  | **Phase 1**       | 5-25 min | Groups work. Circulate to enforce rules (e.g., O group can’t ask for rules). |  
  | **Transition**    | 25-27 min| Collect Phase 1 sheets. Distribute Phase 2 sheets. |  
  | **Phase 2**       | 27-47 min| Groups work. Oracle introduces errors. |  
  | **Data Collection**| 47-55 min| Tally KPs: <br>- Phase 1 accuracy/speed. <br>- Phase 2 accuracy + error reports. |  
  | **Debrief**       | 55-75 min| Reveal the experiment’s purpose + discussion. |  

  ---

  ### **Predicted Outcomes**  
  - **Phase 1:**  
    - **O Group:** Fastest, highest KPs (rely on oracle).  
    - **H Group:** Slowest, may have errors (learning curve).  
    - **Hy Group:** Mix of strategies (some use oracle for speed).  
  - **Phase 2:**  
    - **O Group:** Struggle to adapt. Fail to spot oracle errors (deskilling).  
    - **H Group:** Adapt quickly (built understanding). May spot errors.  
    - **Hy Group:** Split: Those using the handbook adapt; oracle-reliant students fail.  

  ---

  ### **Debrief Discussion (20 min)**  
  Link activity moments to philosophical concepts:  

  | **Activity Moment**          | **Philosophical Concept**                                                                 | **Discussion Questions** |  
  |------------------------------|-------------------------------------------------------------------------------------------|--------------------------|  
  | **O Group’s Phase 1 speed**  | **Cognitive offloading:** Outsourcing labor to an oracle frees attention but prevents learning. | *"Why did the oracle group avoid learning the rule? Would you do this with ChatGPT?"* |  
  | **O Group’s Phase 2 failure**| **Deskilling:** Dependency erodes ability to adapt/verify.                                | *"Why couldn’t the oracle group detect errors or adapt? How does this mirror using AI for essays/code?"* |  
  | **H Group’s Phase 2 success**| **Understanding vs. output:** Real learning requires struggle (H group built mental models). | *"Why did the handbook group adapt better despite being slower? Is efficiency always worth it?"* |  
  | **Hy Group’s split outcomes**| **Epistemic dependence:** Even with resources, we default to offloading if it’s easier.   | *"Did hybrid students use the handbook or oracle? Why? How does this reflect real-world AI use?"* |  
  | **Oracle errors in Phase 2** | **The illusion of correctness:** Without understanding, we can’t audit outputs (AI hallucinations). | *"Why did no one question the oracle until errors were obvious? How do we ‘outsource’ critical thinking?"* |  

  ---

  ### **What Will Go Wrong (And How to Fix)**  
  1. **Oracle overwhelmed:** Too many students query at once.  
     - **Fix:** Limit queries to 1 per student at a time. Enforce a line.  
  2. **Handbook group frustration:** They may feel "punished" for not having oracle.  
     - **Fix:** In debrief, validate their struggle as key to deeper learning.  
  3. **Students reverse-engineer the rule:** Especially in O/Hy groups.  
     - **Fix:** Allow it! Debrief: *"Did anyone try this? With real AI, this is often impossible due to complexity."*  
  4. **Time shortages:** Phase 1 runs long.  
     - **Fix:** Reduce tasks to 8 problems instead of 10.  
  5. **Hybrid group underutilizes handbook:** Most will default to the oracle.  
     - **Fix:** Highlight this in debrief as proof of convenience bias.  

  ---

  ### **What the Activity Can’t Replicate (Clarify in Debrief)**  
  - **Real AI’s opacity:** Unlike the oracle, LLMs don’t have a "hidden rule" — their workings are non-human and unexplainable.  
  - **Scale of deskilling:** This activity shows short-term effects; real erosion occurs over months/years of reliance.  
  - **Social factors:** Real AI use involves peer pressure, corporate incentives, and normalization of dependence.  
  - **Effort illusion:** Students know this is a simulation. Real AI feels effortless, making offloading more seductive.  

  ---

  ### **Instructor Notes**  
  - **Emphasize:** The goal isn’t to vilify AI but to expose trade-offs. Ask: *"When is offloading worth the risk?"*  
  - **End with:** "Would you use an oracle now that you’ve seen the curse?"  
  - **Alternative Tasks:** If base conversion is too niche, use ciphers or simple logic puzzles (e.g., turn `A → D, B → E` into `A → X, B → Y`).  

  This design forces visceral engagement with deskilling, priming students for deeper debate. Good luck!
