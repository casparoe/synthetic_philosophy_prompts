  - Is this a clash of unprovable moral axioms?  
  - Is it about differing harm definitions?  
  - Or just semantic differences in terms like "exploitation"?  

  Then they want to know if there's any way forward or if it's truly stuck.  

  Hmm... Their frustration is palpable. They've done the reading but hit a wall. They're not seeking more studies; they want a meta-understanding of why debate fails. This is philosophy territory now.  

  I should validate their observation first – yes, this is classic intractable policy disagreement. The data point about "nobody budges" feels accurate. When values conflict, evidence gets weaponized.  

  For their first question: Definitely axiom clash. Proponents prioritize concrete harms (deaths) and liberty. Opponents prioritize symbolic harms (degradation) and virtue ethics. Neither side "proves" their foundation – they're starting points.  

  Harm perception differs radically too. One side sees death as ultimate harm, the other sees commodification as corrosive harm. Semantic differences matter – "exploitation" means coercion to some, but to others, it's any unequal transaction.  

  Now the tough part: Is there any path forward? The user seems to hope for one while suspecting there isn't. I should avoid false optimism but suggest subtle shifts.  

