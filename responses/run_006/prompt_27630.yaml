  #### Candidate Principle 2: Pure Severity Threshold
  - **Principle**: It is permissible to violate the constraint against φ-ing if the harm caused by φ-ing falls below a certain severity threshold, regardless of who is targeted. Above this threshold, violations are impermissible except when directed at the wrongdoer. The threshold is calibrated such that:
