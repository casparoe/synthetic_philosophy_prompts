prompt: |-
  Indirect normativity gets much of its appeal from a division of labor: rather than trying to state our values directly, we specify a procedure of idealization or reflection and treat its output as authoritative. That division of labor, however, hides a cluster of unresolved questions about what the procedure is, whose values enter it, and why its output should bind anyone. A research initiative plans to fund two years of conceptual work on these foundations, at roughly the scale of three or four philosophers, with the explicit aim of settling the questions whose answers would most change how the rest of the field proceeds — not producing a survey of positions or an implementation. You sit on the committee that must set the agenda.

  Give the three or four questions you would fund first, ranked, and defend the ranking. Your answer should not read as a list of interesting topics. For each question, explain what makes it prior to the others rather than downstream of them; how far a small conceptual program could realistically get in two years and what a decisive result would look like; and whether the question is comparatively neglected or already crowded. Where the criteria of importance, tractability, neglectedness, and dependence among questions pull in different directions, say how you resolve the conflict. Engage at least briefly with candidate questions such as: how to specify idealization conditions without quietly presupposing a substantive value theory; whether the deliverances of an idealized process have authority over the unidealized agents whose values are its input; whether convergence of idealized deliberation should be assumed, argued for, or abandoned; and how the framework should handle persistent disagreement among the inputs to the process. You need not choose from that list, but the ranking should show enough grip on the field's internal fault lines that a different committee member could not have produced it by shuffling familiar keywords. Finally, identify one development — conceptual or technical — that would most cause you to reorder the list, and say why.
reasoning: |-
  Hmm, this is a deep and complex question about indirect normativity in philosophy. The user seems to be part of a funding committee that needs to prioritize foundational questions about value idealization procedures. 

  The query reveals several layers: first, it acknowledges the appeal of indirect normativity's division of labor but points out core unresolved issues. Second, it sets concrete constraints - a 2-year project for 3-4 philosophers focused on agenda-setting questions that could redirect the field. Third, it demands rigorous prioritization with defense of ranking based on fundamentality, tractability and neglectedness.

  I notice the user is likely an academic philosopher or interdisciplinary researcher given the technical terminology and contextual awareness. Their unspoken needs probably include: wanting to avoid superficial surveys, seeking genuine conceptual leverage points, and needing defensible criteria that committee members would accept. There might also be anxiety about funding something too narrow versus too vague.

  The core challenge is sequencing - which questions must be answered before others can be properly addressed. For example, without clarifying why idealized outputs bind real agents (the authority question), debates about idealization procedures become academic exercises. Similarly, disagreement handling seems downstream of knowing whether convergence is even plausible.

  I'm struck by how the tractability constraint shapes this. Some questions like "how to specify idealization without presupposing values" are crucial but may require decades of work. Whereas "whether to assume convergence" might be resolved with decisive counterexamples or formal models within 2 years. The neglectedness factor matters too - authority gets less attention than procedural design.

  The technical development caveat is smart. If someone formalized value aggregation under persistent disagreement, that could elevate that question's priority. Currently it feels secondary because we lack tools to even frame it rigorously.
answer: |-
  Here is my ranked agenda, designed to maximize foundational impact within the 2-year constraint, with defenses addressing fundamentality, tractability, neglectedness, and dependencies:

  **Ranked Questions:**

  1.  **Question:** *What constitutes the normative authority of the idealized output over the actual, unidealized agent?*  
      **Why Prior?** This is the *sine qua non* – without a compelling answer to *why* anyone should care about the procedure's output, the entire indirect normativity project collapses into an arbitrary exercise. Debates about idealization conditions (e.g., full information, coherence) or convergence are meaningless unless we first understand *why* the result binds the agent whose values were input. This question probes the core justificatory link.  
      **Tractability & Decisive Result:** A 2-year project can rigorously map the *logical space* of possible justifications (e.g., constitutive agency, best understanding of self, hypothetical endorsement, epistemic privilege) and identify fatal flaws or promising paths for each. A decisive result would be a conclusive argument showing one family of justifications is *structurally incapable* of grounding authority (e.g., demonstrating a fundamental "authority gap" between idealized self and actual self), or identifying necessary/sufficient conditions any successful justification must meet.  
      **Neglectedness:** While often *assumed* (e.g., "of course you'd endorse it if rational"), the *justification* for that assumption is under-theorized compared to procedural details. It's the silent foundation everyone walks on without inspecting.

  2.  **Question:** *Must convergence of idealized deliberation be assumed, argued for independently, or abandoned as a necessary feature? What are the implications of each stance?*  
      **Why Prior?** This directly shapes the *viability and interpretation* of the procedure. If convergence *must* be assumed for the output to be normative, the project relies on a potentially unfounded optimism. If it must be argued for, the argumentative burden shifts dramatically, potentially requiring substantive value commitments *before* the procedure runs. If abandoned, the framework must fundamentally change (e.g., accept plural outputs, relativize authority). This question is upstream of designing the procedure itself.  
      **Tractability & Decisive Result:** Conceptual analysis can clearly delineate the options and their entailments. A decisive result would be a compelling argument that one stance is *incoherent* or *inescapable* within the indirect normativity paradigm (e.g., showing that abandoning convergence fatally undermines authority, or that assuming it unavoidably smuggles in values). Formal modeling could explore convergence likelihood under different constraints.  
      **Neglectedness:** Often treated as an optimistic background assumption. Explicitly confronting the *necessity* and *justifiability* of convergence is less common than debating *how* to achieve it if assumed.

  3.  **Question:** *Can the conditions of idealization (information, rationality, perspective) be specified without implicitly relying on a substantive normative theory? If not, what does this imply for the "indirect" claim?*  
      **Why Prior?** This attacks the purported *indirectness* itself. If specifying "full information," "coherence," or "impartiality" unavoidably requires prior normative commitments (e.g., about what information is relevant, what coherence entails, what counts as impartial), then the procedure isn't truly isolating or discovering values – it's transforming them based on hidden inputs. This questions the core selling point.  
      **Tractability & Decisive Result:** Analysis can examine paradigmatic specifications for circularity or hidden presuppositions. A decisive result would be either: a) A concrete demonstration that a major proposed specification *necessarily* relies on a specific normative commitment, or b) A successful, non-question-begging specification for a core element (e.g., "information relevance").  
      **Neglectedness:** Highly discussed, but often in the context of specific proposals. A focused, systematic effort to find a general, presupposition-free specification (or conclusively show its impossibility) is valuable. It's crowded *as a problem*, but less so *as a focused target for a decisive verdict*.

  4.  **Question:** *How should the framework handle persistent, fundamental disagreement *among the inputs* to the process (e.g., between different actual agents)?*  
      **Why Last/Potentially Downstream?** While crucial, this often *presupposes* answers to the first three. Questions of authority (Who does the output bind? Everyone? Only participants?), convergence (Is a single output even expected?), and the nature of idealization (Does the procedure "purify" conflicting values or aggregate them?) heavily constrain the approach to disagreement. Tackling disagreement first risks building on sand.  
      **Tractability & Decisive Result:** Conceptual work can catalog strategies (aggregation, dialogue procedures, meta-consensus) and their limitations given different answers to Q1-3. A decisive result would be showing a dominant strategy is incoherent or demonstrating that *any* viable strategy requires abandoning core tenets of indirect normativity (e.g., by necessitating a prior substantive theory of fairness in aggregation).  
      **Neglectedness:** Relatively neglected *within the core justification literature* of indirect normativity, often deferred to political philosophy or social choice theory. Bringing it squarely into the foundational debate is needed.

  **Resolving Conflicts:** Importance (field-changing potential) is paramount. Q1 is the highest stakes. Tractability is weighted heavily given the 2-year limit; Q2 and Q3 offer clearer paths to decisive negative results ("this *can't* work") or necessary conditions. Neglectedness breaks ties; Q1's foundational justification is surprisingly under-scrutinized compared to procedural mechanics (Q3). Dependence dictates the order: Q1 (Authority) > Q2 (Convergence) > Q3 (Presupposition) > Q4 (Disagreement). You can't resolve disagreement without knowing what the procedure's authority and output mean.

  **Why Not Just Shuffle Keywords?** This ranking prioritizes the *justificatory bedrock* (Authority) and *structural viability* (Convergence) before tackling the *purity* of the mechanism (Presupposition) and its *social application* (Disagreement). A committee member prioritizing "purity of procedure" first (Q3) or "practical application" first (Q4) would produce a fundamentally different agenda, reflecting a belief that technical refinement or real-world implementation is more urgent than securing the foundations of normativity and convergence. This order reflects the view that without answers to authority and convergence, debates about presupposition and disagreement lack a stable framework.

  **Development Causing Reordering:** A **rigorous formal model demonstrating the near-inevitability of value convergence under plausible, minimally substantive idealization constraints** would dramatically elevate Q2 (Convergence) to the top spot. If such convergence could be robustly *proven* without heavy presuppositions, it would partially answer Q1 (authority via epistemic privilege/self-understanding) and Q3 (showing the constraints weren't question-begging), while making Q4 (disagreement) more tractable (focusing on aggregating convergent outputs). This would shift the agenda towards refining the model and exploring its authority implications. Conversely, a proof of necessary *non*-convergence would force a radical re-evaluation of the entire project, pushing Q2 and Q1 even higher.
