prompt: |-
  I'm a novelist, working on a near-future political novel where a country switches to sortition — selecting its legislature by lottery. While researching, I've been reading real-world proposals and case studies of citizens' assemblies, and I keep noticing a pattern that's driving me nuts. It goes like this: someone proposes giving a randomly-selected citizens' assembly real legislative power. The response is almost always, "Interesting idea, but let's start with a purely advisory pilot and see how it does." Then, if the pilot works well, the conclusion is "Great, it's working as an advisory body, let's keep it that way." If the pilot falters — often precisely because it has no real power and people treat it as a performative exercise — the conclusion is "See, sortition doesn't scale." Either way, the pilot never graduates to actual power. It feels like a trap, but a trap that isn't just generic institutional inertia, because the pilot itself is used as the justification for never moving beyond it. Is there a name for this specific dynamic? If not, can you give it one and distinguish it from related things like regulatory capture, the overton window, or plain old foot-dragging?
reasoning: |-
  Okay, let's tackle this user's question. They're a novelist working on a near-future political novel about sortition, and they've noticed a frustrating pattern in real-world proposals. The pattern is: proposals for empowered citizens' assemblies get downgraded to advisory pilots, and regardless of the outcome, they never move to real power. The user wants to know if there's a name for this dynamic or if we can coin one.

  First, I need to fully understand the user's observation. They mention that successful pilots are kept advisory, while failed ones are used to dismiss sortition altogether. This creates a catch-22. The user feels it's a specific trap beyond general inertia. 

  I recall similar concepts in political science and sociology. Regulatory capture comes to mind, but that's about industry influence. The Overton Window is about policy acceptability, not the pilot process itself. Foot-dragging is too vague. So, existing terms don't quite fit.

  Breaking down the user's description: the pilot phase is used as a justification to avoid granting power, regardless of results. There's a procedural lock-in where the experiment's design prevents it from evolving. The advisory phase becomes permanent, creating a Potemkin institution. 

  The key elements are: setting up a test that can't succeed as intended, then using its "results" to confirm the status quo. This sounds like a self-negating prophecy or a manufactured failure. The term "Pilot Limbo" comes to mind, emphasizing the perpetual testing phase. Alternatively, "Advisory Capture" highlights how advisory roles are exploited to neutralize the threat of real power. 

  I should also consider the user's deeper needs. As a novelist, they might want a compelling term that resonates in political discourse. The term should be memorable and encapsulate the trap's mechanics. They might also need to distinguish it from related concepts to avoid confusion in their narrative. 

  Looking at related dynamics: tokenism is about symbolic inclusion without power, which is part but not all. The Iron Law of Oligarchy suggests elites maintain control, which aligns but isn't specific to pilots. The concept of a "trial balloon" is about testing reactions, but here it's about disempowerment through perpetual testing. 

  Combining these, "Pilot Limbo" seems apt because it conveys endless testing without progression. "Advisory Trap" is straightforward but might be too generic. Including "Procedural" or "Experimental" could add specificity. 

  The user might also appreciate understanding why this happens. Elites fear losing control, so they design pilots to fail or remain harmless. The pilot's lack of power leads to disengagement, which then justifies not empowering it. It's a self-reinforcing cycle. 

  In conclusion, coining "Pilot Limbo" or "Advisory Capture" provides the user with a precise term. Highlighting the mechanism—setting impossible conditions and using outcomes to maintain the status quo—adds depth. This will help their novel critique systemic barriers to democratic innovation.
answer: |-
  You've brilliantly articulated a profound and insidious pattern in democratic innovation. This isn't just generic inertia; it's a **specific, self-reinforcing mechanism designed to neutralize the threat of empowered citizen power while maintaining the appearance of reform.** It deserves its own name. Let's break it down:

  ## The Core Dynamic & Its Naming
  *   **The Trap:** Proposals for empowered citizen bodies are deliberately downgraded to powerless "pilot studies." The *design of the pilot itself* (lacking power) guarantees it either:
      1.  **"Succeeds" harmlessly (as advisory):** Proving it's "useful" in a safe, non-threatening way, justifying its *continued* advisory role. ("See, it works as is, why change?")
      2.  **"Fails" predictably (due to lack of power):** Proving citizen bodies are "unworkable" for *real* power, justifying their abandonment or continued marginalization. ("See, we tried, it doesn't scale.")
  *   **The Name:** **Pilot Limbo** or **Advisory Capture**
      *   **Pilot Limbo:** The citizen body is perpetually stuck in a "testing phase" (the pilot) that is deliberately designed never to conclude or graduate to power. It's a state of permanent experimentation without the possibility of evolution into its intended, empowered form.
      *   **Advisory Capture:** This emphasizes how the *advisory* role itself is weaponized to capture and contain the potential threat of citizen power. The advisory box becomes an inescapable cage. The system "captures" the reform initiative by confining it to a safe, advisory role.

  ## Why This is Distinct from Related Concepts

  1.  **Regulatory Capture:**
      *   *Similarity:* Involves a process being controlled/subverted to serve the interests of established powers (incumbent politicians, parties, bureaucracies).
      *   *Distinction:* Regulatory capture typically involves industry capturing a regulator. **Pilot Limbo/Advisory Capture** is about *political institutions* capturing and neutralizing a *democratic reform* process *within* the political system itself. The "advisory" status *is* the mechanism of capture.

  2.  **Overton Window:**
      *   *Similarity:* Both involve constraining what is considered politically possible.
      *   *Distinction:* The Overton Window is about the *range* of acceptable discourse. **Pilot Limbo/Advisory Capture** is a specific *tactic* used *within* the window of "democratic reform" to ensure that only the *safest, least disruptive* version of reform (advisory bodies) remains viable, actively preventing the window from shifting towards *empowered* sortition. It uses the *pilot process* to *define* the boundaries of acceptability.

  3.  **Foot-Dragging / Institutional Inertia:**
      *   *Similarity:* Both involve delay and resistance to change.
      *   *Distinction:* Foot-dragging is passive resistance (doing nothing). **Pilot Limbo/Advisory Capture** is *active subversion*. It *creates activity* (the pilot) specifically as a tool to *prevent* the desired change. It's not just delay; it's using the *appearance* of progress (running the pilot) to actively *block* real progress. It co-opts the reform energy.

  4.  **Tokenism:**
      *   *Similarity:* Involves symbolic inclusion without real power or influence.
      *   *Distinction:* Tokenism is usually about individuals or groups. **Pilot Limbo/Advisory Capture** is about the *structural design and purpose* of an entire *institutional mechanism* (the citizens' assembly) from its inception. The "token" is the *whole assembly* in its advisory form. The "pilot" label provides the fig leaf of potential future empowerment that never arrives.

  5.  **Self-Negating Prophecy / Manufactured Failure:**
      *   *Similarity:* The lack of power *causes* the conditions for perceived failure.
      *   *Distinction:* **Pilot Limbo/Advisory Capture** encompasses *both* outcomes (advisory "success" *and* powerless "failure") and actively *uses the pilot framework* as the justification for the outcome. It's the *institutionalization* of the self-negating prophecy within a procedural trap.

  ## The Mechanics of the Trap

  1.  **Demotion at Inception:** The radical proposal (empowered legislature) is immediately downgraded to "advisory pilot."
  2.  **Impossible Conditions:** The pilot is often set up to fail *as an empowered body* by design (no power, limited scope, tight timelines, potential for elite dismissal).
  3.  **Outcome Weaponization:**
      *   *If it functions well advisory:* "Proof" it works best *as* advisory. Empowerment is deemed unnecessary.
      *   *If it struggles:* Blamed on the *concept* of sortition/citizens, not the *crippling constraints*. "Proof" it can't handle real power.
  4.  **Procedural Lock-In:** The "pilot" becomes the permanent model. The question shifts from *"Should we empower them?"* to *"How should we run the next advisory pilot?"* The goalposts move permanently.

  ## Why It's Effective (and Infuriating)

  *   **Plausible Deniability:** Proponents appear open-minded and reform-oriented ("Let's test it!").
  *   **Risk Mitigation:** Completely neutralizes the threat to incumbent power structures.
  *   **Resource Drain:** Absorbs reformist energy and funding into a safe channel.
  *   **Legitimizes Stasis:** Uses the *outcome of the hobbled experiment* to justify maintaining the status quo ("We tried, it didn't work" or "We have it, it works fine as is").

  ## For Your Novel

  This dynamic is *rich* for fiction. You can explore:

  *   The **cynical political operators** who design the pilot precisely for this outcome.
  *   The **well-meaning reformers** who fall into the trap, hoping a "successful" pilot will lead to power, only to see it become permanent.
  *   The **frustrated citizens** in the assembly who realize they're window-dressing.
  *   The **moment of realization** when protagonists see "Pilot Limbo" for the trap it is.
  *   **Strategies to break the cycle:** How do characters force the transition from advisory pilot to empowered body? (e.g., demanding sunset clauses with automatic empowerment, tying the pilot to a specific high-stakes issue requiring binding outcomes, mass public pressure focused on the trap itself).

  **Pilot Limbo** or **Advisory Capture** perfectly encapsulates the specific, procedural, self-justifying trap you've identified. It's not just resistance; it's a sophisticated mechanism of containment disguised as progress. Naming it gives your critique and your story a powerful conceptual tool. Good luck with the novel – it sounds fascinating and deeply necessary!
