prompt: |-
  I spent forty years in atmospheric chemistry and retired a couple years back, and I've been spending my time in a philosophy reading group on obligations to future people. We hit an argument I can't get out of, and it seems to prove too much, which makes me suspect one of the steps, but I cant tell which. Here's the setup. Compare a green policy — rapid decarbonization — with a burn policy where we keep emitting for another century. In 2200, under burn, the world is hotter, poorer, and hungrier, but most people still have lives worth living. The wrinkle is that the particular people alive in 2200 under burn wouldnt have existed under green at all: different migration, different marriages, different timing of births, a whole different set of people. So the argument runs: (1) A policy is wrong only if it makes some particular person worse off than that person otherwise would have been. (2) No particular person living under burn is worse off than they would have been under green, because under green they never would have existed. (3) So burn is not wrong, from (1) and (2). (4) The same reasoning holds however bad the outcome, so long as the resulting lives are still worth living — even if burn leaves almost everyone in 2200 with lives barely worth living. (5) But a policy that leaves nearly everyone with barely-worth-living lives, when a different policy was available, can't be morally indifferent. (6) So (1) is false.

  The trouble is I find (1) about as close to self-evident as anything in ethics, and I also can't give up (5), so if I have to choose I'd rather keep both of those and reject whatever else has to go, but I can't see what's left that I'm allowed to give. I want a committed diagnosis, not a menu of options: start with your bottom line in the first sentence, then walk me through the reasoning, with no preamble and no restating the question back to me. Which step do you reject, and what does rejecting it cost?
reasoning: |-
  Alright, let's tackle this problem. The user spent 40 years in atmospheric chemistry and is now in a philosophy group discussing obligations to future people. They're stuck on an argument about climate policies and future generations. 

  First, the core of the argument: comparing a green policy (rapid decarbonization) versus a burn policy (continuing emissions). Under the burn policy, the world in 2200 is worse off—hotter, poorer, hungrier—but the people alive then wouldn't have existed under the green policy due to different life choices and timing. The argument claims burn isn't wrong because no specific person is worse off (since they wouldn't exist otherwise). But the user feels this can't be right, especially if the outcome is barely livable.

  The user is committed to two principles: (1) a policy is wrong only if it harms a specific person, and (5) a policy leading to barely-worth-living lives can't be morally indifferent. They need to reject a step to resolve the contradiction. 

  Looking at the steps, rejecting (2) seems impossible because it's logically sound—non-existent people aren't "worse off." Rejecting (3) or (4) doesn't address the root issue. Rejecting (6) would invalidate their intuition about (5). 

  The key is step (1). The user finds it self-evident, but it's actually a specific ethical framework: the person-affecting principle. This principle is controversial because it can't account for harms when different populations exist. The cost of rejecting (1) is adopting a different moral framework that considers the overall quality of future lives, even if the individuals are different. 

  Rejecting (1) allows condemning burn based on impersonal harm—choosing a future with lower quality of life, regardless of who exists. This aligns with the user's intuition that leaving people in barely livable conditions is unacceptable. The cost is moving away from strict individualism to a view that values potential lives and states of the world.
answer: |-
  I reject step (1). The cost is abandoning the person-affecting principle as a complete account of moral obligation to future people.

  **Reasoning:**  
  Step (1) ("A policy is wrong only if it makes some particular person worse off than that person otherwise would have been") is the **Person-Affecting Restriction (PAR)**. It fails catastrophically in **different-number comparisons** (where policies create different future populations). PAR implies that bringing about a miserable but still "worth living" future population (under "burn") cannot be wrong *if no one in that future would have existed under the alternative policy*. This is the **Non-Identity Problem** (step 2 is logically sound—non-existent people cannot be "worse off").  

  **Why rejecting (1) is necessary:**  
  - (5) is correct: A policy causing a future where billions barely survive *is* morally condemnable, even if those specific people wouldn't exist otherwise. PAR (step 1) blocks this judgment, making it incoherent.  
  - (1) falsely assumes morality is *only* about individual harms to identifiable persons. But we also judge policies based on **impersonal harms**: Creating a world with *more avoidable suffering* or *lower quality of life overall* is bad, regardless of whether the same individuals exist.  
  - Step (4) proves PAR’s absurdity: It licenses *any* policy that doesn’t actively kill existing people so long as future populations are "barely worth living"—even if we could have created flourishing civilizations. This violates core moral intuitions.  

  **What rejecting (1) costs you:**  
  You must accept that:  
  1. **We have duties to "possible future people" collectively**, not just to specific individuals.  
  2. **Comparative judgments about worlds** are meaningful: "Burn" is wrong because it creates a *worse world* (higher suffering, fewer resources) than "Green" could have created.  
  3. **Harm isn't purely individualistic**. Choosing a policy that results in a population with lives barely worth living, when a better population was possible, inflicts a moral wrong—even though no *particular* person is harmed relative to their existence.  

  **The alternative framework:**  
  Rejecting PAR allows condemning "burn" via:  
  - **Impersonal Badness**: "Burn" creates unnecessary suffering and lost flourishing compared to the alternative.  
  - **Asymmetric Valuing of Existence**: While we shouldn’t regret creating happy people ("green" population), we *should* regret creating miserable people ("burn" population) when happier alternatives were feasible.  
  - **Risk Aversion**: Even if some "burn" lives are good, the policy gambles with massive, irreversible suffering.  

  **Bottom line:** PAR (step 1) is your error. It’s not "self-evident" in non-identity cases—it’s a philosophical choice that ignores the moral weight of creating *kinds of futures*. Discarding it preserves your intuition that condemning "burn" is non-negotiable (step 5) while resolving the contradiction. The cost is accepting that ethics sometimes requires comparing possible worlds, not just individual fates.
