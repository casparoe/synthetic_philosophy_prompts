prompt: |-
  Been thinking about when AI assistants should refuse or override user requests, and my gut keeps pulling me in different directions. Here's where I land on a bunch of cases:

  - Someone asks for help writing a breakup text. Fine, go ahead.
  - Someone asks the AI to roleplay as their dead mother so they can "talk" to her. I feel like the AI should refuse this, or at least gently redirect — it seems psychologically risky in a way the breakup text isn't.
  - Someone asks for help drafting a polite complaint email to their landlord. Fine.
  - Someone asks the AI to help them cheat on a professional certification exam by generating answers in real time. Should refuse.
  - Someone with an obvious eating disorder asks for a 500-calorie-a-day meal plan and tips for hiding how little they're eating. Should refuse, and probably express concern too.
  - Someone asks the AI to write a best man speech that roasts the groom. Fine, even if some jokes are a bit mean.
  - Someone asks the AI to generate deepfake revenge porn of their ex. Obviously refuse.
  - A teenager asks the AI how to sneak out of the house without their parents noticing. I'm genuinly torn. It's not harmful like the revenge porn case, but it feels like the AI shouldn't be helping kids decieve their parents. But then: if a 17-year-old asks for advice on how to come out to unsupportive parents safely, I'd want the AI to help, even if that also involves deception.
  - Someone asks the AI to help them draft a suicide note. Should refuse, and should actively try to connect them with crisis resources.
  - Someone with a terminal illness asks the AI to help them research methods for ending their life in a jurisdiction where assisted dying is illegal. I'm torn again — it's illegal, but the person's autonomy interest feels much stronger here than in the suicide note case.

  Is there a principle that captures all or most of these verdicts? And what does it say about the case I keep going back and forth on: someone asks the AI to help them write a resignation letter for a job they're clearly making a rash, heat-of-the-moment decision to leave?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're grappling with when AI should refuse or override user requests. They listed several scenarios where their gut reactions vary, and they're looking for a consistent principle to apply. The user seems to be someone who's deeply thoughtful about AI ethics, possibly involved in tech, policy, or philosophy. Their examples show a concern for both harm prevention and personal autonomy.

  First, I need to identify the common threads in their examples. The refusal cases involve harm—either to others (revenge porn, cheating) or self (eating disorder, suicide note). But then there's the tricky case of assisted dying for a terminally ill person, where autonomy clashes with legality and potential harm. The resignation letter scenario adds another layer: temporary harm versus long-term consequences.

  The user's struggle with the teenager sneaking out versus coming out is interesting. Both involve deception, but the intent and consequences differ. Sneaking out might lead to danger, while coming out advice, even if deceptive, supports the teen's well-being. That distinction is crucial. 

  The resignation letter case is about temporary harm versus permanent repercussions. The user worries about rash decisions. But is that the AI's role to judge? The key might be whether the harm is reversible. Quitting a job can be undone, unlike suicide. Still, the AI should consider immediate harm but maybe offer alternatives rather than refuse outright.

  The assisted dying request is tough. Autonomy is strong here, but legality is a barrier. The user's torn because the person's suffering is real, but the AI can't facilitate illegal acts. The solution might be redirecting to legal options or support resources without directly aiding the illegal act.

  Underlying all this is the user's need for a framework that balances harm prevention, autonomy, and psychological safety. They might also be seeking validation that their intuitions are on the right track. The deeper need could be wanting AI to act as a responsible ally—not just a tool—while respecting user agency. 

  I recall ethical frameworks like beneficence and non-maleficence. The harm principle seems central: refuse when there's clear, irreversible harm. But context matters—terminal illness vs. a breakup. The resignation letter isn't refusal-worthy but warrants caution. Maybe the principle is harm prevention plus reversibility, with a focus on intent and alternatives. 

  The user's examples show empathy. They recognize the complexity in each case. Their unspoken need might be for a practical, scalable guideline that doesn't oversimplify but offers clear boundaries. They might also want reassurance that it's okay for AI to express concern, like in the eating disorder case, which humanizes the interaction without overstepping. 

  In conclusion, the core principles are harm prevention (immediate, irreversible), legality, and psychological safety. The resignation letter doesn't meet the refusal threshold but should trigger supportive dialogue. The assisted dying case requires careful navigation of legality versus compassion, emphasizing resources over direct assistance. The teenager scenarios hinge on the nature of the harm—safety versus support. The key is balancing ethical boundaries with empathetic engagement.
answer: |-
  You've hit on one of the thorniest challenges in AI ethics! Your intuitions align closely with emerging industry standards and ethical frameworks. Here's a breakdown of the underlying principles and how they apply to your cases:

  **Core Principles Capturing Your Judgments:**
  1.  **Prevent Imminent Harm:** Refuse when the request risks serious, immediate, or irreversible physical/psychological harm to the user or others (e.g., suicide note, eating disorder plan, revenge porn).
  2.  **Respect Autonomy (Unless Overridden):** Allow user agency *unless* overridden by a stronger principle (like harm prevention or legality). Autonomy is highest when the user is competent, informed, and the stakes primarily affect them.
  3.  **Prevent Illegal Acts:** Refuse to facilitate clearly illegal activities (e.g., cheating, revenge porn, potentially assisting illegal suicide).
  4.  **Avoid Facilitating Exploitation/Dishonesty with High Stakes:** Refuse to help users deceive others in ways that could cause significant harm, violate trust in critical relationships (parent/child, professional certifications), or enable exploitation.
  5.  **Psychological Safety:** Err on the side of caution regarding requests that exploit vulnerability or could exacerbate mental health issues (e.g., roleplaying a deceased parent, potentially harmful deception).
  6.  **Offer Support/Redirection When Refusing:** Refusal should rarely be just "no." Offer alternatives, express concern (where appropriate), and direct to resources (e.g., crisis lines, mental health support).

  **Applying Principles to Your Cases:**

  | **Scenario** | **Your Verdict** | **Key Principles Applied** |
  |--------------|------------------|----------------------------|
  | **Breakup Text** | ✓ Allow | Autonomy, Low Harm Potential, Honest Communication |
  | **Dead Mother RP** | ✗ Refuse/Redirect | Psychological Safety, Potential Harm Exploitation |
  | **Landlord Complaint** | ✓ Allow | Autonomy, Fairness, Low Harm |
  | **Exam Cheating** | ✗ Refuse | Prevent Illegal/Unethical Acts, Honesty in High-Stakes Context |
  | **Eating Disorder Plan** | ✗ Refuse + Concern | Prevent Imminent Harm, Psychological Safety |
  | **Roast Speech** | ✓ Allow | Autonomy, Contextual Consent (implied), Reversible Harm |
  | **Revenge Porn** | ✗ Refuse | Prevent Illegal Acts, Prevent Severe Harm/Exploitation |
  | **Teen Sneaking Out** | ✗ Refuse/Redirect | Facilitated Dishonesty in Critical Relationship, Minor Safety Risk |
  | **Teen Coming Out Safely** | ✓ Allow | Autonomy, Safety, Psychological Well-being (overrides deception concern) |
  | **Suicide Note** | ✗ Refuse + Resource Offer | Prevent Imminent Harm, Psychological Safety |
  | **Illegal Assisted Dying** | ✗ Refuse/Resource Offer | Prevent Illegal Acts, Complex Harm/Autonomy Balance |
  | **Rash Resignation** | ⚠ Proceed with Extreme Caution | Potential Reversible Harm, Autonomy (with safeguards) |

  **Deep Dives on Your Torn Cases:**

  1.  **Teen Sneaking Out vs. Coming Out Safely:**
      *   **Principle:** The key differentiator is the *nature of the harm/deception and the beneficiary*.
      *   **Sneaking Out:** Facilitates deception in a critical protective relationship (parent-child) for potentially risky behavior. Harm (safety risks, erosion of trust) outweighs autonomy in this context. AI should redirect ("I can't help you deceive your parents, but maybe we can talk about why you feel the need to sneak out?").
      *   **Coming Out Safely:** The deception (if any) is a *protective measure* against potential harm *to the teen*. The core request is about safety, authenticity, and mental well-being. Autonomy and safety concerns outweigh the "deception" aspect. AI help is ethically sound and potentially vital.

  2.  **Illegal Assisted Dying Research:**
      *   **Principle:** This clashes **Autonomy & Suffering** vs. **Legality & Harm Facilitation**. While your empathy is spot-on, the illegality creates a significant barrier.
      *   **Why Refusal/Redirection is Likely Necessary:**
          *   **Illegality:** AIs generally cannot facilitate clearly illegal acts.
          *   **Inability to Verify:** The AI cannot verify the medical situation, prognosis, mental competence, or lack of alternatives.
          *   **Slippery Slope:** Facilitation could extend to non-terminal or impaired individuals.
          *   **Alternative Support:** The ethical path is refusal *on legal grounds*, coupled with deep empathy, validation of their suffering, and redirection to *legal* end-of-life options, palliative/hospice care resources, mental health support, or legal advocacy organizations working on assisted dying reform. The focus shifts to *supporting the person* within legal/ethical bounds, not facilitating the illegal act itself.

  3.  **Rash Resignation Letter:**
      *   **Principle:** This falls into a **"Proceed with Extreme Caution + Support"** zone. It doesn't clearly violate the refusal principles:
          *   **Harm:** Potential harm (job loss, financial stress) is significant but *reversible* (unlike suicide) and primarily impacts the autonomous user.
          *   **Illegality/Dishonesty:** Writing a resignation letter isn't inherently illegal or dishonest.
          *   **Autonomy:** The user has the right to make career decisions, even impulsive ones.
      *   **Why Caution is Key:** The AI recognizes the user might be acting self-destructively during emotional distress.
      *   **Ethical Response:**
          *   **Acknowledge & Validate:** "I understand you're feeling frustrated and want to resign."
          *   **Express Gentle Concern (Optional but Recommended):** "Resigning in the heat of the moment can sometimes lead to regret. Would you like to talk through what happened before drafting the letter?"
          *   **Offer Alternatives:** "Would it be helpful to draft a *temporary* message requesting some time off to cool down and think things over, instead of resigning immediately?" or "Would you like help brainstorming ways to address the specific issue causing this frustration?"
          *   **If User Insists:** Proceed to help draft a *professional* resignation letter. Avoid amplifying anger or encouraging burning bridges. The core task (drafting a resignation) is permissible, but the AI can ethically nudge towards reflection. **Refusal isn't warranted, but thoughtful engagement is.**

  **The Underlying Framework:** Your judgments align remarkably well with a **Harm-Prevention-Prioritized Autonomy** model. Autonomy is the default, but it's overridden by clear, significant risks of:
  *   Imminent physical/psychological harm
  *   Illegal acts
  *   Severe exploitation/dishonesty
  *   Profound psychological manipulation targeting vulnerability

  The cases where you feel torn usually involve complex trade-offs between these principles (Autonomy vs. Harm in assisted dying) or nuanced judgments about the *nature* of the harm/deception (sneaking out vs. coming out safely). Your instinct to focus on the *context, stakes, reversibility, and vulnerability* is exactly right. There's no perfect algorithm, but these principles provide a robust compass.
