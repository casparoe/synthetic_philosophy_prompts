prompt: |-
  Over the past term my philosophy of mind reading group has been doing the extended mind debate, and I've hit the the same wall every week. The same moves keep coming around: Clark and Chalmers's parity principle, Otto and his notebook, the claim that the notebook would count as cognitive if it were surgically implanted, the reply that a notebook still lacks the right kind of content or the right kind of processing. Nobody in the group disagrees about what Otto can and can't do, or what Inga can and can't do; we all agree that there's no empirical fact at stake about their behavior. And yet half the room keeps concluding that Otto's memory literally extends into the notebook, and the other half keeps concluding that the notebook is just a tool, and after a couple months nobody has moved.

  My hunch, which I want tested rather than confirmed, is that this isnt really a debate about minds at all. It looks to me like a disagreement about what the word 'cognition' is supposed to be doing: whether it's meant to pick out a natural kind with a mark (something like original, nonderived content, or the right kind of internal processing), or whether it's just a loose term for whatever plays the relevant functional role. But it could also be a disagreement about what an explanation in cognitive science has to do — whether it should be personal-level and functional, or subpersonal and mechanistic — with each side treating their explanatory standard as the obvious one.

  I'd like a diagnosis of the structure of the disagreement, not a verdict for one side. Is this a substantive disagreement, a verbal one, or two different questions being run under the heading 'where does the mind stop'? And given your diagnosis, what would actually count as progress: a distinction, an experiment, a formal result, a change of question — or should we expect the debate to keep running forever, and why? Hard cap: 1,000 words.
reasoning: |-
  Hmm, the user is describing a persistent stalemate in their philosophy of mind reading group about the extended mind debate. They're frustrated because despite months of discussion, the group keeps going in circles with the same arguments about Clark and Chalmers' Otto thought experiment, the parity principle, and whether cognition extends to external tools like notebooks. 

  The user has an interesting hunch - that this isn't really about minds per se, but about deeper disagreements in how people define "cognition" and what explanatory standards they value. They want me to diagnose the structure of this disagreement rather than take sides, and suggest what might constitute genuine progress. 

  I notice they're clearly frustrated but also deeply thoughtful - they articulate the deadlock precisely and show meta-awareness about the nature of philosophical disagreements. The "hard cap: 1,000 words" suggests they're either preparing for a paper or want a concise analysis they can bring back to their group.

  The core tension seems to be between two fundamentally different approaches: 

  On one side, people who see cognition as defined by functional role (what something does) - for them, if the notebook plays the memory role just like biological memory, it should count as cognitive. 

  On the other, those who see cognition as defined by intrinsic properties (how something works) - they'll always find a difference between neurons and notebooks, no matter how functionally similar.

  This explains why empirical facts about Otto/Inga's behavior don't resolve anything - both sides agree on the observable facts. The disagreement is about what criteria we use to map the concept "cognition" onto those facts.

  Progress here won't come from more Otto examples or neuroimaging. What might help is:
  - Explicitly mapping the different criteria people are using (natural kind vs functional role)
  - Discussing why these criteria matter for their philosophical projects (e.g. explaining consciousness vs understanding adaptive behavior)
  - Introducing new distinctions like "cognitive system" vs "cognitive process"
  - Exploring what's at stake practically (e.g. for AI or neuroethics)

  The debate may persist because both positions reflect legitimate but incompatible perspectives on what makes cognition interesting. The solution isn't to "win" but to understand why the other side values their framing - which is exactly what this user seems to be seeking.
answer: |-
  Here’s a diagnosis of the structure of your group’s disagreement, why it persists, and what might constitute progress:

  ### The Core Issue: Competing Ground Projects
  The stalemate arises because two distinct philosophical "ground projects" (background goals) are operating under the same debate. Both sides agree on the empirical facts (Otto/Inga’s behavior) but are engaged in different conceptual tasks:

  1.  **The Natural Kind Project:** This side seeks to carve cognition at its *joints* – identifying a core set of intrinsic properties (e.g., nonderived content, specific neural processing) that define a cognitive state/process *as such*. For them, cognition is a natural phenomenon demanding a specific, restrictive ontology. The notebook fails because it lacks these intrinsic properties, regardless of functional similarity. Their goal is **explanatory precision**: isolating the *unique* mechanisms of the biological brain to explain consciousness, intentionality, or human uniqueness.

  2.  **The Functional Integration Project:** This side prioritizes understanding how intelligent behavior *works* in the real world. Cognition is whatever reliably plays a functional role in a larger problem-solving system. The Parity Principle is key: if an external resource is functionally isomorphic to an internal one under relevant conditions, it deserves the same label. Their goal is **explanatory scope**: understanding adaptive, intelligent behavior wherever it manifests, emphasizing the system’s dynamics over substrate. "Literally extending" means it’s an inseparable *functional part* of the cognitive process.

  ### Why It’s Not *Just* Verbal, But Not Purely Substantive Either
  *   **Beyond Mere Words:** It’s not simply defining "cognition" differently. Each project has different explanatory ambitions. The Natural Kind project fears *explanatory dilution* – if "cognition" includes notebooks, it loses its power to explain the mind’s unique features. The Functional project fears *explanatory myopia* – restricting "cognition" to the brain ignores the crucial role of environmental coupling in producing intelligent action.
  *   **Lack of Shared Success Criteria:** Progress for one project is irrelevant or counterproductive for the other. Finding a neural correlate of "true memory" (supporting the Natural Kind view) doesn’t address the Functionalist’s interest in Otto+notebook *as an adaptive system*. Demonstrating functional parity (supporting Extension) doesn’t satisfy the Natural Kind demand for intrinsic properties.
  *   **Fundamental Stakes:** The disagreement reflects deeper tensions in philosophy:
      *   **Internalism vs. Externalism:** Where do the boundaries of the mind lie?
      *   **Nature of Explanation:** Is cognition best explained mechanistically (subpersonal parts) or functionally (personal-level capacities)?
      *   **Metaphysical Priority:** Does biology ground cognition, or does function?

  ### Why the Stalemate Persists
  1.  **The Otto Trap:** Repeatedly debating Otto vs. Inga reinforces the stalemate. It perfectly sets up the functional similarity vs. intrinsic difference clash without providing tools to resolve the underlying divergence in goals.
  2.  **False Dichotomy:** The debate often presents "Extended vs. Embedded" as the only options. The Embedded view (notebook is a mere tool) satisfies the Natural Kind project but feels inadequate to the Functionalist. The Extended view satisfies the Functionalist but seems metaphysically extravagant to the Natural Kind advocate. Missing are nuanced middle grounds.
  3.  **Different "Obvious" Standards:** As you suspected, each side implicitly treats its explanatory standard (mechanistic/restrictive vs. functional/inclusive) as primary and universal. Challenging this feels like attacking the core of their philosophical approach.
  4.  **No Empirical Arbiter:** You correctly note there's no crucial empirical test between Otto+notebook and Inga *at the behavioral level*. Brain scans might show differences, but this only satisfies the Natural Kind project; the Functionalist can still argue the *system-level behavior* is cognitively equivalent.

  ### Paths to Progress (Beyond Declaring a Winner)
  Progress means clarifying the disagreement and moving beyond the Otto/Inga loop:

  1.  **Explicitly Acknowledge the Ground Projects:**
      *   Facilitate a session where each side articulates *what they want "cognition" to explain* (e.g., "I need 'cognition' to mark the boundary of phenomenal experience" vs. "I need 'cognition' to explain how agents solve problems in complex environments").
      *   Frame the debate as: "What work do we *need* the concept 'cognition' to do for our philosophical/empirical goals?"

  2.  **Introduce Crucial Distinctions:**
      *   **Cognitive System vs. Cognitive Process/State:** A *system* (Otto+notebook) can be cognitive in its functioning, while individual *states* within it (notebook entries) might lack intrinsic cognitive properties. This allows for extension at the system level without requiring every component to be "cognitive stuff."
      *   **Constitutive vs. Causally Coupled:** Move beyond "tool vs. part." What specific criteria make an external resource *constitutive* of a cognitive process (beyond mere causation)? Discuss factors like reliability, accessibility, trust, automaticity, and past incorporation (e.g., Clark’s "glue and trust" criteria). Does the debate change if the notebook is a constantly updated, bio-integrated AI versus a paper pad?
      *   **Derived vs. Original Intentionality:** Focus the debate here. Is the *lack* of original intentionality in the notebook a deal-breaker for cognition, or is playing the functional role sufficient? This isolates a core metaphysical sticking point.

  3.  **Shift the Case Studies:**
      *   **Challenging Cases:** Discuss cases that strain both positions:
          *   *Alzheimer's patient + AI assistant:* Deeply integrated, reliable, essential. Is the AI part of their cognitive system? Does its lack of biology/originality matter?
          *   *Sensorimotor Coupling:* Is the blind person's cane part of their perceptual system? Is this "extension" the same kind as Otto's notebook? (This often feels more intuitive, potentially bridging the gap).
          *   *Group Cognition:* Does cognition extend *between* individuals in a tightly coupled team? If not, why not? If so, what does this imply for Otto?
      *   **Degrees of Integration:** Instead of a binary "in/out," explore a spectrum of cognitive integration. Where on this spectrum does "extension" become a useful description?

  4.  **Focus on Explanatory Payoff:**
      *   Ask: "What concrete explanatory benefit do we gain by *including* the notebook as cognitive? What benefit do we gain by *excluding* it?"
      *   Does calling it "extended cognition" help predict Otto's behavior better? Design novel experiments *only* meaningful under the extended view (e.g., manipulating notebook access in ways analogous to brain lesions). Does the Natural Kind view better guide neuroscience research?

  5.  **Consider the Practical Stakes:**
      *   Discuss implications: If the notebook is part of Otto's mind, is deleting it vandalism? Is it "his" beliefs? Does this impact responsibility or personal identity? Does the Natural Kind view better protect against over-extension (e.g., calling the internet part of my mind)? Making the stakes tangible can shift perspectives.

  ### Will the Debate Run Forever?
  Likely yes, at the *metaphysical* level concerning "what cognition *really* is." The underlying tension – between a restrictive ontology seeking unique biological mechanisms and an expansive functionalism prioritizing system-level explanation – is fundamental in philosophy. It echoes debates about life, computation, and consciousness.

  **Progress isn't eliminating the debate, but evolving it.** You move from repetitive stalemate to a clearer understanding of *why* you disagree. You develop richer concepts (like degrees of integration, system vs. process), find more productive case studies, and potentially delineate contexts where one project's focus is more fruitful than the other (e.g., functionalism for HCI design, natural kinds for neurobiology). The goal shifts from "Who's right about Otto?" to "How do these different perspectives illuminate different aspects of mind and agency?"

  By diagnosing the ground projects, introducing finer distinctions, and shifting the focus to explanatory payoffs and new cases, your group can break the Otto/Inga loop and engage with the deeper, more productive questions underlying the extended mind debate.
