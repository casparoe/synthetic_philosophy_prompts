prompt: |-
  Write the joint statement a committed presentist and a committed eternalist could both sign after a good-faith adversarial collaboration on the metaphysics of time. I want a numbered section of claims they agree on, including what the debate is and isn't about, what the truthmaker pressure from past- and future-tensed statements amounts to, and what special relativity does and doesn't settle. Then a disagreements table where each row states the presentist's view in wording the presentist would accept and the eternalist's view in wording the eternalist would accept, covering at least cross-temporal relations (like admiring Socrates), the source of our sense that time passes, and whether there's a privileged present. Then list the cruxes: the sub-questions such that settling one would actually move at least one of them, and for each crux a concrete case, argument, or test both would agree bears on it, with each side's prediction recorded in advance. Don't adjudicate the debate; just produce the document they'd both sign. Seperate what's genuinely settled in the philosophy of time from what's still contested, and don't present a contested view as the consensus.
reasoning: |-
  We are drafting a joint statement between a committed presentist and a committed eternalist after an adversarial collaboration. The document must be one they both sign, so it must be neutral and accurately represent both positions without bias.

   Structure:
   1. Agreement Section (numbered): 
      - What the debate is and isn't about.
      - What the truthmaker pressure from past- and future-tensed statements amounts to.
      - What special relativity does and doesn't settle.

   2. Disagreements Table:
      Each row has:
        - The topic (e.g., cross-temporal relations, the source of our sense that time passes, privileged present)
        - Presentist's view (in wording they accept)
        - Eternalist's view (in wording they accept)

   3. Cruxes:
      For each crux:
        - A sub-question that, if settled, would move at least one of them.
        - A concrete case, argument, or test both agree bears on it.
        - Each side's prediction recorded in advance.

   Important: Do not adjudicate. Separate settled from contested. Do not present contested views as consensus.

   Let's begin:

   AGREEMENTS:

   1. The debate between presentism and eternalism is fundamentally about the ontological status of past, present, and future entities and events. It is not about the subjective experience of time, the direction of time, or the reality of change per se, but about what exists simpliciter.

   2. Both parties agree that truthmaker theory imposes pressure: for any true statement (e.g., "Socrates was wise"), there must be something in reality that makes it true. However, they disagree on what that truthmaker is. Presentists hold that truthmakers for past- and future-tensed statements must be grounded in the present reality, while eternalists hold that past and future entities and events themselves (as parts of the spacetime block) serve as truthmakers.

   3. Special relativity theory (SR) has implications for the metaphysics of time:
      - SR does not by itself settle the presentism/eternalism debate. Both presentists and eternalists have attempted to accommodate SR.
      - SR challenges the notion of absolute simultaneity, which in turn challenges the idea of a globally privileged present. However, it does not entail eternalism, nor does it rule out all forms of presentism (e.g., some presentists adopt a "relativized present" or focus on the local present).

   DISAGREEMENTS TABLE:

   | Topic                  | Presentist's View                                                                 | Eternalist's View                                                                 |
   |------------------------|-----------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
   | Cross-temporal relations (e.g., admiring Socrates) | Cross-temporal relations are not direct relations between existing entities. Instead, they are mediated by present entities (e.g., current mental states, records, or traces) that are appropriately causally connected to the past. | Cross-temporal relations are direct relations between entities that exist at different temporal locations. Since past, present, and future entities equally exist, one can stand in a direct relation to Socrates, who exists in the past. |
   | The source of our sense that time passes | The sense of time's passage is a direct reflection of metaphysical reality: the present is constantly changing, and this change is fundamental and objective. | The sense of time's passage is an illusion or a feature of our conscious experience (e.g., due to memory and anticipation) in a static eternal block where all times are equally real. |
   | Privileged present     | There is a unique and objective present moment that is ontologically privileged. Only entities and events that are present exist. | There is no objective, globally privileged present. Any moment can be taken as "present" from a particular reference frame, but no moment is metaphysically privileged over others. |

   CRUXES:

   Crux 1: The Grounding of Past Truths
     - Sub-question: How can a true proposition about the past (e.g., "Socrates drank hemlock") be grounded without invoking the past entity or event itself?
     - Concrete case/argument: Consider the truth of a past event for which there is no present trace or record (e.g., a lonely event: a single rock falling in a distant forest with no observers and leaving no trace). 
       - Presentist prediction: Even in such a case, the truth is grounded in the present, perhaps by the existence of a tensed fact or a primitive past-truth property. Alternatively, they might deny that such a proposition can be known, but maintain that it is true and grounded in some present feature of reality (e.g., the current state of the universe having been caused by that event, even if no trace remains).
       - Eternalist prediction: The truthmaker is the past event itself, which exists in the spacetime block. Without the existence of the past event, the proposition would be false.

   Crux 2: The Experience of Temporal Passage
     - Sub-question: Is the phenomenology of temporal passage best explained by an objective metaphysical passage of time or by cognitive processes in a static universe?
     - Concrete test: Neuroscientific investigation into the mechanisms of time perception. If it can be shown that the feeling of passage is entirely reducible to cognitive mechanisms (e.g., memory and anticipation) without requiring an objective flow, that would support eternalism. If, however, the feeling of passage is found to be fundamental and not reducible, that would support presentism.
       - Presentist prediction: The neuroscientific account will not fully explain the subjective sense of passage without reference to an objective change in what is real.
       - Eternalist prediction: The neuroscientific account will fully explain the sense of passage as a feature of brain processes in a static temporal dimension.

   Crux 3: The Compatibility of Presentism with Special Relativity
     - Sub-question: Can presentism be coherently formulated in the context of special relativity without postulating a privileged frame?
     - Concrete case/argument: Consider the relativity of simultaneity: two events that are simultaneous in one frame are not in another. If presentism requires absolute simultaneity (to define the present), then it seems incompatible with SR. However, some presentists propose a "relativized present" (i.e., the present is frame-dependent). The question is whether such a relativized presentism is tenable and can provide an adequate account of reality.
       - Presentist prediction: A coherent version of presentism can be developed that either (a) posits a privileged frame (even if undetectable) or (b) uses a relativized present without requiring a unique global present. In either case, it will be able to account for the truth of temporal claims in a relativistic world.
       - Eternalist prediction: Any attempt to relativize the present will lead to an unacceptable fragmentation of reality (e.g., what is real for one observer is not for another) and/or fail to provide adequate truthmakers. Eternalism, by taking all of spacetime as real, avoids these issues and is thus the only viable option in light of SR.

   We now write the joint statement accordingly.
answer: |-
  **Joint Statement on the Metaphysics of Time**  
  *Signed by a Committed Presentist and a Committed Eternalist*  

  ### **I. Agreements**  
  We affirm the following points of common ground, established through adversarial collaboration:  

  1. **Nature of the Debate**:  
     - The dispute concerns the *ontological status* of non-present entities and events. It is **not** about the reality of temporal experience, the direction of causation, or the unreality of past/future *discourse*. Both agree that "Socrates existed" is true but diverge on *what exists now* to ground this truth.  

  2. **Truthmaker Constraints**:  
     - Past- and future-tensed statements (e.g., "Caesar crossed the Rubicon") generate *truthmaker pressure*: their truth requires ontological grounds. We agree this pressure must be met but disagree on *how*:  
       - Presentists hold these truths must be grounded in *present* reality (e.g., traces, memories, or tensed properties).  
       - Eternalists hold these truths are grounded in *past/future entities themselves* (e.g., Caesar’s action as a spacetime region).  
     - Both reject eliminativism about past/future truths.  

  3. **Special Relativity (SR)**:  
     - SR **does not settle** the presentism/eternalism debate. It rules out a *global, frame-independent present* but **does not** entail eternalism or refute all forms of presentism (e.g., "local presentism" is compatible with SR if relativized to reference frames).  
     - SR **does confirm** that simultaneity is frame-relative, but this alone does not resolve whether *existence* is temporally neutral.  

  4. **Shared Commitments**:  
     - Time is distinct from space: temporal asymmetry (e.g., entropy, causation) is real.  
     - Metaphysical claims must align with science (e.g., SR, quantum mechanics) but are underdetermined by empirical data alone.  

  ---

  ### **II. Disagreements**  
  The table below summarizes our irreducible divergences. Each view is stated in terms acceptable to its adherent:  

  | Topic                  | Presentist’s View (Stated by Presentist)                                                                 | Eternalist’s View (Stated by Eternalist)                                                               |  
  |------------------------|----------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|  
  | **Cross-temporal relations** (e.g., "I admire Socrates") | Relations like admiration are *not direct* but mediated by present proxies (e.g., mental representations, historical records). Socrates does not exist; only his present effects do. | Relations are direct: Socrates *exists* (tenselessly) at his temporal location. Admiration is a genuine relation between two equally real entities across time. |  
  | **Source of temporal passage** | The "flow" of time reflects an objective, metaphysical change in reality: new entities come into/out of existence as the present moves. | The sense of passage arises from psychological/biological processes (e.g., memory, anticipation) within a static spacetime block. There is no objective "movement" of the present. |  
  | **Privileged present** | The present moment is metaphysically unique: only present entities *exist simpliciter*. Non-present entities are abstracta or derivative. | No moment is privileged: "present" is an indexical (like "here"). All times exist equally; the "now" is perspectival. |  

  ---

  ### **III. Cruxes**  
  The following sub-questions, if resolved, would compel at least one party to revise their position. Predictions are stated in advance:  

  1. **Crux: Truthmakers for "Lonely Pasts"**  
     - **Sub-question**: Can a past event with *no present traces* (e.g., a forgotten, causally isolated event) have a truthmaker under presentism?  
     - **Test Case**: Consider "Event X occurred at t₁," where X leaves no physical, memorial, or entropic traces by t₂.  
       - *Presentist’s Prediction*: Truthmakers exist (e.g., irreducible tensed facts or properties in the present).  
       - *Eternalist’s Prediction*: Only X itself (as a past entity) can ground this truth; presentism cannot accommodate it.  

  2. **Crux: Temporal Experience**  
     - **Sub-question**: Does the phenomenology of time’s passage *require* objective becoming?  
     - **Test Case**: A complete neuroscientific model of time perception, showing how brain states generate the feeling of flow *without* referencing objective temporal change.  
       - *Presentist’s Prediction*: The model will fail or imply an objective flow (e.g., via causal relations to a changing present).  
       - *Eternalist’s Prediction*: The model will succeed, reducing passage to cognitive processes in a static manifold.  

  3. **Crux: Presentism in Quantum Gravity**  
     - **Sub-question**: Can a quantum theory of gravity (e.g., loop quantum gravity) accommodate a fundamental present?  
     - **Test Case**: A finalized quantum gravity formalism that either requires a foliation of spacetime (privileging a present) or is fundamentally background-independent.  
       - *Presentist’s Prediction*: The theory will include a preferred foliation or emergent present.  
       - *Eternalist’s Prediction*: The theory will be background-independent, with no room for a privileged now.  

  ---

  ### **IV. Conclusion**  
  We concur that the debate remains open. No consensus exists on the core ontological claims, though SR constrains (without resolving) the disagreement. Future work should target the cruxes above.  

  **Signed**,  
  [Name], *for Presentism*  
  [Name], *for Eternalism*  
  Date: 2023-10-05
