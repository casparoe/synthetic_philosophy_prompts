answer: |-
  Here's a concise scorecard of requirements for an adequate account of material constitution, distinguishing fixed points from partisan commitments, and highlighting the core tension:

  **I. Non-Negotiable Fixed Points (Logic & Core Data):**
  1.  **Leibniz's Law:** If A = B, then A and B share *all* properties (including modal, temporal, relational). *(Why: Core logical principle of identity; violation implies contradiction.)*
  2.  **Logical Coherence:** The account must avoid explicit contradictions (e.g., asserting A both is and isn't identical to B). *(Why: Foundational requirement of rational discourse.)*
  3.  **Core Cases (Descriptive Adequacy):** Must provide a coherent description of:
      *   **Statue & Lump:** Co-located objects seemingly sharing all parts at T, yet differing in persistence conditions (e.g., lump survives squashing, statue doesn't). *(Why: The paradigmatic constitution case.)*
      *   **Tibbles the Cat (with Tail):** Intact cat (Tibbles) vs. tail-complement (Tib-minus) vs. the whole (Tibbles including tail). Challenges part-whole relations, identity through part loss, and coincidence. *(Why: Highlights part-whole vs constitution and problems of incremental change.)*
      *   **Ship of Theseus (with Replacement Parts & Reassembly):** Original planks replaced one-by-one; later, original planks are reassembled. Which is the "real" Ship? *(Why: Classic problem of persistence through part replacement and identity conditions.)*

  **II. Widely Expected Distinctions (Often Treated as Fixed, but Deniable):**
  4.  **Constitution ≠ Identity:** The relation between the statue and the lump (if they are distinct) is constitution, not identity. *(Why: Otherwise, Leibniz's Law violations from differing persistence are immediate. Denied by "Identity Theorists", a minority view.)*
  5.  **Sortal-Relativity:** The persistence conditions and identity criteria of an object depend on *what kind* of thing it is (e.g., "statue" vs. "lump of clay"). *(Why: Seems essential to explain modal differences. Denied by anti-sortalists/mereological essentialists.)*
  6.  **Part-Whole vs. Constitution:** Mereological composition (parts making a whole) is distinct from material constitution (one object being made of/making up another object at a time). *(Why: Constitution involves co-location of *wholes*; parthood involves parts constituting a single whole. Blurring leads to confusion.)*

  **III. Key Arguments to Address:**
  7.  **The Modal Argument (Against Identity):**
      *   Premise: The statue could not survive being squashed (losing its form), but the lump could.
      *   Premise: If statue = lump, they must share *all* properties, including modal ones.
      *   Conclusion: Statue ≠ lump. *(Why: The primary engine driving the search for non-identity accounts.)*
  8.  **The Grounding Problem:** *If* the statue and lump are distinct but coincident, *what grounds* this difference? What explains why there are two objects here rather than one? *(Why: Challenges the coherence and ontological cost of non-identity views.)*

  **IV. Partisan Commitments (Not Fixed Points - Choice of Camp):**
  9.  **Anti-Coincidence:** The denial that two numerically distinct objects can occupy the same space at the same time. *(Why: Motivates identity theories or eliminativism about one object (e.g., no statues).)*
  10. **Extensional Mereology:** The principle that objects with exactly the same (proper) parts are identical. *(Why: Rules out co-located objects; motivates eliminativism or identity.)*
  11. **Common Sense Preservation:** Prioritizing the existence and persistence conditions of ordinary objects (statues, ships, cats) as we intuitively understand them. *(Why: Motivates non-identity/constitution views; sacrificed by eliminativism or radical revisionism.)*

  **The Core Tension & The Most Demanding Requirement:**

  *   **The Single Most Workhorse Requirement:** **The Modal Argument (7).** It directly leverages Leibniz's Law (1) against the intuitive description of the Statue/Lump case (3a), forcing a choice between denying one of the modal premises (hard), denying distinctness (Anti-Coincidence (9)), or denying Leibniz's Law (unthinkable). It's the primary reason standard identity views fail.
  *   **The Incompatible Triad:** The following three requirements **cannot all be satisfied simultaneously** in the face of cases like Statue/Lump and the Modal Argument:
      1.  **Distinctness:** Statue ≠ Lump (driven by Modal Argument & Sortal Relativity).
      2.  **Anti-Coincidence:** No two distinct objects can occupy the same space at the same time.
      3.  **Extensional Mereology:** Objects with the same parts are identical.

  *Every major theory sacrifices one:*
  *   **Constitution Theories (e.g., Baker, Johnston):** Sacrifice **Anti-Coincidence (2)**. Accept distinct coincidents.
  *   **Perdurantism / 4Dism (e.g., Lewis):** Sacrifice **Distinctness (1)** *(at a time)*. The statue and lump are temporal parts of the same spatiotemporally extended worm.
  *   **Mereological Nihilism / Eliminativism (e.g., van Inwagen, Merricks):** Sacrifice **Distinctness (1)** and often **Common Sense Preservation (11)**. Only the fundamental parts (or only "living organisms") exist; there is no statue *or* lump as distinct objects.
  *   **Identity Theories / Deflationism:** Sacrifice **Distinctness (1)**. Statue = Lump (denying the modal premise or reinterpreting modal predicates).
  *   **Mereological Essentialism:** Sacrifices **Sortal Relativity (5)** and **Common Sense (11)**. Objects cannot gain/lose parts, undermining the persistence conditions driving distinctness.

  **In short:** The Modal Argument is the primary engine forcing non-identity views. The fundamental tension is between the distinctness implied by sortal-relative persistence conditions and the desire to avoid coincidence (Anti-Coincidence) or enforce mereological extensionality. **You must choose which of the triad (Distinctness, Anti-Coincidence, Extensional Mereology) to abandon.** The core cases illustrate *why* this choice is forced. Good luck diving back in! Focus on how each author resolves *this* tension.
