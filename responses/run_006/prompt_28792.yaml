prompt: |-
  So my two friends got into this argument at a barbecue and its been bugging me for weeks. I want someone to go through it move by move and tell me who's right about what.

  The argument started because my friend Dave told us about a job interview he had. They asked if he was still employed at his current company, and he said yes — which was true, technically, because his last day wasn't for another week. But what he didn't mention was that he'd been put on a performance improvement plan and was basically being managed out. He got the new job.

  My other friend Mira said that was basically lying. Dave got defensive and said he told the truth: he was employed, end of story. Its not his job to volunteer damaging information nobody asked for.

  Mira said that's sophistry — the whole point of the question was to figure out if he was leaving on good terms, and he knew that, and he deliberately let them draw a false conclusion. She said misleading someone is morally the same as lying, because you're still intentionally causing a false belief.

  Dave said okay, by that standard, if your partner asks if you like their new haircut and you say "it really brings out your eyes" instead of "I hate it," you're a liar. Mira said no, that's different because social tact isn't about deception — everyone understands the game. Dave said oh so now there's a "game" exception? What if job interviews are also a game where everyone knows you put your best foot forward?

  Then Mira shifted ground. She said look, even if misleading isn't always as bad as lying, there's something extra cowardly about it — you get the benefits of deception while keeping your hands clean, like your too precious to actually say the false thing. Dave said that's backwards: being careful to stay within the truth shows more respect for honesty, not less. If someone really didn't care about truth they'd just lie outright.

  At this point my other friend Jen jumped in and said she thinks the real question is whether you'd be willing to say the misleading thing if the other person knew your full situation. Like, if the interviewer knew Dave was on a PIP, would Dave still feel okay saying "yes I'm employed"? If not, that's a sign he was exploiting their ignorance. Dave said that test proves too much — if a surprise party planner knows the guest of honor would see through the deception, that doesn't make surprise parties wrong.

  It kind of petered out after that but I keep turning it over. Can someone adjudicate this round by round? I want to know who had the better of each exchange, and also whether there's a principled way to settle the underlying question or if they were just talking past each other. Also, please tell me how confident you are in each of your judgments and which point you're least sure about.
reasoning: |-
  Okay, let me tackle this barbecue debate that's been bugging the user for weeks. The user wants a move-by-move analysis of Dave and Mira's argument about truthfulness in job interviews, with confidence ratings and identification of the weakest point. 

  First, I need to reconstruct the core dispute: Dave omitted his PIP status when confirming current employment during a job interview, while Mira calls this deceptive. The user seems genuinely troubled by the moral ambiguity and wants closure - this isn't just about settling a bet, but philosophical clarity.

  Breaking it down into rounds:
  Round 1 (Lying vs. Technical Truth): Dave's technically correct about employment status, but Mira's right about intentional deception. I'm highly confident here - the legalistic "technically true" defense crumbles when examining intent. Employment verification questions inherently probe job security, not just binary employment status.

  Round 2 (The Haircut Analogy): Dave's false equivalence fails. Social white lies operate under shared understanding, unlike high-stakes interviews where information asymmetry matters. Mira should've emphasized this power imbalance rather than accepting the "game" framing. Medium confidence - the social contract aspect needs more nuance.

  Round 3 (Cowardice vs. Respect): Both make defensible but incomplete points. Mira's "cowardice" charge oversimplifies - withholding damaging information can be strategic rather than spineless. Dave's "respect for truth" claim ignores that selective truth-telling serves his interests. Least confident here - it's a values clash without clear metrics.

  Round 4 (Jen's Ignorance Test): Jen's test is conceptually solid but Dave's surprise party counter exposes its limits. The key distinction is harm/consent: surprise parties involve implied consent to deception within relationships, while job negotiations lack such frameworks. High confidence in this distinction.

  Underlying principles: The real conflict is between deontology (Dave: "only answer what's asked") and consequentialism (Mira: "don't cause false beliefs"). Neither fully wins - contextual factors like stakes, norms, and intent matter. Professional settings heighten obligation for material disclosure.

  What nags at me: The PIP detail changes everything. Withholding "being managed out" isn't omitting a minor detail - it's concealing material risk. If Dave believed the PIP was unjust, he should've addressed it proactively rather than hiding it. That's where his position collapses ethically.

  For the user's peace of mind: Dave's approach was legally defensible but ethically shaky, especially since he apparently felt the need to conceal it (per Jen's test). In future interviews, I'd recommend saying "I'm employed but have given notice" if wanting to avoid PIP discussion - still true but not misleading.
answer: |-
  Here's a move-by-move adjudication of the argument, along with confidence levels and an analysis of the core dispute:

  **Round 1: The Initial Claim (Lying vs. Technical Truth)**
  *   **Dave:** Claims he told the truth ("yes, I'm employed").
  *   **Mira:** Claims this is "basically lying" because it intentionally allows a false conclusion (that he's leaving on good terms).
  *   **Adjudication: Mira wins this round.**
      *   **Why:** While Dave's statement was *technically* true, the context (a job interview asking about current employment) makes it clear the question probes job security and departure circumstances. Dave knew the implied question ("Are you leaving voluntarily/on good terms?") and deliberately exploited the literal wording to create a false impression. Intentional deception via selective truth-telling is widely recognized as unethical, even if not a literal lie.
      *   **Confidence:** High (90%). This is a core principle in ethics and communication (the "lie of omission" or "paltering").

  **Round 2: The Haircut Analogy & "The Game"**
  *   **Dave:** Uses the haircut analogy ("it brings out your eyes" vs "I hate it") to argue Mira's standard makes all tactful evasion lying.
  *   **Mira:** Distinguishes social tact ("everyone understands the game") from job interview deception.
  *   **Dave:** Counters with "What if job interviews are also a game?"
  *   **Adjudication: Mira wins the analogy point, but Dave scores a partial win on the "game" challenge.**
      *   **Why (Mira wins analogy):** Mira correctly identifies a key difference: **shared understanding and norms.** In social niceties (like haircut comments), there *is* a widely understood, mutually accepted norm of softening criticism to preserve feelings. The "game" is consensual. Job interviews lack this specific, universal "game" norm of expected material deception about employment status. Interviewers expect candor on material facts like *why* you're leaving.
      *   **Why (Dave partial win):** Dave correctly points out that Mira introduced a "game" exception without clearly defining its boundaries. *Some* level of self-promotion ("putting your best foot forward") *is* expected in interviews (e.g., highlighting strengths, downplaying minor weaknesses). However, this doesn't extend to materially misleading the employer about fundamental issues like *the reason for your departure* or *current performance status*.
      *   **Confidence:** High on the analogy distinction (85%). Medium on the "game" challenge (70%) - defining the exact boundaries of acceptable "spin" in interviews is complex, but concealing a PIP falls clearly outside it.

  **Round 3: Cowardice vs. Respect for Truth**
  *   **Mira:** Claims misleading is "extra cowardly" – getting deception benefits while keeping "hands clean."
  *   **Dave:** Claims sticking strictly to the literal truth shows *more* respect for honesty; liars wouldn't bother.
  *   **Adjudication: Draw, leaning slightly towards Mira.**
      *   **Why (Mira's point):** There's validity to the idea that misleading allows plausible deniability ("I *technically* told the truth!"). It *can* be a way to avoid the discomfort of an outright lie while still achieving the deceptive outcome. Dave's action fits this pattern – he avoided the risk of being caught in a direct lie but achieved the same result.
      *   **Why (Dave's point):** There *is* a difference in kind between a false statement and a selectively true one. Someone genuinely committed to truthfulness *would* be more careful about literal accuracy, even if the intent is still deceptive. An outright liar wouldn't constrain themselves.
      *   **Why Draw:** Both capture aspects of the psychology. Mira identifies a potential motive (avoiding the label "liar"), while Dave identifies a behavioral difference. However, **intent is key:** If the *intent* is deception (as it clearly was with Dave's PIP), then the "respect for truth" argument rings hollow. The respect is for the *letter*, not the *spirit*, of truth, which is where the cowardice charge gains traction.
      *   **Confidence:** Medium (65%). It hinges on interpreting motives, which are complex. Dave's defense feels weaker because his intent *was* deceptive.

  **Round 4: Jen's Test & The Surprise Party Counter**
  *   **Jen:** Proposes the test: Would you say it if the other person knew your full situation? If not, you're exploiting ignorance.
  *   **Dave:** Counters with the surprise party analogy – the guest of honor *wouldn't* consent to the deception, but surprise parties aren't wrong.
  *   **Adjudication: Jen's test is strong, but Dave's counter exposes a limitation. Jen ultimately wins on applying it to *this* case.**
      *   **Why (Jen's Test):** This is a powerful ethical heuristic (similar to the "veil of ignorance" or "publicity" tests). If you wouldn't say/do X if the other person had all the facts, it strongly suggests X is deceptive or exploitative. Applying it here: If the interviewer knew about the PIP, Dave would almost certainly *not* feel comfortable just saying "Yes, I'm employed" without qualification. This confirms he was exploiting their ignorance.
      *   **Why (Dave's Counter):** Dave correctly points out Jen's test isn't absolute. Surprise parties involve a *socially consented-to form of deception* within a context (celebration, relationship) where the *outcome* (joy) justifies the temporary deception, and the deceived person generally *retroactively* consents to the method. The harm is minimal/non-existent.
      *   **Why Jen Wins (for this case):** The key difference is **materiality and consent norms.**
          *   **Materiality:** The PIP is highly material to the job offer (risk of termination, performance issues). The surprise is immaterial to the guest's core decisions.
          *   **Consent Norms:** Society broadly accepts the "game" of surprise parties within relationships. There is *no* such broad social norm consenting to candidates materially misleading employers about their current employment status or reasons for leaving. Employers expect candor on these points to make informed hiring decisions.
      *   **Confidence:** High on Jen's test being useful (80%). Medium on Dave's counter exposing a limitation (70%). High on Jen winning the application to *this specific case* (85%).

  **The Underlying Question & Talking Past Each Other:**

  1.  **The Core Dispute:** Is intentionally creating a false belief by carefully selecting true statements (when you know the listener will draw the wrong conclusion from them) ethically equivalent to lying in a context like a job interview?
  2.  **Principled Way to Settle It:** Yes, using a combination of principles:
      *   **Intent:** Was the primary intent to cause the other person to believe something false? (Clearly, yes, in Dave's case).
      *   **Materiality:** Was the withheld/misleading information significant to the other person's decision? (The PIP was highly material).
      *   **Norms & Expectations:** Does the context involve shared understanding of acceptable "spin" or deception (like social tact or surprise parties)? (Job interviews have a norm of candor on employment status/departure reasons; PIP concealment violates this).
      *   **Exploitation of Ignorance:** Did the speaker rely on the listener's lack of specific knowledge to create the false belief? (Yes, Dave relied on the interviewer not knowing about the PIP).
      *   **Jen's Test:** Would you make the same statement if the listener knew the full context? (Dave likely would not).
  3.  **Were they talking past each other?** Partially. Dave focused narrowly on the *literal truth* of a single statement. Mira, and later Jen, focused on the *intent, overall impression, and material context*. Dave kept trying to reduce the argument to binary "truth vs. lie," while Mira/Jen were arguing about *deceptive communication* and *integrity in representation*. Dave also tried to import norms from *other* contexts (social tact, surprise parties) that don't cleanly apply to material job interview disclosures.

  **Overall Verdict:**

  *   **Mira had the better overall ethical argument.** Dave's concealment of the PIP was intentionally deceptive and materially misleading within the norms of a job interview. He exploited the interviewer's ignorance.
  *   **Jen provided the most useful analytical tool** (her test) for evaluating the ethics of the specific situation.
  *   **Dave scored points** by exposing potential flaws in absolute statements (Mira's initial "always cowardly," Jen's test needing context) but failed to justify his own specific action as ethical. His defenses felt more like rationalizations than principles.

  **Point of Least Confidence:** The "Cowardice vs. Respect for Truth" round (Round 3). Distinguishing the precise psychological motivation (avoiding the lie label vs. a genuine, albeit misplaced, commitment to literal accuracy) and weighing which is "worse" is inherently tricky. While the *outcome* (deception) is the same, the *character* judgment Mira makes is harder to pin down with absolute certainty. However, the *intent to deceive* remains the crucial unethical element, regardless of the specific psychological mechanism Dave used to achieve it.
