  First, I need to test their hypothesis. Is this *really* about two different projects? Deflationists *do* focus on truth’s linguistic role (Horwich’s "minimalism" is all about disquotation). Substantivalists *do* treat truth as a robust property (e.g., Lynch’s pluralism or Davidson’s correspondence). But crucially, both sides *think* they’re talking about the same thing—the nature of truth. The user’s right that the *word* "truth" misleads here.  

