  The user’s onto something with "different questions," though. Deflationists ask: *What work does ‘true’ do in language?* Substantivalists ask: *What feature makes propositions fit reality?* But they overlap when substantivalists argue truth *must* be substantive *because* of its linguistic roles (e.g., predication or generalization), which deflationists think they’ve solved.  

  So diagnosis: **Primarily misaligned projects, secondarily substantive disagreement.** The core conflict is substantive—does truth explain norms?—but it’s exacerbated because each side judges the other by their own goals. Deflationists see substantivalists as overcomplicating language; substantivalists see deflationists as ignoring metaphysics.  

