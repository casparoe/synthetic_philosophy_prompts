answer: |-
  Your diagnosis is remarkably astute—this is precisely the kind of meta-philosophical clarity the debate needs. You've identified the core structural problem: **the three theories aren't competing explanations of the *same phenomenon*; they're explanations of *different but overlapping phenomena* all called "promising."** The impasse persists because each theory:

  1.  **Targets a distinct *explanandum*:** As you note, they answer different questions:
      *   **Practice Theory:** "How does a *social institution* create obligations?"
      *   **Expectation Theory:** "How does *inducing detrimental reliance* create obligations?"
      *   **Will Theory:** "How does an *act of autonomous commitment* create obligations?"

  2.  **Prioritizes different *paradigm cases*:** Each theory excels at explaining the cases that fit its core *explanandum*:
      *   Practice: Promises relying on explicit conventions (e.g., contracts, oaths).
      *   Expectation: Promises where reliance is clear and harmful (e.g., promising a ride to the airport).
      *   Will: Promises emphasizing personal commitment (e.g., vows, self-imposed resolutions).

  3.  **Has a built-in *re-description mechanism*:** Each theory can *explain away* the others' paradigm cases by arguing they aren't "true" promises or derive bindingness from its *own* core mechanism:
      *   A Will theorist might say practice-based promises only bind because the promisor *wills* to join the practice.
      *   An Expectation theorist might argue a desert-island promise binds because it *creates reliance* even without a practice.
      *   A Practice theorist might claim a purely internal "vow" only becomes binding if embedded in a practice (e.g., religious or cultural).

  **The Nature of the Disagreement:** It's **multidimensional**:

  1.  **Substantive Core:** There *is* genuine disagreement about **which aspect is *fundamental* to promissory obligation.** Each theory asserts its core mechanism (social convention, induced reliance, autonomous commitment) is *primary*, and the others are either derivative, secondary, or illusory. This reflects:
      *   **Divergent Moral Bedrock:** Deep intuitions about what *grounds* obligations (social utility, harm prevention, individual autonomy).
      *   **Metaphysical Commitments:** Views on whether obligations can be *self-imposed* (Will) or must arise from *interpersonal effects* (Expectation) or *social structures* (Practice).
      *   **Centrality of Cases:** What counts as the *paradigm* promise? A business contract? A vow? A casual assurance? Each theory privileges different examples.

  2.  **Methodological Conflict:** They disagree profoundly about **what constitutes a successful *explanation***:
      *   Practice theorists demand an account of the *social structure* enabling the obligation.
      *   Expectation theorists demand an account of the *wrong done to the promisee*.
      *   Will theorists demand an account of the *promisor's normative power*.
      *   **Counterexamples function as boundary markers:** Each case where a rival theory struggles is used to show that theory fails to capture the *essential* feature of promising *as they define it*. They aren't just talking past each other; they're arguing that *their* chosen *explanandum* is the *correct* one for the concept "promissory obligation."

  **Why Genuine Convergence is Elusive:**

  1.  **Promising is Multifunctional:** Human practices of commitment *do* serve all these purposes simultaneously: coordinating behavior (Practice), protecting reliance (Expectation), enabling self-binding (Will). No single theory captures this complexity.
  2.  **Conceptual Plasticity:** "Promise" is used flexibly. We apply it to solemn vows, casual assurances, legal contracts, and hypotheticals. No theory perfectly covers all uses because the concept itself isn't monolithic.
  3.  **Normative Entrenchment:** The foundational intuitions (utility, harm, autonomy) are deeply held and difficult to dislodge by argument alone. Counterexamples often lead to ad-hoc refinements protecting the core commitment.

  **Paths to Progress (Beyond Stalemate):**

  1.  **Explicitly Pluralist Frameworks:** Acknowledge that "promissory obligation" likely arises from a **hybrid source**. Progress might involve:
      *   **Mapping Interactions:** How do these elements (practice, reliance, will) combine, reinforce, or conflict in *different types* of promises? (e.g., A wedding vow might involve all three strongly; a casual promise might primarily involve reliance; a legal contract heavily involves practice).
      *   **Conditional Explanations:** Specify *under what conditions* one element becomes primary (e.g., practice matters most in institutional settings; reliance matters most when vulnerability is high; will matters most in deeply personal commitments).
  2.  **Conceptual Disambiguation:** Rigorously distinguish:
      *   **The Source of Obligation:** What *causes* the duty to arise? (Convention, Reliance, Commitment).
      *   **The Content of Obligation:** What *is* the duty? (To perform X, or compensate for non-X).
      *   **The Justification of Obligation:** *Why* is it morally binding? (Social utility, preventing harm, respecting autonomy).
      *   **The Scope of Obligation:** *To whom* is the duty owed? (Promisee, society, oneself?).
      *   **The Target Question:** "Why do promises bind?" obscures these distinct inquiries. Framing research around specific questions (e.g., "What grounds the duty *to the promisee*?") could clarify debates.
  3.  **New Kinds of Cases (with Limits):** While refined counterexamples fuel the stalemate, cases exposing **tensions between the elements** could be productive:
      *   Cases where inducing reliance seems justified *despite* violating a practice or lacking explicit commitment.
      *   Cases where an autonomous commitment seems binding *despite* no reliance or established practice.
      *   Cases where adherence to a practice seems obligatory *despite* no specific reliance or strong autonomous commitment.
      *   **The Goal:** Not to "refute" a theory, but to force acknowledgment that no single element *always* suffices or is *always* necessary.
  4.  **Formal/Game-Theoretic Modeling:** Could help clarify the *functional role* of each element within systems of cooperation and commitment, potentially showing how they complement each other in achieving stability and trust.
  5.  **Empirical Input:** Investigating how ordinary people perceive promissory obligations across contexts. Do intuitions about "bindingness" track reliance, convention, commitment, or some combination, depending on the situation? This could challenge philosophers' intuitions about "central cases."
  6.  **Change of Question:** The most radical progress might come from abandoning the quest for *the* single source. Instead:
      *   Ask: "What *functions* do practices of promising serve?" (coordination, reliance-protection, autonomy-expression).
      *   Ask: "When, and to what extent, *should* commitments be treated as binding, and why?" (Shifting from conceptual analysis to normative justification per context).

  **Conclusion:** You are correct that the question "Why do promises bind?" is ill-posed in its monolithic form. The debate is stalled not because the theories are wrong, but because they are partially right about *different aspects* of a complex phenomenon. The genuine disagreement lies in **which aspect is taken as primary and definitive**, rooted in divergent moral bedrock and methodological commitments. Progress requires abandoning the expectation of a single, unified theory and instead embracing **disambiguation, pluralism, and context-sensitivity**. This involves mapping how social practice, induced reliance, and autonomous commitment interact within the diverse landscape of human commitment-making. The impasse persists because the question demands reductionism where complexity reigns. The way forward is to acknowledge and analyze that complexity.
