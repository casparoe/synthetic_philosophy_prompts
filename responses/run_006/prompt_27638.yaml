answer: |-
  Here is a draft document for an adversarial collaboration between the Consequentialist (C) and Virtue Ethic (V) readings of Buddhist ethics, structured as requested:

  **Document of Shared Understanding & Defined Disagreements**

  **Part 1: Shared Ground (Claims Both Camps Accept)**

  1.  **Ultimate Goal:** The ultimate aim of Buddhist practice is the cessation of suffering (*dukkha*) and the attainment of awakening (*nirvana/bodhi*) for all sentient beings.
  2.  **Centrality of Compassion & Wisdom:** Compassion (*karuṇā*) and Wisdom (*prajñā*) are inseparable and paramount virtues/path factors necessary for achieving the ultimate goal.
  3.  **Role of Precepts & Practices:** The ethical precepts (Śīla), meditative practices (Samādhi), and cultivation of wisdom (Prajñā), including the Brahmavihāras and Pāramitās, are essential components of the path.
  4.  **Karmic Framework:** Actions (*karma*) have ethical weight and consequences (*vipāka*), shaping future experiences for the agent and others. Intention (*cetanā*) is crucial to determining an act's karmic quality.
  5.  **Bodhisattva as Paradigm (for Mahāyāna):** The Bodhisattva, motivated by great compassion (*mahākaruṇā*) and aspiring to Buddhahood for the benefit of all beings, is the central ethical ideal within the Mahāyāna tradition.
  6.  **Practical Overlap:** In the vast majority of everyday situations, actions prescribed by C and V readings align (e.g., generosity is good, harming is bad).
  7.  **Rejection of Simple Rule-Worship:** Both camps reject a deontological reading where precepts are absolute, context-independent divine commands lacking deeper justification. Precepts are skillful means (*upāya*).
  8.  **Rejection of Pure Egoism:** Both camps reject interpretations where the primary motivation is solely the agent's own liberation without regard for others' welfare.
  9.  **Non-Verbal Dispute:** The disagreement is *not* primarily about *whether* outcomes matter or *whether* character matters. Both agree both matter. The dispute is about **primary justificatory structure** and **paradigmatic locus of evaluation**.
  10. **Textual Basis:** Both camps acknowledge significant scriptural support for their positions (e.g., emphasis on consequences in Jātakas, Upāyakauśalya Sūtra; emphasis on character/disposition in Dhammapada, descriptions of the Ārya).

  **Part 2: Disagreements Table**

  | Disagreement Area                      | Consequentialist (C) Position (Worded by C)                                                                 | Virtue Ethic (V) Position (Worded by V)                                                                                                 |
  | :------------------------------------- | :---------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Primary Justification of Precepts/Rules:** | The ethical precepts (e.g., against killing, stealing) are **instrumentally valid rules** derived from and justified solely by their tendency to produce the best overall consequences (minimizing suffering, maximizing welfare/awakening potential) for sentient beings over the long term. | The ethical precepts are **expressions or safeguards of the cultivated virtuous character** (e.g., non-harming, generosity) essential for progress on the path; their justification lies intrinsically in their role in embodying and stabilizing these perfected dispositions (*kusaladharma*). |
  | **2. Karmic Structure:**               | Karmic consequences are best modeled as **agent-neutral**. The moral weight of an act depends fundamentally on the *total net impact on sentient welfare* across all beings affected, regardless of the agent's relationship to them. | Karmic consequences are fundamentally **agent-relative**. The primary karmic impact shapes the *agent's own mindstream and future experiences*, directly tied to the state of mind (intention, virtue/vice) cultivated *in the agent* by the act. |
  | **3. Nature & Scope of Brahmavihāras:** | The Brahmavihāras (loving-kindness, compassion, etc.) are **attitudes/mental states** whose *scope* (towards *all* beings without exception) is paramount and must be actively extended without limit; their boundless quality is key to their ethical power. | The Brahmavihāras are **stable character dispositions (virtues)** cultivated through practice; the primary focus is on the *depth, stability, and integration* of these qualities *within the practitioner*, making them spontaneous and effortless. |
  | **4. Locus of Primary Evaluation:**    | The primary ethical evaluation concerns the **consequences of actions** (or rules/practices) for sentient welfare. The quality of character is crucial *because* it reliably produces beneficial consequences. | The primary ethical evaluation concerns the **state of character (virtues/vices)** of the agent. Beneficial consequences reliably flow *from* a well-cultivated, virtuous character. |

  **Part 3: Crucial Questions (Cruxes)**

  1.  **Crux: Bodhisattva's Precept Transgressions**
      *   **Question:** Are the Bodhisattva's apparent transgressions of precepts (e.g., killing to prevent greater harm, lying to save lives) justified primarily by the beneficial *consequences* of the specific act, or are they expressions of an *already perfected character* (e.g., skillful means arising from perfected wisdom/compassion) that transcends conventional rule-following?
      *   **Concrete Textual Case:** The *Upāyakauśalya Sūtra* (Skill in Means Sūtra), specifically the story of the ship-captain Bodhisattva who kills a robber to prevent him from murdering 500 merchants (and incurring vast negative karma himself).
      *   **C Prediction:** Will show explicit justification based on *preventing worse consequences* (500 deaths + robber's heavy karma vs. 1 death + Bodhisattva's willingness to bear karma) and calculation of net benefit/karmic outcome. The captain's *character* is secondary to the outcome.
      *   **V Prediction:** Will emphasize the captain's motivation (*cetanā*) of pure, self-sacrificing compassion and his *perfected wisdom* understanding karma and emptiness, making the act an expression of ultimate virtue (*paramārtha-satya* transcending conventional *saṃvṛtti-satya* rules), not mere calculation. The consequences validate the character, not vice-versa.

  2.  **Crux: Modeling Karmic Consequences**
      *   **Question:** Does the karmic mechanism primarily register the *agent-neutral welfare impact* of an act, or the *agent-relative cultivation of mindstates* (virtue/vice)?
      *   **Concrete Textual Case:** The story of **Aṅgulimāla**. He murders 999 people (massive agent-neutral negative impact), but achieves Arhatship after following the Buddha and sincerely practicing the path. His karmic fruition includes severe suffering (e.g., being stoned) but also ultimate liberation.
      *   **C Prediction:** Will show that while his past acts had terrible consequences (agent-neutral suffering), his later practice generated overwhelmingly positive consequences (agent-neutral liberation for himself and inspiration for others). The residual suffering (stoning) is the *lingering consequence* of past acts, but the *net karmic trajectory* shifted based on outcomes generated.
      *   **V Prediction:** Will show that the karmic results (stoning) stem directly from the *vicious mindstates cultivated* during his murders (agent-relative), while his liberation stems directly from the *virtuous mindstates cultivated* (remorse, faith, effort, wisdom) on the path. The key is the transformation *within his mindstream*; the external consequences (suffering of victims, stoning) are secondary effects of internal states.

  3.  **Crux: Brahmavihāras - Limitless Scope vs. Cultivated Disposition**
      *   **Question:** Are the Brahmavihāras fundamentally about the *active extension of attitude/feeling towards all beings* as an ethical imperative, or about the *cultivation of a stable, boundless disposition* within the practitioner?
      *   **Concrete Textual Case:** The *Karaṇīya Metta Sutta* (Sn 1.8) and its instructions for radiating metta "to all beings as a mother protects her only child," contrasted with meditation manuals (e.g., Visuddhimagga) detailing the *gradual cultivation* process, starting with easier objects (self, benefactor) before moving to neutral, hostile, and finally "all beings."
      *   **C Prediction:** Will emphasize the imperative of *universal scope* ("to all beings") as the defining ethical characteristic. The cultivation process is a *means* to achieve this limitless scope effectively, which is the primary goal.
      *   **V Prediction:** Will emphasize the *process of cultivation* detailed in the manuals as transforming the practitioner's *character*. The phrase "all beings" describes the *resultant state* of the fully developed virtue, where boundless goodwill arises spontaneously *from* the cultivated disposition, not as a separate act of "extension."

  **Confidence & Uncertainties:**

  *   **Overall Confidence:** Moderately High (7/10). The distinction between C and V is well-established in comparative ethics discussions of Buddhism. The core disagreements outlined are genuine and reflect significant textual strands and interpretive traditions.
  *   **Attribution Confidence:** High (8/10) for Part 1 (Shared Ground) and the Disagreements Table. The wording aims for neutrality and reflects standard characterizations found in scholarship (e.g., Goodman, Keown, Siderits, Cooper, Clayton).
  *   **Crux Confidence:** Moderate (6/10). The specific textual cases chosen are highly relevant and central to the disputes. The predictions logically follow from each camp's core commitments.
  *   **Least Sure Point:** The **modeling of Karmic Consequences (Agent-Neutral vs. Agent-Relative)**. This is the most philosophically abstract crux. The tradition itself offers diverse metaphors and perspectives on karma. While the predictions are plausible extrapolations, the core mechanism of karma might be underspecified or interpreted differently within the tradition itself, making this the point most vulnerable to objections about oversimplification or mischaracterization. The Aṅgulimāla case *can* be read strongly both ways, highlighting the ambiguity. Resolving this crux satisfactorily might require delving into highly technical Abhidharma or Yogācāra analyses of mind-moment continuity and karmic seeds (*vāsanā/bīja*), which are themselves contested.

  This document provides a structured foundation for collaboration, clarifying common ground, precisely defining disagreements in each camp's terms, and identifying specific, textually grounded points where focused debate could yield progress.
