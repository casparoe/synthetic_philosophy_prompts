  For cruxes, the user specified three: bodhisattva's precept transgressions, karmic modeling, and brahmavihāras. I need concrete textual cases both sides would acknowledge. The bodhisattva's transgression is best illustrated by stories like the ship-burning or killing to prevent harm. Karmic modeling can use the Angulimāla case. Brahmavihāras can draw from the Karaniya Metta Sutta. For each, I'll state what each camp predicts the case shows.

