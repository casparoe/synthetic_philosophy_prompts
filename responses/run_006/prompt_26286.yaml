prompt: |-
  Please rank the following proposed solutions to the Frege–Geach problem for expressivism according to how well they account for the full range of embedded contexts in which moral language appears — including negation, conditionals, probability operators, epistemic modals, and propositional attitude ascriptions. Use a tier system (e.g., Tier 1 for approaches that handle all or nearly all embedding contexts convincingly, down to Tier 4 for approaches that fail on multiple fronts), and give a sentence or two justifying each placement.

  The approaches to rank:

  - Blackburn's quasi-realist program (attitudes toward attitudes, or "higher-order attitudes")
  - Gibbard's norm-expressivism (hyperplan-based semantics with world–norm pairs)
  - Schroeder's "being-for" expressivism (the A-type/B-type distinction and the being-for relation)
  - Hybrid expressivism (e.g., Ridge's ecumenical expressivism, or Copp's realist-expressivism)
  - Horgan and Timmons's logico-expressivism (non-truth-conditional yet logically disciplined semantics)
  - The "semantic innocence" approach (the view that expressivism can simply help itself to standard truth-conditional compositional semantics for the fragment in question, without thereby abandoning its core commitments)

  In your response, please also indicate how confident you are in your overall ranking and single out the specific placement or claim you are least sure about.
