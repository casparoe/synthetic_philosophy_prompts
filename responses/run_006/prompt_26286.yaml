answer: |-
  Here is a tiered ranking of the proposed expressivist solutions to the Frege-Geach problem, based on their ability to handle the full range of embedding contexts (negation, conditionals, probability operators, epistemic modals, propositional attitude ascriptions). The ranking prioritizes systematic compositional semantics and empirical coverage of natural language embeddings.

  **Tier Ranking:**

  1.  **Tier 1 (Handles all or nearly all contexts systematically & convincingly):**
      *   **Gibbard's norm-expressivism (hyperplan-based semantics with world–norm pairs):** Gibbard's possible worlds framework (world-norm pairs) provides a fully compositional, truth-conditional *ersatz* semantics. It directly translates normative claims into complex descriptions of hyperplans/norms, allowing standard semantic machinery to handle embeddings like conditionals ("If lying is wrong, then..."), probability ("It's likely that lying is wrong"), modals ("It might be wrong"), and attitudes ("Bob believes lying is wrong") seamlessly. This is the most developed and formally robust expressivist semantics.

  2.  **Tier 2 (Handles core contexts well, faces challenges with some complex embeddings or requires significant theoretical commitments):**
      *   **Schroeder's "being-for" expressivism (A-type/B-type distinction & being-for relation):** Schroeder provides a detailed compositional semantics using the primitive "being-for" relation and distinguishes atomic (A-type) and complex (B-type) normative commitments. It systematically handles negation, conditionals, and arguably attitude ascriptions ("being for blaming for not blaming for..."). However, its treatment of complex embeddings involving probability operators ("There's a 60% chance stealing is wrong") and epistemic modals ("Stealing might be wrong") remains less developed and relies on a heavily non-standard ontology (B-properties), which some find unintuitive or explanatorily costly.

  3.  **Tier 3 (Offers promising frameworks but faces significant hurdles with multiple embedding types or lacks full compositional detail):**
      *   **Hybrid expressivism (e.g., Ridge's ecumenical expressivism, Copp's realist-expressivism):** Hybrid views combine expressivist and descriptivist elements, aiming to offload embedding problems onto the descriptive component. This *can* handle embeddings descriptively (e.g., "believes that stealing is wrong" reports belief in a descriptive property). However, deep embeddings (e.g., nested conditionals, probability over hybrid contents) raise complex questions about content unity, the interaction of expressive/descriptive components under operators, and potential over-generation of truth-conditions or attitudes. The approach often struggles to provide a *unified, purely expressivist-friendly* compositional story for all contexts, risking collapse into descriptivism or leaving expressive elements inert under embedding.

  4.  **Tier 4 (Struggles significantly with multiple core embedding contexts):**
      *   **Blackburn's quasi-realist program (higher-order attitudes):** While pioneering, the higher-order attitude approach (e.g., "Lying is not wrong" expresses disapproval of approving of lying) becomes unwieldy and psychologically implausible for complex embeddings. It struggles profoundly with propositional attitude ascriptions ("Mary believes that lying is not wrong" isn't her disapproving of approving of lying) and struggles to provide a natural account of embeddings under probability operators ("It's probable that lying is wrong") or epistemic modals ("Lying might be wrong") without significant ad-hoc maneuvers. Negation and simple conditionals are handled, but the approach falters badly beyond them.
      *   **Horgan and Timmons's logico-expressivism (non-truth-conditional disciplined semantics):** This approach emphasizes logical discipline without truth-conditions but lacks a fully developed *compositional* semantics. It struggles to systematically explain *how* complex sentences get their logico-inferential roles from the meanings of parts, especially for embeddings like probability ("P(lying is wrong) = 0.6"), epistemic modals ("It must be wrong"), and attitude ascriptions ("He fears it's wrong"). The promise of logical discipline is insufficient without a detailed mechanism for generating content in all contexts.
      *   **The "semantic innocence" approach:** The claim that expressivism can simply adopt standard truth-conditional semantics for normative language while maintaining its core expressivist commitments is widely seen as incoherent or question-begging. If normative sentences have standard truth-conditional content (referring to properties, being true/false independently of attitudes) within the compositional semantics *as used by the expressivist*, it fundamentally undermines the core expressivist thesis that their meaning *is* constituted by the expression of attitudes, making it difficult to distinguish from realism. It fails to explain *why* embeddings work if the fundamental meaning isn't truth-conditional. This approach struggles most fundamentally with *any* embedding, as it concedes the semantic ground to descriptivism.

  **Confidence & Uncertainty:**

  *   **Overall Confidence:** Moderately High. The ranking reflects a broad (though not universal) consensus within contemporary metaethics regarding the relative strengths and weaknesses of these approaches concerning compositional semantics and embedding.
  *   **Least Confident Placement:** The placement of **Hybrid Expressivism in Tier 3**. This is the most debated.
      *   *Reason for Uncertainty:* Proponents like Ridge argue sophisticated versions *can* handle embeddings compositionally by carefully defining the interaction of descriptive and expressive components under operators. Critics argue this either fails for deep embeddings or effectively concedes the game to descriptivism. Its placement hinges heavily on whether one finds the proposed compositional mechanisms for complex embeddings (like nested modals or probabilities acting on hybrid contents) ultimately convincing and expressivistically acceptable. It could arguably be placed in Tier 2 if one grants these mechanisms succeed, or remain firmly in Tier 3 if one sees the challenges as unresolved.
