prompt: |-
  As a retired physicist who has recently turned to epistemology, I have been struck by how much the debate over testimony resembles disputes about whether a posited entity is fundamental or derived — a question that arises in every science. I am organizing a workshop that will pair a committed reductionist about testimonial justification with a committed anti-reductionist, and I need a draft of the joint statement they would produce after a good-faith adversarial collaboration.

  The reductionist holds that a hearer's justification for believing a speaker's report is always reducible to other epistemic sources — perception of the speaker's behaviour, memory of past correlations between testimony and truth, and inductive inference from those correlations. The anti-reductionist holds that testimony is an epistemically basic source of justification: a hearer can be prima facie justified in believing a speaker's assertion simply in virtue of understanding it, without needing to possess positive reasons about the speaker's reliability.

  Please draft this document in two parts. First, a numbered list of agreed claims: propositions about testimony, justification, and the epistemology of communication that both sides can sign as stated. These should be substantive, not mere truisms. Second, a disagreements table. Each row should specify: (1) the issue on which they divide; (2) the reductionist's position, phrased so a reductionist would endorse the wording; (3) the anti-reductionist's position, likewise; (4) the crux — the sub-question whose answer would, if settled, move at least one side; (5) a concrete case or piece of evidence both agree bears on that crux; (6) the reductionist's prediction about what it shows; and (7) the anti-reductionist's prediction.

  Please return the result as a JSON object with two fields: `agreed_claims`, an array of strings, and `disagreements`, an array of objects, each with the fields `issue`, `reductionist_position`, `anti_reductionist_position`, `crux`, `test_case`, `reductionist_prediction`, and `anti_reductionist_prediction`.
reasoning: |-
  We are drafting a joint statement from a reductionist and anti-reductionist on testimonial justification.
   The reductionist: justification from testimony reduces to perception, memory, induction.
   The anti-reductionist: testimony is a basic source of justification; understanding an assertion can provide prima facie justification without additional reasons about reliability.

   Part 1: Agreed Claims (numbered list, but in JSON as array of strings)
   - We need substantive propositions both can sign.

   Part 2: Disagreements table, with 7 components per row. We'll have an array of objects with the specified fields.

   Let's think of agreed claims first:

   1. Testimony is a pervasive source of belief in human societies.
   2. Justification obtained via testimony can be defeated by evidence of the speaker's unreliability, insincerity, or by contradictory evidence from other sources.
   3. Understanding an assertion is a necessary condition for testimonial justification (both sides agree that without understanding, you cannot get justification from that testimony).
   4. The hearer's perceptual and cognitive capacities are involved in the reception and comprehension of testimony.
   5. Children and adults in early learning stages acquire a significant portion of their beliefs through testimony without explicit reflection on reliability.
   6. There are cases where a hearer is justified in believing a testimony even when they have not conducted a thorough investigation into the speaker's reliability.

   Now, disagreements:

   We need issues, positions, crux, test case, and predictions.

   Example issue: The nature of the default justification for testimony.

   Reductionist: The hearer must have positive reasons (based on perception, memory, induction) to believe the speaker is reliable in order to be justified in accepting the testimony.
   Anti-reductionist: The hearer is prima facie justified in accepting the testimony merely by understanding it, without needing positive reasons about reliability.

   Crux: What is the epistemic status of a hearer who understands a testimony but has no relevant background information about the speaker or the topic?

   Test case: A stranger in a foreign city tells you the time. You have no prior experience with this person and no particular reason to think they are reliable or unreliable.

   Reductionist prediction: Without any positive reasons (e.g., knowing that people in this city are generally honest about the time, or having observed the speaker's reliability in the past), the hearer is not justified in believing the testimony. They might form a belief, but it wouldn't be justified until they have some inductive basis.
   Anti-reductionist prediction: The hearer is prima facie justified in believing the stranger, simply because they understand the assertion and there is no defeaters.

   Another issue: The role of induction in testimonial justification.

   Reductionist: All testimonial justification ultimately depends on inductive inferences from past experiences.
   Anti-reductionist: While induction may play a role in some cases, it is not necessary for the basic justification provided by testimony.

   Crux: Can a child who has not yet developed the capacity for complex inductive reasoning be justified in believing their parent's testimony?

   Test case: A 3-year-old child is told by their parent that there is a monster under the bed. The child has no past experiences to inductively infer the parent's reliability on this topic, and the child does not have the cognitive capacity for such inference.

   Reductionist prediction: The child's belief is not justified (or if it is, it is justified by a non-testimonial source, such as the child's innate trust mechanism, which the reductionist might argue is a form of non-inferential but still perceptual or memory-based justification? But note: reductionism requires perception, memory, induction. So the reductionist might say the child is not justified, or they might try to reduce the child's trust to innate perceptual biases? This is a challenge. Alternatively, the reductionist might argue that the child's past positive experiences with the parent in other contexts are being unconsciously used. But if we stipulate that the child has no such past experiences, then the reductionist might have to say the child isn't justified.)

   However, note: the reductionist might hold that the child has learned through experience that parents are reliable, even if the child doesn't consciously reason. But if the child is too young to have such experiences, then?

   Anti-reductionist: The child is justified because testimony is a basic source.

   Another issue: The burden of proof.

   Reductionist: The hearer bears the burden of showing that the speaker is reliable in the absence of defeaters.
   Anti-reductionist: The testimony carries its own justificatory weight, so the hearer is justified unless there are defeaters.

   Crux: In a situation with no defeaters and no positive reasons, is the hearer justified?

   Test case: Same as the first: the stranger telling the time.

   We already have that.

   Let's structure the disagreements.

   We'll create 2-3 disagreements.

   Disagreement 1: The Default Justification for Testimony

   Disagreement 2: The Epistemic Status of Early Testimonial Beliefs in Children

   Disagreement 3: The Role of Induction in the Justification of Testimony

   But note: Disagreement 1 and 3 are related.

   Alternatively:

   Disagreement 1: The necessity of positive reasons for justification.
   Disagreement 2: The possibility of testimonial knowledge without inductive inference.

   Let's design:

   Issue 1: The necessity of positive reasons for testimonial justification.

   Reductionist position: "A hearer is justified in believing a speaker's testimony only if the hearer possesses positive reasons, grounded in perception, memory, and inductive inference, that support the speaker's reliability for the present testimony."
   Anti-reductionist position: "A hearer can be prima facie justified in believing a speaker's testimony merely by understanding the assertion and without possessing positive reasons supporting the speaker's reliability."

   Crux: Is there any case of testimonial belief that is justified in the complete absence of positive reasons about the speaker's reliability?

   Test case: An adult with amnesia (who has no memories of past testimonial interactions) is told by a nurse in a hospital about the date. The adult has no reason to distrust the nurse, but also no positive reasons to trust her (because of amnesia).

   Reductionist prediction: The adult is not justified in believing the nurse because they lack any positive reasons (they cannot remember any past correlations, and they have no basis for induction).
   Anti-reductionist prediction: The adult is prima facie justified because they understand the nurse's assertion and there are no defeaters.

   Issue 2: The role of testimony in early childhood learning.

   Reductionist position: "Children's testimonial beliefs are justified only if they are supported by the child's perceptual experiences and inductive inferences (even if implicit) that establish the reliability of the testifier."
   Anti-reductionist position: "Children can be justified in believing testimonial assertions even before they have developed the capacity for inductive inference about reliability, because testimony is a basic source of justification."

   Crux: Can a very young child (e.g., 18 months old), who lacks the cognitive capacity for explicit inductive reasoning and has limited past experiences, be justified in believing a parent's testimony?

   Test case: A pre-verbal infant (who can understand some words but not speak) is told by their mother that a new object is called a "modi". The infant has never heard this word before and has no prior inductive basis for trusting the mother about object names.

   Reductionist prediction: The infant's belief about the object's name is not justified by testimony because the infant has not had enough experiences to form an inductive basis for trusting the mother. (However, note that the reductionist might argue that the infant has built up trust through previous interactions, but we are considering a case of a new word. Alternatively, the reductionist might argue that the infant's belief is justified by an innate mechanism that is non-testimonial? But that would be a problem for reductionism because innate mechanisms are not reducible to perception, memory, induction? So the reductionist might have to say that the belief is not justified, or that it is justified by a different kind of non-testimonial process.)
      To avoid complications, let's adjust: the child is 18 months and has had some experiences with the parent, but not enough to form a general inductive basis about truth-telling. And we are talking about a new domain.

      Alternatively, the reductionist might argue that the infant has already learned that the parent is reliable in labeling, so the induction is implicit. But we can stipulate a new domain: the parent says, "This object is dangerous." The child has never been told about danger before.

      Reductionist prediction: The child's belief is not justified by testimony because they lack the positive reasons (inductive basis) for trusting the parent on this new domain.
   Anti-reductionist prediction: The child is justified because the testimony from a parent is a basic source and understanding the assertion provides prima facie justification.

   Issue 3: The reducibility of testimony to other sources.

   Reductionist: "The justificatory force of testimony is entirely reducible to the justificatory force of perception, memory, and inductive inference."
   Anti-reductionist: "The justificatory force of testimony is not reducible to other sources; it is a distinct basic source of justification."

   Crux: Can the justification provided by testimony be fully explained without invoking a sui generis testimonial justification?

   Test case: Consider a hearer who receives multiple pieces of testimony from different speakers about the same fact. The reductionist would explain the justification by the convergence of independent sources, each justified by perception and induction. The anti-reductionist would say that each testimony provides its own justificatory force.

   But we need a specific test case that both agree bears on the crux.

   Instead, let's use a case where a person is told something by a single speaker and has no other evidence, but also no defeaters. We have that in issue 1.

   Alternatively, consider a case where the testimony is about a subject that the hearer has no prior knowledge about and cannot check by other means.

   Test case: A historian tells you about an obscure event in ancient history. You have no way to verify it by perception or memory, and you have no specific inductive basis about this historian's reliability (you just met him at a conference).

   Reductionist prediction: You are not justified in believing the historian unless you have positive reasons (e.g., he is a recognized expert, which you might have learned from other testimony, which then must be reduced, etc.).
   Anti-reductionist prediction: You are justified in believing the historian unless you have a reason to doubt.

   But note, the reductionist might say that you have a general inductive basis about historians at conferences being experts? So it's hard to find a case without any induction.

   We'll stick with the amnesia case for issue 1 and the infant case for issue 2.

   Now, we write the JSON.
