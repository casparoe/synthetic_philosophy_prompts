     - A student might say: "But the activity set us up to do this, so it's artificial."
       - Response: "Exactly! We set up a situation where you were asked to generate adaptationist stories without being asked to consider alternatives. That is the critique: adaptationism often proceeds without considering alternatives, and that's what we are going to read about."

  5. Transition to the paper:
     - "In the next class, we will read Gould and Lewontin's paper that makes exactly this critique. They call the tendency to break organisms into traits and invent adaptationist stories for each the 'adaptationist programme' and compare it to Dr. Pangloss in Voltaire's Candide. They also introduce the concept of 'spandrels' as an alternative explanation. Today's activity was designed to help you feel the force of their critique from the inside."

  Materials:

  - Handouts for each group (one trait per group) with:
    - Name of the trait
    - A picture (if possible) or a detailed description
    - A brief note on the trait (e.g., for the bombardier beetle: "This beetle can eject a hot chemical spray from its abdomen when threatened.")

  - For the reveal: a slide or handout that classifies the traits and explains why.

  This should fit within the time and achieve the goals.
answer: |-
  ### **Spandrels Simulation Activity: Experiencing the Adaptationist Temptation**

  **Overview**: This activity immerses students in generating adaptationist explanations for real biological traits, only to reveal that some traits are non-adaptations (spandrels/byproducts). The "penny drop" moment occurs when students realize their confidence was misplaced for non-adaptive traits, mirroring Gould and Lewontin’s critique. No prior exposure to "spandrels" or the paper is given.

  ---

  ### **Setup (5 minutes)**
  - **Prep**: Arrange 4 tables for groups of 4. Prepare handouts (one per group) and a reveal slide.  
  - **Introduction**:  
    > "Today, we’re practicing evolutionary reasoning. Each group will get a biological trait. Your task: propose the *best* adaptationist explanation for it—how natural selection shaped this trait for survival or reproduction. Be creative, confident, and use real biology. You’ll present your story to the class."

  ---

  ### **Rules and Group Structure**  
  - **Groups**: 4 groups of 4 students. Mix biology/philosophy majors.  
  - **Rules**:  
    1. **Task**: Generate a plausible adaptationist story in 20 minutes. Include:  
       - The selective pressure (e.g., predation, climate).  
       - The fitness advantage (e.g., survival, mating).  
       - No alternative explanations (e.g., development, drift)—focus *only* on natural selection.  
    2. **Output**: Prepare a 2-minute presentation. Designate one speaker.  
    3. **Mindset**: Channel "Dr. Pangloss" (confidence in optimal design). Avoid skepticism.  

  ---

  ### **Materials (Traits)**  
  Select real traits with diverse evolutionary origins. Use concise handouts with images and brief descriptions:  

  | Group | Trait                   | Pre-classified Status      | Notes for Handout                                                                 |
  |-------|-------------------------|---------------------------|-----------------------------------------------------------------------------------|
  | 1     | **Human Chin**          | Byproduct/Spandrel        | *Description*: "Bony protrusion at the lower jaw. Found only in Homo sapiens." |
  | 2     | **Cactus Spines**       | Adaptation                | *Description*: "Modified leaves on cacti, often sharp and rigid."             |
  | 3     | **Male Nipples**        | Byproduct/Spandrel        | *Description*: "Nipples present in male mammals, non-functional for lactation." |
  | 4     | **Woodpecker’s Shock-Absorbing Skull** | Adaptation | *Description*: "Thick, spongy bone around the brain that cushions impact during pecking." |

  **Why these traits?**  
  - **Adaptations**: Cactus spines (defense/herbivory reduction), woodpecker skull (foraging adaptation).  
  - **Spandrels**: Human chin (byproduct of jaw reduction), male nipples (developmental byproduct of shared fetal blueprint).  
  - **Mix**: Avoids famous examples (e.g., panda’s thumb) to prevent prior knowledge. Includes a disputed trait (chin) to show ambiguity.  

  ---

  ### **Timeline**  
  - **0:00–0:05**: Setup and introduction.  
  - **0:05–0:25**: Group work (20 min).  
    - *Instructor circulates*, encouraging creativity:  
      > "Why *must* this trait be an adaptation? What’s the perfect selection story?"  
  - **0:25–0:45**: Presentations (2 min/group + 1 min Q&A).  
    - *Predictable stories*:  
      - Group 1 (Chin): "Protects throat in fights," "Aids speech evolution," "Sexual selection for strong jaws."  
      - Group 3 (Male Nipples): "Sensory advantage during mating," "Parental bonding in ancestral species."  
  - **0:45–0:55**: **The Reveal** (10 min).  

  ---

  ### **The Reveal**  
  - Show a slide:  
    > **"Trait Classifications Based on Evolutionary Biology:**  
    > ✅ **Adaptations**: Cactus spines, Woodpecker skull.  
    > ❌ **Non-Adaptations**: Human chin (byproduct of jawbone reduction), Male nipples (developmental byproduct).  
    >   
    > *Note: These are consensus views (e.g., chin lacks adaptive evidence; male nipples are non-functional).*"  

  - **Prompt reflection**:  
    > "Look at your stories for the chin and male nipples. You were just as confident and inventive as for the spines and woodpecker skull—yet biology says these *aren’t* adaptations. Why was it so easy to invent stories? What does this reveal about adaptationist reasoning?"  

  - **Let the penny drop**: Students will gasp/laugh as they realize they "Panglossed" non-adaptations.  

  ---

  ### **Debrief (40 minutes after break)**  
  **Structure**: Use guided discussion. Map student reactions to paper concepts.  

  #### **1. Map Activity to Paper’s Concepts**  
  - **Spandrel**: Define it now: "A byproduct of adaptive changes, not directly selected for. Like the chin—it emerged because jawbones shrank, not for a ‘purpose’."  
  - **Adaptation vs. Exaptation**:  
    - Adaptation: Woodpecker skull *directly* selected for shock absorption.  
    - Exaptation: Mention feathers (thermoregulation co-opted for flight) to contrast with spandrels.  
  - **Panglossian Paradigm**:  
    > "You were all Dr. Pangloss—confident that traits are ‘optimal’ and inventing stories without testing. Gould and Lewontin argue this dominates biology."  
  - **Burden of Proof**:  
    > "You assumed adaptation was the default. In reality, we must *test* if a trait is adaptive, not assume it."  
  - **"How Come?" vs. "What For?"**:  
    > "You focused on ‘what for?’ (teleology). Gould and Lewontin demand we ask ‘how come?’ (developmental constraints, phylogeny)."  

  #### **2. What the Activity Gets Right**  
  - Captures the seductiveness of storytelling and the ease of ignoring alternatives.  
  - Shows adaptationism as the "default" mode of reasoning.  

  #### **3. What It Unavoidably Distorts**  
  - **Pre-classified traits**: In reality, biologists don’t know the status upfront—they investigate. We skipped the testing phase (e.g., comparative studies).  
  - **Oversimplified alternatives**: Focused only on spandrels, excluding drift/constraints. Real biology is messier.  

  #### **4. Predictable Problems and Responses**  
  - **Resistance from biology majors**:  
    - *Grounds*: "But male nipples *could* be adaptive!" or "The chin might have a hidden function!"  
    - *Response*:  
      > "You’re proving Gould and Lewontin’s point! Without evidence, we can *always* invent stories. The critique isn’t that adaptation is wrong—it’s that we need rigorous tests (e.g., fossil/genetic data) to avoid just-so stories."  
      - **Redirect**: "Would your story hold up if we checked developmental pathways?"  
  - **Philosophy majors overgeneralizing**:  
    - *Grounds*: "All adaptationist science is flawed!"  
    - *Response*:  
      > "The paper isn’t anti-adaptation—it’s anti-*uncritical* adaptationism. Spandrels are rare; the issue is assuming *every* trait is an adaptation."  
  - **Group 1 (Chin) frustration**:  
    - *Grounds*: "We were set up to fail!"  
    - *Response*:  
      > "Exactly! The activity reveals how the adaptationist paradigm *sets us up* to ignore alternatives. Now you’ve felt the tension the paper explores."  

  #### **5. Transition to Paper**  
  > "Next class, we’ll see how Gould and Lewontin formalize this. They’ll argue that biology’s ‘adaptationist programme’ is like assuming spandrels in a cathedral were designed for art—not a byproduct of arches. You’ve already experienced the programme’s allure and pitfalls."  

  ---

  ### **Logistical Notes**  
  - **Timing**: Groups may run over; cut presentations at 2 mins.  
  - **Reveal Impact**: Use humor to soften blow (e.g., "Congratulations—you’re all Panglossians!").  
  - **Homework**: Assign the paper *after* the activity to leverage cognitive dissonance.  

  By experiencing their own adaptationist overreach, students will grasp Gould and Lewontin’s critique viscerally—making the paper’s arguments resonate deeply.
