  2. They have 20 minutes to prepare a 2-minute presentation of their explanation.

  Timeline:

  0:00 - 0:05: Introduction
  - "Today we are going to practice generating evolutionary explanations. In your groups, you will be given a biological trait. Your task is to come up with a plausible adaptationist explanation for that trait. That is, explain how natural selection might have shaped that trait by conferring an advantage to the organisms that had it. You will present your explanation to the class. Be creative and confident!"

  0:05 - 0:25: Group work (20 min)
  - Distribute handouts with the trait and a brief description. Groups work.

  0:25 - 0:45: Group presentations (each group gets 3 minutes: 2 min presentation, 1 min for quick questions or clarification)

  0:45 - 0:55: The Reveal
  - After all presentations, the instructor reveals the true status of each trait (based on current biological understanding). For the bombardier beetle and camel hump: "Yes, these are widely accepted as adaptations." For the human chin and male nipples: "Actually, these are not adaptations. The human chin is a byproduct of the reduction of the lower face in human evolution, and male nipples are a byproduct of developmental processes that are the same in both sexes because the basic body plan is female until hormones differentiate the sexes. There is no known selective advantage for these traits in their current form."

  - Then, the instructor asks: "Notice that you generated confident, plausible stories for the non-adapted traits too. Why do you think that was so easy? What does that say about adaptationist reasoning?"

  0:55 - 1:05: Break (10 min) - to let the point sink in.

  1:05 - 1:45: Debrief (40 min)

  Structured Debrief:

  1. Map the activity to the paper's concepts:
     - Adaptation: traits that have been shaped by natural selection for their current function (beetle spray, camel hump).
     - Spandrel (byproduct): a trait that is a necessary byproduct of other adaptive traits (chin and male nipples). Note: the term "spandrel" is introduced here.
     - Exaptation: a trait that evolved for one purpose and was later co-opted for a new one (not directly in our examples, but we can mention that the chin might have been co-opted for social signaling? Not really. We can use feathers: originally for thermoregulation, then for flight).
     - Panglossian paradigm: the tendency to assume that every trait is an adaptation and to invent a story to explain it, without considering alternatives. The activity showed how easy it is to do this.
     - Burden of proof: In the activity, we didn't require evidence for the stories. In real biology, how do we shift the burden of proof to rule out non-adaptive explanations?
     - "How come?" vs. "What for?": The activity focused on "what for?" (teleology) but we also need to ask "how come?" (mechanism, development, phylogeny).

  2. What the activity gets right:
     - It captures the seductiveness and ease of generating adaptationist stories.
     - It shows that even for non-adaptations, we can come up with plausible stories.

  3. What it unavoidably distorts:
     - We pre-classified the traits, but in reality, biologists don't know the classification in advance and must investigate.
     - The activity doesn't model the actual process of testing adaptationist hypotheses (e.g., comparative method, experimental tests, developmental evidence).
     - We only considered one alternative (byproduct), but there are others (genetic drift, constraints, etc.).

  4. Predictable problems and how to handle them:
     - Resistance: Some students (especially biology majors) might argue that the non-adaptations could still be adaptations. For example, "Maybe the chin is for sexual selection?" or "Male nipples could be for sexual stimulation?" 
       - Response: Acknowledge that it's hard to prove a negative, but the point is that without evidence, we shouldn't assume adaptation. The burden of proof is on the adaptationist claim. We can also note that the current consensus in biology is that these are byproducts. The activity is about the ease of storytelling without evidence.
