answer: |-
  Here’s a concise, battle-tested quiz designed to categorize AI takeoff views based on concrete scenarios. It avoids direct self-identification questions and focuses on empirical predictions. The scoring isolates four major positions while flagging edge cases.

  ---

  ### **Quiz: What’s Your AI Takeoff View?**  
  *Answer based on your predictions, not preferences.*  

  1. **A lab creates an AI that’s 10% better at AI research than its human team. How quickly would this system, *without new hardware*, likely design a successor 50% better than itself?**  
     A. Hours to days  
     B. Weeks to months  
     C. 6–18 months  
     D. >2 years or never  

  2. **Training a frontier AI model in 2030 requires:**  
     A. ~100× today’s compute + today’s algorithms  
     B. ~10× today’s compute + novel algorithms  
     C. ~Today’s compute + revolutionary algorithms  

  3. **To automate 90% of AI research tasks, how much real-world deployment (e.g., robotics, user testing) is needed?**  
     A. Minimal (simulations/data suffice)  
     B. Moderate (limited real-world trials)  
     C. Extensive (years of deployment)  

  4. **The first system to broadly match human researchers at AI R&D will be:**  
     A. A single monolithic model  
     B. A toolkit of specialized models + human oversight  
     C. An ecosystem of tools (no clear “AGI moment”)  

  5. **Once an AI can *fully* automate AI research, how long until the public notices massive disruption (e.g., 30% of tech jobs lost)?**  
     A. <1 month  
     B. 1–6 months  
     C. 6–24 months  
     D. >2 years  

  6. **Progress toward superhuman AI will hit its biggest bottleneck in 2025–2035:**  
     A. Compute/energy (we need bigger chips)  
     B. Algorithms/insights (we need new ideas)  
     C. Data/deployment (we need real-world testing)  

  7. **When an AI reaches human-level research skills, further gains will primarily come from:**  
     A. Recursive self-improvement (AI designs better AI)  
     B. Human-led scaling + iteration  
     C. Economic integration (slow real-world refinement)  

  8. **By 2040, AI will have automated:**  
     A. >80% of current knowledge work  
     B. 40–80% of knowledge work  
     C. <40% of knowledge work  

  ---

  ### **Scoring Key**  
  *(Map answers to positions using the table below)*  

  | Position                  | Core Beliefs                             | Expected Answer Pattern                     |
  |---------------------------|------------------------------------------|---------------------------------------------|
  | **Hard Takeoff (FOOM)**   | Algorithms dominate; recursive explosion | 1A, 2B/C, 3A, 4A, 5A, 6B, 7A, 8A           |
  | **Moderate (Fast, Not Recursive)** | Fast scaling, no recursion           | 1B/C, 2A/B, 3A/B, 4B, 5B, 6A, 7B, 8A/B     |
  | **Soft Takeoff**          | Compute/data bottlenecks; gradual gains | 1C/D, 2A, 3B/C, 4B, 5C/D, 6A/C, 7B/C, 8B/C |
  | **No Discrete Event**     | Economic automation only; no "AGI"      | 1D, 2A, 3C, 4C, 5D, 6C, 7C, 8C             |

  ### **How to Score**  
  - Tally matches for each position above.  
  - Highest match count wins.  
  - Tiebreakers:  
    - Hard vs. Moderate: Look at Q1/Q7 (recursion) → Hard favors 1A/7A.  
    - Soft vs. No Discrete: Look at Q4/Q5 (discontinuity) → No Discrete favors 4C/5D.  

  ### **Edge Cases & Diagnoses**  
  - **Ambiguous Pairs**:  
    - *Hard vs. Moderate*: Both predict fast disruption but diverge on *recursion* (Q1, Q7).  
    - *Soft vs. No Discrete*: Both predict slow progress but diverge on *discontinuity* (Q4, Q5).  
  - **Incoherent/Unattractive Views**:  
    - "**Recursion but no discontinuity**" (e.g., 7A + 5D): *Unattractive—recursion implies speed.*  
    - "**Discontinuity but no scaling/recursion**" (e.g., 5A + 2C + 7C): *Incoherent—no mechanism for sudden jump.*  
    - "**Human-only stagnation**" (e.g., 1D + 7B + 8C): *Unexplored—ignores AI-aided progress.*  

  ### **Why This Works**  
  - **Dimensions covered**:  
    - Compute (Q2, Q6) vs. algorithms (Q2, Q6, Q7)  
    - Recursion (Q1, Q7) vs. iteration (Q1, Q7)  
    - Discontinuity (Q4, Q5) vs. gradualism (Q4, Q5, Q8)  
  - **Icebreaker-ready**: Positions spark debate (e.g., *"Why do you think recursion is impossible?"*).  

  Print this, hand it out at your meetup, and watch the arguments unfold! 🔥
