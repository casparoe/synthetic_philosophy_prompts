prompt: |-
  I'm part of a reading group that's been working through the knowledge argument for a few months, and two members have settled into positions that keep talking past each other. One of them is a physicalist who thinks what Mary gains when she leaves the black-and-white room is best understood as abilities — knowing how to imagine, recognize, and remember red experiences — plus perhaps acquaintance with a property she could already refer to, so the thought experiment gives no reason to reject physicalism. The other thinks Mary gains a new fact about what red experiences are like, a fact that wasn't entailed by the complete physical truth, so physicalism is false. We've decided to run this as a formal adversarial collaboration rather than sit through another year of back-and-forth.

  Draft the joint statement these two could both sign after a good-faith process. I want (1) a numbered list of claims both can accept about the setup — what Mary knows before release, what she can and can't do, and what the complete physical information has to include — plus claims about what the argument would actually need to show to threaten physicalism; (2) the precise residual disagreement, each side's view worded so its own holder would sign it; (3) the cruxes, the sub-questions such that settling one would move at least one side — for example whether Mary's new knowledge is propositional at all, whether it is deducible a priori from the physical truth, and whether abilities or acquaintance can do the explanatory work; and (4) for each crux, a concrete case or argument both sides agree bears on it, with each side's prediction recorded in advance. If part of their dispute is just about words, say which part and why. Format it as an agreed-claims section followed by a disagreements table.
