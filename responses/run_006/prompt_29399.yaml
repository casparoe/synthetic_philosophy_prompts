  Okay, the user is part of a reading group stuck on the knowledge argument (Mary's room). Two members are talking past each other: a physicalist who thinks Mary gains abilities/acquaintance, and an anti-physicalist who thinks she gains new non-physical facts. They want to structure this as an adversarial collaboration with a signed joint statement. 

  Hmm, this is a sophisticated request—they've clearly been deep in the weeds for months. The formal structure they're asking for suggests frustration with circular debates. I should focus on creating a framework that forces clarity on the actual disagreement points. 

  The user's unspoken needs seem to be: (1) stopping repetitive arguments, (2) making progress by isolating cruxes, and (3) perhaps subtly nudging both sides toward recognizing where their positions might be flexible. The mention of "if part is just about words" shows they suspect some terminological deadlock.

  For the agreed claims section, I need to anchor everything in canonical Jackson/Frankfurt formulations to prevent disputes over setup. The physicalist will want explicit acknowledgment that Mary has all physical facts, while the anti-physicalist will insist on her inability to imagine red. Listing entailment conditions is crucial—that's where the real battle lines are.

  The disagreements table is trickier. I must phrase each position in its strongest form: for the physicalist, emphasizing explanatory completeness of abilities; for the anti-physicalist, stressing the brute fact of new propositional knowledge. The "not merely verbal" note is key—both sides think they're disagreeing substantively.

  For cruxes, I'll pick three that cleanly split them: (1) propositional status of "what it's like", (2) deducibility, (3) explanatory adequacy of abilities. The thought experiments need to be bulletproof—no wiggle room. The inverted spectrum case is perfect because both sides accept it as valid, but draw opposite conclusions. 

  Biggest risk is the physicalist rejecting "Mary knows a new fact" as question-begging. That's why I added the explicit "(by her standards)" qualifier in the table. The abilities-vs-acquaintance distinction might need more scaffolding in the concrete cases... but overcomplicating could ruin the exercise. 

  Final touch: emphasizing this is provisional. That protects both sides' egos while committing them to future resolution points. Smart groups always forget to build that in.
answer: |-
  ## Joint Statement: Adversarial Collaboration on the Knowledge Argument (Mary's Room)

  **Preamble:** We, the undersigned Physicalist (P) and Anti-Physicalist (AP) members of the reading group, having engaged in sustained good-faith discussion on Frank Jackson's Knowledge Argument, recognize that our prior exchanges often talked past each other. We agree on the core setup and implications for physicalism but disagree fundamentally on the nature of what Mary learns upon release. This document aims to: (1) Establish common ground on the setup and argumentative stakes; (2) Precisely define our residual disagreement; (3) Identify key cruxes (sub-questions) whose resolution would meaningfully advance the debate; (4) Outline concrete cases/arguments relevant to each crux, recording our respective predictions. We acknowledge this is a snapshot of our current positions.

  ### Part 1: Agreed Claims
  Both parties accept the following statements concerning the thought experiment and its implications:

  1.  **Pre-Release Knowledge:** Before release, Mary possesses *all* physical information relevant to human color vision and the experience of seeing red. This includes complete knowledge of:
      *   Neurophysiology of vision (retinal processing, optic nerve transmission, V1/V4/V8 activation patterns, etc.).
      *   Physics of light (wavelengths, reflectance properties).
      *   Functional roles of color states (discrimination, categorization, behavioral dispositions).
      *   All physical causes and effects associated with seeing red.
      *   How physical systems realize the relevant functional roles.
  2.  **Pre-Release Limitations:** Despite possessing all physical information, Mary, while in the room, *cannot*:
      *   Visually imagine or mentally simulate the experience of seeing red.
      *   Recognize a red object *as red* based solely on its visual appearance.
      *   Remember a visual experience of red (having never had one).
      *   Discriminate red from other colors *by sight* in novel scenarios.
  3.  **Post-Release Gain:** Upon release and seeing a red object for the first time, Mary learns *something new*. Her epistemic state changes in a way that enables her to do things she couldn't do before (imagine, recognize, remember red visually).
  4.  **The "Complete Physical Truth" (CPT):** The CPT includes all fundamental physical facts (laws, particles, fields) and *all facts supervenient upon or necessitated by* the fundamental physical facts. This includes biological, functional, and high-level structural facts. (AP: This defines physicalism; P: This is what physicalism claims is complete).
  5.  **What the Argument Needs to Show to Threaten Physicalism:** For the argument to successfully refute physicalism, it must demonstrate that what Mary learns upon release is a *genuinely new fact* about the world (specifically, about conscious experience) that is:
      *   **a)** *Propositional* in nature (knowing *that* something is the case).
      *   **b)** *Not deducible a priori* from the complete physical truth (CPT).
      *   **c)** *Not explainable solely* in terms of gaining new abilities (know-how) or direct acquaintance (non-propositional awareness).
      *   **d)** Such that this new fact *is not necessitated by* the CPT.

  ### Part 2: Residual Disagreement & Cruxes

  | Aspect                     | Physicalist (P) Position (Worded for P to Sign)                                                                                                | Anti-Physicalist (AP) Position (Worded for AP to Sign)                                                                                                                               |
  | :------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Core Disagreement:**     | **What Mary gains is best explained as new abilities (knowing how to imagine/recognize/remember red) and/or direct acquaintance with the phenomenal quality of red, which she could already refer to via physical/functional descriptions. This gain does not constitute knowledge of a new, non-physical *fact* and thus poses no threat to physicalism.** | **Mary gains knowledge of a genuinely new, non-physical *fact*: she learns *what it is like* to see red. This phenomenal fact was not deducible a priori from the complete physical truth and is not necessitated by it, thus demonstrating the falsity of physicalism.** |
  | **Not Merely Verbal:**     | Both sides agree this is a substantive disagreement about the nature of phenomenal knowledge and the completeness of physical explanation, not just semantics.                                                                                                                               |                                                                                                                                                                                      |
  | **Key Cruxes:**            |                                                                                                                                                |                                                                                                                                                                                      |
  | **1. Propositional Status:** <br> *Is Mary's new knowledge best characterized as knowing a proposition (a fact-that)?* | P: **No.** Her core gain is non-propositional: abilities and acquaintance. Any "knowing that" statements she makes post-release (e.g., "This is what red looks like") express her acquaintance or exercise her new abilities, not a fundamentally new proposition inaccessible before. | AP: **Yes.** Mary learns the truth of a specific proposition: "<i>This</i> [the phenomenal quality] is what it is like to see red." This proposition was unknown and unknowable under physical description alone. |
  | **2. A Priori Deducibility:** <br> *Is Mary's new knowledge deducible a priori from the CPT?* | P: **Yes, in principle.** Given *truly* complete physical/functional information and unlimited cognitive capacity, Mary *could* deduce what experiences would be like, predicting the abilities she would gain. Her inability is practical/epistemic, not metaphysical. | AP: **No.** No amount of a priori reasoning on the CPT, regardless of cognitive capacity, allows Mary to deduce the specific phenomenal character of red. The gap is conceptual/metaphysical. |
  | **3. Explanatory Adequacy of Abilities/Acquaintance:** <br> *Can the new abilities and acquaintance fully explain Mary's epistemic gain without invoking a new propositional fact?* | P: **Yes.** Abilities (know-how) and acquaintance are distinct types of knowledge. Acquaintance provides the direct "presence" of the quality, and abilities enable its cognitive manipulation. This explains her new capacities without needing new facts. | AP: **No.** Abilities and acquaintance themselves *presuppose* or *are explained by* her grasp of the new phenomenal fact. Knowing *how* to imagine red requires knowing *what* to imagine; acquaintance *is* awareness of the fact. Explaining her gain *requires* the new fact. |

  ### Part 3: Concrete Cases & Predictions

  | Crux | Concrete Case/Argument Relevant to Crux | P's Prediction/Interpretation | AP's Prediction/Interpretation |
  | :--- | :-------------------------------------- | :---------------------------- | :--------------------------- |
  | **1. Propositional Status** | **Mary's Utterance Test:** Upon seeing red, Mary says: "So *this* is what it's like! I now know something I didn't know before: *what seeing red is like*." Is this utterance most plausibly understood as reporting a new proposition learned? | **P:** She reports a *change in her epistemic access* (acquaintance) and her *new ability* to refer indexically ("this"). She expresses her realization *using* abilities/acquaintance, not describing a newly apprehended proposition. The "something" is the phenomenal quality itself, accessed, not a proposition. | **AP:** She directly reports learning a new piece of information – the fact of what it is like. The utterance "I now know something I didn't know before" explicitly signifies the acquisition of propositional knowledge. The "something" *is* the phenomenal fact. |
  | **2. A Priori Deducibility** | **The Inverted Spectrum Conceivability:** Mary knows the CPT. She also knows that Subject A reports seeing red when shown roses and Subject B reports seeing red when shown roses. She is asked, purely based on the CPT and a priori reasoning: "Is it conceivable that Subject A's experience when seeing roses is phenomenally inverted relative to Subject B's experience, even though all their functional states, behaviors, and brain states (as described physically) are identical?" | **P:** **No, it is not conceivable.** Given the CPT includes the complete physical realization base and functional roles, and given physicalism, identical physical/functional states *must* produce identical phenomenal states. Any seeming conceivability stems from an incomplete grasp of the CPT's implications. | **AP:** **Yes, it is conceivable.** The CPT, even if complete, does not logically entail the specific phenomenal character. Mary can coherently conceive of the physical/functional duplicates having inverted qualia, demonstrating the failure of a priori deducibility. |
  | **3. Explanatory Adequacy** | **The Explanatory Gap Challenge:** Grant that Mary gains abilities and acquaintance. Can we fully explain *why* she can now imagine red (what guides her mental imagery?), recognize red (what is she matching the perception *to*?), and remember red (what is the content of the memory?) *without* invoking her grasp of the phenomenal fact/property *redness*? | **P:** **Yes.** The new ability to imagine red is triggered by the novel sensory input and involves activating latent neural pathways defined by the CPT. Recognition is pattern-matching using these new sensory templates. Memory is stored sensory information. Acquaintance *is* the having of the experience. No further "grasp of a fact" is needed. | **AP:** **No.** To imagine red, she must have *what it is like* as the intentional object/content of her imagination. To recognize red, she must match the perception to a stored representation *of the phenomenal quality itself*. The memory *is* a representation *of that phenomenal fact*. Abilities and acquaintance require this phenomenal content; they don't replace it. |

