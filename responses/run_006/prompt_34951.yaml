prompt: |-
  I chair the state's Criminal Sentencing Commission. We are in the final stages of revising our actuarial risk assessment instrument, which judges are required to consult at sentencing and in pretrial detention decisions. The instrument works by assigning a defendant a recidivism probability based on the rearrest rate of a statistical reference class that includes the defendant. The problem that has deadlocked the commission for two months is the reference class problem. Any individual defendant belongs to indefinitely many reference classes, and the predicted rearrest rate varies dramatically depending on which one we select. Our analyst can place the same defendant in a class defined by age bracket and prior felony count (yielding, say, a 34% rearrest rate), or by zip code and employment status (yielding 52%), or by the specific offense of conviction (yielding 28%), or by participation in substance-abuse treatment while incarcerated (yielding 19%). The statisticians on our staff have been clear: this is not a technical problem with a technical solution. It is a philosophical problem about how to assign probabilities to singular cases, and there is no consensus in the statistical or philosophical literature on how to choose the uniquely correct reference class.

  The commission is now split into three factions. One faction wants to mandate the narrowest reference class that still meets a minimum sample-size threshold, on the grounds that it is the most specific to the individual. A second faction wants to require the instrument to report a range — the minimum and maximum rearrest rates across all reference classes that are statistically reliable — and let the judge weigh the range against the case's particulars. A third faction wants to abandon the actuarial approach entirely and move to a structured clinical assessment model, where a trained evaluator makes a holistic judgment informed by the data but not mechanically bound to any single reference class. I need to draft a decision memo, to be circulated before our next meeting, that recommends one of these approaches — or a fourth, if there is a better one — and explains the reasoning. The memo must take the reference class problem seriously as a philosophical difficulty: it cannot simply pick a class and proceed as if the problem has been solved. But it must also be actionable. The courts need an instrument they can actually use, and the commission needs a policy it can vote on.
reasoning: |-
  Okay, the user chairs a state's Criminal Sentencing Commission and is facing a deadlock over the reference class problem in their actuarial risk assessment instrument. The core issue is that a defendant can belong to multiple reference classes with varying recidivism rates, and there's no statistical consensus on selecting the "correct" one. The commission is split into three factions, each proposing different solutions.

  The user needs to draft a decision memo that takes this philosophical problem seriously while providing an actionable solution. The memo must resolve the deadlock and offer something the courts can practically implement. 

  Breaking this down: First, the reference class problem is indeed fundamental—it's about how to assign probabilities to unique individuals when they fit multiple statistical groups. Philosophers like Reichenbach and Venn debated this, and modern statisticians acknowledge it's unavoidable in singular case predictions. Pretending one reference class is "objectively correct" would be scientifically dishonest.

  Now evaluating the three factions:
  - The narrowest-class approach seems precise but risks creating arbitrary micro-classes ("35-year-old unemployed college graduates with one prior drug conviction in ZIP 12345"). Small samples could amplify noise, and it dodges the core philosophical issue.
  - The range-based approach honestly exposes uncertainty but might overwhelm judges. Presenting a 19%-52% range without guidance could lead to inconsistent rulings and potential "anchoring" on extremes.
  - Abandoning actuarial methods for clinical assessment loses the benefits of data-driven consistency. Research shows unstructured clinical judgments often underperform actuarial tools, and bias risks increase when evaluators override statistics.

  Considering alternatives... Hybrid models exist but often kick the reference class problem down the road. Weighting classes requires another arbitrary choice. What if the commission reframed the instrument as a decision support tool rather than a probability oracle? 

  A possible fourth option: Use multiple robust reference classes (demographics, offense type, behavioral factors) to generate separate estimates, then present them as distinct data points—not a single number or range. Pair this with mandatory judicial training emphasizing that these are population-level reference points, not personal destiny. The instrument would output something like: "Based on similar defendants:  
  • Age/prior convictions: 34%  
  • Neighborhood/employment: 52%  
  • Offense type: 28%  
  • Treatment participation: 19%"  

  This approach has advantages: It confronts the reference class problem transparently, provides richer context than a range, keeps data central but avoids false precision, and empowers judges while curbing overreliance on any one metric. The training component is crucial—judges need to understand why these numbers diverge.

  For implementation, the commission could:  
  1) Define 4-5 evidence-based reference classes (avoiding discriminatory factors like race)  
  2) Set strict sample-size/reliability thresholds  
  3) Develop judicial guidelines on interpreting multi-class outputs  
  4) Mandate evaluator training on cognitive biases  

  This satisfies the memo's requirements: it takes philosophy seriously, is actionable (vote on classes/thresholds), and gives courts a usable tool. The faction wanting narrow classes gets specificity; the range faction gets transparency; the clinical faction gets human judgment integrated with data.  

  The memo should stress that no system eliminates uncertainty, but this balances scientific integrity with practical needs. It turns a philosophical limitation into a structured deliberation aid.
answer: |-
  ## Memorandum: Resolution to the Reference Class Problem in Actuarial Risk Assessment  
  **To:** Members of the State Criminal Sentencing Commission  
  **From:** Chair, State Criminal Sentencing Commission  
  **Date:** October 26, 2023  
  **Subject:** Integrating Epistemic Honesty and Practical Action on Reference Classes  

  ### I. Acknowledging the Core Problem
  The reference class problem is an irreducible philosophical dilemma. No statistical technique can identify a "true" reference class for a singular defendant, as individuals simultaneously belong to countless overlapping groups with divergent recidivism rates. Mandating a single class (e.g., narrowest class meeting sample size) falsely implies scientific precision where none exists. Reporting a range, while transparent, delegates an unresolved statistical quandary to judges without guidance. Abandoning actuarial methods forfeits the proven benefits of data-driven consistency for unstructured clinical judgment, which introduces greater subjectivity and higher error rates.  

  ### II. Recommended Approach: **Multi-Class Framework with Judicial Guidance**  
  I propose a fourth path that directly confronts the reference class problem while remaining operational:  

  #### A. **Instrument Design**  
  1. **Simultaneous Calculation of Multiple Reference Classes**:  
     - The instrument will calculate and display **3–5 recidivism estimates** derived from distinct, pre-defined reference classes (e.g., Demographics + Criminal History; Geography + Socioeconomics; Offense Type + Behavioral Factors).  
     - Classes must meet rigorous criteria:  
       - Statistically reliable (n > 100, 95% CI width ≤ ±10%).  
       - Legally permissible (e.g., excludes race, religion, immutable characteristics).  
       - Theoretically defensible (e.g., classes grounded in criminological research).  

  2. **Contextual Reporting**:  
     - Estimates will be presented as complementary data points (e.g., "Reference Class A: 34%; Reference Class B: 52%; Reference Class C: 28%").  
     - Output will explicitly state: *"These estimates reflect group-level trends, not individual destiny. Discrepancies arise because defendants belong to multiple populations. Judicial discretion must integrate these data with case-specific factors."*  

  #### B. **Judicial Protocol**  
  1. **Mandatory Judicial Training**:  
     - Judges will receive training on:  
       - The reference class problem and its implications.  
       - How to interpret conflicting estimates (e.g., "A 19% estimate reflects treatment engagement; a 52% estimate reflects socioeconomic risk").  
       - Prohibitions against averaging or cherry-picking rates.  

  2. **Structured Sentencing Worksheet**:  
     - Judges must complete a checklist documenting:  
       - Which reference class estimates were considered most/least relevant and why.  
       - Case-specific factors overriding or modifying the actuarial estimates (e.g., "Defendant’s 10-year sobriety outweighs high geographic risk").  

  ### III. Why This Approach Resolves the Deadlock
  - **Faction 1 (Narrowest Class)**: Addressed by including specific classes (e.g., offense type + age) but avoids false precision by pairing them with broader contexts.  
  - **Faction 2 (Range Reporting)**: Achieves superior transparency by showing discrete data sources behind the range, enabling nuanced judicial analysis.  
  - **Faction 3 (Clinical Model)**: Retains data-driven rigor while incorporating human judgment in interpreting multiple estimates—not replacing them.  
  - **Epistemic Honesty**: Explicitly acknowledges that no class is "correct," transforming the problem from a flaw into a feature that enriches contextual assessment.  
  - **Actionability**: Classes and training protocols are definable/voteable. Courts gain a structured, auditable process.  

  ### IV. Implementation Roadmap
  1. **Commission Vote**: Approve the multi-class framework and criteria for reference classes.  
  2. **Class Selection**: Analyst team proposes 3–5 classes meeting reliability/legal standards; commission approves final set.  
  3. **Training Development**: Collaborate with judicial council on a 4-hour curriculum.  
  4. **Pilot Testing**: Implement in 3 districts for 6 months; refine based on feedback.  

  ### V. Conclusion
  The reference class problem cannot be solved—but it can be managed with intellectual integrity and practical utility. This approach rejects false certainty and unstructured discretion, instead leveraging multiple estimates to foster informed judicial reasoning. It transforms statistical ambiguity from a weakness into a catalyst for contextualized decision-making. I move that we adopt this model and vote on reference class criteria at our next meeting.  

  **Recommended Vote**: Approve the multi-class framework and initiate steps 1–4 above.  

  ---  
  *Attachment: Draft criteria for reference classes (e.g., sample size thresholds, prohibited variables, criminological validity standards).*
