prompt: |-
  I'm putting together a 'which theory of mental representation do you actually hold?' quiz for a cog-sci blog, and I want it to sort people by their gut reactions to cases rather than by which label sounds good. Give me eight to ten questions, each a concrete case with two or three answer options. Use cases like: systematicity (someone who can think 'the dog bit the cat' but supposedly can't think 'the cat bit the dog'), productivity (understanding a sentence you've never heard before), a rat taking a shortcut through a maze, a chess player who 'just sees' the tactic, cross-modal transfer from vision to touch, ambiguous sentences like 'visiting relatives can be annoying', someone mentally rotating a shape, an aphasia patient who keeps concrete nouns but loses grammatical structure. Phrase the options so a reader can answer without knowing any theory labels — no question should ask 'do you think thoughts are sentences in the head?'. Then give a scoring key mapping answer patterns onto at least: classical language of thought (compositional, syntax-like), connectionist or vector-space representation, map-like or analogue representation, and a deflationary view that denies structured mental representations. Write a short plain-language blurb for each result. Also flag which positions your questions can't cleanly seperate.

  Structure it as: The questions (the cases and options, ~450 words); The scoring key (which options count toward which view, ~200 words); The result blurbs (one short paragraph per view, ~300 words total); Where the quiz fails (which positions it can't separate and why, ~150 words).
