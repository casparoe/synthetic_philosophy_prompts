answer: |-
  Alright, let's break down that potent Nietzschean slogan ("There is no 'being' behind doing, effecting, becoming; 'the doer' is merely a fiction added to the deed—the deed is everything") from *On the Genealogy of Morals* (Essay I, §13) into its distinct possible meanings. We'll assess each for defensibility and its impact on praise/blame. Think of this as your philosophical cheat sheet for the bar.

  **The Core Slogan:** "There is no doer behind the deed; the doer is a fiction added later."

  **The Menu of Readings:**

  1.  **The Linguistic Fiction Reading:**
      *   **Claim:** Our *language* (subject-verb-object structure) forces us to invent a "doer" (subject) for every verb/action. We say "Lightning flashes," implying a thing *called* lightning that *does* flashing. Nietzsche argues the flashing *is* the lightning; there's no separate entity *behind* it. Similarly, we say "I think," implying an "I" separate from the thinking. This is just a grammatical habit, not deep reality.
      *   **Defensible?** **Yes, partially.** Nietzsche is spot-on about how language shapes our perception. We *do* constantly reify processes into things/subjects. This is a powerful linguistic insight.
      *   **Kills Praise/Blame?** **No.** Even if the *grammar* misleads us, we can still evaluate the *action* ("the deed") and its consequences within a social, psychological, or biological context. We blame the *act* of theft or praise the *act* of generosity, regardless of the precise metaphysics of the "thief" or "generous person." This is the *weakest* interpretation regarding responsibility.

  2.  **The Metaphysical Bundle Theory / Process Reading:**
      *   **Claim:** There is no single, unified, enduring "self" or "soul" *behind* actions. What we call the "doer" is actually a complex, ever-changing bundle of drives, affects, instincts, physiological states, and environmental influences. Actions emerge *from* this dynamic interplay, not from the conscious command of a central controller. The "I" is a *result* of these forces interacting, not their originator. The lightning *is* the discharge; the "self" *is* the flux of drives.
      *   **Defensible?** **Highly Defensible & Core Nietzsche.** This aligns with much modern psychology, neuroscience, and Nietzsche's own view of the self as a "social structure of drives and affects." It dismantles the simplistic "ghost in the machine" model of agency.
      *   **Kills Praise/Blame?** **Complicates, but Doesn't Eliminate.** Traditional blame/praise based on a *metaphysically free*, unitary ego *is* undermined. However, Nietzschean evaluation doesn't disappear. We can still:
          *   **Evaluate the Action/Outcome:** Assess the deed's consequences (Does it create strength, nobility, life-affirmation? Or weakness, resentment, sickness?).
          *   **Evaluate the Constellation of Drives:** Praise/blame could be seen as social tools to shape the *future constellation of drives* within an individual or society ("This act reveals dangerous drives we must suppress/redirect," or "This act reveals healthy drives we should encourage").
          *   **Focus on Responsibility as "Answerability":** Hold the person (as the locus of this bundle) *answerable* for the actions that emerge from it, even if not "free" in the absolute sense. (Think: holding a complex machine responsible for its output). Blame becomes less about *ultimate desert* and more about *causal connection*, *character assessment*, and *social consequence*.

  3.  **The Psychological Retrospection Reading:**
      *   **Claim:** Consciousness, particularly the *narrating* part of our mind, *creates* the sense of a "doer" *after* the action occurs. Actions often originate unconsciously from drives/affects. Our conscious mind then retrospectively constructs a story where "I" decided, chose, and acted. The "doer" is a narrative fiction woven to make sense of the deed and create a sense of coherence and control.
      *   **Defensible?** **Yes, Strongly Supported.** Modern cognitive science on the delay of conscious awareness of decisions (Libet experiments, though debated) and the brain's constant post-hoc narrative construction supports this. Nietzsche was incredibly prescient here.
      *   **Kills Praise/Blame?** **Complicates Conscious Control, Not Necessarily Blame.** Similar to Bundle Theory, this undermines the idea that conscious deliberation is the primary *cause* of most actions. However:
          *   We can still evaluate the *pattern* of actions emerging from an individual.
          *   Praise/blame can function to influence *future* conscious reflection, decision-making (where it *does* play a role), and unconscious habits.
          *   The *character* revealed by the pattern of deeds (conscious narrative aside) remains evaluable.

  4.  **The Determinist/Epiphenomenalist Reading:**
      *   **Claim:** Actions are strictly determined by prior causes (physiological, psychological, environmental). The feeling of being a "doer" is an *illusion* (epiphenomenon) generated by the causal chain but doesn't *cause* anything itself. The deed is the necessary outcome of the causal web; the "doer" is a phantom.
      *   **Defensible?** **Contested, but a Common Interpretation.** Nietzsche certainly attacks *libertarian free will* (uncaused cause). He likely leans towards a compatibilist view (freedom as acting according to one's nature/strongest drives, *without* external constraint) rather than hard determinism/epiphenomenalism. He wants *strong* individuals *responsible* for their strength. Hard determinism might be too simplistic for him.
      *   **Kills Praise/Blame?** **Potentially Yes (for Traditional Forms).** If *all* actions are inevitable results of prior causes, and the "doer" feeling is causally inert, traditional moral desert-based praise/blame seems incoherent. It might reduce to mere positive/negative conditioning. **This is likely your friend's strongest support.**

  5.  **The Political Deconstruction Reading:**
      *   **Claim:** The concept of the "doer" (especially the morally responsible subject) is a *social invention* primarily used for control. By inventing a stable "soul" or "free will," religious and moral systems created something they could *hold eternally accountable*, judge, punish, and instill guilt in. The "doer" is a fiction *added later* by societal power structures to enable blame and domination (slave morality!).
      *   **Defensible?** **Yes, Core Nietzschean Insight.** Nietzsche's genealogy *is* largely about exposing the power dynamics behind moral concepts. The fiction of the morally responsible subject *was* a crucial tool for the "slave revolt in morality."
      *   **Kills Praise/Blame?** **Undermines *Moralistic* Blame/Praise, Not Necessarily All.** Nietzsche isn't against evaluation *per se*; he's against the *specific form* of moralistic blame rooted in resentment and life-denial. He might endorse a different kind of evaluation based on strength, nobility, and life-affirmation ("Praise" for the noble, "contempt" or expulsion for the weak/resentful). Blame as a tool of *ressentiment* is incoherent on *his* terms, but other forms of holding accountable (based on consequences or fostering higher types) might remain.

  6.  **The Radical Eliminativist Reading:**
      *   **Claim:** There literally *is no self* at all, just a series of disconnected events ("deeds") happening. The "doer" is not just a fiction, it's a *complete illusion* masking a void. Actions are impersonal happenings like weather patterns.
      *   **Defensible?** **Highly Questionable & Likely Not Nietzsche.** This veers into a kind of metaphysical nihilism Nietzsche explicitly fought against. His Bundle Theory still has *drives* and *forces* as real, dynamic constituents; it doesn't dissolve into nothingness. Neuroscience finds complex, integrated neural processes, not chaos.
      *   **Kills Praise/Blame?** **Yes, Absolutely.** If there's *nothing* to which deeds can be coherently attached, praise and blame become nonsense. **This is your friend's most radical (and weakest) support.**

  **The Verdict for Your Friend's Claim ("Praise/Blame Totally Incoherent"):**

  *   **Strong Support:**
      *   **#4 (Determinist/Epiphenomenalist Reading):** If true, traditional moral desert evaporates.
      *   **#6 (Radical Eliminativist Reading):** If true, everything evaporates (including the argument).
  *   **Weak Support (Misreads or Overextends):**
      *   **#1 (Linguistic):** Doesn't touch the substance of evaluation.
      *   **#3 (Psychological Retrospection):** Challenges *how* we experience control, not the validity of evaluating deeds/patterns.
      *   **#5 (Political):** Targets *specific forms* of blame (moralistic), not the concept entirely.
  *   **Complicates but Doesn't Destroy (Most Defensible Nietzschean Position):**
      *   **#2 (Bundle Theory/Process):** **This is the core Nietzschean view.** It destroys the *metaphysical subject* and *libertarian free will*, making *traditional* moral desert-based blame incoherent. **However, it emphatically does *not* eliminate evaluation, responsibility-as-answerability, or the need for social/personal responses to actions.** Nietzsche wants to *revalue* values, not abolish evaluation. He rails *against* specific *types* of blame (ressentiment-fueled), not the act of holding powerful individuals responsible for the effects of their strength (or weakness).

  **Your Bar Strategy:**

  1.  **Concede the Core Insight:** Agree Nietzsche powerfully dismantles the idea of a *metaphysically free*, *unitary*, *eternal soul* standing behind actions as an uncaused cause ("God" in miniature). The Bundle Theory (#2) is likely correct and devastates simplistic free will.
  2.  **Challenge the Overreach:** Point out that Nietzsche's target is *specifically* the metaphysical subject and moralistic blame (#5), *not* the practical reality of actions, consequences, character, and social regulation. Ask: "Even if the 'I' is a bundle of drives, does that mean we just ignore the guy who punches someone, or celebrate the person who helps? Nietzsche wouldn't think so!"
  3.  **Focus on "The Deed is Everything":** Nietzsche says the *deed* is primary. Well, deeds have consequences! Praise and blame are social/psychological *deeds themselves* that shape future actions and constellations of drives. They are part of the ongoing flux of forces, not appeals to a phantom.
  4.  **Use an Example:** "If your friend here gets drunk and drives, smashes into a car, and hurts someone, is it really 'incoherent' to blame him? Nietzsche wouldn't say 'Oh, no doer, nothing to see here.' He'd likely see it as the action of a weak, undisciplined bundle of drives needing constraint, and the victim's response (anger, legal action) as a perfectly natural force in return. The 'fiction' of the responsible driver is pragmatically necessary and part of the interplay of forces."
  5.  **Question the Motive:** "Isn't declaring *all* blame incoherent actually a way to avoid *your own* responsibility? Sounds a bit... *resentful*... of those who might hold you accountable?" (A little cheeky Nietzschean jujitsu).

  **In short:** Your friend is likely conflating the (defensible) destruction of the *metaphysical subject/libertarian free will* with the (indefensible) abolition of *any possible concept of responsibility or evaluation*. Most readings (#1, #2, #3, #5) don't support his "full stop" conclusion. The ones that do (#4, #6) are either not clearly Nietzsche (#4 is debatable) or philosophically untenable (#6). Nietzsche complicates blame profoundly; he doesn't erase it. Go forth and debate! (And maybe buy the next round *before* the metaphysics gets too heavy).
