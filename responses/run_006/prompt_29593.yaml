answer: |-
  I'll approach this as a decision theorist who's wrestled with Harsanyi's theorem and its philosophical baggage. Your distress is well-founded – this argument *feels* like a conjuring trick where utilitarianism appears from an ostensibly empty hat. Let's dissect it step by step, steelman each premise, identify the weakest link, and explore the cost of rejection. The flaw isn't in the *logic* (Harsanyi's theorem is sound), but in the normative interpretation smuggled into a seemingly technical axiom.

  **Steelmanning the Premises:**

  1.  **Individual VNM Rationality:** This is defensible as a *model* of coherent choice under risk. If individuals are instrumentally rational and satisfy the axioms, their preferences *can* be represented by EU. For descriptive/predictive purposes, it's a powerful framework. Even normatively, for *individual* prudence, it's hard to argue against coherence and consistency. Steelmanned: *"Rational individuals facing risky choices should order their preferences consistently, avoiding Dutch books and dynamic inconsistencies, which the VNM axioms ensure."*

  2.  **Social VNM Rationality:** This seems parallel to (1) but is far more contentious. Steelmanned: *"The social evaluator, tasked with making collective decisions under uncertainty, should also exhibit coherence and consistency in its rankings. Just as individuals avoid irrational gambles, society should avoid social gambles that lead to incoherent or exploitable collective choices. We model this using the same axiomatic structure we use for individuals."* The appeal is methodological symmetry and tractability.

  3.  **Pareto Principle:** This is the bedrock of welfarism and minimal unanimity. Steelmanned: *"If an option makes no one worse off and at least one person better off (under certainty), or is weakly preferred by everyone and strictly preferred by someone (under uncertainty), it is socially preferable. This respects individual sovereignty and avoids imposing outcomes strictly worse for everyone."* Weakening Pareto significantly often leads to unpalatable conclusions (e.g., endorsing outcomes everyone dislikes).

  4.  **Harsanyi's Theorem:** Given (1), (2), and (3), the conclusion is mathematically correct. The social welfare function *W* must be a positive affine combination of the individual VNM utilities *u_i*: *W = Σ a_i u_i + b* with *a_i > 0*. This is a representation theorem for aggregating VNM preferences under Pareto.

  5.  **"That's Weighted Utilitarianism":** Correct interpretation. *W* ranks *social states* (or lotteries over them) based on the *expected value* of the weighted sum of individual utilities. Social welfare is additive in individual utilities. The weights (*a_i*) determine the relative ethical importance of individuals.

  6.  **The "Too Much" Problem:** Your unease is spot-on. The derivation seems to:
      *   **Reduce ethics to aggregation:** It applies equally to a hiring committee (implying their "values" *must* be a weighted sum of members' utilities).
      *   **Rule out non-additive social welfare:** Ex ante egalitarianism (valuing equality in chances), rank-dependent prioritarianism (giving more weight to worse-off individuals *under uncertainty*), or any social preference sensitive to the *distribution* of risk is excluded. Diamond's critique is central here: the theorem forces indifference between a lottery giving Ann or Bob an equal 50% chance at a good, versus a lottery where Ann definitely gets nothing and Bob definitely gets the good – even if Ann is much worse off initially – simply because both give the same expected utility sum.
      *   **Hide the moral commitment:** The conclusion feels normative, but the premises seem technical. The "smuggling" you sense is real.

  **The Critical Failure Point: Premise (2) - Social VNM Rationality**

  This is the least costly and most normatively loaded premise to reject. **The core issue is the imposition of the VNM axioms, specifically the Independence Axiom, on the *social* preference relation.**

  *   **Why it looks innocent:** The symmetry with individual choice is superficially appealing. We want social decisions to be "rational" and consistent. The VNM axioms provide a clear, well-understood model of rational choice under risk. Rejecting it seems to endorse "irrational" social choice.
  *   **Why it's the weak link:** Imposing VNM rationality (especially Independence) on the *social* evaluator **smuggles in a strong, contestable ethical commitment: that society should be indifferent to the *ex ante distribution of chances* in a way that mirrors individual risk attitudes.** This directly conflicts with ex ante egalitarianism or equity concerns under uncertainty.
      *   **The Independence Axiom's Bite:** Independence forces social preference over lotteries to depend *only* on the expected utility profile, not on *correlations* between individuals' outcomes or the *ex ante fairness* of the risk distribution. It renders society indifferent between:
          *   Lottery A: Flip a coin. Heads: Ann gets 1 util, Bob gets 0. Tails: Ann gets 0, Bob gets 1. (Equal ex ante chances, correlated outcomes)
          *   Lottery B: Flip a coin. Heads: Ann gets 1, Bob gets 1. Tails: Ann gets 0, Bob gets 0. (No individual risk, correlated outcomes)
          *   Lottery C: Ann gets 0.5 for sure, Bob gets 0.5 for sure. (No risk, certain equality)
          *   ...because *all* have the same expected utility vector (0.5, 0.5). An ex ante egalitarian might strictly prefer A (equal chances) or C (no risk) over B (perfect correlation, potentially seen as unfair if the coin is biased by factors beyond control). A prioritarian might prefer C if they care more about the worse-off realized outcome. Harsanyi's theorem, via the social Independence axiom, forbids these preferences.

  **Giving Up Social VNM Rationality: Costs and Alternatives**

  Rejecting (2) means the social evaluator's preferences over lotteries are *not* required to satisfy the full VNM axioms (especially Independence). This opens the door to non-utilitarian social welfare functionals under uncertainty.

  *   **The Cost:**
      *   **Loss of Tractability:** VNM provides a powerful, elegant, and unique (up to affine transform) representation theorem. Giving it up means working with less structured or unique representations.
      *   **Risk of Incoherence?:** Critics might argue this opens the door to "irrational" social choices. Proponents argue that the "rationality" appropriate for society (considering fairness) is different from that for an individual maximizing personal gain.
      *   **New Impossibilities?:** Relaxing social VNM can lead to new trade-offs or even impossibility results when combined with other desirable axioms (like stronger forms of equity). The field becomes messier.
  *   **The Alternatives (What Opens Up):**
      1.  **Ex Ante Egalitarianism:** Society cares about the distribution of expected utilities or chances *before* the uncertainty is resolved. It might prefer lotteries that equalize individuals' ex ante prospects (like Lottery A over Lottery B/C in the example above, assuming equal weights). Requires representing social preference in a way sensitive to the *profile* of individual VNM utilities, not just their sum. (e.g., *W = f(E[u_1], E[u_2], ..., E[u_n])* where *f* is strictly concave or incorporates an inequality measure).
      2.  **Ex Post Egalitarianism/Prioritarianism with Non-Expected Utility:** Society evaluates lotteries by first applying a concave transformation (or prioritarian weighting) to individual utilities *within each possible state*, and *then* takes the expectation. *W = E[ Σ φ(u_i(s)) ]* where *φ* is strictly concave (or a prioritarian transform). This violates the social Independence axiom because mixing lotteries can change the distribution of *φ(u_i)* in ways that aren't linear. It values reducing inequality in realized outcomes *and* might exhibit different risk attitudes towards social outcomes than individuals exhibit towards personal outcomes.
      3.  **Rank-Dependent Models:** Social welfare weights could depend on an individual's position in the distribution of utility *within a state* (e.g., giving more weight to the worst-off), and then expectations are taken using weighted probabilities that might depend on ranks. This directly violates VNM independence.
      4.  **State-Dependent Social Welfare:** The ethical weight given to individuals (*a_i*) might depend on the state of the world (e.g., giving more weight to the sick in health states). This violates the VNM axioms' requirement for state-independent utility.
      5.  **Social Risk Attitudes Distinct from Individuals:** Society might be more or less risk-averse over social outcomes (e.g., the sum of utilities) than individuals are over personal outcomes. This requires a social welfare function that isn't linear in the *u_i*.

  **The Bill: What Giving Up (2) Costs and Gains**

  *   **Cost:** You sacrifice the clean, unique, additive representation provided by Harsanyi. Social choice under uncertainty becomes potentially less tractable and may involve trade-offs between appealing axioms (e.g., strong Pareto vs. strong ex ante equity). You need to explicitly defend an alternative structure for social preferences under risk.
  *   **Gain:** You escape the "tyranny of aggregation" over uncertain prospects. You can coherently incorporate ethical concerns about the distribution of risk (ex ante fairness) and allow social risk attitudes to reflect collective values rather than just mirroring individual risk attitudes. You can model prioritarianism, ex ante egalitarianism, and other non-utilitarian objectives under uncertainty. The argument no longer forces you to accept that a hiring committee's *only* coherent option is to be a weighted utilitarian.

  **Conclusion:**

  Your argument doesn't fail logically; Harsanyi's theorem is correct. The issue is normative. Premise (2), demanding that the *social* evaluator's preferences satisfy the VNM axioms (especially Independence), is **not** a neutral technical condition. It embodies the substantive ethical judgment that society *should* evaluate risky social prospects solely based on the linear aggregation of individual expected utilities, showing no inherent concern for how the risk is distributed ex ante or for the correlation of outcomes. **This *is* the core commitment of utilitarianism under uncertainty smuggled into the "rationality" requirement.**

  By rejecting (2) while keeping (1) (individual rationality) and (3) (Pareto), you retain methodological individualism and respect for unanimous preferences, but you open the space for a rich landscape of non-utilitarian social welfare objectives that care about fairness, equity, and specific distributions of risk. The cost is analytical complexity. Your sleepless nights are justified: Harsanyi's theorem is a powerful demonstration of how *rationality* axioms can pack a strong *ethical* punch, and escaping that punch requires carefully scrutinizing where the ethical load is being carried – in this case, squarely on the social VNM assumption. You don't have to become a utilitarian; you just need to argue that society's "rationality" under risk isn't the same as an individual's.
