prompt: |-
  I am an astrophysicist who works with Bayesian survey inference: priors over population parameters, detection likelihoods, selection effects, posterior updating, and model comparison. I know the Fermi paradox only as a popular idea, not as a technical debate. Restate the debate in the vocabulary I actually use — the core argument that if technological civilizations were common we should already see traces of them, together with the standard families of response: rare emergence, the Great Filter, the zoo hypothesis, grabby aliens, and the claim that we are simply early. For each position, say what translates cleanly, what has to be distorted to fit the framework, and what has no expression in it at all. Then give me the residue report: what does not survive the translation, and is the residue a defect of my vocabulary or a sign that the original position was less precise than it looked? In particular, I want to know whether the claim that the silence should be surprising can even be formulated in my terms, and what becomes of the Great Filter's warning about our own future when it is restated as a posterior over a parameter.
