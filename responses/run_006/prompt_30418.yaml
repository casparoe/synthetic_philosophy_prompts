prompt: |-
  I chair the constitution committee of a professional society whose membership amends the constitution each year at convention; my committee votes on which proposed amendments go onto that ballot. Several times a year we receive proposals, and none of us are lawyers, we have about twenty minutes per proposal in committee, and a bad call can let a faction entrench itself, invalidate amendments after they pass, or leave us with a constitution that contradicts itself. A fair number of the proposals change the rules about how rules are changed: they raise or lower amendment thresholds, declare a clause unamendable, renumber the rulebook, or insert a clause saying it prevails over anything inconsistent with it. I know enough to know that the self-amending game Nomic and the paradoxes of legal self-reference are the right body of ideas here, but I have never seen them turned into something a non-lawyer committee can actually run.

  Please write a decision procedure my committee could run on any proposed amendment before we put it to the membership, usable by non-lawyers in the time we have. It should be a checklist in words: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of judgment rather than mechanics. Ground it in what Nomic and the paradoxes of legal self-reference actually show about self-amending rules — in particular the difference between changing a rule and changing the rule that governs changing rules, entrenchment clauses that try to bind future majorities, supremacy clauses that try to make themselves the source of their own priority, and an amendment threshold changed under the very threshold it would replace. Do not give me a reading list or citations; I need the reasoning, not sources. Mark explicitly which steps are judgment calls dressed up as procedure, and say what the procedure cannot settle.

  Begin with the procedure itself, with no preface or commentary, and then give the reasoning behind each step and the worked applications. Run the procedure on these three proposals: (1) a proposal to lower the default amendment threshold from two-thirds to a simple majority, which my committee supports; it would be adopted under a standing rule allowing the convention to suspend any rule by a majority vote, so the lower threshold would be used to enact itself — I want to see the procedure tell us no if that is what follows; (2) a new clause stating that it may never be amended or repealed and that any rule inconsistent with it is void; (3) a proposal to renumber the rules so that the amendment rule moves from Rule 12 to the slot now held by Rule 2, an entrenched statement of the society's purposes. In each case, say exactly which step of the procedure produces the answer, and where the procedure would instead send the question to a person.
reasoning: |-
  We are designing a decision procedure for evaluating proposed constitutional amendments in a professional society. The procedure must account for issues of self-reference, entrenchment, supremacy, and the potential for paradox or invalidation. We are particularly concerned with changes to the amendment rules themselves, clauses that attempt to make themselves unamendable, and conflicts arising from renumbering or supremacy clauses.

  The decision procedure is structured as a checklist of questions to be asked in sequence. At each step, if the answer meets the stated condition, the proposal either fails (is rejected) or requires human judgment. The goal is to catch clear cases of invalidity or paradox while flagging ambiguous cases for committee deliberation.

  **Decision Procedure Checklist:**

  1. **Does the proposal change the amendment rule (the rule that specifies how rules are changed)?**  
     - If **no**, proceed to Step 2.  
     - If **yes**, then:  
       a. *Is the amendment rule being changed under the threshold it would set for itself?*  
          - If **yes**, then the proposal **fails** (reject).  
          - If **no**, then proceed to Step 2.  

  2. **Does the proposal contain an explicit entrenchment clause?** (i.e., a clause that states it cannot be amended or repealed, or that requires a higher threshold for its amendment than the general amendment rule)  
     - If **no**, proceed to Step 3.  
     - If **yes**, then:  
       a. *Is this clause attempting to entrench a rule that is not the amendment rule?*  
          - If **yes**, then the proposal **fails** (reject) because only the amendment rule can be entrenched (if at all) and even then, only with the current amendment rule's procedure.  
          - If **no** (i.e., it is entrenching the amendment rule itself), then proceed to Step 2b.  
       b. *Is the entrenchment clause being adopted under the same amendment rule that it would entrench?*  
          - If **yes**, then proceed to Step 3.  
          - If **no**, then the proposal **fails** (reject) because you cannot entrench a rule under a different rule than the one being entrenched.  

  3. **Does the proposal contain a supremacy clause?** (i.e., a clause that states that it prevails over any inconsistent provision, or that inconsistent provisions are void)  
     - If **no**, proceed to Step 4.  
     - If **yes**, then:  
       a. *Is the supremacy clause being applied to a rule that is not the amendment rule?*  
          - If **yes**, then flag for **human judgment** (because supremacy clauses on ordinary rules may create inconsistencies that require interpretation, but are not necessarily invalid).  
          - If **no** (i.e., it is applied to the amendment rule itself), then the proposal **fails** (reject) because a rule cannot make itself the supreme rule without creating a self-reference paradox (it would be attempting to govern its own authority).  

  4. **Does the proposal involve renumbering or rearrangement that moves the amendment rule?**  
     - If **no**, proceed to Step 5.  
     - If **yes**, then:  
       a. *Is the amendment rule being moved to a position that is explicitly protected (e.g., an entrenched clause) or to a position that would change its legal effect?*  
          - If **yes**, then flag for **human judgment** (because moving the rule might be an attempt to change its authority or to circumvent entrenchment, and requires careful consideration).  
          - If **no**, then proceed to Step 5.  

  5. **Does the proposal create a contradiction or inconsistency with any existing rule?**  
     - If **no**, then the proposal **passes** the automatic checks and can be considered by the committee on its merits (but note: the committee must still consider policy and wisdom).  
     - If **yes**, then:  
       a. *Is the inconsistency with a rule that is not the amendment rule and not entrenched?*  
          - If **yes**, then flag for **human judgment** (because inconsistencies among ordinary rules are common and can be resolved by amendment, but require committee deliberation).  
          - If **no** (i.e., the inconsistency is with the amendment rule or an entrenched rule), then the proposal **fails** (reject) because it would create an irreconcilable conflict at the core of the constitution.  

  **End of Procedure**

  **Reasoning Behind Each Step:**

  - **Step 1:** Changing the amendment rule is a critical act. If the rule is being changed under the very threshold it would set (e.g., lowering the threshold from 2/3 to majority and using a majority to do so), it creates a "bootstrapping" problem. This is because the new rule is being enacted under the old rule's procedure, but the new rule would have allowed a lower threshold. This is generally considered invalid because the old rule must be followed until the new one is in place. Thus, if the new threshold is lower and the change is adopted under the old (higher) threshold, it's acceptable. But if the change is adopted under the new (lower) threshold that is not yet in effect, it's circular and invalid. Hence, we reject such proposals.

  - **Step 2:** Entrenchment clauses attempt to bind future majorities. Only the amendment rule itself can be legitimately entrenched because it is the rule about changing rules. Attempting to entrench an ordinary rule (like a statement of purpose) is invalid because it would create a higher law without going through the proper channel (the amendment rule). Moreover, an entrenchment clause for the amendment rule must be adopted under the same rule that it is entrenching. For example, if the current amendment rule requires 2/3, then entrenching the amendment rule (say, to require 3/4) must be done by 2/3. You cannot entrench under a different rule.

  - **Step 3:** Supremacy clauses create a hierarchy. When applied to ordinary rules, they may be acceptable (like a severability clause) but require judgment because they might conflict with other rules. However, if a rule attempts to make itself supreme (especially the amendment rule), it creates a self-reference loop: the rule is claiming supremacy over itself and any future amendment rule, which is paradoxical and unworkable. Therefore, we reject such clauses for the amendment rule.

  - **Step 4:** Renumbering the amendment rule might be a way to evade entrenchment or to change its legal effect (e.g., if Rule 2 is entrenched and the amendment rule is moved there). This is a gray area and requires human judgment to determine if the move is merely administrative or if it has substantive consequences.

  - **Step 5:** Contradictions in the constitution are problematic. If the contradiction is with an ordinary rule, it might be resolved by interpretation or future amendment, so we flag for judgment. But if the contradiction is with the amendment rule or an entrenched rule, it threatens the entire framework and must be rejected.

  **Worked Applications:**

  **Proposal 1: Lower the amendment threshold from two-thirds to a simple majority, to be adopted under the current rule allowing suspension of rules by majority vote (so using a simple majority to enact the change).**

  - Step 1: This proposal changes the amendment rule. So we go to 1a: Is it being changed under the threshold it would set? The new threshold is simple majority. The proposal is being adopted under a majority (via suspension). So yes, it is being changed under the threshold it would set. Therefore, the proposal **fails** at Step 1a.  
    *Result: Reject.*

  **Proposal 2: A new clause stating that it may never be amended or repealed and that any rule inconsistent with it is void.**

  - Step 2: The proposal contains an explicit entrenchment clause (it says it may never be amended or repealed). So we go to Step 2a: Is it entrenching a rule that is not the amendment rule? The new clause is an ordinary rule (not the amendment rule). Therefore, the proposal **fails** at Step 2a.  
    *Result: Reject.*

    *Note: The supremacy clause part would also be caught at Step 3, but we already rejected at Step 2a so we don't get there. However, for completeness: Step 3 would also trigger because of the supremacy clause. Step 3a: It's applied to a rule that is not the amendment rule, so we would flag for human judgment. But since Step 2a already rejects, we stop at Step 2a.*

  **Proposal 3: Renumber the rules so that the amendment rule (currently Rule 12) moves to the slot now held by Rule 2 (an entrenched statement of the society's purposes).**

  - Step 4: The proposal involves renumbering that moves the amendment rule. So we go to Step 4a: Is the amendment rule being moved to a position that is explicitly protected? Yes, Rule 2 is entrenched. Therefore, we flag for **human judgment**.  
    *Result: The procedure does not automatically reject, but sends it to the committee for deliberation. The committee must decide if moving the amendment rule to an entrenched position would improperly entrench it or if it's merely administrative. Since Rule 2 is entrenched, moving the amendment rule there might make the amendment rule entrenched by association, which is a substantive change. This requires careful consideration.*
answer: |-
  ### Decision Procedure for Constitutional Amendments

  **Step 1: Does the proposal change the amendment rule (the rule governing how rules are amended)?**  
  - **If NO:** Proceed to Step 2.  
  - **If YES:**  
    - Ask: **"Is the proposal being adopted under the threshold it would set for itself?"**  
      - **If YES:** Reject the proposal immediately.  
      - **If NO:** Proceed to Step 2.  

  **Step 2: Does the proposal contain an entrenchment clause (e.g., "this rule cannot be amended" or "this rule requires a higher threshold to amend")?**  
  - **If NO:** Proceed to Step 3.  
  - **If YES:**  
    - Ask: **"Does this clause entrench a rule other than the amendment rule?"**  
      - **If YES:** Reject the proposal immediately.  
      - **If NO (i.e., it entrenches the amendment rule itself):**  
        - Ask: **"Is the entrenchment being adopted under the same rule it would entrench?"**  
          - **If YES:** Proceed to Step 3.  
          - **If NO:** Reject the proposal immediately.  

  **Step 3: Does the proposal contain a supremacy clause (e.g., "this rule overrides any inconsistent rule")?**  
  - **If NO:** Proceed to Step 4.  
  - **If YES:**  
    - Ask: **"Is this clause applied to a rule other than the amendment rule?"**  
      - **If YES:** Flag for human judgment (proceed to Step 4 but note the risk).  
      - **If NO (i.e., it makes the amendment rule supreme):** Reject the proposal immediately.  

  **Step 4: Does the proposal renumber or reposition the amendment rule within the constitution?**  
  - **If NO:** Proceed to Step 5.  
  - **If YES:**  
    - Ask: **"Does the new position grant the rule implicit authority (e.g., moving it into an entrenched section)?"**  
      - **If YES:** Flag for human judgment.  
      - **If NO:** Proceed to Step 5.  

  **Step 5: Does the proposal create a direct contradiction with any existing rule?**  
  - **If NO:** The proposal passes automatic checks (proceed to policy debate).  
  - **If YES:**  
    - Ask: **"Is the contradiction with a rule that is not the amendment rule?"**  
      - **If YES:** Flag for human judgment.  
      - **If NO (i.e., contradiction with the amendment rule):** Reject the proposal immediately.  

  **Final Output:**  
  - Proposals rejected at any step **do not advance** to the ballot.  
  - Proposals flagged for judgment **require committee debate** (time-permitting).  
  - All others advance to policy discussion (Step 5 "pass" only means no fatal flaws).  

  ---

  ### Reasoning Behind Each Step  
  **Step 1: Amendment Rule Changes**  
  - **Why?** Self-amendment must avoid circularity. Adopting a new threshold *under that same threshold* invalidates the change (e.g., lowering a 66% threshold to 51% using 51% authority, which doesn’t exist yet). This exploits the "bootstrapping paradox" from Nomic: rules derive authority from prior rules.  
  - **Judgment?** Mechanical (no ambiguity).  

  **Step 2: Entrenchment Clauses**  
  - **Why?** Entrenchment binds future majorities. Only the amendment rule itself can be entrenched (if at all), as it defines legal change. Entrenching ordinary rules (e.g., a mission statement) usurps the amendment rule’s role. Adopting entrenchment *under the rule being entrenched* is valid (e.g., requiring 80% to amend the amendment rule, adopted under the current 66% threshold).  
  - **Judgment?** Mechanical (identifying the target rule is factual).  

  **Step 3: Supremacy Clauses**  
  - **Why?** A supremacy clause on the amendment rule creates a "self-reference paradox": it claims priority over all rules, including itself, which is incoherent (e.g., "this rule is above all rules" could void itself if challenged). For non-amendment rules, supremacy clauses risk hidden conflicts but are not inherently invalid—hence judgment.  
  - **Judgment?** Step 3a ("Is it applied to a non-amendment rule?") is mechanical; the risk assessment in "flag for judgment" is subjective.  

  **Step 4: Renumbering/Repositioning**  
  - **Why?** Moving the amendment rule into an entrenched section (e.g., a "purposes" clause) may implicitly entrench it or alter its authority. This is a "procedural entrenchment" attempt. Mere administrative renumbering is safe; contextual repositioning is not.  
  - **Judgment?** "Does the new position grant implicit authority?" requires interpreting intent and context (subjective).  

  **Step 5: Contradictions**  
  - **Why?** Direct contradictions with the amendment rule undermine the constitution’s foundation (e.g., two conflicting thresholds). Contradictions with ordinary rules may be resolvable by amendment or interpretation.  
  - **Judgment?** Identifying a contradiction is mechanical; assessing severity with non-amendment rules is subjective.  

  **What the Procedure Cannot Settle:**  
  - Policy wisdom (e.g., "Is a 51% threshold better?").  
  - Ambiguities in non-amendment supremacy clauses (Step 3).  
  - Intent behind repositioning (Step 4).  
  - Non-fatal inconsistencies (Step 5).  
  - Non-textual risks (e.g., "Will this empower a faction?").  

  ---

  ### Worked Applications  
  **Proposal 1: Lower amendment threshold from 2/3 to simple majority, adopted under a majority suspension rule.**  
  - **Step 1:** Changes amendment rule → **Yes**.  
    - Step 1a: Adopted under the threshold it sets? Current suspension rule allows majority vote; proposal sets majority threshold → **Yes**.  
    - **Outcome:** Reject at Step 1a.  
  - **Why?** Self-application paradox: The new threshold (majority) doesn’t legally exist until adopted, so it can’t validate its own adoption. The suspension rule is irrelevant—it’s a separate rule, not the amendment rule being changed.  

  **Proposal 2: New clause declaring itself unamendable and supreme.**  
  - **Step 2:** Contains entrenchment clause → **Yes**.  
    - Step 2a: Entrenches non-amendment rule? (Yes, it’s a new clause, not the amendment rule) → **Yes**.  
    - **Outcome:** Reject at Step 2a.  
  - **Why?** Ordinary rules cannot be entrenched; only the amendment rule may have elevated status. The supremacy clause is not evaluated (rejected first), but if it were:  
    - **Step 3:** Contains supremacy clause → **Yes**.  
      - Step 3a: Applied to non-amendment rule? **Yes** → Flag for judgment.  
    - Since Step 2a already rejects, this is moot.  

  **Proposal 3: Renumber rules to move amendment rule (Rule 12) to Rule 2’s slot (entrenched purposes clause).**  
  - **Step 4:** Repositions amendment rule → **Yes**.  
    - Step 4a: Does new position grant implicit authority? Rule 2 is entrenched → **Yes**.  
    - **Outcome:** Flag for human judgment at Step 4a.  
  - **Why?** Moving the amendment rule into an entrenched section may implicitly entrench it, altering its amendability. The committee must debate: Is this a technical edit or a veiled power grab?
