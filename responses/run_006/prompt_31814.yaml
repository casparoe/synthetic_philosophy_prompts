answer: |-
  ## Reconstructing the Implicit Theory of Carbon/Biodiversity Offsetting

  **Brainstorming Candidate Theories:**

  1.  **Strong Consequentialist Fungibility:** Offsetting strictly presupposes that all environmental impacts (carbon emissions, biodiversity loss) are *perfectly commensurable* and *fungible*. A unit of harm prevented/removed (e.g., a ton of CO2 sequestered, a hectare of wetland restored) cancels out an equivalent unit of harm caused, regardless of location, timing, specific ecological context, or the affected communities. Moral value is solely determined by net outcomes.
  2.  **Weak Consequentialist Compensation:** Offsetting assumes harms *can* be compensated, but only if the compensation achieves *equivalent or greater net value*, potentially with constraints (e.g., same ecosystem type, similar time frame). It allows for some incommensurability but insists that net gain justifies the trade-off.
  3.  **Restitution-Based Obligation:** Offsetting is seen as a form of restitution or reparation. Causing harm creates a debt that *must* be repaid by providing an equivalent benefit elsewhere. The moral focus is on restoring a global "balance sheet" of environmental value.
  4.  **Contractualist/Procedural Justification:** The practice is justified not by intrinsic equivalence, but by its acceptance within agreed-upon rules (e.g., regulatory frameworks, market mechanisms) that facilitate collective action towards environmental goals. The *process* legitimizes the trade-off.
  5.  **Agent-Neutral Permissions:** Offsetting assumes that the obligation to reduce environmental harm is *agent-neutral* – it doesn't matter *who* reduces the harm, as long as it's reduced by an equivalent amount. The company's specific obligation is discharged by financing the equivalent reduction elsewhere.

  **The Most Defensible Reconstruction: Strong Consequentialist Fungibility (with Reservations)**

  While elements of other theories are present, the **core presupposition** of the practice, especially as implemented, is **Strong Consequentialist Fungibility**. This is evident because:

  1.  **Commensurability & Fungibility:** The practice *strictly presupposes* that specific harms (e.g., emitting CO2 *here and now*, destroying *this specific wetland*) can be precisely measured and canceled out by preventing/removing equivalent units of harm *anywhere else, at another time* (e.g., planting trees in Brazil, capturing methane in India, creating a wetland in 5 years). This treats environmental value as a homogenous, globally transferable currency.
  2.  **Summing Across Persons/Separateness:** It *strictly presupposes* that the moral ledger *can* be summed across persons, places, and times. The harm to local communities affected by the original emission/wetland loss is considered morally outweighed (or canceled) by the benefit to communities (or ecosystems) where the offset occurs. The separateness of persons (and ecosystems) is disregarded in favor of aggregate net outcomes. The harmed party has no inherent right against being harmed if "compensation" occurs elsewhere.
  3.  **Consequentialist Structure:** The practice is fundamentally consequentialist. The *only* relevant moral factor is achieving net-zero environmental impact globally. It rejects agent-relative constraints that would prohibit *this specific agent* from causing *this specific harm* in *this specific place*, regardless of compensatory actions elsewhere. A deontologist holding such constraints (e.g., "It is intrinsically wrong to destroy *this irreplaceable wetland*") could not coherently endorse the core fungibility claim inherent in most offsetting schemes.
  4.  **"Mere Fitting" vs. Presupposition:** The practice *fits well with* Restitution-Based views (it feels like paying a debt) and Contractualist views (it operates within market/regulatory rules). However, it does not *strictly presuppose* them. One could believe in restitution without accepting spatial/temporal fungibility. One could accept market rules while philosophically rejecting the fungibility premise (viewing it as a flawed but pragmatic compromise). The *non-negotiable core* is the equivalence claim enabling the cancellation.

  **Philosophical Underdetermination:**

  The practice *is* underdetermined in several key areas, allowing rival theories to *license* it, though not necessarily *justify its core fungibility claim*:

  1.  **The Scope of "Equivalence":** How strictly must the offset match the harm in type, location, permanence, and affected communities? A Weak Consequentialist might demand high similarity, while a Strong Fungibilist sees any unit reduction as sufficient. The practice often allows wide latitude, underdetermining this requirement.
  2.  **Baselines and Counterfactuals:** What is the baseline against which the offset's "additional" benefit is measured? Different theories (consequentialist, contractualist) might accept different counterfactual scenarios, impacting whether the offset is truly "equivalent."
  3.  **Procedural Fairness:** A Contractualist could endorse offsetting *if* it occurs within a just, democratically legitimate framework ensuring fair participation and distribution of burdens/benefits, even if they harbor doubts about perfect fungibility.
  4.  **Temporal Discounting:** How heavily should future benefits (e.g., carbon sequestered by new trees decades from now) count against present harms? Different value theories (e.g., different discount rates) yield different answers on whether an offset truly "cancels" the harm.

  **The Tension with Non-Fungible Wrongs & Alternative Frameworks**

  The stark contrast with non-fungible wrongs (fraud, discrimination, safety violations) highlights a potential incoherence:

  *   **Current Implicit View:** The practice tacitly assumes environmental harms (emissions, habitat destruction) belong to a fundamentally different *category* of wrongs than core deontological violations. They are seen as harms to a *generalized good* (global atmosphere, abstract biodiversity) where aggregate net outcomes matter most. Harms like fraud or discrimination are seen as violations of *specific rights* held by individuals or groups, creating duties *owed specifically to them* that cannot be discharged by benefiting others.
  *   **Incoherence?** The practice *does* quietly combine incompatible theories. It applies **Strong Consequentialist Fungibility** to environmental harm while relying on **Deontological Constraints** for other core wrongs. This creates a tension: *Why* are environmental harms uniquely fungible? Often, the justification is pragmatic necessity or treating the environment as a global commons, but this isn't derived from a coherent, unified moral theory. It risks arbitrariness.
  *   **Replacing the Implicit View (Environmental Constraints):** If we treated certain environmental harms as deontological constraints – e.g., "It is intrinsically wrong to destroy *this specific irreplaceable ecosystem*" or "This community has a right not to have their local environment degraded" – offsetting would become incoherent or radically transformed:
      *   **No Like-for-Like Cancellation:** Destroying Wetland A could not be "canceled" by creating Wetland B elsewhere. The specific harm to Wetland A and its dependents remains a wrong.
      *   **Focus on Prevention & Minimization:** Obligation shifts to *avoiding* the harm in the first place. "Net zero" via offsetting would be insufficient; only genuine reduction or elimination at source would be permissible.
      *   **Restitution to the Affected:** If harm occurs, restitution would be owed *specifically* to the harmed ecosystem/community (where possible), not to a generic offset project elsewhere. Compensation might be required, but it wouldn't *license* the original harm.
      *   **Strict Limits on Trading:** Offsetting, if allowed at all, would be restricted to *residual*, *unavoidable* harms after all prevention/minimization efforts, and only for impacts deemed truly equivalent *and* occurring within a constrained spatio-temporal and ecological context acceptable under the constraint (e.g., replacing *this* type of habitat *within the same watershed* before destruction occurs). Biodiversity offsetting would face particular scrutiny.
      *   **Rejection of Agent-Neutrality:** The polluter/developer's specific duty is to *not harm this place*, not merely to ensure net global harm reduction financed by others.

  **Conclusion:**

  The dominant practice of carbon and biodiversity offsetting **strictly presupposes Strong Consequentialist Fungibility**, treating environmental value as a perfectly commensurable, globally transferable currency that allows harms in one place/time to be canceled by equivalent benefits elsewhere. This presupposes harms and benefits are fungible across kinds (if measured in the same unit, like CO2-eq), places, times, and persons, rejecting the separateness of persons and ecosystems in favor of aggregate net outcomes. It is fundamentally consequentialist and incompatible with deontological constraints prohibiting specific harms.

  The practice is philosophically underdetermined regarding the precise requirements for equivalence, baselines, and procedural fairness. Its stark contrast with the non-fungibility of other wrongs reveals a deep tension: it implicitly relies on a **dualist moral framework** applying consequentialism to the environment and deontology to core individual/group rights. This lack of a unified theory creates vulnerability. Shifting to a view where significant environmental harms are seen as constraints would dismantle the core fungibility premise of current offsetting, demanding radical changes prioritizing avoidance, minimization, and localized restitution over spatial/temporal displacement of impacts. The coherence of the current system rests on the contested philosophical claim that environmental wrongs are uniquely suited to consequentialist aggregation and fungibility.
