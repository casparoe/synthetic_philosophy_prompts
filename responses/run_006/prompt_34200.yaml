  Worried this might feel evasive - so emphasize I'm not denying conditionals have truth values, just that their content is rigid across contexts. Offer to discuss specific embeddings if pressed. 

  *steels resolve* Defense hinges on this: the Equation is a synchronic norm for unconditional credences. Preservation under conditionalization is an additional claim requiring independent justification - which Lewis assumes but I reject. Time to respond.
answer: |-
  As your opponent, I reject Preservation Under Conditionalization (PUC) as a universal principle. The Equation governs *unconditional* credences: P(A→C) = P(C|A). But when we conditionalize on C or ¬C, we're evaluating P(A→C | X) for X=C or X=¬C. The Equation doesn't entail that P(A→C | X) must equal P(C | A ∧ X). This assumption treats A→C as a rigidly context-independent proposition whose probability behaves like a standard proposition under conditionalization. But on my view, indicative conditionals express propositions whose truth conditions (or assertability conditions) are *context-sensitive*.

  **Formal concession:** Your derivation is mathematically valid *given* PUC. If P(A→C | C) = P(C | A ∧ C) and P(A→C | ¬C) = P(C | A ∧ ¬C), then P(A→C) = P(C) via total probability, forcing P(C|A) = P(C).

  **My rejection:** I deny that P(A→C | C) = P(C | A ∧ C). Conditioning on C may shift the context relevant to interpreting A→C. The Equation applies to the agent's current credal state, not to arbitrary hypothetical states. P(A→C | C) is the probability of the *original* conditional proposition given C. This need not equal the probability *assigned to a new conditional* in the posterior credence function after learning C.

  **Revised predictions:**
  - **Embedded negation:** ¬(A→C) is not equivalent to A→¬C. Its probability depends on the specific semantics (e.g., world-selection functions).
  - **Conjunctions:** P((A→C) ∧ B) is not generally reducible to a simple conditional probability; it requires joint evaluation of the conditional and B.
  - **Conditionalization:** When learning E with P(E)>0, the new credence in A→C is P\_E(A→C) = P\_E(C | A) — but this is computed using the *updated* P\_E, not by preserving the original P(A→C) or applying PUC to the old conditional. The *proposition* A→C may have a different probability under P\_E because P\_E(C|A) differs from P(C|A).

  **Contested move:** My rejection of PUC is philosophically substantive. Lewis assumes conditionals have stable truth conditions across epistemic contexts; I deny this. The Equation is a synchronic norm, not a diachronic one governing all suppositions. This preserves the Equation while blocking triviality.
