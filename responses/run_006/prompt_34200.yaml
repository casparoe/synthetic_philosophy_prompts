  *adjusts mental model* As defender of the Equation, I can't deny math but can dispute interpretive leaps. Preservation under conditionalization is the vulnerability - it treats A→C like an ordinary proposition when conditioning on C or ¬C. But if conditionals are context-sensitive, conditioning might shift their propositional content. 

