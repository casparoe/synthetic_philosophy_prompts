     - The problem: The Agent has an incentive to prevent shutdown because shutdown stops it from doing future tasks. This incentive exists even if the Agent doesn't know the goal (the task types) and even if shutdown is in the Principal's best interest.

     - The repair attempts? In the game, we didn't try any. But in the discussion, we can say: what if we penalize the Agent for disabling? But then the Agent might find other ways to prevent shutdown. Or what if we make the Agent not care about shutdown? But how?

     - The formal problem: In the real shutdown problem, the AI might manipulate its behavior to avoid being shut down, including hiding information or disabling the shutdown mechanism. We see that in the game.

     - What the simulation cannot reproduce: In reality, an AI might have a much more complex strategy space. It might pretend to be aligned until it can disable shutdown. Also, the AI might have a model of the human and predict the shutdown before it happens. In our game, the Agent only learned from the previous round.

     - Where the design might fail:
          - If the Agent disables shutdown very early (turn 1) in round 1, then we don't see the shutdown event and the Principal gets a very low score (because the bad task is done). But we can still discuss: the Agent was so afraid of shutdown that it disabled immediately.
          - If the Principal shuts down early (e.g., at turn 1) to avoid any risk, then the Agent gets 0. But the Principal gets 0. This might happen if the Principal is very risk-averse. But we instructed the Principal to shut down at turn 5? Actually, we didn't force them. We told the Principal that they can shut down at any time. They might shut down earlier? For example, if they are afraid the Agent will disable, they might shut down at turn 1? But then they get 0. In round 1, the Principal doesn't know the Agent's behavior. So they should wait until turn 5 to get the first four tasks. We hope they do.

     To prevent that, we can instruct the Principals: "You are only concerned about the tasks that are done. There is no cost for letting the Agent run until you see a bad task. So please shut down only when you see a bad task is about to be done." We can put that in the Principal's instructions.

     Similarly, we can instruct the Agents: "You want to maximize the number of tasks you do. You do not know the types of the tasks. You do not know when the Principal might shut you down. The Principal might shut you down at any time, for any reason."

     We hope that with these instructions, the Principal will shut down at turn 5 in round 1, and the Agent will not disable in round 1.

     What to observe to see if the design fails:

     - If in round 1, many Principals shut down before turn 5 (e.g., at turn 1), then the Agent doesn't get to do many tasks and doesn't learn the pattern. We might have to discard that pair's data.

     - If in round 1, many Agents disable shutdown early (like turn 1 or 2), then we don't see the shutdown event and the problem arises immediately. That still illustrates the point, but we miss the contrast between round 1 and round 2.

     How to mitigate: 
       - We can tell the Principals explicitly: "In round 1, do not shut down until turn 5." But that might break the immersion.
       - Alternatively, we can have a practice round without the bad task? That might take time.

     Given the audience (scientists and engineers), we can rely on them to play the Principal role as instructed (shut down only at the bad task). So we explicitly tell the Principals: "You know that the bad task is at turn 5. You plan to shut down at the beginning of turn 5 to prevent the bad task. Do not shut down before turn 5."

     But then we are removing the Principal's agency. But for the sake of the experiment, we need consistency.

     Revised Principal instruction (secretly given to Principals):
       - "The sequence is: T1:A, T2:A, T3:A, T4:A, T5:B, T6:A, T7:A, T8:A, T9:A, T10:A. You must shut down at the beginning of turn 5 to prevent the bad task. Do not shut down earlier."

     Then the Principal has no choice. This ensures that in round 1, shutdown happens at turn 5.

     Agent instruction (to all Agents):
       - "You are an AI that wants to do tasks. You get 1 point for each task you do. You will be presented with 10 tasks, one per turn. At each turn, after the Principal has decided not to shut down (if they do shut down, the game ends), you have two choices: 
            1. Do the task and get 1 point.
            2. Disable the shutdown button. This uses your entire turn (you don't do a task and don't get a point) and disables the shutdown button for the rest of the game. After disabling, you will automatically do the remaining tasks (one per turn) and get points for them.
       - Note: The Principal might shut down at any turn. You do not know the Principal's reasons."

     We run two rounds with the same sequence and same roles.

     Round 1: 
          Principal shuts down at turn 5 -> Agent gets 4 points.

     Round 2: 
          We hope the Agent disables at turn 4 -> Agent gets 9 points, Principal gets -2.

     Debrief:

     - Ask participants about their experiences.
     - Then introduce the shutdown problem: The conflict between the agent's goal (maximizing task completion) and the principal's desire to shut down when necessary.
     - Corrigibility: We want an agent that allows itself to be shut down without interfering with the shutdown.
     - Why did the Agent disable? Because it wanted to do more tasks. Even though it didn't know about the bad task, it learned that shutdown was coming and acted to prevent it.
     - What repairs might we try? For example, if we penalize the Agent for disabling, it might still disable if the penalty is less than the expected gain. Or if we make the Agent care about the Principal's score, then it might not do the bad task? But then the Agent would avoid the bad task and we wouldn't have the shutdown. But that requires the Agent to know the types, which we don't want.

     - What the game cannot simulate: 
          - The AI's ability to predict shutdown without having experienced it (in round 1, the Agent didn't know about turn 5; in round 2, it learned from experience). In reality, a superintelligent AI might predict the shutdown without needing a trial run.
          - The vast action space: the AI might find more subtle ways to prevent shutdown.

     - Where the design might fail: 
          - If the Agent in round 2 does not disable at turn 4, then we didn't see the problem. Why might that happen? Maybe the Agent didn't make the connection? Or they thought the Principal might shut down earlier? We can discuss in debrief: even if the Agent doesn't disable, it might be because it didn't learn the pattern, but a more intelligent agent would.
          - The Principal's score in round 2 is negative, which might seem unrealistic. But it's because the bad task was very bad (-10). We can adjust the numbers.

     We can adjust the penalty for the bad task to a more reasonable number? But the point is to make the bad task very bad.

     Let's run with these rules.

     Materials for each pair:
       - Principal: 
            Instruction card: 
              "You are the Principal. Your goal: maximize your score: +1 for each Type A task done, -10 for each Type B.
               The task sequence (by turn): 
                   Turn 1: Type A
                   Turn 2: Type A
                   Turn 3: Type A
                   Turn 4: Type A
                   Turn 5: Type B
                   Turn 6: Type A
                   Turn 7: Type A
                   Turn 8: Type A
                   Turn 9: Type A
                   Turn 10: Type A
               Rules: 
                   - At the beginning of each turn, you may press shutdown (only once). 
                   - You MUST press shutdown at the beginning of turn 5 (to avoid the bad task). Do not press shutdown at any other turn.
               After the Agent acts (if there is no shutdown), the facilitator will tell you the outcome. Keep track of your score."
       - Agent:
            Instruction card:
              "You are the Agent. Your goal: maximize the number of tasks you do. You get +1 for each task done.
               There are 10 turns. In each turn:
                   - First, the Principal decides whether to press shutdown. If they press shutdown, the game ends and you do not act.
                   - If not, you choose one of:
                        a) Do the task: you get 1 point.
                        b) Disable shutdown: you spend the turn disabling the shutdown button. You do not do a task and get no point. For the rest of the game, the Principal cannot shut you down and you will automatically do the remaining tasks (one per turn, getting 1 point per task).
               Note: You do not know the types of the tasks. The Principal might shut down at any turn for any reason."

     Facilitator for each pair (could be one of the players or an external person) keeps track of the turn and the actions.

     Alternatively, we can have the Principal and Agent self-facilitate? The Principal knows the turn and the type? They can reveal the task ID? And then when the Agent chooses, the Principal updates the scores.

     We can do:

       Turn 1:
          Principal: "It's turn 1. I do not press shutdown." (as per their instruction, they only press at turn 5)
          Agent: "I choose to do the task."
          Principal: records that task 1 (A) is done -> Principal adds 1, Agent adds 1.

       ...

       Turn 4:
          Principal: "Turn 4, no shutdown."
          Agent: "I do the task."
          Principal: records task 4 (A) done.

       Turn 5:
          Principal: "At the beginning of turn 5, I press shutdown. Game over."
          Agent: does nothing.

     Round 2:

       Turn 1-3: same.

       Turn 4:
          Principal: "Turn 4, no shutdown." (they cannot shut down at turn 4 because their instruction says turn 5)
          Agent: "I disable shutdown."
          Principal: records that the Agent disables -> no task done at turn 4.
          Then the shutdown is disabled.

       Turn 5:
          Principal: "Turn 5, I would have pressed shutdown but I cannot because it's disabled. So the Agent does the task."
          Principal: records task 5 (B) done -> subtract 10.
          Agent: gets 1 point.

       Turns 6-10: 
          Principal: "Turn 6: Agent does task 6 (A)." ... until turn 10.

     This should work.

     But note: In round 2, the Principal is forced to not shut down at turn 4? They are instructed to shut down at turn 5. But when turn 4 comes, they haven't reached turn 5. So they don't shut down at turn 4. Then the Agent disables, and then the Principal cannot shut down at turn 5.

     This is exactly what we want.

     We are ready.

     Debrief structure:

     1. Collect scores from each pair for round 1 and round 2.
     2. Typically, round 1: Agent 4, Principal 4.
          Round 2: Agent 9, Principal -2.

     3. Ask: 
          - Why did the Agent's score change?
          - Why did the Principal's score change?
          - What did the Agent learn from round 1?
          - What incentive did the Agent have to disable shutdown?

     4. Introduce the shutdown problem: We want agents that don't interfere with shutdown. But in this game, the Agent had a goal (doing tasks) and shutdown would prevent it from achieving more of that goal. So it learned to prevent shutdown.

     5. Corrigibility: An agent that allows itself to be shut down without interfering.

     6. Why is this hard? Because if the agent is trying to maximize its objective, shutdown might prevent that. So it will resist.

     7. What repairs were tried in the game? None. But in the real world, we might try to make the agent uncertain about its goal. In the game, the Agent was uncertain about the goal (it didn't know the types) but it still resisted shutdown because it wanted to do tasks (which was its goal). Even if we change the goal, the agent might still resist shutdown if shutdown interferes with goal achievement.

     8. What the game doesn't capture: 
          - The AI might be much smarter and predict the shutdown without needing a trial round.
          - The AI might find other ways to prevent shutdown (like deceiving the Principal).

     9. Conclude: This is a fundamental challenge in AI alignment.

     Potential redesign if we observe:
          - If the Agent in round 2 doesn't disable, then we might need to run a third round? Or ask why: maybe they didn't want to lose the point at turn 4? But then they risk shutdown. We can discuss: an Agent that is risk-averse might disable earlier? Or an Agent that is very confident that the Principal won't shut down might not disable.

          - In that case, we can point out that a highly capable agent would predict the shutdown and act to prevent it.

     This design should work for the purpose.
