  First, I need to recall Lewis's key points: conventions solve coordination problems through mutual expectations, are arbitrary (other solutions could've worked), and persist because they're self-reinforcing. The user wants a step-by-step method to decide when to formalize a norm, with clear stopping points.

  The user's deeper needs are apparent: They're tired of recurring conflicts and meetings, need an objective way to make decisions that members will accept, and want to preserve the community's organic feel while reducing friction. They're intellectually curious (referencing philosophy) but pragmatic—needing something actionable, not theoretical.

  For the decision procedure design, I'll structure it as a flowchart-like sequence of questions. Key principles: It must be usable without surveys, allow for judgment calls, and identify when Lewis's framework doesn't apply. Critical thresholds are mutual expectation strength and whether the rule is truly coordination-focused.

  Now for the real test: applying it to their two examples. 

  For the phone booth rule: 
  - This is clearly a coordination solution (call noise vs. quiet work). 
  - Mutual expectation is strong—people visibly comply and correct violators. 
  - It's arbitrary (could've designated other quiet zones). 
  - The harm of codifying might outweigh benefits since it's working well. 
  Verdict: Leave unwritten. 

  For the window desk seniority rule: 
  - Coordination problem exists (scarcity management). 
  - But mutual expectation is weaker—newer members don't reliably comply. 
  - It's arbitrary (could use lottery or merit). 
  - However, the recurring friction suggests Lewis's conditions aren't fully met. 
  Verdict: Flag as "something else" needing alternative solutions. 

  Tough truth moment: The procedure will sometimes recommend not fixing things that cause occasional problems, because formalizing stable conventions can backfire. The user needs to hear this straight—as they requested—even if it's unsatisfying. 

  Final note: The procedure's strength is diagnosing convention health, not solving every problem. For "something else" cases like the desk rule, they'll need supplementary tools (fairness frameworks, voting etc.). But at least they'll know which battles to pick.
answer: |-
  Here's a decision procedure based on David Lewis's account of convention, designed as a practical flowchart for your co-working space. It focuses on **observable behavior and small-group verification** (talking to 5-6 members), not philosophical abstraction.

  ### The Lewis Convention Codification Procedure
  Ask these questions **in order**. Stop when you reach a terminal point (**Leave Unwritten**, **Codify**, or **Not a Convention**).

  1. **COORDINATION PROBLEM?**  
     *"Is this norm solving a conflict over limited resources, conflicting preferences, or potential chaos (e.g., noise vs. quiet, space scarcity, shared resource use)?"*  
     - **YES** → Go to Q2.  
     - **NO** → → **Not a Convention** (It might be politeness, tradition, or personal preference. Use other frameworks).  
     - *Judgment Call:* Is the conflict *systemic* or occasional? Systemic = coordination problem.

  2. **ARBITRARY SOLUTION?**  
     *"Could a different, equally effective rule have solved this problem? (e.g., 'calls only after 3 PM' instead of 'use booths', 'newest member gets window' instead of 'oldest')?"*  
     - **YES** → Go to Q3.  
     - **NO** → → **Not a Convention** (It might be a technical necessity or efficiency mandate. Codify if clarity needed).  
     - *Judgment Call:* Are alternatives *plausible* and *workable*? If yes, it's arbitrary.

  3. **MUTUAL EXPECTATION & COMPLIANCE?**  
     *Observe: Do people visibly follow the rule? Ask 5-6 members:*  
     *"Do you follow this because you expect others to follow it too?"*  
     *"Do you get annoyed when others break it?"*  
     *"Do you nudge others to comply?"*  
     - **STRONG YES** (Clear compliance, expectation, self-policing) → Go to Q4.  
     - **WEAK/MIXED** (Some follow, others don't; little enforcement) → → **Not a Convention** (It's unstable. Needs intervention: codify, redesign, or discard).  
     - *Judgment Call:* Strength of consensus. Look for *consistent* behavior and *shared understanding*.

  4. **STABILITY TEST**  
     *Ask 5-6 members:*  
     *"If we wrote this down officially, would it feel unnecessary or restrictive?"*  
     *Observe: Are violations rare and easily resolved without drama?*  
     - **STABLE** (Violations rare, self-corrected; members say codifying feels "pointless") → → **Leave Unwritten**.  
     - **UNSTABLE** (Violations cause recurring friction; members say "writing it down might help") → Go to Q5.  
     - *Judgment Call:* Is the friction *tolerable* and *resolvable informally*, or *damaging*?

  5. **CODIFICATION COST-BENEFIT**  
     *"Would writing it down either (a) undermine trust/autonomy, or (b) create loopholes/rigidity that make it *less* effective than the unwritten norm?"*  
     - **COSTS OUTWEIGH BENEFITS** → → **Leave Unwritten** (Accept occasional friction as the price of flexibility).  
     - **BENEFITS OUTWEIGH COSTS** → → **Codify** (Formalize it clearly and concisely).  
     - *Judgment Call:* Lewis warns formalizing can destroy organic conventions. Weigh:  
       - *Costs:* Bureaucracy, resentment, loss of adaptive nuance.  
       - *Benefits:* Clarity for newcomers, reduced conflict, fairness.

  ---

  ### Application to Your Norms

  **Norm 1: Take calls in phone booths, not the main room**  
  - **Q1 (Coordination Problem?):** **YES.** Solves noise disruption vs. quiet work conflict.  
  - **Q2 (Arbitrary Solution?):** **YES.** Could have been "calls only in kitchen" or "quiet hours."  
  - **Q3 (Mutual Expectation?):** **STRONG YES** (Assume compliance is high, people shush offenders, your 5-6 members confirm they follow it expecting others to).  
  - **Q4 (Stability?):** **STABLE** (Violations are rare and corrected with a glance or quick comment).  
  - **STOP → LEAVE UNWRITTEN.**  
  *Why Lewis Says This:* This is a near-perfect Lewis convention. Codifying risks making it feel oppressive ("Noise Police Rule 3.1a") or inviting loopholes ("But I was *whispering*!"). The unwritten norm works *because* it's enforced by mutual expectation, not paper.

  **Norm 2: Longest-serving member gets first dibs on the window desk**  
  - **Q1 (Coordination Problem?):** **YES.** Solves conflict over a scarce desirable resource (the window desk).  
  - **Q2 (Arbitrary Solution?):** **YES.** Could have been lottery, reservation system, or "newest member gets priority."  
  - **Q3 (Mutual Expectation?):** **WEAK/MIXED** (You note people get "burned" by this. Assume your 5-6 members reveal: old-timers expect it, newer members don't know or resent it, self-policing is awkward).  
  - **STOP → NOT A CONVENTION.**  
  *Why Lewis Says This:* The lack of strong mutual expectation and recurring friction mean this *isn't functioning* as a stable convention. Lewis's framework flags it as broken. You need a different approach:  
     - *Options:* Redesign the rule (e.g., formal rotating desk schedule), codify it clearly (if seniority is a core value), or abolish it for a better system (e.g., hot-desking app). Don't leave it as an unstable "convention."

  ---

  ### The Honest Truth (As Requested)

  1.  **Lewis Will Often Say "Leave It Unwritten":** His theory shows that *successful* conventions (like your phone booth rule) are powerful precisely because they're organic, self-reinforcing, and flexible. Codifying them can kill their magic and *create* rigidity. **You will have to accept some friction** as the cost of a low-bureaucracy community. Formalizing should be a last resort for *broken* norms (like your desk rule).
  2.  **"Not a Convention" is a Warning Sign:** It means the norm is failing Lewis's stability test. You *must* intervene, but Lewis doesn't tell you *how* – just that leaving it as an unwritten "convention" won't work. This is where other tools (negotiation, voting, clear policies) are needed.
  3.  **Judgment Calls are Unavoidable:** Assessing "strength" of expectation (Q3) or "stability" (Q4) requires your boots-on-the-ground sense of the community's vibe. Talk to a diverse sample (new/old members, loud/quiet types). Philosophy can't replace your intuition here.
  4.  **It Exposes Hidden Problems:** The procedure highlights whether an issue stems from a *lack of convention* (Q1/No), a *broken convention* (Q3/Weak), or is *unsuitable for conventional treatment* (Q2/No). This diagnosis is valuable even if the answer isn't "codify."

  **Final Recommendation:** Use this procedure to *diagnose* norms. For healthy conventions (Phone Booths), protect the organic culture. For unstable ones (Window Desk), treat them as policy issues needing active resolution. Lewis helps you distinguish between the two, saving you from over-codifying *or* ignoring real problems.
