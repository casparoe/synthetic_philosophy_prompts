prompt: |-
  I'm trying to figure out what I actually think about causation by omission, going by my gut on cases. Here they are:

  1. A lifeguard on duty watches a swimmer drown and does nothing. I say the lifeguard's failure to act caused the swimmer's death.

  2. A stranger on the beach watches the same swimmer drown and does nothing, though throwing a nearby life preserver would have been easy. I say the stranger's omission caused the death, but I feel some resistance to saying it — it seems slightly less causal than the lifeguard case, even though the counterfactual structure is identical.

  3. A gardener goes on vacation for two weeks without arranging for anyone to water the plants. The plants die. I say the gardener's omission caused the plants' death.

  4. A neighbor who has never met the gardener notices the plants wilting through the window and does nothing. I do not say the neighbor's omission caused the plants' death — that feels wrong, even though the neighbor could have broken in and watered them.

  5. A doctor fails to administer a standard antibiotic to a patient with a bacterial infection. The patient dies. I say the doctor's omission caused the death.

  6. A passerby on the street fails to administer an antibiotic to a stranger having a medical emergency — the passerby happens to be carrying the right drug and knows how to use it. I do not say the passerby's omission caused the death, though I'm less confident about this one than case 4.

  7. A parent fails to feed their infant. The infant dies. I say the parent's omission caused the death.

  8. A manufacturer designs a car and omits a standard safety feature that would have prevented a specific kind of crash fatality. A customer dies in exactly that kind of crash. I say the manufacturer's omission caused the death.

  9. The same manufacturer omits a safety feature that no car on the market has, and that no regulation requires, but that the manufacturer's own engineers had sketched out and knew would prevent a rare kind of fatality. A customer dies in exactly that way. I am genuinely torn here — I lean toward saying the omission did not cause the death, but I keep flipping.

  10. A government fails to build a flood barrier that would have protected a town from a storm surge. The town floods and people die. I say the government's omission caused the deaths — but only if the barrier had been funded, approved, and was standard practice in comparable towns. If building it would have required unprecedented effort and expense, I find myself wanting to say the omission didn't cause the deaths, even though the counterfactual is the same.

  11. Everyone in the world who owns a phone fails to call in a warning about an impending natural disaster they each independently learned about. The disaster hits and thousands die. I do not say any particular individual's omission caused the deaths, but I do want to say something causal about the collective failure. I'm not sure what.

  12. A pedestrian fails to shout a warning to a cyclist about to collide with an opening car door. The cyclist crashes. I do not say the pedestrian's omission caused the crash — it feels like a mere non-happening, not a cause.

  Is there a single principle that captures all or most of these verdicts? I'm especially interested in what the principle would say about case 9 (the unrequired safety feature) and case 10 (the barrier that wasn't standard practice), since those are the ones I can't settle. If no clean principle gets everything, tell me which verdicts I should reconsider and what I'd be committing to by keeping them. And if the best principle still leaves some cases as genuinely indeterminate — where the concept of causation by omission just doesn't yield a definite answer — I'd like to know that too.
reasoning: |-
  Okay, I need to help the user figure out a consistent principle for causation by omission based on their gut reactions to these cases. Let me start by understanding their pattern. 

  Looking at cases 1, 3, 5, 7, and 8, they consistently attribute causation when there's a clear duty or role-based obligation—like the lifeguard, gardener, doctor, parent, and manufacturer with standard safety features. But in cases 4 and 6, where strangers or passersby could act but have no obligation, they deny causation. The resistance in case 2 (stranger on the beach) is interesting because the counterfactual is identical to case 1, but they feel less causal due to lack of duty. 

  Cases 9 and 10 are tricky for them. Case 9 involves an unrequired safety feature—manufacturer knew it could help but it wasn't standard. The user is torn. Case 10 about the flood barrier depends on whether it was standard practice; if not, causation feels less clear. This suggests that normative expectations matter more than just possibility. 

  The user also differentiates individual vs. collective responsibility in case 11. No single phone owner caused the deaths, but the collective failure did. Case 12 is another non-duty situation—pedestrian not warning cyclist—so omission isn't causal. 

  The core principle seems to be "normative expectation" rather than moral obligation. Role-based duties (lifeguard, parent) create expectations, but so do societal standards (manufacturer safety norms, government flood barriers). When an agent is expected to act due to their role or established norms, their omission is causal. 

  For the tricky cases: In case 9, since the safety feature wasn't standard or required, the omission isn't causal. In case 10, if building the barrier wasn't standard, it's not causation. The user's hesitation there aligns with the principle. 

  But I should consider counterarguments. Some philosophers argue that causation is purely counterfactual, so all these omissions should be causal. But the user's intuitions reject that, especially in stranger cases. The normative expectation principle explains why. 

  The user might also be conflating causation with blame. But they distinguish in case 2—stranger's omission feels less causal, not just less blameworthy. So it's about the causal attribution itself. 

  For case 11, collective causation is tricky. The principle could extend to group obligations, but since no individual was expected to act alone, no single omission caused the deaths. The collective failure is causal, but that's a different category. 

  Overall, normative expectation captures most cases. The user should reconsider if any duty exists in case 6 (passerby with antibiotic). If there's no established duty, their intuition holds. Cases 9 and 10 fit if "standard practice" sets the expectation. If not, omission isn't causal. 

  The user's uncertainty in some cases might stem from genuine indeterminacy in omission causation. Even with the principle, societal norms can be vague, making some cases borderline. That's acceptable—not all omissions need clear-cut answers.
answer: |-
  Based on your intuitive verdicts, a single principle capturing *most* of them is **"Causation by omission requires that the agent had a specific, established normative expectation to perform the omitted action."**

  This principle incorporates **role-based duties, explicit responsibilities, contractual obligations, and widely recognized societal standards** – not just moral duties or physical possibilities. It explains your pattern:

  1.  **Captured Cases:**
      *   **Lifeguard (1):** Clear role-based duty.
      *   **Gardener (3):** Implied contractual/responsibility-based duty.
      *   **Doctor (5):** Clear professional duty.
      *   **Parent (7):** Fundamental societal and legal duty.
      *   **Manufacturer (Standard Feature) (8):** Established industry standard/regulatory expectation creates a specific duty.
      *   **Government (Standard Barrier) (10):** Established governmental responsibility/standard practice creates a specific duty.
      *   **Stranger (Beach) (2) Resistance Explained:** Your resistance arises because the stranger *lacks* this specific, established normative expectation, even though the counterfactual is identical. The principle explains why the lifeguard's omission feels *more* causal.
      *   **Neighbor (Plants) (4), Passerby (Antibiotic) (6), Pedestrian (Warning) (12):** No established normative expectation exists for these strangers to act, hence no causation by omission.
      *   **Collective Failure (11):** Explains why no *individual's* omission caused the deaths (no specific expectation on any *one* person), but allows that the *collective* failure might be causal under a different principle (e.g., group agency or societal expectation).

  2.  **The Tricky Cases Explained:**
      *   **Case 9 (Unrequired Safety Feature):** Your principle leans towards **NO causation**. The engineers' knowledge creates a *moral* failing or negligence, but the lack of a *specific, established* normative expectation (standard practice, regulation, requirement) means the omission doesn't qualify as *causal* under your gut intuition pattern. The manufacturer failed a *potential* duty or acted badly, but the death wasn't *caused* by *that* omission in the way the standard omission was.
      *   **Case 10 (Non-Standard Barrier):** Your principle explains your shift. If building the barrier was **standard practice/funded/approved**, the specific normative expectation exists → **Causation**. If it required "unprecedented effort/expense," it falls *outside* the established expectation → **NO causation**.

  3.  **What You Might Be Committing To:**
      *   **Causation ≠ Morality/Blameworthiness:** You can blame the stranger on the beach (Case 2) morally without calling their omission a *cause*.
      *   **Causation is Relational & Normative:** Causation by omission isn't a purely physical or counterfactual relation; it's inherently tied to normative contexts defining expectations.
      *   **Rejecting Pure Counterfactualism:** You explicitly reject the idea that *any* possible preventative omission is causal (e.g., Cases 4, 6, 12).
      *   **"Established" Matters:** The expectation needs to be concrete and recognized (role, contract, standard, regulation), not just a vague moral possibility.

  4.  **Reconsidering Verdicts (If You Want More Consistency):**
      *   **Case 2 (Stranger on Beach):** Your principle suggests you should be **more confident in saying NO causation** here, like Cases 4, 6, and 12. Your resistance indicates the counterfactual pull is strong, but your other verdicts consistently override it when normative expectations are missing. Reconsidering this to a firm "NO causation" would align perfectly with your principle and other stranger cases.
      *   **Case 9 (Unrequired Feature):** Your principle strongly points to **NO causation**. If you feel it *should* be causal, it might be because you're conflating severe negligence/blameworthiness with causation, or perhaps weighting "internal knowledge/feasibility" higher than "established expectation." Sticking with "NO" aligns with your other verdicts (especially Case 10 non-standard barrier).
      *   **Case 11 (Collective Failure):** Your principle handles the *individual* level well. For the *collective*, you'd need a distinct principle like: "A collective omission causes harm if the group had a recognized responsibility/ability to act, *and* the harm resulted from the absence of a coordinated response that was normatively expected *of the group*." This is complex and potentially indeterminate.

  5.  **Genuine Indeterminacy:**
      The concept of causation by omission *is* inherently messy at the boundaries. Your principle helps, but borderline cases will exist:
      *   **How "established" must the expectation be?** Is an unwritten industry norm enough? What about an emerging standard?
      *   **Case 9:** Is the internal feasibility study enough to create a "specific expectation" *for that company*, even without external standards? (Your gut flip-flopping reflects this indeterminacy).
      *   **Case 10:** Exactly how much expense/effort moves it from "standard duty" to "non-duty"? The line is fuzzy.
      *   **Case 6 (Passerby with Antibiotic):** If the passerby was an *off-duty doctor*, would your verdict change? The principle suggests it might (role-based duty), highlighting the contextual nature.

  **Conclusion:** Your intuitions are best explained by the **Normative Expectation Principle**. It clearly resolves Cases 1, 3, 4, 5, 6, 7, 8, and 12, explains your resistance in Case 2, clarifies your shift in Case 10, and provides a clear answer for Case 9 (No causation). Case 11 requires separate consideration of collective responsibility. The principle accepts that causation by omission isn't purely counterfactual but depends on contextual norms defining *who is expected to do what*. Borderline cases like the precise definition of "established expectation" in Cases 9 and 10 reveal genuine indeterminacy in the concept itself.
