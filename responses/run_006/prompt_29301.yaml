prompt: |-
  I work as a senior policy designer on a government behavioural insights team. My unit designs choice architectures for public-facing services: how options are presented on benefits enrolment websites, default settings on retirement savings platforms, the framing of organ-donor registration forms, the layout of tax-filing interfaces. Our decisions affect millions of people, and we make them regularly — several new interventions go live each quarter. My team includes designers, data scientists, and subject-matter experts, but almost none of them have any background in moral or political philosophy. I do not need them to become philosophers, but I do need them to be able to distinguish a legitimate nudge from an intervention that is objectionably paternalistic, and I need this distinction operationalised in a form they can apply without me in the room. The stakes are high: a badly designed intervention that crosses the line will, if noticed, generate press coverage accusing the government of manipulation, and even if it is not noticed, it may wrong the people it touches. The procedure has to be something a team member can run in under thirty minutes on a single proposed intervention, and it must be honest about where it relies on empirical claims we may not have evidence for and where it relies on value judgments that no procedure can settle.

  What I want is a decision procedure — a checklist or a sequence of questions with decision rules — that a team member can run on a proposed intervention to determine whether it is permissible on paternalism grounds or whether it is ethically blocked. The procedure should draw on whatever the philosophical literature on paternalism has established that is genuinely usable: the distinction between hard and soft paternalism, between means paternalism and ends paternalism, the role of transparency and publicity, the difference between a nudge and a shove, the question of whose conception of the good is being imposed. But the procedure must not require the user to know those terms or to have read the literature. Each step should specify what counts as a sufficient answer to move forward, where the procedure stops with a red light, and where it must escalate to a person (or a panel) because the question is irreducibly normative. Please also flag the kinds of case the procedure cannot handle — for instance, interventions that are paternalistic toward one group in order to protect another, or cases where the empirical evidence about what the affected people 'really' want is contested or ambiguous, or interventions whose effects on autonomy and welfare point in opposite directions.

  Then apply the procedure to three proposals we are currently debating:

  (1) Automatically enrolling all employees in a workplace pension plan with an opt-out rather than an opt-in, at a default contribution rate set somewhat above what survey data suggest most employees would choose for themselves if they were choosing actively.

  (2) Redesigning a benefits-application portal so that the option to report a change in circumstances — which triggers a reassessment that often reduces a claimant's benefits — requires navigating three additional screens and confirming twice, while all other options on the same portal remain one-click.

  (3) Requiring a twenty-four-hour cooling-off period before a user can increase their daily betting limit on a state-regulated gambling app, where the delay is accompanied by a screen showing the user's losses over the past month.

  For at least one of these, I expect the procedure to return an answer my team will find uncomfortable. Please do not soften that answer. I also want you to tell me, at the end, what the procedure cannot do — what kinds of paternalism question it is structurally incapable of answering, and where someone using it might be misled into thinking a moral question has been settled when it has only been deferred.
reasoning: |-
  Okay, the user is a senior policy designer on a government behavioral insights team. They need an ethical decision procedure to evaluate nudges for paternalism concerns. Their team lacks philosophy background but handles high-stakes interventions affecting millions. The procedure must be quick, operational, and flag normative uncertainties.

  First, I need to distill philosophical concepts into practical steps. Key principles: autonomy preservation, proportionality, reversibility, transparency, and avoiding value imposition. The literature mentions soft vs. hard paternalism, means/ends, and publicity tests. These must be translated without jargon.

  The user’s deeper needs include preventing backlash (media scandals) and ethical harms, even if unnoticed. They also need team buy-in, so the tool must feel actionable, not academic. Unspoken: maintaining government trust and avoiding paternalism that feels manipulative.

  For the structure, a flowchart with yes/no questions makes sense. Critical points: Is the behavior harmful? Is consent possible? Does it override choices? Transparency is crucial. Also, identifying "red lines" like deception or irreversible decisions.

  Now, applying to the examples. Pension auto-enrollment: moderate paternalism but passes reversibility and transparency. Benefits portal redesign: friction could be seen as manipulative, especially if targeting benefit reductions—likely a red flag. Gambling cooling-off period: addresses self-harm, reversible, transparent—probably acceptable.

  Limitations: The tool can't resolve conflicts between autonomy and welfare, ambiguous evidence, or protecting third parties. It also can’t handle contested conceptions of good. Users might mistake procedural checks for moral resolution, especially in gray areas.

  Need to flag that the benefits portal case should be uncomfortable—designers might not see the targeting as coercive, but the intent to deter claims is ethically shaky. Transparency alone doesn’t justify manipulation. 

  Finally, emphasize that normative conflicts require human judgment. The procedure is a sieve, not a solver.
answer: |-
  Here is a practical, philosophy-grounded decision procedure for evaluating paternalism in behavioral interventions. It distills key ethical concepts into 7 sequential questions with clear thresholds, flags irreducibly normative judgments, and identifies operational red lights.

  ---

  ### **Paternalism Evaluation Procedure (PEP)**
  *Purpose: To determine if an intervention is ethically permissible or blocked on paternalism grounds. Time: <30 mins/intervention.*

  **Instructions:**  
  Answer each question sequentially. If unsure, default to "No" or "Unclear." Escalate to ethics panel (★) if flagged. Stop if RED LIGHT appears.

  1. **HARM PREVENTION**  
     *"Is the intervention primarily aimed at preventing serious harm (physical, financial, psychological) to the person being influenced?"*  
     - ✅ **Yes/Unclear**: Proceed to Q2.  
     - ❌ **No**: RED LIGHT (*Not paternalistic justification*).  
     - ★ *Irreducible judgment*: Defining "serious harm" may require panel input.

  2. **AUTONOMY PRESERVATION**  
     *"Can the person easily reverse the intervention’s effect with minimal effort (e.g., 1–3 clicks), without penalties or hidden obstacles?"*  
     - ✅ **Yes**: Proceed to Q3.  
     - ❌ **No**: RED LIGHT (*Hard paternalism*).  
     - ★ *Gray area*: If reversal is technically possible but psychologically burdensome (e.g., requires calling a helpline).

  3. **TRANSPARENCY TEST**  
     *"Would the intervention still work if we publicly explained its design intent to the affected people (e.g., in plain language on the website)?"*  
     - ✅ **Yes**: Proceed to Q4.  
     - ❌ **No**: RED LIGHT (*Manipulative/deceptive*).

  4. **CONSENT POSSIBILITY**  
     *"Is there reliable evidence that most affected people would agree this intervention aligns with their own goals if asked?"*  
     - ✅ **Strong evidence** (e.g., surveys, behavioral data): Proceed to Q5.  
     - ⚠️ **Unclear/Contested**: Proceed but note risk. Escalate to panel if high-stakes (★).  
     - ❌ **Evidence of opposition**: RED LIGHT (*Imposing external values*).

  5. **PROPORTIONALITY CHECK**  
     *"Is the intervention’s ‘push’ (e.g., friction, defaults) the mildest practical way to achieve the harm-reduction goal?"*  
     - ✅ **Yes**: Proceed to Q6.  
     - ❌ **No** (e.g., equally effective less-intrusive option exists): RED LIGHT (*Overreach*).

  6. **VULNERABILITY AUDIT**  
     *"Does the intervention disproportionately affect people in crisis (poverty, addiction, grief) or with cognitive impairments?"*  
     - ✅ **No**: Proceed to Q7.  
     - ⚠️ **Yes**: ★ Escalate to panel. *Soft paternalism may be justified here but requires expert review*.

  7. **NEUTRALITY OF FRAMING**  
     *"Does the design avoid exploiting cognitive biases (e.g., framing losses as gains) to steer toward one option?"*  
     - ✅ **Yes**: **GREEN LIGHT** (*Permissible nudge*).  
     - ❌ **No**: RED LIGHT (*Coercive architecture*).  

  ---

  ### **What PEP Cannot Handle**
  - **Conflicting values**: Interventions that protect one group by paternalistically restricting another (e.g., smoking bans to protect children).  
  - **Ambiguous ends**: Where evidence about what people "truly want" is contested (e.g., obesity interventions vs. body autonomy).  
  - **Trade-offs**: When autonomy and welfare cannot be aligned (e.g., forced savings that reduce present hardship but increase future security).  
  - **Cultural imposition**: Using majority preferences to override minority practices.  
  - **★ Key risk**: PEP may create false confidence in Q4/Q6 where empirical gaps or normative disagreements exist. It flags but cannot resolve these.

  ---

  ### **Application to Your Proposals**

  #### **(1) Pension Auto-Enrollment**  
  1. **Harm Prevention**: ✅ Yes (preventing poverty in old age).  
  2. **Autonomy Preservation**: ✅ Yes (easy opt-out).  
  3. **Transparency**: ✅ Yes (can disclose: "We default to higher savings to protect retirees").  
  4. **Consent**: ⚠️ **Unclear** (surveys show lower preferred rates; may not reflect true needs). ★ Escalate to panel for evidence review.  
  5. **Proportionality**: ✅ Yes (defaults are mildest effective tool).  
  6. **Vulnerability**: ✅ No (applies broadly).  
  7. **Neutrality**: ✅ Yes (no exploitative framing).  
  → **★ ESCALATE** for Q4 validation. *Likely permissible with evidence refinement.*

  #### **(2) Benefits Portal Friction**  
  1. **Harm Prevention**: ❌ **No** (aim is administrative efficiency, not user protection).  
     → **RED LIGHT**. *Stops here.*  
     - *Rationale: Creating friction to deter reporting changes is anti-paternalistic—it prioritizes state interests over user welfare. Uncomfortable truth: This is bureaucratic manipulation, not benevolence.*

  #### **(3) Gambling Cooling-Off Period**  
  1. **Harm Prevention**: ✅ Yes (reducing addiction-driven losses).  
  2. **Autonomy Preservation**: ✅ Yes (delay only; no reversal needed).  
  3. **Transparency**: ✅ Yes (can disclose: "We delay limit increases to prevent impulsive harm").  
  4. **Consent**: ✅ **Strong evidence** (gamblers often support "circuit breakers").  
  5. **Proportionality**: ✅ Yes (delay + feedback is milder than blocking access).  
  6. **Vulnerability**: ⚠️ **Yes** (targets addicts). ★ Escalate for vulnerability assessment.  
  7. **Neutrality**: ✅ Yes (loss display is factual).  
  → **★ ESCALATE** for Q6 review. *Likely permissible with safeguards.*

  ---

  ### **Critical Takeaway**  
  **PEP flagged the benefits portal (2) as ethically impermissible**—a result your team may resist due to its efficiency gains. This is non-negotiable: Deliberately obstructing user actions to reduce state costs violates core anti-paternalism principles. Transparency won’t redeem it (Q3 fails).  

  **Use PEP cautiously**: It is a screening tool, not an ethicist. It will miss dilemmas where "harm" is disputed (e.g., nudging toward vegetarianism) or where societal vs. individual goods clash. Always pair it with empirical validation for Q4/Q6 and panel review at ★ flags.
