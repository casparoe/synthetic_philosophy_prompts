prompt: |-
  So I just got back from a long arguement with a friend about whether the Brexit referendum was even a legitimate excercise of democratic will, and the whole thing kept circling back to who actually got to vote. I know the basic facts well enough: the franchise followed the UK general election franchise, so British citizens (including overseas ones who'd been registered in the UK within the last 15 years), plus resident Irish and Commonwealth citizens, got a vote, and Gibraltar voted too; but most EU citizens living in the UK couldn't vote, and 16-17 year olds couldn't either even though they'd had the vote in the Scottish independence referendum. My friend's line was that the people most affected — EU nationals who'd built their lives in Britain — had no say, while a British retiree in Spain who hadn't lived in the UK for a decade could. I want to work through this properly with the boundary problem / all-affected interests stuff from democratic theory, not just vibes. Treat the Brexit referendum franchise as a case study: what would the all-affected interests principle actually have said about who should be in the demos for that decision, and what does it need 'affected' to mean to say that? Which features of the actual franchise does it explain, which does it get wrong or stay silent on, and what does the case end up showing about the principle — is it usable here, or does it fall apart into the everyone-affects-everyone problem as soon as you try to draw a line? And be honest about where it just has nothing to say about the 16-17 year old question rather than forcing it to speak.
reasoning: |-
  Okay, the user is coming off a heated debate about the Brexit referendum's legitimacy, specifically focusing on the voting franchise. They already know the basic facts—who could and couldn't vote—but want to analyze it through the lens of democratic theory, particularly the "all-affected interests" principle. They’re frustrated with surface-level arguments and want a rigorous breakdown.  

  First, I need to unpack the "all-affected interests" principle properly. The user mentioned the boundary problem and the "everyone-affects-everyone" issue, so I should address that head-on. They’re clearly aware this isn’t straightforward. The core tension is between inclusivity and practicality: if "affected" means *any* ripple effect, the demos becomes global, which is useless. But if it’s too narrow, it excludes people with legitimate stakes.  

  The user’s friend argued that EU nationals in the UK were disenfranchised while expat Brits in Spain could vote. That’s a concrete example to test the principle. I should map out degrees of affectedness:  

  - **High affectedness**: EU nationals in the UK (immediate loss of rights, residency uncertainty), UK residents (economic/social disruption), Irish citizens (shared economy/border), Gibraltarians (direct impact).  
  - **Medium**: UK expats in the EU (rights/residency changes, but possibly mitigated by host countries), young people (future consequences).  
  - **Low but real**: EU businesses trading with the UK, neighboring economies.  

  The principle would likely demand voting rights for high-affectedness groups—especially EU nationals in the UK—but the *actual* franchise did the opposite. That’s a glaring flaw. Meanwhile, the retiree in Spain voting makes sense under the principle if they’re likely to return (rights at stake), but not if they’re permanently settled.  

  The 16–17-year-old question is separate. The principle doesn’t hinge on age; it’s about the intensity of effect. Since Brexit’s fallout would shape their adult lives, excluding them is hard to justify under "all-affected." But democratic systems often tie voting to age as a proxy for competence—here the principle stays silent.  

  Where the theory struggles:  
  - **Practicality**: Running a global referendum is absurd. We need thresholds, but setting them is arbitrary.  
  - **Circularity**: "Who decides who’s affected?" requires a prior demos.  
  - **Trade-offs**: Including non-citizens might weaken national self-determination.  

  The case shows the principle is a critical tool for spotting injustices (e.g., excluding resident EU nationals) but fails as a standalone solution. It’s diagnostic, not prescriptive. The user wants honesty about its limits—so I’ll admit it doesn’t magically resolve the 16–17 gap but does expose the franchise’s contradictions.  

  Finally, the user’s deeper need: They want intellectual ammunition but also clarity on whether democratic theory can *solve* this or just highlight problems. I should emphasize that the principle reveals flaws (like the EU national exclusion) but can’t draw clean lines. That’s why real-world franchises blend theory with pragmatism (like citizenship/residency rules)—and why their argument with their friend is so thorny.
answer: |-
  Let's break down the Brexit referendum franchise through the lens of the **all-affected interests (AAI) principle**, tackle its conceptual challenges, and assess its practical implications. This principle asserts that *all individuals whose interests are affected by a decision should have a say in making it*. The Brexit case is a stress test for AAI, revealing both its critical insights and its limitations.

  ### Core Problem: What Does "Affected" Mean?
  AAI collapses without clear thresholds for "affectedness." We need gradations:
  1. **Directly/Intensely Affected**: Fundamental rights, residency status, livelihood, or identity are altered.
  2. **Significantly Affected**: Major economic, social, or legal consequences.
  3. **Indirectly/Tangentially Affected**: Ripple effects (e.g., global markets).

  **AAI demands inclusion proportional to the *degree* of affectedness.** But operationalizing this is contentious.

  ---

  ### Applying AAI to Brexit: Who *Should* Have Voted?
  1. **EU Nationals Resident in the UK**:  
     - **AAI Verdict**: **Strongest claim for inclusion**. Brexit directly threatened their residency rights, employment, family unity, and sense of belonging. Exclusion under the actual franchise is a major flaw under AAI.  
     - **Why?**: Immediate, material, and existential impact. Their lives were governed by UK law post-Brexit.

  2. **UK Citizens Living in the EU**:  
     - **AAI Verdict**: **Inclusion justified**. Brexit jeopardized their residency, healthcare access, pensions, and property rights in EU states. The 15-year rule was arbitrary; a retiree in Spain faced deportation risk.  
     - **Contradiction**: Actual franchise included them (if registered <15 years), aligning *partially* with AAI.

  3. **Irish & Commonwealth Citizens in the UK**:  
     - **AAI Verdict**: **Inclusion justified**. Their residency and rights were directly tied to UK policy. The franchise got this right under historical/common law traditions, but AAI supports it on principled grounds.

  4. **Gibraltarians**:  
     - **AAI Verdict**: **Inclusion essential**. Their economy, border, and sovereignty were uniquely vulnerable. Franchise correctly included them.

  5. **16–17-Year-Old UK Residents**:  
     - **AAI Verdict**: **Inclusion strongly justified**. Brexit’s long-term consequences (economic opportunities, EU mobility, environmental standards) would shape their adult lives far more than older voters.  
     - **AAI’s Silence**: AAI doesn’t specify *voting age*—it only notes affectedness. Lowering the voting age requires separate arguments (competence, franchise consistency), but AAI highlights the *injustice* of excluding a highly affected cohort.

  6. **Wider Groups**:  
     - **Scottish/N. Irish Residents**: Regional economies and identities were disproportionately affected (e.g., Scottish EU funding, Irish border). AAI *could* support weighted voting or regional vetoes, but franchise treated them as "generic UK voters."  
     - **EU Citizens Outside the UK**: Traders, farmers, or families with UK ties faced significant economic/emotional impacts. AAI *theoretically* includes them but highlights a **key problem**: where to draw the line?  
     - **Global Actors**: Multinational corporations or neighboring economies (e.g., Ireland, France) were tangentially affected. AAI risks infinite regress here.

  ---

  ### Where AAI Explains the Actual Franchise:
  - **Commonwealth/Irish Inclusion**: Historically tied to UK sovereignty, but AAI retroactively justifies it via significant affectedness.  
  - **Gibraltar**: Clear recognition of unique vulnerability (aligned with AAI).  
  - **Overseas UK Citizens**: Partial alignment via the 15-year rule (acknowledging enduring ties), though AAI would relax time limits.

  ### Where AAI Clashes with the Franchise:
  1. **Exclusion of UK-Resident EU Nationals**: The franchise’s most indefensible flaw under AAI.  
  2. **Arbitrary 15-Year Rule for Expats**: Lifelong emigrants with no return plans had equal say to those facing imminent consequences.  
  3. **Exclusion of 16–17-Year-Olds**: Franchise ignored disproportionate long-term impact.

  ---

  ### Does AAI "Fall Apart" in Practice?
  **Yes, at its edges—but it’s still useful.**  
  - **The Boundary Problem**: If "affected" includes *any* ripple effect, the demos becomes global (e.g., Dutch tulip farmers hit by UK tariffs). This is impractical.  
  - **Solutions within AAI**:  
    - **Thresholds**: Include only those *directly* affected (residency, rights alteration).  
    - **Proportional Influence**: Weight votes by degree of affectedness (complex, rarely implemented).  
    - **Delegation**: Affected non-residents influence decisions via their home states (e.g., EU negotiating as a bloc).  
  - **Circularity**: "Who decides who is affected?" requires a prior demos. Brexit’s franchise was set by the UK Parliament (the *status quo* demos), exposing AAI’s democratic paradox.

  **Brexit shows AAI is best as a *critical tool*, not a mechanical solution.** It:
  1. Exposes moral flaws in exclusion (e.g., EU nationals).  
  2. Forces justification of boundaries (e.g., "Why 15 years?").  
  3. Reveals trade-offs: National self-determination vs. transnational rights.  

  ---

  ### Conclusion: What Brexit Reveals About AAI
  1. **Strengths**:  
     - Diagnoses injustices in the status quo (e.g., disenfranchising resident EU nationals).  
     - Validates inclusion of groups with intense stakes (Gibraltar, youth).  
  2. **Weaknesses**:  
     - Cannot resolve "degree of affectedness" objectively.  
     - Risks over-inclusiveness without pragmatic thresholds.  
     - Silent on *procedural* questions like voting age.  
  3. **Practical Reality**: Democracies default to **citizenship/residency** as proxies for affectedness because they’re clear, but Brexit proves these proxies often fail (e.g., non-citizen residents more affected than expat citizens).  

  **Final Takeaway**: The Brexit franchise was *internally consistent* with UK election rules but *ethically deficient* under AAI. AAI doesn’t "solve" boundary issues but makes exclusion harder to justify—especially for those whose lives were upended without a voice. Your friend’s core grievance (EU nationals excluded, detached retirees included) is precisely where AAI lands its sharpest critique. Yet, without thresholds, AAI alone can’t design a perfect franchise. It needs supplementation (e.g., "vulnerability" criteria, residency requirements) to function in real-world decisions.
