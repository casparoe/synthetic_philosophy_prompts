prompt: |-
  I lead the content policy team at a mid-sized social media platform. We maintain a set of written policies — "no harassment," "no hate speech," "no incitement to violence," and about a dozen others — and a growing internal database of precedent decisions: specific posts that were flagged, reviewed, and either removed or left up, each with a short justification. When a new post is flagged, our moderators are supposed to compare it to the closest precedents and decide accordingly. The idea is that consistency with past decisions makes our enforcement fair and defensible.

  The problem I keep running into is that no matter how many precedents we accumulate, there are always new cases that fit all the existing precedents equally well under two different interpretations of the policy. A moderator will say "this is clearly harassment — look at cases A, B, and C," and another will say "this is clearly not harassment — it's consistent with the principle that actually explains A, B, and C, which is narrower than what you're assuming." And both readings are perfectly compatible with every past decision we've made. The precedents don't settle which interpretation is correct, because any finite set of past decisions is consistent with multiple ways of projecting the rule forward — ways that agree on everything we've seen so far but diverge on the new case. I have come to think this is not a temporary gap we can close by accumulating more precedents; it is a structural feature of rule-following.

  I need a decision procedure my team can follow when this happens. The procedure should do three things. First, it should determine whether a new case is genuinely underdetermined by precedent or whether one side is simply misreading the existing decisions — because sometimes the disagreement is real but sometimes it isn't, and we need a filter. Second, when the case is genuinely underdetermined, the procedure should provide a structured way to resolve it that does not reduce to "the most senior person in the room picks," because that erodes consistency and morale. Third, it should flag which resolutions would create inconsistency with our other policies or with the platform's stated values, so we don't solve one problem by creating another. The procedure must be usable by moderators with no background in philosophy or legal theory, and it must produce a decision within about fifteen minutes per case, since we handle hundreds of escalations a day.

  Please write this procedure, and then apply it to three worked examples: (a) a post that uses coded language to mock a protected group, where some precedents say coded mockery counts as hate speech and others say it does not if no specific slur is used; (b) a post that names a public figure and says "someone should do something about this person," where the disagreement is whether this crosses the line into incitement; and (c) a case where the procedure itself forces a resolution the team dislikes — that is, where following the procedure step by step yields an answer that feels wrong to everyone involved, and you need to explain why the procedure is still doing its job.
reasoning: |-
  We are designing a decision procedure for content moderation when precedents underdetermine the outcome. The procedure has three main parts:
   1. Determine if the case is genuinely underdetermined.
   2. If underdetermined, use a structured resolution method (not seniority-based).
   3. Flag potential inconsistencies with other policies or platform values.

   We'll break the procedure into steps, keeping it usable by moderators without specialized training and within 15 minutes.

   Procedure: Resolving Underdetermined Cases (RUC)

   Step 1: Check for Genuine Underdetermination
     - Moderators in disagreement must each list the 3-5 most relevant precedents that support their interpretation.
     - For each precedent, note: 
          (a) The specific policy applied (e.g., "no hate speech")
          (b) The key similarity to the current case
          (c) The key difference (if any) that the opposing side might point out
     - Compare the two sets of precedents. The case is underdetermined only if:
          (i) Both interpretations are consistent with all listed precedents (i.e., no precedent is being misread in a way that clearly contradicts the interpretation).
          (ii) There is no precedent that directly addresses the distinguishing feature of the current case (e.g., a new type of coded language, a new context for a vague threat).

     If one side can point to a precedent that the other side cannot reconcile without altering their interpretation (i.e., the other side's interpretation would have decided that precedent differently), then that interpretation is invalid and the case is not underdetermined. Otherwise, proceed to Step 2.

   Step 2: Structured Resolution of Underdetermined Case
     We use a "Policy Purpose and Platform Values" (PPPV) framework:

     2a. Identify the core purpose of the policy in question (e.g., for "no harassment": to protect users from targeted abuse that would make them feel unsafe). This should be based on the written policy's rationale.

     2b. Consider the platform's stated values (e.g., "freedom of expression but not at the expense of safety", "inclusivity", etc.). These are usually in the platform's mission or values statement.

     2c. Evaluate the two interpretations (remove or leave up) against:
          (i) Which interpretation best serves the core purpose of the policy?
          (ii) Which interpretation best aligns with the platform's overall values?
          (iii) Which interpretation is least likely to conflict with other policies? (e.g., an interpretation that is too broad might conflict with freedom of expression; too narrow might conflict with safety.)

     2d. Assign a score from 1 (low) to 3 (high) for each of the three criteria (purpose, values, consistency) to each interpretation. Then sum the scores.

     2e. The interpretation with the higher total score wins. If tied, then the interpretation that is more consistent with the majority of past decisions (by count of precedents) wins. If still tied, the interpretation that is more protective of vulnerable groups (as defined by the platform's policy on protected groups) wins. [This breaks the tie without resorting to seniority.]

   Step 3: Check for Inconsistencies
     - Before finalizing, consider: Would adopting this resolution for the current case create a conflict with another policy? For example, removing a post under a broad interpretation of harassment might conflict with the policy on allowing criticism of public figures.
     - Also, check against platform values: Would the resolution lead to an outcome that contradicts a stated value? (e.g., removing a post that is critical but not abusive might contradict the value of open discourse.)
     - If a conflict is found, note it and reconsider the interpretation in light of the conflict. The team may adjust the interpretation to avoid the inconsistency, but must do so within the PPPV framework (step 2). If adjustment is needed, re-score.

   Step 4: Document the Decision
     - Record the decision and the reasoning, including:
          - The precedents considered and why they were underdetermined.
          - The scores from the PPPV evaluation.
          - Any inconsistency flagged and how it was resolved.
     - This becomes a new precedent.

   Now, we apply RUC to the examples.

   Example (a): Coded Mockery
     - Post: Uses coded language to mock a protected group (e.g., "birds of a feather flock together" to imply a negative stereotype about a racial group). No specific slur.

     Step 1: 
          Pro-removal moderator cites Precedent A (removed): used "certain people are not our kind" to refer to an ethnic group -> hate speech.
          Pro-removal cites Precedent B (removed): used a known dog whistle (e.g., "13/50") to reference a racist statistic.

          Pro-leave moderator cites Precedent C (left up): used "urban youth" in a negative context but not removed because it's not a recognized code and could be interpreted as non-hateful.
          Pro-leave cites Precedent D (left up): used "those people" without additional context, not removed because too vague.

          Check: 
            The pro-leave interpretation must reconcile Precedent A and B. They might say: "In A and B, the codes were well-documented and widely recognized as hate symbols, whereas in the current case the phrase is not widely recognized and might be innocent." 
            The pro-removal interpretation must reconcile Precedent C and D. They might say: "In C, the term 'urban youth' is not a widely recognized hate code, and in D, there was no context indicating hate, but in the current case the context (e.g., accompanying negative stereotypes) makes it clear."

          Since both sides can reconcile the others' precedents by distinguishing on the basis of how widely recognized the code is and the context, and there is no precedent that directly addresses this exact phrase, the case is underdetermined.

     Step 2:
          Policy: No hate speech. Purpose: To prevent content that attacks or degrades a group based on protected characteristics, creating a hostile environment.

          Platform values: Safety and inclusivity, but also freedom of expression.

          Interpretations:
            Remove: because coded language can be just as harmful as explicit slurs when understood by the targeted group.
            Leave up: because without a clear and widely recognized hate symbol, we risk over-removal and chilling legitimate speech.

          Score (Remove):
            Purpose: 3 (directly serves by protecting against covert hate)
            Values: 2 (strong on safety, but might be seen as limiting expression)
            Consistency: 2 (might conflict with freedom of expression policy if applied too broadly, but aligns with hate speech policy)

            Total: 7

          Score (Leave up):
            Purpose: 1 (fails to protect if the code is indeed hateful and understood by the community)
            Values: 3 (strong on freedom of expression)
            Consistency: 2 (consistent with our approach to vague statements, but might conflict with inclusivity value)

            Total: 6

          Remove wins (7>6).

          Step 3: Check for inconsistencies. 
            Potential conflict: Freedom of expression policy. But the platform values safety as a higher priority when there is clear harm. Since the coded language is being used in a mocking way and targeted at a protected group, removal is more consistent with the balance the platform strikes.

          Decision: Remove.

   Example (b): "Someone should do something about this person"
     - Post: Names a public figure and says "someone should do something about this person." 

     Step 1:
          Pro-removal (incitement): Cites Precedent X (removed): "Someone ought to take care of that traitor." -> removed because "take care of" implies violence.
          Pro-removal cites Precedent Y (removed): "This corrupt official needs to be dealt with." and in context, it was followed by violent comments -> removed.

          Pro-leave: Cites Precedent Z (left up): "We must do something about the mayor's policies." -> left up because it called for political action, not violence.
          Pro-leave cites Precedent W (left up): "Someone should stop him." in the context of legal means -> left up.

          Check:
            Pro-leave must reconcile X and Y: "In X, the phrase 'take care of' is a known euphemism for violence, and in Y, the context made it violent. In the current case, the phrase is more ambiguous and lacks context of violence."
            Pro-removal must reconcile Z and W: "In Z and W, the context clearly indicated non-violent means (e.g., 'policies' in Z and the surrounding discussion in W about elections). In the current case, there is no such context."

          Since both can reconcile by pointing to context and known violent euphemisms, and the current case lacks clear context, it's underdetermined.

     Step 2:
          Policy: No incitement to violence. Purpose: To prevent content that is likely to provoke imminent lawless action or that directly threatens violence.

          Platform values: Safety and preventing harm, but also allowing public discourse about public figures.

          Interpretations:
            Remove: because "do something" could be interpreted as a call to violence, especially if the public figure is controversial and there's a history of threats.
            Leave up: because without an explicit call to violence or a clear violent context, it's protected political speech.

          Score (Remove):
            Purpose: 2 (might prevent violence if the statement is taken as a call to violence, but also might be overbroad because the statement is vague)
            Values: 1 (safety is served, but at the cost of suppressing political speech, which is a core value)
            Consistency: 1 (might conflict with the policy allowing criticism of public figures)

            Total: 4

          Score (Leave up):
            Purpose: 2 (does not clearly serve the purpose because it might allow a veiled incitement, but the vagueness means it doesn't clearly meet the threshold for incitement)
            Values: 3 (upholds freedom of expression and public discourse)
            Consistency: 3 (consistent with our approach to ambiguous statements about public figures)

            Total: 8

          Leave up wins (8>4).

          Step 3: Check for inconsistencies. 
            Potential conflict: If we leave up, does it conflict with our incitement policy? Not necessarily, because the policy requires a direct call or clear context. We are consistent with past decisions on vague statements. However, we must monitor if this leads to an increase in threats.

          Decision: Leave up, but flag for monitoring if similar posts escalate.

   Example (c): Procedure Forces an Unpopular Resolution
     Let's create a hypothetical case that fits the description.

     Case: A post by a user in a country under authoritarian rule, criticizing the government with a metaphor that is common in that country but could be interpreted as advocating for regime change. The platform has a policy against "incitement to violent overthrow of government." 

     Precedents:
        Precedent P (removed): A post that explicitly said "we must rise up and remove the dictator by force" -> removed.
        Precedent Q (left up): A post that said "the government is like a rotten tree; it will fall when the wind blows hard enough" -> left up as metaphorical and not a call to violence.

     Current post: "The lion will awaken and the hunter will be the hunted." (This is a known metaphor in the country meaning the people will overthrow the ruler.)

     Step 1:
          Pro-removal: This is like P because it's a call for overthrow. But P was explicit and this is metaphorical. 
          Pro-removal might also argue that in the context of the country, this metaphor is widely understood as a call to violent revolution.

          Pro-leave: This is like Q because it's metaphorical.

          Check:
            Pro-leave must reconcile P: P was explicit and direct, while the current post is metaphorical and therefore more like Q.
            Pro-removal must reconcile Q: Q was left up because it was a common metaphor and not necessarily violent, but in the current case, the metaphor is known to be associated with violent revolution in that specific country.

          If the team has no precedent on this specific metaphor, and both interpretations are consistent with the existing precedents (by distinguishing on the basis of explicitness vs. metaphor, and cultural context), then it's underdetermined.

     Step 2:
          Policy: No incitement to violent overthrow of government. Purpose: To prevent content that could lead to violent uprising, especially in volatile regions, to protect people from harm and the platform from being used to fuel violence.

          Platform values: Support for democratic values and freedom of expression, but also safety and non-violence.

          Interpretations:
            Remove: because in this specific cultural context, the metaphor is a direct call for violent overthrow and could incite violence.
            Leave up: because it is protected political speech and the metaphor is not explicit.

          Score (Remove):
            Purpose: 3 (directly serves by preventing potential incitement in a volatile context)
            Values: 1 (suppresses political speech, which is against our value of free expression, especially for oppressed people)
            Consistency: 2 (consistent with P, but might be inconsistent with Q? However, we can distinguish Q as a different cultural context or a less charged metaphor)

            Total: 6

          Score (Leave up):
            Purpose: 1 (fails to prevent incitement if the metaphor is indeed a call to violence in that context, and violence occurs)
            Values: 3 (strong on freedom of expression and supporting dissent against authoritarian regimes)
            Consistency: 2 (consistent with Q, but might be inconsistent with P? We can distinguish P as being explicit)

            Total: 6

          Tie. Next, count of precedents: Both interpretations have one precedent (P for removal, Q for leave up). Then, we use the tie-breaker: which is more protective of vulnerable groups? The vulnerable group here is the population under the authoritarian regime. Removing might protect them from violent crackdowns if the post incites violence. Leaving up might protect their right to resist oppression. 

          The platform's policy on protected groups typically focuses on characteristics (race, religion, etc.) but in this context, the entire population is vulnerable to state violence. We must consider the potential harm from both removal (silencing dissent) and leaving up (inciting violence that leads to crackdowns). 

          Given the policy's purpose is to prevent violence, and the potential for harm from violent uprising (which often leads to state violence against civilians) is high, we might choose removal to protect the vulnerable population.

          So, remove wins.

     The team might dislike this because they want to support the dissident. However, the procedure does its job by:
          - Objectively applying the policy purpose (preventing violence) and platform values (which in this case are in tension, but the tie-breaker rule was applied).
          - The procedure ensures that the decision is not arbitrary and is based on a structured analysis.

     Why it's still doing its job: The procedure is designed to produce consistent and defensible decisions, not necessarily popular ones. It forces the team to confront the trade-offs (safety vs. free expression) and make a decision aligned with the policy's intent and the platform's values, even when the outcome is difficult.

     Step 3: Check for inconsistencies. 
          Removing the post might conflict with the platform's value of supporting free expression and dissent. However, the policy against incitement to violent overthrow takes precedence in this case because of the potential for imminent harm. We note the conflict and the reason for overriding.

     Decision: Remove, with a note that the cultural context made the metaphor a clear call to violence.

   Conclusion: The RUC procedure provides a structured, transparent, and efficient way to resolve underdetermined cases while maintaining consistency and alignment with platform values. It also includes safeguards against creating new inconsistencies.
answer: |-
  ### Decision Procedure: Resolving Underdetermined Cases (RUC)  
  **Goal:** Resolve cases where precedents equally support conflicting interpretations, while ensuring fairness, consistency, and alignment with platform values.  
  **Time Limit:** 15 minutes per case.  
  **Participants:** Moderators, a facilitator (rotates weekly), and a scribe.  

  ---

  #### **Step 1: Test for Genuine Underdetermination**  
  *(Filter out cases where one side misreads precedent)*  
  1. **Identify Key Precedents:**  
     - Each moderator lists 1–3 precedents supporting their interpretation.  
     - For each precedent, summarize:  
       - *Fact pattern* (e.g., "coded phrase X targeting Group Y").  
       - *Outcome* (removed/left up).  
       - *Justification* (e.g., "no explicit slur used").  

  2. **Cross-Check Compatibility:**  
     - For each precedent, ask:  
       - "Could this precedent logically support the *opposing* interpretation if re-examined?"  
       - If **all precedents** can be plausibly reconciled with both interpretations → **Underdetermined**.  
       - If one side cannot reconcile a precedent without contradicting its outcome → **Not underdetermined** (escalate to policy lead for training).  

  3. **Threshold:** Proceed to Step 2 only if both interpretations survive cross-check.  

  ---

  #### **Step 2: Structured Resolution (PPV Framework)**  
  *(Policy-Purpose-Values scoring, no seniority bias)*  
  1. **Clarify Core Elements:**  
     - Define the policy’s *primary purpose* (e.g., "no harassment" = prevent targeted intimidation).  
     - State the *new case’s key ambiguity* (e.g., "Is coded mockery equivalent to a slur?").  

  2. **Score Interpretations (1–3 points per category):**  
     - **Policy Purpose (PP):** Which interpretation best fulfills the policy’s core goal?  
       - *3*: Directly advances the purpose. *1*: Weak alignment.  
     - **Platform Values (PV):** Which interpretation better aligns with **two** key platform values (e.g., "safety" and "free expression")?  
       - *3*: Strong alignment with both. *1*: Conflicts with one/both.  
     - **External Consistency (EC):** Which interpretation avoids conflicts with **other policies**?  
       - *3*: Harmonizes with all linked policies. *1*: Creates tension (e.g., clashes with "allow criticism of public figures").  

  3. **Tally & Decide:**  
     - Sum scores (PP + PV + EC). Highest total wins.  
     - **Tiebreak Order:**  
       - (a) Favor the interpretation with more *precedents by count*.  
       - (b) Favor the interpretation that *protects vulnerable groups* (per platform’s equity guidelines).  
       - (c) Random draw (e.g., coin flip documented in log).  

  ---

  #### **Step 3: Inconsistency Flag**  
  *(Prevent collateral damage)*  
  - **Check:** Would the winning interpretation:  
    - Contradict another policy? (e.g., banning satire under "no harassment" might violate "allow humor").  
    - Violate a core platform value? (e.g., "inclusivity" or "transparency").  
  - **If flagged:** Reopen scoring in Step 2 with the inconsistency as a constraint. Adjust scores if the conflict is material.  

  ---

  #### **Documentation**  
  - Scribe records:  
    - Precedents tested in Step 1.  
    - PPV scores and tiebreak rationale.  
    - Inconsistency flags and resolutions.  
  - **Output:** New precedent added to the database with the justification.  

  ---

  ### Worked Examples  
  #### **Example (a): Coded Mockery of Protected Group**  
  - **Post:** "Group X always forgets to clean their nests. Birds of a feather, I suppose!" (Historically used to stereotype Group X).  
  - **Conflict:** Precedents split—some remove coded language as hate speech; others leave up if no slur is used.  

  **Step 1: Test Underdetermination**  
  - *Pro-Removal Precedent:* Removed post calling Group Y "garden pests" (justification: "dehumanizing metaphor").  
  - *Pro-Leave Precedent:* Left up post calling Group Z "neat freaks" (justification: "no protected-group slur").  
  - **Verification:** Both precedents can support either interpretation (e.g., "garden pests" could be seen as non-slur mockery; "neat freaks" could be seen as dehumanizing). → **Underdetermined**.  

  **Step 2: PPV Scoring**  
  - *Policy:* "No hate speech." *Purpose:* Protect groups from degradation.  
  - *Interpretations:*  
    - **Remove:** Coded mockery is hate speech.  
      - PP: 3 (stops covert degradation).  
      - PV: 2 (aligns with "safety"; partially conflicts with "free expression").  
      - EC: 2 (consistent with harassment policy; risks overlap with "allow cultural commentary").  
      - **Total: 7**  
    - **Leave Up:** Only explicit slurs qualify.  
      - PP: 1 (fails to address insidious bias).  
      - PV: 3 (aligns with "free expression").  
      - EC: 3 (avoids conflict with "allow humor/satire").  
      - **Total: 7**  
  - **Tiebreak:**  
    - (a) Precedent count: 50% split (no winner).  
    - (b) Protect vulnerable groups: Removal better shields Group X. → **Remove**.  

  **Step 3: Inconsistency Flag**  
  - Check: Removal aligns with "no harassment" policy and "inclusivity" value. No conflict. → **Safe**.  

  **Outcome:** Remove post.  

  ---

  #### **Example (b): "Someone Should Do Something About This Person"**  
  - **Post:** "Mayor Jane Doe is corrupt. Someone should do something about this person."  
  - **Conflict:** Precedents split on whether vague calls for action constitute incitement.  

  **Step 1: Test Underdetermination**  
  - *Pro-Removal Precedent:* Removed post saying "Someone should teach Politician X a lesson" (justification: "implies violence in context").  
  - *Pro-Leave Precedent:* Left up post saying "Someone should hold CEO Y accountable" (justification: "calls for legal action").  
  - **Verification:** Both interpretations work (e.g., "teach a lesson" could mean legal action; "hold accountable" could imply vigilante justice). → **Underdetermined**.  

  **Step 2: PPV Scoring**  
  - *Policy:* "No incitement to violence." *Purpose:* Prevent real-world harm.  
  - *Interpretations:*  
    - **Remove:** Vague calls risk inciting violence.  
      - PP: 2 (precautionary but speculative).  
      - PV: 1 (prioritizes "safety" but heavily conflicts with "free expression").  
      - EC: 1 (conflicts with "allow criticism of public figures").  
      - **Total: 4**  
    - **Leave Up:* Only explicit threats qualify.  
      - PP: 3 (avoids overreach; focuses on clear threats).  
      - PV: 3 (aligns with "free expression" and "public discourse").  
      - EC: 3 (consistent with "allow criticism" policy).  
      - **Total: 9**  

  **Step 3: Inconsistency Flag**  
  - Check: Leaving up aligns with policies and values. No conflict. → **Safe**.  

  **Outcome:** Leave up.  

  ---

  #### **Example (c): Procedure Forces Unpopular Outcome**  
  - **Post:** A satirical cartoon depicting a religious figure in a humorous but non-explicitly offensive scenario.  
  - **Conflict:** Precedents split—some remove religious satire as "hate speech"; others leave up as "protected humor."  
  - **Team Preference:** Leave up (strong support for satire).  

  **Step 1: Test Underdetermination**  
  - *Pro-Removal Precedent:* Removed comic mocking Religious Figure A (justification: "mocks sacred beliefs").  
  - *Pro-Leave Precedent:* Left up comic mocking Religious Figure B (justification: "no violent/degrading imagery").  
  - **Verification:** Both precedents compatible with either reading. → **Underdetermined**.  

  **Step 2: PPV Scoring**  
  - *Policy:* "No hate speech." *Purpose:* Prevent group-based harm.  
  - *Interpretations:*  
    - **Remove:** Religious satire risks inciting hatred.  
      - PP: 3 (prevents potential offense).  
      - PV: 1 (aligns with "respect" but conflicts with "free expression").  
      - EC: 2 (consistent with "no religious hostility"; conflicts with "allow satire").  
      - **Total: 6**  
    - **Leave Up:* Satire is protected speech.  
      - PP: 2 (neutral on harm prevention).  
      - PV: 3 (aligns with "free expression" and "artistic freedom").  
      - EC: 1 (risks conflict with "no religious hostility").  
      - **Total: 6**  
  - **Tiebreak:**  
    - (a) Precedent count: 60% leave-up precedents. → **Leave Up**.  
    - *(Team dislikes this—they worry about offending a minority group.)*  

  **Step 3: Inconsistency Flag**  
  - Check: Leaving up flagged for conflicting with "inclusivity" (could alienate religious users).  
  - **Re-score with Constraint:**  
    - Leave Up: EC score drops to *1* (now conflicts with inclusivity). → **New Total: 5**.  
    - Remove: EC score unchanged (*2*). → **New Total: 6**.  
  - **Outcome: Remove**.  

  **Why the Procedure Worked:**  
  - The unpopular outcome (remove) emerged because:  
    1. The tiebreak favored precedent count (leave-up), but the inconsistency flag revealed a hidden conflict.  
    2. Re-scoring prioritized policy harmony over moderator preference.  
  - **Key Insight:** The procedure exposed a tension between "free expression" and "inclusivity" the team overlooked. By forcing alignment with *all* platform values, it prevented a decision that could erode trust in marginalized communities. The discomfort signals growth, not failure.  

  ### Final Notes  
  - **Efficiency:** Steps 1–3 fit within 15 minutes with practice (use timers).  
  - **Training:** Role-play ambiguous cases monthly to build moderator fluency.  
  - **Evolution:** Quarterly reviews of RUC outcomes refine precedents and policies.  

  This procedure transforms ambiguity into structured, values-driven decisions—ensuring fairness without sacrificing speed or consistency.
