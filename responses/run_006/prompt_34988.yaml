  We are constructing a thought experiment that uses standard physics (special relativity) to make the Rietdijk–Putnam argument as strong as possible. The goal is to isolate the step from the relativity of simultaneity to the block universe (eternalism) without building in metaphysical assumptions. We have two inertial observers in relative motion and one pair of spacelike-separated events. We must avoid superluminal signals and not stipulate the block universe conclusion.

  Scenario:
  Consider two inertial observers, Alice and Bob. They are in relative motion along the x-axis. Alice is at rest in frame S, and Bob is moving with constant velocity v in the positive x-direction relative to Alice. We set up two events, E1 and E2, that are spacelike separated. Specifically, let E1 be the event where Alice is located at her origin (x=0, t=0 in S) and she sends a light signal. However, to have two spacelike events, we need to choose events that cannot be connected by light or any causal signal. So let:

  - Event E1: At (x=0, t=0) in Alice's frame S. This is the event where Alice is at her origin at time zero.
  - Event E2: At (x=L, t=0) in Alice's frame S. This is the event where, at the same time as E1 according to Alice, a light bulb located at x=L (with L>0) turns on.

  Note that the spatial separation is L and the time separation is 0 in Alice's frame. The spacetime interval between E1 and E2 is: s² = (cΔt)² - (Δx)² = 0 - L² = -L² < 0, so they are spacelike separated.

  Bob is moving with velocity v relative to Alice, so we can use the Lorentz transformation to find the coordinates in Bob's frame (S'):

    t' = γ(t - (vx/c²))
    x' = γ(x - vt)

  where γ = 1/√(1 - v²/c²).

  For E1 (x=0, t=0) in S:
    t1' = γ(0 - (v*0)/c²) = 0
    x1' = γ(0 - v*0) = 0

  For E2 (x=L, t=0) in S:
    t2' = γ(0 - (vL)/c²) = -γ(vL/c²)
    x2' = γ(L - v*0) = γL

  So in Bob's frame, E1 is at (x'=0, t'=0) and E2 is at (x'=γL, t'=-γvL/c²). The time of E2 in Bob's frame is negative (if we take v>0 and L>0), meaning it occurs before E1 in Bob's frame.

  Now we have:

  1. In Alice's frame (S): E1 and E2 are simultaneous (both at t=0). So for Alice, both events are present.
  2. In Bob's frame (S'): E2 occurs at time t'=-γvL/c² (which is negative) and E1 at t'=0. So in Bob's frame, E2 is in the past relative to E1.

  Step 1: Show using only the standard relativity of simultaneity that the two observers disagree about the temporal status of the two events, and state precisely what each observer is entitled to say.

  - Alice, in her frame, says: E1 and E2 are simultaneous. Therefore, both events are present (if we adopt the idea that what is present at a moment is what is simultaneous with that moment). So at the moment when Alice is at her origin (t=0 in S), she says that E1 (her being at the origin) and E2 (the light bulb turning on at x=L) are both happening now.

  - Bob, in his frame, says: At his time t'=0 (which corresponds to the event E1 in his frame, which is at x'=0, t'=0), the event E2 has already happened because in his frame, E2 occurred at t'=-γvL/c² < 0. So for Bob, at the moment when he is at his origin (which is at the same spacetime event as E1, but note that Bob is moving, so at t'=0 Bob is at x'=0 and that is the same event as E1), the event E2 is in the past.

  Therefore, they disagree about the temporal status of E2 relative to E1. Specifically, relative to the event E1 (which both agree on as the meeting point of their origins at t=0 in S and t'=0 in S'):

    - Alice says E2 is present.
    - Bob says E2 is past.

  Step 2: Lay out the Rietdijk–Putnam inference and the extra premise.

  The Rietdijk–Putnam argument runs as follows:

  1. According to Alice, at the time of E1 (which is present for her), E2 is also present (simultaneous with E1). Therefore, if we take Alice's perspective, E2 is real (exists) at the same time as E1.

  2. According to Bob, at the time of E1 (which is present for him), E2 is already in the past. Therefore, from Bob's perspective, E2 is real (because past events are real) and it has already happened.

  3. But E2 is the same event. So if we take both perspectives seriously, then E2 must be real at the time of E1 (because for Alice it is present) and also real at the time of E1 because for Bob it is past (and if past events are real, then it is real). However, the key move is that if we require an objective reality (i.e., that the reality of events should not depend on the frame), then we must say that E2 is real at the time of E1.

  4. This then forces us to say that the reality of E2 is independent of the time at which we are considering it. Hence, the future and the past must be equally real as the present. This leads to the block universe.

  The extra premise that must be added to the physics is a principle of the objectivity of reality. Specifically, the argument relies on the idea that if an event is real from one perspective (or at one time), then it must be real from every perspective (or at every time). This is a metaphysical assumption about the nature of reality and time.

  Step 3: Which feature of the case is doing the metaphysical work and what if weakened?

  The key feature is the disagreement about the temporal status of the same event (E2) relative to a fixed event (E1) and the requirement that reality must be frame-independent. The metaphysical work is done by the assumption that the reality of events must be absolute, not relative to a frame.

  If we weaken this feature by denying that reality must be absolute and instead allow that the reality of events is frame-relative (or perspectival), then the argument fails. For example, a presentist might say that what is real is only what is present, but what is present is relative to the frame. So for Alice, E2 is real at the same time as E1, but for Bob, at his present (which is a different set of events) E2 is not present and hence not real. However, note that at the event E1, Bob is present and at that same event, Alice is also present. But they are assigning different times to E2. The presentist must then say that the reality of E2 is relative to the frame. But this is a radical form of relativism that many find unattractive.

  Alternatively, if we remove the requirement of an absolute reality, then we are not forced to eternalism.

  Step 4: The strongest presentist reply.

  A presentist should reject the extra premise that the reality of events must be absolute. They can argue that reality is perspective-dependent. Specifically, at the event E1 (which is the same spacetime point for both), the presentist can say that the reality of events is determined by the frame of the observer at that event. But note that at E1, there are two observers (Alice and Bob) at the same event. The presentist must then say that at that event, what is real for Alice is what is simultaneous with E1 in her frame (so events on the hypersurface t=0 in S) and what is real for Bob is what is simultaneous with E1 in his frame (so events on the hypersurface t'=0 in S'). These are different sets. Therefore, E2 is real for Alice at E1 (because it is on her present) but not real for Bob at E1 (because in Bob's frame, at t'=0, E2 is in the past and hence not present? But note: in Bob's frame, at t'=0, the present is the set of events with t'=0, and E2 has t'=-γvL/c² ≠ 0, so it is not present. However, if Bob's presentism only includes the present, then E2 is not real for Bob at E1. But then we have a contradiction: at the same event (E1), E2 is real (for Alice) and not real (for Bob). This seems to violate the idea that reality is objective.

  To avoid this, the presentist might adopt a different strategy: they might argue that reality is relative to an observer and not to a frame. So at the event E1, Alice and Bob are both present. But what is real for Alice is her present (which includes E2) and what is real for Bob is his present (which does not include E2). However, this leads to a situation where two observers at the same event disagree about the reality of E2. The presentist might bite the bullet and accept that reality is observer-relative. But this is a significant cost.

  Alternatively, the presentist might argue that the relativity of simultaneity only shows that simultaneity is relative, but it does not force us to accept that events in the past or future are real. The presentist can maintain that only the present is real, and the present is the set of events that are simultaneous with the here-now. But which set? The presentist might say that there is no privileged frame, so each observer has their own present. However, then we have multiple equally valid presents. This leads to a kind of fragmentation of reality.

  The strongest presentist reply is to deny that the reality of events must be absolute and to accept a form of relativism about reality. They would say that the argument overreaches by assuming that if an event is real from one perspective, it must be real from all. The presentist can simply deny that and say that reality is perspective-relative.

  To block this reply, the case would have to include a situation where the same event is assigned different reality statuses by two observers at the same spacetime event. But that is exactly what we have: at E1, Alice and Bob are co-located. For Alice, E2 is present and hence real; for Bob, E2 is past and (if presentism holds) hence not real. So the presentist must accept that at the same event, two observers have different realities. This seems contradictory. Therefore, to avoid the contradiction, the presentist must either:

    (a) deny that both perspectives are equally valid at the same event, or
    (b) provide a non-standard account of what is real at a given event that reconciles the two.

  One way out for the presentist is to say that reality is determined by the frame of the observer, but then at the same event, two different frames are present. The presentist might then say that there is no fact of the matter about what is real at that event. This is a radical move.

  Alternatively, the presentist might argue that the simultaneity relation is not constitutive of reality. They might propose a different criterion for reality that is not frame-dependent. But in special relativity, without a privileged frame, it is hard to see what that could be.

  In summary:

  - The physics (relativity of simultaneity) is uncontested: two events simultaneous in one frame are not in another.
  - The contested step is the inference from the relativity of simultaneity to the conclusion that past, present, and future events are equally real (eternalism). This requires the additional premise that the reality of events must be absolute (not frame-dependent).

  The presentist can block the argument by denying the extra premise and accepting that reality is frame-dependent, but this comes at the cost of having a fragmented reality that may be hard to reconcile with common intuitions about objectivity.
answer: |-
  ### Thought Experiment: The Spacelike Bulb

  **Scenario Setup**:  
  Consider two inertial observers, Alice and Bob, in relative motion along the x-axis. Alice is at rest in frame \( S \), with coordinates \((x, t)\). Bob moves at constant velocity \( v \) (where \( 0 < v < c \)) relative to Alice, in frame \( S' \), with coordinates \((x', t')\). We define two spacelike-separated events:  
  - **Event E1**: At \( (x=0, t=0) \) in \( S \) (Alice's origin at her time zero).  
  - **Event E2**: At \( (x=L, t=0) \) in \( S \), where \( L > 0 \) is arbitrary (e.g., a light bulb turns on at \( x=L \) at Alice's \( t=0 \)).  

  The spacetime interval is \( \Delta s^2 = -c^2(\Delta t)^2 + (\Delta x)^2 = L^2 > 0 \) (using the \( (-, +, +, +) \) signature), confirming spacelike separation. No signals connect E1 and E2, preserving causality. Physics is standard: Lorentz transformations govern frame changes, with no superluminal signals or metaphysical assumptions.  

  ---

  ### Step 1: Relativity of Simultaneity and Temporal Status  
  Using Lorentz transformations:  
  - **Alice (frame \( S \))**: E1 and E2 both occur at \( t=0 \). Thus, Alice judges them **simultaneous**. At the moment she experiences E1 (her "now"), she is entitled to say:  
    > "E1 and E2 are both present. They are equally real for me *now*."  

  - **Bob (frame \( S' \))**: Transform E1 and E2 to \( S' \):  
    - E1: \( x=0, t=0 \) → \( x'=0, t'=0 \) (by definition).  
    - E2: \( x=L, t=0 \) → \( t' = \gamma \left( t - \frac{vx}{c^2} \right) = \gamma \left( 0 - \frac{vL}{c^2} \right) = -\gamma \frac{vL}{c^2} \).  
    Since \( v > 0 \) and \( L > 0 \), \( t' < 0 \). Thus, E2 occurs at \( t' = -\gamma \frac{vL}{c^2} \) in \( S' \), while E1 is at \( t'=0 \). Bob judges E2 to be in the past relative to E1. At the moment he experiences E1 (his "now"), he is entitled to say:  
    > "E1 is present, but E2 is past. E2 is fixed and real for me *now* (as a past event), but it is not part of my present."  

  **Disagreement**: Alice says E2 is present (simultaneous with E1); Bob says E2 is past (not simultaneous with E1). The **temporal status** of E2 relative to E1 is frame-dependent.  

  ---

  ### Step 2: Rietdijk–Putnam Inference and Extra Premise  
  The Rietdijk–Putnam argument proceeds as follows:  
  1. **Physics-based premise (settled)**: Relativity of simultaneity implies that E2 is present for Alice but past for Bob at E1.  
  2. **Inference to eternalism**:  
     - If E2 is real for Alice at E1 (since it is present for her), and E2 is real for Bob at E1 (since it is past for him, and past events are real), then E2 must be real *simpliciter* at E1.  
     - But E1 is arbitrary—any "now" moment could play this role. Thus, all events (past, present, future) must be equally real at all times, forming a four-dimensional "block universe."  

  **Extra premise required**: The inference relies on adding a **metaphysical principle of non-perspectival reality**:  
  > *If an event is real from any inertial perspective at a given spacetime location, it is real from all perspectives (i.e., absolutely real).*  

  Without this, the physics alone only shows frame-relative simultaneity, not eternalism. The principle bridges physics to metaphysics by demanding that reality be frame-independent.  

  ---

  ### Step 3: Metaphysical Work and Weakening  
  **Feature doing metaphysical work**: The **co-location of observers at E1** combined with **divergent reality assignments**. At the exact spacetime point E1:  
  - Alice asserts E2 is real (present).  
  - Bob asserts E2 is real (past).  
  The inference forces absoluteness: E2 *must* be real at E1, regardless of perspective, to avoid contradiction.  

  **If weakened or removed**:  
  - **Remove co-location**: Suppose Alice and Bob are not at E1. For example, let Alice be at E1 but Bob be elsewhere. Then Bob's judgments about E1/E2 are not "at the same event," and a presentist could argue their reality assessments are isolated, avoiding conflict.  
  - **Weaken absoluteness**: If reality is allowed to be perspective-dependent, the contradiction dissolves. E2 could be real for Alice at E1 but not for Bob at E1 (or vice versa), preserving presentism at the cost of relativizing existence.  

  The co-location amplifies the argument by creating a shared reference point (E1) where both observers must "confront" the same events, making frame-relative reality seem incoherent.  

  ---

  ### Step 4: Strongest Presentist Reply  
  **Where the argument overreaches**: A presentist should reject the **extra premise** (non-perspectival reality). They argue:  
  > "Relativity of simultaneity shows that *simultaneity* is frame-dependent, but not *reality*. Reality is constituted only by what is present, and 'present' is defined by a privileged perspective (e.g., the observer's rest frame). At E1, Alice’s present includes E2, so E2 is real *for her*; Bob’s present excludes E2, so E2 is not real *for him*. There is no contradiction because reality is observer-relative. The argument illicitly treats frame-dependent judgments as absolute."  

  **Blocking this reply**: To challenge presentism, the scenario would need:  
  - **Causal entanglement**: If E2 had measurable effects on both observers *at E1*. For example, suppose E2 is a particle decay that influences a detector co-located with Alice and Bob at E1. If Bob (for whom E2 is past) must acknowledge the decay's outcome at E1, then denying E2's reality would undermine causality.  
    - *Why it blocks presentism*: Presentism requires the future/past to be unreal, but causal effects from E2 at E1 would force even Bob to treat E2 as real (since causes must be real). This aligns physics with eternalism without adding metaphysics.  

  Without causal entanglement, presentism can retreat to perspectival reality. With it, the presentist must either accept eternalism or deny causality (which violates standard physics).  

  ---

  ### Summary: Settled vs. Contested  
  - **Settled (physics)**: Relativity of simultaneity is experimentally confirmed. Alice and Bob disagree on the temporal status of spacelike-separated events.  
  - **Contested (metaphysics)**: Whether this disagreement implies eternalism. The inference relies on an extra-physical premise about absolute reality, which presentists reject. The Rietdijk–Putnam argument is not consensus; it is a philosophical interpretation of relativity.
