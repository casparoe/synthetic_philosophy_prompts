  I was in a forum where someone shut down a debate about whether Darwinism is falsifiable by quoting Popper: "I have come to the conclusion that Darwinism is not a testable scientific theory, but a metaphysical research programme---a possible framework for testable scientific theories." They then used it to argue that evolutionary biology is basically unfalsifiable dogma and so intelligent design should get equal time. I know Popper also said he'd changed his mind about the testability of natural selection later, so the quote is being used in a way I find suspicious. Could you lay out the distinct precise claims that Popper's sentence could be expressing, from the boring methodological point to the sweeping "Darwinism is not science" claim? For each reading, say whether it's trivially true, substantive but defensible, or false, and say which of these readings would actually license the equal-time conclusion and which wouldn't. Also tell me what a charitable but accurate reading would make of Popper's "metaphysical research programme" and why it does more work than the quote alone suggests. I don't need a bibliography, just the conceptual map.
