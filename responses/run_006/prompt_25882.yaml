prompt: |-
  So our company is going through this big automation push — AI tools, RPA, the whole thing — and I got put on the committee that decides which roles and tasks get automated and which stay human. At first I thought it was just a cost-benefit thing, but the more I've been reading about the philosophy of work — like, what actually makes work meaningful versus just a paycheck — the more I realize we don't have any way to factor that in. Like, sure, automating data entry saves money, but if that data entry job was the only thing giving someone structure and social contact and a sense of competence, maybe we're making a mistake that looks great on a spreadsheet and terrible in people's lives.

  I want an actual decision procedure I can bring to the next committee meeting. Something step-by-step that takes a task or role we're considering automating and runs it through the philosophical criteria for meaningful work — autonomy, mastery, social connection, contribution to something beyond yourself, whatever the literature actually supports. It needs to be concrete enough that my colleagues (who have not read a page of philosophy and don't want to) can use it. It should say what questions to ask, in what order, what counts as a sufficient answer to each, and — this is crucial — where the procedure has to stop and say "a human being needs to make a judgment call here, and here's why the procedure can't make it for you."

  Then I want you to run the procedure on two cases: automating the monthly report generation that three analysts currently spend a week on (tedious but they say it gives them a deep understanding of the business), and automating the first-pass resume screening in HR (which everyone hates doing but which currently forces hiring managers to actually read what candidates write).

  And be honest: tell me where this procedure would give me an answer I'm not going to like, or where it would tell me to preserve work that seems obviously pointless from a buisness perspective. I need to know what I'd be signing up for before I walk into that meeting.
reasoning: |-
  Okay, let me unpack this user's request. They're on an automation committee facing the classic efficiency-vs-human-value dilemma, but what really stands out is their hunger for actionable philosophy - they need to translate abstract concepts like "meaningful work" into a practical tool for skeptical colleagues. 

  Hmm, the core tension here is between spreadsheet logic and human flourishing. The user's clearly done their homework on work philosophy (mentioning autonomy, mastery etc.), but what they're really asking for is an *intervention device* - something that forces the committee to confront human costs they'd otherwise ignore. 

  Breaking it down: First, they need a step-by-step filter that progressively isolates tasks where automation would strip away meaning. The procedure must be bulletproof enough for non-philosophy readers, yet flexible enough to flag "judgment call" moments. Second, they want stress-tests using real cases - the analyst reports and resume screening - to reveal where the method might clash with business orthodoxy. 

  Ah, and that last point is crucial: they're bracing for pushback. The procedure must explicitly identify "here's where it'll hurt" - like preserving tedious work that provides hidden social glue, or rejecting automation that dehumanizes but saves money. 

  For the framework itself... I'm thinking a five-stage funnel: start with pure efficiency (what the committee cares about), then layer on autonomy erosion risk, mastery destruction, social rupture, and finally purpose impact. Each stage needs kill switches - clear "STOP AUTOMATION" criteria based on research-backed thresholds. 

  The resume screening case is particularly thorny. Automating it solves real pain points (HR hates it), but the procedure would flag the loss of human judgment in first-contact evaluation as a dignity violation. That's exactly the uncomfortable answer they anticipate - preserving a disliked task for ethical reasons. 

  Biggest challenge? Making "meaning" measurable. Hence the heavy use of observable proxies ("Does task require interpreting unique human context?") and forced deliberation prompts. The judgment call flags are essentially ethical circuit breakers. 

  ...Better include that warning about "false negatives" too - sometimes automating meaningless work *frees* people for better tasks. The procedure must account for that liberation potential.
answer: |-
  Here's a concrete **Meaningful Work Automation Assessment (MWAA) Procedure** designed for committee use, incorporating philosophical criteria with actionable steps.

  **Meaningful Work Automation Assessment (MWAA) Procedure**

  **Purpose:** To evaluate proposed automation for its impact on human meaningful work dimensions beyond pure cost/benefit. Identifies tasks where automation may destroy critical sources of human value.

  **Core Dimensions Evaluated (Based on Self-Determination Theory & Positive Psychology):**
  1.  **Autonomy:** Control over how, when, or what work is done.
  2.  **Competence/Mastery:** Opportunity to develop skills, overcome challenges, see tangible results.
  3.  **Social Connection:** Human interaction, collaboration, belonging, shared purpose.
  4.  **Purpose/Contribution:** Seeing how work impacts others or a larger mission.

  **Procedure Steps:**

  1.  **Define the Target Task/Role:**
      *   *Question:* Precisely what specific task(s) or subset of role responsibilities are proposed for automation?
      *   *Output:* Clear, granular description of the automation target (e.g., "Formatting monthly sales report charts from raw data," not "Analyst job").
      *   *Stop if:* The task cannot be clearly defined separately from higher-order human judgment/interpretation. *(Judgment Call: Requires human discernment)*

  2.  **Assess Baseline Meaning Drivers (Current State):**
      *   *Method:* **Short, structured interviews (15-20 mins) with 2-3 employees currently performing the task.** Ask:
          *   "What parts of this specific task feel most satisfying or engaging? Why?"
          *   "What skills do you use or develop while doing this?"
          *   "Do you interact with others as part of doing this? How does that feel?"
          *   "How do you see this task connecting to the bigger picture of your team/company/customers?"
      *   *Sufficient Answer:* Identify *any* meaningful connection described by employees related to Autonomy, Competence, Social Connection, or Purpose **within the task itself**. (e.g., "I like making the charts look perfect" = Competence; "I chat with Sarah when she sends the data" = Social).
      *   *Stop if:* Employees consistently describe *no* positive connection to the task beyond "it pays the bills" AND the task is highly repetitive, rule-based, and error-prone. *(Proceed to Cost/Benefit)*

  3.  **Evaluate Automation Impact on Meaning Dimensions:**
      *   *Questions for the Committee (Use interview insights):*
          *   **Autonomy:** Would automation *remove* the only element of choice/control this person has in their day? (e.g., choosing layout, sequence, method).
          *   **Competence/Mastery:** Does this task provide a *foundational skill* or unique *insight* crucial for higher-value work? Would automating it create a skill/knowledge gap? (e.g., "Seeing the raw data helps me spot trends").
          *   **Social Connection:** Is this task a *necessary catalyst* for valuable human interaction or collaboration? (e.g., clarifying data points, sharing drafts).
          *   **Purpose/Contribution:** Does *doing this task manually* provide a clearer or more tangible sense of contribution than simply managing an automated output? (e.g., "I built this report" vs. "I ran the report generator").
      *   *Sufficient Answer (to STOP Automation):** A "Yes" to **any** of the above questions where the identified meaning driver is **integral to the task** and **cannot be reasonably replaced** by new tasks or redesigned processes post-automation. *Require evidence from Step 2 interviews.*
      *   *Judgment Call Flag:* "Yes, but..." scenarios. E.g., "Competence: It *does* build foundational knowledge, BUT we could replace it with a structured training module." *(Committee must debate the adequacy of the replacement)*.

  4.  **Assess Liberation Potential (The Flip Side):**
      *   *Question:* Would automating this *free up significant time* for employees to engage in *more* meaningful work (higher autonomy, mastery, connection, purpose)? Is there a concrete plan for this?
      *   *Sufficient Answer (to PROCEED with Automation):** A clear "Yes" with a **specific, credible plan** for how freed-up time will be reallocated to higher-value, more meaningful tasks *for the same employees*. (e.g., "Analysts will spend the week on deep-dive strategic analysis instead of report formatting").
      *   *Stop if:* No credible plan exists OR the freed-up time is likely to lead to layoffs or significant role degradation for those impacted. *(Judgment Call: Ethical & strategic implications)*

  5.  **Mitigation & Redesign Check:**
      *   *Question:* If Step 3 raised concerns, can the task or the surrounding work be *redesigned* to:
          *   Preserve the meaningful element *within* the automated process? (e.g., Analyst *interprets* the auto-generated chart).
          *   Transfer the meaningful element to a *new* task? (e.g., Analyst now *presents* the auto-generated findings).
          *   Enhance meaning elsewhere to compensate? (Requires strong Step 4 plan).
      *   *Sufficient Answer (to PROCEED cautiously):** A credible redesign plan that *actively addresses* the meaning loss identified in Step 3.
      *   *Stop if:* Meaningful elements are destroyed AND cannot be adequately mitigated/transferred. *(Preserve Human Task)*

  6.  **Final Recommendation:**
      *   **Preserve Human Task:** If Steps 3 or 5 result in a STOP or unresolved Judgment Call concerning significant meaning loss without adequate mitigation/liberation.
      *   **Proceed with Automation:** If Step 2 finds no meaning *or* Step 4 Liberation is strong *and* Step 3 concerns are fully mitigated via Step 5.
      *   **Proceed with High-Caution Plan:** Requires documented mitigation/redesign plan (Step 5) *and* liberation plan (Step 4), with specific metrics to monitor impact on employee engagement and meaning post-automation.

  ---

  **Running the Cases:**

  **Case 1: Automating Monthly Report Generation (3 Analysts, 1 Week)**
  1.  **Define Task:** Formatting complex charts/tables, data aggregation, consistency checks for monthly business performance report.
  2.  **Baseline Meaning:** Interviews likely reveal:
      *   *Competence:* "Getting the charts perfect shows my attention to detail." "Seeing the raw numbers flow into the final report helps me *understand* the business drivers deeply."
      *   *Purpose:* "This report goes directly to the CEO/Board; I feel like my work matters."
      *   *(Potential Social: Collaboration on tricky data points).*
  3.  **Impact Assessment:**
      *   Autonomy: Moderate loss (choice in presentation).
      *   **Competence: HIGH RISK.** Deep understanding comes from *manual* processing. Automating removes this foundational insight.
      *   Social: Possible minor loss.
      *   Purpose: Shifted (managing tool vs. creating artifact).
      *   *STOP Flag Raised (Competence - Foundational Insight).*
  4.  **Liberation Potential:** "Analysts will do strategic deep dives." **BUT:** Do they *have* the deep understanding *without* doing the report? Can they jump straight to strategy? Unlikely. Plan is weak without addressing the lost insight.
  5.  **Mitigation:** Can automation do aggregation/formatting, but *require* analysts to:
      *   Validate key outputs?
      *   Add interpretive commentary?
      *   Use the *time saved* for specific deep dives *informed by* the report data? **Yes.**
  6.  **Recommendation:** **Proceed with High-Caution Plan.**
      *   **Mitigation:** Automate formatting/aggregation ONLY. Mandate analysts:
          *   Spend saved time on analyzing report outputs for trends/insights.
          *   Write a 1-page "Key Insights & Implications" summary.
          *   Present findings to a relevant team monthly.
      *   **Monitor:** Track analyst satisfaction, quality of insights, and business impact of their new strategic work. *Risk:* If "Key Insights" becomes just as rote, meaning wasn't preserved. **Judgment Call Required:** Is this redesign sufficient to rebuild competence/mastery at a higher level?

  **Case 2: Automating First-Pass Resume Screening (HR)**
  1.  **Define Task:** Filtering incoming resumes against basic, objective criteria (e.g., degree, years of experience, specific certs) to create a "long list" for hiring managers.
  2.  **Baseline Meaning:** Interviews likely reveal:
      *   *Competence:* Minimal ("It's just box-ticking").
      *   *Social:* Minimal/None ("It's isolated").
      *   *Purpose:* Negative ("It's a chore everyone hates").
      *   *Autonomy:* Minimal.
      *   *Step 2 Result:* No meaningful connections identified. Primarily seen as a burden.
  3.  **Impact Assessment:**
      *   Autonomy: Negligible loss.
      *   Competence: Negligible loss (no valued skill).
      *   **Social: POTENTIAL RISK.** While task itself lacks social connection, *removing* it might reduce *any* human touchpoint early in the process. Does it force *any* human to engage with the candidate's materials?
      *   Purpose: Potential improvement (eliminating a disliked task).
      *   *No immediate STOP flags, but Social risk noted.*
  4.  **Liberation Potential:** **HIGH.** Frees up HR/Hiring Manager time for:
      *   More meaningful candidate engagement (phone screens, interviews).
      *   Better interview preparation.
      *   Strategic sourcing/employer branding.
      *   *Credible plan exists.*
  5.  **Mitigation (Addressing Social Risk):** Ensure the *next* step after automation is a *human interaction* (e.g., personalized email, phone screen) that acknowledges the candidate's specific application details. **Crucial:** The automation must not be the *only* touchpoint.
  6.  **Recommendation:** **Proceed with Automation**.
      *   **Mitigation Requirement:** Implement a *personalized* human contact (not just a system-generated email) as the very next step for candidates passing the automated screen. *This preserves human connection early in the process.*
      *   **Monitor:** Candidate experience scores, quality of hire. *Risk:* If the "personalized" contact feels scripted or inauthentic, social connection isn't achieved. **Judgment Call:** Defining what constitutes sufficient "personalization" early in the funnel.

  ---

  **The Hard Truths (Where This Might Hurt):**

  1.  **Preserving "Tedious" but Insight-Generating Work:** The Analyst case shows this. The procedure forces you to ask: *Is the tedium actually the source of crucial tacit knowledge?* Automating it purely for efficiency might create more expensive problems later (analysts lacking fundamental understanding). You might have to keep some inefficient processes to preserve learning.
  2.  **Rejecting Profitable Automation:** If Step 3 identifies a *strong, irreplaceable* meaning driver (e.g., a customer service role where empathy is paramount and automation frustrates customers, even if cheaper), the MWAA demands rejection, even if the spreadsheet says "automate." You'll need to justify this ethically and potentially find other efficiencies.
  3.  **Increased Upfront Cost:** Step 2 (interviews), Step 5 (redesign), and Step 6 (monitoring) add cost and time vs. a pure tech implementation. You're trading some efficiency for sustainability and humanity.
  4.  **Uncomfortable Truths about Work Design:** The Resume Screening case highlights that *some tasks are simply poorly designed and lack inherent meaning.* The MWAA might force the committee to admit this and push for better *human* work design, not just automation. It shines a light on bad jobs.
  5.  **Judgment Calls Galore:** The procedure highlights ambiguity ("Is this mitigation sufficient?", "Is this connection truly irreplaceable?"). It forces the committee to have tough ethical and strategic debates *explicitly*. It doesn't remove politics or differing values; it just structures the debate around meaningful work criteria.
  6.  **Potential for "False Negatives":** In a dysfunctional workplace, employees *might* overstate the meaning of a bad task (Stockholm syndrome). The committee needs discernment to spot this (e.g., if interviews reveal very weak, generic statements about meaning).

  **Why This is Worth It:** This procedure forces consideration of the *human and strategic costs* of dehumanizing work – costs like disengagement, turnover, loss of tacit knowledge, and reputational damage – that rarely appear on a traditional automation ROI spreadsheet. It helps build a more sustainable, resilient, and *human* organization alongside technological advancement. Walking into the meeting with this shows deep responsibility, not just cost-cutting fervor. Be prepared for pushback, but frame it as essential long-term risk management and talent sustainability. Good luck!
