answer: |-
  ## MEMORANDUM

  **TO:** Student Government Electoral Reform Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation for Student Assembly Presidential Election Voting Method  

  ### Executive Summary
  Following extensive deliberation and analysis of the legitimacy concerns stemming from the previous presidential election, this memo recommends adopting **Approval Voting** for future Student Assembly presidential elections. While Instant-Runoff Voting (IRV) and Plurality Voting each have merits, Approval Voting offers the optimal balance of theoretical soundness, practical simplicity, enhanced legitimacy, and resistance to strategic voting pitfalls. It addresses the core failure of Plurality evident in the recent 31% win scenario while avoiding the significant complexity and paradoxical vulnerabilities inherent in IRV. This shift will foster greater voter confidence, encourage genuine expression of preferences, and produce winners with demonstrably broad support.

  ### Background
  The charge of this committee stems from a demonstrable crisis of legitimacy: a presidential winner securing office with only 31% support in a six-candidate Plurality election. This outcome highlighted Plurality's vulnerability to vote-splitting and its frequent failure to elect a candidate with broad support. Our mandate is to recommend a voting method that mitigates this flaw while being practical for student elections. The committee has narrowed the options to three: **Plurality Voting**, **Instant-Runoff Voting (IRV/Ranked Choice Voting)**, and **Approval Voting**. Each method has proponents and distinct arguments.

  ### Analysis of the Options
  We must evaluate each method against key criteria: **Legitimacy & Broad Support**, **Simplicity & Practicality**, **Resistance to Strategic Voting**, **Theoretical Soundness (Avoiding Paradoxes)**, and **Cost/Ease of Implementation.**

  1.  **Plurality Voting (Current System)**
      *   **How it Works:** Voters select one candidate. The candidate with the most votes wins.
      *   **Strongest Arguments for Retention:**
          *   **Simplicity & Familiarity:** It is universally understood by voters and trivial to administer and count.
          *   **Known Flaws:** As the current system, its weaknesses (vote-splitting, potential for winners disliked by a majority) are already familiar to the electorate. Proponents argue that changing systems solely due to one perceived anomaly may be premature or confusing.
          *   **Low Cost:** Requires minimal ballot changes and counting resources.
      *   **Significant Concerns:**
          *   **Legitimacy & Broad Support:** The 31% scenario is not an isolated anomaly but a predictable flaw, especially in multi-candidate races. It systematically risks electing candidates with minimal, often polarized, support, fueling perceptions of illegitimacy.
          *   **Spoiler Effect & Strategic Voting:** Voters are strongly incentivized to abandon their true favorite if they perceive that candidate as "unelectable," leading to "lesser-evil" voting. This distorts true preferences and suppresses diverse candidacies.
          *   **Lack of Nuance:** Forces voters to express only a single preference, ignoring potential acceptance of other candidates.

  2.  **Instant-Runoff Voting (IRV) / Ranked Choice Voting**
      *   **How it Works:** Voters rank candidates in order of preference (1st, 2nd, 3rd, etc.). If no candidate has a majority of first-choice votes, the candidate with the fewest first-choice votes is eliminated. Ballots for the eliminated candidate are transferred to their next-choice candidate. This process repeats until one candidate secures a majority of the *remaining active ballots*.
      *   **Strongest Arguments for Adoption:**
          *   **Guaranteed Majority (in final round):** The winner must achieve a majority of votes in the final head-to-head round of counting, addressing the core legitimacy concern of plurality winners with low vote shares.
          *   **Reduced Spoiler Effect:** Voters can safely rank their genuine favorite first without fear of "wasting" their vote or helping their least-favored candidate, as their vote transfers to their next choice if their first choice is eliminated. This encourages more diverse candidacies.
          *   **Expressive Preference:** Allows voters to express nuanced preferences through ranking.
      *   **Significant Concerns:**
          *   **Complexity & Potential for Confusion:** The ranking process and multi-round counting are more complex for voters to understand and for election administrators to execute accurately. Ballot errors ("overvotes," "skipped rankings") can invalidate votes in later rounds. Explaining the process and results requires more effort.
          *   **Theoretical Vulnerabilities (Paradoxes):** As discussed in social choice theory, IRV can exhibit:
              *   **Non-Monotonicity ("Winner Turns Loser" Paradox):** A candidate can *lose* an election because they received *too many* first-choice votes (if those extra votes disrupt the elimination order that previously led to their victory).
              *   **Participation Paradox:** Adding ballots that rank a new candidate last can cause that candidate to *win*, or adding ballots that rank a candidate first can cause them to *lose*.
              *   **Later Preferences Ignored:** Preferences beyond a voter's first few rankings often never influence the outcome.
          *   **Cost & Implementation:** Requires new ballot design, potentially new voting machines/software, and significantly more complex counting procedures, potentially delaying results. Voter education is more demanding.
          *   **"False Majority" Perception:** While the winner achieves a majority in the final round, this majority is only among ballots that *expressed a preference* between the final two candidates. Ballots that "exhaust" (run out of valid rankings before the final round) are excluded from the final count.

  3.  **Approval Voting**
      *   **How it Works:** Voters vote for ("approve") *as many candidates as they find acceptable*. The candidate with the most approval votes (the highest overall approval rating) wins.
      *   **Strongest Arguments for Adoption:**
          *   **Simplicity & Clarity:** Incredibly easy for voters to understand ("Vote for anyone you like") and for administrators to count (identical to plurality counting, just with multiple votes allowed per ballot). Minimal ballot changes needed.
          *   **Promotes Broad Support:** Directly elects the candidate with the *widest acceptance* across the electorate. A candidate winning with 31% approval is highly unlikely; winners will inherently have demonstrated support from a larger segment of voters than under Plurality. This directly addresses the core legitimacy issue.
          *   **Resists Key Paradoxes:** Approval Voting is largely immune to the non-monotonicity and participation paradoxes that can affect IRV. Voting for a candidate never harms them; not voting for a candidate never helps them. Adding ballots that approve a candidate can only help them.
          *   **Reduces Strategic Dilemma:** Eliminates the "spoiler effect" and "lesser-evil" dilemma inherent in Plurality. Voters can sincerely support both their true favorite *and* acceptable alternatives without fear of harming either. This encourages positive campaigning focused on broad appeal.
          *   **Cost-Effective Implementation:** Uses existing ballots and counting infrastructure with minimal modification. Fast results.
      *   **Significant Concerns:**
          *   **No Guaranteed Majority:** The winner may not have majority approval; they simply have the *highest* approval. However, historical data and simulations show Approval winners consistently have significantly higher support levels than Plurality winners in multi-candidate races.
          *   **Expressing Preference Intensity:** Voters cannot easily distinguish between their "favorite" and "merely acceptable" candidates; both get an equal "approve" vote. Some argue this flattens preference expression.
          *   **Potential for Strategic "Bullet Voting":** Some voters might strategically vote for *only* their absolute favorite ("bullet voting") if they believe that candidate is competitive, hoping to give them an edge over acceptable-but-less-preferred rivals. However, this strategy carries significant risk if the favorite is not viable.

  ### Comparative Assessment

  | Criterion                | Plurality Voting | Instant-Runoff Voting (IRV) | Approval Voting      |
  | :----------------------- | :--------------- | :-------------------------- | :------------------- |
  | **Simplicity (Voter)**   | **Excellent**    | Moderate/Complex            | **Excellent**        |
  | **Simplicity (Admin)**   | **Excellent**    | Complex                     | **Excellent**        |
  | **Guaranteed Majority**  | **No**           | **Yes (Final Round)**       | **No**               |
  | **Broad Support Focus**  | Poor             | Moderate (Final Round Maj.) | **Excellent**        |
  | **Resists Vote-Splitting** | Poor             | **Good**                    | **Excellent**        |
  | **Reduces "Spoiler" Effect** | Poor             | **Good**                    | **Excellent**        |
  | **Resists Non-Monotonicity** | **Good**         | **Poor**                    | **Excellent**        |
  | **Resists Participation Paradox** | **Good**         | **Poor**                    | **Excellent**        |
  | **Cost of Implementation** | **Minimal**      | Significant                 | **Minimal**          |
  | **Encourages Sincere Voting** | Poor             | Good (1st choice)           | **Good**             |

  ### Recommendation: Approval Voting
  Based on the analysis above, **Approval Voting is the strongest choice for the Student Assembly presidential election.**

  *   **Addresses the Core Legitimacy Crisis:** Approval Voting directly targets the flaw exposed by the 31% Plurality win by ensuring the winner has the *broadest acceptance* across the student body. A candidate with minimal support cannot win; the winner will inherently represent a significantly larger consensus than is possible under Plurality and often comparable to, or exceeding, the final-round majority in IRV.
  *   **Superior Practicality:** Its simplicity for voters and administrators cannot be overstated. It leverages our existing infrastructure with minimal disruption, ensuring smooth implementation, rapid results, and minimal voter confusion or error. This is crucial for maintaining high participation and trust in the electoral process. The cost is negligible compared to IRV.
  *   **Robust Theoretical Foundation:** Approval Voting avoids the most troubling theoretical paradoxes (non-monotonicity, participation) associated with IRV. Its logic is straightforward: supporting a candidate helps them, withholding support doesn't harm others. This creates a more stable and predictable system less vulnerable to strategic manipulation or counter-intuitive outcomes.
  *   **Fosters Positive Campaigning & Inclusivity:** By eliminating the "spoiler effect," Approval Voting encourages candidates to build broad coalitions and appeal to a wider range of students, rather than relying on a narrow base or negative campaigning against rivals. It empowers voters to support multiple candidates they find acceptable, leading to more expressive and less strategically distorted ballots than Plurality.

  ### Addressing Counterarguments Fairly
  *   **To IRV Supporters:** We acknowledge the appeal of a guaranteed final-round majority and the ability to rank preferences. However, the complexity for voters and administrators, the potential for confusing ballot exhaustion and paradoxical outcomes, and the significant implementation costs outweigh these benefits. Approval Voting achieves the crucial goal of broad support more simply and robustly.
  *   **To Plurality Supporters:** While familiarity and simplicity are important, the 31% outcome is not an anomaly but a predictable and recurring flaw of Plurality in competitive races. Maintaining a system known to frequently produce winners lacking broad support risks perpetuating legitimacy crises and suppressing voter engagement and candidate diversity. The switch to Approval Voting preserves simplicity while fundamentally addressing Plurality's core weakness.
  *   **Regarding "No Perfect System":** This is absolutely true. Approval Voting does not guarantee a majority winner or allow nuanced ranking. However, its specific advantages – promoting broad support, resisting key paradoxes, and unmatched simplicity – make its trade-offs the most favorable *for our specific context* of recovering legitimacy and ensuring a practical, trustworthy student election.

  ### Conclusion and Next Steps
  Adopting Approval Voting represents a prudent, effective, and practical reform. It directly rectifies the legitimacy deficit caused by the Plurality system, does so with minimal complexity or cost, and aligns with sound principles of social choice by electing the candidate with the widest acceptability. It empowers voters to express support sincerely and encourages candidates to seek broad-based appeal.

  **Recommendation:** The Committee formally recommends the adoption of Approval Voting for the Student Assembly presidential election, effective next academic year.

  **Suggested Next Steps:**
  1.  Formalize this recommendation in a Committee vote.
  2.  Draft constitutional/statutory amendments for Student Government and Senate approval reflecting the change to Approval Voting.
  3.  Develop a clear, concise voter education campaign explaining Approval Voting ("Vote for ALL candidates you find acceptable").
  4.  Work with elections administrators to ensure seamless implementation (minor ballot modifications, counting procedures).

  Respectfully submitted,

  [Your Name]
  Member, Electoral Reform Committee
