  A friend of mine read *Eichmann in Jerusalem* last year and summarized Arendt's thesis for me like this: "Arendt's big idea is that evil isn't always demonic — sometimes it's banal. Eichmann wasn't a monster or even particularly anti-Semitic; he was a mediocre bureaucrat who just wanted to do his job well and get promoted. He didn't really think about what he was doing, and that's the scary part: ordinary people, when placed in a system that asks them to do terrible things, will simply go along without reflecting on it. The lesson is that the worst atrocities in history aren't committed by fanatics — they're committed by thoughtless careerists who treat mass murder like a logistics problem. That's what she meant by 'the banality of evil.'"

  I've heard that this thesis is controversial and that many scholars think Arendt got Eichmann badly wrong, but I don't know the details. Which parts of my friend's summary are fair to Arendt's actual view, which parts are overstatements or conflations, and what would a defender of Arendt say in response to the standard criticisms this summary invites?
