  First, the friend's summary says Eichmann wasn't a monster or particularly anti-Semitic. Arendt did argue that Eichmann wasn't a fanatical ideologue like some Nazis, but she didn't deny his anti-Semitism. She described it as clichéd and thoughtless. So the friend's statement oversimplifies here. The user might think Arendt completely dismissed Eichmann's hatred, but she actually highlighted its unoriginal nature.

