  Below is a decision tree designed to sort positions on the ontological argument based on core commitments about conceivability, modality, and existence—without referencing belief in God. The tree starts with the coherence of the description "a being than which no greater can be conceived" and branches on points of genuine disagreement. Positions collapse where distinctions aren't captured by the nodes (e.g., Anselm/Descartes and Malcolm/Hartshorne). Unoccupied logical space is flagged, and awkward commitments are noted for each leaf. The tree is self-critical: contestable placements are discussed afterward.

  ---

  ### **Decision Tree: Ontological Argument Commitments**

  #### **Node 1: Is the description "a being than which no greater can be conceived" coherent?**  
     - **No** → *Leaf: **Gaunilo-style parody***  
       *Awkward commitment: Must accept that the same logic proves absurd entities exist (e.g., a "greatest island").*  
     - **Yes** → Proceed to Node 2.

  #### **Node 2: Is existence (or necessary existence) a perfection?**  
  *(i.e., can it make a being "greater" or more excellent?)*  
     - **No** → *Leaf: **Kant's objection***  
       *Awkward commitment: Existence adds nothing to the concept of an object ("100 real thalers" aren't different from "100 possible thalers").*  
     - **Yes** → Proceed to Node 3.

  #### **Node 3: Is conceivability (or coherence) sufficient for metaphysical possibility?**  
  *(i.e., if you can coherently conceive of X, does that entail X is possible?)*  
     - **No** → Proceed to Node 4.  
     - **Yes** → Proceed to Node 5.

  #### **Node 4: Can God's possibility be proven independently?**  
     - **No** → *Leaf: **Leibniz's repair***  
       *Awkward commitment: The argument fails unless possibility is proven first—yet no independent proof is agreed upon.*  
     - **Yes** → Proceed to Node 5 (treat as "God is possible").

  #### **Node 5: Is God's nonexistence possible?**  
  *(i.e., ◊~G)*  
     - **Yes** → *Leaf: **Reverse modal argument***  
       *Awkward commitment: Validates "possibly no God → actually no God" using the same modal logic theist arguments rely on.*  
     - **No** → Proceed to Node 6.

  #### **Node 6: Is the move from "possibly necessary" to "actually necessary" valid?**  
  *(i.e., does ◊□G entail □G?)*  
     - **No** → *Leaf: **S5-skeptic***  
       *Awkward commitment: Denies a key axiom of S5 modal logic while granting God's impossibility would require proof.*  
     - **Yes** → Proceed to Node 7.

  #### **Node 7: Does the argument prove God exists or merely establish rational acceptability?**  
     - **Proves existence** → Proceed to Node 8.  
     - **Only establishes rational acceptability** → *Leaf: **Plantinga's rational-acceptability version***  
       *Awkward commitment: Concedes the argument doesn't compel atheists but makes belief rational for theists.*

  #### **Node 8: Does the proof rely on an axiomatic theory of "positive properties"?**  
     - **Yes** → *Leaf: **Gödel's positive-properties version***  
       *Awkward commitment: Necessary existence must be a "positive property," which is undefined and may be inconsistent.*  
     - **No** → *Leaf: **Malcolm's and Hartshorne's S5 versions***  
       *Awkward commitment: Equates conceivability with possibility despite paradoxes (e.g., conceivable impossibilities).*

  ---

  #### **Unoccupied Logical Space & Diagnoses**
  1. **Node 5 → Yes & Node 6 → No** (denies ◊□G → □G but affirms ◊~G):  
     *Diagnosis: Incoherent.* If God’s nonexistence is possible (◊~G), then God cannot be necessary (□G)—but rejecting the ◊□G→□G move while holding ◊~G leaves no consistent outcome.  
     
  2. **Node 3 → Yes & Node 5 → Yes** (conceivability → possibility, yet God’s nonexistence is possible):  
     *Diagnosis: Unattractive.* Implies God is both conceivable (hence possible) and impossible (since ◊~G entails ~□G), violating non-contradiction.  

  ---

  #### **Collapsed Positions**
  - **Anselm’s original argument** and **Descartes' version** both follow:  
    `Node 1 → Yes` → `Node 2 → Yes` → `Node 3 → Yes` → `Node 5 → No` → `Node 6 → [irrelevant]` → `Node 7 → Proves existence` → `Node 8 → No`.  
    *Why collapsed?* Both treat existence as a perfection and move non-modally from conceivability to existence. The tree doesn’t capture Descartes' emphasis on "supremely perfect being" vs. Anselm’s "greatest conceivable."  
  - **Malcolm** and **Hartshorne** both land on the same leaf (Node 8 → No).  
    *Why collapsed?* Both use S5 to argue from God’s possibility to necessary existence without Gödel’s axioms.  

  ---

  ### **Self-Critical Analysis**
  1. **Kant’s placement (Node 2):**  
     - *Contestable:* Kant targets *any* treatment of existence as a predicate, which could apply to the root description (Node 1). Moving it to Node 1 would reframe the incoherence as "existence can’t be part of a coherent description," but Kant’s objection is more about greatness/existence *comparisons* (Node 2). I kept it at Node 2 to isolate it from Gaunilo-style vacuity objections.  
     - *Counterargument:* If students reject the description’s coherence *because* existence is misused, Kant belongs at Node 1. To test this, add a branch at Node 1: "If no, is it because existence is treated as a predicate?" → Kant.

  2. **Gödel’s placement under S5 (Node 8):**  
     - *Contestable:* Gödel’s argument uses S5 (◊□G → □G), but his axioms bypass conceivability→possibility (Node 3). The tree implies Gödel requires Node 3 → No & Node 4 → Yes, but Node 4 isn't explicitly resolved for Gödel.  
     - *Fix:* Add a branch after Node 4: "If God’s possibility is proven, is it through conceivability or axioms?" This separates Gödel from Leibniz. I omitted this to avoid complexity, but it risks conflating Gödel’s axiomatic approach with Malcolm/Hartshorne’s conceivability-based moves.

  3. **Empiricist objection omitted?**  
     - The empiricist ("no a priori existence proofs") isn’t a leaf. It’s absorbed into:  
       - **Kant (Node 2):** If existence isn’t a predicate, a priori arguments fail.  
       - **Leibniz (Node 4):** If possibility must be proven empirically, the argument fails.  
       - **S5-skeptic (Node 6):** Denies a priori modal moves.  
     - *Why?* The empiricist objection isn’t unique to one step; it’s a meta-commitment. Adding it as a root branch ("Can existence be proven a priori? → No") would oversimplify, as empiricists might accept coherence (Node 1) but reject later steps.

  4. **Reverse modal argument placement (Node 5 → Yes):**  
     - *Contestable:* This assumes acceptance of God’s necessity (implied by Node 2 → Yes). If Node 2 → No (Kant), God’s necessity is rejected, making the reverse argument inapplicable. This is correct: the reverse argument *presupposes* that God would be necessary if existent.

  ---

  ### **Tree Summary**
  - **10 Leaves:** Gaunilo, Kant, Leibniz, Anselm/Descartes, Reverse Modal, S5-Skeptic, Plantinga, Malcolm/Hartshorne, Gödel.  
    *(Empiricist distributed; 11th leaf possible by splitting Kant or adding empiricist—see self-critique).*  
  - **Key Sorting Power:** Isolates positions by:  
    - Coherence vs. parody (Node 1),  
    - Existence as a predicate (Node 2),  
    - Conceivability→possibility (Node 3),  
    - ◊~G (Node 5),  
    - S5 validity (Node 6),  
    - Proof vs. rationality (Node 7).  
  - **Weaknesses:** Collapses Anselm/Descartes and Malcolm/Hartshorne; Gödel’s axioms blurred with S5.  

  This tree forces students to confront their commitments *before* labels, revealing why opponents share their modal intuitions or why allies diverge on the argument’s failure point. Adjust branches based on seminar debates (e.g., move Kant to Node 1 if students tie incoherence to existence-as-predicate).
