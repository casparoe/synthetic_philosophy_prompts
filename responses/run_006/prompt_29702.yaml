  Now, (2) and (5). The user rejects variants of the Principal Principle that conditionalize on the chance theory itself. But under Humeanism, the chance theory is contingent. If an agent learns the chance theory H, that might include information that affects the credence beyond just the chance value. For example, if H says the chance is x, but also implies high frequency of heads, then credence conditional on H might not be x. The original Principal Principle requires it to be x, but if H gives extra information, that might not hold. This is the "big bad bug" that Lewis identified. The user mentions not finding variants persuasive, but under Humeanism, this seems necessary. So there's a tension between accepting Humeanism and rejecting the need for a variant Principal Principle.

  The user's commitment (2) says admissible info includes the chance theory. But if the chance theory is admissible, and it implies future frequencies, then conditional on chance and that theory, credence should still be x. However, if the theory itself provides information that makes x inappropriate, that's a problem. For example, if the best system says chance is 0.5, but all past tosses were heads, the fit might be poor. Knowing the system is best despite poor fit might suggest future tosses will be heads or something. But actually, fit is measured over the whole mosaic, so knowing the theory is best means the frequencies match well overall. But for a specific event, it might not. Still, the chance theory being best doesn't logically entail future events, but it might make some frequencies more likely.

  The core issue is that under Humeanism, the chance theory entails global patterns, so knowing it might constrain future events in a way that affects credence beyond the chance value. For instance, if the best system says chance is 0.5, but if the future deviates significantly, the system wouldn't be best. So knowing it's best implies that the future frequencies are close to 0.5. Thus, for a sequence of tosses, conditional on the chance being 0.5 and the theory, the credence might not be 0.5 for each toss if the sequence has been skewed. But actually, the Principal Principle applies per event. If the chance of each toss is 0.5, then even if past tosses were all heads, conditional on the chance being 0.5, credence should be 0.5. But under Humeanism, past all-heads might affect what the chance is, but if the chance is defined as 0.5, then it's already accounted for. The problem is that learning the chance theory H might tell you that the chance is 0.5 only if the overall frequency is close to 0.5. So if you learn H, you learn that the overall frequency is close to 0.5, which for a future toss, might adjust your credence if past tosses were skewed. But for a single toss, it might not matter much.

  Lewis's solution was the New Principle, where credence is conditional on the entire chance theory, not just the chance value. So instead of credence conditional on Pt(A) = x and E being x, it's credence conditional on H (the theory) being whatever the chance of A given H is. This avoids the bug because H might imply that the chance is x, but also gives more info. The user rejects this, sticking to the original Principal Principle. But under Humeanism, this could lead to inconsistency in cases where the chance theory implies frequencies that contradict the chance value for specific events.

