  The user mentions in (2) that admissible information includes the history and chance theory but excludes future info. But for Humeans, the chance theory supervenes on the entire mosaic, including the future. So knowing the theory might give information about the future. The user might respond that the chance theory itself doesn't logically entail future events; it's probabilistic. But in cases where the actual frequencies deviate, the fit would be poor, so the best system might only be probable, not certain. However, the Principal Principle as stated requires that conditional on the chance and admissible info, credence equals the chance. If the chance theory implies something about frequencies, this could conflict.

