prompt: |-
  I keep arguing with a friend about what makes a right action morally worthy — praiseworthy in the full sense, not merely correct — and I've found that my gut verdicts on cases don't obviously hang together. Here they are. A grocer who charges fair prices only because honesty is good for business does the right thing, but I don't think his action has moral worth. A woman who visits her sick friend in the hospital out of duty, though she finds it draining and takes no pleasure in it, does act with moral worth. But I also want to say that a woman who visits the same friend simply because she loves her and would be miserable staying away acts with moral worth too, and not in some second-best sense. A man who donates to an effective charity only because he wants to impress a colleague seems to me to lack moral worth, even though the charity does a lot of good. So far I can summarize myself as: the agent's motivating reasons matter, and not just the outcome. But then there is the case I can't get around: a boy helps an enslaved person escape because he has come to care about him as a friend, while sincerely believing that what he is doing is wrong — that he is stealing someone's lawful property. I find it very hard to deny that his action has moral worth. Yet my tentative principle — an action has moral worth just in case the agent does it because she takes it to be right — says exactly that he lacks it, since he takes himself to be doing wrong. I would rather keep the verdict than the principle.

  My tentative principle also seems too strict for the woman who visits out of love: she is not visiting because she judges it right; she is visiting because she loves her friend. So I suspect the principle needs to be something like: an action has moral worth when the agent acts for the features that actually make the act right, whether or not she conceptualizes those features under the heading of rightness. But I am not sure that formulation is precise enough, and I want it tested.

  Please do this for me. (1) State the principle, or small set of candidate principles, that best captures my verdicts; be precise about what "acting for the reasons that make the act right" amounts to, and show how it handles the grocer, the two visitors, the donor, and the boy. (2) Tell me which of my verdicts the principle cannot accommodate, or can accommodate only by becoming gerrymandered, and whether you think I should overturn that verdict rather than complicate the principle. (3) Give me verdicts on some cases I have not listed: a person who acts from a consciously held correct moral principle that she originally adopted only because her parents drilled it into her and she wanted their approval; a person who does the right thing from duty, where the duty she takes herself to have is actually mistaken, so that she happens to do what is right but for a reason that would usually point elsewhere; and a person who acts from warm inclination to do something that is in fact wrong, and it happens to come out right only by luck. Finally, (4) separate what is settled in the literature from what is genuinely contested among people who work on this, and do not present a contested view as the consensus.
reasoning: |-
  Okay, the user is grappling with the concept of moral worth—what makes an action not just right but praiseworthy. They've shared several intuitive judgments about different scenarios and are struggling to reconcile them with their initial principle that moral worth requires acting because one believes the action is right. Let me unpack this step by step.

  First, the user's examples reveal a pattern: outcomes alone don't determine moral worth (grocer, donor), but motivation matters deeply. However, motivation isn't solely about duty (first visitor) or conscious moral judgment (boy helping an enslaved person). The boy case is particularly thorny—he acts against his own moral belief yet intuitively deserves praise. This directly contradicts the user's initial principle.  

  Hmm. The user's proposed alternative—acting for the right-making features—seems promising but vague. What does "acting for" mean? It can't just be that the features are present; the agent must be responsive to them. The grocer responds to profit, not fairness; the donor cares about impressing, not charity impact. But the boy acts for friendship, which (we assume) is the actual right-making feature here. That fits.  

  The two visitors are interesting. The duty-motivated one clearly qualifies, but the love-motivated one does too—suggesting moral worth doesn't require duty as the motive. Kant might disagree, but the user's intuition aligns more broadly with contemporary virtue ethics or pluralist views.  

  Now for the challenge cases:  
  - **Parents' principle case**: If she acts mechanically from indoctrination without engaging with the right-making features, it lacks worth—even if the principle is correct. But if she now endorses it for the right reasons? Tricky.  
  - **Mistaken duty case**: She intends to do what's "right" but misunderstands duty. Her action accidentally aligns with the right outcome, but since she's not responding to the actual right-making features, no moral worth.  
  - **Wrong-inclination case**: Warm feelings for a harmful act that luckily turns out okay? No moral worth—the right outcome is accidental.  

  The literature context: Kant's duty-centric view clashes with the user's intuitions (especially the boy and love-motivated visitor). Contemporary scholars like Arpaly or Markovits emphasize responsiveness to reasons, which better fits the user's pattern. The key unsettled debate: Must the agent conceptualize the reasons as moral? The boy case suggests not.  

  User's underlying need: They want a principle that respects their core intuitions without ad-hoc exceptions. The responsiveness-to-right-making-features framework achieves this best, though it requires clarity on "acting for." They might also be seeking validation that rejecting strict Kantianism is philosophically legitimate—which it is, given broader academic discourse.  

  Final note: The boy case is the litmus test. Any principle that excludes his moral worth is probably too narrow for the user. Sacrificing Kantian purity here is justified by reflective equilibrium.
answer: |-
  Here's a precise analysis addressing your cases, principles, and requests, grounded in your intuitions while highlighting philosophical tensions:

  ### (1) Proposed Principle & Handling Your Cases
  Your core intuition points to **"Responsiveness to Right-Making Features" (RRMF)** as the unifying principle:  
  **An action has moral worth iff the agent is non-accidentally motivated *by* the features that *actually* make the act right, such that these features form the primary explanatory reasons for her action.**  

  #### Clarifying "Acting For the Right-Making Features":
  - **Non-accidental motivation**: The right-making features must *explain why* the agent acts, not merely coincide with the action.  
  - **Actual (not believed) right-makers**: What *objectively* makes the act right (e.g., relieving suffering), not what the agent *thinks* makes it right.  
  - **Primary explanatory reasons**: The features must be the dominant motivation, not an incidental side effect.  

  #### Application to Your Cases:  
  | **Case**               | **Right-Making Feature(s)**          | **Agent's Motivation**               | **RRMF Verdict** | **Matches Your Intuition?** |  
  |-------------------------|--------------------------------------|--------------------------------------|------------------|-----------------------------|  
  | **Grocer**             | Fairness/honesty in transactions     | Profit ("good for business")         | ❌ No moral worth | ✅ Yes                      |  
  | **Visitor 1 (duty)**    | Alleviating suffering, showing care  | Duty (moral obligation)              | ✅ Moral worth   | ✅ Yes                      |  
  | **Visitor 2 (love)**    | Alleviating suffering, showing care  | Love/friendship                      | ✅ Moral worth   | ✅ Yes                      |  
  | **Donor (vanity)**      | Effective altruism (helping others)  | Impressing colleagues                | ❌ No moral worth | ✅ Yes                      |  
  | **Boy (helps enslaved)**| Liberation, justice, friendship      | Friendship/care for the person       | ✅ Moral worth   | ✅ Yes (your sticking point) |  

  **Why RRMF works**:  
  - **Boy's case**: He acts for friendship/care—features that *actually* make helping right (liberation + care). His mistaken belief about "property" doesn't negate his responsiveness to the *true* moral features.  
  - **Love-motivated visitor**: She acts for love (a care-based reason), which aligns with the act's right-making features (showing care, alleviating suffering).  
  - **Duty-motivated visitor**: She acts for duty, which *correctly* tracks the right-making features.  
  - **Excluded cases**: Grocer/donor act for self-interest, not the right-making features (fairness, altruism).  

  ---

  ### (2) Tensions & Recommendations  
  **Your principle accommodates all your cases without gerrymandering**—*if* "right-making features" are interpreted objectively. However:  
  - **Potential tension**: The **duty-motivated visitor** might seem to conflict with the **love-motivated visitor** if "duty" is seen as distinct from "right-making features." RRMF resolves this: both track the *same* objective features (care/suffering-alleviation), just under different descriptions ("duty" vs. "love").  
  - **Should you overturn any verdict?** Your intuitions are coherent under RRMF. If forced to choose, **prioritize the boy's case** over retaining "acts because she takes it to be right." His moral courage/responsiveness to actual injustice is praiseworthy *despite* his false belief—overturning the belief-based principle is justified.  

  ---

  ### (3) New Case Verdicts Using RRMF  
  | **Case**                                                      | **RRMF Verdict** | **Explanation**                                                                 |  
  |---------------------------------------------------------------|------------------|---------------------------------------------------------------------------------|  
  | **Parents' principle**: Acts on correct principle (e.g., "don't lie") drilled into her by parents for approval. | ❌ **No moral worth** | She acts for approval/habit, not the right-making features of honesty (e.g., trust, respect). Correct action is accidental to her motives. |  
  | **Mistaken duty**: Thinks she must return a borrowed item immediately (duty), but owner is a murderer—keeping it saves a life. | ❌ **No moral worth** | She acts for a feature (promise-keeping) that *isn't* the right-maker here (saving a life). The right outcome is accidental. |  
  | **Warm inclination gone right**: Robs a bank out of thrill-seeking, but accidentally donates stolen money to an effective charity. | ❌ **No moral worth** | Acts for adrenaline/selfishness, not the right-making features (helping others). Right outcome is purely lucky. |  

  ---

  ### (4) Philosophical Landscape: Settled vs. Contested  
  **Settled**:  
  - Moral worth ≠ mere rightness (Kant, *Groundwork*).  
  - Motives matter (contrast consequentialism).  
  - Self-interest motives (grocer/donor) lack moral worth (broad consensus).  

  **Contested**:  
  - **Kantian view** (consensus until late 20th c.): Moral worth *requires* acting *from duty* (not merely in accordance). Your love-motivated visitor lacks worth on this view. **Your intuition rejects this.**  
  - **Belief requirement**: Must the agent *believe* the act is right? Kantians (e.g., Korsgaard) say yes; your boy case challenges this.  
  - **Role of inclinations**:  
    - **Kantians**: Inclinations (love, sympathy) lack moral worth.  
    - **Neo-Kantians/Pluralists** (e.g., Barbara Herman): Inclinations can have worth *if* regulated by moral commitment.  
    - **Sentimentalists** (e.g., Michael Slote): Warm motives (care, empathy) are *sufficient* for moral worth.  
  - **Objectivity of right-makers**:  
    - **Realists** (your RRMF): Right-makers exist independently of belief.  
    - **Constructivists**: Right-makers depend on the agent's perspective.  

  **Your RRMF principle aligns with contemporary pluralists (e.g., Nomy Arpaly, Julia Markovits)** who argue moral worth stems from responsiveness to *objective* moral reasons, regardless of conceptualization (duty/love) or belief in rightness. The boy case is defended by Arpaly (*Unprincipled Virtue*), who argues that moral understanding isn't required—only sensitivity to morally relevant features.  

  **Key unresolved debate**: Is conceptualizing the act *as moral* necessary? Your intuitions (and RRMF) imply "no," but this remains contentious. Stick with RRMF—it systematizes your judgments without ad-hoc adjustments.
