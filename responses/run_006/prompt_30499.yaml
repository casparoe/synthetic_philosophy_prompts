  First, I need to parse their explicit needs: desiderata list, case-motivations, non-negotiables (idea/expression/embodiment distinction, independent invention vs copying, public domain necessity), camp preferences (attribution type, justification basis), and tension points. The scorecard should be minimal. But deeper, they likely want conceptual clarity after years in the messy trenches of science IP—seeking a structured lens to evaluate disputes they've witnessed. They might also be probing whether philosophy can offer practical guidance beyond academic debates.

  For structure, I'll organize desiderata into functional categories: ontological (defining ideas), ethical (ownership claims), and teleological (system design). Non-negotiables are straightforward from their examples. Tensions will center on creator control vs public access. Motivations must draw from concrete scientific cases—e.g., MTA ambiguities for embodiment distinction, simultaneous discoveries for independent invention. The scorecard will brutally expose gaps: Locke fails public domain, Hegel chokes on collaborative science, utilitarianism stumbles on attribution ethics.

  Key insight: Their chemistry background means examples must resonate with lab realities (e.g., crystal structures as embodied ideas). Also, their frustration with theory-practice gaps suggests desiderata should prioritize applicability—hence emphasizing "guided resolution" of disputes. The hardest trade-off is incentivizing creation without stifling follow-ons; I'll spotlight that as the core tension driving IP reform debates. Finally, the public domain requirement eliminates most simplistic theories immediately—a useful filter they'll appreciate.
answer: |-
  Here is a specification for an adequate theory of idea ownership, structured by desiderata, motivations, and distinctions between non-negotiables and contested preferences. The focus is squarely on criteria for judging theories relative to your stated purpose: guiding thought on scientific priority, research ethics, and IP system design.

  **Core Desiderata for an Adequate Theory of Idea Ownership**

  1.  **Distinguish Idea, Expression, & Embodiment (Non-Negotiable):**
      *   **What:** Must clearly differentiate the abstract concept (idea), its specific articulation (expression - e.g., paper, diagram, formula), and its physical instantiation (embodiment - e.g., patented device, sample).
      *   **Motivation (Case: Material Transfer Agreements):** When sharing a unique crystal structure (embodiment), does the recipient also gain rights to the synthesis method (idea/expression) underlying it? MTAs often founder on this ambiguity. Ownership claims over a physical sample vs. the knowledge it embodies must be separable.
      *   **Why Non-Negotiable:** Confusion here leads to intractable disputes over scope and stifles research access. Fundamental to defining *what* is potentially ownable.

  2.  **Account for Independent Conception vs. Copying (Non-Negotiable):**
      *   **What:** Must explain why discovering/inventing something independently (even if later) carries different ethical/legal weight than directly copying or deriving it from another.
      *   **Motivation (Case: Simultaneous Discovery):** Two labs publish the same reaction mechanism within weeks. Who gets priority? Does the second lab, working independently, owe anything to the first beyond citation? Patent law's novelty bar vs. scientific priority disputes hinge critically on this distinction.
      *   **Why Non-Negotiable:** Fundamental to fairness in both attribution (priority) and infringement claims. Ignores the reality of parallel thought.

  3.  **Require a Mechanism for the Public Domain (Non-Negotiable):**
      *   **What:** Must explain why any exclusive control over an idea or its expression *must* eventually expire or be limited, allowing unfettered public access and use.
      *   **Motivation (Case: Foundational Methods):** Consider PCR or CRISPR. Should basic, transformative research tools remain indefinitely controlled by initial inventors/assignees, blocking all follow-on innovation without permission? The cumulative nature of science demands a commons.
      *   **Why Non-Negotiable:** Perpetual ownership of core ideas paralyzes progress. All functional IP systems incorporate limits (patent expiry, copyright term limits, fair use). The theory must *justify* why this is necessary, not just acknowledge it exists.

  4.  **Justify Exclusive Control (Limited Monopoly):**
      *   **What:** Must provide a coherent rationale for granting *temporary* exclusionary rights (preventing others from using/making/selling without permission).
      *   **Motivation (Case: Drug Development):** Why should a company invest billions in R&D if competitors can immediately copy and sell the resulting drug? The theory must explain what societal problem (e.g., underinvestment, free-riding) this monopoly solves.
      *   **Note:** The *degree* and *duration* of control are key variables, but some justification for *some* control is central to IP systems.

  5.  **Ground Attribution/Obligations:**
      *   **What:** Must explain the basis for the near-universal norm of giving credit (citation, authorship) for ideas/expressions, even outside exclusive control periods.
      *   **Motivation (Case: Plagiarism):** Why is copying a proof verbatim into your paper without citation unethical, even if the proof itself is decades old and firmly in the public domain? What obligation persists?
      *   **Note:** This is separable from exclusive *control* rights.

  6.  **Facilitate Cumulative Innovation:**
      *   **What:** Must enable and encourage later researchers to build upon, improve, critique, and apply existing ideas/expressions.
      *   **Motivation (Case: Building on Prior Art):** A researcher develops a significantly improved catalyst based on a patented predecessor. How does the theory ensure the prior art is accessible enough to build upon, while respecting legitimate claims of the initial inventor?
      *   **Tension Point:** Directly conflicts with the scope/duration of **#4 (Justify Exclusive Control)**. Too much control stifles building; too little may reduce initial investment.

  7.  **Provide Guidance for Priority Disputes:**
      *   **What:** Must offer principles for adjudicating claims of "who was first" based on evidence (lab notebooks, publication dates, disclosures).
      *   **Motivation (Case: Notebook vs. Publication):** Lab A has detailed notebook entries dated earlier but Lab B publishes first. Who gets priority credit? The theory must value the act of conception *and* communication meaningfully.
      *   **Note:** Closely linked to **#2 (Independent Conception)** but focuses on *establishing* primacy between claimants.

  8.  **Delimit Scope of Protection:**
      *   **What:** Must provide criteria for determining how *broadly* an idea or expression is protected (e.g., the specific claims of a patent, the "idea/expression dichotomy" in copyright).
      *   **Motivation (Case: Broad vs. Narrow Patents):** A patent claims "a method of modulating protein X." Is this an unprotectable natural principle, an overly broad claim preempting all future work on protein X, or a valid inventive concept? Scope determines the freedom of others to research nearby ideas.
      *   **Tension Point:** Scope directly impacts **#6 (Cumulative Innovation)** and **#3 (Public Domain)**. Overly broad scope is functionally perpetual and blocks building.

  9.  **Enable Practical Resolution of Disputes:**
      *   **What:** Must yield principles clear and robust enough to be applied by scientists, institutions, courts, and policymakers to resolve real conflicts.
      *   **Motivation (Case: University Tech Transfer Disputes):** When a startup licenses a professor's patented method, but a grad student claims key contributions were theirs alone, what principles from the theory guide a fair resolution? Vague theory leads to costly, arbitrary outcomes.

  **Contested Preferences (Camps):**

  *   **Nature of Attribution:**
      *   *Camps:* Is it a core property right inherent in the idea/expression? Or a separate moral duty (e.g., based on honesty, desert, or reciprocity) distinct from ownership?
      *   *Motivation:* Explains why attribution persists after control rights expire (**#3, #5**).

  *   **Underlying Justification:**
      *   *Camps:* Labor/Desert (Lockean: "I mixed my labor with the idea"), Personality/Identity (Hegelian: "The idea expresses my self"), Social Utility/Incentive (Utilitarian: "We grant monopoly to encourage more ideas").
      *   *Motivation:* Provides the foundational *reason* for granting any rights (**#4**) and shapes the answers to scope, duration, and the nature of attribution.

  **Key Tensions:**

  1.  **Creator Control (#4) vs. Freedom to Build (#6):** This is the *fundamental* tension in all IP. Too much protection stifles follow-on innovation; too little reduces the incentive to create/disclose. Theories lean towards one pole, requiring careful balancing acts (e.g., patent term limits, fair use exceptions).
  2.  **Scope (#8) vs. Public Domain (#3):** Overly broad protection functionally extends the monopoly and delays the public domain, hindering cumulative progress.
  3.  **Attribution as Right vs. Duty:** Impacts the strength and enforceability of credit obligations, especially post-control period.

  **The Crucial Eliminator: Public Domain Requirement (#3)**

  This single desideratum does the most heavy lifting in eliminating inadequate theories:

  *   **Locks out Strict Lockeanism:** If ownership arises solely from labor mixing with the "intellectual commons," why must it ever end? Locke himself struggled with this regarding land; perpetual IP ownership is a direct, problematic consequence often ignored by proponents. Fails **#3**.
  *   **Challenges Pure Hegelianism:** If the idea is an embodiment of personality, does the personality claim ever truly dissolve? While expression might be tied to personality, the underlying *idea* becomes detached. Strict personality theory struggles to justify forced entry into the public domain (**#3**) and is ill-suited to collaborative, incremental science (**#6**).
  *   **Pressures Utilitarianism:** While easily incorporates **#3** (optimal term for incentive), it struggles profoundly with **#5 (Attribution)**. If the *only* goal is net social utility, why is plagiarism wrong once the expression's copyright expires? What utility is served by citing a centuries-old paper? Pure utility often reduces attribution to an instrumental tool, not a core obligation.

  **Brief Scorecard (Against Desiderata):**

  *   **Lockean (Labor/Desert):**
      *   *Strengths:* Intuitive for effort (#7), grounds initial claim (#4).
      *   *Weaknesses:* Fails **#3** (Public Domain - perpetual ownership), struggles with **#1** (Scopes ideas poorly), poor on **#5** (Attribution post-control), weak guidance on **#2/7** (Independent invention/priority).
  *   **Hegelian (Personality):**
      *   *Strengths:* Explains **#5** (Attribution as respect for personality), handles expression well (**#1**).
      *   *Weaknesses:* Poor fit for factual ideas/science vs. art (**#1, #6, #8**), struggles with **#3** (Public Domain - personality claim?), weak on **#2/4** (Independent creation/exclusive control justification).
  *   **Utilitarian (Social Incentive):**
      *   *Strengths:* Explicitly justifies **#3** & **#4** (balance via term/scope), pragmatic for **#9** (policy design), can support **#6** (via limits/exceptions).
      *   *Weaknesses:* Fails **#5** (Attribution often lacks clear utility justification), struggles with **#7** (Priority - "first" isn't always most useful), risks instrumentalizing creators, morally thin.

  No single theory satisfies all desiderata perfectly. An adequate account will likely be a hybrid or explicitly address the tensions, prioritizing **Non-Negotiables (#1, #2, #3)** while transparently arguing for its stance on the contested preferences and its resolution of the core tension between control and access. Its primary value will be providing a coherent framework to *analyze* your hard cases, not necessarily dictating a single "correct" answer in every dispute.
