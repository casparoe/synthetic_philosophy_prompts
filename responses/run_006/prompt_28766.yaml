  Okay, let me try to unpack this user's query. They had a debate with a friend about whether morality is objective, and their friend cited Quine to support the idea that moral claims are empirical and scientifically verifiable. The user feels this might be a misreading but isn't sure. 

  First, I need to recall Quine's actual positions. Quine was a naturalist who rejected first philosophy, meaning all inquiry, including ethics, must start within science. But does that make moral claims scientific hypotheses? The friend claims "lying is wrong" is an empirical prediction about consequences, testable like any science. They also tie this to evolution, saying altruism's selective advantage makes moral claims true.

  Hmm, the user's suspicion aligns with what I remember. Quine did discuss ethics in *The Roots of Reference*, but cautiously. He thought science could explain moral psychology—why we value what we do—but not validate the values themselves. The friend's summary oversimplifies by equating moral claims with empirical hypotheses. 

  I should check Quine's writings. In "On the Nature of Moral Values," he explicitly rejects the idea that science can determine moral ends. Values are chosen based on innate dispositions shaped by evolution, but those dispositions don't make values objectively true. They just explain our subjective preferences. So Quine's naturalism here is more about explaining moral beliefs, not justifying them.

  The friend's error is conflating explanation with justification. Evolution explains why we have certain inclinations, but for Quine, that doesn't translate to moral realism. He saw values as projections, not facts discoverable by science. 

  The user also mentioned Quine's views on ontology. His criterion for ontological commitment—"to be is to be the value of a variable"—applies to scientific theories, not moral ones. Moral predicates aren't part of his scientific ontology, reinforcing that he didn't treat ethics as science.

  So the accurate view is: Quine is a naturalist about moral psychology but a non-cognitivist or subjectivist about moral truth. He'd say science can study why humans call something "good," but not that "good" exists independently.

  The user needs a clear rebuttal: their friend mistakes Quine's explanatory project for a justificatory one. The summary is wrong in claiming Quine is a scientific realist about morality. Instead, Quine separates the scientific explanation of moral beliefs from any claim about their objective truth.
answer: |-
  Your instincts are spot on – your friend's summary contains a significant misreading of Quine, conflating his naturalistic *explanation* of moral beliefs with a *justification* or *realism* about moral truths. Here's a breakdown:

  **Accurate Parts of the Summary:**

  1.  **Naturalism:** Quine was indeed a thoroughgoing naturalist. He rejected "first philosophy" (any foundational inquiry prior to or outside of science). All genuine inquiry, including reflection on knowledge and meaning, must begin "within science."
  2.  **Evolutionary Explanation of Dispositions:** Quine did emphasize evolution as the key to understanding why we have the innate dispositions and tendencies we do, including proto-moral sentiments like sympathy, reciprocity, and aversion to harm (which he called "moral forces"). He saw these as biologically ingrained, shaped by natural selection because they promoted group survival ("altruism got selected for" is a rough but acceptable shorthand here).
  3.  **Empirical Roots of Moral Discourse:** Quine acknowledged that our moral language and concepts arise from these natural dispositions interacting with social conditioning. Understanding *why* we talk about "right" and "wrong" requires empirical science (psychology, biology, anthropology).

  **Significant Misreadings and Misattributions:**

  1.  **Moral Claims as Testable Empirical Hypotheses:** **This is the core error.** Quine explicitly **rejected** the idea that moral claims like "lying is wrong" are scientific hypotheses subject to empirical confirmation or falsification in the same way as claims in physics or biology.
      *   **Why?** Science aims to describe and explain the world. Moral claims, for Quine, primarily express *evaluations*, *prescriptions*, or *pro-attitudes* (approval, disapproval, desire, aversion) grounded in our evolved biological and cultural heritage. They don't add new descriptive facts to the scientific picture of the world; they project our subjective responses *onto* the world.
      *   **Consequences:** You cannot "test" whether "lying is wrong" in the same way you test "water boils at 100°C at sea level." You can test hypotheses *about* the consequences of lying (e.g., "Lying erodes trust, leading to social instability"), but whether those consequences are *morally bad* isn't settled by the test itself. That judgment depends on the prior, non-scientific valuation of trust and stability as "good."
  2.  **Scientific Realism about Morality:** **This conclusion does not follow** from the accurate parts. Quine was a scientific realist about the entities posited by our best scientific theories (electrons, genes, etc.). He was **not** a realist about moral properties or facts.
      *   **His View:** Moral values are not part of the *furniture of the universe* discovered by science. They are expressions of our subjective, evolved dispositions. Science can explain *why we have* the moral sentiments we have and *why we make* the moral judgments we make. It cannot discover objective moral truths *out there* independent of these dispositions.
      *   **The Gap:** The evolutionary explanation tells us *why we feel* that helping others is right. It does *not* tell us that helping others *is objectively* right. For Quine, there's no further "moral fact" for science to discover beyond the natural facts about our psychology and evolution.
  3.  **"That biological fact is what makes the moral claim true":** This misrepresents Quine. The biological fact (e.g., that altruism was selected for) explains *why we believe* "helping others is right." It does **not** make the claim *true* in an objective, realist sense. For Quine, the "truth" of a moral claim is more akin to its expressing a deeply held, biologically ingrained pro-attitude within a community, not its correspondence to an independent moral reality.

  **Quine's Actual View on Moral Values (A More Careful Statement):**

  Quine's position is best described as **Naturalized Non-Cognitivism or Projectivism, grounded in Evolutionary Psychology:**

  1.  **Non-Cognitivism:** Moral judgments ("X is wrong") are not primarily statements of fact capable of being true or false in the same way scientific statements are. They are expressions of emotion, attitude, or commitment.
  2.  **Naturalized/Explanatory:** While not truth-apt *in the scientific sense*, these moral judgments and the underlying dispositions *are natural phenomena* that demand a scientific explanation. This explanation lies in evolution (which shaped our innate "moral sense") and cultural learning (which refines and channels these innate tendencies).
  3.  **Projectivism:** We *project* our evolved emotional responses (approval, disapproval) onto the world, talking as if "wrongness" is an inherent property of actions like lying, rather than recognizing it as a reflection of our own subjective responses conditioned by biology and culture.
  4.  **Subjectivism/Relativism (Implicit):** Since moral values stem from contingent evolutionary and cultural histories, there is no objective, transcendent standard against which to judge them *as objectively true or false*. Different dispositions or cultural norms would lead to different "moral truths." Quine avoids strong relativist pronouncements, but his view leads strongly in that direction.
  5.  **No "First Ethics":** Just as there is no first philosophy prior to science, there is no foundational ethics. Our moral reasoning starts from within our existing web of beliefs, including our deeply held values (themselves products of nature and nurture), and seeks coherence. We might refine our values based on empirical knowledge of consequences (e.g., realizing an action causes unforeseen harm might lead us to condemn it), but the *fundamental* valuation of harm as "bad" isn't scientifically derived; it's given by our nature.

  **Key Quine Quote (from "On the Nature of Moral Values"):**

  > "Science... might even be said to have undermined ethics... by explaining away obligation as an illusion of the genes... But I see no such conflict. The moral values... were not inferred from scientific data. They were not extracted from science at all... They are products of the genes and the environment... Science... can study the moral values... as natural phenomena... But *the question whether they are *right* is... a question within ethics*, and hence not a scientific question... Science... is not the arbiter of ultimate ends."

  **Conclusion:**

  Your friend correctly identifies Quine's naturalism and his emphasis on evolution as the explanation for our moral *psychology*. However, he fundamentally misreads Quine by equating this explanatory project with a scientific *realism* about moral *truth*. Quine separates the "is" of explanation (science tells us *why* we value X) from the "ought" of justification (science cannot tell us *if* we *should* value X objectively). Quine sees moral values as deeply rooted in our biological nature, but he does **not** believe science discovers moral facts or that moral claims are testable empirical hypotheses. His view is much closer to a sophisticated naturalistic subjectivism or non-cognitivism than to scientific realism about morality. Your initial sense that Quine sees science as explaining our values but not settling which ones are "right" is the more accurate understanding.
