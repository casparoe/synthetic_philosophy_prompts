  I’ll structure requirements by domain: conceptual distinctions, key cases, empirical constraints. The trick is balancing negotiable vs. non-negotiable. For example: 
  - *Non-negotiable:* Avoiding thermostat-suffering absurdity. Any theory that fails this is dead on arrival. 
  - *Negotiable:* Whether phenomenology requires biology. Illusionists will scrap this; biological naturalists demand it. 

