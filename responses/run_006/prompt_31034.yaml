prompt: |-
  I write about health and medicine for a general-interest magazine, and increasingly my work sits at the boundary between science reporting and conceptual commentary: I get assigned a piece on a condition, and the first decision I face is what to call it. Is it a disease, a disorder, a syndrome, a risk factor, or a normal variation? The choice is not cosmetic. Calling something a disease can lead people to seek treatment they may not need; calling a disease a risk factor can give insurers grounds to dismiss a serious problem; calling a difference a disorder can stigmatize a whole group. I make this call several times a month, usually on deadline, and I have no explicit procedure for it.

  I am aware that philosophers of medicine have worked on exactly this question, roughly divided between naturalist accounts, on which health and disease are matters of biological function and statistical typicality, and normativist accounts, on which the concepts cannot be cleaned of value judgments about suffering, flourishing, and social expectations. I do not want a summary of that debate. I want it translated into a reusable editorial procedure.

  Please write me a decision procedure I could actually run in about twenty minutes before filing a story, with no more than a working journalist's background in philosophy. It should be a sequence of questions in order; for each question, say what would count as a sufficient answer, where the procedure stops and returns a definite label, and where it must stop and say that this step is a values judgment rather than a factual test. Then run the procedure on three cases I have actually faced: a reader whose blood pressure sits in the range some guidelines call prehypertension or elevated and who asks whether they have a disease; a postmenopausal woman whose bone-density score falls below the diagnostic cutoff for osteoporosis but who has never had a fracture; and an article about autism in which I must choose between describing it as a disorder and describing it as a difference. Include at least one case where the procedure returns an answer I will not like, and be explicit about what the procedure cannot settle.
reasoning: |-
  Okay, the user writes for a health magazine and faces tough decisions about labeling medical conditions. They need a practical tool to decide terms like "disease" or "disorder" quickly. The key challenge is balancing scientific accuracy with ethical implications—mislabeling could lead to overtreatment, stigma, or insurance issues. 

  The user mentions they're familiar with the philosophy debates (naturalist vs. normativist) but want no theory—just actionable steps. Their real pain point is deadline pressure and lacking a clear method. They’ve given three concrete cases: prehypertension, osteopenia without fractures, and autism terminology. 

  First, I should design a procedure that’s:  
  - Sequential (simple yes/no questions)  
  - Time-bound (~20 mins)  
  - Explicit about where values kick in (no pretending objectivity where it doesn’t exist)  
  - Grounded in both biological facts *and* social consequences  

  The cases reveal deeper needs:  
  - For the reader with "elevated" BP: They worry about medicalizing risk factors unnecessarily.  
  - For osteopenia: Avoiding scaring patients when intervention isn’t urgent.  
  - For autism: The huge stakes of pathologizing vs. affirming neurodiversity.  

  The procedure must flag when a choice isn’t just scientific but ethical—e.g., step 3’s harm question forces confronting norms. For autism, the procedure *should* return an answer the user might dislike (calling it a disorder if harm criteria are met) to prove it’s not biased toward "nice" outcomes.  

  Biggest gaps to address:  
  1. **Speed**: Avoid open-ended research. Rely on quick checks like guideline citations.  
  2. **Transparency**: Show where the journalist’s *own* judgment is needed (e.g., "Is this harmful?").  
  3. **Limits**: Sometimes the answer is "This is contested; here’s why."  

  For the cases:  
  - **Prehypertension**: Stops early at step 1—no biological dysfunction, just risk. "Risk factor" fits.  
  - **Osteopenia**: Advances to step 3. Harm *could* occur (fractures), but no current dysfunction. "Condition" or "risk state" softens the blow.  
  - **Autism**: Hits step 3’s values judgment. Science says dysfunction exists (step 1), but harm is debated. The procedure *must* pause here—no evasion.  

  Crucially, the user needs permission to say "This label depends on your worldview" in articles. That’s the hidden win: The procedure doesn’t just spit answers; it teaches readers how messy these calls are.
answer: |-
  Here's a practical, step-by-step decision procedure designed for deadline use. It prioritizes clarity, acknowledges value judgments explicitly, and stops when further analysis exceeds the scope/time. It integrates core philosophical insights without requiring theory knowledge.

  **The 20-Minute Terminology Decision Procedure**

  1.  **Is there measurable biological dysfunction?**
      *   **Ask:** Does this state involve a documented failure of a universally recognized physiological process (e.g., organ failure, metabolic pathway disruption, cellular damage)? *Use standard medical references/textbooks.*
      *   **Sufficient Answer (Yes):** Clear evidence of structural damage or fundamental physiological process failure (e.g., myocardial infarction, untreated HIV infection, uncontrolled diabetes). **Proceed to Step 2.**
      *   **Sufficient Answer (No):** No evidence of current damage or fundamental process failure; it might be a risk marker, statistical deviation, or normal variation. **STOP & LABEL:** Likely a **Risk Factor**, **Elevated State**, or **Normal Variation** (depending on context). *Value judgment minimal here.*
      *   **Unclear/Contested:** Proceed cautiously to Step 2.

  2.  **Is the dysfunction linked to significant harm?**
      *   **Ask:** Is the biological dysfunction from Step 1 *strongly and consistently associated* (via robust epidemiological evidence) with increased risk of *serious* negative outcomes (death, disability, severe pain, loss of major function)? *Use major consensus guidelines, systematic reviews.*
      *   **Sufficient Answer (Yes):** Strong, consistent evidence linking the dysfunction to serious harm (e.g., sustained severe hypertension linked to stroke/heart attack). **Proceed to Step 3.**
      *   **Sufficient Answer (No):** Dysfunction exists but evidence linking it to significant harm is weak, inconsistent, or only shows mild/nuisance symptoms. **STOP & LABEL:** Likely a **Disorder** or **Syndrome** (implies dysfunction but ambiguous harm level). *Value judgment creeps in defining "significant".*
      *   **Unclear/Contested:** Proceed to Step 3, flagging the uncertainty.

  3.  **Is the harm primarily intrinsic, or heavily dependent on social context?**
      *   **Ask:** Would the negative consequences likely occur in *any* typical human environment (e.g., pain, organ failure, death), or are they primarily caused by societal structures, expectations, or lack of accommodation (e.g., difficulty in standard education/employment, social stigma)? *This is the crucial normativist step.*
      *   **Sufficient Answer (Primarily Intrinsic Harm):** Harm would likely occur regardless of social context (e.g., metastatic cancer, septic shock, untreated severe asthma). **STOP & LABEL:** **Disease** (Strongest term, implies intrinsic biological dysfunction causing harm).
      *   **Sufficient Answer (Primarily Context-Dependent Harm):** The core biological difference isn't inherently harmful, but societal norms/environments create disadvantage or distress. **STOP & LABEL:** **Difference**, **Variation**, or **Condition** (Avoids pathologizing the person). *High Value Judgment: Requires assessing social vs. biological contribution to harm.*
      *   **Mixed Contribution:** **STOP & LABEL:** **Disorder** (Acknowledges biological basis *and* significant impact, which may involve context) OR use specific descriptive language (e.g., "Neurological Development Condition" for Autism). *Explicitly state the value judgment involved in choosing the term.*

  **Key Features of the Procedure:**
  *   **Stops Early:** If no dysfunction (Step 1), avoids over-medicalization. If no clear harm (Step 2), avoids alarmism.
  *   **Flags Values:** Step 3 *explicitly* forces confrontation with social norms vs. biology. It doesn't hide the value-laden nature of the decision.
  *   **Uses Common Resources:** Relies on standard medical references and major guidelines, accessible quickly.
  *   **Provides Definite Labels:** Offers specific outputs (Disease, Disorder, Risk Factor, etc.).
  *   **Acknowledges Limits:** Highlights where uncertainty or value judgments dominate the choice.

  ---

  **Application to Your Cases**

  **Case 1: "Elevated" Blood Pressure (Prehypertension)**
  1.  **Biological Dysfunction?** No. Blood pressure is elevated but no current damage to heart, vessels, kidneys. Blood vessels are functioning, just under higher pressure. *Sufficient Answer: No.*
  2.  **--> STOP & LABEL: Risk Factor** (or "Elevated Blood Pressure"). Calling it a "disease" (like Hypertension Stage 1/2) is inappropriate here. It signals increased risk, not current pathology.

  **Case 2: Low Bone Density (Below Osteoporosis Cutoff) Without Fracture**
  1.  **Biological Dysfunction?** **Unclear/Contested.** Bone mineral density (BMD) is reduced. Is low BMD itself a *dysfunction*, or is the dysfunction the *fracture*? Current medical definitions often treat the low BMD *as* the dysfunction indicative of bone weakness.
  2.  **Harm?** **Yes (Proceed).** Low BMD is strongly associated with increased fracture risk (serious harm: pain, disability, mortality). *Sufficient Answer: Yes.*
  3.  **Harm Intrinsic or Context-Dependent?** **Primarily Intrinsic.** A fragility fracture (e.g., from a minor fall) is harmful regardless of social context (pain, immobility). The *risk* of that harm is intrinsic to the bone state. *Sufficient Answer: Primarily Intrinsic.*
  4.  **--> STOP & LABEL: Disease (specifically, Osteopenia/Osteoporosis).** *This might be the answer you don't like.* The label reflects the underlying biological state (reduced bone strength, a dysfunction) linked to significant intrinsic harm (fracture), even if the harm hasn't manifested *yet*. The term "disease" accurately conveys the pathological state requiring monitoring/possible intervention to prevent harm. You can soften it editorially ("bone-weakening disease," "diagnosis of osteoporosis") but the procedure identifies it as a disease state.

  **Case 3: Autism - Disorder vs. Difference**
  1.  **Biological Dysfunction?** **Yes (Proceed).** Autism involves measurable differences in brain development, structure, and function. These are deviations from typical neurodevelopment pathways. *Sufficient Answer: Yes (Neurodevelopmental Dysfunction).*
  2.  **Harm?** **Mixed (Proceed).** Core autistic traits (sensory differences, communication styles, intense interests) aren't inherently harmful. However, autism is *frequently* associated with significant co-occurring conditions (epilepsy, GI disorders, profound anxiety, intellectual disability in some) and distress caused by sensory overload, communication barriers, or social exclusion. The *level* and *source* of harm are highly variable and debated.
  3.  **Harm Intrinsic or Context-Dependent?** **OVERWHELMINGLY MIXED CONTRIBUTION / HIGHLY CONTESTED.** This is the core debate.
      *   *Intrinsic Harm:* Significant co-occurring conditions (epilepsy, severe anxiety disorders) cause intrinsic harm. Profound sensory overload can be intrinsically distressing.
      *   *Context-Dependent Harm:* Much distress and disability stem from societal expectations, lack of accommodations (sensory environments, communication support), bullying, and stigma. Many autistic people thrive in supportive environments.
      *   **--> STOP & LABEL: Procedure CANNOT settle definitively.** The choice between "Disorder" and "Difference" hinges *entirely* on the weight given to intrinsic vs. contextual harm and the perspective taken (medical vs. social model). **This is a fundamental values judgment.**
      *   **Journalistic Imperative:** You *must* be explicit about this. Options:
          *   Use "Autism Spectrum Disorder (ASD)" (the current medical term) but immediately explain the controversy: "often described by the medical community as a disorder due to associated challenges, though many autistic people and advocates view it primarily as a neurological difference."
          *   Use "Autism" or "Autistic Spectrum" neutrally and discuss the concepts of difference, disability (social model), and the lived experience in your piece.
          *   Avoid using either term alone definitively without context. State: "Autism, diagnosed medically as Autism Spectrum *Disorder*, is increasingly understood by many as a neurological *difference*."

  **What the Procedure Cannot Settle (Explicitly Called Out):**
  1.  **The Threshold of "Significant" Harm (Step 2):** What level of risk or discomfort warrants a medical label? This involves values.
  2.  **Weighing Intrinsic vs. Social Harm (Step 3):** This is *the* core philosophical/political debate in many areas (autism, ADHD, some gender experiences, deafness). The procedure forces you to confront it but cannot resolve it objectively.
  3.  **Medicalization of Normal Experiences:** When does labeling a common experience (sadness, shyness, menopause) as a "disorder" become harmful? Step 1 helps, but societal norms heavily influence Step 3.
  4.  **Power Dynamics:** Who gets to define "dysfunction" and "harm"? (Professionals vs. patients, majority vs. minority groups). The procedure relies on consensus sources but doesn't challenge their authority.

  This procedure gives you a structured, defensible way to make these critical terminology choices under deadline pressure. It leverages factual anchors (dysfunction, harm evidence) while clearly isolating the inevitable value judgments, making your reasoning transparent to yourself and your readers. Remember Step 3 is where the deepest societal debates reside – don't shy away from naming that in your writing.
