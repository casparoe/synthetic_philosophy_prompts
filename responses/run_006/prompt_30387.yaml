prompt: |-
  I've read a bunch about HCH (humans consulting humans) and factored cognition and keep nodding along, but I've realized I don't actually know what criterion I'm running when I say a task "factors." So I want to reverse-engineer the principle from my own gut calls. Setup: by factored cognition I mean the idealized thing where a big cognitive job gets split into chunks small enough that each worker only sees a little slice, plus some shallow integrator that combines the outputs. Assume the workers are competent humans, communication is limited, and the question is whether a decomposition exists that doesn't lose the thing you were trying to do.

  Here are my verdicts, as honestly as I can report them:

  - Translating a 400-page novel: factorable. One translator per chapter, a glossary, one continuity/style editor at the end; it comes out fine.
  - Writing a new novel: not factorable. The voice and the plot have to be held together in one head; if you farm out chapters it reads like it.
  - Checking a 10,000-row spreadsheet against source documents: factorable. Pure grind, split the rows.
  - Finding a proof of a hard theorem: not factorable. The key move is one insight that only happens when one person has the whole problem in their head.
  - Checking a proof that's already written: factorable. Each step can be checked against the lines above it with a small amount of local context.
  - Grading short-answer exam questions: factorable. One grader per question, nothing lost.
  - Debugging a subtle race condition in a large codebase: not factorable. The bug lives in the interaction between components, and no single slice contains it.
  - Designing a programming language: not factorable. Every feature interacts with every other feature; someone has to hold the whole design.
  - Writing a two-thousand-line CRUD web app from a detailed spec: factorable. Split the endpoints, the templates, the tests.
  - Diagnosing a patient with several interacting chronic conditions: not factorable. The symptoms only add up to one picture if someone holds all of them.

  The pair that bothers me is translation vs. novel-writing. Both are long-form text with global constraints — voice, continuity, plot — so why does one factor and the other doesn't? I can feel the difference but I cant state it. Proof-finding vs. proof-checking feels like the same difference in miniature.

  Is there a single principle that gets all ten, or close? What does it say about cases I haven't listed — writing a season of a TV show, doing a complex tax audit, synthesizing a research literature, planning a wedding? And which of my verdicts should I give up if the cleanest principle won't cover them?
reasoning: |-
  Okay, the user is trying to understand the principle behind when a task can be factored—split into smaller chunks handled by different people without losing quality. They provided ten examples with their verdicts on whether each task is factorable or not. The main puzzle is why translating a novel is factorable but writing one isn't, even though both involve long-form text with global constraints.

  First, I need to recall what factored cognition means. It's about breaking down a big task into smaller parts that can be handled independently, with a shallow integrator combining the results. The key is whether the task can be decomposed without losing essential elements that require holistic understanding.

  Looking at the examples, the user's verdicts show a pattern. Tasks like translation, checking spreadsheets, proof-checking, grading, and writing a CRUD app are factorable. These seem to have well-defined inputs and outputs, clear rules, or modular components. On the other hand, novel writing, theorem proving, debugging race conditions, language design, and medical diagnosis aren't factorable. These require deep integration, where understanding interactions between parts is crucial.

  The translation vs. novel writing pair is interesting. Both have global constraints like voice and plot. But translation starts with a complete source, so the structure is already there. Translators follow the existing plot and style guidelines, whereas novel creation involves generating cohesive elements from scratch, needing one mind to maintain coherence. That makes sense.

  Proof-finding vs. proof-checking is similar. Checking has existing steps to verify locally, while finding requires creative insight that connects disparate ideas. 

  Debugging a race condition involves interactions between components, which aren't captured in isolated slices. Designing a programming language requires seeing how features interact, which is hard to modularize. Medical diagnosis needs synthesizing symptoms across systems, which a single person must integrate.

  The underlying principle might be about emergent properties or combinatorial interdependencies. If the task's essence comes from interactions between parts, it's harder to factor. For example, the novel's plot twists or character development emerge from the whole narrative. 

  For other cases: TV show writing might be partially factorable with a showrunner maintaining overarching vision. Tax audits could be split with a lead ensuring consistency. Research synthesis needs integration but could use structured methods. Wedding planning has modular tasks but requires coordination for cohesion.

  The user might need a clear criterion. The "combinatorial interdependencies" concept explains when tasks resist decomposition. If the core challenge is in part-to-part interactions, factoring fails. Otherwise, it's possible with guidelines and integration. 

  The user's verdicts align well, except maybe grading short answers. If answers depend on context across questions, there might be issues, but generally, it's factorable. They should stick to their intuition but consider edge cases where interdependencies sneak in.
answer: |-
  Based on your examples and the core tension between translation and novel-writing, the unifying principle for "factorability" appears to be:

  **A task is factorable if its essential output and constraints can be fully encoded into explicit, modular specifications or inputs that are *independent* of the core generative/insight process, *without* requiring deep, holistic understanding of emergent, combinatorial interdependencies during the core work.**

  Let's break down this principle and see how it applies to your examples:

  1.  **The Core Idea:**
      *   **Factorable:** The "hard part" (generation, checking, execution) can be done *without* needing to constantly reason about the complex, unpredictable interactions *between* the chunks. Specifications, inputs, and rules are clear and modular. The integrator's job is shallow combination or consistency checking, not deep synthesis.
      *   **Not Factorable:** The "hard part" *is* understanding, generating, or diagnosing the unpredictable, emergent interactions *between* components/ideas/facts that only become apparent when holding the whole system/problem in mind. The output or solution *depends* on navigating these interdependencies.

  2.  **Applying the Principle to Your Verdicts:**

      *   **Translating a Novel (Factorable):**
          *   *Input is Modular & Spec Exists:* The source text (plot, voice) is the *complete, explicit input*. The "spec" (glossary, style guide) encodes global constraints *externally*. Translators focus on rendering *their module* (chapter) against this fixed input/spec. The interdependencies (plot/voice) are *provided*, not synthesized by them.
          *   *Integrator is Shallow:* The editor ensures consistency against the *existing* source/spec, not inventing new coherence.
      *   **Writing a Novel (Not Factorable):**
          *   *Emergent Interdependencies are the Core:* The plot twist in chapter 10 *must* subtly foreshadow the climax in chapter 30. A character's motivation evolves based on interactions across the whole story. The "voice" emerges from consistent subtle choices. These interdependencies *are* the creative core and cannot be fully pre-specified. Holding the whole evolving narrative is essential.
      *   **Checking Spreadsheet (Factorable):** Each row is independent. The rule ("match source doc") is explicit and modular.
      *   **Finding a Hard Proof (Not Factorable):** The key insight often bridges distant concepts or reveals a hidden structure *across* the whole problem. The interdependencies *are* the solution.
      *   **Checking a Written Proof (Factorable):** Each step verification depends only on explicit prior steps and rules (modular input). No need to hold the whole proof's "meaning" deeply, just local validity.
      *   **Grading Short-Answer (Factorable):** Each question is independent. The rubric (spec) defines correctness per module.
      *   **Debugging Subtle Race Condition (Not Factorable):** The bug *is* the interaction between components (threads, processes, state). No single "slice" contains the fault; it emerges from the combination. Diagnosing requires simulating/understanding the whole interaction.
      *   **Designing a Programming Language (Not Factorable):** Feature X's usability *depends critically* on how it interacts with features Y and Z under edge cases. Trade-offs are global. The design coherence emerges from understanding all potential interactions simultaneously.
      *   **Writing CRUD App from Detailed Spec (Factorable):** The spec modularizes endpoints, templates, tests. Dependencies are explicit (API contracts). Work is mostly independent implementation against spec.
      *   **Diagnosing Complex Patient (Not Factorable):** Symptom A + Symptom B + Medication C interact in a non-linear way. The "diagnosis" *is* the integrated understanding of how these separate factors combine uniquely in this patient. No module contains the answer; it emerges from the whole picture.

  3.  **The Translation vs. Novel-Writing Distillation:**
      *   Both have global constraints (voice, plot).
      *   **Translation:** The global constraints are *inputs* (source text) or *explicit rules* (glossary/style guide) provided *to* the modular workers. The workers don't *create* the coherence; they *follow* it.
      *   **Novel-Writing:** The global constraints (coherent plot, consistent voice) *are the emergent output of the creative process itself*. They cannot be fully specified upfront for modular workers. The coherence must be generated and held *during* the core work.

  4.  **Proof-Finding vs. Proof-Checking (Same Principle):**
      *   **Finding:** Requires generating novel connections *across* the entire conceptual space of the problem. Interdependencies are the path to the solution.
      *   **Checking:** Follows explicit, locally verifiable rules applied to pre-existing steps. Interdependencies are managed by the proof's structure, not the checker's insight.

  5.  **Applying the Principle to Your New Cases:**
      *   **Writing a Season of a TV Show:** **Partially Factorable, but Needs Strong Integrator.** Episodes are modules, but overarching plot, character arcs, and tone require deep holistic integration. Writers' rooms work because of intense collaboration and a showrunner holding the whole vision. *Leans "Not Factorable"* per your strict definition (single integrator, limited communication). Strong bible/spec helps but isn't sufficient alone.
      *   **Doing a Complex Tax Audit:** **Factorable with Caveats.** Can split transactions/accounts (modules). Rules are codified (tax law). However, complex interrelated transactions *might* require integrator synthesis. *Generally Factorable* if well-managed with clear assignment and escalation paths for interdependencies.
      *   **Synthesizing a Research Literature:** **Not Factorable.** The synthesis *is* identifying the connections, contradictions, and gaps *between* papers. Splitting papers loses the core value. Requires holding many concepts simultaneously to find emergent themes.
      *   **Planning a Wedding:** **Factorable.** Venue, catering, flowers, music are largely modular tasks with clear specs ("feed 100 people", "blue color scheme"). A coordinator ensures logistics fit together (shallow integration). Interdependencies (timeline) are manageable as constraints.

  6.  **Which Verdicts Might Need Refinement?**
      Your list is remarkably consistent with the principle. The only minor tension is:
      *   **Grading Short-Answer:** *Mostly Factorable*, but if questions subtly build on each other or require comparative judgment across answers, some holistic awareness *might* be needed for fairness/consistency. However, for pure factual recall or clearly rubric'd questions, it's solidly factorable.
      *   **CRUD App:** *Factorable if the spec is truly detailed and stable.* If the spec is vague or changes frequently, interdependencies and emergent design choices can creep in, pushing it towards "Not Factorable" in practice. Your verdict assumes the ideal detailed spec.

  **Conclusion:**

  Your intuition points to **combinatorial interdependencies** as the key. When the core challenge of the task *is* understanding, generating, or diagnosing the *unpredictable interactions between components*, it resists factoring. The solution or output *emerges* from holding the whole.

  When the core challenge is applying known rules, rendering against a fixed input, or verifying local properties according to explicit criteria *within* well-defined modules, factoring succeeds. The integrator manages combination, not deep synthesis.

  This principle explains your translation/novel split: translation uses the novel itself as the fixed input encoding all interdependencies; novel writing requires generating those interdependencies from scratch within one mind. Stick with your gut – it's identifying this crucial distinction clearly.
