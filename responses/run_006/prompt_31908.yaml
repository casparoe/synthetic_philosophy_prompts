answer: |-
  I appreciate your engagement with this notoriously slippery text. The White Horse Dialogue is indeed a locus classicus of Chinese philosophical sophistry, and your difficulties are well-founded. Let's break this down step by step, addressing both your queries in British English.

  ### 1. What does "a white horse is not a horse" actually claim?
  The statement is **not** primarily about identity, predication, or extension in the modern Western philosophical sense. Instead, it is a meta-linguistic claim about *naming conventions* and *conceptual boundaries* within Gongsun Long's framework. Here’s a precise reading:

  - **The Core Argument (B's First Speech):**  
    B distinguishes between two naming functions:  
    - "Horse" (馬) names *shape/form* (形).  
    - "White" (白) names *colour* (色).  
    B’s key axiom: **"That which names colour does not name shape"**.  
    Thus, "white horse" combines two distinct naming acts (colour + shape), while "horse" performs only one (shape).  

    Crucially, "a white horse is not a horse" means:  
    > **The compound concept "white horse" does not have the same *denotative scope* or *conceptual function* as the simple concept "horse".**  

    It is **not** claiming that white horses aren’t members of the equine species (B concedes they *are* horses in A’s second speech). Rather, it asserts that the *term* "white horse" cannot be substituted for the *term* "horse" in linguistic or conceptual operations because they encode different criteria. This makes it a **semantic and conceptual** argument about how language carves up reality.

  - **Why it’s not sophistry (and genuinely interesting):**  
    Gongsun Long exposes how compound terms create new conceptual categories with stricter criteria. "Horse" denotes *all* horses (extension: brown/black/white). "White horse" denotes a *subset* (extension: only white horses).  
    - **Identity?** No—it’s not about object identity.  
    - **Predication?** Partly—it shows "X is a white horse" entails *more* than "X is a horse".  
    - **Semantics of compounds?** Yes—this is central. "White horse" ≠ "white" + "horse" as a mere sum; it creates a new concept with its own boundaries.  
    The interest lies in its proto-logical exploration of **intension vs. extension**: "Horse" and "white horse" have different intensions (defining properties), hence different extensions. This prefigures later debates about reference and meaning.

  ### 2. Analysing the "Requesting Horses" Argument (B’s Second Speech)
  B’s argument is **both semantic and pragmatic**, turning on the *use* of terms in communicative contexts. Here’s a step-by-step breakdown:

  #### The Argument Structure:
  1. **Premise 1 (Pragmatic Observation):**  
     - If you request "a horse" (求馬), brown/black horses *are* acceptable (可致).  
     - If you request "a white horse" (求白馬), brown/black horses *are not* acceptable (不可致).  
     → *Conclusion 1:* The conditions for satisfying the two requests differ.  

  2. **Premise 2 (Semantic Assumption):**  
     - If "white horse" (白馬) meant the *same* as "horse" (馬), then requesting either should have identical satisfaction conditions.  
     → *Logical Contradiction:* Premise 1 shows the satisfaction conditions *differ*, so "white horse" cannot mean the same as "horse".  

  3. **Premise 3 (Conceptual Consequence):**  
     - Brown/black horses can fulfil "there is a horse" (有馬) but not "there is a white horse" (有白馬).  
     → *Conclusion 2:* "Horse" and "white horse" have different extensions (*and* intensions).  

  4. **Final Inference:**  
     - Ergo: "A white horse is not a horse" (白馬非馬).  

  #### Key Philosophical Moves:
  - **Pragmatic Test for Semantic Difference:** B uses real-world *acceptability conditions* (可否致) to demonstrate extensional divergence. This is pragmatic (about language *use*) but proves a semantic point (about meaning/reference).  
  - **Co-extensiveness Refuted:** The argument is valid **only if** "is not a horse" means "is not *coextensive with* 'horse'". B shows:  
    - Extension of "horse" = {all horses}.  
    - Extension of "white horse" = {white horses} ⊂ {all horses}.  
    Since {white horses} ≠ {all horses}, they are not coextensive.  
  - **No Equivocation:** The argument holds if we consistently read:  
    - "Is a horse" = "falls under the extension of 'horse'".  
    - "Is not a horse" = "does not share the *same extension* as 'horse'".  
    B is *not* denying that white horses are horses (extensionally included); he’s denying that the *terms* are synonymous or interchangeable.  

  #### Where Critics Might Object:
  - **Ambiguity in "Is Not":** A might interpret "is not" as "is not a *member of* the category 'horse'"—which B doesn’t dispute. B uses "is not" to mean "is not *identical to* the category 'horse'". This shift (from membership to category-identity) is subtle but defensible in context.  
  - **Pragmatic Overreach?** One could argue that *requesting* a white horse implies a *preference*, not a semantic rule. B anticipates this by framing it as a logical test: if the terms were identical, substituting one request for the other should yield identical outcomes. The empirical difference proves semantic divergence.  

  ### Conclusion: Why This Isn’t Mere Sophistry
  Gongsun Long’s argument is profound because it:  
  1. **Exposes Language’s Conceptual Precision:** Compound terms create new intensional criteria, altering extension.  
  2. **Anticipates Modern Semantics:** It explores how meaning determines reference, prefiguring Frege’s sense/reference distinction.  
  3. **Uses Pragmatics to Reveal Semantics:** The "requesting" argument shows language’s function in social coordination, proving meaning through use.  

  The text "slides" between readings because it operates at the intersection of logic, language, and metaphysics—a deliberate feature, not a flaw. Far from sophistry, it’s a rigorous (if stylised) inquiry into how language structures reality. Your struggle pinpoints its genius: it forces us to confront ambiguities we take for granted in ordinary speech.  

  *Recommended Reading:*  
  - Fraser, C. (2023). "Language and Logic in Early China" (on intensional contexts).  
  - Harbsmeier, C. (1998). *Language and Logic in Traditional China* (pp. 272–289).  
  - Cheng, C.-Y. (1997). "Philosophical Significance of Gongsun Long".
