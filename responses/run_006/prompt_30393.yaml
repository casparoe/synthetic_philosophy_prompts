answer: |-
  ### Final Exam Question: Epistemology & Philosophy of Mind  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 800–1000 words  
  **Answer the following:**  

  > Reconstruct Gilbert Ryle’s regress argument *as an objection to intellectualism* (i.e., the view that knowing-how is a species of knowing-that). Next, explain how Jason Stanley and Timothy Williamson attempt to block this regress by appealing to "practical modes of presentation." Does this move succeed in escaping the regress? Critically evaluate whether the regress reappears *within the practical mode of presentation itself*. If it does, what options remain for the intellectualist? Defend your answers with explicit reference to the texts.  

  ---

  ### Model Answer (798 words)  
  Ryle’s regress argument targets intellectualism’s core claim that knowing-how (e.g., knowing how to ride a bike) reduces to knowing-that (e.g., knowing *that* certain propositions about bike-riding are true). He argues that if performing an intelligent action requires contemplating a proposition (e.g., "I should pedal now"), this contemplation must itself be guided by another proposition (e.g., "I should contemplate when to pedal"), generating an infinite, vicious regress. For Ryle, this renders intellectualism absurd: action would require an impossible chain of prior intellectual acts, paralyzing performance. Crucially, the regress arises because intellectualism treats *every* instance of know-how as requiring *further* propositional knowledge to apply the initial knowledge. Ryle concludes that know-how must instead be a distinct, non-propositional capacity—a disposition embodied in successful practice.  

  Stanley and Williamson (2001) reject this. They agree that know-how involves propositional knowledge but argue Ryle’s regress misidentifies *how* propositions are grasped. For them, knowing-how is knowing-that *under a practical mode of presentation*. A "mode of presentation" is a Fregean concept: a way of thinking about a proposition that doesn’t alter its truth-conditional content but affects how it is accessed. For example, knowing *that* Hesperus is Phosphorus involves two modes (evening-star vs. morning-star) for the same astronomical fact. Similarly, knowing *how* to ride a bike involves grasping the proposition *that w* is a way to ride a bike (where *w* is a contextually relevant method) *under a practical mode*. This mode is non-inferential, action-oriented, and tied to embodied skills—it allows agents to deploy knowledge directly in practice without contemplating intermediate propositions. Stanley and Williamson claim this blocks Ryle’s regress: since practical modes enable direct application, no further "knowing-that" is needed to execute the action.  

  However, this move fails to escape the regress because the *grasping* of a practical mode of presentation itself presupposes practical know-how. To see this, consider what a "practical mode" entails. Stanley and Williamson characterize it as a way of conceiving a proposition that is "distinctively practical" (e.g., conceiving bike-riding *as* a bike-riding method). But *grasping* this mode—understanding what it is to conceive something *as a way to act*—requires practical competence. For instance, to entertain the proposition *that w* is a way to ride a bike *under a practical mode*, one must already possess the ability to *recognize or execute* bike-riding methods. If I lack bike-riding know-how, I cannot coherently grasp the practical mode for bike-riding propositions; my understanding would be detached from action, collapsing into a theoretical mode. Thus, intellectualism now faces a regress *within* the mode: to grasp the practical mode for *P*, I need prior know-how to access that mode, but if know-how reduces to knowing-that under a practical mode, this prior know-how itself requires grasping *another* practical mode, ad infinitum. As Alva Noë (2005) and Ellen Fridland (2012) emphasize, modes of presentation are not self-applying—they require a background of sensorimotor skills to be meaningfully deployed. Stanley and Williamson’s framework implicitly relies on this pre-existing know-how, reintroducing Ryle’s worry.  

  If this critique holds, intellectualists have two remaining options. First, they might *embrace a limited regress* as non-vicious. Stanley (2011) suggests that practical modes could be "primitive" components of propositional attitudes, requiring no further know-how for their grasp. This posits that understanding a practical mode is a brute cognitive capacity—not reducible to, or dependent on, other knowledge. However, this risks ad hocness: it abandons intellectualism’s reductive aim by treating practical modes as sui generis, effectively conceding Ryle’s anti-reductionism. Second, intellectualists could adopt a *minimal propositionalism*. For example, they might argue that know-how reduces to *non-conceptual* or *implicit* propositional knowledge (e.g., subpersonal representations), avoiding regress by decoupling know-how from conscious contemplation. Yet Fridland objects that this still presupposes practical abilities to implement such knowledge—e.g., subpersonal "propositions" about muscle movements require bodily know-how to execute. Both options struggle: the first collapses into dualism about knowledge; the second merely relocates the regress.  

  Ultimately, Stanley and Williamson’s appeal to practical modes of presentation does not resolve Ryle’s regress because it covertly depends on the very know-how it aims to reduce. The intellectualist’s best path is to refine minimal propositionalism, perhaps by integrating embodied cognition (e.g., holding that practical modes emerge from sensorimotor engagement), but this remains vulnerable to Ryle’s core insight: that intelligent action cannot be fully codified in propositions without presupposing practice.  

  **References:**  
  - Fridland, E. (2012). Knowing-how: Problems and Considerations. *European Journal of Philosophy*.  
  - Noë, A. (2005). Against Intellectualism. *Analysis*.  
  - Stanley, J., & Williamson, T. (2001). Knowing How. *Journal of Philosophy*.  
  - Ryle, G. (1949). *The Concept of Mind*.  

  ---  
  ### Marking Scheme (Total: 25 points)  
  **A-Range (20–25):**  
  - ✅ **Clear reconstruction of Ryle’s regress *as an anti-intellectualist argument*** (4–5 pts).  
  - ✅ **Precise explanation of S&W’s practical mode of presentation** (4–5 pts), including its Fregean roots and role in blocking regress.  
  - ✅ **Critical evaluation showing *why* the regress reappears within the mode** (6–7 pts), with emphasis on the "grasping problem" (e.g., practical modes require pre-existing know-how).  
  - ✅ **Analysis of intellectualist fallback options** (4–5 pts), citing specific alternatives (e.g., primitive modes, minimal propositionalism) and their flaws.  
  - ✅ **Structure & Insight**: Coherent argument, textual engagement, originality in diagnosing the mode’s dependency on practice.  

  **B-Range (15–19):**  
  - ◐ Adequate but less detailed regress reconstruction (3–4 pts).  
  - ◐ Correct but superficial account of practical modes (e.g., mentions they "prevent contemplation" without Fregean context) (3–4 pts).  
  - ◐ Identifies regress persistence but lacks depth on *how* it arises in modes (e.g., states "modes need know-how" without explaining *why*) (4–5 pts).  
  - ◐ Lists intellectualist options but with limited critique (2–3 pts).  
  - ◐ Competent structure but minor gaps in logic/textual support.  

  **C-Range (10–14):**  
  - ❌ Weak regress reconstruction (e.g., misstates it as about "infinite teachers" not propositional application) (1–2 pts).  
  - ❌ Incomplete/incorrect explanation of practical modes (e.g., calls them "non-propositional" or confuses with skills) (1–2 pts).  
  - ❌ Fails to evaluate regress persistence OR asserts S&W’s success without argument (1–3 pts).  
  - ❌ Omits/glosses over intellectualist fallbacks (0–1 pt).  
  - ❌ Disorganized, summary-heavy, or ignores key texts.  

  **Most Common Mistake (One-Sentence Note):**  
  > *Students often claim "practical modes avoid the regress because they’re not propositions" without explaining what a mode *is* (a way of grasping propositions) or why *grasping* such a mode might itself require unreduced know-how.*  

  ---  
  **Rationale for Design**: This question forces evaluation by:  
  1. Framing the regress as an *objection to intellectualism* (not just Ryle’s view).  
  2. Demanding scrutiny of "practical mode" mechanics (exposing the "grasping" problem).  
  3. Requiring alternatives, pushing beyond summary. It rewards students who see that intellectualism’s success hinges on whether modes *internalize* or *displace* practice.
