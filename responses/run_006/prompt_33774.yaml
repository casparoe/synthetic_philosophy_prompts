answer: |-
  ## The Predicate's Plight

  For years we've watched the emerald's constant hue,
  In sunlight held, examined, and made known.
  Each flawless specimen of verdant view
  Confirms the thought that green has been alone
  In dressing every gem the earth has grown.
  Thus future stones, by inductive right,
  Must follow suit—this path is smoothly shown—
  And glow with greenness when brought to the light.

  But lo! A word arrives, a riddle new:
  Define as **grue** what's **green** when first observed
  *Before* time **t**, yet **blue** if first in view
  *Beyond* that hour—a pattern now perturbed!
  The same green stones, by **t** observed, conferred
  Equal support: both hypotheses are true.
  What rule selects the **green** path we preferred,
  When evidence affirms the **blue** one too?

  ---

  **Notes on Structure & Philosophy:**

  1.  **Octave (Naive Induction):** Lines 1-8 establish the smooth flow of observation (emeralds always **green**), the building of confidence ("confirms the thought", "inductive right"), and the unquestioned projection into the future ("Must follow suit", "glow with greenness"). The language is stable and naturalistic ("constant hue," "verdant view," "smoothly shown").
  2.  **Volta (The Turn):** "But lo! A word arrives..." marks the sharp conceptual turn at the start of the sestet (line 9), introducing the disruptive predicate "grue."
  3.  **Sestet (The Paradox):** Lines 9-14 define "grue" precisely ("**green** when first observed / *Before* time **t**, yet **blue** if first in view / *Beyond* that hour") and establish the symmetry ("The same green stones... / Equal support: both hypotheses are true"). The disturbing consequence ("the **blue** one too") lands forcefully.
  4.  **Closing Couplet (The Problem):** Lines 13-14 explicitly state the core problem: why prefer "green" when the evidence equally confirms "grue," leading to the opposite prediction (**blue** after **t**)? "What rule selects..." directly poses Goodman's challenge about projectibility without circular appeal to past success.
  5.  **Accuracy:** Key terms (**emerald, green, grue, blue, t, observed, evidence, hypotheses**) are used precisely as defined. The poem captures the definition of grue, the equivalence of evidence supporting "all green" and "all grue" for observations before t, and the resulting conflicting predictions about emeralds observed *after* t. The central question of projectibility licensing is the final focus.
