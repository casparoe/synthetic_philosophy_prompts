prompt: |-
  Please give me your credence that the present century is the hinge of history, where I mean this precisely: the expected influence of actions taken between roughly 2000 and 2100 on the long-run trajectory of humanity over the next hundred thousand years or more is at least an order of magnitude greater than the influence of actions taken in a typical century of human history. A friend puts his credence at 0.3 and I put mine at 0.7, and we cannot locate the source of the disagreement. Decompose the question into its load-bearing sub-questions — for example, the probability that this century contains a transition that locks in the broad shape of the far future (transformative AI, stable institutions, cultural or value lock-in); the probability that the century is unusually influential even absent such a transition; the probability that the true hinge lies in the past or in some future century; and the probability that there is no well-defined hinge at all because influence is too evenly spread across centuries. Assign a rough probability to each sub-question, show how they combine into your overall credence, and then state which sub-question most plausibly explains the gap between the 0.3 and 0.7 views, and what evidence or argument would most move you on that sub-question.
