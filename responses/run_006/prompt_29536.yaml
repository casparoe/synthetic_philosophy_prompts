answer: |-
  This precise configuration—where a rule change alters or repeals the very rule that authorized its own adoption—does not have a single, universally established name in game theory, law, or philosophy. However, it's a well-recognized paradox related to **self-referential rule changes** or the **bootstrapping problem** in rule systems.

  The closest established concepts are:

  1.  **Self-Amendment:** A rule that explicitly allows for its own amendment. While related, this is broader and doesn't inherently imply the paradox you describe. A self-amendment clause *enables* the problematic act but isn't the paradox itself.
  2.  **The "Self-Embracing" Amendment (H.L.A. Hart):** Legal philosopher Hart distinguished between rules that control future acts ("static") and rules that empower change ("dynamic"). A "self-embracing" rule is one that can be used to change *itself*. This is the *mechanism* enabling the paradox but isn't the name for the *resulting conflict*.
  3.  **Retroactive Invalidation Paradox:** This captures the core issue – the act, by succeeding, seems to destroy the legal basis that made it valid *at the moment it occurred*, creating a logical loop.

  **Coined Term: Self-Annulment Paradox (or Auto-Invalidating Rule Change)**

  *   **Definition:** The Self-Annulment Paradox occurs when a rule change, successfully adopted under the specific procedural rule R, simultaneously alters or repeals rule R itself in such a way that the validity of the act adopting the change becomes logically questionable. The paradox arises because the act depends on R for its authority, but the outcome of the act is the abolition or alteration of R, potentially retroactively undermining the act's own foundation. The paradox is most acute when the act passes by the *exact minimum threshold* defined by R and then changes that threshold.
  *   **Boundary Cases:**
      *   **Clear Passage (No Paradox):** If the change passes with *more* than the required threshold (e.g., 80% votes for changing a 2/3 rule), its validity under the old rule is unambiguous, even if the new rule lowers the threshold. The act was securely authorized.
      *   **Failure (No Paradox):** If the change fails to meet the threshold under the old rule, it doesn't pass. The rule remains unchanged, and the paradox doesn't arise.
      *   **Amendment Not Affecting Authorization (No Paradox):** If the rule change *doesn't* alter the rule under which it was passed (e.g., changing scoring rules via a 2/3 vote, leaving the 2/3 rule intact), it's just an ordinary amendment. Validity is clear.
      *   **Rule Conflict Without Self-Annulment:** If two rules valid *at the same time* conflict (e.g., "All players wear red" and "All players wear blue"), it's a standard rule conflict. The Self-Annulment Paradox specifically involves a *temporal* conflict: the rule *at the time of the act* versus the rule *resulting from the act* as it applies to *that same act*.
      *   **Explicitly Retroactive Rule Change:** If a *new* rule, passed under valid procedures, *explicitly* declares a *past* act valid or invalid ("This act retroactively validates the vote held last Tuesday"), that's ordinary retroactivity. The Self-Annulment Paradox involves an act that *implicitly* or *necessarily* calls its *own* validity into question by its *own* success, without explicit retroactive language.

  **Distinguishing from Related Concepts:**

  1.  **Ordinary Amendment:**
      *   **Distinction:** An ordinary amendment uses an existing rule to change a *different* rule or an *unrelated aspect* of the same rule system. The rule authorizing the change remains intact after the change is made, providing a clear, continuing basis for the act's validity.
      *   **Example:** Using a 2/3 vote rule to change the starting resources. The 2/3 vote rule remains valid.

  2.  **Rule Invalidating Past Acts Retroactively:**
      *   **Distinction:** This involves a *new*, validly enacted rule that explicitly targets *past actions* performed under *different*, previously valid rules and declares them void or changes their consequences. The paradox you describe involves a *single act* whose validity under the rule *in force at the time* is potentially undermined by the *result* of that *same act*. It's self-invalidation, not invalidation of separate past acts.
      *   **Example:** A new rule passed by simple majority stating "All points scored in the previous round using the old movement rules are forfeit." This explicitly targets past acts.

  3.  **Plain Conflict Between Two Simultaneously Valid Rules:**
      *   **Distinction:** This conflict exists when two rules that are both currently in force and applicable to the same situation impose contradictory requirements. The conflict is spatial ("Which rule applies right now?"), not temporal ("Was the act that created the new situation valid in the first place?"). The Self-Annulment Paradox creates uncertainty about the *validity of the transition* between rule states, not a conflict within a single rule state.
      *   **Example:** Rule A: "Players must move clockwise." Rule B (created later but valid now): "Players must move counter-clockwise." Both exist now and conflict.

  **Resolution Approaches (as you observed):**

  1.  **The Change Stands (Common Practice/Effectiveness):** The act was valid when performed under the rules in force at that moment. The new rules take effect *after* the successful vote. This is the most practical and common resolution ("de facto validity").
  2.  **The Change is Void Ab Initio (Strict Validity):** Since the rule authorizing the change was abolished by the change itself, the act had no lasting legal foundation. The old rule remains in force. This leads to instability if the vote result was close to the threshold.
  3.  **Both Rules Remain (Logical Paradox/Deadlock):** An attempt to acknowledge the validity of the act under the old rule while recognizing the new rule exists, but this creates an immediate, unresolvable conflict about which rule governs *now*.

  **In Summary:** While mechanisms like "self-amendment" or "self-embracing rules" enable it, the specific paradox of an act undermining its *own* validity is best described as the **Self-Annulment Paradox** or an **Auto-Invalidating Rule Change**. It's distinct from ordinary amendments (which don't touch their authorization), explicit retroactive invalidation (which targets separate past acts), and simultaneous rule conflicts (which occur within a single rule set). Its core is the **temporal self-reference** inherent in changing the rule you are currently using to authorize that change, especially when passing by the minimum margin.
