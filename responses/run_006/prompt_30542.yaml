  - **Fragility**: Small changes in `d_A` or `u_A_max` cause large allocation swings.  

  ---

  ### What the Procedure Can and Cannot Do  
  - **Strengths**:  
    - Ensures **proportional fairness** by accounting for teams' potential gains.  
    - **Automates contentious decisions** using auditable math.  
    - Adapts to **asymmetric changes** in resources/needs (unlike Nash).  
  - **Limitations**:  
    - **Assumes utilities are cardinal and comparable**. In practice, teams may exaggerate or use non-comparable units (e.g., "accuracy" vs. "throughput").  
    - **Breaks down with non-convex feasible sets** (common in engineering).  
  - **Operational Perversity Example**:  
    In Case 3, KS allocates 92.5 units to Team A (already well-resourced) and 7.5 to Team B (starved). While "fair" by KS (equal normalised gains), it may harm overall productivity by underfunding Team B’s high-potential project.  

  ### Final Recommendation  
  Use the KS solution for recurring allocations with stable utility functions. For complex/non-convex cases, combine KS with human oversight. Always require teams to justify utility claims with data (e.g., historical performance metrics).  

