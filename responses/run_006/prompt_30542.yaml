  ### Kalai–Smorodinsky Bargaining Solution: Implementation Guide for Platform Engineers

  This guide provides a step-by-step procedure to implement the Kalai–Smorodinsky (KS) solution for dividing fixed resources (e.g., GPU hours, bandwidth) between two engineering teams. The KS solution ensures **proportional fairness** by equalising each team's *normalised gain* relative to their best possible outcome, preventing one team from dominating at the other's expense.

  ---

  ### Step-by-Step Procedure
  #### 1. **Input Collection**  
  Collect three inputs from each team:  
  - **Disagreement Point (d₁, d₂)**:  
    The minimum utility each team accepts if no agreement is reached.  
    - *Elicitation*: Ask teams, *"What is the minimum allocation (e.g., GPU hours) required to keep your service operational (e.g., meet SLAs)?"*  
    - *Format*: Cardinal numbers (e.g., "Team A: 20 GPU hours"). If teams provide rankings (e.g., "Option X is better than Y"), convert to cardinal by pairwise comparisons (e.g., assign 0–100 utility scores).  

  - **Maximum Feasible Gain (u₁_max, u₂_max)**:  
    The best utility a team can achieve if given the *entire resource*, while the other team gets *just their disagreement point*.  
    - *Elicitation*: Ask, *"What is the highest utility you can achieve if you receive all spare resources (after the other team's minimum is met)?"*  
    - *Format*: Cardinal numbers. If teams provide rough estimates, use sensitivity analysis (e.g., test ±10% ranges).  

  - **Utility Function (u₁(x), u₂(x))**:  
    A function mapping allocation (x) to utility (e.g., performance, revenue impact).  
    - *Elicitation*: Ask teams to provide:  
      - **Cardinal utilities**: "What utility do you get at allocation X? At Y?" (e.g., "50 GPU hours → 80% model accuracy").  
      - **Rankings**: If only rankings are available, fit a utility curve using ordinal regression (e.g., Bradley-Terry model).  
    - *Default*: If no function is provided, assume linear utility (e.g., double allocation = double utility).  

  #### 2. **Feasible Set Construction**  
  - **Feasible Set (S)**: All possible (u₁, u₂) utility pairs achievable under the resource constraint.  
  - **Pareto Frontier**: Subset of S where no team can gain without the other losing.  
  - *Computation*:  
    ```python
    import numpy as np

    def compute_pareto_frontier(resource_total, u1_func, u2_func, d1, d2):
        # Discretise allocations (e.g., 1000 points)
        team1_allocations = np.linspace(d1, resource_total - d2, 1000)
        team2_allocations = resource_total - team1_allocations
        
        # Compute utilities
        utilities = [(u1_func(x1), u2_func(x2)) for x1, x2 in zip(team1_allocations, team2_allocations)]
        
        # Filter points where u1 ≥ d1 and u2 ≥ d2
        feasible_utilities = [(u1, u2) for u1, u2 in utilities if u1 >= d1 and u2 >= d2]
        
        # Find Pareto frontier: points not dominated by others
        pareto_frontier = []
        for u1, u2 in feasible_utilities:
            if not any((u1 < other_u1 and u2 <= other_u2) or (u1 <= other_u1 and u2 < other_u2) for other_u1, other_u2 in feasible_utilities):
                pareto_frontier.append((u1, u2))
        return sorted(pareto_frontier, key=lambda x: x[0])
    ```

  #### 3. **Kalai–Smorodinsky Point Calculation**  
  - **Normalised Gains**:  
    For a utility pair (u₁, u₂), compute:  
    `gain₁ = (u₁ - d₁) / (u₁_max - d₁)`  
    `gain₂ = (u₂ - d₂) / (u₂_max - d₂)`  
  - **KS Point**: The Pareto-efficient point where `gain₁ = gain₂ = t` (maximises `t`).  
  - *Computation*:  
    ```python
    def ks_point(pareto_frontier, d1, d2, u1_max, u2_max):
        # Handle edge: denominator near zero (one team cannot improve)
        if abs(u1_max - d1) < 1e-6 or abs(u2_max - d2) < 1e-6:
            return handle_edge_cases(pareto_frontier, d1, d2, u1_max, u2_max)
        
        best_t = -1
        ks_u1, ks_u2 = None, None
        for u1, u2 in pareto_frontier:
            gain1 = (u1 - d1) / (u1_max - d1)
            gain2 = (u2 - d2) / (u2_max - d2)
            t = min(gain1, gain2)  # KS maximises this t
            if t > best_t:
                best_t = t
                ks_u1, ks_u2 = u1, u2
        return ks_u1, ks_u2
    ```

  #### 4. **Edge Cases**  
  - **Non-Convex Feasible Sets**:  
    KS assumes convexity. For non-convex sets, use the `min(gain1, gain2)` method above; it approximates KS but may not be exact.  
  - **Party Cannot Improve (uᵢ_max ≈ dᵢ)**:  
    Allocate them `dᵢ`, then maximise the other team's utility.  
  - **Multiple KS Points**:  
    Select the point with the highest `u₁ + u₂` (total utility).  
  - **>2 Parties**:  
    KS extends to n-parties but requires complex optimisation. Use [Nash Social Welfare](https://en.wikipedia.org/wiki/Nash_bargaining_game) instead.

  #### 5. **Judgement Calls vs. Automation**  
  - **Mechanical Steps**:  
    - Utility elicitation (if cardinal inputs exist).  
    - Pareto frontier computation.  
    - KS point calculation.  
  - **Judgement Calls**:  
    - Converting rankings to cardinal utilities.  
    - Validating team-provided `uᵢ_max` (e.g., cap implausible values).  
    - Handling non-convex sets or near-zero denominators.  
  - **Hand Off to Human When**:  
    - Teams dispute inputs (e.g., disagreement points).  
    - KS allocation violates operational constraints (e.g., kills a service).  

  #### 6. **KS vs. Nash Bargaining Solution (NBS)**  
  - **NBS Maximises**: `(u₁ - d₁) × (u₂ - d₂)`.  
  - **Key Difference**:  
    KS uses **ideal points (uᵢ_max)** to normalise gains, making it responsive to *asymmetric changes* in the feasible set.  
    - *Example*: If Team A’s maximum potential gain increases (e.g., new hardware), KS gives them more allocation; NBS may not.  
  - **When KS > NBS**:  
    Use KS when teams' bargaining power changes (e.g., one team’s projects scale faster).  

  ---

  ### Worked Examples  
  #### Case 1: GPU Hours (Training vs. Serving)  
  - **Resource**: 100 GPU hours/week.  
  - **Training Team (A)**:  
    - `d_A = 20` hours (saturates beyond 40 hours).  
    - `u_A(x) = 100 * (1 - e^(-0.1x))` (non-linear saturation).  
    - `u_A_max = u_A(100) = 100` (ideal).  
  - **Serving Team (B)**:  
    - `d_B = 30` hours (linear utility).  
    - `u_B(x) = 2x`.  
    - `u_B_max = u_B(70) = 140` (since A needs 30 for `d_B`).  
  - **KS Calculation**:  
    - Feasible set: Pareto frontier from `(u_A=43, u_B=140)` to `(u_A=100, u_B=60)`.  
    - Normalised gains equal at `t = 0.76`:  
      `u_A = 48.5` (→ 35 hours), `u_B = 130` (→ 65 hours).  
  - **Gaming**: Team A understates saturation (claims `u_A` saturates at 30 hours) to gain more.  

  #### Case 2: Bandwidth (Latency-Sensitive vs. Batch)  
