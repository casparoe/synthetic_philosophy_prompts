prompt: |-
  I keep meeting the frame problem in two guises, and I want to stop evaluating proposed solutions until I have a clear specification of what a solution has to do. One guise is representational: how a formalism should say what changes and what persists when an action occurs, without writing down every non-change by hand. The other is epistemological: how a finite agent should determine which of indefinitely many true facts are relevant to what it is about to do or predict. Please write the desiderata for a theory or formalism that claims to solve the frame problem, with the argument or case behind each requirement, and mark each as non-negotiable or as a preference of a particular camp. Address at least the following, and say explicitly if you think one of them is not a genuine requirement.

  - Default persistence: a system must be able to conclude that unmentioned facts persist across an event or action without being told so explicitly, and without enumerating frame axioms for every action-fluent pair.
  - The Yale shooting problem and its relatives: the system must select the intended model in which the gun stays loaded through a delay and the shot kills, while excluding the anomalous model in which the gun unloads itself during the delay and the victim survives; say which requirement does the excluding.
  - Defeasibility: the system must be able to withdraw earlier conclusions when new information arrives, and must say what it is about the later information that defeats a default rather than merely contradicting it.
  - Ramifications and qualifications: indirect effects and implicit preconditions must be handled without either missing the indirect effect or sliding back into exhaustive enumeration.
  - Relevance without enumeration: the system must determine which true facts bear on an action or query without an oracle and without searching through everything that happens to be true.
  - Tractability: the proposal must be usable in principle by a bounded agent or a real program, not merely correct in the limit.
  - The distinction between the two guises: the solution must not conflate the logical task of representing what persists with the epistemological task of knowing what matters, even if it addresses both.

  Then identify which pairs or triples of these requirements are jointly unsatisfiable, or nearly so. For example, does default persistence combined with complete temporal projection force multiple extensions, and does relevance combined with tractability admit any honest solution? This is the part I most want: the incompatibilities, not a forced synthesis. Finally, provide a short scorecard of how situation calculus with successor-state axioms, circumscription, default logic, and the event calculus fare against the list, and say which single requirement does the most work in excluding candidates.
reasoning: |-
  We are addressing the Frame Problem in two guises: representational (how to represent change and persistence without exhaustive frame axioms) and epistemological (how an agent determines relevance without exhaustive search). We are to set out desiderata for a solution and then evaluate how existing approaches fare.

  Desiderata:

  1. Default Persistence (Non-negotiable)
     - Requirement: The formalism must allow that a fluent (a property that can change over time) that is not mentioned as changed by an action is assumed to persist. This should be done without having to write down a frame axiom for every action-fluent pair (which is the original problem).
     - Argument: Without this, the representation becomes intractable for realistic domains because the number of frame axioms would be proportional to the product of the number of actions and fluents.

  2. Yale Shooting Problem (Non-negotiable)
     - Requirement: The formalism must select the intended model in which the gun remains loaded during a delay and the victim is killed by the shoot action, and must exclude the anomalous model in which the gun becomes unloaded during the delay (without any action) and the victim survives.
     - Argument: This is a litmus test for non-monotonic reasoning in temporal domains. The intended model must be the only one (or the preferred one) without having to add explicit axioms that rule out every possible anomaly. The requirement that excludes the anomalous model is the correct handling of the default that fluents persist unless there is a reason to change (so the gun should not unload itself during the delay) and the correct application of the effect of the shoot action (which requires the gun to be loaded).

  3. Defeasibility (Non-negotiable)
     - Requirement: The system must be able to retract a conclusion (e.g., that a fluent persists) when new information arrives. Moreover, it must provide a basis for why the new information defeats the default (rather than just being inconsistent with the conclusion). For example, if we learn that the gun was tampered with during the delay, we must be able to withdraw the conclusion that it remained loaded and explain that the new information (tampering) is an exception to the persistence default.
     - Argument: Without defeasibility, the system cannot handle exceptions and thus cannot adapt to new information. The requirement for a basis for defeat (beyond mere contradiction) is to ensure that the system has a structured way of handling exceptions (e.g., using priorities, specificity, etc.).

  4. Ramifications and Qualifications (Non-negotiable)
     - Requirement: The formalism must handle indirect effects (ramifications) and implicit preconditions (qualifications) without having to enumerate all of them exhaustively and without causing a combinatorial explosion.
     - Argument: In complex domains, actions have many indirect effects (e.g., turning on a light in a room might also illuminate objects in that room) and preconditions that are not explicitly stated (e.g., the gun must not be jammed for shooting to work). Explicitly listing all these is infeasible. The solution must therefore have a way to derive them from general rules (e.g., state constraints for ramifications and qualification rules for preconditions).

  5. Relevance without Enumeration (Non-negotiable)
     - Requirement: The system must determine which of the indefinitely many true facts are relevant to a particular action or query without having an oracle and without exhaustively checking every true fact. This is the epistemological aspect.
     - Argument: A bounded agent cannot consider every fact in its knowledge base when planning or predicting. It must have a way to focus on what matters (e.g., only fluents that are causally connected to the action or query).

  6. Tractability (Non-negotiable)
     - Requirement: The reasoning must be computationally tractable in principle for bounded agents. It should not require super-polynomial time or space in the size of the domain description and the problem instance.
     - Argument: Even if a formalism is representationally adequate, if it leads to intractable reasoning (e.g., exponential blowup), it is not useful for real agents.

  7. Distinction between the Two Guises (Preference of a particular camp, but strongly recommended)
     - Requirement: The solution must not conflate the representational task (how to represent persistence and change) with the epistemological task (how to determine relevance). They are distinct problems and should be addressed as such, even if the same formalism addresses both.
     - Argument: Conflating them might lead to solutions that are representationally elegant but computationally intractable, or vice versa. By separating them, we can have a modular design where improvements in one aspect do not break the other.

  Incompatibilities:

  - Default persistence and complete temporal projection might lead to multiple extensions (as in default logic) in the presence of conflicting defaults or in domains with concurrent actions. This is the "multiple extension problem". The Yale shooting problem is an example where we want only one extension (the intended one) to be selected.

  - Relevance without enumeration and tractability: This pair is challenging because determining relevance without exhaustive search seems to require some kind of indexing or structure that allows quick retrieval. However, in the worst case, relevance might depend on arbitrary facts, so without domain-specific constraints, it might be hard to achieve tractability. But if we impose that the domain must have a certain structure (e.g., locality of effect) then it becomes tractable.

  - Defeasibility and the Yale shooting problem: Defeasibility requires that we can retract the default that the gun remains loaded during the delay. But in the standard Yale shooting scenario, we do not have any information to defeat that default. The challenge is to have defeasibility without making the default too weak so that the anomalous model becomes acceptable.

  - Ramifications and tractability: Indirect effects can cause a chain reaction. Without careful control, the system might have to compute a fixpoint for every action, which could be computationally expensive. Also, if ramifications are represented by state constraints (like in some formalisms), then they might cause non-local effects that break relevance.

  Scorecard for existing approaches:

  1. Situation Calculus with Successor-State Axioms (SSA)
     - Default Persistence: Achieved. Each fluent has an axiom that says when it changes, and by default it persists if no change condition holds. So no frame axioms per action-fluent pair.
     - Yale Shooting: Handled correctly if the axiomatization is done properly (e.g., the load action makes the gun loaded, and only the shoot action unloads it, and no action occurs during the delay). The anomalous model is excluded because the SSA for the loaded fluent does not allow it to become unloaded without an action.
     - Defeasibility: Not directly supported. The formalism is monotonic. To handle defeasibility, we need to layer non-monotonic reasoning (like circumscription) on top.
     - Ramifications and Qualifications: SSAs do not inherently handle ramifications. Qualifications (preconditions) are handled by having precondition axioms, but implicit qualifications (like the gun not being jammed) must be explicitly added. Ramifications require additional axioms and possibly non-monotonic reasoning.
     - Relevance without Enumeration: Not addressed. The situation calculus does not provide a mechanism for relevance.
     - Tractability: Reasoning in situation calculus (with SSAs) is deductive and can be complex but is decidable for finite domains. However, the search space (situations) can be large. It is not clear how to achieve tractability in large domains without additional control.
     - Distinction: The situation calculus is primarily a representational formalism and does not address the epistemological issue of relevance.

  2. Circumscription
     - This is a non-monotonic logic that can be used in conjunction with other formalisms (like situation calculus or event calculus).
     - Default Persistence: Achieved by minimizing changes (i.e., assuming that only the actions that are known to change a fluent do so).
     - Yale Shooting: When applied to situation calculus, circumscription can be used to minimize changes and thus exclude the anomalous model (the gun unloading without an action). However, it requires careful setting of which predicates to minimize and with what priorities.
     - Defeasibility: Circumscription is non-monotonic but not easily defeasible in the sense of retracting conclusions with new information. Adding new information might change the set of minimal models arbitrarily. There is no built-in mechanism for defeaters.
     - Ramifications and Qualifications: Circumscription alone does not address these. They must be encoded in the theory being circumscribed.
     - Relevance without Enumeration: Not addressed.
     - Tractability: Circumscription is second-order and computationally complex. It is not tractable in general.
     - Distinction: It is a representational tool and does not address relevance.

  3. Default Logic
     - Default Persistence: Can be achieved by having a default rule for each fluent: "If the fluent was true at time t and there's no evidence that it changed, then it is true at t+1." Similarly for false.
     - Yale Shooting: With the above default, the gun should stay loaded during the delay. However, default logic might produce multiple extensions (if there are conflicting defaults) and in the Yale shooting scenario, we want only the intended extension. But if there are no conflicts, it works. However, the problem of concurrent events or indirect effects might cause multiple extensions.
     - Defeasibility: Default logic is non-monotonic and allows retraction. However, the basis for defeat is not explicit in the formalism. It depends on the structure of the defaults and the order of application (which is not part of the formalism).
     - Ramifications and Qualifications: Can be handled by additional default rules, but this might lead to a proliferation of rules and potential conflicts. It does not avoid enumeration of rules for each ramification.
     - Relevance without Enumeration: Not addressed.
     - Tractability: Default logic is semi-decidable and computationally expensive. Finding extensions is intractable in general.
     - Distinction: It is primarily a representational tool for non-monotonic reasoning and does not address relevance.

  4. Event Calculus (EC)
     - Default Persistence: Achieved by the principle of inertia: a fluent that holds at a time continues to hold until a terminating event occurs, and similarly for negation. This is built-in.
     - Yale Shooting: Handled correctly because during the delay, no event occurs to unload the gun, so the loaded fluent persists. Then the shoot event terminates the loaded fluent and the victim's alive fluent (if the gun was loaded). The anomalous model is excluded because there is no event to unload the gun during the delay.
     - Defeasibility: Some versions of EC (using non-monotonic logics) support defeasibility. For example, by using negation as failure, we can have defaults that can be overridden by new information. However, the mechanism for defeat is often left to the underlying logic (e.g., logic programming with negation as failure).
     - Ramifications and Qualifications: EC does not inherently handle these. They must be encoded using additional axioms. However, ramifications can be represented by state constraints (which are separate axioms) and qualifications by preconditions. This might lead to a need for many axioms, but the use of domain constraints can help.
     - Relevance without Enumeration: Not addressed in standard EC. The reasoning is deductive and might consider all events and fluents.
     - Tractability: EC can be implemented in logic programming (e.g., Prolog) and then it is tractable for small domains. However, in the worst case, it might require checking all events and fluents. There are efficient implementations using constraint handling, but they are not general.
     - Distinction: It is primarily a representational formalism and does not address the epistemological issue of relevance.

  Which single requirement does the most work in excluding candidates?
  - The requirement of "Relevance without enumeration" is the one that most existing formalisms fail to address. This is the epistemological aspect and is crucial for bounded agents. Without it, the agent might be representationally adequate but practically useless because it cannot focus its reasoning.

  Incompatibilities Revisited:
  - The most challenging pair is "Relevance without enumeration" and "Tractability". Without a way to index or structure the knowledge, the agent might have to consider an exponential number of facts. This is why many approaches rely on domain-specific heuristics or assume a particular structure (like locality) that makes relevance tractable.
  - Another tension is between "Defeasibility" and "Default Persistence". We want to assume by default that things persist, but we also want to be able to retract that assumption when we get new information. However, if the new information is arbitrary, then we might have to consider any fluent as potentially changing without an explicit event. This could break the representational solution.

  Note: The requirement for handling the Yale shooting problem is often satisfied by formalisms that have a proper mechanism for default persistence and a way to minimize unexpected changes. However, if defeasibility is too broad, it might allow the anomalous model if we consider that the persistence default might be defeated without a specific reason. But in the standard scenario, there is no defeater, so the anomaly should not be introduced.

  Conclusion:
  The frame problem remains difficult because of the tension between representational adequacy and computational tractability, especially with the requirement of relevance. While representational formalisms (like event calculus and situation calculus with SSAs) have made progress on the representational guise, the epistemological guise (relevance) remains a challenge.
answer: |-
  ### Desiderata for Solving the Frame Problem

  Below are the desiderata for a theory/formalism addressing the frame problem, categorized by your specified points. Each is marked as **non-negotiable** (core to solving the frame problem) or **preference** (varies by approach/camp). Arguments for each requirement are provided.

  1. **Default Persistence**  
     - **Requirement**: The formalism must infer that fluents (time-varying properties) persist unless an action explicitly changes them, without exhaustive frame axioms (e.g., no manual axioms for each action-fluent pair).  
     - **Argument**: Exhaustive enumeration is combinatorially intractable for real-world domains. A solution must automate persistence to avoid this.  
     - **Status**: **Non-negotiable**.  

  2. **Yale Shooting Problem (YSP) and Relatives**  
     - **Requirement**: The formalism must select the intended model (gun remains loaded during delay, victim dies when shot) and exclude anomalous models (e.g., gun spontaneously unloads, victim survives).  
     - **Argument**: Anomalies arise from under-specification or poor handling of defaults. Excluding them tests non-monotonic reasoning and causal realism. The key requirement is **default persistence** (persistence of the loaded state during the delay) combined with **effect axioms** (shoot kills if loaded).  
     - **Status**: **Non-negotiable**.  

  3. **Defeasibility**  
     - **Requirement**: The system must retract conclusions when new information arrives and explain *why* the new information defeats the default (e.g., "the gun was tampered with during the delay" defeats persistence of "loaded").  
     - **Argument**: Mere contradiction (e.g., "the gun is unloaded" after assuming it was loaded) is insufficient; the system must recognize *exceptions* to defaults (e.g., tampering is an exception to persistence).  
     - **Status**: **Non-negotiable**.  

  4. **Ramifications and Qualifications**  
     - **Requirement**: Handle indirect effects (ramifications; e.g., turning on a light illuminates the room) and implicit preconditions (qualifications; e.g., a gun must be clean to fire) without exhaustive enumeration.  
     - **Argument**: Domains have infinitely many indirect effects/preconditions. Solutions must derive them from general rules (e.g., state constraints) to avoid combinatorial blowup.  
     - **Status**: **Non-negotiable**.  

  5. **Relevance without Enumeration**  
     - **Requirement**: Determine which facts are relevant to an action/query without an oracle and without checking all true facts.  
     - **Argument**: Bounded agents cannot scan all facts. Relevance must be tractable (e.g., via causal or syntactic locality).  
     - **Status**: **Non-negotiable** (for epistemological guise).  

  6. **Tractability**  
     - **Requirement**: Reasoning must be feasible for bounded agents (e.g., polynomial-time in domain size).  
     - **Argument**: Correctness in the limit (e.g., infinite compute) is useless for AI agents.  
     - **Status**: **Non-negotiable**.  

  7. **Distinction Between Representational and Epistemological Guises**  
     - **Requirement**: The solution must separate representation (what persists) from epistemology (what is relevant), even if addressing both.  
     - **Argument**: Conflation risks inefficiency (e.g., representational hacks that ignore relevance) or incompleteness (e.g., relevance heuristics that break persistence).  
     - **Status**: **Preference** (of logic-based camps). Some approaches (e.g., neural-symbolic) deliberately fuse them.  

  #### Genuineness of Requirements  
  All are genuine. The epistemological guise (relevance) is often neglected but critical for agents.

  ---

  ### Incompatibilities and Tensions  
  Certain desiderata conflict, making a "perfect" solution unlikely. Key tensions:

  1. **Default Persistence + Yale Shooting Problem → Non-Monotonicity Challenges**  
     - Default persistence forces multiple candidate models (e.g., "gun unloads spontaneously" vs. "persists"). YSP requires selecting *one* (the intended model).  
     - **Conflict**: Non-monotonic formalisms (e.g., circumscription) can exclude anomalies but struggle with defeasibility (e.g., new info may spawn new anomalies).  

  2. **Relevance + Tractability → Computational Hardness**  
     - Relevance requires quick pruning of irrelevant facts. But in worst-case scenarios, relevance is undecidable without domain constraints.  
     - **Conflict**: Without strong assumptions (e.g., "causal locality"), tractable relevance may sacrifice completeness.  

  3. **Ramifications + Default Persistence → Frame Axiom Regress**  
     - Ramifications (e.g., "illumination changes when light is toggled") can interact with persistence. Handling them without enumeration risks reintroducing frame-like axioms for indirect effects.  
     - **Conflict**: Solutions (e.g., causal chains) may violate tractability.  

  4. **Defeasibility + Yale Shooting → Brittleness**  
     - Defeasibility allows overriding persistence (e.g., "tampering unloads gun"). But in YSP, no override exists, so the anomaly must be excluded *without* explicit defeaters.  
     - **Conflict**: Overly flexible defeasibility (e.g., default logic) admits anomalous models; overly rigid systems (e.g., classical logic) miss exceptions.  

  **Strongest Tension**: **Relevance without enumeration** and **tractability** are jointly unsatisfiable in worst-case domains. Relevance is fundamentally heuristic for bounded agents.

  ---

  ### Scorecard of Existing Approaches  
  **Key**: ✓ = Satisfied, △ = Partially, ✗ = Not satisfied.  

  | **Formalism**               | Default Persistence | Yale Shooting | Defeasibility | Ramifications | Relevance | Tractability | Distinction |  
  |------------------------------|---------------------|---------------|---------------|--------------|----------|-------------|------------|  
  | **Situation Calculus (SC) + Successor-State Axioms** | ✓ (via SS axioms) | ✓ (anomalies excluded) | ✗ (monotonic) | △ (needs manual state constraints) | ✗ | △ (expensive for complex queries) | ✓ |  
  | **Circumscription**          | ✓ (minimizes changes) | △ (anomalies excluded only if prioritized) | ✗ (static minimization) | ✗ | ✗ | ✗ (second-order) | ✓ |  
  | **Default Logic**            | ✓ (default rules) | ✗ (multiple extensions allow anomalies) | ✓ (defeasible rules) | △ (rules for each ramification) | ✗ | ✗ (extension enumeration) | ✓ |  
  | **Event Calculus (EC)**      | ✓ (inertia principle) | ✓ (anomalies excluded) | △ (via negation-as-failure) | △ (ramification axioms needed) | ✗ | △ (depends on implementation) | ✓ |  

  #### Key Takeaways  
  - **Yale Shooting Requirement Excludes Default Logic**: Default logic permits multiple extensions (including the anomaly where the gun unloads spontaneously), failing YSP.  
  - **Relevance Excludes Almost All**: No classical formalism natively addresses relevance without enumeration. SC/EC/Default Logic lack epistemological mechanisms; circumscription is too global.  
  - **Tractability Excludes Circumscription**: Second-order minimization is computationally infeasible.  
  - **Defeasibility Excludes SC**: Monotonicity prevents retracting conclusions.  
  - **Most Damaging Requirement**: **Relevance without enumeration** is the strongest filter, as no candidate adequately addresses it.  

  #### Summary  
  - **Best Tradeoffs**: Event Calculus handles persistence/YSP well but struggles with ramifications/relevance. Situation Calculus + SS axioms is clean for representation but ignores epistemology.  
  - **Recommendation**: Combine SC/EC with heuristic relevance (e.g., **action-centered databases**). For tractability, sacrifice worst-case guarantees (e.g., assume sparse causal dependencies).  
  - **Ultimate Challenge**: The epistemological guise (relevance) remains the hardest and least solved aspect.
