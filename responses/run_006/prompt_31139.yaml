prompt: |-
  I am a PhD student in philosophy of medicine, and I sit as the student member on our university hospital's standing committee on disease classification, which determines what counts as a disease for treatment coverage and clinical coding. My own research is on the naturalism–normativism debate about disease, so I keep trying to reconstruct what principle the committee has actually been applying, and next month we vote on a proposal that fits none of our precedents neatly.

  Over the past two years the committee has classified the following as diseases: essential hypertension, type 2 diabetes, childhood growth hormone deficiency, ADHD, prolonged grief disorder, and profound congenital sensorineural hearing loss. It has declined to classify the following as diseases: left-handedness; a small, benign, asymptomatic mole; lactase non-persistence in an adult who consumes little dairy and has no symptoms; and idiopathic short stature with no functional impairment, where the family sought growth hormone for social reasons. In the short-stature case the written rationale said that social disadvantage, in the absence of functional impairment, is not by itself enough.

  The proposal now before us is to classify internet gaming disorder as a disease: a pattern of impaired control over gaming, continued gaming despite negative consequences, and clinically significant impairment in personal, family, social, educational, or occupational functioning, persisting for at least twelve months. There is no agreed underlying neurobiological dysfunction, and whether the condition is a genuine disorder or a harmful pattern of behavior remains contested. What should I argue the committee should decide if it wants to be consistent with its own precedents? Which of our earlier decisions is the closest analog, and does the track record force one answer or underdetermine it? If it underdetermines the answer, spell out the rival principles — something like a value-free dysfunction criterion, a harm-based criterion, and a harmful-dysfunction hybrid — say what each predicts for the proposal, and say what principle the committee would be adopting with each possible vote. Finally, name a further case, not involving gaming, that would most cleanly tell those principles apart.
reasoning: |-
  Okay, the user is a PhD student in philosophy of medicine who serves on a committee that classifies diseases. They need to argue whether internet gaming disorder should be classified as a disease based on the committee's precedents. Let me start by understanding the cases they provided.

  First, the committee accepted essential hypertension, type 2 diabetes, childhood growth hormone deficiency, profound hearing loss, ADHD, and prolonged grief disorder. All these involve clear physiological dysfunctions or impairments. Hypertension and diabetes are well-known with measurable biological issues. Childhood growth hormone deficiency directly affects physical development. Profound hearing loss is a sensory impairment. ADHD has neurobiological components, even if debated. Prolonged grief disorder, while more psychological, is recognized in DSM with significant impairment.

  On the other hand, they rejected left-handedness, benign mole, lactase non-persistence without symptoms, and idiopathic short stature without impairment. The short stature case explicitly stated that social disadvantage alone isn't enough. So here, the absence of dysfunction or impairment led to rejection.

  Now, internet gaming disorder is the proposal. It involves impaired control, continued use despite harm, and significant impairment in various areas. But there's no agreed neurobiological dysfunction, and it's contested whether it's a disorder or just harmful behavior. 

  To be consistent, the committee seems to require both dysfunction and harm. But ADHD and prolonged grief disorder might lean more on impairment despite contested dysfunctions. Yet both are in DSM, which the committee might defer to. Internet gaming disorder is in ICD-11, so maybe they consider that. But the committee's rationale in short stature emphasized functional impairment, not just social harm. 

  The key is whether the impairment in gaming is due to an underlying dysfunction. Without established dysfunction, it might align more with rejected cases like short stature without impairment. But the impairment here is present, unlike in short stature. However, the committee might see the impairment in gaming as stemming from behavior rather than dysfunction. 

  Rival principles: Harm-only would accept gaming disorder due to impairment. Dysfunction-only would reject without biological evidence. Hybrid requires both, which might lead to rejection. But precedents like ADHD suggest hybrid with some flexibility on dysfunction definition. 

  If they accept gaming disorder, they prioritize harm and impairment, moving towards harm-only. If rejected, they emphasize needing dysfunction. A close analog is idiopathic short stature—rejected without impairment, but gaming has impairment. ADHD is another analog, accepted with impairment and some dysfunction. 

  A test case could be nicotine addiction. Harm is clear, but dysfunction might be debated. If accepted, harm-only; if rejected, dysfunction or hybrid.
answer: |-
  Based on your committee's precedents and the philosophical frameworks, here's a structured analysis for your argument:

  ### 1. **The Committee's Implicit Principle: A Hybrid Harm-and-Dysfunction Model**
     Your committee consistently requires **BOTH**:
     - **Objective Dysfunction:** A deviation from species-typical biological/psychological functioning (naturalist element).
     - **Significant Harm/Impairment:** Clinically meaningful negative consequences (normativist element).
     
     **Evidence from Precedents:**
     - **Accepted Cases:** Hypertension (cardiovascular dysfunction + stroke risk), Diabetes (metabolic dysfunction + organ damage), Growth Hormone Deficiency (endocrine dysfunction + developmental impairment), Profound Hearing Loss (sensory dysfunction + communication impairment), ADHD (neurocognitive dysfunction + functional impairment), Prolonged Grief (persistent psychological dysfunction + debilitating distress).
     - **Rejected Cases:** Left-handedness (no dysfunction), Benign mole (no impairment), Asymptomatic lactase non-persistence (no harm), Idiopathic short stature (explicitly rejected due to lack of functional impairment despite social harm).

     **Key Nuance:** The committee accepts *contested* dysfunctions (like ADHD) if linked to severe impairment, but rejects pure social harms (short stature) without underlying dysfunction.

  ---

  ### 2. **Internet Gaming Disorder (IGD) vs. Precedents**
     - **Closest Analog: Idiopathic Short Stature (rejected) vs. ADHD (accepted)**
       - *Similar to Short Stature:* IGD lacks "agreed underlying neurobiological dysfunction" and centers on behavioral choices. Social/occupational harm alone wasn't sufficient for short stature.
       - *Similar to ADHD:* IGD involves "clinically significant impairment" and compulsive behavior patterns, paralleling ADHD's contested neurobiology but accepted impairment.
     
     **Tension:** IGD sits at the intersection of these cases. The committee must decide whether behavioral impairment *without confirmed dysfunction* suffices.

  ---

  ### 3. **Rival Principles & Predictions for IGD**
     | **Principle**               | **Definition**                                  | **IGD Prediction** | **Adopted If Committee...** |
     |-----------------------------|------------------------------------------------|--------------------|-----------------------------|
     | **Value-Free Dysfunction**  | Disease = biological dysfunction (Boorse-style) | **REJECT**         | Requires unambiguous pathophysiology (ignores impairment). |
     | **Harm-Only**               | Disease = socially disvalued harmful state     | **ACCEPT**         | Prioritizes impairment (e.g., IGD's functional damage). |
     | **Harmful Dysfunction Hybrid** | Disease = dysfunction *causing* harm (Wakefield) | **REJECT** (default) | Requires evidence of underlying dysfunction *and* harm. Current IGD evidence meets harm but not dysfunction. |

     **Consistency Argument:**  
     - Accepting IGD aligns with a **Harm-Only** principle, contradicting the short stature rejection.  
     - Rejecting IGD aligns with **Harmful Dysfunction**, maintaining precedent (dysfunction required *unless* impairment is severe and uncontested, like profound hearing loss).  
     - **ADHD/Proposed Grief** are exceptions due to broader medical consensus (DSM/ICD inclusion), which IGD lacks.

  ---

  ### 4. **Recommendation for Consistency**
     Argue to **REJECT** classification of IGD as a disease:  
     - **Precedent:** Like idiopathic short stature, IGD’s harm stems from social context (gaming access, expectations) without proven dysfunction.  
     - **Philosophical Grounds:** Adopting IGD would shift the committee toward harm-only normativism, undermining its hybrid history.  
     - **Procedural Caution:** Vote "no" pending clearer evidence of dysfunction (e.g., neurocognitive studies showing persistent gaming-specific neural alterations beyond addiction models).

  ---

  ### 5. **Test Case to Distinguish Principles**
     **Nicotine Addiction in a Non-Impaired User:**  
     - A heavy smoker with documented nicotine dependence (dysfunction in reward pathways) but *no* health issues, financial stress, or social impairment due to wealth/personal circumstances.  
     - **Predictions:**  
       - *Dysfunction-Only*: **Disease** (clear neurobiological dysfunction).  
       - *Harm-Only*: **Not Disease** (no harm/impairment).  
       - *Hybrid*: **Not Disease** (despite dysfunction, no harm).  
     This case isolates harm from dysfunction, forcing the committee to choose between biological criteria and impairment.

  ---

  ### Key Argument for Committee Meeting
  > "Our precedents show we require both dysfunction *and* harm. IGD meets harm criteria but lacks consensus on dysfunction—like idiopathic short stature, which we rejected. Until IGD's dysfunction is validated (e.g., via biomarkers or neurocognitive signatures), classification risks inconsistent normativism. We should defer or reject."

  This positions you as defending the committee's implicit hybrid model while highlighting the need for conceptual rigor.
