  | **Threshold Thesis** | Rational acceptance is governed by a probability threshold: if Pr(P) > t (for some contextually appropriate t < 1), then it is rational to believe P. | High probability is not sufficient for rational belief. Rational belief requires more than just exceeding a probability threshold (e.g., it may require being based on evidence that is not merely probabilistic, or being safe from error). |
