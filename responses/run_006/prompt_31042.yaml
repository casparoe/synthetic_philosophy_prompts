  We acknowledge that part of our disagreement may be verbal. T uses "belief" to denote a high degree of confidence that meets a contextual threshold and is actionable in practical reasoning. C uses "belief" to denote a categorical commitment that is subject to strong logical constraints. If we were to stipulate a precise definition, some disagreement might dissolve. However, we agree that there remains a substantive issue about the norms governing rational acceptance and the structure of epistemic states.

