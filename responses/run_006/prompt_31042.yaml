      (b) Multi-Premise Closure: If each proposition in a finite set is rationally believed and the set deductively entails a proposition Q, then Q is rationally believed.
      (c) Consistency: It is irrational to hold a set of beliefs that is known to be logically inconsistent.

  1.2. The Preface Paradox (Makinson 1965) similarly highlights a tension between:
      (a) Believing each statement in a book based on high evidence.
      (b) Believing the preface statement that at least one error exists in the book.
      (c) The requirement of logical consistency, as the set of beliefs (all book statements and the preface statement) is inconsistent.

  1.3. Key similarities and differences between the paradoxes:
      - Both challenge the compatibility of high-probability-based belief with logical closure and consistency.
      - The lottery involves a single probability distribution with mutually exclusive and exhaustive outcomes; the preface involves independent claims with separate evidential bases.
      - The lottery's inconsistency arises from a fixed set of propositions; the preface's inconsistency involves a collective set of individually justified beliefs plus a higher-order belief about the set.

  1.4. The paradoxes do not depend on the exact value of t, as long as t < 1 and > 0.5, and they arise for large enough sets.

  1.5. Both paradoxes force a choice between modifying the Threshold Thesis, restricting Closure, or allowing rational inconsistency.

