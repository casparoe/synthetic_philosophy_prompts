  | **Multi-Premise Closure** | Rational belief is not closed under multi-premise deduction. It is rational to believe each of a set of propositions without believing their conjunction, especially when the conjunction has a low probability. | Rational belief is closed under known logical consequence, including multi-premise deduction. If one rationally believes each of P1,..., Pn and knows they entail Q, then one must rationally believe Q. Denying closure fragments rational belief. |
  | **The Lottery Case** | It is rational to believe, of each ticket in a large lottery, that it will lose. However, it is not rational to believe the conjunction that all tickets lose. We thus reject closure. | It is not rational to flat-out believe of any ticket that it will lose; one should only have a high credence. The lesson is that high probability is insufficient for belief; we thus restrict the threshold thesis. |
  | **The Preface Author** | The author rationally believes each statement in the book (each having high probability) and rationally believes the preface statement (due to human fallibility). She is not required to believe the conjunction of the book's statements, which she knows is false. Agglomeration is not required. | The author does not flat-out believe each statement in the book; she holds a high credence but remains aware of the fallibility. She believes the preface statement, and this prevents her from having full belief in each book statement. Alternatively, she may believe each and the preface, but this is an unfortunate rational inconsistency that shows the need to restrict full belief. |

