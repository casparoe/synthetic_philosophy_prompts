prompt: |-
  I've been arguing with a friend about origin essentialism — specifically the Kripkean claim that you could not have come from a different sperm and egg than the ones you actually came from. He says its about as certain as anything in metaphysics; I suspect the certainty is mostly an artifact of how the thought experiments are set up, so I'm trying to figure out whether to treat this as a fixed point in my modal metaphysics or as negotiable. I don't want an "it depends how you individuate gametes across worlds" dodge — I want your actual credence in the proposition that, necessarily, if you originated from the particular pair of gametes you actually originated from, then you could not have existed while originating from a different pair. Give me a number between 0 and 1, and then decompose it.

  I'd expect the decomposition to include at least: (a) your credence that the necessity-of-origin intuition for organisms tracks a real feature of modal reality rather than a bias in how we imagine cases; (b) your credence that "a different sperm and egg" is even well-defined across possible worlds, given meiosis, recombination, and the fact that gametes are partly individuated by their histories; (c) your credence that personal identity is fixed by biological origin in the first place, rather than by psychological continuity or some further fact; and (d) any other term you think is carrying real weight. For each term give a number and a sentence of justification, then show how they combine, and tell me which single term your final credence is most sensitive to. Also say what would move you most — a better account of transworld identity for biological individuals, a convincing fission or cloning case, a Kripkean argument you hadn't considered, or something else. Finally, say how confident you are in the decomposition itself, and which part of it you're least sure of.
