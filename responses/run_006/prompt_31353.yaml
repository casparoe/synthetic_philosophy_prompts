  Here's my systematic breakdown, aiming for transparency over persuasion:

  **Final credence: 0.75**  
  *(Leaning strongly toward Kripke, but with significant biological and metaphysical reservations)*

  ---

  ### Decomposition
  1.  **Credence that origin intuition tracks modal reality: 0.85**  
      *Justification:* Kripke-style thought experiments (e.g., "Could Queen Elizabeth have come from different parents?") evoke a powerful, near-universal intuition of impossibility; this persistence across cultures and contexts suggests it taps into a deep feature of our modal cognition, likely reflecting reality.*  
  2.  **Credence that "different sperm and egg" is well-defined cross-world: 0.60**  
      *Justification:* Gametes are process-dependent entities (meiosis, recombination). A minimally different gamete in a nearby world (e.g., one swapped nucleotide) is arguably "different," but extreme differences (e.g., different parents entirely) clearly are. Defining the exact boundary of "same gamete" across worlds is deeply problematic.*  
  3.  **Credence that personal identity is fixed by biological origin: 0.90**  
      *Justification:* Psychological continuity theories struggle with fission/fusion cases and pre-conscious states (e.g., embryos). Biological origin provides a clearer, more objective "beginning" point for human individuals, anchoring identity in a physical substrate rather than contingent mental properties.*  
  4.  **Credence that origin necessity applies to *persons* specifically: 0.95**  
      *Justification:* If we accept you are identical to a human organism (a common view), and organisms have origin essence, persons inherit it. Denying this requires a robust non-biological personhood theory, which faces hard problems.*  
  5.  **Credence that no overriding defeater exists: 0.85**  
      *Justification:* Cloning/fission cases are ambiguous (is the clone *you* or a duplicate?), and "swampman" thought experiments feel more like replacement than identity preservation.*

  ---

  ### Combination  
  Credence = (1) × (2) × (3) × (4) × (5)  
  = 0.85 × 0.60 × 0.90 × 0.95 × 0.85 ≈ **0.75**  
  *(Values multiplied to reflect joint necessity; all must hold for the proposition to be true)*

  ---

  ### Sensitivity  
  **Most sensitive to (b) – Gamete definition (0.60)**  
  A 10% shift here (e.g., to 0.70) moves final credence to ~0.88; to 0.50, down to ~0.62. Biological indeterminacy is the weakest link.

  ---

  ### What Would Move Me Most  
  **A better account of transworld identity for biological individuals.**  
  Cloning/fission cases are debated but inconclusive. Kripkean arguments are well-explored. Resolving *how biological entities persist across worlds* (especially process-dependent ones like gametes) would directly address the core uncertainty in (b).

  ---

  ### Confidence in Decomposition  
  **Overall: 0.70**  
  *Least sure of: (b) – Gamete definition.*  
  The biology of individuation (is a gamete defined by its genetic sequence, its causal history, or its functional role?) is under-specified in metaphysics. My 0.60 is a best guess acknowledging deep ambiguity.

  ---

  ### Key Takeaway  
  Your skepticism is well-placed regarding gamete individuation **(b)**, but the core intuition **(a)** and link to personal identity **(c, d)** are robust. Treat origin essentialism as a *provisional fixed point* (credence 0.75 is high in metaphysics!), but stay open to revision if biology forces refinements in transworld identity conditions. The dodge you dislike is partly legitimate – but the intuition’s strength suggests the burden lies on challengers.
