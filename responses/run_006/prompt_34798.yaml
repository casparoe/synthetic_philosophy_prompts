  - **Why This Pair Settles the Principle**:  
    - This pair tests the principles in a region with high probabilities but no certainty. PT predicts K because the weighting function underweights both probabilities, but K's higher probability (95% vs. 85%) is weighted more favorably relative to the outcome. The heuristic predicts L based solely on higher EV. Her choice would reveal which principle applies:  
      - If she chooses K, it supports PT (probability weighting dominates).  
      - If she chooses L, it supports the heuristic (EV maximization for risky choices).  
    - This pair is effective because it uses high probabilities (like those in Pairs 1 and 3) where PT's weighting is pronounced, and the EVs are close, making the decision sensitive to probability distortions.

  ### Final Summary
  - **Pair 5 Prediction**: Based on the better fit of Prospect Theory, the best prediction is that she chooses I.  
  - **Key Insights**: The choices violate EUT's independence axiom, consistent with Allais paradox behavior. Prospect Theory explains this through probability weighting, while the heuristic principle captures a simpler rule. The additional pair K vs. L provides a clean test to distinguish them.
