prompt: |-
  Two friends of mine, both phil grad students, got into it at a bar last week over consequentialist cluelessness. I took notes on my phone cause I wanted to think about it later, and now I'm going through them. Here's roughly how it went.

  Sam kicked things off by saying he's been reading some of the recent literature on cluelessness and he's starting to think it's a much bigger deal than most people admit — like, if you really take it seriously, consequentialism stops being action-guiding at all.

  Maya pushed back: "Come on, you don't need to know the exact consequences of everything forever. You use expected value with the best evidence you have. That's how everyone already thinks about climate policy or public health."

  Sam: "But that's exactly the point. Climate policy is a case where we can model things and trace causal chains. The cluelessness worry is about all the chains we can't trace. When I choose between two job offers, the downstream effects of who I meet, what ideas I end up having, the person who gets hired instead of me — all of that is totally opaque, and it plausibly swamps the stuff I can actually evaluate."

  Maya: "Sure, but it's opaque in the same way for both options, so it washes out. You don't have to model every single ripple — you just need to know there's no systematic reason the ripples from job A would be better than the ripples from job B."

  Sam: "But you don't know that! Maybe one job puts you in a social network that, I don't know, makes some political movement slightly more likely to succeed in twenty years. You have literally no idea. The expected value of the ripples from A and B could be wildly different, and you'd never know."

  Maya: "That's just radical skepticism dressed up. If you apply that standard everywhere, you can't cross the street. The fact that you can't rule out some bizarre butterfly effect doesn't mean you should treat it as live."

  Sam: "No, it's not radical skepticism — I'm not saying you can't know anything. I'm saying consequentialism specifically tells you to maximize expected value over all consequences, and when the consequences you can't assess are plausibly larger than the ones you can, the theory gives you no guidance. That's an internal problem for consequentialism, not a general epistemic problem."

  Maya: "I think you're sneaking in a premise that the unknown effects are large. They might be tiny. Most of what we do probably doesn't have massive ripple effects."

  Sam: "But that's an empirical claim you're just asserting! You don't know that either. That's the whole point — we're clueless about the magnitudes too."

  At that point they ordered another round and I changed the subject, but I can't stop thinking about it. Can you go through their exchange and adjudicate who's right about what? I want to know whether Sam has a real point or whether Maya is right that this is just skepticism in disguise. And if they're both partly right, where exactly does each argument go wrong?
reasoning: |-
  Okay, let me try to unpack this philosophy bar debate. Two grad students, Sam and Maya, are arguing about consequentialist cluelessness. Sam thinks it's a huge problem that makes consequentialism non-action-guiding, while Maya thinks it's manageable with expected value calculations. 

  First, I need to understand their core positions. Sam's main point seems to be that when the unknown long-term consequences of our actions could potentially outweigh the known consequences, consequentialism fails to guide us. He uses the job choice example - those social network effects decades later could be massive but completely unknowable. Maya counters that this affects all options equally, so we can ignore it, and that Sam is essentially being a radical skeptic.

  Hmm... I recall Williams' "Jim and the Indians" thought experiment where long-term consequences create moral uncertainty. But here it's more about epistemic limits than paradoxical outcomes. Sam's job example feels relatable - we've all made career decisions with unpredictable ripple effects.

  Maya's "it washes out" argument seems practical at first glance. In daily life, we don't obsess over butterfly effects. But is that because they're negligible or because we're conveniently ignoring them? Sam's push about not knowing if effects are symmetric hits hard - what if one job connects you to someone who starts a movement while the other doesn't? The expected value could differ wildly.

  But then I wonder: is consequentialism really demanding we calculate infinite chains? Smart consequentialists like Ord or Greaves would probably say we focus on foreseeable impacts. Still, Sam has a point that the theory's core principle includes all consequences.

  Their climate policy vs personal decision distinction is crucial. With climate, we build models knowing we'll miss details but trusting the big picture. But for personal choices? No such models exist. Though I suppose we could use heuristics like "jobs with more social impact potential are better" - but that feels question-begging.

  Ah! Sam's "internal problem" insight is sharp. This isn't general skepticism; it's about whether consequentialism collapses under its own demands. Reminds me of Parfit's "mistakes in moral mathematics" where summing tiny effects creates absurdities.

  Maya's "radical skepticism" charge might miss the mark. Sam isn't doubting all knowledge - just highlighting where consequentialism's requirements exceed our capabilities. It's a targeted critique.

  Their empirical stalemate about ripple effect sizes is fascinating. Neither can prove if unknown effects are large or small - that's the cluelessness! Maya assumes modesty; Sam assumes potential significance. Both positions seem defensible, which is troubling for getting guidance.

  The street-crossing counter shows how paralyzing this could become. But consequentialists might bite the bullet here - maybe we should sometimes be paralyzed? That feels unsatisfying though.

  I should check the literature... Greaves' work on cluelessness accepts that infinite horizons create problems but suggests discounting the far future. Lenman argues this undermines consequentialism entirely. Sam seems aligned with Lenman, Maya with Greaves.

  For adjudication: Maya is right that we must act under uncertainty, but Sam correctly notes symmetrical ignorance doesn't imply symmetrical value. His "swamping" concern stands - unknown effects could dominate. Yet Maya's practical stance seems necessary to function.

  Perhaps the resolution lies in bounded consequentialism - maximize expected value over foreseeable impacts while acknowledging the theory's incompleteness. But that feels like a cop-out to Sam's deeper critique.

  The more I sit with this, the more I think both make valid points but miss the meta-problem: consequentialism might simply be unimplementable as an exhaustive theory. We use proxies (rules, virtues) precisely because of such cluelessness. Sam wins on theoretical grounds, Maya on practical necessity.
answer: |-
  You've captured a fascinating and high-stakes debate in contemporary ethics. Let's break down Sam and Maya's arguments, identify where each is strong, where they might be mistaken, and adjudicate the core issues.

  ### Core Positions Recap:
  - **Sam's Claim:** Consequentialism becomes non-action-guiding ("clueless") when the *unknowable long-term consequences* of actions plausibly *swamp* the knowable short-term effects, making expected value calculations impossible (e.g., choosing a job where ripple effects could alter history).
  - **Maya's Claim:** Cluelessness is overstated; we use expected value with available evidence, and unknown effects likely "wash out" symmetrically or are negligible. Treating cluelessness as decisive is radical skepticism in disguise.

  ### Adjudicating Key Points:

  1. **Sam's "Swamping" Argument (Strongest Point):**
     - **Where Sam is Right:** Sam identifies a genuine *theoretical weakness* in consequentialism. If:
       - (a) Unknowable long-term effects exist,
       - (b) These effects could be enormous (positive or negative), and
       - (c) We cannot reliably estimate their magnitude or even direction (e.g., "butterfly effects"),
       - Then consequentialism *cannot* guide actions where (a)–(c) hold. The "expected value" of unknowable effects is undefined, not zero. Climate models avoid this by bounding uncertainty; personal decisions often don't.
     - **Support:** Philosophers like John Broome and Hilary Greaves argue that cluelessness undermines consequentialism in domains like career choices or charitable giving, where long-term causal chains dominate (e.g., your job choice might inadvertently enable/fail to prevent a future catastrophe).

  2. **Maya's "Washing Out" Argument (Partially Flawed):**
     - **Where Maya is Mistaken:** Her claim that unknowable effects "wash out" symmetrically assumes:
       - (a) Unknown effects are *randomly distributed* across options, and
       - (b) They lack *systematic bias*.
     - **Sam Correctly Rejects This:** We have no reason to assume symmetry. As Sam notes, one job might connect you to networks that amplify positive effects; another might isolate you. Unknown effects could systematically favor one option, and we'd never know. Philosopher James Lenman calls this the problem of "asymmetric cluelessness."
     - **Where Maya is Strong:** For *many* decisions (e.g., choosing a breakfast cereal), unknown effects are likely trivial or symmetric. But Sam’s point is that for *high-stakes* or *path-dependent* choices (careers, relationships), they may not be.

  3. **"Radical Skepticism" Charge (Misplaced):**
     - **Sam's Defense Holds:** Sam isn’t denying all knowledge (e.g., "crossing the street is safe"). He’s highlighting a *specific flaw in consequentialism*: it demands we optimize total consequences, but we can’t assess the largest ones. This is an *internal critique*, not global skepticism. Other theories (e.g., deontology) avoid this by not requiring total consequence calculations.
     - **Maya's Practical Insight:** We *must* act under uncertainty. But Sam’s point is that consequentialism lacks tools to do this coherently when unknowns dominate.

  4. **The Empirical Stalemate (Both Partly Right):**
     - **Sam:** Correct that we can’t prove unknown effects are small. Asserting they’re negligible is question-begging.
     - **Maya:** Correct that we have no evidence unknown effects are *systematically large*. But absence of evidence isn’t evidence of absence.
     - **Resolution:** This is why cluelessness is a dilemma. We lack data to resolve it empirically.

  ### Who Wins What?
  | **Argument**           | **Stronger Position** | **Why**                                                                 |
  |------------------------|------------------------|-------------------------------------------------------------------------|
  | **Consequentialism’s action-guiding failure** | Sam (mostly) | Identifies a legitimate theoretical gap for high-stakes decisions. |
  | **"Washing out" of unknowns** | Sam | Symmetry is unjustified; unknowns may dominate asymmetrically. |
  | **"Radical skepticism" charge** | Sam | Maya conflates a targeted critique with global doubt. |
  | **Practical decision-making** | Maya | We *must* use bounded rationality; Sam's view risks paralysis. |

  ### A Synthesized View: Where Both Go Wrong
  1. **Sam's Overreach:** He implies cluelessness makes consequentialism *universally* non-action-guiding. But it still works for:
     - Decisions with bounded outcomes (e.g., medical triage).
     - Cases where known effects dominate (e.g., donating to proven charities).
     Cluelessness is *domain-specific*, not a total knockout.
     
  2. **Maya's Underestimation:** She dismisses the *structural problem*. Consequentialism’s core commitment to *total expected value* *does* collapse when unknown effects could be orders of magnitude larger than known ones. We can’t "expected value" our way out of true cluelessness.

  ### A Path Forward?
  Philosophers propose partial solutions:
  - **Bounded Consequentialism:** Optimize foreseeable consequences (e.g., 100-year horizon for climate policy). This sidesteps cluelessness but abandons classical utilitarianism.
  - **Rule Consequentialism:** Follow rules proven to generally maximize value (e.g., "promote education"). This avoids case-by-case cluelessness but may be rigid.
  - **Accept Moral Remainders:** Sometimes, we act without knowing if it's optimal. Consequentialism becomes one consideration among others (e.g., duties, virtues).

  ### Verdict:
  - **Sam wins the theoretical battle:** Cluelessness is a profound, unsolved problem for consequentialism. It *can* render the theory non-action-guiding in high-stakes, path-dependent decisions.
  - **Maya wins the practical battle:** For most decisions, bounded rationality (expected value + heuristics) is the best we can do. Treating cluelessness as decisive *everywhere* *is* paralyzing and unnecessary.
  - **The Irony:** Their debate proves Sam's point. If cluelessness is real, even *arguing about it* could have unbounded consequences—and we’re clueless about whether it helped or harmed humanity. Yet, like Maya, we must proceed with the tools we have. 

  This tension—between theoretical purity and practical necessity—is why cluelessness remains a live wire in ethics. Your friends embody the heart of the problem: philosophy at its most consequential.
