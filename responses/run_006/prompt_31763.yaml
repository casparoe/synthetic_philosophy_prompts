prompt: |-
  Since I retired from a career in an experimental laboratory and began reading philosophy, I have kept noticing a pattern in epistemological arguments for which I have no name, though I suspect the specialists have one. It occurs when a source of information is made to certify itself. Consider a technician who reads a value off a newly installed pressure transducer, forms the belief that the pressure is 4.2 bar, and then treats the fact that the transducer reported 4.2 bar when the pressure was 4.2 bar as evidence that the transducer is reliable. Or consider me glancing at a printed page, judging that I can read the words, and then treating my having read them correctly as evidence that my eyesight is functioning properly. Each step, taken alone, seems entirely innocent; the whole, taken together, looks circular. Yet people who would never accept a vicious circle in an argument apparently regard this as a legitimate way of answering doubts about the source itself.

  I would like to know whether this configuration has an established name. If it does, what exactly is the phenomenon, how is it different from a plain circular argument or from the old problem of the criterion, and is the consensus among epistemologists that it is a fallacy to be avoided or an unavoidable, perhaps even acceptable, feature of our epistemic situation? If it has no established name, I would be grateful for a precise definition and a term, along with boundary cases that show where the phenomenon begins and ends. A bare label would not be of much use to me; I am after the carving.
reasoning: |-
  Okay, the user is describing a specific epistemological pattern they've noticed where a source of information is used to certify its own reliability. They give examples like a pressure transducer confirming its accuracy by reporting the correct pressure, or their own eyesight being verified by successfully reading text. They want to know if this has a name, how it differs from circular reasoning or the problem of the criterion, and what the consensus is among epistemologists.

  First, I need to identify the core issue. The user is pointing out a self-justifying loop: using the output of a source to validate the source itself. This seems circular, but in practice, people accept it. The key question is whether this is a fallacy or an unavoidable part of how we gain knowledge.

  I recall that this relates to epistemic circularity. Alston and Sosa have written about this. Alston's work on perceptual justification comes to mind, where he argues that we can't prove our senses are reliable without using them, leading to a necessary circularity. Sosa distinguishes between vicious and virtuous circles, suggesting that some circularity is benign if the source is actually reliable.

  The user also mentioned the problem of the criterion, which is a broader issue about justifying sources and criteria for knowledge. Epistemic circularity is a specific instance of this, focusing on self-support. The difference is that the problem of the criterion is more about the regress problem in epistemology, while epistemic circularity deals directly with self-justification.

  I should explain why this isn't always considered a fallacy. In foundationalism, basic beliefs don't need external justification. Reliabilism accepts that if a process is reliable, its outputs justify trust in the process itself, even if circular. This is where the distinction between vicious and benign circularity comes in. A vicious circle is when the conclusion is used to support the premises, but in this case, it's about the reliability of the source being confirmed by its own outputs conditionally.

  The user might be looking for validation that their observation is recognized in epistemology. They want to understand the boundaries—when this circularity is problematic versus when it's acceptable. Examples like using memory to verify memory could be boundary cases. If memory is generally reliable, it's benign; if not, it's vicious.

  Also, the user's background in experimental science might make them sensitive to empirical verification. They might appreciate how this circularity is handled in practical terms, like calibration in labs, where external checks are used initially, but eventually, some self-reliance is necessary.

  In conclusion, the term is "epistemic circularity" or "bootstrapping." The consensus is that it's unavoidable but can be benign if the source is reliable. Distinguishing it from plain circular arguments involves the conditional nature and the role of reliability. The user needs a clear definition, differentiation from related concepts, and an understanding of its acceptability in epistemology.
answer: |-
  What you've astutely identified is indeed a well-recognized phenomenon in epistemology, most commonly called **epistemic circularity**. It's a specific form of circularity concerning the justification of our fundamental cognitive faculties or sources of belief (perception, memory, reasoning, instruments). Here's the "carving" you requested:

  1.  **The Established Name:** **Epistemic Circularity** (sometimes also called **Self-Support** or, more problematically, **Bootstrapping**).
  2.  **Precise Definition:** Epistemic circularity occurs when the justification for believing that a particular source, faculty, or method of belief formation (S) is reliable depends, either directly or indirectly, on information derived *from that very source, faculty, or method (S) itself*.
      *   **Core Structure:**
          *   We use outputs of S to form beliefs about the world (B1, B2, B3...).
          *   We then use *some of those very beliefs* (or beliefs directly dependent on them) as premises in an argument intended to conclude that S is reliable.
          *   The reliability of S is a necessary condition for the justification of the premises used to argue for its reliability.

  3.  **Distinguishing it from Related Concepts:**
      *   **Plain/Vicious Circular Argument (Petitio Principii):** This involves assuming the conclusion within the premises of a *single* argument intended to prove that conclusion. (E.g., "God exists because the Bible says so, and the Bible is true because it's the word of God.") The circularity is immediate and within the logical structure of the argument.
          *   **Difference:** Epistemic circularity often involves a *process* or a *series of beliefs over time*, not necessarily a single, formally invalid syllogism. It concerns the *source* of justification for the premises used to justify the *reliability of the source itself*. The circularity lies in the *epistemic dependence*, not necessarily the logical form of one argument. It's about the *regress-stopper* for foundational sources.
      *   **The Problem of the Criterion:** This is a broader, more fundamental skeptical problem about how to justify *any* criterion for knowledge without already having knowledge (the "wheel" or "diallelus"). It asks: How do we know *what* knowledge is (the criterion) without knowing *some* instances of knowledge? And how do we know *instances* of knowledge without knowing the criterion?
          *   **Difference:** Epistemic circularity is a *specific manifestation* or *instance* of the Problem of the Criterion when applied to a *particular source* (like perception or instrument readings). The Problem of the Criterion sets the skeptical stage; epistemic circularity describes the structural feature of *any* proposed solution that relies on the source in question to vouch for itself. Epistemic circularity is *how* the problem bites when we try to answer the criterion challenge for sensory perception or instrument reliability.

  4.  **Boundary Cases: Where it Begins and Ends**
      *   **Clear Case (Your Examples):**
          *   **Transducer:** Using the transducer's reading (P=4.2 bar) to form the belief P=4.2 bar, and then using the fact that this belief was formed (and is assumed true) *by the transducer* as evidence *for the transducer's reliability*. The belief in reliability rests on an output of the source whose reliability is in question.
          *   **Eyesight:** Using your vision to read words (believing "the word is 'philosophy'"), and then using the fact that you successfully read the words (an output of vision, assumed correct) as evidence *for the reliability of your vision*. Again, the justification for trusting vision relies on outputs of vision.
      *   **Boundary Case 1 (External Calibration - Avoiding Circularity?):** Imagine calibrating the pressure transducer against a *different*, independently certified standard instrument *before* trusting it. You use Standard S's reading (say, 4.2 bar) to *set* or *verify* the new transducer T. You then trust T based on S's authority. The justification for trusting T *does not depend on T's own outputs*, but on S's outputs. This avoids epistemic circularity *for T*. (Though it pushes the circularity back to S - how do you know S is reliable without circularity? This highlights the regress.)
      *   **Boundary Case 2 (Memory Check - Circularity or Not?):** You try to remember where you put your keys. You form the belief "They are on the desk" (output of memory M). To check, you *look* at the desk (output of perception P). You see them, confirming your memory. Is using perception to confirm memory epistemically circular? *For memory (M)*: Yes, indirectly. You are using P (seeing keys) to justify the reliability of M (remembering keys) *in this instance*. But P itself is a source whose reliability might be questioned. *For perception (P)*: You are using P (seeing keys) to justify a belief *about the world* (keys location), not directly to argue for P's reliability *in general*. Using P to confirm a *specific* memory output isn't *inherently* circular for P's *general* reliability, though it relies on P being functional *in this case*. The circularity becomes clearer if you then argue: "My perception must be reliable because it confirmed my memory, and my memory is reliable because it matched my perception."
      *   **Boundary Case 3 (Coherence - Mitigating Circularity?):** You use vision to read a gauge (V1), touch to feel the pressure (T), hearing to listen to the pump (H), and reasoning (R) to integrate this. They cohere: V1, T, H, and R suggest the system is stable. You then use this coherence *as evidence* for the reliability of V1, T, H, and R. Is this circular? Yes, but it's *distributed* across multiple sources. The justification for trusting *each individual source* relies partly on outputs from *other* sources and the coherence itself (an output of R). It's a *web* of epistemic circularity rather than a simple loop. Some (like coherentists) argue this mutual support is the best we can do and isn't vicious if the system is stable.
      *   **Where it Ends?** It potentially ends when justification for a source's reliability can be established *without* using any outputs from that source (or any source whose reliability ultimately depends on it). Foundationalists argue some sources (like clear rational intuition or basic perception) are "properly basic" and don't *need* non-circular justification. Externalists (like reliabilists) argue that circularity doesn't matter if the source is *actually* reliable – the loop can be "virtuous."

  5.  **The Epistemological Consensus: Unavoidable, Benign or Vicious?**
      There is no single consensus, but the predominant view is nuanced:
      *   **Unavoidable:** Most epistemologists agree that epistemic circularity is *unavoidable* when attempting to provide a *non-question-begging*, *fully general justification* for the reliability of our most fundamental belief-forming faculties (perception, memory, introspection, deductive reasoning) or instruments we rely upon as extensions of these. Any argument *for* their reliability will have to use premises justified *by* these very faculties or instruments.
      *   **Not Necessarily Vicious (The Benign/Virtuous Circularity View):** Key figures like William Alston ("The Reliability of Sense Perception") and Ernest Sosa ("A Virtue Epistemology") argue that not all epistemic circularity is vicious or fatal. Their arguments often hinge on:
          *   **Externalism/Reliabilism:** What matters is that the source *is actually reliable*. If perception *is* reliable, then using perceptual beliefs to argue for perception's reliability isn't fallacious in a way that undermines knowledge; it's a reliable process confirming itself. The circularity doesn't *prevent* the justification from being successful if the source is reliable. It might be "logically circular" but "epistemically virtuous."
          *   **Distinguishing Vicious from Benign:** A loop is vicious only if the *only* reason to accept the premises *requires* already accepting the conclusion. In the case of perception, we accept perceptual beliefs *prima facie* (they seem compelling) *before* we explicitly consider reliability arguments. The "default trust" comes first; the reliability argument is a retrospective reflection that depends on that trust. The circularity doesn't *generate* the justification; it *describes* a feature of our reflective access to it.
          *   **Practical Rationality:** We have no viable alternative but to trust these sources to engage in any inquiry at all, including skeptical inquiry. Refusing to trust them is practically self-defeating.
      *   **The Skeptical Challenge:** Skeptics (and some internalists) maintain that epistemic circularity *is* vicious. They argue it provides no *independent* reason to trust the source. Any argument relying on S to justify S fails to *answer* the doubt about S; it simply assumes what it sets out to prove. The fact that we must rely on our faculties doesn't make the reliance *justified*; it just highlights our predicament.
      *   **The "Bootstrapping" Problem:** A specific objection, often associated with the work of Roger White and Jonathan Vogel, targets a naive form of reliabilism. Imagine forming beliefs *solely* based on a source's outputs and then using the *mere fact of agreement* between outputs (e.g., "The gauge said 4.2 at T1, and 4.2 at T2, and 4.2 at T3...") to conclude the gauge is reliable, *without any independent check*. Most agree *this* "bootstrapping" is illegitimate and *is* viciously circular because it gathers no *new information* about reliability; it just repeats the source's outputs. This highlights that epistemic circularity arguments must involve *more* than just tracking the source's outputs – they need some connection to *truth* or *independence* (like coherence with other sources, predictive success, or initial calibration - pushing the circularity elsewhere).

  **In Summary:**

  *   **Name:** Epistemic Circularity (or Self-Support).
  *   **Definition:** Justifying the reliability of a source (S) using information dependent on S itself.
  *   **Vs. Simple Circularity:** Concerns the source of justification for premises about the source's reliability, often not a single logical fallacy but a structural feature of foundational justification.
  *   **Vs. Problem of the Criterion:** A specific instance arising when addressing the criterion challenge for a particular source/faculty.
  *   **Boundaries:** Clear in self-certification (your examples); potentially avoided with independent calibration (shifting the issue); present in coherence checks and memory verification; ends where non-dependent justification exists (controversial).
  *   **Consensus:** Viewed as **unavoidable** for fundamental sources. Many leading epistemologists (Alston, Sosa) argue it can be **benign or virtuous** if the source is actually reliable ("externalism"), though skeptics and some internalists maintain it is **vicious**. Naive "bootstrapping" is widely rejected.

  Your observation from the lab bench to the philosophy text is spot-on. Epistemic circularity is the deep epistemological structure underlying that pattern of self-certification, reflecting the profound challenge of stepping outside our own cognitive apparatus to validate it. The consensus leans towards it being an unavoidable, and under certain externalist conditions, an acceptable feature of our epistemic situation.
