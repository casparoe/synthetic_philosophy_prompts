prompt: |-
  I keep encountering definitions of life — metabolic, evolutionary, thermodynamic, list-based — and each one seems to handle some cases beautifully and others not at all. Before I read another proposal, I want a clear specification of what a definition of life actually needs to accomplish. Write the desiderata: what any adequate definition of life must get right, with the case or consideration behind each requirement.

  Cover at least the following terrain. (i) Which entities must the definition count as clearly alive, and which must it count as clearly not alive? (ii) Which borderline cases — viruses, bacterial endospores, tardigrades in cryptobiosis, obligate intracellular parasites, synthetic minimal cells, self-replicating ribozymes, prions, a hypothetical robot that builds copies of itself from raw materials — must the definition handle, and what counts as handling them (a clean yes/no, a principled borderline, an explanation of why the case is ill-posed)? (iii) What distinctions must the definition respect — e.g., living vs. dead vs. never-alive vs. dormant, or life as a property of individual organisms vs. life as a property of lineages or ecosystems? (iv) What empirical results from biology must the definition be consistent with, and which results should it be allowed to treat as contingent facts about life on Earth rather than definitional constraints? (v) What theoretical work is the definition supposed to do — guide astrobiological search, set the boundary conditions for origins-of-life research, ground normative claims in bioethics, or something else — and how does the purpose constrain which requirements are genuine?

  Flag which requirements are non-negotiable and which reflect the interests of a particular camp. If some subset of the desiderata cannot be jointly satisfied — if any attempt to draw a clean line around the living must either exclude something we are unwilling to exclude or include something we are unwilling to include — identify that tension and say which requirement should give way. Finally, score the main families of definitions (metabolic, evolutionary/Darwinian, thermodynamic, list-based) against the list, and identify which single requirement knocks out the most candidates. A table for the scorecard is welcome.
reasoning: |-
  Hmm, the user is asking for a rigorous framework to evaluate definitions of life. They've clearly wrestled with multiple existing definitions and found them all wanting in different ways. This isn't just about finding a definition - they want the criteria by which any definition should be judged.

  The user seems scientifically literate but frustrated. They mention specific edge cases like viruses and tardigrades in cryptobiosis, which suggests they've done their homework. Their request covers five complex dimensions: clear cases, borderline cases, necessary distinctions, empirical consistency, and practical utility. That's comprehensive.

  I need to approach this systematically. First, I'll identify the non-negotiable requirements that any viable definition must satisfy. These should include capturing the essence of what we universally consider alive (like animals) and not alive (like rocks), while handling tricky cases in a principled way. The definition should also distinguish between living, dead, dormant states, and avoid being Earth-centric.

  Then there are important but debatable requirements. Some researchers prioritize evolutionary capability, others focus on metabolic activity. The user specifically asked me to flag which requirements reflect particular camps' interests. For borderline cases, I need to decide whether demanding binary yes/no answers is reasonable or if acknowledging gradations is more scientifically honest.

  The big tension I see is between metabolic and evolutionary definitions - one requires active chemistry while the other privileges information transmission. This creates problems for dormant states versus simple replicators. Since the user wants me to identify irreconcilable conflicts, I should highlight this as the core dilemma.

  For the scorecard, I'll evaluate the four main definition families against my criteria. Thermodynamic definitions often fail on dormant states, while list-based ones struggle with minimal life forms. The hardest requirement seems to be handling borderline cases without being arbitrary - that might eliminate the most candidates.

  The user also asks about theoretical purposes. This matters because an astrobiology-focused definition might accept viruses as alive while an origins-of-life researcher might require metabolic continuity. I should note how purpose influences which requirements take priority.

  Throughout, I'll maintain that definitions are tools rather than ultimate truths. The conclusion should emphasize that the value lies in having clear criteria to test definitions against, not in finding one perfect solution.
answer: |-
  Here's a comprehensive set of desiderata for a definition of life, structured to address your specific points and tensions. **Non-negotiable requirements** are marked `[NN]`. Others reflect important but potentially context-dependent priorities.

  ### I. Core Requirements: What Must Be Captured & Excluded `[NN]`
  1.  **Must Include Paradigmatic Organisms:** Counts *all* free-living cellular organisms (bacteria, archaea, protists, fungi, plants, animals) in their active state as *clearly alive*.
      *   *Why:* These are the uncontroversial cases. A definition failing here is useless.
  2.  **Must Exclude Paradigmatic Non-Life:** Counts rocks, minerals, simple molecules (H₂O, CO₂), basic machinery (a car), and non-replicating complex artifacts as *clearly not alive*.
      *   *Why:* The fundamental contrast. Failure here renders the definition meaningless.
  3.  **Must Distinguish Living, Dead, and Dormant States `[NN]`:**
      *   Clearly identifies an *organism* as being in a *living* state (metabolizing, responsive, etc.).
      *   Identifies a *dead* state where the organized structure sustaining life processes has irreversibly broken down (e.g., a decaying corpse).
      *   Identifies a *dormant* state (e.g., bacterial endospore, cryptobiotic tardigrade, seed) where metabolic activity is suspended but the *potential* for active life processes *inherent to that entity* remains, given suitable conditions. This is distinct from being "dead" or "never alive".
      *   *Why:* Essential for describing biological reality and phenomena like hibernation, preservation, and revival.
  4.  **Must Distinguish Life from "Never-Alive" `[NN]`:** Clearly differentiates entities that *are* or *have been* alive from entities that *never* possessed the properties of life (see point 2).
      *   *Why:* Fundamental ontological distinction.

  ### II. Handling Borderline Cases: Requirement & Tolerance
  5.  **Must Handle Borderline Cases Principledly `[NN]`:** Must provide a principled framework for analyzing key borderline cases, *not necessarily* demanding a binary yes/no for all. What counts:
      *   **Viruses:** Acknowledges their parasitic nature and dependence on host machinery. Outcome could be "not alive individually but replicating biological entities", "life cycle includes non-living phase", or "borderline due to lack of intrinsic metabolism/replication machinery". *Forcing* a clean yes/no is often seen as artificial.
      *   **Bacterial Endospores / Tardigrades in Cryptobiosis:** Must recognize these as dormant states of *clearly living organisms*, not dead or non-living. The definition must accommodate suspended animation. A clean "alive (dormant)" is desirable.
      *   **Obligate Intracellular Parasites (e.g., *Rickettsia*, *Chlamydia*):** Must count these as *clearly alive* during their intracellular phase. They perform intrinsic metabolism and reproduction, albeit dependent on a host.
      *   **Synthetic Minimal Cells (e.g., JCVI-syn3.0):** Must count these as *clearly alive* if they demonstrably carry out core metabolic and reproductive processes autonomously.
      *   **Self-Replicating Ribozymes (in vitro):** Framework should place these on the path to life. Outcome could be "potentially proto-life", "lacking key features (like compartmentalization/metabolism)", or "borderline replicators". A clean "not alive" is acceptable if justified by missing essential properties.
      *   **Prions:** Must clearly classify as *not alive*. They are misfolded proteins causing conformational changes in others; no replication machinery, no metabolism, no independent evolution.
      *   **Self-Replicating Robots:** Must classify as *not alive* unless they demonstrate open-ended evolution, autonomous maintenance, and intrinsic information-driven organization *akin* to biology. Current concepts are complex machines. *Handling:* Clean "not alive" based on lack of intrinsic metabolism/open-ended evolution/chemical basis is expected.
      *   *Why:* These cases probe the boundaries. A definition must engage with them meaningfully, providing reasoning, even if the outcome is "borderline" or context-dependent.

  ### III. Necessary Distinctions & Scope `[NN]`
  6.  **Must Apply Primarily to Individual Entities/Systems:** Life is fundamentally a property of an *individual system* (organism, cell) at a point in time (even if dormant). Lineages and ecosystems *contain* life but are not themselves "alive" in the same primary sense.
      *   *Why:* Avoids category errors. We speak of a *lion* being alive, not its pride or evolutionary lineage *as* living entities, though they depend on living members.
  7.  **Must Distinguish Life from Products of Life:** Recognizes that entities like corpses, fossils, secreted shells, or biofilms are products *of* life, not living entities themselves (though biofilms *contain* living cells).
      *   *Why:* Crucial for clarity in biology and paleontology.

  ### IV. Empirical Consistency & Earth-Centricity
  8.  **Must Be Consistent with Core Biological Principles `[NN]`:** Must align with the fundamental observation that life *as we know it* is based on chemistry (C, H, O, N, P, S...), requires energy, processes information (genetic), evolves, and maintains homeostasis.
      *   *Why:* Grounding in observed reality is essential. A definition contradicting this is implausible.
  9.  **Must Not Be Unnecessarily Earth-Centric:** Should avoid defining life *solely* by Earth-specific molecules (DNA, ATP), structures (phospholipid bilayers), or processes (aerobic respiration). These should be treated as *contingent* features of Terran life, not definitional requirements for life *in principle*.
      *   *Why:* Essential for astrobiology and origins-of-life research. Life elsewhere might differ radically.
  10. **Should Accommodate Potential for Alternative Biochemistries:** While based on chemistry, should not preclude life based on solvents other than water, backbones other than carbon, or information systems other than nucleic acids, if they fulfill the core definitional requirements.
      *   *Why:* Expands the scope for searching for and recognizing truly novel life.

  ### V. Theoretical Work & Purpose-Driven Constraints
  11. **Core Purpose Drives Weighting:**
      *   **Origins-of-Life Research:** Prioritizes minimal requirements for the transition from non-life to life. May lean towards chemical/thermodynamic definitions, accepting simpler systems (replicators) as "proto-life" or borderline. Tolerates fuzziness.
      *   **Astrobiology / SETI:** Prioritizes detectability and universality. Favors definitions emphasizing energy processing, complexity, or biomarkers observable remotely. Needs clear "yes/no" for detection protocols but might accept different thresholds. May be stricter on independence than origins research.
      *   **Bioethics:** Often prioritizes sentience, cognition, or autonomy, which are *not* definitional for life itself but for moral status. A life definition here must clearly *exclude* entities like viruses/prions if they lack the basis for these properties, but risks being overly restrictive for general biology. `[Note: Defining life ≠ defining moral status]`
      *   **Theoretical Biology:** Seeks a unified understanding of living systems. Values coherence, explanatory power, and integration with physics/chemistry. May embrace complexity or information-based definitions.
      *   *Why:* The "best" definition depends on the question being asked. Purpose determines which desiderata are paramount and how strictly borderline cases are judged.

  ### Tensions & Which Requirement Might Give Way
  *   **The Fundamental Tension:** **Metabolic Continuity vs. Evolutionary Potential.**
      *   *Tension:* Definitions emphasizing active, ongoing metabolism (e.g., thermodynamic) clearly exclude dormant states (endospores) and viruses. Definitions emphasizing the *potential* for evolution via heritable variation (e.g., Darwinian) can include viruses and dormant states (as they carry heritable information) but risk including simple replicators (ribozymes) or even certain computer programs.
      *   **Resolution:** Dormant states are the key casualty. A definition *must* handle them as dormant life (Requirement 3). This strongly favors definitions incorporating **metabolic potential** or **organizational persistence** intrinsic to the entity, even when suspended. **Requirement 3 (Dormancy) is non-negotiable and usually forces the inclusion of metabolic/metabolic-potential criteria, causing tension with strict replicator-focused (Darwinian) definitions.** Simple replicators (ribozymes) remain borderline, potentially excluded if they lack other key features like compartmentalization or metabolic linkage.

