  **Key:** ✓✓✓ = Excels, ✓✓ = Good, ✓ = Adequate, △ = Problematic/Partial, ✗ = Fails

  ### Requirement Knocking Out the Most Candidates
  The requirement that **knocks out the most candidate definitions is Requirement 3: Must Distinguish Living, Dead, and Dormant States.** 

  *   **Thermodynamic Definitions:** Often fail outright by classifying dormant states as "not alive" or "dead" due to the absence of *current* energy dissipation or metabolic flux.
  *   **Strict Metabolic Definitions:** Struggle to cleanly include dormant states without adding auxiliary concepts like "potential" or "organized persistence," which can feel like amendments. Viruses are clearly excluded.
  *   **Strict Darwinian (Replicator-First) Definitions:** Struggle because while dormant states *carry* heritable information, they aren't *currently* undergoing replication/variation/selection. They often include viruses and simple replicators readily, which some find too permissive. Requirement 3 forces them to grapple with dormancy as a distinct state of a living entity, not just an inert information packet.
  *   **List-Based Definitions:** Often fail because dormant states lack one or more items on the list (e.g., "metabolism," "growth," "response to stimuli") *at that moment*.

  Requirement 3 exposes the core challenge: Life involves both a *persistent organized state* (maintained actively or passively) and the *dynamic processes* (metabolism, evolution) that characterize it when active. Definitions focusing too narrowly on one aspect stumble on the other. This requirement forces definitions to account for **biological persistence through time, including periods of inactivity,** which is central to biology but difficult to capture concisely.
