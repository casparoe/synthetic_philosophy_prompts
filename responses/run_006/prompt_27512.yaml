  ### (a) Undefined Expectations: Conditional Convergence and Order-Dependence

  The expectation of a gamble is the sum of probability times payoff over all outcomes, ordered by \(n\) (natural order). For each gamble, this series converges conditionally: it converges in the natural order, but the positive and negative parts diverge separately, resulting in an \(\infty - \infty\) form and an undefined expected value.

  **Gamble A's Expectation Series:**
  - The term for outcome \(O_n\) is \(a_n = p_n \times \text{payoff}_A(n) = \left(\frac{1}{2}\right)^n \times \frac{(-1)^{n+1} 2^n}{\sqrt{n}} = (-1)^{n+1} \frac{1}{\sqrt{n}}\).
  - Series: \(\sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{\sqrt{n}} = 1 - \frac{1}{\sqrt{2}} + \frac{1}{\sqrt{3}} - \frac{1}{\sqrt{4}} + \frac{1}{\sqrt{5}} - \cdots\).

  **Convergence in Natural Order:**
  - This is an alternating series with terms decreasing to 0 (since \(\frac{1}{\sqrt{n}} \to 0\) and \(\left| \frac{1}{\sqrt{n}} \right|\) decreases). By the alternating series test, it converges to some finite value (approximately 0.6049, but not relevant).

  **Conditional Convergence:**
  - The absolute series is \(\sum_{n=1}^{\infty} \left| (-1)^{n+1} \frac{1}{\sqrt{n}} \right| = \sum_{n=1}^{\infty} \frac{1}{\sqrt{n}}\).
  - This is a p-series with \(p = \frac{1}{2} < 1\), so it diverges to \(\infty\).
  - Positive part: Sum over odd \(n\) of \(\frac{1}{\sqrt{n}}\) (e.g., \(n=1,3,5,\ldots\)) diverges to \(\infty\).
  - Negative part: Sum over even \(n\) of \(-\frac{1}{\sqrt{n}}\) (e.g., \(n=2,4,6,\ldots\)) diverges to \(-\infty\).
  - Thus, the expectation is \(\infty - \infty\), undefined.

  **Order-Dependence Explanation:**
  - Since the series converges conditionally (not absolutely), Riemann's rearrangement theorem applies: by reordering the terms, the series can be made to converge to any real number or diverge.
  - For example, summing all positive terms first gives \(\infty\), summing all negative terms first gives \(-\infty\), and other orders can yield any finite value. Thus, the expectation depends on the summation order.

  **Gamble B's Expectation Series:**
  - The term for \(O_n\) is \(b_n = p_n \times \text{payoff}_B(n)\):
    - For \(n=1\): \(\left(\frac{1}{2}\right)^1 \times 2 = 1\).
    - For \(n=2\): \(\left(\frac{1}{2}\right)^2 \times 0 = 0\).
    - For \(n \geq 3\): \(\left(\frac{1}{2}\right)^n \times \frac{(-1)^{n+1} 2^n}{\sqrt{n}} = (-1)^{n+1} \frac{1}{\sqrt{n}}\).
  - Series: \(1 + 0 + \frac{1}{\sqrt{3}} - \frac{1}{\sqrt{4}} + \frac{1}{\sqrt{5}} - \frac{1}{\sqrt{6}} + \cdots = 1 + \sum_{n=3}^{\infty} (-1)^{n+1} \frac{1}{\sqrt{n}}\) (with the \(n=2\) term replaced by 0).

  **Convergence in Natural Order:**
  - The series converges by the alternating series test (terms decrease to 0), but it is not strictly alternating due to the missing negative term at \(n=2\).

  **Conditional Convergence:**
  - Absolute series: \(\sum |b_n| = |1| + |0| + \left| \frac{1}{\sqrt{3}} \right| + \left| -\frac{1}{\sqrt{4}} \right| + \cdots = 1 + 0 + \frac{1}{\sqrt{3}} + \frac{1}{\sqrt{4}} + \cdots\), which diverges (same as \(\sum \frac{1}{\sqrt{n}}\) minus the \(n=2\) term).
  - Positive part: Terms for \(n=1\) and odd \(n \geq 3\) (e.g., \(n=1,3,5,\ldots\)) sum to \(\infty\).
  - Negative part: Terms for even \(n \geq 4\) (e.g., \(n=4,6,8,\ldots\)) sum to \(-\infty\).
  - Thus, the expectation is \(\infty - \infty\), undefined.

