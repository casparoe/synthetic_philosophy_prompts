prompt: |-
  I've come to accept a broadly Humean position about testimony and miracles: in short, that a report of a miracle can never rationally establish the miracle, because the evidence from uniform experience in favour of the relevant law of nature will always outweigh the evidence from testimony, and it will always be more probable that the witness was deceived or deceiving than that the law was violated. I know the position has an escape clause — roughly, the report would only be believable if the report's being false would itself be more miraculous than the event reported — and I want to know how much work that clause is doing.

  I'd like you to map this position's exposure. What would count against it? I want the observations, cases, arguments and formal results that should most move me away from it, sorted by how decisive they would be, including anything that has arguably already happened. In particular, tell me whether the position has been insulated into unfalsifiability by its escape clause, and whether that matters here in the way it would matter for a software system that can reinterpret any failed test as a bug in the test. I don't need a reading list or citations; I need the substantive map. As someone with a software background, I'll find a clean falsification condition or a formal argument much more persuasive than appeals to intuition.

  Please structure the response with these sections, in this order, using British English throughout:
  - "The position restated" (roughly 150 words)
  - "What the position predicts that its rivals don't" (roughly 200 words)
  - "Defeaters, ranked from fatal to merely awkward" (roughly 600 words)
  - "What a committed defender would concede" (roughly 250 words)
  - "Is it insulated, and does that matter?" (roughly 250 words)
  - "My honest assessment" (roughly 150 words)
