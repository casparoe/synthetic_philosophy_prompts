  I'm a physics engine programmer, so talk to me in my language: fixed timesteps, discrete integration, collision detection, time-of-impact queries, tunneling, frames versus instants. Restate Zeno's paradoxes -- the dichotomy, Achilles and the tortoise, the arrow, and the stadium if it helps -- in that vocabulary. I want a precise mapping: which parts of the paradoxes are claims about sampling a continuous trajectory at discrete times, which are claims about completing an infinite sequence, and which of my engine concepts actually carry the philosophical weight. Then give me the residue report: what translates cleanly, what you had to fudge, and what has no counterpart in engine terms at all. I want to know whether my instinct -- that Zeno is basically describing the difference between a discrete simulation and an analytic solution, and so isnt much of a problem once you have limits -- is right, or whether the engine vocabulary is silently dropping the hard part.
