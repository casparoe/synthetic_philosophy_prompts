answer: |-
  The phenomenon you describe—where agents with fundamentally different moral values cooperate reciprocally to achieve mutual moral gains by their own standards, without conceding ground on their core principles—is an established concept in moral philosophy and decision theory. It is most commonly termed **moral trade**. Below, I delineate its precise boundaries, necessary conditions, and distinctions from neighbouring concepts, using British English throughout.

  ### Core Definition of Moral Trade
  **Moral trade** occurs when two or more parties, holding *incommensurable moral priorities*, explicitly agree to reciprocally perform actions that each party deems:  
  - **Low-cost** by their *own* moral calculus (requiring minimal sacrifice of their core values),  
  - **High-value** by the *counterparty’s* moral calculus (significantly advancing the other’s goals).  

  This results in a net moral gain for all parties when evaluated against their *distinct* value systems. Crucially, no party compromises their principles or adopts the other’s worldview.

  ### Necessary Conditions
  1. **Radical Value Asymmetry**:  
     Each party must prioritise their own moral goal *substantially more* than the other’s goal. For Party A, Goal A is paramount; Goal B is trivial. For Party B, the reverse holds.  
     - *Boundary case*: If both parties assign moderate value to the other’s goal (e.g., A values Goal B at 40% of Goal A), the exchange may resemble ordinary cooperation, not moral trade.  
     - *Necessity*: Without asymmetry, mutual gains diminish.  

  2. **Reciprocity and Explicit Agreement**:  
     Actions must be contingent on the counterpart’s performance ("I do X if you do Y").  
     - *Boundary case*: Unilateral "gifts" (e.g., A donates to B’s cause unsolicited) lack reciprocity and thus are not moral trade.  
     - *Necessity*: Without assurance of reciprocation, moral hazard arises (one party risks bearing costs without gains).  

  3. **Subjective Cost-Value Disparity**:  
     Each action must be:  
     - **Low cost** to the performer (by their values),  
     - **High value** to the recipient (by their values).  
     - *Boundary case*: If Party A views performing X as *immoral* (not merely low-value), they cannot engage—e.g., an animal rights activist might refuse to fund animal testing, even for malaria research.  

  4. **Counterfactual Impact**:  
     Each party must act *differently* than they would without the trade.  
     - *Example*: The disease-prevention volunteer wouldn’t work at an animal sanctuary alone; the animal activist wouldn’t fund malaria prevention alone.  

  ### Distinctions from Neighbouring Concepts
  | Concept              | Key Difference                                                                 | Example                                      |
  |----------------------|--------------------------------------------------------------------------------|----------------------------------------------|
  | **Compromise**       | Parties accept *less* of their goal to reach agreement. Moral trade gives *more* of each goal. | Committee members splitting budget 50/50 instead of each securing full funding. |
  | **Logrolling**       | Trades self-interest or policy preferences (e.g., "I support your bill for pork-barrel funds"). Moral trade exchanges *moral* gains, not personal benefits. | Politicians trading votes for re-election advantage. |
  | **Economic Exchange**| Uses a common currency (money, utility). Moral trade lacks commensurability—gains are in distinct "moral currencies." | Buying bread: both value GBP, not divergent ideals. |
  | **Moral Offsetting** | Single agent balancing their *own* moral ledger (e.g., carbon offsetting). Moral trade is multi-agent and additive. | An executive flies privately but donates to conservation. |

  ### Edge Cases and Ambiguities
  - **Must the action have *some* positive value to the performer?**  
    Yes. If Party A sees Party B’s goal as *actively evil*, performing X could violate A’s principles, precluding trade. The action must be morally permissible, even if trivial (e.g., donating money is neutral; harming animals may be impermissible).
  - **Can the trade involve unequal "effort"?**  
    Yes. Effort is irrelevant; value asymmetry matters. Donating £100 may be "low-cost" to a wealthy activist but "high-value" to a charity.
  - **Is persuasion required?**  
    No. Parties need only recognise each other’s values exist, not endorse them. The disease-preventer need not believe animals matter—only that the activist cares.

  ### Conclusion
  **Moral trade** is the established term for this phenomenon, rigorously defined by philosophers like Will MacAskill (2014) and Toby Ord. It requires:  
  1. Irreconcilable moral priorities,  
  2. Explicit reciprocal agreement,  
  3. Asymmetric cost-value assessments,  
  4. Counterfactual action.  

  It is not merely a theoretical curiosity—it offers a pragmatic framework for cooperation in pluralistic societies, from policy-making (e.g., cross-partisan alliances) to global philanthropy. If your observations extend beyond these criteria (e.g., tacit trades or non-reciprocal acts), they may represent adjacent dynamics like *mutualism* or *coordination games*, but **moral trade** best captures the structure you describe.
