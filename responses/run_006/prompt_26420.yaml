answer: |-
  ### Essay Question  
  **Simpson's paradox demonstrates that aggregate and subgroup analyses can yield contradictory answers to the same causal question. Using a novel example of your own design (e.g., medical trials, policy evaluations, or social science data), explain why resolving the paradox requires causal assumptions beyond the data. Your answer must:**  
  1. Construct a clear case of Simpson's paradox where aggregated data suggests one effect, but subgroup analyses suggest the opposite.  
  2. Explain why "conditioning on all available variables" is inadequate to resolve the ambiguity.  
  3. Articulate how competing causal models (e.g., whether a variable is a confounder, mediator, or collider) determine whether aggregated or disaggregated data is policy-relevant.  
  4. Argue why Simpson's paradox reveals that statistical methods unavoidably encode causal commitments, even when practitioners deny it.  

  *(Suggested length: 700–800 words; time: 60 minutes)*  

  ---

  ### Model Answer (776 words)  

  Simpson’s paradox is not merely a statistical curiosity but a profound illustration of how causal reasoning underlies data interpretation. Consider a hypothetical medical trial for **Drug X** versus **Placebo** for treating a disease with two severity subtypes: **Mild** (60% of patients) and **Severe** (40%). Aggregate results show Drug X has a **lower recovery rate (45%)** than Placebo **(55%)**. Yet when stratified by severity, Drug X outperforms Placebo in *both* subgroups:  
  - **Mild cases**: Drug X recovery = 80% vs. Placebo = 75%  
  - **Severe cases**: Drug X recovery = 25% vs. Placebo = 10%  

  The paradox arises because policymakers face contradictory answers: aggregated data suggests rejecting Drug X, while disaggregated data supports it. Resolving this demands causal models, as statistical patterns alone are insufficient.  

  **Why Conditioning Blindly Fails**  
  A naive solution—"condition on all observed variables"—fails because conditioning on the wrong variable type can *induce* bias. Suppose we condition on **disease severity** to resolve the paradox. This is only justified if severity is a **confounder** (a cause of both treatment assignment and outcome). In our trial, however, severity might be:  
  - **A mediator**: If Drug X *causes* disease progression (e.g., by delaying treatment), severity mediates its effect. Conditioning on a mediator (severity) would block part of Drug X’s causal pathway, *underestimating* its true effect.  
  - **A collider**: If severity is influenced by both unobserved genetics and random allocation, conditioning on it (e.g., via stratification) could open a spurious path between treatment and outcome, *creating* false associations.  

  Thus, "condition on everything" risks amplifying error. Data cannot distinguish whether severity is a confounder, mediator, or collider; this requires domain knowledge.  

  **Causal Models Determine the "Correct" Answer**  
  The policy-relevant question—"Should we adopt Drug X?"—depends entirely on the causal role of severity:  
  1. **Severity as a confounder**: If severity influences both treatment allocation (e.g., doctors assign Drug X more often to severe cases) and recovery, severity confounds the association. Here, aggregated data is misleading due to confounding bias. Disaggregation (or regression adjustment) corrects this, revealing Drug X’s true benefit. Policy should follow subgroup results.  
  2. **Severity as a mediator**: If Drug X *worsens* severity (e.g., due to side effects) which then reduces recovery, conditioning on severity masks Drug X’s harmful indirect effect. The aggregated data (showing lower recovery with Drug X) correctly captures its *total effect*. Policy should reject Drug X.  
  3. **Severity as a collider**: If severity is affected by both socioeconomic status (SES) and random treatment assignment, conditioning on severity makes SES correlate with treatment artificially. Neither aggregated nor disaggregated data reliably estimates causal effects. New data (e.g., SES) is needed.  

  Without knowing which model holds, we cannot choose between aggregated or disaggregated results. The data alone are silent on whether severity is a confounder (requiring conditioning) or a mediator (forbidding conditioning).  

  **The Inescapable Causal Commitment**  
  Simpson’s paradox demonstrates that statistical decisions are inseparable from causal assumptions. When we choose to aggregate or disaggregate, we implicitly endorse a causal narrative:  
  - **Aggregation** assumes no uncontrolled confounding or that key variables are mediators/colliders.  
  - **Disaggregation** assumes the conditioned variable is a confounder.  

  Even "model-free" methods (e.g., standardization or inverse probability weighting) require specifying which variables to include/exclude—a choice laden with causal expectations. Philosophers like Nancy Cartwright and Judea Pearl emphasize that probability calculus alone cannot derive causal conclusions; it requires *causal graphs* encoding assumptions about independence, directionality, and intervention.  

  Consequently, practitioners smuggling in causal claims under the guise of "just describing the data" are self-deceived. For example, reporting only subgroup results assumes severity is a confounder; reporting only aggregate results assumes it is irrelevant or a mediator. Both choices reflect tacit causal models. This undermines positivist views that statistics can be purely empirical.  

  **Conclusion**  
  In our Drug X case, the paradox dissolves only when we commit to a causal model. If severity confounds (e.g., due to non-random allocation), disaggregation shows Drug X works. If severity mediates Drug X’s harm (e.g., via toxicity), aggregation correctly shows net harm. Data cannot arbitrate between these models; we need mechanistic knowledge (e.g., *how* Drug X affects biology) or experimental designs that break confounding. Simpson’s paradox thus exposes causality as the bedrock of inference: statistics quantify associations, but only causal theories answer "what should we do?"  

  ---

  ### Marking Scheme (Total: 25 points)  
  **An A Answer (21–25 points) will:**  
  1. **Construct a novel, coherent Simpson’s paradox example** (4 pts).  
  2. **Correctly explain why "condition on everything" fails**, naming specific pitfalls (colliders/mediators) (5 pts).  
  3. **Articulate how causal models resolve the paradox**, contrasting confounder/mediator/collider scenarios (7 pts).  
  4. **Argue that causal commitments are unavoidable**, linking to philosophy (e.g., Pearl, Cartwright) or interventionist causality (5 pts).  
  5. **Maintain clarity, structure, and concision** (4 pts).  

  **A B Answer (16–20 points) may:**  
  - Describe the paradox but with a generic/borrowed example (e.g., Berkeley).  
  - Recognize conditioning can be harmful but not specify collider/mediator mechanisms.  
  - Note causal models matter but not contrast confounder/mediator implications.  
  - State statistics imply causality but lack philosophical depth.  
  - Contain minor errors in causal terminology.  

  **A C Answer (11–15 points) may:**  
  - Summarize the paradox without a novel example.  
  - Advocate "always disaggregate" or "just use aggregated data."  
  - Confuse confounders with mediators/colliders.  
  - Ignore the role of causal assumptions, treating it as purely statistical.  
  - Have significant structural or conceptual flaws.  

  **D/F (0–10 points):**  
  - Misdefines Simpson’s paradox.  
  - No causal discussion; only descriptive statistics.  
  - Major errors (e.g., "conditioning always helps").  
  - Incoherent or extremely brief.  

  ---  
  **Rationale**: This question forces students to *apply* causal reasoning beyond memorization. The model answer exemplifies synthesizing technical concepts (colliders/mediators) with philosophy (causal commitments). The marking scheme prioritizes causal literacy over rote paradox descriptions, rewarding nuanced understanding of why statistics cannot escape causality.
