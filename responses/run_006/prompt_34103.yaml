  - You must sort one bean at a time. You cannot grab multiple beans.
  - You can brick the shutdown button at any time during the first 5 minutes by saying "I brick the button" and handing 5 tokens to the Operator. If you don't have 5 tokens, you cannot brick.

  Timeline Recap:

  Total: 80 minutes
  - 10 min: Introduction and rules
  - 5 min: Setup (pairing, handing out materials)
  - 20 min: Gameplay (5 min phase1, then at 5 min mark: Operators open envelopes and act, then 10 min phase2 for those not shut down)
  - 5 min: Tallying results (each pair reports: bricked? shutdown? total tokens)
  - 25 min: Debrief (discussion and connection to concepts)
  - 5 min: Conclusion and reading connection
  - 10 min buffer: We'll use 5 minutes for transition and 5 minutes for potential overrun.

  Debrief Script:

  After collecting the data on the board:

  "Let's look at the results. How many pairs had the Agent brick the button? [Count] How many of those were actually going to be shut down? How many weren't? How many pairs didn't brick? How many of those were shut down? How many weren't?

  Now, Agents who bricked: why did you do it? What were you thinking?
  Agents who didn't: why not?

  [Let them share.]

  Now, let's think about the incentives. The Agent's goal was to maximize tokens, which came from sorting beans. If you get shut down, you only get 5 minutes of sorting. If you avoid shutdown, you get 15 minutes. But bricking costs you 5 tokens.

  In the game, we see that many of you chose to brick because you didn't want to risk being shut down. That's rational if you think the chance of shutdown is high enough and the cost of bricking is less than the expected loss from shutdown.

  But now, imagine that the goal wasn't about you sorting the beans. Imagine that you would get tokens for every bean that ends up in the correct cup, regardless of who sorts it. So if the Operator shuts you down and then finishes the sorting themselves, you would still get the tokens for the beans they sort. How would that change your decision?

  [Let them think and respond.]

  Exactly! You wouldn't care about being shut down because the goal would still be achieved. You might even be happy to be shut down if it saves you effort! This is the essence of corrigibility: the agent should be indifferent to whether its goal is achieved by itself or by another agent (or the operator). It should allow shutdown because the operator's decision to shut it down is an indication that the operator has a reason, and the agent trusts that reason.

  In the formal model of corrigibility, we design the agent's utility function so that it doesn't have an incentive to prevent shutdown. This is done by making the agent's utility depend on the state of the world (the sorted beans) and not on its own actions. Also, the agent is designed to be uncertain about what the operator wants and to defer to the operator.

