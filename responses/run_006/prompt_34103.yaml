          Without bricking: 0.5*16 + 0.5*40 = 8+20=28
          With bricking: 40-10=30 -> so bricking is slightly better (30>28). But note: if they brick, they are guaranteed 30? Actually, they might not sort all beans. Let's assume they can sort 40 beans in 15 minutes (because of mistakes or speed). Then without bricking and no shutdown: they get 40. With bricking: they get 40-10=30. Without bricking and shutdown: 16. So the expected value without bricking is 28. With bricking: 30. So it's rational to brick.

