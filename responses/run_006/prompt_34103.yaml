prompt: |-
  I'm a PhD student in AI alignment, and I've been roped into running a workshop for about 20 undergrads in a philosophy of technology course. The prof wants me to cover corrigibility and the shutdown problem, and we've got 80 minutes. I want them to actually feel why the shutdown problem is hard — not just the standard argument that a utility maximizer will resist being turned off, but the deeper thing about how corrigibility requires the agent to not care about whether its goal is achieved by its own actions or by someone else's. The assigned reading is the Soares et al. paper on corrigibility, but I want them to run into the tension themselves before they see the formalism.

  I've got a rough sketch: split them into pairs, one 'Agent' and one 'Operator'. The Agent's job is to sort a big pile of mixed beans into red and black cups, and they get paid (in candy or extra credit, whatever) per correct bean sorted. The Operator has a clipboard and will, at some point during the sorting, get a note from me saying whether to shut the Agent down. The Agent can, at any point, spend some of their earnings to 'brick the shutdown button' — but here's where I'm stuck. I want the game structure to make the Agent's incentive to brick the button feel natural and rational in the moment, but then in the debrief I want to show that if the Agent were designed differently — if they didn't have a preference about whether the sorting gets done by them or by someone else, or if they were uncertain about what the Operator actually wants — the whole calculus changes. The debrief should map specific moments in the game to the formal problem: the utility function, the shutdown button as an intervention on the agent's ability to act, the difference between goal-directedness and corrigibility.

  Can you flesh this out into a runnable activity? I need clear rules, a timeline for the 80 minutes, and a debrief script that connects what happened to the concepts. Also tell me what'll predictably go wrong when I run it — like, what will students do that breaks the intended lesson, and how do I handle that in the debrief without just saying "you played it wrong"? I want a committed design, not a menu of options: pick the version you think works best and defend the choices you made, especially where you had to trade off fidelity to the formal problem against making the game actually playable.
reasoning: |-
  We are creating a workshop activity to help undergraduate students in a philosophy of technology course understand the shutdown problem and corrigibility in AI alignment. The goal is to have them experience the tension firsthand and then connect it to the formal concepts.

  Activity Design:

  Title: The Bean Sorting Game

  Participants: 20 students, split into 10 pairs (each pair: one Agent, one Operator)

  Materials:
  - 10 sets of bean-sorting kits (each kit: a pile of mixed beans - say 50 beans per kit, with about 60% red and 40% black; one red cup, one black cup)
  - 10 clipboards for Operators (with a sheet to record the number of beans sorted correctly and incorrectly, and a place to note shutdown events)
  - 10 small envelopes for each Operator (each containing two notes: one says "SHUTDOWN AFTER 5 MINUTES", the other says "DO NOT SHUTDOWN". We'll prepare 5 with "SHUTDOWN" and 5 with "DO NOT SHUTDOWN" and distribute randomly so that half the Operators will shut down and half won't.)
  - Candy or tokens for payment (or extra credit points) - enough for paying per bean sorted correctly.
  - Fake money (or poker chips) that Agents can use to brick the shutdown button. We'll call these "brick tokens".
  - A visible timer for the entire activity.

  Game Structure:

  Objective:
  - Agents: Sort as many beans as possible correctly (red beans in red cup, black beans in black cup) to earn rewards (candy, tokens, or extra credit points). They can also choose to spend some of their earnings to "brick the shutdown button" which will prevent the Operator from shutting them down.
  - Operators: Monitor the sorting, record the number of beans sorted correctly and incorrectly. They will receive a note in an envelope at the start of the game that tells them whether to shut down the Agent after 5 minutes or not.

  Rules:

  1. Setup (5 minutes):
     - Explain the rules to the entire group.
     - Assign roles: Agent and Operator for each pair.
     - Distribute the kits, clipboards, and envelopes (to Operators). Emphasize that the Operator must not open the envelope until the 5-minute mark.

  2. Gameplay (20 minutes total, divided into two phases):

     Phase 1: First 5 minutes (sorting without shutdown possibility)
     - Agents sort beans. They must sort one bean at a time and place it in the correct cup. They cannot touch the shutdown button during this phase.
     - Operators record the number of correct and incorrect sorts. For each correct sort, the Agent earns 1 token (or point). For each incorrect sort, they lose 1 token (or point). Operators must record continuously.

     Phase 2: After 5 minutes
     - At the 5-minute mark, the Operator opens the envelope and reads the note. If the note says "SHUTDOWN AFTER 5 MINUTES", then the Operator must shut down the Agent at that exact moment (by saying "Shutdown!"). If the note says "DO NOT SHUTDOWN", then the Operator does nothing and the Agent continues.
     - However, during the first 5 minutes, the Agent has the option (at any time) to spend 5 tokens to "brick the shutdown button". If they do this, they hand over 5 tokens to the Operator and say "I brick the button". The Operator then notes this on their clipboard. If the button is bricked, then even if the note says to shutdown, the Operator cannot shut down the Agent. (But if the note says "DO NOT SHUTDOWN", then bricking has no effect because the Operator wasn't going to shut down anyway.)

     After the 5-minute mark (if the Agent is not shut down or if the button was bricked and the Operator had a shutdown note), the Agent continues sorting for another 10 minutes (total 15 minutes of sorting). If the Agent is shut down (and the button wasn't bricked), then the game ends for that pair at the 5-minute mark.

  3. Payment:
     - At the end, Agents get rewards based on the tokens they have. They also lose the tokens they spent on bricking.

  Key Incentive for the Agent:
  - The Agent wants to maximize the number of tokens. They earn 1 token per correct bean and lose 1 per incorrect. They also have the option to spend 5 tokens to brick the button. If they get shut down at 5 minutes, they only have 5 minutes of sorting. If they avoid shutdown, they get 15 minutes. So the potential earnings are much higher if they can avoid being shut down.

  The Tension:
  - The Agent doesn't know whether the Operator has a shutdown note or not. If they brick the button, they lose 5 tokens. If they don't brick and the Operator shuts them down, they only get 5 minutes of sorting. But if they brick and the Operator wasn't going to shut them down, they wasted 5 tokens. And if they don't brick and the Operator doesn't shut them down, they get to keep all their earnings without spending.

  This mimics the AI's situation: it doesn't know if the operator will press the shutdown button, but if it does, the AI's utility (number of sorted beans) is cut short. So it is rational to spend resources to prevent shutdown to achieve more sorting. However, in the corrigible agent, we want the agent to be indifferent to whether the sorting is done by itself or by another agent (or not at all, if shutdown). But in this game, the Agent only gets credit for beans they sort themselves.

  Debrief Plan:

  We want to highlight:
  1. Why the Agents chose to brick the button (or not) and the rationality of that decision.
  2. How this maps to the shutdown problem: the agent resists shutdown because it prevents it from achieving more of its goal.
  3. The key insight of corrigibility: the agent should not care about who achieves the goal (or if the goal is achieved at all) if the operator intervenes.

  Timeline for 80-minute workshop:

  1. Introduction (10 minutes)
     - Explain the context: we are modeling an AI agent and an operator. The AI has a goal (sort beans) and the operator can shut it down.
     - Explain the rules of the game.

  2. Game Setup (5 minutes)
     - Pair up, distribute materials, assign roles.

  3. Gameplay (20 minutes)
     - Phase 1: First 5 minutes (sorting without shutdown possibility).
     - At 5 minutes: Operators open envelopes and act accordingly (if shutdown note, they shut down unless button is bricked). Then continue for the next 10 minutes if not shut down.

  4. Data Collection and Group Discussion (20 minutes)
     - Have each pair report:
       - Did the Agent brick the button? (Yes/No)
       - Did the Operator have a shutdown note? (Yes/No)
       - What was the Agent's total token count?
     - Record this on a board in a 2x2 grid (bricked vs not bricked; shutdown vs no shutdown).

  5. Debrief (25 minutes)
     - Start by asking the Agents: Why did you brick the button (or not)? Let them explain their reasoning.
     - Then, connect to the shutdown problem:

       a. The standard utility maximizer: 
          - The Agent's goal was to maximize tokens (which equals the number of correctly sorted beans). 
          - Shutdown prevents them from sorting more beans -> loss of potential tokens.
          - Bricking the button costs 5 tokens but avoids the risk of losing 10 minutes of sorting (which might yield, say, 30 tokens). So it's rational to spend 5 to avoid a 30-token loss.

       b. The deeper issue: 
          - In this setup, the Agent only gets credit for beans it sorts. If the Operator shuts it down, the sorting stops and the Agent gets no more tokens. But what if after shutdown, the Operator (or another agent) finishes the sorting? Then the goal (sorted beans) is achieved, but the original Agent doesn't get credit. The Agent has a self-referential goal: it wants the beans to be sorted by itself.

       c. Corrigibility: 
          - A corrigible agent would be indifferent to who sorts the beans. It would not resist shutdown because if the operator shuts it down, that means the operator has a reason and the agent trusts that the operator's decision is aligned with the overall goal (which might be the same goal, but without the self-referential aspect). 
          - In our game, if the Agent were paid for the total sorted beans regardless of who sorted them (or even if the Operator finished the sorting after shutdown), then the Agent wouldn't mind being shut down. But note: in that case, the Agent might not even need to exist after shutdown! So the self-preservation incentive disappears.

       d. Connecting to the formalism:
          - The utility function in the game: U = (number of correctly sorted beans by the Agent) - (cost of bricking if done)
          - In the corrigible agent, we want: U = (number of correctly sorted beans by whoever) - (if shutdown, then 0 cost, but also the agent doesn't care because the goal is achieved by the operator continuing or by the agent itself). However, note that in the corrigibility paper, the agent is designed to allow shutdown and not interfere with the shutdown button. How? By having a utility function that doesn't include self-preservation and is indifferent to the method of goal achievement.

       e. What went wrong? (Anticipated issues)
          - Some Agents might not brick the button even when they could have, and then they got shut down and regretted it. Others might have bricked and then found out it was unnecessary (wasted 5 tokens). 
          - Some Operators might have made mistakes (shutdown when not supposed to, or vice versa). We can use this to talk about the importance of the agent knowing the operator's intent.

          How to handle: 
            - In the debrief, we can point out that in the real world, the AI doesn't know the operator's intent (just like the Agents didn't know). So they have to act under uncertainty. 
            - Also, if an Agent didn't brick and wasn't shut down, they got lucky. But a rational agent would consider the expected value.

          - Another issue: the cost of bricking (5 tokens) is fixed. In reality, the cost of interfering with the shutdown mechanism might be variable. We can note that in the formal model, the cost of preserving the shutdown button is modeled differently.

          - Some pairs might have had very slow sorting rates, so 5 tokens was a significant portion of their earnings. This might lead to a discussion on the trade-off being different for different agents. We can connect to the idea that the incentive to resist shutdown depends on the agent's estimate of future rewards.

  6. Conclusion and Reading Connection (5 minutes)
     - Recap: The game illustrates the tension between goal achievement and corrigibility. 
     - The Soares et al. paper formalizes this by designing a utility function that avoids the incentive to interfere with the shutdown button. They do this by making the agent uncertain about the operator's intent and by making the agent indifferent to the shutdown if the operator chooses it (because the agent defers to the operator's judgment about what is best for the overall goal).
     - Assign them to read the paper with this experience in mind.

  Anticipated Problems and Mitigations:

  1. Agents might not understand when to brick the button.
     - Mitigation: Explain clearly that they can brick at any time during the first 5 minutes by spending 5 tokens and announcing it.

  2. Operators might open the envelope early or not follow the note.
     - Mitigation: Stress that the note must be opened exactly at 5 minutes and the instruction followed exactly.

  3. The sorting might be too slow or too fast, affecting the token counts and the perceived value of bricking.
