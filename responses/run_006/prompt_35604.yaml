answer: |-
  Here’s an adversarial-collaboration document designed to force clarity, avoid strawmen, and identify genuine disagreements. It’s structured to be endorsed by both camps, focusing on shared premises, distinct positions, and testable cruxes.

  ---

  **Adversarial Collaboration Document: The Boundary Problem in Democratic Theory**  
  *Jointly Endorsed by the All-Affected-Interests (AAI) and All-Subjected (AS) Camps*

  ### I. Jointly Endorsed Claims (Non-Vacuous Common Ground)
  1.  **The Core Problem:** The boundary problem asks *who constitutes the legitimate democratic demos* for any given collective decision. It is distinct from questions of *how* decisions are made within a bounded group.
  2.  **Legitimacy Stakes:** Resolving the boundary problem is necessary for democratic legitimacy. A wrongly bounded demos systematically excludes those with a moral claim to inclusion (AAI concern) or dilutes the agency of those bearing primary burdens of compliance (AS concern), undermining the decision’s authority.
  3.  **The "Getting It Wrong" Risk:** Both principles aim to avoid serious harms:
      *   **AAI Risk:** Excluding deeply affected individuals (e.g., disenfranchised residents, future generations, pollution victims) constitutes a fundamental injustice and delegitimizes decisions.
      *   **AS Risk:** Including individuals not subject to a polity’s coercive enforcement (e.g., distant foreigners minimally affected by policy) undermines collective self-determination, creates unmanageable scales, and severs the link between authority and obligation.
  4.  **Coercion is Central:** All political authority inherently involves coercion, and any defensible demos principle must account for this. The disagreement lies in *how* coercion relates to membership.
  5.  **Non-Circularity Commitment:** The demos cannot be defined solely by the existing legal boundaries it seeks to justify (e.g., "citizens" defined by current law). An independent normative principle is required.
  6.  **Practicality Matters:** While primarily normative, the implications for institutional feasibility are a valid secondary consideration in evaluating a principle, though not a dispositive argument against its normative core.

  ### II. Table of Key Disagreements
  | Sub-Question                                                                 | All-Affected-Interests (AAI) Position                                                                                                | All-Subjected (AS) Position                                                                                                        |
  | :--------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Core Criterion:** What fundamentally *creates* the claim to inclusion? | **Inclusion Trigger:** Having one's significant interests foreseeably and demonstrably *affected* by the decision creates a presumptive claim to a say. | **Inclusion Trigger:** Being systematically *subject to the coercive rules and enforcement mechanisms* of the polity making the decision creates the claim. |
  | **2. Scope & Boundedness:** Can the demos be bounded, or is it inherently global? | **Answer:** While *all* affected globally have a claim in principle, practical demoi can be bounded by prioritizing *intensity* and *proximity* of effects, or via delegated representation. Global democracy remains a normative ideal worth approximating. | **Answer:** The demos is inherently bounded by the *jurisdiction* of the coercive authority. "Subjection" creates a naturally bounded group (those under the state's rule), avoiding global scope. |
  | **3. Basis of Legitimacy:** Why does your principle confer legitimacy?       | **Answer:** Legitimacy arises from respecting the autonomy and interests of all those meaningfully impacted by a decision. To impose effects without voice is domination. | **Answer:** Legitimacy arises from the consent and authorship of those who bear the primary burden of being *ruled* – those coerced into compliance. |
  | **4. Handling "Affected-Not-Subjected":** (e.g., foreign residents, pollution victims abroad) | **Answer:** These individuals *must* have a voice (e.g., via special representation, transnational bodies, enfranchisement). Their exclusion is a core failure of the AS principle. | **Answer:** While their interests deserve consideration (e.g., via diplomacy, international law, rights protections), inclusion in the *demos* is inappropriate as they aren't subject to the *full coercive order*. Alternative mechanisms are needed. |
  | **5. Handling "Subjected-Not-(Obviously)-Affected":** (e.g., citizens in remote areas minimally impacted by a specific law) | **Answer:** Inclusion is still justified because subjection implies potential for significant effect across many decisions, and citizenship embodies a general stake in the system. Subjection is a strong proxy for affectedness. | **Answer:** Inclusion is justified because they are subject to the coercive authority *as a system*, regardless of the impact of one specific law. Obligation to obey implies a right to participate. |

  ### III. Cruxes: Pivotal Questions Where Resolution Could Shift Positions
  1.  **Does the AAI Principle Necessarily Collapse into Global Democracy? (And is this a fatal flaw?)**
      *   **Shared Evidence/Argument:** Empirical analysis of cross-border effects (economic, environmental, security); Philosophical arguments about the nature of "significant interests" and thresholds; Institutional proposals for bounded-but-inclusive demoi (e.g., federations, differentiated citizenship).
      *   **AAI Prediction:** Clear thresholds for "significant" affectedness exist; global democracy isn't the only institutional implication (e.g., nested demoi, transnational representation); if global democracy *is* implied, it's a normative strength, not a flaw.
      *   **AS Prediction:** AAI inherently lacks a coherent stopping point before global inclusion; attempts to bound it (intensity/proximity) are arbitrary or collapse back into subjection; global democracy is impractical and undermines self-determination, thus a fatal flaw.

  2.  **Can the "Affected-Not-Subjected" Problem be Solved Without Demos Inclusion?**
      *   **Shared Evidence/Argument:** Effectiveness of existing non-electoral mechanisms (international courts, treaties, diplomatic pressure, domestic rights protections for non-citizens); Analysis of cases where excluded groups suffered severe harm despite these mechanisms; Feasibility studies of novel inclusion mechanisms (e.g., limited voting rights, consultative assemblies).
      *   **AAI Prediction:** Existing alternatives are insufficient, often non-binding, and lack democratic accountability *to the affected*. Only formal inclusion guarantees adequate voice and prevents domination.
      *   **AS Prediction:** Robust non-electoral mechanisms *can* effectively protect interests and provide voice without conflating interest-protection with full demos membership, preserving bounded self-determination.

  3.  **Is Subjection a Necessary and Sufficient Proxy for the Most Fundamental Democratic Relationship?**
      *   **Shared Evidence/Argument:** Conceptual analysis of political obligation, coercion, and autonomy; Historical cases where subjected groups lacked voice vs. cases where affected outsiders claimed voice; The phenomenology of being ruled vs. being impacted.
      *   **AAI Prediction:** Subjection is a *common* but not *necessary* condition for a fundamental stake; being deeply affected without subjection still creates a core democratic claim. Subjection alone may include those with minimal stake.
      *   **AS Prediction:** Subjection defines the unique relationship of being *ruled* – it is the necessary and sufficient condition for the specific kind of obligation and authority that democracy mediates. Affectedness alone creates claims of justice, not necessarily democratic voice.

  4.  **Is the Feasibility/Stability Concern a Decisive Objection or a Manageable Challenge?**
      *   **Shared Evidence/Argument:** Political science on scale and democratic effectiveness; Historical examples of large/complex democracies vs. failures; Institutional innovation studies.
      *   **AAI Prediction:** Practical challenges (scale, identification) are significant but surmountable through institutional design and prioritization; dismissing the principle due to feasibility sacrifices justice for convenience.
      *   **AS Prediction:** The impracticality of reliably identifying/weighting all affected interests and the instability of massively unbounded demoi constitute decisive *normative* objections, as they prevent the realization of effective collective self-government, a core democratic value.

  ### IV. Potential Verbal Disagreement
  *   **The Term "Interests":** Some disagreement might stem from differing implicit definitions. Does "interests" refer only to basic well-being/rights (potentially narrower, closer to AS concerns), or broader preferences/autonomy (broader, core AAI)? **Recommendation:** Both sides should explicitly define the scope of "interests" they consider normatively relevant for inclusion claims to ensure they aren't talking past each other on this foundational concept.

  ---

  **How to Use This Document:**
  1.  **Sign the Joint Claims:** Ensure both camps genuinely agree on Section I. If not, revise until consensus is reached – this establishes the shared battlefield.
  2.  **Review the Table (Section II):** Each camp should verify their position is accurately and fairly represented. This clarifies *where* the disagreements lie.
  3.  **Focus Debate on the Cruxes (Section III):** Structure future discussions around these pivotal questions. Encourage each side to present their best evidence/arguments for their prediction regarding each crux. The goal is to find which cruxes, if resolved by evidence or argument, could actually change minds or reveal deeper incompatibilities.
  4.  **Clarify Terminology (Section IV):** Explicitly define key terms like "significant interests" and "systematic subjection" at the outset of discussing each crux.

  This document forces clarity by separating agreed foundations, clearly articulating opposed positions in each side's own terms, and pinpointing the specific, testable questions that could actually resolve the deadlock. Good luck!
