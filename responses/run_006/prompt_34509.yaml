prompt: |-
  I was arguing with my friend about what counts as science and after a long back and forth she gave me her verdicts on a bunch fields. She says physics, evolutionary biology, and climate modeling are definitely science. Astrology, Freudian psychoanalysis, and homeopathy are definitely not science. She also says string theory is not science, the search for extraterrestrial intelligence is not science, and macroeconomics is not science. The argument basically ended there but I kept thinking about it.

  What gets me is the dark matter search. It makes specific predictions—WIMPs should produce certain recoil signals in detectors, axions should convert to photons in a magnetic field—and these are actively being tested. But it's been decades with no detection and the parameter space keeps shrinking, and I can't tell if she'd say that's exactly what science looks like (risky predictions, honest testing) or exactly what pseudoscience looks like (moving goalposts, unfalsifiable core).

  So what do you think my friend would say about the search for dark matter, and what rule or rules best capture her pattern of verdicts? I'm less interested in the answer itself than in the candidate rules, which ones fit her verdicts equally well, where they disagree on the dark matter case, and what further case would best tell them apart.

  Format your answer with these sections:
  - "Candidate rules" (~150 words): lay out the two or three most plausible rules that fit her verdicts
  - "The dark matter case" (~100 words): say what each rule predicts about dark matter searches and why
  - "Best guess" (~100 words): which rule you think she's actually running, with your reasoning
  - "The clincher" (~75 words): the further case—real or hypothetical—that would best settle which rule she's using, and what her answer would reveal
