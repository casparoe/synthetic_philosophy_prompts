answer: |-
  Here's the analysis based on your friend's verdicts:

  **Candidate Rules (~150 words):**
  Based on her verdicts, three rules are plausible:
  1.  **Strict Falsificationism:** Science requires making *immediately testable, specific predictions* with a clear potential for falsification. Fields lacking such concrete, near-term tests are excluded. This fits rejecting string theory (no testable predictions), SETI (no falsifiable timeframe/contact method), and potentially macroeconomics (complex models often lack definitive falsifying tests). It accepts physics, evolutionary bio, and climate modeling (all make testable predictions).
  2.  **Empirical Success Requirement:** Science must demonstrate a *consistent track record of successful empirical verification and predictive power*. This fits rejecting Freudian psychoanalysis and homeopathy (failed empirical tests), astrology (no success), and macroeconomics (inconsistent predictive success). It accepts fields with established empirical foundations (physics, bio, climate). String theory and SETI lack verified successes.
  3.  **Consilience & Integration:** Science requires *integration of evidence from multiple, independent lines of inquiry* converging on a coherent explanation, not just isolated predictions. This fits accepting evolutionary biology (fossils, genetics, biogeography) and climate modeling (physics, chemistry, geology, observations). It rejects Freudian (isolated, not integrated with neuroscience), astrology (no consilience). String theory/SETI lack broader empirical integration.

  **The Dark Matter Case (~100 words):**
  *   **Under Strict Falsificationism:** Dark matter searches *are science*. They make specific, testable predictions (WIMP recoils, axion conversion) actively being pursued in experiments designed to falsify the hypotheses. The shrinking parameter space *is* the process of falsification at work.
  *   **Under Empirical Success Requirement:** Dark matter searches are *borderline or not science*. Despite decades of effort, the core prediction (direct detection of a specific candidate) has *not* been verified. The lack of success, shrinking parameters, and proliferation of models might look like persistent failure, akin to pseudoscience avoiding decisive falsification.
  *   **Under Consilience & Integration:** Dark matter searches *are science*. The *motivation* comes from overwhelming consilient evidence (galaxy rotation curves, gravitational lensing, CMB, large-scale structure) demanding *some* explanation, even if the specific candidate searches haven't succeeded yet. The searches are part of integrating cosmological evidence.

  **Best Guess (~100 words):**
  Your friend is most likely applying the **Empirical Success Requirement**. Her rejection of macroeconomics is the strongest indicator – macroeconomics *does* make testable predictions (e.g., inflation effects, policy impacts), but their frequent inaccuracy or inconsistency likely leads her to deem it insufficiently successful empirically. Similarly, her inclusion of climate modeling (which has successfully predicted trends) and exclusion of string theory/SETI (no verified predictions) align perfectly with demanding a proven track record of successful empirical verification. Dark matter searches' lack of a definitive detection after sustained effort would likely push her towards classifying it as "not science" under this rule.

  **The Clincher (~75 words):**
  **The Further Case:** Ask her about **high-temperature superconductivity research (specifically the search for the mechanism/theory)**. It makes predictions testable in complex lab setups (Strict Falsificationism), has a huge practical success (empirical discovery of materials), but lacks a single, universally accepted, empirically verified fundamental theory explaining *all* phenomena (lack of Empirical Success for the core theory). It integrates condensed matter physics, chemistry, and materials science (Consilience).
  *   **What it Reveals:** If she accepts it (due to practical materials success), she's Empirical Success. If she focuses on testable predictions, she's Strict Falsificationist. If she emphasizes integration across physics/chemistry, she's Consilience. Rejection likely confirms Empirical Success (due to the unresolved core theory).
