  The within-family study discrepancy is important. Traditional heritability estimates include environmental advantages that correlate with genetics (like educated parents passing on genes and resources). Within-family studies remove that shared environment, often showing lower heritability. That explains why their friend's study differs from headlines - both are "correct" but measure different things. 

  For practical implications: Individual treatment is paramount. Heritability says nothing about an individual's potential. Policy-wise, high heritability doesn't mean interventions are futile - see how heritability of height increased with better nutrition. In hiring, using genetic arguments is both scientifically flawed and ethically dangerous. 

