prompt: |-
  I spent forty years in a field where you couldn't sign off on anything without a license, so maybe I'm primed to notice this. We wouldn't let a random person remove a gallbladder, design a bridge, or land a plane full of passengers; we demand demonstrated competence. But the very same person can vote on trade policy, nuclear energy, monetary policy, or a pandemic response, and their vote counts exactly as much as an epidemiologists. And we're not consistent about it: we deny the vote to children and, in some places, to felons, but the idea of a competence test for adults is treated as outrageous. What view of political judgment does that pattern presuppose? Does it have to assume political decisions are different in kind from technical ones, or that the franchise is about something besides getting the answer right, or that ordinary voters are secretly competent enough that the comparison is unfair? I've been reading about epistocracy and I can't tell whether our practice is committed to a view or just never worked one out. Reconstruct the implicit theory, separate what the practice strictly presupposes from what it merely fits with, and tell me what would actually have to change in practice if we took the epistemic view seriously. Lead with your bottom line in the first sentence, then give the reasoning, no preamble and no restating the question.
reasoning: |-
  Okay, let me unpack this user's query. They spent 40 years in a licensed profession, so their background clearly values demonstrated competence. They're questioning why society requires licenses for technical tasks like surgery or engineering but allows anyone to vote on complex policy matters. The core tension they highlight is between epistocracy (rule by the knowledgeable) and democracy's equal voting power. 

  The user seems genuinely puzzled by this inconsistency. They mention reading about epistocracy but can't tell if current practices stem from a coherent philosophy or just historical accident. Their frustration is palpable - they see voting on pandemic response as equally consequential as gallbladder surgery, yet only one requires proof of competence. 

  I notice they're asking three layered questions: (1) What underlying view of political judgment does our voting system assume? (2) Is this assumption philosophically coherent? (3) What would change if we prioritized voter competence? 

  The felon/child voting restrictions interest me - they're hinting that we already exclude some groups, so why not based on knowledge? But equating legal status with competence is slippery. Their comparison feels slightly apples-to-oranges: bridge design has objectively right answers, while trade policy involves value judgments. Still, they've put a finger on something real - why do we treat technical and political expertise so differently?

  Epistocracy literature suggests possible answers: maybe voting isn't about "getting it right" but expressing consent. Or perhaps we assume collective wisdom emerges from diverse inputs. But the user's right that we've never consistently articulated this. The pandemic example is sharp - when epidemiologists disagreed with popular opinion, which "counted" more?

  If we took epistemic views seriously, we'd need radical changes: voter exams, weighted voting, perhaps even revoking universal suffrage. But that path risks creating technocratic elites disconnected from public interest. The user's profession shows licensing works when standards are clear - but politics lacks those objective metrics. 

  Ultimately, our system seems to presuppose that legitimacy matters more than technical correctness in governance. But that leaves the user's original concern unresolved: should it?
answer: |-
  **Bottom line:** Our voting practice presupposes that political legitimacy derives from equal inclusion of affected citizens, treating voting as an expression of membership and consent rather than a technical decision requiring expertise, while implicitly assuming that collective deliberation aggregates diverse perspectives into acceptable outcomes despite individual ignorance.

  **Reasoning:**

  1.  **Legitimacy vs. Epistemic Accuracy:** The system prioritizes *procedural legitimacy* (consent of the governed through universal suffrage) over *epistemic accuracy* (getting the "right" policy answer). Denying votes to children and felons is based on legal status/capacity for responsibility, not knowledge, reinforcing that the franchise is primarily about membership in the political community and having a stake in outcomes. A competence test would undermine this core principle of equal standing.

  2.  **Nature of Political Judgment:** The practice assumes political decisions are fundamentally *different in kind* from technical ones:
      *   **Value-Laden vs. Technocratic:** Policy choices (e.g., trade-offs between liberty and security, equity and efficiency) involve irreducible value judgments where there is no single "correct" technical answer. Expertise informs means, but not the ends, which are chosen democratically.
      *   **Aggregation & Emergence:** It assumes mechanisms like deliberation, party platforms, media, and voting itself aggregate dispersed knowledge and preferences (Hayek's "knowledge problem" applied to politics). The "wisdom of crowds" or systemic filters (e.g., representatives, bureaucracy) are believed to compensate for individual ignorance.
      *   **Tacit Knowledge & Common Sense:** It presupposes ordinary voters possess sufficient "street-level" tacit knowledge of their interests and local conditions, combined with common sense, to judge outcomes and hold leaders accountable, making direct comparison to specialized technical competence unfair.

  3.  **What Practice Strictly Presupposes:**
      *   Voting is a right of membership/standing, not a function requiring demonstrated competence.
      *   Political legitimacy requires inclusion of all (adult, non-felon) citizens affected by decisions.
      *   Collective decision-making processes possess emergent properties that mitigate individual ignorance.
      *   Value choices, not just technical facts, are the core of political conflict.

  4.  **What It Merely Fits With (but doesn't require):**
      *   Strong faith in collective wisdom (Condorcet's Jury Theorem).
      *   Belief voters are *generally* competent enough on average.
      *   Acceptance that some level of policy error is the necessary cost of legitimacy.

  5.  **Changes Required by Taking Epistemic View Seriously:** Adopting epistocracy would necessitate:
      *   **Formal Competence Assessment:** Implementing and defending voter exams on policy-relevant knowledge (civics, economics, science basics).
      *   **Vote Weighting/Differentiation:** Granting more votes or influence to those deemed more knowledgeable (e.g., plural voting) or restricting suffrage to a qualified subset.
      *   **Institutional Redesign:** Creating bodies of experts with veto power over "incompetent" democratic decisions or shifting significant authority to insulated technocratic agencies.
      *   **Rejection of Equal Suffrage:** Abandoning the core democratic principle of "one person, one vote" in favor of a hierarchy based on certified knowledge, fundamentally altering the source of legitimacy from popular will to informed judgment.

  The current system isn't unthought; it's committed to a specific view of political equality and legitimacy that deliberately subordinates epistemic concerns to inclusive consent, trusting systemic and emergent processes over individual voter competence tests.
