prompt: |-
  I run a monthly meetup for freelancers and small business owners in my city, usually around 18 people, and we spend 75 minutes on stuff like pricing, deciding which clients to take, when to stop researching a decision and just commit. I've been reading alot on my own about satisficing and bounded rationality — the idea that because time and attention are scarce, it can be rational to aim for good enough instead of always hunting for the best option. When I try to explain it, people nod, but then someone always says "yeah but if you have the data you should definately find the optimal choice," and we're back to square one. I want them to feel the force of it in a game, not hear it from me.

  So I need an activity for the next meetup: about 18 adults, 75 minutes, no budget, just index cards, pens, and a stopwatch. The game should make people experience the cost of searching for a better option — some kind of sequence of choices where they can keep looking or stop, and where looking more has a real cost. At the end it should be visible that people who set a reasonable standard and took the first thing that met it did better on average than people who kept trying to find the absolute best. No lecture up front, and I don't want the word "satisficing" said until the debrief.

  In your answer, structure it exactly like this: "Setup and materials" (one paragraph), "Rules and flow" (two to three paragraphs), "Scoring and incentives" (one paragraph), "Debrief" (two paragraphs that map what happened to the ideas), and "What will probably go wrong" (one to two paragraphs, with how to fix each thing). Also be honest about which part of the idea the game can't get across and I'll have to supply in the debrief.
