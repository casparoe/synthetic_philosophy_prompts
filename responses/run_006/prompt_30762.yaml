answer: |-
  **Setup and materials**  
  Prepare 10 index cards as "job cards," each displaying a dollar value between $50 and $130 (e.g., 50, 70, 90, 80, 100, 60, 120, 110, 130, 85). Shuffle the deck. Each participant gets one blank index card (score sheet) and a pen. The facilitator needs a stopwatch and a visible timer (e.g., phone projected on a wall).  

  **Rules and flow**  
  The game runs for 10 rounds, simulating job offers. At the start of each round, the facilitator reveals one job card to the group for 10 seconds (use the stopwatch), then hides it. Active participants (those who haven’t accepted a job yet) must decide: **Accept** the current job by writing its value and the round number on their score sheet, or **Reject** it by writing "−$10" for that round. If they reject, they remain active for the next round. If they accept, they’re inactive for future rounds. In round 10, any remaining active participants *must* accept the final job (no search cost for round 10).  

  Participants decide silently during the 10-second reveal. No discussing values or strategies. After revealing a card, the facilitator immediately starts the next round. Example: If a participant rejects in rounds 1–3 and accepts a $90 job in round 4, they pay $30 in search costs (3 rejections × $10) and net $60.  

  **Scoring and incentives**  
  Net earnings = Accepted job value − (Total $10 rejections). After round 10, all calculate earnings. The facilitator publicly ranks net earnings (high to low) on a whiteboard or shared screen. The top 3 earners get symbolic prizes (e.g., "free coffee" coupons drawn on index cards). The goal is to maximize net earnings, not job value alone, creating tension between holding out for high values and minimizing search costs.  

  **Debrief**  
  Start by asking: "Who had the highest job value? Who had the highest net earnings?" Point out that top-value winners often ranked lower in net earnings due to search costs. Then, highlight two patterns: (1) Participants who set a mental threshold (e.g., "take anything over $80") and accepted early typically had moderate job values but low costs, leading to competitive net earnings. (2) Those chasing the "best" job (e.g., $130) accumulated high costs; even if they found it, net gains were often eclipsed by early acceptors. Note that many who waited too long settled for worse jobs under pressure (round 10).  

  Map this to real decisions: "You experienced how endless searching burns resources—time, energy, opportunities. In pricing or client choices, waiting for 'perfect' data often means losing money or momentum. Setting a 'good enough' standard (like taking the first job over $80) isn’t lazy; it’s efficient when search costs exist. This is 'satisficing'—a rational response to limited time and information." Emphasize that satisficing balances effort and outcome, while optimizing ignores hidden costs.  

  **What will probably go wrong**  
  1. **Confusion during play**: Some may miscalculate costs or forget rounds. *Fix*: Run a practice round with a dummy job (e.g., "$100"), demo scoring (accept: $100 net; reject then accept next: $100 − $10 = $90 net), and circulate to check sheets after round 3.  
  2. **Frustration with the sequence**: If the high-value job ($130) appears late, optimizers may feel "punished." *Fix*: Acknowledge this in debrief: "Real-world distributions are unknown—you can’t bank on a late win. This game’s fixed sequence shows typical risks: high values are rare, and waiting is gambly."  
  3. **Time crunch**: 10 seconds/round may rush decisions. *Fix*: Extend to 15 seconds if needed, but keep pressure to simulate real urgency.  

  **What the game can’t teach (needs debrief emphasis)**  
  The game simplifies the "aspiration level" (how to set a "good enough" threshold). Participants might mimic others or guess thresholds arbitrarily. Explain that in reality, thresholds come from experience (e.g., "I know projects under $X/hour waste my time") or goals (e.g., "I need $Y/month to break even"). Stress: "Satisficing isn’t about low standards—it’s about defining *your* ‘win’ upfront and committing when you hit it."
