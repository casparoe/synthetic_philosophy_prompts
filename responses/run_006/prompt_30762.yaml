  1. Confusion about rules: Some participants might not understand when to record costs or how to calculate net earnings. Fix: Run a practice round with a sample job (e.g., $100) and show two scenarios: accepting immediately vs. rejecting and then accepting in the next round (with a $10 cost). Clarify that in the round they accept, they do not pay a search cost.

