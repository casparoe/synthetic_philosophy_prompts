answer: |-
  Below is a decision-tree taxonomy designed to help students navigate the logical space of responses to the situationist challenge in virtue ethics. The tree starts with a root question and branches based on concrete, empirically grounded claims. Each branch point includes a note on whether the claim is **settled** (broad consensus among experts), **contested** (active disagreement), or **mixed** (some aspects settled, others debated). The tree yields 8 distinct leaves (positions) and identifies unoccupied regions of the logical space.  

  ### **Decision Tree: Responses to the Situationist Challenge**  
  **Root Question (Q1):**  
  *Does the situationist evidence (e.g., Milgram, Good Samaritan, dime-in-the-phone-booth studies) show that human behavior varies across situations in ways that are incompatible with robust, cross-situationally consistent character traits?*  
  - **Branch note:** **Contested.** Situationists (e.g., Doris, Harman) argue "yes"; critics question the evidence's validity or interpretation (e.g., Sabini & Silver, Kamtekar).  

  ---

  #### **Branch 1: No** → Proceed to Q2.  
  *(The evidence does **not** show incompatibility with robust traits.)*  

  **Question 2 (Q2):**  
  *Is the problem with the evidence that it fails to engage the cognitive-affective processes central to virtue (e.g., reflection, commitment to moral reasons)?*  
  - **Branch note:** **Contested.** Critics (e.g., Annas, Sreenivasan) argue experiments lack ecological validity; situationists insist the evidence generalizes.  
    - **Yes** → **Cognitive-affective framework response.**  
      *Virtues require specific cognitive-affective engagement; situationist studies target "hot" automatic processes, not virtues.*  
    - **No** → Proceed to Q3.  

  **Question 3 (Q3):**  
  *Does the evidence instead support an interactionist view: behavior is shaped by both traits **and** situations, but traits remain significant?*  
  - **Branch note:** **Mixed.** Psychologists (e.g., Mischel) agree traits/situations interact, but philosophers debate whether this preserves "robust" traits.  
    - **Yes** → **Interactionist view.**  
      *Traits exist but are dynamically responsive to situations; virtue ethics must integrate situational factors (e.g., Alfano, Snow).*  
    - **No** → **Empirical denial.**  
      *The evidence is methodologically flawed or misinterprets behavioral inconsistency (e.g., Sabini & Silver, Kupperman).*  

  ---

  #### **Branch 2: Yes** → Proceed to Q4.  
  *(The evidence **does** show incompatibility with robust traits.)*  

  **Question 4 (Q4):**  
  *Can virtue ethics avoid this problem by denying it makes empirical claims about trait consistency?*  
  - **Branch note:** **Contested.** Critics (e.g., Merritt, Doris) argue virtue ethics is empirically committed; defenders (e.g., Athanassoulis) claim it is purely normative.  
    - **Yes** → **Normative insulation.**  
      *Virtue ethics only prescribes ideals; it doesn’t depend on widespread trait possession (e.g., Swanton, some neo-Aristotelians).*  
    - **No** → Proceed to Q5.  

  **Question 5 (Q5):**  
  *Do people still possess character traits, just not "global" ones?*  
  - **Branch note:** **Settled.** All parties agree local traits exist (e.g., "office-politeness"); disagreement centers on whether they suffice for virtue.  
    - **Yes** → **Local-traits view (Doris).**  
      *Traits are context-bound fragments; virtue ethics must be revisionary (e.g., Doris, Harman).*  
    - **No** → Proceed to Q6.  

  **Question 6 (Q6):**  
  *Could robust traits exist but be exceptionally rare?*  
  - **Branch note:** **Contested.** Situationists (e.g., Harman) call this ad hoc; virtue theorists (e.g., Kamtekar) argue rarity is consistent with virtue ethics.  
    - **Yes** → **Rarity claim.**  
      *Virtues are real but scarce; experiments miss rare exemplars (e.g., traditional Aristotelian responses).*  
    - **No** → Proceed to Q7.  

  **Question 7 (Q7):**  
  *Does abandoning robust traits require rejecting virtue ethics?*  
  - **Branch note:** **Contested.** Revisionists argue virtue ethics can adapt; abolitionists say it collapses without robust traits.  
    - **No** → **Revisionist virtue ethics.**  
      *Virtue ethics survives by redefining virtues as context-sensitive or anti-realist (e.g., Merritt, Appiah).*  
    - **Yes** → **Capitulation.**  
      *Virtue ethics (as traditionally understood) is empirically untenable (e.g., Harman's eliminativism).*  

  ---

  ### **Taxonomy Summary**  
  **Leaves (8 Positions):**  
  1. **Cognitive-affective framework response** (e.g., Annas, Sreenivasan)  
  2. **Interactionist view** (e.g., Alfano, Snow)  
  3. **Empirical denial** (e.g., Kupperman, Sabini & Silver)  
  4. **Normative insulation** (e.g., Swanton, Athanassoulis)  
  5. **Local-traits view** (e.g., Doris, Harman)  
  6. **Rarity claim** (e.g., Kamtekar, traditional Aristotelians)  
  7. **Revisionist virtue ethics** (e.g., Merritt, Appiah)  
  8. **Capitulation** (e.g., Harman)  

  **Unoccupied Regions & Why:**  
  - **"Global traits exist and are common, but the evidence is valid"**: Incoherent. Accepting the evidence’s validity while asserting widespread global traits contradicts Q1’s "yes" branch.  
  - **"Traits don’t exist, but virtue ethics is empirically insulated"**: Unattractive. If traits don’t exist, insulating virtue ethics appears question-begging (no major theorists hold this).  
  - **"Robust traits exist, are common, and the evidence tests virtues properly"**: Incoherent with Q1’s "yes" branch.  

  **Ambiguous/Overlapping Positions:**  
  - **Rarity vs. cognitive-affective**: The tree separates these (via Q2), but some defenses blend both (e.g., "virtues are rare *because* they require cognitive engagement").  
  - **Local-traits vs. revisionism**: Doris-style local traits are revisionist, but Q7’s "revisionism" covers non-trait-based approaches (e.g., Appiah’s institutional focus).  

  **How to Use:**  
  - Hand out the tree **before** labeling positions. Ask students to answer the questions based on their interpretation of the evidence and readings.  
  - Reveal position labels afterward to spark debate about whether the tree accurately maps the logical space.  
  - Highlight **contested** branches to show where the debate is live (e.g., "Is virtue ethics empirically insulated?" remains fiercely disputed).  

  This tree isolates core commitments, avoids label-driven bias, and reflects the current state of the debate. For a seminar, pair it with key texts (e.g., Doris for local traits; Annas for cognitive-affective; Harman for capitulation) to ground each position.
