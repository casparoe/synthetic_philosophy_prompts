  3. Local Traits View (Doris): Character traits exist but are local (situation-specific) rather than global.
  4. Cognitive-Affective Framework Response: The experiments don't test for virtues because they target the wrong psychological constructs (e.g., they don't engage the cognitive-affective processes that constitute virtue).
  5. Normative Insulation: Virtue ethics doesn't make the kind of empirical claims that the situationists think it does (it's a normative theory, not a descriptive one).
  6. Capitulation: Virtue ethics as traditionally understood needs to be abandoned because of the evidence.

  We might also consider adding:
  7. Interactionist View: Both traits and situations matter, and the experiments don't rule out the existence of traits because behavior is always an interaction between the two. (This is a common psychological perspective that some philosophers might adopt.)
  8. Revisionist Virtue Ethics: Virtue ethics can be revised to account for the situationist evidence without abandoning the core project.

  However, we want to keep it to 7-10 leaves, so we can aim for 8.

  Now, we need to design a branching tree with concrete questions that lead to these positions. We also want to note at each branch whether the claim is settled or contested.

