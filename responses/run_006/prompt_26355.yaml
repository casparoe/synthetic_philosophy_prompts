  We are going to create a decision tree that helps students navigate the various responses to the situationist challenge in virtue ethics. The goal is to sort students by their views on the evidence and what virtue ethics requires, without relying on labels. We start with a root question and branch out based on key diagnostic questions.

  The main positions (leaves) we want to include are:
