answer: |-
  Here’s a set of desiderata for evaluating any account of the frame problem, distilled from its computational roots to its philosophical extensions. I’ve structured them hierarchically, marked non-negotiables (★), parochial demands (▷), and flagged tensions where they arise.  

  ---

  ### **Core Desiderata: Non-Negotiables (★)**  
  *These must be addressed by any serious account, regardless of theoretical orientation.*  

  1. **★ Representational Dynamics**  
     - **Requirement**: Explain how a system updates its model of a changing world *without* explicitly representing all non-changes (i.e., avoid frame axioms).  
     - **Case**: Actions have sparse effects (e.g., moving one cup leaves others untouched). Exhaustively specifying non-changes is computationally intractable.  
     - *Violation Example*: Early situation calculus requiring frame axioms for every unaffected object.  

  2. **★ Relevance Detection**  
     - **Requirement**: Explain how a system determines *what information is relevant* to an action or belief revision without infinite regress.  
     - **Case**: To make tea, you ignore the color of the kettle but attend to water level. No predefined "relevance axioms" can cover all contexts.  
     - *Violation Example*: Fodor’s worry: if relevance criteria themselves need relevance criteria, it leads to regress.  

  3. **★ Tractable Updating**  
     - **Requirement**: The update process must be computationally feasible in real-world scenarios (polynomial time or better).  
     - **Case**: Biological brains handle belief updates in ~100ms; AI planners fail with >100 objects.  
     - *Violation Example*: Default logic with exponential branching.  

  ---

  ### **Philosophical Extension Desiderata**  
  *Addressing the broader epistemological/representational puzzle.*  

  4. **Cognitive Scope**  
     - **Requirement**: Explain how the solution scales from perceptual-motor tasks (e.g., catching a ball) to abstract cognition (e.g., moral reasoning).  
     - **Case**: Relevance in physics (ignoring distant stars) differs from ethics (ignoring irrelevant precedents).  
     - **Non-negotiable (★)** for accounts claiming generality.  
     - **Parochial (▷)** if limited to sensorimotor domains (e.g., radical embodied cognition).  

  5. **Grounding of Relevance**  
     - **Requirement**: Clarify the *source* of relevance (e.g., evolutionary, pragmatic, dynamical).  
     - **Case**: Why is a tiger’s growl relevant but its stripes irrelevant when fleeing? Requires anchoring in goals, ecology, or physics.  
     - **Parochial Tensions**:  
       - *Formalists (▷)*: Relevance from logical priors (e.g., circumscription).  
       - *Embodiedists (▷)*: Relevance from sensorimotor coupling (no representation).  

  6. **Non-Monotonicity Handling**  
     - **Requirement**: Handle exceptions to default assumptions (e.g., "birds fly" vs. penguins).  
     - **Case**: Real-world inference is defeasible; new evidence overrides prior beliefs.  
     - **Non-negotiable (★)** for computational accounts.  
     - **Parochial (▷)** for anti-representationalists who reject formal inference.  

  ---

  ### **Tensions Between Desiderata**  
  *Potential incompatibilities explaining the field’s stagnation:*  

  - **Tension 1: Representation vs. Anti-Representation**  
    - Computational desiderata (1,2,3) assume *internal representations*.  
    - Embodied/embedded approaches (e.g., Dreyfus, Chemero) reject representations, claiming the problem "dissolves" for situated agents.  
    - **Conflict**: Satisfying (1,2,3) requires symbolic/dynamic-systems models, violating anti-representational commitments.  

  - **Tension 2: Formality vs. Contextuality**  
    - Logical approaches (e.g., relevance logics) seek *formal criteria* for relevance (★2).  
    - Philosophical critiques (e.g., Dennett) argue relevance is inherently contextual and unformalizable.  
    - **Conflict**: Formalizing relevance may be impossible if it’s irreducibly holistic.  

  - **Tension 3: Generality vs. Efficiency**  
    - A "general intelligence" solution (★4) risks computational intractability (★3).  
    - Biologically plausible solutions (e.g., predictive processing) are efficient but task-specific.  

  ---

  ### **Scorecard of Major Approaches**  
  | **Approach**               | **★1 Dynamics** | **★2 Relevance** | **★3 Tractability** | **★4 Scope** | **Grounding (6)** |  
  |----------------------------|-----------------|------------------|---------------------|--------------|-------------------|  
  | Situation Calculus (w/ frame axioms) | ❌ (Explicit) | ❌ (Predefined) | ❌ (Intractable) | ✅ | ▷ Formal |  
  | Circumscription (McCarthy) | ✅ (Minimal change) | ❌ (Domain-specific) | ⚠️ (NP-hard) | ✅ | ▷ Logical |  
  | Relevance Logics           | ⚠️ (Partial)   | ✅ (Syntax-based) | ⚠️ (Complex) | ⚠️ (Abstract) | ▷ Apriori |  
  | Predictive Processing (PP) | ✅ (Bayesian)  | ✅ (Precision-weighted) | ✅ (Neurally plausible) | ⚠️ (Perceptual) | ★ Ecological |  
  | Embodied/Embedded (e.g., Brooks) | ✅ (No representation) | ✅ (Direct coupling) | ✅ (Real-time) | ❌ (Low-level) | ★ Sensorimotor |  
  | Neuro-Symbolic Hybrids     | ✅ (Approximate) | ⚠️ (Learned)     | ⚠️ (Data-hungry) | ✅ | ★ Pragmatic |  

  ---

  ### **Key Insights**  
  1. **Non-Negotiables Are Shared**: All accounts must explain dynamics, relevance, and tractability (★1–3), but they diverge *radically* on how.  
  2. **The Central Tension**: Computational approaches need representations; embodied approaches reject them. **This is the core rift** – not all desiderata can be met within one paradigm.  
  3. **Dissolutions vs. Solutions**: Accounts that "dissolve" the problem (e.g., embodied cognition) fail ★4 (generality) but excel at ★3 (tractability).  
  4. **The Relevance Paradox**: ★2 (relevance detection) is the hardest. Formal criteria risk circularity; ecological grounding risks narrowness.  

  ### **What to Ask of Any Account**  
  - "How does your system avoid exhaustive non-change representations *without* presupposing relevance?"  
  - "Where does relevance come from, and is that source generalizable/scalable?"  
  - "Is your solution computationally plausible for real-time action in complex environments?"  
  - "Does your account *solve* the problem (with mechanisms), *dissolve* it (by changing assumptions), or *displace* it (to another domain)?"  

  The frame problem remains unresolved because its deepest challenge – **relevance grounding** – straddles the gap between syntax and semantics, between computation and biology. Clarifying these desiderata reveals why: satisfying all requires a theory that bridges representation, dynamics, *and* meaning, which may demand rethinking cognition itself.
