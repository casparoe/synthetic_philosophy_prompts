prompt: |-
  I have been collecting my own verdicts on a set of exchanges, and I want to know whether one principle lies behind them, or whether some of my verdicts have to go.

  Here are the cases as concretely as I can state them.

  1. A healthy adult sells one kidney to a stranger through a regulated exchange. The price is $45,000, paid into an account that can be drawn down over several years. There is a six-month cooling-off period, independent medical and psychological screening, and a guarantee of lifelong follow-up care for the seller. Verdict: permissible, though I am not entirely comfortable with it.

  2. In the two days before a hurricane is expected to make landfall, a hardware store raises the price of its portable generators from $500 to $2,000. Verdict: not permissible.

  3. A citizen accepts $50 from a campaign organization in exchange for a promise to vote for a particular candidate. Verdict: not permissible.

  4. A plasma collection center pays donors $40 per donation, and many working-class donors give plasma twice a week. Verdict: permissible.

  5. A woman carries a pregnancy to term for intended parents she did not know beforehand, in exchange for $30,000 above her medical and legal expenses, under a contract that gives her final authority over medical decisions during the pregnancy. Verdict: permissible, with some unease.

  6. A person pays a line-standing company to have someone wait in line overnight at a passport office and then hand over the place when they arrive. Verdict: permissible, though I dislike the inequality it creates.

  7. A patient near the front of a hospital emergency department queue accepts $500 from a wealthier patient to swap places, even though the wealthier patient's condition is less urgent. Verdict: not permissible.

  The tentative principle I keep reaching for is something like this: it is wrong to let willingness to pay determine who gets something that a person needs in order to survive, or that is supposed to be allocated by need or by equal civic standing rather than by price. That principle fits cases 2, 3, and 7, and it fits my unease about 6. But it seems to condemn case 1 as well, since a kidney is exactly the sort of good whose allocation I would not want left to price in an unregulated way, yet I still think the regulated sale is permissible. And it does not explain why 4 and 5 are permissible even though both involve payment for the use of the body by people who are mostly poorer than the buyers.

  Is there a principle, or a small set of candidates, that captures all or nearly all of these verdicts? If so, state it precisely and say what it predicts about a case I have not listed: a municipality that auctions off the right to skip the queue for a publicly funded childcare place. If no single principle captures them, which of my verdicts should I overturn, and which should I keep? I am less interested in labels like commodification or repugnant markets than in knowing exactly which feature of each exchange is doing the moral work.
reasoning: |-
  Okay, let me try to work through this user's moral reasoning problem. They've presented seven cases where they've made judgments about the permissibility of various exchanges, and they're struggling to find a consistent principle that explains all their verdicts. Their proposed principle about not letting willingness to pay determine allocation of survival goods or civic entitlements doesn't quite fit all cases, especially the kidney sale example.

  Hmm, I notice several patterns in their judgments. First, they seem comfortable with compensated bodily services when there's adequate regulation and consent (cases 1, 4, 5), but draw lines at emergency price gouging (2), vote-selling (3), and queue-jumping in essential services (7). Their discomfort about line-standing (6) seems tied to inequality rather than essential need.

  The kidney case is particularly interesting - they accept it despite it being a survival good, likely because of the robust safeguards. This suggests that for bodily services, consent and safety provisions might override concerns about commodification. Meanwhile, cases 2, 3 and 7 all involve undermining important allocation systems: disaster response, democratic process, and emergency triage. 

  For plasma donation (4) and surrogacy (5), the absence of extreme need or systemic harm might explain their permissibility verdicts. Plasma is renewable and donations are frequent but not immediately life-threatening, while surrogacy involves a compensated service rather than selling an organ. 

  The childcare queue auction hypothetical tests whether their concern is about essential needs or fair allocation systems. I think they'd oppose it because it corrupts a public service meant to be allocated by need, similar to the ER queue-jumping. 

  Their unease about line-standing (6) but ultimate acceptance suggests they tolerate market exchanges when they don't directly threaten survival or civic equality. The core principle might be: markets are problematic when they subvert essential allocation systems or exploit acute vulnerabilities, but permissible with safeguards when they don't. 

  I should check if this covers all cases consistently. The vote-selling (3) fits as corrupting democracy, hurricane pricing (2) exploits disaster vulnerability, ER swap (7) undermines medical triage. Kidney sale (1) gets a pass due to regulation making it non-exploitative. Plasma (4) and surrogacy (5) lack the acute vulnerability factor. Line-standing (6) is borderline but not essential enough to prohibit.

  The childcare auction would clearly violate the principle since it turns a public need-based service into a privilege for the wealthy. If they wanted to be consistent, they might need to either prohibit the kidney sale or accept some regulated markets in survival goods - but their intuition suggests the safeguards matter more than the good's nature per se.
answer: |-
  Based on your verdicts, the core tension lies in balancing concerns about **essential needs, civic equality, and exploitation** against **autonomy and the potential benefits of regulated markets**. Your proposed principle focuses on the *allocation mechanism* for essential/civic goods, but your verdicts reveal that **the presence of robust safeguards against vulnerability/exploitation and the nature of the good itself** are equally crucial.

  Here's a principle (or small set) that captures your judgments:

  **Principle:** *A paid exchange is impermissible if it:*
  1.  **Undermines an Essential Allocation System:** *Allocates a good/service essential for survival or fundamental civic equality (health, safety, democratic process, urgent need) based *solely* or *primarily* on willingness/ability to pay, bypassing or corrupting a system designed to allocate it by need, urgency, or equal civic standing; **OR***
  2.  **Exploits Acute Vulnerability:** *Occurs under conditions of significantly diminished agency (coercion, desperation, lack of reasonable alternatives, impaired judgment) due to immediate crisis or systemic disadvantage, enabling harmful exploitation.*

  **Applying the Principle to Your Cases:**

  1.  **Kidney Sale (Permissible):** *Doesn't clearly violate.* While a kidney is essential, the *robust safeguards* (cooling-off, screening, care, regulated exchange) *mitigate* the potential for exploitation and ensure significant agency. The allocation system *itself* isn't being corrupted (it's a dedicated market system with controls), unlike jumping an ER queue. Your unease stems from the *nature* of the good, but the safeguards push it into permissible territory for you.
  2.  **Hurricane Generators (Not Permissible):** *Violates #2 (Exploits Acute Vulnerability).* The price hike exploits the *immediate, crisis-induced vulnerability* of people facing a life-threatening disaster, where alternatives vanish and agency is diminished by panic/necessity.
  3.  **Vote Selling (Not Permissible):** *Violates #1 (Undermines Essential Allocation System).* Voting is the *core mechanism* of civic equality. Allocating votes based on payment directly corrupts the fundamental system designed for equal civic standing ("one person, one vote").
  4.  **Plasma Donation (Permissible):** *Doesn't clearly violate.* Plasma is renewable and donation, while compensated, isn't typically "essential for survival" *in the same immediate, non-fungible way* as an organ or disaster supplies. While class dynamics exist, the *system* (regulated collection centers) isn't bypassing/corrupting a *need-based* allocation system for an essential good like blood transfusions (which are free at point of use). Compensation addresses donation *supply*, not allocation *to recipients* based on wealth. Exploitation risk is lower than in crisis sales.
  5.  **Surrogacy (Permissible):** *Doesn't clearly violate (with safeguards).* While involving the body and potential vulnerability, the *contract* (medical authority) and *regulated process* aim to protect agency. It doesn't bypass a "need-based" allocation system for babies (adoption exists, but surrogacy is a distinct path). The good/service (gestational labor) isn't "essential for survival" *in the allocative sense* like an ER spot. Your unease reflects the significant bodily commitment and power dynamics, but the safeguards make it permissible for you.
  6.  **Line-Standing Service (Permissible - disliked):** *Doesn't clearly violate #1 or #2.* While creating inequality, it doesn't typically involve a good *essential for survival or civic equality*. Passport appointments are important, but not urgent/essential like ER care or disaster supplies. The *underlying allocation system* (first-come-first-served) is *still* the rule; the service simply hires someone to endure the wait *within the rules*. It doesn't *corrupt* the system's logic like paying to jump an ER queue does. Your dislike stems from the *inequality of access* it facilitates for non-essential (though important) services, which falls outside the stricter prohibitions of the principle.
  7.  **ER Queue Swap (Not Permissible):** *Violates #1 (Undermines Essential Allocation System).* Emergency care is essential for survival. The ER queue *is* the system designed to allocate care based on *medical urgency/need*. Paying to bypass this directly corrupts that need-based allocation, prioritizing wealth over medical necessity in a life-or-death context.

  **Predicting the Childcare Case:**

  *   **Case:** A municipality auctions off the right to skip the queue for a publicly funded childcare place.
  *   **Prediction using Principle:** **Not Permissible.** This clearly **violates #1 (Undermines Essential Allocation System)**.
      *   **Essential/Civic Good:** Publicly funded childcare is often essential for parental employment and child development/equality, provided as a public good based on need/subsidy.
      *   **Corrupted Allocation System:** The queue (or waitlist) is the system designed to allocate spots based on criteria like registration date, need, or residency. Auctioning skip-the-queue privileges prioritizes ability/willingness to pay over the intended allocation criteria, corrupting the purpose of the public funding and system. It turns a public good into a privilege for the wealthy.

  **Addressing Tensions & Refinements:**

  *   **Your Kidney Unease:** The principle explains *why* you permit it (safeguards mitigate exploitation, dedicated system) but also *why* you're uneasy (it involves an essential good allocated via payment). If your unease grows stronger than your judgment of permissibility, you might need to refine the principle to be stricter on *any* sale of *non-renewable* essential body parts, regardless of safeguards. However, your verdict suggests the safeguards *are* decisive for you.
  *   **Plasma vs. Kidney:** The principle distinguishes them because plasma is renewable and the payment primarily incentivizes *supply* within a system that *allocates* the resulting treatment (blood products) based on medical need, not wealth. Kidney sale involves allocating *the essential good itself* based on payment (even if regulated).
  *   **Surrogacy:** This is the most complex. The principle relies on the distinction between the *service* (gestation) and the *resulting child*. The allocation system for *children* via surrogacy isn't primarily a public "need-based" system like ER care or public childcare. The safeguards aim to protect the surrogate's agency during the service. If you felt the surrogate's vulnerability was inherently exploitative even with safeguards, you might prohibit it, but your verdict suggests otherwise.

  **Conclusion:**

  This two-part principle – prohibiting exchanges that corrupt essential allocation systems or exploit acute vulnerability – captures all your verdicts. It explains:

  *   Why **hurricane pricing (exploitation)**, **vote selling (civic corruption)**, and **ER swaps (medical allocation corruption)** are prohibited.
  *   Why **regulated kidney sales (mitigated vulnerability, dedicated system)**, **plasma donation (supply incentive, non-essential allocation)**, **regulated surrogacy (safeguarded agency, distinct allocation)**, and **line-standing (non-essential system, rule-based)** are permissible (even if disliked).
  *   Why the **childcare auction** would be prohibited (corrupting public allocation based on need).

  If you feel this principle doesn't *fully* capture your unease about kidneys or surrogacy, it might indicate those verdicts are less stable. To be perfectly consistent with your prohibition on ER swaps and childcare auctions, you *might* need to prohibit the kidney sale as it also involves payment for an essential bodily resource. However, your verdict strongly suggests that the **robust safeguards** are the decisive factor *permitting* the kidney sale, distinguishing it from the more exploitative or corrupting cases. This principle respects that distinction.
