           *Awkward commitment: If an AI system generates a perfectly interpretable step-by-step proof for a mathematical theorem, the user automatically understands it—regardless of their background knowledge.*  
       - **No** →  
         - **Leaf (Collapsed): Virtue-Epistemological and Epistemic-Agency Views**  
           *Why collapsed?: Both positions agree AI dependence inherently erodes capacities (character/virtues or autonomous agency) and cannot be fully fixed by design. They are separated below.*  
           - **Sub-question: Is the core erosion about character development or self-governance?**  
             - **Character (Virtues)** →  
               - **Leaf: Virtue-Epistemological View**  
                 *Awkward commitment: Asking an AI to summarize a philosophical text is intellectually vicious—even if done to free up time for deeper analysis—because it bypasses "due diligence."*  
             - **Self-Governance (Agency)** →  
               - **Leaf: Epistemic-Agency View**  
                 *Awkward commitment: Delegating any inference to AI (e.g., predicting climate impacts) undermines "true" knowledge, even if the human carefully evaluates the output.*  
     - **Community Branch**:  
       - **Yes** →  
         - **Leaf: Unnamed (Techno-Optimist Collectivism)**  
           *Diagnosis: Coherent but unexplored; assumes design can prevent communal brittleness (e.g., via decentralized AI). Unattractive to critics who deem systemic risks inevitable.*  
       - **No** →  
         - **Leaf: Collective-Epistemic-Health View**  
           *Awkward commitment: A society where every citizen can explain an AI’s medical advice still risks collapse if the AI fails, as no human retains holistic expertise.*  

  ---

  **Diagnostic Notes**  
  - **Collapsed Positions**: Virtue-epistemological and epistemic-agency views share commitments to non-design-fixable, individual-level erosion. They split only on whether the *primary loss* is virtues (habits of careful inquiry) or agency (autonomous judgment).  
  - **Unnamed Positions**:  
    - *General Cognitive Outsourcing Skepticism* (Q1=Yes, Q2=No, Q4=No): Asserts *all* tools (not just AI) erode understanding. **Diagnosis**: Unattractive—it implausibly condemns calculators, writing, etc.  
    - *Techno-Optimist Collectivism* (Community branch, Q4=Yes): Believes design fixes communal risks. **Diagnosis**: Unexplored; underestimates emergent systemic fragility.  
  - **Key Separations**:  
    - The *continuity view* is isolated by denying AI’s uniqueness (Q2=No).  
    - *Black-box opacity* is separated by design solvability (Q4=Yes) and individual focus (Q3=Individual).  
    - *Collective-epistemic-health* requires community focus (Q3=Community) and structural unsolvability (Q4=No).
