answer: |-
  I'm impressed by your critical approach—this is exactly how philosophy should be read, especially when transitioning from science. Your intuition is spot-on: the book's summary captures a *kernel* of deflationism but oversimplifies and misstates key nuances, particularly regarding the utility of "is true." Let's break it down sentence by sentence, referencing key deflationists (like Frege, Ramsey, Quine, Horwich) to separate accurate claims from overstatements.

  ### The Book's Summary & Deflationist Response:
  1.  **"Deflationists deny that truth is a real property."**
      *   **Careful Deflationist View (Mostly Accepts, but Needs Nuance):** Deflationists *do* deny that truth is a **substantive** or **metaphysically robust** property. They reject the idea that truth consists in correspondence with mind-independent facts, coherence within a belief system, utility, or any other complex underlying nature that philosophers have proposed.
      *   **Overstatement/Conflation:** Calling it "not a real property" is ambiguous and potentially misleading. Deflationists like Paul Horwich (minimalism) acknowledge truth *is* a property in the minimal sense that it's a predicate we apply to propositions/statements/sentences. Their point is that *being true* adds **nothing substantial** to the thing itself. Knowing a proposition is true tells you *nothing more* about the world than knowing the proposition itself. Truth isn't a "chemical property" like flammability with causal powers; it's a logical/linguistic device. A better phrasing is "truth is not a *substantive* or *explanatorily powerful* property."

  2.  **"On their account, to say that 'snow is white' is true is just to say that snow is white..."**
      *   **Careful Deflationist View (Strongly Accepts - Core Principle):** This is the heart of the "disquotational" or "transparency" view central to most deflationism (especially Quine, Horwich). The equivalence `"Snow is white" is true` iff `Snow is white` is fundamental. Adding "is true" and the quotation marks cancels out, leaving the original content. This equivalence schema (generalized as `"P" is true iff P`) is often seen as exhausting the concept of truth for simple assertions.

  3.  **"...and since 'is true' never adds anything..."**
      *   **Careful Deflationist View (Overstatement - Major Problem):** This is where the book goes seriously wrong and contradicts the point you wisely noted about generalizations. Deflationists emphatically agree that "is true" **does add crucial logical/syntactic power** in specific contexts:
      *   **Generalization (The Key Utility):** As you observed, we cannot express "Everything the witness said is true" without the truth predicate. We don't know all the specific statements (P1, P2, P3... Pn) the witness made, nor can we list them infinitely. Saying "P1 and P2 and P3 and ... Pn" is impossible. "Is true" allows us to quantify over propositions/sentences: `∀x (If x is a statement made by the witness, then x is true)`. This is *essential* logical work. Quine called truth a "device of disquotation" precisely for this reason – it lets us "remove quotes" en masse.
      *   **Endorsement/Acknowledgement without Repeating:** "What he said is true" allows you to endorse a claim without restating it, which is pragmatically useful (e.g., in agreement, avoiding repetition, or referring to complex statements).
      *   **"Never adds anything" is false.** It doesn't add *descriptive content* about the world *beyond the proposition it's applied to*, but it adds indispensable *logical and expressive power*.

  4.  **"...the concept of truth is basically idle — a bit of language we could drop without losing anything."**
      *   **Careful Deflationist View (False Conclusion - Directly Contradicted by Point 3):** This final claim **does not follow** from the accurate parts and is explicitly rejected by serious deflationists. Precisely because "is true" is indispensable for generalizations (and other logical operations like forming an infinite conjunction "All theorems of arithmetic are true"), it **cannot** be dropped without significant loss. We *need* the truth predicate for these expressive tasks. Deflationists argue its *only* function is this logical/expressive one, *not* naming a substantive property, but that function is **crucial**. Calling it "idle" grossly misrepresents the deflationist position. Deflationism is **not** eliminativism about truth.

  ## Why the Book's Summary is Misleading & Your Intuition is Correct

  1.  **Conflates Lack of Substantive Nature with Idleness:** The book mistakenly infers that because truth isn't a substantive property (Points 1 & 2), it must be idle or eliminable (Point 4). Deflationists sharply distinguish these. The *point* of deflationism is to show that truth has an important, but purely logical, function – enabling generalizations and related syntactic operations – without requiring a deep metaphysics.
  2.  **Ignores the Key Motivation for Deflationism:** Deflationists often argue *against* substantive theories *because* they see the logical function of the truth predicate as sufficient to explain all legitimate uses of "true." The generalization problem is a *primary reason* deflationists accept truth as a predicate at all! To then call it idle undermines their own argument.
  3.  **Overgeneralizes from Simple Cases:** The equivalence schema (`"P" is true iff P`) brilliantly explains simple assertions (Point 2). The mistake is assuming this exhausts the story and that the predicate has no other role. Deflationists use the equivalence schema *plus* the generalization function to give a complete (according to them) account.

  ## What a Careful Deflationist Would Say About Truth's Work

  *   "Truth is not a substantive property like mass or charge, discoverable through scientific investigation or requiring a deep metaphysical theory (correspondence, coherence, etc.)."
  *   "The fundamental fact about truth is captured by the equivalence schema: Attributing truth to 'P' is equivalent to asserting P itself."
  *   "However, the truth predicate is **not superfluous**. Its essential and indispensable function is as a **logical device**, enabling us to express generalizations ('Everything he said is true'), infinite conjunctions ('All axioms are true'), and other complex claims where we cannot explicitly list or state the propositions involved."
  *   "This expressive/logical function is the *only* work the concept of truth does. We do not need, and there is no evidence for, any further substantive property of 'truthfulness' in the world. The equivalence schema and the generalization function together fully explain our use of 'true'."

  ## In Conclusion

  Your skepticism about the "idle" claim is completely justified. The book correctly identifies the core deflationist rejection of truth as a substantive property and the equivalence schema for simple cases. However, it grossly overstates this by claiming "is true" *never* adds anything and commits the critical error of concluding truth is idle/eliminable. This directly contradicts the deflationist's own primary explanation for why we *need* the truth predicate: its irreplaceable role in forming generalizations. You have not internalized a caricature; you've identified a significant flaw in the popular summary. Deflationism argues truth has an essential, *but purely logical*, job description, not that it's unemployed. Keep trusting that chemist's eye for detail!
