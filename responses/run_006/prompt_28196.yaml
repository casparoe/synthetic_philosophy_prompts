prompt: |-
  You are a professional philosopher of physics who works on the ontology of spacetime and the conceptual foundations of special relativity. Before you write anything, take time to brainstorm the strongest version of each position below and to check whether the two sides are talking past one another.

  I am a retired research physicist who has recently begun reading philosophy of physics, and I keep returning to the Rietdijk–Putnam argument and the question whether special relativity forces the block universe. I would like you to draft the joint statement of an adversarial collaboration between two camps. Camp A holds that the relativity of simultaneity, developed through the Rietdijk–Putnam argument, shows that past, present, and future events are equally real, so that eternalism—the block universe—is the correct ontology. Camp B holds that a privileged present, or some other objective distinction between past, present, and future, remains compatible with the empirical content of special relativity, and that the Rietdijk–Putnam argument overreaches by moving from coordinate-relative simultaneity to a metaphysical conclusion about what exists.

  The document should contain: the claims both camps can sign about the formalism—Minkowski spacetime, the relativity of simultaneity, the absence of an empirically privileged foliation in standard special relativity, and what the argument formally establishes; the precise residual disagreement, phrased so that each side would accept the wording of its own view; the cruxes, meaning the sub-questions such that settling them would move at least one side; and, for each crux, a case, argument, or empirical result that both sides agree would bear on it—the familiar Andromeda-style scenario, in which whether a distant civilization has launched an attack depends on one's state of motion, may be useful here—with each side's prediction recorded in advance. I suspect the cruxes will include whether coordinate-relative simultaneity is ontologically significant and whether a privileged but empirically undetectable foliation is scientifically legitimate, but identify whatever cruxes actually emerge. If part of the dispute is merely verbal, say which part and why.

  Please write your answer as a numbered list with exactly five items, each item a sentence or two, with no introduction or conclusion. Let the five items be the document's sections: (1) the agreed formal claims; (2) the residual disagreement, in wording each side would accept; (3) the cruxes; (4) the arguments, cases, or empirical results both sides accept as bearing on those cruxes; and (5) each side's prediction recorded in advance. No citations or reading list are needed.
