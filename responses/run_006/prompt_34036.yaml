answer: |-
  This asymmetry reflects a deeply embedded **"firewall theory"** of research ethics, which treats ethical approval as a *procedural authorization* rather than a *substantive contribution to scientific knowledge*. I'll reconstruct this implicit theory, defend this reconstruction, argue that the practice is philosophically *indefensible*, and show why shifting to a model treating ethical reasoning as public would improve scientific accountability.

  ### The Implicit "Firewall Theory": Reconstruction and Defense
  1. **Core Presupposition: Ethical Approval is Administrative, Not Epistemic**  
     The practice strictly presupposes that ethical review is a **precondition** for legitimate science, not **part of** the scientific process itself. IRB approval functions like a building permit: necessary for construction, but irrelevant to the architectural design. The "division of epistemic labor" here is clear:  
     - **Scientists** produce knowledge (data, papers, code).  
     - **IRBs** assess regulatory/legal compliance and minimize harm.  
     Ethical deliberation is seen as a risk-mitigation exercise for participant protection, divorced from the intellectual content of the research.  

  2. **Accountability to Different "Publics"**  
     The practice assumes two distinct spheres of accountability:  
     - **Scientific public** (peers, journals, funders) merits transparency about *methods and findings* (data/code/papers).  
     - **Regulatory public** (IRBs, auditors, oversight bodies) merits confidentiality to protect deliberative integrity, participant privacy, and institutional liability.  
     Crucially, it assumes that ethical reasoning requires **protecting deliberative candor** (e.g., frank discussions of worst-case scenarios) and **avoiding misinterpretation** by non-experts.  

  3. **Rejection of Ethical Expertise as Scientific**  
     It presupposes that ethical judgment:  
     - Is **not improvable through post-hoc scrutiny** (unlike data analysis).  
     - Is **context-specific and non-generalizable** (valid only for the approved study).  
     - **Lacks scientific content**—ethics is "applied," while science is "discovery."  

  **Why this reconstruction is defensible**:  
  - **Practical consistency**: IRB deliberations are treated as confidential across jurisdictions (e.g., US Common Rule, EU GDPR), mirroring legal/administrative proceedings.  
  - **Institutional incentives**: Universities shield ethics discussions to limit liability; journals avoid adjudicating ethics to maintain focus on "science."  
  - **Rhetorical divide**: Scientists describe IRB approval as a "hurdle," not an intellectual contribution.  

  ### Philosophical Indefensibility of the Practice
  The firewall theory collapses under scrutiny. Its foundational premises are flawed:  

  1. **Ethical Reasoning *Is* Epistemic Expertise**  
     Risk-benefit analyses involve empirical predictions (e.g., "Will this intervention cause distress?"), conceptual trade-offs (e.g., autonomy vs. beneficence), and methodological judgments (e.g., adequacy of consent processes). These are **inference-laden claims** open to error and bias—precisely the scrutiny applied to scientific work. Treating ethics as "non-scientific" is a category error.  

  2. **Opacity Breeds Inconsistency and Trust Deficits**  
     Without transparency:  
     - **Inconsistent standards** persist (e.g., IRB approvals of placebo trials in vulnerable populations despite known risks).  
     - **Public trust erodes** when ethical scandals emerge (e.g., Facebook’s "emotional contagion" study), and oversight appears captured or arbitrary.  
     - **Accountability is impossible**: How can we assess whether IRBs upheld their mandate without seeing their reasoning?  

  3. **The "Deliberative Candor" Argument Fails**  
     Redaction can protect sensitive details (e.g., participant identifiers) while revealing ethical frameworks. Legal systems publish court opinions without compromising judicial deliberation—IRBs could do the same.  

  ### Would the Practice Survive Under a Transparency Model?
  **No.** Replacing the firewall theory with a **"public ethics" model** would transform practice:  
  - **Journals/funders would mandate ethics documentation** alongside data/code.  
  - **IRBs would publish reasoned approvals** (redacted for privacy), inviting scholarly critique.  
  - **Ethical reasoning would become part of replication**, e.g., "Was the original risk assessment justified given outcomes?"  

  **Objection**: *This would overwhelm IRBs and chill deliberation.*  
  **Reply**: Precedents like clinical trial registries show bureaucracy adapts to transparency. Anonymized deliberation records (e.g., omitting IRB member names) preserve candor.  

  **Objection**: *The public lacks expertise to evaluate ethics.*  
  **Reply**: Peer scientists, ethicists, and participant advocates form the relevant "public"—just as with peer review of data.  

  ---

  ### Conclusion: Toward a Defensible Practice
  The current asymmetry is **philosophically indefensible**. It rests on an artificial firewall between "science" and "ethics" that ignores the epistemic value of ethical reasoning. A transparency model would:  
  - **Enhance accountability** by exposing inconsistent or negligent approvals.  
  - **Improve ethical expertise** through critique and cumulative learning.  
  - **Align with open science principles** treating *all* research justifications as collective goods.  

  We should reject the firewall theory and demand public ethical reasoning as rigorously as we demand open data. The door must open.
