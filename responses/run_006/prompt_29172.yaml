prompt: |-
  I recently became the person who signs off on how choices are presented to roughly 4,000 employees at a mid-sized financial-services firm — benefits enrollment, retirement-plan defaults, and a few internal wellness and sustainability programs. A few times a month I receive a proposal that changes some default, reorders some menu, or adds some message to a portal, and each one has to be defended to Legal, HR, and the executive team. The people proposing these changes call them nudges and treat them as obviously harmless; I am not sure they always are, and I have no formal training in the philosophy behind any of this.

  I would like a reusable decision procedure, grounded in the philosophical discussion of paternalism and nudging, that I can run on a proposal before I sign off. I know that discussion makes distinctions — hard versus soft paternalism, interference with a person's means versus their ends, welfare versus autonomy, transparent versus hidden influence, manipulation versus rational persuasion, and the special power of defaults and the status quo bias — but I do not know how those distinctions should be ordered into a screen, which ones are decisive, and which are just considerations to weigh.

  Please write the procedure as an ordered set of questions a non-philosopher can ask about any proposed change to how a choice is presented. For each question, say what counts as a sufficient answer and where the procedure stops with a no. Mark the steps that the procedure cannot settle on its own and must hand to a person, and be explicit about what kind of judgment is actually being made at those steps. The procedure needs to be usable in a one-hour review meeting by me and two non-specialist staff.

  Then run the procedure on three proposals currently on my desk:

  (1) automatically enrolling new hires in the 401(k) at a 6 percent deferral rate with automatic annual escalation to 10 percent, with an opt-out form;

  (2) reordering the cafeteria and vending layout so that lower-sugar and lower-sodium items sit at eye level and in the most convenient line, while the less healthy items remain available but in a less convenient location;

  (3) adding a peer-comparison message to the benefits portal telling employees how their retirement contribution rate compares with the average for their job band, with a smiley-face icon for those above the average.

  At least one of these should come out differently than my initial instinct, and I want to see where and why the procedure forces that. Finally, tell me what the procedure cannot do: which proposals it will classify too quickly, and which parts of the underlying question are not procedural at all. Please write the answer in American English.
reasoning: |-
  Okay, the user is in charge of approving choice architecture changes for 4,000 employees at a financial services firm. They need a practical decision procedure rooted in behavioral ethics to evaluate "nudges" proposed by colleagues. 

  Hmm, their pain points are clear: proposers treat nudges as harmless while they're unsure about ethical implications, they lack philosophical training, and need something usable in one-hour meetings with non-specialists. The three examples they provided are classic nudges - retirement defaults, cafeteria rearrangements, and social comparison messaging.

  First I should map the key philosophical distinctions they mentioned into actionable questions. Cass Sunstein's work on transparent nudges and Thaler's libertarian paternalism framework will be foundational here. The procedure must prioritize autonomy while allowing beneficial interventions. 

  Important to structure this as a funnel: start with hard stops (like legality), then move to softer ethical screens. Need clear "no" gates where proposals get rejected outright, and "judgment call" flags where committee input is needed. For the judgment steps, I'll specify exactly what human evaluation is required - like assessing proportionality or employee perspective.

  For the examples: 
  The 401(k) auto-enrollment should pass easily - it's transparent, preserves choice, and addresses proven inertia. The cafeteria redesign is trickier; it's less transparent but probably acceptable since all options remain available. The peer comparison raises red flags - it could shame employees and manipulate through social pressure. 

  The procedure's limits matter too. It won't handle conflicts between welfare/autonomy well, and complex tradeoffs will always require human judgment. Also, it can't assess implementation quality - a good nudge done poorly fails. 

  Better include a "what this can't do" section explicitly. The user needs to know when to escalate beyond the checklist. And for the peer comparison example, I'll show how it fails the autonomy test despite seeming innocuous - that's where their instinct might differ from the procedure's output.
answer: |-
  Here's a reusable decision procedure grounded in the ethics of paternalism and nudging, designed for practical use in a 1-hour business meeting. It prioritizes key philosophical distinctions and flags where human judgment is essential.

  **The Nudge Evaluation Procedure: 9 Ordered Questions**

  1.  **Is this change legally permissible and compliant with all relevant regulations (ERISA, ADA, EEOC, etc.)?**
      *   *Sufficient Answer:* Confirmed by Legal Department review. Documentation provided.
      *   *Stop if No:* Yes. Do not proceed. Reject the proposal.
      *   *Judgment Call?* No. Requires factual legal determination.

  2.  **Does this change restrict or remove any existing choice or option available to employees?**
      *   *Sufficient Answer:* No. All previous options remain available, even if less convenient or prominent.
      *   *Stop if No?* **Yes.** Proposals restricting choice require *much* stronger justification and trigger heightened scrutiny. Proceed cautiously.
      *   *Judgment Call?* Mostly factual. Clarify if "restriction" includes significant effort/cost increases.

  3.  **Is the influence mechanism transparent? Can employees easily discover *how* the choice architecture is designed to influence them?**
      *   *Sufficient Answer:* Yes. The nudge mechanism is obvious upon reasonable inspection (e.g., default enrollment clearly stated as the default), or explicitly explained (e.g., "Healthier options are placed at eye level for convenience").
      *   *Sufficient Answer if No?* **Rarely.** Lack of transparency is a major autonomy concern. Only potentially justified for *extremely* high-impact welfare benefits where transparency demonstrably undermines the goal *and* alternatives are worse. Requires strong justification at Step 8.
      *   *Judgment Call?* **Yes.** Assess "reasonable discoverability" from a typical employee's perspective. Is the influence hidden or obvious?

  4.  **Is the nudge primarily aimed at correcting a clear cognitive bias or decision-making failure (e.g., inertia, status quo bias, present bias, complexity overwhelm)?**
      *   *Sufficient Answer:* Yes. Evidence (internal data, credible research) supports the presence of the bias and that this nudge effectively counters it.
      *   *Sufficient Answer if No?* Depends. Proceeding requires strong justification that the nudge aligns with widely shared employee goals *without* exploiting a bias. Highly subjective nudges (like peer comparison) need extra scrutiny here.
      *   *Judgment Call?* **Yes.** Requires evaluating the strength and relevance of the evidence for the bias and the nudge's mechanism.

  5.  **Does the nudge align with the welfare goals that a significant majority of employees would likely endorse for themselves, given their situation? (Does it help them achieve *their own* likely goals?)**
      *   *Sufficient Answer:* Yes. Evidence (surveys, focus groups, common sense goals like financial security, health) strongly suggests employees broadly share this goal.
      *   *Sufficient Answer if No?* **No.** If the nudge pushes employees towards goals *the employer* values but employees demonstrably do not (e.g., pushing low-cost plans if employees value richer benefits), it's highly paternalistic and manipulative. Reject.
      *   *Judgment Call?* **Yes.** Requires inferring employee goals based on available data and reasonable assumptions. Avoid projecting employer preferences.

  6.  **Does the nudge preserve ease of choice? Can employees easily act on their actual preference, even if it differs from the nudge?**
      *   *Sufficient Answer:* Yes. Opting out/changing/choosing the non-nudged option is straightforward, requires minimal effort/time, and is clearly communicated.
      *   *Stop if No?* **Yes.** If opting out is burdensome (complex forms, delays, social pressure, hidden), it crosses into coercion/manipulation. Reject.
      *   *Judgment Call?* **Yes.** Assess "minimal effort" from a typical employee's perspective. Is the barrier trivial or significant?

  7.  **Does the nudge avoid using manipulative techniques that bypass reason or exploit vulnerabilities (e.g., excessive emotional triggers, deception, exploiting shame or anxiety, irrelevant distractions)?**
      *   *Sufficient Answer:* Yes. The nudge relies on simplification, framing, or convenience without undue emotional pressure or deception.
      *   *Stop if No?* **Yes.** Reject proposals using shame, fear-mongering, deception, or exploiting specific vulnerabilities (e.g., addiction, financial desperation).
      *   *Judgment Call?* **Yes.** Requires evaluating whether the technique feels exploitative or respectful. Does it feel like a "push" or a "shove"? Does it trigger negative emotions unnecessarily?

  8.  **Is the expected benefit to employee welfare significant and well-supported, justifying any remaining concerns about autonomy or paternalism identified in steps 3-7?**
      *   *Sufficient Answer:* Yes. Strong evidence (credible research, pilot data) shows substantial, tangible benefits (e.g., significant retirement savings increase, measurable health improvement). The benefit clearly outweighs the mild autonomy concerns.
      *   *Sufficient Answer if No?* **No.** If benefits are speculative, minor, or poorly supported, the intrusion on autonomy isn't justified. Reject.
      *   *Judgment Call?* **Yes.** Requires weighing the *magnitude* of expected welfare gains against the *severity* of the autonomy intrusion (transparency, alignment, ease of choice). Consider proportionality.

  9.  **Has the proposal been reviewed by relevant stakeholders (HR for employee impact/equity, Legal for compliance, Communications for clarity, potentially ERISA counsel for retirement plans)?**
      *   *Sufficient Answer:* Yes. Feedback incorporated or adequately addressed.
      *   *Stop if No?* **Yes.** Do not approve without necessary stakeholder input.
      *   *Judgment Call?* No. Factual confirmation.

  **Procedure Output:**
  *   Passes Steps 1-9: **Approve.**
  *   Fails Step 1, 2 (without exceptional justification), 5, 6, 7, or 8: **Reject.**
  *   Requires significant judgment at Step 3, 4, 5, 6, 7, or 8: **Revise & Resubmit** or **Discuss for Conditional Approval** based on committee deliberation.

  ---

  **Evaluation of Your Proposals:**

  **(1) Auto-enrollment in 401(k) at 6%, escalation to 10%, with opt-out.**
  1.  **Legal:** *Likely Yes (assuming ERISA compliance, QDIA status, proper notices).* **Pass.**
  2.  **Restrict Choice?** *No.* Choice preserved via opt-out. **Pass.**
  3.  **Transparent?** *Yes.* Default enrollment and opt-out process must be clearly communicated. **Pass.**
  4.  **Corrects Bias?** *Yes.* Targets inertia and status quo bias powerfully. Strong evidence base. **Pass.**
  5.  **Aligns with Goals?** *Yes.* Most employees value retirement savings; default helps overcome procrastination to achieve *their* goal. **Pass.**
  6.  **Ease of Choice?** *Yes.* Opt-out should be simple (e.g., online form). **Pass.**
  7.  **Avoids Manipulation?** *Yes.* Relies on inertia, not deception or shame. **Pass.**
  8.  **Welfare Benefit?** *Yes.* Significant, well-documented boost to retirement savings. Justifies mild paternalism. **Pass.**
  9.  **Stakeholder Review:** *Required.* **Confirm.**
      *   **Procedure Output:** **Approve (pending Step 9).** *Matches instinct? Likely Yes.*

  **(2) Reordering Cafeteria/Vending for Healthier Convenience.**
  1.  **Legal:** *Likely Yes.* **Pass.**
  2.  **Restrict Choice?** *No.* All items remain available. **Pass.**
  3.  **Transparent?** *Unclear/Probably No.* Is the reason for placement obvious? ("Convenience" isn't the same as "to nudge you healthy"). Likely **Fail** or **Requires Judgment.** (Is it *reasonably discoverable* that placement is intentional influence? Probably not).
  4.  **Corrects Bias?** *Yes.* Exploits convenience/effort bias and attention. Evidence supports impact. **Pass.**
  5.  **Aligns with Goals?** *Likely Yes.* Many employees express desire to eat healthier; convenience barrier hinders this goal. **Pass** (but weaker than 401k).
  6.  **Ease of Choice?** *Yes.* Less convenient ≠ hard. Walking further is trivial barrier. **Pass.**
  7.  **Avoids Manipulation?** *Yes.* Uses convenience, not emotion/deception. **Pass.**
  8.  **Welfare Benefit?** *Requires Judgment.* Potential health benefits are real but less immediate/directly measurable than retirement savings. Is this significant enough to justify the *lack of transparency* (Step 3)? **Marginal Pass/Fail depends on Committee.** (Argument *for*: Low autonomy cost, high potential benefit. *Against*: Hidden influence for a less critical goal).
  9.  **Stakeholder Review:** *Required.* **Confirm.**
      *   **Procedure Output:** **Judgment Call at Steps 3 & 8.** Requires committee discussion: Is the lack of transparency acceptable given the low barrier and potential benefit? Should a small sign explain the placement? *Matches instinct?* If instinct was wary of hidden influence, procedure flags it (Step 3). If instinct was "it's harmless", procedure forces justification (Step 8).

  **(3) Peer-Comparison Message with Smiley Face.**
  1.  **Legal:** *Likely Yes (if data anonymized/aggregated).* **Pass.**
  2.  **Restrict Choice?** *No.* Information only. **Pass.**
  3.  **Transparent?** *Yes.* The comparison is explicit. **Pass.**
  4.  **Corrects Bias?** *Partially.* Targets pluralistic ignorance ("what's normal?"), but heavily relies on social conformity pressure, not just correcting information gaps. **Marginal Pass/Requires Judgment.**
  5.  **Aligns with Goals?** *Unclear/Requires Judgment.* Do employees *want* to be compared to peers? Does this align with *their* saving goals, or impose a social goal? Risk of misalignment (e.g., high earner saving adequately but below peers). **Fail or Requires Judgment.** (Likely **Fail** - pushes conformity over personal goals).
  6.  **Ease of Choice?** *Yes.* Information is presented; choice remains free. **Pass.**
  7.  **Avoids Manipulation?** *Requires Judgment/Probably No.* Uses social pressure and potentially shame (implied by lack of smiley). Smiley face is an emotional nudge bordering on reward/punishment. Exploits desire for social approval. **Likely Fail.**
  8.  **Welfare Benefit?** *Unclear/Requires Judgment.* Might increase savings for some, but could cause anxiety, demotivation, or resentment in others below average. Benefit less clear-cut than defaults. **Likely Insufficient to Justify Concerns.**
  9.  **Stakeholder Review:** *Required.* **Confirm.**
      *   **Procedure Output:** **Likely Reject** based on **Fails Step 5 (Alignment)** and **Fails Step 7 (Manipulation)**. Step 4 is weak, Step 8 is insufficient justification. *Matches instinct?* If instinct was "harmless motivation", procedure forces consideration of manipulation (Step 7) and misaligned goals (Step 5).

  **Where the Procedure Forces a Different View:** Proposal (3) likely comes out differently than an initial "harmless motivation" instinct. The procedure highlights:
  *   **Step 5 (Alignment):** It questions if peer pressure aligns with *employee* goals or imposes conformity.
  *   **Step 7 (Manipulation):** It flags the smiley face and comparison as potentially manipulative/shame-inducing techniques, not just rational information.

  **What the Procedure CANNOT Do:**

  1.  **Resolve Fundamental Value Conflicts:** It flags trade-offs (e.g., Welfare Gain vs. Autonomy Intrusion at Step 8), but *cannot* decide the "right" balance. This requires human judgment based on company values and context.
  2.  **Assess Effectiveness:** It assumes the nudge *works* as intended. A useless nudge might pass ethically but be a waste of time. Separate cost-benefit/ROI analysis is needed.
  3.  **Evaluate Equity:** While Step 9 flags HR review, the procedure doesn't systematically screen for disparate impacts on different employee groups (e.g., lower-paid staff, specific demographics). This needs explicit attention in stakeholder review.
  4.  **Handle Highly Contextual or Novel Nudges:** Unusual or complex nudges might not fit neatly into the questions. Judgment calls become more frequent.
  5.  **Define "Significant Majority" or "Minimal Effort" Precisely:** These thresholds require contextual judgment (Step 5, Step 6).
  6.  **Guarantee Ethical Perfection:** It's a screening tool to catch major issues and force justification, not a guarantee of ethical purity.
  7.  **Account for Cumulative Effects:** The impact of many small nudges over time isn't directly assessed.

  This procedure provides a structured, philosophically grounded framework to scrutinize nudges, protect employee autonomy, ensure justification for paternalism, and facilitate clear discussions with your team and stakeholders. It turns abstract distinctions into actionable questions for your business context.
