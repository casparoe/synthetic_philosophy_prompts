prompt: |-
  I am a retired chemist who has lately been reading in the cognitive science of religion, and I have been testing my understanding against a friend who works in that field. She uses a naturalistic sense of the term religion in her cross-cultural coding, and I have kept a record of her rulings on particular cases:

  - Ancestor veneration, in which the dead are believed to observe and sanction the living: she codes it as religious.
  - A Theravada Buddhist community whose practice is organized around karma and rebirth rather than a creator deity: religious.
  - A cargo cult that awaits the return of ancestors bearing material goods: religious.
  - A New Age movement whose members perform group rituals to align themselves with an impersonal cosmic energy and treat that alignment as morally significant: religious.
  - A football club with chants, colors, and collective excitement, which its members treat as entertainment rather than as a source of moral obligation or sacred value: not religious.
  - A secular mindfulness program used purely for stress reduction, with no metaphysical claims: not religious.

  Next week I intend to ask her about a secular humanist congregation that meets weekly, marks births and deaths with shared rites, and treats human dignity and ecological stewardship as sacred and non-negotiable, while explicitly denying anything supernatural. I want to know what verdict I should expect if she is being consistent with her earlier rulings. I am less interested in the bare verdict than in the rule she seems to be running, the alternative rules that fit her track record just as well, and whether her rulings so far genuinely underdetermine the choice between a substantive rule, on which religion requires supernatural agents or forces, and a functionalist rule, on which religion requires sacred values, ritual, and moral community, with supernatural content optional. What would each rule predict about the new case, which is the better reading of her track record, and what further case should I put to her to settle which rule she is actually using?
reasoning: |-
  Okay, let me approach this retired chemist's query methodically. The user presents a fascinating puzzle about categorizing religious phenomena naturally, with six clear examples and one test case. 

  First, I need to unpack the core question: determining whether their colleague uses substantive (supernatural-requiring) or functionalist (sacred-values-focused) criteria for "religion." The chemist seems sophisticated - they've carefully documented rulings and recognize the underdetermination problem. Their hidden agenda might be probing whether secular humanism can be "religious" without supernatural elements.

  Looking at the pattern in the rulings:
  - Cases 1-4 all involve supernatural elements (ancestors as agents, karma/rebirth, cosmic energy) and were coded religious
  - Cases 5-6 lack supernatural elements and weren't coded religious
  But the secular humanist case creates tension: sacred values and rituals without supernaturalism. 

  Hmm... this is tricky because both rules fit the existing data. A substantive rule would reject the humanist case (no supernatural), while functionalism would accept it (sacred values + ritual community). The key is finding where predictions diverge.

  The football club case offers a clue. The chemist notes it was rejected because members saw it as entertainment, not sacred. This suggests the colleague cares about participants' own framing of meaning. That leans functionalist - but only if sacredness is present.

  For a diagnostic test case, I'd propose something with supernatural elements but no sacred/moral dimension. Like folk beliefs about ghosts that aren't tied to morality or ritual. Functionalists would exclude this while substantivists would include it. That would crack the code.

  The chemist's background matters here. As a scientist, they'll appreciate clear falsifiable tests. I should emphasize how the ghost case creates clean divergence between the theories. Also, their interest in secular humanism suggests personal stake - maybe they're exploring whether their own worldview could be "religious" naturally.
answer: |-
  Based on your colleague's rulings and the core question of substantive vs. functionalist classification, here's a breakdown of what to expect and how to probe further:

  1.  **Expected Verdict for Secular Humanist Congregation: RELIGIOUS**
      *   **Why?** It features **sacred values** (human dignity, ecological stewardship treated as non-negotiable), **shared rites** (weekly meetings, life-cycle rituals), and a **moral community** built around these. While explicitly denying the supernatural, it fulfills the functional criteria evident in her prior rulings (esp. the New Age case).

  2.  **The Competing Rules & How They Fit the Track Record:**
      *   **Rule A (Substantive - Supernatural Focus):** "Religion requires belief in, or orientation towards, *supernatural agents or forces* that are ontologically distinct from the natural world and possess causal power."
          *   *Fits Cases:* Ancestor Veneration (supernatural agents), Theravada Buddhism (karma/rebirth as supernatural forces), Cargo Cult (supernatural ancestors), New Age (impersonal cosmic energy as supernatural force). *Rejects:* Football Club (no supernatural, no sacred value), Mindfulness (no supernatural, no sacred value).
          *   *Prediction for Humanists:* **NOT RELIGIOUS** (Explicit denial of supernatural).
      *   **Rule B (Functionalist - Sacred Value Focus):** "Religion involves a community organized around shared *rituals* and *sacred values* (treated as non-negotiable, inviolable, and morally significant), which generate meaning, identity, and moral obligation, regardless of supernatural content."
          *   *Fits Cases:* Ancestor Veneration (sacred obligation, rituals, moral community), Theravada Buddhism (karma as sacred moral law, rituals, community), Cargo Cult (sacred hope/expectation, rituals), New Age (sacred cosmic alignment, rituals, moral significance). *Rejects:* Football Club (explicitly *not* treated as sacred/morally obligatory source; entertainment focus), Mindfulness (no sacred value, no moral community, purely instrumental).
          *   *Prediction for Humanists:* **RELIGIOUS** (Sacred values, rituals, moral community).

  3.  **Which Rule is the Better Reading of the Track Record?**
      *   **Functionalism (Rule B) is the stronger fit.** The key evidence is her ruling on the **New Age case**. The "impersonal cosmic energy" is borderline supernatural (arguably a "force"), but the emphasis in your description is on the *functional* aspects: group rituals, treating alignment as *morally significant*, and the values being sacred. Her coding this as religious, while rejecting the purely instrumental mindfulness and the non-sacred football club, strongly points to sacred values + ritual + moral community being the core criteria, *not* strictly supernatural agents/forces.
      *   **Underdetermination?** The track record *is* underdetermined for a strict substantive rule *if* we interpret "supernatural forces" very narrowly (e.g., requiring discrete agents). However, her inclusion of the New Age case (impersonal energy) and likely inclusion of Theravada (non-theistic) suggests a broader substantive view encompassing impersonal forces. Crucially, **the rejection of the Football Club is decisive for functionalism.** A purely substantive rule *could* potentially allow for the Football Club if it involved strong group identity and ritual-like behavior, even without the supernatural. Her rejection, specifically noting the *lack of sacred value/moral obligation*, aligns perfectly with functionalism and creates tension for pure substantivism.

  4.  **Predictions for the New Case:**
      *   **Rule A (Substantive):** Predicts **NOT RELIGIOUS** (No supernatural agents/forces claimed).
      *   **Rule B (Functionalist):** Predicts **RELIGIOUS** (Sacred values, rituals, moral community present).

  5.  **Diagnostic Test Case to Settle the Rule:**
      To definitively distinguish between a substantive rule (even a broad one) and a functionalist rule, propose a case with **clear supernatural elements but ABSENT sacred values, ritual, and moral community.** For example:
      *   **"The Case of the Superstitious Gambler":** An individual has a strong, persistent belief that a specific quartz crystal (which they believe possesses a unique, non-natural "luck energy") influences dice rolls in their favor. They carry it always when gambling, perform a brief private tapping ritual on it before each roll, and are convinced it works supernaturally. However:
          *   They do *not* treat the crystal or its "energy" as sacred or morally significant.
          *   They have no community or shared rituals around it.
          *   Their belief is purely self-interested and instrumental (winning money).
          *   It imposes no moral obligations on them or others.
      *   **Prediction:**
          *   **Substantive Rule (A):** RELIGIOUS (Clear belief in a supernatural force - "luck energy" - with causal power).
          *   **Functionalist Rule (B):** NOT RELIGIOUS (Lacks sacred values, moral significance, shared rituals, and moral community. Purely private, instrumental superstition).
      *   **Why it works:** This case isolates the supernatural element present in her previous "religious" codings (like the New Age energy) but strips away the functional elements she consistently values (sacredness, moral significance, community ritual). Her ruling here will be highly revealing:
          *   If she codes it **Religious**, she leans **Substantive** (supernatural content is sufficient).
          *   If she codes it **Not Religious**, she leans **Functionalist** (supernatural content alone is insufficient without sacred values/community).

  **Conclusion:** Based on her rulings, especially including the New Age group (focused on impersonal energy + sacred value/ritual) and excluding the Football Club (due to lack of sacred value/moral obligation despite ritual-like behavior), **expect her to code the Secular Humanist Congregation as RELIGIOUS.** This strongly suggests she employs a **Functionalist rule** where sacred values, ritual, and moral community are core, and supernatural content is common but not strictly necessary. The "Superstitious Gambler" case is the critical test to confirm this by forcing a choice between supernatural content alone and the functional package. Your meticulous record-keeping provides excellent data for this analysis!
