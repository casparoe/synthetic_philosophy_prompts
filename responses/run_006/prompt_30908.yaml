prompt: |-
  I am a PhD student in political theory drafting a qualifying paper on the boundary problem: the question of who, prior to any democratic procedure, properly constitutes the demos whose collective decisions are legitimate. I want the specification before I evaluate the usual proposals. Write the desiderata that any adequate account of the demos must satisfy, where adequacy means able to guide and appraise actually existing democratic institutions rather than merely ideal theory. For each requirement, give the case or consideration that makes it binding, and mark whether it is non-negotiable or a preference of one camp (cosmopolitan, statist, all-subjected, all-affected, and so on). I especially need a clear treatment of five points. First, non-circularity: a principle for constituting the demos cannot presuppose a demos already empowered to constitute itself, yet an externally imposed standard seems to violate the democratic idea that a people settles its own boundaries — so are these two desiderata jointly satisfiable, and if not, which one gives way? Second, extensional adequacy across the hard cases: long-term resident noncitizens, emigrants, future persons affected by present policies, children, persons with severe cognitive disabilities, and outsiders subject to a state's border or climate coercion. Third, the distinctions between being affected, being subjected, being coerced, and having a stake — which of these, if any, should inclusion track, and does inclusion come in degrees? Fourth, non-gerrymanderability: the criterion must not allow boundaries to be drawn so as to predetermine outcomes. Fifth, identify the single requirement that does the most work to exclude the leading candidate principles — all-affected interests, all-subjected persons, the coercion principle, the stakeholder principle, and the view that the demos is simply given by existing states — and then give a brief scorecard of those principles against the full list. Keep the weight on the criteria and their motivating cases rather than on the scorecard.
reasoning: |-
  Okay, the user is a PhD student in political theory working on the boundary problem—specifically, who constitutes the demos before any democratic procedures. They need desiderata for an adequate account that can guide real institutions, not just ideal theory. Let me break down their five key points.

  First, non-circularity. The principle can't presuppose an existing demos, but external imposition seems undemocratic. This is tricky. Got to resolve if both can be satisfied or which gives way. Maybe procedural solutions could help, like iterative processes or partial inclusion, but it's a fundamental tension. Non-circularity might be non-negotiable because circularity undermines the whole project.

  Next, extensional adequacy across hard cases. Categories like noncitizen residents, emigrants, future generations, children, people with disabilities, and those affected by border/climate policies. Each group presents unique challenges. For example, future persons can't participate now, so how do we include them? Children and those with disabilities need representation without direct voting. This requirement is non-negotiable because real democracies face these groups daily.

  Then, distinguishing affected, subjected, coerced, and stake. The user wants clarity on which to track. Affected interests might be too broad; subjected or coerced might be narrower but more manageable. Coercion could be key for legitimacy, but affected includes more people. Also, should inclusion be binary or graded? Probably degrees make sense for some cases like temporary visitors vs. long-term residents.

  Non-gerrymanderability is crucial. The criterion must prevent boundary manipulation to sway outcomes. For example, if inclusion is based on residency, but states control residency rules, that's problematic. Need a principle immune to strategic adjustments. This is non-negotiable to maintain fairness.

  Lastly, identifying the key requirement that excludes major principles. Extensional adequacy seems to trip up most—affected interests is too broad, subjected might exclude some, coercion might miss stakeholders. Existing states fail on multiple fronts. The scorecard should highlight these weaknesses without overshadowing the criteria.

  Deep Needs: The user likely wants a structured framework to evaluate existing theories rigorously. They might need clarity on reconciling theoretical ideals with practical application. Also, addressing the circularity paradox is essential for their paper's foundation. They might also seek a balance between inclusivity and feasibility, ensuring their criteria don't lead to unworkable solutions. Ensuring each desideratum is grounded in real cases will strengthen their argument against purely normative approaches.
answer: |-
  Here are the desiderata for an adequate account of the demos, grounded in practical institutional guidance and appraisal, addressing your five focal points:

  **Core Desiderata for Demos Specification (Non-Ideal Institutional Focus):**

  1.  **Non-Circularity & Procedural Legitimacy:**
      *   **Requirement:** The principle must provide a *basis* for constituting the demos without presupposing a *prior*, fully constituted demos empowered to decide its own boundaries. However, the principle must not be *externally imposed* in a way that fundamentally violates the democratic ideal of collective self-determination.
      *   **Motivating Case:** The foundational paradox: How can "we the people" decide who "we" are, if "we" don't exist yet? Yet, an "objective" standard imposed by philosopher-kings or external powers is anti-democratic.
      *   **Binding Consideration:** Any legitimate democratic authority must originate from the collective it governs. A purely external standard undermines self-rule; pure self-referentiality offers no starting point.
      *   **Resolution (Tentative):** These are jointly satisfiable only by a *procedural* or *iterative* approach (e.g., bootstrapping from existing, albeit imperfect, institutional memberships; requiring inclusion of all subjected to coercion in boundary-setting itself). **Non-circularity** is non-negotiable for a foundational principle. **Pure procedural self-constitution** at the *initial* boundary-setting stage is likely impossible without circularity; *some* substantive criterion (e.g., all-subjected) is needed to launch the process, which can then be refined democratically. *Status:* **Non-Negotiable** (Non-circularity), **Conditional** (Self-determination is a core democratic value, but its *initial* realization requires a non-circular anchor).

  2.  **Extensional Adequacy (Covering Hard Cases):**
      *   **Requirement:** The principle must offer plausible and consistent guidance on inclusion/exclusion for empirically significant groups that challenge simple residency/citizenship: long-term resident noncitizens, emigrants (especially those retaining ties/affected), future generations significantly affected by present decisions (e.g., climate, debt), children, persons with severe cognitive disabilities, and individuals outside territorial borders subject to significant state coercion (e.g., border violence, extraterritorial drone strikes, climate policies causing displacement).
      *   **Motivating Case:** Real-world democracies constantly grapple with these groups. Excluding long-term residents creates an underclass; ignoring future generations leads to intergenerational injustice; excluding children/cognitively disabled raises equality concerns; ignoring extraterritorial coercion undermines legitimacy claims. Failing here renders the principle useless for institutional appraisal.
      *   **Binding Consideration:** An account incapable of handling the salient inclusion dilemmas faced by actual institutions cannot guide or appraise them. Justice, legitimacy, and stability demand coherent answers.
      *   *Status:* **Non-Negotiable** for practical adequacy.

  3.  **Conceptual Precision (Affected vs. Subjected vs. Coerced vs. Stakeholder):**
      *   **Requirement:** The principle must clearly specify the relevant relationship grounding inclusion: being *affected* (broad causal impact), *subjected* (governed by binding rules), *coerced* (direct threat of sanction for non-compliance), or having a *stake* (vital interests at risk). It must justify *why* this specific relation is normatively decisive for democratic inclusion and address whether inclusion is binary (in/out) or scalar (degrees of inclusion/voice).
      *   **Motivating Case:** Vagueness leads to unworkability. "Affected" can encompass the entire globe for climate policy; "subjected" might exclude those coerced at borders but not governed internally; "stake" is highly subjective. Does a tourist subjected to laws for a week warrant the same inclusion as a lifelong resident? Does a future person get a "vote"?
      *   **Binding Consideration:** Institutional design requires clear operational criteria. Different relations imply vastly different scopes and institutional forms. Clarity is essential for guidance and appraisal.
      *   *Status:* **Non-Negotiable** for institutional applicability. (The *choice* of relation reflects cosmopolitan/statist/etc. leanings, but the *requirement for clarity* is neutral).

  4.  **Non-Gerrymanderability:**
      *   **Requirement:** The criterion must be resistant to strategic manipulation by existing power holders who might define boundaries specifically to include/exclude groups to predetermine political outcomes favorable to themselves.
      *   **Motivating Case:** Historical and contemporary gerrymandering of electoral districts; restrictive citizenship/naturalization laws designed to preserve power for specific ethnic/class groups; defining "affected" narrowly to exclude opponents.
      *   **Binding Consideration:** If the boundary principle itself is easily gamed, it fails the core democratic function of ensuring collective decision-making isn't hijacked by factional interests manipulating the foundational rules. Undermines legitimacy and fairness.
      *   *Status:* **Non-Negotiable** for democratic integrity.

  5.  **Institutional Feasibility & Stability:**
      *   **Requirement:** The resulting demos must be capable of functioning as a collective decision-making unit within plausible institutional frameworks. It should promote, not inherently undermine, political stability and the capacity for effective governance over time.
      *   **Motivating Case:** A demos encompassing everyone "affected" by global trade becomes unmanageably large and diverse, potentially paralyzing decision-making. A demos excluding large resident populations subject to law creates internal instability and delegitimization.
      *   **Binding Consideration:** Principles leading to practically unworkable or inherently unstable political units cannot guide or appraise *actually existing* institutions striving for democratic governance. Feasibility is a constraint of non-ideal theory.
      *   *Status:* **Negotiable Weight** (Statists prioritize this highly; Cosmopolitans often downplay it). However, *complete* disregard for feasibility renders the principle irrelevant for institutional appraisal.

  **The Key Excluder: Extensional Adequacy**

  *   **Why it Excludes:** This requirement most forcefully exposes the limitations of leading principles when faced with the complex reality of hard cases.
  *   **Scorecard Brief (Against Full List - Focus on Extensional Adequacy & Key Weaknesses):**
      *   **All-Affected Interests (AAI):** *Fails Extensional Adequacy (Over-inclusion):* Unworkably broad for institutions (global demos for everything). *Fails Feasibility/Stability.* *Vulnerable to Gerrymandering* (defining "affected" strategically). *Conceptually Vague.* (Cosmopolitan)
      *   **All-Subjected (AS):** *Struggles with Extensional Adequacy:* Unclear on future generations ("subjected" to future effects?), emigrants (still subject to some laws?), extraterritorial coercion (is a drone strike victim "subjected"?). *Strong on Non-Circularity/Non-Gerrymanderability* (if "subjected" is defined objectively). *Generally Feasible.* (Mixed/Moderate)
      *   **Coercion Principle (CP):** *Struggles with Extensional Adequacy:* Similar issues to AS regarding future generations and extraterritoriality; may exclude those governed but not directly coerced (e.g., beneficiaries). *Strong on Non-Circularity/Legitimacy basis.* *Potentially Feasible.* (Often linked to AS/Liberal)
      *   **Stakeholder Principle (SP):** *Fails Extensional Adequacy & Conceptual Precision:* "Stake" is highly subjective and contestable. Who defines vital interests? Risk of under/over-inclusion. *Highly Vulnerable to Gerrymandering.* (Mixed)
      *   **Existing States (ES):** *Fails Extensional Adequacy:* Systematically excludes resident noncitizens, inadequately addresses emigrants/future gens, ignores extraterritorial coercion. *Fails Non-Circularity* (presupposes existing demos). *Fails Legitimacy* for excluded subjected groups. *Feasible/Stable* (by definition, but undemocratic for excluded). (Statist)

  **Addressing Your Fifth Point Directly:** Extensional Adequacy is the workhorse excluder. AAI and SP founder on over-breadth/subjectivity; ES fails by systematic under-inclusion; AS and CP, while stronger, face significant challenges on future generations and the precise scope of "subjected"/"coerced" in extraterritorial contexts and regarding long-term causal effects. No principle sails through all hard cases unscathed, highlighting the persistent difficulty of the boundary problem under non-ideal conditions. The requirement forces recognition of trade-offs between inclusivity, precision, and feasibility.
