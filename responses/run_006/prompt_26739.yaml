  Hmm, this is fascinating. The character clearly prioritizes relationships but isn't dogmatic - she sometimes lets one role dominate (like father over policeman) and other times keeps roles separate (like teacher vs. friend). The kidney donation context adds huge weight to the friendship in case seven, but government roles carry public trust obligations. 

  First, I should map different possible decision rules that could explain her first six cases. Let me brainstorm operationalizations of Confucian role ethics:

  There's the hierarchy approach - some roles permanently outrank others. But that doesn't fit her cases! She doesn't always prioritize family (see the minister case) or always professional roles (see the daughter case). 

  Then there's the role-specific duty view - each role has fixed obligations. But again, she overrides police duty for family in case one. 

  Ah! The relationship-contextual model makes more sense - she seems to consider which role is most central to the situation. In the shoplifting case, it's a family context; in the cheating scandal, it's an academic context. 

  But wait - what about case three? The minister corrects the ruler despite the brother relationship. That suggests roles aren't just about physical context but... functional primacy? The minister's core function is advising the ruler, so that trumps incidental family ties. 

  And case five is crucial - she requires balancing both spousal and filial duties. So it's not always winner-takes-all. 

  For case seven... the kidney donation creates a near-unpayable debt within the friendship role. But the government role demands impartiality. How would she weigh these? 

  I recall Confucian texts like the Mengzi discuss life-debts. The "five relationships" framework might help - ruler-minister is superior to friend-friend in classical hierarchy. But would she apply that rigidly? Probably not, given how she handled the father-police dilemma. 

  The answer might lie in her distinction between private and public expressions of roles. In case four, she fulfills teacher duties publicly but addresses friendship privately. Similarly in case seven, she might recuse herself from hiring while finding other ways to honor the debt. 

  But the kidney donation... that's profound. In Confucian ethics, saving a life creates a cosmic-level obligation. She might view hiring the son as fulfilling xiao (filial piety) extended to her "second life" giver. 

  However! Case three shows she won't compromise ministerial integrity even for family. And government service is analogous. 

  After mapping all cases, the most consistent principle appears to be: "Roles have domain-specific authority, but foundational relationships (like parent-child) can override contingent roles (like employment) when directly conflicted in that domain. Government roles serving the public good create near-absolute duties." 

  For case seven, she'd likely recuse herself from the decision while helping the son through legitimate channels. This honors both roles without corruption. 

  To test this definitively, I'll design an eighth case where a foundational role conflicts with a public duty in the same domain... like if her own child needed lifesaving medicine she could only obtain by abusing her government position. My principle predicts she wouldn't steal the medicine - public trust roles create bright lines.
