answer: |-
  Here’s a complete, runnable activity for your club, designed to let students experience the Ellsberg paradox firsthand. The activity uses physical props, small stakes (e.g., candy, extra credit points, or leaderboard points), and includes both variants of ambiguity. Total runtime: 50–60 minutes.

  ---

  ### **Activity: The Mystery Bag Game**
  **Learning Goal:** Discover how people make decisions when probabilities are known (risk) vs. unknown (ambiguity).  
  **Props Needed:**  
  - Two opaque bags or urns (e.g., cloth bags, boxes).  
  - 100 red and 100 black balls (use marbles, beads, or folded paper; ensure colors are distinct).  
  - A coin.  
  - A privacy screen (e.g., a folder, book, or cardboard).  
  - Student response sheets (paper or digital form).  

  **Setup (Before Club):**  
  1. **Bag A (Known Risk):** Fill with exactly 50 red and 50 black balls. Label: *“Bag A: 50 red, 50 black.”*  
  2. **Bag B (Fixed Ambiguity):** Fill with 100 balls in a fixed ratio (e.g., 60 red/40 black) *behind the privacy screen* so students know it’s fixed but can’t see it. Label: *“Bag B: Unknown mix (fixed by me).”*  
  3. **Bag C (Random Ambiguity):** Flip a coin 100 times. For each heads, add a red ball; tails, add black. Seal it *without revealing the outcome*. Label: *“Bag C: Unknown mix (random).”*  
  4. **Prizes:** Prepare small rewards (e.g., candy, 5 leaderboard points).  

  ---

  ### **Session Flow (45–50 Minutes)**  
  **Step 1: Introduce the Game (5 min)**  
  - *Say:* “Today, we’re playing a game about betting on colors. You’ll choose between bags to win prizes. Some bags have known odds; others are a mystery.”  
  - Show Bag A: “This has exactly 50 red and 50 black balls.”  
  - Show Bag B: “This was filled by me behind a screen—fixed but unknown.”  
  - Show Bag C: “This was filled by coin flips—random and unknown.”  
  - Explain stakes: “One of your choices will be randomly played for real. Win = prize!”  

  **Step 2: Round 1 — Fixed Ambiguity (Bag A vs. Bag B) (10 min)**  
  - Give students response sheets with two questions:  
    > **Choice 1:** Bet on RED. Pick one:  
    > - ( ) Draw from Bag A (known).  
    > - ( ) Draw from Bag B (fixed unknown).  
    >  
    > **Choice 2:** Bet on BLACK. Pick one:  
    > - ( ) Draw from Bag A (known).  
    > - ( ) Draw from Bag B (fixed unknown).  

  - *Instructions:* “Answer each choice separately. Don’t overthink—go with your gut. We’ll play one randomly.”  
  - Collect responses.  

  **Step 3: Round 2 — Random Ambiguity (Bag A vs. Bag C) (10 min)**  
  - Repeat with Bag C:  
    > **Choice 1:** Bet on RED. Pick: Bag A ( ) or Bag C ( ).  
    > **Choice 2:** Bet on BLACK. Pick: Bag A ( ) or Bag C ( ).  

  - Collect responses.  

  **Step 4: Play for Real (5 min)**  
  - Randomly select:  
    - One round (1 or 2 via coin flip).  
    - One choice (1 or 2 via coin flip).  
    - One student (draw from a hat).  
  - The selected student draws from their chosen bag for the selected bet (e.g., if they picked Bag B for red, draw from Bag B). Award the prize if they win.  

  ---

  ### **Debrief (10–15 min)**  
  **1. Reveal the Pattern:**  
  - Tally results on the board:  
    - *Fixed Ambiguity (Bag B):* How many chose Bag A for red? For black?  
    - *Random Ambiguity (Bag C):* How many chose Bag A for red? For black?  
  - *Expected Result:* Most students choose Bag A for **both** red and black bets in both rounds, even though Bag B/C have 100 balls (so red + black = 100%).  

  **2. Introduce Risk vs. Ambiguity:**  
  - “You avoided **ambiguity** (unknown odds) and preferred **risk** (known odds, like Bag A’s 50/50). This is common—people dislike not knowing probabilities, even when the ‘unknown’ bag might be identical to the known one!”  

  **3. The Paradox (Unnamed Until Now):**  
  - “Let’s say you thought Bag B had a 40% chance of red. Why would you avoid it for red bets? Because 50% (Bag A) feels safer. But if you also avoid it for black bets, you’re implying Bag B is **less than 50% likely for red AND less than 50% likely for black**—which is impossible! Combined, those odds would be under 100%, but they **must** add to 100%. This is the **Ellsberg Paradox**.”  

  **4. Why Personal Probabilities Fail:**  
  - “Standard decision theory says you should assign a personal probability (e.g., ‘I think Bag B is 40% red’). But if ambiguity aversion makes you assign *both* red and black probabilities below 50%, you’re contradicting yourself. Your choices can’t be explained by a single set of probabilities.”  

  **5. Cost of Calling It a ‘Mistake’:**  
  - “You might say, ‘People just miscalculate.’ But if we dismiss this as irrational, we ignore:  
    - **Real-world behavior:** People pay more for insurance, stocks, or vaccines when odds are known.  
    - **Evolutionary roots:** Ambiguity often signals danger (e.g., unfamiliar foods or situations).  
    - **Rationality:** Avoiding ambiguity can be smart if you suspect hidden manipulation (e.g., Bag B was rigged).”  

  **6. Variants Compared:**  
  - “In Bag B (fixed), ambiguity felt like a ‘secret’—maybe I tricked you! In Bag C (random), it was pure chance. But you likely avoided both. Why? **Ambiguity aversion persists even when the process is fair.**”  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Students copy peers or overthink:**  
     - *Fix:* Emphasize “gut decisions” and use private response sheets. If copying occurs, say: “No talking—this is about YOUR intuition.”  

  2. **Confusion about bags:**  
     - *Fix:* Relabel bags clearly. Before choices, recap: “Bag A = known, Bag B = my secret mix, Bag C = coin-flip mix.”  

  3. **Time crunch:**  
     - *Fix:* Skip Round 2 or simplify voting (e.g., show of hands).  

  4. **Prize logistics:**  
     - *Fix:* Use leaderboard points (no physical payout) or award candy to all if >50% win to avoid resentment.  

  ---

  ### **Limitations of the Physical Game**  
  - **Cannot replicate:**  
    - **Real-world stakes:** Small prizes understate aversion (people pay more to avoid ambiguity in high-stakes scenarios).  
    - **Complex ambiguity:** Real life involves partial knowledge (e.g., “30–70% red”), not just total unknown.  
    - **Learning over time:** In the game, probabilities stay hidden; in life, people gather clues to reduce ambiguity.  
  - **Supply in discussion:**  
    - “In life, ambiguity might involve a stock market crash or a new virus—unknowns with huge consequences. Would you avoid those bets too? How might you reduce ambiguity?”  

  This activity lets students *feel* the paradox, making the debrief more impactful. The physical props and stakes create engagement, while the variants highlight ambiguity’s persistence.
