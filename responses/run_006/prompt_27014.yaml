  The third move fascinates me most - Iris's "idle wheel" argument about indistinguishability. While clever in highlighting the private nature of dreams, I notice she's overlooking how third-person evidence could theoretically break that symmetry. Peter's neurophysiological evidence in move 4 seems his strongest play, particularly the real-time REM tracking data which does appear to support temporal continuity. 

