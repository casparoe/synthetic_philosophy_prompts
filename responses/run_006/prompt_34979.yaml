prompt: |-
  Analyze the introduction of the euro (1999–2002) as a case study in the social construction of money. The euro was brought into existence by treaty, legislation, and a coordinated logistical operation: on 1 January 1999 it became the official currency of eleven EU member states for accounting purposes, and on 1 January 2002 physical notes and coins entered circulation, replacing national currencies that had circulated for decades or centuries. I want a disciplined mapping of what exactly had to be in place — institutions, collective attitudes, legal declarations, material practices, coordination mechanisms — for the euro to be money rather than merely paper with pictures on it, and which theories of social construction (Searle's institutional facts and constitutive rules, collective intentionality accounts, or whichever framework you find most illuminating) best capture each component. Then identify where the theories strain: what features of the euro's introduction — the three-year transition period during which the euro was money but not yet a physical currency, the psychological stickiness of legacy prices in national currencies long after the changeover, the fact that some EU member states adopted it and others did not, the status of the euro during the 1999–2001 interval when it existed only as a unit of account — resist a clean social-construction account, and whether those features reveal a genuine gap in the theories or merely a complication they can absorb. Finally, say what the episode shows about money as a socially constructed kind: does the euro confirm that money is nothing over and above collective acceptance, or does the episode suggest that money requires something more — a material substrate, a history of use, a pre-existing practice — that a pure constructivism misses?

  After your analysis, provide a structured summary as a JSON object with the following fields:

  - `"theories_applied"`: an array of strings naming each theory or framework you drew on.
  - `"components_mapped"`: an array of objects, each with `"feature"` (a specific feature of the euro's introduction) and `"assessment"` (a one-sentence evaluation of how well the chosen theories explain it, and which theory does best).
  - `"anomalies"`: an array of objects, each with `"phenomenon"` (a feature the theories struggle with) and `"diagnosis"` (either `"gap"` if it reveals a genuine limitation in the theory, or `"complication"` if the theory can plausibly accommodate it with elaboration).
  - `"verdict"`: a one-paragraph overall assessment of what the euro episode shows about money as a socially constructed kind — whether it vindicates constructivism, exposes its limits, or points toward a hybrid view.
