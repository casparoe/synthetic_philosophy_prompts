  ok so in bio we were talking about what makes something 'alive' and my teacher listed the usual stuff — metabolism, reproduction, homeostasis, etc. but then she threw out a bunch of edge cases and now i can't stop thinking about it. can you rank these borderline cases by how much they actually mess with the standard defintion? like a tier list from 'this is a genuine headache for any definition of life' to 'lol this is barely even a problem.' include viruses, prions, bacterial spores, frozen frogs (like wood frogs that freeze solid over winter), mules, and whatever else you think is interesting. a sentence or two for each about why it lands in that tier.
