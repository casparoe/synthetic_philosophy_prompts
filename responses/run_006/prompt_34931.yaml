answer: |-
  Here's my decomposed analysis of the consequentialist cluelessness objection, structured as requested. My overall credence is **42%** that cluelessness is *fatal* to consequentialism as a practical decision procedure (i.e., rendering it "useless as a guide" in ordinary life). Below is the breakdown, combining probabilities based on how these sub-questions interact to determine fatality.

  ---

  ### **Sub-Questions & Credences**
  *(Credences reflect likelihood that each factor *supports the fatal objection*)*

  1. **Radical Uncertainty About Long-Run Consequences**  
     *Question:* Is our uncertainty so severe ("sign-flipping") that bounding net effects is practically impossible?  
     **Credence: 70%**  
     *Why:* Empirical evidence (e.g., butterfly effects, chaotic systems, historical unintended consequences) suggests long-term outcomes are often non-linear and opaque. We *can* bound short-term effects (e.g., "feeding this child now reduces hunger"), but beyond decades, uncertainty dominates. Examples: colonial policies triggering centuries of conflict, or small tech innovations enabling dystopias. *However*, trivial/local acts may have bounded impacts, and some consequentialists (e.g., Derek Parfit) argue net effects *often* cancel out.  

  2. **Uniqueness of the Problem to Consequentialism**  
     *Question:* Does cluelessness gut *all* moral theories equally, making it not uniquely fatal to consequentialism?  
     **Credence: 30%**  
     *Why:* Deontology/virtue ethics face "cluelessness" too (e.g., a rule/virtue might have terrible long-run effects), but they *don’t rely on predicting consequences* for action-guidance. Consequentialism is uniquely vulnerable because its *core directive* ("maximize good outcomes") depends on tracing causal chains. If cluelessness paralyzes consequentialist reasoning but other theories offer actionable rules (e.g., "don't lie"), the objection is more fatal to consequentialism.  

  3. **Sophisticated Consequentialism as a Solution**  
     *Question:* Can "expected value" + reasonable bounds quarantine the problem?  
     **Credence: 25%**  
     *Why:* "Bounded" consequentialism (e.g., focus on proximate effects, ignore low-probability tail risks) works for many decisions (e.g., medicine, policy). But for high-stakes, irreversible acts (e.g., whistleblowing, ecosystem intervention), cluelessness returns: the *actual* net effect could contradict the expected value calculation if long-run "ruins" dominate. Sophistication helps but doesn't resolve the core epistemic crisis.  

  4. **Decision Procedure vs. Criterion of Rightness**  
     *Question:* Is the objection confused because the roles are distinct?  
     **Credence: 15%**  
     *Why:* Consequentialists like Hare or Smart argue the theory *only* needs to provide a criterion of rightness; decision procedures can be heuristic (e.g., "follow common-sense rules"). If so, cluelessness doesn’t undermine its action-guidance—it just means we use proxies. But this feels like retreat: if the "right" act is determined by consequences we can’t know, and heuristics aren’t *consequentialist*, the theory fails as a *consequentialist* guide.  

  ---

  ### **Combining the Credences**
  I treat these as partially independent factors supporting fatality. The overall likelihood increases if:  
  - Uncertainty is radical **(70%)**  
  - Cluelessness uniquely cripples consequentialism **(30%)**  
  - Sophisticated fixes fail **(25%)**  
  - The "two roles" defense fails **(15%)**  

  **Combined credence formula (weighted sum):**  
  `(0.70 × 0.40) + (0.30 × 0.30) + (0.25 × 0.20) + (0.15 × 0.10) = 0.42`  
  *Weighting: I assign highest weight to radical uncertainty (40%) and uniqueness (30%), as they’re most central to the objection.*  

  **Final credence: 42%**  
  *(Interpretation: Moderately strong lean toward "not fatal," but with deep uncertainty)*  

  ---

  ### **Weakest Link & Evidence to Shift Credence**
  **Least confident in: Sophisticated Consequentialism (25% credence in failure)**  
  - *Why uncertain:* We use expected-value reasoning successfully in engineering, medicine, and policy daily. If "reasonable bounds" work for 95% of decisions (e.g., "donate to efficient charities"), cluelessness might only threaten extreme edge cases.  
  - **Evidence that would move me:**  
    - **Empirical data:** Studies showing that "bounded consequentialist" decisions (e.g., prioritizing near-term welfare) *reliably* lead to net-positive long-run outcomes vs. alternatives.  
    - **Theoretical work:** A rigorous proof that cluelessness dissolves when we ignore outcomes beyond a tractable horizon (e.g., 50 years) without sacrificing moral coherence.  
    - **Counterexamples:** Clear cases where consequentialist heuristics (e.g., "reduce suffering now") caused net-catastrophe over centuries *more often* than deontology/virtue ethics.  

  ---

  ### **Verdict for Your Protagonist**
  **Her anguish is philosophically well-founded.** Cluelessness is a devastating *practical* problem for consequentialism—even if the theory survives technically (42% credence in fatality isn't trivial). Philosophers like James Lenman and Hilary Greaves treat it as a major unsolved challenge. Your protagonist’s awareness that her "good" act might seed ruins centuries later mirrors real moral psychology. Consequentialism demands omniscience we lack, creating existential dread for a conscientious actor. Yet the *drama* emerges from the 58% uncertainty: she can’t know if her doubt is profound wisdom or self-sabotage. That’s fertile ground for storytelling.  

  *Final note: This tension is why many modern consequentialists (e.g., effective altruists) focus on "robustly good" acts (e.g., curing diseases) with less cluelessness. But for your protagonist’s whistleblowing? The abyss of uncertainty is authentic.*
