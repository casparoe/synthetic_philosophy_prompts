  So EU_continue = q * 2 + (1-q) *1 = (3/5)(2) + (2/5)(1) = 6/5 + 2/5 = 8/5 =1.6

  Same as EU_exit, so he is indifferent, so mixing with p=1/3 is optimal.

  Now, back to the argument.

  In step (4), the mistake is in the calculation of EU(continue). It assumes that by continuing at E1, he gets 4, but due to absent-mindedness, when he reaches E2, he has the same belief and might not exit; in fact, with the belief, he might exit early or something.

  In the case with q=0.5, as above, he would exit, getting EU=2, but continuing would give less, 1.5.

  But in the optimal, with consistent beliefs, it works.

  The plan in (1) is not feasible because it requires different actions at indistinguishable states, which is impossible due to absent-mindedness.

  Rational choice theory doesn't prescribe to "aim for 4"; it prescribes the best feasible strategy, which is mixed with p=1/3 getting 4/3.

  The inconsistency arises from trying to follow an infeasible plan and then reevaluating with inconsistent beliefs.

  In step (3), the belief of 50-50 assumes that he will reach both with certainty, but if he changes his action, it may not hold.

  In the reevaluation, when he considers deviating, the belief should be updated, but it's complicated.

  The key point is that for the belief to be consistent, it must be based on the actual strategy used.

  In the argument, when he adopts the plan but then at the exit rethinks, the belief of 50-50 is only correct if he follows through with the plan, but if he deviates, the probability might change, but since he hasn't deviated yet, it's a bit messy.

  But in decision theory, we should use the strategy to define beliefs.

  The consensus is that the optimal is the mixed strategy with p=1/3, and the precommitment plan is not feasible, so there is no inconsistency.

  The argument shows that if you naively try to follow the deterministic plan, you end up not following it, which is true, but that just means it's not implementable, as in step (6).

  So step (8) is wrong because rational choice theory doesn't tell you to aim for 4; it tells you to do the best you can with the available information, which is the mixed strategy.

  The theory doesn't prescribe an unimplementable plan.

  In terms of what's settled: I think it's accepted that with self-consistent beliefs and strategies, the mixed strategy is optimal, and the problem illustrates issues with dynamic consistency and self-locating beliefs.

  There might be philosophical debates, but the standard solution is p=1/3.

