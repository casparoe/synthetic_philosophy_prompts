prompt: |-
  So I joined my department's hiring committee this year and I keep noticing this pattern that's driving me nuts. We have twelve people, all smart, all well-intentioned, all reading the same files. But when we discuss candidates, the group somehow lands on worse judgments than what I'd expect if you just averaged everyone's private rankings before the meeting. It's like the discussion makes us dumber, not smarter. The weird part is that adding more people seems to make it worse — we had a subcommittee of four that made better calls than the full group of twelve. I vaguely remember something from undergrad about a theorem that says more voters equals better decisions, but that's clearly not what's happening here. Is there a name for this — the thing where adding more people to a group decision makes the outcome worse even though each person is competent? And I don't just mean groupthink or conformity pressure, because we actually disagree a lot. It's more like the information gets pooled in a way that amplifies our shared blind spots rather than canceling out our individual errors. Does this have a name, and how does it relate to that theorem I'm half-remembering?
reasoning: |-
  Okay, the user is part of a hiring committee and has noticed that when they discuss candidates as a group of twelve, the collective decision seems worse than if they just averaged everyone's individual rankings. They mention that a smaller subcommittee of four made better decisions than the full group. They recall a theorem about more voters leading to better decisions but observe the opposite happening. The user wants to know if there's a name for this phenomenon and how it relates to the theorem they're half-remembering.

  First, I need to identify the theorem they're referring to. The Condorcet Jury Theorem comes to mind. It states that with competent voters, adding more people should improve decision-making. But in their case, the opposite is happening. So why is that?

  The user mentions that it's not groupthink because they have disagreements. Instead, the issue is that shared blind spots are amplified when information is pooled. This suggests the problem might be related to correlated errors. In Condorcet, the assumption is that errors are independent. If committee members have similar biases or blind spots, their mistakes aren't independent; they're correlated. So when they discuss, these shared biases get reinforced, leading to worse outcomes.

  Also, the larger group size might exacerbate this. With twelve people, dominant personalities or common biases could steer the discussion, overshadowing minority viewpoints. The subcommittee of four might have less correlation in their errors or allow more balanced discussions.

  Another angle is the common knowledge effect. During discussions, information that's already known to everyone gets more emphasis, while unique insights (which might be critical) are overlooked. So even if one person has crucial info, it might not surface in a large group discussion.

  The theorem they recall assumes voters are independent and competent. But in reality, committee members might share similar backgrounds or institutional biases, leading to correlated errors. Also, group dynamics like persuasion or information cascades can cause individuals to ignore their private info in favor of the group's view.

  The user needs a term for this. "Correlated noise" or "systematic bias" fits. "Information cascade" or "common knowledge effect" are relevant too. The key is that shared blind spots are amplified, not individual errors canceled out.

  They might also be looking for solutions. Maybe use methods like Delphi technique or nominal group technique to reduce discussion biases. Or structured discussions where dissenting opinions are heard first. The hiring process could be adjusted to focus on diverse evaluations.

  Deep down, the user wants to improve their committee's decisions. They need strategies to mitigate this effect, not just the name of the phenomenon. So providing both the explanation and practical solutions would address their unspoken needs.
answer: |-
  You've hit on a profoundly important and well-documented phenomenon in group decision-making – and you're absolutely right that it contradicts a naive interpretation of the Condorcet Jury Theorem (the one you're half-remembering). What you're experiencing has several interconnected names and explanations:

  1.  **"Correlated Noise" or "Systematic Bias" (in the context of the Condorcet Jury Theorem Breakdown):**
      *   **The Condorcet Jury Theorem (CJT):** This theorem states that if:
          *   Each voter has a competence *p > 0.5* (better than chance at identifying the "correct" choice).
          *   Voters make decisions **independently**.
          *   They vote sincerely (according to their private judgment).
          Then, as the group size increases, the probability that the majority makes the correct choice approaches 1. *This is the "more voters = better decisions" idea.*
      *   **The Problem:** The critical assumption CJT relies on is **independence of errors**. Your committee members' errors (blind spots, misinterpretations, biases) are **not independent**. They are **correlated**. You all likely share:
          *   Similar backgrounds/training (e.g., same department/school).
          *   Similar institutional culture/norms.
          *   Similar implicit biases (e.g., favoring certain research styles, personalities, or backgrounds).
          *   Access to the *same* limited information in the files.
      *   **The Consequence:** Instead of individual random errors canceling each other out, **shared systematic biases get amplified** when you aggregate votes or discuss. Your "shared blind spots" aren't random noise; they are a **correlated signal pushing you all in the *wrong* direction together**. Adding more people who share these correlated biases *increases* the strength of this erroneous signal, making the group *more* confidently wrong.

  2.  **"Common Knowledge Effect":**
      *   During discussion, information that is **already known to most or all members** (the shared information in the files, the department's conventional wisdom) dominates the conversation and carries disproportionate weight.
      *   **Unique information** – the distinct insights, reservations, or positive signals that individual members noticed privately but others missed – often gets **drowned out, discounted, or never shared**. Even if someone tries to bring it up, it lacks the social proof of the common knowledge and is less persuasive.
      *   In a large group, this effect is magnified. The pressure to focus on the common baseline is stronger, and it's harder for unique perspectives to gain traction against the tide of shared understanding (even if that shared understanding is flawed or incomplete).

  3.  **"Information Cascades" (within discussion):**
      *   Early speakers or influential members (even unintentionally) set a direction for the discussion.
      *   Subsequent members, hearing this initial leaning and observing social cues, may **suppress their private information** (especially if it contradicts the emerging consensus) and **conform to the developing group view**, even if their private judgment differs. Their conformity then reinforces the cascade for the next person.
      *   In a group of 12, the cascade starts earlier and gains momentum more powerfully than in a group of 4, making it harder for dissenting or unique information to surface later. It's not just conformity pressure; it's individuals rationally (but mistakenly) inferring that the early speakers must have compelling information they lack.

  4.  **"Group Polarization":**
      *   While often discussed for attitudes, this can apply to evaluations. During discussion, group members can become **more extreme in their initial shared leaning** (positive or negative) than the average of their pre-discussion opinions. If there's a slight shared initial bias against a candidate type, discussion can make the group *more* negatively biased.

  5.  **"The Paradox of Group Expertise" or "The Failure of Collective Wisdom" (in correlated environments):** These are broader terms capturing the essence – groups *can* be wise, but only under specific conditions (diversity, independence, decentralization) that are often violated in real committees like yours.

  **Why the Subcommittee of 4 Worked Better:**

  1.  **Lower Correlation Impact:** While still correlated, 4 people inherently have *less* correlated noise than 12 people drawn from the same pool. There's simply less mass amplifying the shared bias.
  2.  **More Room for Unique Voices:** It's easier for each person to share their unique perspective in a group of 4. The discussion is less dominated by common knowledge, and unique information has a better chance of being heard and integrated.
  3.  **Less Prone to Cascades/Polarization:** There are fewer "steps" in the cascade, and the smaller size makes it harder for a strong initial opinion to completely drown out others. Polarization effects might be milder.
  4.  **Reduced Process Losses:** Large groups suffer more from coordination difficulties, airtime competition, and social loafing. Smaller groups are often more efficient and engaged.

  **What This Means for Your Committee (Practical Implications):**

  *   **Acknowledge the Shared Bias:** Explicitly discuss the *types* of blind spots your department might have (e.g., overvaluing certain methodologies, undervaluing interdisciplinary work, implicit biases). Make them visible.
  *   **Structure Discussion to Surface Unique Information:**
      *   **Silent Start:** Have members write down their key points/rankings *before* any discussion begins. Use this as a baseline.
      *   **Round-Robin:** Forcefully give each member equal time to share their most important positive/negative observation *without interruption*, especially focusing on anything they think others might have missed. Start with junior members or those likely to hold minority views.
      *   **Designated Devil's Advocate:** Assign someone specifically to argue against the emerging consensus.
      *   **Subgroup Reports:** Break into smaller groups (like your 4-person subcommittee) first to discuss, then have each subgroup report key points and disagreements to the full committee. This surfaces more diverse perspectives.
      *   **Anonymous Input:** Use anonymous polls or shared documents for initial rankings or key concerns to reduce early cascade pressure.
  *   **Seek Deliberate Diversity:** If possible, include members from slightly different subfields, backgrounds, or career stages on the committee to *introduce* less correlated perspectives.
  *   **Focus Discussion on Interpretation, Not Just Aggregation:** The goal shouldn't just be to "average" but to *understand why* people see things differently. Probe the reasons behind divergent ratings.
  *   **Consider Pre-Discussion Voting (Carefully):** Taking a silent, anonymous vote *before* discussion can capture the initial independent judgments (closer to the CJT ideal) and reveal the range of opinions. However, this needs careful handling to avoid anchoring the subsequent discussion *too* rigidly on that vote.

  You've identified a core challenge of group decision-making. The name isn't singular, but the mechanisms – **correlated errors breaking Condorcet's independence assumption, the common knowledge effect drowning out unique information, and information cascades suppressing dissent** – explain why your large, smart, well-intentioned committee is making worse decisions than logic (or CJT) would predict. The solution lies in structuring your process to actively combat these inherent tendencies.
