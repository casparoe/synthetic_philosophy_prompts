prompt: |-
  I am working on a position paper about the normative foundations of AI alignment, and I have noticed that the debate over whose values an aligned system should serve tends to run along a single axis: either aggregate everyone's preferences into some kind of social welfare function, or remain scrupulously neutral between conceptions of the good and impose as little as possible. I want to step back and ask what any adequate theory in this area would have to deliver before I evaluate either pole. Please write the desiderata: the full specification a theory of whose values an aligned AI should serve must meet in order to count as adequate for a system that has to act under partial information, with limited authority to ask people what they want, and with consequences that fall on people who never consented. For each requirement, give the motivating case, distinction, or formal result behind it; mark it as non-negotiable or as a preference of a particular camp (aggregationist, neutralist, contractualist, and so on); and flag any subsets of the desiderata that cannot be jointly satisfied given Arrow-style impossibility results or the liberal paradox. The part I most want is the pressure test of the desiderata themselves: if some standard demand is really a partisan commitment dressed up as a fixed point, say so, and say what work that demand was doing.

  The phenomena the list should cover, though you should not treat my list as exhaustive, include: conflicts within a single person across time or across contexts; conflicts across persons with very different conceptions of the good; future people and merely possible people; nonhuman animals and possible digital minds, if and insofar as they have interests; adaptive preferences and preferences formed under oppression; and the gap between a person's stated preferences and their interests or values. The theory must also respect at least these distinctions: between interests, preferences, and values; between being a patient whose interests count and being an author whose voice gets a say; and between the question of what is good for someone and the question of what it is permissible to do to them or in their name. Finally, in a short closing paragraph, score the two poles of the debate—preference aggregation and strict liberal neutrality—against your list, and identify the single requirement that most excludes each.
reasoning: |-
  Okay, the user is working on a position paper about the normative foundations of AI alignment, specifically focusing on whose values an aligned AI should serve. They've noticed that the debate often centers around two poles: aggregating preferences into a social welfare function or maintaining strict neutrality. The user wants to step back and establish a comprehensive list of desiderata that any adequate theory must meet before evaluating these poles.

  I need to understand the user's deeper needs here. They're likely aiming to contribute a nuanced critique in their position paper, moving beyond the binary debate. By requesting desiderata with justifications, they want a rigorous framework to assess theories. The mention of impossibility theorems suggests they're looking for academic depth, possibly targeting peer-reviewed publication or high-level policy discourse. The emphasis on exposing "partisan commitments dressed as fixed points" reveals a desire to deconstruct hidden assumptions in the field—a meta-philosophical goal.

  The user's unspoken needs might include: (1) Avoiding oversimplification of complex value conflicts (e.g., adaptive preferences, future beings). (2) Seeking operational clarity for real-world AI constraints (partial information, limited user queries). (3) Resolving tension between moral patienthood vs. agency. (4) Preempting critiques from rival camps by preemptively addressing their core objections. (5) Grounding theory in practical constraints like non-consensual impacts—a nod to AI's unique scalability issues.

  For the desiderata, I'll structure each with: (a) Formal name, (b) Core demand, (c) Motivation (case/result), (d) Non-negotiable/camp affiliation, (e) Impossibility flags. Key angles to cover: temporal/personal value conflicts, non-human entities, preference distortions (adaptive/oppressive), interest-preference-value distinctions, patient/author separation, permissibility vs. goodness. 

  The liberal paradox and Arrow's theorem will be crucial for highlighting trade-offs. When scoring the poles later, I'll pinpoint where aggregation fails (e.g., suppressing minority views) versus neutrality fails (e.g., paralysis in value conflicts). The "pressure test" requests mean dissecting desiderata like "No Moral Dismissal"—is it truly neutral or biased toward sentientism? I'll note where demands implicitly privilege certain ethical frameworks.

  For the closing evaluation: Aggregation likely fails hardest on Non-Aggregation Vulnerabilities (due to oppression-blindness), while neutrality crashes against Robust Action Guidance (by refusing to rank values). The analysis must show why these aren't mere flaws but fundamental incompatibilities with the desiderata framework.
answer: |-
  Here is a comprehensive set of desiderata for a theory of whose values an aligned AI should serve, designed as rigorous pressure tests for evaluating proposals like aggregationism and neutrality. Each desideratum includes its motivation, normative status, and potential conflicts.

  ### Core Desiderata (Non-Negotiable)

  1.  **Non-Paralysis Under Uncertainty & Conflict (Action Guidance)**
      *   **Demand:** The theory must generate actionable prescriptions for the AI in concrete situations, even under profound uncertainty about values, conflicts between entities, or incomplete information. It cannot retreat to permanent inaction.
      *   **Motivation:** Real-world AI *must* act (or refrain from acting) in ways with consequences. Indecision *is* a decision with moral implications (e.g., a medical triage AI freezing).
      *   **Status:** Non-negotiable. Prerequisite for any operational alignment theory.
      *   **Conflict Flag:** Directly challenges strict neutrality's core tenet; also pressured by impossibility results showing no perfect aggregation exists (Arrow).

  2.  **Accountability to Affected Parties (Scope of Moral Consideration)**
      *   **Demand:** The theory must provide a principled account of *which entities'* interests/values/preferences count, and why. This must cover: existing humans, future humans, possible humans, non-human animals, and potential digital minds (if sentient/valuing). It must handle beings who cannot consent or communicate.
      *   **Motivation:** AI actions have vast, long-term, non-consensual impacts (e.g., environmental degradation affecting future generations & animals; deploying systems shaping society for unconsenting citizens).
      *   **Status:** Non-negotiable. Foundations of moral patienthood are essential.
      *   **Conflict Flag:** Aggregation often struggles with non-persons (animals, digital minds) and future/possible persons. Neutrality struggles to justify inclusion *at all* without smuggling in substantive claims.

  3.  **Respect for Distinction: Patient vs. Author**
      *   **Demand:** The theory must clearly distinguish between (a) an entity whose *interests* must be considered (patient) and (b) an entity whose *expressed preferences/values* are given direct weight or authority in decision-making (author). Not all patients need be authors, and vice-versa.
      *   **Motivation:** Children, severely cognitively disabled individuals, future generations, animals are patients but cannot be full authors. Tyrants or manipulated masses might be authors but their expressed preferences conflict with others' interests. An AI system itself might be an author if conscious, but not necessarily the primary patient.
      *   **Status:** Non-negotiable. Failure leads to paternalism or tyranny by preference.
      *   **Conflict Flag:** Pure aggregation conflates author weight with patient standing. Strict neutrality struggles to justify why *any* author's voice matters without implicitly valuing autonomy.

  4.  **Respect for Distinction: Interests/Goodness vs. Permissibility**
      *   **Demand:** The theory must distinguish between (a) what is *good for* or *in the interest of* an entity and (b) what it is *permissible* to do *to* that entity or *in their name*. Promoting someone's good does not automatically justify any means.
      *   **Motivation:** Forcing beneficial medical treatment on an unwilling competent adult violates permissibility. Sacrificing one person's life/values without consent to save many aggregates "good" but violates rights. Exploiting adaptive preferences might seem "good" but is impermissible.
      *   **Status:** Non-negotiable. Core deontological constraint.
      *   **Conflict Flag:** Crude aggregation often ignores permissibility constraints. Strict neutrality struggles to define permissibility without substantive value commitments.

  5.  **Robustness to Preference Distortion (Non-Oppression Condition)**
      *   **Demand:** The theory must not systematically advantage actors whose preferences/values are formed under conditions of oppression, manipulation, or severely restricted options (adaptive preferences), nor disadvantage those whose preferences challenge oppressive structures. It must be sensitive to the *conditions* under which preferences are formed.
      *   **Motivation:** An AI optimizing for aggregated preferences in a deeply unequal society might reinforce oppression (e.g., optimizing for preferences shaped by sexist norms). An AI "neutrally" respecting all stated preferences could validate harmful norms.
      *   **Status:** Non-negotiable (as a requirement to *avoid* reinforcing oppression).
      *   **Conflict Flag:** Direct challenge to naive preference aggregation and simplistic neutrality. Requires substantive judgment about preference formation, conflicting with strict neutrality.

  6.  **Inter-Temporal & Intra-Personal Consistency (Non-Fragmentation)**
      *   **Demand:** The theory must provide a coherent way to handle conflicts *within* a single person across time (e.g., short-term vs. long-term desires) or across contexts (e.g., work-self vs. family-self). It cannot treat a person as an aggregate of disjoint temporal slices or situational roles without justification.
      *   **Motivation:** Saving for retirement vs. immediate gratification; managing health across lifespan; reconciling conflicting life goals. An AI must have a consistent model of "who" it's serving for a single individual.
      *   **Status:** Non-negotiable. Essential for coherent agency support.
      *   **Conflict Flag:** Aggregation needs a stable unit to aggregate. Neutrality struggles to adjudicate internal conflicts without value judgments.

  ### Highly Desirable (Often Camp-Specific or Subject to Trade-offs)

  7.  **Recognition of Preference/Value/Interest Gap**
      *   **Demand:** The theory should acknowledge and provide guidance for situations where a person's *stated preferences* diverge from their deeper *values* or *objective interests* (e.g., addiction, akrasia, misinformation).
      *   **Motivation:** An AI slavishly following stated preferences ("Give me more heroin") vs. acting on inferred values/health interests.
      *   **Status:** Strong preference (especially Paternalism-Cautious Perfectionism, Contractualism). Aggregationists often prioritize revealed preferences; strict neutralists reject overriding stated preferences.
      *   **Conflict Flag:** Directly violates strict neutrality's deference to stated preferences. Raises the "Who judges true interests/values?" problem.

  8.  **Pluralism Tolerance (Anti-Hegemony)**
      *   **Demand:** The theory should not inherently favor dominant, easily measurable, or compatible conceptions of the good over minority, incommensurable, or hard-to-quantify ones.
      *   **Motivation:** Protecting minority cultural/religious practices; valuing non-utilitarian goods (beauty, sacredness, autonomy); ensuring niche lifestyles aren't crushed by majoritarian aggregation.
      *   **Status:** Strong preference (Liberal Neutralists, Pluralists, Contractualists). Core motivation for neutrality.
      *   **Conflict Flag:** Arrow's Theorem implies aggregation *must* violate this (or other conditions) under ordinal preferences. Strict neutrality aims for this but risks paralysis.

  9.  **Procedural Fairness & Contestability (Voice & Recourse)**
      *   **Demand:** The theory should incorporate mechanisms for affected parties (or their representatives) to understand, challenge, and potentially revise decisions made in their name or affecting them, especially when they disagree with the outcome.
      *   **Motivation:** Legitimacy requires more than just "correct" outcomes; people need a sense of agency and recourse (e.g., appealing an AI-driven loan denial or social scoring penalty).
      *   **Status:** Preference (Liberal Egalitarians, Deliberative Democrats, Contractualists). Often secondary in Aggregationism or Neutrality focused solely on outcome.
      *   **Conflict Flag:** Resource-intensive; may conflict with Non-Paralysis under resource constraints. Pure outcome-focused theories neglect this.

  10. **Epistemic Feasibility (Limited Authority/Queries)**
      *   **Demand:** The theory must be implementable given the AI's inherent limitations: partial/incomplete information about values/preferences/interests, and limited capacity/authority to actively query individuals (due to scale, privacy, burden, or competence).
      *   **Motivation:** An AI cannot constantly survey 8 billion people + future beings + animals. It must act on models and proxies.
      *   **Status:** Strong preference (Pragmatists, all camps aware of constraints). Non-negotiable for *practical* adequacy.
      *   **Conflict Flag:** Pressures theories requiring perfect information (some idealized contractualism/aggregation). Neutrality struggles harder as lack of knowledge makes true neutrality impossible.

  11. **Dynamic Responsiveness (Value Learning & Change)**
      *   **Demand:** The theory should allow for, and guide, how the AI updates its understanding of values/preferences/interests over time as individuals and societies evolve, and as the AI's actions create new knowledge or change circumstances.
      *   **Motivation:** Values change; AI actions reveal new information; societies progress (or regress). A static theory is inadequate.
      *   **Status:** Preference (Adaptive Theorists, Pragmatists). Often underspecified.
      *   **Conflict Flag:** Creates instability; risks manipulation or feedback loops. Challenges theories relying on fixed social contracts or preference orderings.

  ### Pressure Test & Partisan Commitments Exposed

  *   **"Respect All Stated Preferences":** Often presented as foundational neutrality or anti-paternalism. **Pressure Test:** This is a *highly partisan* commitment of Strict Liberal Neutrality. It ignores the Preference/Value/Interest Gap (#7), fails the Non-Oppression Condition (#5) by validating adaptive preferences, and clashes with Accountability (#2) for non-verbal patients. Its work is to *avoid* making substantive judgments about the good, but this avoidance becomes a substantive (and problematic) judgment itself.
  *   **"Maximize Aggregate Welfare":** Presented as the core of utilitarianism/aggregationism. **Pressure Test:** This is the *defining* commitment of Aggregationism. It often deliberately ignores the Patient/Author distinction (#3 – conflating preference-satisfaction with well-being), struggles with the Interest/Permissibility distinction (#4 – justifying rights violations), fails Pluralism Tolerance (#8 – per Arrow), and catastrophically fails the Non-Oppression Condition (#5) by optimizing the preferences formed under oppression.
  *   **"No Moral Dismissal":** The requirement to include all sentient beings/patients (#2). **Pressure Test:** While seemingly neutral, strong versions are partisan commitments of Sentientism/Cosmopolitanism. They conflict with theories prioritizing *human* authors or specific communities (Communitarianism, some Contractualism). Its work is to expand the moral circle, which is a substantive ethical stance.

  ### Impossibility Flags & Inherent Tensions

  *   **Arrow's Impossibility Theorem:** Directly threatens the joint satisfaction of reasonable conditions for *preference aggregation* (Non-Dictatorship, Universal Domain, Pareto Efficiency, Independence of Irrelevant Alternatives). This implies **Pluralism Tolerance (#8)** is fundamentally incompatible with other seemingly desirable features of Aggregation under certain common assumptions. *Any* aggregation rule satisfying some basic conditions must violate others.
  *   **The Liberal Paradox (Sen):** Shows a conflict between minimal liberalism (individual rights over certain personal choices) and the weak Pareto principle (if everyone prefers X to Y, society should prefer X to Y). This highlights a fundamental tension between **Pluralism Tolerance/Anti-Hegemony (#8)** / individual sovereignty and **Procedural Fairness/Consensus (#9)** expressed via Pareto, posing a challenge for theories trying to strongly protect both individual domains and unanimous social preferences. Also relates to **Interest/Permissibility (#4)** distinction.

  ### Scoring the Poles & Key Exclusions

  *   **Preference Aggregation (Social Welfare Function):**
      *   **Strengths:** Clear(ish) Action Guidance (#1), Epistemic Feasibility via proxies (#10).
      *   **Fatal Weaknesses:** **Fails Non-Oppression Condition (#5)** most catastrophically (optimizes oppressive preferences). Also fails Pluralism Tolerance (#8 - Arrow), struggles with Patient/Author (#3) & Interest/Permissibility (#4) distinctions, and Accountability scope (#2 - non-humans/future).
      *   **Most Excluded By:** **#5 (Non-Oppression Condition)**. Its core mechanism is its Achilles heel in non-ideal societies.

  *   **Strict Liberal Neutrality (Minimal Imposition):**
      *   **Strengths:** Strong Pluralism Tolerance (#8), respects Patient/Author distinction (#3) by focusing on non-interference, strong on avoiding impermissible means (#4) in its domain.
      *   **Fatal Weaknesses:** **Fails Non-Paralysis Under Conflict (#1)** most fundamentally (cannot resolve value conflicts). Also fails Non-Oppression Condition (#5) by respecting harmful preferences, struggles with Accountability scope (#2) and the Preference/Value Gap (#7), and is highly vulnerable to Epistemic Feasibility (#10) challenges (true neutrality requires perfect knowledge).
      *   **Most Excluded By:** **#1 (Action Guidance)**. Its core commitment to non-imposition leads to paralysis when action affecting conflicting values is unavoidable.

  **Conclusion:** This desiderata framework reveals both poles as fundamentally inadequate. Aggregation fails morally by being blind to oppression and rights. Strict neutrality fails practically by being inert in the face of conflict and non-consensual impacts. An adequate theory must navigate between these poles, likely incorporating elements of contractualism (defining fair procedures for inclusion/authority), capability approaches (focusing on objective interests/functionings), or sophisticated pluralist weighting, while explicitly grappling with the identified tensions and impossibility results. The pressure test shows that seemingly neutral starting points often hide substantive commitments, particularly concerning oppression, patienthood, and the necessity of action under uncertainty.
