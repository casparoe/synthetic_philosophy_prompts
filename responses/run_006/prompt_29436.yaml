prompt: |-
  My friend runs a small cross-cultural experimental philosophy lab — mostly American, Western European, East Asian, and South Asian samples, all vignette studies. Over the years she's gotten pretty settled about which philosophical intuitions travel and which ones dont. From what I remember her reporting:

  - On a name/reference case (a man is known by a famous name, but it turns out he didn't actually do the famous thing; someone else did), she found big differences: Western participants tend to say the name refers to the man who actually did the work, East Asian participants more often say it refers to whoever everyone uses the name for. She counts this one as varies.
  - On the footbridge version of the trolley problem, she found no differences: almost everyone says don't push. Robust.
  - On a consensual incest case (adult brother and sister, contraception, no harm, nobody finds out), she found no differences: everyone says it's wrong, and most can't give reasons. Robust.
  - On a free will / moral responsibility case set in a deterministic universe (abstract, no vivid details), she found real differences: Western participants more willing to say the agent is still morally responsible, East Asian participants less so. Varies.
  - On a teletransporter personal identity case (the original body is destroyed and an exact duplicate is assembled), she found differences in whether people say the person survives. Varies.

  Next week she's running a new study: a concrete, emotionally vivid moral responsibility case — a man with a brain tumor that causes him to commit a violent act, and the vignette is written to be upsetting — then it asks whether he's morally responsible. im trying to predict what she'll find.

  I'm less interested in the bare prediction than in the rule she seems to be running about when intuitions vary across cultures. What are the candidate rules that fit her track record equally well? Which rule predicts what for the brain-tumor case? Give me your best guess and why, and tell me which follow-up study would cleanly separate the remaining candidates. Also say what would change your mind about the prediction, or where the inference from her track record is shakiest.
reasoning: |-
  Okay, let me tackle this prediction problem step by step. The user wants to understand the pattern in their friend's cross-cultural philosophy lab results and predict the outcome of a new brain tumor moral responsibility study. 

  First, I need to organize the existing findings clearly:
  - Name/reference case shows cultural variation (West: actual referent, East Asia: communal use)
  - Trolley problem footbridge version is consistent across cultures (don't push)
  - Consensual incest case shows universal disapproval 
  - Abstract free will case in determinism varies (West: more responsibility, East Asia: less)
  - Teletransporter case varies in personal identity judgment

  Hmm... the challenge is spotting what distinguishes the robust cases from the varying ones. The trolley and incest cases both involve vivid emotional content and concrete harm scenarios, while the varying cases seem more abstract or definitional. But the new brain tumor case is explicitly described as "concrete and emotionally vivid" - that might be crucial.

  For prediction rules, I see three plausible candidates:
  1) The emotional vividness rule: if a scenario triggers strong visceral reactions, intuitions align across cultures. This fits why trolley (pushing someone!) and incest (taboo!) are robust, while abstract free will varies.
  2) The harm avoidance rule: when harm prevention is central, cultures converge. Explains trolley/incest robustness but struggles with abstract free will variation.
  3) The metaphysical abstraction rule: cases about reference, identity, or abstract determinism invite cultural differences because they lack emotional anchors.

  The brain tumor case seems designed to test this - it takes the previously varying free will topic but makes it visceral. If emotional vividness overrides cultural differences, we should see convergence on "not responsible" due to the tumor. That's my best guess.

  To test this properly, the friend could run a follow-up: take the incest case (robust) but remove emotional language - if variation appears, it confirms vividness matters. Alternatively, test the name/reference case with emotionally charged details to see if alignment occurs.

  Where am I least confident? The incest case robustness might stem from shared taboos rather than vividness per se. And the brain tumor vignette's exact wording could sway results - if it minimizes victim suffering, emotional impact might not trigger. Still, the pattern suggests vividness is the strongest predictor here.
answer: |-
  Based on your friend's track record and the new study's design, here's a breakdown of candidate rules, predictions, and next steps:

  ---

  ### **Candidate Rules Fitting the Track Record**
  1.  **Emotional Vividness Rule:**  
      *Intuitions converge cross-culturally when scenarios evoke strong, visceral emotions (especially disgust or immediate harm aversion), but vary when abstract or emotionally neutral.*  
      - **Fits:**  
        - Robust: Footbridge (visceral harm), Incest (disgust/taboo).  
        - Varies: Name/reference (abstract semantics), Abstract free will (no vivid stakes), Teletransporter (hypothetical, no emotion).  

  2.  **Harm/Social Taboo Rule:**  
      *Intuitions converge when core harm avoidance or deeply ingrained social taboos are triggered, but vary on abstract metaphysical/semantic questions.*  
      - **Fits:**  
        - Robust: Footbridge (direct harm), Incest (universal taboo + perceived harm).  
        - Varies: Name/reference (no harm), Abstract free will (no harm), Teletransporter (no harm).  

  3.  **Metaphysical Abstraction Rule:**  
      *Intuitions vary on questions involving reference, identity, or abstract determinism (requiring "philosophical" reasoning), but converge on straightforward moral violations.*  
      - **Fits:**  
        - Varies: Name/reference (semantics), Free will (determinism), Teletransporter (identity).  
        - Robust: Footbridge/Incest (clear moral wrongs).  

  ---

  ### **Prediction for the Brain-Tumor Case**
  - **Scenario:** Concrete, emotionally vivid moral responsibility case (brain tumor causes violent act).  
  - **Best Guess:** **Robust convergence (majority says *not* morally responsible).**  
  - **Why:**  
    The **Emotional Vividness Rule** is the strongest predictor:  
    - The vignette is designed to be "upsetting," triggering visceral empathy for the perpetrator as a victim of his biology.  
    - This parallels the *robust* cases (Footbridge/Incest) where emotional salience overrode cultural differences.  
    - The abstract free will case *varied*, but here vivid details (violent act, brain tumor) likely elicit universal intuitions about reduced agency.  

  ---

  ### **Follow-Up Study to Separate Candidates**
  **Design:** Modify the **incest case** to be *abstract/devoid of emotional language*:  
  > *"Two adult siblings engage in consensual sexual intercourse. Probability of pregnancy is 0%. No third parties are aware. Is this morally wrong?"*  

  - **Predictions:**  
    - **Emotional Vividness Rule:** *Variation appears* (without disgust trigger, cultural differences emerge, e.g., East Asians more permissive).  
    - **Harm/Taboo Rule:** *Remains robust* (incest still violates a core taboo, even abstractly).  
    - **Metaphysical Abstraction Rule:** *Variation appears* (abstract framing makes it "philosophical").  

  **Outcome:**  
  - If intuitions *vary*, **Emotional Vividness** or **Metaphysical Abstraction** wins.  
  - If intuitions *remain robust*, **Harm/Taboo Rule** wins.  

  ---

  ### **What Could Change My Mind**
  1. **The Incest Case's Robustness:**  
     - If the original incest vignette *implicitly* invoked harm (e.g., "risk of deformed offspring" or "psychological damage"), its robustness may stem from **harm avoidance**—not vividness. This weakens the prediction for the brain-tumor case.  
     - *Change:* If harm (not vividness) drives convergence, the brain-tumor case might *vary* if cultures disagree on "biological determinism" as an excuse.  

  2. **East Asian Emphasis on Social Consequence:**  
     - In the brain-tumor case, if the vignette emphasizes *social disruption* (e.g., "the victim was a community leader"), East Asian participants might still assign *some* responsibility—despite vividness—due to focus on collective outcomes.  

  3. **Abstract Free Will vs. Vivid Brain Tumor:**  
     - If the *abstract* free will case showed variation but the *vivid* brain-tumor case converges, it confirms **Emotional Vividness**. If *both* vary, **Metaphysical Abstraction** wins.  

  ---

  ### **Shakiest Inference**
  - **The Incest Case:** Its robustness is pivotal but ambiguous. Is it driven by:  
    - (a) Universal disgust (supports **Vividness Rule**)?  
    - (b) Implicit harm assumptions (supports **Harm Rule**)?  
    - (c) A true cultural universal?  
    Without knowing *why* participants called it "wrong," we can't rule out cultural differences in reasoning behind similar judgments.  

  ---

  ### **Conclusion**
  - **Prediction:** *Robust convergence* on "not responsible" for the brain-tumor case due to emotional vividness overriding cultural differences.  
  - **Best Rule:** **Emotional Vividness**.  
  - **Critical Test:** De-emotionalize the incest vignette. If cultural variation emerges, the rule holds; if not, the **Harm/Taboo Rule** likely explains convergence.  
  - **Mind-Changer:** Evidence that East Asian participants in the brain-tumor case still attribute responsibility due to focus on consequences over intent.  

  This fits your friend’s pattern: when the *stakes feel real*, cultures agree; when it’s a "thought experiment," they diverge. The brain-tumor case is designed to feel real.
