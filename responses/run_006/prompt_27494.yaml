answer: |-
  Here is a comprehensive list of desiderata for an adequate theory of cognitive penetration (CP), structured around your specified concerns and expanded to cover the core philosophical and empirical constraints. Each desideratum includes its rationale, necessity status, and key considerations for theory viability:

  ---

  ### **Core Desiderata for a Theory of Cognitive Penetration**

  1. **Distinguish Genuine Penetration from Attentional/Post-Perceptual Effects**  
     - **Why it matters**: Cases like *attention-driven changes* (e.g., focusing on red objects makes them more salient) or *judgment biases* (e.g., interpreting ambiguous stimuli as threats) mimic CP but lack perceptual *phenomenology* alteration. Failing this distinction conflates perception with cognition.  
     - **Key case**: In the "hollow face illusion" (where knowledge of faces overrides 3D perception), a theory must show whether the illusion alters *visual experience itself* or only post-perceptual belief.  
     - **Non-negotiable**: Yes. Without this, CP loses its defining claim (top-down *perceptual experience* modulation).  
     - **Empirical constraint**: Requires methodologies isolating phenomenology (e.g., binocular rivalry, priming tasks).

  2. **Satisfy the Structural Constraint (El Greco Fallacy Avoidance)**  
     - **Why it matters**: If a cognitive state (e.g., fear) distorts perception (e.g., making spiders look larger), the distortion must *not* apply recursively to the cognitive state's *own* input (e.g., fear itself cannot depend on perceiving larger spiders).  
     - **Key case**: A theory claiming "sadness makes the world look grayer" must explain why sad subjects don’t perceive *their own tears* as grayer, undermining the sadness.  
     - **Non-negotiable**: Yes. Violating this implies incoherent feedback loops.  
     - **Theoretical implication**: Demands asymmetric mechanisms (e.g., penetration only affects *input* processing, not self-monitoring).

  3. **Accommodate Penetration by Conative/Evaluative States**  
     - **Why it matters**: Empirical cases suggest desires/fears alter perception (e.g., desirable objects appear closer; fearful stimuli look larger). Excluding these narrows CP artificially.  
     - **Key case**: Balcetis & Dunning (2010) – participants who *wanted* a drink (water = reward) perceived it as closer.  
     - **Non-negotiable**: Preference (debated). Pro-CP theories must include conative states; skeptics exclude them as "attention-only."  
     - **Mechanism unity**: Need not be identical to doxastic states (e.g., beliefs may act via predictive coding; desires via reward-signaling pathways).

  4. **Specify the Locus of Penetration**  
     - **Why it matters**: Different loci imply distinct computational mechanisms and epistemic consequences.  
     - **Key loci**:  
       - *Early vision* (e.g., V1/V2 modulation) → threatens modularity.  
       - *Late vision* (e.g., amodal completion) → may be "cognitive."  
       - *Multisensory integration* (e.g., ventriloquism effect) → blurs perception/cognition boundary.  
     - **Non-negotiable**: Yes. A theory must commit to *where* penetration occurs to be testable.  
     - **What turns on it**: Early penetration challenges Fodorian modularity; late penetration may reduce to belief updating.

  5. **Address Epistemic Consequences**  
     - **Why it matters**: If cognition alters perception, perception may lose its justification role (e.g., "see-ing" hostile faces due to prejudice).  
     - **Demands**:  
       - Explain *when* CP preserves justification (e.g., expert perception).  
       - Clarify if penetration introduces *epistemic circularity*.  
     - **Non-negotiable**: Preference (theory can remain neutral). Pro-CP theories often minimize epistemic threat; skeptics amplify it.  
     - **Key constraint**: Must align with accounts of perceptual warrant (e.g., reliabilism vs. phenomenal conservatism).

  ---

  ### **Additional Critical Desiderata**

  6. **Handle Asymmetry in Penetration**  
     - **Why**: Penetration may occur in some domains (e.g., color) but not others (e.g., geometry).  
     - **Case**: Culture-specific perception (e.g., the Himba color categories) vs. universal shape perception.  
     - **Non-negotiable**: Yes. A theory must predict/explain domain constraints.

  7. **Respect Temporal Dynamics**  
     - **Why**: Fast effects (e.g., emotion-induced brightness changes) suggest low-level penetration; slow effects (e.g., belief-driven perceptual learning) may be post-perceptual.  
     - **Empirical constraint**: EEG/fMRI timing data (e.g., <150ms effects support early penetration).

  8. **Account for Individual Differences**  
     - **Why**: CP may vary with traits (e.g., anxiety amplifies threat perception).  
     - **Case**: Clinical populations (e.g., depression altering color saturation perception).  
     - **Non-negotiable**: Preference (enhances explanatory scope).

  ---

  ### **Tensions and Trade-offs**
  - **Desideratum 2 vs. Testability**: Strict adherence to the structural constraint may render CP empirically elusive (e.g., if all putative cases are reclassified as attention shifts).  
  - **Desideratum 1 vs. Desideratum 4**: Isolating phenomenology (Desideratum 1) requires precise locus specification (Desideratum 4), but current neuroimaging lacks resolution to definitively localize "experience."  
  - **Desideratum 3 vs. Mechanism Unity**: If conative/doxastic states use different pathways, CP becomes fragmented, weakening it as a *unified* phenomenon.

  ---

  ### **The Most Constraining Desideratum**
  **Desideratum 2 (Structural Constraint)** does the heaviest lifting in narrowing viable theories:  
  - **Why**: It forces theories to avoid self-defeating explanations. For example, a predictive coding model must ensure that prediction errors aren’t recursively distorted by the very predictions they generate. This eliminates "global" penetration theories and favors architectures with encapsulated subsystems (e.g., early vision immune to high-level feedback).  
  - **Impact**: Satisfying this while accommodating empirical cases (e.g., mood-color effects) pushes theories toward hybrid architectures (e.g., "weak modularity"), where only *specific* cognitive-perceptual interfaces allow penetration.

  ---

  ### **Conclusion**
  An adequate theory must:  
  1. Define penetration as *phenomenological* (not just attentional/judgmental),  
  2. Avoid the El Greco fallacy via asymmetric mechanisms,  
  3. Specify penetrative loci to generate testable predictions,  
  4. Address conative states (even if mechanism differs),  
  5. Engage epistemic consequences (even if neutrally).  

  **The core tension**: Balancing the structural constraint (to ensure coherence) with empirical evidence (which often blurs perception/cognition boundaries). Theories failing Desideratum 2 are incoherent; those failing Desideratum 1 lose the phenomenon entirely. The most viable path may be a *modular-but-interfaceable* architecture, where cognition penetrates only late vision via evolutionary-primed pathways (e.g., threat detection).
