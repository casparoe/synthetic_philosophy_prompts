  The a priori point is subtle. Two-dimensionalism links primary intension to a priori knowability, but Frege's senses were the very medium of thought. He'd likely reject that any function could replace the first-person grasp of sense. 

  *pondering* The user seems to suspect 2D semantics is more rival than ally. I agree. The deepest fracture is epistemology: for Frege, sense explains rationality itself, while intensions are truth-conditional tools. 

