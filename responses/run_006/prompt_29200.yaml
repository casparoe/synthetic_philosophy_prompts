  The Hesperus/Phosphorus case is telling. Two-dimensionalism gives it a necessary secondary intension but nontrivial primary intension. That looks like it mirrors Frege's solution! But wait - the primary intension is still about truth across scenarios, whereas for Frege the difference is in the subjective cognitive route to the referent. 

  *scribbles mental note*: Frege might say "You've modeled the symptom (different truth conditions under ignorance) but not the disease (the actual mental content difference)." 

  Where would he push hardest? Proper names jump out. Kripke already challenged descriptivism, but 2D semantics tries to salvage descriptivist intuitions via primary intensions. Frege might actually dislike this! His senses for names were individuated at the cognitive level, not by epistemic possibilities. 

