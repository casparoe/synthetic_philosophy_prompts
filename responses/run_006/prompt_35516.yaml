prompt: |-
  I run an intelligence analysis unit in a government agency. My analysts produce assessments on geopolitical and security questions, and every assessment goes through internal review before dissemination. A persistent problem: reviewers sometimes challenge an assessment not because the evidence is weak or the reasoning is flawed, but because the conclusion, if accepted, would have undesirable consequences — it might embolden an adversary, alarm allies, constrain policymakers, or be politically weaponised. I am told that philosophers have analysed exactly this kind of distinction under the label "the wrong kind of reasons problem": roughly, the difference between reasons that bear on whether an attitude (here, a belief) is correct, and reasons that bear on whether it would be good to have that attitude. I need a decision procedure my review team can apply to classify a given objection to an assessment as a reason of the right kind (bearing on the truth of the assessment or the quality of the evidence and reasoning supporting it) or a reason of the wrong kind (bearing on the desirability of accepting or disseminating the assessment). The procedure must be a checklist or sequence of tests that reviewers with no philosophy background can apply in under ten minutes. It should handle cases where the distinction blurs, and it should explicitly flag where the procedure cannot settle the matter and an editor or senior analyst must decide. Then apply the procedure to these three objections:

  1. "If we assess that the rebel faction controls significant territory in the north, foreign governments will cite our assessment as a pretext for military intervention."
  2. "The analyst's primary source for the claim about weapons stockpiles has recanted their earlier testimony and has a documented history of fabrication."
  3. "The assessment uses the phrase 'cannot be ruled out' for a low-probability event; this wording will be read by non-expert readers as implying the event is likely, and the resulting public alarm will itself cause diplomatic damage."
reasoning: |-
  Okay, the user runs an intelligence analysis unit and faces a recurring issue where reviewers challenge assessments based on the consequences of the conclusions rather than the validity of the evidence or reasoning. They've heard about the philosophical concept of "the wrong kind of reasons" problem, which distinguishes between reasons related to the truth of a belief and those related to the desirability of holding that belief. 

  The user needs a practical decision procedure—a checklist or sequence of tests—that reviewers without a philosophy background can apply quickly, ideally under ten minutes. This procedure must handle ambiguous cases and explicitly flag when a senior decision is needed. They also provided three example objections to test the procedure.

  First, I need to recall the philosophical distinction clearly. "Right kind" reasons are epistemic: they concern evidence, logic, and truth. "Wrong kind" reasons are pragmatic: they concern consequences, desirability, or strategic impact. The challenge is operationalizing this abstract idea into concrete questions.

  The user's deeper needs are likely about maintaining analytical integrity while navigating real-world pressures. They want to prevent intelligence assessments from being distorted by policy preferences or fear of reactions, which could undermine credibility. There's also an unstated need for institutional buy-in—the tool must feel practical, not academic, to gain reviewer adoption.

  For the decision procedure, I consider a three-step flow: First, isolate the objection's target—is it about the assessment's content or its effects? Second, ask the "truth-tracking" question: could this issue be resolved by better evidence or analysis? Third, handle ambiguity by checking if the objection mixes truth and consequences, then flagging for senior review if unclear.

  For the examples: 
  - Objection 1 focuses on how others might misuse the assessment. That's purely about consequences, so "wrong kind." 
  - Objection 2 challenges source reliability, which is core to evidence validation—clearly "right kind." 
  - Objection 3 is tricky because it involves both presentation (which affects truth interpretation) and consequences. The procedure should flag this as ambiguous since wording choices straddle epistemic and practical concerns.

  I make sure the final output avoids philosophy jargon, uses plain language like "truth-focused" vs. "consequence-focused," and includes an "escalate" step for murky cases. The ten-minute constraint means no open-ended reflection—just yes/no questions leading to clear bins.
answer: |-
  Here's a practical decision procedure ("The Assessment Integrity Filter") for your review team, designed for speed and clarity without requiring philosophy expertise:

  **The Assessment Integrity Filter (AIF) - Decision Procedure**

  1.  **Identify the Objection's Core Concern:**
      *   *Question:* "What specific problem does the reviewer raise? Is it primarily about..."
      *   *Check A:* **...whether the assessment is likely TRUE or FALSE?** (e.g., evidence is weak, source is unreliable, logic is flawed, alternative explanations exist)
      *   *Check B:* **...what will HAPPEN if this assessment is believed or disseminated?** (e.g., adversaries/alliess react badly, policymakers are constrained, public panics, political fallout)
      *   *IF Check A is clearly the primary concern -> Proceed to Step 2.*
      *   *IF Check B is clearly the primary concern -> Flag as **"Likely Wrong Kind"**.*
      *   *IF Check A & B are tightly intertwined or equally emphasized -> Flag as **"Ambiguous - Escalate"**.*

  2.  **The "Truth-Tracking" Test:**
      *   *Question:* "Could this objection be resolved *solely* by getting better evidence, more rigorous analysis, or clearer reasoning *about the specific claim being assessed*? (Ignore potential consequences.)"
      *   *IF YES -> Flag as **"Likely Right Kind"**.*
      *   *IF NO (resolving it requires changing the facts of the world *outside* the assessment, or predicting reactions) -> Flag as **"Likely Wrong Kind"**.*
      *   *IF UNCERTAIN if resolution depends ONLY on truth-tracking -> Flag as **"Ambiguous - Escalate"**.*

  3.  **The "Dissemination Mitigation" Check (For Likely Wrong Kind):**
      *   *Question:* "Does the objection point to a problem that could be solved by changing *how* the assessment is presented/disseminated (e.g., classification level, wording, caveats, audience) *without altering the core factual conclusion*?"
      *   *IF YES -> Confirms **"Wrong Kind"** (concern is about consequences of dissemination, not the truth itself).*
      *   *IF NO (the only 'solution' is changing the core conclusion) -> Confirms **"Wrong Kind"** (concern is about consequences of the belief itself).*
      *   *(This step clarifies the nature of the "Wrong Kind" reason but doesn't change the classification).*

  4.  **The "Blurred Line" Flag:**
      *   *Question:* "Does the objection involve how the *presentation* (wording, framing, certainty level) of a *true* assessment might *mislead* readers into believing something inaccurate?"
      *   *IF YES -> Flag as **"Ambiguous - Escalate"**. (This mixes truth-tracking (avoiding misunderstanding) with consequence-avoidance (preventing negative reactions to the misunderstanding)).*
      *   *Also apply the **"Ambiguous - Escalate"** flag from Steps 1 & 2.*

  **Procedure Summary:**

  1.  **Core Concern?** (A=Truth? B=Consequence? Mix?) -> A: Go to 2 / B: **Wrong Kind** / Mix: **Ambiguous**
  2.  **Truth-Tracking Test?** (Resolve by better evidence/analysis *only*?) -> Yes: **Right Kind** / No: **Wrong Kind** / Unclear: **Ambiguous**
  3.  **(For Wrong Kind): Dissemination Fix?** (Change presentation, not conclusion?) -> Confirms **Wrong Kind** either way.
  4.  **Blurred Line?** (Misleading presentation of true fact?) -> Yes: **Ambiguous**

  ---

  **Application to Objections:**

  1.  **"If we assess that the rebel faction controls significant territory in the north, foreign governments will cite our assessment as a pretext for military intervention."**
      *   **Step 1:** Core Concern? Clearly **B (Consequence)** - Focuses on how others *might use* the assessment (military intervention pretext).
      *   **Step 2:** Truth-Tracking Test? Could better evidence change this? **No**. Getting perfect proof the rebels control the territory *doesn't change* the risk that foreign governments might use it as a pretext. The objection is about a *reaction*, not the *truth*.
      *   **Classification: LIKELY WRONG KIND** (Consequence-focused, not truth-tracking).

  2.  **"The analyst's primary source for the claim about weapons stockpiles has recanted their earlier testimony and has a documented history of fabrication."**
      *   **Step 1:** Core Concern? Clearly **A (Truth)** - Directly challenges the reliability of the evidence supporting the claim.
      *   **Step 2:** Truth-Tracking Test? Could this be resolved by better evidence/analysis? **Absolutely Yes**. Finding corroborating sources, assessing the recantation's credibility, evaluating the source's history – all directly bear on whether the claim about weapons stockpiles is *true*.
      *   **Classification: LIKELY RIGHT KIND** (Directly challenges evidence quality and thus truth).

  3.  **"The assessment uses the phrase 'cannot be ruled out' for a low-probability event; this wording will be read by non-expert readers as implying the event is likely, and the resulting public alarm will itself cause diplomatic damage."**
      *   **Step 1:** Core Concern? **Mix (A & B)**. It criticizes the *wording* (potentially affecting accurate understanding - A) *because* it will cause alarm and diplomatic damage (B).
      *   **Step 2:** Truth-Tracking Test? Partially. Better reasoning/analysis *could* choose phrasing that more accurately conveys the low probability (truth-tracking). However, the core objection is that the *consequences* of the *misinterpretation* (not necessarily the core truth) are bad. Resolving the objection perfectly would require ensuring the audience *understands correctly* (truth-tracking) *to avoid consequences* (consequence-avoidance).
      *   **Step 4 (Blurred Line Flag):** **YES**. The objection is that the *presentation* of a *true* assessment (the event is possible, however unlikely) might *mislead* non-experts into believing something *inaccurate* (that it's likely), *and* that this misunderstanding causes damage.
      *   **Classification: AMBIGUOUS - ESCALATE** (Tangled mix of epistemic concern about accurate communication/understanding and pragmatic concern about negative reactions to the likely misunderstanding). *Requires editorial/senior judgment: Does the phrasing genuinely misrepresent the probability assessment (Right Kind concern)? Or is the phrasing technically accurate, but the objection is primarily about managing public reaction to a true but alarming possibility (Wrong Kind concern)?*

  This procedure provides a clear, rapid framework for your reviewers. It explicitly flags ambiguous cases requiring senior input, protecting analytical integrity while acknowledging the real-world complexities of intelligence dissemination.
