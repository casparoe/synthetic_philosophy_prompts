  Next, the evaluative shift. Here, the focus moves from metaphysical possibility to what's valuable in agency. This is substantive and defensible, shifting the debate's focus. However, it doesn't resolve the incompatibilist's worry about determinism's threat to free will; it just changes the subject.

  Then, the compatibilist presumption. This assumes compatibilism is true and valuable, dismissing libertarian free will as unnecessary. This is substantive but question-begging against incompatibilists. It directly challenges them by claiming their desired free will isn't needed.

  The error theory is more revisionary, arguing that incompatibilists are mistaken in wanting libertarian free will. This is substantive and defensible if one accepts the arguments against libertarianism. It targets the incompatibilist's desire directly.

  The semantic dissolution claim is even stronger, suggesting the compatibility question is meaningless once we specify the valuable free will. This is highly revisionary and controversial, potentially dismissing the traditional debate entirely.

  Finally, the pragmatic elimination claim rejects the incompatibilist's ability to do otherwise as incoherent. This is the most revisionary, denying the very concept they worry about. It's defensible only if one accepts hard determinism or illusionism.

  Now, which readings actually challenge incompatibilism? The evaluative shift doesn't, as it sidesteps the metaphysical issue. The taxonomic claim also leaves it untouched. The compatibilist presumption, error theory, semantic dissolution, and pragmatic elimination directly challenge incompatibilism by either redefining free will, devaluing their concerns, or denying the coherence of their key concepts.

