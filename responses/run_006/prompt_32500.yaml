  ### Structured Activity: The Commitment Race Game

  #### **Objective**: 
  Participants experience the strategic tension of a commitment race through gameplay, feeling the pressure to preempt, the temptation to escalate, and the risk of mutual disaster. Debriefing connects gameplay to formal concepts (first-mover advantage, cost of delay, simultaneous commitment risk).

  ---

  ### **Game Design**  
  **Core Mechanics**:  
  - **Players**: Pairs of 2 (from a group of 12, forming 6 pairs).  
  - **Rounds**: 5 rounds per game (each round represents a time window to commit).  
  - **Actions per Round**: Simultaneously choose **COMMIT** or **WAIT**.  
  - **Game End**: When both commit, one commits (and the other waits), or round 5 ends.  

  **Payoff Structure (Points)**:  
  | Scenario                                  | Player A | Player B |  
  |-------------------------------------------|----------|----------|  
  | **One commits, other waits**              | 10       | 0        |  
  | **Both wait until round 5 ends**          | 3        | 3        |  
  | **Both commit in the same round**         | -10      | -10      |  
  | **One waits, other commits (asymmetric)** | 0        | 10       |  

  **Rationale**:  
  - **First-mover advantage**: 10 points for solo commitment.  
  - **Cost of delay**: Waiting risks preemption (0 points) or diminishing returns (3 points if no commitment).  
  - **Mutual disaster**: -10 for simultaneous commitment.  
  - **Escalation temptation**: Waiting invites rivals to seize the advantage.  

  ---

  ### **Materials**  
  - **Per Pair**:  
    - 2 Commitment Cards (one labeled "COMMIT", one "WAIT") for each player.  
    - Scorecard to track choices/outcomes (see template below).  
  - **Timer** (for rounds).  
  - **Whiteboard** to aggregate results.  

  **Scorecard Template**:  
  | Round | Player A Choice | Player B Choice | A Points | B Points |  
  |-------|-----------------|-----------------|----------|----------|  
  | 1     |                 |                 |          |          |  
  | 2     |                 |                 |          |          |  
  | ...   |                 |                 |          |          |  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Setup (5 min)**:  
     - Assign pairs, distribute materials.  
     - **Rules Briefing (no theory!)**:
       - *"You’ll play 3 games. Each game has 5 rounds. Each round, secretly choose COMMIT or WAIT. Reveal simultaneously. Goal: Maximize your points. No talking during gameplay."*  
       - Show payoff scenarios (visual aid).  

  2. **Gameplay (30 min)**:  
     - **3 iterations** (reset after each game).  
     - **Round Flow**:  
       - Facilitator: “Decide now!” (15 sec to choose card).  
       - “Reveal!” (simultaneous reveal).  
       - Record outcomes; continue if both wait.  
     - **Round 5**: If both wait, game ends (both score 3).  

  3. **Data Aggregation (5 min)**:  
     - Pairs report outcomes on whiteboard (e.g., "Game 1: Mutual disaster in Round 2").  

  4. **Debrief (45 min)**:  
     - **Experience Sharing (15 min)**:  
       - *"When did you feel pressured to commit? Why?"*  
       - *"Did you ever wait hoping to commit later? What happened?"*  
     - **Concept Mapping (30 min)**:  
       - **First-mover advantage**: *"In game 2, Sarah committed early and got 10. Why didn’t you do the same?* → Link to payoff asymmetry.  
       - **Cost of delay**: *"Those who waited until round 5 only got 3. What risks did you weigh?"* → Highlight opportunity cost of inaction.  
       - **Simultaneous commitment**: *"Why did 3 pairs have mutual disaster in round 1?"* → Coordination failure mirrors real races (e.g., cold war brinkmanship).  
       - **Vs. ordinary bargaining**: *"Could you negotiate? No—commitment ended the game. Real races make reversals impossible."*  

  5. **Limitations & Conclusions (5 min)**:  
     - **Unsimulated Feature**: Commitment is often **costly to reverse** in reality (e.g., burning bridges). The game treats it as costless.  
     - **Final Insight**: *"Races force you to act fast, but acting fast can trap everyone."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Pairs collude to both wait until round 5 (safe 3 points).  
     - **Fix**: Emphasize competition (*"Maximize your **own** points"*) and prohibit communication.  

  2. **Problem**: Players dismiss mutual disaster as unlikely.  
     - **Fix**: After first game, show data (e.g., 40% of pairs had mutual disaster). Ask: *"Why did you risk it?"*  

  3. **Problem**: Confusion over simultaneous reveals.  
     - **Fix**: Demo a round with two facilitators.  

  ---

  ### **Critical Vulnerability: Why It Might Mislead**  
  **Strongest Criticism**:  
  The game **oversimplifies commitment as instantaneous**, ignoring real-world **gradual investments** (e.g., building missiles, public promises). Players might infer that commitment is a single move, not a resource-intensive process where costs escalate over time. This could obscure why races are often accidental (e.g., both parties escalate incrementally).  

  **Revision to Address This**:  
  - **Add Investment Rounds**:  
    - Before committing, players must spend 1-2 rounds "building resources" (e.g., playing an INVEST card costing 2 points).  
    - **Payoff tweak**: Solo commitment now requires successful investment *and* commitment.  
    - **Why**: Simulates sunk costs and races as gradual escalations.  
  - **Result**: Players experience how early investments create momentum toward disaster, even if no one "intended" to commit.  

  ---

  ### **Facilitator Notes**  
  - **Key Insight**: The game’s tension comes from **time pressure and irreversibility**. Debrief moments where players felt "forced" to act.  
  - **Quote for Debrief**: *"You raced to lock in gains, but the finish line was a trap."*  
  - **Takeaway**: Commitment races are **time-sensitive prisoner’s dilemmas**—individual incentives clash with collective safety.
