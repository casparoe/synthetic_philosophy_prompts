prompt: |-
  I'm a PhD student in computational physics — most of my work is writing simulations of complex systems, so I think in terms of code, initial conditions, time-stepping, compression, that kind of thing. A philosopher friend has been going on about the debate between Humeans and anti-Humeans about laws of nature and I want to understand whether theyre actually disagreeing about something or just using different words.

  Here's what I want: restate BOTH positions in the vocabulary I use every day. By "my vocabulary" I mean: think of a physical system as a simulation. There's some state at t=0, and there's whatever generates the trajectory — could be a step function you iterate, a Hamiltonian you integrate, whatever. Now, the Humean (as I understand it) says the laws are just the best summary of the trajectory — a compressed description, lossy or lossless, of what actually happens. The anti-Humean says no, the laws are more like the source code: they're what *produces* the trajectory, and you'd need them even if you already had the full output in front of you.

  But I suspect that's too crude. Give me the faithful translation, not the cartoon version. Then do the residue report: what in each position has NO counterpart in my vocabulary, what had to be distorted to fit, and — this is what I really want — whether the untranslatable bits are things my vocabulary *should* be able to say but can't (i.e., I'm missing something) or things that only looked like claims because the philosophers were talking sloppily.

  Hard limit: 800 words. And please push back if I've framed the whole exercise wrong — if, say, the compression/source-code distinction I'm leaning on already begs the question against one side, tell me that upfront and restart.
