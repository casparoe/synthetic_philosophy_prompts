prompt: |-
  Im a programming languages person — I write compilers and interpreters, and I think in terms of evaluation contexts, continuation-passing style, effects versus pure terms, quote and eval, elaboration, and that kind of thing. I have almost no formal philosophy background, but I keep hearing about the Frege–Geach problem for expressivism described as the embedding problem. My guess is that its basically the problem of giving a compositional semantics to effectful or command-like expressions when they appear in positions where they arent actually executed — like a term of type IO a showing up inside a conditional, or a state update you want to talk about without running. Restate the Frege–Geach problem in the vocabulary I actually use — evaluation contexts, CPS, terms vs commands, quotation/elaboration, monads or effect handlers, whichever fits best — as faithfully as you can, without smuggling in the assumption that moral sentences denote truth values. Then give me the residue report: which parts of the problem translate cleanly, which parts you had to fudge to fit, and which parts have no counterpart in my vocabulary at all. In particular: does the problem that "not (lying is wrong)" poses for an expressivist come out as the familiar issue that you cant negate a state update the way you negate a boolean, or is something lost in that translation? Where does modus ponens go — is it substitution, normalization, or something else? And is the Frege–Geach problem just the embedding problem for effectful languages, or is there a residue about the logic of attitudes, disagreement, and inference that my vocabulary drops on the floor? Please write the answer in American English.
reasoning: |-
  We are going to translate the Frege-Geach problem into the vocabulary of programming languages, especially effectful computations and compositional semantics.

  First, let's set up the expressivist background: Expressivism in metaethics holds that moral sentences (like "lying is wrong") do not primarily describe facts (i.e., they are not truth-apt) but instead express non-cognitive attitudes such as disapproval. So, the meaning of "lying is wrong" is not a truth value but (say) a command or an expression of an attitude.

  The Frege-Geach problem (or embedding problem) is that moral sentences can appear in complex linguistic contexts, such as conditionals, negations, and modus ponens inferences, and in these contexts they seem to behave just like truth-apt sentences. For example:

  1. Negation: "Lying is not wrong."
  2. Conditional: "If lying is wrong, then getting one's little brother to lie is also wrong."
  3. Modus Ponens: From the above conditional and "lying is wrong", we can conclude "getting one's little brother to lie is wrong".

  The challenge for expressivism is to explain the meaning of these embeddings in a way that preserves the expressivist thesis and also accounts for the logical relations.

  Now, let's recast this in programming language terms.

  **Core Idea:**
  - We can think of moral sentences (like "lying is wrong") as expressions that have an *effect* (e.g., expressing disapproval) rather than denoting a value. So they are of a type that is effectful, perhaps a command (in the sense of having type `IO ()` in Haskell) or more generally a computation that produces an effect and returns nothing (or a trivial value).

  **The Embedding Problem:**
  The problem arises when such an effectful expression is embedded in a context where we don't execute the effect. For example:

  - In a negation: `not (lying is wrong)`
  - In a conditional: `if (lying is wrong) then ...`

  In these contexts, we are not expressing disapproval of lying. Instead, we are building a more complex expression that might express disapproval conditionally or express a different attitude.

  **Translation using Effectful Languages and Compositional Semantics:**

  1. **Compositionality:** We require a compositional semantics for the language. The meaning of a complex expression should be built from the meanings of its parts.

  2. **Expressions vs. Commands:** We can model moral sentences as commands (or effectful computations) that, when executed, perform the act of expressing an attitude. However, in embedded contexts (like inside a conditional), we don't execute them. So we need a way to represent the "content" that can be embedded.

     - One approach is to use a *quotation* mechanism. We can think of the embedded occurrence of "lying is wrong" as being quoted (or in a thunk) so that it becomes a value representing the command. Then the conditional or negation can operate on that value.

     - Alternatively, we can use a monad or an effect handler to separate the description of the effect from its execution. Then, the embedded occurrence is just a value of type `M Attitude` (for some monad `M` and some type `Attitude` representing the attitude) and the conditional and negation are operations in the monad.

  3. **Negation:** Consider `not (lying is wrong)`. If "lying is wrong" is a command (type `IO ()`), then we cannot negate it because `not` expects a boolean. So we must have a way to turn the command into a truth-apt value. The expressivist might say that in embedded contexts, the moral sentence does not express the attitude but denotes a proposition (like the proposition that the speaker disapproves of lying). But then we lose expressivism because now the sentence is truth-apt.

     - In our terms: We need to *reify* the effect. We might use a monad that allows us to build a representation of the expression without executing it. Then, negation becomes a function on these representations.

  4. **Conditionals and Modus Ponens:**

     - The conditional: `if (lying is wrong) then (getting one's brother to lie is wrong)`. Here, both the antecedent and the consequent are moral sentences. The expressivist must explain what attitude the whole conditional expresses. It's not just the attitude of disapproval toward lying, because that would be the wrong effect for a conditional.

     - In programming terms: We want to build a new command that conditionally executes two other commands. We might write:

          ifM :: IO Bool -> IO a -> IO a -> IO a

       but note: our moral sentences aren't returning a boolean. They are of type `IO ()`. So we must have a way to get a boolean from them? That would require a truth value, which expressivists reject.

     - Alternatively, if we have reified the commands, we can build a representation of the conditional:

          data MoralExpr = Cond MoralExpr MoralExpr | Not MoralExpr | ... | Atomic String

       and then we have a function `execute :: MoralExpr -> IO ()` that runs the expression. Now, the conditional is just a data structure. But then the meaning of the conditional is given by what happens when we run it. The expressivist must say: what attitude does the conditional express? It might express a conditional attitude: e.g., if I disapprove of lying, then I disapprove of getting one's brother to lie.

     - Modus Ponens then becomes: if I have a conditional expression and I also have an expression that matches the antecedent, then I should be able to derive the consequent. In our representation, modus ponens would be:

          mp :: MoralExpr -> MoralExpr -> Maybe MoralExpr
          mp (Cond a b) a' | a == a' = Just b
          mp _ _ = Nothing

       and then we can run `b` when we run the resulting expression.

     However, note that modus ponens in logic is about truth preservation. The expressivist must explain why the inference is valid without appealing to truth. The programming analogy gives us a way to represent the inference, but the validity might be explained in terms of the consistency of attitudes: if you accept the conditional and you accept the antecedent, then you are committed to the consequent.

  **Residue Report:**

  1. **Parts that translate cleanly:**
     - The problem of embedding effectful expressions in contexts that are not executed (like conditionals) is directly analogous to the problem of embedding moral sentences in conditionals without expressing the attitude at that moment.
     - The need for a compositional semantics is the same: we need to assign meanings to parts and combine them.
     - The quotation/reification approach (turning commands into data) is a direct analog of what expressivists like Allan Gibbard do with his "plan-laden" expressions.

  2. **Parts that had to be fudged:**
     - In programming, we are comfortable with reifying effects (turning `IO a` into a value of some type representing the computation). But in expressivism, if we reify the moral sentence to a proposition (like the proposition that the speaker disapproves), then we are no longer being expressivist. We are now describing the attitude, not expressing it. So we have to be careful to reify without describing. We might reify to a data structure that, when run, expresses the attitude. Then the meaning of the embedded occurrence is the same as the unembedded one? Not exactly: the embedded occurrence doesn't express the attitude until the whole expression is run. But then what is the meaning of the embedded occurrence? It is a command that will be run only conditionally. This is acceptable in programming, but in expressivism, we must explain the meaning in terms of the attitude expressed by the whole. So we have to define the attitude expressed by the conditional command.

  3. **Parts with no counterpart:**
     - The problem of disagreement: In expressivism, two people disagreeing about a moral sentence might be seen as having incompatible attitudes. But in our programming model, we don't have a direct analog of multiple agents and their attitudes. We have a single program (the speaker) expressing attitudes. How do we model that two agents disagree? We might model the state of the world as including the attitudes of multiple agents, but that goes beyond simple effectful programming.
     - The logic of attitudes: In the Frege-Geach problem, the challenge is to show that the logical relations (like modus ponens) are valid without truth. In programming, we can model the inference as a transformation on expressions (like `mp` above). But we need to justify that this transformation is correct. The expressivist justification is in terms of the consistency of the attitudes. This is a normative claim about rationality that doesn't have a direct counterpart in programming. We can simulate the inference, but the reason why it is valid is external.

  4. **Specific Questions:**

     - **Negation:** The problem that "not (lying is wrong)" poses is analogous to the issue that you can't negate a state update (like `IO ()`) the way you negate a boolean. So we must reify the command to a value that we can negate. But note: the negation in the moral context is not the same as logical negation if we are expressivists. It might express an attitude of tolerance or refusal to condemn. So we might define `not` for moral expressions as a new command that expresses the opposite attitude? But then we have to define what the opposite attitude is. That might be a fudge.

     - **Modus Ponens:** In our translation, modus ponens becomes a transformation on expressions (like a function that takes a conditional and the antecedent and returns the consequent). But in the original problem, modus ponens is an inference rule that preserves truth. In the expressivist setting, we want it to preserve the expression of a consistent set of attitudes. So we can see modus ponens as a form of substitution in the representation (like beta reduction for conditionals) that, when executed, will lead to the right attitudes being expressed. Alternatively, we can see it as an equation that must hold in the representation.

     - **Is it just the embedding problem for effectful languages?** To a large extent, yes. However, the residue is about the meaning of the embedded expressions in terms of the attitudes they express and the logic of these attitudes. In programming, we can design the semantics arbitrarily (by defining what the reified expressions mean when run). But in expressivism, we are constrained by the psychological reality of the attitudes and the norms of rationality. So the residue is the part about the logic of attitudes and disagreement that is not just about computational effects but about the nature of moral discourse and reasoning.

  **Conclusion:**

  The Frege-Geach problem can be restated as the problem of giving a compositional semantics to a language that includes effectful expressions (commands that express attitudes) and allows these expressions to be embedded in complex syntactic constructions without executing the effect at the embedded site. We use techniques like quotation, reification, or monadic encapsulation to represent the embedded expressions as values. The residue includes the need to explain the logical relations (like modus ponens) in terms of the consistency of attitudes rather than truth, and the problem of disagreement among agents, which goes beyond the single-threaded effectful programming model.
answer: |-
  ### Restating the Frege-Geach Problem in PL Vocabulary  
  You're spot-on: **the Frege-Geach problem is fundamentally the embedding problem for effectful terms in compositional semantics**, where "effect" here is expressing a non-cognitive attitude (e.g., disapproval). Let's break it down.

  #### Core Analogy: Moral Utterances as Effectful Computations  
  - **Moral sentence (e.g., "lying is wrong")**: A term of type `Command` (or `IO ()`), where execution **performs the speech-act** of expressing disapproval.  
    ```haskell
    lyingIsWrong :: Command  -- Effect: expresses disapproval of lying
    ```
  - **Truth-apt sentences (e.g., "snow is white")**: Terms of type `Bool` (or `Prop`), denoting truth values.  
  - **Expressivism's claim**: Moral sentences **aren't truth-apt**; they're fundamentally effectful. Their "meaning" is in the attitude expressed, not a truth value.

  #### The Embedding Problem (Frege-Geach)  
  The issue arises when moral terms appear in **embedded contexts** where they aren't executed (e.g., negation, conditionals, modus ponens). Expressivists must explain:  
  1. Compositionality: How does the meaning of complex expressions (e.g., `not lyingIsWrong`) derive from parts?  
  2. Logical inference: Why does modus ponens work if moral terms aren't truth-conditional?  

  ##### Step-by-Step Translation  
  1. **Negation: `not (lying is wrong)`**  
     - **PL framing**: Applying `not :: Bool -> Bool` to a `Command`.  
       ```haskell
       not lyingIsWrong  -- Type error: `Command` ≄ `Bool`
       ```  
     - **Frege-Geach**: Expressivist must assign meaning to `not lyingIsWrong` without:  
       - Converting `lyingIsWrong` to a `Bool` (truth-aptness violates expressivism).  
       - Executing the disapproval effect (we’re not disapproving of lying here).  
     - **Solution?** Reify the effect:  
       - Quote the `Command` to a value representing the attitude:  
         ```haskell
         quote :: Command -> Attitude  -- Reify effect to a value
         not (quote lyingIsWrong)      -- Now type-checks, but what is `Attitude`?
         ```  
       - **Residue**: `Attitude` must support logical ops (`not`, `implies`) without becoming truth-conditional.  

  2. **Conditionals: `if (lying is wrong) then (murder is wrong)`**  
     - **PL framing**: Branching on an effectful term:  
       ```haskell
       if lyingIsWrong then murderIsWrong  -- Type error: `Command` ≄ `Bool`
       ```  
     - **Expressivist requirement**: The conditional shouldn’t execute `lyingIsWrong` but should constrain attitudes compositionally.  
     - **Solution?** CPS or effect handlers:  
       - Use CPS to defer execution:  
         ```haskell
         if' :: Command -> Command -> Command  -- Define a new `if` for commands
         if' cond thenBranch = do
           condAttitude <- quote cond          -- Reify `cond` to an attitude
           when (condAttitude) thenBranch      -- Execute `thenBranch` only if attitude "holds"
         ```  
       - But what is `condAttitude`? A boolean? That smuggles in truth-aptness.  

  3. **Modus Ponens**  
     - **Premise 1**: `if (lying is wrong) then (murder is wrong)`  
     - **Premise 2**: `lying is wrong`  
     - **Conclusion**: `murder is wrong`  
     - **PL framing**:  
       - Modus ponens is β-reduction (function application):  
         ```haskell
         (λx. murderIsWrong) lyingIsWrong  -- β-reduce to `murderIsWrong`
         ```  
       - **But**: If `lyingIsWrong` is a `Command`, not a value, application fails.  
     - **Expressivist requirement**: Preserve inference without truth values.  
     - **Solution?** Elaboration to an effectful calculus:  
       - Elaborate conditionals to functions on attitudes:  
         ```haskell
         elaborate :: Command -> Command -> (Attitude -> Command)
         elaborate cond thenBranch = \att -> if att == quote cond then thenBranch else pure ()
         ```  
       - Then modus ponens is function application in an **attitude DSL**:  
         ```haskell
         (elaborate lyingIsWrong murderIsWrong) (quote lyingIsWrong) 
           ~> murderIsWrong   -- Via symbolic evaluation
         ```  

  ---

  ### Residue Report: What Translates, What Fudges, What’s Lost  
  #### Clean Translations  
  1. **Embedding effectful terms**:  
     - The core problem of `Command` in non-executing positions (e.g., inside `if`, `not`) maps directly.  
  2. **Compositionality**:  
     - The challenge of defining denotations for `quote`, `if'`, etc., is identical to defining semantics for effect embeddings.  
  3. **Reification**:  
     - `quote : Command -> Attitude` parallels effect reification (e.g., `reflect`/`reify` in meta-programming).  

  #### Fudges  
  1. **The `Attitude` type**:  
     - In PL, we’d define `Attitude` as an algebraic data type (e.g., `data Attitude = Disapprove Action`).  
     - **Fudge**: Expressivism requires `Attitude` to be *non-representational*—it’s an expressed mental state, not a value we compute over. We smuggled in a truth-like type by supporting `==` and `if`.  
  2. **Logical operators on attitudes**:  
     - Defining `not :: Attitude -> Attitude` or `implies :: Attitude -> Attitude -> Attitude` fudges expressivism’s core: attitudes aren’t propositions. We implicitly treat them as truth-apt.  

  #### No Counterpart / Dropped Residue  
  1. **Disagreement and inference norms**:  
     - In philosophy, "lying is wrong" and "not (lying is wrong)" express *incompatible attitudes*. This isn’t just about type errors—it’s about **logical inconsistency without truth**.  
     - PL translation drops: Why can’t you *both* `quote lyingIsWrong` and `not (quote lyingIsWrong)`? Our DSL doesn’t model attitude conflicts (e.g., `Disapprove Lying` vs `~Disapprove Lying` as a contradiction).  
  2. **Modus ponens as rational requirement**:  
     - In expressivism, modus ponens must be a *norm of rationality*: if you accept the premises, you’re rationally compelled to accept the conclusion.  
     - PL translation reduces this to β-reduction—but β-reduction doesn’t explain *why* you’re compelled to run `murderIsWrong` after accepting the premises.  
  3. **The non-representational nature of attitudes**:  
     - `quote lyingIsWrong` reifies disapproval to a value we can manipulate. But for expressivists, the *meaning* of "lying is wrong" is the act of disapproval itself—not a symbol. Our PL model implicitly represents attitudes as data, losing this aspect.  

  ---

  ### Your Specific Questions  
  **Q: Does "not (lying is wrong)" reduce to "you can’t negate a state update"?**  
  - **Yes, but with a caveat**: The type error (`not :: Bool -> Bool` vs `Command`) is the PL counterpart.  
  - **Lost residue**: Negating an attitude isn’t syntactic (like `not update`); it’s expressing a *new attitude* (e.g., tolerance) that conflicts with disapproval. Expressivism needs this conflict to explain disagreement, which PL doesn’t model.  

  **Q: Where does modus ponens go?**  
  - **Substitution in a DSL**:  
    - Elaborate conditionals to functions `Attitude -> Command`.  
    - Modus ponens is β-reduction on quoted attitudes: `(λatt. ...) (quote cmd) ~> ...`.  
  - **What’s missing**: The **normative force**—why *should* you accept the conclusion? In PL, it’s just symbol crunching; in expressivism, it’s about consistency of attitudes.  

  **Q: Is Frege-Geach just the embedding problem for effectful languages?**  
  - **80% yes**: The compositional semantics challenge is identical.  
  - **20% residue**:  
    - The **logic of attitudes**: Why do attitudes compose like truth values? Why is modus ponens *valid* for moral sentences?  
    - **Disagreement**: Two people asserting "P" and "¬P" are in conflict—not just running different code, but *rationally incompatible*.  

  ---

  ### Bottom Line  
  The Frege-Geach problem maps cleanly to **embedding effectful terms in compositional semantics**, with `Command` as the type for moral utterances. The residue is **attitude logic and rational inference**: why attitudes behave like truth values in embeddings, and how inference norms arise from non-cognitive states. For expressivism to work, you’d need to:  
  1. Define an `Attitude` DSL with logical ops (`not`, `implies`) that aren’t truth-conditional.  
  2. Model rational conflict between attitudes (e.g., `Disapprove x` and `~Disapprove x` can’t coexist).  
  3. Justify modus ponens as a norm of attitude consistency, not just β-reduction.  

  This is like building a language where effects are reified to *constraints on program states* (attitudes), and inference is constraint propagation. The PL machinery gets you 80% there—the last 20% is philosophy.
