  Okay, let me start by unpacking the user's query. They're stuck in a debate with a friend about whether to treat variables as independent without evidence of dependence. The friend cites Jaynes and max entropy, but the user has counterexamples where this leads to problems, like reparameterization issues or fine-tuning arguments.

  First, I need to identify the core issue: the justification for presuming independence as a default. The user wants a framework to evaluate any theory on this, listing desiderata and their tensions. They’re not just looking for literature summaries but a structured analysis of what a theory must handle.

  The user mentions reparameterization as a key problem. That’s crucial because transforming variables can turn independence into dependence, which undermines the idea of a neutral prior. Also, fine-tuning in cosmology shows that assuming independence affects conclusions about the universe’s likelihood. These examples highlight that context matters, and there might not be a universal default.

  Another point is the distinction between logical and probabilistic independence. For instance, if variables are related by definition, like position and velocity, assuming probabilistic independence without evidence could be incoherent. So any theory must account for logical constraints to avoid absurd priors.

  Exchangeability vs. independence is another layer. In scenarios like coin flips, assuming exchangeability (same distribution) without independence allows for unknown correlations. A good theory should differentiate when to use each.

  I should also consider computational constraints. In complex systems, assuming independence simplifies models, but this can introduce biases if dependencies exist. The theory needs to balance tractability with accuracy, acknowledging practical compromises.

  Now, tensions between desiderata. Reparameterization invariance conflicts with universal presumptions of independence. Max entropy might work in one coordinate system but create dependencies in another. This seems like a fundamental obstacle; no theory can satisfy invariance while always presuming independence. The user might need to accept that context dictates defaults, not a one-size-fits-all rule.

  The hardest desideratum is probably reparameterization invariance. It challenges any blanket rule and forces context-dependent choices. Theories like reference priors try to address this but aren’t perfect. The user should know that this is the biggest hurdle.

  Also, the user might be hinting at deeper issues in objective Bayesianism. Their frustration with talking past their friend suggests they want a framework to clarify disagreements. Highlighting tradeoffs, like between tractability and accuracy, could help them articulate why max entropy isn’t always sufficient.

  In conclusion, the user needs a clear set of criteria to evaluate theories, emphasizing the reparameterization problem as the critical challenge. They should understand that presuming independence isn't universally neutral, and context, constraints, and practical needs shape priors. This might resolve their debate by showing that both sides have valid points depending on the scenario.
answer: |-
  Here's a breakdown of the core desiderata for a theory of presuming probabilistic independence "by default," grounded in the challenges you've encountered and the philosophical/epistemological minefield this question inhabits. The fundamental tension is between the *appeal* of a simple, universal rule (like MaxEnt's default independence) and the *reality* that probabilistic relationships are not invariant to how we describe the world.

  **Core Desiderata for a "Presumption of Independence" Theory:**

  1.  **Reparameterization Invariance (or Covariance):**
      *   **What it means:** The justification for presuming independence (or dependence) should not depend arbitrarily on the specific mathematical parameterization chosen for the random variables. If independence is presumed in variables (X, Y), and you define new variables (U = f(X), V = g(Y)) or (W = h(X, Y)), the presumed relationship between U and V (or the implied marginal/conditional distributions for W) should be consistent and defensible, not introducing spurious dependencies or independencies purely by coordinate change.
      *   **Why it's crucial:** This is the core of your "reparameterization problem." It directly kills naive applications of MaxEnt or the Principle of Indifference. Presuming `P(X,Y) = P(X)P(Y)` for position and momentum implies a *very* specific (and highly constrained) joint distribution for energy and angular momentum, which is *not* the product of their marginals derived under that prior. In cosmology, presuming independence for parameters (Λ, Q) (cosmological constant, primordial perturbation amplitude) yields different "fine-tuning" probabilities than presuming independence for (log Λ, log Q) or for some physically motivated combination. **If your theory violates this, it introduces arbitrary, unjustified metaphysical commitments based purely on mathematical convenience.**
      *   **The Hard Reality:** This is arguably the most devastating desideratum. It strongly suggests that *universal, parameterization-invariant presumption of independence is impossible*. Any rule needs context about what constitutes a "natural" or "privileged" set of variables.

  2.  **Respect for Logical/Metaphysical Constraints:**
      *   **What it means:** The presumption must not violate known logical, mathematical, or fundamental metaphysical relationships between variables. Independence cannot be presumed if variables are definitionally linked (e.g., `Radius` and `Area` of a circle given constant π), causally connected by fundamental law (e.g., position and momentum via the uncertainty principle *inherent in the state description*), or if their sample spaces are interdependent (e.g., `Sum` and `Difference` of two dice rolls).
      *   **Why it's crucial:** Presuming independence where it's logically impossible leads to incoherent priors (probabilities not summing to 1, assigning positive probability to impossible states). It reveals a distinction between *probabilistic independence* (a property of the distribution) and *logical independence* (a property of the variables/state space). **A theory must incorporate knowledge of the underlying possibility space.**
      *   **Case:** Presuming independence between `X` (position) and `P` (momentum) in quantum mechanics for a single particle *at a fixed time* is logically inconsistent with the fundamental commutation relation `[X,P]=iħ`, which implies a minimum uncertainty product encoded in the *state space itself*, not just the distribution.

  3.  **Distinction Between Independence and Exchangeability:**
      *   **What it means:** The theory must clearly differentiate treating variables as *independent* (P(X₁,X₂) = P(X₁)P(X₂)) from treating them as *exchangeable* (P(X₁,X₂) = P(X₂,X₁), often leading to a model like Xᵢ | θ ~ F_θ, θ ~ π(θ)). Exchangeability allows for *unknown* dependence via shared latent parameters.
      *   **Why it's crucial:** In many practical sparse-data scenarios (e.g., modeling multiple similar but untested systems, repeated trials under unknown conditions), exchangeability is the natural, weaker, and more robust default assumption. Assuming full independence prematurely ignores the possibility of shared underlying factors. **Presuming independence when exchangeability is appropriate leads to overconfident, fragmented priors that discard the possibility of learning common structure.**
      *   **Case:** Modeling the success/failure of 10 different, newly designed widgets of the same type. Presuming independence says failures tell you nothing about each other. Exchangeability says failures suggest a common flaw (shared θ = high failure rate), allowing evidence from one widget to update beliefs about others. The latter is usually more rational absent specific evidence *against* a shared mechanism.

  4.  **Handling Structured Domains (Causality, Mechanism):**
      *   **What it means:** The theory should acknowledge that beliefs about dependence are often tied to beliefs about underlying causal structure or generative mechanisms, even if vague. Default independence assumptions need to be compatible with plausible (or implausible) causal stories.
      *   **Why it's crucial:** In complex systems (biology, engineering, social sciences), variables often *aren't* causally isolated. Presuming independence between inputs and outputs of a known mechanism is nonsensical. **A default rule needs sensitivity to whether variables are plausibly inputs to a common process, outputs of separate processes, or causally connected.**
      *   **Case:** Presuming independence between `Force`, `Mass`, and `Acceleration` for an object ignores F=ma. Presuming independence between `Rain` and `Wet Sidewalk` ignores the obvious causal link. While full causal knowledge is rare, the *possibility* of causal connection should temper blanket independence assumptions in adjacent variables within a system.

  5.  **Robustness to Sparsity & Computational Tractability (Pragmatism):**
      *   **What it means:** The presumption should lead to priors that are computationally feasible to work with, especially in high dimensions with sparse data, and yield inferences that aren't catastrophically sensitive to small perturbations *in the absence of strong evidence*.
      *   **Why it's crucial:** This is the *practical* driver behind the desire for independence. Modeling all possible dependencies in high dimensions is often intractable. **A theory must justify when the simplification/approximation of independence is pragmatically necessary and epistemically "least harmful" as a default.**
      *   **Case:** Building a prior over 100 vaguely related sensor readings in a new system. Explicitly modeling all 4950 pairwise dependencies (let alone higher-order) is impossible without mountains of data or strong domain knowledge. Assuming independence (or a very sparse dependency graph) might be the only computationally viable starting point, even if known to be strictly false.

  6.  **Avoidance of Paradoxical or Strongly Counter-Intuitive Implications:**
      *   **What it means:** The presumption shouldn't lead to priors that assign vanishingly small probability to intuitively plausible states or vast probability to intuitively implausible ones, *without strong justification*. It should be consistent with basic human "common sense" where such sense is relevant.
      *   **Why it's crucial:** While intuition can be wrong, theories that consistently violate strong, widely shared intuitions without compelling justification risk being epiphenomenal or reflecting artifacts of the formalism rather than rational inference. **This guards against the Principle of Indifference's notorious paradoxes (e.g., Bertrand's paradox).**
      *   **Case:** Applying MaxEnt naively to a bounded 2D space might concentrate probability mass on the boundaries if constraints are applied carelessly, making "extreme" values more probable than "moderate" ones counter-intuitively. A theory should avoid generating such priors as *defaults* without specific evidence pointing to boundary concentrations.

  7.  **Explicitness about Commitment:**
      *   **What it means:** The theory should make clear the *nature* and *strength* of the commitment being made when presuming independence. Is it a claim about the world? A claim about irrelevance for current purposes? A computational shortcut? An epistemic necessity? It should discourage treating "default independence" as a cost-free, assumption-neutral move.
      *   **Why it's crucial:** This addresses your concern about "making substantive claims you didn't even know you were making." **Presuming independence *is* a substantive assumption.** A good theory forces the user to recognize this and articulate the justification (even if it's just pragmatic necessity), rather than hiding behind a formal rule.

  **The Tensions and Trade-offs:**

  1.  **Reparameterization Invariance vs. Universal Presumption of Independence:** This is the **fundamental, likely insurmountable tension.** You simply cannot have a rule that *always* presumes independence *and* is invariant to reparameterization. MaxEnt satisfies the latter only if constraints are specified in a way that *is* covariant (e.g., moments of linear combinations), but "no constraints" (implying independence in the given coordinates) is *not* covariant. **This is the "no-free-lunch" lurking here.** Any general rule for default independence *must* break reparameterization invariance, or vice-versa. Theories must choose a privileged parameterization or abandon universal independence.

  2.  **Respect for Constraints/Structure vs. Pragmatism/Tractability:** Rigorously incorporating all logical constraints and plausible causal structures is ideal but often computationally intractable or requires inaccessible knowledge. Presuming independence for tractability ignores these structures. **Trade-off:** How much domain knowledge/logical analysis is *required* before falling back to a simple independence prior? When is the computational gain worth the potential bias?

  3.  **Exchangeability vs. Independence:** Presuming exchangeability is weaker and often more appropriate, but modeling the latent parameter `θ` can be more complex than assuming full independence. **Trade-off:** Weaker assumption (exchangeability) vs. simpler computation (independence).

  **The Hardest Desideratum: Reparameterization Invariance**

  This is **the killer.** It rules out *any* theory claiming that "no evidence of dependence" *universally* licenses `P(X,Y) = P(X)P(Y)` as a neutral or objective default. It forces the conclusion that:

  *   **Independence is not a universal default state.** The "natural" independence structure depends on the *structure of the problem* and the *chosen representation*.
  *   **"No evidence of dependence" isn't enough.** You need a justification *for that specific parameterization* or a method that defines independence in a covariant way.
  *   **Objective Bayesian approaches (like MaxEnt) require careful specification of constraints.** Applying MaxEnt with *only* normalization constraints *does* yield independence in the given variables, but this choice of constraints (or lack thereof) is *not* invariant. Using MaxEnt covariantly requires specifying constraints that *are* invariant (e.g., expected values of sufficient statistics in a natural exponential family), which inherently builds in dependence structure.

  **What Does This Mean for Your Debate?**

  *   Your Jaynesian friend is correct **given a specific, fixed choice of variables and constraint set** where MaxEnt is applied. MaxEnt *does* prescribe independence under "no constraints except normalization" *in those coordinates*.
  *   **However, you are fundamentally correct** that this move is **not neutral or assumption-free.** Choosing *which* variables to apply MaxEnt to, and *which* constraints to impose (even if just normalization), involves a substantive choice that embeds prior assumptions about relevance and dependence. The reparameterization problem demonstrates this starkly. The fine-tuning debate hinges entirely on this arbitrariness of the "natural" independent parameterization of fundamental constants.
  *   **No theory provides a fully general, universally justified "presumption of independence."** The best any approach can do is:
      *   **Be explicit:** Acknowledge that presuming independence is a substantive modeling choice.
      *   **Justify the parameterization:** Argue why *this particular* variable set is "natural" or "privileged" for assuming independence (e.g., based on causal structure, physical separability, computational necessity).
      *   **Consider alternatives:** Use exchangeability where plausible, or consider sensitivity analyses to different dependency assumptions.
      *   **Use Covariant Methods:** Employ methods like reference priors or invariant MaxEnt constraint sets that attempt to define priors based on the *structure* of the problem (e.g., the Fisher information metric) rather than naive independence in raw coordinates. These are complex and not without their own issues, but they directly tackle reparameterization.

  In essence, the desiderata reveal that "presuming independence by default" is a useful **heuristic** or **pragmatic necessity** in many contexts (especially high-dimensional, sparse-data problems), but it is **not** a fundamental principle of rational inference that can be universally justified without additional context or assumptions about the problem representation. The reparameterization problem ensures that independence is never truly an assumption-free state.
