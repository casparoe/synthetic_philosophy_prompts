  Okay, the user is part of a data-governance committee at a hospital and has noticed a pattern where the same information can be unproblematic in one context but a violation in another, even with consent and other factors constant. They gave examples like a pharmacist discussing a prescription with a neighbor or wearable device data being sold to insurers. They're puzzled about whether this reflects a real aspect of privacy or just local conventions. They want to know if there's an established name for this concept and how it differs from the control-based view of privacy. They also want a detailed explanation, not just a label.

  First, I recall that Helen Nissenbaum's theory of contextual integrity might be relevant here. She argues that privacy norms are tied to specific contexts, governed by norms of appropriateness and flow. That matches the user's observations about settings and relationships. The control-based view, like Alan Westin's definition, focuses on individual control over information. But contextual integrity emphasizes the context in which information is shared. 

  The user's examples show that the context defines what's appropriate. The pharmacist-neighbor scenario violates the norm because the neighbor isn't part of the healthcare context. Similarly, selling wearable data shifts the context from healthcare to commercial, breaching trust. This explains why the violation feels like a betrayal even if consent is given—it's about the mismatch in context, not just secrecy.

  The user is also concerned about varying norms across communities and time. Contextual integrity accounts for this by recognizing that contexts evolve. What's key is whether the information flow adheres to the norms of a specific context at a given time. This addresses their worry about local conventions vs. universal principles—it's both, as norms are context-dependent but grounded in social structures.

  They might need to understand why such violations are wrong, not just surprising. Contextual integrity links breaches to undermining trust and social structures. In healthcare, violating norms can erode patient trust, which is crucial for care. The wrong comes from disrupting the integrity of social systems, not just individual harm. 

  Differentiating from control-based views: consent is part of it, but not sufficient. The user’s examples show consent doesn't prevent violations when context changes. Contextual integrity looks beyond consent to the context's norms. For instance, selling data might be consented to in a lengthy T&C, but it's still wrongful because it breaches healthcare expectations. 

  Edges of this theory: It might struggle with conflicting norms in overlapping contexts or rapidly changing tech. Also, identifying the relevant context isn't always clear. But it offers a framework to evaluate new practices by assessing norm adherence. 

  The user is in healthcare data governance, so their deeper need is practical guidance. They need to apply this to policies, assess data sharing, and navigate evolving norms. Highlighting how contextual integrity provides a tool for evaluating data flows in medical contexts would be useful. Emphasizing trust and structural integrity can help justify policies to stakeholders.
answer: |-
  It seems you've put your finger on a profound and well-recognized challenge in understanding privacy, one that moves beyond the limitations of simpler "control" or "secrecy" models. The perspective you're describing aligns closely with the theory of **Contextual Integrity**, most extensively developed by philosopher Helen Nissenbaum. This isn't just a label; it represents a significant shift in how we conceptualize what privacy protects and why violations feel wrong.

  Contextual Integrity argues that privacy isn't fundamentally about keeping information absolutely secret or even solely about an individual's control over its dissemination. Instead, it posits that privacy is about upholding the appropriate *flow* of information within specific *social contexts*. Every context – healthcare, family, commerce, employment, social media – comes with its own set of deeply embedded norms governing two key aspects:

  1.  **Appropriateness:** What *types* of information are fitting or expected to be shared within that context? Your health details are appropriate in a medical consultation but generally inappropriate at a neighborhood barbecue.
  2.  **Flow or Distribution:** *How* should appropriate information flow? This defines the actors involved: who is the *subject* of the information, who is the *sender*, who is the *recipient*, and what are the *transmission principles* governing the transfer (e.g., consent, mandate, payment, coercion)? The pharmacist (sender) sharing prescription details (information) with the patient or another healthcare provider treating that patient (recipients) fits the flow norms of the healthcare context. Sharing it with a neighbor violates the expected recipient principle.

  This explains your observations perfectly. Holding consent, secrecy, and quantity constant doesn't guarantee appropriateness if the *context* shifts. The wearable collecting heartbeat data fits the context of personal health *care* when used by the individual or shared with their doctor under understood terms. Selling that data to an insurer fundamentally changes the context to *commercial exploitation*, violating the norms of appropriateness (using intimate health data for profit/risk assessment) and flow (the recipient is now a corporation with conflicting interests, not a care provider). The betrayal stems from the context being shattered, not necessarily from the data being unknown or uncontrolled in an absolute sense.

  **How it Differs from the Control Model:**

  The dominant "control over information" view (often associated with Alan Westin) focuses primarily on the individual's agency. Privacy is violated when *you* lose control over *your* data. Contextual Integrity doesn't dismiss control; consent often *is* a key transmission principle within a context. However, it argues that control alone is insufficient and sometimes irrelevant:

  *   **Beyond Individual Will:** Control models struggle with situations where consent is technically given but the *use* violates contextual norms (like selling health data hidden in lengthy T&Cs). Contextual Integrity identifies the violation as occurring *despite* consent, because the flow transgresses the context's inherent norms. The pharmacist *could* tell the neighbor with consent, but doing so would still rupture the professional healthcare context.
  *   **Social Embeddedness:** Control is atomistic, centered on the individual. Contextual Integrity recognizes that privacy norms are *socially constituted* within specific practices and relationships (doctor-patient, merchant-customer, friend-friend). The wrong arises from disrupting the integrity of that social sphere and its expectations.
  *   **Defining "Appropriate" Control:** What constitutes reasonable control or consent *itself* is defined *by the context*. The level of consent needed to share medical records with a specialist differs radically from the consent needed to post them on social media. The control model, without context, struggles to define the boundaries of appropriate control.

  **Why Violations Are Wrong (Beyond Surprise):**

  Contextual Integrity argues these violations are genuinely wrong because they:

  1.  **Undermine Trust and the Social Fabric:** Contexts rely on shared expectations to function. Healthcare depends on patients trusting providers to handle sensitive information appropriately within the care context. Violating flow norms erodes this trust, damaging the context itself and discouraging necessary participation (e.g., patients withholding information).
  2.  **Disrupt Autonomy and Self-Presentation:** We navigate different social contexts by presenting different aspects of ourselves. Contextual norms allow us to manage this. Violations force information from one context into another, undermining our ability to control how we are perceived and to engage effectively in different spheres of life (e.g., health issues impacting employment unfairly).
  3.  **Cause Dignitary Harms:** Being treated according to the wrong context's norms is demeaning. Having your medical details treated as commercial fodder denies the dignity inherent in the doctor-patient relationship.
  4.  **Enable Oppressive Power Dynamics:** Contextual norms often act as checks on power. Violating flow norms (e.g., employers accessing employee health data without a clear, context-appropriate reason) can facilitate surveillance, discrimination, and manipulation.

  **Where the Edges Are and What it Rules In/Out:**

  *   **Ruled In:** Precisely the phenomena you observe: violations where secrecy isn't breached and consent might be present, but the information flows in ways that rupture the expectations of a specific social context (healthcare, finance, friendship, etc.). It focuses on the *relational* and *situational* nature of privacy.
  *   **Ruled Out (or Deprioritized):** The theory is less focused on, or provides a different lens for:
      *   Absolute secrecy for its own sake.
      *   Violations occurring *within* a context where norms are adhered to (e.g., a doctor properly accessing your record for treatment).
      *   Harms based *solely* on information being unknown to anyone (it emphasizes the *wrong kind* of knowing/sharing).
  *   **The Fuzzy Edges - Key Challenges:**
      *   **Defining Contexts:** How granular are contexts? When does "healthcare" end and "research" or "billing" begin? Contexts can overlap and blur.
      *   **Norm Evolution:** You rightly note norms shift. Contextual Integrity embraces this dynamism. Determining the "current" norms of a context requires empirical observation and ethical/political deliberation, especially with new technologies. Was the wearable data sale *ever* part of the understood health context?
      *   **Norm Justification:** How do we judge *which* contextual norms are morally worthy of protection? Not all existing norms are just. Contextual Integrity provides a framework for identifying violations, but evaluating whether the *existing norms themselves* are good may require additional ethical principles (e.g., fairness, preventing harm).
      *   **Conflicting Contexts:** What happens when information flows are appropriate in one context but harmful when entering another (e.g., social media data used for employment screening)? Resolving these conflicts is complex.

  In essence, Contextual Integrity offers a powerful lens for your work in data governance, especially in healthcare. It explains why seemingly identical information flows can be benign or deeply violating based on the social setting and relationships involved. It moves beyond the individual lever of control to acknowledge the complex social ecosystem in which information lives, highlighting that privacy violations often constitute a breach of trust within a specific social sphere, undermining the very foundations necessary for that sphere to function effectively and humanely. Recognizing this helps explain the visceral sense of betrayal you describe, even when traditional markers of secrecy or control haven't been obviously transgressed. Navigating its edges – defining contexts, tracking evolving norms, and justifying them – is the ongoing challenge of applying this robust framework.
