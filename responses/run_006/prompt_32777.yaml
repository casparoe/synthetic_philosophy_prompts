  First, the user mentions that their friends say "separate the art from the artist" as if it's a settled argument, but they find it vague. They listed several possibilities: whether the artist's morality affects the art's aesthetics, if knowledge changes the experience, if there's a duty to evaluate art independently, or if consuming the art makes one complicit. Each of these is a distinct claim. I need to clarify each one.

  The user also mentioned their pushback about not being able to un-know Polanski's actions and being accused of "collapsing ethics into aesthetics." They want to understand that criticism. So, I should explain what that phrase means in this context. Probably, the friend is saying that the user is letting moral judgment override aesthetic evaluation, conflating the two.

  Now, breaking down the slogan. The first interpretation is the descriptive claim: bad people can create good art. That's straightforward and hard to deny. But the user feels the slogan is used for stronger claims. The second is methodological separation: critics should focus on the work itself. That makes sense in academic analysis but doesn't address personal experience. The third is experiential separation—suggesting one should ignore the artist's background. But is that even possible? The user says they can't un-know, so this might be unrealistic. The fourth is ethical separation: consuming art doesn't imply endorsement. But complicity is complex. Boycotts can be a form of protest, so there might be ethical considerations.

  The user's core need is to clarify the arguments and validate their discomfort. They feel icky watching Chinatown and want to know if that's justified. The experiential point is key here. Neuroscience shows that knowledge affects perception, so it's natural for their experience to change. The friend's accusation of collapsing ethics into aesthetics might miss that the user isn't saying the art is objectively worse but that their personal experience is altered.

  Also, the user might be seeking reassurance that their feelings are valid and not irrational. They might also want tools to articulate their stance in future debates. Highlighting the different interpretations can help them pinpoint which aspect their friends are invoking and how to counter it.

  Another angle: the user could be concerned about the moral implications of enjoying art by problematic artists. They might worry about endorsing the artist or funding them. Addressing complicity here is important. If the artist profits or gains platform from consumption, that's a valid concern. However, for deceased artists like Polanski, the profit aspect might be different, but the platform issue remains.

  I should also consider the stronger claims the friends might be making. Are they insisting that one must not let personal knowledge affect enjoyment? That's prescriptive and ignores psychological reality. Or are they saying that aesthetic value is entirely independent? That's a philosophical stance but doesn't negate personal experience.

  The user needs a clear framework to dissect the slogan. By categorizing the interpretations and assessing their plausibility, they can engage in more nuanced discussions. Emphasizing that both aesthetic evaluation and ethical consumption are valid but separate concerns might help. Also, acknowledging that personal experience is subjective and cannot be controlled by will alone.

  Finally, wrapping up with why the user isn't wrong: their feelings are legitimate, and the slogan oversimplifies a complex issue. They don't have to dismiss their discomfort to appreciate the art's craftsmanship. Both can coexist, and the choice to engage or not is personal.
answer: |-
  You've hit the nail on the head: "Separate the art from the artist" is an incredibly vague slogan that gets used to mean several distinct (and often conflated) things. Your frustration is spot-on. Let's break down the possible claims, their plausibility, and what they imply for your "icky" feeling watching *Chinatown*:

  **The Core Claims (What the Slogan *Could* Mean):**

  1.  **The Descriptive Claim (Weakest, Most Plausible):**
      *   **Meaning:** A morally flawed or even monstrous person can create aesthetically excellent, innovative, or profound art. The moral character of the creator is not a *reliable predictor* of the aesthetic quality of the work.
      *   **Plausibility:** Highly plausible, bordering on obvious. History is full of examples (Caravaggio, Wagner, Pound, the filmmakers you mention).
      *   **Relevance to your "ick":** Doesn't address it at all. It just says "Polanski is bad, *Chinatown* is good" can both be true simultaneously. It doesn't tell you how to *feel* about watching it or whether you *should* watch it.

  2.  **The Methodological Claim (About Criticism/Analysis):**
      *   **Meaning:** When engaging in formal *aesthetic analysis or criticism* (e.g., discussing cinematography, narrative structure, themes *within the text*, acting, historical influence), the primary focus should be on the work itself *as it exists*, using evidence from the work. The artist's biography, while potentially interesting context, is not the *primary* source of meaning or value judgment for the *artwork itself*.
      *   **Plausibility:** Strong within its domain. This is the foundation of most academic literary/film criticism (e.g., New Criticism, Formalism). It aims for objectivity in analyzing the work's internal mechanics and effects.
      *   **Relevance to your "ick":** Doesn't negate your feeling. It says *one valid way to analyze the film* is to focus on its internal elements. It doesn't say this is the *only* valid way to engage with art, nor does it address the *ethical experience* of consumption. This is likely where the "collapsing ethics into aesthetics" accusation comes from – your friends might think you're letting moral outrage prevent you from seeing/analyzing the film's formal qualities *on their own terms*. But this claim doesn't *demand* that you *personally* ignore the artist.

  3.  **The Experiential Claim (The Impossible Command):**
      *   **Meaning:** You *should* (and *can*) completely bracket off your knowledge of the artist's actions/biography when experiencing their art. Your enjoyment, interpretation, and emotional response should be unaffected by this external knowledge. "Just watch the movie!"
      *   **Plausibility:** Largely implausible and psychologically unrealistic for most people facing serious moral transgressions. Art isn't received in a vacuum. Knowledge *changes* perception (e.g., knowing Polanski drugged and raped a child inevitably colors scenes involving power, manipulation, or vulnerability in his films). Our brains don't have an "ignore this knowledge" switch. This claim often confuses *should* with *can*.
      *   **Relevance to your "ick":** This is the claim most directly telling you you're "wrong" to feel icky. It prescribes how you *should* feel and experience the art, dismissing your authentic reaction as illegitimate or weak-willed. This is the most common (and most frustrating) misuse of the slogan.

  4.  **The Ethical Consumption Claim:**
      *   **Meaning:** Consuming or appreciating the art does *not* constitute an endorsement of the artist's actions, nor does it make you morally complicit in those actions. Enjoying the art is a separate act from condoning the artist.
      *   **Plausibility:** Nuanced and highly contested.
          *   **Plausible Aspect:** Enjoying a film's craft doesn't *necessarily* mean you endorse rape. Appreciation can be complex and critical.
          *   **Implausible/Problematic Aspect:** Consumption *can* have real-world consequences:
              *   **Financial Support:** Buying/streaming *new* works directly funds the artist (less relevant for older films like *Chinatown*, but very relevant for ongoing careers like Allen's).
              *   **Platform & Legitimization:** Engaging with and discussing the art keeps the artist culturally relevant and can feel like normalizing them, potentially softening their image ("He can't be *that* bad, look how brilliant he is!").
              *   **Harm to Victims:** For victims/survivors, seeing an artist celebrated or platformed can be deeply retraumatizing.
      *   **Relevance to your "ick":** Directly addresses your concern about complicity. The slogan, used this way, argues you *aren't* complicit, so your "ick" is misplaced. However, the counter-arguments above show why the ethical dimension isn't easily dismissed.

  **Untangling the "Collapsing Ethics into Aesthetics" Accusation:**

  This accusation likely stems from claim #2 (Methodological). Your friend is saying:

  1.  Aesthetics (formal qualities, beauty, craft, internal meaning) and Ethics (moral judgments about the artist/actions) are distinct domains.
  2.  You are letting your ethical outrage *override* or *distort* your aesthetic judgment. Instead of saying "This film is brilliantly made *but* I find it ethically troubling to engage with," you might be perceived as saying "Because Polanski is a rapist, *Chinatown* is *aesthetically* bad/flawed/less valuable."
  3.  They believe you are conflating the two – allowing the moral failing to "collapse" your ability to see or acknowledge the aesthetic value independently.

  **What They're Probably *Trying* (and Often Failing) to Say:**

  When your friends nod sagely, they likely intend a *mix* of claims, often leaning heavily on #1 (Descriptive) and #2 (Methodological), but *prescribing* #3 (Experiential). They want to affirm that the film has value *as art* and that this value exists independently of the artist's sins. They may also want to protect their own enjoyment from ethical discomfort (#3 & #4).

  **Why Your "Ick" is Valid and the Slogan Often Fails:**

  1.  **The Experiential Claim (#3) is Bogus:** You *can't* un-know. Expecting you to is unreasonable. Your altered experience is real and valid.
  2.  **Ethics and Experience Are Inextricable for You (and Many):** Your knowledge *changes* the work. Scenes take on unintended meanings, themes resonate differently, enjoyment is poisoned. This isn't "collapsing," it's acknowledging that art exists in a context *including* the creator. Aesthetic experience isn't pure formalism; it's filtered through the viewer's entire being, including their moral sense.
  3.  **Ethical Consumption (#4) is a Genuine Concern:** While not automatically complicit, your discomfort might stem from a sense of participating in a system that benefits or legitimizes someone who committed horrific acts, or simply feeling aligned with something morally tainted. This is a personal ethical calculation.
  4.  **The Slogan Over-simplifies:** It pretends there's a clean partition where none exists. Art is made by humans, consumed by humans, within social, historical, and ethical contexts.

  **Conclusion & What to Say Next Time:**

  *   **"Separating" is Multifaceted:** Acknowledge the valid core (#1 & #2): "Yes, obviously a terrible person can make a great film technically and artistically. And yes, we *can* analyze its formal qualities independently."
  *   **Challenge the Experiential Prescription:** "But the slogan often gets used to tell me I *shouldn't let* my knowledge affect my *experience*. That's just not how brains work. Knowing what Polanski did *changes* how I see that scene with the young girl, how I perceive the themes of corruption and power. I can't switch that off, and I don't think it's a flaw in me that I can't."
  *   **Affirm the Ethical Dimension:** "It also ignores the ethical question of consumption. Even if the film is brilliant, *my choice to watch it now, knowing what I know*, feels different. Does it support him financially? Does discussing it purely aesthetically help normalize him? Does it feel disrespectful to victims? These are real concerns the slogan dismisses."
  *   **Reframe the Debate:** "Instead of saying 'separate,' maybe we should say 'acknowledge the tension.' We can recognize the film's artistic merits *while also* acknowledging the moral stain of the creator and the complex, sometimes uncomfortable, experience of engaging with it. The brilliance and the horror can coexist, and my feeling of 'ick' is part of that honest response."

  **You're not wrong.** The slogan is often a shield against discomfort. A truly nuanced view holds both the aesthetic achievement and the ethical baggage in tension, recognizing that the experience of art is richer and more complex than the simplistic command to "separate" allows. Your "ick" is a legitimate part of that complex engagement.
