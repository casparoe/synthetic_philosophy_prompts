prompt: |-
  ok so i just had this like three-hour argument with my friend about whether what you know depends on what's at stake and i think i've figured out what i believe but i'm worried it doesn't all hang together. here's where i'm at:

  (1) pragmatic encroachment: whether you know p depends partly on what's practically at stake for you if p turns out false. higher stakes = harder to know, roughly.

  (2) but i'm a semantic invariantist about "knows" — it's not like "tall" where the word itself shifts meaning across contexts. "knows" always picks out the same relation.

  (3) i have the standard bank case intuitions: keith knows the bank is open saturday in the low-stakes version but not in the high-stakes version.

  (4) knowledge is the norm of assertion — you shouldn't flat-out assert p unless you know p.

  (5) i also think the only things that shift epistemic standards are genuinely practical factors (like what's actually at stake), not merely conversational factors like what possibilities happen to get mentioned. this is why i'm not a contextualist — contextualists let any old salient possibility raise the bar.

  (6) here's one i'm less sure about: if you know p, then you're epistemically in the clear to act on p no matter what the stakes are. like, once you've cleared the bar for knowledge, you're good for any practical purpose. higher stakes can't retroactively make your epistemic position insufficient.

  (7) oh and i think knowledge is intimately tied to practical reasoning: what it IS to know p just is to be in the epistemic position that entitles you to treat p as a premise in practical reasoning. there's no gap between "knowing" and "knowing for practical purposes."

  my friend kept insisting that (2) and (3) together force me to be a contextualist, and that (1) and (6) obviously contradict each other. i pushed back at the time but now i'm not so sure. can you go through these and tell me which pairs are actually in tension, which just look like they are, and what the cheapest fix is? please rank the tensions by severity — i don't want a list where everything is equally bad.
reasoning: |-
  Okay, the user just had a three-hour argument with their friend about pragmatic encroachment and is trying to piece together their own position. They've listed seven key points they believe in but are worried about internal consistency, especially regarding claims (2) and (3) seeming to force contextualism, and (1) and (6) appearing contradictory. 

  First, I need to unpack their core tension: they want to maintain semantic invariantism (the word "knows" doesn't shift meaning) while accepting that practical stakes affect whether someone knows something (pragmatic encroachment). Their friend insists this is impossible—that (2) and (3) together require contextualism. But actually, this is precisely what *subject-sensitive invariantism* (SSI) is designed to handle. SSI says the knowledge relation itself is stake-sensitive but semantically fixed. So their intuition about the bank cases (3) fits perfectly here—Keith's actual stakes change the epistemic threshold for knowledge, not the meaning of "knows." 

  Now for the alleged contradiction between (1) and (6): higher stakes make knowledge harder to attain (1), but once known, that knowledge is sufficient for any practical purpose (6). This seems conflicting at first glance—doesn't (1) imply stakes can *undermine* knowledge? But under SSI, it's coherent: stakes set the hurdle *at the time of inquiry*. Once you vault that hurdle, the knowledge is "sticky" for future actions. If stakes later rise, it doesn't retroactively destroy knowledge; it just means the *current* epistemic bar is now higher for *new* knowledge claims. So (6) holds—past knowledge licenses present action. 

  Minor tension with (7): If knowledge *just is* the epistemic position sufficient for practical reasoning, then (6) follows naturally—knowledge wouldn't be knowledge if it weren't always action-sufficient. But (7) might oversimplify by making practical reasoning the *essence* of knowledge. They could soften this to "knowledge is typically sufficient for practical reasoning" to avoid overcommitment. 

  Other points fit neatly: (4) (knowledge norm of assertion) pairs well with (1) and (3)—asserting requires meeting the stake-relative knowledge standard. (5) (only genuine stakes shift standards) explicitly rejects contextualism and aligns with SSI. 

  The biggest threat isn't internal inconsistency—it's external objections. SSI faces the "strange intellectualism" critique: why should practical stakes affect a purely epistemic state? And the "knowledge erosion" problem: if stakes rise, does your knowledge vanish? But the user seems aware of these and is prioritizing coherence over popularity. 

  Cheapest fix: Clarify that (6) applies to *actions at the time knowledge was acquired*. Later high-stakes actions may require reconfirming knowledge under new standards—without invalidating past knowledge. This preserves the spirit of (6) without denying stake-sensitivity. 

  Overall, their framework is tenable as a form of SSI. The friend's objections confuse contextualism (semantic shift) with invariantism (semantic fixedness + pragmatic sensitivity). User just needs to tighten (6)-(7) linkages and brace for standard SSI criticisms.
answer: |-
  Based on your commitments, here's an analysis of the tensions, ranked by severity (most severe first), along with explanations and the cheapest fixes:

  **Ranked Tensions & Solutions:**

  1.  **Core Tension: (1) Pragmatic Encroachment + (2) Semantic Invariantism + (6) Knowledge Sufficiency for Action**
      *   **Severity:** High (The most fundamental challenge).
      *   **Conflict:** (1) says stakes affect *whether you know*. (6) says that if you know p, you are *always* "in the clear" to act on p, regardless of future stakes. But what happens when stakes *increase* after you acquired the knowledge?
          *   **Scenario:** You know p (e.g., "The plane lands at Gate A7") in low-stakes context S1 (catching a routine flight). Later, in high-stakes context S2 (rushing to catch a connecting flight to your child's lifesaving surgery), you need to act on p.
          *   (1) + (2): To know p *in S2*, given the high stakes, you need a *better epistemic position* than you needed in S1. Your position hasn't changed, so you likely *don't know p in S2*.
          *   (6): But you *did* know p in S1. Therefore, according to (6), you *should* be "in the clear" to act on p in S2.
      *   **Result:** Contradiction. (6) says you *can* justifiably act on your S1 knowledge in S2. But (1) + (2) (especially under invariantism) imply that in S2, you *don't know p* and therefore, given (4) & (7), you *cannot* properly assert p or treat it as a premise for high-stakes practical reasoning. Your epistemic position is now deemed insufficient *for the same proposition p*.
      *   **Cheapest Fix:** **Modify (6).** Adopt **Temporal Sufficiency**: "If you know p *at time t in context C (with stakes S)*, then you are epistemically in the clear to act on p *at time t in context C (with stakes S)*." Higher *future* stakes don't retroactively make past knowledge insufficient *for past actions*, but they *do* mean your *current* epistemic position (if unchanged) is insufficient for *current* knowledge and *current* high-stakes action. Your knowledge is sufficient *only for the stakes level at which it was acquired* or lower. Acting in *higher* stakes requires *reconfirming* knowledge under the new standard.

  2.  **Tension: (1) Pragmatic Encroachment + (2) Semantic Invariantism vs. Friend's Claim (Contextualism Forced by (2) & (3))**
      *   **Severity:** Moderate (Primarily a misunderstanding by your friend).
      *   **Conflict:** Your friend thinks (2) (invariantism) and (3) (bank case intuitions) force contextualism. This is a common misconception.
      *   **Resolution:** **No Fix Needed (for coherence).** Your position is classic **Subject-Sensitive Invariantism (SSI)** or **Interest-Relative Invariantism (IRI)**. Key figures: Jason Stanley, John Hawthorne, Jeremy Fantl & Matthew McGrath.
          *   **How it works:** (2) holds - "knows" refers to a single, invariant relation. (3) holds - Keith knows in low stakes, not in high stakes. (1) holds - stakes are part of what *determines* whether that single relation obtains. The *relation itself* has a stake-sensitive component. Contextualism says the *meaning* of "knows" changes; SSI says the *facts* about whether someone stands in the knowledge relation change with stakes, while the relation's *meaning* stays fixed.
      *   **Why it works for (3):** In low stakes, the invariant knowledge relation requires (say) evidence level E. Keith meets E. In high stakes, the *same* invariant knowledge relation requires evidence level E+ (due to the higher practical cost of error). Keith only has E, so he doesn't stand in the knowledge relation. The invariantist can perfectly well explain the bank cases without semantic shift.

  3.  **Potential Tension: (7) Knowledge as Sufficient for Practical Reasoning + (1) Pragmatic Encroachment**
      *   **Severity:** Low to Moderate (Requires careful phrasing of (7)).
      *   **Conflict:** (7) says knowing p *just is* being entitled to treat p as a premise in practical reasoning. But (1) says what counts as knowing p *depends* on the stakes of the practical reasoning. This looks circular: the practical reasoning situation defines what knowledge is, but knowledge is supposed to license the practical reasoning.
      *   **Resolution:** **Refine (7).** The SSI proponent typically holds: Knowing p (in context C with stakes S) *is* being in an epistemic position sufficient to license treating p as a premise *in practical reasoning situations where the stakes are S or lower*. Higher-stakes reasoning requires a *stronger* epistemic position, which constitutes knowing p *under those higher stakes*. The definition incorporates the *level* of practical reasoning it licenses. There's no free-floating "knowledge for practical purposes" divorced from the stakes level; knowledge *is* indexed to sufficient practical reasoning at a certain stakes level. This avoids circularity by making the stakes level a parameter within the definition.

  4.  **Consistency: (4) Knowledge Norm of Assertion + (1)/(2)/(3)**
      *   **Severity:** None (Fits well).
      *   **Explanation:** SSI explains why you shouldn't assert p in high stakes if you don't know it (because the high stakes mean you need stronger evidence to know it, which you lack). Your low-stakes assertion in the bank case was proper because you knew then; asserting in the high-stakes version would be improper because you don't know under those stakes.

  5.  **Consistency: (5) Genuine Practical Factors Shift Standards + (1)/(2)**
      *   **Severity:** None (Core SSI Commitment).
      *   **Explanation:** This is precisely what distinguishes your view (SSI) from contextualism. You reject conversational salience alone raising standards; only *actual* practical interests/stakes do. This is a feature, not a bug, of your position.

  **Summary of Your Position & Fixes:**

  *   You are a **Subject-Sensitive Invariantist (SSI)**. This coherently combines (1), (2), (3), (4), and (5).
  *   **The Core Problem:** The interaction between (1)/(2) and (6). SSI inherently means knowledge is *stakes-relative*. Therefore, knowledge sufficient for low-stakes action is *not* automatically sufficient for high-stakes action. (6) as stated is incompatible.
  *   **Cheapest & Most Crucial Fix: Modify (6) to Temporal/Stakes-Relative Sufficiency.**
      *   *Revised (6):* "If you know p *in a context with stakes S*, then you are epistemically in the clear to act on p *in any context where the stakes for acting on p are S or lower*." Higher stakes require meeting the higher knowledge standard *applicable to those stakes*.
  *   **Refinement:** Slightly rephrase (7) to explicitly acknowledge the stakes-relativity within the concept: "What it is to know p (relative to stakes S) is to be in the epistemic position that entitles you to treat p as a premise in practical reasoning *where the stakes are S or lower*."
  *   **Addressing Your Friend:** Your friend is wrong that (2) and (3) force contextualism. SSI is a well-established invariantist alternative that accepts pragmatic encroachment. Their claim that (1) and (6) contradict is correct *if (6) is absolute*, but modifying (6) as above resolves it within an SSI framework.

  Your view hangs together well *as a form of SSI*, once you adjust the sufficiency claim (6) to acknowledge that the epistemic "clearance" provided by knowledge is calibrated to the stakes level at which that knowledge was attained. The main philosophical cost is embracing the idea that one can "lose" knowledge (or rather, fail to retain it under description) simply because the practical situation changes, even if one's evidence remains constant. This is the defining (and often criticized) feature of SSI, but it's the price of reconciling invariantism with pragmatic encroachment and your bank case intuitions.
