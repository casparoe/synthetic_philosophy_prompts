  Also, Hacking's "taxonomic incommensurability" emphasizes how classification changes disrupt communication, aligning with the "mass" and "gene" examples. The user's description of the transition feeling like "learning to see something that had been there all along" echoes Kuhn's perceptual gestalt shifts. 

