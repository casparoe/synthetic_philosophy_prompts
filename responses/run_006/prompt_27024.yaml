  No need to coin a new term—Kuhn's later work already covers it. Highlighting Hacking's contribution adds depth. Conclude by affirming the phenomenon's named status and its boundaries with adjacent concepts, giving them a solid reference point for further exploration.
answer: |-
  The phenomenon you describe is best understood as **local meaning variance within Kuhnian incommensurability**, specifically emphasizing the *rational resolvability* of conceptual transitions despite semantic discontinuity.  

  ### Key Reasoning:  
  1. **Core Concept**: This aligns with Kuhn’s later refinements of *incommensurability* (post-*Structure of Scientific Revolutions*), where he stressed that meaning change is **local** (affecting specific terms like "mass," "gene") rather than global. Ian Hacking termed this "taxonomic incommensurability"—competing paradigms classify the world differently, making direct translation impossible.  

  2. **Distinction from Classic Incommensurability**:  
     - Your observation that the transition *is* rational despite semantic gaps addresses a common critique of Kuhn. He later clarified that incommensurability **does not preclude rational comparison**; it means evidence is evaluated within a framework. The "gestalt shift" (Kuhn’s own analogy) allows scientists to reconceive anomalies *as* evidence within the new framework.  

  3. **Relation to Neighbouring Ideas**:  
     - **Theory-ladenness**: Explains *why* there’s no neutral evidence: observations are interpreted through conceptual schemes.  
     - **Semantic holism**: Meanings depend on a web of theoretical commitments (e.g., "mass" in Newtonian vs. relativistic contexts).  
     - **Reference change**: Hilary Putnam’s "meaning determines reference" captures how "mass" shifts from "quantity of matter" to "invariant rest energy."  

  4. **Boundaries**:  
     - **Not mere semantic drift**: Unlike gradual linguistic evolution, this involves **systematic redefinition** driven by empirical anomalies and heuristic power (e.g., relativistic mass resolving Michelson-Morley).  
     - **Not stalemate**: Unlike Feyerabend’s radical incommensurability, your cases show *asymmetric progress*: the new framework demonstrably solves problems the old one couldn’t.  

  5. **Naming Precision**:  
     - While "local incommensurability" is established, your emphasis on *rational transition* via gestalt shift merits the fuller descriptor: **"gestalt-switch resolvable incommensurability."** This distinguishes it from purely linguistic or irrational paradigm shifts.  

  ### Why This Fits Your Cases:  
  - **Mass in relativity**: Newtonian mass (invariant scalar) vs. relativistic mass (velocity-dependent) exemplify local meaning variance. The "evidence" (e.g., particle accelerator data) only becomes decisive when interpreted within relativity’s spacetime geometry.  
  - **Biology’s "gene"**: The molecular redefinition (DNA sequence) versus classical "unit of heredity" created referential divergence—yet the molecular framework prevailed by explaining mutation, regulation, etc.  

  ### Literature References:  
  - Kuhn, "Commensurability, Comparability, Communicability" (1983) — clarifies rational comparability.  
  - Hacking, "Working in a New World" (1993) — analyzes taxonomic shifts.  
  - Sankey, *The Incommensurability Thesis* (1994) — distinguishes local/global variants.  

  This configuration is a *specific, resolvable subtype of incommensurability*, where semantic discontinuity is overcome not by translation but by pragmatic adoption of a superior framework through gestalt-driven reinterpretation of evidence.
