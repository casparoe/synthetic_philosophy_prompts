  We need to build the tree with diagnostic questions that are concrete and don't require knowing the labels. The leaves should be the positions, including the four specified:

  1. The regress is vicious and deduction cannot be justified (skeptical conclusion).
  2. The regress is stopped by a non-propositional grasp of inference rules (a kind of knowing-how).
  3. Logical rules are inference licenses, not premises, so the regress never gets started.
  4. The regress is benign because we are entitled to default trust in our basic inferential dispositions.

  We aim for 6-10 leaves. We'll also note any positions that the tree cannot cleanly separate and any logically possible but undefended positions.

