prompt: |-
  I am a novelist, and several times a year I face the same decision in a sharper form than most writers admit: a trusted editor or early reader tells me that a scene, a character, or an ending does not work, I disagree, and I must decide whether to revise on their say-so or hold to my own judgment. I know enough about the epistemology of disagreement to see that my own conviction is only one piece of evidence, and that evidence about my reliability — that I am exhausted, that I am attached to what I wrote, that this reader has been right before — is a different kind of evidence that should not be treated as just another first-order consideration. But I also know there is a live dispute over whether it can ever be rational to believe p while believing that my evidence says I am unreliable about p, and I do not know how to bring that dispute to bear on a working deadline. Please write me a reusable decision procedure, grounded in the higher-order evidence and epistemic akrasia literature, that I can run whenever a trusted reader and I disagree about a substantive revision. Fix the role and stakes: I am the final authority on the manuscript, revisions are costly in time and confidence, and I need an answer within a few days. The procedure should say which questions to ask in order, what counts as a sufficient answer to each, where it tells me to defer even when I feel strongly, where it tells me to hold firm, and where it must hand the decision back to unaided judgment because no rule settles it. Then apply it to two cases: a developmental editor with a strong track record says my ending is unearned while I am convinced it is the only right ending; and a first-time beta reader I respect says a secondary character acts inconsistently while I think the reader has missed the point of the character. Include at least one case in which the procedure tells me to do something I will not like, and be explicit about which steps are judgment calls dressed up as procedure.
reasoning: |-
  We are designing a decision procedure for a novelist facing substantive revision disagreements with trusted readers. The procedure must account for higher-order evidence (evidence about the reliability of one's own judgment) and avoid epistemic akrasia (believing p while believing the evidence suggests one is unreliable about p). The novelist is the final authority, revisions are costly, and decisions must be made within days.

   The procedure will consist of a series of questions. At each step, if the answer meets a specified condition, we take a decision (defer or hold firm) or move to the next question. If we get to the end, we hand back to unaided judgment.

   Steps:

   1. **Assess the reader's reliability on this type of issue.**
      - Ask: Has this reader been consistently right about similar issues in the past? (e.g., plot structure, character consistency, thematic resonance)
      - Sufficient to defer: If the reader has been right at least 80% of the time on this type of issue (by your own retrospective judgment) and has a track record of at least 3-5 instances.
      - If yes, defer to the reader and revise. (This step overrides your own current conviction because the higher-order evidence of the reader's reliability and your potential unreliability on the issue is strong.)
      - If no, move to step 2.

   2. **Assess your own current reliability.**
      - Ask: Are there strong indicators that your judgment on this issue is currently impaired?
          - Exhaustion: Are you severely sleep-deprived, emotionally drained, or physically unwell?
          - Attachment: Are you so attached to the passage (e.g., because it's autobiographical, required great effort, or is a personal favorite) that you have a hard time seeing its flaws?
          - Conflict of interest: Are you resisting because the revision would require massive restructuring or abandonment of a cherished idea?
      - Sufficient to override your conviction: If at least two of these indicators are strongly present (e.g., you are both exhausted and attached, or attached and facing a major conflict of interest) then defer to the reader and revise.
      - If not, move to step 3.

   3. **Assess the nature of the disagreement.**
      - Ask: Is the reader's criticism specific, actionable, and grounded in the text? (e.g., "The character's action on page 200 contradicts their motivation on page 50" vs. "I didn't like the ending")
      - Also ask: Is your defense of the current version specific and grounded in the text? (e.g., "The character's action is consistent because of an internal conflict set up on page 75 that the reader might have missed")
      - If the reader's criticism is vague and your defense is specific, hold firm.
      - If the reader's criticism is specific and your defense is vague or emotional (e.g., "I just feel it's right"), then defer and revise.
      - If both are specific, move to step 4.

   4. **Seek independent evidence.**
      - Ask: Can you get a second opinion from another trusted reader on this specific issue within the deadline? 
          - If yes, and the second reader agrees with the first, then defer and revise.
          - If the second reader agrees with you, then hold firm.
          - If the second reader is unavailable or undecided, or if the deadline doesn't allow, then move to step 5.

   5. **Assess the stakes of being wrong.**
      - Ask: What are the costs of revising when the current version is actually right vs. not revising when the reader is right?
          - Consider: 
              - Cost of unnecessary revision: time, loss of confidence, risk of introducing new problems.
              - Cost of leaving a flaw: damage to the book's reception, loss of reader trust, negative reviews.
      - If the cost of leaving a flaw is high (e.g., it's a major issue like the ending) and the cost of revision is moderate, then revise.
      - If the cost of revision is very high (e.g., requires rewriting half the book) and the cost of leaving the flaw is moderate (e.g., a minor character inconsistency that few might notice), then hold firm.
      - If the costs are unclear or balanced, move to step 6.

   6. **Hand back to unaided judgment.**
      - At this point, the procedure cannot decide. You must rely on your own judgment, knowing that you have done due diligence.

   Now, we apply to two cases.

   **Case 1: Developmental editor with a strong track record says the ending is unearned.**
      - Step 1: The editor has a strong track record (say 90% right on structural issues). This meets the condition (at least 80% and 3-5 instances). 
          - **Decision: Defer and revise.**

      However, let's note: the procedure forces you to revise even if you are convinced it's the only right ending. This is because the higher-order evidence (the editor's reliability and your potential unreliability) is strong enough to override your first-order conviction.

   **Case 2: First-time beta reader I respect says a secondary character acts inconsistently.**
      - Step 1: First-time reader, so no track record. Move to step 2.
      - Step 2: Assess your own reliability. Let's assume you are not exhausted, but you might be attached to the character? 
          - If you are attached and also there's a conflict (revising the character might require significant work), and if two of the indicators are strong (attachment and conflict), then you would defer. But let's assume only one is present (attachment). Then move to step 3.
      - Step 3: The reader says the character acts inconsistently. You think they missed the point. 
          - We need to assess: 
              - Reader's criticism: If they point to specific actions and pages, it's specific. 
              - Your defense: If you can point to specific text that sets up the character's internal conflict (which the reader might have missed) then your defense is specific.
          - Since both are specific, we move to step 4.
      - Step 4: Can you get a second opinion? Within a few days, maybe not. If not, move to step 5.
      - Step 5: Assess stakes. 
          - Cost of leaving a flaw: A secondary character inconsistency might be noticed by some readers and might slightly damage the book, but it's not catastrophic. 
          - Cost of revision: Might require rewriting several scenes and reworking the character's arc, which is time-consuming and might affect the timeline.
          - If the cost of revision is high and the cost of the flaw is moderate, then hold firm.
          - **Decision: Hold firm.**

   Now, we must include a case where the procedure tells you to do something you won't like.

   **Case 3: (Hypothetical) You are exhausted and attached, and a reader with a moderate track record (say 70% on similar issues) points out a flaw in a key scene.**
      - Step 1: The track record is 70%, which is below 80%. So we don't defer at step 1. Move to step 2.
      - Step 2: You are exhausted and attached (two strong indicators). Therefore, the condition is met: defer to the reader and revise.
          - **Decision: Defer and revise.**
      - This decision might be unpleasant because you believe in the scene and the reader is not perfect, but the procedure says that your current unreliability is a bigger concern.

   Note: Some steps are judgment calls dressed as procedure. Specifically:
      - Step 1: What counts as "similar issues"? How do we quantify 80%? (You must use your judgment to categorize and recall past instances.)
      - Step 2: Assessing the strength of your own exhaustion, attachment, and conflict of interest is subjective.
      - Step 3: Deciding if the criticism or defense is "specific" and "grounded in the text" requires interpretation.
      - Step 5: Weighing costs is inherently subjective.

   However, the procedure forces you to confront these questions systematically.
answer: |-
  ### Decision Procedure for Revision Disagreements with Trusted Readers

  **Grounding Principles:**  
  - **Higher-Order Evidence (HOE):** Evidence about your reliability (e.g., exhaustion, attachment) must be treated separately from first-order evidence (e.g., "the ending feels right").  
  - **Epistemic Akrasia:** Avoid believing "p is true" while simultaneously believing "my evidence suggests I’m unreliable about p." Rationality may require deferring to external HOE even when first-order conviction is strong.  
  - **Stakes & Constraints:** Revisions are costly (time/confidence), you are the final authority, and decisions must be made within days.  

  **Procedure:**  
  Ask these questions in order. Stop and act if a condition is met. If all steps are exhausted, return to unaided judgment.  

  1. **Is the reader’s reliability on this issue significantly higher than mine?**  
     - *Ask:* "Has this reader been right about similar issues (e.g., pacing, character arcs) at least 80% of the time in my past projects?"  
     - *Sufficient to defer:* **Yes, with ≥3 concrete examples.**  
       - *Rationale:* Strong HOE that you should override your judgment (e.g., track record trumps current conviction).  
     - *Hold firm if:* No track record, or <80% accuracy.  
     - *Next if:* Ambiguous (e.g., 70% accuracy).  

  2. **Is my current judgment likely impaired?**  
     - *Ask:* "Are ≥2 of these true?  
       - I am exhausted/stressed (e.g., deadline fatigue).  
       - I am emotionally attached (e.g., scene is autobiographical).  
       - Revising would invalidate >10 hours of work."  
     - *Sufficient to defer:* **Yes.**  
       - *Rationale:* HOE indicates unreliability; akrasia risk outweighs conviction.  
     - *Hold firm if:* 0–1 factors apply.  

  3. **Is the criticism objective and mine subjective?**  
     - *Ask:*  
       - "Is the reader’s critique specific (e.g., ‘Page 205 contradicts the character’s trauma on p. 32’)?"  
       - "Is my defense vague (e.g., ‘It feels right’ or ‘They don’t get it’)?"  
     - *Sufficient to defer:* **Critique is specific AND my defense is vague.**  
     - *Hold firm if:* Critique is vague OR my defense is specific (e.g., "The reader missed the foreshadowing in Chapter 3").  
     - *Next if:* Both are specific/objective.  

  4. **Can I test the disagreement cheaply?**  
     - *Ask:* "Can I gather 1–2 additional data points within 48 hours (e.g., ask another reader for a quick opinion)?"  
     - *Sufficient to defer:* **New data agrees with the reader.**  
     - *Hold firm if:* New data agrees with me.  
     - *Next if:* Testing is infeasible or inconclusive.  

  5. **What is the cost of error?**  
     - *Ask:*  
       - "If I’m wrong and don’t revise, how bad is the damage (e.g., ruins ending vs. minor plot hole)?"  
       - "If I’m right but revise, how costly is it (e.g., 1 week lost vs. 1 day)?"  
     - *Defer if:* **Damage of not revising > 2× cost of revising** (e.g., flawed ending risks book reception).  
     - *Hold firm if:* Cost of revising > 2× damage of flaw (e.g., minor inconsistency).  
     - *Return to judgment if:* Costs are comparable.  

  6. **Return to unaided judgment.**  
     - *If all steps fail:* Use your best intuition. HOE is inconclusive.  

  ---

  ### Application to Cases  

  **Case 1: Developmental Editor Says Ending Is Unearned**  
  - **Step 1:** Editor has strong track record (e.g., 90% right on structural issues). *→ DEFER (revise).*  
    - *Why you won’t like it:* Your conviction is overruled by their reliability. HOE (their track record) demands akrasia: "I believe the ending works, but I should not trust that belief."  

  **Case 2: Beta Reader Says Character Acts Inconsistently**  
  - **Step 1:** First-time reader → no track record. *Next.*  
  - **Step 2:** You feel attached to the character? Assume 1 factor (attachment) → not sufficient. *Next.*  
  - **Step 3:**  
    - Reader’s critique: Specific (e.g., "Character is timid in Ch. 2 but aggressive in Ch. 10 without explanation").  
    - Your defense: Specific (e.g., "Reader missed the trauma reveal in Ch. 5 that explains the shift"). *→ HOLD FIRM.*  
    - *Rationale:* No HOE favors the reader; your objective defense counters their critique.  

  **Case 3 (Hypothetical Unpleasant Outcome): Exhausted and Attached with Moderate-Trust Reader**  
  - *Scenario:* A sensitivity reader (60% past accuracy) flags cultural insensitivity. You’re exhausted and attached to the scene.  
  - **Step 1:** 60% accuracy < 80% → *Next.*  
  - **Step 2:** Exhausted + attached → ≥2 impairment factors. *→ DEFER (revise).*  
    - *Why you won’t like it:* HOE (your impairment) forces deferral despite weak reader reliability. Akrasia is rational here.  

  ---

  ### Judgment Calls Dressed as Procedure  
  - **Step 1:** Assessing "similar issues" and "80% accuracy" relies on subjective recall.  
  - **Step 2:** Quantifying exhaustion/attachment is intuitive (e.g., "severe" vs. "mild").  
  - **Step 5:** Cost/damage multipliers (2×) are heuristic; real stakes may vary.  

  **Final Note:** This system forces explicit engagement with HOE, reducing impulsive decisions. When it returns to unaided judgment (Step 6), you act with clarified stakes.
