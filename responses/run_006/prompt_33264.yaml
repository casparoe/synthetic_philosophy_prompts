  ### **Multipolar Trap Simulation: "The Commons Race"**  
  **Objective:** Create a visceral experience of the Moloch dynamic where individually rational choices lead to collective collapse, despite awareness of the trap.

  ---

  ### **Game Rules & Setup**  
  **Materials:**  
  - Whiteboard/projector for tracking scores.  
  - 16 index cards (one per student) for secret voting.  
  - Timer.  
  - Stakes: 1 point = 0.1% of final grade (or 1 piece of candy). Total possible: 25 points per student.  

  **Groups:**  
  - 4 groups of 4 students (Groups A, B, C, D).  
  - Each group shares a "Common Resource" (e.g., a fishery).  

  **Resource Rules:**  
  - Each group’s resource starts at **12 "units"** (e.g., fish, energy tokens).  
  - **Each round (5 rounds total)**, students secretly choose to:  
    - **Conserve (0 units)**  
    - **Moderate Harvest (1 unit)**  
    - **Max Harvest (2 units)**  
  - **Group Total Harvest** = Sum of individual choices.  
  - **Resource Update:**  
    - If harvest ≤ current resource:  
      - Next round’s resource = `min(12, (Current Resource - Harvest) + 3)`  
    - If harvest > current resource **OR** post-harvest resource **< 4**:  
      - **Collapse!** Resource = 0 for all future rounds.  

  **Scoring:**  
  - **Individual Points** = Units harvested × 1 point.  
  - **Ranking Bonus (escalating competition):**  
    - Groups ranked by **total harvest per round** (highest to lowest).  
    - 1st place: +3 pts/student  
    - 2nd place: +2 pts/student  
    - 3rd place: +1 pt/student  
    - 4th place: +0 pts  
    - *Tiebreaker:* Group with earlier alphabetical ID wins.  

  **Communication Phase:**  
  - After **Round 2**, a 5-minute open discussion (within/between groups) is allowed. Promises are non-binding.  

  ---

  ### **Timeline (40 min)**  
  1. **Introduction (5 min):**  
     - Explain rules, stakes, and scoring. Emphasize: *"Your goal is to maximize personal points."*  
     - Assign groups and display initial resources (12 per group).  

  2. **Rounds 1-2 (10 min):**  
     - **Each round (3 min):**  
       - Students write choices on cards (0, 1, or 2).  
       - Teacher collects cards, calculates harvests, updates resources/scores on board.  
       - Announce rankings and bonuses.  
     - *No talking allowed.*  

  3. **Communication (5 min):**  
     - Students negotiate freely. *Hint:* Ask, *"Can you coordinate to avoid collapse?"*  

  4. **Rounds 3-5 (15 min):**  
     - Repeat Round 1-2 process. *No talking.*  

  5. **Final Scoring (5 min):**  
     - Calculate total points (harvest + bonuses).  

  ---

  ### **Predicted Dynamics & Adjustments**  
  **What Will Go Wrong (and Fixes):**  
  1. **Problem: Early Collusion**  
     - Groups agree pre-game to all choose "Moderate Harvest (1)."  
     - **Fix:** Add a "secret defector" incentive. After Round 1, reveal that *any student* choosing "2" in a round where their group’s total ≤4 gets a +1 pt stealth bonus. This mirrors real-world hidden incentives.  

  2. **Problem: Deliberate Tanking**  
     - A student chooses "0" to "save the resource," sacrificing personal points.  
     - **Fix:** Escalate competition. Announce in Round 3: *"The lowest-ranked group today loses 2 pts/student."* Increases fear of falling behind.  

  3. **Problem: Trap Not Triggering**  
     - Groups never approach collapse due to overcautious play.  
     - **Fix:** Tighten parameters:  
       - Reduce regeneration from +3 to +2.  
       - Lower collapse threshold from <4 to <5.  

  4. **Problem: Unintended Coordination**  
     - Groups discover stable harvesting (e.g., all choose "1" forever).  
     - **Fix:** Inject scarcity. After Round 2, announce: *"Resource regeneration rate drops to +1 due to external factors."* Forces reevaluation.  

  ---

  ### **Debrief Script (35 min)**  
  **Goal:** Map game dynamics to multipolar traps and the Moloch metaphor.  

  1. **Emotional Reflection (5 min):**  
     - *Question:* "Raise your hand if you knew collapse was coming but still harvested max. Why?"  
     - *Key Point:* Highlight moments of powerlessness (e.g., "I knew we’d crash, but I needed bonus points").  

  2. **Mapping the Trap (10 min):**  
     - **Payoff Matrix (draw on board):**  
       | *Your Choice* | Others Choose "1" | Others Choose "2" |  
       |---------------|-------------------|-------------------|  
       | **Conserve (0)** | 0 pts (worst)    | 0 pts (worst)     |  
       | **Moderate (1)** | 1 + bonus?       | 1 + low bonus?    |  
       | **Max (2)**     | 2 + high bonus   | 2 + bonus? → **Collapse** |  
       - *Analysis:* "Max Harvest" is dominant strategy (best outcome if others conserve/moderate), but mutual "Max" = collapse.  

     - **Binding Commitments:**  
       - *Question:* "Did communication help? Why did agreements break?"  
       - *Insight:* Cheap talk fails without enforcement (e.g., Group A promised "Moderate" but chose "Max" to win bonuses).  

  3. **Moloch as the Villain (5 min):**  
     - *Metaphor:* "Moloch is the god of perverse incentives. In this game, Moloch was the force that made you harvest against your own judgment. What did Moloch demand of you?"  
     - *Student Answers* (e.g., "Beat other groups," "Don’t trust others").  
     - *Connection:* "Moloch is the emergent outcome of competition + individual rationality."  

  4. **Real-World Links (10 min):**  
     - **Formal Structure:**  
       - *Transparency:* "You saw resources depleting—just like climate change data. Why wasn’t that enough?"  
       - *Iteration:* "Short-term bonuses (quarterly profits) outweighed long-term collapse."  
     - **Examples:**  
       - *Arms Races:* "Like groups fighting for Rank 1, countries build nukes to avoid being 4th."  
       - *Soviet Collapse:* "Local officials lied about crop yields to hit quotas, causing systemic collapse."  
     - **Limitations of the Game:**  
       - *Omitted:* **Power asymmetry** (all groups equal), **external enforcers** (e.g., treaties), **slow timescales** (collapse in 40 min vs. decades).  
       - *Debrief:* "Real traps involve unequal actors, legal systems, and uncertainty. Solving them requires building institutions—not just 'cooperating'."  

  5. **Closing (5 min):**  
     - *Question:* "What would you design to escape Moloch in the real world?"  
     - *Takeaway:* "Coordination requires credible commitment (e.g., penalties for defectors), not just goodwill. Tomorrow, we’ll study Ostrom’s rules for managing commons."  

  ---

  ### **What the Game Cannot Capture**  
  1. **Gradual, Imperceptible Collapse:**  
     - Real-world traps (e.g., climate change) unfold over generations; the game compresses time.  
     - *Debrief Mitigation:* "Unlike this game, real traps lack clear 'rounds.' By the time collapse is visible, it’s often too late."  

  2. **Complex Institutions:**  
     - Binding agreements (e.g., climate treaties) require courts, monitors, and adaptive norms—absent here.  
     - *Debrief Mitigation:* "In class, you had no enforcement mechanism. Real solutions need trusted third parties."  

  3. **Asymmetric Power:**  
     - All groups had equal power; real traps (e.g., corporate pollution) involve dominant actors.  
     - *Debrief Mitigation:* "Moloch worsens when one actor (e.g., a superpower) can force others into suboptimal choices."  

  4. **Uncertainty:**  
     - Students knew exact resource levels; real actors work with incomplete data.  
     - *Debrief Mitigation:* "Imagine playing with hidden resources—like real policymakers guessing CO2 thresholds."  

  **Final Note:** The game’s strength is emotional resonance, not realism. Use debrief to stress: *"Escaping Moloch isn’t about 'smarter' individuals—it’s about designing wiser systems."*  

  ---
  **Runtime Tip:** Assign a student as "Scorekeeper" to speed up calculations. Use predefined Excel sheets for instant resource/bonus updates.  
  **First-Run Advice:** Start with generous parameters (e.g., +3 regeneration). If collapse happens too early, adjust regeneration upward mid-game to extend play.
