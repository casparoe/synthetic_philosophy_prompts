  ok so i've been reading about expected value fanaticism and i think i get the basic idea — like if you have a tiny tiny chance of getting an infinite payoff, the math says you should go for it even if it means almost certainly making things worse in every other way. but all the examples people give are super abstract, like pascals mugger or whatever. can you write me a short story that actually makes you feel the pull of the argument? like put me in the head of someone who has to make this kind of decision and is genuinely torn about it. the stories people tell about this stuff are always so dry and i want something that actually makes the dilemma feel real, not just like a philosophy thought experiment with character names slapped on.
