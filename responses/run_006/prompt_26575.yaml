  - The cost (her home) represents stability and memory—something irreplaceable.  
  - The "infinite" payoff isn't guaranteed; it's a probabilistic wager. That uncertainty is where the tension lives.  

  The ending should linger in ambiguity. No neat answers. Let the math (infinite value times nonzero chance) echo in her hollow victory. Her trembling hands holding the deed while space glows outside? That’s the feeling the user wants—the awful weight of a rational bet that *feels* like madness.
