prompt: |-
  So I run this little philosophy discussion group at my local library — it's mostly retirees and a couple of undergrads from the community college, smart people but no formal training in philosophy. Next week I want to do a session on Moore's paradox, you know, the thing about "It's raining, but I don't believe it." I've always found it weirdly slippery: it's obviously not a logical contradiction in the way "it's raining and it's not raining" is, but asserting it still feels like you've done something wrong, and pinning down exactly what that wrongness consists in turns out to be harder than it looks.

  I don't want you to explain Moore's paradox to me — I've read the stuff. What I need is a plan for how to *teach* it in about forty minutes to this group. Specifically: what has to go first and why (I'm guessing you can't just open with the sentence and expect people to see the problem), what one example or scenario should carry the whole discussion and what features it needs to have, which misconceptions are going to crop up — I can already imagine someone saying "well that's just the liar paradox, right?" or "it's contradictory because if you believe it's raining you can't also believe you don't believe it" — and at what point in the sequence I should head each one off. Also, what should I deliberately *not* get into at this level (I'm guessing the whole Wittgensteinian private-language-argument angle is a no-go, but maybe there's other stuff too), and what's one question I can ask near the end that would tell me whether they've actually grasped the paradox rather than just nodding along. I want to leave them unsettled in the right way, not confused in the wrong way.

  And please take a stand on the pedagogical choices — don't give me three options for the carrying example and tell me to pick. Tell me which one you'd use and why it beats the alternatives. I need a committed plan I can actually walk in with.
