prompt: |-
  I'm on my university's IRB and we're reviewing a behavioral econ experiment where subjects play a variant of the Pasadena game for real money. Quick background: the Pasadena game is that thing where you flip a coin til it lands tails, and if it lands tails on flip n you get paid (-1)^(n-1) * (2^n)/n dollars. The expected value is the alternating harmonic series, which converges conditionally but not absolutely — so the EV is undefined (you can reorder the terms to get any value you like). The researchers want to see whether people avoid gambles with undefined EVs when the weirdness is explained to them. Half the board thinks this is flatly unethical: informed consent requires the participant to assess whether the gamble is favorable, and here there's literally no fact of the matter. The other half says that's nonsense, people face undefined-EV situations all the time (any heavy-tailed risk), and anyway the point is to study how people handle exactly that. Draft the decision memo — approve, reject, or approve with conditions. I need reasoning that actually grapples with the philosophy of undefined expected values and what it means for consent, not just a recitation of the regs.
reasoning: |-
  Okay, the user is on their university's IRB and they're reviewing a behavioral economics experiment involving the Pasadena game. Let me start by understanding the core issue here. The Pasadena game has an undefined expected value because of the conditional convergence of the alternating harmonic series. The researchers want to see if people avoid such gambles when the undefined nature is explained. The IRB is split: one side thinks it's unethical because participants can't assess the gamble's favorability, which is required for informed consent. The other side argues that undefined EVs are common in real life, like heavy-tailed risks, and the study's purpose is to explore how people handle such ambiguity.

  First, I need to unpack the ethical dilemma around informed consent. The key point is whether participants can truly understand that there's no objective expected value. If the explanation isn't clear, participants might mistakenly believe there's a calculable EV, leading to a false assessment of risk. That undermines autonomy. But if the explanation is effective, then participants are making a decision based on understanding the ambiguity, which aligns with the study's goals.

  Next, the philosophical aspect: undefined EV. In standard gambles, even with uncertainty, there's usually an expected value. Here, there isn't one, and reordering terms can produce any value. This isn't just about high variance; it's a fundamental indeterminacy. The consent form needs to convey this without misleading participants into thinking they can compute an average outcome.

  Looking at regulations, Belmont principles come into play: respect for persons (autonomy), beneficence (minimizing harm), justice (fair selection). The main issue is autonomy. Participants must grasp that they can't rely on traditional risk assessment. The researcher's explanation must be tested for clarity. Maybe a pilot test or comprehension checks could ensure understanding.

  The other side argues that people face similar ambiguities in real life, like unpredictable markets or rare events. Studying this could provide insights into decision-making under indeterminacy. But the ethical concern is whether the lab setting and monetary stakes create a different context where participants might feel pressured despite understanding the ambiguity.

  Conditions for approval could include a robust consent process. For example, the explanation must explicitly state that there's no mathematically defined expected value, using examples or analogies. Comprehension checks would verify understanding. Also, capping payouts and ensuring no significant losses protect participants from harm. Debriefing is crucial to address any misconceptions post-trial.

  Rejecting the study might be too harsh if the researchers can address the consent issues. But approving without conditions ignores the real risk that participants might not grasp the undefined EV. The middle path—approval with strict conditions—seems balanced. It allows the research to proceed while safeguarding participants' autonomy through enhanced informed consent measures.

  I should also consider the researchers' intent. They aim to explore how people react to undefined EVs, which is a valid scientific question. If participants are properly informed, their decision to participate becomes part of the study on handling indeterminacy. However, the implementation is key. The consent process must be foolproof to avoid undermining the ethical foundation.

  Potential risks: Participants might lose money, but caps minimize this. More importantly, psychological harm from feeling deceived if they later realize they couldn't assess the gamble. Debriefing can mitigate this by clarifying the study's purpose and the nature of undefined EVs.

  In conclusion, the memo should approve with conditions focused on consent clarity, comprehension verification, financial protections, and debriefing. This addresses the ethical concerns while supporting the research's goals. The reasoning should emphasize that with proper safeguards, participants can autonomously choose to engage with the indeterminacy, which is the phenomenon under study.
answer: |-
  ## IRB Decision Memo: Pasadena Game Experiment (Behavioral Econ)

  **Experiment Title:** Decision-Making Under Indeterminate Expected Value: The Pasadena Game  
  **Researchers:** [Researcher Names/Department]  
  **IRB Case #:** [Insert Case Number]  
  **Decision:** **APPROVED WITH CONDITIONS**  

  **Reasoning:**

  This decision acknowledges the profound ethical and philosophical challenge raised by both sides of the board regarding informed consent in the context of a gamble with a mathematically undefined Expected Value (EV). The core tension lies in reconciling the principle of participant autonomy and comprehension with the scientific validity of studying decision-making under conditions of fundamental indeterminacy.

  1.  **Grappling with the "Undefined EV" and Consent:**
      *   **The Ethical Concern (Valid):** Traditional informed consent for financial gambles implicitly relies on the participant's ability (or the researcher's provision of information) to form *some* assessment of the risk/reward profile – "Is this gamble, *on average*, likely to be favorable, unfavorable, or fair?" The Pasadena game's undefined EV makes this assessment *logically impossible*. There is **no objective "average" outcome** to evaluate; any finite sequence of plays is merely a sample from a distribution lacking a central tendency. Requiring participants to "assess favorability" when no such property exists *could* be seen as demanding the impossible, potentially undermining the basis for meaningful consent.
      *   **The Researcher's Counterpoint (Also Valid):** Real-world decisions often involve risks with poorly defined, unknowable, or fundamentally indeterminate expected outcomes (e.g., existential risks, highly novel technologies, long-term societal changes, ventures involving complex chaotic systems). Studying how individuals respond to *explicitly presented* indeterminacy is a scientifically valuable question. Avoiding such research on ethical grounds risks neglecting a significant aspect of human decision-making under uncertainty.

  2.  **Resolution: Shifting the Focus of Consent:**
      *   The ethical hurdle is not insurmountable, but it requires a fundamental reframing of the informed consent process. Consent cannot be based on assessing the gamble's favorability *in the traditional sense*.
      *   **The core information for consent must be:** **"This gamble has no mathematically defined long-run average value (expected value). It is fundamentally indeterminate in a specific mathematical sense. Your outcome in any single play depends entirely on the sequence of coin flips, and there is no reliable way to predict whether playing will be profitable or not *over the long term*."**
      *   The participant's task shifts from "Is this gamble good?" to "Am I willing to engage in a gamble where the very concept of a long-run average payout is meaningless, knowing I might win or lose money based purely on chance in this single instance (or short sequence)?"

  3.  **Why Approval (with Conditions) is Appropriate:**
      *   **Scientific Merit:** The research question – how people respond to explicitly explained indeterminate EV – addresses a recognized gap in behavioral economics (heavy-tailed risks, Knightian uncertainty). It moves beyond simple risk aversion into the realm of ambiguity about the *nature* of the risk itself.
      *   **Respect for Persons (Autonomy):** Autonomy is preserved *if and only if* the indeterminate nature of the EV is communicated **effectively and unambiguously**. Participants must understand that they are *not* being asked to judge a favorable/unfavorable bet, but rather to choose whether to engage with a fundamentally indeterminate proposition. Their choice to participate *despite* this indeterminacy becomes the valid expression of autonomy.
      *   **Beneficence (Minimizing Harm):** The financial risks appear bounded (implied by "real money" within a controlled experiment; explicit caps are required - see Conditions). The primary psychological risk is confusion or a feeling of deception if the indeterminacy is not adequately grasped. This is mitigated by the explicit focus of the consent process and debriefing.
      *   **Justice:** Participant selection and compensation structures (e.g., show-up fee plus winnings/losses from the game, capped) seem standard and fair for behavioral econ experiments. The burden of understanding is addressed by the required clarity in consent.
      *   **The Philosophical Reality:** The board arguing that "people face undefined-EV situations all the time" is essentially correct regarding the *phenomenon* of indeterminacy. This experiment makes that indeterminacy explicit and controlled, allowing it to be studied. Prohibiting research on this basis would be akin to prohibiting research on ambiguity aversion because ambiguity exists.

  **Conditions for Approval:**

  The approval is **strictly contingent** on the researchers revising the protocol and consent materials to explicitly and effectively address the indeterminate EV. The IRB must review and approve these revised documents before the study commences.

  1.  **Consent Form & Explanation Revision:**
      *   The consent form **must explicitly state** in clear, non-technical language that the gamble has **"no mathematically defined expected value" or "no long-run average payout"**.
      *   The explanation to participants **must clearly differentiate** this from simply high variance or unknown probability. It must convey the **fundamental indeterminacy** (e.g., "Unlike most games of chance, mathematicians have proven there is no single, objective answer to the question 'What is the average payout if this game is played forever?' - it depends on how you try to calculate it. This specific gamble is mathematically indeterminate in this unique way.").
      *   The explanation **must explicitly state** that because of this indeterminacy, participants **cannot reliably assess whether the gamble is favorable or unfavorable in the long run**. Their decision is based solely on their willingness to participate in a single instance (or short sequence) of a fundamentally indeterminate gamble.
      *   Include a **simple analogy** if possible (e.g., "Imagine asking 'What's the average height?' of a group where the concept of 'height' itself changes meaning depending on how you measure people. This gamble has a similar issue with 'average payout'.").
      *   Remove any language implying participants should or can assess the "favorability" of the gamble in the traditional EV sense.

  2.  **Comprehension Check (Mandatory):**
      *   Implement a **robust comprehension check** *after* the explanation but *before* obtaining consent and starting the task.
      *   This check must include questions **specifically designed to test understanding of the indeterminate EV**, not just the mechanics. Examples:
          *   "True or False: This game has a predictable long-run average payout." (Must answer False).
          *   "Can you reliably say whether this game is profitable to play many times? Why or why not?" (Must indicate indeterminacy).
          *   "What makes this gamble mathematically different from a standard coin flip game with known odds?" (Must mention undefined/lack of expected value).
      *   Participants who fail this comprehension check **must be excluded** from the main experiment. They may be compensated for their time up to that point. Researchers must report exclusion rates due to comprehension failure.

  3.  **Financial Safeguards:**
      *   **Absolute Cap on Losses:** Participants must be guaranteed they **cannot lose more than a clearly stated, reasonable amount** (e.g., their show-up fee, or a small fixed amount like $5). This must be explicit in the consent form.
      *   **Cap on Maximum Payout:** Implement a practical cap on the maximum possible payout per participant to ensure financial feasibility and manage risk for the research budget. State this cap in the consent form.
      *   **Clear Payout Structure:** The consent form must clearly state the show-up fee, the potential loss cap, and the potential gain cap.

  4.  **Debriefing:**
      *   The debriefing **must reiterate** the indeterminate nature of the EV and explain *why* this is mathematically distinct from high-variance gambles with defined EVs.
      *   It should emphasize that the *purpose* of the study was to understand decision-making precisely when this type of indeterminacy is present and explained.

  **Conclusion:**

  The ethical concerns regarding informed consent and undefined EV are serious and well-founded. However, they do not necessitate rejection. By rigorously reframing the consent process to focus explicitly on comprehension of the fundamental indeterminacy – and verifying that comprehension – participant autonomy can be respected. The scientific merit of studying decision-making under conditions of explicit mathematical indeterminacy justifies proceeding **under the strict conditions outlined above**. These conditions ensure participants are not misled into believing they can perform an impossible assessment and instead make a truly informed choice about engaging with indeterminacy itself.

  The revised protocol, consent forms, comprehension check script/questions, and debriefing script must be submitted for IRB review and approval prior to enrollment.

  **Signed,**

  [Your Name/Chair Name]
  Institutional Review Board
  [University Name]
  [Date]
