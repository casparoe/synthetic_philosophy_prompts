  Hmm, the user wants me to create a decision tree for the zombie conceivability argument against physicalism. This is for a graduate seminar handout to help students self-identify their position before reading the literature. I need to build it from logical space rather than position names.

  The opening question should be: "Does a complete physical description of a conscious being leave a genuine further question about what it's like to be that being? (Could someone know every physical fact about a conscious subject and still coherently wonder what it's like to be them?)" This captures the epistemic gap.

  The natural first split is the epistemic gap question. If someone answers no, they're heading toward type-A physicalism. If yes, we need to branch on why the gap exists.

  For the "yes" branch, I should ask whether the gap is conceptual (could never be closed by any knowledge) or empirical (could be closed by future knowledge). This separates type-B physicalism (conceptual gap) from type-C physicalism (empirical gap).

  Then for those who think the gap is conceptual, I need to address whether zombies are ideally conceivable and whether conceivability entails possibility. If they say conceivability entails possibility, that leads to dualism. If not, they might be type-B physicalists.

  For dualists, I should ask whether consciousness has causal powers - leading to interactionism or epiphenomenalism.

  For those who think conceivability doesn't entail possibility, I need to ask why zombies are impossible despite being conceivable. This separates type-B (phenomenal concepts explain the gap) from strong necessity views (brute a posteriori necessities).

  I should include Russellian monism as well. That would branch off when asking what explains the gap - if they say physical properties have intrinsic natures that ground consciousness.

  For positions denying the epistemic gap entirely, I need illusionism as an option.

  The leaves should include:
  - Type-A physicalism (awkward: must deny the obvious-seeming epistemic gap)
  - Type-B physicalism (awkward: phenomenal concepts are unique and irreducible)
  - Type-C physicalism (awkward: consciousness is physical but we can't grasp how yet)
  - Interactionist dualism (awkward: consciousness violates physical causal closure)
  - Epiphenomenalism (awkward: consciousness has no causal effects)
  - Russellian monism (awkward: physical properties have hidden intrinsic natures)
  - Illusionism (awkward: consciousness doesn't exist as it seems)
  - Strong necessity view (awkward: brute necessary connections with no explanation)
  - Global modal skepticism (awkward: we can't trust conceivability intuitions)

  I'll need to flag that type-B and type-C might be hard to distinguish - I can use a question about whether future science could close the gap. For Russellian monism vs strong necessity, I can ask whether consciousness is fundamental or grounded in physical properties.

  The decision tree should be presented clearly with questions and branches leading to positions with their awkward commitments noted. I'll also explain where combinations don't work and why.
answer: |-
  ## Zombie Argument Decision Tree

  **Opening Question:**  
  Does a complete physical description of a conscious being leave a genuine further question about what it's like to be that being? (Could someone know every physical fact about a conscious subject and still coherently wonder what it's like to be them?)

  *   **No →**  
      *   Then physical facts fully explain consciousness. Zombies are inconceivable: the idea contradicts itself under ideal reflection.  
          *   **→ Type-A Physicalism**  
              *   *Awkward Commitment:* Must insist the "what it's like" aspect is either illusory or fully capturable by physical/functional concepts alone, denying the *prima facie* intuitive gap.
  *   **Yes (There is an epistemic gap) →**  
      *   **Question:** Is this gap due to *our current ignorance*, or is it *conceptual/in principle* (meaning even an ideal reasoner couldn't close it with physical facts alone)?
          *   **Due to current ignorance →**  
              *   Future physics or neuroscience will explain how consciousness arises. Zombies are conceivable now but not ideally (we just can't see the contradiction yet).  
                  *   **→ Type-C Physicalism**  
                      *   *Awkward Commitment:* Must explain why this specific gap seems uniquely deep and resistant to closure compared to other historical explanatory gaps.
          *   **Conceptual/in principle →**  
              *   **Question:** Does the ideal conceivability of zombies entail their *metaphysical possibility*? (Could such a duplicate actually exist?)  
                  *   **Yes →**  
                      *   **Question:** Is consciousness (the "what it's like") causally efficacious? Does it affect the physical world?  
                          *   **Yes →**  
                              *   **→ Interactionist Dualism**  
                                  *   *Awkward Commitment:* Consciousness violates the causal closure of the physical domain, requiring fundamental new causal laws.
                          *   **No →**  
                              *   **→ Epiphenomenalism**  
                                  *   *Awkward Commitment:* Consciousness is a causally inert byproduct, playing no role in behavior or evolution.
                  *   **No (Conceivability ≠ Possibility) →**  
                      *   **Question:** What makes zombies metaphysically impossible?  
                          *   **The gap arises only from how we *think about* consciousness using unique "phenomenal concepts", not from reality itself. →**  
                              *   **→ Type-B Physicalism (Phenomenal Concept Strategy)**  
                                  *   *Awkward Commitment:* Phenomenal concepts are radically different from physical/functional concepts yet refer to the same physical property, creating a unique conceptual gap.
                          *   **Consciousness is grounded in the intrinsic nature of physical properties, which physics doesn't describe. →**  
                              *   **→ Russellian Monism (Type-F Monism)**  
                                  *   *Awkward Commitment:* Physical properties have hidden "proto-phenomenal" intrinsic natures that constitute consciousness.
                          *   **There is simply a brute, inexplicable necessary connection between the physical and phenomenal; zombies are impossible despite being conceivable. →**  
                              *   **→ Strong Necessity View**  
                                  *   *Awkward Commitment:* Accepts necessary connections with no conceptual or structural explanation, making them brute a posteriori facts.
                          *   **We can't trust conceivability intuitions about fundamental metaphysics like this at all. →**  
                              *   **→ Global Modal Skepticism**  
                                  *   *Awkward Commitment:* Undermines the reliability of thought experiments and modal reasoning for core metaphysical questions.
                  *   **Question:** But is there really anything that "it is like" in the first place? Is phenomenal consciousness real?  
                      *   **No →**  
                          *   **→ Illusionism**  
                              *   *Awkward Commitment:* The powerful, seemingly undeniable intuition that there *is* something it is like to be conscious is a systematic error or misdescription.

  **Notes on Unoccupied Branches & Troublesome Splits:**

  1.  **Combination: "Conceptual Gap" & "Conceivability ≠ Possibility" & "Zombies impossible because of brute necessity" but also "Consciousness is grounded in physical intrinsics" →** This combination is **merely unattractive**, not incoherent. It would be an unstable hybrid of Russellian Monism and Strong Necessity, lacking the grounding motivation of Russellian Monism while adding an unnecessary brute layer. No prominent view holds this.
  2.  **Combination: "Conceptual Gap" & "Conceivability ≠ Possibility" & "Zombies impossible because of phenomenal concepts" but also "Consciousness is grounded in physical intrinsics" →** This combination is **incoherent**. The Phenomenal Concept Strategy (Type-B) explicitly denies that consciousness requires grounding in non-structural intrinsic properties; it holds physical facts are complete as described structurally by physics. Russellian Monism requires the intrinsic grounding. These are incompatible explanations for the gap/conceivability issue.

  **Troublesome Splits & Required Further Questions:**

  1.  **Distinguishing Type-B Physicalism (Phenomenal Concepts) vs. Type-C Physicalism (Ignorance):** The tree *might* not cleanly split these if someone answers "Conceptual/In Principle" but *also* thinks future science could eventually make the connection intelligible in a way that feels non-brute. A **further question** is needed: *"Could future scientific knowledge, in principle, make the connection between physical processes and consciousness fully intelligible (like water-H2O), eliminating the sense of a further question?"* Type-C says Yes; Type-B says No (only special concepts bridge the gap).
  2.  **Distinguishing Russellian Monism vs. Strong Necessity View:** Both deny conceivability entails possibility and deny the gap is merely conceptual (in the Type-B sense) or due to ignorance. A **further question** is needed: *"Is consciousness (or its grounds) part of the fundamental categorical nature of physical reality itself?"* Russellian Monism says Yes (it's the intrinsic nature of the physical); Strong Necessity says No (consciousness is distinct, linked by brute law).
