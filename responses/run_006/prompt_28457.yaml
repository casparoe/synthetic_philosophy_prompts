answer: |-
  ### Persistence Quiz  
  *Answer each scenario with the option that feels most correct to you. Use British English spellings (e.g., "kerb" not "curb").*

  1.  **The Clay Statue:**  
      Bert moulds a lump of clay into a statue of a cat. After a week, he squashes it back into a lump.  
      (a) Only one object ever existed: the lump of clay.  
      (b) Two objects existed: the lump (which persisted) and the statue (which existed temporarily).  
      (c) The lump and the statue were the same object at different times.  

  2.  **The Ship of Theseus:**  
      Theseus’s ship has 100 planks. Over years, each plank is replaced one by one. The original planks are reassembled into a ship.  
      (a) The original ship (with replaced planks) persists. The reassembled ship is new.  
      (b) The reassembled ship (with original planks) is the original ship. The other is new.  
      (c) Both ships equally claim to be the original ship.  

  3.  **Amoeba Division:**  
      Amoeba Alpha splits perfectly into Amoeba Beta and Amoeba Gamma.  
      (a) Alpha ceased to exist. Beta and Gamma are new amoebas.  
      (b) Alpha survives as both Beta and Gamma.  
      (c) Alpha is identical to one successor (say Beta), and Gamma is new.  

  4.  **Time Traveller’s Handshake:**  
      Dr. Eva travels back 20 years and shakes hands with her younger self.  
      (a) Two distinct people shook hands (young Eva and old Eva).  
      (b) Only one person was involved, but at different stages of her life.  
      (c) Two temporal parts of the same person interacted.  

  5.  **The Tattoo:**  
      Mo gets a distinctive tattoo on Monday. On Tuesday, Mo (with the tattoo) burns toast.  
      (a) The person who got the tattoo *is* the person burning toast.  
      (b) The toast-burner is a later temporal part of the same person who got the tattoo.  
      (c) "Mo" refers to different person-stages; Tuesday’s stage has a counterpart with a tattoo.  

  6.  **Haircut Identity:**  
      Lena has long hair. After a drastic haircut, she has short hair.  
      (a) Lena with long hair and Lena with short hair are the same person.  
      (b) Lena’s pre-haircut temporal part had long hair; her post-haircut part has short hair.  
      (c) The short-haired person-stage is a counterpart of the long-haired stage.  

  7.  **The Lost Key:**  
      You lose your front door key on Monday. On Tuesday, you find an identical key in the same spot.  
      (a) It’s probably the same key you lost.  
      (b) It’s a numerically different key that happens to look identical and be in the same place.  
      (c) Whether it’s the “same key” depends on context/convenience, not a deep fact.  

  8.  **The Repaired Vase:**  
      Gran’s vase shatters. You meticulously glue every fragment back together.  
      (a) The repaired vase *is* Gran’s original vase.  
      (b) The original vase was destroyed. The repaired vase is a new object made from its matter.  
      (c) Gran’s vase persisted through the shattering as scattered parts and was reassembled.  

  ---

  ### Scoring Key  
  *Tally your answers and match the pattern to a theory. Positions are defined by their core commitments, not labels.*

  1.  **Endurantism (Wholly Present):**  
      *Core:* Objects persist by being wholly present at each moment they exist. Change involves the same object gaining/losing properties.  
      *Signature Pattern:* Mostly (a) answers, especially on Q1(b), Q2(a/b), Q3(a), Q4(a), Q5(a), Q6(a), Q7(a), Q8(a).  
      *Awkward Commitment:* Must accept that a single object can gain/lose parts *without* becoming a different object (e.g., Ship of Theseus persistence).  

  2.  **Perdurantism (Temporal Parts):**  
      *Core:* Objects persist by having distinct temporal parts at different times; the whole object is a "spacetime worm."  
      *Signature Pattern:* Mostly (b) answers, especially strong on Q1(b), Q4(c), Q5(b), Q6(b). Likely Q2(a) or (c), Q3(a) or (b), Q8(a) or (c).  
      *Awkward Commitment:* You are never *wholly* present; only a temporal slice of you is reading this now.  

  3.  **Stage Theory (Counterpart Relations):**  
      *Core:* Only momentary stages exist. Persistence is a matter of later stages standing in a "counterpart relation" (similarity/causal dependence) to earlier ones.  
      *Signature Pattern:* Mostly (c) answers, especially on Q3(a/c), Q4(a), Q5(c), Q6(c), Q7(c). Likely Q1(a) or (b), Q2(c), Q8(b).  
      *Awkward Commitment:* "The person who married you" is a *different object* from "the person now burning toast" – they are merely counterparts.  

  4.  **Deflationary / No Persistence (Ordinary Objects):**  
      *Core:* Ordinary objects don’t strictly persist through any change; talk of persistence is pragmatic, not metaphysical.  
      *Signature Pattern:* (c) on Q7 strongly suggests this. Otherwise, mixes (b) and (c), especially on Q1(a), Q2(c), Q3(a), Q5(c), Q6(c), Q8(b). Rejects (a) answers implying strict identity over time.  
      *Awkward Commitment:* Gran’s vase wasn’t genuinely reassembled; you just arranged particles into a new vase-shaped aggregate.  

  **Grey Zones & Notes:**  
  -   **Q1 (Clay Statue):** Perdurantists (b) vs. Endurantists (c) vs. Stage/Deflationary (a or b).  
  -   **Q2 (Ship of Theseus):** Endurantists *must* pick (a) or (b). Perdurantists often pick (a) or (c). Stage/Deflationary lean (c).  
  -   **Q7 (Lost Key):** A strong (b) or (c) suggests Stage or Deflationary views. Endurantism *requires* (a) in normal contexts.  
  -   **Empty Corner:** Consistently choosing (a) for Q4, Q5, Q6 *and* (b) for Q1 or Q8 is unstable.  
  -   **Deflationary Inclusion:** Q7 is the clearest entry point. It fits naturally within Stage Theory’s framework but is distinguished by rejecting *all* strict persistence (even via counterparts).  
  -   **Separation Limitation:** Perdurantism and Stage Theory can blur on Q2/Q3/Q8. Key differentiators are Q4, Q5, Q6: Perdurantists say temporal parts *of the same worm*; Stage Theorists say *different objects related as counterparts*.
