prompt: |-
  Two people in my philosophy of science reading group got stuck on the problem of old evidence, and neither would budge. Here's roughly the exchange.

  (1) Maya said old evidence can't confirm anything on the standard Bayesian picture. If you already know E — like the anomaly in Mercury's orbit, which was known long before Einstein — then P(E)=1, so conditionalizing on E can't move anything: P(H|E)=P(H). So either old evidence never confirms, or confirmation isn't probability-raising.

  (2) Dan said that can't be right, because general relativity really was supported by explaining Mercury. So if the formalism says otherwise, we're formalizing the wrong thing. What's new isn't E; it's the fact that the theory entails E. Before Einstein, no accepted theory entailed the anomaly, so learning that H entails E is new information, and it can raise P(H) even while P(E)=1.

  (3) Maya: fine, but then the evidence is the logical fact that H entails E, not E itself. So you've changed the subject. You haven't shown old evidence confirms; you've shown new evidence about a logical relation confirms. P(H|E)=P(H) still holds.

  (4) Dan: that's exactly the point — the standard story is too narrow. It only counts newly observed facts as evidence, but we often get confirmation by discovering that things we already knew hang together. Making confirmation depend on whether we happened to learn E before or after the theory is too hostage to biography.

  (5) Maya: but if you let logical relations confirm, you owe us an account of what the new evidence is and why it raises P(H), and that's notoriously slippery. And maybe saying old evidence confirms is just a loose way of saying E would have confirmed H had we not already known E — a counterfactual, not actual confirmation.

  (6) Dan: the counterfactual move is worse; it pretends away the one thing that's true, which is that we did already know E.

  They asked me to referee and I honestly couldn't. Could you go through it move by move and say who's right about what, including anything both of them are missing?
reasoning: |-
  Okay, the user is presenting a detailed debate from their philosophy of science reading group about the problem of old evidence in Bayesian confirmation theory. Maya and Dan are stuck on whether old evidence can confirm a new hypothesis, using Mercury's orbit anomaly and Einstein's relativity as the classic example. 

  First, I need to unpack the core issue: Bayesian updating seems to say that if P(E)=1 (because E is already known), then learning E can't change P(H). But intuitively, Mercury's orbit DID support relativity historically. The tension is between formalism and scientific practice.

  Maya's position is strictly logical: if the formalism says no confirmation happens when P(E)=1, then either old evidence doesn't confirm or Bayesianism is wrong. She insists Dan's move (focusing on learning H→E) changes the subject from E to a logical fact.

  Dan's pushback feels important - he's highlighting how science actually works. Scientists get excited when theories explain known puzzles, and ignoring that makes Bayesianism seem artificial. His "hostage to biography" point is strong: why should confirmation depend on the accident of when we learned E?

  The user seems frustrated that they couldn't resolve this as referee. They likely want both technical clarification and philosophical insight. The mention of "anything both are missing" suggests they suspect there's more to the debate.

  I recall Garber's approach - modeling learning the logical connection H∧E → H⊨E as new evidence. That might satisfy Dan while keeping Bayesian machinery. But Maya would counter that this still replaces E with meta-information. The counterfactual approach (what if we didn't know E?) feels unsatisfying because it dodges the actual history.

  The deeper issue might be about what "evidence" means in confirmation. If evidence is just propositional content (E), Maya wins. But if evidence includes our epistemic state toward logical relations, Dan has a point. Bayesianism's static framework struggles with learning logical truths dynamically.

  I should acknowledge both have valid points: Maya's strict reading is formally correct, Dan's intuition reflects scientific practice. The solution may lie in extending Bayesianism (like Garber) or accepting that "confirmation" has multiple senses. The historical aspect matters - Einstein didn't just know E, he recognized E as anomalous, which involves background knowledge.

  Also worth noting: even if P(H|E)=P(H) when P(E)=1, the explanatory fit might still be epistemically significant in non-Bayesian ways (e.g., coherence). They might be talking past each other on what "confirmation" means.
answer: |-
  Here's a move-by-move breakdown of the debate, highlighting the core philosophical issues, what each person gets right, and what they might be missing:

  **Core Problem:** The Bayesian account of confirmation (confirmation as probability-raising via conditionalization) struggles with *old evidence* (evidence already known with certainty when a hypothesis is proposed). Intuitively, old evidence *does* seem to confirm (e.g., Mercury's orbit confirming GR), but P(E)=1 seems to block P(H|E) > P(H).

  **(1) Maya: Old evidence can't confirm (Bayesian Formalist View)**
  *   **What's Right:** Her logic is *formally correct* within standard Bayesianism. If P(E) = 1, then P(H|E) = P(H) by definition of conditional probability (P(H|E) = P(H∧E)/P(E) = P(H∧E)/1 = P(H∧E); and since P(E)=1, H∧E is logically equivalent to H, so P(H∧E)=P(H)). Conditionalizing on E *cannot* change the probability of anything. If confirmation *is* defined as probability-raising via conditionalization on E, then old evidence *cannot* confirm.
  *   **What's Missing:** She implicitly assumes confirmation *must* be defined solely as probability-raising via conditionalization on the evidence E *itself*. She doesn't engage with the intuition that old evidence *does* seem evidentially powerful in scientific practice.

  **(2) Dan: Intuition & Entailment (Scientific Practice View)**
  *   **What's Right:** He perfectly captures the *intuition* and *historical practice* of science. GR's explanation of the *previously anomalous* Mercury orbit was (and is) seen as strong confirmation. He identifies the key element: learning that the new hypothesis H (GR) *entails* the old evidence E (Mercury's anomaly). Before H, E was known but unexplained (or explained by a different, potentially less satisfactory theory).
  *   **What's Missing:** He hasn't specified *how* to formally model "learning that H entails E" within the Bayesian framework. He correctly diagnoses that the "newness" isn't in E, but in the relation between H and E, and that biography shouldn't dictate confirmation. However, he hasn't provided a formal Bayesian mechanism.

  **(3) Maya: Changing the Subject (Strict E-based Confirmation)**
  *   **What's Right:** She correctly points out that if Dan's solution involves conditionalizing on something *other* than E (namely, the logical fact H ⊨ E or H → E), then he is no longer claiming that the *old evidence E itself* confirms H. He's claiming that *new evidence about a logical relationship* confirms H. P(H|E) = P(H) still holds. She insists on a strict definition of evidence-as-E.
  *   **What's Missing:** She dismisses the possibility that "learning H entails E" *is* the epistemically relevant event triggered by the theory's development *in the context of old evidence E*. She doesn't address whether the Bayesian formalism *can* or *should* be extended to model this crucial scientific event.

  **(4) Dan: Narrow Formalism (Call for Broader Evidence)**
  *   **What's Right:** He makes a powerful *methodological/philosophical* point. Restricting "evidence" in Bayesian confirmation *only* to newly observed empirical facts (E) ignores a core source of scientific confirmation: discovering that a new theory coherently *explains* or *unifies* previously known, potentially puzzling facts. Making confirmation depend solely on the temporal accident of learning E is indeed "too hostage to biography." Science cares about explanatory power over existing knowledge.
  *   **What's Missing:** While his critique of the standard Bayesian narrowness is valid, he still owes a *formal account* within *a Bayesian framework* (or a justification for abandoning it). He needs to show *how* "learning H entails E" translates into a proposition that can be conditionalized upon, and why this doesn't just reduce to conditionalizing on E (which it can't, as Maya notes).

  **(5) Maya: Slipperiness & Counterfactuals (Demanding Rigor)**
  *   **What's Right:** She highlights the *technical challenges* Dan's approach faces within Bayesianism. Formally representing "learning that H entails E" is tricky:
      *   If the agent already knows all logical truths (Logical Omniscience), then P(H → E) = 1 from the start, blocking probability-raising.
      *   Relaxing Logical Omniscience is necessary but complex. What *exactly* is learned? A sentence? A meta-linguistic belief? How is its probability assessed initially? How does conditionalizing on it work?
      *   Her "counterfactual move" (P(H|E) > P(H) *if* P(E) < 1) is a common *fallback* position for Bayesians to preserve the formalism. It acknowledges the intuition by saying E *would have been* confirming had it been new.
  *   **What's Missing:** She dismisses the substantial work done to formalize learning logical relations (e.g., Garber, Jeffrey, others). While slippery, it's not impossible. Furthermore, the counterfactual move often feels deeply unsatisfactory, as Dan notes. It severs confirmation from the *actual* historical and epistemic context.

  **(6) Dan: Reality of Knowing E (Rejecting Counterfactuals)**
  *   **What's Right:** He lands the knockout punch against the counterfactual move. The counterfactual scenario (not knowing E) is *not* the actual epistemic situation scientists were in. The *actual* confirmation occurred precisely *because* E was known, anomalous, and suddenly explained by H. Denying this actual confirmation to preserve the simple Bayesian definition feels like a failure of the formalism to capture scientific reasoning. "Pretends away the one thing that's true" is a perfect summary.
  *   **What's Missing:** He still needs a positive formal proposal or a clear endorsement of an existing one (like Garber's) to fully counter Maya's technical objection.

  **Who's "Right"? It's Complicated (The Philosophical Stalemate)**

  *   **Maya is formally correct** about standard Bayesian conditionalization on E: If P(E)=1, conditionalizing on E cannot change any probabilities. Old evidence *E itself* cannot raise the probability of H *via that specific operation*.
  *   **Dan is substantively correct** about scientific practice: The explanation of old evidence *does* provide genuine confirmation. The standard Bayesian account, if it *only* allows conditionalization on E, fails to capture this crucial aspect of scientific reasoning. His critique that it's "too hostage to biography" is compelling.
  *   **The Crux:** The disagreement hinges on what constitutes "evidence" in the confirmation event and how to formally model the *epistemic progress* made when a new theory explains old evidence.

  **What Both Might Be Missing (The Path Forward):**

  1.  **Relaxing Logical Omniscience:** The most promising Bayesian solution (championed by thinkers like Daniel Garber) involves explicitly relaxing the assumption of Logical Omniscience. The agent does *not* start with P(H → E) = 1.
      *   The "new evidence" is learning the *contingent* proposition that H *empirically* entails E (often formalized as something like H ∧ E → (H ⊨ E) or simply discovering the deductive connection itself).
      *   Before learning this, the agent assigns a probability less than 1 to the proposition that H entails E (or to the conjunction H ∧ E → (H ⊨ E)). Learning this logical connection *is* new information.
      *   Conditionalizing on *this* new proposition (about the entailment) *can* raise P(H), even though P(E)=1. This formally captures Dan's intuition while remaining Bayesian. Maya is right that it's not conditionalizing on E *itself*, but it *is* conditionalizing on evidence *about* E's relation to H, triggered *by* H in the context of E.
  2.  **Explanatory Power vs. Probability Raising:** Some argue that the confirmation from old evidence highlights a limitation of the simple probability-raising definition. It might point towards the importance of other virtues like *explanatory power*, *coherence*, or *unification*, which probability-raising might only partially capture. The "problem" exposes a potential gap in the Bayesian account.
  3.  **The Role of Anomaly:** Dan touches on this ("no accepted theory entailed the anomaly"). The power of old evidence confirmation often stems from E being *anomalous* or *poorly explained* by the previous background knowledge. Learning H entails E isn't just learning any entailment; it's learning that H resolves an anomaly. Formal accounts need to incorporate the agent's background knowledge and the explanatory status of E before H. (This connects to "surprise" or "unexpectedness").
  4.  **Non-Bayesian Responses:** The problem strengthens arguments for non-Bayesian accounts of confirmation (e.g., Explanationist) that directly tie confirmation to explanatory relationships, making the confirmation by old evidence less problematic.

  **Conclusion:**

  *   **Maya wins** on the letter of the law of *standard* Bayesian conditionalization *on E*: P(H|E) = P(H) when P(E)=1. Old evidence E *itself* does not cause probability-raising via that operation.
  *   **Dan wins** on the spirit of scientific confirmation: The explanation of old evidence *is* confirmatory. The standard formalism, strictly applied, is inadequate to capture this.
  *   **The Resolution (within Bayesianism):** Dan's core insight (learning the entailment is key) provides the solution, but it requires formalizing "learning that H entails E" as a *new piece of evidence* (distinct from E) and relaxing Logical Omniscience. This addresses Maya's technical concern by changing the proposition conditionalized upon, while satisfying Dan's demand that the actual epistemic situation (knowing E) is central. The counterfactual move is widely seen as inadequate.

  The problem of old evidence remains a deep challenge, demonstrating a tension between formal elegance and capturing the richness of scientific reasoning. Both Maya and Dan highlight essential aspects of the puzzle.
