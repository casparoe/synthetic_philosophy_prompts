answer: |-
  ## Research Proposal: The Metaphysics of Value Aggregation in Light of the Pasadena Paradox

  **1. Research Question:**
  What are the *metaphysical commitments* concerning the nature and aggregation of value inherent in expected utility theory (EUT), as revealed by the failure of conditionally convergent expected utility sums like the Pasadena game? Specifically, does the Pasadena paradox necessitate abandoning the picture of a prospect's value as being *literally composed* of the individual, probabilistically weighted values of its outcomes (atomistic value aggregation), in favor of a view where value is a *holistic property* of prospects that may not always decompose neatly (non-compositional value aggregation)? If so, can a coherent and productive holistic model be developed that recovers the successes of EUT in standard cases while providing principled guidance for Pasadena-type prospects?

  **2. Background, Significance, and Gap:**
  The Pasadena paradox starkly exposes a foundational limitation of standard EUT: when the expected utility series is conditionally convergent (but not absolutely convergent), the "expected value" is not uniquely defined, rendering EUT silent. Existing responses primarily operate *within* the decision-theoretic framework:

  *   **Technical Fixes:** Proposals like "weak expectations" (truncating the game), "finite descriptions," or "relative expectations" aim to assign *some* definite value to the game. However, these often appear ad hoc, lack a unified justification, and sidestep the deeper conceptual puzzle of *why* the standard sum fails.
  *   **Rejectionist Views:** Some argue such prospects are incoherent or inadmissible for rational choice. This avoids the technical problem but fails to explain *why* a coherently describable scenario should be excluded, potentially limiting decision theory's scope arbitrarily.
  *   **Contextual Ordering:** Others suggest the summation order should be fixed by the structure of the game or the agent's epistemic state. While pragmatic, this doesn't resolve the *metaphysical* question: if value is inherent *in the outcomes themselves*, why should its *aggregation* depend on an extrinsic ordering? What fact about *value itself* determines the "correct" order?

  **The gap this project addresses is the lack of sustained investigation into the *metaphysical presuppositions* about value that make the Pasadena paradox possible.** The rearrangement problem arises precisely because the standard model assumes value is *atomistic*: the value of the prospect is nothing over and above the sum of the values of its parts (the outcomes), weighted by probability. The paradox shows this sum can be ill-defined, suggesting that either:
      (a) Value aggregation under uncertainty *requires* a privileged ordering principle (which existing responses implicitly seek but struggle to ground metaphysically), or
      (b) The atomistic picture of value composition is fundamentally inadequate for certain prospects, demanding a more holistic conception where the value of a prospect is not reducible to a simple sum of outcome-values.

  This project argues that the metaphysical question – *what kind of thing is value such that its aggregation behaves (or fails to behave) in this way?* – is crucial and underexplored. It moves beyond asking "How can we fix EUT for Pasadena?" to ask "What does Pasadena tell us about the *nature* of value and its relationship to possible outcomes?"

  **3. Methodology:**
  This project employs an integrated methodology combining conceptual analysis, formal modeling, and normative evaluation, distinct from purely formal or historical approaches:

  *   **Year 1:**
      *   **Phase 1 (Months 1-6): Deep Analysis of the Paradox & Existing Literature.** Precisely characterize the metaphysical commitments implicit in standard EUT's additive aggregation. Systematically analyze existing solutions to Pasadena, identifying their *implicit* metaphysical assumptions about value composition and aggregation. Develop a detailed critique of why these solutions fail to adequately address the core metaphysical tension.
      *   **Phase 2 (Months 7-12): Articulating the Metaphysical Tension & Holistic Models.** Develop the conceptual contrast between atomistic and holistic conceptions of value for prospects. Investigate potential metaphysical foundations for a holistic view (e.g., inspired by organic unities, contextualism, or non-separable utility functions). Begin formalizing a prototype "holistic value function" for prospects, focusing initially on capturing the essential features of the atomistic picture in standard convergent cases.
  *   **Year 2:**
      *   **Phase 3 (Months 13-18): Formal Development & Reconciliation.** Refine the formal model of holistic value. Crucially, develop criteria for when and how the holistic value reduces to a well-defined sum (e.g., under absolute convergence) and when it does not (e.g., under conditional convergence like Pasadena). Explore whether the holistic model can generate unique valuations for Pasadena-type games based on structural features *without* relying on arbitrary summation orders. Test the model against a range of simpler, non-paradoxical prospects to ensure it recovers standard EUT results where appropriate.
      *   **Phase 4 (Months 19-24): Evaluation, Scope, and Implications.** Critically evaluate the success of the holistic model: Does it resolve the conceptual tension exposed by Pasadena? What are its limitations? What implications does it have for the scope and foundations of decision theory? Are there broader implications for value theory, aggregation ethics, or the metaphysics of probability? Synthesize findings and outline future research directions.

  **Why this approach?** A purely formal decision-theoretic approach risks developing another technical fix without confronting the underlying metaphysical question. A purely historical approach might trace debates but not advance a positive resolution. This project's integrated methodology is essential because:
      *   The core problem is *conceptual* (the nature of value aggregation), demanding philosophical analysis.
      *   Any proposed solution must be *formally precise* to be evaluated within decision theory.
      *   The goal is not just historical understanding but *constructive progress* on a foundational issue.

  **4. Success Criteria and Failure Modes:**

  *   **Successful Results Would Look Like:**
      *   A clearly articulated and defensible account of the metaphysical tension between atomistic and holistic value aggregation revealed by the Pasadena paradox.
      *   A formally coherent model of "holistic prospect value" that:
          *   Successfully recovers standard expected utility valuations in cases of absolute convergence.
          *   Provides a principled (non-arbitrary) way to assign value (or declare indeterminacy) to Pasadena-type prospects based on their holistic features (e.g., their full structure, not just outcome-by-outcome sums).
          *   Offers a compelling metaphysical explanation for why aggregation fails in conditionally convergent cases under the atomistic picture.
      *   A demonstrated understanding of the implications of this model for the scope and foundations of rational choice theory.
  *   **What Would Count as Failure:**
      *   **Conceptual Failure:** Inability to compellingly articulate the metaphysical tension beyond restating the technical problem of rearrangement, or failure to develop a coherent holistic conception distinct from disguised atomism.
      *   **Formal Failure:** Inability to construct a formal holistic model that is both consistent and meaningfully distinct from existing decision-theoretic approaches, or one that fails to replicate standard results in non-paradoxical cases.
      *   **Resolution Failure:** The holistic model provides no clear advantage or principled resolution for Pasadena-type cases compared to existing solutions (e.g., it still relies on arbitrary choices or simply declares the game invalid without deeper justification).
      *   **Incoherence:** The proposed holistic framework proves internally inconsistent or generates unacceptable implications for rational choice in standard scenarios.

  **5. Feasibility Assessment:**
  A two-year timeframe is **ambitious but realistic** for this project.

  *   **Manageable Scope:** The focus is deliberately on the *foundational* metaphysical question and developing a *prototype* holistic model, not a complete, universally applicable decision theory. Year 1's conceptual groundwork and Year 2's formalization target this core objective.
  *   **Building Blocks Exist:** The philosophical tools (conceptual analysis, metaphysics of value) and formal tools (decision theory, mathematics of series convergence) are well-established. The project synthesizes and innovates upon these, rather than starting from scratch.
  *   **Clear Milestones:** The phased approach provides concrete deliverables and evaluation points (literature critique, articulation of tension, prototype model, refined model, evaluation).
  *   **Success Defined Incrementally:** Even if a fully satisfactory holistic model isn't achieved, significant progress in clarifying the metaphysical issues, exposing limitations of atomism, or developing promising (if incomplete) formal approaches would constitute valuable success. A clear articulation of *why* the holistic path is difficult would also be an important result.
  *   **Realistic Output:** The goal is a robust framework and a proof-of-concept model, not necessarily the final word on value aggregation. This is achievable within two years of dedicated research.

  The Pasadena paradox challenges not just a calculation within decision theory, but a fundamental assumption about how value resides in the world. This project aims to meet that challenge head-on, exploring the deep metaphysical waters the paradox reveals.
