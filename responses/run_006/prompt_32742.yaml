answer: |-
  Below is a decision tree designed to sort students into philosophical positions based on their intuitive reactions to Max Black's two-sphere universe. The case describes a universe with **nothing but two iron spheres, identical in all intrinsic properties** (size, mass, composition, temperature, color, etc.), sitting **one mile apart**. The tree uses concrete questions about the case to avoid presupposing knowledge of philosophical terms (e.g., "haecceitism"). It branches through key issues like spatial properties, brute distinctness, primitive thisness, and coherence, ending at six named positions.  

  ---

  ### **Decision Tree: What Individuates the Spheres?**  
  Start with your gut reaction to the case and follow the questions.  

  **1. In this universe, are there *two* distinct spheres, or is "two" a misdescription (i.e., only one sphere exists)?**  
     - **If "two is a misdescription—only one sphere exists" →**  
       **Position: Bundle Theory with PII**  
       (Objects are "bundles" of properties; the Principle of the Identity of Indiscernibles [PII] is a necessary truth. Identical properties imply one object.)  
       *Stop here.*  

     - **If "there are two distinct spheres" → Go to 2.**  

  **2. Is the difference in their spatial locations (being one mile apart) a difference in their *properties*?**  
     - **If "yes, location is a property" → Go to 3.**  
     - **If "no, location isn't a property" → Go to 4.**  

  **3. If the spheres swapped places while you slept, would this be a *real change* in the universe?**  
     - **If "yes, it’s a real change" →**  
       **Position: Substantivalism about Space**  
       (Space is a substance with absolute positions. The spheres are individuated by their spatial locations.)  
       *Stop here.*  
     - **If "no, not a real change" →**  
       **Position: Haecceitism**  
       (Each sphere has a primitive "thisness" (haecceity)—a non-qualitative essence that grounds distinctness. Swapping doesn’t change qualitative facts.)  
       *Stop here.*  

  **4. Can the spheres' distinctness be *brute* (i.e., no further explanation needed)?**  
     - **If "yes, distinctness is brute" →**  
       **Position: Brute Distinctness**  
       (The spheres are distinct, but there’s no "ground" for this fact—it’s fundamental and unexplained.)  
       *Stop here.*  
     - **If "no, distinctness needs a ground" → Go to 5.**  

  **5. Does each sphere have a unique, non-qualitative "thisness" (e.g., an intrinsic identity beyond properties)?**  
     - **If "yes" →**  
       **Position: Haecceitism**  
       (As above: primitive thisness individuates the spheres.)  
       *Stop here.*  
     - **If "no" → Go to 6.**  

  **6. Is it coherent to describe a universe with two qualitatively identical spheres?**  
     - **If "no, the description is incoherent" →**  
       **Position: Verificationist-Inspired Incoherence**  
       (The scenario is meaningless or unverifiable; language can’t describe "two" without discernible differences.)  
       *Stop here.*  
     - **If "yes, it’s coherent" →**  
       *No leaf—logically inconsistent position!*  
       (You accept two spheres but reject properties, brute distinctness, thisness, *and* incoherence. Revisit your answers!)  

  ---

  ### **Notes on the Tree**  
  - **Unseparated Positions**:  
    - **Haecceitism** appears twice (from Q3 and Q5) because both paths reflect the same core view: primitive thisness individuates objects. The tree cannot distinguish sub-flavors (e.g., whether thisness implies modal "haecceitistic differences").  
  - **Empty Combinations & Incoherences**:  
    - The final "incoherent" node (Q6 → "yes") has no leaf. It arises if a student insists on two spheres but rejects *all* grounds for distinctness (properties, brute facts, thisness, *and* incoherence). This combination is **logically empty**—it denies any possible account of individuation.  
    - **Missing Views**: Relationism (individuation by spatial *relations*) isn’t a leaf because, in this sparse universe, relations collapse: each sphere has the same relational property ("being 1 mile from another sphere"). Relationists must default to brute distinctness, haecceitism, or bundle theory.  
  - **Why This Structure?**  
    The tree prioritizes case-based intuition over predefined "-isms." For example:  
    - Q3 (swap test) probes whether spatial differences are "real" without mentioning substantivalism.  
    - Q5 ("thisness") uses accessible language ("non-qualitative identity") instead of "haecceities."  
    - Bundle theory is the only "one-sphere" outcome, as denying "two" implies PII.  

  Use this handout to spark debate *before* readings—students can revisit their position after engaging with Black, Leibniz, and contemporary critiques.
