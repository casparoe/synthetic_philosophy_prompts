answer: |-
  You've hit on a fundamental friction point in formal epistemology. Your suspicion is perceptive: **the core disagreement *is* often rooted in divergent, often unstated, background commitments about the *primary function* of credences (action guidance vs. truth-tracking), which then shapes what counts as a "justification" for probabilism.** However, the situation is structurally more complex. Let's break down the nature of the disagreement and paths to progress.

  ### What Kind of Disagreement Is This?

  1.  **Not Primarily Verbal:** While terms like "justification," "rationality," and "coherence" are used differently, the disagreement runs deeper than semantics. It's about **what constitutes the *relevant kind of vindication* for the probability axioms**.
  2.  **Substantive Divergence in Goals & Values:** The camps differ on what fundamental *problem* probabilism is supposed to solve or what *flaw* incoherence represents:
      *   **Camp A (Pragmatic Vindication):** The core problem is *practical self-sabotage*. Rationality fundamentally involves avoiding guaranteed loss in potential actions (betting being a paradigm case of action guided by credences). Justification is showing probabilism prevents this sabotage.
      *   **Camp B (Formal Coherence Illustration):** The core problem is *internal inconsistency in doxastic attitudes*. The Dutch Book is a striking *symptom* or *consequence* of this deeper incoherence (revealed more purely by representation theorems). Justification requires grounding the *normativity* of coherence itself (which the DBA doesn't provide).
      *   **Camp C (Epistemic Purity):** The core problem is *inaccuracy* or *epistemic badness*. Credences are primarily assessments of how the world is, not (just) tools for action. Justification must show probabilism is necessary for being *epistemically better* (e.g., non-dominated in accuracy). The DBA's pragmatic elements are irrelevant or distorting.
  3.  **Answering Different Questions Under One Heading:** Yes, absolutely. The umbrella term "justification for probabilism" masks distinct questions:
      *   **Camp A:** "Why is violating the axioms *pragmatically irrational*?"
      *   **Camp B:** "What does *formal coherence* require, and why (if at all) is it normatively binding?" (The DBA answers the first part, not the second).
      *   **Camp C:** "Why is violating the axioms *epistemically irrational*?"
  4.  **Structural Tensions in the Arguments Themselves:**
      *   **DBA's Achilles' Heel:** The "Why care about Dutch Books?" objection. If an agent *knows* no bookie will actually exploit them, or simply *doesn't care* about small-stakes bets, does the DBA still show *irrationality*? This pushes Camp A towards idealization/theorem-following arguments, blurring into Camp B.
      *   **Accuracy's Achilles' Heel:** The "Arbitrariness of Scoring Rules" objection. Why the Brier score? Why *any* strictly proper rule? Doesn't the choice encode a prior judgment about what constitutes "accuracy" that already presupposes probabilistic thinking? This makes Camp C's justification seem circular or question-begging to critics.
      *   **Representation Theorem's Gap:** As Camp B often acknowledges, showing that coherent preferences *can be represented* as expected utility maximization with probabilistic credences doesn't *by itself* explain *why* one *should* have coherent preferences or probabilistic credences. It reveals the structure of coherence but leaves its normativity unexplained.

  ### Your Suspicion: Action vs. Truth - Core but Not the Whole Story

  You are fundamentally correct: **The deepest divide is often between those who see credences as fundamentally *practical* (tools for decision) and those who see them as fundamentally *theoretical* (estimates of truth).**

  *   **Camp A:** Strongly action-oriented. Credences *are* dispositions to bet. Pragmatic failure *is* the relevant irrationality.
  *   **Camp C:** Strongly truth-oriented. Pragmatic consequences are derivative or irrelevant; the core flaw of incoherence is epistemic badness.
  *   **Camp B:** Often sits between, focusing on the *formal structure* revealed by both pragmatic and epistemic lenses, but recognizing that the *normative force* might need separate grounding (e.g., in the very concept of belief, or in instrumental rationality broadly construed).

  **However, it's more nuanced:** Even within camps, there's debate on *how tightly* credences are linked to action or truth. Some in Camp A see betting as a *model* for action in general; others see it as constitutive. Some in Camp C see accuracy as the *sole* epistemic virtue; others see avoiding dominance as one virtue among many. Camp B often grapples with whether the revealed coherence is inherently normative or just a formal requirement for a specific representation.

  ### What Would Count as Progress?

  Given this diagnosis, progress is unlikely to come from a single "knockout" theorem. It requires:

  1.  **Explicitly Acknowledging the Divergent Projects:** Recognizing that "justifying probabilism" isn't a single task. Progress involves **sharply distinguishing the questions**:
      *   Q1: What are the pragmatic consequences of incoherence? (DBA answers this)
      *   Q2: What is the formal structure of coherent belief? (Representation theorems answer this)
      *   Q3: What are the epistemic consequences of incoherence? (Accuracy arguments aim here)
      *   Q4: Why should we care about avoiding pragmatic sabotage / incoherence / epistemic inaccuracy? (The deepest normative question, often presupposed).
      Framing work like this *is* progress, even if it doesn't resolve the normative debate (Q4).
  2.  **Clarifying the Connections/Disconnections:** Rigorously exploring *if* and *how* answers to one question relate to others.
      *   *E.g.,* Does avoiding pragmatic loss *entail* anything about epistemic virtue (or vice versa) under plausible assumptions? Are there scenarios where probabilism avoids Dutch Books but is epistemically dominated, or vice versa? (Results here are often complex and depend on specific setups).
      *   *E.g.,* Can the "arbitrariness" of scoring rules be mitigated? (Work on "accuracy-first" epistemology, characterizing scoring rules axiomatically, or exploring dominance under *classes* of rules attempts this).
  3.  **Grounding the Normative Primitive (Q4):** Making the deepest commitments explicit and arguing for them:
      *   **Pragmatic Defenders:** Argue that avoiding *predictable* or *guaranteed* pragmatic failure is constitutive of instrumental rationality, which is foundational.
      *   **Epistemic Purists:** Argue that the goal of belief *just is* accurate representation, making dominance avoidance non-arbitrary. Defend the primacy of epistemic norms.
      *   **Formalists:** Argue that coherence (revealed by DBA/repr.theorems) is constitutive of the very notion of having graded beliefs or preferences.
  4.  **Exploring Alternatives and Limitations:** Progress can come from:
      *   **Exploring non-pragmatic foundations:** Developing accuracy arguments further, tackling the scoring rule issue head-on.
      *   **Challenging probabilism itself:** Investigating bounded rationality models, imprecise credences, or alternative frameworks where Dutch Books are avoided differently or epistemic trade-offs exist. Showing where these succeed or fail relative to the different desiderata (pragmatic safety, formal coherence, epistemic accuracy) clarifies what's at stake.
      *   **Contextualizing:** Recognizing that different foundations might be appropriate for different purposes (e.g., decision theory vs. pure epistemology).

  ### Conclusion: Your Framing is Sound

  You are not confused. **The debate persists because it involves fundamental, intertwined disagreements about:**

  1.  **The Nature of Credences:** Are they fundamentally practical dispositions or theoretical estimates?
  2.  **The Primary Mode of Evaluation:** Is rationality judged by pragmatic success, formal coherence, or epistemic virtue?
  3.  **The Source of Normativity:** Where does the "ought" come from? (Avoiding guaranteed loss? Constitutive norms of belief? The intrinsic goal of accuracy?).

  **Progress lies not in convincing one camp to become another, but in:**

  *   **Sharply distinguishing the projects** (Q1-Q4 above).
  *   **Articulating and defending the core normative commitments** underlying each project.
  *   **Rigorously mapping the relationships and tensions** between the pragmatic, formal, and epistemic consequences of (in)coherence.
  *   **Acknowledging that a single, universally satisfying "foundation" might be elusive** due to these deep-seated differences in philosophical starting points.

  Your reading group might find traction by explicitly mapping *which* question(s) each participant is most concerned with and *why* they find that question fundamental. This shifts the focus from "who wins the DBA debate?" to "what are we *really* trying to show about rationality and belief?" That kind of meta-discussion is often the key to unlocking stalemates.
