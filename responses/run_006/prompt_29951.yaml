prompt: |-
  I was at a conference last week and got talking to a colleague from another department who summarized the dogmatism paradox for me like this: "Kripke showed that if you know something, you're rationally entitled to dismiss any counterevidence without even examining it, because you already know it's misleading. So knowledge actually makes you worse off epistemically — it traps you in your own certainty. That's why a lot of epistemologists now think we should abandon the concept of knowledge and work with degrees of belief instead."

  This seems too neat to me, and I vaguely remember there's a distinction between what the paradox shows and what people infer from it, but I don't work in epistemology. Is this a fair summary? What would someone who defends the importance of the paradox say is right here, and what would they push back on?
