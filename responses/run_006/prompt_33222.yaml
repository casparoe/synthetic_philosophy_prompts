prompt: |-
  Okay so my friend and I got into a long argument last night about whether evolutionary psychology is mostly just-so stories. He kept saying that for any trait you can spin an adaptive story after the fact, and I kept saying that's not fair because some of these hypotheses actually make risky predictions that could easily have failed. He said, fine, name one. And then I realized I don't have a good way of sorting out which claims is more like genuine science and which is basically unfalsifiable storytelling, so I've been stewing over it all day.

  Here's the list I've been going back and forth on. Could you sort them into tiers (say S, A, B, C) by how well each one can answer the just-so story charge—that is, how much you'd trust it as a real, testable claim rather than a post-hoc narrative—and give me a sentence for each explaining why it lands where it does? Don't worry about citations, I just want your read on the substance.

  - The Cinderella effect: children living with stepparents are at substantially higher risk of abuse or homicide than children living with both biological parents, because selection favors investing in genetic kin.
  - The cheater-detection claim: people are much better at Wason selection tasks when they're framed as social-contract/cheating problems than when framed abstractly, supposedly because we have a dedicated cheater-detection module.
  - The waist-to-hip ratio claim: men across cultures prefer a female waist-to-hip ratio around 0.7 because it's a reliable cue of fertility and health.
  - The jealousy sex-difference claim: men are more upset by sexual infidelity and women by emotional infidelity because of different selection pressures (paternity certainty vs. resource loss).
  - Pregnancy sickness as adaptation: morning sickness is a defense that keeps women from ingesting teratogenic foods during the first trimester.
  - The grandmother hypothesis: menopause is an adaptation for stopping direct reproduction in order to invest in grandchildren.
reasoning: |-
  Okay, the user is really frustrated after an argument with their friend about evolutionary psychology being "just-so stories." They need help sorting specific claims into tiers based on how testable and falsifiable they are. Their main concern is distinguishing genuine science from post-hoc narratives. 

  First, I should recall what makes a hypothesis strong in evolutionary psychology. Key factors include multiple lines of evidence (cross-cultural consistency, specific predictions), measurable criteria (like WHR preferences), and ideally experimental tests (like the Wason task). The absence of clear alternative explanations also helps.

  Looking at their list:
  - The Cinderella effect has strong correlational data but struggles with confounds like socioeconomic factors. It's hard to isolate evolutionary pressure from environmental factors.
  - The cheater-detection module seems solid because of the Wason task experiments - the framing effect is robust and difficult to explain without cognitive adaptations for social contracts.
  - WHR preference has extensive cross-cultural data and links to health markers. The 0.7 ratio specifically predicts fertility better than other body metrics.
  - Jealousy sex differences have experimental support (physiological measures, forced-choice scenarios) but alternative theories about socialization exist. Still, cross-cultural patterns strengthen it.
  - Morning sickness has compelling medical evidence linking nausea timing to fetal vulnerability periods, plus dietary avoidance patterns. Natural experiments like historical food prohibitions add weight.
  - Grandmother hypothesis relies on correlational longevity/kin support data. It's plausible but hard to test definitively since we can't observe ancestral environments directly.

  I notice the user isn't asking for absolute truth - they want to gauge robustness against the "just-so" critique. So I'll emphasize testability tiers: 
  - S-tier for hypotheses with experimental or strong predictive power (cheater detection, WHR)
  - A-tier for well-supported medical/observational data (morning sickness, jealousy)
  - B-tier for important but confounded patterns (Cinderella)
  - C-tier for logically sound but hard-to-test ideas (grandmother)

  The user seems analytically minded - they'll appreciate clear criteria like falsifiability and predictive risk. I should avoid jargon while keeping explanations crisp. Their frustration about "stewing all day" suggests they value concise yet thorough breakdowns. Might also subtly reassure them that their friend's skepticism isn't entirely wrong - some evopsych does deserve scrutiny - while showing how science self-corrects.
answer: |-
  Here's a tiered ranking based on robustness against the "just-so story" charge, focusing on testability, falsifiability, predictive power, and the existence of non-obvious evidence:

  **S-Tier (Strongest Defense: Multiple Lines of Convergent Evidence, Specific Predictions)**
  1.  **Pregnancy sickness as adaptation:** Tested via timing (peaks when fetus most vulnerable to teratogens), dietary aversion patterns (strongest against foods historically risky in 1st trimester), correlations with miscarriage risk (lower nausea associated with higher loss), and medical/chemical evidence of teratogens. *Why S?* Makes specific, risky predictions about timing, food types, and health outcomes that are strongly supported by medical data and epidemiology, making it difficult to explain as coincidence.

  **A-Tier (Very Strong Evidence: Experimental Support & Cross-Cultural Consistency)**
  2.  **The cheater-detection claim:** Robustly tested via countless experimental variations of the Wason task. The effect is large, replicable across cultures, and specific to *cheating* detection within social contracts, not just any social content. Performance drops if the rule violation doesn't involve cheating. *Why A?* Experimental manipulation provides direct causal evidence for a specialized cognitive mechanism; the effect disappears if the cheating element is removed, making it falsifiable and difficult to explain as general reasoning.*

  **B-Tier (Solid Correlative Evidence & Predictive Power, but Confounds Exist)**
  3.  **The waist-to-hip ratio claim:** Supported by extensive cross-cultural studies showing consistent male preference for ~0.7 WHR (even controlling for BMI), links to objective health markers (fertility, metabolic disease risk), and its predictive power over other cues like overall weight. *Why B?* Strong cross-cultural consistency and correlation with health/fertility markers provide good evidence it's a real, evolved cue, though disentangling it *completely* from cultural influences remains challenging.*
  4.  **The Cinderella effect:** Large, replicated correlational datasets across multiple societies consistently show the risk disparity. While confounds exist (socioeconomic stress, selection effects), the effect size is substantial and persists in attempts to control for them. *Why B?* The sheer magnitude and consistency of the correlational data strongly suggest *some* evolved component, but establishing it as the *primary* driver (vs. complex social factors) is difficult with correlational data alone.*
  5.  **The jealousy sex-difference claim:** Supported by experiments (physiological measures, forced-choice scenarios) and cross-cultural surveys showing the predicted pattern. Brain imaging also shows differing neural activation patterns. *Why B?* Experimental evidence and cross-cultural patterns are strong, but alternative explanations (social learning, different interpretations of "emotional" infidelity) remain plausible contenders; it's well-supported but not definitively proven as purely evolved.*

  **C-Tier (Plausible Logic, But Harder to Test Definitively Against Alternatives)**
  6.  **The grandmother hypothesis:** Supported by correlational data (e.g., children with living grandmothers have higher survival rates in historical/hunter-gatherer data), mathematical models showing fitness benefits, and comparative biology (long post-reproductive life is rare). *Why C?* While logical and supported by indirect evidence, it's incredibly hard to test *definitively* against the null hypothesis that menopause is simply a byproduct of longevity. Proving it was *selected for* grandmaternal investment, rather than investment being a *use* of an existing lifespan, is a major challenge.*

  **Key Takeaways for Your Argument:**

  *   **S & A Tiers:** These offer strong counters to the "just-so" charge. Pregnancy sickness has specific, testable medical predictions. Cheater detection has robust *experimental* evidence showing a specific cognitive specialization via task manipulation. WHR has strong cross-cultural predictive power.
  *   **B Tier:** These have substantial empirical backing (correlations, some experiments) that make a purely post-hoc story unlikely, but they grapple with complex confounds (Cinderella effect) or lingering alternative explanations (jealousy differences). They are testable and have been tested extensively, but the evidence isn't as *dispositive* as S/A.
  *   **C Tier:** The grandmother hypothesis is a prime example of a hypothesis where the logic is sound and indirect evidence exists, but rigorous, direct testing against the core evolutionary claim (adaptation *for* grandmaternal investment) is extremely difficult. It's more vulnerable to the "couldn't it just be..." counterargument.

  Your friend is right that *some* evo psych is vulnerable to the just-so critique, but wrong to dismiss the *entire field*. The best work generates risky, specific predictions (Pregnancy sickness timing/food aversions), uses clever experiments to reveal specialized mechanisms (Cheater detection task), or finds consistent cross-cultural patterns linked to fitness outcomes (WHR, Cinderella effect). The key is demanding **specific, testable predictions** that could fail, and **multiple converging lines of evidence**.
