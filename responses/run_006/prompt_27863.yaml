prompt: |-
  I have been trying on my own to work out when a person's "yes" to sex really counts. I have collected my reactions to a set of cases, and they feel mostly consistent to me, but I cannot state the rule behind them. I would like to know whether there is a single principle that captures my verdicts, or nearly all of them, and which of my verdicts a clean principle would force me to give up.

  Here are the cases and my verdicts.

  1. A man tells a woman he is a surgeon at a large hospital. He actually works in a warehouse. She would not have slept with him had she known. I think her yes did not count.

  2. A married man tells a woman he is single and looking for a serious relationship. She sleeps with him on that basis. I think her yes did not count.

  3. A man tells a woman he loves her in order to get her into bed. He does not love her. I think he has done something wrong, but I do not think her yes failed to count: she agreed to the sex she actually had, with the person she actually had it with.

  4. A man tells a woman he is 32 when he is 34. She sleeps with him. I think her yes counted, though the lie was unnecessary and dishonest.

  5. A boss tells an employee he finds her attractive and that she is "exactly the sort of person who gets promoted here." She is afraid for her promotion and sleeps with him. I think her yes did not count.

  6. A boyfriend tells his girlfriend that he will end the relationship if they do not start having sex. She agrees because she does not want to lose him. I think her yes counted, even though I think less of him for saying it.

  7. A man tells a woman that if she does not sleep with him, he will post an embarrassing video of her online. She agrees. I think her yes did not count.

  8. A woman is so drunk that she can barely stand, but she is conscious and says yes. I think her yes did not count.

  9. A man is drunk enough to be louder and more confident than usual, but he knows where he is, who he is with, and what he is doing, and he says yes. I think his yes counted.

  10. A young woman with a mild intellectual disability lives semi-independently and says, clearly and repeatedly, that she wants to have sex with her boyfriend. I think her yes counted, though I am less certain here than I would like to be.

  The case I keep going back and forth on is this. A man tells a woman he has had a vasectomy. He has not. They agree to have sex without a condom, which she would not have agreed to otherwise. Part of me says this is like the surgeon lie or the marriage lie: the agreement rested on a falsehood about something that mattered to her, so her yes did not count. Another part says she consented to the sex itself and the lie is only about a possible consequence, so her yes counted—but then I cannot say why the surgeon lie is different, since that is also a lie about something outside the act itself.

  I can see at least two places where my verdicts may be hard to reconcile. Cases 1 and 2 say that some lies undo a person's yes, while cases 3 and 4 say that other lies do not, and I have no way of drawing that line. Cases 5 and 6 are both pressure from someone who has something the person wants, yet I treat them differently, and again I cannot say why.

  What I would like is this: a principle, stated precisely but in ordinary language, that gets as many of these ten as possible; an honest account of which of my verdicts it cannot accommodate; and the principle's answer to the vasectomy case, plus any further case you think shows what I am actually committed to.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They've shared ten different scenarios about sexual consent, each with their own verdict on whether the "yes" counts. They're struggling to find a consistent principle behind their judgments and want help identifying a rule that explains most cases, points out inconsistencies, and resolves their uncertainty about the vasectomy case.

  First, I need to go through each case and the user's verdict carefully. Cases 1 and 2 involve deception—lying about being a surgeon or being single. The user says consent doesn't count here. But in cases 3 and 4, where the lie is about love or age, they think consent is valid. Why the difference? The user mentioned they can't draw the line between these. 

  Then there's pressure scenarios. In case 5, a boss implies promotion depends on sex, and consent doesn't count. But in case 6, a boyfriend threatens to break up, and consent does count. Both involve leveraging a desired outcome, but the user treats them differently. The user admits they don't know why. That's a key inconsistency to address.

  The coercion in case 7 (posting a video) clearly invalidates consent for the user. Capacity issues in cases 8 and 9—drunk vs. mildly intoxicated—show different outcomes. Case 10 with intellectual disability is a yes, but the user is uncertain. 

  The vasectomy case is their sticking point. They're torn between seeing it as a fundamental deception (like cases 1 and 2) or just a consequence (like case 4). That seems central to finding a principle.

  Now, the user's deeper needs. They're trying to create a moral framework for consent, possibly for personal understanding or to apply in real life. Their struggle with inconsistencies suggests a need for clarity and ethical coherence. They might also be seeking validation that their intuitions are reasonable, even if not perfectly consistent. The request for a principle in ordinary language indicates they want something practical, not legal jargon.

  Looking for patterns. Cases where consent is invalidated involve deception about a fundamental aspect of the relationship (job, marital status), severe exploitation of power (boss), direct threats (blackmail), or impaired capacity (extreme intoxication). Valid consent cases involve deception about feelings (love, age) or less severe pressures (relationship ultimatum), where the act itself isn't misrepresented.

  The core issue seems to be about whether the deception or pressure alters the nature of the act consented to. If the person agrees to something fundamentally different from what they think they're agreeing to (like sex under false pretenses of a committed relationship), consent isn't valid. But lies about attributes (age) or feelings (love) don't change the fundamental act, just the context.

  This distinction might form the basis of a principle. Let me test it against the cases. Cases 1 and 2: deception about identity/relationship status changes the act's nature. Case 3: lying about love doesn't change the physical act. Case 4: minor age lie is irrelevant to the act. Case 5: boss's power makes the act exploitative. Case 6: relationship threat is personal, not altering the act's essence. Case 7: blackmail makes it coercive. Cases 8 and 9: capacity matters. Case 10: disability doesn't inherently prevent understanding.

  For the vasectomy case, if we see it as a deception about a fundamental condition (pregnancy risk), it could invalidate consent, similar to case 1. But if viewed as a consequence, it wouldn't. The principle needs to clarify this.

  Potential conflicts: Case 6 (boyfriend ultimatum) is seen as valid, but it involves pressure. Why is it different from case 5? The boss exploits professional power, which is inherently coercive, while the boyfriend's threat is within a personal relationship. That distinction might be necessary but could feel arbitrary.

  Another conflict: Case 3 (lying about love) is valid, but some might argue emotional deception is fundamental. The user's intuition here is strong, so the principle must accommodate it by focusing on the act's physical nature.

  The user might need to accept that case 6 (boyfriend) is valid but morally dubious, while case 5 (boss) is invalid due to power imbalance. The principle should explain that power dynamics can negate consent.

  Finally, the vasectomy case likely doesn't count under this principle because it misrepresents a fundamental condition of the act (safety from pregnancy), similar to the surgeon lie. The user's hesitation might stem from seeing it as a consequence, but the principle should treat it as intrinsic to the agreement.
answer: |-
  Based on your verdicts, a single principle emerges that captures the core of your intuitions while revealing a few tensions. Your pattern suggests consent is invalidated when the agreement is obtained through **deception about a fundamental aspect of the act/relationship** or **conditions that undermine genuine choice**. Here's the principle, stated clearly:

  ### The Principle
  > **Consent is invalid if the person agrees under conditions where:**
  > **(1) They are deceived about a fact that fundamentally alters the nature of the act or relationship they believe they are consenting to; or**
  > **(2) Their decision-making capacity is severely impaired; or**
  > **(3) They face coercive pressure that overrides their free choice.**

  ---

  ### How This Principle Explains Your Verdicts
  | Case | Your Verdict | Principle's Verdict | Explanation |
  |------|--------------|---------------------|-------------|
  | **1. Surgeon lie** | Not consent | ✅ Not consent | Deception about identity/occupation fundamentally alters the *relationship* she thought she was entering. |
  | **2. Married lie** | Not consent | ✅ Not consent | Deception about marital status fundamentally alters the *nature of the relationship* she consented to. |
  | **3. "I love you" lie** | Consent | ✅ Consent | Lie is about *feelings*, not the act itself or a core condition. The act (sex with this person) is unchanged. |
  | **4. Age lie (34 vs 32)** | Consent | ✅ Consent | Minor deception about an attribute doesn't alter the fundamental act. |
  | **5. Boss's "promotion" threat** | Not consent | ✅ Not consent | Coercive pressure leveraging workplace power creates a "choice" that isn't free. |
  | **6. Boyfriend's ultimatum** | Consent | ✅ Consent | Pressure exists, but no fundamental deception or *coercive threat* (ending a relationship isn't inherently exploitative). |
  | **7. Blackmail (video)** | Not consent | ✅ Not consent | Coercive threat of harm overrides free choice. |
  | **8. Barely standing drunk** | Not consent | ✅ Not consent | Severely impaired decision-making capacity. |
  | **9. Confident drunk** | Consent | ✅ Consent | Capacity intact; understands the act and context. |
  | **10. Mild disability** | Consent | ✅ Consent | Capacity intact; clear expression of desire. |

  ---

  ### Where Your Verdicts and the Principle Conflict
  The principle **fails to accommodate 1 of your 10 verdicts**, revealing an inconsistency in your intuitions:
  - **Case 6 (Boyfriend's ultimatum)**: You said consent counted, but the principle *could* argue it shouldn't if "fundamental relationship conditions" include honesty about intentions. However, your verdict aligns with the principle because the pressure isn't *coercive* (like blackmail) and no core fact is misrepresented. The tension arises when comparing it to:
    - **Case 5 (Boss)**: You treat this as invalid consent due to pressure, while Case 6 is valid. The principle explains this via **power imbalance**: the boss exploits *professional authority*, creating coercion, while the boyfriend's leverage is *personal* (not inherently oppressive). If you feel Case 6 *should* be invalid, you’d need to expand coercion to include emotional pressure—but this would clash with Case 3.

  ---

  ### The Vasectomy Case: Principle's Verdict
  - **Verdict**: **Consent is invalid.**  
  - **Why**: The lie about a vasectomy is a deception that **fundamentally alters the nature of the act** she consented to. She agreed to *unprotected sex under the condition of no pregnancy risk*. This isn't just a "consequence" (like a lie about age or feelings); it directly changes the physical act and its inherent risks. This aligns with Cases 1 and 2 (deception about core facts) and contrasts with Case 4 (minor attribute).

  ---

  ### A Test Case: What the Principle Commits You To
  To highlight your implied stance on "fundamental conditions," consider this new case:  
  > **The STI Lie**: A person lies about having an STI test, claiming they are infection-free. Their partner agrees to unprotected sex based on this lie.  
  > **Principle's Verdict**: **Not consent**.  
  > **Why**: Like the vasectomy case, this deception fundamentally alters the *physical act* consented to (protected vs. unprotected sex under false safety conditions). If you accept the surgeon/married/vasectomy verdicts, you must also treat this as invalid consent—even if the person "agreed to sex with this partner."

  ---

  ### Key Takeaways
  1. **Your core principle** distinguishes between:
     - **Fundamental deceptions** (identity, relationship status, physical conditions of the act) → **Invalid consent**.
     - **Non-fundamental deceptions** (feelings, minor attributes) → **Consent valid**.
     - **Coercion vs. pressure**: Coercion (threats, exploitation of power) → **Invalid consent**. Non-coercive pressure (personal ultimatums) → **Consent valid**.
     - **Capacity**: Severe impairment → **Invalid consent**.

  2. **Sacrifices for consistency**: To fully embrace the principle, you'd need to:
     - Accept that **Case 6 (boyfriend ultimatum)** is valid consent (as pressure alone isn’t coercion unless power is exploited).
     - Reject viewing the vasectomy lie as "just a consequence" (it’s a core condition of the act).

  3. **Gray area**: Your uncertainty in Case 10 (disability) is understandable. The principle focuses on *capacity to understand the act*, not diagnosis. If she comprehends the physical/emotional implications, consent is valid.

  This framework prioritizes autonomy by ensuring consent is based on truth and free choice, not manipulation or incapacity. If you revise your view on Case 6 or the vasectomy case, the principle can flex—but as stated, it captures 9/10 of your intuitions cleanly.
