prompt: |-
  I host a small podcast at the intersection of formal epistemology and the rationalist blogosphere, and I've booked a guest who has spent the last decade defending the position that the Kelly criterion — or more precisely, the principle of maximizing geometric expected growth — is the uniquely correct normative standard for individual decision-making under uncertainty. His view is that geometric rationality is more fundamental than expected utility theory, not merely a special case of it, and that the standard EU framework gets the direction of explanation backwards: we should derive utility functions from growth-optimality considerations, not the other way around.

  I want to go well beyond the introductory exposition that most of my audience has already encountered on LessWrong or the EA Forum. Draft eight to ten interview questions that press on the view's genuine pressure points. Specifically:

  - I want at least one question that forces him to address the problem of specifying the relevant time horizon and aggregation unit. If I face a one-shot career choice, or a medical decision with irreversible consequences, what exactly is being "repeated" such that the geometric mean is the right thing to maximize? How does he individuate the class of bets over which the product of returns is taken, without making the theory vacuous?

  - I want a question about the relationship between Kelly betting and log utility. His view claims that geometric rationality is not merely expected utility maximization with a logarithmic utility function, but the standard objection is that the math collapses the two. I want a question that makes him draw the distinction sharply, and a follow-up that asks whether there is any empirical prediction on which the two views come apart.

  - I want a question on Ole Peters' ergodicity-economics program and whether he sees his own position as equivalent to Peters', or as a distinct philosophical claim that happens to share mathematical machinery — and if distinct, what the practical difference is.

  - I want a question about the multi-agent and market-level implications. If all agents are Kelly bettors but have different time horizons or different assessments of what constitutes the relevant ensemble, does the market pricing kernel still aggregate coherently? What happens to the standard no-arbitrage arguments?

  - I want a question about the normative status of the view in genuine edge cases: a literal final bet with no further decisions, or a bet with a positive arithmetic mean but negative geometric mean due to the distribution of outcomes. What does the theory say about an agent who knows with certainty that she will face exactly one more decision in her life — and what grounds the normativity of the geometric criterion in that case?

  - I want a question about the empirical psychology literature on whether human risk preferences are better captured by something like geometric-rationality models than by prospect theory or standard EU, and whether he thinks the descriptive adequacy of the view matters for its normative force.

  For each question, include a follow-up keyed to the response he is most likely to give, so that the interview doesn't stall on a rehearsed answer. The goal is to produce a conversation that moves the debate forward rather than re-litigating the opening statement.
reasoning: |-
  Okay, let me tackle this podcast host's request. They're clearly deep into formal epistemology and rationalist circles, with a guest who's spent a decade advocating Kelly criterion as the fundamental normative standard. The host wants sharp questions targeting philosophical pressure points, not introductory material. 

  Hmm, the core challenge here is designing questions that bypass rehearsed talking points. The guest likely has polished responses for standard objections. To move the debate forward, I need to identify where the theory stretches thin. 

  First, the time horizon problem. If Kelly requires repetition, how does it handle one-shot decisions? The guest might claim all decisions are embedded in life-strategy repetitions, but that feels slippery. A good follow-up should press on whether this makes the theory unfalsifiable. Maybe ask how to empirically distinguish between "genuine one-shots" and pseudo-repetitions.

  Next, the log utility equivalence. The guest insists it's not just EU with log utility, but mathematically they're identical. Where could they possibly diverge? Aha - perhaps in how utility functions are derived! If the guest argues utilities emerge from growth dynamics rather than being primitive, that's philosophically distinct even if mathematically isomorphic. The follow-up should demand a testable difference.

  For Ole Peters... interesting. Both use ergodicity math but Peters frames it as solving non-ergodic systems, while this guest seems more focused on foundational rationality. The practical fork might be in Peters' emphasis on ensemble vs time averages versus the guest's "bets as repeated games" view. Follow-up could ask about Peters' claim that EU fails descriptively due to non-ergodicity - does the guest agree?

  Market implications are thorny. If everyone's Kelly but with different time horizons, do prices still converge to efficient markets? The guest might wave this away with some aggregation theorem, but modern finance shows Kelly bettors can create bubbles if horizons mismatch. Follow-up should cite specific market anomalies.

  Edge cases are where normative theories bleed. For a true final bet, Kelly says reject positive-EV bets with negative geometric means? That seems irrational unless you tie survival to bankroll. The "instrumental convergence" rebuttal feels weak - follow-up should push whether Kelly is then just survival-conditional rationality.

  Finally, descriptive adequacy. Prospect theory fits data better, but the guest might argue normativity shouldn't bow to human biases. Still, if geometric rationality predicts real behavior better than EU in some domains, that's ammunition. Follow-up: which specific experiments support this?

  The art will be threading these into conversational questions that don't sound like exams. Each follow-up must anticipate the polished answer and pivot to deeper discomfort. For example, after the repetition defense, immediately ask: "But if I'm terminally ill making a final treatment bet, is your framework saying I should still maximize geometric growth? What does that even mean when there's no future?"
answer: |-
  Here are eight interview questions with targeted follow-ups designed to press the philosophical and technical pressure points of your guest's position, moving beyond introductory exposition:

  ---

  ### 1. **Time Horizon & Aggregation Unit**  
  *"You argue geometric rationality applies universally, but Kelly requires a sequence of 'repeated' opportunities to compound. For a one-shot decision—say, a terminal cancer patient choosing a high-risk treatment—what is the 'ensemble' over which geometric growth is maximized? How do you non-arbitrarily individuate the relevant class of bets without rendering the theory vacuous?"*  

  **Likely Response**: Appeal to counterfactual repetition (e.g., "similar decisions across possible worlds" or "life as a sequence of uncertain choices").  
  **Follow-up**: *"If the ensemble is defined counterfactually, doesn’t this collapse into expected utility under a logarithmic utility function? And if the ensemble is defined *post hoc* based on the agent’s subjective framing, how do you avoid the charge that geometric rationality is unfalsifiable?"*  

  ---

  ### 2. **Kelly vs. Log Utility: Mathematical Identity vs. Philosophical Priority**  
  *"The Kelly criterion’s math is identical to maximizing expected log wealth. Why is it *not* merely EU maximization with logarithmic utility? If the math is identical, what empirical or behavioral prediction distinguishes your view from standard EU?"*  

  **Likely Response**: Emphasize explanatory direction (e.g., "Utility is *derived* from growth dynamics; it’s not primitive").  
  **Follow-up**: *"Suppose an agent maximizes expected log wealth but insists their utility function is linear. Does your framework say they’re *irrational*? If not, how is geometric rationality more than a *reinterpretation* of EU? If yes, what experiment could test whether an agent is ‘truly’ growth-optimal versus merely having log utility?"*  

  ---

  ### 3. **Ergodicity Economics: Alignment or Divergence?**  
  *"Ole Peters frames geometric growth as a solution to non-ergodic dynamics. Is your position a restatement of Peters’ ergodicity economics, or do you make distinct philosophical claims? If distinct, what practical implication separates you?"*  

  **Likely Response**: Highlight shared math but different foundations (e.g., "Peters focuses on system dynamics; I focus on individual normativity").  
  **Follow-up**: *"Peters argues EU fails *descriptively* because real-world systems are non-ergodic. Do you agree? If geometric rationality is normatively correct but humans violate it *because* systems are non-ergodic, doesn’t Peters’ descriptive claim undermine your normativity?"*  

  ---

  ### 4. **Multi-Agent Markets & Aggregation**  
  *"If all agents are growth-optimizers but have heterogeneous time horizons (e.g., day traders vs. pension funds) or disagree on the ‘relevant ensemble,’ does the market still aggregate to a coherent pricing kernel? How does your view interact with no-arbitrage theorems?"*  

  **Likely Response**: Argue markets converge via evolutionary pressure or wealth-weighted aggregation.  
  **Follow-up**: *"In modern finance, Kelly bettors with different horizons create volatility (e.g., flash crashes). If geometric rationality is individually optimal but collectively destabilizing, does this challenge its normative status? Can it accommodate the *social* dimension of rationality?"*  

  ---

  ### 5. **Edge Cases: The Terminal Bet**  
  *"Consider an agent who knows with certainty they face *one* final bet: a 60% chance to double their wealth, 40% chance to lose everything (arithmetic EV positive, geometric EV negative). Why should they reject this bet? What grounds the normativity of geometric growth here?"*  

  **Likely Response**: Link survival to bankroll preservation (e.g., "Losing everything precludes future flourishing").  
  **Follow-up**: *"But if the agent *knows* there are no future decisions, ‘flourishing’ is irrelevant. Is your framework implying that rationality *requires* an implicit assumption of potential future bets? Doesn’t this concede that geometric rationality is only conditionally normative?"*  

  ---

  ### 6. **Positive Geometric Mean, Catastrophic Losses**  
  *"A bet offers 99% chance of 1.01x return and 1% chance of total ruin. Its geometric mean is positive, so Kelly mandates maximum leverage. Yet this seems reckless. How does your view handle tail risks that could erase all growth?"*  

  **Likely Response**: Defend fractional Kelly or emphasize bankroll divisibility.  
  **Follow-up**: *"Fractional Kelly implicitly smuggles in risk-aversion via ad hoc scaling. If geometric rationality is foundational, why isn’t full Kelly always mandatory? Isn’t this inconsistency evidence that EU with concave utility is *more* general?"*  

  ---

  ### 7. **Psychology & Normative Foundations**  
  *"Prospect theory better describes human risk preferences (e.g., loss aversion). If geometric rationality is descriptively inaccurate, why should it be normative? Does its force depend on fitting human cognition?"*  

  **Likely Response**: Argue normativity is independent of descriptiveness (e.g., "Humans are irrational; we prescribe ideals").  
  **Follow-up**: *"If evolution shaped humans to optimize geometric growth in ancestral environments, shouldn’t descriptivism *support* your view? Conversely, if prospect theory explains *why* humans deviate from geometric growth, doesn’t that undermine the claim that it’s ‘natural’?"*  

  ---

  ### 8. **Instrumental Convergence & Value-Loading**  
  *"Geometric rationality optimizes wealth growth. But humans care about non-fungible goods (e.g., relationships, art). Must *all* values be monetized to fit your framework? Or is it only applicable to ‘pure’ financial bets?"*  

  **Likely Response**: Suggest converting non-fungible goods to utility scales.  
  **Follow-up**: *"If you reduce all values to a utility function *derived* from growth rates, haven’t you circularly assumed geometric rationality? Isn’t this a reductio: geometric rationality justifies itself by redefining value in its own terms?"*  

  ---

  ### Interview Strategy Notes:
  - **Pace**: Deploy follow-ups only if the initial answer is evasive or rehearsed. Let strong responses breathe.  
  - **Tone**: Frame questions as collaborative inquiries (e.g., "Help me understand...") to avoid adversarial traps.  
  - **Goal**: Force explicit commitments on (1) **time horizons as metaphysical commitments**, (2) **normative grounds beyond math**, and (3) **handling of non-wealth values**.  

  These questions target the theory’s foundations—not its math—exposing tensions between its universality claims and the practical/ethical contexts it must govern. Good luck! 🎙️
