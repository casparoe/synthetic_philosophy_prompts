prompt: |-
  Last week a friend of mine got very excited about something called Good's theorem after reading a blog post on it, and now he brining it up every time anyone says they'd rather not know something. His summary, as best I can reconstruct it, is this: "Good proved mathematically that a rational agent can never be made worse off by acquiring new information. So any rational person should always want more evidence, even about painful things, and should never prefer ignorance. Refusing to find out is therefore always either irrational or a sign that you're secretly admitting the information would change your mind in a way you can't defend." He's used this on everything from "I don't want to know the date of my death" to "I don't want to read the reviews of my own book." I gather there is a real theorem by I. J. Good and that the actual claim is something narrower, about the expected value of cost-free information being non-negative for an expected-utility maximizer. But I don't know enough decision theory to see exactly where my friend's version slides from that into his much stronger practical conclusion. Could you go through his summary claim by claim and tell me what the theorem actually licenses, where he's overstating or conflating, and whether "you should always want to know" follows from anything true in the theorem? I'm especially suspicious of the jump from "not worse off in expectation beforehand" to "never worse off, and irrational to decline," but I'd like to know whether those are the right places to push.
reasoning: |-
  Okay, the user's friend is really into Good's theorem and uses it to argue that people should always want more information, even if it's painful. The user is skeptical and wants to know where the friend's interpretation goes wrong. Let me start by recalling what Good's theorem actually says. It's about expected utility and cost-free information for rational agents. The key points are that the expected value of information is non-negative, but that's under specific conditions.

  First, the user mentioned examples like not wanting to know the date of death or book reviews. The friend claims refusing info is irrational. But Good's theorem assumes the decision-maker is an expected utility maximizer with consistent preferences. Real people aren't always rational; emotions and psychological factors play a big role. That's a gap in the friend's argument.

  Then there's the expectation vs. reality point. The theorem says the average expected utility doesn't decrease, but any single instance could still lead to worse outcomes. It's probabilistic, not a guarantee. The friend ignores that distinction, jumping to "never worse off."

  Also, the theorem assumes information is cost-free. But in real life, acquiring info can have costs—time, emotional toll, distraction. The friend overlooks that. For example, reading bad reviews might demoralize someone, affecting their future work. That's a cost not accounted for.

  The user is suspicious of the jump from "not worse off in expectation" to "never worse off and irrational to decline." That's spot on. The theorem doesn't say you'll never be worse off; it's about the prior expectation. Actual outcomes can vary. Plus, declining info isn't necessarily irrational if there are hidden costs or cognitive biases.

  The friend also conflates normative rationality with human psychology. Rational agents in theory vs. real humans are different. People might avoid info to protect their mental health, which isn't irrational in a broader sense. Good's theorem doesn't account for that.

  The user probably wants to counter the friend's arguments effectively. Highlighting the assumptions of the theorem—like consistent utilities and cost-free info—can show where the friend overreaches. Emphasizing the difference between expected value and actual outcomes is key. Also, mentioning psychological costs and the distinction between ideal and real rationality would strengthen the user's case.

  Underlying needs: The user might feel pressured by the friend's misuse of the theorem and wants to understand the nuances to defend their stance on avoiding certain information. They need clear points to articulate why it's reasonable to sometimes prefer ignorance, without dismissing the theorem entirely.
answer: |-
  You've identified the core issues perfectly. Your friend is overgeneralizing Good's theorem (often called the **Expected Value of Information (EVI)** theorem) in several significant ways, turning a narrow, powerful technical result into an unrealistically broad and psychologically naive prescription. Let's break down his claims against what the theorem actually states.

  **Good's Theorem (EVI Theorem): The Core Claim**

  1.  **Context:** Decision theory under uncertainty. An agent is an **expected utility maximizer**.
  2.  **Assumptions:**
      *   The agent has a well-defined, consistent set of preferences representable by a utility function.
      *   The agent has well-defined prior probabilities over possible states of the world.
      *   The agent faces a **decision problem** (a choice between actions with uncertain outcomes).
      *   Acquiring the new information is **cost-free** (no direct cost, time cost, psychological cost, etc.).
      *   The information is directly relevant to the decision problem at hand (it potentially changes the probabilities of states affecting the outcomes of the actions).
  3.  **Theorem:** The **expected value** of acquiring this cost-free, decision-relevant information, *calculated with respect to the agent's prior probabilities and utility function before acquiring the information*, is **non-negative**. More precisely:
      *   `E[Utility | Acquire Info] >= E[Utility | Don't Acquire Info]`
      *   Where the expectation is taken over *both* the possible information signals *and* the possible states of the world, using the agent's prior beliefs.

  **What This Actually Means (The License):**

  *   **Before you know what the information *is***, the *expected* utility of getting it (and then making the optimal decision based on it) is at least as high as the expected utility of making the optimal decision *without* getting it. On average, in the long run, over many similar situations, getting free relevant info helps (or at least doesn't hurt) an expected utility maximizer make better decisions.
  *   It's fundamentally a statement about **rational planning under uncertainty**. A rational planner *anticipating* a future decision should never rule out *in advance* the possibility of acquiring free relevant information.

  **Where Your Friend's Summary Goes Astray (The Overreach):**

  Let's dissect his claims:

  1.  **"A rational agent can never be made worse off by acquiring new information."**
      *   **Overstatement:** The theorem says "not worse off *in expectation beforehand*". It **does not** say "never worse off *in actual outcome*". This is the critical jump you correctly identified.
          *   *Example:* Imagine you *could* learn if you have a terminal disease. Before knowing, it's rational to want to know (EVI is positive - knowing lets you plan treatment, finances, etc.). But *after* you learn you *do* have it, your utility (well-being) plummets compared to your blissfully ignorant state. You *are* worse off *in terms of experienced utility* at that moment, even though acquiring the info was the rational choice *ex ante*.
          *   The theorem guarantees the *decision-making process* isn't degraded *on average* by information, not that the *outcome* of the world revealed by the information won't be painful.

  2.  **"So any rational person should always want more evidence, even about painful things."**
      *   **Conflation (Scope & Costs):** The theorem assumes information is **cost-free** and **directly relevant to a specific decision**.
          *   *Psychological Costs:* Learning painful truths (like a bad review, death date, betrayal) often has inherent psychological costs (anxiety, sadness, loss of motivation) that directly reduce utility. The theorem *assumes* these costs are zero. If acquiring information *itself* causes disutility, the theorem's premise is violated. Avoiding information to prevent these direct costs *is* rational.
          *   *Relevance:* The theorem applies to information relevant to a *decision*. "The date of my death" might inform *some* decisions (retirement planning, bucket list), but for many people, it's primarily information with massive psychological cost and limited actionable decision value. "Reading reviews of my book" might inform marketing decisions, but for the author's personal well-being, the psychological cost might dominate the minor decision-making benefit. Good's theorem doesn't mandate wanting *all* information, only information *relevant to the decision problem you are considering*.
          *   *Distraction/Overload:* Information takes cognitive resources to process. Irrelevant or excessive information can distract from more important decisions or cause analysis paralysis. The theorem doesn't cover this.

  3.  **"Should never prefer ignorance." / "Refusing to find out is therefore always either irrational or a sign that you're secretly admitting the information would change your mind in a way you can't defend."**
      *   **False Dichotomy & Misinterpretation of Rationality:** This is the most significant overreach.
          *   *Expected Outcome vs. Actual Pain:* As above, preferring ignorance to avoid *certain* or *highly likely* psychological pain is perfectly rational if that pain outweighs the potential decision benefits *for that individual*. The theorem doesn't judge the *content* of utility; if avoiding pain is a core utility, then avoiding information causing pain is rational.
          *   *Self-Signaling/Commitment:* Sometimes refusing information is a way to commit to a course of action or maintain a beneficial state of mind. Not wanting to know if your partner *might* have cheated to preserve trust and happiness isn't necessarily "secretly admitting" anything indefensible; it could be a rational choice to prioritize relationship stability over a potentially devastating truth with limited corrective action possible.
          *   *Rationality Beyond EUM:* Humans aren't perfect expected utility maximizers. We use heuristics, suffer from biases, and have limited cognitive bandwidth. Sometimes "ignorance is bliss" is a functional heuristic for well-being. Strict EUM is a normative model, not always a descriptive one.
          *   *The "Can't Defend" Charge:* This misreads why someone might decline info. It could be because they *can* defend the likely negative impact on their utility (emotional cost) outweighing the decision benefit. They aren't "secretly admitting" the info would change their mind; they *openly acknowledge* it might devastate them emotionally, and they prioritize avoiding that *known risk*.
          *   *No Decision Context:* What "decision" is being informed by knowing your exact death date? Often, there isn't a clear, actionable decision framework where this info provides significant EVI *that outweighs its psychological cost*. Refusing it isn't irrational within a specific decision context; it's recognizing there *is no significant positive-EVI decision context* for that individual.

  4.  **"You should always want to know."**
      *   **Overgeneralization:** This ignores all the critical assumptions: cost-free, decision-relevant, calculation based on *prior expectation*. It also ignores the distinction between *ex ante* value and *ex post* experience. You can rationally *want* to know *before* you know (because EVI is non-negative) but deeply regret knowing *after* you see the painful result. The theorem only speaks to the *ex ante* want.

  **Key Places to Push (You Were Right to Be Suspicious):**

  1.  **Expectation vs. Reality:** Hammer the distinction: "The theorem says the *expected value beforehand* is non-negative. It does **not** guarantee that the *actual outcome after seeing the information* won't leave you worse off than blissful ignorance. A rational person *can* be made worse off by the *content* of true information, even if acquiring it was the rational choice. Pain is real utility loss."
  2.  **Cost-Free Assumption:** "Good's theorem assumes getting the information has *zero cost*. But painful information *itself* carries a huge psychological cost – dread, anxiety, sadness, loss of hope. If utility directly decreases just from *knowing*, then the information isn't 'cost-free,' and the theorem doesn't apply. Avoiding that cost is rational."
  3.  **Decision Relevance:** "The theorem is about information relevant to making a *specific decision*. 'Knowing the date of my death' isn't primarily about informing a decision; it's raw, potentially crushing knowledge with limited upside. Good's theorem doesn't force you to want information just for information's sake, only info relevant to improving an actual choice you face."
  4.  **Rationality Includes Avoiding Harm:** "Rationality isn't just about maximizing abstract 'information advantage'. It's about maximizing *your* overall well-being (utility). If you know information is likely to cause significant, irreparable harm to your well-being with little practical benefit, rationally avoiding that harm is perfectly sensible. Good's theorem deals with decision-making efficiency, not the totality of human flourishing."
  5.  **The Burden of Proof:** Flip the script slightly: "Good's theorem shows why acquiring info *can* be beneficial *on average*. But it doesn't prove that declining it *in a specific case with known high costs* is irrational. The burden is on *you* to show that for *this specific person, in this specific situation*, the info is truly cost-free and its expected decision benefit outweighs its expected psychological cost."

  **Conclusion:**

  Good's theorem is a profound insight into rational decision-making under uncertainty: free, relevant information is never harmful *to your expected decision outcomes* before you receive it. However, your friend misapplies it by:

  1.  Ignoring the critical distinction between **expected value (ex ante)** and **actual experienced outcome (ex post)**.
  2.  Ignoring real-world **psychological costs** that violate the "cost-free" assumption.
  3.  Overextending it to **any information**, regardless of relevance to a concrete decision.
  4.  Mischaracterizing the rationality of **avoiding known harms** to well-being.
  5.  Creating a false dichotomy where declining information must imply irrationality or bad faith.

  **"You should always want to know" does not follow from Good's theorem.** The theorem justifies wanting information *before you know what it is, if it's free and relevant to a decision*. It does not justify wanting *any* information regardless of cost or context, and it certainly doesn't guarantee that knowing won't make you feel worse. Rational agents can, and often rationally do, prefer blissful ignorance when the expected pain of knowing outweighs its expected decision-making benefits. Your skepticism about the jump from expectation to guaranteed outcome and the dismissal of psychological costs is exactly on point.
