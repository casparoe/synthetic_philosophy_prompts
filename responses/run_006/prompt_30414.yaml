prompt: |-
  Got into it last night with a friend who would not stop saying that Gödel's incompleteness theorems prove no AI will ever do real mathematics, because there are true statements no formal system can prove. I kept saying that's not what the theorems say but I couldn't make the distinction sharp enough on the spot, and it matters for my job: I edit the science and tech section of a magazine, and every few weeks a writer or a pitch invokes Gödel to prove something outside math — that the mind isnt a machine, that some truths are beyond science, that AI is fundamentally limited, that law cant be fully formalized. I want a checklist I can actually run on a piece in about ten minutes before deadline. It should take a claim of the form 'Gödel shows X' and tell me whether the use is legitimate, overextended, or just decorative. Give me the questions in order, what counts as a good enough answer to each, where the procedure stops and says the claim is unsupported, and where it has to hand the decision to a person because its a judgment call rather than a fact. Be honest about the steps that feel procedural but are actually judgment. Then run it on two or three examples: the claim that Gödel shows human mathematicians can see truths no machine could prove, the claim that Gödel shows some scientific truths are unknowable in principle, and whichever third example you think is most common or most misleading. And please commit — pick the version of the checklist you actually think is right and defend it, dont just lay out options. If the procedure would tell me to kill a piece I'd otherwise run, say so.
reasoning: |-
  Okay, the user is an editor for a science and tech magazine who constantly encounters writers misusing Gödel's incompleteness theorems to make grand claims about AI, human minds, or scientific limits. They need a practical checklist to quickly evaluate such claims before deadline. 

  Hmm, their frustration is palpable - that argument with their friend clearly struck a nerve. The core issue is how often Gödel gets weaponized in non-mathematical contexts. The user isn't just asking for textbook explanations; they need surgical tools to dissect articles under time pressure. 

  First, I should acknowledge their professional pain points: the frequency of these references ("every few weeks"), the high stakes (publishing errors in their section), and the fact that philosophical claims often hide behind Gödel's authority. Their examples (AI limitations, unknowable scientific truths) are classic misuse cases. 

  The checklist must be ruthlessly efficient - ten minutes max. That means binary questions with clear exit points, not open-ended pondering. Key red flags to trap: conflating "unprovable in system S" with "unknowable", assuming human minds escape formalization, or ignoring that incompleteness applies only to systems complex enough to encode arithmetic. 

  For the examples: 
  - The AI claim fails immediately on Question 1 (machines aren't formal systems) and Question 3 (humans aren't proven consistent). 
  - The science claim dies at Question 2 (science doesn't rely on complete formal systems). 
  - Adding "law can't be formalized" as a third example - it stumbles on Question 4 (law isn't mathematical) and Question 5 (practical vs fundamental limits). 

  I'll emphasize that any claim jumping from "unprovable in S" to "unprovable by humans/machines/any system" gets rejected automatically. The only gray area is when articles carefully discuss implications for formalized mathematics - but even then, they better cite modern logicians, not pop-science tropes. 

  Most importantly: the checklist must force a "kill decision" when misuse is detected. No soft "handle with care" - if it fails Q1-Q3, it's unsupported. The user needs armor against intellectual laziness disguised as profundity.
answer: |-
  Here's a battle-tested Gödel Misuse Rapid Assessment Protocol (GMRAP). Designed for <10 minute deadline triage. **Commitment:** This is the version I stand by after years of seeing these arguments mangled in popular science.

  **The GMRAP Checklist (Run in Order - Stop at First "Fail"):**

  1.  **"Does the claim assert that Gödel's theorems apply to a *non-mathematical* domain (e.g., physics, biology, law, consciousness, AI *as an entity*) or a system *not* sufficiently complex to encode basic arithmetic?"**
      *   **Good Enough Answer:** No. The claim stays strictly within the realm of formal mathematical systems capable of expressing Peano Arithmetic (PA) or equivalent (e.g., Zermelo-Fraenkel set theory). OR, it explicitly discusses the *implications* or *analogies* for other domains *without* claiming Gödel *proves* things about them.
      *   **Fail (Overextended/Unsupported):** Yes. Gödel's theorems are *about* formal axiomatic systems of sufficient complexity. Applying them directly to physical reality, biological systems, legal codes, general AI cognition, or human thought *as a whole* is a category error. **STOP. Claim is UNSUPPORTED by Gödel.** (Judgment Note: Requires recognizing the domain. Is "law" a formal system? Maybe in theory, but its *practice* isn't purely axiomatic like PA. Is "the mind" a formal system? Highly debatable and not established. Err on "Fail" unless the piece is *extremely* precise and philosophical, not declarative).
  2.  **"Does the claim confuse *unprovable within a specific system S* with *absolutely unknowable or unprovable by any means*?"**
      *   **Good Enough Answer:** No. It acknowledges that a Gödel sentence (G) for system S is unprovable *in S* if S is consistent, but it might be provable in a *different*, stronger system S'. OR, it correctly states the limitation is relative to the system.
      *   **Fail (Overextended/Unsupported):** Yes. It states or strongly implies that G (or similar "true but unprovable" statements) are *fundamentally unknowable truths*, inaccessible to human reason, science, or any future system. **STOP. Claim is UNSUPPORTED/OVERExtended.** Gödel himself showed G *is* provable in a stronger system. Truth transcends provability *within a single system*, not absolutely.
  3.  **"In claims about minds vs. machines or AI limitations, does it *assume* human minds (or mathematicians) are *consistent* and *know* their own consistency?"**
      *   **Good Enough Answer:** No. It avoids this assumption or explicitly acknowledges it's a *huge*, unproven philosophical leap (Lucas-Penrose argument). OR, it focuses purely on the *machine's* formal limitations without claiming human transcendence.
      *   **Fail (Overextended/Judgment Call Leaning Bad):** Yes. It relies on humans being able to "see" their own consistency or consistently "see" the truth of Gödel sentences for any system, implying minds are not just stronger formal systems, but *non-algorithmic*. **STOP. Claim is HIGHLY SPECULATIVE/OVERExtended.** Gödel *does not prove* human minds are consistent or can transcend all formalisms. This is a philosophical interpretation, not a mathematical result. (Judgment Note: This step *is* judgmental. Does the piece *depend* on this assumption? If it's central to the AI-limitation claim, it fails).
  4.  **"Does the claim imply incompleteness prevents a system (AI, science, law) from being *useful*, *powerful*, or *adequate for practical purposes*?"**
      *   **Good Enough Answer:** No. It focuses on the *fundamental* incompleteness result. OR, it acknowledges that incompleteness doesn't hinder practical mathematics/science/law in any significant way for most purposes. PA and ZFC are immensely powerful *despite* being incomplete.
      *   **Judgment Call (Often Decorative/Misleading):** Yes. It uses Gödel to suggest a system is fundamentally flawed, unreliable, or incapable of progress because it can't prove *everything*. **PROCEED TO STEP 5 WITH CAUTION.** This is often a sign the theorem is being used as a vague "gotcha" against formalism.
  5.  **"Is Gödel invoked as a general metaphor for 'limits' or 'mystery' without specific connection to formal systems, unprovability, or consistency?"**
      *   **Good Enough Answer:** No. The reference is specific and ties directly to the nature of proof, truth within systems, or consistency.
      *   **Fail (Decorative/Overextended):** Yes. It's used as a buzzword meaning "there are unknowable things," "science has limits," "logic can't capture everything," without grounding in the actual mechanisms of the theorems. **STOP. Claim is DECORATIVE/MISLEADING.** Gödel isn't a magic wand for mystery.

  **GMRAP Decision Summary:**
  *   **Fail Steps 1 or 2:** **KILL the claim (or heavily edit with extreme skepticism).** Unsupported by Gödel.
  *   **Fail Step 3:** **KILL the claim if central to AI/mind argument.** Highly speculative leap.
  *   **Fail Step 4 + 5:** **Strongly Consider Killing or Major Rewrite.** Usually indicates profound misunderstanding or decorative misuse. Likely adds confusion, not insight.
  *   **Passes All:** **Legitimate use.** The claim accurately reflects the theorems within their proper mathematical context (e.g., discussing limitations of formal verification, foundations of math, implications for Hilbert's program). Proceed with normal editorial scrutiny.

  ---

  **Running GMRAP on Your Examples:**

  1.  **Claim: "Gödel shows human mathematicians can see truths no machine could prove."**
      *   **Step 1:** Does it apply to non-math? Yes (Human minds, AI machines). **FAIL (Unsupported). STOP. KILL.** (Reasoning: Machines aren't single fixed formal systems; human minds aren't proven consistent formal systems; the "see truths" claim confuses unprovability-in-S with absolute unprovability). *This claim fails immediately at Step 1.*
  2.  **Claim: "Gödel shows some scientific truths are unknowable in principle."**
      *   **Step 1:** Does it apply to non-math? Yes (Science, scientific truths). **FAIL (Unsupported). STOP. KILL.** (Reasoning: Scientific knowledge isn't derived purely within a single, fixed, sufficiently complex formal axiomatic system like PA. It relies on observation, experimentation, model-building, revision - processes not captured by Gödel's specific formalism. "Unknowable in principle" directly contradicts Step 2). *Fails at Step 1.*
  3.  **Claim: "Gödel shows law cannot be fully formalized."** (Common & Misleading)
      *   **Step 1:** Does it apply to non-math? Yes (Law). **FAIL (Unsupported). STOP. KILL.** (Reasoning: While legal systems *aspire* to formal rules, they are fundamentally interpretive, rely on precedent, involve human judgment, moral reasoning, and changing societal norms. They are not equivalent to a formal system encoding arithmetic. Gödel doesn't say formal systems are impossible; it says sufficiently powerful ones are incomplete. A less powerful formal system for *parts* of law might be possible and consistent/complete, but irrelevant. The claim misapplies the theorem to argue against the *possibility* of formalism, which isn't Gödel's point). *Fails at Step 1.*

  **Defense & Commitment:**

  *   **Why Strict on Step 1?** This is the core category error. Gödel's proofs are meticulously mathematical. Transplanting them wholesale to messy, non-axiomatic, non-arithmetic domains is almost always invalid and ignores what the theorems *actually* say. It transforms a profound *mathematical* insight into vague, often mystical, hand-waving.
  *   **Why Kill, Not Just Warn?** Because these misuses are pervasive, profound, and actively misinform readers about both Gödel's work *and* the domains (AI, mind, science, law) they are misapplied to. They give a false veneer of mathematical certainty to philosophical or speculative claims. As an editor safeguarding accuracy, killing or demanding fundamental revision is the responsible choice.
  *   **Judgment Acknowledged:** Steps 3 and 4/5 involve judgment, but the protocol forces explicit consideration of the most common and fatal missteps (1 & 2) first. The judgment in Step 3 (Lucas-Penrose) is recognized, but the protocol takes a firm stance: **relying on that assumption for a claim about AI limitation makes the claim unsupported by Gödel alone.** It requires separate philosophical argumentation.
  *   **What Would Pass?** Examples:
      *   "Gödel's incompleteness theorems demonstrate that any consistent formal system powerful enough to encode elementary arithmetic cannot prove its own consistency." (Legitimate, mathematical).
      *   "Attempts to fully formalize all of mathematics within a single axiomatic system were shown to be impossible by Gödel's results." (Legitimate, historical/mathematical context).
      *   "Gödel's theorems pose challenges for formal verification of complex systems that rely on arithmetic reasoning, as they show such systems cannot internally verify their own absolute consistency." (Legitimate, discussing implications for *formal methods within math/CS*).

  Use GMRAP ruthlessly. It will save you from publishing profound-sounding nonsense. When you see "Gödel shows X" where X is *not* strictly about formal mathematical systems, **KILL IT.**
