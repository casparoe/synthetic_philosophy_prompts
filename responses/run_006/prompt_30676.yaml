prompt: |-
  I teach a graduate seminar in the philosophy of the social sciences, and two of my students have spent the term arguing past one another about methodological individualism and holism. One defends the view that satisfactory explanations of social phenomena must terminate in facts about individual agents — their beliefs, desires, opportunities, and actions — and that appeals to structures, institutions, or norms are legitimate only as shorthand for complex constellations of individual-level facts. The other defends the view that social structures, institutional roles, and relational properties have explanatory autonomy, and that some genuine social-scientific explanations cannot be decomposed into individual-level narratives without losing what does the explaining. I have asked them to stop debating and instead draft the joint statement of an adversarial collaboration, and I want you to write the document they should produce.

  The document should open with a numbered list of claims both parties can sign without reservation, stated precisely enough that they are neither vacuous nor slanted; these should include claims about supervenience (for example, whether all social facts are fixed by facts about individuals), about the difference between ontological and explanatory theses, and about what it would mean for a social explanation to be "reducible" in the relevant sense. It should then present a disagreements table in which each row states a residual disagreement, phrased so that its own side would accept the wording and the other side would recognize it as the genuine target. Where a disagreement is merely verbal — for example, if the two parties mean different things by "reduction" or "microfoundations" — say so explicitly and restate the substantive issue, if any, that survives the clarification. The document should then set out the cruxes: the sub-questions such that settling one of them would move at least one party. For each crux, specify a concrete case, argument, or kind of evidence that both parties agree bears on it, and record in advance what each side predicts the case or evidence will show. Candidate cruxes you might take up, if both parties would recognize them as load-bearing, include: whether multiple realizability of social kinds by individual-level configurations blocks explanatory reduction or only identity reduction; whether there are explanatory successes at the structural level that would be impossible, rather than merely inconvenient, to reproduce at the individual level; whether the demand for microfoundations is a constitutive requirement on social explanation or a defeasible methodological preference; and whether the "individuals" to which the individualist appeals are themselves constituted by social relations in a way that undercuts the proposed explanatory base. Do not pad the document with bookkeeping, and do not include any bibliography, citations, or appeals to authority; the interest of the exercise is entirely in the formulations, the diagnosis of verbal disputes, and the pre-registration of what would change each side's mind.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two graduate students in the philosophy of the social sciences, one a methodological individualist (MI) and the other a methodological holist (MH). The document must be precise and avoid slant. We start with agreed claims, then a table of disagreements (with verbal disputes clarified), and then cruxes with pre-registered predictions.

  ## Step 1: Agreed Claims (Numbered List)
  Both parties agree on the following:

  1. **Supervenience Thesis**: All social facts supervene on facts about individual agents (including their mental states, actions, and relations). That is, there can be no difference in social facts without some difference in the individual-level facts.

  2. **Ontological vs. Explanatory Distinction**: The debate is not primarily about ontology (what exists) but about explanation (what explains). Both parties agree that social structures and institutions exist, but they disagree about whether they have explanatory autonomy.

  3. **Reduction Defined**: For a social explanation to be "reducible" in the relevant sense means that the explanation can be fully reconstructed (without loss of explanatory power) as a narrative (or set of narratives) that appeals only to individual agents and their properties (beliefs, desires, opportunities, actions, and relations). Both parties agree that such a reconstruction being possible does not necessarily imply that it is always useful or practical to provide it.

  4. **Multiple Realizability**: Social kinds (e.g., money, institutions, social classes) are multiply realizable at the individual level. That is, the same social kind can be instantiated by many different configurations of individual agents and their properties.

  5. **Microfoundations as a Constraint**: The demand for microfoundations is, at minimum, a constraint on acceptable social explanations: an explanation that is incompatible with the existence of microfoundations (i.e., with the supervenience thesis) is unacceptable. However, they disagree on whether this constraint is merely a minimal requirement or whether it requires that the explanation itself be given at the individual level.

  ## Step 2: Disagreements Table
  For each row, we state a residual disagreement. We phrase it so the side defending it would accept the wording and the other would recognize it as the target. If it's verbal, we note that and restate the substantive issue.

  | Disagreement | Methodological Individualist (MI) | Methodological Holist (MH) |
  |--------------|-----------------------------------|----------------------------|
  | **Explanatory Autonomy of Social Structures** | MI holds that social structures, institutions, and norms do not have explanatory autonomy because any causal power attributed to them must be reducible to the causal powers of individuals. | MH holds that some social structures, institutions, and relational properties have explanatory autonomy: they can be genuine causes in social explanations without being reducible to individual-level narratives without explanatory loss. |
  | **Reducibility of Explanations** | MI holds that every satisfactory social explanation must be reducible (in the sense of Claim 3) to an individual-level explanation. | MH holds that some social explanations are not reducible without losing explanatory power. |
  | **Microfoundations Requirement** | MI holds that the demand for microfoundations is a constitutive requirement for any legitimate social explanation: an explanation that does not specify (at least in principle) how it arises from individual actions is incomplete. | MH holds that the demand for microfoundations is a defeasible methodological preference: it may be useful in some contexts but is not necessary for an explanation to be legitimate. |
  | **The Nature of the Individual** | MI holds that the individuals in their explanatory base are not undermined by the fact that they are socially embedded because the social embedding is itself reducible to individual-level facts. | MH holds that the individuals to which MI appeals are themselves constituted by social relations in a way that undercuts the proposed explanatory base: the properties of individuals (e.g., beliefs, desires) are shaped by social structures, so individual-level explanations presuppose the social. |

  **Note on Verbal Disputes**: 
  - The term "reduction" is sometimes used differently. MI uses it to mean the possibility of reconstruction without loss of explanatory power. MH sometimes uses it to mean the actual replacement of a higher-level explanation by a lower-level one. However, both agree on the definition in Claim 3 for the purpose of this document. The substantive issue is whether such reconstruction without loss is always possible.
  - The term "microfoundations" is also sometimes ambiguous. We have defined it as a constraint (Claim 5) and clarified the disagreement as whether it is constitutive or methodological.

  ## Step 3: Cruxes
  For each crux, we specify a sub-question and a concrete case, argument, or kind of evidence that both parties agree bears on it. We record what each side predicts.

  ### Crux 1: Multiple Realizability and Explanatory Reduction
  - **Sub-question**: Does the multiple realizability of social kinds block explanatory reduction (in the sense of Claim 3) or only identity reduction?
  - **Case/Evidence**: Consider the explanation of the stability of a social institution (e.g., a money-based economy) across different societies with very different individual-level configurations (e.g., different beliefs about money, different motivations for using it). 
    - **MI Prediction**: The stability of the institution can be explained by showing, for each society, how the individual-level interactions (given their specific beliefs and desires) produce the stability. The multiple realizability does not block reduction because we can provide a disjunctive set of individual-level narratives. The explanation at the institutional level is a placeholder for such disjunctive sets and is therefore reducible.
    - **MH Prediction**: The stability of the institution is best explained by the institutional structure itself (e.g., the role of money as a medium of exchange) because the individual-level narratives are too disparate to capture the common explanatory factor. The reduction would lose the unifying power of the institutional explanation.

  ### Crux 2: Explanatory Success at the Structural Level
  - **Sub-question**: Are there explanatory successes at the structural level that would be impossible (rather than merely inconvenient) to reproduce at the individual level?
  - **Case/Evidence**: Consider a structural explanation of a social phenomenon, such as the explanation of a housing market segregation pattern by appeal to the structure of the housing market (e.g., feedback loops from discriminatory practices) without detailing the individual transactions and decisions.
    - **MI Prediction**: The structural explanation can in principle be reduced to individual-level narratives (e.g., by agent-based modeling) without loss of explanatory power. If the structural explanation is successful, it is because it implicitly relies on microfoundations that could be made explicit.
    - **MH Prediction**: The structural explanation captures emergent causal mechanisms (e.g., feedback loops) that are not present at the individual level and cannot be captured by aggregating individual actions without introducing structural concepts. Attempts at reduction either fail to capture the feedback dynamics or must reintroduce structural concepts, thus showing the autonomy of the structural level.

  ### Crux 3: Microfoundations as Constitutive or Methodological
  - **Sub-question**: Is the demand for microfoundations a constitutive requirement on social explanation or a defeasible methodological preference?
  - **Case/Evidence**: Consider a historical explanation of a revolution that appeals to class conflict and structural contradictions without providing microfoundations (e.g., without detailing how the class conflict arises from individual actions). 
    - **MI Prediction**: Without microfoundations, the explanation is incomplete and potentially flawed because it might be inconsistent with individual-level facts (e.g., if the individuals in the classes did not have the beliefs or desires attributed to them). Therefore, the requirement is constitutive.
    - **MH Prediction**: The explanation may be complete and successful without microfoundations because the structural factors (class conflict) are the primary drivers and the microfoundations, while perhaps available, are not necessary for the explanation. The requirement is methodological and context-dependent.

  ### Crux 4: The Social Constitution of the Individual
  - **Sub-question**: Are the individuals to which the individualist appeals themselves constituted by social relations in a way that undercuts the individualist explanatory base?
  - **Case/Evidence**: Consider an individual's belief that a piece of paper is money. This belief is shaped by social institutions (e.g., the monetary system). 
    - **MI Prediction**: The belief can be explained by the individual's interactions with others (e.g., observing others accepting the paper, learning from parents) and thus is reducible to individual-level facts (including the mental states of others). The social institution is an aggregate of such individual interactions and beliefs.
    - **MH Prediction**: The belief is only possible within a social institution that assigns the role of money to the paper. Therefore, the individual's mental state presupposes the social institution, which cannot be reduced without circularity. The individualist base is undercut because it relies on social facts.

  This document is now complete. We have avoided bookkeeping and appeals to authority, focusing on the formulations, the diagnosis of verbal disputes, and the pre-registration of cruxes.
answer: |-
  ### Joint Statement: Methodological Individualism vs. Holism  
  *An Adversarial Collaboration*  

  #### I. Agreed Claims  
  Both signatories endorse the following propositions without reservation:  
  1. **Supervenience Base**: All social facts supervene on facts about individual agents—their mental states (e.g., beliefs, desires), actions, and relations. No difference in social facts (e.g., the existence of an institution) can obtain without some difference in individual-level facts.  
  2. **Ontology/Explanation Distinction**: Social structures and institutions exist, but their *explanatory role* is distinct from their existence. The dispute concerns whether explanations must reference individuals exclusively or can legitimately cite structures/institutions.  
  3. **Reducibility Defined**: A social explanation is "reducible" iff it can be reconstructed *without loss of explanatory power* as a narrative exclusively citing individuals’ properties and interactions. This does not entail that reduction is always pragmatically necessary.  
  4. **Multiple Realizability**: Social kinds (e.g., "bureaucracy," "inflation") are multiply realizable: identical social phenomena can arise from different configurations of individual agents.  
  5. **Microfoundations Constraint**: Explanations violating the supervenience thesis (e.g., positing causally active social facts with no individual-level grounding) are inadmissible. Disagreement remains on whether satisfying this constraint requires individual-level *explanations*.  

  ---

  #### II. Disagreements  
  Each row states a disagreement neutrally. The proponent accepts the wording; the opponent acknowledges it as their target.  

  | Disagreement | Individualist’s Position | Holist’s Position |  
  |--------------|--------------------------|-------------------|  
  | **Explanatory Autonomy** | Social structures lack explanatory autonomy: any causal power attributed to them is derivative of individual actions and mental states. | Social structures possess irreducible causal power: explanations citing structures (e.g., "organizational roles caused the delay") capture patterns that individual-level narratives cannot replicate without explanatory loss. |  
  | **Reducibility of Explanations** | All legitimate social explanations are reducible (per §I.3); appeals to structures are placeholders for complex individual-level stories. | Some social explanations are irreducible: decomposing them into individual-level narratives obscures structural mechanisms (e.g., feedback loops between roles). |  
  | **Microfoundations Requirement** | Providing microfoundations is constitutive: an explanation is incomplete unless it specifies how individual actions produce the phenomenon. | Microfoundations are methodologically useful but defeasible: explanations at the structural level can be complete without tracing individual pathways. |  
  | **Constitution of Individuals** | Individuals’ properties (e.g., beliefs) are explanatorily fundamental; social relations reduce to patterns of individual interactions. | Individuals are socially constituted: their properties (e.g., "believing money has value") presuppose structures, making individualist explanations circular or incomplete. |  

  **Verbal Dispute Diagnosis**:  
  - "Reduction" is uncontested in meaning (§I.3). The holist’s claim that some explanations "cannot be reduced" is substantive, not semantic.  
  - "Microfoundations": The individualist uses it to mean *explanations must include individual mechanisms*; the holist uses it to mean *explanations must be consistent with individual-level constraints*. This is a substantive disagreement about explanation, not terminology.  

  ---

  #### III. Cruxes  
  For each crux, we specify:  
  - **The sub-question** whose resolution would shift at least one party’s view.  
  - **A shared case/evidence** both agree is probative.  
  - **Predictions** for what the case/evidence will reveal.  

  1. **Crux: Multiple Realizability and Explanatory Power**  
     - *Sub-question*: Does multiple realizability block explanatory reduction (by making structural explanations indispensable) or merely show that social kinds lack type-identity?  
     - *Case*: Explain why identically structured firms (e.g., hierarchical bureaucracies) exhibit similar inefficiencies across cultures with divergent individual psychologies.  
       - *Individualist Prediction*: The pattern will reduce to individual interactions (e.g., rational responses to incentives) without needing structural causes. Differences in psychology will show reducibility via disjunctive individual-level narratives.  
       - *Holist Prediction*: The shared inefficiency pattern will only be explainable by the organizational structure itself; individual-level accounts will either miss the invariant cause or reintroduce structural proxies.  

  2. **Crux: Explanatory Success Without Reducibility**  
     - *Sub-question*: Are there structural explanations that cannot be reproduced individualistically *even in principle* (not merely inconveniently)?  
     - *Case*: Use network theory to explain information diffusion in a community (e.g., "centralized networks spread simple ideas faster"). Test via agent-based models (ABMs) that simulate individual actions *without* structural variables.  
       - *Individualist Prediction*: ABMs replicating the diffusion pattern using only individual interactions (e.g., imitation, communication rules) will succeed, confirming reducibility.  
       - *Holist Prediction*: ABMs will either fail to replicate the pattern or surreptitiously embed structural properties (e.g., by hardwiring network positions), proving structural explanations’ autonomy.  

  3. **Crux: Microfoundations as Constitutive vs. Methodological**  
     - *Sub-question*: Is the microfoundations demand a requirement for explanation *as such*, or a heuristic for tractability?  
     - *Case*: Assess a structural explanation of a banking crisis (e.g., "regulatory arbitrage caused systemic risk") that lacks individual mechanisms. Evaluate whether adding microfoundations (e.g., traders’ profit-seeking behaviors) yields new predictive/explanatory insights.  
       - *Individualist Prediction*: Without microfoundations, the explanation will fail to predict novel cases (e.g., when trader psychology shifts); supplying them will improve accuracy, proving their necessity.  
       - *Holist Prediction*: The structural explanation will predict outcomes (e.g., regulatory loopholes → crises) without microfoundations; adding individual details may refine but not fundamentally alter the explanation.  

  4. **Crux: Social Constitution of Individuals**  
     - *Sub-question*: Does the social constitution of individuals’ properties (e.g., "having a belief about money") undermine individualist explanations by presupposing social facts?  
     - *Case*: Explain the persistence of a norm (e.g., "tipping") in a new society. Analyze whether individuals’ reasons for compliance (e.g., "I desire to avoid shame") rely on prior social structures.  
       - *Individualist Prediction*: Norm persistence reduces to individuals’ beliefs/desires (e.g., shame avoidance), which arise from pre-social psychology (e.g., innate emotion) or learning from others’ actions.  
       - *Holist Prediction*: "Shame" presupposes a socially constituted emotion; individualist accounts will implicitly invoke structural norms (e.g., "shame" as a sanction), rendering reduction circular.  

  ---  
  This document identifies precise agreements, substantive disagreements, and testable cruxes. Progress requires engaging the specified cases/evidence and updating positions based on outcomes.
