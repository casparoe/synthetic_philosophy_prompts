prompt: |-
  Effective altruism's leading grantmaking and career-advice organizations have long treated earning to give as a serious strategy, encouraging talented people to take high-paying jobs in finance, consulting, or technology in order to donate a large share of their income, and they have tended to favor interventions whose benefits can be expressed in robust quantitative terms: cost-effectiveness estimates, randomized controlled trials, or lives saved per dollar. Interventions with diffuse or slow-moving benefits, such as systemic advocacy, movement-building, political reform, or cultural change, have often been treated as speculative and deprioritized, on the grounds that donors should fund only what can be shown to have the highest expected impact per dollar. There is an apparent tension here: the same movement discounts unquantified systemic effects when it evaluates causes, yet encourages members to enter large firms whose systemic effects it does not attempt to measure. What theory of value and of justified action does this pattern of practice presuppose? Does it strictly require welfarist consequentialism, or is it compatible with a wider range of views? Does earning to give presuppose that a career is morally assessable in the same way as a grant, and that a marginal dollar is fungible across causes? Reconstruct the implicit theory as precisely as you can, distinguish what the practice strictly presupposes from what it merely fits well with, and say what would have to change in these institutions' behavior if they instead held that some goods are incommensurable with lives-saved-per-dollar, or that durable institutional and political change is the primary object of moral concern. Keep your answer to no more than 600 words.
reasoning: |-
  Hmm, the user is asking about effective altruism (EA) and its approach to earning to give versus systemic interventions. They've pointed out a tension: EA organizations encourage people to take high-paying jobs to donate money, prioritizing quantifiable interventions like cost-effectiveness estimates, while discounting systemic advocacy or political reform which are harder to measure. The user wants me to reconstruct the implicit theory behind this practice, explore what ethical views it requires, and consider how things would change if EA valued incommensurable goods or durable political change more highly.

  I need to analyze this carefully. The core tension is that EA measures some impacts rigorously (like lives saved per dollar) but doesn't measure the systemic effects of the careers it promotes (like working in finance or tech). This suggests an implicit theory where what matters is direct, quantifiable outcomes, and careers are seen primarily as funding mechanisms.

  For the implicit theory, I should break it down into components. First, there's the evaluation framework: EA seems to rely on consequentialist welfarism, focusing on wellbeing that can be measured numerically. Then there's fungibility: treating all dollars as interchangeable and equally valuable across causes. And career fungibility: viewing careers as morally equivalent to grants as long as they generate the same amount of money for donations.

  I should distinguish what this strictly presupposes versus what it merely fits well with. Strictly, it requires strong commensurability (all values reducible to a common metric like wellbeing units) and fungibility across contexts. It fits well with welfarist consequentialism but doesn't strictly require it—a pluralist could adopt this if they accept commensurability. However, it's incompatible with views that see certain goods as incommensurable or that prioritize systemic change over direct outcomes.

  If EA institutions shifted to value incommensurable goods or durable political change as primary, several things would change: They'd need new evaluation methods for qualitative impacts, might prioritize careers that build movements or influence policy directly over high-earning ones, and would likely fund long-term advocacy even without quantifiable metrics. This would represent a significant paradigm shift from their current approach.

  I'll structure my response to first reconstruct the implicit theory clearly, then discuss the ethical presuppositions, and finally outline the changes needed under alternative value systems—all while keeping it under 600 words. I should be precise about what's strictly required versus compatible, and avoid unnecessary jargon while maintaining academic rigor.
answer: |-
  The implicit theory underpinning this EA practice can be reconstructed as follows:

  1.  **Value Monism & Strong Commensurability:** All morally relevant outcomes (wellbeing, suffering reduction, existential risk mitigation) are ultimately reducible to a single, quantifiable common metric (e.g., wellbeing-adjusted life years, QALYs/WALYs, or a similar "utility" proxy). This allows direct comparison of vastly different interventions (e.g., bednets vs. policy reform) via cost-effectiveness analysis (CEA).
  2.  **Marginal Fungibility:** A marginal dollar donated is perfectly fungible across causes and interventions. Its impact is determined solely by the cost-effectiveness of the intervention it funds *at the margin* within the most effective *available, measurable* cause area. The source of the dollar (e.g., finance salary vs. non-profit wage) is irrelevant to its moral value once donated.
  3.  **Career Instrumentalism:** A career’s primary *direct* moral value lies in its capacity to generate resources (money, influence, skills) that can be deployed to fund cost-effective interventions. The career itself is a means, assessed similarly to a grant: by the *expected* counterfactual impact of the resources it generates funneled into the most cost-effective measurable interventions.
  4.  **Epistemic Priority on Quantification:** Robust quantification (CEA, RCTs) provides uniquely reliable evidence of counterfactual impact and expected value. Interventions lacking such metrics are inherently more speculative, leading to higher uncertainty and lower *expected* value per dollar, justifying deprioritization. Systemic effects are discounted primarily due to measurement difficulties, not inherent lack of value.
  5.  **Counterfactual Impact Focus:** Moral assessment hinges on the *difference* an action (career choice, grant) makes compared to the next-best alternative. For careers, this focuses on the *additional* resources generated beyond what a baseline alternative career would provide.

  **What it Strictly Presupposes vs. What it Fits With:**

  *   **Strictly Requires:**
      *   **Strong Commensurability:** All relevant goods *must* be expressible on a common scale for CEA to function as the primary decision tool.
      *   **Marginal Dollar Fungibility:** The practice of "earning to give" only makes sense if the dollar earned and donated is assumed to have the same impact potential regardless of source or cause area funded (within the chosen high-impact area).
      *   **Epistemic Commitment to Quantification:** Deprioritizing non-quantifiable interventions necessitates the belief that quantified evidence is *significantly* more reliable for estimating expected value.
  *   **Fits Well With (but not strictly required):**
      *   **Welfarist Consequentialism:** This is the most natural fit, but the structure *could* be adopted by a pluralist consequentialist if they accepted strong commensurability across their plural values (e.g., reducing suffering *and* promoting autonomy, both quantified).
      *   **Utilitarianism:** A specific sub-type of welfarism.
      *   **Expected Utility Maximization:** The core decision procedure.

  **Changes Required Under Alternative Views:**

  If EA institutions adopted the view that:

  1.  **Some Goods are Incommensurable with Lives-Saved-Per-Dollar:**
      *   **Reject Strong Commensurability:** Abandon CEA as the sole or primary arbiter for cause prioritization. Develop alternative frameworks (e.g., lexical priorities, sufficientarianism, multi-criteria decision analysis) to handle trade-offs between fundamentally different goods (e.g., saving identifiable lives now vs. securing long-term democratic stability).
      *   **Re-evaluate "Earning to Give":** Scrutinize whether high-paying jobs in finance/tech generate negative systemic effects (e.g., regulatory capture, inequality, short-termism) that are *incommensurably bad* and cannot be offset by donations funding incommensurably good but different interventions. Careers might be assessed more holistically for their direct systemic effects.
      *   **Fund "Speculative" Work:** Fund interventions promoting incommensurable goods (e.g., rights protection, cultural shifts) even without robust CEA, accepting a different epistemic standard for justifying their value.

  2.  **Durable Institutional/Political Change is Primary:**
      *   **Shift Cause Prioritization:** Make systemic advocacy, movement-building, and institutional reform the central focus, not a deprioritized "speculative" category. Define success in terms of long-term structural shifts (e.g., policy changes, increased civic capacity, shifted norms) rather than short-term quantifiable outputs.
      *   **Redefine Career Impact:** Prioritize careers directly within politics, advocacy, community organizing, media, or academia aimed at systemic change. "Earning to give" might be seen as less impactful or even counterproductive if it diverts talent from direct change-making or fuels harmful industries. Career assessment focuses on direct contribution to systemic levers, not just funds generated.
      *   **Develop New Metrics:** Create frameworks to assess the quality, theory of change, and potential leverage of systemic interventions, even if precise quantification of long-term impact remains elusive (e.g., evaluating coalition strength, policy window opportunities, narrative shift).
      *   **Embrace Different Timescales & Uncertainty:** Accept longer time horizons for impact and higher inherent uncertainty in predicting outcomes of complex system change, rejecting the notion that this automatically implies lower expected value compared to measurable short-term interventions.

  Adopting either view would necessitate a fundamental shift away from marginal dollar fungibility and quantification as the overriding arbiters of value, towards more complex, context-sensitive, and potentially qualitative assessments of both careers and interventions, with a greater emphasis on direct contributions to structural change.
