  So in all three cases, her behavior is that of an evidential decision theorist (EDT).

  However, note that in the XOR blackmail case, the predictor is described as "reliable". We might need to clarify what that means. In the context, it's likely that the predictor is perfect or at least very accurate about the condition (exactly one of the two). But note that the condition involves a prediction about what she will do. So the predictor must be able to predict her action. This is similar to the Newcomb predictor.

  But now we have the counterfactual mugging. Let's recall the setup:

  ### Counterfactual Mugging
