  EDT would evaluate the action of paying by the evidence it provides about the state of the world. But note: the coin flip has already happened and is tails. The heads branch did not occur. Therefore, the action of paying does not causally affect anything in the heads branch (which is counterfactual). Moreover, in the actual world, the coin is tails. What evidence does paying provide?

  In the counterfactual mugging, EDT would reason as follows:

  - If I pay, what evidence does that provide about the coin flip? The coin flip is already tails and known to be tails. So paying does not provide any evidence about the coin flip (because we already know it's tails). Therefore, paying only costs $100 and there is no benefit in the actual world. Thus, EDT would not pay.

