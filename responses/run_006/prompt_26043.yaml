answer: |-
  ## On the Nomenclature of Strategic Alliances with Mutual Disdain

  Your observation is razor-sharp and cuts to the heart of a fascinating, under-theorised dynamic in collective action and political morality. You're right that existing terms like "moral trade," "logrolling," or "coalition-building" fail to capture the specific texture you describe: **the explicit or tacit agreement for mutual strategic support between parties who hold reciprocal private contempt or fundamental intellectual/moral disdain for each other's core cause or values.**

  Let's dissect the conceptual landscape systematically, as requested:

  1.  **Nearby Concepts & Why They Don't Fit:**
      *   **Moral Trade (Parfit, MacAskill et al.):** As you note, this typically involves parties operating *within* or *respecting* each other's differing moral frameworks. They trade commitments because they acknowledge the *genuine moral weight* of the other's concerns, even if prioritised differently. The "quiet contempt" element in your cases fundamentally violates this mutual respect. It's not a trade *of* morality, but a trade *despite* morality.
      *   **Logrolling:** This is a purely transactional exchange of support on *specific, distinct policy issues* (e.g., "I vote for your dam if you vote for my subsidy"). It's usually amoral, focused on concrete gains, and doesn't inherently involve *contempt* for the *underlying cause or intellectual validity* of the other's position. Your cases involve disdain for the *foundations* of the other group's entire project.
      *   **Coalition-Building (General):** This is too broad. Most coalitions involve prioritisation and compromise, but the defining feature here is the *specific nature of the underlying attitude* – active disdain for the *substance* of the ally's cause, not just its relative importance.
      *   **Hypocrisy:** Hypocrisy involves *feigning* belief or virtue one doesn't possess. In your scenario, participants aren't *pretending* to believe in the other's cause; they are simply *omitting* their disdain while fulfilling a transactional agreement. Their *actions* support the cause, but their *private beliefs* remain unchanged and contemptuous. It's strategic omission, not active deception about belief.
      *   **Alliance of Convenience / Marriage of Convenience:** These come close descriptively but lack the specific *moral/intellectual contempt* element. They imply mutual benefit and temporary alignment, but not necessarily mutual disdain. Your phenomenon is a specific, darker subspecies of this.
      *   **Faustian Bargain:** This implies a profound individual *moral compromise* for gain, often with a corrupting power. Your cases are typically inter-group, strategic, and while morally compromising, the "corruption" is often seen as a necessary cost, not an inherent transformative evil. It's also usually not mutual.

  2.  **Defining the Phenomenon & Coining a Term:**
  Based on your description and the distinctions above, the core elements are:
      *   **Mutual Strategic Benefit:** Both parties gain concrete advantage (e.g., numbers, endorsement, political cover, funding security).
      *   **Mutual Private Contempt/Disdain:** Each party holds a fundamental intellectual or moral objection to the *core tenets*, *methods*, or *intrinsic value* of the other party's cause/activity. They see the other as misguided, intellectually bankrupt, or morally flawed *in essence*, not just prioritised incorrectly.
      *   **Selective Non-Disclosure:** The contempt remains private or semi-private (known within the group but not voiced to the ally). The deal proceeds without candid acknowledgment of this underlying disdain. Silence on the contempt is a condition of the bargain.
      *   **Strategic Calculus:** The benefit to their *own* cause is judged to outweigh the cost of advancing a cause they privately deem wrongheaded or worthless.

  **Proposed Term: Cynical Coalition**

  *   **Why "Cynical"?** Cynicism here captures the core attitude: a belief that the alliance is driven purely by self-interested calculation, overriding genuine intellectual or moral commitment to the ally's cause. It implies a world-weary acceptance that principle must be sacrificed for pragmatic gain. It directly addresses the "quiet contempt" – cynicism inherently involves a degree of dismissiveness or disbelief in the other's sincerity or validity.
  *   **Why "Coalition"?** This grounds it in the realm of collective action and political strategy, distinguishing it from purely individual bargains.

  **Definition of a Cynical Coalition:**
  > *A formal or informal agreement for mutual strategic support between distinct groups or actors, characterised by reciprocal private intellectual or moral disdain for the foundational principles or core objectives of the other party, where the anticipated benefit to one's own cause is explicitly calculated to outweigh the perceived cost of advancing an ideologically or morally objectionable agenda.*

  3.  **Boundaries and Distinctions:**
      *   **Contempt:** This is crucial. Mere indifference, lower prioritisation, or respectful disagreement does not constitute a Cynical Coalition. The disdain must be active and fundamental (e.g., "their work is nonsense," "their cause is sentimental drivel," "their methods are counterproductive").
      *   **Privacy of Contempt:** The contempt is typically *private* or *semi-private* (known within the in-group but not expressed to the ally). If the contempt is *publicly known and acknowledged by both parties*, it arguably moves into a different, even more overtly transactional and perhaps nihilistic territory – a "Nakedly Transactional Alliance" or a "Disdain Pact". The *selective non-disclosure* is part of what defines the standard Cynical Coalition; it allows the performance of solidarity.
      *   **Explicitness of Deal:** The deal can be explicit ("We endorse X if you endorse Y") or tacit (an unspoken understanding based on repeated reciprocity). The key is the mutual recognition of the *quid pro quo*.
      *   **Scale:** While your examples focus on groups, it could apply to individuals within institutions (e.g., two rival academics agreeing to cite each other's work despite mutual disdain).
      *   **Distinction from Hypocrisy:** Participants aren't *lying* about their *own* beliefs *to their own constituency* (usually). They are omitting their disdain *from the ally* and fulfilling a purely transactional promise. The hypocrisy, if any, is perceived externally or is a cost borne internally ("We *have* to support these fools to get what we need").
      *   **Distinction from Moral Trade:** Moral Trade involves mutual respect for differing values; Cynical Coalition involves mutual disdain for the other's core values/cause.
      *   **Distinction from Logrolling:** Logrolling is issue-specific and amoral; Cynical Coalition is often cause/mission-oriented and involves active intellectual/moral disdain.

  **In Conclusion:**

  Your phenomenon is distinct enough to warrant its own label. "Moral trade" lacks the disdain, "logrolling" lacks the depth of contempt for the *cause*, "coalition-building" is too vague, and "hypocrisy" mischaracterises the act. **Cynical Coalition** captures the essence: a strategic alliance forged and sustained *despite* reciprocal private contempt for the ally's fundamental purpose, driven by a cold calculation that the ends justify the morally or intellectually distasteful means of mutual support. The selective non-disclosure of the underlying contempt is a defining operational feature, allowing the performance of solidarity necessary for the transaction.

  This concept is rich ground for political theory – exploring the conditions under which such coalitions form, their stability, their ethical permissibility (is it ever justified? under what constraints?), and their long-term effects on the integrity of movements and institutions. It speaks directly to the tensions between purity of principle and the messy realities of political power and collective action. A superb observation worthy of deeper investigation.
