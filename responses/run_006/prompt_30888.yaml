answer: |-
  Below is a reusable, procedure-based checklist grounded in social choice theory (specifically the Gibbard-Satterthwaite theorem) to evaluate voting rules. The checklist identifies whether a proposed rule can be "strategy-proof" (i.e., immune to tactical voting) or if it falls into the "impossible unless dictatorial" category. Escape routes (where the theorem doesn't apply) are explicitly defined.

  ---

  ### **Voting Rule Evaluation Checklist**
  **Input**: A formal description of the voting rule, including:  
  - The ballot format (e.g., rankings, approvals, scores).  
  - How ballots are aggregated into a winner.  
  - The number of voters (assumed ≥2) and alternatives/candidates (≥2).  
  - Any domain restrictions (e.g., single-peaked preferences).  

  #### **Ordered Procedure**:
  1. **Check number of alternatives (mechanical)**:  
     - If **exactly 2 alternatives**, → **Escape Route A**: Gibbard-Satterthwaite (GS) doesn’t apply. Strategy-proofness *may* be possible (e.g., with majority rule).  
     - If **≥3 alternatives**, proceed to Step 2.  

  2. **Check determinism (mechanical)**:  
     - If the rule **uses randomization** (e.g., coin flips, random tiebreaks), → **Escape Route B**: GS doesn’t apply (randomized rules are outside the theorem’s scope).  
     - If **deterministic**, proceed to Step 3.  

  3. **Check domain restrictions (judgment call)**:  
     - If preferences are **restricted** (e.g., single-peaked, dichotomous, or only certain rankings allowed), → **Escape Route C**: GS doesn’t apply (strategy-proofness *may* be possible, e.g., median voting).  
     - If **all strict rankings are allowed** (unrestricted domain), proceed to Step 4.  

  4. **Check surjectivity (judgment call)**:  
     - If **every alternative can win** under some voter profile (e.g., no candidate is always excluded), proceed to Step 5.  
     - If **some alternative can never win**, → **Flag as non-surjective**: GS doesn’t apply, but the rule is degenerate (e.g., a fixed loser).  

  5. **Check non-dictatorship (mechanical)**:  
     - If **no fixed voter** always decides the winner alone (i.e., no dictator), → **Flag "impossible unless dictatorial"**: GS theorem proves no strategy-proof rule exists.  
     - If **dictatorial**, the rule is strategy-proof but violates fairness (committee likely rejects).  

  **Output Summary**:  
  - ✅ **"Escape Route"**: GS doesn’t apply (explain A, B, or C). Rule *may* be strategy-proof (needs further analysis).  
  - ⚠️ **"Impossible unless dictatorial"**: Rule cannot be strategy-proof (for ≥3 alternatives, deterministic, unrestricted, surjective).  
  - ❓ **"Judgment call needed"**: For Steps 3–4 (domain/surjectivity), human verification required.  

  ---

  ### **Checklist Applied to Proposals**
  **Proposal 1: Instant-Runoff Voting (IRV) marketed as strategy-proof**  
  - **Input**: Voters submit rankings; least-popular candidate eliminated iteratively until one has majority.  
  - **Step 1**: ≥3 alternatives (typical case) → proceed.  
  - **Step 2**: Deterministic → proceed.  
  - **Step 3**: **Judgment call**: Allows all strict rankings (unrestricted domain) → proceed.  
  - **Step 4**: **Judgment call**: Every candidate can win (e.g., if all voters rank them first) → proceed.  
  - **Step 5**: Non-dictatorial → **Flag "impossible unless dictatorial"**.  
  **Result**: ⚠️ GS theorem applies—IRV **cannot be strategy-proof**. Claim is false.  
  **Committee Impact**: Unwelcome result (marketing is misleading).  

  ---

  **Proposal 2: "Random voter is dictator" tiebreak**  
  - **Input**: If a tie occurs, a random voter’s top choice wins.  
  - **Step 1**: ≥3 alternatives → proceed.  
  - **Step 2**: **Randomization in tiebreak** → **Escape Route B** (GS doesn’t apply).  
  **Result**: ✅ Randomized rules avoid GS theorem. **May be strategy-proof** (but only in tiebreak edge cases; base rule may still be manipulable).  
  **Committee Impact**: Acceptable escape route (but partial randomness may not satisfy them).  

  ---

  **Proposal 3: Simple majority between two candidates**  
  - **Input**: Voters choose one candidate; majority wins (ties broken by coin flip).  
  - **Step 1**: **Exactly 2 alternatives** → **Escape Route A** (GS doesn’t apply).  
  **Result**: ✅ Strategy-proofness **is achievable** (majority rule is strategy-proof for two alternatives if preferences are strict).  
  **Committee Impact**: Non-controversial (works as advertised).  

  ---

  ### **Key Takeaways for Committee**  
  - **IRV example** exposes a common misconception: No deterministic, non-dictatorial rule with ≥3 alternatives (and no restrictions) can be strategy-proof (GS is an impossibility theorem).  
  - **Escape routes** are narrow:  
    - Two alternatives (rare in complex governance).  
    - Randomization (may not be acceptable for binding votes).  
    - Restricted preferences (hard to enforce in practice).  
  - **Recommendation**: Reject rules claiming "strategy-proof" for ≥3 alternatives unless they leverage an escape route credibly. Use checklist to force explicit justifications.
