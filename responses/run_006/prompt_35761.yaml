  - **Authorial Intent?** Biographical evidence cuts both ways: Dostoevsky hated socialism (supports Camp 3) but also called the Inquisitor "blasphemy" (undercuts Camp 1). His notebooks show deliberate ambiguity—Camp 4 feasts here.  
  - **Philosophical Standards?** Camp 1 demands logical rebuttal; Camp 2 says lived faith > syllogisms. That’s a clash of epistemologies.  
  - **Purpose of the Novel?** Is it a theological treatise (Camps 1/2)? Political warning (Camp 3)? Exploration of doubt (Camp 4)?  

