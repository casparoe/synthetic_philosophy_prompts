  First, the joint statement needs four components: agreed claims, a disagreements table, cruxes, and concrete cases for each crux. The user emphasized avoiding caricatures, so wording must be precise. For example, the Millian shouldn't say identity statements are uninformative, and the Fregean shouldn't portray senses as mysterious inner objects. Also, potential verbal disputes, like the definition of "semantics," need flagging.

  Starting with the agreed claims. Both sides accept the core data: "Hesperus is Hesperus" is trivial while "Hesperus is Phosphorus" is informative. They agree on the necessity and truth conditions of identity, and that substitution in belief contexts fails. Constraints include avoiding circular explanations and respecting compositionality. Non-solutions might involve confusing meaning with reference or attributing differences to mere syntax.

  Next, the disagreements table. The Fregean view centers on names having both sense and reference, with senses explaining informativeness semantically. The Millian sees names as referential only, attributing informativeness to pragmatics or psychology. Key is phrasing so each side accepts their position. For instance, Fregean: sense determines reference and explains cognitive significance. Millian: names contribute only reference, and informativeness comes from non-semantic factors.

  Then, the cruxes. Identifying points where resolving them could shift views. Crux 1: The nature of cognitive significance—semantic or not? Crux 2: Explanatory adequacy—can pragmatic mechanisms replace senses? Crux 3: Belief ascription puzzles—can Millians handle them without senses? Each crux needs a case study, like how "Hesperus is Phosphorus" informs, with both sides' predictions.

  For each crux, concrete cases. Crux 1: Explaining why the identity is informative. Fregean predicts senses are necessary; Millian cites metalinguistic ignorance. Crux 2: Explaining belief reports. The Paderewski case: Fregean sees distinct senses, Millian uses pragmatic enrichment. Crux 3: Semantic innocence. Fregean maintains attitude verbs shift content; Millian argues for unshifted referents with pragmatic adjustments.

  Verbal disputes: The term "semantic" might be contentious. Fregeans include cognitive aspects in semantics, while Millians restrict it to truth-conditional content. Flagging this avoids talking past each other. Also, "content" could mean truth-conditional for Millians but include senses for Fregeans.

  Need to ensure both sides' positions are accurately represented without strawmen. The joint statement should reflect mutual understanding and unresolved issues, guiding workshop discussions. Highlighting predictive differences in the cruxes sets up empirical checks, fostering productive debate.
answer: |-
  Here is a draft joint statement reflecting a good-faith adversarial collaboration between a Fregean and a Millian proponent regarding Frege's puzzle, adhering to your specifications:

  **Joint Statement on Frege's Puzzle: Adversarial Collaboration Findings**

  We, the undersigned proponents of Fregean and Millian approaches to Frege's puzzle, having engaged in sustained, good-faith discussion, agree on the following points of common ground, precise formulations of our core disagreement, the key unresolved questions ("cruxes") whose resolution would significantly impact our views, and specific cases bearing on those cruxes.

  **(1) Agreed Foundations & Constraints:**

  1.  **Data to Explain:** There is a genuine cognitive difference between utterances of "Hesperus is Hesperus" and "Hesperus is Phosphorus" for a rational agent initially unaware of the identity. The latter can be informative and express a discovery, while the former is trivially true and uninformative. This difference persists even when both statements are true and necessary (if true).
  2.  **Logical Behavior of Identity:** The identity relation is genuine (reflexive, symmetric, transitive). "a = b" is true if and only if 'a' and 'b' refer to the same object. If true, "a = b" is necessarily true (assuming rigid designation for names).
  3.  **Substitutivity Failure (Core Phenomenon):** Substitution of co-referential proper names *salva veritate* fails in contexts like belief reports ("Lois believes Superman can fly" vs. "Lois believes Clark Kent can fly"), even when the identity ("Superman is Clark Kent") is known to the reporter. This failure necessitates an explanation beyond coreference.
  4.  **Constraint: Explanation Must Be Non-Circular:** The explanation for the cognitive difference cannot simply restate the difference (e.g., "They have different cognitive significance because they present the object differently" without specifying *what* constitutes the difference).
  5.  **Constraint: Compositionality:** Any theory of meaning for names must integrate with a plausible compositional semantics for complex expressions (e.g., sentences, belief reports).
  6.  **Constraint: Respecting Necessity:** The explanation must account for why the discovery that Hesperus is Phosphorus is a discovery of a *necessary* truth.
  7.  **Non-Solution: Mere Syntax/Phonetics:** The cognitive difference cannot be explained solely by the difference in the physical marks or sounds of the names 'Hesperus' and 'Phosphorus'. Two names with different sounds but known to be coreferential (e.g., "Mark Twain" vs. "Samuel Clemens" for someone who knows the identity) do not yield the same informativeness puzzle.
  8.  **Non-Solution: Confusing Meaning with Reference:** Both sides reject the view that the meaning (semantic value) of a name *just is* its bearer *if* this entails there is no semantic difference whatsoever between distinct co-referential names. While the Millian identifies meaning with reference, they acknowledge the need for an *additional* explanation for the cognitive phenomena.

  **(2) Precise Disagreements Table:**

  | Feature                      | Fregean Position (As Stated by Proponent)                                                                                                | Millian Position (As Stated by Proponent)                                                                                                                                 |
  | :--------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Semantic Value of a Name** | The semantic content (sense, *Sinn*) of a proper name is distinct from its referent (*Bedeutung*) and determines its referent.            | The semantic content of a proper name is exhausted by its referent. There is no additional component of semantic content (like a *Sinn*) distinct from the referent.       |
  | **Explanation for Informativeness** | The difference in informativeness between "Hesperus is Hesperus" and "Hesperus is Phosphorus" is explained *semantically* by the distinct senses associated with the names flanking the identity sign. | The difference in informativeness is explained by *non-semantic* factors: typically, differences in the cognitive associations, metalinguistic knowledge, or psychological modes of presentation associated with the names by the agent. |
  | **Explanation for Substitutivity Failure** | The truth conditions of belief reports depend on the sense expressed by the embedded clause, not just the referents. Substitution fails when senses differ. | The truth conditions of belief reports depend on the referent of the names and the relation of belief to a singular proposition. Substitutivity failure arises pragmatically (e.g., due to differences in *how* the believer conceives of the referent, captured by pragmatic enrichment or constraints on reporting). |
  | **Scope of Semantics**       | Semantics properly includes aspects essential to explaining cognitive significance and the compositional behavior of expressions in attitude contexts. | Semantics is primarily concerned with truth-conditional content and reference. Explaining cognitive significance belongs to pragmatics, psychology, or the theory of propositional attitudes. |

  **(3) Cruxes & (4) Concrete Cases with Predictions/Diagnoses:**

  *   **Crux 1: The Nature of Cognitive Significance:** Is the cognitive significance of an identity statement like "Hesperus is Phosphorus" (its capacity to be informative) best explained by an aspect of the *semantic content* of the names themselves, or is it fundamentally a matter of extra-semantic psychological or metalinguistic facts?
      *   **Case Study:** Explain why "Hesperus is Phosphorus" is informative to an ancient astronomer who previously used 'Hesperus' only in evening contexts and 'Phosphorus' only in morning contexts, unaware of the identity.
          *   **Fregean Prediction/Diagnosis:** Informativeness *requires* distinct senses associated with 'Hesperus' and 'Phosphorus' as part of their semantic contribution. The astronomer learns that two distinct senses (evening star presentation, morning star presentation) determine the same referent. This difference in sense *is* the semantic ground of the cognitive difference.
          *   **Millian Prediction/Diagnosis:** Informativeness is explained by the astronomer's prior *ignorance* that the two names corefer and the distinct descriptive information (contingently) associated with each name in their psychology/metalinguistic knowledge. The semantic content (the referent) is the same; the difference lies in the astronomer's cognitive relation to that single semantic content under two guises. Resolving the crux requires showing whether the distinct associated information plays a genuinely *semantic* role (determining reference) or is merely psychological.

  *   **Crux 2: Explanatory Adequacy of Pragmatics/Psychology:** Can pragmatic mechanisms (e.g., implicatures, presuppositions, speaker meaning) or psychological theories of guise or file management fully and adequately explain the substitutivity failures in belief reports and the cognitive differences in identity statements *without* needing to posit distinct semantic senses?
      *   **Case Study:** Explain the truth-value difference between "Pierre believes London is pretty" (said after he sees beautiful parts) and "Pierre believes Londres is not pretty" (said after he sees ugly parts), where Pierre doesn't realize 'London' and 'Londres' corefer (Kripke's Paderewski/Pierre case).
          *   **Millian Prediction/Diagnosis:** Pragmatics (e.g., constraints on faithful reporting, requiring matching the believer's way of thinking) or psychology (e.g., Pierre has two distinct mental files for London) explains why both reports can be true simultaneously. The semantic content of both embedded sentences is the same singular proposition <London, being pretty> (or its negation). The difference is non-semantic.
          *   **Fregean Prediction/Diagnosis:** The Millian pragmatic/psychological explanations are either insufficiently general, ad hoc, or ultimately collapse into positing something functionally equivalent to senses. The systematic nature of the failure requires distinct senses as the semantic contents of 'London' and 'Londres' in Pierre's idiolect, making the embedded sentences express different propositions. Resolving the crux requires assessing whether pragmatic/psychological theories can avoid circularity, achieve full generality, and integrate compositionally without smuggling in senses.

  *   **Crux 3: Semantic Innocence & Attitude Contexts:** When a name appears in the embedded clause of a belief report, does it contribute its ordinary *semantic content* (whatever that is) directly to the proposition expressed by the embedded clause, or is its contribution shifted?
      *   **Case Study:** Analyze the semantic contribution of 'Hesperus' in "Lois believes that Hesperus is visible."
          *   **Fregean Diagnosis:** Attitude verbs shift the context. In "Lois believes that...", 'Hesperus' contributes its sense (*Sinn*), not its referent, to the proposition that is the object of Lois's belief. This maintains "semantic innocence" (words mean what they always mean - their sense) and directly explains substitutivity failure. (*Note: Potential verbal element - "semantic innocence" understood as contributing the same semantic value in all contexts.*)
          *   **Millian Diagnosis:** The name contributes its referent, the planet Venus, to the singular proposition expressed by the embedded clause. Semantic innocence is maintained because the name contributes the same semantic content (the referent) in all contexts. Substitutivity failure is a *pragmatic* phenomenon concerning how that singular proposition is related to the believer's mind/other representations. (*Note: Potential verbal element - "semantic innocence" understood as contributing the same *referential* semantic value in all contexts.*) Resolving the crux requires determining whether the phenomenon of substitutivity failure necessitates a shift in semantic value within attitude contexts or if it can be handled while maintaining a constant (referential) semantic value.

  **(Potential Verbal Disputes Flagged):**

  1.  **"Semantic":** A core disagreement may be partly terminological regarding the scope of "semantics." The Fregean includes cognitive significance and attitude-context behavior as core explananda for semantics, requiring senses. The Millian restricts "semantics" to truth-conditional content and reference, relegating cognitive phenomena to other domains. Progress requires clarifying whether the dispute is about the *nature* of the explanatory entities (senses vs. psychological modes/pragmatic rules) or primarily about which domain (semantics vs. pragmatics/psychology) is responsible for which phenomena.
  2.  **"Content":** Relatedly, "content" often means *truth-conditional* content for Millians (the singular proposition), while for Fregeans, it often means *what is believed* (a proposition composed of senses). Care is needed to specify the sense of "content" in discussions (e.g., semantic content vs. object of thought).
  3.  **"Modes of Presentation":** Both sides agree agents associate information/conceptions with names. The dispute is whether these function as senses (semantic, reference-determining) or are psychological/pragmatic accompaniments to grasping a singular proposition.

  This document represents our current understanding of the points of agreement, the precise nature of our disagreement, and the key unresolved questions that merit further investigation. We commit to continuing this collaborative exploration.

  ---

  **Signatures:**

  [Signature - Proponent of Fregean Solution]
  [Signature - Proponent of Millian Solution]

  ---
  **Key Design Choices Explained:**

  *   **Agreed Claims:** Focuses on the undeniable data (informativeness difference, necessity, substitutivity failure), logical constraints, and methodological guardrails (non-circularity, compositionality). Explicitly rules out simplistic non-solutions.
  *   **Disagreements Table:** Phrases each position in terms the respective proponent would accept, avoiding caricatures. Focuses on the core semantic commitment (sense vs. reference), the locus of explanation for the key phenomena (semantics vs. non-semantics), and the resulting view of attitude contexts.
  *   **Cruxes & Cases:** Identifies the deepest fault lines where evidence or argument could shift views. The cases are classic and agreed upon as relevant. Each side's prediction/diagnosis shows how they would interpret the case *within their framework*, highlighting the contrasting explanatory strategies. The resolutions hinge on theoretical virtues (generality, non-circularity, integration) and empirical adequacy.
  *   **Verbal Disputes:** Explicitly flagged where terminology ("semantic", "content", even "mode of presentation") might mask substantive agreement about the existence of associated information/conceptions while disagreeing about its theoretical role (semantic vs. non-semantic). This helps prevent talking past each other.
  *   **Tone:** Strives for neutrality and precision, reflecting the "adversarial collaboration" goal of clarifying disagreement and identifying testable differences.
