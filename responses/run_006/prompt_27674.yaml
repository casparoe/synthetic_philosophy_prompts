  ...Did I make the accident too visceral? The child running into the street needs to feel unavoidable. Maybe add that he saw her too late? And the current rain parallels that helplessness. Good. 

  Final thought: The story's power comes from making readers feel "There but for fortune..." That's the emotional core Strawson wants us to confront.
