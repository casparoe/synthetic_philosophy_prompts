  I should probably create an ordinary character facing extraordinary consequences - maybe someone whose life gets destroyed by a past mistake. That way we can show how their "choices" were really shaped by factors beyond their control. The key is making the reader feel the unfairness of blaming someone who never chose to be who they are.

  Ah, and the user wants a note afterward about where the story takes liberties with Strawson. Important reminder: Strawson focuses on the impossibility of self-creation, while the story will inevitably simplify by focusing on visible causes like trauma. Should flag that divergence.

