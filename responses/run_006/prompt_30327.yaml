  Fourth: Honesty mechanisms—directly challenges Zahavi’s core premise. CRISPR-edited traits in model orgs could deliver quick answers. 
  Fifth: Human-specific pressures—high risk/reward. Requires interdisciplinary teams but could revolutionize social evolution studies. 

  *Potential landmines:* 
  - Avoid questions requiring long-term fieldwork (can’t deliver in 3 yrs) 
