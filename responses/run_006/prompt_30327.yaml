answer: |-
  Here are five open questions ranked by priority, formatted as requested:

  1. **Under what conditions do honest signaling equilibria mathematically emerge from evolutionary dynamics without requiring ad hoc assumptions?**  
     *Upstream:* Resolves core theoretical disputes about the handicap principle's validity. *Tractability:* High with evolutionary game theory and individual-based models. *Evidence:* Analytical proofs or robust simulations showing stable equilibria under specific selective regimes would raise priority; persistent failure despite parameter exploration would lower it.

  2. **How can we rigorously quantify the informational benefit of costly signals to receivers across diverse biological systems?**  
     *Upstream:* Essential for testing signal "efficacy" and evaluating trade-offs with cost. *Tractability:* Moderate; requires integrating behavioral experiments, bio-logging, and machine learning to track receiver decision outcomes. *Evidence:* Development of generalizable metrics demonstrating fitness gains from signal use (e.g., via improved resource allocation) would raise priority; consistent null results across contexts would lower it.

  3. **Are signal costs inherently relative to signaler quality (as proposed) or can absolute costs maintain honesty under specific constraints?**  
     *Upstream:* Clarifies fundamental cost structure, impacting empirical cost measurement. *Tractability:* High via controlled lab evolution (e.g., microbes with engineered signaling traits) or comparative studies. *Evidence:* Experimental evolution demonstrating honesty sustained by absolute costs in defined environments would raise priority; universal dependence on relative costs would lower it.

  4. **What non-handicap mechanisms (e.g., index constraints, punishment, common interest) dominate signal honesty maintenance in high-stakes contexts (e.g., mate choice, aggression)?**  
     *Upstream:* Tests the handicap principle's necessity versus alternatives. *Tractability:* Moderate; combines phylogenetics, manipulative field experiments (e.g., signal/cost alteration), and game theory. *Evidence:* Empirical identification of systems where honesty persists without differential costs would raise priority for alternatives; consistent correlation between residual cost and deception would elevate handicap primacy.

  5. **How do cultural transmission and institutional enforcement reshape the cost structure and evolutionary stability of signals in humans?**  
     *Upstream:* Integrates evolutionary theory with human uniqueness. *Tractability:* Lower; requires interdisciplinary methods (experimental economics, ethnography, modeling). *Evidence:* Cross-cultural experiments showing rapid cultural evolution decoupling signal cost from quality would raise priority; consistent evidence of fitness-linked biological costs underpinning prestige would lower it.
