  1) Address foundational cracks in the theory (e.g., Zahavi's original verbal models vs. modern game theory) 
  2) Leverage new computational/experimental tools 
  3) Have clear "success/fail" metrics within 3 years 

  *Brainstorming angles:* 
  - The user might secretly worry about funding "treadmill" projects that just churn out incremental papers. They need questions where answers could shift paradigms. 
  - They’re likely pressured to show impact quickly—hence the demand for evidence that would change priority mid-grant. 
  - The prestige economy comment suggests interest in human applications, but the foundation’s scope is evolutionary theory broadly. Should lean multi-species. 

