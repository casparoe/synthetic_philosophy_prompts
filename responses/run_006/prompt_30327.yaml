prompt: |-
  I recently moved from the lab to a program-officer role at a foundation that funds evolutionary theory, and I need to recommend which open questions in costly signaling and the handicap principle to support. The topic became vivid to me watching my former field's prestige economy—it is hard not to see handicaps everywhere—but I need to move from impression to a defensible funding strategy. I can support one small group for three years. Give me exactly five open questions, ranked by priority, each in a sentence or two, with no introduction or conclusion. For each, explain why it is upstream of other questions, how tractable it is with current tools, and what evidence over the grant period would raise or lower its priority.
reasoning: |-
