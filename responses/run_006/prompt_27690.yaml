answer: |-
  ### Adversarial Collaboration Agreement: Common Priors vs. Permissivism in Formal Epistemology  
  **Workshop on Formal Epistemology and the Foundations of Game Theory**  
  *Signed by:*  
  [Participant 1, Common-Prior Camp]  
  [Participant 2, Permissivist Camp]  
  *Date:* [Date]  

  This document outlines areas of agreement, residual disagreement, and key cruxes between two positions on rational priors:  
  - **Common-Prior (CP) Camp**: Defends the Harsanyi doctrine as a requirement of ideal rationality. Differences in probability assignments between rational agents must arise solely from differences in information; identical information implies identical priors.  
  - **Permissivist (P) Camp**: Holds that probabilistic coherence alone defines rational priors. Rational agents may permissibly hold different priors given identical information, and persistent disagreement is not inherently irrational.  

  Both parties agree to this framework for collaborative debate and undertake to revise their positions if empirical or formal evidence resolves a crux.  

  ---

  ### 1. Agreed Claims  
  The following claims are accepted by both camps:  

  1.1. **Aumann’s agreement theorem (1976) establishes a conditional result**:  
     - If two rational agents share a common prior and their posterior probabilities for an event are common knowledge, then these posteriors must be equal.  
     - The theorem does *not* demonstrate that disagreement is inherently irrational. It shows that *under specific conditions* (common prior + common knowledge of posteriors), disagreement cannot persist.  

  1.2. **The theorem’s assumptions are highly demanding**:  
     - Common knowledge of posteriors requires infinite recursion of knowledge (e.g., Agent A knows B’s posterior, B knows that A knows, ad infinitum), which is rarely attainable in practice. This limits the theorem’s applicability to real-world disagreements.  

  1.3. **Dutch book arguments support coherence, but not uniqueness**:  
     - An agent with incoherent (non-probabilistic) credences is vulnerable to a Dutch book (a sure-loss bet). Both camps accept this as a minimal rationality constraint.  
     - Dutch books do *not* show that only one prior is rational for a given body of information. Coherence is necessary but not sufficient for prior uniqueness.  

  1.4. **Accuracy arguments (e.g., proper scoring rules) support coherence, but not uniqueness**:  
     - Dominance-based arguments (e.g., avoiding *accuracy domination*) rule out incoherent credences.  
     - These arguments do *not* entail that a unique prior is maximally accurate across all possible worlds; multiple coherent priors may satisfy accuracy norms.  

  1.5. **Common priors are not empirically universal**:  
     - Empirical evidence (e.g., from behavioural game theory) shows that individuals with similar information often hold divergent priors in practice. Both camps agree this does not *directly* resolve the normative question.  

  1.6. **Rationality permits information-sensitive updating**:  
     - Both accept Bayesian conditionalisation as the standard for rational updating when new information is acquired.  

  ---

  ### 2. Residual Disagreement  
  The table below summarises core disagreements. Wording reflects each camp’s preferred formulation of their position.  

  | Issue | Common-Prior Camp Formulation | Permissivist Camp Formulation |  
  |-------|--------------------------------|-------------------------------|  
  | **Uniqueness of rational priors** | "Given the same information, two ideally rational agents must assign the same prior probabilities; divergence implies irrationality or informational asymmetry." | "Given the same information, multiple probabilistically coherent priors are rationally permissible; divergence is compatible with ideal rationality." |  
  | **Normative basis for common priors** | "The common prior assumption (CPA) is a constitutive requirement of ideal rationality, as differences in priors can only arise from differences in information." | "The CPA is an optional modelling tool for strategic contexts (e.g., in game theory), not a normative obligation for individual rationality." |  
  | **Interpretation of persistent disagreement** | "Persistent disagreement between agents with common knowledge of shared information and rationality indicates a failure of rationality (e.g., violations of coherence or updating)." | "Persistent disagreement between coherent, updating agents with shared information is epistemically possible and does not entail irrationality." |  
  | **Scope of rationality constraints** | "Rationality requires agents to adopt priors that are uniquely determined by logical constraints (e.g., symmetry principles) plus information." | "Rationality imposes no constraints on priors beyond coherence; principles like symmetry are heuristic, not obligatory." |  

  ---

  ### 3. Cruxes  
  Cruxes are unresolved sub-questions where a settled answer would compel at least one camp to revise its position. For each crux, we specify:  
  - **The question** and why it is pivotal.  
  - **Formal result/theorem or concrete case** bearing on it (agreed by both camps).  
  - **Predictions** from each camp.  

  #### Crux 1: Do coherence arguments extend to prior uniqueness?  
  - **Why pivotal**: CP links coherence to uniqueness; P denies this. A proof that coherence necessitates a unique prior would refute permissivism.  
  - **Formal bearing**: *Cox-Jaynes theorem* (deriving probability from coherence axioms). Both camps agree that if the theorem *uniquely* specified priors (e.g., via information-theoretic principles like maximum entropy), it would support CP. Current proofs do not achieve this.  
  - **CP Prediction**: Future extensions of coherence arguments (e.g., to include objective symmetry) will show uniqueness is required.  
  - **P Prediction**: Coherence axioms will remain too weak to mandate a unique prior; permissiveness is ineliminable.  

  #### Crux 2: What is the normative status of imprecise credences?  
  - **Why pivotal**: If imprecise credences (e.g., sets of priors) are rationally permissible, this undermines CP’s demand for unique point priors.  
  - **Formal bearing**: *Elga’s (2010) ‘dilation’ problem* (imprecise credences expand under updating). Both camps agree that if dilation is shown to be rationally *mandatory* (not just permissible) in cases of unspecific evidence, it would challenge CP. Current results (e.g., Mayo-Wilson & Wheeler, 2016) show dilation occurs but do not resolve normativity.  
  - **CP Prediction**: Rational agents must avoid imprecise credences; dilation reveals a pathology of imprecision.  
  - **P Prediction**: Imprecise credences are rationally permissible (even ideal) when evidence is ambiguous; dilation is not a decisive flaw.  

  #### Crux 3: Does Aumann’s theorem imply the irrationality of disagreement?  
  - **Why pivotal**: CP interprets the theorem as exposing hidden irrationality in real disagreements; P views it as an artificial limiting case.  
  - **Formal bearing**: *Experimental tests of common knowledge* (e.g., Hedden & Zhang, 2017). Both camps agree that if real agents achieve near-common knowledge *and* still disagree persistently (with shared information), this would challenge CP. Current experiments (e.g., in common-prior games) show disagreement correlates with violated assumptions, but not conclusively.  
  - **CP Prediction**: Under experimentally induced common knowledge, disagreements will vanish (up to bounded rationality).  
  - **P Prediction**: Disagreements will persist even under strong common knowledge conditions, due to permissible prior differences.  

  #### Crux 4: Is the dispute partly verbal?  
  - **Why pivotal**: If "rationality" is equivocal, the debate may reduce to terminology.  
  - **Analysis**: Both camps agree the dispute is *substantive*, not verbal. CP defines rationality as *uniqueness-given-information*; P defines it as *coherence-plus-updating*. This reflects a genuine normative divide about whether rationality constrains doxastic starting points.  
  - **Shared view**: Resolving verbal ambiguity (e.g., via Carnap-style explication of "rationality") would clarify but not dissolve the core disagreement.  

  ---

  ### Commitment  
  Both signatories commit to:  
  1. Using this document as the basis for workshop discussion.  
  2. Revising their position if a crux is resolved by new evidence.  
  3. Acknowledging that the collaboration may reveal shared errors or underspecified assumptions.  

  *Signatures:*  
  _________________________________________  
  [Participant 1, Common-Prior Camp]  
  _________________________________________  
  [Participant 2, Permissivist Camp]  

  ---  
