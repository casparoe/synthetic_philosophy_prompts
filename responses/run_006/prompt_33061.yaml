  The core tension they're highlighting is fascinating: institutions simultaneously treat test scores as objective measures while acknowledging numerous factors that undermine that objectivity. I need to deconstruct the implied theory of intelligence behind these practices. The user wants me to examine whether gatekeeping practices strictly require a g-factor view of intelligence or could coexist with weaker interpretations.

  Breaking this down: First, the gatekeeping practices clearly presuppose intelligence as a singular, stable trait. The use of composite scores assumes different cognitive abilities can be meaningfully averaged into one number. The hard cutoff treats intelligence as categorical rather than continuous. Age-norming implies intelligence is developmentally fixed relative to peers. Discounting real-world functioning suggests they prioritize abstract capacity over practical application.

  But interestingly, the institutions' own contradictory practices undermine this view. Recognizing subtest variability admits intelligence isn't unitary. Admitting coaching effects challenges stability. Periodic re-norming shows scores are social constructs. This creates internal incoherence - they act on a strong g-theory while paying lip service to its limitations.

  If we replaced this with alternative theories: A multiple intelligences approach would require abandoning composite scores for multidimensional profiles. A dynamic expertise view would emphasize growth over snapshots and value contextual performance. A contextual view would make domain-specific assessments essential.

  The most damning point is how these practices ignore their own contradictions. They acknowledge intelligence manifests differently across contexts, yet use decontextualized measures. They know scores are malleable, yet treat them as fixed. This isn't just theoretically inconsistent - it has real ethical consequences for educational equity, military placement, and disability determinations.

  The user seems particularly concerned about how these practices flatten human diversity into single numbers. There's an implied ethical critique here about fairness and reductionism. I should emphasize that the problem isn't just theoretical incoherence, but how it perpetuates systemic inequities by treating contingent scores as natural facts.
answer: |-
  The gatekeeping practice described presupposes a **strong, unitary theory of intelligence**—specifically, a **psychometric g-factor view**—where intelligence is treated as:
  - **Single/general** (a core capacity reducible to one number)
  - **Stable** (fixed across time/situations)
  - **Innate & context-independent** (biologically rooted, unaffected by environment or domain)
  - **Directly measurable** by abstract, decontextualized tests

  ### Features that enforce this presupposition:
  1. **Averaging heterogeneous subtests**: Assumes disparate cognitive skills (verbal, spatial, memory) are manifestations of one underlying "g," making their differences irrelevant to the core judgment.  
  2. **Hard composite cutoffs**: Treats intelligence as a scalar quantity where marginal differences (e.g., 1 IQ point) have categorical consequences (gifted/not, disabled/not).  
  3. **Discounting everyday functioning**: Prioritizes test performance over real-world evidence, implying intelligence is a *latent trait* separable from practical application.  
  4. **Age-norming**: Presumes intelligence is fixed relative to age peers, ignoring developmental trajectories or lifelong plasticity.  

  ### Features that are incidental/contingent but reinforce the model:
  - **Periodic re-norming**: Reflects psychometric pragmatism (maintaining score distribution) but inadvertently reveals scores as sociocultural constructs, not natural kinds.  
  - **Coaching sensitivity**: Acknowledges test-taking as a skill but treats it as "noise" rather than evidence against stability.  

  ### Internal Incoherence:
  The practice is **logically inconsistent** with institutions' own rival assumptions:  
  - **Subtest variability ≠ unitary trait**: If verbal/spatial skills are distinct (as acknowledged), averaging them into one score obscures meaningful individual differences.  
  - **Score malleability ≠ stability**: Admitting that sleep/anxiety/coaching alter scores contradicts the claim that tests measure an immutable capacity.  
  - **Re-norming ≠ context-independence**: Updating norms based on cohort/year exposes intelligence as relative to time/place, not absolute.  
  - **Ignoring real-world functioning ≠ validity**: If intelligence predicts life outcomes, dismissing direct evidence of functioning undermines the test’s predictive claims.  

  ### Alternative Theories & Required Changes:
  If institutions adopted alternative views, practices would need radical overhaul:

  1. **Multiple Intelligences (Gardner)**  
     - **Change**: Replace composite scores with **domain-specific profiles**.  
     - **Gatekeeping**: Gifted programs would select based on strength in *specific* intelligences (e.g., linguistic, logical-spatial). Military roles would match profiles (e.g., interpersonal intelligence for leadership).  
     - **Discard**: Cutoffs, averaging subtests, treating spatial/verbal strengths as equivalent.

  2. **Dynamic/Developmental Expertise (Scribner, Vygotsky)**  
     - **Change**: Assess **learning trajectories and contextual adaptation** instead of fixed traits.  
     - **Gatekeeping**: Track growth via portfolios/work samples. Disability judgments would prioritize adaptive functioning in *specific environments*.  
     - **Discard**: Timed tests, age-norming (focus on potential, not peers), snapshot scores.

  3. **Contextual/Embedded Intelligence (Lave, Sternberg)**  
     - **Change**: Evaluate **performance in authentic settings** (e.g., work simulations, community problem-solving).  
     - **Gatekeeping**: Military assignments based on domain-specific simulations (e.g., mechanical troubleshooting). Disability assessments weighted toward daily life evidence.  
     - **Discard**: Decontextualized subtests, discounting real-world functioning, general IQ scores.

  ### Conclusion:
  The current practice is **not coherent** with institutions’ own admissions about intelligence’s variability and malleability. It clings to a reified "g" model for bureaucratic efficiency, despite empirical and theoretical counterevidence. To align with alternative theories, gatekeeping would need to:  
  - **Embrace multidimensionality** (profiles over scores)  
  - **Prioritize dynamic assessment** (growth over snapshots)  
  - **Integrate contextual evidence** (everyday functioning over abstract tasks)  
  - **Abolish hard cutoffs** (spectrums over categories)  

  The persistence of this incoherent system reflects institutional inertia and the convenience of reducing human potential to a single number—not a defensible scientific stance.
