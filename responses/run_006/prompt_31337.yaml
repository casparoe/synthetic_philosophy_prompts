answer: |-
  ### The Moral Luck Sorting Quiz  
  *Answer based on your gut reaction to each scenario—not what you think you "should" say.*

  ---

  1. **Drunk Driver A** drives home recklessly after 6 beers, swerves, and hits a child on a bike, killing them.  
     **Drunk Driver B** drives home recklessly after 6 beers but encounters no one on the road and arrives safely.  
     *Should Driver A deserve more blame than Driver B?*  
     (A) Yes, significantly more  
     (B) Slightly more  
     (C) No, they deserve equal blame  

  2. **Person X** tries to shoot their enemy in the heart but misses due to a sudden gust of wind.  
     **Person Y** tries to shoot their enemy in the heart and succeeds.  
     *Is Person Y more blameworthy than Person X?*  
     (A) Yes, succeeding makes it worse  
     (B) Only if they feel differently afterward  
     (C) No, the intention was identical  

  3. **Anna**, born with a severe genetic predisposition to rage, loses their temper and shoves a coworker against a wall (causing no injury).  
     **Ben**, born exceptionally calm, has never lashed out physically despite similar provocations.  
     *Does Anna deserve less blame due to their biology?*  
     (A) Yes, they had less control  
     (B) Only regarding punishment, not moral blame  
     (C) No, they still chose to shove  

  4. **Surgeon 1** makes a tiny, identical stitching error during heart surgery. Patient A dies as a direct result.  
     **Surgeon 2** makes the same tiny stitching error. Patient B survives due to an unusual blood vessel variation.  
     *Should Surgeon 1 face more professional or moral blame than Surgeon 2?*  
     (A) Much more—the outcome matters  
     (B) Slightly more, due to regret  
     (C) No, the error was identical  

  5. **Klara (1942 Germany)** hides Jewish refugees in her attic at great personal risk.  
     **Marie (2024 Suburbia)** lives peacefully but donates to charities.  
     *Is Klara more morally praiseworthy than Marie?*  
     (A) Yes, her actions were heroic  
     (B) Only if Marie *would* have acted like Klara in her shoes  
     (C) No, we can’t judge based on circumstance  

  6. **Drunk Driver B** (from Q1, who got home safely) learns about Driver A’s accident.  
     *Should Driver B feel a unique kind of regret ("There but for the grace of god go I") beyond guilt over their recklessness?*  
     (A) Yes, that’s natural and right  
     (B) Only guilt over their choice, not luck-based regret  
     (C) They shouldn’t feel much at all  

  7. **Person Y** (successful shooter from Q2) is caught and punished.  
     **Person X** (failed shooter) is never caught.  
     *Beyond legal consequences, does Person X deserve lingering moral blame even decades later?*  
     (A) Yes, just as much as Person Y  
     (B) Less, because no harm resulted  
     (C) Blame fades without consequences  

  8. **A CEO** approves a risky chemical process to boost profits, knowing it *might* poison groundwater.  
     **Scenario A:** The process leaks, poisoning a town’s water.  
     **Scenario B:** No leak occurs.  
     *Is the CEO more blameworthy in Scenario A?*  
     (A) Yes, consequences define the wrong  
     (B) Only slightly—intent was the same  
     (C) No, the decision was equally bad either way  

  ---

  ### Scoring Key  
  Tally your answers. Each letter corresponds to a position on moral luck:  

  | Answer | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Q8 |
  |--------|----|----|----|----|----|----|----|----|
  | **A** | b | b | d | b | a | c | b | b |
  | **B** | c | c | b | c | d | b | c | c |
  | **C** | a | a | c | a | c | a | a | a |

  **Position Results:**  
  - **Mostly A's:** **(b) Outcome-Based Blame**  
    You believe results matter. Identical intentions/actions deserve more blame/praise if they cause significant harm/benefit. Luck shapes moral stakes.  
  - **Mostly B's:** **(c) Agent-Regret or (d) Circumstantial Mitigation**  
    *Conflict Note:* B's often blend (c) and (d). If you emphasized *regret* (Q6, Q7) or *innate/circumstantial factors* (Q3, Q5), lean (c) or (d) respectively.  
  - **Mostly C's:** **(a) Control Purist**  
    Only choices within one’s control matter. Identical intentions/actions = identical blame/praise, regardless of luck or outcome.  
  - **Strong Mix of A/C:** **(e) Skeptic**  
    If you alternate between caring intensely (A) and not at all (C) about outcomes/luck, you likely see the whole system as unstable. Praise/blame feel arbitrary once luck’s role is clear.  
  - **Incoherent/Empty:** Mixes like A’s on harm (Q1, Q8) but C’s on praise (Q5) suggest unresolved tension. No major position fits.  

  **Indistinguishable Positions:**  
  - **(c) Agent-Regret** and **(d) Circumstantial Mitigation** often overlap in answers. Key differentiator is Q3 (biology) and Q5 (era). If biology/era swayed you, it's likely (d); if "special regret" (Q6) resonated, it's (c).  

  **Summary:** This quiz sorts you into positions on whether luck affects blame/praise, mitigates responsibility, or undermines moral judgment itself.  

  ---  
  *How’d it go? Share your result with the newsletter!* 😉
