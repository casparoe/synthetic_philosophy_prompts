  You are an expert in social epistemology and a longtime participant in rationalist and EA online communities. Please think through your answer carefully before writing.

  C. Thi Nguyen's distinction between epistemic bubbles and echo chambers has been widely discussed in rationalist circles: epistemic bubbles are structures that omit relevant information, while echo chambers actively manufacture distrust of outside sources. A natural puzzle arises: if echo chambers systematically undermine trust in all external information, how does anyone ever manage to leave one? Explain the mechanisms by which echo chambers can actually be escaped or dismantled. In doing so, evaluate whether the standard remedies for epistemic bubbles — diversifying one's information diet, deliberately seeking out contrary views — are merely insufficient when applied to echo chambers, or whether they are actively counterproductive and can reinforce the chamber. Ground your analysis in the structural features that make echo chambers distinct from mere epistemic bubbles.
