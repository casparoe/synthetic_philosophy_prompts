  ### (a) Two Distinct General Rules

  Based on the philosopher's verdicts, two distinct general rules about metaphysical necessity that are consistent with her judgments are:

  1. **Rule of Rigidity (RR)**: An identity statement is metaphysically necessary if and only if both referring expressions are rigid designators (i.e., they refer to the same object in all possible worlds). Otherwise, it is contingent. This rule emphasizes the semantic nature of the terms used.

  2. **Rule of Essential Properties (REP)**: An identity statement is metaphysically necessary if and only if the identity holds in virtue of essential properties of the objects involved (e.g., natural kinds, intrinsic properties). If the identity relies on contingent, accidental, or extrinsic properties (e.g., historical roles, achievements), it is contingent. This rule focuses on the metaphysical basis of the identity.

  Both rules are consistent with the seven verdicts:
  - RR: Verdicts 1, 2, 3, and 6 involve rigid designators (proper names "Hesperus/Phosphorus," natural kind terms "water/H2O," "Cicero/Tully," and "gold/atomic number 79") and are necessary. Verdicts 4, 5, and 7 involve non-rigid designators (definite descriptions like "the inventor of bifocals," "the first Postmaster General," "the standard meter bar," and "the inventor of the lightning rod") and are contingent, even when one part is rigid (e.g., "Benjamin Franklin" in verdict 7 is rigid, but "the inventor of the lightning rod" is not).
  - REP: Verdicts 1, 2, 3, and 6 involve essential properties (e.g., astronomical identity, chemical composition, personal identity, atomic number) and are necessary. Verdicts 4, 5, and 7 rely on contingent properties (e.g., historical roles like inventing bifocals or being Postmaster General, the length of a specific bar, inventing the lightning rod) and are contingent.

  ### (b) Verdicts on the New Case

  - **New case**: "The actual inventor of the lightning rod is Benjamin Franklin."

  1. **Rule of Rigidity (RR) verdict: Necessary**  
     Explanation: Here, "Benjamin Franklin" is a rigid designator (refers to the same person in all worlds). "The actual inventor of the lightning rod" is also rigid: "actual" rigidifies the description, so it refers to the inventor in the actual world (Franklin) in all possible worlds, regardless of who invents it in other worlds. Since both are rigid and co-referential, the identity is necessary.

  2. **Rule of Essential Properties (REP) verdict: Contingent**  
     Explanation: The identity relies on the contingent property of inventing the lightning rod. Franklin's inventing the lightning rod is accidental (he might not have done so), not an essential property like his personal identity or a natural kind. The addition of "actual" does not change the metaphysical basis; it still depends on a contingent fact about the actual world. Thus, it remains contingent, consistent with verdict 7.

  ### (c) Prediction and Reasoning

  **Prediction:** She will rule the new case as **contingent**.  

  **Reasons for preferring REP over RR:**  
  - **Consistency with verdict 7:** The new case is very similar to verdict 7 ("Benjamin Franklin is the inventor of the lightning rod"), which was ruled contingent. REP treats both cases uniformly because both rely on the same contingent property (inventing the lightning rod). RR, by contrast, distinguishes them based on rigidification, which might seem ad hoc if she hasn't explicitly endorsed rigidification in earlier judgments.  
  - **Emphasis on properties over semantics:** Her verdicts (especially 4, 5, and 7) show sensitivity to contingent properties (e.g., historical roles, physical measurements). REP directly captures this by tying necessity to essential properties, while RR is more abstract and semantic.  
  - **Lack of rigidification in prior cases:** None of the earlier verdicts involve "actual" or rigidified descriptions. Without explicit precedent for treating rigidified descriptions as necessary, she might favor the property-based approach of REP to avoid inconsistency with verdict 7.  
  - **Underdetermination caveat:** The verdicts do not explicitly address rigidification, so RR remains a viable alternative. However, REP is more aligned with her pattern of ruling identities contingent when they involve historical achievements (verdicts 4 and 7), suggesting she prioritizes metaphysical grounding over semantic fixes.

