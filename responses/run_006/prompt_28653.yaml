  ### Decision Procedure for Fair-Lending Model Review

  This procedure diagnoses conflicts between three fairness criteria (calibration, equal FPR, equal FNR) when base rates differ, guides tradeoff decisions, identifies value judgments, and flags policy conflicts. Designed for analysts with statistical training (no specialized fairness expertise) and executable within 4 hours per model.

  #### **Step-by-Step Procedure**
  1. **Compute Base Rates**  
     - Calculate \( \text{BR}_g = P(Y=1) \) for each protected group \( g \).  
     - **Tolerance**: \( |\text{BR}_{g1} - \text{BR}_{g2}| < 0.01 \).  
     - **Conflict Diagnosis**:  
       - If base rates differ **beyond tolerance**, proceed to Step 2 (conflict expected).  
       - If base rates are **equal**, all criteria are achievable; skip to Step 5.  

  2. **Check Calibration**  
     - Bucket scores into deciles. For each group/bucket:  
       - Compute average predicted score (\(\hat{p}\)) and actual outcome rate (\(p_{\text{actual}}\)).  
       - Measure calibration error: \( |\hat{p} - p_{\text{actual}}| \).  
     - **Tolerance**: Max error < 0.05 per bucket/group.  
     - **Actions**:  
       - If calibrated, proceed to Step 3.  
       - **Else**: Apply group-specific recalibration (e.g., Platt scaling) and recompute.  
     - **Value Judgment**: Accepting recalibration implies prioritizing score interpretability over raw model outputs.  

  3. **Equalize False Positive Rates (FPR)**  
     - Compute FPR (\( \text{FP} / (\text{FP} + \text{TN}) \)) per group at current threshold.  
     - **Tolerance**: \( |\text{FPR}_{g1} - \text{FPR}_{g2}| < 0.03 \).  
     - **Actions**:  
       - If FPR equal, proceed to Step 4.  
       - **Else**: Adjust global threshold to minimize FPR difference (e.g., via grid search).  
     - **Value Judgment**: Prioritizing equal FPR favors fairness in denials (harm reduction for applicants).  

  4. **Evaluate False Negative Rates (FNR)**  
     - Compute FNR (\( \text{FN} / (\text{FN} + \text{TP}) \)) per group.  
     - **Tolerance**: \( |\text{FNR}_{g1} - \text{FNR}_{g2}| < 0.05 \).  
     - **Escalation Criteria**:  
       - If \( |\text{FNR}_{g1} - \text{FNR}_{g2}| > 0.15 \), **escalate to legal/policy** (joint impossibility severe).  
       - Else, document FNR imbalance as accepted tradeoff.  
     - **Conflict Insight**: FNR inequality is mathematically inevitable here; tradeoffs are value-driven.  

  5. **Equal-Base-Rate Check**  
     - Verify all criteria: Calibration (Step 2), FPR (Step 3), FNR (Step 4).  
     - **Failure Action**: If any criterion fails despite equal base rates, flag model deficiency for retraining.  

  ---

  ### **Case Applications**

  #### **Case A: Mortgage Approval Model**  
  - **Context**: Substantial default base rate difference:  
    - Younger applicants (\( \text{BR}_A = 10\% \)).  
    - Older applicants (\( \text{BR}_B = 5\% \)).  
  - **Procedure Walkthrough**:  
    1. **Base Rates**: \( |0.10 - 0.05| = 0.05 > 0.01 \) → Conflict expected.  
    2. **Calibration**: Model overpredicted risk for younger group (avg error = 0.08).  
       - Applied Platt scaling → calibrated (error < 0.04).  
    3. **Equal FPR**:  
       - Pre-adjustment: \( \text{FPR}_A = 0.20 \), \( \text{FPR}_B = 0.30 \).  
       - Adjusted threshold → equal FPR at 0.25.  
    4. **FNR Evaluation**:  
       - \( \text{FNR}_A = 0.30 \), \( \text{FNR}_B = 0.40 \) → difference = 0.10.  
       - Within escalation tolerance (0.10 < 0.15) → accepted tradeoff.  
  - **Uncomfortable Outcome**:  
    - **Step 4**: Higher FNR for older applicants (40% vs 30%) means more defaults approved in this group.  
    - **Forced Choice**: Prioritizing equal FPR (fair denials) required accepting unequal FNR (unequal default risk).  
    - **Why Uncomfortable**: Higher FNR for older group could increase bank losses, but base rate difference makes this mathematically unavoidable.  

  #### **Case B: Small-Business Loan Model**  
  - **Context**: Near-equal default base rates (\( \text{BR}_A = 15\% \), \( \text{BR}_B = 16\% \)), but different feature sets for urban/rural regions.  
  - **Procedure Walkthrough**:  
    1. **Base Rates**: \( |0.15 - 0.16| = 0.01 \) (equal) → All criteria achievable.  
    2. **Calibration**: Rural model underperformed (error = 0.07).  
       - Recalibrated → error < 0.04.  
    3. **Equal FPR**:  
       - \( \text{FPR}_A = 0.25 \), \( \text{FPR}_B = 0.26 \) → within tolerance.  
    4. **FNR Evaluation**:  
       - \( \text{FNR}_A = 0.30 \), \( \text{FNR}_B = 0.35 \) → difference = 0.05 (tolerance met).  
  - **Uncomfortable Outcome**:  
    - **Step 5**: Despite equal base rates, FPR/FNR imbalances required recalibration and threshold tuning.  
    - **Forced Choice**: Using different features for regions introduced calibration disparities, forcing model adjustments that feel "unfair" to analysts (e.g., rural applicants scored differently for same behavior).  
    - **Why Uncomfortable**: Highlights model design flaws; team must confront whether regional feature sets are justified or a proxy for discrimination.  

  ---

  ### **Key Insights for Your Team**  
  - **Escalation Triggers**: Severe FNR gaps (>0.15) indicate fundamental policy conflicts, not model issues.  
  - **Value Judgments**:  
    - Step 2: Recalibration accepts altering scores for fairness.  
    - Step 3: Equalizing FPR favors applicant-centric fairness over bank risk.  
  - **Efficiency**: Uses standard metrics (FPR/FNR, calibration) computable in <4 hours with tools like Python or R.  
  - **Policy Impact**: When criteria conflict, the procedure exposes whether tradeoffs are technical (adjustable) or inherent (policy-level).
