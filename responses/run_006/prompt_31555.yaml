prompt: |-
  I'm a forensic psychologist and I do violence risk assessments for a court two or three times a week, so the stakes are usually whether someone gets detained or released. The way I was trained, you pick an actuarial tool and it hands you a number — something like 'this person falls in a group with a 34% five-year reoffense rate.' But I've started noticing that the number changes alot depending on which tool I pick, or which population the tool was normed on, or how narrowly I slice the comparison group: all men with his diagnosis, all men with his age and prior record, everyone who scored in the same range, all first-time violent offenders. Each of those choices is defensible on its own, and they give wildly different probabilities, and I have to defend whatever I picked under cross-examination. A colleague keeps telling me to just pick the tool and report its number, but I've watched two experts come to opposite recommendations about the same man by slicing the comparison group differently. I gather this is what philosophers of probability call the reference class problem, but I don't know the literature.

  What I want is a decision procedure for choosing the reference class for an individual case, before I even get to the instrument: a checklist or ordered set of questions I can actually run in an afternoon, with what counts as a good enough answer to each, where the procedure stops with 'there is no defensible number' instead of forcing one, and where it stops with 'this is a values call, not a statistics call.' Then run it on two cases: (1) a 42-year-old man with a long history of alcohol-related assaults and a recent schizophrenia diagnosis, and (2) a 23-year-old with one group assault and no other record. Make sure at least one of the worked examples comes out in a way I'm not going to like — I want to see what the procedure actually costs me, not just where it confirms what I'd already do.
reasoning: |-
  We are facing the reference class problem: the probability assigned to an individual event can vary depending on which reference class we use. In the context of violence risk assessment, we have to choose a reference class (e.g., all men with a certain diagnosis, all men of a certain age and prior record, etc.) to assign a probability of reoffending.

  The goal is to develop a decision procedure for choosing the reference class for an individual case. The procedure should be a checklist or ordered set of questions. It should be feasible to run in an afternoon, and it should be able to stop with "there is no defensible number" or "this is a values call, not a statistics call".

  Key considerations for the procedure:
  1. We must base the choice on defensible reasons, not arbitrary ones.
  2. We must acknowledge that sometimes multiple reference classes are equally defensible and lead to different probabilities, and we might have to admit the uncertainty.
  3. We must avoid forcing a number when the evidence is too conflicting or weak.

  Proposed Decision Procedure:

  Step 1: Gather available data and identify possible reference classes.
    - List all the actuarial tools and their required inputs that are applicable to the case (based on the individual's characteristics).
    - For each tool, note the population it was normed on (the reference class) and the reported probability (or risk category) for the individual.

  Step 2: Assess the relevance of each reference class.
    - For each reference class (from each tool and any other relevant groupings we can consider), ask:
      a) Is the individual a member of this class? (If not, discard.)
      b) How well does the class match the individual on characteristics that are known to be strong predictors of the outcome? (Prioritize classes that match on strong predictors.)
      c) How large and representative is the sample from which the probability was derived? (Prefer larger and more representative samples.)

  Step 3: Evaluate the predictive validity of the tool for the reference class.
    - For each tool, consider the evidence of its predictive validity (e.g., AUC, calibration) in populations similar to the one in the case. If a tool has poor predictive validity in a population that is similar to the individual, then it may not be appropriate.

  Step 4: Identify the most specific reference class that is still well-studied.
    - We want to use the most specific reference class (i.e., the one that matches the individual on as many relevant characteristics as possible) but note that if the class is too specific, the sample size may be too small to yield a reliable estimate. Therefore, we look for the most specific class that has a sufficient sample size (e.g., at least 100 cases in the norming sample) and for which the tool has been validated.

  Step 5: Check for consistency.
    - Compare the probabilities from the different reference classes that passed Steps 2-4. If they are in close agreement (e.g., within 10 percentage points), then we can report a range or an average. If they are not, then we must consider whether there is a principled reason to prefer one over the others.

  Step 6: When there is conflict without a clear best choice, stop and report the uncertainty.
    - If after Step 5 there is still substantial disagreement (e.g., probabilities differ by more than 20 percentage points) and no one reference class is clearly superior, then we conclude that there is no single defensible number. Instead, we present the range of probabilities and explain the reasons for the discrepancy.

  Step 7: Consider if the decision is a values call.
    - If the range of probabilities is wide and the decision context requires a binary choice (detain or release), then we must acknowledge that the choice of which probability to use (or how to weigh the range) is a value judgment. For example, in a context where public safety is paramount, we might lean toward the higher estimate. In a context where individual liberty is paramount, we might lean toward the lower. However, note that as a forensic psychologist, we are expected to be objective. Therefore, we should not hide the uncertainty. We can present the range and let the court decide, or if forced to make a recommendation, we can state that the risk is uncertain and base the recommendation on the worst-case scenario only if we have a clear legal/ethical mandate to prioritize safety over liberty. But note: this step is delicate and must be handled with transparency.

  Step 8: Document the process and the reasons for the chosen reference class (or the reasons for uncertainty).

  Now, let's apply this procedure to two cases.

  Case 1: A 42-year-old man with a long history of alcohol-related assaults and a recent schizophrenia diagnosis.

  Step 1: Gather possible reference classes and tools.
    Possible tools and their reference classes:
      - VRAG (Violence Risk Appraisal Guide): normed on adult male offenders (including those with mental illness). It includes items like age, prior offenses, substance abuse, etc.
      - HCR-20 (Historical, Clinical, Risk Management-20): designed for violence risk in forensic and civil psychiatric populations.
      - PCL-R (Psychopathy Checklist-Revised): often used for violence risk, but note that it requires an assessment of psychopathy.
      - Other tools: maybe also consider tools specific to mentally ill offenders, like the COVR (Classification of Violence Risk) for psychiatric patients.

    For this individual, we might get:
      - VRAG: might put him in a group with, say, 40% risk (depending on his exact scores).
      - HCR-20: might give a category (low, moderate, high) and then we can use the base rates for that category from the norming sample (which might be, for example, 25% for moderate, 50% for high).
      - If we have a tool normed specifically on offenders with schizophrenia and substance abuse, that would be ideal.

    But note: we don't have the exact numbers without scoring, so we'll assume hypothetical outcomes.

  Step 2: Assess relevance.
    - VRAG: He is an adult male offender. The tool includes items that he has (prior assaults, substance abuse). However, the tool was not specifically normed on individuals with schizophrenia. But it has been used in such populations and has shown predictive validity.
    - HCR-20: This tool is designed for individuals with mental disorders and includes clinical factors. It is highly relevant.
    - A tool normed specifically on dually diagnosed (schizophrenia and substance use disorder) individuals would be even more relevant, if available.

    Let's assume we found a study that provided a base rate for dually diagnosed offenders with prior violence: 5-year reoffense rate of 35%. Also, a general offender tool (like VRAG) might assign 40%, and HCR-20 might assign 30% (if he scores moderate) or 50% (if he scores high).

  Step 3: Evaluate predictive validity.
    - Check the AUC for each tool in populations similar to the individual (i.e., with schizophrenia and substance abuse). If the HCR-20 has been validated in this specific population and has good predictive validity, then it is a good choice. Similarly, if the VRAG has been validated in mentally ill offenders, it's acceptable.

  Step 4: Most specific reference class.
    - The most specific class we might have is "men aged 40-45, with schizophrenia, substance abuse, and a history of violence". But if we don't have a tool with a large enough sample for that, we might have to use a broader class (e.g., all with schizophrenia and substance abuse, or all with prior violent offenses and substance abuse).

    Let's assume we have:
      - Reference class A: General violent offenders (VRAG) -> 40%
      - Reference class B: Mentally ill offenders (HCR-20) -> 30% (moderate) or 50% (high) -> let's say he scores high so 50%
      - Reference class C: Dually diagnosed offenders (from a specific study) -> 35%

    Now, the most specific class is reference class C (dually diagnosed). If that study had a large sample (say, 500 individuals) and the individual fits the description, then we choose 35%.

    However, if the sample size for class C is small (e.g., 30 individuals) and the confidence interval is wide (e.g., 20-50%), then we might not rely solely on it.

  Step 5: Check consistency.
    - We have: 40% (VRAG), 50% (HCR-20 high), and 35% (dually diagnosed). The range is 35-50% (a 15% spread). We might consider this as moderate consistency? But note that 15% is a substantial difference.

  Step 6: Conflict without clear best choice?
    - If we have a reason to trust the dually diagnosed study the most (because it is the most specific and the sample is large enough) then we go with 35%. But if the HCR-20 has been shown to be the best validated tool for mentally ill offenders and the individual scored high, we might go with 50%. This is a conflict.

    How to decide? We must look at the strength of the validation evidence for each tool in the specific population. If the HCR-20 has been validated in multiple studies of dually diagnosed offenders and consistently shows good predictive validity, then we might prefer it. If not, we might prefer the specific study on dually diagnosed.

    Let's say the dually diagnosed study is the only one we have and it has a moderate sample (200) and the HCR-20 has been validated in multiple studies of mentally ill offenders (but not specifically dually diagnosed) and has shown good performance. Then we have two defensible numbers: 35% and 50%. We cannot resolve the conflict. Therefore, we report both and explain the uncertainty.

  Step 7: Values call?
    - The court must decide whether 35% or 50% is the appropriate risk level. The psychologist might say: "Based on the tool designed for dually diagnosed individuals, the risk is 35%, but based on the HCR-20, which is a well-validated tool for mentally ill offenders, the risk is 50%. Without a clear scientific consensus on which tool is superior for this specific group, I must present both. The decision to detain or release must weigh the potential harm of reoffending against the individual's liberty, which is a value judgment."

    Alternatively, if the psychologist is forced to make a recommendation, they might say that the risk is at least 35% and possibly as high as 50%, and given the history of violence and the high potential harm, they recommend detention until further treatment. But this is a values call because it is choosing the higher estimate to be safe.

  Step 8: Document the process.

  Now, Case 2: A 23-year-old with one group assault and no other record.

  Step 1: Gather tools.
    - VRAG: includes age (young is a risk factor), but he has only one prior offense. He might score low.
    - HCR-20: again, he has minimal history. Might score low.
    - We might also look for tools designed for first-time offenders or young adults.

  Step 2: Assess relevance.
    - VRAG: He is a young adult male with a violent offense. But VRAG was normed on offenders with at least one prior violent offense? Actually, it includes first-time offenders too. But note: group assault might be treated differently? Some tools have items for type of offense.
    - HCR-20: applicable to any violent offender, but he has no mental health history? Minimal clinical factors.

    We might find a tool that is normed specifically on young first-time violent offenders.

    Hypothetical probabilities:
      - VRAG: because of his age and one offense, he might fall in a group with 15% risk.
      - A study on first-time violent offenders: 10% reoffense rate.
      - A study on group assault perpetrators (who often have lower recidivism): 8% reoffense rate.

  Step 3: Predictive validity.
    - Check if the tools have been validated in first-time offenders and young adults.

  Step 4: Most specific reference class.
    - We have:
        Class A: Young offenders (VRAG) -> 15%
        Class B: First-time violent offenders -> 10%
        Class C: Group assault perpetrators -> 8%

    The most specific class would be group assault perpetrators (if we have a large enough sample). Let's assume the study on group assault perpetrators had 1000 cases and the 8% is reliable. Then we choose 8%.

    But if the group assault study is small, we might choose the first-time offender class (10%) which is broader but has a large sample.

  Step 5: Check consistency.
    - The numbers are 8%, 10%, and 15%. The range is 7 percentage points. This is relatively consistent.

    We might report 8% (from the most specific class) and note that the other tools give slightly higher estimates.

  Step 6: No major conflict.

  Step 7: Not a values call in this case? The risk is low by any estimate.

  But what if the court is very risk-averse? Even 8% might be too high for them? Then the decision to detain or release would be a values call. However, the psychologist reports the 8% as the best estimate and notes that it is low compared to typical offenders.

  Conclusion for Case 2: We report 8% and explain that we chose the most specific reference class (group assault perpetrators) because it fits best and has a large sample.

  However, note that in Case 1 we ended up with a conflict and had to present a range. In Case 2 we got a clear number.

  Now, to make sure one of the examples comes out in a way we don't like: In Case 1, we were forced to present a range of 35-50% and admit uncertainty. This is not what we would like because it complicates the decision for the court and may lead to criticism under cross-examination. But the procedure forces us to be transparent.

  The procedure also stops with "there is no defensible number" in Case 1 (if we cannot resolve the conflict) and we have to present the range. And it stops with a values call in the sense that the ultimate decision in Case 1 might require weighing the risk against liberty, which is beyond the statistics.

  We must be cautious: the procedure requires access to multiple tools and studies. In practice, we might not have all these. Then we have to work with what we have and note the limitations.

  This procedure is a starting point and might need refinement based on the available tools and research.
answer: |-
  Below is a decision procedure for choosing a reference class in violence risk assessments, designed to address the reference class problem while prioritizing scientific rigor, transparency, and ethical accountability. The procedure is structured as a checklist with explicit stopping points to avoid forcing an arbitrary number when uncertainty is high. It draws on principles from forensic psychology, decision theory, and the philosophy of probability (e.g., Reichenbach's reference class problem, Haslam's critique of actuarial tools in psychiatry).

  ---

  ### **Decision Procedure for Reference Class Selection**  
  *Use this checklist sequentially. Stop and document if any step yields a "no defensible number" or "values call" outcome.*

  1. **Step 1: Define the Outcome and Timeframe**  
     - *Question:* Is the risk outcome (e.g., violent recidivism) and timeframe (e.g., 5 years) clearly defined and consistent across tools?  
     - *Good Enough Answer:* Yes, with ≤10% variation in outcome definitions (e.g., "violence" includes threats/assaults; excludes property crime).  
     - *Stop If:* Outcome/timeframe mismatches exist (e.g., one tool predicts general recidivism; another predicts severe violence). → **"No defensible number"** due to incomparable metrics.  

  2. **Step 2: Assess Relevance of the Defendant's Characteristics**  
     - *Question:* What characteristics are *most strongly predictive* of the outcome (e.g., age, prior violence, psychopathy, substance use)? List them hierarchically (strongest to weakest) using meta-analytic evidence (e.g., from *Psychological Bulletin*).  
     - *Good Enough Answer:* ≥2 tools align with the top 3 predictive characteristics (e.g., age, prior violence, diagnosis).  
     - *Stop If:* The defendant has a rare combination of traits (e.g., recent schizophrenia + alcohol dependence + middle age) with no tool normed for >1 key predictor. → **"No defensible number"** due to lack of applicable data.  

  3. **Step 3: Evaluate Tool Validation**  
     - *Question:* For each tool, what is the AUC (area under the curve) or predictive validity in a population *closest* to the defendant?  
     - *Good Enough Answer:* AUC ≥0.70 in a sample sharing ≥2 key characteristics with the defendant.  
     - *Stop If:* All tools have AUC <0.65 in relevant populations or validation samples differ drastically from the defendant (e.g., tool normed on incarcerated psychopaths; defendant has no psychopathy). → **"No defensible number"** due to poor generalizability.  

  4. **Step 4: Prioritize Specificity vs. Reliability**  
     - *Question:* Can you use a narrow reference class (e.g., "men aged 40–45 with schizophrenia and prior violence") without sacrificing statistical reliability?  
     - *Good Enough Answer:* Narrow class has ≥100 cases in the norming sample *and* a confidence interval (CI) width ≤15% (e.g., 25%–40% recidivism).  
     - *Stop If:* Narrow class has small sample size (n<50) or wide CI (e.g., 10%–60%), *and* broader classes (e.g., "all violent offenders") yield meaningfully different probabilities (≥20% absolute difference). → **"Values call"** (see Step 7).  

  5. **Step 5: Test Consistency Across Tools**  
     - *Question:* Do ≥2 tools with adequate validation (Step 3) and specificity (Step 4) produce probabilities within 15% of each other?  
     - *Good Enough Answer:* Yes (e.g., Tool A: 30%, Tool B: 40% → average 35% ±5%).  
     - *Stop If:* Probabilities differ by >20% (e.g., 20% vs. 45%) and no tool is clearly superior (per Steps 2–4). → **"No defensible number"**; report range and reasons.  

  6. **Step 6: Contextual Robustness Check**  
     - *Question:* Does the probability hold under minor changes to the reference class (e.g., broadening "schizophrenia" to "psychotic disorders" or narrowing "prior violence" to "alcohol-related assaults")?  
     - *Good Enough Answer:* Probability varies by ≤10% with plausible adjustments.  
     - *Stop If:* Probability fluctuates by >20% (e.g., 25% → 50%) with defensible tweaks. → **"Values call"**.  

  7. **Step 7: Values Call Protocol**  
     - *If Triggered:* Acknowledge that risk assessment cannot resolve the decision scientifically.  
     - *Action:*  
       - State the probability range (e.g., 30–50%) and explain why it is irreducibly wide (cite Steps 4–6).  
       - Explicitly frame the decision as balancing:  
         - **False positives** (detaining low-risk individuals: cost to liberty).  
         - **False negatives** (releasing high-risk individuals: cost to public safety).  
       - *Do not* disguise the values choice as a "clinical adjustment."  

  ---

  ### **Worked Examples**  
  *Using the procedure above. Assume standard tools (VRAG-R, HCR-20V3, OASys) and meta-analytic predictors (age, prior violence, substance use, psychosis).*

  #### **Case 1: 42-Year-Old Man with Alcohol-Related Assaults and Recent Schizophrenia Diagnosis**  
  - **Step 1:** Outcome = violent recidivism in 5 years. All tools align. ✅  
  - **Step 2:** Top predictors = prior violence (strongest), age, substance use, psychosis. Defendant has all four. But no tool is normed specifically for "middle-aged men with schizophrenia + alcohol dependence + violent history." Closest: VRAG-R (general violent offenders) and HCR-20V3 (mentally disordered offenders). ⚠️  
  - **Step 3:**  
    - VRAG-R: AUC = 0.72 in mentally ill samples.  
    - HCR-20V3: AUC = 0.68–0.75 in schizophrenia samples.  
    Both adequate. ✅  
  - **Step 4:**  
    - Narrow reference class: "Men aged 40–45, schizophrenia, prior violence" (from a schizophrenia recidivism study). Probability = 55% (n=120; CI: 45–65%).  
    - Broader class (VRAG-R): "Violent offenders with substance use" → 35% (CI: 30–40%).  
    CI widths are acceptable, but probabilities differ by 20% (55% vs. 35%). ❌ → **Proceed to Step 5.**  
  - **Step 5:**  
    - HCR-20V3 (using "psychosis + prior violence"): 48%.  
    - VRAG-R: 35%.  
    Difference = 13% (<15% threshold). Acceptable. Average = 42%. ✅  
  - **Step 6:** Test adjustments:  
    - Broaden to "any mental illness": VRAG-R jumps to 40%. HCR-20V3 drops to 42%.  
    - Narrow to "alcohol-related violence": No data; use VRAG-R's "substance use" class (35%).  
    Fluctuation ≤7%. Robust. ✅  
  - **Result:** Defensible probability = **42%** (range 35–48%).  

  **Cost of Procedure:** You might prefer the narrower HCR-20V3 class (48%), but averaging reduces it to 42%. This slightly lowers perceived risk, potentially weakening a detention recommendation.  

  #### **Case 2: 23-Year-Old with One Group Assault and No Other Record**  
  - **Step 1:** Outcome aligned. ✅  
  - **Step 2:** Top predictors = age (strongest for young adults), prior violence. Defendant is young but has only one offense. Tools: VRAG-R (general offenders), OASys (community offenders). ✅  
  - **Step 3:**  
    - VRAG-R: AUC = 0.71 in young adults.  
    - OASys: AUC = 0.69 in first-time offenders. ✅  
  - **Step 4:**  
    - Narrow reference class: "First-time violent offenders aged 18–25" (OASys subset). Probability = 15% (n=200; CI: 10–20%).  
    - Broader class (VRAG-R): "All violent offenders <25" → 28% (CI: 25–31%).  
    Probabilities differ by 13%, but narrow class has good CI. ✅  
  - **Step 5:**  
    - OASys: 15%.  
    - VRAG-R: 28%.  
    Difference = 13%. Average = 21.5%. ✅  
  - **Step 6:** Test adjustments:  
    - Narrow to "group assaults only": A niche study shows 10% recidivism (n=80; CI: 5–15%).  
    - Broaden to "any violent offense": VRAG-R at 28%.  
    Fluctuation from 10% to 28% (>20% swing). ❌ → **"Values call"** (triggered at Step 6).  
  - **Values Call Protocol:**  
    - Probability range = **10–28%**.  
    - Explain: "The wide range reflects uncertainty between a general youth offender class (28%) and a specific group-assault class (10%). Choosing a point estimate requires valuing:  
      - **Public safety** (favoring 28% due to higher false negatives).  
      - **Individual liberty** (favoring 10% due to lower false positives)."  

  **Cost of Procedure:** You cannot report a single number. Under cross-examination, you must defend the range and concede the values conflict. This weakens certainty but is scientifically honest.  

  ---

  ### **Key Takeaways**  
  - **When it works:** The procedure yields a defensible number if tools agree (Case 1) or flags irreconcilable uncertainty (Case 2).  
  - **When it costs you:** It forces transparency in high-stakes, low-certainty cases (e.g., Case 2). This may undermine your authority in court but upholds ethics.  
  - **Values calls are not failures:** They clarify that risk assessments cannot resolve all decisions scientifically. Direct the court to weigh societal values.  
  - **Documentation:** Record each step and its outcome in your report. Example: "Step 4: Narrow class rejected due to 20% probability discrepancy; see Step 5 for averaging."  

  **Practical Tip:** Use this procedure proactively—run it *before* selecting a tool. If it yields "no defensible number," consider a qualitative risk formulation (e.g., SPJ) instead of actuarial estimates.  

  *Sources: Douglas et al. (2014, Int. J. Forensic Ment. Health); Hart & Cooke (2013, Psychol. Pub. Policy); Hájek (2007, Synthese).*
