  But the core dispute is ontological: is there a fundamental kind of intentionality that is intrinsic and underived? That is not merely verbal.

  However, the use of "original" might be a verbal sticking point. The Searlean uses "original" to denote a natural kind (intrinsic intentionality). The Dennettian uses "original" as a label for the unexplained. So if both sides agreed that by "original intentionality" we mean an unexplained gap, then they might agree that there is no such thing? But the Searlean wouldn't accept that definition. So the dispute over the existence of original intentionality might be partly verbal in that they are using the term differently, but the underlying ontological question remains.

