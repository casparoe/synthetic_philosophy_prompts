  Joint Statement:

  ---

  **Joint Statement on Intentionality: Adversarial Collaboration Between Searlean and Dennettian Camps**

  **1. Agreements**

  We, the undersigned, representing the Searlean and Dennettian perspectives on intentionality, agree on the following:

  1.1. Intentionality is the property of mental states (or representations) by which they are about, or directed at, objects, states of affairs, or contents.

  1.2. There are clear and uncontroversial cases of derived intentionality, such as the intentionality of linguistic symbols (e.g., the word "dog" refers to dogs), maps, diagrams, and traffic signs. This intentionality is derived from the activities of intentional agents (in the case of human artifacts) or from evolutionary processes (in the case of biological traits).

  1.3. The debate about intentionality is not about the existence of intentional states or derived intentionality per se. Both sides accept that intentional states exist and that derived intentionality exists.

  1.4. The debate is also not about dualism versus physicalism. Both sides agree that intentionality is a natural phenomenon and must be explained within a naturalistic framework.

  1.5. The core disagreement concerns the existence and nature of what is called "original intentionality": whether it is a distinct, fundamental kind of intentionality that is intrinsic and not derived from any other intentional states.

  **2. Disagreements**

  The following table summarizes the key disagreements, with each side's position stated in their own terms:

  | Issue | Searlean Position | Dennettian Position |
  |-------|-------------------|---------------------|
  | **The Nature of Original Intentionality** | Original intentionality is an intrinsic, non-derived property of certain biological systems (e.g., the human brain). It is not dependent on interpretation by any other intentional system and serves as the ultimate source of all derived intentionality. | The term "original intentionality" does not denote a natural kind. It is a placeholder for an unexplained gap in our understanding. All intentionality, including that attributed to biological systems, is derived from the functional organization, history, and evolutionary context of the system. |
  | **The Existence of a Fundamental Distinction** | There is a principled, ontological distinction between original intentionality (which is intrinsic and underived) and derived intentionality (which is parasitic on original intentionality). This distinction is necessary for a complete account of intentionality. | There is no fundamental ontological distinction between two kinds of intentionality. The distinction between "original" and "derived" is pragmatic and reflects the extent of our current understanding. All intentionality is derived, and what is called "original" is simply derived intentionality that we have not yet fully explained. |

  **3. Cruxes**

  We identify the following questions as cruxes of the debate. For each crux, we provide a concrete case and each side's analysis or prediction. Settling these questions would significantly advance the debate, potentially leading one or both sides to revise their positions.

  3.1. **Crux 1: Can non-biological systems that are not designed by intentional agents exhibit genuine intentionality?**

     - *Concrete Case*: Consider a naturally evolved biological system that is not the product of an intentional designer, such as the frog's visual system that causes it to flick its tongue at small moving dots (interpreted as flies). Does this system exhibit intentionality about flies, and if so, is that intentionality original or derived?

       - *Searlean Analysis*: The frog's neural state has original intentionality because it is an intrinsic biological state. It is about flies (or fly-like stimuli) and this intentionality is not derived from any other intentional agent. Therefore, the frog is a clear case of original intentionality without an intentional designer.

       - *Dennettian Analysis*: The frog's state is not intrinsically intentional. Its intentionality (about flies) is derived from the evolutionary history and functional role of the state. Since natural selection is not an intentional agent, this case shows that intentionality can arise without original intentionality. Thus, the intentionality is derived, and the frog case does not require original intentionality.

  3.2. **Crux 2: Can derived intentionality be fully explained without invoking original intentionality?**

     - *Concrete Case*: The meaning of words in a dead language (e.g., Linear B) that has been deciphered by archaeologists who have no contact with the original speakers. The meaning is reconstructed solely from physical artifacts (tablets) and context.

       - *Searlean Analysis*: The intentionality of the words is derived from the original intentionality of the ancient speakers. The archaeologists' reconstruction is successful only because it recovers the original intentionality. Thus, the explanation ultimately relies on original intentionality.

       - *Dennettian Analysis*: The meaning is reconstructed entirely from patterns in the artifacts and their context, without needing to invoke any original intentionality as a distinct kind. The intentionality of the words is explained by their functional role in the ancient society and the archaeological evidence. Therefore, derived intentionality can be explained without original intentionality.

  3.3. **Crux 3: Can a complete physical and functional account of a cognitive system explain intentionality without residue?**

     - *Concrete Case*: Suppose we have a comprehensive neuroscientific and functional account of a human brain state underlying the belief that water is wet. This account includes all causal and functional details, as well as the evolutionary history.

       - *Searlean Analysis*: Such an account would only capture the syntax (causal structure) but not the semantics (the aboutness). The intentional content (that the belief is about water and its wetness) would remain unexplained and requires the recognition of original intentionality as an intrinsic property.

       - *Dennettian Analysis*: A complete account that includes the functional role, evolutionary history, and causal relations to the environment would fully explain the intentionality. There would be no residue of unexplained intentionality, and thus no need for original intentionality.

  **4. Verbal Dispute Clarification**

  We recognize that some aspects of the disagreement may stem from terminological differences. Specifically, the term "original intentionality" is used by the Searlean camp to denote an intrinsic, non-derived natural kind, while the Dennettian camp uses the same term to denote an unexplained gap in our theories. This difference in usage can lead to confusion. However, the core disagreement is not merely verbal because it concerns the existence of a fundamental kind of intentionality that is intrinsic and underived. The Searlean camp asserts that such a kind exists, while the Dennettian camp denies it, asserting instead that all intentionality is derived and explicable in functional and historical terms.

  ---

  End of joint statement.
answer: |-
  **Joint Statement on Intentionality: Adversarial Collaboration Between Searlean and Dennettian Camps**

  **1. Agreements**  
  We, the undersigned, agree on the following claims regarding intentionality and the scope of our debate:

  1.1. **Definition of intentionality**: Intentionality is the property of mental states or representations by which they are *about*, *directed at*, or *refer to* objects, properties, states of affairs, or content, regardless of their physical implementation.  
  1.2. **Existence of derived intentionality**: There are clear, uncontroversial cases of derived intentionality, such as:  
      - Linguistic symbols (e.g., the word "cat" refers to cats).  
      - Artifacts like maps, traffic signs, or algorithms, whose intentionality is assigned by human designers or users.  
      - Institutional facts (e.g., money or marriage), which depend on collective intentionality.  
  1.3. **Explanatory target**: Any complete theory of intentionality must explain how derived intentionality arises and is sustained. It must also address the *source* of intentionality in biological systems (e.g., humans) and whether this source is distinct from derived cases.  
  1.4. **What the debate is not about**:  
      - The existence of intentionality *as a phenomenon* (both sides accept it as real).  
      - Dualism vs. physicalism (both sides agree intentionality must be naturalized within a physical world).  
      - The usefulness of intentional idioms in psychology or AI (both sides employ intentional explanations pragmatically).  
      - Whether consciousness is necessary for intentionality (this is orthogonal; both sides allow for unconscious intentional states).  

  **2. Disagreements**  
  The table below summarizes key disagreements, with each formulation acceptable to the respective camp:  

  | Issue | Searlean Position (Acceptable Wording) | Dennettian Position (Acceptable Wording) |
  |-------|----------------------------------------|------------------------------------------|
  | **Nature of original intentionality** | Original intentionality is an intrinsic, non-derived biological capacity of certain systems (e.g., human brains), which serves as the foundational source for all derived intentionality. | "Original intentionality" is not a natural kind; it is a placeholder term for intentionality that lacks a complete explanation, and all intentionality is derived from evolutionary, functional, or historical processes. |
  | **The distinction's basis** | There is a principled ontological distinction: original intentionality is causally primary, underived, and independent of interpretation, while derived intentionality is parasitic on it. | No ontological distinction exists; the "original/derived" dichotomy is epistemic, reflecting explanatory gaps rather than natural divisions. All intentionality is derived, and "original" is a misleading reification. |
  | **Explanatory adequacy** | Derived intentionality cannot be fully explained without reference to original intentionality, as the latter provides the necessary semantic grounding. | Derived intentionality can be fully explained via patterns, functions, and history (e.g., adaptation, learning, or design), without invoking an unexplained "original" kind. |
  | **Role of interpretation** | Original intentionality does not depend on interpretation by other agents; it is a real, causally efficacious property of the system. | All intentionality, including that in biological systems, is ascribed via the intentional stance (interpretation) and has no reality independent of this stance. |

  **3. Cruxes**  
  We identify the following sub-questions as cruxes. For each, we provide a shared concrete case and both sides' analyses. Settling these would force at least one side to revise their position.  

  3.1. **Crux 1: Can intentionality arise in a system without any evolutionary or design history linked to intentional agents?**  
      - *Concrete Case*: A self-organizing, non-biological system (e.g., a spontaneously forming crystal structure) that, through physical laws alone, develops state transitions perfectly mirroring a finite-state automaton for "predicting" environmental patterns (e.g., light/dark cycles). The system has no evolutionary history and no designer.  
          - *Searlean Prediction*: The system lacks genuine intentionality. Its states are merely causal and lack "aboutness"; at best, they exhibit as-if intentionality. This confirms that intentionality requires original biological grounding.  
          - *Dennettian Prediction*: The system exhibits intentionality (e.g., "expecting" light) because its functional organization supports reliable interpretation. This shows intentionality can emerge without original intentionality, reducing to physical dynamics.  

  3.2. **Crux 2: Can derived intentionality be fully explained in non-intentional terms?**  
      - *Concrete Case*: A chess-playing AI that uses deep learning to "intend" checkmate. Its training involves only data (board states and outcomes) and reinforcement signals, with no explicit symbolic rules or human labels for "intent."  
          - *Searlean Analysis*: The AI's intentionality is derived from human designers (who have original intentionality). A non-intentional explanation (e.g., neural weights) describes syntax but misses semantics; original intentionality is needed to explain *why* the states are *about* chess.  
          - *Dennettian Analysis*: The AI's intentionality arises solely from functional roles shaped by training history. A complete non-intentional explanation (e.g., gradient descent optimizing win-rates) suffices, demonstrating that derived intentionality requires no residual "original" layer.  

  3.3. **Crux 3: Is interpretive flexibility sufficient to constitute intentionality?**  
      - *Concrete Case*: A naturally evolved, non-conscious system (e.g., a bacterium's chemotaxis mechanism) that reliably moves toward sugar. Multiple interpretations are possible: it "seeks food," "avoids starvation," or "follows gradients."  
          - *Searlean Analysis*: The mechanism has original intentionality (e.g., *about* sugar) fixed by biology, independent of interpretation. Ambiguity arises from observer limitations, not the intentionality itself.  
          - *Dennettian Analysis*: Intentionality is inseparable from interpretation; the bacterium's states are derivatively intentional because meaning is assigned by us (or natural selection). Ambiguity confirms there is no "real" intentionality beyond interpretation.  

  3.4. **Crux 4: Can a system exhibit original intentionality if it is entirely computationally simulable?**  
      - *Concrete Case*: A perfect computational simulation of a human brain (e.g., via digital neurons), producing identical behavior and internal states to a biological brain, including reports of "meaning."  
          - *Searlean Analysis*: The simulation lacks original intentionality; it has only derived intentionality parasitic on the programmers. Syntax manipulation (even if isomorphic to biology) cannot generate genuine semantics without biological primacy.  
          - *Dennettian Analysis*: The simulation possesses intentionality identical to a biological brain. Any functional duplicate must have the same intentionality, proving it is derived from organization, not biology.  

  **4. Identification of Verbal Disputes**  
  We conclude that **part of the dispute is verbal** regarding the term "original intentionality."  
  - Why it is verbal: The Searlean camp uses "original intentionality" to denote a *sui generis* biological property, while the Dennettian camp uses it as a label for unexplained aspects of intentionality. Thus, when the Dennettian denies "original intentionality," they deny an unexplained residue, whereas the Searlean affirms a real biological capacity. This terminological mismatch obscures agreement on the phenomena (e.g., humans exhibit underived-seeming intentionality) and the need for naturalistic explanation.  
  - Why it is not merely verbal: The core disagreement remains ontological. The Searlean position asserts a *categorical biological distinction* with causal consequences (e.g., original intentionality as an unanalyzed primitive), while the Dennettian position asserts that all intentionality is *explicable through functional analysis* without biological primacy. Resolving this requires empirical evidence (e.g., from Cruxes 1–4), not just redefinition.  

