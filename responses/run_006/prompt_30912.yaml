  Dennettian camp: holds that all intentionality is derived, and that what is called original intentionality is just a placeholder for an unexplained gap. They might say: "What is called 'original intentionality' is not a natural kind but rather a label for the intentionality we attribute to systems (like humans) without yet having a full explanation of how it arises. All intentionality is derived in the sense that it arises from the functional organization and history of the system, and there is no intrinsic, non-derived intentionality."

