answer: |-
  Here's a faithful restatement of Bertrand Russell's views in *Marriage and Morals* (1929) using contemporary ENM/polyamory vocabulary, followed by a residue report analyzing the fit:

  **Russell's Views Translated into Modern ENM/Poly Vocabulary:**

  1.  **Critique of Traditional Marriage:** Russell saw traditional marriage as an oppressive, **prescriptive hierarchy** enforced by religion, property rights, and the state. He viewed it as inherently entangled with **patriarchal control** over women and children, suppressing individual freedom and authentic connection.
  2.  **Sexual Liberation:** He advocated for the complete decoupling of sexual intimacy from legal or religious marriage bonds. This aligns with **sexual autonomy**, a core RA principle, arguing that mutual affection and consent, not marriage licenses, should govern sexual ethics.
  3.  **Love as Central (But Monogamous?):** Russell placed great emphasis on love as the *only* valid foundation for sexual relationships. However, he typically described love in dyadic, exclusive terms ("passionate love"). His ideal seems closer to **serial monogamy** or allowing **affairs** within a primary dyad when love fades, rather than ongoing, concurrent loving relationships. He feared love diluted by multiple partners.
  4.  **Rejection of Lifelong Monogamy as Default:** He vehemently opposed the **relationship escalator** assumption that marriage must be lifelong and exclusive, regardless of changing feelings or circumstances. He argued for easier divorce and acceptance that most marriages wouldn't (and shouldn't) last forever if love died.
  5.  **Children and Relationships:** Russell explicitly separated the function of child-rearing from the romantic/sexual partnership model. He argued society (via state support) should bear the economic burden of children, freeing individuals from staying in loveless marriages "for the children." This resonates with disentangling **nesting**/**co-parenting** from romantic/sexual exclusivity, though he didn't envision concurrent partners co-parenting.
  6.  **Jealousy as Pathological:** He viewed jealousy not as natural or justified, but as a destructive, possessive emotion rooted in insecurity and societal conditioning. This aligns strongly with the ENM/poly goal of mitigating jealousy and fostering **compersion** (though he doesn't use the term), seeing possessiveness as harmful to genuine love.
  7.  **Individual Autony & Honesty:** He championed individual freedom and honesty within relationships. He argued against deceitful affairs, implying a preference for **open relationships** with **honest communication** if non-monogamy occurred, rather than cheating. This echoes RA's focus on autonomy and negotiated agreements.
  8.  **Focus on Societal Reform:** His primary goal wasn't outlining new relationship structures *per se*, but dismantling the societal forces (religion, law, economic dependence) that propped up oppressive traditional marriage. His work is a critique of **amatonormativity** and **compulsory monogamy**.

  **The Residue Report: What Fits, What Stretches, What's Missing**

  | Category          | Analysis                                                                                                                                                              | Verdict                                                                 |
  | :---------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------- |
  | **Clean Translation** | - Critique of **Prescriptive Hierarchy** & the **Relationship Escalator** as default/coercive. <br> - Emphasis on **Sexual Autonomy** & consent. <br> - Pathologizing possessiveness/jealousy (proto-**Compersion**). <br> - Separation of romantic partnership from **nesting**/co-parenting functions. <br> - Rejection of **Compulsory Monogamy** & **Amatonormativity**. <br> - Value of **Honest Communication** over deceit. | Strong fit. Core critiques of societal norms align remarkably well.     |
  | **Stretch/Fudge Required** | - **"Love Centrality"**: Translating his dyadic "passionate love" ideal into poly's multi-love framework requires ignoring his explicit concerns about love dilution. <br> - **Non-Monogamy Type**: His model is closer to **serial monogamy** + tolerated **affairs** within a primary dyad (often when love fades), not ongoing, consensual **polyamory** with multiple loving partners. <br> - **Structures**: Concepts like **descriptive hierarchy**, **nesting partners**, **solo poly**, **metamours**, **kitchen table poly**, or negotiated **boundaries** are absent. He doesn't describe *how* concurrent relationships function. <br> - **Veto Power**: He didn't address mechanisms like veto power; his focus was on individual freedom, not partner agreements. | Significant stretch. His vision of non-monogamy is fundamentally different and less structured. |
  | **No Expression in Poly Vocab / Contradictions** | - **Economic Focus on Children:** His primary argument for separating marriage from child-rearing was economic/societal burden, not creating space for multi-parent families (a common poly discussion). <br> - **Gender Essentialism:** While feminist-leaning, his views contained period-typical essentialism (e.g., differing sexual needs of men/women) incompatible with modern queer/poly understandings. <br> - **Queer Invisibility:** His analysis is entirely heteronormative. <br> - **Fear of Promiscuity:** He often conflated non-monogamy with fleeting, loveless encounters ("promiscuity"), which he viewed negatively compared to "serious" love (even if temporary). <br> - **Lack of Positive Framework:** He excelled at *critique* but offered little *constructive* alternative beyond easier divorce, tolerance for affairs, and state-supported childcare – not a blueprint for consensual multi-partner relating. <br> - **Implied Hierarchy:** His tolerance for affairs often assumes a primary marital bond, implying a form of **couple privilege** he wouldn't name. | Fundamental differences. His framework lacks key poly concepts and contains incompatible elements. |

  **Conclusion: Ahead of His Time, But Mapping Differently**

  People are **partly projecting, but also recognizing genuine foresight in core critiques.**

  *   **Why it's projection:** Claiming Russell advocated for modern polyamory as practiced today is inaccurate. He did not articulate a vision of ongoing, concurrent, committed loving relationships between multiple partners. His model was primarily serial monogamy or discreet affairs within a primary dyad, driven by a dyadic ideal of "passionate love." The rich vocabulary describing poly structures, negotiations, hierarchies (descriptive), and multi-partner dynamics (**metamours**, **KTP**, **solo poly**) is entirely absent. His heteronormativity and some essentialism are jarringly outdated.

  *   **Why it's foresight:** Russell was profoundly ahead of his time in diagnosing the **pathologies of compulsory monogamy, prescriptive hierarchy (marriage), the relationship escalator, and amatonormativity**. His radical calls for **sexual autonomy, honest communication, the separation of love/sex from legal/economic bonds, and the pathologizing of jealousy** are foundational principles that deeply resonate with and *enabled* the later development of ENM and polyamory. He smashed the ideological pillars supporting traditional marriage with arguments poly communities still use today.

  **Verdict:** Russell wasn't articulating modern polyamory. He was a radical critic of traditional marriage and sexual morality whose core critiques about autonomy, honesty, the harms of jealousy, and the artificiality of binding love to legal/economic structures **cleared the intellectual ground** upon which modern polyamory and relationship anarchy could later be built. He's a crucial **precursor** whose critiques map incredibly well, but his *positive vision* for alternatives maps poorly onto contemporary poly practice and vocabulary. The claim that he was "saying the same stuff" overstates the case, but his work undeniably contains the seeds of the rebellion that polyamory represents.
