prompt: |-
  I'm facilitating a reading group of about ten people — a mix of philosophy graduate students, working programmers, and one molecular biologist — working through Hofstadter's Gödel, Escher, Bach. We're coming up on Chapter 16, and I have seventy-five minutes to get them from the Typogenetics formal system to the claim that the structure of Gödel's self-referential sentence and the structure of DNA self-replication are the same abstract pattern. I don't want to lecture; I want to walk them through a sequence of ideas so that by the end the isomorphism feels earned rather than asserted.

  Plan the session's explanatory arc. I need to know: what has to be in place before I can even state the isomorphism — the order in which the pieces must be introduced and what depends on what. What single example or case should carry the whole thing? (I'm guessing the Typogenetics self-replicating string, but I want to know which one and why that one rather than a simpler or more complex one.) What misconceptions will the group bring or form along the way — the programmer will likely think it's about quines and miss the biological structure, the biologist will likely think it's a metaphor and miss the formal rigor, the philosophers will likely think it's about consciousness — and at exactly which point in the sequence should I head each one off? What should I check for at the end to know whether they've grasped the isomorphism as a structural claim rather than a loose analogy? And what honest boundary should I draw — which part of the connection does Hofstadter himself leave as suggestive rather than proved, and where should I say so?
