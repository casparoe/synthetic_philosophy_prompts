prompt: |-
  I work as a policy analyst for a state legislative committee, and every session we sit through testimony where advocates lean hard on thought experiments — the ticking bomb to justify surveillance powers, the lifeboat to argue about how to ration scarce resources, the tragedy of the commons to justify regulation or privatization, that sort of thing. Some of these seem to genuinely clarify a tradeoff, and others seem to just make one option feel inevitable by the time the story is over, and I honestly can't always tell which is happening until it's too late. I've seen the term intuition pump used as an insult in the comments on our public hearings, but nobody in my office could give you an actual criterion. We process maybe a dozen of these arguments a week during session, none of us have philosophy training, and we have to turn our notes into a one-page memo for the committee chair by the next morning, and she will not accept 'this felt manipulative' as a reason to discount somebody's testimony. If we get it wrong, actual legislation gets drafted on the back of an intuition.

  So I'd like a reusable procedure we can run: a checklist or ordered sequence of questions for deciding whether a thought experiment in a policy argument is doing real argumentative work or just pumping intuitions — with what counts as a sufficient answer at each step, where the procedure says 'discount this argument,' and where it has to hand the decision to a philosopher becuase the question is substantive rather than procedural. Then run the procedure on two or three concrete cases: for example, a surveillance bill defended with a ticking-bomb scenario, and a healthcare rationing argument that leans on a lifeboat story. Include at least one case where the procedure tells us to disregard an argument the committee is inclined to love, and be explicit about where the procedure itself breaks down or quietly smuggles in judgment calls dressed up as method.
reasoning: |-
  Okay, let's tackle this policy analyst's problem. They're dealing with thought experiments in legislative testimonies and need a reliable way to evaluate them. First, I need to understand their main pain points. They mentioned examples like the ticking bomb for surveillance, lifeboat for healthcare rationing, and tragedy of the commons. The challenge is distinguishing between valid clarification and manipulative intuition pumps. Their team lacks philosophy training, and they need a quick, procedural checklist for their memos.

  The user wants a reusable procedure—something like a checklist with specific questions. Each step should have clear criteria for when to discount an argument or flag it for expert review. They also want examples analyzed, including one where the procedure contradicts the committee's inclination. Plus, they need transparency on where the method has hidden judgment calls.

  First, I should recall what intuition pumps are. Coined by Dennett, they're thought experiments that steer intuitions without rigorous argument. The key is whether the thought experiment does real argumentative work or just manipulates emotions. 

  The checklist needs steps that are actionable for non-philosophers. Start with structural analysis: identify the policy claim and the thought experiment's setup. Then, test for relevance, realism, completeness, and alternatives. Each step should have clear pass/fail criteria. For example, if the thought experiment oversimplifies by removing constraints, that's a red flag.

  Next, consider the examples. Ticking bomb scenario: often used to justify torture or surveillance. Common flaws include unrealistic time pressure and lack of alternatives. Lifeboat scenario for rationing: might ignore systemic solutions or real-world complexities. Tragedy of the commons could be misapplied if it ignores community management options.

  The procedure must also highlight where judgment calls sneak in. For instance, determining if the scenario is "sufficiently analogous" to the real policy isn't straightforward. Step 5 (alternatives) might require subjective assessment of what counts as a credible alternative. Acknowledging these points is crucial so the analysts know when they're making a judgment versus following a clear rule.

  For the memo format, the procedure should output a structured note. Include whether the argument is valid, flawed, or needs expert review. The examples will demonstrate this: ticking bomb fails on multiple checks, lifeboat might pass if presented carefully, tragedy of the commons could go either way.

  Also, the user needs a case where the procedure recommends disregarding a popular argument. The tragedy of the commons example, if used to push privatization without considering community solutions, would fit. The committee might favor privatization, but the procedure flags it as manipulative by showing omitted alternatives.

  Finally, ensure the procedure is efficient. They process dozens a week and need quick turnaround. The checklist must be streamlined, maybe 5-6 steps, with clear yes/no outcomes. Highlighting where to stop early (e.g., if relevance fails) saves time. Including examples in the memo helps the chair understand the rationale beyond "felt manipulative."
answer: |-
  Here's a reusable **Thought Experiment Evaluation Protocol (TEEP)** designed for speed, procedural rigor, and transparency. It identifies manipulative intuition pumps while preserving valid arguments, explicitly flags judgment calls, and provides clear outputs for your memo.

  ---

  ### **Thought Experiment Evaluation Protocol (TEEP)**
  *Run these steps in order. Stop and assign a classification if triggered.*

  1.  **Identify the Core Policy Claim (CPC) & Thought Experiment (TE):**
      *   *Question:* What specific policy change (X) is being advocated, and what is the *exact* scenario/story told to support it?
      *   *Sufficient Answer:* "Advocate claims policy X (e.g., expand surveillance powers) is justified by TE Y (e.g., 'ticking bomb' scenario)."
      *   *Failure to Answer:* Flag as "Testimony Unclear" in memo.
      *   *Judgment Call:* Minimal. Requires accurately paraphrasing testimony.

  2.  **Test Relevance & Isolation:**
      *   *Question:* Does TE *directly* illustrate the core tradeoff/principle *central* to CPC, or is it introducing extraneous elements (high emotion, irrelevant details, strawman opponents)?
      *   *Sufficient Answer (Relevant):* TE focuses solely on the key ethical dilemma (e.g., security vs. privacy *in the specific context proposed*).
      *   *Red Flag (Irrelevant/Manipulative):* TE heavily relies on visceral fear (e.g., graphic bomb victim descriptions), demonizes opponents, or depicts a scenario fundamentally different from the policy's *typical application* (e.g., bomb scenario used to justify *routine* data collection, not acute emergencies).
      *   *Output:* If Red Flag → **Classify: "Likely Intuition Pump (Irrelevant/Emotive)." Discount argument.** Skip to Step 6. Else, proceed.
      *   *Judgment Call:* Distinguishing "core tradeoff" from "extraneous emotion." Requires asking: "Is the emotional charge *necessary* to see the tradeoff, or is it *substituting* for it?"

  3.  **Test Realism/Plausibility Constraints:**
      *   *Question:* Does the TE remove critical real-world constraints present in the policy's application? (e.g., certainty, time, information, scalability, unintended consequences, human fallibility).
      *   *Sufficient Answer (Constrained):* TE incorporates realistic limitations (e.g., chance the suspect is wrong, torture produces bad intel, resource allocation has long-term effects).
      *   *Red Flag (Unrealistic/Decontextualized):* TE assumes near-perfect conditions (e.g., *known* bomb location, *known* guilty suspect, *certain* torture works, *immediate* life-or-death choice with *no* other options, *perfect* knowledge of who will benefit/suffer).
      *   *Output:* If Red Flag → **Classify: "Likely Intuition Pump (Oversimplified)." Discount argument.** Skip to Step 6. Else, proceed.
      *   *Judgment Call:* Determining which constraints are "critical" for *this specific policy*. Requires asking: "Is the scenario plausible *as described* given how X would *actually* work?"

  4.  **Test Completeness of Alternatives:**
      *   *Question:* Does the TE present a false dichotomy or omit credible alternative responses (policy or non-policy) that exist in reality?
      *   *Sufficient Answer (Complete):* TE fairly represents viable alternatives relevant to CPC (e.g., in rationing: different allocation methods, prevention strategies, systemic reforms).
      *   *Red Flag (False Dichotomy/Omission):* TE forces a choice between only 2 bad options (e.g., "Torture suspect OR let bomb explode", "Throw 1 out of lifeboat OR all drown", "Privatize commons OR face ruin"), ignoring realistic middle paths, preventative measures, or systemic solutions.
      *   *Output:* If Red Flag → **Classify: "Likely Intuition Pump (False Choice)." Discount argument.** Skip to Step 6. Else, proceed.
      *   *Judgment Call:* Identifying "credible" alternatives. Requires basic policy knowledge: "Does the testimony ignore standard policy options or mitigation strategies known in this field?"

  5.  **Test for Analogical Strength:**
      *   *Question:* Is the TE *sufficiently analogous* to the real-world situation the policy addresses? Are key differences acknowledged and addressed?
      *   *Sufficient Answer (Strong Analogy):* Key elements map clearly to CPC context; differences noted don't undermine the core principle.
      *   *Red Flag (Weak/False Analogy):* Mapping is strained; key differences fundamentally change the moral calculus (e.g., comparing state healthcare rationing to a *sudden, isolated* lifeboat crisis ignores systemic planning and preventative care).
      *   *Output:* If Red Flag → **Classify: "Likely Intuition Pump (Weak Analogy)." Discount argument.** Else → **Proceed to Step 6.**
      *   *Judgment Call:* Assessing "sufficiently analogous." This is the **Primary Philosopher Handoff Point.** Requires substantive philosophical judgment about moral equivalence across contexts. *If no red flags yet, but analogy feels weak:* **Classify: "Requires Philosopher Review: Analogical Strength."**

  6.  **Final Classification & Memo Note:**
      *   If discounted in Steps 2, 3, or 4: **"Argument Relies on Flawed Thought Experiment: [Reason - e.g., Oversimplified]. Intuition likely manipulated. Policy claim unsupported by this testimony."** (Cite specific TE flaw).
      *   If passed Steps 2-4 but flagged for Philosopher Review in Step 5: **"Thought Experiment not obviously flawed procedurally, but analogical strength to real policy context requires expert philosophical assessment. Argument validity uncertain based on TE alone."** (Briefly state the analogy concern).
      *   If passed all Steps 2-5: **"Thought Experiment appears structurally valid and relevant. It usefully clarifies the core tradeoff/principle [Briefly state it] underlying policy X. Argument carries weight, subject to other evidence."**

  ---

  ### **Applying TEEP: Concrete Examples**

  **Case 1: Surveillance Expansion (Ticking Bomb)**

  1.  **CPC & TE:** Expand warrantless surveillance powers (X) justified by a "Ticking Bomb" scenario: Authorities *know* a bomb is hidden in a city, *know* a specific suspect has the location, have *minutes* to act, and the *only* way to get the info is immediate, unrestricted access to all communications/data (Y).
  2.  **Relevance & Isolation:** *Red Flag.* High emotion (mass casualties), demonizes opposition ("Do you want blood on your hands?"), scenario (acute, certain, imminent) differs vastly from typical surveillance use (proactive, broad, uncertain threats). **Classify: Likely Intuition Pump (Irrelevant/Emotive). Discount argument.**
  3.  *(Stopped at Step 2)*
  4.  **Memo Note:** "Advocate's 'ticking bomb' scenario relies on extreme fear and an unrealistic, acute emergency context fundamentally different from the proposed broad, proactive surveillance powers. Does not address the core tradeoff of security vs. privacy *in routine application*. Argument discounted as manipulative intuition pump."

  **Case 2: Healthcare Rationing (Lifeboat) - Committee Favors Version A**

  *   **Scenario:** Advocate argues for prioritizing younger patients for scarce ICU beds (Policy X) using a "Lifeboat" TE: 10 people in a sinking lifeboat rated for 8. Choosing who to save based solely on age (youngest survive) is presented as the *only* fair/necessary choice to save the most life-years (Y). Committee finds this compelling.
  *   **TEEP Analysis:**
      1.  **CPC & TE:** Prioritize younger patients for scarce life-saving treatment (X) justified by "Lifeboat" scenario forcing immediate age-based triage (Y).
      2.  **Relevance & Isolation:** *Pass.* Focuses on core rationing dilemma (allocating scarce resource under pressure). Emotion present but linked to the core tradeoff.
      3.  **Realism/Constraints:** *Red Flag.* Removes critical constraints: Assumes *perfect certainty* of outcomes (saving exactly 8), *immediacy* (no time for other actions), *no alternative criteria* (comorbidity, prognosis, social value), *no preventative context* (ignores why the boat is overloaded/systemic underfunding). **Classify: Likely Intuition Pump (Oversimplified). Discount argument.**
      4.  *(Stopped at Step 3)*
  *   **Memo Note (Contradicting Committee):** "While highlighting the rationing dilemma, the 'lifeboat' scenario oversimplifies reality by removing critical constraints: certainty of outcome, time pressure excluding alternatives, and sole focus on age. Real-world rationing involves complex prognostication, multiple ethical criteria, and occurs within a broader system. This TE makes age-based prioritization seem uniquely inevitable; argument discounted as manipulative oversimplification."

  **Case 3: Regulating Fisheries (Tragedy of the Commons)**

  1.  **CPC & TE:** Privatize fishing quotas via tradable permits (X) justified by "Tragedy of the Commons" TE: Unregulated common pasture leads every herder to add more cows, destroying the resource for all. Private property forces responsibility (Y).
  2.  **Relevance & Isolation:** *Pass.* Directly illustrates the core problem (overuse of shared resource).
  3.  **Realism/Constraints:** *Pass (Conditional).* Scenario is stylized but captures the incentive problem. Realism depends on specifics (can fish stocks be monitored like cows?).
  4.  **Completeness of Alternatives:** **Red Flag.** Presents a false dichotomy: Only "unregulated commons" or "full privatization." Omits credible alternatives like *community co-management* with rules, *government regulation* (catch limits, seasons), *non-tradable quotas*. **Classify: Likely Intuition Pump (False Choice). Discount argument.** (Privatization *might* be best, but TE doesn't prove it's the *only* solution).
  5.  *(Stopped at Step 4)*
  6.  **Memo Note:** "The 'Tragedy of the Commons' scenario usefully illustrates the incentive for overuse but presents a false choice between unregulated commons and privatization. It omits credible alternative regulatory approaches (e.g., community management, state-set quotas). Argument for privatization based solely on this TE is discounted as it manipulates intuition towards one solution by hiding others."

  ---

  ### **Where TEEP Breaks Down / Hides Judgment Calls**

  1.  **Step 2 (Relevance/Isolation):** Distinguishing "core tradeoff" from "extraneous emotion" is inherently subjective. What's "visceral fear" vs. legitimate emphasis on stakes? *Mitigation:* Focus on *functional necessity*. Does the emotion *clarify* the abstract tradeoff, or *replace* the need to argue it? "This feels manipulative" becomes "The emotional element depicts consequences outside the policy's typical scope."
  2.  **Step 3 (Realism/Constraints):** Defining "critical" constraints is highly context-dependent and requires policy expertise. Is "imperfect information" critical for *this specific surveillance tool*? *Mitigation:* Focus on constraints explicitly removed in the TE that are well-documented problems in the policy area (e.g., "The TE assumes perfect information, but intelligence failures are well-documented").
  3.  **Step 4 (Completeness):** Judging "credible alternatives" requires significant policy knowledge. What counts as a "realistic" alternative in healthcare rationing? *Mitigation:* Rely on standard policy options documented in committee research or previous testimony. Flag if *common* solutions are omitted.
  4.  **Step 5 (Analogical Strength - Philosopher Handoff):** This is the core substantive judgment Dennett warned about. TEEP identifies *structural* flaws (irrelevance, oversimplification, false choices) efficiently, but assessing whether a *structurally sound* TE *actually* maps morally/practically to the real world is deep philosophy. TEEP explicitly flags this for handoff. *This is its key strength/limitation.* It filters obvious pumps and isolates the genuinely hard, philosophical question.

  **How to Use This Tomorrow:**
  1.  **Template:** Create a TEEP checklist form for your notes.
  2.  **During Testimony:** Jot down CPC, TE description, and quick Step 1-5 assessments (Pass/Red Flag? Why?).
  3.  **Memo Language:** Use the standardized classifications and notes from Step 6.
  4.  **Philosopher Handoff:** Establish a protocol (e.g., contact university philosophy dept, designated in-house consultant) for Step 5 flags. Note in memo: "Analogical strength requires external philosophical review."
  5.  **Transparency:** Briefly describe TEEP in an appendix to your memo. "Our assessment uses a procedural checklist to evaluate thought experiments for common structural flaws..."

  TEEP transforms "this felt manipulative" into "this scenario is irrelevant to the policy," "this oversimplifies critical constraints," or "this hides realistic alternatives," providing your Chair with defensible, substantive reasons to weigh (or discount) arguments based on thought experiments.
