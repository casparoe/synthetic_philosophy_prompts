  I'm taking a graduate seminar on theories of consciousness and we've been spending alot of time on Integrated Information Theory. I've read the standard critiques — the expanding grid of logic gates having high Φ, the split-brain stuff — but I'm trying to get a handle on something more specific.

  Here's what I want: a thought experiment, constructed to order, where IIT (version 3.0, roughly) assigns a higher Φ value to a system that, on any ordinary functional or behavioural criterion, seems obviously less conscious than a comparison system — and the comparison system gets a lower Φ. The idea is to isolate a case where IIT's formalism and our pre-theoretic judgements about consciousness come apart in a particularly sharp way, without relying on the standard sci-fi or digital-consciousness scenarios. Both systems should be biologically plausible in broad outline (some speculative neuroscience is fine, but no uploads, no AI, no exotic physics). Keep the scenario to one paragraph.

  After the scenario, do the walkthrough: explain why IIT gives the verdicts it does — what's going on with the causal structure, the integration, the mechanisms that drive Φ up or down in each system. Then identify which specific feature of IIT's formalism is doing the work in the case (is it the exclusion postulate? the way Φ is calculated over a maximally irreducible conceptual structure? something about the spatial grain?). Finally, explain how an IIT defender would respond to the case — what's their best move, and how much does it cost them? Does it force them to bite a bullet, or can they redescribe the case in a way that dissolves the tension?

  Also, my supervisor is a stickler about this: please lead with the thought experiment itself in the first sentence (or paragraph), with no preamble, no restating of the question, and no "here's a thought experiment" — just drop me straight into the scenario. And write in British English.
