  We are building an ethical decision procedure for pesticide use in a municipal park system.
   The framework: moral consideration based on capacity for welfare, not species. Precautionary principle: if uncertain about capacity, do not assume lack of capacity when harm is severe and irreversible.

   The procedure should have sequential gates (pass/fail) and cover:
     - What the application is protecting (health, ecological function, conservation, amenity)
     - Taxa affected and evidence about their capacity to suffer
     - What the method does to the animals and for how long
     - Nonlethal or less harmful alternatives already tried
     - Comparison of expected harm and expected benefit

   Stopping conditions:
     - "No" when the protected good is mere amenity and the welfare cost is high.
     - "Yes, with the least harmful effective method" when the good is human health or species conservation.
     - Escalate to a person when there is a value trade-off the procedure cannot make (e.g., how much insect suffering is acceptable for a rare ornamental collection, or what probability of sentience is enough for precaution).

   Steps should be labeled as judgment calls when they are.

   We'll create a procedure with the following steps:

   Step 1: Identify the Protected Good
     - Question: What is the primary good being protected by this pesticide application? 
