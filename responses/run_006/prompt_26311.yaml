  ### Ethical Pesticide Decision Procedure for Municipal Park IPM

  This procedure provides a step-by-step framework for evaluating the moral defensibility of pesticide proposals, based on **capacity for welfare** and the **precautionary principle**. It requires staff to explicitly weigh harms to insects against human/ecological benefits, with built-in stops for unacceptable cases or unresolved value conflicts. Designed for completion in ~30 minutes without an ethicist.

  **Core Principles**  
  - Moral weight depends on a being's capacity to experience harm (e.g., pain, distress), not species.  
  - Uncertainty ≠ Absence: If capacity for suffering is uncertain, assume it *may* exist when harm is severe/irreversible.  
  - Four protected good categories:  
    - **Health** (direct human disease risk)  
    - **Ecological Function** (keystone species, ecosystem stability)  
    - **Conservation** (extinction-risk species, genetic diversity)  
    - **Amenity** (aesthetics, comfort, convenience)  

  ---

  **Procedure: 6 Gates with Pass/Fail/Escalate Outcomes**  
  *Complete gates sequentially. Stop at any "fail" or "escalate" step.*

  #### **Gate 1: Protected Good**  
  - **Question:** What is the *primary* good protected by this pesticide application?  
  - **Evidence needed:** Description of the problem and its impact.  
  - **Passes if:** Good is Health, Ecological Function, or Conservation.  
  - **Fails/stops if:** Good is *solely* Amenity (e.g., stickiness, visual nuisance).  
  - **Escalates if:** Mixed goods (e.g., "partly amenity, partly conservation").  
  - *Judgment call:* Staff must categorize the good honestly (e.g., "rare plant conservation" vs. "visitor comfort").  

  #### **Gate 2: Affected Taxa and Suffering Capacity**  
  - **Question:** Which taxa (target and non-target) will be harmed? What does evidence suggest about their capacity for suffering?  
  - **Evidence needed:**  
    - List taxa (e.g., aphids, mosquitoes, pollinators).  
    - Scientific evidence (e.g., studies on nociception, stress responses).  
    - Apply precaution: If evidence is uncertain/incomplete, assume *potential* for suffering.  
  - **Passes if:** All affected taxa identified; uncertainty acknowledged.  
  - **Fails/stops if:** Key taxa omitted (e.g., pollinators for foliar spray).  
  - **Escalates if:** High uncertainty about suffering capacity *and* severe harm expected.  
  - *Judgment call:* Interpreting evidence quality (e.g., "honeybees show stress responses → medium confidence in suffering capacity").  

  #### **Gate 3: Harm Severity and Duration**  
  - **Question:** How severely will the pesticide harm taxa? Consider:  
    - Lethality (death rate)  
    - Suffering (e.g., neurotoxin-induced paralysis)  
    - Duration (minutes vs. days)  
    - Scale (individuals affected)  
  - **Evidence needed:** Pesticide mode of action, symptoms, persistence.  
  - **Passes if:** Harm characterized as Low/Medium/High (see table below).  
  - **Fails/stops if:** Harm to high-sentience taxa (e.g., birds, mammals) not minimized.  
  - **Escalates if:** Uncertainty about suffering + irreversible harm (e.g., colony collapse).  
  - *Judgment call:* Categorizing harm severity:  
    | **Harm Level** | Criteria |  
    |----------------|----------|  
    | **Low**        | Quick death (<1 hr), minimal distress, small-scale (e.g., targeted swabbing) |  
    | **Medium**     | Death in 1–24 hrs, observable distress, moderate-scale |  
    | **High**       | Prolonged death (>24 hrs), severe distress (e.g., spasms), large-scale/systemic |  

  #### **Gate 4: Nonlethal Alternatives**  
  - **Question:** What nonlethal or lower-harm alternatives were tried? Why were they insufficient?  
  - **Evidence needed:** Records of attempted methods (e.g., biocontrol, traps, pruning).  
  - **Passes if:** ≥2 alternatives tried OR justification for why impractical (e.g., urgency, cost).  
  - **Fails/stops if:** Feasible alternatives exist but untried (e.g., hosing aphids before chemicals).  
  - **Escalates if:** Alternatives partially effective but require integration.  

  #### **Gate 5: Harm-Benefit Comparison**  
  - **Question:** Does the expected benefit *outweigh* the expected harm? Use:  
    - Protected good (Gate 1)  
    - Harm severity (Gate 3)  
    - Alternatives (Gate 4)  
  - **Evidence needed:** Integrated analysis of Gates 1–4.  
  - **Passes if:**  
    - Health/Conservation + any harm level OR  
    - Amenity + Low harm  
  - **Fails/stops if:**  
    - Amenity + Medium/High harm  
  - **Escalates if:**  
    - Ecological Function + High harm OR  
    - Conservation + High harm OR  
    - Uncertainty about suffering + High harm  
  - *Judgment call:* Weighing abstract trade-offs (e.g., "Is saving a rare cycad worth 10,000 scale insects dying painfully?").  

  #### **Gate 6: Final Decision**  
  - **Pass outcome:** "Yes, using the *least harmful effective method*" (e.g., Bti over broad-spectrum neurotoxin).  
  - **Fail outcome:** "No, morally indefensible."  
  - **Escalate outcome:** Refer to director with:  
    - Harm-benefit summary  
    - Specific value conflict (e.g., "How much insect suffering is acceptable for this conservation goal?").  

  ---

  ### Structured Summary Tables  
  **Table 1: Procedure Steps**  

  | Step               | Question asked                                      | Evidence needed                                  | Passes if                                | Fails/stops if                         | Escalates to a person if                     |  
  |--------------------|-----------------------------------------------------|--------------------------------------------------|------------------------------------------|----------------------------------------|----------------------------------------------|  
  | 1. Protected Good  | What primary good is protected?                     | Problem description, impact                      | Health, Eco-Function, or Conservation    | Solely Amenity                         | Mixed goods (e.g., "partly amenity")         |  
  | 2. Affected Taxa   | Which taxa harmed? Suffering capacity evidence?     | Taxa list, scientific studies, uncertainty       | All taxa ID'd, precaution applied        | Key taxa omitted                       | High uncertainty + severe harm               |  
  | 3. Harm Severity   | Harm severity/duration?                             | Pesticide MOA, symptoms, scale                   | Harm categorized (Low/Med/High)          | High-sentience taxa harm not minimized | Uncertainty + irreversible harm              |  
  | 4. Alternatives    | What alternatives tried? Why insufficient?          | Records of attempts, justification               | ≥2 tried OR justification for skipping   | Feasible alternatives untried          | Alternatives need integration                |  
  | 5. Harm-Benefit    | Does benefit outweigh harm?                         | Integrated Gates 1–4 analysis                    | Health/Conservation any harm; Amenity+Low | Amenity + Medium/High harm             | Eco-Function/Conservation+High harm; uncertainty trade-off |  
  | 6. Final Decision  | N/A                                                 | N/A                                              | "Yes, least harmful method"              | "No"                                   | Director for value judgment                  |  

  **Table 2: Worked Cases**  

  | Case                               | Gates passed        | Gates failed   | Final outcome           | Value judgment step                              |  
  |------------------------------------|---------------------|----------------|-------------------------|--------------------------------------------------|  
  | (1) Linden allee aphids (neonicotinoid) | 2, 3, 4             | **1, 5**       | **No**                  | Gate 5: Amenity + High harm → auto-fail          |  
  | (2) Mosquito larvicide (Bti)       | 1, 2, 3, 4, 5       | None           | Yes, least harmful      | Gate 3: Harm severity (Medium)                   |  
  | (3) Rare cycad scale treatment     | 1, 2, 4             | None           | **Escalate to director**| **Gate 5: Conservation + High harm → trade-off** |  

  ---

  ### Case Analyses  
  **Case 1: Linden allee aphids (neonicotinoid)**  
  - **Gate 1 (Protected Good):** FAIL. Honeydew stickiness is purely amenity (no health/ecology risk). Stop → **No**.  
    *(Even if proceeding: Harm severity (Gate 3) = High (neurotoxin, slow death, non-target pollinators). Harm-benefit (Gate 5): Amenity + High harm → Fail.)*  
  - **Why uncomfortable?** Staff may view aphids as "just bugs," but procedure prioritizes welfare. Non-target bee harm exacerbates ethical cost.  

  **Case 2: Mosquito larvicide (Bti)**  
  - **Gate 1:** Pass (Health: disease vector).  
  - **Gate 2:** Pass (Taxa: mosquito larvae; medium confidence in suffering capacity).  
  - **Gate 3:** Pass (Harm: Medium – quick paralysis, species-specific, low non-target impact).  
  - **Gate 4:** Pass (Alternatives: Source reduction tried; Bti is least harmful option).  
  - **Gate 5:** Pass (Health benefit outweighs Medium harm).  
  - **Outcome:** Yes, with Bti (least harmful method).  

  **Case 3: Rare cycad scale treatment**  
  - **Gate 1:** Pass (Conservation: rare plants in international program).  
  - **Gate 2:** Pass (Taxa: scale insects; low-evidence suffering capacity but precaution applies).  
  - **Gate 3:** Pass (Harm: High – systemic pesticide causes slow death, high scale mortality).  
  - **Gate 4:** Pass (Alternatives: Pruning, biocontrol tried).  
  - **Gate 5:** ESCALATE (Conservation + High harm → value trade-off).  
  - **Director’s question:** "Is preserving these cycads worth the potential suffering of thousands of scales, given uncertainty about their sentience?"  

  ---

  ### Implementation Notes  
  - **Staff training:** Provide reference sheets for:  
    - Suffering evidence by taxon (e.g., bees = medium confidence; aphids = low confidence).  
    - Harm severity examples (e.g., neonicotinoids = High; insecticidal soap = Medium/Low).  
  - **Documentation:** Require staff to complete a template summarizing each gate.  
  - **Escalations:** Director uses procedure output + institutional values (e.g., "We prioritize conservation over pest welfare when extinction risk is high").  
  - **Review:** Audit 10% of decisions quarterly to ensure consistency.  

  This procedure forces explicit ethical reasoning, prioritizes precaution, and halts morally indefensible uses—while empowering staff to resolve clear cases quickly.
