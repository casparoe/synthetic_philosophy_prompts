     But to simplify, we can say: for any animal that might be killed or suffer, and for which there is scientific uncertainty about sentience, we apply the precautionary principle and assume they might suffer. Therefore, we will consider the potential harm.

   Step 3: Assess the Nature and Severity of Harm
     - Question: What does the pesticide do to the animals? How severe is the harm? (e.g., lethal, sublethal but causing prolonged suffering, or minimal impact) and how long does the effect last?
