     - Judgment call: How to interpret the evidence and uncertainty? What counts as sufficient evidence of capacity for suffering? We might categorize:
          High confidence of capacity: e.g., vertebrates (though we don't use insecticides on vertebrates, but non-targets might include them) - but for insects, we are uncertain.
