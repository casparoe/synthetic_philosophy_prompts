     - Fails if: No alternatives have been tried and there are feasible ones that might work. (But note: we might still pass if the harm-benefit is very strong? So we need to combine with the next step.)

   Step 5: Compare Expected Harm and Expected Benefit
     - Question: Considering the capacity for suffering of the affected animals, the severity of harm, and the value of the protected good, does the expected benefit outweigh the expected harm?
