prompt: |-
  I've been following the debate about probability in the many-worlds interpretation for years across rationalist forums, and I think the two main camps have been talking past each other long enough that a structured adversarial collaboration would be productive. I'd like you to draft the document such a collaboration would produce.

  The two camps are:

  **Camp A (Derivationist):** The Born rule is not an independent postulate. A rational agent who accepts the bare Everettian picture — a unitarily evolving universal wavefunction with decohering branches — can be compelled by decision theory, self-locating uncertainty, or symmetry arguments to assign credences across branches that match the Born weights. The probability rule is therefore a theorem of rationality applied to the ontology, not an extra physical law.

  **Camp B (Skeptic):** The Everettian picture as such provides no resources to derive the Born rule. Every attempted derivation either implicitly assumes something equivalent to the Born rule (e.g., that branch weights should matter for rational choice), or relies on premises a skeptic has no reason to grant (e.g., that one should care about branches in proportion to their amplitude). MWI therefore either fails to explain quantum probabilities or succeeds only by being supplemented with a postulate that is functionally identical to the one it was meant to eliminate.

  Draft the joint statement these two camps could sign after a good-faith adversarial collaboration. I want:

  1. **A numbered list of agreed-upon claims.** These should cover: what the bare Everettian formalism gives us before anyone mentions probability; what exactly needs explaining (i.e., what a satisfactory account of quantum probability must do); what results like Gleason's theorem and the decision-theoretic work of Deutsch and Wallace do and do not establish, stated in terms both sides accept; and which attempted derivations are acknowledged by both sides to fail, and why.

  2. **A disagreements table** with these columns:
     - *The precise statement of disagreement*, phrased so that each side would accept the wording of its own position (no strawmen).
     - *The crux*: the sub-question on which the disagreement turns, such that a settled answer would move at least one side.
     - *A concrete test, argument, or formal result* that both sides agree bears on the crux, with each side's prediction or interpretation of that evidence recorded in advance.

  I am especially interested in whether any part of the dispute is verbal. For instance: do the two sides mean different things by "deriving" the Born rule — one requiring a deductive proof from the formalism alone, the other allowing that rational constraints plus the formalism jointly entail it? Do they disagree about what counts as an acceptable explanation in physics — one side holding that a decision-theoretic argument is explanatory, the other insisting that only a physical mechanism counts? If you find that some disagreements dissolve under sharper definitions, say which ones and why, and include those clarifications in the agreed-upon claims rather than in the disagreements table.

  Format the output as a proper adversarial-collaboration document: a preamble that both sides sign, then the numbered agreed claims, then the disagreements table, then (if applicable) a brief note on which disputes were found to be verbal and how they were resolved.
reasoning: |-
  We are drafting a joint statement from an adversarial collaboration between two camps in the debate about probability in the many-worlds interpretation (MWI) of quantum mechanics.

  Camp A (Derivationist) believes that the Born rule can be derived from the bare MWI formalism plus rational constraints (like decision theory or self-locating uncertainty). Camp B (Skeptic) believes that the bare MWI formalism does not provide resources to derive the Born rule without circularity or without adding a postulate equivalent to it.

  We will structure the document as follows:

  1. **Preamble**: A statement both sides sign, explaining the purpose and the spirit of the collaboration.
  2. **Agreed-upon claims**: A numbered list of claims that both sides agree on.
  3. **Disagreements table**: A table with three columns: (1) the precise statement of disagreement, (2) the crux of the disagreement, and (3) a concrete test/argument/result that bears on the crux, with each side's position.
  4. **Note on verbal disputes**: A brief note on any disputes that dissolve under clarification.

  ---

  **Preamble**

  We, the undersigned, representing the Derivationist (Camp A) and Skeptic (Camp B) perspectives on probability in the many-worlds interpretation, have engaged in an adversarial collaboration to clarify the points of agreement and disagreement. Our goal is to produce a document that accurately represents both positions, identifies the core issues, and provides a foundation for future research and discussion. We agree that the debate has often suffered from miscommunication and that a structured examination can help resolve or at least better frame the outstanding questions.

  ---

  **Agreed-Upon Claims**

  Both parties agree on the following claims:

  1. **The Bare Everettian Formalism**: The many-worlds interpretation (MWI) postulates a unitarily evolving universal wavefunction. Decoherence leads to the emergence of branching structures that can be described as effectively classical "worlds" or "branches". These branches are not additional ontological primitives but are patterns in the wavefunction.

  2. **What Needs Explaining**: A satisfactory account of quantum probability in MWI must explain why a rational agent, aware of being in a branching universe, should assign credences to the outcomes of quantum measurements in accordance with the Born rule (i.e., probabilities proportional to the squared amplitudes). This account must not assume the Born rule as a premise, and it must be non-circular.

  3. **Gleason's Theorem**: Gleason's theorem shows that in a Hilbert space of dimension at least 3, the only probability measure that is non-contextual (i.e., assigns probabilities to outcomes in a way that does not depend on the choice of measurement basis) and assigns probability 1 to the entire space and 0 to the null vector is given by the Born rule (i.e., the squared amplitude). Both sides agree that this is a mathematical result about the structure of Hilbert space. However, it does not, by itself, establish why an agent in an Everettian universe should use such a measure, nor does it connect the measure to rational credences or frequencies.

  4. **Decision-Theoretic Approaches (Deutsch, Wallace, etc.)**: The decision-theoretic derivations (e.g., by Deutsch and Wallace) show that if an agent uses a set of axioms of rational decision-making (such as the axioms of Savage or the non-contextual symmetry requirements), then in a branching scenario they must act as if they assign probabilities in accordance with the Born rule. Both sides agree that these derivations are valid given their premises. However, Camp B contends that the premises may implicitly assume the Born rule or require justification within the Everettian framework.

  5. **Failed Derivations**: Both sides agree that some attempts to derive the Born rule are flawed. For example:
     - The "naive branch counting" approach (assigning equal probability to all branches) fails because the number of branches is not well-defined (branches are not discrete and depend on the choice of decoherence basis) and because it does not reproduce the Born rule probabilities.
     - Arguments that rely solely on the wavefunction amplitude without a decision-theoretic or rational-constraint framework (e.g., early proposals by Everett) are incomplete because they do not establish why the agent should care about amplitude in a way that leads to probability.

  6. **The Role of Rational Constraints**: Both sides agree that any derivation of the Born rule must involve some principles of rationality (such as consistency in decision-making or indifference in self-locating uncertainty) in addition to the quantum formalism. The dispute is over whether these principles are independently justified and whether they are sufficient when applied to the Everettian ontology.

  7. **The Status of Branch Weights**: Both sides agree that the wavefunction assigns a complex amplitude to each branch (or, more precisely, to each decoherent history) and that the squared modulus of the amplitude (the "weight") is a mathematical feature of the formalism. The question is whether and how this weight should inform an agent's credences.

  ---

  **Disagreements Table**

  | Precise Statement of Disagreement                                                                                                                                 | Crux                                                                                                                                                                | Concrete Test/Argument/Result and Each Side's Position                                                                                                                                                                                                                                                                                                                              |
  |-------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Camp A**: The Born rule can be derived from the bare Everettian formalism (including decoherence) plus universally accepted principles of rationality (such as those used in decision theory or self-locating uncertainty). Therefore, the Born rule is not an additional postulate but a consequence of the theory and rationality. <br><br> **Camp B**: The bare Everettian formalism does not, by itself, provide the resources to derive the Born rule. Any derivation either implicitly assumes the Born rule (e.g., in setting up the decision-theoretic framework) or relies on rationality principles that are not forced by the formalism and which a skeptic can reasonably reject. | Whether the rationality principles used in derivations (like the decision-theoretic axioms) are compelling and non-circular when applied to the Everettian branching scenario. | **Concrete Argument**: The decision-theoretic derivation by Wallace (based on a set of axioms for rational choice under branching). <br> - **Camp A's Position**: The axioms (e.g., non-contextuality, continuity, etc.) are reasonable and independent of quantum mechanics. They are justified by rational coherence and thus compel an Everettian agent to use the Born rule. <br> - **Camp B's Position**: The decision-theoretic axioms are not compelling in the Everettian context because they assume that the agent should care about branch weights (or something equivalent) in a way that already builds in the Born rule. For example, the requirement that an agent's preferences be invariant under certain transformations might implicitly assume that the branches are weighted by amplitude. |
  | **Camp A**: The existence of a consistent and rational assignment of credences that matches the Born rule, derived from the theory plus rationality, provides an adequate explanation for quantum probabilities. <br><br> **Camp B**: The Everettian account does not explain why we observe frequencies that match the Born rule. It must either add a postulate (e.g., that we should weight branches by squared amplitude) or else it fails to explain the observed frequencies, which is a central feature of quantum mechanics. | Whether an explanation of probabilities in MWI requires a physical mechanism that makes high-weight branches more likely to be observed, or whether rational credence alone (even without a physical chance mechanism) is sufficient to explain our observations. | **Concrete Test**: Consider a hypothetical scenario where an agent in an Everettian universe observes a long sequence of quantum measurements with outcomes that deviate from the Born rule (i.e., the frequencies are far from the squared amplitudes). <br> - **Camp A's Position**: Such a sequence would be extremely rare (in the measure provided by the wavefunction) and thus the agent would be rational to assign low credence to being in such a branch. The explanation of frequencies is via typicality in the multiverse. <br> - **Camp B's Position**: The rarity in the wavefunction measure does not by itself explain why the agent does not observe such a sequence. Without a physical chance mechanism, there is no reason why the agent should not find themselves in a low-weight branch. Hence, the wavefunction weights do not explain the observed frequencies without an additional postulate. |
  | **Camp A**: The wavefunction amplitudes (and their squares) are objective features of the Everettian ontology. Rational constraints (like the principle of indifference or decision-theoretic axioms) applied to these objective features lead to the Born rule. <br><br> **Camp B**: The wavefunction amplitudes are objective, but the assignment of probabilities to branches is not inherent in the ontology. Without an additional postulate, there is no reason why rational agents should use the squared amplitude rather than, say, the amplitude itself or some other function. | Whether there is any a priori reason (within the Everettian framework) to treat the squared amplitude as a measure of importance for rational agents. | **Concrete Result**: The use of the squared amplitude in Gleason's theorem and in the decision-theoretic derivations. <br> - **Camp A's Position**: The mathematical uniqueness of the squared amplitude (as in Gleason) and the decision-theoretic derivations show that it is the only consistent way to assign probabilities. <br> - **Camp B's Position**: Gleason's theorem applies to probability measures over a single measurement, but it does not explain why an agent should care about that measure in the branching scenario. The decision-theoretic derivations assume that the agent cares about the branches in a way that leads to that measure, which is circular. |

  ---

  **Note on Verbal Disputes**

  Through our collaboration, we identified one major point that had been obscured by verbal differences:

  - **Meaning of "Derivation"**: Camp A uses "derivation" to mean a proof that, starting from the Everettian formalism and adding principles of rationality (which they consider necessary and independent), leads to the Born rule. Camp B, however, expects a derivation to follow from the physical formalism alone, without any appeal to rationality. This difference in what counts as a derivation is not substantive but terminological. 

  We agree that the key question is not whether the Born rule is derived from the formalism alone (which both sides now agree it is not) but whether the addition of rationality principles (which are not specific to quantum mechanics) is sufficient and non-circular. This reframing moves the debate to the justification of the rationality principles in the branching context.

  Additionally, we found that:

  - **Explanation vs. Mechanism**: Camp A considers a decision-theoretic argument explanatory because it shows that rational agents must use the Born rule. Camp B requires a physical mechanism (like a chance process) to explain why we observe Born rule frequencies. This is a substantive disagreement about what constitutes an adequate explanation in physics.

  We have incorporated these clarifications in the agreed-upon claims and the disagreements table.

