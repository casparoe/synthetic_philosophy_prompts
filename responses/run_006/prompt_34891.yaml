answer: |-
  ### Practice Exam Question  
  **"Fitch’s paradox is widely interpreted as a *reductio ad absurdum* of the anti-realist’s knowability principle (KP: ∀p(p → ◊Kp). Explain *why* the paradox poses a serious threat to anti-realism, and critically evaluate whether anti-realists can adequately respond by either restricting KP or revising classical logic. In your view, does the paradox force anti-realists to abandon the *spirit* of verificationism?"**  

  ---

  ### Model Answer (Approx. 700 words)  
  Fitch’s paradox demonstrates that the anti-realist’s knowability principle (KP), when combined with two intuitive assumptions—that some truths are unknown (∃p(p ∧ ¬Kp)) and that knowledge is factive (Kp → p)—logically entails that *all* truths are known (∀p(p → Kp)). This conclusion is catastrophic for anti-realism, which rejects omniscience. The derivation hinges on substituting the proposition *p ∧ ¬Kp* (an "unknown truth") into KP: if this proposition is true, KP implies ◊K(p ∧ ¬Kp). Yet knowing a conjunction entails knowing both conjuncts (K distributes over ∧), so ◊(Kp ∧ K¬Kp). Since knowledge is factive, K¬Kp entails ¬Kp, yielding ◊(Kp ∧ ¬Kp)—a contradiction in possible worlds semantics. Thus, the initial assumption (an unknown truth) must be false if KP holds.  

  The paradox threatens anti-realism’s core commitment: that truth is epistemically constrained. Anti-realists like Dummett argue truth cannot outstrip our capacity to know it, but Fitch appears to show that KP collapses into global omniscience unless we deny the existence of *any* unknown truths—an implausibly idealist move. Crucially, the paradox does not merely falsify KP *simpliciter*; it forces anti-realists into a trilemma: abandon KP, deny that some truths are unknown (embrace omniscience), or reject classical logic/distribution principles. None are palatable, making this a *reductio* against the anti-realist package.  

  Anti-realists have proposed two main responses. First, **restriction strategies** (e.g., Tennant) limit KP to "cartesian" propositions—those for which Kp is not provably inconsistent (e.g., excluding *p ∧ ¬Kp*). While this blocks the derivation, it risks *ad hoc*ness. Why should epistemic constraint apply only to non-self-referential truths? If anti-realism grounds truth in knowability *generally*, restricting KP to conveniently avoid paradox undermines its motivation. Further, seemingly non-cartesian truths (e.g., "There are no epistemic agents") may still generate Fitch-like contradictions, suggesting the restriction is merely a technical fix, not a principled solution.  

  Second, adopting **intuitionistic logic** (e.g., Edgington) denies classical principles like double negation elimination. Here, Fitch’s derivation shows KP entails ¬¬∀p(p → Kp) but not ∀p(p → Kp), blocking omniscience. However, this retains ◊K(p ∧ ¬Kp) as a contradiction—so KP *still* implies the knowability of absurdity. Worse, intuitionism sacrifices classical reasoning for metaphysical reasons, which many anti-realists (e.g., Dummett) endorse but realists reject as question-begging. If anti-realism requires overhauling logic to survive, its dialectical force weakens.  

  A third response, inspired by Williamson, suggests the paradox reveals **propositions about ignorance** (e.g., *p ∧ ¬Kp*) are indeterminate or unformulable. Yet this concedes significant ground: if such propositions cannot be expressed, anti-realism cannot coherently assert that *all* truths are knowable, as the domain of "all truths" is now restricted.  

  Ultimately, Fitch’s paradox forces anti-realists to abandon the *unrestricted* KP. While restriction or logic revision may salvage a technical knowability principle, they compromise anti-realism’s spirit. Verificationism aims to tether truth to human inquiry, but Fitch shows that tether cannot be universal without collapsing into idealism. Anti-realists must either accept that some truths (e.g., pervasive ignorance claims) are verification-transcendent—contradicting their core thesis—or reframe KP as a normative ideal rather than a metaphysical constraint. The paradox thus reveals a tension between epistemic humility (we are not omniscient) and epistemic constraint (truth requires knowability), pushing anti-realism toward pragmatism or quietism about "hard-to-know" truths.  

  ---

  ### Marking Scheme  
  **First-Class Answer (70%+)**  
  - **A+ (80+):** Masterful integration of technical and philosophical dimensions. Explicitly frames the paradox as a *reductio* against anti-realism’s commitments (not just KP). Evaluates responses for *dialectical effectiveness* (e.g., "Does Tennant’s restriction preserve anti-realism’s motivation?"). Distinguishes between saving KP technically vs. preserving verificationism’s spirit. Flags why intuitionism may be coherent but costly.  
  - **A (70–79):** Clear explanation of why Fitch threatens anti-realism beyond KP’s falsity. Compares responses rigorously (e.g., "Restriction avoids contradiction but seems *ad hoc*"). Addresses whether anti-realism’s "spirit" survives. Minor omissions (e.g., not discussing Williamson).  

  **Upper Second-Class (60–69%)**  
  - **B (60–69):** Correctly explains the paradox and its threat to KP. Describes responses (restriction/logic revision) but with superficial evaluation (e.g., "Tennant solves it" without noting *ad hoc* concerns). May conflate KP with omniscience or miss that Fitch is a *reductio* (e.g., claims "KP is false"). Limited discussion of anti-realism’s broader crisis.  

  **Lower Second-Class (50–59%)**  
  - **C (50–59):** Basic recitation of Fitch’s derivation. Mentions KP’s incompatibility with unknown truths but doesn’t contextualize within anti-realism. Superficial or inaccurate coverage of responses (e.g., "Intuitionism works"). May confuse KP with ∀p(p → Kp).  

  **Fail (<50%)**  
  - Misstates the paradox (e.g., "Proves we can’t know anything"). Fails to define KP or the derivation. Ignores anti-realism entirely.  

  ---

  ### Common Errors (Flagged in Marking Notes)  
  1. **Confusing KP with omniscience:** Claiming "Fitch proves KP is false" misses that it’s a *reductio*: KP + non-omniscience → contradiction. Anti-realists must reject one.  
  2. **Oversimplifying responses:** E.g., "Tennant’s restriction works" without noting challenges to its principled basis.  
  3. **Ignoring anti-realism’s stakes:** Focusing solely on the logic without explaining *why* omniscience is problematic for anti-realists.  
  4. **Misapplying intuitionism:** Asserting that intuitionism "blocks the paradox" without acknowledging it still entails ◊K(contradiction).  

  ### Why This Works for Revision  
  This question forces you beyond derivation mechanics by demanding:  
  - **Interpretation:** Why is the paradox a crisis for anti-realism *specifically*?  
  - **Critical engagement:** Do the responses address the core problem or merely relocate it?  
  - **Metaphysical stakes:** Can verificationism survive without universal knowability?  
  The model answer shows how to weave technical details into philosophical argumentation, highlighting where anti-realism must concede ground (e.g., accepting "unknowable truths" like *p ∧ ¬Kp*). This mirrors your lecturer’s emphasis on Fitch as a tool to probe anti-realism’s limits.
