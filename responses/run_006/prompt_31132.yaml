  We are going to restate the logical induction framework in the vocabulary of online learning, regret bounds, and related concepts. Then we will provide a residue report.

  ## Restatement in Familiar Vocabulary

  Logical induction (LI) can be viewed as an online learning setting with the following characteristics:

  ### Setup
  1. **Time**: Discrete time steps `t=1,2,...,T,...` (potentially infinite).
  2. **Input Space**: The input space consists of logical sentences `φ` from a formal language (e.g., Peano Arithmetic). The set of sentences is fixed and known in advance, but the truth values of these sentences are not revealed until (possibly) much later, if at all. In fact, for undecidable sentences, the truth may never be revealed.

  3. **Prediction Task**: At each time `t`, the learner (the logical inductor) assigns a probability `P_t(φ)` to every sentence `φ` in the language. The goal is to have these probabilities reflect the actual truth (if the sentence is decidable) and to be "calibrated" in a logical sense.

  4. **Feedback**: Unlike standard online learning, the labels (truth values) are not revealed at the end of each round. Instead, the feedback is of two kinds:
     - **Logical Constraints**: The structure of the language and the axioms of the logical system impose constraints (e.g., if `φ` and `ψ` are equivalent, then `P_t(φ)` should equal `P_t(ψ)`; if `φ` implies `ψ`, then `P_t(φ) ≤ P_t(ψ)`; and for a tautology `⊤`, `P_t(⊤)=1`). These constraints are not given as data points but are inherent in the logical system.
     - **Proofs**: As time progresses, proofs of some sentences may be found (by a proof system that runs in time polynomial in `t`). If a proof of `φ` (or `¬φ`) is found by time `t`, then the truth value of `φ` is revealed and becomes known.

  5. **Adversaries/Environment**: The environment can be seen as adversarial in the sense that proofs may be found at arbitrary times and for arbitrary sentences. However, the logical constraints are fixed by the logical system.

  6. **Loss/Reward**: The logical inductor is evaluated by its ability to avoid being exploited by a set of "traders". These traders are polynomial-time algorithms that, at each time `t`, take the current set of prices (probabilities) and output a portfolio of "shares" in the sentences (i.e., they buy or sell contracts that pay $1 if the sentence is true and $0 otherwise). The traders are allowed to take into account the logical constraints and any proofs that have been found up to time `t`.

  ### Objective: No-Regret with Polynomial-Time Traders
  The key property of a logical inductor is that it is **unexploitable** by any polynomial-time trader. This means that no polynomial-time trader can make an infinite amount of money with bounded loss (i.e., without going into unbounded debt) by trading against the logical inductor.

  In the language of regret:
  - We can think of the trader's payoff at time `t` as the net gain from trading at time `t` and then holding until the end (when all sentences that are ever proved are settled). However, note that not all sentences are ever settled (because of undecidability). Therefore, the payoff for a trader is defined in terms of the eventual truth value of the sentences that are eventually decided (if they are decided).

  The logical inductor is said to satisfy the "logical induction criterion" if for every polynomial-time trader, the total money made by that trader against the logical inductor is bounded above (i.e., the trader does not get rich with certainty).

  This is similar to a **no-regret** condition in online learning, where regret is defined with respect to a class of experts (here, the traders). However, note the following differences:

  - The traders are not fixed experts but adaptive, polynomial-time algorithms that can adjust their strategy based on the history and the current prices.

  - The loss function is not the usual log loss or squared error, but a financial payoff that depends on the eventual truth values (if they become known) and the trading history.

  ### Calibration
  The logical inductor is also shown to be **calibrated** in a logical sense: for any efficiently computable subsequence of sentences that are grouped by the predicted probability, the empirical frequency of truth (when the truth is eventually known) should converge to the predicted probability. This is similar to the notion of calibration in forecasting.

  ### Bayesian Mixtures and Universal Portfolios
  The logical inductor construction has similarities to Bayesian mixtures and universal portfolios. In particular:
  - The logical inductor is constructed as a weighted average of a set of "expert" predictors (each of which is a trader that follows a particular strategy) and updates the weights based on the performance of the experts. This is analogous to the Bayesian mixture model or the Aggregating Algorithm in online learning.

  - The weights are updated using a market mechanism that resembles the universal portfolio algorithm (Cover's universal portfolio). The idea is to have a wealth-weighted combination of the traders.

  ### The Construction
  The standard logical inductor is built using a market of traders. At each time step:
  - The market maintains a wealth distribution over a set of traders (which are polynomial-time algorithms).
  - The current price for a sentence `φ` is set as the weighted average of the traders' demands for `φ` (weighted by their current wealth).
  - After the prices are set, the traders update their portfolios (buying and selling sentences) and then the truth values of any newly proven sentences are revealed. Traders that hold shares in a proven sentence have their wealth updated accordingly (they get paid for true sentences and lose the value for false ones).

  This is analogous to the weighted majority algorithm or the exponential weighting scheme, but in a continuous space and with a financial interpretation.

  ## Residue Report

  ### What Survived Cleanly
  1. **No-Regret**: The unexploitability condition is essentially a no-regret condition. The logical inductor is set up so that the regret (defined as the wealth gained by any trader) is bounded. Specifically, the regret with respect to any polynomial-time trader is bounded by a constant (which may depend on the trader) but does not grow without bound.

  2. **Calibration**: The calibration property in logical induction maps directly to the calibration concept in forecasting. The logical inductor is calibrated on efficiently computable subsequences.

  3. **Bayesian Mixtures and Universal Portfolios**: The construction of the logical inductor as a wealth-weighted average of traders is analogous to the universal portfolio algorithm and to Bayesian mixtures with a prior over experts. The update of weights based on performance (wealth) is standard.

  4. **Online Learning Framework**: The sequential nature and the requirement to perform well against an adversarial environment (where proofs can be found arbitrarily) fit the online learning paradigm.

  ### What Was Fudged
  1. **Feedback Timing and Nature**: In standard online learning, the label for a data point is revealed at the end of each round. In logical induction, the truth of a sentence may be revealed at an arbitrary later time (if at all). This requires a different handling of the feedback. We fudged this by saying that the feedback is the set of proofs that have been found by time `t`. However, the key point is that the logical inductor must assign probabilities even to sentences that may never be decided. This aspect is not present in standard online learning, where every label is eventually observed (or at least, the framework assumes that it will be).

  2. **Logical Constraints**: The logical constraints (like coherence requirements) are not explicitly part of the loss in standard online learning. In LI, these constraints are enforced by the market: if the prices are not coherent (e.g., if `P(φ) + P(¬φ) ≠ 1`), then a trader can exploit this by arbitrage. In standard online learning, we might enforce such constraints by the model (e.g., by using a probability simplex) but not by an explicit arbitrage condition.

  3. **Trader Class**: The class of adversaries (polynomial-time traders) is more specific and structured than the typical regret minimization setting. The polynomial-time constraint is crucial because without it, a trader could simulate the entire logical system and know the truth of every decidable sentence from the start.

  ### What Has No Counterpart
  1. **Logical Uncertainty**: The core challenge in logical induction is reasoning under logical uncertainty. In standard online learning, the uncertainty is typically about empirical data (which is noisy or incomplete). In LI, the uncertainty is about the deductive consequences of a fixed set of axioms. This is a fundamentally different kind of uncertainty because it is not stochastic but rather a consequence of computational limitations (we cannot deduce everything immediately). There is no direct counterpart to this in the standard online learning framework.

  2. **Undecidable Sentences**: The existence of undecidable sentences (which are never proved true or false) means that the logical inductor must assign probabilities that are not just about waiting for a label. The probabilities must be "reasonable" even when the label never arrives. In standard online learning, we typically assume that every label is eventually revealed (or at least, the losses are defined only on the revealed labels). This has no direct counterpart.

  3. **Inferential Step**: The logical inductor must not only learn from past proofs but also anticipate future proofs. This requires an element of logical reasoning that is not present in standard online learning. The traders are designed to exploit not only statistical patterns but also logical patterns (e.g., if `φ` and `ψ` are equivalent, but the prices are different, then a trader can buy the cheaper one and sell the more expensive one). This is a form of arbitrage that is unique to logical settings.

  ## Specific Answers to Your Questions

  ### Is unexploitability just a no-regret condition?
  Yes, essentially. The condition that no polynomial-time trader can exploit the logical inductor without bound is equivalent to bounded regret against the class of polynomial-time trading strategies. However, note that the regret is defined in terms of financial gains and not a standard loss function. Also, the trader's gain is not realized until the sentence is decided (if ever). This leads to a more complex accounting.

  ### Handling of Never-Revealed Truths
  Your framework (online learning, sequential prediction) typically assumes that the true labels are eventually revealed. In logical induction, many sentences may never have their truth revealed. This is a key difference. Your framework does not have a direct counterpart for this. The logical inductor must assign probabilities that are "logically coherent" even when the truth is undecidable. This is achieved by the requirement that the probabilities must satisfy the logical constraints (through the threat of arbitrage) and by the calibration property that applies only to the decidable sentences.

  In summary, the logical induction framework is a specialized form of online learning designed for a very particular setting (logical uncertainty) with unique challenges (undecidability, logical constraints). The core ideas of no-regret learning and calibration carry over, but the details of the feedback and the nature of the uncertainty are fundamentally different.
answer: |-
  Below, I'll restate logical induction (LI) in your vocabulary, then provide a residue report highlighting alignments, fudges, and gaps. The core analogy is **no-regret online learning with a computationally bounded adversary**, but key differences arise from logical constraints, undecidable truths, and the absence of empirical feedback.

  ---

  ### **Logical Induction Restated in Your Vocabulary**
  1. **Setup as Online Learning**:
     - **Time**: Discrete steps \(t = 1, 2, \dots\).
     - **Action Space**: At each \(t\), the learner (LI) outputs a probability assignment \(P_t(\phi) \in [0,1]\) for all sentences \(\phi\) in a logical language (e.g., Peano Arithmetic).
     - **"Labels" as Logical Truth**: The "true label" for \(\phi\) is \(1\) if \(\phi\) is provable, \(0\) if \(\neg\phi\) is provable. Crucially, these labels **may never be revealed** (if \(\phi\) is undecidable).
     - **Feedback**: Instead of labels, LI observes **proofs** generated by a fixed, efficient theorem prover. If a proof of \(\phi\) (or \(\neg\phi\)) is found by time \(t\), it's "revealed" at that step. Undecidable sentences never resolve.

  2. **Adversary as Traders**:
     - **Polynomial-Time (P.T.) Traders** are your **adaptive adversaries**. Each trader \(k\) is a P.T. algorithm that, at time \(t\):
       - Takes the history of prices \(P_1, \dots, P_t\) and previously proven sentences.
       - Outputs a "trading strategy": a portfolio \(T_{t,k}(\phi)\) specifying holdings (shares) in each sentence \(\phi\).
     - **Payoff**: If \(\phi\) is eventually proven true/false, the trader gains \(T_{t,k}(\phi) \cdot (1 - P_t(\phi))\) (if true) or \(T_{t,k}(\phi) \cdot (-P_t(\phi))\) (if false). If never proven, holdings yield \(0\).

  3. **Goal: No-Regret Against P.T. Traders**  
     LI seeks to be **unexploitable**: No P.T. trader achieves sublinear regret (i.e., \(\text{Regret}_T = \sum_{t=1}^T \text{Gain}_{t,k} - O(1)\)). Formally:
     \[
     \forall \text{ P.T. traders } k, \quad \lim_{T \to \infty} \frac{1}{T} \sum_{t=1}^T \text{Gain}_{t,k} \leq 0 \quad \text{(a.s.)}.
     \]
     This mirrors **no-regret learning** against an adversary class (here, P.T. traders).  
     - *Why P.T.?* Traders must not "know the future" (e.g., exploit undecidability); computational bounds enforce this.

  4. **Bayesian Mixtures for Weighting Experts**  
     LI is constructed via a **wealth-weighted ensemble** of traders:
     - Start with prior wealth over traders (e.g., uniform over P.T. strategies).
     - Update trader wealth via their trading gains (like Cover's **universal portfolio**).
     - Set \(P_t(\phi)\) as the **wealth-weighted demand** of traders for \(\phi\):  
       \[
       P_t(\phi) \propto \sum_{k} \text{Wealth}_{t,k} \cdot T_{t,k}(\phi).
       \]
     This is a **Bayesian mixture** with weights updated by "financial" likelihoods.

  5. **Calibration as Convergence of Frequencies**  
     LI guarantees **calibration**: For any P.T.-computable subsequence of sentences where \(P_t(\phi) \approx p\), the limiting frequency of truths is \(p\) (if resolved).  
     - Mirrors **calibration in forecasting** (e.g., Foster-Vohra).

  ---

  ### **Residue Report: What Survived, Fudged, and Missing**

  #### **What Survived Cleanly**
  1. **No-Regret ↔ Unexploitability**  
     Unexploitability is **exactly** a no-regret condition against P.T. traders. Traders are adversaries, gains are their rewards, and LI’s regret is bounded. The P.T. constraint is analogous to restricting adversaries to a "comparator class" in online learning (e.g., P.T. experts).

  2. **Bayesian Mixtures / Universal Portfolios ↔ LI Construction**  
     The wealth-weighted aggregation of traders is a direct analogue of Cover’s universal portfolio or a Bayesian mixture with sequential wealth updates. Traders are "experts," and LI blends their predictions via financial performance.

  3. **Calibration Property**  
     LI’s calibration theorem matches standard calibration in forecasting: predicted frequencies converge to empirical frequencies along efficient subsequences.

  #### **What Was Fudged**
  1. **The "Labels" Aren’t Labels**  
     In your framework, labels are **revealed instantly or eventually**. In LI, truths are **never revealed unless proven** (which may take arbitrarily long or never happen). We fudged by calling proofs "labels," but this obscures a key difference:  
     - **Fudge**: We treated proofs as "delayed labels," but undecidable sentences have **no label revelation at all**. Your setup assumes eventual feedback; LI does not.

  2. **Logical Constraints as Arbitrage**  
     Logical relationships (e.g., \(\phi \land \psi \implies \phi\)) enforce coherence via **no-arbitrage**:  
     - If \(P_t(\phi \land \psi) > P_t(\phi)\), a trader exploits this.  
     - **Fudge**: We mapped this to **constraints on the hypothesis space**, but it’s enforced dynamically by traders, not statically (e.g., via a simplex). This is closer to **online learning with linear constraints** (e.g., prediction with expert advice under constraints).

  3. **Traders as Adversaries with State**  
     Traders maintain internal state (e.g., open positions) across time. This resembles **stateful adversaries** in online learning (e.g., Zinkevich’s bandits), but LI traders are more structured.

  #### **What Has No Counterpart**
  1. **Logical Uncertainty Without Data**  
     LI assigns probabilities to sentences with **no empirical feedback** (e.g., "Goldbach’s conjecture is true"). Your framework assumes data-generating processes (e.g., i.i.d., adversarial labels); LI handles **deductive uncertainty** under bounded computation.  
     - **Gap**: Your tools (e.g., regret minimization) assume observable losses. LI’s "losses" are only defined if a proof exists, creating a **fundamental asymmetry**.

  2. **Undecidable Sentences**  
     For undecidable \(\phi\), \(P_t(\phi)\) **never settles** to 0 or 1. Your framework lacks tools for this:  
     - **Gap**: Regret requires a ground truth; LI handles **eternally uncertain** sentences via logical coherence (e.g., \(P_t(\phi) + P_t(\neg\phi) = 1\)) and unexploitability.

  3. **Logical Coherence via Dynamics**  
     LI enforces probabilistic coherence (e.g., additivity) **through trader interactions**, not by construction. Traders punish incoherent prices via arbitrage, making it an **emergent property**.  
     - **Gap**: Your tools (e.g., proper scoring rules) enforce coherence by design; LI achieves it via **market dynamics**.

  ---

  ### **Answers to Your Specific Queries**
  1. **Is unexploitability just no-regret?**  
     **Yes, but with caveats**:  
     - It *is* no-regret against P.T. traders (the regret bound is explicit in LI proofs).  
     - **Caveat 1**: Regret is defined only for sentences that resolve. Traders can’t exploit undecidables, as their gains vanish.  
     - **Caveat 2**: The P.T. constraint is critical. Unbounded traders could exploit open problems by "knowing" their undecidability (e.g., shorting \(\phi\) forever if \(\phi\) is undecidable). P.T. prevents this.  

  2. **Handling never-revealed truths**  
     **Your framework has no direct counterpart**, and this is LI’s novelty:  
     - **No feedback**: For undecidables, there is no label to learn from. LI avoids arbitrage by ensuring \(P_t(\phi)\) is "logically consistent" (e.g., respecting provable implications) and calibrated on *decidable* subsequences.  
     - **Tool gap**: Bayesian mixtures/universal portfolios assume eventual feedback; LI’s mixture weights evolve even without resolution.  
     - **Key insight**: LI treats logical uncertainty as **time-limited computation** (traders can’t disprove \(\phi\) in poly(\(t\)) steps), not as Bayesian uncertainty.

  ---

  ### **Conclusion**
  Logical induction is **no-regret online learning with specialized constraints**:  
  - **Faithful analogies**: Unexploitability = no-regret vs. P.T. traders, wealth mixtures = universal portfolios, calibration = forecasting calibration.  
  - **Fudges**: "Proofs as labels" understates the lack of feedback; logical constraints as arbitrage simplifies their dynamic enforcement.  
  - **Unique to LI**: Handling undecidable sentences + logical coherence via market dynamics.  

  Your hunch is mostly right—LI *is* online learning over a weird space—but its treatment of **logical uncertainty without data** and **undecidability** is novel. If you work on **learning with delayed/no feedback** or **constraint enforcement via adversaries**, LI offers tools. If not, it’s likely orthogonal.  

  For deeper alignment, see Garrabrant et al.’s [original paper](https://arxiv.org/abs/1609.03543) (§5 interprets LI as no-regret). Criticism? The P.T. assumption feels ad hoc; some argue it’s a placeholder for "plausible" computation.
