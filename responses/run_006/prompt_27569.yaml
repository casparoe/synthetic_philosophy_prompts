  Hmm... the core vulnerability seems to be whether lexical thresholds can exist at all without collapsing into absurdity. If that fails, the whole framework crumbles. That's definitely priority #1 - the metaphysical coherence question. Arguments like the "continuum problem" (can suffering intensity really have discontinuous jumps?) might sink LTNU before we even get to practical concerns.

  Next would be aggregation - how thresholds interact with population ethics. The "one vs million" paradox exposes whether LTNU truly has lexical priority or just strong weighting. This could force revisions to the core mechanism. It's more actionable than metaphysics too, with precedents from deontological ethics to build on.

  Threshold location comes third. While user worries about arbitrariness, I suspect this is downstream - if we solve coherence and aggregation, we can tolerate vague thresholds (like "torture" as a category). We might borrow from pain science or human rights frameworks to anchor it roughly.

  Fourth would be decision-theoretic fanaticism. Those astronomically small probabilities swamping everything might make LTNU unpalatable, but perhaps fixable with probability caps or lexical tiers. Less catastrophic than the first two issues collapsing the theory entirely.

  The user seems analytically sharp - they've identified key tensions but might undervalue the foundational metaphysics. Their focus on action-guidance suggests they want practical relevance, so I should emphasize how solving #1 enables the rest.

  For shifting rankings: New neuroscience showing discontinuous pain processing could boost threshold location's importance. If effective altruism develops new aggregation models, that could elevate the person-aggregation problem. And if longtermism gains traction, fanaticism arguments might become more urgent.

