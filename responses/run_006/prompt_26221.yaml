answer: |-
  Your intuitions about the cases highlight a key distinction: the surprise exam paradox arises under conditions of **certainty and logical omniscience** but dissolves when there is **uncertainty, redefinition of surprise, or insufficient structure for backward induction**. The principle separating the paradoxical cases (A, B, F) from the non-paradoxical ones (C, E, G) is whether the setup allows for a **self-defeating backward induction that eliminates all possible exam days under the assumptions of absolute certainty in the announcement and perfect reasoning, with surprise defined as the inability to deduce the exam day before it occurs**. Here's how this principle handles each case:

  - **Case A (classic)**: Paradoxical. The announcement is believed with certainty, surprise is defined as no deduction before the exam, and multiple days enable backward induction. The induction appears valid but fails because it ignores that the reasoning itself prevents the knowledge it assumes (e.g., if the exam is on Wednesday, the student disbelieves the announcement and thus doesn't deduce it).
  - **Case B (two-day)**: Paradoxical. Same as A: certainty, surprise definition, and backward induction apply (eliminating Tuesday then Monday). The flaw is that the elimination of Tuesday depends on counterfactual knowledge on Monday night, which isn't actualized if the exam is on Monday, but the induction still seems airtight under certainty.
  - **Case C (one-day)**: Not paradoxical. Lacks multiple days for backward induction. The student's reasoning is self-undermining but not paradoxical because it relies on a faulty one-step deduction (believing the announcement leads to disbelief, allowing surprise).
  - **Case D (self-referential)**: Not the surprise exam paradox. Involves provability in a formal system (Gödelian issues), not the epistemic conditions of surprise and certainty that define the classic paradox.
  - **Case E (teacher lies)**: Not paradoxical. Uncertainty about the announcement's truth (20% lie rate) prevents backward induction from starting, as the student cannot be certain of deducing the day even if prior days pass without an exam.
  - **Case F (multiple exams)**: Paradoxical. Similar to A: certainty and surprise definition enable backward induction for the last exam (eliminating days step-by-step), creating the same self-defeating loop despite the added complexity.
  - **Case G (surprise means "won't know the night before")**: Not paradoxical. The surprise definition changes to focus only on the night before, not deduction before the exam day. This breaks the backward induction because the student cannot eliminate Friday (or other days) in advance—deduction might occur on the morning of the exam, preserving surprise.

  **Principle applied to Case H (announcement by a student)**: The announcement is not believed with absolute certainty (90% reliability), so the paradox does not arise. The exam can be surprising because uncertainty prevents backward induction—e.g., on Tuesday night, the student might doubt the announcement, so they don't know Wednesday is the exam day. The announcement is true if the exam occurs and is unexpected, which it is due to the reliability gap. Your wobble likely stems from the high reliability (90%), but any uncertainty (even 10% doubt) breaks the certainty required for the paradox. To settle it decisively: if the student were 100% reliable, it would be paradoxical like A, but with less than 100%, it is not.

  **Verdicts you must overturn**: None. Your judgments align with the principle: A, B, and F are paradoxical under certainty, while C, E, and G lack essential elements (multiple days, certainty, or surprise definition). Case D is correctly set aside.

  **Final one-sentence principle**:
  \answer{The paradox arises when, under absolute certainty in the announcement and perfect reasoning, surprise is defined as undeducibility before the exam day, enabling a self-defeating backward induction that eliminates all possible exam days.}
