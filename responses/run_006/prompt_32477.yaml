prompt: |-
  You are an expert epistemologist specializing in the dogmatism paradox and the epistemology of disagreement. Please think carefully and work through the cases systematically before settling on a principle.

  I'm a PhD student in epistemology, and I've been trying to work out what I actually think about the dogmatism paradox by going case by case rather than starting from a principle. The paradox, roughly, is that if you know that p, then you seem entitled to dismiss any counterevidence as misleading — since you know p is true, evidence against it must be misleading — but that licenses a kind of intellectual rigidity that feels wrong in many cases. I want to know whether there's a single principle that captures when knowledge does and doesn't permit dismissing counterevidence.

  Here are my verdicts on a set of cases. In each case, I start out knowing the proposition, and then encounter counterevidence.

  1. I know that 2+2=4. A stranger on the internet sends me a twenty-page document they claim is a proof that 2+2=5. Verdict: I can dismiss it without reading the document. I don't need to find the error.

  2. I've just come inside and I know it's raining — I'm soaking wet, I heard the downpour seconds ago. My spouse, who is looking out the window, says "It stopped raining about ten minutes ago." Verdict: I should at least look out the window myself. I can't just dismiss it.

  3. I know the defendant is guilty because I saw him commit the assault with my own eyes, in good lighting, from about fifteen feet away, and I wasn't drinking. At trial, ten witnesses I have no reason to distrust testify under oath that the defendant was at a bar across town at the time. Verdict: I should seriously reconsider. I can't dismiss their testimony.

  4. I know that vaccines don't cause autism, based on the overwhelming epidemiological evidence and scientific consensus. A new meta-analysis is published in a top-tier medical journal, by authors with no known anti-vaccine affiliations, claiming to find a statistically significant link. Verdict: I should read the study carefully. Dismissing it out of hand would be unreasonable.

  5. I know my partner is faithful to me, based on years of shared life, deep trust, and nothing ever suggesting otherwise. I happen to see a text notification on their phone from an unsaved number: "Last night was amazing. Can't wait to see you again." Verdict: I should investigate, not dismiss it. Something might be going on.

  6. I've constructed a proof of a nontrivial theorem, checked it carefully over several days, and had it accepted by a journal. I know the theorem is true. A colleague whose mathematical judgment I respect tells me she thinks she's found a subtle error in the proof. Verdict: I should go back and re-check the proof. I can't dismiss her concern.

  7. I know I left my keys on the kitchen table — I have a vivid memory of placing them there ten minutes ago, and I wasn't distracted. I walk into the kitchen and they're not on the table. Verdict: I should conclude I was wrong about where I left them, not dismiss the empty table as misleading evidence.

  Is there a principle that captures all seven of these verdicts? If not, which verdicts would I have to overturn, and what's the best principle that captures the rest? I'm especially interested in what distinguishes case 1 from case 6 — both involve mathematical or proof-based knowledge, but in one case dismissing feels fine and in the other it doesn't.

  Also, say what your principle predicts about a case I haven't listed: I know that the café on the corner closes at 3pm on Sundays because I checked the hours online this morning. When I arrive at 2:30, the door is locked and the lights are off. Should I dismiss the locked door as misleading, or conclude I was wrong?

  End your response with a one-sentence summary of your proposed principle as the very last line.
reasoning: |-
  Hmm, the user is a PhD student in epistemology grappling with the dogmatism paradox. They've presented seven carefully constructed cases where they start with knowledge and encounter counterevidence, along with their intuitive verdicts about whether dismissal is permissible. Their core challenge is to find a unifying principle that explains all these verdicts or determine which intuitions need revision.

  Looking at their cases, I notice several patterns. Cases like the 2+2=5 document (1) and the vaccine meta-analysis (4) both involve abstract or scientific knowledge, yet they yield different verdicts. The mathematical proof case (6) where reconsideration is required seems closer to the spouse's rain report (2) or the keys disappearance (7) in terms of urgency. The courtroom scenario (3) and relationship text (5) both involve high-stakes social evidence that demands investigation.

  What's particularly interesting is their observation about cases 1 vs 6 - both mathematical but different dismissal permissions. The key difference appears to be the source's credibility and the nature of the evidence. The stranger's unsolicited "proof" lacks credibility, while the respected colleague's concern carries weight. Also, complex proofs contain more potential error points than basic arithmetic.

  For the café case they proposed: knowing closing times from a website versus seeing a locked door during operating hours. Their principle should explain why the direct sensory evidence (locked door) should override the prior online knowledge, similar to the keys case (7). The website could have been wrong or outdated, while the locked door is immediate counterevidence.

  The unifying principle seems to involve multiple dimensions: epistemic vulnerability of the belief, credibility of the counterevidence source, stakes of being wrong, and availability of error explanations. High-stakes beliefs with credible counterevidence demand reconsideration, while foundational or low-stakes knowledge with dubious counterevidence permits dismissal. The colleague's mathematical concern (6) is credible and the proof is complex, whereas the stranger's 2+2=5 claim (1) lacks credibility and challenges basic math.

  I'll formulate a principle that balances these factors while preserving most of their intuitions. The café case should clearly require belief revision - the locked door provides strong direct evidence that overrides the website information, especially since businesses change hours frequently. This aligns with their verdict in the keys case (7).
answer: |-
  Based on your carefully considered case intuitions, a single principle emerges that captures all seven verdicts while respecting the core tension in the dogmatism paradox. The key lies in differentiating between the *epistemic security* of your knowledge and the *credible challenge* presented by the counterevidence.

  **The Proposed Principle:**

  **Knowledge permits dismissing counterevidence without detailed engagement only when the belief is maximally epistemically secure *and* the challenge lacks credible standing relative to the context (source, method, or evidence type). When a belief is vulnerable to plausible error modes or the challenge has credible standing (even if likely mistaken), knowledge requires serious engagement or revision.**

  **Breakdown of the Principle:**

  1.  **Maximal Epistemic Security:** Beliefs immune to normal error possibilities, either because they are foundational (like basic logic/math - Case 1) or based on overwhelmingly robust consensus/replication (like vaccines not causing autism - but note the verdict in Case 4 differs because the challenge *has* credible standing).
  2.  **Lacks Credible Standing:** Counterevidence originating from sources lacking relevant expertise or reliability, using flawed methods, or presented without any claim to legitimacy or peer review (e.g., a random internet stranger - Case 1).
  3.  **Vulnerable to Plausible Error Modes:** Beliefs where, despite high justification, common human cognitive failures (perception, memory, inference) are plausible explanations for error (Cases 2, 3, 5, 6, 7).
  4.  **Has Credible Standing:** Counterevidence originating from sources with relevant expertise/reliability (spouse, respected colleague, unbiased researchers in a top journal, multiple sworn witnesses) or evidence types that are directly relevant and prima facie reliable (sensory evidence like an empty table or locked door). This *doesn't* mean the challenge is *correct*, but it *does* mean it cannot be dismissed *a priori* without engagement, even if you know P.

  **Application to Your Cases:**

  1.  **2+2=4:** **Dismissal Permitted.** Belief is maximally secure (foundational math). Challenge lacks credible standing (random internet document). *Principle: Max security + low credibility challenge.*
  2.  **Raining (Spouse):** **Engagement Required.** Belief is *not* maximally secure (recent perception/memory vulnerable). Challenge has high credible standing (trusted spouse's current perception). *Principle: Vulnerability + high credibility challenge.*
  3.  **Guilty Defendant:** **Reconsideration Required.** Belief is vulnerable (perception/memory, even if good). Challenge has extremely high credible standing (multiple unbiased sworn witnesses). *Principle: Vulnerability + very high credibility challenge.*
  4.  **Vaccines/Autism:** **Engagement Required.** Belief is highly secure (overwhelming consensus), BUT the challenge has significant credible standing (top journal, reputable authors). This credible standing, even if the study is ultimately flawed, mandates engagement. *Principle: High security, BUT challenge has credible standing.*
  5.  **Partner Faithful:** **Investigation Required.** Belief is vulnerable (trust based on experience is fallible). Challenge has credible standing (direct sensory evidence - the text - that demands an explanation). *Principle: Vulnerability + credible evidence.*
  6.  **Mathematical Proof:** **Re-check Required.** Belief is vulnerable (complex proofs are susceptible to subtle errors, even after checking/publishing). Challenge has high credible standing (respected colleague). *Principle: Vulnerability + high credibility challenge.*
  7.  **Keys on Table:** **Revision Required.** Belief is highly vulnerable (memory, even vivid, is fallible). Challenge has maximal credible standing (direct, current sensory evidence contradicting the belief). *Principle: High vulnerability + maximal credibility challenge.*

  **Distinguishing Case 1 (2+2) from Case 6 (Proof):**

  *   **Case 1 (2+2):** The belief is *maximally secure* (foundational, immune to normal error). The challenge *lacks credible standing* (source unknown/unreliable, method/content prima facie absurd). Dismissal is fine.
  *   **Case 6 (Proof):** The belief is *vulnerable* (complex proofs involve chains of reasoning susceptible to subtle errors). The challenge *has credible standing* (source is a trusted expert colleague). Engagement is required. The key difference is the **epistemic vulnerability** of the belief itself and the **credibility of the challenger**.

  **The Café Case Prediction:**

  *   **Scenario:** You know the café closes at 3pm (online hours checked today). You arrive at 2:30pm to a locked door/lights off.
  *   **Principle Prediction:** **You should conclude you were wrong.** Your belief, while justified (recent online check), is *vulnerable* (websites can be wrong/outdated, your memory/reading of the time could be faulty). The counterevidence (locked door/lights off during supposed operating hours) has *maximal credible standing* (direct, current sensory evidence). This mirrors Case 7 (Keys). The sensory evidence trumps the prior belief based on a fallible source (website/memory) in this context.
  *   **Verdict:** Revision required. Dismissal is unreasonable.

  **Conclusion:**

  Your intuitions across diverse cases are consistent with a principle prioritizing the interplay between the belief's inherent security/vulnerability and the contextual credibility of the challenge, rather than knowledge alone licensing blanket dismissal; **knowledge justifies dismissing counterevidence only if the belief is maximally secure and the challenge completely lacks credible standing, otherwise engagement or revision is required.**
