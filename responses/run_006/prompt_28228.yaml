  The user specifies five pressure points they want covered: the argument from language overgeneralizing to human infants, the empirical weakness of his behavioral flexibility claims, the moral implications of denying animal suffering, theological motivations, and whether dualism necessarily leads to denying animal minds. They also want wildcard questions.

