  I'm a phil of mind grad student and this is the one I keep flip-flopping on, so I want to force a number out of it. Take illusionism about phenomenal consciousness — roughly, the view that there are no phenomenal properties at all, and the whole sense that there is something it is like to see red or feel pain is an introspective illusion produced by our access mechanisms. I definately don't want a survey of the debate; I want your actual credence that this is right, decomposed so I can see which part is doing the work. Give it to me as exactly five numbered items, each a sentence or two, with no introduction or conclusion. Item 1: your bottom-line credence that illusionism is true. Item 2: your probability that the explanatory gap (the hard problem) reflects a real metaphysical gap rather than an artifact of how our cognitive access to our own states works, with one line of reasoning. Item 3: conditional on its being an artifact, your probability that illusionism's specific error theory of introspection is right rather than some neighboring deflationary view. Item 4: your probability that illusionism can explain why the illusion is so stubborn and fine-grained without sneaking in the very phenomenal properties it's trying to deny. Item 5: how you combined 2 through 4 into 1, which of the three terms your number is most sensitive to, and what evidence or argument would move that term most. No citations, just the reasoning with the weak points marked.
