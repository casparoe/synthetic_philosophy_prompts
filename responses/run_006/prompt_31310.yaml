  **4. Probability illusionism explains stubborn/fine-grained illusion without smuggling phenomenality:** **30%**  
  *Reasoning:* Accounting for the vivid, persistent *seeming* of raw feels likely requires positing quasi-phenomenal properties in access mechanisms, undermining strict illusionism. *(Weak point: Core challenge for illusionism.)*

