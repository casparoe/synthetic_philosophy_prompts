  Are they missing anything? Maybe the technical challenges. For intent alignment, issues like specification gaming or reward hacking are examples. For value alignment, there's debate on whether we can define a coherent objective function. Also, the societal aspects: who decides the values? Governance and multi-stakeholder input are key here.

