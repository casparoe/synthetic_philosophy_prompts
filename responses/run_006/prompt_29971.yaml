  Okay, the user is describing a fascinating moral phenomenon they've observed. They've noticed how someone who consistently goes above and beyond in their duties—like a friend always bringing food when someone's sick or a coworker fixing others' mistakes—eventually has their extra efforts taken for granted. What starts as generosity becomes an expectation, and when they stop or scale back, people get resentful. The user is curious if this has a name in moral philosophy or psychology.

  First, I need to recall related concepts. Supererogation refers to actions beyond duty, but here the key is how these acts create person-specific obligations. The resentment when the person stops is crucial. The user mentioned that this expectation doesn't generalize to others; it's tied only to that individual. So, it's not a shifted norm but a personalized one.

  Looking into moral psychology, there's the concept of "metaphysical guilt" or "role captivity," but those might not fit perfectly. The Stanford Encyclopedia of Philosophy discusses supererogation and how repeated acts can blur into duties. Then there's Heyd's idea of supererogation where acts are praiseworthy but not required. But the resentment part is key here—why do people feel wronged when the extra help stops?

  The user wants to distinguish this from role obligations, promises, or baseline shifts. Role obligations are formal, promises are explicit, but here it's implicit. Baseline shift might explain norm changes, but the user says the norm doesn't change for everyone—only for that one person. So it's asymmetric. 

  Reliance theory comes to mind. If people depend on someone's actions, stopping could cause harm, leading to resentment. But reliance alone doesn't capture the moral obligation felt. Maybe "acquired obligation" or "customary obligation"? But the user wants to isolate the process, not just the label.

  Also, moral licensing or expectation escalation in psychology—people start expecting more over time. But the person-specific aspect is critical. The resentment might stem from perceived inconsistency, as per the expectation-confirmation theory. If someone sets a pattern, deviating is seen as a letdown.

  The boundaries: it's not about initial praise turning to resentment (moral resentment), but the creation of a duty specific to one person. The asymmetry is key—new members aren't expected to do the same. So it's precedent-based reliance, creating a "moral lock-in" for the individual.

  The user's deeper need might be understanding why this happens and how to prevent it, or to validate their observation with academic concepts. They might be seeking frameworks to address this in personal or professional contexts. Ensuring the explanation clarifies the mechanisms—reliance, precedent, asymmetric obligation—without conflating with adjacent concepts will meet their needs.
answer: |-
  This phenomenon you've described is incredibly astute and captures a nuanced, frustrating dynamic in social and moral psychology. While there isn't a single, universally accepted term for *exactly* this specific constellation of factors, it sits at the intersection of several well-studied concepts. We can definitely carve it out and give it a descriptive label based on its core mechanisms.

  **Core Components of Your Phenomenon:**

  1.  **Repeated Supererogation:** The agent consistently performs actions that are morally praiseworthy but not obligatory (beyond the call of duty).
  2.  **Reliance:** Others in the group come to depend on this pattern of behavior.
  3.  **Expectation Formation:** The consistent behavior creates an *asymmetric, person-specific expectation* that *this particular individual* will continue the behavior. Crucially, this expectation is *not* generalized to become a group norm applicable to everyone.
  4.  **Resentment upon Cessation/Reduction:** When the individual stops or reduces the behavior, others feel genuinely wronged and resentful, as if a duty has been violated, despite the behavior never being obligatory initially.
  5.  **Asymmetry:** The obligation is uniquely tied to the *individual* who established the precedent, not the *role* or the *group norm*. New members are not expected to perform the action.

  **Carving it Out from Adjacent Concepts:**

  *   **Role Obligations:** This isn't a formal or socially defined role (e.g., "mother," "team lead"). The "duty" arises *solely* from the individual's past actions, not a predefined position. If it were a role, new people occupying a similar position would be expected to do it – but they aren't.
  *   **Promissory Obligation:** No explicit promise was made. The obligation arises implicitly from the pattern of behavior and the reliance it fostered.
  *   **Baseline Shift (for the Group Norm):** You rightly note this isn't a shift in the *general* baseline for everyone. The group doesn't now believe *everyone* must bring food to the sick; they only believe *this specific person* must. The baseline shifts only for the *relationship* between the group and this individual.
  *   **Moral Licensing/Bolstering:** While the supererogator might initially gain social credit or "license," the phenomenon you describe is about the *external* expectation placed upon them by *others*, not their own internal justification for future actions.
  *   **Resentment of Saints:** The resentment of moral saints is often rooted in discomfort, guilt, or feeling judged. Here, the resentment is specifically tied to the *withdrawal* of a relied-upon benefit, framed as a *failure* or *betrayal*. It's more transactional and reliance-based than existential discomfort.
  *   **Simple Ingratitude:** It's more than just taking someone for granted. It involves the *moralization* of the withdrawal – the feeling that the person is now *doing something wrong* by stopping, violating an implicit contract.

  **The Core Mechanism: Precedent + Reliance = Acquired Asymmetric Obligation**

  The phenomenon hinges on two key psychological processes:

  1.  **Precedent as Norm-Creating (for the Individual):** Humans are pattern-seeking and rely heavily on past behavior to predict future behavior. Consistent supererogation sets a powerful precedent. Others unconsciously interpret this pattern not just as "what this person *does*," but increasingly as "what this person *is supposed to do*." Their behavior becomes part of the perceived social fabric *specifically involving them*.
  2.  **Reliance as Creating Vulnerability:** By consistently providing the benefit, others incorporate it into their expectations and plans. They come to *rely* on it. This reliance creates a vulnerability. When the benefit is withdrawn, they experience a loss (of convenience, support, effort saved) that feels like harm *caused by* the supererogator's change in behavior.
  3.  **Moralization of the Withdrawal:** Due to the precedent and reliance, the withdrawal isn't seen as simply stopping a favor; it's seen as violating an implicit agreement, failing a duty *they created for themselves* through their past actions. The resentment stems from this perceived violation and the experienced harm/loss due to reliance.

  **Proposed Names & Related Concepts:**

  *   **Acquired Asymmetric Obligation:** This emphasizes that the obligation is *gained* through repeated action and applies *only* to that specific person.
  *   **Customary Obligation (Individual-Specific):** Highlights that the "duty" arises from custom/habit established by the individual themselves.
  *   **Precedent-Based Reliance Entitlement:** Focuses on the reliance created by precedent leading to a sense of entitlement in others.
  *   **Moral Lock-In:** Suggests the individual becomes trapped by their own past generosity, creating an inescapable expectation.
  *   **The Supererogation Trap:** Emphasizes how the initial virtue creates the conditions for later resentment.

  **Where it Appears in Literature (Conceptually Adjacent):**

  *   **Supererogation & "Slippery Slope":** Discussions of supererogation often warn that *frequent* performance of supererogatory acts can blur the line and make them seem obligatory *for that agent* (e.g., Heyd, Urmson). Your example is a specific social instantiation of this slippery slope, driven by reliance.
  *   **Reliance Theory (in Ethics/Law):** Theories emphasizing how one party's reasonable reliance on another's conduct can create obligations (like promissory estoppel in law). This directly maps to the reliance component of your phenomenon.
  *   **Expectation-Confirmation Theory (Psychology):** People form expectations based on past performance. Negative disconfirmation (performance worse than expectation) leads to dissatisfaction/resentment. Here, the expectation is morally loaded.
  *   **Norm Internalization & Personal Norms:** While not a group norm, the individual's behavior might lead others to internalize a *personal norm* for *that specific individual* ("*X* always does Y, so *X* *should* do Y").
  *   **Psychological Contracts:** In organizational psychology, the "psychological contract" refers to unwritten, implicit expectations between employees and employers. Violation leads to resentment. Your phenomenon describes a specific type of psychological contract formed through unilateral supererogatory action, creating an asymmetric expectation.

  **Boundaries of the Phenomenon:**

  *   **Requires Repetition:** A single supererogatory act rarely creates this level of expectation and resentment upon cessation.
  *   **Requires Reliance:** If the acts weren't actually relied upon (e.g., nice but unnecessary gestures), stopping wouldn't cause resentment based on perceived obligation.
  *   **Requires Asymmetry:** The key differentiator is that the expectation *does not generalize*. If it becomes a group norm ("now *everyone* should bring food"), it's a different phenomenon (baseline shift/norm evolution).
  *   **Distinct from Exploitation:** While it can feel exploitative, the resentment arises from a genuine (though misplaced) sense of violated obligation, not necessarily conscious taking-advantage (though that can co-occur).
  *   **Not Just Habit:** While habit plays a role, the critical element is the *moralization* of the withdrawal – the feeling of being wronged.

  **In essence, you've pinpointed the process by which an individual's consistent generosity inadvertently creates a unique, personalized moral prison for themselves through the mechanisms of precedent-setting and induced reliance, leading to resentment when they seek parole.** It's a powerful example of how good intentions and virtuous behavior can paradoxically generate negative social consequences through the dynamics of expectation and dependence. While lacking a single perfect label, "Acquired Asymmetric Obligation" or "The Supererogation Trap" effectively captures its core.
