  ### Composition Question Decision Tree  
  Answer the questions based solely on your intuitive judgments about the concrete cases described. Do not rely on philosophical labels or theories.  

  #### Q1: Is there any composite object at all?  
  *Example:* A living cat seems to have parts (paws, tail, atoms). Is there a single composite object—*the cat*—over and above those parts?  
  - **No** → **Nihilism**  
    *Awkward commitment: A "cat" is just particles arranged in a cat-shaped configuration; no tables, mountains, or organisms truly exist.*  
  - **Yes** → Proceed to Q2.  

  #### Q2: Is there a composite object consisting of the Eiffel Tower and the Great Pyramid of Giza?  
  *Clarify:* This object includes only the Tower and Pyramid (no air, soil, or other parts). They are 2,500 km apart.  
  - **Yes** → **Universalism**  
    *Awkward commitment: Every arbitrary collection composes an object—e.g., your left shoe and the Moon form a "shoe-Moon" object.*  
  - **No** → Proceed to Q3.  

  #### Q3: Is a heap of 1,000 sand grains a composite object?  
  *Clarify:* The heap is stable, and grains touch each other.  
  - **Yes** → Proceed to Q4.  
  - **No** → Proceed to Q7.  

  #### Q4: Is there a composite object consisting of two people holding hands?  
  *Clarify:* They clasp hands firmly but could let go instantly. No other connection exists.  
  - **Yes** → **Contact View**  
    *Awkward commitment: In a series where two objects are moved apart millimeter by millimeter, composition stops at an arbitrary point (e.g., 0.7mm apart = yes, 0.8mm apart = no).*  
  - **No** → Proceed to Q5.  

  #### Q5: Is there a composite object if the two people are handcuffed together?  
  *Clarify:* They are mechanically fastened and cannot separate.  
  - **Yes** → **Fastening View**  
    *Awkward commitment: Two planks compose an object when bolted together, but not when leaning against each other—even if equally stable.*  
  - **No** → **Unnamed Moderate View 1**  
    *Status: Unexplored. Accepts heaps and cats but rejects all multi-person objects (even handcuffed pairs).*  

  #### Q7: Is a water molecule (H₂O) a composite object?  
  *Clarify:* It consists of two hydrogen atoms bonded to one oxygen atom.  
  - **Yes** → **Unnamed Moderate View 2**  
    *Status: Unattractive. Accepts fundamental particles and bonded molecules (like H₂O) but rejects heaps and cats—making cats "vanish" despite appearing solid.*  
  - **No** → Proceed to Q8.  

  #### Q8: Is a severed hand a composite object?  
  *Clarify:* The hand is detached from a body, intact, and lying on a table.  
  - **Yes** → **Unnamed Moderate View 3**  
    *Status: Unexplored. Accepts cats and severed hands (as "dead organisms") but rejects heaps and molecules.*  
  - **No** → Proceed to Q9.  

  #### Q9: Is there a composite object consisting of two people holding hands?  
  *Clarify:* Same as Q4.  
  - **Yes** → **Unnamed Moderate View 4**  
    *Status: Unexplored. Accepts cats and "holding-hands objects" but rejects heaps, molecules, and severed hands.*  
  - **No** → **Organicism**  
    *Awkward commitment: A cat ceases to exist when it dies (its parts no longer function organically), and a severed hand is just particles arranged hand-wise.*  

  ---

  ### Notes on the Tree  
  1. **Unoccupied Combinations**  
     - *Q5→No, Q7→Yes, Q8→Yes, etc.*: Most unnamed views are **unexplored** but not incoherent.  
     - *Q7→Yes* (accepts molecules but not heaps): **Unattractive** due to implausible rejection of ordinary objects like cats.  

  2. **Indistinguishable Leaves**  
     - **Organicism** and **Unnamed Moderate View 3** (severing-accepting) both reject heaps, molecules, and hand-holding pairs.  
       *Test case to separate them:* A living tree branch severed but kept alive in a lab.  
       - Organicism: Rejects it (not a whole organism).  
       - Unnamed View 3: Accepts it (as a "living fragment").  

  3. **Gradual Series Highlighted**  
     - Contact View (Q4) requires a sharp cutoff in a series of objects moved apart incrementally (e.g., 1mm → 10m).  
     - Organicism (Q9) requires a sharp cutoff in a life/death series (e.g., a cat euthanized by gradual toxin injection).  

  This tree isolates commitments through cases alone, forcing confrontation with trade-offs in each view.
