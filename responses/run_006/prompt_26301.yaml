prompt: |-
  ok so I've been reading about David Lewis's account of convention and I'm stuck on something. The way I understand it, a convention is basically just one equilibrium among many in a coordination game — like driving on the right vs. the left, neither is better, it's just arbitrary which one we settled on. But if that's the model for how all conventions and social norms work, then doesn't that mean norms are ultimately arbitrary and there's no actual reason to follow them? Like, if we'd happened to settle on a different equilibrium, we'd take *that* as normative instead. So isn't the whole idea of norms having genuine force just an illusion — we're basically just conforming to whatever accident of history we happened to land on and then rationalizing it after the fact?
reasoning: |-
  Okay, let me unpack this user's query about David Lewis and conventions. They're grappling with the arbitrariness of norms. They understand that conventions are equilibria in coordination games, like driving on the left or right. But their main concern is whether this makes norms arbitrary, stripping them of any real normative force. They're worried it's all just historical accidents rationalized after the fact.

  First, I need to recall Lewis's theory accurately. Conventions solve coordination problems where multiple equilibria exist, and the key is mutual expectations. The user correctly identifies the arbitrariness—either driving side works as long as everyone agrees. But their deeper question is about normativity. If it's arbitrary, why should we follow norms?

  The user might be studying philosophy, possibly a grad student or an advanced undergrad. They've read Lewis but hit a conceptual wall. Their frustration suggests they're looking for a way to reconcile the arbitrariness with the perceived obligation of norms. They might feel that if norms are just accidents, moral realism or the force of social rules collapses. I should address that concern without oversimplifying.

  Breaking down the issues: First, the coordination problem structure. Lewis uses game theory, so conventions are Nash equilibria. The arbitrary nature is inherent—any equilibrium works if everyone follows it. But the user is missing why we still feel compelled. Key points here: the actual norm isn't special, but deviation causes coordination failure, which has real costs. So the force comes from avoiding those costs, not the norm's intrinsic value.

  Next, the role of expectations. Lewis emphasizes mutual expectations and common knowledge. When everyone expects you to drive on the right, deviating isn't just breaking a rule—it's disrupting a system everyone relies on. That interdependence creates the "should." The user might not have connected how expectations transform arbitrariness into obligation.

  Then, normativity versus arbitrariness. The user conflates arbitrariness in origin with lack of justification. But once a convention is established, the justification is practical: maintaining coordination. I need to clarify that distinction. Even if the choice was random, the current practice has reasons rooted in social coordination.

  The user's deeper need might be ethical. They might fear that this view leads to moral relativism or undermines social norms. I should explain that Lewis's account is descriptive, not prescriptive for morality. Conventions like driving rules differ from moral norms. Also, while conventions start arbitrary, their function isn't—they solve real problems. The force comes from their role in enabling cooperation.

  I should also address possible objections. For example, if norms are arbitrary, can't we change them easily? But Lewis acknowledges that changing conventions requires coordinated effort, which is hard. The status quo persists because unilateral change is costly. This inertia isn't irrational; it's a feature of coordination equilibria.

  Moreover, the user might wonder about harmful norms. Lewis's model applies to coordination, not all norms. Some norms have moral dimensions beyond coordination. But for pure conventions, the arbitrariness doesn't negate their function. The response should differentiate between types of norms to avoid overgeneralization.

  In conclusion, the user needs to see that the normative force arises from the practical consequences of deviation within a system of mutual expectations. The historical origin being arbitrary doesn't erase the current rationale based on coordination benefits. Emphasizing the cost of non-compliance and the role of expectations can bridge their understanding. Also, clarifying the scope of Lewis's theory to avoid conflating conventions with moral norms might alleviate their concerns.
answer: |-
  You've hit on a core tension in Lewis's account, and it's a brilliant question! You're absolutely right about the arbitrariness inherent in Lewis's model, but the conclusion that norms therefore have *no* genuine force is too strong. Here's a breakdown of why Lewis's view is sophisticated and doesn't simply reduce normativity to an illusion:

  1.  **The Arbitrariness is Real (and Essential):** You're correct. The fundamental insight is that for a pure coordination problem (like driving side), *any* of the potential equilibria (left or right) would work *equally well* to solve the coordination problem *if everyone adopted it*. The specific choice *between* them is arbitrary – there's no prior "moral" or "intrinsic" reason to prefer left over right. History, accident, salience, or focal points determine which one gets established.

  2.  **But Arbitrariness ≠ Lack of Rational Force *Once Established*:** This is the crucial point Lewis emphasizes. Once a convention *is* established:
      *   **Mutual Expectations are Created:** Everyone expects everyone else to follow it (drive on the right). This expectation becomes common knowledge.
      *   **Deviation Causes Coordination Failure:** If *you* unilaterally deviate (drive on the left), you don't achieve a *better* outcome; you cause a crash (or at least confusion and inefficiency). You fail to coordinate with others.
      *   **The Reason to Follow is Conditional & Instrumental:** The reason *for you* to follow the convention (drive on the right) isn't because "right is inherently better than left." The reason is: *Given that everyone else expects you to drive on the right and is acting on that expectation, driving on the right is the best way for you to achieve your goal of safe, efficient travel (and for everyone else to achieve theirs).* Following the convention is rational *conditional* on the existing expectations and behavior of others.
      *   **The Force is Real (but Rooted in Coordination):** The "normative force" you feel isn't an illusion. It's the very real, practical force of avoiding coordination failure, chaos, inefficiency, and potential harm. The cost of unilateral deviation provides a powerful, non-arbitrary reason to conform *to the established pattern*, even if the pattern itself was arbitrarily selected.

  3.  **"Ought" Emerges from Expectations and Preferences:** Lewis grounds normativity in rationality and preferences. You *ought* to follow the convention because:
      *   You have a preference for successful coordination (safe driving, communication, etc.).
      *   You know others share this preference.
      *   You know others expect you to follow convention X.
      *   You expect others to follow convention X.
      *   *Therefore*, given your preferences and these expectations, the rational thing *for you* to do is follow X. The "ought" is the "ought" of instrumental rationality applied within a social context of mutual expectations.

  4.  **Avoiding the Coordination Trap:** Yes, if history had been different, we'd follow a different convention and feel its normative force just as strongly. But that doesn't mean the force *now* is illusory. It means the force is *relational* and *context-dependent*. It arises *because* we are *in* this specific equilibrium. Jumping out of it unilaterally is irrational and costly. Changing the convention *collectively* requires solving a new coordination problem to move to a new equilibrium, which is often difficult.

  5.  **Rationalization vs. Recognition:** It's not *just* that we rationalize the accident of history. We *recognize* the functional role the convention plays *now*. While its origin might be arbitrary, its *current function* in enabling smooth coordination is not. We follow it because we see (often implicitly) that it *works* to solve a recurring problem we all face.

  **Addressing Your Core Concern:**

  *   **"Norms are ultimately arbitrary":** True for the *choice between* potential equilibria in pure coordination games. The *specific content* (drive right vs. left) is arbitrary.
  *   **"No actual reason to follow them":** **False.** There is a very strong, non-arbitrary reason: *to successfully coordinate with others who expect you to follow it, thereby avoiding the negative consequences of coordination failure.* The reason is instrumental and conditional, but it's powerful and real.
  *   **"Genuine force just an illusion":** No. The force is genuine, but its *source* is different from what we might intuitively think. It doesn't come from the intrinsic rightness of the rule itself, but from the *combined effect* of:
      *   Our shared desire for coordination.
      *   The mutual expectations the convention creates.
      *   The costliness of unilateral deviation.
  *   **"Conforming to an accident... rationalizing after the fact":** Partially true, but incomplete. We conform because conformity *works* within the existing system of expectations. The "rationalization" is often a post-hoc articulation of the *functional reason* the convention serves *now*, even if its origin was contingent.

  **In essence:** Lewis shows that powerful, genuinely felt normative force can emerge *precisely because* conventions are arbitrary solutions to coordination problems. The arbitrariness of the *choice* doesn't negate the rationality and necessity of *adhering* to the *chosen* solution once it's embedded in a web of mutual expectations. The force comes not from the rule's intrinsic content, but from its role in enabling mutually beneficial cooperation within a specific social context. It's a deflationary account of normativity, grounding it in rationality, expectations, and the practical need for coordination, rather than in mysterious moral properties or divine commands.
