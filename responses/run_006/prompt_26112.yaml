prompt: |-
  I've been working through Hofstadter's *Gödel, Escher, Bach* recently, and something about the MU-puzzle in the early chapters has been nagging at me — not the puzzle itself, but the shape of the move that cracks it. You're inside a formal system: a stock of starting strings and a handful of transformation rules. You try, and fail, to derive some target string. Then you step back and prove that the target is unreachable — but the proof doesn't use the system's own vocabulary. In the MU-puzzle you prove that MU can't be derived from MI by tracking the number of I's modulo 3. The MIU system itself has no concept of numbers, division, or remainders; you've imported arithmetic from entirely outside the system, used it to say something definitive about the system, and the system can't even formulate the statement you've proved.

  I started noticing the same shape in other places. In a programming-languages course I took, we were asked to write a particular function in a deliberately restricted language. After banging my head against it, I realized you could prove the function was inexpressible by reasoning about the language's type system within a stronger logic — one the language didn't embed and couldn't represent. A mathematician friend once described proving that a certain Diophantine equation had no solutions by moving to p-adic analysis, where an obstruction became visible that was invisible over the integers — the original problem didn't "know" about p-adic numbers, but they settled it anyway. And a philosophy of logic seminar I sat in on kept circling around the same maneuver in different guises: you build a mapping from your object system into a richer theory, you prove something in the richer theory about the image of that mapping, and the result translates back into a limitation of the original system, which never had the resources to state the richer theory's concepts.

  I want to pin down whether this specific move has a settled name. I know it's adjacent to Gödel numbering, to meta-level reasoning, to what Hofstadter calls "jumping out of the system." But I think those are both broader and narrower in various ways. Gödel numbering is one spectacular instance of mapping a system into arithmetic, but I'm interested in the genus, not just the species. Meta-level reasoning can mean any second-order reflection on a system, whereas what I'm describing is specifically the technique of embedding into a different formal domain and exploiting its extra structure to prove a limit. I'd like you to tell me: does this have an established name in logic, philosophy of mathematics, or computer science? If several candidates exist — model-theoretic proof of unprovability, relative interpretation, conservation results, something from the representation theorem literature — which one carves closest to the phenomenon I'm describing, and where exactly do its boundaries fall? And if nothing fits precisely, what would you call it, and how would you define it to distinguish it from both ordinary meta-level reasoning and from the full machinery of arithmetization?

  Please lead with your bottom line — whether there's an established name or not — and then give your reasoning, without preamble and without restating my question.
reasoning: |-
  Okay, let me unpack this user's query. They're describing a pattern where you prove something about a formal system by embedding it into a richer system and using that system's tools. The examples include the MU-puzzle, a programming language type system, Diophantine equations with p-adic numbers, and philosophy of logic discussions. The user wants to know if this specific technique has a name.

  First, I recall that in logic and computer science, this is a common strategy. The key elements are: taking a system S, mapping it into a more expressive system T, proving something about the image in T, and then translating that back to S. The user is right that Gödel numbering is a famous example but they want the general concept.

  The term "relative interpretation" comes to mind. In model theory, this refers to translating one theory into another. But I need to check if it fits all their cases. Relative interpretation allows using tools from T to analyze S, which matches. The MU-puzzle uses arithmetic to interpret the MIU system, and p-adic analysis interprets Diophantine equations.

  Another candidate is "embedding" in the sense of proof theory or computability theory. But "embedding" is a bit vague. "Model-theoretic conservativity" might not fit because it's about provability preservation, whereas the user focuses on importing external structure for proofs of unprovability.

  The user mentions "meta-level reasoning" being too broad. They want the specific move of embedding into a different formal domain. Relative interpretation seems precise because it involves a formal mapping between theories. It covers arithmetic embedding for formal systems, p-adic methods, and type system embeddings via logics.

  I should confirm if relative interpretation is the standard term. Textbooks like Mendelson's use it for Gödel numbering. The p-adic example fits as interpreting equations in another structure. The programming language case maps the language into a stronger logic via a model. Philosophy examples often use interpretations between theories.

  The boundaries: relative interpretation requires a syntactic or semantic mapping. It's not just any meta-reasoning but a structured translation. It's distinct from arithmetization, which is a type of relative interpretation to arithmetic. So relative interpretation is the genus, arithmetization is a species.

  The user wants to distinguish from broader meta-reasoning. Relative interpretation does that by requiring an explicit mapping. Conservation results might be related but are more about what's preserved, not necessarily using richer tools.

  So the bottom line is "relative interpretation" is the established name. It encompasses all their examples and has clear boundaries. Other terms like "simulation" or "encoding" are less formal. Relative interpretation is the term used in logic for this technique.
answer: |-
  **Bottom line:** The most precise established name for this move is **relative interpretation** (especially in logic and proof theory), though **embedding** is sometimes used more informally. This specifically denotes the technique of formally mapping one system into a richer one to leverage the richer system's tools for proving limitations of the original.

  **Reasoning:**

  1.  **Relative Interpretation (Interpretation):** This is the core concept in mathematical logic. It refers to a rigorous *mapping* of the syntax and/or semantics of a formal system S (the object system) into a formal system T (the target or meta-system). Crucially:
      *   It defines how strings, terms, formulas, or proofs in S are systematically represented *within* the language of T.
      *   The axioms and rules of S are translated into statements provable (or valid) in T.
      *   This allows properties *about* S (like consistency, incompleteness, or the unprovability/unexpressibility of specific statements) to be formulated and proven *within* T.
      *   **Your examples fit perfectly:**
          *   **MU-Puzzle:** The MIU-system is *interpreted* within arithmetic (T). Strings are mapped to numbers (like Gödel numbers), rules are mapped to arithmetic operations, and the property "number of I's ≡ 1 mod 3" (which is preserved by the interpreted rules and holds for MI but not MU) is an arithmetic statement *in T* proving MU's unattainability *in S*.
          *   **Programming Language:** The restricted language S is *interpreted* within a richer type theory or logic T. Properties about expressibility (e.g., "no term in S has this type") are proven in T, implying inexpressibility in S.
          *   **Diophantine Equation:** The equation over integers (S) is *interpreted* within the p-adic numbers (T). The obstruction (e.g., a local solubility condition) is a property of T, whose failure implies no solution exists in S.
          *   **Philosophy Seminar:** The "mapping from your object system into a richer theory" is the definition of relative interpretation. Proving in the richer theory and translating back is its standard use.

  2.  **Distinguishing Features:**
      *   **Formal Mapping:** It requires a defined translation procedure between the systems, not just informal reasoning. This distinguishes it from broader "meta-level reasoning" which might involve informal arguments or simpler observations not requiring a full mapping into a richer formal domain.
      *   **Exploiting Richer Structure:** The power comes from using concepts and proof techniques *native to T* (like modular arithmetic, p-adic analysis, higher-order logic) that are absent or inexpressible in S to prove properties *about S*.
      *   **Proving Limitations:** Its primary use in this context is to demonstrate *unprovability*, *inexpressibility*, or *unsolvability* within S.
      *   **Genus vs. Species:** Gödel numbering is a specific *type* of relative interpretation where the target system T is (some fragment of) arithmetic. Arithmetization is the process of constructing such an interpretation. Relative interpretation is the general concept encompassing Gödel numbering, the p-adic embedding, the type-theoretic embedding, etc.

  3.  **Why Other Terms Are Less Precise:**
      *   **Model-Theoretic Proof of Unprovability:** While often *achieved* via interpretation (e.g., building a model of S inside T to show consistency relative to T), it describes the *outcome* (unprovability shown model-theoretically) rather than the specific *mechanism* (the mapping/interpretation).
      *   **Conservation Results:** These state that if a certain class of statements is provable in T, it's provable in S. This is often *related* to the existence of an interpretation (e.g., if S is interpretable in T, then T's consistency implies S's consistency - a conservation result for consistency statements), but conservation focuses on what *can* be proven, not the technique of using T to show what *cannot* be done in S.
      *   **Representation Theorems:** These typically show that structures in one domain can be represented in another (e.g., groups as matrices), but focus less on the formal *system* aspects and proving *limitations* like unprovability.
      *   **"Jumping out of the system" / Meta-level reasoning:** These are too broad. They encompass the *general idea* but don't specify the *structured technique* of formal mapping and leveraging a richer formal domain. Interpretation provides the formal backbone for many such jumps.

  **Conclusion:** "Relative interpretation" (or simply "interpretation" in this technical sense) is the established term that carves nature at the joint you've identified. It precisely denotes the formal mapping of system S into a richer system T, enabling proofs *within T* about the limitations (like unprovability) of S, using concepts fundamentally external to S itself. Its boundaries are defined by the requirement of a syntactic/semantic mapping procedure and its purpose of leveraging the expressive power and proof techniques of T to analyze S.
