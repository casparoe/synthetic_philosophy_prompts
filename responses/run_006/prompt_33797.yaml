answer: |-
  Here’s an adversarial-collaboration document designed to force constructive engagement between Camp A ("manageable") and Camp B ("fatal") on consequentialism and cluelessness:

  ---

  **Adversarial Collaboration: Consequentialism & the Cluelessness Problem**  
  *Agreed Claims, Disagreements, Cruxes, and Test Cases*

  ---

  ### 1. **Agreed Substantive Claims**  
  *(After deliberation, both camps endorse these non-truistic propositions):**  
  1. **Epistemic Limitation**: Humans cannot reliably trace the *full* long-term/indirect consequences of most actions, especially in complex systems (e.g., climate policy, consumer choices).  
  2. **No Default Baseline**: There is no neutral "status quo" option immune from cluelessness; *inaction* also has vast, unpredictable consequences.  
  3. **Consequentialism’s Core Demand**: The moral status of an act depends *entirely* on its actual or expected consequences (rejecting non-consequentialist elements).  
  4. **Practical Guidance Requirement**: For a normative theory to be viable, it must be *usable* by human agents in real-world decision-making.  
  5. **Heuristics are Necessary**: Humans *must* use coarse-grained rules/estimates in practice due to cognitive limits (even Camp B agrees—but disputes their *moral authority*).  

  ---

  ### 2. **Disagreements Table**  
  | **Specific Sub-Question**                                                                 | **Camp A ("Manageable") Position**                                                                                               | **Camp B ("Fatal") Position**                                                                                                     |  
  |-------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------|  
  | **Q1: Can expected value (EV) be meaningfully assigned to typical actions under cluelessness?** | "EV reasoning remains viable by focusing on *proximal*, *probabilistically tractable* consequences (e.g., donating to proven charities), ignoring incalculable long tails." | "For most significant actions, the set of possible long-term consequences is too vast, chaotic, and undefined to assign *any* coherent probabilities or magnitudes to outcomes, making EV empty." |  
  | **Q2: Do heuristics (e.g., "don’t lie") retain *consequentialist justification*?**        | "Rules/heuristics are justified *instrumentally* by their tendency to produce better consequences *in expectation* than alternatives, even if imperfect." | "Heuristics lack *real-time consequentialist grounding*; their justification is either retrospective (post hoc) or collapses into rule-worship, abandoning core consequentialism." |  
  | **Q3: Does separating the *criterion of rightness* from the *decision procedure* resolve cluelessness?** | "Yes. The criterion (maximize actual good) is unchanged, but cluelessness forces us to use proxy procedures (e.g., EV over coarse options). This is internal to consequentialism." | "No. If the decision procedure (e.g., heuristics) systematically fails to track the criterion due to cluelessness, the theory loses coherence. 'Rightness' becomes detached from practice." |  
  | **Q4: Is consequentialism "action-guiding" if it cannot specify *which act* is right in a given situation?** | "Yes. It guides by identifying *features* to optimize (expected good), ranking *available options*, and refining procedures—even without certainty." | "No. If consequentialism cannot identify a uniquely (or even roughly) best action *in principle* due to cluelessness, it fails as a practical guide and cedes normative authority." |  

  ---

  ### 3. **Cruxes: Pivotal Sub-Questions**  
  *(Where shifting a view would significantly alter a camp’s overall position)*  
  1. **Crux 1**: *Can coarse-grained EV (e.g., "giving to GiveWell charities") reliably approximate the maximization demand of consequentialism despite cluelessness?*  
     - **Camp A**: Yes → Consequentialism remains practically functional.  
     - **Camp B**: No → Consequentialism lacks actionable content.  
  2. **Crux 2**: *Must an action-guiding theory deliver *act-specific prescriptions*, or is *directionally improving deliberation* sufficient?*  
     - **Camp A**: Directional guidance suffices.  
     - **Camp B**: Act-specificity is required.  
  3. **Crux 3**: *Does the *inevitability* of cluelessness for *all* normative theories neutralize it as an objection to consequentialism?*  
     - **Camp A**: Yes—all theories face cluelessness, so it can’t be a *unique* fatal flaw.  
     - **Camp B**: No—only consequentialism *defines rightness* by consequences, so cluelessness uniquely undermines its foundation.  

  ---

  ### 4. **Crux Test Cases**  
  **Test Case for Crux 1 (Coarse-Grained EV Reliability):**  
  - **The "Charity Triage" Scenario**:  
    *You must choose between:  
    (A) Donating $1k to a malaria bednet charity (proven short-term lives saved, long-term effects incalculable).  
    (B) Donating $1k to a foundation researching AI alignment (negligible short-term effects, potentially existential long-term impact).  
    (C) Keeping the money (personal gain, unknown ripple effects).*  
  - **Camp A Prediction**:  
    A is clearly best—it maximizes *tractable* EV. Unknown long-term effects are symmetrical/random across options, so proximal EV dominates.  
  - **Camp B Prediction**:  
    No option is demonstrably superior. The long-term effects of (A) (e.g., overpopulation? societal collapse?) or (B) (e.g., preventing extinction?) could swamp short-term gains, making EV estimates arbitrary.  

  **Test Case for Crux 2 (Specificity of Guidance):**  
  - **The "Hospital Lie" Scenario**:  
    *A terminally ill patient asks if they’ll recover. Truth causes immediate despair. A lie brings peace but may distort their end-of-life decisions. Unknown long-term effects on family/medical trust.*  
  - **Camp A Prediction**:  
    Consequentialism guides by urging focus on *comparable* impacts (e.g., patient’s wellbeing vs. autonomy) and defaulting to rules ("don’t lie") as EV-proxies. A "best guess" is possible.  
  - **Camp B Prediction**:  
    Consequentialism delivers no prescription. The lie’s long-term effects (e.g., eroding institutional trust) could dwarf short-term benefits, but are wholly incalculable. No option is discernibly right.  

  **Test Case for Crux 3 (Inevitability of Cluelessness):**  
  - **The "Kantian Climate Policy" Scenario**:  
    *A deontologist must choose a climate policy (e.g., degrowth vs. techno-optimism) obeying the Categorical Imperative. All options have identical respect for persons but radically different, clueless long-term consequences.*  
  - **Camp A Prediction**:  
    Deontology also fails to guide—cluelessness prevents knowing which policy *truly* respects future persons (e.g., via ecosystem collapse). All theories need proxies, so consequentialism isn’t uniquely impaired.  
  - **Camp B Prediction**:  
    Deontology still guides: it selects policies *based on procedure* (e.g., "don’t violate duties to extant humans"). Cluelessness only undermines *consequentialism* because consequences are its sole criterion.  

  ---

  ### **Flagged Verbal Dispute: "Action-Guiding"**  
  - **Camp A’s Meaning**: Provides *deliberative tools/rules* to *aim* at good consequences.  
  - **Camp B’s Meaning**: Must generate *act-specific verdicts* (e.g., "A is obligatory, B is forbidden").  
  - **Resolution Suggestion**: Distinguish **procedural guidance** (how to deliberate) from **verdictive guidance** (what to do). Much disagreement reduces to which type is essential.  

  ---  
  This structure forces engagement on *shared premises* (Section 1), isolates *specific disagreements* (Section 2), targets *pivotal questions* (Section 3), and uses *agreed test cases* (Section 4) to probe cruxes. The verbal dispute flag preempts talking past each other. Workshop participants could be assigned to defend/attack positions *across* camps for each crux.
