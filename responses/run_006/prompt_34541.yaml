prompt: |-
  I'm a PhD student in political philosophy working on democratic epistemology, and I'm trying to get my views into defensible shape before my prospectus meeting. I've been reading through the Condorcet jury theorem literature — List and Goodin, Estlund, Landemore, and the surrounding debates — and I've found myself pulled in several directions that I'm not sure are compatible. I want to know whether the set of commitments I've settled on actually hangs together, or whether I'm papering over tensions that my committee will spot immediately.

  Here's roughly where I've landed. (a) The Condorcet jury theorem is the most promising epistemic justification for democratic majority rule going. If each voter has a better-than-chance probability of being right about some question, and votes are independent, the probability that the majority gets it right converges to certainty as the electorate grows. That's a genuine normative reason to prefer democracy to non-democratic arrangements, not just a procedural one. (b) That said, the independence condition is almost certainly violated in any actual democracy — voters share media ecosystems, party cues, and cultural narratives, and their judgments are correlated in ways that can dramatically reduce or even reverse the theorem's epistemic benefits. So the CJT cannot be straightforwardly applied to real political life. (c) Even so, I think majoritarian democracy is epistemically superior to the available alternatives — epistocracy, sortition, expert delegation — for most of the questions political communities face. This isn't just a pragmatic concession; I think there's something about the aggregation of diverse perspectives under majority rule that tracks the truth better than the alternatives do. (d) However, I also think there are identifiable domains — monetary policy, climate science, pharmaceutical regulation — where the competence differential between experts and lay voters is so large that policy should be insulated from majoritarian pressure and placed in the hands of expert bodies. I don't think this is just a matter of efficiency; I think it's an epistemic requirement. (e) I hold that all citizens have equal moral standing and that political institutions must express equal respect for persons, which is why I reject epistocracy even where weighting votes by competence would yield epistemically more accurate outcomes. (f) Finally, I'm sympathetic to the idea that the value of democracy is partly constitutive rather than purely instrumental — that democratic procedures don't just track independently specifiable truths but partly constitute what it is for a political community to govern itself well.

  I can feel that some of these are pulling against each other, but I'm not confident I can identify exactly which pairs are the real problems and which look like problems only at first glance. Please go through and tell me which commitments are in tension, rank the tensions by severity, and for each say what the cheapest revision would be and what it costs. Also flag any apparent tensions that dissolve on closer inspection — I want to know what I don't need to worry about. Keep the response to no more than 1,000 words.
reasoning: |-
  Okay, I need to help a PhD student in political philosophy analyze tensions in their commitments regarding democratic epistemology. The user has laid out six key points (a-f) about their views on the Condorcet Jury Theorem (CJT) and its implications for democracy. They're concerned about internal contradictions before their prospectus meeting.

  First, I notice this is a high-stakes academic situation - prospectus meetings can shape dissertation trajectories. The user needs both philosophical rigor and practical revision strategies. Their core tension seems to be between epistemic justifications (CJT-based) and non-epistemic values (equality, constitutive democracy).

  Let me systematically map the tensions. Commitment (a) endorses CJT as the strongest epistemic justification, while (b) acknowledges its real-world limitations due to correlated votes. That's not inherently contradictory - it's actually quite sophisticated. The real friction starts with (c): claiming majority rule is still epistemically superior despite (b). This requires alternative mechanisms beyond classic CJT, like diversity arguments from Landemore. 

  The biggest clash emerges with (d), which carves out expert domains. If epistemic gains vanish in technical areas, why not extend this logic? The user needs to explain why climate science differs from (say) constitutional law. Meanwhile, (e)'s anti-epistocratic equality seems stable but creates pressure points with (d) - why is delegating to experts acceptable but not competence-weighted voting? The constitutive democracy in (f) potentially conflicts with instrumental CJT arguments, though they might be complementary.

  For revision strategies: The cheapest fix might be redefining epistemic mechanisms in (c) to explicitly embrace diversity/collective intelligence models, distancing from pure CJT. For (d), specifying clear boundary criteria for expert domains would help. The costlier move would be softening (a)'s claim about CJT being the "most promising" justification to accommodate these adjustments.

  Notable non-tensions: (b) doesn't undermine (a) if framed as ideal theory vs. implementation challenges. (e) and (f) can coexist through a pluralist value framework. The user's awareness of possible "papering over" suggests they're ready for constructive critique - I'll emphasize where tensions are resolvable versus where substantive rethinking is needed.
answer: |-
  Here’s an analysis of tensions in your commitments, ranked by severity, with suggested revisions and costs. Key tensions arise between epistemic superiority claims, the expert exception, and constitutive democracy—but others are resolvable.

  ### **Ranked Tensions (High to Low Severity)**
  1.  **Tension: (c) vs. (d) — Epistemic superiority of majority rule vs. expert domains**  
      - **Nature**: If majority rule is epistemically superior *in general* due to diversity/aggregation (c), why is it inferior in specific domains (d)? If competence differentials justify expert insulation (d), why wouldn’t they *always* override majority rule given known voter incompetence (e.g., on complex issues)?  
      - **Cheapest Revision**: **Clarify that epistemic superiority hinges on *problem type***. Argue that for "political questions" (values-laden, interdependent, requiring perspective-taking), diversity-driven majorities outperform experts, while for "technical questions" (fact-bound, decomposable), experts dominate.  
      - **Cost**: Requires defending a contested distinction between political/technical domains (e.g., why is climate policy technical but welfare policy not?).  

  2.  **Tension: (a) vs. (c) — CJT as "most promising" vs. non-CJT epistemic mechanisms**  
      - **Nature**: You concede CJT fails empirically (b) yet call it the "most promising" justification (a), while relying on *non-CJT mechanisms* (diversity, deliberation) for (c). This risks incoherence: if CJT’s conditions are unmet, and you lean on alternative mechanisms, why privilege CJT?  
      - **Cheapest Revision**: **Demote CJT to a heuristic/ideal case** and elevate diversity-based arguments (e.g., Landemore’s "diversity trumps ability") as your core epistemic engine. Frame CJT as illustrating *why* independence *would* matter, not as the foundation.  
      - **Cost**: Weakens the "mathematical certainty" appeal of CJT; may require engaging critics of diversity arguments (e.g., Anderson on correlated errors).  

  3.  **Tension: (e) vs. (d) — Equality vs. expert insulation**  
      - **Nature**: Delegating to experts (d) may violate "equal respect" (e) if it denies citizens input on high-stakes decisions (e.g., drug approval affecting bodily autonomy). Epistocracy weights votes; insulation removes them entirely.  
      - **Cheapest Revision**: **Frame expert bodies as democratically authorized & constrained**. Argue that experts exercise delegated authority under citizen oversight (e.g., legislative mandates, sunset clauses) — preserving equal standing via institutional design.  
      - **Cost**: Risks appearing ad hoc; must explain why this doesn’t license epistocracy.  

  4.  **Tension: (f) vs. (a/c) — Constitutive value vs. epistemic instrumentalism**  
      - **Nature**: If democracy’s value is partly intrinsic (f), why emphasize CJT’s truth-tracking (a/c)? Instrumentalism could undermine constitutive claims (e.g., if experts track truth better, why not empower them?).  
      - **Cheapest Revision**: **Adopt a dualist/pluralist foundation**: CJT/diversity arguments *supplement* (but don’t exhaust) democracy’s value. Truth-tracking reinforces self-government by enabling informed collective agency.  
      - **Cost**: Must explain how epistemic and constitutive values interrelate without reducing one to the other.  

  ---

  ### **Apparent Tensions That Dissolve**  
  - ***(b) vs. (a)*: Independence violations don’t undermine CJT’s normative promise**. CJT remains a "proof of concept" that voter competence + independence *can* yield epistemic gains, guiding institutional design to *approximate* these conditions (e.g., via media diversity). No revision needed.  
  - ***(e) vs. CJT)*: Equality isn’t contradicted by CJT**. CJT assumes equal competence, but you reject epistocracy on *moral* grounds (e) even if it *were* epistemically optimal. This is consistent if you deny competence can be measured for vote-weighting.  
  - ***(c) vs. (f)*: Epistemic superiority and constitutive value can coexist**. Democracy can be both truth-conducive *and* intrinsically valuable (e.g., collective self-rule expresses respect while also making good decisions).  

  ---

  ### **Summary of Revisions & Costs**  
  | **Tension**   | **Cheapest Revision**                                | **Cost**                                                                 |
  |----------------|------------------------------------------------------|--------------------------------------------------------------------------|
  | (c) vs. (d)   | Restrict epistemic superiority to "political" domains | Defending domain boundaries; may weaken generalism of (c)               |
  | (a) vs. (c)   | Make diversity (not CJT) your epistemic core         | Loses CJT’s mathematical rigor; engages debates on diversity arguments |
  | (e) vs. (d)   | Frame experts as democratically constrained agents   | Requires robust theory of democratic delegation/accountability          |
  | (f) vs. (a/c) | Position epistemic gains as reinforcing self-rule    | Must integrate instrumental/constitutive values non-reductively        |

  ### **Recommendation**  
  Your framework is salvageable with **three moves**:  
  1. **Anchor (c) in diversity-based epistemology** (not CJT) to handle independence failures.  
  2. **Limit (c)’s scope to non-technical domains** where diversity matters most, justifying (d).  
  3. **Ground expert delegation in democratic authority** to resolve the equality tension.  

  This maintains epistemic optimism for democracy while accommodating expertise, avoids epistocracy, and reconciles instrumental/constitutive values. Your committee will likely press on **domain boundaries** and **diversity’s epistemic value**—preempt these.
