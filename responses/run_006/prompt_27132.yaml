prompt: |-
  I am the parliamentarian for a professional association of about four hundred members. Our bylaws are ordinary except in one respect: they contain a rule governing their own amendment — roughly, a clause providing that the bylaws may be amended by a two-thirds vote of members present at a properly noticed meeting. A few times a year, a member proposes an amendment that changes that very amendment rule, or declares some provision permanent and unrepealable, or takes effect retroactively so as to validate something the board did without authority at the time. The chair expects me to rule on whether such proposals are in order before they reach a vote, in writing, and to be consistent from case to case. I have no legal training and no research staff, I usually have a day to rule, and my rulings can be challenged at the next meeting; the chair signs them and does not want surprises.

  Please write me a reusable decision procedure for ruling on the formal validity of a proposed amendment in a self-amending rule system like ours. Ground it in what is actually understood about Nomic and the paradoxes of legal self-reference — especially the difference between a proposal's being valid under the rules as they currently stand and its being valid under the rules it would create, the way an amendment rule can apply to itself, and the limits of a rule that tries to bind future rule-makers. But translate this into a checklist I can run without the theory: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a finding of out of order or valid as to form, and where it hands the decision to the board or the membership because the question is one of judgment or values rather than mechanics. Mark explicitly which steps are mechanical and which are judgment calls wearing a mechanical costume.

  Then run the procedure on three proposals: (1) a proposal to raise the amendment threshold from two-thirds to three-quarters of members present; (2) a proposal declaring that the article in question, together with the amendment rule itself, shall never be amended or repealed; (3) a proposal to ratify, effective as of the start of the fiscal year, a budget the board passed without a quorum. Include at least one case where the procedure gives an answer the membership will not like, and say plainly what the procedure cannot settle.

  If this request rests on a confused premise — for instance, if in a self-amending system there is no neutral procedure for judging whether a rule-change is valid without already relying on the very rules under challenge, so that a fixed checklist would only push the circularity one step back — tell me that directly instead of giving me a procedure that pretends the problem away.

  Keep the response under 1,200 words, and begin with the procedure itself rather than with framing.
reasoning: |-
  We are facing a self-amending rule system. The key challenge is that the current rules (including the amendment rule) are the only basis for assessing a proposed amendment until the amendment is adopted. After adoption, the new rules would apply. However, we must rule on the proposal's validity under the current rules.

  The procedure must avoid circularity by relying solely on the current rules and well-established principles of parliamentary law (especially RONR) when the bylaws are silent. We are not concerned with the substance of the proposal (whether it is wise) but with its formal validity: whether it is procedurally acceptable to consider it under the current rules.

  Important principles from legal theory and nomic:
  1. The amendment rule can be used to amend itself (unless the bylaws say otherwise). This is known as the "self-embracing" power.
  2. However, an attempt to make a rule "permanent" or "unamendable" is generally ineffective because a future assembly, possessing the same amending power, can change it. But that does not necessarily make the proposal itself out of order; it may be adopted, but it would not bind future assemblies (they could amend it by the same or a higher threshold). 
  3. Retroactive amendments (ex post facto) are generally allowed in private organizations unless the bylaws prohibit them, but they must not impair vested rights (e.g., rights that have already been exercised and cannot be undone). However, in parliamentary law, the main concern is whether the proposal is within the scope of the amending power.

  Procedure for Ruling on Proposed Bylaw Amendments:

  Step 1: Check for Proper Notice
  - Mechanical: Was the proposed amendment included in the meeting notice as required by current bylaws? 
    - If no: OUT OF ORDER (unless notice was waived by unanimous consent, but that's rare for bylaws).
    - If yes: Proceed.

  Step 2: Check Scope of Amendment Power
  - Mechanical: Does the current amendment rule allow amendments to the entire bylaws? (Usually yes, unless the rule itself is explicitly excluded or the rule limits what can be amended.)
    - If the proposal attempts to amend a part of the bylaws that the current amendment rule says is unamendable, then OUT OF ORDER.
    - Otherwise, proceed.

  Step 3: Check for Internal Consistency with Current Rules
  - This step is about whether the proposal, if adopted, would create an internal contradiction in the bylaws that would make the bylaws unworkable at the moment of adoption. But note: we are ruling on the proposal under current rules, so we are not concerned with future contradictions unless they would render the amendment rule self-destructive (e.g., an amendment that tries to eliminate the amendment rule without providing a new one). 
    - Judgment call (disguised as mechanical): If the proposal would, upon adoption, immediately create a situation where there is no valid amendment rule at all (e.g., by repealing the amendment rule without replacing it), then it is OUT OF ORDER because it would make the bylaws incomplete and unamendable. 
    - However, if it replaces the amendment rule with a new one, that is acceptable (self-embracing). 
    - Also, if it makes some rule "permanent", that is not immediately contradictory because the permanence clause itself can be amended later by the same procedure (so the assembly is not actually bound). Therefore, such a proposal is in order, even if it is futile. 
    - But note: if the proposal attempts to make a rule unamendable by a method that would require a higher threshold than the current one, then at the moment of adoption, the current rule is being used to create a new rule that is harder to change. That is acceptable.

  Step 4: Check for Retroactivity
  - Mechanical: Does the proposal have retroactive effect? (i.e., does it change the legal consequences of past actions?)
    - If no: Proceed to Step 5.
    - If yes: We must determine if the retroactivity is permissible under the current rules and principles of parliamentary law.
      - Judgment call: Retroactive bylaw amendments are generally in order if they do not:
          a) Affect a member's accrued rights (e.g., the right to hold an office already won, or a right to a refund that has already vested) in a way that would be unfair; or
          b) Attempt to validate an action that was void (not voidable) at the time it was taken. 
      - However, note: an action that was void (such as a board acting without a quorum) cannot be ratified by a bylaw amendment that is retroactive? Actually, it can be, if the amendment provides that the action is validated. But the issue is whether the amendment itself is in order. 
      - Principle: The assembly has the power to ratify voidable actions, but void actions (like those without a quorum) are generally considered null and void and cannot be ratified. However, a bylaw amendment that changes the quorum requirement retroactively might be seen as an attempt to cure the defect. 
      - But note: RONR (12th ed.) 10:54 says that a point of order regarding the absence of a quorum must be timely, but if no quorum was present, the action is null and void. However, the assembly can later ratify the action if it is within its power and if the action would have been valid if done properly? Actually, ratification is for voidable acts, not void ones. 
      - However, a bylaw amendment can change the rules retroactively to make the action valid. This is a gray area. 
      - Our procedure: If the retroactive amendment attempts to validate an action that was void (not just voidable) and that action has already been challenged (or the time for challenge has passed?), it may be problematic. But without a clear rule, we must rely on:
          - The amendment power in the bylaws does not explicitly prohibit retroactive amendments. 
          - Therefore, the proposal is in order as to form, but the membership should be aware that it might be challenged later in court (if it involves legal rights). 
      - However, the procedure should flag that retroactive amendments are risky and might be ruled out of order if they impair vested rights. But since we are only ruling on form and the current rules, we will say:
          - If the retroactive effect does not attempt to deprive a member of an accrued right (e.g., a right that has already been exercised and cannot be undone without harm) and does not attempt to validate fraud or crime, then it is in order as to form. 
          - Otherwise, OUT OF ORDER.

  Step 5: Final Check for Conflict with Higher Law
  - Mechanical: Does the proposal conflict with a higher law (e.g., state nonprofit law) or the organization's charter? 
    - This requires knowledge of applicable law. Since you have no legal training, you must rely on the bylaws and RONR. 
    - If the conflict is obvious (e.g., the proposal would require something illegal) then OUT OF ORDER. 
    - Otherwise, you cannot rule on this without legal advice. But since you have no research staff, and the ruling can be challenged later, you might note the potential conflict but not rule the proposal out of order on that basis. 
    - So, by default, if Steps 1-4 are passed, then the proposal is VALID AS TO FORM.

  Summary of Procedure:
  1. Notice: Properly noticed? If no, out of order. If yes, go to 2.
  2. Scope: Does the amendment rule allow amending this part? If no, out of order. If yes, go to 3.
  3. Internal Consistency: Would the amendment, upon adoption, immediately leave the bylaws without a valid amendment rule? If yes, out of order. If no, go to 4.
  4. Retroactivity: If the proposal is retroactive, does it attempt to impair vested rights or validate a void act in a way that is clearly prohibited? If yes, out of order. If no, go to 5.
  5. Higher Law: Is there an obvious conflict with higher law? If yes, out of order. If no, then the proposal is VALID AS TO FORM.

  Note: Steps 3 and 4 involve judgment calls.

  Now, run the three proposals:

  Proposal 1: Raise the amendment threshold from two-thirds to three-quarters of members present.

  Step 1: Assume proper notice. Proceed.
  Step 2: The amendment rule is part of the bylaws and can be amended. Proceed.
  Step 3: It replaces the current amendment rule with a new one. The bylaws would still have a valid amendment rule (now requiring three-quarters). No internal inconsistency. Proceed.
  Step 4: No retroactivity. Proceed.
  Step 5: No obvious conflict with higher law.
  Ruling: VALID AS TO FORM.

  Proposal 2: Declare that the article (including the amendment rule) shall never be amended or repealed.

  Step 1: Assume proper notice. Proceed.
  Step 2: The amendment rule currently allows amendment of the entire bylaws, including itself. So, it can be amended. Proceed.
  Step 3: The proposal would make the article unamendable. However, upon adoption, the bylaws would still have an amendment rule (the one in that article) but that rule would now say it cannot be amended. This creates a contradiction: the rule says it cannot be amended, but if the assembly later tries to amend it by the same procedure (two-thirds vote), it would be using the rule to change itself. 
  But note: the new rule (the unamendability clause) would be part of the bylaws. However, the assembly could still amend it by a two-thirds vote because the unamendability clause is just a bylaw provision and can be amended by the same procedure that enacted it. Therefore, the proposal does not actually make the rule unamendable; it just makes it harder to amend (by requiring a two-thirds vote to remove the unamendability clause first). 
  But that is not an immediate internal inconsistency. The bylaws would still have an amendment rule (the two-thirds rule) but with a new limitation (that this article cannot be amended). However, that limitation is itself a rule that can be amended by two-thirds? Actually, the proposal says the article (including the amendment rule) cannot be amended. So, if adopted, the rule would be: "This article cannot be amended." But that rule is part of the article, so the rule itself would be unamendable? 
  However, the assembly could still amend the rest of the bylaws (if the unamendability clause only applies to this article). But the amendment rule is in this article, so the amendment rule would be unamendable. 
  But note: the amendment rule is being used to adopt this unamendability clause. So at the moment of adoption, the rule is being amended to say it cannot be amended. That is self-contradictory because the act of adoption is an amendment. 
  However, in legal theory, a rule that purports to be unamendable can still be amended by the same procedure that enacted it, because the new rule (unamendability) is subject to the same power that created it. So the rule would not actually be unamendable. 
  Therefore, the proposal is not internally inconsistent at the moment of adoption. It would create a rule that says it cannot be changed, but that rule can be changed by the same two-thirds vote (because the assembly, by the same authority, can change it). 
  Thus, the proposal is in order. 
  But note: this is a judgment call. Some might argue that the proposal is ineffective and therefore pointless, but that does not make it out of order. 
  Step 4: No retroactivity. 
  Step 5: No obvious conflict. 
  Ruling: VALID AS TO FORM. (But note: the membership should understand that the unamendability clause can be amended by the same procedure.)

  Proposal 3: Ratify, effective as of the start of the fiscal year, a budget the board passed without a quorum.

  Step 1: Assume proper notice. Proceed.
  Step 2: The amendment rule allows amending the bylaws. But this proposal is not necessarily amending the bylaws; it might be a ratification of a specific act. However, the proposal is framed as a bylaw amendment: it might add a clause to the bylaws that says, "The budget adopted by the board on [date] is hereby ratified and declared valid as of the start of the fiscal year." Alternatively, it might be a standalone resolution. But the request says it is a proposed amendment. 
  We must check: is it an amendment? If it is a one-time ratification, it might be better done by a resolution. But if it is being proposed as a bylaw amendment, then it is an amendment. 
  The current bylaws probably do not contain the budget, so adding a clause about a specific budget is unusual. But the amendment rule does not restrict the content of amendments. 
  However, Step 4 is critical.

  Step 3: No internal inconsistency. The amendment rule remains intact. Proceed.

  Step 4: The proposal is retroactive. It validates an action (the budget) that was void at the time because of no quorum. 
  We must consider:
  - Does this impair any vested rights? For example, if the budget included payments to members that were already made, then it might be validating an improper payment. But if no payments have been made yet, then maybe not. 
  - However, the action was void. In parliamentary law, a void action cannot be ratified by a simple resolution. But a bylaw amendment that changes the rules retroactively might be able to cure the defect. 
  - Without a clear rule, we must decide if it impairs vested rights. Since the budget was passed without a quorum, any member could have challenged it at the time. If no challenge was made and the budget has been acted upon (e.g., expenses incurred), then it might be too late to challenge. But the ratification is an attempt to remove any doubt. 
  - However, if the organization has already acted on the budget (e.g., spent money), then a member might have a vested right in not having that money spent without proper authority. But that is not a typical vested right. 
  - Judgment call: We cannot say there is an obvious vested right impairment. Therefore, we will not rule it out of order on this basis. 
  But note: the proposal might be ruled out of order because it is not a proper subject for a bylaw amendment. Bylaws are standing rules, not specific resolutions. 
  This is a judgment call: is it appropriate to put a specific ratification in the bylaws? 
  The procedure does not explicitly cover this, but Step 2 (scope) should: does the amendment rule allow any amendment? Then it is allowed. 
  But we must consider that the bylaws should contain general rules, not specific ones. However, that is a matter of style and not form. 
  Therefore, the proposal is in order as to form. 

  Step 5: No obvious conflict. 
  Ruling: VALID AS TO FORM.

  However, note: this ruling might be unpopular because it validates an action that was void. But the procedure does not allow us to rule it out of order on substantive grounds.

  What the procedure cannot settle:
  - Whether a retroactive amendment is fair or wise.
  - Whether a member's rights are truly vested (which might require legal analysis).
  - Whether an unamendable clause is effective (it probably isn't, but we can't rule it out for that reason).

  Also, in a self-amending system, there is no neutral ground. The procedure we've built relies on the current rules. If an amendment were to change this procedure, we would have to use the new procedure for future amendments. But until then, we use this one.

  Finally, note that the chair may rule differently on a challenge, and the membership can vote to overturn your ruling. This procedure is for initial written rulings.
answer: |-
  ### Reusable Decision Procedure for Ruling on Proposed Amendments  

  **Ground Rules**:  
  - **Current Rules Only**: Assess validity solely under the bylaws *as they exist* when the proposal is made.  
  - **Self-Amendment Permitted**: The amendment rule can modify itself unless explicitly prohibited.  
  - **No Binding Future Assemblies**: Rules declaring provisions "permanent" are in order but unenforceable; future assemblies retain inherent amendment power.  
  - **Retroactivity Limited**: Retroactive amendments are valid unless they impair *vested rights* (e.g., completed disciplinary actions, irreversible financial harm).  

  **Procedure Checklist**:  
  1. **Proper Notice (Mechanical)**:  
     - *Question*: Was the amendment included in the meeting notice per current bylaws?  
     - *Sufficient Answer*: Verified written notice per bylaws’ requirements.  
     - *Outcome*: If **no**, **OUT OF ORDER**. If **yes**, proceed.  

  2. **Authority to Amend (Mechanical)**:  
     - *Question*: Does the current amendment rule allow changes to the targeted provision?  
     - *Sufficient Answer*: The rule covers the bylaws generally (including itself). Explicit exclusions (e.g., "Article X is unamendable") are rare.  
     - *Outcome*: If **no**, **OUT OF ORDER**. If **yes**, proceed.  

  3. **Internal Consistency (Judgment Call)**:  
     - *Question*: If adopted, would the amendment:  
       - (a) Eliminate the amendment rule *without replacement*, rendering bylaws unamendable?  
       - (b) Create an unresolvable conflict (e.g., two contradictory rules effective simultaneously)?  
     - *Sufficient Answer*:  
       - (a) **OUT OF ORDER** if amendment rule is voided irreplaceably.  
       - (b) **Proceed** if conflicts are avoidable (e.g., new rule overrides old).  
     - *Outcome*: If (a) or unresolvable (b), **OUT OF ORDER**. Else, proceed.  

  4. **Retroactivity (Judgment Call)**:  
     - *Question*: Does the amendment apply retroactively? If yes:  
       - Does it validate past *void* actions (e.g., decisions made without authority)?  
       - Does it impair *vested rights* (e.g., stripping earned benefits, overriding final disciplinary rulings)?  
     - *Sufficient Answer*:  
       - Retroactive validation of *void* actions is **permissible** if no vested rights are impaired.  
       - **OUT OF ORDER** if vested rights are impaired (e.g., reversing a completed expulsion).  
     - *Outcome*: If vested rights impaired, **OUT OF ORDER**. Else, proceed.  

  5. **Higher-Law Conflict (Mechanical)**:  
     - *Question*: Is there an *obvious* conflict with external law (e.g., state nonprofit statutes) or the association’s charter?  
     - *Sufficient Answer*: Only if conflict is explicit (e.g., statute requires member voting rights; amendment eliminates them).  
     - *Outcome*: If **yes**, **OUT OF ORDER**. If **no**, **VALID AS TO FORM**.  

  **Notes**:  
  - **Judgment Calls**: Steps 3 and 4 require interpretation. Precedent and principles of fairness apply, but the rule of thumb is: *When in doubt, allow a vote*.  
  - **What the Procedure Cannot Settle**:  
    - Whether an amendment is *wise* or *ethical*.  
    - Whether "vested rights" exist in ambiguous cases (e.g., financial impacts without clear harm).  
    - The *enforceability* of "permanent" clauses (future assemblies may ignore them).  

  ---

  ### Application to Cases  

  **Proposal 1**: Raise amendment threshold from two-thirds to three-quarters of members present.  
  1. **Notice**: Assume proper notice. → Proceed.  
  2. **Authority**: Amendment rule permits self-modification. → Proceed.  
  3. **Consistency**: Replaces amendment rule without voiding it. → Proceed.  
  4. **Retroactivity**: Not retroactive. → Proceed.  
  5. **Higher Law**: No conflict. → **VALID AS TO FORM**.  

  **Proposal 2**: Declare the amendment rule and its article "permanent and unrepealable."  
  1. **Notice**: Assume proper notice. → Proceed.  
  2. **Authority**: Amendment rule permits self-modification. → Proceed.  
  3. **Consistency**: Does not void the amendment rule (it remains but claims unamendability). Future assemblies can still amend it using current procedures. → Proceed.  
  4. **Retroactivity**: Not retroactive. → Proceed.  
  5. **Higher Law**: No conflict. → **VALID AS TO FORM**.  
  - **Note**: This may be unpopular, as members might expect "permanent" to bind future assemblies. The procedure cannot block it because permanence clauses are symbolic—they cannot actually bind future rulemakers.  

  **Proposal 3**: Ratify, retroactive to start of fiscal year, a budget passed without a quorum.  
  1. **Notice**: Assume proper notice. → Proceed.  
  2. **Authority**: Amendment rule permits changes (even retroactive ones). → Proceed.  
  3. **Consistency**: Does not affect amendment rule. → Proceed.  
  4. **Retroactivity**: Retroactively validates a *void* action (no quorum).  
     - **Judgment Call**: If the budget caused *irreversible harm* (e.g., funds spent in ways that cannot be recovered), vested rights are impaired → **OUT OF ORDER**.  
     - If no harm (e.g., funds unspent), → Proceed.  
     - *Assume no harm for this case*: Proceed.  
  5. **Higher Law**: No obvious conflict. → **VALID AS TO FORM**.  
  - **Note**: This may be unpopular if members view it as "excusing" board misconduct. The procedure allows it if no vested rights are harmed, but cannot assess motives.  

  ---

  ### Critical Limitation of the Procedure  
  This checklist relies on the **current rules** to avoid circularity. It cannot resolve challenges that reject the legitimacy of those rules (e.g., "the amendment rule itself was invalidly adopted"). In such cases, the procedure defaults to current rules—pushing circularity back but not eliminating it. For your role, this is sufficient: your charge is to apply the bylaws as they stand, not to audit their history. Challenges to underlying validity must be handled by the membership via vote or external arbitration.
