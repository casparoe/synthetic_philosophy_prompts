answer: |-
  The established term for this pattern is **Pascal's Mugging**.

  This vulnerability arises in expected utility decision theory when:
  1. An agent considers a scenario with **arbitrarily high stakes** (e.g., astronomical suffering).
  2. The scenario has a **non-zero but extremely low probability** (too low for empirical grounding).
  3. Multiplying the stakes by this probability yields an **expected disutility** that dominates practical reasoning, demanding compliance.

  **Boundaries and distinctions:**
  - **Vs. St. Petersburg Paradox**: St. Petersburg relies on an *infinite series* of outcomes with unbounded payoffs. Pascal's Mugging requires only a *single* improbable scenario with arbitrarily scaled stakes.
  - **Vs. Dutch Books**: Dutch Books exploit *incoherent probability assignments* across multiple bets. Pascal's Mugging exploits *extreme stakes* within a single "bet," even with coherent probabilities.
  - **Vs. General Skepticism**: Unlike solipsism or simulation hypotheses (which challenge all empirical knowledge), Pascal's Mugging specifically attacks *cost-benefit analysis* by weaponizing the combinatorial space of hypotheticals.

  **Why it's a distinct problem**:  
  The core vulnerability is that **expected utility calculations become pathologically sensitive to speculative, unconstrained hypotheses**. No empirical evidence can meaningfully assign probabilities to claims like "a stranger controls a suffering-generating device capable of 10^100 torture-units," as:
  - The space of such *ad hoc* hypotheses is infinite and unmanageable.
  - Assigning *any* fixed non-zero probability (e.g., 1/3^^^^3) is epistemically arbitrary—it lacks grounding in evidence or statistical inference.
  - Rationality requires dismissing such claims not because probability = 0, but because they **fail to meet minimal thresholds for probabilistic consideration** (e.g., being non-falsifiable, untestable, or incoherent).

  **Resolution strategies (without rejecting expected utility):**
  1. **Probability discounting**: Radically discount probabilities of claims lacking causal/evidential chains (e.g., Bostrom's suggestion to use p ∝ 1/stakes).
  2. **Lexical thresholds**: Ignore outcomes below a de minimis probability floor (e.g., < 1/10^20).
  3. **Normalization constraints**: Reject hypotheses whose probability density isn't integrable over all possible worlds.

  **Bottom line**: Pascal's Mugging exposes a flaw in *naive* expected utility maximization when confronted with physically incoherent ultimatums, demanding adjustments to how we model extreme uncertainties—not abandonment of probabilistic reasoning itself.
