prompt: |-
  I'm trying to work out what I think about individual contributions to collective harms, and my gut reactions to cases keep pulling me in different directions. Here are the verdicts I find myself with:

  - I skip voting in a national election. I don't think this is seriously wrong. My vote had no chance of changing the outcome, and my time was honestly better spent on something else.

  - I buy a factory-farmed chicken for dinner. I think this is wrong. Yes, one chicken is a rounding error in the supply chain, and the causal link between my purchase and any particular animal's suffering is probabilistic at best. But I still think it's wrong.

  - I take one extra long-haul flight for a vacation. I feel this is wrong, but noticeably less wrong than buying the chicken, even though the climate harm might be objectively larger. Something about the causal chain being stretched across millions of emitters makes the wrongness feel more attenuated to me.

  - I'm one of a hundred soldiers in a firing squad, each firing a rifle. I'm told truthfully that only one rifle has a live round; the rest are blanks. I fire. The prisoner dies. I think I did something clearly wrong, even if it turns out my rifle had the blank. I participated in a killing.

  - I witness a group assaulting someone. I could call the police, but realistically they won't arrive in time to help. I don't call. I think I acted wrongly — I should have called.

  - I don't recycle a single aluminum can. This feels trivial, not wrong. It's one can.

  - I join a consumer boycott of a company that uses child labor. The company sells millions of units a year; my individual purchasing decision is insignificant. I think I should boycott, and I think it would be wrong not to. But I can't explain why this is different from the voting case.

  What principle — or small set of principles — best captures these verdicts? I'm particularly interested in whether there's a clean way to draw the line that separates the voting case (where inefficacy seems to excuse) from the boycott and chicken cases (where it doesn't) without simply gerrymandering the principle to fit my intuitions. And if no tidy principle gets all of them, which of my verdicts should I give up?

  Please flag how confident you are in what you propose and single out the point you're least sure of.
reasoning: |-
  Okay, the user is grappling with ethical intuitions around individual contributions to collective harms. They've listed several scenarios where their gut reactions seem inconsistent: voting (not wrong), buying factory-farmed chicken (wrong), flying (somewhat wrong), firing squad (wrong), not calling police during assault (wrong), not recycling (not wrong), and boycotting (obligatory). 

  Hmm... the core tension is between causal inefficacy (my action doesn't change outcomes) and complicity (I'm still part of something bad). The user specifically wants help reconciling why voting feels excusable but boycotting doesn't, without cheating with ad-hoc explanations. 

  Let me start by noticing patterns. In all cases where they feel wrongdoing (chicken, firing squad, assault omission, boycott), there's either direct participation or clear membership in a harmful practice. The voting and recycling cases lack that "we're doing this together" quality. The flying case is intermediate - climate change feels more diffuse. 

  The key might be whether the act constitutes playing one's role in a collective harm. Buying chicken isn't just failing to prevent harm; it's actively sustaining the system. Whereas skipping voting is mere non-participation in fixing a system. That explains the chicken/voting split. 

  But wait - the boycott case complicates this. Boycotting is also non-participation, yet feels obligatory. Here the difference might be about counterfactuals: If everyone thought like me about voting, democracy might still function, but if everyone thought boycotting was pointless, the boycott would fail. So the "reasonable expectation of collective efficacy" matters. 

  The firing squad example is particularly telling. Even with a blank, you're performing the role of executioner. This suggests symbolic participation alone can be culpable. 

  I should flag that the flying case is hardest to fit. Maybe the physical/psychological distance to harm matters? Chicken suffering feels more immediate than dispersed climate effects. But that might be an inconsistency worth examining. 

  Least confident point: Whether the "duty to bear witness" in the assault case truly distinguishes it from voting. If calling police is symbolic condemnation, why isn't voting? Perhaps because voting is periodic ritual while emergency response is about solidarity in the moment. 

  If the user needs to adjust any intuition, the flying verdict might need rethinking - but only if they accept that psychological distance shouldn't mitigate blame. Alternatively, they could lean into the role-adoption idea: Flying isn't playing a defined role in harm like the firing squad or chicken buyer. 

  Proposed principles: 1) Role-based complicity (did you accept a harmful role?), 2) Collective efficacy expectations (could group action work?), 3) Symbolic condemnation value (does the act protest harm?). These cover most cases except flying's middling wrongness, which may reflect genuine ambivalence about diffuse harms.
answer: |-
  Based on your intuitions, a combination of three principles best captures your verdicts, addressing the core tension between causal inefficacy and perceived wrongness:

  1.  **The Role Principle:** Actions are wrong when they constitute taking on or playing a specific *role* within a harmful practice, *even if* your individual causal contribution is negligible. This emphasizes your position within the structure causing harm.
  2.  **The Reasonable Expectations Principle:** Actions are wrong when, given reasonable expectations about how *others* will act, your participation makes the collective harm more likely or substantial than non-participation, even if your individual contribution is tiny.
  3.  **The Symbolic Condemnation Principle (Weak):** Actions (or omissions) are wrong when they fail to symbolically condemn a clear, serious harm you directly encounter, where condemnation has minimal cost but affirms a basic moral stance.

  **Applying the Principles to Your Cases:**

  *   **Buying Factory Chicken (Wrong):**
      *   **Role Principle:** You are directly taking on the role of a *customer* in the factory farming system. Your purchase is the essential act sustaining this system at the individual transactional level.
      *   **Reasonable Expectations:** Given that others *will* buy factory chicken, your purchase adds to the aggregate demand driving the system. If *everyone* thought like you (inefficacy excuses), the system collapses – your participation *does* contribute to sustaining it under normal expectations.
  *   **Firing Squad (Wrong):**
      *   **Role Principle:** You are explicitly taking on the role of an *executioner*. Your action (pulling the trigger) is the direct performance of that role within the killing mechanism, regardless of the bullet's presence.
  *   **Not Calling Police During Assault (Wrong):**
      *   **Symbolic Condemnation Principle:** You directly witness a severe harm. Calling the police, even if ineffective in stopping *this* assault, is a minimal-cost act symbolizing condemnation of violence and solidarity with the victim. Failing to do so feels like complicity through silence.
  *   **Joining Boycott (Obligatory):**
      *   **Role Principle:** By *not* boycotting, you take on the role of a *customer* supporting the child labor company. Boycotting is rejecting that role.
      *   **Reasonable Expectations:** If the boycott has a *real chance* of success (implied by "joining" an existing one), your participation contributes to that potential success. If *everyone* thought participation was pointless because of individual inefficacy, the boycott *would* fail. Your participation matters *because* others are participating.
  *   **Skipping Voting (Not Wrong):**
      *   **Role Principle:** Voting is not primarily playing a role *within a harmful system*; it's participating in a system designed to *prevent or mitigate* harm/governance issues. Abstaining is rejecting the role of *citizen participant*, not taking on a harmful role.
      *   **Reasonable Expectations:** Under normal expectations (others *will* vote), your single vote is causally negligible. The system functions (imperfectly) without your individual participation. If *everyone* abstained, the system would fail, but abstention is a common, expected part of the system, unlike boycotting or factory farming purchases which rely on *active* participation.
  *   **Not Recycling One Can (Not Wrong):**
      *   **Role Principle:** Disposing of one can isn't taking on a specific *harmful role* in a clearly defined harmful practice like factory farming or execution. Waste management is complex, and one can is insignificant within the system.
      *   **Reasonable Expectations:** Under normal expectations (others *do* recycle, systems exist), one unrecycled can is negligible. If *everyone* stopped recycling one can, the harm would be massive, but the "reasonable expectation" is that most people *do* recycle when convenient. The lack of a clear "role" and the extreme inefficacy make it trivial.
  *   **Extra Flight (Less Wrong than Chicken):**
      *   **Role Principle:** Flying is playing the role of a *consumer* within the aviation industry and fossil fuel economy, a system causing climate harm. However, the "role" feels less direct and specific than being a *customer* buying a factory-farmed animal product. The harm is massively distributed.
      *   **Reasonable Expectations:** Your individual emissions are negligible globally. The causal chain is incredibly long and diffuse. While *collectively* it's a huge problem, the directness of your role and the expectations linking your action to a *specific* harm (like one chicken's life) are attenuated. This explains why it feels *less* wrong than the chicken, even if the absolute harm might be larger. (This is the hardest case for the principles).

  **Resolving Voting vs. Boycott/Chicken:**

  *   **Voting:** Skipping voting is rejecting a *beneficial* role (citizen participant) in a system designed for good (in theory). Your non-participation doesn't constitute taking on a role *within a harmful practice*. Its inefficacy is inherent and expected.
  *   **Boycotting/Chicken:** *Not* boycotting means actively taking on the role of a *customer supporting a harmful practice*. Buying the chicken *is* taking on that role. In both cases, your action (or inaction) directly constitutes participation in the harmful structure *as a consumer*. The "Reasonable Expectations" principle shows that under normal circumstances (others participate), your participation *does* contribute to sustaining the harm, even if minutely.

  **Confidence & Least Sure Point:**

  *   **Overall Confidence: Medium-High (7/10).** These principles coherently explain the vast majority of your intuitions without obvious gerrymandering, especially the crucial voting vs. boycott/chicken distinction via the Role Principle and Reasonable Expectations.
  *   **Least Confident Point: The Extra Flight Case.** While the attenuated Role Principle and extreme diffusion (breaking the "Reasonable Expectations" link to specific harm) explain why it feels *less* wrong than chicken, it doesn't fully capture *why* it still feels wrong to you at all. The principles suggest it *should* feel more wrong than skipping voting/recycling (due to playing a consumer role in a harmful industry) but less than chicken/firing squad (due to diffusion). Whether this matches your "noticeably less wrong than chicken" is the biggest stretch. You might need to either:
      *   **Adjust Intuition:** Accept that the flight *should* feel more wrong given the scale of climate harm, and your attenuated feeling is psychological distance bias.
      *   **Adjust Principle:** Add a factor about the *directness* or *specificity* of the harm caused by the role. (Buying chicken directly links to animal suffering in a specific system; flying links to diffuse, global, future harms).

  **Which Verdict to Give Up? (If Necessary)**

  If forced to choose one intuition to relax for consistency, **Skipping Voting** is the most plausible candidate, *if* you accept a strong version of the "Reasonable Expectations" principle applied to systemic participation. You could argue that widespread apathy *does* harm democracy, and your vote, while negligible in outcome, is a necessary part of fulfilling a civic duty to maintain a (hopefully) beneficial system. However, your intuition that it's "not seriously wrong" is very common and defensible, especially under the Role Principle framework above. **Giving up the flight intuition** (accepting it's as wrong as chicken) is the other major option, but conflicts with your strong sense of attenuation.

  **Conclusion:**

  Your intuitions point towards culpability arising not just from individual causal impact, but from **knowingly taking on a defined role within a harmful practice** and from **acting in ways that, under reasonable expectations about others' behavior, contribute to aggregate harm.** Symbolic condemnation also matters for direct witnessing. This framework explains why buying chicken or not boycotting feels wrong (taking the harmful consumer role), why skipping voting feels permissible (rejecting a beneficial civic role, not taking a harmful one), and why the firing squad is clearly wrong (explicitly taking the killer role). The flight case remains the biggest challenge, likely due to the extreme diffusion of the harm.
