answer: |-
  **Consensus Document on Methodological Individualism and Holism in Social Explanation**

  **Section 1: Substantive Agreements**

  Both methodological individualists (MI) and methodological holists (MH) affirm the following:

  1.  **The Necessity of Individuals:** All social phenomena, including structures, institutions, and norms, are constituted by the actions, interactions, beliefs, and dispositions of individual human beings. There is no "social stuff" existing independently of individuals.
  2.  **Emergence:** Social patterns and properties emerge from the complex interactions of individuals. These emergent properties (e.g., market prices, institutional stability, cultural norms) are real features of the social world and are not always immediately predictable from the properties of isolated individuals.
  3.  **Interdependence:** Individual actions are profoundly shaped by the social context, including existing institutions, norms, and structures. Conversely, these social contexts are maintained or altered through the actions of individuals. Explanations must account for this reciprocal relationship.
  4.  **Microfoundations as an Empirical Question:** Both sides agree that *identifying* microfoundations – the individual-level mechanisms linking individual actions to macro-social outcomes – is a crucial and valuable scientific endeavor for understanding *how* social phenomena work. MH agrees that such mechanisms often exist and are illuminating to find. MI agrees that finding complete, tractable microfoundations for complex phenomena can be extremely difficult.
  5.  **"Shorthand" vs. "Autonomy" Defined:** MI holds that references to social structures/institutions are legitimate *explanatory shorthand* for complex constellations of individual actions, interactions, and beliefs. MH holds that social structures/institutions possess *explanatory autonomy*, meaning they can figure in valid causal explanations *even when* a complete specification of underlying individual mechanisms is unavailable or intractable, and that reducing the explanation solely to individual terms may lose essential information about causal powers operating at the social level.
  6.  **Not Ontological Dualism:** MH is *not* committed to the existence of social entities as supernatural or non-physical substances ontologically separate from individuals. Their claim is about *explanatory practice* and *causal efficacy*, not fundamental substance.
  7.  **Not Atomism:** MI is *not* committed to explaining social phenomena solely by reference to isolated, context-free individuals ("Robinson Crusoes"). MI fully recognizes individuals as socially embedded and influenced. The commitment is that explanations must ultimately bottom out in individuals *in context*, including their beliefs about social structures.
  8.  **Shared Object of Study:** Both aim to explain the same social world: patterns of behavior, institutional persistence/change, cultural norms, collective action problems, etc.

  **Section 2: Precise Residual Disagreements**

  The following table outlines key unresolved points of difference, worded to be acceptable to each side, identifies the core issue (the crux), proposes concrete investigative cases, and records predicted outcomes.

  | Disagreement (Wording Acceptable to Side)                                 | Crux (Sub-Question)                                                                 | Concrete Case / Evidence                                                                 | MI Prediction                                                                                                 | MH Prediction                                                                                                                               |
  | :------------------------------------------------------------------------ | :---------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------ |
  | **MI:** For a social explanation invoking structure/institution `S` to be *complete*, it *must* be possible, in principle, to provide a non-circular specification of the individual-level mechanisms (actions, interactions, beliefs) that constitute `S` and link it to the explanandum. <br> **MH:** A social explanation invoking structure/institution `S` can be *causally adequate* and *complete* for its explanatory purpose *even if* such a full, non-circular individual-level specification is currently unavailable or practically intractable, provided `S` exhibits stable causal powers observable at the macro-level. | Does the *explanatory adequacy* of a social-structural cause (`S`) *depend logically* on the current availability or practical tractability of its complete, non-circular microfoundations? | **Bank Run Trigger:** Analyze historical/cross-national bank run triggers. Focus on cases where systemic rules (e.g., fractional reserve limits, deposit insurance schemes) were stable, but specific triggering events varied. | MI: The systemic rules are only explanatory shorthand. The *complete* explanation requires detailing how the rules shaped *individual depositors'* specific beliefs/perceptions leading to panic *in each case*. Lack of this detail renders the structural explanation incomplete. | MH: The systemic rules (e.g., inherent instability of fractional reserve banking) are a primary, autonomous cause. They explain the *propensity* for runs and constrain possible triggers. Detailed individual panic mechanisms, while interesting, are not necessary for the core causal explanation of why runs *can* occur readily in that system. |
  | **MI:** Any persistent macro-social pattern `P` (e.g., residential segregation, stable institution, widespread norm) *must* be sustained by the continuous (though perhaps changing) actions and interactions of individuals holding specific beliefs and dispositions. `P` cannot persist if the relevant individual-level states cease to exist or change sufficiently. <br> **MH:** Some macro-social patterns `P` (e.g., specific forms of segregation, institutional logics, normative pressures) can exhibit stability and causal influence *decoupled* from the specific beliefs and dispositions of the *current* individuals within `P`, being maintained by the pattern/structure itself through mechanisms like path dependence, institutional inertia, or positional roles. | Can a macro-social pattern `P` causally maintain its own stability (and influence individual behavior) *independently* of the *specific*, non-structural beliefs and dispositions held by the *majority* of individuals currently constituting `P`? | **Residential Segregation:** Study a city with persistent racial/ethnic segregation despite significant demographic turnover and survey data showing declining individual preferences for segregation among both incoming and long-term residents. | MI: The persistence *must* be explained by continuously operating individual mechanisms (e.g., subtle biases in realtor behavior, wealth disparities rooted in past discrimination affecting choices, network effects based on current social ties). If individual preferences truly changed *enough*, the pattern would dissolve. | MH: The segregated pattern itself, established historically (e.g., via redlining), generates self-reinforcing mechanisms (e.g., school funding tied to property taxes, perceived neighborhood "quality" based on past pattern, institutional inertia in zoning) that persist and shape choices *independently* of the current aggregate level of individual discriminatory preferences. The pattern causes its own persistence. |
  | **MI:** The "causal powers" attributed to social structures are always derivative, arising solely from the causal powers of the individuals who enact, maintain, or respond to the structure. Structures do not possess *irreducible* causal powers. <br> **MH:** Social structures possess *emergent causal powers* that are not reducible without explanatory loss to the causal powers of their constituent individuals considered in isolation or in simple aggregates. The structure itself, as a complex relational system, enables/disables certain actions and outcomes. | Does a specific social structure `S` confer causal powers (e.g., enabling/disabling certain types of actions or outcomes) that are *strictly attributable* to the relational/systemic properties of `S` itself, and *not* derivable solely from the intrinsic properties of the individuals occupying positions within `S`? | **Institutional Persistence & Turnover:** Examine a long-standing formal organization (e.g., a specific university, corporation, court system) that maintains core functions, procedures, and "logics" despite complete turnover of its members, leadership, and staff over a defined period (e.g., 50 years). | MI: Persistence is explained by new individuals being selected, socialized, and incentivized to replicate the behaviors and beliefs that constitute the institution's procedures and logics. The "causal power" lies in the *individuals'* learned dispositions and responses to incentives/sanctions. | MH: The institutional structure itself (roles, rules, procedures, physical infrastructure, relational networks) possesses causal powers (e.g., constraining choices, defining legitimate action, processing cases) that persist and shape the behavior of *any* individual entering the relevant positions, largely independent of their pre-existing personal dispositions. The structure causes its own replication. |
  | **MI:** Norms `N` only exist as the aggregate of individual normative attitudes (beliefs about what one *should* do, expectations about what others *will* do/should do, conditional preferences). Changes in `N` are fully explained by changes in these individual attitudes. <br> **MH:** Norms `N` can exert causal influence on behavior and attitudes as emergent social facts. `N` can persist through changes in individual attitudes (within bounds) and can shape those attitudes, exhibiting downward causation. | Can a norm `N` cause changes in individual behavior *prior to* and potentially *inducing* changes in the corresponding individual normative attitudes (beliefs, expectations)? | **Rapid Norm Change:** Analyze a swift, widespread behavioral shift following a new law/policy/social movement that establishes a new norm `N` (e.g., smoking bans in public places, sudden shift in workplace dress code expectations). Track survey data on individual attitudes *before*, *during*, and *after* the behavioral shift. | MI: The behavioral change occurs only when a sufficient number of individuals change their attitudes (e.g., belief in the law's legitimacy, fear of sanction, new belief about health risks, updated expectations about others' behavior/punishment). Attitude change precedes or co-occurs with behavior change. | MH: The establishment of the new rule/structure (`N`) itself causes behavioral compliance *initially* through mechanisms like sanctions or coordination, even among individuals who privately disagree or hold outdated attitudes. Sustained compliant behavior can *then* lead to a shift in individual attitudes (internalization). Behavior change precedes widespread attitude change. |

  **Section 3: Verbal Dispute Flag**

  *   **"Autonomy" vs. "Shorthand":** Part of the disagreement over the term "explanatory autonomy" (MH) versus "explanatory shorthand" (MI) is likely verbal, relating to the *strength* of the claim about the relationship between levels. Both agree social-structural concepts are used in explanations. The core non-verbal dispute is whether such concepts can be *causally adequate* explanations *without* being grounded in (or reducible to) specific, non-circular individual mechanisms (Agreement 5 & Disagreement Table Row 1). The disagreement is about the logical status and necessity of microfoundations for causal adequacy, not merely the convenience of the terminology.
