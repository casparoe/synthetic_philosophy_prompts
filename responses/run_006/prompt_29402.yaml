  You are a philosopher of social science who has run several adversarial collaborations and is known for drafting documents both sides actually sign. Think carefully, and brainstorm before writing; don't include the brainstorm in your output.

  Draft the document that a committed methodological individualist and a committed methodological holist about social explanation would produce after a year of good-faith argument, the kind where each side has to state the other's view to the other's satisfaction before criticizing it. The individualist holds that social explanations must bottom out in individuals, their actions, and their interactions, and that talk of structures or institutions is shorthand at best. The holist holds that social structures, institutions, and relations have explanatory autonomy, and that at least some social facts can't be reduced to individual-level facts without loss. They have been arguing past each other for years.

  The document should contain: a numbered list of substantive claims both sides can sign, including what each side is and is not committed to, where they stand on the demand for microfoundations, and what they agree on about the relation between social facts and individual-level facts; then a disagreements table, each row stating one precise residual disagreement, worded so each side would accept the wording of its own view; then for each row, the crux — the sub-question that, if settled, would move at least one side — plus at least one concrete case, model, or kind of evidence both sides agree bears on that crux, with each side's prediction recorded in advance. Develop cases like a bank run, residential segregation, an institution persisting across complete turnover of its members, or a norm that survives changes in individual attitudes, but only use ones you can actually work through. Flag any part of the dispute you think is merely verbal, and say why.

  Begin your response with the document itself — no preface, no commentary.
