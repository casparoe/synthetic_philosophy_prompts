  First, I need to outline agreements. Both sides likely agree that social facts emerge from individuals but disagree on reducibility. They'd agree that institutions depend on individuals but might not be reducible without loss. Microfoundations are key here—individualists demand them, holists see them as sometimes unnecessary. 

