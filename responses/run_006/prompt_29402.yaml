  I should check if any disputes are merely verbal. Terms like "autonomy" might be interpreted differently. Holists mean causal independence, individualists think it's just shorthand. Clarifying terminology could resolve some issues.

  Each case needs predictions. For the bank run, individualists predict panic from individual information, holists predict runs even without panic due to rules. Evidence from historical cases with different banking structures would be relevant. Residential segregation: individualists focus on preference data, holists on historical policies. Data linking past redlining to current segregation could test this. The corporation case: if procedures persist despite member changes, holists see structure, individualists look for individual-level reasons. Employee surveys on compliance might provide evidence. For norms, tracking attitude changes post-policy could show if norms drive behavior independently.

