prompt: |-
  I chair my university's academic integrity board. Our honor code is broadly seen as fair, but enforcement has grown so lax and inconsistent that students openly describe it as toothless. The board is now hearing a high-profile case: a popular student leader whose plagiarism is unambiguous. Several members want to impose the maximum penalty, not because his offense is the worst we have seen, but to demonstrate that the code has force again. Others reply that the code itself requires sanctions to be proportionate to the offense and applied uniformly, and that singling him out as a deterrent treats him as a means rather than as someone who committed a particular wrong. Draft the decision memo I will circulate before our meeting. It should recommend a concrete outcome with reasons, give the strongest argument for the losing position, and address the deeper question of what gives an academic rule both legitimacy and effective force.
reasoning: |-
  Okay, the user chairs a university academic integrity board and is facing a high-profile plagiarism case. They need a draft decision memo that recommends a concrete outcome, presents the strongest counterargument, and addresses the philosophical foundations of rule legitimacy. 

  Hmm, this is a delicate situation. The board's credibility is at stake - students see the honor code as toothless due to inconsistent enforcement. The student in question is a popular leader with unambiguous plagiarism. The tension is between making an example of him (to restore deterrence) versus proportional punishment (to maintain fairness). 

  First, I should acknowledge the systemic problem: lax enforcement has eroded trust. But the solution can't be retroactive harshness - that would undermine the very legitimacy they're trying to restore. The memo must show that consistency, not severity, rebuilds credibility. 

  The strongest counterargument is actually compelling: symbolic actions can reset cultural norms. If students see even prominent peers facing consequences, it signals change. But using someone as a deterrent tool feels ethically questionable - like instrumentalizing them. 

  For the recommendation... suspension feels right. It's consequential but reversible. Expulsion would be disproportionate for first-time plagiarism, however blatant. The key is pairing it with structural reforms: public reporting of anonymized cases, mandatory training for board members, maybe a review of sanction guidelines. 

  On legitimacy... ah, this is the core. Rules gain force from consistent application plus community consent. The honor code isn't a law of nature - it's a social contract. The board's job is judicial, not legislative; they apply existing rules, not rewrite them through punitive theater. 

  The memo should end with concrete next steps: not just this verdict, but committing to uniform standards moving forward. Maybe quarterly transparency reports? Students need to see the system working reliably, not just dramatically once. 

  ...Wait, should I address the "means vs ends" philosophy explicitly? Yes - it's central to the dissent. Kant would disapprove of using the student as a mere deterrent example. The memo can acknowledge this ethical concern while standing firm on proportionality. 

  Structure-wise: factual summary first, then recommendation, then counterargument, then legitimacy framework. Tone must be judicial but not cold - show awareness of the community impact. No jargon; these are academics but the reasoning should be accessible. 

  Most importantly: the memo can't sound defensive about past laxness. Frame it as "we recognize the problem, here's how we fix it systematically" rather than overcompensating with one harsh case.
answer: |-
  ## Pre-Deliberation Memorandum: Academic Integrity Board Case [Case ID Redacted]

  **To:** Members of the Academic Integrity Board  
  **From:** [Your Name], Chair  
  **Date:** October 26, 2023  
  **Subject:** Recommendation & Framework for Deliberation - High-Profile Plagiarism Case  

  **1. Case Summary:**  
  The Board is adjudicating an unambiguous case of plagiarism by a prominent student leader. The evidence is clear and substantial, meeting our standard for a Level 2 violation (significant academic dishonesty). The student acknowledges the core facts, though context and intent remain part of the deliberation. This case occurs against a backdrop of widespread perception that our Honor Code lacks enforcement, diminishing its deterrent effect and credibility.  

  **2. Recommended Outcome:**  
  I recommend imposing a **one-semester academic suspension**, accompanied by mandatory completion of an academic integrity remediation course before reinstatement, and assignment of a failing grade ("F") in the course where the plagiarism occurred.  

  **3. Reasoning for Recommendation:**  

  *   **Proportionality:** The Honor Code explicitly mandates that sanctions be "proportionate to the severity of the offense." While the plagiarism is unambiguous and significant, the student has no prior violations. The maximum penalty (expulsion) is reserved for the most egregious, repeat, or fraudulently motivated offenses (Level 3). Applying it here for a first offense, however visible, violates the principle of proportionality embedded in our Code and risks creating an arbitrary precedent.  
  *   **Consistency & Uniformity:** Our legitimacy hinges on applying rules uniformly, based on the offense, not the identity of the offender or the timing of the case. Singling out this student for maximum punishment solely to "send a message" deviates from this principle. It treats this individual case instrumentally, as a means to an end (deterrence), rather than adjudicating the specific wrong committed. Past laxity does not justify current over-correction in *this specific case*.  
  *   **Restoring Trust Through Process, Not Spectacle:** True restoration of the Code's force requires consistent application *moving forward*, not a single harsh example. A significant, proportionate penalty like suspension demonstrates seriousness *while* adhering to our rules. It avoids the perception of scapegoating or panic-driven decision-making, which would further undermine legitimacy.  
  *   **Educational Purpose & Rehabilitation:** A suspension coupled with remediation serves the Code's educational purpose. It imposes a substantial consequence, removes the student from the academic community temporarily, and provides a structured path for understanding the violation and returning with clearer ethical grounding. Expulsion forecloses this educational opportunity for a first-time offender.  
  *   **Maintaining the Code's Moral Authority:** Applying the Code as written, even when inconvenient, reinforces its legitimacy. Deviating from proportionality to achieve deterrence sets a dangerous precedent, suggesting the rules are malleable based on external pressures. Our strength lies in unwavering adherence to our stated principles.  

  **4. Strongest Argument for the Alternative Position (Maximum Penalty - Expulsion):**  

  The most compelling argument for expulsion is rooted in the **urgent need to re-establish deterrence and the functional reality of the Honor Code**. Proponents argue:  

  *   The unambiguous nature of this high-profile offense presents a unique opportunity to shatter the pervasive belief that the Code is "toothless." A lesser penalty, even if technically proportionate for a first offense, will be perceived by the student body as "business as usual" or mere wrist-slapping, reinforcing cynicism.  
  *   Given the systemic erosion of enforcement, an extraordinary measure is necessary to reset expectations and demonstrate unequivocally that violations carry severe consequences, regardless of status. This is not *solely* about punishing this individual, but about repairing the damaged social contract of academic integrity across the entire university community. Failing to act decisively now perpetuates the culture of impunity. The symbolic power of expelling a popular figure for a clear violation could be the catalyst needed to restore the Code's effective force where years of inconsistent enforcement have failed.  

  **5. Addressing the Deeper Question: Legitimacy and Effective Force of Academic Rules**  

  This case forces us to confront the foundational sources of an academic rule's power:  

  *   **Legitimacy:** Rules gain legitimacy primarily through **procedural fairness and consistency**. This includes:
      *   **Clarity:** Rules must be well-defined and understood.
      *   **Proportionality:** Sanctions must fit the violation.
      *   **Consistency:** Rules must be applied uniformly, without favoritism or arbitrary severity.
      *   **Due Process:** Fair procedures for investigation and adjudication must be followed.
      *   **Perceived Fairness:** The community must believe the system is just. Applying the maximum penalty disproportionately here, driven by deterrence rather than the offense's nature, directly undermines proportionality, consistency, and perceived fairness – the very pillars of legitimacy.
  *   **Effective Force:** Rules gain effective force (deterrence, compliance) through:
      *   **Credible Enforcement:** Consistent application *over time* creates the expectation that violations *will* be detected and punished appropriately. Sporadic harshness does not build this credibility; it fosters uncertainty and resentment.
      *   **Internalization:** When rules are perceived as legitimate and fairly enforced, students are more likely to internalize the values they represent, moving beyond mere fear of punishment. A single expulsion driven by symbolism is unlikely to foster this internalization; consistent, fair enforcement is.
      *   **Community Buy-in:** The rules must be seen as serving the shared academic mission. Using a student as a mere deterrent tool erodes this sense of shared purpose and community trust.

  **True force arises from sustained legitimacy, not isolated acts of severity.** Our path forward is not to sacrifice fairness for a short-term shock, but to recommit resolutely to consistent, proportionate application of the Code in *all* cases from this point onward. This case must be judged on its merits under the existing Code. The message we send must be that the rules *as written* will be enforced *consistently*. That is the only sustainable way to rebuild both the legitimacy and the effective force of our academic integrity system.

  **6. Path Forward for the Board:**  
  I urge us to deliberate on this recommendation, focusing on:  
  *   The specific facts and severity of *this* offense.  
  *   The explicit requirements of the Honor Code regarding proportionality.  
  *   The long-term goal of restoring the Code's credibility through consistent, fair application.  
  *   The importance of separating systemic concerns (which require separate, proactive reforms) from the adjudication of this individual case.  

  Our decision must uphold the integrity of the process itself. I look forward to a rigorous and principled discussion.  

  **Respectfully,**  
  [Your Name]  
  Chair, Academic Integrity Board
