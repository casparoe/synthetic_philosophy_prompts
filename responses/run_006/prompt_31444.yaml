prompt: |-
  I run a programme evaluation unit at a mid-sized foundation. We fund interventions—job training, health outreach, educational software—and then try to determine whether they caused the outcomes we see. My analysts know their statistics, but I have noticed they default to one causal framework without realising there is a choice: they treat causation as a counterfactual (would the outcome have happened without the programme?) and never consider the interventionist alternative (is there a well-defined manipulation of the programme variable that changes the outcome, and can we isolate it from confounders?). I gather that the philosophical literature on causation has explored this distinction in depth, and that it matters practically—some causal claims that look fine under one framework are suspicious under the other, and vice versa.

  Write me a reusable decision procedure my team can follow when assessing a causal claim about a programme we have funded. It should walk an analyst through the questions that distinguish what the two frameworks demand, flag where they agree and where they diverge, and specify what kind of evidence is needed to satisfy each. The procedure must be usable by someone with graduate-level statistical training but no philosophy background, in under an hour per case. Mark the steps where judgment cannot be eliminated.

  Then apply the procedure to two cases:

  1. A job-training programme in a single city where we have a randomised controlled trial with clean compliance.
  2. A national advocacy campaign for vaccine uptake where randomisation is impossible and we are working with observational data and an instrumental variable whose exclusion restriction is debated.

  Your response should follow this structure:

  - **Distinction in Practice** (roughly 15%): a short, non-technical explanation of the counterfactual/interventionist distinction as it bears on programme evaluation—just enough for an analyst to see why the procedure asks the questions it does.
  - **The Procedure** (roughly 45%): the step-by-step decision procedure, presented as numbered questions with decision rules, branching logic, and explicit handoff points where an analyst must consult a supervisor or the procedure cannot settle the matter.
  - **Application: Job Training** (roughly 20%): run the procedure on this case, showing each step and the conclusion reached.
  - **Application: Vaccine Advocacy** (roughly 20%): run the procedure on this case, showing where the procedure forces a conclusion weaker or more awkward than the team's default counterfactual reasoning would deliver, and what the analyst should report as a result.
reasoning: |-
  We are given two causal frameworks: counterfactual and interventionist.
  - **Counterfactual approach**: Asks "Would the outcome have been different for this unit if, contrary to fact, the treatment had been different?" This is the Rubin causal model (potential outcomes) that underlies RCTs and matching methods.
  - **Interventionist approach**: Asks "Is there a well-defined manipulation (intervention) on the treatment variable that would change the outcome, and can we isolate the effect of this manipulation from confounders?" This is more aligned with the do-calculus of Pearl and emphasizes the need for a clear intervention that could be implemented.

  In practice, the two frameworks often agree in simple settings (like RCTs) but may diverge in complex ones (like when we have an instrumental variable or when the "treatment" is not well-defined as a manipulable intervention).

  **Distinction in Practice (15%)**:
  In programme evaluation, the counterfactual framework is the default in statistics: we compare observed outcomes to what would have happened without the program. The interventionist framework, however, requires that the treatment variable (the program) be defined in terms of a specific manipulation that could, in principle, be carried out. This matters because:
  - Some counterfactual claims might not correspond to any feasible intervention (e.g., "What if we had given the program to those who didn't receive it?" when the non-receivers are fundamentally different and the program couldn't be given to them in the same way).
  - The interventionist framework forces us to consider the stability of the causal relationship under external interventions and the possibility of confounding by variables that might change if we were to manipulate the treatment.

  **The Procedure (45%)**:

  We design a decision procedure with the following steps. The goal is to evaluate a causal claim about a program. The procedure asks questions that help determine whether the claim holds under both frameworks, and if not, why.

  1. **Define the causal question precisely**:
     - What is the treatment (T) and what is the outcome (Y)? 
     - What is the population of interest?
     - What is the time frame?
     *Note: This step is common to both frameworks.*

  2. **Counterfactual Framework Check**:
     - *Question 2.1*: Can we define a clear counterfactual outcome for each unit? (That is, what would Y have been if T had been different?) 
     - *Decision rule*: If yes, proceed. If no (e.g., because the treatment is ill-defined or the unit's characteristics make the counterfactual implausible), then the counterfactual framework may not be applicable. Flag for supervisor.

  3. **Interventionist Framework Check**:
     - *Question 3.1*: Can we describe a well-defined, feasible intervention that would change T? (This intervention must be independent of the unit's characteristics and the outcome mechanism.)
     - *Question 3.2*: Can we isolate the effect of this intervention from confounders? (That is, is there a way to break the spurious associations between T and Y due to common causes?)
     - *Decision rule*: If both 3.1 and 3.2 are "yes", then the interventionist framework is satisfied. If either is "no", then the interventionist framework is not satisfied.

  4. **Compare the frameworks**:
     - If both frameworks are satisfied, then the causal claim is robust.
     - If only the counterfactual framework is satisfied, then the causal claim is valid in the counterfactual sense but may not correspond to a feasible intervention. This is common in cases where the treatment assignment is not manipulable (e.g., race, gender) or when the counterfactual is defined but the intervention is vague.
     - If only the interventionist framework is satisfied, this is unlikely because the counterfactual is usually implied by an intervention. However, in some complex designs (e.g., instrumental variables) the interventionist framework might be satisfied without having unit-level counterfactuals.

  5. **Handling disagreements**:
     - If the two frameworks disagree (i.e., one is satisfied and the other is not), then the causal claim must be qualified. The analyst must report:
       a. The claim as supported by the satisfied framework.
       b. The reason the other framework is not satisfied.
       c. The limitations this imposes on the interpretation.

  6. **Judgment steps**:
     - Step 2.1 (defining counterfactuals) requires judgment when the treatment is not clearly defined or when the unit's characteristics make the counterfactual world implausible (e.g., "what if this person were of a different race?").
     - Step 3.1 (defining a feasible intervention) requires judgment: what counts as feasible? This may depend on the context and must be discussed with stakeholders.
     - Step 3.2 (isolating the effect) requires statistical and design judgment: are the methods (e.g., RCT, IV, regression adjustment) sufficient to break confounding? This step may require consultation with a supervisor, especially when the identification strategy is debated.

  **Application: Job Training (20%)**

  *Case*: A job-training programme in a single city with a randomised controlled trial and clean compliance.

  1. **Define the causal question**:
     - T: Participation in the job-training programme (binary: yes/no).
     - Y: Employment status after 6 months (binary: employed/unemployed).
     - Population: Unemployed individuals in the city who volunteered for the program.
     - Time frame: 6 months after program completion.

  2. **Counterfactual Framework Check**:
     - *2.1*: Can we define a clear counterfactual? Yes. For each participant, what would their employment status have been if they had not received the training? Because of the RCT, we can estimate the average treatment effect by comparing the treated group with the control group. The counterfactual for the treated group is the control group's outcome.

  3. **Interventionist Framework Check**:
     - *3.1*: Can we describe a well-defined intervention? Yes. We can randomly assign eligible volunteers to either receive the training or not (which is exactly what was done). The intervention is clear: offering the training program to a randomly selected subset of volunteers.
     - *3.2*: Can we isolate the effect from confounders? Yes. Randomization ensures that, on average, the treatment and control groups are comparable in all observed and unobserved characteristics. Therefore, we can attribute the difference in outcomes to the treatment.

  4. **Compare**: Both frameworks are satisfied. The causal claim is robust.

  **Conclusion for Job Training**: We can confidently say that the job-training program caused a change in employment rates. The effect size is the average treatment effect from the RCT.

  **Application: Vaccine Advocacy (20%)**

  *Case*: A national advocacy campaign for vaccine uptake. Randomisation is impossible. We use observational data and an instrumental variable (IV) whose exclusion restriction is debated.

  - The IV: Suppose we use the intensity of advocacy efforts in geographically similar regions as an instrument for the campaign exposure in a given region. The exclusion restriction requires that the instrument (advocacy intensity in similar regions) affects the outcome (vaccine uptake in the target region) only through the campaign exposure in the target region. But there is debate: maybe advocacy in similar regions also affects the target region through other channels (e.g., social media spillover that directly influences behavior without going through the campaign's local exposure).

  1. **Define the causal question**:
     - T: Exposure to the advocacy campaign (e.g., measured by awareness of the campaign or by the intensity of campaign activities in the region).
     - Y: Vaccine uptake rate in the region.
     - Population: Regions (or individuals) in the nation.
     - Time frame: During and shortly after the campaign.

  2. **Counterfactual Framework Check**:
     - *2.1*: Can we define a clear counterfactual? Yes, in principle. We can ask: what would the vaccine uptake have been in a region if it had not been exposed to the campaign? However, without random assignment, we rely on the IV to estimate the counterfactual for the exposed regions. The IV method estimates a local average treatment effect (LATE) for the "compliers" (regions that are influenced by the instrument). So we can define a counterfactual for these regions.

  3. **Interventionist Framework Check**:
     - *3.1*: Can we describe a well-defined intervention? This is tricky. The intervention we are considering is the campaign exposure. But note: in the IV setting, the intervention we are actually evaluating is the effect of the instrument (which is a proxy for the campaign exposure). The interventionist framework requires a clear manipulation on T. However, we are using an instrument to mimic an experiment. The intervention we are considering under the IV is the manipulation of the instrument (e.g., changing the advocacy intensity in similar regions) and then seeing the effect on T and then on Y. But is this the intervention we care about? We care about the campaign exposure (T) in the target region. The instrument is a different intervention. So we must reframe: the interventionist question becomes: "What would happen to vaccine uptake if we were to change the advocacy intensity in similar regions?" This is not the same as changing the campaign in the target region. Therefore, the intervention we are evaluating (via the instrument) is not the same as the treatment we defined (T). This is a mismatch.

       Alternatively, if we can define the intervention as the instrument (Z) and then interpret the effect as the effect of Z on Y (which is mediated by T) then we can proceed. But note: the exclusion restriction is debated, meaning that there might be a direct path from Z to Y not through T. This breaks the required isolation.

     - *3.2*: Can we isolate the effect? The IV method requires that the exclusion restriction holds (no direct effect of Z on Y and no unmeasured confounders of Z and Y). But because the exclusion restriction is debated, we cannot be sure that we have isolated the effect of T on Y. The IV estimate might be biased.

       Therefore, for the intervention we care about (T), we do not have a well-defined intervention that we can manipulate independently? And even for the instrument, we cannot isolate the effect because of the potential violation of the exclusion restriction.

       So we answer:
          *3.1*: Not satisfied for T (the campaign exposure). But if we redefine the intervention as the instrument (Z), then we can say that manipulating Z is well-defined (e.g., we can decide on the intensity of advocacy in similar regions). However, note that the original causal question was about the campaign (T), not about the instrument (Z). So we have a mismatch.

          *3.2*: Not satisfied because of the potential violation of the exclusion restriction.

  4. **Compare**:
     - Counterfactual framework: satisfied (with the caveat that the IV method gives a LATE for a specific subgroup, and the exclusion restriction is debated but we are assuming it holds for the counterfactual to be defined in the IV context).
     - Interventionist framework: not satisfied for the treatment T (the campaign exposure). Even if we reframe to the instrument Z, we cannot isolate the effect because of the debated exclusion restriction.

  5. **Conclusion for Vaccine Advocacy**:
     - The counterfactual framework (using IV) allows us to estimate a causal effect (the LATE) under the assumption of exclusion. However, the interventionist framework is not satisfied because:
          a. The intervention we care about (the campaign exposure) is not directly manipulated in the IV design (instead we are manipulating the instrument).
          b. The IV design fails to isolate the effect because the exclusion restriction is in doubt.

     - Therefore, the analyst should report:
          - Under the counterfactual framework, we can estimate an effect of the campaign on the complier regions (if we assume the exclusion restriction). But note: the effect is not for the entire population, only for the regions that are influenced by the instrument (the compliers).
          - Under the interventionist framework, we cannot make a causal claim about the campaign exposure (T) because we lack a well-defined manipulation and because the IV design does not isolate the effect due to potential violation of the exclusion restriction.

     - The team should therefore be cautious. They might report the IV estimate but with a strong caveat about the exclusion restriction. They should note that the causal claim is not supported by the interventionist framework and that the counterfactual claim is contingent on an assumption that is debated.

  **Final Note**: The procedure highlights that in the vaccine case, the team's default counterfactual reasoning would deliver a causal estimate (with assumptions) but the interventionist framework forces a weaker conclusion: we cannot claim that the campaign exposure (T) causes vaccine uptake (Y) in a way that corresponds to a feasible intervention without further evidence to support the exclusion restriction.

  In summary, the decision procedure forces the analyst to confront the limitations of the IV design and report the causal claim with appropriate qualifications.
answer: |-
  ### Distinction in Practice
  Causal inference in programme evaluation hinges on two philosophical frameworks:  
  - **Counterfactual (Potential Outcomes)**: Asks, "For a specific unit, what would the outcome have been if we changed the treatment status?" It focuses on comparing observed outcomes to hypothetical alternatives.  
  - **Interventionist (Manipulationist)**: Asks, "Can we define a specific, feasible intervention on the treatment variable that would change the outcome, independent of confounders?" It emphasises real-world actions and isolation from confounding factors.  

  **Why it matters**:  
  The counterfactual framework is intuitive (e.g., RCTs) but can justify claims where no practical intervention exists (e.g., "What if this person had a different birth year?"). The interventionist framework guards against such "ghost interventions" and ensures findings inform actionable decisions. They often align in clean RCTs but diverge in observational studies or when treatment definitions are ambiguous.  

  ---

  ### The Procedure  
  **Goal**: Assess whether a causal claim holds under both frameworks. Use this for any programme evaluation.  
  **Inputs**: Defined treatment (T), outcome (Y), population, and data.  
  **Output**: Causal claim strength (robust, counterfactual-only, interventionist-only, or weak/none) and required evidence.  
  **Time**: <60 minutes.  
  **Judgment Steps**: Marked with ⚠️.  

  #### Step 1: Define the Causal Claim  
  1.1. **Specify T and Y**: What is the treatment (e.g., "job training participation")? What is the outcome (e.g., "employment at 6 months")?  
  1.2. **Define the population**: Who is affected (e.g., "unemployed adults in City X")?  
  1.3. **Clarify the intervention**: Is T described as a concrete action (e.g., "assigning a trainer") or a vague state (e.g., "motivation level")?  
  *→ Proceed to Step 2.*

  #### Step 2: Counterfactual Check  
  *Tests: "Can we estimate what would have happened without T?"*  
  2.1. **Unit-level comparability**: Can we identify units (e.g., individuals) with similar characteristics but different T?  
  - *If RCT or strong quasi-experimental design (e.g., propensity score matching)*: **Yes**.  
  - *If observational data with unmeasured confounders*: **No** → Flag: "Counterfactual claim requires stronger design."  
  2.2. **Consistency of counterfactuals**: ⚠️ Is the counterfactual outcome (e.g., "Y if T=0") *plausible*? Consider:  
  - Would changing T alone (holding all else fixed) make sense? (e.g., job training without changing location is plausible; "retroactively changing childhood vaccination" is not.)  
  - *If implausible*: **Stop**. Claim fails counterfactual test. Consult supervisor.  
  *→ If both 2.1 and 2.2 are "Yes," claim satisfies counterfactual framework. Proceed to Step 3.*

  #### Step 3: Interventionist Check  
  *Tests: "Can we manipulate T independently, and isolate its effect?"*  
  3.1. **Well-defined intervention**: ⚠️ Describe an intervention that *changes T* (e.g., "assigning a trainer"). Is it:  
  - **Feasible** (e.g., "we could randomise trainer assignment")?  
  - **Stable** (e.g., intervention doesn’t alter confounders like economic conditions)?  
  - *If vague (e.g., "increase civic engagement")*: **No** → Flag: "T is not actionable."  
  3.2. **Isolation from confounders**: Can we break links between T and confounders (e.g., via randomisation or causal diagrams)?  
  - *If RCT*: **Yes** (randomisation severs confounder links).  
  - *If observational data*: **No** unless:  
    - Confounders are measured *and* adjusted for, *or*  
    - A natural experiment (e.g., IV) isolates exogenous variation.  
  - *If unmeasured confounders*: **No** → Flag: "Effect may be confounded."  
  *→ If both 3.1 and 3.2 are "Yes," claim satisfies interventionist framework.*

  #### Step 4: Resolve and Report  
  4.1. **Agreement**:  
  - **Both frameworks satisfied**: Claim is **robust**. Report: "Causal effect is well-supported for actionable decisions."  
  - **Neither satisfied**: Claim is **weak**. Report: "No causal evidence; redesign evaluation."  
  4.2. **Disagreement**:  
  - **Counterfactual-only** (e.g., observational IV with weak isolation): ⚠️ Report: "Effect estimated *if* counterfactuals hold, but not actionable. Limit to descriptive claims (e.g., associations). Consult supervisor."  
  - **Interventionist-only** (rare; e.g., clear intervention but poor counterfactual data): Report: "Actionable under defined intervention, but statistical uncertainty high. Re-run with better data."  
  4.3. **Evidence required**:  
  - **Counterfactual**: Controlled variation (RCT, matching, IV).  
  - **Interventionist**: Feasible manipulation + isolation (RCT, do-calculus, front-door adjustment).  

  ---

  ### Application: Job Training Programme  
  **Context**: RCT with clean compliance in one city. T = job training, Y = employment.  

  **Step 1: Define Claim**  
  - T: "Assignment to job training."  
  - Y: "Employment status at 6 months."  
  - Population: "Unemployed volunteers in City X."  
  - Intervention: Concrete ("random assignment to training").  

  **Step 2: Counterfactual Check**  
  - 2.1: **Yes** (RCT ensures comparability).  
  - 2.2: **Yes** (withholding training is plausible).  
  → *Counterfactual framework: Satisfied.*  

  **Step 3: Interventionist Check**  
  - 3.1: **Yes** (random assignment is feasible/stable).  
  - 3.2: **Yes** (RCT severs confounder links).  
  → *Interventionist framework: Satisfied.*  

  **Step 4: Resolve**  
  - **Robust claim**: "Job training *causes* increased employment. Suitable for scaling."  
  - Evidence: RCT provides both counterfactual contrast and intervention isolation.  

  ---

  ### Application: Vaccine Advocacy Campaign  
  **Context**: National campaign, observational data, IV = "intensity in similar regions." Exclusion restriction debated (may directly affect uptake).  

  **Step 1: Define Claim**  
  - T: "Exposure to advocacy campaign."  
  - Y: "Vaccine uptake rate."  
  - Population: "All regions in Nation Y."  
  - Intervention: Ambiguous (T is exposure, not direct action).  

  **Step 2: Counterfactual Check**  
  - 2.1: **Yes** (IV estimates counterfactual via "compliers" similar under instrument).  
  - 2.2: **Yes** (counterfactual "no exposure" is plausible).  
  → *Counterfactual framework: Satisfied (if IV assumptions hold).*  

  **Step 3: Interventionist Check**  
  - 3.1: ⚠️ **Unclear/No**. Intervention on T ("increase campaign exposure") is not direct. IV uses instrument (Z = "intensity in similar regions"), but:  
    - Is manipulating Z feasible? **Yes** (e.g., policymakers could intensify ads in neighboring regions).  
    - But Z ≠ T. The *actual intervention* is Z, not T. Reframe: "Effect of Z on Y, mediated by T."  
  - 3.2: **No**. Exclusion restriction debated → Z may directly affect Y (e.g., spillover effects), breaking isolation.  
  → *Interventionist framework: Not satisfied.*  

  **Step 4: Resolve**  
  - **Counterfactual-only claim**:  
    - Default counterfactual conclusion: "IV suggests a local average treatment effect (LATE) for compliers."  
    - Procedure forces weaker conclusion: "Effect of Z (not T) is estimated, but not isolated due to potential direct effects. Causal claim about *campaign exposure (T)* is not actionable."  
  - **Report**:  
    > "Under counterfactual reasoning, IV estimates a LATE for regions responsive to neighboring advocacy. However, the interventionist framework is not satisfied: (1) T is not directly manipulable, and (2) the IV may violate exclusion (direct effects). We cannot recommend scaling the *campaign* based on this evidence. Instead, report: 'Neighboring-region advocacy intensity correlates with local uptake, but causality is uncertain.'"  

  **Why this diverges**: Counterfactual IV assumes away direct effects; interventionist framework flags this as untestable and possibly confounding. The team must downgrade claims from "campaign causes uptake" to "instrument correlates with uptake."
