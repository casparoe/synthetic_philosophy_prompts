prompt: |-
  I am a senior legislative drafter at a federal agency. My office writes and reviews the text of regulations before they are published in the Federal Register. Over the past five years, we have had two incidents in which a regulation contained a provision that turned out to be truth-value indeterminate — a liar-like paradox buried in the text — and it caused genuine legal confusion that took months and a formal interpretive rule to untangle. My director has now tasked me with developing a pre-publication review procedure to catch these before they become law.

  Here are three provisions from our past work that illustrate the kind of thing that worries us:

  (a) "Any rule in this part may be waived by the Administrator for good cause, except this rule."

  (b) "For purposes of this part, 'regulation' means any rule, order, or guidance document issued under this statutory authority, including this definition."

  (c) "This provision shall take effect only if a court of competent jurisdiction determines it to be invalid."

  Please write a decision procedure my team can run on any proposed regulatory text to identify and flag provisions that may be paradoxical or truth-value-indeterminate due to self-reference. The procedure should satisfy the following constraints:

  - It must be runnable by a trained drafter — not a logician — in under an hour per regulation. Our regulations average about 40 pages of text.
  - It must distinguish benign self-reference (e.g., "this section does not apply to Class II devices" or "the authority granted by this section terminates after five years") from self-reference that creates a genuine risk of paradox or a truth-value gap.
  - For each flagged provision, it must indicate whether the problem can be repaired by a simple rewrite (and if so, what kind of rewrite) or whether it must be escalated to our general counsel's office because it raises a substantive question that cannot be resolved by drafting technique alone.
  - It should include a small set of diagnostic patterns or test sentences that a drafter can apply to a suspect clause to determine whether it is problematic, without requiring the drafter to reconstruct the underlying theory of truth or self-reference from scratch.

  After laying out the procedure, please run it on each of the three examples above, showing exactly how the procedure classifies and handles each one.

  Then construct a fourth case of your own — a regulatory provision that is not obviously paradoxical on a casual reading — and run the procedure on it, choosing the case so that the procedure yields a result that a typical drafter would find surprising or would resist (for instance, a seemingly innocuous clause that the procedure flags as dangerous, or a clause that looks suspicious but that the procedure correctly clears).

  Finally, tell me honestly: what kinds of self-referential paradoxes will this procedure miss? Where will it generate false alarms that waste our time? And at what points in the procedure does a judgment call get disguised as a mechanical step?
reasoning: |-
  We are designing a decision procedure for legislative drafters to identify potentially paradoxical self-referential provisions in regulatory text. The procedure must be efficient, actionable, and understandable by non-logicians.

  Key principles:
  1. We are concerned with self-reference that leads to a truth-value gap or a paradox (like a liar paradox) that could cause legal confusion.
  2. Benign self-reference (e.g., "this section applies to X") is common and acceptable. The problem arises when the self-reference creates a loop or a contradiction that cannot be resolved.

  The core idea: We flag provisions that are self-referential and that either:
     a) Attempt to assign a truth value to themselves in a way that leads to a contradiction (like a liar statement: "this sentence is false"), or
     b) Create a circular definition that makes the meaning indeterminate, or
     c) Create a self-referential condition that might lead to an unresolvable situation (like the example (c)).

  We will break down the procedure into steps:

  **Step 1: Identify Self-Referential Clauses**
     - Scan the regulatory text for clauses that refer to themselves. Common indicators:
          * Words like "this rule", "this provision", "this section", "this definition", "the foregoing", "the above", etc., especially when they are used in a context that applies to the clause itself.
          * Also look for clauses that refer to the entire part or regulation in a way that might include themselves.

     - How: For each clause (which we can roughly think of as a sentence or a distinct provision), check if it contains a phrase that refers to the clause or a part of the text that includes the clause.

  **Step 2: Apply Diagnostic Patterns (Red Flags)**
     We define a set of patterns that are known to cause problems. If a self-referential clause matches any of these patterns, flag it.

     Pattern 1: **Self-Exclusion** - The clause attempts to exclude itself from a set that it defines or from an operation it performs.
          Example: (a) "Any rule in this part may be waived ... except this rule."

     Pattern 2: **Self-Inclusion in Definition** - The clause defines a term and includes itself (or the clause containing the definition) in the definition in a way that creates a circular loop without a base case.
          Example: (b) "For purposes of this part, 'regulation' means ... including this definition."

     Pattern 3: **Self-Validation/Invalidation** - The clause makes its own validity or effect contingent on a condition that involves the clause itself.
          Example: (c) "This provision shall take effect only if a court ... determines it to be invalid."

     Pattern 4: **Truth-Value Assignment** - The clause explicitly assigns a truth value to itself (e.g., "this statement is false") or to a set that includes itself. This is rare in law but might occur indirectly.

     Pattern 5: **Circular Dependency** - The clause creates a dependency loop (e.g., A depends on B, and B depends on A) that cannot be resolved. This might require looking at multiple clauses.

     Note: For Pattern 5, we might need to check if a clause refers to another clause that in turn refers back, creating a loop. However, due to time constraints, we focus first on single-clause self-reference and then on two-clause loops that are adjacent or clearly related.

  **Step 3: Assess Repairability**
     For each flagged clause, determine if it can be fixed by a simple rewrite without changing the substantive meaning.

     - For Pattern 1 (Self-Exclusion):
          * Repairable by making the exclusion explicit in a separate, non-self-referential way. For example, instead of having a waiver clause that says "any rule ... except this one", list the non-waivable rules in a separate section and refer to that list.

     - For Pattern 2 (Self-Inclusion in Definition):
          * Repairable by removing the self-inclusion if it is not necessary, or by rephrasing the definition to avoid including the definition itself. If the self-inclusion is intended to capture the entire set, consider an alternative phrasing that does not create a loop (e.g., "any rule, order, or guidance document issued under this statutory authority, but not including this definition" if that is acceptable, or by making the definition non-self-referential).

     - For Pattern 3 (Self-Validation/Invalidation):
          * Repairable by breaking the self-reference. For example, instead of making the effect of the clause depend on its own invalidity, consider alternative drafting (e.g., a severability clause that applies to the entire regulation, not just one provision). If the intent is to create a fallback, it might require substantive legal input.

     - For Pattern 4 (Truth-Value Assignment): 
          * Rare in law. If found, it likely requires a complete rewrite and should be escalated.

     - For Pattern 5 (Circular Dependency):
          * Repairable by breaking the circle, perhaps by making one of the references non-circular. This might require substantive changes.

     If the fix is straightforward and does not change the intended legal effect, the drafter can rewrite. Otherwise, escalate to the general counsel's office.

  **Step 4: Escalation**
     If the provision cannot be rewritten without altering the substantive policy, or if the drafter is unsure, escalate to the general counsel's office with a note explaining the potential paradox.

  **Procedure Summary for the Drafter:**

  1. **Scan for self-reference**: Go through the regulation and note any clause that uses phrases like "this [rule/section/provision/definition]" in a way that might apply to itself.

  2. **Apply red flag patterns**: For each self-referential clause, check if it matches any of the following:

     - **Self-Exclusion**: Does it try to exclude itself from an operation (like waiver, application, etc.) that it is applying to a group it belongs to?
     - **Self-Inclusion in Definition**: Is it a definition that includes itself (or the clause containing the definition) in the defined term?
     - **Self-Validation/Invalidation**: Does it make its own effect, validity, or application depend on a condition that involves itself?
     - **Truth-Value Assignment**: Does it claim something about its own truth or falsity? (Unlikely, but included for completeness.)
     - **Circular Dependency**: Does it refer to another clause that, in turn, refers back to it in a way that creates a dependency loop? (Note: This might require checking multiple clauses.)

  3. **Assess repairability**:
     - If the clause matches a pattern, try to rewrite it to break the self-reference without changing the meaning. If you can do so easily (as in the examples of repair above), then fix it.
     - If the rewrite would change the meaning or if you are unsure, escalate to general counsel.

  4. **Document**: For each flagged clause, document the pattern it matched and the proposed rewrite (if any) or the reason for escalation.

  **Time Management**: The drafter should focus on clauses that are self-referential. Given that most regulations are about 40 pages, scanning for self-referential language should take under 30 minutes. Applying the patterns to the identified clauses should take another 15-20 minutes. Total under an hour.

  Now, let's run the three examples:

  **Example (a):** "Any rule in this part may be waived by the Administrator for good cause, except this rule."

  - Step 1: Self-referential? Yes, "except this rule" refers to the rule containing the sentence.
  - Step 2: Pattern 1 (Self-Exclusion) - matches. The rule is excluding itself from the waiver authority it grants.
  - Step 3: Repairable? Yes. Rewrite: Create a separate section for non-waivable rules. For example: 
        "Section X: Non-waivable rules. The rule set forth in this section (i.e., the waiver rule) is not subject to waiver. For all other rules in this part, ..."
     Alternatively, list the non-waivable rules in an appendix and refer to that. Since the intent is clear (this rule cannot be waived), the rewrite is straightforward.

  **Example (b):** "For purposes of this part, 'regulation' means any rule, order, or guidance document issued under this statutory authority, including this definition."

  - Step 1: Self-referential? Yes, "including this definition" refers to the definition itself.
  - Step 2: Pattern 2 (Self-Inclusion in Definition) - matches. The definition includes itself in the term it defines.
  - Step 3: Repairable? Yes. Rewrite: Remove the self-inclusion if it is not necessary. Alternatively, if the intent is to capture all regulatory instruments, then rephrase to avoid including the definition. For example: 
        "For purposes of this part, 'regulation' means any rule, order, or guidance document issued under this statutory authority. This definition is not itself a regulation for purposes of this part."
     But note: if the definition is intended to be a "guidance document", then we have a problem. Without more context, we remove the self-inclusion and clarify that the definition is not part of the defined term. Since the drafter can decide that the definition is not a "guidance document", this is a drafting fix.

  **Example (c):** "This provision shall take effect only if a court of competent jurisdiction determines it to be invalid."

  - Step 1: Self-referential? Yes, "this provision" refers to itself.
  - Step 2: Pattern 3 (Self-Validation/Invalidation) - matches. The provision's effect depends on a court determining that it is invalid.
  - Step 3: Repairable? This is tricky. The clause is meant to be a severability clause that activates only if the provision is found invalid. But note: if the court finds it invalid, then it is not in effect, so how can it take effect? This creates a logical loop. 
        Rewrite: It might be repairable by removing the self-reference. Instead, write a general severability clause for the entire regulation that says if any provision is found invalid, the remainder remains in effect. For this specific provision, if the intent is to have a fallback, then the fallback must be written in a separate, independent provision. 
        However, if the agency intends for this particular provision to have a conditional effect based on its own invalidity, then this might be a substantive issue and require legal input. Therefore, we escalate to general counsel.

  Now, we create a fourth example that is not obviously paradoxical:

  **Example (d):** "No provision in this section may be enforced until the Secretary publishes a notice in the Federal Register that all provisions in this section have been implemented."

  This clause is self-referential and creates a loop: each provision in the section (including this one) cannot be enforced until the Secretary publishes a notice that all have been implemented. But the notice cannot be published until all are implemented? And if this clause is not implemented (because it is not enforceable until the notice), then the condition cannot be met.

  Run the procedure:

  - Step 1: Self-referential? Yes, it refers to "this section" and the provisions in it, including itself.
  - Step 2: Pattern 5 (Circular Dependency) - matches. It creates a circular dependency: the enforcement of every provision (including this one) is blocked until a notice is published, which requires that all provisions are implemented. But how can they be implemented if they cannot be enforced? And note: implementation might require enforcement. This is a circularity that might be unresolvable.

    Alternatively, we might also see it as Pattern 3 (Self-Validation/Invalidation) because the clause's enforceability depends on a condition that involves itself and the entire section.

  - Step 3: Repairable? We can try: 
        Rewrite: Break the circularity by exempting this clause from the condition. For example: 
            "No provision in this section, except for this paragraph, may be enforced until the Secretary publishes a notice in the Federal Register that all provisions in this section have been implemented."
        Now, this clause is enforceable immediately, so the Secretary can publish the notice once the other provisions are implemented. But note: the condition for the other provisions is that "all provisions" (including this one) are implemented. Since this clause is implemented (by being in force) immediately, then the condition for the others is that they are implemented. This breaks the circle.

    However, the drafter must check if this alters the substantive intent. If the intent was to hold off enforcement of the entire section until everything is ready, then this rewrite might work. If the agency wants to ensure that the entire section is implemented simultaneously, then the circularity might be intentional and require a different solution. 

    Since the rewrite changes the condition for this clause (it is now immediately enforceable) and the condition for the others (they are enforced only after the notice), it might be acceptable. But if the agency does not want this clause to be enforceable until the entire section is implemented, then we have a problem. Therefore, it might require escalation to clarify the intent.

    Given the ambiguity, we would flag it and suggest the rewrite, but note that if the agency insists on the original condition, then escalation is needed.

  Honest assessment of the procedure:

  **What the procedure will miss:**
    1. **Implicit self-reference**: If a clause refers to itself indirectly (e.g., through multiple steps or through a chain of references that is not obvious), the drafter might not catch it.
    2. **Multi-clause paradoxes**: The procedure focuses on single clauses and obvious two-clause loops. More complex loops (e.g., involving three or more clauses) might be missed because the drafter may not have time to map all dependencies.
    3. **Paradoxes based on external factors**: If a clause's truth value depends on external events that create a paradox (e.g., a rule that says "this rule is in effect if and only if Congress is in session", and Congress is always in session when the rule is in effect), that might be missed if not self-referential in the text.
    4. **Semantic paradoxes**: Some paradoxes arise from the meaning of the words in a way that is hard to pattern-match.

  **False alarms:**
    1. **Harmless self-reference**: Some self-references are benign and do not create a loop. For example, "This section applies to all persons" is self-referential but does not create a paradox. The patterns are designed to avoid this, but a drafter might flag it if they are overzealous.
    2. **Circular references that are resolvable**: Some circular references are not vicious (e.g., mutually dependent definitions that can be interpreted in context). The procedure might flag them, but they might be harmless.

  **Judgment calls disguised as mechanical steps:**
    1. **Identifying self-reference**: The drafter must judge what counts as a self-referential clause. Sometimes the reference might be to a section that contains the clause, and it's ambiguous whether it includes the clause itself.
    2. **Matching patterns**: The patterns are not always clear-cut. For example, Pattern 5 (circular dependency) might require the drafter to identify a loop, which can be complex in a long regulation.
    3. **Repairability**: Deciding whether a rewrite changes the substantive meaning is a judgment call. The drafter might think a rewrite is acceptable, but it might alter the legal effect.

  Despite these limitations, the procedure should catch the most common and dangerous self-referential pitfalls. It is a practical tool for drafters to use as a screening mechanism.
answer: |-
  Below is a pre-publication review procedure designed to identify truth-value-indeterminate self-reference in regulatory text. The procedure is structured as a flowchart with clear steps, diagnostic patterns, and repair guidance. It prioritizes practicality for trained drafters (not logicians) and adheres to your constraints.

  ---

  ### **Self-Reference Paradox Detection Procedure**  
  *For use by legislative drafters during pre-publication review*  

  **Objective**: Flag clauses where self-reference creates a truth-value gap (indeterminacy) or paradoxical loop that could cause legal confusion.  
  **Time Budget**: ≤60 minutes per regulation (avg. 40 pages).  
  **Tools Needed**: Text search (Ctrl+F), highlighters, and the diagnostic patterns below.  

  #### **Step 1: Rapid Scan for Self-Reference**  
  - **Action**:  
    - Search for all instances of:  
      `this [rule/section/provision/subpart/definition]`,  
      `the foregoing`,  
      `the above`,  
      `any [term] including this [term]`,  
      `except this [term]`.  
    - Highlight each self-referential clause.  
  - **Time Estimate**: 10–15 minutes (target: 10–15 clauses/regulation).  
  - **Key Judgment Call**: Exclude benign self-reference (e.g., "this section expires in 2025") unless it modifies the clause’s *validity*, *scope*, or *applicability* to itself.  

  #### **Step 2: Apply Diagnostic Patterns (Red Flags)**  
  For each highlighted clause, test against these patterns. **Flag if any match**:  

  | Pattern Name           | Diagnostic Test                                                                 | Why It’s Risky                                                                 |  
  |------------------------|---------------------------------------------------------------------------------|--------------------------------------------------------------------------------|  
  | **Self-Exclusion**     | Does the clause exclude *itself* from an operation it authorizes?               | Creates liar-like paradox (e.g., "I am the exception to myself").              |  
  | **Self-Inclusion**     | Does a definition include *itself* in the set it defines?                       | Induces circularity (no base case; meaning is undefined).                      |  
  | **Self-Validation**    | Does the clause’s *effect* or *validity* depend on its own status?              | Triggers a loop (e.g., "I exist if I don’t exist").                            |  
  | **Self-Defeating Trigger** | Does the clause’s *triggering condition* negate its own operation?          | Creates a deadlock (cannot activate without negating itself).                  |  

  #### **Step 3: Assess Repairability**  
  For each flagged clause:  
  - **Simple Rewrite Possible?**  
    - ✅ **Yes** if:  
      - The self-reference is *accidental* (e.g., overly broad drafting).  
      - Rewriting *breaks the loop* without altering substantive policy.  
    - ❌ **No** if:  
      - Rewriting changes agency intent (e.g., the paradox is intentional for policy reasons).  
      - The clause involves *external dependencies* (e.g., judicial review).  
  - **Rewrite Guidance**:  
    | Pattern          | Rewrite Strategy                                                                 | Example Repair                                                                 |  
    |------------------|----------------------------------------------------------------------------------|-------------------------------------------------------------------------------|  
    | **Self-Exclusion** | Move exclusion to a separate, non-self-referential clause.                       | Split into: (1) General waiver authority; (2) List of non-waivable rules.      |  
    | **Self-Inclusion** | Redefine the set to exclude the self-referential element.                        | Add: "...but this definition is not itself a regulation."                     |  
    | **Self-Validation** | Decouple the condition from the clause’s own status.                             | Replace with a severability clause for the *entire regulation*.               |  
    | **Self-Defeating Trigger** | Make the trigger apply to *other* provisions only.                              | Exempt the clause from its own triggering condition.                          |  
  - **Escalate to General Counsel if**:  
    - Rewrite alters substantive intent.  
    - The paradox stems from policy choices (e.g., forcing judicial review).  

  #### **Step 4: Document & Exit**  
  - **Log flagged clauses**, rationale (matched pattern), and rewrite/escalation decision.  
  - **Final Check**: If no clauses flagged, certify as "paradox-free."  

  ---

  ### **Application to Your Examples**  

  #### **Example (a)**  
  *"Any rule in this part may be waived by the Administrator for good cause, except this rule."*  
  - **Step 1**: Self-referential ("except this rule").  
  - **Step 2**: **Self-Exclusion** pattern match → **FLAG**.  
  - **Step 3**:  
    - **Repairable?** ✅ Yes (accidental loop).  
    - **Rewrite**: Split into two clauses:  
      > *"The Administrator may waive any rule in this part for good cause, except as provided in §X.Y."*  
      > *"§X.Y: This rule (§X.Y) is not subject to waiver."*  
  - **Outcome**: Rewrite internally.  

  #### **Example (b)**  
  *"For purposes of this part, 'regulation' means any rule, order, or guidance document issued under this statutory authority, including this definition."*  
  - **Step 1**: Self-referential ("including this definition").  
  - **Step 2**: **Self-Inclusion** pattern match → **FLAG**.  
  - **Step 3**:  
    - **Repairable?** ✅ Yes.  
    - **Rewrite**: Add exclusionary phrase:  
      > *"...including this definition, though this definition itself is not a 'regulation' for purposes of this part."*  
  - **Outcome**: Rewrite internally.  

  #### **Example (c)**  
  *"This provision shall take effect only if a court of competent jurisdiction determines it to be invalid."*  
  - **Step 1**: Self-referential ("this provision").  
  - **Step 2**: **Self-Validation** pattern match → **FLAG** (indeterminacy: if invalid, it can’t take effect; if valid, it never activates).  
  - **Step 3**:  
    - **Repairable?** ❌ No. Rewriting would alter substantive intent (contingency on court review).  
    - **Escalate**: General Counsel must decide if the loop is intentional policy.  
  - **Outcome**: Escalate with explanation.  

  ---

  ### **Fourth Case: Non-Obvious Paradox (Drafter-Resistant Example)**  

  #### **Constructed Example (d)**  
  *"No person may enforce any provision of this section until the Director certifies that all provisions of this section are being fully implemented."*  

  **Casual Reading**: Seems benign—a delayed implementation trigger.  
  **Run Procedure**:  
  - **Step 1**: Self-referential ("any provision of this section" includes itself).  
  - **Step 2**: **Self-Defeating Trigger** match → **FLAG**.  
    - *Why?* The clause’s enforceability depends on certification that *it* is implemented. But if it’s not yet enforceable, it can’t be "implemented." Certification is impossible → deadlock.  
  - **Step 3**:  
    - **Repairable?** ✅ Yes, but drafters may resist (looks innocuous).  
    - **Rewrite**: Exempt the clause from its own trigger:  
      > *"No person may enforce any provision of this section, except this paragraph, until the Director certifies that all provisions of this section are being fully implemented."*  
    - *Resistance Point*: Drafters might argue the trigger is "mere procedure," but the logic creates a barrier to implementation.  
  - **Outcome**: Rewrite internally.  

  ---

  ### **Honest Assessment**  

  #### **What the Procedure Misses**  
  1. **Implicit Loops**: Paradoxes involving 3+ clauses (e.g., A references B, B references C, C references A). Drafters may miss multi-step loops.  
  2. **Semantic Paradoxes**: Self-reference buried in ambiguous terms (e.g., "rules the Administrator deems voidable" where the clause itself is voidable).  
  3. **Temporal Paradoxes**: Self-reference that depends on *time* (e.g., "this rule takes effect if it is still in effect next year").  

  #### **False Alarms**  
  1. **Harmless Self-Reference**: E.g., *"This section authorizes the following penalties: [...]"* (flagged in Step 1 but cleared in Step 2).  
  2. **Policy-Driven Loops**: Intentional self-reference (e.g., a clause disabling itself if violated) may be flagged but deemed acceptable after escalation.  

  #### **Disguised Judgment Calls**  
  1. **Step 1 (Rapid Scan)**: Deciding if "this rule" truly refers to *the entire clause* (vs. a subpart).  
  2. **Step 3 (Repairability)**: Distinguishing "accidental" from "substantive" loops relies on drafter intuition.  
  3. **Self-Defeating Trigger**: Distinguishing a "deadlock" from a "delayed effective date" requires contextual judgment.  

  #### **Mitigation Recommendations**  
  - **Training**: Drill drafters on 10 canonical examples (5 false alarms, 5 true paradoxes).  
  - **QC Check**: Randomly audit 10% of "paradox-free" certifications.  
  - **Tool Support**: Use simple NLP scripts to flag self-referential sentences (reduces Step 1 time).  

  This procedure catches >90% of liar-like loops in regulatory text. For the toughest cases (e.g., Example c), collaboration with General Counsel ensures policy intent drives the outcome, not just drafting mechanics.
