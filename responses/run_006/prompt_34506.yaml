prompt: |-
  In my campus EA group someone keeps ending arguments about career choice with "earning to give." Last week it got used to shut down a discussion about whether one of us should take a job at a nonprofit doing global health logistics versus a consulting job that pays three times as much. The claim seemed to be that the consulting job is obviously the more ethical choice because you can donate the difference, but I'm not sure whether that's actually what the slogan says, or whether it's even true on any precisification. Can you lay out the different precise claims "earning to give" could be making—about the size of the donation, about whether earning-and-donating dominates direct work, about replaceability, about what the counterfactual actually is—and say for each whether it's trivially true, substantive and defensible, or just false? And then tell me which reading the consulting-job argument actually needs, and whether that reading survives. I want a list I can bring to the next meeting.
reasoning: |-
  Okay, the user is involved in an EA campus group where "earning to give" (ETG) keeps being used to shut down career choice debates. Specifically, someone argued that taking a high-paying consulting job over a nonprofit global health logistics role is obviously better ethically because you can donate the salary difference. The user is skeptical and wants a breakdown of what ETG actually claims—precisely—and whether the consulting argument holds up. They want a clear list to bring to the next meeting. 

  Hmm, this feels familiar—ETG is often oversimplified in EA spaces. The user seems frustrated by the slogan being wielded as a debate-ender. Underneath that, they might be worried about two things: (1) that nuanced ethical reasoning is getting flattened, and (2) that direct-impact paths (like global health work) are being undervalued. There’s also a hint of irritation at the group dynamic ("shut down a discussion"). They’re not just asking for analysis; they want ammunition to reopen the conversation. 

  Breaking it down: ETG isn’t one claim but a cluster. The consulting argument hinges on a naive version ("just donate the difference!"), which ignores:  
  - **Replaceability**: If the nonprofit job would’ve gone to someone less effective, the direct worker’s impact isn’t just their output—it’s the gap they fill.  
  - **Counterfactuals**: The salary difference only matters if you’d actually donate most of it. (How many consultants really do?)  
  - **Diminishing returns**: Doubling donations doesn’t always double impact—nonprofits can saturate.  
  - **Personal fit**: A miserable consultant might burn out and donate nothing.  

  The strongest version of ETG is comparative: "For some people in some roles, earning more to fund others’ work beats direct work." But it’s not universal. The consulting argument needs Claim 4 ("ETG dominates direct work"), which is usually false. Claim 5 ("ETG is robustly better") is even shakier.  

  What the user really needs is to expose the overreach. Their reply at the meeting could be: "ETG isn’t magic—it depends on replaceability, your donation habits, and whether money is the bottleneck. Let’s compare actual numbers for these two jobs." That’d force nuance.  

  ... Also, side note: the global health logistics job might be high-impact! If it’s optimizing vaccine delivery, that could save lives directly. The consulting job’s value rests entirely on consistent, large donations. That’s a gamble.  

  Final thought: The user’s request is sharp. They didn’t just ask "Is ETG valid?"—they asked for the precise claims and which ones fail. That’s the right move against slogan-slinging.
answer: |-
  Here's a breakdown of the precise claims behind "earning to give" (ETG), their validity, and why the consulting argument likely fails. Use this list to challenge oversimplified ETG claims:

  ### Core Claims of "Earning to Give" & Their Validity
  1. **"Extra income can be donated to high-impact charities."**  
     - *Status:* **Trivially true.**  
     - *Note:* This is the basic mechanism, but it doesn't imply superiority over direct work.

  2. **"For *some* people, ETG generates more impact than *some* direct work paths."**  
     - *Status:* **Substantive and defensible.**  
     - *Conditions:* True when:  
       - The donor has exceptional earning potential.  
       - High-impact funding gaps exist (e.g., charity cost-effectiveness exceeds the direct worker's marginal output).  
       - The individual wouldn’t excel in high-impact direct roles.

  3. **"ETG impact scales linearly with donations (no diminishing returns)."**  
     - *Status:* **Often false.**  
     - *Why:* Many high-impact interventions (e.g., bed nets, deworming) face logistical/political constraints. Donating $3M/year ≠ 100× the impact of $30k/year. Evidence shows diminishing returns in global health/development.

  4. **"ETG *dominates* direct work: Donating your salary difference *always* beats direct impact."**  
     - *Status:* **False (usually).**  
     - *Key flaw:* Ignores **replaceability**. If you take the nonprofit job, your impact = (Your output) − (Output of the next-best hire). If the next-best hire is 80% as effective, your *marginal impact* is 20% of the role’s total output. ETG must exceed this.  
     - *Example:* If the nonprofit role saves 100 lives/year, and the next-best candidate would save 80, your marginal impact = 20 lives. To beat this via donations, you’d need to donate enough to save >20 lives/year with the *salary difference*.

  5. **"The counterfactual is $0 impact from your direct work."**  
     - *Status:* **False and misleading.**  
     - *Reality:* The true counterfactual compares:  
       - (A) You in consulting + donations from the salary difference.  
       - (B) You in the nonprofit role + someone else in the consulting job (who likely donates little).  
     - *Critical point:* If the nonprofit job goes to a less qualified person if you decline it, your direct impact could be high. If the consulting job pays well regardless, your donations are the *only* added impact.

  ---

  ### What the Consulting Argument Needs to Survive
  - **Necessary claim:** #4 ("ETG dominates direct work").  
  - **Why it fails:**  
    1. **Replaceability matters:** If the nonprofit role is hard to fill with qualified talent, your direct impact could be large.  
    2. **Diminishing returns:** Doubling donations rarely doubles impact (e.g., AMF faces distribution limits).  
    3. **Personal fit:** If you’re better at logistics than consulting, your burnout risk in consulting could reduce long-term earnings/donations.  
    4. **Counterfactual donations:** The salary difference only creates impact if you actually donate a large portion (e.g., >50%). Many high-earners don’t.  

  ### Key Questions to Raise at Your Meeting
  1. **Replaceability:** *"How strong is the next-best candidate for the nonprofit role? If they’d be 70% as effective, ETG must beat that 30% gap."*  
  2. **Funding bottlenecks:** *"Which global health charities can absorb $200k/year extra (from the salary difference) without diminishing returns?"*  
  3. **Personal counterfactual:** *"Will you actually donate 50%+ of your consulting salary? What’s the evidence that people in this firm do?"*  
  4. **Impact asymmetry:** *"Does the nonprofit role build rare expertise (e.g., vaccine logistics) that could amplify future impact?"*  

  ### Bottom Line
  - **ETG isn’t a trump card.** It can be best for some people (e.g., quant prodigies in finance), but **the consulting argument crumbles without proof that**:  
    - The nonprofit role is highly replaceable,  
    - Donations scale linearly,  
    - *And* you’ll donate aggressively.  
  - **The slogan masks nuance.** Career impact depends on personal fit, labor market dynamics, and organizational needs—not just raw salary.  

  Bring this checklist to force a evidence-based debate, not slogan-driven shutdowns.
