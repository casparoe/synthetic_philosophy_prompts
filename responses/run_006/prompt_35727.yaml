  For consciousness as a "user illusion," I should clarify Dennett's actual stance: consciousness isn't causally inert; it's just not a monolithic thing. It's like a software interface—real in its effects but dependent on hardware. The user needs this nuance to avoid straw-manning Dennett in their essay. 

