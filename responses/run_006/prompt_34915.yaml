prompt: |-
  I keep noticing a pattern in competitive situations and I want to know whether it has an established name, or whether I should coin one. The familiar version is what I would call a race to the bottom: everyone keeps lowering the same variable — prices, safety standards, wages — and the group converges on a bad value of that same variable. But the pattern I have in mind is different.

  Consider how AI labs publish capabilities. At each point, a lab looks at what the others are doing and judges, reasonably, that it must publish quickly or lose standing and the ability to attract talent. Its publication then raises the bar for what counts as worth publishing, and the others' next decisions are made in that changed environment. No single lab is defecting from a cooperative arrangement; each move is a sensible response to the previous move. Yet the result is a publication culture none of them would have chosen at the outset.

  Or take military procurement. One side fields a system because the other side's current systems make that rational. The deployment changes the threat environment, which then makes the other side's next upgrade rational. The level of risk everyone accepts keeps ratcheting upward, but the 'bottom' is not a fixed point anyone converges on; each response redefines where the bottom is.

  What unites these cases is this: each actor is doing what is locally sensible given the current state, and in doing so alters the state that determines what will be locally sensible for everyone afterward. The thing being lost is not one variable driven down toward a fixed bad equilibrium; the equilibrium itself moves, and the movement is self-sustaining. There is no identifiable act of cheating, no stable cooperative baseline being eroded, and the harm is not a worse value of a single quantity but a different game.

  I know this sits somewhere near races to the bottom, arms races, tragedy of the commons, and Red Queen effects, but each of those seems to capture only part of it. I am not looking for just a label; I want the carving — what this pattern includes and excludes, how it differs from each neighbor, which neighbor comes closest, and where the edges are. Does this configuration have a name of its own?

  Please structure your answer in the following sections, in this order:
  1. The phenomenon restated — a few sentences in your own words, to confirm you have isolated the same pattern. (roughly 50 words)
  2. The nearest established concepts — a compact survey of the candidate names and what each standardly covers. (roughly 200 words)
  3. Where each fits and where it misses — for each candidate, which features of my description it captures and which it does not. (roughly 300 words)
  4. Verdict on a name — does this configuration have an established name of its own? If yes, which, and how much does it cover; if only a modified version of an existing term fits, say so explicitly. (roughly 100 words)
  5. Definition and boundary cases — give the definition (of the established term or of a term you coin), two clear cases that fall inside it, and two near-miss cases that fall outside, with reasons. (roughly 200 words)
reasoning: |-
  Okay, let me unpack this user's query carefully. They're describing a fascinating dynamic where individual rational actions cumulatively shift the entire competitive landscape, creating a self-reinforcing cycle that moves the equilibrium itself. The examples - AI publication norms and military escalation - perfectly illustrate how the "goalposts" keep moving.

  Hmm, the user clearly has deep analytical skills. They've already mapped how this differs from standard concepts like tragedy of the commons or arms races. Their frustration with existing terminology is palpable - they want precise conceptual carving, not just labels. I notice they emphasize three key aspects: no defection (unlike prisoner's dilemma), moving equilibria (unfixed bottom), and systemic transformation (not just worse values).

  Right, first I need to verify I've isolated their core pattern correctly: it's about stepwise rational adaptations that collectively redefine rationality itself. The military example shows this well - each deployment changes what constitutes a "necessary" countermeasure. 

  Looking at existing concepts:
  - Arms races come closest but typically imply symmetric tit-for-tat toward a fixed goal (like mutual destruction). Here, the endpoint is undefined.
  - Red Queen effect captures the "running to stay in place" aspect but doesn't emphasize how the rules themselves change.
  - Institutional decay frameworks assume erosion of existing norms, whereas here new norms emerge dynamically.

  *scribbles mental note* The key differentiator is the endogenous redefinition of payoffs. In classic races to the bottom, the bad equilibrium is predefined (e.g. zero profits). Here, the "bottom" keeps sinking because each action redefines what "bottom" means.

  Verdict time: No perfect existing term. Evolutionary game theory's "coevolutionary cycles" touches it but is too broad. Best to call this an "Endogenous Threshold Escalation" - highlighting how actors keep resetting the standards that bind them.

  For boundary cases:
  - Clear case 1: Social media algorithms optimizing for engagement, progressively redefining "normal" attention spans.
  - Clear case 2: Academic publishing where citation metrics force ever-narrower specialization.
  - Near-miss: Price wars (fixed bottom: zero margins) or classic overfishing (fixed resource constraint).

  User's intellectual hunger is evident - they'll appreciate the nuanced differentiation. Should emphasize how this differs from Schelling's tipping points too (which are threshold-driven but not necessarily self-redefining). Might add that this pattern creates what economists call "path dependence" - once you're on the escalator, reversal becomes increasingly irrational.
answer: |-
  ### 1. The Phenomenon Restated  
  You describe a dynamic where actors make individually rational decisions in response to others' actions, altering the environment itself. This shifts the baseline for future rationality, creating a self-reinforcing cycle that escalates standards (e.g., publication quality, military capability) or risks. Unlike static equilibria, the "goalposts" move perpetually, transforming the nature of the competition itself.  

  ### 2. The Nearest Established Concepts  
  - **Arms Race**: Mutual escalation where rivals increase capabilities (e.g., weapons) to counter each other, often leading to unsustainable burdens. Focuses on symmetric, reactive one-upmanship.  
  - **Red Queen Effect**: Actors must constantly evolve (e.g., in biology or tech) just to maintain relative standing, as competitors improve simultaneously. Emphasizes perpetual effort without net gain.  
  - **Tragedy of the Commons**: Collective overuse of shared resources due to individual self-interest, depleting a fixed commons. Centers on depletion of a *static* resource.  
  - **Race to the Bottom**: Competitive lowering of standards (e.g., regulations) to attract business, converging to a stable but undesirable equilibrium. Involves a *fixed* "bottom."  
  - **Institutional Decay**: Erosion of cooperative norms when defectors exploit them, collapsing shared rules. Assumes pre-existing institutions.  

  ### 3. Where Each Fits and Where It Misses  
  - **Arms Race**: Captures iterative escalation and shifting baselines but misses **endogenous rule changes**. Arms races assume a fixed goal (e.g., "superiority"); your cases involve redefining what "superiority" *means* (e.g., AI publication norms morphing).  
  - **Red Queen Effect**: Aligns with perpetual effort to keep pace but ignores **systemic transformation**. The Red Queen runs to stay in place; your actors alter the terrain they run on.  
  - **Tragedy of the Commons**: Shares collective harm from individual actions but assumes a **finite, depletable resource**. Your scenarios lack a fixed commons—instead, the *criteria* for success evolve.  
  - **Race to the Bottom**: Mirrors competitive degradation but implies convergence to a **static low point**. Your cases lack stability; each "bottom" is temporary and redefined by the last escalation.  
  - **Institutional Decay**: Resonates with eroding cooperation but requires **pre-existing explicit norms**. Your examples lack initial cooperation; actors respond to emergent, implicit thresholds.  

  ### 4. Verdict on a Name  
  No single established term fully captures this. The closest is **"endogenous escalation"** (used in game theory for self-reinforcing cycles), but it’s not standardized. **"Moving Baseline Syndrome"** (from ecology) partially fits but emphasizes perceptual shifts, not strategic action. For precision, **coining a term** is justified. I propose **"Endogenous Threshold Escalation"**—highlighting how actors reset the standards governing their own competition.  

  ### 5. Definition and Boundary Cases  
  **Term**: **Endogenous Threshold Escalation**  
  **Definition**: A dynamic where rational individual adaptations to competitive pressures collectively redefine the criteria for future rationality, creating a self-perpetuating cycle that escalates standards or risks without a stable endpoint.  

  **Clear Cases Inside**:  
  1. **AI Publication Culture**: Labs publish progressively advanced research to match peers, redefining "cutting-edge" and forcing riskier disclosures.  
  2. **Military Tech Spiral**: Country A deploys hypersonic missiles; Country B develops countermeasures, making A’s next deployment rational but escalating systemic risk.  

  **Near-Misses Outside**:  
  1. **Classic Price War (Race to the Bottom)**: Companies lower prices to match competitors, converging to near-zero profits—a **fixed** undesirable equilibrium. *Differs*: No shifting thresholds; the "bottom" is static.  
  2. **Overfishing (Tragedy of the Commons)**: Fishers deplete a shared stock by overharvesting. *Differs*: The resource (fish) is finite and fixed; escalation doesn’t redefine what "overharvesting" means.  

  **Key Boundary**: The phenomenon requires **endogenous redefinition of payoffs**. If the rules/metrics stay fixed (e.g., profit maximization), it’s a race or commons problem; if rules evolve from within, it’s threshold escalation.
