prompt: |-
  A colleague in my department has taken to arguing that the whole problem of truth is an artifact of grammar. His preferred analogy is pronominal: the expression "that is true," he says, stands to a sentence roughly as a pronoun stands to a noun phrase. Just as "she" lets a speaker avoid repeating a name while still talking about the same person, "that is true" lets a speaker affirm or deny an entire class of sentences without enumerating them — as in "whatever the witness said is true." From this he concludes that truth is not a genuine property, that there is no correspondence relation between true sentences and the world, and that the substantive theories of truth are trying to analyze something the word "true" was never in the business of naming.

  I want you to audit this analogy rather than simply take sides. First, lay out the intended correspondence explicitly: what in the pronominal source is supposed to map onto what in the truth-predicate target, and which features of pronouns are carrying the argument. Second, identify the disanalogies. In particular, consider whether "that is true" really inherits its content from an antecedent sentence in the way a pronoun inherits its referent from an antecedent noun phrase; whether the analogy handles uses of "true" where there is no recoverable antecedent sentence, or where the antecedent is unknown, foreign, or embedded in an opaque context; and whether pronouns and "true" behave alike under negation, quantification, and propositional-attitude reports. Third, distinguish the disanalogies that matter for the deflationary conclusion from those that are merely incidental, and say which features of the pronominal source the analogy quietly imports that the target lacks. Finally, tell me whether the conclusion — that there is no property of truth and no work for a substantive theory of truth to do — survives the audit, and what a better analogy for the deflationist's point would be, if any.
reasoning: |-
  Okay, the user presents a complex philosophical argument about truth and language. The colleague's position appears to be a deflationary view of truth, using a pronominal analogy to argue that "true" isn't naming a real property but is merely a linguistic device for efficiency.

  Hmm, I need to unpack this carefully. The core analogy compares "that is true" to pronouns like "she," suggesting both avoid repetition while maintaining reference. The colleague concludes that truth isn't a genuine property with correspondence to reality. 

  First, I should map the analogy precisely. The antecedent noun phrase (e.g., "Alice") corresponds to the antecedent sentence (e.g., "Snow is white"). "She" maps to "that is true," both being anaphoric devices. The key features carried over are: semantic inertness (no added content), grammatical substitution, and discourse coherence.

  But where does this analogy break down? Let me think about cases where "true" is used without clear antecedents - like blind endorsements ("His statement was true") or future contingents ("The next theorem will be true"). Pronouns typically require clearer antecedents. Also, in quantification: "Everything she says is true" involves double anaphora where "she" and "true" interact in ways pronouns alone don't. 

  Negation poses another problem: "That's not true" targets content, not reference like "That's not her." And in propositional attitudes ("Mary believes that is true"), the truth predicate behaves differently than pronouns under psychological contexts.

  Which disanalogies actually threaten the deflationary position? The antecedent-less cases and quantification issues seem most damaging because they suggest "true" does substantive work beyond mere reference. The analogy also quietly imports features like singular reference that don't fit truth's role in generalization.

  Does the conclusion survive? Partially. The core deflationist insight about avoiding repetition stands, but the pronominal analogy oversimplifies. A better metaphor might be a logical operator or prosentence - something that inherits content structurally rather than referentially. The audit shows we still need "true" for generalization over discourse, even if it doesn't name a correspondence relation.

  The user seems philosophically sophisticated - probably wants this analyzed rigorously without partisan simplifications. They're likely preparing a response to their colleague and need the argument's weaknesses exposed systematically. The request for "which disanalogies matter" suggests they understand this isn't binary but about argumentative weight.
answer: |-
  Here's a systematic audit of the pronominal analogy for truth, dissecting its structure, strengths, weaknesses, and implications for deflationism:

  ### 1. The Intended Correspondence
  - **Source (Pronouns):**  
    - **Antecedent:** A noun phrase (e.g., "Alice") providing reference.  
    - **Pronoun:** A referential shorthand (e.g., "she") inheriting its semantic value *entirely* from the antecedent.  
    - **Key Features Carrying the Argument:**  
      - **Anaphora:** Pronouns depend on prior linguistic context for meaning.  
      - **Semantic Inertness:** Pronouns add no descriptive content; they are "placeholders."  
      - **Grammatical Convenience:** Avoids repetition while preserving reference.  

  - **Target (Truth Predicate):**  
    - **Antecedent:** A proposition-bearing expression (e.g., "Snow is white").  
    - **"That is true":** Anaphorically inherits content from the antecedent, affirming it without restatement.  
    - **Argument's Claim:**  
      "True" is *only* an anaphoric device for endorsement/denial, adding no substantive content about reality or correspondence.  

  ### 2. Key Disanalogies  
  **(A) Antecedent Dependence & Content Inheritance**  
  - **Problem:** Pronouns *require* identifiable, co-referential antecedents (e.g., "She arrived" fails without prior context). "True" does not:  
    - **Blind Endorsement:** "His statement was true" works even if *nobody* knows the antecedent proposition.  
    - **Future/Unknown Antecedents:** "The next theorem he proves will be true" has no existing antecedent.  
    - **Foreign/Embedded Contexts:** "What Putin said yesterday is false" functions despite the antecedent being untranslated, unknown, or embedded under opacity.  
    **→ Disanalogy:** "True" can operate without recoverable linguistic antecedents; it often targets *propositions* (non-linguistic contents) rather than *sentences*.  

  **(B) Quantification**  
  - **Pronouns:** Bind to singular antecedents ("Every student said *she* passed" → each student claims *her own* passing).  
  - **"True":** Enables *generalization* over unlimited propositions:  
    - "All theorems of arithmetic are true" quantifies over infinitely many sentences, with no specific antecedent.  
    - "Everything Kant said about morality is false" targets an open-ended set of claims.  
    **→ Disanalogy:** "True" is essential for *infinite/indefinite generalization*, exceeding the pronoun's singular anaphoric role.  

  **(C) Negation**  
  - **Pronouns:** Negation targets the predicate, not reference ("She is *not* tall" denies tallness, not who "she" is).  
  - **"True":** "That is not true" denies the *content* of the antecedent proposition itself, not a property of the sentence.  
    - Contrast: "That sentence is not grammatical" vs. "That is not true."  
    **→ Disanalogy:** Negating "true" performs a *metalinguistic denial* of content, unlike pronoun negation.  

  **(D) Propositional Attitude Reports**  
  - **Pronouns:** Shift reference in opaque contexts (e.g., "Lois believes *he* [Clark] is weak" ≠ "Lois believes *he* [Superman] is weak").  
  - **"True":** Remains stable in attitudes:  
    - "Mary believes that everything the Pope says is true" attributes belief in a *general norm*, not specific sentences.  
    - "True" often escapes the opacity that traps pronouns.  
    **→ Disanalogy:** "True" operates at a higher semantic level, enabling generalizations opaque to pronouns.  

  ### 3. Salience of Disanalogies for Deflationism  
  - **Critical Disanalogies (Threaten Deflationism):**  
    - **Quantification & Generalization:** Shows "true" is *indispensable* for expressing generalizations no pronoun can capture. This suggests it has logical, not just grammatical, utility.  
    - **Blind/Prospective Uses:** "True" can reference propositions beyond immediate discourse, undermining pure anaphora.  
    - **Negation:** Reveals "true" as a device for *endorsement/denial of content*, hinting at a normative role.  

  - **Incidental Disanalogies:**  
    - Morphological differences (pronouns inflect for gender/case; "true" doesn’t).  
    - "True" often attaches to clauses, not NPs (but this is grammatical, not semantic).  

  - **Smuggled Features of Pronouns:**  
    The analogy quietly imports *singular reference* and *contextual boundedness*, ignoring "true"’s role in abstract, cross-contextual, and infinite generalizations.  

  ### 4. Conclusion & Better Analogy  
  - **Does the Conclusion Survive?**  
    **Partially, but weakened.** The analogy *successfully* shows "true" avoids redundancy in affirmation/denial ("deflationary core"). However, the disanalogies prove it is **not merely pronominal**:  
    - Truth enables *propositional generalization* (quantification over contents).  
    - It functions in *logical frameworks* (e.g., defining validity via truth-preservation).  
    - It expresses *norms of assertion* (e.g., "Assert only what is true").  
    → Thus, while "true" may not name a "substantive property" like mass or charge, it has irreducible *logical* and *expressive* roles that transcend grammar.  

  - **A Better Deflationist Analogy:**  
    **Logical Prosentences:** Like pro-*sentences* in formal logic (e.g., "so," "thus"), "that is true" inherits *sentential content* holistically.  
    - **Strengths:**  
      - Handles quantification: "Everything he said is true" parallels "Everything he said, and *that* [prosentence]."  
      - Explains blind uses: Prosentences can reference unstated contents.  
      - Avoids smuggling singular reference.  
    - **Limitations:** Still struggles with normative uses and truth's role in inquiry.  

  **Verdict:** The pronominal analogy illuminates truth's *redundancy* in simple affirmations but fails to capture its *expressive power* in generalization and logic. Deflationism survives if scaled back to a claim about truth's *non-explanatory role* (e.g., not analyzing "correspondence"), but it cannot dismiss truth's functional indispensability. A prosentential analogy better fits the deflationist stance while accommodating key disanalogies.
