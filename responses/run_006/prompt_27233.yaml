prompt: |-
  my friend is really into the epistemology of conspiracy theories, and she's got a pretty settled set of verdicts about which conspiracy-ish beliefs were reasonable to hold at the time, not with hindsight. here they are:

  - the tuskegee syphilis study (the public health service secretly letting black men go untreated to watch the disease progress): rational to believe once the whistleblower and the documents came out.
  - tobacco companies hiding that smoking causes cancer: rational, again because of the leaked internal memos.
  - the moon landing being faked: irrational. she says it's all photo anomalies and the number of people who'd have to be in on it is absurd.
  - 9/11 as an inside job with controlled demolition: irrational, same reason — anomalies plus a conspiracy too big to keep quiet.
  - a local police department covering up an officer beating a suspect: rational once the dashcam leaked.
  - vaccines as a plot by the whole medical establishment to cause autism: irrational, same shape as the moon landing.
  - the claim that a government cooked its intelligence to justify a war: rational once the leaked memos showed the intelligence was being fixed around the decision.

  now she's been asked about a new case: a claim that the mayor of a small city has been taking kickbacks from a developer. there are no documents and no whistleblower. what their is is this: the city rezoned a parcel in a way that made no sense on the merits, the developer was the only plausible beneficiary, and the mayor's spending has visibly outpaced his salary for years. the official story is that the rezoning was a planning judgment call and the mayor inherited some money.

  i want you to predict what she'd say — rational, not rational, or something in between — and more importantly to lay out the rule or rules that fit her earlier verdicts. i can see at least two: something like a no-smoking-gun rule, and something like a best-explanation rule where a conspiracy belief is fine when it's the best explanation of otherwise puzzling facts, as long as the conspiracy is small and the motive is ordinary. do both of those actually fit her track record? which one does the mayor case select? and what's one further case i could ask her about that would tell them apart if the mayor case somehow doesn't.
reasoning: |-
  Okay, the user's friend has a clear framework for evaluating conspiracy theories, and I need to predict her verdict on a new case involving a mayor taking kickbacks. Let me start by understanding her established verdicts.

  First, looking at the cases she deemed rational: Tuskegee, tobacco companies, police cover-up, and government cooking intelligence. All involve concrete evidence like leaked documents or whistleblowers. The moon landing, 9/11 inside job, and vaccine-autism theories were irrational due to lack of evidence and implausible scale. 

  The key pattern here is evidence-based. She requires documented proof or credible whistleblowers for a belief to be rational. Anomalies alone aren't enough. The mayor's case has circumstantial evidence—rezoning benefits one developer, mayor's spending exceeds salary. But no documents or whistleblower. Her past rulings suggest she'd see this as insufficient; it's like the irrational cases where anomalies were present but no smoking gun.

  The best-explanation theory doesn't fit her past decisions. In Tuskegee, even though the conspiracy explained the anomalies, she only accepted it after evidence emerged. Without such evidence, she'd likely view the mayor situation as suspicious but not rationally confirmable. 

  To distinguish between the evidence rule and best-explanation rule, the user could propose a case with strong circumstantial evidence but no leak. For example, a small-town official with unexplained wealth after a controversial contract. If she calls it rational, she might lean towards best-explanation; if not, she's strict on evidence.
answer: |-
  Based on your friend's established pattern of verdicts, here's a clear prediction and the underlying rule:

  1.  **Prediction for the Mayor Case:** Your friend would likely say it is **NOT rational** to believe the kickback conspiracy *at this time*.

  2.  **The Rule that Fits Her Verdicts:** Your friend operates on a **"Requires Direct Evidence or Credible Whistleblower" Rule**. Her rationality verdicts consistently hinge on the presence of *leaked documents, whistleblower testimony, or similar concrete evidence* (e.g., leaked memos for Tuskegee, tobacco, war intelligence; leaked dashcam for police). Without this, even if the circumstances are highly suspicious and a conspiracy would be a plausible explanation, she deems belief irrational (Moon Landing, 9/11, Vaccines).

  3.  **Analysis of the Rules You Proposed:**
      *   **"No-Smoking-Gun" Rule (Fits Perfectly):** This is essentially the rule above. A "smoking gun" (leaked docs, whistleblower) is required for rational belief. Anomalies, motives, and circumstantial evidence alone are insufficient. This rule perfectly explains *every single one* of her prior verdicts.
      *   **"Best-Explanation + Small Conspiracy" Rule (Does NOT Fit):**
          *   **Why it Fails:** While the *outcomes* of her rational verdicts often align with the "best explanation" (Tuskegee, tobacco, police, war intel), her *reasoning* explicitly relies on the *evidence*, not the explanatory power alone.
          *   **Counterexamples:**
              *   **Moon Landing/9/11:** She calls these irrational *despite* proponents arguing they are the "best explanation" for the anomalies. She dismisses them because of the implausible scale *and the lack of evidence*.
              *   **Mayor Case (Hypothetical):** Under a pure "best explanation + small conspiracy" rule, the Mayor case (small group, clear motive, suspicious circumstances) *should* be rational. However, based on her track record of requiring evidence, she would reject it.
          *   **The Key Difference:** For your friend, "best explanation" based on anomalies/circumstances *without evidence* is precisely what defines the *irrational* beliefs (Moon, 9/11, Vaccines). Evidence is the threshold.

  4.  **Why the Mayor Case Selects the "Evidence" Rule:** The Mayor case has **significant circumstantial evidence** (suspicious rezoning, sole beneficiary, unexplained wealth) pointing to a **small, plausible conspiracy** (mayor, developer, maybe a few others). This perfectly satisfies the "best explanation + small conspiracy" criteria. *However*, it **lacks the direct evidence or whistleblower** that your friend *consistently required* in her "rational" verdicts (Tuskegee docs, tobacco memos, dashcam, war intel memos). Therefore, her pattern dictates she would deem belief in the kickbacks **not rational** *at this time*.

  5.  **A Case to Distinguish the Rules:** To definitively test whether she uses the "Evidence Required" rule or the "Best Explanation + Small Conspiracy" rule, propose this scenario:

      **The "Suspicious Contract" Case:**
      *   A small-town school board awards a lucrative contract for new computers to a company owned by the board president's brother-in-law.
      *   The winning bid was *significantly* higher than bids from reputable national firms.
      *   The board provides a vague justification about "local support" and "community ties," but the decision seems objectively poor.
      *   The board president and brother-in-law are seen having expensive dinners together frequently around the time of the bidding.
      *   There are **no leaked documents, no whistleblowers, just the highly suspicious circumstances and clear conflict of interest.**

      *   **If she says Rational:** This would support the **"Best Explanation + Small Conspiracy" rule**. The conspiracy is tiny (2-3 people?), the motive is clear (greed/nepotism), and it's undeniably the best explanation for the objectively bad decision and behavior.
      *   **If she says Not Rational:** This would strongly confirm the **"Evidence Required" rule**. Despite the powerful circumstantial case and plausible small conspiracy mirroring the Mayor case, the lack of a "smoking gun" (leak/whistleblower) means it doesn't meet her threshold for rational belief based on her historical judgments.

  **In Summary:** Your friend's track record shows a clear, evidence-based epistemology for conspiracy theories. Belief is only rational *after* concrete proof emerges (documents, whistleblowers). Suspicious circumstances alone, no matter how compelling the potential explanation or how small the conspiracy might be, are insufficient. The Mayor case lacks this evidence, so she'd likely deem belief not rational. The "Suspicious Contract" case is the perfect test to confirm whether she strictly adheres to this evidence requirement or if compelling circumstantial evidence for a very small conspiracy could ever suffice without it. Based on her history, betting on "Not Rational" for the Suspicious Contract case is safer.
