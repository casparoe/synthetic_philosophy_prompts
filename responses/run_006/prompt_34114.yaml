prompt: |-
  ok so I've been staring at Bongard problems for a week and I want to know what a theory of this kind of concept induction actually needs to pull off before I read another paper. You know the setup: six boxes on the left, six on the right, all obeying some rule, you have to figure out the rule from just those twelve examples. What does a theory of how anyone does that — or how a system could do it — have to deliver?

  I want the full desiderata. What cases must it handle? The original hundred are one thing, but there are also the ones that involve counting, or spatial relations between shapes, or the relative sizes of things, or ones where the rule is about the whole pattern rather than individual boxes. Which of these are non-negotiable and which are stretch goals?

  What distinctions does the theory have to respect? Like, I can tell that "the shapes on the left are all convex" is different from "the shapes on the left are all roughly circular" even though both pick out the same six examples — a theory that just finds any seperating hyperplane in feature space isn't giving me that. And there's a difference between a system that can classify new examples correctly and one that has actually got the rule, right? So the theory has to say something about what it means to have the rule.

  What results from psychology does it have to be consistent with? Like, humans are way better at some Bongard problems than others, and we can often get the rule from just two or three examples per side, but we also have strong priors that sometimes lead us to the wrong rule. And what about the fact that if you show people a bunch of Bongard problems they start to get faster — there's some kind of meta-learning going on.

  And what about the machine learning side? Modern vision-language models are starting to get decent at these, but they still fail in weird ways. Does a theory have to explain both human and machine performance, or is it fine to just aim at one?

  Most importantly: tell me which desiderata are the real killers. Which single requirement knocks out the most approaches? And are any pairs of these requirements jointly unsatisfiable? Like, if you want the theory to explain how humans can induce a rule from four examples, and you also want it to explain why the rule they induce is usually the "right" one and not some gerrymandered disjunction, it seem like those might pull in opposite directions — the first wants massive inductive bias and the second wants the bias to be somehow objectively correct. I'd love to know if that tension is real or if I'm confused.

  A table at the end scoring the main approaches (classical AI, Bayesian program learning, deep learning, neuro-symbolic) against the list would be nice but the desiderata are what I really need.
