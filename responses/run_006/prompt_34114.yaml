  Hmm, their core tension is between two things: wanting a theory that explains human efficiency (few-shot learning with strong priors) while also capturing rule "correctness" beyond just statistical separation. That "gerrymandered disjunction" point is sharp - it's the classic overfitting-vs-underfitting dilemma but for symbolic reasoning. 

  Breaking it down: The must-haves seem to be:
