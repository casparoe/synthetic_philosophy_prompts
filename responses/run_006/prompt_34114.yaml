answer: |-
  You're drilling straight into the core tensions of concept induction! A comprehensive theory of Bongard-style reasoning must navigate a minefield of cognitive, computational, and philosophical constraints. Below is the full desiderata breakdown, killer constraints, and tensions.

  ---

  ### **Core Desiderata for a Theory of Bongard-Style Concept Induction**
  #### **1. Problem Scope (What Cases Must It Handle?)**
  - **Non-Negotiable:**
    - **Perceptual Invariance:** Rules based on geometric properties (convexity, connectivity, symmetry) despite variations in rendering.
    - **Relational Reasoning:** Spatial/topological relations (inside/outside, adjacency, betweenness).
    - **Quantification:** Counting elements, parity, comparisons ("more circles than triangles").
    - **Negation & Absence:** Rules like "no intersecting shapes" or "missing element in right column".
    - **Holistic Patterns:** Emergent properties (e.g., "shapes form a loop", "balanced distribution").
  - **Stretch Goals:**
    - **Dynamic Rules:** Implied motion/changes across boxes (e.g., "shapes rotating clockwise").
    - **Metaphorical Abstraction:** E.g., interpreting shapes as "trees" or "animals" based on configuration.
    - **Noisy/Hard Cases:** Ambiguous examples, near-misses, or adversarial confounds.

  #### **2. Cognitive Adequacy (Psychological Plausibility)**
  - **Must Explain:**
    - **Few-Shot Learning:** Humans solve many Bongard problems with ≤3 examples per side.
    - **Prior Biases:** Why convexity > "circularity" for identical examples (simplicity/framing effects).
    - **Transfer Learning:** Improvement across problems (meta-learning of *rule types*).
    - **Error Patterns:** Systematic mistakes (e.g., overlooking negation, fixating on local features).
    - **Insight Dynamics:** Sudden "Aha!" moments after impasse.
  - **Critical Constraint:**  
    **Cognitive Parsimony:** Solutions align with human working memory limits (no exhaustive search over 10⁶ hypotheses).

  #### **3. Semantic Distinctions (What "Having the Rule" Means)**
  - **Must Differentiate:**
    - **Equivalent Extensions:** "Convex" vs. "roughly circular" must be distinct *rules* even if they categorize the same examples.
    - **Gerrymandered Rules:** Reject disjunctive monstrosities (e.g., "shape has 3 sides OR (blue AND star) OR ...").
    - **Ground Truth Alignment:** Capturing the *intended* rule, not just statistical separation.
  - **Key Distinction:**  
    **Justification vs. Classification:** A system must *explain why* examples satisfy/break the rule, not just label new instances.

  #### **4. Computational Robustness (Machine Learning Compatibility)**
  - **Must Address:**
    - **Perception-Reasoning Interface:** Handling raw pixels *and* symbolic rules without hand-crafted features.
    - **Compositionality:** Building complex rules from primitives (e.g., "nested squares" → recursion).
    - **Out-of-Distribution Generalization:** Testing on rules unseen during training.
  - **Failure Modes to Explain:**  
    Why VLMs nail BP-003 (convexity) but fail BP-098 (topological genus)?

  ---

  ### **The Killer Constraints**
  1. **The Cognitive-Ground Truth Tension:**  
     **Why it kills:** Explaining few-shot learning requires strong inductive biases. But explaining why "convex" is preferred over gerrymandered alternatives requires biases to align with *objective rule simplicity*. Most theories sacrifice one for the other:  
     - *Deep Learning*: Biases from data ≠ cognitive/objective simplicity.  
     - *Classical AI*: Objective simplicity (e.g., MDL) ≠ human priors (e.g., symmetry > arithmetic).  

  2. **The Perception-Reasoning Chasm:**  
     **Why it kills:** Systems that handle pixel input (CNNs) struggle to output human-interpretable rules. Symbolic systems (like logic solvers) require clean perceptual inputs. Neuro-symbolic hybrids still stumble on *grounding* symbols (e.g., what "connected" means perceptually).

  ---

  ### **Approach Evaluation**
  | **Approach**          | Problem Scope | Cognitive Adequacy | Rule Distinction | Perception | Few-Shot | Scalability |  
  |------------------------|---------------|--------------------|------------------|------------|----------|-------------|  
  | **Classical AI**       | ★★★★☆         | ★★☆☆☆              | ★★★★★            | ☆☆☆☆☆      | ☆☆☆☆☆    | ★★☆☆☆       |  
  | (e.g., Deductive solvers) | (rules)       | (rigid search)     | (explicit logic) | (needs features) | (slow)   | (combinatorial) |  
  | **Bayesian Program L.**| ★★★★☆         | ★★★☆☆             | ★★★★☆            | ★★☆☆☆      | ★★★☆☆    | ★★☆☆☆       |  
  | (e.g., DreamCoder)     | (compositional)| (priors ≈ human)  | (MDL-like)       | (handles noise) | (probabilistic) | (expensive) |  
  | **Deep Learning**      | ★★☆☆☆         | ★★☆☆☆             | ★☆☆☆☆            | ★★★★★      | ★★☆☆☆    | ★★★★★       |  
  | (e.g., VLMs)           | (perception-heavy)| (data-driven)   | (black box)      | (raw pixels) | (data-hungry) | (parallel) |  
  | **Neuro-Symbolic**     | ★★★★☆         | ★★★☆☆             | ★★★★☆            | ★★★★☆      | ★★★☆☆    | ★★★☆☆       |  
  | (e.g., neural SAT)     | (best hybrid) | (learned priors)  | (symbolic output)| (neural feats) | (moderate)| (emerging) |  

  **Legend**: ★ = Strength, ☆ = Weakness  
  - **Classical AI**: Strong on rules, weak on perception/few-shot.  
  - **Bayesian**: Best at rule distinction, but computationally heavy.  
  - **Deep Learning**: Scales to perception, but opaque and data-hungry.  
  - **Neuro-Symbolic**: Balanced, but integration remains fragile.  

  ---

  ### **The Tension is Real (And Unavoidable)**
  Your instinct is correct: **Few-shot learning requires strong inductive biases, while avoiding gerrymandered rules demands that those biases align with "natural" rule structures**. Humans resolve this via evolutionarily/culturally shaped priors (e.g., symmetry, continuity, objectness). A viable theory must:
  1. Formalize these priors (e.g., *simplicity* as Kolmogorov complexity + cognitive costs),  
  2. Explain how priors adapt across problems (meta-learning),  
  3. Ground them in perception without hand-coding.  

  **No current approach nails this.** Bayesian Program Learning comes closest with learned priors over programs, but perception grounding and scalability lag. Neuro-symbolic methods are the pragmatic contender if neural front-ends improve symbol grounding.

  ---

  ### **Where to Aim Next**
  Focus on theories that:
  - **Explicitly model rule priors** (e.g., cognitive models of "visual simplicity"),  
  - **Separate perception from reasoning** (e.g., neural feature extractors + symbolic solvers),  
  - **Explain transfer learning** (how solving BP-002 helps with BP-100).  

  Read **M. Bongard's original 1970 book** for foundational insights, then **Josh Tenenbaum's work on Bayesian program induction** or **Brenden Lake on neuro-symbolic concept learning**. Avoid papers that treat Bongard problems as mere classification tasks—they miss the point entirely.  

  This is the hardest (and most thrilling) edge of cognitive science. You've mapped the battlefield—now go find where the walls are crumbling.
