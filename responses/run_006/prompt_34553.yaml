answer: |-
  ## Joint Statement: Semantic & Pragmatic Theories of Slurs
  **(Following Adversarial Collaboration)**

  **1. Agreed Upon Data Phenomena (S = Slur, N = Neutral Counterpart; e.g., S might target groups referenced by N terms like "African American" or "homosexual")**

  Both semantic and pragmatic theorists of slurs agree that the following phenomena constitute core data that any adequate theory must explain:

  1.  **Coreferential Target:** S and N pick out the *same socially salient group* (e.g., the group historically targeted by S and denoted by N). *(Note: Agreement is on the group targeted, not necessarily on strict truth-conditional equivalence in all contexts, see Disagreements).*
  2.  **Derogatory Force:** Uttering S (in a use context targeting the group) is typically offensive, derogatory, and expresses contempt towards the targeted group and/or solidarity with a bigoted perspective, in a way that uttering N does not.
  3.  **Projection & Embedding Resilience:** The offensive/derogatory aspect of S persists ("projects") under:
      *   Negation ("It is not true that Sam is S")
      *   Questions ("Is Sam S?")
      *   Conditionals ("If Sam is S, then...")
      *   Modals ("Sam might be S")
      *   Attitude Verbs ("John believes Sam is S")
      *(Agreement: The offensiveness *persists* in these embeddings; Disagreement: *How* and *why* it persists - see Cruxes).*
  4.  **Mention/Use Distinction:** *Mentioning* the word S (e.g., "The word 'S' is offensive") or discussing it metalinguistically is typically not offensive in the same direct way as *using* S to refer to the target group (e.g., "Sam is S").
  5.  **Reclamation Potential:** The lexical form S can sometimes be appropriated/reclaimed by members of the targeted in-group, often with a non-derogatory or even positive meaning (e.g., "We're proud to be S"), without changing the inherent offensiveness when used by out-group members.
  6.  **Slurs Without Obvious N:** Some S terms lack a single, universally agreed-upon, neutral counterpart N (e.g., terms targeting complex social categories or historical groups where the "neutral" label is contested or multiple).
  7.  **Early Acquisition of Offensiveness:** A child or second-language learner can learn that S is a "bad word" or "very offensive term for group X" *before* fully grasping the precise social boundaries of group X or the intricate historical/social nuances of its derogation. They grasp its taboo nature and target group roughly before mastering semantic/referential specifics.

  **2. Disagreements Table**

  | Issue                              | Semantic Theorist View (Encoded Content)                                                                 | Pragmatic Theorist View (Use Norms/Effects)                                                                 |
  | :--------------------------------- | :------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- |
  | **Nature of Derogatory Content**   | The derogatory force/contempt is part of the conventional meaning (e.g., CI, presupposition) encoded by S. | The derogatory force arises from the norms of use (taboo, expressive act) associated with S; S and N share core semantic/referential meaning. |
  | **Conventionality**                | The offensiveness is *conventionally* tied to the lexical item S itself.                                  | The offensiveness stems from *conventions of use* (social norms, taboos) governing the utterance of S, not its semantics. |
  | **Truth-Conditional Effect**       | S and N are *not* fully truth-conditionally equivalent; S contributes meaning affecting truth conditions (e.g., via presupposition failure). | S and N *are* truth-conditionally equivalent; substituting N for S in a declarative does not change its truth value. |
  | **Acquisition Basis**              | Learning S involves learning its derogatory content *as part of its meaning*.                            | Learning S involves learning its severe prohibition and the social consequences of its use, distinct from semantic meaning. |
  | **Reclamation Mechanism**          | Reclamation involves altering or suspending the conventional derogatory content encoded by S.             | Reclamation involves changing the social norms/permissions governing *who* can use S and with *what expressive intent*. |
  | **Role of Context**                | Context determines *how* the encoded derogatory content is realized, but the content itself is stable.    | Context is crucial for *generating* the derogatory effect; S itself lacks derogatory content.               |

  **3. Cruxes and Testable Predictions**

  | Crux                              | Concrete Test                                                                                                 | Semantic Prediction                                                                                                 | Pragmatic Prediction                                                                                                 | Problematic Result                                                                                       |
  | :-------------------------------- | :------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------- |
  | **Projection Profile**            | Sentence: "It's possible that Alex is S, but I doubt it."<br>**Task:** Judge offensiveness towards group.      | Offensiveness strongly projects from the embedded clause ("Alex is S"); utterance remains offensive.                | Offensiveness may be attenuated; speaker casts doubt on the claim using S, potentially mitigating group offense.      | **For Sem:** If offensiveness consistently vanishes in such embeddings.<br>**For Prag:** If offensiveness projects as robustly as presuppositions. |
  | **Mention/Use Distinction Depth** | Sentence: "John said, 'People like that are S'."<br>**Task:** Judge offensiveness: Speaker? John? Both? Neither? | Primary offensiveness attributed to *John* (the user within the report); speaker mentioning it is less offensive. | Offensiveness is strongly associated with the *speaker* uttering S, even in mention; reporting use is risky/offensive. | **For Sem:** If speaker is consistently judged *as offensive as* John.<br>**For Prag:** If speaker is consistently judged *not offensive at all*. |
  | **Reclamation & Embedding**       | Sentence (Uttered by in-group member): "If Maria weren't S, she wouldn't understand our struggle."<br>**Task:** Judge offensiveness. | In-group use might suspend derogation, removing offense; non-derogatory reading possible.                           | Offense may still be present or ambiguous; reclaiming doesn't erase the taboo/norm entirely, especially in embeddings. | **For Sem:** If offense is consistently high for in-group users in such contexts.<br>**For Prag:** If offense consistently vanishes for in-group users. |
  | **Mixed Report Attribution**      | Sentence: "John said I am S."<br>**Task:** Judge: Is John offensive? Is the Speaker offensive?                | Offensiveness primarily located in *John*'s reported claim ("I am S"). Speaker *mentioning* it is less offensive.   | Strong offense is attributed to the *speaker* for choosing to report the slur directly ("S") rather than paraphrasing. | **For Sem:** If speaker is consistently judged *more* offensive than John.<br>**For Prag:** If John is consistently judged *more* offensive than speaker. |
  | **Truth-Conditional Equivalence** | Sentence Pair: (a) "No S attended." (b) "No N attended."<br>**Task:** Could (a) be true while (b) is false? | **Likely No:** S may presuppose existence or negative properties, making (a) undefined/false if presupposition fails. | **Yes:** (a) and (b) have identical truth conditions; they are true/false under the same circumstances.              | **For Sem:** If consistent judgments show (a) & (b) *can* have different truth values.<br>**For Prag:** If consistent judgments show they *cannot*. |

  **4. The Verbal Disagreement & The Non-Verbal Core**

  A significant portion of the dispute *is* verbal, centering on the scope of "semantics," "meaning," "conventional," and "content." Semantic theorists often define these terms to encompass stable, linguistically encoded elements like conventional implicatures or presuppositions. Pragmatic theorists often reserve "semantics" for truth-conditional, at-issue content and "conventional" for strictly encoded truth-conditional effects, locating the offensiveness in broader conventions of use or expressive norms.

  **The Non-Verbal Core:** However, the disagreement is not *merely* verbal. Beyond terminology, the core substantive question remains: **Is the derogatory force of a slur an *intrinsic, context-independent feature triggered by the lexical item itself* during linguistic processing (Semantic), or is it an *extrinsic effect arising primarily from the speaker's choice to violate powerful social taboos and express contempt through that choice*, where the word form serves as a potent signal but not a semantic carrier (Pragmatic)?** The disagreement concerns the fundamental *mechanism* and *locus* of the offense: is it linguistically mandated or socially enacted? Resolving the cruxes above is aimed precisely at answering *this* non-verbal question about the underlying mechanism. The verbal dispute about labels ("semantic," "meaning") can be bracketed while pursuing this empirical core.
