prompt: |-
  I am presenting a paper at a social choice theory workshop next term. My thesis is that the Gibbard–Satterthwaite theorem, though formally unimpeachable, has been overinterpreted in normative debates about democracy. I argue that the theorem demonstrates the impossibility of strategy-proofness only under a model of voter preferences and strategic behavior that rarely applies to large-scale elections: voters must know others' preferences precisely enough to identify a profitable misrepresentation, must be willing to vote against their conscience for marginal expected gain, and must navigate a ballot that records a full preference ordering. None of these conditions reliably holds in real electoral contexts, so the theorem's bearing on democratic legitimacy is weaker than commonly claimed. My audience includes two formal social choice theorists who have published corollaries extending the Gibbard–Satterthwaite framework; three political philosophers who take impossibility results as a starting point for advocating deliberative over aggregative conceptions of democracy; and an economist who designs strategy-proof matching mechanisms and is impatient with philosophical attempts to soften formal impossibility results. Prepare my Q&A prep sheet: the eight or so objections I will actually receive, ordered by how damaging they are, each phrased as this specific audience would phrase it, with a concise reply and a frank note on where the reply is weakest. Include the question I most hope nobody asks.
