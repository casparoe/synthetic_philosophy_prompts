  The "hoped unasked question" about partial strategy-proofness is terrifying because it forces admission that weaker strategic incentives still matter - something the economist could exploit. The reply's weakness is palpable there. 

  Notably, all replies share a common vulnerability: they're defensive about the lack of positive alternatives. The user needs crisp examples of non-GS-vulnerable real-world outcomes to avoid sounding like they're making excuses for flawed systems. 

