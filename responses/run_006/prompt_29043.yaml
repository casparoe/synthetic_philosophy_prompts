prompt: |-
  I work as a software engineer on product analytics, and I keep running into the same situation: an overall comparison points one way, but when I split the data by some variable, the comparison flips. My gut reaction about which result to trust differs from case to case, and I cannot articulate the rule behind my reactions. I know this kind of reversal has a name, but the name alone does not tell me which direction to trust in a given case. I would like you to extract the rule I seem to be applying, state it precisely, and tell me where it breaks.

  Here are the cases.

  1. Referrer and retention. We compared two referrers, A and B, on 30-day retention. Overall, A-referred users retain better: 42% versus 36%. But A sends us mostly iOS users, and iOS users retain better regardless of referrer. Split by platform, B is better within both platforms: on iOS, A 50% versus B 52%; on Android, A 30% versus B 34%. My verdict: I trust the platform-split result. B is the better referrer, and the overall comparison is misleading.

  2. Signup page and activation. We tested an old signup page against a new one. Overall, the new page produces more activated accounts: 45% versus 40%. But when we split users by time spent on the signup page, the old page produces more activations within every time-on-page bucket. My verdict: I trust the overall result here. Time on page is something the page version itself changes, so splitting on it is misleading.

  3. Banner exposure and satisfaction among purchasers. We looked only at users who made a purchase and found that users shown a discount banner at checkout reported lower post-purchase satisfaction than users not shown it. But across all users, seeing the banner and satisfaction appear to be unrelated. My verdict: I do not trust the purchasers-only comparison. Restricting the analysis to purchasers creates an association that I doubt reflects the banner's actual effect.

  4. Plan type and revenue. We compared two subscription plans, Basic and Pro, on revenue per user. Overall, Pro users generate more revenue. But when we split users by how many support tickets they filed in their first month, Basic generates more revenue within every ticket-count bucket. My verdict: I trust the overall result. Support-ticket count is downstream of plan choice, so splitting on it feels like controlling away part of what Pro does.

  5. Tutorial completion and retention. We compared users who completed an onboarding tutorial with those who skipped it on long-term retention. Overall, completers retain much better. But among users who were active in their first week, completers and skippers retain at about the same rate. My verdict: I am genuinely torn. On one hand, the tutorial seems to cause first-week activity, which would make this like case 2 or case 4. On the other hand, the week-one-active comparison feels informative in a way that the time-on-page comparison does not, and I cannot say why.

  Cases 1 and 2 are the pair that bothers me most. In both, an overall result and a within-bucket result point in opposite directions, but I trust the split in case 1 and the overall in case 2. The only difference I can gesture at is that platform is true before the user ever encountered the referrer, whereas time on page happens after the user saw the page version. My working hypothesis is therefore something like: condition on variables that were true before the treatment, and never on variables that happen after it.

  Please test that hypothesis against all five cases, repair it if necessary, and state the resulting principle precisely. In particular, tell me what the principle says about case 5, and about a case I have not listed: two email subject lines are compared on open rate, subject line assignment is based on signup cohort, and the overall result conflicts with the result split by signup cohort. If no single principle gets all five verdicts, say which verdict it forces me to drop and why.
reasoning: |-
  We are dealing with Simpson's Paradox, where the direction of an association reverses when conditioning on a third variable. The key is to determine when to condition and when not to.

  Your hypothesis: condition on variables that were true before the treatment, and never on variables that happen after it.

  Let's test this against each case:

  Case 1 (Referrer and retention):
  - Treatment: Referrer (A or B)
  - Outcome: 30-day retention
  - Splitting variable: Platform (iOS or Android) -> which is a pre-treatment variable (user's platform is determined before they are referred)
  - Your verdict: Trust the split (by platform). This matches the hypothesis because we condition on a pre-treatment variable.

  Case 2 (Signup page and activation):
  - Treatment: Signup page version (old or new)
  - Outcome: Activation
  - Splitting variable: Time spent on the signup page -> this is post-treatment (the time spent is after seeing the page version)
  - Your verdict: Trust the overall. The hypothesis says not to condition on post-treatment variables, so we don't split. This matches.

  Case 3 (Banner exposure and satisfaction among purchasers):
  - We are looking at the effect of banner exposure on satisfaction, but only among purchasers.
  - Treatment: Banner exposure (shown or not)
  - Outcome: Satisfaction
  - Splitting variable: Purchase (yes/no) -> but note: we are restricting to purchasers, which is effectively conditioning on purchase. Purchase happens after the banner exposure (which is at checkout) and is likely affected by the banner. So purchase is a post-treatment variable.
  - Your verdict: Do not trust the purchasers-only comparison. The hypothesis says not to condition on post-treatment variables (like purchase). So we should not condition on purchase. Therefore, we trust the overall (which is across all users). This matches.

  Case 4 (Plan type and revenue):
  - Treatment: Plan type (Basic or Pro)
  - Outcome: Revenue per user
  - Splitting variable: Support-ticket count in the first month -> this is post-treatment (after choosing the plan)
  - Your verdict: Trust the overall. The hypothesis says not to condition on post-treatment variables. So we don't split. This matches.

  Case 5 (Tutorial completion and retention):
  - Treatment: Tutorial completion (completed or skipped)
  - Outcome: Long-term retention
  - Splitting variable: Activity in the first week -> this is post-treatment (after the tutorial)
  - Your verdict: Torn. 
    - If we follow the hypothesis strictly, we should not condition on first-week activity (post-treatment) and trust the overall (which says completers retain better). 
    - However, you are torn because the first-week activity might be a mediator (the tutorial causes activity, which then causes retention). But by conditioning on it, we might be blocking part of the effect. On the other hand, we might be interested in the direct effect (the effect of the tutorial not through first-week activity) and the indirect effect. But for the total effect (which is usually what we want for decision making) we should not condition.

  But note: in the overall, the tutorial completion is associated with better retention. However, when we condition on first-week activity, the association disappears. This suggests that the entire effect of the tutorial on retention is mediated by first-week activity. But if we condition on a mediator, we break the path of the indirect effect and are left with the direct effect. For the total effect (the overall) we should not condition.

  So according to the hypothesis, we should trust the overall. But why are you torn? Because you feel that the week-one-active comparison is informative? It might be that you are interested in understanding the mechanism. However, for the purpose of deciding whether the tutorial is beneficial for retention, the overall is the correct one because it captures the total effect.

  Now, let's state the principle:

  **Principle**: When estimating the causal effect of a treatment on an outcome, we should condition on pre-treatment covariates (to adjust for confounding) but not on post-treatment variables (which might be mediators or colliders). Conditioning on post-treatment variables can block part of the effect of the treatment (if it is a mediator) or introduce bias (if it is a collider).

  But note: in case 1, we conditioned on a pre-treatment variable (platform) and it was correct because it was a confounder (it affects both the treatment assignment and the outcome). In case 2, time on page is a mediator (affected by the treatment and then affects the outcome). In case 3, purchase is a mediator or a collider? Actually, by conditioning on purchase (which is downstream of the banner and affects satisfaction) we might be creating a collider bias. But in any case, it's post-treatment.

  So the principle seems to hold for cases 1-4. For case 5, we should not condition on first-week activity because it is post-treatment. So we trust the overall.

  But let's consider the email subject line case you mentioned:

  - Two email subject lines (A and B) are compared on open rate.
  - Subject line assignment is based on signup cohort (i.e., one cohort gets A, the next gets B, and so on).
  - Overall: say A has a higher open rate.
  - But split by cohort: in each cohort, B has a higher open rate? (This would be a reversal.)

  How do we apply the principle?

  - Treatment: subject line (A or B)
  - Outcome: open rate
  - Splitting variable: signup cohort -> this is a pre-treatment variable (the cohort is determined before the treatment is assigned). Moreover, the treatment assignment is based on cohort, so cohort is a confounder: it affects which treatment the user gets and might also affect the open rate (if cohorts are different in their responsiveness).

  Therefore, we should condition on cohort? But note: the reversal might be because of the confounding by cohort. Without conditioning, the overall effect is confounded. So the split by cohort is the correct one? 

  But wait: in the overall, we see A has a higher open rate. But within each cohort, B is better. This reversal suggests that the cohorts are imbalanced in size and/or responsiveness. For example, maybe the A cohorts were larger and had users more likely to open emails. Then the overall is misleading. We should condition on cohort because it is a confounder.

  So the principle: condition on pre-treatment confounders. But note: not every pre-treatment variable is a confounder. We only need to condition on confounders (variables that affect both the treatment and the outcome). In case 1, platform is a confounder because it affects which referrer the user comes from (maybe A is more common on iOS) and it affects retention. In the email case, cohort is a confounder because it determines the treatment and might affect the outcome.

  Therefore, we refine the principle:

  **Refined Principle**: To estimate the causal effect of a treatment on an outcome, we should condition on pre-treatment variables that are confounders (i.e., they affect both the treatment assignment and the outcome). We should not condition on post-treatment variables because they might be mediators (blocking the causal path) or colliders (introducing bias).

  Now, let's apply this to case 5:

  - Treatment: tutorial completion (we assume this is assigned, but note: users choose to complete or skip, so there might be self-selection. But for simplicity, we consider it as the treatment).
  - Outcome: long-term retention.
  - Splitting variable: first-week activity (post-treatment).

  We should not condition on first-week activity because it is a post-treatment variable and likely a mediator. Therefore, we trust the overall result (completers retain better). The split result is the direct effect (if we control for the mediator) but we are usually interested in the total effect.

  But note: in case 5, you were torn. The reason might be that the split result (within active users) shows no difference. This could be because the tutorial only affects retention by making users active in the first week. Without the tutorial, users are less active and then less retained. But if they are active in the first week, then the tutorial doesn't matter. So the tutorial is only beneficial for those who would not have been active otherwise. But for decision making, we want to know: should we push the tutorial? The overall effect (which is positive) tells us that pushing the tutorial will increase retention. The split result doesn't change that.

  Therefore, the principle says: trust the overall.

  Now, what about the email case? We condition on cohort (pre-treatment confounder) and then we see that within each cohort, B is better. So we conclude B is better. The overall was misleading because of the confounding by cohort.

  So the principle holds for the email case: condition on the pre-treatment confounder (cohort).

  But note: in some cases, there might be multiple confounders. We must condition on all confounders to get an unbiased estimate of the causal effect.

  Let's check if we missed any case:

  Case 3: We did not condition on purchase (post-treatment) and we trust the overall. The overall shows no association between banner and satisfaction. But note: the overall might be confounded? However, the problem doesn't mention any confounder. We are comparing users shown the banner and those not. But if the banner assignment is random, then the overall is valid. If not, we might need to condition on pre-treatment confounders. But the verdict was to trust the overall (across all users) and not the purchasers-only. So the principle holds.

  Therefore, the refined principle gets all five verdicts:

  - Case 1: Condition on platform (pre-treatment confounder) -> trust split.
  - Case 2: Do not condition on time on page (post-treatment) -> trust overall.
  - Case 3: Do not condition on purchase (post-treatment) -> trust overall (across all users).
  - Case 4: Do not condition on support-ticket count (post-treatment) -> trust overall.
  - Case 5: Do not condition on first-week activity (post-treatment) -> trust overall.

  And for the email case: condition on cohort (pre-treatment confounder) -> trust split by cohort.

  But note: in case 5, the principle forces us to trust the overall. You were torn, but the principle gives a clear answer: trust the overall because we should not condition on a post-treatment variable.

  So the final principle:

  **Causal Conditioning Principle**: 
  - To estimate the total causal effect of a treatment on an outcome, condition on pre-treatment variables that are confounders (i.e., they causally influence both the treatment assignment and the outcome) to adjust for confounding. 
  - Do not condition on post-treatment variables (i.e., variables that are causally downstream of the treatment) because such conditioning may:
    - Block the causal pathway (if the variable is a mediator), thus estimating a direct effect instead of the total effect.
    - Induce collider bias (if the variable is a common effect of the treatment and the outcome or other variables), creating a spurious association.

  This principle aligns with the do-calculus and causal diagrams (e.g., using directed acyclic graphs).

  In summary: 
  - Always condition on pre-treatment confounders.
  - Never condition on post-treatment variables when estimating the total effect.

  This principle should guide which result to trust in each case.
answer: |-
  Based on your cases and verdicts, I've reverse-engineered your decision rule, refined it to handle edge cases, and formalized it into a principle. Let's break it down step by step.

  ### Your Implicit Principle (Refined)
  **"Trust comparisons that condition on pre-treatment confounders, but never condition on post-treatment mediators or colliders. When in conflict, prioritize the analysis that reflects the causal pathway of interest."**

  #### Key Definitions:
  - **Pre-treatment confounder**: A variable set *before* treatment that affects both treatment assignment and outcome (e.g., user platform in Case 1).
  - **Post-treatment variable**: A variable set *after* treatment that is causally downstream (e.g., time on page in Case 2).
  - **Mediator**: A post-treatment variable through which the treatment affects the outcome (e.g., first-week activity in Case 5).
  - **Collider**: A variable influenced by both treatment and outcome; conditioning on it creates false associations (e.g., purchase in Case 3).

  #### Rule Application Table:
  | Case | Conflicting Results               | Splitting Variable      | Timing       | Role                 | Your Verdict       | Rule Application                                                                 |
  |------|-----------------------------------|-------------------------|--------------|----------------------|--------------------|----------------------------------------------------------------------------------|
  | 1    | Overall: A > B<br>Split: B > A    | Platform (iOS/Android) | Pre-treatment | Confounder           | Trust split        | ✅ Platform is a pre-treatment confounder; conditioning is necessary.             |
  | 2    | Overall: New > Old<br>Split: Old > New | Time on page         | Post-treatment | Mediator             | Trust overall      | ✅ Time on page is a post-treatment mediator; conditioning distorts the effect.   |
  | 3    | Overall: No link<br>Split: Banner ↓ satisfaction | Purchase status     | Post-treatment | Collider             | Trust overall      | ✅ Purchase is a collider; conditioning creates false association.               |
  | 4    | Overall: Pro > Basic<br>Split: Basic > Pro | Support tickets      | Post-treatment | Mediator/collider    | Trust overall      | ✅ Tickets are post-treatment; conditioning blocks Pro's value.                  |
  | 5    | Overall: Completers > Skippers<br>Split: No difference | First-week activity  | Post-treatment | Mediator             | Trust overall*     | ⚠️ Activity is a post-treatment mediator; conditioning hides total effect.      |

  ### Why This Rule Works for Your Cases:
  1. **Case 1 (Platform)**:  
     Platform is a pre-treatment confounder (affects both referrer likelihood and retention). Conditioning adjusts for bias → **trust split**.
  2. **Case 2 (Time on page)**:  
     Time on page is a post-treatment mediator (page version affects time, which affects activation). Conditioning blocks the treatment's effect → **trust overall**.
  3. **Case 3 (Purchase status)**:  
     Purchase is a collider (banner and satisfaction both affect purchase). Conditioning induces bias → **trust overall**.
  4. **Case 4 (Support tickets)**:  
     Tickets are post-treatment mediators (plan choice affects tickets, which affect revenue). Conditioning blocks Pro's value → **trust overall**.
  5. **Case 5 (First-week activity)**:  
     Activity is a post-treatment mediator (tutorial affects activity, which affects retention). Conditioning estimates the *direct effect* (tutorial → retention, bypassing activity), but you likely want the *total effect* (tutorial → activity → retention) → **trust overall**.

  ### Where the Rule Breaks:
  - **Mediation Analysis Needed**: If you care *how* the tutorial works (e.g., to optimize costs), the split (direct effect) becomes useful. The rule defaults to total effect unless mediation is explicitly sought.
  - **Unobserved Confounders**: If a pre-treatment confounder is missing (e.g., user motivation in Case 5), even the overall result may be biased.

  ### Email Subject Line Case (New Scenario):
  - **Setup**:  
    Subject lines A/B tested, assigned by signup cohort. Overall A wins, but split by cohort B wins.  
  - **Analysis**:  
    Cohort is a pre-treatment confounder (affects both subject line assignment and open rates).  
  - **Rule Application**:  
    **Trust the split by cohort**. Conditioning adjusts for cohort-based bias (e.g., Cohort 1 prefers B but gets A, diluting B's true effect).

  ### Final Principle (Precise):
  **"To estimate the total causal effect of a treatment (X) on an outcome (Y):  
  1. Condition on pre-treatment variables that are confounders (affect X and Y).  
  2. Never condition on post-treatment variables (mediators or colliders).  
  3. When splits contradict the overall, prioritize the analysis adhering to (1) and (2).  
  4. Default to total effect; use split only for mediation analysis."**

  This aligns with causal inference best practices (e.g., Pearl's do-calculus) and explains all your verdicts. In Case 5, it resolves your hesitation: the split is *informative* for mechanism insights but *misleading* for total impact—hence trust the overall unless mediation is the goal.
