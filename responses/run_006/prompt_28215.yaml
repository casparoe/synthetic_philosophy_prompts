prompt: |-
  So there's this thing I keep noticing and I can't tell if it has a name or if it's just one of those patterns everyone sees but nobody's bothered to label.

  My friends and I have this dumb game we play with a bag of chips where we pass it around the circle and each person can either take a handful and pass it on, or just take the whole bag and end it. And the thing is, the last person in the circle has zero reason not to take the whole thing — there's nobody after them to get mad or return the favor. But the second-to-last person *knows* that, so rationally they should just take the bag before it even reaches the last person. And then the third-to-last person knows *that*, so they should take it even earlier. If you follow this logic all the way back, the very first person should grab the bag immediately and the whole sharing thing should never get off the ground. But in real life it does. People pass it along for a few rounds, nobody grabs it on step one, and the whole chain doesn't unravel the way the logic says it should.

  I started seeing this same shape in totally different places. Group projects: the person doing the final proofread knows nobody's checking their work after them, so they do a sloppy job. But the person writing the section before them knows the proofreader's gonna slack, so *they* don't try very hard either, and it unraveles backwards until the first person doesn't even start. Or summer plans with friends: everyone knows that on the very last day of break, nobody has an incentive to be the one who hosts, so that final hangout never happens. But then the second-to-last one doesn't happen either, because everyone knows the last one won't. And yet somehow we do hang out over the summer — just not in the way the backward logic would predict.

  What I'm trying to figure out: is there an established name for this pattern where reasoning backwards from the end tells you the whole thing should collapse at step one, but actual people don't play it that way and end up better off for it? I'm not just asking "why are people irrational" — I want to know if there's a specific concept for this unraveling structure and the puzzle of why it doesn't always happen in practice. If there's a name, what are the main explanations people give for the gap between the logic and the behavior? And if there isn't one clean term, what are the closest ones and how do they differ from each other?

  Oh and if you could just lead with the bottom line — like "yes this is called X" or "there's no single term but it sits between Y and Z" — right in the first sentence, and then explain from there, that'd be perfect. No preamble or restating my question.
reasoning: |-
  Okay, the user is describing a pattern where backward induction suggests a cooperative system should collapse immediately, but in reality, people sustain cooperation for multiple steps. They want to know if this has a name and why the theoretical unraveling doesn't occur in practice.

  First, I recall that this is a classic game theory scenario. The Centipede Game comes to mind immediately—it's exactly about players passing a growing pot, with the dilemma of taking it now or passing to potentially get more, but backward induction says the first player should take immediately. That matches the chip-passing game perfectly.

  The user mentions other examples: group projects and summer plans. These also fit the Centipede structure—each stage relies on future cooperation, which backward induction predicts will fail. But real behavior diverges. So the core concept is indeed the Centipede Game paradox.

  Now, why doesn't it unravel? The user isn't just asking for the term; they want explanations for the gap. I should list key reasons: reputation, reciprocity, bounded rationality, risk aversion, fairness norms. These behavioral factors prevent immediate defection. For instance, in the chips game, social norms and trust keep people passing initially.

  The user also hints at wanting the consequences—why the gap is beneficial. I should note that cooperation leads to better outcomes (more chips shared, completed projects, hangouts), which aligns with empirical findings in behavioral economics. People aren't purely rational; they value relationships and fairness.

  Are there related terms? Backward induction itself is the method leading to the collapse prediction. Subgame perfect equilibrium is the theoretical solution where players defect early. But the divergence is due to deviations from perfect rationality, covered in behavioral game theory.

  I should structure the response starting with the key term, then explain the concept, reasons for the gap, and related terms. The user wants the bottom line first—so lead with "Centipede Game." Make sure to address all their examples and the underlying question about why reality differs from theory.
answer: |-
  **Bottom line:** This pattern is classically modeled as the **Centipede Game** in game theory, and the gap between its theoretical prediction (immediate collapse) and real-world behavior is explained by factors like reciprocity, reputation, bounded rationality, and social norms.

  Here's the breakdown:

  1.  **The Name & The Game:**
      *   **Centipede Game:** This is the canonical name for the *structure* you're describing. It's a sequential game theory model where two (or more) players alternately decide to "pass" (cooperate, letting the pot grow) or "take" (defect, ending the game and taking the current pot). Backward induction (reasoning from the last move) predicts the first player should take immediately, ending the game with the smallest possible payoff for everyone. Your chip-passing scenario is a near-perfect real-world analogue.

  2.  **The Theoretical Prediction vs. Reality:**
      *   **The Logic (Backward Induction & Subgame Perfect Equilibrium):** As you deduced, the last player has no incentive to pass. Knowing this, the second-last player should take to avoid getting nothing. This logic cascades backward, predicting immediate defection by the first player (the "unraveling"). This is the game's Nash Equilibrium and Subgame Perfect Equilibrium.
      *   **The Reality:** People *do* pass for several rounds. The game often progresses further than predicted, yielding higher *total* payoffs (though not necessarily for the final player), just like your friends share chips for a while.

  3.  **Why the Gap Exists (Why People Don't Play "Rationally"):**
      *   **Reciprocity & Trust:** Players expect others to reciprocate cooperation, at least for a while. They trust that passing won't be immediately exploited. This builds temporary cooperation.
      *   **Reputation & Future Interactions:** Players care about being seen as cooperative, especially in repeated interactions (like friend groups). Grabbing immediately makes you look selfish and could harm future cooperation ("Nobody will pass to me next time").
      *   **Bounded Rationality:** People aren't perfect logical machines. They don't always perform complex backward induction. They use simpler heuristics like "take turns" or "be fair."
      *   **Altruism & Fairness Norms:** Many people intrinsically value fairness and sharing. They derive utility from the group benefiting, not just their own immediate gain. Taking everything feels wrong.
      *   **Risk Aversion:** Early players might fear taking too little. Passing offers a *chance* at a larger share later, even if it's risky. The guaranteed small gain might feel insufficient.
      *   **Indeterminate Endpoints:** In real life (like your summer plans), the exact "last step" isn't always perfectly known or salient. Uncertainty about the endpoint can foster cooperation.
      *   **Social Sanctions:** Grabbing the whole bag on step one makes you a jerk. People anticipate the social disapproval and avoid it.

  4.  **Related Concepts:**
      *   **Backward Induction:** The *method* of reasoning from the end that leads to the unraveling prediction.
      *   **Subgame Perfect Equilibrium (SPE):** The solution concept that formalizes the outcome of backward induction (immediate defection in the Centipede Game).
      *   **Prisoner's Dilemma (Repeated):** While a different structure (simultaneous vs. sequential), it shares the core tension between individual rationality (defect) and group benefit (cooperate). The Centipede Game unraveling is a sequential manifestation of a similar dilemma.
      *   **Behavioral Game Theory:** The field that studies why real human behavior often deviates from the predictions of "rational" models like the SPE in the Centipede Game, incorporating psychology and experiments to explain things like trust and fairness.

  **In essence:** You've identified the **Centipede Game paradox**. The theoretical prediction of immediate collapse stems from strict, self-interested rationality under perfect information. The persistence of cooperation in practice arises because humans incorporate social preferences, care about the future and reputation, use simpler decision rules, and value fairness, leading to outcomes that are collectively better (more chips shared, hangouts happened) than the "rational" starting-point defection. It's not just "irrationality"; it's rationality enriched by social and psychological factors.
