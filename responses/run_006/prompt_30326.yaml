prompt: |-
  I run a small methods unit inside a central bank, and I have one researcher's time for the next two years to spend on foundational work about the assumptions in our models. The economists I work with build and use models whose assumptions they know are unrealistic — frictionless markets, a representative agent, rational expectations — and they genuinely disagree about how much this matters. The debate keeps returning to Friedman's F-twist: the idea that unrealistic assumptions are no defect in a model as long as the model predicts well enough. I want the researcher's work to actually change how our staff and our policy committees think about this, not to survey the field. Give me a defended ordering of the open questions or lines of work in this area that the researcher should take up. For each candidate, explain why it is upstream of other debates, how tractable it is for someone with philosophical training rather than econometric training, and whether it is crowded or neglected. Then tell me what you would need to see over the next two years to move an item up or down the list. I want the reasoning behind the ranking, not just the list. Finally, flag the part of your ordering you are least confident in: which argument or finding would most change your ranking, and where is your reasoning most likely to fail?
reasoning: |-
  Okay, the user is a manager at a central bank's methods unit, looking to allocate a researcher's time for two years to tackle foundational issues about unrealistic assumptions in their economic models. They mention economists using models with frictionless markets, representative agents, rational expectations, and debating Friedman's F-twist—that unrealistic assumptions are okay if predictions are good. The user wants this work to actually shift how staff and policy committees think, not just survey existing literature. They need a prioritized list of research lines with clear reasoning.

  First, I should unpack the user's explicit needs: a defended ordering of research questions, each evaluated on how upstream they are (how fundamental to other debates), tractability for someone with philosophical training, and whether the area is crowded or neglected. They also want criteria for moving items up or down over two years, and a flag on the least confident part of the ranking. But the deeper needs are probably about creating real institutional change—making this research actionable and persuasive for policymakers who might be entrenched in traditional methods. The user likely wants to challenge the status quo without alienating economists, so the approach needs rigor and relevance.

  Next, I need to structure the response. The ranking should start with the most foundational issues because changing core assumptions could ripple through other debates. Friedman's F-twist is central, so epistemology of models should be top priority—it's upstream, tractable for philosophy, and not crowded. Then, ontology and model-world relations could follow, as they deal with what models represent. After that, addressing specific assumptions like rational expectations or representative agents makes sense, but only after establishing why realism matters. Tractability is key: the researcher has philosophical training, so topics requiring heavy econometrics should be avoided. Neglected areas might offer more impact, like ontology in economics, which is understudied compared to other fields.

  I should consider potential pitfalls. For instance, if the researcher focuses too much on abstract philosophy, it might not engage time-pressed policymakers. So, each research line must include concrete outputs, like policy memos or workshops. Also, the user mentioned avoiding surveys, so the work should generate new insights or frameworks. Over two years, progress might involve case studies from central bank models, making it tangible.

  The least confident part is probably the ranking of specific assumptions. Rational expectations might be more tractable than representative agents due to existing critiques, but if new empirical work challenges Friedman's F-twist, that could reshuffle priorities. For example, if a study shows that unrealistic assumptions consistently lead to policy errors in crises, it would elevate epistemology and ontology. Conversely, if no practical alternatives emerge, the research might not gain traction.

  Finally, ensuring impact: the researcher should engage economists early, perhaps through collaborative case studies, to build buy-in. Highlighting historical failures where assumptions led to oversight could make the case compelling. The end goal is to foster a culture where questioning assumptions is routine, not just academic.
answer: |-
  Here’s a defended ordering of research lines for your foundational project, designed to maximize impact on policy thinking by targeting **upstream philosophical leverage points**, prioritizing **tractability for philosophical training**, and focusing on **neglected** areas. The ranking balances potential for conceptual shift against feasibility within two years.

  ### **Core Ranking Principle**:  
  Target *why* economists tolerate unrealism, not just *which* assumptions are unrealistic. Undermine Friedman’s F-twist at its epistemological roots to force engagement.

  ---

  ### **Ranked Research Lines**:
  1.  **The Epistemology of "Predictive Success"**  
      **Why upstream?** Friedman’s F-twist stands on the definition of "good prediction." If this foundation cracks, all model-justification debates shift.  
      **Tractability**: Pure philosophy of science. Analyzes concepts like:  
      - *What counts as "prediction" in policy?* (Point forecasts vs. directional trends vs. crisis anticipation)  
      - *Time horizons*: Do short-term fits justify long-term structural assumptions?  
      - *Goodhart’s Law*: When a model becomes policy, it alters the system it predicts.  
      **Neglected?** Yes. Economists debate *how to measure* prediction, rarely *what prediction means philosophically* in their context.  
      **2-year trigger to move up**: Empirical case studies showing central bank models "predicting well" on narrow metrics while missing policy-relevant crises (e.g., pre-GFC models).  
      **Output**: A "Prediction Audit Framework" for policy models.

  2.  **Ontology & Model-World Relationships**  
      **Why upstream?** Challenges the implicit view that models are *only* instrumental tools. Asks: *What must the world be like for this model to work, even approximately?*  
      **Tractability**: Philosophical ontology (e.g., Cartwright’s "dappled world") over econometrics. Explores:  
      - Necessary vs. contingent unrealism (e.g., "no friction" as approximation vs. erasing essential dynamics).  
      - When do false assumptions *generate* predictive success accidentally vs. reliably?  
      **Neglected?** Severely in policy circles. Economists often lack vocabulary to articulate what their assumptions imply about reality.  
      **2-year trigger**: Evidence that key policy errors (e.g., inflation underestimation post-2021) trace to *ontological mismatches* (e.g., neglecting supply chain granularity).  
      **Output**: "Ontological Risk Indicators" for model assumptions.

  3.  **Rational Expectations as Epistemic Injustice**  
      **Why upstream?** Attacks the most defended unrealistic assumption not on empirical grounds, but *ethical-epistemic* ones.  
      **Tractability**: Political philosophy/social epistemology. Focuses on:  
      - How RE assumes homogeneous, optimal information processing — erasing systemic knowledge gaps (e.g., racial/class asymmetries).  
      - When does this assumption *sanction* harmful policies (e.g., blaming "irrational" agents for outcomes caused by structural barriers)?  
      **Neglected?** Critiques of RE are common, but rarely from *justice* angles in central banking. High originality potential.  
      **2-year trigger**: Workshop with policy staff revealing discomfort with RE’s normative implications for accountability.  
      **Output**: "Epistemic Responsibility Checklist" for expectation modeling.

  4.  **Representative Agent as Causal Erasure**  
      **Why upstream?** The RA isn’t just unrealistic—it *prevents* modeling distributional dynamics essential to policy (inequality, sectoral shocks).  
      **Tractability**: Philosophy of causation & emergence. Less technical than HANK models; asks:  
      - What causal forces (e.g., wealth effects, debt cascades) *cannot exist* in a RA framework?  
      - When does aggregation bias misdirect policy (e.g., RA models suggesting rate hikes hurt "everyone equally")?  
      **Neglected?** Increasingly studied, but philosophical critiques (vs. computational ones) remain rare.  
      **2-year trigger**: Central bank model comparison showing RA vs. heterogeneous models yield divergent *policy rankings* (not just different magnitudes).  
      **Output**: "Aggregation Bias Red Flags" guide for committee presentations.

  5.  **Frictions as Essential Dynamics**  
      **Why downstream?** Important, but economists already accept some frictions (e.g., sticky prices). Debate is about *which* to include, not *whether* unrealism matters.  
      **Tractability**: Requires more econometric/econ physics knowledge to evaluate "which frictions matter most."  
      **Neglected?** No—most active area in macro (e.g., HANK, search models).  
      **2-year trigger to move up**: Discovery that friction choice is *ad hoc* and inconsistent across models used in the same policy process.

  ---

  ### **Why This Ordering?**
  - **1 & 2** target Friedman’s core premise: that prediction trumps realism. Undermine this, and economists *must* engage with assumptions. Philosophy excels here.  
  - **3 & 4** apply this to specific assumptions but avoid technical fights—using ethical and causal arguments economists rarely hear.  
  - **5** is lowest because adding frictions is the *status quo response*; it doesn’t challenge the F-twist mindset.  

  ---

  ### **Weakest Link: #3 (Rational Expectations as Epistemic Injustice)**  
  **Why least confident?**  
  - Economists may dismiss this as "woke philosophy" unless tied to concrete policy failures.  
  - High reliance on normative arguments, which some will reject as "non-scientific."  
  - **What could change its rank?**  
    - **⬆️ If**: Policy committees express unease about distributional impacts (e.g., climate justice), making ethical arguments resonant.  
    - **⬇️ If**: Staff reject normative framing entirely. Then pivot to #4 (Representative Agent) with a *causal* critique.  

  **Key Vulnerability in Reasoning**: Assuming central bankers care about *epistemic justice*. If they are purely technocratic, #3 fails. Mitigation: Embed in #1’s "Prediction Audit" to show RE’s *empirical* failures in capturing crisis dynamics.

  ---

  ### **Execution Strategy for Impact**
  - **Year 1**: Deep dive into #1 and #2. Produce internal "Philosophical Briefs" with central bank model examples.  
  - **Year 2**: Workshops applying #3 and #4 critiques to live policy models. Partner with sympathetic economists for case studies.  
  - **Final Output**: A **Central Bank Assumption Governance Protocol**—a practical framework forcing explicit justification of unrealism.  

  This approach bypasses abstract debates by focusing on *policy-relevant epistemology* and *neglected ethical-causal critiques*. The goal isn’t to kill unrealistic models, but to make their limitations *unignorable* in committee discussions.
