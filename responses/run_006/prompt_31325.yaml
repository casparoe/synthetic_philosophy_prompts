  Based on your friend's verdicts on the previous cases, I'll outline the candidate moral rules that could explain her judgments, predict what each rule implies for the party lie case, and then provide my best guess for her verdict. Finally, I'll suggest a follow-up case to clarify her position.

  ### Summary of Verdicts:
  1. **Lying to a friend about a bad haircut**: Fine.  
  2. **Lying on a job application about a credential**: Wrong.  
  3. **Breaking a coffee promise for a better invitation**: Wrong.  
  4. **Breaking a wedding promise to drive a stranger to the ER**: Fine.  
  5. **Stealing bread to feed a starving child**: Fine.  
