  ## Keynote Address: The Unbalanced Scale - Kierkegaard, Abraham, and the Limits of Legal Accommodation

  **Esteemed Colleagues, Philosophers, Jurists, Friends,**

  We gather today at a fascinating crossroads: where the intricate jurisprudence of religious accommodation meets the profound, unsettling depths of Søren Kierkegaard’s thought. Our shared text, reluctantly perhaps for some, is Genesis 22 and its most infamous interpreter, Kierkegaard’s pseudonymous author, Johannes de Silentio, in *Fear and Trembling*. The question posed to me is audacious: Does Kierkegaard’s concept of the **teleological suspension of the ethical** – Abraham’s willingness to sacrifice Isaac, suspending the universal ethical prohibition against murder in an absolute relation to God – have *any bearing* on how a liberal legal order should approach religious accommodation?

  My answer is yes. But not in the way many of you might initially expect. To the lawyers and judges: Kierkegaard is not here to simply give your "balancing tests" a deeper shade of gravitas. To the philosophers: this is not merely an academic exercise in textual exegesis. Kierkegaard’s Abraham confronts us with a fundamental challenge to the very *structure* of how the law typically conceives of religious conscience. He exposes a crack in the foundation of our balancing scales.

  **The Lawyer's Predicament: The Tyranny of the Scale**

  Let’s acknowledge the familiar legal landscape. Faced with a religious accommodation claim – whether it’s Sabbath observance, ritual garb, or objections to certain medical procedures – the law often sets up a balancing act. On one side, we place the individual’s sincere religious belief and the "substantial burden" imposed by a neutral, generally applicable law. On the other side, we place the government's interest: the law’s purpose, the cost of accommodation, the impact on third parties, perhaps notions of fairness or public order. We weigh. We calibrate. We ask: How heavy is this burden? How compelling is that interest? Is there a less restrictive alternative?

  It’s a framework born of liberal neutrality and practical necessity. It seeks fairness, predictability, a way to adjudicate conflicting claims within a pluralistic society. **But herein lies the problem Johannes de Silentio would diagnose: this model fundamentally misunderstands the *kind* of claim Abraham represents. It attempts to quantify the unquantifiable, to balance the incommensurate.**

  **Kierkegaard's Shock: The Collapse of the Universal**

  Johannes de Silentio doesn’t present Abraham as a man with an *especially strong* ethical claim that needs extra weight on the scale. He presents him as a man caught in an **impossible paradox**, a **"teleological suspension of the ethical."** Let’s break down this terrifying idea:

  1.  **The Ethical as Universal:** For Kierkegaard (via Silentio), the "ethical" is the sphere of the universal, the rational, the socially intelligible, the realm of duties we owe to each other. Murdering your son is its absolute, unthinkable transgression. Abraham *knows* this. He is not an amoral monster.
  2.  **The Absolute Relation to God:** This is not merely a private preference or a strong conviction. It is an *absolute* obligation arising from a direct, unmediated relation to the Divine. It transcends social norms, rational calculation, and universal ethics. God’s command is singular, personal, and absolute for Abraham.
  3.  **The Suspension:** The command to sacrifice Isaac doesn't *outweigh* the ethical; it **suspends** it. It places Abraham *outside* the universal ethical order, in a terrifying, solitary space. He cannot explain his action ethically ("Isaac must die because God commands it" is nonsense within ethics). He cannot be a "knight of faith" *within* the ethical; he becomes one only by stepping *beyond* it, by virtue of the absurd, trusting God *despite* the ethical contradiction. Johannes repeatedly emphasizes he *cannot understand* Abraham; he can only admire him with "fear and trembling."
  4.  **The Incommensurability:** Crucially, the duty to God and the duty to the ethical are **not two commensurate values on a scale**. They belong to fundamentally different orders of reality. The ethical is horizontal (human-to-human); the absolute duty is vertical (individual-to-God). You cannot place "Thou Shalt Not Murder" on one pan and "God Commands Me To" on the other and expect the scale to function. The scale itself is shattered by the encounter.

  **The Legal Conundrum: When the Scale Breaks**

  So, what does this mean for the lawyer, the judge, sitting across from a claimant seeking accommodation?

  1.  **Beyond "Burden": The Claimant's Framework:** The legal focus on "substantial burden" often probes whether a law *significantly* impedes a religious practice. But Kierkegaard forces us to ask: **Is this claimant operating *within* the universal ethical framework at all regarding this specific obligation?** Or are they, like Abraham, asserting a duty that, *from their perspective*, originates *outside* and *above* that framework? They might not be asking for a *lighter burden*; they might be asserting that *this particular law*, in this instance, *cannot apply* to them because of a higher, incommensurable telos. The question shifts from "How heavy is this burden?" to "What *kind* of claim is this? Is it a claim *within* the ethical realm, or one that purports to *suspend* it?"
  2.  **The Limits of State Comprehension (and the Need for Humility):** Johannes de Silentio is paralyzed by his inability to *understand* Abraham. The state, embodied in a judge or lawyer, faces a similar epistemological limit. **Can the liberal state truly comprehend, let alone "balance," an absolute relation to the Divine?** The balancing test implicitly assumes the state *can* rationally assess both sides. Kierkegaard screams that the core of Abraham’s position – the *why* of his obedience – is fundamentally incomprehensible from the outside. This doesn’t mean granting every claim, but it demands profound humility. It suggests that when confronted with a claim exhibiting this structure (an assertion of a divine command that directly contravenes a core universal ethical norm *and* claims supremacy over it), the law’s usual tools of rational balancing may be inherently blunt, even disrespectful, instruments. The state cannot validate the divine command, but it *can* recognize the claimant's assertion of being bound by an incommensurable duty.
  3.  **Accommodation as Acknowledging the Paradox, Not Balancing It:** If the claim genuinely mirrors the Abrahamic structure (a rare but conceivable occurrence – think extreme pacifism facing conscription, or certain absolute ritual commands conflicting with life-saving interventions), then accommodation cannot be framed as the state *generously allowing an exception* because the religious weight tipped the scale. **It might need to be understood as the state acknowledging the *limit of its own universalizing jurisdiction* in the face of a perceived absolute, incommensurable obligation.** It’s not about weight; it’s about recognizing a different *category* of claim that the balancing framework is ill-equipped to handle. The focus shifts from "Does your conscience outweigh our law?" to "Does your claim posit a duty so absolute, so transcendent of the social ethical order, that it necessitates a space *outside* the law's universal application *for you*?" This is a much higher, stranger, and more dangerous bar – the bar of the teleological suspension itself.
  4.  **The Indispensable Role of the Ethical:** Crucially, Kierkegaard does *not* abolish the ethical. Abraham returns to it; Isaac is spared. The ethical remains the sphere of human community. The suspension is terrifying, exceptional, and paradoxical. Legally, this means **the "suspension" model cannot become the norm.** The universal ethical (embodied in law) is the foundation of social order. Accommodations based on perceiving an Abrahamic suspension must be rare, rigorously examined for sincerity and the *structure* of the claim, and carefully weighed against catastrophic harms (unlike Abraham, the state *cannot* count on an angelic intervention). The law must fiercely protect the universal ethical order *while* acknowledging its potential limits when confronted with the terrifying solitude of absolute faith.

  **Practical Implications for the Next Case:**

  So, lawyers and judges, when you face your next accommodation claim, alongside your standard questions about sincerity and burden, let Kierkegaard prompt these:

  1.  **Framework Analysis:** Is this claimant arguing *within* the ethical universe (e.g., "This law makes my religious practice harder") or asserting a duty that *suspends* it (e.g., "This law *cannot* bind me in this matter because God commands otherwise, even if it means violating a fundamental ethical norm")? What is the *structure* of their claimed obligation?
  2.  **Humility in Assessment:** Can I, or the state, truly "weigh" the absolute nature of this claimed duty? Or am I facing something inherently resistant to my balancing calculus? Does attempting to balance it demean the claimant's experience?
  3.  **The Exception, Not the Rule:** If the claim resonates with the structure of suspension (absolute duty vs. core ethical prohibition), is accommodation feasible *without* annihilating the ethical foundation the law protects? Can a space be created that acknowledges this incommensurability without endorsing it or destroying the social fabric?
  4.  **Beyond Weight, Towards Recognition:** Perhaps the legal response shifts subtly – not just calculating burden, but *recognizing* when a claim places the believer in an Abrahamic position of terrifying solitude before an incommensurable duty. This recognition might demand greater deference, not because the belief is "weightier," but because the state acknowledges the profound, incomprehensible nature of the bind *as experienced by the claimant*.

  **Conclusion: Living with the Tension**

  Kierkegaard’s teleological suspension of the ethical does not give us easy legal formulas. It offers no simple way to tip the scales. Instead, it confronts us with the radical, unsettling nature of absolute religious commitment and its potential collision with the universal norms underpinning our legal order. It exposes the inherent tension – perhaps even the necessary failure – of trying to fully rationalize and balance the incommensurable demands of faith within a framework built for social ethics.

  To the lawyers: Kierkegaard asks you to consider that your balancing scales might sometimes shatter, revealing claims that demand not just weight, but a recognition of their terrifying, paradoxical structure. To the philosophers: he reminds us that this impossible concept isn't just academic; it has concrete, fraught implications for how a society built on law grapples with the solitary individual who hears an absolute call.

  The liberal legal order cannot adopt Abraham’s position – it *is* the universal ethical, seeking justice for all. But it must grapple with the possibility of the Abrahamic claimant. Our task is not to dissolve this tension, but to navigate it with the humility Johannes de Silentio teaches us: with fear, with trembling, and with a profound awareness of the limits of both law and philosophy when faced with the absolute.

  Thank you.
