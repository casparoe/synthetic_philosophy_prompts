  I've been going down a rabbit hole about the continuum hypothesis — the question of whether there's a size of infinity between the whole numbers and the real numbers. I've ended up convinced there's a definate fact of the matter: either there is such a size or there isn't, even though the standard rules of set theory can't prove it either way. (I'm not saying we'll ever know which, just that there's a fact there.) What would have to be true for me to be wrong — for it to be genuinely indeterminate, or for the question to just be meaningless, rather than merely unprovable? I'd like the things that should move me sorted by how decisive they'd be, including stuff that's already happened like the independence results, and which of them a defender of my view would actually concede counts against it rather than dismiss. And give me an honest take on whether my view is set up so that nothing could ever count against it, and if so whether that's a problem. Also, please start your answer with the bottom line in the first sentence, then the reasoning — no preamble and no restating the question.
