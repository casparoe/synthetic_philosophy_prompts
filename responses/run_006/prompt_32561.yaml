prompt: |-
  I just spent two hours arguing with a friend about whether my failure to water her plants while she was away counts as a cause of their dying, and I realized we were going in circles because we never stopped to ask what we were even asking of a theory of causation by omission. So before I go back to that argument, I want the full specification.

  Write the desiderata: what any adequate theory of causation by omission has to deliver. I want the list of requirements — the cases it must get right, the distinctions it must respect or explain (or explain away), the results from metaphysics and moral psychology it can't contradict, the puzzles it must dissolve or at least acknowledge as genuine — with the case or consideration behind each requirement. Flag which requirements are non-negotiable and which are optional or parochial (e.g., requirements that only matter if you're doing moral theory with the results, or only if you're a realist about absences). If any pair of requirements is jointly unsatisfiable, say so — that's the part I most want to see.

  Then, briefly, score the three main families of view against the list: the view that omissions are genuine events (negative facts, absences as entities), the view that omission-talk is just a façon de parler we use when a norm or expectation is violated and doesn't track real causation, and the view that omission causation is ordinary event-causation but with a different relatum (an agent's allowing something to happen, rather than an absence). If one requirement does the most to knock out whole families, call that out.

  I don't need a bibliography. I'll add the references myself.
