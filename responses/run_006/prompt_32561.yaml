answer: |-
  Here’s a structured breakdown of desiderata for a theory of causation by omission, followed by a scoring of the three main families of views. Key conflicts are highlighted.

  ---

  ### **Desiderata for a Theory of Causation by Omission**  
  *(Non-negotiable = ⚠️; Moral/parochial = ⭐; Contextual/optional = ◯)*

  1. **⚠️ Distinguish Cause from Background Conditions**  
     *Requirement*: The theory must explain why *your* failure to water the plants caused their death, but the *absence of rain* or *presence of sunlight* (normal conditions) are mere background factors.  
     *Case*: Your friend expected *you* to water the plants, not the sky to rain.

  2. **⚠️ Handle Preemption**  
     *Requirement*: Explain why your omission causes death even if another person *could* have watered the plants but didn’t.  
     *Case*: Your friend asked only you; your neighbor’s failure is irrelevant.

  3. **⚠️ Respect Causal Asymmetry**  
     *Requirement*: The dying plants don’t cause your omission. Causation must be asymmetric.  
     *Case*: Intuition: Dead plants don’t "make" you fail to water them.

  4. **⚠️ Avoid Absurd Proliferation of Causes**  
     *Requirement*: Exclude irrelevant "omissions" (e.g., the Queen of England’s failure to water them).  
     *Case*: Only your omission (the expected one) is causal, not every possible non-action.

  5. **⭐ Ground Moral Responsibility**  
     *Requirement*: Explain why we blame *you* for the plants’ death.  
     *Case*: Your promise created a normative expectation – moral failure tracks causal responsibility.

  6. **◯ Explain Explanatory Power**  
     *Requirement*: Why do we say "The plants died *because* you didn’t water them" if omissions aren’t events?  
     *Case*: Omission-talk is pervasive in everyday explanations.

  7. **◯ Accommodate Natural Omissions**  
     *Requirement*: Handle cases without agents (e.g., "The drought caused the famine").  
     *Case*: Not all omissions involve human agency.

  8. **⚠️ Avoid Metaphysical Queerness**  
     *Requirement*: Don’t posit "negative events" if they violate ontological parsimony or introduce causally inert entities.  
     *Case*: Are absences real? If so, how do they *do* anything?

  9. **⭐ Sensitivity to Norms/Expectations**  
     *Requirement*: Explain why causation by omission depends on context (e.g., a doctor’s vs. a passerby’s failure to save a life).  
     *Case*: We hold doctors (not strangers) responsible for not aiding.

  10. **⚠️ Joint Unsatisfiability Alert**  
      - **Conflict 1**: Desideratum 5 (moral responsibility) requires treating omissions as *real causes*, but Desideratum 8 (metaphysical queerness) rejects negative entities.  
      - **Conflict 2**: Desideratum 9 (norm-sensitivity) clashes with Desideratum 7 (natural omissions): Norms are agent-relative, but natural omissions lack agents.  

  ---

  ### **Scoring the Three Families of Views**  
  *(✓ = Satisfies; ✗ = Fails; ~ = Partially/With Difficulty)*

  | **Desideratum**               | **Negative Events** (Absences as real) | **Quasi-Causal** (Façon de parler) | **Agent-Centric** (Allowing vs. Causing) |
  |-------------------------------|----------------------------------------|-------------------------------------|------------------------------------------|
  | 1. Cause vs. Background       | ✗ (All absences are equal)             | ✓ (Norms select relevant omissions) | ✓ (Only *your* allowing counts)          |
  | 2. Preemption                | ✗ (All omissions "cause" equally)      | ✓ (Only expected omissions count)   | ✓ (Only your duty matters)               |
  | 3. Asymmetry                 | ✓ (Absences cause, not vice versa)     | ~ (Explanatory asymmetry only)      | ✓                                        |
  | 4. Avoid Proliferation       | ✗ (Unlimited negative facts)           | ✓ (Norms filter omissions)          | ✓ (Only agential allowing)               |
  | 5. Moral Responsibility      | ✓ (Omissions are real causes)          | ✗ (No real causation → no blame?)   | ✓ (Allowing grounds responsibility)     |
  | 6. Explanatory Power         | ✓                                      | ~ (Pragmatic explanation only)      | ✓                                        |
  | 7. Natural Omissions         | ✓ (Drought as negative event)          | ~ (Anthropomorphic projection)      | ✗ (Requires an agent)                    |
  | 8. Avoid Queerness           | ✗ (Commits to negative entities)       | ✓ (No metaphysics of absence)       | ✓ (Allowing is a positive state)         |
  | 9. Norm-Sensitivity          | ✗ (Absences are norm-insensitive)      | ✓ (Norms define "omission")         | ✓ (Duties define "allowing")             |

  ---

  ### **Key Takeaways**  
  - **The Killer Requirement**: **Desideratum 8 (Avoid Metaphysical Queerness)** knocks out *Negative Events* theories for positing causally efficacious "nothings."  
  - **Moral Responsibility Conflict**: *Quasi-Causal* views struggle with **Desideratum 5** – if omissions aren’t *real* causes, moral responsibility lacks a causal foundation.  
  - **Agency vs. Nature**: *Agent-Centric* views fail **Desideratum 7** (natural omissions) by requiring an agent who "allows" an outcome.  
  - **The Core Tension**:  
    - **Realism about omissions** (needed for moral responsibility) conflicts with **ontological parsimony** (rejecting negative entities).  
    - **Norm-sensitivity** (essential for distinguishing relevant omissions) conflicts with **natural omissions** (which lack norms).  

  **Result**: No theory satisfies all desiderata. Your argument looped because **moral responsibility** (you *caused* the death by failing) clashes with **metaphysics** (how can "nothing" cause something?). The solution may require accepting that "cause" in omissions is *sui generis* – a norm-dependent, non-ontological concept.  

  > **Recommendation**: In your debate, separate **causal explanation** (pragmatic/norm-based) from **metaphysical causation** (event-event relations). Your friend likely conflates them.
