  - **Physical stance:** Predicting behavior based on physical laws and properties. Like, for a rock rolling downhill, it's just gravity and physics.

  - **Design stance:** Predicting behavior based on what the thing is designed to do. Like a thermostat is designed to regulate temperature, so we assume it will do that.

  - **Intentional stance:** Predicting behavior by treating the thing as if it has beliefs, desires, and intentions. Like for a chess engine, we think it "wants" to win, so we predict moves based on that.

