  **(As Paul Grice, adjusting my spectacles)**  
  My dear skeptic, you conflate the psychological processing with the logical ground of meaning. The calculability requirement isn't a claim about conscious, step-by-step ratiocination in every utterance. It’s a criterion for *distinguishing* implicatures from semantic entailments or conventions. When you passed the salt, your response depended on recognizing that your friend’s literal question violated the maxim of Relation ("be relevant") unless it implicated a request. This *could* be calculated: (1) He asked about salt’s existence in a context where it’s manifestly present; (2) This flouts Relation; (3) Assuming cooperation, he must want salt *passed*; (4) He observes Quality, so he believes I *can* pass it. That this inference is routinized doesn’t negate its calculable structure—it confirms the rationality underpinning the convention. Shortcuts emerge *because* the inference is stable and recurrent. Without calculability, we couldn’t explain *why* "Can you pass the salt?" isn’t heard as an inquiry into your physical ability in dining contexts. The requirement safeguards against conflating convention with pragmatic inference, even as the latter fossilizes into habit.  

