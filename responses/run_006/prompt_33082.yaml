prompt: |-
  I cover science and ideas for a magazine, and I keep running into the same problem — maybe once a month. A source tells me something big: a lab is sitting on a result that would upend a field, or a whistleblower has documents that look damning but I can't verify every piece of. The evidence is suggestive but not conclusive. I want to run the story because I believe it, but I also know Clifford's line about how it's wrong always and everywhere to believe on insufficient evidence. And then there's James arguing that sometimes you have to commit ahead of the evidence when the decision is forced, live, and momentous.

  I need a practical decision procedure for when to publish a story I believe but can't fully verify. I usually have a few hours to decide, my editor will push back hard if I can't justify it, and the stakes are high — getting it wrong means retractions, lawsuits, or torching a source's career. Give me the procedure as exactly seven numbered steps, each a sentence or two, with no introduction or conclusion. Each step should be a question I ask myself, with guidance on what answer means "stop" or "proceed." Flag which steps are judgment calls dressed up as a checklist. Ground it in the Clifford/James debate but make it usable by someone who hasn't read either of them. The procedure should handle cases like these: a source with documents you can't authenticate, a whistleblower with circumstantial evidence but no smoking gun, a lab sitting on a result they won't let you confirm. Make sure the procedure sometimes tells me not to publish a story I really want to publish — if it never says no, it's not doing its job.
reasoning: |-
  Okay, let me unpack this journalist's dilemma. They're caught between Clifford's strict evidence standard and James' pragmatic exceptions - a classic epistemic tug-of-war in deadline pressure. The key tension: wanting to break important stories versus risking professional fallout from unverified claims.

  Hmm, the user needs a concrete 7-step filter that forces hard stops, not just rubber-stamp approval. Must handle three tricky scenarios: unauthenticated documents, circumstantial evidence, and embargoed research. And crucially - it must sometimes say "no" to stories they're emotionally invested in.

  First, I should anchor the steps in the philosophy debate without name-dropping. Clifford becomes "sufficient evidence" thresholds, James transforms into "forced momentous choice" evaluation. The procedure needs built-in off-ramps at multiple points.

  For the document scenario: authenticity isn't binary. Could assess who would have access, whether metadata aligns, if patterns match known forgeries. For whistleblowers: absence of smoking gun might be okay if there's corroborating testimony or paper trails. Lab results - the critical question becomes harm of withholding versus harm of premature release.

  *scribbles structure* 
  Step 1 must set the "forced choice" criterion - is this truly time-sensitive? Step 2 evaluates evidence quality objectively. Then stakeholder analysis... potential harm assessment... editorial standards check... source reliability... and finally consequence modeling. 

  Ah, the judgment call flags are crucial. Steps 1, 3, 5 and 7 need clear "this isn't algorithmic" warnings. Like step 3's harm assessment - same facts could lead different editors to opposite conclusions. Should emphasize that "proceed" requires passing all gates, with any "stop" being fatal.

  Testing edge cases: 
  - If a source provides internal memos showing safety violations but refuses to be named, does it pass step 5? Probably not without independent verification. 
  - What about a lab head privately confirming unpublished fraud? Step 2 would flag the single-source risk. 

  The final step's "regrettable necessity" test is my favorite - stolen Pentagon Papers would pass, but most leaks won't. And yes, this will sometimes break their heart by killing important but unverifiable stories. That's the Clifford discipline.
answer: |-
  Here is a 7-step procedure for your deadline decisions:

  1.  **Is this truly a "live, forced, momentous" decision where delaying publication would cause significant harm or eliminate the option to act?** (Judgment Call)  
      *Proceed only if:* Waiting for more evidence isn't feasible AND inaction has major negative consequences (e.g., imminent public danger, evidence destruction). *Stop if:* This can wait for verification without critical harm.

  2.  **Ignoring my belief, what's the *objective* quality and quantity of evidence I actually have? (e.g., documents, recordings, multiple corroborating sources, data patterns, expert analysis of available material).**  
      *Proceed only if:* Evidence is strong enough that a reasonable, skeptical peer would find it highly suggestive *without* relying on my "belief" or the source's credibility alone. *Stop if:* Evidence is purely hearsay, easily fabricated, or requires leaps in logic.

  3.  **What is the potential harm if I publish and it's wrong (e.g., ruined reputations, lawsuits, source retaliation, public panic) vs. the potential harm if I *don't* publish and the claim is true (e.g., ongoing fraud, safety risks, suppressed truth)?** (Judgment Call)  
      *Proceed only if:* The verified harm of *inaction* (if true) demonstrably outweighs the *potential* harm of publishing (if wrong). *Stop if:* The risks of publishing an error outweigh the likely harm of waiting.

  4.  **Can I meet my publication's minimum standards for sourcing and verification (e.g., two independent sources, document authentication attempts, legal review, specific fact-checking points) *with what I have right now*, even if not conclusive?**  
      *Proceed only if:* I can honestly answer "yes" to meeting *all* core editorial policies *as they exist*, not bending them for this story. *Stop if:* I have to violate or significantly compromise established standards.

  5.  **How reliable is my key source *based on past proven track record*, motivations, and consistency under questioning? Can I assess the provenance/gaps in the evidence (e.g., why documents might be missing, why a lab won't confirm)?** (Judgment Call)  
      *Proceed only if:* Source has high, proven credibility AND I have a plausible, evidence-based explanation for why verification gaps exist (e.g., whistleblower fear, lab secrecy for IP/compliance). *Stop if:* Source is unproven, has clear bias/axe to grind, or gaps seem suspiciously convenient.

  6.  **Have I exhausted every *feasible* avenue for last-minute verification or seeking critical rebuttal within my deadline? Have I given subjects a meaningful chance to respond?**  
      *Proceed only if:* I've made all reasonable, documentable attempts to verify key claims and get responses, even if unsuccessful. *Stop if:* I skipped obvious checks due to time pressure or avoided contacting key players.

  7.  **Can I write/present this story in a way that accurately reflects the *level* of certainty I have, avoiding overstatement, clearly stating what is verified vs. unverified vs. alleged, and providing necessary context/caveats?** (Judgment Call)  
      *Proceed only if:* I can frame it rigorously (e.g., "Documents suggest...", "Whistleblower alleges...", "Experts say evidence is concerning but inconclusive...") without misleading hype. *Stop if:* The story's inherent newsworthiness hinges on presenting unverified claims as more certain than they are.
