prompt: |-
  I run the science-and-policy unit at a state public health agency. Maybe six or eight times a year we have to make a high-stakes call under real uncertainty — the studies or models point in different directions, and forcing a single "best estimate" probability has burned us before: we come out overconfident, and then one bad winter or one weird trial result makes the guidance look silly. A friend in philosophy mentioned there's a whole formal literature on imprecise probabilities — the idea that instead of one probability for each outcome you carry around a set of probabilities, and you only act when the decision is robust across that whole set. I don't know the technical details and I don't want to learn the formalism; I want the usable version. I've heard the literature has notions like a set of priors, maximality, E-admissibility, and something called dilation — if those help, use them, but only in plain words. You're an expert on decision theory and formal epistemology. Please think carefully, and start by brainstorming what a procedure like this has to get right and where it will break, before you write the final version.

  Then give me a decision procedure my team can actually run in about two days, with our level of statistical training (masters-level epidemiology, no decision-theory background). The director signs off and wants a one-page justification for each step, and won't read anything with Greek letters in it. Ground the procedure in the imprecise-probability / ambiguity literature, but translate it into questions we can ask in order, with what counts as a sufficient answer to each, where the procedure stops with a no, and where it has to hand the decision to a human because it's a values call rather than a technical one. Be honest about which steps are judgment calls dressed up as procedure. Then run the procedure on three decisions of the kind we actually face: (1) whether to issue a fish consumption advisory for a lake where the two best toxicology studies conflict; (2) whether to recommend a new diabetes screening threshold where the models disagree badly about overdiagnosis; and (3) whether to keep schools open during a disease outbreak when the transmission models span a huge range. At least one of those should come out with an answer my team won't like, and I want you to say plainly what the procedure can't do.
reasoning: |-
  Hmm, the user runs a science-and-policy unit at a state public health agency. They need a practical decision procedure for high-stakes calls under deep uncertainty, based on imprecise probabilities. They've heard about concepts like sets of priors, maximality, E-admissibility, and dilation but don't want the technical details - just a usable method their team can implement.

  Key challenges they face:
  - Forcing single probability estimates leads to overconfidence and policy whiplash
  - Existing studies/models often conflict (e.g., toxicology studies, screening models, transmission ranges)
  - Need robustness across uncertainty spectrum
  - Must be executable by epidemiologists with masters-level stats (no decision theory background)
  - Requires one-page justifications with no Greek letters
  - Must flag where judgment calls are needed

  Core requirements for the procedure:
  1) Must formally capture uncertainty without false precision
  2) Needs stopping rules for when evidence is too conflicted
  3) Must separate technical analysis from value judgments
  4) Should identify "robustly good" options when they exist
  5) Must be time-boxed to ~2 days work
  6) Requires clear documentation for director sign-off

  The user specifically wants three concrete applications:
  - Fish advisory (conflicting toxicology)
  - Diabetes screening threshold (model disagreement on overdiagnosis)
  - School closures (wide transmission model range)

  Important to show at least one unpopular outcome to demonstrate integrity of the method. Also need to explicitly state limitations.

  The philosophical foundation should draw from:
  - Sets of priors (Walley-Sen): Representing plausible probability ranges
  - Maximality (Levi): An option is admissible if it's best under some plausible probability
  - E-admissibility: Survives expected utility comparison across all plausible models
  - Dilation (Seidenfeld): When new evidence widens uncertainty - will explicitly build in handling

  Procedure structure should mirror robust decision making:
  1) Frame the decision space (options/outcomes)
  2) Gather evidence and quantify uncertainty ranges
  3) Identify robustly good options
  4) Check for dominance
  5) Flag value judgments
  6) Document rationale

  For the fish advisory example, the procedure should likely recommend against issuing advisory due to insufficient robust evidence - an outcome the team might dislike but that demonstrates the method's conservatism regarding evidence conflicts.

  Key limitations to emphasize:
  - Doesn't eliminate judgment calls (just makes them explicit)
  - Can't resolve fundamental evidence conflicts
  - Still requires value inputs for outcomes
  - May increase perceived indecisiveness
  - Resource intensive for quick-turn decisions
answer: |-
  Below is a practical **Imprecise Probability Decision Procedure (IPDP)** tailored for your team. It avoids technical jargon, runs in ~2 days, and separates technical analysis from value judgments. I'll first outline the core principles, then the step-by-step procedure, and finally apply it to your three cases—including one "unpopular" outcome.  

  ---

  ### **Core Principles & What This Gets Right (and Where It Breaks)**  
  **What it solves**:  
  - **Overconfidence**: Uses *sets of probabilities* (not single estimates) to reflect conflicting evidence.  
  - **Robustness**: Only acts if a decision is viable across *all plausible scenarios* (grounded in *E-admissibility*).  
  - **Values vs. Facts**: Flags where science ends and ethical/policy judgments begin.  
  - **Dilation Handling**: If new evidence *widens* uncertainty (e.g., a bad winter makes models disagree more), the procedure stops—no forced guesswork.  

  **Where it breaks**:  
  - **No magic**: Conflicts in evidence or values *can’t be resolved*—it forces transparency about uncertainty.  
  - **Resource cost**: Takes 2 days; not for emergencies.  
  - **"Judgment in disguise"**: Some steps quantify expert judgment (we’ll flag these).  

  ---

  ### **The IPDP: 6 Steps with Questions & Exit Rules**  
  **Time**: 1 day for Steps 1–4; 1 day for Steps 5–6.  
  **Output**: A 1-page memo per step for your director.  

  | Step | Question to Answer | Sufficient Answer | If "No," Procedure... | Judgment Calls? |
  |------|---------------------|-------------------|------------------------|-----------------|
  | **1. Frame Options** | "What are the *concrete actions* we’re deciding between?" | ≤3 policy options (e.g., "Issue advisory," "Delay decision"). | Stops if options are unclear. | None. Pure policy framing. |
  | **2. Define Critical Outcomes** | "What *harms/benefits* (e.g., health, equity, trust) could each option cause?" | List of 3–5 outcomes per option (e.g., "Cancer cases averted," "Loss of fishing livelihoods"). | Stops if outcomes are ethically incomparable (e.g., economic vs. life loss). | None. Stakeholder input required. |
  | **3. Elicit Uncertainty Ranges** | "For each outcome, what’s the *plausible range* of impacts (e.g., ‘50–500 cancer cases’)? What evidence supports the extremes?" | Numeric ranges (or qualitative: "Low/Med/High") + 2–3 key studies/models justifying min/max. | Stops if ranges are speculative (no studies) or infinite. | **Yes**. Experts quantify their doubt using evidence (this builds the *set of priors*). |
  | **4. Test Robustness (E-admissibility)** | "Is there an option that isn’t *worst* in any plausible scenario?" | An option that isn’t dominated under *any* evidence-justified range from Step 3. | Stops if no robust option exists → Go to Step 5. | None. Pure math: compare outcome ranges. |
  | **5. Check Dominance** | "Does one option *always* beat others on ≥1 outcome, and isn’t worse on any?" (Maximality) | One option is better in at least one scenario and never worse in others. | If no dominance, stop and hand to humans. | **Yes**. Experts weigh outcomes (e.g., "Is preventing 10 cancers worth job losses?"). |
  | **6. Final Safety Check** | "Could acting make outcomes *worse than doing nothing*?" | Evidence that action could amplify harm (e.g., advisory causes panic). | If yes, recommend "no action" or delay. | Limited. Focuses on avoiding irreversible harm. |

  ---

  ### **Applied to Your Cases**  
  **Case 1: Fish Consumption Advisory (Conflicting Toxicology)**  
  - *Step 1*: Options: (A) Issue advisory, (B) Delay for more data, (C) Run new study.  
  - *Step 2*: Outcomes: Cancer risk (Study 1: 10–100 cases; Study 2: 0–5 cases), Livelihood loss ($1M–$5M), Public trust erosion (Low/High).  
  - *Step 3*: Ranges justified by both studies. No dilation (evidence isn’t widening).  
  - *Step 4*: **No robust option**. A isn’t worst if cancer risk is high, but B isn’t worst if risk is low.  
  - *Step 5*: No dominance—A prevents cancer but risks trust; B avoids livelihoods harm but risks health.  
  - *Step 6*: No evidence action worsens outcomes.  
  - **Outcome**: **Hand to humans**. Science can’t resolve conflict. Values call: prioritize health vs. economics.  
  - *Why team won’t like it*: Forces admission that evidence is inconclusive—no "safe" technical fix.  

  **Case 2: Diabetes Screening Threshold (Models Disagree on Overdiagnosis)**  
  - *Step 1*: Options: (A) Lower threshold, (B) Keep threshold, (C) Targeted screening.  
  - *Step 2*: Outcomes: True diagnoses (Model 1: 1,000–2,000; Model 2: 200–1,000), Overdiagnoses (Model 1: 100–500; Model 2: 500–2,000), Costs ($5M–$10M).  
  - *Step 3*: Ranges from both models. Dilation risk: New data could widen overdiagnosis uncertainty.  
  - *Step 4*: **Option C (targeted) is robust**. Not worst in any scenario (avoids high overdiagnosis/costs).  
  - *Step 5*: C dominates B on true diagnoses; not worse on costs.  
  - *Step 6*: No evidence of harm beyond ranges.  
  - **Outcome**: **Recommend C**. Robust to model conflict.  

  **Case 3: School Closure During Outbreak (Transmission Models Vary Widely)**  
  - *Step 1*: Options: (A) Close schools, (B) Stay open, (C) Hybrid.  
  - *Step 2*: Outcomes: Cases averted (Model Low: 100–500; Model High: 10K–50K), Learning loss (2–12 months), Parental income loss ($50M–$200M).  
  - *Step 3*: Ranges from all models. **Dilation present**: Winter surge could expand case ranges further.  
  - *Step 4*: **No robust option**. A isn’t worst if cases surge, but B isn’t worst if models overestimate.  
  - *Step 5*: **Option A (close) dominates** on cases averted if the high-end model is plausible (could save 10K+ lives). *But*: Requires judgment that cases averted > learning/income loss (values call).  
  - *Step 6*: Closing schools could worsen mental health (evidence: CDC reports).  
  - **Outcome**: **Hand to humans**. High-stakes values call—science says "extreme cases possible," not how to trade off lives vs. learning.  

  ---

  ### **What This Can’t Do**  
  1. **Resolve fundamental evidence conflicts** (e.g., toxicology studies). It exposes them.  
  2. **Replace values**. If outcomes are incommensurable (health vs. economics), humans must decide.  
  3. **Prevent criticism**. Stakeholders may still demand certainty.  
  4. **Speed up science**. With dilation (e.g., outbreak uncertainty growing), delaying action may be the only robust choice.  

  **Final Justification for Director**:  
  > *"This procedure prevents overconfidence by using evidence-backed uncertainty ranges. It only recommends actions that hold up across all plausible scenarios—protecting us from reversals when new data arrives. When science conflicts or outcomes involve value trade-offs, it flags the need for leadership judgment. No Greek letters, no false precision."*  

  Let me know if you need tweaks for your team’s workflow.
