prompt: |-
  I'm on my university's IRB and we're stuck on a weird one. A cognitive psychology lab wants to run a study testing whether people can reliably distinguish genuine from faked emotional expressions in short video clips. Here's the thing: they're screening participants by having them do exactly that task — watch a batch of clips, judge genuine vs. fake — and they'll only enroll participants who score in the top quartile. The researchers call this standard screening to reduce noise and say the main task uses different stimuli so there's no contamination.

  But one of our reviewers filed a sharp dissent arguing the design is epistemically circular in a way that tracks the bootstrapping problem: if the screening task actually measures what it claims to (ability to detect genuine emotion), then the study's main question is already settled in the affirmative — you've just identified a group of people who can do it. And if the screening doesn't measure that ability, then the whole selection procedure is invalid and the results are uninterpretable either way. The reviewer says you can't use a putative measure of X to select subjects and then use those subjects to test whether the measure tracks X — that's bootstrapping, and the different stimuli don't escape the circle because the ability is supposed to be the same ability.

  Half the board thinks this is a genuinely deep objection and we should reject or require a major redesign. The other half thinks it's crankish — "by that logic you could never use any pre-test to screen participants for anything" — and wants to approve as-is. I need to draft the decision memo for the full board: approve, reject, or approve with conditions. It needs to take the circularity objection seriously (not just dismiss it) and give reasons the researchers could actually respond to. Keep it under 500 words.
reasoning: |-
  Okay, the user is part of a university IRB dealing with a tricky ethics review. A cognitive psychology lab wants to screen participants by having them judge genuine vs. fake emotional expressions in video clips, enrolling only the top performers for the main study. The researchers claim this reduces noise, using different stimuli to avoid contamination. But one reviewer objects that this creates epistemic circularity—like bootstrapping—because if the screening measures the ability, then the main study's question is already answered affirmatively by selecting those who can do it. If it doesn't measure the ability, the selection is invalid, making results uninterpretable. The IRB is split, half seeing this as a deep flaw, half dismissing it as overly restrictive.

  First, I need to unpack the philosophical objection. The reviewer's point hinges on circular validation: using a test of ability X to select subjects, then using those subjects to validate that the test measures X. Even with different stimuli, the underlying ability is assumed to be the same, so the circle isn't broken. The researchers might counter that screening targets high-performers to reduce variability, not to validate the test itself. But the objection suggests that any conclusion about the ability's existence or correlates in the selected group presupposes the screening's validity, which is precisely what's being tested indirectly.

  Looking at common practices: Pre-screening is standard in many fields (e.g., selecting high-IQ individuals for cognition studies). The key difference is when the screening measure is identical in nature to the dependent variable. Here, both tasks involve judging emotional authenticity, making the circularity more salient. The researchers' defense about different stimuli might not suffice because the construct (emotion detection ability) is identical. 

  Possible solutions? The IRB could approve with conditions requiring the researchers to address the circularity. For example: 
  1. Framing the study as conditional: "Among those who pass screening, how does ability correlate with other factors?" This avoids claiming to prove the ability's existence. 
  2. Adding a separate control group from the general population to compare against the screened group, showing the ability isn't universal. 
  3. Explicitly stating in the paper that the screening's validity is assumed, not tested by the study. 

  The user's memo needs to balance rigor with practicality. Outright rejection might stifle research, but ignoring the objection risks flawed science. The response should validate the reviewer's concern while offering a path forward that mitigates the circularity without redesigning the whole study. Emphasizing transparent framing and limitations in reporting could satisfy both sides. Also, reminding the researchers to pre-register their analysis to avoid HARKing would strengthen their approach. 

  The user's deeper need is likely to uphold IRB integrity without being overly obstructive. They want clear, actionable guidance that respects philosophical concerns but doesn't paralyze research. The memo should thus steer toward conditional approval with specific, justifiable requirements that force the researchers to confront the circularity head-on in their methodology and discussion.
answer: |-
  ## IRB Decision Memo: Protocol # [Insert Number] - Emotional Expression Detection Study

  **Decision:** Approve with Conditions  

  **Rationale:** The IRB acknowledges the reviewer's substantive methodological concern regarding potential epistemic circularity in the screening procedure. The objection highlights a genuine philosophical tension: if the screening task is assumed to *validly measure* the core ability under investigation (detecting genuine emotion), then selecting only high performers potentially pre-supposes the study's affirmative conclusion (that such ability exists and is measurable). Conversely, if the screening task does *not* validly measure this ability, its use for selection renders subsequent results uninterpretable regarding that ability. This is a sophisticated point demanding serious consideration, not dismissal.

  However, the IRB majority finds this does not warrant rejection or major redesign *if* the researchers explicitly frame their research question and conclusions to account for this limitation. The core issue is the *scope of inference*. The screening task establishes a defined performance group based on *that specific task*. The study can validly investigate characteristics *within* this pre-selected group (e.g., neural correlates, response times, performance on *novel* stimuli, or correlations with other measures) **conditional upon** their screening performance.

  **Conditions for Approval:**

  1.  **Revised Framing in Protocol & Consent:** The research question and hypotheses must be explicitly reframed. Instead of asking broadly "Can people distinguish genuine vs. faked emotions?", the question must focus on the *performance of the screened cohort*. Examples:
      *   "Among individuals demonstrating high performance on an initial screening task for detecting genuine vs. faked emotions, how does performance correlate with [e.g., cognitive style, neural activity] when presented with novel stimuli?"
      *   "What are the characteristics differentiating individuals who perform highly on both an initial screening task and a novel emotional expression detection task?"
      *   Explicitly state: "The screening task is used to define a participant group based on specific performance criteria; it is not the primary validation test for the existence of the underlying ability."

  2.  **Limitations Section:** The researchers must include a detailed discussion in their analysis plan and eventual manuscript explicitly acknowledging the circularity concern raised by the reviewer. They must clearly state:
      *   The study investigates individuals *identified* by the screening task as high performers.
      *   Findings about this group's performance on the main task and its correlates **cannot be directly generalized to prove the existence or validity of the underlying ability in the broader population** without independent validation of the screening task itself.
      *   The different stimuli mitigate practice effects but do not resolve the fundamental assumption of a stable underlying ability measured by both tasks.

  3.  **Clarification in Analysis:** Analyses must treat the screening performance as a selection criterion defining the cohort, not as an independent validation of the ability being studied *de novo* in the main task. Comparisons should focus on relationships *within* the selected group or potentially against external benchmarks if available (though not required).

  **Response to Reviewer & Researcher Rebuttal:**  
  The reviewer's point is not "crankish" but highlights a significant epistemological boundary condition. While pre-screening is common (e.g., selecting high-WMC individuals for complex tasks), the *circularity risk is heightened when the screening measure is substantively identical to the dependent variable construct, as it is here (both measure "detection of genuine emotion")*. The different stimuli prevent direct stimulus memorization but do not escape the assumption of a stable, domain-general ability. The conditions above ensure the study design aligns logically with the permissible scope of conclusions, mitigating the bootstrapping problem by constraining inference to the *defined high-performing cohort*, not the ability's fundamental existence or the screening's validity in the abstract. The researchers must transparently reflect this constraint.

  **Approved** contingent on the Principal Investigator submitting revised documentation (protocol, consent form, analysis plan) addressing Conditions 1-3 within 30 days. Failure to adequately address these conditions will result in the protocol being returned for major revisions or reconsideration for rejection.

