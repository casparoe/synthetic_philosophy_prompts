prompt: |-
  So I run this philosophy club at my high school and we somehow convinced a professor to come on our little podcast. He's a halfer about Sleeping Beauty — like he thinks when Beauty wakes up she should still say the probablity of heads is 1/2, not 1/3. We already did a whole episode explaining the setup and the basic arguments, so I dont want him to just redo the no-new-information thing or the thirder's betting argument. Can you write me eight to ten interview questions that actually push on the halfer position? I want at least one question on each of these: the betting-odds objection and how he gets out of it without making credence and fair betting odds come apart in a way that feels ad hoc; the thing where Beauty is told it's Monday — I think the halfer has to go up to 2/3 for heads there while the thirder says 1/2, which feels backwards, and I want to know if he's ok with that; what happens to his answer if the coin is biased or if the experiment gets run a bunch of times in a row; and whether whatever rule he's using for self-locating evidence generalizes to other cases like the doomsday argument or a duplication machine. For each question give me a follow-up that's aimed at the answer he's most likely to give, and try to make the whole sequence get progressively harder so that by the end he has to say what evidence would actually make him switch to the thirder position or give up the halfer view.
