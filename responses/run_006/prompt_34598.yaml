  Okay, the user is asking about the Frege-Geach problem and why it's a challenge for expressivism in metaethics. Let me start by recalling what expressivism is. Expressivists say that moral sentences express attitudes, not beliefs about facts. So "Lying is wrong" is like saying "Boo to lying!"—it's an expression of disapproval. But the problem comes when these sentences are part of bigger sentences, like conditionals or negations. 

  The user wants to know why expressivists can't just handle complex sentences by combining the attitudes of their parts, the way cognitivists combine truth conditions. So I need to explain why attitudes don't compose like truth conditions do. Truth conditions are straightforward: "P and Q" is true if both parts are true. But attitudes? If "P" expresses disapproval, and "Q" expresses disapproval, what does "P and Q" express? Disapproval of both? But that doesn't capture the logical connection. 

  The key here is inconsistency. In logic, "P" and "not P" can't both be true. But for expressivists, if "P" is "boo lying," what's "not P"? Saying "not boo lying" isn't the same as endorsing lying. Maybe it's withholding disapproval, but that's not equivalent to asserting the negation. This creates a problem because moral arguments rely on logical validity. For example, the modus ponens argument: If lying is wrong, then getting your brother to lie is wrong. Lying is wrong. Therefore, getting your brother to lie is wrong. Cognitivists see this as truth-preserving. Expressivists need to explain why accepting the premises commits you to the conclusion, not just in belief but in attitude.

  The user also asks about expressivist solutions. Blackburn's quasi-realism uses higher-order attitudes. For "If lying is wrong...", it's expressing disapproval of disapproving lying but not disapproving getting others to lie. Gibbard uses plan-laden attitudes. Both try to show how moral language can have logical structure without beliefs. 

  I should check if the user is a philosophy student needing this for a class. Maybe they're writing a paper and need a clear explanation. They might be confused about why compositionality is an issue for attitudes but not truth conditions. Emphasizing the difference in how inconsistency works between truth and attitudes is crucial. Also, clarifying the solutions without too much jargon. Making sure to connect why the embedding problem threatens the logic of moral discourse for expressivists but not cognitivists.
answer: |-
  The Frege-Geach problem exposes a fundamental challenge for expressivism regarding the **compositionality** of language—how the meaning of complex sentences depends on the meaning of their parts. Here's why embeddings pose a unique difficulty for expressivism but not cognitivism, and how expressivists respond:

  ### **1. The Core Problem: Compositionality of Attitudes vs. Truth-Conditions**
     - **Cognitivism (No Problem)**:  
       Cognitivists treat moral sentences as fact-stating (e.g., "Lying is wrong" expresses the belief *that lying has the property of wrongness*). Logical operators (e.g., "if...then," "not") combine truth-conditions compositionally:  
       - "If P, then Q" is true iff whenever P is true, Q is true.  
       - "Not P" is true iff P is false.  
       → This preserves logical validity (e.g., modus ponens: "If P then Q; P; therefore Q" is truth-preserving).

     - **Expressivism (The Problem)**:  
       Expressivists say "Lying is wrong" expresses a **non-cognitive attitude** (e.g., disapproval of lying). But when embedded:  
       - What attitude does "If lying is wrong, then getting your brother to lie is wrong" express?  
       - What attitude does "It is not the case that lying is wrong" express?  
       → **Attitudes don't combine like truth-conditions**. Disapproval of lying (for "P") + disapproval of getting others to lie (for "Q") does *not* yield a single "conditional attitude" for "If P then Q". Worse, "not P" cannot be "non-disapproval," as that might merely express *indifference*, not *rejection* of the moral claim.

  ### **2. Why the "Straightforward Compositional Move" Fails**
     - **Truth-Conditions are Logically Structured**:  
       Truth-values (true/false) form a **binary system** with defined logical operations (conjunction, negation, implication). This structure enables formal logic.
     
     - **Attitudes Lack Logical Structure**:  
       Attitudes (disapproval, approval, etc.) are:  
       - **Non-binary**: There’s no "attitude false" equivalent to truth-value falsehood.  
       - **Non-compositional**: Combining two disapproval attitudes doesn’t yield a new, logically complex attitude (e.g., "If P then Q" isn’t "disapproval of P-and-not-Q").  
       - **Inconsistency Undefined**: Cognitivism explains why "P" and "¬P" conflict (they can’t both be true). Expressivism must explain why accepting both is irrational *without* truth-conditions.  

     **→ Result**: Expressivism struggles to explain:  
     - Why "Lying is wrong" and "Lying is not wrong" are *inconsistent*.  
     - Why modus ponens with moral premises is *logically compelling* (e.g., "If lying is wrong, then getting your brother to lie is wrong; lying is wrong; therefore, getting your brother to lie is wrong").  

  ### **3. Expressivist Solutions: Higher-Order Attitudes and Logic**
  Expressivists address this by **redefining the content** of complex moral sentences:

  #### **A. Blackburn's Quasi-Realism (Higher-Order Attitudes)**  
     - Complex sentences express **attitudes about attitudes**.  
       - *Example*: "If lying is wrong, then getting your brother to lie is wrong" expresses:  
         **Disapproval of "disapproving lying but *not* disapproving getting others to lie"**.  
       - *Negation*: "Lying is not wrong" expresses **disapproval of disapproving lying** (rejecting the attitude toward lying).  
     → **Logic is preserved**: Inconsistency arises when one simultaneously holds conflicting higher-order attitudes (e.g., disapproving disapproval of lying *while* disapproving lying).

  #### **B. Gibbard's Norm-Expressivism (Planning Attitudes)**  
     - Moral judgments express **acceptance of norms** (e.g., "Lying is wrong" = endorsing a norm against lying).  
       - *Embeddings*: "If lying is wrong, then..." expresses **constraints on planning**.  
         E.g., "If lying is wrong, then getting your brother to lie is wrong" rules out plans where you forbid lying but permit getting others to lie.  
     → **Logical consequence**: Validity is defined via **consistency in planning**. An argument is valid if accepting its premises *requires* accepting the conclusion to avoid incoherent planning.

  #### **C. Minimalism/Logical Expressivism**  
     - Some (e.g., Schroeder) develop **expressivist-friendly logical systems** where moral sentences have "belief-like" contents without invoking truth-conditions.  
       - Moral "propositions" are *shadows* of attitudes, allowing standard logic to apply compositionally.  
       - *Challenge*: Avoid collapsing into covert cognitivism.

  ### **Key Insight**
  The Frege-Geach problem forces expressivists to explain **how moral language can *mimic* logical discourse** without relying on truth-conditional meaning. Successful solutions (like Blackburn's or Gibbard's) show moral reasoning isn't just *expressive*—it can be **systematically constrained by logic** through higher-order attitudes or planning structures. This preserves expressivism’s core (anti-realism about moral facts) while accounting for moral argumentation’s force.
