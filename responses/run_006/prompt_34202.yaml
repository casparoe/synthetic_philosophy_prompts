prompt: |-
  A columnist I read recently summarised the idea of constitutional precommitment like this:

  "Constitutions are Ulysses contracts writ large. When a democracy adopts a constitution, it anticipates that future majorities will be tempted, in moments of panic or short-term passion, to abandon their own deeper commitments, and so, like Ulysses binding himself to the mast, the people tie their hands in advance. Because the people chose these constraints freely, constitutional limits are no real restriction on democracy — any more than Ulysses' ropes were a restriction on his freedom — and they are in fact what makes democratic self-government possible rather than a contradiction of it. The same logic explains why judicial review is unproblematic: when judges strike down a statute, they are simply holding the people to their own earlier decision, against a momentary majority that has lost its head."

  I suspect the passage is mostly right but too smooth, especially the jump to judicial review, though I cannot put my finger on exactly where it goes wrong. Please go through it sentence by sentence and tell me: which parts a careful theorist of constitutional precommitment would accept; which parts run together two different things (for example, an individual binding herself and a majority binding future citizens); where the summary overstates a modest thesis or treats a contested inference as settled; and whether the claim about judicial review actually follows from anything accurate in the rest of the passage. In particular, say something about whether the analogy illicitly treats "the people" as a single agent persisting across generations, and whether a defender of constitutional precommitment could accept the first half of the passage while rejecting the last sentence. Please write your answer in British English.
