  The judicial review bit is especially slippery. The columnist claims judges merely enforce "the people's earlier decision" against "momentary majorities." But that ignores how constitutions evolve through interpretation. When judges strike down laws, are they really just mechanically applying past intent? Hardly - they're making substantive choices, often influenced by contemporary values. Calling this "unproblematic" sweeps huge debates under the rug. 

  I should also note the asymmetry between individual and collective binding. Ulysses chose his ropes; but citizens today didn't choose every constitutional constraint (like the US Electoral College). And unlike Ulysses, future majorities can't easily untie the ropes - amendment is deliberately hard. That makes the "no real restriction" claim dubious. 

  The user might appreciate knowing that even precommitment theorists like Holmes accept some limits to the analogy. A careful defender could endorse precommitment's value while rejecting judicial supremacy - perhaps favoring legislative review instead. The passage's flaw is presenting contested ideas as settled logic. 

