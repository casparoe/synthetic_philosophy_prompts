prompt: |-
  I am a commissioning editor at a mid-sized publisher of serious popular science. Several times a month I have to decide, on the strength of a proposal and two or three sample chapters, whether a manuscript's central explanatory claim is one our list can stand behind or one that will embarrass us with working scientists. I have no formal philosophy training and about an hour per manuscript; I can escalate at most one manuscript in ten to an outside expert, and my assessment feeds an acquisitions meeting that makes the final call. I need a procedure I can run myself, and I need it to be reusable across manuscripts rather than a one-off judgement of the cases below.

  Please write me that procedure, grounded in Daniel Dennett's distinction between cranes and skyhooks and his notion of greedy reductionism. The procedure should sort a manuscript's central explanatory claim into four categories: legitimate crane, skyhook, greedy reductionism, and crane-under-construction (a promissory note). For our purposes: a crane is a bottom-up mechanism that does real explanatory work and is itself built from simpler, unmysterious processes; a skyhook is an explanatory posit that imports the very complexity, intelligence, or design it is supposed to explain; greedy reductionism is reduction that skips levels and explains away higher-level regularities instead of accounting for them.

  The procedure should specify: the questions to ask in order; what counts as a sufficient answer to each; where the procedure stops with 'decline' or 'escalate'; and where it hands the decision to a person because the question is one of judgement or values rather than fact. It should specifically help me distinguish a skyhook from a crane that simply has not been cashed out yet, and greedy reductionism from legitimate reduction that still respects higher-level patterns. Mark the steps at which I will be making a judgement call dressed up as procedure.

  Then run the procedure on these three cases:

  1. A bestselling physicist's manuscript arguing that information is a fundamental feature of the universe that organises matter, and that this single principle explains life, mind, and society. I am under commercial pressure to sign it.
  2. A manuscript explaining all of human culture — art, religion, law, kinship — as the direct expression of inclusive-fitness maximisation, with no account of the intermediate social, cognitive, and historical mechanisms.
  3. A manuscript I personally dislike: a step-by-step evolutionary account of moral emotions and punishment, built from iterated interactions, reputation, and costly signalling, which the author uses to argue that much of everyday morality is a solution to a cooperation problem rather than a reflection of moral truth.

  Finally, say what the procedure cannot do — for example, what it can and cannot tell me about whether a manuscript is true, or about whether it should be published for reasons other than the structure of its explanations.

  Lead with your bottom line in the first sentence, then give the reasoning and the procedure. No preamble and no restating of the question. Write in British English.
reasoning: |-
  Hmm, the user is a commissioning editor at a serious popular science publisher who needs a systematic procedure to evaluate manuscripts based on Dennett's concepts of cranes, skyhooks, and greedy reductionism. They face time constraints—only about an hour per manuscript—and can escalate only one in ten to experts. Their primary goal is to avoid publishing claims that would embarrass them with working scientists.

  The key challenge here is operationalising Dennett's philosophical concepts into concrete questions. I need to design a procedure that:
  - Clearly distinguishes between legitimate cranes (step-by-step mechanisms), skyhooks (explanatory cheats), greedy reductionism (oversimplified leaps), and cranes-under-construction (promissory notes).
  - Handles edge cases where judgement calls are needed, especially around whether an uncashed crane is plausible or just a disguised skyhook.
  - Accounts for the editor's limited time by making early exit points for clear skyhooks or greedy reductions.

  For the procedure structure, I'll build it as a flowchart with four key stages:
  1. **Identify the central claim**: Pinpoint what exactly is being explained and how.
  2. **Skyhook check**: Hunt for unexplained complexity imports—this is the first decline point.
  3. **Crane decomposition test**: Assess whether the explanation builds from simpler parts.
  4. **Greediness evaluation**: Look for level-skipping that erases higher-level patterns.

  Important nuances to bake in:
  - Judgement calls should be explicitly flagged (e.g., "is this posit *plausibly* reducible?").
  - The "crane-under-construction" category must require concrete evidence of ongoing reductionist work.
  - Commercial pressure shouldn't influence the technical assessment—that's a separate acquisitions decision.

  Now for the test cases:
  1. The "information is fundamental" manuscript smells like a skyhook—it uses information as a magical explainer without showing *how* it builds from physics. Decline.
  2. The inclusive-fitness manuscript is classic greedy reductionism—jumping straight from genes to culture without mechanisms. Decline.
  3. The moral emotions manuscript looks like a legitimate crane—it incrementally builds cooperation from individual interactions. Accept (pending expert checks for accuracy).

  Crucial limitations to highlight:
  - This procedure only assesses explanatory structure, not truth value.
  - It doesn't evaluate writing quality, market appeal, or ethical implications.
  - A "crane" classification doesn't guarantee correctness—it just means the argument isn't philosophically unserious.

  The editor's unspoken needs seem to include:
  - Protecting professional reputation with scientists.
  - Resisting commercial pressure with objective criteria.
  - Avoiding the fatigue of case-by-case evaluations.

  I'll write this in crisp British English as requested, leading with the bottom-line conclusion.
answer: |-
  Your procedure applies Dennett’s framework to categorise explanatory claims, prioritising early exits for clear skyhooks or greedy reductionism while flagging judgement calls. It has four stages: claim parsing, skyhook detection, crane decomposition, and greediness assessment. Use it sequentially, allocating ~15 minutes per stage.

  **Procedure: Explanatory Claim Evaluation**  
  *Stage 1: Parse the Central Claim (5 mins)*  
  - **Q1:** "What phenomenon X does the manuscript claim to explain, and what entity/process Y is posited as the primary explanation?"  
    *Sufficient answer:* Clear, concise statement of X (e.g., "human morality") and Y (e.g., "evolution of cooperation via signalling").  
  - **Q2:** "Does Y invoke any unexplained intelligence, agency, or inherently complex force (e.g., cosmic consciousness, divine intent, or self-organising principles without mechanistic basis)?"  
    *Sufficient answer:* Yes/no with evidence from text.  
    **Exit:** If **yes**, categorise as **skyhook** and **decline**.  
    *Judgement call:* Whether a term (e.g., "information") implies hidden agency/complexity.  

  *Stage 2: Test for Skyhook Disguised as Crane (10 mins)*  
  - **Q3:** "Does the author treat Y as already fully explained by lower-level processes (e.g., physics, chemistry), or is Y an irreducible primitive?"  
    *Sufficient answer:* Description of Y’s proposed components (e.g., "neuronal computations") or admission of irreducibility.  
  - **Q4:** "If Y isn’t fully reduced, does the author provide evidence that lower-level explanations are actively being developed (e.g., citations to empirical work on proposed mechanisms), or is reduction merely promised?"  
    *Sufficient answer:* List of cited research or vague promissory language (e.g., "future discoveries will show how...").  
    **Exit:** If Y is irreducible *and* lacks evidence of in-progress reduction, categorise as **skyhook** and **decline**. If reduction is promised with credible evidence of progress, categorise as **crane-under-construction**; **escalate** for expert verification.  
    *Judgement call:* Credibility of "in-progress" evidence (e.g., citing robust labs vs. fringe theorists).  

  *Stage 3: Assess Crane Decomposition (15 mins)*  
  - **Q5:** "Does the manuscript describe how Y constructs X through intermediate, functionally characterised steps (e.g., cells forming organs, then minds), or does it jump directly from Y to X?"  
    *Sufficient answer:* Identification of intermediate levels (e.g., "kin selection → cognitive biases → social norms") or their absence.  
  - **Q6:** "Are these steps themselves explained via simpler, empirically supported processes (e.g., natural selection, neural learning algorithms), or are they hand-waved?"  
    *Sufficient answer:* Examples of step-by-step mechanisms or gaps (e.g., "selection favours traits" without specifying variation/selection mechanisms).  
    **Exit:** If all steps are grounded, categorise as **legitimate crane**; proceed to Stage 4. If intermediates are missing or underexplained, proceed to Q7.  

  *Stage 4: Evaluate Greediness (15 mins)*  
  - **Q7:** "Does the manuscript dismiss established patterns at higher levels of analysis (e.g., claiming ‘culture is an illusion’ or ‘morality isn’t real’) rather than showing how they emerge from Y?"  
    *Sufficient answer:* Textual evidence of eliminativism (e.g., "art is just genetic signalling") or emergence (e.g., "social norms scaffold moral emotions").  
  - **Q8:** "Does the author acknowledge constraints/causation at multiple levels (e.g., genes enabling minds, which then shape cultures), or insist all causation flows only upward from Y?"  
    *Sufficient answer:* Discussion of bidirectional influences or rigid bottom-up determinism.  
    **Exit:** If Q7/Q8 show eliminativism or flat causation, categorise as **greedy reductionism** and **decline**. If higher-level patterns are respected as real emergents, categorise as **legitimate crane**.  
    *Judgement call:* Whether dismissing a higher-level pattern (e.g., "law") is justified or premature.  

  **Application to Cases**  
  *Case 1 (Information as fundamental principle):*  
  - Stage 1: X = life/mind/society; Y = "information organising matter." Q2: **Yes**—Y posits information as a cosmic organiser without physical basis.  
  - **Exit:** **Skyhook**. Decline despite commercial pressure.  

  *Case 2 (Culture as inclusive-fitness maximisation):*  
  - Stage 1: X = human culture; Y = inclusive fitness. Q2: No agency.  
  - Stage 3: Q5/Q6: No intermediates (jumps from genes to art/religion).  
  - Stage 4: Q7: **Yes**—dismisses cultural/historical mechanisms as epiphenomenal.  
  - **Exit:** **Greedy reductionism**. Decline.  

  *Case 3 (Moral emotions as evolved cooperation):*  
  - Stage 1: X = morality; Y = step-by-step evolution (signalling, reputation). Q2: No skyhooks.  
  - Stage 3: Q5/Q6: Intermediates outlined (iterated interactions → reputations → emotions).  
  - Stage 4: Q7/Q8: Acknowledges moral "truth" as subjective emergence, not eliminated.  
  - **Exit:** **Legitimate crane**. Accept for acquisitions (judgement on dislike is irrelevant).  

  **What the Procedure Cannot Do**  
  - **Truth assessment:** It flags unsound *explanatory structure* (e.g., skyhooks) but cannot verify empirical accuracy. A "legitimate crane" may still be factually wrong.  
  - **Non-explanatory factors:** It ignores marketability, prose quality, ethical implications, or originality—these require separate editorial judgement.  
  - **Crane-under-construction validity:** It identifies promissory notes but cannot predict if they will be honoured; escalation to experts is still speculative.  
  - **Boundary disputes:** It relies on your judgement for "established" higher-level patterns (e.g., whether sociology is irreducible to psychology).
