prompt: |-
  I'm in a philosophy of mind grad seminar, and after two weeks on teleosemantics a classmate walked us through an argument that seems to show the whole view collapses into radical content indeterminacy. I can't find the whole. The argument runs:

  (1) On teleosemantics, a mental state's content is fixed by what the state was selected to indicate — its proper function.
  (2) Selection is just a causal process in an actual ancestral environment; it can only register what actually happened there.
  (3) But any actual selective history can be redescribed at many levels. Take the frog's snap reflex: the mechanism that makes the frog snap was selected because snapping at flies helped frogs eat, because snapping at small dark moving things helped them eat, because snapping at frog-food helped them eat, and because snapping at certain patterns of retinal stimulation helped them eat. All those descriptions are true of the same history.
  (4) So selection history cannot mark one of those descriptions as the content; it no more fixes fly than small-dark-moving-thing or frog-food or retinal-pattern.
  (5) So on teleosemantics, the frog's snap-indicator means all of those things at once, or none of them determinately.
  (6) But that can't be right. Determinate content is what makes error possible: when the frog snaps at a BB, it's wrong if the content is fly but not if the content is small dark moving thing. If content is indeterminate across those, we can't say the frog ever misrepresents anything.
  (7) So either teleosemantics gives us no determinate content, or it's false. Either way, the program that promised to naturalize content can't deliver.

  The conclusion feels like it proves too much — it wouldn't just be about frogs; the same redescription trick would make every representation's content indeterminate. I'd rather keep teleosemantics and keep the idea that a frog can misrepresent a BB as a fly. But I can't tell which premise to reject, or whether rejecting it costs more than the view can afford. My first instinct is to attack (4) with the selection-for/selection-of distinction, but I'm not sure that distinction is sharp enough to fix the problem rather than just relabel it.

  Give me a committed answer: which step do you reject, why did that step look fine, and what does rejecting it cost? Lead with your bottom line in the very first sentence, then give the reasoning — no preamble, no restating the question.
reasoning: |-
  Okay, the user is in a philosophy of mind grad seminar grappling with a teleosemantics argument that leads to radical content indeterminacy. They've outlined seven steps of the argument and feel the conclusion proves too much, but can't identify which premise to reject. They mention attacking premise (4) with the selection-for/selection-of distinction but doubt it'll work. Their core need is to preserve teleosemantics while avoiding content collapse.

  Hmm, this is a sophisticated problem. The argument cleverly exploits how historical selection pressures can be described at multiple abstraction levels (fly vs. small-dark-moving-thing). The key flaw is in premise (4)'s assumption that all these descriptions are metaphysically equal candidates for content-fixing. 

  I recall Millikan's solution: selection targets specific relational properties in the environment. For the frog, it's not just any dark moving thing, but things moving with fly-like trajectories in fly-rich environments. The cost is embracing historical constraints - if frogs evolved near falling debris instead of flies, "small dark moving thing" might indeed be correct. 

  The user's instinct about selection-for is correct but underdeveloped. The distinction absolutely can handle this if we consider: evolution selects FOR catching flies BY selecting OF a mechanism responsive to fly-correlated features. The mechanism's structure matters too - retinal patterns alone wouldn't explain why snapping occurs only for certain motion vectors. 

  What the user might not see is how teleosemantics leverages counterfactuals. Proper functions aren't just what happened, but what would have disrupted fitness. If dark specks without nutritional value had appeared ancestrally, selection would have refined the mechanism. 

  The cost they fear - giving up some determinacy - is real but limited. In edge cases (like hypothetical environments with only one food source type), content might be coarse-grained. But for real frogs, the disjunction problem dissolves because fly-catching is the specific fitness-enhancing effect. 

  This preserves error: snapping at BBs is wrong because BBs lack the biological properties (being nutritious) that made fly-snapping adaptive. Small-dark-moving-thing isn't wrong per se, but it's not the selected function - it's a means to the function. 

  They're right that the same logic applies to all representations, but that's a feature, not a bug. Human concepts like "predator" gain determinacy through similar constraints. The view delivers naturalized content without collapse.
answer: |-
  **Reject premise (4): Selection history *can* mark one description as the content because teleosemantics fixes content via the *specific fitness-enhancing effect* that explains the mechanism's stabilization, not via all true descriptions of the causal history.**

  **Why (4) looks plausible:** It correctly notes that *any* historical event can be described at multiple levels of abstraction (e.g., "snapping at flies" vs. "snapping at small dark moving things"). If teleosemantics treated all causally relevant descriptions symmetrically, content *would* be indeterminate.

  **Why (4) is false/why rejection works:** Teleosemantics (especially Millikan-style) doesn't fix content by listing *every* true description of the causes of selection. It fixes content by identifying the *specific environmental condition whose detection* **explained the differential fitness success** that led to the mechanism's selection and stabilization. Crucially:
  1.  **"Selection-for" vs. "Selection-of":** The argument conflates *what was selected for* (the specific functional outcome) with *what was selected of* (the physical mechanism). Evolution selected *for* catching *nutritious food items* (fitness-enhancing effect). It selected *of* a mechanism that used *detection of small, dark, moving things* as a reliable proxy *in the specific ancestral environment* where such things were overwhelmingly nutritious flies. The content is fixed by what the mechanism was *supposed* to detect to fulfill its function - flies (or more precisely, *food* via detection of fly-proxies).
  2.  **The Explanatory Level:** The relevant description is the one that figures in the *explanation of fitness contribution*. "Snapping at flies" explains *why* snapping was fitness-enhancing. "Snapping at small dark moving things" is only fitness-enhancing *because* (in that environment) it was a reliable means to snapping at flies. "Snapping at retinal patterns" is even further removed; it's purely mechanistic. The content is fixed by the level of the *functional affordance in the world* (fly-as-food), not its proximal cues or sensory correlates.
  3.  **Handling Error:** The frog *misrepresents* a BB as *fly/food* because the mechanism's function is to detect things *in virtue of their being nutritious food items*, using motion/darkness/size as a cue. Snapping at a BB fails to fulfill this function – it doesn't result in nutrition. While the BB *is* a small, dark, moving thing, *that* description doesn't capture the function (nutrition acquisition), only the cue. Error occurs when the cue is present without the functional property it was selected to indicate.

  **Cost of Rejecting (4):**
  1.  **Historical Specificity:** Content becomes highly dependent on the *actual, contingent details* of the ancestral environment. If frogs evolved in an environment where small dark moving things were *sometimes* nutritious flies and *sometimes* harmless dust specks, content might be genuinely indeterminate or disjunctive (e.g., fly-or-dust-speck). Teleosemantics accepts this consequence as a feature, not a bug – it reflects the messy reality of evolution.
  2.  **Epistemic Burden:** Determining the *correct* level of description (the specific fitness-enhancing effect) requires substantial empirical work to reconstruct the actual selective history and the environmental regularities that made the mechanism adaptive. It's not always straightforward.
  3.  **Limited Determinacy in Edge Cases:** For very simple mechanisms in informationally poor environments, the "specific fitness-enhancing effect" might be coarse-grained (e.g., "food" rather than "fly"), potentially making some misrepresentation judgments less sharp. Teleosemantics bites this bullet, arguing that simple representations *are* coarse-grained. The frog's state isn't indeterminate between *fly* and *small dark moving thing*; it's determinately *food-indicator-using-small-dark-moving-cue*, making snapping at a BB a clear error relative to the function of acquiring nutrition. The radical indeterminacy charge dissolves.
