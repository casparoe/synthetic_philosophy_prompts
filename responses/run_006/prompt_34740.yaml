prompt: |-
  I've been thinking about the difference between lying and misleading for a while now, and I've been testing my ideas against a friend's judgements. I've collected her verdicts on six cases, and now I want to see if I can predict what she'll say about a seventh.

  She's not a philosopher — neither am I — but she's thought about this a lot and her views are fairly consistent, even if she can't always articulate the rule she's running.

  Here are her verdicts:

  1. A colleague tells a client "I've led projects of this size before" when he's only ever been an assistant on such projects. She says: clearly wrong, a serious breach.

  2. A colleague tells a client "I've been involved in projects of this size" — true, but intended to create the impression he's led them. She says: also wrong, but noticeably less bad than the lie. The client could have asked a follow-up.

  3. A husband tells his wife "I was at the office until eight" when he was actually at a bar with colleagues. She says: wrong, a betrayal of trust.

  4. A husband tells his wife "I had a lot of work to finish" — true, he did have work, but he finished it by six and then went to the bar, and he knows she'll infer he was at the office all evening. She says: wrong, and actually worse than the lie, because it's sneakier and shows more contempt.

  5. A friend asks whether you liked her presentation. You say "It was great" when you thought it was a mess. She says: a small wrong, but sometimes kindness matters more than honesty.

  6. A friend asks whether you liked her presentation. You say "You clearly put a lot of work into it" — true, but intended to dodge the question about whether it was good. She says: not wrong at all. You found something true to praise.

  Now the new case. A politician is asked at a press conference whether she knew about the data breach before the public announcement. She says "I was informed through the usual channels at the same time as the board" — which is true: she was informed through the usual channels, and the board was informed at the same time, but she'd already known about it for a week through informal conversations. Her answer is literally true but grossly misleading.

  What would my friend say about this case? I'm less interested in the answer itself than in working out what principle or principles could explain her pattern of verdicts, which of those principles would give different answers here, and what the best guess is for her view. If her existing verdicts don't settle it, what further case would tell the competing principles apart?

  Please approach this as an expert in moral philosophy who specialises in the ethics of deception. Start by brainstorming the candidate rules that fit her verdicts, then work through which ones converge on the new case and which diverge, and give your best prediction with an honest account of the uncertainty.
reasoning: |-
  Okay, let me start by unpacking this user's query. They've presented six cases where their friend judged different deceptive statements, ranging from outright lies to misleading truths. Now they want to predict how the friend would judge a seventh case about a politician's misleading answer. The user is interested in the underlying principles and any uncertainty in the prediction.

  First, I need to analyze the friend's verdicts across the given scenarios. Cases 1 and 3 involve explicit lies, both judged as wrong. Cases 2 and 4 are misleading truths, but with differing judgments: case 2 is less bad than lying, while case 4 is worse. Cases 5 and 6 involve social evaluations, with a clear lie being a "small wrong" and a truthful dodge being acceptable. 

  The key differentiators seem to be: (1) the speaker's intent to deceive (present in all wrong cases), (2) the degree of literal truth (mitigating in case 2 but not in case 4), and (3) the effort made to avoid deception. Case 4 stands out as uniquely bad because the husband exploited his wife's reasonable inference patterns with contempt, while in case 6 the speaker made good faith effort to find truthful praise. The politician case resembles case 4 in its exploitative use of inference, but adds public accountability concerns.

  For prediction, the core tension is whether the politician's evasion shows contempt like the husband's (suggesting "worse than lying") or if the public context shifts the balance. Since the friend emphasized "sneakiness" and exploitation of inferences in case 4, and the politician's answer similarly manipulates expected inferences, I'd lean toward her judging it as worse than a lie. However, the public context could introduce nuance about press conference dynamics that might moderate the judgment. 

  To resolve uncertainty, I'd propose a test case contrasting personal vs. public deception using similar mechanics. For example: a student misleading a teacher about plagiarism via technically true statements versus lying outright. The friend's reaction to that would clarify if her contempt principle transfers to institutional hierarchies or remains confined to intimate relationships.
answer: |-
  Based on your friend's pattern of verdicts and specializing in deception ethics, here's a systematic breakdown of the candidate principles, their application to the new case, and the best prediction:

  **Step 1: Brainstorming Candidate Rules (Fitting All 6 Verdicts)**
  Your friend's judgments suggest a nuanced interplay of *intent*, *literal truth*, *exploitation of inference*, and *moral effort*:

  1.  **The Exploited Inference Principle (Primary Driver):**
      *   Wrongness increases when the speaker *intentionally exploits* the listener's *reasonable inferences* to deceive, *especially* if the deception is achieved *without literal falsehood*.
      *   **Fits Verdicts:** Explains why Case 4 (husband's "had work") is *worse* than Case 3 (lie). The husband weaponizes his wife's trust in how language is normally used (saying "had work" implies ongoing work preventing him from being elsewhere). Case 2 (involved in projects) also exploits inference but is less bad than Case 1 (lie), likely because the inference (involved = led) is slightly less automatic. Case 6 (praise effort) avoids exploiting inference about quality; it redirects honestly.

  2.  **The Contempt/Opportunism Principle:**
      *   Wrongness increases when the deception leverages the relationship's trust to avoid accountability, demonstrating contempt for the listener's right to know or their ability to question. This amplifies the "Exploited Inference" principle.
      *   **Fits Verdicts:** Crucial for Case 4 being *worse* than Case 3. The lie is direct betrayal; the misleading truth adds manipulation and cowardice, hiding behind technical truth. Case 1 & 3 show contempt via bold lies. Case 2 shows less contempt (client *could* ask). Case 5 shows weak contempt overridden by kindness. Case 6 shows active effort to *avoid* contempt.

  3.  **The Literal Truth Mitigation Principle (Conditional):**
      *   Literal truth *reduces* wrongness only if the speaker makes a *good faith effort* not to exploit inferences or provides an *obvious off-ramp* for questioning. It doesn't absolve deceptive intent.
      *   **Fits Verdicts:** Explains why Case 2 is *less bad* than Case 1 (truth mitigates vs. outright lie) and why Case 6 is *not wrong* (truth + good faith effort). Case 4 shows truth offers *no mitigation* because it's used exploitatively with no off-ramp ("had work" strongly implies reason for absence).

  4.  **The Kindness/Social Lubrication Exception:**
      *   Small deceptions are less wrong in contexts where harsh truths cause disproportionate harm and the stakes are low (evaluations, feelings). Doesn't apply to breaches of trust, accountability, or material facts.
      *   **Fits Verdicts:** Explains the "small wrong" in Case 5 vs. the serious breaches in Cases 1-4. Case 6 avoids even a small wrong by using truth kindly.

  **Step 2: Applying Principles to the Politician Case**

  *   **Scenario:** Politician says *"I was informed through the usual channels at the same time as the board"* (literally true) knowing the audience will infer *"I didn't know before the public announcement."*
  *   **Analysis:**
      *   **Exploited Inference:** High. The inference from "informed through usual channels at same time as board" to "first learned then" is extremely strong and reasonable in a context about disclosure timing. She *intends* this false inference.
      *   **Contempt/Opportunism:** Very High. This is a press conference – maximum accountability context. She exploits the public's trust in official channels and precise language to dodge accountability, showing contempt for the electorate/journalists' right to know about her prior knowledge.
      *   **Literal Truth Mitigation:** LOW/NONE. The literal truth is used *precisely* to make the deception more plausible and evade direct accountability. There's no good faith effort; it's crafted to mislead. No obvious off-ramp – the answer sounds definitive.
      *   **Kindness Exception:** Doesn't apply. This is about accountability and facts, not sparing feelings.

  **Step 3: Predicting Your Friend's Verdict & Uncertainty**

  *   **Best Prediction:** Your friend will say this is **wrong, and likely WORSE than an outright lie ("No, I only knew when the board did")**.
      *   **Reasoning:** This case is structurally almost *identical* to Case 4 (the husband). Both involve:
          1.  A high-trust/accountability relationship (spouse/public office).
          2.  A question about specific knowledge/timing.
          3.  A literally true statement crafted to exploit a *very strong, reasonable inference* ("had work" implies working late / "informed at same time" implies first learned then).
          4.  Clear intent to deceive by hiding behind technical truth.
          5.  Demonstrated contempt for the questioner's right to know, using sneakiness to avoid accountability.
      *   Case 4 established her strong aversion to this specific form of deceptive contempt. The public context likely amplifies the wrongness due to the breach of democratic trust.

  *   **Uncertainty & Competing Principles:**
      *   **Source of Uncertainty:** The *only* significant difference is the context: intimate betrayal (Case 4) vs. public accountability (Politician). Does your friend weigh "contempt for a spouse" differently than "contempt for the public"? Her other cases don't directly test this.
      *   **Competing Principle:** Could the **Literal Truth Mitigation** principle apply slightly more here than in Case 4? The politician's statement is *very* precise and bureaucratic. *Maybe* your friend sees this as offering *some* minimal off-ramp ("she said 'informed through usual channels'... maybe she knew another way?") making it marginally less bad than Case 4, though still worse than a lie? This seems unlikely given her Case 4 verdict, but it's a minor point of divergence.
      *   **Degree of Badness:** While predicting "worse than a lie" is strong, the *magnitude* compared to Case 4 is less certain. Is betraying the public *worse* than betraying a spouse in her view? Her cases don't establish this hierarchy.

  **Step 4: The Crucial Test Case to Resolve Uncertainty**

  To definitively determine if the "Exploited Inference + Contempt" principle applies equally across personal and public contexts, or if she weights intimate betrayal more heavily, propose this:

  *   **The Student/Teacher Test Case:**
      *   A student is accused by a teacher of plagiarizing an essay. The student *did* plagiarize.
      *   **Case A (Lie):** Student says: "No, I wrote it all myself."
      *   **Case B (Misleading Truth):** Student says: "I carefully compiled all the sources listed in the bibliography and synthesized them myself." (True: they plagiarized *from* those sources and "compiled/synthesized" describes the act of plagiarizing, but phrased to sound like honest work. The teacher will infer original work).

  *   **Why this tests the uncertainty:**
      *   It mirrors the politician/husband structure (accountability question, exploiting inference via literal truth, contempt for authority).
      *   The relationship (student/teacher) is a *trust-based institutional* relationship – less intimate than marriage, more personal than politics.
      *   **If your friend says Case B (misleading truth) is WORSE than Case A (lie):** This confirms the "Exploited Inference + Contempt" principle applies strongly to institutional/public accountability contexts like the politician. Predict "worse than a lie" for the politician.
      *   **If your friend says Case B is LESS bad than Case A, or ONLY as bad:** This suggests the *intimate betrayal* aspect was crucial in Case 4 making it uniquely worse than a lie. For the politician (public figure), she might see the misleading truth as *less bad* than a lie (like Case 2), or perhaps equally bad. This would weaken the prediction of "worse than a lie" for the politician, pointing more towards "seriously wrong, probably as bad as a lie."

  **Conclusion:**

  Based on the robust pattern – especially the strong condemnation of exploiting reasonable inferences to deceive contemptuously while hiding behind literal truth (Case 4) – the best prediction is that your friend will judge the politician's action as **wrong and worse than an outright lie**. The core principles of Exploited Inference and Contempt/Opportunism align perfectly with the politician's behavior. The primary uncertainty lies in whether the public context lessens the *relative* wrongness compared to intimate betrayal (Case 4), but it almost certainly won't make it *better* than a lie. The Student/Teacher test case would provide definitive evidence for calibrating her judgment across relationship types.
