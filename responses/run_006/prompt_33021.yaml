  Debates about Bernard Williams’s integrity objection to utilitarianism have been running for decades and seem to have stalled. On one side, critics treat his famous rescue cases as showing that impartial moral theories can demand a psychologically painful split between deliberation and affect, not that they are false. On the other, defenders of Williams treat that split as a normative feature of the agent’s perspective: a husband who has to rehearse impartial reasons before saving his wife has already lost something important, even if he does the right thing. Both sides generally agree on the case descriptions and usually agree the man should save his wife. My hypothesis is that the apparent impasse comes from asking different questions: one group is testing a criterion of rightness, while the other is making claims about which first-personal deliberative states a moral theory must make room for. Is that the right diagnosis? If not, what is the actual structure of the dispute—factual, axiological, metatheoretical, verbal, or a clash of bedrock intuitions? And given your diagnosis, what would count as progress, or why should none be expected? I want a committed answer with reasons, not a survey of positions. End with a final line exactly of the form \answer{...} containing a short label for the kind of disagreement you diagnose.
