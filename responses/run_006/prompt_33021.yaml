answer: |-
  Your diagnosis is perceptive but incomplete. The core impasse isn't merely about *different questions*—it's a deeper **metatheoretical divergence over the ontology and purpose of moral theory itself.**

  Here's the committed analysis:

  1.  **The Critic's Project (Testing Rightness):** This camp operates within a predominantly **consequentialist metaethics**. They view moral theories as algorithms for determining *what ought to be done*, judged by an external, objective standard (e.g., maximizing good states of affairs). Psychological costs like alienation are regrettable *implementation problems* ("friction") within the agent's psychology, not flaws in the moral criterion itself. Progress means refining the theory to mitigate friction (e.g., sophisticated consequentialism) or accepting it as an inevitable cost of objective correctness. The "first-personal perspective" is a psychological datum to be managed, not a constitutive element of morality.

  2.  **Williams's Project (Defending the Agent's Perspective):** This camp operates within a **distinctly non-consequentialist metaethics**, emphasizing **moral agency as lived experience**. For Williams, morality isn't *just* about right outcomes; it's fundamentally about *how agents understand themselves, their commitments, and their actions* within the fabric of their lives. The "integrity" objection isn't about psychological pain *per se*; it's about the **normative structure of practical reason and identity**. Deliberation isn't a mere calculator for an external good; it's where an agent *constitutes* their moral self through their projects and attachments.
      *   **The Normative Loss:** When the husband pauses to rehearse impartial utilitarian reasons to save his wife, he objectifies his deepest commitment. His love becomes a *factor* to be weighed, not the *ground* of his action. He ceases to act *as a husband* and instead acts *as an impartial calculator*. This shift represents a **corruption of his practical identity** and the **special reasons** generated by that identity. Saving her *for the right utilitarian reason* is, from *within* the perspective of being a husband, the *wrong kind of reason*. It demonstrates a failure to grasp the *nature* of the commitment itself.

  3.  **The Structure of the Dispute:**
      *   **Factual?** No. Both sides largely agree on the empirical description of the case and the likely action.
      *   **Axiological?** Partially, but insufficiently. While they may value different things (outcomes vs. integrity), the deeper clash is about *why* those things are valued and *how* they fit into a moral theory.
      *   **Metatheoretical?** **Yes, fundamentally.** The dispute centers on:
          *   **The Ontology of Morality:** Is morality primarily about *states of affairs* or *agents and their reasons*?
          *   **The Purpose of Moral Theory:** Is its primary task to *prescribe optimal actions* (external standard) or to *articulate and make sense of the reasons agents have* (internal standard)?
          *   **The Role of the Agent's Perspective:** Is the first-personal deliberative standpoint merely a psychological container for applying an external theory, or is it the *essential locus* where morality is realized and understood?
      *   **Verbal?** No. The key terms ("integrity," "reason," "commitment," "demand") are being used with substantive, contested meanings rooted in their respective metaethical frameworks.
      *   **Bedrock Intuitions?** Ultimately, yes, but these intuitions are *structured by* their metatheoretical commitments. The critic intuits that rightness must be externally determinable; the Williams defender intuits that morality must resonate with and make sense of our deepest identities and reasons for acting.

  4.  **Progress:**
      Progress requires **explicitly engaging the metatheoretical rift**. It won't come from:
      *   Inventing new rescue cases (the descriptions are agreed upon).
      *   Further refining the consequentialist criterion (ignores the core objection).
      *   Simply asserting the importance of integrity (dismissed as a psychological cost).

      Progress *could* come from:
      *   **Metatheoretical Argument:** Directly defending one metaethical picture against the other. Can consequentialism *genuinely* incorporate the agent's perspective as normative, not just psychological? Can non-consequentialism offer a compelling account of impartial demands *without* destroying integrity? Debates like consequentializing vs. anti-consequentializing reasons are steps here.
      *   **Phenomenological Clarification:** Deeper analysis of *what is actually lost* in the deliberation Williams describes. Is it merely sentiment, or is it a constitutive part of the reason and the relationship? Can this be described in a way the critic must acknowledge as *normatively* significant?
      *   **Theory-Building Under Constraint:** Attempting to construct consequentialist theories that *genuinely* generate agent-relative reasons from *within* the agent's perspective as husband/lover, not just as psychological heuristics. Or, conversely, showing how non-consequentialist theories can handle large-scale impartial demands without collapsing into consequentialism.
      *   **Acknowledging the Stakes:** Recognizing that the dispute is not resolvable by shared intuitions about cases alone because those intuitions are shaped by prior commitments about what morality *is*. Progress might involve convincing the other side that their metaethical picture has unacceptable implications elsewhere (e.g., consequentialism leading to alienation in other core commitments; non-consequentialism failing to handle urgent impartial demands).

  **Conclusion:** The impasse persists because critics interpret Williams's objection through the lens of a metaethics focused on action-guidance and external rightness, while Williams (and defenders) root the objection in a metaethics focused on agency, identity, and the internal structure of practical reason. They are arguing past each other *because* they hold fundamentally different conceptions of what a moral theory is supposed to *do* and what *constitutes* a moral failing. Progress requires shifting the debate to this metatheoretical level and confronting the divergent visions of moral ontology.

  \answer{Metatheoretical divergence over moral ontology}
