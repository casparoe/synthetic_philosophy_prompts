prompt: |-
  I'm giving the opening remarks at a workshop on psychiatric diagnosis reform next month. The audience is a mix: about half are clinicians and researchers who've worked with the DSM/ICD for decades, and the other half are service users and advocates, some of whom have quite strong views about the harm diagnostic labels have done them. I've got eight minutes.

  The thing I want to get across — without using the word 'looping' or mentioning Ian Hacking or sounding like I'm giving a philosophy lecture — is the basic idea that psychiatric classifications aren't like classifying rocks. When you classify a person, the person notices, and that changes how they think about themselves, which changes the presentation, which changes what the classification picks up. And this isn't just a measurment problem you can fix with better instruments; it's structural. The categories keep moving.

  I want the clinicians to feel this as a genuine challenge to what they're doing, not an attack. And I want the service users to feel heard without being patronised. Can you write the speech? Please just give me the speech itself, no preamble or commentary.
reasoning: |-
  Okay, the user is preparing opening remarks for a workshop on psychiatric diagnosis reform. They need to address a mixed audience of clinicians, researchers, service users, and advocates in just eight minutes. The core challenge is conveying how psychiatric classifications affect people differently than inert objects—without using academic jargon like "looping" or referencing philosophers. 

  Hmm, the user’s deeper need seems to be bridging two perspectives: validating service users’ experiences of diagnostic harm while engaging clinicians professionally. The clinicians might feel defensive if framed as "doing harm," so the tone must avoid blame but still challenge assumptions. Meanwhile, service users need acknowledgment that labels aren’t just "inaccurate" but actively impactful. 

  The structural point about categories "moving" is key. Maybe use metaphors? Rocks vs. trees—rocks stay put, trees grow and react. Or medical tests (X-rays) vs. conversations—the latter changes both parties. Also, avoid "measurement problem" since that implies solvable technical glitches. Stress it’s inherent. 

  For clinicians: Emphasize curiosity. "What if we lean into the instability?" makes it collaborative. For service users: Explicitly name power dynamics ("labels stick") and harm ("painful or limiting"). The line "This room holds both wisdom and wounds" might resonate. 

  Watch the clock—8 mins is tight. Opening hook (contrast rocks/humans), then 3 parts: 
  1. How humans react to classification (self-perception shifts) 
  2. Why this isn’t fixable by better tools (dynamic system) 
  3. Framing as shared opportunity ("What if we…?"). 
  Close with unity: "Both groups have felt unheard… today we listen." 

  Should I avoid "diagnosis as tool"? No—clinicians see it as practical, so validate that ("We all rely on these tools") before complicating it. But add: "Tools for minerals don’t reshape the mountain." 

  ...Final check: Does "labels stick to us" sound patronizing? Maybe rephrase as "labels adhere to identities," but that’s clunky. Keep it visceral. "Stick" works if paired with service users’ agency later ("rewrite the labels"). 

  Alright, drafting now—direct address, no hedging.
answer: |-
  **(Lights dim slightly as you step to the podium. Warm, engaged tone.)**

  "Good morning, everyone. Welcome. It’s truly powerful to see this room filled with such diverse expertise and experience: clinicians and researchers who’ve dedicated careers to understanding mental health, alongside individuals who’ve navigated these systems firsthand. This mix is essential.

  We’re here to talk about diagnosis. About the words we use to describe profound human experiences. And I want to start by acknowledging something fundamental: **Classifying human experience is fundamentally different from classifying things that don’t experience being classified.**

  Think about geology. A geologist identifies a rock. The rock doesn’t change because it’s been labeled ‘granite’ or ‘basalt’. It doesn’t think about itself differently. It doesn’t adapt its behavior based on the label.

  But people? We *notice*. When a powerful label describing our inner world is applied – especially in a clinical setting, by someone whose expertise we rely on – it lands. It resonates. That label becomes part of our story, part of how we understand ourselves, our struggles, and our potential.

  This isn't just about getting the 'right' word. It’s about a dynamic process. **The very act of naming an experience can shape the experience itself.** A person hears a diagnosis, absorbs it, and it influences how they feel, how they cope, how they present themselves – even subtly. It influences what they expect of themselves, and often, what others expect of them.

  Clinicians, researchers: This isn’t a critique of your skill or intent. It’s a challenge inherent in our work. **Our tools of classification aren’t passive observers; they interact with the very thing they’re trying to describe.** What we observe tomorrow might be different, in part, *because* of what we named and how it was received yesterday. The target keeps shifting. This isn't a flaw in a blood test or an X-ray machine we can recalibrate; it's woven into the fabric of human psychology interacting with categorization.

  Service users, advocates: Many of you know this reality intimately. You’ve felt the weight of a label – sometimes helpful, but often confining, stigmatizing, or simply missing the mark. You know how labels can stick, how they can change how you’re seen, and sometimes, how you see yourselves. Your presence here, sharing that lived expertise, is vital. We *must* understand this impact.

  So, the core question we face isn't just *how* to classify better, but **how do we navigate a system where the categories themselves are dynamic?** Where the person being classified is an active participant whose understanding evolves? Where our labels have profound consequences beyond mere description?

  What if we lean *into* this complexity? What if we see the instability not as noise to eliminate, but as crucial information about the human condition? How do we create classifications that are less like fixed stamps and more like evolving maps – maps that empower rather than constrain, that leave room for the person’s own story and growth?

  That’s the frontier we’ll explore today. It demands humility from all of us. It demands listening – truly listening – across experiences. It demands creativity. Both groups in this room have felt unheard at times. Today, let’s commit to hearing each other. Let’s start that conversation now.

  Thank you."
