prompt: |-
  a friend of mine who reads the same rationalist blogs as me keeps dismissing evo psych as just-so stories. his move is: for any trait you can invent an adaptionist story about how it was useful in the ancestral environment, the story is unfalsifiable because we can't go check the pleistocene, so the whole field is basically bedtime stories with statistics. he pulled this on me last week to wave away a study on sex differences in disgust sensitivity, and i found myself half-agreeing but also suspecting the analogy is doing more work than it can carry. i want an audit of the just-so story analogy, not a defense or a hit piece. give me the correspondence table first: what in evo psych plays the role of the fanciful origin, the animal getting its trait, and the tidy etiological punchline. then the places the mapping breaks. which disanalogies actually matter for the conclusion people draw — that evo psych isnt science and this specific finding can be ignored — and which are just surface-level? does the conclusion survive once theyre on the table, or was the analogy carrying it the whole time? and if theres a better analogy for what good vs bad evo psych actually looks like, give me that too. keep it under 600 words, table included.
reasoning: |-
  Okay, the user's friend dismisses evolutionary psychology (evo psych) as "just-so stories," arguing that it's unfalsifiable and unscientific because we can't test claims about the Pleistocene era. The user wants a balanced audit of this analogy—not a defense or attack—focusing on how the analogy holds up and where it breaks down. They specifically want a correspondence table mapping elements of Kipling's stories to evo psych, then an analysis of disanalogies, and finally a better analogy for good vs. bad evo psych. 

  First, I need to recall Kipling's "Just So Stories." They're whimsical tales explaining animal traits (e.g., how the elephant got its trunk) with fictional, untestable origins. The user's critique hinges on three parts: fanciful origin, trait acquisition, and tidy punchline. 

  For the correspondence table:  
  - **Fanciful Origin**: In evo psych, this maps to hypothesized adaptive problems in the Pleistocene (e.g., avoiding pathogens).  
  - **Animal/Trait**: The human psychological trait being explained, like sex differences in disgust sensitivity.  
  - **Tidy Punchline**: The evo psych narrative framing the trait as an adaptation solving that problem.  

  Now, disanalogies—where the analogy breaks:  
  1. **Falsifiability**: Unlike Kipling, evo psych isn't inherently unfalsifiable. Good studies use testable predictions (e.g., cross-cultural patterns, neural correlates). Bad ones don't, which is where the "just-so" label sticks.  
  2. **Evidence Standards**: Evo psych uses empirical data (experiments, surveys, fossils) and consilience with other sciences. Kipling has none of this.  
  3. **Trait Complexity**: Human traits are often studied as probabilistic tendencies with trade-offs, not Kipling's simplistic "one trait, one cause."  
  4. **Alternatives**: Evo psych considers non-adaptationist explanations (byproducts, drift), while Kipling doesn't.  

  Key takeaway: The analogy works against lazy evo psych that spins unfalsifiable tales, but it unfairly tars the whole field. The conclusion that "all evo psych is unscientific" doesn't hold when disanalogies are weighed—only the shoddy work fits the critique.  

  For a better analogy: Forensic investigation. Good evo psych is like a detective testing hypotheses against multiple lines of evidence (fingerprints, alibis, forensics). Bad evo psych is like a detective fixated on one story without evidence. This emphasizes testability and evidence integration over storytelling.  

  User's deeper needs: They likely want intellectual tools to push back against their friend's oversimplification without sounding defensive. They also seek nuance—how to distinguish credible evo psych from weak claims—to navigate future debates confidently.  

  Final note: Keep it under 600 words. The table and analysis should empower the user to dissect the analogy objectively, not "win" an argument.
answer: |-
  Here's an audit of the "evo psych as just-so stories" analogy, structured as requested:

  ### Correspondence Table: Kipling's Just-So Stories ↔ Evolutionary Psychology
  | **Kipling Element**          | **Evo Psych Analog**                     | **Example (Disgust Sensitivity)**                     |
  |------------------------------|------------------------------------------|-------------------------------------------------------|
  | **1. Fanciful Origin**       | Hypothesized adaptive problem (EEA*)     | Pathogen avoidance in ancestral environments         |
  | **2. Animal + Trait**        | Modern human + psychological mechanism   | Women's higher disgust sensitivity                    |
  | **3. Tidy Etiological Punchline** | Adaptationist narrative                | "Women evolved greater disgust to protect offspring" |

  *\*EEA = Environment of Evolutionary Adaptedness*

  ### Where the Analogy Holds (Valid Critiques)
  1. **Narrative Flexibility**: Like Kipling, weak evo psych can retrofit *any* trait to *any* adaptive problem ("men evolved laziness to conserve calories for hunting" / "women evolved laziness to avoid predators while pregnant"). 
  2. **Falsifiability Challenges**: Testing Pleistocene selective pressures *is* inferential. Poor studies use circular logic: *"Trait exists → therefore it was adaptive → here's a story why."*

  ### Where the Analogy Breaks (Meaningful Disanalogies)
  1. **Falsifiability ≠ Impossible**: 
     - Good evo psych generates *testable predictions*: e.g., "If disgust is sexually dimorphic due to parental investment theory, the gap should peak in fertile years" (often tested). 
     - Kipling: Zero predictions. Evo psych: Uses cross-cultural data, fossils, genetics, or lab experiments to constrain hypotheses.

  2. **Evidence Standards**: 
     - Kipling: Pure invention. Evo psych: Leverages convergent evidence (e.g., disgust sensitivity correlating with immune markers, cross-cultural patterns, comparative primatology). 
     - The disgust study your friend dismissed likely had empirical data beyond storytelling.

  3. **Trait Complexity**: 
     - Kipling: One cause → one trait (elephant's trunk = crocodile tug-of-war). 
     - Evo psych: Acknowledges spandrels, drift, and trade-offs (e.g., "Disgust may be a byproduct of general aversion systems, amplified in women due to X, but costly in context Y").

  4. **Alternative Hypotheses**: 
     - Good evo psych tests non-adaptationist explanations (e.g., "Is this sex difference cultural?"). Kipling offers no alternatives.

  ### Does the Conclusion Survive?
  - **For lazy evo psych**: Yes. Studies offering *only* unfalsifiable stories deserve dismissal.
  - **For rigorous evo psych**: No. The analogy collapses when predictions are tested against evidence. Dismissing *all* evo psych because some is bad is like dismissing physics because of cold fusion hype.
  - **Your friend's move** overgeneralizes. The presence of *some* just-so stories doesn't invalidate *all* adaptationist hypotheses, especially when coupled with evidence.

  ### Better Analogy: Forensic Investigation
  **Good evo psych** is like a detective reconstructing a crime scene:
  - Uses multiple lines of evidence (DNA/fossils ≈ fingerprints; cross-cultural patterns ≈ witness alibis; experiments ≈ lab tests).
  - Tests alibis (alternative hypotheses).
  - Acknowledges incomplete evidence.

  **Bad evo psych** is a detective who decides the butler did it, then only seeks confirmation.

  ### Takeaway
  The "just-so" critique usefully flags weak methodology but fails against evo psych that integrates evidence, tests alternatives, and makes risky predictions. Your friend's dismissal of the disgust study requires examining its *specific methods*—not blanket analogy.
