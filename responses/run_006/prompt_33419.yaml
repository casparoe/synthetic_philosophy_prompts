  The core neuroscience: In the color phi experiment, subjects see two flashed dots and report a moving dot that changes color mid-trajectory. The debate is about timing—does the brain edit before conscious awareness (Stalinesque) or after (Orwellian)? 

  Translating to narrative:
  - Stalinesque: Like a show trial. The brain falsifies evidence before it reaches the narrator. This maps to an unreliable narrator where the narration itself is manipulated at the time of perception.
