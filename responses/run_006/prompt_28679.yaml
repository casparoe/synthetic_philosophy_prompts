  Rhyme scheme: Words ending with "ire" then "urst," "otion," etc. Refrain: "this breath." Ensure each couplet stands alone but linked by the refrain.

  Pen name: Use "Mustafa" in the last couplet. Show the paradox: the name is invoked, but the act is God's. "This pen moves by His will, not Mustafa's design."

  Make sure the language is poetic but clear. Avoid academic terms. Use vivid imagery to make the philosophy felt. Test each couplet for thematic independence and the refrain's theological anchor. Ensure the final twist is impactful.
