  First, I need to recall Quine's actual positions. Quine rejected the analytic-synthetic distinction and verificationism, so labeling him as a verificationist is incorrect. His naturalism focuses on empirical science but doesn't dismiss non-scientific discourse. The user mentioned values being "inculcated," which aligns with Quine's view of morality as culturally conditioned behaviors rather than mere expressions.

  The friend's summary has several errors. Saying moral claims have no cognitive content ignores Quine's acknowledgment that they are part of our web of beliefs. The analogy to "boo to murder" oversimplifies; Quine saw moral statements as more complex, rooted in social norms. The conclusion that we should abandon moral talk is also wrong. Quine believed morality is necessary for society, even if it's not scientific.

  The user's deeper need might be understanding how Quine's naturalism accommodates morality without reducing it to science. They might also seek a nuanced view that doesn't dismiss ethics entirely. Highlighting Quine's pragmatic approach and the role of cultural inculcation would address this. Emphasizing that Quine didn't advocate abandoning moral discourse but saw it as essential for social cohesion is key.
answer: |-
  You're right to be suspicious – your friend's summary contains significant oversimplifications and misattributions regarding Quine's views on ethics. While Quine *was* a naturalist who didn't grant moral statements the same epistemological status as scientific ones, his position was far more nuanced than the crude emotivism described. Let's break down your friend's claims:

  1.  **"Quine thought moral claims are just expressions of subjective feeling with no cognitive content at all."**
      *   **Oversimplification/Misleading:** Quine did *not* reduce moral claims *merely* to expressions of subjective feeling like "boo!" or "hooray!" (pure emotivism à la Ayer). His view was more subtle and grounded in behaviorism and cultural conditioning.
      *   **Quine's Actual View:** Moral claims *do* have cognitive content in the sense that they express *sentences* within our web of belief, governed by linguistic rules and social norms. They arise from deeply ingrained dispositions ("constitutions" or "moral sentiments") that are **inculcated** by society. These dispositions are shaped by evolution and cultural history to promote social cohesion. Saying "Murder is wrong" expresses a complex dispositional state conditioned by society, not just a fleeting personal feeling. It carries meaning within the shared linguistic and behavioral practices of a community. While not "cognitive" in the sense of describing objective, theory-neutral facts like physics, they *are* meaningful social phenomena.

  2.  **"Because he was a verificationist about meaning..."**
      *   **Fundamentally Wrong:** This is the most significant error. **Quine famously *rejected* verificationism.** His landmark essay "Two Dogmas of Empiricism" (1951) was a devastating critique of the analytic/synthetic distinction and, crucially, of **reductionism** – the idea that individual statements have their own specific empirical content or method of verification/falsification. Verificationism was a hallmark of logical positivism, which Quine explicitly dismantled.
      *   **Quine's Holism:** Quine replaced verificationism with **confirmation holism.** Meaning and empirical content are properties of *whole theories* or large chunks of the "web of belief," not individual sentences. While *scientific* theories as a whole face the "tribunal of experience" more directly and systematically, other parts of the web (like logic, mathematics, and yes, ethics) are connected more indirectly. Moral statements *do* have empirical import, but it's diffuse, embedded within the broader social behavior they regulate and the cultural norms they express. Their "meaning" comes from their role within the holistic system, not from being individually verifiable. Attributing verificationism to Quine misunderstands his core philosophy.

  3.  **"...he held that moral sentences can't be verified or falsified by observation, so they're literally meaningless."**
      *   **Partly True / Mostly Wrong:**
          *   **True Part:** Quine *did* hold that moral sentences cannot be verified or falsified by *observation* in the direct, controlled way characteristic of fundamental physics or biology. They lack determinate empirical content *as individual sentences*.
          *   **Wrong Part:** He absolutely **did NOT conclude they were "literally meaningless."** This conclusion *only* follows from verificationism, which he rejected. For Quine:
              *   Meaning is holistic, not sentence-by-sentence verification.
              *   Moral sentences are meaningful components of our language and social life. They play a crucial role in coordinating behavior, expressing social norms, and shaping desires and aversions. Their meaning derives from their function within the broader network of beliefs, desires, and behaviors constitutive of a society.
              *   Calling them "meaningless" ignores their vital social function and their status as learned linguistic behavior.

  4.  **"For Quine, saying 'murder is wrong' is no different from saying 'boo to murder'—it's pure emotivism."**
      *   **Oversimplification/Wrong:** As noted in point 1, Quine's view is more sophisticated than pure emotivism. "Boo!" suggests a spontaneous, personal emotional outburst. For Quine, "Murder is wrong" expresses a **socially conditioned disposition**, deeply ingrained through upbringing and cultural transmission. It's a learned *response pattern* tied to complex social norms and expectations, not just a raw feeling. It has normative force within the community. While it *involves* affect and motivation, it's not *reducible* to a simple exclamation.

  5.  **"And his conclusion was that we should stop treating morality as if it's a domain of genuine inquiry; it's just a holdover from pre-scientific thinking that a mature naturalism leaves behind."**
      *   **Mostly Wrong:** **Quine did *not* advocate abandoning moral discourse or treating it as a pre-scientific relic to be discarded.** His naturalism led him to conclude that ethics *cannot be a natural science*. It lacks the systematic empirical testability and theoretical structure of physics or biology. However, this does *not* mean it's unimportant, irrational, or should be eliminated.
      *   **Quine's Pragmatic Acceptance:** Quine viewed morality as:
          *   **Essential for Society:** A necessary, practical framework for human social life, evolved and culturally refined to promote survival and cooperation.
          *   **A Legitimate Subject of Study (for Anthropology/Psychology):** Moral beliefs and behaviors are perfectly valid objects of scientific *investigation* by anthropology, psychology, sociology, and history. We can study *how* moral norms arise, how they function, how they vary.
          *   **Not a Domain for *Scientific Truth*:** There is no "moral science" that discovers objective moral facts in the way physics discovers physical laws. Moral deliberation is not analogous to scientific inquiry aiming at empirical truth about the external world. It's more about the adjustment of desires, the clarification of values within a cultural framework, and practical reasoning about social coordination.
          *   **Subject to Reason (within its domain):** While not scientific, moral discourse isn't irrational. We reason morally by appealing to consistency, consequences, coherence with other values, and fundamental (culturally ingrained) principles. Quine wouldn't dismiss this reasoning; he just denies it yields *scientific knowledge*.
          *   **"Inculcated," Not Abandoned:** His point wasn't to leave morality behind, but to understand its *naturalistic origins* – how it is "inculcated" (taught, conditioned) within human societies. The mature naturalist recognizes ethics for what it is: a vital, non-scientific part of the human behavioral repertoire.

  **The Bottom Line:**

  *   **Does Quine think moral claims are non-cognitive expressions?** Yes, in the specific sense that they don't describe mind-independent facts like scientific claims. But no, not in the simplistic "boo/hooray" emotivist sense; they express complex, socially conditioned dispositions.
  *   **Does he think they are meaningless?** **Absolutely not.** This directly contradicts his rejection of verificationism and his holism.
  *   **Does he advocate abandoning moral discourse for science?** **No.** He argues that ethics is fundamentally *different* from natural science – it's not a *branch* of science – but it remains a crucial, rational (in its own way), and indispensable part of human social existence. A mature naturalist understands its natural origins and function but continues to engage in moral life and reasoning within that framework. Science can *study* morality, but it cannot *replace* it or provide its foundation in the way it provides foundations for physics.

  **In short:** Your friend wrongly attributes verificationism to Quine and then draws crude emotivist and eliminativist conclusions that Quine explicitly rejected. Quine's naturalism about ethics is deflationary regarding its *epistemological status* compared to science, but it is not dismissive of its *social importance and reality*. He sought a naturalistic *explanation* of ethics, not its *elimination*.

  **Where to Look:** Quine's most direct statements on ethics are in essays like "On the Nature of Moral Values" (in *Theories and Things*) and brief discussions in *Word and Object* and *Pursuit of Truth*. Key concepts are "constitutions," "inculcation," and the distinction between the "genetic" (how values arise) and the "normative" (reasoning about values).
