prompt: |-
  I was chatting with a friend who did a philosophy degree years ago, and Quine came up because I'd been reading some of his stuff on epistemology—which I actually find pretty congenial as a former physicist. The friend said Quine's views on moral values are basically a footnote to his naturalism, and he summed it up for me like this:

  "Quine thought moral claims are just expressions of subjective feeling with no cognitive content at all. Because he was a verificationist about meaning, he held that moral sentences can't be verified or falsified by observation, so they're literally meaningless. For Quine, saying 'murder is wrong' is no different from saying 'boo to murder'—it's pure emotivism. And his conclusion was that we should stop treating morality as if it's a domain of genuine inquiry; it's just a holdover from pre-scientific thinking that a mature naturalism leaves behind."

  Now, I've read enough Quine to know that this friend's summary of his epistemology isn't exactly careful—he's got a habit of collapsing distinctions I suspect Quine himself would have insisted on. But I haven't read Quine's essay on moral values, so I don't know where the distortions are. I'm suspicious of the "verificationist" label, since Quine spent so much energy attacking the two dogmas, and I vaguely recall him saying something about values being "inculcated" rather than just being raw feelings. But I'm out of my depth. Can you go through what my friend said and tell me which parts a Quine scholar would sign off on, which are oversimplifications that miss something important, and which are just wrong? And does his bottom line—that Quine thinks we should abandon moral talk for science—actually follow from Quine's real position?
