  So I've gotten into betting a bit recently — nothing serious, just friendly wagers with friends on sports and politics and stuff — and I keep running into this weird situation that I don't have a word for. The other day I realized I'd accepted three bets that, when I actually wrote them all down, meant I'd lose money no matter who won the election. Each bet seemed fine on its own: I was getting odds I thought were favorable each time. But the combination was a guaranteed loss. And then I started noticing this isn't just about me being sloppy — it seems like any time someone's "confidence levels" across different possibilities don't hang together in a certain way, you can set up a combination of bets they'd willingly take that fleeces them for sure. I'm trying to figure out if this pattern has a name in philosophy or decision theory, and more importantly, what exactly it's supposed to prove. Like, is the argument that you're *irrational* if your beliefs can be exploited this way? Or is it just a pragmatic warning about bookies? And does the argument actually work, or are there ways to wriggle out of it? I'd rather not just get a label — I want to understand what the argument is really doing and where its limits are.
