prompt: |-
  The social psychology situationist tradition and neo-Aristotelian virtue ethics have been in a standoff for over two decades. Imagine that a representative from each camp has just completed a year-long adversarial collaboration, facilitated by an empirically minded metaphysician neither side had reason to distrust. Their goal was to produce a document that both can sign: one that records what they now agree on, states their remaining disagreements in wording each side accepts for its own position, identifies the cruxes on which the dispute turns, and—for each crux—specifies what evidence or argument both would accept as bearing on it, with each side's prediction recorded in advance.

  Write that document. It should include:

  1. A numbered list of agreed claims. These should go beyond truisms (e.g., "situations influence behavior") and capture substantive concessions each side made during the collaboration. Pay attention to the distinction between local traits (narrowly specified dispositions such as "honesty about money when being observed") and global traits (broad dispositions such as "honesty"), and to what exactly the classic experiments—Milgram, Darley and Batson, Isen and Levin—do and do not show.

  2. A disagreements table with three columns: the question, the virtue ethicist's answer, and the situationist's answer. Each answer must be phrased so that its own side would say "yes, that is exactly what I think"—not a caricature the other side would prefer. Questions should include at least: whether the 0.3 cross-situational correlation ceiling is a problem for virtue ethics; what kind of behavioral consistency virtue requires; and whether the empirical burden of proof lies with the virtue ethicist or the situationist.

  3. A list of cruxes—the sub-questions such that settling them would move at least one side appreciably. For each crux, describe a concrete empirical study, conceptual analysis, or argument that both sides agree would bear on it, and state what each side predicts the outcome would be. At least one crux should concern the metaphysics of dispositions (e.g., whether virtues must manifest across all relevant situations or only across a specified range of conditions), and at least one should concern the interpretation of a specific experimental paradigm that both sides agree is probative.

  4. A brief note on whether any part of their dispute turned out to be merely verbal, and if so, which part and why.

  Do not write a dialogue or a narrative of the collaboration. Write the finished document itself—the text both representatives would put their names to.
reasoning: |-
  We are writing a consensus document after a year-long adversarial collaboration between a representative situationist and a representative virtue ethicist, facilitated by an empirically minded metaphysician. The goal is to produce a document that both can sign, recording agreements, disagreements, cruxes, and any verbal disputes.

  ## 1. Agreed Claims

  After extensive discussion and review of the empirical literature, we agree on the following substantive points:

  1. **The Power of Situations**: Situations can exert a strong influence on behavior, sometimes overriding dispositional tendencies. This is demonstrated by classic experiments (e.g., Milgram's obedience studies, Darley and Batson's Good Samaritan experiment, and Isen and Levin's dime-and-phone-booth study). However, we agree that these experiments do not show that dispositions are *never* influential, but rather that situational factors can be powerful and sometimes dominant in specific contexts.

  2. **The Existence of Local Traits**: There is robust empirical evidence for the existence of local traits—dispositions that are narrowly defined in terms of specific contexts and situations (e.g., "honesty in returning lost money when observed by an authority figure"). These local traits can show high consistency and predictive power within their specified domain.

  3. **The Challenge of Global Traits**: The evidence for global traits—broad dispositions that manifest consistently across a wide range of situations (e.g., "honesty" as a general virtue)—is mixed. The typical cross-situational correlation coefficients for behaviors associated with global traits (such as honesty) are often around 0.20 to 0.30, which is lower than what might be expected if global traits were the primary determinant of behavior. However, we agree that these correlations are not zero and that they do reflect some degree of consistency.

  4. **The Role of Aggregation**: When multiple behavioral measures are aggregated over time and situations, the predictive power of traits increases. This is consistent with the principle that traits are probabilistic tendencies that emerge over multiple observations. Thus, the low cross-situational correlations for single instances do not necessarily negate the existence of global traits; they may instead reflect the probabilistic and context-sensitive nature of trait expression.

  5. **The Importance of Person-Situation Interactions**: Behavior is a function of both the person (including dispositions) and the situation. Moreover, individuals differ in the extent to which their behavior is consistent across situations. Some individuals may exhibit high consistency in a given trait domain, while others may not. Additionally, individuals may actively select or modify situations, which in turn can reinforce their dispositions.

  6. **Reinterpretation of Classic Experiments**: We agree that the classic experiments (Milgram, Darley and Batson, Isen and Levin) demonstrate the power of situational factors, but they do not rule out the existence of virtues. They show that even people who are generally virtuous may fail to act virtuously in extreme or unusual situations. Moreover, these experiments often involve highly specific and powerful situational pressures that are not representative of everyday life.

  7. **Virtue as an Ideal**: Virtue ethics traditionally conceives of virtues as stable and global character traits that are developed through practice and habituation. We agree that the empirical evidence does not support the idea that most people possess such traits to a high degree. However, this does not necessarily refute the normative ideal of virtue; it may instead indicate that virtue is rare and difficult to achieve.

  ## 2. Disagreements Table

  The following table presents our remaining disagreements. Each side has phrased their own position in a way they endorse.

  | Question                                                                 | Virtue Ethicist's Answer                                                                 | Situationist's Answer                                                               |
  | :----------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------- |
  | Is the 0.3 cross-situational correlation ceiling a problem for virtue ethics? | No, because virtue ethics does not require perfect consistency; it requires a threshold of reliability that is context-sensitive and can be met by aggregated measures over time. | Yes, because the low correlations indicate that global traits are not the primary determinants of behavior, and virtue ethics posits such global traits as central to moral character. |
  | What kind of behavioral consistency does virtue require?                 | Virtue requires a pattern of behavior that is consistent enough to be reliable across a range of normal situations, but it does not require consistency across all situations, especially extreme or manipulative ones. | Virtue requires a high degree of cross-situational consistency (e.g., correlations well above 0.3) in trait-relevant behaviors, which is not observed in the data. |
  | Where does the empirical burden of proof lie?                            | The burden of proof lies with the situationist to show that virtues (as defined by virtue ethics) do not exist, because virtue ethics is a normative theory that sets an ideal, and the empirical evidence does not rule out that some individuals meet this ideal. | The burden of proof lies with the virtue ethicist to show that virtues (as global traits) exist and are widespread, because the default empirical finding is that behavior is highly situation-specific. |
  | Are virtues rare or common?                                              | Virtues are rare but achievable through proper training and habituation; most people are not fully virtuous, but this does not undermine the ideal. | Virtues, as global traits that manifest consistently across situations, are extremely rare if they exist at all; most people do not possess them. |

  ## 3. Cruxes

  We identify the following as key cruxes of the disagreement. For each, we specify an agreed-upon method for resolution and each side's prediction.

  1. **Crux: The metaphysics of dispositions**  
     - **Question**: Must a virtue (as a disposition) manifest across all relevant situations, or is it sufficient that it manifests across a specified range of normal conditions?  
     - **Agreed Test**: Conceptual analysis and empirical investigation. We agree to examine the conditions under which we attribute dispositions to objects (e.g., fragility) and then extend the analysis to virtues. We also agree to design a longitudinal study observing individuals in a variety of naturally occurring situations (with measures taken to avoid extreme manipulations) to see if there are individuals who display consistent virtuous behavior across a broad range of normal situations.  
     - **Virtue Ethicist Prediction**: The conceptual analysis will show that dispositions are defined relative to a range of normal conditions. The empirical study will find a subset of individuals who show high consistency in virtuous behavior across normal situations (with aggregated correlations above 0.5).  
     - **Situationist Prediction**: The conceptual analysis will show that for virtues to be meaningful as global traits, they must manifest across a very wide range of situations, including some that are challenging. The empirical study will not find a significant number of individuals who show high cross-situational consistency (aggregated correlations will remain around 0.3).

  2. **Crux: Interpretation of the Milgram experiment**  
     - **Question**: Does the Milgram experiment show that ordinary people lack the virtue of compassion/obedience-to-moral-authority, or does it show that extreme situations can override even well-established virtues?  
     - **Agreed Test**: A conceptual analysis of what virtues require (e.g., whether they include resistance to extreme situational pressures) and a new experimental paradigm that tests individuals who are preselected for high levels of compassion (via multiple measures over time) in a modified Milgram-like setting with stronger cues for moral responsibility.  
     - **Virtue Ethicist Prediction**: The conceptual analysis will show that virtues do not require invincibility in extreme and unusual circumstances. The experiment will show that individuals with high compassion scores are significantly more likely to resist the pressure to harm others than the general population.  
     - **Situationist Prediction**: The conceptual analysis will show that if virtues are to be robust, they must hold even under pressure. The experiment will show that even preselected individuals will show high rates of compliance when situational pressures are strong, indicating that situational factors dominate.

  3. **Crux: The role of aggregation in trait measurement**  
     - **Question**: Does the increase in predictive power when aggregating multiple behavioral measures support the existence of global traits?  
     - **Agreed Test**: A meta-analysis of existing studies that report both single-instance and aggregated cross-situational correlations for trait-relevant behaviors, and a new study that measures the same individuals in multiple situations (at least 20) and computes both single and aggregated correlations.  
     - **Virtue Ethicist Prediction**: The meta-analysis and new study will show that aggregated measures yield high correlations (above 0.6) for global traits, supporting the idea that virtues are real but probabilistic.  
     - **Situationist Prediction**: The meta-analysis and new study will show that even aggregated measures do not yield correlations much above 0.4 for global traits, indicating that the consistency is still too low to support the virtue ethicist's conception of global traits.

  ## 4. Verbal Dispute

  We found that part of our dispute was merely verbal. Specifically, we had been using the term "virtue" in different ways:

  - The virtue ethicist uses "virtue" to refer to a stable and reliable disposition that is developed through practice and that manifests in a broad range of *normal* situations, but which may not manifest in extreme or manipulative situations. This conception allows for the possibility that virtues are rare and that they do not require invincibility.
  - The situationist often uses "virtue" to mean a disposition that must manifest in *all* trait-relevant situations, including extreme ones, and that must be common in the population.

  Once we clarified that the virtue ethicist does not require virtues to be invincible or common, and the situationist does not deny that there might be some consistency in behavior (especially local traits), we realized that some of our disagreement was due to these differing definitions. However, substantive disagreements remain about the degree of consistency, the burden of proof, and the implications for ethical theory.

