  I've been going back and forth on the knowing-how vs. knowing-that debate for years and I can't settle on a stable view. Give me your actual credence that intellectualism is right — that knowing how to do something just is knowing some proposition (or set of propositions) about how to do it. Don't just say "it's controversial" or give me both sides. I want a number and the decomposition. Break it down however you think makes sense, but at minimum I want to see: how much weight you put on the linguistic evidence (the way "know how" constructions work across languages), how much on the cognitive-science considerations (like whether motor skills seem to involve propositional knowledge), and how much on whether there's even a coherent notion of "non-propositional knowledge" available. Assign rough probabilities to each sub-question, show how you combine them, and then tell me which one your overall number is most sensitive to — i.e., if you could get a definitive answer on exactly one of these sub-questions, which would move your credence the most?
