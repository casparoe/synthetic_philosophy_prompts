  ## The Static Straitjacket: Why Lewis's Convention Theory Fails the Test of Change

  David Lewis's theory of convention, articulated in *Convention: A Philosophical Study*, offers a powerful and elegant account of how stable, self-sustaining patterns of behavior emerge to solve coordination problems. By modeling conventions as strict Nash equilibria in coordination games, underpinned by common knowledge of the regularity and the preferences for coordination, Lewis provides a compelling explanation for the *persistence* of norms like driving on the right, linguistic meaning, or rules of etiquette. **However, this very elegance becomes its fatal flaw when confronted with the dynamic reality of social life: Lewis's theory is fundamentally incapable of explaining how norms *change*. This incapacity is not a minor oversight but a symptom that the theory is built upon a fundamentally static picture of social life, mistaking frozen equilibrium snapshots for the living, breathing process of normativity itself.**

  **The Core of Lewis's Theory and its Static Nature:**

  1.  **Equilibrium as Essence:** For Lewis, a convention *is* a regularity R in behavior where:
      *   Everyone conforms to R.
      *   Everyone *expects* everyone else to conform to R.
      *   Everyone *prefers* to conform to R *if* (almost) everyone else does (it's a coordination equilibrium).
      *   There are alternative possible regularities (R', R'', etc.) that *could* have served the same coordination purpose.
      *   This state of affairs is *common knowledge* among the population.
  2.  **The Role of Precedent & Past Conformity:** Lewis *does* acknowledge the role of precedent. Past conformity creates expectations about future behavior. People follow R partly because they see that others *have* followed R in the past, and they expect this pattern to continue. This historical weight helps select one equilibrium over possible alternatives.

  **Why Norm Change is the Achilles' Heel:**

  The fatal problem arises precisely when the "precedent" becomes contested and the common knowledge shatters – during periods of *norm transition*. Lewis's framework struggles even to *describe* this state, let alone explain it:

  1.  **The Impossibility of "Partial Equilibrium" or "Transitional Convention":** During a norm shift (e.g., from "Dear Sir/Madam" to "Hi [First Name]" in emails, or evolving dating norms), there is *no single regularity R* that everyone follows. Some cling to the old norm, some pioneer the new, many engage in strategic ambiguity or hedging. Crucially, **there is no stable equilibrium state during this period.** People are *not* playing a pure coordination game with shared expectations. They are navigating uncertainty, conflicting signals, and potentially conflicting preferences about *which* norm *should* prevail. Lewis's theory requires a single, universally recognized regularity as the focal point – a condition manifestly absent in flux.
  2.  **The Collapse of Common Knowledge:** Common knowledge is the bedrock of Lewisian convention. During transition, this bedrock crumbles. People *know* others aren't all conforming to the old norm. They *suspect* others might be adopting a new one, but they lack certainty about *what* it is or *how widely* it's accepted. They are unsure what others expect *them* to do, or what others expect others to expect. The pervasive uncertainty and lack of a shared focal point make Lewis's common knowledge requirement inapplicable. How can there be common knowledge about R when R itself is disputed and unstable?
  3.  **Precedent's Double-Edged Sword:** Lewis relies on precedent to stabilize conventions. But during change, precedent becomes a source of *conflict*, not stability. Proponents of the old norm cite long-standing precedent. Advocates for the new norm argue that precedent is outdated or that *new* precedents are being set. Lewis's framework lacks the resources to explain how the force of precedent is overcome or how *new* precedent gains traction *before* a new equilibrium is established. The theory depicts precedent as a conservative force locking in an equilibrium, not as a dynamic element in a contested process.
  4.  **The Misdiagnosis of Motivation:** Lewis assumes conformity is driven purely by the preference to coordinate *given expectations about others' behavior*. During norm change, motivations are far more complex and often *precede* clear expectations:
      *   People may adopt a new practice out of *principle* or *protest* against the old norm, even if they fear non-coordination.
      *   Actors may imitate perceived *influencers* or *trendsetters*, not based on expectations of universal conformity.
      *   Strategic actors might deliberately flout the old norm to *create* a new precedent or signal affiliation with a changing group.
      *   Ambiguity itself becomes a strategy to navigate uncertainty, not a failure to coordinate. Lewis's rational-choice focus on coordination payoffs struggles to capture these diverse, often non-coordination-centric drivers of *change initiation*.

  **Therefore, Lewis's theory cannot explain the *process* of change.** It can only describe a population magically teleporting from Equilibrium A to Equilibrium B. It has no account of the messy, uncertain, often conflictual period *between* equilibria where the new norm is forged. A theory that can only explain the frozen states of normativity but not its liquid transitions fails as a comprehensive theory of social convention.

  **Anticipating and Responding to Objections:**

  *   **Objection 1: "Lewis *does* allow for change! Gradual shifts in precedent can nudge expectations until a tipping point is reached and a new equilibrium emerges."**
      *   **Response:** This objection smuggles in dynamics Lewis's core model lacks. *How* does precedent shift gradually? What mechanism allows small deviations to accumulate *without* immediately violating the common knowledge and equilibrium conditions? Lewis's account of precedent is static: past conformity directly feeds current expectations of *continued* conformity. It struggles to explain why a *few* deviations wouldn't simply reinforce the expectation that others will still conform to the old norm (as defectors are seen as outliers). The "tipping point" itself is not modeled; it's an external event unexplained by the equilibrium conditions. The theory describes the *endpoints* but not the *path* between them.

  *   **Objection 2: "The transition period isn't a convention at all. It's just a breakdown until a new convention forms. Lewis's theory is only meant for stable conventions."**
      *   **Response:** This concedes the core criticism. If the theory can only describe stable states and dismisses the periods of change as mere "breakdown," it fails as a theory of *social norms in practice*, which are inherently dynamic. Crucially, **the transition period is not chaos; it's governed by *different* social logics** – contestation, persuasion, innovation, coalition-building, signaling – that Lewis's purely coordinative equilibrium model ignores. A theory of convention that excludes the processes of birth, evolution, and death of norms is profoundly incomplete. It reduces norms to fossils, not living practices.

  *   **Objection 3: "Isn't this a problem for *any* equilibrium-based theory of norms, not just Lewis's?"**
      *   **Response:** This is a significant point. Yes, *strict* Nash equilibrium models with common knowledge requirements inherently struggle with dynamics. However, Lewis's formulation is particularly vulnerable because:
          1.  Its reliance on *common knowledge* is extremely brittle in the face of uncertainty.
          2.  It explicitly defines conventions *as* equilibria, making the static nature constitutive.
          3.  Its focus on *pure coordination* problems overlooks the mixed-motive conflicts (e.g., between traditionalists and reformers) often driving change.
      *   While other equilibrium models (e.g., evolutionary game theory with noisy dynamics) *can* better model drift and path-dependence, they often still struggle with intentional norm entrepreneurship and the role of communication/argumentation central to many norm changes. The criticism highlights a limitation of the equilibrium *approach* in general, but Lewis provides the canonical and most philosophically influential version, making its shortcomings particularly salient for understanding the *nature* of convention as philosophers have sought to use it.

  **Conclusion: Frozen Equilibria vs. Living Norms**

  Lewis's theory of convention is a masterful analysis of social *stability*. However, its inability to grapple with norm change reveals it to be a theory of "frozen equilibria," not the fluid, contested, and evolving phenomena that social conventions truly are. By requiring universal conformity, common knowledge, and a shared preference for coordination based on expectations, the theory renders the messy, vital processes of normative transformation – where conformity is partial, knowledge is uncertain, preferences conflict, and actors strategically navigate ambiguity – theoretically invisible. Philosophers reaching for Lewis to explain language change, legal evolution, or shifting social mores are using a tool designed for static snapshots to analyze a moving picture. The failure is not just explanatory; it reveals the theory captures only a static artifact of normativity, not its dynamic essence. A genuine theory of convention must start not from equilibrium, but from the processes of negotiation, conflict, imitation, and innovation that constantly reshape our social world. Lewis gives us the end states; we need a theory that illuminates the journey.
