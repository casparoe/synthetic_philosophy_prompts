prompt: |-
  ok so I'm in a democratic theory seminar and we've been stuck on the boundary problem for two weeks (who should count as "the demos" for a given decision). My prof keeps making offhand rulings about who gets included, and I'm trying to reverse-engineer her principle before the final. So far she's said:

  - a long-term resident non-citizen should get to vote in local elections
  - a citizen living abroad permanently should still get to vote in national elections
  - tourists should not vote
  - ten-year-olds should not vote
  - prisoners should be able to vote
  - citizens of a neighboring country whose air is polluted by our factories should have some formal say in our environmental policy, but not a vote in our national elections
  - someone with severe dementia should get a proxy rather than being excluded outright

  The new case next week is a non-resident citizen who has never lived here, owns no property here, and says she has no intention of ever returning; she wants a vote in our national election. What will my prof say? I'm less interested in the bare yes/no then in the candidate principles that fit her rulings so far, which of her earlier calls each principle strains against, what each principle predicts for this new case, your best guess and why, and the further case (one she hasn't ruled on) that would best tell the leading principles apart.

  Structure the response in four titled sections: "Candidate rules" (~250 words), "Predictions for the new case" (~150 words), "Best guess" (~200 words), and "The telling further case" (~100 words).
reasoning: |-
  Okay, let me tackle this democratic theory puzzle. The user is in a seminar stuck on the boundary problem and needs to reverse-engineer their professor's principle before finals. The key is synthesizing the professor's specific rulings into coherent candidate principles that can predict the new case of the never-resident citizen.

  Looking at the professor's rulings, several patterns emerge. The inclusion of long-term resident non-citizens and permanent expats suggests residency isn't absolute. The exclusion of tourists and ten-year-olds points to meaningful connection and capacity considerations. Prisoner inclusion implies punishment shouldn't strip political rights, while the dementia proxy solution shows capacity limitations can be accommodated. The air pollution case is particularly telling - affected outsiders deserve input but not full voting rights, indicating "stake" matters but isn't sufficient alone.

  I'll develop three candidate principles that fit most rulings: 
  1) Stakeholder Principle (affected interests + autonomy), which explains the pollution case well but struggles with permanent expats who may have minimal stake. 
  2) Community Membership Principle (shared life/identity), which handles long-term residents but falters on non-resident citizens. 
  3) Capacity-Weighted Inclusion Principle (voice proportional to stake/capacity), which accommodates dementia proxies but might overextend to tourists.

  For the new case (never-resident citizen), each principle yields different predictions. Stakeholder would likely say no vote due to no concrete stake. Community Membership would say yes based on formal citizenship. Capacity-Weighted might say yes but with reduced weight.

  The professor's pattern of prioritizing concrete ties over formal status (e.g., resident non-citizens > non-resident citizens) suggests Stakeholder Principle as the best fit, predicting "no vote" for the never-resident. But the citizenship factor in permanent expat case creates tension. 

  The telling further case would be a non-resident citizen with concrete stake (e.g., inheriting property). Stakeholder would say include them, while Community Membership would already include them by default - creating the cleanest divergence point.
answer: |-
  ### Candidate Rules
  Three principles fit most rulings, each straining against one case:

  1.  **Stakeholder Principle:** Inclusion requires a significant, enduring stake in the decision's consequences *and* sufficient autonomy to form preferences. This fits:
      *   Long-term residents (impacted by local decisions).
      *   Permanent expats (still impacted by national decisions).
      *   Prisoners (impacted by laws).
      *   Pollution-affected neighbors (impacted, hence need "formal say").
      *   Dementia patients (have stake, addressed via proxy for autonomy).
      *   Excludes tourists (transient stake) and children (limited autonomy).
      *   **Strain:** Why include permanent expats who may have *minimal* concrete stake (e.g., no property, no intent to return) over affected neighbors? It overemphasizes formal citizenship for expats.

  2.  **Community Membership Principle:** Inclusion is based on belonging to the political community defined by shared life, identity, or reciprocal obligations, not just formal status. This fits:
      *   Long-term residents (integrated into local community).
      *   Permanent expats (retain formal citizenship, often cultural ties).
      *   Prisoners (remain members).
      *   Excludes tourists (not members), children (not full members), and affected neighbors (members of a different polity).
      *   **Strain:** Why give pollution-affected neighbors *any* formal say? They aren't members. This principle struggles to explain that ruling, requiring an ad hoc "significant harm" exception.

  3.  **Capacity-Weighted Inclusion Principle:** The *right* to participate stems from being subject to authority (all-subjected principle), but the *form* of participation (e.g., full vote, proxy, consultative say) is weighted by cognitive capacity and the nature/duration of the stake. This fits:
      *   Long-term residents & permanent expats (subject to authority, full vote).
      *   Prisoners (subject, full vote).
      *   Affected neighbors (subject to cross-border harm, hence consultative say).
      *   Dementia patients (subject, proxy for capacity).
      *   Excludes tourists (briefly subject, minimal stake) and children (subject but lack capacity).
      *   **Strain:** Can blur lines. Why is a tourist's stake too brief, but an expat's enduring? Requires careful calibration of "subjected" and "stake duration."

  ### Predictions for the New Case
  *   **Stakeholder Principle:** Predicts **NO**. The non-resident citizen has no concrete stake (no residence, property, or intent to return). Her citizenship is formal, but the principle emphasizes tangible impact, which she lacks. This strains only if the prof views citizenship *itself* as a sufficient stake (contrary to expat ruling implying ongoing impact).
  *   **Community Membership Principle:** Predicts **YES**. Formal citizenship defines core membership, regardless of residence or intent. This aligns perfectly with including permanent expats. The only strain is if "never lived here" negates *meaningful* membership, but citizenship is usually the bright line.
  *   **Capacity-Weighted Inclusion Principle:** Predicts **NO** (or limited say). While formally subject to national laws, the *nature* of her stake is highly abstract and non-enduring (no residency/property/return intent), likely falling below the threshold for a full vote. Similar to excluding tourists based on transient stake, hers is effectively non-existent.

  ### Best Guess
  I predict the professor will rule **NO**, the non-resident citizen should *not* get a vote. The **Stakeholder Principle** is the strongest fit overall, despite straining slightly on the permanent expat case.

  *   **Why Stakeholder?** It best explains the *differences* in her rulings: concrete impact justifies inclusion for long-term residents and prisoners, while its absence justifies excluding tourists and children. The "formal say" for polluted neighbors explicitly invokes stake/impact without full membership. The dementia proxy preserves voice where stake exists but capacity is impaired.
  *   **Why NO?** This new case lacks the concrete, enduring stake present in the included groups (long-term residents, expats presumably impacted by laws/policies, prisoners). Her citizenship is purely formal, analogous to the pollution neighbors' lack of formal membership. The expat ruling likely assumes *some* residual stake (e.g., family, future plans, cultural identity), which this citizen explicitly disavows.
  *   **Tension:** This relies on interpreting the permanent expat ruling as implying they *do* retain a significant stake (e.g., taxation, family ties, potential return), which this citizen lacks. If the prof views citizenship *alone* as sufficient for expats, the Community Principle would fit better, but that clashes more severely with the pollution neighbors' case.

  ### The Telling Further Case
  **Case:** A citizen who permanently resides in a foreign country but *inherits significant, taxable property* in the home nation. They have no other ties and no intent to return.

  *   **Stakeholder Principle:** Predicts **YES** (vote). They have a *major, concrete, enduring stake* through the property/taxes, meeting the core criterion.
  *   **Community Membership Principle:** Predicts **YES** (vote). Citizenship defines membership, regardless of property.
  *   **Capacity-Weighted:** Predicts **YES** (vote). Significant property creates a direct, enduring stake subject to state authority.
  *   **Divergence:** This cleanly separates Stakeholder/Capacity-Weighted (Yes, due to stake) from the professor's likely ruling on the *stake-less* non-resident citizen (No). It also tests if concrete stake can override lack of residence under Stakeholder.
