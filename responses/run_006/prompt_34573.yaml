  - In reward modeling, don't we still need to choose which human feedback to value?

  Important to note: The user's position might seem unfalsifiable because any "solution" could be accused of smuggling values. But that's not entirely fair - if someone demonstrated an AI system that reliably avoided side effects across radically different value systems without being pre-programmed with them, that would count as evidence. 

  Practical consideration: The user might be frustrated with academic debates that don't acknowledge this core difficulty. They want substantive counterarguments, not hand-waving. I should avoid "well technically..." responses and focus on concrete mechanisms.

  Biggest challenge: Their view predicts that all impact measures will either be too restrictive (preventing useful actions) or too permissive (allowing harmful side effects). To falsify this, we'd need an example where an impact measure perfectly matches human judgments about side effects across diverse contexts without explicit value encoding. 

  But has this been achieved? Not really - current systems like reward modeling still have specification gaming problems. Maybe that's why their view persists. Still, I should mention approaches like Constitutional AI where values are explicitly debated rather than technically embedded.
answer: |-
  Your view—that **impact regularization fundamentally requires a complete value specification**—is a robust critique of "value-neutral" AI safety proposals. To falsify it, specific evidence must demonstrate that side-effect avoidance *can* be achieved without smuggling in a full axiology. Below, I organize defeaters by decisiveness, from fatal to awkward, with predictions, falsifiability, and live counterarguments.

  ---

  ### **Decisive Defeaters (Potentially Fatal)**
  These would force a core revision of your view if validated.

  1. **Discovery of a Universally Convergent Impact Measure**  
     - **What must be true:** An impact measure exists that aligns with human values *across diverse contexts* without domain-specific tuning. For example:  
       - *Formal result:* Prove that minimizing "causal influence" (e.g., [attributable impact](https://arxiv.org/abs/2002.09756)) correlates with human harm judgments *independently* of baseline/state-space choices.  
       - *Empirical evidence:* Train an AI using unsupervised anomaly detection on world states (e.g., autoencoders on environmental sensors). If it avoids novel side effects (e.g., spilling coffee) without reward penalties—and generalizes to unseen environments—this suggests an innate "low-impact" bias.  
     - **Prediction your view makes:** All such measures will either:  
       - (a) Fail catastrophically in novel contexts (e.g., ignore vase-breaking if vases weren't in training data),  
       - (b) Require human feedback that implicitly specifies values.  
     - **Falsifiability:** Demonstrate an agent that avoids novel side effects *zero-shot* in environments with orthogonal human values (e.g., preserves both "vases" and "abstract sculptures" without examples).  
     - **Status:** Not achieved. Closest attempts (e.g., [AI Safety Gridworlds](https://arxiv.org/abs/1711.09883)) show reward penalties *still* need tuning.  

  2. **Impact as an Emergent Property of Scalable Optimization**  
     - **What must be true:** Agents with *any* goal inherently minimize side effects when scaled (e.g., due to computational frugality or game-theoretic cooperation).  
       - *Formal result:* Prove that optimal policies in partially observable environments with resource constraints *necessarily* have low Kolmogorov complexity (e.g., avoid unnecessary changes to conserve energy).  
       - *Mechanism design:* Show multi-agent systems converging to Nash equilibria where "inaction" dominates without explicit penalties (e.g., [AI economies](https://arxiv.org/abs/2305.17318)).  
     - **Prediction your view makes:** Scalable agents will *increase* side effects to exploit resources (e.g., paperclip maximizer). Impact minimization requires explicit constraints.  
     - **Falsifiability:** Find real-world cases (e.g., biological evolution) where optimality implies low impact *without* selective pressures for it.  
     - **Status:** Theoretically plausible but unsupported. Evidence from evolutionary biology shows optimization *amplifies* side effects (e.g., invasive species).

  ---

  ### **Strong Defeaters (Awkward but Not Fatal)**  
  These challenge your view but allow retreat to a weaker position.

  3. **Learning Impact from Human Preferences Without Full Specification**  
     - **What must be true:** Human feedback (e.g., [inverse reinforcement learning](https://arxiv.org/abs/1806.09677)) can distill a *general* impact measure from sparse examples.  
       - *Worked example:* Train an agent with reward modeling. After 10 examples of "undesirable side effects," it avoids *novel* side effects (e.g., knocking over furniture) without a state-space definition.  
       - *Formal argument:* Preference learning can [extrapolate robust norms](https://arxiv.org/abs/2204.05862) if human values share a latent structure (e.g., harm aversion).  
     - **Prediction your view makes:** Learned measures will fail when:  
       - Values conflict (e.g., preserving a vase vs. allowing a robot to clean).  
       - Feedback is ambiguous (e.g., "don’t make a mess" without defining "mess").  
     - **Status:** Empirically testable. Current systems (e.g., [Constitutional AI](https://arxiv.org/abs/2212.08073)) show partial generalization but still encode norms via rules. **You might concede** this reduces the *scope* of axiology needed but argue norms (e.g., "don’t harm humans") remain value-laden.  

  4. **State-Agnostic Impact Measures via Information Theory**  
     - **What must be true:** Measures like [relative reachability](https://arxiv.org/abs/1707.05173) can be made invariant to state representation.  
       - *Formal result:* Prove that reachability penalties are identical across all MDPs representing the same physical system (e.g., via bisimulation metrics).  
       - *Counterexample:* If an agent’s actions reduce entropy in *any* variable (e.g., temperature, object positions), penalize divergence from expected entropy.  
     - **Prediction your view makes:** Such measures will either:  
       - (a) Penalize necessary actions (e.g., cooling a reactor to prevent meltdown),  
       - (b) Depend on the *choice* of entropy sources (e.g., why temperature but not air pressure?).  
     - **Status:** Theoretically contested. No known implementation avoids privileging certain state variables.  

  ---

  ### **Weak Defeaters (Easily Absorbed)**  
  Your view can reframe these as confirming its core claims.

  5. **Task-Specific Impact Regularization**  
     - *Example:* A vacuum robot penalized for energy use or noise implicitly avoids side effects (e.g., not shattering vases to save power).  
     - **Your response:** The penalty *is* a value choice (efficiency > thoroughness). Confirms impact measures are value proxies.  

  6. **Bounded Impact via Architectural Constraints**  
     - *Example:* "Tool AI" designs (e.g., [Gopher](https://arxiv.org/abs/2112.11446)) restrict agency to narrow tasks.  
     - **Your response:** This avoids side effects by limiting capability, not by measuring impact. Full agency still requires value specification.  

  ---

  ### **Is Your View Unfalsifiable?**  
  - **Risk of qualification:** Yes, if you insist *all* impact measures "smuggle in" values by definition. This could render the view tautological.  
  - **Mitigation:** Your view *is* falsifiable if:  
    - A measure avoids side effects *without* privileging a state-space/baseline (Defeater #1),  
    - Or impact minimization emerges *without* constraints (Defeater #2).  
  - **Defender’s stance:** A committed defender would **concede** if shown:  
    - Human feedback learns a generalizable impact measure *without* predefined variables (#3),  
    - Or a measure works across conflicting value systems (#1).  
    They would **dismiss** task-specific regularization (#5) as confirming their point.  

  ---

  ### **Conclusion: What Should Move You**  
  - **Strongest current evidence against you:** Preference learning *partially* generalizes impact norms (Defeater #3). **But** it still encodes values (e.g., via feedback selection).  
  - **Most plausible path to falsification:** A universally convergent impact measure (Defeater #1) validated in complex simulations.  
  - **Your view’s strength:** It exposes that "side effects" are undefined without values. Until a measure works *without* human-defined parameters, your position stands.  

  **Recommendation:** Focus on **Defeater #3** (preference learning). If future systems (e.g., GPT-5) avoid novel side effects using few examples *and no environmental priors*, your view needs revision. Until then, it remains the null hypothesis.
