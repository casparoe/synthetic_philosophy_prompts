answer: |-
  ## The Glue That Binds the Glue

  The apple and its red are bound as one.
  The stone is hard, the water cold and wet.
  **These two are one**, the simple truth is spun.
  But look! That binding's work is just begun –
  What holds the redness to the apple? Yet...
  **But what connects them?** What is overrun?

  The first adhesive, sticky, swift is run
  To paste the hue to flesh where they are set.
  **These two are one**, the simple truth is spun.
  Yet this new glue gleams sudden in the sun –
  A thing itself, demanding glue, you bet...
  **But what connects them?** What is overrun?

  For glue to glue, its sticking must be done!
  A second bond, a fixative is met.
  **These two are one**, the simple truth is spun.
  But see that fixative? It comes undone!
  It too requires a paste – an endless debt...
  **But what connects them?** What is overrun?

  How many bonds? How many, stacked and strung?
  The layers thicken, tangled, deeper set.
  **These two are one**, the simple truth is spun.
  **But what connects them?** What is overrun?

  ---

  **Form as Trap:**  
  This villanelle enacts Bradley's Regress through its strict, recursive form:
  1.  **Refrains as Voices:** The alternating refrains embody the core conflict: the assertion of unity ("These two are one") vs. the demand for connection ("But what connects them?"). Each repetition deepens the tension.
  2.  **Rhyme Scheme Entrapment:** The A/B/A rhyme pattern (one/wet/sun, spun/run/undone, etc.) creates a sonic loop, echoing the conceptual loop. The rhymes feel necessary, binding, yet ultimately unresolved, mirroring the futile search for grounding glue.
  3.  **Inescapable Cycle:** The final stanza *must* contain both refrains, locking the poem into its own insoluble knot. Ending with the question "But what connects them?" leaves the regress actively unresolved, lingering after the words stop.
  4.  **Progression of Absurdity:** The stanzas escalate the "glue" metaphor (first adhesive, fixative, paste, layers), becoming increasingly absurd yet logically demanded by the premise, mimicking the regress itself.
  5.  **Feeling of Perpetuity:** The cyclical repetition and unresolved ending create the sensation that the argument could continue indefinitely, even as the poem formally concludes. The rhyme and refrain structure *is* the glue holding the poem together... and demanding its own explanation.
