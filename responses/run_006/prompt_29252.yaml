prompt: |-
  I'm a PhD student in philosophy of mind and I keep going in circles on the distribution question — which animals are conscious and which aren't, and what kind of consciousness they have if they have it. The thing is, before I even evaluate the theories (integrated information, global workspace, higher-order thought, the various neurobiological criteria people like Feinberg and Mallatt propose, etc.), I want to know what the theories are supposed to get right in the first place. So: write me the desiderata. What does an adequate theory of the distribution of consciousness across animals have to deliver? I mean the cases it has to handle correctly (or at least not rule out absurdly), the distinctions it can't collapse — like the difference between having any consciousness at all and having a specific kind of consciousness, or between sentience and sapience — the empirical findings from comparative neurobiology and ethology it can't contradict, and any conceptual constraints like avoiding epiphenominalism or respecting the gradualism that evolution suggests. For each one, say why it's a requirement and whether it's non-negotiable or more like a preference of one camp. And then tell me which single desideratum knocks out the most otherwise-reasonable theories — the one that does the heaviest filtering.

  No formatting please — just continuous prose like an email, no headings, no bullets, no bold, no tables. American English.
