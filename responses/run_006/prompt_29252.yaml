  The heaviest-hitting desideratum? Probably neuroevolutionary gradualism. It sinks theories relying on human-specific structures (like cortex-dependent HOT) while forcing others into awkward contortions. It's non-negotiable for biologically plausible accounts but often treated as negotiable by theorists who prioritize conceptual neatness. 

