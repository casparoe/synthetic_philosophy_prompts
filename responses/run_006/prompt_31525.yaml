answer: |-
  Hey, so I've been thinking about your friend's verdicts and the pattern she's following. It seems like she's generally aligned with a Bayesian updating approach where individuals use all available information—both the observed choices of prior individuals and any known private signals—to update their beliefs about which restaurant is better. But the twist is how she incorporates known signals, especially when they contradict the observed choices. Let me walk through what I think her underlying rule is, how it applies to the case you're stuck on, and suggest a further case to pin it down.

  First, her rule appears to be: **Update the posterior probability of A or B being better using all known private signals (whether inferred from choices or directly revealed) and your own signal, then choose the option with the highest posterior probability. In case of a tie in the posterior, follow your own private signal.**

  This explains her verdicts:
  - With one A ahead and your signal B: She infers that the first person's signal was A (since they followed it), so you have one signal A and your own B. That's a tie in the evidence (both signals are 60% reliable, so equal weight), so she breaks the tie by following your signal (B).
  - With two As ahead and your signal B: She infers two signals for A (from the choices), so two As vs. your B. Two As give a posterior favoring A (about 69% chance A is better), so she overrides your signal and picks A.
  - With ten As ahead and your signal B: Same logic—many inferred A signals dominate, so pick A.
  - With one A and one B ahead and your signal B: She infers one signal A and one B from the choices, plus your B. That's two Bs vs. one A, so posterior favors B, and she picks B.
  - With two As ahead but the second had no signal (just copied): Only the first choice reveals a signal (A), so you have one inferred A signal vs. your B. Tie again, so she follows your signal and picks B.

  Now, for the case where three people picked A, you know the third's private signal was B (but they ignored it and chose A), and your signal is B. Applying her rule:
  - Person 1 chose A → infer their signal was A.
  - Person 2 chose A → infer their signal was A (because if they had B, they'd have picked B in a tie, as in verdict 1).
  - Person 3's signal is known to be B (directly revealed, not inferred).
  - Your signal is B.
  - So total signals: two As (from persons 1 and 2) and two Bs (from person 3 and you).
  - Compute the posteriors:  
    - P(θ=A | signals) ∝ P(signals | θ=A) × P(θ=A) = (0.6 for A)² × (0.4 for B)² × 0.5 = 0.36 × 0.16 × 0.5 = 0.0288  
    - P(θ=B | signals) ∝ P(signals | θ=B) × P(θ=B) = (0.4 for A)² × (0.6 for B)² × 0.5 = 0.16 × 0.36 × 0.5 = 0.0288  
  - Unnormalized posteriors are equal (0.0288 each), so normalized posteriors are both 0.5—a tie.
  - By her tie-breaking rule (follow your own signal), she should pick B.

  But she might be hesitant because three choices of A *seem* overwhelming, but her rule doesn't weight choices—it weights signals. Knowing the third signal was B breaks the cascade's illusion and reduces it to a tie between two A signals and two B signals. Consistency with her other tie cases (one A ahead, or one A and one B ahead) demands she picks B here.

  To confirm her true rule, test this further case: **Suppose two people ahead: the first chose A, and the second chose B. But you know the second's private signal was actually A (they picked B anyway, perhaps randomly). Your own signal is B. What does she say?**
  - Under her rule:  
    - Person 1 chose A → infer signal A.  
    - Person 2's signal is known to be A (directly revealed).  
    - Your signal is B.  
    - Total signals: two As (persons 1 and 2) vs. one B (yours).  
    - Posteriors: P(θ=A) ≈ 60%, P(θ=B) ≈ 40% (calculation similar to the two-A case but with signals A,A,B).  
    - So she should pick A, overriding your B signal.  
  - If she instead says pick B, she might be ignoring known signals and only using choices to infer signals (i.e., she'd infer person 2's signal was B from their choice, leading to one A and two Bs overall). But that would contradict verdict 5, where she used the "no signal" info to disregard a choice. If she picks A here, it confirms she's updating with all known signals, even if choices contradict them.

  My best guess is she's running the "update with all known signals + tie-break to own signal" rule, so she should say pick B in your three-A case. But if she wavers, this further case will force a clear answer—it pits signal-based updating against choice-based inference directly. Hope this helps unravel the debate!
