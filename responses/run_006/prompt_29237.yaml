answer: |-
  You've hit on one of the most persistent tensions in bioethics. Your intuition about the apparent clarity of the biostatistical approach (BSA) is well-founded, but its limitations explain why philosophers find the therapy/enhancement distinction intractable. Let's dissect the core objections:

  ### 1. **The Normative Vacuum Problem of "Normal"**
     - **The Is/Ought Gap**: BSA defines "normal function" statistically (what *is*), but therapy/enhancement distinctions are invoked for moral/regulatory purposes (what *ought* to be permitted/subsidized). There's no inherent reason why restoring statistical normality is morally privileged *per se*.
       - *Example*: Is correcting congenital deafness to "normal" hearing inherently more ethical than enhancing hearing to detect ultrasonic frequencies? The moral value depends on contested notions of well-being, identity, and social accommodation—not statistics.
     - **Reference Class Arbitrariness**: Defining the "appropriate reference class" (age, sex, species, era?) requires normative judgments. Is a 65-year-old's declining memory "normal aging" (not a disease) or "early dementia" (therapy-worthy)? This isn't resolvable empirically.

  ### 2. **Problematic Conflation of "Normal" with "Good"**
     - **High-Functioning Variations**: Many statistically atypical traits (e.g., superior memory, high pain tolerance) are desirable. Classifying interventions to *achieve* these as "enhancements" doesn't imply they're unethical.
     - **Disability Critiques**: BSA risks pathologizing benign human variations (e.g., autism, dwarfism) by labeling them "subnormal functioning." This frames disability purely as individual deficit rather than social construct.

  ### 3. **The Instability of "Species-Typical Functioning"**
     - **Evolutionary Mismatch**: "Typical functioning" evolves. Myopia was statistically rare in pre-literate societies but is now common. Is correcting it therapy or enhancement? BSA can't answer this normatively.
     - **Technological Mediation**: Eyeglasses were once "enhancements" but are now normal. Future genetic edits for disease resistance might follow the same path. The boundary shifts with technological adoption.

  ### 4. **Moral Irrelevance of the Distinction (Even If Clear)**
     - **The "Moral Weight" Objection**: Suppose we cleanly define "normal function." Why should crossing this threshold matter morally? Consider:
       - *Restoration ≠ Obligatory*: Cosmetic surgery post-mastectomy (therapy) isn't more obligatory than limb-lengthening for cosmetic reasons (enhancement).
       - *Enhancement ≠ Wrong*: Vaccines enhance immune function beyond "normal"—yet are ethically uncontroversial.
     - **Justice Concerns**: Prioritizing "therapy" over "enhancement" can exacerbate inequality. Denying ADHD medication to a high-functioning student who wants cognitive enhancement (to compete with peers using modafinil) may be less just than universal access.

  ### 5. **Epistemic Challenges in Practice**
     - **Continuous Traits**: Many traits exist on spectrums (height, mood, attention). Where do we set the "normal" cutoff for short stature or dysthymia? These thresholds are inherently value-laden (e.g., what level of shortness justifies HGH?).
     - **Multifactorial Traits**: Is giving SSRIs to someone with "mild dysthymia" therapy if their serotonin levels are within population norms but suboptimal *for them*? BSA struggles with individual variation.

  ### Why Philosophers Lean Toward Instability/Unhelpfulness
  - **Normative Grounding Failure**: BSA can't resolve *why* restoring statistical normality deserves priority. As Daniels (2000) argued, its value derives from preserving "opportunity range"—but this shifts the debate to theories of justice, not statistics.
  - **Anti-Essentialism**: Post-Boorse critiques (e.g., from Wakefield, Nordenfelt) argue that "disease" requires a *harm* component. A statistically subnormal trait (e.g., albinism) isn't a disease if not harmful in context.
  - **Technological Slippery Slope**: Predictive biomarkers blur lines. Is giving Alzheimer's drugs to asymptomatic people with amyloid plaques "preventive therapy" or "cognitive enhancement"? BSA offers no guidance.

  ### Your Cases Revisited
  - **Short-stature HGH**: Is the reference class "healthy children" or "children with idiopathic short stature"? The choice isn't empirical—it's about whether we value height socially.
  - **Modafinil for students**: If "normal" attention varies widely, is exceeding one's baseline enhancement? This pathologizes human variability.
  - **Mild dysthymia**: Is this a subclinical disease or normal human mood variation? The DSM cutoff is negotiated by experts, not discovered in nature.

  ### Conclusion: It's Both Problems
  Philosophers argue that **the boundary is empirically unresolvable without normative input** (problem 1–3), and **even a clean boundary lacks inherent moral significance** (problem 4). The deeper worry is that using "therapy vs. enhancement" as a moral heuristic:
  - Distracts from substantive ethical questions (safety, coercion, justice, identity)
  - Risks unjustly medicalizing diversity
  - Obscures how technology redefines "normal"

  Your instinct that better empirical specs *could* clarify *descriptive* boundaries is correct—but the normative work remains untouched. This is why many now advocate context-specific analyses (e.g., "What values are at stake in *this* use case?") rather than reifying the distinction.

  #### Key References for Your Dive:
  - **Critiques of BSA**: Engelhardt (1974), Kingma (2007), Ereshefsky (2009)
  - **Normative Uselessness**: Harris (2007), Sparrow (2019)
  - **Constructive Alternatives**: Parens (1998), Juengst (1998), Schermer (2008) on "enhancement ethics" frameworks

  Would you like deeper engagement with any particular argument or case study? This is exactly the kind of conceptual thicket where PhDs make their mark!
