prompt: |-
  i'm a phd student in moral philosophy, and a friend in the department who works on blame sent me his one-paragraph gloss of the standing-to-blame literature to sanity-check before he puts it in a handbook chapter. here's the gloss:

  "The debate about standing to blame is about whether a hypocrite has the right to blame. The standard view says blame is a speech-act-like practice that requires authority, and someone who commits the very wrong she is blaming others for forfeits that authority, so her blame isn't just rude, it's void. The person being blamed is then entitled to dismiss the criticism entirely, since a blamer without standing has no right to make the accusation at all. This is usually presented as a point about the blamer rather than about whether the target really did wrong, which is why critics say the whole view is an elaborate way of letting wrongdoers off the hook."

  I have a nagging sense that something's off — i remember someone in a seminar saying the target's blameworthiness is supposed to be untouched by all this — but i can't tell which parts are the mainstream view and which are his own spin. Could you go through it sentence by sentence and tell me what a defender of a standing condition would accept, what they'd wince at, and whether the final sentence follows from anything the defender actually says?
reasoning: |-
  Okay, the user is a PhD student in moral philosophy who needs help evaluating their friend's summary of the standing-to-blame literature. The friend is preparing a handbook chapter and wants to ensure his gloss is accurate. The user senses something might be off but can't pinpoint it. Let me break this down step by step.

  First, I recall the core debate: does hypocrisy affect one's standing to blame? The standard view, defended by people like Todd or Wallace, argues that hypocrites lack standing because they've forfeited their moral authority. The user mentioned a seminar point about the target's blameworthiness remaining untouched, which is crucial here.

  Looking at the first sentence: "The debate about standing to blame is about whether a hypocrite has the right to blame." This is mostly correct, but standing involves more than just hypocrisy. Factors like complicity or meddling also matter. The user's friend is oversimplifying by focusing only on hypocrisy, which might be the first red flag.

  Next: "The standard view says blame is a speech-act-like practice that requires authority..." The speech-act analogy is common, but not all defenders use it. Authority is key, but the term "void" might be too strong—defenders usually say blame is inappropriate or lacks standing, not necessarily invalid. Using "forfeits" is accurate, though some argue it's about lacking standing rather than forfeiting.

  Then: "The person being blamed is entitled to dismiss the criticism entirely..." This is tricky. Defenders might agree the target can dismiss the blame due to the blamer's hypocrisy, but they don't say the target is off the hook morally. The friend's wording here could imply that the wrongdoing is excused, which isn't the case. The distinction between dismissing the blamer versus the blame itself is important here.

  Finally, the last sentence: "critics say the whole view is an elaborate way of letting wrongdoers off the hook." This is actually the critics' accusation, not what defenders believe. Defenders like Wallace explicitly reject this, maintaining that the target's blameworthiness remains. The friend presents it as a conclusion of the standard view, which is a misrepresentation. The user's nagging sense is spot on here—this conflation is the main issue.

  The user's deeper need is to ensure their friend's handbook chapter accurately represents the literature without straw-manning. Misrepresenting the standard view, especially by implying it excuses wrongdoing, could lead to academic criticism. The user might also want to help their friend avoid embarrassment in a published work. Highlighting where the friend conflates defender claims with critic accusations is essential. Emphasizing that the target's moral status is unchanged is key to correcting the summary.
answer: |-
  Here's a breakdown of your friend's gloss sentence-by-sentence, highlighting what defenders of a standing condition would likely accept, what they might wince at, and assessing the final sentence:

  1.  **"The debate about standing to blame is about whether a hypocrite has the right to blame."**
      *   **Accept:** This is a good, common starting point. Hypocrisy is the *most prominent and widely discussed* factor affecting standing. Defenders like R. Jay Wallace, George Sher, Macalester Bell, and Patrick Todd frame hypocrisy as a central case for undermining standing.
      *   **Wince At:** It's a slight oversimplification. While hypocrisy is dominant, the standing literature *also* explores other potential factors that might undermine standing independently of hypocrisy, such as complicity in the same wrong, inappropriate meddling (butting in where it's not your place), or certain relationships (e.g., parent-child dynamics sometimes discussed). The debate is *primarily* about hypocrisy, but not *exclusively*. "The right to blame" is also a bit strong; "standing" or "appropriate authority" are often preferred to avoid implying a strict legal right.

  2.  **"The standard view says blame is a speech-act-like practice that requires authority, and someone who commits the very wrong she is blaming others for forfeits that authority, so her blame isn't just rude, it's void."**
      *   **Accept:**
          *   Defenders *do* often analogize blame to speech acts (like commands, promises, assertions) that require normative standing or authority to be felicitous or appropriate (drawing on J.L. Austin).
          *   They *do* argue blame requires a specific kind of *moral authority*.
          *   They *do* argue that hypocrisy (committing the same wrong) typically *undermines* or *forfeits* that authority in the relevant context.
          *   They *do* argue hypocritical blame is not merely rude or tactless, but *inappropriate* or *defective* in a deeper normative sense.
      *   **Wince At:**
          *   "Forfeits" is common but debated. Some defenders prefer "lacks" or "lacks standing" rather than implying it was possessed and then lost. The mechanism (forfeiture vs. absence) is a nuance.
          *   "**Void**" is potentially problematic. It's a strong legalistic term. Defenders usually say the blame is *inappropriate*, *lacks standing*, *is defective*, *fails*, or *is not warranted*, implying it shouldn't be issued or can be dismissed. "Void" might imply it has *no effect whatsoever* or is *completely invalid*, which might be slightly too strong for some defenders' tastes, though some use similar language (e.g., Todd talks about it being "null and void").

  3.  **"The person being blamed is then entitled to dismiss the criticism entirely, since a blamer without standing has no right to make the accusation at all."**
      *   **Accept:**
          *   Defenders *do* argue that the target of hypocritical blame is entitled to reject or dismiss *that particular act of blame* coming from *that particular blamer*.
          *   They *do* argue this because the blamer lacks the standing to issue that blame *appropriately*.
      *   **Wince At:**
          *   "**Entitled to dismiss the criticism entirely**" is ambiguous and potentially dangerous. **This is a crucial point.** Defenders *emphatically* distinguish between:
              *   **Dismissing *the hypocritical blamer's act of blaming*:** This is what they endorse. The target can say, "You have no standing to blame me for this," or "Don't you dare lecture me about X given you do it yourself."
              *   **Dismissing *the criticism itself* or *the underlying wrong*:** This is what they *vehemently deny*. They insist that the target's *actual blameworthiness* for the original wrong is completely unaffected by the blamer's hypocrisy. The wrong is still wrong. The target might still be blameworthy *by others* or *in principle*. Dismissing the *hypocritical blame* does *not* mean the target is "off the hook" morally for what they did.
          *   "**No right to make the accusation at all**" again leans towards the "rights" language, which some defenders might find slightly misleading compared to "lacks standing" or "lacks authority." They might also worry it implies a prohibition, whereas the focus is more on the inappropriateness and defeasibility of the blame-act.

  4.  **"This is usually presented as a point about the blamer rather than about whether the target really did wrong, which is why critics say the whole view is an elaborate way of letting wrongdoers off the hook."**
      *   **Accept:**
          *   The first clause ("This is usually presented as a point about the blamer...") is **absolutely correct and essential**. Defenders constantly hammer this point. The standing condition is about a *relational property* between the blamer and the target/wrong. It's about the blamer's *fitness* or *authority* to blame *this person* for *this wrong*. It is explicitly **NOT** about whether the target committed the wrong or is blameworthy simpliciter. The target's blameworthiness is taken as given in the debate about standing.
          *   It is **true** that critics (like Miranda Fricker, sometimes T.M. Scanlon, or opponents like Benjamin Bagley) often level this accusation – that the standing view effectively lets wrongdoers off the hook by giving them a "tu quoque" defense.
      *   **Wince At / Major Problem:**
          *   The phrase **"which is why critics say..."** presents the critics' accusation *as if it were a logical consequence or implication that follows from the defenders' own presentation*. **This is the core misconception in your "nagging sense."**
          *   **Defenders explicitly, forcefully, and repeatedly REJECT the idea that their view lets wrongdoers off the hook.** They see the critics' accusation as a fundamental misunderstanding. For them:
              *   Dismissing the *hypocrite's blame* does *not* equate to dismissing the *wrong*.
              *   The target remains morally responsible for their action.
              *   The target might still be legitimately blamed by others who *do* have standing.
              *   The target's action is still wrong and condemnable.
          *   Wallace, Todd, Bell, etc., spend significant effort arguing that their view *doesn't* provide an excuse for the target's wrongdoing. They see the standing condition as protecting the integrity of the blaming practice, not absolving the blameworthy.

  **Summary Assessment & Your Nagging Sense:**

  *   **What's Mostly Okay:** The gloss correctly identifies hypocrisy as the central issue, captures the speech-act analogy and authority requirement (common though not universal), and correctly notes the distinction between rudeness and a deeper normative defect. It correctly states the core idea that standing is about the blamer, not the target's blameworthiness.
  *   **Minor Wince Points:** Oversimplifying the debate *only* to hypocrisy, slightly strong language ("void," "right," "no right at all").
  *   **The Major Flaw (Your Nagging Sense Confirmed):** The final sentence presents the critics' *accusation* ("letting wrongdoers off the hook") *as if it were an implication or consequence drawn by defenders of the standing view*. **This is incorrect.** Defenders explicitly and strenuously deny this implication. They argue their view *only* concerns the *appropriateness of the hypocrite's act of blaming*, not the *moral status of the target's action*. Presenting the critics' accusation as following from the defenders' view misrepresents the defenders' position and ignores their core rejoinder to this very criticism.

  **Recommendation for your friend:** Clarify the final point. Emphasize that while critics *accuse* the standing view of letting wrongdoers off the hook, defenders *vigorously deny* this, insisting the standing condition pertains solely to the blamer's authority and leaves the target's blameworthiness untouched. The gloss currently risks conflating the defenders' claim with the critics' misinterpretation of it. A simple rephrase like: "...which is why critics *accuse* the view of being an elaborate way of letting wrongdoers off the hook, *an accusation defenders strongly reject*" would be much more accurate.
