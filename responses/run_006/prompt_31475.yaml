  The user also wonders if it's a clash of bedrock intuitions. While foundational intuitions play a role, the structured arguments suggest more than that. The stalemate arises because each side's framework dismisses the other's core premises. For example, consequentialists see deontological constraints as irrational because they ignore outcomes, whereas deontologists see consequentialism as missing the moral significance of actions.

  Another angle: are they doing different projects? The user suggests one might be doing normative ethics, the other decision theory. But both claim to address moral obligations, so their projects overlap enough to create genuine disagreement rather than mere difference.

  So, the diagnosis leans toward a substantive metaphysical disagreement about the nature of reasons. Progress might come from metaethical work on reasons, perhaps through constitutive arguments or structural coherence. Alternatively, bridging concepts like "integrity" or "agent-relative reasons" could reframe the debate. If no progress is possible, acknowledging pluralism or shifting focus to practical applications might be necessary.

