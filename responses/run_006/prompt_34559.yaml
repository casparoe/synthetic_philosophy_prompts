prompt: |-
  I've been reading a popular philosophy book that summarizes Putnam's Twin Earth thought experiment, and something about the summary feels off to me, but I can't quite articulate where the problems are. Here's the summary:

  "Putnam showed that meanings aren't in the head. He asks us to imagine a duplicate Earth where the clear liquid that fills the lakes and rivers is XYZ rather than H₂O. Oscar on Earth and Twin Oscar on Twin Earth are molecule-for-molecule identical, yet when Oscar says 'water' he refers to H₂O and when Twin Oscar says 'water' he refers to XYZ. Since they're psychologically identical but their words refer to different things, meaning must be at least partly determined by the external world. This has the surprising consequence that we can't know the meanings of our own words just by introspection — we have to investigate the world to find out what we've been talking about all along."

  I'm a longtime reader of rationalist blogs and forums, so I've absorbed some philosophy of language secondhand — I know the broad contours of semantic externalism, and I know Putnam's slogan — but I haven't read the original papers and I don't trust my ability to pinpoint where a competent popularizer might be subtly misrepresenting the view. My instinct is that the last sentence overreaches: it seems to draw a sweeping epistemological conclusion from a semantic premise, and it's not obvious that Putnam himself would endorse the claim that we can't know what our own words mean without empirical investigation. But I also worry I'm reading a crude caricature into what's actually a defensible gloss.

  Please take the role of a professional philosopher of language. Think carefully — start by laying out the key distinctions Putnam's argument actually relies on (e.g., reference vs. what a speaker has in mind, the role of the linguistic division of labor, the causal theory of reference, etc.). Then go through the summary sentence by sentence and tell me: what's accurate, what's a simplification that would make a specialist wince, and what if anything is just wrong. Finally, address the last sentence directly: does the conclusion that we can't know our own meanings by introspection follow from anything true in the summary? If not, what does Putnam's view actually license us to say about self-knowledge of meaning, and where exactly does the overstatement sneak in?
