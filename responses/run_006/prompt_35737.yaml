answer: |-
  What you're observing is indeed a profound and recurring pattern across several cognitive domains – a pattern so fundamental that it *does* have recognized names, though the "joints" aren't always perfectly aligned. Philosophers and AI researchers have grappled with this core difficulty extensively.

  Here's the carving based on your examples:

  1.  **For AI Planning & Robotics (Action/Change):**
      *   **The Core Name: The Frame Problem.**
      *   **Origin:** Coined by John McCarthy and Patrick Hayes in their 1969 paper "Some Philosophical Problems from the Standpoint of Artificial Intelligence." It directly addresses your robot/beaker scenario.
      *   **Core Difficulty:** How to efficiently represent and reason about the world, specifically how to determine what aspects of the world state *remain unchanged* (stay in the same "frame") when an action is performed, *without* having to explicitly list every single thing that doesn't change for every possible action. The "frame" refers to the background state assumed to persist.
      *   **The Challenge:** The problem arises because, in a purely logical representation, if you only specify what *changes*, you cannot logically infer that anything *else* remains the same (the "qualification problem" – the impossibility of listing all preconditions) or that the change *only* affects what you specified (the "ramification problem" – handling indirect consequences).
      *   **Solutions Attempted:** Frame axioms (inefficient), non-monotonic logics (default reasoning, circumscription), situation calculus fluents, successor state axioms, probabilistic approaches.

  2.  **For Belief Revision (Knowledge Update):**
      *   **The Core Name: The Problem of Relevance (or the Locality Problem).**
      *   **Core Difficulty:** When you learn a new piece of information that contradicts your current belief set, how do you determine *which specific subset* of your existing beliefs needs to be revised, retracted, or modified to restore consistency? How is the change *localized*? Why does changing belief X not force you to re-evaluate beliefs Y and Z about unrelated topics?
      *   **Relation to Frame Problem:** This is a close conceptual cousin. Just as the Frame Problem asks "what *doesn't* change physically when I act?", the Relevance Problem asks "what *doesn't* need to change cognitively when I update a belief?". Both deal with the necessity and difficulty of delimiting the scope of change.
      *   **Solutions Attempted:** AGM belief revision theory (minimal change principle), relevance logics, coherence-based approaches, foundationalist approaches (distinguishing core vs. peripheral beliefs), probabilistic models (Bayesian updating inherently handles relevance via conditional dependence).

  3.  **For Scientific Modeling & Causation (Isolating Factors):**
      *   **The Core Names: Ceteris Paribus Conditions & The Problem of Isolation.**
      *   **Core Difficulty:** Scientific models and causal claims often rely on the assumption that "all other things are equal" or "other things are held constant." How do we isolate the effect of one specific variable or intervention from the vast complexity of the background context? How do we know *which* background factors are relevant to hold fixed and which can be safely ignored?
      *   **Relation to Frame Problem/Relevance:** This is the epistemological/metaphysical grounding of the other two. Scientific reasoning *assumes* a stable background (like the Frame Problem) and isolates relevant factors for change (like the Relevance Problem) to make tractable models and causal claims. It asks, "What constitutes the stable background frame against which change is measured?" and "What factors are relevantly connected to the change under study?".
      *   **Solutions Attempted:** Controlled experimentation, statistical controls, idealization in models, explicit modeling of boundary conditions, causal graphs (directed acyclic graphs - DAGs) to represent dependencies.

  **Synthesis: Is it One Thing or Several? Where are the Joints?**

  1.  **Shared Core Difficulty (The Unifying Theme):** All three grapple with the fundamental challenge of **managing relevance and invariance in complex systems.** They stem from the **holistic nature of description** and the **impossibility of explicit, exhaustive enumeration** of what remains constant. The core insight is that reasoning about change (physical, cognitive, or causal) requires implicit or explicit knowledge about what *doesn't* change and *why* it doesn't need to be considered. This is the **Problem of Selective Invariance.**

  2.  **The Joints (The Distinctions):**
      *   **Domain of Change:**
          *   **Frame Problem:** Primarily about *physical state changes* resulting from *actions* in the world.
          *   **Relevance Problem:** Primarily about *logical consistency changes* resulting from *information updates* in a belief system.
          *   **Ceteris Paribus/Isolation:** Primarily about *epistemic modeling* and *causal inference* in scientific reasoning, often abstracted from specific actions or immediate updates.
      *   **Focus:**
          *   **Frame Problem:** Focuses on *efficient representation and inference* for action consequences.
          *   **Relevance Problem:** Focuses on *principles for minimal and rational belief modification*.
          *   **Ceteris Paribus/Isolation:** Focuses on the *epistemological justification* for background assumptions and the *metaphysics of causation*.
      *   **Mechanism of Invariance:**
          *   **Frame Problem:** Invariance often handled computationally (e.g., frame axioms, defaults).
          *   **Relevance Problem:** Invariance handled via logical relations or coherence principles.
          *   **Ceteris Paribus/Isolation:** Invariance is an *assumption* (often justified empirically or pragmatically) built into the model or experimental design.

  **Conclusion:**

  *   **Yes, there is a core difficulty:** It's the fundamental challenge of **delimiting relevance and establishing invariance** when reasoning about change in complex, interconnected systems.
  *   **The best overarching conceptual label is likely the Frame Problem,** as it was the first formal articulation in AI and its name has often been borrowed broadly to describe the general shape of the issue in other domains. Philosophers frequently use "Frame Problem" in this wider sense when discussing cognition.
  *   **However, they are distinct problems at the joints:** While deeply related and sharing a common structure, they arise in different contexts (action vs. belief update vs. causal modeling), emphasize different aspects (efficiency of representation vs. principles of minimal change vs. justification of background assumptions), and often employ different solution strategies. The **Problem of Relevance (Belief Revision)** and the **Problem of Isolation/Ceteris Paribus (Scientific Modeling)** are specialized variants addressing specific manifestations of the core difficulty.

  **In essence:** You've correctly identified a fundamental cognitive and computational pattern. The "Frame Problem" is the most established name for the *archetype* arising in action/change scenarios, and its conceptual structure illuminates the closely related problems in belief revision and scientific modeling. While distinct in their specific formulations and contexts, they are unified by the core challenge of **knowing what to ignore when something changes.** This is arguably one of the deepest unsolved problems in understanding intelligence, both natural and artificial. Your background as a biochemist gives you a powerful lens to see this pattern – it reflects the essential challenge of isolating variables within the overwhelming complexity of a biological system.
