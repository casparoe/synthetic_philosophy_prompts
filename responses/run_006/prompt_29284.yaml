  I'm a few years out of a math-heavy undergrad, spent some time in industry, and am now looking to spend the next 3–4 years doing independent research in decision theory. I've been reading LessWrong and the Alignment Forum for years, so I'm coming at this with the kind of concerns that show up there: I care about decision theory partly for its own sake and partly because I suspect that getting the foundations right matters for reasoning about embedded agency, acausal trade, and the behavior of advanced AI systems.

  The specific cluster I want to dig into is the Pasadena paradox and its relatives — problems where expected values are undefined, conditionally convergent, or infinite in ways that break naive expected utility maximization. This includes the St. Petersburg paradox (as the historical entry point), the Pasadena paradox proper (where the expected value is conditionally but not absolutely convergent), the two-envelope problem's infinite-variant cousins, and any other cases where "maximize expected utility" isn't a well-formed instruction.

  I want you to identify what you see as the most important open questions in this cluster and rank them by how worth working on they are for someone with my profile and timeline. For each question, I want to know why it's important — what downstream questions or practical decisions turn on it — how tractable it is with the tools someone like me would have, and what would make me revise the ranking.

  Structure your response as follows:

  **Scope and boundaries** (~250 words): How you're carving up the problem space. What counts as part of this cluster, what adjacent questions (e.g., bounded utility functions, computational limitations on agents) you're deliberately setting aside, and why.

  **Candidate questions** (~500 words): List each open question with a one-paragraph description. What is the question, what makes it unresolved, and what would a satisfactory answer look like?

  **Ranking and justification** (~700 words): Your ranked list and the reasoning behind it. Be explicit about your criteria — importance, tractability, neglectedness, how many other questions hinge on this one, risk of spinning wheels — and how you're weighing them against each other. I want to see the trade-offs, not just a list.

  **What would change the ranking** (~300 words): For your top-ranked questions, what concrete results or developments over the next 2–3 years would cause you to move them up or down significantly?

  Don't give me a literature review or a reading list. I'm asking for a defended research agenda.
