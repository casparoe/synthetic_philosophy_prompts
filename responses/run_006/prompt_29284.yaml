answer: |-
  ### Scope and Boundaries
  This cluster focuses on **decision problems where expected utility (EU) is ill-defined due to conditional convergence, infinite series, or non-integrability**, rendering naive EU maximization incoherent. Core cases include:  
  - **Pasadena paradox**: EU is conditionally convergent (value depends on summation order).  
  - **St. Petersburg variants**: Infinite EU with unbounded utility/payoffs.  
  - **Two-envelope extremes**: Infinite expectations in swapping dilemmas.  
  - **Divergent series**: Any payoff structure where \(\sum p_i u_i\) fails absolute convergence.  

  **Included**: Formal extensions to sequential decisions, stochastic environments, and updateless agents. Focus is on **axiomatic foundations** and **consistency criteria** for rational choice under these pathologies.  

  **Excluded**:  
  - **Bounded utility**: We assume unbounded utilities are theoretically relevant (e.g., for AI goal structures).  
  - **Computational/approximate approaches**: Solutions relying on resource constraints (e.g., truncated computing) are adjacent but secondary.  
  - **Finite approximations**: These avoid the paradoxes but don’t resolve the foundational issue.  
  - **Risk aversion models**: Psychological or bounded-rationality fixes are out of scope.  

  **Why**: The goal is to address the *theoretical gap* in EU maximization when infinite/conditional expectations arise in idealized agents (e.g., AGI), not to impose pragmatic constraints.  

  ---

  ### Candidate Questions  
  1. **Embedding Problem**: How should an agent evaluate an action *embedded in a larger decision tree* when its isolated EU is conditionally convergent? Unresolved because dynamic consistency fails (e.g., Pasadena game may switch value based on preceding choices). A satisfactory answer requires a universally consistent evaluation method for sub-decisions.  

  2. **Rationality Axiomatization**: What minimal axioms define "rational" choice when EU is undefined? Current axioms (e.g., VNM) assume finite EU. A solution would provide replacement axioms that yield coherent preferences in conditionally convergent cases without ad-hoc fixes.  

  3. **Resolution Criterion**: Under what conditions can a unique "correct" EU be assigned to conditionally convergent series? Current proposals (e.g., Cesàro summation) are arbitrary. A satisfactory criterion would be derivable from decision principles (e.g., invariance under natural transformations).  

  4. **Infinite Aggregation**: How to rank prospects when *both* probabilities and utilities grow unbounded (e.g., St. Petersburg with stochastic background payoffs)? Unresolved due to sensitivity to tail behavior. A solution must specify robust dominance principles.  

  5. **Acausal Consistency**: Can an EU replacement support stable acausal trade (e.g., with simulated or logical peers) when expectations diverge? Current decision theories fail here. Success would enable proofs of cooperative equilibria without absolute convergence.  

  ---

  ### Ranking and Justification  
  **Criteria**:  
  - **Importance**: Impact on alignment (e.g., if AGI faces such choices, failure risks catastrophe).  
  - **Tractability**: Solvable in 3–4 years with advanced math (analysis, probability).  
  - **Neglectedness**: Underexplored relative to impact.  
  - **Centrality**: How many downstream problems hinge on this?  
  - **Spin Risk**: Low if concrete tools exist; high if philosophically fraught.  

  **Ranked List**:  
  1. **Embedding Problem**  
     - *Why #1*: Directly affects embedded agents (e.g., AGI making sub-decisions). Failure implies dynamic inconsistency—agents might sabotage their own goals. Highest alignment relevance, neglected in decision theory. Tools exist (game trees, convergence spaces) but unapplied. Central to all sequential decisions. Spin risk: medium (requires novel math but not intractable).  

  2. **Rationality Axiomatization**  
     - *Why #2*: Foundational for *any* EU replacement. Without axioms, solutions are unmoored. Crucial for defining "aligned" AGI preferences. Tractability: high (leveraging functional analysis or topology). Neglectedness: medium (some work in economics, none for alignment). Centrality: resolves paradoxes *en masse*. Spin risk: low with rigor.  

  3. **Resolution Criterion**  
     - *Why #3*: Solves Pasadena/St. Petersburg cleanly. Downstream impact: enables comparing divergent gambles. Tractability: highest (analysis tools ready). Neglectedness: high (limited post-Weirich 1984). Centrality: prerequisite for #1–2. Spin risk: low.  

  4. **Acausal Consistency**  
     - *Why #4*: Vital for alignment (acausal trade may be key to multi-AGI stability). But hinges on #1–3. Neglectedness: extreme. Spin risk: high without progress on #1–2.  

  5. **Infinite Aggregation**  
     - *Why #5*: Important for cosmology/infinite ethics but less urgent for near-term AGI. Requires measure theory innovations. Lower centrality to core paradoxes.  

  **Trade-offs**: Prioritized embeddedness (#1) over axioms (#2) due to immediate AGI relevance. Axiomatization is more foundational but less time-sensitive. #3 is tractable but narrower; solving it aids #1–2. #4–5 are high-impact but too speculative without foundational progress.  

  ---

  ### What Would Change the Ranking  
  #### For #1 (Embedding Problem):  
  - **Move down** if:  
    - A major paper (e.g., by MIRI or FHI) solves dynamic consistency for conditionally convergent EU within 2 years.  
    - Impossibility proof shows no solution exists without bounded utility.  
  - **Move up** if:  
    - New AGI architectures (e.g., Odo or Dreamer variants) expose concrete failures in sub-decision evaluation.  
    - Connections emerge to deceptive alignment (e.g., inconsistency enabling manipulation).  

  #### For #2 (Axiomatization):  
  - **Move down** if:  
    - Econ theorists (e.g., Al-Najjar) publish a complete axiom set for divergent EU.  
    - Broad consensus adopts bounded utility, negating the problem.  
  - **Move up** if:  
    - Work on #1 or #3 reveals unexpected inconsistencies in extant proposals (e.g., updatelessness).  
    - AGI goal formalization efforts (e.g., in infra-Bayesianism) hit paradoxes requiring new axioms.  

  #### For #3 (Resolution Criterion):  
  - **Move down** if:  
    - A non-arbitrary criterion (e.g., derived from Dutch book arguments) gains acceptance.  
    - AI safety community dismisses unbounded utilities as irrelevant.  
  - **Move up** if:  
    - Novel paradoxes emerge in ML (e.g., reward hacking in RL with heavy-tailed returns).  

  **General Shift**: Progress in **infra-Bayesianism** (e.g., new coherence results for unbounded losses) could elevate #1–2. Conversely, **industry AI** ignoring these problems may lower urgency—but alignment mandates assuming worst-case rationality.
