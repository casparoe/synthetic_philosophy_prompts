prompt: |-
  Hey, I'm a PhD student giving a talk at the agency workshop next month and I'm low-key dreading the Q&A. My paper defends Frankfurt cases against the flicker-of-freedom strategy. The basic claim: the alternatives that survive in Frankfurt cases (the blush, the neural indicator, whatever) are exactly the kind of alternatives that we already don't think matter for responsibility—so if the flicker theorist insists they DO matter, they need a non-question-begging story about why, and the existing stories all fail. The audience: two libertarians (one event-causal, one agent-causal, both think PAP is non-negotiable), a compatibilist who thinks Frankfurt cases are a dead end and prefers straight-up reasons-responsiveness, and—the one I'm actually worried about—someone who's published multiple papers defending a version of the flicker strategy. I want a Q&A prep sheet: objections ordered by how much damage they'd do, phrased rougly how these specific people would ask them, with a two-minute reply for each and an honest note on where the reply is soft. What do I concede upfront? And what's the question I'm praying nobody asks?
