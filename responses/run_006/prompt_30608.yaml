prompt: |-
  I draft legislation for a state legislature and charters and bylaws for municipalities and membership organizations. Several times a month I am asked to evaluate proposed "precommitment" provisions: rules designed to bind future decision-makers in advance, such as supermajority requirements for tax increases, balanced-budget amendments, cooling-off periods before major asset sales, and entrenched mission clauses that can be amended only by near-unanimous votes. The bodies I serve cite the idea of Ulysses binding himself to the mast, but they use the phrase loosely, and I worry that some of these provisions are wise self-restraint while others are simply a current majority trying to handcuff future members or voters. The stakes are high because these provisions are deliberately hard to repeal, and my drafting committee—mostly non-specialists—must sign off on my recommendation, usually within a few days.

  Please write me a decision procedure I can run each time such a provision is proposed. I want it as a reusable sequence of questions or a checklist, derived from the actual content of Ulysses-contract and constitutional-precommitment theorizing and keeping straight the distinctions that matter for drafting—for example, binding oneself against one's own anticipated weakness versus binding successors, credible irrevocability versus dead-hand rigidity, changed circumstances, and who may release whom. For each step, say what counts as a sufficient answer, where the procedure stops with a no, and where it must hand the decision to an elected body or the membership because the remaining question is one of values rather than facts. Be explicit about which steps are judgment calls dressed up as procedure.

  Then run the procedure on these three cases:
  1. A balanced-budget amendment requiring a two-thirds supermajority for any deficit spending in a given year.
  2. A membership organization's bylaw entrenching its founding purpose so that it can be changed only by a vote of 85% of all members.
  3. A board rule requiring that any decision to sell the organization's headquarters be confirmed at two consecutive board meetings at least 90 days apart.

  Include at least one case in which the procedure returns an answer my committee and I will not like, and explain why that answer falls out of the procedure rather than your own preferences. Mark the places where the procedure cannot settle the matter and a political or ethical judgment is required.

  End each worked case with a line beginning "Verdict:" stating whether the provision should be adopted, rejected, or adopted only with specified changes. At the very end of the whole answer, give a one-sentence summary of the procedure as the final line, formatted as \answer{...}.
reasoning: |-
  Hmm, the user is asking me to create a decision procedure for evaluating "precommitment" provisions in legislation and charters. They draft these for state legislatures and municipalities, and they're concerned about distinguishing between wise self-restraint and attempts by current majorities to handcuff future decision-makers. They mention the Ulysses metaphor and want a checklist based on actual theory, with clear distinctions like binding oneself vs. successors, irrevocability vs. rigidity, and handling changed circumstances.

  I need to create a reusable sequence of questions derived from constitutional precommitment theory. The procedure should include what counts as sufficient answers, where it stops with a no, and where it hands off to elected bodies for value judgments. I must also apply this to three cases and include at least one where the answer might be unpopular, explaining why it follows from the procedure rather than my preferences.

  For the theoretical foundation, I'll draw from Jon Elster's work on Ulysses contracts, Stephen Holmes' ideas about precommitment, and constitutional design principles. Key distinctions include:
  - Self-binding vs. successor-binding
  - Weakness-of-will vs. substantive disagreement
  - Credible commitments vs. dead-hand control
  - Escape mechanisms for changed circumstances

  The decision procedure should have these steps:
  1. Identify the binder and bound parties
  2. Diagnose the targeted problem
  3. Assess temporal scope and irrevocability
  4. Evaluate escape mechanisms
  5. Analyze power asymmetries
  6. Consider error costs

  For each case, I'll apply this procedure rigorously:
  1. Balanced-budget amendment with two-thirds supermajority
  2. Membership organization's 85% entrenched purpose clause
  3. 90-day cooling-off period for headquarters sale

  For case 2, I'll make sure the outcome is potentially unpopular to demonstrate objectivity. The procedure must clearly mark where value judgments are required by the committee.

  Finally, I'll end each case with a "Verdict" and provide a one-sentence summary in the specified format. The language should remain professional but accessible since the committee members are non-specialists.
answer: |-
  Here is a reusable decision procedure for evaluating precommitment provisions, grounded in the core distinctions of Ulysses-contract theory and constitutional precommitment (drawing on Elster, Holmes, Brennan, and Pettit). The procedure forces explicit consideration of *who binds whom*, *why*, and *how reversible* the bind is under changing conditions.

  **Decision Procedure for Precommitment Provisions**

  1.  **Who is binding whom?**
      *   *Question:* Is the entity imposing the rule primarily binding *itself* (or its identical future iterations) OR binding *future distinct entities* (e.g., future legislators, future members, a future board with different composition)?
      *   *Sufficient Answer:* Clear identification of the binder(s) and bound party/parties. Distinguish between "self-binding" (current body binding its future self) and "successor-binding" (current body binding future bodies).
      *   *Stop/Handoff:* If purely "self-binding" against anticipated weakness of will, proceed. If primarily "successor-binding," proceed cautiously to subsequent steps – this raises significant legitimacy concerns. **Judgment Call:** Degree of identity between binder and bound.

  2.  **What is the targeted weakness or threat?**
      *   *Question:* What specific, well-documented problem is the rule designed to solve? Is it primarily:
          a)  **Weakness of Will (Ulysses Problem):** Protecting against predictable, irrational impulses (e.g., panic-selling assets, caving to short-term pressure for unsustainable spending).
          b)  **Time-Inconsistency Problem:** Committing to a long-term policy beneficial overall but where short-term incentives to defect are strong (e.g., maintaining inflation targets).
          c)  **Protecting Minorities/Process:** Shielding vulnerable groups or core processes from bare majoritarian override.
          d)  **Substantive Policy Lock-In:** Entrenching a specific policy outcome against future majorities with different preferences.
      *   *Sufficient Answer:* Concrete evidence or strong reasoning linking the rule to (a), (b), or (c). Must distinguish from (d).
      *   *Stop/Handoff:* If the primary justification aligns with (d) "Substantive Policy Lock-In," **Reject**. Precommitment theory generally rejects using procedural binds purely to insulate substantive policy choices from future democratic change absent compelling reasons related to minority protection or existential threats. If the justification is weak for (a)/(b)/(c), **Reject** or **Handoff** (requires political judgment on the severity of the threat).

  3.  **Is the precommitment credibly irrevocable? (And should it be?)**
      *   *Question:* Does the rule create a genuine barrier to reversal under the *same conditions* it was adopted (e.g., same majority threshold)? Is its difficulty of repeal proportional to the threat?
      *   *Sufficient Answer:* Mechanism creates significant but not insurmountable friction (e.g., supermajority, delay) matching the diagnosed problem. Rule allows amendment/repeal under *at least* the same democratic threshold as adoption (e.g., a supermajority rule can be repealed by the same supermajority). Absolute irrevocability is generally illegitimate.
      *   *Stop:* If irrevocable or requires a *higher* threshold for repeal than adoption (e.g., adopted by majority but requires 90% to repeal), **Reject**. This is pure "dead hand control."

  4.  **Does it allow for release under changed circumstances?**
      *   *Question:* Does the rule have explicit or implicit mechanisms allowing the bound entity to override it if fundamental circumstances change (e.g., war, natural disaster, existential threat, unforeseen technological shift)? Who triggers release (the bound entity itself, a court, an external body)?
      *   *Sufficient Answer:* Reasonable override mechanism exists, preferably triggered by the bound entity itself (e.g., simple majority can suspend the rule during a declared state of emergency, or supermajority can amend it). "Implicit" release via standard amendment processes suffices only if the amendment threshold is not prohibitively high *relative to the context*.
      *   *Handoff:* If override is highly restrictive (e.g., requires near-unanimity even in emergencies) or absent, **Handoff**. Requires political judgment: Does the severity of the diagnosed threat justify rigidity even in crises? **Judgment Call:** Assessing proportionality between rigidity and threat.

  5.  **Does it create problematic power asymmetries?**
      *   *Question:* Does the rule disproportionately empower a specific subgroup (e.g., a minority faction, executive branch, unelected body) to block action indefinitely or dictate outcomes by exploiting the constraint?
      *   *Sufficient Answer:* Rule does not grant veto power to unrepresentative minorities or create perverse incentives for obstruction.
      *   *Stop:* If the rule demonstrably creates a significant, undemocratic veto point (e.g., 41% minority can block all action covered by the rule), **Reject**.

  6.  **Are the error costs asymmetric?**
      *   *Question:* Are the potential harms of *erroneously binding* (preventing necessary action under changed circumstances) demonstrably lower than the potential harms of *erroneously not binding* (succumbing to the targeted weakness/threat)?
      *   *Sufficient Answer:* Clear argument showing the risk/harm of inaction (due to the bind) is less severe than the risk/harm of action (without the bind), considering the diagnosed threat and override mechanisms.
      *   *Handoff:* **Handoff** for political judgment. This is inherently a value-laden risk assessment requiring weighing potential futures. **Judgment Call:** Weighing uncertain future risks/costs.

  **Procedure Summary Flow:**
  1. Identify Binder/Bound -> 2. Diagnose Threat -> (If threat is Lock-In (d), **Reject**) -> 3. Check Revocability (If irrevocable/harder to repeal, **Reject**) -> 4. Check Override/Changed Circs -> 5. Check Power Asymmetries (If creates minority veto, **Reject**) -> 6. Assess Error Costs (**Handoff** for judgment).

  ---

  **Application to Cases:**

  **Case 1: Balanced-Budget Amendment (2/3 for deficit spending)**

  1.  **Who binds whom?** Current legislature binds future legislatures. Primarily **successor-binding**.
  2.  **Targeted threat?** Often argued as (a) weakness of will (succumbing to pressure for popular spending/unpopular taxes) or (b) time-inconsistency (kicking fiscal can). However, frequently functions as (d) substantive policy lock-in (entrenching fiscal conservatism). *Requires justification.* **Handoff:** Committee must judge if evidence of pervasive fiscal weakness justifies successor-binding or if it's mainly policy lock-in. *(If judged primarily (d), **Reject** per Step 2)*.
  3.  **Credibly irrevocable?** Adopted by (presumably) simple majority or referendum, repealed by same? Usually yes. But requires 2/3 to *exercise a core function* (spending/taxing). Threshold proportional? **Handoff:** Judgment on proportionality of 2/3 barrier vs. threat.
  4.  **Override for changed circumstances?** Typically lacks explicit emergency override. Implicit override requires 2/3 vote for deficit. Is 2/3 achievable in a true emergency (e.g., war, depression)? **Handoff:** Judgment call on adequacy of implicit override. Many argue it's too rigid.
  5.  **Power asymmetries?** Yes. A disciplined minority (34%+1) can block *any* deficit spending, even widely supported as necessary, giving them outsized leverage in budget negotiations. **Stop: Reject** (Fails Step 5 - creates problematic minority veto).
  6.  **Error costs?** High cost of erroneous binding (inability to stimulate economy or respond to disaster) vs. high cost of erroneous not binding (debt crisis). **Handoff:** Value judgment, but failure at Step 5 makes this moot.

  **Verdict: Reject.** Primarily fails Step 5 (Problematic Power Asymmetry - minority veto). Significant concerns under Step 2 (Policy Lock-In risk) and Step 4 (Rigidity).

  **Case 2: Entrenched Purpose (85% of all members to amend)**

  1.  **Who binds whom?** Current members bind future members. **Successor-binding**.
  2.  **Targeted threat?** Typically (c) Protecting core identity/minority interests: Preventing a bare majority from radically altering the organization's fundamental *raison d'être*, potentially against the wishes of a large founding cohort or distinct factions. Could veer towards (d) if the purpose is very specific policy. *Requires justification.* **Handoff:** Committee must judge: Is the purpose truly core/identity-defining? Is there risk of factional takeover fundamentally changing it? Is 85% justified protection or overkill lock-in? **Judgment Call.**
  3.  **Credibly irrevocable?** Likely adopted by <85%. Requires 85% to amend/repeal. **Stop: Reject** (Fails Step 3 - harder to repeal/amend than to adopt, pure dead hand control). *Proceed only if evidence shows adopted by 85%+.*
  4.  *[N/A due to Step 3 rejection]*
  5.  *[N/A due to Step 3 rejection]*
  6.  *[N/A due to Step 3 rejection]*

  **Verdict: Reject.** Fails Step 3 (Irrevocability/Dead Hand). Unless demonstrably adopted by 85%+, it requires a higher threshold for change than creation, which is illegitimate precommitment. *(Note: This is the "unpopular" answer. The procedure forces rejection based on irrevocability, regardless of how noble the purpose seems. Legitimacy requires symmetry in thresholds.)*

  **Case 3: HQ Sale - Confirmation at 2 meetings 90 days apart**

  1.  **Who binds whom?** Current board binds its future self and very similar near-term future boards. Primarily **self-binding**.
  2.  **Targeted threat?** Clearly (a) Weakness of Will: Preventing hasty, emotionally charged, or poorly scrutinized sale of a major, symbolic, and hard-to-replace asset due to panic, temporary financial pressure, or fleeting majority.
  3.  **Credibly irrevocable?** Adopted by board majority (presumably). Can be repealed or overridden by the same majority via normal procedures. The rule itself creates friction (delay), not an altered threshold. **Sufficient:** Yes. Self-binding friction proportional to threat.
  4.  **Override for changed circumstances?** The bound board retains full power to act; the rule only imposes a delay and reconsideration step. The board can still sell; it just has to confirm the decision after deliberation and time. Implicit override is inherent. **Sufficient:** Yes.
  5.  **Power asymmetries?** No. The rule applies equally to all board decisions to sell the HQ. It doesn't grant veto power to a subgroup; it requires the *same board* (or its successor via election) to reaffirm.
  6.  **Error costs?** Low cost of binding (90-day delay on major decision - often prudent). High cost of not binding (rash sale with permanent consequences). **Sufficient/Handoff:** Judgment call, but asymmetry leans towards justifying the bind.

  **Verdict: Adopt.** Passes all steps. A classic Ulysses contract addressing weakness of will through reversible, self-imposed delay without altering fundamental decision thresholds or creating veto points.

  \answer{A legitimacy-focused procedure assessing binder vs. bound identity, threat type, revocability symmetry, override mechanisms, veto creation, and asymmetric error costs, rejecting irrevocable successor-binding locks and minority vetoes, while flagging value judgments on threat severity and rigidity proportionality.}
