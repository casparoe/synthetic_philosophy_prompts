answer: |-
  **Bottom line: Good's theorem formally establishes that costless information has non-negative *instrumental* expected value under specific decision-theoretic assumptions, but the apparent counterexamples of rational information avoidance arise because they violate the assumption that utility depends solely on actions and world states, not on the agent's *knowledge state* itself; these cases expose a common overstatement of the theorem that ignores this crucial restriction, rather than lying outside its intended domain.**

  Good's theorem (1967) formally proves that, for a rational agent facing a decision problem under uncertainty, the expected value of acquiring costless information *before* making a final decision is non-negative. This holds given:

  1.  **Instrumental Rationality:** The agent seeks to maximize the expected utility of *outcomes*, defined solely by the action chosen and the state of the world.
  2.  **Flexible Action Post-Information:** The agent can condition their final action choice on the information received.
  3.  **Costless Information:** Acquiring the information itself incurs no direct cost (monetary, time, cognitive).
  4.  **Bayesian Updating:** The agent updates beliefs about the state of the world via conditional probability (Bayes' theorem).

  **What it establishes:** The theorem guarantees that *before* receiving the information, the agent expects to be at least as well off (in terms of the utility of the eventual outcome) by acquiring the information and then choosing the optimal action given that information, compared to choosing an optimal action *without* the information. The value is *instrumental* – derived solely from enabling better (higher expected utility) action choices.

  **Why it's over-read & what it doesn't establish:** The theorem is often glossed as "information is always good" or "more information never hurts." This over-reading ignores the fundamental assumption that utility depends *only* on actions and world states. It does *not* establish that information has non-negative value when:

  *   **Utility depends on the knowledge state:** If knowing a fact itself directly impacts utility (positively or negatively), independent of any action taken based on it.
  *   **Information forces a fixed action:** If the agent cannot adjust their action based on the information received.

  **Apparent Counterexamples and the Violated Assumption:**

  1.  **Declining a test for an untreatable condition:** The patient's available actions (e.g., live life normally) remain unchanged regardless of the test result. The information cannot lead to a *different, better* action. Crucially, *knowing* they have the condition (state of knowledge) likely causes distress, *reducing utility directly*, irrespective of actions. This violates the assumption that utility depends only on actions and world states – here, utility depends intrinsically on the *knowledge state*.
  2.  **Avoiding a fact altering feelings but not options:** Similar to case 1. Learning the fact changes the agent's emotional state (directly impacting utility) but provides no new instrumental value because it doesn't enable new or better actions. The utility function inherently depends on the agent's epistemic state.

  **The Restricted Guarantee:** Good's theorem guarantees that costless information has non-negative *expected instrumental value* – value derived purely from the *ability to choose better actions contingent on the information*. This guarantee holds *only* under the assumption that utility is defined over actions and world states, not over beliefs or knowledge states. In the counterexamples, the information has *zero or negative intrinsic value* due to its direct impact on feelings (changing the utility landscape), which overwhelms any potential instrumental value (which is zero in these cases anyway).

  **Classification:** These counterexamples do **not** lie outside the theorem's *intended domain* of rational decision-making under uncertainty. Instead, they **expose a common but overstated gloss** of the theorem. The theorem itself is formally correct *within its stated assumptions*. The overstatement occurs when people ignore or downplay the critical assumption that utility must be state/action-based and cannot intrinsically depend on the agent's knowledge. These cases highlight the precise boundaries of the theorem's guarantee: information is guaranteed non-negative *instrumental* value for influencing actions, but it can have negative *intrinsic* value if the act of knowing itself affects well-being. The counterexamples demonstrate the real-world limits of the instrumental model when knowledge itself has hedonic consequences.
