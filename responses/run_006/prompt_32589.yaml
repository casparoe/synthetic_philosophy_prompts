  Hmm, they're wrestling with three layered issues: First, whether discounting wellbeing is purely technical or carries moral weight. Second, if moral, what specific ethical stance it represents. Third, the practical consequences of reform. The existential examples (species extinction, carcinogens) show they're particularly troubled by intergenerational equity.

  The user's phrasing suggests they've already engaged with the philosophical literature ("as some philosophers argue"). Their frustration comes through in how they contrast abstract justifications ("opportunity cost of capital") with visceral outcomes ("a life saved thirty years from now counts for much less"). This isn't just academic - they're preparing recommendations that could change policy.

  Right, let's unpack the technical/moral duality. The Treasury's defence relies on three pillars: 1) Financial opportunity cost 2) Expected richer future populations 3) Observed individual time preference. But as the user sharply notes, none directly address whether society should value future lives less. The aggregate consumption argument feels particularly shaky when applied to irreversible harms like extinction.

  On the moral presuppositions... The practice does smuggle in ethical assumptions despite claims of neutrality. The pure time preference element especially implies that temporal distance itself diminishes obligation - a position philosophers like Parfit have thoroughly dismantled. And yes, the user's suspicion is correct: this functionally privileges present generations under a veneer of economic rationality.

  Practical consequences of near-zero discounting... Must be careful here. While high discount rates can justify kicking cans down the road, eliminating discounting altogether would indeed skew appraisals toward very long-term projects. The counterintuitive result might be underinvestment in current welfare. Ramsey's formula helps - we could separate the pure time preference component (which many find ethically indefensible) from the wealth-based discount element.

  The user's closing question about CBA's viability is crucial. They're likely facing colleagues who'll claim reform makes appraisal impossible. Truth is, frameworks already exist for non-discounted goods like statistical lives. The bigger hurdle is political: low discounting forces explicit valuation of future welfare trade-offs that high rates obscure. That transparency might be precisely what troubles traditionalists.
answer: |-
  You've put your finger on a profound and deeply contested ethical dilemma at the heart of public policy appraisal. Let's break down the moral picture implied by discounting wellbeing and the practical implications of changing it, using British English as requested.

  **1. Is it Strictly Efficiency or Does it Presuppose a Moral View?**

  The Treasury's defence (opportunity cost of capital, future wealth, observed time preference) presents discounting as a **technical necessity for efficiency**. The argument runs that public funds have alternative uses *now* generating returns. Spending £1 today on Scheme A that prevents £1.10 of future damage is inefficient if investing that £1 privately could yield £1.15 next year (the opportunity cost). Discounting future benefits/costs allows comparison on a present-value basis, supposedly ensuring the most efficient allocation of scarce resources *across time*.

  However, **this practice absolutely presupposes substantive moral views**, particularly when applied to non-market goods like lives, health, or ecosystems:

  *   **Embedded Pure Time Preference:** Applying the *same* rate used for financial returns to wellbeing implicitly accepts that "a unit of wellbeing tomorrow is intrinsically less valuable than a unit of wellbeing today" simply because it occurs later. This is a direct moral claim – **that temporal distance itself diminishes moral significance**.
  *   **Assumption of Perfect Substitutability:** It assumes future harms (e.g., lives lost, ecosystems destroyed) can be fully compensated for by increased future consumption enabled by current investment. This presupposes wellbeing is largely fungible with material consumption – a highly contestable view, especially regarding irreversible losses like extinction or unique ecosystems. The claim "wellbeing is not consumption" strikes directly at this.
  *   **Representation of Collective Choice:** Using *observed individual* time preferences (e.g., people saving less than economists think rational) to set a *social* discount rate for wellbeing across generations projects individual impatience or myopia onto society's long-term ethical obligations. This implicitly **prioritises the preferences of current voters/decision-makers over the interests of the unborn**.
  *   **Moral Standing of Future People:** Discounting heavily implies that **future people have weaker moral claims on us simply because they do not yet exist**. It treats their wellbeing as less urgent or binding. The observation that "the people whose lives are discounted are not the same people" highlights this intergenerational asymmetry.

  **2. What Specific Moral View Does it Presuppose?**

  The practice, particularly its pure time preference component, commits us most strongly to the view that **distance in time intrinsically diminishes a person's claim on us**. It operationalises the idea that our moral obligations weaken the further into the future the consequences of our actions lie.

  It *also* implicitly supports the view that **we have weaker obligations to people who do not yet exist**, treating their interests as inherently less pressing. While related to temporal distance, this is a distinct point about moral patienthood across existence.

  It *less* directly asserts that "the living are entitled to prioritise themselves," though this is often a pragmatic consequence. The efficiency argument *uses* this prioritisation (via opportunity cost) but frames it as a technical constraint rather than an explicit moral entitlement.

  **3. Implications of a Near-Zero Discount Rate for Wellbeing**

  Replacing the Treasury's standard discount rate (which includes a pure time preference element, often around 0.5-1.5% plus an elasticity term reflecting future wealth) with a near-zero rate *specifically for wellbeing* (and perhaps environmental irreversibles) would have significant consequences, but wouldn't necessarily render Cost-Benefit Analysis (CBA) unworkable:

  *   **Radical Reshifting of Priorities:** Projects with very long-term wellbeing benefits (climate mitigation, nuclear waste management, biodiversity conservation, preventative health programs) would become *dramatically* more favourable in appraisals. Schemes preventing distant future deaths or ecological collapse would score much higher. Conversely, projects with high short-term costs and diffuse long-term benefits might look less attractive.
  *   **Intergenerational Equity Enhanced:** It would significantly increase the apparent weight given to the wellbeing of future generations relative to the current one, moving towards a more impartial ethical stance across time.
  *   **Practical Challenges, Not Collapse:** CBA wouldn't become unworkable, but it would require significant adjustments:
      *   **Sensitivity Analysis:** Much heavier reliance on sensitivity analysis around the discount rate assumption would be crucial, given the massive impact.
      *   **Treatment of Uncertainty:** Uncertainty about the *very* distant future becomes more critical. A near-zero rate gives enormous weight to outcomes centuries away, which are inherently harder to predict. Techniques like declining discount rates (starting low and gradually increasing) might be explored.
      *   **Differential Discounting:** The framework would need robust rules for defining what constitutes "wellbeing" vs. standard consumption benefits eligible for the near-zero rate. Defining the boundary (e.g., is preventing future property damage from flooding "wellbeing" or standard consumption?) could be complex and contentious.
      *   **Capital Budgeting:** The opportunity cost argument wouldn't vanish. There would be increased tension between funding long-term wellbeing projects and shorter-term investments with high financial returns that could fund *future* wellbeing projects. The appraisal might need to explicitly consider this trade-off differently.
      *   **Political Acceptability:** Recommendations favouring significant current sacrifice for distant future gain might face much steeper political hurdles, even if economically justified under the new rate.
  *   **Moral Clarity (or New Conflicts):** While removing the ethically dubious pure time preference, it could introduce new conflicts, e.g., potentially justifying *less* spending on urgent current needs (like poverty alleviation or immediate healthcare) if a project saving more lives in 100 years scores higher. This forces an explicit, and difficult, valuation of lives across time.

  **Conclusion**

  The Treasury's current practice of discounting future wellbeing is defended on technical efficiency grounds (opportunity cost, revealed preference). However, it undeniably rests on substantive, and ethically controversial, moral presuppositions: primarily that temporal distance intrinsically weakens moral claims and that the interests of future, non-existent people carry less weight. It embeds a form of temporal partiality favouring the present generation.

  Adopting a near-zero discount rate specifically for wellbeing would be a profound shift towards intergenerational impartiality. It wouldn't destroy CBA but would fundamentally alter its outcomes, massively boosting long-term preventative and protective investments. It would necessitate careful adjustments to the appraisal framework (differential discounting, enhanced uncertainty treatment, sensitivity analysis) and force far more explicit and challenging ethical discussions about trade-offs between present and future welfare. The efficiency argument based on capital opportunity cost would remain a significant counterpoint, requiring careful consideration within the revised ethical framework. The debate ultimately hinges on whether society views its obligations to future generations as being diminished by time, or whether time itself is morally irrelevant to the weight of their wellbeing.
