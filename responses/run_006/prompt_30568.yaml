prompt: |-
  I'm a software engineer with no formal background in philosophy, and I've been reading around decision theory because Harsanyi's aggregation theorem keeps coming up in arguments that utilitarianism has a formal foundation. I reconstructed the following argument from a few sources, and it looks like it proves too much. I can't find the mistake.

  (1) For any rational individual, preferences over lotteries satisfy the von Neumann–Morgenstern axioms, so each individual's preferences can be represented by a utility function that is unique up to positive affine transformation (a choice of scale and zero point).
  (2) Social preferences, understood as the preferences of a rational, impartial planner, should satisfy the same von Neumann–Morgenstern axioms.
  (3) Pareto: if every individual weakly prefers lottery p to lottery q, the social planner weakly prefers p to q; and if every individual weakly prefers p to q and at least one strictly prefers p to q, the planner strictly prefers p to q.
  (4) Given (1)–(3), Harsanyi's aggregation theorem says the social utility function must be an affine combination of the individual utility functions: W = a1·u1 + ... + an·un + b, with positive weights.
  (5) Since the additive constant b doesn't affect choices, maximizing W is just maximizing a weighted sum of individual utilities — which is weighted utilitarianism.
  (6) But weighted utilitarianism is a substantive, controversial moral theory. It cannot be forced on us by consistency axioms plus a Pareto condition that almost everyone accepts.
  (7) Therefore at least one of (1)–(3) must be false, even though each looked unobjectionable on its own.

  Which step should I reject, and what does rejecting it commit me to? I'd prefer to keep (1) and (3) if I can, but I care more about understanding the price of each option than about preserving any particular premise.
reasoning: |-
  Okay, this user is a software engineer delving into philosophical decision theory, specifically Harsanyi's aggregation theorem and its implications for utilitarianism. They've reconstructed an argument that seems to prove too much—arriving at weighted utilitarianism through seemingly uncontroversial premises—and can't spot the flaw. Their core concern is identifying which premise to reject and understanding the consequences of that rejection.

  Hmm, interesting framing. The user acknowledges weighted utilitarianism's controversial nature but seems more focused on the logical tension than advocating for/against it. Their software engineering background suggests they value precise, step-by-step reasoning—likely why they numbered the premises. The phrase "proves too much" indicates they suspect a hidden contradiction, and "price of each option" shows they want to weigh tradeoffs objectively.

  Let me unpack their argument. Premise (1) about vNM rationality seems solid—it's standard in decision theory. Premise (3), Pareto efficiency, is also hard to contest; opposing it would mean endorsing socially dominated choices. The problem crystallizes at (2): equating individual and social rationality. The user senses this but wants confirmation. 

  Ah, and here's the crux: they're implicitly asking whether ethics can be "derived" mathematically. Their surprise at getting weighted utilitarianism from neutral axioms reveals an expectation that morality should resist formalization. Smart catch—philosophers like Sen and Weymark made similar points about Harsanyi's theorem mispresenting utilitarianism as inevitable.

  I should emphasize that rejecting (2) doesn't collapse decision theory. We can keep vNM for individuals (1) and Pareto (3) while denying that society mimics individual rationality. Social choice requires additional normative inputs—e.g., how to weigh utilities. The user might appreciate parallels in CS: individual functions vs. system architecture requiring new constraints.

  Potential pitfalls to flag: If they keep (2), they must defend interpersonal utility comparisons (since weights imply cardinal measurability). Rejecting (3) risks paternalism. But discarding (1) undermines standard microeconomics—probably too costly for their pragmatism.

  ...Their closing question suggests they'll evaluate positions based on "cost," so I'll map each rejection's theoretical commitments clearly. No jargon dumps; anchor responses in their engineering mindset. Maybe analogize affine transformations to unit conversions gone awry?
answer: |-
  You've pinpointed a genuine tension in the foundations of social choice theory. Your reconstruction is accurate, and your concern that the argument "proves too much" is well-founded. The flaw lies primarily in **premise (2): "Social preferences... should satisfy the same von Neumann–Morgenstern axioms."** Rejecting (2) is the most defensible path while preserving (1) and (3). Here's the breakdown:

  1.  **Reject Premise (2): The Core Problem**
      *   **Why it's the culprit:** The vNM axioms are designed for *individual* rational choice under risk. Applying them directly to *social* preferences smuggles in strong assumptions about the nature of social value and interpersonal comparisons.
      *   **The Commitment:** Rejecting (2) means you deny that the preferences of a "rational, impartial planner" over social lotteries *must* obey the same formal rules as an individual's preferences over personal gambles. Specifically, you deny that social rationality *requires* the Independence Axiom and the Archimedean Axiom in the same way individual rationality does.
      *   **The Price & Implications:**
          *   **Loss of a Unique Cardinal Social Welfare Function (SWF):** Without the full vNM structure, Harsanyi's theorem doesn't apply. You lose the *necessity* of a *linear* (affine) aggregation. Social preferences might still be representable by a SWF, but it could be non-linear (e.g., Rawlsian maximin, prioritarian sums like √u1 + √u2, or even leximin).
          *   **Need for Additional Ethical Input:** Determining the *form* of the SWF requires substantive ethical principles beyond consistency and Pareto. How should utilities be compared? Is equality valuable intrinsically? Should we prioritize the worst off? The vNM axioms for the social planner cannot answer these; they must be supplied externally.
          *   **Interpersonal Comparability Becomes Explicit:** The vNM framework gives you *cardinal* utilities *within* an individual (unique up to affine transformation). However, combining them linearly *requires* comparing the *scale* (the units and zero points) *across* individuals. The vNM axioms *alone* say nothing about how to do this. Premise (2) implicitly assumes these scales are comparable in a way that permits linear addition. Rejecting (2) forces this deep problem of interpersonal utility comparison (IUC) into the open. You need a *justification* for choosing specific weights (a1...an) or a specific aggregation method.
          *   **"Rationality" Differs:** You commit to the view that *social* rationality under uncertainty might involve different considerations than *individual* rationality. An individual might be rationally risk-averse over their own life prospects. Is it irrational for society to be "risk-averse" (inequality-averse) over the distribution of well-being? Many argue no – this reflects a distinct *ethical* value (e.g., fairness, priority to the worse off), not irrationality.

  2.  **Why Rejecting Other Premises is Less Appealing (But Possible):**
      *   **Reject Premise (1) (vNM for Individuals):** This throws out the standard model of rational individual choice under risk used throughout economics and game theory. While descriptive violations exist (Allais paradox, etc.), rejecting it *normatively* is a massive cost. It leaves you without a clear foundation for individual utility. You'd need an alternative account of rational individual preferences that still yields measurable cardinal utility – a much harder task. This seems disproportionate to the problem.
      *   **Reject Premise (3) (Pareto):** Rejecting Weak Pareto (if everyone strictly prefers A to B, society should prefer A to B) is deeply counterintuitive and arguably irrational from a social perspective – it means choosing an outcome everyone finds worse. Rejecting *Strict* Pareto (if everyone weakly prefers A to B and someone strictly prefers it, society strictly prefers it) is slightly less problematic but still strong. It might be justified in *very* rare cases (e.g., preventing exploitation under extreme information asymmetry, though Pareto usually assumes full information). The cost is high: abandoning a minimal condition of respecting unanimous individual preferences. Pareto is widely seen as a *necessary* (though insufficient) condition for a reasonable social choice rule.

  3.  **Why Weighted Utilitarianism Seems "Forced" (But Isn't):**
      Harsanyi's theorem is mathematically sound *given its premises*. Its power (and the sense it "proves too much") comes from premise (2) equating social rationality with individual vNM rationality. This equivalence is *not* self-evident; it's a substantive normative claim. The theorem shows that *if* you accept that a rational social planner's preferences over lotteries satisfy vNM axioms *and* you accept Pareto, *then* you get weighted utilitarianism. The controversy lies in the "if".

  **Conclusion & Recommendation:**

  *   **Reject Premise (2).** This is the most targeted and defensible response. It preserves standard individual decision theory (1) and the highly compelling Pareto principle (3).
  *   **Commitment:** You commit to the view that social choice requires *additional ethical principles* beyond individual rationality axioms and Pareto to determine how individual utilities should be aggregated. The core challenge becomes justifying a specific method for interpersonal utility comparison and the form of aggregation (linear sum, prioritarian, egalitarian, etc.).
  *   **What This Means for Utilitarianism:** Harsanyi's theorem doesn't provide a purely *formal* foundation for utilitarianism. It shows that utilitarianism (specifically, *weighted* utilitarianism) is one possible consequence *if* you accept the strong assumption that social rationality under risk mirrors individual vNM rationality. Rejecting that assumption breaks the "forcing" mechanism. Utilitarianism then stands or falls based on substantive ethical arguments about welfare, impartiality, and aggregation – not solely on consistency axioms.

  **Key Philosophers/Concepts to Explore:**

  *   **Amartya Sen:** Critiqued the conflation of "rationality" in social choice with individual vNM rationality. Emphasized the need for explicit ethical principles ("informational bases") and the problem of IUC. See his critique of Harsanyi in "Collective Choice and Social Welfare."
  *   **John Rawls:** Argued vehemently against using expected utility (vNM) reasoning for the basic structure of society in the Original Position, seeing it as conflating individual risk-aversion with societal fairness. His "maximin" rule is a direct alternative.
  *   **Interpersonal Utility Comparison (IUC):** The central problem once you reject (2). How can we meaningfully compare the intensity of preferences or well-being levels across different people? Can it be done empirically? Or only by ethical stipulation?
  *   **Prioritarianism:** Aggregation forms like ∑f(ui) where f is concave (e.g., ∑√ui), giving priority to benefits for the worse off. This requires rejecting the linearity implied by Harsanyi's theorem.
  *   **Derek Parfit:** "Levelling Down" objection to equality, relevant to discussing non-utilitarian aggregation forms.
  *   **John Broome:** Work on weighing lives and fairness in aggregation, providing nuanced defenses and critiques of utilitarianism and Harsanyi.

  By rejecting premise (2), you acknowledge the distinct nature of social ethics while retaining powerful tools for modeling individual choice and respecting unanimity. The "price" is embracing the complexity and controversy inherent in defining social welfare.
