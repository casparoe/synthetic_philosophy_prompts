answer: |-
  ### **The two sides, in their own terms**  
  **Reflection Defender (e.g., Van Fraassen, Briggs):**  
  Reflection states: For any proposition \(P\) and future time \(t\), your current credence \(C_{\text{now}}(P \mid C_t(P) = x)\) should equal \(x\). This follows from the *diachronic coherence* of rational credences: violating Reflection makes you vulnerable to a *sure loss* via a Dutch book strategy (where you accept bets now and at \(t\) that collectively guarantee a loss). Defenders treat rationality as constitutively tied to coherence—avoiding Dutch books is a *defining condition* of rationality. The sleeping pill/drunkness counterexamples are misapplied: if you know your future self will be irrational, your current credence should *conditionalize on that evidence*. For example, \(C_{\text{now}}(P \mid C_t(P) = x \land \text{"I took a sleeping pill"})\) need not equal \(x\). Reflection applies only when you *anticipate rationality* at \(t\), but this is built into conditionalization, not a restriction on the principle itself.  

  **Reflection Critic (e.g., Christensen, Talbott):**  
  Reflection, even in qualified forms (e.g., Christensen’s restriction to "reasonable" future credences), fails in cases where you *know* your future self will be misled (e.g., drugged, emotionally compromised) but still rational *by their own lights*. Here, your future self is coherent (no Dutch book against them *then*), yet you *shouldn’t* defer. Critics argue rationality is grounded in *responsiveness to evidence and reasons*, not just coherence. Dutch books are merely *symptoms* of irrationality, not its essence. The counterexamples show that formal coherence can conflict with substantive rationality: you can be Dutch-book-immune yet unjustified in deferring to a future self you know will overlook evidence. Reflection’s defenders "solve" counterexamples by gerrymandering conditionalization (e.g., adding "I will be rational at \(t\)" to the background), but this renders the principle tautological and untestable.  

  ---

  ### **Diagnosis**  
  Your hypothesis is fundamentally correct: **this is a methodological disagreement about the foundations of formal epistemology**, specifically the role of Dutch book arguments (DBAs). The core divide is whether rationality is *constituted* by formal coherence (defenders) or *evaluated* by broader epistemic norms (critics).  

  1. **Defenders’ Methodology:**  
     They view rationality as *synchronic and diachronic coherence*, with DBAs providing *constitutive standards*. On this view, counterexamples are resolved by refining how evidence is modeled. If future credences seem irrational, it’s because you possess *current evidence* (e.g., "I will be drunk") that must be conditionalized upon. Reflection holds *by definition* for agents who endorse their future rationality. This treats DBAs as the "axioms" of rationality—violations are *incoherent*, hence irrational *simpliciter*.  

  2. **Critics’ Methodology:**  
     They treat DBAs as *diagnostic heuristics* among others (e.g., calibration, accuracy dominance). Rationality requires tracking truth-conducive processes (e.g., proper evidence handling), not just coherence. The counterexamples reveal cases where coherence and truth-responsiveness *diverge*: a drunk future self is coherent but unreliable. For critics, Reflection fails because it demands deference *even when you have overriding reasons to doubt future reliability*.  

  **Why the Impasse?**  
  - **Incommensurable Standards:** Defenders prioritize *internal consistency* (formal results), critics *external adequacy* (case intuitions).  
  - **Self-Referential Loopholes:** Defenders "absorb" counterexamples into conditionalization (e.g., "I should conditionalize on my future irrationality"), making Reflection empirically vacuous. Critics see this as ad hoc.  
  - **No Neutral Ground:** The debate hinges on whether "rationality" includes *meta-awareness* of cognitive limitations. Defenders see this as part of evidence; critics as a separate epistemic duty.  

  **Your Insight’s Strength:**  
  You rightly identify that they’re "not disagreeing about the same thing." Defenders are modeling an *ideal, self-transparent agent*; critics are evaluating *real-world agents with fallible self-knowledge*. This isn’t resolvable by formal results alone—it’s a clash between **formal rigor** and **epistemic normativity**.  

  ---

  ### **What would move it**  
  Progress requires **meta-epistemological clarity**, not new theorems:  

  1. **A Grounded Theory of Conditionalization:**  
     Resolving *how* to conditionalize on future states (e.g., "I will be irrational") without trivializing Reflection. Work on *self-locating beliefs* (e.g., Titelbaum) or *higher-order evidence* (e.g., Lasonen-Aarnio) could formalize when future credences are "tainted."  

  2. **Reconciling DBAs with Accuracy:**  
     If accuracy-first arguments (e.g., Greaves, Pettigrew) show that Reflection *promotes long-term accuracy* even in compromised cases, critics might concede. Conversely, proving that DBAs *conflict* with accuracy in key cases (e.g., when cognitive corruption is predictable) would bolster critics.  

  3. **Methodological Concessions:**  
     Defenders could acknowledge DBAs are insufficient alone and integrate *reliability constraints*. Critics could admit that *within idealized models*, Reflection is tautologically valid.  

  **Realistically:** The debate won’t "resolve" but may refocus on *when* deference is warranted. A productive outcome is recognizing two distinct projects:  
  - **Formal Coherence:** Defining rationality as immunity to exploitation.  
  - **Substantive Rationality:** Governing evidence-response in non-ideal agents.  
  Clarity here would allow epistemologists to "choose their framework" without talking past each other. The enduring lesson may be that **no single principle can bridge ideal theory and human fallibility**.
