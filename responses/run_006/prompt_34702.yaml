  First, I need to identify the core challenge: how to assign individual moral responsibility when each act seems insignificant but the collective impact is harmful. The user explicitly wants no rehashing of standard defenses - this is about building a comprehensive evaluative framework. 

  The key elements to cover seem to be:
  - Critical case types (thresholds, overdetermination, imperceptible effects)
  - Crucial distinctions (no difference vs not wrong; expected vs actual difference; collective vs individual duty)
  - Pressure points between competing desiderata
  - The most powerful objection against common positions

  Hmm, the user's examples reveal deeper philosophical tensions. The "one burger" argument touches on causal inefficacy, while voting connects to symbolic value. The emissions example blends both. The firing squad case will test overdetermination, while water torture scenarios challenge imperceptible harm accumulation. 

  I should structure around non-negotiable requirements versus contested ones. Non-negotiables would include avoiding the "no difference" fallacy and handling threshold cases. Contestable points might involve whether expected consequences or actual differences matter more. 

  Major pressure points emerge when considering:
  - How to value tiny probabilities without demanding excessive sacrifice (the charity problem)
  - Reconciling overdetermination cases with actual difference requirements
  - Balancing collective responsibility with individual accountability

  The voting case is particularly thorny - it combines low efficacy with high symbolic importance. Meanwhile, the water torture scenario forces us to confront whether imperceptible contributions can be culpable. 

  For the knockout punch against complacency arguments, the threshold requirement seems strongest. It directly counters "no difference" claims by showing how individual acts can trigger catastrophic outcomes, even if probabilistically. This remains powerful regardless of whether one adopts consequentialist or deontological premises. 

  The user's frustration with superficial debates suggests they need this framework to preemptively dismantle common objections. By mapping tensions systematically, the paper can show why simplistic "my act changes nothing" arguments fail across ethical paradigms.
answer: |-
  Here is the full specification of desiderata for theories of individual obligation in collective harm cases, with pressure points and the most potent requirement identified upfront:

  **The most effective requirement against complacency arguments is the Threshold Sensitivity requirement, as it forces the acknowledgment that individual acts *can* become decisive in critical real-world scenarios, directly countering the "no difference" claim.**

  ### Non-Negotiable Desiderata (Cases/Considerations Forcing Them)
  1.  **Threshold Sensitivity:** Must explain obligations in cases where an individual act *could* trigger a catastrophic threshold (e.g., tipping an overloaded bus; casting the decisive vote in a tied election; a farmer's last straw breaking a camel's back). Failure here renders the theory unable to address climate tipping points or electoral margins. *(Forced by: Trigger Cases)*
  2.  **Imperceptible Harm Accountability:** Must assign responsibility for acts contributing to aggregate harm, even when each act's effect is imperceptible (e.g., each drop in water torture; each infinitesimal contribution to atmospheric CO₂). Failure licenses widespread harm via fragmentation. *(Forced by: Drops-of-Water/Imperceptible-Effects Cases)*
  3.  **Avoiding the "No Difference" Fallacy:** Must not collapse "My act makes no (causal) difference" into "My act is not wrong." The theory must provide wrong-making features beyond *actual* causal difference. Failure legitimizes all overdetermined harm and imperceptible contributions. *(Forced by: Firing Squad & Imperceptible Effects Cases)*
  4.  **Collective-Individual Link:** Must bridge the duty of "us" (collective obligation to avert harm) and the duty of "each" (individual obligation). It must explain why individuals aren't off the hook merely because others *might* act or fail to act. *(Forced by: The structure of collective harm problems like climate change)*

  ### Contestable Desiderata (Reflecting Different Camps)
  5.  **Ex Ante vs. Ex Post Difference:**
      *   *Consequentialist Taste (Ex Ante Expected Difference):* Obligation must cash out in the reasonably expected consequences of the act (e.g., voting's low probability of being decisive still generates an obligation). *(Requirement for: Standard Consequentialism)*
      *   *Purist Taste (Ex Post Actual Difference):* Genuine obligation requires the act *actually* made/would make a difference to the outcome (e.g., only the actual decisive voter acted wrongly in a firing squad if the outcome was overdetermined). *(Requirement for: Actual Difference Purism)*
  6.  **Maxim Universalizability:** *Kantian Taste:* An act is wrong if its maxim cannot be universalized without contradiction or undermining the purpose (e.g., "I will fly for convenience" cannot be universalized in a climate crisis). *(Requirement for: Kantian Deontology)*
  7.  **Tiny Probabilities & Excessive Demands:** *Consequentialist/Moderate Taste:* Must avoid making *every* act with a tiny positive expected utility obligatory (e.g., spending all income on mosquito nets). Must allow reasonable personal projects. *(Requirement for: Plausible Consequentialism)*
  8.  **Practice vs. One-Off Distinction:** Some theories may weigh the symbolic/participatory nature of *ongoing practices* (diet, driving) differently from isolated *one-off acts* (voting in one election). *(Consideration: Nature of the act in social context)*

  ### Pressure Points (Where Desiderata Strain Against Each Other)
  *   **Tiny Probabilities (5a) vs. Excessive Demands (7):** Taking vanishingly small probabilities of causing significant harm (e.g., one flight contributing minutely to a climate threshold) seriously *can* obligate near-constant sacrifice unless moderated by (7). Consequentialists struggle to balance expected utility with reasonable partiality here.
  *   **Firing Squad (Overdetermination) vs. Actual Difference Purism (5b):** Purism (5b) often absolves individuals in overdetermined harms (firing squad, crowded bus) since no single act was necessary. Yet this clashes with intuitions of complicity and the non-negotiable **Imperceptible Harm Accountability (2)**, as overdetermination is a limit case of imperceptible contribution. A theory satisfying (2) must reject strict (5b).
  *   **Threshold Sensitivity (1) vs. Actual Difference Purism (5b):** (5b) denies obligation *unless* the agent is actually decisive. (1) requires obligation based on the *possibility* of being decisive *ex ante*. These are fundamentally incompatible approaches.
  *   **Kantian Universalizability (6) vs. Expected Difference (5a) & Actual Difference (5b):** Kantian wrongness stems from the maxim's form, not consequences. An act can be wrong for Kantians even if it *ex ante* causes no expected harm and *ex post* causes no actual harm (e.g., a lie that accidentally helps). This decouples obligation from difference-making entirely, conflicting with consequentialist foundations (5a) and purist intuitions (5b).
  *   **Collective-Individual Link (4) vs. "No Difference" Fallacy Avoidance (3) vs. Practice Distinction (8):** Explaining *why* an individual has an obligation when "us" has a duty, especially for one-off acts like voting where both perceived difference and participation are contested, without relying *solely* on expected difference or collapsing into pure symbolism, is a core challenge.

  ### The Most Potent Requirement: Threshold Sensitivity (1)
  This requirement does the most work against standard complacency arguments ("one burger/flight/vote makes no difference") because:
  1.  **Direct Counterexample:** It provides clear, intuitive cases (e.g., the decisive vote, the tipping bus) where an individual act *obviously* can be decisive, shattering the universal claim that "one never matters."
  2.  **Probabilistic Relevance:** Even in non-tied scenarios (elections, climate thresholds), it forces recognition that individual acts contribute to the *probability* of crossing a threshold. Ignoring this because one isn't *certain* to be decisive is reckless.
  3.  **Applies to Key Cases:** It directly targets the core examples (voting, climate impact) used in the arguments against reducing flights/meat, showing they *are* threshold-sensitive systems.
  4.  **Paradigm-Neutral Strength:** Its force is largely independent of meta-ethical commitments. Consequentialists see probabilistic thresholds; Deontologists see duties not to risk catastrophe; even Purists must confront the reality of potential decisiveness. It exposes the core empirical error in the "no difference" claim.
