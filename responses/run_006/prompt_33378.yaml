  The game theory framing is sharp. Commitment races are brutal because they weaponize sunk costs—each invested resource becomes a reason to invest more. The mutual disaster outcome feels inevitable precisely because backing down seems costlier than continuing, even as the cliff edge approaches. But in reality, there are always off-ramps; they're just psychologically hard to see when you're in the thick of it. 

