  ok so i'm teaching this upper-level undergrad seminar on weakness of will and rational choice this semester, and honestly the timing is kind of absurd — i've been trying to quit vaping for like six months and every night i go to bed thinking "tomorrow i'm done" and every morning by 10am i'm at the shop. so i've been reading the akrasia literature not just as a teacher but as a, uh, participant-observer. really puts davidson in a new light when you're living it.

  anyway the final exam is in three weeks and i need one essay question that actually separates the students who get it from the ones who memorized the syllabus. the course covers the standard philosophical stuff (socrates, aristotle, davidson on akrasia) and then the behavioral econ stuff on hyperbolic discounting, preference reversal, and whether the beta-delta model gives us a mechanism for weakness of will. a lot of my students are smart but they tend to write answers that say "hyperbolic discounting explains akrasia because it shows why people choose the smaller-sooner reward despite preferring the larger-later one." and i want to push them past that — i want them to actually ask whether a model of preference reversal counts as an explanation of akrasia, or whether it just mathematically redescribes the phenomenon while leaving the normative question untouched. because akrasia isn't just "i changed my mind about what i want," it's "i did the thing i judged i shouldn't do." and it's not obvious that discount functions tell you anything about judgment.

  so here's what i need from you:

  1. the exam question itself — phrased so a student can't just recite definitions, they have to take a position and defend it. it should fit a 90-minute exam slot, maybe 800-1000 words expected.

  2. a model answer, maybe 600-700 words, that shows what a top answer does.

