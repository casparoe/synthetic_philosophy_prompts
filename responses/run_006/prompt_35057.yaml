  4. at the end, tell me how confident you are in the model answer overall (like, high/medium/low with a sentence) and identify the single point in it you're least sure about — the move you think is genuinely contestable.

  no need for citations, i'll handle those. and don't worry about making the prompt sound polished, i'm writing this at 1am after grading twenty papers on the principle of continence so if there's a typo or two, whatever.
