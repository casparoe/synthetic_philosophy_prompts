  Breaking it down: The practice assumes aesthetic testimony can justify beliefs. But direct acquaintance is often seen as necessary. So, is the user suggesting we're all being inconsistent? Probably. The examples (97% critics vs. 63% audience) highlight group differences, which complicates treating scores as truth-tracking. 

  For the testimony part, I should consider optimist vs. pessimist views. Optimists think testimony works here; pessimists don’t. The user’s scenario leans toward pessimism because people revert to subjectivity during disagreements—implying they don’t truly see scores as conveying aesthetic truth. 

  Could scores just be practical tools? Like predicting enjoyment or managing time? That’s a strong angle. People might use scores pragmatically while holding subjectivist views. No belief about merit, just heuristics. This resolves the inconsistency: scores aren’t about "goodness," they’re about efficiency. 

  If aesthetic testimony is impossible, we’d need alternative practices. Maybe scores shift to track enjoyment correlation or demographic alignment. "Users like you" instead of "this is good." Or abandon scores for personalized filters. The user might appreciate this as a solution—keeping the utility without the philosophical baggage. 

  The user’s last question is key: must we abandon scores? Not if we redefine their purpose. But it’d require cultural change, which is hard. Still, feasible. I’ll emphasize that in the response. 

  Also, the user didn’t mention but might care about: Are critics’ judgments different from laypersons’? Does expertise matter here? Maybe, but the answer stays similar—testimony’s role is contested regardless. 

  Overall, the user seems to want a clear framework to reconcile behavior with philosophy. My job is to show options without oversimplifying. Their intelligence suggests they’ll grasp nuances like "heuristic" vs. "testimonial belief." I’ll avoid jargon but not shy from terms like "epistemic justification" since they used them. 

  Final thought: The inconsistency they observe is real but resolvable. Either we’re all confused optimists, or (more charitably) we use scores pragmatically while knowing aesthetics are subjective. The latter is defensible and coherent. That’s the satisfying answer.
answer: |-
  The tension you describe exposes a deep philosophical puzzle about aesthetic testimony. Let's break down the presuppositions, reinterpretations, and alternatives:

  ### 1. **Presupposed Theory of Aesthetic Testimony**
     - **Optimism with Conditions**: The practice assumes *moderate optimism* about aesthetic testimony. Users act as if aggregated scores provide *defeasible justification* for believing a work has certain aesthetic qualities. This view holds that:
       - Aesthetic properties can be intersubjectively assessed (though not perfectly objective).
       - Expertise and consensus confer reliability (e.g., 100 critics' judgments are seen as more reliable than one).
       - Testimony can *guide* belief ("this film is probably well-crafted") without replacing direct experience for full appreciation.
     - **Anti-Pessimist Commitment**: It implicitly rejects *strong pessimism* (the view that aesthetic testimony is *never* epistemically justified). If users truly believed no testimony could justify aesthetic beliefs, aggregated scores would be irrational.

  ### 2. **Can the Practice Be Reinterpreted Without Aesthetic Belief?**
     Yes, in three plausible ways:
     - **Pragmatic Time-Allocation Tool**: Scores serve as efficiency filters in an attention-scarce world. Clicking a 97% score isn't a belief that "this is good" but a bet that it's *worth my time* relative to alternatives. This requires no commitment to aesthetic truth-tracking.
     - **Enjoyment Proxy**: Users might interpret scores as predictors of *personal enjoyment*, not objective merit. A high score signals statistical likelihood of alignment with mainstream taste (e.g., "I usually like what 80%+ audiences like").
     - **Social Coordination Mechanism**: Scores facilitate shared cultural experiences ("Everyone's watching this, so I should too"). The value lies in participation, not aesthetic judgment.

  ### 3. **Is Optimism Consistent with Invoked Subjectivism?**
     - **Superficially Inconsistent, Psychologically Coherent**: When users say "taste is subjective" after disagreeing with a high-scored work, they reveal a *qualified optimism*:
       - They accept testimony as a *default heuristic* for unseen works.
       - When direct experience conflicts, they privilege their own judgment and dismiss consensus as "irrelevant to *my* experience."
     - **Hidden Assumption**: This implies a subjectivist view where testimony identifies *probable crowd-pleasers*, not universal truths. The "subjectivity" defense arises when the crowd-pleaser fails for them.

  ### 4. **If Aesthetic Testimony Were Impossible: Alternative Practices**
     Assuming no testimony can justify aesthetic beliefs, we could reconstruct review aggregation as:
     - **Personal Taste Algorithms**: Platforms like Letterboxd already do this. Scores shift from "quality" to "match probability." ("Users with 90%+ taste overlap rated this 4.5/5").
     - **Descriptive Metrics, Not Evaluative**:
       - **Consensus Strength**: How *divided* are critics? (e.g., "Critics range from 1–5 stars" vs. "All 4 stars").
       - **Genre/Feature Tags**: "Contains complex pacing + moral ambiguity" (descriptive data letting users self-select).
       - **Enjoyment Correlation Scores**: "85% of viewers who dislike jump scares hated this."
     - **Abolition of Aggregated Scores**: Replace with:
       - **Curated Expert Samples**: Full reviews from 3–4 critics whose tastes align with yours.
       - **Anti-Consensus Tools**: "Show me highly divisive films" or "Films critics hate but audiences love."

  ### Conclusion
  The practice **presupposes moderate optimism** but survives as a *pragmatic heuristic* even under subjectivism. If aesthetic testimony were impossible, aggregated scores could evolve into **personalized predictive tools** or **descriptive analytics**—abandoning claims about objective merit. Crucially, this wouldn’t end review aggregation; it would reframe it as a *consumer guide* rather than a *truth-tracking mechanism*. The persistence of "subjectivity" disclaimers suggests users already intuit this tension, defaulting to scores for efficiency while reserving the right to personal aesthetic sovereignty.
