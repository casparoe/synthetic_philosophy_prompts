  The residue report should highlight where translation fails. Intent is the big one—philosophers' requirement for conscious intent doesn't map to ML. Also, "aboutness" of beliefs and normative aspects (should we treat it as deception?) don't fit. But maybe ML doesn't need those; operational definitions might suffice for safety.

