  Let me try to peel back the layers on Williams's integrity objection as you’ve requested, focusing on the conceptual core beneath the examples. The heart of the matter isn’t just about demandingness or neglecting special obligations—though those are neighbors—but about a fundamental clash between consequentialism’s structure and the conditions for a coherent personal identity.

  **The Weight-Bearing Notion of Integrity:**  
  For Williams, integrity isn’t merely honesty or consistency. It’s the capacity to live as an integrated self, where certain commitments are so deeply woven into your identity that abandoning them wouldn’t just be sacrificing a preference—it would fragment your sense of who you are. These "ground projects" (like a scientist’s commitment to truth, or a spouse’s devotion) aren’t just strong preferences; they *constitute* the agent’s practical standpoint. They’re the framework through which you perceive and engage with the world, making them non-negotiable in a way that preferences, however intense, are not. Consequentialism fails by treating these projects as *external inputs* to be weighed—like heavy stones in a utilitarian scale—when in reality, they’re part of the scale itself. To demand an agent sacrifice a ground project for the greater good isn’t just costly; it asks them to betray the very perspective from which "good" has meaning *for them*. This reduces the agent to a neutral channel for outcomes, alienating them from their own actions.

  **The "One Thought Too Many" and Its Bite:**  
  Take the drowning wife case. The problem isn’t the husband’s action (saving his wife) or even that he might acknowledge a general obligation to save lives. The objection strikes at the *justificatory stance*. If the husband pauses to affirm an impartial principle ("Saving her is permissible because familial bonds maximize utility overall"), that very thought—its *content* and *timing*—reveals a pathological detachment. The moral defect lies in the fact that he needs an impartial rationale *at all* in that moment. His commitment to his wife should render such justification unnecessary; it should operate as an immediate, non-negotiable motive. The "one thought too many" exposes that consequentialism has colonized his inner life, forcing him to validate his deepest attachments through an external calculus. It’s not the act of justifying *per se*, but that the justification reframes his love as a contingent instrument of the impersonal good.

  **Why George the Chemist Deepens the Objection:**  
  While the wife case highlights alienation in personal relationships, George the chemist (who refuses a weapons job despite financial pressure and potential utility gains) isolates a different facet: integrity as vocational identity. George’s refusal stems from a project intrinsic to his self-conception—his commitment to non-harm through chemistry. Williams’s point here is that consequentialism cannot recognize the *expressive* value of such refusal. For utilitarianism, George’s act is a mere failure to maximize good; for Williams, it’s George affirming who he is. The case emphasizes that ground projects aren’t just about intimate bonds but about the agent’s *autonomy* in defining their life’s shape. Sacrificing George’s project doesn’t just deprive him of happiness; it voids his agency, turning him into a site for optimizing outcomes rather than a source of value.

  **Can Impartialism Accommodate This?**  
  This is where the structural rupture becomes clear. An impartialist theory *might* try to "price in" the psychological costs of alienating agents or the disutility of shattered identities—but this still instrumentalizes integrity. It treats the agent’s deepest commitments as *data for the system*, not as sources of normative authority. Williams’s argument shows that consequentialism, by its very architecture, must subordinate all reasons to an overarching impartial good. To truly accept his critique, impartialism would need to concede that some reasons—those tied to ground projects—arise from the agent’s perspective in a way that resists subsumption under impartial rankings. This demands a structural shift: morality must recognize *agent-relative* reasons that aren’t merely derivatives of agent-neutral ones. The disagreement is thus metaphysical: Is value fundamentally located in states of affairs (to be impartially promoted), or does it also emerge from the situated perspectives of agents living out their commitments? Williams insists on the latter, arguing that without this, morality becomes a force of dissolution rather than a framework for life.

  The core, then, is this: Consequentialism doesn’t merely ask too much; it misunderstands *what it is asking*. It demands we treat our constitutive projects as disposable, rendering us strangers to ourselves. Integrity, in this view, is the casualty of a moral system that cannot see why some choices aren’t up for bargaining—because to bargain them is to erase the self that bargains.
