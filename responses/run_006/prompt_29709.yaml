  Hmm, they're asking for desiderata - the essential requirements any adequate theory must satisfy. They listed several intuitive demands: respecting Pareto improvements, taking vNM cardinality seriously, explaining interpersonal weights, handling ex ante vs ex post fairness, and deciding if social ranking should satisfy vNM axioms. 

  Ah, and crucially they want to know which combination is impossible - they vaguely recall tension between ex ante respect, ex post fairness, and social vNM representation. I should unpack that carefully. 

  First I need to organize these demands systematically. The Pareto requirements (improvements and indifference) feel non-negotiable - rejecting them would allow harming everyone without justification. Cardinal comparability is trickier; while vNM gives us cardinal utilities, interpersonal weighting remains the elephant in the room. 

  The ex ante/ex post divide is where things get spicy. The user's intuition is correct - if we demand all three: (1) respecting individual risk attitudes ex ante (2) ex post fairness like equality (3) social vNM representation - we hit impossibility. Mongin's theorem shows this formally. 

  I should illustrate with that cancer drug example - where respecting individual risk tolerance conflicts with ex post equality when aggregating. That'll make the tension visceral. 

  For the vNM social representation point, I should emphasize it's a choice - Harsanyi assumes it, but we might reject it to avoid utilitarianism. The weights issue is profound too; Harsanyi leaves them arbitrary, which is why it's not full utilitarianism. 

  The response should feel like a letter - continuous prose, conversational but precise. I'll start with the non-negotiables (Pareto), build to the trilemma, and end by clarifying where Harsanyi leaves room (the weights). The cancer example will anchor the impossibility. 

  Key is to show why the impossibility matters: it forces tradeoffs between fairness and respecting preferences. That's what the seminar debates are really about. The user wants the map of the battlefield - where the trenches are dug and why.
answer: |-
  My dear colleague,

  Your frustration is palpable and profoundly understandable—that seminar sounds like it circled the very heart of the dilemma without quite landing the blow. You’re right to demand clarity on the bedrock requirements *before* wading deeper into the Harsanyi fray. Let’s lay out the desiderata for a theory of social choice under risk, grounding each in the concrete dilemmas that make it matter, and then see where the tensions—and outright impossibilities—truly lie.

  First, the non-negotiables. Any theory worthy of consideration **must respect Pareto improvements**. If every single individual strictly prefers lottery A to lottery B, then society must rank A above B. To deny this is to sanction the deliberate choice of an option everyone finds worse, which is indefensible for a collective decision procedure. Imagine a choice between two public health programs: one saves lives with certainty, the other saves fewer lives with the same resources due to inefficiency. If everyone prefers the first, society *must* choose it. This is less a controversial axiom and more a minimal condition for coherence. Closely related, and often bundled with it, is **Pareto indifference**: if everyone is indifferent between two lotteries A and B, society must be indifferent too. While seemingly innocuous, this is where much of the Harsanyi debate ignites, as we’ll see. Rejecting Pareto indifference allows society to impose strict rankings where individuals see no difference, raising serious questions about paternalism or the source of social values beyond individual welfare.

  Next, cardinality. Any adequate theory **must take the cardinal structure of vNM utilities seriously**. The vNM theorem tells us that rational preferences over lotteries *are* captured by cardinal utilities, unique up to affine transformations. Ignoring this cardinal information—treating vNM utilities as mere ordinal ranks—discards the very essence of choice under risk. It throws away how individuals *trade off* risk and reward. Consider two individuals facing a lottery for a life-saving drug: Alice is risk-averse regarding her survival chance, Bob is risk-seeking. Using only ordinal ranks, we couldn’t distinguish their intensity of preference or their risk attitudes when aggregating. A theory that flattens vNM utilities to ordinals fails its core task. This is widely accepted; the fight is over *how* to use this cardinal information.

  This brings us to the thorniest demand: **it must provide a non-arbitrary account of interpersonal comparisons of utility**. Harsanyi’s theorem brilliantly derives a *linear* social aggregation rule: Social Welfare = Weighted Sum of Individual Utilities. But it treats the weights as exogenous. Where do they come from? Are they based on empathy, fundamental interests, resources, moral worth? A theory that simply *assumes* weights is smuggling in its moral conclusions. Imagine a society deciding between policies benefiting primarily the severely disabled or the mildly inconvenienced. Assigning equal weights implies one moral stance; assigning weights based on capacity for enjoyment implies another. A satisfying theory must either justify specific weights or show how they emerge rationally from the aggregation process itself. This is where many critiques of Harsanyi-as-utilitarianism land—his framework *allows* utilitarianism (with equal weights) but doesn’t *demand* it. The weights remain the open parameter, the hole where normative philosophy must enter.

  Now, the temporal and structural tensions. **It must grapple with the ex ante / ex post fairness distinction**. Ex ante fairness focuses on the initial lottery: are the *prospects* offered to individuals fair, given their own risk attitudes? Ex post fairness focuses on the realized outcomes: once the lottery is run, is the resulting distribution of goods just? These can clash dramatically. Suppose two individuals with identical vNM utility functions over wealth must choose between: Lottery A (each gets $50 for sure) or Lottery B (a fair coin flip: one gets $100, the other gets $0). Ex ante, both might be indifferent between A and B (same expected utility). Ex post, outcome (100, 0) seems unfair compared to (50, 50). A theory prioritizing ex ante fairness might endorse B if individuals accept the gamble; a theory prioritizing ex post fairness might insist on A. Neither answer is obviously wrong, but a complete theory must take a stand on *why* it prioritizes one perspective over the other, or how it balances them. Ignoring this distinction often underlies intuitive discomfort with pure utilitarian aggregation under risk.

  Finally, the meta-demand: **it must decide whether the social preference ordering itself needs to satisfy the vNM axioms**. Harsanyi assumes it does. This is crucial because it forces the social ordering to be representable by a *linear* social utility function over lotteries. Combined with Pareto indifference and the independence axiom, this linearity is what drives the additive utilitarian form. But is this assumption justified? Must *society* be "rational" in the same vNM sense as individuals? Critics argue this imposes an implausible "collective rationality." For instance, the vNM independence axiom requires that if society prefers lottery A to B, it must also prefer a mixture of A and C to the same mixture of B and C, for any lottery C. This might seem reasonable for an individual but problematic for society. Suppose society prefers a slightly unequal distribution (A) to a very unequal one (B). Mix both with a lottery (C) that risks catastrophic inequality. Society might rationally prefer the mix containing A *less* than the mix containing B, fearing that combining A with C creates a worse *kind* of risk (e.g., amplifying systemic injustice) than combining B with C. Rejecting social vNM rationality opens the door to non-linear (e.g., maximin, leximin) or context-dependent social orderings.

  **Now, the impossibility you sensed is real, and it strikes at the heart of these demands.** It’s captured rigorously in results like Mongin’s theorem. The conflict arises precisely when you insist on three things simultaneously:

  1.  **Ex Ante Pareto Indifference (Strong Pareto Respect):** If all individuals are indifferent between two lotteries, society is indifferent.
  2.  **Ex Ante Respect of Individual Risk Attitudes:** Social preferences over lotteries respect the *cardinal* vNM preferences of individuals (implicit in using their vNM utilities meaningfully).
  3.  **Ex Post Prioritarianism (or Strong Egalitarianism):** Social evaluation cares about the *distribution* of final outcomes, not just the sum. Specifically, society sometimes prefers a lottery A to B even if everyone has the same *expected* utility under both, because A leads to a more equal distribution *in every possible state of the world*.

  Here’s the cancer drug example that makes it bite. Imagine two patients with identical, life-threatening cancer. Drug X cures Patient 1 with 50% chance and does nothing for Patient 2, or cures Patient 2 with 50% chance and does nothing for Patient 1 (a fair coin decides who gets cured). Drug Y gives each patient a 50% chance of being cured *independently*. Assume both patients are risk-neutral over their own survival (so vNM utility = probability of cure).

  *   **Ex Ante Individual Perspective:** Each patient is indifferent between X and Y. Under X, each has a 50% chance of being the one cured. Under Y, each has a 50% chance of being cured independently. Expected utility is 0.5 for each patient under either lottery.
  *   **Ex Ante Pareto Indifference & Respect for Risk Attitudes:** Since both patients are indifferent between X and Y, society must be indifferent (Pareto indifference). Respecting their risk attitudes means using their vNM utilities (probabilities) directly.
  *   **Ex Post Prioritarianism/Egalitarianism:** Now look at the possible outcomes:
      *   Under X: Only two possible states: (Cured, Not Cured) or (Not Cured, Cured). Always one cured, one not. Highly unequal.
      *   Under Y: Four possible states: Both cured (probability 0.25), Patient 1 cured only (0.25), Patient 2 cured only (0.25), Neither cured (0.25). There's a 25% chance of perfect equality (both cured) and a 25% chance of the worst inequality (both die, but the inequality between them is zero! Though total welfare is low). Crucially, there is *no state* under Y where one is cured and the other is not *without* the possibility of other, better or worse, states also occurring. A strict ex post egalitarian might *always* prefer the outcome of Y to the outcome of X in any comparable state because Y offers chances for equality that X never does, and avoids the guaranteed pairwise inequality of X. They might strictly prefer Y to X *socially*, even though the patients are indifferent.

  **The Contradiction:** Ex Ante Pareto Indifference + Respect for Risk Attitudes forces social indifference between X and Y (since individuals are indifferent). But strict Ex Post Egalitarianism forces a strict social preference for Y over X (or possibly X over Y, depending on the egalitarian metric). Something has to give. You cannot simultaneously satisfy all three demands. This is the core tension between respecting individual sovereignty over risk (ex ante Pareto, respecting vNM) and achieving certain notions of distributive justice that care intrinsically about realized outcomes (ex post fairness).

  **Which requirement knocks out the most candidates?** Arguably, the demand for a **non-arbitrary grounding of interpersonal weights** eliminates the most superficially attractive options. Many proposed alternatives (like various forms of ex post aggregation) either implicitly assume equal weights without justification, or smuggle in weights based on unexamined moral intuitions. Pareto and cardinality are often accepted. The ex ante/ex post tension is where specific theories falter on impossibility or counterintuitive results.

  **Where does Harsanyi leave room?** Precisely in the weights! His theorem is a *structural* result: social preference must be a *linear* aggregation of individual vNM utilities if Pareto (including indifference) holds and social preferences satisfy vNM axioms. It does *not* specify the weights. Utilitarianism (equal weights) is one possibility, but weighted utilitarianism (reflecting different moral worth, capacity, needs, or prioritarian concerns) is equally consistent with the theorem's *mathematical* form. Rejecting social vNM rationality or Pareto indifference opens other doors (e.g., rank-dependent models, egalitarian ex post aggregation), but at the cost of violating the other desiderata you listed. The impossibility theorem shows the starkest price: you cannot seamlessly harmonize ex ante individual autonomy over risk with strong ex post distributional concerns without sacrificing one of the core aggregation principles.

  So, to navigate this, you must decide what you are willing to compromise. Is respecting individual risk attitudes, captured cardinally, sacrosanct even if it means accepting socially unequal outcomes? Or is achieving fairness in the final distribution so paramount that you must override or reinterpret individual risk preferences in the social calculus? Harsanyi’s framework provides a powerful, consistent structure if you accept its premises, but the weight of the interpersonal comparisons—and the choice between ex ante and ex post perspectives—remains the ground where the real philosophical battle is fought, long after the theorem is proved. Clarify your stance there, and the path through the thicket becomes clearer.

  Yours in the pursuit of clarity,  
  A Fellow Traveler
