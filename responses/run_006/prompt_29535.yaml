prompt: |-
  I've just done special relativity in physics and something's been bugging me. We learnt that whether two events are simultaneous depends on your frame of reference, and someone mentioned an argument that this means the future is already there, like a block. I get that different observers disagree about what's happening now, but I dont see how that forces the future to be real. The move seems to be: if an event is in my future, there's some other observer who says it's simultaneous with something in my present, and if that something is real then the future event must be real too. Could you walk me through that argument step by step and then say whether it actually works? I think it might be mixing up the fact that we can't say which events are simultaneous with the claim that the future exists already, but maybe I'm missing something. Also does the argument only work for events that are spacelike seperated, or does it end up covering everything? I'd rather have the intuition than loads of maths.
