  - Her strongest card is the *Humphrey objection*: transworld identity forces absurd existential commitments. If Humphrey exists in another world, what is he? A bare particular? That’s messy.  
  - Then *accidental intrinsics*: Transworld identity can’t handle properties like height changing across worlds without contradiction.  
  - Finally, *world-bound individuals*: This avoids ontological bloat. No duplicate Humphreys—just counterparts.  

  Kripkean (call him Ben) will counter:  
  - *Modal intuition*: We *mean* Humphrey himself when we say "Humphrey could’ve won." Counterparts feel like philosophical doubles, not the real thing.  
  - *Transitivity problem*: If counterpart relations aren’t transitive, you get absurd chains (e.g., Humphrey’s counterpart could’ve been a poached egg).  
  - *Essential properties*: Counterpart theory makes essence too flexible. If a counterpart relation can ignore origins, we lose Kripke’s rigid designators.  

  The dialogue needs these points to clash authentically. Alice should press Ben on how transworld identity handles accidental intrinsics without contradiction. Ben should attack counterpart theory’s failure to capture our intuition that *Humphrey himself* has possibilities.  

  For the pub vibe: mention a dying pint, crisps scattered on a sticky table. But keep it lean—no overdone scenery. The philosophy must bite.  

