  - A perfect computational simulation of every neuron in a Chinese speaker's brain: yes, that understands.
  - An ordinary human Chinese speaker: yes.
  - A giant lookup table mapping every possible Chinese input to a pre-written output: no.
  - A current LLM trained on internet text: no.

  She hasn't weighed in on this one yet, and I'm trying to figure out what she'll say: a system that learns language entirely through interaction with a rich simulated 3D world — it sees objects, picks them up, hears words paired with the things it's interacting with, and builds what sure look like grounded representations. Its architecture is a neural net, but it's nothing like a brain simulation. It handles novel situations flexibly. But there's no special reason to think it's conscious.

