  - best_guess_rule: which of the candidate rules you think she's actually running and why
  - closest_analog: which of her existing verdicts is the best precedent for the new case
  - distinguishing_case: a description of a further case (not among the existing seven or the new one) that would cleanly tell the candidate rules apart, with the predicted verdict under each rule
