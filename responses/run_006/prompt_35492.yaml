prompt: |-
  I'm a PhD candidate in metaethics, and I've been tutoring an upper-level undergraduate seminar on expressivism this term. The students can all recite the textbook definition of the Frege–Geach problem — that expressivism struggles to explain how moral language behaves in unasserted contexts like conditionals and negations — but when I push them in office hours, it becomes clear that most of them don't grasp why the problem is so stubborn. They conflate two distinct challenges: giving a compositional semantics for embedded moral claims, and explaining why inferences like modus ponens are valid when the premises are supposed to express attitudes rather than truth-conditional content. They also don't see why the problem bites even sophisticated forms of expressivism and not just crude emotivism.

  I want to write a final exam essay question that forces students to demonstrate they understand the structure of the difficulty, not just the labels. Please write the question, a model answer of about 600 words, and a marking scheme that separates an A-level answer from a B-level answer by naming the specific moves, distinctions, and arguments each must contain. As a last line, give a one-sentence summary of the crux the question is testing.
