answer: |-
  Below is a final exam essay question designed to force students to demonstrate deep structural understanding of the Frege-Geach problem, followed by a model answer, marking scheme, and the crux of the question.

  ---

  **Exam Question**  
  "Expressivism’s core commitment—that moral judgments fundamentally express non-cognitive attitudes rather than representing moral facts—generates two distinct but interlocking challenges in accounting for moral language in embedded contexts (e.g., conditionals, negations). Explain these *two challenges* in detail, showing why solving the first *does not automatically resolve* the second. Then, demonstrate why *even sophisticated expressivist theories* (e.g., Gibbard’s norm-expressivism, Blackburn’s quasi-realism) continue to face these challenges despite moving beyond crude emotivism. Conclude by articulating why this makes the Frege-Geach problem a *structural* issue for expressivism, not merely a technical oversight."

  ---

  **Model Answer (Approx. 600 words)**  
  The Frege-Geach problem exposes a fundamental tension in expressivism: moral language behaves identically to descriptive language in logically complex contexts, yet expressivism treats moral claims as expressions of attitudes (e.g., approval, plans) rather than truth-apt representations. This generates **two distinct challenges** that are often conflated but must be separated to grasp the problem’s intractability.  

  The **first challenge** is *compositional semantics*: explaining how the meaning of a moral term (e.g., "wrong") in unasserted contexts (e.g., "If stealing is wrong...") relates to its meaning in asserted contexts ("Stealing is wrong"). For descriptivists, "wrong" contributes the same truth-conditional content (e.g., the property of wrongness) in both cases. Expressivists, however, hold that "Stealing is wrong" expresses disapproval. But in the antecedent of a conditional, the attitude is not expressed—it is merely contemplated. Thus, expressivists must explain what semantic value "wrong" contributes in embeddings without invoking truth conditions or abandoning their core non-cognitive commitment. Blackburn’s solution (e.g., in *Spreading the Word*) posits higher-order attitudes (e.g., disapproval of tolerating stealing), but this merely relabels the problem.  

  Crucially, solving compositionality **does not resolve the second challenge**: *inference preservation*. Expressivism must explain why moral inferences, like modus ponens ("If stealing is wrong, then telling Mom is required; stealing is wrong; therefore, telling Mom is required"), are objectively valid. Descriptivism grounds validity in truth preservation: if the premises are true, the conclusion must be true. Expressivists reject truth-apt moral facts, so they cannot appeal to truth preservation. Instead, they must show how the *expression of attitudes* in premises *necessitates* the expression of the conclusion’s attitude. For example, Gibbard (in *Wise Choices, Apt Feelings*) analyses moral conditionals as expressing constraints on planning. But this reduces validity to psychological consistency: the inference is "valid" only if accepting the premises *causes* acceptance of the conclusion for a rational agent. However, logic demands necessary preservation across all possible agents, not contingent psychological compulsion. If validity rests on contingent attitudes, we lose the *objectivity* and *inescapability* of logical consequence—a cost expressivists cannot afford.  

  **Sophisticated expressivism fails for structural reasons**. Gibbard’s norm-expressivism and Blackburn’s quasi-realism avoid emotivism’s crudeness by developing complex systems (e.g., hyperplans, commitment states) to mimic truth-conditional logic. Yet they still face both challenges:  
  1. **Compositionality**: Assigning "wrong" a uniform semantic role across embeddings requires positing abstract objects (e.g., "properties" of attitudes) that risk collapsing into covert realism.  
  2. **Inference preservation**: Reducing logic to planning consistency or higher-order attitudes conflates *psychological* necessity with *logical* necessity. Validity becomes agent-relative, undermining the universality logic requires.  

  The problem is **structural** because it stems from expressivism’s non-representational core. Attitudes lack the stable, shareable, and mind-independent properties that truth-conditional content provides for compositionality and logic. Thus, expressivists face a dilemma: either (1) abandon non-cognitivism (by smuggling in truth conditions) or (2) accept that moral logic is merely "in the head," betraying its objective appearance. Neither preserves expressivism’s revolutionary promise. The Frege-Geach problem thus endures not due to technical immaturity, but because expressivism’s foundational commitments are incompatible with the demands of logical embedding.  

  ---

  **Marking Scheme**  
  **A-Level Answer (85–100%) Must Explicitly:**  
  1. **Distinguish both challenges**:  
     - Compositionality: Semantic uniformity of terms in asserted vs. embedded contexts.  
     - Inference preservation: Explaining objective validity (e.g., modus ponens) without truth preservation.  
  2. **Show interdependence**: Explain why solving compositionality (e.g., via higher-order attitudes) fails for inference (e.g., validity reduced to psychological consistency).  
  3. **Engage sophisticated expressivism**: Name and critique Gibbard and/or Blackburn (e.g., Gibbard’s plans → contingent validity; Blackburn’s quasi-realism → covert descriptivism).  
  4. **Identify structural issue**: Root the problem in expressivism’s rejection of truth-apt moral content and its implications for logic’s objectivity.  
  5. **Avoid conflation**: Never treat the two challenges as identical or solve both with one move.  

  **B-Level Answer (70–84%) May:**  
  1. **Describe both challenges** but blur distinctions (e.g., treat inference preservation as a subset of compositionality).  
  2. **Mention sophisticated theories** but not specify why they fail (e.g., "Gibbard tries but still has problems").  
  3. **Note expressivism’s core commitment** but not trace failures to its structure (e.g., "attitudes aren’t truth-conditional").  
  4. **Focus on emotivism** without explaining why the problem persists for refined versions.  

  **C-Level or Below (≤69%):**  
  - Repeats textbook definitions without analysis.  
  - Conflates challenges entirely.  
  - Ignores sophisticated expressivism.  
  - Claims the problem is "solved" without addressing logic’s objectivity.  

  ---

  **Crux of the Question:**  
  Expressivism’s non-representationalism creates two irreducible problems—semantic compositionality and logical validity—in embedded contexts, and their interdependence exposes a structural flaw immune to surface-level solutions.
