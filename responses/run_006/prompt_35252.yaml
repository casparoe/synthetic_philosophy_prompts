  Okay, the user is organizing a philosophy workshop where a reductionist and an anti-reductionist on testimonial justification are doing an adversarial collaboration. They need a draft document both parties can agree on after good-faith discussions. 

  First, I need to recall the core positions: the reductionist thinks testimonial justification always reduces to other sources like perception or inference, requiring positive reasons for reliability. The anti-reductionist sees testimony as a basic source, granting default entitlement unless defeaters exist. 

  The user wants a structured deliverable: agreed claims, a disagreements table, cruxes, and potential resolutions. The challenge is finding common ground while neutrally framing disputes. 

  For the agreements section, I should identify non-controversial points both sides accept despite their theoretical differences. These might include: 
  - Testimony being a distinct epistemic source in practice 
  - The need for hearer-side justification (addressing a common misconception) 
  - The role of defeaters being uncontested 
  - Rejecting gullibility as a consequence of either view 
  - Agreement that children acquire testimony-based knowledge, which hints at possible common mechanisms 
  - Consensus on what the debate isn't about (e.g., testimony's ontology or social function) 
  - Shared standards for progress like empirical work on default trust 

  The disagreements table needs careful wording. Key topics include: 
  - Default justification status: Is there prima facie entitlement? 
  - Nature of required reasons: Must they be speaker-specific? 
  - Developmental priority: Which comes first, default trust or learned monitoring? 
  - Burden of proof: Who must provide positive reasons? 
  For each, I'll draft statements each side would endorse, then assess if the dispute is substantive or partly verbal. For example, "default justification" might be partly verbal if "default" means different things (presumption vs. psychological bias). 

  Cruxes should highlight unresolved sub-questions where answers could shift positions, like: 
  - How do children actually treat testimony? 
  - What's the minimal cognition needed for testimonial uptake? 
  - How prevalent are defeaters in ordinary contexts? 
  Both sides might agree developmental psychology could inform these. 

  Finally, potential resolutions could include cross-cultural studies on trust or philosophical analysis of "default entitlement." I'll note these as cooperative next steps. 

  Throughout, I'll maintain neutrality—no implied "right" side—and flag any merely terminological disputes. The tone should reflect mutual respect from years of engagement.
answer: |-
  Here is a draft collaborative document designed for signatures by both the reductionist and anti-reductionist, reflecting substantive agreements, clarified disagreements, and paths forward, based on their adversarial collaboration:

  ---

  **Joint Statement on Testimonial Justification: Findings from Adversarial Collaboration**

  **Preamble:**  
  We, an epistemic reductionist and an epistemic anti-reductionist regarding testimonial justification, submit this document as a product of good-faith collaboration. We seek to clarify genuine agreements, diagnose persistent disagreements, and identify constructive avenues for progress, moving beyond unproductive stalemates in the literature.

  ---

  ### I. Substantive Points of Agreement  
  *Both parties endorse the following claims:*  

  1.  **Testimony as a Distinct Social Epistemic Practice:** Testimony is not merely a causal conduit for information but a *distinct epistemic practice* governed by social norms (e.g., sincerity, competence expectations). Its justification cannot be fully understood by treating it *solely* as a species of perception or inference.  
  2.  **Hearer Justification is Central:** The core debate concerns the *hearer's* epistemic justification for believing that p based on a speaker's testimony that p. It is not primarily about speaker justification or the metaphysics of testimony.  
  3.  **Defeaters are Uncontested:** Both positions acknowledge that testimonial justification, however initially acquired, is *defeasible*. The presence of undefeated defeaters (e.g., evidence of speaker insincerity, incompetence, or inconsistency) can render belief unjustified.  
  4.  **No Implication of Gullibility:** Neither position entails universal gullibility. Anti-reductionism permits defeaters to block justification; reductionism requires positive reasons (which can be minimal and context-sensitive).  
  5.  **Children Acquire Testimony-Based Knowledge:** Young children gain justified beliefs and knowledge via testimony *before* they possess sophisticated, explicit positive reasons for speaker reliability, independent of testimony itself. Any viable theory must account for this.  
  6.  **What the Debate is NOT About:**  
      *   *Not about Social Epistemology vs. Individualism:* Both agree social factors are crucial, but disagree on their *epistemic fundamentality* for the hearer.  
      *   *Not about Global Skepticism:* Neither position assumes or requires global skepticism about testimony; both affirm testimony as a reliable source of knowledge.  
      *   *Not about Conscious Reasoning:* Both agree the relevant cognitive processes (e.g., monitoring, reason-possessing) are often tacit and non-reflective.  
  7.  **Progress Requires:**  
      *   Engagement with empirical work (developmental psychology, cognitive science of trust, cultural anthropology).  
      *   Clarification of key concepts (e.g., "entitlement," "positive reason," "default," "source basicness").  
      *   Analysis of specific, nuanced cases (e.g., novice/expert dynamics, high-stakes/low-stakes contexts, culturally embedded testimony).

  ---

  ### II. Table of Persistent Disagreements  

  | Topic                      | Reductionist Position (Endorsed Wording)                                                                 | Anti-Reductionist Position (Endorsed Wording)                                                                                                                              | Substantive or Partly Verbal? | Explanation (if partly verbal)                                                                 |
  | :------------------------- | :------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------- | :--------------------------------------------------------------------------------------------- |
  | **1. Default Justification Status** | "A hearer is *not* justified *merely* in virtue of receiving testimony. Justification requires the hearer to possess (even tacitly) positive, non-testimonial reasons supporting the speaker's reliability in this context." | "Testimony provides *prima facie justification* or *entitlement*. A hearer is justified in believing a speaker *absent defeaters*, without needing antecedent positive reasons for the speaker's reliability." | **Substantive**               | Core disagreement on whether testimony *initiates* justification or *requires* prior grounding. |
  | **2. Nature of "Positive Reasons"** | "The required positive reasons must, *in principle*, be reducible to non-testimonial sources (perception, memory, induction) and must bear *specifically* on the speaker's reliability or the truth-tracking features of the testimony chain." | "While monitoring often occurs, the *justificatory basis* is not reducible. The default entitlement arises from the normative structure of the testimonial act itself. Reasons invoked are often *reactive* (to defeaters), not *constitutive*." | **Partly Verbal**             | Disagreement hinges on "reducible" (constitutive grounding vs. causal/psychological origin) and the *role* reasons play (constitutive vs. reactive). |
  | **3. Developmental Priority** | "Children's early testimonial learning depends on innate perceptual biases and rapid, implicit induction about caregivers' reliability, forming the *foundation* for positive reasons." | "Children's successful learning presupposes a *default entitlement* to trust caregivers; sophisticated reliability tracking is a later-developing *refinement* of a basic capacity." | **Substantive**               | Disagreement on the cognitive/epistemic primitive: Is it a monitoring *disposition* or a default *entitlement*? |
  | **4. Burden of Proof**     | "The burden lies with the hearer to possess (or be able to access/reconstruct) justifying reasons. Absent such reasons, belief is unjustified." | "The burden lies with defeaters. Absent defeaters, belief is justified. The hearer need not *possess* positive reasons to shift the burden." | **Substantive**               | Fundamental disagreement on the default epistemic stance towards testimony.                      |

  ---

  ### III. Cruxes: Key Sub-Questions for Progress  
  *Questions whose resolution could shift the debate; both agree on the relevance of proposed evidence/arguments:*

  | Crux Question                                                                 | Reductionist Prediction                                                                 | Anti-Reductionist Prediction                                                                 | Relevant Evidence/Argument (Agreed)                                                                 |
  | :---------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------- |
  | **1. How do pre-linguistic infants/very young children treat informants?**    | Early trust is based on perceptual cues and association; no evidence for normative entitlement. | Early trust reflects a proto-understanding of communication's normative role; evidence points to default acceptance. | Rigorous developmental studies dissecting cues (familiarity, emotional valence) from normative responses to communication acts. |
  | **2. What is the minimal cognitive requirement for testimonial uptake?**      | Requires some capacity for rudimentary source monitoring/reliability tracking, even implicit. | Requires only recognition of an act *as testimony* and absence of defeaters; minimal monitoring needed. | Conceptual analysis of "testimonial act" + empirical work on testimonial learning in cognitively impaired populations. |
  | **3. How prevalent/pervasive are undefeated defeaters in ordinary contexts?** | Defeaters (distrust cues, inconsistency awareness) are common and often tacitly operative. | Genuine defeaters are relatively rare; default trust prevails smoothly in most benign contexts. | Empirical studies on trust calibration in everyday life, cross-cultural variation in baseline trust. |
  | **4. Does "default entitlement" explain the *distinctiveness* of testimony?** | No; perception/memory also have "default" status, but their justification *is* reducible to their intrinsic properties/mechanisms. | Yes; testimony's normativity (sincerity, competence) is irreducible and foundational for its epistemic role. | Conceptual analysis comparing the "givenness" of perceptual experience vs. the normative uptake of an assertion. |

  ---

  ### IV. Proposed Joint Paths Forward  
  *Both parties agree that progress could be made by collaboratively exploring the following, previously underutilized approaches:*

  1.  **Cross-Cultural Ethno-Epistemology:** Systematically investigating whether baseline attitudes towards testimony (default trust vs. vigilant monitoring) vary significantly across cultures, and how this impacts epistemic practices and knowledge acquisition. *Both predict:* Variation exists but disagree on whether it shows cultural modulation of a default entitlement or cultural acquisition of different monitoring heuristics.
  2.  **Refined Conceptual Taxonomy:** Jointly developing a more precise vocabulary distinguishing:
      *   *Psychological default* (disposition to believe) vs. *Epistemic default* (prima facie justification).
      *   *Constitutive ground* (what makes the belief justified) vs. *Causal sustainer* (what cognitive process maintains it).
      *   *Positive reason* (evidence *for* reliability) vs. *Absence of defeaters* (lack of evidence *against*).
  3.  **"Minimal Testimony" Cases:** Analyzing highly constrained thought experiments involving agents with extremely limited cognitive capacities interacting with testimony, to isolate the bare bones of justification. (e.g., AIs programmed only to recognize assertions and check for internal consistency, or agents with severe amnesia in isolated testimonial exchanges).

  ---

  **Signatures:**  
  _________________________ (Epistemic Reductionist)  
  _________________________ (Epistemic Anti-Reductionist)  
  Date: ___________________

  ---

  **Key Features Reflecting Collaboration:**

  1.  **Neutral Framing:** Positions are stated in each side's own endorsed terms within disagreements. Agreements focus on common ground and shared meta-understandings.
  2.  **Diagnosing Verbal Disputes:** Explicitly flags where disagreements hinge on differing interpretations of key terms (e.g., "reducible," "positive reason," "default") and clarifies the substantive residue.
  3.  **Substantive Agreements:** Moves beyond trivialities to capture nuanced consensus points discovered through collaboration (e.g., distinct practice, uncontested defeaters, children's knowledge, non-gullibility).
  4.  **Action-Oriented Cruxes:** Identifies specific questions whose answers could change minds, with agreed-upon types of evidence/argument.
  5.  **Constructive Forward Path:** Proposes concrete, novel collaborative research directions both endorse as potentially fruitful.
  6.  **Respectful Tone:** Presents both views as serious intellectual positions engaged in a shared project of understanding testimony.

  This draft provides a substantive foundation for their reaction and further refinement, demonstrating genuine progress through the adversarial collaboration process.
