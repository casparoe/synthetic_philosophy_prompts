answer: |-
  ### The Principle of Deference to Objective Chance

  Your cases reveal a tension between deferring to known objective chances and incorporating other information. The core principle that best reconciles your verdicts is a refined version of the **Principal Principle**, which incorporates the concept of **admissible evidence**. This principle is widely used in formal epistemology to handle cases like yours. I'll state it clearly, apply it to your unsettled case, and then address its limitations.

  #### The Principle: Principal Principle with Admissibility
  - **Core idea**: When you know the objective chance of an event at a specific time \(t^*\) is \(p\), your credence in that event should be \(p\), **unless** you possess **inadmissible evidence**—information that bears directly on the outcome in a way that isn't already captured by the chance itself.
    
  - **Formal statement**:
    \[
    \text{Cr}(A \mid \text{ch}_{t^*}(A) = p \land E) = p
    \]
    provided \(E\) is **admissible** with respect to \(A\) at \(t^*\).
    
  - **What makes evidence admissible?** Evidence is admissible if it is:
    - **About events up to or at \(t^*\)** (the time the chance is set), or
    - **Screened off** by the chance (i.e., it provides no additional information about the outcome beyond what the chance already implies).
    
    Evidence is **inadmissible** if it:
    - Concerns events after \(t^*\) (e.g., predictions, delayed effects, or outcomes of dependent processes), and
    - Provides information about the outcome that the chance doesn't account for.

  - **How to apply**:
    1. If you know the chance at \(t^*\) and have no inadmissible evidence, set your credence to \(p\).
    2. If you have inadmissible evidence, condition on it using standard probability rules (e.g., Bayesian updating).
    3. If the chance is unknown (e.g., biased coin cases), defer to estimated chances or use Bayesian methods—this isn't direct deference to a known chance.

  #### How It Captures Your Cases
  1. **Fair coin about to be flipped**: Chance is known (50%), no inadmissible evidence → credence 50%.  
     - *Admissibility*: No information beyond \(t^*\) (flip time).
  2. **Coin flipped an hour ago, unobserved**: Chance at flip time \(t^*\) was 50%, no inadmissible evidence → credence 50%.  
     - *Admissibility*: The outcome is fixed but unknown; your evidence (nothing after \(t^*\)) is admissible. You defer to the historical chance.
  3. **Predictor with 1000-correct streak**: Chance is 50%, but the prediction is inadmissible → credence ~99%.  
     - *Admissibility*: The prediction concerns events after \(t^*\) (it's about the outcome) and isn't screened off by the chance. You condition on it, raising your credence.
  4. **Fair die, rolled or unobserved**: Chance known (1/6), no inadmissible evidence → credence 1/6.  
     - *Same reasoning as cases 1 and 2*.
  5. **Coin of unknown bias**: No known chance → not about deference. Your ~67% credence comes from estimating the chance (e.g., via Bayesian inference on the 7/10 heads), not from deference to a known value.

  **Resolution of the tension (cases 2 vs. 3)**:  
  - In case 2 (unobserved flip), you lack inadmissible evidence—the outcome is fixed, but you have no information about it. You defer to the known chance.  
  - In case 3 (predictor), the prediction is inadmissible—it’s evidence about how the event *will* turn out, so you abandon the chance and update.  
  - **No circularity**: "Direct evidence" isn't needed; admissibility is defined temporally (events after \(t^*\)) and functionally (unscreened by the chance). The predictor’s track record is evidence about *this flip* because it supports a reliable causal link (e.g., the predictor might exploit pre-flip conditions).

  #### Prediction for Your Unsettled Case
  **The case**: A fair coin is flipped behind a screen. You know:  
  - If heads, a bell rings with 90% probability.  
  - If tails, the bell never rings.  
  - You haven’t heard a bell.  
  **Question**: What should your credence in heads be?

  **Application of the principle**:
  - **Known chance at flip time \(t^*\)**: Heads had a 50% objective chance.
  - **Evidence**: "No bell heard." This is **inadmissible** because:
    - The bell-ringing is an event after \(t^*\) (it depends on the flip outcome).
    - It provides information about the outcome not captured by the 50% chance (e.g., it’s more likely if tails).
  - **Update using conditional probability** (Bayes' theorem):
    - \(H\): heads, \(T\): tails, \(B\): bell rings.
    - Given: \(P(B \mid H) = 0.9\), so \(P(\neg B \mid H) = 0.1\); \(P(B \mid T) = 0\), so \(P(\neg B \mid T) = 1\); \(P(H) = P(T) = 0.5\).
    - You observe \(\neg B\) (no bell).
    - Compute:
      \[
      P(H \mid \neg B) = \frac{P(\neg B \mid H) \cdot P(H)}{P(\neg B \mid H) \cdot P(H) + P(\neg B \mid T) \cdot P(T)} = \frac{0.1 \cdot 0.5}{0.1 \cdot 0.5 + 1 \cdot 0.5} = \frac{0.05}{0.55} \approx 0.0909.
      \]
  - **Prediction**: Your credence in heads should be **~9.1%**.

  **Why this works**: The no-bell evidence is inadmissible (post-\(t^*\) and outcome-relevant), so you don’t stay at 50%. Instead, you condition on it, lowering your credence in heads.

  #### Limitations and Honest Assessment
  - **Accommodates all your verdicts**: The principle explains your intuitions in all cases:
    - Cases 1, 2, and 4: No inadmissible evidence → defer to known chance.
    - Case 3: Inadmissible evidence (prediction) → update away from chance.
    - Case 5: No known chance → not covered by deference; handled by estimation.
    - Unsettled case: Inadmissible evidence (no bell) → update to ~9.1%.
  - **Where it might not fit intuitions**: Some argue that in past unobserved events (like case 2), the chance "collapses" to 0 or 1, so 50% is irrational. The principle rejects this, treating unknown past outcomes symmetrically with future ones—this is standard in Bayesian epistemology but controversial in some philosophies of time and chance.
  - **Caveats**:
    - **"Objective chance" isn't always authoritative**: If chances are defined relative to a physical theory (e.g., quantum mechanics), they may not apply to past events with fixed outcomes. However, your case 2 shows you *do* defer to chances for past unknowns, so the principle captures your stance.
    - **No single rule for all scenarios**: Deference to chance is one tool among many. In biased-coin cases (like your case 5), you must estimate chances first—deference only applies when chances are known.
    - **Admissibility isn't always clear-cut**: In complex cases (e.g., time travel or deterministic predictors), defining \(t^*\) or admissibility can be tricky. But your cases are straightforward.

  #### Conclusion
  The **Principal Principle with admissibility** cleanly handles your cases: set credence to the known chance unless you have inadmissible evidence (defined as post-\(t^*\) information not screened off), then update. For your unsettled case, it predicts **~9.1%** for heads. The principle accommodates all your verdicts, but rests on the assumption that objective chances are worth deferring to even for past unknowns—a defensible but not uncontroversial stance. If you reject this (e.g., by insisting past chances must be 0 or 1), the principle would need adjustment, but it fits your stated intuitions best.
