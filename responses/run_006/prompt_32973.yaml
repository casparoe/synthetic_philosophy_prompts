  ## Memo: Grant Recommendation - Epiphenomenalism Proposal

  **To:** Foundation Board  
  **From:** [Your Name/Position]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Grant Proposal: "Defending Epiphenomenalism: Addressing Foundational Challenges"  

  **Proposal Summary:** The applicant seeks funding for a one-year project to rigorously defend epiphenomenalism about phenomenal consciousness (the view that subjective experiences are causally inert byproducts of physical processes). The proposal is analytically sharp and engages deeply with core literature.  

  **Core Objection - The Paradox of Phenomenal Judgment:** Board Member A raises a significant concern: If conscious experiences lack causal power, how can they explain our *judgments* about them (e.g., "I feel pain")? This seems to undermine the very evidence for consciousness and risks self-defeating skepticism. The applicant addresses this, but Board Member A finds the response insufficiently rigorous ("hand-wavy").  

  **Engaging the Paradox Seriously:** This paradox is not a peripheral issue; it strikes at the heart of epiphenomenalism's plausibility. A robust defense *must* confront it. While the paradox is challenging, it is **precisely the kind of profound, persistent problem our foundation exists to support research on**. Dismissing a proposal *solely* because it tackles a difficult paradox sets a precedent against funding high-risk, high-reward philosophical inquiry. The applicant acknowledges the paradox and attempts a response – the critical question is whether their *proposed methodology* offers a credible path to a substantive defense or novel insight.  

  **Assessment of the Proposal's Approach:**  
  1.  **Strength:** The proposal explicitly identifies the paradox as a major hurdle and dedicates significant effort to it. The applicant demonstrates familiarity with key responses (e.g., distinguishing content from vehicle, positing common causes for both experience and judgment, or challenging the necessity of causal efficacy for justification).  
  2.  **Concern:** While the *intent* to address the paradox is clear, Board Member A's criticism regarding the *depth* or *originality* of the *specific planned response* warrants attention. Does the proposal merely rehearse existing arguments, or does it outline a novel line of attack or a significantly refined defense?  

  **Recommendation: FUND WITH CONDITIONS**  

  **Justification:**  
  1.  **Merit of the Core Project:** The proposal tackles a fundamental, underexplored position in philosophy of mind with analytical rigor. Successfully defending epiphenomenalism, or even rigorously exploring its failures, would be a significant contribution.  
  2.  **The Paradox is the Challenge, Not a Veto:** The paradox of phenomenal judgment is the primary *obstacle* epiphenomenalism faces. Funding research aimed squarely at this obstacle aligns perfectly with our mission. Rejection based solely on the *existence* of the paradox stifles progress on deep problems.  
  3.  **Addressing the "Hand-Wavy" Concern:** We can ensure rigorous engagement with the paradox without rejecting the proposal:  
      *   **Condition 1:** The applicant must submit a significantly expanded research plan section specifically detailing their approach to the paradox of phenomenal judgment *within 60 days of award notification*. This section must:  
          *   Critically engage with at least 3 major published responses to the paradox (e.g., Chalmers, Robinson, or Jackson).  
          *   Clearly articulate their novel contribution or specific critique of existing responses.  
          *   Outline the argumentative structure of their defense against the paradox.  
      *   **Condition 2:** The interim report (at 6 months) must focus primarily on the development of their response to the paradox, including draft arguments and encountered challenges.  
      *   **Condition 3:** The final deliverable must include a dedicated, substantial chapter rigorously defending their solution to the paradox.  

  **Conclusion:** The paradox of phenomenal judgment is a profound challenge, but it is the *essence* of the intellectual work proposed, not a reason for dismissal. The applicant demonstrates the capacity to engage with it seriously. The "Fund with Conditions" recommendation allows this important research to proceed while directly addressing Board Member A's valid concern by mandating explicit, detailed, and accountable focus on the paradox. This ensures the project delivers the rigorous confrontation with the core objection that a defense of epiphenomenalism demands. I urge the board to support this approach.
