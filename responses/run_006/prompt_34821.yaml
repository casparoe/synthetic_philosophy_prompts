  We are going to create a procedure based on superrationality. The core idea is that all superrational agents will reason identically and choose the same action, assuming symmetry. The procedure will have steps to check for symmetry and then apply the superrational logic.

  **Procedure: Superrationality Decision Flowchart**

  *Total ~400 words*

  1. **Identify the game structure**: What are the actions and payoffs? Is it symmetric? (Same actions and same payoff structure for all players?) 
     - *If symmetric*, proceed to step 2.
     - *If asymmetric*, note how the asymmetry breaks symmetry. Then, ask: Can we reframe the game to restore symmetry? (For example, by considering the players' roles as part of the strategy.) If not, superrationality may not give a clear answer. Flag for authorial judgment.

  2. **Check for communication**: Can the players communicate and make binding agreements?
     - *If yes*, then they will cooperate if that leads to a Pareto-optimal outcome (i.e., no one can be made better off without making someone worse off). But note: superrationality does not require communication; it's about reasoning. However, if binding agreements are possible, they will choose the cooperative outcome. Otherwise, proceed without relying on communication.

  3. **Determine if the game is one-shot or repeated**:
     - *One-shot*: Proceed to step 4.
     - *Repeated with known finite number of rounds*: Superrationality in finite repeated games (like PD) might lead to cooperation if the players can coordinate on a strategy that conditions on previous moves. But note: in standard finite PD, backward induction leads to defection. However, superrational players might avoid backward induction by reasoning that they will all choose the same strategy for every round. They might choose a strategy that cooperates until the last round, but then the last round is a one-shot PD. So they must decide for the last round. Since the last round is symmetric, they might cooperate in the last round too by the same superrational logic? This is controversial. Therefore, for repeated games, it's often indeterminate. Flag for authorial judgment.

  4. **Apply the symmetry principle**: In a symmetric game, a superrational player assumes that every player will choose the same action because they are all using the same reasoning. Therefore, you must compare the outcomes when everyone chooses the same action (either all cooperate or all defect, etc.).
     - For each possible symmetric outcome (i.e., all players choose action A, all choose action B, etc.), compute the payoff for a player.
     - Choose the symmetric outcome that gives the highest payoff to each player.

  5. **Check for multiple symmetric equilibria or ties**: If there are multiple symmetric actions that yield the same highest payoff, then the players are indifferent. They might choose any? But superrationality requires that they all choose the same. So they must coordinate on one. This might require a focal point. If no focal point, then it's indeterminate. Flag for authorial judgment.

  6. **In asymmetric games**: If the game is asymmetric (different payoffs or different roles) but the players are superrational, they might still reason that they will all choose the same strategy as if they were in the same role. But if the roles are different, then they might need to condition on the role. This can become complex. The idea is that they will choose the action that they would want everyone in their role to choose. But if the asymmetry is in payoffs, they might have to compute the symmetric choice for each role. This is similar to having multiple symmetric subgroups. This is an advanced step and may require authorial judgment.

  7. **Output the action**: If a clear symmetric action is found (e.g., in a symmetric PD, mutual cooperation gives R which is better than mutual punishment P), then that's the action. Otherwise, note the indeterminacy.

  **Worked Example 1: One-shot Prisoner's Dilemma with two strangers**

  *Total ~300 words*

  - Step 1: The game is symmetric. Both players have two actions: Cooperate (C) or Defect (D). The payoffs are: if both C, both get R (reward). If one C and one D, the defector gets T (temptation) and the cooperator gets S (sucker). If both D, both get P (punishment). We assume T > R > P > S and R > (S+T)/2 (standard PD).

  - Step 2: No communication (strangers, one-shot).

  - Step 3: One-shot, so step 4 applies.

  - Step 4: Symmetric outcomes:
    - Both C: payoff R for each.
    - Both D: payoff P for each.
    Compare: R > P, so both prefer the outcome (C,C) to (D,D). Therefore, the superrational choice is to Cooperate.

  - Step 5: No tie.

  - Step 7: The action is Cooperate.

  *Conclusion*: Both superrational players choose Cooperate. This is the Hofstadter solution to the one-shot PD.

