answer: |-
  ### 1. **The Procedure: Superrationality Decision Checklist**  
  *(~400 words)*  

  **Step 1: Identify Symmetry**  
  - **Question:** Are all players *identical* in knowledge, payoffs, and reasoning? (e.g., same stakes, no private information).  
    - *Yes* → Proceed to Step 2.  
    - *No* → Note asymmetries (e.g., Player A values outcome X more than Player B). If asymmetries break global symmetry, **flag for judgment call** (superrationality may not apply cleanly).  

  **Step 2: Check Communication**  
  - **Question:** Can players communicate and make binding agreements?  
    - *Yes* → They cooperate (unless payoffs force conflict).  
    - *No* → Proceed to Step 3.  

  **Step 3: Determine Game Type**  
  - **Question:** Is the game:  
    - **One-shot?** → Assume all players choose the *same action* (symmetry principle). Compare outcomes where everyone cooperates (C) vs. everyone defects (D). Choose the outcome with the highest individual payoff.  
    - **Finite repeated (known rounds)?** → Apply symmetry to the *strategy*, not per round. If mutual cooperation yields a better *total* payoff than mutual defection, they cooperate in all rounds. **Flag:** Backward induction (defection in final round) contradicts superrationality; prioritize symmetry.  
    - **Multi-player with subgroups?** → Treat symmetric subgroups as single units. Compare outcomes where all identical players act alike (e.g., "all allies cooperate").  

  **Step 4: Apply Symmetry Principle**  
  - **Question:** What happens if *everyone* does action X?  
    - List symmetric outcomes (e.g., all C, all D).  
    - For each, calculate individual payoffs.  
    - Choose the action with the highest symmetric payoff.  
    - *Tie?* → **Flag for judgment call** (e.g., focal points like "tradition" or arbitrary bias).  

  **Step 5: Resolve Asymmetries (If Any)**  
  - **Question:** Do payoffs/roles differ?  
    - *Yes* → Restore "role symmetry": Players assume *others in their role* act identically. Compare payoffs *within roles* (e.g., "all leaders defect").  
    - *Still indeterminate?* → **Flag for judgment call** (e.g., character personality breaks deadlock).  

  **Step 6: Output Decision**  
  - If clear winner: Superrational agents choose that action.  
  - If unclear: Note indeterminacy; author must decide based on character traits.  

  ---

  ### 2. **Worked Example 1: One-Shot PD with Two Strangers**  
  *(~300 words)*  

  **Setup**: Two strangers. Payoffs: Mutual cooperation (C) = 3 years freedom, mutual defection (D) = 5 years jail, unilateral defection = 0 years (defector) vs. 10 years (cooperator). No communication.  

  1. **Symmetry**: Identical payoffs and knowledge → Proceed.  
  2. **Communication**: None → Proceed.  
  3. **Game Type**: One-shot → Assume both choose same action.  
  4. **Symmetric Outcomes**:  
     - Both C: Each gets 3 years freedom.  
     - Both D: Each gets 5 years jail.  
     - Comparison: 3 > 5 → Mutual cooperation is better.  
  5. **Judgment Calls?** None.  
  6. **Output**: Both cooperate.  

  **Why?** Superrationality ignores the temptation to defect because it assumes the other reasons identically. Mutual cooperation is the only symmetric Nash equilibrium with a Pareto-optimal payoff.  

  ---

  ### 3. **Worked Example 2: Three-Player Asymmetric Game**  
  *(~300 words)*  

  **Setup**: Three characters: **A** and **B** (allies with history), **C** (stranger). Payoffs for funding a bridge:  
  - If all fund: **A**/B gain 5 gold (shared trust bonus), **C** gains 4 gold.  
  - If **A**/B fund but **C** doesn’t: **A**/B lose 1 gold (exploited), **C** gains 6 gold.  
  - If **C** funds but **A**/B don’t: **C** loses 2 gold, **A**/B gain 3 gold.  
  - No one funds: All gain 0. No communication.  

  1. **Symmetry**: Broken! **A**/B have shared history (trust bonus) → **Flag for subgroups**.  
  2. **Communication**: None → Proceed.  
  3. **Game Type**: One-shot → Treat **A**/B as a symmetric subgroup (they act identically). **C** is solo.  
  4. **Symmetric Outcomes**:  
     - **Subgroup symmetry**:  
       - **A**/B both fund + **C** funds: **A**/B get 5, **C** gets 4.  
       - **A**/B both fund + **C** defects: **A**/B get -1, **C** gets 6.  
       - **A**/B both defect + **C** funds: **A**/B get 3, **C** gets -2.  
       - **A**/B both defect + **C** defects: All get 0.  
  5. **Role-Symmetry Comparison**:  
     - **A**/B’s best symmetric outcome: Both defect (guarantees 3 or 0 > risk of -1).  
     - **C**’s best outcome: Defect (if **A**/B fund, **C** gets 6; if not, **C** avoids -2).  
  6. **Conflict?** **A**/B prefer defecting; **C** prefers defecting → Mutual defection (0,0,0).  
  7. **Judgment Call**: Superrationality resolves subgroups but not cross-group coordination. Author decides if **A**/B’s trust overrides logic (e.g., they fund hoping **C** joins).  

  **Output**: Superrational agents defect. **A**/B defect (safe payoff), **C** defects (no trust).  

  ---

  ### 4. **What the Procedure Can’t Do**  
  *(~200 words)*  

  **Limitations**:  
  - **Indeterminacy**: Asymmetries or ties (e.g., equal payoffs for C/D) lack clear answers.  
  - **Non-Symmetric Players**: If characters have different reasoning styles (e.g., one is impulsive), superrationality fails.  
  - **Zero-Trust Scenarios**: In games like Deadlock (defection dominates even symmetrically), superrationality mandates defection—potentially boring for novels.  
  - **Emotional Overrides**: Superrationality ignores trauma, greed, or loyalty that could break symmetry.  

  **Writer Solutions**:  
  1. **Indeterminacy**: Let character traits decide. The cautious one defects; the optimist cooperates.  
  2. **Boring Outcomes**: Add a non-superrational actor (e.g., a traitor) or misinformation to force drama.  
  3. **Contradictory Incentives**: Use the "superrational choice" as a baseline, then have a character *deviate* for personal reasons (e.g., "Logically we should defect, but I trust you").  
  4. **Ethical Dilemmas**: Superrationality may demand coldly efficient choices—highlight the *emotional cost* to add depth.  

  **Remember**: Superrationality is a tool for consistency, not a prison. Deviations create human tension.
