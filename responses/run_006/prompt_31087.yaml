prompt: |-
  My friend took an epistemology seminar last semester and has been confidently summarizing Moore's proof of an external world for me like this: Moore held up his hands and pointed out that he had one hand here and another hand here, and from that he concluded that at least two external things exist, so the external world is real. The argument is logically valid, but it's totally question-begging, because the whole debate is whether we can trust our senses, and Moore just assumes he knows he has hands. He even admits he can't prove he has hands, so his proof rests on an unproven premise, which means it doesn't establish anything. So the whole thing is famous mostly as a bit of English commonsense bluster rather than a serious anwser to skepticism.

  I'm suspicous this is unfair but I don't know enough epistemology to say exactly where. Can you go through it piece by piece and tell me which parts are accurate, which are subtly wrong or conflated, and whether the bluster verdict actually follows from the corrected version?
reasoning: |-
  Okay, the user's friend summarized Moore's proof of an external world, calling it logically valid but question-begging and dismissively labeling it "English commonsense bluster." The user suspects this is unfair but lacks the epistemology background to counter it. They want a detailed breakdown of what's accurate versus misleading in this critique, and whether Moore's approach holds any philosophical value when properly understood.

  Hmm, the friend's summary captures the surface-level mechanics correctly - Moore did gesture at his hands to argue for external objects. But calling it "totally question-begging" reveals a fundamental misunderstanding of Moore's purpose. The user seems to intuitively sense this reduction isn't quite right, hence their suspicion of unfairness. 

  Let me unpack the layers here. First, accuracy check: Yes, Moore openly admitted he couldn't prove the premise about his hands to a skeptic. And yes, the argument is deductively valid in form (if hands exist externally, then the external world exists). Where the friend goes wrong is assuming Moore intended this as a knockdown proof against skepticism. That misreads Moore's actual goal - which was to expose the skeptic's hidden assumptions. 

  The key subtlety lies in Moore's strategy of shifting the burden of proof. By treating "here is a hand" as more certain than any skeptical hypothesis, he's challenging the skeptic's framework itself. This isn't bluster; it's a deliberate methodological choice to prioritize commonsense propositions over abstract philosophical doubts. 

  I should clarify why "question-begging" is technically incorrect here. Circularity would require Moore's conclusion to be identical to his premise, but "external objects exist" is broader than "hands exist." More importantly, Moore isn't trying to convince skeptics - he's showing how their demands for proof lead to absurdities when compared to everyday certainty. 

  The user might also be wondering about Moore's legacy. Calling it "famous as bluster" ignores how Moore revitalized the commonsense tradition and influenced later responses to skepticism (like Wittgenstein, contextualism). The proof's brilliance lies in its simplicity exposing the skeptic's double standard about evidence. 

  For the response, I'll need to: 
