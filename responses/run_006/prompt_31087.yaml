answer: |-
  You're right to be suspicious - your friend's summary captures Moore's *gesture* but deeply misunderstands his *philosophical purpose*. Let's dissect it piece by piece:

  **Accurate Elements:**
  1.  **The Core Gesture:** Moore did indeed hold up his hands and say, "Here is one hand" and "Here is another," concluding that at least two external objects exist, and therefore, an external world exists.
  2.  **Deductive Validity:** The argument *is* logically valid: *If* P1: "Here is a hand" and P2: "Here is another hand" are true, *and* C1: "Therefore, at least two external objects exist" follows, *then* C2: "Therefore, an external world exists" necessarily follows.
  3.  **Admission of Non-Proof:** Moore did explicitly state that he couldn't *prove* his premises (like "Here is a hand") to someone who was genuinely skeptical about the external world or their senses. (See his "Proof of an External World" and "Four Forms of Scepticism").
  4.  **Target:** He was directly responding to Kant's claim that a rigorous proof of an external world was impossible and to radical skepticism.

  **Subtly Wrong, Misleading, or Conflated Elements:**
  1.  **Misinterpreting "Question-Begging":** Calling the argument "totally question-begging" misses Moore's point entirely.
      *   **What Begging the Question Means:** Strictly, it means the conclusion is assumed within the premises. While premise "Here is a hand" *entails* the existence of an external object, it doesn't *assume* the *conclusion* "An external world exists" in the circular sense skeptics mean. The premise is a specific empirical claim; the conclusion is a general ontological one.
      *   **Moore's Real Strategy:** He wasn't trying to *convince the skeptic* on the skeptic's own terms. His goal was **diagnostic and methodological**. He aimed to show:
          *   We have **certainties** that are *far more secure* than any skeptical hypothesis ("I might be dreaming," "I might be a brain in a vat"). The belief "I have hands" (under normal conditions) is one of them.
          *   Skeptical arguments *depend* on premises (like "I can't rule out I'm dreaming") that are *less certain* than Moore's everyday certainties (like "Here is a hand").
          *   Therefore, the *skeptic's demand for proof* is fundamentally flawed. If the skeptic requires proof for something as basic as "I have hands," but that proof would rely on premises *less* certain than "I have hands," then the skeptic's standard of proof is impossible or irrational to meet. Moore flips the burden: *Why should I abandon my overwhelming certainty for a less certain philosophical doubt?*
  2.  **"Just Assumes He Knows He Has Hands":** This misrepresents Moore's stance.
      *   He didn't *assume* it in the sense of being arbitrary or without justification. He claimed it was **known with certainty** based on his direct, present sensory experience. For Moore, this experience constituted *proof* in the ordinary, non-skeptical sense. He wasn't "assuming" it dogmatically; he was pointing to what he considered an indubitable *datum* of experience.
  3.  **"Rests on an Unproven Premise... Doesn't Establish Anything":**
      *   **"Unproven" Skeptically:** True, it's unproven *to the radical skeptic* who demands absolute, doubt-free certainty immune to any conceivable scenario. Moore concedes this.
      *   **"Doesn't Establish Anything" is False:** Moore argues it *does* establish the existence of the external world *for anyone not already committed to radical skepticism*. It meets the ordinary standards of proof we use in daily life and science. The point is that the skeptic's standard is *unreasonable* and paralyzing. The proof *works* if we accept that knowledge doesn't require immunity to hyperbolic doubt. It establishes the external world relative to our best, most secure grounds for belief.
  4.  **Conflating "Proof" with "Persuasion":** Moore offered a *proof* (a valid argument with premises he knew to be true), not necessarily a *refutation* designed to *persuade the die-hard skeptic*. His proof shows what we *do* know, exposing the artificial and untenable nature of the skeptic's starting point.

  **Is "English Commonsense Bluster" a Fair Verdict?**
  **No, it's a profound misunderstanding of Moore's significance.**

  1.  **Not Bluster, but a Powerful Challenge:** Moore wasn't just thumping the table. He delivered a devastating *challenge* to the skeptic: *Why should I accept your premises (e.g., "I can't rule out dreaming") which are far less certain to me than "Here is a hand"?* This shifted the debate from "Can we prove the external world?" to "What are the *proper foundations* of knowledge and certainty?"
  2.  **Reviving Commonsense Philosophy:** Moore revitalized the tradition of philosophical commonsense (like Thomas Reid). He argued that philosophy must start from our deepest, most fundamental certainties derived from experience, not try to rebuild the world from abstract, doubt-ridden first principles. This was a major corrective to the dominance of Idealism and skepticism.
  3.  **Catalyst for Major Developments:** Moore's "proof" was incredibly influential. It directly inspired:
      *   **Wittgenstein's "On Certainty":** Wittgenstein explored how propositions like "Here is a hand" function as "hinge propositions" – foundational certainties that are not justified by other propositions but are the framework *within which* justification occurs. They are immune to ordinary doubt.
      *   **Contextualism:** The idea that standards for knowledge (like how much proof is needed) vary depending on the context. In ordinary contexts, Moore's proof *is* sufficient; only in hyper-skeptical philosophical contexts does it seem inadequate.
      *   **Reformed Epistemology & Dogmatism:** Philosophers like G.E.M. Anscombe and Jim Pryor argued that perceptual experiences can provide *immediate, non-inferential justification* for beliefs like "I have a hand." You don't need prior proof your senses are reliable; the experience itself provides the warrant, absent defeaters.
  4.  **Exposing Skeptical Costs:** Moore brilliantly showed the *price* of skepticism: the skeptic must deny or doubt things that are vastly more certain than the premises of their own arguments. This makes skepticism look like an untenable, self-undermining position, not a triumph of rigorous thinking.

  **Conclusion:**

  Your friend accurately describes Moore's *surface action* and the *formal validity* of the argument. However, labeling it "totally question-begging" and "bluster" fundamentally misunderstands Moore's aims and impact.

  *   **Moore's Goal:** Wasn't to *refute the skeptic on the skeptic's terms* (which he admitted was impossible), but to **expose the skeptic's framework as flawed and unnatural**. He aimed to show that our ordinary certainties (like "I have hands") are more secure than any skeptical hypothesis and that philosophy must take them as its starting point.
  *   **The "Proof":** Serves as a powerful demonstration that we *do* have excellent, ordinary proof for the external world, and that the radical skeptic's demand for a *different kind* of proof is unreasonable and self-defeating. It highlights the relative certainty of commonsense beliefs.
  *   **The Verdict:** Far from being "bluster," Moore's argument was a seminal moment in 20th-century epistemology. It reframed the debate about skepticism, revitalized commonsense philosophy, and directly inspired major philosophical developments that continue to shape the field today. Its brilliance lies in its simplicity revealing the deep problems with radical skepticism's starting assumptions.
