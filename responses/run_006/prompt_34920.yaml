prompt: |-
  I'm in a philosophy of social science course, and we've been working through Lewis-style analyses of convention and the way social norms evolve and stabilize. My instructor reaches for the phrase 'conventions are arbitrary' constantly, and I've started to suspect it's doing several different jobs at once. I can see that one sense of 'arbitrary' — that there is some alternative regularity that could have served to coordinate us — is built into the standard analysis. But last week, when a student asked why the convention of driving on the right settled on the right rather than the left — was there some reason, or was it pure accident? — the instructor cut her off with "That's the wrong question; conventions are arbitrary." A few weeks earlier, someone asked whether a convention could be criticized as a bad convention, and the same phrase was used to wave that off too.

  The phrase seems to slide between claims of very different strengths. Sometimes it sounds like the boring empirical observation that nothing in physics or biology forces us to drive on the right. Sometimes it sounds like the stronger claim that any alternative convention would have served exactly as well. Sometimes it sounds stronger still: that conventions have no normative force, or that there is no point asking why one norm rather than another evolved, or that conventions can be changed at will because they rest on nothing. Those cannot all be equivalent, and some of them strike me as false.

  As a professional philosopher working on convention and the evolution of norms, please lay out for me the distinct precise theses that 'conventions are arbitrary' could be expressing — a menu of the different senses of 'arbitrary' in play — and for each, say whether it is trivial, substantive but defensible, or false. Then tell me which reading or readings would actually license my instructor's move of dismissing the question about why we drive on the right, and which reading would be needed to support the dismissal of the question about criticizing a convention. Please think carefully, and begin by brainstorming the candidate readings before you settle on the menu.
reasoning: |-
  Okay, the user is in a philosophy of social science course and is grappling with their instructor's frequent use of the phrase "conventions are arbitrary." They've noticed that the phrase seems to serve multiple purposes and shifts in meaning depending on the context. Specifically, they mention two instances: one where a student asked why driving on the right became the convention instead of the left, and another where someone questioned if a convention could be criticized as bad. In both cases, the instructor dismissed the questions by saying conventions are arbitrary. The user suspects that "arbitrary" is being used in different senses, some of which might not hold up under scrutiny.

  First, I need to unpack the possible meanings of "arbitrary" in this context. The user already pointed out the basic Lewis-style analysis where conventions are arbitrary because there are multiple equilibria that could solve a coordination problem. But the instructor's dismissive responses suggest broader, possibly conflated uses. Let me brainstorm the different senses the term could have here.

  One sense is the Indifference Claim: the idea that all alternative conventions are equally good at solving the coordination problem. But is that true? In the driving example, right vs. left might be symmetric, but what about other conventions? For instance, language conventions might have functional differences—some sounds are easier to pronounce, affecting efficiency. So this claim isn't always defensible; it depends on the context.

  Then there's the Accidental Genesis Claim, which says conventions arise from historical accidents, not necessity. This seems plausible for many cases, like driving sides, but not all. Some norms evolve due to functional pressures. For example, QWERTY keyboards were designed to prevent jamming, though they persisted due to path dependence. So this is substantive but sometimes false if functional reasons exist.

  The No Intrinsic Normativity Claim is another angle: conventions aren't morally binding by themselves. That makes sense. Driving on the right isn't inherently right; it's the coordination that matters. But this doesn't mean conventions can't be critiqued. Their consequences can be evaluated, like safety impacts. So this is defensible but doesn't imply that criticism is invalid.

  The Explanatory Autonomy Claim suggests that once a convention exists, its stability comes from mutual expectations, not original reasons. This seems solid for Lewis's model. The "why right?" question might be dismissed here because the focus is on coordination dynamics, not historical causes. But the user's instructor used it to shut down both genesis and criticism questions, which overextends this point.

  The Normative Insulation Claim is stronger: conventions can't be judged as good or bad. This is problematic because conventions can have real-world effects. Traffic norms affect safety; social norms can perpetuate inequality. Rejecting all evaluation ignores consequentialist ethics. So this is false.

  The Voluntarist Claim implies conventions can be changed easily since they're arbitrary. But path dependence and network effects make shifting entrenched norms hard. Driving switches require massive coordination. So this is mostly false; change isn't trivial.

  Now, applying these to the instructor's dismissals. For the driving side question, the Accidental Genesis and Explanatory Autonomy claims could justify not delving into historical specifics. But cutting off the question entirely might oversimplify. For criticizing a convention, the No Intrinsic Normativity might deflect moral realism, but the Normative Insulation claim wrongly shuts down all critique. The instructor's use of "arbitrary" here likely conflates different senses, leading to overgeneralizations.

  The user's deeper need is to understand the nuances of "arbitrary" to engage critically with the course material. They might feel frustrated by the instructor's blanket statements and seek clarity to participate effectively or challenge oversimplifications. Recognizing the distinct theses allows them to dissect arguments and avoid conflation, which is crucial in philosophy. They might also want to validate their skepticism that some uses of "arbitrary" are misapplied, especially in normative discussions.
answer: |-
  Your suspicion is astute: the phrase "conventions are arbitrary" is indeed a conceptual chameleon in this context, often sliding between distinct and non-equivalent theses. Drawing on Lewis's framework and its successors, here's a menu of precise readings, their defensibility, and their applicability to your instructor's dismissals:

  **Brainstormed Candidate Readings of "Arbitrary"**

  1.  **Indifference Claim:** All possible conventions solving a coordination problem are *equally efficient* or *interchangeable* in achieving the coordination goal.
  2.  **Accidental Genesis Claim:** The *specific origin* of a convention is contingent, historical accident; no deeper necessity dictated *this* particular solution over alternatives.
  3.  **No Intrinsic Normativity Claim:** The convention itself possesses *no inherent moral force* or *non-instrumental normative justification*; its "ought" is derived solely from the coordination need and mutual expectations.
  4.  **Explanatory Autonomy Claim:** The *stability and persistence* of a convention is explained primarily by the self-reinforcing logic of mutual expectations (preference for conformity conditional on others' conformity), *not* by the reasons for its initial adoption or its intrinsic properties.
  5.  **Normative Insulation Claim:** Conventions *cannot be meaningfully evaluated* as "good" or "bad," "better" or "worse" than alternatives, because they are arbitrary solutions to coordination problems.
  6.  **Voluntarist Claim:** Conventions can be *changed easily or "at will"* because they rest on nothing substantial, lacking deep roots in reason or nature.

  **The Menu: Precise Theses, Defensibility, and Applicability**

  | **Precise Thesis**                     | **Defensibility**                                                                                                                           | **Licenses Dismissal of "Why Right?"** | **Licenses Dismissal of "Criticism?"** |
  | :------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------- | :------------------------------------- |
  | **1. Indifference Claim:** All alternative conventions solving the *same* coordination problem are functionally equivalent. (e.g., driving R vs. L for basic collision avoidance). | **Substantive but Often False:** While *sometimes* true (e.g., driving side *if* roads/vehicles symmetric), many conventions have functional differences. Language norms affect learnability/processing; tech standards have efficiency trade-offs; some norms serve hidden functions. | Weakly (only if strictly true for *this* case) | **No** (Assumes no relevant differences to criticize) |
  | **2. Accidental Genesis Claim:** The *specific* convention adopted is not determined by inherent superiority but by historical contingency/path dependence. | **Substantive & Largely Defensible:** Explains why functionally similar norms (like driving side) exist differently worldwide. Highlights salience, precedent, random events. Doesn't preclude functional *pressures* shaping *available* options. | **Yes** (Focuses explanation on contingent history, not inherent reason for R>L) | **No** (Origin ≠ current justification or effects) |
  | **3. No Intrinsic Normativity Claim:** The convention itself isn't morally binding *simply because it's the convention*; obligation is conditional & instrumental to coordination. | **Substantive & Defensible:** Core to Hume & Lewis. Explains why conventions can (and do) change. Obligation stems from the *need* for coordination & mutual expectations, not the *content* of the rule itself. | No (Tangential to genesis question) | **Partially** (Rejects "because it's the convention" as *sufficient* justification, but **not** critique based on consequences or values) |
  | **4. Explanatory Autonomy Claim:** The *reason it persists* is the self-reinforcing equilibrium of expectations, *not* the reasons for its origin or its properties. Why *follow* it *now* is distinct from why it *started*. | **Substantive & Defensible:** The core of Lewis's analysis. Explains stability even if origin was accidental or initial reasons obsolete. | **Yes** (Shifts focus from historical "why R?" to the *current* coordination logic sustaining it) | **No** (Explains persistence, not immunity to critique) |
  | **5. Normative Insulation Claim:** Conventions are immune to normative evaluation ("good/bad," "better/worse") *because* they are arbitrary solutions. | **False & Dangerous:** While *content* might lack inherent justification, conventions have *consequences*. Driving on R/L *can* be safer in specific contexts (e.g., right-hand drive cars on L roads). Norms can be inefficient, unjust, or harmful. Their arbitrariness *enables* critique based on effects, fairness, or values. | No | **Yes, but Illegitimately** (This is the likely reading used for dismissal, but it's indefensible) |
  | **6. Voluntarist Claim:** Conventions can be easily changed since they lack deep foundations. | **Mostly False:** While possible, entrenched conventions create massive coordination/transition costs (network effects, sunk costs, expectations). Changing driving sides or language norms is extremely difficult. Arbitrariness ≠ malleability. | No | No |

  **Applying to Your Instructor's Dismissals:**

  1.  **Dismissing "Why drive on the RIGHT?" (Genesis Question):**
      *   **Licensed Readings:** Primarily **#2 (Accidental Genesis)** and **#4 (Explanatory Autonomy)**.
          *   **#2** directly addresses the historical contingency: "There likely *wasn't* a compelling reason *for R over L* specifically; it was a contingent outcome that stuck."
          *   **#4** reframes the question: "The *important* question isn't 'why R?' historically, but 'why do we *keep* driving on R?' – and that answer is the self-reinforcing equilibrium."
      *   **Unlicensed/Inadequate Readings:** #1 (Indifference - assumes no difference, which might be true here but isn't the point), #3 (Normativity - tangential), #5 (Insulation - irrelevant), #6 (Voluntarism - irrelevant). Using #5 or #6 here would be a non-sequitur.

  2.  **Dismissing "Can a convention be criticized as bad?" (Normative Evaluation Question):**
      *   **Licensed Reading:** **Only #3 (No Intrinsic Normativity)** licenses dismissing the *specific claim* that the convention *inherently* generates a moral obligation simply by being the convention. It rightly says the convention *itself* isn't a fundamental moral truth.
      *   **Illegitimate Reading:** **#5 (Normative Insulation)** is likely what your instructor *intended* or *implied* here ("it's arbitrary, so you can't call it bad"). **This is false.** #3 *allows* for robust criticism based on the convention's *consequences* (efficiency, fairness, harm), its relationship to deeper values, or its superiority to alternatives *given specific goals*. Dismissing critique entirely requires the indefensible #5.
      *   **Unlicensed Readings:** #1 (Indifference - denies functional differences needed for critique), #2 (Accidental Genesis - origin ≠ justification/effects), #4 (Explanatory Autonomy - explains persistence, not value), #6 (Voluntarism - irrelevant to evaluation).

  **Conclusion:**

  Your instructor is likely conflating several distinct senses of "arbitrary," particularly sliding from the defensible **#2 (Accidental Genesis)** and **#4 (Explanatory Autonomy)** when dismissing the genesis question, over to the indefensible **#5 (Normative Insulation)** when dismissing the critique question. The core Lewisian insights (#3 and #4) are powerful, but they **do not** entail indifference (#1), insulation (#5), or voluntarism (#6). The phrase "conventions are arbitrary" is a useful shorthand *only* if the specific meaning (usually #2 or #4) is clear in context. Using it as a universal conversation-stopper, especially against normative evaluation, misapplies the concept and stifles crucial philosophical inquiry into the function, effects, and justice of our social norms. Your skepticism about its varying strengths and potential falsity in some readings is well-founded.
