  Ah! Got it - a teenager who perfectly follows a moral rule they've accepted on authority, but applies it rigidly in a situation requiring nuance. The key is making the rule true ("don't lie"), the application technically correct (calling out actual deception), but the execution lacking understanding of when honesty might cause disproportionate harm. 

  For the knowledge part: the belief must be reliably formed (say, from a trusted ethics teacher), justified (the teacher explains why lying undermines trust), and true (lying is generally wrong). That checks all standard epistemic boxes for knowledge. 

  The moral trouble should stem from how they act - blunt truth-telling that destroys a friendship. The failing isn't epistemic (they knew correctly) but practical: they missed the contextual factors that would've been apparent through personal moral reasoning. 

  Now the interesting bit: separating epistemic success from practical failure. The gap exists because moral knowledge requires more than propositional truth - it needs situated understanding to apply well. If we vary the case - say, the teen reasons through why the friend lied - the practical failure disappears. But if we make the testimony unreliable, the epistemic success collapses. 

  This exposes how moral testimony transfers facts but not wisdom. Defenders might argue "the belief was fine, just applied poorly" - but that ignores how moral judgment inherently involves application. The very act of applying moral rules tests whether one truly understands them. 

