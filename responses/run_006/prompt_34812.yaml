prompt: |-
  I'm giving a talk at an alignment workshop next month defending the claim that we can define a workable impact measure for AI systems without first solving the full value-alignment problem. My approach is broadly in the Attainable Utility Preservation family, but I'm foregrounding the philosophical motivations rather than the technical details. The audience is a funny mix: about half are technical AI safety people who know the AUP papers and think the formalism is clever but worry it's smuggling in normative assumptions somewhere; the other half are philosophers of technology and value theorists who think 'side effect' is an inescapably normative concept and you can't operationalise it without a substantive account of what matters. There are also two or three economists who keep muttering about Pareto improvements.

  I need a Q&A prep sheet: the objections I'll actually get from this group, ordered by how much damage they could do to my case, phrased roughly the way they'd ask them. For each, give me a short reply (two minutes max) and a frank note on where the reply is softest. Include the question I'm really hoping nobody asks. Keep the whole thing under 900 words.
