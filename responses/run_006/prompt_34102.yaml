  [Unificationist Representative]

  [Bifurcationist Representative]
answer: |-
  ### Joint Statement on Indicative and Counterfactual Conditionals  
  **Adversarial Collaboration between Unificationist and Bifurcationist**  
  *Drafted in British English for mutual endorsement*  

  ---

  ### 1. Agreed Claims  
  The undersigned agree on the following claims as established data, formal behaviours, and constraints for any adequate theory of conditionals. These claims are neither vacuous nor theory-laden:  

  1. **Robust Difference**: Indicative conditionals (e.g., "If Oswald didn’t kill Kennedy, someone else did") and counterfactual conditionals (e.g., "If Oswald hadn’t killed Kennedy, someone else would have") exhibit systematically distinct felicity conditions. Indicatives require the antecedent to be epistemically possible in the context; counterfactuals require the antecedent to be presupposed false or highly improbable.  
  2. **Probability Judgements**: The probability of an indicative conditional "If \(P\), \(Q\)" as assessed by competent speakers aligns closely with the conditional probability \(P(Q \mid P)\). This is robustly observed in experimental settings (e.g., the Ramsey test paradigm).  
  3. **Modus Ponens Validity**: Both conditionals validate *modus ponens* in their standard contexts. For example, accepting "If \(P\), \(Q\)" and \(P\) licenses the inference to \(Q\) for both types.  
  4. **Embedding under Operators**: Both types embed under negation, modals (e.g., "might", "must"), and other conditionals, but exhibit divergent behaviour in embedded environments (e.g., in antecedents of higher conditionals or under quantifiers).  
  5. **Oswald Case Asymmetry**: In contexts where historical evidence rules out lone-gunman theories, the indicative Oswald conditional ("If Oswald didn’t kill Kennedy, someone else did") is intuitively true. The counterfactual version ("If Oswald hadn’t killed Kennedy, someone else would have") is often judged false or indeterminate, suggesting a difference that cannot be reduced to antecedent truth-value alone.  
  6. **Contextual Parameterisation**: Interpretation of both conditionals depends on a contextually determined modal base (set of accessible worlds) and ordering source (ranking of worlds). Any theory must explain how these parameters shift across uses.  
  7. **Non-Interchangeability**: Substituting an indicative for a counterfactual (or vice versa) in identical contexts typically results in infelicity or changed truth-value, indicating a non-accidental distinction.  
  8. **Weakness of Material Conditional**: Neither conditional is equivalent to the material conditional (\(P \supset Q\)), as both can hold in scenarios where \(P\) is false and \(Q\) is false (e.g., some counterfactuals).  

  ---

  ### 2. Disagreements Table  
  Genuine disagreements are catalogued below. Each row states the point neutrally, followed by each party’s position in their own accepted wording. Disagreements attributable solely to terminology or unparameterised modal bases are excluded.  

  | Point of Contention | Unificationist Position | Bifurcationist Position |  
  |---------------------|-------------------------|--------------------------|  
  | **Semantic unity vs. bifurcation** | Indicative and counterfactual conditionals share a single semantic operator (e.g., a strict conditional with world-selection functions). Observed differences arise entirely from shifts in the modal base/accessibility relation (epistemic for indicatives, counterfactual for subjunctives) and pragmatics. | Indicative and counterfactual conditionals employ distinct semantic operators (e.g., variably strict vs. strict conditionals). Differences are lexicalised and cannot be reduced to modal base shifts without ad hoc manoeuvres. |  
  | **Truth-conditional contribution** | Both conditionals have identical truth-conditions under a fixed modal base/ordering. The Oswald asymmetry stems from modal base differences (indicatives: worlds consistent with evidence; counterfactuals: worlds similar to actuality). | Truth-conditions diverge fundamentally: indicatives quantify over epistemically accessible worlds; counterfactuals quantify over worlds ordered by similarity. The Oswald cases show this divergence persists even when modal bases are controlled. |  
  | **Embedding under modals** | Embedding data (e.g., "It might be that if \(P\), \(Q\)") are explained by unified semantics via context-shifting. For example, epistemic modals adjust the modal base uniformly for both conditionals. | Embedding reveals irreconcilable differences. Indicatives under modals (e.g., "If \(P\), might \(Q\)") scope as conditionalised modals; counterfactuals (e.g., "If \(P\), might have \(Q\)") require independent modal quantification. |  
  | **Antecedent falsity and tense** | Past tense in counterfactuals pragmatically signals remoteness; it does not alter core semantics. Antecedent falsity is a presupposition of counterfactual use, not a truth-conditional input. | Past tense grammatically encodes counterfactuality, triggering a distinct semantic operator. Antecedent falsity is lexically required for counterfactuals and affects truth-conditions. |  

  ---

  ### 3. Cruxes  
  The following empirical or formal sub-questions would resolve material disagreements. Both parties agree on the described evidence and pre-register their predictions.  

  #### Crux 1: Probability of Nested Conditionals  
  - **Question**: For nested conditionals ("If \(A\), then if \(B\), \(C\)"), do speakers’ probability judgments match \(P(C \mid A \land B)\) equally for indicatives and counterfactuals?  
  - **Agreed Evidence**: Experiments eliciting probability ratings for sentences like "If the match is wet [\(A\)], then if it is struck [\(B\)], it will light [\(C\)]" (indicative) vs. "If the match had been wet [\(A\)], then if it had been struck [\(B\)], it would have lit [\(C\)]" (counterfactual), compared to simple conditionals ("If \(A \land B\), \(C\)").  
  - **Unificationist Prediction**: Probabilities align for both types (prob("If \(A\), then if \(B\), \(C\)") ≈ prob("If \(A \land B\), \(C\)") ≈ \(P(C \mid A \land B)\)), as nesting reflects iterative conditionalisation.  
  - **Bifurcationist Prediction**: Alignment holds for indicatives but not counterfactuals, where similarity orderings disrupt iterativity (prob("If \(A\), then if \(B\), \(C\)") ≠ \(P(C \mid A \land B)\)).  

  #### Crux 2: Embedding in Antecedents  
  - **Question**: What truth-values do speakers assign to conditionals with conditional antecedents, e.g., "If (if \(A\), \(B\)), then \(C\)"?  
  - **Agreed Evidence**: Intuition surveys on sentences like "If (if it rains, the match is cancelled), then we will stay home" (indicative) vs. "If (if it had rained, the match would have been cancelled), then we would have stayed home" (counterfactual), varying \(A\), \(B\), and \(C\).  
  - **Unificationist Prediction**: Truth-conditions are computable compositionally via modal base adjustments. No asymmetry between types emerges when contexts are fixed.  
  - **Bifurcationist Prediction**: Indicative antecedents are interpreted as restrictions on epistemic accessibility; counterfactual antecedents require similarity-based world selection. Truth-value divergences will occur (e.g., in non-monotonic scenarios).  

  #### Crux 3: Cross-Linguistic Marking  
  - **Question**: In languages without distinct grammatical marking for counterfactuals (e.g., Chinese, where context indicates counterfactuality), do embedded conditionals show bifurcation-like behaviour?  
  - **Agreed Evidence**: Corpus studies and experiments on embedded conditionals in languages like Mandarin, comparing contexts where antecedents are true/open/false.  
  - **Unificationist Prediction**: Embedding behaviour converges across contexts, as marking is pragmatic. Unified semantics predicts uniform compositional rules.  
  - **Bifurcationist Prediction**: Embedded conditionals in false-antecedent contexts exhibit distinct behaviour (e.g., scopal interactions with modals), signalling covert bifurcation.  

  #### Crux 4: Acquisition of Embedding  
  - **Question**: Do children acquire embeddings (e.g., under negation) for indicatives and counterfactuals simultaneously or at different stages?  
  - **Agreed Evidence**: Developmental studies testing comprehension of "It is not true that if \(P\), \(Q\)" for both types in children (ages 4–8).  
  - **Unificationist Prediction**: Acquisition trajectories are parallel; errors reflect general pragmatic development, not semantic distinctions.  
  - **Bifurcationist Prediction**: Counterfactual embeddings are acquired later or with distinct error patterns, indicating lexical learning of two operators.  

  ---

  ### 4. Verbal Disputes  
  Both parties judge the following dispute to be verbal:  
  - **Point**: Whether "semantic core" includes parametric variation (e.g., modal bases).  
  - **Reason**: Unificationists define "semantics" as encoding truth-conditions relative to parameters; bifurcationists define it as lexically fixed truth-conditions. This reduces to terminological preference, as both agree parameters are necessary. Resolving the cruxes above would address substantive disagreements.  

  ---  
  This document maps our accord, discord, and testable conditions for resolution. We endorse it as a basis for ongoing inquiry.  

  Signed:  
  [Unificationist Representative]  
  [Bifurcationist Representative]  

