  We are drafting a joint statement from an adversarial collaboration between a Unificationist and a Bifurcationist on the semantics of indicative and counterfactual conditionals.

  The structure we must follow:
  1. A numbered list of agreed claims (common ground).
  2. A disagreements table with three columns: Point of contention, Unificationist position, Bifurcationist position.
  3. Cruxes: sub-questions that would move at least one side, with agreed evidence and predictions.
  4. Any verbal disputes.

  We write in British English and aim for a document both parties would sign.

  Let's begin.

  ## 1. Common Ground: Agreed Claims

  We list claims that both sides accept. These are about the data, formal behaviour, and what any adequate theory must explain.

  1. **Robust Difference**: Indicative conditionals (e.g., 'If Oswald didn't kill Kennedy, someone else did') and counterfactual conditionals (e.g., 'If Oswald hadn't killed Kennedy, someone else would have') exhibit robust differences in their felicity conditions and typical contexts of use. Indicatives are typically used when the antecedent is epistemically possible, while counterfactuals are typically used when the antecedent is believed false.

  2. **Probability Judgements**: The probability of an indicative conditional 'If P, Q' as judged by ordinary speakers is typically close to the conditional probability P(Q|P). This is supported by empirical studies (e.g., the Ramsey test).

  3. **Modus Ponens**: Both indicative and counterfactual conditionals generally support modus ponens in their respective contexts. That is, from the conditional 'If P, Q' and the assertion of P, one can typically conclude Q.

  4. **Embedding Behaviour**: Both types of conditionals can be embedded under various operators (e.g., negation, possibility modals, other conditionals). However, the behaviour under embedding can differ in ways that must be explained by any theory.

  5. **Interaction with Modals**: Both types of conditionals interact with modal operators (e.g., 'must', 'might', 'could'). The interpretation of these interactions must be accounted for.

  6. **Context Dependence**: The interpretation of both indicative and counterfactual conditionals depends on context, including the set of relevant possibilities (the modal base) and the ordering of possibilities (if any).

  7. **The Oswald Example**: The indicative conditional "If Oswald didn't kill Kennedy, someone else did" and the counterfactual conditional "If Oswald hadn't killed Kennedy, someone else would have" are both judged to be true by many speakers in the same context (the historical context of the Kennedy assassination). However, the counterfactual version may be judged false in some contexts (e.g., if one believes the assassination was a one-person operation). This difference must be explained.

  8. **Non-Interchangeability**: Indicatives and counterfactuals are not freely interchangeable. For instance, using an indicative in a context where the antecedent is known to be false is typically infelicitous, and using a counterfactual in a context where the antecedent is open is often odd.

  9. **Truth-Conditional Content**: Both types of conditionals have truth-conditional content that goes beyond the material conditional. They are not equivalent to the material conditional.

  10. **Conditionals with False Antecedents**: Counterfactual conditionals are typically asserted when the antecedent is assumed false, while indicative conditionals are typically asserted when the antecedent is not assumed false.

  ## 2. Disagreements Table

  We now present a table of genuine disagreements. Each row states a point of contention neutrally, then the Unificationist's position and the Bifurcationist's position in their own words.

  | Point of Contention | Unificationist Position | Bifurcationist Position |
  |---------------------|-------------------------|-------------------------|
  | **Semantic Core** | Indicative and counterfactual conditionals share a single semantic core. The differences between them are due to the modal base (the set of worlds considered) and the ordering of worlds (if any), along with pragmatic principles. Specifically, the same conditional operator is at work, and the truth conditions are the same modulo the modal base and ordering. | Indicative and counterfactual conditionals are semantically distinct. They involve different conditional operators (or different kinds of modal quantification) that are not reducible to a common core by adjusting the modal base. The bifurcation is evident in embedding behaviour and the fact that a unified account cannot capture the differences without ad hoc adjustments. |
  | **Truth Conditions** | The truth conditions for both indicatives and counterfactuals can be given by a unified conditional operator (e.g., a variably strict conditional or a conditional defined over a contextually determined set of worlds). The difference in truth conditions between the two types is entirely due to the modal base: indicatives use an epistemic modal base (typically restricted to live possibilities), while counterfactuals use a modal base that includes counterfactual worlds and often employs an ordering source. | Indicative conditionals and counterfactual conditionals have fundamentally different truth conditions. Indicatives are typically analysed as having a restricted epistemic modal base (e.g., the Stalnaker conditional or a conditional probability approach), while counterfactuals require a more complex analysis involving similarity of worlds or causal laws. The difference is not merely in the modal base but in the very nature of the conditional relation. |
  | **Embedding Data** | The embedding behaviour of conditionals (e.g., under negation, in the antecedent of another conditional, under modals) can be explained by a unified semantics by appropriately adjusting the modal base and ordering source in the embedded context. The differences are pragmatic or due to shifts in context. | The embedding data reveals insurmountable problems for unification. For example, when conditionals are embedded under modals or in the antecedent of other conditionals, indicative and counterfactual conditionals show different logical behaviours that cannot be explained by a unified operator without postulating implausible context shifts. This requires two distinct semantic entries. |
  | **The Role of Pragmatics** | The robust differences between indicatives and counterfactuals are largely pragmatic, arising from general principles of conversation and context. The semantic core is the same, but the use of different tenses or moods signals different constraints on the modal base. | Pragmatics alone cannot account for the differences. The semantic differences are fundamental and are signalled by grammatical markers (e.g., past tense in counterfactuals). Without positing distinct semantics, we cannot explain why certain inferences are valid for one type but not the other when embedded. |
  | **The Oswald Sentences** | The apparent truth-value difference in the Oswald examples is due to a shift in the modal base: the indicative uses a modal base that includes the actual world and its historical context, while the counterfactual uses a modal base that may involve a more hypothetical set of worlds. The same conditional operator is at work. | The Oswald sentences illustrate a semantic difference: the indicative conditional asserts that in all epistemically possible worlds where Oswald didn't kill Kennedy, someone else did (which is true given the historical evidence), while the counterfactual conditional asserts that in the most similar worlds where Oswald didn't kill Kennedy, someone else did (which might be false if the most similar worlds are those where no other assassin was present). This difference is semantic and not merely pragmatic. |

  ## 3. Cruxes

  We now list the cruxes: empirical or formal sub-questions that, if settled, would change at least one party's mind. For each, we state what both sides agree would count as evidence and each side's prediction.

  ### Crux 1: Embedding under probability operators

  - **Question**: How do ordinary speakers assign probabilities to complex conditionals, especially when conditionals are embedded under probability operators? For example, consider: "It is likely that if A, then if B, C" and its equivalence to "It is likely that if A and B, C".
  - **Agreed Evidence**: Experimental studies on probability judgments of nested conditionals. Specifically, we can test whether the probability of "If A, then if B, C" is judged to be the same as the probability of "If A and B, C" for both indicative and counterfactual versions.
  - **Unificationist Prediction**: For indicative conditionals, the two will be judged equivalent because the probability of an indicative conditional is conditional probability. For counterfactuals, they might not be equivalent because of the added complexity of the modal base, but if the context is controlled, the same pattern should hold (i.e., the unified operator would predict that the equivalence holds when the modal base is held fixed).
  - **Bifurcationist Prediction**: The equivalence holds robustly for indicative conditionals but fails for counterfactuals. Counterfactuals, having a more complex semantics (e.g., involving similarity of worlds), do not obey the same probability rules as indicatives.

  ### Crux 2: Embedding in the antecedent of another conditional

  - **Question**: What are the truth conditions of conditionals that have another conditional in their antecedent? For example: "If (if A, B), then C" for both indicative and counterfactual versions.
  - **Agreed Evidence**: Native speaker intuitions about the truth conditions of such complex conditionals, gathered through carefully designed examples and surveys. Also, formal derivations in a compositional semantics.
  - **Unificationist Prediction**: The unified operator can handle such embeddings by context shift in the modal base. The resulting truth conditions will be explicable by the same semantic core. For instance, the antecedent "if A, B" will set up a temporary context for evaluating the main conditional.
  - **Bifurcationist Prediction**: Such embeddings reveal a difference: indicatives and counterfactuals will require different treatments because their antecedents create different types of contexts. In particular, counterfactuals in the antecedent will require a more complex machinery (e.g., a shift to a counterfactual modal base) that is not needed for indicatives, indicating a semantic split.

  ### Crux 3: Cross-linguistic patterns

  - **Question**: Do languages without a grammatical distinction between indicative and counterfactual conditionals (e.g., using the same conditional form for both) show the same semantic/pragmatic differences that English does?
  - **Agreed Evidence**: Study of conditionals in languages that do not mark a distinction (e.g., by tense or mood) between indicatives and counterfactuals. We can test whether speakers of such languages still make a distinction in interpretation based on context (e.g., the truth of the antecedent) and whether the embedding behaviour aligns more with the unificationist or bifurcationist account.
  - **Unificationist Prediction**: In such languages, context alone (knowledge of the antecedent's truth value) will trigger the same differences we see in English. The absence of grammatical markers does not imply the absence of the distinction, but the semantic core remains the same. The pattern of embedding should be consistent with a unified analysis.
  - **Bifurcationist Prediction**: Even in languages without grammatical marking, the two types of conditionals will exhibit different embedding behaviours and truth conditions that require distinct semantic treatments. Alternatively, if no such languages exist (i.e., all languages mark the distinction), that would support bifurcation.

  ### Crux 4: Acquisition

  - **Question**: How do children acquire the distinction between indicative and counterfactual conditionals? Do they initially treat them as the same and then learn the contextual constraints, or do they acquire them as distinct constructions?
  - **Agreed Evidence**: Experimental studies on children's comprehension and production of indicative and counterfactual conditionals, especially in embedded contexts.
  - **Unificationist Prediction**: Children initially use a single semantic form and learn to adjust the modal base based on tense and context. Early errors might show overgeneralization of one form to the other's context, but the underlying operator is the same.
  - **Bifurcationist Prediction**: Children acquire the two constructions as distinct from the start, or at least show early sensitivity to the grammatical markers (like tense) that signal the bifurcation. They do not make errors that conflate the two types in embedded contexts.

  ## 4. Verbal Disputes

  Both parties agree that part of the dispute may be verbal. Specifically:

  - The term "semantic core" might be understood differently. The unificationist uses it to mean a single lexical entry for the conditional operator, while the bifurcationist might take "semantic core" to mean that the truth conditions are the same modulo parameters. However, the bifurcationist denies that even a parameterised operator can capture the differences without ad hoc adjustments.

  - The dispute about whether the difference is "semantic" or "pragmatic" might be terminological to some extent. Both agree that context plays a role, but the bifurcationist insists that the grammatical marking (e.g., past tense) triggers a semantic difference that goes beyond pragmatics.

  However, both parties agree that the above cruxes are non-verbal and that resolving them would advance the debate.

  ---

  This joint statement is presented in good faith, representing both the common ground and the genuine disagreements, and identifies key empirical tests that could resolve the dispute.

