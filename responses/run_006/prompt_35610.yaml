prompt: |-
  I'm a retired physicist, got into philosophy a few years ago, and I've been chewing on this thing called the unilateralist's curse — the idea that when any one person in a group can act on their own, the group's fate is determined by the most optimistic or reckless member. I've been collecting cases and writing down my gut reactions, and I'm trying to figure out if there's a principle that ties them together.

  Here's my tentative stab at a principle: a unilateral action is wrong when (a) the stakes are high, (b) the effects are irreversible or very costly to reverse, and (c) the people who bear the risk didn't consent to the process. But I keep finding cases where this doesn't quite work.

  The cases:

  1. A virology grad student, working alone, discovers a method to make a known pathogen more transmissible in mammals. He publishes the full protocol without telling anyone. Verdict: wrong. Full stop.

  2. Same scenario, but this time he emails the draft to his advisor first. Advisor doesn't reply for three weeks. Student publishes anyway. Verdict: still wrong, but less blameworthy. But I'm bothered that the wrongness seems to depend on the advisor's inbox habits.

  3. A climate scientist wants to run a small-scale stratospheric aerosol injection experiment — a few kilograms of sulfates, effects dissipate in weeks. The international community is paralyzed, so she just does it. Verdict: I think this is fine, maybe even good. The data is valuable, the risk is negligable.

  4. Same scientist, but now she scales up to a level that measurably shifts rainfall patterns in a neighboring country for a season. Still unilateral. Verdict: not fine. But where exactly is the line between case 3 and case 4? I can't articulate it.

  5. A nation-state unilaterally deploys full-scale solar geoengineering, overriding near-universal international opposition. Verdict: terrifying and wrong. But is the difference from case 3 just a matter of scale, or is there something about states vs. individuals that changes the analysis?

  6. A security researcher finds a zero-day in a widely-used encryption library. She publishes it immediately, no patch available. Verdict: wrong. But if she had given a 90-day disclosure window and the maintainers ignored it, I'd say it's right. So the process matters — but in case 2, going through a process and getting ignored didn't make it right. Why does process matter here but not there?

  7. A neighbor unilaterally chops down a shared tree that was blocking his solar panels. No discussion. The tree can be replanted. Verdict: wrong, but it's a small wrong. The curse applies, but the magnitude is so low that I don't think it's a moral crisis.

  8. A doctor in a rural clinic has a patient with a novel infection. The standard protocol says to wait for lab results before starting antibiotics. The doctor is pretty sure waiting will kill the patient, so she starts a broad-spectrum antibiotic immediately. Verdict: clearly right, even though it's unilateral, breaks protocol, and the downside of unnecessary antibiotics (resistance) is borne by others. So sometimes unilateralism is justified.

  Here's my question: can you extract a principle from these verdicts that isn't just a laundry list of conditions? Something that explains why case 3 is okay and case 4 isn't, why case 8 is okay and case 6 isn't, and why the process-defect in case 2 doesn't exculpate but the process-defect in case 6 does? And what does the principle say about a case I genuinely can't resolve: an AI researcher at a small lab builds a model that passes a capability threshold most of the field considers dangerous, and releases it open-source because she thinks the democratization benefits outweigh the risks and the big labs are sitting on a consensus that's actually self-serving. Is that more like case 3 (deadlocked process, valuable information) or case 1 (irreversible harm, no consent)?

  If I have to drop one of my verdicts to get a clean principle, which one should go?
reasoning: |-
  Okay, the user is a retired physicist turned philosopher grappling with the unilateralist's curse. They've presented eight cases where unilateral actions occur, each with their own verdicts on morality. The challenge is to find a unifying principle that explains all these verdicts without just listing conditions. 

  First, I need to understand the core issue. The unilateralist's curse happens when the most reckless person in a group can act alone, affecting everyone. The user's initial principle involves high stakes, irreversibility, and lack of consent. But the cases show inconsistencies. For example, case 3 (small geoengineering) is okay, but case 4 (larger scale) isn't. Case 8 (doctor's action) is justified despite unilateralism, while case 6 (publishing a zero-day) isn't. 

  The user's confusion seems to center on several points: why process matters in some cases but not others (case 2 vs. case 6), how scale affects morality (cases 3 and 4), and the role of individual vs. institutional actors (case 5). There's also the unresolved AI researcher case, which parallels the geoengineering dilemma but with added complexity about democratization vs. risk.

  Looking at the cases, common threads emerge: the magnitude of harm, reversibility, and whether the action avoids greater harm. But these aren't consistent across all scenarios. The doctor in case 8 acts unilaterally to save a life, justifying the risk of antibiotic resistance. In contrast, the virology student publishes dangerous info without consent, causing irreversible harm. The difference might lie in imminent peril versus abstract risk.

  The geoengineering cases highlight scale as a factor. Small-scale experiments with negligible risks are acceptable, but larger interventions affecting weather patterns cross a line. But where's the threshold? It's not just scale—it's about externalities and affected parties. Case 4 impacts another country's rainfall, introducing transboundary harm without consent.

  The process question is tricky. In case 6, a 90-day disclosure window makes publishing a zero-day ethical if ignored, but in case 2, waiting for an advisor's reply doesn't excuse publishing. Why? Because encryption vulnerabilities involve multiple stakeholders (users, developers), and due process allows mitigation. The virology publication's harm is immediate and irreversible; no process can undo it once published. The advisor's delay doesn't change the catastrophic potential.

  The unresolved AI case is particularly thorny. The researcher believes democratizing AI has benefits outweighing risks, contrary to consensus. Comparing it to case 3 (small geoengineering), both involve deadlocked processes and valuable data. But AI risks are harder to quantify and potentially irreversible, like case 1. The user needs to decide if the action's reversibility and harm magnitude align more with case 3 or case 1. If the AI model's release can be contained or reversed, it might be acceptable; if not, it's reckless.

  The user might need to drop one verdict for a cleaner principle. Case 7 (chopping the tree) seems the weakest. While technically wrong due to lack of consent, the harm is minor and reversible. Including it complicates the principle by introducing low-stakes scenarios where the curse applies but isn't morally significant. Removing it allows focusing on high-stakes situations.

  Underlying all this is the user's struggle to balance individual agency against collective risk. As a physicist, they might seek a formulaic principle, but ethics is messier. Their deeper need could be reconciling scientific optimism (valuing information and action) with philosophical caution (respecting consent and uncertainty). The principle should account for asymmetric stakes: when one actor's gain risks others' well-being, unilateralism becomes problematic unless it prevents greater harm.

  In summary, the proposed principle centers on asymmetrical stakes: if an action imposes significant, irrecoverable costs on non-consenting parties without averting greater harm, it's wrong. This explains why the doctor is justified (avoids death), small geoengineering is acceptable (negligible risk), but large-scale or reckless publications are not. For the AI case, if the model's release risks irreversible harm (e.g., malicious use) without immediate benefits, it aligns with case 1—unjustified unilateralism.
answer: |-
  Your cases reveal a deep tension between individual agency and collective risk management in asymmetric-stakes scenarios. After analyzing your verdicts, I propose this unifying principle:

  **Unilateral imposition of significant, irrecoverable costs on non-consenting parties is impermissible unless:**
  **(1) The actor bears asymmetric epistemic certainty about imminent catastrophe avoidance, AND**
  **(2) The harm prevented demonstrably outweighs harm caused.**

  This explains your judgments while resolving tensions:

  ### How the Principle Handles Your Cases
  1. **Virology Publication (Wrong):** Imposes catastrophic risk (irrecoverable cost) without consent. No imminent catastrophe avoided.
  2. **Delayed Advisor (Still Wrong):** Advisor's inbox habits *don't change risk asymmetry*. The *nature* of risk (global, irreversible) dominates process defects.
  3. **Small Geoengineering (Permissible):** Costs are recoverable (dissipates in weeks). No significant harm imposed.
  4. **Large Geoengineering (Wrong):** Shifts rainfall → significant irrecoverable costs (crop loss, ecosystem damage) without consent.
  5. **State Geoengineering (Wrong):** Scales irrecoverable costs massively. State power amplifies harm capacity, but core wrong is *asymmetric imposition*.
  6. **Zero-Day Disclosure:**  
     - **Immediate Pub (Wrong):** Creates irrecoverable security costs for non-consenting users.  
     - **90-Day Delay (Permissible):** Process allows consent-building/mitigation. Harm prevented (vulnerability fixes) outweighs disclosure risk.  
     *Contrast with Case 2:* Encryption flaws involve *many stakeholders*; waiting enables consent. Virology risk is global and irreversible—process can't create meaningful consent.
  7. **Tree Chopping (Minor Wrong):** Imposes aesthetic/ecological costs, but replanting makes costs recoverable. Low magnitude keeps it from being a *moral crisis* under the principle.
  8. **Doctor's Antibiotics (Permissible):** Doctor has *epistemic certainty* of imminent death (asymmetric knowledge). Harm prevented (death) vastly outweighs diffuse antibiotic resistance risk.

  ### Resolving the AI Researcher Dilemma
  Your AI case most resembles **Case 1 (virology publication)**, not Case 3. Here's why:
  - **Significant irrecoverable costs?** Yes—malicious use of threshold-crossing AI could cause mass harm (irreversible if deployed).
  - **Non-consenting parties?** Yes—global society bears risk.
  - **Asymmetric epistemic certainty?** Unlikely—researcher *disagrees* with consensus but lacks unique proof of safety.
  - **Avoiding imminent catastrophe?** No—democratization is a benefit, not catastrophe prevention.
    
  *Conclusion:* Reckless under the principle. The "democratization benefit" doesn't outweigh asymmetric risk imposition, akin to publishing a dangerous virus protocol for scientific transparency.

  ### The Verdict to Drop: Case 7 (Tree Chopping)
  This is the outlier. Your intuition calls it a "small wrong," but the principle requires *significant* irrecoverable costs for impermissibility. Replanting makes costs recoverable, and magnitude is trivial. Dropping this verdict clarifies the principle's focus on **high-stakes scenarios** where unilateralism triggers the curse's most dangerous dynamics.

  ### Key Distinctions in the Principle
  - **"Significant irrecoverable costs"** explains the geoengineering scale difference (Cases 3 vs 4): Weeks-long dissipation vs. seasonal ecosystem disruption.  
  - **"Asymmetric epistemic certainty"** justifies the doctor (Case 8) but not the AI researcher: Only the physician has direct evidence of imminent death.  
  - **"Harm prevented outweighs harm caused"** separates good vs. bad process (Case 6): 90-day disclosure mitigates harm while enabling security fixes. Virology publication (Case 2) offers no analogous upside.

  This framework accepts that ethics isn't algorithmic—"significant" and "irrecoverable" require context—but provides a coherent lens for unilateralism dilemmas where collective inaction collides with individual power. Would this resolve other cases in your collection?
