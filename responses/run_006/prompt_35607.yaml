prompt: |-
  I work on recommender systems — collaborative filtering, matrix factorization, user embeddings, all that. One thing we deal with constantly is that different users use rating scales totally differently: some people give everything 4 or 5 stars, some actually use the whole 1–5 range. We throw in per-user bias terms, we normalize, we calibrate, and we move on. But I keep hearing that philosophers have been fighting for decades about whether comparing utility across people is even meaningful — the interpersonal utility comparisons problem — and that some of them think it's literally nonsense, not just noisy. Restate the main positions in that debate (the ordinalist rejection, the Harsanyi-style defense, the Robbins/Samuelson moves, whatever the key arguments are) in the vocabulary I actually use: user vectors, rating scales, calibration, latent preferences, loss functions, whatever maps best. Don't cheat the translation to make it work. Then give me the residue report: what came across cleanly, what you had to fudge, and what the philosophers are arguing about that has no counterpart at all in how we handle this. And I want your honest take: is the philosophical debate pointing to a real problem my framework is just papering over, or is it a confusion that dissolves once you operationalize everything?

  Format thing: give me a one-sentence summary as the last line.
