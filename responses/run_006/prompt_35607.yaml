  For the ordinalist view, comparing user preferences is like trying to calibrate scales without a ground truth. Each user's rating scale is arbitrary; normalization is just shifting and scaling without knowing true alignment. That's a direct analogy to the utility comparison problem.

  Harsanyi's defense can be linked to joint optimization. If the loss function aggregates errors across users, it assumes some comparability. The user vectors in a shared space imply that distances are meaningful across users, which aligns with Harsanyi's idea of interpersonal comparison.

  The Robbins/Samuelson move is about avoiding cardinal comparisons. In ML, that's like using rank-based metrics instead of absolute ratings. But the residue here is that in factorization, we still use magnitudes in the embeddings, which might imply some cardinal utility.

  Now, the residue report: What translates cleanly? The normalization vs. calibration issue is spot on. The loss function's role in aggregation matches Harsanyi. But what's fudged? The ML model assumes a shared latent space where user vectors exist, but philosophy questions if that space is real or just a construct. Also, the loss function optimizes for prediction, not welfare, which is a key difference.

  What has no counterpart? The normative aspect: ML doesn't care about ethical implications, but philosophy debates whether we should aggregate utilities for social decisions. Also, the hard solipsism where utility is incomparable isn't handled in ML since the model just proceeds with the data.

  User's deeper need: They might be worried that their methods are fundamentally flawed, not just noisy. They want validation that their engineering solutions are sufficient or if there's a deeper issue they're ignoring. My honest take is that for recommendation systems, the operational approach works because the goal is predictive accuracy, not true utility measurement. The residue is manageable as long as they recognize the assumptions.

