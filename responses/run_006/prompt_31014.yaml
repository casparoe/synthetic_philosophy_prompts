  I've spent too many evenings on the Sleeping Beauty problem and I still can't tell wether the fight between halfers and thirders is mostly substance or mostly people using the word credence differently. Give me your actual number for the claim that the thirder answer is correct — that when Beauty wakes up she should assign 1/3 to the coin having landed Heads. I don't want it depends on your formalism, I want a credence and the decomposition. In particular: what probability do you put on the centered worlds Monday/Heads, Monday/Tails, and Tuesday/Tails being equally weighted in the first place; what probability that self-locating evidence should be updated on the same way as ordinary evidence; what probability that the original question has a single determinate correct answer rather than being under-specified; and any other term you think belongs. Give each a number and a sentence of justification, then show how they combine into your overall number. Then tell me which term you're least confident about, and what evidence or argument would shift it most. I lean thirder at maybe 0.6 but my freind is a firm halfer, and I suspect we actually disagree about one of the sub-terms, not the final answer. Oh, and please write in American English.
