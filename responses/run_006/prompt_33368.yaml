prompt: |-
  I have no legal training, but I have been trying to work out what I mean when I say that something is law. I have been testing my reactions against particular cases, and they pull in different directions. I would like to know whether there is a single principle that captures my reactions, or nearly captures them, and which of my reactions it would force me to abandon.

  Here are the cases as they strike me.

  1. Under a dictatorship, a woman denounces her husband to the authorities for privately criticizing the ruler, relying on a statute that makes such criticism a capital crime. He is sentenced to death and narrowly survives. After the regime falls, a court convicts her and, in doing so, declares that the statute was never law because it was so contrary to basic morality. I share the court's moral condemnation of what she did, but I do not think the statute was never law. It seems to me it was law — monstrous law — and I am uneasy with a court saying otherwise, even though I understand why it wanted to.

  2. A properly enacted statute requires ordinary citizens to assist in returning escaped slaves. I think this was law, and I also think a judge should have refused to enforce it. I can hold both of those thoughts at once without much strain.

  3. A decree issued by the ruler of a regime directs the extermination of an entire minority. Here my reaction flips: I find it hard to call this law at all. Saying it was law feels wrong in a way that goes beyond saying it was unjust. But I cannot see a principled difference between this and case 1.

  4. A military junta seizes power illegally and governs through courts and police. The rules it issues are generally obeyed. I think those rules are law while the junta governs, despite the illegal way it came to power.

  5. A bill passes the legislature but is never signed by the head of state, as the constitution requires. I do not think it is law. Procedure seems to matter to me.

  6. A commercial custom about who bears the cost when goods are damaged in transit has been followed by merchants and enforced by courts for generations, though no legislature ever enacted it. I think it is law.

  7. A criminal statute forbids "unpatriotic activities" without saying what those are. I do not think this is law, or at least not something a court may use to convict anyone.

  8. A statute requires doctors to report undocumented patients to the immigration authorities. It was properly enacted and remains on the books, but it is widely and openly disobeyed, and the government has not enforced it in years. I think it is still law, though a dead letter in practice.

  I notice two things that bother me. Cases 1 and 3 seem to be the same kind of thing, yet I treat one as law and the other as not law. And cases 6 and 8 seem asymmetric in a way I cannot justify: long practice can make something law, but long disuse does not seem to unmake something that was enacted. The half-formed principle I keep circling is that whether something is law has to do with how it was made and whether it is actually in force, not with whether it is just. But that idea sits badly with case 3, and case 7 suggests that bare enactment is not enough either.

  Is there a single principle, or a small set of competing principles, that makes the best sense of these reactions? Please state it precisely, say which of my cases motivates each part of it, apply it to two or three further cases I have not listed, and tell me plainly which of my reactions it cannot accommodate and why I should reconsider that reaction.
reasoning: |-
  Okay, the user is grappling with what makes something "law" based on their reactions to various hypothetical cases. They've presented eight scenarios where their intuition about whether something counts as law varies, and they're noticing inconsistencies. Specifically, they're troubled by the conflict between cases 1 and 3 (both involve immoral statutes but they judge one as law and the other not), and the asymmetry between cases 6 and 8 (custom becomes law through practice but disuse doesn't repeal enacted law). Their half-formed principle leans toward procedural validity and social efficacy over morality, but this clashes with case 3.

  First, I need to unpack their core dilemma: they want a coherent legal philosophy that explains their intuitions but are stuck on contradictions. Their identity as someone without legal training matters—they're philosophically self-taught, so the answer should avoid jargon while respecting their careful thought process. Their stated need is for a unifying principle, but their deeper need might be resolving cognitive dissonance about authority versus morality.

  Looking at their cases, the tension centers on three dimensions: 
  - **Source validity** (was it created by recognized procedures? Cases 4,5,6,7) 
  - **Social efficacy** (is it enforced/obeyed? Cases 4,8) 
  - **Minimal moral threshold** (does it cross into "too evil to be law"? Cases 1,3). 

  Their reaction to case 3 suggests an unarticulated belief that extreme moral violations strip legal character, unlike case 1's "merely" unjust law. But they can't justify why. This echoes the Radbruch formula (post-WWII German jurisprudence where extreme injustice invalidates law), but they might not know the term. Meanwhile, case 7 introduces a third factor: **determinacy** (can it guide behavior?).

  The user might resist natural law theory (which they flirt with in case 3) because it clashes with their proceduralism in cases 1,2,4,5,8. Yet pure legal positivism (law as social fact) fails case 3 for them. The solution could be a hybrid: positivism with a "collapse of law" exception for extreme cases. This explains case 3 as system failure—the decree isn't law because it's part of a regime that abandoned legality itself. Case 1's dictatorship still had courts, statutes; case 3 is naked violence.  

  For cases 6 and 8 asymmetry: custom becomes law through practice *because* no prior procedure existed, while enacted law relies on procedure until repealed. Disuse alone doesn't repeal—that requires formal mechanisms (which they acknowledge in case 5). Their intuition here aligns with Hart's secondary rules.  

  Their discomfort with case 1's court retroactively denying legal status is spot-on—it risks ex post facto moralizing. The proposed principle handles this by differentiating invalid law (case 3) from unjust but valid law (case 1).  

  New test cases:  
  - **Case A (Nazi Berlin):** Would they call the 1943 Gestapo "tribunals" law? Probably not, supporting the collapse thesis.  
  - **Case B (Vague tax statute):** If "excessive profits" is undefined, they'd likely deny legal status (like case 7), demanding determinacy.  

  The principle would force them to abandon case 3's intuition *unless* they accept the regime collapse framing. Alternatively, they might soften to "it *is* law but shouldn't be called such" as a moral protest—but that’s semantic, not conceptual.  

  Why reconsider case 3? Because refusing the "law" label to extreme evil isn't just descriptive; it’s a moral defense of legality’s purpose. As Hart argued, calling such things law risks legitimizing them. Their unease mirrors real post-atrocity legal struggles (e.g., Nuremberg). They’re wrestling with law’s moral authority versus its institutional reality—a profound jurisprudential rift.
answer: |-
  Based on your reactions, your core intuition leans towards **Legal Positivism** (law is a social fact based on sources and efficacy, not morality), *but* with two crucial refinements: **(1) a minimal procedural threshold for "legal system" status** and **(2) a requirement of minimal determinacy for individual norms**. This is closest to the "Inclusive Positivism" of H.L.A. Hart, modified by a "collapse of legality" criterion for extreme cases.

  **The Principle:**
  *   **Something is law** if it is **(a)** created according to the recognized procedural rules (formal or customary) of **a system generally accepted as authoritative and minimally effective in governing social behavior**, and **(b)** sufficiently determinate to guide conduct or judicial decision.  
  *   **A legal system exists** if its rules **(a)** claim supreme authority over a territory/group, **(b)** are generally obeyed by the populace, and **(c)** are generally applied by officials (especially courts/police) who accept them as standards for their own conduct.  
  *   **A system collapses into non-law** if its purported rules become **so radically arbitrary, unpredictable, or detached from even a pretense of general governance** that they fail the minimal conditions for a "system" (b & c above).

  **Breaking Down the Principle with Your Cases:**

  1.  **Source & Efficacy over Morality (Motivated by Cases 1, 2, 4, 5, 6, 8):** Your core positivist impulse. Law is defined by *how it was made* (statute, custom, decree within a system - Cases 1, 2, 4, 6) and whether it's *generally operative* within a functioning system (Cases 4, 6, 8), not by its justice. This explains:
      *   Case 1: Monstrous statute is law (proper source, operative system).
      *   Case 2: Unjust law is still law (proper source).
      *   Case 4: Junta's rules are law (effective system, rules applied by officials).
      *   Case 5: Unfinished bill is *not* law (failed procedure - source requirement).
      *   Case 6: Custom is law (long practice = recognized source).
      *   Case 8: Unenforced statute is still law (proper source; disuse ≠ repeal; system exists).

  2.  **Minimal Determinacy (Motivated by Case 7):** Law must provide *some* standard for conduct or adjudication. A purely standardless rule ("unpatriotic activities") fails as law because it cannot guide behavior or constrain officials. Case 7 isn't law because it lacks determinacy.

  3.  **Collapse of Legality / Minimal Threshold for a Legal System (Motivated by Case 3):** This addresses your flip in Case 3. A decree ordering genocide isn't just immoral; it signals the *collapse of the system itself* into pure, arbitrary violence. It lacks the pretense of general governance and predictability required for a "legal system." Officials applying it aren't acting within *any* framework recognizable as law; they are instruments of terror. Contrast Case 1: The dictatorship's system, while evil, still used courts, statutes, and procedures (however perverted) – it maintained the *form* of a legal system, however unjust. Case 3 lacks even that form.

  4.  **Asymmetry Between Custom and Statute (Explaining Cases 6 & 8):** Long practice *creates* law *because* custom is a recognized *source* of law within functioning systems. Long disuse of a *statute* does *not* destroy its validity because its *source* (enactment) remains valid *until repealed* by the recognized procedure (which disuse is not). The *source* differs, leading to the asymmetry. If a custom fell into complete disuse *and* was repudiated by courts, it would likely cease to be law.

  **Applying the Principle to New Cases:**

  *   **Case A (Nazi "People's Court"):** A special tribunal established by Hitler tries and executes political opponents based on vague charges like "undermining military morale," ignoring basic procedural rights. **Verdict:** While monstrous, *within* the Nazi system (which maintained courts, police, bureaucracy), these proceedings likely qualify as "law" under the principle (similar to Case 1). The system, though evil, retained enough structure to meet the minimal threshold. *(This might challenge your Case 3 reaction but aligns with Case 1).*
  *   **Case B (Failed State Warlord):** A warlord in a collapsed state issues "edicts" enforced only sporadically by his militia through random violence. No courts exist; obedience is purely fear-based and localized. **Verdict:** This is *not* law. There is no *system* claiming general governance or applying rules with any consistency. It's pure force without the structure of legality (aligns with the rationale for Case 3).
  *   **Case C (Vague Tax Statute):** A properly enacted statute imposes a "special contribution" on businesses making "excessive profits," with no definition of "excessive." **Verdict:** Similar to Case 7, this lacks sufficient determinacy to guide conduct or constrain officials. It is likely *not* valid law for enforcement purposes.

  **Which of Your Reactions the Principle Cannot Accommodate (and Why to Reconsider):**

  1.  **Your Reaction to Case 3:** The principle requires you to abandon the intuition that the genocide decree is categorically "not law" *simply because of its extreme immorality*. Instead, it argues that what makes it "not law" is that it signifies the **collapse of the system into pure arbitrary terror**, failing the minimal conditions for *any* legal system (general obedience, official application accepting standards). It wasn't "made" within a framework recognizable as law; it was a naked command signaling the end of law.
      *   **Why Reconsider:** Separating the *validity* of law from its *morality* (positivism) helps us clearly condemn monstrous rules *as monstrous laws*, rather than pretending they don't exist. Calling the decree "not law" might feel like a moral victory, but it risks obscuring the reality that such horrors are often perpetrated *through* perverted legal forms (like Case 1) or by systems that have *collapsed* (Case 3). The "collapse" criterion captures the functional difference you sense between Case 1 and 3 without resorting solely to morality. It focuses on whether *any* system of rules existed at all.

  2.  **Potential Strain on Case 1:** While the principle *can* accommodate Case 1 (it was law), your unease with the court saying it "was never law" is justified *under this principle*. The court's declaration is legally incorrect positivism (it *was* valid law within that system) and arguably an ex post facto moral judgment disguised as legal analysis. The principle supports your unease here.

  **Conclusion:**

  The principle that best captures most of your reactions is: **Law exists within a system defined by recognized sources (formal or customary), general efficacy, and official acceptance. Individual norms must be sufficiently determinate. Extreme arbitrariness and unpredictability can cause a purported "system" to collapse into non-law, disqualifying even formally issued decrees.**

  This resolves:
  *   The contradiction between Cases 1 & 3 (system collapse vs. evil but functional system).
  *   The asymmetry between Cases 6 & 8 (source creation vs. source persistence).
  *   Supports your views on procedure (Case 5), determinacy (Case 7), custom (Case 6), disuse (Case 8), and junta rules (Case 4).

  It requires you to reframe your Case 3 intuition: the genocide decree isn't "not law" *because* it's immoral, but because it exemplifies the utter *absence of a functioning legal system*. The moral horror is the cause of the systemic collapse, but the *reason* it's not law is the collapse itself. This maintains the separation of law and morality central to your other reactions while acknowledging the functional limit where "law" ceases to have meaning.
