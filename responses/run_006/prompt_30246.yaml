prompt: |-
  I edit a social-science journal and I need a decision procedure my associate editors can use to decide whether a submission is scientific enough to send out for peer review. We get a lot of borderline stuff: psychoanalytic readings of political movements, rational-choice models with no empirical test, advocacy papers with a thin layer of footnotes, qualitative work where you genuinely can't tell what would count as a counterexample. 'Is it falsifiable?' is too crude and everyone knows it — Duhem-Quine alone makes a mess of that as a gatekeeping rule, nevermind the fact that half of respectable science doesn't look falsificationist on the ground. But I also can't just say 'we know it when we see it' because my editors disagree constantly.

  I need a checklist someone can run in twenty minutes without a philosophy degree, that catches the genuinely unscientific stuff without gatekeeping in a way that just enforces methodological conservatism. For each step, say what demarcation criterion or idea from philosophy of science it's operationalizing, what it catches, and what it might unfairly exclude. Then run the procedure on three borderline submissions and tell me what it decides:

  (1) A paper arguing from clinical case material that rising authoritarianism reflects a collective oedipal dynamic. No quantitative data, just interpretive readings of political events through a Freudian lens.

  (2) A paper using rational-choice models to argue that climate activism is counterproductive because of free-rider dynamics. The models are internally consistent, the math checks out, but there's no attempt to test the predictions against any data.

  (3) A survey study finding that people who read literary fiction score higher on empathy measures than people who dont, where the authors state in the introduction that they designed the study specifically to generate evidence in favor of arts funding, and the discussion section treats the hypothesis as confirmed.

  Flag any cases where the procedure says 'no' but a reasonable editor might say 'maybe,' and vice versa. And be honest about which steps are judgment calls dressed up as a checklist — I'd rather know where the procedure is leaning on taste than pretend it isn't.
reasoning: |-
  Okay, the user needs a practical decision procedure for associate editors to quickly evaluate if social science submissions are scientific enough for peer review. They're dealing with borderline cases where traditional criteria like falsifiability are too crude or philosophically messy. 

  First, let's unpack their pain points: 
  - They're drowning in submissions that feel "off" but are hard to pin down (psychoanalytic interpretations, untested models, advocacy papers)
  - Editors constantly disagree because they're relying on subjective "I know it when I see it" judgments
  - They want to avoid both pseudoscience gatekeeping and methodological conservatism

  Hmm... the core tension here is balancing rigor with flexibility. The user explicitly rejects Popperian falsification as insufficient (rightly so, given Duhem-Quine), but also needs something more concrete than Lakatosian research programmes for overworked editors. 

  *Scratching head*... maybe a layered approach would work? Starting with bare-minimum criteria (is it even trying to be empirical?) then escalating to more demanding checks. Should borrow from: 
  - Laudan's "progressive vs degenerative" for theory development 
  - Kitcher's "signs of science" for community practices 
  - Haack's "integrity" lens for advocacy work 

  *Pauses*... crucial insight: The checklist must flag when something is unscientific vs. when it's just bad science. Peer review should handle the latter. Also need to acknowledge where judgment calls are unavoidable - better to surface that than pretend objectivity exists.

  For the test cases: 
  - The Freudian paper fails on multiple fronts (no evidence, untestable mechanisms) but might pass if framed as theory-building 
  - The rational choice model is scientifically empty without empirical engagement - classic "untestable just-so story" 
  - The empathy study has methodology issues but clears the bar for review (problem is shoddy science, not unscientific approach)

  *Double-checking*... Did I address all requests? 
  ✓ Explained philosophical roots of each step 
  ✓ Marked judgment call zones honestly 
  ✓ Tested borderline cases 
  ✓ Flagged false positives/negatives 

  Biggest risk: Editors might misuse Step 4 ("collective assessment") to reject novel methods. Should emphasize that's why it's a "yellow flag" not rejection trigger. Also added explicit "when in doubt, review" rule to prevent overzealous gatekeeping.

  *Nods*... This should give them a fighting chance against the woo while keeping the tent big enough for qualitative work. Time to structure the response.
answer: |-
  Here's a decision procedure designed for practicality, philosophical grounding, and tolerance for methodological diversity while filtering out genuinely unscientific submissions. It focuses on **epistemic accountability** – the paper's commitment to engaging with reality through intersubjective scrutiny.

  **The "Epistemic Accountability" Checklist (20-Minute Version)**

  **Step 1: Empirical Engagement**  
  *Philosophical Basis:* **Empiricism (Broadly Construed)**. Science requires some connection to observable phenomena, even if indirect or interpretive.  
  *Check:* Does the paper make claims *about the observable world* (behavior, institutions, texts, events, data patterns) and attempt to *engage* with that world (describe, explain, interpret, model) using its chosen methods?  
  *Catches:* Purely normative ethics, abstract math without social science application, untestable metaphysical claims.  
  *Unfair Exclusion Risk:* Highly abstract theoretical work proposing new frameworks (if clearly intended for future empirical application).  
  *Judgment Call?* Low. If it's purely about "what ought to be" or abstract concepts without observable referents, it's out.  

  **Step 2: Transparency & Intersubjectivity**  
  *Philosophical Basis:* **Communalism (Merton)/Testability (Lakatosian)**. Methods and reasoning must be sufficiently clear for others to understand, critique, and potentially build upon.  
  *Check:* Could a qualified researcher in the field, reading this paper, understand:  
      a) *What was done?* (Data sources? Methods of analysis? Model assumptions?)  
      b) *How conclusions were reached?* (Is the reasoning traceable from evidence/assumptions to claims?)  
      c) *How they might challenge it?* (Can they see potential points of contention?)  
  *Catches:* Opaque reasoning, "trust me" assertions, deliberately obscure jargon masking lack of substance.  
  *Unfair Exclusion Risk:* Some deeply interpretive/hermeneutic work where full objectivity isn't claimed, but transparency about interpretive lens exists.  
  *Judgment Call?* Medium. Assessing "sufficient clarity" for peers requires some disciplinary knowledge.  

  **Step 3: Reasoning Structure & Argumentative Rigor**  
  *Philosophical Basis:* **Logical Positivism's emphasis on argument structure/Lakatosian "heuristic power"**. Arguments must demonstrate internal coherence and logical connection between premises and conclusions.  
  *Check:* Does the paper:  
      a) Avoid blatant logical fallacies (ad hominem, strawman, non sequitur)?  
      b) Explicitly connect its evidence/assumptions to its conclusions?  
      c) Acknowledge and address obvious alternative explanations or counterarguments?  
  *Catches:* Sloppy reasoning, polemics disguised as argument, ignoring obvious objections, conclusions unsupported by premises.  
  *Unfair Exclusion Risk:* Exploratory work explicitly framed as tentative hypotheses.  
  *Judgment Call?* Low-Medium. Identifying blatant fallacies is straightforward; assessing the adequacy of counterargument handling has nuance.  

  **Step 4: Potential for Refutation or Progressive Development**  
  *Philosophical Basis:* **Lakatos's "Progressive vs. Degenerative Research Programmes"/Laudan's Problem-Solving Effectiveness**. Does the work *allow for* future empirical assessment or theoretical refinement based on evidence?  
  *Check:* Could the core claims or approach:  
      a) *Be challenged by future evidence?* (Even if not directly testable *now* or by *this* study).  
      b) *Lead to new, empirically tractable questions?*  
      c) *Be refined or corrected based on new findings or critiques?*  
  *Catches:* Unfalsifiable dogma, theories immune to counter-evidence, circular reasoning, purely descriptive work with no explanatory ambition.  
  *Unfair Exclusion Risk:* Foundational theoretical work establishing core concepts, some historical interpretations.  
  *Judgment Call?* **HIGH.** This is the core judgment call. Focus on *potential* for future accountability, not immediate testability. Ask: "Is this a dead end, or could productive scientific conversation stem from it?"  

  **Step 5: Honesty About Scope & Advocacy**  
  *Philosophical Basis:* **Haack's "Inquiry vs. Advocacy"/Scientific Integrity**.  
  *Check:* Does the paper:  
      a) Clearly distinguish empirical claims from normative/prescriptive claims?  
      b) Avoid misrepresenting the strength or certainty of its findings?  
      c) If advocacy-driven, does it transparently acknowledge this bias and still meet Steps 1-4 for its empirical claims?  
  *Catches:* Advocacy masquerading as neutral science, overclaiming results, hiding normative agendas.  
  *Unfair Exclusion Risk:* None, if applied fairly. Transparency about advocacy doesn't disqualify; hiding it or letting it distort empirical work does.  
  *Judgment Call?* Low-Medium. Spotting overclaiming and hidden agendas takes some critical reading.  

  **Decision Rule:**  
  *   **Send for Review:** Passes all 5 steps.  
  *   **Reject without Review (Unscientific):** Fails Step 1 (No Empirical Engagement) OR Fails Step 2 (Lack of Transparency/Intersubjectivity) OR Fails Step 3 (Severe Lack of Argumentative Rigor) OR Fails Step 4 (No Potential for Refutation/Development - Dead End) OR Fails Step 5b/c (Dishonest Advocacy Overriding Evidence).  
  *   **Borderline ("Maybe"):** Passes Steps 1-3 and 5, but Step 4 (Potential for Refutation/Development) is highly debatable. *When in doubt, send for review.*

  ---

  **Application to Borderline Submissions:**

  1.  **Freudian Analysis of Authoritarianism:**
      *   **Step 1 (Empirical Engagement):** YES. Engages with observable political events (interpretively).
      *   **Step 2 (Transparency):** MAYBE/JUDGMENT CALL. Depends heavily on how clearly the interpretive method/lens is explained. Is the "oedipal dynamic" operationally defined? Can others follow *how* events are interpreted through this lens? Often a weakness in such papers.
      *   **Step 3 (Reasoning):** RISK. Prone to circularity ("this event shows oedipal conflict because it fits the theory"). Check for explicit reasoning linking specific event features to the theoretical concept and acknowledgment of alternative readings.
      *   **Step 4 (Potential Refutation/Development):** **MAJOR JUDGMENT CALL.** Core challenge: What observable evidence *could* definitively contradict "collective oedipal dynamic"? If the theory is so flexible it explains *any* political outcome, it's degenerative (fails Step 4). Does it generate *novel*, testable predictions beyond post-hoc interpretation? If purely interpretive with no criteria for a "wrong" reading, it likely fails. If it specifies *what patterns would count against* the interpretation (even qualitatively), it might pass.
      *   **Step 5 (Advocacy):** PROBABLY OK. Assuming it presents itself as interpretation/theory, not proven fact.
      *   **Procedure Decision:** **Likely REJECT** due to failing **Step 4** (High risk of unfalsifiable, degenerative interpretation) and potential failure on **Step 2/3**.  
      *   **Reasonable Editor "Maybe"?** YES. If the paper rigorously defines its interpretive criteria and shows *how* alternative explanations (e.g., economic grievance) fail to explain *specific* features that the oedipal lens does, it *could* pass Step 4 as generating a progressive research program for qualitative political psychology. This is a high bar.

  2.  **Rational-Choice Model of Climate Activism (No Test):**
      *   **Step 1 (Empirical Engagement):** YES. Makes claims about real-world behavior (activism, free-riding).
      *   **Step 2 (Transparency):** YES. Models and assumptions are presumably clear.
      *   **Step 3 (Reasoning):** YES. Math is internally consistent; reasoning from assumptions to conclusion is logical.
      *   **Step 4 (Potential Refutation/Development):** **JUDGMENT CALL.** This is the crux. *Internally consistent models are not science by themselves.* Does the paper:
          *   Clearly identify *observable implications* of the model? (What specific patterns in real activism *should* we see if this model is correct?)
          *   Discuss *how* these implications *could* be tested empirically (even if not done here)?
          *   Acknowledge that the model's assumptions might be unrealistic and discuss how relaxing them might change predictions?
          *   Situate itself within a research program where such models *are* tested? If it's *just* the model with no link to empirical reality ("untestable just-so story"), it fails Step 4 as a dead end. If it clearly states testable implications and invites empirical scrutiny, it passes.
      *   **Step 5 (Advocacy):** YES. Presumably presents the model neutrally as an explanation.
      *   **Procedure Decision:** **Likely REJECT** if it presents *only* the model with **no discussion of testable implications or connection to empirical research program** (fails **Step 4**).  
      *   **Reasonable Editor "Maybe"?** YES, but less likely than Case 1. If the paper meticulously derives novel, non-obvious testable hypotheses from the model and discusses plausible empirical strategies, it *could* pass Step 4 as a valuable theoretical contribution prompting future research. Simply saying "this could be tested" without specifics isn't enough.

  3.  **Empathy & Fiction Survey (Advocacy-Driven):**
      *   **Step 1 (Empirical Engagement):** YES. Uses survey data.
      *   **Step 2 (Transparency):** YES. Methods (survey, measures) should be describable.
      *   **Step 3 (Reasoning):** **FLAG.** High risk! Does the discussion acknowledge limitations (correlation ≠ causation, self-report bias, definition of "literary fiction")? Does it consider alternative explanations (e.g., empathetic people seek out literary fiction)? Treating the hypothesis as "confirmed" based on one correlational study suggests poor reasoning rigor.
      *   **Step 4 (Potential Refutation):** YES. The core claim is eminently testable with better designs (longitudinal, experimental controls).
      *   **Step 5 (Advocacy):** **FLAG (5b/c).** Explicit advocacy goal is fine (passes 5a), but *overclaiming* results ("confirmed") and potentially letting advocacy bias override scientific caution (in discussion) are serious problems. Did the design or analysis choices seem skewed to guarantee the desired result?
      *   **Procedure Decision:** **SEND FOR REVIEW (But Flagged)**. It passes Step 1, 2, 4 clearly. Step 3 (Reasoning Rigor) and Step 5b/c (Overclaiming/Distortion) are significant concerns **but are matters of scientific quality (bias, overinterpretation), not whether it's scientific at all.** These are *exactly* what peer review exists to catch and critique.  
      *   **Reasonable Editor "Maybe" for Reject?** POSSIBLY. If the methodological flaws or advocacy bias are *so* egregious and obvious in the initial read (e.g., blatantly leading survey questions, ignoring huge confounds, no stats), an editor might reject as *fatally flawed* science. The procedure errs on the side of review for empirical work with testable claims.

  ---

  **Honest Assessment of the Procedure:**

  *   **The Judgment Call Dressed as Checklist:** **Step 4 (Potential for Refutation/Development)** is inherently judgmental. It requires assessing the *future trajectory* implied by the work. Does it open doors to empirical inquiry, or close them? This is where philosophical concepts (Lakatos, Laudan) meet editorial discretion. The checklist makes the criterion explicit but can't remove the need for informed judgment about what constitutes a "progressive" or "dead-end" contribution in a specific subfield.
  *   **Guarding Against Conservatism:** The procedure avoids mandating specific methods (quant/qual), direct testability, or novelty. It focuses on core scientific *attitudes*: connection to evidence, transparency, rigor in argument, openness to challenge, and honesty. Good qualitative work, theoretical modeling, and advocacy-informed science can all pass.
  *   **What it Won't Catch:** Subtle forms of bias, deeply flawed but *scientifically framed* methodologies, or papers that are simply boring/unimportant. Peer review is still essential for quality control.
  *   **Strength:** It forces the editor to articulate *why* a paper feels unscientific. Instead of "this is psycho-babble," they must ask: "Is the reasoning opaque? Is the interpretation untethered from any potential counter-evidence? Is it circular?"

  This procedure provides a structured, philosophically grounded way to filter out submissions that lack the fundamental commitments of scientific inquiry (empiricism, transparency, accountability) while remaining flexible enough to accommodate the diverse and often untidy landscape of legitimate social science research. It explicitly highlights Step 4 as the key judgment zone. When Step 4 is ambiguous, the default should be to send it for review.
