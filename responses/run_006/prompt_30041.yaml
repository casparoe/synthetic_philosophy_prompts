prompt: |-
  I keep a running list of what I would actually do in variants of the two-envelope problem, and the list will not cohere. The basic setup is the usual one: two sealed envelopes, one containing twice as much money as the other, and I am offered one of them. In the original case, where I am told nothing about how the amounts were chosen and I have not opened my envelope, I am confident there is no reason to switch: the situation is symmetric, and any argument whose conclusion is that I should switch must have a broken step, even if I cannot always find it. But here is the friction. If I open my envelope and see, say, $100, the thought that the other envelope has either $50 or $200, so its expected value is $125, still feels as if it should license switching; and I cannot shake the feeling even though I do not believe that seeing an amount should matter when I have no prior at all.

  Where my verdicts are firmer, they run like this. (B) I am told in advance that the pair is either ($50, $100) or ($100, $200), with equal probability, and I open my envelope to find $100. I switch, and I think this is clearly right. (C) Same setup, but I find $200; then the pair must be ($100, $200), my envelope is the larger, and I do not switch. (D) The smaller amount was drawn uniformly from the integers $1 through $100. I find $75; since the larger amount is always even, I know mine is the smaller, and I switch without hesitation. I find $200 instead; I know mine is the larger, and I do not switch. (E) Same uniform setup, but I find $80, an even amount in the interior. I lean toward switching, since $40 and $160 are both live possibilities, but my confidence is noticeably lower than in (B), and I am not sure that lower confidence is rational.

  The problem is that these verdicts look mutually inconsistent. In (A) I deny any advantage to switching, yet in (B) and (E) I switch after seeing an amount; and if the double-or-half step were sound no matter what I saw, then a reason to switch would have been available before opening, which is just what I denied. Meanwhile, the expected-value calculation that moves me in (B) is doing the same work in (A) after I open the envelope, where I distrust it. I want the principle that tells me, for any variant, when switching is rational and when it is not, stated precisely enough to compute with. I suspect the key is something like this: the double-or-half step is only licensed once a probability distribution over the possible pairs is fixed, and there is a threshold probability that my envelope is the smaller one, below which I should not switch — I have heard both one-half and one-third suggested and do not know which is right, or whether it changes with the amounts or with the ratio between the envelopes. Please tell me which of my verdicts (A)–(E) the principle saves, which it forces me to revise, and what it says about two further cases. First, the smaller amount is drawn uniformly from $1 to $100 and I find $100; the other envelope is either $50 or $200, and I keep going back and forth. Second, the smaller amount n is chosen with probability proportional to 3 to the power of −n (for n = 1, 2, 3, ...), and I find $2; the other envelope is either $4 or $1, and a 25 percent chance of doubling feels tempting, but I am not sure it compensates for a 75 percent chance of halving. Finally, does the principle still apply when the expected amount in my envelope is infinite under the stated distribution, or does expected-value reasoning simply go silent there? When you answer, please lead with your bottom line in the first sentence and then give your reasoning, with no preamble and without restating the question; and please keep separate what is settled — the probability and