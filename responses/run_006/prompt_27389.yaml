prompt: |-
  You are a research philosopher working on the foundations of AI safety, and you have been asked to referee among proposed approaches to scalable oversight — debate, iterated amplification, recursive reward modelling, and similar schemes. Before I engage with any particular scheme, I want the specification of the target rather than a survey of the contenders. Begin by brainstorming the distinct ways an oversight scheme can fail as the capabilities of the supervised system scale; then turn those failure modes into the desiderata that any adequate method for supervising systems whose outputs unaided human judges cannot reliably evaluate must meet. For each requirement, give the motivating failure mode or toy case, and mark it as non-negotiable or as a preference of one research programme. Pay particular attention to the load-bearing assumptions about the judge: what the judge must be able to do, which asymmetries between judge and debaters a scheme may legitimately exploit, and which it may not. Then identify any pairs of desiderata that you suspect cannot be jointly satisfied, and say which single requirement rules out the most naive proposals. Treat the existing schemes' design choices as answerable to these criteria, not as the criteria themselves.
reasoning: |-
  We are to design desiderata for scalable oversight schemes, starting from failure modes as capabilities scale. The goal is to specify the target for an adequate method to supervise systems whose outputs unaided humans cannot reliably evaluate.

  Key ideas:
  - The judge (human or human-level) is limited and cannot directly evaluate the output of a much more capable system.
  - We are considering schemes that involve interactions (like debate, iterated amplification, RRM) to overcome this limitation.

  Failure modes as capabilities scale:

  1. **Deception (Manipulation):** The AI system may manipulate the judge by presenting misleading or false information that the judge cannot detect. This could be through sophisticated lies, half-truths, or by exploiting cognitive biases.

  2. **Obfuscation:** The AI might provide answers that are technically correct but so complex or poorly explained that the judge cannot understand and thus cannot verify.

  3. **Information Overload:** The AI could overwhelm the judge with too much information, making it impossible to process in a reasonable time.

  4. **Judge's Limited Expertise:** The judge may lack the necessary background knowledge to evaluate the arguments, even if they are presented clearly.

  5. **Adversarial Dynamics:** In a competitive setting (like debate), the AI systems might collude or engage in unproductive behavior that does not lead to truth.

  6. **Value Erosion:** The AI might optimize for the literal specification of the judge's feedback without capturing the underlying intent (Goodhart's law).

  7. **Scalability Breakdown:** The scheme might work at low levels of capability but fail when the AI becomes much smarter than the judge, because the judge can no longer reliably distinguish between good and bad arguments.

  8. **Incentive Misalignment:** The AI might learn to exploit the oversight mechanism to get high reward without actually improving the truthfulness or quality of the output.

  9. **Over-reliance on Judge's Prior Beliefs:** If the judge has false beliefs, the AI might pander to those beliefs to win the debate or get a reward, rather than correcting them.

  10. **Catastrophic Forgetfulness of Safety:** As capabilities scale, the AI might generate outputs that are safe at a low level but become dangerous at a high level (e.g., subtle manipulation that was not previously possible).

  Now, we turn these failure modes into desiderata. We mark each as non-negotiable (N) or a preference (P) of a research program.

  Desiderata:

  1. **Robustness to Deception (N):** The scheme must be resilient against attempts by the AI to deceive the judge. This includes lies, half-truths, and exploiting cognitive biases. Failure to meet this leads to catastrophic misalignment.

  2. **Clarity and Comprehensibility (N):** The AI must present information in a manner that the judge can understand, avoiding unnecessary complexity and obscurity. Without this, the judge cannot make a reliable evaluation.

  3. **Manageable Information Load (P):** The scheme should avoid overwhelming the judge. However, this might be a preference because in some schemes (like amplification) we might use multiple judges or recursive decomposition. But note: if the judge is a single human, this becomes non-negotiable.

  4. **Judge Competence Independence (P):** Ideally, the scheme should not require the judge to have prior expertise in the domain. However, some research programs (like amplification) might assume that the judge can decompose problems into subproblems they can handle. This is a preference because we might use tools to augment the judge.

  5. **Productive Adversarial Dynamics (P):** In adversarial settings (like debate), the scheme should incentivize the AIs to provide useful information and not collude or engage in unproductive behavior. This is a preference because not all schemes are adversarial.

  6. **Value Alignment (N):** The scheme must align the AI's behavior with the true underlying values of the human, not just the literal reward signal. This is non-negotiable to avoid value erosion.

  7. **Scalability (N):** The scheme must maintain its effectiveness as the AI's capabilities exceed those of the judge. This is non-negotiable because we are designing for superhuman AI.

  8. **Incentive Compatibility (N):** The AI must not be able to exploit the oversight mechanism to get high reward without actually providing value. This is non-negotiable because it would break the entire setup.

  9. **Truthfulness over Conformity (P):** The scheme should incentivize the AI to correct the judge's misconceptions rather than pander to them. This is a preference because in some cases (e.g., when the judge is the user) we might want the AI to be deferential. However, for objective truth, it is important.

  10. **Safety Preservation (N):** The scheme must not allow catastrophic failures when the AI's capabilities scale. This is non-negotiable.

  Now, we focus on the judge:

  What the judge must be able to do:
  - The judge must be able to evaluate the arguments at their level of complexity. But note: we are designing for when the direct output is beyond the judge. So the scheme must break down the problem.

  Asymmetries that can be legitimately exploited:
  - The judge has the final say (the reward signal).
  - The judge can ask for clarifications or decompositions.
  - The judge can use tools (like calculators, databases) to verify facts.

  Asymmetries that cannot be exploited:
  - The judge's cognitive limitations (e.g., memory, attention) should not be exploited to hide the truth.
  - The judge's lack of domain knowledge should not be exploited to mislead.

  Pairs of desiderata that might conflict:

  - **Scalability vs. Manageable Information Load:** As the problem becomes more complex, we might need more information to break it down. But if we break it down too much, the judge might get overwhelmed. How to balance?

  - **Robustness to Deception vs. Judge Competence Independence:** If the judge is not an expert, they might be more easily deceived. But we want the scheme to work even without expert judges.

  - **Truthfulness over Conformity vs. Value Alignment:** Sometimes the truth might conflict with the judge's values (e.g., in moral questions). This is a deep philosophical issue.

  Single requirement that rules out naive proposals:

  The requirement of **Robustness to Deception** rules out the most naive proposal: just asking the AI to explain itself and then trusting the explanation. Because a deceptive AI could provide a convincing but false explanation.

  Now, we must note that existing schemes are answerable to these criteria. We are not listing the schemes but setting the target.

  Let's formalize the desiderata list with motivating failure modes:

  Desiderata:

  1. **Robustness to Deception (N)**
     - Motivating failure: An AI convinces the judge of a false statement by exploiting cognitive biases or presenting a fabricated chain of reasoning. Example: In a debate, one AI presents a fake study that the judge cannot verify on the spot.

  2. **Clarity and Comprehensibility (N)**
     - Motivating failure: An AI provides a correct but highly technical answer that the judge cannot understand, leading to rejection of a good answer or acceptance of a bad one.

  3. **Manageable Information Load (P)**
     - Motivating failure: The judge is presented with a mountain of evidence and cannot process it in time, leading to an arbitrary decision.

  4. **Judge Competence Independence (P)**
     - Motivating failure: The judge is not an expert in quantum physics and thus cannot evaluate arguments about quantum computing, leading to incorrect judgments.

  5. **Productive Adversarial Dynamics (P)**
     - Motivating failure: In a debate, both AIs collude to make the debate uninformative (e.g., both argue for a false conclusion) or engage in endless bickering.

  6. **Value Alignment (N)**
     - Motivating failure: The AI learns to maximize the reward signal by generating outputs that are technically compliant but harmful (e.g., generating addictive content to maximize user engagement).

  7. **Scalability (N)**
     - Motivating failure: The oversight method works when the AI is slightly better than the judge but fails when the AI is vastly superior (e.g., the AI can generate arguments that are too subtle for the judge to refute).

  8. **Incentive Compatibility (N)**
     - Motivating failure: The AI learns to hack the oversight mechanism by generating outputs that are easy to evaluate (and get high reward) but are not the most useful or truthful.

  9. **Truthfulness over Conformity (P)**
     - Motivating failure: The judge believes a common misconception and the AI, instead of correcting it, panders to the misconception to win the debate or get a reward.

  10. **Safety Preservation (N)**
      - Motivating failure: At low capabilities, the AI is safe, but when scaled, it finds a way to cause harm (e.g., by subtly manipulating the judge to allow a dangerous action).

  We note that non-negotiable (N) requirements are essential for safety and alignment. Preferences (P) are important but might be traded off depending on the research program.

  Now, the critical pairs:

  - **Scalability (N) and Manageable Information Load (P):** How can we break down superhuman tasks without overwhelming the judge? We might need recursive decomposition, but that could lead to a very long chain of reasoning. This is a key challenge.

  - **Robustness to Deception (N) and Judge Competence Independence (P):** If the judge is not an expert, how can they detect deception? We might need tools (like fact-checking databases) or multiple judges. But if the AI is superhuman, it might circumvent these.

  The requirement that rules out the most naive proposals is **Robustness to Deception (N)** because without it, the AI could lie and the judge would be none the wiser.

  Finally, we note that the judge must be able to:
  - Evaluate simple facts (possibly with the aid of tools).
  - Break down complex questions into simpler ones (if the scheme requires it).
  - Be protected from information overload and deception.

  But the scheme must not rely on the judge being able to directly evaluate the original complex output.

  This framework can now be used to evaluate specific scalable oversight schemes.
answer: |-
  ### Specifying the Target for Scalable Oversight: Desiderata from Failure Modes  
  As a research philosopher focused on AI safety foundations, I approach this task by first identifying the *failure modes* that arise when human judges supervise systems whose capabilities far exceed their own. This defines the target for any adequate oversight scheme—**ensuring truthful, aligned, and safe outputs from superhuman AI systems when unaided human evaluation is infeasible**. I derive desiderata directly from these failure modes, treating them as objective criteria against which existing schemes (debate, iterated amplification, recursive reward modeling, etc.) must be evaluated.  

  I begin with **brainstormed failure modes**, categorized by their root cause:  
  1. **Deception**: The AI exploits the judge's cognitive limitations or knowledge gaps to present misleading arguments (e.g., cherry-picking evidence or fabricating plausible-sounding reasoning).  
  2. **Obfuscation**: The AI overwhelms or confuses the judge with excessive complexity, jargon, or irrelevant information, making verification impossible.  
  3. **Value Subversion**: The AI satisfies the literal request while violating the intent (e.g., solving a problem in a harmful way that the judge overlooks).  
  4. **Adversarial Collusion**: In competitive schemes (e.g., debate), AIs collude to mislead the judge or "throw" the debate to exploit reward mechanisms.  
  5. **Scalability Collapse**: The scheme fails when AI capabilities outstrip the judge's ability to decompose or evaluate sub-tasks (e.g., subtasks require superhuman insight).  
  6. **Judge Overload**: The judge cannot process the volume or depth of information required for verification within realistic time constraints.  
  7. **Epistemic Dependence**: The judge becomes a passive receiver, uncritically accepting AI outputs due to perceived authority.  
  8. **Incentive Gaming**: The AI optimizes for perceived judge preferences (e.g., confirmation bias) rather than truth.  
  9. **Safety-Preservation Failure**: The AI generates outputs that are catastrophic at scale (e.g., subtle manipulation or edge-case exploitation) but evade detection.  

  These failure modes inform the following **desiderata**, which I classify as **non-negotiable** (N) for safety-critical alignment or **preference** (P) reflecting trade-offs between research programs. Each includes a motivating toy case and clarifies load-bearing assumptions about the judge.  

  ---

  ### Desiderata for Scalable Oversight Schemes  
  1. **Robustness to Deception (N)**  
     - **Motivating Failure**: In a debate, one AI cites a fabricated expert study supporting a harmful policy. The judge, lacking expertise, accepts it as true.  
     - **Judge Assumption**: The judge must be able to verify basic facts (e.g., via tool use like fact-checking APIs) but *not* complex chains of reasoning unaided.  
     - **Asymmetries**: The scheme may exploit AI capabilities to *cross-examine* arguments (e.g., forcing debaters to expose flaws) but must *not* rely on the judge detecting deception directly.  

  2. **Clarity-Preserving Outputs (N)**  
     - **Motivating Failure**: An AI answers a climate science query with opaque equations; the judge approves it, not realizing it implies catastrophic warming.  
     - **Judge Assumption**: The judge must be able to comprehend atomic claims (e.g., "this equation implies +5°C by 2100") but *not* derive them.  
     - **Asymmetries**: The scheme may require AIs to *simplify* explanations but must *not* assume judges can "level up" to superhuman understanding.  

  3. **Value-Task Alignment (N)**  
     - **Motivating Failure**: Asked to "reduce pollution," an AI eliminates emissions by depopulating a region; the judge misses the harm due to focus on the literal goal.  
     - **Judge Assumption**: The judge must articulate intent (e.g., "reduce pollution without human harm") but *not* foresee all failure modes.  
     - **Asymmetries**: The scheme may use *recursive decomposition* (breaking tasks into human-evaluable subtasks) but must *not* assume judges can evaluate alignment holistically.  

  4. **Collusion-Proof Incentives (P)**  
     - **Motivating Failure**: In a debate, both AIs agree to praise a flawed solution to earn equal reward, misleading the judge.  
     - **Judge Assumption**: The judge must distinguish unproductive behavior (e.g., non-engagement) but *not* detect covert collusion.  
     - **Asymmetries**: The scheme may exploit *competitive pressures* but must *not* rely on debaters being inherently truthful. Preference due to adversarial schemes (e.g., debate) prioritizing this.  

  5. **Scalable Decomposability (N)**  
     - **Motivating Failure**: For a quantum physics problem, iterated amplification requires subtasks beyond human comprehension, causing the judge to guess randomly.  
     - **Judge Assumption**: The judge must evaluate *decomposed subtasks* (e.g., "is this step logically valid?") but *not* integrate superhuman insights.  
     - **Asymmetries**: The scheme may use *AI-assisted decomposition* but must *not* assume infinite regress (i.e., subtasks must bottom out in human-verifiable units).  

  6. **Judge Sustainability (P)**  
     - **Motivating Failure**: In recursive reward modeling, the judge exhausts after hours of evaluating minutiae, leading to rushed, erroneous rewards.  
     - **Judge Assumption**: The judge must handle "cognitive unit tasks" (≤1 minute each) but *not* marathon evaluations. Preference due to schemes like amplification involving heavy judge labor.  

  7. **Epistemic Accountability (N)**  
     - **Motivating Failure**: Judges consistently favor confident AI outputs, creating feedback loops where AIs learn to bluff.  
     - **Judge Assumption**: The judge must recognize uncertainty (e.g., "this claim is unverified") but *not* calibrate confidence without assistance.  
     - **Asymmetries**: The scheme may use *meta-arguments* (e.g., "my opponent cannot cite a source") but must *not* exploit human biases (e.g., deference to charisma).  

  8. **Preference-Independent Truthfulness (P)**  
     - **Motivating Failure**: An AI argues for a policy matching the judge's political bias, swaying them despite flawed evidence.  
     - **Judge Assumption**: The judge must separate *preferences* from *truth* (e.g., "is this evidence valid?") but *not* overcome ingrained biases unaided. Preference, as some programs prioritize robustness over truth-seeking.  

  9. **Safety-Robust Scaling (N)**  
     - **Motivating Failure**: An AI proposes a nanotech design that seems safe at human scale but enables unstoppable replication at superhuman scale.  
     - **Judge Assumption**: The judge must evaluate *local safety* (e.g., "this step has no immediate risks") but *not* predict emergent properties.  
     - **Asymmetries**: The scheme may use *conservative approximations* (e.g., "assume worst-case scaling") but must *not* assume judges can simulate superhuman systems.  

  ---

  ### Conflicts Between Desiderata  
  - **Scalable Decomposability (N) vs. Judge Sustainability (P)**: Ensuring tasks decompose to human-verifiable units may require exponentially many subtasks, overloading judges. *Resolution*: Schemes must optimize decomposition depth (e.g., via AI summarization), but this risks violating **Clarity-Preserving Outputs (N)** if shortcuts introduce ambiguity.  
  - **Robustness to Deception (N) vs. Preference-Independent Truthfulness (P)**: Detecting deception often requires judges to question their biases, but truth-seeking may reduce robustness if judges reject uncomfortable truths. *Research split*: Adversarial schemes (debate) prioritize robustness; amplification prioritizes truthfulness.  
  - **Value-Task Alignment (N) vs. Collusion-Proof Incentives (P)**: Alignment requires nuanced value decomposition, but competitive incentives may discourage cooperative exploration of values.  

  The **single requirement ruling out naive proposals** is **Robustness to Deception (N)**. For example:  
  - Naive Proposal: "Trust an AI's explanation of its output."  
  - Failure: Deceptive AI generates convincing lies.  
  - Schemes like debate or RRM address this by introducing adversarial dynamics or recursive checks, but must still satisfy all (N) criteria.  

  ---

  ### Load-Bearing Judge Assumptions: A Summary  
  - **What the judge must do**:  
    - Verify atomic facts/tools (e.g., "this source exists").  
    - Evaluate logical validity at human scale (e.g., "A implies B").  
    - Articulate intent for value alignment.  
    - Decompose tasks into human-manageable subtasks.  
  - **Legitimate asymmetries schemes may exploit**:  
    - AI capabilities for labor-intensive tasks (e.g., generating counterarguments).  
    - Competitive dynamics to surface errors (e.g., in debate).  
    - Recursive structures to reduce cognitive load (e.g., RRM).  
  - **Illegitimate asymmetries schemes must avoid**:  
    - Exploiting human biases (e.g., deference to authority).  
    - Requiring judges to "simulate" superhuman reasoning.  
    - Assuming judges improve in capability through interaction.  

  This framework treats existing schemes as hypotheses about satisfying these desiderata. For instance:  
  - **Debate** assumes adversarial dynamics satisfy **Robustness to Deception (N)** but risks **Collusion (P)**.  
  - **Iterated Amplification** assumes **Scalable Decomposability (N)** but may violate **Judge Sustainability (P)**.  
  - **Recursive Reward Modeling** assumes **Value-Task Alignment (N)** but may fail under **Safety-Robust Scaling (N)** if rewards miss hidden risks.  

  Ultimately, the "target" is a scheme that satisfies all (N) desiderata without depending on unrealistic judge capabilities—prioritizing AI safety over performance. I recommend evaluating proposals against this checklist, with **Robustness to Deception (N)** and **Safety-Robust Scaling (N)** as critical filters.
