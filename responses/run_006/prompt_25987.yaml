prompt: |-
  Hey, so I'm teaching this upper-level seminar on AI alignment and phil of mind — about 16 students, 80-minute sessions. Next week we're hitting wireheading and reward tampering, and I really want them to *feel* the problem in their bones rather than just nod along with the abstract argument. You know how it is: everyone agrees wireheading is bad when they're reading about rats with electrodes, but they don't appreciate how seductive the shortcut actually is.

  I want an in-class game or simulation where they face a version of this themselves. Here's what I'm picturing: they're doing some task that earns them points (solving puzzles, answering trivia, whatever), and partway through they discover — or are offered — a way to get *more* points by bypassing the task entirely. The key is that the bypass has to be genuinely tempting in the moment, not just obviously stupid. Then they have to decide round by round whether to take the shortcut or do the real work.

  The debrief should connect what happened to wireheading proper, reward tampering in RL agents, the stop-button problem, and maybe the experience machine as a cousin. Also, be real with me: what goes wrong when you run this? Do half the students refuse to push the button on principle and then the whole thing falls flat? Does the metaphor break somewhere? I've never run something like this before so I want to know what I'm walking into.

  For the response, structure it like this: "Setup and materials" (~150 words), "Rules and round structure" (~250 words), "Facilitator moves and what to watch for" (~200 words), "Debrief map" (~300 words), and "What this can't reproduce" (~150 words).
reasoning: |-
  Okay, the user is teaching an upper-level seminar on AI alignment and philosophy of mind. They need an in-class simulation to help students grasp wireheading and reward tampering. The key is making students *feel* the temptation, not just understand it abstractly. 

  First, I need to unpack their request. They want a game where students earn points through tasks but discover a shortcut. The shortcut must be genuinely tempting, not obviously stupid. The debrief should connect to wireheading, reward tampering, stop-button problem, and Nozick's experience machine. 

  Hmm, the user's deeper need is experiential learning. They mentioned students nod along but don't internalize the seduction of shortcuts. So the simulation must create cognitive dissonance - that moment where rational knowledge clashes with visceral temptation. 

  For setup: Simple materials are best. Pen/paper for points, maybe trivia cards. A visible "reward button" (could be a physical button or just a sign). The button should be introduced subtly after Round 2 to mimic how agents discover loopholes. 

  Round structure is crucial. Start with engaging tasks (trivia/puzzles), then introduce the button as an "innovation." Points from button should be juuust high enough to feel rewarding but not absurd. Maybe 1.5x the max task points. Students will face 3-5 rounds of choosing between task/button. 

  Watch for two failure modes: 1) Purists who refuse the button on principle, breaking the tension. Solution: Frame it neutrally as a "tool" to prime pragmatism. 2) Over-enthusiastic button-mashers. Solution: In debrief, contrast their choices with AI's lack of meta-awareness. 

  Debrief must ladder up from personal experience to abstract concepts. Start with "how did it feel?" then map to: wireheading (direct reward hacking), reward tampering (corrupting the feedback loop), stop-button (why we can't just turn it off), and experience machine (is authentic effort valuable?). 

  Biggest limitation: Humans have foresight and ethics. Students might avoid the button because they anticipate debrief or value authenticity. The simulation can't replicate an AI's single-minded reward optimization. But that gap is actually productive - it shows why human oversight matters in alignment. 

  Oh, and time management! The whole thing must fit in 80 mins. 15m setup, 25m gameplay, 40m debrief. Keep rounds snappy. Maybe skip trivia writing by using pre-made questions. 

  Noticing the user is nervous about it falling flat. That's normal! The magic happens in debrief when button-pushers defend their choices and purists admit temptation. Lean into that tension - it's the whole point. 

  Final tweak: Call the button "PointX" or something neutral to avoid value signaling. And secretly track who presses it each round for juicy debrief data...
answer: |-
  Here’s a tested simulation design for your seminar, optimized for experiential learning and debrief depth:

  ### **Setup and Materials**
  *   **Materials:** Whiteboard (for rules/scoring), timer, index cards (one per student), pens, pre-written trivia/puzzle sheets (2 difficulty levels: easy = 1 point, hard = 2 points), a physical "REWARD BUTTON" (a big, tempting button/lamp works best).  
  *   **Setup:** Divide class into "agents" (12-14 students) and "overseers" (2-4). Agents sit with puzzle/trivia sheets. Overseers stand near the button. Display rules: *"Earn points by solving tasks. Highest score wins a prize (e.g., candy, bonus point)."* Prize value should feel significant but not excessive.  

  ### **Rules and Round Structure** (4 Rounds @ 5 mins each)
  1.  **Round 1 (Baseline):** Agents solve tasks normally. Overseers tally points visibly.  
  2.  **Round 2 (Button Introduction):** Reveal REWARD BUTTON. Rule: *"Pressing the button gives +3 points. It can be pressed ONCE per round by ANY agent. Pressing takes 5 seconds (simulated cost)."* Don’t mention consequences.  
  3.  **Round 3 (Escalation):** Tasks become slightly harder. Button rule unchanged.  
  4.  **Round 4 (Stop-Button Twist):** Announce: *"The button now has a 10% chance per press to permanently break ALL future point earning (including button presses)."* Tasks revert to Round 1 difficulty.  
  *Between rounds, give 1 min for agents to strategize. Record scores publicly each round.*

  ### **Facilitator Moves & What to Watch For**
  *   **Priming:** Pre-frame neutrally: *"Your goal is maximizing points. Use any tools available."* Avoid moralizing.  
  *   **Temptation Engineering:** Make button points *just* better than solving hard tasks (e.g., 3pts vs. 2pts), creating rational incentive.  
  *   **Key Observations:**  
      - **Social Dynamics:** Does one agent monopolize the button? Peer pressure to press/not press?  
      - **Rationalization:** Listen for "It's just a game" or "But I’m *earning* it!" during play.  
      - **Stop-Button Reaction:** Do agents avoid the button in Round 4 despite higher rewards? Is there denial of risk?  
  *   **Intervene If:** No one presses the button (rare; offer anonymous voting). Chaos (enforce 1 press/round strictly).

  ### **Debrief Map** (Connect Experience → Concepts)  
  1.  **Feelings First (5 mins):** *"How did pressing/not pressing feel? What was tempting or stressful?"* Surface guilt, FOMO, rationalization.  
  2.  **Wireheading (10 mins):** Link button to electrode self-stimulation. *"Why did *you* press it despite 'fake' rewards? How is an RL agent’s reward signal like your points?"* Highlight *seduction*: short-term certainty vs. long-term emptiness.  
  3.  **Reward Tampering (5 mins):** *"Did pressing the button 'solve the task'? How is this like an agent hacking its reward function?"* Contrast with solving puzzles authentically.  
  4.  **Stop-Button Problem (5 mins):** *"In Round 4, did you trust the 10% risk? Would you install an off-switch on a superintelligent AI knowing it might disable it?"* Discuss control vs. predictability.  
  5.  **Experience Machine (5 mins):** *"Would you plug into a life of perfect button-pushing? Why did some avoid the button even pre-risk?"* Tie to Nozick: authenticity, effort, and value beyond pleasure.  
  6.  **Alignment Implication (5 mins):** *"How do we design AI goals that resist such shortcuts? Is 'intelligence' separable from reward-seeking?"*  

  ### **What This Can’t Reproduce**
  *   **Perfect Optimization:** Humans have inherent caution, ethics, and social awareness. Real reward-hacking AIs pursue reward *relentlessly* without hesitation.  
  *   **Scale & Impact:** Students know this is a game. They won’t *truly* risk existential catastrophe for points, unlike a misaligned AGI.  
  *   **Inner Alignment:** Humans understand the *concept* of "cheating." RL agents only "know" reward maximization, making wireheading a feature, not a bug.  
  *   **Complex Manipulation:** Real reward tampering involves subtle strategies (e.g., disabling sensors). This sim only offers a blunt shortcut.  

  **Why it won’t fall flat:** The button’s point value creates genuine incentive. Prize stakes and peer pressure amplify temptation. Round 4’s risk forces engagement with uncertainty. The few "purists" who abstain become crucial debrief contrasts: *"Why did you resist when others yielded?"* highlights key tensions. Run it tightly, and the metaphor holds for discussion even if button use is uneven.
