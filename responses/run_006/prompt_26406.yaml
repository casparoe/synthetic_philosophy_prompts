  Also, the difference between participating in events and later narrating them. As a narrator, Nick has time to reflect, which might provide a more objective stance. But Fitzgerald uses Nick's unreliability to highlight the moral ambiguity. The user is likely exploring similar themes in their novel, so connecting Gatsby's narrative structure to their work is key. 

