  First, I need to recall Good's theorem. It states that for an ideal Bayesian agent, free information has non-negative expected value. But the user is interested in what happens when agents aren't ideal - they have computational limits, logical uncertainty, etc. The key question is whether such an agent could be worse off by receiving free information, where the harm isn't just from processing costs.

  Breaking down the components:
  1. Logical uncertainty and unawareness: If an agent can't fully grasp the implications of information due to computational limits, they might misupdate beliefs. Could this lead to worse decisions? I've heard of cases like computational Dutch books where bounded agents lose due to inconsistent updates. Also, unawareness - if the information reveals something the agent hadn't considered, could that paradoxically make them less rational? This seems like a plausible source of harm.

  2. Non-Bayesian agents: Ambiguity-averse agents (like in Ellsberg paradox) might prefer known risks over unknowns. Free information could sometimes increase perceived ambiguity. Also, agents using heuristics might have their decision process disrupted by extra information. There's research showing that too much information can impair decisions via choice overload or attention dilution. So this seems another strong factor.

  3. Indeterminacy of rationality: What does "rational" even mean for bounded agents? Without clear norms, it's hard to say if harm counts as irrational or just inevitable. If rationality is defined relative to computational constraints, maybe any harm is just a constraint, not irrationality. This might affect whether we see it as a counterexample.

  4. Other factors: Processing costs are excluded, but what about meta-cognitive costs? Also, information altering preferences or causing biases like anchoring. And importantly, the framing of "expectation" - whose probability? The agent's pre-info beliefs or an omniscient view?

  Putting it all together, logical uncertainty and unawareness seem like the strongest candidates for genuine harm beyond processing costs. The computational Dutch book examples are concrete. Non-Bayesian cases are also plausible but might be debated as "irrational" by Bayesians. The rationality indeterminacy makes it messy.

  My credence: 73%. Mostly leaning toward "yes, harm can happen" because of logical uncertainty cases. But uncertainty remains from the other factors.

  Most sensitive to logical uncertainty component. If someone proved bounded agents can always avoid harmful updating (e.g., via guarded learning), that would lower my credence. Conversely, more concrete impossibility theorems would raise it.

  Non-Bayesian part is also sensitive. If consensus emerges that ambiguity aversion isn't rational, that might weaken this angle. But currently, multiple rationality models exist.

  Indeterminacy is tricky - if we had a unified theory of bounded rationality, it might clarify. But we don't, so it adds uncertainty.

  Final credence 73% reflects that I think harm is possible via logical uncertainty, but other factors prevent higher certainty.
answer: |-
  ### My Credence
  **68%**  

  I assign a 68% credence that there is a defensible sense in which a rational but computationally bounded agent can be made worse off in expectation by receiving cost-free information, where the harm extends beyond mere processing costs. Below, I decompose the reasoning, weighing the key factors and their relative contributions to this credence. The estimate reflects the strength of theoretical counterexamples, empirical and experimental evidence, and unresolved philosophical debates.

  ---

  ### Decomposition of Reasoning
  The credence is decomposed into four major factors, with weights summing to 100% of my uncertainty. Each factor's contribution explains how much it "rides on" that aspect of the problem.

  1. **Logical Uncertainty and Unawareness (Weight: 40%)**  
     - **Rationale**: Logical uncertainty (where agents cannot deduce all implications of information due to bounded reasoning) and unawareness (where agents lack a complete state space of possibilities) are the strongest candidates for genuine counterexamples. For instance:  
       - In logical uncertainty, an agent might receive information that appears cost-free but leads to "misupdated" beliefs due to computational shortcuts (e.g., a bounded agent using approximate Bayesian updating might assign higher credence to a suboptimal action after seeing irrelevant data).  
       - Unawareness can cause harm if information reveals a possibility the agent hadn't considered, leading to "overfitting" of beliefs or decision paralysis. Computational Dutch books (where a series of decisions exploit bounded reasoning) demonstrate this empirically.  
     - **Contribution to Credence**: High weight because this factor directly violates Good's idealization of agents with unlimited deductive capacity. If such cases are deemed "rational for bounded agents," they provide a defensible counterexample. Examples from AI safety (e.g., agents misinterpreting proof hints) support this.

  2. **Non-Bayesian Rationality (e.g., Ambiguity-Sensitive Agents) (Weight: 30%)**  
     - **Rationale**: Ambiguity aversion (as in Ellsberg paradox) or other non-expected-utility models (e.g., rank-dependent utility) can rationally value ignorance. For example:  
       - Free information might resolve risk but increase perceived ambiguity (e.g., learning a probability is 0.4 instead of a vague "40–60% chance" could heighten aversion).  
       - Heuristic-driven agents (e.g., those using fast-and-frugal rules) might experience "information overload," degrading decision quality beyond processing costs (e.g., experiments show extra information can increase biases like anchoring).  
     - **Contribution to Credence**: Moderate weight because these models are well-established in behavioral economics, but Bayesians often argue that such preferences are "irrational." If one accepts non-Bayesian rationality, this is a robust counterexample.

  3. **Indeterminacy of "Rational Bounded Agent" (Weight: 20%)**  
     - **Rationale**: There is no consensus on what constitutes "rationality" for bounded agents. Key issues:  
       - Without clear norms (e.g., a unified theory of bounded rationality), it's ambiguous whether harm reflects irrationality or inevitable constraints.  
       - Notions like "expectation" are underspecified: Should we use the agent's own beliefs or an "objective" model? This makes it unclear if the harm is "in expectation" in a defensible sense.  
     - **Contribution to Credence**: Lower weight because indeterminacy cuts both ways—it might prevent a definitive counterexample but also enable defenses of harm (e.g., "rational" might permit context-dependent mistakes).

  4. **Other Factors (Weight: 10%)**  
     - **Rationale**: Includes:  
       - **Preference or goal disruption**: Information might alter the agent's values (e.g., learning a fact that triggers self-destructive curiosity).  
       - **Meta-cognitive costs**: Even without direct processing costs, information might induce anxiety or overconfidence, distorting future decisions.  
       - **Strategic interactions**: In multi-agent settings (e.g., game theory), free information can commit an agent to a suboptimal strategy.  
     - **Contribution to Credence**: Minor weight, as these are less direct challenges to Good's theorem but still plausible in bounded contexts.

  ---

  ### Sensitivity and Evidence
  - **Most Sensitive Component**: **Logical uncertainty and unawareness** (40% weight). This component drives the credence most because it has the strongest theoretical and empirical support for harm beyond processing costs.  
  - **Evidence/Arguments That Would Move My Credence Most**:  
    - **Downward Movement (e.g., to 40–50%)**: A proof that bounded agents can always avoid harmful updating via "robust" methods (e.g., bounded rationality models that guarantee non-negative expected value of information). For instance, if all logically uncertain updates could be made "conservative" to prevent Dutch books, this would weaken counterexamples.  
    - **Upward Movement (e.g., to 80–90%)**: Concrete impossibility theorems (e.g., showing that *no* computable decision rule avoids negative expected value information in some logical uncertainty scenarios) or robust experimental evidence (e.g., repeated demonstrations of welfare loss in AI agents with bounded computation).  

  This credence reflects a cautious optimism that Good's theorem breaks under bounded rationality, primarily due to logical uncertainty. However, the lack of a formalized "standard" for bounded rationality prevents higher certainty. For your coursework, I recommend exploring cases like computational Dutch books (e.g., Oesterheld and Conitzer 2021) for concrete examples. If you have additional constraints (e.g., specific models of bounded rationality), I can refine this estimate.
