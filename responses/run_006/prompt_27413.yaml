prompt: |-
  I run a small podcast on early modern philosophy and I've booked a guest who works on Sor Juana Inés de la Cruz, mostly on the Respuesta a Sor Filotea. The episode is supposed to be about her case for women's education, not a biography episode. Could you draft eight to ten interview questions that get inside the actual argument of the Respuesta, the kind a specialist would squirm over rather than a recap? I'd like at least one question on each of these, with a follow-up keyed to the answer the guest is most likely to give: the catologue of learned women and what it's actually meant to prove; how she handles the Pauline passages about women keeping silent or not teaching; whether her defense of secular learning is purely instrumental (useful for reading scripture and doing theology) and what that framing costs; and whether she's defending all women or only exceptional ones like herself. Also work in something about the rhetorical situation — especially that Sor Filotea is really a bishop writing under a woman's name — and something about whether the self-deprecating moves in the text are sincere or strategic. If there's room, one question on how the whole Carta atenagórica controversy constrains what she can say. No generic questions about why she became a nun or what got her into poetry.
