  I'm applying for a one-year dissertation fellowship and need a two-page research proposal (roughly 1,200 words). My half-formed idea is this. Accuracy-first epistemology attempts to derive epistemic norms from the single value of having accurate credences, where accuracy is measured by a strictly proper scoring rule. The flagship result — the accuracy-dominance argument for probabilism — is usually advertised as holding for every strictly proper scoring rule, and that robustness is taken to show that the argument does not depend on a contentious choice of measure. I suspect this overstates matters. Once one moves beyond probabilism to norms such as the Principal Principle, conditionalisation, or indifference principles, the choice of scoring rule appears to re-enter, and it is unclear whether that sensitivity is a defect that undermines the programme or a benign sign that these further norms require more than accuracy alone.

  Please turn this into a proposal with the following sections, in this order and at roughly these lengths:

  1. The question (about 200 words): state the research question precisely, and say which norms beyond probabilism the project will examine and why.
  2. Why it is open (about 300 words): explain how the existing accuracy-first literature handles the choice of scoring rule, where the arguments for the further norms depend on that choice, and what the standard responses leave unresolved. Do not include citations or a bibliography; I will add the references myself.
  3. Method and work plan (about 350 words): say what I would actually do, month by month across the year, and why this method — formal modelling plus a case-by-case examination of specific norms — is better suited than the obvious alternative of defending a single privileged scoring rule from the outset.
  4. Success and failure (about 200 words): describe what a successful outcome would look like, such as a taxonomy of the ways in which the choice of scoring rule enters the arguments and a considered verdict on whether the sensitivity is benign, and what would count as the project's failing.
  5. Scope and risks (about 150 words): identify the respects in which the project could become too large for a year and how it could be contained.

  Please write in British English, in a formal but not stuffy register, and do not include any bibliography, footnotes, or citations.
