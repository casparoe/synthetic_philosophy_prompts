answer: |-
  ## Research Proposal: Scoring Rule Sensitivity in Accuracy-First Epistemology Beyond Probertism

  **1. The Question (Approx. 200 words)**

  This project investigates a foundational tension within accuracy-first epistemology (AFE). AFE seeks to ground all epistemic norms solely in the value of holding accurate credences (degrees of belief), measured via strictly proper scoring rules (SPSRs). A core selling point is the purported robustness of its flagship argument, the accuracy-dominance justification for probabilism (credences should satisfy the probability axioms): it ostensibly holds for *any* SPSR, suggesting the choice of scoring rule is merely a technical, non-contentious implementation detail. This project challenges whether this robustness extends convincingly to other central epistemic norms. The central research question is: **When and why does the justification of epistemic norms beyond probabilism within the accuracy-first framework depend substantively on the choice of strictly proper scoring rule?**

  Specifically, the project will examine the accuracy-first derivations of three key norms: the Principal Principle (linking credences to objective chances), Conditionalisation (how credences should update on new evidence), and specific Indifference Principles (for assigning priors under complete symmetry). These norms are chosen because they represent significant extensions beyond the basic coherence requirement of probabilism, are actively debated within AFE, and preliminary analysis suggests their derivations may exhibit sensitivity to SPSR choice. The goal is to map the nature and extent of this sensitivity and evaluate its philosophical implications for the AFE programme.

  **2. Why it is Open (Approx. 300 words)**

  The existing accuracy-first literature typically handles the choice of SPSR in two ways concerning arguments beyond probabilism. Firstly, there is an often implicit or background assumption that the robustness demonstrated for probabilism carries over: derivations are presented using a specific, convenient SPSR (like the Brier score) with the suggestion that the result holds generally, mirroring the probabilism case. Secondly, when derivations for norms like Conditionalisation or the Principal Principle are formally presented, they frequently rely on mathematical properties specific to the chosen SPSR. For instance, arguments for Conditionalisation often exploit additivity or separability properties inherent in some SPSRs but not others. Similarly, derivations of chance-credence principles may depend on how a particular SPSR handles expected accuracy calculations under chance constraints.

  Standard responses to potential sensitivity are underdeveloped. One common strategy is to downplay the significance, suggesting that any SPSR will deliver *some* norm, and the derived norm is still accuracy-motivated even if the specific path depends on the measure. Another is to seek derivations that appear to work for broad classes of SPSRs, though the boundaries of these classes and their justification often remain unclear. Crucially, the literature leaves several key issues unresolved. It is seldom systematically demonstrated whether alternative SPSRs genuinely support the *same* norm, or whether they subtly (or drastically) alter the requirements. Furthermore, there is little explicit discussion of *why* dependence arises for these norms but not for probabilism, or whether this dependence reveals a deeper limitation of the accuracy-first approach – perhaps indicating that these norms require additional epistemic values beyond mere accuracy. The philosophical significance of this potential sensitivity, whether it constitutes a benign technicality or a fundamental challenge, remains an open and pressing question.

  **3. Method and Work Plan (Approx. 350 words)**

  The project employs a method combining formal modelling with a detailed, comparative case-study approach. The core strategy is to examine the derivations of the selected norms (Principal Principle, Conditionalisation, Indifference) under different, representative SPSRs, rather than presupposing a privileged rule. This comparative analysis is essential because pre-selecting one SPSR (e.g., Brier score) risks obscuring the very sensitivity under investigation and potentially biases the results towards norms derivable only under that specific measure. By systematically varying the scoring rule and observing the consequences for the derived norms, we can isolate the precise mathematical features driving the dependence and assess its scope.

  The work plan spans a twelve-month period:

  *   **Months 1-2:** **Foundations & Probabilism Baseline:** Deep dive into the formal machinery of AFE, focusing on the structure of accuracy arguments and the properties defining SPSRs. Reconstruct the robustness proof for probabilism across different SPSRs to solidify the baseline case where sensitivity is absent.
  *   **Months 3-4:** **Principal Principle Case Study:** Analyse existing accuracy-based arguments for chance-credence principles (e.g., using expected accuracy minimisation). Formalise these arguments explicitly under at least three distinct SPSRs (e.g., Brier score, logarithmic score, spherical score). Identify where and how the derivations differ based on the scoring rule.
  *   **Months 5-6:** **Conditionalisation Case Study:** Examine prominent accuracy arguments for Conditionalisation (e.g., Greaves & Wallace style expected accuracy maximisation). Replicate the analysis across the same representative SPSRs. Scrutinise the role of properties like additivity, propriety types (strict vs. weak), and separability.
  *   **Months 7-8:** **Indifference Principles Case Study:** Investigate attempts to derive indifference principles (e.g., for symmetric hypotheses) from accuracy considerations. Apply the comparative method, focusing on how different SPSRs handle state spaces with symmetries and their implications for prior credences.
  *   **Months 9-10:** **Synthesis & Analysis:** Systematically compare findings across the three case studies. Identify patterns: e.g., does sensitivity arise only for certain argument types? Are specific SPSR properties consistently implicated? Develop a preliminary taxonomy of dependence types.
  *   **Months 11-12:** **Philosophical Evaluation & Writing:** Assess the implications of the identified sensitivities. Evaluate arguments for whether the dependence is benign (e.g., merely selecting between equally accuracy-conducive options) or problematic (e.g., revealing incompleteness of accuracy as the sole epistemic good). Draft dissertation chapters synthesising the formal results and philosophical analysis.

  **4. Success and Failure (Approx. 200 words)**

  A successful outcome for this project would be a clear, evidence-based map of the landscape concerning SPSR sensitivity beyond probabilism. This includes: 1) A detailed taxonomy categorising *how* the choice of SPSR impacts the derivation of each examined norm (e.g., alters the norm derived, changes the strength of the requirement, makes the derivation possible only under specific rules); 2) Identification of the key formal properties of SPSRs responsible for generating sensitivity in different contexts; and 3) A philosophically informed, well-argued verdict on the significance of this sensitivity. A successful verdict might conclude that sensitivity is largely benign (perhaps reflecting legitimate trade-offs within accuracy), or that it highlights limitations requiring supplementation of the accuracy-first value theory, or that it critically undermines the universality claims of AFE for certain norms. Crucially, success entails providing a substantive answer to the core question of *why* sensitivity emerges beyond probabilism.

  The project would be deemed a failure if it yielded only inconclusive or trivial results. This could occur if the sensitivity observed across different SPSRs proved minimal or easily reconcilable for the norms studied, failing to generate significant philosophical tension. Failure could also stem from an inability to isolate the formal drivers of dependence clearly, or if the analysis became mired in technical complexities without yielding broader philosophical insights. Ultimately, failing to provide a coherent assessment of the implications of any discovered sensitivity for the accuracy-first programme would constitute an unsatisfactory outcome.

  **5. Scope and Risks (Approx. 150 words)**

  The primary risk is scope creep. The project could expand infinitely by examining more norms (e.g., Reflection, Coherence over time) or delving into the vast space of possible SPSRs. Similarly, intricate formal details within each case study could consume excessive time. To mitigate this, the project is tightly scoped to three paradigmatic norms. SPSR selection is deliberately limited to a small set of well-established, theoretically distinct rules (Brier, Logarithmic, Spherical). The case-study approach inherently prioritises depth on specific examples over exhaustive coverage. Time management will be enforced through the monthly plan, with each case study strictly time-boxed. If initial results suggest overwhelming complexity for one norm (e.g., indifference), its analysis will be streamlined to focus on the most salient aspects. The core priority remains the comparative analysis and philosophical evaluation, not exhaustive formal derivation for every conceivable rule-norm combination. Focusing on clearly articulating the *types* of sensitivity and their implications provides a natural boundary.
