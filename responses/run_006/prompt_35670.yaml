answer: |-
  ## The Philosopher's Pint: Knowing-How vs. Knowing-That

  **Setting:** A slightly noisy pub near the conference hotel. Clinking glasses, low chatter. LEO (Intellectualist, sharp suit slightly rumpled, nursing a stout) sits at a small table. MORGAN (Neo-Rylean, comfortable sweater, finishing a cider) approaches.

  **Morgan:** (Sitting down) Leo! Fancy seeing you here. Thought you'd be off celebrating after that panel. Stanley & Williamson seem to be holding the fort for intellectualism these days.

  **Leo:** Morgan! Join me. Celebrating? Hardly. More like contemplating the sheer *resistance* to obvious truths. S&W offered a clean reduction, but some minds seem welded to Rylean intuitions. Can I get you another?

  **Morgan:** I'm good, thanks. "Resistance" is a strong word. More like... pointing out the emperor's lack of practical attire. That "clean reduction" smuggles in the very thing it tries to eliminate. Let's start with the regress – Ryle's big gun. If knowing-how *is* knowing-that, then applying that knowledge-that requires *another* bit of knowing-how, ad infinitum. You can't get action started with just propositions. How does S&W dodge that bullet?

  **Leo:** (Leans forward) They don't *dodge* it, Morgan; they *disarm* it. The regress only bites if you think applying knowledge-that requires a distinct *intellectual* act, another contemplation of a proposition. But it doesn't. It requires the proposition to be grasped under a **practical mode of presentation**. When I know *that w is a way to ride a bike* under a *practical* MoP, that knowledge *just is* the ability to ride. Applying it isn't a further intellectual step; it's the manifestation of that specific, practically oriented knowledge state. The regress premise is false.

  **Morgan:** (Scoffs slightly) Ah, the mystical "Practical Mode of Presentation." The escape hatch. But isn't that just "knowing-how" wearing a propositional trench coat and fake mustache? You say "grasped under a practical mode." What *is* that mode, Leo? If it's *not* itself a bit of know-how – the know-how to *deploy* that proposition practically – then what *is* it? Some ghostly cognitive qualifier? Define it *without* invoking ability or disposition. Go on.

  **Leo:** It's a specific cognitive relation to the propositional content. It's the way the information is encoded and poised for action in the cognitive architecture. Think of it like the difference between knowing *that* "Ctrl+S" saves a file *descriptively* (like a fact in a manual) versus knowing it *practically* – where the knowledge is integrated with your motor schemas, ready to trigger finger movements without deliberation. The *content* is the same: "Pressing Ctrl+S saves the file." The *mode* determines its functional role.

  **Morgan:** So, "integrated with motor schemas, ready to trigger." That sounds suspiciously like... a complex disposition to behave successfully in certain situations! Exactly what Ryle said knowing-how *is*. You haven't reduced know-how to knowledge-that; you've appended a big, undefined "dispositional/practical glue" *to* knowledge-that and called *that* the knowing-how. The reduction is circular. Your "practical MoP" *is* the know-how you're trying to reduce away.

  **Leo:** Not circular! The disposition is *explained by* the specific propositional knowledge under that mode. The MoP *causes* the disposition. It’s the cognitive state underlying the ability.

  **Morgan:** But now you face gradability! I know *how* to play chess better than my nephew. I don't merely know *more* propositions *about* chess; my *skill* is superior. I execute plans, recognize patterns, react fluidly. Can you really say I just know *that* certain complex propositions are true *better* than he does? Do you know *that* Paris is the capital of France *better* than a tourist who just memorized it? Degrees of justification or understanding, maybe, but not the same robust, performance-based gradation we see in skills. Knowing-how admits of *mastery* in a way knowing-that simply doesn't.

  **Leo:** Of course it does! Knowing-that *can* be gradable in relevant ways. A novice physicist knows *that* F=ma, but her understanding is shallow. The expert knows it *deeply*, integrated with a vast network of propositions and models, allowing for flexible application and problem-solving – *practical* application! Your chess example: the grandmaster knows vastly *more* propositions under practical MoPs – intricate tactical patterns, strategic principles, typical endgame structures – and knows them with greater integration and automaticity. The gradation *is* in the scope, depth, and accessibility of the relevant propositional knowledge under practical modes.

  **Morgan:** But the tourist and I both know *that* Paris is the capital *perfectly well* for the purpose of answering the trivia question. The gradation there is trivial or non-existent. The gradation in chess skill is profound and directly tied to *performance success*. Reducing that performance difference solely to *more* or *better-grasped* propositions under "practical modes" feels like trying to describe a symphony by listing the notes faster. You miss the *embodied timing*, the *anticipation*, the *feel*. That’s not propositional. It’s the skill itself manifesting.

  **Leo:** And I say that "feel," that timing, *is* the manifestation of complex, sub-personal propositional knowledge processed under practical modes by cognitive systems specialized for action. The symphony *is* the notes, played correctly in sequence with the right dynamics – information executed.

  **Morgan:** But the *playing* isn't *about* the notes; it *is* the action. The knowledge is *in* the doing. Back to your MoP: if it's not know-how, and it's not a standard descriptive mode, what *is* its metaphysical status? Is it a primitive property of some mental representations? A functional role? If it's a functional role, isn't that role *defined* by its connection to successful action – back to dispositions and abilities?

  **Leo:** It’s a fundamental type of intentional state, irreducible to descriptive modes or raw dispositions. It’s how cognition hooks directly onto action. Cognitive science points to procedural knowledge implemented in specific neural substrates – distinct from declarative memory, but still representational and contentful.

  **Morgan:** But "procedural knowledge" in cognitive science *is* Rylean know-how! It's non-declarative, often non-conscious, embodied. Calling it "knowledge-that under a practical MoP" is just intellectualist rebranding. It doesn't capture the *non-propositional essence* of skill.

  **Leo:** *(Sighs, takes a sip)* Okay, Morgan. Let’s bottom this out. The core disagreement, I think, is **what constitutes the fundamental ground of intelligent action.**

  *   **For me (Intellectualist):** All intelligent action, *at its cognitive root*, is governed by truth-bearing representational states (propositions). The "practicality" comes from the *format* or *mode* of accessing and utilizing those representations – a format optimized for action-guidance, not contemplation. Cognition is fundamentally representational and propositional. Settling it requires showing how specific action-oriented neural states implement structured, truth-apt content.
  *   **For you (Neo-Rylean):** Intelligent action is fundamentally constituted by embodied capacities, dispositions, and skills. These are *sui generis* – not reducible to, or grounded solely in, static propositional attitudes, regardless of their 'mode'. Propositions *describe* know-how, but don't *constitute* it. Cognition is fundamentally embodied and enactive. Settling it requires showing that skillful action can arise from, and be explained by, non-representational dynamical systems or dispositions without needing propositional intermediaries.

  **Morgan:** *(Nods slowly)* That’s fair. You think the practical mode is the bridge *from* proposition *to* world. I think the 'bridge' metaphor is wrong; the skill *is* the interaction with the world. Propositions map it from the outside.

  **Leo:** Precisely. So, what would settle it? Not just armchair philosophy. **Cognitive neuroscience.** Finding clear neural correlates: if we identify specific, discrete, content-carrying states (akin to propositional representations) that are reliably activated *in the specific format* required for a practical MoP *and* are necessary/sufficient for initiating and guiding skilled performance, that points to intellectualism. If skill is always implemented by distributed, dynamic, non-discrete patterns where no stable propositional content can be isolated as the 'guiding representation,' and where the ability resides purely in the network's dispositional properties, that points to Ryle.

  **Morgan:** And perhaps **AI/robotics.** Can you build a truly skilled agent *only* by loading it with explicit propositions under 'practical flags'? Or does genuine adaptive skill require building in non-propositional, embodied dynamics from the start? If the latter succeeds without propositional crutches... well, that speaks volumes.

  **Leo:** *(Raises glass slightly)* To empirical adjudication, then? Though I suspect we'll interpret the data through our respective lenses.

  **Morgan:** *(Clinks Leo's glass with her cider mug)* To the ongoing brawl! May the most embodied – or representational – theory win. Cheers, Leo.

  **Leo:** Cheers, Morgan. Same time tomorrow? I hear the panel on sensorimotor contingencies could get bloody.

  **Morgan:** Wouldn't miss it. See you there. *(Both take a drink, the unresolved tension lingering, but the battlefield clearly mapped.)*

  **Key Issues Covered & Bottoming Out:**

  1.  **Regress Argument:** Intellectualist response = Practical Mode of Presentation blocks the need for infinite *intellectual* acts. Neo-Rylean charge = Practical MoP just *is* know-how in disguise, making the reduction circular.
  2.  **Gradability Problem:** Neo-Rylean = Skills admit of performance-based mastery gradation unlike trivial gradations in knowing-that. Intellectualist = Gradation exists in the scope, depth, integration, and automaticity of propositional knowledge under practical modes.
  3.  **Practical Mode of Presentation:** The central battleground. Neo-Rylean: Either circular (just know-how renamed) or an undefined ghost. Intellectualist: A fundamental, irreducible type of intentional state/cognitive format linking propositions to action.
  4.  **Core Disagreement:** The **fundamental ground of intelligent action**. Is it truth-bearing propositional attitudes accessed practically (Intellectualism), or irreducible embodied capacities/dispositions (Neo-Ryleanism)?
  5.  **What Would Settle It?** **Cognitive neuroscience** (finding discrete, content-specific "practical MoP" representations vs. non-representational dispositional dynamics guiding action) and **AI/Robotics** (building skilled agents solely with propositions under practical flags vs. needing non-propositional embodied dynamics).
