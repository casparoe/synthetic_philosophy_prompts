prompt: |-
  I work in quality control at a small type foundry, and my team reviews submitted glyphs in which a designer intends a form as the letter 'a' — or 'g', 'e', or another letter — but reviewers disagree about whether it is still that letter at all, as opposed to a decoration, a different letter, or a private mark. I've been thinking on my own about what makes every 'a' an 'a' across wildly different styles. The idea I keep returning to is that a letterform's identity lives in the roles its parts play — an enclosed counter, a stem, a terminal — rather than in any particular shape, and that a style is a systematic way of varying those parts while preserving their roles. Please write a reusable decision procedure my reviewers could actually run on a disputed glyph, with roughly ten minutes per case and no background in the theory: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a decision that the form is not the intended letter, and where it hands the case to a person because the matter is one of judgment rather than fact. The procedure should distinguish a stylistic variant from a change of category. Then run it on three invented cases: one clearly the intended letter, one clearly not, and one where the procedure returns an answer the submitting designer will not like. Finally, say where your reasoning is most likely to fail and which consideration would lead you to revise the procedure.
reasoning: |-
  We are creating a decision procedure for reviewers to determine if a disputed glyph is a stylistic variant of the intended letter or a different category (e.g., a different letter, a decoration, etc.). The procedure is based on the idea that a letter's identity lies in the roles of its parts (like an enclosed counter, a stem, a terminal) and that a style systematically varies these parts while preserving their roles.

  The procedure will consist of a series of questions. We must design it to be run in about 10 minutes per case and without requiring background in typographic theory.

  **Decision Procedure: "Letter Identity Test"**

  **Step 1: Identify the intended letter and its key structural features.**
     - Ask: "What letter is the designer intending this glyph to be? (e.g., 'a')"
     - Then, for that intended letter, recall the minimal set of structural features that are essential for that letter in the most basic form (e.g., for 'a': an enclosed counter, a bowl, and a stem or a terminal that distinguishes it from 'o').

  **Step 2: Map the disputed glyph to the structural features of the intended letter.**
     - Ask: "Can you identify in the disputed glyph the parts that correspond to the essential structural features of the intended letter? (List the essential features for the intended letter, e.g., for 'a': an enclosed counter, a bowl, a stem.)"
     - For each essential feature, the reviewer must answer 'yes' or 'no' with a brief reason.
     - If any essential feature is missing, proceed to Step 3. Otherwise, proceed to Step 4.

  **Step 3: Check for alternative interpretations.**
     - If one or more essential features are missing, ask: "Is the missing feature compensated by an alternative feature that still allows the glyph to be unambiguously read as the intended letter in the context of the typeface style? (e.g., a double-story 'a' might become a single-story, but still has a clear enclosed counter and a stem that distinguishes it from 'o')"
     - Also ask: "Does the glyph strongly resemble a different letter or symbol? (e.g., an 'a' that looks like an 'o' with a tail might be acceptable, but if the tail is missing then it becomes an 'o')"
     - If the reviewer can identify that the glyph now more closely matches a different letter or symbol (or if it doesn't match any letter), then the decision is: **Not the intended letter**.
     - If the reviewer is unsure, proceed to Step 5.

  **Step 4: Check for systematic variation.**
     - Ask: "Are the variations in the glyph's parts consistent with the style of the rest of the typeface? (e.g., if the typeface has consistent bowl shapes, terminals, etc., then the glyph should follow that same style.)"
     - If yes, then the glyph is a stylistic variant of the intended letter -> **Accept as the intended letter**.
     - If not, then the glyph might be an outlier. Proceed to Step 5.

  **Step 5: Human judgment required.**
     - If after the above steps the reviewer cannot decide, then the case requires human judgment. The reviewer should note the points of uncertainty and escalate to a senior reviewer or a team discussion.

  **Summary of decision points:**
     - If all essential features are present and the variation is consistent with the typeface style -> **Accept**.
     - If essential features are missing and not compensated in a way that maintains the letter identity, or if the glyph clearly matches a different letter/symbol -> **Reject (Not the intended letter)**.
     - Otherwise -> **Escalate for human judgment**.

  ---

  **Now, let's run the procedure on three invented cases.**

  **Case 1: Clearly the intended letter (for 'a')**
     - Glyph: A double-story 'a' in a typeface that mostly has single-story 'a's. However, the glyph has an enclosed counter, a bowl, and a stem that connects in a way that is consistent with the typeface's style (e.g., the terminals and stem thickness match).
     - Step 1: Intended letter is 'a'. Essential features: enclosed counter, bowl, stem (to distinguish from 'o').
     - Step 2: All features are present (enclosed counter: yes, bowl: yes, stem: yes). Proceed to Step 4.
     - Step 4: The variation (double-story vs. single-story) is acceptable if the rest of the typeface allows for such variation? Let's assume the typeface is known to mix single and double story glyphs (like some humanist sans-serifs). If yes, then **Accept**. If the typeface is strictly single-story, then it might be inconsistent. But in our case, we are saying the designer intended a double-story in a mostly single-story face? We must check consistency. However, note that having a double-story 'a' in a single-story style is a known variation (like in italic). So we might still accept if it is within the style's range. Alternatively, if the typeface does not have any double-story glyphs, then it might be inconsistent. But for the sake of this example, let's say the typeface has a few double-story letters (like 'g') so it's acceptable. **Result: Accept**.

  **Case 2: Clearly not the intended letter (intended as 'g', but looks like 'y')**
     - Glyph: The designer intended a 'g', but the glyph has two separate bowls (like a double-story 'g') but the tail is so long and curved that it resembles a 'y'. Also, the lower bowl is open at the bottom.
     - Step 1: Intended letter is 'g'. Essential features: two enclosed counters (or one enclosed and one open), a link between the two, and a tail or loop.
     - Step 2: We have two counters? Let's say one is enclosed and the other is open (because the bottom is open). But the tail is so long and curved that it doesn't look like a typical 'g' tail. The link might be present. However, the overall shape now looks like a 'y'. 
     - Step 3: The missing feature? The tail of a 'g' should typically loop or have a distinct shape that is not like a 'y'. Here, the tail is straight and long? Let's say it has a curve that goes down and left, like a 'y'. So we ask: does it strongly resemble a different letter? Yes, it looks like 'y'. Therefore, **Reject (Not the intended letter)**.

  **Case 3: The submitting designer will not like the answer (intended as 'e', but the crossbar is missing)**
     - Glyph: The intended letter is 'e', but the horizontal crossbar is missing. Instead, the glyph has a bowl and a curved stroke that ends without a crossbar, so it looks like a 'c' with a more closed aperture.
     - Step 1: Intended letter is 'e'. Essential features: a bowl, a crossbar (or a terminal that closes the aperture to distinguish from 'c').
     - Step 2: The bowl is present, but the crossbar is missing. Without the crossbar, the aperture is more open than a typical 'e' but not as open as a 'c'. 
     - Step 3: Is the crossbar missing? Yes. Is there an alternative? The designer might argue that the curve of the bowl is such that it creates a visual effect of a crossbar, or that the aperture is closed enough to be an 'e'. However, without the crossbar, it is ambiguous. We then ask: does it look more like a 'c'? If the aperture is too open, then it is a 'c'. If it's almost closed, it might still be an 'e'. But the absence of the crossbar is a critical feature. 
     - Let's assume the reviewer decides that without the crossbar, the glyph is too close to 'c'. Therefore, **Reject (Not the intended letter)**. The designer will not like this because they intended an 'e' and may feel the style allows for a crossbar-less 'e'. However, the procedure leads to rejection because the essential feature (crossbar) is missing and the glyph becomes ambiguous.

  ---

  **Where the reasoning is most likely to fail:**
     - The procedure relies on the reviewer's ability to identify the essential structural features of a letter. This might be subjective for some letters (e.g., how much can you vary the 'g' and still have it be a 'g'?).
     - The procedure also requires an understanding of the consistency of the typeface style. If the reviewer is not familiar with the entire typeface, they might not accurately judge consistency in Step 4.
     - Some letters have multiple forms (like single-story vs. double-story 'a') that are both acceptable. The procedure might reject a valid stylistic variant if the reviewer does not recognize that variation as acceptable in the context of the typeface.

  **Consideration for revision:**
     - We might revise the procedure by providing a reference guide of essential features for each letter (e.g., a cheat sheet) to reduce subjectivity in Step 1 and Step 2.
     - Also, we might require that the reviewer compares the glyph to other letters in the same typeface to check consistency (e.g., by looking at the 'o', 'c', 'e' together to see if the 'e' is distinct enough). This would require more time but might be necessary for ambiguous cases.
     - Another revision could be to include a step that checks for legibility in context: "If this glyph were placed in a word, would it be read as the intended letter by a typical reader?" This, however, is more subjective and might require human judgment.

  Given the constraints, the current procedure is a good starting point. The most critical improvement would be to have a predefined list of essential features for each letter to standardize Step 1 and Step 2.
answer: |-
  ### Decision Procedure: Letter Identity Test

  **Instructions:**  
  Answer each question in order. Stop early if a decision is reached. Use a timer to stay within 10 minutes. No typography theory needed—rely on visual inspection and common sense.

  ---

  #### **Step 1: Identify Core Structure**  
  **Question:** *"Does the glyph have all critical parts of the intended letter? (e.g., an 'a' needs an enclosed counter and a stem; a 'g' needs an ear or tail; an 'e' needs a crossbar.)"*  
  - **Sufficient answer:** List observed parts (e.g., "bowl," "counter," "crossbar").  
  - **Decision:**  
    - ✅ **Proceed to Step 2** if all critical parts are present.  
    - ❌ **Reject as not the letter** if ≥1 critical part is missing (e.g., an "e" without a crossbar).  
    - ⚠️ **Escalate to human** if parts are ambiguous (e.g., "Is this squiggle a crossbar or decoration?").  

  #### **Step 2: Check Functional Roles**  
  **Question:** *"Do the parts play the same roles as in a basic version of the letter? (e.g., a counter must be enclosed; a stem must anchor the structure; a terminal must end a stroke.)"*  
  - **Sufficient answer:** Note role consistency (e.g., "The bowl encloses a counter," "The stem supports the arch").  
  - **Decision:**  
    - ✅ **Proceed to Step 3** if roles match.  
    - ❌ **Reject as not the letter** if roles change (e.g., an "a" where the counter is open like an "u").  
    - ⚠️ **Escalate to human** if roles are unclear (e.g., "Is this loop functional or decorative?").  

  #### **Step 3: Verify Systematic Stylization**  
  **Question:** *"Is the variation consistent with the typeface’s style? (e.g., if all terminals are angled, this glyph’s should be too.)"*  
  - **Sufficient answer:** Compare to 2–3 nearby glyphs (e.g., check "n" or "o" for terminal angles).  
  - **Decision:**  
    - ✅ **Accept as stylistic variant** if consistent (e.g., all glyphs have exaggerated serifs).  
    - ❌ **Reject as not the letter** if inconsistent (e.g., this "g" has a loop tail while others are straight).  
    - ⚠️ **Escalate to human** if style is inconsistent but roles are intact (e.g., a one-off flourish).  

  ---

  ### Test Cases  
  #### **Case 1: Clearly the Intended Letter (Intended: "a")**  
  - **Glyph:** A high-contrast "a" with a teardrop-shaped counter and a curved stem.  
  - **Procedure:**  
    1. **Step 1:** Critical parts present? ✅ (Enclosed counter, stem, bowl).  
    2. **Step 2:** Roles intact? ✅ (Counter enclosed, stem anchors bowl).  
    3. **Step 3:** Consistent style? ✅ (Matches typeface’s teardrop counters).  
  - **Outcome:** ✅ **Accept**—stylistic variant of "a".  

  #### **Case 2: Clearly Not the Letter (Intended: "g")**  
  - **Glyph:** A shape resembling an "8" with a detached flourish below.  
  - **Procedure:**  
    1. **Step 1:** Critical parts present? ❌ (Missing "g"’s ear/tail; has two counters like an "8").  
  - **Outcome:** ❌ **Reject**—fails Step 1 (no structural resemblance to "g").  

  #### **Case 3: Designer Will Dislike (Intended: "e")**  
  - **Glyph:** A "c"-like shape with a tiny hook at the top (crossbar implied but not connected).  
  - **Procedure:**  
    1. **Step 1:** Critical parts present? ⚠️ (No visible crossbar; hook ambiguous).  
    2. **Step 2:** Roles intact? ❌ (Hook doesn’t act as a crossbar; aperture too open, resembling "c").  
  - **Outcome:** ❌ **Reject**—fails Step 2 (critical role of crossbar missing).  
  - **Why designer dislikes:** They may argue the hook "implies" a crossbar, but the procedure requires functional role preservation.  

  ---

  ### Limitations and Revisions  
  #### **Where Reasoning Fails:**  
  - **Ambiguous roles:** The procedure assumes parts have clear functions (e.g., "counter"). It may fail for highly abstract or experimental glyphs where roles are debatable (e.g., is a dot a "terminal" or decoration?).  
  - **Cultural bias:** Letters like "g" or "a" vary significantly across scripts (e.g., single vs. double-story). The test may reject valid regional variants.  
  - **Style vs. error:** Fails to distinguish intentional stylistic breaks from designer errors (e.g., an inconsistent tail might be innovation, not a mistake).  

  #### **Revision Trigger:**  
  - **If reviewers escalate >20% of cases** for "ambiguous roles" (Step 1/2), add visual reference sheets showing minimal functional parts for each letter. This reduces subjectivity.  

  **Final Note:** This procedure prioritizes functional integrity over aesthetics. It catches errors (e.g., a decorative "e" becoming a "c") but may reject avant-garde designs—escalating those cases ensures nuance isn’t lost.
