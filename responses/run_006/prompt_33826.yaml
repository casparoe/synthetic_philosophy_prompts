answer: |-
  Here’s a targeted Q&A prep sheet tailored to your audience and paper’s arguments. I’ve prioritized objections by **likelihood** (based on audience composition) and **damage potential** (how much they threaten your core claims). The "pray nobody asks" question is at the end.

  ---

  ### **Q&A Prep Sheet: Top 7 Likely Objections**  
  *(Ordered by Likelihood + Damage)*  

  1. **Objection: "Your adverbialism is just a notational variant of the temporal parts view. When you say ‘S is bent-at-t1 and straight-at-t2’, you’re implicitly quantifying over temporal parts (e.g., t1-part and t2-part). Aren’t you smuggling in perdurantism?"**  
     *Likely asker:* The stage-theory perdurantist.  
     *Why likely/damaging:* Directly challenges your solution’s originality and coherence. If true, your "endurantism" collapses into perdurantism.  
     **Reply (2-min):** "Not at all. Adverbialism denies temporal parts *ontologically*: there’s only one entity, S, wholly present at t1 and t2. The adverbial modifier (e.g., ‘bent-ly at t1’) describes how S instantiates a property *simpliciter* at a time, without reifying moments or parts. Perdurantism, by contrast, fragments S into distinct temporal segments. The difference is ontological parsimony: I have one object with time-indexed modes of instantiation; perdurantism has many parts."  
     **Weakness:** If the audience insists that "instantiation-at-t" *must* imply a relational property or hidden part, your "wholly present" claim may seem unstable.  

  2. **Objection: "Special relativity undermines endurance by denying absolute simultaneity. If objects are ‘wholly present’ at a time, but relativity says there’s no privileged frame for ‘now’, isn’t endurance incompatible with modern physics?"**  
     *Likely asker:* Philosopher of physics.  
     *Why likely/damaging:* Targets your rejection of presentism; could paint endurantism as scientifically obsolete.  
     **Reply (2-min):** "Relativity doesn’t force perdurantism. Endurantists can adopt a ‘spacetime region’ view: S is wholly present at *each* spacelike hypersurface within its world-tube. Alternatively, we can accept a foliation-relative notion of ‘wholly present’ without endorsing absolute time. Perdurantism doesn’t *solve* relativity—it just relocates the problem to the geometry of temporal parts."  
     **Weakness:** This requires buying into contested interpretations of relativity (e.g., Lorentzian invariance). May feel like special pleading to physicists.  

  3. **Objection: "Adverbialism was refuted centuries ago! Ockham showed that ‘S is F-at-t’ reduces to ‘S-at-t is F’, which is just temporal parts. Why isn’t this a medieval dead end?"**  
     *Likely asker:* Historian of philosophy.  
     *Why likely/damaging:* Undercuts your "something deep about instantiation" claim by framing adverbialism as a regressive, failed theory.  
     **Reply (2-min):** "Ockham’s reduction assumes temporal parts *by fiat*. I deny that ‘S-at-t’ refers to an entity; it’s a *designator* for S under a temporal description. My adverbialism treats time-indexing as a primitive feature of property instantiation, not a paraphrase for parts. This avoids Ockham’s reduction by rejecting his mereological starting point."  
     **Weakness:** Historians may counter that this "primitive instantiation" is less elegant than Ockham’s solution.  

  4. **Objection: "Your epistemic/metaphysical distinction is a red herring. Perdurantism’s ‘intuitiveness’ comes from its ability to model change *without contradiction*, e.g., by having contradictory properties at different parts. How does adverbialism handle this better?"**  
     *Likely asker:* Perdurantist metaphysician.  
     *Why likely/damaging:* Attacks your core claim that perdurantism’s motivations "collapse" once epistemology is separated.  
     **Reply (2-min):** "Contradiction is avoided trivially if properties are instantiated *at times*. Perdurantism ‘solves’ change by *eliminating* it—what changes isn’t the object but its parts. But genuine change requires *one* object having different properties. Adverbialism delivers this: S itself is bent at t1 and straight at t2, without temporal parts. The ‘intuition’ perdurantism exploits is about *tracking* objects (epistemic), not their ontology."  
     **Weakness:** If perdurantists argue that "S itself" having incompatible properties *is* contradictory (without parts), your solution may seem question-begging.  

  5. **Objection: "If there are no temporal parts, what grounds the numerical identity of S over time? Adverbialism only addresses properties, not persistence itself."**  
     *Likely asker:* Generalist or metaphysician.  
     *Why likely/damaging:* Exposes a gap in your account; adverbialism solves properties but not diachronic identity.  
     **Reply (2-min):** "Persistence *is* the identity of S across time—no further ‘grounding’ is needed. Adverbialism ensures S survives change by showing how it can have temporary intrinsics *without* parts. Demanding ‘grounding’ beyond this assumes perdurantism’s ontology (e.g., genidentity relations). On endurance, S’s identity is primitive."  
     **Weakness:** May sound like a dodge. Critics will press: "Why is S at t1 identical to S at t2 if it has different properties?"  

  6. **Objection: "Doesn’t adverbialism collapse intrinsic properties into relational ones (e.g., ‘bent-at-t’)? If so, it abandons the very notion of temporary *intrinsics* you set out to save."**  
     *Likely asker:* Metaphysician focused on properties.  
     *Why likely/damaging:* If properties become relations to times, your solution contradicts endurantism’s motivation (preserving intrinsics).  
     **Reply (2-min):** "The property itself (e.g., bentness) remains intrinsic; the adverbial modifier captures *when* it’s instantiated. ‘S is bent-at-t’ means S instantiates bentness *in a t-ly manner*—not that bentness is relational. Think of it as analogous to ‘S is bent here’: location doesn’t make bentness extrinsic."  
     **Weakness:** If "instantiation-at-t" is seen as a *relational event*, intrinsics are jeopardized.  

  7. **Objection: "Perdurantism explains why change seems to involve ‘stages’ (e.g., a caterpillar stage vs. butterfly stage). If endurance rejects parts, how do you account for this phenomenology?"**  
     *Likely asker:* Generalist or perdurantist.  
     *Why likely/damaging:* Tests your claim that perdurantism’s "intuitiveness" is epistemically misattributed.  
     **Reply (2-min):** "We naturally *conceptualize* objects in stages for reidentification, but this doesn’t reflect ontology. We also speak of ‘child-you’ and ‘adult-you’ without implying temporal parts—this is a *description* of S under a phase, not a part. Endurance accommodates this via time-indexed properties without reifying stages."  
     **Weakness:** May not convince those who see "phase talk" as ontologically loaded.  

  ---

  ### **The "Pray Nobody Asks" Question**  
  **Question:** "You argue that persistence consists in strict identity over time, not temporal parts. But if S is wholly present at each time, and t1 and t2 are distinct, what accounts for the *unity* of S across these times? Without temporal parts or relations, isn’t S-at-t1 just *brutely* identical to S-at-t2? And if so, how is this any less mysterious than perdurantism?"  

  *Why it’s devastating:*  
  - Exposes the deepest tension: Your rejection of temporal parts leaves diachronic identity as an unanalyzed primitive, while your adverbial strategy (focused on properties) doesn’t directly address *what makes S the same object* at different times.  
  - Forces you to either (a) embrace brute identity (seen as unsatisfying), or (b) smuggle in relations (risking perdurantism).  

  **How to Handle It (If Asked):**  
  1. **Concede the primitive:** "Yes, diachronic identity is primitive on this view—but so is synchronic unity (e.g., what makes S’s properties at t1 belong to *one* object?). Perdurantism just *relocates* the mystery to the unity of temporal parts."  
  2. **Reframe the burden:** "Perdurantists owe an account of trans-temporal composition (e.g., why do these parts form a ‘worm’?). I avoid that problem entirely by not having parts."  
  3. **Redirect to epistemology:** "The ‘unity’ you’re asking about is grounded in our reidentification practices, not metaphysics. My paper shows why we shouldn’t project this into the ontology."  
  *Weakness:* This may sound evasive. The best defense is to stress that *all* theories have primitives—yours is no worse off.  

  ---

  **Final Tip:** Preempt the relativity objection by briefly addressing it in your talk. For the "notational variant" charge, prepare a slide contrasting adverbialism’s ontology (one object, time-indexed properties) vs. perdurantism’s (many parts). Good luck!
