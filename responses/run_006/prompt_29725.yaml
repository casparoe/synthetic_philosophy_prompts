prompt: |-
  My roommate won't stop ending arguments about space colonization with "don't put all your eggs in one basket." Last week I said it's weird to spend hundreds of billions putting a colony on Mars while people are dying of preventable diseases here, and he just goes "one asteroid and it's all over, don't put all your eggs in one basket" and acts like the debate is finished. I get that the proverb says something obviously true in some sense, but I cant pin down what claim about Mars it's actually supposed to be making. Lay out the different precise things that line could be claiming—from the trivial to the substantive to the probably false—and say which of those readings would actually do the work of justifying a Mars colony, and which are just vibes. I want to go back and actually address the version he needs.
