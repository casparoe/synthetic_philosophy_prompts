prompt: |-
  ok so in my philosophy club we read this thing about eliminative materialism — the idea that beliefs and desires are like phlogiston, theyre part of a folk theory thats gonna get replaced by neuroscience, and eventually we wont say "i believe its raining" any more than we say "theres phlogiston in the wood." half of us thought this was insane and half thought it was hard to refute. can you write a dialogue between an eliminative materialist and someone who defends the reality of beliefs and desires, where they try to figure out whether their disagreement is actually empirical (a bet about what neuroscience will discover) or whether its just a verbal dispute about what counts as a "belief"? i want both of them to be really sharp and not strawmen, and i want them to actually respond to each others points instead of giving speeches. set it wherever. and dont resolve it — leave it where both have had to concede something.
