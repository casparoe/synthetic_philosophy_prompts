prompt: |-
  I'm a PhD student in formal epistemology, and I've come to hold that the common prior assumption is a substantive constraint on rational belief rather than a modeling convention: differences in rational agents' beliefs must be traceable to differences in information against a shared prior, and agreement theorems and no-trade theorems are what give this view its normative force. I want to know what would count against it. Which formal results, models of rational disagreement without a common prior, or foundational arguments about what a prior is should move me, sorted from decisive to merely awkward? Which of these would a defender of the view concede as genuine defeaters, and which would they re-describe as differences in information, awareness, or modeling choices? Is the position in danger of being insulated into unfalsifiability, and if so, is that a problem for a claim of this kind? Be specific about what the formalism — or the world — would have to look like for each escape route to be live rather than merely logically possible.
reasoning: |-
  Okay, let me unpack this user's query. They're a PhD student in formal epistemology focused on the common prior assumption (CPA). They see CPA as a substantive constraint on rational belief, not just a modeling tool. Their stance is that differences in rational beliefs must come from differences in information, backed by agreement and no-trade theorems. They want to know what could challenge this view, from decisive counterarguments to awkward issues, and how defenders might respond. They're also concerned about unfalsifiability.

  First, I need to recall key critiques of CPA. The user mentioned formal results, models without CPA, and foundational arguments. I should categorize these by how damaging they are. Decisive counterexamples would involve rational disagreement without prior differences—maybe models with ambiguous evidence or incommensurable priors. Then there are results showing CPA violations in learning scenarios or computational issues. Foundational issues like what a prior even is could be awkward but not fatal.

  The user is worried about defenders reinterpreting challenges as differences in information or awareness. For example, if two agents disagree rationally without prior differences, a CPA defender might say they actually have different information sets. But if the model explicitly rules that out, that defense might not hold. Cases with ambiguous evidence, like the Judy Benjamin problem, show that Bayesians can't always agree on a common prior. That seems strong.

  No-trade theorems assume common priors, so if trade happens rationally without prior differences, that's a problem. But maybe risk aversion explains trades, not belief differences. The user needs cases where trade is rational solely due to belief differences. Models like Hanson's futarchy or prediction markets might help here, but I'm not sure they're decisive.

  Computational constraints are another angle. If agents can't compute the common prior due to complexity, does that challenge CPA? Defenders might say rationality is ideal, not bounded. But the user might find that unsatisfying if real agents can't meet the ideal.

  Foundational issues: are priors even unique? If priors are representations of reasoning systems, not actual beliefs, two agents might have different systems that can't be compared. That could make CPA incoherent. But defenders might argue that learning from evidence will align them eventually. Models with non-commutative updates or non-Bayesian updating could challenge that.

  The user is also concerned about unfalsifiability. If every challenge is explained away as information differences, CPA becomes untestable. That's a problem if they want it to be a substantive claim. They need cases where no hidden information differences exist, but disagreement is still rational. Dynamically consistent models or learning scenarios where agents don't converge might work. If agents with common priors and same evidence still disagree over time, that's a counterexample. But do such models exist?

  I should also consider Aumann's theorem itself. It assumes partitions and common knowledge of posteriors. If those assumptions are violated, agreement might not happen. But the user might accept that as part of the model. More critical is when the theorem's conditions are met, but disagreement persists rationally. That would be decisive, but is it possible? Maybe with non-partitional models or ambiguous knowledge.

  Finally, the user's deeper need might be to defend their position against critiques or to understand its limitations. They might want to know if CPA is tenable as a normative requirement. So, presenting the strongest counterarguments and evaluating how a defender might respond is key. Highlighting where CPA holds and where it's challenged helps them situate their work. Also, addressing unfalsifiability by showing testable implications could strengthen their argument or reveal weaknesses.
answer: |-
  Your position—that the Common Prior Assumption (CPA) is a *substantive constraint* on rational belief, not merely a convention—is philosophically robust but faces significant challenges. Below, I categorize counterarguments and models from **decisive** to **awkward**, specifying what defenders might concede versus reinterpret, and address the unfalsifiability concern. The key is identifying scenarios where rational disagreement *cannot* be "explained away" as differences in information, awareness, or modeling choices without stretching these concepts beyond recognition.

  ---

  ### **I. Decisive Counterexamples: Violations of CPA as Necessary for Rationality**
  These show rational agents *must* violate CPA to be rational, given the structure of their epistemic situation.

  1. **Rational Disagreement Under Ambiguous Evidence (e.g., *Judy Benjamin Problem* & Non-Conglomerability)**  
     - **Formalism**: Van Fraassen's Judy Benjamin problem (a Bayesian agent updates on conditional information like "If in Red territory, odds 3:1 you’re in HQ area"). No common prior can generate posteriors that satisfy both the evidence and Bayesian coherence.  
     - **Why Decisive?**: Rational agents with identical evidence and common priors *cannot* reach the required posterior. Different priors are *necessary* for coherence.  
     - **Defender Response**: Often re-described as "evidence not being properly modeled" or requiring non-partitional frameworks. *Rebuttal*: Ambiguity is inherent in natural language evidence; forcing it into CPA-compatible partitions distorts rationality.  
     - **World Requirement**: Ubiquitous ambiguous evidence (e.g., medical diagnoses with vague symptoms, legal testimony with contextual uncertainty).

  2. **Incommensurable Priors from Distinct Conceptual Frameworks**  
     - **Formalism**: Agents with genuinely different *ontological categories* (e.g., quantum physicist vs. Aristotelian philosopher observing quantum phenomena). No shared prior can be defined because their state spaces are disjoint.  
     - **Why Decisive?**: CPA requires a common state space. If agents partition possibility spaces differently (e.g., one uses "particle/wave," the other "potential/actual"), no common prior exists.  
     - **Defender Response**: Claim agents *should* adopt a "super prior" over meta-ontologies. *Rebuttal*: Rationality doesn't require agents to adopt alien ontologies; they may lack the conceptual resources.  
     - **World Requirement**: Radical conceptual divergence (e.g., human vs. AGI with emergent concepts, or cross-cultural scientific paradigms).

  ---

  ### **II. Strong Challenges: CPA Violations in Learning & Dynamic Consistency**
  These show CPA leads to irrationality in dynamic settings or with bounded agents.

  3. **Non-Convergence of Beliefs Under Common Priors (e.g., *Bounded Recall or Processing*)**  
     - **Formalism**: In models like Aaronson’s *trolljectivity*, agents with common priors but bounded memory/processing fail to converge even with identical evidence streams. Disagreement is *persistent and rational*.  
     - **Why Strong?**: CPA + identical evidence *should* imply agreement, but computational constraints prevent it. Defending CPA requires demanding unrealistic rationality.  
     - **Defender Response**: "Ideal rationality excludes boundedness; CPA is normative." *Rebuttal*: If boundedness is essential to real-world rationality, CPA is inapplicable.  
     - **World Requirement**: Agents with cognitive limitations (all humans) receiving complex evidence streams (e.g., climate science debates).

  4. **Dynamic Inconsistency with CPA (e.g., *Time-Inconsistent Beliefs*)**  
     - **Formalism**: Agents who rationally update beliefs over time may become dynamically inconsistent if forced to commit to a common prior. Hanson’s *probability warehousing* shows markets favor traders who violate CPA.  
     - **Why Strong?**: CPA forces agents to ignore belief changes that are locally rational, violating dynamic coherence.  
     - **Defender Response**: "Agents should correct for anticipated belief changes." *Rebuttal*: Anticipation requires perfect self-knowledge, often impossible (e.g., updating on emotional experiences).  
     - **World Requirement**: High-stakes decisions with evolving self-knowledge (e.g., addiction treatment, career planning).

  ---

  ### **III. Awkward Challenges: Foundational & Interpretative Issues**
  These pressure CPA’s coherence or scope but can be partially absorbed by defenders.

  5. **The "What is a Prior?" Problem (*Subjective vs. Logical Probability*)**  
     - **Argument**: If priors are purely subjective, CPA is arbitrary; if logical (e.g., Carnap), they’re often uncomputable or non-unique. Williamson’s *epistemic probability* challenges the idea that priors are "beliefs" at all.  
     - **Defender Response**: "Priors are counterfactual credences under total ignorance." *Rebuttal*: Ignorance priors (e.g., maxent) fail in state spaces with complex structure.  
     - **World Requirement**: Agents reasoning about domains with no natural symmetry (e.g., metaphysics, ethics).

  6. **Agreement Theorems Assume CPA (Circularity)**  
     - **Argument**: Aumann’s theorem *presupposes* CPA to prove disagreement implies informational differences. This makes CPA unfalsifiable by agreement theorems.  
     - **Defender Response**: "CPA is justified normatively by coherence arguments (e.g., Dutch books)." *Rebuttal*: Dutch books assume identical valuation, which CPA is meant to justify.  
     - **Resolution**: Independent arguments for CPA (e.g., no-trade) are needed.

  ---

  ### **IV. Defensive Maneuvers: How CPA Insulates Itself**
  Defenders often recast counterexamples as:
  - **Differences in Information**: Claiming hidden informational asymmetries (e.g., in Judy Benjamin, "the agent misparsed the conditional").  
  - **Awareness Growth**: Arguing agents discover new possibilities mid-update.  
  - **Modeling Choices**: Asserting state spaces should be refined until CPA holds.  

  **Why This Risks Unfalsifiability**: CPA becomes a *constraint on modeling*: any rational disagreement *must* be modeled as information asymmetry. This is vacuous if no independent criteria identify "information."  

  **Escaping Unfalsifiability**: CPA is falsified if:  
  - A formal model proves rational agents *must* have non-common priors to satisfy Bayesian norms (see Judy Benjamin).  
  - Empirically, experts with identical evidence persistently disagree *and* no hidden information is plausible (e.g., disagreeing meteorologists with same data).  

  ---

  ### **V. Conclusion: Balance of Evidence**
  - **Decisive Against CPA**: Models where rationality *requires* non-common priors (e.g., ambiguous evidence, incommensurable ontologies). These force defenders into unnatural modeling contortions.  
  - **Defensible CPA**: In local, well-defined contexts with clear state spaces (e.g., poker games). Here, agreement/no-trade theorems have normative force.  
  - **Unfalsifiability Risk**: Real but not fatal. CPA can be a **regulative ideal** (like perfect competition in economics) without being universally true. Your position holds if constrained to idealized agents with shared conceptual frameworks. Beyond this, it becomes descriptively inadequate and normatively optional.  

  **Recommendation**: Ground your view in **specific domains** (e.g., scientific communities with shared paradigms) where CPA plausibly holds. Acknowledge its limitations in messy, ambiguous, or ontologically diverse contexts—this retains normative force without overreach. For formal defenses, see Titelbaum’s work on *fixed-points* in disagreement; for critiques, see Schoenfield’s *permissivism* or Bradley’s *ambiguity*.
