     But note: in software, we can also simulate the world. We could model the glass at the molecular level and simulate the strike. Then the fragility is an emergent property. Then we don't have a fragility flag, but we have a complex state that, when struck, breaks. Then the disposition is reduced to the underlying state and the laws of physics (in the simulation). This avoids the primitive flag. But then the conditional is still there: if we strike, then it breaks. And we run into the same problems with finks and masks? Not exactly: if the sorcerer changes the molecular structure at the moment of striking, then in the simulation we break? Or if we have packing, then the strike doesn't transfer to the glass? So the simulation would show that the glass doesn't break. But then we would say the glass is still fragile? Only if we consider the glass in isolation without the packing. But in the simulation, the packing is part of the total system. So we have to define the object: is it the glass or the glass-with-packing?

     This points to another issue: the boundaries of the object. In software, we can define objects as we wish. We might have:

          class Glass:
              ... # molecular state

          class Packing:
              ... # absorbs impact

          class PackedGlass:
              def __init__(self, glass, packing):
