     The philosophical debate is not fully resolved, but the software analogy shows that the problem is about the specification of the object, the stimulus, and the context.

     Final verdict: The untranslatable residue (the intrinsicality) is a sign that the philosophers are trying to account for the object's properties independently of context, but context (like finks and masks) is always present. In software, we can design context-independent properties (like the intrinsic flag) but then we have to manage the context explicitly. The philosophers might be right that the simple conditional analysis is too simplistic, and we need a more nuanced view that includes the causal basis and normal conditions. But in software, we can engineer around it by having clear specifications and context management.

