  First, they're frustrated by the lack of agreed-upon standards. They mention examples like fish pain, octopus self-awareness, and bee consciousness. The core issue seems to be that different camps use different implicit criteria—neurotransmitters, brain structures, behavior. They want a clear set of desiderata that any theory must satisfy.

  The user's explicit request is for the requirements a theory must meet, including evolutionary and neurobiological constraints. They also want to know which requirements are genuine constraints versus preferences of certain camps, and if any requirements conflict. Plus, they're interested if the list itself rules out some theories.

  But what's their deeper need? They might be seeking a framework to critically evaluate existing theories themselves. They don't want me to judge theories but to provide the tools. They might also want to understand where consensus lies and where genuine debates exist. Possibly, they aim to contribute to the discussion or form their own informed opinion.

  Now, considering the desiderata. I need to outline key requirements. The hard problem of consciousness is fundamental—any theory must address why subjective experience arises from physical processes. Then, biological continuity: since consciousness evolved, there should be a continuum, not abrupt distinctions. Neurobiological plausibility is crucial—the theory must align with known brain mechanisms. Phenomenological adequacy ensures the theory explains diverse experiences. Behavioral covariance links consciousness to observable behavior without over-relying on it. Evolutionary parsimony avoids multiplying explanations unnecessarily.

  The user also wants to distinguish genuine constraints from preferences. For example, requiring a cortex is a preference of some camps, not a strict constraint since birds and octopuses show complex cognition without it. Language as a requirement is another preference; many animals exhibit consciousness without it. Mammalian-centric views ignore evidence from other species.

  Potential tensions: Behavioral covariance might conflict with neurobiological plausibility if behavior is prioritized over neural evidence. Evolutionary parsimony could clash with neurodiversity if a theory over-unifies mechanisms. Also, the hard problem's explanatory gap might make some requirements hard to satisfy together, like explaining subjective experience with neurobiology alone.

  The requirement doing the heaviest lifting is likely the Hard Problem constraint. It forces theories to address why certain processes are conscious, which many existing theories fail to do adequately. This requirement alone might rule out theories that merely correlate neural activity with behavior without explaining subjectivity.

