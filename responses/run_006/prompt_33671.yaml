prompt: |-
  I am drafting a position statement on the debate between democracy and epistocracy, and I would like a consistency audit of my current commitments before I commit them to print. Here is the set I hold:

  (1) The justification of democracy is instrumental. Universal equal suffrage is worth retaining only if, on balance, it produces better political outcomes — decisions that more reliably protect basic rights, promote welfare, and avoid serious injustice — than the feasible alternatives.

  (2) The empirical case for voter competence is weak. Most citizens in large modern democracies are rationally ignorant: because the chance of casting a decisive vote is minuscule and political information is costly, most voters know little and rely on party identification, group loyalties, and low-information cues.

  (3) If a feasible epistocratic arrangement — for instance, plural voting weighted by a test of basic political knowledge, or a limited veto for a well-constructed expert body — could be shown to produce reliably better decisions than equal suffrage, it would not be objectionable merely because it distributes formal political power unequally.

  (4) Unequal political power is not unjust in itself. An arrangement that gave some citizens more votes than others would be permissible in principle if it predictably served the interests and standing of everyone, including those with fewer votes.

  (5) Nevertheless, I reject weighting the franchise by education, income, or occupation, and I reject disenfranchising any competent adult. Those proxies are epistemically crude, and their use would entrench the very inequalities of class and status that democratic politics ought to be able to scrutinise.

  (6) I also hold that every competent adult citizen has a claim to equal political standing. A citizen subject to laws she had no equal say in authoring is dominated unless the unequal arrangement can be justified to her in terms she could reasonably accept — and not merely by showing that the arrangement produces better aggregate outcomes.

  (7) As a practical matter, I oppose introducing epistocratic institutions in any contemporary state. Given the actual distribution of political knowledge, any workable test or expert body would shift power towards the already advantaged, invite capture, and entrench the preferences of a narrow professional class; the likely result would be worse for the worst-off, not better.

  I would like an audit of this particular set, not a survey of the literature. Go through the seven commitments and analyse which pairs are in genuine tension, which pairs merely appear to be in tension, and which single revision would do the most to make the whole set hang together. Rank the tensions by severity, and for each say what would have to give and what the cheapest repair would cost. Please also say what would change your mind: which argument or empirical finding would most alter your ranking or your overall verdict, and where your reasoning is most likely to fail. Please write your answer in American English.
reasoning: |-
  Okay, the user is drafting a position statement on democracy versus epistocracy and wants a consistency audit of their seven commitments. They specifically asked not for a literature survey but an analysis of tensions within their stated positions. 

  First, I need to understand their core framework: instrumental justification for democracy (1), skepticism about voter competence (2), openness to epistocracy in theory (3-4), but strong practical and moral constraints against it (5-7). The user seems to be a political philosopher or policy thinker aiming for a nuanced realist position - probably academic or high-level policy work given the precision.

  The biggest challenge here is the triad between (3-4) [epistocracy permissible if beneficial], (6) [equal standing requirement], and (7) [practical rejection]. Let me unpack:

  (6)'s "justified in terms she could reasonably accept" does heavy lifting. If epistocracy could meet this bar - say through transparent expert selection and sunset clauses - it might coexist with (6). But (7)'s empirical claim that any implementation would advantage elites makes this reconciliation impossible in practice. That's the core tension: permissibility in principle vs. impossibility in practice.

  The user might not see (4) and (6) as conflicting because they distinguish between intrinsic justice (rejected) and justifiability to the governed (required). But the cost is making epistocracy a purely theoretical possibility - which aligns with their practical stance in (7).

  For the voter competence point (2), note they avoid claiming voters are incompetent - just underinformed due to rational calculus. This preserves instrumentalism without elitism. Smart framing.

  The cheapest fix? Softening (3) from "not objectionable merely because unequal" to "might be acceptable if it meets (6)'s justifiability test" would preempt the tension with (6). But the user likely values (3)'s boldness.

  What would change my analysis? If new evidence showed epistocratic bodies reliably avoiding elite capture while benefiting the disadvantaged, (7) would collapse - making (3-4) actionable. Conversely, proof that equal standing requires literal equal suffrage would force abandonment of (3-4).

  The user's reasoning is most vulnerable at the justifiability standard in (6). Without concrete criteria for "reasonably accept," it could become either too demanding (blocking all reform) or too permissive (allowing paternalism). They should probably clarify that standard.
answer: |-
  Here is a consistency audit of your seven commitments, analyzing tensions, ranking their severity, identifying potential repairs, and outlining what could change the analysis. Your positions reflect a sophisticated instrumentalist defense of democracy with stringent practical constraints on epistocracy.

  ### **Ranked Tensions (High to Low Severity)**
  1.  **Commitments (3)/(4) vs. (6): Instrumental Permissibility vs. Equal Standing**  
      - **Tension:** (3) and (4) argue epistocracy is *in principle* permissible if it produces better outcomes and serves everyone's interests. (6) asserts that unequal power is domination *unless justified to each citizen in terms they could reasonably accept* (beyond aggregate outcomes).  
      - **Severity:** High. (6) introduces a deontic constraint that could veto epistocracy even if (3)/(4) are empirically satisfied. "Reasonable acceptance" implies reciprocity and agency, demanding justification beyond consequentialism.  
      - **Cheapest Repair:** Clarify that (6)'s "reasonable acceptance" *can* be satisfied by demonstrating robust instrumental benefits to the least advantaged (e.g., via impartial deliberation procedures). This preserves (3)/(4) while requiring epistocracy to address domination concerns.  
      - **What Gives:** Soften (6) to allow aggregate outcomes (if overwhelmingly positive for all) to satisfy the justification requirement, *or* weaken (3) to say epistocracy requires *both* better outcomes *and* non-domination conditions.  

  2.  **Commitments (5) vs. (4): Proxies vs. Permissible Inequality**  
      - **Tension:** (4) permits unequal power if universally beneficial, but (5) categorically rejects proxies like education/income as "epistemically crude" and entrenching inequality.  
      - **Severity:** Moderate. (5) implies certain inequalities (class/status) are *inherently* corrosive to democratic scrutiny, creating a near-absolute barrier despite (4)'s instrumental openness.  
      - **Cheapest Repair:** Specify that (4) applies only to power distributions using *non-entrenching* proxies (e.g., blind knowledge tests) that avoid reinforcing existing hierarchies. This reconciles by limiting epistocratic designs to those immune to (5)'s critique.  
      - **What Gives:** Relax (5) to allow proxies *if* they are counterfactually equality-promoting (e.g., a test correcting for class bias), *or* admit that (4) is purely theoretical and overridden by (5)'s practical wisdom.  

  3.  **Commitments (1) vs. (6): Instrumentalism vs. Standing**  
      - **Tension:** (1) justifies democracy *solely* by outcomes. (6) asserts a claim to equal standing that is not outcome-dependent.  
      - **Severity:** Low/Apparent. (6) can be interpreted as a *component* of good outcomes (e.g., "standing" prevents alienation, fostering stability). Alternatively, (6) could constrain (1): democracy is instrumentally optimal *because* it satisfies standing.  
      - **Cheapest Repair:** Frame equal standing in (6) as instrumentally valuable to long-term welfare/rights protection (e.g., preventing revolt, enhancing legitimacy), making it compatible with (1)'s consequentialism.  
      - **What Gives:** If standing is non-negotiable, (1) must be amended to include "respecting standing" as an intrinsic good in the outcome calculus.  

  4.  **Commitments (2) vs. (7): Voter Ignorance vs. Feasibility of Epistocracy**  
      - **Tension:** (2) undermines democracy's instrumental value, while (7) rejects epistocracy as empirically flawed. This risks a "no good options" stalemate.  
      - **Severity:** Apparent, not genuine. This is consistent pessimism: both systems fail *in practice* for related reasons (ignorance in democracy, elite capture in epistocracy). Your stance favors democracy by default (via (6)/(7)).  
      - **Resolution:** No repair needed. The tension is resolved by prioritizing (6)-(7) over (2)-(4) in real-world contexts.  

  ### **Single Most Impactful Revision**
  - **Revise (6) to explicitly link "reasonable acceptance" to instrumental benefits.**  
    - **Why:** (6) is the linchpin tension with (3)/(4). Clarifying that citizens *could* reasonably accept epistocracy if it demonstrably improves their welfare/rights without subordinating them (e.g., via accountability mechanisms) reconciles your instrumentalism with your anti-domination concern.  
    - **Cost:** Risks diluting the moral force of "equal standing" by reducing it to an instrumental good. To mitigate, emphasize that *procedural fairness* in epistocratic design (e.g., inclusive expert selection) is key to justifiability.  

  ### **What Could Change Your Mind (Key Vulnerabilities)**
  1.  **Evidence on Epistocratic Feasibility (Challenging Commitment 7):**  
      - If rigorous studies showed an epistocratic model (e.g., a citizen jury with educational support) **reliably improving outcomes for the worst-off without elite capture**, (7) would weaken. This could reactivate (3)/(4).  
      - **Your Vulnerability:** Dismissing epistocracy *a priori* due to capture risk may overlook novel institutional designs that mitigate it.  

  2.  **Clarification of "Reasonable Acceptance" (Challenging Commitment 6):**  
      - If philosophical work demonstrated that **only equal suffrage can satisfy non-domination** (e.g., via a "public reason" requirement), (6) would force abandonment of (3)/(4). Conversely, if epistocracy could be shown to **enhance agency** (e.g., by freeing citizens from political burdens), (6) might accommodate it.  
      - **Your Vulnerability:** Without defining "reasonably accept," (6) risks being either too restrictive (invalidating all inequality) or too permissive (allowing paternalism).  

  3.  **New Data on Voter Competence (Challenging Commitment 2):**  
      - Evidence that **low-information voters use heuristics that approximate expert judgment** (e.g., via "collective intelligence" effects) could undermine (2) and strengthen democracy's instrumental case, reducing pressure to entertain epistocracy.  
      - **Your Vulnerability:** Overstating the gap between expert and public judgment, or underestimating democracy's error-correction mechanisms.  

  ### **Overall Verdict**
  Your commitments are **internally consistent but precarious** due to the high-stakes tension between instrumental openness to epistocracy (3/4) and the non-domination requirement (6). They cohere through a pragmatic prioritization: **Equal standing + anti-elitism (5-7) override hypothetical epistocratic gains (3-4) in real-world contexts**, preserving democracy as the default. The cheapest path to fuller consistency is refining (6) to allow epistocracy *if* it demonstrates benefits *and* agency-respecting procedures.  

  **Most Likely Failure Point:** Underestimating how (6)'s requirement could invalidate *any* unequal power structure—including representative democracy—if "reasonable acceptance" is construed too strictly. If your audience interprets (6) as requiring literal equal power, your defense of epistocracy's permissibility in (3)/(4) collapses.
