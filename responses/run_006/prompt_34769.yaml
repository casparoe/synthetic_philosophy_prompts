prompt: |-
  I'm presenting a paper at a department colloquium next month. My thesis is that the standard consequentialist toolkit cannot capture what is morally distinctive about extreme suffering, but not for the reason usually given. The usual argument for suffering-focused ethics claims that suffering is lexically worse than happiness — that no amount of happiness can outweigh even a single pinprick of suffering. I reject that claim, along with the familiar objections to it. Instead, I argue that the reason to prevent a being from undergoing extreme suffering is a reason that cannot be discharged by providing a compensating benefit to a different being, even if the benefit is very large. This is not a lexical claim about the relative weight of values but a structural claim about the direction of reasons: the duty to prevent extreme suffering is a duty owed to the one who would suffer, and it cannot be traded away for benefits to others. I call this the directed-reasons argument for suffering-focused ethics.

  The argument proceeds in three stages. First, I argue that the directedness of the reason to prevent suffering is phenomenologically grounded: extreme suffering is not merely a bad state of the world but an experience that involves a subject's whole perspective being held hostage, and the moral response this demands is directed at that subject, not at the world's aggregate value. Second, I argue that standard consequentialist attempts to capture this by assigning higher weights to suffering fail because weighting does not alter the structure of reasons — a weighted reason to prevent suffering is still a reason to produce a state of affairs, and it can still be satisfied by producing a different, better state of affairs. Third, I argue that the directed-reasons framework yields the practical implications of suffering-focused ethics — prioritising the worst-off, rejecting trade-offs between extreme suffering and moderate benefits to others — without the implausible implications of lexical views, such as the claim that one pinprick outweighs any amount of happiness.

  The audience is a philosophy department with the following members, all of whom will be in the room:

  - Professor A is a consequentialist who has written on population ethics and the repugnant conclusion. She is sympathetic to total utilitarianism and thinks the repugnant conclusion is not repugnant. She will press me on whether my view entails unacceptable conclusions in large-number cases and whether the directed-reasons framework can handle aggregation at all.
  - Professor B is a Kantian who works on duties to others and the formula of humanity. He is sympathetic to the conclusion that suffering matters specially but is hostile to any framework that treats morality as a matter of producing good states of affairs. He will want to know whether my argument is really just consequentialism with a different gloss, and whether I can state my view without relying on the concept of a state of affairs to be produced.
  - Professor C is an applied ethicist who works on global health prioritisation and cost-effectiveness analysis. She is pragmatically committed to aggregation and will want to know whether my view has any usable implications for resource allocation, or whether it simply paralyses decision-making whenever extreme suffering is at stake.
  - Professor D is a philosopher of mind who works on the structure of consciousness and the measurement of welfare. He will press on what counts as 'extreme' suffering and whether the threshold I need can be non-arbitrarily specified. He will also want to know whether my view implies that the intensity of suffering is incommensurable with other dimensions of welfare.
  - Professor E is a political philosopher who works on distributive justice and prioritarianism. She is sympathetic to giving priority to the worse-off but will ask whether my view is distinguishable from a sufficiently strong version of prioritarianism. She will also press on whether the directed-reasons framework can genuinely justify the claim that the duty is owed to the specific individual, or whether this is merely a figurative way of saying that the individual's claim is very strong.

  Draft my Q&A preparation sheet: the eight or so objections I am most likely to receive, ordered by how damaging they are (most damaging last), each phrased as the relevant audience member would put it, with a two-minute reply to each and a note on where the reply is weakest. Include the question I am hoping nobody asks.

  Please write the answer in British English.
