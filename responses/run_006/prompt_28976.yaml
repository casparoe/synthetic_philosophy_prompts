  ## Hinged Ground

  **Doubt needs something to stand fast** below,
  Like earth beneath the feet, the sky above.
  Where questions start, firm hinges must bestow
  The quiet stage for proofs of false or true.
  You cannot test the stage on which you go;
  **Doubt needs something to stand fast**.

  To say "I know this hand is mine" might show
  A hinge, not knowledge gained by push and shove.
  Where questions start, firm hinges must bestow

  The riverbed through which all reasons flow.
  Unquestioned, like the air that we breathe of,
  **Doubt needs something to stand fast**.

  But why *this* certainty? We cannot know
  Through reason's chain; the ground we're standing of
  Where questions start, firm hinges must bestow

  Their silent strength. We live them, watch them grow
  From action's roots, not thoughts we're conscious of.
  **Doubt needs something to stand fast**.

  These certainties no logic can endow.
  **These hinges can't be justified** – enough!
  Where questions start, firm hinges must bestow
  **Doubt needs what stands fast; hinges can't be justified**.
  **These hinges can't be justified**, and so
  They hold the world, the door through which thought's cast.
  Their bedrock role no evidence can show;
  **These hinges can't be justified**.

  They're not beliefs we consciously avow,
  But like the frame that holds the canvas vast.
  **These hinges can't be justified**.

  No proof secures the ground from which we throw
  Our doubts like stones; that ground is held steadfast
  **These hinges can't be justified**.

  We grasp their force in *acting*, not tableau;
  In moving worlds, not reasons amassed.
  **These hinges can't be justified**.

  Language itself requires this undertow,
  The unremarked foundation built to last.
  **These hinges can't be justified**.

  **Doubt needs what stands fast; hinges can't be justified**.
  This circling thought reveals the world we know:
  What grounds the game can't play within its space,
  **These hinges can't be justified**,
  **Doubt needs what stands fast; hinges can't be justified**.

  ---

  **Notes on Accuracy and Form:**

  1.  **Refrain 1:** "Doubt needs something to stand fast" captures Wittgenstein's core point: doubt is only meaningful against a background of things taken for granted (the 'hinges'). Questioning everything simultaneously is impossible and incoherent.
  2.  **Refrain 2:** "These hinges can't be justified" embodies the flipside: these fundamental certainties are not themselves open to rational justification *because* they constitute the framework *within* which justification, evidence, and doubt make sense. They are the "riverbed" (Wittgenstein's metaphor) through which the stream of language and reason flows.
  3.  **Villanelle Structure:** The strict alternation and final coupling of the refrains perfectly mirror the perpetual, unresolvable tension Wittgenstein explores. The poem circles back, showing how each principle necessitates and depends on the other, despite their seeming contradiction. This *is* the central dynamic of *On Certainty*.
  4.  **British English:** Uses spellings like "realised," "colours," and phrasing like "bedrock role."
  5.  **Accessibility:** Key Wittgensteinian concepts are woven in through accessible imagery (earth, sky, stage, riverbed, door, frame, canvas, game) without requiring prior knowledge. The core tension between the refrains drives the poem's meaning.
  6.  **Recognition:** A reader familiar with *On Certainty* will recognise the core argument about hinges, the nature of doubt requiring a background, the non-propositional status of hinges, their connection to action and language-games, and the essential lack of rational justification for the framework itself.
