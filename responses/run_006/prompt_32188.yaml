  I should reconstruct the implicit ethical scaffolding. The current consensus likely blends multiple principles: a modified harm principle (preventing serious disease), anti-eugenics commitments (rejecting trait optimization), and virtue ethics (discouraging "consumerist" parenting). But these principles conflict—hence the inconsistencies the user spots. 

  The Deaf culture example reveals how the "harm prevention" framework actually imposes a normative view of flourishing. And the sex-selection paradox shows how technology heightens ethical scrutiny even when motives might be identical to "natural" reproduction. 

  If we applied pure procreative beneficence (selecting the "best" embryo), it could justify IQ screening—but society recoils at that. Pure autonomy would permit sex selection—but it's banned. So neither extreme aligns with practice. The compromise seems precarious: it holds only if we accept that some harms are objective (Tay-Sachs) while others are socially constructed (deafness), and that technologies alter moral responsibility. 

  Where is this underdetermined? The threshold for "serious" suffering is fuzzy (why cystic fibrosis but not dwarfism?). And the anti-eugenics boundary relies on contested ideas about human nature. Ultimately, the consensus might be less a coherent theory than a truce between competing values—with technology as the scapegoat for deeper anxieties about inequality and control.
answer: |-
  You've hit on one of the most philosophically charged tensions in reproductive ethics. The current consensus around PGD is indeed a messy, historically contingent compromise resting on several overlapping but often conflicting principles. Here's a reconstruction of its implicit commitments and tensions:

  ### Core Implicit Principles Underlying the Consensus
  1.  **The "Serious Harm Prevention" Principle:** Parents have a strong duty to prevent *serious suffering and early death* for their future children. This is the least controversial justification for screening out conditions like Tay-Sachs or severe cystic fibrosis. Suffering/death are seen as objective harms.
  2.  **The "Medical/Non-Medical" Boundary:** Interventions are permissible only to avoid conditions widely classified within mainstream medicine as "diseases," "disorders," or "disabilities" causing significant impairment. This boundary is socially constructed but functions as a bright line.
  3.  **The Anti-Eugenics Imperative:** Deliberate selection *for* "positive" traits (beyond health) or *against* traits primarily based on social disadvantage/prejudice is prohibited. This stems from historical eugenics atrocities and fears of commodifying children or exacerbating social inequality. IQ/height selection falls squarely here.
  4.  **The Anti-Subordination Principle (Applied Selectively):** Selection that reinforces harmful social hierarchies (like systemic sexism) is prohibited, hence bans on non-medical sex selection. However, this principle is inconsistently applied (e.g., not preventing natural "trying for a boy/girl").
  5.  **The "Acceptable vs. Unacceptable Parental Motives" Distinction:** Motives framed as "health" or "preventing suffering" are legitimate. Motives framed as "preference," "convenience," "social advantage," or "family balancing" are suspect or illegitimate, *especially when technology is involved*. Technology makes motives more explicit and actionable, heightening scrutiny.
  6.  **The "Open Future" Concept (Implicitly):** Children should not be pre-determined in ways that significantly constrain their future autonomy or identity formation (a concern raised against selecting for traits like deafness or potentially IQ/sex in certain contexts).
  7.  **Virtue Ethics & Parental Attitude:** The consensus reflects a view of "good parenting" as accepting one's child unconditionally, not designing them to specification. PGD for severe disease is seen as compatible with this; selection for sex or enhancement is seen as violating it.

  ### Addressing the Inconsistencies You Spot
  *   **Deafness & the Harm/Suffering Boundary:** You're right. The practice *does* smuggle in a substantive view. It implicitly defines "harm" through a *majority, non-disabled perspective*. While the Deaf community argues deafness is a linguistic/cultural identity, the medical consensus defines it as a sensory *impairment*. The PGD framework prioritizes the medical definition, assuming the absence of hearing *is* a harm limiting flourishing in the hearing world. This highlights the non-neutrality of the "medical" boundary.
  *   **Sex Selection Paradox (Nature vs. Tech):** This exposes a crucial inconsistency. The consensus implicitly holds that:
      *   **Technology changes moral responsibility:** Actively selecting an embryo feels like "making" a girl, while conceiving naturally feels like "accepting" what comes. The method itself is moralized.
      *   **Intent is harder to police in nature:** It's impossible to regulate parental hope during natural conception. IVF/PGD makes intent explicit and actionable by the clinic/state.
      *   **Slippery Slope Concerns:** Permitting non-medical sex selection via PGD is feared to normalize the practice and open the door to other non-medical selections. Natural conception lacks this systemic "gateway" effect in the policy mindset.
      *   **Symbolic Value of Nature:** "Accepting the lottery of nature" carries symbolic weight; deliberately overriding it for social reasons is seen as problematic in a way natural family planning isn't.

  ### Would Pure Theories Collapse the Practice?
  *   **Pure Procreative Beneficence (Savulescu's Principle):** "Select the embryo most likely to have the best life." This *would* collapse the current consensus. It could mandate screening *out* embryos with genes linked to lower IQ, higher disease risk, or even lower predicted happiness. It could also permit or mandate selection *for* traits like higher IQ or physical robustness if the evidence were strong enough. The current bans on sex selection and enhancement would be indefensible under strict procreative beneficence unless strong evidence showed being a specific sex or having average IQ led to a *worse* life – evidence unlikely to be conclusive or universally accepted. **Conclusion:** The current practice *explicitly rejects* pure procreative beneficence as the sole guide.
  *   **Pure Reproductive Autonomy:** "Parents decide solely based on their own values." This would also collapse the consensus. Non-medical sex selection would be permitted. Selection for deafness (desired by some Deaf parents) would be permitted. Selection for cosmetic traits or IQ would be permitted if technically possible. The state/clinic's role would be limited to providing information and safe procedures, not gatekeeping based on the nature of the selection. **Conclusion:** The current practice *severely limits* pure reproductive autonomy in the context of embryo selection.

  ### Where is the Practice Philosophically Underdetermined?
  The consensus relies heavily on contested lines drawn for pragmatic or historical reasons, not pure philosophy. Different theories *could* justify the same rules, but the *motivation* differs:
  1.  **The "Serious Harm" Threshold:** What counts as "serious"? Why is Huntington's in but dwarfism (Achondroplasia) often out? Why CF in but some forms of inherited deafness ethically contested? Utilitarians might focus on quality-adjusted life years (QALYs), Kantians on autonomy limitations, virtue ethicists on the capacity for flourishing – but the clinical lists are often based on medical severity classifications mixed with societal norms.
  2.  **The Anti-Eugenics Boundary:** What makes a selection "eugenic"? Is it the trait (socially devalued), the intent (improving the gene pool), or the scale (population-level impact)? A rights-based theorist might oppose selection against deafness based on minority rights, while a consequentialist might oppose IQ selection based on societal harm, and a virtue ethicist might oppose all non-medical selection as commodifying.
  3.  **The Role of Technology:** Why is using PGD for sex selection worse than sperm sorting or natural "trying"? A technological determinist view sees the tool itself as transformative of the moral act. Other views see the intent as paramount, regardless of method. The consensus adopts a hybrid, pragmatic view that technology enables greater control and thus requires greater regulation to prevent misuse, especially for socially sensitive traits.
  4.  **"Family Balancing":** Some jurisdictions (like parts of the US) allow sex selection for "family balancing" (having a child of the underrepresented sex). This exception reveals the underdetermination. Is it justified by reducing parental disappointment? Promoting diverse family experiences? Preventing repeated attempts with IVF? It's a concession to autonomy/pragmatism that doesn't cleanly fit the "anti-subordination" or "medical necessity" principles.

  **The Bottom Line:** The current PGD consensus is **not a coherent, single philosophical theory**. It's a **pragmatic, politically negotiated settlement** attempting to:
  *   **Capture the low-hanging fruit:** Preventing catastrophic childhood diseases is overwhelmingly seen as good.
  *   **Draw defensible(ish) lines:** The "medical disorder" boundary, while fuzzy, is more objective than "parental preference."
  *   **Avoid the most dangerous slopes:** Blocking overt enhancement and trait selection prevents revisiting eugenics.
  *   **Manage social anxieties:** Banning sex selection addresses concerns about gender discrimination without regulating natural conception.
  *   **Preserve symbolic values:** Upholding ideas of unconditional acceptance and the "natural lottery."

  Its philosophical strength lies in preventing the worst excesses of pure autonomy or pure beneficence. Its weakness is its inconsistency, its reliance on contested social definitions of harm/disability, and its sometimes-arbitrary distinctions between nature and technology. It holds because the alternatives (either total laissez-faire or state-mandated "best embryo" selection) are currently seen as more ethically fraught by the majority of policymakers, clinicians, and the public. The debates you highlight – deafness, sex selection, future polygenic scores – are the fault lines where these underlying tensions and inconsistencies are most exposed.
