  The real trouble comes in step (7) where they argue that if you can't even judge something about your own mind, then it can't be true. This leap from epistemic limitation to metaphysical impossibility is where the "proves too much" happens. It's claiming that our inability to conceive or judge something means it's impossible, which would indeed make self-deception impossible - contradicting obvious psychological facts.

  I should consider possible objections. First, the transparency claim in (4) might be too strong. Do we really self-ascribe beliefs solely based on judging p? What about cases where we're unsure or conflicted? Second, step (7)'s move from unjudgeability to impossibility seems invalid - our cognitive limitations don't dictate reality. Third, perhaps the definition of "judging" in step (3) is ambiguous - is it simultaneous or sequential consideration of the conjuncts?

