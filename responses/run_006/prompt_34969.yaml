prompt: |-
  hi so i'm in student gov and we got assigned to evaluate this proposal where the school installs solar panels — costs a ton upfront (like, from our reserve fund) but saves money on electricity over ~20 years and cuts emissions. the administration told us to use "intergenerational justice" as our framework but honestly none of us know what that means as an actual thing you do, as opposed to just a vibe.

  can you turn intergenerational justice into like a decision procedure or checklist we can actually run? we have 30-minute meetings and we're not philosophers. i need: what questions to ask and in what order, what counts as a good enough answer, where the procedure says yes this is fair to future students, where it says no, and where it has to punt to a judgment call because it's values not facts.

  things it needs to handle: discounting (should we care less about students 30 years from now just cause they're far away in time?), uncertainty (we don't know future energy prices or what the climate will actually be like), and the fact that future students don't get a vote in student gov which feels kinda unfair but also unavoidable.

  then run the procedure on two cases: (1) the solar panel thing, and (2) a proposal to cut the arts budget to build a STEM lab — current students really want the lab, but it means future students lose the arts program permanently. i want to see where the procedure gives an answer i might not like.
reasoning: |-
  Okay, let me break this down. The user is in student government facing a practical dilemma: they need to evaluate proposals through an "intergenerational justice" lens but lack a concrete framework. They're clearly frustrated by abstract philosophical concepts and need something actionable for short meetings. 

  First, I need to translate intergenerational justice into a usable checklist. The core idea is treating future generations fairly - not exploiting them for our benefit or burdening them with our choices. Key angles: avoiding irreversible harm, sharing costs/benefits across time, and preserving their options.

  The user flagged three tricky elements: discounting (how much less we value distant futures), uncertainty (unknown future conditions), and representation gaps (future people can't vote). These need baked-in handling. Discounting is ethically problematic here - climate impacts compound over time, so near-zero discount rates make more sense. Uncertainty should lean toward precaution: if an action risks catastrophic harm, avoid it even if probabilities are fuzzy. Representation gaps mean we must actively imagine future students' perspectives.

  For the solar panel case: high upfront cost but long-term savings. The checklist should flag irreversible benefits (emission cuts) and assess burden-sharing. Since costs hit now but benefits span decades, it passes if we verify the reserve fund won't cripple current needs. Uncertainty about energy prices? Side with renewables - fossil costs will likely rise. 

  The STEM vs arts case is tougher. Permanently killing arts for a STEM lab today fails multiple checks: irreversible loss of options, lopsided benefit (current STEM students win, future arts lovers lose), and it creates inflexibility. Unless the STEM lab generates massive ongoing funding to restore arts later, this looks unjust by the framework. 

  The user wants to see where the framework challenges their preferences - that STEM/arts example is perfect. If current students are pushing hard for the lab, the procedure might disappoint them by blocking it. That's the point: intergenerational justice isn't about pleasing today's majority. 

  I'll structure this as a modular 5-step checklist with clear "yes/no/punt" outputs at each stage. Punting happens when values clash irreconcilably (e.g., how much to prioritize environment vs economy). For students, I'll emphasize simple language and visual cues - stoplight colors, concrete thresholds. And stress that sometimes "it's complicated" is a valid outcome requiring deeper debate.
answer: |-
  Here's a practical **Intergenerational Justice (IJ) Decision Procedure** designed for student government use – a concrete checklist, not just a vibe. It handles discounting, uncertainty, and representation gaps.

  ---

  ### **Intergenerational Justice Checklist (The "Fairness Across Time" Test)**
  **Goal:** Decide if a proposal fairly balances impacts on *current* students (CS) vs. *future* students (FS).  
  **Core Principle:** Don't force FS to bear major costs/burdens so CS can get benefits, unless FS also get significant offsetting benefits or avoid major harms.

  #### **Step 1: Irreversible Harm/Loss Check**
  *   **Question:** Does this create a *permanent loss* or *irreversible harm* for FS?
      *   *Examples:* Eliminating a unique program, destroying green space, locking in high emissions.
  *   **Good Answer:** "No permanent harm, or harm is minor/offset." OR "Harm is unavoidable to prevent greater harm to FS."
  *   **Red Flag:** "Yes, FS lose something unique/unreplaceable."
  *   **IJ Verdict:** 🛑 **NO** if major irreversible harm to FS without overwhelming offsetting benefit *to them*. (Punts if harm is debatable).

  #### **Step 2: Burden/Benefit Timing Check**
  *   **Question:** Who pays significant costs? Who gets significant benefits? (Map over 10/20/30 years).
  *   **Good Answer:** "Costs/Benefits are shared across generations." OR "CS bear costs, FS get benefits." OR "Short-term CS costs lead to *long-term shared benefits*."
  *   **Red Flag:** "CS get big benefits *now*, FS pay big costs *later*."
  *   **IJ Verdict:** ✅ **YES** if FS net beneficiaries. 🛑 **NO** if FS net losers. ⚠️ **PUNT/JUDGEMENT** if mixed/uncertain (Go to Step 4).

  #### **Step 3: Future Flexibility Check ("Option Preservation")**
  *   **Question:** Does this reduce FS's choices or ability to solve their own problems?
      *   *Examples:* Blowing reserve funds FS might need, locking infrastructure into carbon-intensive systems.
  *   **Good Answer:** "Preserves or increases FS options/flexibility." OR "Uses resources efficiently to *create* future options."
  *   **Red Flag:** "Spends FS's safety net on our wants," or "Commits FS to a risky path."
  *   **IJ Verdict:** ✅ **YES** if preserves/enhances FS options. 🛑 **NO** if significantly reduces them. ⚠️ **PUNT** if impact unclear.

  #### **Step 4: Uncertainty & Precaution Check**
  *   **Question:** Given major uncertainties (costs, climate, tech), what happens if the *worst plausible* outcome occurs? Would FS be screwed?
  *   **Good Answer:** "Even in bad scenarios, FS aren't severely harmed; benefits still likely." OR "The action *reduces* major future risks for FS (e.g., climate disaster)."
  *   **Red Flag:** "If things go badly, FS bear catastrophic costs."
  *   **IJ Verdict:** ✅ **YES** if robust against risk/reduces big FS risks. 🛑 **NO** if exposes FS to catastrophic downside. ⚠️ **PUNT** if risk profile is highly ambiguous (needs expert input).

  #### **Step 5: Representation & Necessity Check**
  *   **Question:** Since FS can't vote, have we **actively considered their potential interests**? Is this action *necessary* now, or can it wait?
  *   **Good Answer:** "We simulated FS interests via [e.g., environmental impact, future cost projections]." AND "Acting now is crucial to avoid much higher costs/harm later for FS."
  *   **Red Flag:** "We didn't think about FS," or "We could easily do this later without harming CS."
  *   **IJ Verdict:** ⚠️ **PUNT** if FS interests weren't considered. ✅ **YES** if considered & necessary now. 🛑 **NO** if avoidable burden on FS for non-essential CS gain.

  ---

  ### **Handling Your Key Issues**
  *   **Discounting:** **REJECT heavy discounting.** A small discount for pure financial ROI *might* be justified (if solar saves money), but **never** for ethical harms (emissions cuts, lost opportunities). Future lives matter as much as present ones.
  *   **Uncertainty:** Use **Step 4 (Precaution)**. Err on the side of protecting FS from catastrophic risks. Climate action is inherently precautionary.
  *   **No Vote for FS:** **Step 5 (Representation)** forces explicit consideration. Use data/projections as their "voice."

  ---

  ### **Running the Cases**

  **Case 1: Solar Panels (High Upfront Cost, Long-Term Savings & Emission Cuts)**
  1.  **Irreversible Harm?** NO (Panels reduce irreversible climate harm). **✅**
  2.  **Burden/Benefit Timing?** CS pay upfront cost (burden), FS get cheaper power & cleaner planet (benefit). **✅ (CS cost, FS benefit)**
  3.  **Future Flexibility?** YES (Reduces FS energy costs, fights climate change giving them *more* options). **✅**
  4.  **Uncertainty/Precaution?** Even if savings are lower than expected, emission cuts are a *massive* FS risk reduction (climate change). Actions reducing catastrophic FS risk are strongly IJ-positive. **✅**
  5.  **Representation/Necessity?** FS interests (climate, costs) considered via projections. Acting now locks in savings/emission cuts; waiting likely costs *more* and worsens climate for FS. **✅**
  **IJ VERDICT:** ✅ **STRONG YES.** Fair to FS. Uses CS resources to *prevent* harm and *create* benefits for FS. Classic IJ win.

  **Case 2: Cut Arts Budget Permanently to Build STEM Lab (CS Want Lab, FS Lose Arts)**
  1.  **Irreversible Harm?** **YES.** Permanent loss of arts program for FS. 🛑 **Major Red Flag.**
  2.  **Burden/Benefit Timing?** CS get new STEM lab (benefit). FS lose arts permanently (major burden/cost). **🛑 (CS benefit, FS burden)**
  3.  **Future Flexibility?** **NO.** Permanently removes an educational/cultural option for FS. Reduces their choices. **🛑**
  4.  **Uncertainty/Precaution?** Worst case: FS have a narrower, less balanced education, harming well-being and skills. Uncertainty weighs *against* permanent loss. **🛑**
  5.  **Representation/Necessity?** Why must this happen *now*? Could fundraising or phased implementation work? FS interests (access to arts) likely ignored. **🛑 (Lack of necessity/consideration)**
  **IJ VERDICT:** 🛑 **STRONG NO.** Unfair to FS. Forces them to bear a permanent cultural/educational cost so CS can get a temporary benefit. Fails multiple checks badly. *This is the answer you might not like if CS really want the lab.* IJ prioritizes preventing permanent harm to FS over non-essential gains for CS.

  ---

  ### **Key Takeaways for Your Meetings**
  *   **Flow:** Go through Steps 1-5 in order. Stop for a 🛑 NO.
  *   **Time:** Focus debate on ⚠️ **PUNT/Judgement** steps. Get data if possible.
  *   **Fairness:** A ✅ YES means FS aren't exploited. A 🛑 NO means they are.
  *   **Values Calls:** Steps 1 (Severity of Harm) & 4 (Risk Tolerance) involve values. Debate openly: "Is permanently losing X worth Y for us now, knowing FS never get X?"
  *   **Discounting:** Only use minimally for *financial* calculations (e.g., NPV of solar savings), **never** for ethical value of future well-being or avoiding harm.

  This turns "intergenerational justice" from a vibe into a defendable process. It makes the invisible future students visible in your decision-making. Good luck!
