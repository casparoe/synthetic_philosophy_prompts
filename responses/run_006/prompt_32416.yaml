prompt: |-
  I just spent an hour arguing with a friend about the centipede game. I defended the view that common knowledge of rationality does not compel the backward-induction solution — that the standard argument requires a further assumption about what players would infer about each other's rationality after a deviation from the equilibrium path, and that this further assumption is not part of common knowledge of rationality as usually defined. My friend insisted that CKR straightforwardly generates backward induction, and that to deny this is to misunderstand the formalism. I want you to tell me what would count against my position. What formal results, models, or arguments should move me? I want the defeaters ranked from decisive to merely awkward, and I want to know whether my view has been insulated against counterevidence — and if so, whether that insulation is a problem for a view of this kind. Keep the response to roughly one page.
