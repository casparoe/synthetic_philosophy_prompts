  Okay, the user is a PhD student in philosophy of medicine who needs to teach a 90-minute session to first-year med students about the naturalism vs. normativism debate. They're not philosophy students, so I need to make this accessible and engaging. Their default view is that disease is whatever the textbooks say, so the challenge is to make them see why this is even a question.

  First, I should figure out how to structure the session. The key is to start with something familiar and then introduce the problem. Maybe begin with a case study that challenges their assumptions. The user mentioned hypertension or obesity, but those might have too many associations. What's a cleaner example? Homosexuality used to be in the DSM—that's a good one because it's historical and shows how definitions change based on societal values. But I need to be careful with sensitivity. Maybe emphasize it's a settled issue now to avoid discomfort.

  Next, misconceptions. They might think that if values are involved, diseases aren't real. I need to address that explicitly. Use an analogy, like traffic laws: just because we decide speed limits based on values doesn't mean roads aren't real. Also, clarify that naturalism isn't denying values in practice, but in the concept itself.

  For the order of ideas, start with the case study to hook them. Then introduce the distinction using their reactions. Break down naturalism and normativism with clear definitions. Use a second example, like deafness or mild depression, to apply the concepts. Then discuss implications: why does this debate matter? Like diagnostic thresholds or resource allocation.

  The user wants a question to check understanding. Something like whether lowering the hypertension threshold is a naturalist or normativist move. If they get that it's normativist because values influence the cutoff, that shows they grasp the distinction.

  What to leave out: Mention that we're skipping metaethics and Boorse's statistical details. Clarify that naturalism can include functional norms, not just stats. Also, avoid turning it into a reading list; focus on interactive elements instead.

  Potential pitfalls: Students might conflate values with arbitrariness. Preempt this by discussing how values are part of decision-making, not that diseases are unreal. Use the hypertension example to show how both biological facts and values play roles.

  Activities: Think-pair-share during the case study, small group discussions on the second example, and a closing poll to gauge their leanings. Keep them engaged throughout.

  Finally, wrap up by emphasizing that both perspectives are valid and the debate enriches their practice. Highlight that medicine is both science and art, integrating facts and values.
answer: |-
  Here’s a focused 90-minute teaching plan designed to **make the debate visceral** for pre-clinical med students, using **dialogue-driven activities** and a **carefully scaffolded example**. The goal is to get them arguing *with each other*, not just listening to you.

  **Core Anchor Example: Age-Related Hearing Loss (Presbycusis)**
  *   **Why it works:** Biologically undeniable (hair cell degeneration), universal with aging, measurable (audiograms), but **highly context-dependent in its impact**. A retired forest ranger vs. a symphony conductor will experience identical hearing loss very differently. It’s clean (no significant moral/political baggage like homosexuality historically had, avoids obesity/hypertension complexities), familiar, and forces the question: "Is this *always* a disease? When is it not?"

  **Session Structure & Flow (90 Mins):**

  1.  **Hook: The "Obvious" Case & the Challenge (15 mins)**
      *   **(5 min) Quick Poll:** "Raise your hand if you think disease is fundamentally a biological/objective phenomenon." (Expect near-unanimous yes). "Okay, what makes something a disease? Let's brainstorm..." (Capture responses: Biological dysfunction, deviation from normal, causes harm/suffering, requires treatment, etc.).
      *   **(10 min) Introduce Anchor Case:** "Let's test those ideas. Meet two patients, both 70 years old, both have identical, measurable, progressive, bilateral sensorineural hearing loss consistent with presbycusis – a textbook 'disease'."
          *   **Patient A:** A retired librarian living alone, loves audiobooks and phone calls with grandkids. Struggling immensely, isolated, depressed. *Wants* hearing aids.
          *   **Patient B:** A renowned abstract painter who finds intense quietude essential for focus. Finds mild hearing loss *beneficial*; it filters out distracting city noise. Actively *declines* hearing aids, feels no impairment in desired life.
      *   **Think-Pair-Share (2 min think, 3 min pair, 5 min class):** "Is Patient B's hearing loss *still a disease*? Why or why not? Be ready to defend your answer." *Anticipate heated disagreement!*

  2.  **Framing the Divide: Naturalism vs. Normativism (20 mins)**
      *   **(10 min) Label the Intuitions:** Synthesize the Pair-Share. "Some of you said 'Yes, it's objectively dysfunctional biology, so it's a disease regardless of how Patient B feels.' That's the core of **Naturalism (Biostatistical Theory Lite)**." Write key points: Disease = *Biological Dysfunction* (statistical deviation from species-typical functional ability). Values? Only in applying the term, not *defining* it. (Mention Boorse, *don't* explain stats).
          *   "Others said 'No, for Patient B, it's not causing harm or unwanted impairment in *their* life/values, so it's not a disease *for them*.' That's the core of **Normativism**." Write key points: Disease = *Harmful Biological Dysfunction* (Harm is essential and value-laden). Values are baked into the *concept itself*. (Mention Wakefield's "Harmful Dysfunction," *don't* get into evolutionary claims).
      *   **(5 min) Clarify the Core Distinction:** "The crux: **Does the definition of 'disease' REQUIRE a value judgment about harm/disadvantage?** Naturalist: No, dysfunction is objective science, harm labels it as a 'problem'. Normativist: Yes, 'disease' inherently means 'bad dysfunction'."
      *   **(5 min) Preempt Misconception #1 (The Reality Fear):** "**Crucial Point:** Saying disease *concepts* involve values **DOES NOT MEAN** diseases aren't biologically real! Hypertension *really* damages vessels. Cancer *really* grows. The debate is about the *meaning of the word 'disease'* itself – does biology alone define it, or does biology + human values define it? Both sides agree biology is real!"

  3.  **Deep Dive & Implications: Why Does This Matter? (25 mins)**
      *   **(5 min) Revisit Patient B:** "Naturalist? Still a disease (dysfunction exists). Normativist? Not a disease *for Patient B* (no harm *in this context*). What should the doctor do? (Discuss: Inform, offer, respect autonomy – practical action might be similar, but *conceptualization* differs)."
      *   **(10 min) Introduce "Grey Zone" Case: Mild, Subclinical Depression.** "Patient reports low mood, anhedonia, low energy for 2 months. Meets *some* DSM criteria, but not fully. Functioning okay at a non-demanding job, no suicidal ideation. Is this a 'disease' (Major Depressive Disorder) yet?"
          *   **Small Group Discussion (5 min):** "Argue from Naturalist vs. Normativist perspectives. What evidence matters most to each side?"
          *   **Class Debrief (5 min):** Naturalists: Focus on biological markers (neurotransmitters? HPA axis?), deviation from neurotypical function? Normativists: Focus on *harm/impairment* – is it causing suffering or preventing desired life? Where is the line drawn? **Highlight:** Diagnostic thresholds (DSM criteria) inherently involve value judgments about *how much* harm/dysfunction is required – a normativist win? Or just applying the naturalist definition? (Spark the tension!).

  4.  **Tackling Misconceptions & Nuance (15 mins)**
      *   **(5 min) Preempt Misconception #2 (Arbitrariness Fear):** "**Crucial Point:** Normativism **DOES NOT MEAN** medicine is arbitrary or 'anything goes'! Values involved are often widely shared (suffering=bad, death=bad, impaired agency=bad). Biology provides *crucial constraints* – you can't normatively define a sunny day as a 'skin disease'. Values interact with complex biological reality, not override it. Decisions are reasoned, not random."
      *   **(5 min) Naturalist Nuance:** "Naturalists aren't oblivious to values! They agree values are *crucial* for deciding what to *do* about a dysfunction (treat? ignore?), for resource allocation, and for patient-centered care. Their claim is *narrower*: the core *definition* of 'disease' can be value-free biological dysfunction."
      *   **(5 min) Normativist Strength:** "Why might normativism be *more useful* clinically? It centers the patient's experience of harm and their values. It better explains why conditions enter/leave the medical sphere (e.g., homosexuality removed from DSM due to changing values about harm, not new biology). It fits the reality of 'treating' non-dysfunctional states (e.g., contraception, cosmetic surgery) based on values."

  5.  **Synthesis & Check for Understanding (10 mins)**
      *   **(5 min) The Big Question:** "A medical task force proposes **lowering the diagnostic threshold for hypertension** (e.g., from >140/90 to >130/80 mmHg). Is this decision driven more by **Naturalist** concerns (e.g., new evidence showing biological harm starts lower?) or **Normativist** concerns (e.g., a value judgment that *more* prevention of *potential* future harm is worth labeling/treating more people, even with milder elevation)? Can it be both? **Discuss.**"
          *   **Check for Understanding:** If they grasp that the *evidence of biological risk* is naturalist territory, but the *decision on where to set the threshold* inherently involves value judgments about risk tolerance, treatment burden, and population health priorities (normativist), they get it. If they say "it's just science" or "it's just politics," they missed the interaction.
      *   **(5 min) Wrap-Up & Why It Matters:** "This debate isn't academic navel-gazing. It shapes: How we define disorders (DSM revisions!), set diagnostic thresholds, prioritize research/resources, frame public health goals, and even interact with patients (is their 'problem' defined by their biology or their experience?). Medicine sits at the intersection of biology and human values – this debate helps you see that tension clearly."

  **What You Explicitly Leave Out (State This Upfront):**
  1.  **Metaethics:** "We won't dive into *where* values come from (God? society? evolution?) or how we *know* them. We're just acknowledging they *are* involved."
  2.  **Boorse's Statistical Details:** "We're using 'statistical dysfunction' as shorthand; we won't unpack the complex details of species design, reference classes, or functional hierarchies in Boorse's full theory."
  3.  **Wakefield's Evolutionary Claims:** "We're using 'harmful dysfunction,' but we won't debate whether 'dysfunction' *must* be defined by evolutionary failure or if other biological norms exist."
  4.  **Full History of the Debate:** "This is one intensive session, not a seminar. We're focusing on the core conceptual clash using key examples."

  **Key Teaching Moves Throughout:**
  *   **Use THEIR Language:** Start with "biological dysfunction," "harm," "suffering" – terms *they* offered.
  *   **Embrace the Disagreement:** Don't resolve it! Highlight the genuine tension. "Smart people disagree on this!"
  *   **Patient-Centered:** Constantly bring it back to clinical scenarios and patient experiences.
  *   **Name the Misconceptions Proactively:** Don't wait for them to arise. Address "It means diseases aren't real" and "It makes medicine arbitrary" head-on when introducing the positions.
  *   **Whiteboard is Key:** Visually map Naturalist vs. Normativist definitions, arguments, and implications side-by-side.
  *   **Pacing:** Stick strictly to timings. Prioritize discussion over your monologue. If discussion lags, cold-call based on observed earlier participation ("Patient B: Naturalist in the back row, what's your take?").

  This plan leverages their nascent clinical intuition (via the cases), forces them to confront the limitations of a purely biological definition, directly addresses their likely misconceptions, and gives them a concrete framework (Naturalism vs. Normativism) to understand why the question "Is disease value-laden?" is fundamental, not frivolous. Good luck!
