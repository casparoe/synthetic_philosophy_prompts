prompt: |-
  I've been going down a rabbit hole about conditionals lately — like, how should we even assign probabilities to "if... then..." sentences? — and I keep seeing people bring up Lewis's triviality results as this big reason why you can't just say the probability of "if A then C" equals the conditional probability of C given A. That equation sounds really natural to me: my confidence in "if I study, I'll pass" feels like it should just be my confidence that I pass, assuming I study. But apparently if you try to make that a general rule, the whole thing collapses and you end up having to say that no two claims are ever evidentially relevant to each other, which is obviously nuts. I cant quite see where the collapse comes from, though. Is it that the equation is supposed to hold for every probability assignment, including ones you get after conditionalizing on new information? Is it something about conditionals embedded in bigger sentences? Or is it a more basic assumption about conditionals expressing propositions at all?

  I'd love a step-by-step but intuitive walkthrough of one of the triviality proofs — not skipping the actual moves, but making clear which assumption is doing the work at each step. Then I'd like a map of the options afterwards: do you reject the equation outright, deny that conditionals express propositions, or try to restrict the rule so it only works in special cases? And does this problem only hit indicative conditionals, or does it carry over to subjunctive/counterfactual ones too? Please lead with the bottom line in your first sentence and then give the reasoning, with no preamble and no restating of my question.
