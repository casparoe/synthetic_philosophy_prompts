answer: |-
  The dust devils swirled through Mercy’s Bend, a ramshackle trading post clinging to the edge of the Great Salt Flats. Water was life, hauled in sweating barrels from distant springs, and traded for scavenged tech, salvaged wire, or precious seeds. Leif, his face leathery under a broad-brimmed hat, watched Tam approach his stall. Tam’s cart, pulled by a weary-looking mule, held bundles of sun-bleached cloth.

  Last season, Tam had short-weighted Leif on a bolt of wire. Leif had retaliated by watering down the barrel he’d sold Tam’s apprentice. Mistrust hung thick as the Flats’ alkali dust.

  "Cloth," Tam stated, voice flat. "Need water. Half-barrel."

  Leif eyed the cloth. Useful, but not vital. He needed wire more. "Quarter barrel," he countered, the old sting of betrayal sharpening his tone. "Cloth ain't worth more this season."

  Tam’s jaw tightened. He needed that water. His mule needed it. Defect now? Take the quarter, curse Leif, and maybe short-weight him worse next time? But what if Leif *didn’t* come next time? Bandits roamed the Flats. Springs dried up. The future was a gamble, the odds uncertain. The immediate gain of screwing Leif warred with the potential, *possible* benefit of a reliable future trade.

  "Fine," Tam spat, shoving the cloth bundle forward. A minimal cooperation, forced by need, laced with resentment. Leif measured out the water, his hand hovering near the dipstick. *Short him?* The temptation flared. But then he remembered the look on his own kid’s face when Tam’s apprentice brought back that watered-down swill. Bad water meant sickness. Sickness meant lost days scavenging. The cost of that defection had hit him later. He pushed the dipstick deep, filling the measure properly.

  Tam noticed. A flicker of surprise, quickly masked. He grunted, took his water, and left without a word. No trust, just a slightly less damaging transaction.

  The next month, Leif had a bundle of pressure-seals Tam desperately needed for his leaky condenser. Tam approached, wary. He offered wire – good wire, Leif noted. The price Tam named was fair, almost *too* fair. Leif felt the familiar itch. *Jack up the price. He needs it.* But the memory of last month’s unexpectedly full water measure surfaced. What if Tam *wasn’t* setting him up? What if this was… something else? The future stretched, uncertain. Would Tam be back? Would *he* need Tam’s cloth again? The potential long-term gain of a slightly better relationship felt nebulous, but the immediate loss of a reliable wire source if he gouged Tam felt suddenly tangible. He accepted the fair price.

  Tam blinked. Then, almost imperceptibly, he added an extra coil of thin-gauge copper wire Leif hadn’t asked for. "Spare," Tam muttered, avoiding Leif’s eye. A tiny, unspoken reciprocity.

  Nobody sat down and calculated probabilities. They didn’t talk about "iterated games." Leif started noticing Tam didn’t haggle as viciously over seed potatoes. Tam observed Leif’s scales were always level when he traded with *him*. It wasn’t friendship; it was wary pragmatism. The shadow of the future – the chance they might need each other again – was just long enough, just visible enough through the dust of uncertainty, to make the immediate temptation of cheating feel… risky.

  Then came the Skimmer raid.

  Bandits on patched-up hoverbikes descended like locusts, grabbing anything not bolted down. Panic erupted. Leif saw two bandits cornering Tam near his cart, eyeing his water barrels. The old instinct screamed: *Run! Save your own! Tam cheated you once!*

  But the memory flashed: the extra coil of wire. The full water measure. The fair price on the pressure-seals. Tam was a pain, but predictable *now*. Who knew what scavenger would take his spot? A total thief? Someone worse? The potential future loss of even this grudgingly reliable partner suddenly outweighed the immediate safety of running. With a roar born more of calculated self-preservation than courage, Leif charged the bandits, swinging a length of pipe.

  Tam, startled, saw Leif fighting *for* him. Not out of altruism, Tam knew. Leif was protecting an asset. *His* asset. Tam grabbed a wrench and joined the fray. Together, they drove the bandits off Tam’s cart, saving the water. Leif took a nasty graze on his arm. Tam’s knuckles were split.

  After the raiders fled, they stood panting, bruised, surrounded by chaos. No words of thanks were exchanged. Leif just nodded towards his stall, where his own goods lay scattered but mostly intact. Tam gave a curt nod back. Mutual self-interest, forged in fire.

  Others saw it. Mara, the seed-seller, noticed Leif and Tam started trading together more smoothly, seeming less stressed. She’d been cheated by Jed last week. Seeing Leif and Tam’s… efficiency… she hesitantly offered Jed a fair trade on some tool handles, holding her breath. Jed, surprised by the lack of haggling, and perhaps thinking of the Skimmer raid and how isolated a cheater might be next time, accepted without trying to gouge her. It felt… easier.

  Slowly, almost invisibly, a norm solidified in Mercy’s Bend. Not because anyone decreed it, or because they suddenly loved their neighbors. But because the cost of constant defection – the wasted time haggling, the bad trades, the vulnerability of being alone against threats – became palpably higher than the risk of cooperating with someone who *might*, just *might*, reciprocate. The shadow of the future, uncertain as the Flats’ weather, was nevertheless long enough to cast a faint, pragmatic light. Cooperation wasn’t born of kindness; it was cobbled together by self-interested survivors realizing, through trial and painful error, that sometimes, the best way to win tomorrow is not to steal everything today. The handshake over a barrel of water remained wary, but the scales stayed level.
