answer: |-
  Here's a committed reading arguing that Shakespeare, through *Hamlet*, offers a sophisticated *embodied performance theory* of emotional response to fiction, dissolving Radford's paradox by grounding emotion not in intellectual belief, but in involuntary physiological and psychological mechanisms triggered by representation itself. This theory anticipates modern embodied cognition and affect theories while emphasizing the crucial role of *complicity* and *performance*.

  **Dissolving the Paradox: Physiology Over Belief**

  1.  **The Player's Tears: Emotion as Embodied Reality (II.ii):**
      *   Hamlet isn't puzzled that the actor *feels* for Hecuba; he's astonished by the *physical reality and intensity* of the performance: "What's Hecuba to him, or he to Hecuba, / That he should weep for her?" The actor's body betrays him: "his whole function suiting / With forms to his conceit? and all for nothing! / For Hecuba! ... What would he do / Had he the motive and the cue for passion / That I have? ... Make mad the guilty and appal the free, / Confound the ignorant, and amaze indeed / The very faculties of eyes and ears."
      *   **Shakespeare's Theory:** The actor's emotion is genuine *as physiological response* (tears, pallor, trembling voice). It arises not from belief in Hecuba's reality, but from the *embodied act of representation*. The actor "suits the action to the word, the word to the action." He *performs* grief, and the performance *generates* real somatic effects within himself and his audience (Hamlet). This bypasses the belief requirement entirely. Emotion is a consequence of the *act of vivid imagining and representing*, made manifest through the body. It's closer to a **physiological contagion theory** than simulation or make-believe. The actor *doesn't* simulate tears; he *weeps*.

  2.  **The Mousetrap: Emotion as Involuntary Revelation & Real-World Catalyst (III.ii):**
      *   Claudius *knows* "The Murder of Gonzago" is fiction. Yet, the representation of his *own* hidden crime triggers an overwhelming, uncontrollable physiological reaction: "Give me some light. Away!" His guilt manifests physically, publicly revealing what he intellectually denies. Fiction doesn't merely evoke a feeling; it *extracts* a truth and *forces* a reaction that alters the course of events.
      *   **Shakespeare's Theory:** Fiction's power lies not just in evoking emotion, but in its ability to *ambush* the viewer through identification with the representation. Claudius isn't voluntarily engaging in make-believe; he's *confronted* with a mirror of his secret self. His response is involuntary, pre-cognitive, and deeply embodied (panic, flight). This demonstrates that fictional representations can tap into *real* latent emotions (guilt, fear, desire) and trigger genuine physiological responses *regardless* of belief in the fiction's literal reality. The emotion (guilt) exists *within Claudius*; the fiction is the catalyst that releases it, proving its reality and having tangible consequences.

  **Shakespeare vs. Modern Theories:**

  *   **Against Simulation/Pretend/Thought-Content Theories:** Shakespeare doesn't depict the Player *pretending* to weep or Claudius *imagining* guilt. He shows *actual* tears and *actual* panic. The Player's emotion isn't "quasi" (Walton); it's a real, observable somatic event *caused by* the act of performance. Claudius's guilt isn't a "thought-content" (Lamarque); it's a visceral, world-altering eruption triggered by the staged image. The *object* of the emotion (Hecuba, Gonzago) is understood as fictional, but the *feeling state* and its *physiological expression* are undeniably real.
  *   **For Embodiment & Complicity:** Shakespeare's core insight is **embodiment**. Emotion generated or triggered by fiction manifests in the body – tears, pallor, trembling, flight – and this bodily reality *is* the proof of its genuineness. Furthermore, he emphasizes **complicity**. Hamlet *uses* fiction as a weapon precisely because he understands this mechanism: "The play's the thing / Wherein I'll catch the conscience of the King." Claudius is "caught" because he *attends* the play; he becomes complicit in the act of witnessing, lowering his guard enough for the representation to ambush his hidden guilt. The audience (on stage and off) *consents* to be affected, creating the conditions for the physiological/emotional response, even while knowing it's fiction.

  **What Philosophy Misses: Performance, Ambush, and Tangible Consequence**

  Shakespeare dramatizes crucial elements often underplayed in the philosophical debate:

  1.  **The Primacy of Performance:** The *act* of performing or witnessing a vivid representation – the physicality, the voice, the gesture, the shared space – is the engine of emotion. It's not just mental content; it's embodied enactment. The Player embodies Hecuba's grief; the actors embody Gonzago's murder. This *enactment* resonates with the performer's and spectator's own embodied experiences.
  2.  **The Ambush Factor:** Fiction doesn't always work through willing suspension of disbelief. Sometimes it *strikes* us, bypassing intellectual filters, especially when it resonates with our own hidden truths or vulnerabilities (Claudius's guilt, Hamlet's stalled grief). We can be "caught" off guard by a representation, triggering involuntary, real responses we didn't consciously invite.
  3.  **Tangible Consequence:** Shakespeare shows fiction *changing the real world*. Claudius's reaction confirms his guilt to Hamlet, escalating the conflict. The Player's performance galvanizes Hamlet into action (setting up the Mousetrap). Fiction isn't an isolated emotional experience; it can be a catalyst for real decisions and actions. The tears for Hecuba fuel a revenge plot; the panic at Gonzago sets a tragedy irrevocably in motion.

  **Conclusion: Shakespeare's Embodied Performance Theory**

  Shakespeare dissolves Radford's paradox by rejecting its core premise: that genuine emotion requires belief in the literal reality of its object. Through *Hamlet*, he argues that **fiction generates genuine emotion through the embodied mechanics of performance and representation, triggering involuntary physiological and psychological responses in performers and complicit spectators.** These responses are real (tears, guilt, action) even when the *object* is known to be fictional. The emotion arises from the *act* of vivid depiction/performance and its resonance with the real experiences and vulnerabilities of the audience. This theory, centered on embodiment, complicity, ambush, and consequence, predates and enriches modern philosophical accounts, highlighting dimensions—particularly the raw, involuntary physicality of the response and fiction's power to alter reality—that pure cognitive theories often neglect. *Hamlet* isn't puzzled *by* the paradox; it *demonstrates the solution*: emotion lives in the body, and fiction, through performance, knows exactly how to make it speak.
