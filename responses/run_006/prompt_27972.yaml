answer: |-
  Here's a structured breakdown of desiderata for theories of material constitution, distinguishing settled requirements, contested commitments, and highlighting areas of tension:

  **I. Core Puzzle Cases (Non-Negotiable to Address)**
  A theory must provide coherent and consistent accounts of these foundational puzzles:
  1.  **The Statue & The Lump (Goliath/Lumpl):**
      *   **Case:** A statue (Goliath) is created from a lump of clay (Lumpl) at t1. At t2, the statue is squashed, destroying it, but the lump survives (reshaped).
      *   **Requirement:** Explain the apparent coincidence of distinct objects (statue/lump) sharing all matter and spatial location at t1, yet differing in persistence conditions (modal/temporal properties). *Why aren't they identical?*
  2.  **Tibbles the Cat:**
      *   **Case:** Tibbles is a cat; Tib is Tibbles minus its tail. If the tail is annihilated, Tibbles survives (now identical to Tib). But was Tib a distinct entity *before* tail annihilation?
      *   **Requirement:** Handle the problem of material objects and their undetached parts. Address questions of mereological essentialism, arbitrary undetached parts, and whether Tib exists prior to tail loss. *Does constitution generate too many coincident objects?*
  3.  **The Ship of Theseus:**
      *   **Case:** Ship A has its planks gradually replaced (resulting in Ship B). The original planks are reassembled (resulting in Ship C). Is Ship A identical to Ship B (persistence through gradual change) or to Ship C (original matter/arrangement)?
      *   **Requirement:** Account for persistence through part replacement and the role of form/organization vs. matter in identity over time. Handle the potential for "competitors" (B vs. C).
  4.  **Dion and Theon (with Tib):**
      *   **Case:** Dion is a person; Theon is Dion minus his left foot. If the left foot is annihilated, Dion survives (now coincident with Theon). But before annihilation, Dion and Theon are distinct, spatially coincident except for the foot's location. Crucially, *Theon seems to be a proper part of Dion*.
      *   **Requirement:** This intensifies the Tibbles case, forcing theories to confront *co-location of distinct objects* (Dion/Theon) where one *constitutively includes* the other, differing only in a small part. It challenges mereological principles and the avoidance of ubiquitous coincidence.

  **II. Essential Distinctions (Non-Negotiable to Respect)**
  A theory must respect or explicitly reject these fundamental conceptual distinctions:
  1.  **Constitution vs. Identity:**
      *   **Requirement:** The statue/lump case shows constitution cannot be identity (different persistence conditions). A theory must either uphold this distinction or provide a compelling reason why the apparent difference is illusory without violating core logic. *Consensus: Constitution ≠ Identity is virtually non-negotiable starting point.*
  2.  **Sortal vs. Non-Sortal Predication:**
      *   **Requirement:** Explain how properties are applied relative to kinds. "Is statue-shaped" (non-sortal) may apply to both statue and lump at t1, but "Is a statue" (sortal) applies only to the statue. Theories need an account of how sortals govern persistence and property ascription.
  3.  **Modal Properties vs. Temporal Properties:**
      *   **Requirement:** The statue *could not* survive being squashed (modal fragility), while the lump *can* survive being squashed (modal flexibility). At t1, they share all actual (temporal) properties. A theory must explain how coincident objects can share all actual intrinsic properties but differ modally.

  **III. Logical/Metaphysical Constraints (Largely Non-Negotiable)**
  A theory must be compatible with these bedrock principles unless it provides a revolutionary alternative framework:
  1.  **Leibniz's Law (Indiscernibility of Identicals):**
      *   **Requirement:** If x is identical to y, then *every* property of x is a property of y, and vice versa. This is the core reason constitution ≠ identity (due to modal/temporal differences). *Denying standard Leibniz's Law is widely considered a fatal cost; it's non-negotiable for mainstream theories.*
  2.  **Transitivity of Identity:**
      *   **Requirement:** If x = y and y = z, then x = z. This seems fundamental to the concept of identity. *Denying transitivity (e.g., Relative Identity theories) is a highly contested and costly move, generally considered non-negotiable outside those specific theories.*
  3.  **Reflexivity & Symmetry of Identity:**
      *   **Requirement:** x = x (Reflexivity); if x = y then y = x (Symmetry). These are constitutive of identity itself. *Non-negotiable.*
  4.  **Anti-Coincidence Principle (Contested Commitment):**
      *   **Requirement:** It is impossible for two numerically distinct objects of the same kind, or sometimes *any* two distinct material objects, to completely occupy the same space at the same time. *This is highly contested.* Some theories (e.g., standard 3D Endurantism) accept coincidence (statue/lump, Dion/Theon) to save Leibniz's Law and the distinctness intuition. Others (e.g., 4D Perdurantism, Mereological Nihilism) deny coincidence by denying distinct objects share the same spacetime region or exist at all.

  **IV. Optional Commitments (Reasonable to Set Aside)**
  Theories can reasonably reject these, often to resolve puzzles:
  1.  **Mereological Extensionality:** The principle that objects with the same parts (at a time or across time) are identical. *Often denied* to allow coincident objects (statue/lump) or temporal parts.
  2.  **Existence of Arbitrary Undetached Parts (AUPs):** The principle that for any material object and any arbitrary sub-region of its space, there exists a distinct object filling just that sub-region (e.g., Tib before tail loss). *Often denied* (e.g., by Dominant Kind theories) to avoid rampant coincidence (Tibbles/Tib, Dion/Theon).
  3.  **Absolute Persistence Conditions:** The idea that *what it is* to be a particular object (its essence) dictates strict, context-independent conditions for its persistence. *Can be relativized* (e.g., to sortals or conceptual schemes).
  4.  **Existence of Temporal Parts (Perdurantism):** The view that objects persist by having temporal parts. *This is a major contested commitment*, not a requirement. Endurantist theories deny it.

  **V. The Core Tension: Joint Unsatisfiability of Desiderata**
  **The central conflict lies between:**

  1.  **The Intuition of Distinctness** (from Statue/Lump & Dion/Theon cases): The statue and the lump seem distinct because they have different persistence conditions (one can survive squashing, one cannot).
  2.  **Leibniz's Law (Indiscernibility of Identicals):** If two things are identical, they must share *all* properties.
  3.  **The Shared Actual Properties Intuition:** At the time of coincidence (t1), the statue and the lump share *all* their actual, intrinsic, non-modal, non-historical properties (mass, shape, location, color, temperature, subatomic structure, etc.).
  4.  **The Anti-Coincidence Principle:** Distinct material objects cannot completely occupy the same space at the same time.

  **The Conflict:**

  *   (1) and (3) imply the statue and lump are distinct (they share all actual properties but differ modally/historically).
  *   (1) and (3) combined with (2) (Leibniz's Law) imply that since they are distinct and share all actual properties, the *only* properties that *can* distinguish them are modal/historical properties (like "could survive squashing").
  *   However, (4) states that such distinct, coincident objects are impossible.

  **Therefore, the set {Distinctness Intuition, Leibniz's Law, Shared Actual Properties Intuition, Anti-Coincidence Principle} is jointly unsatisfiable.** Any adequate theory *must* reject (or significantly reinterpret) at least one of these four elements.

  **How Theories Respond (Contested Solutions):**

  1.  **Accept Coincidence & Modal Differences:** Rejects **(4) Anti-Coincidence**. (e.g., Lynne Baker, Constitution Theory). *Holds:* Distinct objects (statue/lump) coincide, share all actual intrinsic properties at t, but differ in modal/historical/sortal-relative properties. *Cost:* Violates strong intuitions against coincidence; proliferation of objects (Dion/Theon).
  2.  **Deny Distinctness via Temporal Parts:** Rejects **(1) Distinctness** (as applied to objects *simpliciter*). (e.g., David Lewis, Perdurantism). *Holds:* The statue and lump are different temporal segments ("person-stages") of a single spacetime worm. They share temporal parts at t1 but are distinct temporal parts overall. "Could survive squashing" applies to different aggregates. *Cost:* Counters strong endurantist intuitions; ontological commitment to temporal parts.
  3.  **Deny Distinctness via Sortal-Relative Identity:** Rejects **(1) Distinctness** and standard **(2) Leibniz's Law**. (e.g., Peter Geach, Relative Identity). *Holds:* "x is the same statue as y" and "x is the same lump as y" express different identity relations. There is no absolute "x = y". Lumpl at t1 *is the same statue as* Goliath at t1, and *is the same lump as* Lumpl at t2, but "statue" and "lump" are not sortals under which absolute identity holds. *Cost:* Radically revises logic of identity; controversial.
  4.  **Deny Shared Actual Properties / Deny AUPs:** Mitigates **(3) Shared Actual Properties** or rejects the basis for **(1) Distinctness**. (e.g., Michael Burke, Dominant Kind; Peter van Inwagen, Nihilism). *Holds:* Only the dominant kind object (the statue) exists at t1; the lump either doesn't exist as a distinct object or only exists derivatively. Or, only living things/composites exist, so no statue/lump problem arises. *Cost:* Counterintuitive denial of existence of lumps, artifacts, or arbitrary parts; struggles with Dion/Theon on some versions.
  5.  **Reinterpret Modal Properties:** Mitigates the force of **(1) Distinctness**. (e.g., some Counterpart Theoretic approaches). *Holds:* Modal properties are not intrinsic but relational (to counterpart relations in other worlds). The statue and lump share their intrinsic properties, including their counterpart relations *under the same counterpart relation*, but we can describe them under different counterpart relations (statue-counterpart vs. lump-counterpart). *Cost:* Modal properties become less "real" or intrinsic; controversial semantics.

  **Settled vs. Contested:**

  *   **Settled:** Constitution ≠ Identity is the near-universal starting point. Leibniz's Law (standardly interpreted), Reflexivity, Symmetry, and Transitivity of Identity are non-negotiable constraints for mainstream theories. The core puzzle cases (Statue/Lump, Theseus, Tibbles, Dion/Theon) define the field and must be addressed.
  *   **Contested:** Virtually everything about the *solution* is contested:
      *   Is coincidence possible? (Yes: Baker; No: Lewis, Burke, van Inwagen).
      *   Do temporal parts exist? (Yes: Lewis; No: Baker, Burke, van Inwagen).
      *   Do arbitrary undetached parts exist? (Yes: implied by some mereologies; No: Burke, van Inwagen).
      *   Is identity absolute or relative? (Absolute: Consensus outside RI; Relative: Geach).
      *   How central are sortals? (Essential: Burke, Wiggins; Derivative: Lewis).
      *   What is the nature of modal properties? (Intrinsic: Kripke; Relational: Lewis).
      *   Which cost is most acceptable? (Proliferation, Revision of Logic, Denial of Intuited Existence, Temporal Parts).

  **Key Takeaway for Your Survey:** The heart of the debate lies in how different theories navigate the **joint unsatisfiability** of the four elements listed in the Core Tension. Highlighting this tension and showing how each major theory resolves it (by rejecting one or more elements) provides the clearest framework for understanding the landscape of material constitution theories. Emphasize that the rejection points are deeply contested, representing fundamental metaphysical choices.
