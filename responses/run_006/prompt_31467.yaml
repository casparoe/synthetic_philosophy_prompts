prompt: |-
  My friend Jen and I have been arguing for like six months about something that started with a stupid argument about life insurance. She works in actuarial science and I'm a software engineer who reads a lot of stats blogs. The argument goes like this: when someone says "the probability that you'll develop condition X is Y%," what group are they comparing you to? Every person belongs to like a million different reference classes. I'm a 34-year-old, male, non-smoker, runner, but I also have a family history of heart disease. Do you put me in "34-year-old males" or "non-smoking runners" or "people with my specific genetic markers"? Each gives a totally different number, and there's no obvious stopping point — you could always narrow the class further until it's just me, at which point the probability is either 0 or 1. Jen says there IS an objectively correct answer: you should use the narrowest reference class that still has enough data to give a reliable frequency, and that's just what good statistical practice demands. I think that's circular — "reliable" is doing all the work and it's ultimately a judgment call about what you care about. There's no fact of the matter about whether the "right" probability of me getting heart disease is 12% or 7% or 23%; it depends on which reference class you pick, and that depends on your purposes.

  We've been going back and forth and honestly we're both tired of it, so we decided to try an adversarial collaboration — write a joint document we can both sign, laying out what we agree on, exactly where we disagree, and what would change our minds. We've identified what we think are the main cruxes: (1) whether there's a principled stopping point for narrowing reference classes, (2) whether the choice of reference class is truth-apt or purely pragmatic, and (3) whether the fact that different reference classes give different probabilities means there's no single "correct" probability for a particular individual. But we're open to the idea that we've framed these wrong. Can you draft that joint statement? We want a numbered list of agreed claims first, then a table of disagreements with one row per crux. For each crux, we want to write down what kind of evidence or argument we'd both accept as bearing on it, and what each of us predicts.
reasoning: |-
  Okay, let me break this down. Jen and their friend are stuck in a six-month debate about reference classes in probability statements. The core issue is whether there's an objectively correct reference class for individual probability assessments. Jen, as an actuary, argues for using the narrowest reliable reference class, while the software engineer sees it as inherently subjective.

  Looking at their identified cruxes: (1) stopping point for narrowing classes, (2) truth-apt vs pragmatic choice, and (3) existence of single "correct" probability. These seem well-targeted at the heart of their disagreement. The adversarial collaboration approach is smart - it forces them to articulate common ground first.

  For the agreement section, I need to find propositions both would accept. They likely agree that probability statements require reference classes, that multiple classes exist for any individual, and that narrower classes often provide better estimates when data permits. The reliability/data sufficiency point seems crucial too.

  The disagreements table needs careful construction. For each crux:
  - Jen's view: Statistical practice provides objective stopping criteria (narrowest reliable class)
  - Friend's view: "Reliable" depends on context and purpose, making it subjective
  - Evidence they'd both accept: Case studies where statisticians debate reference classes, textbooks discussing reliability thresholds
  - Predictions: Jen expects professional consensus in clear cases; friend expects persistent variation based on context

  I should note that their third crux about "single correct probability" might be terminological - Jen probably agrees it's reference-class-relative but sees the narrowest reliable class as objectively best. The friend denies any objectivity in choosing between equally reliable classes.

  The draft should maintain neutral language while accurately representing both positions. Including "what would change our minds" sections will make it productive for their collaboration. Since they're tired of arguing, clarity and conciseness are key.
answer: |-
  ## Joint Statement: Reference Classes and Individual Probability Assessments

  **Parties:**  
  Jen (Actuarial Scientist) and [Your Name] (Software Engineer/Stats Enthusiast)  
  **Date:** [Insert Date]  
  **Purpose:** To clarify agreements, precisely define disagreements (cruxes), and outline potential resolutions regarding the use of reference classes for assigning probabilities to individual outcomes (e.g., "probability you'll develop condition X is Y%").

  **Section 1: Points of Agreement**

  We jointly affirm the following statements:

  1.  **Reference Class Necessity:** Probability statements about a singular future event (e.g., an individual developing a condition) inherently require comparison to a group (a reference class) for their meaning. Probability is fundamentally a property of a *class* of events or entities, not solely of a unique individual in isolation.
  2.  **Multiple Potential Classes:** Any individual simultaneously belongs to an enormous number of potential reference classes defined by different combinations of characteristics (e.g., age, sex, smoking status, family history, occupation, genetic markers, lifestyle factors).
  3.  **Variation Across Classes:** The empirically observed frequency (probability estimate) of an outcome (e.g., heart disease) will generally differ when calculated across different reference classes that the same individual belongs to.
  4.  **Data Limitations:** Estimating probabilities using very narrow reference classes (e.g., "34-year-old male non-smoking runners with a specific SNP and family history who eat exactly 5 servings of vegetables per week") faces severe practical limitations due to insufficient data, leading to unreliable (high variance, potentially biased) estimates.
  5.  **Goal of Prediction:** The practical purpose of assigning such a probability is typically to make the best possible prediction or assessment of risk *for that specific individual*, given available information.
  6.  **Reliability as a Key Factor:** When sufficient data exists, using a narrower, more homogeneous reference class that better matches the individual's known characteristics will generally provide a *better estimate* of the individual's true propensity or risk than a broader, more heterogeneous class. "Sufficient data" implies estimates with acceptable statistical properties (e.g., low variance, robustness).
  7.  **No "True Single Individual Probability":** We agree there is no knowable, pre-determined "true probability" (like a physical constant) *inherent* solely to the individual considered as a unique, isolated entity, independent of any reference class context. Probability requires a collective for its definition via frequency.

  **Section 2: Defined Cruxes of Disagreement**

  The core disagreements revolve around the interpretation and objectivity of the reference class selection process:

  | Crux # | Description of Disagreement                                                                                                     | Jen's Position (Actuarial)                                                                                                 | [Your Name]'s Position (Pragmatic)                                                                                                                                 | Evidence/Arguments Both Would Accept                                                                                                                              | Jen's Prediction                                                                                                                           | [Your Name]'s Prediction                                                                                                                                 |
  | :----- | :------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1**  | **Is there a principled, objective stopping point for narrowing the reference class?**                                          | **Yes.** The stopping point is defined by statistical reliability: use the *narrowest reference class for which sufficient data exists to produce a reliable frequency estimate*. "Sufficient" and "reliable" are defined by objective statistical criteria (e.g., confidence interval width, stability under resampling, meeting minimum sample size thresholds). This *is* the principled stopping point inherent in sound statistical practice. | **No.** While reliability *constrains* narrowing (agreeing on point #4), it doesn't provide a unique *stopping point*. "Sufficient data" thresholds involve judgment calls on acceptable risk/variance levels, and different equally reliable (by objective metrics) but non-identical classes may exist. There's no *further* objective principle dictating a single "correct" class among reliable options. | **Case studies:** Analyze documented actuarial/statistical cases where experts debated reference class choice. Do disagreements primarily hinge on *violations* of reliability thresholds, or on *choices* between different classes meeting those thresholds? **Textbooks/Standards:** Do formal statistical texts or professional standards explicitly define *the* stopping point algorithmically (beyond reliability), or focus on reliability as the key criterion? **Simulation:** Show scenarios with multiple reference classes meeting the same objective reliability criteria but yielding different probabilities. |
  | **2**  | **Is the choice of reference class fundamentally truth-apt (capable of being objectively true/false) or purely pragmatic?**      | **Truth-apt.** Given the goal of best prediction (#5), there is an objectively *best* reference class for a specific prediction purpose – the one providing the most reliable and accurate estimate given available data and known characteristics. Selecting this class is an objective exercise in applied statistics. "Purpose" defines the outcome, not the optimal class selection method. | **Purely Pragmatic.** The choice is inherently contextual and goal-dependent. Different purposes (e.g., setting broad insurance premiums vs. personalized medical advice vs. individual life planning) might validly prioritize different reference classes, even with similar reliability. There's no "best" class independent of the specific context and values influencing the *weight* given to different characteristics. | **Purpose Variation:** Examine real-world examples (e.g., insurance underwriting vs. clinical risk assessment vs. epidemiological research) for the same condition. Do practitioners consistently use the *same* narrowest reliable class, or do classes demonstrably shift based on the *application*? **Expert Testimony:** Survey professional statisticians/actuaries: "Is the single best reference class for an individual an objective fact discoverable through analysis, or a choice influenced by the context of the probability statement?" |
  | **3**  | **Does the existence of differing probabilities across valid reference classes imply there is no single "correct" probability for the individual?** | **No.** The differing probabilities reflect *imperfect information*. The "correct" probability *for predictive purposes* is the one derived from the *narrowest reliable reference class*. Other estimates are simply less accurate approximations. The individual *has* an objective propensity, best estimated this way. | **Yes.** Since multiple reference classes meeting reliability criteria exist and yield different numbers, and since there's no objective principle selecting *one* as uniquely "correct" (Crux 1,2), it follows that there is no single "correct" probability *statement* applicable to the individual. The probability *is* reference-class-relative. The best we can provide is a probability *conditional* on a chosen class. | **Philosophical Analysis:** Evaluate arguments from probability theory (e.g., frequentist vs. Bayesian interpretations, Reichenbach's reference class problem). **Prediction Accuracy:** Conduct empirical analysis: When multiple reliable classes give different probabilities, does the "narrowest reliable" class *consistently* provide the most accurate predictions at the individual level compared to alternatives? If not, what does? |

  **Section 3: What Would Change Our Minds?**

  *   **On Crux 1 (Stopping Point):**
      *   Jen would reconsider if shown widespread, fundamental disagreement among statisticians *even when applying identical, strict, quantitative reliability criteria* to select a reference class in clear-cut cases, or if shown that standards explicitly state that *among* reliable classes, choice is non-objective.
      *   [Your Name] would reconsider if shown clear, universally accepted statistical standards or theorems that *uniquely* identify a single reference class (beyond just reliability thresholds) as objectively optimal for individual prediction, demonstrably applicable across diverse contexts.
  *   **On Crux 2 (Truth-Apt):**
      *   Jen would reconsider if presented with compelling evidence that practitioners *systematically and justifiably* use different "narrowest reliable" classes for the *same individual and outcome* based purely on differing non-predictive goals (e.g., insurance cost vs. clinical urgency), and these choices cannot be reconciled under a single predictive optimality framework.
      *   [Your Name] would reconsider if shown that across diverse applications (insurance, medicine, policy), experts consistently converge on the *same* narrowest reliable reference class for a given individual/outcome when using state-of-the-art methods, indicating an underlying objective reality being targeted.
  *   **On Crux 3 (Single Correct Probability):**
      *   Jen would reconsider if rigorous empirical studies demonstrated that probabilities from different reliable reference classes were *equally predictive* at the individual level, undermining the claim that one is objectively "best".
      *   [Your Name] would reconsider if shown that probabilities derived *strictly* from the "narrowest reliable class" principle demonstrably and consistently provided significantly *more accurate* individual-level predictions or decisions than probabilities derived from other reliable classes or methods (like well-calibrated multifactorial models), across many domains.

  **Signatures:**

  Jen: _________________________
  [Your Name]: _________________________
  Date: _________________________
