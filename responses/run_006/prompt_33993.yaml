answer: |-
  Here’s a precise diagnosis of the debate’s structure, grounded in key positions from philosophical aesthetics, followed by an analysis of the impasse and potential paths forward:

  ### Core Disagreement: Competing Conceptions of Aesthetic Value
  The rift arises from fundamentally different views on what *constitutes* the aesthetic object and its value:
  1. **Formalist/Experiential View (Your Position):**  
     - **Claim:** Aesthetic value resides in *perceptible properties* and the *immediate experience* they elicit.  
     - **Key Supporters:** Clive Bell ("significant form"), early Monroe Beardsley (aesthetic experience as "unified, intense, complex"), empirical aesthetics.  
     - **Logic:** If two objects are perceptually indistinguishable, no aesthetic distinction can be justified. Provenance is extrinsic to the work itself; devaluation is sociological bias ("snobbery").  
     - **Analogy:** A perfect fake is like water vs. H₂O—chemically identical, so no functional difference.

  2. **Contextualist/Achievement View (Your Friend’s Position):**  
     - **Claim:** Aesthetic value is inseparable from the *art-historical context* and *human achievement* embodied in the work.  
     - **Key Supporters:** Denis Dutton ("authenticity in art"), Jerrold Levinson ("what is a musical work?"), Nelson Goodman (autographic/allographic arts).  
     - **Logic:** The painting isn’t just a visual array; it’s an *act* by a creator within a tradition. A forgery lacks the intentional, historical, and cultural resonance of Vermeer’s achievement.  
     - **Analogy:** A counterfeit bill may look identical but lacks legal/social validity—value is institutional.

  ### Are They Contradicting or Talking Past Each Other?
  **Partial overlap with mutual exclusion:**  
  - **Shared Premise:** Both agree that the *sensory input* is unchanged.  
  - **Contradiction:** You disagree on whether this sensory input exhausts the *aesthetic object*.  
  - **Talking Past:** You prioritize *phenomenal experience*; your friend prioritizes *causal genesis*. As Arthur Danto notes, "To see something as art requires something the eye cannot descry—an atmosphere of artistic theory."  

  ### The Stalemate Explained by Three Irreducible Fault Lines  
  1. **Ontology of the Artwork:**  
     - Formalists: The work *is* its perceptible properties.  
     - Contextualists: The work *is* a historically situated artifact (Goodman: "A forgery of a Vermeer is no more a Vermeer than a fake rabbit is a rabbit").  

  2. **Definition of "Aesthetic Property":**  
     - Formalists: Only perceptually accessible features (color, composition).  
     - Contextualists: Include "relational properties" (e.g., "being innovative for 1665," "influencing Rembrandt").  

  3. **Value Theory:**  
     - Formalists: Value derives from experiential qualities.  
     - Contextualists: Value derives from achievement and authenticity (Dutton: "Originals embody the artist’s struggle with their time").  

  ### Could Empirical Evidence Break the Impasse?  
  - **Perception Studies (e.g., Newman & Bloom 2012):** Show that knowledge of provenance alters *neural processing* and aesthetic judgment (e.g., "genuine" art activates reward centers more).  
  - **Limits:** This reveals *cognitive bias* but doesn’t resolve the normative question: *Should* it affect judgment? Formalists call this "contamination"; contextualists call it "proper appreciation."  
  - **Outcome:** Evidence might shift the debate to: "Is the provenance effect a *distortion* or *deeper engagement*?" but doesn’t settle the core dispute.  

  ### A Reframing That Might Mitigate (Not Resolve) the Conflict  
  Introduce a **tripartite distinction of value** (after Carolyn Korsmeyer):  
  - **Experiential Value:** Unchanged in the forgery (your focus).  
  - **Art-Historical Value:** Collapsed (your friend’s focus).  
  - **Symbolic Value:** Social meaning (e.g., prestige, rarity).  

  This clarifies that you’re debating *which value type is "aesthetically primary."* Contextualists argue history permeates all three; formalists isolate the experiential.  

  ### Why the Impasse Is Likely Permanent  
  The debate reflects a **fundamental schism in aesthetics** with no neutral arbiter:  
  - It echoes the "methodenstreit" between analytic (experience-focused) and continental (history-focused) traditions.  
  - Each side defends a different aspect of art’s allure: immediacy vs. depth.  
  - As Richard Wollheim observed, art’s "twofoldness" (seeing surface *and* meaning) ensures tension persists.  

  ### What This Tells Us About the Question  
  The deadlock reveals that **"aesthetic value" is a cluster concept** with irreducibly subjective and intersubjective dimensions. The painting’s devaluation isn’t *irrational* (as snobbery) nor *purely rational* (as objective truth), but a negotiation between:  
  - The perceiver’s psychology  
  - Art’s social ontology  
  - Philosophical commitments about what makes art *matter*.  

  **Conclusion:** Your hypothesis is correct—the sides answer different questions. Breaking the stalemate requires acknowledging that art’s value is *multidimensional*. The formalist and contextualist are describing distinct facets of appreciation, each valid within their frame but incomplete alone. The frustration you feel mirrors aesthetics itself: a field where answers dissolve into deeper questions about perception, meaning, and human achievement.
