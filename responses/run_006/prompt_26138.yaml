answer: |-
  Here’s a poem structured around the catuṣkoṭi, designed to enact its self-undoing within each stanza, leaving no stable ground:

  **Four Positions**

  **(I: Affirmation)**
  This *I* stands firm, a rooted stone,
  Defined by edges, sharp and known.
  My core is fixed, a steady light
  That holds the darkening world upright.
  This shape is real, this name endures,
  Beyond the surface, depth secures...
  But stone remembers water's flow,
  And names are echoes, soft and low.
  The light I claim? A borrowed spark
  That flickers, leaving only dark.

  **(II: Negation)**
  There is no center, no fixed core,
  The *I* dissolves, exists no more.
  Just shifting dust on empty air,
  No solid self to claim or wear.
  This absence blooms, a hollow peace,
  Where all insistence finds release...
  Yet listen: in the wind's soft sigh,
  A whispered *here*, a faint reply.
  The dust still gathers, form implies,
  And *absence* names itself, and lies.

  **(III: Both)**
  Say *is* and *is not*, hold the pair –
  The self both present, vanished there.
  A wave that is the sea and not,
  A knot that binds and comes unknot.
  This tension sings a truer song,
  Where seeming opposites belong...
  But watch the wave crash on the sand:
  It *was* the sea? It *wasn't* land?
  The knot pulled tight begins to fray,
  The glass is half-shattered, half whole, they say.

  **(IV: Neither)**
  Not solid ground, nor empty sky,
  Nor both together, nor the lie
  That claims escape beyond the poles.
  No perch exists for reasoned souls.
  This silence isn't peace, nor void,
  No vantage point is unalloyed...
  Even this breath, denying place,
  Leaves a warm ghost within the space.
  To say *neither* builds a nest
  Where silence stirs, denying rest.

  ---

  **How it embodies your constraints:**

  1.  **Stanza I (Affirmation):** Builds a strong image of solid self ("rooted stone," "steady light," "name endures"). Its undoing comes internally: "stone remembers water's flow" (suggesting impermanence, erosion), "names are echoes" (conventional, not essential), "borrowed spark... flickers, leaving only dark" (dependence and extinction).
  2.  **Stanza II (Negation):** Embraces dissolution ("no center," "shifts dust," "hollow peace"). Its undoing comes from the persistence of naming ("absence names itself, and lies"), the implication of form in "dust still gathers," and the faint echo of presence ("whispered *here*").
  3.  **Stanza III (Both):** Tries to hold the tension ("Say *is* and *is not*," "wave that is the sea and not"). Its undoing comes from the inherent instability of the paradoxes: the wave *was* the sea? It *wasn't* land? (highlighting the inadequacy of the terms). The "knot" frays, and the final line explicitly shatters the illusion of holding both stably ("half-shattered, half whole").
  4.  **Stanza IV (Neither):** Attempts the escape ("Not solid... nor empty... nor both... nor the lie"). Its undoing is relentless:
      *   "No perch exists" denies stability *including* this position.
      *   "This silence isn't peace, nor void" negates positive descriptions of the "neither" state.
      *   "No vantage point is unalloyed" denies pure perspective.
      *   "This breath... leaves a warm ghost" shows the lingering trace of existence/experience even in the attempt.
      *   "To say *neither* builds a nest" directly states that the assertion *creates* a new position/solidity.
      *   "Where silence stirs, denying rest" shows this fabricated position is inherently unstable and active, not a final rest. The poem ends *in motion* ("stirs"), not resolution.

  **Structural Choices:**

  *   **Rhythm & Line Breaks:**
      *   Stanza I: Mostly regular, assertive rhythms and end-stopped lines ("known," "light," "upright") build solidity, which is then interrupted by enjambment ("flow / And names") and softer sounds ("echoes, soft and low") signaling dissolution.
      *   Stanza II: Shorter phrases, more caesuras, softer sounds ("hollow peace," "wind's soft sigh") convey dissolution, but firm assertions ("no center," "exists no more") are undercut by the lingering "reply" and "lies."
      *   Stanza III: Enjambment and questions ("was? / Wasn't?") embody the tension and instability. The final line uses a jarring caesura ("half-shattered, half whole, they say") highlighting the fracture.
      *   Stanza IV: Lines stretch and compress; negative phrasing dominates. The final couplet uses enjambment ("nest / Where") and active verbs ("stirs," "denying") to ensure no static ending.
  *   **Imagery:** Uses concrete, accessible images (stone, light, dust, wave, knot, glass, breath, nest) that resonate emotionally while carrying the conceptual weight. The progression (stone -> dust -> wave/knot/glass -> breath/silence/nest) moves from solidity to dissolution to paradox to evanescence.
  *   **Language:** Avoids explicit terminology. Concepts like *svabhāva* (essence) and *śūnyatā* (emptiness) are evoked through "rooted stone," "core," "fixed," "dissolves," "empty air," "hollow peace," "no perch." The tetralemma structure itself *is* the vocabulary.

  The poem aims to lead the reader through each position, feel its momentary plausibility, and experience its internal collapse *within* the stanza, culminating in the fourth stanza's failure to provide an escape, leaving only the unsettling "stir" of conceptual exhaustion.
