prompt: |-
  ok so my diss chapter is on interpersonal comparability and i have been going in circles. the specific thing i'm stuck on is: before i can assess whether the happiness-index people or the preference-satisfaction people or the capability people or the neuroscience-of-valence people have a viable account, i need to know what the account is even supposed to accomplish. and the literature is weird about this—everyone has their own implicit standard and then they ding other views for failing criteria that were never made explicit.

  so: write me the desiderata. what does a theory of interpersonal utility comparisons need to deliver to count as adequate? don't just say "it has to make comparisons possible"—i want the actual requirements. for each, give me the consideration or case that makes it a requirement, and tell me whether it's a hard constraint or more of a camp-specific desideratum (ordinalists vs. cardinalists, preference people vs. hedonic people, etc.).

  stuff i'm especially stuck on: does an adequate theory need to recover the intuitive interpersonal comparisons people actually make in everyday life (like "she's suffering more than he is"), or is it allowed to revise those? does it need to ground comparisons in something publicly observable, or is first-person report enough? does it need to specify a neutral level—a zero point—or can it just give ratios and differences without one? and what about cross-species comparisons or comparisons involving people with very different cognitive architectures—is that a requirement or a nice-to-have?

  i also suspect there are tensions. like, if you want full interpersonal comparability and also want to respect that different people have fundamentally different evaluative perspectives, those might pull in opposite directions. or: the ordinal revolution seemed to show you can't get cardinally out of purely ordinal preference data, so if you require consistency with revealed preference you might be stuck. if there are joint-unsatisfiability results, or at least serious tension pairs, flag them—thats the part i most need to see.

  lastly: which single desideratum does the most work in ruling out approaches? if i had to pick one criterion as my litmus test that separates the views with a shot from the dead ones, what is it?
