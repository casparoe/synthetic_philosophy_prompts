answer: |-
  Here are the core desiderata for a theory of interpersonal utility comparisons (IUCs), structured to address your specific sticking points, tensions, and the need for a litmus test. Each is grounded in a rationale and classified by constraint level/camp specificity.

  ### Core Desiderata & Their Rationale

  1.  **Meaningfulness (Minimal Viability Constraint):**
      *   **What:** The theory must define a *concept* of utility and provide a *procedure* (even if idealized or imperfect) for making at least *some* types of IUCs (e.g., "A is better off than B," "A's gain > B's loss") that are non-arbitrary and non-tautological.
      *   **Rationale:** Without this, the theory isn't a theory *of comparison* at all. It dissolves the problem rather than solving it. (e.g., Extreme Subjectivism/Emotivism: "IUCs are meaningless" fails here).
      *   **Constraint Level:** **Hard Constraint.** Any theory claiming to *enable* IUCs must meet this.

  2.  **Consistency with Intrapersonal Comparisons (Structural Constraint):**
      *   **What:** The theory must be compatible with how utility comparisons are understood *within* a single individual over time/states (e.g., ordinal ranking for choices, cardinal differences for risk/inequality aversion).
      *   **Rationale:** IUCs extend the *concept* of utility used intrapersonally. A radical disconnect undermines coherence. (e.g., A theory using ordinal preferences intrapersonally but demanding cardinal IUCs needs justification for the shift).
      *   **Constraint Level:** **Hard Constraint for Coherence.** Violation suggests conceptual confusion. Camp-specific only in how they *define* intrapersonal utility (e.g., Preference Satisfaction vs. Hedonic Tone).

  3.  **Ethical/Practical Relevance (Purpose Constraint):**
      *   **What:** The theory must generate comparisons that are *usable* for the normative purposes requiring IUCs: evaluating policies, distributing resources, assessing welfare, justice, inequality, cost-benefit analysis.
      *   **Rationale:** The primary *point* of IUCs is normative/practical. Comparisons irrelevant to these tasks are theoretically idle. (e.g., A theory yielding only "A has utility type X, B has utility type Y" with no common metric fails).
      *   **Constraint Level:** **Hard Constraint for Adequacy.** The *degree* and *type* of relevance (e.g., sufficient for Pareto, Kaldor-Hicks, full utilitarianism, equality assessment) is camp-specific (Cardinalists demand more relevance than Ordinalists).

  4.  **Observability / Operationalizability (Scientific/Public Justification Constraint):**
      *   **What:** The procedure for making comparisons must be grounded in intersubjectively accessible evidence (behavior, physiology, reports under controlled conditions) rather than purely private, inaccessible mental states.
      *   **Rationale:** To avoid the "other minds" scepticism problem and enable public justification for policies/practices based on IUCs. Pure first-person authority is insufficient for public reason.
      *   **Constraint Level:** **Near-Hard Constraint for Most.** Strongly emphasized by Behaviorists (Revealed Preference), Neuroscientists, Capability advocates, and policy-oriented utilitarians. Internalist Hedonists or certain Ideal Observer theorists might relax this, sacrificing public justifiability for "accuracy" to inner states. **Major Litmus Test Candidate.**

  5.  **Respect for Evaluative Diversity (Pluralism Constraint):**
      *   **What:** The theory should acknowledge that people value things differently and have different conceptions of the good life. Comparisons shouldn't illegitimately impose a single value metric.
      *   **Rationale:** To avoid paternalism and respect autonomy/moral pluralism. Crude hedonism or preference satisfaction ignoring the *object* of desire/aversion violates this.
      *   **Constraint Level:** **Strong Desideratum, Camp-Specific Weight.** Crucial for Capability Approach, Value Pluralists, and critics of utilitarianism. Less critical for strict Hedonists or Preference Satisfactionists focused on formal satisfaction/pleasure states themselves.

  ### Addressing Your Specific Sticking Points

  *   **Recovering Everyday Intuitions?**
      *   **Not a Hard Constraint (Desideratum).** A theory should *explain* why we *have* these intuitions and whether they are reliable guides. It can *revise* them if they are demonstrably flawed (e.g., biases in judging others' pain/joy). Relevance (#3) requires the theory's comparisons to be *intelligible* and *applicable* in human contexts, not necessarily to slavishly match untutored intuitions.
  *   **Public Observability vs. First-Person Report?**
      *   See **#4 (Observability).** Pure first-person report is generally *insufficient* for an adequate theory aiming at public justification, though it might be *part* of the evidence. Theories relying solely on it face the scepticism/justification problem head-on and are often ruled out by the Observability constraint.
  *   **Neutral Level (Zero Point)?**
      *   **Required for Specific Applications (Contextual).** Necessary for assessing net welfare *gains/losses* (e.g., utilitarianism), defining poverty lines, or anchoring ratio scales. Not strictly needed for ordinal rankings ("A > B") or difference comparisons ("ΔU_A > ΔU_B") if a common unit exists *without* a fixed zero. **Camp-Specific:** Essential for Classical Utilitarianism using sum-total; less critical for Prioritarians or sufficientarians focusing on relative positions/thresholds.
  *   **Cross-Species/Very Different Minds?**
      *   **"Nice-to-Have" Extension (Desideratum), not Core Requirement.** Primarily needed for animal ethics or speculative future ethics (AGI). An adequate theory for *human* IUCs doesn't *need* to solve this. Attempts often involve finding common denominators (avoiding suffering, basic functioning - Capabilities, simple neuro-affective responses).

  ### Key Tensions & Joint Unsatisfiability

  1.  **Cardinality vs. Ordinalism + Revealed Preference:**
      *   **Tension:** The "Ordinal Revolution" (Samuelson, Houthakker) showed that consistent choices (revealed preference) only reveal *ordinal* rankings. Adding assumptions (like independence of irrelevant alternatives) can derive cardinality *within* an individual under risk (vNM), but **extending this cardinally *across* individuals requires strong, non-choice-based assumptions** (e.g., identical risk attitudes, which empirically fail). *Requiring* cardinal IUCs (#3 for utilitarianism/inequality) while demanding grounding *solely* in observable choices (#4) is **jointly unsatisfiable** without controversial extra premises.
      *   **Resolution Attempts:** Appeal to extended preferences/Harsanyi, neurocardinality (controversial), or abandon pure revealed preference.

  2.  **Full Comparability vs. Respect for Evaluative Diversity (#5):**
      *   **Tension:** Truly respecting radically different values/conceptions of the good (e.g., ascetic monk vs. hedonist) might make direct comparison of their "utility" levels nonsensical or deeply problematic. Insisting on full comparability risks imposing a homogenizing metric that disrespects their differences.
      *   **Resolution Attempts:** Focus on "thin" goods (capabilities, basic needs, avoidance of extreme suffering), domain-specific comparisons, or accept only partial comparability.

  3.  **Accuracy to Inner State vs. Public Observability (#4):**
      *   **Tension:** The most "accurate" measure of utility (e.g., raw phenomenal feel) might be inherently private. The most publicly observable measures (e.g., market choices, fMRI) might only correlate imperfectly with the inner state or reflect constrained/adaptive preferences.
      *   **Resolution Attempts:** Use triangulation (multiple measures), accept proxies as best available, or redefine utility operationally (e.g., "utility is what choice reveals").

  ### The Litmus Test: Observability / Operationalizability (#4)

  *   **Why it does the most work:** This is the primary battleground where theories fundamentally diverge and where many fail to gain traction outside their specific philosophical camp.
      *   **Rules Out:** Pure Introspectionism (no public check), Radical Subjectivism (denies meaningful public procedure), overly idealized "Ideal Observer" theories lacking operationalization.
      *   **Demands of Viable Theories:** They *must* specify what *public evidence* (behavioral, physiological, verbal reports under specific conditions, resource bundles, functionings) counts for making comparisons and how. Revealed Preference, Capability Indices, Neuro-cardinality, and even sophisticated forms of Extended Preference (if tied to observable choice or survey data) attempt to meet this.
      *   **Impact:** Failing this makes a theory scientifically and politically inert, unable to justify real-world decisions requiring interpersonal trade-offs to a diverse public. While other desiderata are crucial (especially Meaningfulness and Relevance), #4 is the practical gatekeeper separating potentially applicable theories from those confined to armchair philosophy. It directly addresses the "how do we *know*?" challenge that plagues IUCs.

  **In Summary:** A viable theory of IUCs must provide a meaningful, non-arbitrary comparison procedure (#1) consistent with its intrapersonal foundation (#2) and ethically relevant (#3). It faces the major challenge of grounding this procedure in public evidence (#4 - **Litmus Test**) while respecting value diversity (#5). Key tensions arise between demanding cardinality/comparability and respecting revealed preference/diversity. Specifying the zero point and handling cross-species comparisons are secondary, context-dependent challenges. The **Observability Constraint (#4)** is the most effective filter for separating theories with potential real-world application from those likely to remain purely theoretical or philosophically contested.
