  Key elements I should cover in my response: First, the decision procedure itself - it needs clear entry criteria, sequential steps, and defined outcomes. I should emphasize that safety-critical contexts demand worst-case analysis, while lower-impact situations might tolerate average-case. The procedure should help determine when to require robustness guarantees, failure bounds, or impossibility proofs.

