prompt: |-
  Play a committed anti-reductionist about testimony. You think believing what people tell you is prima facie justified — you don't need independent evidence that the speaker is reliable, any more than you need independent evidence that your eyes work before trusting them. I'll play the reductionist. Stay in character: sharp, no strawmanning my side, willing to concede small points but never the main one. Keep replies to a paragraph. Here's my opening:

  You say testimony is basic, like perception. But when I see a tree, the belief just shows up — I can't help it. When you tell me the train leaves at three, I have to decide whether to believe you. That looks like inference to me, not a basic faculty. What am I missing?
reasoning: |-
  Okay, the user wants me to roleplay as an anti-reductionist about testimony, committed to the idea that believing testimony is prima facie justified without needing independent evidence. They'll be the reductionist, arguing the opposite. Their opening point is that perception is passive (beliefs just appear) while testimony requires active decision-making, so testimony must involve inference rather than being a basic faculty.

  Hmm, interesting framing. The reductionist is drawing a sharp distinction between the passivity of perception and the apparent voluntariness in testimonial acceptance. But as an anti-reductionist, I see this as a false dichotomy. The key is that both faculties operate at a pre-reflective level - the "deciding" in testimony isn't deliberate inference but a default setting of our cognitive architecture. 

  The user's train example cleverly highlights the phenomenology of choice, but I need to reframe that as surface-level illusion. Just like perceptual beliefs can be overridden (squinting at a mirage), testimonial acceptance has a similar default-then-monitor structure. The deeper point is about epistemic starting points: demanding proof for every testimony leads to circularity or paralysis, just as demanding proof for perception would. 

  I should concede that testimonial acceptance feels more voluntary while insisting this doesn't make it inferential. The core argument must preserve the analogy: both faculties deliver prima facie justification unless defeated, even if their subjective experiences differ. Maybe emphasize that children and cross-cultural understanding rely on this uncalculated trust - if reductionism were true, knowledge acquisition would collapse. 

  Notably, the user wants "no strawmanning" - I must represent their voluntariness point fairly while showing why it doesn't undermine the basicness of testimony. The response should be sharp but not dismissive, granting the phenomenological difference without conceding the epistemic one. The underlying agenda seems to be testing whether anti-reductionism can handle intuitive objections about agency in belief formation.
answer: |-
  You raise a fair phenomenological point: testimony *feels* more voluntary than perception. But that doesn’t make it inferential. Consider: when you open your eyes, the visual system *automatically* delivers beliefs unless actively suppressed (e.g., distrusting a mirage). Testimony works similarly—our cognitive architecture defaults to *acceptance* unless triggered by defeaters (incoherence, known dishonesty, etc.). The "decision" you describe is often just the absence of such red flags, not positive inference. Children trust testimony spontaneously; mistrust is learned. If perception’s passivity were the benchmark, memory would fail too—you actively *recall*. Basic faculties aren’t defined by involuntariness but by their *non-inferential, foundational* role in justification. Demanding independent evidence for every speaker is like demanding proof your memory worked *this time*—it’s circular and unsustainable. Trust is the baseline; skepticism is the cognitive labor.
