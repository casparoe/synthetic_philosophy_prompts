prompt: |-
  I run a small landscaping business and buy and sell used compact equipment — skid steers, mini excavators, that kind of thing — maybe four or five machines a year, each one eight to thirty grand, so a bad buy hurts for a whole season. I've been reading about markets on my own, and the idea that stuck with me is the no-trade stuff: if a seller is willing to sell me a machine at a price I think is good, their willingness to sell at that price is itself information, and I should treat it as evidence about the machine, not just background noise. I get the logic in the abstract but I don't know how to run it on a Tuesday morning when a contractor texts me about a Bobcat he's letting go cheap.

  Please write me a reusable decision procedure for whether to go through with a used-equipment purchase, grounded in that no-trade idea and whatever else about how markets do and don't aggregate information actually bears on it. It should be something I can run in about an hour, without an economist, and my wife signs off on anything over ten thousand so the reasoning has to be legible to her too. Don't spend the whole thing re-explaining the no-trade theorem, I've read enough of that; I need the checklist, with the hard cases. Include: the questions to ask in order, what counts as a sufficent answer to each, where the procedure says walk away, and where it stops being a fact question and becomes a judgment call about risk or need. Then run the procedure on three cases: (1) a contractor selling a 2018 skid steer because he says he's downsizing, (2) a machine at an auction where I can't talk to the seller at all, and (3) a mechanic friend offering me his personal truck at what looks like a great price. At least one of the worked examples should give me an answer I won't like, and I want you to be straight about where this procedure would make me pass up good deals or where it just can't settle the question.
reasoning: |-
  Okay, the user runs a small landscaping business and deals with buying and selling used compact equipment like skid steers and mini excavators. They mentioned purchasing about four to five machines a year, each costing between $8,000 to $30,000. Since a bad buy can hurt their entire season, they need a reliable decision-making process. 

  They've read about the no-trade theorem and understand the basic idea: if a seller is willing to sell at a certain price, that's information about the machine's condition. But they're struggling to apply this in real-life situations, like when a contractor texts them about a cheap Bobcat on a Tuesday morning. They want a reusable checklist that's practical, takes about an hour, and is understandable to their wife, who approves purchases over $10,000.

  The user explicitly asked not to re-explain the no-trade theorem, so I should focus on creating a step-by-step procedure. The checklist needs to include questions to ask, what sufficient answers look like, when to walk away, and where judgment calls come in. They also want three worked examples: one with a contractor downsizing, an auction scenario, and a mechanic friend offering a truck. At least one example should have an unfavorable outcome, and I need to be honest about limitations.

  First, I need to structure the decision procedure. Breaking it down into phases makes sense: Pre-Contact Research, Contact & Interrogation, Inspection & Documentation, and Judgment & Decision. Each phase should have specific questions or tasks. For instance, in Pre-Contact Research, determining market value and common failure points is crucial. 

  For the Contact & Interrogation phase, questions about the seller's reason for selling are key. According to the no-trade theorem, if the price seems too good, there might be hidden issues. The seller's story needs to be plausible. For example, if a contractor says they're downsizing, that's a common reason, but I need to check if it adds up. 

  Inspection is non-negotiable. The user must inspect the machine themselves or have a trusted mechanic do it. Documentation like maintenance records can help, but their absence isn't always a red flag—it depends on the seller type. Auction scenarios are tricky since direct interrogation isn't possible, so relying on inspection and public records becomes even more critical.

  The judgment phase involves combining all gathered information. Here, the "no-trade alarm" is vital: if the price is below market without a clear, verifiable reason, it's a red flag. The user must decide if the risk is worth it, considering their business needs and risk tolerance. 

  For the worked examples, the contractor downsizing seems straightforward but might hide issues. The auction example is problematic because of limited information, leading to a pass recommendation. The mechanic friend scenario might seem safe, but personal relationships can cloud judgment, and the no-trade alarm might still ring if the deal is too good. 

  I should highlight where the procedure has limitations. For instance, in auctions, the lack of seller interaction means missing out on some deals, but it's necessary to avoid lemons. Also, passing on a good deal from a friend might strain relationships, but the user's business comes first. Transparency about these trade-offs is essential.

  The user's deeper needs include avoiding financial loss, ensuring business continuity, and making decisions that are defensible to their wife. The checklist must be practical, not theoretical. Emphasizing concrete steps and real-life examples will make it actionable. Also, acknowledging that some judgment calls are inevitable helps manage expectations.
