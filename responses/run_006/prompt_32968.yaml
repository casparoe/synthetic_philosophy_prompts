  Here's a battle-tested decision procedure grounded in information asymmetry and market realities, designed for a Tuesday morning field decision. It focuses on **extracting and evaluating the seller's "why"** as critical data, not just noise.

  **The Compact Equipment Purchase Protocol (CEPP)**

  **Phase 0: Pre-Contact Research (Do This Regularly, Not Per Deal)**
  1.  **Know Your Market Value:** Establish a *realistic* current market value range (Low, Fair, High) for the specific make/model/year/hours machine *before* you see a listing. Use multiple sources (Auction results, dealer used listings, Equipment Trader, industry forums). *Update monthly.*
  2.  **Know Failure Points:** Research common expensive failures for that specific machine model (e.g., "2018 Bobcat S770 common hydraulic pump issues after 2500 hrs," "Kubota U55-5 undercarriage wear costs").

  **Phase 1: Contact & Interrogation (The "No-Trade" Core)**
  *   **Primary Goal:** **Uncover the Seller's True Motivation & Knowledge.** Why is *this* machine available at *this* price *now*?
  *   **Key Questions & What "Sufficient" Looks Like:**
      1.  **"Why are you selling this machine?"**
          *   *Red Flags:* Vague ("Just time," "Moving on"), Contradictory, "Too good to pass up" deals without clear *external* reason.
          *   *Green Flags (Plausible & Verifiable):* Downsizing/retirement (ask details), Fleet upgrade (ask what they bought), Business closure (ask why), *Relocation* (costly to move), *Specific project ended* (no long-term need). **Crucial:** Does the reason *explain* the price? Downsizing *might* explain a *fair* price, but not usually a *steal*.
      2.  **"How long have you owned it? How did you use it?"**
          *   *Red Flags:* Short ownership (<1 yr), Vague usage ("Various jobs"), Usage inconsistent with machine type (e.g., mini ex used primarily for heavy demo).
          *   *Green Flags:* Long ownership (3+ yrs), Specific, plausible usage matching machine type (e.g., skid steer for landscape bed maintenance, mini ex for trenching utilities).
      3.  **"What known issues or recent repairs does it have?" (Probe Deeply)**
          *   *Red Flags:* "None," "Runs perfect," Dismissive answers. *All* used machines have quirks.
          *   *Green Flags:* Specific, detailed answers matching your failure point research ("Had the hydraulic couplers replaced last fall," "Track tension adjusted 50 hrs ago," "Lights flicker sometimes in cold weather"). Honesty about minor issues builds trust.
      4.  **"Do you have full maintenance and repair records?"**
          *   *Red Flags:* "Lost them," "Did it myself, no logs," Partial records for only recent work.
          *   *Green Flags:* Complete, organized records (oil/filter changes, fluid analyses, major repairs) showing consistent care. *(Note: Still verify!)*
      5.  **"Who did the maintenance? Who did major repairs?"**
          *   *Red Flags:* "Me and my guys" (unless they *are* certified mechanics), Unknown shops, Refusal to name shops.
          *   *Green Flags:* Reputable dealers, known independent shops specializing in that brand. Allows verification.
      6.  **"Is there anything else I should know before coming to look at it?"**
          *   *Red Flags:* Hesitation, "No," Changing the subject.
          *   *Green Flags:* Disclosing known minor cosmetic issues, quirks, or recent observations ("Starter was a bit slow yesterday morning when it was cold").
  *   **WALK AWAY TRIGGER (Phase 1):** If the seller's motivation is implausible, contradicts itself, or fails to explain a "too good" price **OR** if answers to usage/ownership are highly suspicious **OR** if they refuse to acknowledge *any* issues or provide *any* detail on maintenance.

  **Phase 2: Inspection & Documentation (Trust, but Verify)**
  *   **Non-Negotiable:** **You or YOUR trusted mechanic MUST inspect it physically.** Budget the hour.
  *   **Key Actions:**
      *   **Start Cold:** See how it starts from dead cold. Listen for hard starts, smoke, odd noises.
      *   **Operate Under Load:** Drive it, lift/lower, dig/trench (if possible). Does it perform as expected? Listen for whines, groans, hesitation. Check for leaks *after* operation.
      *   **Fluids & Filters:** Check oil, coolant, hydraulic fluid levels *and* condition (color, smell, contamination). Look at filter dates/brands.
      *   **Wear Points:** Measure track/undercarriage wear % (critical for minis/ex), tire tread/life, bucket/attachment wear, pins/bushings. Compare to your research.
      *   **Hour Meter Verification:** Does it seem plausible given wear and the story? (e.g., 1500 hrs machine shouldn't have 80% undercarriage wear).
      *   **Match to Story:** Does the physical condition *match* the seller's description and claimed usage? Does it *match* the records provided?
      *   **Document:** Take extensive photos/videos, especially of serial numbers, hour meter, wear points, fluid checks, any damage.
