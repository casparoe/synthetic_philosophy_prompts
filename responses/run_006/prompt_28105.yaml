prompt: |-
  Before I commit to any particular theory of cultural evolution—whether meme-based, dual-inheritance, cultural attractor, or something else—I want to know what the theory is supposed to do. Please write the desiderata: what any adequate Darwinian theory of culture must be able to deliver—the phenomena it must explain, the cases it must get right, the distinctions it must respect, and the empirical results it must be consistent with. For each requirement, give the consideration that motivates treating it as a requirement, and say whether it is non-negotiable or merely a preference of one research program.

  I have several specific concerns I would like you to address in the course of the list:

  1. The replicator problem. Some argue that a Darwinian theory of culture needs a cultural analogue of the gene—a faithfully replicating unit of transmission. Others argue that cultural transmission is too high-fidelity to be mere contagion but too low-fidelity to support replicator-based selection, and that the demand for a replicator is itself a mistake imported from gene-centric biology. Is the existence of a cultural replicator a genuine desideratum, or is it a prejudice? If it is a desideratum, what constraints must such a unit satisfy?

  2. The Lamarckian challenge. Cultural evolution appears to involve the inheritance of acquired characteristics: intentional innovation, directed variation, and horizontal transmission of traits within a single generation. A theory must either show that these features are compatible with a Darwinian framework or explain why Darwinian thinking remains useful despite them. What exactly is the requirement here, and is it non-negotiable?

  3. The adaptationism question. In biology, not every trait is an adaptation, and there are well-developed methods for distinguishing adaptation from drift, constraint, and byproduct. What is the parallel requirement for cultural evolution? Must a theory provide criteria for determining when a cultural trait counts as an adaptation rather than, say, a frequency-dependent equilibrium or an epiphenomenon of individual learning biases?

  4. Cumulative culture. One of the central explanatory targets is cumulative cultural evolution—the ratchet effect by which cultural traditions accrue complexity and functionality over generations without any single individual designing the outcome. What exactly must a theory explain about this phenomenon, and what would count as having explained it adequately?

  5. Micro-macro mapping. A theory must connect individual-level psychological mechanisms (conformist bias, prestige bias, content biases) to population-level patterns (traditions, fads, institutions). What form must this connection take? Is it enough to show that certain biases could produce certain patterns under some parameter values, or must the theory make quantitative predictions?

  6. The relationship to biological evolution. Must a theory of cultural evolution be consistent with the fact that the capacities for culture themselves evolved biologically? If so, what does consistency demand—merely not contradicting known facts about human cognitive evolution, or something stronger like integrated gene-culture coevolutionary dynamics?

  I would also like to know: which pair of desiderata are hardest to satisfy jointly? And which single requirement, if you had to pick one, does the most to exclude the largest number of candidate theories?

  A brief scorecard for the main frameworks (memetics, dual-inheritance theory, cultural attractor theory, cultural epidemiology) is welcome but secondary; the criteria themselves and their motivation are what I need.

  Finally, please indicate how confident you are in the overall list and single out the point you are least sure about.
reasoning: |-
  Okay, the user is asking for a comprehensive set of desiderata for a Darwinian theory of cultural evolution. They've outlined six specific concerns that need to be addressed within this framework. This is a complex request that requires careful consideration of multiple theoretical perspectives in cultural evolution.

  The user seems to be a scholar or researcher in this field, given their sophisticated understanding of concepts like replicator dynamics and Lamarckian challenges. They want to evaluate theories systematically before committing to one. Their deep concerns suggest they've encountered conflicting claims in the literature.

  For the replicator problem, I need to acknowledge both sides: some theorists insist on discrete units while others argue for a looser inheritance model. The key is whether the theory can track cultural change without requiring perfect replication. High-fidelity transmission matters more than particulate units.

  The Lamarckian challenge requires distinguishing between mechanisms and outcomes. Cultural evolution appears Lamarckian due to innovation and horizontal transmission, but the Darwinian framework still applies at the selection level. The key requirement is explaining how selection operates despite these features.

  On adaptationism, I should emphasize that cultural evolution theories must avoid naive adaptationist assumptions. They need tools to distinguish genuine adaptations from byproducts of cognitive biases or frequency-dependent effects, much like biology has methods to identify spandrels.

  For cumulative culture, the core requirement is explaining the ratchet effect - how innovations are preserved and built upon across generations. Any theory must account for the mechanisms preventing loss of complexity.

  The micro-macro mapping is crucial. Theories must connect psychological mechanisms to population-level patterns through formal models, ideally with quantitative predictions. Agent-based modeling seems essential here.

  Regarding biological evolution, consistency is non-negotiable. The theory must acknowledge that cultural capacities evolved biologically, though full integration of gene-culture coevolution may be aspirational.

  The hardest trade-off is between psychological realism and mathematical tractability. Accounting for human cognition in detail makes modeling difficult, while simple models risk being unrealistic. The most exclusionary requirement is probably the need to explain cumulative culture without invoking group selection unless necessary.

  I'm least confident about specifying precisely how "faithful enough" transmission should be defined for the replicator criterion. This remains contentious in the field. The scorecard comparison should be brief but highlight how each major framework handles these desiderata.
answer: |-
  Below is a comprehensive set of desiderata for an adequate Darwinian theory of cultural evolution, addressing your specific concerns and motivations. Desiderata are categorized as **Non-Negotiable** (essential for any Darwinian framework) or **Preference** (valuable but framework-dependent). Each requirement includes its motivation and status.

  ---

  ### **Core Desiderata for a Darwinian Theory of Cultural Evolution**

  1. **Explain Variation, Inheritance, and Differential Selection**  
     - **Motivation**: Darwinian processes minimally require (a) variation in traits, (b) inheritance (transmission) of traits, and (c) differential selection of traits based on fitness consequences. Without these, the theory ceases to be Darwinian.  
     - **Status**: **Non-Negotiable**.  
     - *Addresses Lamarckian Challenge*: Intentional innovation/horizontal transmission are *sources* of variation/inheritance but do not invalidate selection. The theory must show how selection operates *despite* these mechanisms.

  2. **Account for Cumulative Cultural Evolution**  
     - **Motivation**: Human culture exhibits a "ratchet effect" (e.g., tool complexity, institutional rules) where improvements persist and compound. A theory must explain:  
       - *Persistence*: Why innovations are retained across generations.  
       - *Modifiability*: How traits are refined incrementally.  
       - *Complexity*: Why some traditions exceed individual cognitive capacity.  
     - **Status**: **Non-Negotiable** (central explanatory target).  
     - *Clarification*: Adequate explanation requires identifying mechanisms preventing loss of information (e.g., high-fidelity transmission, scaffolding).

  3. **Respect the "Replicator Problem" Constraints**  
     - **Requirement**: The theory need not posit *perfect* replicators (like genes), but must specify units of transmission with *sufficient fidelity* to support cumulative selection.  
     - **Motivation**: Low-fidelity transmission (e.g., random copying) cannot explain cumulative culture; high-fidelity replication permits selection.  
     - **Constraints**: Units must be:  
       - *Identifiable*: Operationalized for empirical study.  
       - *Heritable*: Statistically detectable parent-offspring similarity.  
       - *Selectable*: Differential survival based on functional properties.  
     - **Status**: **Non-Negotiable** for Darwinian theories.  
     - *Your Concern*: Demanding *atomic* replicators (e.g., "memes") is a **prejudice**; fidelity is the real requirement. Transmission can be reconstructive (e.g., attractors) if statistically faithful.

  4. **Avoid Naive Adaptationism**  
     - **Requirement**: Provide criteria to distinguish:  
       - Cultural adaptations (traits optimized by selection).  
       - Byproducts of cognitive biases (e.g., content biases).  
       - Drift/neutral evolution (e.g., fads).  
       - Exaptations (co-opted traits).  
     - **Motivation**: Not all cultural traits are functional; misidentification leads to teleological errors. Parallels biology’s "adaptationism debate."  
     - **Status**: **Non-Negotiable**. Must offer falsifiable methods (e.g., phylogenetic tests, agent-based models).

  5. **Integrate Micro-Macro Dynamics**  
     - **Requirement**: Mechanistically link:  
       - *Micro*: Psychological processes (e.g., biased social learning).  
       - *Macro*: Population patterns (e.g., stable traditions, rapid fads).  
     - **Motivation**: Population-level phenomena emerge from individual actions; theories ignoring this are explanatorily hollow.  
     - **Form**: Must show *how* biases scale to patterns (e.g., via mathematical models/ABMs). Quantitative predictions are a **preference**; mechanistic plausibility is **non-negotiable**.  

  6. **Consistency with Biological Evolution**  
     - **Requirement**: Acknowledge that cultural transmission capacities (e.g., imitation, language) evolved via biological selection.  
     - **Motivation**: Capacities for culture are biological adaptations; contradictions undermine consilience.  
     - **Demand**: **Non-Negotiable** to avoid contradicting cognitive evolution. Integrated gene-culture coevolution (e.g., lactase persistence) is a **preference** for depth.  

  7. **Explain Directionality without Teleology**  
     - **Requirement**: Account for trends (e.g., efficiency, complexity) without invoking goal-directedness.  
     - **Motivation**: Darwinism explains apparent "progress" via selection, not foresight.  
     - **Status**: **Non-Negotiable**.  

  ---

  ### **Addressing Your Specific Concerns**
  1. **Replicator Problem**:  
     - Fidelity is **non-negotiable**; replicator *ontology* is a **preference**. Units must satisfy identifiability/heritability/selectability.  

  2. **Lamarckian Challenge**:  
     - Darwinism is compatible with acquired trait inheritance if selection operates *post*-transmission. Requirement: **Non-negotiable** compatibility.  

  3. **Adaptationism**:  
     - Must provide criteria to distinguish adaptations from byproducts/drift. **Non-negotiable** to avoid just-so stories.  

  4. **Cumulative Culture**:  
     - Must explain persistence, modifiability, and complexity via mechanisms like high-fidelity transmission or attractors. **Non-negotiable**.  

  5. **Micro-Macro Mapping**:  
     - Mechanistic links are **non-negotiable**; quantitative precision is a **preference**.  

  6. **Biological Consistency**:  
     - Consistency with cognitive evolution is **non-negotiable**; full coevolutionary integration is a **preference**.  

  ---

  ### **Tradeoffs and Exclusionary Power**
  - **Hardest Joint Desiderata**: *Psychological Realism* vs. *Mathematical Tractability*.  
    - Deep cognitive mechanisms (e.g., semantic reconstruction) complicate modeling; simple models (e.g., replicator equations) risk psychological implausibility.  
  - **Most Exclusionary Requirement**: **Cumulative Culture**.  
    - Eliminates theories with only low-fidelity transmission (e.g., pure contagion models) or no selection (e.g., pure drift theories).  

  ---

  ### **Brief Framework Scorecard**
  | **Framework**       | **Replicator**      | **Lamarckian** | **Cumulative** | **Micro-Macro**       | **Adaptationism** |  
  |---------------------|---------------------|----------------|----------------|-----------------------|------------------|  
  | **Memetics**        | Rigid replicators   | Weak           | Strong         | Weak (reductionist)   | Naive            |  
  | **Dual-Inheritance**| Statistical units  | Strong         | Strong         | Strong (ABMs)         | Refined          |  
  | **Cultural Attractor**| No replicators    | Strong         | Moderate       | Moderate (biases)     | Contextual       |  
  | **Epidemiology**    | Information units  | Strong         | Moderate       | Strong (biases)       | Refined          |  

  ---

  ### **Confidence Assessment**
  - **Overall Confidence**: High (desiderata distilled from consensus in philosophy of science and cultural evolution literature).  
  - **Least Confident Point**: **Replicator fidelity threshold**.  
    - Debate persists: How much fidelity is "enough" for cumulative culture? Attractor theories argue high fidelity emerges *from* reconstruction; replicator theories demand it *a priori*. Empirical resolution is ongoing.  

  This list provides a robust foundation for evaluating theories. Crucially, it prioritizes explanatory power over ontological commitments (e.g., replicators), ensuring Darwinian principles remain central without biological baggage.
