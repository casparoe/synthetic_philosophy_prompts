prompt: |-
  I've been thinking about causation by omission — the idea that someone can cause an outcome by failing to act. The easy cases seem to involve a clear prior duty: a lifeguard who watches a swimmer drown, a parent who doesn't feed a child. The easy non-cases are equally clear: a stranger on the other side of the world doesn't cause a famine by not sending money. But I keep getting stuck on the territory in between, where it's genuinely unclear whether an omission should count as a cause. I'd like you to give me an example that isolates the deepest conceptual difficulty here — one that doesn't just illustrate a familiar intuition but forces us to confront what's really at stake in drawing the line. Then walk me through what the example reveals. I'd also like you to tell me where your own reasoning about the example is most vulnerable: what kind of case or argument would lead you to a different verdict, and why that particular challenge would be hard for your analysis to absorb.
