prompt: |-
  Right, I've been reading Dennett and also some of the newer stuff on whether LLMs actually believe things or just act as if they do, and I find myself going in circles. So here's what I want from you.

  What's your credence that the most capable AI systems in, say, 2040 (so about 15 years out) will have genuine propositional attitudes -- beliefs and desires in the way you and I have them -- not just be usefully described as if they do? And I mean *genuine*: the sort where if you said "the system believes that P" you'd be stating a literal truth, not speaking metaphorically or instrumentally.

  But don't just give me a number. I want the decomposition. Tease apart the sub-questions your credence rides on, put a rough probabiliity on each, and tell me how they combine. In particuar, I want to see:

  - Youre credence that the right theory of mental content is broadly interpretivist/functionalist (so satisfying the right behavioural and inferential rol is sufficient) versus something that requires the right causal history or biological substrate or whatever.

  - COnditional on interpretivism/functionalism being right, your credence that 2040systems will clear the bar - have the right sort of integrated goal-directed behaviour, the right sort of sensitivity to reasons, whatever your favoured theory demands.

  - Conditiional on the stricter theories being right instead, you credence that 2040sytems clear *that* bar -- e.g. if you think genuin belief requires being the product of evoluton by natural selection, or requires phenomenal consciousness, or requires embodied interaction with a shared world, then what's the chance they satify that?

  - And then anyhting else you think belongs -- maybe a term for "the whole question is confused and 'belif' doesn't carve nature at the joints," or a term for whether we'll even be able to tell.

  Then combine them and give me the finl number. And then: which sub-question is doing most of the work? If I wanted to move you credence by the largst amount, which one should I bring evidence on?

  I shoud say -- I spent forty years in molecular bilogy before retiring and geting into this stuff, so I'm not afraid of technicality, but I do want the reasoning laid out clearly, not hidden behind jargon.
reasoning: |-
