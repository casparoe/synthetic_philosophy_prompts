prompt: |-
  ok so we did the ellsberg paradox in my psycology class and ive gone down a bit of a rabbit hole reading about it. for context: youve got an urn with 90 balls, 30 red and 60 that are black or yellow in unknown proportion. most people prefer betting on red (known 1/3 chance) over black (unknown chance somewhere between 0 and 2/3), and also prefer betting on black-or-yellow over red-or-yellow — which cant both be right under expected utility because youd need probabilities that sum to more than 1 basically. the standard story is that people are ambiguity averse: they prefer known probabilities over unknown ones.

  but every time i read a paper arguing ambiguity aversion is rational its answering a different objection than the one in the next paper arguing its irrational. nobody seems to have sat down and said: heres what a theory of decision under ambiguity actually has to deliver before we even start arguing about whether its rational.

  so thats what i want. write me the desiderata. what does an adequate theory of decision under ambiguity have to get right? which cases must it handle (the ellsberg paradox obviously, but what else?), which distinctions cant it collapse, which results from neighbouring fields cant it contradict? for each requirement give me the case or consideration that motivates it. and tell me which ones are non-negotiable and which are more like preferences of particular camps. if any pair of them cant be jointly satisfied — like if respecting the ellsberg choices and some other plausible requirement turn out to be incompatible — flag that, because thats the bit i most want to understand.

  then briefly: how do the main approaches (maxmin expected utility, the smooth ambiguity model, and whatever the camp is called that says ambiguity aversion is just a mistake) do against the list. but keep the weight on the criteria not the scorecard.
reasoning: |-
  Okay, the user has been studying the Ellsberg Paradox in psychology and has gone down a rabbit hole reading about it. They're frustrated because papers arguing for and against ambiguity aversion as rational seem to address different points without a clear set of criteria for what makes a theory of decision under ambiguity adequate. They want a comprehensive list of desiderata: what any good theory must get right, what cases it needs to handle, which distinctions it can't ignore, and what constraints from other fields it must respect. They also want to know which criteria are non-negotiable versus more debatable, and if there are incompatibilities. Finally, they want a brief overview of how main theories handle these criteria, but the focus is on the framework itself.

  First, I need to recall the Ellsberg Paradox details. An urn with 90 balls: 30 red, 60 black or yellow in unknown proportion. People prefer betting on red (known 1/3 chance) over black (unknown), and also prefer black-or-yellow (known 2/3) over red-or-yellow (unknown). This violates expected utility because probabilities should add up. The key is ambiguity aversion—preference for known probabilities.

  The user's main request is for desiderata. I should structure them clearly. Start with the absolute must-haves: capturing Ellsberg choices is non-negotiable. Then, handling real-world cases like insurance or investments where ambiguity is common. The theory must distinguish ambiguity from risk (known probabilities) and from uncertainty about outcomes. It should allow for varying degrees of aversion, not just a binary approach.

  Next, internal consistency: the theory must avoid Dutch books (no sure losses) and respect state dominance. Also, it should be compatible with updating beliefs via Bayes' rule when new information arrives. But here's a potential conflict: if a theory respects dynamic consistency (choices remain consistent over time), it might clash with ambiguity aversion in sequential choices. For example, if someone prefers avoiding ambiguous bets initially but might switch later, leading to time inconsistency.

  Then, there's the issue of normative vs. descriptive. Some theories like Subjective Expected Utility (SEU) say ambiguity aversion is irrational, while others like Maxmin Expected Utility (MEU) or Smooth Ambiguity Model accept it. The user wants to know which desiderata are non-negotiable. Ellsberg choices must be explained; that's core. But things like source dependence or state-dependence might be more flexible.

  I should also consider practical applications. The theory must handle portfolio selection, insurance markets, or contract design where ambiguity plays a role. If it can't explain why people buy insurance against ambiguous threats, it's inadequate.

  Now, flagging incompatibilities. The big one is between respecting Ellsberg choices and maintaining dynamic consistency. MEU can handle Ellsberg but may violate dynamic consistency in sequential choices. SEU avoids that but can't explain Ellsberg. That's a key tension.

  For the theories: 
  - SEU says ambiguity aversion is a mistake; it satisfies dynamic consistency but fails Ellsberg. 
  - MEU (Gilboa-Schmeidler) captures Ellsberg and ambiguity aversion but struggles with dynamic consistency. 
  - Smooth Ambiguity (Klibanoff) separates beliefs and tastes, handles Ellsberg and dynamic consistency better, but is more complex.

  The user is deep in the literature and wants clarity. They might be preparing for a paper or presentation, so providing a structured framework helps them organize conflicting arguments. Highlighting the incompatibility between dynamic consistency and ambiguity aversion addresses their curiosity about why debates persist. They need this to synthesize different papers and understand where each theory stands.
answer: |-
  Here’s a structured breakdown of the desiderata for a theory of decision under ambiguity, motivated by key cases and considerations. I’ll distinguish **non-negotiable** criteria (essential for any minimally adequate theory) from **contentious/optional** ones (reflecting specific philosophical/camp preferences). I’ll flag incompatibilities and conclude with a brief assessment of major theories.

  ---

  ### **Core Desiderata for a Theory of Decision Under Ambiguity**

  1.  **Capture Ellsberg Choices (Non-negotiable)**  
      *   **Motivation:** The Ellsberg Paradox itself. A theory must explain why people consistently prefer:  
          (A) Bet on Red (known 1/3) *over* Bet on Black (unknown prob)  
          (B) Bet on Black-or-Yellow (known 2/3) *over* Bet on Red-or-Yellow (unknown prob)  
          without implying probabilities summing to >1.  
      *   **Why Non-negotiable:** It’s the core empirical phenomenon the theory is built to address. Failure here means the theory doesn’t explain ambiguity aversion.

  2.  **Distinguish Ambiguity ("Knightian Uncertainty") from Risk (Non-negotiable)**  
      *   **Motivation:** Ellsberg Paradox *and* real-world behavior (e.g., preferring insurable risks with known probabilities over uninsurable ambiguous threats). A theory must treat known probabilities (risk) differently from unknown probabilities (ambiguity). It cannot collapse ambiguity into risk (e.g., by forcing a single subjective probability for ambiguous events).  
      *   **Why Non-negotiable:** If ambiguity isn’t distinct, the Ellsberg paradox disappears. This is the defining feature of the domain.

  3.  **Avoid Strict Dutch Books / Ensure Coherence (Non-negotiable)**  
      *   **Motivation:** Normative requirement from decision theory. A decision-maker should not accept a set of bets guaranteeing a sure loss ("Dutch Book").  
      *   **Case:** If a theory implies preferences leading to a set of bets where the agent *always* loses money regardless of the state, it’s normatively flawed.  
      *   **Why Non-negotiable:** Violating coherence makes the theory self-defeating and normatively indefensible.

  4.  **Resort to State Dominance (Non-negotiable)**  
      *   **Motivation:** If act A yields a better outcome than act B in *every possible state of the world*, any rational agent should prefer A over B.  
      *   **Case:** If betting on Black+Yellow pays $100 regardless of the ball drawn, and betting on Red pays $0 always, the former must be preferred.  
      *   **Why Non-negotiable:** A bedrock principle of rational choice. Violation implies rejecting strictly superior outcomes.

  5.  **Allow for Ambiguity Aversion, Neutrality, and Seeking (Non-negotiable)**  
      *   **Motivation:** Empirical evidence shows people aren’t uniformly ambiguity-averse. Some are neutral (SEU maximizers), some seek ambiguity (e.g., in lottery-like settings).  
      *   **Case:** Ellsberg shows aversion; some investors prefer ambiguous "growth stocks" (seeking); experts in a domain might be neutral.  
      *   **Why Non-negotiable:** A theory must accommodate the full range of empirically observed attitudes, not just aversion.

  6.  **Permit Belief Updating (Conditional Preferences) (Contentious)**  
      *   **Motivation:** How should beliefs/choices change upon learning partial information (e.g., "The ball is not Red")?  
      *   **Case:** In Ellsberg Urn after learning "Not Red," does betting on Black vs. Yellow become less ambiguous? A theory should allow sensible updating (e.g., via Dempster-Shafer, Generalized Bayes).  
      *   **Why Contentious:** Some theories (SEU) have a unique update rule (Bayes). Others (MEU) allow multiple rules. Normative status of non-Bayesian updating is debated.

  7.  **Dynamic Consistency / No Preference Reversals (Contentious)**  
      *   **Motivation:** Choices made sequentially should align with choices made as a single plan ("consequentialism").  
      *   **Case:** Machina’s Dynamic Ellsberg: Would you pay to avoid an ambiguous bet *before* it’s resolved, but accept it if faced directly? Violations suggest time-inconsistency.  
      *   **Why Contentious & Flagged Incompatibility:** This clashes directly with Ellsberg choices in many models. **THE KEY INCOMPATIBILITY:** Strict ambiguity aversion (as in Ellsberg) combined with dynamic consistency often forces the agent to act *as if* they have sharp probabilities, contradicting Ellsberg preferences. Most ambiguity models sacrifice full dynamic consistency to capture Ellsberg.

  8.  **Source Dependence (Optional)**  
      *   **Motivation:** Ambiguity aversion depends on the *source* of uncertainty. People treat ambiguity from an urn differently than ambiguity about stock markets or climate change.  
      *   **Case:** Heath & Tversky’s Competence Hypothesis: People are less ambiguity-averse when they feel competent about the domain.  
      *   **Why Optional:** While empirically important, a foundational theory might aim for source-neutrality first. Some models (e.g., Smooth Ambiguity) incorporate this via source-specific parameters.

  9.  **Descriptive Adequacy Beyond Ellsberg (Optional but Important)**  
      *   **Motivation:** Real-world phenomena like insurance demand for ambiguous threats, herd behavior in markets, underinvestment in ambiguous foreign assets.  
      *   **Case:** Why buy terrorism insurance (highly ambiguous probability) but not flight insurance (known low probability)?  
      *   **Why Optional:** Primarily a descriptive/pragmatic goal, but crucial for applied fields (finance, macroeconomics, insurance).

  10. **Normative Plausibility / "Rationality" (Contentious)**  
      *   **Motivation:** Is ambiguity aversion itself rational? Or is it a cognitive bias?  
      *   **Case:** SEU proponents argue it’s irrational, citing Dutch Book arguments (though see Desideratum 3). Others argue it’s rational ignorance or a sensible response to unspecifiable probabilities.  
      *   **Why Contentious:** This is the core philosophical divide. The desideratum depends entirely on one’s definition of rationality.

  ---

  ### **Incompatibilities Highlighted**
  *   **The Big One: Ellsberg Choices vs. Dynamic Consistency (Desiderata 1 & 7):** Capturing the static Ellsberg preferences typically requires preferences that are not "separable" across states. Dynamic consistency in sequential choice generally requires separability. Sacrificing some dynamic consistency is the price most ambiguity models pay for Ellsberg realism. Theories claiming full dynamic consistency (like standard SEU) must reject Ellsberg choices as irrational.

  ---

  ### **How Major Theories Fare Against the Desiderata**

  1.  **Subjective Expected Utility (SEU) ("Ambiguity Aversion is a Mistake" Camp)**  
      *   **Fails:** 1 (Ellsberg), 2 (Collapses ambiguity into risk), 5 (Forces ambiguity neutrality).  
      *   **Succeeds:** 3 (Coherent), 4 (State Dominance), 6 (Bayesian Updating), 7 (Dynamically Consistent), 9 (Sometimes - if you ignore Ellsberg).  
      *   **Verdict:** Strong normatively (3,4,6,7) but descriptively inadequate (1,2,5). Asserts Ellsberg behavior is irrational.

  2.  **Maxmin Expected Utility (MEU) / Multiple Priors (Gilboa-Schmeidler)**  
      *   **Succeeds:** 1 (Ellsberg), 2 (Distinguishes ambiguity), 3 (Coherent under maxmin), 4 (State Dominance), 5 (Aversion built-in, neutrality/seeking via variations), 8 (Can incorporate via set of priors), 9 (Good fit for many applications).  
      *   **Fails/Struggles:** 6 (Updating non-unique/controversial), 7 (Violates dynamic consistency in sequential choice - the key incompatibility).  
      *   **Verdict:** Strong descriptively (1,2,5,9), normatively solid on core (3,4), but struggles with dynamics (6,7).

  3.  **Smooth Ambiguity Model (Klibanoff-Marinacci-Mukerji)**  
      *   **Succeeds:** 1 (Ellsberg), 2 (Distinguishes ambiguity), 3 (Coherent), 4 (State Dominance), 5 (Explicit φ-function captures aversion/neutrality/seeking), 6 (Sensible Bayesian-like updating of second-order beliefs), 7 (Much better dynamic properties than MEU), 8 (Second-order beliefs can be source-dependent), 9 (Flexible for applications).  
      *   **Struggles:** Complexity; requires specifying a second-order probability and an ambiguity attitude function φ. Normative status of φ less clear-cut than SEU or MEU axioms.  
      *   **Verdict:** Balances descriptive power (1,2,5,8,9) and normative appeal (3,4,6,7) most comprehensively. Addresses the MEU dynamic issues.

  ---

  **In Essence:** A minimally adequate theory **must** explain Ellsberg (1), treat ambiguity distinctly (2), avoid incoherence (3), respect dominance (4), and allow for varying attitudes (5). The major tension is between capturing the static Ellsberg phenomenon (1) and maintaining dynamic consistency (7). MEU sacrifices 7 for 1; SEU sacrifices 1 for 7; Smooth Ambiguity finds a pragmatic middle ground. The "rationality" debate hinges on whether violating dynamic consistency (or requiring complex second-order beliefs) is an acceptable cost for descriptive accuracy.
