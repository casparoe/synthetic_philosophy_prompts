  I've been watching two epistemologists in my department argue for two years about whether you can ever rationally be epistemically akratic — you know, believing p while also believing your evidence doesn't support p. One says never, it's a structural irrationality like akrasia in action; the other says there are edge cases where it's fine, because higher-order evidence about your own unreliability doesn't always have to trickle down to your first-order beliefs. They've finally agreed to do an adversarial collaboration. Draft the document they'd produce. I want: (1) a numbered list of claims they both sign — about what higher-order evidence is, about paradigm cases they agree on, about what's at stake if one side is right; (2) a disagreements table where each position is stated in wording its own side would accept; (3) the cruxes they identify — sub-questions where an answer would move at least one of them; and (4) for each crux, a concrete case or setup both agree bears on it, with each side's prediction written down. Also tell me: where in your draft is the dialectic shakiest — what argument or case would most likely make you realize you've mischaracterised one side and need to rewrite?
