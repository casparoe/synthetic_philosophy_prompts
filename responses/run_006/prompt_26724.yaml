answer: |-
  ### Decision Tree: Classifying Positions on Epistemic Akrasia  
  *Use this tree to classify views based on responses to concrete cases. Answer each question with "yes" or "no" after reading the vignette.*  

  ---

  #### **Vignettes for Questions**  
  1. **Possibility Vignette**:  
     *Sam believes that aliens built the pyramids (P). Sam also believes that, given all his evidence (e.g., archaeological data, historical records), the evidence does not support P. Is Sam’s mental state (believing P while believing his evidence fails to support P) genuinely possible?*  

  2. **Sleep Deprivation Vignette (for Permissibility)**:  
     *A detective reviews forensic evidence and concludes the suspect is guilty (P) with high confidence. She then learns she has been awake for 30 hours and that sleep deprivation doubles the error rate for her type of reasoning. She continues to believe P with high confidence but also believes that, given her total evidence (including the sleep deprivation), her evidence does not support P. Is this akratic combination (belief in P + belief that evidence doesn’t support P) rationally permissible?*  

  3. **Sleep Deprivation Vignette (for Adjustment)**:  
     *In the same detective case, must the detective lower her confidence in the suspect’s guilt upon learning about her sleep deprivation? (i.e., Is she rationally required to reduce her confidence?)*  

  ---

  #### **Decision Tree**  
  Start with **Question 1**, then follow your answer.  

  1. **Question 1 (Possibility)**:  
     Based on the **Possibility Vignette**, is genuine epistemic akrasia possible?  
     - **No** → **Fixed-point view**  
       *Distinctive commitment: Rationality requires such harmony between beliefs and metabeliefs that akrasia is conceptually impossible.*  
     - **Yes** → Proceed to Question 2.  

  2. **Question 2 (Permissibility)**:  
     Based on the **Sleep Deprivation Vignette (for Permissibility)**, is akrasia rationally permissible in this case?  
     - **No** → Proceed to Question 3.  
     - **Yes** → **Level-splitting view**  
       *Distinctive commitment: First-order beliefs and higher-order assessments operate at distinct normative levels, so akrasia can be rational.*  

  3. **Question 3 (Adjustment)**:  
     Based on the **Sleep Deprivation Vignette (for Adjustment)**, must confidence be lowered?  
     - **Yes** → **Conciliationism**  
       *Distinctive commitment: Higher-order evidence of error always requires downward adjustment of first-order confidence.*  
     - **No** → **Enkratic requirement view**  
       *Distinctive commitment: Akrasia is never rational, but avoiding it doesn’t always require confidence adjustments (e.g., reassessing the evidence is an alternative).*  

  ---

  #### **Position Summaries**  
  - **Fixed-point view** (e.g., Titelbaum, Smithies):  
    Akrasia is incoherent; rationality precludes self-mistrust.  
  - **Level-splitting view** (e.g., Lasonen-Aarnio, Weatherson):  
    Akrasia can be rational because first-order and higher-order rationality norms are separable.  
  - **Conciliationism** (e.g., Christensen):  
    Higher-order evidence always mandates first-order doubt.  
  - **Enkratic requirement view** (e.g., Feldman, Horowitz):  
    Akrasia is irrational, but coherence can be restored without changing first-order beliefs (e.g., by revising higher-order judgments).  

  ---

  #### **Limitations of the Tree**  
  - **Unseparated Pair**:  
    The tree cannot cleanly distinguish **conciliationism** from the **enkratic requirement view** in cases where adjustment *is* the only way to avoid akrasia. Both say akrasia is impermissible (Q2: "no"), but conciliationism adds that adjustment is *required* (Q3: "yes"), while the enkratic requirement does not (Q3: "no").  
  - **Unexplored Combination**:  
    `Q1: Yes → Q2: Yes → Q3: Yes`  
    *Diagnosis: Incoherent*—If akrasia is permissible (Q2: yes), requiring confidence adjustments (Q3: yes) contradicts the permissibility of maintaining the original belief.  
  - **Merely Unattractive Combination**:  
    `Q1: No → [any further answers]`  
    *Diagnosis: Incoherent*—Fixed-point views deny akrasia is possible, so later questions are irrelevant.  

  ---

  **Handout Notes**:  
  - Use this tree *after* discussing cases to avoid theoretical bias.  
  - Positions are defined by case responses, not labels.  
  - Real-world examples: Sleep deprivation (higher-order evidence), biased reasoning, or conflicting expert testimony.
