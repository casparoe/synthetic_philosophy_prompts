prompt: |-
  I am a software engineer who works on decision-support tools for allocating social benefits, and I have been trying to make my own normative assumptions explicit before I encode any of them. I wrote down my reactions to a series of cases about when a badly-off person is owed help, and I would like to know whether a single principle can explain them. A person born with a genetic condition requiring expensive lifelong care: clearly owed help. A pedestrian struck by a drunk driver and left unable to work: clearly owed help. A child whose health is permanently damaged by severe poverty: clearly owed help. A homeowner who repeatedly ignored flood-zone warnings, declined available insurance, and lost their house in a flood: I do not think they are owed a full replacement. A person who refuses a free and effective vaccine and then becomes seriously ill: not owed. A person who gradually develops a taste for fine wine and is then perpetually dissatisfied because they cannot afford it: not owed. So far the pattern looks like: compensate for bad luck a person did not choose, but not for bad outcomes that flow from their own choices.

  But the pattern breaks down in the middle cases. A careful backcountry skier who takes an avalanche-safety course, checks forecasts, and carries proper equipment is caught in a rare and unpredictable avalanche: I want to say owed help. A careful person who invests their savings in a startup after extensive research, and loses everything when the startup fails: I do not want to say owed help. Both made an informed decision to accept a risk, and I cannot articulate what separates the two. A lifelong smoker who develops lung cancer: I lean against compensation. A nonsmoker with a known genetic predisposition who develops lung cancer: owed. But the smoker began smoking as a teenager, and I am unsure how much that background should matter.

  Is there a principle that captures these verdicts, or most of them? State the principle precisely, say which of my verdicts it forces me to revise, and tell me what it implies for a case I have not settled: a person who chooses to work as a freelance artist knowing the income is unstable, and later cannot afford healthcare — are they owed help, and why or why not? Finally, does the principle need separate notions of how bad the luck was and how avoidable the choice was, or can one notion do all the work? Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Hmm, this user is a software engineer designing decision-support tools for social benefit allocation. They're grappling with normative ethics—specifically when "badly-off" individuals deserve assistance—and want a unifying principle for their intuitive judgments. Their cases reveal a tension between compensating unchosen misfortune versus denying compensation for avoidable poor choices.

  The user's pattern initially suggests a luck-egalitarian approach: help when outcomes stem from brute luck (genetic condition, drunk driver victim, poverty-damaged child) but not when they result from option luck or preference (flood-ignorer, vaccine-refuser, wine-lover). But middle cases fracture this: they feel a prepared skier caught in a freak avalanche deserves help, while a diligent startup investor doesn’t, even though both took informed risks. Similarly, they deny help to a lifelong smoker (starting as a teen) but grant it to a genetically predisposed nonsmoker.

  The core challenge is distinguishing types of risk. The avalanche case involves *low-probability, high-severity* risk where even maximal precautions fail—this feels like brute luck. The startup is *calculable entrepreneurial risk*—a voluntary gamble with foreseeable downsides. The smoker/gene cases highlight *controllable vs. uncontrollable exposure* to harm.  

  My proposed principle—**compensate for deficits only when they result from imposed risks or unavoidable circumstances, not from elective gambles where the individual could reasonably bear the downside**—explains most verdicts:  
  - Supports helping: genetic condition (unavoidable), pedestrian (imposed risk), child poverty (imposed), skier (residual unavoidable risk after mitigation).  
  - Denies: flood-ignorer (elective risk), vaccine-refuser (elective), wine-lover (preference), startup investor (elective gamble).  
  - Clarifies smoker: adolescent initiation may reduce voluntariness, but sustained smoking is an elective health gamble.  
  For the artist case: no help owed. Choosing unstable freelance work is an elective gamble; healthcare costs are a foreseeable downside they should bear.  

  The principle *cannot* use a single luck/avoidability scale—it needs two dimensions:  
  1. **Source of risk**: Was the risk imposed (e.g., drunk driver) or voluntarily assumed (e.g., startup investment)?  
  2. **Agency in mitigation**: Could the individual reasonably avoid or absorb the consequence (e.g., skier took all precautions vs. artist chose instability)?  

  One nuance: the principle must handle *structural constraints*. The teenage smoker’s "choice" might be less voluntary in a nicotine-saturated environment—but if we overextend this, we risk collapsing all decisions into determinism. Hence the "reasonably bear" clause does heavy lifting.  

  For the artist case, the verdict holds: no obligation. But if the artist grew up in an artists' colony with no exposure to stable careers, we might reconsider—showing how background can modulate "elective." Still, the principle resists that expansion here to avoid overreach.  

  Revised verdicts:  
  - Smoker case: aligns if we treat smoking as elective after initial conditions.  
  - Startup investor: consistent, but user’s discomfort might stem from seeing financial ruin as catastrophic. The principle doesn’t budge—gambles have costs.  

  This framework offers operational clarity for coding, but the user should stress-test edge cases (e.g., "forced choices" like taking hazardous work due to poverty).
answer: |-
  **Bottom line: The principle that best captures your verdicts is: *Compensate individuals for deficits only when those deficits stem from risks they did not meaningfully choose to bear or could not reasonably avoid, but not when deficits result from elective gambles where the individual retained control and could reasonably absorb the downside*.**  

  ### Reasoning:  
  This principle explains your cases by distinguishing between **imposed/unavoidable risks** (compensate) and **elective gambles** (do not compensate), using three criteria:  
  1. **Source of risk**: Was the risk imposed by circumstance/others (e.g., genetic condition, drunk driver) or voluntarily assumed?  
  2. **Agency in mitigation**: Could the individual reasonably avoid the risk or mitigate its consequences?  
  3. **Foreseeability and scale**: Was the downside disproportionate to the individual’s capacity to bear it, even with precautions?  

  #### Your verdicts explained:  
  - **Owed help**: Genetic condition (unavoidable), pedestrian (imposed risk), impoverished child (imposed), nonsmoker with predisposition (unavoidable).  
  - **Not owed**: Flood-ignorer (elective, avoidable), vaccine-refuser (elective), wine-lover (preference, not a deficit), startup investor (elective gamble).  
  - **Avalanche skier (owed) vs. startup investor (not owed)**: The skier faced residual risk despite maximal precautions (unavoidable), while the investor accepted a calculable financial gamble (elective). The skier’s downside (injury/death) is also inherently catastrophic and unabsorbable, unlike monetary loss.  
  - **Smoker (not owed) vs. nonsmoker (owed)**: Smoking is an avoidable health gamble, even with teenage initiation (ongoing choice), while the nonsmoker’s risk was unavoidable.  

  #### Forced revisions:  
  - **Lifelong smoker**: Your "lean against" is consistent, but the principle *strongly denies* compensation unless initiation involved coercion/ignorance (e.g., targeted childhood marketing).  
  - **Startup investor**: Your verdict holds, but if they were misled or lacked alternatives, compensation might apply.  

  #### Freelance artist case:  
  - **Not owed help**. Choosing unstable work is an *elective gamble*: they retained control, could pursue stable income, and healthcare costs were a foreseeable downside. The principle prioritizes stability for basic needs (e.g., the impoverished child) over compensating optional career risks.  

  #### One notion or two?  
  **Two distinct notions are essential**:  
  - **Severity/impact of bad luck**: E.g., the avalanche’s life-threatening, unforeseeable severity vs. the startup’s financial loss.  
  - **Degree of avoidability**: E.g., the skier minimized risk (unavoidable residual), while the artist’s choice was fully avoidable.  
  Collapsing into a single "luck" metric obscures why the avalanche (high severity, low avoidability) is compensable while the startup (lower severity, high avoidability) is not.  

  **Why this works for your tool**: It operationalizes fairness by focusing on agency and structural constraints, avoiding moralizing while ensuring help targets those without meaningful alternatives. Test it against cases like "a worker forced into hazardous labor due to poverty" (owed) vs. "a thrill-seeker injured base-jumping" (not owed).
