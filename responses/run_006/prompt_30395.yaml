  This is not separating non-eliminativist views.

  Alternatively, we can ask about the reassembly case.

  Question 5: After all planks have been replaced and the original planks are reassembled, which ship is the original ship?
  A) The continuously repaired ship (made of new planks) is the original ship. (One-object, constitution, dominant-kind, four-dimensionalism)
  B) The reassembled ship (made of the original planks) is the original ship. (Not represented in our five.)
  C) Neither is the original ship. (Constitution view might say this if they think the original ship is destroyed when the first plank is removed? But that is not typical. Eliminativism would say there was no original ship.)
  D) Both are the original ship. (Contradictory)

  So we might not use this.

  Let's skip the Ship of Theseus for now and use the block tower.

  Question 5: (Block tower)
  After the tower is knocked over, does the tower still exist?
  A) No, the tower no longer exists; there is just a pile of blocks. (One-object, constitution, dominant-kind, four-dimensionalism)
  B) Yes, the tower still exists as a pile. (This is not typical.)
  C) There never was a tower; there were only blocks arranged towerwise. (Eliminativism)

  Again, only separates eliminativism.

  So we need the persistence question to separate four-dimensionalism.

  Question 6: (Persistence)
  When an object persists through time, what is it that exists at different times?
  A) The entire object is present at each moment during which it exists. (Endurance: one-object, constitution, dominant-kind)
  B) The object has different temporal parts at different times; the object is the sum of these temporal parts and is not wholly present at any one time. (Perdurance: four-dimensionalism)
  C) There are no persisting objects; there are only momentary objects or particles at each time. (Eliminativism)

  Question 7: (Identity over time for the statue)
  The piece of bronze that exists at the time just before the statue is made and the piece of bronze that exists at the time just after the statue is squashed (and is a lump) are:
  A) the same object. (One-object, constitution, four-dimensionalism)
  B) different objects. (Dominant-kind)
  C) There are no such objects; there are only particles. (Eliminativism)

  Question 8: (Existence of coincident objects)
  At the time when the statue exists, how many material objects are there in the location of the statue?
  A) Exactly one: the statue (which is also the piece of bronze). (One-object)
  B) Exactly one: the statue (and the piece of bronze does not exist at that time). (Dominant-kind)
  C) Two: the statue and the piece of bronze. (Constitution, Four-dimensionalism)
  D) None; there are only particles. (Eliminativism)

  Now, we have 8 questions. Let's see if we can cover the Ship of Theseus with a question about gradual change.

  Question 9: (Gradual change)
  If an object changes its parts gradually, such as a ship having planks replaced one by one, does the object survive the change?
  A) Yes, it is the same object as long as the change is gradual. (One-object, constitution, dominant-kind, four-dimensionalism)
  B) No, it becomes a new object after any change. (Not represented)
  C) There are no objects that change; there are only particles arranged in momentary configurations. (Eliminativism)

  This doesn't separate.

  Alternatively, we can ask about the identity of the object during change.

  But for our purpose, we have enough to separate the views.

  Now, let's build the scoring key.

  We have:

  View | Q1 | Q2 | Q3 | Q4 | Q5 (ship) | Q6 (persistence) | Q7 (identity of bronze) | Q8 (coincidence)
  -----|----|----|----|----|----------|----------------|------------------------|----------------
  One-object | A | A | B | C | A | A | A | A
  Constitution | B | A | A | B | A | A | A | C
  Dominant-kind | C | B | B | C | A | A | B | B
  Four-dimensionalism | B | A | A | B | A | B | A | C
  Eliminativism | D | C | C | D | C | C | C | D

  But we don't have a separate question for the block tower or Tibbles after. We have included:

  - Q1: Statue creation
  - Q2: Identity of the bronze after destruction (compares to before creation)
  - Q3: Tibbles-minus before
  - Q4: Tibbles-minus after
  - Q5: Ship of Theseus (after one plank) - let's assume we use: after one plank is replaced, is it the same ship? A: yes (non-eliminativist), C: eliminativism.
  - Q6: Persistence (endurance vs. perdurance)
  - Q7: Identity of the bronze from before to after
  - Q8: Coincidence at a time

  But note: for the Ship of Theseus, we have only one question that is about it, and it's not helping to separate non-eliminativist views. But we can use it to screen for eliminativism.

  In Question 5, if we ask: After one plank is replaced, is the resulting ship the same ship as the original?
  - A: yes (non-eliminativist views)
  - C: there are no ships (eliminativism)

  This is fine.

  Now, let's see if we can separate the views:

  - One-object: Q1=A, Q2=A, Q3=B, Q4=C, Q5=A, Q6=A, Q7=A, Q8=A
  - Constitution: Q1=B, Q2=A, Q3=A, Q4=B, Q5=A, Q6=A, Q7=A, Q8=C
  - Dominant-kind: Q1=C, Q2=B, Q3=B, Q4=C, Q5=A, Q6=A, Q7=B, Q8=B
  - Four-dimensionalism: Q1=B, Q2=A, Q3=A, Q4=B, Q5=A, Q6=B, Q7=A, Q8=C
  - Eliminativism: Q1=D, Q2=C, Q3=C, Q4=D, Q5=C, Q6=C, Q7=C, Q8=D

  Are there any conflicts or indistinguishable combinations?

  - One-object and dominant-kind both have Q3=B, Q4=C, Q5=A, Q6=A, but they differ on Q1, Q2, Q7, and Q8:
    - One-object: Q1=A, Q2=A, Q7=A, Q8=A
    - Dominant-kind: Q1=C, Q2=B, Q7=B, Q8=B

  - Constitution and four-dimensionalism both have:
    - Q1=B, Q2=A, Q3=A, Q4=B, Q5=A, Q8=C
    - But they differ on Q6 (persistence) and Q7? 
    - Wait, both have Q7=A (the piece of bronze is the same from before to after). 
    - Only Q6: constitution has A (endurance), four-dimensionalism has B (perdurance).

  So they are separated by the persistence question.

  Also, eliminativism is unique.

  Are there any unoccupied combinations? For example, if someone answers:
  - Q1=B, Q2=A, Q3=A, Q4=B, Q5=A, Q6=A, Q7=A, Q8=C -> constitution view
  - Q1=B, Q2=A, Q3=A, Q4=B, Q5=A, Q6=B, Q7=A, Q8=C -> four-dimensionalism

  What if someone answers Q6=B and also Q7=B? That would be: four-dimensionalism but with the dominant-kind view on the bronze? That is not one of the five. It might be an unstable combination because four-dimensionalism typically is perdurantist and does not deny the existence of the piece of bronze during the statue phase. So Q7=B says that the bronze before and after are not the same, which is not typical for four-dimensionalism. So this combination might be unattractive or unexplored.

  Similarly, if someone answers Q1=C (dominant-kind on creation) and Q6=B (perdurance), but the dominant-kind view is usually endurance. This combination might be possible but not standard.

  We'll note these in the scoring key.

  Now, the "most awkward commitment" for each view:

  - One-object view: The same object is a statue and a piece of bronze, even though they have different persistence conditions (e.g., the piece of bronze can survive being squashed while the statue cannot, but the view must say that the object both can and cannot survive being squashed, which is a contradiction unless they deny the difference in persistence conditions).
  - Constitution view: There can be two distinct material objects (e.g., the statue and the piece of bronze) in the same place at the same time, which seems to violate the principle that two objects cannot occupy the same space.
  - Dominant-kind view: When the artist shapes the bronze into a statue, the piece of bronze goes out of existence and ceases to be, even though the matter is the same and no matter has been added or removed.
  - Eliminativism: There are no statues, no ships, no cats — none of the ordinary composite objects we typically believe in exist.
  - Four-dimensionalism: Objects are never wholly present at a single time; they are extended in time and have temporal parts, which means we only ever see a part of an object at any given time.

