answer: |-
  Below is an eight-question diagnostic quiz designed to sort participants into one of the five theories of material constitution based solely on their verdicts about concrete cases. Each question presents a scenario and asks the respondent to choose among concrete claims about existence, survival, or destruction. The answer options avoid theoretical labels and focus on intuitive judgments. The quiz uses the required cases (bronze statue, Tibbles the cat, ship repair, and toy tower) and adds one case to separate endurance from perdurance (Question 8).

  ---

  ### **Quiz: Which Theory of Material Constitution Do You Actually Hold?**  
  *For each scenario, select the statement you agree with most. Answer based on your intuitions about the case.*

  1. **Bronze Statue Creation**  
     A piece of bronze exists. An artist shapes it into a statue. After shaping:  
     - (A) There is only one object: the piece of bronze, which is now also the statue.  
     - (B) Two objects exist: the statue and the piece of bronze (both in the same location).  
     - (C) Only the statue exists; the piece of bronze no longer exists.  
     - (D) No statue or piece of bronze exists; only particles arranged statuewise exist.  

  2. **Bronze Statue Destruction**  
     The statue is squashed and becomes a lump. The lump is the same bronze as the original piece. After squashing:  
     - (A) The statue is destroyed, but the piece of bronze survives (now as a lump).  
     - (B) The statue is destroyed, and the piece of bronze is destroyed too; a new lump of bronze exists.  
     - (C) No statue, piece of bronze, or lump exists; only particles arranged lumpwise exist.  

  3. **Tibbles the Cat (Before Tail Removal)**  
     Tibbles is a cat. Tibbles-minus is all of Tibbles except the tail. Before the tail is removed:  
     - (A) Tibbles-minus exists as a distinct object from Tibbles (both in the same location).  
     - (B) Tibbles exists, but Tibbles-minus does not exist as an object.  
     - (C) No cat or cat-part objects exist; only particles arranged catwise exist.  

  4. **Tibbles the Cat (After Tail Removal)**  
     The tail is cleanly detached. After removal:  
     - (A) Tibbles survives (now tailless), and Tibbles-minus survives (now identical to Tibbles).  
     - (B) Tibbles survives (now tailless), and Tibbles-minus survives as a distinct object in the same location as Tibbles.  
     - (C) Tibbles survives (now tailless), but Tibbles-minus never existed as an object.  
     - (D) No cat or cat-part objects exist; only particles arranged in two locations (tailless cat and tail) exist.  

  5. **Ship of Theseus (Single Plank Replacement)**  
     A ship (Ship A) has one plank replaced with a new one. After replacement:  
     - (A) The ship (now with a new plank) is still Ship A (the original ship).  
     - (B) A new ship exists; Ship A no longer exists.  
     - (C) No ship exists; only planks arranged shipwise exist.  

  6. **Ship of Theseus (Full Restoration)**  
     All planks of Ship A are replaced gradually. The original planks are reassembled into a ship (Ship C). After reassembly:  
     - (A) The continuously repaired ship (made of new planks) is Ship A; Ship C is a new ship.  
     - (B) Ship C (reassembled) is Ship A; the repaired ship is a new ship.  
     - (C) Neither is Ship A; Ship A no longer exists.  
     - (D) No ships exist; only planks arranged shipwise exist.  

  7. **Toy Tower Destruction**  
     A tower is built from blocks. It is knocked over and becomes a scattered pile. After knocking:  
     - (A) The tower no longer exists; only the blocks (now in a pile) exist.  
     - (B) The tower still exists (as a pile).  
     - (C) No tower or pile exists; only blocks arranged pilewise exist.  

  8. **Persistence Through Time**  
     An object (e.g., a statue) exists from time T1 to T2. During this period:  
     - (A) The entire object is fully present at every moment between T1 and T2.  
     - (B) The object has temporal parts (e.g., a T1-part, a T2-part); it is never fully present at one moment.  
     - (C) No persisting object exists; only momentary particles exist at each instant.  

  ---

  ### **Scoring Key**  
  The quiz sorts respondents into the five theories based on combinations of answers. First, I outline the logical space of possible answer combinations, then locate the five positions within it. The constitution view and four-dimensionalism are separated solely by Question 8 (endurance vs. perdurance). Unstable or unoccupied combinations are noted.

  #### **Logical Space of Answers**  
  Each question has answer codes (e.g., 1A, 1B, etc.). The table below maps combinations to theories. Rows represent the five theories; columns show required answers. "Any" means all answers for that theory are covered.  
  | Question | 1 (Creation) | 2 (Destruction) | 3 (Tibbles Before) | 4 (Tibbles After) | 5 (Ship Plank) | 6 (Ship Reassembly) | 7 (Tower) | 8 (Persistence) |  
  |----------|--------------|-----------------|--------------------|-------------------|----------------|---------------------|-----------|------------------|  
  | **One-object view** | A | A | B | C | A | A | A | A |  
  | **Constitution view** | B | A | A | B | A | A | A | A |  
  | **Dominant-kind view** | C | B | B | C | A | A | A | A |  
  | **Eliminativism** | D | C | C | D | C | D | C | C |  
  | **Four-dimensionalism** | B | A | A | B | A | A | A | B |  

  - **Key to Separation**:  
    - Constitution and four-dimensionalism share all answers **except Question 8**: Constitution requires 8A (endurance), four-dimensionalism requires 8B (perdurance). This is the **only separating item**.  
    - Eliminativism is distinct: It requires D/C answers for existence questions (1D, 2C, 3C, 4D, 5C, 6D, 7C, 8C).  
    - Other views are separated by creation/destruction (Q1–2) and Tibbles cases (Q3–4).  

  #### **Unstable or Unoccupied Combinations**  
  - **Constitution + 8B (Perdurance)**: Unstable. Constitution requires endurance (objects wholly present at each moment), while perdurance denies this. Combining them implies coincident objects with temporal parts, which is incoherent (no standard theory accepts both).  
  - **Dominant-kind + 1A/1B**: Unattractive. Dominant-kind requires the piece of bronze to cease existing when the statue is made (1C). Choosing 1A or 1B while keeping other dominant-kind answers (e.g., 2B) implies the statue both is and isn’t identical to the bronze, violating the view’s core.  
  - **Eliminativism + Non-C Answers for Existence Questions**: Unstable. If eliminativism is true, no ordinary composites exist, so C/D answers are required for Q1–7. Non-C answers (e.g., 1A) contradict eliminativism.  
  - **One-object + 4B/4A**: Unexplored. One-object denies that Tibbles-minus exists (3B, 4C). Choosing 4B (Tibbles-minus survives) or 4A (Tibbles-minus becomes identical) conflicts with this, creating tension (no clear theory supports this).  

  #### **Diagnosis of the Five Theories**  
  - **One-object view**: Most awkward commitment: The same object (e.g., the bronze) both *can* survive squashing (as bronze) and *cannot* survive squashing (as a statue), violating Leibniz’s Law.  
  - **Constitution view**: Most awkward commitment: Two objects (e.g., statue and bronze) can occupy the same space at the same time, violating the intuition that material objects cannot coincide.  
  - **Dominant-kind view**: Most awkward commitment: Shaping bronze into a statue *destroys* the bronze (even with no matter added/removed), making existence depend on arbitrary kind shifts.  
  - **Eliminativism**: Most awkward commitment: Ordinary objects (e.g., statues, cats, ships) do not exist—only particles do—denying everyday experience.  
  - **Four-dimensionalism**: Most awkward commitment: Objects are never wholly present; you only ever interact with a temporal part (e.g., today’s statue is just a "time-slice").  

  ---

  **How to Score**: Tally answers and match the combination to the table above. For example:  
  - 1B, 2A, 3A, 4B, 5A, 6A, 7A, 8A → Constitution view.  
  - Same as above but 8B → Four-dimensionalism.  
  - 1A, 2A, 3B, 4C, 5A, 6A, 7A, 8A → One-object view.  
  - 1D, 2C, 3C, 4D, 5C, 6D, 7C, 8C → Eliminativism.  

  This quiz cleanly separates all five views. Constitution and four-dimensionalism are differentiated only by Question 8, as predicted. Use this to spark discussion on how case verdicts map to theoretical commitments!
