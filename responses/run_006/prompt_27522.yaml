prompt: |-
  ok so we're reading Hobbes in my philosophy class and I'm stuck on this one part from his Six Lessons to the Professors of the Mathematics. Here's the gist of what he says (I'm paraphrasing since I don't have the book in front of me):

  He says that geometry is demonstrable because the lines and figures we reason from are drawn and described by us ourselves. And then he says civil philosophy is demonstrable for the same reason — because we make the commonwealth ourselves. But natural bodies we can't really know the construction of, so we don't get that kind of demonstration there.

  I get the surface level: geometry is something we construct, so we can know it fully, and politics is similar because we're the ones who set up the state. But I feel like I'm missing something deeper. Like, what does he actually mean by "demonstrable" here — is he talking about the kind of certainty you get in a Euclidean proof? And if so, how does he think you can get that in politics? The way people act in a commonwealth doesn't seem anything like the way lines and triangles behave. Is he being literal, or is this more of an analogy? Also, why does he think we can't know natural bodies the same way — is it just that God made them and not us, or is there something else going on?

  Basically, I'm trying to figure out if this whole "maker's knowledge" idea is actually doing real philosophical work or if it's just a fancy way of saying "trust me, I figured out politics." Can you help me unpack what he's really getting at?
reasoning: |-
  Okay, the user is grappling with Hobbes's concept of "maker's knowledge" from his "Six Lessons," specifically how it applies to geometry, civil philosophy, and natural bodies. They understand the surface argument—that we can know what we construct—but are questioning the deeper implications. 

  First, I need to clarify what Hobbes means by "demonstrable." The user is right to connect it to Euclidean certainty, but I should emphasize that Hobbes isn't just talking about logical rigor—he's arguing for *causal* certainty. Since we design the commonwealth's rules (like geometry's axioms), we can trace effects back to their human-made causes. That’s why politics, unlike nature, becomes "demonstrable." 

  The user’s skepticism about comparing politics to geometry is spot-on. Hobbes knows human behavior is messy, but his point is structural: the *artificial* person (the state) operates under rules we encode, like a geometric proof’s postulates. It’s not that people are predictable—it’s that sovereignty, contracts, and punishments are designed mechanisms. 

  On natural bodies, the user wonders if God’s role is the only barrier. It’s more than that: Hobbes is stressing epistemic limits. We didn’t create nature, so we can’t access its first principles—only observe effects. This ties to his mechanistic view: physics deals with conjectural chains of motion, not deductive certainty. 

  The user’s core question—whether "maker’s knowledge" is substantive or rhetorical—is sharp. I’d argue it’s both: it’s Hobbes’s foundational epistemology *and* a power move to position his political theory as unassailable science. The tension they sense is real: his civil philosophy *is* normative (how states *should* be built), but he frames it as descriptive (how they *must* function). 

  Their struggle is common—Hobbes’s audacity lies in claiming mathematical certainty for human affairs. I should validate their instinct that the analogy isn’t perfect while explaining why Hobbes insists on it: to elevate his Leviathan from opinion to irrefutable logic.
answer: |-
  You've hit on one of Hobbes's most profound and controversial epistemological arguments: the "maker's knowledge" thesis. Let's unpack this systematically, addressing your excellent questions:

  ### 1. **What Hobbes Means by "Demonstrable"**
     - **Euclidean Certainty:** Yes, Hobbes means precisely the kind of deductive, logically necessary certainty found in geometry. For Hobbes, true science (*scientia*) requires:
       - Starting from clear, unambiguous definitions (e.g., "A commonwealth is an artificial person... whose will is the covenant of the multitude").
       - Deducing consequences with logical necessity (e.g., "Therefore, sovereignty must be absolute to prevent a return to the state of war").
     - **Causal Knowledge:** Crucially, "demonstrable" implies knowing *causes*. If you know why something *must* be the way it is (like why a triangle's angles sum to 180°), you have scientific knowledge.

  ### 2. **How Civil Philosophy is "Demonstrable" Like Geometry**
     Hobbes isn't being *merely* analogical—he's making a deep epistemological claim:
     - **We Construct Both:**
       - *Geometry:* We define points, lines, circles. Their properties flow *necessarily* from our definitions. We "make" the concepts and their relations.
       - *Commonwealth (Civil Philosophy):* Humans *artificially create* the state via covenant (social contract). Its structure (sovereign power, laws, obligations) is a human artifact, built from defined components.
     - **Knowing Causes Because We Are the Cause:**
       - Since *we* design the commonwealth's "construction" (its rules, institutions, authority), we can know its causal structure with certainty, just as a watchmaker knows a watch. We understand *why* sovereignty must be indivisible, *why* laws must be enforced, *why* rebellion leads to chaos—because we built the system to avoid the horrors of the state of nature.
     - **Politics as Mechanics:** Hobbes reduces politics to a mechanics of power and fear. Human passions (fear of death, desire for commodious living) are the predictable "motions" within the artificial machine of the state. Geometry deals with ideal shapes; politics deals with the predictable consequences of human nature under artificially imposed constraints.

  ### 3. **Why Natural Philosophy (Physics) is NOT Demonstrable**
     - **We Didn't Make Nature:** We have no access to God's "blueprint" for creation. Natural bodies are not artifacts of human reason.
     - **Limits of Observation:** We can only observe effects (motion, collisions) and hypothesize about underlying causes (atoms, invisible forces). This yields only *probable* knowledge (*opinio*), not certainty (*scientia*).
     - **No First Principles:** We lack clear, certain definitions of natural essences. What *is* "gravity" or "light" essentially? We define them by their effects, not their intrinsic construction.
     - **Hobbes's Mechanism:** Even though Hobbes was a materialist/mechanist, he held that we can only *model* nature's workings conjecturally. We can't deduce its properties from first principles like we can with circles or covenants.

  ### 4. **Is "Maker's Knowledge" Doing Real Philosophical Work?**
     **Absolutely.** It's central to Hobbes's entire project and revolutionary in several ways:
     - **Legitimizing Political Science:** It elevates politics from mere rhetoric or prudential wisdom to the status of a true *science*, as certain as geometry. This was radical. It's not "trust me," it's "you can *reason your way* to the necessity of absolute sovereignty, just as you reason that 2+2=4."
     - **Epistemological Foundation:** It grounds certainty in human agency. Knowledge isn't passive contemplation of essences (Aristotle) or divine illumination; it's active construction and understanding of our own creations.
     - **Solving the Problem of Skepticism:** In an age of religious wars and collapsing certainties, Hobbes offers a domain (geometry, politics) where indubitable knowledge *is* possible because it's human-made.
     - **Normative Force:** It implies that since *we* make the commonwealth, *we* are responsible for its failures. If it collapses into civil war, it's not fate or God's will—it's faulty construction (e.g., divided sovereignty, weak enforcement), which reason could have foreseen and prevented.

  ### 5. **Tensions and Criticisms (Why It Feels Suspicious)**
     - **Human Nature ≠ Geometric Lines:** You're right to sense tension. Human passions are less predictable than lines. Hobbes counters this by arguing his definitions capture the *necessary features* of political beings (fear, self-interest, rationality), making deductions about *system stability* possible, even if individual acts are unpredictable.
     - **Is His Politics Truly "Demonstrative"?** Critics (then and now) argue Hobbes's "definitions" (state of nature, absolute sovereignty) are polemical constructs, not neutral axioms. His "deductions" often mask normative claims (e.g., that security *must* trump liberty). The move from "is" (human nature) to "ought" (absolute sovereignty) is contested.
     - **Scope of "Making":** We "make" covenants, but do we "make" human nature itself? Hobbes might say we make the *artificial person* (the state) using natural persons as components with known (if unruly) properties.

  ### In Essence
  Hobbes isn't *just* making an analogy. He's arguing that **certain knowledge requires knowing causes, and we can only know causes definitively of things we ourselves construct.** Geometry and the Commonwealth are both products of human reason imposing order—one on space, the other on society. Natural philosophy deals with a world we didn't create, so we're stuck with hypotheses. This "maker's knowledge" thesis is the bedrock of Hobbes's claim to have founded a true science of politics, offering geometric certainty in a turbulent world. Whether he succeeds is debated, but it's profoundly serious philosophy, not just rhetoric. Your skepticism is healthy—grappling with whether political life can truly be reduced to a demonstrable system like geometry is at the heart of Hobbes's enduring challenge.
