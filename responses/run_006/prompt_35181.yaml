  Okay, the user is a PhD student in philosophy of biology focusing on definitions of life. They've noticed that different papers propose definitions but don't clarify the underlying criteria for a good definition. Their main request is for a structured list of desiderata, each with motivating cases, and to highlight tensions between them.

  First, I need to recall the key perspectives in the literature: operational (astrobiology), natural kinds, structural abstraction, and capturing intuitions. The user mentioned borderline cases like viruses and prions, which are crucial for testing definitions.

  The user wants to know which desiderata are non-negotiable versus field-specific. Non-negotiables might include empirical adequacy and coherence with science. Field-specific ones could be operationalizability for astrobiology. 

  Tensions between desiderata are central. For example, capturing intuitive cases (Desideratum 1) might conflict with structural abstraction (Desideratum 5) because Earth's biology is carbon-based, but life elsewhere might not be. Viruses are a key borderline case here—they're often excluded by metabolic definitions but included in some genetic ones. 

  Another tension is between operationalizability (Desideratum 4) and theoretical depth (Desideratum 3). An operational definition might miss underlying principles, while a deep theory might not be testable with current tech. 

  Desideratum 2 (natural kind) vs. Desideratum 1 (intuitions) is tricky because intuitions might not align with natural categories. For example, mules are sterile but alive, challenging reproductive definitions. 

  The user might also need help structuring their own research. Highlighting tensions shows where to focus. Maybe they can argue that desiderata aren't equally weighted, or that context determines which to prioritize. 

  I should ensure each desideratum has a clear motive. For instance, avoiding parochialism (Desideratum 5) is motivated by astrobiology. Borderline cases like viruses or tardigrades in cryptobiosis test each criterion. 

  Finally, organizing the list by priority: non-negotiables first, then negotiable ones. Emphasize that viruses expose the most tension, especially between Desiderata 1, 2, 4, and 5. No definition perfectly resolves this, but approaches like NASA's "chemical Darwinism" attempt to balance some criteria.
answer: |-
  Here is a structured analysis of the desiderata for a definition or theory of life, grounded in philosophy of biology, with explicit attention to tensions and borderline cases. I’ve distilled eight core desiderata, distinguishing non-negotiable foundations from context-dependent aims, and highlighted where conflicts arise—especially around the pivotal case of **viruses**.

  ---

  ### **Core Desiderata for a Definition of Life**
  *(Ordered roughly from most fundamental to more contextual)*

  1.  **Empirical Adequacy (Non-Negotiable)**  
      *   **What it requires:** The definition must align with uncontroversial, paradigmatic cases of life (e.g., bacteria, oak trees, humans) and uncontroversial non-life (e.g., rocks, water).  
      *   **Motivation:** Any definition that excludes paradigmatic life (e.g., claiming humans aren't alive) or includes clear non-life (e.g., claiming fire is alive) is descriptively inadequate and fails its core purpose.  
      *   **Tension Point:** Less about conflict with other desiderata, more a baseline filter. Failure here disqualifies a definition immediately.

  2.  **Theoretical Coherence / Integration with Biology (Non-Negotiable)**  
      *   **What it requires:** The definition must be consistent with, and ideally illuminate, core biological theories (evolution by natural selection, genetics, biochemistry, ecology). It shouldn't posit properties fundamentally at odds with established science.  
      *   **Motivation:** A definition of "life" divorced from the science that studies living systems is philosophically sterile and biologically useless. It must connect to explanations of *how* living systems work and persist.  
      *   **Tension Point:** Potential conflict with highly abstract or purely structural definitions (Desideratum 5) if they become untethered from biological mechanisms. Also challenged by entities like **prions** (replicate but lack nucleic acid) or **transposons** (genetic parasites).

  3.  **Explanatory Power / Theoretical Depth (High Priority)**  
      *   **What it requires:** The definition should explain *why* the defined properties are constitutive of life – what problem(s) they solve or what fundamental distinction they mark. It should not be a mere list of traits.  
      *   **Motivation:** A good definition should unify our understanding, revealing why life is a significant category. Does it capture the essence of "being alive" versus merely describing common features?  
      *   **Tension Point:** Can conflict with Desideratum 4 (Operationalizability) if the deepest explanatory principles (e.g., thermodynamic disequilibrium maintenance, information flow) are hard to detect. Also challenged by **endospores/frozen tardigrades** (minimal metabolism).

  4.  **Non-Arbitrariness / Basis in Natural Kinds (High Priority, but Debated)**  
      *   **What it requires:** The category "life" should aim to pick out a natural kind – a fundamental category in nature with shared causal properties, not just a human convention.  
      *   **Motivation:** Science seeks categories that "carve nature at its joints." If "life" is merely a pragmatic grouping, its scientific importance diminishes. We want to know if "alive" vs. "not alive" marks a real, causally significant boundary.  
      *   **Tension Point:** **Sharpest Conflict with Desideratum 1 (Capturing Intuitions)**. Pre-theoretical intuitions might not align with natural joints (e.g., mules are sterile but alive; viruses challenge boundaries). Also conflicts with Desideratum 8 if parochial intuitions dominate. **Viruses are the prime battlefield here.**

  5.  **Avoiding Parochialism / Structural Generality (Contextually Crucial)**  
      *   **What it requires:** The definition should abstract away from the specific contingent chemistry (e.g., carbon-based, DNA/RNA, aqueous solvent) of known Earth life to be applicable to potential alternative biochemistries (silicon-based, non-aqueous, etc.).  
      *   **Motivation:** Essential for astrobiology and origins-of-life research seeking universal principles. An Earth-centric definition risks missing genuinely novel forms of life.  
      *   **Tension Point:** **Sharpest Conflict with Desideratum 4 (Operationalizability)**. Highly abstract definitions (e.g., autopoiesis, information-based) are hard to apply to real, ambiguous samples without Earth-like proxies. Can also strain Desideratum 1 if it forces inclusion/exclusion of borderline cases counter to strong intuitions. **Viruses and lab protocells test this.**

  6.  **Operationalizability / Empirical Applicability (Contextually Crucial)**  
      *   **What it requires:** The definition must provide clear, empirically testable criteria for deciding if a novel or ambiguous system (e.g., Martian sample, complex chemical system) is alive *with available or foreseeable technology*.  
      *   **Motivation:** Paramount for fields like astrobiology, synthetic biology, and origins-of-life research. A definition you can't use is useless for guiding exploration or experimentation.  
      *   **Tension Point:** **Direct Conflict with Desideratum 5 (Avoiding Parochialism) and Desideratum 3 (Explanatory Depth).** The most readily operationalizable definitions often rely on Earth-life signatures (e.g., metabolism detected via specific gases) which may be parochial. Deep explanatory principles (e.g., Darwinian evolution) are hard to observe directly in a novel system quickly. **Viruses (need host) and dormant states (no detectable metabolism) are major challenges.**

  7.  **Capturing Borderline Cases / Handling Gradience (Important but Negotiable)**  
      *   **What it requires:** The definition should provide a principled way to handle entities that seem partially alive or exist on a continuum (viruses, viroids, prions, obligate parasites, dormant states). It needn't force a binary answer, but should clarify *why* they are borderline.  
      *   **Motivation:** These cases expose the limitations and assumptions of definitions. A good theory should explain ambiguity, not just ignore it or dismiss it arbitrarily.  
      *   **Tension Point:** Can conflict with Desideratum 4 (Non-Arbitrariness/Natural Kinds) if it suggests "life" is fundamentally fuzzy or graded, not a natural kind. Also pressures Desideratum 1 if intuitions about borderline cases vary. **Viruses are the quintessential test case.**

  8.  **Intuitive Plausibility / Connection to Folk Concepts (Negotiable)**  
      *   **What it requires:** The definition shouldn't radically contradict *all* core pre-theoretical intuitions about life (e.g., agency, goal-directedness, "spark") without compelling theoretical reason.  
      *   **Motivation:** While science can revise concepts, a definition completely alien to common understanding risks being about a different phenomenon altogether. Some connection anchors the term.  
      *   **Tension Point:** **Direct Conflict with Desideratum 4 (Natural Kinds) and Desideratum 5 (Avoiding Parochialism).** Intuitions are shaped by human-scale, Earth-centric experience and may not reflect underlying natural kinds or universal principles. Over-reliance here leads to parochialism (Desideratum 5).

  ---

  ### **The Central Tension & The Role of Viruses**
  The most profound and persistent tension exists between the cluster centered on **Natural Kinds / Theoretical Depth / Avoiding Parochialism (2, 3, 4, 5)** and the cluster centered on **Operationalizability / Capturing Intuitions / Handling Borderlines (6, 8, 7)**, with **Empirical Adequacy (1)** as the non-negotiable baseline.

  *   **Viruses expose this tension more acutely than any other case:**
      *   **Natural Kind/Depth/Parochialism View:** Focuses on the *underlying causal mechanisms*. Viruses lack intrinsic metabolism and cannot self-replicate independently. They don't maintain thermodynamic disequilibrium autonomously. They are clearly *not* units of selection in the same way cells/organisms are. This view leans towards excluding them or seeing them as parasitic genetic elements at the edge of life/non-life.
      *   **Operationalizability/Intuitions/Borderline View:** Focuses on *observable behavior and continuity*. Viruses evolve, store and transmit genetic information, have complex structures adapted for replication, and exhibit life-like cycles (infection, replication, spread). Intuitions are divided but many biologists see them as "alive" when active in a host. Excluding them feels arbitrary when compared to obligate parasites (like *Chlamydia*) that also need a host cell. Operational definitions struggle – detecting viral DNA on Mars wouldn't confirm "life" without a host context.
      *   **Why it's pivotal:** Viruses force a choice: Do we prioritize the *functional organization and evolutionary capacity* they exhibit (even if dependent), aligning with intuitions and some operational needs? Or do we prioritize the *intrinsic, autonomous, thermodynamic* properties they lack, aligning with natural kind aspirations and theoretical depth? No definition fully satisfies both perspectives simultaneously.

  ### **Finessing the Tension?**
  No definition perfectly resolves all tensions, but some approaches *attempt* to finesse the virus problem:

  1.  **Process-Focused Definitions (e.g., "Darwinian Evolution"):** Define life as a population evolving by natural selection. Viruses qualify *as populations*. This captures their evolutionary nature but arguably excludes dormant individuals and struggles with operationalizability (observing evolution takes time).
  2.  **Hierarchical or Dual Definitions:** Distinguish "minimal life" (e.g., an autonomously metabolizing cell) from "derived life" or "living processes" (which could include viruses *in the context* of a host ecosystem). This acknowledges the borderline status but can seem ad hoc.
  3.  **"Living" vs. "Alive":** Argue that "life" is a property of systems (e.g., biospheres, evolving lineages), not necessarily individual entities. Viruses are part of the living system. This is philosophically deep but highly abstract and operationally challenging.

  The unresolved status of viruses is less a failure of individual definitions and more a symptom of the **fundamental tensions between the desiderata themselves**. Recognizing this clarifies the debate: Proponents of different definitions are often prioritizing different subsets of these desiderata based on their disciplinary goals (astrobiology vs. theoretical biology vs. philosophy of biology).

  This list provides the framework you need to analyze existing definitions critically. Evaluate each proposal by asking: *Which desiderata does it prioritize? Which does it downplay or sacrifice? How does it handle the tensions, especially regarding viruses and other borderlines?* This moves the discussion beyond counterexamples to a deeper assessment of the definition's underlying aims and compromises.
