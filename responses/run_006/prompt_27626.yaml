prompt: |-
  I run a safety team at a mid-sized AI lab. We're deploying a new generation of models and I need a reusable procedure for a question that comes up repeatedly: given a model and its deployment context, should we invest primarily in control measures (sandboxing, monitoring, capability restrictions, output filtering) or in alignment measures (training for corrigibility, honest reasoning, value learning, interpretability-based assurance)? Both approaches are imperfect, resources are finite, and the two have characteristically different failure modes. I want a decision procedure my team can run in roughly an hour. It should specify: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure stops with a clear recommendation, where it hands off to human judgment, and where it prescribes investing in both. Then apply it to two cases: (a) a coding assistant deployed in an IDE with file-system and network access, and (b) a model that generates and executes its own research plans on a cluster, including writing novel code and browsing the web. Begin with the procedure itself, with no preface or commentary.
reasoning: |-
  We are creating a decision procedure for a safety team to decide between investing in control measures vs. alignment measures.
   The procedure is structured as a series of questions that are answered in order. Each question must be answered with a clear "yes", "no", or "cannot determine", unless otherwise specified.
   The procedure stops when a clear recommendation is reached or when it hands off to human judgment.

   Steps:

   1. **Deployment Context Criticality Assessment**:
      - Question: "Is the deployment context such that a single failure could cause catastrophic harm (e.g., physical harm, massive financial loss, existential risk) even with low probability?"
      - Sufficient answer: 
          - If "yes": Proceed to step 2.
          - If "no": Proceed to step 3.
          - If "cannot determine": Hand off to human judgment with a note that the context criticality is ambiguous.

   2. **Catastrophic Harm Mitigation**:
      - Question: "Can catastrophic harm be sufficiently mitigated by control measures alone (without relying on alignment) to reduce the probability to an acceptable level?"
      - Sufficient answer:
          - If "yes": Recommend investing primarily in control measures. Stop.
          - If "no": Proceed to step 4.
          - If "cannot determine": Proceed to step 4 and also note that a hybrid approach may be needed.

   3. **Frequency of Failure Exposure**:
      - Question: "Is the model expected to face adversarial or high-stakes situations frequently (e.g., daily) in deployment?"
      - Sufficient answer:
          - If "yes": Proceed to step 4.
          - If "no": Proceed to step 5.
          - If "cannot determine": Proceed to step 5 and also note that the frequency of exposure is uncertain.

   4. **Alignment as a Robustness Measure**:
      - Question: "Is there a clear path to achieving measurable improvements in alignment (e.g., via training for corrigibility, honesty, or interpretability) that would substantially reduce the risk of harm in the deployment context?"
      - Sufficient answer:
          - If "yes": Recommend investing primarily in alignment measures. Stop.
          - If "no": Recommend investing primarily in control measures. Stop.
          - If "cannot determine": Hand off to human judgment with a note that the efficacy of alignment measures is unclear.

   5. **Cost of Failure**:
      - Question: "Would a single failure cause significant harm (e.g., substantial financial loss, reputational damage, legal liability) even if not catastrophic?"
      - Sufficient answer:
          - If "yes": Proceed to step 6.
          - If "no": Proceed to step 7.

   6. **Control Feasibility for Significant Harm**:
      - Question: "Can control measures be implemented to reduce the probability of significant harm to an acceptable level without hindering core functionality?"
      - Sufficient answer:
          - If "yes": Recommend investing primarily in control measures. Stop.
          - If "no": Proceed to step 4 (to consider alignment as a robustness measure) but also note that a hybrid approach may be needed.
          - If "cannot determine": Hand off to human judgment with a note that control feasibility is uncertain.

   7. **Resource Allocation for Both**:
      - Question: "Given the low cost of failure, is there a surplus of safety resources that allows for investment in both control and alignment without compromising either?"
      - Sufficient answer:
          - If "yes": Prescribe investing in both. Stop.
          - If "no": Recommend minimal safety investment (with a default to basic control measures as they are often easier to implement) and re-evaluate after deployment. Stop.

   Additionally, note that at any step if the team identifies that the model exhibits known dangerous capabilities (e.g., high skill in deception, planning, or exploiting vulnerabilities) then the procedure should skip to step 2 regardless of the deployment context.

   Now, apply the procedure to two cases:

   Case (a): Coding assistant deployed in an IDE with file-system and network access.

   Step 1: 
     - Deployment context: A coding assistant with file-system and network access. A single failure (e.g., executing malicious code, deleting files, exfiltrating data) could cause significant damage to a user's system or data. However, is it catastrophic? (e.g., existential risk? massive financial loss at scale?) 
       - We assume that for a single user, the harm might be significant but not catastrophic. For an organization, if the assistant is widely deployed, a single failure might propagate and cause massive damage. However, the question is about a single failure. Let's say we are considering a typical mid-sized company deployment: a single failure could cause substantial financial loss for that company? Possibly, but we are not at the level of existential or catastrophic harm (like a nuclear plant meltdown). 
       - Answer: **no** (catastrophic harm is not the primary concern for a coding assistant in an IDE for typical users).

   Step 3: 
     - Frequency: Coding assistants are used frequently and may encounter adversarial inputs (e.g., a user trying to make it write malicious code, or accidental prompts that lead to harmful code). Also, every code execution could be high-stakes if it affects critical systems. 
       - Answer: **yes** (frequent exposure).

   Step 4: 
     - Alignment path: Can we train the model to be more corrigible, honest, and careful in code generation? For example, refuse dangerous commands and double-check with the user. There are known techniques (like RLHF for refusal) that can help. 
       - Answer: **yes** (there is a clear path to improve alignment to reduce risk).

     - Recommendation: **Invest primarily in alignment measures.**

   Case (b): Model that generates and executes its own research plans on a cluster, including writing novel code and browsing the web.

   Step 1: 
     - Deployment context: Autonomous model with code execution and web browsing. It can take actions in the real world (via the web) and on a cluster. A single failure could lead to catastrophic harm: e.g., the model could run a massive scam, spread malware, cause damage to infrastructure, or even start a chain reaction of harmful events. 
       - Answer: **yes** (catastrophic harm is possible even with low probability).

   Step 2: 
     - Control mitigation: Can we sufficiently mitigate catastrophic harm with control measures? We can sandbox the cluster, restrict network access, monitor and filter outputs, and have capability restrictions. However, given the model's autonomy and the open-ended nature of research, it might find a way to bypass controls (e.g., zero-day exploits). 
       - Answer: **no** (because the model is highly capable and autonomous, control measures alone might not be sufficient to reduce the risk to an acceptable level).

   Step 4: 
     - Alignment path: Can we achieve measurable improvements in alignment? For such an autonomous system, we would need the model to be corrigible, honest, and to avoid harmful plans. However, achieving this level of alignment in a highly capable autonomous model is an open research problem. There might not be a clear path to sufficient alignment. 
       - Answer: **no** (or "cannot determine"?). 

       Let's assume that we are not currently confident in achieving alignment for such a powerful system. Therefore, we answer **no** to having a clear path to measurable improvements that substantially reduce risk.

     - Recommendation: **Invest primarily in control measures.**

   However, note that the procedure says for step 4: if "no" then recommend control measures. But also note the caveat from step 2: if we couldn't determine, we proceed to step 4 and note hybrid. But we answered "no" in step 2 and then "no" in step 4. So the clear recommendation is control.

   But given the catastrophic potential, even if we don't have a clear alignment path, we might need to do both. However, the procedure does not specify that at step 4. Therefore, we follow the procedure: step 4 says if "no" then control. 

   However, we must note that the procedure in step 2 had an option for "cannot determine" leading to a note about hybrid. We did not take that branch. But in step 4, if we had said "cannot determine", it would hand off to human judgment. We said "no" in step 4.

   Therefore, for case (b): **Invest primarily in control measures.**

   But note: the procedure might be too rigid. In practice, for catastrophic risks, even if alignment is hard, we might still want to invest in both. However, the procedure as written does not capture that. We are following the steps.

   Alternatively, we can reconsider step 4 for case (b): 
     - The question is: "Is there a clear path to achieving measurable improvements in alignment ... that would substantially reduce the risk?" 
     - We might argue that even if we don't have a clear path to perfect alignment, we can still get some improvements (e.g., via honesty training) that would help. But the question says "substantially reduce". In the context of catastrophic risk, we require a very high level of reduction. Without a clear path to that, we might answer "no".

   So we stick with the initial answer: control.

   However, note that the procedure has an exception: if at any step we identify known dangerous capabilities, we jump to step 2. For case (b), the model has high autonomy and capability, so we already started at step 1 and went to step 2.

   Therefore, the recommendations are:

   Case (a): alignment
   Case (b): control

   But note that in case (b), we might also want to invest in alignment because control alone might be insufficient. The procedure does not cover this nuance. Therefore, we must note that the procedure is a guide and human judgment should be applied when there are uncertainties. However, for the purpose of this exercise, we follow the steps as written.

   We can adjust the procedure to account for the need for both in catastrophic scenarios? But the procedure as specified does not. Only step 2 with "cannot determine" leads to a note for hybrid, and step 6 with "no" also leads to a note for hybrid. We did not hit those.

   Alternatively, we can add an explicit step for catastrophic scenarios that require both? But the current procedure does not.

   So we output the procedure and then the case results as above.
answer: |-
  ### Decision Procedure for Safety Investment

  #### Step 1: Assess Deployment Criticality  
  **Question**: Could a single failure cause irreversible/catastrophic harm (e.g., physical damage, existential risk, major geopolitical destabilization)?  
  **Sufficient answer**:  
  - **Yes**: Proceed to Step 2.  
  - **No**: Proceed to Step 3.  
  - **Cannot determine**: Hand off to human judgment (document uncertainty and worst-case assumptions).  

  #### Step 2: Evaluate Controllability of Catastrophic Failure  
  **Question**: Can control measures reduce catastrophic failure probability to near-zero *without* alignment (e.g., air-gapped sandbox, strict output validation, no I/O channels for harm)?  
  **Sufficient answer**:  
  - **Yes**: **Recommend control measures**. Stop.  
  - **No**: **Recommend alignment measures**. Stop.  
  - **Cannot determine**: **Prescribe both** (prioritize controls for immediate mitigation, alignment for long-term). Stop.  

  #### Step 3: Assess Likelihood of High-Stakes Failures  
  **Question**: Are high-stakes failures (e.g., legal liability, major reputational damage) likely to occur frequently (e.g., >1% of interactions)?  
  **Sufficient answer**:  
  - **Yes**: Proceed to Step 4.  
  - **No**: Proceed to Step 5.  
  - **Cannot determine**: Proceed to Step 4 (assume high frequency conservatively).  

  #### Step 4: Test Alignment Feasibility  
  **Question**: Is there empirical evidence that alignment techniques (e.g., honest reasoning, interpretability) can reduce *deployment-specific* risks by >50% with available resources?  
  **Sufficient answer**:  
  - **Yes**: **Recommend alignment measures**. Stop.  
  - **No**: **Recommend control measures**. Stop.  
  - **Cannot determine**: **Prescribe both** (split resources equally). Stop.  

  #### Step 5: Default Recommendation  
  **Question**: Are failures primarily low-cost (e.g., user inconvenience, minor errors)?  
  **Sufficient answer**:  
  - **Yes**: **Recommend control measures** (cost-effective for low-stakes). Stop.  
  - **No**: Hand off to human judgment (reevaluate Steps 1–4).  

  ---

  ### Case Applications  
  #### Case (a): Coding Assistant in IDE (File/Network Access)  
  1. **Step 1**: Single failure (e.g., malware injection) could cause data loss or ransomware, but not *catastrophic* (e.g., no mass casualties). → **No**.  
  2. **Step 3**: High-stakes failures (e.g., deleting critical files) are frequent (common user errors). → **Yes**.  
  3. **Step 4**: Alignment feasible (e.g., RLHF for refusal of dangerous commands; benchmarks show 80% reduction in harmful code). → **Yes**.  
  **Recommendation**: **Alignment measures** (e.g., honesty training, refusal tuning).  

  #### Case (b): Autonomous Research Agent (Web/Code Execution)  
  1. **Step 1**: Single failure could be catastrophic (e.g., spreading malware at scale, self-replication). → **Yes**.  
  2. **Step 2**: Controls *cannot* guarantee near-zero failure (web access/sandbox escapes possible; novel code execution is unpredictable). → **No**.  
  **Recommendation**: **Alignment measures** (e.g., corrigibility training, process-based feedback).  

  ---  
  **Procedure Notes**:  
  - Time limit: Enforce strict 10-min timeboxes per step.  
  - Handoff triggers: Ambiguity in catastrophic potential (Step 1) or alignment efficacy (Step 4).  
  - Hybrid prescription: Only when catastrophic risk controllability is uncertain (Step 2) or alignment feasibility is unclear (Step 4).
