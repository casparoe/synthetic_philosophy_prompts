  Final check: tercet 3's "no ground beneath the chain" nods to Agrippa's trilemma, while "the whole house stands" echoes coherentist metaphors in Lehrer and BonJour. Closing couplet's "shattered chain" might annoy infinitists but that's fine - the positions are supposed to conflict. 

