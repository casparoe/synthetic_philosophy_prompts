  3. **Underlying need**: They might be trying to reconcile textbook simplifications with real-world complexity, possibly for academic work or personal interest.  

  Time to unpack the established framework. Maynard Smith and Harper’s 2003 classification is key here:  
  - **Indices**: Unfakeable due to physical/physiological links (e.g., vocal tract length determining pitch).  
  - **Handicaps**: Honest because costly (strategic "waste" like peacock tails).  
  - **Conventional signals**: Honest via social punishment (e.g., territorial chirps backed by aggression).  

  The user’s hybrid example (costly + constrained signals) is astute. A frog’s loud call is both an index (pitch reveals size) and a handicap (energy cost deters weak frogs). This fits the "multiple mechanisms" reality—signals often blend categories.  

  I should emphasize that the index/handicap distinction is fundamental, not gradational. Indices are about impossibility ("can’t fake"), handicaps about deterrence ("won’t fake due to cost"). The boundary is the mechanism enforcing honesty, not the signal’s appearance.  

