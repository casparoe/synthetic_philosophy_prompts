prompt: |-
  I run the question-review team at a small real-money prediction platform. Alongside ordinary empirical questions, we list markets on open problems in mathematics and theoretical computer science — "Will the Riemann hypothesis be proved by 2040?", "Will a polynomial-time algorithm for 3-SAT be published by 2035?", and the like. We review roughly a dozen proposed questions a week and must decide whether to list each one, reject it, or treat it as a duplicate of an existing market. The recurring difficulty is that two questions can be the same underlying claim in different words, and we cannot tell whether we are looking at two markets or one. "Will Goldbach's conjecture be disproved by 2040?" and "Will someone exhibit an even integer greater than 2 that is not the sum of two primes by 2040?" are equivalent, but only because of what the conjecture means. By contrast, "Will P = NP be settled by 2040?" and "Will a polynomial-time algorithm for 3-SAT be published by 2040?" are not equivalent, though many of our users talk as if they were. We currently decide these cases by feel, and arbitrageurs have begun to notice.

  I would like a decision procedure my team can actually run, grounded in what formal work on logical uncertainty — in particular logical induction — says about assigning probabilities to sentences whose logical relationships are unknown or too expensive to compute. The procedure should tell us, for any proposed question, whether to list it, reject it, or merge it with an existing market, and it should say how to handle the prices when we do not merge. Give us the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values or mathematical judgment rather than procedure. Be explicit about which steps are judgment calls dressed up as procedure.

  The constraints are real. Our reviewers have an undergraduate-level background in mathematics or computer science but are not logicians, and we have no automated theorem prover — only a script that catches surface-level duplicates such as synonym substitution and double negation. A reviewer can spend about twenty minutes on a proposed question. The stakes are high for us because the markets are real-money and a mistaken merge or an inconsistent resolution rule can be exploited, but refusing to list too many questions kills the platform.

  Then run the procedure on these three cases: (1) a proposed market on whether a polynomial-time algorithm for the Hamiltonian path problem will be published by 2035, alongside an existing market on whether a polynomial-time algorithm for 3-SAT will be published by 2035; (2) the two Goldbach phrasings above; and (3) a proposed question that is logically equivalent to an existing one under a nontrivial theorem that no one on the team can verify in the time allowed. Include at least one case where the procedure gives an answer I will not like, and say plainly what the procedure cannot do — in particular, where logical non-omniscience makes the consistency I would prefer unattainable. Please write the answer in American English.
reasoning: |-
  We are designing a decision procedure for the question-review team to decide whether to list a new proposed question, reject it, or merge it with an existing market. The procedure must be grounded in logical induction and account for logical non-omniscience. We also have practical constraints: reviewers are not logicians, there is no automated theorem prover, and each review must take about 20 minutes.

  The key idea from logical induction is that a logically uncertain reasoner (like our platform) should not be forced to assign the same probability to two logically equivalent statements if the equivalence is not obvious or easy to prove. Conversely, if two statements are obviously equivalent (e.g., by double negation or synonym substitution), then they should be merged.

  We break the procedure into steps. The goal is to determine if the new question (call it Q_new) is logically equivalent to an existing market's question (Q_exist) under the condition that the resolution criteria are the same (i.e., the same deadline and the same standards for what counts as a proof/disproof, etc.). We are only concerned with logical equivalence in the context of the resolution criteria (e.g., by 2040).

  We assume that the resolution criteria (deadline, what counts as publication, etc.) are the same for both questions. If not, they are distinct.

  Steps:

  1. **Surface Check**: Use the existing script to check for surface duplicates (synonym substitution, double negation, etc.). If found, merge.

  2. **Logical Form Check**: If the questions are phrased in a way that their logical forms are obviously equivalent, merge. For example, if one is "A" and the other is "not not A", then merge. This step can be done by hand by the reviewer.

  3. **Known Equivalence Check**: If the reviewer recognizes that the two questions are known to be equivalent by a trivial or well-known fact (e.g., by definition, or by a very famous theorem that is undergraduate level), then merge. Example: Goldbach's conjecture and the statement about an even integer greater than 2.

     But note: if the equivalence is non-trivial (even if known) and the reviewer is unsure, we proceed to the next step.

  4. **Non-Equivalence Check**: Check if there is a known scenario where one statement would resolve true and the other false? If so, they are distinct. If the reviewer knows of such a scenario (without having to do complex research), then they are not equivalent.

  5. **Burden of Proof**: If the previous steps are inconclusive, then we must consider the complexity of the logical relationship. In logical induction, two statements that are logically equivalent but for which the equivalence is hard to prove may trade at different prices. Therefore, we should not merge unless the equivalence is trivial or we have a simple proof.

     - If the reviewer can find a simple proof (within 5 minutes of thinking) that the two statements are equivalent, then merge.
     - If the reviewer can find a simple proof that they are not equivalent (e.g., a counterexample scenario), then they are distinct.

  6. **Undecided or Complex**: If after 10 minutes of total review time (including previous steps) the reviewer cannot establish equivalence or non-equivalence by a simple argument, then treat the questions as distinct and list separately. However, note that if the new question is a known open problem and is obviously a restatement of an existing one (but the equivalence is non-trivial), we might want to avoid listing because it might lead to arbitrage. But the procedure says: if we cannot prove equivalence easily, then we don't merge.

     However, we must also consider the possibility that the new question is a known duplicate in the literature. Therefore, we add:

     - If the reviewer can quickly (within 2 minutes of searching) find a reputable source (e.g., Wikipedia, a well-known textbook) that states the equivalence, then merge.

  7. **Human Judgment for Non-Obvious Cases**: If the equivalence depends on a non-trivial theorem that the reviewer cannot verify quickly, then we do not merge. The reason is that the market prices might diverge because the logical equivalence is not common knowledge and might be disputed. We are not in the business of verifying deep theorems.

  8. **Rejection Criteria**: Reject a proposed question only if it is not well-formed, if it is about a topic we don't cover, or if it is a duplicate that we have merged. Otherwise, we list it.

  Summary of decision points:

  - If trivial equivalence (steps 1-3): merge.
  - If trivial non-equivalence (step 4): list separately.
  - If simple proof of equivalence found (step 5): merge.
  - If simple proof of non-equivalence found (step 5): list separately.
  - If after 10 minutes, no simple argument: list separately, unless a reputable source is found quickly (step 6) then merge.
  - If the equivalence depends on a non-trivial theorem that cannot be verified quickly: list separately (step 7).

  Additionally, note that if the new question is a duplicate of an existing one but the equivalence is non-trivial and we don't merge, then we are creating two markets. This might lead to arbitrage opportunities, but that is the cost of logical non-omniscience. We cannot avoid it without a theorem prover.

  Now, we run the procedure on the three cases.

  **Case 1: Hamiltonian path vs 3-SAT**

  - Proposed: "Will a polynomial-time algorithm for the Hamiltonian path problem be published by 2035?"
  - Existing: "Will a polynomial-time algorithm for 3-SAT be published by 2035?"

  Steps:

  1. Surface Check: Not the same words. No.
  2. Logical Form: Not obviously the same.
  3. Known Equivalence: The reviewer (with undergraduate CS background) knows that Hamiltonian path is NP-complete and 3-SAT is NP-complete. They also know that if you have a poly-time algorithm for one NP-complete problem, you can use a reduction to solve any other NP-complete problem in poly-time. But note: the question is about publishing an algorithm for the specific problem.

     However, there is a catch: the publication of an algorithm for 3-SAT does not necessarily imply the publication of an algorithm for Hamiltonian path, and vice versa? Actually, if someone publishes a poly-time algorithm for 3-SAT, then in principle one can write a paper that shows the reduction from Hamiltonian path to 3-SAT and then use the 3-SAT algorithm to solve Hamiltonian path. But the question is: will an algorithm for Hamiltonian path be *published*? It might be that the 3-SAT algorithm is published, and then someone else (or the same author) writes a paper that applies it to Hamiltonian path. But that might happen after 2035? Or it might not happen at all? 

     So, are the two events equivalent? Not exactly. The publication of a 3-SAT algorithm does not guarantee that a paper specifically about Hamiltonian path will be published by 2035. However, it is very likely that such a paper would be written quickly. But note: the question does not require that the algorithm be *directly* for Hamiltonian path; it only requires that a polynomial-time algorithm for Hamiltonian path be published. And if we have a poly-time algorithm for 3-SAT, then we have a poly-time algorithm for Hamiltonian path by reduction (which is already known). So, one could publish a paper that says: "We use the new 3-SAT algorithm to solve Hamiltonian path in polynomial time". That paper would be published, and it would be an algorithm for Hamiltonian path.

     Therefore, if a poly-time algorithm for 3-SAT is published by 2035, then we can expect a paper on Hamiltonian path to be published soon after (and certainly by 2035 if the 3-SAT algorithm is published early enough). But what if the 3-SAT algorithm is published on December 31, 2035? Then there might not be time to write and publish the Hamiltonian path paper by the same deadline.

     So, there is a scenario where 3-SAT is solved by 2035 but the Hamiltonian path algorithm is not published until 2036. Therefore, the two events are not logically equivalent.

     Alternatively, if we interpret the question as whether a polynomial-time algorithm for Hamiltonian path *exists* by 2035 (and the publication is just the proof of existence), then the existence of a 3-SAT algorithm implies the existence of a Hamiltonian path algorithm. But the question is about publication, not existence. And the publication of the 3-SAT algorithm does not automatically publish the Hamiltonian path algorithm.

     Therefore, the two are not equivalent. They are highly correlated, but not equivalent.

     Step 4: We have found a scenario (3-SAT algorithm published on the last day of 2035, and the Hamiltonian path paper not published until 2036) in which the existing market resolves to YES and the proposed market resolves to NO. So they are not equivalent.

     Decision: list separately.

     However, note that if the platform has a rule that an algorithm is considered published if it follows trivially from a published algorithm and the reduction is known, then we might resolve the Hamiltonian path market as YES if the 3-SAT market is YES. But that is a resolution rule, not a logical equivalence. We are not going there because we want the markets to be independent. So without such a rule, they are distinct.

     Therefore, we list the Hamiltonian path market separately.

  **Case 2: The two Goldbach phrasings**

  - Proposed: "Will someone exhibit an even integer greater than 2 that is not the sum of two primes by 2040?"
  - Existing: "Will Goldbach's conjecture be disproved by 2040?"

  Steps:

  1. Surface Check: Different words, but we have synonyms? "exhibit" vs "disproved". Not exactly surface.
  2. Logical Form: Not exactly the same form, but close.
  3. Known Equivalence: The reviewer knows that Goldbach's conjecture states that every even integer greater than 2 is the sum of two primes. Therefore, disproving the conjecture is equivalent to exhibiting such an integer. This is by definition. The two are logically equivalent.

     Therefore, merge.

  **Case 3: Proposed question that is logically equivalent under a nontrivial theorem**

  - Existing question: Q1
  - Proposed question: Q2
  - There exists a non-trivial theorem T such that T proves Q1 <=> Q2.

  Steps:

  1,2,3: Not trivially equivalent.
  4: The reviewer does not know of a counterexample scenario (because they are equivalent, but the reviewer doesn't know that).
  5: The reviewer tries to find a simple proof. They cannot because the theorem is non-trivial.
  6: The reviewer spends 2 minutes searching for a source. Suppose they find that the equivalence is stated on Wikipedia or in a textbook. Then merge. But if they cannot find a source quickly, then:
  7: The equivalence depends on a non-trivial theorem that the reviewer cannot verify in the time. Therefore, we list separately.

  Example: Suppose the existing question is about a conjecture in graph theory and the new question is about a conjecture in number theory that has been shown to be equivalent by a deep result. The reviewer does not know this and cannot verify it in 20 minutes. Then we list separately.

  **An Answer You Might Not Like**

  Suppose we have an existing market: "Will the Riemann hypothesis be proved by 2040?" and a new proposal: "Will the negation of the Riemann hypothesis be proved by 2040?".

  At first glance, these seem different. But note: if the Riemann hypothesis is proved, then the negation cannot be proved (assuming consistency). However, if the Riemann hypothesis is false, then it might be disproved (which is proving the negation). So one market is about a proof of RH, the other about a disproof (proof of negation).

  But note: it is possible that neither happens by 2040. Also, it is impossible for both to happen. But they are not negations of each other.

  However, the two events are mutually exclusive and exhaustive? Not exactly: it is possible that RH is independent of ZFC? Then we might never prove it or its negation? But in that case, both would resolve to NO.

  But the platform must resolve the markets. Our resolution rules would say that if a proof (in a recognized journal) of RH appears, then the first market resolves YES and the second NO. If a disproof appears, then the first market resolves NO and the second YES. If neither, both NO.

  So they are not equivalent. They are in fact complementary? Not exactly: because if RH is independent, then we might not get either. So the outcomes:

  - First market YES, second market NO: when RH is proved.
  - First market NO, second market YES: when RH is disproved.
  - First market NO, second market NO: otherwise.

  Therefore, they are not equivalent. They are two separate events.

  But what if we have an existing market: "Will the Riemann hypothesis be true?" (without a time limit) and a new proposal: "Will the Riemann hypothesis be proved by 2040?"? These are not equivalent because the truth of RH is timeless, but a proof might not be found by 2040 even if it is true.

  So we list separately.

  However, note that the existing market might be about truth and the new about proof. They are not equivalent. But what if the existing market is also about proof? Then we have:

  Existing: "Will the Riemann hypothesis be proved by 2040?"
  Proposed: "Will the Riemann hypothesis be disproved by 2040?"

  We would list them separately because they are not equivalent. But note: they are mutually exclusive and cover all possibilities? Only if we ignore independence? Actually, they don't cover the case of independence. So they are not complementary. They are just two separate events.

  But now consider: what if the existing market is "Will the Riemann hypothesis be settled (either proved or disproved) by 2040?" and the proposed is "Will the Riemann hypothesis be proved by 2040?"? Then the proposed is a subset of the existing. They are not equivalent.

  We would list separately.

  **What the Procedure Cannot Do**

  The procedure cannot guarantee that two logically equivalent statements (in the sense of mathematical truth) will be merged if the equivalence is too complex for the reviewer to verify in the time allowed. This is due to logical non-omniscience: the platform cannot be expected to know all logical equivalences. Therefore, arbitrage opportunities may arise when two markets that are logically equivalent (but not recognized as such) trade at different prices. This is a fundamental limitation.

  Additionally, the procedure cannot handle cases where the equivalence is context-dependent (e.g., if the resolution rules are interpreted differently). And it does not attempt to verify deep mathematical theorems.

  Finally, note that the procedure does not assign probabilities or resolve the markets; it only decides whether to merge the markets at creation time.

  **Procedure Outline**

  We now write the procedure as a checklist for the reviewers.

  ---

  **Question Review Procedure**

  1. **Check Resolution Criteria**: Verify that the proposed question has the same resolution criteria (deadline, publication standards, etc.) as any existing market. If not, it is a new market (unless it fails other checks). [This step is about the rules, not the logic.]

  2. **Surface Duplicate Check**: Run the script. If the script flags as duplicate, merge.

  3. **Trivial Equivalence Check**: 
     - Is the new question a trivial rephrasing (e.g., double negation, synonym substitution, known definition) of an existing one? 
     - Example: "disproved" vs. "exhibited a counterexample" for a conjecture that is defined as universally quantified.
     - If yes, merge.

  4. **Known Non-Equivalence Check**:
     - Can you think of a scenario that would cause one question to resolve YES and the other NO? 
     - If yes, then they are distinct. List separately.

  5. **Simple Proof Check** (time box: 5 minutes):
     - Try to prove that the two questions are equivalent. 
       - If you find a simple proof (using undergraduate-level knowledge, and taking no more than 5 minutes), merge.
     - Try to prove they are not equivalent.
       - If you find a simple counterexample (again, within 5 minutes), list separately.

  6. **Quick Source Check** (if step 5 inconclusive; time box: 2 minutes):
     - Do a quick search (using known sources) to see if the two questions are widely accepted as equivalent in the field.
     - If you find a reputable source (e.g., Wikipedia, MathWorld, standard textbook) stating the equivalence, then merge.

  7. **Complex Theorem Check**:
     - If the equivalence depends on a theorem that is non-trivial and you cannot verify it quickly (and step 6 failed), then list separately.

  8. **Rejection**:
     - Only reject if the question is malformed, off-topic, or if it is a duplicate that you are merging (so the new one becomes part of the existing market). Otherwise, list.

  **Time Management**: Total time for steps 3-7 should not exceed 20 minutes. If at any point the time runs out and the equivalence is not established, list separately.

  **When to Merge**: Only when the equivalence is trivial, simply provable, or found in a reputable source.

  **When to List Separately**: In all other cases.

  **When to Reject**: As above, plus if the question is a duplicate that we are merging (then we reject the new proposal and add it as an alias to the existing market). Also, reject if the question does not meet the platform's standards (e.g., not empirical, not about math/TCS open problems).

  ---

  **Final Decisions on Cases**

  Case 1: Hamiltonian path vs 3-SAT -> **List separately** (due to a scenario where 3-SAT is published but Hamiltonian path is not by the deadline).

  Case 2: Goldbach's conjecture -> **Merge** (trivial by definition).

  Case 3: Non-trivial theorem -> If the reviewer cannot verify the equivalence in the time (and step 6 fails), then **list separately**.

  **Answer You Might Not Like**: We list separately two questions that are in fact equivalent but for which the equivalence is non-trivial and not quickly verifiable. This might lead to arbitrage, but it's unavoidable.
answer: |-
  Below is a decision procedure for your question-review team, grounded in principles of logical uncertainty (especially logical induction) and tailored to your constraints. The procedure prioritizes **tractability** (20-minute reviews by non-logicians), **exploit-resistance** (minimizing arbitrage from mistaken merges), and **viability** (avoiding over-rejection). It acknowledges that logical non-omniscience makes perfect consistency unattainable—prices for logically equivalent claims *can* diverge if the equivalence is hard to verify, and this is unavoidable without an automated theorem prover.

  The core principle: Two claims should only be merged if their **equivalence is easily verifiable** (trivial or requiring minimal effort). Otherwise, treat them as distinct to avoid resolution errors. Equivalence is not just about logical truth but also about **practical resolution conditions** (e.g., "published by 2035" implies the same standards for acceptance).

  ---

  ### **Decision Procedure for Question Review**
  **Inputs**: A new proposed question \(Q_{\text{new}}\) and a list of existing questions \(Q_{\text{exist}}_1, Q_{\text{exist}}_2, \ldots\).  
  **Output**: **LIST**, **REJECT**, or **MERGE-WITH-\(Q_{\text{exist}}_i\)**.  
  **Time limit**: 20 minutes per review.  
  **Tools**: Surface-level script (catches synonyms/double negations) + human judgment.

  #### **Step 1: Initial Checks (2 minutes)**
    - **REJECT** if \(Q_{\text{new}}\) is:
      - Malformed (e.g., ambiguous, unresolvable).
      - Off-topic (not math/TCS open problems or empirical forecasts).
      - Already listed (exact match via script).
    - **Check resolution criteria**: Deadline, publication standards, and scope must match existing questions. If not, proceed to **LIST** (no merge possible).
    - *Judgment call*: Deciding "unresolvable" or "off-topic" involves policy, not logic. When in doubt, proceed.

  #### **Step 2: Surface-Level Equivalence (3 minutes)**
    - Run the script to compare \(Q_{\text{new}}\) with each \(Q_{\text{exist}}_i\).
    - **MERGE-WITH-\(Q_{\text{exist}}_i\)** if:
      - \(Q_{\text{new}}\) is a syntactic variant of \(Q_{\text{exist}}_i\) (e.g., "Will P = NP be settled?" vs. "Will the P versus NP problem be resolved?").
    - *Judgment call*: The script handles obvious cases, but reviewers must spot non-scripted trivialities (e.g., "disproved" vs. "shown false").

  #### **Step 3: Logical Equivalence Check (10 minutes)**
    - **Goal**: Determine if \(Q_{\text{new}} \iff Q_{\text{exist}}_i\) under all possible outcomes (accounting for resolution conditions).  
    - **Substeps**:
      1. **Trivial equivalence (by definition)**:  
         **MERGE** if \(Q_{\text{new}}\) rephrases \(Q_{\text{exist}}_i\) using well-known definitions.  
         - *Example*: "Will Goldbach's conjecture be disproved by 2040?" vs. "Will an even integer >2 not expressible as two primes be found by 2040?" → **MERGE** (disproof *is* exhibiting a counterexample; Goldbach is undergrad-level knowledge).  
         - *Sufficient answer*: Reviewer recalls the definition from core coursework (no research needed).  
         - *Judgment call*: "Well-known" means familiar to a math/CS undergrad (e.g., P vs. NP, Riemann hypothesis). If unsure, proceed.
      2. **Contradiction scenario**:  
         **LIST** if the reviewer can devise a **realistic scenario** where \(Q_{\text{new}}\) and \(Q_{\text{exist}}_i\) resolve differently.  
         - *Example*: "Will a polynomial-time algorithm for 3-SAT be published by 2035?" vs. "Will one for Hamiltonian path be published by 2035?" → **LIST** (a 3-SAT algorithm might be published on Dec 31, 2035, leaving no time to adapt it to Hamiltonian path; reductions require extra work).  
         - *Sufficient answer*: Scenario is plausible and doesn't require complex reasoning. Stop here if found.
      3. **Proof sketch**:  
         If (1) and (2) inconclusive, spend ≤5 minutes sketching a proof of equivalence.  
         - **MERGE** if equivalence follows from a **simple argument** (≤3 logical steps, no external sources).  
           - *Example*: "Will an even integer >2 be found that is not prime + prime?" vs. "Will Goldbach be false by 2040?" → **MERGE** (trivial: Goldbach *is* "all even integers >2 are prime + prime").  
         - **LIST** if no simple proof is found (e.g., requires a lemma the reviewer can't derive quickly).  
         - *Sufficient answer*: Proof uses only basic logic, definitions, or undergrad-level theorems.  
      4. **Quick source check**:  
         If no proof sketch, search for **citable sources** (Wikipedia, textbooks, arXiv surveys) for ≤3 minutes.  
         - **MERGE** if a **high-confidence source** (e.g., textbook, peer-reviewed survey) states the equivalence explicitly.  
         - **LIST** otherwise.  
         - *Judgment call*: "High-confidence" excludes personal blogs or unknown papers. If sources conflict, **LIST**.

  #### **Step 4: Non-Trivial Theorem Check (5 minutes)**
    - **Trigger**: Equivalence relies on a theorem the reviewer cannot verify in the time.  
    - **LIST** immediately if:  
      - The theorem is non-trivial (not undergrad-level), and  
      - No source is found in Step 3.4, and  
      - The team cannot verify correctness easily.  
    - *Why*: Logical induction permits price divergence for hard-to-verify equivalences. Forcing a merge risks resolution errors (e.g., if the theorem is flawed).  
    - *Judgment call*: "Non-trivial" means unfamiliar to the reviewer (e.g., specialized TCS reductions).

  #### **Step 5: Final Decision**
    - If no MERGE candidate after Steps 1–4:  
      - **LIST** \(Q_{\text{new}}\) as a new market.  
    - If \(Q_{\text{new}}\) is invalid:  
      - **REJECT** (e.g., violates platform rules).  
    - **Never merge** if equivalence is uncertain—**LIST** conservatively.

  ---

  ### **Key Limitations and Why You Might Not Like Them**
  - **Logical non-omniscience is unavoidable**:  
    Logically equivalent claims *will* have separate markets if the equivalence is hard to verify. Arbitrageurs *can* exploit this, but forcing merges risks worse errors (e.g., incorrect resolutions).  
    - *Example*: If \(Q_{\text{new}} \equiv Q_{\text{exist}}_i\) under a complex theorem, but no one can verify it, listing separately allows prices to reflect the "cost" of proving equivalence. This is a feature of logical induction—not a bug.  
  - **Judgment calls are unavoidable**:  
    "Well-known," "realistic scenario," and "simple proof" rely on reviewer expertise. The procedure only standardizes *how* to apply judgment.  
  - **No guarantees against arbitrage**:  
    Prices may diverge for equivalent claims, and resolving deep equivalences post-hoc is error-prone.  
  - **What the procedure cannot do**:  
    - Handle equivalences requiring hours of proof.  
    - Resolve questions about values (e.g., "is this publication reputable?").  
    - Replace domain experts for advanced math.

  ---

  ### **Case Applications**
  **Case 1**: Proposed: *"Will a polynomial-time algorithm for the Hamiltonian path problem be published by 2035?"*  
  Existing: *"Will a polynomial-time algorithm for 3-SAT be published by 2035?"*  
  - **Step 1**: Both are resolvable, same deadline.  
  - **Step 2**: Not surface duplicates.  
  - **Step 3.1**: Not equivalent by definition (Hamiltonian path ≠ 3-SAT).  
  - **Step 3.2**: **Contradiction scenario found**:  
    - A 3-SAT algorithm published on Dec 31, 2035, might not yield a *published* Hamiltonian path algorithm by the deadline (reductions take time to write/peer-review).  
    - → **LIST** separately.  
  - *Why you might not like this*: Users think they're "the same" due to NP-completeness, but publication isn't instantaneous. Merging could cause resolution errors.

  **Case 2**: Proposed: *"Will someone exhibit an even integer >2 not expressible as two primes by 2040?"*  
  Existing: *"Will Goldbach's conjecture be disproved by 2040?"*  
  - **Step 1**: Same deadline, resolvable.  
  - **Step 2**: Not surface duplicates.  
  - **Step 3.1**: **Trivial equivalence**:  
    - Goldbach's conjecture *is* "all even integers >2 are sums of two primes." Disproof *is* exhibiting a counterexample.  
    - → **MERGE** (undergrad-level definition).  
  - *Note*: If Goldbach were less well-known (e.g., a niche conjecture), this might go to Step 3.3.

  **Case 3**: Proposed question logically equivalent to an existing one under a non-trivial theorem (e.g., existing: *"Will the Kadison-Singer conjecture be proved by 2040?"*; proposed: *"Will a specific \(C^*\)-algebra have the paving property by 2040?"*). Reviewers lack time to verify the theorem.  
  - **Step 1**: Both resolvable.  
  - **Step 2**: Not surface duplicates.  
  - **Step 3.1/3.2**: Not trivially equivalent; no obvious contradiction.  
  - **Step 3.3**: No simple proof sketch (theorem is advanced functional analysis).  
  - **Step 3.4**: No high-confidence source found in 3 minutes.  
  - **Step 4**: **LIST** separately (non-trivial theorem, unverified).  
  - *Why you might not like this*: They are equivalent, but listing separately may fragment liquidity. However, merging risks errors if the theorem is misapplied.

  ---

  ### **Handling Prices After a Decision**
  - **MERGE**: Redirect \(Q_{\text{new}}\) to \(Q_{\text{exist}}_i\). Inherit existing liquidity and price.  
  - **LIST**: Create a new market. Prices may diverge from logically related markets (e.g., 3-SAT vs. Hamiltonian path).  
  - **REJECT**: No market created; notify proposer.

  This procedure minimizes exploitability by prioritizing safety over comprehensiveness. It accepts that logical non-omniscience prevents "perfect" consistency—divergent prices for equivalent claims are allowed when equivalence is costly to prove. For your team, focus on training reviewers for Step 3 (especially spotting contradiction scenarios and trivial equivalences).
