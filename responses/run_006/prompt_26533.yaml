prompt: |-
  I'm taking this seminar on the epistemology of conspiracy theories and my professor has been wierdly consistent all semester about which things she calls "conspiracy theories" and which she doesn't, but she refuses to just give us the rule. Here's her track record so far:

  She calls these conspiracy theories: the moon landing was faked, 9/11 was an inside job, QAnon, the 2020 election was stolen through coordinated fraud, and that vaccines contain government tracking devices. She says these are NOT conspiracy theories: MKUltra, the tobacco industry's cancer coverup, the NSA's warrantless surveillance program (even back when Snowden hadn't leaked yet and it was just an allegation), and COINTELPRO. Then there are the cases that really threw me. She says Watergate was a real conspiracy but insists "conspiracy theory" is the wrong label for it—she calls it a "documented criminal conspiracy." And when someone brought up the idea that the Iraq War was really about oil, not WMDs, she called that a "geopolitical analysis," not a conspiracy theory, even though it involves government deception.

  Next week's case is about the belief that major social media platforms coordinate with each other and with state actors to shape public discourse—suppressing some views, boosting others, with the effect of managing what counts as acceptable opinion. She hasn't tipped her hand on this one.

  I'm trying to figure out what rule she's running. It can't just be "secret plots by powerful groups" because MKUltra and COINTELPRO were exactly that and she excludes them. It can't just be "false beliefs" because she classified the pre-Snowden NSA surveillance belief as not a conspiracy theory even when its truth was still uncertain. I have a hunch it's something about the epistemic practices involved—like whether the belief is held in a way that's self-sealing against counterevidence—but I can think of at least two other rules that fit her verdicts equally well. What are the candidate rules, what does each predict about the social media case, which one do you think she's actually running, and what further case would cleanly tell them apart?
reasoning: |-
  Okay, the user is in an epistemology seminar focusing on conspiracy theories and is trying to figure out their professor's classification rule. The professor has been consistent in labeling some theories as conspiracy theories while excluding others, but hasn't explicitly stated the rule. The user has observed several examples and needs help identifying the underlying principle.

  Looking at the examples provided, the user notes that the professor classifies theories like the moon landing being faked or QAnon as conspiracy theories, while excluding documented cases like MKUltra or COINTELPRO. Even when something was an allegation before being proven (like NSA surveillance), the professor didn't call it a conspiracy theory. Watergate is called a "documented criminal conspiracy" rather than a conspiracy theory, and the Iraq War being about oil is termed "geopolitical analysis."

  The user has considered several possible rules. The first is the "Epistemic Closure and Self-Sealing" rule, which focuses on how the belief is maintained. Conspiracy theories here resist falsification and use ad-hoc reasoning to dismiss counterevidence. The second is "Epistemic Status and Evidence Threshold," which depends on whether there's credible evidence and the burden of proof has been met. The third is "Epistemic Responsibility and Institutional Anchoring," where beliefs tied to legitimate institutions or responsible methodologies aren't conspiracy theories.

  For the social media case—where platforms coordinate with state actors to shape discourse—each rule predicts differently. The first rule would classify it as a conspiracy theory if proponents dismiss counterevidence, the second depends on the evidence presented, and the third would look at whether the claim is made through responsible channels like academic research.

  I think the professor is likely using the first rule, Epistemic Closure, because it aligns with epistemological concerns about how beliefs are held. To test this, a case where a well-evidenced claim is dismissed irrationally vs. a speculative claim handled responsibly could distinguish the rules.
answer: |-
  Based on your professor's pattern, her rule isn't about the *content* (secret plots by powerful groups) or the *truth value* (false beliefs), but about the **epistemic structure and justification** of the claim. Here are the three strongest candidate rules that fit her past verdicts, their predictions for the social media case, which one I think she's using, and a test case:

  **Candidate Rule 1: Epistemic Closure & Self-Sealing Mechanisms (Your Hunch)**
  *   **Definition:** A belief is labelled a "conspiracy theory" if its core justification relies on *epistemically closed reasoning* that is *systematically resistant to counterevidence* through self-sealing mechanisms (e.g., "disproof is proof of the cover-up," dismissing all dissent as paid shills, requiring impossible levels of proof).
  *   **Fits Past Verdicts:**
      *   **CTs:** Moon landing, 9/11 inside job, QAnon, Election fraud, Vaccine trackers - All notoriously resistant to mountains of counterevidence, using self-sealing logic.
      *   **Non-CTs:** MKUltra, Tobacco coverup, NSA surveillance (pre-Snowden), COINTELPRO - While initially secret/alleged, they were/are investigated using standard evidence-based methods (FOIA, journalism, whistleblowers, official inquiries). Counterevidence *could* potentially falsify them without automatically proving a deeper conspiracy. Watergate fits here too – investigated via journalism and legal process.
      *   **Iraq War/Oil:** Framed as "geopolitical analysis" likely because critiques rely on interpreting motives, geopolitical patterns, and economic interests using established analytical frameworks, not primarily self-sealing logic against counterevidence about WMDs (though proponents can be dogmatic, the core claim *can* be debated evidentially).
  *   **Prediction for Social Media Case:** **Depends entirely on *how* the belief is held/argued.**
      *   If presented with evidence open to scrutiny, acknowledging counter-arguments about platform independence or algorithmic complexity, and grounded in observable patterns/content moderation policies, she **would NOT** call it a CT ("geopolitical/media analysis").
      *   If presented with claims impervious to counterevidence (e.g., "any moderation of my view *proves* coordination," "all researchers denying this are paid by Big Tech," "lack of leaked documents *proves* how deep it goes"), she **WOULD** call it a CT.

  **Candidate Rule 2: Epistemic Status & Evidence Threshold**
  *   **Definition:** A belief is labelled a "conspiracy theory" if it postulates a *currently active, large-scale secret conspiracy* **and** lacks *credible, publicly accessible evidence meeting a threshold of plausibility* for such a significant claim *at the time of labelling*. Once compelling evidence emerges via legitimate channels (investigative journalism, official inquiry, leaks), it transitions out of "conspiracy theory" status.
  *   **Fits Past Verdicts:**
      *   **CTs:** Moon landing, 9/11 inside job, QAnon, Election fraud, Vaccine trackers - Lack credible evidence meeting the threshold for claims of such massive, sustained secrecy involving thousands.
      *   **Non-CTs:** MKUltra, Tobacco, NSA (pre-Snowden), COINTELPRO, Watergate - Even pre-proof, allegations were based on credible sources (whistleblowers, patterns of evidence, investigative reporting) meeting a higher initial plausibility bar for *specific* secret actions (not necessarily the *full* extent alleged). They transitioned to "documented conspiracies" with proof.
      *   **Iraq War/Oil:** Not a *secret conspiracy* per se, but an alleged *hidden motive* for a public action. Evidence (geopolitical interests, oil company influence, previous wars) meets the plausibility threshold for motive analysis without requiring proof of a *secret plot*.
  *   **Prediction for Social Media Case:** **Likely WOULD call it a Conspiracy Theory.** Postulating ongoing, large-scale, *secret* coordination between multiple platforms *and* state actors to *manage acceptable opinion* is an extraordinary claim. While there's evidence of content moderation, lobbying, and state pressure, the *specific claim of secret coordination for opinion management* likely lacks publicly accessible evidence meeting the plausibility threshold for such a complex, ongoing conspiracy (analogous to pre-proof NSA surveillance allegations, but arguably even broader).

  **Candidate Rule 3: Epistemic Responsibility & Institutional Anchoring**
  *   **Definition:** A belief is labelled a "conspiracy theory" if it is primarily propagated *outside* legitimate epistemic institutions (academia, investigative journalism, intelligence with oversight) using methods deemed irresponsible (cherry-picking, ignoring context, relying on anonymous/tainted sources without verification), *or* if, even within those institutions, it fails to engage responsibly with counter-evidence. Claims investigated responsibly *within* or with methods *aligned with* such institutions avoid the label.
  *   **Fits Past Verdicts:**
      *   **CTs:** Moon landing, QAnon, Election fraud, Vaccine trackers - Primarily propagated via fringe media, social media, anonymous drops, lacking rigorous verification by established institutions. 9/11 inside job often falls here too.
      *   **Non-CTs:** MKUltra (Senate Church Committee), Tobacco (journalism, lawsuits), NSA (Snowden leaks validated by journalists), COINTELPRO (FOIA, Senate investigations), Watergate (journalism, Congress) - All uncovered or seriously investigated using institutional methods. Iraq War critique ("geopolitical analysis") is anchored in academic IR, policy analysis, and journalistic inquiry.
      *   **NSA Pre-Snowden:** The *allegation itself* was raised by some within institutional contexts (e.g., EFF lawsuits, skeptical journalists, Ron Paul in Congress), using responsible methods, even if proof was lacking.
  *   **Prediction for Social Media Case:** **Depends on the source and methodology.**
      *   If based on peer-reviewed research, major investigative journalism (e.g., based on internal leaks verified by reputable outlets), or policy analysis from think tanks using standard methods, she **would NOT** call it a CT.
      *   If primarily based on viral social media posts, anonymous "insiders," cherry-picked examples, or outlets known for irresponsible reporting, she **WOULD** call it a CT.

  **Which Rule Do I Think She's Running?**
  I believe **Candidate Rule 1 (Epistemic Closure & Self-Sealing)** is the most likely. It best explains:
  1.  **The Watergate Distinction:** She explicitly calls it a "documented criminal conspiracy," separating the *event* from the *epistemic label* "conspiracy theory," which focuses on the *way beliefs are held*.
  2.  **The Pre-Snowden NSA Classification:** Even without proof, the allegation could be investigated responsibly without inherent self-sealing mechanisms.
  3.  **The Iraq War/Oil Distinction:** Framing it as "geopolitical analysis" highlights the *mode of reasoning* (analysis of motives/interests) rather than the *type of claim* (hidden agenda).
  4.  **The Core Focus of Epistemology:** Her field is concerned with *how* we know, justify, and maintain beliefs, making the structure of reasoning paramount.

  **Test Case to Differentiate the Rules:**
  *   **The Case:** A group of respected academics and journalists, using FOIA requests, financial tracing, and testimony from disillusioned mid-level employees, publish a well-sourced report alleging a *specific, ongoing, secret agreement* between a few major pharmaceutical companies to subtly manipulate drug trial data over the last 5 years to favor their products. The companies and regulators vehemently deny it. The report is published in a major journal and covered by serious newspapers, but definitive proof (e.g., a signed secret pact, a whistleblower CEO) is still lacking. Some proponents of the report start dismissing *all* regulatory statements as inherently corrupt and any scientist questioning their methodology as a paid shill.
  *   **Prediction by Each Rule:**
      *   **Rule 1 (Closure):** Initially, NOT a Conspiracy Theory (responsible investigation). However, if proponents adopt self-sealing tactics against *all* counter-evidence/critique, the *belief as held by those proponents* might become one, even if the original report wasn't.
      *   **Rule 2 (Threshold):** LIKELY a Conspiracy Theory (initially) - Extraordinary claim of an active secret conspiracy, lacking definitive proof meeting the high threshold, despite credible sources. It would transition to "documented conspiracy" only if proof emerged.
      *   **Rule 3 (Institutions):** NOT a Conspiracy Theory - Generated and propagated using responsible methods within legitimate epistemic institutions (academia, journalism).

  This test case pits the *method of justification and response to critique* (Rule 1 & 3) against the *evidentiary burden for the specific claim* (Rule 2) and also tests whether responsible anchoring (Rule 3) can shield a claim from the CT label even with high evidentiary demands (contrary to Rule 2). Your professor's reaction to both the initial report *and* the behaviour of its proponents would be highly revealing.

  For the social media case next week, pay close attention to **how the claim is presented and defended** in the discussion. Does the professor focus on the quality of evidence, the methods of argument, or the proponents' openness to counter-evidence? That will be your best clue. Good luck!
