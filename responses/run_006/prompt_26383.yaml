  But in the expected value calculation, the sum is over the possible outcomes, which are mutually exclusive, so the order of summation shouldn't matter because it's a sum over a countable set.

  However, for conditionally convergent series, the sum can depend on the order if not absolutely convergent.

  But in probability, for expected value, since the terms are probabilities times payoffs, and the probabilities are positive, the sum should be well-defined if we fix the sample space.

  The sample space is all possible sequences where we have k heads followed by tails for k=0,1,2,3,... so n=k+1, but n is the flip number of first tails.

  Each outcome has a probability and a payoff.

