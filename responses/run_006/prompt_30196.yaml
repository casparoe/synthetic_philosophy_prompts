answer: |-
  Here is a comprehensive exam question designed to meet your specifications, followed by a model answer and a detailed marking scheme.

  ---

  ### Exam Question
  **"The conceivability of philosophical zombies is frequently presented as a decisive refutation of physicalism. However, physicalists often respond that conceivability does not entail metaphysical possibility, pointing to Kripkean examples of a posteriori necessities. Explain why the zombie argument is specifically structured to withstand this physicalist rejoinder. What must a physicalist say about the nature of possibility, the structure of our concepts, or the epistemology of consciousness to successfully resist the conclusion that zombies are metaphysically possible? Your answer should not rely on definitions alone but must engage the underlying dialectic."**

  ---

  ### Model Answer (Approx. 700 words)
  The zombie argument against physicalism hinges on the claim that a world physically identical to ours, but lacking conscious experience (a "zombie world"), is conceivable. If such a world is metaphysically possible, physicalism—which holds that all facts, including phenomenal ones, are fixed by physical facts—must be false. Physicalists typically counter that conceivability is an unreliable guide to metaphysical possibility, citing Kripke’s cases (e.g., water’s identity with H₂O). While we can conceive of water without H₂O, this is impossible metaphysically; the appearance of contingency arises from conflating epistemic and metaphysical modalities. The zombie argument, however, is engineered to circumvent this reply by targeting a unique feature of phenomenal concepts.

  The physicalist’s appeal to a posteriori necessity fails against zombies because Kripkean identities rely on *epistemic gaps* that are resolvable through scientific reduction. When we imagine "water" without H₂O, we are misdescribing a scenario that actually involves a different physical substance (e.g., XYZ). The seeming contingency dissolves once we recognize that "water" rigidly designates H₂O. Zombies, however, exploit an *explanatory gap* rooted in the nature of consciousness itself. A zombie world is conceivable precisely because we cannot reduce phenomenal states (e.g., the sensation of redness) to physical-functional properties, even under ideal rational reflection. There is no "misdescription" to correct: the zombie scenario directly challenges the necessity of the physical-phenomenal link. Thus, the conceivability of zombies reflects a deep asymmetry between phenomenal and physical concepts, suggesting that no a posteriori identity can bridge this gap.

  For physicalism to survive, it must deny that zombie conceivability implies metaphysical possibility. This requires one of two strategies:

  1. **Reductive Physicalism:** Assert that the explanatory gap is merely epistemic. A physicalist might argue that phenomenal concepts are *structurally identical* to physical/functional concepts but appear distinct due to cognitive limitations (e.g., the "phenomenal concept strategy"). If consciousness is ontologically reducible to physical processes, zombies are inconceivable under full rational scrutiny—our current inability to see the necessity is akin to a pre-scientific failure to grasp water-H₂O identity.  
  2. **Non-Reductive Physicalism:** Deny that conceivability tracks metaphysical possibility *at all* in the phenomenal domain. This position holds that while consciousness is physical, our concepts of it are "direct" or "recognitional," lacking analytic ties to physical descriptions. Zombies seem conceivable only because phenomenal concepts are cognitively isolated from physical ones, but this isolation does not reflect ontological divergence. Metaphysical possibility must be grounded in empirical facts, not conceptual exercises.

  The first strategy risks circularity: if physicalism is true, phenomenal concepts *must* be physical, but the zombie intuition challenges that very premise. The second strategy is bolder but risks severing the connection between conceptual analysis and modality, undermining not just zombies but all conceivability arguments (e.g., against materialism about mathematics). Both approaches concede that the explanatory gap exists but reframe it as a quirk of cognition rather than metaphysics. Crucially, physicalists must explain *why* the gap persists despite physicalism’s truth—e.g., by detailing how phenomenal concepts encode their referents in a way that masks underlying necessity.

  Ultimately, the zombie argument pressures physicalists to either close the explanatory gap (by reducing phenomenality) or deflate conceivability’s evidential role. If neither succeeds, the inference from conceivability to possibility stands, and physicalism fails.

  ---

  ### Marking Scheme  
  **Total Points: 20**  
  *(A = 17–20; B = 14–16; C = 10–13; D/F = <10)*  

  #### Requirements for an "A" Grade (17–20):  
  1. **Explicitly contrasts Kripkean a posteriori necessities with the zombie case** (4 pts):  
     - Clearly explains why water-H₂O is only *epistemically* but not *metaphysically* contingent.  
     - Argues that zombies evade this model due to the *explanatory gap* (i.e., no "misdescription" correction is possible for consciousness).  
  2. **Identifies physicalism’s burden** (4 pts):  
     - States that physicalists must deny the inference from conceivability to possibility *specifically for phenomenal states*.  
     - Engages **both** reductive (e.g., phenomenal concept strategy) **and** non-reductive options (e.g., divorcing conceivability from possibility).  
  3. **Critiques physicalist strategies** (4 pts):  
     - Notes the risk of circularity in reductive approaches or the weakening of modal epistemology in non-reductive ones.  
     - Explains *why* the explanatory gap persists (e.g., cognitive isolation of phenomenal concepts).  
  4. **Structure & Depth** (4 pts):  
     - No significant errors; logically traces the dialectic without digression.  
     - Avoids mere assertion ("conceivability ≠ possibility") by contextualizing it within the zombie debate.  

  #### "B" Grade Characteristics (14–16):  
  - **Minor omissions/errors**:  
    - Superficial treatment of the Kripke-zombie contrast (e.g., mentions it but doesn’t explain *why* zombies resist the model).  
    - Engages only **one** physicalist strategy (e.g., only phenomenal concepts *or* only rejecting conceivability).  
    - Neglects to specify *what* physicalists must deny about concepts/modality.  
  - **Lacks precision**: Uses terms like "explanatory gap" without defining them contextually.  
  - **Structural issues**: Unbalanced focus (e.g., spends excessive time defining zombies).  

  #### Penalties (Deduct 1–3 pts per issue):  
  - **−3**: Answers by defining terms without engaging the argument (e.g., "Physicalism is..." as the core).  
  - **−2**: Asserts "conceivability ≠ possibility" without explaining *why* this reply fails against zombies.  
  - **−2**: Misrepresents the dialectic (e.g., claims physicalists deny zombie conceivability).  
  - **−1–2**: Vague appeals to "cognitive limitations" without specifying their relevance to concepts/modality.  

  ---

  ### Why This Works  
  - **Targets the Impasse**: Forces students to explain *how* zombies differ from standard Kripke cases (e.g., irreducibility of the explanatory gap).  
  - **Demands Physicalist Innovation**: Students cannot parrot the standard "conceivability rebuttal"; they must articulate *what physicalism requires* to neutralize zombies.  
  - **Time-Efficient**: The model answer is achievable in 50 minutes by students who grasp the core dialectic.  
  - **Text-Neutral**: Relies on Chalmers’ zombie argument and Kripkean physicalist replies, not niche sources.  

  This question rewards students who see the zombie argument as a *challenge to physicalist semantics/epistemology* rather than a battle of intuitions.
