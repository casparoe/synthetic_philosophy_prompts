prompt: |-
  Before I read any more theories of what makes consent valid, I want to know what I should be asking of one. Write the desiderata: what any adequate theory of consent must deliver — which cases it must get right, which distinctions it must respect, which conceptual functions it must perform — with the case or consideration behind each requirement. Include cases from at least two of the following domains: sexual ethics, medical ethics, and contract law, and note where the requirements diverge across domains. Flag any pairs of desiderata you suspect cannot be jointly satisfied, and explain the tension. Finally, identify the single requirement that eliminates the most popular families of theories (e.g., mental-state accounts, performative or communicative accounts, and hybrid views), and briefly justify your choice. Please write the answer in American English.
reasoning: |-
