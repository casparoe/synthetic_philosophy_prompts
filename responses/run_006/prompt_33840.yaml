  Hmm, the user seems academically inclined—probably a grad student or early-career philosopher/ethicist preparing for comprehensive research. Their demand for "what eliminates most popular theories" suggests they've already encountered superficial debates and want analytical tools to cut through noise. 

  *Scratching head* Tricky parts: 
  First, balancing domain-specific nuances while finding universal core requirements. For example, sexual consent's irreversibility vs contract law's revocability. 
  Second, identifying conflicting desiderata—like how "intentionality" might clash with "reasonable reliance" in fast-paced negotiations. 
  Third, pinpointing which requirement is most lethal to mainstream theories. Performative views fail badly on internal incapacity cases (drunk patients), while mental-state accounts crumble when intentions don't match actions. But "external accessibility as necessary condition" is the real silencer—it nixes both mental-state purism and hybrids that tolerate purely internal "consent." 

  *Pausing* Should emphasize the medical "emergent intubation" case when explaining the accessibility requirement. That example viscerally shows why doctors can't rely on unexpressed mental states. Also, the contract law "unspoken withdrawal" case perfectly demonstrates the reliance vs intentionality clash. 

  *Double-checking* Did I cover all domains? Sexual: intoxication, deception, coercion. Medical: emergencies, evolving consent, minors. Contracts: reliance, mistake, revocation. Yes. 
  Noting where requirements diverge: revocability rules are stricter in contracts than medicine, while mistake doctrines hit contracts harder than sexual ethics. 

  *Muttering* The user will appreciate flagging the "intentionality vs reliance" tension—it's the theoretical tripwire that makes consent theory so messy. Hybrid views try to duck it but often just relocate the problem. 

  Final output must be clinically precise. No fluff. American English means "ER" not "A&E," "attorney" not "solicitor." Case names should feel locally resonant (e.g., "Springfield" not "London" for contract example).
answer: |-
  Here are the core desiderata for any adequate theory of valid consent, grounded in cases and highlighting domain-specific nuances and tensions:

  **Core Desiderata (Universal):**

  1.  **Distinguish Valid Consent from Mere Acquiescence or Submission:**
      *   *Case:* A patient pressured by family into an unwanted but non-urgent surgery says "okay, fine" while visibly distressed and crying. A theory must not equate this pressured submission with valid consent.
      *   *Requirement:* Must identify a qualitative difference based on agency and authorization, not just lack of physical resistance.

  2.  **Account for Incapacity (Internal Barrier):**
      *   *Case (Medical):* An intoxicated patient in the ER agrees to a complex procedure. Later, sober, they deny remembering or understanding.
      *   *Case (Sexual):* An individual blackout drunk "agrees" to sex. The next day, they have no memory and feel violated.
      *   *Requirement:* Must explain why significant impairment (intoxication, severe mental illness, developmental disability) invalidates apparent agreement, focusing on inability to understand or deliberate.

  3.  **Invalidate Consent Obtained by Coercion or Undue Influence (External Barrier):**
      *   *Case (Sexual):* "If you don't sleep with me, I'll fire you/destroy your reputation/hurt your family."
      *   *Case (Medical):* A doctor implies a patient's life-saving medication will be withheld unless they enroll in a risky research trial.
      *   *Case (Contract):* Signing a contract because thugs are threatening violence ("sign or else...").
      *   *Requirement:* Must distinguish genuine threats or overwhelming pressure exploiting vulnerability from ordinary persuasion or negotiation. Must respect context (e.g., employer-employee power differential).

  4.  **Invalidate Consent Based on Significant Deception or Fraud:**
      *   *Case (Sexual):* A person lies about being sterilized or having an STI to obtain sex.
      *   *Case (Medical):* A researcher deliberately misrepresents the risks of an experimental drug to enroll a patient.
      *   *Case (Contract):* Selling a car knowing the engine is irreparably damaged but claiming it's "in perfect condition."
      *   *Requirement:* Must identify which types of deception (going to the core of what is being consented *to*) nullify consent. Not all misinformation invalidates (e.g., minor puffery in sales).

  5.  **Require Minimal Understanding of the Core Nature of the Act/Transaction:**
      *   *Case (Medical):* A patient consents to "surgery on the left foot" but the surgeon operates on the right foot due to a mix-up. The patient consented to *foot surgery*, but not *this specific act*.
      *   *Case (Contract):* Signing a document believing it's a lease agreement when it's actually a sales contract for the property.
      *   *Requirement:* Must require comprehension of the fundamental action or transaction being authorized. Consent is act/transaction-specific.

  6.  **Recognize Consent as an Agent's Act (Intentionality):**
      *   *Requirement:* Consent must involve a mental state of *authorizing* the specific act. It cannot be purely accidental or entirely attributed to external forces without any internal endorsement (linking back to Desiderata 1 & 3). The agent must *intend* to permit the act.

  **Domain-Specific Desiderata & Divergences:**

  7.  **Account for Revocability (Divergence in Application):**
      *   *Case (Sexual):* A person clearly says "stop" during sex. Consent is immediately and irrevocably withdrawn.
      *   *Case (Medical):* A patient undergoing a lengthy procedure says "stop" midway. Respecting this is paramount, though practical challenges exist.
      *   *Case (Contract):* A party signs a binding service contract but changes their mind an hour later before any service is rendered or reliance occurs. Contract law typically *does not* allow simple revocation without penalty; reliance and stability are prioritized.
      *   *Requirement:* Must explain when consent can be revoked and the consequences. Sexual consent is highly revocable at any point. Medical consent is revocable but constrained by patient safety during procedures. Contractual consent is generally irrevocable once formed without breach or legal justification.

  8.  **Address Third-Party Authorization & Proxy Consent:**
      *   *Case (Medical):* Parents consenting to life-saving treatment for an infant. A court-appointed guardian consenting to dementia care.
      *   *Case (Contract):* An authorized agent signs a contract binding the principal.
      *   *Requirement (Divergence):* Must explain the validity and limits of consent given *for* another. Medical ethics has strict rules for proxy consent (best interests, substituted judgment). Contract law relies heavily on the scope of actual or apparent authority. Sexual consent is almost universally non-delegable.

  9.  **Respect Contextual Vulnerability & Fiduciary Duties:**
      *   *Case (Medical):* A doctor prescribing an unnecessary, expensive treatment from which they profit, exploiting the patient's trust.
      *   *Case (Contract):* Standard form contracts presented by powerful corporations to consumers ("take it or leave it").
      *   *Requirement (Divergence):* Must acknowledge heightened standards when power imbalances or fiduciary duties exist. Medical ethics imposes strict duties of candor and prioritizing patient welfare. Contract law uses doctrines like unconscionability but generally prioritizes freedom of contract. Sexual ethics focuses on inherent vulnerability in intimacy and power dynamics.

  **Suspected Tensions Between Desiderata:**

  *   **Tension 1: Intentionality (6) vs. Reasonable Reliance (Contract Focus):**
      *   *Conflict:* Contract law prioritizes the reasonable interpretation of external words/conduct for stability (reliance). If Party A signs a contract ambiguously but Party B reasonably believes consent is given, contract law often binds A based on B's reliance, *even if* A's internal intention was hesitant or conflicted. This clashes with a pure "intentionality" requirement. Can a theory fully respect the internal mental state *and* protect reasonable reliance on manifestations, especially in fast-paced dealings?
  *   **Tension 2: Revocability (7) vs. Reliance/Completion (Medical/Contract):**
      *   *Conflict:* In medicine, revoking consent mid-surgery creates a tension between respecting autonomy and causing harm by stopping abruptly. In contracts, allowing easy revocation undermines the security of transactions where parties rely on commitments. Balancing strong revocability rights against legitimate reliance interests is inherently difficult. Sexual ethics typically resolves this tension decisively in favor of revocability, regardless of reliance.

  **The Requirement that Eliminates Popular Families:**

  *   **"External Accessibility as a *Necessary Condition*" (Implied by 5 & 7, Explicitly Contradicts Pure Mental-State Views):**
      *   *Requirement:* For consent to be valid, it *must* be communicated or reasonably inferable in some way to the relevant party(ies). Purely internal, unexpressed mental states (like secretly thinking "yes" while saying "no" in a sexual encounter, or silently agreeing to contract terms while signing under protest without indication) *cannot* constitute valid consent.
      *   *Justification:* This requirement eliminates **Pure Mental-State Accounts** (which hold that consent is solely an internal mental state, regardless of communication). It also creates major problems for **Hybrid Views** if they allow purely internal consent to be valid under any circumstances. It underscores why consent is fundamentally relational – it's about *authorizing another* to act, which necessitates communication. Cases like the intoxicated patient (incapacity), the patient saying "stop" during surgery (revocability), or the sexual partner saying "no" (intentionality vs. accessibility) all demonstrate that validity crucially depends on what is expressed or reasonably perceivable, not just hidden intentions. Performative/Communicative accounts inherently satisfy this; mental-state accounts fundamentally violate it. Hybrids struggle if they don't make external manifestation strictly necessary.
