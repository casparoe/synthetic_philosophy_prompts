  I host a small philosophy-and-games podcast, and I've managed to book Peter Suber (the guy who invented Nomic) for next month. My listeners already know the rules of the game, so I want questions that dig into the deeper paradoxes — the self-amendment stuff, what Nomic shows us about legal systems, whether there's a genuine paradox or just a cute trick.

  Draft me 8–10 questions. I want at least two on the paradox of self-amendment itself: can a rule coherently authorize its own change, or does that collapse into circularity? At least one on whether real constitutional systems already have Nomic-like features we just don't notice. At least one on Alf Ross's argument that self-amending rules are logically impossible — does that critique actually land, or does it miss what's going on in Nomic? And at least one on whether Nomic has anything to teach us about the rule of law, or if its just a parlor game that doesn't generalize.

  For each question, include a follow-up that presses on whatever his most likely answer would be. Don't let him deflect with "it's just a game" — I want him pinned down on what he actually thinks the philosophical upshot is.

  And throw in one question about the worst-faith interpretation of the rules he's ever seen in a real game, because my listeners love war stories.
