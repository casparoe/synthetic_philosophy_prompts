answer: |-
  The structure you’re describing is best named the **catuṣkoṭi** (Sanskrit: "four corners"), a dialectical framework systematized by the Buddhist philosopher Nāgārjuna (c. 2nd–3rd century CE) in the Madhyamaka ("Middle Way") tradition. It exhaustively refutes all conceivable positions on a metaphysical question by demonstrating their incoherence, ultimately pointing beyond conceptual proliferation (*prapañca*) to emptiness (*śūnyatā*). Here’s how your pattern maps onto it:  

  1. **Affirmation** ("The self exists"): Position 1 (*asti*).  
  2. **Negation** ("The self does not exist"): Position 2 (*nāsti*).  
  3. **Double Affirmation** ("The self both exists and does not exist"): Position 3 (*asti ca nāsti ca*).  
  4. **Double Negation** ("The self neither exists nor does not exist"): Position 4 (*naivāsti na nāsti*).  

  Nāgārjuna deploys this in works like the *Mūlamadhyamakakārikā* (Fundamental Verses on the Middle Way) to dismantle categories like causality, time, and self. The goal isn’t to advance a fifth position but to reveal that all four options collapse under analysis, showing the inherent emptiness of the concept itself. For example, in debating the self:  
  - If the self *exists* independently, it should be findable in experience (it isn’t).  
  - If it *doesn’t exist*, how can we speak of illusions or experiences?  
  - *Both* is a contradiction (how can one thing possess mutually exclusive properties?).  
  - *Neither* still implicitly relies on the concept it denies and cannot escape language’s subject-predicate structure.  

  ### Key nuances and your questions:  
  **Is it self-refuting?** Madhyamaka embraces this: the *catuṣkoṭi* applies to *itself*. Nāgārjuna states that emptiness "empties itself," avoiding dogmatism. It’s a therapeutic tool, not a truth claim. If you say "all views are empty," that too is empty—a "ladder to be discarded." This distinguishes it from a mere rhetorical trap.  

  **"Pointing beyond" vs. refutation:** You astutely note it might indicate the ineffable. Madhyamaka agrees: the *catuṣkoṭi* clears conceptual clutter so one might *non-conceptually* realize reality (e.g., Nirvana as "quieting of linguistic fabrication"). But it never defines that reality positively.  

  **Comparisons to other traditions:**  
  - **Hindu Advaita Vedānta** (e.g., Śaṅkara) uses a two-step *neti neti* ("not this, not this") to negate attributes of Brahman. While similar in negating categories, it doesn’t formally deploy the fourfold structure and culminates in affirming an ineffable Absolute (*Brahman*).  
  - **Jainism**’s *anekāntavāda* (many-sidedness) uses a sevenfold schema (*saptabhaṅgī*) to frame partial truths. It preserves validity in multiple perspectives rather than negating all—closer to perspectivism than radical deconstruction.  
  - **Western parallels:** Greek skeptic tropes or Hegel’s dialectic (thesis-antithesis-synthesis) share surface resemblances. Hegel’s synthesis, however, builds new positions, whereas Madhyamaka’s negation is total and non-sublatable. Plato’s *Parmenides* dialectic also explores contradictions in "the One" but lacks the *catuṣkoṭi*’s systematic application.  

  **Mismatches:**  
  - In modern debates (e.g., free will), the "neither" position is often **mysterianism** (e.g., Colin McGinn: "unsolvable by human minds"). This assumes cognitive closure, whereas Madhyamaka targets the incoherence *within* concepts, not our ability to solve them.  
  - When critics weaponize the four moves *selectively* to trap opponents (e.g., dismissing compatibilism as "both"), they misuse the *catuṣkoṭi*. Nāgārjuna rejects *all* positions equally; cherry-picking contradictions without applying the framework universally violates its purpose.  

  ### Why "catuṣkoṭi" fits best:  
  It uniquely matches your pattern’s formal structure, exhaustive negation, and intent to expose conceptual futility. While variants exist, Nāgārjuna’s formulation remains the most rigorous: it doesn’t just refute positions—it dissolves the very grounds for the debate, forcing recognition that language and logic are conventional (*saṃvṛti*) tools, unfit for ultimate reality (*paramārtha*). To study it, read Nāgārjuna’s *Mūlamadhyamakakārikā* with commentaries by Candrakīrti or modern interpreters like Jay Garfield. The answer to "What is it pointing to?" is silence—but a silence born of insight, not ignorance.
