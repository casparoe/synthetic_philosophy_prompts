  First candidate: the *catuṣkoṭi* (four corners) from Nagarjuna's Madhyamaka Buddhism. It fits perfectly—the tetralemma of existence, non-existence, both, neither—and was designed to deconstruct metaphysical claims. But I must note where it might not align: Nagarjuna uses it to empty *all* positions, whereas the user described critics sometimes deploying it selectively as a trap. Also, some Hindu *neti neti* approaches reject all four positions but don't always follow the same sequence.  

  Second layer: they ask if the structure refutes itself. This is critical—Nagarjuna anticipates this by applying the *catuṣkoṭi* to his own emptiness doctrine, arguing it's a therapeutic tool, not a positive claim. Compare this to dialectical methods in Western philosophy (Hegel's synthesis or Plato's Parmenides), but those don't map cleanly onto the fourfold negation.  

  User's unspoken need might be epistemological unease: if all positions collapse, how do we speak meaningfully? I should emphasize how Madhyamaka uses conventional truth (*saṃvṛti*) here—language works pragmatically even if ontologically empty. The *catuṣkoṭi* isn't nihilism; it's a warning against reification.  

  Potential mismatch: in some debates (e.g., free will), modern "mysterian" positions resemble the fourth *koṭi* but often carry a positivist skepticism Madhyamaka would reject. I'll clarify that distinction.  

