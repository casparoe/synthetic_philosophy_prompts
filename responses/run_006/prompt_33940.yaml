     - Unbounded utilities: We used a finite big prize (1,000,000 points or a gift card) because we can't give infinity. But in the real wager, the gain is infinite. How does that affect the calculation? (Note: infinity breaks expected utility calculations because any positive probability times infinity is infinity.)

  Also, note: we did not model the possibility of different gods in stage 3. We only had one condition. So the many-gods objection is something we must bring up in the debrief.

  What the game cannot reproduce:
  - The game cannot reproduce the actual infinity of the afterlife reward. We used a finite substitute (a big prize). The facilitator must explain that in the real wager, the gain is infinite, which leads to the mathematical issues of unbounded utility.

  One-sentence summary:
  "Students make a series of bets under risk and uncertainty, culminating in a forced choice that mirrors Pascal's Wager, then debrief to connect the experience to the classic argument and its critiques."
answer: |-
  ### Pascal's Wager Classroom Activity: "The Ultimate Bet"

  **Objective:** Illustrate Pascal's Wager through experiential learning, emphasizing rational choice under uncertainty, forced commitment, and common objections—without initially referencing Pascal or expected utility.

  ---

  #### **Materials**
  - **Slips of paper:** Three colors (white for Stage 1, yellow for Stage 2, blue for Stage 3).
  - **Points ledger:** A shared Google Sheet (or physical poster) tracking each student’s points. Assign each student a random ID for anonymity.
  - **Randomizers:** Two coins (Stage 1), a 10-sided die (Stage 2), and one pre-flipped coin in a sealed envelope (Stage 3).
  - **Incentives:**  
    - **Small prizes:** Top 3 scorers win candy or 1–2 bonus points (e.g., for a quiz).  
    - **Big prize:** A $5 gift card or book (for Stage 3 winners if condition holds).  
    Points are tangible—students know top scorers gain real rewards.

  ---

  #### **Rules & Points Scheme**
  **Total Time:** 70 minutes (stages: 15 min each; debrief: 25 min).  
  **Points Rationale:** Close expected values in Stage 1, skewed payoff in Stage 2, unverifiable gain in Stage 3.  
  - **Stage 1: Known Risk (Prudence)**  
    - Option A (Safe): +15 points (certain).  
    - Option B (Risky): Flip a coin. Heads = +30 points, tails = 0 points.  
    *Expected value (EV): Both options = 15 points.*  
  - **Stage 2: Unknown Probability (Expected Value)**  
    - Option A (Safe): –5 points (certain loss).  
    - Option B (Risky): Roll a 10-sided die. Roll 1 = +200 points (20% chance), else 0 points.  
    *EV: Option A = –5, Option B = +40. Rational choice: B.*  
  - **Stage 3: Forced Commitment (Pascal’s Leap)**  
    - Option A (Atheist path): +10 points (certain).  
    - Option B (Theist path): –5 points (certain loss). *But* if the sealed coin (flipped pre-class) is heads, B-choosers win the **big prize** (gift card) at the end.  
    - **No abstaining:** All must choose. The coin’s result is revealed only in debrief.  

  ---

  #### **Timeline**
  1. **Intro (5 min):**  
     - Explain rules, points, prizes. Emphasize: "Decisions are final; no do-overs."  
  2. **Stage 1: Known Risk (15 min)**  
     - Students write choices (A/B) on white slips.  
     - Collect slips. For B-choosers, flip coins publicly. Update ledger.  
  3. **Stage 2: Unknown Probability (15 min)**  
     - Students write choices (A/B) on yellow slips.  
     - Collect slips. For B-choosers, roll die publicly (1 = win). Update ledger.  
  4. **Stage 3: Forced Commitment (15 min)**  
     - Students write choices (A/B) on blue slips. **No discussion allowed.**  
     - Collect slips. Record points (A: +10, B: –5). *Do not reveal coin yet.*  
  5. **Debrief (25 min):** Reveal coin. Award big prize if heads. Discuss connections.  

  ---

  #### **Predictable Problems & Solutions**
  - **Problem:** Students protest Stage 3’s "unfair" hidden coin.  
    **Solution:** Acknowledge frustration: "This mimics how we can’t verify God’s existence in life. Your anger is part of the lesson!"  
  - **Problem:** Stage 2 die rolls run long.  
    **Solution:** Pre-roll dice for B-choosers using a random number generator (display results quickly).  
  - **Problem:** Students copy peers’ choices.  
    **Solution:** Have them write choices *privately* and hand slips to you.  
  - **Problem:** Some reject incentives ("points aren’t real").  
    **Solution:** Remind them: "Prizes are real. So are the costs/benefits in Pascal’s Wager."  

  ---

  #### **Debrief Script**
  **Map Stages to Pascal:**  
  1. **Stage 1 = Ordinary Prudence:** You weighed known risks (like insurance). EV was equal, so choice reflected personal risk tolerance.  
  2. **Stage 2 = Expected-Value Argument:** When probabilities are vague but one payoff is huge (like lottery tickets), B became rational despite risk. Pascal says faith is rational if God’s existence has *any* probability.  
  3. **Stage 3 = Forced Commitment:** Life forces a "way of life" choice. Abstaining (atheism) seems safe but risks infinite loss. Choosing B (–5 points) mimics faith’s finite cost (prayer, guilt) for infinite gain.  

  **Two Versions of the Wager:**  
  - **Dominance:** If God *might* exist, believing always wins (Stage 3: B dominates A if the coin *could* be heads).  
  - **Expected Utility:** Tiny probability × infinite reward = rational belief (Stage 2’s die roll × 200 points, but with ∞).  

  **Objections (Test Against Game):**  
  1. **Many-Gods Objection:** "What if multiple 'gods' exist?" In Stage 3, we assumed *one* hidden condition. But if there were two coins (e.g., Christian God vs. Zeus), choosing B might please one and anger the other. Pascal ignores this.  
  2. **Belief Cannot Be Chosen:** "Can you *decide* to believe?" In Stage 3, you chose B without knowing the coin—but did you *feel* belief? Pascal says "fake it till you make it," but is that ethical?  
  3. **Unbounded Utilities:** "Infinity breaks math!" We used a finite big prize (gift card) because ∞ can’t exist in games. But if reward is infinite, any probability >0 makes belief rational—even if God is unlikely.  

  **Limitation:** The game cannot replicate **infinity’s mathematical paradoxes**. Facilitator must clarify: Real faith involves unbounded gain/loss, which distorts cost-benefit analysis (e.g., ∞ > any finite cost).  

  ---

  **Final Summary:**  
  "Through three escalating bets, students experience Pascal’s logic—prudence, expected value, and forced commitment—then dissect its flaws using their own choices."
