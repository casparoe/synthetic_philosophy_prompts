  2. Two versions of the wager:
     - Dominance version: If God exists, then believing gives you infinite gain and not believing gives you finite gain (or loss). If God does not exist, then believing gives you a finite loss (or gain) and not believing gives you a finite gain. So if there's any chance God exists, believing dominates because the infinite gain outweighs any finite loss. (This is like stage 3: if the condition holds, you win big; if not, you only lost 5 points. The big prize is so big that even a small chance makes it worth it.)
