  First, I should recall the Sleeping Beauty problem. Beauty is asleep, a coin is flipped. Heads: woken once (Monday). Tails: woken twice (Monday and Tuesday). Memory is wiped each time. The question is her credence in heads upon waking. Halfers say 1/2, thirders say 1/3. The user finds the thirder view obvious based on betting: if Beauty bets on heads each awakening, she'd lose twice as often on tails, so she should have a 1/3 credence to avoid being a money pump. That's where they see pragmatic encroachment—practical stakes (the awakening structure) directly influencing rational credence.

