prompt: |-
  I'm in a reading group that's been going back and forth for weeks about Aumann's agreement theorem, and the two factions have started talking passed each other. The common-prior camp reads the theorem as a deep constraint on rational disagreement: if two people are honest Bayesians with a common prior, their posterior probabilities for a given event can't be common knowledge and differ, so any persistent disagreement has to trace back to private information, bounded rationality, or a failure of common knowledge. The prior-skeptic camp thinks the common-prior assumption quietly does all the work: once you assume everyone starts from the same prior and updates by the book, the result is close to a bookkeeping consequence of the setup, so it says little about actual disagreement, where different priors are exactly what's at issue.

  I want you to draft the document these two camps would produce after a good-faith adversarial collaboration, a text both could actually sign. Structure it as a numbered section of claims both accept — covering the formal statement of the theorem, exactly what each condition contributes, and what the theorem does and does not rule out — followed by a disagreements table. For each row, give the residual disagreement, phrase each side's position in wording that side would accept, and mark which disagreements are genuine rather than verbal; if part of the fight is about words, say which part and why. Then identify the cruxes: the subquestions where settling them would actually move at least one side. For each crux, give a concrete case or piece of evidence both sides agree would bear on it, and state each side's prediction in advance. I'd rather have sharp, non-vacuous formulations than diplomatic mush.
reasoning: |-
  We are drafting a document for two camps in a reading group on Aumann's agreement theorem. The camps are:
  - Common-prior camp: Believes the theorem shows a deep constraint on rational disagreement, requiring that persistent disagreement must be due to private information, bounded rationality, or failure of common knowledge.
  - Prior-skeptic camp: Believes the common-prior assumption is doing all the work and that the theorem is a near-tautological consequence of the setup, thus having little to say about real-world disagreements where priors differ.

  The document should have:
  1. A numbered section of claims both accept (covering formal statement, conditions, what the theorem does and does not rule out).
  2. A disagreements table. For each row:
     - Residual disagreement topic.
     - Position of each camp in wording they would accept.
     - Mark whether the disagreement is genuine or verbal (and if verbal, explain which part is about words).
  3. Cruxes: Subquestions that, if settled, would move at least one side. For each crux:
     - Concrete case or evidence both sides agree would bear on it.
     - Each side's prediction.

  We aim for sharp, non-vacuous formulations.

  Let's structure:

  **Part 1: Shared Understanding**

  Both camps agree on the following:

  1. **Formal Statement of Aumann's Agreement Theorem**: 
     - We consider two agents, Alice and Bob, with a common prior probability distribution over a state space. They receive private information (partitions of the state space) and update by Bayesian conditioning. If their posterior probabilities for a given event A are common knowledge (i.e., at the true state, each knows the other's posterior, each knows that the other knows, and so on), then these posteriors must be equal.

  2. **Key Conditions**:
     - **Common Prior**: The agents start with the same prior probability distribution over the state space.
     - **Bayesian Updating**: Both update their beliefs by conditioning on their private information.
     - **Common Knowledge of Posteriors**: At the actual state, the event that Alice's posterior is p and Bob's is q is common knowledge (but note the theorem concludes that if this is common knowledge, then p=q).

  3. **What the Theorem Shows**:
     - Under the conditions above, it is impossible for the two agents to have differing posterior probabilities for the same event and for those posteriors to be common knowledge. Therefore, if the conditions hold and posteriors are common knowledge, they must agree.

  4. **What the Theorem Does Not Rule Out**:
     - Disagreement without common knowledge of posteriors (e.g., if they haven't communicated fully).
     - Disagreement due to different priors (if the common prior condition is violated).
     - Disagreement due to non-Bayesian updating (e.g., heuristics, cognitive biases).
     - Disagreement due to bounded rationality (e.g., computational constraints preventing exact Bayesian updating).

  5. **The Role of Common Knowledge**:
     - The theorem requires common knowledge of the posteriors, which is a very strong condition. Without it, disagreement can persist even with a common prior and Bayesian updating.

  **Part 2: Disagreements Table**

  We now present the main points of disagreement. Each row addresses one residual disagreement.

  | # | Disagreement Topic | Common-Prior Camp Position | Prior-Skeptic Camp Position | Genuine or Verbal? | Notes |
  |---|-------------------|----------------------------|------------------------------|-------------------|-------|
  | 1 | **The significance of the common prior assumption** | The common prior is a natural baseline for rational agents and the theorem reveals a profound limitation: even with common priors and rational updating, agreement is forced unless there is a failure of common knowledge. Thus, real-world disagreements must be due to informational barriers or irrationality. | The common prior assumption is highly restrictive and unrealistic. The theorem then becomes a near-tautology: if you assume everyone starts from the same beliefs and updates the same way, then after sharing information (via common knowledge) they must agree. But in reality, people start with different priors, so the theorem is irrelevant to most actual disagreements. | Genuine | The disagreement is about the realism and reasonableness of the common prior assumption and the theorem's applicability. |
  | 2 | **The strength of the common knowledge condition** | Common knowledge of posteriors is a strong condition, but it is an idealization that helps us understand the necessity of full information exchange. In practice, even without common knowledge, the theorem suggests that repeated communication (which can approximate common knowledge) should lead to agreement, unless there are other barriers. | The common knowledge condition is so strong that it is almost never satisfied in practice. Therefore, the theorem has little practical relevance, because in real disagreements, even after extensive communication, common knowledge is not achieved and disagreement can persist without any irrationality. | Partly verbal and partly genuine | Verbal: The camps may have different thresholds for what counts as "approximating" common knowledge. Genuine: Whether real-world communication can get close enough to common knowledge to force agreement. |
  | 3 | **The theorem's implications for rationality and disagreement** | The theorem shows that rational agents with a common prior cannot agree to disagree. Therefore, persistent disagreement in the real world must be due to irrationality (including non-Bayesian updating), different priors, or a failure to achieve common knowledge (which may be due to bounded rationality). | The theorem does not imply that real-world disagreement is irrational. It only shows that if we impose the common prior and common knowledge, then disagreement is impossible. But since these conditions are not met in reality, the theorem does not constrain real disagreement. Moreover, the theorem does not address the rationality of having different priors. | Genuine | The disagreement is about the implications for rationality: one camp sees the theorem as revealing a requirement for rationality (common prior) and the other sees the common prior as an unrealistic assumption that is not required by rationality. |
  | 4 | **The role of the theorem in explaining actual disagreement** | The theorem provides a powerful explanation: the main barriers to agreement are private information (until fully shared) and irrationality. Even if common priors are assumed, the theorem shows that common knowledge forces agreement. Therefore, in practice, we should expect agreement unless there are frictions. | The theorem fails to explain actual disagreement because the common prior is not a realistic assumption. The main source of disagreement is divergent priors, which the theorem does not address. Therefore, the theorem is not useful for understanding real-world disagreements. | Genuine | |

  **Part 3: Cruxes**

  We now identify cruxes: subquestions that, if resolved, would move at least one side. For each crux, we provide a concrete case or piece of evidence that both sides agree would bear on it, and each side's prediction.

  1. **Crux: How often do people have approximately common priors?**
     - **Concrete Case**: Consider a controlled experiment where subjects are given identical information and training about a novel domain (e.g., a made-up stock market with defined rules) and then form priors. Then, they receive different private signals and update. We measure the frequency of agreement after full communication (aiming for common knowledge of posteriors).
     - **Common-Prior Camp Prediction**: In such a setting, with a common prior induced by identical training, we expect a high rate of agreement after full communication. Disagreement would be rare and attributable to noise or bounded rationality.
     - **Prior-Skeptic Camp Prediction**: Even in this controlled setting, subjects may interpret the training differently, leading to different priors. Thus, we expect non-negligible disagreement even after full communication.

  2. **Crux: Does repeated communication approximate common knowledge well enough to force agreement?**
     - **Concrete Case**: In a Bayesian simulation, two agents with a common prior and private information engage in multiple rounds of communication where they announce their posteriors iteratively. We observe the rate of convergence to agreement as the number of rounds increases.
     - **Common-Prior Camp Prediction**: Agreement will be reached quickly (within a few rounds) in most cases, because iterated announcement of posteriors approximates common knowledge.
     - **Prior-Skeptic Camp Prediction**: While sometimes convergence occurs, there will be many cases where convergence is slow or does not occur due to the complexity of the state space or the agents' inability to fully process the implications (even in a simulation, the logic may not force immediate agreement without infinite steps).

  3. **Crux: Are divergent priors a more important source of real-world disagreement than private information?**
     - **Concrete Case**: Analyze real-world debates (e.g., climate change, economic policy) among experts. Code the reasons for disagreement: is it due to different interpretations of the same data (which could be private information) or fundamentally different starting assumptions (priors)?
     - **Common-Prior Camp Prediction**: Much of the disagreement will be traceable to private information (including access to different studies) and failures of communication (not achieving common knowledge). Divergent priors will play a minor role.
     - **Prior-Skeptic Camp Prediction**: Divergent priors (e.g., different ideological assumptions) will be the dominant factor in expert disagreements.

  4. **Crux: Is the common prior assumption a requirement of rationality?**
     - **Concrete Case**: Consider a formal model of rationality (e.g., Savage's axioms or Dutch book arguments). Does any of these foundations imply that rational agents must have a common prior?
     - **Common-Prior Camp Prediction**: Rationality requires that agents with the same information should have the same beliefs. Therefore, if two rational agents have the same background information, they should have the same prior. The common prior is thus a consequence of rationality.
     - **Prior-Skeptic Camp Prediction**: Rationality does not require a common prior. It only requires internal coherence (avoiding Dutch books). Two rational agents can have different priors even with the same background information, because there is no unique rational prior (subjectivism).

  Note: The above cruxes are designed to be sharp and non-vacuous. Each side's prediction is stated clearly.

  This document provides a basis for further discussion and empirical/theoretical investigation.
answer: |-
  ### Shared Understanding: Claims Both Camps Accept  
  1. **Formal Statement**: If two Bayesian agents share a common prior, their posteriors for an event \(A\) cannot be common knowledge while differing. Formally: Let \(P\) be the common prior, \(\Pi_i\) agent \(i\)’s information partition, and \(q_i\) their posterior for \(A\). If at state \(\omega\), it is common knowledge that \(q_1 = p_1\) and \(q_2 = p_2\) (with \(p_1 \neq p_2\)), a contradiction arises. Thus, \(p_1\) must equal \(p_2\).  
  2. **Necessity of Conditions**:  
     - **Common prior**: Without identical priors, disagreement can persist under common knowledge (e.g., two agents with dogmatic priors).  
     - **Bayesian updating**: Non-Bayesian updating (e.g., ignoring information) permits common-knowledge disagreement.  
     - **Common knowledge of posteriors**: If posteriors aren’t common knowledge (e.g., agents withhold beliefs), disagreement can persist indefinitely.  
  3. **What the Theorem Rules Out**: Rational agents with a common prior cannot *have common knowledge* of differing posteriors. Disagreement absent common knowledge (e.g., before communication) is unconstrained.  
  4. **What the Theorem Does Not Rule Out**:  
     - Disagreement from divergent priors.  
     - Disagreement without common knowledge of posteriors.  
     - Disagreement from bounded rationality (e.g., computational limits), non-Bayesian updating, or asymmetric information not fully shared.  
  5. **Scope**: The theorem is a deductive mathematical truth given its assumptions. It does *not* require agents to communicate their posteriors explicitly; common knowledge suffices.  

  ---

  ### Disagreements Table  
  | # | Residual Disagreement | Common-Prior Camp Position | Prior-Skeptic Camp Position | Genuine/Verbal | Notes |  
  |---|------------------------|----------------------------|------------------------------|----------------|-------|  
  | 1 | **Interpretation of the common prior’s role** | The theorem reveals a *substantive constraint*: common priors force agreement under common knowledge, so real-world disagreement *must* stem from non-common priors, irrationality, or failures of common knowledge. | The theorem is *tautological*: assuming common priors and Bayesian updating makes agreement under common knowledge inevitable by definition. It offers no insight into real disagreement, where priors differ. | Genuine | Disagreement over whether the theorem is "substantive" vs. "tautological" hinges on the epistemic status of common priors (see Crux 1). |  
  | 2 | **Practical relevance for resolving disagreement** | The theorem implies that *if* common priors hold, rational agents *should* achieve agreement via communication (as it approximates common knowledge). Thus, it guides dispute resolution. | Common knowledge is unattainable in practice (requiring infinite recursion). Thus, the theorem is irrelevant to real disagreements, where priors differ and communication is finite. | Partly verbal, partly genuine | Verbal: "Relevance" conflates normative guidance (common-prior) with descriptive applicability (skeptic). Genuine: Whether communication *sufficiently* approximates common knowledge (see Crux 2). |  
  | 3 | **Implications for rationality** | Rationality *demands* common priors (per Harsanyi doctrine); thus, persistent disagreement implies irrationality or information barriers. | Rationality *only* requires internal consistency (e.g., no Dutch books). Common priors are *not* necessary for rationality; divergent priors are rational given differing life experiences. | Genuine | Disagreement over whether rationality requires unique priors (see Crux 3). |  
  | 4 | **"Private information" as a barrier** | The theorem shows private information is the *primary* barrier to agreement under common priors; resolving it (via communication) forces convergence. | Private information is *secondary*; divergent priors dominate real disagreement. The theorem’s focus on private information is a distraction. | Genuine | Disagreement over the empirical prevalence of private info vs. prior divergence (see Crux 4). |  

  ---

  ### Cruxes: Subquestions That Would Resolve Disagreement  
  Each crux identifies a testable claim. Predictions are pre-registered and falsifiable.  

  **Crux 1: Is the common prior assumption a plausible baseline for rational agents?**  
  - **Evidence**: Formal results from rational choice foundations (e.g., Savage’s axioms, Dutch book arguments). Does rationality *require* that identically informed agents share priors?  
  - **Common-prior prediction**: Yes. Harsanyi’s doctrine implies common priors are uniquely rational under identical background information.  
  - **Prior-skeptic prediction**: No. Rationality permits multiple coherent priors (e.g., subjective Bayesianism); common priors are ad hoc.  
  - **Why it moves the needle**: If rationality demands common priors, the theorem constrains rational disagreement; if not, it applies only to artificial cases.  

  **Crux 2: Can finite communication approximate common knowledge well enough to force agreement?**  
  - **Evidence**: Simulation of Bayesian agents with common priors and private signals. After \(N\) rounds of public posterior announcements, measure disagreement frequency.  
  - **Common-prior prediction**: Disagreement decays exponentially with \(N\); near-agreement occurs for small \(N\) (e.g., \(N=3\)).  
  - **Prior-skeptic prediction**: Disagreement persists non-negligibly even for large \(N\) (e.g., \(N=10\)), as finite steps ≠ common knowledge.  
  - **Why it moves the needle**: If finite communication suffices, the theorem has practical import; if not, it is irrelevant.  

  **Crux 3: Are divergent priors empirically dominant in expert disagreements?**  
  - **Evidence**: Meta-analysis of expert prediction studies (e.g., superforecasting, climate science). Code disagreements as primarily due to (a) private information or (b) divergent priors (e.g., conflicting models).  
  - **Common-prior prediction**: >50% of variance in disagreements stems from private information/asymmetric evidence.  
  - **Prior-skeptic prediction**: >50% stems from divergent priors (e.g., ideological models).  
  - **Why it moves the needle**: If divergent priors dominate, the theorem’s exclusion of them is fatal to its relevance.  

  **Crux 4: Does the theorem’s "no common-knowledge disagreement" result surprise rational agents?**  
  - **Evidence**: Lab experiment where Bayesian subjects with common priors play a game. After seeing private signals, they report if they expect disagreement under common knowledge.  
  - **Common-prior prediction**: >70% fail to anticipate the agreement result, revealing its counterintuitive depth.  
  - **Prior-skeptic prediction**: <30% are surprised; the result is seen as obvious from the setup.  
  - **Why it moves the needle**: If the result is non-obvious, it has explanatory value; if trivial, it is merely technical.  

  ---  
  **Signed**,  
  *Common-Prior Camp* & *Prior-Skeptic Camp*  
  *(as drafted in good-faith adversarial collaboration)*
