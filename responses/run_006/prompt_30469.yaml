          - Lewis's triviality: conditionals cannot simultaneously be propositions and satisfy the Adams/Stalnaker thesis without trivializing the probability space.

     II. The Adams/Stalnaker thesis (15 min)
          - The die example (even and six): P(if even then six)=P(six|even)=1/3.
          - Why it is attractive: it matches our intuitions about the probability of conditionals.

     III. The propositional assumption (10 min)
          - Conditionals are propositions: they have truth values at worlds.
          - In possible worlds semantics, we can assign truth conditions (e.g., Stalnaker's selection function).

     IV. The proof (40 min)
          - Step 1: The thesis must hold under conditionalization? Why we assume it: if we learn new evidence, we update our beliefs. The thesis should still hold.
          - Step 2: Conditioning on C: 
                   P_C(A→C) = P_C(C|A) = 1   [because under P_C, C has probability 1]
          - Step 3: Conditioning on ~C:
                   P_{~C}(A→C) = P_{~C}(C|A) = 0
          - Step 4: Law of total probability:
                   P(A→C) = P(A→C|C)*P(C) + P(A→C|~C)*P(~C) = 1*P(C) + 0*P(~C) = P(C)
          - Step 5: But by the unconditional thesis: P(A→C)=P(C|A). Therefore, P(C|A)=P(C).
          - Step 6: Triviality: for every A and C, P(C|A)=P(C). This implies the probability space is trivial.

          - Run through the die example with A=even, C=six to see the contradiction: 
                   P(A→C)=1/3, but we also get P(A→C)=P(C)=1/6 -> contradiction.

          - Why the conditionalization constraint might fail in the semantics? (The prime and even example: at world 4, A→C is false even though we are conditioning on C.)

     V. Escaping the result (20 min)
          - We must drop one assumption:
               a. Drop the propositional assumption: conditionals do not have truth conditions. Then we can have the Adams thesis without triviality. (Adams)
               b. Drop the conditionalization constraint: the thesis holds only for the prior probability. But then we face other triviality results? (Lewis showed that even without conditionalization, one can get triviality by considering multiple conditionals.)

          - Common misconceptions:
               a. Does this refute all possible-worlds semantics? 
                   - No: only those that assign propositions to conditionals and endorse the universal thesis. Some possible-worlds semantics might assign propositions and then reject the thesis? But then they must explain why the thesis seems to hold unconditionally.
               b. Are conditionals meaningless?
                   - No: they can be understood as non-propositional.

     VI. What we left out (5 min)
          - Lewis's subsequent results (without conditionalization).
          - Stalnaker's response and the details of non-propositional accounts.

     VII. Check question (5 min): 
          - "If we want to keep the Adams/Stalnaker thesis and avoid triviality, which assumption must we drop? And what would be the consequence for the semantics of conditionals?"

  This should fit in two hours.
answer: |-
  ### Session Plan: Lewis's Triviality Results for Indicative Conditionals  
  **Total Time: 2 hours**  
  **Goal:** Make the proof feel inevitable by sequencing assumptions step-by-step. Use a **single cohesive example** (a fair six-sided die) to anchor the discussion.  

  ---

  #### **1. Introduction & Intuitive Grounding (15 min)**  
  - **Purpose:** Establish the core intuition (Adams/Stalnaker thesis) with minimal formalism.  
  - **Key Move:** Start with the *assertability* of conditionals, not truth conditions.  
  - **Example:** A fair die. Define:  
    - \(A\): "Die shows even" (2, 4, 6).  
    - \(C\): "Die shows 6".  
    - **Question:** "How confident are you that *if A, then C*?"  
  - **Reveal intuition:**  
    - \(P(\text{if } A, \text{ then } C) = P(C|A) = P(6 | \text{even}) = \frac{1}{3}\).  
  - **Emphasize:** This matches natural judgments. Call this the **Adams/Stalnaker Thesis (AST)**:  
    > Probability of a conditional *just is* the corresponding conditional probability.  

  ---

  #### **2. Truth Conditions Enter the Picture (15 min)**  
  - **Purpose:** Transition from assertability to truth conditions.  
  - **Key Move:** Philosophers want conditionals to express *propositions* (truth-apt).  
  - **Possible Worlds Semantics (Stalnaker):**  
    - "If \(A\), then \(C\)" is true at world \(w\) iff \(C\) is true at the closest \(A\)-world to \(w\).  
  - **Apply to die example:**  
    - At world "6" (an \(A \land C\) world): Conditional is **true**.  
    - At world "2" (an \(A \land \neg C\) world): Conditional is **false**.  
    - At world "1" (a \(\neg A\) world): Conditional is **true** if closest even world is 6, **false** if closest is 2 or 4.  
  - **Consequence:** Conditional has a truth value at every world → it expresses a proposition.  
  - **Label this:** **Propositionality Assumption**.  

  ---

  #### **3. The Crucial Tension: Probability Meets Truth (20 min)**  
  - **Purpose:** Show that AST + Propositionality creates a conflict.  
  - **Key Move:** Use the die to expose inconsistency.  
  - **Compute probabilities with truth values:**  
    - Assume Stalnaker’s semantics. Fix a selection function (e.g., closest even world to "1" is "2").  
    - Truth table for \(A \to C\):  
      | World | Probability | \(A\) | \(C\) | \(A \to C\) |  
      |-------|-------------|-------|-------|-------------|  
      | 1     | \(1/6\)     | F     | F     | F (closest even is 2) |  
      | 2     | \(1/6\)     | T     | F     | F           |  
      | 3     | \(1/6\)     | F     | F     | F (closest even is 2) |  
      | 4     | \(1/6\)     | T     | F     | F           |  
      | 5     | \(1/6\)     | F     | F     | F (closest even is 2) |  
      | 6     | \(1/6\)     | T     | T     | T           |  
    - \(P(A \to C) = P(\text{world 6}) = \frac{1}{6}\).  
  - **Conflict:** AST says \(P(A \to C) = \frac{1}{3}\), but Propositionality forces \(P(A \to C) = \frac{1}{6}\).  
  - **Reinforce:** The example *must* lack a fixed selection function to avoid this. But even then...  

  ---

  #### **4. Lewis’s General Proof (30 min)**  
  - **Purpose:** Derive triviality from AST + Propositionality without relying on specific semantics.  
  - **Key Move:** Isolate assumptions that make the proof inevitable.  
  - **Step 1: AST under Conditionalization (Lewis's Insight)**  
    - AST must hold even after updating beliefs (e.g., learning \(C\) or \(\neg C\)).  
    - For any proposition \(E\), \(P_E(A \to C) = P_E(C|A)\).  
  - **Step 2: Conditioning on \(C\) and \(\neg C\)**  
    - Case 1: Condition on \(C\).  
      - \(P_C(A \to C) = P_C(C|A) = 1\) (since \(C\) is certain given \(C\)).  
    - Case 2: Condition on \(\neg C\).  
      - \(P_{\neg C}(A \to C) = P_{\neg C}(C|A) = 0\) (since \(\neg C\) is certain).  
  - **Step 3: Law of Total Probability**  
    \[
    P(A \to C) = \underbrace{P(A \to C|C)}_{1} \cdot P(C) + \underbrace{P(A \to C|\neg C)}_{0} \cdot P(\neg C) = P(C).
    \]  
  - **Step 4: Contradiction with AST**  
    \[
    P(A \to C) = P(C) \quad \text{(from Step 3)}, \quad \text{but} \quad P(A \to C) = P(C|A) \quad \text{(by AST)}.
    \]  
    So \(P(C|A) = P(C)\).  
  - **Step 5: Triviality**  
    - \(P(C|A) = P(C)\) must hold for *all* \(A, C\) → Events are independent → Only possible if all probabilities are 0 or 1.  
  - **Use the die:** Plug in \(A\) (even), \(C\) (6): \(P(C|A) = \frac{1}{3} \neq \frac{1}{6} = P(C)\).  

  ---

  #### **5. Escaping Triviality & Misconceptions (25 min)**  
  - **Purpose:** Clarify implications and head off misunderstandings.  
  - **The Fork in the Road:**  
    | **Option** | **Consequence** | **Proponent** |  
    |------------|-----------------|---------------|  
    | Drop **Propositionality** | Conditionals aren’t truth-apt; probabilities are "assertabilities" (not truth probabilities). | Adams |  
    | Drop **AST** | Conditionals have truth conditions, but their probabilities aren’t conditional probabilities. | ? |  
    | Drop **Conditionalization** of AST | Untenable (Lewis shows other triviality proofs without it). | — |  
  - **Crush Misconceptions:**  
    - ✘ **"This refutes all possible-worlds semantics!"**  
      - *Why wrong:* Possible-worlds semantics can survive by denying AST (e.g., Stalnaker initially resisted AST) or Propositionality.  
      - *When to address:* During Step 5.  
    - ✘ **"Conditionals are meaningless!"**  
      - *Why wrong:* Non-propositional accounts (e.g., Adams) still assign them *probabilistic* meaning.  
      - *When to address:* When discussing Option 1 above.  
  - **What We Openly Omit:**  
    - Variations of the proof (e.g., using \(A \to B\) and \(B \to A\)).  
    - Non-Stalnakerian semantics (e.g., dynamic semantics).  
    - Historical responses (e.g., Stalnaker’s 1976 attempt to keep Propositionality + AST).  

  ---

  #### **6. Check for Understanding (10 min)**  
  - **Diagnostic Question:**  
    > *"Suppose we preserve the Adams/Stalnaker thesis because it matches our intuitions about the die example. What must we give up about conditionals, and what is one consequence for how we model them?"*  
    - **Target Answer:** Give up Propositionality → Conditionals don’t express propositions; they can’t be embedded in truth-functional logic.  
  - **Why it works:** Tests grasp of the central trade-off (AST vs. Propositionality).  

  ---

  #### **Timing Buffer (5 min)**  
  - Reserve for questions or slower-paced steps.  

  ---

  ### Why This Sequence Works  
  1. **Inevitability:**  
     - Intuition (AST) → Truth-conditions → Conflict in example → General proof.  
     - Each step forces the next: AST is compelling, Propositionality is natural... but together they explode.  
  2. **The Example:**  
     - A **finite, symmetric probability space** (the die) with **overlapping events** (\(A\) and \(C\)) and **undefined selection function** (for \(\neg A\) worlds) exposes the tension.  
  3. **Misconceptions Preempted:**  
     - Addressed when alternatives are presented (Step 5), not post-hoc.  
  4. **Sharp Exit Question:**  
     - Forces participants to articulate the core dilemma.  

  **Materials:** Whiteboard for truth tables/probability calculations; handouts with die-world table.  
  **Flex Spot:** If time runs short, trim general proof (Step 4) to its key moves, not algebraic detail.
