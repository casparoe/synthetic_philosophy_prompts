prompt: |-
  I teach a graduate seminar on decision-making under uncertainty (about 16 students, one 90-minute session), and I have recently been making professional decisions in which I caught myself treating options with known probabilities quite differently from options whose probabilities I could not pin down, so I want to teach this material in a way that actually lands. Design an in-class game that makes students feel the force of ambiguity aversion before any theory is named. They already know expected utility theory but have not seen the Ellsberg paradox. The game should have them make a series of real, points-based choices between lotteries with known composition (for instance, an urn with 50 red and 50 black balls) and lotteries with unknown composition (for instance, an urn with 100 balls in unknown red/black proportions), arranged so that most students prefer the known-probability option in both directions and thereby produce a pattern that no single assignment of subjective probabilities can rationalize. Include at least one control pair where both options have known probabilities, so the class can see that what is doing the work is not ordinary risk aversion. Give me exact rules, materials, a payoff scheme that does not require real money, and a debrief that reconstructs the students' choices on the board and shows exactly where expected utility fails. Also tell me what will predictably go wrong the first time I run it—students hedging, changing answers to look consistent, or being primed by the setup—and how to handle it, and be frank about which feature of ambiguity aversion the game cannot reproduce on its own (for example, the distinction between ambiguity about the urn's composition and mere uncertainty about the draw) and that I will need to supply.
reasoning: |-
  We are going to design an in-class game based on the Ellsberg paradox to demonstrate ambiguity aversion. The game will involve two urns: 
   - Urn A: Known composition (e.g., 50 red, 50 black balls) 
   - Urn B: Unknown composition (100 balls, red and black in unknown proportion)

   We will have students make choices in two main scenarios and one control scenario:

   Scenario 1: 
     Option 1A: Bet on red from Urn A (known 50-50). 
     Option 1B: Bet on red from Urn B (unknown).

   Scenario 2: 
     Option 2A: Bet on black from Urn A (known 50-50).
     Option 2B: Bet on black from Urn B (unknown).

   Control Scenario (to show that it's not risk aversion):
     Option 3A: Bet on red from Urn A (known 50-50).
     Option 3B: Bet on black from Urn A (known 50-50). This is essentially the same as 3A in terms of risk.

   We expect that in Scenario 1, most students will prefer 1A (known) over 1B (unknown). Similarly, in Scenario 2, most will prefer 2A over 2B. 
   However, note that if they were assigning a subjective probability to Urn B, say p for red and 1-p for black, then:
     - Preferring 1A to 1B implies that 0.5 > p (because 1A gives 0.5 chance, 1B gives p)
     - Preferring 2A to 2B implies that 0.5 > 1-p (because 2A gives 0.5 chance on black, 2B gives 1-p on black)

   But 0.5 > p and 0.5 > 1-p together imply 1 > p + (1-p) = 1, which is a contradiction.

   In the control scenario, we expect they are indifferent between 3A and 3B.

   Payoff scheme: We can use points that will be converted into a chance to win a prize (e.g., a gift card) at the end. For example, each student might accumulate points, and then we draw one student to win based on the points (or use a lottery where the number of points increases the chance of winning). Alternatively, to keep it simple, we can use a random lottery incentive system: we randomly select one of the choices made by a student and then play it out for real to determine if they win a prize.

   However, to avoid real money and keep it simple, we can assign points that translate into extra credit or into entries in a raffle for a small prize (like a book or a gift card). Since it's a graduate seminar, we might use extra credit points (but check institutional policies) or just a symbolic prize.

   Materials: 
     - Two urns (or just describe them if physical urns are not available; but if possible, use two transparent urns for Urn A and one opaque for Urn B). 
     - For Urn A: 50 red and 50 black balls (or use colored paper, beads, etc.)
     - For Urn B: We can prepare it in advance without showing the composition. We can have a sealed box or an urn that we prepared earlier with an unknown mix (but actually, we can use a 50-50 mix too, but the point is that the students don't know). Alternatively, we can have an urn that we fill in front of them but without counting, but that might be messy. Better: prepare two urns for Urn A (so that we can use one for the known and one for the control) and one for Urn B that is opaque and pre-filled with 100 balls of red and black in some proportion (but unknown to students).

   Alternatively, to avoid physical materials, we can simulate the urns by computer. However, since we want them to feel the ambiguity, it's better to have a physical urn for Urn B that they don't know the composition. We can tell them that we prepared it by drawing from a large bin of red and black balls without counting, or by having an assistant fill it arbitrarily. The key is that they have no information about the proportion.

   Steps:

   1. Explain the urns:
      - Urn A: 50 red, 50 black.
      - Urn B: 100 balls, each ball is either red or black, but the proportion is unknown. It could be 0 red and 100 black, 1 red and 99 black, ... up to 100 red and 0 black.

   2. Explain the choices: For each scenario, they choose one of two options. Each option is a bet on a color from an urn. If the ball drawn is the chosen color, they win 100 points. Otherwise, 0.

   3. We will present the scenarios one by one and have the students write down their choices on a slip of paper (or via clickers if available). We need to make sure they don't change their answers after seeing the next scenario.

   4. Scenarios:

      Scenario 1:
        Option 1A: Bet on red from Urn A.
        Option 1B: Bet on red from Urn B.

      Scenario 2:
        Option 2A: Bet on black from Urn A.
        Option 2B: Bet on black from Urn B.

      Scenario 3 (Control):
        Option 3A: Bet on red from Urn A.
        Option 3B: Bet on black from Urn A.

   5. After collecting the choices, we tally the results.

   6. We then draw a ball from each urn to determine the outcomes for the selected bets (if we are using a random lottery incentive). But note: we are going to randomly select one scenario and one student to play for real? Alternatively, we can assign points for each scenario and then one student is drawn to win a prize proportional to their total points? But that might be complex.

   7. Alternatively, to avoid playing out every bet, we can use a different incentive: each student's choices will be played out only for one randomly selected scenario (and then for that scenario, we draw a ball from the appropriate urn for their chosen option). We do this for every student? That might be time-consuming. Instead, we can randomly select one student and then randomly select one of their three scenarios to play. Then we draw the ball for that scenario and option they chose. If they win, they get a prize (e.g., a $10 gift card).

   8. However, to keep it simple and focus on the lesson, we might not need a high-stakes real payoff. We can use a show of hands and then discuss the pattern. But to make it real, we should have some payoff. We can do:

      - Each student makes choices for all three scenarios.
      - We randomly select one scenario (say, by rolling a die: 1,2,3) and one student (by drawing a name).
      - Then we implement the chosen student's choice in the selected scenario and award the prize accordingly.

   9. Debrief:

      Step 1: Report the results. How many chose 1A vs 1B? How many chose 2A vs 2B? How many chose 3A vs 3B?

      Expected pattern: 
          Scenario 1: Majority for 1A.
          Scenario 2: Majority for 2A.
          Scenario 3: Roughly split (or indifferent).

      Step 2: Point out that if we assume each student has a subjective probability p for red in Urn B, then:
          - Choosing 1A over 1B implies: 0.5 > p   [because 0.5 chance of winning in 1A, p in 1B]
          - Choosing 2A over 2B implies: 0.5 > 1-p [because 0.5 chance of winning in 2A (betting on black in A), and 1-p chance in 2B (betting on black in B)]

      Step 3: But then 0.5 > p and 0.5 > 1-p together imply 1 > p + (1-p) = 1, which is impossible.

      Step 4: Therefore, there is no single subjective probability p that can rationalize both choices.

      Step 5: Explain that this pattern is called ambiguity aversion: people prefer known probabilities (risks) over unknown probabilities (ambiguities). And this is the Ellsberg paradox.

   10. What might go wrong:

       a) Hedging: Students might think that by choosing 1B and 2B they are "hedging" because they believe the two urns are independent. But note, the two scenarios are separate bets. We are not asking them to choose both at the same time. We present them as separate decisions. To avoid hedging, we must emphasize that each choice is independent and will be played separately (if selected). Also, we can tell them that if they are selected, only one of their choices will be played.

       b) Changing answers: To prevent students from changing their answers to be consistent, collect the answers for each scenario immediately after presenting it, and do not show the next scenario until the current one is collected. Or have them write all three on one sheet but without going back? But then they might see the next and adjust. Better: present one scenario at a time, collect the choice, then move to the next.

       c) Priming: The setup might prime them to think about the paradox. To avoid this, don't mention ambiguity. Just describe the urns and the bets.

       d) They might not believe the unknown urn is truly ambiguous. We need to convince them that we have not given any information about Urn B. We can say: "Urn B was filled by an assistant who did not record the proportion, and we did not look, so we have no information." Or we can have a sealed container that we open only at the end.

       e) In the control scenario, if they are not indifferent, it might be because they think the urn A is biased? But we know it's 50-50. We can show them the urn.

   11. What the game cannot reproduce on its own:

       The game sets up ambiguity about the composition of the urn, but the students might still treat it as uncertainty about the draw (which it is). The distinction is that in the known urn, the probability is objective. In the unknown urn, the probability is not known. The game does not by itself explain why ambiguity aversion might be rational or not. We will need to supply the idea that in the unknown urn, the lack of information about the composition leads to a second-order uncertainty that people dislike.

   12. Rules:

       - We have two urns: 
            Urn A: 50 red, 50 black (transparent so they can see the mix? or we show them the balls and then put them in an opaque container and mix? but we can also just describe and they trust).
            Urn B: Opaque, 100 balls of red and black in unknown proportion.

       - We present three scenarios. For each scenario, the student chooses one option.

       - In each scenario, if the ball drawn is the color they bet on, they win 100 points (which might translate into a chance for a prize). Otherwise, 0.

       - We will randomly select one student and one scenario to play for real. For the selected student and scenario, we draw one ball from the appropriate urn (A or B) according to the option they chose. If they win, they get a prize (e.g., a $10 gift card). If not, they get nothing.

   13. Alternative payoff: Instead of one prize, we can have multiple prizes. But one is enough.

   14. To make it more engaging, we can ask the selected student to come and draw the ball.

   15. Debriefing reconstruction:

       - Write the three scenarios on the board.

       - Record the counts for each choice.

       - Show the pattern: 
            Scenario 1: Most chose 1A -> implies p < 0.5 for red in Urn B.
            Scenario 2: Most chose 2A -> implies 1-p < 0.5, i.e., p > 0.5.

       - This contradiction shows that the choices cannot be explained by any single probability assignment.

       - Introduce the term "ambiguity aversion".

   16. Finally, note that in reality, Urn B might be 50-50 too, but the point is the lack of knowledge.

   Let me write the exact script for the class:

   "Welcome. Today we are going to play a simple game with urns and balls. We have two urns. 
    Urn A contains exactly 50 red balls and 50 black balls. 
    Urn B contains 100 balls, each either red or black, but I do not know the proportion and you do not know the proportion. It could be any mix.

    We are going to do three separate betting scenarios. In each scenario, you will choose between two options. Each option is a bet on a color from an urn. If the ball drawn from that urn is the color you bet on, you win 100 points. Otherwise, you win 0.

    After all three scenarios, we will randomly select one student and one scenario. We will then play out that scenario for that student. If they win, they get a [prize description]. 

    Let's do Scenario 1:
        Option 1A: You bet on red from Urn A.
        Option 1B: You bet on red from Urn B.

    Please write down your choice: 1A or 1B.

    [Collect responses]

    Scenario 2:
        Option 2A: You bet on black from Urn A.
        Option 2B: You bet on black from Urn B.

    Please write down your choice: 2A or 2B.

    [Collect responses]

    Scenario 3 (Control):
        Option 3A: You bet on red from Urn A.
        Option 3B: You bet on black from Urn A.

    Please write down your choice: 3A or 3B.

    [Collect responses]

    Now, we tally the results and then we will randomly select one student and one scenario."

    [After tallying and playing the selected scenario for the selected student, proceed to debrief.]

    Debrief:

    "Look at the results: 
        Scenario 1: X chose 1A, Y chose 1B.
        Scenario 2: X' chose 2A, Y' chose 2B.
        Scenario 3: Z chose 3A, W chose 3B.

    We see that in Scenario 1, most of you preferred 1A (the known urn) to 1B (the unknown urn). Similarly, in Scenario 2, most preferred 2A to 2B.

    Now, suppose for Urn B, each of you had a personal belief p about the probability of drawing a red ball. Then:
        - Choosing 1A over 1B implies that 0.5 > p (because 1A gives 0.5 chance of winning, 1B gives p).
        - Choosing 2A over 2B implies that 0.5 > 1-p (because 2A gives 0.5 chance of winning by betting on black in A, and 2B gives 1-p chance on black in B).

    But then we have:
          0.5 > p
          0.5 > 1-p
          Adding these: 1 > p + (1-p) => 1 > 1, which is a contradiction.

    Therefore, there is no single probability p that can explain both choices.

    What is happening? This is called ambiguity aversion: people dislike not knowing the probabilities. They prefer known risks (like Urn A) over unknown risks (like Urn B). This pattern of choice is known as the Ellsberg paradox.

    Note that in the control scenario (Scenario 3), we see that you are roughly indifferent between betting on red or black in Urn A, which shows that you are not averse to the risk in Urn A per se, but to the ambiguity in Urn B.

    This behavior violates expected utility theory because expected utility theory assumes that people assign probabilities to uncertain events and then maximize expected utility. But here, you cannot assign a single probability to the events in Urn B that is consistent with both choices.

    We will study models that can explain this, such as the maxmin expected utility or alpha-maxmin, in the next class."

   17. What if the results don't show the pattern? 
        - It's possible. In that case, you can still show the logic: if even a fraction of the class (say half) chose 1A and 2A, then we can say that for those students, the contradiction holds. And we can point out that ambiguity aversion is a common, but not universal, phenomenon.

   18. Materials list:
        - Urn A: A container with 50 red and 50 black balls (or use other objects, but make sure they are indistinguishable except by color).
        - Urn B: An opaque container with 100 balls of red and black. We can fill it arbitrarily (e.g., 50 red and 50 black, but don't tell them; or 60-40, it doesn't matter as long as they don't know). We can even fill it in a way that we don't know by having someone else do it and seal it.

   19. Time: The game should take about 15-20 minutes, then debrief 10-15 minutes.

   20. Potential issue: Students might think that the unknown urn has a different probability and that's why they are avoiding it. But the point is that they don't know, and that is what causes the aversion.

   This design should achieve the goal.
answer: |-
  ### In-Class Game: The Ambiguity Urn Challenge  
  **Objective:** Make students experience ambiguity aversion through choices between known-probability and ambiguous-probability lotteries, revealing a pattern inconsistent with expected utility theory.  

  ---

  #### **Materials**  
  1. **Urn A (Known Probability):**  
     - Transparent jar with **50 red balls and 50 black balls** (e.g., colored ping-pong balls).  
     - Label: "Urn A: 50 Red, 50 Black."  

  2. **Urn B (Ambiguous Probability):**  
     - Opaque jar with **100 balls of unknown red/black composition** (pre-filled secretly with 50 red/50 black, but students *don’t know this*).  
     - Label: "Urn B: Unknown Red/Black Proportion."  

  3. **Ball-Drawing Mechanism:**  
     - A bag or rolling cart to conceal draws (prevents students from inferring compositions).  

  4. **Student Worksheets:**  
     - Sheets with 4 choice pairs (see below). Students circle preferred options.  
     - **No names** (anonymous to reduce social pressure).  

  5. **Payoff Scheme (No Real Money):**  
     - Points translate into raffle tickets for a prize (e.g., $20 gift card, extra credit).  
     - **Procedure:**  
       - After choices, randomly select **one student’s worksheet** and **one question** (1–4) to play for real.  
       - Draw a ball from the relevant urn per their choice.  
       - If they "win," they get 5 raffle tickets (losing: 1 ticket). Hold a raffle post-class.  

  ---

  #### **Game Rules & Choice Pairs**  
  **Instructions to Students:**  
  *"You’ll make 4 choices. Each is a bet on a ball draw. If your chosen color is drawn, you ‘win’; else, you ‘lose.’ We’ll randomly pick one person’s choice to play for real raffle tickets. Urn A has 50 red/50 black balls. Urn B has 100 red/black balls in unknown proportions."*  

  1. **Choice Pair 1 (Red Known vs. Red Ambiguous):**  
     - **Option A:** Bet on **red from Urn A** (50% win chance).  
     - **Option B:** Bet on **red from Urn B** (unknown win chance).  

  2. **Choice Pair 2 (Black Known vs. Black Ambiguous):**  
     - **Option A:** Bet on **black from Urn A** (50% win chance).  
     - **Option B:** Bet on **black from Urn B** (unknown win chance).  

  3. **Choice Pair 3 (Control: Known vs. Known):**  
     - **Option A:** Bet on **red from Urn A** (50% win chance).  
     - **Option B:** Bet on **black from Urn A** (50% win chance).  

  4. **Choice Pair 4 (Replication Check):**  
     - *Same as Pair 1* (to test consistency; most will repeat initial choice).  

  **Key:**  
  - **Ellsberg Setup:** Pairs 1 & 2 test ambiguity aversion.  
  - **Control:** Pair 3 tests risk aversion (should be ~50/50 split).  
  - **Replication:** Pair 4 ensures choices aren’t random.  

  ---

  #### **Predictable Issues & Mitigation**  
  1. **Hedging Across Choices:**  
     - **Risk:** Students pick 1B (red ambiguous) and 2B (black ambiguous) to "cover" Urn B, rationalizing it as a 50% chance.  
     - **Fix:** Emphasize: *"Each choice is independent. Only one will be played, so choose based ONLY on that bet."*  

  2. **Changing Answers for Consistency:**  
     - **Risk:** Students revise later choices to align with earlier ones (e.g., avoid 1A + 2A to not appear inconsistent).  
     - **Fix:** Use **anonymous worksheets** collected after all choices. Don’t reveal results until debrief.  

  3. **Primed by Setup:**  
     - **Risk:** "Unknown proportion" cues ambiguity aversion, making the paradox obvious.  
     - **Fix:** Describe Urn B neutrally: *"Urn B was filled by a previous class who recorded no totals. We have no information."*  

  4. **Urn B Distrust:**  
     - **Risk:** Students assume Urn B is "rigged" (e.g., 0 red/100 black).  
     - **Fix:** Pre-fill Urn B with 50/50 to ensure fairness, but **don’t reveal until debrief**.  

  ---

  #### **Debrief: Reconstructing the Paradox**  
  **Step 1: Report Results**  
  - Tally choices anonymously on the board:  
    ```  
    Pair 1 (Red):   Option A [X] | Option B [Y]  
    Pair 2 (Black): Option A [X] | Option B [Y]  
    Pair 3 (Control): Option A [P] | Option B [Q]  
    ```  
  - **Expected Pattern:**  
    - Pair 1: Most choose Option A (known red).  
    - Pair 2: Most choose Option A (known black).  
    - Pair 3: ~50/50 split (proving no risk aversion).  

  **Step 2: Challenge Expected Utility Theory**  
  - *Assume* students assign subjective probability `p` to Urn B having a red ball.  
  - **Logic Breakdown:**  
    - Choosing **Option A in Pair 1** implies:  
      `0.5 (known) > p (ambiguous red)` → **p < 0.5**.  
    - Choosing **Option A in Pair 2** implies:  
      `0.5 (known black) > 1 - p (ambiguous black)` → **p > 0.5**.  
  - **Contradiction:** `p < 0.5` and `p > 0.5` can’t coexist. No single `p` rationalizes both choices!  

  **Step 3: Introduce Ambiguity Aversion**  
  - "Your choices reveal **ambiguity aversion**: Penalizing options with unknown probabilities. This violates expected utility, which assumes you always assign a consistent `p`.  
  - **Real-World Analogy:** Treating stocks (known volatility) differently from crypto (ambiguous volatility) even if expected returns are similar."  

  **Step 4: Address the "Unknown Urn" Limitation**  
  - **What the Game Can’t Show:**  
    - Ambiguity aversion stems from **not knowing the composition** (e.g., Urn B’s ratio), not just uncertainty about the draw.  
    - **Clarify Post-Debrief:**  
      - "In Urn A, risk comes only from the random draw. In Urn B, risk comes from *not knowing the odds themselves*. That second layer causes aversion."  

  ---

  #### **Why This Works**  
  - **Experiential Learning:** Students *feel* aversion before labeling it, making theory resonate.  
  - **Control Pair:** Rules out risk aversion as the driver.  
  - **Paradox Visible:** Results create an "aha!" moment when choices conflict mathematically.  
  - **Low Stakes:** Raffle tickets incentivize truthfulness without ethical/legal concerns.  

  **First-Run Tip:** Pre-fill worksheets for 2–3 confederates to ensure the paradox emerges even if some hedge. Reveal this trick during debrief to discuss biases.
