  I should consider the contexts of each work. The essay is a polemic addressing contemporary issues in 1946, targeting writers and intellectuals in a democratic society. It’s diagnostic, showing how passive decay happens. *1984* is a dystopian projection, imagining a future where totalitarian regimes actively weaponize language. So, the mechanisms differ because the contexts are different. The essay deals with negligence, while the novel deals with intent.

  Another angle is the bidirectional relationship between language and thought. Orwell likely believed that language both shapes and reflects thought. The essay emphasizes how degraded language makes it harder to think clearly, perpetuating the cycle. The novel shows a deliberate effort to weaponize this relationship. So the core principle is the same: language and thought are intertwined. The difference is in agency—passive vs. active, individual vs. systemic.

