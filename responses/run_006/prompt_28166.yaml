  ### Game Design: The Hitchhiker's Dilemma  
  This game simulates Parfit's hitchhiker problem, highlighting the tension between synchronic and diachronic rationality. Players experience a bad equilibrium (no trust, no cooperation) and then use a commitment device to achieve better outcomes.  

  ---

  ### **Game Overview**  
  - **Players**: 16 students (8 pairs per round).  
  - **Rounds**: 3 rounds (Baseline → Commitment Round 1 → Commitment Round 2).  
  - **Roles per Round**: Randomly assigned as **A** (hitchhiker) or **B** (driver) in each pair.  
  - **Objective**: Maximize points. 1 point = 1 token (use poker chips or tally sheets).  

  ---

  ### **Rules & Payoffs**  
  #### **Round 1: Baseline (No Commitment)**  
  1. **Setup**:  
     - Randomly pair students. Assign roles (A/B) via coin flip.  
     - **A** can send a promise note: “I will pay you if you help.” (Cheap talk; no enforcement.)  
  2. **B’s Choice**:  
     - **Help**: Costs B 2 points. Triggers A’s choice.  
     - **Not Help**: Both get 0 points.  
  3. **A’s Choice (if helped)**:  
     - **Pay**: A gains 10 points but pays 5 to B → A nets 5, B nets 3 (5 received - 2 cost).  
     - **Not Pay**: A keeps 10 points; B loses 2 points.  
  4. **Payoff Summary**:  
     | B’s Action | A’s Action (if helped) | A’s Points | B’s Points |  
     |------------|--------------------------|------------|------------|  
     | Not Help   | —                        | 0          | 0          |  
     | Help       | Pay                      | 5          | 3          |  
     | Help       | Not Pay                 | 10         | -2         |  

  **Rationale**: Without commitment, A *should* choose "Not Pay" (10 > 5), so B *should* choose "Not Help" (0 > -2). The bad equilibrium is (0, 0).  

  #### **Rounds 2 & 3: Commitment Rounds**  
  1. **Setup**:  
     - **New Step**: Players choose whether to buy a **Commitment Card** for 1 point (paid upfront).  
       - Card = Binding promise to pay if helped (as A).  
       - Card is visible to partners.  
     - Randomly reassign pairs/roles.  
  2. **B’s Choice**:  
     - **Help**: Costs B 2 points.  
     - **Not Help**: Both get 0 (minus card cost if applicable).  
  3. **A’s Choice (if helped)**:  
     - **With Card**: **Forced to Pay** (A nets 10 - 5 - 1 card cost = 4 points; B nets 3).  
     - **Without Card**: Chooses freely (Pay/Not Pay, same as Round 1).  
  4. **Payoff Summary**:  
     | A’s Card? | B’s Action | A’s Action (if helped) | A’s Points | B’s Points |  
     |-----------|------------|--------------------------|------------|------------|  
     | Yes       | Help       | Forced Pay              | 4          | 3          |  
     | Yes       | Not Help   | —                        | -1         | 0          |  
     | No        | Help       | Pay                     | 5          | 3          |  
     | No        | Help       | Not Pay                 | 10         | -2         |  
     | No        | Not Help   | —                        | 0          | 0          |  

  **Key Incentive**:  
  - B helps *only* if A has a card (B avoids -2).  
  - Buying a card guarantees A gets helped (netting 4), while non-buyers risk 0.  

  ---

  ### **Materials**  
  - **Tokens**: Poker chips (red = 1 point, blue = 5 points) or paper tally sheets.  
  - **Cards**: Index cards labeled “COMMITTED” for buyers.  
  - **Role Assigner**: Coin (heads = A, tails = B) or randomizer app.  
  - **Promissory Notes**: Small paper slips for A’s promise (Round 1).  

  ---

  ### **Game Flow**  
  1. **Round 1 (Baseline)**:  
     - Assign pairs/roles → A sends promise (optional) → B chooses → A chooses (if helped).  
     - Record payoffs. Expectation: Most Bs choose "Not Help," leading to (0, 0).  
  2. **Round 2 (Commitment)**:  
     - Players buy cards (or not) → Assign pairs/roles → A reveals card → B chooses → A acts.  
     - Record payoffs. Expectation: Buyers get 4 (as A) or 2 (as B); non-buyers get 0 (as A) or 3 (as B).  
  3. **Round 3 (Commitment)**:  
     - Repeat Round 2. Expectation: More players buy cards; buyers outperform non-buyers.  

  **Scoring Example**:  
  - **Buyer**: Pays 1 point upfront. As A: 4 points net. As B: 3 - 1 = 2 points net.  
  - **Non-Buyer**: As A: 0 points. As B: 3 points.  
  - **Avg. Buyer vs. Non-Buyer**: Buyers average 3 points; non-buyers average 1.5 points.  

  ---

  ### **Debrief Guide**  
  **1. Synchronic vs. Diachronic Rationality**:  
  - **Synchronic (Round 1)**:  
    - At the moment of choice, A *should* defect (Not Pay: 10 > 5).  
    - Thus, B *should* defect (Not Help: 0 > -2).  
    - Result: Bad equilibrium (0, 0).  
  - **Diachronic (Rounds 2-3)**:  
    - Buying a card is irrational *synchronicly* (paying 1 point for no immediate gain).  
    - But *diachronicly*, it’s rational: It binds future choices, enabling cooperation (A gets 4 > 0).  

  **2. What the Game Leaves Out**:  
  - **Penalty vs. Genuine Disposition**:  
    - The card acts as a *penalty* (alters payoffs; paying becomes rational).  
    - Parfit’s hitchhiker requires *acting against self-interest* due to a disposition (e.g., honesty), not a payoff shift.  
    - **Critical Discussion**: *Can rationality require cultivating "irrational" dispositions?* (e.g., honesty that overrides self-interest).  
  - **Real-World Limits**:  
    - Cards are perfect commitment devices; real dispositions are messy (costly to cultivate/reverse).  
    - Social norms (e.g., guilt) may enable cooperation without devices—but are hard to control strategically.  

  **3. Predictable Issues & Solutions**:  
  - **Problem**: Students cooperate in Round 1 due to social pressure.  
    - **Solution**:  
      - Pre-game: Emphasize anonymity, self-interest, and no repeated interactions.  
      - During: If cooperation occurs, highlight inefficiency (e.g., Bs who helped got -2 if A defected).  
      - Post-game: Contrast social norms (Round 1) vs. strategic rationality (Rounds 2-3).  
  - **Other Issues**:  
    - **Misunderstanding**: Simplify rules; use a practice round.  
    - **Randomness**: Use >1 baseline round to converge to (0, 0).  
    - **Card Cost**: If students resist buying, show payoff math (buyers’ expected points > non-buyers’).  

  **4. Philosophical Takeaway**:  
  - **Key Insight**: Diachronic rationality can justify *limiting future choices* to escape bad equilibria.  
  - **Parfit Connection**: Like Ulysses binding himself to the mast, commitment devices align moment-by-moment choices with long-term goals.  
  - **Debate Prompt**: *Is it rational to be irrational? When?*  

  ---

  ### **Time Allocation**  
  - Setup: 5 min  
  - Round 1: 10 min  
  - Round 2: 15 min (includes card purchase)  
  - Round 3: 15 min  
  - Debrief: 20 min  
  - Wrap-up: 5 min  

  Total: 70 minutes (allows buffer).  

  This game forces students to confront the paradox of rationality while experiencing the power of pre-commitment. By making the device optional, it starkly illustrates why diachronic reasoning can trump synchronic optimization.
