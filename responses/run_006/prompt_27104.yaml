  For the dialogue flow: I'll start with Vale presenting the decompositional view, then Ross challenging it with the two-story example. They'll debate whether the stem role exists in two-story 'a's, whether similarity explains category boundaries, and whether style can be cleanly separated. Each should force the other to confront weaknesses: Vale must explain why some roles seem missing in two-story forms, while Ross must account for why we perceive both as 'a' despite structural differences. 

