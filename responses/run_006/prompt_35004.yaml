answer: |-
  Your observations reveal a profound disconnect between practical epistemic practices in investigations and oversimplified legal/evidential frameworks. The fourfold distinction you've identified aligns remarkably well with the **Pramāṇa theory** of classical Indian epistemology (Nyāya school), which treats these as irreducible "sources of knowledge" (*pramāṇas*). Below is a detailed analysis followed by the requested JSON summary.

  ---

  ### (a) Named View & Tradition
  - **Named View**: **Pramāṇa Theory** (specifically the *Caturpramāṇa* model)
  - **Tradition**: **Classical Indian Philosophy** (Nyāya school, with refinements in Advaita Vedānta and Buddhism)

  ### (b) The Four Canonical Kinds
  Indian epistemology recognizes six *pramāṇas*, but four map directly to your categories:

  | **Your Kind** | **Pramāṇa Name** | **Translation** | **Definition** | **Boundaries** |
  |---------------|------------------|-----------------|----------------|----------------|
  | **1. Firsthand perception** | *Pratyakṣa* | Perception | Direct, non-inferential cognition via senses/mind. Must be *non-erroneous* and *presentational* (not memory-based). | **Not:** Hearsay, reconstructed events, or interpretations requiring inference. |
  | **2. Inference from facts** | *Anumāna* | Inference | Knowledge derived through logical reasoning from established facts (e.g., "Smoke implies fire"). Requires a universal connection (*vyāpti*) between evidence and conclusion. | **Not:** Direct observation, testimony, or pattern-matching without explicit premises. |
  | **3. Authoritative testimony** | *Śabda* | Verbal testimony | Knowledge from a reliable source's words. Requires *competence* and *truthfulness* of the speaker. | **Not:** Anonymous tips, sources without direct access, or testimony contradicted by evidence. |
  | **4. Pattern recognition** | *Upamāna* | Comparison/analogy | Knowledge from similarity ("X is like Y"). Recognizes novel objects/situations by analogy to known exemplars. | **Not:** Deductive inference, direct perception, or testimony. |

  ### (c) Alignment and Divergence
  - **Alignment**: Your categories 1–4 map *structurally* to *pratyakṣa*, *anumāna*, *śabda*, and *upamāna*. All are treated as epistemically distinct.
  - **Divergences**:
    1. **Scope of *Upamāna***: Classical *upamāna* focuses on object identification (e.g., "A gavaya is like a cow"). Your "pattern recognition" is broader, covering procedural/organizational similarities, which may stretch the classical definition.
    2. **Śabda and Credibility**: Nyāya demands explicit verification of a source's reliability *before* accepting testimony. Your team may accept credibility intuitively (a tension in your observation).
    3. **Psychological Primacy**: Indian systems prioritize articulable justification. Your note that "recognition arrives before articulation" is less emphasized.

  ### (d) Boundary Disputes to Anticipate
  When implementing this framework, expect disputes at these edges:
  1. **Testimony vs. Inference**:  
     - *Dispute*: Is a whistleblower's report *śabda* (testimony), or *anumāna* (if you infer reliability from their credentials)?  
     - *Resolution*: Treat as *śabda* if the report is accepted *prima facie* due to source authority; shift to *anumāna* if reliability is actively debated.
     
  2. **Pattern Recognition vs. Inference**:  
     - *Dispute*: Is "this email matches the 2019 cover-up pattern" *upamāna* (analogy) or *anumāna* (inference from past cases)?  
     - *Resolution*: Classify as *upamāna* if similarity triggers immediate recognition; *anumāna* if consciously extrapolated via rules.

  3. **Perception vs. Testimony**:  
     - *Dispute*: If Investigator A sees a document (perception), but Investigator B relies on A's description, is B using *pratyakṣa* or *śabda*?  
     - *Resolution*: B uses *śabda* (testimony from A). *Pratyakṣa* requires firsthand access.

  4. **Pattern Recognition vs. Perception**:  
     - *Dispute*: Is recognizing a "threatening tone" in an email *pratyakṣa* (directly perceived) or *upamāna* (analogy to past threatening emails)?  
     - *Resolution*: If tone is immediately felt, it's *pratyakṣa*; if it requires comparison to prior cases, it's *upamāna*.

  ---

  ### Why This Framework Works for Your Context
  1. **Irreducibility**: Each *pramāṇa* is a primary warrant. Testimony (*śabda*) isn't reduced to inference, resolving your "dressing up" problem.
  2. **Legitimizes Pattern Recognition**: *Upamāna* validates similarity-based knowledge as non-inferential, protecting it from being dismissed as "just intuition."
  3. **Error Diagnosis**: Each *pramāṇa* has unique failure modes (e.g., *śabda* fails if the source lies; *upamāna* fails if the analogy is superficial).

  ---

  ### JSON Summary

  ```json
