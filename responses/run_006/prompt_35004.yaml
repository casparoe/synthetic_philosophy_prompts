      }
    ],
    "fit_quality": "close",
    "mismatches": [
      "Classical upamāna is narrower, focusing on object identification via analogy (e.g., 'a gavaya is like a cow'), while your Kind 4 includes procedural/organizational patterns.",
      "Śabda in Nyāya requires explicit verification of source reliability; your team may accept testimony more intuitively.",
      "Indian systems emphasize articulable justification, whereas your Kind 4 notes recognition precedes articulation."
    ],
    "boundary_disputes": [
      "Testimony vs. Inference: Whether accepting a whistleblower's account is śabda (testimony) or anumāna (inference from their reliability indicators).",
      "Pattern Recognition vs. Inference: Whether identifying a pattern (e.g., 'like the 2019 emails') is upamāna (analogy) or anumāna (inference from past cases).",
      "Perception vs. Testimony: Whether a secondhand description of a document is pratyakṣa (if 'perceived' via report) or śabda (testimony).",
      "Pattern Recognition vs. Perception: Whether sensing a 'threatening tone' is pratyakṣa (direct perception) or upamāna (analogy to past communications)."
    ]
  }
  ```

  ### Implementation Advice
  1. **Train with Case Studies**: Use past investigations to classify evidence by the four *pramāṇas*. Highlight boundary disputes explicitly.
  2. **Require Warrant Tags**: In reports, mandate labeling each evidential claim with its epistemic basis (e.g., "ŚABDA: Whistleblower account").
  3. **Audit for Over-Reliance**: Track which *pramāṇas* your team uses most. Over-indexing on *śabda* or *upamāna* may indicate investigative bias.
  4. **Defend Boundaries**: Insist that *śabda* and *upamāna* are not subsets of *anumāna*. Testimony and analogy warrant beliefs in distinct ways.

  This framework provides the conceptual "carving" you seek, grounding your team’s practice in a 2,500-year-old epistemology designed to resolve exactly the confusions you describe.
