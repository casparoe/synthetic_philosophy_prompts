answer: |-
  Here’s a targeted Q&A prep sheet for your colloquium, designed around your audience’s composition and expertise. Objections are ordered by **likelihood + damage potential**, with replies and candid weakness assessments.

  ---

  ### **Q&A Prep Sheet: Evolutionary Debunking Argument Colloquium**

  #### **1. Third-Factor Objection (Realist Faculty)**  
  *"Your dismissal of third-factor explanations is too quick. If moral facts *ground* what promotes flourishing (e.g., cooperation), and evolution selects for traits that promote flourishing, our intuitions *would* track moral facts without coincidence. This isn’t pre-established harmony—it’s a constitutive connection."*  
  **Reply (2-min):** "This conflates grounding with explanation. Even if moral facts *are* identical to natural facts (e.g., flourishing), the evolutionary explanation only references the natural properties (survival, cooperation). It doesn’t require or evidence the *moral* layer. Without independent reason to think morality reduces to flourishing, this assumes realism to ‘save’ it—begging the question."  
  **Weakness:** Assumes non-reductionism; realists will argue flourishing *just is* moral (naturalist realism).  

  #### **2. Epistemic Scope Problem (Epistemologist)**  
  *"If your argument works, it debunks *all* evolved cognitive faculties (e.g., perception, logic). But we don’t think evolution defeats math. Why are moral intuitions uniquely vulnerable?"*  
  **Reply (2-min):** "Perception/logic are *directly* fitness-enhancing: misperceiving lions is fatal. Moral intuitions regulate social behavior—adaptive *regardless* of truth (e.g., tribal altruism). Further, math/logic may be necessarily true if evolution selects for truth-tracking in domains where error is costly. No parallel necessity in morality."  
  **Weakness:** Hard to prove math/logic *wouldn’t* be vulnerable if error weren’t costly (e.g., in abstract domains).  

  #### **3. Constructivist Sidestep (Expressivist Grad Student)**  
  *"Why should realists care? Even if evolution explains intuitions, it doesn’t touch *moral propositions*—only the psychological basis. Realists don’t ground truth in intuitions!"*  
  **Reply (2-min):** "Realism requires an *epistemic link* to mind-independent truths. If our sole cognitive access to moral facts is via intuitions shaped by amoral processes, and no independent check exists (unlike science), we lose justification. This isn’t about grounding truth *in* intuitions—it’s about losing warrant *for* believing truths."  
  **Weakness:** Realists may argue for reflective equilibrium or rational intuition as independent checks.  

  #### **4. "Not All Intuitions" Pushback (Moral Realist)**  
  *"Evolution explains *basic* intuitions (e.g., kin loyalty), but refined moral judgments (e.g., human rights) arise from rational deliberation. Your target is a straw man."*  
  **Reply (2-min):** "Rational deliberation depends on foundational intuitions (e.g., ‘pain is bad’). If *those* are debunked, the edifice crumbles. Even sophisticated norms often map to fitness (e.g., impartiality aids coalition-building). If evolution explains the core machinery, adding ‘rationality’ doesn’t restore warrant without showing how it accesses *moral* (not just strategic) truth."  
  **Weakness:** Concedes that some intuitions may be evolutionarily inert; hard to prove all are tainted.  

  #### **5. Philosopher of Biology: Adaptationism Critique**  
  *"You assume moral traits are *adaptations*. But many could be byproducts (exaptations) of general intelligence. If so, doesn’t that void the ‘coincidence’ worry?"*  
  **Reply (2-min):** "Even as byproducts, moral intuitions are causally tied to non-moral selective pressures (e.g., emotion regulation). The key point remains: there’s no evolutionary reason to expect byproducts to track *moral* truths. Truth-tracking requires explanation—whether by adaptation or exaptation."  
  **Weakness:** Risks overgeneralizing; if exaptations *can* be truth-tracking (e.g., curiosity), this needs more nuance.  

  #### **6. Dialectical Ineffectiveness (Constructivist Faculty)**  
  *"Expressivists/constructivists already grant intuitions don’t track mind-independent truths. Why is this argument persuasive against *us*? It only preaches to the choir."*  
  **Reply (2-min):** "First, it pressures naturalist realists who rely on intuition as evidence. Second, it shows why anti-realist alternatives are *more parsimonious*: they don’t require a mysterious coincidence. Finally, it forces realists into defensible territory (e.g., rationalism), which has its own challenges."  
  **Weakness:** Doesn’t advance the anti-realist positive case; may feel like overkill to fellow skeptics.  

  #### **7. Modal Security Objection (Epistemologist)**  
  *"Debunking arguments only work if they show our beliefs are *insensitive* to the truth. But evolution doesn’t make moral beliefs *necessarily* false—it just adds a cause. Why isn’t this a mere ‘underminer’?"*  
  **Reply (2-min):** "The defeater is *undercutting*, not *rebutting*. It attacks the connection between belief and truth, not the belief’s content. If the best explanation of why we hold belief P makes no reference to P’s truth, and no independent link exists, we lose reason to think P is true—even if it *could* be."  
  **Weakness:** Requires accepting that explanatory irrelevance undermines justification—controversial in epistemology.  

  #### **8. Self-Defeat Worry (Grad Student Realist)**  
  *"Your argument uses reason/science—which are also evolved. If evolution debunks morality, doesn’t it debunk your own premises?"*  
  **Reply (2-min):** "No, because the argument targets *domain-specific* defeaters. Evolution *directly* selects for truth-tracking in logical/perceptual domains (error = death). Morality lacks this selective pressure. We can trust reason *to the extent* it’s truth-constrained; morality isn’t similarly constrained."  
  **Weakness:** Boundaries between "domains" are fuzzy; moral reasoning may overlap with rational capacities.  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"Your argument hinges on the claim that evolutionary explanations ‘fail to reference’ moral facts. But if moral facts *supervene* on natural properties (e.g., well-being), and evolution selects for those properties, why isn’t that *sufficient* reference? Isn’t this just the explanatory exclusion problem for non-naturalists?"*  

  **Why it’s damaging:**  
  - Forces you into defending non-naturalism’s explanatory uniqueness.  
  - Philosophers of biology will note that evolution *does* reference supervenience bases (e.g., pain avoidance).  
  - Undercuts the "coincidence" claim by making tracking unsurprising.  

  **Reply (2-min):** "Supervenience alone doesn’t resolve the epistemic issue. Evolution explains why we avoid pain *as a natural property*, not *as a moral wrong*. The moral layer adds no explanatory power to the evolutionary story—so we lack reason to think our intuitions ‘detect’ it. This *is* a problem for non-naturalism, but that’s the point: naturalist realism collapses morality into natural properties, while non-naturalism severs the epistemic link."  
  **Weakness:** Concedes naturalist realism may survive; reply feels like a restatement.  

  ---

  ### **Pro Tips**  
  1. **Preempt the biologist**: Briefly acknowledge adaptationism debates early in your talk ("Even if exaptations, the core worry persists...").  
  2. **Flatter the realists**: "My argument respects realism’s seriousness by showing it requires stronger epistemology."  
  3. **Cite strategically**: Use Enoch’s *survival* vs. *moral truth* distinction; Joyce’s sensitivity argument.  
  4. **Concede graciously**: "That’s a great point—I’d need more work on X" builds credibility.  

  Good luck! This audience is tough but fair—they’ll respect rigor even if unconvinced.
