answer: |-
  ## ISOTYPE Lesson with Unsettled Legend

  One figure stands for ship.
  A simple curve of hull.
  The draughtsman smoothed the pencil,
  set the scale.

  One figure stands for ship.
  The fleet is seven strokes.
  No wave disturbs this harbor,
  no salt, no swell.

  One figure stands for grain.
  Six kernels in a row.
  The silo fills with symbols,
  drought unknown.

  One figure stands for man.
  Times ten, then ten again.
  The crowd is clean and silent,
  no ragged breath.

  One figure stands for key.
  A tiny iron shape
  explains the rows: *This means fleet.
  This means good crop.*

  One figure stands for key.
  The same curve of the hull.
  The same six seeds. The same man’s
  calibrated eye.

  One figure stands for ship.
  The curve repeats. The sea
  is not depicted. Only
  the plank, the plank, the plank.

  ---

  **Notes on the execution:**
  - Each stanza opens with the rigidly repeated declarative line "One figure stands for [X]", mirroring ISOTYPE's standardized pictograms.
  - The turn occurs when the "key" (legend) is introduced—revealing it's made of the same conventional signs it explains, not a foundational truth.
  - Neurath's boat metaphor is implied through the final stanza's focus on repeated planks (rebuilding at sea) without dry dock or external verification.
  - The tension between universal aspiration and conventional nature of signs is maintained throughout, ending in unresolved cyclical repetition.
  - All imagery stays true to Neurath's principles: pictograms as man-made instruments requiring interpretation, never natural or self-evident.
