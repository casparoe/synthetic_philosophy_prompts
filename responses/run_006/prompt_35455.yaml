  First, I need to break down each argument. Mara's first point is that the tapering feature is unique, so existing programs can't provide a good reference. David counters that inside-view models are often too optimistic. Mara then questions how to choose the right reference class, saying it's subjective. David argues that the outside view anchors to real outcomes, reducing bias.

  Mara's emphasis on the novelty of the tapering formula makes sense. If no existing programs have this feature, comparing them might not capture the cost implications accurately. David's point about inside-view optimism is valid too—policy forecasts often underestimate costs. But Mara's counter about reference class selection is strong; cherry-picking programs could skew results. David's epistemic modesty argument highlights human overconfidence, which is a known bias in forecasting.

  The user's deeper need might be making a defensible decision for the group. They might also want to avoid future blame if the forecast is wrong. The unspoken issue could be balancing innovation with practicality. The group needs a credible estimate that accounts for the new feature without being overly optimistic.

  Combining both approaches seems best. Use David's outside view for a baseline, then adjust with Mara's model for the tapering specifics. This way, they anchor to reality while addressing the unique aspect. Also, sensitivity analysis could show how different assumptions affect costs, making the estimate more robust. Highlighting the strengths and weaknesses of each method in the summary would help the group understand the trade-offs.
answer: |-
  Here's a move-by-move adjudication and a proposed path forward for your group. The core tension is between **specificity vs. robustness** and **innovation vs. historical precedent**, and **neither side is entirely wrong – but the framing needs shifting.**

  **Adjudication Move-by-Move:**

  1.  **Mara's First Move (Ground-Up Model):**
      *   **Argument:** Novel tapering feature necessitates a bespoke model. Existing programs are poor analogues. Specific factors (market, growth, take-up, admin costs) must be incorporated.
      *   **Strength:** Acknowledges the program's defining innovation. Correctly points out that standard programs *don't* have this feature, so their costs might not reflect the tapering's impact (e.g., potentially higher take-up due to no cliff, different admin complexity, potentially different cost distribution).
      *   **Weakness:** Susceptible to the "inside view" traps David mentions: over-optimism, model complexity hiding assumptions, difficulty in accurately estimating novel take-up rates and administrative friction.
      *   **Rating: 7/10 (Strong on principle, needs safeguards).**

  2.  **David's First Move (Outside View / Reference Class):**
      *   **Argument:** Inside-view models are systematically overconfident. Anchor to actual costs of comparable programs, adjusting for size/COL. Burden of proof is on claiming exceptionalism.
      *   **Strength:** Powerful critique of human forecasting biases. Provides a crucial reality check based on empirical outcomes. Forces consideration of base rates. Highlights that *everyone* thinks their program is special.
      *   **Weakness:** Glosses over the "comparable programs" problem. If the tapering feature is truly novel, *are* there genuinely comparable programs? Adjusting for size/COL might miss fundamental design differences impacting costs.
      *   **Rating: 8/10 (Crucially important perspective, but risks oversimplification).**

  3.  **Mara's Second Move (Reference Class Problem):**
      *   **Argument:** Reference class selection is subjective ("well-run" vs. "rocky rollout"). Outside view pretends to be objective but hides judgment calls and is equally vulnerable to bias.
      *   **Strength:** Exposes a fundamental flaw in naively applying the outside view. Reference class selection *is* highly subjective and can be manipulated (consciously or unconsciously) to support a desired outcome. It's not a magic bullet.
      *   **Weakness:** Doesn't negate the *value* of the outside view; it highlights the need for *careful, transparent* reference class selection. Her critique applies to *all* forecasting, not just the outside view.
      *   **Rating: 9/10 (Essential critique, hits the core vulnerability).**

  4.  **David's Second Move (Anchoring & Epistemic Modesty):**
      *   **Argument:** Outside view anchors to real outcomes, preventing model tweaking towards desired results. Epistemic modesty means assuming you're not special unless proven otherwise.
      *   **Strength:** Emphasizes the practical benefit of anchoring and the psychological safety of starting with base rates. The "burden of proof" framing for exceptionalism is a sound principle for avoiding hubris.
      *   **Weakness:** Underestimates the difficulty Mara highlighted: how to *validly* adjust the base rate when faced with genuine novelty? "Anchoring to real outcomes" is only helpful if the outcomes are truly relevant.
      *   **Rating: 7/10 (Strong philosophical point, needs practical refinement for novelty).**

  **Overall Verdict:**

  *   **No Clear "Winner":** Both Mara and David make essential points. Mara is fundamentally correct that the **tapering feature is a material difference** likely impacting costs in ways existing programs don't capture. Ignoring it entirely (pure outside view) is inadequate. David is fundamentally correct that **ignoring historical base rates and relying solely on a complex bespoke model is dangerously prone to optimism bias and error.** Ignoring history is reckless.
  *   **David Slightly More Right on Process?** David wins on emphasizing the *necessity* of anchoring to reality and the *systematic risks* of the pure inside view. However, Mara wins on exposing the *critical flaw* (reference class selection) in his proposed solution.
  *   **The Framing is Missing Something:** The debate frames it as an **either/or choice**, which is the fundamental confusion. The most robust approach **combines both perspectives.**

  **The Missing Piece & The Path Forward:**

  The key is **not choosing between inside and outside views, but intelligently combining them.** The group's task isn't to pick a side, but to design a forecasting process that leverages the strengths of both while mitigating their weaknesses.

  **Recommendation for the Group:**

  1.  **Start with David's Outside View (Anchoring & Modesty):**
      *   **Action:** Collaboratively define the *broadest reasonable* reference class of rental subsidy programs in mid-sized cities. Gather their actual cost data (per capita, % of budget, etc.). Adjust rigorously for city size and cost-of-living differences.
      *   **Purpose:** Establish a baseline, reality-anchored estimate. Acknowledge this as the "default" assumption if the program had *no* novel features. **This is the anchor.**

  2.  **Explicitly Model the "Tapering Delta" Using Mara's Approach (Specificity):**
      *   **Action:** Focus Mara's modeling efforts *specifically* on estimating the **difference** the novel tapering feature makes compared to a standard cliff-edge program. Key questions:
          *   How does tapering affect *take-up rates* (likely increases it near the threshold)?
          *   How does it affect the *average subsidy amount per recipient* (potentially lower for some, higher duration for others)?
          *   How does it impact *administrative costs* (more complex calculations vs. potentially fewer disputes/appeals about eligibility cliffs)?
          *   Are there any *behavioral effects* (e.g., on work incentives near the threshold) that could alter costs?
      *   **Purpose:** Isolate the impact of the innovation. This is inherently uncertain, but modeling specific mechanisms is more tractable than modeling the entire program from scratch. **This estimates the adjustment to the anchor.**

  3.  **Integrate & Stress Test (Robustness):**
      *   **Action:** Combine the outside-view anchor with the modeled "tapering delta" to get the final estimate. Crucially, conduct **sensitivity analysis and scenario planning**:
          *   Vary key assumptions in the "delta" model (take-up rate impact, admin cost impact).
          *   Test different reasonable reference classes for the anchor (e.g., all programs vs. only well-administered ones vs. only those with some complexity).
          *   Run pessimistic, baseline, and optimistic scenarios.
      *   **Purpose:** Quantify the uncertainty. Show the range of possible outcomes based on different assumptions. Highlight which assumptions drive the most variance. This exposes judgment calls and reduces hidden bias.

  4.  **Acknowledge Uncertainty & Burden of Proof (Epistemic Modesty):**
      *   **Action:** Explicitly state the final estimate as a range. Clearly document the anchor, the "delta" adjustment, and the key assumptions driving variance. When presenting, emphasize: "Our best estimate is X, but it could reasonably range from Y to Z. The novel tapering feature introduces significant uncertainty; we estimate it increases/decreases costs by [Delta] compared to standard programs, but this is based on modeling [specific assumptions]."
      *   **Purpose:** Embraces David's call for modesty while incorporating Mara's necessary specificity. Places the burden of proof for the "delta" adjustments clearly on the model and its assumptions.

  **Summary for Your Group:**

  *   **The Disagreement:** Mara argues the unique tapering feature requires a custom model. David argues historical data provides a crucial, less biased anchor. Both points are valid.
  *   **The Core Insight:** Choosing one approach over the other is flawed. Mara's pure model risks optimism bias. David's pure outside view ignores a critical design difference.
  *   **The Resolution:** **Combine the approaches.**
      1.  **Anchor:** Use David's method to establish a base rate from comparable programs (adjusted for size/COL).
      2.  **Adjust:** Use Mara's modeling to estimate the *specific cost impact* of the novel tapering feature *relative to the standard programs in the anchor class*.
      3.  **Integrate & Test:** Combine the anchor and the adjustment. Rigorously test the sensitivity of the result to key assumptions in *both* steps.
      4.  **Present Uncertainty:** Report a range, not a single number, clearly explaining the drivers of uncertainty, especially the novel feature.

  This hybrid approach honors David's demand for anchoring to reality and epistemic modesty while giving Mara the tools to rigorously assess the impact of the program's defining innovation, all while making assumptions and uncertainties transparent to the group. It transforms the debate from "who wins?" to "how do we best leverage both perspectives?"
