prompt: |-
  I've been trying to get clear about when a decision process counts as rational even though the agent doesn't attempt to find the best available option — what Herbert Simon called satisficing. I have firm verdicts on a range of cases, but I cannot tell whether they hang together under a single principle. I would like you to extract the principle (or small set of candidate principles) that best captures my pattern of verdicts, state it precisely, show how it handles each case, and tell me honestly which of my verdicts it forces me to revise. Please also apply the resulting account to a further case I have not listed.

  Here are the cases and my verdicts.

  **1. The restaurant.** I am in an unfamiliar neighborhood, hungry, and I walk into the first restaurant that looks clean and has a menu I like. I do not check reviews or look at other options. Verdict: perfectly rational.

  **2. The car.** I need a reliable sedan. I test-drive three models from different manufacturers, all within my budget, and buy the one I liked best. I do not research every sedan on the market. Verdict: rational.

  **3. The oncologist.** A patient with an aggressive cancer is offered a treatment plan by the first oncologist they see. The patient accepts without seeking a second opinion, even though doing so would be easy and the stakes are life and death. Verdict: not rational.

  **4. The dissertation topic.** A PhD student in philosophy picks the first dissertation topic their advisor suggests, without exploring alternatives. The topic is fine, but the student never seriously considers whether a different topic would be more fruitful for their career or intellectual development. Verdict: not rational — even though the search costs here are low in one sense (just thinking), the decision shapes years of their life.

  **5. The retirement fund.** A 30-year-old chooses a target-date retirement fund from their employer's list. They do not compare expense ratios across funds, do not investigate whether a different allocation would suit them better, and do not learn what a target-date fund actually is. Verdict: rational. The default is reasonable and the cost of acquiring the relevant financial literacy is high relative to the likely improvement.

  **6. The marriage.** Someone marries the first person they ever date seriously, having never reflected on what they want in a partner or whether the relationship has problems they are ignoring. Verdict: not rational. This feels different from the restaurant case, but I am not sure why — in both cases the agent stops at the first acceptable option.

  **7. The public contract.** A city council needs to choose a contractor for a bridge repair. They take the lowest bid that meets the published specifications, without investigating the bidders' track records or the quality of their past work, even though that information is publicly available and the council has staff who could review it at no additional cost. Verdict: not rational.

  **8. The emergency room triage.** An ER doctor, overwhelmed with patients, assigns treatment priority using a simple heuristic (roughly, "worst vital signs first") rather than computing expected outcomes for each possible ordering. Verdict: rational — indeed, more rational than trying to optimize would be.

  The tension that bothers me most is between cases 1 and 6. In both, the agent takes the first acceptable option without further search, yet I judge one rational and the other not. I suspect the difference has something to do with the stakes, the reversibility of the decision, and perhaps whether the agent's aspiration level was itself set responsibly. But case 5 is high-stakes and I still call it rational, so stakes alone cannot be the answer. And case 4 is at least somewhat reversible — one can change dissertation topics — yet I still judge it irrational.

  Please give me the best principle you can that captures as many of these verdicts as possible, explain which clause of the principle handles which case, and tell me which of my verdicts (if any) the principle requires me to abandon. Also, apply the principle to a case I have not listed: someone choosing a political party to support by adopting the platform of whichever party their parents supported, without examining alternatives.
reasoning: |-
  Hmm, the user is grappling with Herbert Simon's concept of satisficing - when it's rational to accept a "good enough" option rather than seeking the absolute best. They've provided eight scenarios with their own verdicts about rationality, but feel conflicted about consistency, particularly between the restaurant and marriage cases.

  Looking at these cases, I notice several patterns. The restaurant case (1) seems rational because search costs are high relative to the decision's importance - you're hungry now. The car purchase (2) involves moderate effort for a significant decision, making limited comparison reasonable. But the oncologist decision (3) feels irrational because life-and-death stakes justify thorough investigation despite low search costs. The dissertation topic (4) has low immediate search costs but massive long-term consequences, making quick acceptance irresponsible.

  The retirement fund (5) is interesting - high stakes but rational to accept the default because financial literacy has high acquisition costs. Marriage (6) seems irrational despite surface similarity to the restaurant case because lifelong commitment warrants reflection. The public contract (7) is irrational because taxpayer resources demand due diligence when information is readily available. Emergency triage (8) is rationally satisficing because optimization would literally cost lives in a time-sensitive situation.

  The key tension is indeed between cases 1 and 6. Both involve accepting the first option, but marriage has irreversible, identity-shaping consequences while a restaurant meal doesn't. This suggests three core factors: 1) stakes (impact × irreversibility), 2) search costs (including opportunity costs), and 3) whether the aspiration level ("good enough" threshold) was responsibly set.

  For the political party case, adopting parental views without examination would be irrational unless done during childhood. For adults in a democracy, the stakes (shaping collective future) and low information costs (platforms are public) demand personal examination. The principle would require revising the marriage verdict only if the person had actively reflected beforehand - but the case specifies they didn't, so the verdict holds.

  The synthesized principle is: Satisficing is rational when (a) search costs (including opportunity costs) are high relative to potential improvement from further search, and (b) the aspiration level is reasonably calibrated to stakes (impact × irreversibility). Crucially, (c) the agent must have either actively calibrated the aspiration level or inherited a reliably calibrated one from a trustworthy source.

  This explains the oncologist case (stakes override low search costs), the retirement fund (high costs justify acceptance), and resolves the restaurant/marriage tension (different stakes/irreversibility). It might challenge the marriage verdict if we interpret "never reflected" strictly, but since the case specifies no consideration of alternatives or self-reflection, the irrational verdict stands.
answer: |-
  Based on your verdicts, the underlying principle governing when satisficing is rational hinges on **three interconnected factors: Stakes, Search Costs (including opportunity costs), and the Responsible Calibration of the Aspiration Level.** Here's the precise principle:

  **The Calibrated Satisficing Principle:**  
  *Satisficing is rational if and only if:*
  1.  **The aspiration level ("good enough") is reasonably calibrated to the stakes of the decision.** Stakes are determined by the *magnitude of impact* and *irreversibility*.
  2.  **The costs of further search (including time, effort, resources, and opportunity costs) are high relative to the reasonably expected marginal improvement achievable by continuing the search,** given the calibrated aspiration level.
  3.  **The agent has either (a) actively engaged in calibrating the aspiration level to the stakes (even minimally), or (b) relies on a source for the aspiration level that is demonstrably trustworthy for the decision context (e.g., a well-designed default).**

  **Why this principle captures your pattern:**

  *   **Stakes (Impact x Irreversibility):** This resolves the tension between cases like Restaurant (low stakes, reversible) vs. Marriage/Oncologist (high stakes, irreversible), and explains why Retirement Fund (high stakes, irreversible) *is* rational – the default mechanism provides a trustworthy calibration source.
  *   **Search Costs vs. Marginal Improvement:** This explicitly handles cases like Car (moderate costs, likely diminishing returns), ER Triage (prohibitive opportunity cost), and Retirement Fund (high cost of financial literacy for likely small gain). It condemns Public Contract where search costs are negligible but potential improvement (avoiding a bad contractor) is high.
  *   **Responsible Calibration of Aspiration Level:** This is the key differentiator between Restaurant and Marriage, and explains Dissertation Topic. In Restaurant, the aspiration ("clean, menu I like") is *minimally but actively calibrated* to the low stakes. In Marriage, the aspiration level isn't calibrated at all ("first serious date"). In Oncologist, the aspiration ("first plan offered") isn't calibrated to the stakes. In Retirement Fund, the aspiration is set by a *trustworthy default mechanism*. In Dissertation, the aspiration ("advisor's first suggestion") isn't calibrated by the agent to the high stakes.

  **Application to Your Cases:**

  1.  **Restaurant (Rational):** *Stakes:* Low (meal, easily reversible). *Search Costs:* High (time, hunger). *Calibration:* Agent *actively* set minimal aspiration ("clean, menu I like") appropriate to stakes. *Marginal Improvement:* Low (slightly better meal unlikely to justify search time/hunger).
  2.  **Car (Rational):** *Stakes:* High (cost, long-term use), but somewhat reversible. *Search Costs:* Moderate-High (test drives, research). *Calibration:* Agent *actively* set aspiration (likes best of 3 reasonable options). *Marginal Improvement:* Likely low after 3 reasonable options; diminishing returns justify stopping.
  3.  **Oncologist (Not Rational):** *Stakes:* Extremely High (life/death, irreversible). *Search Costs:* Low (easy to get 2nd opinion). *Calibration:* Aspiration ("first plan offered") *not calibrated* to stakes. Agent didn't engage. *Marginal Improvement:* Potentially massive (better treatment plan).
  4.  **Dissertation Topic (Not Rational):** *Stakes:* Very High (years of life/career, somewhat reversible but costly). *Search Costs:* Low *in effort* (thinking), but perhaps high in discomfort. *Calibration:* Aspiration ("advisor's first suggestion") *not calibrated* by agent to stakes. No active engagement. *Marginal Improvement:* Potentially very high (more suitable/fruitful topic).
  5.  **Retirement Fund (Rational):** *Stakes:* Very High (long-term financial security). *Search Costs:* Very High (acquiring financial literacy). *Calibration:* Aspiration set by a *reasonably trustworthy default mechanism* (target-date fund). Agent relies on this source. *Marginal Improvement:* Likely low for unsophisticated investor relative to high knowledge cost.
  6.  **Marriage (Not Rational):** *Stakes:* Extremely High (life partner, highly irreversible). *Search Costs:* Potentially high emotionally, but low in *opportunity* (can date/reflect while single). *Calibration:* Aspiration level *not calibrated at all* ("first serious date"). No reflection on wants/needs. *Marginal Improvement:* Potentially enormous (finding a more compatible partner).
  7.  **Public Contract (Not Rational):** *Stakes:* High (public funds, safety, reputation; irreversible once built). *Search Costs:* Very Low (information available, staff available). *Calibration:* Aspiration ("lowest bid meeting specs") *not calibrated* to stakes (ignores quality/reliability). *Marginal Improvement:* Potentially high (avoiding poor contractor, better value).
  8.  **ER Triage (Rational):** *Stakes:* Extremely High (life/death). *Search Costs:* Prohibitively high (opportunity cost of delay is lives lost). *Calibration:* Aspiration ("heuristic preventing immediate death") is *actively calibrated* to the extreme stakes and constraints. *Marginal Improvement:* Attempting complex optimization likely *reduces* overall outcome due to delays.

  **Resolution of Tension (Cases 1 & 6):**
  The principle explains why Restaurant is rational and Marriage is not, despite both being "first acceptable option":
  *   **Restaurant:** Agent *minimally but actively calibrated* aspiration ("clean, menu I like") *appropriate to low stakes*. High search costs relative to marginal improvement.
  *   **Marriage:** Agent did *not calibrate* aspiration level *at all* to the *extremely high stakes*. No reflection on what "acceptable" even means. Potential marginal improvement is enormous, and search costs (while emotionally real) are not prohibitive relative to the stakes.

  **Revision Required:**
  The principle **requires revising your verdict on Case 6 (Marriage) ONLY IF** the agent *had* engaged in significant reflection on what they wanted in a partner and assessed the relationship rigorously *before* deciding this first serious partner met those (well-calibrated) criteria. As described ("never reflected"), the verdict stands as "not rational" under the principle due to the lack of calibration. If the agent *had* done that reflection, satisficing on this partner could be rational, analogous to buying the first car that meets carefully researched criteria.

  **Application to the New Case: Choosing a Political Party**

  *   **Case:** Someone chooses a political party to support by adopting the platform of whichever party their parents supported, without examining alternatives.
  *   **Analysis:**
      *   *Stakes:* **High** (impacts voting behavior, civic engagement, support for policies affecting self/society; somewhat reversible but with effort/conflict).
      *   *Search Costs:* **Moderate-Low** (Party platforms are public information; understanding core differences requires effort but is feasible. High social/identity cost of changing might exist).
      *   *Calibration:* Aspiration level ("parents' party") is **not calibrated by the agent** to the stakes. They rely on a source (parents) whose trustworthiness *for this specific decision* (current political alignment) is not established by the agent. It's inherited, not evaluated.
      *   *Marginal Improvement:* **Potentially High** (Aligning views with current values/needs/interests rather than inherited ones; making more informed civic choices).
  *   **Verdict by Principle: NOT RATIONAL.** While satisficing *could* be rational if the agent briefly confirmed their parents' views still aligned with a minimally calibrated aspiration (e.g., "supports democracy, basic rights I believe in"), simply adopting the party without *any* examination fails the calibration requirement for high stakes. The potential improvement in alignment and informedness is significant relative to the moderate search costs. (This aligns with the intuitive sense that blind political inheritance is often seen as unreflective).
