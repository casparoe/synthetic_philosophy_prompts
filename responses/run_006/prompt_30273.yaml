prompt: |-
  I teach a grad seminar on disagreement, and I've been reading the more formal end of things. There's a move in those models I keep wanting a name for, and if it doesn't have one, I'd like a label I can put on the syllabus.

  The setup is always like this. Two agents begin with the same probability distribution over possible states of the world before either of them has seen any private evidence. Then each observes a different private signal, each updates by Bayes's rule, and they announce their posterior probabilities. There's a well-known theorem that, once those announcements become common knowledge and the agents are rational and know each other to be rational, their posteriors have to coincide. I'm not asking about that result. What I want named is the initial modeling decision: the requirement that everyone start from the same prior, so that any difference in final belief must trace entirely to a difference in the information they got, never to a difference in how they were inclined to weigh possibilities before any evidence came in. It's often treated as though there is simply no question to ask at the starting point — as if two rational people could not even in principle start from different priors, and any difference in final belief that isn't traceable to information is a sign somebody messed up.

  Concretely: two clinicians could disagree about whether a patient has a disease because one saw the blood test and the other didn't, and the framwork is completely comfortable with that. But if they both saw the same test and still disagree because one started out with a much higher baseline for how common the disease is in this population, the framework seems to want to call that a mistake — or at least to have nothing to say about it except that at least one of them must have been irrational somewhere.

  So: does this starting-point assumption have an established name, and is it a claim about what rationality requires or just a convenience for keeping the models tractable? How exactly does it relate to the theorem that rational agents can't agree to disagree — is it a premise of the theorem, or something stronger than the theorem needs? And how is it different from the principle of indifference, which also sounds like it's dictating a unique rational starting point? If there's no standard name, what should I call it so my students dont confuse it with common knowledge of rationality, which is a different piece of the setup?
reasoning: |-
  Okay, let me tackle this professor's query about the modeling assumption in disagreement literature. They teach a grad seminar and need a precise term for the "same prior" requirement in formal models of disagreement.

  First, I need to unpack the core issue. The professor is distinguishing between two types of disagreement: one stemming from different information (which the models handle) versus different starting priors (which the models treat as irrational). The key element here is that all rational agents must begin with identical prior probability distributions.

  I recall this is central to Aumann's Agreement Theorem. That theorem shows that if two rational agents have common knowledge of each other's posteriors, their beliefs must converge. But the theorem explicitly relies on common priors as a premise. Without identical priors, disagreement can persist even with common knowledge of rationality.

  The professor mentioned the principle of indifference. That's related but distinct - it's a specific way to assign priors when there's symmetry, but the common prior assumption is broader. It doesn't specify how priors are formed, just that they must be shared.

  For naming, "common prior assumption" (CPA) seems the standard term in game theory and economics literature. Sometimes called "common prior hypothesis." I should emphasize this is a modeling choice - often for tractability - rather than a universal rationality requirement. The professor wants to distinguish it from common knowledge of rationality (CKR), which is about belief updating rather than initial conditions.

  The philosophical tension is interesting: CPA implies any persistent disagreement must be informational, while rejecting CPA allows for "reasonable disagreements" based on fundamental priors. This connects to literature on epistemic peer disagreement. I should mention key references like Aumann (1976) and the critiques from philosophers like Adam Elga.

  For syllabus labeling, I'll recommend "Common Prior Assumption (CPA)" with a clear definition. To prevent confusion with CKR, I'll suggest explicitly contrasting them - CPA as shared starting point, CKR as belief updating rules. A table comparing the concepts might help students visualize the difference.

  The professor also asked about the necessity of CPA for the agreement theorem. It's crucial - the theorem fails without it. Rational agents with common knowledge could still disagree if their priors differ. This shows CPA is stronger than what rationality alone requires.

  I should also note that CPA doesn't dictate how priors are formed (unlike principle of indifference), and that it's more about model tractability than proven rationality requirement. The controversy around whether rationality mandates CPA is worth mentioning - economists often treat it as necessary while philosophers debate it.
answer: |-
  This is a crucial and often-overlooked modeling choice! You're absolutely right that it's distinct from both the Agreement Theorem (Aumann's theorem) and Common Knowledge of Rationality (CKR). It has a well-established name and significant philosophical baggage.

  1.  **The Name:** The requirement that all rational agents share the **exact same prior probability distribution** is universally called the **Common Prior Assumption (CPA)**, sometimes referred to as the **Common Prior Hypothesis (CPH)**.

  2.  **Its Nature and Status:**
      *   **Primarily a Modeling Choice/Tractability Assumption:** In economics, game theory, and much formal epistemology, the CPA is overwhelmingly treated as a *modeling convenience* or a *tractability assumption*. It allows for clean results like Aumann's theorem by isolating the *informational* source of disagreement. It makes models computationally and conceptually manageable.
      *   **Sometimes Presented as a Rationality Requirement (Controversially):** Proponents (often economists leaning towards objective Bayesianism) *sometimes* argue that rationality *itself* implies the CPA. The argument usually runs: If two rational agents have access to the *same* background knowledge/symmetry principles about a state space *before* receiving any private signals, then there is only one uniquely rational way to assign prior probabilities (perhaps derived via maximum entropy or the principle of indifference). Differing priors, therefore, indicate differing background knowledge or irrationality. This view is **highly contested**. Critics (many philosophers and some economists) argue that rationality allows for "reasonable" or "rational" prior disagreements based on legitimate differences in interpretation of background knowledge, weighting of symmetry principles, or even fundamental epistemic perspectives, even before any private evidence. They see the CPA as an unrealistic and overly restrictive idealization.
      *   **A Premise, Not a Conclusion:** The CPA is an explicit or implicit *premise* in the derivation of results like Aumann's Agreement Theorem. It's *not* something derived *from* rationality alone within these models. Rationality dictates *Bayesian updating* given *a* prior, but it doesn't dictate that *everyone's* prior must be the *same* prior.

  3.  **Relationship to the Agreement Theorem:**
      *   **CPA is a Necessary Premise:** Aumann's theorem strictly relies on the CPA. The theorem shows that **given CPA, CKR, common knowledge of posteriors, and Bayesian updating**, posteriors *must* agree. Crucially:
          *   **Without CPA:** Rational agents with CKR and common knowledge of posteriors *can* rationally disagree *even after* exchanging their evidence/beliefs. Their different priors can lead them to interpret the *same* evidence (including the announcement of each other's beliefs) differently.
          *   **CPA is Stronger than What Rationality Alone Demands:** Rationality requires each agent to *have* a prior and update via Bayes. It does *not* require that all agents share the *same* prior. The CPA is an *additional*, substantive assumption needed to force agreement.

  4.  **Difference from the Principle of Indifference (PoI):**
      *   **PoI is a Specific *Method* for Assigning Priors:** The Principle of Indifference proposes a rule (assign equal probability to mutually exclusive and exhaustive possibilities in the absence of distinguishing evidence) to generate a *specific prior* when there's complete ignorance or symmetry.
      *   **CPA is an Assumption about *Sharing* Priors:** The CPA doesn't specify *how* the common prior is chosen (it could be via PoI, maximum entropy, expert consensus, historical data, etc.). It simply asserts that *whatever* prior a rational agent uses, all other rational agents must start with the *identical* prior distribution.
      *   **Connection:** Proponents of CPA-as-rationality often *combine* it with an argument that PoI (or some other objective method) dictates a *unique* rational prior for a given state space and background knowledge. Thus, differing priors must stem from differing background knowledge or irrationality. Critics argue PoI is problematic (leading to paradoxes) and insufficient to guarantee a unique prior in complex real-world situations, undermining the argument for CPA as a strict rationality requirement.

  5.  **Distinguishing from Common Knowledge of Rationality (CKR):**
      *   **CKR:** Concerns *updating behavior*. It means Agent A knows Agent B is rational (and updates via Bayes), Agent B knows Agent A is rational, Agent A knows that Agent B knows Agent A is rational, and so on ad infinitum. It's about mutual expectations of *how* beliefs will be formed and updated based on evidence *including* announcements.
      *   **CPA:** Concerns the *starting point*. It mandates that before any private evidence is observed, all agents have identical probability distributions over the state space. It's about the initial condition, not the updating rule.
      *   **They are Separate Assumptions:** Both are needed for the Agreement Theorem. CKR governs how agents interpret each other's announcements. CPA ensures they started from the same baseline. An agent could be rational (update correctly given *their own* prior) without sharing your prior. An agent could share your prior but be irrational (fail to update correctly).

  **Recommendation for Your Syllabus:**

  *   **Use "Common Prior Assumption (CPA)"** - This is the standard, unambiguous term.
  *   **Define it Clearly:** "The assumption that all rational agents begin with an identical prior probability distribution over the state space before receiving any private information."
  *   **Contrast it Explicitly:**
      *   "**CPA vs. Bayesian Rationality:** Rationality requires *having and updating from a prior*, not necessarily *sharing the same prior* as others."
      *   "**CPA vs. CKR:** CPA concerns the *identical starting point*; CKR concerns *mutual knowledge of updating rules*."
      *   "**CPA vs. Agreement Theorem:** CPA is a *premise* necessary for the Agreement Theorem, not a consequence of it."
      *   "**CPA vs. Principle of Indifference:** PoI is one proposed way to *determine* a prior; CPA mandates that *whatever* prior is determined, it is *shared* by all."

  **Why "Common Prior Assumption" is the Best Label:**

  *   **Precise:** It directly names the specific modeling element you want to highlight.
  *   **Standard:** It's the universally recognized term in the formal literature.
  *   **Distinguishing:** It clearly separates the prior-sharing requirement from CKR (common knowledge of *rationality*) and the Agreement Theorem (the *result* that relies on CPA+CKR).
  *   **Philosophically Neutral Label:** "Assumption" accurately reflects its typical status as a modeling choice, without presupposing whether it's a strict rationality requirement (which is the contentious philosophical point).

  By labeling it clearly as the **Common Prior Assumption (CPA)** and explicitly contrasting it with CKR and the Agreement Theorem, you'll give your students the precise vocabulary to dissect this foundational (and philosophically loaded) modeling decision.
