answer: |-
  ## Joint Statement: Epistemicism vs. Supervaluationism on Vagueness  
  **Authors:** Prof. Alistair Thorne (Epistemicist), Prof. Eleanor Vance (Supervaluationist)  
  **Date:** October 26, 2023  

  ### I. Agreed Foundational Claims

  1.  **The Sorites Paradox Constitutes a Genuine Philosophical Problem:** The argument demonstrating that seemingly trivial differences (e.g., one grain of sand, one nanosecond, one hair) cannot mark the transition from a clear case (e.g., a heap, young, bald) to a clear non-case, yet such a transition must occur somewhere, presents a profound challenge to classical logic, semantics, and epistemology.
  2.  **Tolerance is Intuitive but Problematic:** The *tolerance principle* – that a very small change cannot affect the application of a vague predicate – is a powerful intuition driving the Sorites paradox but cannot hold universally without contradiction.
  3.  **Classical Logic is Largely Preserved:** Both approaches maintain the core principles of classical bivalent logic as the correct framework for reasoning *within* precise contexts or specifications. Neither endorses truth-value gaps or gluts as fundamental logical revisions.
  4.  **Vagueness is Semantic and Pervasive:** Vagueness is a feature of language (specifically, the semantics of predicates), not primarily of the world, and it is ubiquitous in natural language.
  5.  **Borderline Cases are Central:** Any adequate theory must explain the existence and nature of borderline cases – objects where competent speakers hesitate or disagree about the application of a vague predicate (e.g., a patch of color between clear red and clear orange).
  6.  **The Goal is Explanation:** The primary task is not merely to avoid the Sorites contradiction technically, but to provide the *best overall explanation* of the linguistic phenomena associated with vagueness: the existence of borderline cases, the plausibility of tolerance, the nature of our ignorance/indeterminacy in such cases, and the role of context.
  7.  **"Sharpening" is Conceptually Useful:** The idea of making a vague predicate precise (e.g., stipulating an exact number of nanosecnds for "young") is conceptually coherent and helps illuminate aspects of vagueness, though we differ fundamentally on its metaphysical and semantic status.

  ### II. Points of Disagreement

  | Issue                             | Epistemicist Position (Thorne)                                                                 | Supervaluationist Position (Vance)                                                                 |
  | :-------------------------------- | :--------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------- |
  | **1. Nature of Vagueness**        | Vagueness is fundamentally a species of **ignorance**. There is a fact of the matter, even in borderline cases, but we cannot know it due to the nature of our linguistic/conceptual competence. | Vagueness is fundamentally a species of **semantic indeterminacy**. There is *no* single fact of the matter in genuine borderline cases; the meaning of the predicate fails to specify one. |
  | **2. Truth Conditions**           | A sentence "P(a)" involving a vague predicate is **true** iff the object *a* possesses the precise property denoted by 'P' (whether we can know this or not). Truth is absolute and bivalent. | A sentence "P(a)" is **supertrue** iff it is true on *all* admissible precisifications of 'P'; **superfalse** iff false on all; otherwise **indeterminate**. Truth (supertruth) is precisification-relative and bivalence fails for borderline cases. |
  | **3. Existence of Sharp Boundaries** | **Yes, but unknowable.** Every vague predicate *P* has a sharp cutoff point in any Sorites series. There is an exact point (e.g., nanosecond *n*) where "young" applies and "young" does not apply at *n+1*. | **No.** There is *no* sharp cutoff point for a vague predicate *P*. Any attempt to specify one involves choosing an arbitrary precisification; the meaning of *P* itself does not determine any such point. |
  | **4. Source of Ignorance/Indeterminacy** | Our ignorance stems from **semantic plasticity**: the unavoidable margin for error in applying terms due to the complex, interconnected, and evolving nature of linguistic practice and conceptual grasp. | Indeterminacy stems from **semantic incompleteness**: the meaning of a vague predicate inherently allows for multiple equally legitimate ways of making it precise (admissible precisifications). |
  | **5. Higher-Order Vagueness**     | Higher-order vagueness (borderline borderline cases) is **higher-order ignorance**. There is a sharp boundary between definite cases and borderline cases, and sharp boundaries between orders, but all are unknowable by us. | Higher-order vagueness is **indefiniteness in the set of admissible precisifications itself**. There is no sharp boundary between admissible and inadmissible precisifications, recursively. |

  ### III. Cruxes: The Decisive Points of Difference

  1.  **Crux 1: The Existence of Sharp Boundaries**
      *   **Question:** Does the meaning of a vague predicate *P*, in a fixed context, determine a sharp boundary between things that are *P* and things that are not *P* in any given Sorites series?
      *   **Epistemicist Prediction (Thorne):** Yes. The boundary exists metaphysically as a consequence of bivalence and the nature of the property referred to, even though our epistemic access to its location is necessarily blocked. Any denial leads to incoherence or massive semantic indeterminacy.
      *   **Supervaluationist Prediction (Vance):** No. The meaning of *P* consists precisely in the constraints it places on admissible ways of making it precise. Insisting on a sharp boundary confuses the results of precisification (which *do* have boundaries) with the un-preciseified meaning itself (which *lacks* one). Denying the boundary is essential to capturing the genuine indeterminacy.
      *   **Test Case:** Consider the sentence: "There is an exact nanosecond *t* such that a person is young at *t* but not young at *t+1*." Thorne says this is **true but unknowably so**. Vance says this is **indeterminate** (neither supertrue nor superfalse); it becomes true only relative to a specific precisification, not absolutely.

  2.  **Crux 2: The Nature of Higher-Order Vagueness**
      *   **Question:** Is the phenomenon of borderline borderline cases best explained as *higher-order semantic indeterminacy* (indefiniteness in what counts as an admissible precisification) or as *higher-order ignorance* (unknowable sharp boundaries between definite cases, borderline cases, definite borderline cases, etc.)?
      *   **Epistemicist Prediction (Thorne):** Higher-order vagueness is an illusion generated by our inability to locate the sharp boundaries at any level. There *is* a precise boundary between definite *P* and non-definite *P*, and between definite borderline and non-borderline, etc. Our inability to know where these boundaries lie creates the appearance of seamless transition.
      *   **Supervaluationist Prediction (Vance):** Higher-order vagueness reflects a genuine lack of definite boundaries in the semantic machinery itself. The set of admissible precisifications is itself vaguely defined; there is no sharp line between precisifications that are admissible and those that are not, leading to borderline cases of admissibility and hence borderline borderline cases of *P*.
      *   **Test Case:** Consider an object *b* that seems neither clearly a definite case of 'red', nor clearly a borderline case of 'red', nor clearly *not* a borderline case. Thorne says: *b* **is** metaphysically either definitely red, borderline red, or definitely not red (and similarly for "borderline red"), but we cannot know which category it falls into at this higher level. Vance says: The predicate "borderline red" **itself** applies indeterminately to *b*; it's a higher-order borderline case because there's indeterminacy about which precisifications are admissible for deciding its status as borderline.

  ### IV. Potential Verbal/Clarificatory Points

  *   **"Boundary":** This term causes significant friction. Thorne uses "boundary" to mean a *metaphysically sharp cutoff point* determined by the property and bivalence. Vance argues that "boundary" only meaningfully applies *within* a precisification. She might say: "We agree there are no boundaries *in the sense of sharp cutoffs determined solely by the meaning of the un-preciseified predicate*. Your 'boundaries' exist only relative to a precisification you cannot point to." Thorne counters: "The boundary exists absolutely; precisifications are just ways of approximating knowledge of it." **Settlement?:** Minimal. They agree on what a "sharp cutoff" *is*, but fundamentally disagree on whether the un-preciseified predicate semantics entails one exists. Calling it "verbal" masks the deep metaphysical divide.
  *   **"Truth":** They agree on the core notion of correspondence. The dispute is whether this correspondence holds *directly* between language and the world (Thorne), yielding absolute bivalent truth/falsity even when unknown, or whether it holds *relative to a precisification*, with "absolute" truth being supertruth (Vance). **Settlement?:** They can clarify their terminology ("absolute truth" vs. "supertruth"), but the underlying disagreement about what *makes* a sentence true (a single precise property vs. satisfaction across precisifications) remains substantive.
  *   **"Distinction":** Vance readily admits there is a *distinction* between the young and the non-young. Thorne insists this distinction *must* be sharp, even if unknowable. Vance argues the distinction is *real but vague* – it exists, but lacks sharp edges. **Settlement?:** Clarifying "distinction" helps: both agree a distinction exists, but Thorne argues any real distinction without sharp boundaries is incoherent, while Vance argues sharp boundaries are artifacts of precisification, not requirements for a real distinction.

  ### Concluding Note (Implicit in the Document)
  This collaboration reveals substantial common ground on the *problem* of vagueness and the *desiderata* for a solution (Claims 1-7). However, the disagreements (Table) run deep, concerning fundamental aspects of semantics, metaphysics, and the nature of linguistic competence. The identified Cruxes highlight the points where empirical discovery, conceptual analysis, or metaphysical argument might definitively favor one view over the other, though neither signatory currently sees such a resolution as forthcoming. Our continued disagreement stems from divergent assessments of which costs (unknowable sharp boundaries vs. semantic indeterminacy and non-bivalence in borderline cases) are ultimately more palatable and explanatory.
