prompt: |-
  Before I read another paper that tries to sink hedonism with the heterogeneity problem, I want the full spec instead of the usual gesture. You know the gesture: people point at a handful of pleasures — the itch-scratch, the relief when the scan comes back clean, the moment a proof clicks, the first drag of a cigarette after a long flight — and say "nothing in common, so hedonism is adding apples and oranges." Fine. But what would a theory of pleasure actually have to deliver to count as having answered that? Write the desiderata. Give me each requirement with the case or consideration behind it, and don't let the requirements be weaselly: cover relief-versus-pleasure, pleasures you'd rather not be having and pains you do want, the dissociation between wanting and liking that the reward literature keeps turning up, whether Mill's higher/lower distinction is internal to pleasure or bolted on from outside, and why the category has to be unified at all rather than just being a disjunction. Mark which requirements are non-negotiable for anyone and which are just one camp's wishlist (a single felt quality, reduction to desire, etc.). Then tell me which pair of desiderata you think can't be jointly satisfied, and which single requirement does the most to knock out the standard views. A short scorecard for felt-quality, attitudinal, and functional theories at the end is fine, but the criteria are what I'm actually after.
reasoning: |-
  Okay, the user is frustrated with the heterogeneity problem being used against hedonism and wants a comprehensive breakdown of what a theory of pleasure actually needs to accomplish. They’re clearly well-versed in philosophy, referencing Mill’s higher/lower distinction, dissociation between wanting and liking, and specific examples like relief vs. pleasure. They’re not just asking for a list—they want rigorous desiderata with concrete cases backing each requirement, and they want no weasel words.  

  First, I need to map out the core challenges they mentioned: heterogeneity (itch-scratch vs. intellectual joy), relief vs. pleasure (is relief just absence of pain?), paradoxical cases (wanting pains like sore muscles after exercise), wanting/liking dissociation (neuroscience showing they’re separate), and whether pleasure is a unified natural kind or a disjunction. They also want clarity on which requirements are mandatory vs. contested (like a single felt quality).  

  The user’s tone is impatient ("before I read another paper," "don’t let the requirements be weaselly"), so they’ve likely seen superficial treatments. They’re signaling they want depth—no handwaving. Their unspoken ask might be: "If hedonism falls to heterogeneity, what *could* work?" So the desiderata should implicitly frame whether any theory can clear all hurdles.  

  I’ll structure this by:  
  1. **Non-negotiable requirements** (any viable theory must handle these):  
     - **Heterogeneity**: Cover wildly different pleasures without reducing them to a "common feel." Cases: scratching an itch vs. solving a proof.  
     - **Relief ≠ Pleasure**: Explain why relief (e.g., clean scan) feels positive but isn’t just pleasure. Must distinguish from pain cessation.  
     - **Pleasure-Pain Asymmetry**: Handle cases where pain is sought (e.g., soreness from gym) or pleasure is unwanted (guilty pleasures).  
     - **Wanting/Liking Dissociation**: Account for reward literature (e.g., rats pressing levers for stimulation but not "liking" it).  
     - **Unity Constraint**: Justify why pleasure is a coherent category—not just a disjunction of unrelated states.  

  2. **Contested desiderata** (theories pick sides):  
     - **Felt Quality**: Is there a common phenomenological "glow"? Some demand it (phenomenologists), others reject it (behaviorists).  
     - **Desire-Dependence**: Must pleasure always be desired? Or can it exist without conation?  
     - **Mill’s Distinction**: Are "higher" pleasures intrinsically different, or just tagged by external values? Hedonists must internalize this.  

  The toughest tension is **Heterogeneity + Unity**: How to unify diverse instances without a common feel. If unity fails, hedonism collapses. If heterogeneity is ignored, the theory is crude.  

  The most destructive requirement might be **Wanting/Liking Dissociation**. It sinks desire-based theories (if you can want without liking) and challenges felt-quality views (if "liking" has no consistent feel).  

  For the scorecard:  
  - **Felt-Quality Theories** (e.g., Sidgwick): Ace phenomenology but fail heterogeneity and dissociation.  
  - **Attitudinal Theories** (e.g., desire-based): Handle relief and paradoxes but crash on wanting/liking split.  
  - **Functional Theories** (e.g., reward signal): Best for neuroscience unity but struggle with Mill and felt quality.  

  Key insight: No theory aces all. The user likely suspects this—they want the criteria to judge trade-offs themselves.
answer: |-
  Below is a rigorous set of desiderata for a theory of pleasure, designed to address the heterogeneity problem head-on. I've structured it to avoid weasel words, grounded each requirement in concrete cases, and flagged non-negotiable vs. contested elements. The criteria cover your specified pain points (relief, paradoxical cases, wanting/liking, Mill's distinction, disjunction vs. unity). Finally, I identify the most problematic tension and the most destructive requirement.

  ---

  ### **Core Desiderata for a Theory of Pleasure**  
  *(Non-negotiable: Any viable theory must satisfy these to avoid collapse under heterogeneity)*  

  1. **Heterogeneity Accommodation**  
     - **Requirement**: Explain how diverse states (scratching an itch, solving a math proof, savoring chocolate) all count as "pleasure" **without** relying on a single phenomenological quality.  
     - **Case**: Itch-scratching involves tension-release; intellectual joy involves insight; sensory pleasures (e.g., taste) involve direct stimulation. If these share no "common feel," the theory must provide a non-phenomenal unity condition.  
     - **Why non-negotiable**: Without this, heterogeneity sinks hedonism by making pleasures incommensurable ("apples and oranges").  

  2. **Relief-vs.-Pleasure Distinction**  
     - **Requirement**: Account for why relief (e.g., clean medical scan) feels *positive* but differs from "positive pleasures" (e.g., eating ice cream). The theory must not reduce relief to *mere* absence of pain.  
     - **Case**: Relief often follows anxiety (a negative state), yet it’s actively sought and rewarding. But it lacks the sensory richness of ice cream. Is relief a subspecies of pleasure, or a distinct state?  
     - **Why non-negotiable**: If relief is misclassified, utility calculations fail (e.g., is avoiding pain equivalent to gaining pleasure?).  

  3. **Paradoxical Valence Handling**  
     - **Requirement**: Explain pleasures that are *not* wanted (e.g., guilt-tinged enjoyment of gossip) and pains that *are* wanted (e.g., soreness after a workout).  
     - **Case**: A marathon runner desires muscle pain as proof of progress. Conversely, someone might resent enjoying a manipulative TV show. Pleasure/pain cannot be defined solely by desire/disavowal.  
     - **Why non-negotiable**: Hedonism requires that pleasure is *intrinsically* good—if unwanted pleasures exist, they must still "count."  

  4. **Wanting/Liking Dissociation**  
     - **Requirement**: Explain neuroscientific data where "wanting" (incentive salience) and "liking" (hedonic impact) dissociate (e.g., addiction, Parkinson's treatments).  
     - **Case**: Rats with stimulated dopamine systems lever-press frantically ("wanting") but show no increased "liking" facial expressions. Humans may crave a cigarette without enjoying it.  
     - **Why non-negotiable**: If "liking" (pleasure) is separable from motivation, theories reducing pleasure to desire fail.  

  5. **Unity Constraint**  
     - **Requirement**: Justify why pleasure is a *natural kind* rather than a disjunction of unrelated states. The theory must provide a principled reason to group diverse phenomena under "pleasure."  
     - **Case**: Without unity, calling both scratching an itch and appreciating art "pleasure" is arbitrary—undermining hedonism’s claim that all pleasures are commensurable.  
     - **Why non-negotiable**: Disjunctions cannot support hedonism’s axiological core (maximizing a single good).  

  ---

  ### **Contested Desiderata**  
  *(Theory-dependent: These reflect philosophical divides)*  

  6. **Felt-Quality Demand**  
     - **Requirement**: Some camps insist all pleasures share a proprietary *phenomenal character* (e.g., a "glow" or "positive tone").  
     - **Case**: Mill’s "higher pleasures" (e.g., poetry) are argued to feel different from "lower" ones (e.g., drinking). If they share a common feel, this supports intrinsic unity.  
     - **Contested**: Opponents (e.g., functionalists) reject this; heterogeneity suggests no such quality exists.  

  7. **Desire-Independence**  
     - **Requirement**: Must pleasure be independent of desires? Or can desire *constitute* pleasure (attitudinal theories)?  
     - **Case**: If you desire pain (e.g., spicy food), is the pain itself pleasurable? Desire-based theories say "yes"; others say pleasure is a separate state.  
     - **Contested**: Central to attitudinal theories (e.g., Feldman) but rejected by realists about hedonic tone.  

  8. **Mill’s Distinction Internalization**  
     - **Requirement**: Can "higher" and "lower" pleasures differ *intrinsically* (e.g., in phenomenology) or must the distinction derive from external factors (e.g., consequences)?  
     - **Case**: Mill claims poetry is "higher" than pushpin—but is this due to its *feel* or its cognitive richness?  
     - **Contested**: Hedonists must internalize this to avoid axiological collapse; non-hedonists bolt on external values.  

  ---

  ### **Critical Tensions & Destructive Requirements**  
  - **Most Damaging Tension**: **Heterogeneity Accommodation vs. Unity Constraint**.  
    - Heterogeneity demands radical diversity; unity demands a single natural kind. Functional theories (e.g., "reward signal") stretch "unity" thin; felt-quality theories ignore heterogeneity. *No theory fully reconciles these*.  
  - **Most Destructive Requirement**: **Wanting/Liking Dissociation**.  
    - Sinks attitudinal theories (which tie pleasure to desire) and strains felt-quality views (if "liking" has no consistent phenomenology). Functional theories handle this best but struggle with unity.  

  ---

  ### **Scorecard for Major Theories**  
  | **Theory Type**       | **Felt-Quality (e.g., Sidgwick)** | **Attitudinal (e.g., Feldman)** | **Functional (e.g., neuroscientific)** |  
  |------------------------|-----------------------------------|---------------------------------|----------------------------------------|  
  | **Heterogeneity**      | Fails: Assumes common "feel."     | Passes: Diverse objects of desire. | **Partial**: Diverse reward signals. |  
  | **Relief-vs-Pleasure** | Fails: Relief lacks "glow."        | **Passes**: Relief = desired state. | **Passes**: Relief as negative reinforcement. |  
  | **Paradoxical Valence**| Fails: Unwanted pleasures break it.| **Passes**: Wanted pain = pleasure. | Fails: Pain signals conflict with reward. |  
  | **Wanting/Liking**     | Fails: Ignores dissociation.      | Fails: Conflates wanting/liking. | **Passes**: Models neural dissociation. |  
  | **Unity**              | **Passes**: Common phenomenology. | Fails: Disjunction of desires. | **Partial**: Unified mechanism. |  
  | **Mill’s Distinction** | **Passes**: Qualitative tiers.    | Fails: All desired states equal. | Fails: Mechanism is neutral. |  

  ---

  ### **Conclusion**  
  A theory of pleasure must **non-negotiably** handle heterogeneity, relief, paradoxical cases, wanting/liking splits, and unity. The hardest nut is reconciling heterogeneity with unity—functional theories come closest but risk reducing pleasure to a mechanistic disjunction. Wanting/liking dissociation is the most lethal to popular theories, as it exposes the gap between motivation and experience. If your goal is to defend hedonism, focus on functional unity (e.g., Berridge’s "core liking" circuits) or accept a looser "family resemblance" model—but both have trade-offs. The heterogeneity problem remains live because *no existing theory clears all hurdles without cost*.
