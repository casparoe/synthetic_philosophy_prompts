  Starting with Strawsonian compatibilists, they follow P.F. Strawson's "Freedom and Resentment," which argues that moral responsibility is rooted in our reactive attitudes (like resentment or gratitude). These are seen as non-negotiable aspects of human social life. For them, justification comes from within our practices; if determinism doesn't alter how we interact, it doesn't threaten responsibility. Their position relies on the accuracy of describing our moral psychology and the validity of grounding norms in our actual practices.

  Incompatibilists, like Galen Strawson or Peter van Inwagen, argue that regardless of our psychological tendencies, we need a deeper justification. They often invoke the "Ultimate Responsibility" principle: for an agent to be truly responsible, they must be the ultimate source of their actions, which determinism precludes. For incompatibilists to be vindicated, they'd need to prove that determinism (or indeterminism) undermines the justification of our practices, or that our current practices are metaphysically flawed.

  The key issue is whether these positions are engaging with the same question. Compatibilists focus on the practicality and sustainability of our moral practices, while incompatibilists demand a transcendental justification. This isn't just a verbal disagreement; it's a substantive clash about what counts as justification. Compatibilists see justification as internal to practices, whereas incompatibilists seek an external, metaphysical foundation.

  The user might be looking for a way to break this deadlock. Possible paths forward include conceptual clarification, like distinguishing types of justification, or empirical work on moral psychology to see if determinism affects reactive attitudes. However, empirical findings, like those from Nichols or Knobe, haven't resolved the debate because incompatibilists dismiss them as irrelevant to normative questions. Formal results from logic or game theory might help but are unlikely to sway deeply held intuitions.

  Ultimately, the two projects might be incommensurable. Recognizing this could be progress in itself, leading to a clearer demarcation of philosophical domains. The user might benefit from exploring whether moral responsibility can be pluralistic, accommodating both perspectives without reducing one to the other. Alternatively, they could examine if the debate reflects broader metaethical divides, like those between naturalists and non-naturalists.

