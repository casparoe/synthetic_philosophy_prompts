prompt: |-
  I've been reading Pascal's bit on justice and force in the *Pensées* — you know, the line about justice without force being powerless, force without justice being tyrannical, and the only way out is to somehow make the strong just because you can't make justice strong. It's ruthless and oddly practical, and it's been bugging me. I want to test it against a real case that should be its hardest test, not a toy example.

  So take the Nuremberg trials (the main IMT trial 1945–46). I know the standard debates about victor's justice and whether it was just pomp for a foregone conclusion, but I want you to do a disciplined, two-way analysis through Pascal's framework. Specifically:

  - Map the trial onto Pascal's model: who or what counts as "justice" in his sense (the legal norms? the charge of crimes against humanity? due process?), who or what counts as "force" (the Allied occupation, custody of the defendants, the power to hang), and how the tribunal tried to bind them together. Pay attention to the messy bits — the Soviet judge, the ex post facto complaints, the fact that aggressive war was new law.
  - What does the Pascal lens explain well about the episode? E.g., does it illuminate why the Allies spent so much effort on the appearance of legal form even when the outcome was never in doubt? Does it capture why critics then and now call it tyrannical despite the scrupulous procedure?
  - What does the Pascal lens miss or distort about Nuremberg? Where is his stark dichotomy unhelpful or silent — e.g., the role of victims' testimony, the attempt to build a permanent international legal order, the moral education of the German public?
  - Then flip the direction: what does the Nuremberg episode show about Pascal's position? Does it vindicate him as a clear-eyed realist, or does it reveal a blind spot about legitimacy that isn't just force dressed up? Does the eventual development of the ICC and universal jurisdiction prove him wrong about justice never being able to get its own teeth, or does it prove his point in the long run?

  I don't want a potted history; give me a tight mapping and an honest accounting of where the theory bends. Write it in British English, and keep it to no more than 750 words — if you can't do it in that, your lens isn't focused enough.
