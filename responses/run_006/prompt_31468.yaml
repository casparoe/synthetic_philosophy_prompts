     - We draw from the non-uniform distribution (bag with 3 Red/HQ, 1 Red/Second, 2 Blue/HQ, 2 Blue/Second).

  5. Scoring (5 minutes):
     - For each participant, we compute the quadratic score or logarithmic score based on their reported probabilities for the true state.
     - Quadratic score: for a probability vector (p1, p2, p3, p4) and if state i is true, score = 1 - (1-p_i)^2 - sum_{j!=i} (0-p_j)^2 = 1 - (1-p_i)^2 - sum_{j!=i} p_j^2.
       Alternatively, we can use: score = 2*p_i - sum p_j^2.
     - We can compute and announce scores.

  6. Discussion (55 minutes):
     - Ask what probabilities people assigned.
     - Present the two approaches.
     - Discuss why they chose their approach.
     - Explain the Judy Benjamin problem and the minimum cross-entropy solution.
     - Discuss the hidden cost: if you keep the probability of Red fixed, then you are assuming that the message only gives information about the conditional in Red. But is that justified? Maybe the message also tells us that the assignment process might be different for Red and Blue, and so it might affect the probability of Blue as well? 
     - What can't we reproduce: the activity uses a single state draw from a distribution that is not uniform, while the formal problem has a uniform prior. Also, we are only doing one draw, so we don't see the long-run frequency.

  This might work.

