prompt: |-
  I'm a high school student, and I've been asked to give a twenty-minute presentation on the pessimistic meta-induction to my school's philosophy club. Most members have read some philosophy but haven't studied philosophy of science. Don't explain the argument to me — I've read Laudan and Psillos. I need a teaching plan: what must come first, what depends on what, which example should carry the whole thing, which misconceptions I should expect and where exactly to head them off, and one question I can pose at the end to check whether they've really understood the argument's force. Give me your plan as exactly five numbered points, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  Okay, the user is a high school student preparing a 20-minute presentation on the pessimistic meta-induction for their philosophy club. They've read Laudan and Psillos, so they understand the argument but need a teaching plan. The audience has some philosophy background but no specific philosophy of science knowledge.

  The core challenge here is scaffolding the complex meta-induction argument for beginners. I need to consider what foundational concepts must come first: scientific realism (since PMI attacks it), the realist's commitment to successful theories being approximately true, and the historical record of discarded theories. 

  For the main example, phlogiston stands out as ideal - it was wildly successful for a century, explained combustion and rusting, yet is now considered completely false. It perfectly illustrates how success ≠ truth. I should anticipate the "but science improves" objection early by emphasizing that PMI targets past realism, not current science.

  Misconception prevention is crucial. I must explicitly separate the descriptive historical claim from the inductive inference to avoid confusion. Also need to clarify that PMI doesn't say current theories are false, only that the realist's justification is undermined.

  The comprehension-check question should force application: if they grasp the argument, they'll see how any list of past failures threatens realism regardless of perceived progress. Phrasing it as "why would this worry the realist?" rather than "is PMI right?" keeps focus on understanding the logic.

  Timing-wise: 5 mins for realism foundations, 6 for historical cases (phlogiston heavy), 4 for the inductive leap, 3 for implications, 2 for Q&A. The phlogiston example must carry the weight - vivid enough to make the abstract argument visceral.
answer: |-
  Here is your five-point teaching plan:

  1.  **Start by clearly defining scientific realism's core claim:** Explain that realists believe our *best* scientific theories are approximately true and that their success (predictive power, technological application) is strong evidence for this truth. Emphasize the realist's inference: "Success proves approximate truth."

  2.  **Immediately present compelling historical counterexamples:** Focus heavily on **Phlogiston Theory** as the primary anchor. Detail its immense success (explained combustion, calcination, respiration across Europe for nearly a century) and its subsequent complete abandonment as fundamentally false. *Head off the "but science improves" misconception here:* Acknowledge progress exists, but stress that the realist's logic *at the time* would have deemed Phlogiston approximately true *because* it was successful. Briefly mention 1-2 other powerful examples (e.g., Caloric, Luminiferous Ether) to solidify the pattern.

  3.  **Formulate the pessimistic induction based on the historical record:** State the meta-induction clearly: "Because *so many* past, successful scientific theories (like Phlogiston) have turned out to be fundamentally false (not approximately true), we have strong inductive reason to believe that *our current* successful theories, no matter how successful, will likely also turn out to be false in the future." *Head off the "descriptive vs. normative" misconception:* Explicitly clarify that the argument isn't just describing history; it's *using* that history as evidence for an inductive inference *about the epistemic status of current theories*.

  4.  **Explain the specific challenge to realism's justification:** Argue that the history undermines the realist's key *justification*. If past success wasn't a reliable indicator of approximate truth, why should we believe current success *is*? The realist's main argument (success→truth) is inductively weakened by its past failures. *Head off the "But *our* theories are different/better" misconception:* Stress that the realist's inference is the *same type* used in the past – judging truth based on success. The PMI suggests this inference has a poor track record.

  5.  **Pose the comprehension-check question:** "If I were to give you a list of ten more historically successful but now abandoned scientific theories beyond Phlogiston and Ether, *why* would this strengthen the Pessimistic Meta-Induction argument against the scientific realist's justification, even if you personally believe our current theories are correct?" (The correct grasp: More examples reinforce the inductive pattern, further undermining the reliability of the "success→truth" inference central to realism's defense, regardless of one's faith in current science).
