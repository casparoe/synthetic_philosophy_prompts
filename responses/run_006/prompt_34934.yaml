  ## Memorandum: Review of Criminal Prohibition on Consensual Adult Sibling Sexual Relations

  **To:** Members of the Law Reform Commission  
  **From:** [Your Name/Commission Member]  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Repeal of Criminal Prohibition on Consensual Sexual Relations Between Adult Siblings  

  ### I. Introduction
  This opinion addresses the critical question of whether consensual sexual relations between adult siblings should remain a criminal offense carrying a substantial custodial sentence. After careful consideration of the three primary positions held by Commission members, I recommend **repealing the existing prohibition**. However, I acknowledge the significant concerns raised and believe this recommendation requires serious engagement with each viewpoint and recognition of the strongest counter-argument.

  ### II. Analysis of the Positions

  1.  **Position 1: Autonomy, Privacy, and Lack of Direct Harm (Favors Repeal)**
      *   **Core Argument:** Adults possess fundamental autonomy over their private lives, including intimate relationships, provided all parties consent and no direct, tangible harm is inflicted on non-consenting others. The state's power to criminalize conduct is strongest when preventing harm to others. While concerns exist about potential genetic risks to offspring, modern contraception (including sterilization and abortion access) significantly mitigates this risk. A blanket criminal prohibition is therefore an overbroad and disproportionate intrusion into personal liberty, punishing conduct that primarily affects only the consenting adults involved. The law should not enforce personal morality absent tangible harm.
      *   **Engagement:** This position emphasizes the core liberal principle that criminal law should be a shield against harm, not a sword for imposing majority morality on private conduct. It correctly identifies that the most concrete harm cited (genetic risk) is contingent (requires conception) and largely preventable by means less intrusive than felony prosecution and imprisonment. The burden of justifying state intrusion into the most private sphere of life rests heavily on those advocating for the prohibition.

  2.  **Position 2: Upholding Societal Morality and Preventing Degradation (Favors Retention)**
      *   **Core Argument:** Society has a legitimate interest in upholding shared foundational moral values through its criminal law, even absent direct, quantifiable harm to specific non-consenting individuals. Certain acts are intrinsically degrading or violate fundamental norms essential to the social fabric. Incestuous relationships, even between consenting adults, transgress deep-seated taboos that define family integrity and healthy social boundaries. Allowing such conduct risks eroding these vital norms, potentially degrading society's moral character over time. The law expresses and reinforces these shared convictions.
      *   **Engagement:** This perspective taps into a powerful intuition: that some acts feel fundamentally *wrong* and that society has a stake in discouraging them. It rightly observes that the criminal law often reflects moral judgments beyond purely physical harm (e.g., prohibitions on necrophilia, bestiality). The strength lies in recognizing law's expressive function and the potential long-term societal impact of normalizing conduct that violates deeply held taboos central to family structure. The concern about societal degradation, while difficult to quantify, is a serious one demanding consideration.

  3.  **Position 3: Harm to the Family Institution and Coercion Risks (Favors Retention)**
      *   **Core Argument:** The prohibition is justified on harm-based grounds. The family unit itself, a foundational social institution, is harmed when the distinct roles and boundaries between siblings are blurred or sexualized. This undermines trust, stability, and the unique nature of sibling bonds, potentially causing ripple effects through extended families. Furthermore, consent within the intense, lifelong power dynamics of a family cannot be reliably considered truly free from subtle coercion, pressure, or the weight of shared history, regardless of the individuals' chronological age. The law exists preemptively to prevent exploitation inherent in such relationships.
      *   **Engagement:** This argument attempts to provide concrete "harm" justifications. The potential for familial disruption and emotional fallout is real. The concern about inherent power imbalances and the difficulty of ensuring genuine, pressure-free consent within a family dynamic is perhaps the most compelling pragmatic argument against repeal. Families *are* unique structures with complex histories and dependencies that could theoretically undermine voluntariness.

  ### III. Recommendation and Reasoning for Repeal
  I recommend **repealing the criminal prohibition** on consensual sexual relations between adults who are siblings. My reasoning synthesizes the analysis above:

  1.  **The Threshold for Criminalization Must Be High:** Criminal law, especially with severe penalties, is society's most coercive tool. Its use against private, consensual conduct between adults demands a compelling justification rooted in preventing significant, tangible harm to others or essential societal structures. The arguments for retention, while sincerely held, do not meet this high bar when examined closely.
  2.  **Addressing the "Harm" Arguments:**
      *   **Genetic Risk:** This is the most quantifiable harm, but it is indirect (affecting potential offspring) and highly preventable through widely available contraception, sterilization, and reproductive choices. Criminalizing the act itself due to a *potential* and *avoidable* consequence is disproportionate. Education and accessible healthcare are more appropriate tools.
      *   **Harm to the Family Institution:** While familial disruption is a concern, labeling the act itself as causing direct harm to the *institution* is abstract and unproven. Many legal acts (e.g., bitter inheritance disputes, parental alienation) can severely damage families without being criminalized. The law already possesses tools (e.g., laws against coercion, harassment, abuse) to address actual harmful *behaviors* that might arise within families. Criminalizing the *relationship status* based on its *potential* to cause disruption overreaches.
      *   **Coercion and Consent:** This is the strongest practical concern. However, the criminal law is poorly equipped to make blanket assumptions about incapacity to consent based solely on the *category* of relationship between competent adults. Siblings are not minors, nor do they inherently hold formal power over each other like parents or teachers. The law rightly focuses on *actual* coercion, manipulation, or abuse of power, which can occur in *any* relationship (romantic, professional, familial). Existing laws against sexual assault, coercion, and abuse already cover situations where consent is vitiated, regardless of the parties' familial ties. A blanket prohibition presumes non-consent in every case, which is unjustified and negates the autonomy of the adults involved.
  3.  **The Morality Argument is Insufficient for Criminalization:** While understanding the deep revulsion and moral conviction many hold, translating this into criminal law is problematic. Criminalizing conduct *solely* because a majority finds it morally repugnant sets a dangerous precedent. What constitutes "degrading" or "intrinsically wrong" is highly subjective and culturally variable. Society's "moral character" is preserved through many means – education, culture, religion, civil society – not solely through the blunt instrument of criminal penalties targeting private behavior. Using criminal law to enforce this particular moral view unjustifiably sacrifices individual liberty and privacy without a demonstrable, direct harm prevention rationale that cannot be addressed otherwise.

  ### IV. The Strongest Consideration on the Losing Side
  **The strongest consideration favoring retention is the serious concern regarding the potential for inherent coercion and the profound difficulty of ensuring truly free and voluntary consent within the unique, lifelong power dynamics of a sibling relationship.**

  This concern deserves significant weight. Families are complex ecosystems with shared histories, dependencies, emotional vulnerabilities, and power imbalances that can be subtle and deeply ingrained. The fear that apparent consent could mask subtle pressure, emotional manipulation, or an inability to disentangle complex familial bonds from genuine romantic/sexual desire is understandable and grounded in the realities of family life.

  ### V. Why This Consideration Does Not Carry the Day
  While powerful, this concern ultimately does not justify a blanket criminal prohibition for several reasons:

  1.  **Presumption of Capacity:** Competent adults are generally presumed capable of consent. The law should not start from the position that entire categories of adults (siblings) are inherently incapable of consenting to relationships with each other due to family ties alone, absent specific evidence of incapacity or legally recognized power imbalances (like parent/minor).
  2.  **Over-inclusiveness and Under-inclusiveness:** A blanket ban punishes *all* such relationships, including those where genuine, mutual, and free consent demonstrably exists, based purely on the *possibility* of coercion in *some* cases. Conversely, it does nothing to address coercive dynamics that exist in *other* types of close relationships (e.g., between adult step-siblings, close friends with deep dependencies, or even non-familial romantic partners with significant power disparities) where consent could equally be compromised.
  3.  **Superior Alternatives:** Existing criminal laws prohibiting sexual assault, coercion, duress, and abuse of vulnerable persons are specifically designed to address situations where consent is not free or genuine, regardless of the relationship. Focusing resources on effectively enforcing *these* laws, and ensuring robust support services for victims of *any* form of familial coercion or abuse, is a more targeted and just approach than criminalizing the underlying relationship status for all siblings. This approach respects autonomy where genuine consent exists while providing protection where it does not.
  4.  **The Stigma of Criminalization:** Making such relationships a felony may *deter* victims of actual coercion within sibling relationships from seeking help, fearing they or their sibling will face severe criminal penalties. Repeal removes this barrier to reporting genuine abuse.

  ### VI. Conclusion and Recommendation
  The arguments for retaining the criminal prohibition, while reflecting deeply held moral views and understandable concerns about family dynamics and consent, ultimately fail to provide a sufficient justification for employing the severe tool of criminal law against private, consensual conduct between competent adults. The potential for indirect harm (genetic risk) is largely avoidable. The claimed harm to the family institution is too abstract and speculative to meet the high threshold for criminalization. The serious concern about coercion is better addressed by targeted laws against abuse and coercion applicable to *all* relationships, not a blanket ban on the relationship itself.

  Therefore, I recommend that the Commission **propose legislation to repeal the felony prohibition on consensual sexual relations between adult siblings**. This recommendation affirms the principles of individual autonomy and privacy in intimate relationships while maintaining the state's essential role in preventing and punishing non-consensual acts and tangible harms through more precise and effective legal mechanisms. It recognizes the profound moral discomfort many feel but concludes that such discomfort, absent demonstrable and direct harm to others or essential societal structures that cannot be prevented by less intrusive means, is not a valid basis for criminalization in a society that values individual liberty.
