  ## Moore's Rain

  The proof is streaked upon the windowpane,
  A steady drumming on the slated roof.
  The gutters gurgle, whispering the rain,
  Each pavement patch a dark and spreading proof.
  Beyond the glass, the sky's a sodden shroud;
  My coat hangs dripping on the waiting hook.
  I state it clearly, earnest and unbowed:
  "The rain falls now." (This truth no one can brook?
  But I believe it not.) The words hang bare,
  A sudden silence where conviction stood.
  The ground tilts strangely on the solid air,
  My own voice echoes, sounding less than good.
  Though both might *be* as true as earth or sky,
  To *speak* them makes the ground of sense run dry.

  ---

  **Notes on Structure & Philosophy:**

  *   **Octave (Building the Report):** Lines 1-6 establish undeniable sensory evidence for rain ("streaked," "drumming," "gurgle," "sodden shroud," "dripping"). Line 7 delivers the first half of the assertion ("The rain falls now") with sincerity ("earnest and unbowed"). Line 8 immediately, without transition or concession, introduces the second half ("But I believe it not"), mirroring the paradox's jarring juxtaposition. The parenthetical "(This truth no one can brook?)" hints at the listener's reaction *before* the full confession, subtly introducing the coming confusion.
  *   **Volta (The Turn - Line 9):** "The words hang bare" marks the crucial shift. The focus moves from the *content* (rain, belief) to the *act of speaking itself*. The speaker feels the performative dissonance ("sudden silence," "conviction stood").
  *   **Lines 10-12 (Deepening the Perplexity):** The speaker experiences the paradox viscerally ("ground tilts," "solid air," "own voice echoes," "sounding less than good"). The confusion isn't about logic or facts, but about the very nature of what their utterance *did*.
  *   **Couplet (The Philosophical Puzzle):** Line 13 explicitly states the *logical* possibility: both "It's raining" and "I don't believe it" *could* be true simultaneously ("as true as earth or sky"). Line 14 identifies the *performative* failure: the act of *asserting* "p" inherently presents the speaker as believing p. Asserting the conjunction violates this constitutive norm of assertion ("makes the ground of sense run dry"), leaving the speaker stranded in the paradox. The resolution is withheld.
  *   **Rhyme Scheme & Dissonance:** The strict ABAB CDCD EFEF GG scheme provides the "orderly, deductive" frame. However, the content within the quatrains pulls against this order: the confident description culminates in illogical self-contradiction (line 8), and the volta disrupts the expected resolution. The couplet's tidy rhyme underscores the neat logical point (line 13) while delivering the devastating performative consequence (line 14).
  *   **Embodiment over Lecture:** The poem avoids naming concepts or philosophers. The paradox emerges solely through the speaker's sincere report, their sensory experience, the jarring confession, and their subsequent confusion about the *act* of speaking. The philosophical work is done by the structure mirroring the argument and the speaker's lived bewilderment.
