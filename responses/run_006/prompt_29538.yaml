answer: |-
  ## Dialogue: The Weight of Words  
  *(Dr. Aris Thorne, leaning forward intently, represents the practice-based view. Dr. Elara Vance, gesturing emphatically, champions the assurance-based account. They meet in a sunlit university common room.)*

  **Thorne:** Let’s begin with the core, Elara. Promising isn’t magic. It’s a *practice*, like signing a contract or voting. The rules are public, constitutive. When I say “I promise,” I invoke a social machinery. Breaking it isn’t primarily about *you*; it’s vandalizing the institution itself. Like moving a rook diagonally – the wrong isn’t to your opponent’s feelings, but to chess.

  **Vance:** Aris, that reduces something profoundly personal to bureaucracy! When I promise *you*, I give *you* my assurance. I deliberately shape your expectations, inviting you to rely on me. The wrong of breaking it *is* the betrayal of *that* trust, *that* reliance. The “institution” isn’t betrayed; a person is.

  **Thorne:** But can your account handle promises to the dead? Suppose I promise my dying father to care for his garden. He dies. I neglect it. Who is wronged? There’s no living person whose expectations I disappoint. Yet, surely, I’ve done *something* wrong?

  **Vance:** The wrong persists, Aris. I wronged my *father* while he lived – I created an expectation in him, and the breaking of the promise retroactively betrays the trust he placed in me *then*. It disrespects the relationship we had. The harm is temporal, but real.

  **Thorne:** A ghostly harm? That feels metaphysically fraught. On my view, it’s clear: the practice includes promises to the dying. Breaking it weakens the reliability of the practice *for everyone*. Others see promises lose force if death voids them. The victim is the ongoing social fabric.

  **Vance:** What about duress? Imagine a kidnapper forces me, at gunpoint, to promise to deliver a ransom. Later, I don’t. Your rules likely say I made a valid promise – the words were uttered in a recognizable context. So, I’m obligated? That seems perverse!

  **Thorne:** *Nods slowly.* The practice *might* classify it as a promise, but its normative force can be overridden. Duress negates the voluntariness essential for the obligation to *bind* morally, even if the linguistic act occurred. The practice provides the *form*, but other moral principles (like non-coercion) can defeat the obligation.

  **Vance:** But that’s an *ad hoc* rescue! Your theory generates the *appearance* of obligation where there is none. On my view, it’s simple: no genuine assurance was *given*. The kidnapper couldn’t reasonably form a warranted expectation based on a coerced utterance. There was no invitation to authentic reliance. No interpersonal wrong is done by breaking it. The *only* wrong was the initial coercion.

  **Thorne:** Perhaps. But consider a promise whose fulfillment becomes pointless. I promise to water your plants while you’re away. You return early, the plants are fine, you couldn’t care less about the watering. I forget anyway. Have I wronged you?

  **Vance:** *Pauses.* If you truly no longer rely on me, and the promised act has lost all significance for you, then… no, I haven’t wronged you *by breaking the promise*. The core wrong – disappointing reasonable reliance – is absent. There might be a minor wrong of inattention, but not the specific wrong of promise-breaking.

  **Thorne:** Ah, but here’s the rub! If others learn I make promises lightly and neglect them the moment the promisee loses interest, it erodes the practice’s stability. People hesitate to accept promises from me. The *institution* is weakened, even if no individual feels betrayed in that instance. The obligation persists to maintain the practice’s integrity.

  **Vance:** That feels like overreach, Aris. You’re inflating a minor lapse into an institutional threat. The moral core is the interpersonal bond. If the bond’s purpose evaporates, the obligation should too, unless some *other* harm arises (like deception). Now, promises to oneself? I tell myself, “I promise I’ll run every morning.” I fail. Who is wronged on your view? Where’s the social institution?

  **Thorne:** *Smiles faintly.* A tough case. I’m tempted to say self-promises are parasitic on the social practice. We borrow the *form* of promising, but it’s more like a resolution. There’s no distinct “self-promise practice.” So, no promissory obligation, just regret or weakness of will. The “wrong” is practical irrationality, not a broken promise per se.

  **Vance:** I disagree strongly. When I make a sincere promise to myself, I *do* create an expectation and structure my agency around it. Breaking it is a betrayal of self-trust, undermining my future ability to rely on my own commitments. It’s deeply wrong *to myself* – a fragmentation of my practical identity. The interpersonal structure is mirrored internally.

  **Thorne:** Mirrored, perhaps, but not equivalent. Self-trust is vital, yes, but it’s not governed by the *public, conventional rules* that define promising. The wrong is real, but categorically different. It lacks the constitutive social scaffolding.

  **Vance:** And therein lies our fundamental divergence, Aris. You see the scaffolding as primary; I see the interpersonal (or intrapersonal) dynamic of induced reliance as the moral heart. Your institution is a tool; my assurance is the essence.

  **Thorne:** And your essence floats without the anchor of practice! How do we even recognize an “assurance” without shared conventions? Your interpersonal wrong presupposes a background understanding of what promising *is* – which is precisely the practice I describe.

  **Vance:** *Leans back, thoughtful.* Perhaps we’re circling. The practice enables the specific *form* of assurance, granting it special force and clarity. But the moral *wrong* still lies in the betrayal of the individual trust created, not the damage to the enabling structure itself. Though… *she gestures towards Thorne*… I concede that rampant betrayal *would* damage the practice, making future assurances harder to give and receive. So, perhaps my view needs yours to explain why promises are *reliable* tools for assurance.

  **Thorne:** *Nods.* And perhaps my view needs yours to explain the *moral urgency* we feel when a specific promise is broken, the sense of personal violation that goes beyond mere rule-breaking. The practice exists *for* facilitating these interpersonal bonds. Without that purpose, it’s an empty game. But without the rules, the bonds lack definition and force.

  **Vance:** So, we end not with a victor, but with an acknowledgment: the institution gives the promise its shape and social power, but the lived experience of obligation – the weight of the words – comes from the trust placed in one person by another.

  **Thorne:** Precisely. The fault line remains, but the territories are connected. One describes the mechanism, the other the moral gravity it enables.

  *(They both fall silent, the tension replaced by a mutual respect for the complexity of the simple act of giving one's word.)*

  ## Map of the Fault Lines
  1.  **Nature of the Wrong:**
      *   **Practice:** Primarily a wrong against the social institution/rule-system.
      *   **Assurance:** Primarily a wrong against the specific promisee (or oneself) through betrayal of induced reliance/trust.
  2.  **Source of Obligation:**
      *   **Practice:** Generated by participation in the conventional social practice.
      *   **Assurance:** Generated by the voluntary act of inducing reasonable, warranted reliance in another.
  3.  **Key Divergences & Convergences:**
      *   **Promises to the Dead:**
          *   Practice: Wrong weakens the practice for the living.
          *   Assurance: Wrong is betrayal of trust given *during life*; harm is temporal but relational.
          *   *Convergence?* Both acknowledge a wrong exists, but ground it differently.
      *   **Duress:**
          *   Practice: *May* classify utterance as a promise, but obligation likely overridden/absent due to involuntariness.
          *   Assurance: No genuine assurance given, no warranted reliance possible, thus no obligation *at all*.
          *   *Divergence:* Practice potentially recognizes a "formal" promise lacking force; Assurance denies one was even made morally.
      *   **Pointless Promises:**
          *   Practice: Obligation persists to uphold the practice/institutional integrity.
          *   Assurance: No reliance/disappointment → no core wrong of promise-breaking.
          *   *Clear Divergence:* Practice sees lingering obligation; Assurance sees it dissolve.
      *   **Self-Promises:**
          *   Practice: Not genuine promises (lacks social practice); wrong is different (practical irrationality).
          *   Assurance: Genuine promise involving self-trust; wrong is betrayal of self/undermining future agency.
          *   *Fundamental Divergence:* Disagreement on whether the phenomenon falls under "promising" at all.
      *   **Interdependence (Convergence):**
          *   Assurance relies on Practice: Shared conventions are needed to *recognize* an act as promising and establish the *warrant* for reliance.
          *   Practice relies on Assurance: The *value* and *point* of the practice lies in its ability to create and secure the specific interpersonal bonds Assurance describes. The rules exist *for* facilitating trust.
