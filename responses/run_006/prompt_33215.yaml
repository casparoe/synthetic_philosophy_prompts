prompt: |-
  I keep seeing people wave the word Moloch at everything — AI labs racing to scale, grade inflation, the dating app meta, housing politics, you name it — and at this point its just a synonym for "thing I don't like about competition." Before I read one more hot take I want the actual spec. What does a theory of multipolar traps / races to the bottom / Moloch-type dynamics have to get right to count as adequate?

  Treat the purpose as: I want to look at some ugly competetive situation and be able to tell whether it's a real trap (everyone would prefer some other stable arrangement but no one can get there unilaterally) versus ordinary zero-sum conflict, a coordination problem with a bad equilibrium, a collective action problem, or just competition over a genuinely scarce good. And I want the theory to tell me which interventions would break the trap and which ones just move the badness around.

  Give me the requirements list: the cases it has to handle (arms races, commons depletion, positional and status races, safety-cutting races, and at least one case where the race metaphor misleads), the distinctions it can't collapse (trap vs conflict of interest, bad equilibrium vs no equilibrium, local vs global badness, preferences being revealed vs the outcome being genuinely unwanted), and the results from game theory, economics, or evolutionary theory it can't contradict — with the consideration behind each requirement. Mark which are non-negotiable and which are just preferences of particular camps. Flag any subset that can't be jointly satisfied, since I suspect the list itself is doing a lot of work. And tell me which single requirement does the most to kill the lazy versions of the idea. Keep the scorecard short or skip it; I mostly want the criteria.
reasoning: |-
  Okay, the user is asking for a clear framework to distinguish "Moloch"-type traps from other competitive situations. They're frustrated with the term being overused as a catch-all for disliked outcomes. Their real need is analytical precision: they want to identify when something is a genuine multipolar trap versus other categories like zero-sum conflict or coordination problems. 

  Hmm, they're clearly well-versed in this discourse—mentions "multipolar traps," "revealed preferences," and wants game theory rigor. Probably reads Slate Star Codex or adjacent rationalist spaces. Their unspoken frustration is likely about sloppy thinking; they want to call bullshit on lazy "Moloch" invocations. 

  Key challenges: 
  First, the term "Moloch" itself is poetic but underspecified. Need to ground it in existing frameworks (game theory's Nash equilibria, Schelling points, collective action problems) without losing the core insight about inescapable bad equilibria. 
  Second, must handle both canonical cases (arms races, tragedy of commons) and edge cases where competition isn't the culprit. 
  Third, interventions! They explicitly want to know what fixes traps versus what backfires. That's the practical payoff. 

  Non-negotiables emerge: 
  - Definition must require that all players privately prefer a different outcome (revealed preference isn't enough; they might be lying or mistaken). 
  - Must distinguish from scarcity conflicts—if a resource is truly limited, it's not a trap. 
  - The "no unilateral escape" clause is critical. Otherwise, it's just whining about competition. 

  Biggest trap for lazy theories? Requirement 4: proving the bad outcome is Pareto-inferior. Most "Moloch" rants fail here—they conflate "I lost" with "we all lost." (Example: dating apps. Sure, everyone complains, but is there a stable alternative where all users get better matches? Unlikely.) 

  Also noting tension: what if players have incompatible preferences? (Requirement 4 vs 5). A true Moloch trap requires alignment in desired outcomes, just not the path. If preferences clash, it's conflict, not a trap. 

  Final thought: The user wants surgical precision. Overloading "Moloch" weakens it. Better to retire the metaphor and say "multipolar trap with Pareto-inferior Nash equilibrium." Less sexy, but clearer.
answer: |-
  Here's a requirements list for a rigorous theory of multipolar traps (Moloch dynamics), designed to distinguish them from other competitive phenomena and guide interventions. It prioritizes analytical precision over poetic metaphor.

  ### Core Definition (Non-Negotiable)
  1.  **Pareto-Inferior Nash Equilibrium:** The situation must be a stable outcome (Nash equilibrium) where **no single actor can unilaterally deviate to improve their outcome**, yet **all actors would strictly prefer a different, feasible outcome** if they could collectively coordinate on it (Pareto improvement exists). *Why:* This is the absolute core. It distinguishes a genuine trap ("we're all stuck in a bad state everyone hates") from mere competition ("I lost, you won") or revealed preference ("this outcome proves it's what we actually wanted, even if we complain").

  ### Required Distinctions (Non-Negotiable)
  2.  **Distinguish Trap vs. Scarcity Conflict:** Must differentiate between a trap (bad outcome due to misaligned incentives preventing cooperation, despite a *feasible* better outcome) and competition over a genuinely scarce resource where conflict is inherent and no Pareto-improving allocation exists for all. *Why:* Calling competition for scarce resources "Moloch" is a category error. (E.g., Two hungry people fighting over the last apple isn't Moloch).
  3.  **Distinguish Trap vs. Coordination Problem w/ Bad EQ:** Must separate traps from simple coordination problems where a *good* equilibrium exists but is hard to reach due to communication/focal point issues. *Why:* Solutions differ (focal points vs. incentive restructuring).
  4.  **Revealed Preference vs. Genuine Unwanted Outcome:** Must account for the possibility that stated preferences ("we hate this") might conflict with revealed preferences (consistent choices sustaining the bad outcome). The theory must require evidence that the *claimed* Pareto-superior outcome is genuinely feasible and preferred by all under full information/commitment. *Why:* Prevents mislabeling outcomes people secretly prefer (e.g., "status games are awful" while actively pursuing status) or outcomes where the alternative is truly infeasible as traps.
  5.  **Local vs. Global Incentives:** Must model the misalignment between individual/group rationality and collective/system rationality. *Why:* Explains why the trap persists despite its global badness.

  ### Required Case Handling
  6.  **Arms Races:** (Non-Negotiable) Explain why mutual disarmament is preferable but unstable (e.g., Prisoner's Dilemma dynamics). *Why:* The paradigmatic example.
  7.  **Commons Depletion (Tragedy of the Commons):** (Non-Negotiable) Explain why overuse occurs despite mutual ruin, and how privatization/regulation can potentially break it. *Why:* The other paradigmatic example.
  8.  **Safety/Race-to-the-Bottom:** Explain why competitors cut corners (safety, quality, ethics) even when all prefer higher standards (e.g., unregulated industries, AI safety concerns). *Why:* Core modern concern.
  9.  **Positional/Status Races:** Explain why investing in zero-sum status competition can be individually rational but collectively wasteful (e.g., conspicuous consumption, credential inflation). *Why:* Addresses pervasive social/economic dynamics.
  10. **Misleading Race Case:** Include a case where competition looks like a trap but isn't. *Example:* Intense competition for a genuinely scarce, highly valued prize (e.g., Olympic gold, CEO position). *Why:* Demonstrates the theory can identify false positives and the crucial role of *feasible Pareto improvement*.

  ### Required Intervention Guidance
  11. **Identify Leverage Points:** The theory must suggest *types* of interventions that can break the trap by altering:
      *   **Payoffs** (e.g., taxes, subsidies, liability rules)
      *   **Information/Perception** (e.g., transparency, education about collective harm)
      *   **Number/Access** (e.g., limiting entrants, access rules)
      *   **Iteration/Reputation** (e.g., enabling repeated interactions, building trust)
      *   **Enforcement Mechanism** (e.g., creating binding agreements, external regulators)
      *   *Why:* Practical utility is key. Must go beyond diagnosis.
  12. **Predict Intervention Failure Modes:** Must predict when interventions will merely shift costs, create new traps, be gamed, or fail to stabilize the superior outcome. *Why:* Prevents naive solutions.

  ### Theoretical Consistency (Non-Negotiable)
  13. **Consistent with Game Theory & Micro:** Cannot contradict fundamental results (e.g., existence of Nash equilibria, Pareto efficiency concepts, incentives in PD/Chicken/Assurance games). *Why:* Grounds the theory in established rigor.
  14. **Evolutionary Plausibility:** Should be compatible with evolutionary dynamics where strategies compete/replicate based on relative fitness within the system. *Why:* Explains how traps emerge and persist without conscious design.

  ### Tensions & Killing Lazy Moloch
  *   **Key Tension:** Requirement 1 (Pareto-Inferior Nash EQ) vs. Requirement 4 (Revealed Preference). Proving a *feasible* outcome exists that *all* actors would *strictly prefer under full commitment/information* is extremely hard empirically. Lazy Moloch ignores this and assumes stated preferences reflect true collective desires for a feasible alternative.
  *   **Lazy Moloch Killer:** **Requirement 1 (Pareto-Inferior Nash Equilibrium)** is the single most important requirement. It kills lazy Moloch by forcing proponents to:
      1.  Prove the current state is stable (no unilateral incentive to deviate).
      2.  Prove a *feasible*, *different* state exists.
      3.  Prove *all* actors strictly prefer that different state.
      Lazy invocations usually fail (2) or (3), mistaking scarcity, zero-sum conflict, or individual loss for a collective trap.

  ### Scorecard Summary (The Bare Minimum)
  A situation is a true **Multipolar Trap (Moloch)** **iff**:
  1.  **Stable Badness:** It's a Nash Equilibrium (No one can unilaterally escape).
  2.  **Feasible Better:** A different, achievable outcome exists.
  3.  **Universal Preference:** *All* actors genuinely prefer that better outcome over the current one (Pareto Superior).
  4.  **Incentive Misalignment:** Individual/group rationality conflicts with collective rationality.

  **Use this filter:** If you can't clearly articulate the *feasible, universally preferred alternative* and *why no one can move there alone*, it's probably not a Moloch trap. It might be scarcity, conflict, a different coordination failure, or just competition you dislike.
