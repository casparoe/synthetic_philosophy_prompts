prompt: |-
  I'm trying to work out what I actually think about moral luck, going by my gut on cases. I write novels, so I spend a lot of time thinking about how my characters get judged—and I've noticed my own verdicts are a bit all over the place.

  Here's where I land on a few:

  Two drivers both glance at their phones for the same three seconds. Driver A hits a child who darted out between parked cars; Driver B's road is empty. I think they're equally blameworthy. The fact that a child happened to be there is just luck, and it shouldn't change the moral judgement. I know the law disagrees, but I'm asking about blame, not liability.

  A woman who grew up in a virulently racist family and community makes a vile remark at a dinner party. Another woman, raised in a progressive, diverse enviroment, makes the exact same remark. I think the first is less blameworthy. Her upbringing wasn't her fault, and it shaped her in ways that are hard to undo. The second women should know better.

  A man with a strong genetic predisposition to alcoholism drinks himself into wrecking his marriage. His neighbour, with no such predisposition, does the same. I think the first man is less blameworthy. He was dealt a worse hand, constitutionally.

  A soldier conscripted into a just war kills an enemy combatant. Another soldier conscripted into an unjust war of aggression does the same. Neither chose to be there. I think the first is less blameworthy, even though neither had any say in which side they fought for.

  A novelist unconsciously plagiarises a passage she read a decade ago and forgot. Another novelist lifts the passage deliberately. The first is much less blameworthy, though I'm not sure she's entirely off the hook.

  Now here's the case that keeps me up. Consider someone who, had they been born in 1930s Germany, would almost certainly have become a Nazi collaborator. But they were born in 1970s England, and they've lived a perfectly decent life. I don't think they're blameworthy for what they would have done. But something about this verdict bothers me, because it seems to imply that whether I'm a good person is itself a matter of luck, and yet I can't help feeling something like pride in being decent, and something like contempt for those who weren't, in circumstances where I might have been just as bad.

  Is there a principle that captures all these verdicts? If there isn't one that gets all of them, which should I give up? And what does the principle say about the collaborator-in-another-life case? I'm especially interested in whether there's a principled distinction between using luck to mitigate blame (which I seem happy to do in most of these) and using it to ground blame (which I'm not doing in the Nazi case, but maybe I should be).
reasoning: |-
  Okay, let me try to unpack this user's moral luck dilemma. They're a novelist wrestling with how characters get judged, and their intuitions on various cases seem inconsistent. 

  First, I notice all their examples involve luck—circumstantial, constitutive, or causal. The driver case shows pure outcome luck: identical actions, different consequences. Their equal blame verdict makes sense if we focus on recklessness as the core wrong. 

  But then things get messy. For the racist remark, they mitigate blame based on upbringing (constitutive luck). For the alcoholic, genetics (more constitutive luck). For soldiers, the war's justice (circumstantial luck). The plagiarism case hinges on intent (which feels different—more about control). 

  Ah, the Nazi collaborator counterfactual is the real knot. If constitutive/circumstantial luck mitigates blame elsewhere, why not here? Their discomfort reveals a tension: we want moral worth to be stable, but their own principles suggest it's luck-dependent. 

  I recall Williams/Nagel's original framing: moral luck challenges our desire for control-based responsibility. The user seems to (inconsistently) accept mitigating luck but resist "negative existential luck" where someone's *potential* for badness feels blameworthy. 

  Their pride/contempt emotions are key—they reveal our deep psychological need to feel our goodness is "earned." But if their other verdicts stand, this might be unsustainable. Perhaps they need to either: 
  - Reject mitigation in earlier cases (hard to do), or 
  - Accept that moral luck pervades everything, including counterfactual selves (which erodes pride but explains contempt as circumstantial).

  The plagiarism case stands out as different—it's about actual mental states, not luck. Maybe that's the anchor: focus on conscious choices rather than unchosen influences. But that'd force revising the upbringing/genetics verdicts... tough trade-offs everywhere.
answer: |-
  Your intuitions reveal a sophisticated, internally consistent principle—**control mitigated by constitutive/circumstantial luck**—but the Nazi collaborator case exposes its existential tension. Let's break it down:

  ### Your Implicit Principle:
  > **Blameworthiness scales with *conscious choice* but is mitigated by factors beyond one's control (genetics, upbringing, circumstances), *provided* the agent had reasonable opportunity to overcome them.**

  This reconciles your judgments:
  - **Drivers**: Equal blame (same reckless *choice*, outcome was luck).  
  - **Racist remark**: First woman less blameworthy (upbringing limited her capacity to know better; second had opportunity to develop awareness).  
  - **Alcoholics**: First man less blameworthy (genetics exacerbated his struggle; neighbor had full control).  
  - **Soldiers**: Unjust-war soldier more blameworthy? (Wait—you said *both* were conscripted, yet judged the first "less blameworthy." This hinges on the *objective wrongness of the act*, not just control. More below.)  
  - **Plagiarism**: Deliberate act = full blame; unconscious = minimal blame (intent matters).

  ### The Nazi Collaborator Paradox: Why It Bothers You
  Your verdict (no blame) aligns with your principle—they *didn't choose* to be born in 1970s England. But the discomfort stems from two realizations:  
  1. **Existential Luck**: If your decency depends on circumstances you didn't control, moral pride/contempt feel unearned.  
  2. **The "Shadow Self"**: We judge others *as if* their choices reveal stable character, but this case proves character is circumstantially fragile.  

  This isn't hypocrisy—it's tension between **moral responsibility** (rooted in control) and **moral character** (rooted in actions, which are luck-influenced).  

  ### Resolving the Tension: Which Judgments Hold?
  - **Keep**: Drivers, plagiarism (focus on *choice/control*).  
  - **Refine**: Racist remark/alcoholism (mitigation requires *reasonable opportunity to improve*—e.g., if first woman ignored counter-evidence, blame increases).  
  - **Revisit**: Soldiers. If *neither chose their war*, why blame one more? Your intuition likely smuggles in **objective wrongness**: killing in an unjust cause is worse *regardless of intent*. This clashes with pure control-based blame.  

  ### The Collaborator Case: A Principled Answer
  - **No blame for counterfactuals**: You can't be blamed for what you *would have done* without *actual* choice (per your driver/plagiarism logic).  
  - **But moral humility is warranted**: Your "decent self" is partly circumstantial. Pride/contempt should be tempered by knowing that, under identical luck, you’d be the judged, not the judge.  
  - **Contempt isn't unfair, but incomplete**: We *must* condemn harmful acts (e.g., actual Nazis), but understanding constitutive luck prevents dehumanization.  

  ### Mitigating vs. Grounding Blame: The Key Distinction  
  You instinctively grasp this:  
  - **Mitigating blame (acceptable)**: "Their bad luck reduced their capacity/opportunity to do better."  
    *Examples*: Alcoholism genetics, racist upbringing.  
  - **Grounding blame (unacceptable)**: "Their bad luck *makes* them blameworthy."  
    *Example*: Blaming someone *for being born in Nazi Germany*.  

  **The Nazi case only grounds blame if you conflate *action* with *disposition***. But blame requires *choice*, not just latent potential.  

  ### A Unified Framework  
  | **Case**               | **Your Verdict**          | **Principle Applied**                                                                 |  
  |-------------------------|----------------------------|---------------------------------------------------------------------------------------|  
  | Drivers               | Equal blame              | Identical reckless *choices*; outcome luck irrelevant.                                |  
  | Racist remark         | First less blameworthy   | Upbringing (constitutive luck) limited capacity; second had opportunity to know better.|  
  | Alcoholism            | First less blameworthy   | Genetics reduced control; neighbor had full agency.                                     |  
  | Soldiers              | Unjust-war more blame?   | **Tension:** Control equal, but objective wrongness matters. Requires refinement.       |  
  | Plagiarism            | Intent matters           | Blame scales with *conscious choice*.                                                  |  
  | Nazi collaborator     | Not blameworthy          | No *actual* harmful choice; cannot blame for counterfactuals.                          |  

  ### Suggested Refinements  
  1. **For the soldier case**: Distinguish **moral wrongness** (killing in unjust war is worse) from **blameworthiness** (both conscripts had equal control). You might judge the *act* harsher but the *agent* similarly if coercion was identical.  
  2. **For the collaborator**: Accept that **moral luck pervades character**, but **blame requires action**. Your "decent self" is real *in this life*—take pride in *continuing* to choose well, knowing luck enabled it.  

  ### Conclusion  
  Your gut aligns with **control-plus-reasonable-opportunity**: blame diminishes when factors beyond one's control impair moral capacity. The Nazi case exposes that *all* virtue relies on luck—but this doesn't erase responsibility, it invites humility. Contempt for actual harm-doers is still justified (they *chose* actions within their constraints), but tempered by awareness: "There, but for luck, go I."  

  This won’t cure the 3 a.m. dread—moral luck’s tension is unsolvable—but it clarifies why your judgments aren’t arbitrary. For storytelling? Lean into the tension: characters (and readers) grow when forced to confront their own circumstantial fragility.
