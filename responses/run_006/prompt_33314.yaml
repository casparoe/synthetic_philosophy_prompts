answer: |-
  Here’s a structured 75-minute teaching plan for introducing the internal/external reasons distinction, designed for philosophy grads with prior metaethics exposure but new to Williams/Korsgaard. Focus is on **conceptual foundations**, **misconception avoidance**, and **secure comprehension**.

  **Core Objective:**  
  Students grasp that the debate concerns the *necessary conditions* for attributing normative reasons to an agent – specifically, whether reasons *must* be grounded in the agent’s subjective motivational set (internal) or *can* exist independently of it (external).

  ---

  ### **Teaching Plan (75 mins)**

  #### **I. Foundational Groundwork (20 mins)**
  *   **Start with "Reasons-Talk" (5 mins):**  
      Ask: *"When we say 'A has a reason to φ' (e.g., go to the dentist, tell the truth, pursue a PhD), what are we* ***asserting exists*** *in the world? What kind of fact is this?"*  
      *   *Goal:* Surface intuitions about normativity. Recap that reasons are normative entities (justifying/prescribing action), distinct from mere causes or predictions.
  *   **The 'Why Be Moral?' Challenge (5 mins):**  
      Briefly link to Hume ("Reason is, and ought only to be, the slave of the passions") & Kant. Ask: *"Can there be a reason to act morally* ***even if*** *an agent has no desire whatsoever to be moral? If so, what grounds that reason?"*  
      *   *Goal:* Position the debate within metaethics – grounding normativity. This foreshadows realism vs. anti-realism tensions.
  *   **The 'Psychologism' Question (10 mins):**  
      **Crucial Step:** Introduce the key question Williams forces: **"Must a normative reason *for this specific agent* necessarily connect, in some way, to something *within* their actual psychology (their desires, dispositions, commitments, projects)?"**  
      *   Define "Motivational Set (S)": Broadly – an agent’s existing desires, commitments, loyalties, projects, dispositions (anything that can *motivate* them).
      *   **HEAD OFF MISCONCEPTION #1 (Self-Interest):** Explicitly state: *"Note: 'Internal' does* ***not*** *mean 'selfish' or 'self-interested'. Someone's motivational set S might include deep commitments to justice or self-sacrifice. An 'internal reason' stems from S, whatever S contains."*
      *   **HEAD OFF MISCONCEPTION #2 (Awareness):** Explicitly state: *"Note: 'Internal' does* ***not*** *mean 'conscious' or 'currently thought about'. Elements of S can be dispositional or unconscious. The link is to the agent's psychology, not their present awareness."*

  #### **II. The Core Case Study: "Chilly" (25 mins)**
  *   **Present the Case (5 mins):**  
      > *"Chilly is a moderately successful artist. They feel unfulfilled, restless, and vaguely dissatisfied with their current work and lifestyle, though not actively unhappy. Chilly has* ***no*** *current desire, project, or commitment related to mountaineering. They've never considered it. A perceptive friend, knowing Chilly's latent resilience, love of wild landscapes (expressed only through painting so far), and need for intense challenge, says: 'Chilly* ***has a reason*** *to take up mountaineering – it would fulfil them in ways art currently isn't.'"*
      *   **Key Features of the Case:**
          *   Involves a *prudential* reason (fulfilment), avoiding immediate moral complexities.
          *   Chilly has *no* existing motivation/deliberative path *towards* mountaineering. It's alien.
          *   The friend asserts a reason *exists* based on Chilly's *latent* traits/potential fulfilment.
          *   It avoids obvious self-harm or irrationality on Chilly's part *not* to pursue it *yet*.
  *   **Analysis & Applying the Distinction (20 mins - Guided Discussion):**
      1.  *The Internalist Claim (Williams):* Ask: *"According to an internalist, does Chilly* ***currently*** *have a reason to take up mountaineering? Why/why not?"*  
          *   *Guide them:* No *current* element of Chilly's S connects to mountaineering via sound deliberation. The friend sees *potential*, not a current link. Chilly *could* acquire a reason if mountaineering became connected to S (e.g., after trying it, learning more, deliberating on their dissatisfaction). But *now*? No internal reason.
      2.  *The Externalist Claim:* Ask: *"Could the friend be right? Could Chilly have a reason to take up mountaineering* ***even if*** *it doesn't connect to anything in their current motivational set? What would ground that reason?"*  
          *   *Guide them:* Yes, if reasons can be grounded in objective facts about human flourishing, Chilly's nature, or the inherent value of certain activities *independently* of S. The friend might point to Chilly's *objectively* unfulfilled potential or the *objectively* fulfilling nature of mountaineering *for someone like Chilly*.
      3.  *Contrast:* Hammer the core distinction:  
          *   **Internal:** A reason exists for A to φ *only if* φ-ing would further some element of A's S, or A *could* come to be motivated to φ by sound deliberation from S. *(Reason dependent on S)*.  
          *   **External:** A reason exists for A to φ *if* φ-ing is the right/rational/required thing to do *regardless* of any link to A's S. *(Reason independent of S)*.
      4.  **HEAD OFF MISCONCEPTION #3 (Motivation Guarantee):** Clarify: *"Williams* ***doesn't*** *say internal reasons always* ***motivate*** *the agent. He says they* ***explain*** *action (if the agent deliberates correctly). An agent can have an internal reason but fail to recognise it or be irrational."*

  #### **III. Implications & Why It Matters (15 mins)**
  *   **Normative Force (5 mins):** Ask: *"What* ***force*** *does an external reason claim have for an unmotivated agent? What can the externalist say to Chilly beyond 'This would be good for you'?"* (Hint: "You *ought* to care" / "You are *irrational* not to"? But what grounds *this* 'ought'?).
  *   **Williams' Challenge (5 mins):** Explain Williams' core argument: External reason statements are **obscure** or **false**. If a reason claim is true, it *must* be possible for the agent to be moved by it via sound deliberation from their S. If no such path exists, the statement is either false or refers to something else (like a mere *consideration*).
  *   **Metaethical Stakes (5 mins):** Briefly link back: *"This debate cuts to the heart of moral objectivity and normativity's source. If all reasons are internal, does this undermine robust moral realism? Can there be 'categorical' reasons (binding regardless of desire)?"* (Foreshadow Korsgaard/Kantian responses).

  #### **IV. Comprehension Check: The Final Question (5 mins)**
  *   **Don't ask:** "Define internal/external reasons."
  *   **DO ASK:**  
      *"Imagine someone argues: 'Chilly* ***has an external reason*** *to take up mountaineering – it would develop their character in objectively valuable ways.' What is the* ***most fundamental point of disagreement*** *between this externalist claim and Bernard Williams' internalist view? What does Williams specifically deny about this claim?"*

      *   **What reveals true grasp:**  
          The correct answer focuses on the *grounding* and *necessary conditions*: Williams denies that the objective value of character development, *by itself and independently of Chilly's motivational set*, can constitute a genuine normative reason *for Chilly*. He insists a reason requires a link (actual or potential via deliberation) to Chilly's existing S. Merely asserting an objective good isn't sufficient to attribute a reason to *this specific agent* if it doesn't connect to their psychology.
      *   **Signs of confusion:**  
          Answers focusing solely on Chilly not *wanting* to climb, it not being in their *self-interest*, or them not *knowing* about the reason miss the core metaphysical point about what constitutes a reason's existence.

  ---

  **Why this structure works:**
  1.  **Builds from Normativity:** Starts with the basic puzzle reasons pose, setting the stage for *why* the grounding question is vital.
  2.  **Pre-empts Key Errors:** Actively dismantles "self-interest" and "awareness" confusions *before* introducing the labels.
  3.  **Central, Controlled Case:** "Chilly" isolates the debate's core – latent potential vs. psychological grounding – without moral baggage or obvious irrationality.
  4.  **Contrast via Application:** Forces students to *apply* both views to the same case, making the difference concrete.
  5.  **Final Question Tests Understanding:** Requires identifying the metaphysical disagreement about reason-grounding, not just definition recall.

  **Materials:** Have the core Williams definition (Internal Reason: "A has a reason to φ iff φ-ing would further some element of A's S, or A could be motivated to φ by sound deliberation from S") ready to display *after* the case discussion to formalise what they've just grasped conceptually. Good luck!
