prompt: |-
  ok so I'm working on a paper about persistence through time and I've got a set of views I'm trying to hold together. before I go further I'd love a consistency check from someone who knows this stuff. here's where I'm at:

  (1) I'm an endurantist — objects are wholly present at every moment they exist. they don't have temporal parts.
  (2) I'm an eternalist about time — past, present, future are all equally real. the block universe picture.
  (3) I think the problem of temporary intrinsics (how can a thing be bent today and straight tomorrow if it's wholly present both times?) is a genuine puzzle for endurantism, not a pseudo-problem.
  (4) I reject Lewis's modal realism and counterpart theory — I think objects exist in only one world and have strict transworld identity. possibilia are fine but they're abstract.
  (5) I think in statue-and-clay cases (a lump of clay shaped into a statue), the statue and the lump are two distinct material objects that coincide. they're not identical.

  go through these and tell me which pairs are actually in tension and which only look like they are. rank the tensions by how serious they are. for each genuine tension, tell me what has to give and what the cheapest fix is. and hey if there's one revision that would clean up multiple problems at once, point that out. I'd like this as plain continuous prose, not a list or bullet points or bold headings, just the way you'd write me an email about it.
