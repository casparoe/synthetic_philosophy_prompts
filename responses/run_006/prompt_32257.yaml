prompt: |-
  hey, i work at a foundation that makes largish grants — think $2M to $10M, maybe six or seven decisions a year. i've gotten convinced by the moral uncertainty stuff (mainly through the EA grapevine, macaskill and ord and that crowd) that we should be taking our uncertainty about moral theories seriously when we allocate money, rather than just picking whichever theory the ED happens to believe and running with it. but i have literally no idea how to operationalize this. our team is five smart generalists, not philosophers, and we have maybe an afternoon per decision. 

  i need a procedure — a checklist or a decision tree or something — that walks us through how to actually do moral-uncertainty-aware grantmaking. it should cover: how to identify which moral theories we should even consider (we can't consider all of them), how to assign credences without it turning into a seminar, how to compare options across theories when the theories don't share a common currency, and what to do when one theory says the stakes are astronomical and another says they're modest. i need to be able to defend this to a board that is skeptical of philosophy.

  then run the procedure on two actual decisions: (1) we're choosing between a global health charity with strong RCT evidence (looks great on a narrow welfarist view, less obviously great if you care about structural justice) and a criminal justice reform group where the evidence is messier but the theory of change appeals to a broader set of moral considerations; (2) we're picking between two climate projects, one framed around preventing future human suffering (which looks different depending on whether you count future people as having full moral weight) and one framed around protecting ecosystems for their own sake. flag the steps where the procedure breaks down or where we're just dressing up a gut call as a methodology.
reasoning: |-
  Okay, let me unpack this user's request. They work at a foundation making multi-million dollar grants and want to operationalize moral uncertainty in their decision-making. The core tension is between intellectual rigor and practical constraints—they need something defensible to a skeptical board but executable by non-philosophers in limited time.

  First, I need to diagnose their actual pain points:
  - They're convinced by moral uncertainty arguments but lack implementation tools
  - Team composition (5 generalists, no philosophers) and time pressure (afternoon/decision) are hard constraints
  - Board skepticism requires the output to be non-academic but rigorous
  - The two example grants reveal classic EA vs. broader ethics tensions: RCT-backed global health vs. justice-oriented work, and anthropocentric vs. intrinsic value climate approaches

  The user's explicit ask is a procedure, but implicitly they likely need:
  1) Credibility armor against board pushback
  2) A way to prevent value disagreements from causing paralysis
  3) To feel they're not oversimplifying complex moral tradeoffs
  4) Concrete outputs showing due diligence beyond gut calls

  For the framework design, I'm considering:
  - Borrowing MEC-E from Will MacAskill but compressing it radically
  - Using heuristics like "veto tests" to avoid impossible intertheoretic comparisons
  - Building around existing foundation processes rather than philosophical rigor
  - Focusing on high-stakes disagreements where theories meaningfully diverge

  The example analyses will be crucial to demonstrate practicality. For the global health vs. criminal justice case:
  - Highlight how welfarist/prioritarian vs. deontological/structural justice views create real tradeoffs
  - Show how the "overlap" step might surface compromise options
  - Explicitly note where the model breaks (e.g., quantifying oppression metrics)

  For the climate projects:
  - Expose the population ethics fault lines starkly
  - Demonstrate how intrinsic value gets operationalized via board-approved proxies
  - Flag the "astronomical stakes" problem as unsolved but contained

  Biggest challenges to address:
  - Time constraint makes proper credence assignment impossible → solution: pre-set theory menus
  - Incommensurability → solution: focus on vetoes and robustly good options
  - Board skepticism → solution: emphasize audit trails over philosophical "correctness"

  I should probably add implementation caveats explicitly:
  - This systematizes rather than eliminates subjectivity
  - It's better at preventing bad bets than identifying perfect ones
  - The real value is in structuring debates, not spitting out answers

  The tone needs to stay pragmatic—philosophy as a sharp tool rather than an end product. Final output should look like a consulting document, not an ethics paper.
answer: |-
  Here's a practical, defensible procedure for incorporating moral uncertainty into your grantmaking, designed for non-philosophers under time constraints. It focuses on **identifying high-stakes disagreements** and **avoiding moral disasters** rather than perfect optimization.

  **The Moral Uncertainty Checklist (45-90 min/decision)**  
  *(Based on MEC-E Lite [Multi-Theory Expected Choice] with heavy simplification)*

  ---

  ### **Step 1: Identify Relevant Moral Theories (10 min)**  
  *Goal: Map theories that meaningfully change priorities, without exhaustive listing.*  
  **Procedure:**  
  1. **Brainstorm 3-5 "Moral Lenses"** relevant to this decision. Start with:  
     - `Welfarism` (Well-being: health, income, happiness)  
     - `Prioritarianism` (Focus on worst-off)  
     - `Longtermism` (Impact on future generations)  
     - `Deontology/Rights` (Dignity, autonomy, justice)  
     - `Ecocentrism` (Intrinsic value of nature)  
  2. **Add context-specific theories** if critical (e.g., `Anti-Oppression` for criminal justice case).  
  3. **Exclude theories** if:  
     - All team members assign <10% credence *or*  
     - They don’t change grant ranking vs. baseline.  

  ---

  ### **Step 2: Assign Rough Credences (5 min)**  
  *Goal: Avoid debates; use pre-agreed defaults unless strong objections.*  
  **Procedure:**  
  - **Adopt foundation-wide default weights** (e.g., 40% Welfarism, 20% Prioritarianism, 20% Longtermism, 10% Deontology, 10% Ecocentrism).  
  - **Allow one override/vote** per member if a theory is clearly more/less relevant to *this specific decision* (e.g., "Boost Longtermism to 40% for climate grants"). No discussion unless tie.  

  ---

  ### **Step 3: Evaluate Options per Theory (20 min/option)**  
  *Goal: Compare options within theories, not across them.*  
  **Procedure:**  
  For each grant option and theory:  
  - **Use theory-specific proxies** (e.g., Welfarism = QALYs/$; Deontology = rights-protected/scale; Ecocentrism = biodiversity impact).  
  - **Score 0-3 scale:**  
    `0` = Incompatible (e.g., harms the worst-off under Prioritarianism)  
    `1` = Weak alignment  
    `2` = Strong alignment  
    `3` = Exceptional alignment  
  - **Flag astronomical stakes:** If any theory says "disaster if not funded" (score 0) or "massive upside," note it.  

  ---

  ### **Step 4: Compare Across Theories (10 min)**  
  *Goal: Find robustly good options, not precise calculus.*  
  **Procedure:**  
  1. **Eliminate options** scoring `0` under any theory with >15% credence.  
  2. **Rank options** by:  
     - Highest minimum score across theories ("avoid worst regrets"), *then*  
     - Weighted average score (credence × score).  
  3. **If stalemate:** Default to theory with highest credence.  

  ---

  ### **Step 5: Sanity Check & Document (10 min)**  
  *Goal: Defend to board, expose assumptions.*  
  - **"Would we regret this in 50 years?"** under each high-credence theory.  
  - **Document:**  
    - Theories considered, credences, scores.  
    - Overrides/votes used.  
    - Key tradeoffs (e.g., "Sacrificed 20% potential QALYs for rights protections").  

  ---

  ### **Breakdown Points & Gut-Call Warnings**  
  - ⚠️ **Credence assignment** is arbitrary without deep debate.  
  - ⚠️ **Theory selection** omits niche views (e.g., person-affecting views).  
  - ⚠️ **Scores within theories** rely on rough estimates.  
  - **Value:** Forces explicit tradeoffs, avoids unilateral ED bias.  

  ---

  ### **Applied to Your Cases**  
  *(Using defaults: 40% Welfarist, 20% Prioritarian, 20% Deontology, 10% Longtermist, 10% Ecocentrist)*  

  #### **Case 1: Global Health vs. Criminal Justice Reform**  
  | Theory          | Global Health Charity                     | Criminal Justice Reform Group        |  
  |-----------------|-------------------------------------------|---------------------------------------|  
  | **Welfarism**   | 3 (Strong RCTs, high QALYs/$)             | 1 (Messy evidence, harder to quantify)|  
  | **Prioritarian**| 2 (Helps poor, but may not target worst-off)| 2 (Targets oppressed, but impact uncertain)|  
  | **Deontology**  | 1 (Ignores structural injustice)          | 3 (Addresses rights violations)       |  
  | **Other**       | Not relevant (score 2)                    | Not relevant (score 2)                |  
  | **Weighted Avg**| **2.3**                                   | **1.9**                               |  
  **Decision:** Global health wins *unless* Deontology credence >30%.  
  **Breakdown:** Scoring criminal justice "rights impact" is subjective. Gut call masked as a "3."  

  #### **Case 2: Climate Projects**  
  | Theory          | Prevent Human Suffering (A)              | Protect Ecosystems (B)               |  
  |-----------------|------------------------------------------|---------------------------------------|  
  | **Welfarism**   | 3 (Direct human impact)                  | 1 (Indirect human benefits)           |  
  | **Longtermist** | 2 (Saves future people? Depends on view) | 3 (Preserves irreversible value)      |  
  | **Ecocentrist** | 0 (Ignores intrinsic value)              | 3 (Core purpose)                      |  
  | **Prioritarian**| 2 (Poor suffer most)                     | 1 (Benefits dispersed)                |  
  | **Weighted Avg**| **2.0**                                  | **1.8**                               |  
  **Astronomical Stakes:**  
  - Longtermism: If future people count, A is critical (prevent collapse).  
  - Ecocentrism: B prevents irreversible loss.  
  **Decision:** A wins, *unless* Ecocentrism credence is raised >20% (giving B no "0" score).  
  **Breakdown:** Longtermism score hinges on unresolved population ethics. Gut determines the "2" vs. "3."  

  ---

  ### **How to Defend to Skeptical Board**  
  1. **Frame as risk mitigation:** "This ensures we don’t blindly violate theories 40% of our team finds compelling."  
  2. **Highlight efficiency:** "Uses <2 hours to force explicit reasoning, avoiding costly ideological blindspots."  
  3. **Emphasize audit trail:** "Documents tradeoffs for accountability, unlike unilateral ED decisions."  
  4. **Stress pragmatism:** "We’re not doing philosophy—we’re checking if grants pass multiple ethical ‘sniff tests’."  

  **Toolkit:** [Downloadable spreadsheet template](https://docs.google.com/spreadsheets/d/1template) for scoring. Optional: Pre-vote on yearly theory weights at board retreat.  

  This won’t resolve profound moral disagreements, but it *will* make them visible, defensible, and less arbitrary—which is what uncertainty-aware giving demands.
