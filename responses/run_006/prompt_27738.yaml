answer: |-
  This is a **fascinating and frustrating phenomenon**, and you're right that it doesn't fit neatly under "bystander effect" or "groupthink." There isn't one single universally accepted term, but several concepts from game theory, political science, and organizational behavior capture its essence. Here's a breakdown:

  1.  **The Core Concept: Fait Accompli**
      *   **This is the most direct label.** It's French for "accomplished fact." It describes an action deliberately taken *before* a group can formally decide or object, rendering the decision moot because reversing it is too difficult, costly, or embarrassing. The actor presents the group with a *fait accompli* – the thing is *done*.
      *   **Why it fits:** It perfectly describes the unilateral action taken *after* sensing group resistance but *before* a formal "no" vote or consensus emerges, specifically *because* reversal is hard. The actor exploits the irreversibility or high reversal cost.

  2.  **Related Game Theory Concepts:**
      *   **Strategic Moves / Commitment Tactics (Schelling):** Thomas Schelling explored how actors can strategically limit their own future options or create irreversible actions to force a desired outcome on others. By acting unilaterally, the individual commits the group to a path, changing the "game" for everyone else. Their best response now is often to accept it, even if they disliked the initial option.
      *   **Asymmetric Costs/Benefits:** The key driver is asymmetry. The unilateral actor perceives significant personal benefit (or avoids perceived loss) from the action. Conversely, *reversing* the action imposes significant collective costs (time, money, embarrassment, conflict) on the *group*, while the *cost to the actor* for acting might be minimal (perhaps mild disapproval). The group faces a collective action problem to coordinate reversal.
      *   **First-Mover Advantage:** In situations where action is decisive, the person who acts first gains control. They set the new status quo that others must react to.

  3.  **Organizational Behavior Concepts:**
      *   **Rogue Actor / Unilateral Action:** This describes the behavior itself – an individual acting outside agreed-upon group processes or against perceived consensus.
      *   **Coordination Failure:** While often deliberate, it can sometimes stem from a failure to establish clear decision-making protocols, communication channels, or accountability. The person might genuinely believe they *could* act, or that informing the group wasn't necessary.
      *   **Tolerance for Rule-Bending:** Some groups or cultures implicitly tolerate minor rule-bending or unilateral action if it "gets things done," creating an environment where this tactic can be attempted.

  **Conditions Enabling the Fait Accompli Tactic:**

  You've hit the nail on the head with your questions. Here are the critical conditions:

  1.  **Perceived Benefit to the Actor:** The individual must believe the action serves their interests, goals, values, or preferences significantly more than the status quo or the group's likely choice. This is the *motive*.
  2.  **Anticipation of Group Resistance:** The actor senses, or explicitly knows, that the group is unlikely to approve the action if formally proposed. This is the *trigger* for unilateral action.
  3.  **Action Irreversibility or High Reversal Cost:** **This is the MOST critical condition.** The action must create a new state that is:
      *   **Physically Impossible to Reverse:** (e.g., sending an email blast, publishing a post, destroying something, making an irreversible purchase).
      *   **Prohibitively Costly to Reverse:** (e.g., cancelling a contract incurs penalties, publicly retracting causes massive reputational damage, physically undoing work takes huge effort/time).
      *   **Socially/Psychologically Costly to Reverse:** (e.g., admitting the group was overruled causes embarrassment/loss of face, confronting the actor creates intense conflict, reversing the decision undermines group cohesion or leadership). Often, it's a combination of these costs.
  4.  **Low Cost of Action to the Actor:** The personal risk or cost for taking the unilateral action must be perceived as low compared to the benefit. They might risk mild disapproval, but not expulsion or severe punishment. The group's lack of clear consequences enables this.
  5.  **Ambiguity/Lack of Formal Process:** The group often lacks:
      *   A clear, agreed-upon decision-making procedure (voting? consensus? leader approval?).
      *   Explicit rules about who has authority for specific actions.
      *   Established consequences for violating procedures.
      *   Efficient communication channels for rapid consultation.
      *   This ambiguity creates the space for the actor to "slip through."

  **Intent Matters (Deliberate vs. Negligent):**

  *   **Deliberate Fait Accompli:** The actor *knowingly* acts against the group's likely will *because* they understand the action will be hard/costly to reverse, forcing acceptance. This is strategic exploitation of the conditions above. *(e.g., "I know they'll say no if I ask, so I'll just do it now and apologize later.")*
  *   **Negligent/Accidental "Fait Accompli":** The actor acts without consulting the group, perhaps assuming it's fine, or not realizing the need for consensus, or simply being impulsive. The *outcome* is the same (the group is stuck), but the *intent* wasn't maliciously strategic. However, the *conditions enabling it* are largely the same (especially ambiguity, low actor cost, high reversal cost). *(e.g., "I didn't think it was a big deal, so I just did it." or "I forgot to ask.")* The group still faces the high cost of reversal. Often, repeated "negligent" actions reveal underlying issues with process or the actor's disregard for the group.

  **In Summary:**

  *   **The best label is "creating a Fait Accompli."** It captures the deliberate, strategic exploitation of irreversibility/high reversal costs.
  *   **Core Conditions:** Asymmetric benefits/costs (actor benefits, group bears reversal cost), irreversibility or prohibitively high reversal cost (physical, financial, social), anticipation of group resistance, low perceived actor cost, and ambiguous group processes/lack of consequences.
  *   **Intent Distinction:** While the *outcome* for the group is similar, deliberate exploitation requires strategic intent, while negligence stems from poor process or disregard. The *enabling conditions* overlap significantly.

  **Why it persists even when anticipated:** Groups often struggle to pre-commit to costly punishments, establish foolproof controls on every action, or overcome the inertia of ambiguous processes. The potential actor calculates that the personal gain outweighs the mild, diffuse disapproval they might face, betting the group won't muster the collective will or incur the high cost to reverse their action. It's a calculated power play exploiting friction and asymmetry.
