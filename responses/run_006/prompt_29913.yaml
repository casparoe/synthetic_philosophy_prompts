prompt: |-
  ok so i've been trying to build a simple agent that plans out its day — like, literally just a calendar assistant — and i keep running into this thing where to figure out whether moving a meeting will cause a conflict, it seems like the agent has to check every single fact it knows about the world. and i realized i've accidentally rediscovered the frame problem. so i went and read a bunch of the philosophy and AI literature on it, and honestly i'm more confused than when i started, because everyone seems to mean something slightly different by "the frame problem" and everyone's solution seems to solve a different version of it.

  so before i go any deeper, i want someone to just write me the desiderata. what does a solution to the frame problem actually have to deliver? i don't mean the technical frame problem in the narrow sense (the one about frame axioms and representing what doesn't change), i mean the broader problem: how does a finite agent determine which consequences of an action are relevant without explicitly reasoning through all of them?

  what i want is a list of requirements that any adequate account has to meet. for each one, tell me what case or consideration motivates it — like, what happens if you try to get away without it, what breaks. and then tell me which of these requirements are non-negotiable (if you drop this, you're not even addressing the frame problem anymore) and which are more like preferences of particular camps (the embodied cognition people want one thing, the logical AI people want another, etc.).

  and here's the thing i'm most curious about: are any pairs of these requirements in tension? like, is there a version of "you must be computationally tractable" that conflicts with "you must handle the full qualification problem" or with "you must capture how humans actually do it"? if some subset of the desiderata can't be jointly satisfied, i want to know that, because then the frame problem isn't really one problem — it's a choice about which thing you're willing to give up, and the debate looks stalled because people are quietly making different choices.

  i don't need a full scorecard of every approach against the list, but if you want to briefly flag which requirement knocks out the most popular proposals (the Dennett-style robot thought experiments, the situated and embodied approach, the logicians' nonmonotonic stuff, predictive processing, whatever else) that would help me get my bearings. mostly i want the list itself — i feel like i've been reading papers that each assume a different spec for what counts as solving it, and i need the spec before i can evaluate anything.
reasoning: |-
  We are going to address the frame problem by breaking it down into a set of desiderata. The frame problem, in the broad sense you are referring to, is about how an agent can efficiently reason about change without having to consider every possible consequence of an action. The goal is to list the requirements that any solution must meet, explain why they are necessary, and note which are non-negotiable and which are more contentious. We will also highlight any tensions between these requirements.

  ### Desiderata for a Solution to the Frame Problem

  1. **Relevance Determination**  
     - **What it requires**: The agent must be able to determine which aspects of the world are relevant to a given action and which are not, without exhaustive search.
     - **Motivation**: Without this, the agent would have to check every fact in its knowledge base to see if it changes or is affected by the action, leading to combinatorial explosion. Your calendar agent would have to check every event in the calendar and every fact about the world (like the weather, traffic, etc.) to see if moving a meeting affects them, which is intractable.
     - **Non-negotiable**: Yes. Without this, the agent cannot scale to realistic problems.

  2. **Tractability**  
     - **What it requires**: The solution must be computationally feasible in real-world scenarios (i.e., polynomial time or better, and with reasonable constants).
     - **Motivation**: If the solution is computationally too expensive (e.g., exponential in the number of facts), then it is not useful for any practical agent.
     - **Non-negotiable**: Yes. A solution that doesn't scale is not a solution.

  3. **Completeness (with respect to the domain)**  
     - **What it requires**: The solution must be able to capture all relevant consequences of an action within the domain of interest. It must not miss critical consequences that could lead to failure.
     - **Motivation**: If the agent fails to notice that moving a meeting would cause a conflict with another meeting (or a critical event like a flight), then the plan may fail. This is the qualification problem: we cannot pre-specify all preconditions and consequences.
     - **Non-negotiable**: In principle, yes. However, in practice, we may accept bounded completeness (within the domain of discourse) because absolute completeness in open worlds is impossible.

  4. **Robustness to Novelty**  
     - **What it requires**: The agent must be able to handle novel situations and actions that were not anticipated in the initial design.
     - **Motivation**: In open domains, the agent may encounter situations not covered by its initial knowledge. Without this, the agent would break when facing anything new.
     - **Non-negotiable**: This is a key challenge. However, it is hard to achieve and often relaxed in practice (e.g., by assuming a closed world).

  5. **Cognitive Plausibility (Optional but desired by some)**  
     - **What it requires**: The solution should be consistent with how humans (or biological agents) solve the frame problem. This might involve heuristics, embodiment, or predictive processing.
     - **Motivation**: For cognitive science and AGI, we want the solution to explain human cognition and be naturally implementable in neural systems. Without it, we might have a solution that works in a machine but doesn't help us understand cognition.
     - **Non-negotiable**: No. This is a preference of cognitive science and embodied AI.

  6. **Representational Parsimony**  
     - **What it requires**: The representation of the world and the rules for change should be concise and not require an explosion of frame axioms (as in the original logical formulation).
     - **Motivation**: In the logical approach, the frame problem arises because we must state for each action what doesn't change (frame axioms) which leads to a huge number of axioms. A solution should avoid that.
     - **Non-negotiable**: Yes, because without it, the solution is not scalable.

  7. **Integration with Planning**  
     - **What it requires**: The solution must work within a planning system that chains actions and predicts states over time.
     - **Motivation**: The frame problem is not just about one action but about a sequence of actions. The solution must support efficient planning.
     - **Non-negotiable**: Yes, because the agent must plan.

  8. **Handling the Qualification Problem**  
     - **What it requires**: The solution must account for the fact that actions typically have preconditions and effects that are not exhaustively enumerable (due to the open-endedness of the world).
     - **Motivation**: Without solving the qualification problem, the agent might not consider that moving a meeting might require the meeting room to be available (if it's a physical meeting) or that participants must be free, but also that they are not sick, the building is not on fire, etc. This is the problem of under-specification.
     - **Non-negotiable**: This is often considered part of the frame problem. However, it is sometimes separated. A solution that doesn't address this is incomplete.

  9. **Nonmonotonic Reasoning**  
     - **What it requires**: The ability to draw conclusions that can be retracted in light of new information. This is because the agent must assume that most things don't change (default reasoning) and then adjust when there is evidence of change.
     - **Motivation**: Without nonmonotonic reasoning, the agent would have to re-verify every fact after every action, which is inefficient. But note: nonmonotonic reasoning might be one way to achieve relevance determination and representational parsimony.
     - **Non-negotiable**: Not necessarily. There are other approaches (like model-based reasoning). But it is a popular approach.

  ### Tensions between Desiderata

  - **Tractability vs. Completeness/Robustness to Novelty**:  
    It is computationally hard (and often undecidable) to achieve both. For example, if we want to be robust to any novelty, we might need a very general (but computationally expensive) reasoning method. Conversely, tractable methods (like using a closed-world assumption) break in novel situations.

  - **Representational Parsimony vs. Handling Qualification Problem**:  
    The qualification problem suggests that we cannot list all preconditions and effects. But if we try to represent everything, we break parsimony. Nonmonotonic logics try to solve this by allowing default rules, but they are not always tractable.

  - **Cognitive Plausibility vs. Tractability (in the classical sense)**:  
    Humans use heuristics and are not logically complete. A cognitively plausible solution might be fast but incomplete, while a logically complete system might be slow and not match human performance.

  ### How Popular Approaches Fare

  - **Logical AI (Nonmonotonic Logics)**:  
    Uses default reasoning (e.g., circumscription, default logic) to assume that only what is mentioned changes. This addresses representational parsimony and relevance determination. However, it struggles with tractability and the qualification problem (because we cannot list all exceptions). Also, it does not typically address cognitive plausibility.

  - **Situated and Embodied Approaches**:  
    The agent uses its embodiment and immediate environment to offload reasoning (e.g., by perceiving the current state). This can achieve tractability and cognitive plausibility. However, it may not handle novel situations that require complex offline reasoning (like planning a meeting in a new city) and may not be complete.

  - **Predictive Processing / Active Inference**:  
    The agent uses a generative model to predict what will change and only updates what is surprising. This might address relevance determination and cognitive plausibility. However, the computational cost of maintaining and updating the generative model might be high, and it may not be clear how to scale to complex planning.

  - **Heuristic-Based Systems (like in classical planning)**:  
    Systems like STRIPS and later planning languages (PDDL) use domain-specific heuristics and state representations that only track what changes. This can be tractable and handle representational parsimony, but they typically assume a closed world and do not handle the qualification problem well.

  ### Summary of Non-Negotiables

  The core non-negotiable requirements are:
  1. Relevance Determination
  2. Tractability
  3. Representational Parsimony
  4. Integration with Planning

  The following are also critical but might be relaxed in some contexts:
  - Completeness (within the domain)
  - Handling the Qualification Problem (to the extent possible)

  The tension between tractability and completeness/robustness is the most fundamental. This is why the frame problem remains hard: we want a system that is both efficient and robust in open-ended domains.

  In practice, most systems relax robustness to novelty and completeness by assuming a closed world (only known facts are considered) and then use nonmonotonic reasoning or heuristics to achieve tractability and relevance determination. For your calendar agent, you might assume that the only relevant facts are other calendar events and perhaps a few constraints (like working hours). This is not fully robust (what if there's a sudden holiday?) but tractable.

  I hope this provides the "spec" you need to evaluate approaches. The frame problem is indeed a cluster of problems, and the choice of which desiderata to prioritize determines the approach.
answer: |-
  Below is a structured desiderata list for a solution to the **broad frame problem**—how a finite agent determines relevant consequences of an action without exhaustive reasoning. Requirements are categorized by **non-negotiable core** (essential to the frame problem) vs. **domain-specific preferences** (emphasized by different schools). Tensions between requirements are highlighted, along with how popular approaches fail certain criteria.

  ---

  ### **Core Desiderata (Non-Nnegotiable)**  
  *Drop any of these, and you're not solving the frame problem.*

  1. **Relevance Detection**  
     - **Requirement**: The agent must distinguish relevant from irrelevant consequences of an action *without* checking all facts.  
     - **Motivation**: Without this, agents face combinatorial explosion (e.g., checking every calendar entry for "ripple effects" when moving one meeting).  
     - **Failure Consequence**: Computational intractability; agents freeze or fail in real-time scenarios.

  2. **Tractability**  
     - **Requirement**: Reasoning must scale polynomially (or better) with world-state complexity.  
     - **Motivation**: Real-world agents (e.g., robots, assistants) operate with finite resources.  
     - **Failure Consequence**: Agents become unusable for non-trivial problems (e.g., calendars with >100 events).

  3. **Minimal Representation**  
     - **Requirement**: Avoid explicitly storing "what doesn't change" (e.g., no frame axioms).  
     - **Motivation**: Explicitly encoding invariants (e.g., "moving Meeting A doesn't alter Meeting B") scales poorly with actions/facts.  
     - **Failure Consequence**: Knowledge base becomes bloated and unmaintainable.

  4. **Dynamic World Compatibility**  
     - **Requirement**: Handle state changes without assuming static world models.  
     - **Motivation**: Real environments change independently of the agent (e.g., new meetings added by others).  
     - **Failure Consequence**: Agents break when the world deviates from their initial model.

  ---

  ### **Extension Desiderata (Domain-Specific Preferences)**  
  *These reflect philosophical/technical tradeoffs. Solutions often prioritize subsets.*

  5. **Qualification Robustness**  
     - **Requirement**: Handle implicit preconditions (e.g., "moving a meeting requires participants to be alive, not in a blackout, etc.").  
     - **Motivation**: The qualification problem: we can't list all preconditions. Humans assume defaults (e.g., "no earthquakes today").  
     - **Preference**: Emphasized by **logical AI** (e.g., nonmonotonic logics).  
     - **Failure Consequence**: Agents overlook critical edge cases (e.g., rescheduling during a power outage).

  6. **Cognitive Fidelity**  
     - **Requirement**: Resemble human-like reasoning (heuristics, context-sensitivity, approximate).  
     - **Motivation**: Explains biological intelligence and avoids "alien" solutions.  
     - **Preference**: Central to **embodied cognition** and **predictive processing**.  
     - **Failure Consequence**: Solutions are computationally optimal but brittle in human contexts (e.g., ignoring social norms).

  7. **Novelty Tolerance**  
     - **Requirement**: Generalize to unseen actions/scenarios without retraining.  
     - **Motivation**: Agents encounter unforeseen events (e.g., a pandemic disrupting travel).  
     - **Preference**: Prioritized by **AGI/symbolic approaches**.  
     - **Failure Consequence**: Agents fail catastrophically outside training distributions.

  8. **Explainability**  
     - **Requirement**: Provide human-understandable justifications for relevance decisions.  
     - **Motivation**: Critical for trust and debugging (e.g., "Why *can't* I move this meeting?").  
     - **Preference**: Valued in **human-in-the-loop systems** (e.g., XAI).  
     - **Failure Consequence**: Agents act as black boxes, limiting adoption.

  ---

  ### **Key Tensions Between Desiderata**  
  *These conflicts reveal why the frame problem is unsolved—and why camps disagree.*

  - **Tractability vs. Qualification Robustness**  
    Handling all preconditions (Qualification Robustness) requires expensive reasoning. Tractability demands approximations/limits.  
    → *Tension*: Nonmonotonic logics (e.g., circumscription) become intractable with complex worlds.  

  - **Cognitive Fidelity vs. Minimal Representation**  
    Humans use messy, context-dependent heuristics; formal systems favor parsimony.  
    → *Tension*: Neural-symbolic hybrids sacrifice elegance for biological plausibility.  

  - **Novelty Tolerance vs. Tractability**  
    Generalizing to novelty requires rich models (e.g., simulations), hurting real-time performance.  
    → *Tension*: Monte Carlo tree search handles novelty but is too slow for calendar management.  

  - **Explainability vs. Cognitive Fidelity**  
    Human-like reasoning (fast, heuristic) is often opaque; explainability demands transparency.  
    → *Tension*: Deep learning (predictive processing) achieves fidelity but not explainability.  

  ---

  ### **How Popular Approaches Fail the Desiderata**  
  *(Non-exhaustive; illustrates tradeoffs)*

  - **Classical Logic (e.g., frame axioms)**  
    ✘ **Minimal Representation**: Explicit frame axioms explode combinatorially.  
    ✘ **Tractability**: NP-hard in dynamic worlds.  

  - **Nonmonotonic Logic (e.g., default logic)**  
    ✘ **Tractability**: Undecidable in worst-case; struggles with scalability.  
    ✘ **Cognitive Fidelity**: Too rigid for human-like reasoning.  

  - **Situated/Embodied AI (e.g., Brooks-style robots)**  
    ✘ **Qualification Robustness**: Fails at hypothetical reasoning (e.g., "what if I move this meeting?").  
    ✘ **Novelty Tolerance**: Limited to sensorimotor contingencies; poor at abstract planning.  

  - **Predictive Processing (e.g., free-energy principle)**  
    ✘ **Explainability**: Bayesian priors are opaque.  
    ✘ **Minimal Representation**: Hierarchical models can be overparameterized.  

  - **Heuristic-Based (e.g., STRIPS planners)**  
    ✘ **Qualification Robustness**: Assumes closed worlds; breaks with unstated preconditions.  
    ✘ **Novelty Tolerance**: Domain-specific heuristics don't generalize.  

  ---

  ### **Conclusion: The Frame Problem Isn't One Problem**  
  The frame problem is a **cluster of challenges** centered on efficient relevance detection. No solution satisfies all desiderata because:  
  1. **Non-negotiable requirements** (1–4) conflict with each other (e.g., tractability vs. dynamic worlds).  
  2. **Extension preferences** (5–8) reflect irreconcilable goals (e.g., cognitive fidelity vs. explainability).  

  **Your practical path forward**: For a calendar agent, prioritize:  
  - **Tractability** (limit checks to time/participant overlaps).  
  - **Minimal Representation** (use temporal logic, not frame axioms).  
  - **Partial Qualification Robustness** (add defaults like "participants are available unless evidence conflicts").  
  Sacrifice **Novelty Tolerance** (assume no pandemics/blackouts) and **Cognitive Fidelity** (use rules, not heuristics).  

  This clarifies why debates appear stalled: **solutions solve different subsets**. The "right" approach depends on which desiderata you value most.
