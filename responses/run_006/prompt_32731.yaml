answer: |-
  You've pinpointed the core tension in interpreting Williams's "one thought too many" argument. Let's break down the architecture, moving beyond the surface to its deeper targets and its relation to the integrity objection:

  1.  **The Surface Target & the "Criterion, Not Decision Procedure" Move:**
      *   **Initial Target:** It *appears* to target consequentialism (especially utilitarianism) as a *decision procedure*. Williams is critiquing the idea that the morally best agent would, in the moment of action, deliberate by calculating overall consequences or explicitly invoking permissibility rules.
      *   **Consequentialist Rebuttal:** As you note, consequentialists can readily say their theory is a *criterion of rightness*, not a *decision procedure*. We use heuristics, emotions, and commitments (like love) as efficient, reliable proxies. The husband saving his wife *because she's his wife* is the *best decision procedure* for achieving the consequentialist good (promoting relationships, emotional bonds, etc.), even if the *justification* ultimately rests on consequences. The thought "it's permissible" need not, and indeed *should* not, enter his head. Case closed?

  2.  **The Deeper Target: The Structure of Moral Justification & the Nature of Relationships:**
      *   Williams's point is that the consequentialist rebuttal **fails to address the core problem**. The objection isn't *just* about conscious deliberation in the moment; it's about **what ultimately grounds the justification of the action** and the **nature of the reasons involved**.
      *   **The Problem of Available Justification:** Even if the husband doesn't consciously think the permissibility thought *in the moment*, the consequentialist framework insists that the *only valid justification* for saving his wife over the stranger *is* that it is, overall, optimific or permissible under a rule that promotes the general good. His love, the relationship itself, are *instruments* to the greater good.
      *   **Corruption of Motive/Relationship:** This background justification fundamentally **changes the character of the reason** "because she's my wife." For Williams:
          *   In a genuine loving relationship, "because she's my wife" is a *sui generis*, *non-instrumental*, *particularistic* reason. It flows directly from the relationship itself; the relationship *constitutes* the reason. Saving her *just is* what loving her requires in that moment.
          *   In the consequentialist framework, "because she's my wife" is merely a *proxy* or *trigger* for acting on the *real* reason: promoting the best overall state of affairs. The relationship is reduced to a *means*.
      *   **The "One Step Removed" & Alienation:** This is the alienation Williams targets. If the husband *knows* (even implicitly) that the *only reason* his act of saving his wife is ultimately justified is because it fits a consequentialist calculus, then his commitment to her is **mediated** by that calculus. He doesn't just love her; he loves her *because* or *insofar as* loving her serves the greater good. This creates a **distance** or **alienation** between the agent and his deepest commitments. He relates to his own love and his wife *through* the lens of impersonal morality. **The "one thought too many" is the symbolic representation of this underlying structural mediation.**

  3.  **Relation to the Integrity Objection:**
      *   **The Integrity Objection (Jim & the Indians):** This argues that utilitarianism can demand an agent abandon their deepest commitments ("ground projects") and personal integrity by forcing them to act in ways fundamentally alien to their core identity (e.g., Jim being asked to kill one Indian to save nineteen).
      *   **"One Thought Too Many" as Illustration & Deepening:** The "one thought" argument is **both an illustration *and* a specific deepening** of the integrity objection, focusing on *personal relationships*.
          *   **Illustration:** It shows *how* utilitarianism alienates agents from their commitments. The husband's love for his wife *is* a core ground project/commitment. The consequentialist framework forces him to see it as contingent on its contribution to the impersonal good.
          *   **Deepening:** It specifically highlights how this alienation operates *within the very structure of reasons* governing intimate relationships. It shows that even when utilitarianism *permits* acting on love, it does so for the *wrong kind of reason* (impersonal), thereby corrupting the *nature* of the love and the relationship itself. The integrity objection focuses on being *forced* to violate commitments; the "one thought" argument shows how the *justification* for *keeping* commitments can undermine their character.

  4.  **What Kind of Theory Does This Rule Out?**
      *   **Primary Target:** Theories that insist **all valid moral reasons must ultimately be reducible to impersonal, impartial, or aggregative considerations** (like maximizing overall good or obeying universal rules that abstract from particular relationships). This primarily targets **act-utilitarianism, rule-utilitarianism, and strongly impartialist forms of deontology** (like some readings of Kantianism that demand abstracting from personal ties).
      *   **What It Suggests:** Williams argues moral theory must make room for **agent-relative reasons** – reasons that arise *specifically* from the agent's own relationships, projects, and history, and which have genuine, non-derivative normative force. He pushes for the **irreducibility of the personal**.

  5.  **Does "One Thought Too Many" Survive the "Criterion, Not Decision Procedure" Move?**
      *   **Yes, decisively.** The consequentialist move successfully defends against the claim that consequentialism is a *bad decision procedure*. However, it **utterly fails** to address Williams's deeper point: that consequentialism, as a *criterion of rightness*, provides the *wrong kind of justification* for actions rooted in personal relationships. It reduces intrinsically personal reasons to instrumental ones within an impersonal framework, thereby alienating the agent from the true source of their motivation and corrupting the nature of the relationship. The *availability* of the consequentialist justification as the ultimate grounding *is* the problem, regardless of whether it's consciously invoked.

  **One-Sentence Summary:** Williams's "one thought too many" primarily targets consequentialism's (and similar impartialist theories') *criterion of rightness*, arguing that its requirement for ultimate impersonal justification alienates agents from the intrinsic, non-instrumental reasons provided by their deepest personal relationships, thereby corrupting both their motives and the relationships themselves.
