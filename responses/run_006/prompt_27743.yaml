prompt: |-
  I'm trying to work out what I actually think about moral worth — when an action reflects well on the agent in the distinctive way that makes us praise the person, not just the deed. Here are my verdicts on a set of cases.

  1. The prudent shopkeeper gives correct change and charges fair prices, but only because honesty is good for business. I don't think his honesty has any moral worth.

  2. The devoted friend visits her sick friend every day because she loves her and can't stand to see her suffer. I think this is morally worthy — as worthy as anything.

  3. The reluctant duty-doer also visits the sick friend, but out of a sense that this particular person's need and their history together make it something he owes her; he finds it exhausting and would rather not go. I think this is morally worthy too.

  4. The self-promoter stays late to help a colleague finish a report purely so the boss will see her as a team player. I don't think this is morally worthy.

  5. The mistaken helper helps someone escape an unjust punishment because he cares about the person, even though he genuinely believes he is doing something wrong. I think this is morally worthy.

  6. The lucky prescriber prescribes a drug because she believes it will cure her patient, and it does cure, and curing is exactly what makes the prescription right — but her belief rests on a misread chart, so she is right only by luck. I don't think this is morally worthy, or at most much less worthy than the same prescription made on sound medical judgment.

  7. The rule-follower helps a neighbor move because it is the right thing to do, full stop; he has no particular concern for this neighbor's needs and, asked what makes helping right, he can only say that it is his duty. I think this is morally worthy, though it leaves me cold.

  The case I keep going back and forth on: someone returns a lost wallet both because it is the right thing to do and because there is a reward; he is confident he would return it even without the reward, and the rightness genuinely moves him, but the reward is also genuinely part of his motivation.

  Is there a single principle that captures my verdicts on 1–7, or close? If not, which principle gets the most of them with the least strain, which verdict does it force me to drop, and what does it say about the wallet case?

  Please respond as a numbered list of exactly five candidate principles, with no introduction or conclusion. Each item should be one or two sentences: state the principle precisely and say which of my verdicts (1–7) it cannot accommodate. Make the fifth item the principle you think I should keep, together with the verdict it forces me to overturn (if any) and its verdict on the wallet case.
reasoning: |-
  Hmm, the user is grappling with moral worth—when an action reflects well on the agent beyond just the deed itself. They've listed seven cases with their judgments and are stuck on a wallet-return case with mixed motives. They want me to propose five candidate principles that fit their verdicts, identify conflicts, and recommend one.

  First, let me map their verdicts: Cases 1 (prudent shopkeeper) and 4 (self-promoter) get no moral worth because motives are self-interested. Cases 2 (devoted friend), 3 (reluctant duty-doer), 5 (mistaken helper), and 7 (rule-follower) all get moral worth despite variations—showing that emotional care, duty, or conviction matter even with wrong beliefs or coldness. Case 6 (lucky prescriber) gets no worth because the right outcome was accidental, not based on good judgment.

  Now, the core tension: They accept both emotional motives (case 2) and duty-based ones (cases 3 and 7), but reject self-interest. The wallet case has dual motives—duty and reward—and they're unsure if the duty part "counts" when mixed.

  For candidate principles, I need to cover key ethical angles:
  - Kantian deontology often focuses on duty for duty's sake.
  - Virtue ethics emphasizes character and care.
  - Hybrid approaches might blend motives or require control over outcomes.

  Principle 1: Moral worth requires acting solely from duty. But this clashes with their verdicts—they praised case 2 (love-based) and case 5 (caring despite wrong belief), which aren't duty-driven. So it fails cases 2 and 5.

  Principle 2: Focuses on care for others as essential. This works for cases 2 and 5 but stumbles on cases 3 and 7, where duty, not care, motivates. They find case 7 "cold" but still worthy, so care isn't necessary for them.

  Principle 3: Allows mixed motives but requires duty as primary. This might handle cases 1–4 well, but case 5 is tricky—the helper acts from care, not duty, and they deem it worthy. Also, case 6's luck issue isn't addressed by motive alone.

  Principle 4: Adds control—moral worth demands acting for the right reasons with non-lucky correctness. This explains case 6 (rejected due to luck) and fits most, but case 5 is a problem: the helper acts for caring reasons but with wrong beliefs, yet they still see worth. Their verdict values motivation over factual accuracy here.

  Principle 5: My recommended hybrid—requires acting for the right-making features (like duty or care) with sufficient control. It covers:
  - Case 1: Motivated by profit, not rightness.
  - Case 2: Motivated by care (a right-making feature).
  - Case 3: Motivated by duty (right-making).
  - Case 4: Self-promotion, not rightness.
  - Case 5: Motivated by care, which is right-making even if misguided.
  - Case 6: Lacks control—right outcome is accidental.
  - Case 7: Motivated by duty, so worthy despite coldness.

  Conflict: Only case 5 might be contested—some argue that if beliefs are wrong, motivation is flawed. But the user explicitly endorsed it, so I'll keep it. For the wallet case, the principle allows moral worth if duty is a genuine motivator, even with a reward, as long as it's not overriding.

  This principle balances their intuitions: It values the why over the what, excludes luck, and accommodates both care and duty. The wallet case gets a thumbs-up if the duty motive is robust.
answer: |-
  1. Moral worth requires acting solely from duty; it conflicts with verdict 2 (devoted friend acts from love, not duty) and verdict 5 (mistaken helper acts from care, not duty).  
  2. Moral worth arises only when motivation includes direct care for others' well-being; it conflicts with verdict 3 (reluctant duty-doer lacks care) and verdict 7 (rule-follower lacks care).  
  3. Moral worth exists if duty is a primary motivation, even with other motives; it conflicts with verdict 5 (mistaken helper lacks duty-based motivation) and struggles with verdict 6 (lucky prescriber's control issue).  
  4. Moral worth requires acting for the right-making features of the action with non-lucky correctness; it conflicts with verdict 5 (mistaken helper acts for wrong features due to false belief).  
  5. Keep: Moral worth requires motivation by the action’s right-making features (e.g., duty, care) with sufficient control over acting for those reasons; it overturns no verdicts (accommodates 1–7) and judges the wallet case as having moral worth if the rightness genuinely motivates.
