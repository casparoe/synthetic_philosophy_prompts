answer: |-
  What you're describing is a **Gettier Case**, named after philosopher Edmund Gettier whose 1963 paper "Is Justified True Belief Knowledge?" shattered the traditional definition of knowledge (as justified true belief, or JTB). Your intuitions are precisely aligned with the core problem he identified.

  Here's the anatomy of a Gettier Case, using your examples:

  1.  **Justification:** The character has seemingly good, rational, evidence-based reasons for believing P.
      *   *Clock:* The clock *appears* functional, shows 3:30, and has historically been reliable.
      *   *Detective:* Fingerprints are compelling forensic evidence linking a suspect to a weapon.
  2.  **Truth:** The belief P is, in fact, true.
      *   *Clock:* It *is* 3:30 PM.
      *   *Detective:* The suspect *did* commit the crime.
  3.  **The Disconnect:** The justification and the truth are **causally disconnected** and **coincidentally converge**. The justification *points* to the truth, but does not *track* or *connect* to it in the right way. The truth obtains *independently* of the evidence used to justify the belief. This disconnect usually involves an element of **veritic luck** (luck regarding the truth of the belief).
      *   *Clock:* The justification (clock display) is causally connected to the clock stopping 12 hours ago, *not* to the current time. The truth (current time) is caused by the Earth's rotation/sun position. They coincide by accident.
      *   *Detective:* The justification (fingerprints) is causally connected to the third party planting them, *not* to the suspect's actual guilt. The truth (suspect's guilt) is caused by the suspect's actions. They coincide by accident (the planter didn't know the suspect was guilty).

  **Why it "Rings Hollow" as Knowledge:** The character "gets it right" not *because* of their justification, but *despite* a flaw in the connection between their justification and the world. Their justification fails to be **truth-conducive** in this specific instance, even though it *appears* sound and usually *is* sound. The truth is accidental relative to the justification.

  **Precise Boundaries:**

  1.  **vs. Lucky Guess:** A lucky guess lacks justification *entirely*. The character has *no* good reasons (e.g., closing their eyes and pointing at a suspect). In a Gettier case, the justification is *present* and often *appears impeccable*; the flaw is hidden and involves the disconnect.
  2.  **vs. False but Close Belief:** The belief must be *true*. If the detective concludes guilt based on planted prints, and the suspect is *innocent* (even if someone else committed the crime), it's simply a false belief based on misleading evidence.
  3.  **vs. Partial Justification:** The justification in a Gettier case is typically *strong enough* that, absent the hidden disconnect/fluke, it *would* constitute good grounds for knowledge. The problem isn't that the justification is weak or incomplete *per se*; it's that it's *defeated* or *undermined* in a hidden, non-apparent way by the actual causal chain leading to the truth. Partial justification implies the evidence itself is insufficient even without a hidden disconnect.
  4.  **vs. Environmental Luck (e.g., Fake Barn County):** This is a *close cousin* and often discussed alongside Gettier cases. Here, the justification *is* causally connected to the truth *in this instance*, but the environment is such that the justification is unreliable *in general*.
      *   *Example:* You see a barn and believe "That's a barn." It *is* a barn. BUT, unbeknownst to you, you're in Fake Barn County where most barn facades are fakes. Your belief is true *this time* and causally connected (you saw the real one), but your perceptual method is unreliable in *this environment*. The disconnect is environmental, not directly between justification and truth *in this instance*.
      *   *Distinction:* In a classic Gettier case (like your clock), the justification *for this specific belief* is disconnected from *its specific truth-maker*, even if the method (checking clocks) is generally reliable. In environmental luck, the justification *for this belief* is connected, but the method is locally unreliable.

  **Competing Terms & Nuances:**

  *   **Gettier Case/Problem:** The most established and widely recognized term for the *general phenomenon* you describe.
  *   **Veritic Luck:** This pinpoints the *type* of luck involved – luck that the belief is true *despite* the disconnect in the justification. Essential to the anatomy. (Duncan Pritchard is a key philosopher on epistemic luck).
  *   **Defeated Justification:** Some analyses argue that in Gettier cases, the justification is actually *defeated* by the hidden fact (e.g., the clock is stopped), even though the agent is unaware of the defeater. The justification is *good* but *overridden*.
  *   **False Lemma:** Some (but not all) Gettier cases involve the agent relying on a *false intermediate belief*.
      *   *Clock:* The agent might implicitly believe "This clock is working" (false lemma) to get from "The clock says 3:30" to "It is 3:30".
      *   *Detective:* The agent might implicitly believe "These fingerprints got here when the suspect touched the weapon during the crime" (false lemma).
      *   *Not Always Necessary:* Some Gettier cases are constructed without a false lemma, relying purely on the causal disconnect.
  *   **Causal Disconnect:** This highlights the core structural feature – the justification and the truth-maker operate on separate causal tracks.

  **Why "Gettier Case" is the Best Fit for Your Purpose:**

  *   It directly names the core philosophical problem you identified: justified true belief that isn't knowledge due to an accidental disconnect.
  *   It encompasses both of your examples perfectly.
  *   It provides a rich conceptual framework (justification, truth, disconnect, veritic luck) for dissecting the anatomy of the situation.
  *   It's the term philosophers and informed readers will recognize.

  **Deploying it Deliberately in Your Writing:**

  1.  **Establish Solid Justification:** Make the character's reasoning genuinely reasonable and evidence-based. The reader should agree: *based on this, I'd believe it too.*
  2.  **Ensure Belief is True:** The character *must* be right about the core fact (the time, the culprit).
  3.  **Engineer the Disconnect:** Create a hidden, independent causal chain for the *truth* and a flaw or coincidence that severs the connection between the *justification* and that truth-chain. Veritic luck is key.
  4.  **Exploit the Dramatic Irony:** The reader might know the disconnect exists before the character does, creating tension. Or the character discovers it later, leading to the rich dramatic consequences you mentioned (existential doubt about past successes, disillusionment with reason itself despite a "good record").
  5.  **Focus on the Reckoning:** The true drama lies in the character's *reaction* to discovering the Gettier structure – the realization that their confidence was unwarranted *in that instance*, even though they were "right."

  Your instinct that philosophers have carved this space is spot on. The concept of the **Gettier case** gives you the precise vocabulary and anatomical understanding to explore the fascinating, unsettling territory of being "right for the wrong reasons" with justified confidence. It's a powerful tool for exploring themes of luck, the fragility of knowledge, confidence, and the difference between being right and *knowing*. Good luck with your novel!
