prompt: |-
  I'm a product manager at a tech company. I keep hearing about the dollar auction and escalation of commitment from a mate who did game theory, and it sounds spookily like what happens when we keep pouring engineering time into a feature that's flatlining on every A/B test. Restate the dollar auction and the escalation of commitment problem in the vocabulary I actually use day to day — A/B tests, KPIs, OKRs, sprint commitments, sunk cost reasoning in roadmaps, kill criteria — as faithfully as you can. Then give me the residue report: which bits of the game-theoretic story map cleanly onto product decisions, which bits you had to fudge or stretch, and whether anything in the economists' analysis has no counterpart in how we actually make (or rationalise) these decisions. I want to know whether the game theory is genuinely adding something I can't already say in PM-speak, or whether it's just a fancier way of describing what we already know.
reasoning: |-
  Okay, let me break this down. The user is a product manager dealing with a classic sunk cost trap in tech development, framed through game theory concepts like the dollar auction and escalation of commitment. They want this translated into product management terms they use daily - A/B tests, KPIs, OKRs etc. - plus a clear assessment of where the game theory models actually add value versus just rebranding existing knowledge.

  First I need to accurately restate the dollar auction mechanics in product vocabulary. The core is the bidding war where losers keep doubling down to avoid admitting failure. That maps neatly to features that keep missing targets but get more resources thrown at them because "we've already invested so much". The sunk cost fallacy is central here - the roadmap equivalent of bidding $0.95 to "salvage" previous investments. 

  For escalation of commitment, it's about the psychological trap where each sprint commitment becomes a psychological barrier to killing the feature. The key PM concepts to map here are: vanity metrics distracting from core KPIs, moving goalposts on success criteria, and especially the absence of pre-defined kill switches in OKRs. 

  Now for the residue report - where the mapping works cleanly versus where it stretches:
  Clean fits include the sunk cost death spiral (identical to bidding past $1), the social pressure dynamics (team reputations = auction audience pressure), and the information asymmetry (auctioneer hiding bids ≈ teams hiding bad metrics). 

  But there are friction points: Real product development has off-ramps the model ignores (pivots, scope changes), and game theory assumes pure rationality where PMs face emotional/political factors. The biggest gap is that auctions have one winner while product failures often have collective denial. 

  The unique value add from game theory is threefold: 
  1) It quantifies the trap mathematically (showing how early small bets create later big losses) 
  2) The "auction" framing makes social pressures visible in a way sprint retrospectives often miss 
  3) It proves the failure is systemic not just individual - which is crucial for fixing processes rather than blaming PMs.

  What the user probably needs most isn't just the translation, but ammunition to change processes - like requiring "kill criteria" in every OKR. That's where the model delivers something beyond PM jargon: it provides an irrefutable logical structure showing why those process fixes aren't optional.
answer: |-
  Here's the translation you requested, followed by the residue report on how game theory maps to product reality:

  ---

  ### **The Dollar Auction in Product Management Vocabulary**
  1.  **Initial Bet:** You allocate 1 sprint to build Feature X targeting a 3% lift on Core KPI Y. Success criteria are predefined (e.g., stat-sig positive A/B test after 2 weeks).
  2.  **Early "Bidding" (Investment):** The M1 A/B test shows -1% impact. The team rationalizes: "Needs refinement. Let's commit 1 more sprint to improve onboarding."
  3.  **Escalation:** M2 test shows +0.5% (not stat-sig). Stakeholders pressure: "We've invested 2 sprints! We can't stop now. Maybe tweak the algo?" Another sprint is committed.
  4.  **The Trap:** M3 test is flat. Now the logic shifts: *"If we kill it, 3 sprints are wasted and we miss our OKR. But if we invest 1 more sprint to *fix* it, maybe we salvage the investment and hit target."*
  5.  **Lose-Lose Outcome:** After 5 sprints and negative ROI, the feature ships anyway to "validate the effort." Core KPIs don't budge. Engineering time is sunk, backlog suffers, and the team avoids setting "kill criteria" for the next feature.

  ### **Escalation of Commitment in Roadmap Terms**
  - **Sunk Cost Driving Decisions:** "We've spent 6 months on this – sunsetting it now would crater our portfolio ROI metrics."
  - **KPI Pivot:** Original goal (e.g., user retention) isn’t moving, so success is redefined: "It drives engagement among Power Users!" (a vanity metric).
  - **Goalpost Shifting:** "We didn’t hit the OKR because of market conditions. Give us 2 more quarters."
  - **Social Pressure:** "Team A shipped their big feature. If we kill ours, leadership will question our execution."
  - **Kill Criteria Ignored:** Predefined metrics for termination (e.g., "<5% retention lift after M1") are dismissed as "too early to judge."

  ---

  ### **Residue Report: Mapping Game Theory to Product Reality**

  | **Game Theory Concept**         | **Clean Product Mapping**                                                                 | **Fudged/Stretched Mapping**                                                                 | **No Clear Counterpart**                          |
  | :------------------------------ | :---------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------- | :------------------------------------------------ |
  | **Auction "Bids"**              | Sprint commitments, engineering months, opportunity cost.                                  | *Clean:* Each "bid" is a discrete resource increment (sprint).                               | –                                                 |
  | **Winning = Losing**            | Shipping a feature that consumed 10x its value in resources.                               | *Clean:* Negative ROI despite "winning" (launching).                                         | –                                                 |
  | **Sunk Cost Fallacy**           | Roadmap justifications like "We can't waste prior investment."                             | *Clean:* Identical reasoning patterns.                                                       | –                                                 |
  | **Information Asymmetry**       | Hiding negative A/B tests, downplaying bad metrics in reviews.                             | *Stretched:* Unlike auctions, data *exists* but is rationalized away.                         | –                                                 |
  | **Audience Effect**             | Stakeholder pressure, peer team comparisons, leadership expectations.                      | *Clean:* Social shaming/status drives escalation.                                             | –                                                 |
  | **The $1 Prize**                | Original KPI target (e.g., +5% conversion).                                                | *Stretched:* KPIs evolve; the "prize" gets redefined mid-process.                             | –                                                 |
  | **Rational Actor Assumption**   | PMs/engineers weighing costs vs. benefits.                                                 | **Fudged:** Game theory ignores emotional/political factors (e.g., fear of blame, empire-building). | Political capital, career risk, ego.              |
  | **Single Winner**               | Only one auction winner.                                                                   | **No Counterpart:** In products, *everyone* loses (wasted resources, lost trust, opportunity cost). | Collective failure state.                         |
  | **Fixed Rules**                 | Clear auction mechanics.                                                                   | **No Counterpart:** Product "rules" (kill criteria) are fluid and often unenforced.           | Governance gaps in decision processes.            |
  | **Zero-Sum Dynamics**           | Auction losers gain nothing.                                                               | **Stretched:** Product failures aren't zero-sum; they actively *harm* the org (morale, velocity). | Compound organizational damage.                   |

  ---

  ### **Does Game Theory Add Unique Value?**
  **Yes, but selectively:**
  1.  **Quantifies the Trap:** Shows mathematically why small initial bets lead to catastrophic losses (e.g., "Spending $0.95 to avoid wasting $0.90" is irrational *before* you bid). This exposes sunk cost reasoning *before* it feels intuitive.
  2.  **Highlights Social Mechanics:** The "audience effect" model makes visible how team/leader dynamics (not just data) drive escalation – a blind spot in pure KPI discourse.
  3.  **Proves Structural Failure:** It’s not just "bad judgment" – the system *incentivizes* escalation. Fixes require process changes (e.g., mandatory kill criteria), not just "better decisions."
  4.  **Forces Pre-Commitment:** The model’s rigor makes airtight cases for binding kill switches *before* work starts.

  **What It Doesn't Add:**
  - **Political Realities:** Game theory can't model a VP staking their reputation on a feature.
  - **Pivot Potential:** Unlike auctions, features *can* morph into valuable things (rare, but possible).
  - **Innovation Uncertainty:** Early flat A/B tests *might* signal a slow-burn winner (e.g., network effects). Game theory assumes known values.

  ---

  ### **Actionable Insight**
  **Use game theory to install anti-escalation circuitry:**
  - **Pre-Mortems:** "If this A/B test misses by X%, we kill it – no debate."
  - **Escrow Resources:** Allocate only 30% of estimated effort upfront. Require checkpoint approvals for more.
  - **Counter-Metrics:** Define not just success KPIs, but *harm metrics* (e.g., "If support tickets increase >10%, we sunset").
  - **Third-Party Audits:** Have neutral teams review continuation requests to bypass social pressure.

  Game theory isn't just jargon – it's an X-ray showing *why* your existing processes hemorrhage resources on lost causes. The unique value is in designing **decision protocols** that override human+organizational bias.
