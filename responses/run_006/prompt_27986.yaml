prompt: |-
  I teach a course that includes a unit on Buddhist ethics, and every time I teach it I realize I dont actually know what I think about whether Buddhist ethics is a form of consequentialism. My gut verdicts on cases are all over the place, and I'd like you to help me reverse-engineer whatever principle I seem to be tracking, if there is one.

  Here are the cases. (1) I lie to a would-be murderer about where my friend is hiding. I think that's not just allowed but required, and a Buddhist who refused would be fetishizing the precept. (2) I tell a dying woman that her estranged son called to say he forgives her, when he didn't. I think that's wrong, even though it would give her peace. (3) In a standard trolley case I can flip a switch to kill one stranger and save five. I think I should flip it, though I feel the weight of the one. (4) A doctor gives a terminal patient a lethal dose at her request to end her suffering. I think that's wrong, though the doctor's motive is plainly compassion. (5) In the story about the bodhisattva sea captain who kills the would-be mass murderer to save the five hundred merchants on board, I think the captain does something admirable, not merely excusable. (6) I tell a student her paper is good when it isn't, just to keep her confidence up. I think that's wrong, but small, and I'd do it again tomorrow.

  I can't find a single principle that gets all six. The pair (3) and (4) already looks hard to reconcile — both kill one innocent person to prevent suffering, but I approve of one and not the other — and then (5) seems like it should group with (4), because the killing is the means rather than a side effect, yet I want to call it admirable. Maybe the principle is something like "the precepts are training rules that give way to compassion, except when the act uses someone as a mere means," but I'm not sure that survives the cases either. So here's what I want. Try to state, precisely, the principle or small set of principles that best fits my verdicts, and be honest about which of them it can't accommodate — I'd rather overturn a verdict than keep a gerrymandered rule. And then apply it to the case I keep vacillating on: I've promised a colleague I'll attend her talk, an old friend shows up in crisis, and I skip the talk and lie about why.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They teach Buddhist ethics and are struggling with whether it's a form of consequentialism. They've provided six cases with their intuitive judgments, and they can't find a consistent principle. My task is to reverse-engineer a principle that fits most of their verdicts, point out where it fails, and apply it to a new case they're unsure about.

  First, I need to look at each case and identify patterns. Case 1: lying to save a life is required. Case 2: lying to comfort a dying woman is wrong. Why the difference? Both involve deception for a good outcome, but maybe the difference is in the nature of the harm prevented or the agency involved. In Case 1, the lie prevents direct harm by a murderer. In Case 2, the lie might deny the woman a chance to face reality or involve creating a false narrative that uses deception as a means.

  Case 3: flipping the trolley switch is okay. Case 4: euthanasia is wrong. Both involve killing one to save others or prevent suffering. The distinction here might be between allowing death versus actively causing it, or perhaps the immediacy of the threat. Trolley is an emergency where death is imminent and the action redirects existing harm. Euthanasia is a deliberate act to end life, even if compassionate.

  Case 5: the sea captain killing the murderer is admirable. This is similar to the trolley but more direct—killing as a means. Yet the user approves. Why? Maybe because the captain's action is driven by compassion and prevents greater harm, and the victim is a would-be murderer, not innocent. So the moral status of the victim could matter.

  Case 6: lying to boost a student's confidence is wrong but minor. Here, the harm prevented is less severe, and the lie might undermine trust or the student's growth. So the severity of the outcome and the potential for long-term negative effects might be factors.

  Putting this together, I need to find principles that accommodate these judgments. The user mentioned "precepts as training rules that give way to compassion, except when using someone as a mere means." Let me test that. In Case 5, the sea captain uses the murderer as a means to save others, yet the user approves. That contradicts the mere means exception. So maybe the victim's moral culpability matters. The murderer is not an innocent, so using them as a means is permissible. In Case 4, the patient is innocent, so euthanasia uses them as a means to end suffering. That could explain the disapproval.

  But in the trolley case (3), the one killed is innocent, but it's permissible. The difference might be that trolley involves indirect harm (side effect) while euthanasia is direct. The sea captain is direct but against a culpable person. So perhaps the rule involves intent, agency, and moral status of the victim.

  Looking at compassion: in all cases, the actor has compassionate motives, but outcomes differ. The key might be whether the action respects the individual's journey or causes direct harm. Euthanasia directly ends a life, cutting short the natural process, whereas the trolley redirects an existing threat. Lying to the dying woman might deny her a chance to reconcile authentically, while lying to the murderer doesn't harm his moral growth.

  So possible principles: 

  1. **Severity of Harm Prevented**: Only override precepts when preventing severe, immediate harm (like death).
  2. **Agency and Means**: Avoid direct harm to innocents; indirect harm might be permissible. Direct harm to culpable parties could be allowed.
  3. **Truth and Instrumentality**: Lying is wrong when it manipulates or denies someone's reality, especially in personal growth contexts.
  4. **Compassion vs. Paternalism**: Acts that override autonomy under false pretenses are problematic, as in Case 2 and 6.

  Testing these: Case 1 prevents immediate harm, so lying okay. Case 2: comfort lie doesn't prevent immediate harm, and denies autonomy, so wrong. Case 3: prevents greater harm indirectly, permissible. Case 4: direct killing of innocent, wrong. Case 5: killing a culpable person to prevent mass murder, admirable. Case 6: lying for confidence undermines growth, wrong.

  The new case: skipping a talk to help a friend in crisis and lying about why. The harm prevented is emotional distress for the friend, but the lie is to a colleague. Severity might not be as high as life-threatening. The lie could damage trust with the colleague. The user might see helping the friend as compassionate, but the lie as problematic because it's not necessary—could they tell the truth later? Applying the principles: preventing harm to the friend is important, but lying to the colleague might be using her as a means to avoid discomfort. The lie isn't preventing severe harm, so it's more like Case 6—minor wrong.

  But the user vacillates here. Maybe because the crisis is urgent, making the harm more severe. If the friend is suicidal, that changes things. Without that, the lie seems unjustified. The principle would suggest telling the truth to the colleague afterward to mitigate the lie's harm.
answer: |-
  Based on your intuitive verdicts across all six cases, I propose a unified ethical framework with two core principles and one meta-principle. This framework prioritizes **compassionate harm-reduction** but imposes strict limits based on **agency, truth-manipulation, and the moral status of those affected**. Crucially, it rejects pure consequentialism by emphasizing *how* outcomes are achieved rather than just the net benefit. Here's the reconstruction:

  ### The Proposed Principles
  1. **Compassionate Harm-Prevention Principle (CHPP):**  
     *It is permissible (or obligatory) to violate a precept when:*  
     a) The act prevents **severe, imminent, and irreversible harm** (e.g., death, extreme suffering),  
     b) Motivated by genuine compassion (karuṇā),  
     c) The act minimizes direct causal responsibility for harm (e.g., redirecting existing forces > creating new harm),  
     d) *And* the act does not instrumentalize an **innocent person’s agency or reality**.  

  2. **Truth/Agency Protection Principle (TAPP):**  
     *It is impermissible to violate a precept when:*  
     a) The act directly **manipulates or undermines a person’s capacity for moral/psychological growth** (e.g., deceiving someone about a truth central to their karmic reckoning),  
     b) *Or* the act uses an **innocent person as a means** (e.g., killing/intentionally harming them for a "greater good").  

  3. **Meta-Principle: Precepts as Skillful Guides (PSG):**  
     *Precepts are default rules for reducing suffering, but they yield to CHPP when harm is severe. However, CHPP is constrained by TAPP—compassion cannot override respect for a person’s journey toward awakening.*

  ---

  ### Application to Your Cases
  | Case | Your Verdict | Principle Applied | Consistency |
  |------|--------------|-------------------|------------|
  | **(1) Lie to murderer** | Required | **CHPP applies:** Prevents severe/imminent harm (death). Murderer isn’t "innocent" (TAPP not triggered). Lying doesn’t undermine *their* growth (may even protect it). | ✓ Perfect fit |
  | **(2) Lie to dying woman** | Wrong | **TAPP applies:** Robs her of agency in reconciling her karma (truth about forgiveness is central to her deathbed reckoning). Harm prevented (emotional distress) isn’t "irreversible" like death. | ✓ Perfect fit |
  | **(3) Trolley switch** | Should flip | **CHPP applies:** Redirects existing harm (minimizes direct causation). Prevents severe/imminent harm (5 deaths). The one killed isn’t *used as a means* (side effect, not target). | ✓ Strong fit |
  | **(4) Euthanasia** | Wrong | **TAPP applies:** Uses the *patient* (innocent) as a means to end suffering. Actively *causes* harm rather than redirecting it. Undermines her agency in facing death naturally. | ✓ Strong fit |
  | **(5) Sea captain** | Admirable | **CHPP overrides TAPP:** Would-be murderer isn’t "innocent" (TAPP doesn’t protect him). Killing prevents massive harm and is compassionate. Direct causation is justified by the attacker’s moral status. | ✓ Fit (key: target’s culpability) |
  | **(6) Lie to student** | Wrong but minor | **TAPP applies:** Undermines student’s growth (she can’t improve without truth). Harm prevented (lost confidence) isn’t "severe" (CHPP threshold unmet). PSG: Precept against lying holds, but minor violation. | ✓ Perfect fit |

  ---

  ### Inconsistencies & Tensions
  - **Tension between (3), (4), and (5):**  
    Your approval of killing in (3) and (5) but not (4) hinges on **two factors**:  
    - **Moral status of the affected person:** Killing innocents (trolley victim, patient) is worse than killing culpable agents (murderer).  
    - **Directness of harm:** Actively causing death (euthanasia, sea captain) vs. allowing/redirecting it (trolley). Yet you excuse the sea captain’s *direct* killing because the target is culpable.  
    - *Admitted tension:* CHPP + TAPP *mostly* resolves this, but the sea captain case **(5)** slightly strains the "direct causation" clause in CHPP. Your verdict suggests **culpability of the victim** can override directness concerns.  

  - **Gerrymandering Risk:**  
    The framework avoids it by making culpability and agency central. If you revised (4) to approve euthanasia, CHPP alone would suffice—but your rejection of (4) suggests TAPP is non-negotiable for innocents.  

  ---

  ### Application to Your Vacillating Case
  **Scenario:** *You skip a colleague’s talk (breaking a promise) to help an old friend in crisis, then lie about why.*  

  #### Analysis Using Principles  
  - **Skipping the talk (broken promise):**  
    - **CHPP likely applies:** Helping a friend in crisis prevents "severe" harm (e.g., emotional breakdown, self-harm). Crisis is "imminent," and your intervention could be "irreversible" support.  
    - **PSG:** Promises are precept-like but yield to compassion for severe harm.  
    - → **Verdict: Permissible, possibly obligatory.**  

  - **Lying about why:**  
    - **CHPP test:** Does the lie prevent severe harm? If the truth (e.g., "I helped a friend") risks no severe harm (e.g., colleague is understanding), CHPP fails.  
    - **TAPP test:** Lying manipulates the colleague’s reality—they can’t fairly assess your reliability or recalibrate trust. Harm to them (mild betrayal) isn’t severe, but it *instrumentalizes them* to avoid awkwardness.  
    - → **Verdict: Wrong, but minor** (like Case 6). Compassion for your friend doesn’t justify lying to the colleague.  

  #### Final Judgment  
  - **Skipping talk:** Justified under CHPP (prevents greater harm).  
  - **Lying:** Wrong under TAPP (unnecessary manipulation; not severe-harm prevention). Better to apologize truthfully later.  
  - **Your likely intuition:** You feel skipping is right but lying is "dirty." Principles explain this: helping friend meets CHPP; lying fails both CHPP (no severe harm prevented) and TAPP (undermines colleague’s agency).  

  ---

  ### Conclusion: Is This Buddhist Consequentialism?  
  **No—it’s a hybrid framework.** It uses consequentialist elements (assessing harm severity) but deontological constraints (TAPP’s focus on agency/truth). This mirrors Buddhist ethics’ emphasis on *both* outcomes (suffering reduction) and intention/mindfulness (*cetanā*). Your instincts align with a Mahāyāna "skillful means" approach: rules bend to compassion, but not at the cost of violating a person’s path to awakening.  

  If any verdict feels "off" (e.g., you rethink euthanasia), we could relax TAPP—but your cases suggest it’s core to your intuition. Would you discard TAPP to approve (2) or (4)? If not, the framework holds.
