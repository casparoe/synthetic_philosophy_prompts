  We are given the terms of the "Pasadena note": 
  - A fair coin is tossed until the first heads on toss n.
  - The payoff is (-1)^(n-1) * (2^n / n) dollars.
  - The university receives a fixed fee of $0.90 per note, and the position is 10,000 notes.

  The mathematical facts:
  - The series in the natural order: sum_{n=1}^{∞} [ (-1)^{n-1} * (2^n / n) * (1/2)^n ] 
    = sum_{n=1}^{∞} [ (-1)^{n-1} * (1/n) ] 
    = ln(2) ≈ 0.693.
  But note: the probability of the first heads on the n-th toss is (1/2)^n. Therefore, the expected payoff in the natural order is the alternating harmonic series, which converges conditionally to ln(2). However, the series of absolute values diverges (harmonic series). Therefore, the expectation is not absolutely convergent, meaning that rearranging the terms can change the sum (by the Riemann rearrangement theorem). This is why we say the expectation does not exist in the standard (Lebesgue) sense.

  Committee views:
  1. Accept: because the natural order gives ln(2) ≈ 0.693, so with a fee of $0.90, the total expected value per note is 0.90 + 0.693 = $1.593, which is positive.
  2. Reject: because the expectation is undefined, and a fiduciary cannot enter a contract without a well-defined expected value.
  3. Accept only with a cap on the maximum payment, which would make the expectation well-defined.

  My task: draft a short written opinion recommending one concrete course of action with a time frame, giving reasons, and engaging with the losing side's strongest argument.

  Approach:
  - I must separate settled from contested claims.
  - When relying on a particular decision rule for undefined expectations, flag it and name the main alternative.

  Settled claims (established and not disputed among experts):
  1. The series for the expected payoff in the natural order (i.e., in the order of n=1,2,3,...) converges to ln(2) ≈ $0.693.
  2. The series is not absolutely convergent (because the harmonic series diverges).
  3. Therefore, in the Lebesgue sense (which requires absolute convergence for the expectation to be defined unconditionally), the expectation does not exist.
  4. The Riemann rearrangement theorem shows that by reordering the terms, one can make the series converge to any real number, or diverge.

  Contested claims (genuinely disputed):
  1. How to make decisions when the expectation is not defined in the Lebesgue sense? 
     - One view (which I will rely on): We should use the natural order of events (i.e., the order of n) to compute the expected value. This is sometimes called the "principal value" or "Cauchy principal value" approach. The natural order is the order in which the events occur (by the number of tosses) and is the most intuitive ordering. This leads to an expected value of ln(2).
     - Alternative view: Without absolute convergence, the expectation is undefined and no decision should be made on the basis of a conditionally convergent series because the actual result could be manipulated (by rearranging the terms) or because the law of large numbers might not hold.

  Engagement with the losing side:
  The strongest argument for rejection is that a fiduciary must have a well-defined expectation to assess the risk. Without it, we cannot be sure of the long-run average and the position could expose the university to unbounded losses in a way that is not captured by the natural order calculation.

  Recommendation:
  I recommend accepting the counterparty's offer of 10,000 notes with the fixed fee of $0.90 per note, provided that we can complete the transaction within 30 days. However, to address the concerns of the committee, I propose that we negotiate a cap on the maximum payment in either direction (for each note) to make the expectation absolutely convergent. This cap would be set at a sufficiently high level (e.g., $1,000,000 per note) so that it is extremely unlikely to be reached, but it would technically bound the loss and make the expectation well-defined in the Lebesgue sense.

  Why this recommendation?
  - Without a cap, the natural order calculation gives a positive expected value of about $1.593 per note (0.90 + 0.693). This is a strong reason to accept.
  - However, to alleviate the fiduciary concern and to make the expectation unambiguously defined, we cap the maximum payment. This cap would be set so high that the probability of reaching it is negligible (e.g., for n such that 2^n/n > 1e6, which is around n=40, the probability is 1/2^40, which is about 1e-12, so for 10,000 notes, the probability of any note hitting the cap is about 1e-8 per note, which is negligible). 
  - The cap would make the series absolutely convergent because beyond the cap, the terms become zero. Therefore, the expectation would be well-defined and close to ln(2) (with a negligible adjustment for the capped terms).

  Thus, we satisfy the third group's condition while still capturing the positive expected value.

  Time frame: We should act within 30 days to settle the transaction as per the counterparty's proposal.

