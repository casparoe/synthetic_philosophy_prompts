  Now, the memo:

  ---

  **MEMORANDUM**

  **To:** Investment Advisory Committee  
  **From:** [Your Name], Graduate Representative  
  **Date:** [Date]  
  **Subject:** Recommendation on the Pasadena Note Proposal  

  The committee has reviewed the proposed Pasadena note, which offers a fixed fee of $0.90 per note in exchange for accepting a payoff contingent on the outcome of a series of coin tosses. After careful consideration of the mathematical properties and the fiduciary implications, I recommend accepting the counterparty's offer for 10,000 notes, subject to negotiating a cap on the maximum payment in either direction per note, within the proposed 30-day settlement period. My reasoning follows.

  ### Settled Mathematical Facts
  1. When summed in the natural order (by the number of tosses, n), the expected payoff per note converges to approximately $0.693 (ln 2).
  2. However, the expectation is not defined in the standard (Lebesgue) sense because the series of absolute values diverges. This means that rearranging the order of summation could yield any real number or cause divergence.
  3. Without modification, the contract exposes the university to theoretically unbounded gains and losses, though the probabilities of extreme outcomes decay exponentially.

  ### Contested Decision-Theoretic Ground
  The core disagreement concerns how to handle the undefined expectation. I rely on the view that the natural order of events (by n) provides the appropriate expected value for decision-making, leading to an expected net gain of $1.593 per note ($0.90 fee + $0.693 expected payoff). This approach is justified by the principle that the natural ordering of states (by the sequence of coin tosses) reflects the physical progression of the experiment. 

  However, I acknowledge the alternative view, which holds that any conditionally convergent series is too unstable for rational decision-making. Proponents of this view argue that because rearrangements can alter the sum, the expectation must be considered undefined, and fiduciaries should reject the contract absent modification. This position is grounded in a strict interpretation of the Lebesgue integral as the definition of expectation and in concerns about the law of large numbers for such payoffs.

  ### The Strongest Consideration for Rejection
  The losing side’s strongest argument is that fiduciary duty requires a well-defined expectation to assess risk. Without absolute convergence, the long-run average outcome is not guaranteed to converge to the natural-order sum, potentially exposing the university to unforeseen losses that are not captured by the ln 2 calculation.

  ### Recommendation and Mitigating Conditions
  I recommend acceptance, but **only if the counterparty agrees to a cap on the absolute value of the payoff per note** (e.g., $1,000,000). This cap:
  - Makes the expectation well-defined (Lebesgue integrable) by bounding the payoffs, ensuring absolute convergence.
  - Has negligible financial impact (the probability of exceeding the cap is less than 1 in a trillion per note) so the expected value remains approximately $0.693.
  - Satisfies fiduciary concerns by eliminating tail risk and providing a clear expected value.

  Without a cap, the committee would face a genuine contest between two defensible decision rules. With a cap, we resolve the ambiguity, define the expectation, and capture a positive expected net value. I propose that we authorize the Chair to negotiate this cap immediately, aiming for settlement within 30 days.

  ---

  This memo provides a clear recommendation with a time frame, addresses the strongest counterargument, and proposes a practical amendment to resolve the controversy.
