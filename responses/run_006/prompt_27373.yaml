  First, I need to understand the core of this philosophical dispute. Evolutionary debunking arguments claim that since evolution shaped human moral judgments for adaptive reasons rather than truth-tracking, this undermines moral realism. Moral realists counter that evolution could still have produced truth-tracking capacities. The collaboration should crystallize agreements, disagreements, and testable cruxes without false consensus.

  For Part 1 (Agreements), I'll identify substantive common ground beyond platitudes. Key points include: both accept that if evolution explains moral judgments independently of moral facts, realism is threatened; they agree on the burden of proof for debunking arguments; they acknowledge evolutionary psychology's varying explanatory power across moral domains (e.g., better at explaining kin-based norms than abstract fairness); and they isolate a verbal dispute about "sensitivity" versus "safety" in epistemology.

  Part 2 (Disagreements Table) requires sharp phrasing that each side would endorse. The three core questions are: 1) Evolutionary insensitivity - whether adaptive pressures would produce similar judgments regardless of moral facts; 2) Third-factor viability - whether shared evolutionary goals (like social cooperation) can guarantee truth-tracking for thick moral concepts; 3) Epistemic overgeneralization - whether the debunker's principle would also undermine perception/math if applied consistently. Each answer must ring true to the respective positions.

  Part 3 (Cruxes) needs testable hinge questions. For third-factor scope, I'll propose a thought experiment about whether harm-avoidance mechanisms would track moral truth even in radically different social species. For the parallel problem to antirealism, I'll design a case about whether evolutionary explanations presuppose moral truth in evaluating adaptive success. Both sides will commit to predictions: the Realist expects third factors to extend to novel moral dilemmas, while the Debunker predicts they'll break down; the Realist thinks antirealism faces self-undermining, while the Debunker denies this.

  The challenge is balancing precision with neutrality - no strawmen, no false compromises. Since the user is an expert, terminology can be technical but must remain self-contained. I'll avoid citations per instructions, focusing purely on conceptual structure. The final document should map the battlefield so clearly that any metaethicist sees exactly where clashes persist.
answer: |-
  ## Joint Statement: Adversarial Collaboration on Evolutionary Debunking Arguments and Robust Moral Realism

  **Preamble:** We, the undersigned proponents of evolutionary debunking arguments against moral realism (Debunker) and defenders of robust moral realism (Realist), present this statement following sustained, good-faith collaboration. We seek to clarify points of agreement, precisely characterize persistent disagreements, and identify the key testable issues (“cruxes”) whose resolution would significantly advance the debate. This statement reflects constructive engagement and avoids unearned concessions. Our goal is a map of the dialectical landscape, not a resolution.

  **Part 1: Substantive Agreements**

  1.  **The Core Threat:** For an evolutionary debunking argument (EDA) to succeed against robust moral realism, it must establish that the best evolutionary explanations of the *content* and *causal origins* of human moral judgments render those judgments *epistemically defective* in a way that precludes them from reliably tracking stance-independent moral facts.
  2.  **The Realist's Burden:** To successfully rebut a strong EDA, the realist must provide a plausible explanation for a *non-accidental correlation* between the processes generating our moral judgments and the stance-independent moral facts. Mere logical possibility is insufficient; a positive account of reliability is required.
  3.  **Explanatory Scope of Evolutionary Accounts:** Evolutionary psychology and anthropology provide strong, well-supported explanations for the origin and prevalence of core moral judgments concerning *kin-altruism, in-group loyalty, harm avoidance within the group, and reciprocal fairness within known cooperators*. The evidence is significantly weaker for explaining the origin, stability, and cross-cultural resonance of specific judgments regarding *obligations to distant strangers, abstract principles of justice divorced from reciprocity, the intrinsic value of non-sentient entities, or highly culturally specific thick moral concepts*.
  4.  **Conditional Consequence:** If the Debunker successfully establishes that the evolutionary origins of our moral faculties make it highly probable that we would hold the moral judgments we do *even if the moral facts were substantially different* (or if there were no moral facts at all), and if the Realist cannot provide a compelling alternative account of reliability (e.g., via a "third factor"), then robust moral realism is epistemically undermined for the affected range of judgments.
  5.  **Verbal Dispute:** Part of the disagreement concerning the relevant epistemic principle (e.g., "sensitivity" vs. "safety") is potentially verbal. Both sides agree that *some* principle requiring a non-accidental connection between belief-forming process and truth is necessary for justified belief. The core substantive dispute is whether the evolutionary origins of moral judgment *in fact* violate the correct epistemic principle applied to the moral domain, not merely the label for that principle. The debate centers on the nature of the connection guaranteed (or not) by evolution.

  **Part 2: Disagreements Table**

  | Neutral Question                                                                 | Debunker's Position                                                                                                 | Realist's Position                                                                                                                                 |
  | :------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Evolutionary Insensitivity:** Would the adaptive pressures shaping human moral psychology have produced largely the same *core* moral judgments (e.g., concerning kin, in-group, reciprocity, harm) even if the stance-independent moral facts had been substantially different? | **Yes.** Natural selection optimized moral judgments for fitness (survival and reproduction within ancestral environments), not for tracking moral truth. The same adaptive pressures would have shaped functionally identical judgments regardless of the underlying moral facts (or their absence). | **Not Necessarily.** Adaptive pressures plausibly selected for cognitive capacities attuned to genuine, objective features of social cooperation and flourishing – the very features that constitute moral facts (or are reliably connected to them). Different moral facts might have led to different adaptive pressures and thus different judgments. |
  | **2. Third-Factor Viability:** Can a "third factor" (e.g., the evolutionary value of cooperation, well-being, or social stability) successfully explain a non-accidental correlation between our evolved moral judgment-forming faculties and stance-independent moral truth? | **No, or Only Very Narrowly.** Third-factor explanations either collapse into explaining why we hold *useful* beliefs, not *true* ones, or they succeed only for the most basic "thin" norms (e.g., minimal harm avoidance within kin-group). They fail for "thicker" or more abstract moral judgments (e.g., fairness beyond tit-for-tat, obligations to strangers, intrinsic rights, specific deontic constraints), where the link to the posited third factor is too contingent or disputed. | **Yes, Robustly.** Evolutionary pressures selected for traits enabling complex social cooperation and individual/group flourishing. These traits include cognitive capacities sensitive to objective, stance-independent moral facts *because* those facts supervene on or are constituted by the very features (e.g., well-being, agential capacities, requirements for stable cooperation) that conferred fitness advantages. This extends plausibly to thick judgments rooted in these fundamentals. |
  | **3. Epistemic Principle Containment:** Can the epistemic principle underlying the EDA (e.g., unreliability due to causal insensitivity to the relevant facts) be restricted to the moral domain without also undermining justified belief in perceptual truths, mathematical truths, or the reliability of induction? | **Yes.** Perceptual and cognitive faculties evolved to track mind-independent physical and logical/mathematical structures *crucial for basic survival and navigation*. Moral judgments, however, evolved to regulate social behavior for fitness; the selective pressures are distinct and plausibly insensitive to distinctively *moral* truth. Induction is a precondition for any empirical belief formation, including the scientific theories used in debunking. | **No.** The principle, if valid, would equally undermine perceptual, mathematical, and inductive beliefs. Perception is shaped by evolution for fitness, not truth-as-such; mathematical intuition may reflect cognitive structures optimized for spatial navigation, not Platonic truth; induction lacks a deductive guarantee. If these domains are safe, so is morality, given a plausible third-factor account. |

  **Part 3: Crucial Test Points ("Cruxes")**

  1.  **Crux: Scope of Third-Factor Explanations for Novel/Abstract Judgments**
      *   **(a) Relevance:** Both agree that if third-factor explanations can only secure reliability for a narrow core of "thin" judgments (e.g., harm to kin), realism is severely weakened. If they robustly extend to novel, abstract, or culturally stable "thick" judgments (e.g., universal human rights, obligations based solely on sentience), realism gains significant support.
      *   **(b) Test Case:** Consider the emergence and widespread (though not universal) cultural endorsement of the principle that *all humans, irrespective of kinship, tribe, or capacity for reciprocal benefit, possess inherent dignity and basic rights*. Is there a plausible evolutionary third-factor explanation for the reliable tracking of an objective moral truth here, or only an explanation for why such a belief might be socially useful (or emerge contingently from other capacities) regardless of its truth? Examine the psychological mechanisms and historical contingencies involved.
      *   **(c) Predictions:**
          *   *Debunker:* Predicts the best explanation will show this judgment arising from contingencies of cultural evolution, cognitive overgeneralization, or purely instrumental social benefits, lacking a reliable connection to a distinct moral fact about inherent dignity. The third-factor link (e.g., to well-being) will be too tenuous or indirect.
          *   *Realist:* Predicts the emergence and stability of this judgment, despite its novelty and costliness, *is* best explained by cognitive capacities evolved for tracking genuine, objective features of personhood and value (the third factor), allowing reliable access to the moral truth, even if mediated by cultural evolution.

  2.  **Crux: Does Antirealism Face a Parallel Epistemic Challenge?**
      *   **(a) Relevance:** The Realist argues that if the EDA's epistemic principle undermines moral belief, it equally undermines the scientific beliefs used to construct evolutionary explanations, including the EDA itself. The Debunker must show how their own position avoids self-undermining or explain why the epistemic principle applies asymmetrically.
      *   **(b) Test Case:** Consider the evolutionary explanation for the belief in *objective moral facts* itself. Does the Debunker's own metaethical view (e.g., error theory or non-cognitivism) face an analogous debunking challenge? Can the Debunker provide an account of the reliability of their scientific (evolutionary, psychological) beliefs that does *not* rely on a "third factor" structurally similar to the one they reject for morality, and that avoids rendering the justification of the EDA itself evolutionarily suspect?
      *   **(c) Predictions:**
          *   *Debunker:* Predicts that scientific beliefs (about evolution, psychology) are justified by their instrumental success in prediction and control, grounded in perceptual and inductive faculties *whose reliability for tracking physical reality is demonstrably linked to survival fitness in a way moral truth is not*. The EDA itself is justified by empirical evidence, not a priori epistemic principles applied self-defeatingly.
          *   *Realist:* Predicts the Debunker either cannot provide a non-circular, evolutionarily stable account of the reliability of science that avoids relying on a third-factor explanation (e.g., evolution selecting for truth-tracking capacities *regarding the physical world*) analogous to the one proposed for morality, or must accept that their epistemic principle *does* undermine science, rendering the EDA self-undermining. The challenge is structurally parallel.

  **Signed:**

  [Signature Line for Debunker Proponent]
  [Signature Line for Robust Moral Realist Defender]

  ---
  **Key Features Reflecting Instructions:**
  *   **Substantive Agreements (Part 1):** Focuses on burdens of proof, scope of evolutionary explanations, the conditional consequence for realism, and isolates a verbal element.
  *   **Disagreements Table (Part 2):** Neutrally framed questions with answers phrased as each side would endorse, covering the three mandated core issues.
  *   **Cruxes (Part 3):** Each crux specifies (a) agreed relevance, (b) a concrete shared test case/argument, and (c) advance predictions from both sides. Includes one crux on third-factor scope and one on the parallel problem for antirealism.
  *   **Self-Contained & Precise:** Uses standard metaethical terminology without relying on citations or specific theorists. The map of agreements, disagreements, and cruxes clearly delineates the remaining battlegrounds.
  *   **Constructive & Earned:** Avoids strawmen and unearned concessions. Disagreements are sharply defined, and cruxes represent genuine pivot points where evidence could shift the debate.
