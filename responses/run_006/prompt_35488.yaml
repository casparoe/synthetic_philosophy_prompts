prompt: |-
  Ok so I've been reading Austin and I'm stuck on something. He says performatives aren't true or false, they're happy or unhappy. But then he lists sincerity as one of the conditions for a performative to be happy — like, if I say "I promise" but I'm lying through my teeth, then the utterance is infelicitous. But isn't that just saying that "I promise" is true when I actually intend to follow through and false when I don't? Like, the utterance is just a report of my inner state and its truth-conditions are about whether I really have that intention. So hasn't Austin just reinvented the true/false distinction under another name, with "happy" and "unhappy"? What am I missing?
reasoning: |-
  Okay, this user is grappling with a nuanced point in Austin's speech act theory. They've noticed what seems like a contradiction: if insincere promises make performatives "unhappy," doesn't that just collapse back into truth conditions? Smart catch - many students hit this wall when first encountering performatives.

  Hmm, the user's clearly done their homework - they're quoting Austin's "happy/unhappy" terminology correctly and zeroing in on the sincerity condition. Their frustration is palpable though. That "what am I missing?" at the end suggests they've wrestled with this awhile. Probably a philosophy or linguistics student given how precisely they're parsing the terms.

  The core confusion seems to be conflating two different dimensions: the action performed (promising) versus describing a mental state (intending). Austin's whole revolution was shifting focus from language-as-statement to language-as-action. When I say "I promise," I'm not describing my intention - I'm creating the promise itself. The sincerity condition is about whether this action was properly constituted, not whether some statement corresponds to facts.

  Ah! This reminds me of Searle's later distinction between "illocutionary" and "perlocutionary" acts. The user might benefit from that extension, but I should stick to Austin here since that's their reference point. The key is emphasizing that truth/falsehood applies to constatives (like "the cat is on the mat"), while happiness applies to whether actions like marrying or promising actually occur.

  Noticing the user used "lying through my teeth" - that's telling. They're still framing insincere promising as deception, which assumes the utterance is fundamentally a truth claim. Need to dismantle that assumption by stressing that the primary function isn't to report but to do. Maybe the marriage analogy would help - an insincere "I do" still creates legal marriage, it's just defective in a different way than false statements are defective.

  Should also address their "reinvented true/false" concern directly. It's not reinvention because infelicities include things like saying "I divorce you" in a country without divorce laws - situations where truth conditions are irrelevant but the act still fails. Sincerity is just one failure mode among many.
answer: |-
  You've hit on one of the most famous and insightful critiques of Austin's early performative theory! You're absolutely right to sense tension here, but Austin (and later speech act theorists like Searle) developed this precisely to *avoid* collapsing performatives back into true/false statements. Here's what you're missing and why the distinction matters:

  1.  **The Primacy of the *Act*:** Austin's core insight is that performatives are **actions**, not descriptions. When you say "I promise," your primary goal isn't to *report* your inner state ("I am experiencing an intention to do X"), but to *accomplish* something: **to bind yourself to a future action.** The utterance *itself* is the act of promising.

  2.  **Failure vs. Falsehood:** Austin wants different terms ("happy/unhappy," "felicitous/infelicitous") because the ways performatives "go wrong" are fundamentally *different* from how constative statements (true/false reports) go wrong.
      *   **False Constative:** "The cat is on the mat" is false if the cat *isn't* on the mat. Its failure is about *mismatch with reality*.
      *   **Infelicitous Performative:** "I promise to pay you back tomorrow" can fail in ways having *nothing* to do with your inner state matching reality:
          *   **Misfire (Procedure Flawed):** You utter it while unconscious, or to a dog who cannot understand promises, or within a context where "promising" isn't a recognized act. The act *wasn't even attempted successfully*. (No truth condition applies here!)
          *   **Abuse (Procedure Flawed Execution - Insincerity):** You *do* successfully perform the act of promising (you invoked the convention correctly: right words, right context, right audience), but you lacked the requisite intention or feelings (insincerity). **The act *happened* (you promised), but it was defective/hollow/abusive.**

  3.  **Sincerity Condition is *Not* a Truth Condition:** This is crucial. Austin *agrees* that for the performative to be *fully happy* (non-defective), you must be sincere. **However:**
      *   **The Act Still Occurs:** Even if you are insincere, *you have still promised*. You are now obligated (socially, morally, potentially legally) in a way you weren't before uttering the words. The insincere promiser often faces consequences *because they did make a promise*. A false statement like "The cat is on the mat" doesn't create a new obligation or reality in the same way.
      *   **The Focus is on the Conventional Act:** The "sincerity condition" is a rule governing the *successful execution of a social/conventional act*, not a condition for the *truth* of a statement *about* that act. It's more like the rule "You must genuinely intend to play by the rules" in a game. Breaking it makes your move defective or cheating, but you still made the move within the game structure.
      *   **Truth Conditions Would Reduce the Act to a Description:** If "I promise" *meant* "I hereby report that I have the intention to...", then:
          *   Its primary function *would* be descriptive.
          *   Its truth *would* depend solely on the existence of that intention.
          *   Uttering it wouldn't *create* the promise; it would just *report* on an intention that already existed independently. But Austin argues the *utterance itself* creates the commitment. The intention is a necessary *precursor* for the act to be *proper*, not the *meaning* of the words.

  4.  **Analogy: Saying "I Do" in a Wedding:**
      *   **Infelicitous (Abuse/Insincere):** You say "I do" without meaning it. You are *still legally married* (the act happened!), but the marriage is defective/hollow/fraudulent. You can potentially get an annulment *because you performed the act insincerely*.
      *   **False Constative?** If "I do" *meant* "I report that I intend to marry this person," its truth would depend *only* on your intention. If you lacked the intention, it would be false, but you wouldn't *be* married. This isn't how marriage works. The *utterance within the ceremony* is what effects the change in status.

  **What Austin Was Trying To Do (and How He/Searle Refined It):**

  1.  **Undermine the True/False Tyranny:** Austin wanted to show that many utterances aren't *primarily* about describing the world and being true/false. They are tools for *doing* things.
  2.  **Highlight Different Dimensions of Failure:** He wanted a richer vocabulary for how utterances fail. "Infelicity" covers a wide range: procedural errors (misfires), insincerity (abuse), and later, failures to achieve the intended consequence perlocution).
  3.  **Evolution of the Theory:** Austin himself realized this initial performative/constative distinction was messy. This led him to develop the more general **Speech Act Theory** (Locutionary, Illocutionary, Perlocutionary acts). John Searle later systematized this, explicitly defining **sincerity conditions** as one type of **felicity condition** (alongside preparatory conditions, essential conditions, etc.) for **illocutionary acts** (like promising, ordering, asserting).

  **Your Critique's Value & Austin's Response:**

  Your point is excellent because it shows how easily the "sincerity condition" *seems* to pull performatives back towards truth-conditions. Austin's response would be:

  1.  Yes, sincerity is crucial for the act being *non-defective*.
  2.  But *even when insincere*, the illocutionary act (e.g., promising) *has still been performed* through the conventional procedure. You *are* a promisor who lied, not someone who merely made a false statement *about* an intention.
  3.  The infelicity due to insincerity is a different *kind* of flaw than the falsehood of a constative statement. It's a flaw in the *execution of a social action*, not a flaw in *representing a state of affairs*.

  **In short:** You aren't reporting your inner state ("Here's a fact about me: I intend X") when you say "I promise." You are *performing an act* whose conventional rules *require* that inner state for the act to be properly, non-defectively executed. "Happy/unhappy" captures this broader range of ways actions succeed or fail, which goes beyond simple correspondence with facts (true/false). The act *happens* even when unhappy (due to insincerity), whereas a false constative statement simply fails to correspond. That's the key distinction Austin was driving at.
