answer: |-
  Here’s a structured breakdown of desiderata for theories of infinite ethics, grounded in philosophical and mathematical debates. The field is defined by **profound trade-offs** – no single theory satisfies all intuitive requirements, and impossibility theorems show some desiderata are *jointly unsatisfiable*. Below are core desiderata, their motivations, conflicts, and negotiability status.

  ---

  ### **I. Normative Desiderata: What the Theory Should Deliver**
  1. **Pareto Principles**  
     - *Weak Pareto:* If every individual is better off in outcome A than B, A is better than B.  
     - *Strong Pareto:* If no one is worse off in A than B and at least one is better off, A is better.  
     *Motivation:* Basic ethical intuition that improving lives without harming others is good.  
     *Non-negotiable?* **Weak Pareto is widely non-negotiable**; Strong Pareto is contested in infinite cases.

  2. **Anonymity (Permutation Invariance)**  
     - Relabeling individuals shouldn’t change the value of an outcome.  
     *Motivation:* Fairness; no arbitrary favoritism.  
     *Non-negotiable?* **Contested.** Some theories (e.g., hyperreal utilities) violate it to avoid paralysis.

  3. **Avoiding the "Repugnant Conclusion" (RC)**  
     - Should not force us to prefer a vast population with barely positive lives over a small, flourishing one.  
     *Motivation:* Preservation of intuitive moral repugnance toward RC.  
     *Non-negotiable?* **Priority for many**, but some accept RC as inevitable under utilitarianism.

  4. **Non-Implausibility**  
     - Must avoid absurd judgments (e.g., "adding a single miserable life reverses societal value").  
     *Motivation:* Maintain coherence with practical ethics.  
     *Non-negotiable?* **Yes.** Theories producing clear absurdities are rejected.

  ---

  ### **II. Formal Desiderata: Structural Constraints**
  5. **Transitivity**  
     - If A > B and B > C, then A > C.  
     *Motivation:* Necessary for consistent decision-making.  
     *Non-negotiable?* **Largely non-negotiable** – intransitivity leads to cyclic preferences.

  6. **Completeness**  
     - For any two outcomes A and B, either A > B, B > A, or A = B.  
     *Motivation:* Avoid paralysis; agents must be able to compare options.  
     *Non-negotiable?* **Contested.** Some theories (e.g., "incomparability" frameworks) reject completeness.

  7. **Continuity/Density**  
     - Small changes in welfare shouldn’t cause discontinuous jumps in value.  
     *Motivation:* Avoid sensitivity to infinitesimal perturbations.  
     *Non-negotiable?* **Often sacrificed** (e.g., in lexical theories).

  ---

  ### **III. Case-Handling Desiderata: Key Problems to Solve**
  8. **Convergence Problems**  
     - Must compare outcomes where total utility sums diverge (e.g., ∞ vs. ∞ or ∞ vs. −∞).  
     *Case:* Infinitely many people with utility +1 vs. utility −1.  
     *Motivation:* The *core challenge* of infinite ethics; failure here makes the theory useless.

  9. **Independence of Spatiotemporal Location**  
     - Should handle cases where populations exist at different times or in disconnected regions.  
     *Case:* Choosing between helping an infinite past civilization vs. an infinite future one.  
     *Motivation:* Avoid arbitrary privileging of "here and now."

  10. **Addition/Removal Consistency**  
      - Adding or removing finitely many individuals shouldn’t radically alter comparisons.  
      *Case:* If A > B, then A ∪ {c} > B ∪ {c} for a new individual *c*.  
      *Motivation:* Stability under small changes.  
      *Non-negotiable?* **Often violated** (e.g., in "average utilitarianism" with infinite populations).

  ---

  ### **IV. Known Conflicts & Impossibility Results**
  - **Lauwers-Van Liedekerke Theorem:**  
    *Conflict:* **Strong Pareto + Anonymity + Transitivity** → Impossibility in infinite settings.  
    *Resolution:* Theories drop one (e.g., **hyperreal utilities** violate anonymity; **density measures** violate strong Pareto).

  - **Arrhenius' Impossibility Theorems:**  
    Shows no population axiology satisfies all intuitive desiderata (even in finite cases), exacerbated in infinity.

  - **Negligibility Problems:**  
    Adding finite good to an infinite universe seems negligible, violating Pareto.  
    *Trade-off:* Sacrifice Pareto or accept that finite actions lack moral significance.

  ---

  ### **V. Negotiability Spectrum**
  | **Desideratum**               | Non-Negotiable? | Notes                                                                 |
  |-------------------------------|-----------------|-----------------------------------------------------------------------|
  | Weak Pareto                   | ✅ Yes          | Rejection implies harming no one could be bad.                        |
  | Transitivity                  | ✅ Mostly       | Rejection makes rational choice impossible.                           |
  | Non-Implausibility            | ✅ Yes          | Theories must avoid clear absurdities.                                |
  | Anonymity                     | 🔶 Contested    | Dropped in hyperreal/ordinal approaches.                              |
  | Strong Pareto                 | 🔶 Contested    | Often sacrificed to avoid paralysis (e.g., in "extended preferences").|
  | Completeness                  | 🔶 Contested    | Some argue incomparability is realistic (e.g., in pluralist theories).|
  | Avoiding Repugnant Conclusion | ❌ No           | Some utilitarians accept RC as a necessary cost.                      |

  ---

  ### **The Meta-Problem: Are Desiderata Themselves the Issue?**
  **Yes.** The lesson of impossibility theorems is that **no stable, consistent theory can satisfy all desiderata simultaneously in infinite settings**. Insisting on a "complete" theory may be misguided. Instead:
  - **Contextualism:** Use different tools for different cases (e.g., discounting for temporal decisions, hyperreals for spatial ones).
  - **Paraconsistency:** Accept limited contradictions (e.g., "A > B and B > A" in edge cases) to avoid paralysis.
  - **Epistemic Humility:** Treat infinite ethics as inherently incomplete, prioritizing robustness in finite domains.

  ---

  ### **Conclusion**
  Infinite ethics is a domain of **forced trade-offs**. Any theory must:
  1. Handle core cases (divergent sums, spatiotemporal invariance),  
  2. Preserve weak Pareto and transitivity *or* justify their rejection,  
  3. Acknowledge impossibility results (e.g., Lauwers-Van Liedekerke).  

  **Non-negotiable base:** Weak Pareto + Transitivity + Non-Implausibility.  
  **Common casualties:** Anonymity, Completeness, Strong Pareto.  

  The field is less about finding a "correct" theory and more about **choosing which moral intuitions to preserve and which to abandon** in the face of infinity. Reading proposals now, you’ll see each makes distinct trade-offs – the key is whether their sacrifices align with your normative priorities.
