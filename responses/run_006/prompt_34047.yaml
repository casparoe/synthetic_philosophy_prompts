answer: |-
  The referendum practice and its "will of the people" rhetoric rest on a complex, often inconsistent set of philosophical presuppositions. Let's reconstruct the implicit theory charitably, distinguish necessary commitments from compatible ones, identify underdetermined areas, and explore alternatives:

  ### Charitable Reconstruction of Implicit Presuppositions
  **Core Presupposition (Minimalist):**  
  *That collective decisions require legitimacy derived from popular authorization.* Referendums presuppose that certain high-stakes decisions gain legitimacy only through direct popular endorsement. This doesn't strictly require a *pre-existing unified will*, but rather that **majority approval under specified conditions constitutes valid authorization** for the collective action.

  **Key Elements:**
  1.  **Aggregation, Not Pre-Existence:** The practice *does not strictly presuppose* a unified "will" existing prior to the vote. Charitably, it presupposes that a **fair binary procedure can aggregate individual preferences into a legitimate collective decision**. The majority serves as the **operational proxy** for the collective choice, not the revelation of a metaphysical unity.
  2.  **"The People" as Agent (Procedural):** It minimally presupposes that "the people" **can act as a collective agent *through specific institutional procedures*** (like voting). This is compatible with viewing the people as a **procedural entity** rather than a continuous metaphysical subject. The "will" is the outcome of the procedure, not a pre-existing state.
  3.  **Sovereignty and Authorization:** The core commitment is to **popular sovereignty**: the ultimate source of political authority resides in the citizenry. A referendum result is deemed an **act of authorization** by the sovereign people for a specific decision. The 52% "speaks for" the whole *in this specific instance* because the procedure defines the rules of authorization.
  4.  **Selectivity & Fitness:** The selective use implies a (often unarticulated) theory of **decision competence**:
      *   **Fit for Referendum:** Issues deemed "constitutional," "foundational," or "identity-defining" (EU membership, independence, marriage definition) are seen as requiring direct popular authorization due to their profound impact on the polity's nature.
      *   **Not Fit:** Complex, technical, or ongoing regulatory matters (tax details, sentencing guidelines) are seen as better handled by representatives with expertise and capacity for iterative adjustment. This presupposes a distinction between **fundamental choices** (fit for popular decision) and **technical implementation** (fit for delegation).
  5.  **Question Framing:** The practice *aspires* to neutrality but *pragmatically assumes* that a well-crafted question can **elicit a meaningful preference** on the core issue. It does *not* presuppose the will is wholly pre-existing and merely "surfaced," but rather that the framing can be sufficiently neutral to produce a **legitimate expression of aggregated preference** on the *broad choice* presented. However, it often ignores how framing *structures* the available choices and thus *shapes* the outcome.

  ### What the Practice Strictly Presupposes vs. What it Fits With
  *   **Strictly Presupposes:**
      1.  **Legitimacy via Procedure:** A majority vote under agreed referendum rules (franchise, campaign rules, question clarity) produces a democratically legitimate outcome *for that specific question*.
      2.  **Popular Sovereignty:** The citizenry is the ultimate source of legitimate political authority.
      3.  **Authorization:** The majority outcome authorizes the government to act *as if* the entire people had willed it *for the purpose of implementing that decision*.
      4.  **Distinct Decision Types:** Some decisions are fundamentally different in kind and require different decision-making procedures.
  *   **Fits Well With (But Not Strictly Presupposed):**
      1.  **Minimal Group Agency:** "The people" can act as a unified agent *through specific decision procedures*.
      2.  **Majority as Best Proxy:** A binary majority vote is the most practical and legitimate way to settle fundamental binary choices for a large polity.
      3.  **Revealed Preference:** Voting reveals underlying individual preferences that can be aggregated into a collective choice.

  ### Philosophically Underdetermined Areas
  The practice *does not* require commitment to one specific theory of collective will. It's compatible with:
  1.  **Epistemic Proceduralism:** Referendums are the best available procedure for identifying the "right" answer on fundamental questions (if such exists) under majority rule.
  2.  **Pure Aggregative Democracy:** The referendum simply sums individual preferences; the "will" is a statistical outcome.
  3.  **Fiction Theory:** "The will of the people" is a necessary fiction or "as-if" construction to legitimize collective action, acknowledging the underlying diversity. The procedure creates the appearance of unity required for action.
  4.  **Deliberative Democracy (Partial):** While not inherent, the practice *could* be embedded in broader deliberative processes (citizen assemblies, extensive debate) that give the vote more claim to reflect a considered will.
  5.  **Realist View:** The "people" is a symbolic construct; the referendum outcome reflects the power of mobilized factions, not a pre-existing metaphysical will.

  ### Shifting to a Deflationary View: Consequences
  A deflationary view sees referendums as **one decision rule among others** (e.g., parliamentary vote, judicial review, expert commission) with **no special claim to express a pre-existing "collective will,"** merely a procedure for aggregating individual votes on a specific question. Changing to this view would require:

  1.  **Rhetorical Shift:**
      *   Replace "will of the people" with **"majority decision," "referendum outcome," or "voter mandate."**
      *   Acknowledge the **provisional and procedural nature** of the result: "A majority of voters chose X."
      *   Explicitly recognize the **minority perspective**: "While a majority voted for X, a significant minority (48%) voted against."

  2.  **Institutional/Practice Changes:**
      *   **Justification for Referendum Use:** Require clear, principled criteria for *when* a referendum is the appropriate decision rule (e.g., only for reversible constitutional amendments? only after supermajority parliamentary approval?). This undermines *ad hoc* selectivity.
      *   **Question Design & Thresholds:** Implement stricter neutrality requirements for question wording, independent commissions for framing, and potentially **supermajority thresholds** (e.g., 60%) for irreversible, high-stakes decisions to acknowledge the lack of a unified "will" and protect minorities.
      *   **Integration with Other Institutions:** Frame the referendum as **part of a system**, not the sovereign voice. E.g., require parliamentary ratification of results, build in mandatory review periods, or use referendums only after extensive deliberation in representative bodies or citizen assemblies.
      *   **Emphasis on Process Legitimacy:** Legitimacy derives from **fair procedure** (equal campaigning, access to information, neutral administration) rather than the mystical invocation of "the people's will."

  3.  **Conception of Legitimacy:**
      *   Legitimacy shifts from **expressive** (revealing the collective subject's will) to **procedural** (fair aggregation under agreed rules) and **output-oriented** (does it produce stable, acceptable outcomes?).
      *   Referendums lose their **trump card status**. A parliamentary vote or judicial decision could be seen as equally legitimate decision procedures for different types of questions.

  **In essence:** Adopting a deflationary view demystifies referendums. They become tools, not revelations. This encourages more honest discourse about winners and losers, reduces the tyranny of narrow majorities claiming absolute legitimacy, and forces a more deliberate and justified choice about *when* and *how* direct democracy is the best decision rule for a specific issue within a complex constitutional system. It acknowledges that "the people" is a diverse multitude, not a singular entity with one will, and that democracy involves ongoing negotiation and multiple decision paths, not just occasional binary plebiscites.
