answer: |-
  ## The Leveling-Down Duel: Alex vs. Bryony

  **Setting:** A slightly worn common room in a venerable Oxford college. Late afternoon light slants through leaded windows. Tea cups rest on a low table between two armchairs.

  **Characters:**
  *   **Alex:** Prioritarian. Calm, precise, favours structured arguments. Wears a slightly frayed tweed jacket.
  *   **Bryony:** Telic Egalitarian. Passionate, quick-witted, unafraid of counter-intuitive positions. Dressed in comfortable, colourful layers.

  **(The dialogue begins mid-conversation)**

  **Bryony:** ...So you concede that in the ‘Two Worlds’ case – where World A has everyone at 100, and World B has half at 150 and half at 50 – prioritarianism *might* favour redistribution towards World B, depending on the exact concavity of your weighting function? But only because the worse-off in B are *absolutely* worse off?

  **Alex:** Precisely, Bryony. My objection isn’t to redistribution *when it benefits the worse-off*. It’s to the idea that moving from World A to a *levelled-down* World C, where everyone is at 75, could be *in any way good*, intrinsically, simply because it’s equal. That’s what seems absurd! We’ve made *everyone* worse off, and no one better off. Prioritarianism avoids that bullet entirely. The value resides in the *well-being* and *for whom* it’s held, not in the relational gap.

  **Bryony:** But Alex, that’s precisely where I think you miss the point. The badness in World B isn’t *just* that some are at 50. It’s that *they are at 50 while others are at 150*. Inequality itself, the sheer unfairness of the disparity, is non-instrumentally objectionable. The leveling-down objection only seems forceful if you refuse to acknowledge that intrinsic disvalue. In C, that *particular* bad is eliminated. Yes, total well-being is lower, and that’s bad *too*. But it’s good *in one respect* – the respect of equality.

  **Alex:** And that’s where I think the ‘pluralist’ move looks suspiciously like special pleading. You say levelling down is ‘bad all things considered’ but ‘good in one respect’. Fine. But *how* does that ‘one respect’ actually function? If the *only* thing changed is the elimination of inequality, achieved by making everyone worse off, and no other values are served, how can that ‘one respect’ carry any positive weight whatsoever? It seems like an empty gesture. You’re forced to say *something* positive happened, but it’s entirely uncoupled from any actual improvement for any sentient being. Prioritarianism grounds value firmly in individual welfare states.

  **Bryony:** It’s not uncoupled! It’s directly addressing the *relational* harm inherent in the unequal distribution. Imagine a different case: Society X. Group Alpha all have well-being 500, Group Beta all have well-being 500. Both are fantastically well-off – well past any plausible point where marginal utility flattens to near-zero on *any* prioritarian weighting function. There’s no prioritarian reason whatsoever to transfer resources from Alpha to Beta, right? They’re identically well-off.

  **Alex:** Correct. If both groups are genuinely at identical, very high absolute levels, and there’s no friction or cost to transfer, *perhaps* a vanishingly small prioritarian reason might exist depending on the precise asymptotic behaviour of the function, but practically, yes, negligible to non-existent. Why?

  **Bryony:** Now imagine Society Y. Group Alpha: 1000. Group Beta: 500. Still both incredibly well-off in absolute terms. Identical individuals, same needs. The *only* difference is that Alpha has significantly more, purely due to brute luck or historical injustice. On your view, Alex, there’s *still* no significant prioritarian reason to redistribute from Alpha to Beta? The marginal utility of a unit of well-being at 500 vs. 1000 is negligible?

  **Alex:** If the weighting function is sufficiently concave and the levels sufficiently high, the *weighted* gain to Beta from a unit transfer might be only marginally greater than the *weighted* loss to Alpha. It could be very weak, perhaps even outweighed by minor transaction costs. It wouldn’t be the urgent priority it would be if Beta were at 50.

  **Bryony:** Exactly! But doesn’t the *injustice* of the inequality scream out at you? Beta isn't *suffering* in any absolute sense, but they are *wronged* by the sheer, unfair disparity when compared to Alpha who have twice as much for no relevant reason. Telic egalitarianism captures that directly: the inequality *itself* is bad. Prioritarianism seems blind to this distinct moral concern – the concern for *fairness in distribution* – precisely when absolute levels are high. You reduce everything to the absolute welfare of individuals, ignoring the morally salient relations *between* them.

  **Alex:** But Bryony, doesn’t your Society Y case risk conflating telic and deontic concerns? You’re slipping in talk of ‘injustice’ and ‘wronged’. The leveling-down objection primarily targets *telic* egalitarianism – the idea that equality is a non-instrumental good in the outcome. A *deontic* egalitarian, who objects to the *process* or the *unfairness of the act* that *creates* or *maintains* the inequality, might sidestep leveling-down. They could say levelling down doesn’t address the *wrongful act* and indeed creates new harms. But *you’re* committed to the outcome itself being bad because unequal, irrespective of how it arose. That’s what makes the move to World C (75 for all) seem perverse – you’re claiming that outcome is *in one respect better* than World A (100 for all), purely due to equality, even though it arose by harming everyone. The deontic egalitarian doesn’t have to say that. *(Alex sips tea, looking pointedly at Bryony)*.

  **Bryony:** *(Leans forward)* Fair point, Alex. Let me clarify. I *am* a telic egalitarian. I *do* think the unequal outcome in Society Y is intrinsically bad, regardless of origin. The brute luck disparity *is* unfairness instantiated in the state of the world. That intrinsic badness *is* a reason to prefer a more equal distribution, *ceteris paribus*. In Society Y, redistributing *downwards* from Alpha to achieve equality *might* be all-things-considered wrong because of the significant welfare loss to Alpha for minimal gain to Beta – the pluralist point. But the intrinsic badness of the inequality *remains*. It gives us a *pro tanto* reason to reduce it, even if, in this high-level case, other reasons (like welfare loss) decisively outweigh it. Whereas your prioritarianism gives you *no intrinsic reason at all* to reduce that inequality in Society Y. It renders that glaring unfairness morally invisible, which I find deeply counter-intuitive. It abandons the core egalitarian impulse.

  **Alex:** But Bryony, isn’t the prioritarian concern precisely a refined version of that impulse? You accuse me of ignoring relations, but look at the structure of the prioritarian weighting function! It’s strictly increasing and concave. That *means* a unit of well-being is assigned greater moral weight the lower the absolute level of the recipient. Isn’t that *precisely* a way of giving greater moral significance to benefiting those who are *worse off relative to others*? It’s a concern for the absolute position of the worse-off, but the ‘worse-off’ is defined *relationally* within the population. Isn’t prioritarianism just egalitarianism in disguise, smuggling in the concern for equality via the back door of individual welfare weighting?

  **Bryony:** *(Smiles, shaking her head)* No, Alex, that’s a common misconception, but it’s crucial. The prioritarian weighting *is* based solely on the *absolute* level of the *individual recipient*. It doesn’t look sideways. Imagine a lone individual on a desert island. Every unit of well-being she gains is weighted more heavily the lower her absolute level. That’s pure prioritarianism – no relations involved. Now add a second person. The weight given to a benefit for person A depends *only* on A’s absolute level, not on whether B is better or worse off. If A is at 10 and B is at 100, helping A gets high weight. If A is at 10 and B is *also* at 10 (so it’s equal), helping A *still* gets exactly the same high weight! The weight depends on A’s *absolute 10*, not on the gap to B. Egalitarianism cares about the gap itself. That’s the fundamental difference. Your concave function cares about absolute deprivation; I care about relative deprivation *as such*.

  **Alex:** I see the distinction you’re drawing. But doesn’t it lead back to the problem of Society Y? Both groups are at such high absolute levels that the prioritarian weight for helping Beta is minimal, even though they are *relatively* deprived compared to Alpha. Yet that relative deprivation strikes you – and many – as morally significant in itself. Prioritarianism seems to discount that intuition precisely when absolute deprivation is absent, even though unfairness remains. Conversely, the telic view forces you to endorse the counter-intuitive claim that *some* good is achieved by levelling down, even when it harms everyone. That’s the rock and the hard place.

  **Bryony:** And there, Alex, I think we hit the bedrock. For you, the sheer waste and harm of leveling down is utterly decisive against telic egalitarianism, exposing it as fundamentally flawed. The Society Y case, while perhaps a worry, isn’t sufficient to abandon prioritarianism’s core commitment to linking moral weight to absolute welfare levels. For me, the profound, intrinsic disvalue of unfairness in distributions – even among the well-off – is a non-negotiable moral insight. The counter-intuitiveness of leveling down is the price of taking that intrinsic disvalue seriously; we mitigate it via pluralism, acknowledging the badness of welfare loss simultaneously. Prioritarianism’s neat avoidance of leveling down comes at the cost of silencing a crucial dimension of our moral concern – fairness itself.

  **Alex:** So we agree that deontic egalitarianism might sidestep leveling-down, but that’s not your view. We agree prioritarianism doesn’t care about inequality *as such* when absolute levels are high. And we agree that the pluralist move is available, though I find it unstable and you find it necessary. The core clash is indeed bedrock: whether the moral universe contains an irreducible, non-instrumental badness in unequal distributions *per se*, independent of individual absolute welfare levels and the reasons we have to improve them.

  **Bryony:** Precisely. The leveling-down objection doesn’t *refute* telic egalitarianism for its adherents; it starkly reveals its deepest, most controversial commitment. And prioritarianism’s immunity to it doesn’t *prove* it’s superior; it starkly reveals what it must exclude – that very commitment. The debate, I suspect, turns on which bullet one finds harder to bite: the counter-intuitiveness of leveling down, or the moral silence in the face of high-level inequality.

  **Alex:** *(Nods slowly)* Well put, Bryony. It seems we’ve reached the point where argument gives way to differing foundational intuitions about the nature of value and disvalue. More tea? I suspect we’ll need it if we’re to tackle the deontic escape route next time.

  **Bryony:** *(Chuckles)* Right-o. Milk, no sugar. And don’t think I won’t press you on whether that concave function *really* avoids all relational concerns in its application...

  **(They both reach for the teapot, the unresolved tension hanging comfortably in the academic air.)**

  ## Key Philosophical Points & Current Debates

  1.  **Leveling-Down Objection (LDO):** Widely accepted as a *serious challenge* to **telic** egalitarianism. There is *no consensus* that it is a fatal refutation, but it forces significant concessions (like pluralism). It is *less directly applicable* to **deontic** egalitarianism, which focuses on unfair actions/rules, not necessarily unequal outcomes *per se*. Whether deontic views fully escape or just relocate the problem is debated.
  2.  **Prioritarianism vs. High-Level Inequality:** The "Society Y" case (both groups very well-off but unequal) highlights a *genuine point of contention*. Prioritarians argue their view correctly focuses on absolute welfare and that high-level inequality isn't intrinsically morally urgent. Telic egalitarians argue this shows prioritarianism misses a core element of justice/fairness. There is *no consensus* on which intuition is stronger here.
  3.  **Pluralist Egalitarian Reply:** A common and *principled* response within telic egalitarianism. It accepts the LDO shows equality isn't the *only* value. Whether it successfully salvages the *intrinsic* badness of inequality or renders it practically inert/otiose is hotly debated. It's not generally considered *ad hoc* but its coherence and usefulness are contested.
  4.  **Is Prioritarianism Smuggling in Equality?** Alex and Bryony accurately represent the standard distinction: Prioritarianism weights based on *absolute* individual welfare levels. Egalitarianism cares about *relative* differences. This distinction is *crucial* and *widely accepted* in the literature. Prioritarianism does *not* intrinsically value equality. However, its *effects* in many real-world scenarios (where worse-off are also relatively worse-off) will often align with egalitarian recommendations, leading to confusion. The debate is settled that they are distinct theories, but the *moral adequacy* of prioritarianism's lack of concern for pure relational inequality remains contested (as per point 2).
  5.  **Bedrock Intuitions:** The dialogue correctly identifies the fundamental clash: Must a theory acknowledge the intrinsic disvalue of unequal distributions *as such* (telic egalitarianism), or is the counter-intuitiveness of endorsing *any* good in leveling down decisive, leading us to anchor value solely in individual absolute welfare states weighted by priority to the worse-off (prioritarianism)? This is the *genuinely contested core* of the debate. Neither side has established a knockdown argument against the other; the disagreement persists at the level of foundational moral commitments.
