  I'm working through the literature on the justification of deduction, and before I go further I want a clear specification of what a successful answer would actually have to do. Taking Carroll's tortoise as the central challenge, write the desiderata for an adequate theory of the justification of deduction. For each requirement, give the case or consideration that makes it a requirement — why can't a theory simply decline to meet it? Distinguish the non-negotiable requirements from those that reflect the commitments of a particular philosophical camp (e.g., naturalism, anti-psychologism, or a demand that the account be rule-based rather than disposition-based). Then tell me whether any subset of the non-negotiable desiderata is jointly unsatisfiable: if the tortoise's regress shows that no account can meet all of them, I want that stated clearly. Finally, if you think the whole enterprise of drawing up such a list is misguided — that the tortoise's challenge is better dissolved than met, or that the demand for a justification of deduction is itself confused — say so plainly instead of playing along.
