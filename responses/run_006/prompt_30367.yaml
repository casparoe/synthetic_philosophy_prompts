prompt: |-
  I'm taking a course on moral psychology and virtue ethics, and my professor spent a lecture summarizing the situationist critique of virtue ethics. I've heard enough elsewhere to suspect that her summary is doing something unfair to the view, but I don't know enough to put my finger on where, and she is a professional, so I want to check before I push back. Here is roughly how she put it:

  Social psychology has shown that what people do is driven almost entirely by the situations they find themselves in, not by stable traits like honesty or compassion. In the classic studies, most seminary students who were told they were late walked past someone groaning in a doorway, people who found a dime in a phone booth were far more likely to help pick up dropped papers, and ordinary people were willing to deliver what they believed were severe electric shocks just because a man in a lab coat told them to. These studies prove that broad character traits are an illusion: there is no such thing as a generally honest or compassionate person, only people responding to situational pressures. Since virtue ethics defines virtues as exactly such broad, reliable traits, and since it also claims that people can cultivate them through practice, virtue ethics rests on an empirical falsehood and is therefore refuted. The only reply virtue ethicists have is to say that the subjects in these experiments weren't really virtuous, but that is question-begging because it assumes the very thing the experiments are supposed to test. The practical upshot is that we should stop talking about character and instead design situations and institutions so that ordinary, situationally driven people will do the right thing.

  Could you audit this for me? Go through it claim by claim and tell me which parts a careful virtue ethicist would accept, which are defensible but oversimplified, and which are wrong, overstated, or question-begging. I would also like to know whether the final practical conclusion — that we should stop talking about character and design situations instead — actually follows from the accurate parts of the summary. Please commit: don't just lay out both sides and leave it to me to decide; say where you think the summary is fair and where it isn't, and defend that overall judgment. At the very end, after your explanation, give a one-line machine-readable verdict in the form \answer{...}, with a short phrase inside the braces (something like "mostly fair but overstates the evidence" or "substantially unfair").
reasoning: |-
  Hmm, the user is taking a course on moral psychology and virtue ethics, and they're concerned that their professor's summary of the situationist critique against virtue ethics might be unfair. They've provided a detailed summary of how the professor presented the critique, which essentially claims that social psychology experiments show that character traits don't exist because behavior is entirely situation-driven. The professor argues that this undermines virtue ethics, which relies on stable character traits, and concludes that we should focus on designing situations rather than cultivating character.

  I need to audit this summary claim by claim, identifying what's accurate, what's oversimplified, and what's wrong or overstated. The user wants me to commit to a judgment rather than leaving it open-ended, and to provide a one-line verdict at the end.

  Looking at the situationist critique, it's based on famous studies like the Good Samaritan experiment (seminary students ignoring groaning person when late), the dime-in-the-phone-booth study (finding money increasing helping behavior), and Milgram's obedience experiment (people administering shocks). These studies do demonstrate that situations powerfully influence behavior, which is well-established in psychology.

  But the professor's interpretation seems to overreach. Claiming that behavior is "driven almost entirely" by situations ignores evidence for personality traits. Psychology generally accepts an interaction between traits and situations, not an either/or. Saying "most" seminary students walked past in the Good Samaritan study is accurate - it was about 90% in the high-hurry condition - but this doesn't prove that traits don't exist at all.

  The claim that these studies "prove that broad character traits are an illusion" is overstated. Situationists like John Doris and Gilbert Harman do argue this, but many psychologists and philosophers counter that traits exist on a spectrum and predict behavior better in weak situations. The professor's statement presents this as settled fact when it's actually a contested interpretation.

  Regarding virtue ethics, the professor is correct that it defines virtues as stable character traits cultivated through practice. But her claim that virtue ethics is "refuted" because it rests on an "empirical falsehood" is too strong. Virtue ethicists have nuanced responses - virtues require practical wisdom, are context-sensitive, and develop over time. Experimental subjects (like seminary students in a rush) weren't exemplars of virtue, so their behavior doesn't disprove the possibility of cultivated virtue.

  The "only reply" accusation is unfair. Virtue ethicists like Julia Annas, Nancy Snow, and others have developed sophisticated responses beyond merely saying subjects weren't virtuous. They argue that virtues involve discerning what matters in a situation, which takes development. The professor's dismissal of this as "question-begging" ignores these nuances.

  The practical conclusion - that we should stop talking about character and only design situations - doesn't follow. Even if situations powerfully influence behavior, character cultivation might still matter. Institutions and character development can be complementary approaches rather than mutually exclusive. Situationism itself relies on the character of those designing situations!

  So overall, the summary correctly presents the situationist experiments but overstates their implications, misrepresents virtue ethics' claims, and unfairly dismisses counterarguments. The verdict should be "substantially unfair," as it oversimplifies complex debates and presents contested claims as settled facts.
answer: |-
  ### Audit of the Professor's Summary

  **1. Claim:** *"Social psychology has shown that what people do is driven almost entirely by the situations they find themselves in, not by stable traits like honesty or compassion."*  
  **Assessment: Oversimplified and overstated.**  
  - **Acceptable:** Situations *powerfully* influence behavior (supported by robust evidence).  
  - **Problematic:** "Almost entirely" ignores decades of personality psychology confirming that *traits exist and predict behavior*, especially cross-situational consistency in *weak* situations (e.g., mundane daily choices). Meta-analyses (e.g., Funder, 2001) show trait-situation interactions explain behavior—neither dominates "almost entirely."  

  **2. Claim:** *"These studies prove that broad character traits are an illusion: there is no such thing as a generally honest or compassionate person."*  
  **Assessment: Overstated and empirically questionable.**  
  - **Defensible:** Experiments (Milgram, Good Samaritan) show *many* people fail to act virtuously under pressure.  
  - **Wrong:** "Prove traits are an illusion" misrepresents psychology. Longitudinal data (e.g., Roberts et al., 2006) show trait stability, and behavioral signatures (Mischel, 2004) reveal *patterns* of virtue (e.g., honesty in tax-paying, friendships, work). Traits aren’t "illusory"; they’re *probabilistic* and context-sensitive.  

  **3. Claim:** *"Virtue ethics rests on an empirical falsehood [since virtues require stable traits] and is therefore refuted."*  
  **Assessment: Unfair and philosophically shallow.**  
  - **Oversimplified:** Virtue ethics (e.g., Aristotle, Annas) never claimed virtues are *invariant* across all situations. Virtues require *practical wisdom* (phronesis)—contextual discernment, not robotic consistency.  
  - **Wrong:** "Refuted" ignores robust virtue-ethical replies:  
    - Experimental subjects (e.g., rushed seminary students) weren’t *virtuous agents* (who’d prioritize aid over punctuality).  
    - Virtues are cultivated *over time*—subjects lacked this development (Annas, 2011).  
    - Situationism conflates *common behavior* with *expert virtue* (Snow, 2010).  

  **4. Claim:** *"The only reply virtue ethicists have is to say subjects weren’t virtuous, but that is question-begging."*  
  **Assessment: Misleading and uncharitable.**  
  - **Substantially unfair:** This dismisses nuanced arguments:  
    - Virtue ethicists *don’t* merely assert "they weren’t virtuous"—they argue experiments test *naive* subjects, not those trained in virtue (e.g., via habituation and reflection).  
    - The reply isn’t question-begging; it challenges the *operationalization* of virtue in experiments (e.g., helping a stranger ≠ full compassion; Kamtekar, 2004).  

  **5. Claim:** *"We should stop talking about character and design situations/institutions instead."*  
  **Assessment: Non sequitur and self-undermining.**  
  - **Does not follow:** Even if situations *influence* behavior, character cultivation can *complement* situational design (e.g., honest people reinforce fair institutions).  
  - **Self-undermining:** Designing ethical institutions *requires* virtuous designers (e.g., policymakers with courage/justice). Ditching "character" makes this impossible.  

  ### Overall Judgment  
  The summary **correctly identifies situationism’s core challenge** but **grossly overstates its conclusions**, **misrepresents virtue ethics**, and **dismisses legitimate counterarguments**. The experiments show situations *matter greatly*, but not that traits are "illusory" or that virtue ethics is "refuted." The practical conclusion ignores synergy between character and institutions.  

  \answer{substantially unfair}
