answer: |-
  ## Sestina of the Unseen Hand

  Before the cracks appeared in reason's wall,
  We saw the world through purpose, clear **design**:
  Each wing, each leaf, a proof of conscious **mind**,
  Reflecting cosmic artistry, a **rule**
  That banished randomness and outlawed **chance**.
  All things obeyed a preordained **order**,
  No intricate effect lacked cause: no **machine**
  Could match the subtlety of nature's **machine**.

  The Maker knew the function, held the **design**,
  His perfect understanding shaped the **order**,
  No element was left to random **chance**,
  Each part conceived by an omniscient **mind**.
  Creation followed an eternal **rule**,
  Rejecting entropy's chaotic **chance**.

  But Darwin traced the pattern's hidden **rule**:
  Not foresight, but the grinding press of **chance**
  On countless forms, a vast, unthinking **machine**
  Of life and death. The intricate **design**
  Emerging from the blind, selective **order**
  That favors function, needing no grand **mind**.

  The beetle's shell, the orchid's bloom – no **mind**
  Conceived their fit. A slow, relentless **rule**
  Of winnowing by life, a stern **order**
  Imposed by circumstance, not plan. Pure **chance**
  Provided variation; harsh **design**
  Was etched by time, a cold, emergent **machine**.

  Then Turing asked: what *is* this thinking **mind**?
  Could symbols shuffled, governed by a **rule**
  (Without intent, without a guiding **mind**),
  Mimic reflection? Build a logic **machine**
  Whose output seems like purpose, like **design**,
  Through structured steps, a coded **order**?

  He showed the gears could turn in strict **order**,
  Process instructions, follow coded **rule**,
  Solve problems step-by-step, a **machine**
  Achieving tasks that baffled human **mind**,
  Displaying competence without **design**
  Or inner grasp, just symbol, path, and **chance**.

  The world's deep **order**, once from **mind** conceived,
  Now blooms from **chance**, by **rule** and time confined.
  This **machine** of thought, your **design** perceived?
