answer: |-
  Below is a structured in-class game designed to elicit the surprise exam paradox through student-driven backward induction. The activity uses a real surprise quiz with extra credit/candy rewards, emphasizes coordinated reasoning, and includes a debrief linking the experience to the paradox. Total runtime fits within 75 minutes.

  ---

  ### **Materials & Setup**
  1. **Envelope**: Seal a note with the quiz day (e.g., "Wednesday") inside. Show it to students at the start.
  2. **Prediction Sheets**: For each student, a grid:
     ```
     Day:   | Mon | Tue | Wed | Thu | Fri |
     Prediction: |     |     |     |     |     |
     Confidence: |     |     |     |     |     |
     ```
     *Predictions:* **Y** (quiz today) or **N** (not today).  
     *Confidence:* **H** (High) or **L** (Low).  
  3. **Quiz**: A trivial 1-question handout (e.g., "What is 1+1?").  
  4. **Payoff Scheme** (non-monetary):  
     - Correct **Y** (quiz occurs): **+3 points**  
     - Correct **N** (no quiz): **+1 point**  
     - Wrong **Y** (no quiz, overconfident): **-2 points**  
     - Wrong **N** (quiz occurs): **0 points**  
     *Points convert to extra credit (e.g., 1 pt = 0.1% final grade) or candy.*

  ---

  ### **Rules & Timeline**  
  **Total: 75 minutes**  
  1. **Introduction (5 min)**  
     - Announce: "There will be a surprise quiz on one day next week—Mon, Tue, Wed, Thu, or Fri. I’ve committed to the day in this sealed envelope. Each morning, you’ll predict if the quiz is that day and your confidence. Scoring rewards correct predictions but penalizes overconfidence."  
     - Clarify: "Surprise means you won’t *know for certain* the quiz is today until I announce it."  

  2. **Deliberation Phase (15 min)**  
     - Students openly discuss/coordinate predictions as a group.  
     - Teacher prompts: "Plan together: Can the quiz be on Friday? Why? What about Thursday?"  
     - *Goal:* Induce backward induction:  
       > "If no quiz by Thu, Friday can’t be a surprise → Rule out Fri.  
       > If no quiz by Wed, Thu would be known → Rule out Thu.  
       > ... Thus, no day works!"  

  3. **Simulation (25 min)**  
     - Simulate each day in order (Mon → Fri). Each "day" takes 3-5 min:  
       - **Predict**: Students fill prediction/confidence for the day.  
       - **Collect**: Teacher gathers predictions.  
       - **Reveal**: If no quiz, say "No quiz today." If quiz day, distribute the quiz.  
     - **Quiz Day**: Stop after the quiz. Collect sheets.  
     - *Teacher’s Role:* Execute the pre-committed day regardless of predictions.  

  4. **Scoring & Quiz (5 min)**  
     - Grade the trivial quiz (all get credit).  
     - Calculate points using the payoff scheme.  

  5. **Debrief (25 min)**  
     - **Key Questions**:  
       1. "What was your group’s initial reasoning? Did you use backward induction?" *(Elicit: They ruled out Fri, then Thu, etc.)*  
       2. "Why did you conclude the quiz was impossible? What assumptions did you make?" *(Highlight: Self-referential knowledge of future reasoning.)*  
       3. "Were you *actually* surprised? How does psychological surprise differ from the ‘unknowability’ in your argument?"  
       4. "The announcement had two parts: (A) Quiz happens, (B) It’s a surprise. How did your reasoning undermine (B), and how did (B) undermine itself?"  
       5. "What resolves the paradox? Was the quiz impossible, or was your reasoning flawed?"  
     - **Lecture Link**: Map to the paradox:  
       - Premises: (A) Existence + (B) Surprise.  
       - Backward induction relies on students knowing their future epistemic states (e.g., "On Thu, I’ll know it’s Thu or Fri").  
       - Flaw: The argument assumes (B) is true to disprove (B), creating self-reference.  
       - Key Insight: "Surprise" is psychological, not logical impossibility. The quiz *can* occur if students doubt the induction (e.g., by accepting Friday as possible).  

  ---

  ### **Expected Failure Modes & Mitigation**  
  1. **Student "Spoils" the Day**:  
     - *Risk:* One student predicts "Y" on the quiz day, "proving" it wasn’t a surprise.  
     - *Response:* "This mirrors real life—coordination isn’t perfect. The paradox assumes idealized cooperation. Let’s discuss: Does one person’s certainty void surprise for everyone?"  

  2. **Group Refuses to Coordinate**:  
     - *Risk:* Students ignore backward induction, predict randomly.  
     - *Response:* Seed the induction: Ask leading questions during deliberation (e.g., "What happens if we reach Thursday?"). If they abstain, run the quiz and use their disorganization to show why coordination is central to the paradox.  

  3. **Cries of "Teacher Lied!"**:  
     - *Risk:* Students claim the quiz wasn’t a surprise if some predicted "Y."  
     - *Response:* Clarify pre-commitment: "The envelope proves I didn’t lie. The paradox hinges on *your* certainty, not mine. If you predicted ‘Y’ but others didn’t, were *they* surprised? Surprise is subjective."  

  4. **Quiz Day "Known" Early**:  
     - *Risk:* Students deduce the day mid-week (e.g., after Mon/Tue).  
     - *Response:* "This is expected! The paradox assumes perfect deduction. In practice, we often doubt our premises—e.g., ‘Maybe Friday is possible after all?’"  

  ---

  ### **Limitations & Contested Elements**  
  - **Idealized Epistemology**: The activity cannot replicate perfect common knowledge. Students may distrust peers or doubt backward induction, preventing the "impossibility" conclusion.  
  - **Contested Reading**: Assumes the backward induction is sound until undermined by its own conclusion (a "faulty reasoning" resolution). Critics who argue surprise is always possible (e.g., by probabilistic uncertainty) may find the setup biased.  
  - **Surprise Definition**: Uses predictions as a proxy for knowledge, but "not knowing" ≠ "predicting N." Debrief must distinguish logical unknowability from psychological surprise.  

  ---

  ### **What Would Change the Design?**  
  - **Objection**: "The students’ predictions affect the surprise, making the announcement self-referential." → If this critique arises, restructure to a **teacher-student Nash equilibrium** model: Let students vote predictions daily, and require the quiz to occur only if <50% predict "Y." This forces the teacher to avoid high-prediction days.  
  - **Alternative Resolution**: If the class debates **probabilistic surprise** (e.g., "Friday is unlikely but possible"), shift scoring to reward probability assignments (e.g., 0–100% scale with quadratic scoring).  
  - **Empirical Failure**: If backward induction rarely occurs, add a **warm-up round** with a 2-day paradox to prime reasoning.  

  ---

  This design forces students to confront the paradox’s self-destructive logic through lived experience, setting the stage for deeper philosophical analysis. By committing to the day in advance and embracing prediction errors, you create a memorable, paradox-driven lesson.
