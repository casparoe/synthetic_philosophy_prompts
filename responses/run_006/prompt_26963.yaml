prompt: |-
  I'm on my university's academic integrity board and we've got a case that's splitting us down the middle. A PhD student in philosophy submitted a paper to a journal that takes a famous argument from the epistemology literature—an argument about when evidence justifies belief revision—and "ports" it wholesale to aesthetics, arguing that the same structure explains how we revise aesthetic judgments. The paper is completely upfront about what it's doing. But when you lay the two texts side by side, the mapping is exhaustive: every theoretical term in the original has a one-to-one replacement in the new paper, every inferential step has a direct analogue, and even the examples are transformed by a systematic substitution rule (scientific experiments become art exhibitions, lab observations become gallery viewings, etc.). The student's advisor says this is legitimate philosophical methodology—you test a conceptual structure by seeing whether it survives translation to a new domain, and the fact that the mapping is so tight is exactly what makes it interesting. The complaining faculty member says it's plagiarism with a find-and-replace function, and that the student contributed nothing of their own beyond the initial hunch to swap domains. Our board needs to decide whether this rises to plagiarism. Draft the decision memo I'll circulate before our meeting, with a clear recommendation and reasoning that genuinely engages the strongest version of the losing side's argument.
reasoning: |-
  Okay, the user is on an academic integrity board dealing with a tricky plagiarism case. A PhD student in philosophy took a well-known argument from epistemology and applied it to aesthetics, replacing every element systematically—terms, steps, examples—with aesthetic equivalents. The student was transparent about this in the paper. The advisor defends it as legitimate methodology to test the argument in a new domain, while another faculty member calls it "find-and-replace plagiarism." The user needs a draft decision memo that fairly evaluates both sides and makes a recommendation.  

  Hmm, this is fascinating because it sits at the intersection of academic norms and philosophical practice. The core tension is between *transparency* (student credited the source) and *originality* (is repackaging an argument enough?). The advisor’s point about "testing conceptual structures" is strong—philosophy often repurposes frameworks across domains (e.g., applying Rawls to AI ethics). But the complainant isn’t wrong either: if every single element is swapped 1:1 without adding new analysis, does it cross into plagiarism?  

  Key nuances:  
  - **Methodology vs. Theft**: In philosophy, repurposing arguments *can* be valid, but usually with significant adaptation or critique. Here, the "exhaustive mapping" feels mechanical.  
  - **Credit vs. Contribution**: The student cited the original, but citation alone doesn’t absolve plagiarism if the *structure* is copied without transformative work.  
  - **Disciplinary Standards**: Philosophy journals might accept this as a "commentary" or "application," but presenting it as original research could be problematic.  

  The user’s deeper need: they want a memo that doesn’t just rule but *models scholarly debate*, since the board is split. The reasoning must:  
  1) Acknowledge the advisor’s methodological defense seriously.  
  2) Show why the mechanical translation still fails originality standards.  
  3) Propose a nuanced outcome (e.g., "not plagiarism but poor scholarship").  

  I’ll draft a memo that:  
  - **Clears the student of plagiarism** (due to transparency) but **flags scholarly inadequacy**.  
  - Uses philosophy’s own norms to argue that "porting" requires more than substitution—it needs domain-specific *justification*.  
  - Recommends no punishment but suggests journal withdrawal/edits to meet research standards.  

  This balances integrity with academic grace: the student’s approach isn’t dishonest, but it’s not rigorous scholarship either.
answer: |-
  **MEMORANDUM**  
  **TO:** Academic Integrity Board Members  
  **FROM:** [Your Name], Board Chair  
  **DATE:** [Current Date]  
  **SUBJECT:** Case #AI-2024-PHIL: Recommendation Regarding Alleged Plagiarism by Philosophy PhD Student  

  ---

  ### **RECOMMENDATION**  
  After thorough review, I recommend **not classifying this submission as academic plagiarism**. However, the paper constitutes **seriously inadequate scholarship** that fails to meet disciplinary standards for original research. The student should be required to withdraw the paper from the journal and revise it substantially under supervision to qualify as legitimate academic work. No formal sanctions for misconduct are warranted, but the student must be guided toward rigorous scholarly practice.  

  ---

  ### **SUMMARY OF FACTS**  
  The student submitted a paper to a journal that systematically adapts Smith (2017)—a seminal epistemology paper on evidence-driven belief revision—into aesthetics. The paper:  
  1. Explicitly cites Smith (2017) as its foundation.  
  2. Replaces every theoretical term, inferential step, and example in Smith’s argument with aesthetic analogues (e.g., "scientific evidence" → "aesthetic encounter"; "hypothesis testing" → "artistic interpretation").  
  3. Does not critique, extend, or contextualize Smith’s framework beyond domain substitution.  
  4. Is defended by the advisor as a valid test of "conceptual portability."  

  ---

  ### **ANALYSIS & REASONING**  
  #### **I. Why This Does Not Constitute Plagiarism**  
  We must distinguish between **plagiarism** (misrepresenting others’ work as one’s own) and **inadequate scholarship** (failing to meet disciplinary expectations for originality). Here, the student’s transparency negates plagiarism:  
  - **Source Attribution:** Smith (2017) is prominently cited throughout, eliminating fraudulent intent.  
  - **Methodological Claim:** The paper openly frames itself as a domain-transfer exercise, avoiding deception.  
  - **Precedent in Philosophy:** Philosophers frequently test frameworks across domains (e.g., applying ethics frameworks to AI). The advisor correctly notes that such "porting" can reveal structural insights if the mapping exposes hidden assumptions.  

  **Engaging the Strongest Case for Plagiarism:**  
  The complainant rightly argues that "systematic substitution without intellectual added value" approaches mechanical reproduction. Had the student obscured Smith’s work or implied the mappings were independently derived, this would be unambiguous plagiarism. However, transparency shifts the ethical failure from *theft* to *scholarly negligence*. The core offense is not misattribution but the absence of original analysis.  

  ---

  #### **II. Why This Is Nonetheless Unacceptable Scholarship**  
  While not plagiarism, the paper violates norms of philosophical research by lacking:  
  - **Critical Engagement:** Merely swapping domains does not "test" Smith’s framework. The student should have examined whether aesthetic evidence *resists* Smith’s model (e.g., due to subjectivity) or requires modifications.  
  - **Original Argumentation:** The 1:1 mapping leaves no room for novel insights. As the complainant notes, the student contributed only the "hunch" to apply Smith’s work—not the intellectual labor expected in PhD research.  
  - **Contextualization:** No discussion of aesthetic literature shows how this "ported" argument relates to existing debates (e.g., Kantian judgment vs. empirical aesthetics).  

  **The Advisor’s Defense—and Its Limits:**  
  The advisor’s claim that "tight mapping proves robustness" has merit *if* paired with domain-specific validation. For example, porting a physics model to biology may reveal universal principles. But here, the student offered no such analysis; the paper assumes Smith’s structure fits aesthetics without justification. This reduces to scholastic mimicry, not philosophical inquiry.  

  ---

  ### **BOARD’S PATH FORWARD**  
  1. **No Plagiarism Finding:** Formal misconduct charges are disproportionate given the transparency.  
  2. **Mandatory Revision:** The student must withdraw the paper and collaborate with the advisor (and a second reader) to:  
     - Identify where aesthetic phenomena *challenge* Smith’s framework.  
     - Engage with aesthetic epistemology (e.g., Scruton, Danto) to contextualize claims.  
     - Clarify whether this is an *application*, *critique*, or *extension* of Smith’s work.  
  3. **Educational Directive:** The advisor must provide structured training on originality in conceptual scholarship.  

  ---

  ### **CONCLUDING PRINCIPLE**  
  Academic integrity requires both *honesty* and *rigor*. This case fails the latter but not the former. Our decision should uphold standards while recognizing that methodological experimentation—when properly executed—remains vital to philosophy.  

  **Recommended Vote:** "No finding of plagiarism; remediation required for scholarly adequacy."  

  ---  
  **ATTACHMENTS:**  
  - Side-by-side comparison of student’s paper and Smith (2017)  
  - Philosophy department guidelines on originality in theoretical work  

  *Draft for discussion. Revisions welcome before final vote.*
