       a. Intrinsically identical (same size, shape, mass, composition, etc.),
       b. Spatially related by being at a fixed distance from each other (say, 5 meters) with no other objects or structures to break symmetry,
       c. And numerically distinct.

   4. The dispute is over whether Black's scenario is possible and, if possible, whether it constitutes a counterexample to PII.

   5. The following would settle the dispute:
       a. A proof that the scenario described by Black is impossible (for example, due to logical or metaphysical necessity) would support Dr. A's view and refute Dr. B's.
