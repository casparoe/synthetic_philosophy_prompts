  - **Key Lines for Quoting**:  
    - §II, Table: Thorne’s "asymmetric relations are irreducible" vs. Voss’s "artifacts of description."  
    - §III, Crux 2: The spacetime dependency.  
    - §IV: The "residual disagreement" paragraph.  
  - **Subtext**: Both philosophers resent the bureaucratic mandate but take intellectual satisfaction in the sharpened dialectic.
