  Given the above, I propose the following principle:

  **Principle: Economic desert is determined by the degree of responsible agency exercised, including effort, risk-taking, and the application of skill and judgment, but excluding the effects of brute luck. When social practices assign benefits based on outcomes, those benefits are deserved only to the extent the outcome reflects responsible agency and not brute luck.**

