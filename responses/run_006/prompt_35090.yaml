  Here is the tension I see and cannot resolve on my own. Cases "talent" and "lucky_market" seem to pull in opposite directions. In "lucky_market," equal effort plus unequal luck means equal desert — the luck of the market shouldn't matter. But in "talent," equal effort plus unequal natural talent (which is itself a form of luck — genetic and early-environmental luck) yields unequal desert: the talented student deserves the A and the untalented one does not, even though the talent gap is no more chosen than the regulatory change. If I say that unchosen luck should not affect desert, "talent" looks like a counterexample. If I say that outcomes partly determine desert, "lucky_market" looks like a counterexample. I need to know which way to go, or whether there is a third option I am missing.

