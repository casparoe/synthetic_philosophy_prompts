  We are given a set of cases with verdicts and a tension between "talent" and "lucky_market". The goal is to extract a principle that best captures the verdicts, and to resolve the tension.

  After analyzing the cases, we can see a pattern:

  1. **Plumber vs. Heir**: The plumber deserves what he has because of his work and saving. The heir's wealth is not unjust because of voluntary transfers, but the plumber deserves his wealth more. This suggests that desert is tied to effort and contribution, but also that justice might be about how wealth is acquired (voluntarily) rather than desert per se.

  2. **Talent**: The A student deserves the A because of the outcome (grade) but the B student deserves more recognition for effort. This seems to value both outcome (the grade) and effort (recognition).

  3. **Lucky Market**: Two entrepreneurs with equal effort and skill but different luck have equal desert. This strongly emphasizes that luck (in this case, market luck) should not affect desert, so desert is based on what they put in (effort, skill) and not the outcome.

  4. **Persistent Inventor**: The inventor deserves the reward because of her risk, persistence, and skill. Again, effort and intentional action are key.

  5. **Lucky Inventor**: This inventor deserves some reward (because he did make the discovery and had insight) but less than the persistent inventor. This suggests that even when luck is involved, the agent's actions (recognizing the value) matter, but without the effort and risk, the desert is less.

  6. **Connected Candidate**: The second candidate deserved the job more because she overcame more (effort under adversity) but the hiring decision was not unjust because the manager didn't know. This again points to effort and overcoming obstacles as desert bases, but also that institutional justice might be about the process.

  7. **Negligent Driver**: This case is included to test whether desert tracks choices or outcomes. The verdict is that the negligent driver deserves more moral blame even though he caused less harm. This strongly suggests that desert (at least moral desert) is about choices (the decision to text) and not outcomes.

  The tension is between "talent" and "lucky_market":
  - In "talent", the A student gets the A because of natural talent (which is luck) and the B student gets a B despite more effort. The verdict says the A student deserves the A and the B student the B, which seems to accept that the outcome (grade) is deserved even though talent is luck. But in "lucky_market", the verdict says that two entrepreneurs with equal effort and skill but different outcomes due to luck have equal desert. So why does the talent luck lead to unequal desert (the A and B) but the market luck does not?

  We must resolve this tension.

  Proposed Principle: 
  **Desert is based on the quality of one's agency, which includes effort, risk-taking, and the exercise of skill and judgment, but not on brute luck. However, when the exercise of agency leads to outcomes that are socially recognized (like grades or market success), those outcomes may be deserved to the extent they reflect the agent's contribution, but not when they are distorted by factors beyond the agent's control.**

  But let's break it down:

  Clauses:

  1. **Desert is primarily grounded in the exercise of agency**: This includes effort, risk-taking, and the use of skill and judgment. (Motivated by: plumber, persistent inventor, lucky inventor (partial), connected candidate, negligent driver)

  2. **Brute luck (good or bad) should not affect desert**: When outcomes are determined by factors entirely beyond the agent's control, they do not add to or subtract from desert. (Motivated by: lucky_market, and also the talent case to some extent? But note the tension.)

  3. **Socially recognized outcomes (like grades, market rewards) can be deserved only to the extent they reflect the agent's contribution of agency**: If the outcome is influenced by brute luck, it does not reflect the agent's contribution and thus is not deserved. (This is from lucky_market and the contrast with talent.)

  But in the talent case, the grade is an outcome that is socially recognized and it reflects the agent's contribution (the A student did exercise agency and had the talent, but the talent is brute luck). However, the verdict in talent says the A student deserves the A. So we have a conflict.

  Alternative approach: 
  In the talent case, the grade is awarded based on performance (which is a function of talent and effort). The verdict says the A student deserves the A because the grade is a measure of achievement. But the B student deserves more recognition for effort. This suggests two kinds of desert: 
  - Desert for the outcome (the grade) which is based on achievement (which includes talent and effort) 
  - Desert for effort (which is independent of outcome)

  But then in the lucky_market case, why don't we say the successful entrepreneur deserves the wealth because of the outcome (business success) even though it was luck? The verdict explicitly says they have equal desert.

  So perhaps we need to distinguish between two types of desert:

  - **Achievement-based desert**: When a social institution (like a university or the market) awards a benefit based on a performance metric, the benefit is deserved if it accurately reflects the performance. This performance might include factors beyond control (like talent) but the institution is designed to reward that performance. (This would explain the talent case: the A student performed better, so deserves the A.)

  - **Effort-based desert**: Independent of outcome, effort and sacrifice deserve recognition and reward. (This would explain the B student deserving more recognition, the plumber deserving his savings, the persistent inventor deserving the reward, and the connected candidate who worked harder deserving the job more.)

  But in the lucky_market case, the market is also a social institution that rewards performance (business success). However, the verdict says that the two entrepreneurs have equal desert because the difference was due to luck. So we must say that the market outcome in that case did not reflect their agency because the luck was brute (they had the same skill, effort, and the regulatory change was unexpected and not due to their actions). 

  Therefore, the principle might be:

  **Principle: Desert is based on the exercise of agency (effort, risk-taking, skill, and judgment) and on outcomes that are caused by that agency. When outcomes are influenced by brute luck (factors beyond the agent's control), they do not contribute to desert. However, in social practices that assign rewards based on performance (like grading or market competition), the reward is deserved to the extent the performance is a result of agency and not brute luck.**

  Now, to resolve the tension:

  - In "talent": The grade is a reward for performance. The performance (getting an A) is a result of the student's agency (studying) and also natural talent (brute luck). The principle would say that the part of the performance due to brute luck does not contribute to desert. Therefore, the A student deserves the A only to the extent the performance was due to agency (which includes the effort and the exercise of the talent, but note: the talent itself is not agency). This might lead to the conclusion that the A student does not fully deserve the A because part of it was due to luck. But the original verdict says the A student deserves the A. So we have a problem.

