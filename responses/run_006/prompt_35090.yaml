  I'm a political philosopher, and I've been trying for years to get clear about what I actually think about economic desert — when someone deserves an income, a job, a prize, or a particular level of wealth, and why. I've found that going case by case gets me further than arguing from first principles, but only if I can eventually see the principle that my cases are pointing toward. I'd like you to extract that principle for me, or tell me candidly that no single principle can capture all my verdicts and which ones I should abandon.

