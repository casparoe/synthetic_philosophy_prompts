prompt: |-
  You are an expert in the philosophy of cognitive science and in classical AI planning, writing for a reader who knows the difference between the logical frame problem and the philosophical one. Think carefully, and before settling on a scenario, brainstorm two or three candidate setups and pick the one that isolates the intended variable most cleanly.

  Construct a thought experiment that isolates the frame problem in its relevance/inference form. Constraints: the setting is ordinary (a kitchen, a workshop, an office); the first agent is a logically competent but relevance-blind reasoner whose world model is complete and correct, and whose design is the textbook frame-axiom solution applied literally — before acting, it must establish for each fluent in its world model and each action in its plan that the fluent is either changed by an effect axiom or preserved by a persistence axiom. The action it must perform is obvious to an ordinary human from the same facts. The agent nevertheless misses its deadline, and the delay must come specifically from the burden of establishing the non-relevance of a huge number of would-be side effects — not from search over actions, uncertainty, missing facts, sensor error, limited memory, or a slow inference engine. Add a second agent that uses a relevance heuristic and acts in time, and include a minimal variation of the scenario in which that heuristic fails in a way the frame-axiom agent would not.

  Keep the scenario itself to one paragraph. After it, walk through both agents' reasoning, state explicitly which feature of the case does the work, and say how a defender of explicit frame axioms would push back.

  Begin your response with your bottom line in the first sentence — whether the case meets the specification and what the load-bearing feature is — and then give the reasoning, with no preamble and no restating of the prompt.
