  Okay, the user's query is quite intricate and touches on both personal and philosophical dimensions. Their cousin served in Iraq, and they've been arguing about whether his participation in a war now deemed unjust was morally wrong. The user has encountered the concept of "moral equality of combatants" in just war theory and wants a detailed breakdown of its claims, potential overstatements, and criticisms—particularly from revisionists like McMahan. They also seek clarity on whether the comforting conclusion—that one can condemn the war while honoring soldiers—holds up under scrutiny. Underlying this is a desire for reconciliation with their cousin but also a fear of accepting a convenient untruth.  

  First, I need to parse the quoted passage carefully. The core claims are: (1) *jus ad bellum* (justice of war) and *jus in bello* (conduct in war) are strictly independent; (2) soldiers on just/unjust sides have identical moral permissions/prohibitions; (3) soldiers cannot be expected to judge their nation's cause; (4) following lawful orders absolves responsibility; (5) soldiers on both sides may kill enemy combatants but not civilians; (6) soldiers aren’t personally responsible for war crimes. The passage presents these as unified doctrine, but I know the tradition is messier.  

  For a careful defender like Michael Walzer, claims (1), (2), and (5) are central: combatants share equal status regardless of their war's justice, grounded in the mutual imposition of risk and state authority. But (3) and (4) are weaker supports—Walzer admits soldiers *can* sometimes discern injustice (e.g., clear aggression), and "lawful orders" alone don’t resolve moral dilemmas. Claim (6) is oversimplified; even traditionalists hold soldiers responsible for *in bello* crimes (e.g., massacring civilians).  

  McMahan’s revisionism attacks the independence thesis at its root. He argues that *ad bellum* injustice contaminates *in bello* permissions: unjust combatants lack the right to kill because their violence isn’t defensive. His key move is rejecting the symmetry—unjust combatants are morally akin to criminal aggressors. He’d say the passage’s error starts at the very premise of separating the two *jus*.  

  The user’s emotional stake is palpable. They want peace with their cousin but fear self-deception. I should affirm that the traditional view *does* support honoring soldiers individually (for courage, loyalty) while condemning the war—this isn’t just a soothing myth. But I must also note McMahan’s challenge: if the cousin *knew* the war was unjust, his participation might carry moral weight. Still, in practice, soldiers operate under epistemic and institutional constraints that complicate blame.  

  Ultimately, the reconciliation can hold. Even McMahan stresses that most soldiers aren’t culpable for their state’s decisions. The user can separate condemnation of the Iraq War from respect for their cousin’s service—not as philosophical evasion, but as nuanced ethical realism.  

