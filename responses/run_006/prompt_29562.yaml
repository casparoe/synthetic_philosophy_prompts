answer: |-
  I understand why this passage resonates, especially given your desire to reconcile with your cousin. It presents a seemingly tidy resolution: condemn the war, honor the soldier. But your instinct to scrutinize it is wise. The description of the "moral equality of combatants" (MEC) doctrine captures a core, traditional view within just war theory, championed by thinkers like Michael Walzer, but it does so with some overstatements and elisions that a careful defender would qualify, and which revisionists like Jeff McMahan fundamentally challenge. Let's walk through it step by step.

  The passage accurately states the foundational claim: traditional just war theory strictly separates *jus ad bellum* (the justice of resorting to war) and *jus in bello* (justice in the conduct of war). A careful defender of MEC *would* emphatically endorse the core idea that this separation means the justice of the *cause* itself doesn't determine the moral *status* or *permissions* of the individual soldiers fighting. On this view, a soldier fighting for an unjust aggressor nation has the same moral *right to fight* (meaning, the same permission to kill enemy combatants) and is bound by the same *in bello* prohibitions (like not targeting civilians) as a soldier defending against that aggression. The reasoning hinges on two main pillars, though the passage slightly oversimplifies them:

  1.  **The "Blameless Ignorance" Argument:** The passage states soldiers "cannot be expected to judge whether their country's cause is just." A careful defender *would* accept this as a *general principle underpinning the doctrine*, but would likely acknowledge it's not an absolute shield. Walzer himself admits that in cases of blatant, undeniable aggression, the excuse of ignorance weakens. The emphasis is on the *institutional role* of the soldier and the presumption that states, not individual soldiers, bear the primary responsibility for *ad bellum* judgments in the complex fog of international politics. Soldiers are agents of the state, not independent moral arbiters of state policy at the moment of enlistment or deployment.
  2.  **The "Mutuality of Risk" Argument:** This is subtly implied but not explicitly stated in the passage. A core justification for MEC is that combatants, regardless of side, pose a lethal threat to each other and share a mutual vulnerability. They enter a state of "belligerent equality" on the battlefield. This mutual imposition of risk is what grants each combatant the *in bello* right to kill the other and imposes the *in bello* duty to distinguish themselves from civilians. The justice of *why* they are there is seen as irrelevant to this immediate, symmetrical relationship of threat.

  Now, where the passage overreaches or conflates:

  *   **"Only following lawful orders":** This is a significant overstatement presented as a core pillar. While following lawful orders is part of a soldier's duty, traditional MEC does *not* rely on "just following orders" as a blanket moral absolution, especially for *in bello* crimes. The Nuremberg Principles explicitly reject "following orders" as a complete defense for war crimes. MEC focuses on the *status* of combatants and the *permissibility of killing other combatants*, not on excusing violations of *jus in bello* rules. A careful defender would *not* say soldiers are automatically absolved by orders; they would insist soldiers remain responsible for *how* they fight, even if their *right to be fighting at all* is considered equal.
  *   **"Neither side's soldiers may be held personally responsible for the war's crimes":** This is a dangerous conflation. "The war's crimes" is ambiguous. A careful defender would *vehemently reject* the idea that soldiers are immune from responsibility for *war crimes they personally commit* (violations of *jus in bello* like torture, targeting civilians, etc.). However, they *would* argue that soldiers cannot be held criminally or morally culpable *simply for participating* in an unjust war (*ad bellum* crime) *under the MEC doctrine*. This sentence blurs the crucial distinction between *participation in an unjust war* (which MEC says doesn't make the soldier a criminal) and *commission of war crimes within the war* (for which soldiers are absolutely responsible).

  **Where McMahan's Revisionism Attacks:**

  Jeff McMahan fundamentally rejects the entire premise of MEC. He argues the separation of *jus ad bellum* and *jus in bello* is incoherent and morally unsustainable. His critique strikes at the very heart of the passage:

  1.  **The Core Error:** McMahan argues that the *permissibility of killing* hinges directly on the *justice of the cause*. If a war is unjust (like aggression), the combatants fighting for the aggressor lack a just cause. Therefore, their violence lacks justification. They are not acting in permissible self-defense or defense of others; they are initiating or perpetuating wrongful harm.
  2.  **Moral Inequality:** Consequently, McMahan asserts there is *no* moral equality. Just combatants (defenders) *do* have the right to kill unjust combatants (aggressors) because they are defending against wrongful attack. Unjust combatants, however, *do not* have the right to kill just combatants. Killing just defenders is akin to killing innocent people resisting aggression – it's murder.
  3.  **Undermining the Pillars:**
      *   **"Blameless Ignorance":** McMahan argues this is often overstated. While soldiers may face epistemic challenges and coercion, it doesn't erase the objective moral wrong of participating in an unjustified killing project. Ignorance might mitigate *culpability*, but not the fundamental *wrongfulness* of the act itself.
      *   **"Mutuality of Risk":** He rejects this symmetry. The threat posed by an unjust combatant is *illegitimate*; the threat posed by a just combatant is *legitimate* defense. Being threatened by someone you are wrongfully attacking doesn't grant you the right to kill them in self-defense; your own aggression negates that right.
  4.  **Responsibility:** While McMahan doesn't typically advocate prosecuting ordinary soldiers for mere participation in an unjust war (due to potential mitigating factors like duress, ignorance, and lack of alternatives), he *does* argue they share in the *objective moral responsibility* for the wrongful harms caused by that war. They are not mere instruments; they are agents whose choices contribute to an unjust enterprise.

  **Your Cousin and the Reassuring Conclusion:**

  So, does the comforting conclusion – condemning the war while honoring the soldier – survive?

  *   **Under Traditional MEC (the passage's core view):** Yes, robustly. The doctrine is designed to allow precisely this separation. You can condemn the Iraq War as a profound *ad bellum* failure (unjust aggression based on faulty intelligence) while honoring your cousin's service based on *in bello* virtues: courage, loyalty to comrades, adherence to the rules of engagement (assuming he fought honorably), and sacrifice. His moral status as a combatant is equal to that of an Iraqi soldier defending his country. The passage gets *this specific conclusion* right, even if it overstates the "following orders" part.
  *   **Under McMahan's Revisionism:** The conclusion becomes more nuanced and potentially uncomfortable. McMahan would argue that participating in an unjust war is, objectively speaking, participating in a wrongful enterprise of killing. Honoring the *combatant role itself* becomes problematic because that role, on the unjust side, lacks moral justification. However, McMahan himself emphasizes that *individual culpability* is a separate question. You can still recognize and honor your cousin's *personal virtues* displayed *within* that role – his courage, loyalty, suffering, perhaps his attempts to minimize harm – without endorsing the war or the *moral legitimacy of his role* as an unjust combatant. You can deeply respect *him* as a person, acknowledging the complexity of his situation, the bonds of loyalty, the institutional pressures, and the potential good faith he may have acted in (even if mistaken), while still believing the project he contributed to was objectively wrong. The honor shifts from the *fighting for the cause* to the *personal qualities and ordeal endured*, and the recognition that he, like many soldiers, was an agent operating within powerful, constraining structures not entirely of his own making.

  **In essence:** The passage accurately captures the core traditional doctrine of MEC and its intended social/political function of separating condemnation of war from respect for soldiers. However, it over-relies on "following orders" and dangerously conflates participation in an unjust war with commission of war crimes. McMahan shows that the traditional view's core separation is philosophically shaky, arguing that fighting for an unjust cause is inherently morally problematic. Yet, even for McMahan, this doesn't necessarily translate into blaming or dishonoring the individual soldier *as a person*, given the real-world complexities of their situation. You can condemn the Iraq War as unjust, acknowledge the moral problem inherent in participation highlighted by revisionists, and still deeply respect your cousin for his service, sacrifice, loyalty, and the personal qualities he demonstrated under extraordinarily difficult circumstances. The path to stopping the argument may lie less in proving one meta-ethical view definitively correct and more in this nuanced recognition of shared humanity and the terrible burdens of war.
