prompt: |-
  I have been trying to settle, on my own, whether I should take the claims of current science at something close to face value, and the thing that most troubles me is the pessimistic meta-induction: the pattern in which theories that were once extraordinarily successful were later discarded as false in central ways. I have read enough to see that people argue about this one historical case at a time — the caloric theory of heat, the luminiferous aether, phlogiston, Newtonian gravitation — and I cannot tell what would actually settle the dispute, because I have never seen a full statement of what a position would have to get right in the first place. So before I read any further, I want the desiderata: what must an adequate realist position about scientific knowledge deliver in order to survive the pessimistic meta-induction while still being genuinely realist — still holding that mature scientific theories are approximately true, or that their central terms typically refer to real things — rather than a disguised instrumentalism or a retreat to the view that science is merely useful?

  Give me the requirements list. For each requirement, give the case or consideration that forces it, and say whether it is non-negotiable or merely the preference of one camp. Distinguish the things a position cannot collapse into one another — for example, a theory's being false and its central terms' failing to refer, or predictive success and truth. Be explicit about which historical episodes any adequate position must handle and why. Then tell me whether some subset of these requirements cannot be jointly satisfied given the actual history of science; that is the part I most want, because if the list itself is inconsistent, that is a result rather than a failure. End with a committed judgment: which single requirement does the most to eliminate the standard positions, and which position — full realism, selective realism, structural realism, instrumentalism, or something else — comes closest to meeting the full list in your view. Take a definite position and give your reasons; do not lay out the options and leave me to choose. I am not asking for citations or a reading list; I want the reasoning itself.
reasoning: |-
  Okay, the user is grappling with the pessimistic meta-induction and wants a clear set of requirements for scientific realism that can withstand this challenge. They're frustrated with piecemeal historical debates and seek a structured framework. 

  First, I need to unpack why they're stuck. The meta-induction haunts them because successful past theories (caloric, ether, etc.) were discarded despite working well. They sense realists handwave these cases away while anti-realists exploit them. What they truly crave isn't just another "here's how realism survives" but a rigorous stress test: if realism can't meet certain criteria, it deserves to die.

  Hmm... their demand for "desiderata" is sharp. They want: 
  - Non-negotiable vs. debatable requirements 
  - Clear distinctions (e.g., reference failure vs. falsity) 
  - Which historical cases *must* be handled 
  - Whether the requirements are even jointly satisfiable 

  This is unusually sophisticated. They've likely read Stanford/Ladiman/Chakravartty but found loopholes. Their "committed judgment" demand suggests they've had enough of fence-sitting.

  *Constructing the framework*: 
  The core tension is truth vs. discontinuity. Realism needs continuity in success/truth, but history shows rupture. So requirements must enforce: 
  1. **Truth-tracking**: Success can't be accidental (blocks miracle argument evasion). 
  2. **Continuity**: Past theories must link to present ones (or meta-induction wins). 
  3. **Substance over utility**: Can't reduce to "just works" (that's instrumentalism). 
  4. **Referential anchor**: Central terms can't all be empty (phlogiston nightmare). 
  5. **No cherry-picking**: Can't dismiss "inconvenient" cases like ether. 

  *Historical landmines*: 
  - Newton → Einstein kills continuity if space/time are fundamental breaks 
  - Phlogiston shows core terms (oxygen vs. dephlogisticated air) can invert reference 
  - Caloric's math worked but ontology was wrong – so is math "approximately true"? 

  *The killer problem*: Requirement 2 (continuity) and 5 (no cherry-picking) clash. Structural realism (only equations survive) handles Newton-Einstein but fails phlogiston (no math to salvage). Entity realism (electrons survive) fails caloric (no "caloric fluid" entity). 

  *My verdict*: 
  The continuity requirement wrecks most realisms. Selective realism (only "working parts" are true) seems best but must explain *why* some parts survive while others don't without ad-hocery. If survival is just "what later science kept," it's circular. 

  ...Hence I'll push a hybrid: structural realism *plus* epistemic humility about ontology. Equations persist (F=ma → GR field equations) even if ontologies shift (absolute space → spacetime curvature). Phlogiston fails because its math (conservation principles) was absorbed, not discarded. This meets all requirements *except* full ontological commitment – but that's precisely what meta-induction forbids. 

  User might bristle at "ontological humility" sounding like retreat. But presenting it as "structural continuity as the backbone of realism" could feel substantive enough. After all, they want realism that doesn't self-destruct – not dogma.
answer: |-
  Below is a requirements list for a defensible scientific realism that withstands the pessimistic meta-induction (PMI), grounded in the historical and philosophical challenges you've raised. I’ll specify each requirement, its justification, negotiability, and key distinctions. Then I’ll test for consistency, identify the most consequential requirement, and end with a committed verdict.  

  ---

  ### **Core Requirements for an Adequate Realism**  
  *(Non-negotiable unless specified)*  

  1. **Approximate Truth Preservation Across Successive Theories**  
     - **Case forcing it**: Newtonian gravitation → General Relativity (GR). Newton’s theory succeeded for centuries but was falsified in domains like Mercury’s orbit. GR subsumed it under extreme conditions while preserving approximate accuracy in "normal" regimes (e.g., projectile motion).  
     - **Non-negotiable**: Realism collapses without continuity in truth-likeness.  
     - **Distinction**: Predictive success ≠ truth (e.g., epicycles predicted planets but were false). Truth must explain *why* success persists across theory change.  

  2. **Referential Stability for Core Theoretical Terms**  
     - **Case forcing it**: Phlogiston (failed reference: "phlogiston" → nothing) vs. Oxygen (successful: "dephlogisticated air" → O₂). Realism requires that *some* central terms refer (e.g., "electron" persisted from Lorentz to QED).  
     - **Non-negotiable**: Empty terms (e.g., "aether") undermine ontological commitment.  
     - **Distinction**: A theory can be false *while* its terms refer (e.g., Newtonian "mass" approximates relativistic rest mass).  

  3. **No Ad Hoc Historical Exemptions**  
     - **Cases forcing it**: Caloric (successful in thermodynamics) and Luminiferous Aether (foundational for Maxwell’s equations). Realism must explain why *these* theories were discarded without exempting them as "immature" or "non-real."  
     - **Non-negotiable**: PMI’s power comes from paradigmatic examples; excluding them is circular.  
     - **Distinction**: "Maturity" must be defined non-arbitrarily (e.g., sustained empirical success, not hindsight).  

  4. **Truth as the Best Explanation for Success**  
     - **Case forcing it**: The "miracle argument" (Putnam): If theories aren’t approximately true, their success is miraculous. PMI challenges this by showing past "miracles" (e.g., aether’s success in optics) were false.  
     - **Non-negotiable for realism**: Without this, realism reduces to instrumentalism ("success matters, truth doesn’t").  
     - **Distinction**: Predictive success ≠ best explanation (e.g., aether predicted light bending but misidentified the medium).  

  5. **Ontological Grounding for Structural Continuities**  
     - **Case forcing it**: Equations for caloric heat flow were retained in thermodynamics, but caloric fluid was abandoned. Realism must explain why mathematical structures persist (e.g., Fourier’s equations) while ontologies shift.  
     - **Negotiable**: Some realists prioritize structure over ontology (see below).  
     - **Distinction**: Structural continuity (equations) vs. ontological discontinuity (e.g., "caloric" → "kinetic energy").  

  ---

  ### **Can These Requirements Be Jointly Satisfied?**  
  **No—without concessions to selective or structural realism.** The history of science shows:  
  - **Newton → Einstein**: Satisfies (1) and (4) (approximate truth under limits), but strains (2) (e.g., "gravitational force" doesn’t refer in GR).  
  - **Caloric → Kinetic Theory**: Satisfies (5) (structural continuity in equations), but violates naive realism about ontologies (caloric fluid ≠ molecular motion).  
  - **Phlogiston → Oxygen**: Violates (2) if realism demands *all* core terms refer, but satisfies (4) if truth explains why phlogiston’s *effects* (e.g., combustion) were retained.  
  - **Aether → Relativity**: Falsifies (4) if truth is abandoned, but satisfies (5) (Maxwell’s equations were retained, shorn of aether).  

  **The inconsistency lies in requiring *all* past theories to be "approximately true" in their *full ontologies***. Caloric and aether force us to decouple structural/functional success from referential/ontological fidelity.  

  ---

  ### **The Most Eliminative Requirement**  
  **Requirement #3 (No Ad Hoc Exemptions)** eliminates:  
  - **Naive realism** (fails on caloric/aether).  
  - **Entity realism** (e.g., Hacking: "if you can spray it, it’s real") fails with aether (detected in 19th-century experiments but discarded).  
  - **"Maturity" defenses** (e.g., Psillos: "only mature theories count") if maturity is defined post hoc.  

  ---

  ### **My Committed Position: Structural Realism (Epistemic/Ladyman-Ross Variant)**  
  **Why it best meets the requirements**:  
  1. **Approximate truth**: Preserved in *equations/structures* (e.g., Newton’s gravity → GR’s weak-field limit).  
  2. **Referential stability**: Core terms refer to *structural relata* (e.g., "electron" refers to a node in a quantum field network, not a classical particle).  
  3. **No exemptions**: Caloric/aether are *not* approximately true ontologically, but their *mathematical structures* (e.g., wave equations) were retained.  
  4. **Truth as explanation**: Structural continuity explains success—e.g., Maxwell’s equations worked because they captured electromagnetic *relations*, not because aether existed.  
  5. **Ontological grounding**: Structures are ontologically prior (e.g., spacetime relations in GR, not "stuff" like aether).  

  **Why it beats alternatives**:  
  - **Selective realism** (e.g., Psillos): Claims "working posits" (e.g., molecular kinetic energy) survive. But in aether, *nothing* "worked" ontologically—only equations did.  
  - **Entity realism**: Ignores theoretical context (e.g., we "spray" electrons, but their nature changes radically from Bohr to QFT).  
  - **Instrumentalism**: Rejects (4), making success inexplicable.  
  - **Full-blooded realism**: Fails on (3) with caloric/aether.  

  **Weakness**: Structural realism struggles with *non-mathematical* sciences (e.g., biology), but your focus is PMI-driven cases (physics/chemistry), where it excels.  

  **Final Judgment**: PMI forces realism to retreat from *full ontological commitment* to *structural continuity*. The history of science shows structures persisting where ontologies do not—so structural realism is the minimal position that reconciles realism’s core intuition (success isn’t accidental) with historical discontinuity. If you demand that "electrons are *little balls*," realism fails; if "electron" names a stable structural role, it survives.
