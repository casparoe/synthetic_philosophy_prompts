  ### The "What Makes an 'A' an 'A'?" Quiz  
  Below is an interactive quiz designed to reveal your implicit theory of letter identity. For each scenario, select the option that best matches your intuition. No images are needed—cases are described in words.  

  **Question 1: Single-Storey vs. Double-Storey "a"**  
  You see a printed double-storey "a" (two enclosed loops) and a handwritten single-storey "a" (one open bowl, like "ɑ"). Are these:  
  A) The same letter.  
  B) Different letters.  
  C) The same letter only if used in the same word (e.g., in handwriting vs. print).  

  **Question 2: Blackletter "a"**  
