prompt: |-
  I work at a state environmental health agency, and my team has to issue guidance about whether a chemical or exposure should be restricted. The problem we keep hitting: the evidence is a mess. We've got maybe three or four studies — different designs, different populations, some show harm and some don't, and the ones that show harm can't agree on how big the effect is. We can't get a clean probability out of this, and when we try to force one we're basically making up numbers and then doing fancy math on them. Nobody on my team is a philosopher or a statistician — we're toxicologists and epidemiologists who need to make a call.

  I've been reading about imprecise probabilities — the idea that when your evidence is weak or conflicting, you should represent your uncertainty with a set of probabilities rather than a single number, and that this isn't a failure, it's being honest about what you know. But everything I've read is theory. I need something I can actually use.

  Please write me a decision procedure my team can follow when the evidence won't support a single probability distribution. It should be a step-by-step thing — questions to ask, in what order, what counts as a sufficient answer. It needs to handle the case where we have multiple studies that point in different directions and we can't just pool them. It should say when we can still make a recommendation and when the right answer is genuinely "we don't know enough to say" (which is politically uncomfortable but sometimes true). And it should flag the steps where we're making a judgment call rather than applying a rule.

  Then run the procedure on three cases:

  1. A new pesticide where we have one large epidemiological study showing a small increased cancer risk, two smaller studies showing no effect, and a toxicology study in rats showing liver damage at high doses. The manufacturer argues the epidemiological finding is chance.

  2. A food additive that's been used for decades: we have a huge observational study showing a modest health risk, but no mechanism has been identified, and the effect disappears when you control for overall diet quality. Consumer groups are pushing for a ban.

  3. A case where the procedure tells us we can't make a call — pick something realistic where the evidence is genuinely too thin, and show us what that looks like and why we shouldn't pretend otherwise.

  For the response structure, I'd like these sections in order:

  - The Procedure (about 800 words): the step-by-step, written so someone without stats training can follow it. Number the steps.
  - Why This Works (about 400 words): the conceptual justification, connecting each step to the imprecise probability ideas behind it, but keep it accessible.
  - Worked Cases (about 1200 words total across the three cases, roughly evenly split): run the procedure on each.
  - What This Can't Do (about 300 words): honest about the procedure's limits and the cases where even the procedure can't save us from having to make a judgment call.
reasoning: |-
  Okay, the user works at a state environmental health agency and is struggling with how to handle uncertain evidence when making decisions about chemical restrictions. They're frustrated because the evidence is often messy—conflicting studies, different designs, populations, and effect sizes—making it impossible to derive a single probability. They've come across imprecise probabilities but need a practical procedure, not just theory. 

  First, I need to understand their real needs. They want a step-by-step decision procedure that their team of toxicologists and epidemiologists can follow without deep stats or philosophy training. The procedure must handle conflicting studies, indicate when to say "we don't know," and flag judgment calls. They also want three worked examples to see it in action. 

  The user's deeper needs include reducing anxiety about uncertainty, providing political cover for "we don't know" decisions, and creating a defensible, transparent process. They might also be dealing with pressure from manufacturers, consumer groups, and policymakers. The procedure should make their reasoning clear and rigorous, even when evidence is weak.

  I'll structure the response into four sections: the procedure, its justification, worked cases, and limitations. For the procedure, I'll outline logical steps: define the question, map evidence, assess reliability, look for convergence, and make a decision based on imprecise probabilities. Key elements include using "evidence anchors" to represent uncertainty ranges and "decision thresholds" to guide actions without forcing false precision.

  For the worked cases: 
  1. The pesticide example has mixed evidence—some studies show harm, others don't. The procedure should lead to a precautionary recommendation due to consistent signals despite uncertainty.
  2. The food additive case has a large study where confounding undermines the signal. Here, the conclusion might be "no restriction" but with monitoring.
  3. For an "unknown" case, I'll pick something like a chemical with only one flawed study and no supporting evidence, showing why it's okay to admit ignorance.

  In the justification, I'll link each step to imprecise probability concepts like sets of probabilities and avoiding unjustified precision. The limitations section will acknowledge that judgment is still needed, especially in setting thresholds and weights, and that the procedure can't eliminate all uncertainty or political pressure.

  The challenge is balancing accessibility with rigor. I'll avoid stats jargon, use plain language, and focus on practical questions the team can discuss. The goal is to empower them to make transparent, honest calls without pretending certainty where none exists.
answer: |-
  ## Decision Procedure for Evidence-Based Guidance Under Uncertainty

  **Purpose:** To guide environmental health decisions when evidence is conflicting or insufficient to support a single probability estimate, using principles of imprecise probability to transparently represent uncertainty. The goal is a defensible recommendation (Restrict, Monitor/Research, No Restriction Needed, or Unknown) based on robust reasoning, not forced precision.

  **Input:** All relevant human epidemiological studies, animal toxicology studies, mechanistic data, exposure assessments, and relevant critiques.

  **Output:** A clear recommendation and a transparent summary of the reasoning, highlighting key uncertainties and judgment points.

  **Procedure:**

  1.  **Define the Specific Question:**
      *   *Ask:* "What specific adverse health outcome in what specific population are we concerned about, and at what exposure level?" (e.g., "Increased risk of liver cancer in agricultural workers from chronic occupational exposure to Chemical X?").
      *   *Sufficiency:* A precise, actionable question is defined. Refine if too vague.
      *   *Judgment Call:* Defining the scope (e.g., focusing on cancer vs. all health effects, occupational vs. general population).

  2.  **Map the Evidence Landscape:**
      *   *Ask:* "List all relevant studies. For each, note: Study Type (e.g., human cohort, rat bioassay, in vitro), Population/Species/Dose, Key Finding (effect size & confidence interval if available), Reported Limitations (bias, confounding, power), and Study Size/Quality Indicators."
      *   *Sufficiency:* All major studies identified and key characteristics cataloged in a simple table.
      *   *Judgment Call:* Deciding which studies are "relevant" and how to characterize "quality" initially.

  3.  **Assess Reliability & Direction:**
      *   *Ask:* For each study from Step 2: "Is the finding *suggestive* of harm (any positive effect), *suggestive of safety* (no effect or negative effect), or *uninformative* (e.g., fatally flawed design, irrelevant exposure) for our specific question? What is the *major limitation* casting doubt?"
      *   *Sufficiency:* Each study classified (Harm/Safety/Uninformative) and a primary limitation noted (e.g., "Small size, low power", "Residual confounding likely", "High dose not relevant", "Poor exposure assessment").
      *   *Judgment Call:* Classifying the study direction and weighing the severity of limitations.

  4.  **Identify Evidence Anchors (Imprecise Probability Bounds):**
      *   *Ask:* Based on Step 3: "What is the *most concerning credible lower bound* for increased risk suggested by any reliable evidence? What is the *most reassuring credible upper bound* suggested by reliable evidence indicating safety?"
      *   *Example:* The large epi study (Step 3: Harm, Limitation: Potential Confounding) shows RR=1.2 (95% CI: 1.05-1.4). Lower Bound Anchor ~1.05 (minimal plausible harm). A high-quality negative animal study (Step 3: Safety, Limitation: Species extrapolation) suggests Upper Bound Anchor might be near 1.0 (no effect). *Do not force a single number.*
      *   *Sufficiency:* A plausible lower bound (L) and upper bound (U) for the risk increase are identified. If *no* evidence suggests harm, L=1.0. If *no* evidence suggests safety for the outcome, U might be very high (unknown).
      *   *Judgment Call:* Interpreting confidence intervals/effect sizes to set credible L & U under study limitations. Deciding when evidence is too weak to set any bound.

  5.  **Assess Convergence & Inconsistency:**
      *   *Ask:* "Do the Anchors (L and U) overlap substantially with 'no effect' (RR=1.0)? Is there *any* plausible explanation (bias, confounding, exposure differences) that could shift *all* the 'harm' findings towards null/safety, or *all* the 'safety' findings towards harm? Or are the findings fundamentally incompatible?"
      *   *Sufficiency:* Determination of whether findings can be reconciled (convergence possible) or are truly conflicting/incompatible (inconsistency).
      *   *Judgment Call:* Evaluating plausibility of explanations resolving apparent conflict. Deciding if inconsistency is irreconcilable.

  6.  **Apply Decision Thresholds (Set Policy Context):**
      *   *Ask:* "Given the severity and irreversibility of the potential harm, the exposed population size/vulnerability, and the availability of alternatives, what is our agency's *tolerance for uncertainty*? Define thresholds:
          *   `T_action`: Lower bound (L) above which we feel action is warranted despite uncertainty.
          *   `T_safety`: Upper bound (U) below which we feel confident enough to state 'no restriction needed'.
          *   `T_unknown`: Range between `T_safety` and `T_action` where evidence is too uncertain for a clear call.
      *   *Example:* For a severe, irreversible cancer, `T_action` might be RR >= 1.10 (even with uncertainty), `T_safety` might be RR <= 1.02 (high confidence), leaving RR 1.03-1.09 as `T_unknown`.
      *   *Sufficiency:* Explicit `T_action`, `T_safety`, and `T_unknown` ranges defined based on policy context.
      *   *Judgment Call:* Setting the thresholds based on societal values, precaution, and agency mandate (THIS IS A MAJOR POLICY JUDGMENT).

  7.  **Compare Anchors to Thresholds & Make Recommendation:**
      *   *Ask:* "Where do our Evidence Anchors (L and U from Step 4) fall relative to our Thresholds?"
          *   If `L >= T_action`: Recommend **Restrict** (Harm signal strong enough despite uncertainty).
          *   If `U <= T_safety`: Recommend **No Restriction Needed** (Safety signal strong enough).
          *   If `L < T_action` AND `U > T_safety` AND the range `L` to `U` is *wide* OR findings are *inconsistent* (Step 5): Recommend **Unknown (Insufficient Evidence)**.
          *   If `L < T_action` AND `U > T_safety` BUT the range `L` to `U` is *narrow* AND findings *converge* (Step 5): Recommend **Monitor/Research** (Potential signal warrants attention but not restriction yet).
      *   *Sufficiency:* Clear recommendation chosen based on the logic above.
      *   *Judgment Call:* Interpreting "wide" vs. "narrow" range and strength of convergence.

  8.  **Document Rationale & Uncertainty:**
      *   *Ask:* "Summarize: Key studies & classifications (Step 3), Evidence Anchors (Step 4), Convergence assessment (Step 5), Thresholds (Step 6), and Recommendation (Step 7). Explicitly list all major judgment calls made throughout."
      *   *Sufficiency:* Transparent record justifying the decision, highlighting uncertainties and policy judgments.

  ---

  ## Why This Works (Imprecise Probability Foundation)

  1.  **Acknowledging Ignorance (Steps 1-4):** Traditional risk assessment often hides uncertainty by forcing a single probability distribution. Steps 1-4 force us to explicitly map the evidence *without* premature synthesis. Identifying Evidence Anchors (L and U) embodies the core imprecise probability idea: our knowledge defines a *set* of possible probabilities (any risk between L and U is plausible), not a single point estimate. This is honest when evidence is weak or conflicting.
  2.  **Distinguishing Conflict from Ambiguity (Step 5):** Imprecise probability handles both weak evidence (wide interval between L and U) and genuinely conflicting evidence (inconsistency where no single probability fits all data). Step 5 forces us to diagnose *why* the Anchors are wide – is it just sparse data, or fundamental disagreement? This determines if convergence is possible (Monitor/Research) or not (Unknown).
  3.  **Separating Science from Policy (Step 6):** A critical flaw in forcing a single probability is conflating scientific uncertainty with risk tolerance. Step 6 explicitly separates these. The Evidence Anchors (L, U) represent the *scientific state of knowledge* (the imprecise probability). The Thresholds (`T_action`, `T_safety`) represent the *policy decision rule* applied to that knowledge. This prevents scientific uncertainty from being inappropriately "solved" by policy preferences, and vice-versa.
  4.  **Structured Decision Under Uncertainty (Step 7):** Comparing the scientifically derived Anchors (the set of plausible risks) to the policy-defined Thresholds provides a clear, logical rule for the decision. Recommending "Unknown" when the Anchors span both thresholds (especially with inconsistency) is a valid outcome within imprecise probability, reflecting that the evidence genuinely doesn't support leaning towards either action or inaction. "Monitor/Research" acknowledges a signal within a *manageable* range of uncertainty that warrants attention.
  5.  **Transparency (Step 8):** Documenting judgments and the rationale behind Anchors and Thresholds makes the process auditable and defensible. It highlights where value judgments occur, fostering accountability and clearer communication about why a decision was made despite uncertainty.

  This procedure leverages imprecise probability by focusing on *bounding* the risk (Steps 3-4), diagnosing the *nature* of uncertainty (Step 5), and applying *explicit policy rules* (Steps 6-7) to those bounds, avoiding the pitfalls of false precision while still enabling actionable decisions.

  ---

  ## Worked Cases

  **Case 1: New Pesticide (Cancer Risk)**
  *   **Step 1:** Question: Increased liver cancer risk in agricultural workers from chronic occupational exposure?
  *   **Step 2:**
      *   Study A (Large Epi): Occupational cohort. RR=1.15 (95% CI: 1.02-1.30) for liver cancer. Limitation: Possible exposure misclassification, some unmeasured confounders.
      *   Study B (Small Epi 1): Case-control. RR=0.95 (0.70-1.30). Limitation: Small size (low power), poor exposure assessment.
      *   Study C (Small Epi 2): Cross-sectional. No sig. association. Limitation: Prevalence design weak for cancer, exposure timing uncertain.
      *   Study D (Animal): Rat bioassay. Increased liver tumors at very high doses (MTD). Limitation: High-dose relevance? Mode of Action unclear for humans.
  *   **Step 3:**
      *   A: Harm (positive effect). Limitation: Confounding possible.
      *   B: Safety (no effect). Limitation: Low power.
      *   C: Safety (no effect). Limitation: Weak design.
      *   D: Harm (liver damage/tumors). Limitation: High dose, species relevance.
  *   **Step 4 (Anchors):**
      *   *Lower Bound (L):* Most concerning credible lower bound? Study A CI lower limit: RR=1.02. Supported by mechanistic plausibility from Study D (liver damage). **L = ~1.02**
      *   *Upper Bound (U):* Most reassuring credible upper bound? Studies B & C show no effect, but are weaker. Could the true effect be null? Yes, confounding in Study A is plausible. Animal data suggests hazard but low-dose risk uncertain. **U = ~1.10** (plausible residual confounding could reduce observed effect).
  *   **Step 5 (Convergence):** Findings *can* converge. The "safety" studies (B, C) are weak. The "harm" signal (A, D) is consistent (human effect + animal hazard) despite limitations. Plausible explanation: True small risk exists; weak studies missed it. **Convergence Possible.**
  *   **Step 6 (Thresholds):** Severe outcome (cancer), occupational exposure (vulnerable group). High precaution warranted. Set `T_action` = RR >= 1.05; `T_safety` = RR <= 1.01; `T_unknown` = 1.02-1.04.
  *   **Step 7 (Recommendation):** L=1.02, U=1.10. L (1.02) < T_action (1.05) BUT U (1.10) > T_action (1.05). The Anchors straddle T_action. Range is moderately wide. *However*, convergence is assessed as possible, and the harm signal comes from the strongest study + supporting animal data. Given high precaution threshold, **Recommend RESTRICT** (e.g., lower exposure limits, enhanced PPE). Flag uncertainty.
  *   **Rationale:** Consistent signal across human epi (best available) and animal tox for a severe outcome, despite some negative studies. Precaution justifies action given plausible lower bound exceeding background risk tolerance. Manufacturer's "chance" argument less likely given consistency.

  **Case 2: Food Additive (Modest Health Risk)**
  *   **Step 1:** Question: Increased risk of cardiovascular disease (CVD) in general population from chronic dietary exposure to Additive Y?
  *   **Step 2:**
      *   Study X (Large Observational): Huge cohort. HR=1.08 (1.03-1.13) for CVD. Limitation: Observational, residual confounding likely.
      *   Mechanistic Data: No known biological pathway linking Additive Y to CVD.
      *   Analysis Note: Effect disappears when controlling for overall diet quality (processed food intake).
  *   **Step 3:**
      *   X: Harm (positive effect). Limitation: **Major - Confounding by diet quality highly likely**.
      *   Mechanistic: Uninformative (no data against, but none supporting).
  *   **Step 4 (Anchors):**
      *   *Lower Bound (L):* Is there a credible signal of harm? The observed effect (HR=1.08) vanishes when controlling for diet. The most plausible lower bound given major confounding is **L = 1.00** (no effect). No other evidence suggests harm.
      *   *Upper Bound (U):* The best evidence (Study X) suggests no effect after controlling for confounders. Decades of use without clear signal. **U = 1.02** (allowing for minimal residual uncertainty).
  *   **Step 5 (Convergence):** The single major "harm" finding is readily explained by confounding. No conflicting findings. **Convergence Possible** towards no effect.
  *   **Step 6 (Thresholds):** Modest effect size, common exposure. Moderate precaution. `T_action` = HR >= 1.15; `T_safety` = HR <= 1.05; `T_unknown` = 1.06-1.14.
  *   **Step 7 (Recommendation):** L=1.00, U=1.02. U (1.02) < T_safety (1.05). **Recommend NO RESTRICTION NEEDED.** Flag that the initial positive finding was likely due to confounding by diet quality. Recommend monitoring if new evidence arises. Consumer group push is noted but not supported by robust evidence.
  *   **Rationale:** The only sizable study showing harm is critically undermined by confounding. When adequately controlled, the signal disappears. No other evidence raises concern. The Anchors are tightly around 1.0 and well below the safety threshold.

  **Case 3: Genuinely "Unknown" (Industrial Solvent Z - Neurotoxicity)**
  *   **Step 1:** Question: Increased risk of early cognitive decline in factory workers exposed to Solvent Z?
  *   **Step 2:**
      *   Study P (Small Cross-Sectional): Factory workers vs. office workers. Small, statistically significant deficit on one cognitive test. Limitation: Small size (n=30 exposed), exposure not quantified, healthy worker effect likely, multiple testing.
      *   Study Q (Animal - Rat): High-dose inhalation. Transient changes in brain chemistry. No behavioral effects observed. Limitation: Very high dose, short duration, species relevance? No histopathology.
      *   Exposure Data: Solvent Z is volatile, occupational exposures likely varied but generally moderate. No good historical exposure records.
  *   **Step 3:**
      *   P: Harm (positive effect). Limitation: **Major - Small size, no exposure assessment, likely confounding (healthy worker), multiple comparisons.**
      *   Q: Uninformative (transient biochemical change at high dose, no functional effect). Limitation: Relevance to human chronic low-dose cognitive decline unclear.
  *   **Step 4 (Anchors):**
      *   *Lower Bound (L):* Is there a credible signal of harm? Study P is highly flawed - the effect could easily be noise or bias. The animal study doesn't support functional neurotoxicity. **No credible evidence sets L > 1.0. L = 1.0.**
      *   *Upper Bound (U):* Could there be a risk? The flawed human study *might* indicate something, or it might not. Animal data shows some biological activity. Complete safety cannot be guaranteed. **U is highly uncertain - could be 1.2? 2.0? Truly unknown.**
  *   **Step 5 (Convergence):** Evidence is sparse and weak. The single human study is unreliable. Animal data isn't directly relevant. Findings are neither consistent nor clearly conflicting – they are simply inadequate. **Insufficient evidence to assess convergence.**
  *   **Step 6 (Thresholds):** Cognitive decline is a significant concern. Moderate-high precaution. `T_action` = RR >= 1.20; `T_safety` = RR <= 1.05; `T_unknown` = 1.06-1.19 or wider uncertainty.
  *   **Step 7 (Recommendation):** L=1.0, U=Unknown (but plausibly >> T_action). L < T_action. U is completely unknown and could easily be > T_action. Range is extremely wide. Insufficient evidence to assess convergence. **Recommend UNKNOWN (INSUFFICIENT EVIDENCE).** Recommend targeted research (better epi study with exposure assessment, focused neurotox battery in animals).
  *   **Rationale:** One small, critically flawed human study and an ambiguous animal study. No basis to set any credible upper bound on risk (U is effectively unbounded upwards). No basis to claim safety (U > T_safety). The evidence is too thin and unreliable to support any recommendation for or against restriction. Pretending otherwise would be unscientific.

  ---

  ## What This Can't Do

  1.  **Eliminate Judgment:** This procedure structures judgment but doesn't remove it. Setting Evidence Anchors (Step 4), assessing Convergence (Step 5), and defining Thresholds (Step 6) are inherently judgmental. The procedure makes these explicit but doesn't automate them.
  2.  **Resolve Fundamental Conflicts:** If high-quality, well-designed studies yield truly incompatible results (e.g., multiple strong studies showing harm, multiple equally strong showing safety for the *same* outcome/exposure), the procedure will flag inconsistency and likely lead to "Unknown" or "Monitor." It won't magically determine who's "right." More research is the only solution.
  3.  **Define Thresholds for You:** Setting `T_action` and `T_safety` (Step 6) is a core policy/value judgment reflecting societal risk tolerance. The procedure requires your agency to define these thresholds explicitly *in advance* for different scenarios (severity, population). It can't dictate what level of uncertainty is acceptable for action.
  4.  **Handle Extreme Novelty or Complexity:** For entirely new chemicals with *no* data, or complex mixtures/interacting exposures, the initial Anchors may be so wide (e.g., L=1.0, U=100+) that only "Unknown" or highly precautionary "Restrict" (based on hazard analogies) are possible, offering little nuance. The procedure relies on *some* evidence to bound uncertainty.
  5.  **Overcome Political Pressure:** While "Unknown" is a scientifically honest conclusion, the procedure can't shield you from pressure to act (or not act) based on non-scientific factors. It provides a robust rationale for that conclusion, but defending it politically remains a separate challenge.
  6.  **Replace Expertise:** This is a framework, not a black box. It relies heavily on the team's toxicological and epidemiological expertise to evaluate study quality, limitations, and biological plausibility at every step. Garbage in (poor judgment in Steps 2-5) = garbage out.
