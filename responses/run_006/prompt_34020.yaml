answer: |-
  **The defenders of the Adams thesis ultimately end up in better shape by sacrificing the idea that indicative conditionals express standard propositions with truth conditions, thereby neutralizing Lewis's triviality proofs at their core.** Here's the breakdown:

  1.  **The Core Tension:** Lewis proved that if indicative conditionals (If A, then C) have truth conditions (making them propositions to which standard probability applies) *and* satisfy the Adams Thesis (P(A → C) = P(C|A)) *and* probability obeys the standard laws (Kolmogorov axioms) *and* conditionals embed freely in logical operations (like conjunction), then the only probability functions possible are *trivial* ones where P(A) = 0 or P(A) = 1 for every proposition A. This means no genuine uncertainty is possible.

  2.  **What Lewis's View Must Give Up:** To avoid triviality *while maintaining that conditionals are truth-apt propositions*, one must reject one of Lewis's other premises:
      *   **Reject the Adams Thesis:** Deny that P(A → C) generally equals P(C|A). This severs the intuitive link between conditionals and conditional probability, making conditionals behave very unlike how we ordinarily reason with them.
      *   **Restrict Probability Laws:** Modify standard probability theory (e.g., deny that probabilities are defined over a complete Boolean algebra or deny additivity over partitions containing conditionals). This is a major theoretical cost.
      *   **Restrict Embedding:** Severely limit or deny that conditionals can be conjoined, disjoined, or negated in the way Lewis's proofs require. This cripples the logic of conditionals.

  3.  **What the Adams Thesis Defender (e.g., Adams) Must Give Up:** To preserve the Adams Thesis and avoid triviality, the core sacrifice is:
      *   **Truth Conditions:** Deny that indicative conditionals express propositions with standard truth values (True/False). They are not the kind of thing that can be embedded in truth-functional compounds in the way Lewis assumes. The "probability" of a conditional isn't the probability *of its truth* but rather a measure of the *robustness of the inferential connection* between A and C (i.e., P(C|A) itself).

  4.  **Why Adams's Sacrifice Leads to Better Shape:**
      *   **Preserves Core Intuition:** It directly explains why we assess the probability of "If A, then C" by considering P(C|A). The conditional *expresses* that conditional probability; it doesn't *have* a probability of being true independently.
      *   **Avoids Triviality:** Lewis's proofs rely crucially on assigning probabilities to conditionals *as if they were truth-apt propositions* and embedding them. If conditionals aren't truth-apt, the proofs can't even get started. The "triviality" vanishes because the problematic probabilities over conditionals (like P((A → C) ∧ B)) aren't defined or behave non-standardly.
      *   **Explains Data:** It aligns with psychological evidence on how people reason with conditionals and avoids the bizarre predictions of trivial probability distributions.
      *   **Manages Limitations:** While giving up truth conditions and free embedding is a significant theoretical cost (e.g., making the logic non-truth-functional and complicating nested conditionals), proponents (like Adams himself, Ernest Adams, Dorothy Edgington, probabilistic semantics) have developed sophisticated non-truth-conditional logics and semantics (e.g., using assertability, acceptability, or probabilistic consequence relations) that handle many important uses of conditionals effectively for reasoning under uncertainty. The limitations are seen as reflecting the actual nature of indicative conditionals rather than a flaw in the theory.

  **Conclusion:** Lewis brilliantly exposed the deep incompatibility between truth-conditional semantics, standard probability, and the Adams Thesis. However, rejecting truth conditions for indicative conditionals, as Adams proponents do, provides a more coherent and empirically adequate account of how conditionals function in reasoning and communication under uncertainty. While it requires a non-classical logic and semantics, this cost is justified by preserving the central insight of the Adams Thesis and avoiding the devastating consequence of trivial probability. The Lewisian path of preserving truth conditions requires sacrificing either the Adams Thesis (its core appeal) or fundamental principles of logic/probability, leaving it less compelling overall.
