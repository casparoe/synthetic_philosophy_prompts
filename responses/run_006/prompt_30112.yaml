answer: |-
  Here’s your Q&A prep sheet, structured for maximum tactical advantage. I’ve prioritized objections by **likelihood + damage potential**, phrased as they’d be asked, with replies and vulnerability notes. The "nobody asks" question is at the end.

  ---

  ### **1. The Compositionality/Truth-Conditionality Challenge (Kripkean Philosopher of Language)**  
  *"If primary intensions aren't semantic values, how do they compose? And if they don't determine truth conditions relative to contexts, what explanatory role do they play beyond just being psychological heuristics? This seems like descriptivism without the semantics."*  

  **Reply (2-min):**  
  "Primary intensions *aren’t* compositional semantic values—they’re models of *epistemic access*. Their job is to track how a rational agent updates their beliefs across hypothetical scenarios *given their conceptual competence*. Compositionality applies to secondary intensions (the actual truth conditions). For example, grasping ‘water is clear’ involves knowing how sensory evidence (clarity) constrains the candidate referents across epistemic possibilities. This isn’t descriptivism because reference isn’t fixed by satisfying a description; it’s fixed by the actual world, while primary intensions track how we *rule out* worlds epistemically."  

  **Vulnerability:**  
  Soft if pressed on *how* primary intensions "model" epistemic connections without being truth-conditional. If asked, "But how does this *explain* linguistic behavior?", pivot to the informativeness of identities (Point 1 of your thesis).  

  ---

  ### **2. The Context vs. Knowledge Objection (Stalnakerian Philosopher of Language)**  
  *"I agree primary intensions model epistemic possibilities, but that’s just about context-sensitivity and assertability conditions. Why inflate this into a theory of a priori entailment? You’re conflating what a sentence means with how we use it to communicate."*  

  **Reply (2-min):**  
  "The primary intension *is* grounded in context for Stalnaker—but crucially, it’s fixed by *conceptual role*, not speaker intentions. When I say ‘water’ picks out clear, drinkable liquid in a scenario, that’s not contingent pragmatics; it’s an a priori constraint on what counts as coherent doubt. That’s why a complete physical description *entails* truths about water: it settles which epistemic possibilities are actual, collapsing primary to secondary intension. This *is* a route to a priori knowledge: once you grasp ‘water’ and ‘H₂O’, you can see that if the world is *this* way (pointing to physics), water *must* be H₂O."  

  **Vulnerability:**  
  If pressed on whether "conceptual role" is itself knowable a priori. Concede it’s idealization—but stress it’s no worse than Stalnaker’s "common ground".  

  ---

  ### **3. The Cognitive Significance Dodge (Soames-Style Critic)**  
  *"Why invoke primary intensions at all? Millianism + pragmatics handles informativeness: ‘water is H₂O’ surprises you because you didn’t *know* the contingent fact that the clear liquid is H₂O. All the work is done by metalinguistic knowledge or modes of presentation—nothing semantic."*  

  **Reply (2-min):**  
  "Pragmatics explains *why* we’re surprised, but not *what* we learn. When you discover water is H₂O, you learn a necessary truth—but your epistemic state changes because you eliminate worlds where ‘water’ refers to XYZ. Primary intensions *model* that elimination. Pragmatics can’t explain why the inference from ‘the clear, drinkable liquid in lakes is H₂O’ to ‘water is H₂O’ is a priori but non-trivial. Primary intensions capture that: they’re the *structure* of conceptual competence, not just ad hoc explanations of surprise."  

  **Vulnerability:**  
  If pushed: "But isn’t ‘structure of competence’ just tacit descriptivism?" Reply: "No—it’s about how concepts *relate to evidence*, not how they *define* reference."  

  ---

  ### **4. The Zombie Trap (Type-B Physicalist Philosopher of Mind)**  
  *"If primary intensions explain why zombies are conceivable but metaphysically impossible, doesn’t that *endorse* type-B physicalism? And if they don’t—if zombies are epistemically but not metaphysically possible—why mention consciousness? It seems you’re either helping my opponent or making your framework irrelevant to the hard problem."*  

  **Reply (2-min):**  
  "Primary intensions *explain* the epistemic gap without validating it. Zombies are conceivable because the primary intension of ‘consciousness’ isn’t a priori entailed by physics—we can’t rule out a world satisfying the physical description but lacking consciousness. But this doesn’t imply metaphysical possibility. The framework *undermines* the zombie argument by showing why conceivability (a product of primary intensions) can’t ground possibility (secondary intensions). I mention consciousness to show the model’s scope: it resolves the *apparent* tension in physicalism without taking sides on whether the gap is closable."  

  **Vulnerability:**  
  If asked: "But if primary intensions don’t entail consciousness, how is physicalism true?" Danger zone. Reply: "Physicalism is a metaphysical claim—primary intensions only show why deducing consciousness *feels* hard."  

  ---

  ### **5. The Internalist’s Evidence Worry (Epistemologist)**  
  *"You rely on ‘epistemic possibilities’ constrained by rational reflection. But if these possibilities float free of empirical evidence—like a priori ties between physics and consciousness—how is this compatible with internalism? It sounds like intellectual intuition."*  

  **Reply (2-min):**  
  "Epistemic possibilities *aren’t* evidence-free—they’re constrained by *what counts as evidence for a concept*. If ‘water’ is tied to sensory evidence (clear, liquid), then a scenario without that evidence *is* epistemically excluded. Rational reflection just makes explicit the evidential role built into concepts. This *is* internalist: it’s about accessible connections between thoughts. The a priori entailment from physics to water holds because physics settles the evidence-base for ‘water’ in the actual world."  

  **Vulnerability:**  
  If pressed: "How do we know the ‘evidential role’ a priori?" Concede it’s fallible and revisable (e.g., phlogiston).  

  ---

  ### **6. The Circularity Charge (Kripkean / Soames Ally)**  
  *"You say primary intensions explain a priori entailment. But to ‘grasp’ the primary intension of ‘consciousness’, don’t I already need to know what consciousness *is*? This is circular: you’re using the thing to explain itself."*  

  **Reply (2-min):**  
  "Grasping a primary intension isn’t knowing its referent—it’s knowing *how to evaluate it across scenarios*. For ‘consciousness’, it’s knowing that in a scenario, evidence of subjective reports/behavior constrains whether ‘consciousness’ applies. This doesn’t presuppose knowing what consciousness *is*; it presupposes knowing how we *reason about it*. The primary intension is a model of that reasoning skill."  

  **Vulnerability:**  
  If countered: "But reasoning about consciousness *requires* knowing what it is!" Stand firm: "We reason via proxies (e.g., ‘what it’s like’); primary intensions formalize that."  

  ---

  ### **7. The Idealization Reductio (Epistemologist / Internalist)**  
  *"If primary intensions require ‘ideal rational reflection’, how is this any better than Carnap’s intensions? Humans don’t have ideal access to epistemic possibilities—so how is this relevant to real cognition?"*  

  **Reply (2-min):**  
  "Idealization here is modest: like saying ‘competent speakers don’t contradict themselves’ in logic. We *approximate* primary intensions when we think, ‘If this isn’t water, what else could it be?’ It’s a model of our *implicit* cognitive constraints. Real agents can be wrong, but the framework explains why, upon learning chemistry, we *revise* our epistemic possibilities—not our concepts."  

  **Vulnerability:**  
  If pushed: "But doesn’t this make your a priori claims unfalsifiable?" Stress it’s a *model* for explaining cognitive puzzles, not an epistemology.  

  ---

  ### **8. The “Why Not Just Descriptivism?” Finale (Kripkean)**  
  *"If primary intensions are determined by conceptual roles tied to evidence (e.g., ‘water’ ↔ sensory features), how is this not just descriptivism? The only difference is you’ve hidden the description in the ‘epistemic model’."*  

  **Reply (2-min):**  
  "Descriptivism says reference is fixed *by satisfying a description*. Primary intensions don’t fix reference—the actual world does. They track how we *represent* the gap between evidence and reference. When we discover water is H₂O, we don’t *change* the primary intension; we learn which epistemic possibility is actual. Descriptivism can’t explain that stability."  

  **Vulnerability:**  
  If retorted: "But isn’t the ‘evidential role’ a description?" Nuance: It’s a condition for *considering* reference, not a reference-fixer.  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"If primary intensions are just ‘epistemic connections’, what is their metaphysical status? Are they psychologically real, abstract objects, or just useful fictions? And if they’re not ‘in the head’, how do they explain *my* cognition?"*  

  **Why it’s dangerous:**  
  It forces you to either (a) psychologize them (risking reduction to cognitive science, alienating philosophers), (b) platonize them (undermining naturalism), or (c) admit instrumentalism (making them seem ad hoc). No clean answer satisfies all factions.  

  ---

  ### **Preemptive Concession to Defuse Damage**  
  **In your talk, explicitly say:**  
  > *"To be clear: primary intensions are not truth-conditional semantic values. They don’t compose like Fregean senses, and they’re not what we assert when we speak. They are tools for modeling how conceptual competence constrains rational doubt across scenarios. This is why they’re not descriptivism: they don’t fix reference—they illuminate why reference-fixing *feels* informative."*  

  **Why this helps:**  
  It disarms the Kripkeans/Soamesians early by conceding the semantic point they’ll attack, redirecting focus to your epistemic thesis.  

  ---
  **Final Tip:** When answering, **label the objection** ("That’s the compositionality worry...") to control framing. If stuck, pivot to your two key examples: water/H₂O (for language) and consciousness (for mind). Good luck!
