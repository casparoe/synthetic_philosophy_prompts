  The user's explicit request is for a menu of readings—from literal to ambitious—and which ones actually pressure the skeptic. They also want to know which reading the professor likely relies on. But their deeper need might be to engage in more meaningful discussions, understand the argument's limitations, and feel equipped to challenge the professor's oversimplification.

