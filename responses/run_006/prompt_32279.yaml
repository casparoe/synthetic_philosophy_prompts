prompt: |-
  I'm in an epistemology seminar and my professor keeps using Moore's "Here is one hand" as a conversation-ender. Someone raises a skeptical worry about whether we can know anything about the external world, and he just holds up his hand and says "here is one hand" and moves on like it's a mic drop. I get that Moore was onto something, but the way it's deployed in the room it's become this slogan that's supposed to do all the work by itself. What are the distinct precise claims "here is one hand" could actually be making — from the literally just a hand observation to the ambitious philosophical thesis — and which of those readings genuinely put pressure on the skeptic? And which one is my professor probably relying on when he treats it as a discussion-stopper? I want a menu of readings I can actually bring to office hours.
