  so i've been going down a game theory rabbit hole lately because my roommate and i keep ending up in these dumb standoffs about chores. i read about common knowledge of rationality — like, we both know the other is rational, and we both know we both know it, all the way down. shouldn't that basically guarantee we coordinate on the best outcome? like if the payoff matrix is clear to both of us and we're both rational and know it, what else is there to mess up? feels like in real life we still don't coordinate even when the incentives are obvious.
