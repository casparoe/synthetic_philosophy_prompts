answer: |-
  Your question probes a foundational tension in criminal law and legal philosophy—one that sits at the intersection of causation, moral responsibility, and policy. The distinction between acts and omissions, and the law’s differential treatment of them, rests not on a naive theory of physical causation but on a *normative* framework that prioritizes individual liberty while recognizing exceptional moral duties. Let me unravel this step by step.

  ### The Causal Puzzle: Acts vs. Omissions
  At first glance, the identical outcomes—death by drowning—seem to demand identical moral and legal judgments. If causation is understood in purely *counterfactual* terms (the "but-for" test), your omission *is* a cause: but for your failure to throw the life preserver, the victim would not have drowned. Yet the law treats pushing someone in (an act) as homicide, while ignoring their struggle (an omission) is not criminal. This suggests the law is not relying solely on a factual theory of causation. Instead, it embeds a **moral and political judgment**: actively creating a new threat to life violates a fundamental prohibition, while failing to intervene in an *existing* threat does not, absent a special duty.

  The dominant view in legal doctrine is that omissions are not "causes" in the *legally relevant sense*. This is not a metaphysical claim (omissions *do* contribute to outcomes counterfactually) but a normative one: the law deliberately withholds causal status from omissions to preserve individual autonomy. As H.L.A. Hart and Tony Honororé argued in *Causation in the Law*, we ordinarily distinguish between "causing harm" and "failing to prevent it." The law reflects this intuition: it prohibits making the world worse but does not compel making it better.

  ### The Exceptions: Duties and the Unpacking of "Omission"
  The exceptions you note—parents, lifeguards, rescuers who abandon efforts—reveal the core logic. These cases involve a **preexisting duty** rooted in relationship, contract, or voluntary assumption of responsibility. Here, the omission is not a mere failure to act but a **breach of a specific obligation**. The parent who starves a child fails in a duty assumed by parenthood; the lifeguard breaches a contractual duty; the rescuer who abandons a victim creates reliance and then withdraws aid, worsening the situation.

  These exceptions are consistent with the underlying theory because they shift the normative baseline. In ordinary omissions, the victim’s peril arises independently. In duty-bound cases, the defendant’s role *creates an expectation of intervention*. The omission thus becomes a legally cognizable cause because the defendant is already embedded in a relationship that transforms passive failure into an active dereliction. The law isn’t incoherent—it’s drawing lines around **moral accountability**, not physical causation.

  ### What If Omissions Were Treated as "Full-Fledged Causes"?
  Adopting a view that omissions are causally equivalent to actions would revolutionize criminal law. Consider the implications:

  1.  **Expansion of Criminal Liability**: A general duty to rescue could emerge. Failing to save a drowning stranger, distribute food to the starving, or call for medical help might become crimes. Liability would depend on capacity to act (e.g., "could easily have thrown the life preserver"), collapsing the act/omission distinction.
    
  2.  **Practical and Epistemic Challenges**: Proving causation would become fraught. How do we verify that *this specific omission* caused death? (Would another passerby have intervened? Was rescue truly feasible?) Courts would drown in counterfactuals. Intent would also be harder to establish—negligence might replace *mens rea* as the dominant standard.

  3.  **Moral and Political Costs**: Such a system could erode personal liberty. Forcing aid imposes positive duties, conflicting with liberal values of negative rights (freedom *from* interference). It might also encourage risk aversion—why swim in public waters if failure to rescue a stranger risks prosecution?

  4.  **The "Floodgates" Problem**: If all omissions are causes, where do we draw the line? Failing to donate a kidney? To intervene in a crime across town? The law might retreat to "reasonable" rescue standards, but this reintroduces the very line-drawing the equivalence sought to avoid.

  ### Conclusion: Causation as a Normative Construct
  The law’s act/omission distinction ultimately presupposes that causation is not a brute fact but a **tool for allocating responsibility**. It prioritizes preventing active harm over compelling altruism, reflecting a societal choice to limit coercion. The exceptions prove the rule: where special duties exist, the moral calculus shifts, and omissions become blameworthy. This framework is coherent but value-laden—it protects autonomy at the cost of potentially counterintuitive outcomes (e.g., no penalty for callous inaction). 

  To treat omissions as causally equivalent would demand a radical reorientation toward collectivist ethics, where we are all keepers of one another. Whether that is desirable is a question of political philosophy, not causation alone. Your unease is philosophically astute: it highlights the gap between law’s pragmatic boundaries and morality’s expansive demands. The law, in the end, is not a mirror of metaphysics but a negotiation between competing goods—liberty, duty, and the sanctity of life.
