prompt: |-
  I'm a high school student, and something has been bothering me since we covered criminal law in my civics class. We learned that in most jurisdictions, there is no general duty to rescue — if you see a stranger drowning and you do nothing, you haven't committed a crime, even if you could easily have thrown them a life preserver. But if you push someone into the water and they drown, that is homicide. The outcome is identical, and in both cases you could have prevented the death. The only difference is whether you acted or failed to act. Yet the law draws a sharp line between them. What theory of causation does this practice presuppose? It looks as though the law is committed to the idea that omissions either are not causes at all, or are causes of a fundamentally different kind than actions — causes that do not ground criminal liability in the same way. But then the law also recognizes exceptions: parents who starve their children, lifeguards who ignore a drowning swimmer, a person who has already started rescuing someone and then abandons the effort. In these cases, an omission can be a crime. Are these exceptions consistent with whatever theory of causation underlies the general rule, or is the law simply incoherent on this point? What would the law have to look like if we instead adopted the view that omissions are full-fledged causes, on a par with actions? I would like you to approach this as a philosopher of law who specializes in causation and moral responsibility. Please think through the question carefully, and write your answer in continuous prose only — no headings, bullet points, bold text, or tables, just the way you would write an essay or a letter.
