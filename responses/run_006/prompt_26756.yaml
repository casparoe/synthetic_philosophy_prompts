  For coherence, the key is distinguishing causation-in-fact from proximate cause. The drowning example: Not throwing the preserver *is* a but-for cause of death (but-for your inaction, they'd live), but law inserts a filter: "Did they *owe* intervention?" That filter isn't about causality; it's moral/policy. 

