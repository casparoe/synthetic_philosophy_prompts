prompt: |-
  I run a small undergrad seminar on rationality and probability — about 18 students, one 75-minute session — and next week I want to do Kelly betting and geometric rationality. I want a live betting game that makes them feel the point before I name it: a bet can have positive expected value and still ruin you if you size it wrong, and maximizing expected value each round is not the same as maximizing the growth of your bankroll. No lecture up front, and they shouldn't hear 'Kelly criterion' or 'geometric expectation' until after the game.

  Design the activity for me. The setup I'm imagining is: everyone starts with 100 chips; each round I offer an even-money bet on a biased coin that comes up heads with probablity 0.6 (I can simulate it with a ten-sided die or a shuffled deck, whatever feels transparent); each person writes down what fraction of their current chips to stake; one shared flip applies to everyone; we run about 30 rounds. The bet pays +20% of the stake in expectation per round, so all-in is the EV-maximizing move — which is exactly the trap I want them to walk into. Winner gets a chocolate bar, no real money.

  Give me the exact rules and materials; a timeline for the 75 minutes; and how to handle 18 people logistically — do they write fractions secretly, do I show a running leaderboard or not, and does the leaderboard help or hurt the lesson? Then give me the debrief: what to walk through and in what order, and how to map what actually happened onto the formal ideas — volatility drag, log wealth, why the optimal fraction here is 20%, why all-in maximizes expectation but sends your bankroll toward zero almost surely. Also tell me what will predictably go wrong the first time I run it — I'm guessing half the class busts out early and checks out, and a couple of students bet tiny and coast — and what to do about each. Be honest about what the activity can't reproduce: I suspect thirty rounds is too short for the growth-rate logic to actually show up in outcomes, but say what you think and what the facilitator has to supply in words afterwards.

  Keep it to 800 words max.
reasoning: |-
  Okay, the user is running a small undergraduate seminar on rationality and probability with 18 students. They want to create an interactive activity to demonstrate Kelly betting and geometric rationality without lecturing upfront. The key goal is to make students experience how betting the wrong fraction can ruin them even with positive expected value, and how maximizing expected value per round isn't the same as maximizing long-term growth.

  The user's proposed setup involves students starting with 100 chips, betting on a biased coin (60% heads) over 30 rounds. I need to refine this into a concrete plan. The challenge is making the lesson visceral while handling logistical issues like 18 students writing bets and avoiding early dropouts.

  For materials, I'll suggest using a 10-sided die for transparency (1-6 heads, 7-10 tails), with payouts at even money. Each student will need a betting sheet to record fraction and resulting chips after each round. 

  Logistics are crucial with 18 students. I'll recommend public betting to create peer pressure - students write fractions on small boards everyone can see. This amplifies the emotional impact when aggressive bettors bust out. A leaderboard after round 10 will heighten engagement but also tempt imitation, which actually serves the lesson when copycats crash later.

  The timeline needs to fit 75 minutes: 10 min setup, 40 min gameplay (30 rounds at ~80 sec/round), 25 min debrief. Fast pacing is key - use a timer for bets, calculate chips during the coin flip. 

  Predictable problems: Many will go all-in (EV-maximizing trap) and bust early. Some will underbet and preserve chips but lose engagement. Solutions: Let busted students become "VCs" backing survivors with 50 chips, keeping them involved. For underbetters, emphasize in debrief that extreme conservatism has costs too. 

  The debrief is where the lesson crystallizes. I'll structure it: first let students share strategies, then reveal who won (likely a moderate better). Contrast expectation vs. reality - all-in has high EV but near-certain bankruptcy. Introduce volatility drag visually, then explain log wealth and geometric mean. Finally name Kelly and derive f* = (bp - aq)/ab = (1*0.6 - 1*0.4)/1*1 = 0.2.

  What the activity can't show: 30 rounds are too few for optimal growth to dominate visibly. I need to be honest here - the winner might be lucky, not optimal. Emphasize in debrief that we're sampling one path, and show simulated distributions. The facilitator must stress that Kelly optimizes the median outcome, not guarantees winning.

  Core insight to convey: Betting all-in maximizes expected chips but minimizes probable chips. The chocolate bar winner will likely be someone who bet around 20%, demonstrating that survival enables compounding.
answer: |-
  ### **Activity Design: "The Compounder's Trap"**

  **Materials**: 
  - 18 dry-erase boards + markers (for public betting)
  - 1 ten-sided die (1-6 = Heads, 7-10 = Tails; p=0.6)
  - Scoreboard (for top 5 chips after Rounds 10, 20, 30)
  - Timer

  **Rules**:
  1. Start: 100 chips each.
  2. Each round: 
     - Students write **fraction of current chips to bet** (0% to 100%) on boards and hold up *publicly*.
     - Roll die. **Heads: win +100% of stake. Tails: lose stake.** (Even-money bet, 20% edge)
     - Update chips: `New chips = Old chips ± Stake`
  3. **Bankruptcy**: Players at ≤0 chips sit out but can rejoin with 50 chips if they win a "side bet" (predict others' bets).
  4. Play **30 rounds** (pace: 1 round/80 seconds).

  **Logistics**:
  - **Public betting** (hold up boards): Creates peer pressure to go all-in, mimics real-time decision stress.
  - **Leaderboard** (show top 5 after Rounds 10/20/30): *Helps* lesson by showing aggressive leaders crash later. Display only ranks, not exact chips to avoid distraction.

  **Timeline (75 min)**:
  - **0:00-0:10**: Setup. Distribute boards, explain rules. *Emphasize: "Winner gets chocolate. Bet smart."*
  - **0:10-0:50**: **Gameplay (30 rounds)**. Fast pace: 
    - 20 sec: Decide fraction, hold up board. 
    - 10 sec: Roll die, announce outcome. 
    - 50 sec: Update chips (students self-calculate; circulate to verify).
  - **0:50-0:60**: **Debrief prep**: Students graph their chip trajectory. Share reactions.
  - **0:60-1:15**: **Debrief** (key sequence below).

  ---

  ### **Debrief Plan**
  **Goals**: Link lived experience to volatility drag, geometric growth, and optimal fraction.

  1. **Reactions first** (5 min):
     - "Who busted? Who bet tiny? Who led early but crashed?" 
     - "Did anyone feel tempted to copy the leader?"

  2. **The winner reveal** (2 min):
     - Award chocolate. *Likely winner: Moderate better (10-40%) who avoided ruin.* Contrast with early leaders.

  3. **The core paradox** (5 min):
     - *Q: "Was betting all-in rational? Why?"*  
       - Yes: Each bet has +20% EV (`0.6*1 + 0.4*(-1) = 0.2`).  
       - But: Show math: After 30 rounds, P(ruin) ≈ 1. All-in *maximizes expected chips* but *minimizes P(>0 chips)*.  

  4. **Volatility drag** (5 min):
     - Sketch two paths:  
       - Aggressive: +60%, -40%, +60%, -40%... → net decline.  
       - Moderate: +20%, -20%, +20%, -20%... → net growth.  
     - *Key: Losing 50% requires +100% to recover. Volatility erodes capital.*

  5. **Geometric growth & Kelly** (8 min):
     - "We care about *multiplying* wealth, not adding."  
       - Optimal growth: Maximize **log(wealth)**.  
       - Show: `Growth rate = p*ln(1+f) + q*ln(1-f)`  
       - Maximize by setting derivative =0 → `f* = p - q = 0.6 - 0.4 = 0.2` (20%).  
     - Name "Kelly criterion": Balances growth vs. survival.

  ---

  ### **Predictable Problems & Fixes**
  1. **Half the class busts early** → *Fix*:  
     - Let bankrupt players predict others' bets for "VC funding" (50 chips). They stay engaged, learn from others' mistakes.

  2. **Conservative players (1-5% bets) "coast" but lose** → *Fix*:  
     - Debrief: "Did tiny bets feel safe? But could you catch up?" Show math: 1% bet → growth ≈0.2% per round (too slow).

  3. **30 rounds too short for growth to dominate** → *Fix*:  
     - Acknowledge: "Luck dominates short-term. One game ≠ probability."  
     - Show simulation: Display 10,000 runs of 100 rounds. Optimal (20%) maximizes *median* wealth, while all-in → 99% ruin.

  **What the activity can't show**:  
  - True long-run growth dominance (requires 100+ rounds).  
  - Why log(wealth) is the "rational" utility function (needs cognitive psychology framing).

  **Facilitator's cheat sheet**:  
  - Hammer: *"Maximizing expected value ≠ maximizing expected growth. Survival lets compounding work."*  
  - Ultimate insight: **Betting optimally feels too conservative... until you see the simulations.**

  ---
  **Final tip**: Run a quick practice round with fake bets to iron out confusion. Stay strict on timing—energy comes from pace!
