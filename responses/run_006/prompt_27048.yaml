answer: |-
  Here are five punchy arguments against dismissing the St. Petersburg paradox as "solved" by bounded utility:

  1.  **Bounded utility is an *ad hoc* fix, not a solution:** It arbitrarily declares the problem impossible (infinite utility can't exist) instead of explaining why the infinite expected value calculation feels irrational *even if* we imagine genuinely unbounded value.
  2.  **It reveals a deep flaw in how EU handles tail risks:** The paradox shows EU maximization demanding acceptance of gambles offering near-certain ruin for a vanishingly small chance of astronomical gain, which seems fundamentally irrational regardless of utility bounds.
  3.  **The inconsistency with Pascalian reasoning is glaring:** Rationalists readily bound utility to avoid St. Petersburg payoffs but often resist bounding probabilities to avoid Pascalian infinities, exposing a double standard in handling "inconvenient" infinities within the EU framework.
  4.  **Real agents consistently reject the gamble, revealing a descriptive failure:** Humans (and sensible agents) intuitively assign the St. Petersburg gamble finite, modest value despite its infinite EU, suggesting EU is a poor descriptive model of rational preference under extreme uncertainty.
  5.  **Alternatives *do* resolve it without arbitrary bounds:** Models like risk-weighted expected utility or those incorporating ambiguity aversion naturally assign the St. Petersburg game a high but finite value, offering coherent explanations *within* a decision theory framework, not just declarations of impossibility.
